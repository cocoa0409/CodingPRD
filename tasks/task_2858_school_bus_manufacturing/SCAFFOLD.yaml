# PRD Benchmark Seed Tables — School Bus Manufacturing
# Generated by skills/prd-bench-scaffold-generator (§1.0–§1.7).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  2858. School Bus Manufacturing (school bus manufacturer): specification variation by state with
  seating, lighting, mirror and safety equipment differences, body-on-chassis construction with joint
  strength and rollover protection requirements, propulsion options across diesel, propane and electric
  with battery integration and range validation, bid response for district and cooperative purchases
  with detailed specification compliance, production slotting against delivery deadlines tied to the
  school year calendar, quality testing including brake, emergency exit and electrical system
  verification, dealer network delivery, driver training and parts support, recall and safety campaign
  execution across districts

domain_name: school-bus-manufacturing
api_prefix: ""            # flat topology: peer collections at the root (/bids, /bus-units, /build-slots, ...)

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a root collection linked by explicit foreign keys; no nested URL ownership chains
  # except the two sub-resource creation endpoints (POST /contract-orders/{id}/units,
  # POST /bids/{id}/revisions) whose children are still addressed at their own root collections.

  state_machine_shape: parallel
  # BusUnit carries three independent state dimensions (production_status x certification_status x
  # service_status); Bid is cyclic (DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT);
  # QualityTest is branching (SCHEDULED -> {PASSED, FAILED} with divergent side-effect sets);
  # RecallCampaign and ContractOrder are compound (state derived from children).

  relationship_patterns:
    - one_to_many          # ContractOrder -> BusUnit, RecallCampaign -> RemedyTask
    - self_referential     # StateSpecProfile.superseded_by_profile_id -> StateSpecProfile.id
    - cross_aggregate      # BuildSlot spans ProductionLine and BusUnit aggregates; RemedyTask spans campaign/unit/dealer

  role_model: segregation_of_duties
  # The SalesEngineer who submitted a Bid may not be the identity that awards it, and the
  # QualityInspector identity that recorded a unit's passing tests may not be the identity that
  # certifies that unit.

  consistency_model: immediate

difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:

  - name: StateSpecProfile
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code the profile legislates for"
        constraints: "exactly 2 uppercase letters"
      - name: school_year
        type: string
        source: input
        description: "School year the profile applies to, e.g. 2026-2027"
        constraints: "pattern YYYY-YYYY"
      - name: status
        type: enum
        source: system
        description: "Publication lifecycle of the profile"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED}"
      - name: min_seat_capacity
        type: integer
        source: input
        description: "Minimum passenger seat count the state mandates"
        constraints: ">= 1"
      - name: requires_eight_lamp_system
        type: boolean
        source: input
        description: "State mandates the 8-lamp amber/red warning system"
        default: false
      - name: requires_crossing_arm
        type: boolean
        source: input
        description: "State mandates a front crossing arm"
        default: false
      - name: required_mirror_config
        type: enum
        source: input
        description: "Mirror package the state mandates"
        default: STANDARD
        constraints: "one of {STANDARD, CROSSVIEW, CROSSVIEW_HEATED}"
      - name: requires_lap_shoulder_belts
        type: boolean
        source: input
        description: "State mandates lap-shoulder belts at every seating position"
        default: false
      - name: min_emergency_exit_count
        type: integer
        source: input
        description: "Minimum number of emergency exits (roof hatches, side doors, push-out windows)"
        constraints: ">= 1"
      - name: min_joint_strength_kn
        type: number
        source: input
        description: "Minimum body-on-chassis joint strength in kilonewtons"
        constraints: "> 0, one decimal place"
      - name: requires_rollover_protection
        type: boolean
        source: input
        description: "State mandates rollover reinforcement and a ROLLOVER quality test"
        default: false
      - name: requires_joint_strength_test
        type: boolean
        source: input
        description: "State mandates a destructive JOINT_STRENGTH quality test before certification"
        default: false
      - name: required_route_range_mi
        type: number
        source: input
        description: "Minimum derated route range in miles the state accepts for the school-year fleet"
        constraints: "> 0, one decimal place"
      - name: terrain_class
        type: enum
        source: input
        description: "Terrain class used as the range derating divisor"
        default: FLAT
        constraints: "one of {FLAT, ROLLING, MOUNTAIN}"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant the profile was published; null while DRAFT"
      - name: superseded_by_profile_id
        type: string
        source: system
        description: "FK -> StateSpecProfile.id; the newer PUBLISHED profile that superseded this one, null otherwise"

  - name: BusModel
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: model_code
        type: string
        source: input
        description: "Unique body model code"
        constraints: "unique across BusModel"
      - name: body_class
        type: enum
        source: input
        description: "School bus body class"
        constraints: "one of {TYPE_A, TYPE_C, TYPE_D}"
      - name: base_seat_capacity
        type: integer
        source: input
        description: "Seat count included in the base body price"
        constraints: ">= 1"
      - name: base_emergency_exit_count
        type: integer
        source: input
        description: "Emergency exits included in the base body price"
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: "Base body-on-chassis price in cents"
        constraints: "> 0"
      - name: body_joint_strength_kn
        type: number
        source: input
        description: "Certified body-to-chassis joint strength of the unreinforced body, in kilonewtons"
        constraints: "> 0, one decimal place"
      - name: max_battery_bays
        type: integer
        source: input
        description: "Number of under-floor battery bays the body can carry"
        constraints: ">= 0"
      - name: curb_weight_lb
        type: integer
        source: input
        description: "Curb weight in pounds; drives the ROLLOVER test minimum roof-crush load"
        constraints: "> 0"

  - name: PropulsionPackage
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: package_code
        type: string
        source: input
        description: "Unique propulsion package code"
        constraints: "unique across PropulsionPackage"
      - name: compatible_bus_model_id
        type: string
        source: input
        description: "FK -> BusModel.id; the only body model this package may be quoted or built on"
      - name: propulsion_type
        type: enum
        source: input
        description: "Propulsion family"
        constraints: "one of {DIESEL, PROPANE, ELECTRIC}"
      - name: option_price_cents
        type: integer
        source: input
        description: "Delta price of the propulsion option in cents"
        constraints: ">= 0"
      - name: battery_pack_count
        type: integer
        source: input
        description: "Number of battery packs the package installs; 0 for liquid-fuel packages"
        default: 0
        constraints: ">= 0"
      - name: usable_kwh
        type: number
        source: input
        description: "Usable battery energy in kWh; 0 for liquid-fuel packages"
        default: 0
      - name: nominal_consumption_kwh_per_mi
        type: number
        source: input
        description: "Nameplate traction consumption in kWh per mile; 0 for liquid-fuel packages"
        default: 0
      - name: hvac_load_kw
        type: number
        source: input
        description: "Continuous HVAC electrical load in kW used in the derated-range formula"
        default: 0
      - name: fuel_capacity_gal
        type: number
        source: input
        description: "Usable tank capacity in gallons; 0 for electric packages"
        default: 0
      - name: rated_mpg
        type: number
        source: input
        description: "Rated miles per gallon; 0 for electric packages"
        default: 0
      - name: cold_weather_derate_pct
        type: number
        source: input
        description: "Fractional energy loss applied in the derated-range formula"
        constraints: ">= 0 and < 1, four decimal places"
      - name: reserve_floor_pct
        type: number
        source: input
        description: "Fraction of stored energy held back as reserve in the derated-range formula"
        constraints: ">= 0 and < 1, four decimal places"

  - name: Solicitation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: solicitation_code
        type: string
        source: input
        description: "Buyer's solicitation identifier"
      - name: buyer_type
        type: enum
        source: input
        description: "Whether the buyer is a single district or a purchasing cooperative"
        constraints: "one of {DISTRICT, COOPERATIVE}"
      - name: buyer_name
        type: string
        source: input
        description: "District or cooperative name"
      - name: spec_profile_id
        type: string
        source: input
        description: "FK -> StateSpecProfile.id; the profile the buyer cited in the solicitation packet"
      - name: state_code
        type: string
        source: computed
        description: "Denormalised copy of the cited profile's state_code, frozen at creation"
      - name: school_year
        type: string
        source: computed
        description: "Denormalised copy of the cited profile's school_year, frozen at creation"
      - name: unit_count
        type: integer
        source: input
        description: "Number of buses solicited"
        constraints: ">= 1"
      - name: required_delivery_date
        type: string
        source: input
        description: "Latest acceptable delivery date, tied to the school-year calendar (ISO date)"
      - name: price_cap_cents_per_unit
        type: integer
        source: input
        description: "Per-unit price ceiling the buyer published"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Solicitation lifecycle"
        default: OPEN
        constraints: "one of {OPEN, CLOSED, AWARDED}"

  - name: Bid
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id; the solicitation this bid responds to"
      - name: bus_model_id
        type: string
        source: input
        description: "FK -> BusModel.id; body model offered"
      - name: propulsion_package_id
        type: string
        source: input
        description: "FK -> PropulsionPackage.id; propulsion option offered"
      - name: evaluated_spec_profile_id
        type: string
        source: system
        description: "FK -> StateSpecProfile.id; the profile the most recent compliance evaluation used"
      - name: unit_count
        type: integer
        source: input
        description: "Number of buses offered; must equal the solicitation's unit_count"
        constraints: ">= 1"
      - name: offered_seat_capacity
        type: integer
        source: input
        description: "Seat positions offered per bus"
        constraints: ">= 1"
      - name: offered_emergency_exit_count
        type: integer
        source: input
        description: "Emergency exits offered per bus"
        constraints: ">= 1"
      - name: offered_mirror_config
        type: enum
        source: input
        description: "Mirror package offered"
        constraints: "one of {STANDARD, CROSSVIEW, CROSSVIEW_HEATED}"
      - name: offered_lap_shoulder_belts
        type: boolean
        source: input
        description: "Lap-shoulder belts offered at every seating position"
      - name: offered_eight_lamp_system
        type: boolean
        source: input
        description: "8-lamp warning system offered"
      - name: offered_crossing_arm
        type: boolean
        source: input
        description: "Front crossing arm offered"
      - name: offered_rollover_reinforcement
        type: boolean
        source: input
        description: "Rollover reinforcement package offered"
      - name: offered_joint_strength_kn
        type: number
        source: computed
        description: "model.body_joint_strength_kn plus ROLLOVER_JOINT_BONUS_KN when rollover reinforcement is offered"
      - name: nominal_range_mi
        type: integer
        source: computed
        description: "Nameplate range variant of the range_validation calculation"
      - name: derated_route_range_mi
        type: number
        source: computed
        description: "Derated route range variant of the range_validation calculation, one decimal place"
      - name: provisional_unit_price_cents
        type: integer
        source: computed
        description: "Provisional variant of bid_unit_price, recomputed on create and on every revision"
      - name: spec_compliance_status
        type: enum
        source: computed
        description: "Outcome of spec_compliance_evaluation against evaluated_spec_profile_id"
        constraints: "one of {CONFORMING, EXCEPTIONS_TAKEN, NONCONFORMING}"
      - name: exception_count
        type: integer
        source: computed
        description: "Number of spec items the offered configuration fails to meet"
      - name: unmet_mandatory_items
        type: array
        source: computed
        description: "Sorted list of unmet mandatory spec item keys (empty when none)"
      - name: revision_round
        type: integer
        source: system
        description: "Index of the newest non-superseded BidRevision"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Bid lifecycle (cyclic through REVISION_REQUESTED)"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, REVISION_REQUESTED, AWARDED, REJECTED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit; null while never submitted"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesEngineer who last submitted; compared against the awarding identity"

  - name: BidRevision
    parent: Bid
    common_fields: false
    kind: event
    fields:
      - name: bid_id
        type: string
        source: system
        description: "FK -> Bid.id; the bid this revision snapshots"
      - name: round_index
        type: integer
        source: system
        description: "0 for the revision minted with the bid, then 1, 2, 3 for each subsequent revision"
      - name: offered_seat_capacity
        type: integer
        source: input
        description: "Seat positions in this revision"
      - name: offered_emergency_exit_count
        type: integer
        source: input
        description: "Emergency exits in this revision"
      - name: offered_mirror_config
        type: enum
        source: input
        description: "Mirror package in this revision"
        constraints: "one of {STANDARD, CROSSVIEW, CROSSVIEW_HEATED}"
      - name: offered_lap_shoulder_belts
        type: boolean
        source: input
        description: "Lap-shoulder belts in this revision"
      - name: offered_eight_lamp_system
        type: boolean
        source: input
        description: "8-lamp warning system in this revision"
      - name: offered_crossing_arm
        type: boolean
        source: input
        description: "Crossing arm in this revision"
      - name: offered_rollover_reinforcement
        type: boolean
        source: input
        description: "Rollover reinforcement in this revision"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "bid_unit_price provisional variant for this revision's configuration"
      - name: is_superseded
        type: boolean
        source: system
        description: "True once a later revision exists for the same bid"
        default: false
      - name: note
        type: string
        source: input
        description: "Free-text revision note"

  - name: ContractOrder
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bid_id
        type: string
        source: system
        description: "FK -> Bid.id; the awarded bid"
      - name: spec_profile_id
        type: string
        source: system
        description: "FK -> StateSpecProfile.id; the PUBLISHED profile in force at award, used for the awarded configuration"
      - name: unit_count
        type: integer
        source: system
        description: "Copied from the awarded bid"
      - name: promised_delivery_date
        type: string
        source: input
        description: "Delivery date the manufacturer commits to (ISO date)"
      - name: awarded_unit_price_cents
        type: integer
        source: computed
        description: "final_award variant of bid_unit_price (spec-upgraded then escalated)"
      - name: total_contract_cents
        type: integer
        source: computed
        description: "Output of the contract_total calculation"
      - name: awarded_seat_capacity
        type: integer
        source: computed
        description: "Seat positions after upgrading the offered configuration to the award-time profile"
      - name: awarded_emergency_exit_count
        type: integer
        source: computed
        description: "Emergency exits after the award-time upgrade"
      - name: awarded_mirror_config
        type: enum
        source: computed
        description: "Mirror package after the award-time upgrade"
        constraints: "one of {STANDARD, CROSSVIEW, CROSSVIEW_HEATED}"
      - name: awarded_lap_shoulder_belts
        type: boolean
        source: computed
        description: "Lap-shoulder belts after the award-time upgrade"
      - name: awarded_eight_lamp_system
        type: boolean
        source: computed
        description: "8-lamp system after the award-time upgrade"
      - name: awarded_crossing_arm
        type: boolean
        source: computed
        description: "Crossing arm after the award-time upgrade"
      - name: awarded_rollover_reinforcement
        type: boolean
        source: computed
        description: "Rollover reinforcement after the award-time upgrade"
      - name: awarded_joint_strength_kn
        type: number
        source: computed
        description: "model.body_joint_strength_kn plus ROLLOVER_JOINT_BONUS_KN when awarded_rollover_reinforcement is true"
      - name: created_unit_count
        type: integer
        source: computed
        description: "Count of BusUnit rows with this contract_order_id"
        default: 0
      - name: delivered_unit_count
        type: integer
        source: computed
        description: "Count of this order's units with production_status DELIVERED"
        default: 0
      - name: at_risk_unit_count
        type: integer
        source: computed
        description: "Output of the delivery_posture calculation's at-risk term"
        default: 0
      - name: delivery_posture
        type: enum
        source: computed
        description: "Derived schedule posture, recomputed only at the transitions listed in §1.2"
        default: ON_TRACK
        constraints: "one of {ON_TRACK, AT_RISK, BREACHED}"
      - name: liquidated_damages_cents
        type: integer
        source: computed
        description: "Output of the liquidated_damages calculation; 0 unless delivery_posture is BREACHED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Order lifecycle; FULFILLED when every unit is DELIVERED"
        default: ACTIVE
        constraints: "one of {ACTIVE, FULFILLED}"

  - name: ProductionLine
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: line_code
        type: string
        source: input
        description: "Unique production line code"
        constraints: "unique across ProductionLine"
      - name: plant_code
        type: string
        source: input
        description: "Plant the line sits in; must match the plant_code of any TestBay used for its units"
      - name: supported_body_classes
        type: array
        source: input
        description: "Body classes the line is tooled for; each element one of {TYPE_A, TYPE_C, TYPE_D}"
        constraints: "non-empty"
      - name: horizon_slot_day_capacity
        type: integer
        source: input
        description: "Total slot-days the line may hold committed across the program horizon"
        constraints: ">= 1"
      - name: changeover_buffer_days
        type: integer
        source: input
        description: "Idle days required between two consecutive slots of different propulsion_type"
        constraints: ">= 0"
      - name: committed_slot_days
        type: integer
        source: computed
        description: "Output of the line_capacity_ledger calculation"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Line availability; only a RUNNING line may take a slot commit"
        default: RUNNING
        constraints: "one of {RUNNING, DOWN_FOR_MAINTENANCE}"

  - name: BuildSlot
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: production_line_id
        type: string
        source: input
        description: "FK -> ProductionLine.id; the line the slot occupies"
      - name: bus_unit_id
        type: string
        source: input
        description: "FK -> BusUnit.id; the unit the slot builds"
      - name: start_date
        type: string
        source: input
        description: "First day of the occupation, inclusive (ISO date)"
      - name: end_date
        type: string
        source: input
        description: "Day after the last day of the occupation, exclusive (ISO date)"
      - name: slot_days
        type: integer
        source: computed
        description: "end_date minus start_date in whole days (half-open interval width)"
      - name: propulsion_type
        type: enum
        source: system
        description: "Snapshot of the unit's package propulsion_type, frozen at creation for changeover checks"
        constraints: "one of {DIESEL, PROPANE, ELECTRIC}"
      - name: status
        type: enum
        source: system
        description: "Slot lifecycle; only COMMITTED and IN_PROGRESS slots consume line capacity"
        default: PLANNED
        constraints: "one of {PLANNED, COMMITTED, IN_PROGRESS, COMPLETED, RELEASED}"

  - name: BusUnit
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: contract_order_id
        type: string
        source: system
        description: "FK -> ContractOrder.id; null for legacy fleet imports"
      - name: bus_model_id
        type: string
        source: system
        description: "FK -> BusModel.id; copied from the awarded bid or supplied by the legacy import"
      - name: propulsion_package_id
        type: string
        source: system
        description: "FK -> PropulsionPackage.id; copied from the awarded bid or supplied by the legacy import"
      - name: spec_profile_id
        type: string
        source: system
        description: "FK -> StateSpecProfile.id; the profile whose requirements gate this unit's certification"
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; null until a dealer is assigned"
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number"
        constraints: "unique across BusUnit"
      - name: seat_capacity
        type: integer
        source: system
        description: "Seat positions built, copied from ContractOrder.awarded_seat_capacity (or model base for legacy imports)"
      - name: emergency_exit_count
        type: integer
        source: system
        description: "Emergency exits built, copied from ContractOrder.awarded_emergency_exit_count (or model base for legacy imports)"
      - name: mirror_config
        type: enum
        source: system
        description: "Mirror package built"
        constraints: "one of {STANDARD, CROSSVIEW, CROSSVIEW_HEATED}"
      - name: lap_shoulder_belts
        type: boolean
        source: system
        description: "Lap-shoulder belts built"
      - name: eight_lamp_system
        type: boolean
        source: system
        description: "8-lamp warning system built"
      - name: crossing_arm
        type: boolean
        source: system
        description: "Crossing arm built"
      - name: rollover_reinforcement
        type: boolean
        source: system
        description: "Rollover reinforcement built"
      - name: joint_strength_kn
        type: number
        source: computed
        description: "model.body_joint_strength_kn plus ROLLOVER_JOINT_BONUS_KN when rollover_reinforcement is true"
      - name: registration_state_code
        type: string
        source: system
        description: "Copied from the unit's spec profile state_code; gates dealer licensing"
      - name: nominal_range_mi
        type: integer
        source: computed
        description: "Nameplate range variant of range_validation"
      - name: derated_route_range_mi
        type: number
        source: computed
        description: "Derated route range variant of range_validation, one decimal place"
      - name: production_status
        type: enum
        source: system
        description: "Build dimension of the unit's parallel state machine"
        default: PLANNED
        constraints: "one of {PLANNED, SLOTTED, BODY_JOINED, BUILT, DELIVERED}"
      - name: certification_status
        type: enum
        source: system
        description: "Compliance dimension of the unit's parallel state machine"
        default: PENDING
        constraints: "one of {PENDING, CERTIFIED, NONCONFORMING, WAIVED}"
      - name: service_status
        type: enum
        source: system
        description: "Field-service dimension of the unit's parallel state machine"
        default: NONE
        constraints: "one of {NONE, RECALL_OPEN, RECALL_CLOSED}"
      - name: driver_training_status
        type: enum
        source: system
        description: "Whether the receiving district's driver training was completed for this unit"
        default: PENDING
        constraints: "one of {PENDING, COMPLETED}"
      - name: certified_at
        type: datetime
        source: system
        description: "Logical-clock instant of certification; null until certified"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of delivery, or the supplied historical instant for legacy imports"
      - name: waiver_justification
        type: string
        source: system
        description: "Justification recorded when a nonconformance was waived; null otherwise"
      - name: is_legacy_import
        type: boolean
        source: system
        description: "True for units registered through the dealer legacy fleet import; such units may not be slotted, tested or certified"
        default: false

  - name: TestBay
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bay_code
        type: string
        source: input
        description: "Unique test bay code"
        constraints: "unique across TestBay"
      - name: plant_code
        type: string
        source: input
        description: "Plant the bay sits in"
      - name: supported_test_types
        type: array
        source: input
        description: "Test types the bay is instrumented for; each element one of {BRAKE, EMERGENCY_EXIT, ELECTRICAL, JOINT_STRENGTH, ROLLOVER}"
        constraints: "non-empty"
      - name: max_concurrent_electrical
        type: integer
        source: input
        description: "Number of ELECTRICAL tests that may share the bay's harness stations at once"
        constraints: ">= 1"

  - name: QualityTest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bus_unit_id
        type: string
        source: input
        description: "FK -> BusUnit.id; the unit under test"
      - name: test_bay_id
        type: string
        source: input
        description: "FK -> TestBay.id; the bay reserved for the test window"
      - name: test_type
        type: enum
        source: input
        description: "Verification performed"
        constraints: "one of {BRAKE, EMERGENCY_EXIT, ELECTRICAL, JOINT_STRENGTH, ROLLOVER}"
      - name: window_start
        type: datetime
        source: input
        description: "First instant of the bay occupation, inclusive"
      - name: window_end
        type: datetime
        source: input
        description: "Last instant of the bay occupation, inclusive (closed interval)"
      - name: status
        type: enum
        source: system
        description: "Test lifecycle; branching on result"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PASSED, FAILED, VOIDED}"
      - name: min_required_value
        type: number
        source: computed
        description: "Output of the test_minimum_value calculation; null for test types with no numeric minimum"
      - name: measured_value
        type: number
        source: system
        description: "Measurement recorded with the result; null until recorded"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityInspector who recorded the result; compared against the certifying identity"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the result was recorded; null until recorded"
      - name: result_notes
        type: string
        source: system
        description: "Free-text notes captured with the result"

  - name: Dealer
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: dealer_code
        type: string
        source: input
        description: "Unique dealer code"
        constraints: "unique across Dealer"
      - name: dealer_name
        type: string
        source: input
        description: "Dealer legal name"
      - name: licensed_state_codes
        type: array
        source: input
        description: "State codes the dealer holds a school bus sales licence in; each element 2 uppercase letters"
        constraints: "non-empty"
      - name: training_capacity_per_month
        type: integer
        source: input
        description: "Driver-training sessions the dealer can run per month (parts-and-training support capacity)"
        constraints: ">= 0"
      - name: delivered_unit_count
        type: integer
        source: computed
        description: "Count of BusUnit rows with this dealer_id and production_status DELIVERED"
        default: 0
      - name: open_recall_unit_count
        type: integer
        source: computed
        description: "Output of the dealer_recall_exposure calculation"
        default: 0
      - name: certification_standing
        type: enum
        source: computed
        description: "Threshold outcome of dealer_recall_exposure; only GOOD dealers may take new assignments"
        default: GOOD
        constraints: "one of {GOOD, RESTRICTED, SUSPENDED}"

  - name: RecallCampaign
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: campaign_code
        type: string
        source: input
        description: "Unique safety campaign code"
        constraints: "unique across RecallCampaign"
      - name: affected_bus_model_id
        type: string
        source: input
        description: "FK -> BusModel.id; body model in scope"
      - name: affected_propulsion_type
        type: enum
        source: input
        description: "Propulsion family in scope"
        constraints: "one of {DIESEL, PROPANE, ELECTRIC}"
      - name: defect_category
        type: enum
        source: input
        description: "Defect being remedied"
        constraints: "one of {BRAKE_LINE_CORROSION, EMERGENCY_EXIT_LATCH, WIRING_HARNESS, BATTERY_CONTACTOR}"
      - name: build_window_start
        type: string
        source: input
        description: "First delivered_at date in scope, inclusive (ISO date)"
      - name: build_window_end
        type: string
        source: input
        description: "Last delivered_at date in scope, inclusive (ISO date)"
      - name: kits_per_unit
        type: integer
        source: input
        description: "Remedy kits each affected unit consumes"
        constraints: ">= 1"
      - name: total_kits
        type: integer
        source: input
        description: "Remedy kits the parts-support programme stocked for this campaign"
        constraints: ">= 1"
      - name: affected_unit_count
        type: integer
        source: computed
        description: "Output of the recall_scope calculation, frozen at launch"
        default: 0
      - name: reserved_kits
        type: integer
        source: computed
        description: "Sum of kits_reserved over this campaign's OPEN and IN_PROGRESS remedy tasks"
        default: 0
      - name: consumed_kits
        type: integer
        source: computed
        description: "Sum of kits_reserved over this campaign's COMPLETED remedy tasks"
        default: 0
      - name: available_kits
        type: integer
        source: computed
        description: "total_kits minus reserved_kits minus consumed_kits (the conserved kit pool)"
      - name: escalated_task_count
        type: integer
        source: computed
        description: "Count of this campaign's remedy tasks with escalation_level FACTORY_DIRECTED"
        default: 0
      - name: kit_shortfall_count
        type: integer
        source: computed
        description: "Count of factory escalations that could not reserve their extra kit because available_kits was 0"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Campaign lifecycle; COMPLETED is derived from its remedy tasks"
        default: DRAFT
        constraints: "one of {DRAFT, LAUNCHED, COMPLETED}"
      - name: launched_at
        type: datetime
        source: system
        description: "Logical-clock instant of launch; null while DRAFT"

  - name: RemedyTask
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: recall_campaign_id
        type: string
        source: system
        description: "FK -> RecallCampaign.id; the campaign that created the task"
      - name: bus_unit_id
        type: string
        source: system
        description: "FK -> BusUnit.id; the delivered unit to be remedied"
      - name: dealer_id
        type: string
        source: system
        description: "FK -> Dealer.id; the dealer that delivered the unit and owns the remedy"
      - name: kits_reserved
        type: integer
        source: computed
        description: "Kits held for this task: campaign.kits_per_unit, plus FACTORY_ESCALATION_EXTRA_KITS once escalated"
      - name: escalation_level
        type: enum
        source: system
        description: "DEALER_DIRECTED until the owning dealer loses GOOD standing, then FACTORY_DIRECTED (one-way)"
        default: DEALER_DIRECTED
        constraints: "one of {DEALER_DIRECTED, FACTORY_DIRECTED}"
      - name: status
        type: enum
        source: system
        description: "Remedy lifecycle"
        default: OPEN
        constraints: "one of {OPEN, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null unless COMPLETED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# BusUnit carries three independent dimensions, emitted as three machines with a
# `dimension:` key; a transition in one dimension never implies a transition in another
# except through the explicitly listed side effects.
# ---------------------------------------------------------------------------

state_machines:

  - entity: StateSpecProfile
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /state-spec-profiles/{id}/publish"
        actor: ComplianceOfficer
        preconditions:
          - "profile.status == DRAFT"
        side_effects:
          - "published_at set to the logical clock instant"
          - "the previously PUBLISHED profile for the same (state_code, school_year), if any, moves PUBLISHED -> SUPERSEDED and has superseded_by_profile_id set to this profile's id"
          - "at most one PUBLISHED profile per (state_code, school_year) exists after this transition — this invariant is what makes the award-time profile selector single-valued"
        note: "Bids, orders and units already pointing at the superseded profile keep pointing at it; only the award-time and unit-creation selectors read the newly PUBLISHED row."
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system event: a newer profile for the same (state_code, school_year) is published"
        actor: system
        preconditions:
          - "profile.status == PUBLISHED"
          - "the newly published profile has the same state_code and school_year"
        side_effects:
          - "superseded_by_profile_id set to the newer profile's id"
          - "no Bid, ContractOrder or BusUnit reference is rewritten"

  - entity: Solicitation
    initial_state: OPEN
    terminal_states: [AWARDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /solicitations/{id}/close"
        actor: ContractsAdmin
        preconditions:
          - "solicitation.status == OPEN"
        side_effects:
          - "no bid state changes; DRAFT bids simply become unsubmittable because submit requires status == OPEN"
      - from: CLOSED
        to: AWARDED
        trigger: "POST /bids/{id}/award"
        actor: ContractsAdmin
        preconditions:
          - "solicitation.status == CLOSED"
          - "the awarded bid's solicitation_id == this solicitation's id"
        side_effects:
          - "every other Bid on this solicitation whose status is SUBMITTED or REVISION_REQUESTED moves to REJECTED (fan-out, processed in created_at ASC order)"
          - "a ContractOrder is created (see Bid SUBMITTED_to_AWARDED)"

  - entity: Bid
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bids/{id}/submit"
        actor: SalesEngineer
        preconditions:
          - "bid.status == DRAFT"
          - "the bid's Solicitation.status == OPEN (cross-entity)"
          - "spec_compliance_evaluation against the currently PUBLISHED profile for (solicitation.state_code, solicitation.school_year) yields spec_compliance_status != NONCONFORMING"
          - "provisional_unit_price_cents <= solicitation.price_cap_cents_per_unit"
        side_effects:
          - "evaluated_spec_profile_id set to the currently PUBLISHED profile's id; spec_compliance_status, exception_count, unmet_mandatory_items, nominal_range_mi and derated_route_range_mi recomputed against it"
          - "submitted_at set to the logical clock instant; submitted_by_user_id set to the acting X-User-ID"
          - "bid.version increments by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /bids/{id}/request-revision"
        actor: ContractsAdmin
        preconditions:
          - "bid.status == SUBMITTED"
          - "the bid's Solicitation.status == OPEN (cross-entity)"
          - "bid.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "bid.version increments by 1; no price or compliance recomputation"
        note: "Entry point of the negotiation cycle DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT."
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /bids/{id}/revisions"
        actor: SalesEngineer
        preconditions:
          - "bid.status is REVISION_REQUESTED (a DRAFT bid may also be revised, staying DRAFT)"
          - "expected_bid_version == bid.version (OCC, §1.2.1)"
          - "bid.revision_round + 1 <= MAX_REVISION_ROUNDS"
        side_effects:
          - "a new BidRevision is created with round_index = bid.revision_round + 1 and the submitted offered_* snapshot"
          - "every earlier BidRevision of this bid has is_superseded set to true"
          - "bid.revision_round set to the new round_index; the bid's offered_* fields are overwritten from the revision"
          - "bid_unit_price provisional variant recomputed into provisional_unit_price_cents and the revision's unit_price_cents; offered_joint_strength_kn, nominal_range_mi, derated_route_range_mi recomputed"
          - "spec_compliance_evaluation re-run against the Solicitation's cited spec_profile_id, updating spec_compliance_status, exception_count, unmet_mandatory_items and evaluated_spec_profile_id"
          - "bid.version increments by 1"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /bids/{id}/revisions"
        actor: SalesEngineer
        preconditions:
          - "bid.status == DRAFT"
          - "expected_bid_version == bid.version (OCC, §1.2.1)"
          - "bid.revision_round + 1 <= MAX_REVISION_ROUNDS"
        side_effects:
          - "same side effects as REVISION_REQUESTED -> DRAFT; the status simply does not change"
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /bids/{id}/award"
        actor: ContractsAdmin
        preconditions:
          - "bid.status == SUBMITTED"
          - "the bid's Solicitation.status == CLOSED (cross-entity)"
          - "the acting X-User-ID != bid.submitted_by_user_id (segregation of duties)"
          - "exactly one PUBLISHED StateSpecProfile exists for (solicitation.state_code, solicitation.school_year)"
          - "promised_delivery_date <= solicitation.required_delivery_date"
        side_effects:
          - "a ContractOrder is created with spec_profile_id = the award-time PUBLISHED profile, unit_count copied from the bid, status ACTIVE, delivery_posture ON_TRACK"
          - "the award-time spec upgrade runs, writing the order's awarded_* configuration fields and awarded_joint_strength_kn"
          - "bid_unit_price final_award variant computed into ContractOrder.awarded_unit_price_cents; contract_total computed into total_contract_cents"
          - "the Solicitation moves CLOSED -> AWARDED, which rejects the sibling SUBMITTED / REVISION_REQUESTED bids"
          - "bid.version increments by 1"
        note: "The award deliberately does NOT re-check engineering conformance (route range, joint strength) against the award-time profile — only the priceable option set is upgraded. Engineering conformance is gated later at unit creation and certification."
      - from: SUBMITTED
        to: REJECTED
        trigger: "system event: a sibling bid on the same solicitation is awarded"
        actor: system
        preconditions:
          - "bid.status == SUBMITTED"
          - "another bid on the same solicitation reached AWARDED"
        side_effects:
          - "bid.version increments by 1"
      - from: REVISION_REQUESTED
        to: REJECTED
        trigger: "system event: a sibling bid on the same solicitation is awarded"
        actor: system
        preconditions:
          - "bid.status == REVISION_REQUESTED"
          - "another bid on the same solicitation reached AWARDED"
        side_effects:
          - "bid.version increments by 1"

  - entity: ContractOrder
    dimension: status
    initial_state: ACTIVE
    terminal_states: [FULFILLED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system event: the order's last unit reaches production_status DELIVERED (bubble up)"
        actor: system
        preconditions:
          - "order.created_unit_count == order.unit_count"
          - "every BusUnit with this contract_order_id has production_status == DELIVERED"
        side_effects:
          - "delivered_unit_count recomputed; delivery_posture recomputed (a FULFILLED order that is already BREACHED stays BREACHED)"

  - entity: ContractOrder
    dimension: delivery_posture
    initial_state: ON_TRACK
    terminal_states: [BREACHED]
    transitions:
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system event: delivery_posture recomputation at any of the trigger points listed in the delivery_posture calculation"
        actor: system
        preconditions:
          - "order.status != FULFILLED"
          - "clock_date <= promised_delivery_date"
          - "at_risk_unit_count >= 1"
          - "(promised_delivery_date - clock_date) in whole days < REPLAN_LEAD_DAYS"
        side_effects:
          - "at_risk_unit_count refreshed; liquidated_damages_cents stays 0"
      - from: AT_RISK
        to: ON_TRACK
        trigger: "system event: delivery_posture recomputation"
        actor: system
        preconditions:
          - "order.status != FULFILLED or the order just became FULFILLED without ever breaching"
          - "clock_date <= promised_delivery_date"
          - "at_risk_unit_count == 0 or (promised_delivery_date - clock_date) in whole days >= REPLAN_LEAD_DAYS"
        side_effects:
          - "at_risk_unit_count refreshed"
        note: "The ON_TRACK <-> AT_RISK loop is the cyclic part of this dimension; BREACHED is absorbing."
      - from: ON_TRACK
        to: BREACHED
        trigger: "system event: delivery_posture recomputation"
        actor: system
        preconditions:
          - "clock_date > promised_delivery_date"
          - "delivered_unit_count < unit_count"
        side_effects:
          - "liquidated_damages_cents recomputed by the liquidated_damages calculation"
      - from: AT_RISK
        to: BREACHED
        trigger: "system event: delivery_posture recomputation"
        actor: system
        preconditions:
          - "clock_date > promised_delivery_date"
          - "delivered_unit_count < unit_count"
        side_effects:
          - "liquidated_damages_cents recomputed by the liquidated_damages calculation"

  - entity: ProductionLine
    initial_state: RUNNING
    terminal_states: []
    transitions:
      - from: RUNNING
        to: DOWN_FOR_MAINTENANCE
        trigger: "POST /production-lines/{id}/status with status DOWN_FOR_MAINTENANCE"
        actor: PlantScheduler
        preconditions:
          - "line.status == RUNNING"
        side_effects:
          - "committed slots are untouched; new commits are blocked while DOWN_FOR_MAINTENANCE"
          - "line.version increments by 1"
      - from: DOWN_FOR_MAINTENANCE
        to: RUNNING
        trigger: "POST /production-lines/{id}/status with status RUNNING"
        actor: PlantScheduler
        preconditions:
          - "line.status == DOWN_FOR_MAINTENANCE"
        side_effects:
          - "line.version increments by 1"

  - entity: BuildSlot
    initial_state: PLANNED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: PLANNED
        to: COMMITTED
        trigger: "POST /build-slots/{id}/commit"
        actor: PlantScheduler
        preconditions:
          - "slot.status == PLANNED"
          - "the slot's ProductionLine.status == RUNNING (cross-entity)"
          - "the slot's BusUnit.production_status == PLANNED (cross-entity)"
          - "line.committed_slot_days + slot.slot_days <= line.horizon_slot_day_capacity"
        side_effects:
          - "ProductionLine.committed_slot_days increases by slot.slot_days (line_capacity_ledger); line.version increments by 1"
          - "the BusUnit's production_status moves PLANNED -> SLOTTED"
          - "the owning ContractOrder recomputes at_risk_unit_count and delivery_posture"
      - from: COMMITTED
        to: IN_PROGRESS
        trigger: "POST /bus-units/{id}/advance-build with to_status BODY_JOINED"
        actor: PlantScheduler
        preconditions:
          - "slot.status == COMMITTED"
          - "the slot's BusUnit.production_status == SLOTTED"
        side_effects:
          - "line.committed_slot_days is unchanged (both COMMITTED and IN_PROGRESS consume capacity)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /bus-units/{id}/advance-build with to_status BUILT"
        actor: PlantScheduler
        preconditions:
          - "slot.status == IN_PROGRESS"
          - "the slot's BusUnit.production_status == BODY_JOINED"
        side_effects:
          - "line.committed_slot_days is unchanged — a COMPLETED slot keeps its slot-days booked for the horizon"
      - from: PLANNED
        to: RELEASED
        trigger: "POST /build-slots/{id}/release"
        actor: PlantScheduler
        preconditions:
          - "slot.status == PLANNED"
        side_effects:
          - "line.committed_slot_days unchanged (a PLANNED slot never consumed capacity); line.version increments by 1"
          - "the BusUnit's production_status is unchanged (it was never SLOTTED by this slot)"
          - "every SCHEDULED QualityTest of the slot's unit moves to VOIDED"
          - "the owning ContractOrder recomputes at_risk_unit_count and delivery_posture"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /build-slots/{id}/release, or CASCADE-A hop 2 (the slot's unit became NONCONFORMING)"
        actor: PlantScheduler | system
        preconditions:
          - "slot.status == COMMITTED"
        side_effects:
          - "COMPENSATING ACTION for PLANNED -> COMMITTED: ProductionLine.committed_slot_days decreases by exactly slot.slot_days, restoring the pre-commit value (line_slot_day_conservation invariant); line.version increments by 1"
          - "the BusUnit's production_status reverts SLOTTED -> PLANNED"
          - "every SCHEDULED QualityTest of that unit moves to VOIDED"
          - "the owning ContractOrder recomputes at_risk_unit_count and delivery_posture, and liquidated_damages_cents when the posture is BREACHED"
      - from: IN_PROGRESS
        to: RELEASED
        trigger: "POST /build-slots/{id}/release, or CASCADE-A hop 2 (the slot's unit became NONCONFORMING)"
        actor: PlantScheduler | system
        preconditions:
          - "slot.status == IN_PROGRESS"
        side_effects:
          - "same as COMMITTED -> RELEASED, and the BusUnit's production_status reverts BODY_JOINED -> PLANNED or BUILT -> PLANNED depending on where it stood"

  - entity: BusUnit
    dimension: production_status
    initial_state: PLANNED
    terminal_states: [DELIVERED]
    transitions:
      - from: PLANNED
        to: SLOTTED
        trigger: "POST /build-slots/{id}/commit"
        actor: PlantScheduler
        preconditions:
          - "unit.production_status == PLANNED"
          - "unit.is_legacy_import == false"
        side_effects:
          - "the committing slot becomes COMMITTED and books line capacity"
      - from: SLOTTED
        to: BODY_JOINED
        trigger: "POST /bus-units/{id}/advance-build with to_status BODY_JOINED"
        actor: PlantScheduler
        preconditions:
          - "unit.production_status == SLOTTED"
          - "the unit has a BuildSlot in status COMMITTED"
        side_effects:
          - "that BuildSlot moves COMMITTED -> IN_PROGRESS"
      - from: BODY_JOINED
        to: BUILT
        trigger: "POST /bus-units/{id}/advance-build with to_status BUILT"
        actor: PlantScheduler
        preconditions:
          - "unit.production_status == BODY_JOINED"
          - "the unit has a BuildSlot in status IN_PROGRESS"
        side_effects:
          - "that BuildSlot moves IN_PROGRESS -> COMPLETED"
      - from: BUILT
        to: DELIVERED
        trigger: "POST /bus-units/{id}/deliver"
        actor: ContractsAdmin | DealerAgent
        preconditions:
          - "unit.production_status == BUILT"
          - "unit.certification_status IN {CERTIFIED, WAIVED}"
          - "unit.dealer_id is not null"
          - "unit.driver_training_status == COMPLETED"
        side_effects:
          - "delivered_at set to the logical clock instant"
          - "the Dealer's delivered_unit_count recomputed"
          - "the ContractOrder's delivered_unit_count and at_risk_unit_count recomputed, delivery_posture recomputed, and status moves ACTIVE -> FULFILLED when every unit is DELIVERED (bubble up)"
      - from: SLOTTED
        to: PLANNED
        trigger: "system event: the unit's BuildSlot is RELEASED (CASCADE-A hop 3, or an operator release)"
        actor: system
        preconditions:
          - "unit.production_status IN {SLOTTED, BODY_JOINED, BUILT}"
          - "the unit's COMMITTED or IN_PROGRESS BuildSlot reached RELEASED"
        side_effects:
          - "every SCHEDULED QualityTest of this unit moves to VOIDED"
          - "the owning ContractOrder recomputes at_risk_unit_count and delivery_posture"
        note: "Written once for SLOTTED; BODY_JOINED -> PLANNED and BUILT -> PLANNED are the same transition from a later build stage."
      - from: BODY_JOINED
        to: PLANNED
        trigger: "system event: the unit's BuildSlot is RELEASED (CASCADE-A hop 3)"
        actor: system
        preconditions:
          - "unit.production_status == BODY_JOINED"
          - "the unit's IN_PROGRESS BuildSlot reached RELEASED"
        side_effects:
          - "same as SLOTTED -> PLANNED"
      - from: BUILT
        to: PLANNED
        trigger: "system event: the unit's BuildSlot is RELEASED (CASCADE-A hop 3)"
        actor: system
        preconditions:
          - "unit.production_status == BUILT"
          - "the unit's IN_PROGRESS BuildSlot reached RELEASED"
        side_effects:
          - "same as SLOTTED -> PLANNED"

  - entity: BusUnit
    dimension: certification_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /bus-units/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "unit.production_status == BUILT"
          - "unit.certification_status IN {PENDING, WAIVED}"
          - "every required test type for the unit's profile has a PASSED QualityTest and no QualityTest of the unit is FAILED"
          - "unit.derated_route_range_mi >= profile.required_route_range_mi and unit.joint_strength_kn >= profile.min_joint_strength_kn"
          - "the unit's spec profile status == PUBLISHED"
          - "the acting X-User-ID is not the recorded_by_user_id of any PASSED QualityTest of this unit (segregation of duties)"
        side_effects:
          - "certified_at set to the logical clock instant"
          - "the owning ContractOrder recomputes at_risk_unit_count and delivery_posture"
      - from: WAIVED
        to: CERTIFIED
        trigger: "POST /bus-units/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "same as PENDING -> CERTIFIED, except that spec-item conformance checks skipped by the waiver are not re-run"
        side_effects:
          - "certified_at set; waiver_justification retained for audit"
      - from: PENDING
        to: NONCONFORMING
        trigger: "system event: a QualityTest of this unit reaches FAILED (CASCADE-A hop 1)"
        actor: system
        preconditions:
          - "unit.certification_status == PENDING"
        side_effects:
          - "CASCADE-A hop 2 fires: the unit's COMMITTED or IN_PROGRESS BuildSlot moves to RELEASED"
      - from: NONCONFORMING
        to: PENDING
        trigger: "system event: a re-run QualityTest of the same test_type reaches PASSED and the unit has no remaining FAILED test"
        actor: system
        preconditions:
          - "unit.certification_status == NONCONFORMING"
          - "no QualityTest of this unit is in status FAILED after the new result is recorded"
        side_effects:
          - "the owning ContractOrder recomputes at_risk_unit_count and delivery_posture"
        note: "Closes the NONCONFORMING -> PENDING -> NONCONFORMING loop of this dimension."
      - from: NONCONFORMING
        to: WAIVED
        trigger: "POST /bus-units/{id}/waive-nonconformance"
        actor: ComplianceOfficer
        preconditions:
          - "unit.certification_status == NONCONFORMING"
          - "the unit has at least one FAILED QualityTest whose test_type is not in {BRAKE, ROLLOVER} — brake and rollover failures may never be waived"
        side_effects:
          - "waiver_justification stored; every FAILED QualityTest of the unit moves to VOIDED"
          - "the owning ContractOrder recomputes at_risk_unit_count and delivery_posture"

  - entity: BusUnit
    dimension: service_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: RECALL_OPEN
        trigger: "system event: a RemedyTask is created for this unit (CASCADE-B hop 1)"
        actor: system
        preconditions:
          - "unit.production_status == DELIVERED"
          - "unit.service_status IN {NONE, RECALL_CLOSED}"
        side_effects:
          - "the owning Dealer recomputes open_recall_unit_count and certification_standing"
      - from: RECALL_CLOSED
        to: RECALL_OPEN
        trigger: "system event: a RemedyTask is created for this unit by a later campaign"
        actor: system
        preconditions:
          - "unit.service_status == RECALL_CLOSED"
        side_effects:
          - "same as NONE -> RECALL_OPEN"
      - from: RECALL_OPEN
        to: RECALL_CLOSED
        trigger: "POST /remedy-tasks/{id}/complete"
        actor: DealerAgent
        preconditions:
          - "the unit has no RemedyTask left in status OPEN or IN_PROGRESS after this completion"
        side_effects:
          - "the Dealer recomputes open_recall_unit_count and certification_standing"
      - from: RECALL_OPEN
        to: NONE
        trigger: "POST /remedy-tasks/{id}/cancel"
        actor: ComplianceOfficer
        preconditions:
          - "the unit has no RemedyTask left in status OPEN or IN_PROGRESS after this cancellation"
          - "the unit has no COMPLETED RemedyTask"
        side_effects:
          - "COMPENSATING ACTION for CASCADE-B hop 1: the unit returns to the exact pre-launch service_status"
          - "the Dealer recomputes open_recall_unit_count and certification_standing"

  - entity: QualityTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /quality-tests/{id}/record-result with outcome PASS"
        actor: QualityInspector
        preconditions:
          - "test.status == SCHEDULED"
          - "measured_value is present when min_required_value is not null"
          - "measured_value >= min_required_value when min_required_value is not null"
        side_effects:
          - "recorded_by_user_id set to the acting X-User-ID; recorded_at set to the logical clock instant"
          - "if the unit's certification_status is NONCONFORMING and no FAILED test of the unit remains, the unit moves NONCONFORMING -> PENDING"
        note: "PASS branch: no slot, line or order side effects."
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /quality-tests/{id}/record-result with outcome FAIL"
        actor: QualityInspector
        preconditions:
          - "test.status == SCHEDULED"
        side_effects:
          - "recorded_by_user_id and recorded_at set"
          - "CASCADE-A hop 1 (caused by this test reaching FAILED): the unit's certification_status moves PENDING -> NONCONFORMING; if it is already NONCONFORMING the value is unchanged and hops 2-4 still fire only if a live slot exists"
          - "CASCADE-A hop 2 (caused by hop 1, i.e. by the unit being NONCONFORMING): the unit's BuildSlot in status COMMITTED or IN_PROGRESS moves to RELEASED; if the unit has no such slot, hops 2-4 do not fire"
          - "CASCADE-A hop 3 (caused by hop 2, i.e. by the slot reaching RELEASED): ProductionLine.committed_slot_days decreases by that slot's slot_days and line.version increments; the unit's production_status reverts to PLANNED; every other SCHEDULED QualityTest of the unit moves to VOIDED"
          - "CASCADE-A hop 4 (caused by hop 3, i.e. by the unit reverting to PLANNED): the owning ContractOrder recomputes at_risk_unit_count and delivery_posture, and when the recomputed posture is BREACHED it recomputes liquidated_damages_cents"
        note: "FAIL branch side-effect set is strictly larger than the PASS branch — this is the branching fork of the QualityTest machine."
      - from: SCHEDULED
        to: VOIDED
        trigger: "system event: the unit's BuildSlot is RELEASED, or the unit's nonconformance is waived"
        actor: system
        preconditions:
          - "test.status == SCHEDULED"
        side_effects:
          - "the bay occupation is freed, so a later test may reuse the same window"
      - from: FAILED
        to: VOIDED
        trigger: "POST /bus-units/{id}/waive-nonconformance"
        actor: ComplianceOfficer
        preconditions:
          - "test.status == FAILED"
          - "test.test_type not in {BRAKE, ROLLOVER}"
        side_effects:
          - "the unit's certification_status moves NONCONFORMING -> WAIVED once every FAILED test is voided"

  - entity: Dealer
    dimension: certification_standing
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: RESTRICTED
        trigger: "system event: dealer_recall_exposure recomputation (CASCADE-B hop 2)"
        actor: system
        preconditions:
          - "open_recall_unit_count >= DEALER_RESTRICT_THRESHOLD and < DEALER_SUSPEND_THRESHOLD"
        side_effects:
          - "CASCADE-B hop 3 fires: every OPEN or IN_PROGRESS RemedyTask of this dealer whose escalation_level is DEALER_DIRECTED moves to FACTORY_DIRECTED in created_at ASC order, each incrementing its own campaign's escalated_task_count"
          - "new dealer assignments are refused while standing != GOOD"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system event: dealer_recall_exposure recomputation"
        actor: system
        preconditions:
          - "open_recall_unit_count >= DEALER_SUSPEND_THRESHOLD"
        side_effects:
          - "CASCADE-B hop 3 fires for any DEALER_DIRECTED task not already escalated"
      - from: GOOD
        to: SUSPENDED
        trigger: "system event: dealer_recall_exposure recomputation when a single launch crosses both thresholds"
        actor: system
        preconditions:
          - "open_recall_unit_count >= DEALER_SUSPEND_THRESHOLD"
        side_effects:
          - "CASCADE-B hop 3 fires"
      - from: RESTRICTED
        to: GOOD
        trigger: "system event: dealer_recall_exposure recomputation after a remedy task is completed or cancelled"
        actor: system
        preconditions:
          - "open_recall_unit_count < DEALER_RESTRICT_THRESHOLD"
        side_effects:
          - "already-escalated RemedyTasks keep escalation_level FACTORY_DIRECTED — escalation is one-way, so returning to GOOD does not release the extra kits"
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system event: dealer_recall_exposure recomputation after a remedy task is completed or cancelled"
        actor: system
        preconditions:
          - "open_recall_unit_count >= DEALER_RESTRICT_THRESHOLD and < DEALER_SUSPEND_THRESHOLD"
        side_effects:
          - "no task escalation change"

  - entity: RecallCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: LAUNCHED
        trigger: "POST /recall-campaigns/{id}/launch"
        actor: ComplianceOfficer
        preconditions:
          - "campaign.status == DRAFT"
          - "recall_scope yields affected_unit_count >= 1"
          - "total_kits >= affected_unit_count * kits_per_unit"
        side_effects:
          - "launched_at set; affected_unit_count frozen from recall_scope"
          - "CASCADE-B hop 1: one RemedyTask per affected unit, in recall_scope order, with status OPEN, escalation_level DEALER_DIRECTED, kits_reserved = kits_per_unit, dealer_id = unit.dealer_id; each unit's service_status moves to RECALL_OPEN; reserved_kits and available_kits recomputed"
          - "CASCADE-B hop 2 (caused by hop 1, i.e. by those OPEN tasks existing): every dealer named by a new task recomputes open_recall_unit_count and therefore certification_standing"
          - "CASCADE-B hop 3 (caused by hop 2, i.e. by a dealer leaving GOOD standing): that dealer's OPEN / IN_PROGRESS DEALER_DIRECTED tasks move to FACTORY_DIRECTED, incrementing each task's campaign.escalated_task_count"
          - "CASCADE-B hop 4 (caused by hop 3, i.e. by each escalation): the escalated task reserves FACTORY_ESCALATION_EXTRA_KITS extra kits when its campaign's available_kits >= 1 at that moment, else campaign.kit_shortfall_count increments and kits_reserved is unchanged"
      - from: LAUNCHED
        to: COMPLETED
        trigger: "system event: the campaign's last non-terminal RemedyTask reaches COMPLETED or CANCELLED (bubble up)"
        actor: system
        preconditions:
          - "campaign.status == LAUNCHED"
          - "every RemedyTask of the campaign is in status COMPLETED or CANCELLED"
        side_effects:
          - "reserved_kits becomes 0; available_kits = total_kits - consumed_kits"

  - entity: RemedyTask
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /remedy-tasks/{id}/start"
        actor: DealerAgent
        preconditions:
          - "task.status == OPEN"
          - "the acting X-User-ID == task.dealer_id"
        side_effects:
          - "kits stay reserved; no campaign counter changes"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /remedy-tasks/{id}/complete"
        actor: DealerAgent
        preconditions:
          - "task.status IN {OPEN, IN_PROGRESS}"
          - "the acting X-User-ID == task.dealer_id"
        side_effects:
          - "completed_at set; campaign.consumed_kits increases by task.kits_reserved and reserved_kits decreases by the same amount, so available_kits is unchanged (remedy_kit_conservation invariant)"
          - "the unit's service_status moves RECALL_OPEN -> RECALL_CLOSED once no OPEN / IN_PROGRESS task remains for it"
          - "the Dealer recomputes open_recall_unit_count and certification_standing"
          - "the campaign moves LAUNCHED -> COMPLETED when every task is terminal"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /remedy-tasks/{id}/complete"
        actor: DealerAgent
        preconditions:
          - "task.status == IN_PROGRESS"
          - "the acting X-User-ID == task.dealer_id"
        side_effects:
          - "same as OPEN -> COMPLETED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /remedy-tasks/{id}/cancel"
        actor: ComplianceOfficer
        preconditions:
          - "task.status IN {OPEN, IN_PROGRESS}"
        side_effects:
          - "COMPENSATING ACTION for CASCADE-B hop 1 and hop 4: campaign.reserved_kits decreases by task.kits_reserved and available_kits increases by the same amount, restoring the pool (remedy_kit_conservation invariant); consumed_kits is untouched"
          - "the unit's service_status returns to RECALL_CLOSED if it has a COMPLETED task, otherwise to NONE"
          - "the Dealer recomputes open_recall_unit_count and certification_standing"
          - "the campaign moves LAUNCHED -> COMPLETED when every task is terminal"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /remedy-tasks/{id}/cancel"
        actor: ComplianceOfficer
        preconditions:
          - "task.status == IN_PROGRESS"
        side_effects:
          - "same as OPEN -> CANCELLED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: bid-revision-stale-bid
    parent_entity: Bid
    write_endpoint: "POST /bids/{id}/revisions"
    occ_field: "expected_bid_version"
    description: |
      Creating a BidRevision against a Bid whose version has advanced since the client last read it
      is rejected. This captures the case where another revision has already been appended (which
      legitimately supersedes the earlier revision and rewrites the bid's offered_* configuration and
      provisional price), so the requesting client's view of the offered configuration is stale and its
      revision would silently overwrite a configuration it never saw.
    error_id: ERR_STALE_BID_VERSION
    http_status: 412

  - rule_id: slot-create-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /build-slots"
    occ_field: "expected_production_line_version"
    description: |
      Creating a BuildSlot against a ProductionLine whose version has advanced since the client read
      the line is rejected. A slot request is authored against an observed occupancy picture
      (committed_slot_days, the slot windows already booked, and the line's RUNNING status); once the
      line's version has moved, that picture is stale even when the requested window itself is still
      free, so the request is refused instead of being planned against outdated capacity.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# Every monetary value is an integer number of cents. Every intermediate money
# quantity is rounded half-up to a whole cent at the point stated in the formula
# and nowhere else. Every range value is a decimal with exactly 1 fractional digit,
# truncated toward zero (floor for non-negative values), never rounded.
# ---------------------------------------------------------------------------

calculations:

  - name: bid_unit_price
    trigger: "Bid create and POST /bids/{id}/revisions (provisional_firm variant); POST /bids/{id}/award (final_award variant)"
    algorithm: aggregation
    description: |
      The offered price of one bus, built from exactly six ordered line items and a per-line dealer
      preparation fee. The line item set is fixed; a line item that does not apply contributes 0 and is
      still a line item (its preparation fee is therefore 0, not skipped).
    formula: |
      Ordered line items (all integer cents):
        L1 base            = bus_model.base_price_cents
        L2 propulsion      = propulsion_package.option_price_cents
        L3 seating         = SEAT_ADD_CENTS_EACH * max(0, offered_seat_capacity - bus_model.base_seat_capacity)
        L4 lighting        = (offered_eight_lamp_system ? EIGHT_LAMP_SYSTEM_CENTS : 0)
                             + (offered_crossing_arm ? CROSSING_ARM_CENTS : 0)
        L5 mirrors         = MIRROR_SURCHARGE_CENTS[offered_mirror_config]
        L6 safety          = (offered_lap_shoulder_belts ? LAP_SHOULDER_BELT_CENTS_PER_SEAT * offered_seat_capacity : 0)
                             + EMERGENCY_EXIT_CENTS_EACH * max(0, offered_emergency_exit_count - bus_model.base_emergency_exit_count)
                             + (offered_rollover_reinforcement ? ROLLOVER_REINFORCEMENT_CENTS : 0)

      PINNED EVALUATION ORDER (this is a required part of the rule, not an implementation detail):
        prep_i     = round_half_up(L_i * DEALER_PREP_PCT)   for i = 1..6, computed per line item
        unit_price = sum(L_i for i in 1..6) + sum(prep_i for i in 1..6)

      The preparation fee is rounded ONCE PER LINE ITEM and the six rounded fees are then summed.
      Rounding the fee on the summed line total instead (round_half_up(sum(L_i) * DEALER_PREP_PCT))
      is a different number for the fixture configurations below and is not the defined result.

      offered_joint_strength_kn = bus_model.body_joint_strength_kn
                                  + (offered_rollover_reinforcement ? ROLLOVER_JOINT_BONUS_KN : 0)
    constants:
      DEALER_PREP_PCT: 0.02375
      SEAT_ADD_CENTS_EACH: 34500
      EIGHT_LAMP_SYSTEM_CENTS: 148000
      CROSSING_ARM_CENTS: 96500
      MIRROR_SURCHARGE_CENTS: {STANDARD: 0, CROSSVIEW: 57400, CROSSVIEW_HEATED: 83275}
      LAP_SHOULDER_BELT_CENTS_PER_SEAT: 21750
      EMERGENCY_EXIT_CENTS_EACH: 68000
      ROLLOVER_REINFORCEMENT_CENTS: 213000
      ROLLOVER_JOINT_BONUS_KN: 9.5
      ESCALATION_PCT_PER_MONTH: 0.0045
    precision: "integer cents; round_half_up at each prep_i and once more at the final_award escalation"
    variants:
      - name: provisional_firm
        when: "Bid create and POST /bids/{id}/revisions; written to Bid.provisional_unit_price_cents and BidRevision.unit_price_cents"
        difference: |
          Use the offered_* configuration exactly as submitted. No escalation factor is applied
          (the multiplier is 1 by definition, because submitted_at is not yet known).
      - name: final_award
        when: "POST /bids/{id}/award; written to ContractOrder.awarded_unit_price_cents"
        difference: |
          Step 1 — award-time spec upgrade. Let P be the StateSpecProfile that is PUBLISHED for
          (solicitation.state_code, solicitation.school_year) at award time (this may be a profile that
          superseded the one the bid was evaluated against). Each priceable configuration item is raised,
          never lowered:
            awarded_seat_capacity        = max(offered_seat_capacity, P.min_seat_capacity)
            awarded_emergency_exit_count = max(offered_emergency_exit_count, P.min_emergency_exit_count)
            awarded_mirror_config        = the more capable of offered_mirror_config and P.required_mirror_config
                                           under the order STANDARD < CROSSVIEW < CROSSVIEW_HEATED
            awarded_lap_shoulder_belts   = offered_lap_shoulder_belts OR P.requires_lap_shoulder_belts
            awarded_eight_lamp_system    = offered_eight_lamp_system OR P.requires_eight_lamp_system
            awarded_crossing_arm         = offered_crossing_arm OR P.requires_crossing_arm
            awarded_rollover_reinforcement = offered_rollover_reinforcement OR P.requires_rollover_protection
          Step 2 — re-run the six line items and the per-line preparation fees on the UPGRADED
          configuration, producing upgraded_unit_price.
          Step 3 — escalation:
            months = floor((award_date - submitted_at_date) in whole days / 30)
            awarded_unit_price_cents = round_half_up(upgraded_unit_price * (1 + ESCALATION_PCT_PER_MONTH * months))
          The delta (awarded_unit_price_cents - provisional_unit_price_cents) is the reconciliation
          amount; it is never written back onto the Bid, which keeps its provisional value forever.
    worked_example: |
      CA fixture — BusModel TYPE_C_CONV (base_price 12,750,000; base_seat_capacity 71;
      base_emergency_exit_count 5; body_joint_strength_kn 58.0), PropulsionPackage ELEC-155
      (option_price_cents 14,900,000), offered 78 seats / 6 exits / CROSSVIEW_HEATED / belts /
      eight-lamp / crossing arm / rollover reinforcement, 12 units.

      provisional_firm:
        L1 = 12,750,000        prep = round_half_up(302,812.50) = 302,813
        L2 = 14,900,000        prep = round_half_up(353,875.00) = 353,875
        L3 = 34,500 * 7 = 241,500   prep = round_half_up(5,735.625) = 5,736
        L4 = 148,000 + 96,500 = 244,500  prep = round_half_up(5,806.875) = 5,807
        L5 = 83,275            prep = round_half_up(1,977.78125) = 1,978
        L6 = 21,750*78 + 68,000*1 + 213,000 = 1,696,500 + 68,000 + 213,000 = 1,977,500
                               prep = round_half_up(46,965.625) = 46,966
        sum(L_i) = 30,196,775 ; sum(prep_i) = 717,175
        provisional_unit_price_cents = 30,913,950
        (the forbidden sum-then-round order gives round_half_up(717,173.40625) = 717,173 and a unit
         price of 30,913,948 — a 2-cent divergence that is the observable difference)
        offered_joint_strength_kn = 58.0 + 9.5 = 67.5

      final_award (profile CA-2027-R2 is PUBLISHED at award time and requires 7 emergency exits;
      submitted_at 2026-08-15, award 2026-11-20 -> 97 days -> months = 3 -> factor 1.0135):
        awarded_emergency_exit_count = max(6, 7) = 7, every other item unchanged
        L6 becomes 1,696,500 + 68,000*2 + 213,000 = 2,045,500 (prep 48,581)
        upgraded_unit_price = 30,983,565
        awarded_unit_price_cents = round_half_up(30,983,565 * 1.0135) = 31,401,843
        reconciliation delta = 31,401,843 - 30,913,950 = 487,893

      TX fixture — TYPE_C_CONV + DSL-100 (1,250,000), offered 71 seats / 5 exits / CROSSVIEW /
      no belts / eight-lamp / crossing arm / no rollover, 1 unit:
        L = [12,750,000, 1,250,000, 0, 244,500, 57,400, 0], sum = 14,301,900
        preps = [302,813, 29,688, 0, 5,807, 1,364, 0] summing to 339,671
        provisional_unit_price_cents = 14,641,571 (sum-then-round would give 14,641,570)
        award 2026-09-01, submitted 2026-08-15 -> 17 days -> months = 0 -> factor 1.0
        awarded_unit_price_cents = 14,641,571 (no upgrade applies; TX-2027 demands nothing higher)

      NY fixture — TYPE_C_CONV + ELEC-155, offered 71 seats / 5 exits / STANDARD / no belts /
      eight-lamp / crossing arm / no rollover, 2 units:
        provisional_unit_price_cents = 28,556,995 (sum-then-round would give 28,556,994)

  - name: contract_total
    trigger: "POST /bids/{id}/award, when the ContractOrder is created"
    algorithm: tiered_pricing
    description: |
      The total contract value of an award. Four stages in a fixed order; each stage consumes the
      output of the previous one, and the freight tier is keyed on the DISCOUNTED subtotal, never on
      the final total.
    formula: |
      subtotal            = awarded_unit_price_cents * unit_count
      discount_pct        = VOLUME_DISCOUNT_TIERS[unit_count]
      volume_discount     = round_half_up(subtotal * discount_pct)
      discounted_subtotal = subtotal - volume_discount
      freight_fee         = FREIGHT_FEE_TIERS keyed on discounted_subtotal
      compliance_admin_fee= round_half_up((discounted_subtotal + freight_fee) * COMPLIANCE_ADMIN_PCT)
      total_contract_cents= discounted_subtotal + freight_fee + compliance_admin_fee

      ORDER SENSITIVITY: the freight tier is selected from discounted_subtotal. Selecting it from the
      pre-discount subtotal, or from a total that already includes freight, changes the tier for orders
      that sit near a tier edge and is not the defined result. The compliance admin fee is charged on
      discounted_subtotal + freight_fee, so freight is inside the fee base but the volume discount is
      not applied to freight.
    constants:
      VOLUME_DISCOUNT_TIERS: "unit_count 1-9 -> 0.00; 10-24 -> 0.02; 25-49 -> 0.035; 50 or more -> 0.05"
      FREIGHT_FEE_TIERS: "discounted_subtotal < 50,000,000 -> 1,250,000; < 150,000,000 -> 2,100,000; 150,000,000 or more -> 2,950,000"
      COMPLIANCE_ADMIN_PCT: 0.0125
    input_set: "the awarded unit price and unit_count of a single ContractOrder; no other order contributes"
    precision: "integer cents; round_half_up at the volume discount and at the compliance admin fee"
    worked_example: |
      CA award: awarded_unit_price 31,401,843 x 12 units
        subtotal = 376,822,116 ; tier 0.02 -> discount 7,536,442 (round_half_up of 7,536,442.32)
        discounted_subtotal = 369,285,674 -> freight tier 2,950,000
        compliance_admin_fee = round_half_up(372,235,674 * 0.0125) = 4,652,946
        total_contract_cents = 376,888,620
      TX award: 14,641,571 x 1
        subtotal = 14,641,571 ; tier 0.00 -> discount 0 ; discounted_subtotal = 14,641,571
        freight 1,250,000 ; admin = round_half_up(15,891,571 * 0.0125) = 198,645
        total_contract_cents = 16,090,216
      NY award: 28,685,501 x 2
        subtotal = 57,371,002 ; tier 0.00 -> discounted_subtotal = 57,371,002 -> freight 2,100,000
        admin = round_half_up(59,471,002 * 0.0125) = 743,388 ; total = 60,214,390
      Volume tier boundary on the TX unit price (14,641,571):
        9 units  -> discount 0, discounted 131,774,139, freight 2,100,000, admin 1,673,427, total 135,547,566
        10 units -> discount 2,928,314, discounted 143,487,396, freight 2,100,000, admin 1,819,842, total 147,407,238

  - name: range_validation
    trigger: "Bid create, POST /bids/{id}/revisions, POST /bids/{id}/submit, POST /contract-orders/{id}/units"
    algorithm: threshold
    description: |
      The nominal and route-derated range of a bus, in miles. Two structurally different formulas apply
      depending on the propulsion package's propulsion_type; ELECTRIC carries an HVAC parasitic load
      that liquid-fuel packages do not, and the derated figure is what every route-range gate compares
      against.
    formula: |
      terrain_factor = TERRAIN_FACTOR[spec_profile.terrain_class]

      Both variants floor the derated value to exactly 1 fractional digit (truncate toward zero, never
      round half up) and floor the nominal value to a whole mile.
    constants:
      AVG_ROUTE_SPEED_MPH: 20.0
      TERRAIN_FACTOR: {FLAT: 1.00, ROLLING: 1.08, MOUNTAIN: 1.18}
    variants:
      - name: electric
        when: "propulsion_package.propulsion_type == ELECTRIC"
        difference: |
          nominal_range_mi = floor(usable_kwh / nominal_consumption_kwh_per_mi)
          effective_kwh_per_mi = nominal_consumption_kwh_per_mi + (hvac_load_kw / AVG_ROUTE_SPEED_MPH)
          available_kwh = usable_kwh * (1 - reserve_floor_pct) * (1 - cold_weather_derate_pct)
          derated_route_range_mi = floor_to_1dp(available_kwh / effective_kwh_per_mi / terrain_factor)
      - name: liquid_fuel
        when: "propulsion_package.propulsion_type IN {DIESEL, PROPANE}"
        difference: |
          nominal_range_mi = floor(fuel_capacity_gal * rated_mpg)
          derated_route_range_mi = floor_to_1dp(
              fuel_capacity_gal * (1 - reserve_floor_pct) * rated_mpg * (1 - cold_weather_derate_pct)
              / terrain_factor)
          The HVAC term and AVG_ROUTE_SPEED_MPH are not part of this variant at all — a liquid-fuel
          package's hvac_load_kw is 0 and must not be divided by the route speed.
    precision: "nominal: whole miles, floor. derated: exactly 1 fractional digit, floored (truncated)."
    worked_example: |
      ELEC-155 (usable_kwh 155.0, nominal_consumption 1.05, hvac_load_kw 7.5,
      cold_weather_derate_pct 0.12, reserve_floor_pct 0.10):
        nominal = floor(155.0 / 1.05) = 147
        effective = 1.05 + 7.5/20.0 = 1.425 ; available = 155.0 * 0.90 * 0.88 = 122.76
        ROLLING  : 122.76 / 1.425 / 1.08 = 79.789... -> derated 79.7
        FLAT     : 122.76 / 1.425 / 1.00 = 86.147... -> derated 86.1
        MOUNTAIN : 122.76 / 1.425 / 1.18 = 73.007... -> derated 73.0
        (rounding half up instead of flooring would give 79.8 on ROLLING, which is exactly the value
         that flips the NY route-range boundary instance)
      DSL-100 (100.0 gal, 7.2 mpg, cold 0.03, reserve 0.05), FLAT:
        nominal = floor(720.0) = 720 ; derated = 100.0*0.95*7.2*0.97/1.00 = 663.48 -> 663.4
      PROP-98 (98.0 gal, 5.4 mpg, cold 0.04, reserve 0.05), FLAT:
        nominal = floor(529.2) = 529 ; derated = 98.0*0.95*5.4*0.96/1.00 = 482.6304 -> 482.6

  - name: spec_compliance_evaluation
    trigger: "Bid create, POST /bids/{id}/revisions, POST /bids/{id}/submit, POST /bids/{id}/award, POST /contract-orders/{id}/units"
    algorithm: aggregation
    description: |
      Classifies an offered configuration against a StateSpecProfile. Four of the profile's demands are
      MANDATORY (they cannot be excepted) and the rest are EXCEPTABLE (a shortfall is recorded as an
      exception and the bid remains submittable).
    formula: |
      MANDATORY_ITEMS (in this fixed order):
        1. joint_strength      : offered_joint_strength_kn >= profile.min_joint_strength_kn
        2. rollover_protection : profile.requires_rollover_protection implies offered_rollover_reinforcement
        3. route_range         : derated_route_range_mi >= profile.required_route_range_mi
        4. emergency_exits     : offered_emergency_exit_count >= profile.min_emergency_exit_count
      EXCEPTABLE_ITEMS (in this fixed order):
        5. seat_capacity       : offered_seat_capacity >= profile.min_seat_capacity
        6. eight_lamp_system   : profile.requires_eight_lamp_system implies offered_eight_lamp_system
        7. crossing_arm        : profile.requires_crossing_arm implies offered_crossing_arm
        8. mirror_config       : offered_mirror_config is at least profile.required_mirror_config under
                                 STANDARD < CROSSVIEW < CROSSVIEW_HEATED
        9. lap_shoulder_belts  : profile.requires_lap_shoulder_belts implies offered_lap_shoulder_belts

      unmet_mandatory_items = the item names from MANDATORY_ITEMS that fail, in the order above
      exception_count       = the number of EXCEPTABLE_ITEMS that fail
      spec_compliance_status:
        NONCONFORMING      when unmet_mandatory_items is non-empty
        EXCEPTIONS_TAKEN   when unmet_mandatory_items is empty and exception_count >= 1
        CONFORMING         when unmet_mandatory_items is empty and exception_count == 0
      Evaluation is NONCONFORMING-dominant: a bid with three exceptions and one unmet mandatory item is
      NONCONFORMING, and exception_count is still reported.
    input_set: |
      Which profile is evaluated against depends on the operation, and this selection is part of the rule:
        - Bid create and POST /bids/{id}/revisions : the Solicitation's cited spec_profile_id, whatever
          its status is now (a bid may be drafted against a profile that has since been superseded)
        - POST /bids/{id}/submit                   : the profile that is PUBLISHED right now for
          (solicitation.state_code, solicitation.school_year); evaluated_spec_profile_id is rewritten to it
        - POST /bids/{id}/award                    : the award-time PUBLISHED profile, used only for the
          priceable upgrade in bid_unit_price.final_award; engineering items are NOT re-gated here
        - POST /contract-orders/{id}/units         : the order's spec_profile_id, re-gated for the
          mandatory engineering items only (route_range and joint_strength)
    worked_example: |
      CA offered config (78 seats, 6 exits, CROSSVIEW_HEATED, belts, lamp, arm, rollover,
      offered_joint_strength_kn 67.5, derated 79.7 on ROLLING) against CA-2027 (min_seat 78,
      exits 6, joint 62.5, rollover required, range 75.0, ROLLING):
        mandatory: 67.5 >= 62.5 ok ; rollover offered ok ; 79.7 >= 75.0 ok ; 6 >= 6 ok -> none unmet
        exceptable: all satisfied -> exception_count 0 -> CONFORMING
      Same config against CA-2027-R2 (identical but min_emergency_exit_count 7):
        mandatory item 4 fails -> unmet_mandatory_items ["emergency_exits"] -> NONCONFORMING
      NY offered config (71 seats, 5 exits, STANDARD, no belts, derated 79.7) against NY-2027
      (required_route_range_mi 79.7, min_seat 71, exits 5, STANDARD, belts not required):
        79.7 >= 79.7 ok -> CONFORMING (the boundary is inclusive)
      Same config against NY-2027-R2 (required_route_range_mi 79.8):
        79.7 >= 79.8 fails -> unmet_mandatory_items ["route_range"] -> NONCONFORMING

  - name: line_capacity_ledger
    trigger: "POST /build-slots/{id}/commit and POST /build-slots/{id}/release, including the CASCADE-A release"
    algorithm: aggregation
    description: |
      ProductionLine.committed_slot_days is a derived ledger over that line's BuildSlots. It is
      maintained incrementally by the commit and release transitions, and the incremental value must
      always equal this recomputation from scratch.
    formula: |
      committed_slot_days = sum(slot.slot_days for slot in BuildSlot
                                where slot.production_line_id == line.id
                                  and slot.status IN {COMMITTED, IN_PROGRESS, COMPLETED})
      slot_days = (end_date - start_date) in whole days, with end_date EXCLUSIVE
      A PLANNED slot contributes 0 (it is a reservation request, not a booking). A RELEASED slot
      contributes 0 whatever it contributed before. A COMPLETED slot still contributes — the horizon
      capacity is consumed for the whole planning horizon, not freed on completion.
      INVARIANT line_slot_day_conservation: after any commit followed by the release of that same slot,
      committed_slot_days returns to its exact pre-commit value.
    input_set: "one ProductionLine's slots; slots on other lines never contribute"
    precision: "whole days, exact integer arithmetic"
    worked_example: |
      Line L-A1 (horizon_slot_day_capacity 30): slots [2026-09-07, 2026-09-14) = 7 days,
      [2026-09-14, 2026-09-21) = 7 days, [2026-09-21, 2026-09-24) = 3 days.
      Committing all three gives committed_slot_days 17. Releasing the middle one gives 10.
      A fourth request for 14 days would need 17 + 14 = 31 > 30 and is refused; 13 days fits exactly.

  - name: delivery_posture
    trigger: "the exhaustive recomputation points listed in the formula; never on a GET and never on POST /_clock/set_current_utc"
    algorithm: forward_looking
    description: |
      A ContractOrder's delivery_posture, computed from the logical clock, the promised delivery date,
      and how many of the order's units are not yet on a committed slot.
    formula: |
      clock_date          = the logical clock's current UTC date
      at_risk_unit_count  = (unit_count - created_unit_count)
                            + count(units of this order with production_status == PLANNED)
      days_to_promise     = (promised_delivery_date - clock_date) in whole days
      posture:
        BREACHED  when clock_date > promised_delivery_date and delivered_unit_count < unit_count
        AT_RISK   when not BREACHED and at_risk_unit_count >= 1 and days_to_promise < REPLAN_LEAD_DAYS
        ON_TRACK  otherwise
      BREACHED is absorbing: once an order is BREACHED it never returns to AT_RISK or ON_TRACK, even
      after every unit is delivered and the order becomes FULFILLED.
      RECOMPUTATION POINTS (exhaustive): unit creation, slot commit, slot release, build advance,
      certify, waive-nonconformance, deliver, and the quality-test FAIL cascade. The posture is NOT
      recomputed by any GET and NOT recomputed by POST /_clock/set_current_utc — advancing the clock
      past the promised date does not by itself move the posture; the next declared transition does.
    constants:
      REPLAN_LEAD_DAYS: 45
      FINISH_LEAD_DAYS: 21
    input_set: "the units of one ContractOrder plus the logical clock"
    worked_example: |
      TX order: unit_count 1, promised_delivery_date 2026-10-05, clock 2026-09-01, no unit created yet.
        at_risk_unit_count = (1 - 0) + 0 = 1 ; days_to_promise = 34 < 45 -> AT_RISK
      After the unit is created and its slot committed (clock still 2026-09-01):
        at_risk_unit_count = 0 + 0 = 0 -> ON_TRACK
      Clock set to 2026-10-20 (no recomputation yet, still ON_TRACK); then a quality test FAILs, which
      cascades to a slot release and reverts the unit to PLANNED:
        clock_date 2026-10-20 > 2026-10-05 and delivered 0 < 1 -> BREACHED

  - name: liquidated_damages
    trigger: "every delivery_posture recomputation that lands on BREACHED"
    algorithm: threshold
    description: |
      Damages charged on a BREACHED ContractOrder, per late unit per day, capped at a percentage of the
      contract total. Recomputed only when the posture is recomputed and lands on BREACHED.
    formula: |
      days_late = (clock_date - promised_delivery_date) in whole days
      raw       = round_half_up(at_risk_unit_count * days_late * LD_CENTS_PER_UNIT_PER_DAY)
      cap       = round_half_up(total_contract_cents * LD_CAP_PCT)
      liquidated_damages_cents = min(raw, cap)
      A non-BREACHED order has liquidated_damages_cents 0. The value is recomputed (not accumulated)
      on each BREACHED recomputation, so it can go up as the clock advances but is never additive.
    constants:
      LD_CENTS_PER_UNIT_PER_DAY: 7500
      LD_CAP_PCT: 0.05
    precision: "integer cents; round_half_up on both the raw amount and the cap"
    worked_example: |
      TX order (total_contract_cents 16,090,216, promised 2026-10-05, clock 2026-10-20, 1 at-risk unit):
        days_late = 15 ; raw = 1 * 15 * 7500 = 112,500 ; cap = round_half_up(804,510.80) = 804,511
        liquidated_damages_cents = 112,500 (raw below cap)
      Same order at clock 2026-12-31: days_late = 87 -> raw = 652,500, still below the cap.
      Same order at clock 2027-04-01: days_late = 178 -> raw = 1,335,000 > cap -> 804,511 (capped).

  - name: recall_scope
    trigger: "POST /recall-campaigns/{id}/launch"
    algorithm: chronological
    description: |
      The set of delivered buses a RecallCampaign covers, and the order in which their RemedyTasks are
      created. The build window is a CLOSED date interval on the unit's delivered_at date.
    formula: |
      affected units = BusUnit rows where
        unit.bus_model_id == campaign.affected_bus_model_id
        AND the unit's PropulsionPackage.propulsion_type == campaign.affected_propulsion_type
        AND unit.production_status == DELIVERED
        AND date(unit.delivered_at) >= campaign.build_window_start
        AND date(unit.delivered_at) <= campaign.build_window_end        # both endpoints included
        AND unit.dealer_id IS NOT NULL
      ordering: delivered_at ASC, then created_at ASC as the only tie-break
      affected_unit_count = the size of that set, frozen at launch; later deliveries that would have
      matched the window are NOT swept in by an already-LAUNCHED campaign.
      A unit whose service_status is already RECALL_OPEN from another campaign is still included — one
      unit may carry tasks from several campaigns.
    input_set: "DELIVERED BusUnits only; PLANNED / SLOTTED / BODY_JOINED / BUILT units are never in scope"
    worked_example: |
      Campaign RC-DSL-01 (affected_bus_model TYPE_C_CONV, affected_propulsion_type DIESEL,
      build_window 2026-01-01 .. 2026-07-31, kits_per_unit 1, total_kits 5) with two legacy DIESEL
      TYPE_C units delivered 2026-05-10 and 2026-06-02, plus one delivered 2026-08-14:
        affected_unit_count = 2, task order = [2026-05-10 unit, 2026-06-02 unit]
        the 2026-08-14 unit is outside the closed window and gets no task
      A unit delivered exactly 2026-07-31 IS in scope; 2026-08-01 is not.

  - name: dealer_recall_exposure
    trigger: "campaign launch, POST /remedy-tasks/{id}/complete, POST /remedy-tasks/{id}/cancel, POST /bus-units/{id}/deliver"
    algorithm: threshold
    description: |
      A Dealer's open recall exposure and the certification_standing derived from it. Standing is a pure
      function of the count — it is never set directly by any endpoint.
    formula: |
      open_recall_unit_count = count(DISTINCT task.bus_unit_id for task in RemedyTask
                                     where task.dealer_id == dealer.id
                                       and task.status IN {OPEN, IN_PROGRESS})
      delivered_unit_count   = count(BusUnit where dealer_id == dealer.id and production_status == DELIVERED)
      certification_standing:
        SUSPENDED  when open_recall_unit_count >= DEALER_SUSPEND_THRESHOLD
        RESTRICTED when open_recall_unit_count >= DEALER_RESTRICT_THRESHOLD and < DEALER_SUSPEND_THRESHOLD
        GOOD       otherwise
      COMPLETED and CANCELLED tasks do not count. The count is by distinct unit, so two campaigns'
      tasks on the same bus contribute 1.
    constants:
      DEALER_RESTRICT_THRESHOLD: 2
      DEALER_SUSPEND_THRESHOLD: 4
      FACTORY_ESCALATION_EXTRA_KITS: 1
    worked_example: |
      Dealer D-TX-01 with 2 delivered DIESEL units, both swept into RC-DSL-01:
        open_recall_unit_count = 2 -> 2 >= 2 and 2 < 4 -> RESTRICTED
      Completing one task: open_recall_unit_count = 1 -> GOOD (but the already-escalated sibling task
      keeps escalation_level FACTORY_DIRECTED and its extra kit).
      A single dealer holding tasks on 4 distinct units -> SUSPENDED.

  - name: test_minimum_value
    trigger: "POST /quality-tests (scheduling) and POST /bus-units/{id}/certify (required-test-set check)"
    algorithm: threshold
    description: |
      The pass threshold written onto a QualityTest at scheduling time. Two of the five test types are
      measured against a number; the other three are pass/fail judgements with no measurement.
    formula: |
      min_required_value by test_type:
        JOINT_STRENGTH : the unit's StateSpecProfile.min_joint_strength_kn
        ROLLOVER       : round_half_up(bus_model.curb_weight_lb * ROLLOVER_KN_PER_LB, 2 decimals)
        BRAKE, EMERGENCY_EXIT, ELECTRICAL : null
      A test with min_required_value null must be recorded without measured_value, and supplying one is
      ignored. A test with a non-null min_required_value requires measured_value on record-result, and
      PASS additionally requires measured_value >= min_required_value.
      REQUIRED TEST SET for certification (profile-conditional):
        always              : BRAKE, EMERGENCY_EXIT, ELECTRICAL
        plus JOINT_STRENGTH : when profile.requires_joint_strength_test
        plus ROLLOVER       : when profile.requires_rollover_protection
    constants:
      ROLLOVER_KN_PER_LB: 0.0025
    worked_example: |
      TYPE_C_CONV (curb_weight_lb 21,500) ROLLOVER test: 21,500 * 0.0025 = 53.75 -> min_required_value 53.75
      CA-2027 (min_joint_strength_kn 62.5) JOINT_STRENGTH test: min_required_value 62.5
      CA-2027 requires both extra tests -> the required set has all five types.
      TX-2027 (requires_joint_strength_test false, requires_rollover_protection false) -> the required
      set is exactly {BRAKE, EMERGENCY_EXIT, ELECTRICAL} and a certify with no JOINT_STRENGTH test passes.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# Groups: 1-3 auth/shape, 4-17 existence, 18 entity-backed ownership, 19-20 OCC,
# 21-31 state preconditions, 32-40 safety/compliance, 41-45 duty & programme limits,
# 46-53 temporal, 54-62 referential/uniqueness, 63-68 fiscal & capacity (always last).
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: |
      Request shape: every required input field present; every field the declared type; every enum
      value in range; dates ISO-8601 date, instants ISO-8601 UTC with a trailing Z; integers
      non-negative where the field is a count or cents amount; limit in 1..100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "the StateSpecProfile named by the path or by spec_profile_id / evaluated_spec_profile_id exists"
    error_id: ERR_SPEC_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /state-spec-profiles/{id}*, POST /solicitations, POST /bids"

  - priority: 5
    category: existence
    check: "the BusModel named by the path or by bus_model_id / affected_bus_model_id exists"
    error_id: ERR_BUS_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "GET /bus-models/{id}, POST /propulsion-packages, POST /bids, POST /recall-campaigns, POST /dealers/{id}/legacy-fleet-records"

  - priority: 6
    category: existence
    check: "the PropulsionPackage named by the path or by propulsion_package_id exists"
    error_id: ERR_PROPULSION_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /propulsion-packages/{id}, POST /bids, POST /dealers/{id}/legacy-fleet-records"

  - priority: 7
    category: existence
    check: "the Solicitation named by the path or by solicitation_id exists"
    error_id: ERR_SOLICITATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /solicitations/{id}, POST /solicitations/{id}/close, POST /bids"

  - priority: 8
    category: existence
    check: "the Bid named by the path exists"
    error_id: ERR_BID_NOT_FOUND
    http_status: 404
    applies_to: "GET /bids/{id}, GET/POST /bids/{id}/revisions, POST /bids/{id}/submit, POST /bids/{id}/request-revision, POST /bids/{id}/award"

  - priority: 9
    category: existence
    check: "the ContractOrder named by the path exists"
    error_id: ERR_CONTRACT_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /contract-orders/{id}, POST /contract-orders/{id}/units"

  - priority: 10
    category: existence
    check: "the ProductionLine named by the path or by production_line_id exists"
    error_id: ERR_PRODUCTION_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /production-lines/{id}, POST /production-lines/{id}/status, POST /build-slots"

  - priority: 11
    category: existence
    check: "the BuildSlot named by the path exists"
    error_id: ERR_BUILD_SLOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /build-slots/{id}, POST /build-slots/{id}/commit, POST /build-slots/{id}/release"

  - priority: 12
    category: existence
    check: "the BusUnit named by the path or by bus_unit_id exists"
    error_id: ERR_BUS_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /bus-units/{id}, all POST /bus-units/{id}/* actions, POST /build-slots, POST /quality-tests"

  - priority: 13
    category: existence
    check: "the TestBay named by the path or by test_bay_id exists"
    error_id: ERR_TEST_BAY_NOT_FOUND
    http_status: 404
    applies_to: "GET /test-bays/{id}, POST /quality-tests"

  - priority: 14
    category: existence
    check: "the QualityTest named by the path exists"
    error_id: ERR_QUALITY_TEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /quality-tests/{id}, POST /quality-tests/{id}/record-result"

  - priority: 15
    category: existence
    check: "the Dealer named by the path or by dealer_id exists"
    error_id: ERR_DEALER_NOT_FOUND
    http_status: 404
    applies_to: "GET /dealers/{id}, POST /dealers/{id}/legacy-fleet-records, POST /bus-units/{id}/assign-dealer"

  - priority: 16
    category: existence
    check: "the RecallCampaign named by the path exists"
    error_id: ERR_RECALL_CAMPAIGN_NOT_FOUND
    http_status: 404
    applies_to: "GET /recall-campaigns/{id}, POST /recall-campaigns/{id}/launch"

  - priority: 17
    category: existence
    check: "the RemedyTask named by the path exists"
    error_id: ERR_REMEDY_TASK_NOT_FOUND
    http_status: 404
    applies_to: "GET /remedy-tasks/{id}, POST /remedy-tasks/{id}/start, /complete, /cancel"

  - priority: 18
    category: auth
    check: |
      For the entity-backed DealerAgent role, X-User-ID must equal the dealer_id of the RemedyTask or
      BusUnit being acted on. Checked after existence (the owner is unknown until the row is loaded)
      and before any state precondition, so a DealerAgent poking at another dealer's task learns
      nothing about that task's state.
    error_id: ERR_NOT_ASSIGNED_DEALER
    http_status: 403
    applies_to: "POST /remedy-tasks/{id}/start, POST /remedy-tasks/{id}/complete, POST /bus-units/{id}/complete-driver-training, POST /bus-units/{id}/deliver (DealerAgent only)"

  - priority: 19
    category: state
    check: "expected_bid_version equals the Bid's current version (§1.2.1 bid-revision-stale-bid)"
    error_id: ERR_STALE_BID_VERSION
    http_status: 412
    applies_to: "POST /bids/{id}/revisions"

  - priority: 20
    category: state
    check: "expected_production_line_version equals the ProductionLine's current version (§1.2.1 slot-create-stale-line)"
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412
    applies_to: "POST /build-slots"

  - priority: 21
    category: state
    check: "the StateSpecProfile being published is in status DRAFT"
    error_id: ERR_PROFILE_NOT_DRAFT
    http_status: 409
    applies_to: "POST /state-spec-profiles/{id}/publish"

  - priority: 22
    category: state
    check: "the Solicitation is OPEN (bid creation, bid revision, bid submit, request-revision, close)"
    error_id: ERR_SOLICITATION_NOT_OPEN
    http_status: 409
    applies_to: "POST /bids, POST /bids/{id}/revisions, POST /bids/{id}/submit, POST /bids/{id}/request-revision, POST /solicitations/{id}/close"

  - priority: 23
    category: state
    check: "the Solicitation is CLOSED at award time — a still-OPEN solicitation cannot be awarded"
    error_id: ERR_SOLICITATION_NOT_CLOSED
    http_status: 409
    applies_to: "POST /bids/{id}/award"

  - priority: 24
    category: state
    check: |
      The Bid is in a status the requested action allows: revisions require DRAFT or
      REVISION_REQUESTED; submit requires DRAFT; request-revision requires SUBMITTED; award requires
      SUBMITTED.
    error_id: ERR_BID_STATE_INVALID
    http_status: 409
    applies_to: "POST /bids/{id}/revisions, /submit, /request-revision, /award"

  - priority: 25
    category: state
    check: |
      The BusUnit's production_status permits the action: advance-build to BODY_JOINED requires
      SLOTTED, to BUILT requires BODY_JOINED; certify requires BUILT; deliver requires BUILT;
      slot commit requires PLANNED; quality-test scheduling requires SLOTTED, BODY_JOINED or BUILT.
    error_id: ERR_UNIT_PHASE_INVALID
    http_status: 409
    applies_to: "POST /bus-units/{id}/advance-build, /certify, /deliver, POST /build-slots/{id}/commit, POST /quality-tests"

  - priority: 26
    category: state
    check: "the BuildSlot's status permits the action: commit requires PLANNED; release requires PLANNED, COMMITTED or IN_PROGRESS"
    error_id: ERR_SLOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /build-slots/{id}/commit, POST /build-slots/{id}/release"

  - priority: 27
    category: state
    check: "the QualityTest is SCHEDULED when a result is recorded"
    error_id: ERR_TEST_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /quality-tests/{id}/record-result"

  - priority: 28
    category: state
    check: "the RecallCampaign is DRAFT when launched"
    error_id: ERR_CAMPAIGN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /recall-campaigns/{id}/launch"

  - priority: 29
    category: state
    check: "the RemedyTask status permits the action: start requires OPEN; complete requires OPEN or IN_PROGRESS; cancel requires OPEN or IN_PROGRESS"
    error_id: ERR_TASK_STATE_INVALID
    http_status: 409
    applies_to: "POST /remedy-tasks/{id}/start, /complete, /cancel"

  - priority: 30
    category: state
    check: "the ProductionLine is RUNNING when a slot on it is committed (cross-entity state gate)"
    error_id: ERR_LINE_DOWN_FOR_MAINTENANCE
    http_status: 409
    applies_to: "POST /build-slots/{id}/commit"

  - priority: 31
    category: state
    check: "the ContractOrder is ACTIVE when a unit is created against it"
    error_id: ERR_ORDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /contract-orders/{id}/units"

  - priority: 32
    category: business_safety
    check: "the Bid's spec_compliance_status, recomputed against the currently PUBLISHED profile, is not NONCONFORMING"
    error_id: ERR_SPEC_NONCONFORMING
    http_status: 422
    applies_to: "POST /bids/{id}/submit"

  - priority: 33
    category: business_safety
    check: "derated_route_range_mi >= the governing profile's required_route_range_mi (inclusive boundary)"
    error_id: ERR_ROUTE_RANGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /contract-orders/{id}/units, POST /bus-units/{id}/certify"

  - priority: 34
    category: business_safety
    check: "joint_strength_kn >= the governing profile's min_joint_strength_kn (inclusive boundary)"
    error_id: ERR_JOINT_STRENGTH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /contract-orders/{id}/units, POST /bus-units/{id}/certify"

  - priority: 36
    category: business_safety
    check: "recording PASS on a measured test requires measured_value >= min_required_value"
    error_id: ERR_MEASURED_VALUE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /quality-tests/{id}/record-result"

  - priority: 37
    category: business_safety
    check: |
      Every test type in the unit's profile-conditional required set (test_minimum_value) has a PASSED
      QualityTest. Evaluated BEFORE the profile-published gate at priority 54, so a unit missing tests
      whose profile has also been superseded reports the missing-test error.
    error_id: ERR_REQUIRED_TEST_MISSING
    http_status: 422
    applies_to: "POST /bus-units/{id}/certify"

  - priority: 38
    category: business_safety
    check: "the unit has no QualityTest in status FAILED"
    error_id: ERR_OPEN_TEST_FAILURE
    http_status: 422
    applies_to: "POST /bus-units/{id}/certify"

  - priority: 39
    category: business_safety
    check: "a nonconformance may only be waived when no FAILED test of the unit is of type BRAKE or ROLLOVER"
    error_id: ERR_WAIVER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /bus-units/{id}/waive-nonconformance"

  - priority: 40
    category: business_safety
    check: "the unit's certification_status is CERTIFIED or WAIVED before delivery"
    error_id: ERR_UNIT_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /bus-units/{id}/deliver"

  - priority: 41
    category: business_constraint
    check: |
      Segregation of duties: on award, X-User-ID must differ from the Bid's submitted_by_user_id; on
      certify, X-User-ID must not equal the recorded_by_user_id of any PASSED QualityTest of the unit.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bids/{id}/award, POST /bus-units/{id}/certify"

  - priority: 42
    category: business_constraint
    check: "revision_round + 1 <= MAX_REVISION_ROUNDS (3) on a new revision, and revision_round < 3 on request-revision"
    error_id: ERR_REVISION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /bids/{id}/revisions, POST /bids/{id}/request-revision"

  - priority: 43
    category: business_constraint
    check: "the unit's driver_training_status is COMPLETED before delivery"
    error_id: ERR_DRIVER_TRAINING_INCOMPLETE
    http_status: 409
    applies_to: "POST /bus-units/{id}/deliver"

  - priority: 44
    category: business_constraint
    check: "the target Dealer's certification_standing is GOOD when a unit is assigned to it"
    error_id: ERR_DEALER_STANDING_RESTRICTED
    http_status: 409
    applies_to: "POST /bus-units/{id}/assign-dealer"

  - priority: 45
    category: business_constraint
    check: "recall_scope yields at least one affected unit at launch"
    error_id: ERR_NO_AFFECTED_UNITS
    http_status: 422
    applies_to: "POST /recall-campaigns/{id}/launch"

  - priority: 46
    category: business_temporal
    check: "BuildSlot end_date is strictly after start_date (half-open window, so slot_days >= 1)"
    error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /build-slots"

  - priority: 47
    category: business_temporal
    check: |
      The requested [start_date, end_date) window does not overlap any non-RELEASED slot on the same
      ProductionLine. End-exclusive semantics: a slot ending 2026-09-14 and a slot starting 2026-09-14
      do not overlap.
    error_id: ERR_SLOT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /build-slots"

  - priority: 48
    category: business_temporal
    check: |
      Changeover buffer: let PRECEDING be the slot on the same line with status in
      {PLANNED, COMMITTED, IN_PROGRESS, COMPLETED} whose end_date <= new.start_date, ranked by
      end_date DESC then created_at DESC (first row wins; if there is no such slot the check is
      skipped). When PRECEDING.propulsion_type != new.propulsion_type, the gap
      (new.start_date - PRECEDING.end_date) in whole days must be >= line.changeover_buffer_days.
      Same propulsion_type requires no gap at all, so adjacency is legal.
    error_id: ERR_CHANGEOVER_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /build-slots"

  - priority: 49
    category: business_temporal
    check: "end_date + FINISH_LEAD_DAYS (21) <= the unit's ContractOrder.promised_delivery_date; skipped when the unit has no contract_order_id"
    error_id: ERR_SLOT_MISSES_DEADLINE
    http_status: 409
    applies_to: "POST /build-slots"

  - priority: 50
    category: business_temporal
    check: "QualityTest window_end is on or after window_start (closed interval, so a single-day window is legal)"
    error_id: ERR_INVALID_TEST_WINDOW
    http_status: 422
    applies_to: "POST /quality-tests"

  - priority: 51
    category: business_temporal
    check: |
      Test bay occupancy: the requested closed window [window_start, window_end] must not overlap any
      SCHEDULED or PASSED or FAILED test in the same bay, EXCEPT that ELECTRICAL tests may share a bay
      with other ELECTRICAL tests. Closed-interval semantics: window_end 2026-09-10 and window_start
      2026-09-10 DO collide. A non-ELECTRICAL test never shares, not even with an ELECTRICAL one.
    error_id: ERR_TEST_BAY_CONFLICT
    http_status: 409
    applies_to: "POST /quality-tests"

  - priority: 52
    category: business_temporal
    check: "promised_delivery_date <= the Solicitation's required_delivery_date at award"
    error_id: ERR_PROMISE_EXCEEDS_REQUIRED_DATE
    http_status: 422
    applies_to: "POST /bids/{id}/award"

  - priority: 53
    category: business_temporal
    check: "RecallCampaign build_window_end >= build_window_start, and legacy-fleet-record delivered_at is not after the logical clock"
    error_id: ERR_INVALID_BUILD_WINDOW
    http_status: 422
    applies_to: "POST /recall-campaigns, POST /dealers/{id}/legacy-fleet-records"

  - priority: 54
    category: business_referential
    check: |
      The governing StateSpecProfile is in status PUBLISHED. On unit creation the order's
      spec_profile_id must still be PUBLISHED; on certify the unit's spec_profile_id must still be
      PUBLISHED. Deliberately BELOW the safety checks at 32-40 so a request failing both reports the
      safety error.
    error_id: ERR_SPEC_PROFILE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /contract-orders/{id}/units, POST /bus-units/{id}/certify, POST /solicitations"

  - priority: 56
    category: business_referential
    check: "the PropulsionPackage's compatible_bus_model_id equals the chosen bus_model_id"
    error_id: ERR_PROPULSION_MODEL_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /bids, POST /dealers/{id}/legacy-fleet-records"

  - priority: 57
    category: business_referential
    check: "for an ELECTRIC package, battery_pack_count <= the BusModel's max_battery_bays"
    error_id: ERR_BATTERY_BAY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /propulsion-packages, POST /bids"

  - priority: 58
    category: business_referential
    check: "the BusUnit's BusModel.body_class appears in the ProductionLine's supported_body_classes"
    error_id: ERR_BODY_CLASS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /build-slots"

  - priority: 59
    category: business_referential
    check: "the requested test_type appears in the TestBay's supported_test_types"
    error_id: ERR_TEST_TYPE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /quality-tests"

  - priority: 60
    category: business_referential
    check: "the unit's registration_state_code appears in the Dealer's licensed_state_codes"
    error_id: ERR_DEALER_NOT_LICENSED_IN_STATE
    http_status: 422
    applies_to: "POST /bus-units/{id}/assign-dealer, POST /dealers/{id}/legacy-fleet-records"

  - priority: 61
    category: business_constraint
    check: "natural-key uniqueness: model_code, package_code, line_code, bay_code, dealer_code, campaign_code are each unique within their entity"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /bus-models, /propulsion-packages, /production-lines, /test-bays, /dealers, /recall-campaigns"

  - priority: 62
    category: business_constraint
    check: "vin is unique across BusUnit"
    error_id: ERR_VIN_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /contract-orders/{id}/units, POST /dealers/{id}/legacy-fleet-records"

  - priority: 63
    category: business_fiscal
    check: |
      provisional_unit_price_cents <= Solicitation.price_cap_cents_per_unit. Deliberately the LAST
      check on submit, so a bid that is both over cap and aimed at a CLOSED solicitation reports
      ERR_SOLICITATION_NOT_OPEN (priority 22).
    error_id: ERR_PRICE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /bids/{id}/submit"

  - priority: 64
    category: business_fiscal
    check: "line.committed_slot_days + slot.slot_days <= line.horizon_slot_day_capacity (aggregate capacity)"
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /build-slots/{id}/commit"

  - priority: 65
    category: business_fiscal
    check: "created_unit_count < unit_count — an order cannot mint more buses than it was awarded"
    error_id: ERR_ORDER_UNIT_COUNT_EXCEEDED
    http_status: 409
    applies_to: "POST /contract-orders/{id}/units"

  - priority: 66
    category: business_fiscal
    check: "total_kits >= affected_unit_count * kits_per_unit at launch"
    error_id: ERR_INSUFFICIENT_REMEDY_KITS
    http_status: 422
    applies_to: "POST /recall-campaigns/{id}/launch"

  - priority: 67
    category: business_fiscal
    check: |
      Aggregate bay concurrency: the number of SCHEDULED ELECTRICAL tests whose closed windows include
      any day of the requested window must stay below TestBay.max_concurrent_electrical. Each
      individual pairing is permitted by priority 51; only the collective count trips this rule.
    error_id: ERR_BAY_CONCURRENCY_LIMIT
    http_status: 409
    applies_to: "POST /quality-tests"

  - priority: 68
    category: business_fiscal
    check: "the logical clock instant supplied to POST /_clock/set_current_utc is a valid ISO-8601 UTC instant and is not earlier than 2026-08-01T00:00:00Z"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Flat topology: every collection is addressed at the root. Every list endpoint
# accepts limit/offset and returns the envelope's pagination fields.
# `?` marks an optional input.
# ---------------------------------------------------------------------------

endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Test-driving endpoint (§1.5 priority ladder rung 3). Sets the server's logical clock to an
      explicit UTC instant. The server's startup default logical clock is exactly
      2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that default and never
      falls back to real wall-clock time. Every date/deadline/window rule in this scaffold reads the
      logical clock, so runs are reproducible.
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects:
      - "the logical clock is set; no entity is recomputed, in particular no ContractOrder.delivery_posture"

  - method: POST
    path: "/state-spec-profiles"
    description: "Draft a state specification profile for a school year"
    roles: [ComplianceOfficer]
    code: 201
    input: ["state_code", "school_year", "min_seat_capacity", "min_emergency_exit_count", "min_joint_strength_kn", "required_route_range_mi", "requires_eight_lamp_system?", "requires_crossing_arm?", "required_mirror_config?", "requires_lap_shoulder_belts?", "requires_rollover_protection?", "requires_joint_strength_test?", "terrain_class?"]
    output: StateSpecProfile
    side_effects:
      - "created in status DRAFT with published_at null and superseded_by_profile_id null"

  - method: GET
    path: "/state-spec-profiles"
    description: "List specification profiles, filterable by state, school year, status and supersede pointer"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["state_code?", "school_year?", "status?", "superseded_by_profile_id?", "limit?", "offset?"]
    output: StateSpecProfile[]
    side_effects: []

  - method: GET
    path: "/state-spec-profiles/{id}"
    description: "Read one specification profile"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: StateSpecProfile
    side_effects: []

  - method: POST
    path: "/state-spec-profiles/{id}/publish"
    description: "Publish a DRAFT profile, superseding the prior PUBLISHED profile for the same state and school year"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StateSpecProfile
    side_effects:
      - "StateSpecProfile DRAFT -> PUBLISHED; published_at set to the logical clock"
      - "the prior PUBLISHED profile for the same (state_code, school_year) moves PUBLISHED -> SUPERSEDED and gets superseded_by_profile_id"

  - method: POST
    path: "/bus-models"
    description: "Register a bus body model"
    roles: [ComplianceOfficer]
    code: 201
    input: ["model_code", "body_class", "base_seat_capacity", "base_emergency_exit_count", "base_price_cents", "body_joint_strength_kn", "max_battery_bays", "curb_weight_lb"]
    output: BusModel
    side_effects: []

  - method: GET
    path: "/bus-models"
    description: "List bus models"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["body_class?", "limit?", "offset?"]
    output: BusModel[]
    side_effects: []

  - method: GET
    path: "/bus-models/{id}"
    description: "Read one bus model"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: BusModel
    side_effects: []

  - method: POST
    path: "/propulsion-packages"
    description: "Register a propulsion package against exactly one bus model"
    roles: [ComplianceOfficer]
    code: 201
    input: ["package_code", "compatible_bus_model_id", "propulsion_type", "option_price_cents", "cold_weather_derate_pct", "reserve_floor_pct", "battery_pack_count?", "usable_kwh?", "nominal_consumption_kwh_per_mi?", "hvac_load_kw?", "fuel_capacity_gal?", "rated_mpg?"]
    output: PropulsionPackage
    side_effects:
      - "for an ELECTRIC package, battery_pack_count is checked against the model's max_battery_bays"

  - method: GET
    path: "/propulsion-packages"
    description: "List propulsion packages, filterable by compatible model and propulsion type"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["compatible_bus_model_id?", "propulsion_type?", "limit?", "offset?"]
    output: PropulsionPackage[]
    side_effects: []

  - method: GET
    path: "/propulsion-packages/{id}"
    description: "Read one propulsion package"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: PropulsionPackage
    side_effects: []

  - method: POST
    path: "/production-lines"
    description: "Register a final-assembly line with its horizon capacity and changeover buffer"
    roles: [PlantScheduler]
    code: 201
    input: ["line_code", "plant_code", "supported_body_classes", "horizon_slot_day_capacity", "changeover_buffer_days"]
    output: ProductionLine
    side_effects:
      - "created RUNNING with committed_slot_days 0"

  - method: GET
    path: "/production-lines"
    description: "List production lines"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["plant_code?", "status?", "limit?", "offset?"]
    output: ProductionLine[]
    side_effects: []

  - method: GET
    path: "/production-lines/{id}"
    description: "Read one production line including its committed_slot_days ledger and version"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []

  - method: POST
    path: "/production-lines/{id}/status"
    description: "Take a line down for maintenance or bring it back up"
    roles: [PlantScheduler]
    code: 200
    input: ["status"]
    output: ProductionLine
    side_effects:
      - "ProductionLine RUNNING <-> DOWN_FOR_MAINTENANCE"
      - "increments ProductionLine.version by 1"

  - method: POST
    path: "/test-bays"
    description: "Register a quality test bay and the test types it supports"
    roles: [PlantScheduler]
    code: 201
    input: ["bay_code", "plant_code", "supported_test_types", "max_concurrent_electrical"]
    output: TestBay
    side_effects: []

  - method: GET
    path: "/test-bays"
    description: "List test bays"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["plant_code?", "limit?", "offset?"]
    output: TestBay[]
    side_effects: []

  - method: GET
    path: "/test-bays/{id}"
    description: "Read one test bay"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: TestBay
    side_effects: []

  - method: POST
    path: "/dealers"
    description: "Register a dealer in the delivery network"
    roles: [ContractsAdmin]
    code: 201
    input: ["dealer_code", "dealer_name", "licensed_state_codes", "training_capacity_per_month"]
    output: Dealer
    side_effects:
      - "created with certification_standing GOOD, delivered_unit_count 0 and open_recall_unit_count 0"

  - method: GET
    path: "/dealers"
    description: "List dealers, filterable by standing"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["certification_standing?", "limit?", "offset?"]
    output: Dealer[]
    side_effects: []

  - method: GET
    path: "/dealers/{id}"
    description: "Read one dealer including its derived recall exposure and standing"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: POST
    path: "/dealers/{id}/legacy-fleet-records"
    description: |
      Business endpoint (§1.5 priority ladder rung 2). Records a bus that was built and delivered
      through this dealer BEFORE the plant system went live, so recall and service campaigns can reach
      the installed base. The minted BusUnit is created directly in production_status DELIVERED,
      certification_status CERTIFIED, driver_training_status COMPLETED and is_legacy_import true, with
      contract_order_id null; its configuration is copied from the BusModel's base values and raised to
      the cited profile's mandates (the same max()/OR upgrade the award performs), its
      registration_state_code from the profile's state_code, and its nominal/derated range from
      range_validation. A legacy unit is never slotted, tested or advanced; it exists only as a service
      and recall subject.
    roles: [ContractsAdmin]
    code: 201
    input: ["bus_model_id", "propulsion_package_id", "spec_profile_id", "vin", "delivered_at"]
    output: BusUnit
    side_effects:
      - "creates a BusUnit in production_status DELIVERED / certification_status CERTIFIED / service_status NONE with is_legacy_import true and dealer_id set to the path dealer"
      - "the Dealer's delivered_unit_count is recomputed"
      - "no ContractOrder counter changes (the unit has no contract_order_id)"

  - method: POST
    path: "/solicitations"
    description: "Open a district or cooperative purchase solicitation citing a PUBLISHED spec profile"
    roles: [SalesEngineer]
    code: 201
    input: ["solicitation_code", "buyer_type", "buyer_name", "spec_profile_id", "unit_count", "required_delivery_date", "price_cap_cents_per_unit"]
    output: Solicitation
    side_effects:
      - "state_code and school_year are copied from the cited profile; status OPEN"

  - method: GET
    path: "/solicitations"
    description: "List solicitations, filterable by cited profile, status and buyer type"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["spec_profile_id?", "status?", "buyer_type?", "limit?", "offset?"]
    output: Solicitation[]
    side_effects: []

  - method: GET
    path: "/solicitations/{id}"
    description: "Read one solicitation"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: Solicitation
    side_effects: []

  - method: POST
    path: "/solicitations/{id}/close"
    description: "Close bidding on a solicitation so awards may be made"
    roles: [ContractsAdmin]
    code: 200
    input: []
    output: Solicitation
    side_effects:
      - "Solicitation OPEN -> CLOSED; no bid status changes"

  - method: POST
    path: "/bids"
    description: "Draft a bid on an OPEN solicitation with a concrete model, propulsion package and offered configuration"
    roles: [SalesEngineer]
    code: 201
    input: ["solicitation_id", "bus_model_id", "propulsion_package_id", "unit_count", "offered_seat_capacity", "offered_emergency_exit_count", "offered_mirror_config", "offered_lap_shoulder_belts", "offered_eight_lamp_system", "offered_crossing_arm", "offered_rollover_reinforcement"]
    output: Bid
    side_effects:
      - "evaluated_spec_profile_id set to the Solicitation's cited spec_profile_id"
      - "runs bid_unit_price provisional_firm into provisional_unit_price_cents; offered_joint_strength_kn computed"
      - "runs range_validation into nominal_range_mi and derated_route_range_mi"
      - "runs spec_compliance_evaluation into spec_compliance_status, exception_count and unmet_mandatory_items"
      - "created in status DRAFT with revision_round 0"

  - method: GET
    path: "/bids"
    description: "List bids, filterable by solicitation, model, package, evaluated profile and status"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["solicitation_id?", "bus_model_id?", "propulsion_package_id?", "evaluated_spec_profile_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: GET
    path: "/bids/{id}"
    description: "Read one bid including its provisional price, compliance verdict and version"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: POST
    path: "/bids/{id}/revisions"
    description: |
      Append a revision round to a bid, replacing its offered configuration. OCC-guarded on the parent
      Bid: expected_bid_version must equal the bid's current version (§1.2.1 bid-revision-stale-bid).
    roles: [SalesEngineer]
    code: 201
    input: ["expected_bid_version", "offered_seat_capacity", "offered_emergency_exit_count", "offered_mirror_config", "offered_lap_shoulder_belts", "offered_eight_lamp_system", "offered_crossing_arm", "offered_rollover_reinforcement", "note?"]
    output: BidRevision
    side_effects:
      - "creates a BidRevision with round_index = bid.revision_round + 1 and unit_price_cents from bid_unit_price provisional_firm"
      - "marks every earlier BidRevision of this bid is_superseded true"
      - "overwrites the Bid's offered_* fields, provisional_unit_price_cents, offered_joint_strength_kn, nominal_range_mi, derated_route_range_mi and its spec_compliance_* fields"
      - "moves the Bid REVISION_REQUESTED -> DRAFT (a DRAFT bid stays DRAFT) and sets revision_round"
      - "increments Bid.version by 1"

  - method: GET
    path: "/bids/{id}/revisions"
    description: "List the revision rounds of one bid in round_index order"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["is_superseded?", "limit?", "offset?"]
    output: BidRevision[]
    side_effects: []

  - method: POST
    path: "/bids/{id}/submit"
    description: "Submit a DRAFT bid, re-evaluating it against the currently PUBLISHED profile and the price cap"
    roles: [SalesEngineer]
    code: 200
    input: []
    output: Bid
    side_effects:
      - "evaluated_spec_profile_id rewritten to the currently PUBLISHED profile; spec_compliance_evaluation and range_validation re-run against it"
      - "Bid DRAFT -> SUBMITTED; submitted_at set to the logical clock; submitted_by_user_id set to X-User-ID"
      - "increments Bid.version by 1"

  - method: POST
    path: "/bids/{id}/request-revision"
    description: "Send a SUBMITTED bid back to the bidder for another revision round"
    roles: [ContractsAdmin]
    code: 200
    input: []
    output: Bid
    side_effects:
      - "Bid SUBMITTED -> REVISION_REQUESTED"
      - "increments Bid.version by 1"

  - method: POST
    path: "/bids/{id}/award"
    description: |
      Award a SUBMITTED bid on a CLOSED solicitation, minting the ContractOrder. Segregation of duties:
      the awarding X-User-ID must differ from the bid's submitted_by_user_id.
    roles: [ContractsAdmin]
    code: 201
    input: ["promised_delivery_date"]
    output: ContractOrder
    side_effects:
      - "runs the award-time spec upgrade into the order's awarded_* fields and awarded_joint_strength_kn"
      - "runs bid_unit_price final_award into awarded_unit_price_cents and contract_total into total_contract_cents"
      - "creates the ContractOrder ACTIVE / ON_TRACK with created_unit_count 0 and delivered_unit_count 0"
      - "Bid SUBMITTED -> AWARDED; sibling SUBMITTED / REVISION_REQUESTED bids on the solicitation -> REJECTED"
      - "Solicitation CLOSED -> AWARDED"
      - "increments Bid.version by 1"

  - method: GET
    path: "/contract-orders"
    description: "List contract orders, filterable by originating bid, spec profile and status"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["bid_id?", "spec_profile_id?", "status?", "delivery_posture?", "limit?", "offset?"]
    output: ContractOrder[]
    side_effects: []

  - method: GET
    path: "/contract-orders/{id}"
    description: "Read one contract order including its posture and liquidated damages; performs no recomputation"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: ContractOrder
    side_effects: []

  - method: POST
    path: "/contract-orders/{id}/units"
    description: |
      Mint one bus of the order's awarded configuration. Re-gates the mandatory engineering items
      (route range and joint strength) against the order's spec profile, which must still be PUBLISHED.
    roles: [PlantScheduler]
    code: 201
    input: ["vin"]
    output: BusUnit
    side_effects:
      - "creates a BusUnit in production_status PLANNED / certification_status PENDING / service_status NONE with the order's awarded_* configuration copied onto it"
      - "runs range_validation into the unit's nominal_range_mi and derated_route_range_mi"
      - "increments ContractOrder.created_unit_count and recomputes at_risk_unit_count and delivery_posture"

  - method: GET
    path: "/bus-units"
    description: "List buses, filterable by order, model, package, profile, dealer and either status dimension"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["contract_order_id?", "bus_model_id?", "propulsion_package_id?", "spec_profile_id?", "dealer_id?", "production_status?", "certification_status?", "service_status?", "limit?", "offset?"]
    output: BusUnit[]
    side_effects: []

  - method: GET
    path: "/bus-units/{id}"
    description: "Read one bus including all three status dimensions"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: BusUnit
    side_effects: []

  - method: POST
    path: "/bus-units/{id}/advance-build"
    description: "Advance a slotted bus through body joining and completion"
    roles: [PlantScheduler]
    code: 200
    input: ["to_status"]
    output: BusUnit
    side_effects:
      - "BusUnit SLOTTED -> BODY_JOINED (to_status BODY_JOINED) or BODY_JOINED -> BUILT (to_status BUILT)"
      - "the unit's BuildSlot moves COMMITTED -> IN_PROGRESS or IN_PROGRESS -> COMPLETED respectively"
      - "recomputes the owning ContractOrder's at_risk_unit_count and delivery_posture"

  - method: POST
    path: "/bus-units/{id}/certify"
    description: |
      Certify a BUILT bus. Requires the full profile-conditional test set PASSED, no FAILED test, the
      engineering minima met, the profile still PUBLISHED, and an identity other than the inspector who
      recorded the passing tests.
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BusUnit
    side_effects:
      - "BusUnit certification_status PENDING -> CERTIFIED (or WAIVED -> CERTIFIED); certified_at set"
      - "recomputes the owning ContractOrder's at_risk_unit_count and delivery_posture"

  - method: POST
    path: "/bus-units/{id}/waive-nonconformance"
    description: "Waive a non-safety-critical nonconformance on a NONCONFORMING bus, voiding its failed tests"
    roles: [ComplianceOfficer]
    code: 200
    input: ["waiver_justification"]
    output: BusUnit
    side_effects:
      - "BusUnit certification_status NONCONFORMING -> WAIVED; every FAILED QualityTest of the unit -> VOIDED"
      - "recomputes the owning ContractOrder's at_risk_unit_count and delivery_posture"

  - method: POST
    path: "/bus-units/{id}/assign-dealer"
    description: "Assign the delivering dealer, which must be licensed in the bus's registration state and in GOOD standing"
    roles: [ContractsAdmin]
    code: 200
    input: ["dealer_id"]
    output: BusUnit
    side_effects:
      - "sets BusUnit.dealer_id"

  - method: POST
    path: "/bus-units/{id}/complete-driver-training"
    description: "Record that the receiving district's driver training for this bus is complete"
    roles: [DealerAgent]
    code: 200
    input: []
    output: BusUnit
    side_effects:
      - "sets driver_training_status COMPLETED"

  - method: POST
    path: "/bus-units/{id}/deliver"
    description: "Deliver a certified, dealer-assigned, training-complete bus"
    roles: [ContractsAdmin, DealerAgent]
    code: 200
    input: []
    output: BusUnit
    side_effects:
      - "BusUnit production_status BUILT -> DELIVERED; delivered_at set to the logical clock"
      - "recomputes the Dealer's delivered_unit_count"
      - "recomputes the ContractOrder's delivered_unit_count, at_risk_unit_count and delivery_posture; ACTIVE -> FULFILLED when every unit is DELIVERED"

  - method: POST
    path: "/build-slots"
    description: |
      Plan a slot-day window on a line for one bus. The window is half-open [start_date, end_date):
      a slot ending on the 14th and one starting on the 14th do not overlap, but crossing propulsion
      families still needs the line's changeover_buffer_days of clear calendar between them.
      OCC-guarded on the parent ProductionLine (§1.2.1 slot-create-stale-line).
    roles: [PlantScheduler]
    code: 201
    input: ["expected_production_line_version", "production_line_id", "bus_unit_id", "start_date", "end_date"]
    output: BuildSlot
    side_effects:
      - "creates the BuildSlot in status PLANNED with slot_days = (end_date - start_date) in whole days and propulsion_type copied from the unit's package"
      - "increments ProductionLine.version by 1"
      - "committed_slot_days is NOT changed — a PLANNED slot books no capacity"

  - method: GET
    path: "/build-slots"
    description: "List build slots, filterable by line, bus and status"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["production_line_id?", "bus_unit_id?", "status?", "propulsion_type?", "limit?", "offset?"]
    output: BuildSlot[]
    side_effects: []

  - method: GET
    path: "/build-slots/{id}"
    description: "Read one build slot"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: BuildSlot
    side_effects: []

  - method: POST
    path: "/build-slots/{id}/commit"
    description: "Commit a planned slot, booking its slot-days against the line's horizon capacity"
    roles: [PlantScheduler]
    code: 200
    input: []
    output: BuildSlot
    side_effects:
      - "BuildSlot PLANNED -> COMMITTED; BusUnit production_status PLANNED -> SLOTTED"
      - "ProductionLine.committed_slot_days increases by slot_days (line_capacity_ledger) and ProductionLine.version increments by 1"
      - "recomputes the owning ContractOrder's at_risk_unit_count and delivery_posture"

  - method: POST
    path: "/build-slots/{id}/release"
    description: "Release a slot, returning its slot-days to the line and its bus to PLANNED"
    roles: [PlantScheduler]
    code: 200
    input: []
    output: BuildSlot
    side_effects:
      - "BuildSlot -> RELEASED; ProductionLine.committed_slot_days decreases by slot_days when the slot was COMMITTED or IN_PROGRESS, restoring the pre-commit value; ProductionLine.version increments by 1"
      - "the BusUnit's production_status reverts to PLANNED when it was SLOTTED, BODY_JOINED or BUILT"
      - "every SCHEDULED QualityTest of that bus -> VOIDED"
      - "recomputes the owning ContractOrder's at_risk_unit_count, delivery_posture and, when BREACHED, liquidated_damages_cents"

  - method: POST
    path: "/quality-tests"
    description: |
      Schedule a quality test for a bus in a bay over a CLOSED day window [window_start, window_end]:
      touching endpoints DO collide. ELECTRICAL tests may share a bay with other ELECTRICAL tests up to
      the bay's max_concurrent_electrical; every other type occupies the bay exclusively.
    roles: [QualityInspector]
    code: 201
    input: ["bus_unit_id", "test_bay_id", "test_type", "window_start", "window_end"]
    output: QualityTest
    side_effects:
      - "creates the QualityTest in status SCHEDULED with min_required_value from test_minimum_value"

  - method: GET
    path: "/quality-tests"
    description: "List quality tests, filterable by bus, bay, type and status"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["bus_unit_id?", "test_bay_id?", "test_type?", "status?", "limit?", "offset?"]
    output: QualityTest[]
    side_effects: []

  - method: GET
    path: "/quality-tests/{id}"
    description: "Read one quality test including its computed min_required_value"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: QualityTest
    side_effects: []

  - method: POST
    path: "/quality-tests/{id}/record-result"
    description: |
      Record a PASS or FAIL. A measured test (min_required_value not null) requires measured_value and
      PASS additionally requires measured_value >= min_required_value; an unmeasured test ignores any
      measured_value supplied. FAIL fires the four-hop CASCADE-A chain.
    roles: [QualityInspector]
    code: 200
    input: ["outcome", "measured_value?", "result_notes?"]
    output: QualityTest
    side_effects:
      - "QualityTest SCHEDULED -> PASSED or SCHEDULED -> FAILED; recorded_by_user_id and recorded_at set"
      - "on PASS: if the bus was NONCONFORMING and no FAILED test remains, certification_status NONCONFORMING -> PENDING"
      - "on FAIL: CASCADE-A hops 1-4 (unit -> NONCONFORMING, live slot -> RELEASED, line ledger and unit phase revert plus sibling tests VOIDED, order posture and liquidated_damages_cents recomputed)"

  - method: POST
    path: "/recall-campaigns"
    description: "Draft a safety recall campaign scoped to a model, a propulsion family and a closed delivery window"
    roles: [ComplianceOfficer]
    code: 201
    input: ["campaign_code", "affected_bus_model_id", "affected_propulsion_type", "defect_category", "build_window_start", "build_window_end", "kits_per_unit", "total_kits"]
    output: RecallCampaign
    side_effects:
      - "created DRAFT with available_kits = total_kits, reserved_kits 0, consumed_kits 0 and affected_unit_count 0"

  - method: GET
    path: "/recall-campaigns"
    description: "List recall campaigns, filterable by affected model and status"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["affected_bus_model_id?", "affected_propulsion_type?", "status?", "limit?", "offset?"]
    output: RecallCampaign[]
    side_effects: []

  - method: GET
    path: "/recall-campaigns/{id}"
    description: "Read one recall campaign including its kit pool counters"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: RecallCampaign
    side_effects: []

  - method: POST
    path: "/recall-campaigns/{id}/launch"
    description: "Launch a DRAFT campaign, fanning out remedy tasks over the delivered fleet in scope"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecallCampaign
    side_effects:
      - "runs recall_scope; freezes affected_unit_count; RecallCampaign DRAFT -> LAUNCHED with launched_at set"
      - "CASCADE-B hops 1-4 (one OPEN RemedyTask per affected bus in delivered_at ASC order, each bus -> RECALL_OPEN, each dealer's exposure and standing recomputed, DEALER_DIRECTED tasks of a non-GOOD dealer -> FACTORY_DIRECTED, each escalation reserving one extra kit or incrementing kit_shortfall_count)"

  - method: GET
    path: "/remedy-tasks"
    description: "List remedy tasks, filterable by campaign, bus, dealer, status and escalation level"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: ["recall_campaign_id?", "bus_unit_id?", "dealer_id?", "status?", "escalation_level?", "limit?", "offset?"]
    output: RemedyTask[]
    side_effects: []

  - method: GET
    path: "/remedy-tasks/{id}"
    description: "Read one remedy task"
    roles: [SalesEngineer, ContractsAdmin, PlantScheduler, QualityInspector, ComplianceOfficer, DealerAgent]
    code: 200
    input: []
    output: RemedyTask
    side_effects: []

  - method: POST
    path: "/remedy-tasks/{id}/start"
    description: "The assigned dealer starts the remedy work"
    roles: [DealerAgent]
    code: 200
    input: []
    output: RemedyTask
    side_effects:
      - "RemedyTask OPEN -> IN_PROGRESS; no kit counters change"

  - method: POST
    path: "/remedy-tasks/{id}/complete"
    description: "The assigned dealer completes the remedy, consuming its reserved kits"
    roles: [DealerAgent]
    code: 200
    input: []
    output: RemedyTask
    side_effects:
      - "RemedyTask -> COMPLETED; completed_at set"
      - "campaign.consumed_kits += kits_reserved and campaign.reserved_kits -= kits_reserved, leaving available_kits unchanged"
      - "the bus's service_status RECALL_OPEN -> RECALL_CLOSED once it has no OPEN / IN_PROGRESS task left"
      - "recomputes the Dealer's open_recall_unit_count and certification_standing"
      - "RecallCampaign LAUNCHED -> COMPLETED when every task is terminal"

  - method: POST
    path: "/remedy-tasks/{id}/cancel"
    description: "Compliance cancels a remedy task, returning its reserved kits to the campaign pool"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RemedyTask
    side_effects:
      - "RemedyTask -> CANCELLED; campaign.reserved_kits -= kits_reserved and available_kits += kits_reserved; consumed_kits untouched"
      - "the bus's service_status returns to RECALL_CLOSED if it has a COMPLETED task, otherwise to NONE"
      - "recomputes the Dealer's open_recall_unit_count and certification_standing"
      - "RecallCampaign LAUNCHED -> COMPLETED when every task is terminal"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (one entry per §1.4 rule, in priority order)
# ---------------------------------------------------------------------------

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role names a role that is not declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request: missing required field, wrong type, out-of-range enum, bad date format, or limit/offset outside 1..100 / >= 0"
  - id: ERR_SPEC_PROFILE_NOT_FOUND
    http: 404
    condition: "Referenced StateSpecProfile id does not exist"
  - id: ERR_BUS_MODEL_NOT_FOUND
    http: 404
    condition: "Referenced BusModel id does not exist"
  - id: ERR_PROPULSION_PACKAGE_NOT_FOUND
    http: 404
    condition: "Referenced PropulsionPackage id does not exist"
  - id: ERR_SOLICITATION_NOT_FOUND
    http: 404
    condition: "Referenced Solicitation id does not exist"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "Referenced Bid id does not exist"
  - id: ERR_CONTRACT_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced ContractOrder id does not exist"
  - id: ERR_PRODUCTION_LINE_NOT_FOUND
    http: 404
    condition: "Referenced ProductionLine id does not exist"
  - id: ERR_BUILD_SLOT_NOT_FOUND
    http: 404
    condition: "Referenced BuildSlot id does not exist"
  - id: ERR_BUS_UNIT_NOT_FOUND
    http: 404
    condition: "Referenced BusUnit id does not exist"
  - id: ERR_TEST_BAY_NOT_FOUND
    http: 404
    condition: "Referenced TestBay id does not exist"
  - id: ERR_QUALITY_TEST_NOT_FOUND
    http: 404
    condition: "Referenced QualityTest id does not exist"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "Referenced Dealer id does not exist"
  - id: ERR_RECALL_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "Referenced RecallCampaign id does not exist"
  - id: ERR_REMEDY_TASK_NOT_FOUND
    http: 404
    condition: "Referenced RemedyTask id does not exist"
  - id: ERR_NOT_ASSIGNED_DEALER
    http: 403
    condition: "A DealerAgent acted on a RemedyTask or BusUnit whose dealer_id differs from X-User-ID"
  - id: ERR_STALE_BID_VERSION
    http: 412
    condition: "expected_bid_version does not match the Bid's current version on POST /bids/{id}/revisions"
  - id: ERR_STALE_LINE_VERSION
    http: 412
    condition: "expected_production_line_version does not match the ProductionLine's current version on POST /build-slots"
  - id: ERR_PROFILE_NOT_DRAFT
    http: 409
    condition: "Publish attempted on a StateSpecProfile that is already PUBLISHED or SUPERSEDED"
  - id: ERR_SOLICITATION_NOT_OPEN
    http: 409
    condition: "Bid drafting, revision, submit, request-revision or close attempted while the Solicitation is CLOSED or AWARDED"
  - id: ERR_SOLICITATION_NOT_CLOSED
    http: 409
    condition: "Award attempted while the Solicitation is still OPEN (or already AWARDED)"
  - id: ERR_BID_STATE_INVALID
    http: 409
    condition: "The Bid's status does not permit the requested action (revise, submit, request-revision or award)"
  - id: ERR_UNIT_PHASE_INVALID
    http: 409
    condition: "The BusUnit's production_status does not permit the requested action (advance-build, certify, deliver, slot commit, test scheduling)"
  - id: ERR_SLOT_STATE_INVALID
    http: 409
    condition: "The BuildSlot's status does not permit commit or release (already COMPLETED or RELEASED)"
  - id: ERR_TEST_NOT_SCHEDULED
    http: 409
    condition: "Result recording attempted on a QualityTest that is already PASSED, FAILED or VOIDED"
  - id: ERR_CAMPAIGN_NOT_DRAFT
    http: 409
    condition: "Launch attempted on a RecallCampaign that is already LAUNCHED or COMPLETED"
  - id: ERR_TASK_STATE_INVALID
    http: 409
    condition: "The RemedyTask's status does not permit start, complete or cancel"
  - id: ERR_LINE_DOWN_FOR_MAINTENANCE
    http: 409
    condition: "Slot commit attempted while the ProductionLine is DOWN_FOR_MAINTENANCE"
  - id: ERR_ORDER_NOT_ACTIVE
    http: 409
    condition: "Unit creation attempted on a ContractOrder that is FULFILLED"
  - id: ERR_SPEC_NONCONFORMING
    http: 422
    condition: "Submit attempted on a Bid whose spec_compliance_status against the currently PUBLISHED profile is NONCONFORMING"
  - id: ERR_ROUTE_RANGE_INSUFFICIENT
    http: 422
    condition: "derated_route_range_mi is below the governing profile's required_route_range_mi"
  - id: ERR_JOINT_STRENGTH_INSUFFICIENT
    http: 422
    condition: "joint_strength_kn is below the governing profile's min_joint_strength_kn"
  - id: ERR_MEASURED_VALUE_BELOW_MINIMUM
    http: 422
    condition: "PASS recorded on a measured test whose measured_value is below min_required_value"
  - id: ERR_REQUIRED_TEST_MISSING
    http: 422
    condition: "Certify attempted while a test type in the unit's profile-conditional required set has no PASSED QualityTest"
  - id: ERR_OPEN_TEST_FAILURE
    http: 422
    condition: "Certify attempted while the bus still has a FAILED QualityTest"
  - id: ERR_WAIVER_NOT_PERMITTED
    http: 422
    condition: "Waiver attempted on a bus whose FAILED tests include a BRAKE or ROLLOVER test"
  - id: ERR_UNIT_NOT_CERTIFIED
    http: 422
    condition: "Delivery attempted on a bus whose certification_status is PENDING or NONCONFORMING"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID also submitted the bid being awarded, or recorded a passing test of the bus being certified"
  - id: ERR_REVISION_ROUND_LIMIT
    http: 409
    condition: "A further revision round would exceed MAX_REVISION_ROUNDS (3)"
  - id: ERR_DRIVER_TRAINING_INCOMPLETE
    http: 409
    condition: "Delivery attempted while driver_training_status is PENDING"
  - id: ERR_DEALER_STANDING_RESTRICTED
    http: 409
    condition: "Dealer assignment attempted to a dealer whose certification_standing is RESTRICTED or SUSPENDED"
  - id: ERR_NO_AFFECTED_UNITS
    http: 422
    condition: "Launch attempted on a campaign whose recall_scope matches no delivered bus"
  - id: ERR_INVALID_SLOT_WINDOW
    http: 422
    condition: "BuildSlot end_date is not strictly after start_date"
  - id: ERR_SLOT_WINDOW_OVERLAP
    http: 409
    condition: "The requested half-open slot window overlaps a non-RELEASED slot on the same line"
  - id: ERR_CHANGEOVER_BUFFER_VIOLATION
    http: 409
    condition: "The gap to the preceding slot of a different propulsion_type is smaller than the line's changeover_buffer_days"
  - id: ERR_SLOT_MISSES_DEADLINE
    http: 409
    condition: "end_date plus FINISH_LEAD_DAYS (21) falls after the unit's ContractOrder.promised_delivery_date"
  - id: ERR_INVALID_TEST_WINDOW
    http: 422
    condition: "QualityTest window_end is before window_start"
  - id: ERR_TEST_BAY_CONFLICT
    http: 409
    condition: "The requested closed test window collides with an existing test in the same bay that may not be shared"
  - id: ERR_PROMISE_EXCEEDS_REQUIRED_DATE
    http: 422
    condition: "promised_delivery_date at award is after the Solicitation's required_delivery_date"
  - id: ERR_INVALID_BUILD_WINDOW
    http: 422
    condition: "RecallCampaign build_window_end precedes build_window_start, or a legacy delivered_at is after the logical clock"
  - id: ERR_SPEC_PROFILE_NOT_PUBLISHED
    http: 409
    condition: "The governing StateSpecProfile is DRAFT or SUPERSEDED when a unit is created, certified, or cited by a new solicitation"
  - id: ERR_PROPULSION_MODEL_INCOMPATIBLE
    http: 422
    condition: "The PropulsionPackage's compatible_bus_model_id differs from the chosen bus_model_id"
  - id: ERR_BATTERY_BAY_CAPACITY_EXCEEDED
    http: 422
    condition: "An ELECTRIC package's battery_pack_count exceeds the BusModel's max_battery_bays"
  - id: ERR_BODY_CLASS_UNSUPPORTED
    http: 422
    condition: "The bus's body_class is not in the ProductionLine's supported_body_classes"
  - id: ERR_TEST_TYPE_UNSUPPORTED
    http: 422
    condition: "The requested test_type is not in the TestBay's supported_test_types"
  - id: ERR_DEALER_NOT_LICENSED_IN_STATE
    http: 422
    condition: "The bus's registration_state_code is not in the Dealer's licensed_state_codes"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A natural-key code (model_code, package_code, line_code, bay_code, dealer_code, campaign_code) is already taken"
  - id: ERR_VIN_ALREADY_EXISTS
    http: 409
    condition: "The supplied vin already belongs to another BusUnit"
  - id: ERR_PRICE_CAP_EXCEEDED
    http: 422
    condition: "provisional_unit_price_cents exceeds the Solicitation's price_cap_cents_per_unit at submit"
  - id: ERR_LINE_CAPACITY_EXCEEDED
    http: 409
    condition: "Committing the slot would push committed_slot_days past the line's horizon_slot_day_capacity"
  - id: ERR_ORDER_UNIT_COUNT_EXCEEDED
    http: 409
    condition: "Unit creation attempted when created_unit_count already equals the order's unit_count"
  - id: ERR_INSUFFICIENT_REMEDY_KITS
    http: 422
    condition: "total_kits is below affected_unit_count * kits_per_unit at launch"
  - id: ERR_BAY_CONCURRENCY_LIMIT
    http: 409
    condition: "The bay already holds max_concurrent_electrical overlapping SCHEDULED ELECTRICAL tests"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 422
    condition: "The supplied current_utc is malformed or earlier than the startup default 2026-08-01T00:00:00Z"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation_of_duties
# Reads are shared by all six roles; every write is exclusive to one role except
# POST /bus-units/{id}/deliver, which ContractsAdmin and DealerAgent share.
# ---------------------------------------------------------------------------

roles:
  - name: SalesEngineer
    description: "Configures and prices bids against district and cooperative solicitations, and revises them through negotiation rounds"
    identity: opaque
    exclusive_operations:
      - "POST /solicitations"
      - "POST /bids"
      - "POST /bids/{id}/revisions"
      - "POST /bids/{id}/submit"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
    notes: |
      The X-User-ID that submits a bid is stored as Bid.submitted_by_user_id and is barred from
      awarding that bid (ERR_SEGREGATION_OF_DUTIES) — the bar is on the identity, not the role.

  - name: ContractsAdmin
    description: "Runs the buy-side lifecycle: closes solicitations, awards contracts, maintains the dealer network and books deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /solicitations/{id}/close"
      - "POST /bids/{id}/request-revision"
      - "POST /bids/{id}/award"
      - "POST /dealers"
      - "POST /dealers/{id}/legacy-fleet-records"
      - "POST /bus-units/{id}/assign-dealer"
    shared_operations:
      - "every GET endpoint"
      - "POST /bus-units/{id}/deliver"
      - "POST /_clock/set_current_utc"

  - name: PlantScheduler
    description: "Owns lines, bays, build slots and the physical build progression of each bus"
    identity: opaque
    exclusive_operations:
      - "POST /production-lines"
      - "POST /production-lines/{id}/status"
      - "POST /test-bays"
      - "POST /contract-orders/{id}/units"
      - "POST /build-slots"
      - "POST /build-slots/{id}/commit"
      - "POST /build-slots/{id}/release"
      - "POST /bus-units/{id}/advance-build"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: QualityInspector
    description: "Schedules and records brake, emergency-exit, electrical, joint-strength and rollover tests"
    identity: opaque
    exclusive_operations:
      - "POST /quality-tests"
      - "POST /quality-tests/{id}/record-result"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
    notes: |
      The X-User-ID stored on a PASSED test's recorded_by_user_id is barred from certifying that bus
      (ERR_SEGREGATION_OF_DUTIES), even though certification is a different role's operation.

  - name: ComplianceOfficer
    description: "Publishes state specification profiles, registers models and packages, certifies buses and runs recall campaigns"
    identity: opaque
    exclusive_operations:
      - "POST /state-spec-profiles"
      - "POST /state-spec-profiles/{id}/publish"
      - "POST /bus-models"
      - "POST /propulsion-packages"
      - "POST /bus-units/{id}/certify"
      - "POST /bus-units/{id}/waive-nonconformance"
      - "POST /recall-campaigns"
      - "POST /recall-campaigns/{id}/launch"
      - "POST /remedy-tasks/{id}/cancel"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: DealerAgent
    description: "A dealer in the delivery network, acting on its own buses: driver training, delivery hand-off and recall remedy work"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /bus-units/{id}/complete-driver-training"
      - "POST /remedy-tasks/{id}/start"
      - "POST /remedy-tasks/{id}/complete"
    shared_operations:
      - "every GET endpoint"
      - "POST /bus-units/{id}/deliver"
      - "POST /_clock/set_current_utc"
    notes: |
      X-User-ID is the id of a Dealer row. On every exclusive operation and on the shared deliver
      operation, X-User-ID must equal the target RemedyTask.dealer_id or BusUnit.dealer_id, otherwise
      ERR_NOT_ASSIGNED_DEALER (§1.4 priority 18). ContractsAdmin may deliver any bus; a DealerAgent may
      deliver only its own.
