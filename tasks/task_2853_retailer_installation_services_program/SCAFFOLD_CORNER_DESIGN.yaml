            - "${ps3} == 'INSPECTION_SCHEDULED' — INSPECTION_FAILED is re-bookable"
            - "${ps4} == 'CLOSED' AND ${ac2} == 2 AND Project.${proj_id}.inspection_result == 'PASSED' — INSPECTION_PASSED -> CLOSED happens inside the same handler"
            - "After the PASSED result, Project.${proj_id}.inspection_slot_start == null AND inspection_slot_end == null"

