  - section: errors
    instances:
      - name: every_rejection_uses_the_same_error_envelope_across_status_classes
        claim_type: Violation → Error
        grounds:
          - response_envelope.error
          - errors.ERR_INVALID_REQUEST
          - errors.ERR_OUTING_NOT_FOUND
          - errors.ERR_CONTRACT_ALREADY_EXISTS
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
        distinguishing_aspect: "Four rejections drawn from four different HTTP classes (422, 404, 409, 402) must all come back in the identical envelope - response_type 'error', a data object holding exactly error_id and message, and the meta block still present - so no status class is allowed to invent its own shape or leak a partial entity."
        test_recipe:
          setup:
