              as: CourtRegistrar
              captures: { dc_a_id: $.data.id }
            - call: "POST /estates/${est_a_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C08A", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid_a_id}" }
              as: CourtRegistrar
              captures: { loa_a_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Mica Reyes", date_of_death: "2026-03-02", domicile_state: "OR", court_case_number: "PR-2737-C08B" }
              as: EstateAdmin
              captures: { est_b_id: $.data.id }
            - call: "POST /estates/${est_b_id}/fiduciaries"
