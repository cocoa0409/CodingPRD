  - rule_id: resource_temporal_overlap
    instances:
      - name: measurement_window_half_open_adjacency_allowed_and_partitioned_by_basis
        grounds:
          - validations[priority=71]
          - errors.ERR_MEASUREMENT_PERIOD_OVERLAP
          - entities.ComplianceMeasurement.fields.period_start
          - entities.ComplianceMeasurement.fields.period_end
          - entities.ComplianceMeasurement.fields.weighting_basis
          - state_machines.ComplianceMeasurement.DRAFT_to_VOIDED
        distinguishing_aspect: |
          This overlap resource is a HALF-OPEN window whose occupancy is PARTITIONED by
          weighting_basis and whose exclusion set is state-sensitive: abutting windows are
          legal (new period_start == existing period_end), a byte-identical window under the
          other basis is legal, and voiding a DRAFT releases the window for a re-cut. The other
          instance in this rule guards a CLOSED interval with a symmetric 30-minute buffer
          where abutment is ILLEGAL, so the two rules disagree about the adjacency boundary.
        test_recipe:
          setup:
            - "One institution and a logical clock at 2026-10-01T00:00:00Z so every window below is already closed."
            - "Measurement M1 on the DOLLAR_WEIGHTED series over [2026-07-01, 2026-08-01), left DRAFT."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Delta Community Capital Fund", ein: "110000015", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 500000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", weighting_basis: "DOLLAR_WEIGHTED" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", weighting_basis: "DOLLAR_WEIGHTED" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { adj_status: $.status, m2_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z", weighting_basis: "DOLLAR_WEIGHTED" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { straddle_status: $.status, straddle_code: $.data.error_id }
            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", weighting_basis: "COUNT_WEIGHTED" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { other_basis_status: $.status, m4_id: $.data.id }
            - call: "POST /cdfi/compliance-measurements/${m1_id}/void"
              payload: { void_reason: "WINDOW_RECUT" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", weighting_basis: "DOLLAR_WEIGHTED" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { recut_status: $.status, m5_id: $.data.id }
          assert:
            - "${adj_status} == 201"
            - "${straddle_status} == 409"
            - "${straddle_code} == ERR_MEASUREMENT_PERIOD_OVERLAP"
            - "${other_basis_status} == 201"
            - "${recut_status} == 201"
            - "ComplianceMeasurement.${m1_id}.state == VOIDED"
            - "ComplianceMeasurement.${m1_id}.void_reason == WINDOW_RECUT"
            - "ComplianceMeasurement.${m2_id}.state == DRAFT"
            - "ComplianceMeasurement.${m2_id}.weighting_basis == DOLLAR_WEIGHTED"
            - "ComplianceMeasurement.${m4_id}.state == DRAFT"
            - "ComplianceMeasurement.${m4_id}.weighting_basis == COUNT_WEIGHTED"
            - "ComplianceMeasurement.${m5_id}.state == DRAFT"
            - "ComplianceMeasurement.${m5_id}.verdict == PENDING"
            - "count(GET /cdfi/institutions/${inst_id}/compliance-measurements?state=DRAFT) == 3"
      - name: ta_slot_closed_interval_with_thirty_minute_buffer_rejects_abutment
        grounds:
          - validations[priority=72]
          - errors.ERR_TA_SLOT_CONFLICT
          - entities.TAEngagement.fields.scheduled_start_at
          - entities.TAEngagement.fields.scheduled_end_at
          - entities.TAEngagement.fields.borrower_id
          - state_machines.TAEngagement.SCHEDULED_to_NO_SHOW
        distinguishing_aspect: |
          Here the occupied resource is the BORROWER's calendar, the interval is CLOSED, and it
          is padded by 30 minutes on each side, so a slot starting exactly 30 minutes after the
          previous end (15:30 against a 15:00 end) is rejected while 15:31 is accepted - the
          off-by-one-minute pair pins the inclusive buffer boundary. Only SCHEDULED and
          COMPLETED sessions occupy the calendar, so a NO_SHOW releases it. The other instance
          in this rule uses a half-open window where abutment is explicitly ALLOWED and where
          occupancy is partitioned by a data attribute rather than by an owning entity.
        test_recipe:
          setup:
            - "One institution with one GEOCODED borrower."
            - "Engagement E1 booked for that borrower from 2026-09-02T14:00:00Z to 2026-09-02T15:00:00Z, left SCHEDULED, so its padded footprint runs 13:30 to 15:30 inclusive."
