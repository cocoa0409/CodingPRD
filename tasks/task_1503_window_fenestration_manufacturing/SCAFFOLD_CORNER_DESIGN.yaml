        test_recipe:
          setup:
            - "MN rule, V200, GP1, dealer; qty1 line in production on wave cap 10 (auto-unlock + relock cycle per break)"
            - "Chain: break u0 -> r1; resume; break r1 -> r2; resume; break r2 -> r3; resume; break r3 -> ERR"
