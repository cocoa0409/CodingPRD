              as_user_id: "${dir_id}"
            - call: "POST /clinicians"
              payload: { npi: "3000000002", full_name: "Tech Comb", role_type: "LAB_TECH", phone_e164: "+12025550301", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { lt_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "3000000003", full_name: "Phleb Comb", role_type: "PHLEBOTOMIST", phone_e164: "+12025550302", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { phleb_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "3000000004", full_name: "Provider Comb", role_type: "ORDERING_PROVIDER", phone_e164: "+12025550303", backup_clinician_id: "${dir_id}" }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { op_id: $.data.id }
            - call: "POST /instruments"
              payload: { instrument_code: "BCM-C1", analyte_panels_supported: ["CMP", "GLUC"], qc_buffer_minutes: 5 }
              as: LabDirector
              as_user_id: "${dir_id}"
              captures: { inst_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C001", full_name: "Adult A", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_a: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C002", full_name: "Adult B", date_of_birth: "1980-01-01" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_b: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-C003", full_name: "Neo C", date_of_birth: "2026-05-22" }
              as: LabTech
              as_user_id: "${lt_id}"
              captures: { pat_c: $.data.id }
            - call: "POST /patients/${pat_a}/lab-orders"
              payload: { ordering_clinician_id: "${op_id}", panel_code: "CMP", priority: "ROUTINE" }
              as: OrderingProvider
              as_user_id: "${op_id}"
