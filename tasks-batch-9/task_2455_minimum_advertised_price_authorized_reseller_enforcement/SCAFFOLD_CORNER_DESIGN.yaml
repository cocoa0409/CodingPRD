        distinguishing_aspect: "The cure edge requires clock now <= cure_deadline_at; at 2026-08-31, one day past 2026-08-30, the submission is refused with ERR_CURE_WINDOW_EXPIRED while the violation is still NOTICED (the sweep has not run)."
        test_recipe:
          setup: ["Violation V1 NOTICED with cure_deadline_at 2026-08-30; clock moved to 2026-08-31T00:00:00Z with no sweep executed."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *CLK0831
          trigger:
            - call: "POST /violations/${vio}/cure-submission"
              payload: { cure_evidence_url: "https://acme.example/proof/5", corrected_price_cents: 15000, evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: Reseller
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == 'ERR_CURE_WINDOW_EXPIRED'"
            - "Violation.${vio}.status == NOTICED"
            - "Violation.${vio}.cure_evidence_url == null"
            - "EnforcementNotice.${not1}.status == ISSUED"

      # --- side_effect_execution --------------------------------------------
      - name: sweep_executes_all_four_side_effect_families_in_one_call
        claim_type: side_effect_execution
        grounds: ["state_machines.ResellerAgreement.transitions.ACTIVE_to_EXPIRED", "state_machines.PricingException.transitions.APPROVED_to_EXPIRED", "state_machines.Violation.transitions.NOTICED_to_ESCALATED", "state_machines.Reseller.transitions.SUSPENDED_to_AUTHORIZED_by_sweep"]
        distinguishing_aspect: "A single sweep at 2027-07-01 reports all four counters at once: 1 expired agreement, 1 expired exception, 1 escalated violation and 1 reinstated reseller, each with its own cascade."
        test_recipe:
          setup: ["Agreement ACTIVE with term_ends_at 2027-06-30; APPROVED exception ending 2026-08-25; violation V1 NOTICED with cure_deadline_at 2026-08-30; reseller SUSPENDED until 2026-09-10."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - *OBS9000
            - *OBSEVAL2
            - *GETRESV2
            - *NOTICE2SUSP
