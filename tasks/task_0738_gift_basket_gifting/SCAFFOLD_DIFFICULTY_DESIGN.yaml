              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { probe_after_row_status: "$.data[0].import_row_status" }
          assert:
            - "probe_before_row_status == 'REJECTED' (all 5 units were tied up by Order_A's ALLOCATED reservation)"
            - "probe_after_row_status == 'ACCEPTED' (Order_A's cancel RELEASED its reservation, restoring available units to the pre-reservation baseline of 5 — the same 5 that were available before Order_A's recipient was ever imported)"

      - name: order_cancel_refunds_ytd_spend_cents_after_approval
        grounds:
          - calculations.ytd_spend_recompute
          - state_machines.CorporateOrder.{DRAFT,_ASSEMBLING}_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: CorporateAccount.ytd_spend_cents (money) — a different type of
          conserved quantity than Rule 9's other instance (physical inventory units). The forward
          action (APPROVE, which debits ytd_spend_cents by total_cost_cents) paired with its
          compensating action (cancel, which credits it back) must leave ytd_spend_cents exactly at
          its pre-approval value.
        test_recipe:
          setup:
            - "CorporateAccount ytd_spend_cents=0; Order (10 units @ 4000 = 40000, TIER_0, STANDARD loyalty) submitted and approved, so ytd_spend_cents becomes 40000 and production_status becomes ASSEMBLING."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Tau Corp", billing_email: "ap@tau.example", monthly_budget_cents: 200000, approval_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Desk Organizer", unit_cost_cents: 550, is_perishable: false, on_hand_qty: 100 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Organizer Basket", category: "CORPORATE_WELCOME", base_price_cents: 4000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /assembly-stations"
              payload: { name: "Station U", daily_capacity: 1000 }
              as: PlatformAdmin
              captures: { station_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "ONBOARDING", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Refund Recipient", email: "refund@example.com", shipping_address_line1: "26 Chestnut St", city: "Grants Pass", state_code: "OR", postal_code: "97526", country_code: "US", quantity: 10 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-17" }
              as: AccountManager
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/budget-decision"
              payload: { decision: "APPROVE", approver_user_id: "fin-appr-17", station_id: "${station_id}", scheduled_date: "2026-03-04T00:00:00Z" }
              as: FinanceApprover
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "CorporateAccount.${acct_id}.ytd_spend_cents == 40000 immediately before this trigger (post-APPROVE debit)"
            - "CorporateAccount.${acct_id}.ytd_spend_cents == 0 immediately after this trigger (the cancel's compensating credit exactly refunds the 40000 that was debited at APPROVE, restoring the pre-approval value)"
