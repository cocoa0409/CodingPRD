      - name: corner_calculation_applies_the_declared_constant_table
        claim_type: Constants Applied
        grounds:
          - calculations.allotment_release_ceiling
          - calculations.allotment_release_ceiling.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / allotment_ceiling_nested_min_with_fund_tiered_quarter_cap
          rationale: "That §1.8 instance reads both QUARTER_CAP_PCT and CASH_FLOW_FACTOR out of the constant table for two fund types across two quarters and asserts the resulting ceilings and binding_constraint values."

      - name: corner_calculation_rounding_precision_at_the_declared_step
        claim_type: Precision
        grounds:
          - calculations.reversion_carryforward_split
          - calculations.reversion_carryforward_split.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / carryforward_cap_rounded_per_row_before_cycle_rollup
          rationale: "That §1.8 instance pins per-row round_half_up before aggregation and shows the cycle rollup differs from rounding the aggregate, which is the precision claim."

      - name: corner_threshold_algorithm_at_the_boundary
        claim_type: threshold
        grounds:
          - calculations.cycle_balance_certification
          - errors[ERR_BUDGET_NOT_BALANCED]
        excluded_because:
          difficulty_instance: boundary_precision_check / certify_balance_at_exact_appropriable_ceiling_then_one_cent_over
          rationale: "That §1.8 instance certifies at exactly the appropriable ceiling and then fails one cent above it, covering the inclusive threshold in both directions."

      - name: corner_waterfall_allocation_consumes_candidates_in_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.reduction_scenario_waterfall
          - entities.ReductionScenario.fields.selected_package_ids
        excluded_because:
          difficulty_instance: boundary_precision_check / reduction_waterfall_empty_pool_then_inclusive_stop_at_exact_target
          rationale: "That §1.8 instance asserts the ordered candidate consumption, the inclusive stop at the exact target and the empty-pool error."

      - name: corner_constraint_propagation_order_is_pinned
        claim_type: constraint_propagation
        grounds:
          - calculations.emergency_appropriation_capacity
          - errors[ERR_EMERGENCY_EXCEEDS_RESERVE_CAPACITY]
        excluded_because:
          difficulty_instance: combinatorial_formula / emergency_capacity_pinned_four_step_order_excludes_pending_request
          rationale: "That §1.8 instance walks the four pinned steps and proves the requested row is excluded from step 1, so no fixed point is sought."

      - name: corner_dual_variant_results_diverge_on_the_same_data
        claim_type: Variant Divergence
        grounds:
          - calculations.appropriation_available_balance
          - entities.Appropriation.fields.available_cash_cents
          - entities.Appropriation.fields.available_authority_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / available_balance_cash_basis_vs_authority_basis_diverge
          rationale: "That §1.8 instance holds one appropriation and asserts both bases side by side, showing the cash basis and the authority basis disagree on identical data."

      - name: corner_dual_variant_selection_follows_the_request
        claim_type: Variant Selection
        grounds:
          - calculations.federal_moe_compliance.variants
          - endpoints[POST /fiscal/federal-grants/{id}/moe-assessment]
        excluded_because:
          difficulty_instance: dual_variant_calc / moe_single_year_vs_three_year_average_flips_verdict
          rationale: "That §1.8 instance selects each basis explicitly on the request body and shows the verdict flips, which is the variant-selection claim."

  # ===========================================================================
  # Section 4 — Validations (§1.4)
  # ===========================================================================
  - section: validations
    instances:
      - name: zero_monetary_amounts_return_invalid_amount_not_invalid_request
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: |
          Separates priority 6 from priority 7 on the same field: a zero is structurally a
          legal integer, so it clears the ERR_INVALID_REQUEST shape check and fails the
          sign check with ERR_INVALID_AMOUNT at 422 — while a non-integer string on the same
          field fails earlier at 400.
        test_recipe:
          setup:
            - "Agency DOT and BudgetCycle 2027 in phase DEVELOPMENT, no AgencyRequest yet"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 0 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 0 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
          assert:
            - "the first agency-request create returns HTTP 422 with error_id == ERR_INVALID_AMOUNT, not 400"
            - "no AgencyRequest row was created by the rejected call"
            - "the second create returns HTTP 201"
            - "the decision-package create with amount_cents 0 returns HTTP 422 with error_id == ERR_INVALID_AMOUNT"
            - "AgencyRequest.${req_id}.total_request_cents is still 1000000000 with no package attached"

      - name: performance_measure_with_target_not_above_baseline_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors[ERR_PERFORMANCE_TARGET_INVALID]
          - entities.PerformanceMeasure.fields.target_value
        distinguishing_aspect: |
          Strictness claim on the dedicated priority-8 rule: equality is a violation, not a
          pass, so target_value == baseline_value returns ERR_PERFORMANCE_TARGET_INVALID and
          so does target_value below baseline_value; only a strictly greater target is
          accepted. The error is the measure-specific code, never ERR_INVALID_AMOUNT.
        test_recipe:
          setup:
            - "Agency DOT, BudgetCycle 2027 in phase DEVELOPMENT, DRAFT AgencyRequest with one EXPANSION package of 400000000 and no PerformanceMeasure"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
