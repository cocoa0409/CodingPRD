              captures: { op_a: $.data.id }
            - call: "POST /atfm/operators"
              payload: { name: "Golf Aviation", operator_type: "GENERAL_AVIATION" }
              as: SystemAdministrator
              captures: { op_ga: $.data.id }
            - call: "POST /atfm/facilities/${fac}/capacity-forecasts"
              payload: { variant: "PLANNING", window_start: "2026-09-15T13:00:00Z", window_end: "2026-09-15T14:00:00Z" }
              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T14:00:00Z", controlled_rate: 12 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL1", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:02:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a1: $.data.id }
            - call: "POST /atfm/operators/${op_a}/flights"
              payload: { designator: "AAL2", origin: "KORD", arrival_facility_id: "${fac}", scheduled_arrival: "2026-09-15T13:07:00Z" }
              as: Operator
              as_user_id: "${op_a}"
              captures: { a2: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "POST /atfm/operators/${op_ga}/ga-requests"
              payload: { tmi_id: "${tmi}", requested_window_start: "2026-09-15T13:30:00Z", requested_window_end: "2026-09-15T14:00:00Z", priority_class: "STANDARD" }
              as: Operator
              as_user_id: "${op_ga}"
              captures: { gq1: $.data.id }
            - call: "POST /atfm/ga-requests/${gq1}/adjudicate"
              payload: { decision: "ACCOMMODATE" }
              as: FlowManager
              captures: { gq1_status: $.data.status, gaf1: $.data.accommodated_flight_id }
            - call: "POST /atfm/operators/${op_ga}/ga-requests"
              payload: { tmi_id: "${tmi}", requested_window_start: "2026-09-15T13:30:00Z", requested_window_end: "2026-09-15T14:00:00Z", priority_class: "HIGH_PRIORITY" }
              as: Operator
