scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: client_create_defaults_applied
        claim_type: defaults
        grounds: [entities.Client.fields.medicaid_resource_limit_cents, entities.Client.fields.status]

        distinguishing_aspect: "Omitting medicaid_resource_limit_cents applies the 200000 default; new client starts INTAKE_REVIEW with version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Default Dan", date_of_birth: "1988-08-08", ssn_last4: "4455", county_of_residence: "TRV", medicaid_enrolled: true }, as: FiduciaryAdmin, captures: { c_id: $.data.id, c_limit: $.data.medicaid_resource_limit_cents, c_st: $.data.status, c_v: $.data.version } }
          trigger: []
          assert:
            - "c_limit == 200000 (default applied)"
            - "c_st == INTAKE_REVIEW and c_v == 1"

      - name: client_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Client.fields.legal_name, "errors[ERR_INVALID_REQUEST]"]

        distinguishing_aspect: "Missing required legal_name is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { date_of_birth: "1988-08-08", ssn_last4: "4455", county_of_residence: "TRV", medicaid_enrolled: true }, as: FiduciaryAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: account_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.TrustAccount.fields.account_type, "errors[ERR_INVALID_REQUEST]"]

        distinguishing_aspect: "account_type outside {OPERATING, RESTRICTED, DEDICATED} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Client exists"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Enum Ed", date_of_birth: "1971-01-01", ssn_last4: "1212", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "SAVINGS_ACCT", bank_account_ref: "BA-EN-001" }, as: FinancialOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: budget_create_percent_sum_invalid_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.BudgetPlan.fields.lines, "errors[ERR_INVALID_REQUEST]"]

        distinguishing_aspect: "Plan line percents summing to 90 instead of exactly 100 are rejected at create."
        test_recipe:
          setup: ["ACTIVE client with VERIFIED entitlement"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Percent Pam", date_of_birth: "1966-06-06", ssn_last4: "3434", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
          trigger:
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 50 }, { category: "FOOD", percent: 40 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (percents must sum to exactly 100)"

      - name: resource_not_found_variants_primary
        claim_type: not_found
        grounds: ["errors[ERR_CLIENT_NOT_FOUND]", "errors[ERR_ACCOUNT_NOT_FOUND]", "errors[ERR_PLAN_NOT_FOUND]", "errors[ERR_DISBURSEMENT_NOT_FOUND]", "errors[ERR_DEPOSIT_NOT_FOUND]", "errors[ERR_ENTITLEMENT_NOT_FOUND]"]

        distinguishing_aspect: "GET on a random UUID for each of client/account/plan/disbursement/deposit/entitlement returns the resource-specific 404 error_id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /clients/11111111-1111-4111-8111-111111111111", payload: {}, as: FiduciaryAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /trust-accounts/22222222-2222-4222-8222-222222222222", payload: {}, as: FiduciaryAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /budget-plans/33333333-3333-4333-8333-333333333333", payload: {}, as: FiduciaryAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /disbursements/44444444-4444-4444-8444-444444444444", payload: {}, as: FiduciaryAdmin, captures: { e4: $.data.error_id } }
            - { call: "GET /deposits/55555555-5555-4555-8555-555555555555", payload: {}, as: FiduciaryAdmin, captures: { e5: $.data.error_id } }
            - { call: "GET /benefit-entitlements/66666666-6666-4666-8666-666666666666", payload: {}, as: FiduciaryAdmin, captures: { e6: $.data.error_id } }
          assert:
            - "e1 == ERR_CLIENT_NOT_FOUND and e2 == ERR_ACCOUNT_NOT_FOUND and e3 == ERR_PLAN_NOT_FOUND"
            - "e4 == ERR_DISBURSEMENT_NOT_FOUND and e5 == ERR_DEPOSIT_NOT_FOUND and e6 == ERR_ENTITLEMENT_NOT_FOUND"

      - name: resource_not_found_variants_secondary
        claim_type: not_found
        grounds: ["errors[ERR_COURT_ORDER_NOT_FOUND]", "errors[ERR_BOND_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]", "errors[ERR_SPEND_DOWN_NOT_FOUND]", "errors[ERR_AUDIT_NOT_FOUND]", "errors[ERR_CONSERVATOR_NOT_FOUND]"]

        distinguishing_aspect: "GET on a random UUID for each of court-order/bond/report/spend-down/audit/conservator returns the resource-specific 404 error_id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /court-orders/11111111-1111-4111-8111-111111111111", payload: {}, as: FiduciaryAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /surety-bonds/22222222-2222-4222-8222-222222222222", payload: {}, as: FiduciaryAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /accounting-reports/33333333-3333-4333-8333-333333333333", payload: {}, as: FiduciaryAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /spend-down-plans/44444444-4444-4444-8444-444444444444", payload: {}, as: FiduciaryAdmin, captures: { e4: $.data.error_id } }
            - { call: "GET /audit-cases/55555555-5555-4555-8555-555555555555", payload: {}, as: FiduciaryAdmin, captures: { e5: $.data.error_id } }
            - { call: "GET /conservators/66666666-6666-4666-8666-666666666666", payload: {}, as: FiduciaryAdmin, captures: { e6: $.data.error_id } }
          assert:
            - "e1 == ERR_COURT_ORDER_NOT_FOUND and e2 == ERR_BOND_NOT_FOUND and e3 == ERR_REPORT_NOT_FOUND"
            - "e4 == ERR_SPEND_DOWN_NOT_FOUND and e5 == ERR_AUDIT_NOT_FOUND and e6 == ERR_CONSERVATOR_NOT_FOUND"

      - name: client_create_extra_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Client]

        distinguishing_aspect: "Client-supplied id/created_at/version in the create body are ignored; the server mints its own id and version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients", payload: { legal_name: "Sys Fields Sue", date_of_birth: "1991-09-09", ssn_last4: "7878", county_of_residence: "TRV", medicaid_enrolled: false, id: "99999999-9999-4999-8999-999999999999", created_at: "2020-01-01T00:00:00.000Z", version: 42 }, as: FiduciaryAdmin, captures: { c_id: $.data.id, c_v: $.data.version } }
          assert:
            - "c_id != '99999999-9999-4999-8999-999999999999' (server-minted id)"
            - "c_v == 1 (client-supplied version 42 ignored)"

      - name: dedicated_account_excluded_from_countable_resources
        claim_type: computed_fields
        grounds: [entities.Client.fields.countable_resources_cents, entities.Client.fields.total_funds_cents]

        distinguishing_aspect: "DEDICATED account balances count toward total_funds_cents but are excluded from countable_resources_cents (SSA dedicated-account exclusion)."
        test_recipe:
          setup:
            - "ACTIVE medicaid client with OPERATING account (150000 posted) and DEDICATED account (80000 posted); ACTIVE bond"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Dee Dedicated", date_of_birth: "1957-07-17", ssn_last4: "5551", county_of_residence: "TRV", medicaid_enrolled: true }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-DD-001" }, as: FinancialOfficer, captures: { a1_id: $.data.id } }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "DEDICATED", bank_account_ref: "BA-DD-002" }, as: FinancialOfficer, captures: { a2_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a1_id}", source: "OTHER", amount_cents: 150000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d1_id: $.data.id } }
            - { call: "POST /deposits/${d1_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "POST /deposits", payload: { account_id: "${a2_id}", source: "SSA_BENEFIT", amount_cents: 80000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d2_id: $.data.id } }
            - { call: "POST /deposits/${d2_id}/post", payload: {}, as: FinancialOfficer }
          trigger:
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { total: $.data.total_funds_cents, countable: $.data.countable_resources_cents, at_risk: $.data.medicaid_at_risk } }
          assert:
            - "total == 230000 (both accounts)"
            - "countable == 150000 (DEDICATED 80000 excluded)"
            - "at_risk == false (150000 <= 200000 even though total_funds 230000 exceeds the limit)"

      - name: ledger_entry_immutability_and_append_only
        claim_type: immutability
        grounds: [entities.LedgerEntry]

        distinguishing_aspect: "LedgerEntry has id and created_at only (common_fields false): no version/updated_at fields, and entries only ever append (second post adds a row, never edits the first)."
        test_recipe:
          setup: ["ACTIVE client, OPERATING account, ACTIVE bond, one deposit of 40000 posted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Ledger Liz", date_of_birth: "1961-11-30", ssn_last4: "6662", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-LE-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 40000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d1_id: $.data.id } }
            - { call: "POST /deposits/${d1_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 10000, received_date: "2026-06-03" }, as: FinancialOfficer, captures: { d2_id: $.data.id } }
            - { call: "POST /deposits/${d2_id}/post", payload: {}, as: FinancialOfficer }
          trigger:
            - { call: "GET /trust-accounts/${a_id}/ledger", payload: {}, as: FinancialOfficer, captures: { le0_type: "$.data[0].entry_type", le0_bal: "$.data[0].balance_after_cents", le1_type: "$.data[1].entry_type", le1_bal: "$.data[1].balance_after_cents" } }
          assert:
            - "Two entries exist, chronological: le0_type == DEPOSIT_POSTED with le0_bal == 40000; le1_type == DEPOSIT_POSTED with le1_bal == 50000"
            - "LedgerEntry objects carry id and created_at but no version and no updated_at (immutable, append-only)"

      - name: clients_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope, entities.Client]

        distinguishing_aspect: "limit=1 pages a 2-client collection one row at a time with total_count 2 and has_more flipping true -> false at offset 1."
        test_recipe:
          setup: ["Two clients created"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Page One", date_of_birth: "1970-01-01", ssn_last4: "1000", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { p1_id: $.data.id } }
            - { call: "POST /clients", payload: { legal_name: "Page Two", date_of_birth: "1971-02-02", ssn_last4: "2000", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { p2_id: $.data.id } }
          trigger:
            - { call: "GET /clients?limit=1&offset=0", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients?limit=1&offset=1", payload: {}, as: FiduciaryAdmin }
          assert:
            - "Page 1: exactly 1 row, total_count == 2, has_more == true"
            - "Page 2: exactly 1 row, total_count == 2, has_more == false; the two pages return the two distinct client ids"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Client, state_machines.BenefitEntitlement, state_machines.TrustAccount, state_machines.BudgetPlan, state_machines.Disbursement, state_machines.Deposit, state_machines.CourtOrder, state_machines.SuretyBond, state_machines.AccountingReport, state_machines.SpendDownPlan, state_machines.AuditCase, state_machines.Conservator]

        distinguishing_aspect: "Every entity lands in its declared initial_state at creation: client INTAKE_REVIEW, entitlement PENDING_VERIFICATION, account OPEN, plan DRAFT, disbursement REQUESTED, deposit RECEIVED, order PETITIONED, bond PENDING, report DRAFTING, spend-down DRAFT, audit OPENED, conservator ACTIVE."
        test_recipe:
          setup: ["ACTIVE client with account and bond (setup creates each entity type once)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Init Ivan", date_of_birth: "1964-04-14", ssn_last4: "2323", county_of_residence: "TRV", medicaid_enrolled: true }, as: FiduciaryAdmin, captures: { c_id: $.data.id, st_client: $.data.status } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id, st_ent: $.data.status } }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-IN-001" }, as: FinancialOfficer, captures: { a_id: $.data.id, st_acct: $.data.status } }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id, st_bond: $.data.status } }
            - { call: "POST /court-orders", payload: { client_id: "${c_id}", order_type: "RESTRICTED_WITHDRAWAL", amount_limit_cents: 50000, petitioned_date: "2026-06-01", expiry_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { o_id: $.data.id, st_order: $.data.status } }
            - { call: "POST /conservators", payload: { client_id: "${c_id}", full_name: "Con Connie", court_case_number: "CV-2026-900", authority_scope: "ADVISORY", appointed_date: "2026-01-10" }, as: FiduciaryAdmin, captures: { cons_id: $.data.id, st_cons: $.data.status } }
            - { call: "POST /audit-cases", payload: { client_id: "${c_id}", authority: "SSA", scope: "CLIENT_ACCOUNT", period_start_date: "2026-01-01", period_end_date: "2026-05-31" }, as: ComplianceAuditor, captures: { au_id: $.data.id, st_audit: $.data.status } }
            - { call: "POST /accounting-reports", payload: { client_id: "${c_id}", report_type: "SSA_6233", period_start_date: "2025-06-01", period_end_date: "2026-05-31", basis: "CASH" }, as: CaseManager, as_user_id: "cm-1", captures: { r_id: $.data.id, st_report: $.data.status } }
          trigger:
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /spend-down-plans", payload: { client_id: "${c_id}", target_month: "2026-06", entries: [{ category: "MEDICAL", planned_amount_cents: 1000 }] }, as: CaseManager, as_user_id: "cm-1", captures: { sp_id: $.data.id, st_sp: $.data.status } }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id, st_plan: $.data.status } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Init Payee", category: "HOUSING", amount_cents: 5000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id, st_disb: $.data.status } }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 5000, received_date: "2026-06-05" }, as: FinancialOfficer, captures: { d_id: $.data.id, st_dep: $.data.status } }
          assert:
            - "st_client == INTAKE_REVIEW and st_ent == PENDING_VERIFICATION and st_acct == OPEN"
            - "st_bond == PENDING and st_order == PETITIONED and st_cons == ACTIVE"
            - "st_audit == OPENED and st_report == DRAFTING and st_sp == DRAFT"
            - "st_plan == DRAFT and st_disb == REQUESTED and st_dep == RECEIVED"

      - name: reject_released_disbursement_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Disbursement, "errors[ERR_INVALID_STATE]"]

        distinguishing_aspect: "RELEASED is not a from-state for reject; the attempt fails with ERR_INVALID_STATE and the disbursement stays RELEASED."
        test_recipe:
          setup: ["ACTIVE client, funded OPERATING account (50000), ACTIVE bond, APPROVED 2026-06 budget, disbursement 10000 RELEASED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: FiduciaryAdmin }
            - { call: "POST /clients", payload: { legal_name: "Rej Rick", date_of_birth: "1974-12-25", ssn_last4: "8181", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-RJ-001" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /surety-bonds", payload: { coverage_amount_cents: 5000000, coverage_start_date: "2026-01-01", coverage_end_date: "2027-01-01", premium_paid_through_date: "2026-12-31" }, as: FiduciaryAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /surety-bonds/${b_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /deposits", payload: { account_id: "${a_id}", source: "OTHER", amount_cents: 50000, received_date: "2026-06-02" }, as: FinancialOfficer, captures: { d_id: $.data.id } }
            - { call: "POST /deposits/${d_id}/post", payload: {}, as: FinancialOfficer }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "cm-1", captures: { p_id: $.data.id } }
            - { call: "POST /budget-plans/${p_id}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /budget-plans/${p_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "fo-1" }
