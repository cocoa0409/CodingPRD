  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: fee_schedule_periods_half_open_overlap_adjacency_and_equal_start_supersede
        grounds:
          - validations[priority=24]
          - errors.ERR_FEE_SCHEDULE_PERIOD_OVERLAP
          - state_machines.FeeSchedule.ADOPTED_to_SUPERSEDED
          - entities.FeeSchedule.fields.effective_start
          - entities.FeeSchedule.fields.effective_end
          - entities.FeeSchedule.fields.superseded_by_fee_schedule_id
        distinguishing_aspect: |
          RESOURCE = the grantee's sliding-fee period, with HALF-OPEN interval semantics
          [effective_start, effective_end). Three probes against the ADOPTED [2026-01-01, 2027-01-01)
          window separate the three regimes: adjacency at 2027-01-01 is ALLOWED (the endpoint is
          excluded), a strictly interior window is REJECTED with 409, and an EQUAL effective_start is
          neither allowed-in-parallel nor rejected — it supersedes the incumbent and back-links it.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health': an ADOPTED FeeSchedule covers [2026-01-01, 2027-01-01)"
            - "Three DRAFT schedules with valid two-band ladders exist: fsA [2027-01-01, 2028-01-01), fsB [2026-06-01, 2026-12-01), fsC [2026-01-01, 2027-01-01)"
            - "All three carry nominal_fee_cents 2500, at or below the 2500 cap, so the fiscal rule never fires"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - call: "POST /health-centers/${hc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2027-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fsA_id: $.data.id }
            - call: "POST /fee-schedules/${fsA_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /fee-schedules/${fsA_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /health-centers/${hc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-12-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fsB_id: $.data.id }
            - call: "POST /fee-schedules/${fsB_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /fee-schedules/${fsB_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /health-centers/${hc_id}/fee-schedules"
              payload: { fpg_year: 2026, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", nominal_fee_cents: 2500 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fsC_id: $.data.id }
            - call: "POST /fee-schedules/${fsC_id}/discount-tiers"
              payload: { tier_label: "NOMINAL_FULL", fpg_min_pct: 0, fpg_max_pct: 100, discount_kind: "NOMINAL", sort_order: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /fee-schedules/${fsC_id}/discount-tiers"
              payload: { tier_label: "FULL_CHARGE", fpg_min_pct: 100, discount_kind: "NONE", sort_order: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /health-centers/${hc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
              captures: { hc_v3: $.data.version }
            - call: "POST /fee-schedules/${fsA_id}/adopt"
              payload: { expected_health_center_version: "${hc_v3}" }
              as: BoardChair
              as_user_id: "${chair_id}"
              captures: { fsA_status: $.data.status }
            - call: "GET /health-centers/${hc_id}"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
              captures: { hc_v4: $.data.version }
            - call: "POST /fee-schedules/${fsB_id}/adopt"
              payload: { expected_health_center_version: "${hc_v4}" }
              as: BoardChair
              as_user_id: "${chair_id}"
            - call: "POST /fee-schedules/${fsC_id}/adopt"
              payload: { expected_health_center_version: "${hc_v4}" }
              as: BoardChair
              as_user_id: "${chair_id}"
              captures: { fsC_status: $.data.status }
          assert:
            - "${fsA_status} == ADOPTED  # adjacency at 2027-01-01 is allowed on the half-open convention"
            - "fsB adopt response status == 409 with data.error_id == ERR_FEE_SCHEDULE_PERIOD_OVERLAP"
            - "FeeSchedule.${fsB_id}.status == DRAFT"
            - "${fsC_status} == ADOPTED  # equal effective_start supersedes instead of conflicting"
            - "FeeSchedule.${fs_id}.status == SUPERSEDED and superseded_by_fee_schedule_id == ${fsC_id}"
            - "FeeSchedule.${fsC_id}.superseded_by_fee_schedule_id == null"
            - "${hc_v4} == ${hc_v3} + 1 and the failed fsB adopt did not bump HealthCenter.version"

      - name: board_seat_terms_closed_intervals_reject_adjacent_succession
        grounds:
          - validations[priority=25]
          - errors.ERR_BOARD_SEAT_OVERLAP
          - entities.BoardMember.fields.seat_number
          - entities.BoardMember.fields.term_start
          - entities.BoardMember.fields.term_end
          - state_machines.BoardMember.SEATED_to_RESIGNED
        distinguishing_aspect: |
          A DIFFERENT resource (a numbered board seat, not a grantee-wide fee period) with the
          OPPOSITE interval semantics: terms are CLOSED [term_start, term_end], so a successor whose
          term_start equals the incumbent's term_end is an OVERLAP and is rejected — the exact
          arrangement that the FeeSchedule instance accepts as legal adjacency. The identical
          successor payload succeeds once the incumbent resigns, because exclusivity is scoped to
          SEATED rows rather than to the raw date ranges.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health': board seat 1 is SEATED with the CLOSED term [2026-01-01, 2028-12-31]"
            - "A successor for seat 1 is proposed with term_start exactly 2028-12-31 and term_end 2031-12-31"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
          trigger:
            - call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "COMMUNITY", term_start: "2028-12-31T00:00:00Z", term_end: "2031-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /board-members/${chair_id}/resign"
              payload: { resignation_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { chair_term_end: $.data.term_end, chair_final_status: $.data.status }
            - call: "POST /health-centers/${hc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "COMMUNITY", term_start: "2028-12-31T00:00:00Z", term_end: "2031-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { successor_id: $.data.id, successor_status: $.data.status }
          assert:
            - "first trigger response status == 409 with data.error_id == ERR_BOARD_SEAT_OVERLAP  # closed intervals make term_start == term_end an overlap"
            - "${chair_final_status} == RESIGNED and ${chair_term_end} == 2026-08-01T00:00:00Z"
            - "third trigger response status == 201 and ${successor_status} == SEATED"
            - "BoardMember.${successor_id}.seat_number == 1 and patient_seat_qualified == false"
            - "HealthCenter.${hc_id}.seated_board_count == 1 and patient_seat_pct == 0.00"
            - "HealthCenter.${hc_id}.governance_posture == GOVERNANCE_DEFICIENT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: void_restores_patient_balance_with_zero_drift_after_a_granted_waiver
        grounds:
          - calculations.patient_balance_invariant
          - state_machines.Encounter.UNBILLED_to_VOID
          - state_machines.InabilityToPayWaiver.REQUESTED_to_GRANTED
          - validations[priority=17]
          - validations[priority=18]
          - errors.ERR_INABILITY_TO_PAY_PROTECTED
          - entities.Encounter.fields.waived_amount_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = money (Patient.patient_balance_cents, exact integer cents, drift
          tolerance 0). The void must subtract (patient_charge_cents - waived_amount_cents), not
          patient_charge_cents, so a waived encounter contributes ZERO on the way out and the balance
          returns to its exact pre-encounter value of 2500. The inability-to-pay protection is also
          proved to survive the compensation: a NONPAYMENT void is refused outright, and only a
          CODING_ERROR void is allowed to unwind the row.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health'"
            - "Patient 'Ada Rivera' is VERIFIED at 100.00 % (tier PARTIAL_A) and has one SELF_PAY Encounter with gross 12000 and patient_charge_cents 2500, so patient_balance_cents is 2500"
            - "A SECOND SELF_PAY Encounter dated 2026-03-10 with gross 12000 also charges 2500, taking the balance to 5000"
            - "An InabilityToPayWaiver on the second encounter is GRANTED by co-2, waiving 2500 and taking the balance back to 2500"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - *s_p1
            - *s_iv1
            - *s_iv1v
            - *s_enc1
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { bal_before: $.data.patient_balance_cents }
            - call: "POST /encounters"
              payload: { patient_id: "${p1_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-10T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 12000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { encW_id: $.data.id, encW_charge: $.data.patient_charge_cents }
            - call: "POST /encounters/${encW_id}/waivers"
              payload: { waiver_reason: "HARDSHIP_ATTESTATION" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { wvW_id: $.data.id }
            - call: "POST /waivers/${wvW_id}/decide"
              payload: { decision: "GRANT", decision_note: "hardship attested in person" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { wvW_waived: $.data.waived_amount_cents }
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { bal_after_waiver: $.data.patient_balance_cents }
          trigger:
            - call: "POST /encounters/${encW_id}/void"
              payload: { void_reason: "NONPAYMENT" }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /encounters/${encW_id}/void"
              payload: { void_reason: "CODING_ERROR" }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { encW_final_status: $.data.pps_claim_status }
          assert:
            - "${bal_before} == 2500 and ${encW_charge} == 2500"
            - "${wvW_waived} == 2500 and ${bal_after_waiver} == 2500  # 5000 - 2500"
            - "first trigger response status == 409 with data.error_id == ERR_INABILITY_TO_PAY_PROTECTED"
            - "second trigger response status == 200 and ${encW_final_status} == VOID"
            - "Encounter.${encW_id}.waived_amount_cents == 2500 and charge_adjustment_cents == -2500"
            - "Patient.${p1_id}.patient_balance_cents == 2500  # EXACTLY the pre-encounter value, zero drift"
            - "Patient.${p1_id}.patient_balance_cents == sum over non-VOID encounters of (patient_charge_cents - waived_amount_cents) == 2500 - 0"
            - "InabilityToPayWaiver.${wvW_id}.status == GRANTED  # the void does not reopen a decided waiver"

      - name: cap_acceptance_restores_scope_cardinalities_and_releases_every_held_row
        grounds:
          - calculations.scope_listing_invariant
          - state_machines.SiteVisitFinding.CAP_SUBMITTED_to_RESOLVED
          - state_machines.ScopeChangeRequest.HELD_to_SUBMITTED
          - state_machines.ServiceSite.ON_HOLD_to_PROPOSED
          - entities.HealthCenter.fields.open_condition_count
          - entities.HealthCenter.fields.operational_status
          - entities.HealthCenter.fields.scope_posture
        distinguishing_aspect: |
          A DIFFERENT conserved quantity TYPE: integer cardinalities and derived postures
          (open_condition_count, in_scope_site_count, operational_status, scope_posture) rather than
          money. Accepting the corrective action plan must unwind all five hops of the escalation
          cascade in a single request — counter back to 0, award back to ACTIVE, scope back to OPEN,
          the HELD request back to its recorded held_from_status, and the ON_HOLD site back to
          PROPOSED with hold_reason cleared — with held_from_status itself nulled so the restore
          cannot be replayed.
        test_recipe:
          setup:
            - "The full escalation state of instance finding_escalation_freezes_scope_and_holds_target_site_depth_five: at clock 2026-09-01 a sweep has escalated CONDITION finding 'CLIN-002', open_condition_count is 1, operational_status is CONDITIONS_IMPOSED, scope_posture is CHANGE_FROZEN, the ADD_SITE request is HELD with held_from_status SUBMITTED, and 'Eastside Annex' is ON_HOLD with hold_reason SCOPE_FROZEN"
            - "A CorrectiveActionPlan prepared by co-1 with target_completion_date 2026-08-30 (on or before cap_due_at 2026-08-31) has been submitted, moving the ESCALATED finding to CAP_SUBMITTED"
