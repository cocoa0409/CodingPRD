        distinguishing_aspect: "Reversing a POSTED deposit after part of the balance was already WIRED out (deposit 300000, wired 300000, balance 0) would drive balance to -300000 -> ERR_ESCROW_WOULD_GO_NEGATIVE."
        test_recipe:
          setup: ["An order CLEAR_TO_CLOSE with POSTED deposit 300000 and a WIRED disbursement 300000 (balance 0); attempt to reverse the deposit."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
