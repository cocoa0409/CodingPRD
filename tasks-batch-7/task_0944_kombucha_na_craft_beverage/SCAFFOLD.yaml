# =============================================================================
# Task 0944 — Kombucha & Non-Alcoholic Craft Beverage Production
# Seed tables §1.0 - §1.7
# =============================================================================

scenario: |
  944. Kombucha & Non-Alcoholic Craft Beverage Production: recipe & batch/SCOBY,
  fermentation & pH/QA log, keg/bottle run & lot, wholesale/self-distribution
  account, taproom & growler fill, subscription, compliance & labeling, inventory

domain_name: kombucha-na-craft-beverage

# All resource collections are top-level; there is no nested vendor/tenant root.
api_prefix: "/"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.1 - §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  state_machine_shape: parallel

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    The spine is a production pipeline (recipe -> SCOBY pitch -> vessel ->
    fermentation -> packaging run -> finished lot) that fans out into three
    independent demand channels (wholesale/self-distribution shipments,
    taproom keg pours and growler fills, subscription allocations) and fans
    back in through a recall/quarantine cascade. The domain's central fork is
    the 0.50 % ABV boundary: below it the product is a non-alcoholic beverage,
    at or above it the same liquid becomes an alcoholic beverage with a
    different label statement, an age-gated taproom sale, and a restricted set
    of distribution channels. Predicted (pre-package) ABV and measured
    (at-package) ABV are computed by different formulas and are allowed to
    disagree, which is what makes the fork hard.

# =============================================================================
# Declared constants — every threshold, window, cap, rate, fee, and tolerance
# referenced anywhere in this scaffold has its numeric value here.
# =============================================================================
constants:
  # --- ABV & labeling ---
  NA_ABV_THRESHOLD_PCT: 0.5            # at or above -> ALCOHOLIC; strictly below -> NON_ALCOHOLIC
  ABV_DIVERGENCE_TOLERANCE_PCT: 0.05   # measured may exceed projected by at most this, inclusive
  F2_ABV_GAIN_PCT_PER_DAY: 0.06
  F2_SUGAR_ABV_PCT_PER_GRAM_PER_LITER: 0.0125
  AGE_VERIFICATION_MIN_AGE_YEARS: 21

  # --- SCOBY culture ---
  SCOBY_GENERATION_CAP: 7              # generation_number strictly greater than 7 may never be created
  SCOBY_VITALITY_FLOOR: 40             # vitality at or above 40 may be pitched
  SCOBY_VITALITY_DECAY_PER_PITCH: 6
  SCOBY_VITALITY_DECAY_PER_GENERATION: 4
  SCOBY_REVERIFICATION_BONUS: 15
  SCOBY_REVERIFICATION_VALID_DAYS: 30  # a PASS is valid for 30 days, inclusive of day 30

  # --- Vessel ---
  VESSEL_HEADSPACE_PCT: 10             # batch volume must be at or below 90 % of capacity
  VESSEL_CIP_VALID_HOURS: 72           # pitch allowed on or before cip_completed_at + 72 h

  # --- Fermentation / QA log ---
  F1_PH_CEILING: 3.5                   # pH at or below 3.5 satisfies the F1 target
  F1_PH_WINDOW_MIN_DAYS: 5             # inclusive lower bound of the target-hit day index
  F1_PH_WINDOW_MAX_DAYS: 14            # inclusive upper bound of the target-hit day index
  F2_MAX_DAYS: 7                       # F2 may run at most 7 days, inclusive
  PH_HARD_FLOOR: 2.5                   # pH strictly below 2.5 is over-acidified
  PH_REGRESSION_TOLERANCE: 0.05        # rise of more than 0.05 over the prior reading is a regression
  QA_READING_MAX_GAP_DAYS: 2
  QA_MISSED_READING_GRACE_HOURS: 12
  F1_TEMP_MIN_C: 20.0                  # inclusive
  F1_TEMP_MAX_C: 30.0                  # inclusive
  TEMP_EXCURSION_FLAG_LIMIT: 2         # third excursion on one batch forces AT_RISK

  # --- Raw ingredient inventory ---
  INGREDIENT_EXPIRY_BUFFER_DAYS: 7     # lot must expire strictly after clock + 7 days to be usable

  # --- Packaging run ---
  PACKAGING_LOSS_ALLOWANCE_PCT: 3
  BLEND_MAX_SOURCE_BATCHES: 4          # at most 4 source draws per run, inclusive
  BLEND_MIN_DRAW_LITERS: 20.0          # each draw must be at or above 20.0 L
  KEG_FILL_LITERS: 19.5
  BOTTLE_FILL_LITERS: 0.375
  CAN_FILL_LITERS: 0.355

  # --- Shelf life / cold chain ---
  SHELF_LIFE_RAW_DAYS: 90
  SHELF_LIFE_PASTEURIZED_DAYS: 270
  COLD_CHAIN_MAX_C_RAW: 4.0
  COLD_CHAIN_MAX_C_PASTEURIZED: 21.0
  MIN_REMAINING_SHELF_DAYS: 14         # a lot needs strictly more than 14 days left to be allocated

  # --- Finished lot ---
  LOT_RELEASE_MIN_HOLD_HOURS: 48       # release allowed at or after packaged_at + 48 h
  LOT_QUARANTINE_CLEARANCE_CAP: 1      # a lot may be cleared from quarantine at most once

  # --- Keg asset & deposit ledger ---
  KEG_DEPOSIT_AMOUNT: 45.00
  KEG_RETURN_WINDOW_DAYS: 90           # returned on or before day 90 is on time
  KEG_LATE_FORFEIT_PCT: 40             # late but undamaged -> 40 % of the deposit is forfeited
  KEG_DAMAGE_FORFEIT_PCT: 100          # damaged -> whole deposit forfeited, keg scrapped
  KEG_BLOWOFF_ALLOWANCE_LITERS: 0.5    # deducted once, at tap time
  KEG_MIN_RESIDUAL_LITERS: 0.2         # remaining strictly below 0.2 L -> keg EMPTY
  KEG_RETAP_BUFFER_MINUTES: 15         # re-tap allowed strictly after last_untapped_at + 15 min

  # --- Taproom ---
  TAPROOM_RATE_PER_LITER: 9.00
  TAPROOM_BULK_DISCOUNT_PCT: 10
  GROWLER_BULK_TIER_LITERS: 1.0        # at or above 1.0 L earns the bulk discount
  HOUSE_GROWLER_FEE: 3.50
  CUSTOMER_GROWLER_SANITATION_FEE: 1.50
  GROWLER_MAX_FILL_LITERS: 1.9         # at or below 1.9 L
  POUR_MIN_LITERS: 0.1                 # at or above 0.1 L
  GROWLER_INSPECTION_VALID_HOURS: 24   # pour allowed on or before inspected_at + 24 h

  # --- Wholesale / self-distribution ---
  WHOLESALE_DEFAULT_TERMS_DAYS: 30
  SELF_DIST_ANNUAL_LITER_CEILING: 4000.0  # cumulative liters at or below 4000.0 are allowed
  LATE_FEE_MONTHLY_RATE_PCT: 1.5
  AGING_BUCKET_1_MAX_DAYS: 30
  AGING_BUCKET_2_MAX_DAYS: 60
  CREDIT_HOLD_PAST_DUE_DAYS: 45        # strictly more than 45 days past due -> CREDIT_HOLD

  # --- Subscription ---
  SUBSCRIPTION_CYCLE_DAYS: 28
  SUBSCRIPTION_CYCLE_PRICE: 42.00
  SUBSCRIPTION_BOX_UNITS: 6
  SUBSCRIPTION_SKIP_CAP_PER_YEAR: 3    # at most 3 skips per calendar year, inclusive
  SUBSCRIPTION_PAUSE_MAX_DAYS: 60      # pause span at or below 60 days, both ends inclusive
  LOYALTY_MIN_CYCLES: 6                # at or above 6 completed cycles -> TIER_2
  LOYALTY_TIER2_DISCOUNT_PCT: 10
  SUBSCRIPTION_REALLOCATION_ATTEMPT_CAP: 2  # at most 2 automatic re-allocations per allocation chain

  # --- Recall ---
  RECALL_ACK_DEADLINE_HOURS: 24

  # --- System ---
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  MONEY_DECIMALS: 2
  VOLUME_DECIMALS: 2
  PH_DECIMALS: 2
  ABV_DECIMALS: 2
  PAGINATION_DEFAULT_LIMIT: 10
  PAGINATION_MAX_LIMIT: 100

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable recipe name" }
      - { name: style, type: enum, source: input, description: "Beverage style", constraints: "one of KOMBUCHA | JUN | WATER_KEFIR | HOP_TONIC | BOTANICAL_SODA" }
      - { name: recipe_version_number, type: integer, source: system, default: 1, description: "Domain recipe revision counter, distinct from the OCC `version` field; incremented by POST /recipes/{id}/revise" }
      - { name: target_ph_ceiling, type: number, source: input, description: "Recipe-specific pH ceiling; the effective F1 ceiling is min(target_ph_ceiling, F1_PH_CEILING)" }
      - { name: planned_f1_days, type: integer, source: input, description: "Planned primary fermentation duration in whole days" }
      - { name: planned_f2_days, type: integer, source: input, description: "Planned secondary fermentation duration in whole days; must be at or below F2_MAX_DAYS" }
      - { name: f2_added_sugar_g_per_l, type: number, source: input, default: 0, description: "Grams of priming sugar per liter added at F2; drives the projected ABV gain" }
      - { name: base_gravity_brix, type: number, source: input, description: "Starting gravity in degrees Brix" }
      - { name: pasteurization_required, type: boolean, source: input, default: false, description: "When true, every packaging run of this recipe must set pasteurized = true" }
      - { name: intended_abv_class, type: enum, source: input, description: "The class the brewer intends to sell under", constraints: "one of NON_ALCOHOLIC | ALCOHOLIC" }
      - { name: active_label_approval_id, type: string, source: computed, default: null, description: "Mirror of the most recent LabelApproval for this recipe whose status is APPROVED; null when none. LabelApproval.recipe_id is the canonical foreign key." }

  - name: LabelApproval
    parent: Recipe
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id; the recipe this label revision was drawn against" }
      - { name: approved_recipe_version_number, type: integer, source: system, default: null, description: "Recipe.recipe_version_number captured at the moment of approval; null before approval" }
      - { name: abv_class, type: enum, source: input, description: "Label regime this artwork carries", constraints: "one of NON_ALCOHOLIC | ALCOHOLIC" }
      - { name: pasteurized, type: boolean, source: input, description: "Whether the artwork carries the pasteurized statement" }
      - { name: required_elements, type: array, source: computed, description: "Codes of the label elements this revision must carry, derived from abv_class and pasteurized; see calculations.label_required_elements" }
      - { name: declared_elements, type: array, source: input, description: "Codes the submitter claims the artwork carries" }
      - { name: status, type: enum, source: system, description: "Label lifecycle", constraints: "one of DRAFT | SUBMITTED | APPROVED | STALE" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who submitted this revision" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who approved it; must differ from submitted_by_user_id" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical-clock instant of approval" }
      - { name: stale_reason, type: enum, source: system, default: null, description: "Why the approval went stale", constraints: "one of RECIPE_REVISED | null" }

  - name: ScobyCulture
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Culture jar label" }
      - { name: parent_culture_id, type: string, source: input, default: null, description: "FK -> ScobyCulture.id; the mother culture this daughter was split from. Null identifies a founder culture." }
      - { name: generation_number, type: integer, source: computed, description: "1 for a founder culture; parent.generation_number + 1 for a daughter. Creation is refused when the result would exceed SCOBY_GENERATION_CAP." }
      - { name: pitch_count, type: integer, source: system, default: 0, description: "Number of batches pitched from this culture since the last passed reverification" }
      - { name: reverification_count, type: integer, source: system, default: 0, description: "Number of passed reverifications" }
      - { name: last_reverified_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent PASS result" }
      - { name: vitality_score, type: number, source: computed, description: "0-100 health score; see calculations.scoby_vitality_score" }
      - { name: state, type: enum, source: system, description: "Culture lifecycle", constraints: "one of ACTIVE | REVERIFICATION_PENDING | RETIRED | CONTAMINATED" }
      - { name: retire_reason, type: enum, source: system, default: null, description: "Why the culture left service", constraints: "one of GENERATION_CAP | VITALITY | CONTAMINATION | OPERATOR | null" }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Vessel identifier stencilled on the tank" }
      - { name: capacity_liters, type: number, source: input, description: "Nominal capacity in liters" }
      - { name: state, type: enum, source: system, description: "Sanitation and occupancy state", constraints: "one of DIRTY | CIP_IN_PROGRESS | SANITIZED | OCCUPIED" }
      - { name: cip_started_at, type: datetime, source: system, default: null, description: "Logical-clock instant the clean-in-place cycle started" }
      - { name: cip_completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the clean-in-place cycle completed; sanitation is valid for VESSEL_CIP_VALID_HOURS from here" }
      - { name: current_batch_id, type: string, source: system, default: null, description: "Mirror of the Batch currently occupying this vessel; null when unoccupied. Batch.vessel_id is the canonical foreign key." }
      - { name: occupancy_start_at, type: datetime, source: system, default: null, description: "Inclusive start of the current occupancy interval" }
      - { name: occupancy_end_at, type: datetime, source: system, default: null, description: "Exclusive end of the current occupancy interval" }

  - name: IngredientLot
    parent: null
    common_fields: true
    fields:
      - { name: ingredient_type, type: enum, source: input, description: "Raw material category", constraints: "one of TEA | SUGAR | CULTURE_NUTRIENT | JUICE | BOTANICAL | HOPS" }
      - { name: supplier_lot_code, type: string, source: input, description: "Supplier's printed lot code" }
      - { name: received_on_date, type: datetime, source: input, description: "Receipt date, ISO 8601 UTC" }
      - { name: expiry_date, type: datetime, source: input, description: "Supplier expiry date, ISO 8601 UTC" }
      - { name: quantity_received, type: number, source: input, description: "Quantity received in the ingredient's native unit (kg for solids, L for liquids)" }
      - { name: quantity_consumed, type: number, source: computed, default: 0, description: "Sum of quantity_used over non-voided BatchIngredientUse rows for this lot" }
      - { name: quantity_available, type: number, source: computed, description: "quantity_received - quantity_consumed" }
      - { name: status, type: enum, source: system, description: "Inventory state", constraints: "one of AVAILABLE | PARTIALLY_CONSUMED | CONSUMED | EXPIRED | QUARANTINED" }
      - { name: quarantine_cleared_count, type: integer, source: system, default: 0, description: "Number of times this lot has been cleared out of QUARANTINED" }
      - { name: pre_quarantine_status, type: enum, source: system, default: null, description: "Status held immediately before quarantine, restored on clearance", constraints: "one of AVAILABLE | PARTIALLY_CONSUMED | CONSUMED | null" }

  - name: Batch
    parent: Recipe
    common_fields: true
    fields:
      - { name: batch_code, type: string, source: input, description: "Brewery batch code" }
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id" }
      - { name: recipe_version_number_at_pitch, type: integer, source: system, description: "Recipe.recipe_version_number captured at pitch time" }
      - { name: scoby_culture_id, type: string, source: input, description: "FK -> ScobyCulture.id; the culture pitched into this batch" }
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; the fermentation vessel occupied by this batch" }
      - { name: pitched_liters, type: number, source: input, description: "Liters of sweet tea charged into the vessel at pitch" }
      - { name: remaining_liters, type: number, source: computed, description: "pitched_liters - drawn_liters - loss_liters" }
      - { name: drawn_liters, type: number, source: computed, default: 0, description: "Cumulative liters drawn by packaging runs" }
      - { name: loss_liters, type: number, source: computed, default: 0, description: "Cumulative liters written off (dump)" }
      - { name: pitched_at, type: datetime, source: system, description: "Logical-clock instant of pitch; day_index 0 of the QA log" }
      - { name: planned_f2_days, type: integer, source: input, description: "Planned secondary fermentation days for this batch; at or below F2_MAX_DAYS" }
      - { name: f2_added_sugar_g_per_l, type: number, source: input, default: 0, description: "Priming sugar in g/L added at F2 for this batch" }
      - { name: f1_completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant F1 was closed out" }
      - { name: f2_started_at, type: datetime, source: system, default: null, description: "Logical-clock instant F2 began" }
      - { name: f2_completed_at, type: datetime, source: system, default: null, description: "Logical-clock instant F2 was closed out; the shelf-life base date for blended lots" }
      - { name: f1_measured_abv_pct, type: number, source: system, default: null, description: "abv_pct of the QaReading that closed F1" }
      - { name: projected_abv_pct, type: number, source: computed, default: null, description: "Forward-looking post-F2 ABV; see calculations.batch_abv_projected" }
      - { name: projected_abv_class, type: enum, source: computed, default: null, description: "Class implied by projected_abv_pct", constraints: "one of NON_ALCOHOLIC | ALCOHOLIC | null" }
      - { name: packaging_abv_pct, type: number, source: system, default: null, description: "abv_pct of the PACKAGING-type QaReading; the measured variant" }
      - { name: ferment_stage, type: enum, source: system, description: "Process axis of the batch (independent of qa_disposition)", constraints: "one of F1_ACTIVE | F2_ACTIVE | READY_TO_PACKAGE | PACKAGED | DUMPED" }
      - { name: qa_disposition, type: enum, source: system, description: "Quality axis of the batch (independent of ferment_stage)", constraints: "one of PENDING | CONFORMING | AT_RISK | NONCONFORMING" }
      - { name: flagged_reading_count, type: integer, source: computed, default: 0, description: "Count of QaReading rows on this batch with flagged = true; never decreases" }
      - { name: temp_excursion_count, type: integer, source: computed, default: 0, description: "Count of QaReading rows whose temperature_c fell outside the inclusive band F1_TEMP_MIN_C..F1_TEMP_MAX_C" }
      - { name: ph_target_hit_day_index, type: integer, source: system, default: null, description: "day_index of the earliest reading whose ph was at or below the effective pH ceiling; null until hit" }
      - { name: qa_signoff_count, type: integer, source: system, default: 0, description: "Number of corrective QA sign-offs applied; capped at 1" }
      - { name: last_flagged_reading_by_user_id, type: string, source: system, default: null, description: "X-User-ID that recorded the most recent flagged reading; the corrective sign-off actor must differ from this" }
      - { name: occupancy_end_at, type: datetime, source: system, description: "Exclusive end of this batch's vessel occupancy interval = pitched_at + (recipe.planned_f1_days + planned_f2_days) whole days" }

  - name: BatchIngredientUse
    parent: Batch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id" }
      - { name: ingredient_lot_id, type: string, source: input, description: "FK -> IngredientLot.id" }
      - { name: quantity_used, type: number, source: input, description: "Quantity drawn from the ingredient lot in its native unit" }
      - { name: voided, type: boolean, source: system, default: false, description: "True when the use record has been voided; voided rows are excluded from consumption and from the recall trace" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the void" }

  - name: QaReading
    parent: Batch
    common_fields: false
    fields:
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id" }
      - { name: reading_type, type: enum, source: input, description: "Which fermentation phase this reading belongs to", constraints: "one of F1 | F2 | PACKAGING" }
      - { name: reading_at, type: datetime, source: input, description: "Instant the reading was taken; must be at or after batch.pitched_at and at or before the logical clock" }
      - { name: day_index, type: integer, source: computed, description: "Whole days elapsed from batch.pitched_at to reading_at, floored" }
      - { name: ph, type: number, source: input, description: "Measured pH, 2 decimal places" }
      - { name: temperature_c, type: number, source: input, description: "Measured temperature in Celsius" }
      - { name: brix, type: number, source: input, description: "Measured gravity in degrees Brix" }
      - { name: abv_pct, type: number, source: input, description: "Measured alcohol by volume in percent" }
      - { name: flagged, type: boolean, source: computed, description: "True when this reading violates any QA rule; see calculations.qa_reading_evaluation" }
      - { name: flag_reasons, type: array, source: computed, description: "Codes explaining the flag: PH_REGRESSION | PH_HARD_FLOOR | TEMP_EXCURSION | READING_GAP" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the ProductionOperator who recorded the reading" }

  - name: PackagingRun
    parent: Recipe
    common_fields: true
    fields:
      - { name: run_code, type: string, source: input, description: "Packaging run identifier" }
      - { name: recipe_id, type: string, source: input, description: "FK -> Recipe.id" }
      - { name: label_approval_id, type: string, source: input, description: "FK -> LabelApproval.id; the label revision this run will print" }
      - { name: format, type: enum, source: input, description: "Container format", constraints: "one of KEG | BOTTLE | CAN" }
      - { name: pasteurized, type: boolean, source: input, description: "Whether the run is flash-pasteurized" }
      - { name: max_units_requested, type: integer, source: input, description: "Upper bound on units to fill; the run may produce fewer" }
      - { name: source_draws, type: array, source: computed, description: "Ordered list of draw objects { batch_id, liters_drawn, drawn_at }, appended by POST /packaging-runs/{id}/sources in call order" }
      - { name: source_batch_count, type: integer, source: computed, default: 0, description: "Number of entries in source_draws" }
      - { name: gross_liters, type: number, source: computed, default: 0, description: "Sum of source_draws[].liters_drawn" }
      - { name: net_liters, type: number, source: computed, default: 0, description: "gross_liters less the packaging loss allowance; see calculations.packaging_yield" }
      - { name: units_produced, type: integer, source: computed, default: 0, description: "Units filled by this run; see calculations.packaging_yield" }
      - { name: status, type: enum, source: system, description: "Run lifecycle", constraints: "one of DRAFT | SOURCED | IN_PROGRESS | COMPLETED | ABORTED | RECALL_FLAGGED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ProductionOperator who opened the run" }
      - { name: started_by_user_id, type: string, source: system, default: null, description: "X-User-ID that started the run" }
      - { name: finished_lot_id, type: string, source: system, default: null, description: "Mirror of the FinishedLot emitted on completion; null before completion. FinishedLot.packaging_run_id is the canonical foreign key." }

  - name: FinishedLot
    parent: PackagingRun
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: computed, description: "Emitted lot code, formatted as `<recipe.style first 3 letters uppercased>-<packaged_at date as YYYYMMDD>-<run_code>`" }
      - { name: packaging_run_id, type: string, source: system, description: "FK -> PackagingRun.id" }
      - { name: recipe_id, type: string, source: system, description: "FK -> Recipe.id" }
      - { name: format, type: enum, source: system, description: "Copied from the packaging run", constraints: "one of KEG | BOTTLE | CAN" }
      - { name: pasteurized, type: boolean, source: system, description: "Copied from the packaging run" }
      - { name: container_liters, type: number, source: system, description: "KEG_FILL_LITERS, BOTTLE_FILL_LITERS or CAN_FILL_LITERS by format" }
      - { name: units_produced, type: integer, source: system, description: "Units emitted at completion; never changes afterwards" }
      - { name: on_hand_units, type: integer, source: computed, description: "Units physically present in finished-goods inventory" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Subset of on_hand_units committed to shipment lines or subscription allocations that have not shipped" }
      - { name: shipped_units, type: integer, source: computed, default: 0, description: "Units that have left on a delivered shipment or a shipped subscription allocation" }
      - { name: poured_units, type: integer, source: computed, default: 0, description: "Units consumed by taproom keg placements" }
      - { name: destroyed_units, type: integer, source: computed, default: 0, description: "Units written off by a recall" }
      - { name: measured_abv_pct, type: number, source: system, description: "At-packaging ABV of the lot; see calculations.lot_measured_abv" }
      - { name: abv_class, type: enum, source: computed, description: "Regime implied by measured_abv_pct against NA_ABV_THRESHOLD_PCT", constraints: "one of NON_ALCOHOLIC | ALCOHOLIC" }
      - { name: packaged_at, type: datetime, source: system, description: "Logical-clock instant the run completed" }
      - { name: best_by_date, type: datetime, source: computed, description: "See calculations.lot_best_by_date" }
      - { name: cold_chain_max_c, type: number, source: computed, description: "COLD_CHAIN_MAX_C_RAW (4.0) when pasteurized is false, COLD_CHAIN_MAX_C_PASTEURIZED (21.0) when it is true" }
      - { name: status, type: enum, source: system, description: "Finished-goods lifecycle", constraints: "one of HELD | RELEASED | QUARANTINED | RECALLED | DEPLETED" }
      - { name: pre_quarantine_status, type: enum, source: system, default: null, description: "Status held immediately before quarantine, restored on clearance", constraints: "one of HELD | RELEASED | null" }
      - { name: quarantine_clearance_count, type: integer, source: system, default: 0, description: "Number of completed clearances; capped at LOT_QUARANTINE_CLEARANCE_CAP" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the QaManager who released the lot; must differ from the run's created_by_user_id" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock instant of release" }

  - name: Keg
    parent: null
    common_fields: true
    fields:
      - { name: asset_code, type: string, source: input, description: "Keg asset tag" }
      - { name: capacity_liters, type: number, source: input, description: "Keg capacity in liters" }
      - { name: finished_lot_id, type: string, source: system, default: null, description: "FK -> FinishedLot.id; the lot currently filling this keg, null when empty" }
      - { name: account_id, type: string, source: system, default: null, description: "FK -> Account.id; the account currently holding the keg on deposit, null when in-house" }
      - { name: status, type: enum, source: system, description: "Keg asset lifecycle", constraints: "one of IN_STOCK | FILLED | ON_TAP | EMPTY | ON_DEPOSIT | RETURNED | SCRAPPED" }
      - { name: fill_liters, type: number, source: system, default: 0, description: "Liters charged at the last fill" }
      - { name: remaining_liters, type: number, source: computed, default: 0, description: "Liters left after the blow-off allowance and all pours" }
      - { name: deposit_state, type: enum, source: system, description: "Deposit ledger state for the current cycle", constraints: "one of NONE | CHARGED | REFUNDED | FORFEITED" }
      - { name: deposit_amount, type: number, source: system, default: 0, description: "Amount charged on issue; KEG_DEPOSIT_AMOUNT when CHARGED, 0 otherwise" }
      - { name: deposit_refund_amount, type: number, source: computed, default: 0, description: "Amount refunded at return; see calculations.keg_deposit_settlement" }
      - { name: deposit_forfeit_amount, type: number, source: computed, default: 0, description: "Amount forfeited at return; see calculations.keg_deposit_settlement" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical-clock instant the keg went out on deposit" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Logical-clock instant the keg came back" }
      - { name: tapped_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the current tap" }
      - { name: last_untapped_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent untap; the re-tap buffer is measured from here" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Trade name of the buying account" }
      - { name: channel, type: enum, source: input, description: "Distribution channel", constraints: "one of WHOLESALE_DISTRIBUTOR | SELF_DISTRIBUTION" }
      - { name: credit_terms_days, type: integer, source: input, default: 30, description: "Net payment terms in whole days; defaults to WHOLESALE_DEFAULT_TERMS_DAYS" }
      - { name: credit_limit, type: number, source: input, description: "Maximum permitted outstanding_balance" }
      - { name: outstanding_balance, type: number, source: computed, default: 0, description: "Sum of subtotal + late_fee over shipments in status DELIVERED, less payments applied" }
      - { name: keg_deposit_balance, type: number, source: computed, default: 0, description: "KEG_DEPOSIT_AMOUNT multiplied by the number of kegs held by this account with deposit_state = CHARGED" }
      - { name: deposit_refunded_total, type: number, source: computed, default: 0, description: "Lifetime deposit dollars refunded to this account" }
      - { name: deposit_forfeited_total, type: number, source: computed, default: 0, description: "Lifetime deposit dollars forfeited by this account" }
      - { name: kegs_charged_lifetime, type: integer, source: computed, default: 0, description: "Lifetime count of kegs issued on deposit to this account" }
      - { name: ytd_self_dist_liters, type: number, source: computed, default: 0, description: "Calendar-year self-distributed liters; see calculations.self_distribution_ledger" }
      - { name: alcoholic_license_on_file, type: boolean, source: input, default: false, description: "Whether this account may receive lots whose abv_class is ALCOHOLIC" }
      - { name: status, type: enum, source: system, description: "Commercial standing", constraints: "one of ONBOARDING | ACTIVE | CREDIT_HOLD" }
      - { name: open_recall_notice_count, type: integer, source: computed, default: 0, description: "Count of RecallNotice rows for this account whose status is PENDING or OVERDUE" }

  - name: Shipment
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: status, type: enum, source: system, description: "Shipment lifecycle", constraints: "one of DRAFT | CONFIRMED | DELIVERED | PAID | CANCELLED | RECALL_HOLD" }
      - { name: total_units, type: integer, source: computed, default: 0, description: "Sum of units over lines whose line_status is ACTIVE" }
      - { name: total_liters, type: number, source: computed, default: 0, description: "Sum of line_liters over lines whose line_status is ACTIVE" }
      - { name: subtotal, type: number, source: computed, default: 0, description: "Sum of extended_price over lines whose line_status is ACTIVE" }
      - { name: late_fee, type: number, source: computed, default: 0, description: "See calculations.invoice_aging_and_late_fee" }
      - { name: aging_bucket, type: enum, source: computed, description: "Receivable age bucket", constraints: "one of CURRENT | B1_1_30 | B2_31_60 | B3_61_PLUS" }
      - { name: days_past_due, type: integer, source: computed, default: 0, description: "Whole days the invoice is past due at the current logical clock; floored at 0" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of confirmation" }
      - { name: delivered_on_date, type: datetime, source: system, default: null, description: "Logical-clock instant of delivery; the invoice clock starts here" }
      - { name: due_date, type: datetime, source: computed, default: null, description: "delivered_on_date plus account.credit_terms_days whole days" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock instant the shipment was paid in full" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the SalesRep who opened the shipment" }

  - name: ShipmentLine
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id" }
      - { name: finished_lot_id, type: string, source: input, description: "FK -> FinishedLot.id" }
      - { name: units, type: integer, source: input, description: "Units of the lot on this line" }
      - { name: unit_price, type: number, source: input, description: "Price per unit in dollars" }
      - { name: extended_price, type: number, source: computed, description: "round(units * unit_price, 2)" }
      - { name: line_liters, type: number, source: computed, description: "round(units * lot.container_liters, 2)" }
      - { name: line_status, type: enum, source: system, description: "Line state", constraints: "one of ACTIVE | RECALLED | CANCELLED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: subscriber_email, type: string, source: input, description: "Subscriber contact address; unique across subscriptions whose status is ACTIVE or PAUSED" }
      - { name: subscriber_birth_date, type: datetime, source: input, description: "Subscriber date of birth, used for the AGE_VERIFICATION_MIN_AGE_YEARS gate on ALCOHOLIC allocations" }
      - { name: preferred_recipe_id, type: string, source: input, description: "FK -> Recipe.id; allocations draw released lots of this recipe" }
      - { name: status, type: enum, source: system, description: "Subscription lifecycle", constraints: "one of ACTIVE | PAUSED | CANCELLED" }
      - { name: completed_cycles, type: integer, source: computed, default: 0, description: "Count of allocations on this subscription whose status is SHIPPED" }
      - { name: skips_used_this_year, type: integer, source: computed, default: 0, description: "Skips recorded in the calendar year of the current logical clock" }
      - { name: pause_windows, type: array, source: computed, description: "Ordered list of closed pause intervals { start_date, end_date }, both ends inclusive" }
      - { name: current_pause_start_date, type: datetime, source: system, default: null, description: "Inclusive start of the open pause window; null when not paused" }
      - { name: current_pause_end_date, type: datetime, source: system, default: null, description: "Inclusive end of the open pause window; null when not paused" }
      - { name: cycle_start_date, type: datetime, source: system, description: "Inclusive start of the current SUBSCRIPTION_CYCLE_DAYS cycle" }
      - { name: cycle_index, type: integer, source: system, default: 1, description: "1-based index of the current cycle" }
      - { name: next_cycle_charge, type: number, source: computed, default: 0, description: "See calculations.subscription_cycle_charge" }
      - { name: credit_balance, type: number, source: computed, default: 0, description: "Dollars credited back from reversed allocations and skipped cycles" }
      - { name: age_verified, type: boolean, source: system, default: false, description: "True once the subscriber's age has been checked against subscriber_birth_date at allocation time" }

  - name: SubscriptionAllocation
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: finished_lot_id, type: string, source: input, description: "FK -> FinishedLot.id; the released lot this box draws from" }
      - { name: cycle_index, type: integer, source: input, description: "Cycle this allocation belongs to; unique per subscription among allocations whose status is ALLOCATED or SHIPPED" }
      - { name: units, type: integer, source: computed, description: "Always SUBSCRIPTION_BOX_UNITS" }
      - { name: status, type: enum, source: system, description: "Allocation lifecycle", constraints: "one of ALLOCATED | SHIPPED | REVERSED" }
      - { name: reversal_reason, type: enum, source: system, default: null, description: "Why the allocation was unwound", constraints: "one of LOT_QUARANTINED | LOT_RECALLED | SUBSCRIPTION_CANCELLED | null" }
      - { name: reallocation_attempt_count, type: integer, source: system, default: 0, description: "Automatic re-allocation attempts already spent on this cycle; capped at SUBSCRIPTION_REALLOCATION_ATTEMPT_CAP" }
      - { name: charge_amount, type: number, source: computed, description: "Dollar amount charged for this box; equals subscription.next_cycle_charge at allocation time" }

  - name: TaproomFill
    parent: Keg
    common_fields: true
    fields:
      - { name: keg_id, type: string, source: input, description: "FK -> Keg.id; the keg this fill draws from" }
      - { name: container_type, type: enum, source: input, description: "What the liquid goes into", constraints: "one of HOUSE_GROWLER | CUSTOMER_GROWLER | GLASS_POUR" }
      - { name: requested_liters, type: number, source: input, description: "Liters requested" }
      - { name: fill_status, type: enum, source: system, description: "Fill lifecycle", constraints: "one of REQUESTED | INSPECTED | POURED" }
      - { name: inspected_at, type: datetime, source: system, default: null, description: "Logical-clock instant the customer-owned growler passed sanitation inspection" }
      - { name: inspected_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the TaproomStaff member who performed the inspection" }
      - { name: customer_birth_date, type: datetime, source: input, default: null, description: "Customer date of birth; required when the keg's lot abv_class is ALCOHOLIC" }
      - { name: age_verified, type: boolean, source: computed, default: false, description: "True once customer_birth_date has been checked against AGE_VERIFICATION_MIN_AGE_YEARS at pour time" }
      - { name: poured_liters, type: number, source: computed, default: 0, description: "Liters actually poured; equals requested_liters on success" }
      - { name: charge_amount, type: number, source: computed, default: 0, description: "See calculations.taproom_fill_charge" }
      - { name: poured_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the pour" }

  - name: RecallNotice
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account being notified" }
      - { name: finished_lot_id, type: string, source: input, description: "FK -> FinishedLot.id; the lot the notice concerns" }
      - { name: trigger_source, type: enum, source: system, description: "What produced the notice", constraints: "one of INGREDIENT_LOT_QUARANTINE | LOT_QUARANTINE | LOT_RECALL" }
      - { name: status, type: enum, source: system, description: "Notice lifecycle", constraints: "one of PENDING | ACKNOWLEDGED | OVERDUE" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant the notice was raised" }
      - { name: ack_deadline_at, type: datetime, source: computed, description: "issued_at plus RECALL_ACK_DEADLINE_HOURS" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Logical-clock instant of acknowledgement" }
      - { name: acknowledged_by_user_id, type: string, source: system, default: null, description: "X-User-ID that acknowledged the notice" }

# =============================================================================
# §1.2 State Machine Table
# Each transition carries a stable `name:` — §1.8/§1.9 grounds reference
# `state_machines.<Entity>.<name>`.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- ScobyCulture
  # Shape: cyclic (ACTIVE -> REVERIFICATION_PENDING -> ACTIVE re-entry loop)
  #        plus a self-loop on pitch. Self-referential lineage.
  - entity: ScobyCulture
    initial_state: ACTIVE
    terminal_states: [RETIRED, CONTAMINATED]
    shape: cyclic
    transitions:
      - name: create_founder_or_daughter
        from: null
        to: ACTIVE
        trigger: "POST /scoby-cultures"
        actor: ProductionOperator
        preconditions:
          - "when parent_culture_id is supplied, the parent exists and parent.state == ACTIVE"
          - "when parent_culture_id is supplied, parent.generation_number + 1 must be at or below SCOBY_GENERATION_CAP (7); a result of 8 or more is refused"
          - "when parent_culture_id is null the culture is a founder and generation_number is 1"
        side_effects:
          - "generation_number set to 1 (founder) or parent.generation_number + 1 (daughter)"
          - "pitch_count = 0, reverification_count = 0, last_reverified_at = null"
          - "vitality_score computed by calculations.scoby_vitality_score"

      - name: pitch_self_loop
        from: ACTIVE
        to: ACTIVE
        trigger: "POST /batches"
        actor: ProductionOperator
        preconditions:
          - "vitality_score at or above SCOBY_VITALITY_FLOOR (40)"
          - "when generation_number == SCOBY_GENERATION_CAP (7), last_reverified_at is non-null and the logical clock is at or before last_reverified_at + SCOBY_REVERIFICATION_VALID_DAYS (30) whole days"
        side_effects:
          - "pitch_count incremented by 1"
          - "vitality_score recomputed by calculations.scoby_vitality_score"
          - "increments ScobyCulture.version by 1"

      - name: open_reverification
        from: ACTIVE
        to: REVERIFICATION_PENDING
        trigger: "POST /scoby-cultures/{id}/reverify"
        actor: QaManager
        preconditions: ["state == ACTIVE"]
        side_effects: ["increments ScobyCulture.version by 1"]

      - name: reverification_pass
        from: REVERIFICATION_PENDING
        to: ACTIVE
        trigger: "POST /scoby-cultures/{id}/reverify-result with outcome = PASS"
        actor: QaManager
        preconditions: ["state == REVERIFICATION_PENDING"]
        side_effects:
          - "reverification_count incremented by 1"
          - "pitch_count reset to 0"
          - "last_reverified_at = logical clock"
          - "vitality_score recomputed by calculations.scoby_vitality_score (post_reverification variant)"

      - name: reverification_fail
        from: REVERIFICATION_PENDING
        to: CONTAMINATED
        trigger: "POST /scoby-cultures/{id}/reverify-result with outcome = FAIL"
        actor: QaManager
        preconditions: ["state == REVERIFICATION_PENDING"]
        side_effects:
          - "retire_reason = CONTAMINATION"
          - "cascade hop 1: every Batch with scoby_culture_id == this culture and ferment_stage in {F1_ACTIVE, F2_ACTIVE, READY_TO_PACKAGE} has qa_disposition set to NONCONFORMING"
          - "cascade hop 2: each such batch that is a source draw of a PackagingRun in status DRAFT, SOURCED or IN_PROGRESS causes that run to move to ABORTED, returning its drawn liters (see PackagingRun.abort_run)"
          - "batches with ferment_stage PACKAGED or DUMPED are NOT re-dispositioned"

      - name: manual_retire
        from: ACTIVE
        to: RETIRED
        trigger: "POST /scoby-cultures/{id}/retire"
        actor: ProductionOperator
        preconditions: ["state == ACTIVE", "no Batch of this culture is in ferment_stage F1_ACTIVE or F2_ACTIVE"]
        side_effects: ["retire_reason = the caller-supplied value, one of OPERATOR, VITALITY or GENERATION_CAP, defaulting to OPERATOR"]
        note: |
          REACHABILITY NOTE. There is deliberately NO automatic
          ACTIVE -> RETIRED transition on a low vitality_score. An automatic
          retirement at the same SCOBY_VITALITY_FLOOR the pitch gate uses would
          make gate 9 of gate_precedence.post_batches
          (ERR_SCOBY_VITALITY_TOO_LOW) unreachable, because gate 7 would
          already have answered ERR_INVALID_STATE for the retired culture on
          every input that could trip it. A worn-out culture therefore stays
          ACTIVE, every further pitch is refused with
          ERR_SCOBY_VITALITY_TOO_LOW, and an operator retires it explicitly
          with retire_reason VITALITY.

  # ---------------------------------------------------------------- Vessel
  # Shape: cyclic (DIRTY -> CIP_IN_PROGRESS -> SANITIZED -> OCCUPIED -> DIRTY),
  #        with a re-sanitise edge SANITIZED -> CIP_IN_PROGRESS.
  - entity: Vessel
    initial_state: DIRTY
    terminal_states: []
    shape: cyclic
    transitions:
      - name: start_cip
        from: DIRTY
        to: CIP_IN_PROGRESS
        trigger: "POST /vessels/{id}/cip-start"
        actor: ProductionOperator
        preconditions: ["state in {DIRTY, SANITIZED}"]
        side_effects: ["cip_started_at = logical clock", "cip_completed_at = null"]

      - name: resanitise
        from: SANITIZED
        to: CIP_IN_PROGRESS
        trigger: "POST /vessels/{id}/cip-start"
        actor: ProductionOperator
        preconditions: ["state == SANITIZED"]
        side_effects: ["cip_started_at = logical clock", "cip_completed_at = null"]
        note: "The re-sanitise edge is how an expired CIP window is refreshed; there is no automatic SANITIZED -> DIRTY decay."

      - name: complete_cip
        from: CIP_IN_PROGRESS
        to: SANITIZED
        trigger: "POST /vessels/{id}/cip-complete"
        actor: ProductionOperator
        preconditions: ["state == CIP_IN_PROGRESS"]
        side_effects: ["cip_completed_at = logical clock"]

      - name: occupy_on_pitch
        from: SANITIZED
        to: OCCUPIED
        trigger: "POST /batches"
        actor: ProductionOperator
        preconditions:
          - "state == SANITIZED"
          - "the logical clock is at or before cip_completed_at + VESSEL_CIP_VALID_HOURS (72 h), inclusive of the exact 72-hour instant"
          - "pitched_liters at or below capacity_liters * (100 - VESSEL_HEADSPACE_PCT) / 100"
          - "the requested half-open occupancy interval [pitched_at, occupancy_end_at) does not intersect the vessel's retained occupancy interval [occupancy_start_at, occupancy_end_at); a new pitch whose pitched_at equals the retained occupancy_end_at exactly IS accepted, because both intervals are half-open"
        side_effects:
          - "current_batch_id = the new batch id"
          - "occupancy_start_at = pitched_at (inclusive), occupancy_end_at = batch.occupancy_end_at (exclusive)"
        note: |
          POST /batches accepts an optional back-dated `pitched_at` (defaulting
          to the logical clock, and never later than it). Back-dating is what
          makes the overlap test reachable: a vessel that has been freed and
          re-sanitised is in state SANITIZED, so the state gate passes, and only
          the interval arithmetic can reject the pitch.

      - name: free_on_transfer
        from: OCCUPIED
        to: DIRTY
        trigger: "POST /batches/{id}/complete-f2"
        actor: ProductionOperator
        preconditions: ["current_batch_id == the batch being completed"]
        side_effects:
          - "current_batch_id = null"
          - "occupancy_start_at and occupancy_end_at are RETAINED as the vessel's last occupancy interval so a later back-dated pitch can be tested for overlap"

      - name: free_on_dump
        from: OCCUPIED
        to: DIRTY
        trigger: "POST /batches/{id}/dump"
        actor: ProductionOperator
        preconditions: ["current_batch_id == the batch being dumped"]
        side_effects:
          - "current_batch_id = null"
          - "occupancy_start_at and occupancy_end_at are RETAINED as the vessel's last occupancy interval so a later back-dated pitch can be tested for overlap"

  # ---------------------------------------------------------------- Batch
  # Shape: parallel — `ferment_stage` (process axis) and `qa_disposition`
  # (quality axis) advance independently on the same row. The quality axis also
  # carries a controlled re-entry edge (AT_RISK -> CONFORMING) that is reachable
  # ONLY by an explicit human sign-off, never by a later clean reading.
  - entity: Batch
    initial_state: "ferment_stage = F1_ACTIVE; qa_disposition = PENDING"
    terminal_states: [PACKAGED, DUMPED, NONCONFORMING]
    shape: parallel
    axes:
      - name: ferment_stage
        states: [F1_ACTIVE, F2_ACTIVE, READY_TO_PACKAGE, PACKAGED, DUMPED]
      - name: qa_disposition
        states: [PENDING, CONFORMING, AT_RISK, NONCONFORMING]
    transitions:
      # --- process axis ---
      - name: pitch_batch
        axis: ferment_stage
        from: null
        to: F1_ACTIVE
        trigger: "POST /batches"
        actor: ProductionOperator
        preconditions:
          - "recipe exists; scoby_culture.state == ACTIVE; vessel.state == SANITIZED"
          - "every gate in gate_precedence.post_batches passes, in the declared order"
        side_effects:
          - "pitched_at = logical clock; qa_disposition = PENDING; ferment_stage = F1_ACTIVE"
          - "recipe_version_number_at_pitch = recipe.recipe_version_number"
          - "occupancy_end_at = pitched_at + (recipe.planned_f1_days + planned_f2_days) whole days"
          - "remaining_liters = pitched_liters, drawn_liters = 0, loss_liters = 0"
          - "Vessel.occupy_on_pitch fires; ScobyCulture.pitch_self_loop fires"

      - name: advance_to_f2
        axis: ferment_stage
        from: F1_ACTIVE
        to: F2_ACTIVE
        trigger: "POST /batches/{id}/advance-to-f2"
        actor: ProductionOperator
        preconditions:
          - "ferment_stage == F1_ACTIVE"
          - "qa_disposition != NONCONFORMING"
          - "at least one QaReading of reading_type F1 exists on this batch"
          - "ph_target_hit_day_index is non-null, i.e. the effective pH ceiling was reached"
        side_effects:
          - "f1_completed_at = logical clock; f2_started_at = logical clock"
          - "f1_measured_abv_pct = abv_pct of the latest F1 reading by reading_at ASC, tie-break created_at ASC"
          - "projected_abv_pct and projected_abv_class recomputed by calculations.batch_abv_projected"

      - name: complete_f2
        axis: ferment_stage
        from: F2_ACTIVE
        to: READY_TO_PACKAGE
        trigger: "POST /batches/{id}/complete-f2"
        actor: ProductionOperator
        preconditions:
          - "ferment_stage == F2_ACTIVE"
          - "qa_disposition != NONCONFORMING"
          - "the logical clock is at or before f2_started_at + F2_MAX_DAYS (7) whole days"
        side_effects:
          - "f2_completed_at = logical clock"
          - "Vessel.free_on_transfer fires: the vessel returns to DIRTY and is released"

      - name: mark_packaged
        axis: ferment_stage
        from: READY_TO_PACKAGE
        to: PACKAGED
        trigger: "system, on PackagingRun.complete_run"
        actor: system
        preconditions: ["remaining_liters becomes exactly 0 after the run's draws are consumed"]
        side_effects: ["ferment_stage = PACKAGED"]
        note: "A source batch with liters still left after the run stays READY_TO_PACKAGE and can feed a second run."

      - name: dump_batch
        axis: ferment_stage
        from: F1_ACTIVE
        to: DUMPED
        trigger: "POST /batches/{id}/dump"
        actor: ProductionOperator
        preconditions: ["ferment_stage in {F1_ACTIVE, F2_ACTIVE, READY_TO_PACKAGE}"]
        side_effects:
          - "loss_liters increased by the current remaining_liters; remaining_liters = 0"
          - "Vessel.free_on_dump fires when the vessel still points at this batch"
        note: "Declared once; the same edge exists from F2_ACTIVE and READY_TO_PACKAGE."

      # --- quality axis ---
      - name: qa_pending_to_conforming
        axis: qa_disposition
        from: PENDING
        to: CONFORMING
        trigger: "system, on POST /batches/{id}/qa-readings"
        actor: system
        preconditions:
          - "the new reading is not flagged"
          - "flagged_reading_count is 0 across the whole batch"
          - "the reading's ph is at or below the effective ceiling min(recipe.target_ph_ceiling, F1_PH_CEILING)"
          - "the reading's day_index is at or above F1_PH_WINDOW_MIN_DAYS (5) and at or below F1_PH_WINDOW_MAX_DAYS (14)"
        side_effects: ["ph_target_hit_day_index = the reading's day_index"]

      - name: qa_to_at_risk
        axis: qa_disposition
        from: PENDING
        to: AT_RISK
        trigger: "system, on POST /batches/{id}/qa-readings"
        actor: system
        preconditions: ["the new reading is flagged and no hard-fail reason is present"]
        side_effects:
          - "flagged_reading_count incremented by 1"
          - "last_flagged_reading_by_user_id = the recording operator's X-User-ID"
        note: "The same edge exists from CONFORMING; a flagged reading always pulls the quality axis back to AT_RISK."

      - name: qa_conforming_to_at_risk
        axis: qa_disposition
        from: CONFORMING
        to: AT_RISK
        trigger: "system, on POST /batches/{id}/qa-readings"
        actor: system
        preconditions: ["the new reading is flagged and no hard-fail reason is present"]
        side_effects:
          - "flagged_reading_count incremented by 1"
          - "last_flagged_reading_by_user_id = the recording operator's X-User-ID"

      - name: qa_signoff_recovery
        axis: qa_disposition
        from: AT_RISK
        to: CONFORMING
        trigger: "POST /batches/{id}/qa-signoff"
        actor: QaManager
        preconditions:
          - "qa_disposition == AT_RISK"
          - "qa_signoff_count == 0"
          - "the most recent QaReading on the batch has flagged == false"
          - "the acting X-User-ID differs from last_flagged_reading_by_user_id"
        side_effects:
          - "qa_signoff_count = 1"
          - "flagged_reading_count is NOT decremented — the conservation invariant qa_flag_conservation keeps it equal to the number of flagged readings"
        note: |
          This is the only edge out of AT_RISK that is not NONCONFORMING. A later
          clean reading does NOT silently restore CONFORMING; the quality axis is
          deliberately non-monotone only through this human action, and
          conservation_invariants.qa_flag_conservation is what makes an
          implementation that quietly re-enters CONFORMING observable.

      - name: qa_hard_fail
        axis: qa_disposition
        from: PENDING
        to: NONCONFORMING
        trigger: "system, on POST /batches/{id}/qa-readings"
        actor: system
        preconditions:
          - "the reading's ph is strictly below PH_HARD_FLOOR (2.5), OR the reading's day_index is strictly greater than F1_PH_WINDOW_MAX_DAYS (14) while ph_target_hit_day_index is still null, OR temp_excursion_count would exceed TEMP_EXCURSION_FLAG_LIMIT (2)"
        side_effects:
          - "flagged_reading_count incremented by 1"
          - "the batch can no longer advance, be drawn from, or be signed off"
        note: "The same edge exists from CONFORMING and from AT_RISK. NONCONFORMING is terminal on the quality axis."

      - name: qa_cascade_nonconforming
        axis: qa_disposition
        from: AT_RISK
        to: NONCONFORMING
        trigger: "system, cascade from IngredientLot.quarantine_lot or ScobyCulture.reverification_fail"
        actor: system
        preconditions: ["ferment_stage in {F1_ACTIVE, F2_ACTIVE, READY_TO_PACKAGE}"]
        side_effects: ["qa_disposition = NONCONFORMING"]
        note: "The same edge exists from PENDING and CONFORMING. Batches already PACKAGED or DUMPED are skipped."

  # ---------------------------------------------------------------- IngredientLot
  - entity: IngredientLot
    initial_state: AVAILABLE
    terminal_states: [CONSUMED, EXPIRED]
    shape: branching
    transitions:
      - name: first_draw
        from: AVAILABLE
        to: PARTIALLY_CONSUMED
        trigger: "POST /batches/{id}/ingredient-uses"
        actor: ProductionOperator
        preconditions: ["status == AVAILABLE", "quantity_used strictly less than quantity_available"]
        side_effects: ["quantity_consumed increased by quantity_used", "quantity_available recomputed"]

      - name: exhaust_lot
        from: PARTIALLY_CONSUMED
        to: CONSUMED
        trigger: "POST /batches/{id}/ingredient-uses"
        actor: ProductionOperator
        preconditions: ["status in {AVAILABLE, PARTIALLY_CONSUMED}", "quantity_used exactly equals quantity_available"]
        side_effects: ["quantity_consumed = quantity_received", "quantity_available = 0"]

      - name: expire_on_clock
        from: AVAILABLE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc"
        actor: PlatformAdmin
        preconditions: ["status in {AVAILABLE, PARTIALLY_CONSUMED}", "the new clock value is strictly after expiry_date"]
        side_effects: ["status = EXPIRED"]
        note: "The same edge exists from PARTIALLY_CONSUMED. Expiry is stamped by the clock endpoint so it is deterministic; the ingredient-use gate additionally rejects a lot whose expiry_date is not strictly after clock + INGREDIENT_EXPIRY_BUFFER_DAYS."

      - name: quarantine_lot
        from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /ingredient-lots/{id}/quarantine"
        actor: ComplianceOfficer
        preconditions: ["status in {AVAILABLE, PARTIALLY_CONSUMED, CONSUMED}"]
        side_effects:
          - "pre_quarantine_status = the status held immediately before this call"
          - "CASCADE ROOT — see cascades.ingredient_recall_cascade for hops 2 through 7"
        note: "The same edge exists from PARTIALLY_CONSUMED and CONSUMED. A lot already EXPIRED or QUARANTINED is rejected with ERR_INVALID_STATE."

      - name: clear_quarantine
        from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /ingredient-lots/{id}/clear-quarantine"
        actor: ComplianceOfficer
        preconditions: ["status == QUARANTINED"]
        side_effects:
          - "status restored to pre_quarantine_status; pre_quarantine_status = null"
          - "quarantine_cleared_count incremented by 1"
          - "batches, packaging runs and finished lots quarantined by the original cascade are NOT automatically restored; each is cleared on its own endpoint"

  # ---------------------------------------------------------------- LabelApproval
  # Shape: cyclic — APPROVED -> STALE -> SUBMITTED -> APPROVED re-entry loop.
  - entity: LabelApproval
    initial_state: DRAFT
    terminal_states: []
    shape: cyclic
    transitions:
      - name: create_draft
        from: null
        to: DRAFT
        trigger: "POST /label-approvals"
        actor: ComplianceOfficer
        preconditions: ["recipe exists"]
        side_effects: ["required_elements computed by calculations.label_required_elements"]

      - name: submit_revision
        from: DRAFT
        to: SUBMITTED
        trigger: "POST /label-approvals/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status in {DRAFT, STALE}"
          - "declared_elements is a superset of required_elements"
        side_effects: ["submitted_by_user_id = acting X-User-ID", "stale_reason = null"]

      - name: resubmit_after_stale
        from: STALE
        to: SUBMITTED
        trigger: "POST /label-approvals/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "status == STALE"
          - "declared_elements is a superset of required_elements recomputed against the recipe's current fields"
        side_effects: ["submitted_by_user_id = acting X-User-ID", "stale_reason = null"]

      - name: approve_revision
        from: SUBMITTED
        to: APPROVED
        trigger: "POST /label-approvals/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "status == SUBMITTED"
          - "the acting X-User-ID differs from submitted_by_user_id (segregation of duties)"
          - "abv_class matches recipe.intended_abv_class"
          - "pasteurized is true whenever recipe.pasteurization_required is true"
        side_effects:
          - "approved_recipe_version_number = recipe.recipe_version_number"
          - "approved_by_user_id = acting X-User-ID; approved_at = logical clock"
          - "Recipe.active_label_approval_id = this approval's id"
          - "any other LabelApproval of the same recipe whose status is APPROVED moves to STALE with stale_reason = RECIPE_REVISED"

      - name: stale_on_recipe_revision
        from: APPROVED
        to: STALE
        trigger: "system, on POST /recipes/{id}/revise"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects:
          - "stale_reason = RECIPE_REVISED"
          - "Recipe.active_label_approval_id = null"
          - "CASCADE — see cascades.recipe_revision_cascade for hops 3 and 4"

  # ---------------------------------------------------------------- PackagingRun
  # Shape: branching with a fan-in join (SOURCED -> IN_PROGRESS requires EVERY
  # source batch to satisfy the join condition) and two divergent terminals.
  - entity: PackagingRun
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABORTED]
    shape: branching
    transitions:
      - name: open_run
        from: null
        to: DRAFT
        trigger: "POST /packaging-runs"
        actor: ProductionOperator
        preconditions:
          - "recipe exists; label approval exists and belongs to the same recipe"
          - "pasteurized is true whenever recipe.pasteurization_required is true"
        side_effects: ["created_by_user_id = acting X-User-ID", "source_draws = [], gross_liters = 0, units_produced = 0"]

      - name: first_source_draw
        from: DRAFT
        to: SOURCED
        trigger: "POST /packaging-runs/{id}/sources"
        actor: ProductionOperator
        preconditions:
          - "status == DRAFT"
          - "batch.ferment_stage == READY_TO_PACKAGE and batch.qa_disposition in {PENDING, CONFORMING, AT_RISK}"
          - "batch.recipe_id == run.recipe_id"
          - "liters_drawn at or above BLEND_MIN_DRAW_LITERS (20.0) and at or below batch.remaining_liters"
          - "expected_batch_version equals the batch's current version (OCC)"
        side_effects:
          - "appends { batch_id, liters_drawn, drawn_at } to source_draws; source_batch_count = 1"
          - "batch.drawn_liters increased by liters_drawn; batch.remaining_liters decreased by the same amount"
          - "increments Batch.version by 1"
          - "gross_liters recomputed"

      - name: additional_source_draw
        from: SOURCED
        to: SOURCED
        trigger: "POST /packaging-runs/{id}/sources"
        actor: ProductionOperator
        preconditions:
          - "status == SOURCED"
          - "source_batch_count strictly less than BLEND_MAX_SOURCE_BATCHES (4)"
          - "the same preconditions as first_source_draw apply to the new batch"
          - "expected_batch_version equals the new batch's current version (OCC)"
        side_effects:
          - "appends the draw; source_batch_count incremented"
          - "batch.drawn_liters increased; increments Batch.version by 1"
          - "gross_liters recomputed"

      - name: start_run
        from: SOURCED
        to: IN_PROGRESS
        trigger: "POST /packaging-runs/{id}/start"
        actor: ProductionOperator
        preconditions:
          - "status in {DRAFT, SOURCED} — a DRAFT run is accepted by the state gate on purpose so the empty-source boundary is reachable, and then always fails the next gate"
          - "source_batch_count is at least 1, otherwise ERR_BLEND_RULE_VIOLATION with reason NO_SOURCE_BATCHES"
          - "FAN-IN JOIN: every batch named in source_draws has ferment_stage == READY_TO_PACKAGE and qa_disposition == CONFORMING"
          - "label_approval.status == APPROVED"
          - "label_approval.approved_recipe_version_number == recipe.recipe_version_number"
          - "label_approval.pasteurized == run.pasteurized"
        side_effects:
          - "started_by_user_id = acting X-User-ID"
          - "net_liters and units_produced computed by calculations.packaging_yield"

      - name: complete_run
        from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /packaging-runs/{id}/complete"
        actor: ProductionOperator
        preconditions:
          - "status == IN_PROGRESS"
          - "every source batch has a QaReading of reading_type PACKAGING, so packaging_abv_pct is set"
          - "the lot's measured abv_class is covered by label_approval.abv_class"
          - "measured ABV does not exceed the projected ABV by more than ABV_DIVERGENCE_TOLERANCE_PCT (0.05) unless the label approval already carries abv_class ALCOHOLIC"
        side_effects:
          - "a FinishedLot is created in status HELD with lot_code, measured_abv_pct, abv_class, best_by_date, units_produced and container_liters populated"
          - "finished_lot_id mirrored on the run"
          - "each source batch whose remaining_liters is 0 moves to ferment_stage PACKAGED (Batch.mark_packaged)"

      - name: abort_run
        from: SOURCED
        to: ABORTED
        trigger: "POST /packaging-runs/{id}/abort"
        actor: ProductionOperator
        preconditions: ["status in {DRAFT, SOURCED, IN_PROGRESS}"]
        side_effects:
          - "COMPENSATION: for every entry in source_draws, batch.drawn_liters decreased and batch.remaining_liters increased by liters_drawn, restoring conservation_invariants.batch_volume_conservation"
          - "increments Batch.version by 1 for each source batch"
          - "source_draws retained for audit; no FinishedLot is created"
        note: "The same edge exists from DRAFT and IN_PROGRESS."

      - name: flag_run_on_recall
        from: COMPLETED
        to: RECALL_FLAGGED
        trigger: "system, cascade from IngredientLot.quarantine_lot"
        actor: system
        preconditions: ["status == COMPLETED", "at least one source batch was reached by cascade hop 2"]
        side_effects: ["CASCADE hop 3 — the run's FinishedLot is quarantined (hop 4)"]
        note: "A run in status ABORTED is never flagged; it emitted no lot."

  # ---------------------------------------------------------------- FinishedLot
  # Shape: capped re-entry loop — RELEASED -> QUARANTINED -> RELEASED is allowed
  # at most LOT_QUARANTINE_CLEARANCE_CAP times; the next quarantine can only
  # terminate in RECALLED.
  - entity: FinishedLot
    initial_state: HELD
    terminal_states: [RECALLED, DEPLETED]
    shape: cyclic
    transitions:
      - name: emit_lot
        from: null
        to: HELD
        trigger: "system, on PackagingRun.complete_run"
        actor: system
        preconditions: ["the packaging run reached IN_PROGRESS and every completion gate passed"]
        side_effects:
          - "on_hand_units = units_produced; reserved_units = 0; shipped_units = 0; poured_units = 0; destroyed_units = 0"

      - name: release_lot
        from: HELD
        to: RELEASED
        trigger: "POST /finished-lots/{id}/release"
        actor: QaManager
        preconditions:
          - "status == HELD"
          - "the logical clock is at or after packaged_at + LOT_RELEASE_MIN_HOLD_HOURS (48 h), inclusive of the exact 48-hour instant"
          - "the acting X-User-ID differs from the packaging run's created_by_user_id (segregation of duties)"
        side_effects: ["released_by_user_id and released_at set"]

      - name: quarantine_lot
        from: RELEASED
        to: QUARANTINED
        trigger: "POST /finished-lots/{id}/quarantine, or system cascade hop 4"
        actor: ComplianceOfficer
        preconditions: ["status in {HELD, RELEASED}"]
        side_effects:
          - "pre_quarantine_status = the status held immediately before this call"
          - "CASCADE hop 5 — downstream shipment lines, subscription allocations and kegs are unwound; see cascades.ingredient_recall_cascade"
          - "CASCADE hop 6 — a RecallNotice is created for every exposed Account"
        note: "The same edge exists from HELD. A lot already QUARANTINED, RECALLED or DEPLETED is rejected with ERR_INVALID_STATE."

      - name: clear_lot_quarantine
        from: QUARANTINED
        to: RELEASED
        trigger: "POST /finished-lots/{id}/clear-quarantine"
        actor: ComplianceOfficer
        preconditions:
          - "status == QUARANTINED"
          - "quarantine_clearance_count strictly less than LOT_QUARANTINE_CLEARANCE_CAP (1)"
        side_effects:
          - "status restored to pre_quarantine_status; quarantine_clearance_count incremented by 1"
          - "every SubscriptionAllocation reversed with reason LOT_QUARANTINED whose reallocation_attempt_count is strictly less than SUBSCRIPTION_REALLOCATION_ATTEMPT_CAP (2) returns to ALLOCATED, reallocation_attempt_count incremented, lot.reserved_units increased and subscription.credit_balance decreased by charge_amount"
          - "shipment lines set to RECALLED are NOT restored; the sales rep must open a new shipment"

      - name: recall_lot
        from: QUARANTINED
        to: RECALLED
        trigger: "POST /finished-lots/{id}/recall"
        actor: ComplianceOfficer
        preconditions: ["status == QUARANTINED"]
        side_effects:
          - "destroyed_units increased by on_hand_units; on_hand_units = 0; reserved_units = 0"
          - "every SubscriptionAllocation still ALLOCATED moves to REVERSED with reversal_reason LOT_RECALLED"
          - "a RecallNotice with trigger_source LOT_RECALL is created for every Account not already holding a PENDING notice for this lot"

      - name: deplete_lot
        from: RELEASED
        to: DEPLETED
        trigger: "system, evaluated after any transition that decreases on_hand_units"
        actor: system
        preconditions: ["status == RELEASED", "on_hand_units becomes exactly 0"]
        side_effects: ["status = DEPLETED"]

  # ---------------------------------------------------------------- Keg
  # Shape: cyclic with a branch — after FILLED the asset either goes down the
  # taproom leg (ON_TAP <-> FILLED, EMPTY) or the wholesale deposit leg
  # (ON_DEPOSIT -> RETURNED | SCRAPPED). Both legs return to FILLED via refill.
  - entity: Keg
    initial_state: IN_STOCK
    terminal_states: [SCRAPPED]
    shape: cyclic
    transitions:
      - name: register_keg
        from: null
        to: IN_STOCK
        trigger: "POST /kegs"
        actor: ProductionOperator
        preconditions: []
        side_effects: ["deposit_state = NONE; deposit_amount = 0; remaining_liters = 0"]

      - name: fill_keg
        from: IN_STOCK
        to: FILLED
        trigger: "POST /kegs/{id}/fill"
        actor: ProductionOperator
        preconditions:
          - "status in {IN_STOCK, EMPTY, RETURNED}"
          - "lot.status == RELEASED and lot.format == KEG"
          - "lot.on_hand_units minus lot.reserved_units is at least 1"
          - "fill_liters at or below capacity_liters"
        side_effects:
          - "finished_lot_id set; fill_liters = KEG_FILL_LITERS; remaining_liters = 0 until tapped"
          - "lot.on_hand_units decreased by 1; lot.poured_units increased by 1"
          - "deposit_state reset to NONE and deposit_amount reset to 0 for the new cycle"
        note: "The same edge exists from EMPTY and RETURNED, which is what closes the asset cycle."

      - name: tap_keg
        from: FILLED
        to: ON_TAP
        trigger: "POST /kegs/{id}/tap"
        actor: TaproomStaff
        preconditions:
          - "status == FILLED"
          - "deposit_state == NONE (a keg out on deposit cannot be tapped in house)"
          - "when last_untapped_at is non-null, the logical clock is strictly after last_untapped_at + KEG_RETAP_BUFFER_MINUTES (15 min)"
        side_effects:
          - "tapped_at = logical clock"
          - "remaining_liters = round(fill_liters - KEG_BLOWOFF_ALLOWANCE_LITERS, 2)"

      - name: untap_keg
        from: ON_TAP
        to: FILLED
        trigger: "POST /kegs/{id}/untap"
        actor: TaproomStaff
        preconditions: ["status == ON_TAP"]
        side_effects: ["last_untapped_at = logical clock; tapped_at = null"]

      - name: empty_keg
        from: ON_TAP
        to: EMPTY
        trigger: "system, evaluated after each TaproomFill.pour_fill"
        actor: system
        preconditions: ["remaining_liters after the pour is strictly below KEG_MIN_RESIDUAL_LITERS (0.2)"]
        side_effects: ["remaining_liters = 0; finished_lot_id = null; last_untapped_at = logical clock"]

      - name: issue_on_deposit
        from: FILLED
        to: ON_DEPOSIT
        trigger: "POST /kegs/{id}/issue"
        actor: SalesRep
        preconditions:
          - "status == FILLED and deposit_state == NONE"
          - "account.status == ACTIVE"
          - "when the keg's lot abv_class is ALCOHOLIC, account.alcoholic_license_on_file is true"
        side_effects:
          - "account_id set; issued_at = logical clock"
          - "deposit_state = CHARGED; deposit_amount = KEG_DEPOSIT_AMOUNT (45.00)"
          - "account.keg_deposit_balance increased by 45.00; account.kegs_charged_lifetime incremented by 1"

      - name: return_keg_good
        from: ON_DEPOSIT
        to: RETURNED
        trigger: "POST /kegs/{id}/return with condition = GOOD"
        actor: SalesRep
        preconditions: ["status == ON_DEPOSIT and deposit_state == CHARGED"]
        side_effects:
          - "returned_at = logical clock; deposit_refund_amount and deposit_forfeit_amount computed by calculations.keg_deposit_settlement"
          - "deposit_state = REFUNDED when deposit_forfeit_amount is 0, otherwise FORFEITED"
          - "account.keg_deposit_balance decreased by 45.00; account.deposit_refunded_total increased by deposit_refund_amount; account.deposit_forfeited_total increased by deposit_forfeit_amount"
          - "account_id cleared; deposit_amount reset to 0"

      - name: return_keg_damaged
        from: ON_DEPOSIT
        to: SCRAPPED
        trigger: "POST /kegs/{id}/return with condition = DAMAGED"
        actor: SalesRep
        preconditions: ["status == ON_DEPOSIT and deposit_state == CHARGED"]
        side_effects:
          - "returned_at = logical clock; deposit_refund_amount = 0.00; deposit_forfeit_amount = 45.00"
          - "deposit_state = FORFEITED"
          - "account.keg_deposit_balance decreased by 45.00; account.deposit_forfeited_total increased by 45.00"
          - "the asset is scrapped and can never be filled again"

  # ---------------------------------------------------------------- Shipment
  # Shape: linear pipeline with a revert edge (CANCELLED) and a cascade-only
  # detour (RECALL_HOLD).
  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [PAID, CANCELLED]
    shape: branching
    transitions:
      - name: open_shipment
        from: null
        to: DRAFT
        trigger: "POST /shipments"
        actor: SalesRep
        preconditions: ["account exists"]
        side_effects: ["created_by_user_id = acting X-User-ID; aging_bucket = CURRENT"]

      - name: confirm_shipment
        from: DRAFT
        to: CONFIRMED
        trigger: "POST /shipments/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "status == DRAFT and at least one line has line_status ACTIVE"
          - "every gate in gate_precedence.post_shipment_confirm passes, in the declared order"
        side_effects:
          - "confirmed_at = logical clock"
          - "subtotal, total_units and total_liters recomputed over lines whose line_status is ACTIVE"
        note: "Reservation happens at line-add time, not here; confirm only re-checks the commercial gates."

      - name: deliver_shipment
        from: CONFIRMED
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: SalesRep
        preconditions: ["status == CONFIRMED"]
        side_effects:
          - "delivered_on_date = logical clock; due_date = delivered_on_date + account.credit_terms_days whole days"
          - "for each ACTIVE line, lot.reserved_units decreased and lot.shipped_units increased by line.units; lot.on_hand_units decreased by line.units"
          - "account.outstanding_balance increased by subtotal"
          - "when account.channel == SELF_DISTRIBUTION, account.ytd_self_dist_liters increased by total_liters"
          - "FinishedLot.deplete_lot fires for any lot whose on_hand_units becomes 0"

      - name: pay_shipment
        from: DELIVERED
        to: PAID
        trigger: "POST /accounts/{id}/payments naming this shipment"
        actor: SalesRep
        preconditions: ["status == DELIVERED", "the payment amount equals subtotal + late_fee, both rounded to 2 decimals"]
        side_effects:
          - "paid_at = logical clock; days_past_due frozen; aging_bucket frozen"
          - "account.outstanding_balance decreased by subtotal"
          - "when account.status == CREDIT_HOLD and no remaining DELIVERED shipment of the account is more than CREDIT_HOLD_PAST_DUE_DAYS (45) days past due, account.status returns to ACTIVE"

      - name: cancel_shipment
        from: CONFIRMED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: SalesRep
        preconditions: ["status in {DRAFT, CONFIRMED, RECALL_HOLD}"]
        side_effects:
          - "COMPENSATION: for every line with line_status ACTIVE, lot.reserved_units decreased by line.units and line_status set to CANCELLED"
          - "conservation_invariants.finished_goods_unit_conservation is restored exactly"
        note: "The same edge exists from DRAFT and RECALL_HOLD."

      - name: recall_hold_shipment
        from: CONFIRMED
        to: RECALL_HOLD
        trigger: "system, cascade hop 5 from FinishedLot.quarantine_lot"
        actor: system
        preconditions: ["status == CONFIRMED", "at least one line with line_status ACTIVE references the quarantined lot"]
        side_effects:
          - "each such line moves to line_status RECALLED and lot.reserved_units is decreased by line.units"
          - "subtotal, total_units and total_liters recomputed over the remaining ACTIVE lines"
        note: "Shipments in DELIVERED, PAID or CANCELLED are NOT moved to RECALL_HOLD and their lines are NOT altered; the exposure is communicated by a RecallNotice instead. A DRAFT shipment keeps status DRAFT while its exposed lines still move to RECALLED."

  # ---------------------------------------------------------------- Subscription
  # Shape: cyclic with a capped self-loop (skip) and a pause/resume loop.
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    shape: cyclic
    transitions:
      - name: create_subscription
        from: null
        to: ACTIVE
        trigger: "POST /subscriptions"
        actor: PlatformAdmin
        preconditions: ["preferred recipe exists", "no other subscription with the same subscriber_email has status ACTIVE or PAUSED"]
        side_effects: ["cycle_start_date = logical clock; cycle_index = 1; next_cycle_charge computed by calculations.subscription_cycle_charge"]

      - name: pause_subscription
        from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Subscriber
        preconditions:
          - "status == ACTIVE"
          - "the requested closed interval [start_date, end_date] has end_date on or after start_date and spans at or below SUBSCRIPTION_PAUSE_MAX_DAYS (60) days counting both ends"
          - "the requested closed interval does not intersect any interval already in pause_windows; touching endpoints count as an intersection"
        side_effects:
          - "current_pause_start_date and current_pause_end_date set"
          - "next_cycle_charge recomputed by calculations.subscription_cycle_charge (pause_proration variant)"

      - name: resume_subscription
        from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Subscriber
        preconditions: ["status == PAUSED"]
        side_effects:
          - "the open pause interval is appended to pause_windows and the current_pause_* fields are cleared"
          - "next_cycle_charge recomputed"

      - name: skip_cycle
        from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/skip"
        actor: Subscriber
        preconditions:
          - "status == ACTIVE"
          - "skips_used_this_year strictly less than SUBSCRIPTION_SKIP_CAP_PER_YEAR (3)"
          - "no SubscriptionAllocation with status ALLOCATED exists for the current cycle_index"
        side_effects:
          - "skips_used_this_year incremented by 1; cycle_index incremented by 1; cycle_start_date advanced by SUBSCRIPTION_CYCLE_DAYS (28) whole days"
          - "credit_balance increased by the full next_cycle_charge (skip_credit variant of calculations.subscription_cycle_charge)"

      - name: cancel_subscription
        from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Subscriber
        preconditions: ["status in {ACTIVE, PAUSED}"]
        side_effects:
          - "every SubscriptionAllocation with status ALLOCATED moves to REVERSED with reversal_reason SUBSCRIPTION_CANCELLED and lot.reserved_units is decreased by units"
          - "allocations already SHIPPED are untouched"
        note: "The same edge exists from PAUSED."

  # ---------------------------------------------------------------- TaproomFill
  # Shape: branching — the CUSTOMER_GROWLER path must pass through INSPECTED,
  # the HOUSE_GROWLER and GLASS_POUR paths pour straight from REQUESTED.
  - entity: TaproomFill
    initial_state: REQUESTED
    terminal_states: [POURED]
    shape: branching
    transitions:
      - name: request_fill
        from: null
        to: REQUESTED
        trigger: "POST /taproom-fills"
        actor: TaproomStaff
        preconditions:
          - "keg.status == ON_TAP"
          - "requested_liters at or above POUR_MIN_LITERS (0.1)"
          - "when container_type is HOUSE_GROWLER or CUSTOMER_GROWLER, requested_liters at or below GROWLER_MAX_FILL_LITERS (1.9)"
        side_effects: ["fill_status = REQUESTED; charge_amount = 0 until poured"]

      - name: inspect_growler
        from: REQUESTED
        to: INSPECTED
        trigger: "POST /taproom-fills/{id}/inspect"
        actor: TaproomStaff
        preconditions: ["fill_status == REQUESTED", "container_type == CUSTOMER_GROWLER"]
        side_effects: ["inspected_at = logical clock; inspected_by_user_id = acting X-User-ID"]

      - name: pour_fill
        from: REQUESTED
        to: POURED
        trigger: "POST /taproom-fills/{id}/pour"
        actor: TaproomStaff
        preconditions:
          - "every gate in gate_precedence.post_taproom_pour passes, in the declared order"
          - "container_type is HOUSE_GROWLER or GLASS_POUR (a CUSTOMER_GROWLER may only be poured from INSPECTED)"
        side_effects:
          - "poured_liters = requested_liters; poured_at = logical clock"
          - "keg.remaining_liters decreased by poured_liters"
          - "charge_amount computed by calculations.taproom_fill_charge"
          - "Keg.empty_keg fires when the remainder drops strictly below KEG_MIN_RESIDUAL_LITERS (0.2)"

      - name: pour_inspected_fill
        from: INSPECTED
        to: POURED
        trigger: "POST /taproom-fills/{id}/pour"
        actor: TaproomStaff
        preconditions:
          - "fill_status == INSPECTED"
          - "the logical clock is at or before inspected_at + GROWLER_INSPECTION_VALID_HOURS (24 h)"
          - "every gate in gate_precedence.post_taproom_pour passes, in the declared order"
        side_effects:
          - "same side effects as pour_fill, plus the CUSTOMER_GROWLER_SANITATION_FEE component of charge_amount"

  # ---------------------------------------------------------------- RecallNotice
  - entity: RecallNotice
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    shape: branching
    transitions:
      - name: issue_notice
        from: null
        to: PENDING
        trigger: "system, cascade hop 6 from FinishedLot.quarantine_lot or FinishedLot.recall_lot"
        actor: system
        preconditions: ["the account has at least one exposure to the lot that survives the hop-5 filters"]
        side_effects:
          - "issued_at = logical clock; ack_deadline_at = issued_at + RECALL_ACK_DEADLINE_HOURS (24 h)"
          - "trigger_source = INGREDIENT_LOT_QUARANTINE when the chain began at POST /ingredient-lots/{id}/quarantine, LOT_QUARANTINE when it began at POST /finished-lots/{id}/quarantine, and LOT_RECALL when it began at POST /finished-lots/{id}/recall"
          - "CASCADE hop 7: account.open_recall_notice_count recomputed"

      - name: acknowledge_notice
        from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /recall-notices/{id}/acknowledge"
        actor: SalesRep
        preconditions: ["status in {PENDING, OVERDUE}"]
        side_effects:
          - "acknowledged_at = logical clock; acknowledged_by_user_id = acting X-User-ID"
          - "account.open_recall_notice_count decreased by 1"
        note: "The same edge exists from OVERDUE."

      - name: notice_overdue
        from: PENDING
        to: OVERDUE
        trigger: "POST /_clock/set_current_utc"
        actor: PlatformAdmin
        preconditions: ["status == PENDING", "the new clock value is strictly after ack_deadline_at"]
        side_effects: ["status = OVERDUE; open_recall_notice_count is unchanged because OVERDUE still counts as open"]

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: packaging-source-draw-stale-batch
    parent_entity: Batch
    write_endpoint: "POST /packaging-runs/{id}/sources"
    occ_field: "expected_batch_version"
    description: |
      Adding a source draw against a Batch whose version has advanced since the
      client last observed it is rejected. A batch that is READY_TO_PACKAGE may
      legitimately feed several packaging runs, so a second draw is a valid
      product operation and cannot be resolved by a state precondition; the
      stale-version check is what stops a client from drawing against liters it
      believes are still there.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: shipment-line-add-stale-lot
    parent_entity: FinishedLot
    write_endpoint: "POST /shipments/{id}/lines"
    occ_field: "expected_finished_lot_version"
    description: |
      Adding a shipment line against a FinishedLot whose version has advanced
      since the client last observed it is rejected. A RELEASED lot may
      legitimately back many shipment lines, so the second add is valid product
      behaviour; the stale version says the client's view of on_hand_units and
      reserved_units predates another reservation.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: subscription-allocation-stale-lot
    parent_entity: FinishedLot
    write_endpoint: "POST /subscription-allocations"
    occ_field: "expected_finished_lot_version"
    description: |
      Creating a subscription allocation against a FinishedLot whose version has
      advanced since the client last observed it is rejected. Many subscriptions
      may draw boxes from one released lot, so a second allocation is a valid
      operation, and only the stale version distinguishes a client acting on an
      out-of-date availability figure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Named cascades — every hop is caused by the previous hop
# =============================================================================
cascades:

  ingredient_recall_cascade:
    trigger: "POST /ingredient-lots/{id}/quarantine"
    max_depth: 7
    hops:
      - hop: 1
        change: "IngredientLot.status AVAILABLE | PARTIALLY_CONSUMED | CONSUMED -> QUARANTINED; pre_quarantine_status recorded"
      - hop: 2
        caused_by: "hop 1"
        change: "every Batch reachable through a BatchIngredientUse row with voided == false, whose ferment_stage is F1_ACTIVE, F2_ACTIVE or READY_TO_PACKAGE, gets qa_disposition = NONCONFORMING"
        does_not_fire:
          - "uses with voided == true do not reach their batch"
          - "batches already PACKAGED or DUMPED keep their qa_disposition"
      - hop: 3
        caused_by: "hop 2"
        change: "every PackagingRun in status COMPLETED that names one of the hop-2 batches in source_draws moves to RECALL_FLAGGED"
        does_not_fire:
          - "runs in status ABORTED are skipped — they emitted no lot"
          - "runs in status DRAFT, SOURCED or IN_PROGRESS are skipped by this cascade; they are blocked instead by the CONFORMING fan-in gate at start_run"
      - hop: 4
        caused_by: "hop 3"
        change: "the FinishedLot of each RECALL_FLAGGED run, when its status is HELD or RELEASED, moves to QUARANTINED with pre_quarantine_status recorded"
        does_not_fire:
          - "lots already QUARANTINED, RECALLED or DEPLETED are skipped"
      - hop: 5
        caused_by: "hop 4"
        change: |
          for each newly QUARANTINED lot:
            (a) every ShipmentLine with line_status ACTIVE on a shipment in status DRAFT or CONFIRMED moves to RECALLED and the lot's reserved_units is decreased by the line's units; a CONFIRMED shipment additionally moves to RECALL_HOLD;
            (b) every SubscriptionAllocation with status ALLOCATED moves to REVERSED with reversal_reason LOT_QUARANTINED, the lot's reserved_units is decreased by units, and subscription.credit_balance is increased by charge_amount;
            (c) every Keg with status FILLED from that lot moves to EMPTY with remaining_liters 0 and the lot's destroyed_units increased by 1
        does_not_fire:
          - "lines on shipments in DELIVERED, PAID or CANCELLED are untouched"
          - "allocations already SHIPPED or REVERSED are untouched"
          - "kegs in status ON_TAP, ON_DEPOSIT, RETURNED or SCRAPPED are untouched"
      - hop: 6
        caused_by: "hop 5"
        change: "one RecallNotice in status PENDING is created per (Account, lot) pair that has any exposure: an ACTIVE or RECALLED line on any shipment of the account referencing the lot, or a Keg from the lot held by the account with deposit_state CHARGED"
        does_not_fire:
          - "an account that already holds a PENDING notice for the same lot does not get a second one"
      - hop: 7
        caused_by: "hop 6"
        change: "Account.open_recall_notice_count recomputed as the number of RecallNotice rows for the account whose status is PENDING or OVERDUE"

  recipe_revision_cascade:
    trigger: "POST /recipes/{id}/revise"
    max_depth: 4
    hops:
      - hop: 1
        change: "Recipe.recipe_version_number incremented by 1"
      - hop: 2
        caused_by: "hop 1"
        change: "every LabelApproval of that recipe with status APPROVED moves to STALE with stale_reason RECIPE_REVISED; Recipe.active_label_approval_id set to null"
      - hop: 3
        caused_by: "hop 2"
        change: "every PackagingRun in status DRAFT or SOURCED whose label_approval_id names a now-STALE approval moves to ABORTED — an in-flight run may not print a stale label"
        does_not_fire:
          - "runs already COMPLETED keep their status; the lot is already printed and released on the older revision"
          - "runs in IN_PROGRESS keep their status; the fill is physically under way and is instead blocked at complete_run by the label-version gate"
      - hop: 4
        caused_by: "hop 3"
        change: "for each aborted run, every source draw is returned: batch.drawn_liters decreased and batch.remaining_liters increased by liters_drawn, and Batch.version incremented"

  lot_release_reallocation_cascade:
    trigger: "POST /finished-lots/{id}/clear-quarantine"
    max_depth: 3
    hops:
      - hop: 1
        change: "FinishedLot.status QUARANTINED -> pre_quarantine_status; quarantine_clearance_count incremented"
      - hop: 2
        caused_by: "hop 1"
        change: "every SubscriptionAllocation reversed with reason LOT_QUARANTINED whose reallocation_attempt_count is strictly less than SUBSCRIPTION_REALLOCATION_ATTEMPT_CAP (2) returns to ALLOCATED with reallocation_attempt_count incremented; the lot's reserved_units is increased by units"
        does_not_fire:
          - "allocations reversed with reason LOT_RECALLED or SUBSCRIPTION_CANCELLED are never re-instated"
          - "an allocation whose reallocation_attempt_count already equals 2 stays REVERSED"
      - hop: 3
        caused_by: "hop 2"
        change: "subscription.credit_balance decreased by the allocation's charge_amount, undoing the credit granted at reversal"

# =============================================================================
# Conservation invariants — a forward action and its compensation must leave
# each named quantity exactly unchanged.
# =============================================================================
conservation_invariants:

  - name: finished_goods_unit_conservation
    quantity: "physical units of a finished lot"
    formula: "FinishedLot.units_produced == FinishedLot.on_hand_units + FinishedLot.shipped_units + FinishedLot.poured_units + FinishedLot.destroyed_units"
    side_condition: "FinishedLot.reserved_units is at all times at or below FinishedLot.on_hand_units"
    forward_action: "POST /shipments/{id}/lines then POST /shipments/{id}/confirm"
    compensating_action: "POST /shipments/{id}/cancel"
    note: "reserved_units is a claim on on_hand_units, not a separate bucket, so cancelling a reservation must move exactly zero units between the four conserved buckets."

  - name: batch_volume_conservation
    quantity: "liters of work in process for one batch"
    formula: "Batch.pitched_liters == Batch.remaining_liters + Batch.drawn_liters + Batch.loss_liters"
    forward_action: "POST /packaging-runs/{id}/sources"
    compensating_action: "POST /packaging-runs/{id}/abort"

  - name: keg_deposit_conservation
    quantity: "deposit dollars held against one account"
    formula: "Account.keg_deposit_balance == KEG_DEPOSIT_AMOUNT * count(Keg where account_id == Account.id and deposit_state == CHARGED)"
    side_condition: "KEG_DEPOSIT_AMOUNT * Account.kegs_charged_lifetime == Account.keg_deposit_balance + Account.deposit_refunded_total + Account.deposit_forfeited_total"
    forward_action: "POST /kegs/{id}/issue"
    compensating_action: "POST /kegs/{id}/return"
    note: "The side condition is what catches a partial refund that silently drops the forfeited remainder."

  - name: qa_flag_conservation
    quantity: "count of flagged QA readings on one batch"
    formula: "Batch.flagged_reading_count == count(QaReading where batch_id == Batch.id and flagged == true)"
    monotonicity: "non-decreasing for the life of the batch"
    forward_action: "POST /batches/{id}/qa-readings that raises a flag"
    compensating_action: "POST /batches/{id}/qa-signoff"
    note: |
      The sign-off is the ONLY way back to CONFORMING and it deliberately does
      not decrement the counter. An implementation that derives qa_disposition
      from a time window or from the latest reading alone will silently
      re-enter CONFORMING after a clean reading; that drift is invisible on
      qa_disposition itself and only shows up as flagged_reading_count
      disagreeing with the QA log.

  - name: ingredient_quantity_conservation
    quantity: "native units of one raw ingredient lot"
    formula: "IngredientLot.quantity_received == IngredientLot.quantity_available + sum(BatchIngredientUse.quantity_used where ingredient_lot_id == IngredientLot.id and voided == false)"
    forward_action: "POST /batches/{id}/ingredient-uses"
    compensating_action: "POST /batch-ingredient-uses/{id}/void"

  - name: self_distribution_ledger_conservation
    quantity: "self-distributed liters in the current calendar year"
    formula: "Account.ytd_self_dist_liters == sum(Shipment.total_liters where account_id == Account.id and channel == SELF_DISTRIBUTION and status in {DELIVERED, PAID} and delivered_on_date falls in the calendar year of the logical clock)"
    forward_action: "POST /shipments/{id}/deliver"
    compensating_action: "none — delivery is not reversible; the ledger is re-derived, never adjusted"

# =============================================================================
# Value conventions (apply to every field and every calculation below)
# =============================================================================
value_conventions:
  datetime_rendering: "ISO 8601 UTC with exactly three fractional digits and a trailing Z, e.g. 2026-05-01T00:00:00.000Z. A value the scaffold calls a date is normalised to 00:00:00.000Z on that calendar day."
  date_arithmetic: "Whole-day arithmetic is calendar-day arithmetic on the UTC date component; adding N days to 2026-05-01T09:00:00.000Z yields 2026-05-01+N at 09:00:00.000Z unless the field is a normalised date."
  day_difference: "`whole days between A and B` means floor((B - A) / 86400 seconds)."
  money: "2 decimal places, round_half_up, dollars."
  volume: "2 decimal places, round_half_up, liters."
  ph_and_abv: "2 decimal places, round_half_up, percent for ABV."
  comparison_of_instants: "Timestamp comparisons are semantic instant comparisons, not string comparisons."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: scoby_vitality_score
    trigger: "on ScobyCulture.create_founder_or_daughter, ScobyCulture.pitch_self_loop and ScobyCulture.reverification_pass"
    algorithm: weighted_scoring
    formula: |
      raw = 100
          - SCOBY_VITALITY_DECAY_PER_PITCH * pitch_count
          - SCOBY_VITALITY_DECAY_PER_GENERATION * (generation_number - 1)
          + SCOBY_REVERIFICATION_BONUS * reverification_count
      vitality_score = max(0, min(100, raw))
    input_set: "the culture's own pitch_count, generation_number and reverification_count as they stand AFTER the triggering mutation is applied"
    constants:
      SCOBY_VITALITY_DECAY_PER_PITCH: 6
      SCOBY_VITALITY_DECAY_PER_GENERATION: 4
      SCOBY_REVERIFICATION_BONUS: 15
      SCOBY_VITALITY_FLOOR: 40
    precision: "integer-valued; clamped to the closed range 0..100"
    variants:
      - name: post_pitch
        when: "recomputed immediately after pitch_count is incremented by ScobyCulture.pitch_self_loop"
        difference: "pitch_count carries every pitch since the last passed reverification, so the score falls by exactly 6 per pitch"
      - name: post_reverification
        when: "recomputed immediately after ScobyCulture.reverification_pass"
        difference: "pitch_count is reset to 0 BEFORE the score is recomputed and reverification_count has already been incremented, so the same lineage history yields a strictly higher score than the post_pitch variant would"
    worked_example: "generation_number 3, pitch_count 9, reverification_count 0 -> 100 - 54 - 8 + 0 = 38 (below the floor). The same culture after a passed reverification -> 100 - 0 - 8 + 15 = 107, clamped to 100."

  - name: batch_abv_estimate
    trigger: "projected variant on Batch.advance_to_f2, readable afterwards on GET /batches/{id}; measured variant on PackagingRun.complete_run"
    algorithm: forward_looking
    formula: |
      # projected variant
      projected_abv_pct = round(
            f1_measured_abv_pct
          + F2_ABV_GAIN_PCT_PER_DAY * planned_f2_days
          + F2_SUGAR_ABV_PCT_PER_GRAM_PER_LITER * f2_added_sugar_g_per_l, 2)
      projected_abv_class = ALCOHOLIC if projected_abv_pct >= NA_ABV_THRESHOLD_PCT else NON_ALCOHOLIC

      # measured variant
      packaging_abv_pct = abv_pct of the batch's QaReading whose reading_type is
          PACKAGING, taking the latest by reading_at ASC with tie-break created_at ASC
    input_set: "the projected variant reads only planned inputs known at the end of F1; the measured variant reads only the PACKAGING reading actually taken at fill time. They are allowed to disagree and routinely do."
    constants:
      F2_ABV_GAIN_PCT_PER_DAY: 0.06
      F2_SUGAR_ABV_PCT_PER_GRAM_PER_LITER: 0.0125
      NA_ABV_THRESHOLD_PCT: 0.5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: projected
        when: "before the fill; the only figure available while planning the label"
        difference: "forward-looking: models the secondary fermentation that has not happened yet"
      - name: measured
        when: "at the fill; the figure printed on the lot"
        difference: "reads an actual instrument value; can land on the other side of NA_ABV_THRESHOLD_PCT from the projected figure"
    worked_example: "f1_measured_abv_pct 0.20, planned_f2_days 4, f2_added_sugar_g_per_l 8 -> 0.20 + 0.24 + 0.10 = 0.54 -> ALCOHOLIC. With planned_f2_days 3 and 4 g/L -> 0.18 + 0.18 + 0.05 = 0.41 -> NON_ALCOHOLIC."

  - name: abv_class_boundary
    trigger: "whenever an ABV figure is classified: Batch.advance_to_f2 (projected) and PackagingRun.complete_run (measured)"
    algorithm: threshold
    formula: |
      abv_class = ALCOHOLIC     if abv_pct >= NA_ABV_THRESHOLD_PCT
                = NON_ALCOHOLIC if abv_pct <  NA_ABV_THRESHOLD_PCT
    input_set: "a single already-rounded ABV percentage"
    constants:
      NA_ABV_THRESHOLD_PCT: 0.5
    precision: "the comparison is made on the value already rounded to 2 decimal places"
    boundary_semantics: "AT OR ABOVE 0.50 is ALCOHOLIC; STRICTLY BELOW 0.50 is NON_ALCOHOLIC. Exactly 0.50 is ALCOHOLIC."

  - name: qa_reading_evaluation
    trigger: "on POST /batches/{id}/qa-readings, before Batch.qa_pending_to_conforming / qa_to_at_risk / qa_hard_fail are evaluated"
    algorithm: chronological
    formula: |
      prior = the batch's readings ordered by reading_at ASC, tie-break created_at ASC,
              restricted to readings strictly earlier than this one
      flag_reasons = []
      if prior is non-empty and ph > prior[-1].ph + PH_REGRESSION_TOLERANCE:
          flag_reasons += [PH_REGRESSION]
      if ph < PH_HARD_FLOOR:
          flag_reasons += [PH_HARD_FLOOR]
      if temperature_c < F1_TEMP_MIN_C or temperature_c > F1_TEMP_MAX_C:
          flag_reasons += [TEMP_EXCURSION]
      if prior is non-empty and (reading_at - prior[-1].reading_at) >
             QA_READING_MAX_GAP_DAYS days + QA_MISSED_READING_GRACE_HOURS hours:
          flag_reasons += [READING_GAP]
      flagged = len(flag_reasons) > 0
      day_index = floor((reading_at - batch.pitched_at) / 86400 seconds)

      # The pH-target stamp is INDEPENDENT of `flagged`. A reading may be
      # flagged for a temperature excursion or a missed interval and still be
      # the reading that first reaches the pH ceiling.
      effective_ceiling = min(recipe.target_ph_ceiling, F1_PH_CEILING)
      if batch.ph_target_hit_day_index is null
         and ph <= effective_ceiling
         and F1_PH_WINDOW_MIN_DAYS <= day_index <= F1_PH_WINDOW_MAX_DAYS:
          batch.ph_target_hit_day_index = day_index
    input_set: "every QaReading already recorded on this batch, regardless of reading_type; voided readings do not exist in this domain"
    constants:
      PH_REGRESSION_TOLERANCE: 0.05
      PH_HARD_FLOOR: 2.5
      F1_TEMP_MIN_C: 20.0
      F1_TEMP_MAX_C: 30.0
      QA_READING_MAX_GAP_DAYS: 2
      QA_MISSED_READING_GRACE_HOURS: 12
      TEMP_EXCURSION_FLAG_LIMIT: 2
    precision: "pH to 2 decimal places; the gap test is on exact instants"
    boundary_semantics: |
      A rise of EXACTLY PH_REGRESSION_TOLERANCE (0.05) over the previous reading
      is NOT a regression; strictly more than 0.05 is. A pH of exactly 2.50 is
      NOT a hard floor breach; strictly below 2.50 is. Temperatures of exactly
      20.0 or exactly 30.0 are inside the band. A gap of exactly 60 hours
      (2 days + 12 hours) is NOT a READING_GAP; strictly more is.

  - name: label_required_elements
    trigger: "on LabelApproval.create_draft and re-evaluated on LabelApproval.submit_revision and LabelApproval.resubmit_after_stale"
    algorithm: constraint_propagation
    formula: |
      required = [PRODUCT_NAME, NET_CONTENTS, INGREDIENTS, PRODUCER_ADDRESS, LOT_CODE, BEST_BY]
      if abv_class == NON_ALCOHOLIC:
          required += [NON_ALCOHOLIC_STATEMENT, CONTAINS_LESS_THAN_HALF_PERCENT_ALCOHOL]
      else:
          required += [ALCOHOL_CONTENT_STATEMENT, GOVERNMENT_WARNING, AGE_RESTRICTED]
      if pasteurized:
          required += [PASTEURIZED_STATEMENT]
      else:
          required += [KEEP_REFRIGERATED, LIVE_CULTURES]
    input_set: "the label revision's own abv_class and pasteurized fields only"
    constants: {}
    precision: "set comparison; declared_elements must be a superset of required_elements"

  - name: packaging_yield
    trigger: "on PackagingRun.start_run; the outputs net_liters and units_produced are stored on the run"
    algorithm: waterfall_allocation
    formula: |
      gross_liters   = round(sum(d.liters_drawn for d in source_draws), 2)
      net_liters     = round(gross_liters * (100 - PACKAGING_LOSS_ALLOWANCE_PCT) / 100, 2)
      container_liters = KEG_FILL_LITERS    if format == KEG
                       = BOTTLE_FILL_LITERS if format == BOTTLE
                       = CAN_FILL_LITERS    if format == CAN
      capacity_units = floor(net_liters / container_liters)
      units_produced = min(capacity_units, max_units_requested)
    input_set: "every entry in source_draws, in append order; aborted runs have no yield"
    constants:
      PACKAGING_LOSS_ALLOWANCE_PCT: 3
      KEG_FILL_LITERS: 19.5
      BOTTLE_FILL_LITERS: 0.375
      CAN_FILL_LITERS: 0.355
    precision: "liters to 2 decimal places, round_half_up; units are integers"
    rounding_order: "net_liters is rounded to 2 decimals BEFORE the floor division. Rounding after the division, or skipping the intermediate rounding, changes units_produced at the margin."
    worked_example: "two draws of 60.00 L and 40.00 L, format BOTTLE, max_units_requested 300 -> gross 100.00, net 97.00, floor(97.00 / 0.375) = 258, units_produced = 258."

  - name: blended_lot_inheritance
    trigger: "on PackagingRun.complete_run, when the FinishedLot is emitted"
    algorithm: aggregation
    formula: |
      sources = the batches named in run.source_draws, ordered by drawn_at ASC,
                tie-break created_at ASC
      measured_abv_pct = round(max(b.packaging_abv_pct for b in sources), 2)
      abv_class        = ALCOHOLIC if measured_abv_pct >= NA_ABV_THRESHOLD_PCT else NON_ALCOHOLIC
      pasteurized      = run.pasteurized
      container_liters = the container_liters selected by run.format
      units_produced   = run.units_produced
      cold_chain_max_c = COLD_CHAIN_MAX_C_PASTEURIZED if run.pasteurized
                         else COLD_CHAIN_MAX_C_RAW
      lot_code         = uppercase(recipe.style[0:3]) + "-" +
                         packaged_at rendered as YYYYMMDD + "-" + run.run_code
    input_set: "only the batches actually named in source_draws; a batch that was drawn and then returned by an abort is not a source of any lot"
    constants:
      NA_ABV_THRESHOLD_PCT: 0.5
      COLD_CHAIN_MAX_C_RAW: 4.0
      COLD_CHAIN_MAX_C_PASTEURIZED: 21.0
    precision: "2 decimal places, round_half_up"
    tie_break: "max() over ABV needs no tie-break; when two sources share the maximum the value is the same"
    note: "The blend inherits the WORST case on ABV (the maximum) and, via lot_best_by_date, the worst case on shelf life (the earliest). This is the fan-in rule."

  - name: lot_best_by_date
    trigger: "on PackagingRun.complete_run, when the FinishedLot is emitted"
    algorithm: threshold
    formula: |
      shelf_days = SHELF_LIFE_PASTEURIZED_DAYS if run.pasteurized else SHELF_LIFE_RAW_DAYS
      if run.source_batch_count == 1:
          base_date = the UTC calendar date of packaged_at
      else:
          base_date = the earliest UTC calendar date among
                      b.f2_completed_at for b in the run's source batches
      best_by_date = base_date + shelf_days whole days, normalised to 00:00:00.000Z
    input_set: "the run's pasteurized flag and, for a blend, the f2_completed_at of every source batch"
    constants:
      SHELF_LIFE_RAW_DAYS: 90
      SHELF_LIFE_PASTEURIZED_DAYS: 270
    precision: "whole calendar days; rendered per value_conventions.datetime_rendering"
    variants:
      - name: single_source
        when: "source_batch_count == 1"
        difference: "the clock starts at the packaging date, so a batch that sat in a brite tank still gets its full shelf life"
      - name: blended
        when: "source_batch_count is 2 or more"
        difference: "the clock starts at the EARLIEST source batch's F2 completion date, so the blend inherits the oldest liquid's remaining life and expires sooner than either single-source variant would"
    worked_example: "raw blend of two batches whose f2_completed_at are 2026-05-20 and 2026-05-24, packaged 2026-05-26 -> base_date 2026-05-20, best_by_date 2026-08-18T00:00:00.000Z. The same fill as a single-source raw run packaged 2026-05-26 -> 2026-08-24T00:00:00.000Z."

  - name: keg_remaining_volume
    trigger: "on Keg.tap_keg and on TaproomFill.pour_fill / TaproomFill.pour_inspected_fill"
    algorithm: decay_function
    formula: |
      on tap:  remaining_liters = round(fill_liters - KEG_BLOWOFF_ALLOWANCE_LITERS, 2)
      on pour: remaining_liters = round(remaining_liters - poured_liters, 2)
      a pour with poured_liters strictly greater than remaining_liters is refused
      after a pour, when remaining_liters < KEG_MIN_RESIDUAL_LITERS the keg moves to EMPTY
    input_set: "the keg's own fill_liters plus every POURED TaproomFill on the current tap"
    constants:
      KEG_BLOWOFF_ALLOWANCE_LITERS: 0.5
      KEG_MIN_RESIDUAL_LITERS: 0.2
      KEG_FILL_LITERS: 19.5
    precision: "2 decimal places, round_half_up"
    boundary_semantics: "A pour of EXACTLY remaining_liters is accepted (it leaves 0.00, strictly below 0.20, so the keg empties). A pour of remaining_liters + 0.01 is refused with ERR_INSUFFICIENT_KEG_VOLUME. A remainder of exactly 0.20 keeps the keg ON_TAP."
    worked_example: "fill_liters 19.50 -> on tap remaining 19.00. A 1.20 L growler fill leaves 17.80."

  - name: taproom_fill_charge
    trigger: "on TaproomFill.pour_fill and TaproomFill.pour_inspected_fill; the output is TaproomFill.charge_amount"
    algorithm: tiered_pricing
    formula: |
      gross         = round(requested_liters * TAPROOM_RATE_PER_LITER, 2)
      discount_pct  = TAPROOM_BULK_DISCOUNT_PCT if requested_liters >= GROWLER_BULK_TIER_LITERS else 0
      discount      = round(gross * discount_pct / 100, 2)
      container_fee = HOUSE_GROWLER_FEE               if container_type == HOUSE_GROWLER    else 0.00
      sanitation_fee= CUSTOMER_GROWLER_SANITATION_FEE if container_type == CUSTOMER_GROWLER else 0.00
      charge_amount = round(gross - discount + container_fee + sanitation_fee, 2)
    input_set: "the fill's own requested_liters and container_type"
    constants:
      TAPROOM_RATE_PER_LITER: 9.00
      TAPROOM_BULK_DISCOUNT_PCT: 10
      GROWLER_BULK_TIER_LITERS: 1.0
      HOUSE_GROWLER_FEE: 3.50
      CUSTOMER_GROWLER_SANITATION_FEE: 1.50
    precision: "2 decimal places, round_half_up"
    boundary_semantics: "A fill of EXACTLY 1.0 L earns the bulk discount (at or above the tier)."
    variants:
      - name: house_growler
        when: "container_type == HOUSE_GROWLER"
        difference: "adds HOUSE_GROWLER_FEE and never a sanitation fee, because the vessel never leaves the building unsanitised"
      - name: customer_growler
        when: "container_type == CUSTOMER_GROWLER"
        difference: "adds CUSTOMER_GROWLER_SANITATION_FEE instead of the container fee, and is only reachable through the INSPECTED branch"
      - name: glass_pour
        when: "container_type == GLASS_POUR"
        difference: "no container fee and no sanitation fee; the same liters therefore cost strictly less than either growler variant"
    worked_example: "1.20 L: gross 10.80, discount 1.08. CUSTOMER_GROWLER -> 11.22; HOUSE_GROWLER -> 13.22; GLASS_POUR -> 9.72. A 0.50 L GLASS_POUR -> 4.50 with no discount."

  - name: keg_deposit_settlement
    trigger: "on Keg.return_keg_good and Keg.return_keg_damaged"
    algorithm: threshold
    formula: |
      days_out = floor((returned_at - issued_at) / 86400 seconds)
      if condition == DAMAGED:
          forfeit = round(KEG_DEPOSIT_AMOUNT * KEG_DAMAGE_FORFEIT_PCT / 100, 2)
      elif days_out <= KEG_RETURN_WINDOW_DAYS:
          forfeit = 0.00
      else:
          forfeit = round(KEG_DEPOSIT_AMOUNT * KEG_LATE_FORFEIT_PCT / 100, 2)
      refund = round(KEG_DEPOSIT_AMOUNT - forfeit, 2)
    input_set: "the keg's own issued_at, the logical clock at return, and the caller-supplied condition"
    constants:
      KEG_DEPOSIT_AMOUNT: 45.00
      KEG_RETURN_WINDOW_DAYS: 90
      KEG_LATE_FORFEIT_PCT: 40
      KEG_DAMAGE_FORFEIT_PCT: 100
    precision: "2 decimal places, round_half_up"
    boundary_semantics: "Returned ON OR BEFORE day 90 (days_out at or below 90) is on time. days_out of exactly 91 is late. A DAMAGED return is late-or-not irrelevant: the whole deposit is forfeited."
    variants:
      - name: on_time_good
        when: "condition GOOD and days_out at or below 90"
        difference: "refund 45.00, forfeit 0.00, deposit_state REFUNDED, keg returns to the fillable pool"
      - name: late_good
        when: "condition GOOD and days_out at or above 91"
        difference: "refund 27.00, forfeit 18.00, deposit_state FORFEITED, keg still returns to the fillable pool"
      - name: damaged
        when: "condition DAMAGED at any age"
        difference: "refund 0.00, forfeit 45.00, deposit_state FORFEITED, keg moves to SCRAPPED and can never be filled again"

  - name: shipment_line_totals
    trigger: "on POST /shipments/{id}/lines and on any transition that changes a line's line_status"
    algorithm: aggregation
    formula: |
      extended_price = round(units * unit_price, 2)
      line_liters    = round(units * lot.container_liters, 2)
      shipment.subtotal     = round(sum(extended_price for lines with line_status == ACTIVE), 2)
      shipment.total_units  = sum(units for lines with line_status == ACTIVE)
      shipment.total_liters = round(sum(line_liters for lines with line_status == ACTIVE), 2)
    input_set: "only lines whose line_status is ACTIVE; RECALLED and CANCELLED lines are excluded from all three totals"
    constants: {}
    precision: "2 decimal places, round_half_up"
    rounding_order: "each line is rounded first, then the rounded line values are summed."

  - name: invoice_aging_and_late_fee
    trigger: "recomputed on Shipment.deliver_shipment, on POST /_clock/set_current_utc, and whenever GET /shipments/{id} is served"
    algorithm: tiered_pricing
    formula: |
      days_past_due = max(0, floor((clock - due_date) / 86400 seconds))
      months_late   = 0 if days_past_due == 0 else ceil(days_past_due / 30)
      late_fee      = sum over lines with line_status == ACTIVE of
                        round(line.extended_price * LATE_FEE_MONTHLY_RATE_PCT / 100 * months_late, 2)
      aging_bucket  = CURRENT     if days_past_due == 0
                    = B1_1_30     if 1  <= days_past_due <= AGING_BUCKET_1_MAX_DAYS
                    = B2_31_60    if AGING_BUCKET_1_MAX_DAYS < days_past_due <= AGING_BUCKET_2_MAX_DAYS
                    = B3_61_PLUS  if days_past_due > AGING_BUCKET_2_MAX_DAYS
    input_set: "shipments in status DELIVERED only; a PAID shipment freezes days_past_due, late_fee and aging_bucket at their values at payment time, and a CANCELLED or RECALL_HOLD shipment has late_fee 0.00 and aging_bucket CURRENT"
    constants:
      LATE_FEE_MONTHLY_RATE_PCT: 1.5
      AGING_BUCKET_1_MAX_DAYS: 30
      AGING_BUCKET_2_MAX_DAYS: 60
    precision: "2 decimal places, round_half_up"
    rounding_order: |
      PINNED: round PER LINE, then sum. Summing the extended prices first and
      rounding the single product afterwards gives a different cent on ordinary
      inputs and is wrong. Worked counter-example: three ACTIVE lines each with
      extended_price 43.60 and days_past_due 10 so months_late 1 -> per line
      round(43.60 * 0.015, 2) = 0.65, total late_fee 1.95, whereas
      sum-then-round gives round(130.80 * 0.015, 2) = 1.96.
    boundary_semantics: "days_past_due of exactly 30 is B1_1_30; exactly 31 is B2_31_60; exactly 60 is B2_31_60; exactly 61 is B3_61_PLUS. days_past_due 0 means the invoice is CURRENT and the fee is 0.00."

  - name: account_credit_exposure
    trigger: "on Shipment.confirm_shipment, as gate 6 of gate_precedence.post_shipment_confirm"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED — the fee feeds the balance, the balance feeds
      # the exposure, and the exposure feeds the limit test. Evaluating the limit
      # against a stale balance is the trap.
      STEP 1: for every shipment of the account with status DELIVERED, recompute
              days_past_due against the current logical clock
      STEP 2: for every such shipment recompute late_fee by
              calculations.invoice_aging_and_late_fee (round per line, then sum)
      STEP 3: outstanding_balance = round(sum(subtotal + late_fee
                 over the account's DELIVERED shipments), 2)
      STEP 4: exposure = round(outstanding_balance + this_shipment.subtotal, 2)
      STEP 5: the confirm is refused when exposure is strictly greater than
              account.credit_limit
    input_set: "the account's DELIVERED shipments only; DRAFT, CONFIRMED, PAID, CANCELLED and RECALL_HOLD shipments contribute nothing to outstanding_balance"
    constants:
      LATE_FEE_MONTHLY_RATE_PCT: 1.5
    precision: "2 decimal places, round_half_up"
    boundary_semantics: "An exposure EXACTLY EQUAL to credit_limit is accepted; strictly greater is refused with ERR_CREDIT_LIMIT_EXCEEDED."
    worked_example: "credit_limit 500.00, one DELIVERED shipment with three ACTIVE lines of 43.60 (subtotal 130.80) at days_past_due 10 -> late_fee 1.95, outstanding_balance 132.75. A new shipment with subtotal 367.25 gives exposure exactly 500.00 and is accepted; a subtotal of 367.26 gives 500.01 and is refused with ERR_CREDIT_LIMIT_EXCEEDED."

  - name: self_distribution_ledger
    trigger: "on Shipment.deliver_shipment, and re-derived on every read of Account"
    algorithm: aggregation
    formula: |
      ytd_self_dist_liters = round(sum(s.total_liters
          for s in shipments where s.account_id == account.id
                              and account.channel == SELF_DISTRIBUTION
                              and s.status in {DELIVERED, PAID}
                              and the UTC calendar year of s.delivered_on_date
                                  equals the UTC calendar year of the logical clock), 2)
    input_set: "shipments in status DELIVERED or PAID only, delivered within the current calendar year; DRAFT, CONFIRMED, CANCELLED and RECALL_HOLD shipments never count"
    constants:
      SELF_DIST_ANNUAL_LITER_CEILING: 4000.0
    precision: "2 decimal places, round_half_up"
    boundary_semantics: "The confirm gate refuses when ytd_self_dist_liters + this shipment's total_liters is STRICTLY GREATER than 4000.0; a projected total of exactly 4000.0 is accepted."

  - name: subscription_cycle_charge
    trigger: "on Subscription.create_subscription, Subscription.pause_subscription, Subscription.resume_subscription and Subscription.skip_cycle; the output is Subscription.next_cycle_charge"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. Proration happens FIRST and the loyalty
      # discount is taken on the prorated base, never on the full base.
      cycle_window = the half-open interval [cycle_start_date,
                     cycle_start_date + SUBSCRIPTION_CYCLE_DAYS days)
      paused_days  = the number of whole calendar days that lie in BOTH the
                     cycle_window and the closed interval
                     [current_pause_start_date, current_pause_end_date]
      active_days  = SUBSCRIPTION_CYCLE_DAYS - paused_days
      STEP 1: prorated_base = round(SUBSCRIPTION_CYCLE_PRICE * active_days
                                    / SUBSCRIPTION_CYCLE_DAYS, 2)
      STEP 2: discount_pct  = LOYALTY_TIER2_DISCOUNT_PCT
                              if completed_cycles >= LOYALTY_MIN_CYCLES else 0
      STEP 3: discount      = round(prorated_base * discount_pct / 100, 2)
      STEP 4: next_cycle_charge = round(prorated_base - discount, 2)
    input_set: "the subscription's own completed_cycles (count of allocations in status SHIPPED) and its open pause window; closed pause windows in pause_windows affect earlier cycles only"
    constants:
      SUBSCRIPTION_CYCLE_DAYS: 28
      SUBSCRIPTION_CYCLE_PRICE: 42.00
      LOYALTY_MIN_CYCLES: 6
      LOYALTY_TIER2_DISCOUNT_PCT: 10
    precision: "2 decimal places, round_half_up"
    boundary_semantics: "completed_cycles of exactly 6 is already TIER_2. A pause interval is closed at both ends, so a pause from day 3 to day 9 inclusive removes 7 days, not 6."
    variants:
      - name: pause_proration
        when: "the subscriber pauses; the cycle still runs but fewer days are billable"
        difference: "prorated_base falls with active_days, and the loyalty discount is then taken on the smaller number"
      - name: skip_credit
        when: "the subscriber skips the whole cycle via Subscription.skip_cycle"
        difference: "no proration at all — the FULL cycle price less the loyalty discount, round(SUBSCRIPTION_CYCLE_PRICE - round(SUBSCRIPTION_CYCLE_PRICE * discount_pct / 100, 2), 2), is added to credit_balance and the cycle window advances. Skipping and pausing the same 28 days therefore leave different money on the account."
    worked_example: "42.00 base. Pause of 7 days with completed_cycles 0 -> active 21, prorated 31.50, discount 0.00, charge 31.50. Same pause with completed_cycles 6 -> prorated 31.50, discount 3.15, charge 28.35. A skip with completed_cycles 6 -> credit 42.00 - 4.20 = 37.80."

  - name: finished_goods_release_order
    trigger: "on POST /subscription-allocations when the caller omits finished_lot_id, and on GET /finished-lots?recipe_id=...&status=RELEASED for the operator view"
    algorithm: chronological
    formula: |
      eligibility: FinishedLot.status == RELEASED
                   AND FinishedLot.recipe_id == subscription.preferred_recipe_id
                   AND (on_hand_units - reserved_units) >= SUBSCRIPTION_BOX_UNITS
                   AND best_by_date is strictly after
                       (logical clock + MIN_REMAINING_SHELF_DAYS days)
      ranking:     best_by_date ASC   (first expiring, first out)
      tie_break:   created_at ASC
      fallback:    when the candidate set is empty the request is refused with
                   ERR_SHELF_LIFE_TOO_SHORT when at least one RELEASED lot of the
                   recipe exists but every one of them fails only the shelf test,
                   otherwise with ERR_INSUFFICIENT_LOT_UNITS
    input_set: "RELEASED lots of the subscription's preferred recipe only; HELD, QUARANTINED, RECALLED and DEPLETED lots are never candidates"
    constants:
      SUBSCRIPTION_BOX_UNITS: 6
      MIN_REMAINING_SHELF_DAYS: 14
    precision: "integer units; dates compared as instants"
    boundary_semantics: "A lot whose best_by_date is EXACTLY clock + 14 days is NOT eligible (the remaining shelf must be strictly more than 14 days). Available units of exactly 6 ARE enough."

# =============================================================================
# Ordered write gates — where several preconditions guard one mutating
# endpoint, the evaluation order is declared here, not left implicit.
# =============================================================================
gate_precedence:

  post_batches:
    endpoint: "POST /batches"
    gates:
      - { order: 1,  gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2,  gate: "acting role is ProductionOperator", error_id: ERR_UNAUTHORIZED }
      - { order: 3,  gate: "recipe_id resolves", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND }
      - { order: 4,  gate: "scoby_culture_id resolves", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND }
      - { order: 5,  gate: "vessel_id resolves", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND }
      - { order: 6,  gate: "field shapes: pitched_liters strictly positive, planned_f2_days between 1 and F2_MAX_DAYS inclusive, pitched_at not after the logical clock", error_id: ERR_VALIDATION }
      - { order: 7,  gate: "scoby_culture.state == ACTIVE", error_id: ERR_INVALID_STATE }
      - { order: 8,  gate: "generation cap: generation_number below SCOBY_GENERATION_CAP, or exactly at the cap with a reverification no older than SCOBY_REVERIFICATION_VALID_DAYS", error_id: ERR_SCOBY_GENERATION_CAP }
      - { order: 9,  gate: "scoby vitality_score at or above SCOBY_VITALITY_FLOOR", error_id: ERR_SCOBY_VITALITY_TOO_LOW }
      - { order: 10, gate: "vessel.state == SANITIZED", error_id: ERR_VESSEL_UNAVAILABLE }
      - { order: 11, gate: "logical clock at or before vessel.cip_completed_at + VESSEL_CIP_VALID_HOURS", error_id: ERR_VESSEL_CIP_EXPIRED }
      - { order: 12, gate: "the half-open interval [pitched_at, occupancy_end_at) does not intersect the vessel's retained occupancy interval", error_id: ERR_VESSEL_UNAVAILABLE }
      - { order: 13, gate: "pitched_liters at or below capacity_liters * (100 - VESSEL_HEADSPACE_PCT) / 100", error_id: ERR_VESSEL_CAPACITY_EXCEEDED }

  post_packaging_run_start:
    endpoint: "POST /packaging-runs/{id}/start"
    gates:
      - { order: 1, gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2, gate: "acting role is ProductionOperator", error_id: ERR_UNAUTHORIZED }
      - { order: 3, gate: "run id resolves", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND }
      - { order: 4, gate: "run.status in {DRAFT, SOURCED}", error_id: ERR_INVALID_STATE }
      - { order: 5, gate: "source_batch_count at least 1", error_id: ERR_BLEND_RULE_VIOLATION }
      - { order: 6, gate: "every source batch has ferment_stage == READY_TO_PACKAGE", error_id: ERR_INVALID_STATE }
      - { order: 7, gate: "every source batch has qa_disposition == CONFORMING (the fan-in join)", error_id: ERR_INVALID_STATE }
      - { order: 8, gate: "label_approval.status == APPROVED; a STALE approval yields ERR_LABEL_STALE, a DRAFT or SUBMITTED one yields ERR_INVALID_STATE", error_id: ERR_LABEL_STALE }
      - { order: 9, gate: "label_approval.approved_recipe_version_number == recipe.recipe_version_number", error_id: ERR_LABEL_STALE }
      - { order: 10, gate: "label_approval.pasteurized == run.pasteurized", error_id: ERR_LABEL_CLASS_MISMATCH }

  post_packaging_run_complete:
    endpoint: "POST /packaging-runs/{id}/complete"
    gates:
      - { order: 1, gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2, gate: "acting role is ProductionOperator", error_id: ERR_UNAUTHORIZED }
      - { order: 3, gate: "run id resolves", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND }
      - { order: 4, gate: "run.status == IN_PROGRESS", error_id: ERR_INVALID_STATE }
      - { order: 5, gate: "every source batch has a PACKAGING QaReading, so packaging_abv_pct is set", error_id: ERR_VALIDATION }
      - { order: 6, gate: "measured lot ABV does not exceed max(projected_abv_pct over sources) by more than ABV_DIVERGENCE_TOLERANCE_PCT", error_id: ERR_ABV_CLASS_DIVERGENCE }
      - { order: 7, gate: "the lot's measured abv_class equals label_approval.abv_class", error_id: ERR_LABEL_CLASS_MISMATCH }

  post_finished_lot_release:
    endpoint: "POST /finished-lots/{id}/release"
    gates:
      - { order: 1, gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2, gate: "acting role is QaManager", error_id: ERR_UNAUTHORIZED }
      - { order: 3, gate: "lot id resolves", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND }
      - { order: 4, gate: "lot.status == HELD", error_id: ERR_INVALID_STATE }
      - { order: 5, gate: "logical clock at or after packaged_at + LOT_RELEASE_MIN_HOLD_HOURS", error_id: ERR_LOT_HOLD_PERIOD }
      - { order: 6, gate: "acting X-User-ID differs from packaging_run.created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES }
    note: "The segregation check depends on stored state, so it is evaluated with the business rules at the end, NOT with the role check at order 2."

  post_shipment_confirm:
    endpoint: "POST /shipments/{id}/confirm"
    gates:
      - { order: 1, gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2, gate: "acting role is SalesRep", error_id: ERR_UNAUTHORIZED }
      - { order: 3, gate: "shipment id resolves", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND }
      - { order: 4, gate: "shipment.status == DRAFT", error_id: ERR_INVALID_STATE }
      - { order: 5, gate: "at least one line has line_status ACTIVE", error_id: ERR_VALIDATION }
      - { order: 6, gate: "account.status == ACTIVE (ONBOARDING and CREDIT_HOLD both fail here)", error_id: ERR_INVALID_STATE }
      - { order: 7, gate: "every ACTIVE line whose lot abv_class is ALCOHOLIC requires account.alcoholic_license_on_file == true", error_id: ERR_ALCOHOLIC_CHANNEL_RESTRICTED }
      - { order: 8, gate: "for a SELF_DISTRIBUTION account, ytd_self_dist_liters + total_liters at or below SELF_DIST_ANNUAL_LITER_CEILING", error_id: ERR_SELF_DIST_CEILING_EXCEEDED }
      - { order: 9, gate: "credit exposure at or below account.credit_limit (calculations.account_credit_exposure)", error_id: ERR_CREDIT_LIMIT_EXCEEDED }
    note: "Compliance before fiscal: the alcoholic-channel gate and the self-distribution ceiling are both evaluated before the credit test."

  post_taproom_pour:
    endpoint: "POST /taproom-fills/{id}/pour"
    gates:
      - { order: 1, gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2, gate: "acting role is TaproomStaff", error_id: ERR_UNAUTHORIZED }
      - { order: 3, gate: "fill id resolves", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND }
      - { order: 4, gate: "fill.fill_status in {REQUESTED, INSPECTED}", error_id: ERR_INVALID_STATE }
      - { order: 5, gate: "a CUSTOMER_GROWLER fill is in fill_status INSPECTED and the logical clock is at or before inspected_at + GROWLER_INSPECTION_VALID_HOURS", error_id: ERR_GROWLER_INSPECTION_REQUIRED }
      - { order: 6, gate: "keg.status == ON_TAP", error_id: ERR_INVALID_STATE }
      - { order: 7, gate: "when the keg's lot abv_class is ALCOHOLIC, customer_birth_date is present and the customer is at or above AGE_VERIFICATION_MIN_AGE_YEARS at the logical clock", error_id: ERR_AGE_VERIFICATION_REQUIRED }
      - { order: 8, gate: "requested_liters at or below keg.remaining_liters", error_id: ERR_INSUFFICIENT_KEG_VOLUME }

  post_subscription_allocations:
    endpoint: "POST /subscription-allocations"
    gates:
      - { order: 1,  gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2,  gate: "acting role is PlatformAdmin", error_id: ERR_UNAUTHORIZED }
      - { order: 3,  gate: "subscription_id resolves", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND }
      - { order: 4,  gate: "finished_lot_id resolves when supplied", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND }
      - { order: 5,  gate: "subscription.status == ACTIVE", error_id: ERR_INVALID_STATE }
      - { order: 6,  gate: "expected_finished_lot_version equals the lot's current version", error_id: ERR_STALE_VERSION }
      - { order: 7,  gate: "lot.status == RELEASED", error_id: ERR_INVALID_STATE }
      - { order: 8,  gate: "lot.recipe_id == subscription.preferred_recipe_id", error_id: ERR_VALIDATION }
      - { order: 9,  gate: "lot.best_by_date strictly after the logical clock + MIN_REMAINING_SHELF_DAYS", error_id: ERR_SHELF_LIFE_TOO_SHORT }
      - { order: 10, gate: "when lot.abv_class is ALCOHOLIC, the subscriber is at or above AGE_VERIFICATION_MIN_AGE_YEARS at the logical clock", error_id: ERR_AGE_VERIFICATION_REQUIRED }
      - { order: 11, gate: "lot.on_hand_units - lot.reserved_units at or above SUBSCRIPTION_BOX_UNITS", error_id: ERR_INSUFFICIENT_LOT_UNITS }
    note: "OCC sits at order 6 — after existence and after the subscription's own state gate, before every lot-side business gate. The same relative placement is used by the other two concurrency rules."

  post_shipment_lines:
    endpoint: "POST /shipments/{id}/lines"
    gates:
      - { order: 1, gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2, gate: "acting role is SalesRep", error_id: ERR_UNAUTHORIZED }
      - { order: 3, gate: "shipment_id resolves", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND }
      - { order: 4, gate: "finished_lot_id resolves", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND }
      - { order: 5, gate: "shipment.status == DRAFT", error_id: ERR_INVALID_STATE }
      - { order: 6, gate: "expected_finished_lot_version equals the lot's current version", error_id: ERR_STALE_VERSION }
      - { order: 7, gate: "lot.status == RELEASED", error_id: ERR_INVALID_STATE }
      - { order: 8, gate: "units strictly positive and unit_price strictly positive", error_id: ERR_VALIDATION }
      - { order: 9, gate: "lot.on_hand_units - lot.reserved_units at or above units", error_id: ERR_INSUFFICIENT_LOT_UNITS }

  post_packaging_run_sources:
    endpoint: "POST /packaging-runs/{id}/sources"
    gates:
      - { order: 1, gate: "authentication headers present", error_id: ERR_UNAUTHENTICATED }
      - { order: 2, gate: "acting role is ProductionOperator", error_id: ERR_UNAUTHORIZED }
      - { order: 3, gate: "run id resolves", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND }
      - { order: 4, gate: "batch_id resolves", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND }
      - { order: 5, gate: "run.status in {DRAFT, SOURCED}", error_id: ERR_INVALID_STATE }
      - { order: 6, gate: "expected_batch_version equals the batch's current version", error_id: ERR_STALE_VERSION }
      - { order: 7, gate: "batch.ferment_stage == READY_TO_PACKAGE and batch.qa_disposition != NONCONFORMING", error_id: ERR_INVALID_STATE }
      - { order: 8, gate: "batch.recipe_id == run.recipe_id", error_id: ERR_VALIDATION }
      - { order: 9, gate: "source_batch_count strictly less than BLEND_MAX_SOURCE_BATCHES, and liters_drawn at or above BLEND_MIN_DRAW_LITERS", error_id: ERR_BLEND_RULE_VIOLATION }
      - { order: 10, gate: "liters_drawn at or below batch.remaining_liters", error_id: ERR_INSUFFICIENT_BATCH_VOLUME }

# =============================================================================
# Error precedence — pairs of rungs that a single request can trip together
# =============================================================================
error_precedence:
  - pair: [ERR_ABV_CLASS_DIVERGENCE, ERR_LABEL_CLASS_MISMATCH]
    wins: ERR_ABV_CLASS_DIVERGENCE
    where: "POST /packaging-runs/{id}/complete"
    why: "A measured figure that has run away from the projection is a measurement-integrity problem; the label mismatch it produces is a symptom, so the divergence rung fires first."
  - pair: [ERR_VESSEL_UNAVAILABLE, ERR_VESSEL_CIP_EXPIRED]
    wins: ERR_VESSEL_UNAVAILABLE
    where: "POST /batches"
    why: "Vessel state is a state precondition (order 10); the CIP freshness test is temporal (order 11)."
  - pair: [ERR_VESSEL_CIP_EXPIRED, ERR_VESSEL_CAPACITY_EXCEEDED]
    wins: ERR_VESSEL_CIP_EXPIRED
    where: "POST /batches"
    why: "Sanitation is a safety rung and outranks the capacity constraint."
  - pair: [ERR_SCOBY_GENERATION_CAP, ERR_SCOBY_VITALITY_TOO_LOW]
    wins: ERR_SCOBY_GENERATION_CAP
    where: "POST /batches"
    why: "Lineage depth is a hard compliance cap (order 8); vitality is a graded health rung (order 9)."
  - pair: [ERR_INVALID_STATE, ERR_CREDIT_LIMIT_EXCEEDED]
    wins: ERR_INVALID_STATE
    where: "POST /shipments/{id}/confirm"
    why: "The account's standing (order 6) is a state precondition; the credit test (order 9) is fiscal."
  - pair: [ERR_ALCOHOLIC_CHANNEL_RESTRICTED, ERR_CREDIT_LIMIT_EXCEEDED]
    wins: ERR_ALCOHOLIC_CHANNEL_RESTRICTED
    where: "POST /shipments/{id}/confirm"
    why: "Compliance before fiscal."
  - pair: [ERR_SELF_DIST_CEILING_EXCEEDED, ERR_CREDIT_LIMIT_EXCEEDED]
    wins: ERR_SELF_DIST_CEILING_EXCEEDED
    where: "POST /shipments/{id}/confirm"
    why: "The statutory self-distribution ceiling (order 8) outranks the commercial credit limit (order 9)."
  - pair: [ERR_GROWLER_INSPECTION_REQUIRED, ERR_AGE_VERIFICATION_REQUIRED]
    wins: ERR_GROWLER_INSPECTION_REQUIRED
    where: "POST /taproom-fills/{id}/pour"
    why: "The container gate (order 5) is checked before the person gate (order 7)."
  - pair: [ERR_AGE_VERIFICATION_REQUIRED, ERR_INSUFFICIENT_KEG_VOLUME]
    wins: ERR_AGE_VERIFICATION_REQUIRED
    where: "POST /taproom-fills/{id}/pour"
    why: "Age gating is regulatory; volume is inventory."
  - pair: [ERR_LOT_HOLD_PERIOD, ERR_SEGREGATION_OF_DUTIES]
    wins: ERR_LOT_HOLD_PERIOD
    where: "POST /finished-lots/{id}/release"
    why: "The hold window (order 5) is evaluated before the segregation test (order 6), even though the latter carries a 403."
  - pair: [ERR_STALE_VERSION, ERR_INSUFFICIENT_LOT_UNITS]
    wins: ERR_STALE_VERSION
    where: "POST /shipments/{id}/lines and POST /subscription-allocations"
    why: "A client holding a stale view of the lot is told so before its arithmetic is judged."
  - pair: [ERR_SHELF_LIFE_TOO_SHORT, ERR_INSUFFICIENT_LOT_UNITS]
    wins: ERR_SHELF_LIFE_TOO_SHORT
    where: "POST /subscription-allocations"
    why: "Product safety (order 9) precedes availability (order 11)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins)
# Domain ordering: auth -> existence -> request shape -> state -> optimistic
# concurrency -> compliance/safety -> temporal -> referential -> capacity
# constraint -> fiscal.
# =============================================================================
validations:

  # ---- authentication / authorization ----
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers are both present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "X-User-Role names one of the seven roles declared in §1.7", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 3, category: auth, check: "the acting role appears in the endpoint's `roles:` list", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 4, category: auth, check: "when the acting role is Subscriber, X-User-ID equals the target Subscription.id, or the subscription_id of the target SubscriptionAllocation", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "POST /subscriptions/{id}/pause, /resume, /skip, /cancel" }

  # ---- existence, resolved left to right in the path, then in body order ----
  - { priority: 5,  category: existence, check: "recipe_id resolves to a Recipe", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /recipes/{id}/revise, POST /batches, POST /label-approvals, POST /packaging-runs, POST /subscriptions, GET /recipes/{id}" }
  - { priority: 6,  category: existence, check: "scoby_culture_id or parent_culture_id resolves to a ScobyCulture", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /scoby-cultures, POST /batches, all /scoby-cultures/{id}/* actions" }
  - { priority: 7,  category: existence, check: "vessel_id resolves to a Vessel", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /batches, POST /vessels/{id}/cip-start, POST /vessels/{id}/cip-complete, GET /vessels/{id}" }
  - { priority: 8,  category: existence, check: "ingredient_lot_id resolves to an IngredientLot", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /batches/{id}/ingredient-uses, POST /ingredient-lots/{id}/quarantine, POST /ingredient-lots/{id}/clear-quarantine" }
  - { priority: 9,  category: existence, check: "batch_id resolves to a Batch", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all /batches/{id}/* actions, POST /packaging-runs/{id}/sources" }
  - { priority: 10, category: existence, check: "the BatchIngredientUse id resolves", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /batch-ingredient-uses/{id}/void" }
  - { priority: 11, category: existence, check: "label_approval_id resolves to a LabelApproval", error_id: ERR_PRODUCTION_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /packaging-runs, all /label-approvals/{id}/* actions" }
  - { priority: 12, category: existence, check: "the packaging run id resolves", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all /packaging-runs/{id}/* actions, GET /packaging-runs/{id}" }
  - { priority: 13, category: existence, check: "finished_lot_id resolves to a FinishedLot", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all /finished-lots/{id}/* actions, POST /kegs/{id}/fill, POST /shipments/{id}/lines, POST /subscription-allocations" }
  - { priority: 14, category: existence, check: "the keg id resolves", error_id: ERR_PACKAGING_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all /kegs/{id}/* actions, POST /taproom-fills" }
  - { priority: 15, category: existence, check: "account_id resolves to an Account", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /shipments, POST /kegs/{id}/issue, all /accounts/{id}/* actions" }
  - { priority: 16, category: existence, check: "the shipment id resolves", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all /shipments/{id}/* actions, GET /shipments/{id}" }
  - { priority: 17, category: existence, check: "the subscription id or subscription allocation id resolves", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all /subscriptions/{id}/* actions, POST /subscription-allocations, POST /subscription-allocations/{id}/ship" }
  - { priority: 18, category: existence, check: "the taproom fill id or recall notice id resolves", error_id: ERR_COMMERCIAL_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "POST /taproom-fills/{id}/inspect, POST /taproom-fills/{id}/pour, POST /recall-notices/{id}/acknowledge" }

  # ---- request shape ----
  - { priority: 19, category: business_constraint, check: "every field the endpoint declares as required is present and of the declared type", error_id: ERR_VALIDATION, http_status: 400, applies_to: all }
  - { priority: 20, category: business_constraint, check: "every enum-typed field carries one of the members declared in §1.1", error_id: ERR_VALIDATION, http_status: 400, applies_to: all }
  - { priority: 21, category: business_constraint, check: "pagination limit is an integer between 1 and PAGINATION_MAX_LIMIT (100) inclusive and offset is at or above 0", error_id: ERR_VALIDATION, http_status: 400, applies_to: "every GET list endpoint" }
  - { priority: 22, category: business_constraint, check: "quantities are strictly positive: pitched_liters, quantity_used, liters_drawn, units, unit_price, requested_liters, fill_liters, capacity_liters, credit_limit", error_id: ERR_VALIDATION, http_status: 400, applies_to: "every create or draw endpoint that carries the field" }
  - { priority: 23, category: business_temporal, check: "the new logical clock value is at or after the current logical clock; time never runs backwards", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /_clock/set_current_utc" }
  - { priority: 24, category: business_temporal, check: "reading_at is at or after batch.pitched_at and at or before the logical clock", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /batches/{id}/qa-readings" }
  - { priority: 25, category: business_temporal, check: "pitched_at, when supplied, is at or before the logical clock", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /batches" }
  - { priority: 26, category: business_constraint, check: "subscriber_email is unique across subscriptions whose status is ACTIVE or PAUSED", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /subscriptions" }
  - { priority: 27, category: business_constraint, check: "cycle_index is unique per subscription across allocations whose status is ALLOCATED or SHIPPED", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /subscription-allocations" }

  # ---- state preconditions ----
  - { priority: 28, category: state, check: "ScobyCulture.state == ACTIVE for a pitch, a reverification request or a retire; == REVERIFICATION_PENDING for a reverification result", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /batches, POST /scoby-cultures/{id}/reverify, /reverify-result, /retire" }
  - { priority: 29, category: state, check: "Vessel.state == SANITIZED for a pitch; in {DIRTY, SANITIZED} for cip-start; == CIP_IN_PROGRESS for cip-complete", error_id: ERR_VESSEL_UNAVAILABLE, http_status: 409, applies_to: "POST /batches, POST /vessels/{id}/cip-start, POST /vessels/{id}/cip-complete" }
  - { priority: 30, category: state, check: "Batch.ferment_stage matches the action: F1_ACTIVE for advance-to-f2, F2_ACTIVE for complete-f2, READY_TO_PACKAGE for a source draw, non-terminal for dump and for a QA reading", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all /batches/{id}/* actions, POST /packaging-runs/{id}/sources" }
  - { priority: 31, category: state, check: "Batch.qa_disposition is not NONCONFORMING for advance-to-f2, complete-f2 and source draws; is exactly AT_RISK for a qa-signoff", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /batches/{id}/advance-to-f2, /complete-f2, /qa-signoff, POST /packaging-runs/{id}/sources" }
  - { priority: 32, category: state, check: "IngredientLot.status is in {AVAILABLE, PARTIALLY_CONSUMED} for a use, in {AVAILABLE, PARTIALLY_CONSUMED, CONSUMED} for a quarantine and == QUARANTINED for a clearance", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /batches/{id}/ingredient-uses, POST /ingredient-lots/{id}/quarantine, /clear-quarantine" }
  - { priority: 33, category: state, check: "LabelApproval.status is in {DRAFT, STALE} for a submit and == SUBMITTED for an approve", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /label-approvals/{id}/submit, /approve" }
  - { priority: 34, category: state, check: "PackagingRun.status matches the action: in {DRAFT, SOURCED} for sources and for start, == IN_PROGRESS for complete, in {DRAFT, SOURCED, IN_PROGRESS} for abort", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all /packaging-runs/{id}/* actions" }
  - { priority: 35, category: state, check: "FinishedLot.status matches the action: == HELD for release, in {HELD, RELEASED} for quarantine, == QUARANTINED for clear-quarantine and for recall, == RELEASED for a keg fill, a shipment line or an allocation", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all /finished-lots/{id}/* actions, POST /kegs/{id}/fill, POST /shipments/{id}/lines, POST /subscription-allocations" }
  - { priority: 36, category: state, check: "Keg.status matches the action: in {IN_STOCK, EMPTY, RETURNED} for fill, == FILLED for tap and for issue, == ON_TAP for untap and for a taproom fill request, == ON_DEPOSIT for return", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all /kegs/{id}/* actions, POST /taproom-fills" }
  - { priority: 37, category: state, check: "Account.status == ACTIVE for a shipment confirm and for a keg issue; == ONBOARDING for an activate", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /shipments/{id}/confirm, POST /kegs/{id}/issue, POST /accounts/{id}/activate" }
  - { priority: 38, category: state, check: "Shipment.status matches the action: == DRAFT for a line add and for confirm, == CONFIRMED for deliver, == DELIVERED for a payment, in {DRAFT, CONFIRMED, RECALL_HOLD} for cancel", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all /shipments/{id}/* actions, POST /accounts/{id}/payments" }
  - { priority: 39, category: state, check: "Subscription.status == ACTIVE for pause, skip and allocation; == PAUSED for resume; in {ACTIVE, PAUSED} for cancel", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all /subscriptions/{id}/* actions, POST /subscription-allocations" }
  - { priority: 40, category: state, check: "TaproomFill.fill_status == REQUESTED for an inspect and is in {REQUESTED, INSPECTED} for a pour; SubscriptionAllocation.status == ALLOCATED for a ship", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /taproom-fills/{id}/inspect, /pour, POST /subscription-allocations/{id}/ship" }
  - { priority: 41, category: state, check: "RecallNotice.status is in {PENDING, OVERDUE} for an acknowledge", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /recall-notices/{id}/acknowledge" }

  # ---- optimistic concurrency ----
  - { priority: 42, category: state, check: "expected_batch_version equals the batch's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /packaging-runs/{id}/sources" }
  - { priority: 43, category: state, check: "expected_finished_lot_version equals the lot's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /shipments/{id}/lines, POST /subscription-allocations" }

  # ---- compliance and safety ----
  - { priority: 44, category: business_safety, check: "the culture's generation_number is strictly below SCOBY_GENERATION_CAP (7), or exactly 7 with last_reverified_at no older than SCOBY_REVERIFICATION_VALID_DAYS (30) whole days; a daughter whose generation_number would be 8 or more may not be created at all", error_id: ERR_SCOBY_GENERATION_CAP, http_status: 422, applies_to: "POST /batches, POST /scoby-cultures" }
  - { priority: 45, category: business_safety, check: "the culture's vitality_score is at or above SCOBY_VITALITY_FLOOR (40)", error_id: ERR_SCOBY_VITALITY_TOO_LOW, http_status: 422, applies_to: "POST /batches" }
  - { priority: 46, category: business_safety, check: "the ingredient lot's expiry_date is strictly after the logical clock + INGREDIENT_EXPIRY_BUFFER_DAYS (7) whole days; an expiry exactly on the buffer boundary is refused", error_id: ERR_INGREDIENT_EXPIRED, http_status: 422, applies_to: "POST /batches/{id}/ingredient-uses" }
  - { priority: 47, category: business_safety, check: "the batch reached its effective pH ceiling with a day_index inside the inclusive window F1_PH_WINDOW_MIN_DAYS..F1_PH_WINDOW_MAX_DAYS (5..14), and F2 was closed at or before f2_started_at + F2_MAX_DAYS (7) whole days", error_id: ERR_PH_WINDOW_MISSED, http_status: 422, applies_to: "POST /batches/{id}/advance-to-f2, POST /batches/{id}/complete-f2" }
  - { priority: 48, category: business_safety, check: "declared_elements is a superset of required_elements, abv_class equals recipe.intended_abv_class, and pasteurized is true whenever recipe.pasteurization_required is true", error_id: ERR_LABEL_CLASS_MISMATCH, http_status: 422, applies_to: "POST /label-approvals/{id}/submit, POST /label-approvals/{id}/approve" }
  - { priority: 49, category: business_safety, check: "the approving X-User-ID differs from submitted_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /label-approvals/{id}/approve" }
  - { priority: 50, category: business_safety, check: "the label approval is APPROVED and its approved_recipe_version_number equals the recipe's current recipe_version_number", error_id: ERR_LABEL_STALE, http_status: 409, applies_to: "POST /packaging-runs/{id}/start" }
  - { priority: 51, category: business_safety, check: "measured lot ABV does not exceed the maximum projected_abv_pct over the source batches by more than ABV_DIVERGENCE_TOLERANCE_PCT (0.05); a divergence of exactly 0.05 is accepted", error_id: ERR_ABV_CLASS_DIVERGENCE, http_status: 422, applies_to: "POST /packaging-runs/{id}/complete" }
  - { priority: 52, category: business_safety, check: "the lot's measured abv_class equals label_approval.abv_class, and label_approval.pasteurized equals run.pasteurized", error_id: ERR_LABEL_CLASS_MISMATCH, http_status: 422, applies_to: "POST /packaging-runs/{id}/start, POST /packaging-runs/{id}/complete" }
  - { priority: 53, category: business_safety, check: "the releasing X-User-ID differs from the packaging run's created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /finished-lots/{id}/release" }
  - { priority: 54, category: business_safety, check: "the signing-off X-User-ID differs from batch.last_flagged_reading_by_user_id, and qa_signoff_count is 0", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /batches/{id}/qa-signoff" }
  - { priority: 55, category: business_safety, check: "when any ACTIVE line's lot, or the keg's lot, has abv_class ALCOHOLIC, the account has alcoholic_license_on_file == true", error_id: ERR_ALCOHOLIC_CHANNEL_RESTRICTED, http_status: 422, applies_to: "POST /shipments/{id}/confirm, POST /kegs/{id}/issue" }
  - { priority: 56, category: business_safety, check: "a CUSTOMER_GROWLER fill has passed inspection and the logical clock is at or before inspected_at + GROWLER_INSPECTION_VALID_HOURS (24 h)", error_id: ERR_GROWLER_INSPECTION_REQUIRED, http_status: 422, applies_to: "POST /taproom-fills/{id}/pour" }
  - { priority: 57, category: business_safety, check: "when the poured lot's abv_class is ALCOHOLIC, customer_birth_date is present and the customer is at or above AGE_VERIFICATION_MIN_AGE_YEARS (21) at the logical clock", error_id: ERR_AGE_VERIFICATION_REQUIRED, http_status: 403, applies_to: "POST /taproom-fills/{id}/pour" }
  - { priority: 58, category: business_safety, check: "when the allocated lot's abv_class is ALCOHOLIC, the subscriber is at or above AGE_VERIFICATION_MIN_AGE_YEARS (21) at the logical clock", error_id: ERR_AGE_VERIFICATION_REQUIRED, http_status: 403, applies_to: "POST /subscription-allocations" }
  - { priority: 59, category: business_safety, check: "the lot's best_by_date is strictly after the logical clock + MIN_REMAINING_SHELF_DAYS (14) whole days", error_id: ERR_SHELF_LIFE_TOO_SHORT, http_status: 422, applies_to: "POST /subscription-allocations" }

  # ---- temporal windows ----
  - { priority: 60, category: business_temporal, check: "the logical clock is at or before vessel.cip_completed_at + VESSEL_CIP_VALID_HOURS (72 h); the exact 72-hour instant is still valid", error_id: ERR_VESSEL_CIP_EXPIRED, http_status: 422, applies_to: "POST /batches" }
  - { priority: 61, category: business_temporal, check: "the half-open interval [pitched_at, occupancy_end_at) does not intersect the vessel's retained half-open occupancy interval; a pitch starting exactly at the retained end is accepted", error_id: ERR_VESSEL_UNAVAILABLE, http_status: 409, applies_to: "POST /batches" }
  - { priority: 62, category: business_temporal, check: "the logical clock is at or after packaged_at + LOT_RELEASE_MIN_HOLD_HOURS (48 h); the exact 48-hour instant is already releasable", error_id: ERR_LOT_HOLD_PERIOD, http_status: 422, applies_to: "POST /finished-lots/{id}/release" }
  - { priority: 63, category: business_temporal, check: "when last_untapped_at is set, the logical clock is strictly after last_untapped_at + KEG_RETAP_BUFFER_MINUTES (15 min); a re-tap exactly on the buffer boundary is refused", error_id: ERR_KEG_RETAP_BUFFER, http_status: 422, applies_to: "POST /kegs/{id}/tap" }
  - { priority: 64, category: business_temporal, check: "the requested closed pause interval [start_date, end_date] spans at or below SUBSCRIPTION_PAUSE_MAX_DAYS (60) days counting both ends, and does not intersect any interval already in pause_windows; two closed intervals that merely touch at an endpoint DO intersect", error_id: ERR_PAUSE_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /subscriptions/{id}/pause" }

  # ---- referential coherence ----
  - { priority: 65, category: business_referential, check: "batch.recipe_id equals the packaging run's recipe_id", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /packaging-runs/{id}/sources" }
  - { priority: 66, category: business_referential, check: "label_approval.recipe_id equals the packaging run's recipe_id", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /packaging-runs" }
  - { priority: 67, category: business_referential, check: "the lot's recipe_id equals subscription.preferred_recipe_id", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /subscription-allocations" }
  - { priority: 68, category: business_referential, check: "the lot's format is KEG for a keg fill, and fill_liters is at or below keg.capacity_liters", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /kegs/{id}/fill" }

  # ---- capacity / constraint ----
  - { priority: 69, category: business_constraint, check: "pitched_liters is at or below capacity_liters * (100 - VESSEL_HEADSPACE_PCT) / 100; a fill of exactly 90 % of capacity is accepted", error_id: ERR_VESSEL_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /batches" }
  - { priority: 70, category: business_constraint, check: "source_batch_count is strictly below BLEND_MAX_SOURCE_BATCHES (4) before the draw, liters_drawn is at or above BLEND_MIN_DRAW_LITERS (20.0), and a run being started has at least one draw", error_id: ERR_BLEND_RULE_VIOLATION, http_status: 422, applies_to: "POST /packaging-runs/{id}/sources, POST /packaging-runs/{id}/start" }
  - { priority: 71, category: business_constraint, check: "liters_drawn is at or below batch.remaining_liters", error_id: ERR_INSUFFICIENT_BATCH_VOLUME, http_status: 422, applies_to: "POST /packaging-runs/{id}/sources" }
  - { priority: 72, category: business_constraint, check: "quantity_used is at or below the ingredient lot's quantity_available", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /batches/{id}/ingredient-uses" }
  - { priority: 73, category: business_constraint, check: "quarantine_clearance_count is strictly below LOT_QUARANTINE_CLEARANCE_CAP (1)", error_id: ERR_QUARANTINE_CLEARANCE_CAP, http_status: 422, applies_to: "POST /finished-lots/{id}/clear-quarantine" }
  - { priority: 74, category: business_constraint, check: "skips_used_this_year is strictly below SUBSCRIPTION_SKIP_CAP_PER_YEAR (3), and no allocation for the current cycle_index is ALLOCATED", error_id: ERR_SUBSCRIPTION_SKIP_CAP, http_status: 422, applies_to: "POST /subscriptions/{id}/skip" }
  - { priority: 75, category: business_constraint, check: "requested_liters is at or above POUR_MIN_LITERS (0.1) and, for either growler type, at or below GROWLER_MAX_FILL_LITERS (1.9)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /taproom-fills" }
  - { priority: 76, category: business_constraint, check: "requested_liters is at or below keg.remaining_liters; a pour of exactly the remainder is accepted", error_id: ERR_INSUFFICIENT_KEG_VOLUME, http_status: 422, applies_to: "POST /taproom-fills/{id}/pour" }
  - { priority: 77, category: business_constraint, check: "lot.on_hand_units - lot.reserved_units is at or above the units requested (SUBSCRIPTION_BOX_UNITS for an allocation)", error_id: ERR_INSUFFICIENT_LOT_UNITS, http_status: 422, applies_to: "POST /shipments/{id}/lines, POST /subscription-allocations" }

  # ---- fiscal (last) ----
  - { priority: 78, category: business_fiscal, check: "for a SELF_DISTRIBUTION account, ytd_self_dist_liters + this shipment's total_liters is at or below SELF_DIST_ANNUAL_LITER_CEILING (4000.0); exactly 4000.0 is accepted", error_id: ERR_SELF_DIST_CEILING_EXCEEDED, http_status: 422, applies_to: "POST /shipments/{id}/confirm" }
  - { priority: 79, category: business_fiscal, check: "credit exposure computed by calculations.account_credit_exposure is at or below account.credit_limit; exactly equal is accepted", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /shipments/{id}/confirm" }
  - { priority: 80, category: business_fiscal, check: "the payment amount equals the shipment's subtotal + late_fee, both rounded to 2 decimals", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /accounts/{id}/payments" }

# =============================================================================
# §1.5 API Endpoint Table
# All resource collections are top-level. Every first path parameter is
# literally `{id}`.
# =============================================================================
endpoints:

  # ------------------------------------------------------------ logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_ingredient_lot_count: integer, overdue_recall_notice_count: integer }"
    side_effects:
      - "IngredientLot.expire_on_clock fires for every lot whose expiry_date is now strictly in the past"
      - "RecallNotice.notice_overdue fires for every PENDING notice past its ack_deadline_at"
      - "days_past_due, late_fee and aging_bucket are re-derived for every DELIVERED shipment"

  # ------------------------------------------------------------ Recipe
  - method: POST
    path: "/recipes"
    description: "Create a recipe at recipe_version_number 1"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [name, style, target_ph_ceiling, planned_f1_days, planned_f2_days, base_gravity_brix, intended_abv_class, "f2_added_sugar_g_per_l?", "pasteurization_required?"]
    output: Recipe
    side_effects: ["recipe_version_number set to 1", "active_label_approval_id set to null"]

  - method: POST
    path: "/recipes/{id}/revise"
    description: "Bump the recipe revision; every approved label for the recipe goes stale"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: ["change_note?"]
    output: Recipe
    side_effects:
      - "recipe_version_number incremented by 1"
      - "cascades.recipe_revision_cascade hops 2 through 4 fire"
      - "increments Recipe.version by 1"

  - method: GET
    path: "/recipes/{id}"
    description: "Read one recipe"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Recipe
    side_effects: []

  - method: GET
    path: "/recipes/{id}/label-approvals"
    description: "Every label revision drawn against this recipe"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LabelApproval[]"
    side_effects: []

  # ------------------------------------------------------------ LabelApproval
  - method: POST
    path: "/label-approvals"
    description: "Open a label revision in DRAFT"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [recipe_id, abv_class, pasteurized, declared_elements]
    output: LabelApproval
    side_effects: ["required_elements computed by calculations.label_required_elements", "status = DRAFT"]

  - method: POST
    path: "/label-approvals/{id}/submit"
    description: "Submit a DRAFT or STALE revision for approval"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LabelApproval
    side_effects: ["status = SUBMITTED", "submitted_by_user_id = acting X-User-ID", "stale_reason = null", "increments LabelApproval.version by 1"]

  - method: POST
    path: "/label-approvals/{id}/approve"
    description: "Approve a SUBMITTED revision; the approver must not be the submitter"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LabelApproval
    side_effects:
      - "status = APPROVED; approved_at and approved_by_user_id set"
      - "approved_recipe_version_number = recipe.recipe_version_number"
      - "Recipe.active_label_approval_id updated; any other APPROVED revision of the recipe moves to STALE"
      - "increments LabelApproval.version by 1"

  # ------------------------------------------------------------ ScobyCulture
  - method: POST
    path: "/scoby-cultures"
    description: "Propagate a founder culture, or split a daughter from a mother when parent_culture_id is supplied"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [label, "parent_culture_id?"]
    output: ScobyCulture
    side_effects:
      - "generation_number derived from the parent; refused when the result would exceed SCOBY_GENERATION_CAP"
      - "vitality_score computed by calculations.scoby_vitality_score"
      - "state = ACTIVE"

  - method: POST
    path: "/scoby-cultures/{id}/reverify"
    description: "Send an ACTIVE culture for laboratory reverification"
    roles: [QaManager, PlatformAdmin]
    code: 200
    input: []
    output: ScobyCulture
    side_effects: ["state = REVERIFICATION_PENDING", "increments ScobyCulture.version by 1"]

  - method: POST
    path: "/scoby-cultures/{id}/reverify-result"
    description: "Record the laboratory outcome; PASS returns the culture to service, FAIL contaminates it"
    roles: [QaManager, PlatformAdmin]
    code: 200
    input: [outcome]
    output: ScobyCulture
    side_effects:
      - "PASS: reverification_count incremented, pitch_count reset to 0, last_reverified_at set, vitality_score recomputed (post_reverification variant)"
      - "FAIL: state = CONTAMINATED, retire_reason = CONTAMINATION, every in-flight Batch of this culture moves to qa_disposition NONCONFORMING and its in-flight packaging runs are aborted"
      - "increments ScobyCulture.version by 1"

  - method: POST
    path: "/scoby-cultures/{id}/retire"
    description: "Retire an ACTIVE culture from service"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: ["retire_reason?"]
    output: ScobyCulture
    side_effects: ["state = RETIRED", "retire_reason set to the supplied value (OPERATOR, VITALITY or GENERATION_CAP), defaulting to OPERATOR", "increments ScobyCulture.version by 1"]

  - method: GET
    path: "/scoby-cultures/{id}"
    description: "Read one culture, including its derived vitality_score"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ScobyCulture
    side_effects: []

  - method: GET
    path: "/scoby-cultures/{id}/daughters"
    description: "Cultures split directly from this mother"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: "ScobyCulture[]"
    side_effects: []

  # ------------------------------------------------------------ Vessel
  - method: POST
    path: "/vessels"
    description: "Register a fermentation vessel in state DIRTY"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [code, capacity_liters]
    output: Vessel
    side_effects: ["state = DIRTY"]

  - method: POST
    path: "/vessels/{id}/cip-start"
    description: "Begin a clean-in-place cycle"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: ["state = CIP_IN_PROGRESS", "cip_started_at set", "cip_completed_at cleared", "increments Vessel.version by 1"]

  - method: POST
    path: "/vessels/{id}/cip-complete"
    description: "Finish a clean-in-place cycle; sanitation is valid for VESSEL_CIP_VALID_HOURS from this instant"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: ["state = SANITIZED", "cip_completed_at set", "increments Vessel.version by 1"]

  - method: GET
    path: "/vessels/{id}"
    description: "Read one vessel, including its sanitation and occupancy fields"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  # ------------------------------------------------------------ IngredientLot
  - method: POST
    path: "/ingredient-lots"
    description: "Receive a raw ingredient lot"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [ingredient_type, supplier_lot_code, received_on_date, expiry_date, quantity_received]
    output: IngredientLot
    side_effects: ["status = AVAILABLE", "quantity_consumed = 0", "quantity_available = quantity_received"]

  - method: POST
    path: "/ingredient-lots/{id}/quarantine"
    description: "Quarantine a raw ingredient lot; this is the root of the seven-hop recall cascade"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: IngredientLot
    side_effects:
      - "status = QUARANTINED; pre_quarantine_status recorded"
      - "cascades.ingredient_recall_cascade hops 2 through 7 fire"
      - "increments IngredientLot.version by 1"

  - method: POST
    path: "/ingredient-lots/{id}/clear-quarantine"
    description: "Release a raw ingredient lot back to its pre-quarantine status"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: IngredientLot
    side_effects: ["status restored from pre_quarantine_status", "quarantine_cleared_count incremented", "increments IngredientLot.version by 1"]

  - method: GET
    path: "/ingredient-lots/{id}"
    description: "Read one raw ingredient lot"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: IngredientLot
    side_effects: []

  - method: GET
    path: "/ingredient-lots/{id}/uses"
    description: "Every batch use drawn from this ingredient lot, voided rows included"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["voided?", "limit?", "offset?"]
    output: "BatchIngredientUse[]"
    side_effects: []

  # ------------------------------------------------------------ Batch
  - method: POST
    path: "/batches"
    description: "Pitch a batch: occupies a sanitised vessel and consumes one pitch from the culture"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [batch_code, recipe_id, scoby_culture_id, vessel_id, pitched_liters, planned_f2_days, "f2_added_sugar_g_per_l?", "pitched_at?"]
    output: Batch
    side_effects:
      - "ferment_stage = F1_ACTIVE; qa_disposition = PENDING"
      - "occupancy_end_at derived; Vessel.occupy_on_pitch fires; ScobyCulture.pitch_self_loop fires"
      - "increments Vessel.version by 1 and ScobyCulture.version by 1"

  - method: POST
    path: "/batches/{id}/advance-to-f2"
    description: "Close primary fermentation and start secondary; computes the projected ABV"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "ferment_stage = F2_ACTIVE; f1_completed_at and f2_started_at set"
      - "f1_measured_abv_pct, projected_abv_pct and projected_abv_class computed by calculations.batch_abv_estimate"
      - "increments Batch.version by 1"

  - method: POST
    path: "/batches/{id}/complete-f2"
    description: "Close secondary fermentation, free the vessel, and make the batch drawable"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "ferment_stage = READY_TO_PACKAGE; f2_completed_at set"
      - "Vessel.free_on_transfer fires (state DIRTY, current_batch_id cleared, occupancy interval retained)"
      - "increments Batch.version by 1 and Vessel.version by 1"

  - method: POST
    path: "/batches/{id}/dump"
    description: "Write off a batch"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: Batch
    side_effects:
      - "ferment_stage = DUMPED; loss_liters increased by remaining_liters; remaining_liters = 0"
      - "Vessel.free_on_dump fires when the vessel still points at this batch"
      - "increments Batch.version by 1"

  - method: POST
    path: "/batches/{id}/qa-signoff"
    description: "Corrective QA sign-off returning an AT_RISK batch to CONFORMING; the signer must not be the operator who recorded the last flagged reading"
    roles: [QaManager, PlatformAdmin]
    code: 200
    input: ["note?"]
    output: Batch
    side_effects:
      - "qa_disposition = CONFORMING; qa_signoff_count = 1"
      - "flagged_reading_count is deliberately NOT decremented"
      - "increments Batch.version by 1"

  - method: POST
    path: "/batches/{id}/qa-readings"
    description: "Append a pH / temperature / Brix / ABV reading to the batch QA log"
    roles: [ProductionOperator, QaManager, PlatformAdmin]
    code: 201
    input: [reading_type, reading_at, ph, temperature_c, brix, abv_pct]
    output: QaReading
    side_effects:
      - "flagged and flag_reasons computed by calculations.qa_reading_evaluation; day_index derived"
      - "batch.flagged_reading_count, batch.temp_excursion_count and batch.ph_target_hit_day_index updated"
      - "the batch's qa_disposition axis advances per Batch.qa_pending_to_conforming / qa_to_at_risk / qa_hard_fail"
      - "increments Batch.version by 1"

  - method: POST
    path: "/batches/{id}/ingredient-uses"
    description: "Record consumption of a raw ingredient lot by this batch"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [ingredient_lot_id, quantity_used]
    output: BatchIngredientUse
    side_effects:
      - "ingredient lot quantity_consumed and quantity_available updated; status advances to PARTIALLY_CONSUMED or CONSUMED"
      - "increments IngredientLot.version by 1"

  - method: GET
    path: "/batches/{id}"
    description: "Read one batch, including both state axes and the projected ABV"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Batch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "List batches with filters"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["recipe_id?", "scoby_culture_id?", "vessel_id?", "ferment_stage?", "qa_disposition?", "limit?", "offset?"]
    output: "Batch[]"
    side_effects: []

  - method: GET
    path: "/batches/{id}/qa-readings"
    description: "The batch QA log ordered by reading_at ASC, tie-break created_at ASC"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["reading_type?", "limit?", "offset?"]
    output: "QaReading[]"
    side_effects: []

  - method: GET
    path: "/batches/{id}/ingredient-uses"
    description: "Ingredient consumption records for this batch"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["voided?", "limit?", "offset?"]
    output: "BatchIngredientUse[]"
    side_effects: []

  - method: POST
    path: "/batch-ingredient-uses/{id}/void"
    description: "Void a consumption record and return the quantity to the ingredient lot"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: BatchIngredientUse
    side_effects:
      - "voided = true; voided_at set"
      - "ingredient lot quantity_consumed decreased and quantity_available increased, restoring conservation_invariants.ingredient_quantity_conservation"
      - "the batch is no longer reachable from this ingredient lot by the recall cascade"
      - "increments IngredientLot.version by 1"

  # ------------------------------------------------------------ PackagingRun
  - method: POST
    path: "/packaging-runs"
    description: "Open a packaging run in DRAFT against a recipe and a label revision"
    roles: [ProductionOperator, PlatformAdmin]
    code: 201
    input: [run_code, recipe_id, label_approval_id, format, pasteurized, max_units_requested]
    output: PackagingRun
    side_effects: ["status = DRAFT; created_by_user_id = acting X-User-ID; source_draws = []"]

  - method: POST
    path: "/packaging-runs/{id}/sources"
    description: "Draw liters from one READY_TO_PACKAGE batch into this run; OCC-guarded on the batch"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: [batch_id, liters_drawn, expected_batch_version]
    output: PackagingRun
    side_effects:
      - "appends { batch_id, liters_drawn, drawn_at } to source_draws; source_batch_count and gross_liters recomputed"
      - "batch.drawn_liters increased and batch.remaining_liters decreased by liters_drawn"
      - "increments Batch.version by 1"
      - "increments PackagingRun.version by 1"
      - "status moves DRAFT -> SOURCED on the first draw"

  - method: POST
    path: "/packaging-runs/{id}/start"
    description: "Fan-in join: begin the fill once every source batch is READY_TO_PACKAGE and CONFORMING and the label is current"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: PackagingRun
    side_effects:
      - "status = IN_PROGRESS; started_by_user_id set"
      - "net_liters and units_produced computed by calculations.packaging_yield"
      - "increments PackagingRun.version by 1"

  - method: POST
    path: "/packaging-runs/{id}/complete"
    description: "Close the fill and emit the FinishedLot with its inherited blend attributes"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: []
    output: PackagingRun
    side_effects:
      - "status = COMPLETED; a FinishedLot in status HELD is created and mirrored on finished_lot_id"
      - "lot measured_abv_pct, abv_class, best_by_date and lot_code computed by calculations.blended_lot_inheritance and calculations.lot_best_by_date"
      - "each source batch with remaining_liters 0 moves to ferment_stage PACKAGED"
      - "increments PackagingRun.version by 1"

  - method: POST
    path: "/packaging-runs/{id}/abort"
    description: "Abandon the run and return every drawn liter to its source batch"
    roles: [ProductionOperator, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: PackagingRun
    side_effects:
      - "status = ABORTED"
      - "for every source draw, batch.drawn_liters decreased and batch.remaining_liters increased, restoring conservation_invariants.batch_volume_conservation"
      - "increments Batch.version by 1 for each source batch"
      - "increments PackagingRun.version by 1"

  - method: GET
    path: "/packaging-runs/{id}"
    description: "Read one packaging run, including its source draws and yield"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PackagingRun
    side_effects: []

  - method: GET
    path: "/packaging-runs"
    description: "List packaging runs with filters, including a reverse trace by source batch"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["recipe_id?", "label_approval_id?", "status?", "source_batch_id?", "limit?", "offset?"]
    output: "PackagingRun[]"
    side_effects: []

  # ------------------------------------------------------------ FinishedLot
  - method: POST
    path: "/finished-lots/{id}/release"
    description: "Release a HELD lot to finished goods after the minimum hold; the releaser must not be the run's creator"
    roles: [QaManager, PlatformAdmin]
    code: 200
    input: []
    output: FinishedLot
    side_effects: ["status = RELEASED; released_at and released_by_user_id set", "increments FinishedLot.version by 1"]

  - method: POST
    path: "/finished-lots/{id}/quarantine"
    description: "Quarantine a finished lot and unwind its downstream commitments"
    roles: [ComplianceOfficer, QaManager, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: FinishedLot
    side_effects:
      - "status = QUARANTINED; pre_quarantine_status recorded"
      - "cascades.ingredient_recall_cascade hops 5 through 7 fire from this lot"
      - "increments FinishedLot.version by 1"

  - method: POST
    path: "/finished-lots/{id}/clear-quarantine"
    description: "Clear a lot out of quarantine, at most LOT_QUARANTINE_CLEARANCE_CAP times, re-instating eligible subscription allocations"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FinishedLot
    side_effects:
      - "status restored from pre_quarantine_status; quarantine_clearance_count incremented"
      - "cascades.lot_release_reallocation_cascade hops 2 and 3 fire"
      - "increments FinishedLot.version by 1"

  - method: POST
    path: "/finished-lots/{id}/recall"
    description: "Recall a QUARANTINED lot; on-hand units are destroyed and remaining allocations reversed"
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["reason?"]
    output: FinishedLot
    side_effects:
      - "status = RECALLED; destroyed_units increased by on_hand_units; on_hand_units and reserved_units set to 0"
      - "remaining ALLOCATED subscription allocations move to REVERSED with reversal_reason LOT_RECALLED"
      - "a RecallNotice with trigger_source LOT_RECALL is issued to every exposed account without one"
      - "increments FinishedLot.version by 1"

  - method: GET
    path: "/finished-lots/{id}"
    description: "Read one finished lot, including its four unit buckets and reserved_units"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, SalesRep, TaproomStaff, PlatformAdmin]
    code: 200
    input: []
    output: FinishedLot
    side_effects: []

  - method: GET
    path: "/finished-lots"
    description: "List finished lots with filters; the operator view of the FEFO release order"
    roles: [ProductionOperator, QaManager, ComplianceOfficer, SalesRep, TaproomStaff, PlatformAdmin]
    code: 200
    input: ["packaging_run_id?", "recipe_id?", "status?", "limit?", "offset?"]
    output: "FinishedLot[]"
    side_effects: []

  - method: GET
    path: "/finished-lots/{id}/shipment-lines"
    description: "Every shipment line drawing on this lot"
    roles: [SalesRep, ComplianceOfficer, QaManager, PlatformAdmin]
    code: 200
    input: ["line_status?", "limit?", "offset?"]
    output: "ShipmentLine[]"
    side_effects: []

  - method: GET
    path: "/finished-lots/{id}/allocations"
