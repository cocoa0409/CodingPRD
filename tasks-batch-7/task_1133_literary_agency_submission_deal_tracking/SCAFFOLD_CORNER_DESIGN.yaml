            - { call: "POST /deals/${d1}/execute", payload: { expected_deal_version: "${dv1}" }, as: ContractsManager, as_user_id: "cm-1" }
          trigger:
            - { call: "POST /royalty-statements", payload: { deal_id: "${d1}", period_index: 0, units_hardcover: 6000, units_trade: 8000, units_ebook: 10000, net_receipts_hardcover_cents: 6000000, net_receipts_trade_cents: 3200000, net_receipts_ebook_cents: 1000000, publisher_reported_royalty_cents: 1120500 }, as: RoyaltiesAccountant, as_user_id: "ra-1", captures: { rs1: $.data.id } }
