# =============================================================================
# SCAFFOLD — task_1376_building_envelope_consulting_testing
# Building Envelope Consulting & Testing
# =============================================================================

scenario: |
  Building Envelope Consulting & Testing (building enclosure consultant): design review of details (air/water/thermal barrier), mock-up construction & performance testing, field water/air infiltration testing & failure diagnosis, thermal imaging & moisture survey, remediation recommendation & specification, warranty review & manufacturer coordination, litigation/forensic support, ongoing maintenance plan

domain_name: building-envelope-consulting
api_prefix: /

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating
  # Engagement.posture (OPEN / RESTRICTED / FROZEN) is a derived aggregate of
  # children state (open failure anomalies, active litigation hold, risk_score
  # band) and gates test scheduling, remediation issuance, and invoicing.
  secondary_archetype: compliance_audit
  # Segregation-of-duties between test performer and certifier; mandatory
  # review order; cooling-off windows; litigation hold seals.
  complexity_layers:
    - optimistic_concurrency        # OCC on Engagement.version for remediation-plan supersede
    - dual_variant_calculation      # provisional vs final accrual; estimated vs actual remediation cost
    - cascading_side_effects        # test failure -> anomaly -> posture -> gating -> ledger
    - rate_threshold_triggers       # risk-score bands, airtightness thresholds, fee tiers
  entity_topology: hybrid
  # Tree: Engagement -> Assembly/Invoice/ChamberSlot/...; cross-aggregate FKs:
  # FieldTest -> Assembly, Anomaly -> FieldTest or Survey (two FKs, exactly one set).
  state_machine_shape: compound
  # Engagement posture is compound (f of children). DesignReview is cyclic
  # (revision loop), FieldTest carries parallel dimensions
  # (execution_status x diagnosis_status), MockUp loops REMEDIATED->TESTING,
  # WarrantyClaim branches with an escalation cycle.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic        # Anomaly has exactly one of field_test_id / survey_id set
  role_model: segregation_of_duties
  # The Consultant who performs a FieldTest cannot certify it; the Reviewer who
  # issues design comments cannot approve the same review round.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Engagement name" }
      - { name: client_name, type: string, source: input, description: "Client organization name" }
      - { name: fee_cap_cents, type: integer, source: input, description: "Hard cap on recognized (accrued + invoiced) fees; >= 1", constraints: "integer >= 1" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, description: "Standard labor rate used by accrual calculations", constraints: "integer >= 1" }
      - { name: recognized_fees_cents, type: integer, source: computed, default: 0, description: "Read-only cumulative recognized fees (provisional accrual basis); see calculation engagement_fee_accrual" }
      - { name: invoiced_cents, type: integer, source: computed, default: 0, description: "Read-only sum of Invoice.total_cents over Invoices with status IN {ISSUED, PAID}" }
      - { name: fee_headroom_cents, type: integer, source: computed, description: "Read-only = fee_cap_cents - recognized_fees_cents; may go negative only via final accrual at CLOSE_OUT" }
      - { name: risk_score, type: integer, source: computed, default: 100, description: "Read-only engagement risk score; starts at 100; lower is worse; floor 0, ceiling 100; see calculation risk_score_update" }
      - { name: posture, type: enum, source: computed, description: "Derived gating posture: OPEN | RESTRICTED | FROZEN; see calculation posture_derivation", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: status, type: enum, source: system, description: "Lifecycle: SETUP -> IN_PROGRESS -> CLOSE_OUT -> CLOSED", constraints: "SETUP | IN_PROGRESS | CLOSE_OUT | CLOSED" }
      - { name: litigation_hold_active, type: boolean, source: system, default: false, description: "True while a LitigationHold with status ACTIVE exists for this engagement" }

  - name: Assembly
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: tag, type: string, source: input, description: "Assembly tag, e.g. 'W1-NORTH'; unique per engagement", constraints: "unique within engagement_id (case-sensitive)" }
      - { name: assembly_type, type: enum, source: input, description: "Curtain-wall, window-wall, masonry, roofing, etc.", constraints: "CURTAIN_WALL | WINDOW_WALL | MASONRY | ROOFING | PLAZA_DECK" }
      - { name: design_u_factor, type: number, source: input, description: "Design thermal transmittance W/m2K", constraints: "0 < design_u_factor <= 6.0" }
      - { name: required_airtightness_lps_m2, type: number, source: input, description: "Spec air leakage limit at 75 Pa, in L/(s*m2)", constraints: "0 < required_airtightness_lps_m2 <= 3.0" }
      - { name: review_status, type: enum, source: computed, default: NONE, description: "Derived from latest DesignReview round of this assembly: NONE | IN_REVIEW | APPROVED | REJECTED", constraints: "NONE | IN_REVIEW | APPROVED | REJECTED" }

  - name: DesignReview
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: assembly_id, type: string, source: input, description: "FK -> Assembly.id; assembly under review" }
      - { name: barrier_scope, type: array, source: input, description: "Non-empty subset of barrier layers reviewed", constraints: "non-empty array of enum AIR | WATER | THERMAL; no duplicates" }
      - { name: drawing_count, type: integer, source: input, description: "Number of detail sheets under review", constraints: "integer >= 1" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "0 while SUBMITTED first time; increments on each COMMENTS_ISSUED -> REVISED resubmission" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the Reviewer who issued comments on the current round; null before first COMMENTS_ISSUED" }
      - { name: review_fee_cents, type: integer, source: computed, description: "Fee accrued on APPROVED or REJECTED terminalization; see calculation design_review_fee" }
      - { name: status, type: enum, source: system, description: "Cyclic review loop with terminal branches", constraints: "SUBMITTED | UNDER_REVIEW | COMMENTS_ISSUED | REVISED | APPROVED | REJECTED" }

  - name: ChamberSlot
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: chamber_code, type: string, source: input, description: "Lab chamber identifier, e.g. 'CHAMBER-A'" }
      - { name: start_date, type: string, source: input, description: "First occupied day, ISO date (YYYY-MM-DD)" }
      - { name: end_date, type: string, source: input, description: "Exclusive end day (half-open interval [start_date, end_date))", constraints: "end_date > start_date (strictly later day)" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Lab day rate for this booking", constraints: "integer >= 1" }
      - { name: status, type: enum, source: system, description: "RESERVED -> CONSUMED | RELEASED", constraints: "RESERVED | CONSUMED | RELEASED" }

  - name: MockUp
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: assembly_id, type: string, source: input, description: "FK -> Assembly.id; assembly the mock-up represents" }
      - { name: chamber_slot_id, type: string, source: system, description: "FK -> ChamberSlot.id; lab window currently bound for the next testing entry; set at creation and re-pointed by begin-testing from REMEDIATED (payload new_chamber_slot_id)" }
      - { name: specimen_count, type: integer, source: input, description: "Number of test specimens in the mock-up", constraints: "integer >= 1" }
      - { name: air_leakage_lps_m2, type: number, source: system, description: "Measured air leakage recorded at PASS/FAIL determination; null until TESTING -> PASSED/FAILED" }
      - { name: testing_fee_cents, type: integer, source: computed, description: "Lab fee computed at PASSED/FAILED transition; see calculation mockup_testing_fee" }
      - { name: attempt_number, type: integer, source: system, default: 1, description: "1 on creation; increments on each REMEDIATED -> TESTING re-entry" }
      - { name: status, type: enum, source: system, description: "PLANNED -> CONSTRUCTING -> READY_FOR_TEST -> TESTING -> PASSED | FAILED; FAILED -> REMEDIATED -> TESTING (cycle)", constraints: "PLANNED | CONSTRUCTING | READY_FOR_TEST | TESTING | PASSED | FAILED | REMEDIATED" }

  - name: FieldTest
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: assembly_id, type: string, source: input, description: "FK -> Assembly.id; assembly tested in the field" }
      - { name: test_method, type: enum, source: input, description: "Field test standard", constraints: "ASTM_E1105 | ASTM_E783 | AAMA_502" }
      - { name: test_date, type: string, source: input, description: "Planned test date, ISO date (YYYY-MM-DD)" }
      - { name: test_pressure_pa, type: integer, source: input, description: "Chamber test pressure differential", constraints: "integer >= 50 and <= 1000" }
      - { name: measured_leakage_lps_m2, type: number, source: system, description: "Recorded measured leakage; null until RESULT_RECORDED" }
      - { name: performed_by, type: string, source: system, description: "X-User-ID of the FieldTechnician who recorded the result" }
      - { name: certified_by, type: string, source: system, description: "X-User-ID of the Principal who certified the result; null until certification" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL; computed by field_test_result_calc at result recording", constraints: "PASS | FAIL" }
      - { name: execution_status, type: enum, source: system, description: "Parallel dimension 1: SCHEDULED -> IN_PROGRESS -> RESULT_RECORDED -> CERTIFIED", constraints: "SCHEDULED | IN_PROGRESS | RESULT_RECORDED | CERTIFIED" }
      - { name: diagnosis_status, type: enum, source: system, description: "Parallel dimension 2: NOT_REQUIRED -> UNDIAGNOSED -> DIAGNOSING -> DIAGNOSED; only engaged when result == FAIL", constraints: "NOT_REQUIRED | UNDIAGNOSED | DIAGNOSING | DIAGNOSED" }

  - name: Survey
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: assembly_id, type: string, source: input, description: "FK -> Assembly.id; surveyed assembly" }
      - { name: survey_type, type: enum, source: input, description: "THERMAL_IMAGING | MOISTURE | COMBINED", constraints: "THERMAL_IMAGING | MOISTURE | COMBINED" }
      - { name: survey_date, type: string, source: input, description: "Planned survey date, ISO date (YYYY-MM-DD)" }
      - { name: ambient_delta_t_c, type: number, source: input, description: "Inside-outside temperature differential at scan time, deg C; imaging validity requires >= 3.0 for THERMAL_IMAGING and COMBINED" }
      - { name: anomaly_count, type: integer, source: computed, default: 0, description: "Read-only count of Anomaly rows with survey_id == this Survey and status != DISMISSED" }
      - { name: status, type: enum, source: system, description: "PLANNED -> COMPLETED -> ANALYZED | VOID", constraints: "PLANNED | COMPLETED | ANALYZED | VOID" }

  - name: Anomaly
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: field_test_id, type: string, source: input, description: "FK -> FieldTest.id; exactly one of field_test_id / survey_id is set; the other must be null", constraints: "XOR with survey_id" }
      - { name: survey_id, type: string, source: input, description: "FK -> Survey.id; exactly one of field_test_id / survey_id is set; the other must be null", constraints: "XOR with field_test_id" }
      - { name: anomaly_type, type: enum, source: input, description: "WATER_INGRESS | AIR_LEAKAGE | THERMAL_BRIDGE | MOISTURE_TRAP", constraints: "WATER_INGRESS | AIR_LEAKAGE | THERMAL_BRIDGE | MOISTURE_TRAP" }
      - { name: severity, type: enum, source: input, description: "Consultant-assigned severity", constraints: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text finding description" }
      - { name: status, type: enum, source: system, description: "OPEN -> VERIFIED -> DISMISSED | REMEDIATED", constraints: "OPEN | VERIFIED | DISMISSED | REMEDIATED" }

  - name: RemediationPlan
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: anomaly_ids, type: array, source: input, description: "Non-empty array of FK -> Anomaly.id this plan addresses; every listed anomaly must have status VERIFIED at issuance", constraints: "non-empty array" }
      - { name: spec_sections, type: array, source: input, description: "Non-empty array of specification section strings", constraints: "non-empty array of strings" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional estimate at ISSUED; see calculation remediation_cost_estimate (ESTIMATE variant)" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Final cost at COMPLETED; see calculation remediation_cost_estimate (ACTUAL variant)" }
      - { name: plan_status, type: enum, source: system, description: "DRAFT -> ISSUED -> SUPERSEDED | COMPLETED; DRAFT -> WITHDRAWN", constraints: "DRAFT | ISSUED | SUPERSEDED | COMPLETED | WITHDRAWN" }
      - { name: supersedes_plan_id, type: string, source: input, description: "FK -> RemediationPlan.id; when set and that plan is ISSUED, creating this plan flips it to SUPERSEDED; null otherwise", constraints: "nullable; must reference a plan of the same engagement" }

  - name: WarrantyClaim
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: anomaly_id, type: string, source: input, description: "FK -> Anomaly.id; anomaly the claim pursues; anomaly must be VERIFIED" }
      - { name: manufacturer_name, type: string, source: input, description: "Manufacturer the claim is filed against" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount sought from manufacturer", constraints: "integer >= 1" }
      - { name: recovered_amount_cents, type: integer, source: computed, description: "Computed at RESOLVED per calculation warranty_recovery_share; 0 while pending" }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp the claim entered FILED (system clock)" }
      - { name: response_due_at, type: datetime, source: computed, description: "filed_at + MANUFACTURER_RESPONSE_DAYS (30 days); escalation eligibility boundary" }
      - { name: claim_status, type: enum, source: system, description: "FILED -> UNDER_MANUFACTURER_REVIEW -> ACCEPTED | DENIED; DENIED -> ESCALATED -> ACCEPTED | DENIED; ACCEPTED -> RESOLVED", constraints: "FILED | UNDER_MANUFACTURER_REVIEW | ACCEPTED | DENIED | ESCALATED | RESOLVED" }

  - name: LitigationHold
    parent: Engagement
    common_fields: false
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; engagement under forensic hold" }
      - { name: matter_reference, type: string, source: input, description: "Legal matter reference string" }
      - { name: hold_status, type: enum, source: system, description: "ACTIVE -> RELEASED (immutable audit record afterwards)", constraints: "ACTIVE | RELEASED" }

  - name: MaintenanceVisit
    parent: Engagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; owning engagement" }
      - { name: visit_label, type: string, source: input, description: "Human label, e.g. 'SPRING-2027'" }
      - { name: window_start_date, type: string, source: input, description: "First allowed day (closed interval start), ISO date" }
      - { name: window_end_date, type: string, source: input, description: "Last allowed day (closed interval end, inclusive)", constraints: "window_end_date >= window_start_date" }
      - { name: buffer_days, type: integer, source: input, default: 0, description: "Required clear days between this visit's window and any other SCHEDULED visit's window on the same engagement", constraints: "integer >= 0" }
      - { name: visit_status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | CANCELLED", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: Invoice
    parent: Engagement
    common_fields: false
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; billed engagement" }
      - { name: labor_hours, type: number, source: input, description: "Labor hours billed", constraints: ">= 0" }
      - { name: expense_cents, type: integer, source: input, description: "Pass-through expenses", constraints: "integer >= 0" }
      - { name: discount_pct, type: number, source: input, default: 0, description: "Percentage discount applied per invoice_total_calc", constraints: "0 <= discount_pct <= 100" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Computed: labor_hours * engagement.labor_rate_cents_per_hour + expense_cents (pre-discount)" }
      - { name: total_cents, type: integer, source: computed, description: "Computed per invoice_total_calc; rounding order pinned there" }
      - { name: invoice_status, type: enum, source: system, description: "DRAFT -> ISSUED -> PAID; DRAFT -> VOID", constraints: "DRAFT | ISSUED | PAID | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: IN_PROGRESS
        trigger: POST /engagements/{id}/activate
        actor: Principal
        preconditions:
          - "engagement.status == SETUP (ERR_ENGAGEMENT_NOT_IN_SETUP)"
        side_effects:
          - "status -> IN_PROGRESS"
          - "recompute posture (posture_derivation)"
          - "increments Engagement.version by 1"
      - from: IN_PROGRESS
        to: CLOSE_OUT
        trigger: POST /engagements/{id}/begin-close-out
        actor: Principal
        preconditions:
          - "engagement.status == IN_PROGRESS (ERR_ENGAGEMENT_NOT_IN_PROGRESS)"
          - "no Anomaly with status IN {OPEN, VERIFIED} exists for this engagement (ERR_OPEN_ANOMALIES_REMAIN)"
          - "no FieldTest with execution_status != CERTIFIED exists (ERR_UNCERTIFIED_TESTS_REMAIN)"
          - "no DesignReview with status IN {SUBMITTED, UNDER_REVIEW, COMMENTS_ISSUED, REVISED} exists (ERR_OPEN_REVIEWS_REMAIN)"
        side_effects:
          - "status -> CLOSE_OUT"
          - "run engagement_fee_accrual FINAL variant: recognized_fees_cents is recomputed chronologically (see calculation engagement_fee_accrual)"
          - "increments Engagement.version by 1"
      - from: CLOSE_OUT
        to: CLOSED
        trigger: POST /engagements/{id}/close
        actor: Principal
        preconditions:
          - "engagement.status == CLOSE_OUT (ERR_ENGAGEMENT_NOT_CLOSING_OUT)"
          - "every Invoice for this engagement has invoice_status IN {PAID, VOID} (ERR_UNPAID_INVOICES_REMAIN)"
          - "every WarrantyClaim has claim_status == RESOLVED (ERR_UNRESOLVED_CLAIMS_REMAIN)"
        side_effects:
          - "status -> CLOSED"
          - "increments Engagement.version by 1"

  - entity: DesignReview
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /engagements/{id}/design-reviews/{reviewId}/start-review
        actor: Reviewer
        preconditions:
          - "review.status == SUBMITTED (ERR_REVIEW_NOT_ACTIONABLE)"
          - "engagement.status == IN_PROGRESS (ERR_ENGAGEMENT_NOT_IN_PROGRESS)"
          - "engagement.posture != FROZEN (ERR_ENGAGEMENT_FROZEN)"
        side_effects:
          - "status -> UNDER_REVIEW"
          - "Assembly.review_status -> IN_REVIEW"
      - from: UNDER_REVIEW
        to: COMMENTS_ISSUED
        trigger: POST /engagements/{id}/design-reviews/{reviewId}/issue-comments
        actor: Reviewer
        preconditions:
          - "review.status == UNDER_REVIEW (ERR_REVIEW_NOT_ACTIONABLE)"
        side_effects:
          - "status -> COMMENTS_ISSUED"
          - "reviewer_id := X-User-ID of the issuing Reviewer"
      - from: COMMENTS_ISSUED
        to: REVISED
        trigger: POST /engagements/{id}/design-reviews/{reviewId}/submit-revision
        actor: Consultant
        preconditions:
          - "review.status == COMMENTS_ISSUED (ERR_REVIEW_NOT_ACTIONABLE)"
        side_effects:
          - "status -> REVISED"
          - "revision_round += 1"
      - from: REVISED
        to: UNDER_REVIEW
        trigger: POST /engagements/{id}/design-reviews/{reviewId}/start-review
        actor: Reviewer
        preconditions:
          - "review.status == REVISED (ERR_REVIEW_NOT_ACTIONABLE)"
        side_effects:
          - "status -> UNDER_REVIEW (cycle; reviewer_id from the prior round is retained for segregation-of-duties checks)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /engagements/{id}/design-reviews/{reviewId}/approve
        actor: Reviewer
        preconditions:
          - "review.status == UNDER_REVIEW (ERR_REVIEW_NOT_ACTIONABLE)"
          - "segregation of duties: if revision_round >= 1 then X-User-ID != review.reviewer_id (the Reviewer who issued the comments of the current round may not approve that same round) (ERR_DUTY_SEGREGATION_VIOLATION)"
          - "engagement.posture == OPEN (ERR_POSTURE_NOT_OPEN)"
        side_effects:
          - "status -> APPROVED"
          - "Assembly.review_status -> APPROVED"
          - "run design_review_fee: review_fee_cents computed; Engagement.recognized_fees_cents += review_fee_cents (PROVISIONAL accrual)"
          - "run posture_derivation (recognized fees may cross a risk band via fee_headroom)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /engagements/{id}/design-reviews/{reviewId}/reject
        actor: Reviewer
        preconditions:
          - "review.status == UNDER_REVIEW (ERR_REVIEW_NOT_ACTIONABLE)"
        side_effects:
          - "status -> REJECTED"
          - "Assembly.review_status -> REJECTED"
          - "run design_review_fee (REJECTED rounds still bill, at the same formula); Engagement.recognized_fees_cents += review_fee_cents"
          - "run posture_derivation"

  - entity: MockUp
    initial_state: PLANNED
    terminal_states: [PASSED]
    transitions:
      - from: PLANNED
        to: CONSTRUCTING
        trigger: POST /engagements/{id}/mock-ups/{mockUpId}/begin-construction
        actor: Consultant
        preconditions:
          - "mock_up.status == PLANNED (ERR_MOCKUP_NOT_ACTIONABLE)"
          - "engagement.posture != FROZEN (ERR_ENGAGEMENT_FROZEN)"
        side_effects:
          - "status -> CONSTRUCTING"
      - from: CONSTRUCTING
        to: READY_FOR_TEST
        trigger: POST /engagements/{id}/mock-ups/{mockUpId}/declare-ready
        actor: Consultant
        preconditions:
          - "mock_up.status == CONSTRUCTING (ERR_MOCKUP_NOT_ACTIONABLE)"
        side_effects:
          - "status -> READY_FOR_TEST"
      - from: READY_FOR_TEST
        to: TESTING
        trigger: POST /engagements/{id}/mock-ups/{mockUpId}/begin-testing
        actor: Consultant
        preconditions:
          - "mock_up.status == READY_FOR_TEST (ERR_MOCKUP_NOT_ACTIONABLE)"
          - "referenced ChamberSlot.status == RESERVED (ERR_SLOT_NOT_RESERVED)"
          - "logical clock date is within the slot's half-open window [start_date, end_date) (ERR_OUTSIDE_SLOT_WINDOW)"
        side_effects:
          - "status -> TESTING"
          - "ChamberSlot.status -> CONSUMED"
      - from: TESTING
        to: PASSED
        trigger: POST /engagements/{id}/mock-ups/{mockUpId}/record-result
        actor: Consultant
        preconditions:
          - "mock_up.status == TESTING (ERR_MOCKUP_NOT_ACTIONABLE)"
          - "server-derived branch: measured_leakage_lps_m2 <= Assembly.required_airtightness_lps_m2 (boundary: equality PASSES)"
        side_effects:
          - "status -> PASSED"
          - "air_leakage_lps_m2 := payload measured_leakage_lps_m2"
          - "run mockup_testing_fee (per-day rounding pinned); Engagement.recognized_fees_cents += testing_fee_cents"
          - "run posture_derivation"
      - from: TESTING
        to: FAILED
        trigger: POST /engagements/{id}/mock-ups/{mockUpId}/record-result
        actor: Consultant
        preconditions:
          - "mock_up.status == TESTING (ERR_MOCKUP_NOT_ACTIONABLE)"
          - "server-derived branch: measured_leakage_lps_m2 > Assembly.required_airtightness_lps_m2 (strictly greater FAILS)"
        side_effects:
          - "status -> FAILED"
          - "air_leakage_lps_m2 := payload measured_leakage_lps_m2"
          - "run mockup_testing_fee; Engagement.recognized_fees_cents += testing_fee_cents"
          - "run risk_score_update with FAILURE_DELTA (-25): risk_score = max(0, risk_score - 25)"
          - "run posture_derivation (risk band may flip posture)"
      - from: FAILED
        to: REMEDIATED
        trigger: POST /engagements/{id}/mock-ups/{mockUpId}/mark-remediated
        actor: Consultant
        preconditions:
          - "mock_up.status == FAILED (ERR_MOCKUP_NOT_ACTIONABLE)"
        side_effects:
          - "status -> REMEDIATED"
      - from: REMEDIATED
        to: TESTING
        trigger: POST /engagements/{id}/mock-ups/{mockUpId}/begin-testing
        actor: Consultant
        preconditions:
          - "mock_up.status == REMEDIATED (ERR_MOCKUP_NOT_ACTIONABLE)"
          - "payload new_chamber_slot_id is present and references a ChamberSlot of the same engagement with status == RESERVED (ERR_SLOT_NOT_RESERVED)"
          - "logical clock date within that slot's half-open window (ERR_OUTSIDE_SLOT_WINDOW)"
        side_effects:
          - "status -> TESTING"
          - "attempt_number += 1"
          - "chamber_slot_id := payload new_chamber_slot_id (re-pointed)"
          - "new ChamberSlot.status -> CONSUMED"

  - entity: FieldTest
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /engagements/{id}/field-tests/{fieldTestId}/begin
        actor: FieldTechnician
        preconditions:
          - "execution_status == SCHEDULED (ERR_FIELD_TEST_NOT_ACTIONABLE)"
          - "engagement.status == IN_PROGRESS (ERR_ENGAGEMENT_NOT_IN_PROGRESS)"
          - "engagement.posture != FROZEN (ERR_ENGAGEMENT_FROZEN)"
          - "Assembly.review_status == APPROVED for the tested assembly (ERR_ASSEMBLY_NOT_APPROVED)"
        side_effects:
          - "execution_status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: RESULT_RECORDED
        trigger: POST /engagements/{id}/field-tests/{fieldTestId}/record-result
        actor: FieldTechnician
        preconditions:
          - "execution_status == IN_PROGRESS (ERR_FIELD_TEST_NOT_ACTIONABLE)"
        side_effects:
          - "execution_status -> RESULT_RECORDED"
          - "performed_by := X-User-ID"
          - "measured_leakage_lps_m2 := payload value"
          - "run field_test_result_calc -> result PASS | FAIL"
          - "if result == FAIL: diagnosis_status NOT_REQUIRED -> UNDIAGNOSED, and auto-create Anomaly(engagement_id, field_test_id=this, anomaly_type=AIR_LEAKAGE, severity=HIGH, description='Auto-raised from failing field test', status=OPEN)"
          - "if result == FAIL: run risk_score_update FAILURE_DELTA (-25)"
          - "run posture_derivation"
      - from: RESULT_RECORDED
        to: CERTIFIED
        trigger: POST /engagements/{id}/field-tests/{fieldTestId}/certify
        actor: Principal
        preconditions:
          - "engagement.posture != FROZEN (ERR_ENGAGEMENT_FROZEN)"
          - "execution_status == RESULT_RECORDED (ERR_FIELD_TEST_NOT_ACTIONABLE)"
          - "segregation of duties: X-User-ID != performed_by (ERR_DUTY_SEGREGATION_VIOLATION)"
          - "if result == FAIL then diagnosis_status == DIAGNOSED (ERR_DIAGNOSIS_INCOMPLETE)"
        side_effects:
          - "execution_status -> CERTIFIED"
          - "certified_by := X-User-ID"
      - from: UNDIAGNOSED
        to: DIAGNOSING
        trigger: POST /engagements/{id}/field-tests/{fieldTestId}/begin-diagnosis
        actor: Consultant
        preconditions:
          - "diagnosis_status == UNDIAGNOSED (ERR_FIELD_TEST_NOT_ACTIONABLE)"
        side_effects:
          - "diagnosis_status -> DIAGNOSING"
      - from: DIAGNOSING
        to: DIAGNOSED
        trigger: POST /engagements/{id}/field-tests/{fieldTestId}/complete-diagnosis
        actor: Consultant
        preconditions:
          - "diagnosis_status == DIAGNOSING (ERR_FIELD_TEST_NOT_ACTIONABLE)"
        side_effects:
          - "diagnosis_status -> DIAGNOSED"

  - entity: Survey
    initial_state: PLANNED
    terminal_states: [ANALYZED, VOID]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: POST /engagements/{id}/surveys/{surveyId}/complete
        actor: FieldTechnician
        preconditions:
          - "survey.status == PLANNED (ERR_SURVEY_NOT_ACTIONABLE)"
          - "engagement.posture != FROZEN (ERR_ENGAGEMENT_FROZEN)"
          - "if survey_type IN {THERMAL_IMAGING, COMBINED} then ambient_delta_t_c >= 3.0 (ERR_IMAGING_DELTA_T_INSUFFICIENT)"
        side_effects:
          - "status -> COMPLETED"
      - from: COMPLETED
        to: ANALYZED
        trigger: POST /engagements/{id}/surveys/{surveyId}/analyze
        actor: Consultant
        preconditions:
          - "survey.status == COMPLETED (ERR_SURVEY_NOT_ACTIONABLE)"
        side_effects:
          - "status -> ANALYZED"
      - from: PLANNED
        to: VOID
        trigger: POST /engagements/{id}/surveys/{surveyId}/void
        actor: Consultant
        preconditions:
          - "survey.status == PLANNED (ERR_SURVEY_NOT_ACTIONABLE)"
        side_effects:
          - "status -> VOID"

  - entity: Anomaly
    initial_state: OPEN
    terminal_states: [DISMISSED, REMEDIATED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: POST /engagements/{id}/anomalies/{anomalyId}/verify
        actor: Consultant
        preconditions:
          - "anomaly.status == OPEN (ERR_ANOMALY_NOT_OPEN)"
        side_effects:
          - "status -> VERIFIED"
          - "run risk_score_update VERIFY_DELTA by severity: CRITICAL -15, HIGH -10, MEDIUM -5, LOW -2 (applied at verify time, clamped to [0,100])"
          - "run posture_derivation"
      - from: OPEN
        to: DISMISSED
        trigger: POST /engagements/{id}/anomalies/{anomalyId}/dismiss
        actor: Principal
        preconditions:
          - "anomaly.status == OPEN (ERR_ANOMALY_NOT_OPEN)"
        side_effects:
          - "status -> DISMISSED"
          - "if anomaly.survey_id is set: parent Survey.anomaly_count recomputed (DISMISSED excluded)"
          - "run posture_derivation"
      - from: VERIFIED
        to: REMEDIATED
        trigger: "system (automatic when a RemediationPlan covering this anomaly transitions ISSUED -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> REMEDIATED"
          - "run risk_score_update REMEDIATION_RECOVERY (+10 per anomaly remediated, ceiling 100)"
          - "run posture_derivation"

  - entity: RemediationPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, COMPLETED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /engagements/{id}/remediation-plans/{planId}/issue
        actor: Consultant
        preconditions:
          - "plan.plan_status == DRAFT (ERR_PLAN_NOT_ACTIONABLE)"
          - "every anomaly_id in plan.anomaly_ids has status == VERIFIED (ERR_ANOMALY_NOT_VERIFIED)"
          - "engagement.posture == OPEN (ERR_POSTURE_NOT_OPEN)"
        side_effects:
          - "plan_status -> ISSUED"
          - "run remediation_cost_estimate ESTIMATE variant -> estimated_cost_cents"
          - "Engagement.recognized_fees_cents += estimated_cost_cents (provisional recognition)"
          - "run posture_derivation"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (automatic when POST /engagements/{id}/remediation-plans creates a plan whose supersedes_plan_id == this plan)"
        actor: system
        preconditions:
          - "this plan.plan_status == ISSUED"
        side_effects:
          - "plan_status -> SUPERSEDED"
          - "reverse provisional recognition: Engagement.recognized_fees_cents -= this plan.estimated_cost_cents"
          - "run posture_derivation"
      - from: ISSUED
        to: COMPLETED
        trigger: POST /engagements/{id}/remediation-plans/{planId}/complete
        actor: Principal
        preconditions:
          - "plan.plan_status == ISSUED (ERR_PLAN_NOT_ACTIONABLE)"
          - "engagement.posture != FROZEN (ERR_ENGAGEMENT_FROZEN)"
        side_effects:
          - "plan_status -> COMPLETED"
          - "run remediation_cost_estimate ACTUAL variant -> actual_cost_cents"
          - "Engagement.recognized_fees_cents += (actual_cost_cents - estimated_cost_cents) (reconciliation delta; may be negative)"
          - "for each anomaly_id in plan.anomaly_ids: Anomaly.status VERIFIED -> REMEDIATED (cascades risk_score_update +10 each and posture_derivation per anomaly)"
          - "run posture_derivation"
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /engagements/{id}/remediation-plans/{planId}/withdraw
        actor: Consultant
        preconditions:
          - "plan.plan_status == DRAFT (ERR_PLAN_NOT_ACTIONABLE)"
        side_effects:
          - "plan_status -> WITHDRAWN"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: UNDER_MANUFACTURER_REVIEW
        trigger: POST /engagements/{id}/warranty-claims/{claimId}/manufacturer-acknowledge
        actor: ManufacturerRep
        preconditions:
          - "claim.claim_status == FILED (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "claim_status -> UNDER_MANUFACTURER_REVIEW"
      - from: UNDER_MANUFACTURER_REVIEW
        to: ACCEPTED
        trigger: POST /engagements/{id}/warranty-claims/{claimId}/manufacturer-decide
        actor: ManufacturerRep
        preconditions:
          - "claim.claim_status == UNDER_MANUFACTURER_REVIEW (ERR_CLAIM_NOT_ACTIONABLE)"
          - "payload decision == 'ACCEPTED' (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "claim_status -> ACCEPTED"
      - from: UNDER_MANUFACTURER_REVIEW
        to: DENIED
        trigger: POST /engagements/{id}/warranty-claims/{claimId}/manufacturer-decide
        actor: ManufacturerRep
        preconditions:
          - "claim.claim_status == UNDER_MANUFACTURER_REVIEW (ERR_CLAIM_NOT_ACTIONABLE)"
          - "payload decision == 'DENIED' (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "claim_status -> DENIED"
      - from: DENIED
        to: ESCALATED
        trigger: POST /engagements/{id}/warranty-claims/{claimId}/escalate
        actor: Consultant
        preconditions:
          - "claim.claim_status == DENIED (ERR_CLAIM_NOT_ACTIONABLE)"
          - "logical clock now >= claim.response_due_at (escalation only after the 30-day manufacturer response window has fully elapsed) (ERR_ESCALATION_WINDOW_NOT_ELAPSED)"
        side_effects:
          - "claim_status -> ESCALATED"
      - from: ESCALATED
        to: ACCEPTED
        trigger: POST /engagements/{id}/warranty-claims/{claimId}/manufacturer-decide
        actor: ManufacturerRep
        preconditions:
          - "claim.claim_status == ESCALATED (ERR_CLAIM_NOT_ACTIONABLE)"
          - "payload decision == 'ACCEPTED' (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "claim_status -> ACCEPTED"
      - from: ESCALATED
        to: DENIED
        trigger: POST /engagements/{id}/warranty-claims/{claimId}/manufacturer-decide
        actor: ManufacturerRep
        preconditions:
          - "claim.claim_status == ESCALATED (ERR_CLAIM_NOT_ACTIONABLE)"
          - "payload decision == 'DENIED' (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "claim_status -> DENIED (cycle DENIED -> ESCALATED -> DENIED may repeat)"
      - from: ACCEPTED
        to: RESOLVED
        trigger: POST /engagements/{id}/warranty-claims/{claimId}/resolve
        actor: Consultant
        preconditions:
          - "claim.claim_status == ACCEPTED (ERR_CLAIM_NOT_ACTIONABLE)"
        side_effects:
          - "claim_status -> RESOLVED"
          - "run warranty_recovery_share -> recovered_amount_cents"
          - "Engagement.recognized_fees_cents -= recovered_amount_cents (recovery offsets recognized fees; floored so recognized_fees_cents >= 0)"
          - "run posture_derivation"

  - entity: LitigationHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: POST /engagements/{id}/litigation-holds/{holdId}/release
        actor: Principal
        preconditions:
          - "hold.hold_status == ACTIVE (ERR_HOLD_NOT_ACTIVE)"
        side_effects:
          - "hold_status -> RELEASED"
          - "Engagement.litigation_hold_active := false (no other ACTIVE hold)"
          - "run posture_derivation (posture may thaw FROZEN -> RESTRICTED/OPEN)"
          - "increments Engagement.version by 1"

  - entity: ChamberSlot
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system (automatic when a MockUp enters TESTING against this slot)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CONSUMED"
      - from: RESERVED
        to: RELEASED
        trigger: POST /engagements/{id}/chamber-slots/{slotId}/release
        actor: Consultant
        preconditions:
          - "slot.status == RESERVED (ERR_SLOT_NOT_RESERVED)"
          - "no MockUp references this slot with mock_up.status IN {PLANNED, CONSTRUCTING, READY_FOR_TEST, REMEDIATED} (ERR_SLOT_IN_USE)"
        side_effects:
          - "status -> RELEASED"

  - entity: MaintenanceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /engagements/{id}/maintenance-visits/{visitId}/complete
        actor: FieldTechnician
        preconditions:
          - "visit.visit_status == SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "logical clock date is within the visit's closed window [window_start_date, window_end_date] inclusive (ERR_OUTSIDE_VISIT_WINDOW)"
        side_effects:
          - "visit_status -> COMPLETED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /engagements/{id}/maintenance-visits/{visitId}/cancel
        actor: Consultant
        preconditions:
          - "visit.visit_status == SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
        side_effects:
          - "visit_status -> CANCELLED"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /engagements/{id}/invoices/{invoiceId}/issue
        actor: Consultant
        preconditions:
          - "invoice.invoice_status == DRAFT (ERR_INVOICE_NOT_DRAFT)"
          - "engagement.posture != FROZEN (ERR_ENGAGEMENT_FROZEN)"
          - "fiscal gate: Engagement.fee_headroom_cents >= invoice.total_cents (ERR_FEE_CAP_EXCEEDED)"
        side_effects:
          - "invoice_status -> ISSUED"
          - "Engagement.invoiced_cents recomputed (sum over IN {ISSUED, PAID})"
      - from: ISSUED
        to: PAID
        trigger: POST /engagements/{id}/invoices/{invoiceId}/mark-paid
        actor: Principal
        preconditions:
          - "invoice.invoice_status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "invoice_status -> PAID"
          - "Engagement.invoiced_cents recomputed"
      - from: DRAFT
        to: VOID
        trigger: POST /engagements/{id}/invoices/{invoiceId}/void
        actor: Consultant
        preconditions:
          - "invoice.invoice_status == DRAFT (ERR_INVOICE_NOT_DRAFT)"
        side_effects:
          - "invoice_status -> VOID"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: remediation-plan-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/remediation-plans"
    occ_field: expected_engagement_version
    description: |
      Creating a RemediationPlan against an Engagement whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a superseding plan
      (which legitimately flips the prior ISSUED plan to SUPERSEDED under
      the supersede rule) and the current writer's view of the engagement
      is therefore stale.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
  - rule_id: remediation-plan-issue-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/remediation-plans/{planId}/issue"
    occ_field: expected_engagement_version
    description: |
      Issuing a RemediationPlan against an Engagement whose version has
      advanced since the client last observed it is rejected, because the
      issuance mutates recognized fees and may supersede nothing while a
      prior supersede has already shifted the fee ledger the issuer relied on.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: design_review_fee
    trigger: "DesignReview UNDER_REVIEW -> APPROVED and UNDER_REVIEW -> REJECTED transitions"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: base tier first, then barrier surcharge,
      # then revision surcharge. All integer cents; no rounding needed.
      base = 0
      if drawing_count <= 5:            base = 250000            # tier 1
      elif drawing_count <= 15:         base = 250000 + (drawing_count - 5) * 30000   # tier 2 marginal
      else:                             base = 250000 + 10 * 30000 + (drawing_count - 15) * 20000  # tier 3 marginal
      barrier_surcharge = (len(barrier_scope) - 1) * 40000       # per extra barrier layer
      revision_surcharge = revision_round * 0.10 * base          # 10% of base per revision round
      # revision_surcharge uses round-half-up to integer cents
      review_fee_cents = base + barrier_surcharge + round_half_up(revision_surcharge)
    input_set: "the transitioning DesignReview (drawing_count, barrier_scope, revision_round at transition time)"
    constants:
      TIER1_MAX_DRAWINGS: 5
      TIER1_BASE_CENTS: 250000
      TIER2_MARGINAL_CENTS: 30000
      TIER2_MAX_DRAWINGS: 15
      TIER3_MARGINAL_CENTS: 20000
      EXTRA_BARRIER_CENTS: 40000
      REVISION_SURCHARGE_PCT: 0.10
    precision: "integer cents; revision surcharge rounded half-up to whole cents"

  - name: mockup_testing_fee
    trigger: "MockUp TESTING -> PASSED and TESTING -> FAILED transitions"
    algorithm: aggregation
    formula: |
      # Nested rounding — order is pinned: compute per-day rate with specimen
      # surcharge and round EACH DAY's charge first, then sum over days.
      # (Rounding once at the end is a different, explicitly rejected, variant.)
      days = (ChamberSlot.end_date - ChamberSlot.start_date) in whole days   # half-open window length
      daily = ChamberSlot.daily_rate_cents * (1 + 0.05 * (MockUp.specimen_count - 1))
      daily_rounded = round_half_up(daily)                # per-day rounding, FIRST
      testing_fee_cents = daily_rounded * days * MockUp.attempt_number  # multiply AFTER rounding
    input_set: "the transitioning MockUp (specimen_count, attempt_number) and its referenced ChamberSlot (start_date, end_date, daily_rate_cents)"
    constants:
      SPECIMEN_SURCHARGE_PCT: 0.05
    precision: "integer cents; per-day charge rounded half-up before multiplying by days and attempt_number"

  - name: field_test_result_calc
    trigger: "FieldTest IN_PROGRESS -> RESULT_RECORDED transition"
    algorithm: threshold
    formula: |
      # Pressure-corrected allowable leakage, then a strict/greater-equal boundary.
      # allowable scales linearly with test pressure relative to the 75 Pa reference.
      allowable = Assembly.required_airtightness_lps_m2 * (FieldTest.test_pressure_pa / 75)
      if measured_leakage_lps_m2 <= allowable: result = PASS     # boundary: equality PASSES
      else:                                    result = FAIL
    input_set: "the transitioning FieldTest (measured_leakage_lps_m2, test_pressure_pa) and its Assembly.required_airtightness_lps_m2"
    constants:
      REFERENCE_PRESSURE_PA: 75
    precision: "comparison in exact decimal arithmetic; no rounding applied to either side"

  - name: remediation_cost_estimate
    trigger: "RemediationPlan DRAFT -> ISSUED (ESTIMATE variant) and ISSUED -> COMPLETED (ACTUAL variant)"
    algorithm: weighted_scoring
    formula: |
      # Per-anomaly severity base cost, summed; ESTIMATE adds a contingency
      # multiplier on the subtotal; ACTUAL drops contingency and adds the
      # spec-section mobilization charge instead.
      severity_cost = {LOW: 500000, MEDIUM: 1500000, HIGH: 4000000, CRITICAL: 9000000}
      subtotal = sum(severity_cost[a.severity] for a in anomalies listed in plan.anomaly_ids)
      mobilization = len(plan.spec_sections) * 125000
      # ESTIMATE variant:
      estimated_cost_cents = round_half_up(subtotal * 1.20)                      # 20% contingency, no mobilization
      # ACTUAL variant:
      actual_cost_cents = subtotal + mobilization                                # no contingency, mobilization added
    input_set: "the transitioning RemediationPlan (anomaly_ids -> Anomaly.severity, spec_sections)"
    constants:
      CONTINGENCY_PCT: 0.20
      MOBILIZATION_PER_SECTION_CENTS: 125000
    precision: "integer cents; contingency product rounded half-up"
    variants:
      - name: ESTIMATE
        when: "DRAFT -> ISSUED"
        difference: "applies 20% contingency multiplier on subtotal; excludes mobilization charge"
      - name: ACTUAL
        when: "ISSUED -> COMPLETED"
        difference: "no contingency; adds mobilization charge of 125000 cents per spec section"

  - name: engagement_fee_accrual
    trigger: "Engagement IN_PROGRESS -> CLOSE_OUT (FINAL variant); every fee-affecting transition otherwise (PROVISIONAL running accumulator)"
    algorithm: chronological
    formula: |
      # PROVISIONAL variant (running accumulator): each fee event (design review
      # fee, mock-up testing fee, remediation estimate/delta, warranty recovery)
      # mutates Engagement.recognized_fees_cents incrementally at transition time.
      #
      # FINAL variant (chronological replay at CLOSE_OUT): recompute from scratch
      # by replaying all fee-bearing events in (event timestamp ASC, event
      # created_at ASC) order, EXCLUDING warranty recovery offsets (final accrual
      # treats recoveries as contra-revenue reported separately, not netted).
      # The two variants legitimately diverge whenever a warranty claim resolved
      # before close-out.
      provisional = running sum of signed fee deltas, floored at 0 after each step
      final       = sum of positive fee events only, in chronological order (recoveries excluded), no floor needed
    input_set: "all fee-bearing events of the engagement: DesignReview approvals/rejections, MockUp test outcomes, RemediationPlan issue/complete/supersede, WarrantyClaim resolve"
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "incremental, at each fee-affecting transition"
        difference: "nets warranty recoveries against recognized fees with a floor of 0 applied after each event"
      - name: FINAL
        when: "Engagement IN_PROGRESS -> CLOSE_OUT"
        difference: "chronological replay of positive fee events only; warranty recoveries excluded; no intermediate floor"

  - name: risk_score_update
    trigger: "Anomaly verify (severity delta), MockUp FAILED (-25), FieldTest FAIL (-25), Anomaly REMEDIATED (+10)"
    algorithm: aggregation
    formula: |
      risk_score = clamp(risk_score + delta, 0, 100)
      deltas: MOCKUP_FAIL = -25; FIELD_TEST_FAIL = -25
              VERIFY: CRITICAL -15, HIGH -10, MEDIUM -5, LOW -2
              REMEDIATED: +10
      Floor and ceiling are applied after EVERY delta application (order matters
      when several anomalies remediate in one cascade).
    input_set: "single delta event"
    constants:
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      MOCKUP_FAIL_DELTA: -25
      FIELD_TEST_FAIL_DELTA: -25
      REMEDIATION_RECOVERY: 10

  - name: posture_derivation
    trigger: "after every risk_score_update, every anomaly OPEN/DISMISSED/VERIFIED/REMEDIATED change, litigation hold apply/release, and every fee-affecting transition"
    algorithm: constraint_propagation
    formula: |
      if Engagement.litigation_hold_active == true:                     posture = FROZEN
      elif risk_score < 40 OR exists Anomaly with status == VERIFIED and severity == CRITICAL:
                                                                      posture = FROZEN
      elif risk_score < 70 OR exists Anomaly with status == OPEN:       posture = RESTRICTED
      else:                                                           posture = OPEN
      # Note: OPEN anomalies do not freeze; only VERIFIED-CRITICAL or a hold or
      # risk < 40 freezes. RESTRICTED blocks only RemediationPlan issuance and
      # DesignReview approval (posture == OPEN required there); FROZEN blocks all
      # operational mutations listed in the transitions above.
    input_set: "Engagement (litigation_hold_active, risk_score) and its Anomaly set with status IN {OPEN, VERIFIED}"
    constants:
      RISK_FREEZE_THRESHOLD: 40
      RISK_RESTRICT_THRESHOLD: 70

  - name: warranty_recovery_share
    trigger: "WarrantyClaim ACCEPTED -> RESOLVED transition"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall: manufacturer pays claimed amount capped by the engagement's
      # remaining unrecognized remediation outlay; remainder is written off.
      # recovered = min(claimed_amount_cents, max(0, sum(estimated+actual deltas of completed plans covering the claimed anomaly) - already_recovered_for_that_anomaly))
      # Simplified pinned form for this scaffold:
      covering = RemediationPlans with plan_status == COMPLETED whose anomaly_ids contain claim.anomaly_id
      outlay = sum(p.actual_cost_cents for p in covering)          # 0 if none
      already = sum(c.recovered_amount_cents for c in WarrantyClaims with anomaly_id == claim.anomaly_id and claim_status == RESOLVED and c.id != this claim)
      recovered_amount_cents = min(claim.claimed_amount_cents, max(0, outlay - already))
    input_set: "the resolving WarrantyClaim, RemediationPlans covering its anomaly, other RESOLVED claims on the same anomaly"
    precision: "integer cents"

  - name: invoice_total_calc
    trigger: "Invoice creation (POST /engagements/{id}/invoices)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency pinned: the discount TIER is selected from
      # the PRE-discount subtotal, then the discount is applied once. Evaluation
      # order: subtotal -> tier lookup -> discount -> round.
      subtotal_cents = round_half_up(labor_hours * Engagement.labor_rate_cents_per_hour) + expense_cents
      if subtotal_cents >= 2000000: effective_discount_pct = max(discount_pct, 10)   # volume tier floor
      else:                         effective_discount_pct = discount_pct
      total_cents = round_half_up(subtotal_cents * (1 - effective_discount_pct / 100))
    input_set: "the new Invoice (labor_hours, expense_cents, discount_pct) and Engagement.labor_rate_cents_per_hour"
    constants:
      VOLUME_TIER_THRESHOLD_CENTS: 2000000
      VOLUME_TIER_MIN_DISCOUNT_PCT: 10
    precision: "integer cents; each multiplication rounded half-up at the pinned step"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right (engagement, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_constraint
    check: "Request body required fields present; enum fields in declared sets; numeric ranges respected (fee_cap >= 1, end_date > start_date, window_end >= window_start, delta_t numeric, etc.); XOR constraint on Anomaly field_test_id/survey_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST/PUT endpoints
  - priority: 5
    category: state
    check: "Engagement lifecycle gate: mutating child operations require engagement.status == IN_PROGRESS (unless the transition explicitly targets a different lifecycle stage)"
    error_id: ERR_ENGAGEMENT_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "child creation and transition endpoints"
  - priority: 6
    category: state
    check: "Litigation / posture gate: FROZEN posture blocks operational mutations (ERR_ENGAGEMENT_FROZEN); DesignReview approve and RemediationPlan issue additionally require posture == OPEN (ERR_POSTURE_NOT_OPEN)"
    error_id: ERR_ENGAGEMENT_FROZEN
    http_status: 409
    applies_to: "posture-gated endpoints"
  - priority: 7
    category: state
    check: "Target-entity state preconditions of the invoked transition (e.g., review must be UNDER_REVIEW, slot RESERVED, claim DENIED for escalate)"
    error_id: "ERR_REVIEW_NOT_ACTIONABLE | ERR_MOCKUP_NOT_ACTIONABLE | ERR_FIELD_TEST_NOT_ACTIONABLE | ERR_SURVEY_NOT_ACTIONABLE | ERR_ANOMALY_NOT_OPEN | ERR_PLAN_NOT_ACTIONABLE | ERR_CLAIM_NOT_ACTIONABLE | ERR_VISIT_NOT_SCHEDULED | ERR_INVOICE_NOT_DRAFT | ERR_INVOICE_NOT_ISSUED | ERR_HOLD_NOT_ACTIVE | ERR_SLOT_NOT_RESERVED (per target entity, see §1.6)"
    http_status: 409
    applies_to: "transition endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: FieldTest certifier != performed_by; DesignReview approver != reviewer_id of current round when revision_round >= 1"
    error_id: ERR_DUTY_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST .../field-tests/{id}/certify, POST .../design-reviews/{id}/approve"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: chamber-slot half-open window for begin-testing (ERR_OUTSIDE_SLOT_WINDOW); maintenance closed window for complete (ERR_OUTSIDE_VISIT_WINDOW); escalation window elapsed for claim escalate (ERR_ESCALATION_WINDOW_NOT_ELAPSED); survey delta-T condition (ERR_IMAGING_DELTA_T_INSUFFICIENT)"
    error_id: "ERR_OUTSIDE_SLOT_WINDOW | ERR_OUTSIDE_VISIT_WINDOW | ERR_ESCALATION_WINDOW_NOT_ELAPSED | ERR_IMAGING_DELTA_T_INSUFFICIENT"
    http_status: 409
    applies_to: "begin-testing, complete-visit, escalate, complete-survey"
  - priority: 10
    category: business_constraint
    check: "Temporal overlap: new ChamberSlot half-open [start,end) must not intersect any existing RESERVED/CONSUMED slot with same chamber_code on the engagement (adjacent windows touching at a boundary day are allowed); new MaintenanceVisit closed [start,end] expanded by buffer_days on both sides must not intersect any other SCHEDULED visit's closed window (touching endpoints DO conflict)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST .../chamber-slots, POST .../maintenance-visits"
  - priority: 10
    category: business_constraint
    check: "Assembly tag uniqueness within the engagement (case-sensitive)"
    error_id: ERR_DUPLICATE_ASSEMBLY_TAG
    http_status: 409
    applies_to: "POST .../assemblies"
  - priority: 10
    category: business_constraint
    check: "supersedes_plan_id, when present, must reference a RemediationPlan of the same engagement whose plan_status == ISSUED"
    error_id: ERR_SUPERSEDES_NOT_ISSUED
    http_status: 409
    applies_to: "POST .../remediation-plans"
  - priority: 11
    category: business_referential
    check: "Referential preconditions: tested assembly review_status == APPROVED (ERR_ASSEMBLY_NOT_APPROVED); every anomaly VERIFIED for plan issue or claim create (ERR_ANOMALY_NOT_VERIFIED); diagnosis complete for FAIL certification (ERR_DIAGNOSIS_INCOMPLETE); referenced entities belong to the path engagement"
    error_id: "ERR_ASSEMBLY_NOT_APPROVED | ERR_ANOMALY_NOT_VERIFIED | ERR_DIAGNOSIS_INCOMPLETE"
    http_status: 409
    applies_to: "field-test begin, plan issue, claim create, field-test certify"
  - priority: 12
    category: business_fiscal
    check: "Fiscal: provisional fee event must keep fee_headroom_cents >= 0 (ERR_FEE_CAP_EXCEEDED); invoice issue requires headroom >= invoice.total_cents"
    error_id: ERR_FEE_CAP_EXCEEDED
    http_status: 402
    applies_to: "fee-affecting transitions, invoice issue"
  - priority: 13
    category: business_constraint
    check: "OCC: expected_engagement_version must equal the engagement's current version on OCC-guarded writes (remediation-plan create/issue)"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST .../remediation-plans, POST .../remediation-plans/{planId}/issue"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical server clock (ISO 8601 UTC). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (server startup default; never falls back to wall-clock time)."
    roles: [Principal]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutation"]

  # --- Engagement ---
