      - name: probation_schedule_pinned_four_step_forward_pass
        grounds:
          - calculations.probation_schedule
          - calculations.field_training_competency_score
          - entities.Recruit.fields.probation_milestone_due_date
          - entities.Recruit.fields.probation_milestone_score
          - entities.Recruit.fields.probation_extension_days
          - entities.Recruit.fields.probation_scheduled_end
          - state_machines[FieldTrainingRotation].transitions[ACTIVE -> COMPLETED]
        distinguishing_aspect: |
          Four outputs are produced by ONE pinned forward pass over five inputs: probation_start,
          probation_base_days, MILESTONE_FRACTION, the eligible rotation set and the EXTENSION_TIER
          ladder. STEP 1 must read probation_base_days ONLY (an implementation that derived the
          milestone from probation_scheduled_end would get 2027-07-17 and could then select a
          different rotation); STEP 2 is an explicit selector (filter status IN {COMPLETED, REMEDIAL}
          AND end_date <= milestone AND score NOT NULL, rank end_date DESC), so the LATER rotation's
          4.80 wins over the earlier rotation's 6.00 even though 6.00 is the better score; STEP 3
          keys the tier on that selected score; STEP 4 alone consumes the extension. Completing the
          second rotation therefore moves three of the four fields while leaving the milestone date
          frozen.
