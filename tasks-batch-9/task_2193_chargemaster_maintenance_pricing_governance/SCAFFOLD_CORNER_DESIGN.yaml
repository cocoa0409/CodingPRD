      - name: close_checks_open_findings_before_capture_hold_and_resolution_reopens_the_close_path
        claim_type: priority_ordering
        grounds:
          - validations[priority=31]
          - validations[priority=43]
          - validations[priority=44]
          - calculations.missing_charge_detection
          - entities.Department.capture_hold
        distinguishing_aspect: "With one CONFIRMED 900000-cent finding (capture_hold already true) and one still-OPEN finding, CLOSE returns ERR_FINDINGS_OPEN (43); dismissing the open finding does not unblock CLOSE, which now returns ERR_DEPARTMENT_CAPTURE_HOLD (44) and also blocks a brand-new batch for the department; a recovery line pointing at the trigger item instead of the companion item returns ERR_RECOVERY_LINE_INVALID (31); and only RESOLVE against the genuinely late companion line moves 900000 from unresolved to recovered, releases the hold and lets CLOSE succeed."
        test_recipe:
          setup:
            - "Clock 2026-09-15T00:00:00Z; facility CCN-0001, revenue code 0300, department CC-100 (mgr_cath), COST_PLUS_MARKUP rule with the default tiers."
