              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 1000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { r: $.data.id }
          trigger:
            - call: "POST /banks/${b}/reporting-periods/${p}/call-reports/${r}/prepare"
              as: CapitalAnalyst
              captures: { rwa: $.data.rwa_cents, cet1r: $.data.cet1_ratio_bps, lev: $.data.leverage_ratio_bps }
          assert:
            - "rwa_cents == 0"
            - "cet1_ratio_bps == null"
            - "tier1_ratio_bps == null"
            - "total_ratio_bps == null"
            - "leverage_ratio_bps != null  # total_exposure_cents != 0 (1e9); leverage uses total_exposure, not RWA"

