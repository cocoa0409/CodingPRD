            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "POST /voice-sessions"
              payload: { market_plan_id: "${mp_jp}", voice_talent_id: "${talent_id}", recording_booth_id: "${booth_id}", talent_contract_id: "${contract_id}", start_utc: "2026-09-10T09:00:00Z", end_utc: "2026-09-10T11:00:00Z", planned_line_count: 100 }
              as: LocalizationProducer
              captures: { sess_done: "$.data.id" }
