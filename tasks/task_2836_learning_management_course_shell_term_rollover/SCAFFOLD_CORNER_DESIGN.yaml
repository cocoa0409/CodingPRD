            - "${tgt7_pub} == PUBLISHED with ${tgt7_v3} == 3, then ${tgt7_unpub} == PROVISIONED with ${tgt7_v4} == 4 — the round trip restores every business precondition while advancing the guarded field twice"
            - "${roll_err_2} == ERR_STALE_VERSION at HTTP 412, NOT ERR_ROLLOVER_TARGET_NOT_EMPTY: the target is back in PROVISIONED and still empty, so only the version can explain the refusal"
            - "${job_b_state} == DRAFT with ${job_b_strip} == false once version 4 is used, and ${job_b_validated} == VALIDATED with ${job_b_eligible} == 1 — the superseding job is fully usable, so the guard rejected the view and not the intent"
            - "GET /rollover-jobs for the target returns total_count 2 with ${first_job} == DRAFT (created_at ASC: the untouched job_a comes first)"

      - name: continuity_window_creation_is_guarded_by_the_terms_stored_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[continuity-window-create-stale-term]
          - endpoints[POST /continuity-windows]
          - validations[12]
          - state_machines[ContinuityWindow.window_state]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "The one OCC rule whose successful write invalidates the client's own token: creating a ContinuityWindow increments the parent AcademicTerm's version, so replaying the same expected_term_version — a body that just worked — must fail with ERR_STALE_VERSION. The other two rules (parent shell, target shell) do not self-invalidate, which is why all three are needed."
        test_recipe:
          setup:
            - "Term OCC-2027-SU walked to IN_SESSION (create = version 1, REGISTRATION_OPEN = 2, IN_SESSION = 3) with one OFFICIAL PROVISIONED shell carrying one ACTIVE student enrollment; per §1.2 neither the shell create nor the enrollment declares a version increment on the term, so the term stands at 3."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "OCC-2027-SU", term_start_at: "2027-06-01T00:00:00Z", term_end_at: "2027-08-06T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t8: $.data.id, t8_v1: $.data.version }
            - call: "POST /academic-terms/${t8}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t8_v2: $.data.version }
            - call: "POST /people"
              payload: { sis_person_id: "OCC-F-03", full_name: "Barbara Liskov", primary_affiliation: "FACULTY" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { prof8: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "OCC-S-03", full_name: "Omar Haddad", primary_affiliation: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu8: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${t8}", owner_person_id: "${prof8}", sis_section_code: "OCC-410-001", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sh8: $.data.id }
            - call: "POST /course-shells/${sh8}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sh8_state: $.data.provisioning_state }
            - call: "POST /enrollments"
              payload: { shell_id: "${sh8}", person_id: "${stu8}", role: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { e8: $.data.id, e8_state: $.data.enrollment_state }
            - call: "POST /academic-terms/${t8}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t8_v3: $.data.version, t8_state: $.data.lifecycle_state, t8_heads: $.data.total_active_enrollments }
          trigger:
            - call: "POST /continuity-windows"
              payload: { term_id: "${t8}", kind: "OUTAGE", window_start: "2027-07-06T00:00:00Z", window_end: "2027-07-08T00:00:00Z", expected_term_version: "${t8_v3} - 1" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { win_err_1: $.data.error_id }
            - call: "POST /continuity-windows"
              payload: { term_id: "${t8}", kind: "OUTAGE", window_start: "2027-07-06T00:00:00Z", window_end: "2027-07-08T00:00:00Z", expected_term_version: "${t8_v3}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { win_a: $.data.id, win_a_state: $.data.window_state, win_a_heads: $.data.affected_enrollment_count, win_a_ext: $.data.extension_days_granted }
            - call: "GET /academic-terms/${t8}"
              payload: {}
