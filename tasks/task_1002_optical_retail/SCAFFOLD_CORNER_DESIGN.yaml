          assert:
            - "HTTP status == 200"
            - "ExamAppointment.${appt_id}.status == COMPLETED"
            - "ExamAppointment.${appt_id}.resulting_prescription_id == ${rx_id}"
            - "GET /optical/exam-appointments?resulting_prescription_id=${rx_id} returns total_count == 1"

      - name: shipping_a_bopis_lab_order_to_a_closed_store_returns_store_closed
        claim_type: guarded transitions
        grounds: [state_machines.LabOrder.QC_PASSED_to_SHIPPED, "validations[priority=46]", "errors[ERR_STORE_CLOSED]"]
        distinguishing_aspect: "The LabOrder QC_PASSED -> SHIPPED transition is guarded by the destination Store's state: a BOPIS order whose store was created CLOSED cannot even be confirmed, so the guard is observed at confirm with ERR_STORE_CLOSED (409) and the order stays DRAFT."
        test_recipe:
          setup: ["A CLOSED store, a self-pay customer with a VERIFIED prescription, and a DRAFT BOPIS order routed to that store."]
          setup_api_calls:
            - call: "POST /optical/stores"
              payload: { name: "Shuttered", exam_chairs: 1, status: "CLOSED" }
