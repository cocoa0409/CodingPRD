scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: shift_plan_cost_per_package_provisional_vs_final
        grounds:
          - calculations.cost_per_package
          - calculations.planned_labor_cost
          - calculations.actual_labor_cost
          - entities.ShiftPlan.fields.provisional_cost_per_package_cents
          - entities.ShiftPlan.fields.final_cost_per_package_cents
          - state_machines.ShiftPlan.SUBMITTED_to_APPROVED
          - state_machines.ShiftPlan.APPROVED_to_CLOSED
        distinguishing_aspect: |
          This dual variant is cost accounting on ShiftPlan: PROVISIONAL divides planned labor plus
          fixed overhead by the full forecast volume, FINAL divides actually-worked labor plus overhead
          plus mis-sort rework by sorted packages NET of mis-sorts, so the same shift settles at
          30.20 cents instead of the 20.20 cents quoted at approval.
        test_recipe:
          setup:
            - "Center SC1 with automation_utilization_pct 70 (mid tier, 950 pph) and flex_pool_total 20, posture OPEN"
            - "One chute C1 (1200 pph) and one destination lane L-WEST (forecast_hourly_volume 3000) mapped to C1 for 06:00-14:00"
            - "ShiftPlan for 2026-08-03, window 06:00-14:00 (8.00 h), forecast_volume 4000, planned_core_headcount 4, planned_seasonal_headcount 0, labor_budget_cents 100000, approved (required_headcount 4, flex draw 0)"
            - "Two CERTIFIED CORE workers, each assigned to C1, each checked in at 06:00 and checked out at 14:00 (worked_hours 8.00 each)"
            - "A trailer with manifest_package_count 3000 fully unloaded, 2400 packages scanned onto lane L-WEST, and a MISSORT exception of 400 packages raised against that lane"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute1_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute1_v}" }
              as: SortSupervisor
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_approve: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v_approve}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Worker One", hire_class: "CORE", hire_date: "2026-07-20" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w1_id: $.data.id }
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "ONBOARDING_STARTED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "BACKGROUND_CLEARED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w1_id}/onboarding-events"
              payload: { event_type: "CERTIFIED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Worker Two", hire_class: "CORE", hire_date: "2026-07-20" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w2_id: $.data.id }
            - call: "POST /sortation/workers/${w2_id}/onboarding-events"
              payload: { event_type: "ONBOARDING_STARTED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w2_id}/onboarding-events"
              payload: { event_type: "BACKGROUND_CLEARED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w2_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w2_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${w2_id}/onboarding-events"
              payload: { event_type: "CERTIFIED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${w1_id}", line_chute_id: "${chute1_id}", role_on_line: "PRIMARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { a1_id: $.data.id }
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${w2_id}", line_chute_id: "${chute1_id}", role_on_line: "PRIMARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { a2_id: $.data.id }
            - call: "POST /sortation/staff-assignments/${a1_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${w1_id}"
            - call: "POST /sortation/staff-assignments/${a2_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${w2_id}"
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 3000 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center_id}", door_id: "${door_out_id}", destination_lane_id: "${lane1_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 1000, dispatch_cut_time: "2026-08-03T13:00:00Z" }
              as: SortSupervisor
              captures: { load_id: $.data.id }
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 2400 }
              as: SortSupervisor
            - call: "POST /sortation/package-exceptions"
              payload: { sort_center_id: "${center_id}", exception_type: "MISSORT", package_count: 400, from_destination_lane_id: "${lane1_id}" }
              as: SortSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T14:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/staff-assignments/${a1_id}/check-out"
              payload: {}
              as: Worker
              as_user_id: "${w1_id}"
            - call: "POST /sortation/staff-assignments/${a2_id}/check-out"
              payload: {}
              as: Worker
              as_user_id: "${w2_id}"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_close: $.data.version }
          trigger:
            - call: "POST /sortation/shift-plans/${plan_id}/close"
              payload: { expected_center_version: "${center_v_close}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "ShiftPlan.${plan_id}.required_headcount == 4"
            - "ShiftPlan.${plan_id}.planned_labor_cents == 68800"
            - "ShiftPlan.${plan_id}.provisional_cost_per_package_cents == 20.20"
            - "ShiftPlan.${plan_id}.actual_labor_cents == 34400"
            - "ShiftPlan.${plan_id}.final_cost_per_package_cents == 30.20"
            - "ShiftPlan.${plan_id}.sorted_package_count == 2400"
            - "ShiftPlan.${plan_id}.missort_package_count == 400"
            - "ShiftPlan.${plan_id}.status == CLOSED"
            - "StaffAssignment.${a1_id}.worked_hours == 8.00 and StaffAssignment.${a2_id}.worked_hours == 8.00"
            - "ShiftPlan.${plan_id}.final_cost_per_package_cents - ShiftPlan.${plan_id}.provisional_cost_per_package_cents == 10.00"

      - name: worker_attrition_cohort_baseline_vs_individual_observed
        grounds:
          - calculations.attrition_risk_score
          - entities.Worker.fields.attrition_risk_basis
          - entities.Worker.fields.attrition_risk_score
          - entities.Worker.fields.completed_assignment_count
          - state_machines.Worker.CLEARED_to_CLEARED
          - state_machines.StaffAssignment.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: |
          This dual variant is risk scoring on Worker, a different entity domain from the ShiftPlan
          cost accounting instance: with two completed assignments the score is the pure cohort curve
          0.4300 (tenure bucket 0.31 + SEASONAL 0.12, observed terms discarded), and the third
          completion alone flips the basis to INDIVIDUAL_OBSERVED and the score to 0.4400 without any
          change to tenure, class, no-shows or missed training.
        test_recipe:
          setup:
            - "Logical clock held at 2026-08-03T06:00:00Z so tenure_days is exactly 19 for a worker hired 2026-07-15"
            - "Center SC1 (automation 70, flex_pool_total 20) with one chute C1"
            - "ShiftPlan 2026-08-03 06:00-14:00, forecast_volume 4000, planned_core_headcount 0, planned_seasonal_headcount 1, labor_budget_cents 100000, approved (required_headcount 4, flex draw 3, planned_labor_cents 83462)"
            - "One SEASONAL worker, CERTIFIED, training_sessions_completed 2, training_sessions_missed 1, no_show_count 0"
            - "Three StaffAssignments created for that worker on C1; the first two are already checked in and out (completed_assignment_count 2)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 0, planned_seasonal_headcount: 1, labor_budget_cents: 100000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_approve: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v_approve}" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Seasonal Sam", hire_class: "SEASONAL", hire_date: "2026-07-15" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { ws_id: $.data.id }
            - call: "POST /sortation/workers/${ws_id}/onboarding-events"
              payload: { event_type: "ONBOARDING_STARTED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${ws_id}/onboarding-events"
              payload: { event_type: "BACKGROUND_CLEARED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${ws_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${ws_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_COMPLETED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${ws_id}/onboarding-events"
              payload: { event_type: "TRAINING_SESSION_MISSED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${ws_id}/onboarding-events"
              payload: { event_type: "CERTIFIED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${ws_id}", line_chute_id: "${chute1_id}", role_on_line: "SECONDARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { sa1_id: $.data.id }
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${ws_id}", line_chute_id: "${chute1_id}", role_on_line: "SECONDARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { sa2_id: $.data.id }
            - call: "POST /sortation/staff-assignments"
              payload: { shift_plan_id: "${plan_id}", worker_id: "${ws_id}", line_chute_id: "${chute1_id}", role_on_line: "SECONDARY_SORTER" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { sa3_id: $.data.id }
            - call: "POST /sortation/staff-assignments/${sa1_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${ws_id}"
            - call: "POST /sortation/staff-assignments/${sa1_id}/check-out"
              payload: {}
              as: Worker
              as_user_id: "${ws_id}"
            - call: "POST /sortation/staff-assignments/${sa2_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${ws_id}"
            - call: "POST /sortation/staff-assignments/${sa2_id}/check-out"
              payload: {}
              as: Worker
              as_user_id: "${ws_id}"
            - call: "GET /sortation/workers/${ws_id}"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
          trigger:
            - call: "POST /sortation/staff-assignments/${sa3_id}/check-in"
              payload: {}
              as: Worker
              as_user_id: "${ws_id}"
            - call: "POST /sortation/staff-assignments/${sa3_id}/check-out"
              payload: {}
              as: Worker
              as_user_id: "${ws_id}"
          assert:
            - "the last setup GET /sortation/workers/${ws_id} returns attrition_risk_basis == COHORT_BASELINE, attrition_risk_score == 0.4300, completed_assignment_count == 2"
            - "after the trigger Worker.${ws_id}.attrition_risk_basis == INDIVIDUAL_OBSERVED"
            - "after the trigger Worker.${ws_id}.attrition_risk_score == 0.4400"
            - "Worker.${ws_id}.completed_assignment_count == 3 and consecutive_completed_shifts == 3"
            - "Worker.${ws_id}.tenure_days == 19 and training_sessions_missed == 1 and no_show_count == 0 both before and after the trigger"
            - "Worker.${ws_id}.attrition_flagged == false (0.4400 < ATTRITION_FLAG_THRESHOLD 0.55)"

  # =====================================================================
  # Rule 2 - combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cube_consumption_per_line_rounding_then_sum
        grounds:
          - calculations.cube_consumption
          - entities.OutboundLoad.fields.cube_used_cuft
          - entities.OutboundLoad.fields.cube_utilization_pct
          - state_machines.OutboundLoad.STAGING_to_LOADING
        distinguishing_aspect: |
          Mode (b) nested-rounding instance: the scaffold pins round-each-size-class-line-to-2dp-then-sum,
          so a mixed batch of 1201 SMALL, 907 MEDIUM, 301 LARGE and 13 OVERSIZED settles at
          cube_used_cuft 2775.11, whereas the sum-then-round order would produce 2775.09.
        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20) with inbound door IN-1, outbound door OUT-1, chute C1 and lane L-WEST mapped to C1 for 06:00-14:00"
            - "A trailer with manifest_package_count 3000 fully unloaded, so SortCenter.wip_package_count == 3000"
            - "An outbound load staged on OUT-1 for lane L-WEST with trailer_cube_cuft 3800, load_status STAGING, cube_used_cuft 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute1_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute1_v}" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 3000 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center_id}", door_id: "${door_out_id}", destination_lane_id: "${lane1_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 3800, dispatch_cut_time: "2026-08-03T13:00:00Z" }
              as: SortSupervisor
              captures: { load_id: $.data.id }
          trigger:
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 1201, medium_count: 907, large_count: 301, oversized_count: 13 }
              as: SortSupervisor
          assert:
            - "OutboundLoad.${load_id}.cube_used_cuft == 2775.11"
            - "OutboundLoad.${load_id}.cube_used_cuft != 2775.09"
            - "OutboundLoad.${load_id}.cube_utilization_pct == 73.03"
            - "OutboundLoad.${load_id}.package_count == 2422"
            - "OutboundLoad.${load_id}.load_status == LOADING"
            - "DestinationLane.${lane1_id}.sorted_package_count == 2422"
            - "SortCenter.${center_id}.wip_package_count == 578"

      - name: planned_labor_flex_premium_evaluation_order
        grounds:
          - calculations.planned_labor_cost
          - calculations.required_headcount
          - entities.ShiftPlan.fields.flex_draw_count
          - entities.ShiftPlan.fields.planned_labor_cents
          - state_machines.ShiftPlan.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (c) circular-looking-dependency instance, a different mode from the cube rounding-order
          instance: the flex premium tier is keyed on the flex ratio, the flex ratio is keyed on the flex
          draw, and the draw is sized from required_headcount, so the pinned order draw -> ratio -> tier
          -> premium yields flex_draw_count 3, ratio 3/13 = 0.2308, tier 2 (0.05) and
          planned_labor_cents 243096 rather than the 231520 an order that priced before drawing gives.
        test_recipe:
          setup:
            - "Center SC1 with automation_utilization_pct 70 (950 pph tier) and flex_pool_total 20, posture OPEN"
            - "Two chutes C1 and C2, so line_count == 2 and the MIN_HEADCOUNT_PER_LINE floor is 8"
            - "ShiftPlan 2026-08-03 06:00-14:00 (8.00 h), forecast_volume 96000, planned_core_headcount 10, planned_seasonal_headcount 0, labor_budget_cents 300000, already SUBMITTED so required_headcount == 13"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C2", throughput_pph: 1200 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 96000, planned_core_headcount: 10, planned_seasonal_headcount: 0, labor_budget_cents: 300000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v: $.data.version }
          trigger:
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "ShiftPlan.${plan_id}.required_headcount == 13"
            - "ShiftPlan.${plan_id}.flex_draw_count == 3"
            - "ShiftPlan.${plan_id}.planned_labor_cents == 243096"
            - "ShiftPlan.${plan_id}.planned_labor_cents != 231520"
            - "ShiftPlan.${plan_id}.provisional_cost_per_package_cents == 2.66"
            - "ShiftPlan.${plan_id}.committed_headcount == 13 and staffing_gap == 0 and status == APPROVED"
            - "SortCenter.${center_id}.flex_pool_available == 17 and SortCenter.${center_id}.flex_pool_reserved == 3"

      - name: required_headcount_tier_times_posture_multiplier
        grounds:
          - calculations.required_headcount
          - calculations.ops_posture_derivation
          - entities.SortCenter.fields.automation_utilization_pct
          - entities.ShiftPlan.fields.required_headcount
          - state_machines.ShiftPlan.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) non-linear-interaction instance, distinct from the rounding-order and the
          evaluation-order instances: three inputs interact non-linearly (automation tier selection
          picks 700 pph at 40 percent, the RESTRICTED posture multiplier 1.10 applies before the ceil,
          and the MIN_HEADCOUNT_PER_LINE floor competes via max), giving required_headcount 19 where
          ceiling-before-multiplying would give 20.
        test_recipe:
          setup:
            - "Center SC2 created with automation_utilization_pct 40, which is below AUTOMATION_RESTRICT_PCT 45, so ops_posture is RESTRICTED from creation"
            - "Two chutes, so the MIN_HEADCOUNT_PER_LINE floor is 8"
            - "A DRAFT ShiftPlan for 2026-08-03 06:00-14:00 (8.00 h) with forecast_volume 96000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC2", name: "Manual Sort 2", automation_utilization_pct: 40, flex_pool_total: 20 }
              as: FacilityAdmin
