# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file leaves the scaffold's
# declared behaviour identical. All numeric asserts were computed by executing the §1.3 formulas.
# The logical clock is left at the mandated server default 2026-08-01T00:00:00Z unless a chain
# explicitly calls POST /_clock/set_current_utc.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: milestone_slack_calendar_versus_business_day_variant_divergence
        grounds:
          - calculations.cycle_milestone_slack
          - calculations.business_day_calendar
          - calculations.statutory_deadline_resolution
          - entities.ReportingCycle.fields.min_slack_days_calendar
          - entities.ReportingCycle.fields.min_slack_days_business
          - entities.Milestone.fields.slack_calendar_days
          - entities.Milestone.fields.slack_business_days
          - validations[priority=45]
        distinguishing_aspect: |
          The two variants of cycle_milestone_slack run on the ReportingCycle calendar domain and
          disagree numerically on identical stored data: for a CLOSE milestone ending
          2026-08-07T00:00:00Z against a statutory deadline of 2026-08-10T17:30:00Z the CALENDAR_DAY
          variant returns 3 while the BUSINESS_DAY variant returns 1, because 2026-08-08 and
          2026-08-09 fall on a weekend; only the BUSINESS_DAY value is the field of record for the
          validations[priority=45] filing-readiness gate.
        test_recipe:
          setup:
            - "One ADOPTED charter with a single ACTIVE voting FINANCE member (min_quorum_count 1, required_functions [FINANCE])."
            - "One ReportingCycle in PLANNING, FORM_10Q / LARGE_ACCELERATED, period_end_date 2026-06-30, so statutory_deadline_utc resolves to 2026-08-10T17:30:00Z."
            - "The logical clock sits at the server default 2026-08-01T00:00:00Z; no milestone exists yet."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id, deadline: $.data.statutory_deadline_utc }
          trigger:
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-03T00:00:00Z", planned_end_utc: "2026-08-07T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
          assert:
            - "ReportingCycle.${cycle_id}.statutory_deadline_utc == \"2026-08-10T17:30:00Z\""
            - "ReportingCycle.${cycle_id}.internal_target_utc == \"2026-08-05T17:30:00Z\""
            - "Milestone.${close_ms_id}.slack_calendar_days == 3"
            - "Milestone.${close_ms_id}.slack_business_days == 1"
            - "Milestone.${close_ms_id}.slack_calendar_days != Milestone.${close_ms_id}.slack_business_days"
            - "ReportingCycle.${cycle_id}.min_slack_days_calendar == 3"
            - "ReportingCycle.${cycle_id}.min_slack_days_business == 1"
            - "Milestone.${close_ms_id}.status == PLANNED"

      - name: correction_materiality_rollover_versus_iron_curtain_variant_divergence
        grounds:
          - calculations.correction_materiality_classification
          - calculations.control_deficiency_severity
          - calculations.cycle_unresolved_deficiency_weight
          - entities.PostFilingCorrection.fields.materiality_pct
          - entities.PostFilingCorrection.fields.classification
          - entities.PostFilingCorrection.fields.method
          - state_machines.PostFilingCorrection.DRAFT_to_ASSESSED
          - state_machines.ReportingCycle.UNDER_EVALUATION_to_RESTATEMENT_DECLARED
        distinguishing_aspect: |
          The two variants of correction_materiality_classification run on the PostFilingCorrection
          materiality domain (a different entity and a different numeric domain from the calendar
          variants above) and cross a classification threshold in opposite directions on byte-identical
          stored inputs: error_amount 400000 with current_period_pretax_income 10000000,
          cumulative_prior_uncorrected_amount 300000 and prior_period_pretax_income 12000000 yields
          materiality_pct 4.00 -> REVISION under ROLLOVER but 5.83 -> RESTATEMENT under IRON_CURTAIN.
        test_recipe:
          setup:
            - "A cycle driven all the way to status FILED with one SUBMITTED Filing, reached through the full close/review/certification gate stack."
            - "Two PostFilingCorrection rows in DRAFT on that Filing carrying identical figures: error_amount 400000, current_period_pretax_income 10000000, prior_period_pretax_income 12000000, cumulative_prior_uncorrected_amount 300000."
            - "cycle.restatement_stage is UNDER_EVALUATION (raised by the first correction's creation) and cycle.unresolved_deficiency_weight is 0.00."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Rhea Chief", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { ceo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Sam Fiscal", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { cfo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "REVIEW", planned_start_utc: "2026-08-05T00:00:00Z", planned_end_utc: "2026-08-06T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { review_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "FILING", planned_start_utc: "2026-08-09T00:00:00Z", planned_end_utc: "2026-08-09T06:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-04T17:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { sc_rev_id: $.data.id }
            - call: "POST /disclosure/sub-certifications/${sc_rev_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cycle_v: $.data.version }
            - call: "POST /disclosure/documents"
              payload: { cycle_id: "${cycle_id}", doc_type: "PERIODIC_FILING", title: "Form 10-Q FY2026-Q2", author_member_id: "${fin_id}", safe_harbor_present: true, expected_cycle_version: "${cycle_v}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_id: $.data.id }
            - call: "GET /disclosure/documents/${doc_id}"
              payload: {}
              as: Controller
              as_user_id: "${fin_id}"
              captures: { doc_v: $.data.version }
            - call: "POST /disclosure/documents/${doc_id}/tie-out-items"
              payload: { line_label: "Total revenue", reported_value: 4120000, source_record_value: 4120000, tolerance_bp: 25, preparer_member_id: "${fin_id}", expected_document_version: "${doc_v}" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { to1_id: $.data.id }
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "SUBMIT_REVIEW" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/documents/${doc_id}/transitions"
              payload: { action: "APPROVE" }
              as: LegalCounsel
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_REVIEW" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/milestones/${review_ms_id}/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/milestones/${review_ms_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/officer-certifications"
              payload: { cycle_id: "${cycle_id}", officer_member_id: "${ceo_id}", cert_type: "CEO_302" }
              as: ComplianceAdmin
              captures: { cert_ceo_id: $.data.id }
            - call: "POST /disclosure/officer-certifications"
              payload: { cycle_id: "${cycle_id}", officer_member_id: "${cfo_id}", cert_type: "CFO_302" }
              as: ComplianceAdmin
              captures: { cert_cfo_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CERTIFICATION" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/officer-certifications/${cert_ceo_id}/sign"
              payload: { attestation_text: "I certify the Form 10-Q fairly presents results of operations." }
              as: CertifyingOfficer
              as_user_id: "${ceo_id}"
            - call: "POST /disclosure/officer-certifications/${cert_cfo_id}/sign"
              payload: { attestation_text: "I certify the Form 10-Q fairly presents financial condition." }
              as: CertifyingOfficer
              as_user_id: "${cfo_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "DECLARE_FILING_READY" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/filings"
              payload: { cycle_id: "${cycle_id}", document_id: "${doc_id}" }
              as: ComplianceAdmin
              captures: { filing_id: $.data.id }
            - call: "POST /disclosure/filings/${filing_id}/corrections"
              payload: { description: "Understated warranty accrual", error_amount: 400000, current_period_pretax_income: 10000000, prior_period_pretax_income: 12000000, cumulative_prior_uncorrected_amount: 300000 }
              as: ComplianceAdmin
              captures: { corr_a_id: $.data.id }
            - call: "POST /disclosure/filings/${filing_id}/corrections"
              payload: { description: "Same warranty accrual, iron-curtain view", error_amount: 400000, current_period_pretax_income: 10000000, prior_period_pretax_income: 12000000, cumulative_prior_uncorrected_amount: 300000 }
              as: ComplianceAdmin
              captures: { corr_b_id: $.data.id }
          trigger:
            - call: "POST /disclosure/corrections/${corr_a_id}/transitions"
              payload: { action: "ASSESS", method: "ROLLOVER", likelihood_pct: 40, magnitude_amount: 700000, compensating_control_present: false }
              as: ComplianceAdmin
            - call: "POST /disclosure/corrections/${corr_b_id}/transitions"
              payload: { action: "ASSESS", method: "IRON_CURTAIN", likelihood_pct: 40, magnitude_amount: 700000, compensating_control_present: false }
              as: ComplianceAdmin
          assert:
            - "PostFilingCorrection.${corr_a_id}.materiality_pct == 4.00"
            - "PostFilingCorrection.${corr_a_id}.classification == REVISION"
            - "PostFilingCorrection.${corr_a_id}.method == ROLLOVER"
            - "PostFilingCorrection.${corr_b_id}.materiality_pct == 5.83"
            - "PostFilingCorrection.${corr_b_id}.classification == RESTATEMENT"
            - "PostFilingCorrection.${corr_b_id}.method == IRON_CURTAIN"
            - "PostFilingCorrection.${corr_a_id}.materiality_pct != PostFilingCorrection.${corr_b_id}.materiality_pct"
            - "ReportingCycle.${cycle_id}.unresolved_deficiency_weight == 31.32"
            - "ReportingCycle.${cycle_id}.restatement_stage == RESTATEMENT_DECLARED"
            - "ReportingCycle.${cycle_id}.status == FILED"
            - "GET /disclosure/corrections/${corr_a_id}/control-deficiencies returns exactly 1 row with severity == SIGNIFICANT_DEFICIENCY, severity_score == 4.00 and deficiency_weight == 8.00"
            - "GET /disclosure/corrections/${corr_b_id}/control-deficiencies returns exactly 1 row with severity == MATERIAL_WEAKNESS, severity_score == 5.83 and deficiency_weight == 23.32"

  - rule_id: combinatorial_formula
    instances:
      - name: subcert_scope_weight_officer_escalation_nesting_with_cap_applied_last
        grounds:
          - calculations.subcert_scope_weight
          - calculations.cycle_total_assigned_scope_weight
          - entities.SubCertificationRequest.fields.scope_weight
          - state_machines.SubCertificationRequest.PENDING_to_EXCEPTION_NOTED
          - state_machines.SubCertificationRequest.PENDING_to_SUBMITTED
        distinguishing_aspect: |
          MODE (a) nesting: scope_weight composes SCOPE_BASE_WEIGHT, OFFICER_SUPPORT_MULTIPLIER and
          EXCEPTION_ESCALATION and then clamps at SCOPE_WEIGHT_CAP, and the pinned order puts the
          clamp LAST and applies it exactly once. An officer REVENUE row already sits at the cap
          (30 * 1.5 = 45.00), so escalating it to HIGH must leave it at 45.00, not at the unclamped
          product 90.00 and not at a re-multiplied cap; the same escalation on an officer OPERATIONS
          row is below the cap and must move 30.00 -> 33.00 (20 * 1.5 * 1.1). A single row therefore
          distinguishes cap-last from cap-early and from cap-per-factor.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 1, required_functions [FINANCE]) carrying three ACTIVE voting FINANCE members: one non-officer and two officers."
            - "A ReportingCycle in CLOSE_OPEN with its CLOSE milestone still PLANNED, statutory_deadline_utc 2026-08-10T17:30:00Z and internal_target_utc 2026-08-05T17:30:00Z."
            - "Three PENDING SubCertificationRequest rows: officer/OPERATIONS (weight 30.00), officer/REVENUE (weight 45.00, already clamped) and non-officer/OPERATIONS (weight 20.00)."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Weighting Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Rhea Chief", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { ceo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Sam Fiscal", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { cfo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${ceo_id}", scope_area: "OPERATIONS", due_utc: "2026-08-04T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
              captures: { sc_ops_id: $.data.id, ops_weight_at_create: $.data.scope_weight }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${cfo_id}", scope_area: "REVENUE", due_utc: "2026-08-04T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
              captures: { sc_rev_id: $.data.id, rev_weight_at_create: $.data.scope_weight }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "OPERATIONS", due_utc: "2026-08-04T12:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
              captures: { sc_plain_id: $.data.id, plain_weight_at_create: $.data.scope_weight }
          trigger:
            - call: "POST /disclosure/sub-certifications/${sc_ops_id}/transitions"
              payload: { action: "SUBMIT", exception_severity: "LOW", exception_note: "One immaterial cut-off exception in plant operations." }
              as: BusinessLeader
              as_user_id: "${ceo_id}"
            - call: "POST /disclosure/sub-certifications/${sc_rev_id}/transitions"
              payload: { action: "SUBMIT", exception_severity: "HIGH", exception_note: "Revenue cut-off exception under investigation." }
              as: BusinessLeader
              as_user_id: "${cfo_id}"
            - call: "POST /disclosure/sub-certifications/${sc_plain_id}/transitions"
              payload: { action: "SUBMIT" }
              as: BusinessLeader
              as_user_id: "${fin_id}"
          assert:
            - "${ops_weight_at_create} == 30.00"
            - "${rev_weight_at_create} == 45.00"
            - "${plain_weight_at_create} == 20.00"
            - "SubCertificationRequest.${sc_ops_id}.status == EXCEPTION_NOTED"
            - "SubCertificationRequest.${sc_ops_id}.scope_weight == 33.00"
            - "SubCertificationRequest.${sc_rev_id}.status == EXCEPTION_NOTED"
            - "SubCertificationRequest.${sc_rev_id}.scope_weight == 45.00"
            - "SubCertificationRequest.${sc_plain_id}.status == SUBMITTED"
            - "SubCertificationRequest.${sc_plain_id}.scope_weight == 20.00"
            - "ReportingCycle.${cycle_id}.total_assigned_scope_weight == 98.00"
            - "ReportingCycle.${cycle_id}.certification_coverage_pct == 100.00"

      - name: certification_coverage_weighted_sum_before_division_not_average_of_percentages
        grounds:
          - calculations.certification_coverage_pct
          - calculations.cycle_total_assigned_scope_weight
          - entities.ReportingCycle.fields.certification_coverage_pct
        distinguishing_aspect: |
          MODE (b) pinned order: coverage sums the raw scope weights first, divides once and rounds
          once. Four rows weighted 30.00 / 25.00 / 20.00 / 15.00 with only the 30.00 and 25.00 rows
          submitted give 55 / 90 * 100 = 61.11 under the pinned order, whereas the explicitly
          forbidden order (per-scope_area percentages rounded to 2dp and then averaged unweighted)
          gives 50.00. The two numbers differ by more than 11 points, so the assert falsifies the
          wrong order outright.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with one ACTIVE voting FINANCE member and one ACTIVE voting LEGAL member, both non-officers."
            - "A ReportingCycle in CLOSE_OPEN with four PENDING SubCertificationRequest rows across four distinct scope areas weighted 30.00 (REVENUE), 25.00 (LEGAL_CONTINGENCY), 20.00 (OPERATIONS) and 15.00 (IR_COMMUNICATIONS); total_assigned_scope_weight is 90.00 and certification_coverage_pct is 0.00."
            - "The two holders each carry two rows, which is exactly MEMBER_CONCURRENT_SUBCERT_CAP and therefore admissible."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Coverage Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
