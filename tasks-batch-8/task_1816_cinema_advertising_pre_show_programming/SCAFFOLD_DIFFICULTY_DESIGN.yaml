          trigger:
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c2}", start_offset_seconds: 30, duration_seconds: 30, expected_reel_version: "${rv2}" }, as: SalesManager, captures: { err: "$.data.error_id" } }
