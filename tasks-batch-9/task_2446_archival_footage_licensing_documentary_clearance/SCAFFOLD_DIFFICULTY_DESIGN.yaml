              captures: { fu_id: $.data.id }
            - call: "POST /fair-use-analyses/${fu_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
            - call: "POST /fair-use-analyses/${fu_id}/opinion-letters"
              payload: { counsel_firm: "Donaldson & Callif", letter_reference: "OL-77", risk_rating: "LOW" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
              captures: { ol_id: $.data.id }
            - call: "POST /opinion-letters/${ol_id}/state"
              payload: { to_status: "ISSUED" }
              as: LegalCounsel
              as_user_id: "counsel-alpha"
            - call: "POST /fair-use-analyses/${fu_id}/state"
              payload: { to_status: "ACCEPTED", decision_rationale: "Transformative critique, counsel opinion on file" }
