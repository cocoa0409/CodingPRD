  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:

      - name: cases_list_pagination_and_status_filter
        claim_type: standard_crud
        grounds:
          - endpoints[GET /cases]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /cases?status=INTAKE&limit=2&offset=0 returns only cases with
          status==INTAKE; total_count counts the filtered set; has_more is true
          when total_count > offset + len(data). Creating 3 INTAKE cases and 1
          ACTIVE case, the filtered list returns 2 items (page 1), has_more=true,
          total_count=3.
        test_recipe:
          setup:
            - "Three INTAKE CA Cases and one ACTIVE CA Case for distinct clients."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "PL1", email: "pl1@example.com", phone: "555-4100" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /clients/register"
              payload: { full_name: "PL2", email: "pl2@example.com", phone: "555-4101" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /clients/register"
              payload: { full_name: "PL3", email: "pl3@example.com", phone: "555-4102" }
              as: Anonymous
              captures: { c3: $.data.id }
            - call: "POST /clients/register"
              payload: { full_name: "PL4", email: "pl4@example.com", phone: "555-4103" }
              as: Anonymous
              captures: { c4: $.data.id }
            - call: "POST /clients/${c4}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${c1}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case1: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${c2}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case2: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${c3}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case3: $.data.id }
            - call: "POST /cases"
              payload: { client_id: "${c4}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case4: $.data.id }
            - call: "POST /cases/${case4}/activate"
              payload: {}
              as: Attorney
          trigger:
            - call: "GET /cases"
              payload: { status: "INTAKE", limit: 2, offset: 0 }
              as: Attorney
              captures: { first_case_id: "$.data[0].id" }
          assert:
            - "response.data.length == 2"
            - "response.meta or pagination indicates total_count == 3 and has_more == true"
            - "every item returned has status == 'INTAKE'"

      - name: medical_lien_list_filtered_by_case
        claim_type: filtered_list
        grounds:
          - endpoints[GET /medical-liens]
          - entities.MedicalLien.fields.case_id
        distinguishing_aspect: |
          GET /medical-liens?case_id=X returns only liens belonging to that case.
          With two cases, each owning one lien, querying by case_id returns
          exactly that case's lien.
        test_recipe:
          setup:
            - "Two Active CA Cases A and B, each with one MedicalLien in ASSERTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Fa", email: "fa@example.com", phone: "555-4200" }
              as: Anonymous
              captures: { ca: $.data.id }
            - call: "POST /clients/${ca}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /clients/register"
              payload: { full_name: "Fb", email: "fb@example.com", phone: "555-4201" }
              as: Anonymous
              captures: { cb: $.data.id }
            - call: "POST /clients/${cb}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${ca}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_a: $.data.id }
            - call: "POST /cases/${case_a}/activate"
              payload: {}
              as: Attorney
            - call: "POST /cases"
              payload: { client_id: "${cb}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_b: $.data.id }
            - call: "POST /cases/${case_b}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "FP", contact: "fp@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-liens"
              payload: { case_id: "${case_a}", provider_id: "${provider_id}", asserted_amount_cents: 100000 }
              as: Paralegal
              captures: { lien_a: $.data.id }
            - call: "POST /medical-liens"
              payload: { case_id: "${case_b}", provider_id: "${provider_id}", asserted_amount_cents: 200000 }
              as: Paralegal
              captures: { lien_b: $.data.id }
          trigger:
            - call: "GET /medical-liens"
              payload: { case_id: "${case_a}" }
              as: Attorney
          assert:
            - "response.data.length == 1"
            - "response.data[0].id == '${lien_a}'"
            - "response.data[0].asserted_amount_cents == 100000"

      - name: damages_summary_returns_both_variants
        claim_type: computed_read
        grounds:
          - endpoints[GET /cases/{id}/damages-summary]
          - calculations.gross_damages_model
        distinguishing_aspect: |
          GET /cases/{id}/damages-summary returns a 200 response whose body
          carries case_id, included_damages_total_cents, gross_economic_only_cents,
          and gross_full_model_cents. With INCLUDED damages {MEDICAL_BILLS=500_000,
          PAIN_SUFFERING=300_000}, response.data is exactly {included=800_000,
          gross_economic_only=500_000, gross_full_model=800_000}.
        test_recipe:
          setup:
            - "Active CA Case with one REVIEWED MedicalRecordsRequest, INCLUDED MEDICAL_BILLS=500_000 and INCLUDED PAIN_SUFFERING=300_000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Sum Client", email: "sum@example.com", phone: "555-4300" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Sum Hosp", contact: "sum@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "MEDICAL_BILLS", amount_cents: 500000 }
              as: Paralegal
              captures: { di_med: $.data.id }
            - call: "POST /damages-items/${di_med}/include"
              payload: {}
              as: Attorney
            - call: "POST /damages-items"
              payload: { case_id: "${case_id}", category: "PAIN_SUFFERING", amount_cents: 300000 }
              as: Paralegal
              captures: { di_pain: $.data.id }
            - call: "POST /damages-items/${di_pain}/include"
              payload: {}
              as: Attorney
          trigger:
            - call: "GET /cases/${case_id}/damages-summary"
              payload: {}
              as: Attorney
          assert:
            - "response.status_code == 200"
            - "response.data.included_damages_total_cents == 800000"
            - "response.data.gross_economic_only_cents == 500000"
            - "response.data.gross_full_model_cents == 800000"

