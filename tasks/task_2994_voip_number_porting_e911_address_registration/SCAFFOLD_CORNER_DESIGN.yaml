              payload: { line_number: "3301" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "GET /voip/number-blocks/${blk_id}"
              payload: {}
              as: NumberingAdmin
              captures: { blk_v1: $.data.version }
            - call: "POST /voip/number-reservations"
              payload: { block_id: "${blk_id}", account_id: "${acct_id}", purpose: "NEW_LINE", reserved_from: "2026-08-04T00:00:00Z", reserved_until: "2026-08-10T00:00:00Z", expected_number_block_version: "${blk_v1}" }
              as: NumberingAdmin
