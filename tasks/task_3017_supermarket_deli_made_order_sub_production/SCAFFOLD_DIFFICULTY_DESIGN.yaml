          setup:
            - "Logical clock at 2026-09-02T06:00:00Z. Store S3 is empty, item J2 exists with slicer_required true, item J1 exists as its bread companion, and associate A3 holds ACTIVE SLICER_OPERATION and ALLERGEN_MANAGEMENT certifications."
