# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids x 2 instances = 18 instances. Every numeric literal in every `assert:` was
# computed by executing the corresponding §1.3 formula with its declared constants.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: dose_variant_divergence_pre_cryo_vs_post_thaw
        grounds:
          - calculations.nucleated_cell_dose
          - entities.Reservation.fields.pre_cryo_dose_x1e7_per_kg
          - entities.Reservation.fields.post_thaw_dose_x1e7_per_kg
          - entities.Reservation.fields.dose_variant_applied
          - endpoints["GET /cbb/reservations/{id}/release-summary"]
        distinguishing_aspect: |
          On the cell-dosing domain (CordBloodUnit counts x Reservation.patient_weight_kg) the PRE_CRYO
          variant yields 4.29 x1e7/kg while the POST_THAW variant yields 2.81 x1e7/kg from the SAME unit
          counts and the SAME 35.0 kg patient, because POST_THAW deflates by confirmatory viability
          (82.0%) and TNC recovery (80.00%); the delta is exactly 1.48.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-11T03:00:00Z."
            - "One ONLINE STANDARD tank with 10 slots and 1 occupied slot."
            - "One PUBLIC_DONATION enrollment, CONSENTED, with a NON_REACTIVE COMPLETED maternal panel."
            - "Its unit is CRYOPRESERVED, ELIGIBLE, LISTED, with post_processing_tnc_millions 1500, cd34 3000, viability 92.0, volume 25.0 and quality_acceptance_score 89.33."
            - "A CONFIRMED reservation for a 35.0 kg patient exists with pre_cryo_dose_x1e7_per_kg already computed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-A", tank_class: "STANDARD", capacity_slots: 10 }
              as: FacilitiesEngineer
              captures: { tank_a_id: "$.data.id" }
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PUBLIC_DONATION", primary_parent_name: "Dana Ruiz", expected_delivery_date: "2026-08-10", collection_site_code: "SITE-01", research_use_authorized: true, hla_typing_consent: true }
              as: IntakeCoordinator
              captures: { enr_pub_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_pub_id}/consent"
              payload: { consent_document_hash: "hash-pub-v1" }
              as: ParentGuardian
              as_user_id: "${enr_pub_id}"
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_pub_id}", kit_lot_code: "LOT-2026-A", courier_tracking_code: "TRK-0001" }
              as: IntakeCoordinator
              captures: { kit_pub_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/maternal-screenings"
              payload: { enrollment_id: "${enr_pub_id}", collected_at: "2026-08-10T05:00:00Z", hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE", cmv_result: "NON_REACTIVE" }
              as: MedicalDirector
              as_user_id: "md-001"
              captures: { scr_pub_id: "$.data.id" }
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_pub_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              captures: { col_pub_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/collections/${col_pub_id}/receive"
              payload: { transport_temp_c: 20.0 }
              as: ProcessingTechnologist
            - call: "GET /cbb/collections/${col_pub_id}/units"
              payload: {}
              as: ProcessingTechnologist
              captures: { unit_pub_id: "$.data[0].id" }
            - call: "POST /cbb/processing-runs"
              payload: { unit_id: "${unit_pub_id}", method: "AUTOMATED_SEPARATION", pre_tnc_millions: 1650 }
              as: ProcessingTechnologist
              captures: { run_pub_id: "$.data.id" }
            - call: "POST /cbb/processing-runs/${run_pub_id}/complete"
              payload: { outcome: "COMPLETED", post_volume_ml: 25.0, post_tnc_millions: 1500 }
              as: ProcessingTechnologist
            - call: "POST /cbb/quality-tests"
              payload: { unit_id: "${unit_pub_id}", test_kind: "POST_PROCESSING", tnc_millions: 1500, cd34_thousands: 3000, viability_pct: 92.0, volume_ml: 25.0, sterility_result: "NEGATIVE" }
              as: ProcessingTechnologist
              as_user_id: "tech-001"
              captures: { qt_pub_id: "$.data.id" }
            - call: "POST /cbb/units/${unit_pub_id}/eligibility-determination"
              payload: { decision_note: "panel clear" }
              as: MedicalDirector
              as_user_id: "md-001"
            - call: "POST /cbb/units/${unit_pub_id}/cryopreserve"
              payload: { tank_id: "${tank_a_id}", slot_code: "A-01", freeze_at: "2026-08-11T02:00:00Z" }
              as: ProcessingTechnologist
            - call: "GET /cbb/units/${unit_pub_id}"
              payload: {}
              as: RegistryOperator
              captures: { unit_pub_v1: "$.data.version" }
            - call: "POST /cbb/registry-listings"
              payload: { unit_id: "${unit_pub_id}", registry_code: "NMDP", hla_a: "A*01:01", hla_b: "B*07:02", hla_drb1: "DRB1*15:01", expected_unit_version: "${unit_pub_v1}" }
              as: RegistryOperator
              captures: { listing_pub_id: "$.data.id" }
            - call: "GET /cbb/units/${unit_pub_id}"
              payload: {}
              as: TransplantCenter
              captures: { unit_pub_v2: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T03:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/reservations"
              payload: { unit_id: "${unit_pub_id}", requesting_center_name: "Northside BMT", patient_weight_kg: 35.0, patient_hla_match_count: 6, hold_from: "2026-09-01T00:00:00Z", hold_until: "2026-09-05T00:00:00Z", expected_unit_version: "${unit_pub_v2}" }
              as: TransplantCenter
              as_user_id: "tc-001"
              captures: { res_pub_id: "$.data.id", res_pre_dose: "$.data.pre_cryo_dose_x1e7_per_kg" }
            - call: "POST /cbb/reservations/${res_pub_id}/confirm"
              payload: { intended_transplant_date: "2026-09-03" }
              as: TransplantCenter
              as_user_id: "tc-001"
          trigger:
            - call: "POST /cbb/quality-tests"
              payload: { unit_id: "${unit_pub_id}", test_kind: "CONFIRMATORY", tnc_millions: 1200, cd34_thousands: 2600, viability_pct: 82.0, volume_ml: 25.0, sterility_result: "NEGATIVE", reservation_id: "${res_pub_id}" }
              as: ProcessingTechnologist
              as_user_id: "tech-002"
              captures: { ct_pub_id: "$.data.id" }
            - call: "GET /cbb/reservations/${res_pub_id}/release-summary"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-002"
          assert:
            - "QualityTest.${ct_pub_id}.outcome == PASS"
            - "QualityTest.${ct_pub_id}.failure_reason_codes == []"
            - "Reservation.${res_pub_id}.pre_cryo_dose_x1e7_per_kg == 4.29"
            - "Reservation.${res_pub_id}.post_thaw_dose_x1e7_per_kg == 2.81"
            - "Reservation.${res_pub_id}.pre_cryo_dose_x1e7_per_kg - Reservation.${res_pub_id}.post_thaw_dose_x1e7_per_kg == 1.48"
            - "Reservation.${res_pub_id}.confirmatory_test_id == ${ct_pub_id}"
            - "Reservation.${res_pub_id}.dose_variant_applied == PRE_CRYO (the POST_THAW variant only becomes the applied variant at release)"
            - "GET /cbb/reservations/${res_pub_id}/release-summary → data.confirmatory_recovery_pct == 80.00"
            - "GET /cbb/reservations/${res_pub_id}/release-summary → data.dose_gate_passed == true"
            - "CordBloodUnit.${unit_pub_id}.post_processing_tnc_millions == 1500 (unchanged by the CONFIRMATORY test)"

      - name: storage_fee_variant_prorated_termination_vs_anniversary_accrual
        grounds:
          - calculations.storage_fee_assessment
          - calculations.disposition_settlement
          - entities.StorageAccount.fields.plan_term_years
          - entities.StorageAccount.fields.last_settlement_total_cents
        distinguishing_aspect: |
          On the billing domain (StorageAccount x paid_through_date), two accounts with identical
          paid_through_date 2027-06-30 and identical zero balances settle differently at the same clock
          instant: plan_term_years 5 takes PRORATED_TERMINATION and refunds 10060 cents (settlement
          -7560), plan_term_years 1 takes ANNIVERSARY_ACCRUAL and refunds nothing (settlement 2500).
        test_recipe:
          setup:
            - "Logical clock at 2026-12-08T00:00:00Z."
            - "One ONLINE STANDARD tank with 20 slots."
            - "Two PRIVATE_FAMILY enrollments, each CONSENTED with a NON_REACTIVE COMPLETED panel and one CRYOPRESERVED, ELIGIBLE, PRIVATE_STORED unit."
            - "Account F5 has plan_term_years 5, account F1 has plan_term_years 1; both have prepaid_through_date / paid_through_date 2027-06-30, balance_cents 0 and no invoices."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/storage-tanks"
              payload: { tank_code: "TANK-B", tank_class: "STANDARD", capacity_slots: 20 }
              as: FacilitiesEngineer
              captures: { tank_b_id: "$.data.id" }
            - call: "POST /cbb/enrollments"
