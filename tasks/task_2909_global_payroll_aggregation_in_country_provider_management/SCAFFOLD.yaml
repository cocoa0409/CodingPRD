    error_id: ERR_INVALID_REQUEST
    status_code: 422

  - rule_id: transition-decision-state
    scope: "POST /payroll/engagements/{id}/transition-decision"
    category: state
    priority: 30
    condition: "decision == APPROVE and Engagement.status != TRANSITION_PLANNED, or decision == COMPLETE and Engagement.status != TRANSITION_IN_PROGRESS, or decision == ABORT and Engagement.status not in {TRANSITION_PLANNED, TRANSITION_IN_PROGRESS}"
    error_id: ERR_ENGAGEMENT_INVALID_STATE
    status_code: 409

