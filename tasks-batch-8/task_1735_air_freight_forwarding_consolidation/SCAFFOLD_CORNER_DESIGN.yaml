        distinguishing_aspect: "Every declared FK resolves through a reverse GET: booking -> master waybills, master waybill -> house waybills and milestone events, house waybill -> screening records, shipper -> house waybills."
        test_recipe:
          setup: ["Base SFO->NRT fixture; HWB-A CONSOLIDATED into the MAWB (not yet tendered, no milestones)"]
