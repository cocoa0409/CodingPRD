            - "GET /students/${s} returns 200 with data.voucher_balance_cents == 5000 (no partial clawback applied)"
            - "the -5000 adjustment returns 200 with data.voucher_balance_cents == 0 and data.voucher_granted_cents == 0"

      - name: intake_gates_block_pre_test_and_enrollment
