          - "calculations.credit_amount"
          - "calculations.cashflow_projection"
          - "calculations.clawback_assessment"
        excluded_because:
          difficulty_instance: provisional_vs_final_credit_divergence
          rationale: "All three dual-variant pairs (credit, cashflow, clawback) are asserted with divergent literals in §1.8 dual_variant_calc instances."

  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request sent with X-User-ID / X-User-Role headers REMOVED is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or state evaluation."
        test_recipe:
          setup: ["GA program exists"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "GET /api/jurisdiction-programs/${prog_id}", as: FilmOfficeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "When the harness omits X-User-ID and X-User-Role on this call: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"
