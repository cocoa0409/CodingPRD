      - name: hazard_strike_potential_at_offset_equals_height
        grounds:
          - calculations.hazard_tree_risk_score
          - entities.HazardTree.fields.strike_potential
          - entities.HazardTree.fields.risk_score
          - endpoints["POST /vm/hazard-trees"]
        distinguishing_aspect: |
          Boundary on a GEOMETRIC EQUALITY metric reached through a different endpoint from the
          density tier above: offset_ft 40 against height_ft 40 still counts as a strike
          (offset <= height) and scores 68.00, whereas offset_ft 41 against the same height
          falls out of the corridor entirely and scores exactly 0.00 with removal_required false.
        test_recipe:
          setup:
            - "Circuit CKT-A is DISTRIBUTION_12KV, so the target weight is 8."
            - "No work plan is required; hazard trees attach to the circuit."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
          trigger:
            - call: "POST /vm/hazard-trees"
              payload: { circuit_id: "${ckt_id}", species: "SILVER_MAPLE", defect_class: "DEAD", height_ft: 40, offset_ft: 40 }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { ht_eq: $.data.id }
            - call: "POST /vm/hazard-trees"
              payload: { circuit_id: "${ckt_id}", species: "SILVER_MAPLE", defect_class: "DEAD", height_ft: 40, offset_ft: 41 }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { ht_out: $.data.id }
            - call: "POST /vm/hazard-trees"
              payload: { circuit_id: "${ckt_id}", species: "SILVER_MAPLE", defect_class: "DEAD", height_ft: 60, offset_ft: 30 }
              as: CertifiedArborist
              as_user_id: "arborist-a"
              captures: { ht_mid: $.data.id }
          assert:
            - "HazardTree.${ht_eq}.strike_potential == true"
            - "HazardTree.${ht_eq}.risk_score == 68.00"
            - "HazardTree.${ht_eq}.removal_required == true"
            - "HazardTree.${ht_out}.strike_potential == false"
            - "HazardTree.${ht_out}.risk_score == 0.00"
            - "HazardTree.${ht_out}.removal_required == false"
            - "HazardTree.${ht_mid}.risk_score == 83.00"
