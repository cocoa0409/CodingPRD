            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /clients"
              payload: { name: "Ccl Five", client_code: "CC5", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", liquidation_floor_pct: 0.3, fraud_tolerance_cents: 100000000, max_refund_exposure_cents: 100000000 }
