            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /trust-accounts"
              payload: { name: "Trust CA9b", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { trust_id: $.data.id, trust_v: $.data.version }
            - call: "POST /trust-accounts/${trust_id}/entries"
