              captures: { e_up: $.data.error_id }
            - call: "POST /demands/${dm_a}/counters"
              payload: { claimant_counter_cents: 900000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_flat_counter: $.data.error_id }
            - call: "POST /demands/${dm_a}/counters"
              payload: { claimant_counter_cents: 1800000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { g2: $.data.gap_cents, cc2: $.data.claimant_counter_cents }
            - call: "POST /demands/${dm_a}/offers"
