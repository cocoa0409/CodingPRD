# =============================================================================
# Scaffold: crypto-exchange-wallet benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Cryptocurrency Exchange & Custodial Wallet: account/KYC tiers, market/limit
  order book, deposit/withdrawal whitelist, network-confirmation hold,
  maker/taker fee, balance & cost-basis (1099-DA), staking rewards, travel-rule
  compliance

domain_name: crypto-exchange-wallet
# Flat topology: peer collections live at the service root, addressed at their own
# top-level paths (/accounts, /orders, /withdrawals, ...). The service root is the
# common prefix.
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile — Expert tier (§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation        # cost-basis: same disposals, two lot-selection algorithms, divergent realized gain
  secondary_archetype: quota_allocation            # order book: finite available balance reserved on open orders, committed on fills, released on cancel
  complexity_layers:
    - optimistic_concurrency                       # OCC on Account.version for whitelist-add and on Order.version for limit-order amend
    - cascading_side_effects                       # trade execution: match -> Trade -> 2x Balance -> CostBasisLot -> fee debit -> maker/taker volume rollup
    - dual_variant_calculation                     # FIFO vs HIFO cost-basis on disposal (1099-DA)
    - rate_threshold_triggers                       # 30-day taker volume tier breakpoints; travel-rule USD threshold; network-confirmation count

  entity_topology: flat
  # Peer entities linked by foreign keys (account_id, asset, order_id); no nested
  # ownership URLs — Order, Trade, Deposit, Withdrawal, Balance, CostBasisLot,
  # StakingPosition all reference Account.id by FK and are addressed at their own
  # top-level collections.

  state_machine_shape: parallel
  # Order carries two independent dimensions: lifecycle_status (OPEN/PARTIALLY_FILLED/
  # FILLED/CANCELLED) and a settlement axis that evolves per fill. Withdrawal is
  # cyclic (SCREENING -> TRAVEL_RULE_HOLD -> SCREENING on resubmit). Deposit/Account/
  # StakingPosition add linear + branching shapes.

  relationship_patterns:
    - one_to_many        # Account -> Order, Account -> Balance, Order -> Trade, Account -> CostBasisLot
    - cross_aggregate    # Trade debits/credits Balance rows across two assets; consumes CostBasisLot rows
    - self_referential   # Withdrawal.replaces_withdrawal_id -> a previously REJECTED Withdrawal being resubmitted

  role_model: segregation_of_duties
  # A ComplianceOfficer who CREATED/owns a withdrawal screening cannot also clear
  # its travel-rule hold (maker of the record cannot be its checker). Trader acts
  # on own account; ComplianceOfficer and Operator are opaque operational roles.

  consistency_model: immediate
  # All balance, lot, fee, and volume mutations are atomic within the triggering
  # request; computed/derived fields (available_balance, realized_gain) reconcile
  # in the same response.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique across Account" }
      - { name: full_name, type: string, source: input, description: "Legal name of the account holder" }
      - { name: residence_country, type: string, source: input, description: "ISO-3166 alpha-2 country of residence, e.g. US, GB" }
      - { name: kyc_tier, type: enum, source: system, default: TIER_0, description: "TIER_0 | TIER_1 | TIER_2 | TIER_3 — verification level; gates per-day withdrawal USD ceiling and trading eligibility" }
      - { name: kyc_status, type: enum, source: system, default: UNVERIFIED, description: "UNVERIFIED | PENDING | APPROVED | REJECTED — review state of the most recent tier-upgrade application" }
      - { name: pending_tier, type: enum, source: system, required: false, description: "The tier requested in the in-flight upgrade application; null when kyc_status != PENDING" }
      - { name: account_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | FROZEN — FROZEN blocks all trading/withdrawal/staking; set by Operator on a sanctions hit, reversible via unfreeze" }
      - { name: maker_volume_30d_usd, type: number, source: computed, description: "Sum of Trade.notional_usd where this account was the resting (maker) side and Trade.executed_at within trailing 30 days of current clock" }
      - { name: taker_volume_30d_usd, type: number, source: computed, description: "Sum of Trade.notional_usd where this account was the aggressing (taker) side and Trade.executed_at within trailing 30 days of current clock; drives fee tier" }
      - { name: fee_tier, type: enum, source: computed, description: "TIER_BASE | TIER_1 | TIER_2 | TIER_3 — derived from taker_volume_30d_usd via FeeSchedule breakpoints" }
      - { name: cost_basis_method, type: enum, source: input, default: FIFO, description: "FIFO | HIFO — lot-selection policy for realized-gain (1099-DA) reporting; fixed at account creation, immutable thereafter" }

  - name: AssetConfig
    parent: null
    common_fields: false   # id, created_at only — configuration, immutable
    fields:
      - { name: symbol, type: string, source: input, description: "Asset ticker, e.g. BTC, ETH, USD; unique", constraints: "unique across AssetConfig" }
      - { name: decimals, type: integer, source: input, description: "On-chain precision; amounts stored/validated to this many decimals" }
      - { name: required_confirmations, type: integer, source: input, description: "Network confirmations a Deposit must reach before funds become available" }
      - { name: is_fiat, type: boolean, source: input, default: false, description: "True for USD-style settlement assets that need no on-chain confirmation" }
      - { name: min_withdrawal_amount, type: number, source: input, description: "Smallest withdrawable amount in asset units" }
      - { name: network_fee, type: number, source: input, description: "Flat on-chain fee in asset units deducted from a withdrawal's debited amount" }
      - { name: spot_price_usd, type: number, source: input, description: "Reference USD price of one unit; used for notional_usd, travel-rule threshold, and 30d volume; mutable via PATCH" }

  - name: FeeSchedule
    parent: null
    common_fields: false   # id, created_at only — configuration
    fields:
      - { name: tier_name, type: enum, source: input, description: "TIER_BASE | TIER_1 | TIER_2 | TIER_3 — unique", constraints: "unique across FeeSchedule" }
      - { name: min_taker_volume_30d_usd, type: number, source: input, description: "Inclusive lower bound of trailing-30-day taker USD volume that qualifies an account for this tier" }
      - { name: maker_fee_bps, type: number, source: input, description: "Maker fee in basis points charged on the resting side's filled notional" }
      - { name: taker_fee_bps, type: number, source: input, description: "Taker fee in basis points charged on the aggressing side's filled notional" }

  - name: Balance
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: asset, type: string, source: system, description: "FK -> AssetConfig.symbol; the held asset (uniqueness: one Balance per (account_id, asset))" }
      - { name: total_amount, type: number, source: computed, description: "On-ledger holdings in asset units = available_amount + reserved_amount + held_amount" }
      - { name: reserved_amount, type: number, source: computed, description: "Units locked behind OPEN/PARTIALLY_FILLED orders (sell side reserves base, buy side reserves quote)" }
      - { name: held_amount, type: number, source: computed, description: "Units locked behind unconfirmed deposits and SCREENING/TRAVEL_RULE_HOLD/SUBMITTED withdrawals" }
      - { name: available_amount, type: number, source: computed, description: "total_amount - reserved_amount - held_amount; the spendable balance" }

  - name: WithdrawalAddress
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: asset, type: string, source: input, description: "FK -> AssetConfig.symbol; asset this address can receive" }
      - { name: chain_address, type: string, source: input, description: "Destination on-chain address string" }
      - { name: label, type: string, source: input, description: "Human label for the address" }
      - { name: status, type: enum, source: system, default: PENDING_HOLD, description: "PENDING_HOLD | ACTIVE | REMOVED — newly added addresses sit in a 24h security hold before ACTIVE" }
      - { name: activates_at, type: datetime, source: system, description: "created_at + 24h; withdrawals may target this address only at/after this instant" }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; crediting account" }
      - { name: asset, type: string, source: input, description: "FK -> AssetConfig.symbol; deposited asset" }
      - { name: amount, type: number, source: input, description: "Deposited amount in asset units" }
      - { name: confirmations, type: integer, source: system, default: 0, description: "Current network confirmation count; advanced by the confirmation endpoint" }
      - { name: unit_cost_usd, type: number, source: input, description: "Acquisition USD cost per unit recorded for cost-basis; seeds a CostBasisLot when CREDITED" }
      - { name: status, type: enum, source: system, default: DETECTED, description: "DETECTED | CONFIRMING | CREDITED | ORPHANED — CREDITED once confirmations >= asset.required_confirmations" }

  - name: Withdrawal
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; debiting account" }
      - { name: withdrawal_address_id, type: string, source: input, description: "FK -> WithdrawalAddress.id; destination, must be ACTIVE and same asset" }
      - { name: asset, type: string, source: system, description: "FK -> AssetConfig.symbol; copied from the target address" }
      - { name: amount, type: number, source: input, description: "Requested amount in asset units (excludes network_fee, which is added on debit)" }
      - { name: notional_usd, type: number, source: computed, description: "amount * AssetConfig.spot_price_usd at submission; compared to TRAVEL_RULE_THRESHOLD_USD" }
      - { name: requires_travel_rule, type: boolean, source: computed, description: "True when notional_usd >= TRAVEL_RULE_THRESHOLD_USD" }
      - { name: replaces_withdrawal_id, type: string, source: input, required: false, description: "FK -> Withdrawal.id; the REJECTED withdrawal this one resubmits (self-referential)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | SCREENING | TRAVEL_RULE_HOLD | APPROVED | BROADCAST | COMPLETED | REJECTED — see §1.2" }

  - name: TravelRuleRecord
    parent: null
    common_fields: true
    fields:
      - { name: withdrawal_id, type: string, source: input, description: "FK -> Withdrawal.id; the screening this record clears (one per withdrawal)" }
      - { name: originator_name, type: string, source: input, description: "Travel-rule originator legal name" }
      - { name: beneficiary_name, type: string, source: input, description: "Travel-rule beneficiary legal name" }
      - { name: beneficiary_vasp, type: string, source: input, description: "Receiving VASP identifier" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who filed this record (segregation-of-duties checker pool)" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED — terminal; presence of a FILED record is what releases the withdrawal's TRAVEL_RULE_HOLD" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; placing account" }
      - { name: base_asset, type: string, source: input, description: "FK -> AssetConfig.symbol; asset being bought/sold" }
      - { name: quote_asset, type: string, source: input, description: "FK -> AssetConfig.symbol; settlement asset (the price currency)" }
      - { name: side, type: enum, source: input, description: "BUY | SELL" }
      - { name: order_type, type: enum, source: input, description: "MARKET | LIMIT" }
      - { name: limit_price, type: number, source: input, required: false, description: "Quote units per base unit; required for LIMIT, forbidden for MARKET" }
      - { name: quantity, type: number, source: input, description: "Base units requested" }
      - { name: filled_quantity, type: number, source: computed, default: 0, description: "Cumulative base units filled across this order's Trades" }
      - { name: avg_fill_price, type: number, source: computed, required: false, description: "notional-weighted average fill price across Trades; null until first fill" }
      - { name: reserved_remaining, type: number, source: computed, description: "Units of the reserve asset still locked for the unfilled remainder" }
      - { name: lifecycle_status, type: enum, source: system, default: OPEN, description: "OPEN | PARTIALLY_FILLED | FILLED | CANCELLED — fill axis" }
      - { name: time_in_force, type: enum, source: input, default: GTC, description: "GTC | IOC — IOC cancels any unfilled remainder immediately after matching" }

  - name: Trade
    parent: null
    common_fields: false   # id, created_at only — append-only execution record
    fields:
      - { name: maker_order_id, type: string, source: system, description: "FK -> Order.id; the resting LIMIT order on the book" }
      - { name: taker_order_id, type: string, source: system, description: "FK -> Order.id; the aggressing incoming order" }
      - { name: base_asset, type: string, source: system, description: "FK -> AssetConfig.symbol; traded base asset" }
      - { name: quote_asset, type: string, source: system, description: "FK -> AssetConfig.symbol; settlement asset" }
      - { name: price, type: number, source: system, description: "Execution price in quote units per base unit (always the resting maker's limit_price)" }
      - { name: quantity, type: number, source: system, description: "Base units exchanged in this fill" }
      - { name: notional_usd, type: number, source: system, description: "quantity * price * quote_asset.spot_price_usd; feeds 30d volume and fee" }
      - { name: maker_fee, type: number, source: system, description: "Maker fee in quote units = notional(quote) * maker_fee_bps/10000, round_half_up to quote decimals" }
      - { name: taker_fee, type: number, source: system, description: "Taker fee in quote units = notional(quote) * taker_fee_bps/10000, round_half_up to quote decimals" }
      - { name: executed_at, type: datetime, source: system, description: "Current clock at execution; bounds the trailing-30-day volume window" }

  - name: CostBasisLot
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: asset, type: string, source: system, description: "FK -> AssetConfig.symbol; the acquired asset" }
      - { name: origin_type, type: enum, source: system, description: "DEPOSIT | TRADE_BUY | STAKING_REWARD — how the lot was acquired" }
      - { name: origin_id, type: string, source: system, description: "Id of the Deposit, Trade, or StakingPosition that created the lot" }
      - { name: acquired_at, type: datetime, source: system, description: "Clock at acquisition; FIFO orders lots by this ASC then created_at ASC" }
      - { name: original_quantity, type: number, source: system, description: "Units acquired in this lot" }
      - { name: remaining_quantity, type: number, source: computed, description: "Units of this lot not yet disposed; decremented as sells consume the lot" }
      - { name: unit_cost_usd, type: number, source: system, description: "USD cost per unit; HIFO orders lots by this DESC then acquired_at ASC" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | DEPLETED — DEPLETED when remaining_quantity reaches 0" }

  - name: StakingPosition
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; owning account" }
      - { name: asset, type: string, source: input, description: "FK -> AssetConfig.symbol; staked asset" }
      - { name: principal_amount, type: number, source: input, description: "Units staked; moved from available to held at stake time" }
      - { name: apr_bps, type: number, source: input, description: "Annual percentage rate in basis points used to accrue rewards" }
      - { name: accrued_rewards, type: number, source: computed, default: 0, description: "Reward units accrued and not yet claimed (see §1.3 staking_reward_accrual)" }
      - { name: last_accrual_at, type: datetime, source: system, description: "Clock of the most recent accrual; reward window runs from here to current clock" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | UNBONDING | CLOSED — UNBONDING locks principal for a cooldown before release" }
      - { name: unbond_started_at, type: datetime, source: system, required: false, description: "Clock at which UNBONDING began; left endpoint of the closed cooldown interval [unbond_started_at, unbond_available_at]" }
      - { name: unbond_available_at, type: datetime, source: system, required: false, description: "When UNBONDING, the instant principal may be released (set to clock + 7d at unbond); right endpoint of the closed cooldown interval" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Account: KYC tier branching + freeze ---------------------------------
  - entity: Account
    initial_state: UNVERIFIED            # kyc_status axis (parallel to account_status axis)
    terminal_states: []                  # neither axis terminates in scope: kyc_status cycles (REJECTED->PENDING), account_status toggles (ACTIVE<->FROZEN)
    transitions:
      - from: UNVERIFIED
        to: PENDING
        trigger: "POST /accounts/{id}/kyc-applications"
        actor: Trader
        preconditions:
          - "account.kyc_status IN {UNVERIFIED, REJECTED, APPROVED}"
          - "account.account_status == ACTIVE"
          - "requested_tier is exactly one tier above account.kyc_tier (no skipping)"
        side_effects:
          - "set account.kyc_status = PENDING"
          - "set account.pending_tier = requested_tier"
        note: "kyc_tier itself does not change until an Operator approves."
      - from: PENDING
        to: APPROVED
        trigger: "POST /accounts/{id}/kyc-decisions {decision: APPROVE}"
        actor: Operator
        preconditions:
          - "account.kyc_status == PENDING"
        side_effects:
          - "set account.kyc_tier = account.pending_tier"
          - "set account.kyc_status = APPROVED"
          - "set account.pending_tier = null"
      - from: PENDING
        to: REJECTED
        trigger: "POST /accounts/{id}/kyc-decisions {decision: REJECT}"
        actor: Operator
        preconditions:
          - "account.kyc_status == PENDING"
        side_effects:
          - "set account.kyc_status = REJECTED (kyc_tier unchanged)"
          - "set account.pending_tier = null"
        note: "Cyclic: a REJECTED account may re-apply (REJECTED -> PENDING), forming a review loop."
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /accounts/{id}/freeze"
        actor: Operator
        preconditions:
          - "account.account_status == ACTIVE"
        side_effects:
          - "set account.account_status = FROZEN"
          - "cancel all OPEN/PARTIALLY_FILLED orders for this account, releasing each order's reserved_remaining back to available (cascade — see Order CANCELLED)"
        note: "account_status is an independent axis from kyc_status (parallel dimensions)."
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /accounts/{id}/unfreeze"
        actor: Operator
        preconditions:
          - "account.account_status == FROZEN"
        side_effects:
          - "set account.account_status = ACTIVE"

  # --- Deposit: network-confirmation hold (linear) --------------------------
  - entity: Deposit
    initial_state: DETECTED
    terminal_states: [CREDITED, ORPHANED]
    transitions:
      - from: DETECTED
        to: CONFIRMING
        trigger: "POST /deposits/{id}/confirmations {delta: N}  (first advance from 0)"
        actor: Operator
        preconditions:
          - "deposit.status == DETECTED"
          - "asset.is_fiat == false"
        side_effects:
          - "increment deposit.confirmations by delta"
          - "credit Balance(account, asset).held_amount by deposit.amount (funds visible but not spendable)"
      - from: CONFIRMING
        to: CONFIRMING
        trigger: "POST /deposits/{id}/confirmations {delta: N}  (still below required)"
        actor: Operator
        preconditions:
          - "deposit.status == CONFIRMING"
          - "deposit.confirmations + delta < asset.required_confirmations"
        side_effects:
          - "increment deposit.confirmations by delta"
      - from: CONFIRMING
        to: CREDITED
        trigger: "POST /deposits/{id}/confirmations {delta: N}  (reaches required)"
        actor: Operator
        preconditions:
          - "deposit.status == CONFIRMING"
          - "deposit.confirmations + delta >= asset.required_confirmations"
        side_effects:
          - "set deposit.confirmations = deposit.confirmations + delta"
          - "move deposit.amount from Balance.held_amount to Balance.available_amount"
          - "create CostBasisLot(account, asset, origin_type=DEPOSIT, origin_id=deposit.id, original_quantity=amount, remaining_quantity=amount, unit_cost_usd=deposit.unit_cost_usd, acquired_at=clock) — CASCADE link 1"
      - from: DETECTED
        to: CREDITED
        trigger: "POST /deposits/{id}/confirmations {delta: N}  (fiat instant-credit)"
        actor: Operator
        preconditions:
          - "deposit.status == DETECTED"
          - "asset.is_fiat == true"
        side_effects:
          - "credit Balance(account, asset).available_amount by deposit.amount"
          - "create CostBasisLot(... unit_cost_usd=deposit.unit_cost_usd ...)"
      - from: DETECTED
        to: ORPHANED
        trigger: "POST /deposits/{id}/orphan"
        actor: Operator
        preconditions:
          - "deposit.status == DETECTED"
        side_effects:
          - "no balance change (nothing was credited yet)"

  # --- WithdrawalAddress: whitelist security hold (linear) ------------------
  - entity: WithdrawalAddress
    initial_state: PENDING_HOLD
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING_HOLD
        to: ACTIVE
        trigger: "POST /withdrawal-addresses/{id}/activate"
        actor: Trader
        preconditions:
          - "address.status == PENDING_HOLD"
          - "current clock >= address.activates_at (24h security hold elapsed)"
        side_effects:
          - "set address.status = ACTIVE"
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /withdrawal-addresses/{id}"
        actor: Trader
        preconditions:
          - "address.status IN {ACTIVE, PENDING_HOLD}"
          - "no Withdrawal targeting this address is in {SUBMITTED, SCREENING, TRAVEL_RULE_HOLD, APPROVED, BROADCAST}"
        side_effects:
          - "set address.status = REMOVED"
      - from: PENDING_HOLD
        to: REMOVED
        trigger: "DELETE /withdrawal-addresses/{id}"
        actor: Trader
        preconditions:
          - "address.status == PENDING_HOLD"
        side_effects:
          - "set address.status = REMOVED"

  # --- Withdrawal: cyclic screening + travel-rule hold ----------------------
  - entity: Withdrawal
    initial_state: SUBMITTED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /withdrawals/{id}/screen"
        actor: ComplianceOfficer
        preconditions:
          - "withdrawal.status == SUBMITTED"
        side_effects:
          - "set withdrawal.status = SCREENING"
      - from: SCREENING
        to: TRAVEL_RULE_HOLD
        trigger: "POST /withdrawals/{id}/screen-result {result: HOLD}"
        actor: ComplianceOfficer
        preconditions:
          - "withdrawal.status == SCREENING"
          - "withdrawal.requires_travel_rule == true"
        side_effects:
          - "set withdrawal.status = TRAVEL_RULE_HOLD"
        note: "Funds remain in held_amount throughout; no balance movement here."
      - from: TRAVEL_RULE_HOLD
        to: APPROVED
        trigger: "POST /withdrawals/{id}/travel-rule-records  (files TravelRuleRecord)"
        actor: ComplianceOfficer
        preconditions:
          - "withdrawal.status == TRAVEL_RULE_HOLD"
          - "filing ComplianceOfficer X-User-ID != the X-User-ID that screened this withdrawal (segregation of duties)"
        side_effects:
          - "create TravelRuleRecord(withdrawal_id, status=FILED, filed_by_user_id=X-User-ID)"
          - "set withdrawal.status = APPROVED"
      - from: SCREENING
        to: APPROVED
        trigger: "POST /withdrawals/{id}/screen-result {result: CLEAR}"
        actor: ComplianceOfficer
        preconditions:
          - "withdrawal.status == SCREENING"
          - "withdrawal.requires_travel_rule == false"
        side_effects:
          - "set withdrawal.status = APPROVED"
      - from: APPROVED
        to: BROADCAST
        trigger: "POST /withdrawals/{id}/broadcast"
        actor: Operator
        preconditions:
          - "withdrawal.status == APPROVED"
        side_effects:
          - "set withdrawal.status = BROADCAST"
          - "debit Balance(account, asset).held_amount by (withdrawal.amount + asset.network_fee); debit total_amount by the same (funds leave the exchange) — CASCADE link 1 of withdrawal_settlement"
          - "create CostBasisLot disposal: consume lots for (account, asset) by cost_basis_method for quantity=withdrawal.amount, decrementing remaining_quantity and flipping depleted lots to DEPLETED — CASCADE link 2"
      - from: BROADCAST
        to: COMPLETED
        trigger: "POST /withdrawals/{id}/confirm-onchain"
        actor: Operator
        preconditions:
          - "withdrawal.status == BROADCAST"
        side_effects:
          - "no further balance change; record is now terminal"
      - from: SCREENING
        to: REJECTED
        trigger: "POST /withdrawals/{id}/screen-result {result: REJECT}"
        actor: ComplianceOfficer
        preconditions:
          - "withdrawal.status IN {SCREENING, TRAVEL_RULE_HOLD}"
        side_effects:
          - "set withdrawal.status = REJECTED"
          - "release the held funds: move (withdrawal.amount + asset.network_fee) from Balance.held_amount back to Balance.available_amount — COMPENSATION restoring available"
        note: "Cyclic re-entry: a REJECTED withdrawal may be resubmitted via POST /withdrawals with replaces_withdrawal_id, producing a fresh SUBMITTED withdrawal."

  # --- Order: parallel fill axis + matching cascade -------------------------
  - entity: Order
    initial_state: OPEN
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "system: matching engine fills part of the order on POST /orders"
        actor: system
        preconditions:
          - "order.lifecycle_status == OPEN"
          - "a resting opposite-side LIMIT order crosses (BUY taker.limit_price >= maker.limit_price, or SELL taker.limit_price <= maker.limit_price; MARKET crosses any)"
          - "fill is partial (filled_quantity < quantity after matching round)"
        side_effects:
          - "append Trade(maker_order_id, taker_order_id, price=maker.limit_price, quantity=min_remaining) — CASCADE root"
          - "increment both orders' filled_quantity; recompute avg_fill_price; decrement reserved_remaining"
          - "settle Balances on both accounts: base moves seller->buyer, quote moves buyer->seller (less fees) — CASCADE link 2"
          - "debit maker_fee/taker_fee in quote asset from each side's available — CASCADE link 3"
          - "create CostBasisLot(origin_type=TRADE_BUY) for each buyer's acquired base; consume lots for each seller's disposed base by cost_basis_method — CASCADE link 4"
          - "recompute taker_volume_30d_usd and fee_tier on both accounts — CASCADE link 5"
      - from: OPEN
        to: FILLED
        trigger: "system: matching engine fully fills on POST /orders"
        actor: system
        preconditions:
          - "order.lifecycle_status == OPEN"
          - "filled_quantity == quantity after matching round"
        side_effects:
          - "same Trade/Balance/fee/lot/volume cascade as PARTIALLY_FILLED, then set reserved_remaining = 0"
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "system: a later incoming order completes this resting order"
        actor: system
        preconditions:
          - "order.lifecycle_status == PARTIALLY_FILLED"
          - "remaining quantity fully matched"
        side_effects:
          - "same execution cascade; set reserved_remaining = 0"
      - from: OPEN
        to: CANCELLED
        trigger: "DELETE /orders/{id}  (also IOC auto-cancel of unfilled remainder, and Account FROZEN cascade)"
        actor: Trader
        preconditions:
          - "order.lifecycle_status IN {OPEN, PARTIALLY_FILLED}"
        side_effects:
          - "set lifecycle_status = CANCELLED"
          - "release reserved_remaining back to Balance.available (BUY: quote; SELL: base); set reserved_remaining = 0 — COMPENSATION restoring reserve"
      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "DELETE /orders/{id}"
        actor: Trader
        preconditions:
          - "order.lifecycle_status == PARTIALLY_FILLED"
        side_effects:
          - "release reserved_remaining back to available; set reserved_remaining = 0"

  # --- StakingPosition: stake / accrue / unbond / claim ---------------------
  - entity: StakingPosition
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /staking-positions/{id}/claim"
        actor: Trader
        preconditions:
          - "position.status == ACTIVE"
          - "position.accrued_rewards > 0 after accrual (boundary: exactly 0 is rejected)"
        side_effects:
          - "accrue rewards up to current clock (see §1.3 staking_reward_accrual)"
          - "credit Balance(account, asset).available_amount by accrued_rewards"
          - "create CostBasisLot(origin_type=STAKING_REWARD, unit_cost_usd = asset.spot_price_usd at claim, quantity=accrued_rewards)"
          - "set accrued_rewards = 0; set last_accrual_at = clock"
      - from: ACTIVE
        to: UNBONDING
        trigger: "POST /staking-positions/{id}/unbond"
        actor: Trader
        preconditions:
          - "position.status == ACTIVE"
        side_effects:
          - "accrue rewards up to current clock and credit them as in claim"
          - "set status = UNBONDING; set unbond_started_at = clock; set unbond_available_at = clock + 7d (principal stays in held_amount)"
      - from: UNBONDING
        to: CLOSED
        trigger: "POST /staking-positions/{id}/release"
        actor: Trader
        preconditions:
          - "position.status == UNBONDING"
          - "current clock >= position.unbond_available_at"
        side_effects:
          - "move principal_amount from Balance.held_amount to Balance.available_amount"
          - "set status = CLOSED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent .version — true races only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: order-place-stale-account
    parent_entity: Account
    write_endpoint: "POST /orders"
    occ_field: "expected_account_version"
    description: |
      Placing an Order against an Account whose version has advanced since the
      client last observed it is rejected on a stale version. This captures the
      case where another write has already debited/reserved the account's
      balances (e.g. a prior order placement or a fill cascade bumped
      Account.version) so the client's view of spendable balance is stale; the
      placement would otherwise legitimately succeed against the stale view.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: address-add-stale-account
    parent_entity: Account
    write_endpoint: "POST /withdrawal-addresses"
    occ_field: "expected_account_version"
    description: |
      Adding a WithdrawalAddress to an Account whose version has advanced since
      the client last read it is rejected on a stale version. Another writer may
      have just added a different address or changed account state, advancing
      Account.version; the add would otherwise legitimately create a second
      whitelist entry against the client's stale account view.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- Order-book matching selector (price-time priority, pinned) ------------
  - name: order_book_match_selection
    trigger: "On POST /orders, after reserve, to choose which resting order(s) the incoming order fills"
    algorithm: chronological
    formula: |
      # Candidate set: OPEN or PARTIALLY_FILLED resting orders on the same
      # (base_asset, quote_asset) pair, opposite side, that CROSS the incoming order.
      # CROSS predicate:
      #   incoming BUY  vs resting SELL: cross iff incoming is MARKET OR incoming.limit_price >= resting.limit_price
      #   incoming SELL vs resting BUY : cross iff incoming is MARKET OR incoming.limit_price <= resting.limit_price
      # RANKING (price-time priority), strict, deterministic:
      #   for incoming BUY  : best resting SELL = lowest limit_price first
      #   for incoming SELL : best resting BUY  = highest limit_price first
      #   TIE-BREAK when prices equal: oldest resting order first by created_at ASC
      #   (created_at, never id, is the only permitted final tie-break)
      # Walk candidates in ranked order, filling min(incoming_remaining, resting_remaining)
      # at each resting order's limit_price (price = resting.limit_price), appending a Trade
      # per fill, until incoming_remaining == 0 or no further candidate crosses.
      # For IOC: any incoming_remaining after the walk is cancelled (no resting).
      # For GTC LIMIT with leftover: the incoming order itself rests on the book OPEN/PARTIALLY_FILLED.
      execution_price = resting.limit_price   # taker always executes at the maker's posted price
    input_set: "OPEN/PARTIALLY_FILLED resting orders, opposite side, same (base,quote) pair, that cross the incoming order"
    constants: {}
    precision: "fill quantity to base AssetConfig.decimals round_half_up; price carried exactly from resting.limit_price"

  # --- DUAL-VARIANT #1 (Account-domain disposal cost basis) -----------------
  - name: realized_gain_on_disposal
    trigger: "On any base-asset disposal: Order SELL fill (Trade execution) and Withdrawal BROADCAST debit"
    algorithm: chronological
    formula: |
      # Dispose `qty` units of `asset` for `account`, given proceeds_usd.
      # Select OPEN lots (remaining_quantity > 0) for (account, asset).
      if account.cost_basis_method == FIFO:
          order lots by acquired_at ASC, then created_at ASC      # oldest first
      elif account.cost_basis_method == HIFO:
          order lots by unit_cost_usd DESC, then acquired_at ASC   # most expensive first
      remaining = qty
      cost_consumed_usd = 0
      for lot in ordered_lots:
          take = min(lot.remaining_quantity, remaining)
          cost_consumed_usd += take * lot.unit_cost_usd
          lot.remaining_quantity -= take
          if lot.remaining_quantity == 0: lot.status = DEPLETED
          remaining -= take
          if remaining == 0: break
      realized_gain_usd = proceeds_usd - cost_consumed_usd
    input_set: "CostBasisLot rows for (account_id, asset) with status == OPEN and remaining_quantity > 0; DEPLETED lots excluded"
    constants: {}
    precision: "USD amounts to 2 decimals round_half_up; asset quantities to AssetConfig.decimals round_half_up"
    variants:
      - name: fifo
        when: "account.cost_basis_method == FIFO"
        difference: "Consumes oldest lots first (acquired_at ASC); on rising prices yields LOWER cost_consumed_usd and HIGHER realized gain than HIFO for identical disposals."
      - name: hifo
        when: "account.cost_basis_method == HIFO"
        difference: "Consumes highest-cost lots first (unit_cost_usd DESC); yields HIGHER cost_consumed_usd and LOWER realized gain than FIFO for identical disposals — the 1099-DA divergence."

  # --- DUAL-VARIANT #2 (Order-domain fee — maker vs taker) ------------------
  - name: trade_fee
    trigger: "On each Trade appended by the matching engine (Order fill)"
    algorithm: tiered_pricing
    formula: |
      notional_quote = trade.quantity * trade.price        # in quote-asset units
      # Resting (maker) side and aggressing (taker) side pay from the SAME notional
      # but at different bps drawn from each account's OWN fee tier:
      maker_acct_tier = fee_tier(maker_account.taker_volume_30d_usd)   # selected from FeeSchedule
      taker_acct_tier = fee_tier(taker_account.taker_volume_30d_usd)
      maker_fee = round_half_up(notional_quote * FeeSchedule[maker_acct_tier].maker_fee_bps / 10000, quote.decimals)
      taker_fee = round_half_up(notional_quote * FeeSchedule[taker_acct_tier].taker_fee_bps / 10000, quote.decimals)
    input_set: "The single Trade; maker fee uses the resting order's account tier, taker fee uses the incoming order's account tier"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "Fees in quote-asset units rounded to quote AssetConfig.decimals, round_half_up"
    variants:
      - name: maker_side
        when: "account is the resting LIMIT order (maker_order_id)"
        difference: "Charged maker_fee_bps (lower); rebate-like. Same notional, DIFFERENT result from taker side."
      - name: taker_side
        when: "account is the aggressing incoming order (taker_order_id)"
        difference: "Charged taker_fee_bps (higher) from the identical notional — same inputs, different output than maker variant."

  # --- COMBINATORIAL (a): nested min/max + tier selection -------------------
  - name: order_reserve_amount
    trigger: "On POST /orders before matching, to lock funds for the order"
    algorithm: threshold
    formula: |
      # Reserve the WORST-CASE funds the unfilled remainder could consume.
      if side == SELL:
          reserve_asset = base_asset
          reserve_qty   = quantity                                # base units to deliver
      else:  # BUY
          reserve_asset = quote_asset
          if order_type == LIMIT:
              # reserve at the limit price plus the worst-case taker fee
              gross = quantity * limit_price
              reserve_qty = gross * (1 + max_taker_fee_bps/10000)
          else:  # MARKET BUY
              # reserve against the best (lowest) resting ask * a slippage ceiling
              best_ask = min(limit_price of OPEN resting SELL orders on the book) or REJECT if book empty
              reserve_qty = quantity * best_ask * (1 + MARKET_SLIPPAGE_CEILING) * (1 + max_taker_fee_bps/10000)
      require Balance(account, reserve_asset).available_amount >= reserve_qty   # else ERR_INSUFFICIENT_AVAILABLE
    input_set: "The new order; for MARKET BUY, the set of OPEN/PARTIALLY_FILLED resting SELL orders for (base,quote)"
    constants:
      MARKET_SLIPPAGE_CEILING: 0.05      # 5% headroom over best ask for MARKET BUY
      max_taker_fee_bps: 30              # worst-case taker bps used for reserve headroom (= TIER_BASE taker bps)
    precision: "reserve_qty to reserve_asset AssetConfig.decimals, round_half_up (round UP residual is conservative)"

  # --- COMBINATORIAL (b): nested rounding order pinned ----------------------
  - name: account_30d_taker_volume
    trigger: "Recomputed on each Trade and read on POST /orders fee-tier selection"
    algorithm: aggregation
    formula: |
      window_start = current_clock - 30 days        # half-open (window_start, current_clock]
      # ROUNDING ORDER IS PINNED: round EACH trade's notional to 2 USD decimals
      # FIRST, then SUM the rounded per-trade notionals. (round-then-sum, NOT
      # sum-then-round — the two orders differ by sub-cent dust across many trades.)
      taker_volume_30d_usd = sum(
          round_half_up(t.quantity * t.price * quote_asset.spot_price_usd, 2)
          for t in Trade
          where t.taker_order_id.account_id == account.id
            and t.executed_at > window_start and t.executed_at <= current_clock
      )
    input_set: "Trades where this account was the taker side and executed_at in the trailing 30d half-open window (window_start exclusive, current_clock inclusive)"
    constants:
      WINDOW_DAYS: 30
    precision: "round_half_up to 2 USD decimals PER TRADE, then sum (round-then-sum order pinned)"

  # --- Staking accrual (decay-free linear accrual; reset on claim) ----------
  - name: staking_reward_accrual
    trigger: "On POST /staking-positions/{id}/claim, /unbond (accrue up to clock before action)"
    algorithm: aggregation
    formula: |
      elapsed_seconds = current_clock - position.last_accrual_at      # >= 0
      year_seconds = 365 * 24 * 3600
      delta_rewards = position.principal_amount * (position.apr_bps/10000) * (elapsed_seconds / year_seconds)
      accrued_rewards = position.accrued_rewards + round_half_up(delta_rewards, asset.decimals)
    input_set: "The single StakingPosition; window from last_accrual_at (exclusive of prior accrual) to current_clock"
    constants:
      YEAR_SECONDS: 31536000
      BPS_DENOMINATOR: 10000
    precision: "delta_rewards rounded to asset AssetConfig.decimals round_half_up, then added to running accrued_rewards"

  # --- Daily withdrawal ceiling by KYC tier (threshold) ---------------------
  - name: daily_withdrawal_usd_used
    trigger: "On POST /withdrawals, to enforce the per-tier daily USD ceiling"
    algorithm: aggregation
    formula: |
      day_start = current_clock truncated to 00:00:00 UTC of the current calendar day
      used_usd = sum(
          w.notional_usd
          for w in Withdrawal
          where w.account_id == account.id
            and w.status IN {SUBMITTED, SCREENING, TRAVEL_RULE_HOLD, APPROVED, BROADCAST, COMPLETED}
            and w.created_at >= day_start
      )
      ceiling = KYC_TIER_DAILY_CEILING_USD[account.kyc_tier]
      require used_usd + new_withdrawal.notional_usd <= ceiling     # else ERR_DAILY_LIMIT_EXCEEDED
    input_set: "Non-REJECTED withdrawals created on/after today's UTC midnight for this account"
    constants:
      KYC_TIER_DAILY_CEILING_USD: { TIER_0: 0, TIER_1: 1000, TIER_2: 50000, TIER_3: 1000000 }
    precision: "USD to 2 decimals round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /accounts" }
  - { priority: 2, category: auth, check: "Role is permitted for the endpoint per §1.7 RBAC", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "For Trader acting on own resource, X-User-ID == resource.account_id (ownership)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "Trader-owned writes: orders, withdrawals, withdrawal-addresses, staking, kyc-applications" }
  - { priority: 4, category: existence, check: "All path/body referenced resources exist (validated left-to-right): account, asset, order, withdrawal-address, deposit, withdrawal, staking-position", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all with path/body ids" }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition is defined (§1.2 from-state)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6, category: state, check: "Account.account_status == ACTIVE for any trading or withdrawal write", error_id: ERR_ACCOUNT_FROZEN, http_status: 409, applies_to: "POST /orders, POST /withdrawals, POST /staking-positions" }
  - { priority: 7, category: business_safety, check: "Withdrawal target WithdrawalAddress.status == ACTIVE and current clock >= activates_at (whitelist security hold elapsed)", error_id: ERR_ADDRESS_NOT_ACTIVE, http_status: 409, applies_to: "POST /withdrawals" }
  - { priority: 7.5, category: business_temporal, check: "Whitelist hold-window overlap (HALF-OPEN [created_at, activates_at)): adding a WithdrawalAddress with the same (account_id, asset, chain_address) is rejected while an existing non-REMOVED row for that triple is still inside its 24h hold window — i.e. current_clock is contained in [existing.created_at, existing.activates_at). Once current_clock >= existing.activates_at the window no longer overlaps and the add is allowed.", error_id: ERR_ADDRESS_HOLD_OVERLAP, http_status: 409, applies_to: "POST /withdrawal-addresses" }
  - { priority: 7.6, category: business_temporal, check: "Staking cooldown-window overlap (CLOSED [unbond_started_at, unbond_available_at], inclusive both endpoints, with a same-asset aggregate-capacity rule): POST /staking-positions for (account_id, asset) is rejected when an existing UNBONDING position on the same (account_id, asset) has a cooldown interval whose closed span contains current_clock — current_clock in [unbond_started_at, unbond_available_at] inclusive. Differs from the half-open address rule: endpoints are inclusive, so a stake at exactly unbond_available_at still collides.", error_id: ERR_STAKE_COOLDOWN_OVERLAP, http_status: 409, applies_to: "POST /staking-positions" }
  - { priority: 8, category: business_safety, check: "Filing ComplianceOfficer X-User-ID differs from the officer who screened the withdrawal (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /withdrawals/{id}/travel-rule-records" }
  - { priority: 9, category: business_safety, check: "A withdrawal with requires_travel_rule == true cannot be APPROVED via CLEAR; it must route through TRAVEL_RULE_HOLD and a filed TravelRuleRecord", error_id: ERR_TRAVEL_RULE_REQUIRED, http_status: 409, applies_to: "POST /withdrawals/{id}/screen-result" }
  - { priority: 10, category: business_constraint, check: "KYC tier upgrade requests exactly one tier above current kyc_tier (no skipping) and account is not already PENDING", error_id: ERR_INVALID_TIER_PROGRESSION, http_status: 422, applies_to: "POST /accounts/{id}/kyc-applications" }
  - { priority: 11, category: business_constraint, check: "Order kyc gate: trading requires kyc_tier >= TIER_1; LIMIT requires limit_price present and > 0; MARKET forbids limit_price; quantity > 0", error_id: ERR_KYC_TIER_INSUFFICIENT, http_status: 403, applies_to: "POST /orders" }
  - { priority: 12, category: business_constraint, check: "Order asset pair valid: base_asset != quote_asset, both exist, neither is the other; amounts within AssetConfig.decimals precision", error_id: ERR_INVALID_ORDER, http_status: 422, applies_to: "POST /orders" }
  - { priority: 13, category: business_temporal, check: "MARKET BUY requires a non-empty resting SELL book; IOC remainder cancels rather than rests", error_id: ERR_NO_LIQUIDITY, http_status: 409, applies_to: "POST /orders" }
  - { priority: 14, category: business_constraint, check: "Withdrawal amount >= AssetConfig.min_withdrawal_amount", error_id: ERR_BELOW_MIN_WITHDRAWAL, http_status: 422, applies_to: "POST /withdrawals" }
  - { priority: 15, category: business_referential, check: "Withdrawal asset matches the target address asset; resubmit replaces_withdrawal_id (if present) is a REJECTED withdrawal of the same account+address", error_id: ERR_RESUBMIT_TARGET_INVALID, http_status: 409, applies_to: "POST /withdrawals" }
  - { priority: 16, category: business_fiscal, check: "Per-tier daily withdrawal USD ceiling not exceeded by this withdrawal (calc daily_withdrawal_usd_used)", error_id: ERR_DAILY_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /withdrawals" }
  - { priority: 17, category: business_fiscal, check: "Sufficient available_amount to reserve order funds (calc order_reserve_amount) / cover withdrawal amount + network_fee / stake principal", error_id: ERR_INSUFFICIENT_AVAILABLE, http_status: 402, applies_to: "POST /orders, POST /withdrawals, POST /staking-positions" }
  - { priority: 18, category: business_constraint, check: "OCC: expected_account_version (orders, withdrawal-addresses) / expected_order_version (order amend) matches the parent's current version", error_id: ERR_STALE_ACCOUNT_VERSION, http_status: 412, applies_to: "POST /orders, POST /withdrawal-addresses, PATCH /orders/{id}" }
  - { priority: 19, category: business_constraint, check: "Staking claim requires accrued_rewards > 0 after accrual (boundary: exactly 0 rejected); release requires clock >= unbond_available_at", error_id: ERR_NOTHING_TO_CLAIM, http_status: 409, applies_to: "POST /staking-positions/{id}/claim, POST /staking-positions/{id}/release" }
  - { priority: 20, category: business_constraint, check: "Request body well-formed: required fields present, enums valid, numbers non-negative where applicable", error_id: ERR_INVALID_REQUEST, http_status: 422, applies_to: "all writes" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Account / KYC --------------------------------------------------------
  - { method: POST, path: "/accounts", description: "Register a new account (public)", roles: [Anonymous], code: 201, input: [email, full_name, residence_country, "cost_basis_method?"], output: Account, side_effects: ["kyc_tier=TIER_0, kyc_status=UNVERIFIED, account_status=ACTIVE, version=1"] }
  - { method: GET, path: "/accounts/{id}", description: "Fetch account with computed volumes and fee_tier", roles: [Trader, Operator, ComplianceOfficer], code: 200, input: [], output: Account, side_effects: [] }
  - { method: GET, path: "/accounts", description: "List accounts (paginated)", roles: [Operator, ComplianceOfficer], code: 200, input: ["residence_country?", "kyc_tier?"], output: "Account[]", side_effects: [] }
  - { method: POST, path: "/accounts/{id}/kyc-applications", description: "Apply to upgrade KYC tier", roles: [Trader], code: 201, input: [requested_tier], output: Account, side_effects: ["kyc_status -> PENDING; pending_tier set"] }
  - { method: POST, path: "/accounts/{id}/kyc-decisions", description: "Operator approves/rejects pending KYC application", roles: [Operator], code: 200, input: [decision], output: Account, side_effects: ["APPROVE: kyc_tier=pending_tier, kyc_status=APPROVED; REJECT: kyc_status=REJECTED"] }
  - { method: POST, path: "/accounts/{id}/freeze", description: "Freeze account; cancel open orders", roles: [Operator], code: 200, input: [], output: Account, side_effects: ["account_status=FROZEN; cancel OPEN/PARTIALLY_FILLED orders releasing reserves"] }
  - { method: POST, path: "/accounts/{id}/unfreeze", description: "Unfreeze account", roles: [Operator], code: 200, input: [], output: Account, side_effects: ["account_status=ACTIVE"] }

  # --- Asset & Fee config ---------------------------------------------------
  - { method: POST, path: "/assets", description: "Create asset config", roles: [Operator], code: 201, input: [symbol, decimals, required_confirmations, "is_fiat?", min_withdrawal_amount, network_fee, spot_price_usd], output: AssetConfig, side_effects: [] }
  - { method: GET, path: "/assets/{id}", description: "Fetch asset config", roles: [Trader, Operator, ComplianceOfficer], code: 200, input: [], output: AssetConfig, side_effects: [] }
  - { method: PATCH, path: "/assets/{id}", description: "Update mutable spot_price_usd", roles: [Operator], code: 200, input: [spot_price_usd], output: AssetConfig, side_effects: [] }
  - { method: POST, path: "/fee-schedules", description: "Create a fee tier row", roles: [Operator], code: 201, input: [tier_name, min_taker_volume_30d_usd, maker_fee_bps, taker_fee_bps], output: FeeSchedule, side_effects: [] }
  - { method: GET, path: "/fee-schedules", description: "List fee tiers", roles: [Trader, Operator], code: 200, input: [], output: "FeeSchedule[]", side_effects: [] }

  # --- Balances & Cost basis ------------------------------------------------
  - { method: GET, path: "/balances", description: "List balances for an account (FK reverse-reachability for Balance.account_id)", roles: [Trader, Operator], code: 200, input: ["account_id", "asset?"], output: "Balance[]", side_effects: [] }
  - { method: GET, path: "/balances/{id}", description: "Fetch one balance row", roles: [Trader, Operator], code: 200, input: [], output: Balance, side_effects: [] }
  - { method: GET, path: "/cost-basis-lots", description: "List cost-basis lots for an account/asset (FK reverse-reachability for CostBasisLot.account_id)", roles: [Trader, Operator], code: 200, input: ["account_id", "asset?", "status?"], output: "CostBasisLot[]", side_effects: [] }
  - { method: GET, path: "/cost-basis-lots/{id}", description: "Fetch one cost-basis lot", roles: [Trader, Operator], code: 200, input: [], output: CostBasisLot, side_effects: [] }

  # --- Deposits -------------------------------------------------------------
  - { method: POST, path: "/deposits", description: "Record a detected on-chain/fiat deposit (Operator/custody)", roles: [Operator], code: 201, input: [account_id, asset, amount, unit_cost_usd], output: Deposit, side_effects: ["status=DETECTED, confirmations=0"] }
  - { method: GET, path: "/deposits", description: "List deposits (FK reverse-reachability for Deposit.account_id)", roles: [Trader, Operator], code: 200, input: ["account_id?", "asset?", "status?"], output: "Deposit[]", side_effects: [] }
  - { method: GET, path: "/deposits/{id}", description: "Fetch one deposit with confirmation progress", roles: [Trader, Operator], code: 200, input: [], output: Deposit, side_effects: [] }
  - { method: POST, path: "/deposits/{id}/confirmations", description: "Advance network confirmations; credits on reaching required", roles: [Operator], code: 200, input: [delta], output: Deposit, side_effects: ["increment confirmations; held->available + CostBasisLot on CREDITED"] }
  - { method: POST, path: "/deposits/{id}/orphan", description: "Mark a DETECTED deposit orphaned", roles: [Operator], code: 200, input: [], output: Deposit, side_effects: ["status=ORPHANED"] }

  # --- Withdrawal addresses (whitelist) -------------------------------------
  - { method: POST, path: "/withdrawal-addresses", description: "Add a whitelisted address (24h hold). OCC on Account.version", roles: [Trader], code: 201, input: [account_id, asset, chain_address, label, expected_account_version], output: WithdrawalAddress, side_effects: ["status=PENDING_HOLD; activates_at=created_at+24h; increments Account.version by 1"] }
  - { method: GET, path: "/withdrawal-addresses", description: "List whitelist addresses (FK reverse-reachability for WithdrawalAddress.account_id)", roles: [Trader, Operator, ComplianceOfficer], code: 200, input: ["account_id", "asset?", "status?"], output: "WithdrawalAddress[]", side_effects: [] }
  - { method: GET, path: "/withdrawal-addresses/{id}", description: "Fetch one whitelist address", roles: [Trader, Operator, ComplianceOfficer], code: 200, input: [], output: WithdrawalAddress, side_effects: [] }
  - { method: POST, path: "/withdrawal-addresses/{id}/activate", description: "Activate a whitelist address after the 24h hold", roles: [Trader], code: 200, input: [], output: WithdrawalAddress, side_effects: ["status=ACTIVE"] }
  - { method: DELETE, path: "/withdrawal-addresses/{id}", description: "Remove a whitelist address", roles: [Trader], code: 200, input: [], output: WithdrawalAddress, side_effects: ["status=REMOVED"] }

  # --- Withdrawals + travel rule --------------------------------------------
  - { method: POST, path: "/withdrawals", description: "Submit a withdrawal against an ACTIVE whitelisted address", roles: [Trader], code: 201, input: [account_id, withdrawal_address_id, amount, "replaces_withdrawal_id?"], output: Withdrawal, side_effects: ["status=SUBMITTED; compute notional_usd & requires_travel_rule; move amount+network_fee available->held"] }
  - { method: GET, path: "/withdrawals", description: "List withdrawals (FK reverse-reachability for Withdrawal.account_id, withdrawal_address_id, and self-ref replaces_withdrawal_id)", roles: [Trader, Operator, ComplianceOfficer], code: 200, input: ["account_id?", "withdrawal_address_id?", "status?", "replaces_withdrawal_id?"], output: "Withdrawal[]", side_effects: [] }
  - { method: GET, path: "/withdrawals/{id}", description: "Fetch one withdrawal with screening/travel-rule status", roles: [Trader, Operator, ComplianceOfficer], code: 200, input: [], output: Withdrawal, side_effects: [] }
  - { method: POST, path: "/withdrawals/{id}/screen", description: "Compliance begins screening", roles: [ComplianceOfficer], code: 200, input: [], output: Withdrawal, side_effects: ["status=SCREENING; record screening officer id"] }
  - { method: POST, path: "/withdrawals/{id}/screen-result", description: "Compliance resolves screening: CLEAR / HOLD / REJECT", roles: [ComplianceOfficer], code: 200, input: [result], output: Withdrawal, side_effects: ["CLEAR->APPROVED; HOLD->TRAVEL_RULE_HOLD; REJECT->REJECTED releasing held funds"] }
  - { method: POST, path: "/withdrawals/{id}/travel-rule-records", description: "File travel-rule record to release a TRAVEL_RULE_HOLD (segregation of duties)", roles: [ComplianceOfficer], code: 201, input: [originator_name, beneficiary_name, beneficiary_vasp], output: TravelRuleRecord, side_effects: ["create FILED record; withdrawal status=APPROVED"] }
  - { method: GET, path: "/travel-rule-records", description: "List travel-rule records (FK reverse-reachability for TravelRuleRecord.withdrawal_id)", roles: [Operator, ComplianceOfficer], code: 200, input: ["withdrawal_id?"], output: "TravelRuleRecord[]", side_effects: [] }
  - { method: GET, path: "/travel-rule-records/{id}", description: "Fetch one travel-rule record", roles: [Operator, ComplianceOfficer], code: 200, input: [], output: TravelRuleRecord, side_effects: [] }
  - { method: POST, path: "/withdrawals/{id}/broadcast", description: "Operator broadcasts approved withdrawal on-chain (debits held; disposes cost-basis lots)", roles: [Operator], code: 200, input: [], output: Withdrawal, side_effects: ["status=BROADCAST; debit held & total; dispose CostBasisLots by cost_basis_method"] }
  - { method: POST, path: "/withdrawals/{id}/confirm-onchain", description: "Operator marks broadcast withdrawal confirmed", roles: [Operator], code: 200, input: [], output: Withdrawal, side_effects: ["status=COMPLETED"] }

  # --- Orders & trades ------------------------------------------------------
  - { method: POST, path: "/orders", description: "Place a MARKET/LIMIT order; runs reserve + matching cascade. OCC on Account.version", roles: [Trader], code: 201, input: [account_id, base_asset, quote_asset, side, order_type, quantity, "limit_price?", "time_in_force?", expected_account_version], output: Order, side_effects: ["reserve funds; match against book creating Trades; settle Balances; debit fees; create/consume CostBasisLots; recompute 30d volume & fee_tier; increments Account.version by 1"] }
  - { method: GET, path: "/orders/{id}", description: "Fetch order with fill progress", roles: [Trader, Operator], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/orders", description: "List orders (FK reverse-reachability for Order.account_id)", roles: [Trader, Operator], code: 200, input: ["account_id?", "base_asset?", "quote_asset?", "lifecycle_status?", "side?"], output: "Order[]", side_effects: [] }
  - { method: PATCH, path: "/orders/{id}", description: "Amend a resting LIMIT order's limit_price/quantity (re-reserves). OCC on Order.version", roles: [Trader], code: 200, input: ["limit_price?", "quantity?", expected_order_version], output: Order, side_effects: ["recompute reserve; increments Order.version by 1; may re-trigger matching"] }
  - { method: DELETE, path: "/orders/{id}", description: "Cancel an open/partially-filled order; release reserves", roles: [Trader], code: 200, input: [], output: Order, side_effects: ["lifecycle_status=CANCELLED; release reserved_remaining"] }
  - { method: GET, path: "/trades", description: "List trades (FK reverse-reachability for Trade.maker_order_id and Trade.taker_order_id)", roles: [Trader, Operator], code: 200, input: ["maker_order_id?", "taker_order_id?", "base_asset?", "quote_asset?"], output: "Trade[]", side_effects: [] }
  - { method: GET, path: "/trades/{id}", description: "Fetch one trade execution record", roles: [Trader, Operator], code: 200, input: [], output: Trade, side_effects: [] }

  # --- Staking --------------------------------------------------------------
  - { method: POST, path: "/staking-positions", description: "Stake principal (available->held)", roles: [Trader], code: 201, input: [account_id, asset, principal_amount, apr_bps], output: StakingPosition, side_effects: ["status=ACTIVE; move principal available->held; last_accrual_at=clock"] }
  - { method: GET, path: "/staking-positions", description: "List staking positions (FK reverse-reachability for StakingPosition.account_id)", roles: [Trader, Operator], code: 200, input: ["account_id?", "asset?", "status?"], output: "StakingPosition[]", side_effects: [] }
  - { method: GET, path: "/staking-positions/{id}", description: "Fetch one staking position with accrual state", roles: [Trader, Operator], code: 200, input: [], output: StakingPosition, side_effects: [] }
  - { method: POST, path: "/staking-positions/{id}/claim", description: "Accrue & claim rewards to available; create reward lot", roles: [Trader], code: 200, input: [], output: StakingPosition, side_effects: ["accrue; credit available; create STAKING_REWARD CostBasisLot; reset accrued_rewards"] }
  - { method: POST, path: "/staking-positions/{id}/unbond", description: "Begin unbonding (7d cooldown)", roles: [Trader], code: 200, input: [], output: StakingPosition, side_effects: ["accrue & credit rewards; status=UNBONDING; unbond_available_at=clock+7d"] }
  - { method: POST, path: "/staking-positions/{id}/release", description: "Release principal after cooldown (held->available)", roles: [Trader], code: 200, input: [], output: StakingPosition, side_effects: ["move principal held->available; status=CLOSED"] }

  # --- Test-driving clock ---------------------------------------------------
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the system clock (test-driving; advances confirmations holds, 30d windows, accrual, unbond cooldowns)", roles: [Operator], code: 200, input: [to_iso8601], output: null, side_effects: ["sets current_clock used by all time-dependent calcs"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this endpoint per §1.7" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Trader X-User-ID does not match the resource's account_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced account/asset/order/address/deposit/withdrawal/staking-position does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state (§1.2)" }
  - { id: ERR_ACCOUNT_FROZEN, http: 409, condition: "Trading/withdrawal/staking attempted while account_status == FROZEN" }
  - { id: ERR_ADDRESS_NOT_ACTIVE, http: 409, condition: "Withdrawal targets an address not ACTIVE or before its 24h activates_at" }
  - { id: ERR_ADDRESS_HOLD_OVERLAP, http: 409, condition: "Adding a duplicate (account,asset,chain_address) while an existing row's half-open 24h hold window [created_at, activates_at) still contains current_clock" }
  - { id: ERR_STAKE_COOLDOWN_OVERLAP, http: 409, condition: "Staking on (account,asset) while an existing UNBONDING position's closed cooldown interval [unbond_started_at, unbond_available_at] contains current_clock" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "ComplianceOfficer filing the travel-rule record is the same user who screened the withdrawal" }
  - { id: ERR_TRAVEL_RULE_REQUIRED, http: 409, condition: "CLEAR result attempted on a withdrawal whose notional_usd >= TRAVEL_RULE_THRESHOLD_USD" }
  - { id: ERR_INVALID_TIER_PROGRESSION, http: 422, condition: "KYC upgrade skips a tier or requested while already PENDING" }
  - { id: ERR_KYC_TIER_INSUFFICIENT, http: 403, condition: "Trading attempted with kyc_tier below TIER_1" }
  - { id: ERR_INVALID_ORDER, http: 422, condition: "Order pair invalid (base==quote), LIMIT missing price, MARKET carrying price, quantity<=0, or precision violation" }
  - { id: ERR_NO_LIQUIDITY, http: 409, condition: "MARKET BUY against an empty resting SELL book" }
  - { id: ERR_BELOW_MIN_WITHDRAWAL, http: 422, condition: "Withdrawal amount below AssetConfig.min_withdrawal_amount" }
  - { id: ERR_RESUBMIT_TARGET_INVALID, http: 409, condition: "Withdrawal asset mismatch with address, or replaces_withdrawal_id is not a REJECTED withdrawal of same account+address" }
  - { id: ERR_DAILY_LIMIT_EXCEEDED, http: 402, condition: "Withdrawal would exceed the per-tier daily USD ceiling" }
  - { id: ERR_INSUFFICIENT_AVAILABLE, http: 402, condition: "available_amount cannot cover the order reserve / withdrawal amount+fee / stake principal" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version / expected_order_version does not match the parent's current version (OCC)" }
  - { id: ERR_NOTHING_TO_CLAIM, http: 409, condition: "Staking claim with accrued_rewards == 0 after accrual, or release before unbond_available_at" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, negative amount where forbidden" }
  - { id: ERR_VALIDATION, http: 422, condition: "Query/path parameter out of range (e.g. pagination limit > 100 or < 1)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register an account"
    identity: opaque
    exclusive_operations:
      - "POST /accounts (register)"
    shared_operations: []

  - name: Trader
    description: "Account holder; acts only on own account, balances, orders, withdrawals, addresses, staking"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /accounts/{id}/kyc-applications"
      - "POST /withdrawal-addresses, POST /withdrawal-addresses/{id}/activate, DELETE /withdrawal-addresses/{id}"
      - "POST /withdrawals"
      - "POST /orders, PATCH /orders/{id}, DELETE /orders/{id}"
      - "POST /staking-positions, POST /staking-positions/{id}/claim, /unbond, /release"
    shared_operations:
      - "GET /accounts/{id}, GET /assets/{id}, GET /fee-schedules"
      - "GET /balances, GET /cost-basis-lots, GET /deposits, GET /withdrawal-addresses, GET /withdrawals, GET /orders, GET /trades, GET /staking-positions"

  - name: Operator
    description: "Custody/operations; manages assets, deposits, confirmations, KYC decisions, freezes, broadcasts; cannot screen withdrawals"
    identity: opaque
    exclusive_operations:
      - "POST /assets, PATCH /assets/{id}, POST /fee-schedules"
      - "POST /deposits, POST /deposits/{id}/confirmations, POST /deposits/{id}/orphan"
      - "POST /accounts/{id}/kyc-decisions, POST /accounts/{id}/freeze, /unfreeze"
      - "POST /withdrawals/{id}/broadcast, POST /withdrawals/{id}/confirm-onchain"
      - "POST /_clock/set_current_utc"
      - "GET /accounts"
    shared_operations:
      - "GET /accounts/{id}, GET /assets/{id}, GET /fee-schedules, GET /balances, GET /cost-basis-lots, GET /deposits, GET /withdrawal-addresses, GET /withdrawals, GET /orders, GET /trades, GET /staking-positions, GET /travel-rule-records"

  - name: ComplianceOfficer
    description: "AML/travel-rule reviewer; screens withdrawals and files travel-rule records; segregation of duties prevents screening + filing by same user"
    identity: opaque
    exclusive_operations:
      - "POST /withdrawals/{id}/screen, POST /withdrawals/{id}/screen-result"
      - "POST /withdrawals/{id}/travel-rule-records"
    shared_operations:
      - "GET /accounts, GET /accounts/{id}, GET /assets/{id}, GET /withdrawal-addresses, GET /withdrawals, GET /travel-rule-records"

# -----------------------------------------------------------------------------
# Global constants referenced by §1.3 / §1.4
# -----------------------------------------------------------------------------
global_constants:
  TRAVEL_RULE_THRESHOLD_USD: 3000        # withdrawals with notional_usd >= this require travel-rule filing (FinCEN/FATF style)
  WITHDRAWAL_ADDRESS_HOLD_HOURS: 24
  STAKING_UNBOND_COOLDOWN_DAYS: 7
  VOLUME_WINDOW_DAYS: 30
  MARKET_SLIPPAGE_CEILING: 0.05
  KYC_TIER_DAILY_CEILING_USD: { TIER_0: 0, TIER_1: 1000, TIER_2: 50000, TIER_3: 1000000 }
