        grounds: ["errors[ERR_NO_ACCEPTED_RESPONSE]", "errors[ERR_NO_AGREED_SETTLEMENT]", state_machines.Investigation]
        distinguishing_aspect: "Phase advances are gated on sibling state: DISCOVERY->NEGOTIATION needs an accepted response (ERR_NO_ACCEPTED_RESPONSE); NEGOTIATION->SETTLEMENT_PENDING needs a TERMS_AGREED settlement (ERR_NO_AGREED_SETTLEMENT)."
