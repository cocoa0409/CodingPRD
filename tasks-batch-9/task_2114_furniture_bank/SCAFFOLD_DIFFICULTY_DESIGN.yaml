            - "Referral B for the same household has been created and SUBMITTED and is still awaiting review."
            - "Voucher A has already suffered one NO_SHOW on run 1 (strikes 1, chargeback 1125) and is booked again as the only stop on run 2, which is DISPATCHED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
