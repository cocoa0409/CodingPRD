      - name: reviewer_qualification_missing_rejected
        claim_type: conditional_validation
        grounds: ['validations[priority=6.1]', 'errors[ERR_QUALIFICATION_MISSING]']
        distinguishing_aspect: "Reviewer lacking the MOC's discipline (MECHANICAL vs CHEMICAL) fails priority 6.1 before SoD."
