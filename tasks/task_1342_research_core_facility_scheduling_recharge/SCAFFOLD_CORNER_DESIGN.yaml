            - { call: "PUT /rate-sets/${rs27}", payload: { expected_rate_set_version: "${rsv}", effective_from: "2027-02-01T00:00:00Z" }, as: FacilityAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "First edit: version == 2, effective_from == 2027-01-15T00:00:00Z"
            - "Second edit with stale version: error_id == ERR_STALE_VERSION with HTTP 412; effective_from stays 2027-01-15"

