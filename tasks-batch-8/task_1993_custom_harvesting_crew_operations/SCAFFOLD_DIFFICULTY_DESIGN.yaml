              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop_id}/start-cutting"
              payload: {}
              as: CrewBoss
          trigger:
            - call: "POST /harvest/machines/${machine_id}/report-breakdown"
              payload: {}
              as: CrewBoss
          assert:
            - "Machine.${machine_id}.status == DOWN"
            - "RouteStop.${stop_id}.status == PAUSED_WEATHER (re-read)"

  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_business_temporal_on_depart
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair (state, business_temporal): when a stop is NOT in SCHEDULED
          AND an earlier-indexed stop is also still active, the priority-4
          state error ERR_STOP_NOT_SCHEDULED wins over the priority-6
          business_temporal ERR_OUT_OF_SEQUENCE.
        test_recipe:
          setup:
            - "Season ACTIVE, two stops stop1 (seq 1) and stop2 (seq 2)"
            - "Stop1 driven to EN_ROUTE (so it is 'still active')"
            - "Stop2 also already EN_ROUTE (so it is not SCHEDULED); we attempt depart on stop2 again"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { m1_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C2", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { m2_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 200 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop1_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop1_id}", machine_id: "${m1_id}", assigned_start_date: "2026-08-05", assigned_end_date: "2026-08-07" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/depart"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/start-cutting"
              payload: {}
              as: CrewBoss
            - call: "PATCH /harvest/route-stops/${stop1_id}"
              payload: { actual_acres: 100 }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop1_id}/complete"
              payload: {}
              as: CrewBoss
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-10", planned_end_date: "2026-08-11", planned_acres: 100, sequence_index: 2 }
              as: GrowerLiaison
              captures: { stop2_id: $.data.id }
            - call: "POST /harvest/machine-assignments"
              payload: { route_stop_id: "${stop2_id}", machine_id: "${m2_id}", assigned_start_date: "2026-08-10", assigned_end_date: "2026-08-12" }
              as: CrewBoss
            - call: "POST /harvest/route-stops/${stop2_id}/depart"
              payload: {}
              as: CrewBoss
          trigger:
            - call: "POST /harvest/route-stops/${stop2_id}/depart"
              payload: {}
              as: CrewBoss
              captures: { err: $.data.error_id }
          assert:
            - "second depart on stop2 rejected with error_id == ERR_STOP_NOT_SCHEDULED (captured ${err})"
            - "NOT ERR_OUT_OF_SEQUENCE — state priority 4 fires before business_temporal priority 6"

      - name: business_temporal_before_business_constraint_on_complete
        grounds:
          - validations[priority=4]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair (state, business_constraint): when a stop is in SCHEDULED
          (not CUTTING) AND the request would also violate the acres bound
          (actual_acres == 0), priority-4 state error ERR_STOP_NOT_CUTTING
          wins over priority-9 business_constraint ERR_ACRES_OVERRUN.
        test_recipe:
          setup:
            - "Season ACTIVE, stop in SCHEDULED (never departed), actual_acres still 0"
          setup_api_calls:
            - call: "POST /harvest/seasons"
              payload: { season_year: 2026, diesel_baseline_per_gallon_cents: 300, current_diesel_per_gallon_cents: 300 }
              as: HarvestOperator
              captures: { season_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/machines"
              payload: { machine_kind: "COMBINE", label: "C1", daily_capacity_acres: 200 }
              as: HarvestOperator
              captures: { machine_id: $.data.id }
            - call: "POST /harvest/seasons/${season_id}/activate"
              payload: {}
              as: HarvestOperator
            - call: "POST /harvest/seasons/${season_id}/contracts"
              payload: { grower_name: "G", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
              captures: { contract_id: $.data.id }
            - call: "POST /harvest/contracts/${contract_id}/commit"
              payload: {}
              as: GrowerLiaison
            - call: "POST /harvest/contracts/${contract_id}/route-stops"
              payload: { planned_start_date: "2026-08-05", planned_end_date: "2026-08-06", planned_acres: 100, sequence_index: 1 }
              as: GrowerLiaison
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /harvest/route-stops/${stop_id}/complete"
              payload: {}
              as: CrewBoss
              captures: { err: $.data.error_id }
          assert:
            - "complete on SCHEDULED stop rejected with error_id == ERR_STOP_NOT_CUTTING (captured ${err})"
            - "NOT ERR_ACRES_OVERRUN — priority 4 fires before priority 9"

