      - name: listed_area_war_termination_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST /ports/{id}/war-risk-tier
          - state_machines.OpenPolicy.war_cover_status.ATTACHED_to_TERMINATED
          - state_machines.Certificate.war_cover_status.ATTACHED_to_TERMINATED
        distinguishing_aspect: |
          One port re-tier must propagate through four links — port tier, policy
          war axis, certificate war axis with its return premium, and the policy's
          aggregate_return_premium — and stop at certificates not touching the port.
        excluded_because:
          difficulty_instance: "transitive_cascade / listed_area_war_termination_four_link_cascade"
          rationale: |
            The §1.8 instance already asserts every link of that chain end to end,
            including the conditional fifth link that recomputes a SUBMITTED
            declaration, and the negative control that an unexposed certificate
            keeps its war cover. A §1.9 instance would restate the same chain.

      - name: general_average_finalization_release_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST /ga-events/{id}/finalize-adjustment
          - state_machines.GaSecurityPosting.status.POSTED_to_RELEASED
          - state_machines.Vessel.status.GA_HOLD_to_APPROVED
        distinguishing_aspect: |
          Finalizing the adjustment must release every posted security, return the
          policy's deposit ledger to its pre-posting value and let the hull out of
          GA hold at the right overage tier.
        excluded_because:
          difficulty_instance: "transitive_cascade / ga_finalize_adjustment_security_release_cascade"
          rationale: |
            The §1.8 instance already walks all four links of that cascade and
            asserts the restored security_deposit_held_amount, the RELEASED
            postings and the vessel returning to OVERAGE_SURCHARGED with its
            preserved surcharge, so the corner adds nothing.

      - name: declaration_audit_tolerance_threshold_corner
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.declaration_premium_reconciliation
          - state_machines.PremiumDeclaration.status.UNDER_AUDIT_to_ACCEPTED
          - state_machines.OpenPolicy.status.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          The audit outcome forks on variance_pct against
          DECLARATION_AUDIT_TOLERANCE_PCT with a <= comparison, and the suspension
          cascade fires on a second, higher threshold.
        excluded_because:
          difficulty_instance: "boundary_precision_check / declaration_variance_exactly_at_audit_tolerance_is_accepted"
          rationale: |
            The §1.8 instance already sits a declaration exactly on the tolerance
            (accepted, no adjustment), one cent past it (ADJUSTED) and past the
            suspension threshold (policy SUSPENDED), which covers both threshold
            boundaries of this layer.

  - section: consistency_model
    instances:
      - name: issue_response_already_carries_every_derived_field_it_wrote
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /certificates/{id}/issue
          - calculations.certificate_premium_components
          - calculations.transit_termination_instant
        distinguishing_aspect: |
          The consistency model is `immediate`, so the issue response itself — not
          a follow-up read — must already contain the pinned insured_value,
          effective rate, four premium components and both transit instants, and
          an immediate GET of the parent policy must already show the advanced
          ledgers. Every value asserted from the POST body is re-asserted from the
          GET to prove no field is populated only on re-read.
        test_recipe:
          setup:
            - "one DRAFT certificate, CIF 1000000.00 + freight 45000.00 + duty 5000.00 with markup 0.10 -> insured 1155000.00"
            - "war and strikes cover requested; GREEN ports on both ends"
