            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id, d_seq: $.data.sequence } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_e}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "third create (count 2 -> 3) succeeds: assignment ${asg_d} created with sequence == 3"
            - "fourth create at count == 3 rejected: error_id == 'ERR_CASE_FULLY_ASSIGNED' with HTTP 409"
            - "GET /peer-review/cases/${case1}/assignments still lists exactly 3 rows after the rejection"

      - name: response_deadline_inclusive_boundary
        grounds:
          - calculations.notification_response_window
          - errors[ERR_RESPONSE_WINDOW_OPEN]
        distinguishing_aspect: |
          Metric = logical-clock time vs response_deadline; endpoints =
          POST /peer-review/cases/{caseId}/response and
          POST /peer-review/cases/{caseId}/close-no-response. At
          current_clock == response_deadline exactly, response is accepted
          (inclusive end) while close-no-response is rejected — the two
          halves of the same boundary pin the '<=' vs '>' split.
        test_recipe:
          setup:
            - "Case in NOTIFIED; notification sent_at == 2026-08-01T00:00:00Z, response_deadline == 2026-08-15T00:00:00Z; clock set to exactly 2026-08-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Fourteen", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "PATIENT_COMPLAINT", referred_at: "2026-07-20T00:00:00Z", description: "deadline case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: {}, as: CommitteeMember, as_user_id: "${m_a}" }
            - { call: "POST /peer-review/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/close-no-response", as: QualityDirector, captures: { err: $.data.error_id } }
            - { call: "POST /peer-review/cases/${case1}/response", payload: { response_text: "submitted at the deadline instant" }, as: Provider, as_user_id: "${p_sub}", captures: { resp_at: $.data.submitted_at } }
