              payload: { interest_type: "FEE_OWNER", holder_name: "O1", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { o1_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "ACCEPT" }
              as: PropertyOwner
              as_user_id: "${o1_id}"
            - call: "POST /parcels/${parcel_id}/escrows"
              payload: { source: "NEGOTIATED" }
              as: EscrowOfficer
              captures: { escrow_id: $.data.id }
            - call: "POST /escrows/${escrow_id}/fund"
              payload: {}
              as: EscrowOfficer
