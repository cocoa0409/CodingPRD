  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_liability_recompute
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.UsageReport.ACCEPTED_to_AMENDED
        distinguishing_aspect: |
          Error-category pair state (priority 6) vs business_temporal
          (priority 8): an ACCEPTED report whose sibling report already covers
          the same period is re-submitted via the amend cycle with a widened,
          overlapping window — the submit must fail with ERR_USAGE_REPORT_OVERLAP,
          not a state error, while the same call against a DRAFT report whose
          window overlaps must fail with the same temporal error only after
          state passes; the distinguishing falsifiable claim is that a compute
          against a DRAFT report (state violation) co-violating nothing temporal
          yields ERR_INVALID_STATE, proving state outranks temporal when both
          could be argued.
        test_recipe:
          setup:
            - "Licensee L (ACTIVE) under Schedule NS-1"
            - "Report R1 (2026-06-01..2026-06-30) SUBMITTED with one line"
            - "Report R2 (2026-06-15..2026-07-15) in DRAFT with one line (creation allowed; overlap checked at submit)"
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { sched_id: $.data.id }
            - call: "POST /rate-schedules/${sched_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "PrioCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic_id: $.data.id }
            - call: "POST /licensees/${lic_id}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { r1: $.data.id }
            - call: "POST /usage-reports/${r1}/play-lines"
              payload: { isrc: "NM-1", track_title: "t", artist_name: "a", performance_count: 10 }
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports/${r1}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic_id}", period_start: "2026-06-15T00:00:00Z", period_end: "2026-07-15T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /usage-reports/${r2}/play-lines"
              payload: { isrc: "NM-2", track_title: "t2", artist_name: "a2", performance_count: 10 }
              as: Licensee
              as_user_id: "${lic_id}"
          trigger:
            - call: "POST /usage-reports/${r2}/compute-liability"
              payload: { expected_usage_report_version: "${r2_v}" }
              as: RoyaltyOps
              captures: { err_state: $.data.error_id }
            - call: "POST /usage-reports/${r2}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic_id}"
              captures: { err_temporal: $.data.error_id }
          assert:
            - "err_state == ERR_INVALID_STATE (compute on DRAFT report: state category wins at priority 6)"
            - "err_temporal == ERR_USAGE_REPORT_OVERLAP (submit passes state, then temporal overlap fires at priority 8)"
            - "err_state != err_temporal (two distinct categories resolve to two distinct errors on the same report)"

      - name: referential_recording_check_beats_payee_verification
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - entities.OwnershipClaim.fields.claimant_id
        distinguishing_aspect: |
          Error-category pair business_referential (recording-withdrawn,
          priority 12) vs business_referential (payee-verification, priority
          13) — same top-level category but distinct referential checks: a
          claim naming an UNVERIFIED claimant against a WITHDRAWN recording
          must surface ERR_RECORDING_WITHDRAWN (12 before 13), while the same
          claimant against an ACTIVE recording surfaces ERR_PAYEE_NOT_VERIFIED.
        test_recipe:
          setup:
