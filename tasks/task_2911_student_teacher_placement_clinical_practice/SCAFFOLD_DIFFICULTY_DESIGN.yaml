          untouched by the other, and the combined state (REMOVAL_PENDING x APPROVED) must be legal and
          observable. This is the non-linearity of independent parallel dimensions on one row. The
          sibling instance exercises a different entity (PerformanceAssessment) and a different
          non-linearity (a CYCLIC submitted/returned loop with a counter-bounded exit).
