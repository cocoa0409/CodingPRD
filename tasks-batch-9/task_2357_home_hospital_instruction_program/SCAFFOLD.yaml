# Task 2357 — Home and Hospital Instruction Program (district homebound instruction)
#
# Scenario (verbatim):
# 2357. Home and Hospital Instruction Program (district homebound instruction): eligibility with
# physician certification of expected absence duration and diagnosis category, instructional hours
# entitlement by grade level and delivery mode, teacher assignment, home visit safety protocols and
# virtual alternatives, coordination with classroom teachers on curriculum pacing and assessment,
# attendance coding, enrollment maintenance and funding implications, extension requests with updated
# medical documentation, transition planning back to the school building, special education service
# continuation during homebound status
#
# Difficulty target: above Expert band (§0.4) — 13 entities, 64 endpoints, 6 state machines,
# 11 calculations (4 dual-variant), 14 validation priority tiers, 40+ error codes, 5 roles.

domain_name: home-hospital-instruction
api_prefix: /hhi

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance/audit
  secondary_archetype: temporal windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  state_machine_notes: |
    Cyclic on HomeboundCase (ACTIVE <-> EXTENSION_PENDING, TRANSITION_PLANNED -> ACTIVE on plan abort)
    and on ExtensionRequest (UNDER_REVIEW <-> INFO_REQUESTED). HomeboundCase additionally carries a
    parallel state dimension (service_status x funding_status). InstructionSession is branching with a
    compensating VOIDED path. TransitionPlan is compound: its READY state is auto-derived from
    CurriculumPacingSync children plus the parent case's funding_status.
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  logical_clock:
    endpoint: "POST /_clock/set_current_utc"
    startup_default_utc: "2026-08-01T00:00:00Z"
    note: |
      All date/window/expiry rules read the logical clock. Before any set_current_utc call the clock
      reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time.

entities:
  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: District-assigned student number
        constraints: "unique across Student; 1-32 chars"
      - name: full_name
        type: string
        source: input
        description: Student legal name
      - name: grade_level
        type: integer
        source: input
        description: Grade level where 0 denotes kindergarten
        constraints: "0 <= grade_level <= 12"
      - name: campus_code
        type: string
        source: input
        description: Home campus identifier used for classroom coordination
      - name: special_ed_status
        type: enum
        source: input
        description: Special education posture at referral time
        default: NONE
        constraints: "NONE | IEP | SECTION_504"
      - name: iep_service_minutes_weekly
        type: integer
        source: input
        description: Weekly specialized service minutes required by the IEP; 0 when special_ed_status == NONE
        default: 0
        constraints: ">= 0; MUST be 0 when special_ed_status == NONE, MUST be > 0 when special_ed_status == IEP"
      - name: enrollment_status
        type: enum
        source: input
        description: District enrollment posture; homebound service requires ENROLLED
        default: ENROLLED
        constraints: "ENROLLED | WITHDRAWN"
      - name: grade_band
        type: enum
        source: computed
        description: "Derived band used for entitlement lookup: PRIMARY when grade_level <= 5, MIDDLE when 6 <= grade_level <= 8, HIGH when grade_level >= 9"
        constraints: "PRIMARY | MIDDLE | HIGH"

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Teacher legal name
      - name: employee_number
        type: string
        source: input
        description: District employee number
        constraints: "unique across Teacher"
      - name: credential_areas
        type: array
        source: input
        description: "Subject credentials held; members of {MATH, ELA, SCIENCE, SOCIAL_STUDIES, GENERAL_ELEMENTARY, SPED}"
        constraints: "non-empty array of enum members"
      - name: grade_bands
        type: array
        source: input
        description: "Bands this teacher may serve; members of {PRIMARY, MIDDLE, HIGH}"
        constraints: "non-empty array of enum members"
      - name: max_weekly_caseload_minutes
        type: integer
        source: input
        description: Contractual weekly ceiling on committed homebound instruction minutes
        constraints: "> 0"
      - name: safety_clearance_status
        type: enum
        source: input
        description: Background/safety clearance posture governing in-home visits
        default: CLEARED
        constraints: "CLEARED | RESTRICTED | EXPIRED"
      - name: clearance_expires_on
        type: string
        source: input
        description: Date (YYYY-MM-DD) the safety clearance lapses
      - name: home_visit_eligible
        type: boolean
        source: input
        description: Whether the teacher may perform in-home visits at all
        default: true
      - name: committed_weekly_minutes
        type: integer
        source: computed
        description: "Sum of weekly_committed_minutes over this teacher's TeacherAssignment rows with status == ACTIVE (see calculations.teacher_committed_minutes)"
        default: 0
      - name: over_cap
        type: boolean
        source: computed
        description: "True when committed_weekly_minutes > max_weekly_caseload_minutes"
        default: false

  - name: EntitlementRule
    parent: null
    common_fields: true
    fields:
      - name: grade_band
        type: enum
        source: input
        description: Band this rule applies to
        constraints: "PRIMARY | MIDDLE | HIGH"
      - name: delivery_mode
        type: enum
        source: input
        description: Delivery mode this rule applies to
        constraints: "IN_HOME | VIRTUAL_SYNC | HYBRID"
      - name: base_weekly_minutes
        type: integer
        source: input
        description: Base weekly instructional minutes before diagnosis and duration adjustment
        constraints: "> 0"
      - name: cap_weekly_minutes
        type: integer
        source: input
        description: Hard weekly ceiling applied after all adjustments
        constraints: ">= base_weekly_minutes"
      - name: min_session_minutes
        type: integer
        source: input
        description: Minimum scheduled duration of a single session
        constraints: "> 0"
      - name: max_session_minutes
        type: integer
        source: input
        description: Maximum scheduled duration of a single session and the per-session credit ceiling
        constraints: ">= min_session_minutes"
      - name: max_daily_minutes
        type: integer
        source: input
        description: Maximum aggregate scheduled minutes per student per service_date
        constraints: ">= max_session_minutes"
      - name: min_gap_minutes
        type: integer
        source: input
        description: Minimum required gap between two sessions for the same case on one service_date
        constraints: ">= 0"
      - name: travel_buffer_minutes
        type: integer
        source: input
        description: Buffer extended on both ends of an IN_HOME/HYBRID session when checking teacher slot conflicts
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Publication posture; only PUBLISHED rules are selectable for new cases
        default: PUBLISHED
        constraints: "PUBLISHED | RETIRED"

  - name: HomeboundCase
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the student receiving homebound instruction"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who created the case; used by the segregation-of-duties check on session verification
      - name: referral_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) the homebound referral was received
      - name: referral_note
        type: string
        source: input
        description: Free-text referral context
      - name: diagnosis_category
        type: enum
        source: computed
        description: "Copied from the current PhysicianCertification (is_current == true) on certification acceptance; null while no certification is accepted"
        constraints: "MEDICAL_ACUTE | MEDICAL_CHRONIC | PSYCHIATRIC | PREGNANCY_POSTPARTUM | INJURY_REHAB"
      - name: delivery_mode
        type: enum
        source: input
        description: Requested instructional delivery mode; may be forced to VIRTUAL_SYNC by a safety review
        constraints: "IN_HOME | VIRTUAL_SYNC | HYBRID"
      - name: service_status
        type: enum
        source: computed
        description: Primary lifecycle dimension of the case
        default: DRAFT
        constraints: "DRAFT | PENDING_CERT_REVIEW | ELIGIBLE | ACTIVE | EXTENSION_PENDING | TRANSITION_PLANNED | CLOSED | DENIED"
      - name: funding_status
        type: enum
        source: computed
        description: Parallel apportionment dimension of the case, independent of service_status
        default: NOT_REPORTED
        constraints: "NOT_REPORTED | ACCRUING | HELD | RECONCILED | FORFEITED"
      - name: entitlement_rule_id
        type: string
        source: computed
        description: "FK -> EntitlementRule.id; resolved at certification acceptance and on every delivery_mode change by matching (student.grade_band, case.delivery_mode) against EntitlementRule rows with status == PUBLISHED"
      - name: weekly_entitled_minutes
        type: integer
        source: computed
        description: "Output of calculations.weekly_entitlement_minutes; recomputed at certification acceptance, on delivery_mode change, and on extension approval"
        default: 0
      - name: certified_start_date
        type: string
        source: computed
        description: certified_start_date copied from the current PhysicianCertification
      - name: certified_end_date
        type: string
        source: computed
        description: certified_end_date copied from the current PhysicianCertification; extended by approved ExtensionRequest
      - name: service_start_date
        type: string
        source: computed
        description: Logical-clock date on which the case transitioned ELIGIBLE -> ACTIVE
      - name: reported_apportionment_minutes
        type: integer
        source: computed
        description: "Running sum of AttendanceLedgerEntry.apportionment_minutes for this case (HB_REVERSAL rows contribute negative minutes)"
        default: 0
      - name: service_gap_minutes
        type: integer
        source: computed
        description: "Output of calculations.service_gap_minutes; drives the ACCRUING <-> HELD funding threshold trigger"
        default: 0
      - name: makeup_obligation_minutes
        type: integer
        source: computed
        description: "Sum of scheduled_minutes over this case's sessions with status IN {STUDENT_UNAVAILABLE, TEACHER_CANCELLED, SAFETY_ABORTED} that have no DELIVERED makeup session pointing at them"
        default: 0
      - name: extension_count
        type: integer
        source: computed
        description: Number of ExtensionRequest rows for this case with status == APPROVED
        default: 0
      - name: certification_count
        type: integer
        source: computed
        description: Number of PhysicianCertification rows for this case with status == ACCEPTED
        default: 0
      - name: escort_required
        type: boolean
        source: computed
        description: True when the current FINALIZED HomeVisitSafetyReview clearance == CLEARED_WITH_ESCORT
        default: false
      - name: provisional_apportionment_minutes
        type: integer
        source: computed
        description: "Output of calculations.case_apportionment_minutes variant PROVISIONAL_ACCRUAL; written by POST /hhi/cases/{id}/funding/report"
        default: 0
      - name: final_apportionment_minutes
        type: integer
        source: computed
        description: "Output of calculations.case_apportionment_minutes variant FINAL_VERIFIED after recapture subtraction; written by POST /hhi/cases/{id}/funding/reconcile"
        default: 0
      - name: delivery_ratio_pct
        type: number
        source: computed
        description: "raw FINAL_VERIFIED minutes divided by entitled_total_minutes at reconciliation, 2 decimal places round_half_up"
        default: 0
      - name: recapture_minutes
        type: integer
        source: computed
        description: "Minutes clawed back at reconciliation per calculations.funding_reconciliation_net"
        default: 0
      - name: net_apportionment_minutes
        type: integer
        source: computed
        description: "final_apportionment_minutes after recapture; 0 when funding_status == FORFEITED"
        default: 0
      - name: close_reason
        type: enum
        source: input
        description: Reason recorded when the case is closed
        constraints: "RETURNED_TO_CAMPUS | WITHDRAWN | CERT_EXPIRED | DENIED_ELIGIBILITY | ADMIN_CLOSURE"

  - name: PhysicianCertification
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case this certification supports"
      - name: physician_npi
        type: string
        source: input
        description: Certifying physician NPI
        constraints: "exactly 10 digits"
      - name: diagnosis_category
        type: enum
        source: input
        description: Certified diagnosis category driving the entitlement diagnosis factor
        constraints: "MEDICAL_ACUTE | MEDICAL_CHRONIC | PSYCHIATRIC | PREGNANCY_POSTPARTUM | INJURY_REHAB"
      - name: certified_start_date
        type: string
        source: input
        description: First date (YYYY-MM-DD) of the certified absence window
      - name: certified_end_date
        type: string
        source: input
        description: Last date (YYYY-MM-DD) of the certified absence window, inclusive
        constraints: "certified_end_date >= certified_start_date"
      - name: expected_absence_days
        type: integer
        source: input
        description: Physician-stated expected absence duration in calendar days; drives the duration bonus
        constraints: ">= 1"
      - name: signature_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) the physician signed; must not precede certified_start_date by more than 30 days and must not be after the logical clock date
      - name: status
        type: enum
        source: computed
        description: Review posture of this certification
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED"
      - name: is_current
        type: boolean
        source: computed
        description: True for exactly one ACCEPTED certification per case; acceptance of a newer certification sets the prior one to SUPERSEDED and is_current false
        default: false
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the submitting actor
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the NurseReviewer who accepted or rejected
      - name: clinical_note
        type: string
        source: input
        description: Free-text clinical narrative
      - name: review_note
        type: string
        source: input
        description: Reviewer note recorded on accept or reject

  - name: TeacherAssignment
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case being staffed"
      - name: teacher_id
        type: string
        source: input
        description: "FK -> Teacher.id; omitted by the caller to invoke the selector policy (see calculations.assignment_minute_allocation and validations[priority=14] ERR_NO_ELIGIBLE_TEACHER)"
      - name: role
        type: enum
        source: input
        description: Assignment role on the case
        constraints: "PRIMARY | SUPPORT | SPED_SERVICE"
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle posture
        default: PROPOSED
        constraints: "PROPOSED | ACTIVE | DECLINED | RELEASED"
      - name: weekly_committed_minutes
        type: integer
        source: computed
        description: "Output of calculations.assignment_minute_allocation; 0 while status IN {PROPOSED, DECLINED, RELEASED}"
        default: 0
      - name: accepted_at
        type: datetime
        source: computed
        description: Logical-clock instant the teacher accepted
      - name: released_at
        type: datetime
        source: computed
        description: Logical-clock instant the assignment was released
      - name: release_reason
        type: enum
        source: input
        description: Reason recorded on release
        constraints: "CASE_CLOSED | MODE_CHANGE | CASELOAD_REBALANCE | CLEARANCE_LAPSED | STAFF_LEAVE"
      - name: decline_reason
        type: string
        source: input
        description: Free-text reason recorded on decline

  - name: HomeVisitSafetyReview
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case whose home environment was reviewed"
      - name: evidence_source
        type: enum
        source: input
        description: How the hazard findings were gathered; selects the risk-scoring variant
        constraints: "PARENT_ATTESTATION | ONSITE_WALKTHROUGH"
      - name: hazard_findings
        type: array
        source: input
        description: "Distinct hazard codes observed; members of {AGGRESSIVE_ANIMAL, NO_SECONDARY_EXIT, WEAPON_PRESENT_UNSECURED, SMOKE_OR_AIR_QUALITY, ACTIVE_INFECTION_RISK, UNLIT_ACCESS, NO_ADULT_PRESENT}"
        default: []
        constraints: "no duplicate members"
      - name: escort_available
        type: boolean
        source: input
        description: Whether a district escort can accompany the teacher
        default: false
      - name: review_date
        type: string
        source: input
        description: Date (YYYY-MM-DD) the review was conducted
      - name: expires_on
        type: string
        source: computed
        description: "review_date + 60 days; an IN_HOME session scheduled with service_date > expires_on is rejected with ERR_SAFETY_REVIEW_EXPIRED"
      - name: scoring_variant
        type: enum
        source: computed
        description: "SELF_REPORTED when evidence_source == PARENT_ATTESTATION, ONSITE_VERIFIED when evidence_source == ONSITE_WALKTHROUGH"
        constraints: "SELF_REPORTED | ONSITE_VERIFIED"
      - name: risk_score
        type: integer
        source: computed
        description: "Output of calculations.home_visit_risk_score; computed at creation and recomputed at finalization"
        default: 0
      - name: clearance
        type: enum
        source: computed
        description: "Banded from risk_score: BLOCKED when >= 60, VIRTUAL_ONLY when >= 35, CLEARED_WITH_ESCORT when >= 15, else CLEARED; PENDING while status == DRAFT"
        default: PENDING
        constraints: "PENDING | CLEARED | CLEARED_WITH_ESCORT | VIRTUAL_ONLY | BLOCKED"
      - name: status
        type: enum
        source: computed
        description: Only a FINALIZED review governs scheduling; finalizing a newer review supersedes the prior FINALIZED one
        default: DRAFT
        constraints: "DRAFT | FINALIZED | SUPERSEDED"
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who finalized the review

  - name: InstructionSession
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case being served"
      - name: assignment_id
        type: string
        source: input
        description: "FK -> TeacherAssignment.id; must belong to case_id and have status == ACTIVE"
      - name: makeup_for_session_id
        type: string
        source: input
        description: "FK -> InstructionSession.id; self-referential link set only by POST /hhi/sessions/{id}/makeup, pointing at the missed session being made up"
      - name: scheduled_start
        type: datetime
        source: input
        description: Scheduled start instant (ISO 8601 UTC)
      - name: scheduled_end
        type: datetime
        source: input
        description: Scheduled end instant (ISO 8601 UTC)
        constraints: "scheduled_end > scheduled_start; both on the same UTC calendar date"
      - name: scheduled_minutes
        type: integer
        source: computed
        description: "(scheduled_end - scheduled_start) in whole minutes"
      - name: service_date
        type: string
        source: computed
        description: UTC calendar date (YYYY-MM-DD) of scheduled_start
      - name: delivery_mode
        type: enum
        source: input
        description: Mode of this specific session; must be VIRTUAL_SYNC when the case delivery_mode == VIRTUAL_SYNC
        constraints: "IN_HOME | VIRTUAL_SYNC"
      - name: subject
        type: enum
        source: input
        description: Instructional subject delivered
        constraints: "MATH | ELA | SCIENCE | SOCIAL_STUDIES | GENERAL_ELEMENTARY"
      - name: status
        type: enum
        source: computed
        description: Session lifecycle posture
        default: SCHEDULED
        constraints: "SCHEDULED | DELIVERED | STUDENT_UNAVAILABLE | TEACHER_CANCELLED | SAFETY_ABORTED | CANCELLED_ADMIN | VOIDED"
      - name: outcome_reason
        type: string
        source: input
        description: Free-text reason recorded on any non-DELIVERED outcome
      - name: actual_minutes
        type: integer
        source: input
        description: Minutes actually delivered, reported at logging time
        constraints: ">= 0"
      - name: credited_minutes
        type: integer
        source: computed
        description: "Output of calculations.session_credited_minutes; 0 unless status IN {DELIVERED}"
        default: 0
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who logged the delivery outcome
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who verified the session; must differ from HomeboundCase.created_by_user_id
      - name: verified_at
        type: datetime
        source: computed
        description: Logical-clock instant of verification; only verified sessions enter the FINAL_VERIFIED apportionment variant
      - name: void_reason
        type: enum
        source: input
        description: Reason recorded when a DELIVERED session is voided
        constraints: "DOCUMENTATION_DEFECT | DUPLICATE_ENTRY | AUDIT_REVERSAL | MODE_INELIGIBLE"

  - name: AttendanceLedgerEntry
    parent: HomeboundCase
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case whose attendance is coded"
      - name: session_id
        type: string
        source: input
        description: "FK -> InstructionSession.id; the session that produced this ledger row"
      - name: reversal_of_entry_id
        type: string
        source: input
        description: "FK -> AttendanceLedgerEntry.id; self-referential link populated only on HB_REVERSAL rows, pointing at the entry being reversed"
      - name: service_date
        type: string
        source: computed
        description: Copied from the session's service_date
      - name: attendance_code
        type: enum
        source: computed
        description: "Output of calculations.attendance_code_assignment"
        constraints: "HB_PRESENT | HB_VIRTUAL_PRESENT | HB_ABSENT_MEDICAL | HB_ABSENT_UNEXCUSED | HB_NOT_SERVED | HB_REVERSAL"
      - name: apportionment_minutes
        type: integer
        source: computed
        description: "Minutes this row contributes to HomeboundCase.reported_apportionment_minutes; equals the session's credited_minutes for HB_PRESENT/HB_VIRTUAL_PRESENT, 0 for absence codes, and the negation of the reversed row's apportionment_minutes for HB_REVERSAL"
      - name: delivery_mode
        type: enum
        source: computed
        description: Copied from the session's delivery_mode
        constraints: "IN_HOME | VIRTUAL_SYNC"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose action produced this immutable row

  - name: ExtensionRequest
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case whose certified window is being extended"
      - name: certification_id
        type: string
        source: input
        description: "FK -> PhysicianCertification.id; the updated medical documentation backing this request; must belong to case_id and have status == ACCEPTED"
      - name: requested_additional_days
        type: integer
        source: input
        description: Calendar days requested beyond the current certified_end_date
        constraints: "1 <= requested_additional_days <= 90"
      - name: justification
        type: string
        source: input
        description: Free-text justification
      - name: status
        type: enum
        source: computed
        description: Extension review posture; UNDER_REVIEW <-> INFO_REQUESTED forms the revision cycle
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the submitting actor; the deciding actor must differ
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the deciding actor
      - name: decision_note
        type: string
        source: input
        description: Note recorded on approve or deny
      - name: info_note
        type: string
        source: input
        description: Note recorded when additional information is requested
      - name: resubmit_count
        type: integer
        source: computed
        description: Number of times this request has cycled INFO_REQUESTED -> UNDER_REVIEW
        default: 0

  - name: TransitionPlan
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case returning to the school building"
      - name: target_return_date
        type: string
        source: input
        description: Planned date (YYYY-MM-DD) the student re-enters the building
      - name: reintegration_mode
        type: enum
        source: input
        description: Shape of the return
        constraints: "FULL_DAY | PARTIAL_DAY_RAMP | VIRTUAL_BRIDGE"
      - name: ramp_weeks
        type: integer
        source: input
        description: Number of ramp weeks; must be 0 when reintegration_mode == FULL_DAY and >= 1 otherwise
        default: 0
        constraints: "0 <= ramp_weeks <= 8"
      - name: status
        type: enum
        source: computed
        description: Compound status; READY is auto-derived from CurriculumPacingSync children and the parent case's funding_status
        default: DRAFT
        constraints: "DRAFT | CLASSROOM_COORD_PENDING | READY | COMPLETED | ABORTED | SUPERSEDED"
      - name: required_ack_count
        type: integer
        source: computed
        description: "Count of CurriculumPacingSync rows for this case_id with ack_status IN {PENDING, ACKED, DISPUTED}"
        default: 0
      - name: classroom_ack_count
        type: integer
        source: computed
        description: "Count of CurriculumPacingSync rows for this case_id with ack_status == ACKED"
        default: 0
      - name: completed_at
        type: datetime
        source: computed
        description: Logical-clock instant the plan was completed
      - name: abort_reason
        type: enum
        source: input
        description: Reason recorded when the plan is aborted and the case returns to ACTIVE
        constraints: "MEDICAL_RELAPSE | PARENT_WITHDRAWAL | CAMPUS_CAPACITY | DOCUMENTATION_DEFECT"

  - name: CurriculumPacingSync
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case being coordinated"
      - name: classroom_teacher_id
        type: string
        source: input
        description: "FK -> Teacher.id; the campus classroom teacher of record for this subject"
      - name: subject
        type: enum
        source: input
        description: Subject being paced; unique per (case_id, subject) across non-superseded rows
        constraints: "MATH | ELA | SCIENCE | SOCIAL_STUDIES | GENERAL_ELEMENTARY"
      - name: pacing_target_unit
        type: string
        source: input
        description: Unit/chapter the homebound teacher must reach to stay aligned with the classroom
      - name: assessment_accommodation
        type: enum
        source: input
        description: Assessment accommodation agreed for homebound status
        constraints: "NONE | EXTENDED_TIME | ORAL_ADMINISTRATION | ALTERNATE_SETTING_PROCTOR"
      - name: ack_status
        type: enum
        source: computed
        description: Classroom teacher acknowledgement posture; reset to PENDING when the case funding_status flips to HELD
        default: PENDING
        constraints: "PENDING | ACKED | DISPUTED"
      - name: acked_at
        type: datetime
        source: computed
        description: Logical-clock instant of acknowledgement
      - name: dispute_note
        type: string
        source: input
        description: Note recorded when the classroom teacher disputes the pacing target

  - name: SpedServiceLog
    parent: HomeboundCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> HomeboundCase.id; the case whose IEP services continue during homebound status"
      - name: service_type
        type: enum
        source: input
        description: Related service being continued
        constraints: "SPEECH | OT | PT | COUNSELING | SPECIALIZED_ACADEMIC"
      - name: required_weekly_minutes
        type: integer
        source: input
        description: Weekly minutes the IEP requires for this service
        constraints: "> 0"
      - name: delivered_cumulative_minutes
        type: integer
        source: computed
        description: Running total of minutes recorded via POST /hhi/sped-service-logs/{id}/record-delivery
        default: 0
      - name: continuation_status
        type: enum
        source: computed
        description: Continuation posture during homebound status; SUSPENDED_PENDING_IEP freezes delivered_cumulative_minutes
        default: CONTINUED
        constraints: "CONTINUED | MODIFIED_VIRTUAL | SUSPENDED_PENDING_IEP"
      - name: compensatory_minutes_owed
        type: integer
        source: computed
        description: "Output of calculations.sped_compensatory_minutes"
        default: 0
      - name: last_service_date
        type: string
        source: computed
        description: service_date of the most recent recorded delivery
      - name: continuation_reason
        type: string
        source: input
        description: Free-text reason recorded on a continuation-status change

state_machines:
  - entity: HomeboundCase
    dimension: service_status
    initial_state: DRAFT
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: DRAFT
        to: PENDING_CERT_REVIEW
        trigger: "POST /hhi/certifications"
        actor: CaseManager
        preconditions:
          - "student.enrollment_status == ENROLLED"
          - "payload expected_case_version equals HomeboundCase.version"
          - "no PhysicianCertification for this case with status == SUBMITTED"
        side_effects:
          - "creates PhysicianCertification with status SUBMITTED"
          - "increments HomeboundCase.version by 1"
      - from: PENDING_CERT_REVIEW
        to: ELIGIBLE
        trigger: "POST /hhi/certifications/{id}/review with decision == ACCEPT"
        actor: NurseReviewer
        preconditions:
          - "PhysicianCertification.status == SUBMITTED"
          - "certification.certified_end_date >= certification.certified_start_date"
          - "certification.expected_absence_days >= 10"
        side_effects:
          - "certification.status := ACCEPTED, certification.is_current := true, prior ACCEPTED certification for this case (if any) := SUPERSEDED with is_current false"
          - "case.diagnosis_category, case.certified_start_date, case.certified_end_date := copied from the accepted certification"
          - "case.certification_count := count of ACCEPTED certifications for this case"
          - "case.entitlement_rule_id := the EntitlementRule row with status == PUBLISHED matching (student.grade_band, case.delivery_mode)"
          - "recompute case.weekly_entitled_minutes via calculations.weekly_entitlement_minutes"
          - "recompute calculations.assignment_minute_allocation over this case's ACTIVE TeacherAssignment rows"
      - from: PENDING_CERT_REVIEW
        to: DRAFT
        trigger: "POST /hhi/certifications/{id}/review with decision == REJECT"
        actor: NurseReviewer
        preconditions:
          - "PhysicianCertification.status == SUBMITTED"
        side_effects:
          - "certification.status := REJECTED, is_current stays false"
          - "case.service_status returns to DRAFT so a corrected certification can be submitted"
        note: "Rejection is a revision cycle, not a terminal denial."
      - from: DRAFT
        to: DENIED
        trigger: "POST /hhi/cases/{id}/deny"
        actor: ProgramAdministrator
        preconditions:
          - "case.service_status IN {DRAFT, PENDING_CERT_REVIEW}"
        side_effects:
          - "case.close_reason := DENIED_ELIGIBILITY"
          - "all PhysicianCertification rows for this case with status == SUBMITTED := REJECTED"
      - from: PENDING_CERT_REVIEW
        to: DENIED
        trigger: "POST /hhi/cases/{id}/deny"
        actor: ProgramAdministrator
        preconditions:
          - "case.service_status IN {DRAFT, PENDING_CERT_REVIEW}"
        side_effects:
          - "case.close_reason := DENIED_ELIGIBILITY"
          - "all PhysicianCertification rows for this case with status == SUBMITTED := REJECTED"
      - from: ELIGIBLE
        to: ACTIVE
        trigger: "POST /hhi/cases/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "exactly one PhysicianCertification for this case has is_current == true and status == ACCEPTED"
          - "student.enrollment_status == ENROLLED"
          - "at least one TeacherAssignment for this case has role == PRIMARY and status == ACTIVE"
          - "when case.delivery_mode IN {IN_HOME, HYBRID}: a HomeVisitSafetyReview for this case exists with status == FINALIZED and clearance IN {CLEARED, CLEARED_WITH_ESCORT}"
        side_effects:
          - "case.service_start_date := logical-clock UTC date"
          - "case.funding_status := ACCRUING (see the funding_status dimension NOT_REPORTED_to_ACCRUING transition)"
          - "case.escort_required := true when the FINALIZED review clearance == CLEARED_WITH_ESCORT"
      - from: ACTIVE
        to: EXTENSION_PENDING
        trigger: "POST /hhi/extension-requests"
        actor: CaseManager
        preconditions:
          - "case.service_status == ACTIVE"
          - "payload expected_case_version equals HomeboundCase.version"
          - "case.extension_count < 2"
          - "the referenced PhysicianCertification has case_id == this case and status == ACCEPTED"
        side_effects:
          - "creates ExtensionRequest with status SUBMITTED and resubmit_count 0"
          - "increments HomeboundCase.version by 1"
      - from: EXTENSION_PENDING
        to: ACTIVE
        trigger: "POST /hhi/extension-requests/{id}/decide"
        actor: ProgramAdministrator
        preconditions:
          - "ExtensionRequest.status == UNDER_REVIEW"
          - "X-User-ID != ExtensionRequest.submitted_by_user_id"
        side_effects:
          - "on decision APPROVED: case.certified_end_date := certified_end_date + requested_additional_days days; case.extension_count += 1; recompute case.weekly_entitled_minutes; recompute calculations.assignment_minute_allocation over ACTIVE assignments; recompute Teacher.committed_weekly_minutes for each affected teacher"
          - "on decision DENIED: no case field changes beyond service_status and updated_at"
        note: "ACTIVE -> EXTENSION_PENDING -> ACTIVE is the cyclic loop; extension_count < 2 is the termination condition."
      - from: ACTIVE
        to: TRANSITION_PLANNED
        trigger: "POST /hhi/transition-plans"
        actor: CaseManager
        preconditions:
          - "case.service_status == ACTIVE"
          - "payload expected_case_version equals HomeboundCase.version"
          - "no TransitionPlan for this case with status IN {DRAFT, CLASSROOM_COORD_PENDING, READY}"
          - "target_return_date > logical-clock UTC date"
        side_effects:
          - "creates TransitionPlan with status DRAFT"
          - "increments HomeboundCase.version by 1"
      - from: TRANSITION_PLANNED
        to: ACTIVE
        trigger: "POST /hhi/transition-plans/{id}/abort"
        actor: CaseManager
        preconditions:
          - "TransitionPlan.status IN {DRAFT, CLASSROOM_COORD_PENDING, READY}"
        side_effects:
          - "plan.status := ABORTED"
          - "case.service_status := ACTIVE"
        note: "Second cycle in this machine: a case may re-enter planning after an abort."
      - from: TRANSITION_PLANNED
        to: CLOSED
        trigger: "POST /hhi/transition-plans/{id}/complete"
        actor: ProgramAdministrator
        preconditions:
          - "TransitionPlan.status == READY"
          - "logical-clock UTC date >= plan.target_return_date"
        side_effects:
          - "plan.status := COMPLETED, plan.completed_at := logical-clock instant"
          - "case.close_reason := RETURNED_TO_CAMPUS"
          - "all TeacherAssignment rows for this case with status == ACTIVE := RELEASED with release_reason CASE_CLOSED, weekly_committed_minutes := 0"
          - "recompute Teacher.committed_weekly_minutes for each released teacher"
          - "all InstructionSession rows for this case with status == SCHEDULED := CANCELLED_ADMIN"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /hhi/cases/{id}/close"
        actor: ProgramAdministrator
        preconditions:
          - "case.service_status IN {ELIGIBLE, ACTIVE, EXTENSION_PENDING}"
          - "close_reason != RETURNED_TO_CAMPUS"
        side_effects:
          - "all TeacherAssignment rows for this case with status == ACTIVE := RELEASED with release_reason CASE_CLOSED, weekly_committed_minutes := 0"
          - "recompute Teacher.committed_weekly_minutes for each released teacher"
          - "all InstructionSession rows for this case with status == SCHEDULED := CANCELLED_ADMIN"
          - "all TransitionPlan rows for this case with status IN {DRAFT, CLASSROOM_COORD_PENDING, READY} := SUPERSEDED"
      - from: ELIGIBLE
        to: CLOSED
        trigger: "POST /hhi/cases/{id}/close"
        actor: ProgramAdministrator
        preconditions:
          - "case.service_status IN {ELIGIBLE, ACTIVE, EXTENSION_PENDING}"
          - "close_reason != RETURNED_TO_CAMPUS"
        side_effects:
          - "all TeacherAssignment rows for this case with status == ACTIVE := RELEASED with release_reason CASE_CLOSED, weekly_committed_minutes := 0"
          - "recompute Teacher.committed_weekly_minutes for each released teacher"
      - from: EXTENSION_PENDING
        to: CLOSED
        trigger: "POST /hhi/cases/{id}/close"
        actor: ProgramAdministrator
        preconditions:
          - "case.service_status IN {ELIGIBLE, ACTIVE, EXTENSION_PENDING}"
          - "close_reason != RETURNED_TO_CAMPUS"
        side_effects:
          - "all ExtensionRequest rows for this case with status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} := DENIED with decision_note 'case closed'"
          - "all TeacherAssignment rows for this case with status == ACTIVE := RELEASED with release_reason CASE_CLOSED, weekly_committed_minutes := 0"

  - entity: HomeboundCase
    dimension: funding_status
    initial_state: NOT_REPORTED
    terminal_states: [FORFEITED]
    transitions:
      - from: NOT_REPORTED
        to: ACCRUING
        trigger: "POST /hhi/cases/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "case.service_status transitions ELIGIBLE -> ACTIVE in the same request"
        side_effects:
          - "case.service_gap_minutes := 0"
      - from: ACCRUING
        to: HELD
        trigger: "system: recomputation of calculations.service_gap_minutes after any AttendanceLedgerEntry write or POST /hhi/cases/{id}/funding/report"
        actor: system
        preconditions:
          - "case.service_gap_minutes >= case.weekly_entitled_minutes"
        side_effects:
          - "all CurriculumPacingSync rows for this case with ack_status == ACKED := PENDING with acked_at cleared"
          - "any TransitionPlan for this case with status == READY := CLASSROOM_COORD_PENDING"
      - from: RECONCILED
        to: HELD
        trigger: "system: recomputation of calculations.service_gap_minutes after an AttendanceLedgerEntry HB_REVERSAL row is written by POST /hhi/sessions/{id}/void"
        actor: system
        preconditions:
          - "case.service_gap_minutes >= case.weekly_entitled_minutes"
        side_effects:
          - "all CurriculumPacingSync rows for this case with ack_status == ACKED := PENDING with acked_at cleared"
          - "any TransitionPlan for this case with status == READY := CLASSROOM_COORD_PENDING"
        note: "An audit reversal reopens a previously reconciled case; this is the second cycle entry into HELD."
      - from: HELD
        to: ACCRUING
        trigger: "system: recomputation of calculations.service_gap_minutes after any AttendanceLedgerEntry write"
        actor: system
        preconditions:
          - "case.service_gap_minutes < case.weekly_entitled_minutes"
        side_effects:
          - "case.updated_at refreshed; CurriculumPacingSync rows are NOT re-acknowledged automatically"
      - from: ACCRUING
        to: RECONCILED
        trigger: "POST /hhi/cases/{id}/funding/reconcile"
        actor: ProgramAdministrator
        preconditions:
          - "case.funding_status == ACCRUING"
          - "case.service_status IN {ACTIVE, EXTENSION_PENDING, TRANSITION_PLANNED, CLOSED}"
          - "calculations.funding_reconciliation_net yields delivery_ratio_pct >= 0.50"
        side_effects:
          - "case.final_apportionment_minutes, case.delivery_ratio_pct, case.recapture_minutes, case.net_apportionment_minutes := outputs of calculations.funding_reconciliation_net"
      - from: ACCRUING
        to: FORFEITED
        trigger: "POST /hhi/cases/{id}/funding/reconcile"
        actor: ProgramAdministrator
        preconditions:
          - "case.funding_status == ACCRUING"
          - "calculations.funding_reconciliation_net yields delivery_ratio_pct < 0.50"
        side_effects:
          - "case.final_apportionment_minutes := raw FINAL_VERIFIED minutes; case.recapture_minutes := raw FINAL_VERIFIED minutes; case.net_apportionment_minutes := 0"

  - entity: PhysicianCertification
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /hhi/certifications/{id}/review with decision == ACCEPT"
        actor: NurseReviewer
        preconditions:
          - "certification.status == SUBMITTED"
          - "certification.expected_absence_days >= 10"
        side_effects:
          - "is_current := true; reviewed_by_user_id := X-User-ID"
          - "cascades the HomeboundCase PENDING_CERT_REVIEW_to_ELIGIBLE transition"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /hhi/certifications/{id}/review with decision == REJECT"
        actor: NurseReviewer
        preconditions:
          - "certification.status == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; case.service_status := DRAFT"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: acceptance of a newer PhysicianCertification on the same case"
        actor: system
        preconditions:
          - "certification.is_current == true"
        side_effects:
          - "is_current := false"

  - entity: TeacherAssignment
    initial_state: PROPOSED
    terminal_states: [DECLINED, RELEASED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /hhi/assignments/{id}/accept"
        actor: HomeboundTeacher
        preconditions:
          - "assignment.status == PROPOSED"
          - "X-User-ID == assignment.teacher_id"
          - "teacher.safety_clearance_status != EXPIRED"
          - "teacher.committed_weekly_minutes + the allocation this assignment would receive <= teacher.max_weekly_caseload_minutes"
        side_effects:
          - "accepted_at := logical-clock instant"
          - "recompute calculations.assignment_minute_allocation over the case's ACTIVE assignments (including this one)"
          - "recompute Teacher.committed_weekly_minutes and Teacher.over_cap for every teacher whose allocation changed"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /hhi/assignments/{id}/decline"
        actor: HomeboundTeacher
        preconditions:
          - "assignment.status == PROPOSED"
          - "X-User-ID == assignment.teacher_id"
        side_effects:
          - "weekly_committed_minutes := 0"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /hhi/assignments/{id}/release"
        actor: ProgramAdministrator
        preconditions:
          - "assignment.status == ACTIVE"
          - "no InstructionSession for this assignment has status == SCHEDULED"
        side_effects:
          - "released_at := logical-clock instant; weekly_committed_minutes := 0"
          - "recompute calculations.assignment_minute_allocation over the case's remaining ACTIVE assignments"
          - "recompute Teacher.committed_weekly_minutes and Teacher.over_cap for every teacher whose allocation changed"

  - entity: HomeVisitSafetyReview
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /hhi/safety-reviews/{id}/finalize"
        actor: CaseManager
        preconditions:
          - "review.status == DRAFT"
        side_effects:
          - "recompute review.risk_score via calculations.home_visit_risk_score and re-band review.clearance"
          - "any other HomeVisitSafetyReview for this case with status == FINALIZED := SUPERSEDED"
          - "case.escort_required := true when clearance == CLEARED_WITH_ESCORT, else false"
          - "when clearance == VIRTUAL_ONLY and case.delivery_mode IN {IN_HOME, HYBRID}: case.delivery_mode := VIRTUAL_SYNC; case.entitlement_rule_id re-resolved against (student.grade_band, VIRTUAL_SYNC); case.weekly_entitled_minutes recomputed; calculations.assignment_minute_allocation recomputed over ACTIVE assignments; Teacher.committed_weekly_minutes and Teacher.over_cap recomputed for each affected teacher; every InstructionSession for this case with status == SCHEDULED and delivery_mode == IN_HOME := CANCELLED_ADMIN"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: finalization of a newer HomeVisitSafetyReview on the same case"
        actor: system
        preconditions:
          - "review.status == FINALIZED"
        side_effects:
          - "the superseded review no longer governs scheduling; the newer FINALIZED review does"

  - entity: InstructionSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED_ADMIN, VOIDED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /hhi/sessions/{id}/log with outcome == DELIVERED"
        actor: HomeboundTeacher
        preconditions:
          - "session.status == SCHEDULED"
          - "X-User-ID == the teacher_id of session.assignment_id"
          - "case.service_status IN {ACTIVE, EXTENSION_PENDING, TRANSITION_PLANNED}"
          - "logical-clock UTC date >= session.service_date"
          - "actual_minutes >= 1"
        side_effects:
          - "session.credited_minutes := calculations.session_credited_minutes; session.logged_by_user_id := X-User-ID"
          - "creates an AttendanceLedgerEntry with attendance_code from calculations.attendance_code_assignment and apportionment_minutes == session.credited_minutes"
          - "case.reported_apportionment_minutes recomputed as the sum of this case's AttendanceLedgerEntry.apportionment_minutes"
          - "case.service_gap_minutes recomputed via calculations.service_gap_minutes, which may fire the funding_status ACCRUING_to_HELD or HELD_to_ACCRUING transition"
          - "case.makeup_obligation_minutes recomputed"
      - from: SCHEDULED
        to: STUDENT_UNAVAILABLE
        trigger: "POST /hhi/sessions/{id}/log with outcome == STUDENT_UNAVAILABLE"
        actor: HomeboundTeacher
        preconditions:
          - "session.status == SCHEDULED"
          - "X-User-ID == the teacher_id of session.assignment_id"
          - "payload absence_kind IN {MEDICAL, UNEXCUSED} is present"
        side_effects:
          - "session.credited_minutes := 0"
          - "creates an AttendanceLedgerEntry with attendance_code HB_ABSENT_MEDICAL (absence_kind MEDICAL) or HB_ABSENT_UNEXCUSED (absence_kind UNEXCUSED) and apportionment_minutes 0"
          - "case.makeup_obligation_minutes += session.scheduled_minutes"
          - "case.service_gap_minutes recomputed"
      - from: SCHEDULED
        to: TEACHER_CANCELLED
        trigger: "POST /hhi/sessions/{id}/log with outcome == TEACHER_CANCELLED"
        actor: HomeboundTeacher
        preconditions:
          - "session.status == SCHEDULED"
          - "X-User-ID == the teacher_id of session.assignment_id"
        side_effects:
          - "session.credited_minutes := 0"
          - "creates an AttendanceLedgerEntry with attendance_code HB_NOT_SERVED and apportionment_minutes 0"
          - "case.makeup_obligation_minutes += session.scheduled_minutes"
          - "case.service_gap_minutes recomputed"
      - from: SCHEDULED
        to: SAFETY_ABORTED
        trigger: "POST /hhi/sessions/{id}/log with outcome == SAFETY_ABORTED"
        actor: HomeboundTeacher
        preconditions:
          - "session.status == SCHEDULED"
          - "X-User-ID == the teacher_id of session.assignment_id"
        side_effects:
          - "session.credited_minutes := 0"
          - "creates an AttendanceLedgerEntry with attendance_code HB_NOT_SERVED and apportionment_minutes 0"
          - "case.makeup_obligation_minutes += session.scheduled_minutes"
      - from: SCHEDULED
        to: CANCELLED_ADMIN
        trigger: "POST /hhi/sessions/{id}/cancel"
        actor: ProgramAdministrator
        preconditions:
          - "session.status == SCHEDULED"
        side_effects:
          - "no AttendanceLedgerEntry is written; case.makeup_obligation_minutes unchanged"
        note: "Also fired as a cascade by case close, transition-plan completion, and a VIRTUAL_ONLY safety finalization."
      - from: DELIVERED
        to: VOIDED
        trigger: "POST /hhi/sessions/{id}/void"
        actor: ProgramAdministrator
        preconditions:
          - "session.status == DELIVERED"
        side_effects:
          - "creates an AttendanceLedgerEntry with attendance_code HB_REVERSAL, reversal_of_entry_id pointing at the original entry, and apportionment_minutes == -1 * the original entry's apportionment_minutes"
          - "session.credited_minutes := 0; session.verified_at and session.verified_by_user_id cleared"
          - "case.reported_apportionment_minutes recomputed net of the reversal"
          - "case.service_gap_minutes recomputed, which may fire the funding_status ACCRUING_to_HELD or RECONCILED_to_HELD transition"
        note: "Compensating transition: the reversal restores the pre-log apportionment total exactly."

  - entity: ExtensionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /hhi/extension-requests/{id}/start-review"
        actor: ProgramAdministrator
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "updated_at refreshed; no case field changes"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /hhi/extension-requests/{id}/request-info"
        actor: ProgramAdministrator
        preconditions:
          - "request.status == UNDER_REVIEW"
        side_effects:
          - "request.info_note := payload info_note"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /hhi/extension-requests/{id}/resubmit"
        actor: CaseManager
        preconditions:
          - "request.status == INFO_REQUESTED"
          - "request.resubmit_count < 2"
          - "the PhysicianCertification named in the payload has case_id == request.case_id and status == ACCEPTED"
        side_effects:
          - "request.certification_id := the newer accepted certification supplied in the payload"
          - "request.resubmit_count += 1"
        note: "UNDER_REVIEW <-> INFO_REQUESTED is the revision cycle; resubmit_count < 2 terminates it."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /hhi/extension-requests/{id}/decide with decision == APPROVED"
        actor: ProgramAdministrator
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID != request.submitted_by_user_id"
          - "case.service_status == EXTENSION_PENDING"
        side_effects:
          - "cascades the HomeboundCase EXTENSION_PENDING_to_ACTIVE transition, extending case.certified_end_date by requested_additional_days"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /hhi/extension-requests/{id}/decide with decision == DENIED"
        actor: ProgramAdministrator
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID != request.submitted_by_user_id"
          - "case.service_status == EXTENSION_PENDING"
        side_effects:
          - "case.service_status := ACTIVE with no certified_end_date change"

  - entity: TransitionPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABORTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CLASSROOM_COORD_PENDING
        trigger: "POST /hhi/transition-plans/{id}/coordinate"
        actor: CaseManager
        preconditions:
          - "plan.status == DRAFT"
          - "plan.required_ack_count >= 1"
          - "no SpedServiceLog for this case has continuation_status == SUSPENDED_PENDING_IEP"
        side_effects:
          - "plan.required_ack_count and plan.classroom_ack_count recomputed via calculations.transition_ack_counters"
          - "when the recomputed counters already satisfy the READY guard, the plan advances to READY within the same request"
      - from: CLASSROOM_COORD_PENDING
        to: READY
        trigger: "system: recomputation of calculations.transition_ack_counters after POST /hhi/pacing-syncs/{id}/acknowledge or POST /hhi/transition-plans/{id}/coordinate"
        actor: system
        preconditions:
          - "plan.required_ack_count >= 1"
          - "plan.classroom_ack_count == plan.required_ack_count"
          - "case.funding_status != HELD"
        side_effects:
          - "plan.status := READY"
        note: "Compound state: READY is derived from CurriculumPacingSync children plus the parent case's funding_status dimension."
      - from: READY
        to: CLASSROOM_COORD_PENDING
        trigger: "system: recomputation of calculations.transition_ack_counters after a new CurriculumPacingSync is created for the case, a sync is disputed, or the case funding_status enters HELD"
        actor: system
        preconditions:
          - "plan.classroom_ack_count < plan.required_ack_count OR case.funding_status == HELD"
        side_effects:
          - "plan.status := CLASSROOM_COORD_PENDING"
      - from: READY
        to: COMPLETED
        trigger: "POST /hhi/transition-plans/{id}/complete"
        actor: ProgramAdministrator
        preconditions:
          - "plan.status == READY"
          - "logical-clock UTC date >= plan.target_return_date"
        side_effects:
          - "cascades the HomeboundCase TRANSITION_PLANNED_to_CLOSED transition"
      - from: CLASSROOM_COORD_PENDING
        to: ABORTED
        trigger: "POST /hhi/transition-plans/{id}/abort"
        actor: CaseManager
        preconditions:
          - "plan.status IN {DRAFT, CLASSROOM_COORD_PENDING, READY}"
        side_effects:
          - "case.service_status := ACTIVE"
      - from: READY
        to: ABORTED
        trigger: "POST /hhi/transition-plans/{id}/abort"
        actor: CaseManager
        preconditions:
          - "plan.status IN {DRAFT, CLASSROOM_COORD_PENDING, READY}"
        side_effects:
          - "case.service_status := ACTIVE"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /hhi/cases/{id}/close on the parent case"
        actor: system
        preconditions:
          - "plan.status IN {DRAFT, CLASSROOM_COORD_PENDING, READY}"
        side_effects:
          - "the superseded plan no longer blocks or enables any case transition"

  - entity: CurriculumPacingSync
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACKED
        trigger: "POST /hhi/pacing-syncs/{id}/acknowledge"
        actor: ClassroomTeacher
        preconditions:
          - "sync.ack_status IN {PENDING, DISPUTED}"
          - "X-User-ID == sync.classroom_teacher_id"
        side_effects:
          - "sync.acked_at := logical-clock instant"
          - "recompute calculations.transition_ack_counters for this case's TransitionPlan, which may fire the plan CLASSROOM_COORD_PENDING_to_READY transition"
      - from: PENDING
        to: DISPUTED
        trigger: "POST /hhi/pacing-syncs/{id}/dispute"
        actor: ClassroomTeacher
        preconditions:
          - "sync.ack_status == PENDING"
          - "X-User-ID == sync.classroom_teacher_id"
        side_effects:
          - "sync.dispute_note := payload dispute_note"
          - "recompute calculations.transition_ack_counters, which may fire the plan READY_to_CLASSROOM_COORD_PENDING transition"
      - from: DISPUTED
        to: ACKED
        trigger: "POST /hhi/pacing-syncs/{id}/acknowledge"
        actor: ClassroomTeacher
        preconditions:
          - "sync.ack_status IN {PENDING, DISPUTED}"
          - "X-User-ID == sync.classroom_teacher_id"
        side_effects:
          - "sync.acked_at := logical-clock instant; recompute calculations.transition_ack_counters"
      - from: ACKED
        to: PENDING
        trigger: "system: the parent case's funding_status enters HELD"
        actor: system
        preconditions:
          - "sync.ack_status == ACKED"
        side_effects:
          - "sync.acked_at cleared"
        note: "Conditional cascade: only ACKED rows are reset; DISPUTED rows are left untouched."

  - entity: SpedServiceLog
    initial_state: CONTINUED
    terminal_states: []
    transitions:
      - from: CONTINUED
        to: MODIFIED_VIRTUAL
        trigger: "POST /hhi/sped-service-logs/{id}/continuation with to_status == MODIFIED_VIRTUAL"
        actor: CaseManager
        preconditions:
          - "log.continuation_status == CONTINUED"
        side_effects:
          - "log.continuation_reason := payload continuation_reason; compensatory_minutes_owed recomputed"
      - from: CONTINUED
        to: SUSPENDED_PENDING_IEP
        trigger: "POST /hhi/sped-service-logs/{id}/continuation with to_status == SUSPENDED_PENDING_IEP"
        actor: CaseManager
        preconditions:
          - "log.continuation_status IN {CONTINUED, MODIFIED_VIRTUAL}"
        side_effects:
          - "delivered_cumulative_minutes is frozen: POST /hhi/sped-service-logs/{id}/record-delivery is rejected with ERR_SPED_SERVICE_SUSPENDED while suspended"
          - "any TransitionPlan for this case with status == DRAFT can no longer be coordinated (ERR_SPED_SERVICE_SUSPENDED)"
      - from: MODIFIED_VIRTUAL
        to: SUSPENDED_PENDING_IEP
        trigger: "POST /hhi/sped-service-logs/{id}/continuation with to_status == SUSPENDED_PENDING_IEP"
        actor: CaseManager
        preconditions:
          - "log.continuation_status IN {CONTINUED, MODIFIED_VIRTUAL}"
        side_effects:
          - "delivered_cumulative_minutes is frozen; compensatory_minutes_owed keeps accruing with elapsed weeks"
      - from: SUSPENDED_PENDING_IEP
        to: CONTINUED
        trigger: "POST /hhi/sped-service-logs/{id}/continuation with to_status == CONTINUED"
        actor: CaseManager
        preconditions:
          - "log.continuation_status IN {MODIFIED_VIRTUAL, SUSPENDED_PENDING_IEP}"
        side_effects:
          - "compensatory_minutes_owed recomputed against elapsed service weeks, so the suspension window is owed back"
      - from: MODIFIED_VIRTUAL
        to: CONTINUED
        trigger: "POST /hhi/sped-service-logs/{id}/continuation with to_status == CONTINUED"
        actor: CaseManager
        preconditions:
          - "log.continuation_status IN {MODIFIED_VIRTUAL, SUSPENDED_PENDING_IEP}"
        side_effects:
          - "compensatory_minutes_owed recomputed"

concurrency_rules:
  - rule_id: cert-create-stale-case
    parent_entity: HomeboundCase
    write_endpoint: "POST /hhi/certifications"
    occ_field: "expected_case_version"
    description: |
      Submitting a PhysicianCertification against a HomeboundCase whose version has advanced since
      the client last read it is rejected. Certification acceptance legitimately supersedes the prior
      current certification and rewrites the case's certified window, diagnosis_category, and
      weekly_entitled_minutes, so a submitter working from a stale view of the case would re-anchor
      an eligibility window it never observed.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: extension-request-create-stale-case
    parent_entity: HomeboundCase
    write_endpoint: "POST /hhi/extension-requests"
    occ_field: "expected_case_version"
    description: |
      Creating an ExtensionRequest against a HomeboundCase whose version has advanced since the client
      last read it is rejected. An approved extension shifts certified_end_date forward from whatever
      value the case currently holds, and that value is itself rewritten by certification acceptance
      and by a prior approved extension, so a stale view would derive the new window from a superseded
      baseline.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: transition-plan-create-stale-case
    parent_entity: HomeboundCase
    write_endpoint: "POST /hhi/transition-plans"
    occ_field: "expected_case_version"
    description: |
      Creating a TransitionPlan against a HomeboundCase whose version has advanced since the client
      last read it is rejected. A new plan legitimately supersedes prior planning state and moves the
      case out of ACTIVE, so a planner whose view predates an intervening certification acceptance,
      extension decision, or funding change would commit a return date derived from a window that no
      longer holds.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

calculations:
  - name: weekly_entitlement_minutes
    trigger: "PhysicianCertification SUBMITTED_to_ACCEPTED (which drives HomeboundCase PENDING_CERT_REVIEW_to_ELIGIBLE); HomeVisitSafetyReview DRAFT_to_FINALIZED when the resulting clearance == VIRTUAL_ONLY; ExtensionRequest UNDER_REVIEW_to_APPROVED"
    algorithm: threshold
    formula: |
      rule = the EntitlementRule row with status == PUBLISHED,
             grade_band == student.grade_band, delivery_mode == case.delivery_mode
      dx_factor = DX_FACTOR[case.diagnosis_category]
      effective_absence_days = current_certification.expected_absence_days
                             + sum(requested_additional_days over this case's ExtensionRequest rows with status == APPROVED)
      duration_bonus = LONG_DURATION_BONUS_MINUTES   if effective_absence_days >= LONG_DURATION_DAYS
                       else MID_DURATION_BONUS_MINUTES if effective_absence_days >= MID_DURATION_DAYS
                       else 0
      sped_floor = round_half_up(student.iep_service_minutes_weekly * SPED_FLOOR_FACTOR)
                   if student.special_ed_status == IEP else 0
      adjusted = round_half_up(rule.base_weekly_minutes * dx_factor) + duration_bonus
      weekly_entitled_minutes = min(max(adjusted, sped_floor), rule.cap_weekly_minutes)
    input_set: "Exactly one EntitlementRule row (status == PUBLISHED) keyed by (student.grade_band, case.delivery_mode); the single PhysicianCertification with is_current == true and status == ACCEPTED; this case's ExtensionRequest rows with status == APPROVED (all of them, no time window). No RETIRED rule ever participates; when no PUBLISHED rule matches, the operation fails with ERR_NO_PUBLISHED_ENTITLEMENT_RULE."
    constants:
      DX_FACTOR:
        MEDICAL_ACUTE: 1.00
        MEDICAL_CHRONIC: 1.00
        PSYCHIATRIC: 0.80
        PREGNANCY_POSTPARTUM: 0.90
        INJURY_REHAB: 1.00
      MID_DURATION_DAYS: 30
      MID_DURATION_BONUS_MINUTES: 30
      LONG_DURATION_DAYS: 60
      LONG_DURATION_BONUS_MINUTES: 60
      SPED_FLOOR_FACTOR: 0.60
    precision: "whole minutes; round_half_up applied once to (base_weekly_minutes * dx_factor) and once to the sped_floor product, before the bonus is added and before min/max clamping"

  - name: session_credited_minutes
    trigger: "InstructionSession SCHEDULED_to_DELIVERED (POST /hhi/sessions/{id}/log with outcome == DELIVERED)"
    algorithm: threshold
    formula: |
      rule = the EntitlementRule referenced by case.entitlement_rule_id
      capped = min(session.actual_minutes, rule.max_session_minutes)
      raw = capped * VIRTUAL_CREDIT_FACTOR   if session.delivery_mode == VIRTUAL_SYNC
            else capped
      credited_minutes = round_half_up(raw / CREDIT_ROUNDING_STEP) * CREDIT_ROUNDING_STEP
    input_set: "One InstructionSession row transitioning SCHEDULED -> DELIVERED. Rounding is applied per session, at logging time, before the value is written to AttendanceLedgerEntry.apportionment_minutes; no cross-session aggregation participates."
    constants:
      VIRTUAL_CREDIT_FACTOR: 0.90
      CREDIT_ROUNDING_STEP: 5
    precision: "whole minutes, rounded half up to the nearest multiple of 5, once per session"
    variants:
      - name: PER_SESSION_ROUNDED
        when: "Always, for session.credited_minutes and AttendanceLedgerEntry.apportionment_minutes (the authoritative ledger values)"
        difference: "Each session is rounded to the nearest 5 minutes independently, then the ledger sums the rounded values"
      - name: WEEKLY_UNROUNDED_PROJECTION
        when: "Only for the read-model field projected_unrounded_minutes returned by GET /hhi/cases/{id}/funding-summary"
        difference: "Sums the un-rounded raw values across all DELIVERED sessions of the case and applies the round-half-up-to-5 step exactly once at the end, so identical data diverges from the sum of credited_minutes whenever per-session rounding accumulates (e.g. two VIRTUAL_SYNC sessions of actual_minutes 75 give credited_minutes 70 + 70 = 140 but projected_unrounded_minutes 135)"

  - name: case_apportionment_minutes
    trigger: "POST /hhi/cases/{id}/funding/report writes the PROVISIONAL_ACCRUAL variant into case.provisional_apportionment_minutes; POST /hhi/cases/{id}/funding/reconcile consumes the FINAL_VERIFIED variant via calculations.funding_reconciliation_net"
    algorithm: chronological
    formula: |
      weekly_cap = case.weekly_entitled_minutes
      window_weeks = ceil(((case.certified_end_date - case.service_start_date).days + 1) / 7)
      # PROVISIONAL_ACCRUAL
      provisional_raw = sum over the provisional input set of
          (session.credited_minutes                    if session.status == DELIVERED
           else round_half_up(min(session.scheduled_minutes, rule.max_session_minutes)
                              * (0.90 if session.delivery_mode == VIRTUAL_SYNC else 1.00) / 5) * 5)
      provisional_apportionment_minutes = min(provisional_raw, weekly_cap * window_weeks)
      # FINAL_VERIFIED
      bucket = {}                       # keyed by ISO-8601 week of session.service_date
      accepted = 0
      for session in final input set ordered by service_date ASC, then created_at ASC:
          room = weekly_cap - bucket.get(iso_week(session.service_date), 0)
          take = min(session.credited_minutes, max(0, room))
          bucket[iso_week(session.service_date)] += take
          accepted += take           # any excess above the weekly cap is dropped, not carried forward
      final_verified_minutes = accepted
    input_set: |
      PROVISIONAL_ACCRUAL input set: this case's InstructionSession rows with status IN {SCHEDULED, DELIVERED}
      and service_date between case.service_start_date and case.certified_end_date inclusive on both ends.
      FINAL_VERIFIED input set: this case's InstructionSession rows with status == DELIVERED AND verified_at
      not null, service_date between case.service_start_date and case.certified_end_date inclusive on both
      ends, processed in service_date ASC then created_at ASC order. VOIDED, CANCELLED_ADMIN,
      STUDENT_UNAVAILABLE, TEACHER_CANCELLED and SAFETY_ABORTED sessions are excluded from both sets;
      DELIVERED-but-unverified sessions are excluded from FINAL_VERIFIED only.
    constants:
      WEEKLY_BUCKET: "ISO-8601 week (Monday-start) of session.service_date"
    precision: "whole minutes; the per-session rounding of calculations.session_credited_minutes has already been applied, and no further rounding occurs"
    variants:
      - name: PROVISIONAL_ACCRUAL
        when: "POST /hhi/cases/{id}/funding/report, while the case is being served"
        difference: "Forward-looking: counts still-SCHEDULED sessions at their projected credit and ignores verification entirely; capped once against weekly_cap * window_weeks over the whole certified window rather than week by week"
      - name: FINAL_VERIFIED
        when: "POST /hhi/cases/{id}/funding/reconcile, at closeout"
        difference: "Chronological: counts only DELIVERED sessions that carry verified_at, walks them in service_date then created_at order, and enforces weekly_cap inside each ISO week, dropping the per-week excess — so identical data yields a strictly smaller result than PROVISIONAL_ACCRUAL whenever sessions cluster inside one ISO week or remain unverified"

  - name: funding_reconciliation_net
    trigger: "POST /hhi/cases/{id}/funding/reconcile (HomeboundCase funding_status ACCRUING_to_RECONCILED or ACCRUING_to_FORFEITED)"
    algorithm: tiered_pricing
    formula: |
      raw_final = calculations.case_apportionment_minutes variant FINAL_VERIFIED
      elapsed_weeks = ceil(((clock_date - case.service_start_date).days + 1) / 7)
      window_weeks = ceil(((case.certified_end_date - case.service_start_date).days + 1) / 7)
      service_weeks = min(elapsed_weeks, window_weeks)
      entitled_total = case.weekly_entitled_minutes * service_weeks
      delivery_ratio_pct = 0.00 if entitled_total == 0
                           else round_half_up(raw_final / entitled_total, 2)
      if   delivery_ratio_pct >= FULL_CREDIT_RATIO:    recapture_rate = 0.00
      elif delivery_ratio_pct >= PARTIAL_CREDIT_RATIO: recapture_rate = 0.10
      elif delivery_ratio_pct >= FORFEIT_RATIO:        recapture_rate = 0.25
      else:                                            recapture_rate = FORFEIT
      if recapture_rate == FORFEIT:
          final_apportionment_minutes = raw_final
          recapture_minutes           = raw_final
          net_apportionment_minutes   = 0
          funding_status              = FORFEITED
      else:
          shortfall                   = max(0, entitled_total - raw_final)
          final_apportionment_minutes = raw_final
          recapture_minutes           = round_half_up(shortfall * recapture_rate)
          net_apportionment_minutes   = max(0, raw_final - recapture_minutes)
          funding_status              = RECONCILED
    input_set: "One HomeboundCase; the FINAL_VERIFIED apportionment over its InstructionSession rows as defined by calculations.case_apportionment_minutes; the logical clock date at the moment of reconciliation. delivery_ratio_pct is computed on raw_final BEFORE recapture, never on the net."
    constants:
      FULL_CREDIT_RATIO: 0.90
      PARTIAL_CREDIT_RATIO: 0.75
      FORFEIT_RATIO: 0.50
    precision: "delivery_ratio_pct to 2 decimal places round_half_up; recapture_minutes to whole minutes round_half_up; all comparisons use the 2-decimal ratio, so a ratio of exactly 0.50 lands in the 0.25 recapture band and does NOT forfeit"

  - name: home_visit_risk_score
    trigger: "POST /hhi/safety-reviews (initial score) and HomeVisitSafetyReview DRAFT_to_FINALIZED (authoritative re-score and clearance banding)"
    algorithm: weighted_scoring
    formula: |
      raw = sum(HAZARD_WEIGHT[h] for h in review.hazard_findings)      # findings are distinct
      if review.scoring_variant == SELF_REPORTED:
          risk_score = min(100, round_half_up(raw * SELF_REPORT_DISCOUNT))
      else:  # ONSITE_VERIFIED
          risk_score = min(100, max(0, raw - (ESCORT_MITIGATION if review.escort_available else 0)))
      clearance = BLOCKED             if risk_score >= BLOCK_THRESHOLD
                  else VIRTUAL_ONLY   if risk_score >= VIRTUAL_ONLY_THRESHOLD
                  else CLEARED_WITH_ESCORT if risk_score >= ESCORT_THRESHOLD
                  else CLEARED
    input_set: "One HomeVisitSafetyReview row and its distinct hazard_findings members; no other entity participates."
    constants:
      HAZARD_WEIGHT:
        AGGRESSIVE_ANIMAL: 25
        NO_SECONDARY_EXIT: 15
        WEAPON_PRESENT_UNSECURED: 40
        SMOKE_OR_AIR_QUALITY: 10
        ACTIVE_INFECTION_RISK: 30
        UNLIT_ACCESS: 5
        NO_ADULT_PRESENT: 20
      SELF_REPORT_DISCOUNT: 0.75
      ESCORT_MITIGATION: 10
      ESCORT_THRESHOLD: 15
      VIRTUAL_ONLY_THRESHOLD: 35
      BLOCK_THRESHOLD: 60
    precision: "whole points, round_half_up applied once to the discounted product; band comparisons are all >= (inclusive lower bound)"
    variants:
      - name: SELF_REPORTED
        when: "review.evidence_source == PARENT_ATTESTATION"
        difference: "Applies a 0.75 discount to the summed hazard weights and ignores escort_available entirely"
      - name: ONSITE_VERIFIED
        when: "review.evidence_source == ONSITE_WALKTHROUGH"
        difference: "Uses the undiscounted hazard sum and subtracts a flat 10-point escort mitigation when escort_available is true — so the same hazard set {AGGRESSIVE_ANIMAL, NO_SECONDARY_EXIT, UNLIT_ACCESS} with escort_available true scores 34 (CLEARED_WITH_ESCORT) as SELF_REPORTED but 35 (VIRTUAL_ONLY) as ONSITE_VERIFIED"

  - name: assignment_minute_allocation
    trigger: "TeacherAssignment PROPOSED_to_ACTIVE, TeacherAssignment ACTIVE_to_RELEASED, HomeboundCase PENDING_CERT_REVIEW_to_ELIGIBLE, ExtensionRequest UNDER_REVIEW_to_APPROVED, HomeVisitSafetyReview DRAFT_to_FINALIZED with clearance VIRTUAL_ONLY"
    algorithm: waterfall_allocation
    formula: |
      active = this case's TeacherAssignment rows with status == ACTIVE,
               ordered by ROLE_RANK[role] ASC, then created_at ASC
      support_rows = active rows with role == SUPPORT
      sped_rows    = active rows with role == SPED_SERVICE       # always allocated 0
      primary_row  = the single active row with role == PRIMARY   # uniqueness enforced by ERR_DUPLICATE_PRIMARY_ASSIGNMENT
      if support_rows is empty:
          support_total = 0
      else:
          per_support = round_half_up((case.weekly_entitled_minutes * SUPPORT_SHARE)
                                      / count(support_rows) / ALLOC_ROUNDING_STEP) * ALLOC_ROUNDING_STEP
          each support row.weekly_committed_minutes = per_support
          support_total = per_support * count(support_rows)
      each sped row.weekly_committed_minutes = 0
      primary_row.weekly_committed_minutes = case.weekly_entitled_minutes - support_total
      # invariant: sum of weekly_committed_minutes over active == case.weekly_entitled_minutes exactly
    input_set: "This case's TeacherAssignment rows with status == ACTIVE only (PROPOSED, DECLINED and RELEASED rows are excluded and always hold weekly_committed_minutes 0), ordered by ROLE_RANK then created_at ASC. When no ACTIVE PRIMARY row exists the allocation writes nothing and every ACTIVE row keeps 0."
    constants:
      PRIMARY_SHARE: 0.70
      SUPPORT_SHARE: 0.30
      ALLOC_ROUNDING_STEP: 5
      ROLE_RANK:
        PRIMARY: 1
        SUPPORT: 2
        SPED_SERVICE: 3
    precision: "whole minutes; SUPPORT rows round half up to the nearest 5 and the PRIMARY row absorbs the entire rounding residual so the sum is exact (e.g. weekly_entitled_minutes 390 with one SUPPORT row gives SUPPORT 115 and PRIMARY 275; 270 gives SUPPORT 80 and PRIMARY 190)"

  - name: service_gap_minutes
    trigger: "Any AttendanceLedgerEntry write (InstructionSession SCHEDULED_to_DELIVERED, SCHEDULED_to_STUDENT_UNAVAILABLE, SCHEDULED_to_TEACHER_CANCELLED, SCHEDULED_to_SAFETY_ABORTED, DELIVERED_to_VOIDED) and POST /hhi/cases/{id}/funding/report"
    algorithm: threshold
    formula: |
      completed_service_weeks = floor((clock_date - case.service_start_date).days / 7)
      expected_to_date = case.weekly_entitled_minutes * completed_service_weeks
      service_gap_minutes = max(0, expected_to_date - case.reported_apportionment_minutes)
      # threshold trigger on the parallel funding dimension
      if service_gap_minutes >= case.weekly_entitled_minutes and case.funding_status IN {ACCRUING, RECONCILED}:
          funding_status = HELD
      if service_gap_minutes <  case.weekly_entitled_minutes and case.funding_status == HELD:
          funding_status = ACCRUING
    input_set: "One HomeboundCase, its reported_apportionment_minutes (the running sum over ALL of this case's AttendanceLedgerEntry rows including negative HB_REVERSAL rows, with no time window), and the logical clock date. Cases with service_start_date null (service_status IN {DRAFT, PENDING_CERT_REVIEW, ELIGIBLE, DENIED}) always hold service_gap_minutes 0."
    constants:
      BREACH_MULTIPLE: 1
    precision: "whole minutes; completed_service_weeks uses floor (a partial week contributes no expected minutes); the breach comparison is >= exactly one weekly entitlement"

  - name: sped_compensatory_minutes
    trigger: "POST /hhi/sped-service-logs, POST /hhi/sped-service-logs/{id}/record-delivery, and every SpedServiceLog continuation_status transition"
    algorithm: aggregation
    formula: |
      weeks_elapsed = floor((clock_date - case.service_start_date).days / 7)   # 0 when service_start_date is null
      compensatory_minutes_owed = max(0, log.required_weekly_minutes * weeks_elapsed
                                         - log.delivered_cumulative_minutes)
    input_set: "One SpedServiceLog row; delivered_cumulative_minutes is the running total of minutes accepted by POST /hhi/sped-service-logs/{id}/record-delivery, which is rejected while continuation_status == SUSPENDED_PENDING_IEP — so a suspension window freezes the numerator and grows the owed balance."
    constants:
      WEEK_DAYS: 7
    precision: "whole minutes; weeks_elapsed uses floor of whole 7-day spans since case.service_start_date"

  - name: attendance_code_assignment
    trigger: "Every AttendanceLedgerEntry insertion (all InstructionSession outcome transitions and DELIVERED_to_VOIDED)"
    algorithm: projection
    formula: |
      if session transition is DELIVERED_to_VOIDED:                    code = HB_REVERSAL
      elif session.status == DELIVERED and session.delivery_mode == IN_HOME:      code = HB_PRESENT
      elif session.status == DELIVERED and session.delivery_mode == VIRTUAL_SYNC: code = HB_VIRTUAL_PRESENT
      elif session.status == STUDENT_UNAVAILABLE and absence_kind == MEDICAL:     code = HB_ABSENT_MEDICAL
      elif session.status == STUDENT_UNAVAILABLE and absence_kind == UNEXCUSED:   code = HB_ABSENT_UNEXCUSED
      else:  # TEACHER_CANCELLED or SAFETY_ABORTED                                code = HB_NOT_SERVED
      apportionment_minutes = session.credited_minutes                if code IN {HB_PRESENT, HB_VIRTUAL_PRESENT}
                              else -1 * reversed_entry.apportionment_minutes if code == HB_REVERSAL
                              else 0
    input_set: "The single InstructionSession being transitioned plus, for HB_REVERSAL only, the AttendanceLedgerEntry with the largest created_at among this session's rows whose attendance_code IN {HB_PRESENT, HB_VIRTUAL_PRESENT} — that row's id becomes reversal_of_entry_id."
    constants:
      NO_CREDIT_CODES: [HB_ABSENT_MEDICAL, HB_ABSENT_UNEXCUSED, HB_NOT_SERVED]
    precision: "whole minutes; AttendanceLedgerEntry rows are append-only and never updated"

  - name: teacher_committed_minutes
    trigger: "TeacherAssignment PROPOSED_to_ACTIVE, TeacherAssignment ACTIVE_to_RELEASED, and every recomputation of calculations.assignment_minute_allocation"
    algorithm: aggregation
    formula: |
      committed_weekly_minutes = sum(weekly_committed_minutes
                                     over TeacherAssignment rows with teacher_id == teacher.id
                                     and status == ACTIVE)
      over_cap = committed_weekly_minutes > teacher.max_weekly_caseload_minutes
    input_set: "All TeacherAssignment rows with status == ACTIVE for this teacher, across every case, with no time window. PROPOSED, DECLINED and RELEASED rows never contribute."
    constants:
      CAP_COMPARISON: "strictly greater than max_weekly_caseload_minutes sets over_cap"
    precision: "whole minutes; recomputed as a full re-sum (never an incremental delta) so accept/release pairs are exactly conservative"

  - name: transition_ack_counters
    trigger: "POST /hhi/pacing-syncs, POST /hhi/pacing-syncs/{id}/acknowledge, POST /hhi/pacing-syncs/{id}/dispute, POST /hhi/transition-plans/{id}/coordinate, and HomeboundCase funding_status ACCRUING_to_HELD / RECONCILED_to_HELD"
    algorithm: constraint_propagation
    formula: |
      required_ack_count   = count(CurriculumPacingSync rows with case_id == plan.case_id
                                   and ack_status IN {PENDING, ACKED, DISPUTED})
      classroom_ack_count  = count(CurriculumPacingSync rows with case_id == plan.case_id
                                   and ack_status == ACKED)
      if plan.status == CLASSROOM_COORD_PENDING
         and required_ack_count >= 1
         and classroom_ack_count == required_ack_count
         and case.funding_status != HELD:
             plan.status = READY
      if plan.status == READY
         and (classroom_ack_count < required_ack_count or case.funding_status == HELD):
             plan.status = CLASSROOM_COORD_PENDING
    input_set: "The one TransitionPlan for this case with status IN {DRAFT, CLASSROOM_COORD_PENDING, READY} (at most one exists by construction) and all CurriculumPacingSync rows sharing its case_id, with no time window; plus the parent case's funding_status."
    constants:
      MIN_REQUIRED_ACKS: 1
    precision: "integer counts; the guard reaches a fixed point in one pass because neither counter depends on plan.status"

validations:
  # ---- priority 1: authentication ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- priority 2: authorization ----
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # ---- priority 3: payload shape ----
  - priority: 3
    category: existence
    check: "request body and query conform to the endpoint's input schema: every required field present, no unknown field, enum values members of the declared set, integers inside declared ranges, dates formatted YYYY-MM-DD, datetimes ISO 8601 UTC, physician_npi exactly 10 digits, hazard_findings free of duplicates, limit in [1,100], offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  # ---- priority 4: path existence, left to right ----
  - priority: 4
    category: existence
    check: "the Student id in the path exists"
    error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/students/{id}, POST /hhi/students/{id}/enrollment"
  - priority: 4
    category: existence
    check: "the Teacher id in the path exists"
    error_id: ERR_TEACHER_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/teachers/{id}, PATCH /hhi/teachers/{id}/clearance"
  - priority: 4
    category: existence
    check: "the EntitlementRule id in the path exists"
    error_id: ERR_ENTITLEMENT_RULE_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/entitlement-rules/{id}, POST /hhi/entitlement-rules/{id}/retire"
  - priority: 4
    category: existence
    check: "the HomeboundCase id in the path exists"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all /hhi/cases/{id}... endpoints"
  - priority: 4
    category: existence
    check: "the PhysicianCertification id in the path exists"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/certifications/{id}, POST /hhi/certifications/{id}/review"
  - priority: 4
    category: existence
    check: "the TeacherAssignment id in the path exists"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/assignments/{id}, POST /hhi/assignments/{id}/accept|decline|release"
  - priority: 4
    category: existence
    check: "the InstructionSession id in the path exists"
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/sessions/{id}, POST /hhi/sessions/{id}/log|verify|void|cancel|makeup"
  - priority: 4
    category: existence
    check: "the HomeVisitSafetyReview id in the path exists"
    error_id: ERR_SAFETY_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/safety-reviews/{id}, POST /hhi/safety-reviews/{id}/finalize"
  - priority: 4
    category: existence
    check: "the ExtensionRequest id in the path exists"
    error_id: ERR_EXTENSION_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/extension-requests/{id}, POST /hhi/extension-requests/{id}/start-review|request-info|resubmit|decide"
  - priority: 4
    category: existence
    check: "the TransitionPlan id in the path exists"
    error_id: ERR_TRANSITION_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/transition-plans/{id}, POST /hhi/transition-plans/{id}/coordinate|complete|abort"
  - priority: 4
    category: existence
    check: "the CurriculumPacingSync id in the path exists"
    error_id: ERR_PACING_SYNC_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/pacing-syncs/{id}, POST /hhi/pacing-syncs/{id}/acknowledge|dispute"
  - priority: 4
    category: existence
    check: "the SpedServiceLog id in the path exists"
    error_id: ERR_SPED_LOG_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/sped-service-logs/{id}, POST /hhi/sped-service-logs/{id}/record-delivery|continuation"
  - priority: 4
    category: existence
    check: "the AttendanceLedgerEntry id in the path exists"
    error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /hhi/attendance-entries/{id}"

  # ---- priority 5: body foreign-key existence ----
  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row of its declared parent entity, checked in the order student_id, teacher_id, case_id, certification_id, assignment_id, session_id, classroom_teacher_id"
    error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /hhi/cases (student_id)"
  - priority: 5
    category: existence
    check: "teacher_id / classroom_teacher_id supplied in the body resolves to an existing Teacher"
    error_id: ERR_TEACHER_NOT_FOUND
    http_status: 404
    applies_to: "POST /hhi/assignments (teacher_id), POST /hhi/pacing-syncs (classroom_teacher_id)"
  - priority: 5
    category: existence
    check: "case_id supplied in the body resolves to an existing HomeboundCase"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "POST /hhi/certifications, POST /hhi/assignments, POST /hhi/safety-reviews, POST /hhi/sessions, POST /hhi/extension-requests, POST /hhi/transition-plans, POST /hhi/pacing-syncs, POST /hhi/sped-service-logs"
  - priority: 5
    category: existence
    check: "certification_id supplied in the body resolves to an existing PhysicianCertification"
    error_id: ERR_CERTIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /hhi/extension-requests, POST /hhi/extension-requests/{id}/resubmit"
  - priority: 5
    category: existence
    check: "assignment_id supplied in the body resolves to an existing TeacherAssignment"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"

  # ---- priority 6: resource ownership for entity-backed roles ----
  - priority: 6
    category: auth
    check: "when X-User-Role == HomeboundTeacher, X-User-ID equals the teacher_id of the TeacherAssignment being acted on (accept, decline) or of the assignment referenced by the InstructionSession being logged"
    error_id: ERR_NOT_ASSIGNED_TEACHER
    http_status: 403
    applies_to: "POST /hhi/assignments/{id}/accept, POST /hhi/assignments/{id}/decline, POST /hhi/sessions/{id}/log"
  - priority: 6
    category: auth
    check: "when X-User-Role == ClassroomTeacher, X-User-ID equals CurriculumPacingSync.classroom_teacher_id"
    error_id: ERR_NOT_CLASSROOM_TEACHER_OF_RECORD
    http_status: 403
    applies_to: "POST /hhi/pacing-syncs/{id}/acknowledge, POST /hhi/pacing-syncs/{id}/dispute"

  # ---- priority 7: optimistic concurrency ----
  - priority: 7
    category: state
    check: "expected_case_version equals the current HomeboundCase.version (see §1.2.1 concurrency_rules cert-create-stale-case, extension-request-create-stale-case, transition-plan-create-stale-case)"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /hhi/certifications, POST /hhi/extension-requests, POST /hhi/transition-plans"

  # ---- priority 8: state preconditions ----
  - priority: 8
    category: state
    check: "HomeboundCase.service_status is one of the from-states declared for the requested transition in §1.2"
    error_id: ERR_INVALID_CASE_STATE
    http_status: 409
    applies_to: "POST /hhi/cases/{id}/activate, POST /hhi/cases/{id}/close, POST /hhi/cases/{id}/deny, POST /hhi/certifications, POST /hhi/extension-requests, POST /hhi/transition-plans, POST /hhi/cases/{id}/funding/report, POST /hhi/cases/{id}/funding/reconcile"
  - priority: 8
    category: state
    check: "HomeboundCase.service_status IN {ACTIVE, EXTENSION_PENDING, TRANSITION_PLANNED} for child records that presuppose an in-service case"
    error_id: ERR_CASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hhi/sessions, POST /hhi/pacing-syncs, POST /hhi/sped-service-logs, POST /hhi/sessions/{id}/makeup"
  - priority: 8
    category: state
    check: "InstructionSession.status == SCHEDULED when logging an outcome or cancelling"
    error_id: ERR_SESSION_ALREADY_LOGGED
    http_status: 409
    applies_to: "POST /hhi/sessions/{id}/log, POST /hhi/sessions/{id}/cancel"
  - priority: 8
    category: state
    check: "InstructionSession.status == DELIVERED when verifying or voiding"
    error_id: ERR_SESSION_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /hhi/sessions/{id}/verify, POST /hhi/sessions/{id}/void"
  - priority: 8
    category: state
    check: "InstructionSession.verified_at is null when verifying"
    error_id: ERR_SESSION_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /hhi/sessions/{id}/verify"
  - priority: 8
    category: state
    check: "PhysicianCertification.status == SUBMITTED when reviewing"
    error_id: ERR_CERT_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /hhi/certifications/{id}/review"
  - priority: 8
    category: state
    check: "TeacherAssignment.status == PROPOSED when accepting or declining"
    error_id: ERR_ASSIGNMENT_NOT_PROPOSED
    http_status: 409
    applies_to: "POST /hhi/assignments/{id}/accept, POST /hhi/assignments/{id}/decline"
  - priority: 8
    category: state
    check: "TeacherAssignment.status == ACTIVE when releasing it or when it is referenced by a new session"
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hhi/assignments/{id}/release, POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 8
    category: state
    check: "no InstructionSession referencing this TeacherAssignment has status == SCHEDULED when releasing"
    error_id: ERR_ASSIGNMENT_HAS_SCHEDULED_SESSIONS
    http_status: 409
    applies_to: "POST /hhi/assignments/{id}/release"
  - priority: 8
    category: state
    check: "ExtensionRequest.status matches the from-state of the requested transition (SUBMITTED for start-review, UNDER_REVIEW for request-info and decide, INFO_REQUESTED for resubmit)"
    error_id: ERR_EXTENSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /hhi/extension-requests/{id}/start-review, POST /hhi/extension-requests/{id}/request-info, POST /hhi/extension-requests/{id}/resubmit, POST /hhi/extension-requests/{id}/decide"
  - priority: 8
    category: state
    check: "ExtensionRequest.resubmit_count < 2 when resubmitting"
    error_id: ERR_EXTENSION_RESUBMIT_LIMIT
    http_status: 409
    applies_to: "POST /hhi/extension-requests/{id}/resubmit"
  - priority: 8
    category: state
    check: "TransitionPlan.status == READY when completing"
    error_id: ERR_PLAN_NOT_READY
    http_status: 409
    applies_to: "POST /hhi/transition-plans/{id}/complete"
  - priority: 8
    category: state
    check: "TransitionPlan.status == DRAFT when coordinating and IN {DRAFT, CLASSROOM_COORD_PENDING, READY} when aborting"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /hhi/transition-plans/{id}/coordinate, POST /hhi/transition-plans/{id}/abort"
  - priority: 8
    category: state
    check: "CurriculumPacingSync.ack_status IN {PENDING, DISPUTED} when acknowledging and == PENDING when disputing"
    error_id: ERR_PACING_ALREADY_ACKED
    http_status: 409
    applies_to: "POST /hhi/pacing-syncs/{id}/acknowledge, POST /hhi/pacing-syncs/{id}/dispute"
  - priority: 8
    category: state
    check: "the requested SpedServiceLog continuation transition is declared in §1.2 for the current continuation_status (no self-transition)"
    error_id: ERR_SPED_CONTINUATION_INVALID
    http_status: 409
    applies_to: "POST /hhi/sped-service-logs/{id}/continuation"
  - priority: 8
    category: state
    check: "HomeboundCase.funding_status == ACCRUING when reconciling"
    error_id: ERR_FUNDING_NOT_ACCRUING
    http_status: 409
    applies_to: "POST /hhi/cases/{id}/funding/reconcile"
  - priority: 8
    category: state
    check: "HomeboundCase.funding_status != RECONCILED when reconciling; a case already reconciled is rejected with the more specific code"
    error_id: ERR_FUNDING_ALREADY_RECONCILED
    http_status: 409
    applies_to: "POST /hhi/cases/{id}/funding/reconcile"
  - priority: 8
    category: state
    check: "HomeVisitSafetyReview.status == DRAFT when finalizing"
    error_id: ERR_REVIEW_ALREADY_FINALIZED
    http_status: 409
    applies_to: "POST /hhi/safety-reviews/{id}/finalize"
  - priority: 8
    category: state
    check: "EntitlementRule.status == PUBLISHED when retiring"
    error_id: ERR_RULE_ALREADY_RETIRED
    http_status: 409
    applies_to: "POST /hhi/entitlement-rules/{id}/retire"
  - priority: 8
    category: state
    check: "no PhysicianCertification for this case has status == SUBMITTED when submitting a new one; evaluated
      before ERR_INVALID_CASE_STATE within priority 8, so a second submission while the case sits in
      PENDING_CERT_REVIEW is rejected with this more specific code"
    error_id: ERR_CERT_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /hhi/certifications"

  # ---- priority 9: segregation of duties ----
  - priority: 9
    category: auth
    check: "X-User-ID differs from HomeboundCase.created_by_user_id when verifying one of that case's sessions, and differs from ExtensionRequest.submitted_by_user_id when deciding that request"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hhi/sessions/{id}/verify, POST /hhi/extension-requests/{id}/decide"

  # ---- priority 10: safety and compliance ----
  - priority: 10
    category: business_safety
    check: "a HomeVisitSafetyReview with status == FINALIZED exists for the case when activating an IN_HOME or HYBRID case, or when scheduling an IN_HOME session"
    error_id: ERR_SAFETY_REVIEW_MISSING
    http_status: 422
    applies_to: "POST /hhi/cases/{id}/activate, POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 10
    category: business_safety
    check: "the FINALIZED HomeVisitSafetyReview has expires_on >= the session's service_date when scheduling an IN_HOME session"
    error_id: ERR_SAFETY_REVIEW_EXPIRED
    http_status: 422
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 10
    category: business_safety
    check: "the FINALIZED HomeVisitSafetyReview clearance != BLOCKED"
    error_id: ERR_SAFETY_CLEARANCE_BLOCKED
    http_status: 422
    applies_to: "POST /hhi/cases/{id}/activate, POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 10
    category: business_safety
    check: "delivery_mode == IN_HOME is rejected when case.delivery_mode == VIRTUAL_SYNC or when the FINALIZED review clearance == VIRTUAL_ONLY"
    error_id: ERR_IN_HOME_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 10
    category: business_safety
    check: "the assignment's Teacher has safety_clearance_status != EXPIRED, and home_visit_eligible == true when the session delivery_mode == IN_HOME"
    error_id: ERR_TEACHER_CLEARANCE_EXPIRED
    http_status: 422
    applies_to: "POST /hhi/assignments/{id}/accept, POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 10
    category: business_safety
    check: "escort_confirmed == true in the payload when case.escort_required == true and the session delivery_mode == IN_HOME"
    error_id: ERR_ESCORT_REQUIRED_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"

  # ---- priority 11: uniqueness and constraint satisfaction ----
  - priority: 11
    category: business_constraint
    check: "student_number is not already used by another Student"
    error_id: ERR_DUPLICATE_STUDENT_NUMBER
    http_status: 409
    applies_to: "POST /hhi/students"
  - priority: 11
    category: business_constraint
    check: "no other EntitlementRule with status == PUBLISHED shares this (grade_band, delivery_mode) pair"
    error_id: ERR_DUPLICATE_ENTITLEMENT_RULE
    http_status: 409
    applies_to: "POST /hhi/entitlement-rules"
  - priority: 11
    category: business_constraint
    check: "no other TeacherAssignment for this case has role == PRIMARY and status IN {PROPOSED, ACTIVE}"
    error_id: ERR_DUPLICATE_PRIMARY_ASSIGNMENT
    http_status: 409
    applies_to: "POST /hhi/assignments"
  - priority: 11
    category: business_constraint
    check: "no other CurriculumPacingSync for this case shares the same subject"
    error_id: ERR_DUPLICATE_PACING_SUBJECT
    http_status: 409
    applies_to: "POST /hhi/pacing-syncs"
  - priority: 11
    category: business_constraint
    check: "no other SpedServiceLog for this case shares the same service_type"
    error_id: ERR_DUPLICATE_SPED_SERVICE_TYPE
    http_status: 409
    applies_to: "POST /hhi/sped-service-logs"
  - priority: 11
    category: business_constraint
    check: "the student has no other HomeboundCase with service_status NOT IN {CLOSED, DENIED}"
    error_id: ERR_OPEN_CASE_EXISTS
    http_status: 409
    applies_to: "POST /hhi/cases"
  - priority: 11
    category: business_constraint
    check: "scheduled_minutes is between the resolved EntitlementRule's min_session_minutes and max_session_minutes inclusive on both ends"
    error_id: ERR_SESSION_DURATION_INVALID
    http_status: 422
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 11
    category: business_constraint
    check: "an EntitlementRule with status == PUBLISHED exists for (student.grade_band, case.delivery_mode) when the case's entitlement must be resolved"
    error_id: ERR_NO_PUBLISHED_ENTITLEMENT_RULE
    http_status: 422
    applies_to: "POST /hhi/certifications/{id}/review, POST /hhi/safety-reviews/{id}/finalize"
  - priority: 11
    category: business_constraint
    check: "expected_absence_days >= 10 when accepting a certification"
    error_id: ERR_ABSENCE_DURATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /hhi/certifications/{id}/review"
  - priority: 11
    category: business_constraint
    check: "ramp_weeks == 0 when reintegration_mode == FULL_DAY and ramp_weeks >= 1 otherwise"
    error_id: ERR_RAMP_WEEKS_INVALID
    http_status: 422
    applies_to: "POST /hhi/transition-plans"

  # ---- priority 12: referential and cross-entity consistency ----
  - priority: 12
    category: business_referential
    check: "the referenced TeacherAssignment.case_id equals the case_id supplied for the session (and, on makeup, equals the missed session's case_id)"
    error_id: ERR_ASSIGNMENT_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 12
    category: business_referential
    check: "the referenced PhysicianCertification.case_id equals the case_id of the extension request"
    error_id: ERR_CERT_CASE_MISMATCH
    http_status: 422
    applies_to: "POST /hhi/extension-requests, POST /hhi/extension-requests/{id}/resubmit"
  - priority: 12
    category: business_referential
    check: "Student.enrollment_status == ENROLLED"
    error_id: ERR_STUDENT_NOT_ENROLLED
    http_status: 422
    applies_to: "POST /hhi/cases, POST /hhi/certifications, POST /hhi/cases/{id}/activate"
  - priority: 12
    category: business_referential
    check: "the referenced PhysicianCertification.status == ACCEPTED"
    error_id: ERR_CERT_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /hhi/extension-requests, POST /hhi/extension-requests/{id}/resubmit"
  - priority: 12
    category: business_referential
    check: "certified_end_date >= certified_start_date and signature_date is not later than the logical-clock date and not earlier than certified_start_date minus 30 days"
    error_id: ERR_CERT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /hhi/certifications"
  - priority: 12
    category: business_referential
    check: "the session's service_date is between case.certified_start_date and case.certified_end_date inclusive on both ends"
    error_id: ERR_SESSION_OUTSIDE_CERT_WINDOW
    http_status: 422
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 12
    category: business_referential
    check: "at least one CurriculumPacingSync exists for the case (plan.required_ack_count >= 1) when coordinating a transition plan"
    error_id: ERR_NO_PACING_COORDINATION
    http_status: 422
    applies_to: "POST /hhi/transition-plans/{id}/coordinate"
  - priority: 12
    category: business_referential
    check: "no SpedServiceLog for this case has continuation_status == SUSPENDED_PENDING_IEP when coordinating a plan, and the target log is not SUSPENDED_PENDING_IEP when recording a delivery"
    error_id: ERR_SPED_SERVICE_SUSPENDED
    http_status: 422
    applies_to: "POST /hhi/transition-plans/{id}/coordinate, POST /hhi/sped-service-logs/{id}/record-delivery"
  - priority: 12
    category: business_referential
    check: "at least one TeacherAssignment for this case has role == PRIMARY and status == ACTIVE"
    error_id: ERR_NO_PRIMARY_ASSIGNMENT
    http_status: 422
    applies_to: "POST /hhi/cases/{id}/activate"
  - priority: 12
    category: business_referential
    check: "the session named in the makeup path has status IN {STUDENT_UNAVAILABLE, TEACHER_CANCELLED, SAFETY_ABORTED} and is not already referenced by another InstructionSession's makeup_for_session_id"
    error_id: ERR_MAKEUP_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /hhi/sessions/{id}/makeup"
  - priority: 12
    category: business_referential
    check: "when teacher_id is supplied explicitly, Teacher.grade_bands contains the student's grade_band"
    error_id: ERR_TEACHER_BAND_MISMATCH
    http_status: 422
    applies_to: "POST /hhi/assignments"

  # ---- priority 13: temporal conflicts ----
  - priority: 13
    category: business_temporal
    check: "the new session's teacher-busy interval does not overlap any other session of the same teacher whose status IN {SCHEDULED, DELIVERED}; the busy interval is half-open [scheduled_start, scheduled_end) extended on BOTH ends by the resolved rule's travel_buffer_minutes when that session's delivery_mode == IN_HOME (0 minutes of buffer for VIRTUAL_SYNC)"
    error_id: ERR_TEACHER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 13
    category: business_temporal
    check: "for the same case on the same service_date, the closed-interval gap between the new session and every existing session with status IN {SCHEDULED, DELIVERED} is >= the resolved rule's min_gap_minutes; a gap exactly equal to min_gap_minutes passes and a smaller gap (including touching endpoints) fails"
    error_id: ERR_SESSION_GAP_TOO_SHORT
    http_status: 409
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 13
    category: business_temporal
    check: "the logical-clock UTC date is >= TransitionPlan.target_return_date when completing the plan"
    error_id: ERR_RETURN_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /hhi/transition-plans/{id}/complete"

  # ---- priority 14: capacity, quota and fiscal ----
  - priority: 14
    category: business_fiscal
    check: "the sum of scheduled_minutes over this case's sessions with status IN {SCHEDULED, DELIVERED} on the same service_date, plus the new session's scheduled_minutes, is <= the resolved rule's max_daily_minutes (a total exactly equal to max_daily_minutes passes)"
    error_id: ERR_STUDENT_DAILY_LIMIT
    http_status: 422
    applies_to: "POST /hhi/sessions, POST /hhi/sessions/{id}/makeup"
  - priority: 14
    category: business_fiscal
    check: "Teacher.committed_weekly_minutes plus the allocation this assignment would receive is <= Teacher.max_weekly_caseload_minutes"
    error_id: ERR_TEACHER_CASELOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /hhi/assignments/{id}/accept"
  - priority: 14
    category: business_fiscal
    check: "HomeboundCase.extension_count < 2 when creating an extension request"
    error_id: ERR_EXTENSION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /hhi/extension-requests"
  - priority: 14
    category: business_fiscal
    check: "when teacher_id is omitted, the selector's candidate set is non-empty (eligibility filter: Teacher.safety_clearance_status == CLEARED, or IN {CLEARED, RESTRICTED} when case.delivery_mode == VIRTUAL_SYNC; Teacher.grade_bands contains student.grade_band; Teacher.home_visit_eligible == true when case.delivery_mode IN {IN_HOME, HYBRID}; committed_weekly_minutes + the allocation this role would receive <= max_weekly_caseload_minutes. Ranking: committed_weekly_minutes ASC; tie-break: created_at ASC)"
    error_id: ERR_NO_ELIGIBLE_TEACHER
    http_status: 422
    applies_to: "POST /hhi/assignments"

endpoints:
  # ---- logical clock (test-driving endpoint, §1.5 ladder rung 3) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an absolute UTC instant. The startup default is exactly 2026-08-01T00:00:00Z; until this endpoint is called the clock reads that default and never falls back to real wall-clock time. Every date window, expiry, elapsed-week and gap rule in this scaffold reads this clock."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock now reads to_iso8601 for all subsequent requests"]

  # ---- Student ----
  - method: POST
    path: "/hhi/students"
    description: "Register a district student."
    roles: [ProgramAdministrator]
    code: 201
    input: [student_number, full_name, grade_level, campus_code, "special_ed_status?", "iep_service_minutes_weekly?", "enrollment_status?"]
    output: Student
    side_effects: ["computes Student.grade_band from grade_level"]
  - method: GET
    path: "/hhi/students/{id}"
    description: "Read one student."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/hhi/students"
    description: "List students with pagination and filters."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: ["student_number?", "campus_code?", "enrollment_status?", "grade_band?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: POST
    path: "/hhi/students/{id}/enrollment"
    description: "Maintain district enrollment posture (withdraw or re-enroll)."
    roles: [ProgramAdministrator]
    code: 200
    input: [enrollment_status]
    output: Student
    side_effects: ["increments Student.version by 1"]

  # ---- Teacher ----
  - method: POST
    path: "/hhi/teachers"
    description: "Register a homebound or classroom teacher."
    roles: [ProgramAdministrator]
    code: 201
    input: [full_name, employee_number, credential_areas, grade_bands, max_weekly_caseload_minutes, "safety_clearance_status?", clearance_expires_on, "home_visit_eligible?"]
    output: Teacher
    side_effects: ["initializes committed_weekly_minutes to 0 and over_cap to false"]
  - method: GET
    path: "/hhi/teachers/{id}"
    description: "Read one teacher including the derived caseload fields."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher, ClassroomTeacher]
    code: 200
    input: []
    output: Teacher
    side_effects: []
  - method: GET
    path: "/hhi/teachers"
    description: "List teachers with pagination and filters."
    roles: [ProgramAdministrator, CaseManager]
    code: 200
    input: ["safety_clearance_status?", "home_visit_eligible?", "limit?", "offset?"]
    output: "Teacher[]"
    side_effects: []
  - method: PATCH
    path: "/hhi/teachers/{id}/clearance"
    description: "Update a teacher's safety clearance posture and expiry."
    roles: [ProgramAdministrator]
    code: 200
    input: [safety_clearance_status, clearance_expires_on, "home_visit_eligible?"]
    output: Teacher
    side_effects: ["increments Teacher.version by 1"]

  # ---- EntitlementRule ----
  - method: POST
    path: "/hhi/entitlement-rules"
    description: "Publish an instructional-hours entitlement rule for a (grade_band, delivery_mode) pair."
    roles: [ProgramAdministrator]
    code: 201
    input: [grade_band, delivery_mode, base_weekly_minutes, cap_weekly_minutes, min_session_minutes, max_session_minutes, max_daily_minutes, min_gap_minutes, travel_buffer_minutes, "status?"]
    output: EntitlementRule
    side_effects: ["rejects a second PUBLISHED rule for the same (grade_band, delivery_mode) pair with ERR_DUPLICATE_ENTITLEMENT_RULE"]
  - method: GET
    path: "/hhi/entitlement-rules/{id}"
    description: "Read one entitlement rule."
    roles: [ProgramAdministrator, CaseManager]
    code: 200
    input: []
    output: EntitlementRule
    side_effects: []
  - method: GET
    path: "/hhi/entitlement-rules"
    description: "List entitlement rules with pagination and filters."
    roles: [ProgramAdministrator, CaseManager]
    code: 200
    input: ["grade_band?", "delivery_mode?", "status?", "limit?", "offset?"]
    output: "EntitlementRule[]"
    side_effects: []
  - method: POST
    path: "/hhi/entitlement-rules/{id}/retire"
    description: "Retire a published rule so it can no longer be resolved for new entitlement computations."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: EntitlementRule
    side_effects: ["status := RETIRED", "increments EntitlementRule.version by 1"]

  # ---- HomeboundCase ----
  - method: POST
    path: "/hhi/cases"
    description: "Open a homebound instruction case for an enrolled student."
    roles: [CaseManager]
    code: 201
    input: [student_id, referral_date, delivery_mode, "referral_note?"]
    output: HomeboundCase
    side_effects: ["service_status := DRAFT, funding_status := NOT_REPORTED", "created_by_user_id := X-User-ID"]
  - method: GET
    path: "/hhi/cases/{id}"
    description: "Read one case including all derived entitlement, apportionment and counter fields."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer, HomeboundTeacher, ClassroomTeacher]
    code: 200
    input: []
    output: HomeboundCase
    side_effects: []
  - method: GET
    path: "/hhi/cases"
    description: "List cases with pagination and filters; also the reverse-reachability channel from Student and EntitlementRule."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: ["student_id?", "entitlement_rule_id?", "service_status?", "funding_status?", "limit?", "offset?"]
    output: "HomeboundCase[]"
    side_effects: []
  - method: POST
    path: "/hhi/cases/{id}/activate"
    description: "Start service on an eligible case."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: HomeboundCase
    side_effects: ["service_status ELIGIBLE -> ACTIVE", "funding_status NOT_REPORTED -> ACCRUING", "service_start_date := logical-clock date", "escort_required refreshed from the FINALIZED safety review", "increments HomeboundCase.version by 1"]
  - method: POST
    path: "/hhi/cases/{id}/deny"
    description: "Deny eligibility on a case that has not yet been found eligible."
    roles: [ProgramAdministrator]
    code: 200
    input: ["deny_note?"]
    output: HomeboundCase
    side_effects: ["service_status -> DENIED", "close_reason := DENIED_ELIGIBILITY", "all SUBMITTED certifications for this case := REJECTED", "increments HomeboundCase.version by 1"]
  - method: POST
    path: "/hhi/cases/{id}/close"
    description: "Close a case for a reason other than a completed transition back to the building."
    roles: [ProgramAdministrator]
    code: 200
    input: [close_reason]
    output: HomeboundCase
    side_effects: ["service_status -> CLOSED", "ACTIVE assignments RELEASED and Teacher.committed_weekly_minutes recomputed", "SCHEDULED sessions CANCELLED_ADMIN", "open TransitionPlan rows SUPERSEDED", "open ExtensionRequest rows DENIED", "increments HomeboundCase.version by 1"]
  - method: POST
    path: "/hhi/cases/{id}/funding/report"
    description: "Report provisional apportionment for the case using the PROVISIONAL_ACCRUAL variant."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: HomeboundCase
    side_effects: ["provisional_apportionment_minutes := calculations.case_apportionment_minutes variant PROVISIONAL_ACCRUAL", "service_gap_minutes recomputed, which may fire the funding_status ACCRUING_to_HELD or HELD_to_ACCRUING transition", "increments HomeboundCase.version by 1"]
  - method: POST
    path: "/hhi/cases/{id}/funding/reconcile"
    description: "Reconcile the case at closeout using the FINAL_VERIFIED variant and apply recapture."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: HomeboundCase
    side_effects: ["final_apportionment_minutes, delivery_ratio_pct, recapture_minutes, net_apportionment_minutes := outputs of calculations.funding_reconciliation_net", "funding_status ACCRUING -> RECONCILED or ACCRUING -> FORFEITED", "increments HomeboundCase.version by 1"]
  - method: GET
    path: "/hhi/cases/{id}/funding-summary"
    description: "Computed read model contrasting the two apportionment variants for one case."
    roles: [ProgramAdministrator, CaseManager]
    code: 200
    input: []
    output: { case_id: string, weekly_entitled_minutes: integer, window_weeks: integer, service_weeks: integer, entitled_total_minutes: integer, provisional_minutes: integer, final_verified_minutes: integer, projected_unrounded_minutes: integer, reported_apportionment_minutes: integer, service_gap_minutes: integer, delivery_ratio_pct: number, recapture_minutes: integer, net_apportionment_minutes: integer, funding_status: string }
    side_effects: []

  # ---- PhysicianCertification ----
  - method: POST
    path: "/hhi/certifications"
    description: "Submit physician certification of expected absence duration and diagnosis category. OCC-guarded on the parent case (see §1.2.1 cert-create-stale-case)."
    roles: [CaseManager]
    code: 201
    input: [case_id, physician_npi, diagnosis_category, certified_start_date, certified_end_date, expected_absence_days, signature_date, expected_case_version, "clinical_note?"]
    output: PhysicianCertification
    side_effects: ["status := SUBMITTED, submitted_by_user_id := X-User-ID", "case.service_status DRAFT -> PENDING_CERT_REVIEW", "increments HomeboundCase.version by 1"]
  - method: GET
    path: "/hhi/certifications/{id}"
    description: "Read one certification."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: []
    output: PhysicianCertification
    side_effects: []
  - method: GET
    path: "/hhi/certifications"
    description: "List certifications with pagination and filters; reverse-reachability channel from HomeboundCase."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: ["case_id?", "status?", "is_current?", "limit?", "offset?"]
    output: "PhysicianCertification[]"
    side_effects: []
  - method: POST
    path: "/hhi/certifications/{id}/review"
    description: "Nurse review of a submitted certification; acceptance establishes eligibility and the entitlement."
    roles: [NurseReviewer]
    code: 200
    input: [decision, "review_note?"]
    output: PhysicianCertification
    side_effects: ["on ACCEPT: status := ACCEPTED, is_current := true, prior ACCEPTED certification SUPERSEDED", "on ACCEPT: case.service_status -> ELIGIBLE, diagnosis_category / certified_start_date / certified_end_date / certification_count copied, entitlement_rule_id resolved, weekly_entitled_minutes := calculations.weekly_entitlement_minutes, calculations.assignment_minute_allocation recomputed", "on REJECT: status := REJECTED and case.service_status -> DRAFT", "increments HomeboundCase.version by 1"]

  # ---- TeacherAssignment ----
  - method: POST
    path: "/hhi/assignments"
    description: "Propose a teacher for a case. Omit teacher_id to invoke the selector policy (eligibility filter, committed_weekly_minutes ASC ranking, created_at ASC tie-break, ERR_NO_ELIGIBLE_TEACHER when empty)."
    roles: [CaseManager]
    code: 201
    input: [case_id, role, "teacher_id?"]
    output: TeacherAssignment
    side_effects: ["status := PROPOSED with weekly_committed_minutes 0", "when teacher_id is omitted, teacher_id := the selector's winner"]
  - method: GET
    path: "/hhi/assignments/{id}"
    description: "Read one assignment."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: []
    output: TeacherAssignment
    side_effects: []
  - method: GET
    path: "/hhi/assignments"
    description: "List assignments with pagination and filters; reverse-reachability channel from HomeboundCase and Teacher."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: ["case_id?", "teacher_id?", "role?", "status?", "limit?", "offset?"]
    output: "TeacherAssignment[]"
    side_effects: []
  - method: POST
    path: "/hhi/assignments/{id}/accept"
    description: "Assigned teacher accepts the proposed assignment."
    roles: [HomeboundTeacher]
    code: 200
    input: []
    output: TeacherAssignment
    side_effects: ["status PROPOSED -> ACTIVE, accepted_at := logical-clock instant", "calculations.assignment_minute_allocation recomputed over the case's ACTIVE assignments", "Teacher.committed_weekly_minutes and Teacher.over_cap recomputed"]
  - method: POST
    path: "/hhi/assignments/{id}/decline"
    description: "Assigned teacher declines the proposed assignment."
    roles: [HomeboundTeacher]
    code: 200
    input: [decline_reason]
    output: TeacherAssignment
    side_effects: ["status PROPOSED -> DECLINED, weekly_committed_minutes := 0"]
  - method: POST
    path: "/hhi/assignments/{id}/release"
    description: "Release an active assignment and rebalance the case's allocation."
    roles: [ProgramAdministrator]
    code: 200
    input: [release_reason]
    output: TeacherAssignment
    side_effects: ["status ACTIVE -> RELEASED, released_at set, weekly_committed_minutes := 0", "calculations.assignment_minute_allocation recomputed over the remaining ACTIVE assignments", "Teacher.committed_weekly_minutes and Teacher.over_cap recomputed"]

  # ---- HomeVisitSafetyReview ----
  - method: POST
    path: "/hhi/safety-reviews"
    description: "Record a home-visit safety review in DRAFT with an initial risk score."
    roles: [CaseManager]
    code: 201
    input: [case_id, evidence_source, review_date, "hazard_findings?", "escort_available?"]
    output: HomeVisitSafetyReview
    side_effects: ["scoring_variant derived from evidence_source", "risk_score := calculations.home_visit_risk_score", "expires_on := review_date + 60 days", "status := DRAFT with clearance PENDING"]
  - method: GET
    path: "/hhi/safety-reviews/{id}"
    description: "Read one safety review."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: []
    output: HomeVisitSafetyReview
    side_effects: []
  - method: GET
    path: "/hhi/safety-reviews"
    description: "List safety reviews with pagination and filters; reverse-reachability channel from HomeboundCase."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: ["case_id?", "status?", "clearance?", "limit?", "offset?"]
    output: "HomeVisitSafetyReview[]"
    side_effects: []
  - method: POST
    path: "/hhi/safety-reviews/{id}/finalize"
    description: "Finalize a draft review; the resulting clearance governs in-home scheduling and may force the case to a virtual alternative."
    roles: [CaseManager]
    code: 200
    input: []
    output: HomeVisitSafetyReview
    side_effects: ["risk_score re-scored and clearance banded", "status DRAFT -> FINALIZED and any prior FINALIZED review SUPERSEDED", "case.escort_required refreshed", "on VIRTUAL_ONLY: case.delivery_mode := VIRTUAL_SYNC, entitlement_rule_id re-resolved, weekly_entitled_minutes recomputed, allocation and Teacher.committed_weekly_minutes recomputed, SCHEDULED IN_HOME sessions CANCELLED_ADMIN", "increments HomeboundCase.version by 1"]

  # ---- InstructionSession ----
  - method: POST
    path: "/hhi/sessions"
    description: "Schedule an instructional session against an active assignment."
    roles: [CaseManager]
    code: 201
    input: [case_id, assignment_id, scheduled_start, scheduled_end, delivery_mode, subject, "escort_confirmed?"]
    output: InstructionSession
    side_effects: ["scheduled_minutes and service_date derived", "status := SCHEDULED with credited_minutes 0", "teacher slot-conflict, case min-gap and student daily-limit checks applied"]
  - method: GET
    path: "/hhi/sessions/{id}"
    description: "Read one session."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: []
    output: InstructionSession
    side_effects: []
  - method: GET
    path: "/hhi/sessions"
    description: "List sessions with pagination and filters; reverse-reachability channel from HomeboundCase, TeacherAssignment and the self-referential makeup link."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: ["case_id?", "assignment_id?", "makeup_for_session_id?", "status?", "service_date?", "limit?", "offset?"]
    output: "InstructionSession[]"
    side_effects: []
  - method: POST
    path: "/hhi/sessions/{id}/log"
    description: "Assigned teacher logs the session outcome and attendance is coded."
    roles: [HomeboundTeacher]
    code: 200
    input: [outcome, "actual_minutes?", "absence_kind?", "outcome_reason?"]
    output: InstructionSession
    side_effects: ["status SCHEDULED -> DELIVERED | STUDENT_UNAVAILABLE | TEACHER_CANCELLED | SAFETY_ABORTED", "credited_minutes := calculations.session_credited_minutes on DELIVERED, else 0", "creates one AttendanceLedgerEntry per calculations.attendance_code_assignment", "case.reported_apportionment_minutes, case.service_gap_minutes and case.makeup_obligation_minutes recomputed, which may fire the funding_status ACCRUING_to_HELD or HELD_to_ACCRUING transition", "increments HomeboundCase.version by 1"]
  - method: POST
    path: "/hhi/sessions/{id}/verify"
    description: "Second-person verification of a delivered session; required before the session enters FINAL_VERIFIED apportionment."
    roles: [ProgramAdministrator, CaseManager]
    code: 200
    input: []
    output: InstructionSession
    side_effects: ["verified_at := logical-clock instant, verified_by_user_id := X-User-ID", "rejected with ERR_SEGREGATION_OF_DUTIES when X-User-ID == case.created_by_user_id"]
  - method: POST
    path: "/hhi/sessions/{id}/void"
    description: "Void a delivered session and write the compensating reversal ledger row."
    roles: [ProgramAdministrator]
    code: 200
    input: [void_reason]
    output: InstructionSession
    side_effects: ["status DELIVERED -> VOIDED, credited_minutes := 0, verified_at and verified_by_user_id cleared", "creates an AttendanceLedgerEntry with attendance_code HB_REVERSAL and negative apportionment_minutes", "case.reported_apportionment_minutes and case.service_gap_minutes recomputed, which may fire the funding_status ACCRUING_to_HELD or RECONCILED_to_HELD transition and cascade to CurriculumPacingSync and TransitionPlan", "increments HomeboundCase.version by 1"]
  - method: POST
    path: "/hhi/sessions/{id}/cancel"
    description: "Administratively cancel a scheduled session with no attendance consequence."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: InstructionSession
    side_effects: ["status SCHEDULED -> CANCELLED_ADMIN", "no AttendanceLedgerEntry is written and case.makeup_obligation_minutes is unchanged"]
  - method: POST
    path: "/hhi/sessions/{id}/makeup"
    description: "Schedule a make-up session for a missed session; the new session carries makeup_for_session_id pointing at the missed one."
    roles: [CaseManager]
    code: 201
    input: [assignment_id, scheduled_start, scheduled_end, delivery_mode, subject, "escort_confirmed?"]
    output: InstructionSession
    side_effects: ["creates a new InstructionSession with status SCHEDULED and makeup_for_session_id := the path session id", "case.makeup_obligation_minutes recomputed", "all POST /hhi/sessions scheduling checks apply identically"]

  # ---- AttendanceLedgerEntry (append-only) ----
  - method: GET
    path: "/hhi/attendance-entries/{id}"
    description: "Read one immutable attendance ledger row."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: []
    output: AttendanceLedgerEntry
    side_effects: []
  - method: GET
    path: "/hhi/attendance-entries"
    description: "List attendance ledger rows with pagination and filters; the only discovery channel for cascade-created ledger rows and reverse-reachability channel from HomeboundCase, InstructionSession and the self-referential reversal link."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: ["case_id?", "session_id?", "reversal_of_entry_id?", "attendance_code?", "service_date?", "limit?", "offset?"]
    output: "AttendanceLedgerEntry[]"
    side_effects: []

  # ---- ExtensionRequest ----
  - method: POST
    path: "/hhi/extension-requests"
    description: "Request an extension of the certified window with updated medical documentation. OCC-guarded on the parent case (see §1.2.1 extension-request-create-stale-case)."
    roles: [CaseManager]
    code: 201
    input: [case_id, certification_id, requested_additional_days, justification, expected_case_version]
    output: ExtensionRequest
    side_effects: ["status := SUBMITTED, resubmit_count := 0, submitted_by_user_id := X-User-ID", "case.service_status ACTIVE -> EXTENSION_PENDING", "increments HomeboundCase.version by 1"]
  - method: GET
    path: "/hhi/extension-requests/{id}"
    description: "Read one extension request."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: []
  - method: GET
    path: "/hhi/extension-requests"
    description: "List extension requests with pagination and filters; reverse-reachability channel from HomeboundCase and PhysicianCertification."
    roles: [ProgramAdministrator, CaseManager, NurseReviewer]
    code: 200
    input: ["case_id?", "certification_id?", "status?", "limit?", "offset?"]
    output: "ExtensionRequest[]"
    side_effects: []
  - method: POST
    path: "/hhi/extension-requests/{id}/start-review"
    description: "Begin review of a submitted extension request."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: ["status SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/hhi/extension-requests/{id}/request-info"
    description: "Send an extension request back for additional medical documentation."
    roles: [ProgramAdministrator]
    code: 200
    input: [info_note]
    output: ExtensionRequest
    side_effects: ["status UNDER_REVIEW -> INFO_REQUESTED, info_note recorded"]
  - method: POST
    path: "/hhi/extension-requests/{id}/resubmit"
    description: "Resubmit an extension request with newer accepted documentation."
    roles: [CaseManager]
    code: 200
    input: [certification_id]
    output: ExtensionRequest
    side_effects: ["status INFO_REQUESTED -> UNDER_REVIEW", "certification_id replaced, resubmit_count += 1"]
  - method: POST
    path: "/hhi/extension-requests/{id}/decide"
    description: "Approve or deny an extension request under review; the decider must differ from the submitter."
    roles: [ProgramAdministrator]
    code: 200
    input: [decision, "decision_note?"]
    output: ExtensionRequest
    side_effects: ["status UNDER_REVIEW -> APPROVED | DENIED, decided_by_user_id := X-User-ID", "case.service_status EXTENSION_PENDING -> ACTIVE", "on APPROVED: case.certified_end_date extended, extension_count += 1, weekly_entitled_minutes recomputed, allocation and Teacher.committed_weekly_minutes recomputed", "increments HomeboundCase.version by 1"]

  # ---- TransitionPlan ----
  - method: POST
    path: "/hhi/transition-plans"
    description: "Open a plan for the student's transition back to the school building. OCC-guarded on the parent case (see §1.2.1 transition-plan-create-stale-case)."
    roles: [CaseManager]
    code: 201
    input: [case_id, target_return_date, reintegration_mode, expected_case_version, "ramp_weeks?"]
    output: TransitionPlan
    side_effects: ["status := DRAFT with required_ack_count and classroom_ack_count computed", "case.service_status ACTIVE -> TRANSITION_PLANNED", "increments HomeboundCase.version by 1"]
  - method: GET
    path: "/hhi/transition-plans/{id}"
    description: "Read one transition plan including its derived acknowledgement counters."
    roles: [ProgramAdministrator, CaseManager, ClassroomTeacher]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: []
  - method: GET
    path: "/hhi/transition-plans"
    description: "List transition plans with pagination and filters; reverse-reachability channel from HomeboundCase."
    roles: [ProgramAdministrator, CaseManager, ClassroomTeacher]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: "TransitionPlan[]"
    side_effects: []
  - method: POST
    path: "/hhi/transition-plans/{id}/coordinate"
    description: "Send the plan out for classroom-teacher coordination."
    roles: [CaseManager]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: ["status DRAFT -> CLASSROOM_COORD_PENDING", "required_ack_count and classroom_ack_count recomputed via calculations.transition_ack_counters, which may advance the plan to READY in the same request"]
  - method: POST
    path: "/hhi/transition-plans/{id}/complete"
    description: "Complete a ready plan on or after the target return date and close the case."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: ["status READY -> COMPLETED, completed_at set", "case.service_status TRANSITION_PLANNED -> CLOSED with close_reason RETURNED_TO_CAMPUS", "ACTIVE assignments RELEASED, Teacher.committed_weekly_minutes recomputed, SCHEDULED sessions CANCELLED_ADMIN", "increments HomeboundCase.version by 1"]
  - method: POST
    path: "/hhi/transition-plans/{id}/abort"
    description: "Abort planning and return the case to active homebound service."
    roles: [CaseManager]
    code: 200
    input: [abort_reason]
    output: TransitionPlan
    side_effects: ["status -> ABORTED", "case.service_status TRANSITION_PLANNED -> ACTIVE", "increments HomeboundCase.version by 1"]

  # ---- CurriculumPacingSync ----
  - method: POST
    path: "/hhi/pacing-syncs"
    description: "Open curriculum pacing and assessment coordination with a classroom teacher of record."
    roles: [CaseManager]
    code: 201
    input: [case_id, classroom_teacher_id, subject, pacing_target_unit, assessment_accommodation]
    output: CurriculumPacingSync
    side_effects: ["ack_status := PENDING", "calculations.transition_ack_counters recomputed for any open TransitionPlan, which may fire the plan READY_to_CLASSROOM_COORD_PENDING transition"]
  - method: GET
    path: "/hhi/pacing-syncs/{id}"
    description: "Read one pacing coordination row."
    roles: [ProgramAdministrator, CaseManager, ClassroomTeacher, HomeboundTeacher]
    code: 200
    input: []
    output: CurriculumPacingSync
    side_effects: []
  - method: GET
    path: "/hhi/pacing-syncs"
    description: "List pacing coordination rows with pagination and filters; reverse-reachability channel from HomeboundCase and Teacher."
    roles: [ProgramAdministrator, CaseManager, ClassroomTeacher, HomeboundTeacher]
    code: 200
    input: ["case_id?", "classroom_teacher_id?", "ack_status?", "subject?", "limit?", "offset?"]
    output: "CurriculumPacingSync[]"
    side_effects: []
  - method: POST
    path: "/hhi/pacing-syncs/{id}/acknowledge"
    description: "Classroom teacher of record acknowledges the pacing target and assessment accommodation."
    roles: [ClassroomTeacher]
    code: 200
    input: []
    output: CurriculumPacingSync
    side_effects: ["ack_status -> ACKED, acked_at := logical-clock instant", "calculations.transition_ack_counters recomputed, which may fire the plan CLASSROOM_COORD_PENDING_to_READY transition"]
  - method: POST
    path: "/hhi/pacing-syncs/{id}/dispute"
    description: "Classroom teacher of record disputes the pacing target."
    roles: [ClassroomTeacher]
    code: 200
    input: [dispute_note]
    output: CurriculumPacingSync
    side_effects: ["ack_status PENDING -> DISPUTED", "calculations.transition_ack_counters recomputed, which may fire the plan READY_to_CLASSROOM_COORD_PENDING transition"]

  # ---- SpedServiceLog ----
  - method: POST
    path: "/hhi/sped-service-logs"
    description: "Open continuation tracking for one IEP related service during homebound status."
    roles: [CaseManager]
    code: 201
    input: [case_id, service_type, required_weekly_minutes]
    output: SpedServiceLog
    side_effects: ["continuation_status := CONTINUED with delivered_cumulative_minutes 0", "compensatory_minutes_owed := calculations.sped_compensatory_minutes"]
  - method: GET
    path: "/hhi/sped-service-logs/{id}"
    description: "Read one special-education service continuation log."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: []
    output: SpedServiceLog
    side_effects: []
  - method: GET
    path: "/hhi/sped-service-logs"
    description: "List special-education service logs with pagination and filters; reverse-reachability channel from HomeboundCase."
    roles: [ProgramAdministrator, CaseManager, HomeboundTeacher]
    code: 200
    input: ["case_id?", "service_type?", "continuation_status?", "limit?", "offset?"]
    output: "SpedServiceLog[]"
    side_effects: []
  - method: POST
    path: "/hhi/sped-service-logs/{id}/record-delivery"
    description: "Record delivered related-service minutes; rejected while the log is suspended pending an IEP meeting."
    roles: [CaseManager, HomeboundTeacher]
    code: 200
    input: [minutes, service_date]
    output: SpedServiceLog
    side_effects: ["delivered_cumulative_minutes += minutes, last_service_date := service_date", "compensatory_minutes_owed := calculations.sped_compensatory_minutes"]
  - method: POST
    path: "/hhi/sped-service-logs/{id}/continuation"
    description: "Change the continuation posture of a related service during homebound status."
    roles: [CaseManager]
    code: 200
    input: [to_status, continuation_reason]
    output: SpedServiceLog
    side_effects: ["continuation_status := to_status", "compensatory_minutes_owed := calculations.sped_compensatory_minutes"]

errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_ASSIGNED_TEACHER
    http: 403
    condition: "HomeboundTeacher acts on an assignment or session that belongs to another teacher"
  - id: ERR_NOT_CLASSROOM_TEACHER_OF_RECORD
    http: 403
    condition: "ClassroomTeacher acknowledges or disputes a pacing sync whose classroom_teacher_id is a different teacher"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the verifying user is the case creator, or the deciding user is the extension submitter"
  # payload
  - id: ERR_VALIDATION
    http: 400
    condition: "request body or query violates the endpoint's input schema (missing required field, unknown field, bad enum member, out-of-range integer, malformed date, duplicate hazard_findings member, limit outside [1,100], negative offset)"
  # existence
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student id in the path or body does not exist"
  - id: ERR_TEACHER_NOT_FOUND
    http: 404
    condition: "teacher_id or classroom_teacher_id does not exist"
  - id: ERR_ENTITLEMENT_RULE_NOT_FOUND
    http: 404
    condition: "entitlement rule id in the path does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "case id in the path or body does not exist"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification id in the path or body does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment id in the path or body does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "session id in the path does not exist"
  - id: ERR_SAFETY_REVIEW_NOT_FOUND
    http: 404
    condition: "safety review id in the path does not exist"
  - id: ERR_EXTENSION_REQUEST_NOT_FOUND
    http: 404
    condition: "extension request id in the path does not exist"
  - id: ERR_TRANSITION_PLAN_NOT_FOUND
    http: 404
    condition: "transition plan id in the path does not exist"
  - id: ERR_PACING_SYNC_NOT_FOUND
    http: 404
    condition: "pacing sync id in the path does not exist"
  - id: ERR_SPED_LOG_NOT_FOUND
    http: 404
    condition: "sped service log id in the path does not exist"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "attendance ledger entry id in the path does not exist"
  # concurrency
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the current HomeboundCase.version"
  # state
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "HomeboundCase.service_status is not a declared from-state for the requested transition"
  - id: ERR_CASE_NOT_ACTIVE
    http: 409
    condition: "child record creation requires case.service_status IN {ACTIVE, EXTENSION_PENDING, TRANSITION_PLANNED}"
  - id: ERR_SESSION_ALREADY_LOGGED
    http: 409
    condition: "logging an outcome on or cancelling a session whose status is not SCHEDULED"
  - id: ERR_SESSION_NOT_DELIVERED
    http: 409
    condition: "verifying or voiding a session whose status is not DELIVERED"
  - id: ERR_SESSION_ALREADY_VERIFIED
    http: 409
    condition: "verifying a session that already carries verified_at"
  - id: ERR_CERT_NOT_REVIEWABLE
    http: 409
    condition: "reviewing a certification whose status is not SUBMITTED"
  - id: ERR_CERT_ALREADY_PENDING
    http: 409
    condition: "submitting a certification while another certification of the same case is still SUBMITTED"
  - id: ERR_ASSIGNMENT_NOT_PROPOSED
    http: 409
    condition: "accepting or declining an assignment whose status is not PROPOSED"
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "releasing an assignment that is not ACTIVE, or scheduling a session against a non-ACTIVE assignment"
  - id: ERR_ASSIGNMENT_HAS_SCHEDULED_SESSIONS
    http: 409
    condition: "releasing an assignment that still has at least one SCHEDULED session"
  - id: ERR_EXTENSION_STATE_INVALID
    http: 409
    condition: "extension request is not in the from-state required by the requested action"
  - id: ERR_EXTENSION_RESUBMIT_LIMIT
    http: 409
    condition: "resubmitting an extension request whose resubmit_count is already 2"
  - id: ERR_PLAN_NOT_READY
    http: 409
    condition: "completing a transition plan whose status is not READY"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "coordinating a plan that is not DRAFT, or aborting a plan that is COMPLETED, ABORTED or SUPERSEDED"
  - id: ERR_PACING_ALREADY_ACKED
    http: 409
    condition: "acknowledging a pacing sync that is already ACKED, or disputing one that is not PENDING"
  - id: ERR_SPED_CONTINUATION_INVALID
    http: 409
    condition: "requested continuation transition is not declared for the log's current continuation_status"
  - id: ERR_FUNDING_NOT_ACCRUING
    http: 409
    condition: "reconciling a case whose funding_status is NOT_REPORTED, HELD or FORFEITED"
  - id: ERR_FUNDING_ALREADY_RECONCILED
    http: 409
    condition: "reconciling a case whose funding_status is already RECONCILED"
  - id: ERR_REVIEW_ALREADY_FINALIZED
    http: 409
    condition: "finalizing a safety review whose status is not DRAFT"
  - id: ERR_RULE_ALREADY_RETIRED
    http: 409
    condition: "retiring an entitlement rule whose status is already RETIRED"
  # safety and compliance
  - id: ERR_SAFETY_REVIEW_MISSING
    http: 422
    condition: "no FINALIZED HomeVisitSafetyReview exists for the case when activating an IN_HOME/HYBRID case or scheduling an IN_HOME session"
  - id: ERR_SAFETY_REVIEW_EXPIRED
    http: 422
    condition: "the FINALIZED safety review's expires_on is earlier than the session's service_date"
  - id: ERR_SAFETY_CLEARANCE_BLOCKED
    http: 422
    condition: "the FINALIZED safety review clearance is BLOCKED"
  - id: ERR_IN_HOME_NOT_PERMITTED
    http: 422
    condition: "an IN_HOME session is requested while the case delivery_mode is VIRTUAL_SYNC or the FINALIZED review clearance is VIRTUAL_ONLY"
  - id: ERR_TEACHER_CLEARANCE_EXPIRED
    http: 422
    condition: "the teacher's safety_clearance_status is EXPIRED, or home_visit_eligible is false for an IN_HOME session"
  - id: ERR_ESCORT_REQUIRED_NOT_CONFIRMED
    http: 422
    condition: "case.escort_required is true and escort_confirmed was not supplied as true on an IN_HOME session"
  # uniqueness and constraints
  - id: ERR_DUPLICATE_STUDENT_NUMBER
    http: 409
    condition: "student_number already belongs to another Student"
  - id: ERR_DUPLICATE_ENTITLEMENT_RULE
    http: 409
    condition: "another PUBLISHED EntitlementRule already covers this (grade_band, delivery_mode) pair"
  - id: ERR_DUPLICATE_PRIMARY_ASSIGNMENT
    http: 409
    condition: "the case already has a PRIMARY assignment with status IN {PROPOSED, ACTIVE}"
  - id: ERR_DUPLICATE_PACING_SUBJECT
    http: 409
    condition: "the case already has a CurriculumPacingSync for this subject"
  - id: ERR_DUPLICATE_SPED_SERVICE_TYPE
    http: 409
    condition: "the case already has a SpedServiceLog for this service_type"
  - id: ERR_OPEN_CASE_EXISTS
    http: 409
    condition: "the student already has a HomeboundCase whose service_status is not CLOSED or DENIED"
  - id: ERR_SESSION_DURATION_INVALID
    http: 422
    condition: "scheduled_minutes falls outside [min_session_minutes, max_session_minutes] of the resolved entitlement rule"
  - id: ERR_NO_PUBLISHED_ENTITLEMENT_RULE
    http: 422
    condition: "no PUBLISHED EntitlementRule matches (student.grade_band, case.delivery_mode) when the entitlement must be resolved"
  - id: ERR_ABSENCE_DURATION_TOO_SHORT
    http: 422
    condition: "accepting a certification whose expected_absence_days is below 10"
  - id: ERR_RAMP_WEEKS_INVALID
    http: 422
    condition: "ramp_weeks is non-zero for FULL_DAY reintegration, or zero for PARTIAL_DAY_RAMP / VIRTUAL_BRIDGE"
  # referential
  - id: ERR_ASSIGNMENT_CASE_MISMATCH
    http: 422
    condition: "the referenced assignment belongs to a different case than the session's case_id"
  - id: ERR_CERT_CASE_MISMATCH
    http: 422
    condition: "the referenced certification belongs to a different case than the extension request"
  - id: ERR_STUDENT_NOT_ENROLLED
    http: 422
    condition: "the student's enrollment_status is WITHDRAWN"
  - id: ERR_CERT_NOT_ACCEPTED
    http: 422
    condition: "the referenced certification's status is not ACCEPTED"
  - id: ERR_CERT_WINDOW_INVALID
    http: 422
    condition: "certified_end_date precedes certified_start_date, or signature_date is after the logical-clock date or more than 30 days before certified_start_date"
  - id: ERR_SESSION_OUTSIDE_CERT_WINDOW
    http: 422
    condition: "the session's service_date falls outside [case.certified_start_date, case.certified_end_date]"
  - id: ERR_NO_PACING_COORDINATION
    http: 422
    condition: "coordinating a transition plan while the case has no CurriculumPacingSync rows"
  - id: ERR_SPED_SERVICE_SUSPENDED
    http: 422
    condition: "recording delivery on a SUSPENDED_PENDING_IEP log, or coordinating a plan while any of the case's sped logs is SUSPENDED_PENDING_IEP"
  - id: ERR_NO_PRIMARY_ASSIGNMENT
    http: 422
    condition: "activating a case with no ACTIVE PRIMARY assignment"
  - id: ERR_MAKEUP_NOT_ELIGIBLE
    http: 422
    condition: "the session being made up is not STUDENT_UNAVAILABLE / TEACHER_CANCELLED / SAFETY_ABORTED, or already has a make-up session"
  - id: ERR_TEACHER_BAND_MISMATCH
    http: 422
    condition: "the explicitly named teacher's grade_bands does not contain the student's grade_band"
  # temporal
  - id: ERR_TEACHER_SLOT_CONFLICT
    http: 409
    condition: "the new session's travel-buffer-extended interval overlaps another SCHEDULED or DELIVERED session of the same teacher"
  - id: ERR_SESSION_GAP_TOO_SHORT
    http: 409
    condition: "two sessions of the same case on one service_date are separated by less than min_gap_minutes"
  - id: ERR_RETURN_DATE_NOT_REACHED
    http: 409
    condition: "completing a transition plan before its target_return_date"
  # fiscal and capacity
  - id: ERR_STUDENT_DAILY_LIMIT
    http: 422
    condition: "the case's scheduled minutes on one service_date would exceed max_daily_minutes"
  - id: ERR_TEACHER_CASELOAD_EXCEEDED
    http: 422
    condition: "accepting the assignment would push the teacher's committed_weekly_minutes above max_weekly_caseload_minutes"
  - id: ERR_EXTENSION_LIMIT_REACHED
    http: 422
    condition: "the case already has 2 APPROVED extension requests"
  - id: ERR_NO_ELIGIBLE_TEACHER
    http: 422
    condition: "teacher_id was omitted and the selector's candidate set is empty"

roles:
  - name: ProgramAdministrator
    description: "District homebound program administrator: owns configuration, activation, funding, voiding and final decisions."
    identity: opaque
    exclusive_operations:
      - "POST /hhi/students"
      - "POST /hhi/students/{id}/enrollment"
      - "POST /hhi/teachers"
      - "PATCH /hhi/teachers/{id}/clearance"
      - "POST /hhi/entitlement-rules"
      - "POST /hhi/entitlement-rules/{id}/retire"
      - "POST /hhi/cases/{id}/activate"
      - "POST /hhi/cases/{id}/deny"
      - "POST /hhi/cases/{id}/close"
      - "POST /hhi/cases/{id}/funding/report"
      - "POST /hhi/cases/{id}/funding/reconcile"
      - "POST /hhi/assignments/{id}/release"
      - "POST /hhi/sessions/{id}/void"
      - "POST /hhi/sessions/{id}/cancel"
      - "POST /hhi/extension-requests/{id}/start-review"
      - "POST /hhi/extension-requests/{id}/request-info"
      - "POST /hhi/extension-requests/{id}/decide"
      - "POST /hhi/transition-plans/{id}/complete"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /hhi/sessions/{id}/verify (shared with CaseManager, subject to segregation of duties)"
      - "all GET reads across /hhi"
  - name: CaseManager
    description: "Homebound case manager: opens cases, submits documentation, staffs, schedules, coordinates with campuses and plans the transition back."
    identity: opaque
    exclusive_operations:
      - "POST /hhi/cases"
      - "POST /hhi/certifications"
      - "POST /hhi/assignments"
      - "POST /hhi/safety-reviews"
      - "POST /hhi/safety-reviews/{id}/finalize"
      - "POST /hhi/sessions"
      - "POST /hhi/sessions/{id}/makeup"
      - "POST /hhi/extension-requests"
      - "POST /hhi/extension-requests/{id}/resubmit"
      - "POST /hhi/transition-plans"
      - "POST /hhi/transition-plans/{id}/coordinate"
      - "POST /hhi/transition-plans/{id}/abort"
      - "POST /hhi/pacing-syncs"
      - "POST /hhi/sped-service-logs"
      - "POST /hhi/sped-service-logs/{id}/continuation"
    shared_operations:
      - "POST /hhi/sessions/{id}/verify (shared with ProgramAdministrator, subject to segregation of duties)"
      - "POST /hhi/sped-service-logs/{id}/record-delivery (shared with HomeboundTeacher)"
      - "GET reads on students, teachers, entitlement rules, cases and all case children"
  - name: NurseReviewer
    description: "District nurse reviewer: the only role that may accept or reject physician certification."
    identity: opaque
    exclusive_operations:
      - "POST /hhi/certifications/{id}/review"
    shared_operations:
      - "GET /hhi/students/{id}, GET /hhi/students, GET /hhi/cases/{id}, GET /hhi/cases, GET /hhi/certifications/{id}, GET /hhi/certifications, GET /hhi/extension-requests/{id}, GET /hhi/extension-requests, GET /hhi/attendance-entries/{id}, GET /hhi/attendance-entries"
  - name: HomeboundTeacher
    description: "Itinerant homebound teacher: accepts or declines assignments and logs session outcomes for their own assignments only."
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "POST /hhi/assignments/{id}/accept"
      - "POST /hhi/assignments/{id}/decline"
      - "POST /hhi/sessions/{id}/log"
    shared_operations:
      - "POST /hhi/sped-service-logs/{id}/record-delivery (shared with CaseManager)"
      - "GET /hhi/teachers/{id}, GET /hhi/assignments/{id}, GET /hhi/assignments, GET /hhi/sessions/{id}, GET /hhi/sessions, GET /hhi/cases/{id}, GET /hhi/safety-reviews/{id}, GET /hhi/safety-reviews, GET /hhi/pacing-syncs/{id}, GET /hhi/pacing-syncs, GET /hhi/sped-service-logs/{id}, GET /hhi/sped-service-logs"
  - name: ClassroomTeacher
    description: "Campus classroom teacher of record: acknowledges or disputes curriculum pacing and assessment accommodations for their own subject rows only."
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "POST /hhi/pacing-syncs/{id}/acknowledge"
      - "POST /hhi/pacing-syncs/{id}/dispute"
    shared_operations:
      - "GET /hhi/teachers/{id}, GET /hhi/cases/{id}, GET /hhi/pacing-syncs/{id}, GET /hhi/pacing-syncs, GET /hhi/transition-plans/{id}, GET /hhi/transition-plans"

