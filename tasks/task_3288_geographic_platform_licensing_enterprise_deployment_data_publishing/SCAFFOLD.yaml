# =============================================================================
# SCAFFOLD.yaml — Geographic Platform Licensing, Enterprise Deployment &
# Data Publishing (Esri-like). §1.0–§1.7 only. §1.8 lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# Flat topology: FKs are carried in request bodies / query filters.
# =============================================================================

scenario: |
  Geographic Platform Licensing, Enterprise Deployment & Data Publishing (Esri):
  license types across named users, concurrent use and deployment servers with
  extension modules licensed separately, organizational subscription with credit
  consumption for analysis, geocoding and storage services, enterprise deployment
  architecture spanning desktop, server and portal components with authentication
  integration, data layer publishing with sharing levels from private through
  organization to public with item ownership, basemap and content licensing
  constraints on derivative works and offline use, education and nonprofit
  licensing programs with eligibility verification, version upgrade compatibility
  across desktop and server components, developer application programming
  interface usage with credit-based billing.

domain_name: geo-platform-licensing
api_prefix: /geo-orgs

complexity_profile:
  primary_archetype: access_control_matrix
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization display name" }
      - { name: org_kind, type: enum, source: input, description: "COMMERCIAL | EDUCATION | NONPROFIT — governs program-grant gating" }
      - { name: home_region, type: string, source: input, description: "ISO 3166-1 alpha-2 region code" }
      - { name: status, type: enum, source: system, description: "PROVISIONING → ACTIVE → SUSPENDED → ACTIVE → TERMINATED" }
      - { name: credit_balance, type: integer, source: computed, default: 0, description: "capacity_credits - consumed_credits - reserved_credits of the org's CreditPool; recomputed on every credit mutation" }
      - { name: seat_overage_fee_accrued_cents, type: integer, source: computed, default: 0, description: "Accrual from CONCURRENT_USE overage: marginal at checkout + sustained at period advance" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Deterministic logical clock in whole-day periods; advances only via POST /_clock/set_current_utc" }

  - name: CreditPool
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id; exactly one pool per org" }
      - { name: capacity_credits, type: integer, source: input, description: "Total credits purchased for the current subscription term" }
      - { name: reserved_credits, type: integer, source: computed, default: 0, description: "Sum of provisional_credits across PENDING CreditBatches of this org" }
      - { name: consumed_credits, type: integer, source: computed, default: 0, description: "Sum of settled_credits across SETTLED CreditBatches of this org" }
      - { name: low_credit_threshold_credits, type: integer, source: input, default: 500, description: "Strict less-than boundary for LOW_CREDIT posture" }
      - { name: posture, type: enum, source: computed, description: "OK | LOW_CREDIT | EXHAUSTED | OVERDRAWN — per calculations.credit_pool_posture" }

  - name: LicenseProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Catalog identifier, globally unique (ERR_DUPLICATE_VALUE), e.g. DESKTOP_PRO, SERVER_STANDARD" }
      - { name: license_kind, type: enum, source: input, description: "NAMED_USER | CONCURRENT_USE | DEPLOYMENT_SERVER" }
      - { name: edition, type: enum, source: input, description: "BASIC | STANDARD | ADVANCED (ordered BASIC < STANDARD < ADVANCED)" }
      - { name: major_version, type: integer, source: input, description: "Major version line used by authorize and version_compat_check" }
      - { name: base_seat_count, type: integer, source: input, description: "Reference seat count for the catalog entry" }
      - { name: supports_offline, type: boolean, source: input, description: "Whether content published under this license may be taken offline" }
      - { name: allows_derivative_works, type: boolean, source: input, description: "Whether derivative works of licensed content are permitted" }
      - { name: extension_modules, type: array, source: input, default: [], description: "Embedded extension catalog entries: { extension_code, additional_credit_rate_per_op, required_min_edition } — extension modules are licensed separately via ExtensionGrant" }
      - { name: status, type: enum, source: system, description: "CATALOG → RETIRED" }

  - name: LicenseGrant
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: license_product_id, type: string, source: input, description: "FK -> LicenseProduct.id" }
      - { name: grant_kind, type: enum, source: input, description: "STANDARD | EDUCATION_PROGRAM | NONPROFIT_PROGRAM — program kinds gate activation on EligibilityVerification" }
      - { name: seats_allocated, type: integer, source: input, description: "Seats granted (named users / concurrent seats / server cores by product license_kind)" }
      - { name: seats_in_use, type: integer, source: computed, default: 0, description: "Active named-user assignments, concurrent checkouts, or authorized cores" }
      - { name: valid_from_period, type: integer, source: input, description: "First period (inclusive) the grant may activate" }
      - { name: valid_to_period, type: integer, source: input, description: "Period (exclusive) at which the grant auto-expires" }
      - { name: status, type: enum, source: system, description: "PENDING_ACTIVATION → ACTIVE → SUSPENDED → ACTIVE → EXPIRED | REVOKED" }

  - name: ExtensionGrant
    parent: null
    common_fields: true
    fields:
      - { name: license_grant_id, type: string, source: input, description: "FK -> LicenseGrant.id" }
      - { name: extension_code, type: string, source: input, description: "References an entry in the grant's LicenseProduct.extension_modules array by extension_code" }
      - { name: seats_allocated, type: integer, source: input, description: "Extension seats; must be <= parent LicenseGrant.seats_allocated" }
      - { name: status, type: enum, source: system, description: "ACTIVE → REVOKED" }

  - name: NamedUser
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: username, type: string, source: input, description: "Unique within the organization (ERR_DUPLICATE_VALUE)" }
      - { name: email, type: string, source: input, description: "Unique within the organization (ERR_DUPLICATE_VALUE)" }
      - { name: named_user_level, type: enum, source: input, description: "VIEWER | EDITOR | FIELD_WORKER | CREATOR | PROFESSIONAL | PROFESSIONAL_PLUS" }
      - { name: home_license_grant_id, type: string, source: input, description: "FK -> LicenseGrant.id; must reference a NAMED_USER-kind grant of the same org" }
      - { name: status, type: enum, source: system, description: "INVITED → ACTIVE → DISABLED → ACTIVE → DEACTIVATED" }

  - name: DeploymentServer
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: hostname, type: string, source: input, description: "FQDN registered for the deployment; unique within the organization (ERR_DUPLICATE_VALUE)" }
      - { name: role, type: enum, source: input, description: "GIS_SERVER | PORTAL | DATA_STORE | NOTEBOOK_SERVER" }
      - { name: installed_major_version, type: integer, source: input, description: "Currently installed major version" }
      - { name: target_major_version, type: integer, source: system, description: "Set when transitioning AUTHORIZED → UPGRADING; consumed on complete" }
      - { name: auth_mode, type: enum, source: input, description: "BUILTIN | SAML | OIDC | IWA — authentication integration mode" }
      - { name: license_grant_id, type: string, source: input, description: "FK -> LicenseGrant.id; must reference a DEPLOYMENT_SERVER-kind grant of the same org" }
      - { name: cores_allocated, type: integer, source: input, description: "Server cores consumed against the license grant at authorize" }
      - { name: status, type: enum, source: system, description: "REGISTERED → AUTHORIZED → UPGRADING → AUTHORIZED → DECOMMISSIONED" }

  - name: VersionCompatibilityRule
    parent: null
    common_fields: true
    fields:
      - { name: consumer_role, type: enum, source: input, description: "GIS_SERVER | PORTAL | DATA_STORE | NOTEBOOK_SERVER — component being upgraded" }
      - { name: consumer_major_version, type: integer, source: input, description: "Major version the consumer is upgrading TO" }
      - { name: dependency_role, type: enum, source: input, description: "GIS_SERVER | PORTAL | DATA_STORE | NOTEBOOK_SERVER — component it must remain compatible with" }
      - { name: allowed_dependency_major_versions, type: array, source: input, description: "Ordered list of acceptable dependency major versions (most preferred first)" }
      - { name: strict, type: boolean, source: input, description: "true: any violation rejects; false: violation recorded as warning only" }

  - name: ContentItem
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: owner_named_user_id, type: string, source: system, description: "FK -> NamedUser.id; set from X-User-ID at creation" }
      - { name: title, type: string, source: input, description: "Item title" }
      - { name: item_kind, type: enum, source: input, description: "FEATURE_LAYER | TILE_LAYER | BASEMAP | WEB_MAP | NOTEBOOK | API_APP" }
      - { name: sharing_level, type: enum, source: system, description: "PRIVATE ↔ ORGANIZATION ↔ PUBLIC (cyclic, single-step); independent dimension from status" }
      - { name: derived_from_item_id, type: string, source: input, description: "FK -> ContentItem.id (self-referential); present when this item is a derivative work" }
      - { name: contains_licensed_basemap, type: boolean, source: input, default: false, description: "Whether the item embeds a licensed basemap (restricts PUBLIC sharing)" }
      - { name: offline_enabled, type: boolean, source: input, default: false, description: "Requires an ACTIVE grant with supports_offline=true at publish" }
      - { name: storage_bytes, type: integer, source: input, description: "Bytes stored; drives storage_credit_billing" }
      - { name: resolution_rationale, type: string, source: system, description: "Recorded by moderate RESOLVE" }
      - { name: status, type: enum, source: system, description: "DRAFT → PUBLISHED → FLAGGED → PUBLISHED → RETRACTED" }

  - name: ApiKey
    parent: null
    common_fields: true
    fields:
      - { name: named_user_id, type: string, source: input, description: "FK -> NamedUser.id; owning developer" }
      - { name: organization_id, type: string, source: input, description: "Denormalized owning-organization scope; must equal the owner NamedUser's organization_id" }
      - { name: label, type: string, source: input, description: "Developer-supplied label" }
      - { name: allowed_service_kinds, type: array, source: input, description: "Subset of {GEOCODE, ANALYSIS, STORAGE, TILE_QUERY, ROUTING} this key may consume" }
      - { name: per_key_credit_cap, type: integer, source: input, description: "Hard cap on settled credits; 0 means uncapped. Exceeding it at settle auto-revokes the key" }
      - { name: credits_consumed, type: integer, source: computed, default: 0, description: "Total settled credits charged to this key" }
      - { name: status, type: enum, source: system, description: "ACTIVE → REVOKED" }

  - name: CreditBatch
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: api_key_id, type: string, source: input, description: "FK -> ApiKey.id; initiating key; null on system-synthesized storage batches" }
      - { name: service_kind, type: enum, source: input, description: "GEOCODE | ANALYSIS | STORAGE | TILE_QUERY | ROUTING" }
      - { name: requested_units, type: integer, source: input, description: "Billable units (geocodes, analysis jobs, 100-MiB storage units, tile requests, route legs)" }
      - { name: extension_code, type: string, source: input, description: "Optional extension code engaged by this batch; only for service_kind ANALYSIS; must be covered by an ACTIVE ExtensionGrant of the org" }
      - { name: provisional_credits, type: integer, source: computed, description: "Reserved at creation via the provisional variant (round per tier, then sum)" }
      - { name: settled_credits, type: integer, source: computed, description: "Charged at settle via the chronological variant (sum, then round once)" }
      - { name: idempotency_key, type: string, source: input, description: "Same key + same payload replays the original response; same key + different payload → ERR_IDEMPOTENCY_CONFLICT" }
      - { name: status, type: enum, source: system, description: "PENDING → SETTLED | REVERSED" }

  - name: EligibilityVerification
    parent: null
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: program_kind, type: enum, source: input, description: "EDUCATION_PROGRAM | NONPROFIT_PROGRAM" }
      - { name: submitted_by_named_user_id, type: string, source: system, description: "References NamedUser.id; set from X-User-ID at submit/resubmit" }
      - { name: evidence_document_ref, type: string, source: input, description: "Opaque evidence reference; resubmit must supply a different value" }
      - { name: decided_by_named_user_id, type: string, source: system, description: "References NamedUser.id; set at decide; must differ from submitted_by_named_user_id" }
      - { name: decision_rationale, type: string, source: system, description: "Recorded on APPROVED or REJECTED" }
      - { name: valid_through_period, type: integer, source: system, description: "current_period_index + 12 at APPROVE; EV flips to RENEWAL_REQUIRED when current_period_index >= valid_through_period" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → UNDER_REVIEW → APPROVED | REJECTED; APPROVED → RENEWAL_REQUIRED → UNDER_REVIEW" }

# =============================================================================
# §1.2 State Machine Table
# Transition triggers reference the merged action endpoints:
#   POST /geo-orgs/{id}/transition                    payload: target_status
#   POST /license-grants/{id}/transition              payload: target_status, expected_organization_version
#   POST /named-users/{id}/transition                 payload: target_status
#   POST /deployment-servers/{id}/transition          payload: target_status, target_major_version?
#   POST /content-items/{id}/transition               payload: target_status
#   POST /content-items/{id}/moderate                 payload: action, resolution_rationale?
#   POST /credit-batches/{id}/transition              payload: target_status, expected_credit_pool_version
#   POST /eligibility-verifications/{id}/transition   payload: target_status, decision_rationale?, evidence_document_ref?
# =============================================================================
state_machines:
  - entity: Organization
    initial_state: PROVISIONING
    terminal_states: [TERMINATED]
    transitions:
      - from: PROVISIONING
        to: ACTIVE
        trigger: "POST /geo-orgs/{id}/transition (target_status=ACTIVE)"
        actor: PlatformAdmin
        preconditions:
          - "Organization must be PROVISIONING (ERR_ORG_NOT_PROVISIONING)"
          - "A CreditPool row exists for the organization (ERR_NO_CREDIT_POOL)"
          - "At least one LicenseGrant row exists for the organization in any status (ERR_NO_LICENSE_GRANT)"
        side_effects:
          - "status → ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /geo-orgs/{id}/transition (target_status=SUSPENDED) OR system (CreditPool posture flips to OVERDRAWN at batch settle)"
        actor: "PlatformAdmin | system"
        preconditions:
          - "Organization must be ACTIVE (ERR_ORG_NOT_ACTIVE)"
        side_effects:
          - "Cascade: every NamedUser of this org in ACTIVE → DISABLED (each releases its seat: home grant seats_in_use -= 1; their ApiKeys → REVOKED; their PUBLISHED+PUBLIC ContentItems → sharing_level ORGANIZATION)"
          - "Cascade: every LicenseGrant of this org in ACTIVE → SUSPENDED (which revokes its ExtensionGrants — depth-3 chain)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /geo-orgs/{id}/transition (target_status=ACTIVE)"
        actor: PlatformAdmin
        preconditions:
          - "Organization must be SUSPENDED (ERR_ORG_NOT_SUSPENDED)"
          - "CreditPool posture must not be OVERDRAWN (ERR_CREDIT_POOL_OVERDRAWN)"
        side_effects:
          - "LicenseGrants in SUSPENDED with valid_to_period > current_period_index → ACTIVE; with valid_to_period <= current_period_index → EXPIRED (their ExtensionGrants stay REVOKED)"
          - "NamedUsers stay DISABLED; ApiKeys stay REVOKED; ContentItem sharing levels are NOT restored"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /geo-orgs/{id}/transition (target_status=TERMINATED)"
        actor: PlatformAdmin
        preconditions:
          - "Organization must be ACTIVE or SUSPENDED (ERR_ORG_NOT_TERMINABLE)"
          - "No ContentItem of this org in status PUBLISHED or FLAGGED (ERR_PUBLISHED_CONTENT_REMAINS)"
        side_effects:
          - "Every PENDING CreditBatch of this org → REVERSED, releasing reserved_credits (compensation)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /geo-orgs/{id}/transition (target_status=TERMINATED)"
        actor: PlatformAdmin
        preconditions:
          - "Organization must be ACTIVE or SUSPENDED (ERR_ORG_NOT_TERMINABLE)"
          - "No ContentItem of this org in status PUBLISHED or FLAGGED (ERR_PUBLISHED_CONTENT_REMAINS)"
        side_effects:
          - "Every PENDING CreditBatch of this org → REVERSED"

  - entity: LicenseGrant
    initial_state: PENDING_ACTIVATION
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /license-grants/{id}/transition (target_status=ACTIVE)"
        actor: LicenseAdmin
        preconditions:
          - "Grant must be PENDING_ACTIVATION or SUSPENDED for target_status=ACTIVE (ERR_GRANT_NOT_PENDING)"
          - "current_period_index >= valid_from_period (ERR_GRANT_NOT_YET_VALID)"
          - "current_period_index < valid_to_period (ERR_GRANT_EXPIRED)"
          - "Parent Organization ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "LicenseProduct in CATALOG status (ERR_PRODUCT_RETIRED)"
          - "If grant_kind ∈ {EDUCATION_PROGRAM, NONPROFIT_PROGRAM}: an EligibilityVerification of this org with matching program_kind, status APPROVED, valid_through_period > current_period_index exists (ERR_ELIGIBILITY_NOT_APPROVED)"
        side_effects:
          - "status → ACTIVE; Organization.version incremented by 1 (OCC parent)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /license-grants/{id}/transition (target_status=SUSPENDED) OR system cascade (Organization SUSPENDED; EV RENEWAL_REQUIRED; server upgrade beyond product major_version)"
        actor: "LicenseAdmin | system"
        preconditions:
          - "User-initiated: grant must be ACTIVE (ERR_GRANT_NOT_ACTIVE). System-cascade paths (Organization SUSPENDED; EV RENEWAL_REQUIRED; server upgrade beyond product major_version) bypass the role check and are applied only to grants currently ACTIVE"
        side_effects:
          - "Every ExtensionGrant of this grant → REVOKED (cascade down)"
          - "seats_in_use forced to 0 (NamedUsers of a NAMED_USER grant are NOT auto-disabled)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /license-grants/{id}/transition (target_status=ACTIVE, re-activation)"
        actor: LicenseAdmin
        preconditions:
          - "Grant must be SUSPENDED (ERR_GRANT_NOT_SUSPENDED)"
          - "current_period_index < valid_to_period (ERR_GRANT_EXPIRED)"
          - "Parent Organization ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "If grant_kind is a program kind: matching APPROVED EV with valid_through_period > current_period_index (ERR_ELIGIBILITY_NOT_APPROVED)"
        side_effects:
          - "status → ACTIVE; Organization.version incremented by 1; ExtensionGrants are NOT restored"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (period advance: current_period_index >= valid_to_period)"
        actor: system
        preconditions: []
        side_effects:
          - "ExtensionGrants → REVOKED; seats_in_use released to 0"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /license-grants/{id}/transition (target_status=REVOKED)"
        actor: LicenseAdmin
        preconditions:
          - "Grant must be ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "No NamedUser with home_license_grant_id == this grant in status ACTIVE (ERR_NAMED_USERS_STILL_ASSIGNED)"
          - "No DeploymentServer with license_grant_id == this grant in status AUTHORIZED or UPGRADING (ERR_SERVERS_STILL_ATTACHED)"
        side_effects:
          - "ExtensionGrants → REVOKED; seats_in_use released to 0"

  - entity: NamedUser
    initial_state: INVITED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: "POST /named-users/{id}/transition (target_status=ACTIVE) — self-acceptance"
        actor: NamedUser
        preconditions:
          - "NamedUser must be INVITED (ERR_USER_NOT_INVITED)"
          - "X-User-ID must equal this NamedUser's id (ERR_USER_IDENTITY_MISMATCH)"
          - "Parent Organization ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "home_license_grant must be ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "home_license_grant.seats_in_use < seats_allocated (ERR_NO_SEATS_AVAILABLE)"
        side_effects:
          - "home_license_grant.seats_in_use += 1 (ledger sync)"

      - from: ACTIVE
        to: DISABLED
        trigger: "POST /named-users/{id}/transition (target_status=DISABLED) OR system cascade (Organization SUSPENDED)"
        actor: "LicenseAdmin | system"
        preconditions:
          - "NamedUser must be ACTIVE (ERR_USER_NOT_ACTIVE)"
        side_effects:
          - "home_license_grant.seats_in_use -= 1"
          - "ApiKeys owned by this user → REVOKED (cascade)"
          - "ContentItems owned by this user in PUBLISHED with sharing_level PUBLIC → sharing_level ORGANIZATION (cascade)"

      - from: DISABLED
        to: ACTIVE
        trigger: "POST /named-users/{id}/transition (target_status=ACTIVE, re-enable)"
        actor: LicenseAdmin
        preconditions:
          - "NamedUser must be DISABLED (ERR_USER_NOT_DISABLED)"
          - "Parent Organization ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "home_license_grant ACTIVE (ERR_GRANT_NOT_ACTIVE)"
          - "For NAMED_USER home grants: seats_in_use < seats_allocated (ERR_NO_SEATS_AVAILABLE). For CONCURRENT_USE home grants: overage is metered per concurrent_seat_overage_fee instead of blocked"
        side_effects:
          - "home_license_grant.seats_in_use += 1; marginal overage fee accrued when applicable"

      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /named-users/{id}/transition (target_status=DEACTIVATED)"
        actor: LicenseAdmin
        preconditions:
          - "NamedUser must be ACTIVE (ERR_USER_NOT_ACTIVE)"
          - "No ContentItem owned by this user in status PUBLISHED or FLAGGED (ERR_USER_OWNS_PUBLISHED_CONTENT)"
        side_effects:
          - "home_license_grant.seats_in_use -= 1"
          - "ApiKeys owned → REVOKED"

  - entity: DeploymentServer
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: AUTHORIZED
        trigger: "POST /deployment-servers/{id}/transition (target_status=AUTHORIZED)"
        actor: DeploymentAdmin
        preconditions:
          - "Server must be REGISTERED (ERR_SERVER_NOT_REGISTERED)"
          - "Parent Organization ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "license_grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE) and its LicenseProduct.license_kind == DEPLOYMENT_SERVER (ERR_GRANT_KIND_MISMATCH)"
          - "license_grant.seats_in_use + cores_allocated <= license_grant.seats_allocated (ERR_INSUFFICIENT_CORES)"
          - "license_grant's LicenseProduct.major_version == installed_major_version (ERR_VERSION_INCOMPATIBLE)"
        side_effects:
          - "license_grant.seats_in_use += cores_allocated"

      - from: AUTHORIZED
        to: UPGRADING
        trigger: "POST /deployment-servers/{id}/transition (target_status=UPGRADING, target_major_version required)"
        actor: DeploymentAdmin
        preconditions:
          - "Server must be AUTHORIZED (ERR_SERVER_NOT_AUTHORIZED)"
          - "target_major_version > installed_major_version (ERR_INVALID_TARGET_VERSION)"
        side_effects:
          - "target_major_version recorded"

      - from: UPGRADING
        to: AUTHORIZED
        trigger: "POST /deployment-servers/{id}/transition (target_status=AUTHORIZED, completing an upgrade)"
        actor: DeploymentAdmin
        preconditions:
          - "Server must be UPGRADING (ERR_SERVER_NOT_UPGRADING)"
          - "A VersionCompatibilityRule with consumer_role == this server's role AND consumer_major_version == target_major_version exists (ERR_NO_COMPAT_RULE)"
          - "version_compat_check passes for every peer server per the rule (strict rules reject with ERR_VERSION_INCOMPATIBLE)"
        side_effects:
          - "installed_major_version ← target_major_version"
          - "If installed_major_version > license_grant's LicenseProduct.major_version: license_grant ACTIVE → SUSPENDED (cross-entity cascade; that grant's ExtensionGrants → REVOKED)"

      - from: AUTHORIZED
        to: DECOMMISSIONED
        trigger: "POST /deployment-servers/{id}/transition (target_status=DECOMMISSIONED)"
        actor: DeploymentAdmin
        preconditions:
          - "Server must be AUTHORIZED (ERR_SERVER_NOT_AUTHORIZED)"
          - "If role == PORTAL: no other DeploymentServer of the same org in status AUTHORIZED or UPGRADING (ERR_PORTAL_IN_USE)"
        side_effects:
          - "license_grant.seats_in_use -= cores_allocated"

  - entity: ContentItem
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /content-items/{id}/transition (target_status=PUBLISHED)"
        actor: NamedUser
        preconditions:
          - "Item must be DRAFT (ERR_ITEM_NOT_DRAFT)"
          - "X-User-ID == owner_named_user_id (ERR_NOT_ITEM_OWNER)"
          - "Owner NamedUser must be ACTIVE (ERR_USER_NOT_ACTIVE)"
          - "Parent Organization ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "If derived_from_item_id is set: org holds an ACTIVE LicenseGrant whose LicenseProduct.allows_derivative_works == true (ERR_DERIVATIVE_WORKS_NOT_LICENSED), and the source item is in PUBLISHED status (ERR_DERIVATIVE_SOURCE_UNAVAILABLE)"
          - "If offline_enabled == true: org holds an ACTIVE LicenseGrant whose LicenseProduct.supports_offline == true (ERR_OFFLINE_NOT_LICENSED)"
        side_effects:
          - "sharing_level initialized to PRIVATE"
          - "storage_credit_billing: a CreditBatch is synthesized (service_kind STORAGE, requested_units = ceil(storage_bytes/104857600), api_key_id null, idempotency_key 'storage:'+item id) in PENDING; reserved via the provisional variant; posture recomputed"

      - from: PUBLISHED
        to: FLAGGED
        trigger: "POST /content-items/{id}/moderate (action=FLAG)"
        actor: ContentModerator
        preconditions:
          - "Item must be PUBLISHED (ERR_ITEM_NOT_PUBLISHED)"
        side_effects:
          - "sharing_level forced to PRIVATE (bypasses the single-step sharing rule)"
          - "Every other ContentItem with derived_from_item_id == this item in status PUBLISHED → FLAGGED (depth-1 cascade; their own derivatives are NOT re-flagged)"

      - from: FLAGGED
        to: PUBLISHED
        trigger: "POST /content-items/{id}/moderate (action=RESOLVE)"
        actor: ContentModerator
        preconditions:
          - "Item must be FLAGGED (ERR_ITEM_NOT_FLAGGED)"
          - "resolution_rationale present with length >= 20 characters (ERR_INSUFFICIENT_RATIONALE)"
        side_effects:
          - "sharing_level remains PRIVATE; resolution_rationale recorded"

      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /content-items/{id}/transition (target_status=RETRACTED)"
        actor: "NamedUser | ContentModerator"
        preconditions:
          - "Item must be PUBLISHED (ERR_ITEM_NOT_PUBLISHED)"
          - "X-User-Role == ContentModerator OR X-User-ID == owner_named_user_id (ERR_NOT_ITEM_OWNER)"
        side_effects:
          - "The storage CreditBatch synthesized at publish, if still PENDING → REVERSED (compensation; reserved_credits released)"

  # Parallel state dimension on ContentItem: sharing_level evolves independently
  # of status (transitions additionally require status == PUBLISHED).
  - entity: ContentItemSharingLevel
    initial_state: PRIVATE
    terminal_states: []
    transitions:
      - from: PRIVATE
        to: ORGANIZATION
        trigger: "POST /content-items/{id}/share (target_sharing_level=ORGANIZATION)"
        actor: NamedUser
        preconditions:
          - "Item status PUBLISHED (ERR_ITEM_NOT_PUBLISHED)"
          - "X-User-ID == owner_named_user_id (ERR_NOT_ITEM_OWNER)"
          - "Current sharing_level == PRIVATE and target == ORGANIZATION (ERR_INVALID_SHARING_TRANSITION)"
        side_effects:
          - "ContentItem.version incremented by 1 (OCC parent)"

      - from: ORGANIZATION
        to: PUBLIC
        trigger: "POST /content-items/{id}/share (target_sharing_level=PUBLIC)"
        actor: NamedUser
        preconditions:
          - "Item status PUBLISHED (ERR_ITEM_NOT_PUBLISHED)"
          - "X-User-ID == owner_named_user_id (ERR_NOT_ITEM_OWNER)"
          - "Current sharing_level == ORGANIZATION and target == PUBLIC (ERR_INVALID_SHARING_TRANSITION)"
          - "Owner named_user_level ∈ {CREATOR, PROFESSIONAL, PROFESSIONAL_PLUS} (ERR_INSUFFICIENT_USER_LEVEL)"
          - "If contains_licensed_basemap: org holds an ACTIVE LicenseGrant whose LicenseProduct.edition == ADVANCED (ERR_BASEMAP_PUBLIC_REQUIRES_ADVANCED)"
        side_effects:
          - "ContentItem.version incremented by 1"

      - from: PUBLIC
        to: ORGANIZATION
        trigger: "POST /content-items/{id}/share (target_sharing_level=ORGANIZATION) OR system cascade (org suspend, owner disable)"
        actor: "NamedUser | system"
        preconditions:
          - "Item status PUBLISHED (ERR_ITEM_NOT_PUBLISHED)"
          - "User-initiated: X-User-ID == owner_named_user_id (ERR_NOT_ITEM_OWNER); current == PUBLIC and target == ORGANIZATION (ERR_INVALID_SHARING_TRANSITION)"
        side_effects:
          - "ContentItem.version incremented by 1 on user-initiated shares"

      - from: ORGANIZATION
        to: PRIVATE
        trigger: "POST /content-items/{id}/share (target_sharing_level=PRIVATE)"
        actor: NamedUser
        preconditions:
          - "Item status PUBLISHED (ERR_ITEM_NOT_PUBLISHED)"
          - "X-User-ID == owner_named_user_id (ERR_NOT_ITEM_OWNER)"
          - "Current sharing_level == ORGANIZATION and target == PRIVATE (ERR_INVALID_SHARING_TRANSITION)"
        side_effects:
          - "ContentItem.version incremented by 1"

  - entity: CreditBatch
    initial_state: PENDING
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /credit-batches/{id}/transition (target_status=SETTLED)"
        actor: BillingAdmin
        preconditions:
          - "Batch must be PENDING (ERR_BATCH_NOT_PENDING)"
          - "Parent Organization ACTIVE (ERR_ORG_NOT_ACTIVE)"
          - "If api_key_id is non-null (client batches), the ApiKey must be ACTIVE (ERR_API_KEY_REVOKED); system-synthesized storage batches carry api_key_id null and skip this check"
          - "CreditPool posture must not be EXHAUSTED or OVERDRAWN (ERR_CREDIT_POOL_EXHAUSTED)"
        side_effects:
          - "settled_credits computed via the chronological variant of credit_consumption"
          - "CreditPool.reserved_credits -= provisional_credits; CreditPool.consumed_credits += settled_credits; CreditPool.version incremented by 1 (OCC parent)"
          - "If api_key_id non-null: ApiKey.credits_consumed += settled_credits; if per_key_credit_cap > 0 AND credits_consumed > per_key_credit_cap: ApiKey → REVOKED (cascade)"
          - "credit_pool_posture recomputed; Organization.credit_balance recomputed; if posture == OVERDRAWN: Organization → SUSPENDED (depth-3 cascade: settle → pool → org → users/keys/items/grants)"

      - from: PENDING
        to: REVERSED
        trigger: "POST /credit-batches/{id}/transition (target_status=REVERSED) OR system compensation (org terminate, item retract)"
        actor: "BillingAdmin | system"
        preconditions:
          - "Batch must be PENDING (ERR_BATCH_NOT_PENDING)"
        side_effects:
          - "CreditPool.reserved_credits -= provisional_credits (compensation invariant: create+reverse leaves CreditPool fields unchanged)"

  - entity: EligibilityVerification
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /eligibility-verifications/{id}/transition (target_status=UNDER_REVIEW)"
        actor: ComplianceOfficer
        preconditions:
          - "EV must be SUBMITTED (ERR_EV_NOT_SUBMITTED)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /eligibility-verifications/{id}/transition (target_status=APPROVED)"
        actor: ComplianceOfficer
        preconditions:
          - "EV must be UNDER_REVIEW (ERR_EV_NOT_UNDER_REVIEW)"
          - "decision_rationale present (ERR_INVALID_EV_DECISION)"
          - "X-User-ID != submitted_by_named_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "decided_by_named_user_id ← X-User-ID; valid_through_period ← current_period_index + 12"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /eligibility-verifications/{id}/transition (target_status=REJECTED)"
        actor: ComplianceOfficer
        preconditions:
          - "EV must be UNDER_REVIEW (ERR_EV_NOT_UNDER_REVIEW)"
          - "decision_rationale present (ERR_INVALID_EV_DECISION)"
          - "X-User-ID != submitted_by_named_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "decided_by_named_user_id ← X-User-ID"

      - from: APPROVED
        to: RENEWAL_REQUIRED
        trigger: "system (period advance: current_period_index >= valid_through_period)"
        actor: system
        preconditions: []
        side_effects:
          - "Every LicenseGrant of this org with grant_kind == program_kind in status ACTIVE → SUSPENDED (cascade down; their ExtensionGrants → REVOKED — depth-3 chain)"

      - from: RENEWAL_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /eligibility-verifications/{id}/transition (target_status=UNDER_REVIEW, resubmit)"
        actor: NamedUser
        preconditions:
          - "EV must be RENEWAL_REQUIRED (ERR_EV_NOT_RENEWAL_REQUIRED)"
          - "evidence_document_ref present and different from the previously recorded value (ERR_STALE_EVIDENCE)"
        side_effects:
          - "submitted_by_named_user_id ← X-User-ID (new submitter)"

  - entity: ApiKey
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api-keys/{id}/revoke OR system cascade (per-key cap exceeded at settle; owner disabled/deactivated; org suspended)"
        actor: "LicenseAdmin | NamedUser | system"
        preconditions:
          - "ApiKey must be ACTIVE (ERR_API_KEY_REVOKED)"
          - "User-initiated: X-User-ID == named_user_id OR X-User-Role == LicenseAdmin (ERR_NOT_ITEM_OWNER)"
        side_effects:
          - "PENDING CreditBatches of this key stay PENDING but fail settle with ERR_API_KEY_REVOKED until reversed"

  - entity: LicenseProduct
    initial_state: CATALOG
    terminal_states: [RETIRED]
    transitions:
      - from: CATALOG
        to: RETIRED
        trigger: "POST /license-products/{id}/retire"
        actor: PlatformAdmin
        preconditions:
          - "Product must be CATALOG (ERR_PRODUCT_RETIRED)"
        side_effects:
          - "Existing ACTIVE grants keep running; new grant activations against this product fail with ERR_PRODUCT_RETIRED; new ExtensionGrants for its extension_codes fail with ERR_PRODUCT_RETIRED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent entity version only)
# =============================================================================
concurrency_rules:
  - rule_id: grant-activate-stale-org
    parent_entity: Organization
    write_endpoint: "POST /license-grants/{id}/transition"
    occ_field: "expected_organization_version"
    description: |
      A grant transition carrying an expected_organization_version that no
      longer matches the Organization's current version is rejected. Grant
      activations themselves increment Organization.version, so a second
      sequential activate carrying the first call's observed version fails.
      The field is required on every call to this endpoint.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: content-share-stale-item
    parent_entity: ContentItem
    write_endpoint: "POST /content-items/{id}/share"
    occ_field: "expected_content_item_version"
    description: |
      Sharing a ContentItem whose version has advanced since the client
      last observed it (a prior share moved the level, or a moderator flag
      forced it PRIVATE) is rejected with a stale-version error.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: batch-settle-stale-pool
    parent_entity: CreditPool
    write_endpoint: "POST /credit-batches/{id}/transition"
    occ_field: "expected_credit_pool_version"
    description: |
      A batch transition carrying an expected_credit_pool_version that no
      longer matches the CreditPool's current version is rejected. An
      earlier settle bumped consumed_credits and the version, so two
      sequential settles cannot double-draw against a stale reserved view.
      The field is required on every call to this endpoint.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_pool_posture
    trigger: "every mutation of CreditPool.consumed_credits, reserved_credits, or capacity_credits; recomputed on read"
    algorithm: threshold
    formula: |
      available = capacity_credits - consumed_credits - reserved_credits
      if available < 0:  posture = OVERDRAWN
      elif available == 0: posture = EXHAUSTED
      elif available < low_credit_threshold_credits: posture = LOW_CREDIT
      else: posture = OK
      Boundary: available == low_credit_threshold_credits exactly → OK
      (LOW_CREDIT is strictly less-than). Organization.credit_balance equals
      `available` and is recomputed on the same trigger.
    input_set: "the org's CreditPool row; output mirrored onto Organization.credit_balance"
    constants:
      EXHAUSTED_AT: 0
    precision: "integer credits, exact comparisons"

  - name: credit_consumption
    trigger: "CreditBatch creation (provisional variant) and batch transition to SETTLED (chronological variant)"
    algorithm: tiered_pricing
    formula: |
      Tier table TIERS[service_kind] applies per unit; extension uplift
      (only for ANALYSIS with extension_code) adds the extension's
      additional_credit_rate_per_op per unit in every tier.
      PROVISIONAL variant (rounding order pinned: per tier, then sum):
        total = 0
        remaining = requested_units
        for tier in TIERS ascending by tier_min_units:
          in_tier = min(remaining, tier.tier_max_units - tier.tier_min_units + 1)
          if in_tier <= 0: continue
          rate = tier.credits_per_unit + (extension_rate if ANALYSIS-with-extension else 0)
          total += round_half_up(in_tier * rate)
          remaining -= in_tier
        provisional_credits = total
      CHRONOLOGICAL variant (rounding order pinned: sum raw, round once;
      PLUS a late fee for batches that sat PENDING across period boundaries):
        raw = sum over tiers of (in_tier * rate) WITHOUT per-tier rounding
        periods_pending = current_period_index - (org period index at batch creation)
        settled_credits = round_half_up(raw * (1 + LATE_FEE_PER_PERIOD * periods_pending))
      Settling in the creation period (periods_pending == 0) charges raw
      exactly; each full period pending adds 10%. The two variants therefore
      DIVERGE whenever a batch is settled one or more periods after creation,
      and a settle can push available negative even when creation passed the
      ERR_INSUFFICIENT_CREDITS check — which is exactly how the OVERDRAWN
      posture and its Organization cascade become reachable.
      Tier boundary precision: tier_max_units is inclusive,
      so GEOCODE 100 units = 100*4 = 400 and 101 units = 400 + 1*3 = 403.
    input_set: "CreditBatch + the extension entry in the org's ACTIVE ExtensionGrants (if extension_code set)"
    constants:
      LATE_FEE_PER_PERIOD: 0.1
      TIERS:
        GEOCODE:
          - { tier_min_units: 1,     tier_max_units: 100,    credits_per_unit: 4 }
          - { tier_min_units: 101,   tier_max_units: 1000,   credits_per_unit: 3 }
          - { tier_min_units: 1001,  tier_max_units: 999999, credits_per_unit: 2 }
        ANALYSIS:
          - { tier_min_units: 1,     tier_max_units: 10,     credits_per_unit: 40 }
          - { tier_min_units: 11,    tier_max_units: 100,    credits_per_unit: 30 }
          - { tier_min_units: 101,   tier_max_units: 999999, credits_per_unit: 20 }
        STORAGE:
          - { tier_min_units: 1,     tier_max_units: 999999, credits_per_unit: 1 }
        TILE_QUERY:
          - { tier_min_units: 1,     tier_max_units: 10000,  credits_per_unit: 1 }
          - { tier_min_units: 10001, tier_max_units: 999999, credits_per_unit: 1 }
        ROUTING:
          - { tier_min_units: 1,     tier_max_units: 50,     credits_per_unit: 8 }
          - { tier_min_units: 51,    tier_max_units: 999999, credits_per_unit: 5 }
    precision: "integer credits; round_half_up; per-tier-then-sum for provisional, sum-then-round for chronological"
    variants:
      - name: provisional
        when: "CreditBatch creation"
        difference: "round_half_up applied per tier before summation"
      - name: chronological
        when: "CreditBatch transition to SETTLED"
        difference: "summation first with a single round_half_up at the end, plus a 10%-per-period late fee on the raw total for batches settled after their creation period"

  - name: eligibility_renewal_window
    trigger: "period advance (POST /_clock/set_current_utc)"
    algorithm: threshold
    formula: |
      An EligibilityVerification in APPROVED transitions to RENEWAL_REQUIRED
      when current_period_index >= valid_through_period. Boundary precision:
      at exactly valid_through_period the EV flips (>= comparison); at
      valid_through_period - 1 it remains APPROVED. valid_through_period is
      set to current_period_index + 12 at decision time, so an EV approved
      at period 3 stays APPROVED through period 14 and flips at period 15.
    input_set: "EligibilityVerification rows in APPROVED"
    constants:
      APPROVAL_WINDOW_PERIODS: 12
    precision: "integer periods, >= comparison"

  - name: concurrent_seat_overage_fee
    trigger: "NamedUser re-enable onto a CONCURRENT_USE home grant when seats_in_use would exceed seats_allocated (CONCURRENT_USE overage is metered, not blocked; NAMED_USER and DEPLOYMENT_SERVER remain hard caps)"
    algorithm: tiered_pricing
    formula: |
      A checkout that pushes seats_in_use from k to k+1 with
      k+1 > seats_allocated incurs the MARGINAL tier fee for overage seat
      number (k+1 - seats_allocated):
        overage seat 1..5:   250 cents
        overage seat 6..20:  400 cents
        overage seat 21+:    700 cents
      Organization.seat_overage_fee_accrued_cents += that marginal fee.
    input_set: "LicenseGrant (CONCURRENT_USE kind) + parent Organization"
    constants:
      OVERAGE_TIER1_MAX: 5
      OVERAGE_TIER1_CENTS: 250
      OVERAGE_TIER2_MAX: 20
      OVERAGE_TIER2_CENTS: 400
      OVERAGE_TIER3_CENTS: 700
    precision: "integer cents"
    variants:
      - name: sustained_overage_fee
        when: "period advance (POST /_clock/set_current_utc) while overage seats remain checked out"
        difference: |
          At each period advance, SUSTAINED overage seats
          (max(0, seats_in_use - seats_allocated)) are re-charged with the
          AVERAGE-RATE form of the same table: tier1_count*250 +
          tier2_count*400 + tier3_count*700 over ALL N sustained seats, not
          just the marginal seat. Marginal-at-checkout vs
          average-at-period-boundary produce different accruals for
          identical seat histories.

  - name: version_compat_check
    trigger: "POST /deployment-servers/{id}/transition completing an upgrade (UPGRADING → AUTHORIZED)"
    algorithm: constraint_propagation
    formula: |
      For server S (role R) completing an upgrade to target_major_version V:
        1. Rules lookup: all VersionCompatibilityRules with consumer_role == R
           and consumer_major_version == V. If none → ERR_NO_COMPAT_RULE.
        2. For each such rule r (evaluated in created_at ASC order), iterate
           peer DeploymentServers P of the same org with P.id != S.id,
           P.role == r.dependency_role, P.status ∈ {AUTHORIZED, UPGRADING}:
             if P.installed_major_version ∉ r.allowed_dependency_major_versions:
               r.strict == true  → reject ERR_VERSION_INCOMPATIBLE
               r.strict == false → record a warning (returned in the response meta)
        3. Only after all rules pass: installed_major_version ← V, then the
           license-grant cascade check (V > grant's product major_version →
           grant ACTIVE → SUSPENDED) runs LAST.
    input_set: "the upgrading server + VersionCompatibilityRule rows + same-org peer servers"
    constants: {}
    precision: "exact integer version equality; rule evaluation order created_at ASC"

  - name: storage_credit_billing
    trigger: "ContentItem DRAFT → PUBLISHED"
    algorithm: aggregation
    formula: |
      requested_units = ceil(storage_bytes / 104857600)   # 100 MiB units
      storage_bytes = 0 → 0 units (a zero-unit batch is still created with
      provisional_credits = 0); storage_bytes = 1 → 1; 104857600 → 1;
      104857601 → 2. The synthesized batch has service_kind STORAGE, a
      system idempotency_key 'storage:' + item id, api_key_id null, and
      skips the ApiKey checks at both create and settle (does not touch
      ApiKey.credits_consumed).
    input_set: "ContentItem being published"
    constants:
      BYTES_PER_STORAGE_UNIT: 104857600
    precision: "integer units, ceiling"

  - name: credit_burn_projection
    trigger: "GET /geo-orgs/{id}/credit-pool-projection?periods=N&mode=..."
    algorithm: forward_looking
    formula: |
      FORWARD_LOOKING (default mode=forward):
        projected = consumed_credits + reserved_credits
                  + N * sum over ACTIVE grants of (seats_in_use * per_seat_burn)
        per_seat_burn = 2 for NAMED_USER, 5 for CONCURRENT_USE, 0 for DEPLOYMENT_SERVER
      CHRONOLOGICAL (mode=chronological):
        replay SETTLED batches of the org in created_at ASC order; per batch:
          periods_alive = max(1, current_period_index - period index at batch creation)
          batch_projection = settled_credits * N / periods_alive
        projected = round_half_up(sum of batch_projections)
      The variants diverge whenever live seat occupancy and historical batch
      burn tell different stories; both are pinned for caller selection.
    input_set: "CreditPool + ACTIVE LicenseGrants + SETTLED CreditBatches of the org"
    constants:
      PER_SEAT_BURN_NAMED_USER: 2
      PER_SEAT_BURN_CONCURRENT: 5
      PER_SEAT_BURN_DEPLOYMENT: 0
    precision: "integer credits, round_half_up on final sum"
    variants:
      - name: chronological
        when: "mode=chronological query parameter"
        difference: "replays settled-batch history instead of projecting from live seats"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be authorized for this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 2.5
    category: existence
    check: "Request body must contain all required input fields with matching types; enum fields must be members of the declared enum; unknown body fields are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 3
    category: existence
    check: "Path id must resolve to an existing resource"
    error_id: "ERR_ORG_NOT_FOUND | ERR_USER_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_SERVER_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_KEY_NOT_FOUND | ERR_EV_NOT_FOUND | ERR_PRODUCT_NOT_FOUND"
    http_status: 404
    applies_to: "all single-resource endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced FKs must exist, checked in the endpoint's declared input order (organization_id before license_product_id before home_license_grant_id etc.)"
    error_id: "ERR_ORG_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_USER_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_KEY_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints with body FKs"

  - priority: 5
    category: state
    check: "OCC: expected_*_version must match the current parent entity version; checked before any business rule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /license-grants/{id}/transition, POST /content-items/{id}/share, POST /credit-batches/{id}/transition"

  - priority: 6
    category: state
    check: "Target entity must be in a state from which the requested target_status/action transition exists"
    error_id: "ERR_ORG_NOT_PROVISIONING | ERR_ORG_NOT_ACTIVE | ERR_ORG_NOT_SUSPENDED | ERR_ORG_NOT_TERMINABLE | ERR_GRANT_NOT_PENDING | ERR_GRANT_NOT_ACTIVE | ERR_GRANT_NOT_SUSPENDED | ERR_USER_NOT_INVITED | ERR_USER_NOT_ACTIVE | ERR_USER_NOT_DISABLED | ERR_SERVER_NOT_REGISTERED | ERR_SERVER_NOT_AUTHORIZED | ERR_SERVER_NOT_UPGRADING | ERR_ITEM_NOT_DRAFT | ERR_ITEM_NOT_PUBLISHED | ERR_ITEM_NOT_FLAGGED | ERR_BATCH_NOT_PENDING | ERR_EV_NOT_SUBMITTED | ERR_EV_NOT_UNDER_REVIEW | ERR_EV_NOT_RENEWAL_REQUIRED | ERR_API_KEY_REVOKED | ERR_PRODUCT_RETIRED | ERR_INVALID_SHARING_TRANSITION"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: business_referential
    check: "Identity: NamedUser self-transition to ACTIVE from INVITED requires X-User-ID == the named user id; content transition/share require X-User-ID == owner (retract also allows ContentModerator); API key create/revoke as NamedUser requires X-User-ID == named_user_id"
    error_id: "ERR_USER_IDENTITY_MISMATCH | ERR_NOT_ITEM_OWNER"
    http_status: 403
    applies_to: "POST /named-users/{id}/transition, POST /content-items/{id}/transition|share, POST /api-keys, POST /api-keys/{id}/revoke"

  - priority: 8
    category: business_referential
    check: "Kind matching: NamedUser.home_license_grant_id must reference a NAMED_USER-kind grant of the same org; DeploymentServer.license_grant_id must reference a DEPLOYMENT_SERVER-kind grant of the same org"
    error_id: ERR_GRANT_KIND_MISMATCH
    http_status: 409
    applies_to: "POST /named-users, POST /deployment-servers"

  - priority: 9
    category: business_temporal
    check: "Grant window: current_period_index >= valid_from_period on first activation; current_period_index < valid_to_period on any activation"
    error_id: "ERR_GRANT_NOT_YET_VALID | ERR_GRANT_EXPIRED"
    http_status: 409
    applies_to: "POST /license-grants/{id}/transition (target_status=ACTIVE)"

  - priority: 10
    category: business_safety
    check: "Program-kind grants require an APPROVED EligibilityVerification of matching program_kind with valid_through_period > current_period_index"
    error_id: ERR_ELIGIBILITY_NOT_APPROVED
    http_status: 403
    applies_to: "POST /license-grants/{id}/transition (target_status=ACTIVE, grant_kind EDUCATION_PROGRAM | NONPROFIT_PROGRAM)"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: EV decider X-User-ID must differ from submitted_by_named_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /eligibility-verifications/{id}/transition (target_status APPROVED | REJECTED)"

  - priority: 12
    category: business_constraint
    check: "ExtensionGrant: extension_code must exist in the grant's product extension_modules array (ERR_EXTENSION_NOT_FOUND), its required_min_edition <= grant's product edition (BASIC < STANDARD < ADVANCED), seats_allocated <= grant.seats_allocated, grant must be ACTIVE, product must be CATALOG"
    error_id: "ERR_EXTENSION_NOT_FOUND | ERR_EXTENSION_EDITION_MISMATCH | ERR_EXTENSION_SEATS_EXCEED_GRANT | ERR_GRANT_NOT_ACTIVE | ERR_PRODUCT_RETIRED"
    http_status: 409
    applies_to: "POST /extension-grants"

  - priority: 13
    category: business_constraint
    check: "Sharing transitions must be single-step along PRIVATE↔ORGANIZATION↔PUBLIC; user-initiated PUBLIC→PRIVATE direct is invalid"
    error_id: ERR_INVALID_SHARING_TRANSITION
    http_status: 409
    applies_to: "POST /content-items/{id}/share"

  - priority: 14
    category: business_safety
    check: "PUBLIC sharing gate: owner named_user_level ∈ {CREATOR, PROFESSIONAL, PROFESSIONAL_PLUS}"
    error_id: ERR_INSUFFICIENT_USER_LEVEL
    http_status: 403
    applies_to: "POST /content-items/{id}/share (target PUBLIC)"

  - priority: 15
    category: business_safety
    check: "PUBLIC sharing of a contains_licensed_basemap item requires an ACTIVE grant whose product edition == ADVANCED"
    error_id: ERR_BASEMAP_PUBLIC_REQUIRES_ADVANCED
    http_status: 403
    applies_to: "POST /content-items/{id}/share (target PUBLIC)"

  - priority: 16
    category: business_safety
    check: "Publish gates: derivative items need an ACTIVE allows_derivative_works grant; offline_enabled needs an ACTIVE supports_offline grant; derived source must be PUBLISHED"
    error_id: "ERR_DERIVATIVE_WORKS_NOT_LICENSED | ERR_OFFLINE_NOT_LICENSED | ERR_DERIVATIVE_SOURCE_UNAVAILABLE"
    http_status: 403
    applies_to: "POST /content-items/{id}/transition (target_status=PUBLISHED)"

  - priority: 17
    category: business_fiscal
    check: "Capacity: named-user transition to ACTIVE on a NAMED_USER grant needs seats_in_use < seats_allocated; server authorize needs seats_in_use + cores_allocated <= seats_allocated (NAMED_USER and DEPLOYMENT_SERVER are hard caps; CONCURRENT_USE overage is metered instead)"
    error_id: "ERR_NO_SEATS_AVAILABLE | ERR_INSUFFICIENT_CORES"
    http_status: 409
    applies_to: "POST /named-users/{id}/transition (target ACTIVE), POST /deployment-servers/{id}/transition (target AUTHORIZED from REGISTERED)"

  - priority: 18
    category: business_fiscal
    check: "CreditPool available (capacity - consumed - reserved) must be >= provisional_credits of a new batch"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 402
    applies_to: "POST /credit-batches"

  - priority: 19
    category: business_fiscal
    check: "Org reinstate requires posture != OVERDRAWN; batch settle requires posture != EXHAUSTED and != OVERDRAWN"
    error_id: "ERR_CREDIT_POOL_OVERDRAWN | ERR_CREDIT_POOL_EXHAUSTED"
    http_status: 402
    applies_to: "POST /geo-orgs/{id}/transition (SUSPENDED→ACTIVE), POST /credit-batches/{id}/transition (SETTLED)"

  - priority: 20
    category: business_constraint
    check: "Upgrade rules: target_major_version > installed_major_version; compat rule must exist for (role, target); strict-mode peer check passes; authorize requires installed_major_version == grant product major_version"
    error_id: "ERR_INVALID_TARGET_VERSION | ERR_NO_COMPAT_RULE | ERR_VERSION_INCOMPATIBLE"
    http_status: 409
    applies_to: "POST /deployment-servers/{id}/transition"

  - priority: 21
    category: business_constraint
    check: "Idempotency: same idempotency_key + same payload → original response replayed with the original id; same key + different payload → conflict"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /credit-batches"

  - priority: 22
    category: business_safety
    check: "Grant revoke blocked by ACTIVE named users or AUTHORIZED/UPGRADING servers referencing the grant"
    error_id: "ERR_NAMED_USERS_STILL_ASSIGNED | ERR_SERVERS_STILL_ATTACHED"
    http_status: 409
    applies_to: "POST /license-grants/{id}/transition (target_status=REVOKED)"

  - priority: 23
    category: business_safety
    check: "Org terminate blocked while PUBLISHED or FLAGGED ContentItems exist; user deactivate blocked while user owns PUBLISHED or FLAGGED items"
    error_id: "ERR_PUBLISHED_CONTENT_REMAINS | ERR_USER_OWNS_PUBLISHED_CONTENT"
    http_status: 409
    applies_to: "POST /geo-orgs/{id}/transition (TERMINATED), POST /named-users/{id}/transition (DEACTIVATED)"

  - priority: 24
    category: business_safety
    check: "PORTAL decommission blocked while any sibling server of the org is AUTHORIZED or UPGRADING"
    error_id: ERR_PORTAL_IN_USE
    http_status: 409
    applies_to: "POST /deployment-servers/{id}/transition (target DECOMMISSIONED, role PORTAL)"

  - priority: 25
    category: business_referential
    check: "EV resubmit requires a different evidence_document_ref; EV decide requires decision_rationale; content RESOLVE requires resolution_rationale length >= 20"
    error_id: "ERR_STALE_EVIDENCE | ERR_INVALID_EV_DECISION | ERR_INSUFFICIENT_RATIONALE"
    http_status: 409
    applies_to: "POST /eligibility-verifications/{id}/transition, POST /content-items/{id}/moderate"

  - priority: 26
    category: business_fiscal
    check: "CreditBatch service_kind must be in the ApiKey's allowed_service_kinds; ApiKey must be ACTIVE at creation"
    error_id: "ERR_SERVICE_KIND_NOT_ALLOWED | ERR_API_KEY_REVOKED"
    http_status: 403
    applies_to: "POST /credit-batches"

  - priority: 27
    category: business_fiscal
    check: "extension_code only allowed for service_kind ANALYSIS; when present it must be covered by an ACTIVE ExtensionGrant of an ACTIVE grant of the org"
    error_id: "ERR_EXTENSION_NOT_APPLICABLE | ERR_EXTENSION_NOT_GRANTED"
    http_status: 400
    applies_to: "POST /credit-batches"

  - priority: 28
    category: existence
    check: "Org activation requires a CreditPool row and at least one LicenseGrant row"
    error_id: "ERR_NO_CREDIT_POOL | ERR_NO_LICENSE_GRANT"
    http_status: 409
    applies_to: "POST /geo-orgs/{id}/transition (PROVISIONING→ACTIVE)"

  - priority: 29
    category: business_constraint
    check: "Uniqueness: LicenseProduct.product_code globally unique; NamedUser username/email unique within the org; DeploymentServer hostname unique within the org"
    error_id: ERR_DUPLICATE_VALUE
    http_status: 409
    applies_to: "POST /license-products, POST /named-users, POST /deployment-servers"

# =============================================================================
# §1.5 API Endpoint Table (flat topology — 40 endpoints)
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is 2026-09-01T00:00:00Z; never falls back to wall-clock. Advances every Organization.current_period_index by the whole-day delta, then runs: grant auto-expiry (valid_to_period reached), EV renewal-window flip (cascades program grants → SUSPENDED), sustained overage fee accrual, posture recomputation."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, advanced_periods: integer }
    side_effects: ["current_period_index += whole-day delta on every Organization", "ACTIVE grants with valid_to_period <= new period → EXPIRED", "APPROVED EVs with valid_through_period <= new period → RENEWAL_REQUIRED (cascade)", "sustained_overage_fee accrued", "postures recomputed"]

  # --- Organizations ---
  - method: POST
    path: "/geo-orgs"
    description: "Create an Organization (PROVISIONING)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, org_kind, home_region]
    output: Organization
    side_effects: []

  - method: GET
    path: "/geo-orgs/{id}"
    description: "Get an Organization"
    roles: [PlatformAdmin, LicenseAdmin, BillingAdmin, ComplianceOfficer, ContentModerator, DeploymentAdmin, NamedUser]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: POST
    path: "/geo-orgs/{id}/transition"
    description: "Organization lifecycle: target_status ACTIVE (activate from PROVISIONING, reinstate from SUSPENDED) | SUSPENDED | TERMINATED"
    roles: [PlatformAdmin]
    code: 200
    input: [target_status]
    output: Organization
    side_effects: ["per §1.2 Organization machine, including cascades"]

  # --- Credit pool ---
  - method: POST
    path: "/geo-orgs/credit-pools"
    description: "Create the CreditPool for an org (one per org)"
    roles: [BillingAdmin]
    code: 201
    input: [organization_id, capacity_credits, "low_credit_threshold_credits?"]
    output: CreditPool
    side_effects: ["posture computed", "Organization.credit_balance recomputed"]

  - method: GET
    path: "/geo-orgs/credit-pools/{id}"
    description: "Get a CreditPool by id"
    roles: [PlatformAdmin, LicenseAdmin, BillingAdmin]
    code: 200
    input: []
    output: CreditPool
    side_effects: []

  - method: GET
    path: "/geo-orgs/credit-pools"
    description: "List CreditPools (filtered by organization_id)"
    roles: [PlatformAdmin, LicenseAdmin, BillingAdmin]
    code: 200
    input: ["organization_id?", "limit?", "offset?"]
    output: "CreditPool[]"
    side_effects: []

  - method: GET
    path: "/geo-orgs/{id}/credit-pool-projection"
    description: "Projected credit burn over N periods (mode=forward default | chronological)"
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: [periods, "mode?"]
    output: { projected_credits: integer, mode: string }
    side_effects: []

  # --- Catalog: products ---
  - method: POST
    path: "/geo-orgs/license-products"
    description: "Create a LicenseProduct (CATALOG) with embedded extension_modules array"
    roles: [PlatformAdmin]
    code: 201
    input: [product_code, license_kind, edition, major_version, base_seat_count, supports_offline, allows_derivative_works, "extension_modules?"]
    output: LicenseProduct
    side_effects: []

  - method: POST
    path: "/geo-orgs/license-products/{id}/retire"
    description: "CATALOG → RETIRED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LicenseProduct
    side_effects: ["new grant activations and extension grants against this product fail"]

  # --- License grants ---
  - method: POST
    path: "/geo-orgs/license-grants"
    description: "Create a LicenseGrant (PENDING_ACTIVATION)"
    roles: [LicenseAdmin]
    code: 201
    input: [organization_id, license_product_id, grant_kind, seats_allocated, valid_from_period, valid_to_period]
    output: LicenseGrant
    side_effects: []

  - method: GET
    path: "/geo-orgs/license-grants"
    description: "List LicenseGrants (filters cover both FKs)"
    roles: [PlatformAdmin, LicenseAdmin, BillingAdmin, DeploymentAdmin, NamedUser]
    code: 200
    input: ["organization_id?", "license_product_id?", "status?", "grant_kind?", "limit?", "offset?"]
    output: "LicenseGrant[]"
    side_effects: []

  - method: GET
    path: "/geo-orgs/license-grants/{id}"
    description: "Get a LicenseGrant"
    roles: [PlatformAdmin, LicenseAdmin, BillingAdmin, DeploymentAdmin, NamedUser]
    code: 200
    input: []
    output: LicenseGrant
    side_effects: []

  - method: POST
    path: "/geo-orgs/license-grants/{id}/transition"
    description: "Grant lifecycle: target_status ACTIVE (from PENDING_ACTIVATION or SUSPENDED) | SUSPENDED | REVOKED; OCC on Organization.version"
    roles: [LicenseAdmin]
    code: 200
    input: [target_status, expected_organization_version]
    output: LicenseGrant
    side_effects: ["per §1.2 LicenseGrant machine", "on activate: increments Organization.version by 1"]

  # --- Extension grants ---
  - method: POST
    path: "/geo-orgs/extension-grants"
    description: "Attach an ExtensionGrant (by extension_code) to an ACTIVE LicenseGrant"
    roles: [LicenseAdmin]
    code: 201
    input: [license_grant_id, extension_code, seats_allocated]
    output: ExtensionGrant
    side_effects: []

  - method: GET
    path: "/geo-orgs/license-grants/{id}/extension-grants"
    description: "List ExtensionGrants of a LicenseGrant"
    roles: [PlatformAdmin, LicenseAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ExtensionGrant[]"
    side_effects: []

  # --- Named users ---
  - method: POST
    path: "/geo-orgs/named-users"
    description: "Invite a NamedUser (INVITED)"
    roles: [LicenseAdmin]
    code: 201
    input: [organization_id, username, email, named_user_level, home_license_grant_id]
    output: NamedUser
    side_effects: []

  - method: GET
    path: "/geo-orgs/named-users"
    description: "List NamedUsers (filters cover both FKs)"
    roles: [PlatformAdmin, LicenseAdmin, ComplianceOfficer]
    code: 200
    input: ["organization_id?", "home_license_grant_id?", "status?", "named_user_level?", "limit?", "offset?"]
    output: "NamedUser[]"
    side_effects: []

  - method: GET
    path: "/geo-orgs/named-users/{id}"
    description: "Get a NamedUser"
    roles: [PlatformAdmin, LicenseAdmin, ComplianceOfficer, NamedUser]
    code: 200
    input: []
    output: NamedUser
    side_effects: []

  - method: POST
    path: "/geo-orgs/named-users/{id}/transition"
    description: "NamedUser lifecycle: target_status ACTIVE (self-accept from INVITED by the user themself; re-enable from DISABLED by LicenseAdmin) | DISABLED | DEACTIVATED"
    roles: [LicenseAdmin, NamedUser]
    code: 200
    input: [target_status]
    output: NamedUser
    side_effects: ["per §1.2 NamedUser machine (seat consume/release, key revocation, item demotion, overage metering)"]

  # --- Deployment servers ---
  - method: POST
    path: "/geo-orgs/deployment-servers"
    description: "Register a DeploymentServer (REGISTERED)"
    roles: [DeploymentAdmin]
    code: 201
    input: [organization_id, hostname, role, installed_major_version, auth_mode, license_grant_id, cores_allocated]
    output: DeploymentServer
    side_effects: []

  - method: GET
    path: "/geo-orgs/deployment-servers"
    description: "List DeploymentServers (filters cover both FKs)"
    roles: [PlatformAdmin, DeploymentAdmin, LicenseAdmin]
    code: 200
    input: ["organization_id?", "license_grant_id?", "status?", "role?", "limit?", "offset?"]
    output: "DeploymentServer[]"
    side_effects: []

  - method: GET
    path: "/geo-orgs/deployment-servers/{id}"
    description: "Get a DeploymentServer"
    roles: [PlatformAdmin, DeploymentAdmin, LicenseAdmin]
    code: 200
    input: []
    output: DeploymentServer
    side_effects: []

  - method: POST
    path: "/geo-orgs/deployment-servers/{id}/transition"
    description: "Server lifecycle: target_status AUTHORIZED (from REGISTERED = authorize; from UPGRADING = complete-upgrade) | UPGRADING (requires target_major_version) | DECOMMISSIONED"
    roles: [DeploymentAdmin]
    code: 200
    input: [target_status, "target_major_version?"]
    output: DeploymentServer
    side_effects: ["per §1.2 DeploymentServer machine (core allocation/release, version_compat_check, grant cascade)"]

  # --- Version compatibility rules ---
  - method: POST
    path: "/geo-orgs/version-compatibility-rules"
    description: "Create a VersionCompatibilityRule"
    roles: [PlatformAdmin]
    code: 201
    input: [consumer_role, consumer_major_version, dependency_role, allowed_dependency_major_versions, strict]
    output: VersionCompatibilityRule
    side_effects: []

  # --- Content items ---
  - method: POST
    path: "/geo-orgs/content-items"
    description: "Create a ContentItem (DRAFT, sharing PRIVATE); owner ← X-User-ID"
    roles: [NamedUser]
    code: 201
    input: [organization_id, title, item_kind, storage_bytes, "derived_from_item_id?", "contains_licensed_basemap?", "offline_enabled?"]
    output: ContentItem
    side_effects: ["owner_named_user_id ← X-User-ID"]

  - method: GET
    path: "/geo-orgs/content-items"
    description: "List ContentItems (filters cover all three FKs). Visibility: PRIVATE items only to owner/PlatformAdmin/ContentModerator; ORGANIZATION to same-org members; PUBLIC to all"
    roles: [PlatformAdmin, LicenseAdmin, ContentModerator, ComplianceOfficer, NamedUser]
    code: 200
    input: ["organization_id?", "owner_named_user_id?", "derived_from_item_id?", "sharing_level?", "status?", "item_kind?", "limit?", "offset?"]
    output: "ContentItem[]"
    side_effects: []

  - method: GET
    path: "/geo-orgs/content-items/{id}"
    description: "Get a ContentItem (same visibility rules as list; invisible → ERR_ITEM_NOT_FOUND)"
    roles: [PlatformAdmin, LicenseAdmin, ContentModerator, ComplianceOfficer, NamedUser]
    code: 200
    input: []
    output: ContentItem
    side_effects: []

  - method: POST
    path: "/geo-orgs/content-items/{id}/transition"
    description: "Item status lifecycle: target_status PUBLISHED (from DRAFT; synthesizes storage CreditBatch) | RETRACTED (from PUBLISHED; reverses pending storage batch)"
    roles: [NamedUser, ContentModerator]
    code: 200
    input: [target_status]
    output: ContentItem
    side_effects: ["per §1.2 ContentItem machine"]

  - method: POST
    path: "/geo-orgs/content-items/{id}/share"
    description: "Single-step sharing transition PRIVATE↔ORGANIZATION↔PUBLIC; OCC on ContentItem.version"
    roles: [NamedUser]
    code: 200
    input: [target_sharing_level, expected_content_item_version]
    output: ContentItem
    side_effects: ["increments ContentItem.version by 1"]

  - method: POST
    path: "/geo-orgs/content-items/{id}/moderate"
    description: "Moderation: action FLAG (PUBLISHED → FLAGGED, forces PRIVATE, flags depth-1 derivatives) | RESOLVE (FLAGGED → PUBLISHED; requires resolution_rationale >= 20 chars)"
    roles: [ContentModerator]
    code: 200
    input: [action, "resolution_rationale?"]
    output: ContentItem
    side_effects: ["per §1.2 ContentItem machine"]

  # --- API keys ---
  - method: POST
    path: "/geo-orgs/api-keys"
    description: "Issue an ApiKey (NamedUser: self only, X-User-ID == named_user_id; LicenseAdmin: any user)"
    roles: [NamedUser, LicenseAdmin]
    code: 201
    input: [named_user_id, organization_id, label, allowed_service_kinds, per_key_credit_cap]
    output: ApiKey
    side_effects: []

  - method: GET
    path: "/geo-orgs/named-users/{id}/api-keys"
    description: "List ApiKeys of a NamedUser"
    roles: [PlatformAdmin, LicenseAdmin, BillingAdmin, NamedUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ApiKey[]"
    side_effects: []

  - method: POST
    path: "/geo-orgs/api-keys/{id}/revoke"
    description: "ACTIVE → REVOKED (NamedUser: own keys only)"
    roles: [LicenseAdmin, NamedUser]
    code: 200
    input: []
    output: ApiKey
    side_effects: []

  # --- Credit batches ---
  - method: POST
    path: "/geo-orgs/credit-batches"
    description: "Submit a CreditBatch (PENDING) with idempotency; provisional reservation"
    roles: [NamedUser, BillingAdmin]
    code: 201
    input: [organization_id, api_key_id, service_kind, requested_units, "extension_code?", idempotency_key]
    output: CreditBatch
    side_effects: ["provisional_credits via provisional variant", "reserved_credits += provisional", "posture recomputed"]

  - method: GET
    path: "/geo-orgs/credit-batches"
    description: "List CreditBatches (filters cover both FKs)"
    roles: [BillingAdmin, PlatformAdmin, LicenseAdmin]
    code: 200
    input: ["organization_id?", "api_key_id?", "status?", "service_kind?", "limit?", "offset?"]
    output: "CreditBatch[]"
    side_effects: []

  - method: GET
    path: "/geo-orgs/credit-batches/{id}"
    description: "Get a CreditBatch"
    roles: [BillingAdmin, PlatformAdmin, LicenseAdmin]
    code: 200
    input: []
    output: CreditBatch
    side_effects: []

  - method: POST
    path: "/geo-orgs/credit-batches/{id}/transition"
    description: "Batch lifecycle: target_status SETTLED (chronological variant; may cascade org → SUSPENDED) | REVERSED (compensation); OCC on CreditPool.version"
    roles: [BillingAdmin]
    code: 200
    input: [target_status, expected_credit_pool_version]
    output: CreditBatch
    side_effects: ["per §1.2 CreditBatch machine", "increments CreditPool.version by 1"]

  # --- Eligibility verifications ---
  - method: POST
    path: "/geo-orgs/eligibility-verifications"
    description: "Submit an EV (SUBMITTED); submitter ← X-User-ID"
    roles: [NamedUser]
    code: 201
    input: [organization_id, program_kind, evidence_document_ref]
    output: EligibilityVerification
    side_effects: ["submitted_by_named_user_id ← X-User-ID"]

  - method: GET
    path: "/geo-orgs/eligibility-verifications"
    description: "List EligibilityVerifications (filtered by organization_id)"
    roles: [ComplianceOfficer, PlatformAdmin, LicenseAdmin, NamedUser]
    code: 200
    input: ["organization_id?", "status?", "program_kind?", "limit?", "offset?"]
    output: "EligibilityVerification[]"
    side_effects: []

  - method: GET
    path: "/geo-orgs/eligibility-verifications/{id}"
    description: "Get an EligibilityVerification by id"
    roles: [ComplianceOfficer, PlatformAdmin, LicenseAdmin, NamedUser]
    code: 200
    input: []
    output: EligibilityVerification
    side_effects: []

  - method: POST
    path: "/geo-orgs/eligibility-verifications/{id}/transition"
    description: "EV lifecycle: target_status UNDER_REVIEW (from SUBMITTED by ComplianceOfficer; from RENEWAL_REQUIRED by NamedUser with new evidence_document_ref) | APPROVED | REJECTED (require decision_rationale)"
    roles: [ComplianceOfficer, NamedUser]
    code: 200
    input: [target_status, "decision_rationale?", "evidence_document_ref?"]
    output: EligibilityVerification
    side_effects: ["on APPROVED: valid_through_period ← current_period_index + 12"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth & identity
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, or out-of-enum value" }
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed for this endpoint per §1.7" }
  - { id: ERR_USER_IDENTITY_MISMATCH, http: 403, condition: "X-User-ID must equal the NamedUser being acted on (self-accept, self key issue)" }
  - { id: ERR_NOT_ITEM_OWNER, http: 403, condition: "X-User-ID is not the ContentItem owner (and not an override role)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "EV decider must differ from submitter" }

  # Not found
  - { id: ERR_ORG_NOT_FOUND, http: 404, condition: "Organization not found" }
  - { id: ERR_USER_NOT_FOUND, http: 404, condition: "NamedUser not found" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "LicenseGrant not found" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "LicenseProduct not found" }
  - { id: ERR_EXTENSION_NOT_FOUND, http: 404, condition: "extension_code not present in the grant's product extension_modules array" }
  - { id: ERR_SERVER_NOT_FOUND, http: 404, condition: "DeploymentServer not found" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "ContentItem not found (or not visible to the caller)" }
  - { id: ERR_KEY_NOT_FOUND, http: 404, condition: "ApiKey not found" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "CreditBatch not found" }
  - { id: ERR_EV_NOT_FOUND, http: 404, condition: "EligibilityVerification not found" }

  # Concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the current parent entity version" }

  # Organization
  - { id: ERR_ORG_NOT_PROVISIONING, http: 409, condition: "Organization must be PROVISIONING for first activation" }
  - { id: ERR_ORG_NOT_ACTIVE, http: 409, condition: "Organization must be ACTIVE for this operation" }
  - { id: ERR_ORG_NOT_SUSPENDED, http: 409, condition: "Organization must be SUSPENDED for reinstate" }
  - { id: ERR_ORG_NOT_TERMINABLE, http: 409, condition: "Organization must be ACTIVE or SUSPENDED for terminate" }
  - { id: ERR_NO_CREDIT_POOL, http: 409, condition: "Org activate requires a CreditPool row" }
  - { id: ERR_NO_LICENSE_GRANT, http: 409, condition: "Org activate requires at least one LicenseGrant row" }
  - { id: ERR_PUBLISHED_CONTENT_REMAINS, http: 409, condition: "Org terminate requires zero PUBLISHED or FLAGGED ContentItems" }

  # License grants
  - { id: ERR_GRANT_NOT_PENDING, http: 409, condition: "LicenseGrant must be PENDING_ACTIVATION or SUSPENDED for an activate transition" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "LicenseGrant must be ACTIVE" }
  - { id: ERR_GRANT_NOT_SUSPENDED, http: 409, condition: "LicenseGrant must be SUSPENDED for re-activation" }
  - { id: ERR_GRANT_NOT_YET_VALID, http: 409, condition: "current_period_index < valid_from_period" }
  - { id: ERR_GRANT_EXPIRED, http: 409, condition: "current_period_index >= valid_to_period" }
  - { id: ERR_GRANT_KIND_MISMATCH, http: 409, condition: "Referenced grant's license_kind does not match the consumer's requirement, or grant belongs to another org" }
  - { id: ERR_PRODUCT_RETIRED, http: 409, condition: "LicenseProduct is RETIRED" }
  - { id: ERR_NAMED_USERS_STILL_ASSIGNED, http: 409, condition: "Grant revoke blocked: ACTIVE NamedUsers reference it" }
  - { id: ERR_SERVERS_STILL_ATTACHED, http: 409, condition: "Grant revoke blocked: AUTHORIZED or UPGRADING DeploymentServers reference it" }
  - { id: ERR_NO_SEATS_AVAILABLE, http: 409, condition: "NAMED_USER grant has no free seats (hard cap)" }
  - { id: ERR_INSUFFICIENT_CORES, http: 409, condition: "DEPLOYMENT_SERVER grant lacks the requested cores (hard cap)" }

  # Extensions
  - { id: ERR_EXTENSION_EDITION_MISMATCH, http: 409, condition: "Extension's required_min_edition exceeds the grant's product edition" }
  - { id: ERR_EXTENSION_SEATS_EXCEED_GRANT, http: 409, condition: "ExtensionGrant.seats_allocated > LicenseGrant.seats_allocated" }
  - { id: ERR_EXTENSION_NOT_APPLICABLE, http: 400, condition: "extension_code supplied for a non-ANALYSIS service_kind" }
  - id: ERR_EXTENSION_NOT_GRANTED
    http: 400
    condition: "No ACTIVE ExtensionGrant of this org covers the supplied extension_code"
  - id: ERR_DUPLICATE_VALUE
    http: 409
    condition: "Uniqueness violation: product_code globally unique; NamedUser username/email unique within org; DeploymentServer hostname unique within org"

  # Named users
  - { id: ERR_USER_NOT_INVITED, http: 409, condition: "NamedUser must be INVITED for self-accept" }
  - { id: ERR_USER_NOT_ACTIVE, http: 409, condition: "NamedUser must be ACTIVE" }
  - { id: ERR_USER_NOT_DISABLED, http: 409, condition: "NamedUser must be DISABLED for re-enable" }
  - { id: ERR_USER_OWNS_PUBLISHED_CONTENT, http: 409, condition: "Cannot deactivate: user owns PUBLISHED or FLAGGED ContentItems" }
  - { id: ERR_INSUFFICIENT_USER_LEVEL, http: 403, condition: "PUBLIC sharing requires CREATOR / PROFESSIONAL / PROFESSIONAL_PLUS" }

  # Servers
  - { id: ERR_SERVER_NOT_REGISTERED, http: 409, condition: "DeploymentServer must be REGISTERED" }
  - { id: ERR_SERVER_NOT_AUTHORIZED, http: 409, condition: "DeploymentServer must be AUTHORIZED" }
  - { id: ERR_SERVER_NOT_UPGRADING, http: 409, condition: "DeploymentServer must be UPGRADING when completing an upgrade" }
  - { id: ERR_INVALID_TARGET_VERSION, http: 409, condition: "target_major_version must be > installed_major_version" }
  - { id: ERR_NO_COMPAT_RULE, http: 409, condition: "No VersionCompatibilityRule matches (consumer_role, target_major_version)" }
  - { id: ERR_VERSION_INCOMPATIBLE, http: 409, condition: "Version/compat constraint failed (strict peer rule or authorize major-version mismatch)" }
  - { id: ERR_PORTAL_IN_USE, http: 409, condition: "Cannot decommission PORTAL while sibling servers are AUTHORIZED or UPGRADING" }

  # Content
  - { id: ERR_ITEM_NOT_DRAFT, http: 409, condition: "ContentItem must be DRAFT for publish" }
  - { id: ERR_ITEM_NOT_PUBLISHED, http: 409, condition: "ContentItem must be PUBLISHED for this operation" }
  - { id: ERR_ITEM_NOT_FLAGGED, http: 409, condition: "ContentItem must be FLAGGED for RESOLVE" }
  - { id: ERR_INVALID_SHARING_TRANSITION, http: 409, condition: "Sharing must move one step along PRIVATE↔ORGANIZATION↔PUBLIC" }
  - { id: ERR_DERIVATIVE_WORKS_NOT_LICENSED, http: 403, condition: "No ACTIVE grant with allows_derivative_works=true" }
  - { id: ERR_OFFLINE_NOT_LICENSED, http: 403, condition: "offline_enabled requires an ACTIVE grant with supports_offline=true" }
  - { id: ERR_DERIVATIVE_SOURCE_UNAVAILABLE, http: 403, condition: "derived_from_item_id is not a PUBLISHED item" }
  - { id: ERR_BASEMAP_PUBLIC_REQUIRES_ADVANCED, http: 403, condition: "PUBLIC sharing of a licensed-basemap item requires an ACTIVE ADVANCED-edition grant" }
  - { id: ERR_INSUFFICIENT_RATIONALE, http: 400, condition: "resolution_rationale length must be >= 20 characters" }

  # Credits / billing
  - { id: ERR_CREDIT_POOL_OVERDRAWN, http: 402, condition: "CreditPool posture is OVERDRAWN" }
  - { id: ERR_CREDIT_POOL_EXHAUSTED, http: 402, condition: "CreditPool posture is EXHAUSTED or OVERDRAWN at settle time" }
  - { id: ERR_INSUFFICIENT_CREDITS, http: 402, condition: "Available credits insufficient for the new provisional reservation" }
  - { id: ERR_BATCH_NOT_PENDING, http: 409, condition: "CreditBatch must be PENDING" }
  - { id: ERR_API_KEY_REVOKED, http: 409, condition: "ApiKey is REVOKED" }
  - { id: ERR_SERVICE_KIND_NOT_ALLOWED, http: 403, condition: "ApiKey.allowed_service_kinds excludes the requested service_kind" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different payload" }

  # Eligibility
  - { id: ERR_EV_NOT_SUBMITTED, http: 409, condition: "EV must be SUBMITTED for begin-review" }
  - { id: ERR_EV_NOT_UNDER_REVIEW, http: 409, condition: "EV must be UNDER_REVIEW for decide" }
  - { id: ERR_EV_NOT_RENEWAL_REQUIRED, http: 409, condition: "EV must be RENEWAL_REQUIRED for resubmit" }
  - { id: ERR_INVALID_EV_DECISION, http: 400, condition: "decision_rationale required for APPROVED/REJECTED transitions" }
  - { id: ERR_STALE_EVIDENCE, http: 409, condition: "Resubmit requires a different evidence_document_ref" }
  - { id: ERR_ELIGIBILITY_NOT_APPROVED, http: 403, condition: "No APPROVED EV covers this program_kind with valid_through_period > current_period_index" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Top-level operator: organizations, catalog products, compat rules, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /geo-orgs, POST /geo-orgs/{id}/transition"
      - "POST /license-products, POST /license-products/{id}/retire"
      - "POST /version-compatibility-rules"
    shared_operations:
      - "GET on every collection"

  - name: LicenseAdmin
    description: "License administrator: grants, extension grants, named users, API keys"
    identity: opaque
    exclusive_operations:
      - "POST /license-grants, POST /license-grants/{id}/transition"
      - "POST /extension-grants"
    shared_operations:
      - "POST /named-users (exclusive), POST /named-users/{id}/transition (shared with NamedUser for self-accept)"
      - "POST /api-keys, POST /api-keys/{id}/revoke (shared with NamedUser)"
      - "GET on grants, users, servers, items, keys, batches, EVs, pools"

  - name: DeploymentAdmin
    description: "Deployment administrator: server lifecycle and version upgrades"
    identity: opaque
    exclusive_operations:
      - "POST /deployment-servers, POST /deployment-servers/{id}/transition"
    shared_operations:
      - "GET on servers, products, grants"

  - name: BillingAdmin
    description: "Billing administrator: credit pool, batch settlement, projections"
    identity: opaque
    exclusive_operations:
      - "POST /credit-pools"
      - "POST /credit-batches/{id}/transition"
      - "GET /geo-orgs/{id}/credit-pool-projection"
    shared_operations:
      - "POST /credit-batches (shared with NamedUser)"
      - "GET on pools, batches, grants, keys"

  - name: ComplianceOfficer
    description: "Reviews EligibilityVerifications; entity-backed so segregation-of-duties compares X-User-ID against the submitter's NamedUser id"
    identity: "entity_backed:NamedUser"
    exclusive_operations:
      - "POST /eligibility-verifications/{id}/transition to UNDER_REVIEW (from SUBMITTED), APPROVED, REJECTED"
    shared_operations:
      - "GET on EVs, users, orgs, items"

  - name: ContentModerator
    description: "Flags and resolves flags on ContentItems; can retract any published item"
    identity: opaque
    exclusive_operations:
      - "POST /content-items/{id}/moderate"
    shared_operations:
      - "POST /content-items/{id}/transition to RETRACTED (shared with the owner NamedUser)"
      - "GET on items, orgs"

  - name: NamedUser
    description: "Entity-backed end user: accepts own invitation, owns content items and API keys, submits EVs, consumes credits via own keys"
    identity: "entity_backed:NamedUser"
    exclusive_operations:
      - "POST /named-users/{id}/transition to ACTIVE from INVITED (self only)"
      - "POST /content-items, POST /content-items/{id}/share (own items)"
      - "POST /eligibility-verifications, POST /eligibility-verifications/{id}/transition to UNDER_REVIEW from RENEWAL_REQUIRED"
    shared_operations:
      - "POST /content-items/{id}/transition to PUBLISHED (own items) / RETRACTED (own items; shared with ContentModerator)"
      - "POST /api-keys (self only), POST /api-keys/{id}/revoke (own keys only)"
      - "POST /credit-batches (via own ApiKey)"
      - "GET on own org's resources"
