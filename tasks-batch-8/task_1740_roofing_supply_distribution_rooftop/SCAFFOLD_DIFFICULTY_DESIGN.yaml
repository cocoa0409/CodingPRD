      - name: confirm_wrong_state_vs_credit_exceeded_state_wins
        grounds:
          - validations[priority=4]
          - validations[priority=11]
        distinguishing_aspect: |
          Category pair state (priority 4) vs business_fiscal (priority 11):
          an order that is both in the wrong state (already CONFIRMED) AND
          would exceed credit must surface the state error
          ERR_ORDER_NOT_QUOTED, not the fiscal error.
        test_recipe:
          setup:
            - "Contractor with credit_limit 1000 (tiny); one order already CONFIRMED"
            - "Attempt to confirm the same order again — also would exceed credit"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-V1", name: "Valid", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
