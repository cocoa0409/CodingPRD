              payload: { registration_number: "REG-DE-1001" }
              as: RegulatoryAffairs
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /brand-ops/market-registrations/${reg_id}/renew"
              payload: { new_expires_on: "2028-06-30T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { error_id: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brand-ops/market-registrations/${reg_id}/renew"
              payload: { new_expires_on: "2028-06-30T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { reg_status: $.data.status, reg_exp: $.data.expires_on }
          assert:
            - "one second before the window: renew fails 409 with error_id == ERR_RENEWAL_WINDOW_NOT_OPEN and the registration stays ACTIVE"
            - "at exactly expires_on - 90 days (2026-10-03T00:00:00Z) the sweep flips the registration to RENEWAL_DUE — the boundary instant is inside the window"
            - "the second renew returns 200: status == ACTIVE and expires_on == 2028-06-30T00:00:00Z"

