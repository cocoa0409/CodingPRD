      - name: gift_refund_cascade_revokes_credit_and_uncovers_cycle
        grounds:
          - state_machines.GiftOrder.CLAIMED_CREDIT_to_REFUNDED
          - state_machines.Credit.PARTIALLY_CONSUMED_to_REVOKED
          - state_machines.Cycle.FULLY_COVERED_to_UNCHARGED
          - state_machines.RegistryItem.FULFILLED_to_PARTIALLY_FULFILLED
          - calculations.gift_credit_applied_cents
        distinguishing_aspect: |
          A depth-5 chain from a DIFFERENT trigger than the deliver cascade: gift refund ->
          the derived GIFT Credit is REVOKED -> because that credit had covered a PLANNED cycle,
          the cycle's gift_credit_applied_cents is reversed to 0 and total_due_cents rises 0 ->
          2999 -> because the total rose above 0 the payment axis goes FULLY_COVERED -> UNCHARGED
          -> because the cycle became UNCHARGED, Account.next_charge_estimate_cents becomes 2999.
