  - section: calculations
    instances:
      - name: corner_calc_staging_bay_ranking_heavy_max_light_min_then_exhaustion
        claim_type: Correct Result
        grounds:
          - calculations.staging_bay_selector
          - global_constants.HEAVY_VEHICLE_LBS
          - errors.ERR_NO_STAGING_BAY_AVAILABLE
        distinguishing_aspect: "The selector's ranking expression is weight-dependent and inverted: heavy rigs take MAX(free bays) and light rigs MIN(free bays), the eligibility set shrinks as entries accumulate, and 9000 lbs exactly counts as heavy (>=). A 4-bay venue therefore hands out bays in the order 1, 4, 2, 3 and the fifth entry has an empty candidate set."
        test_recipe:
          setup:
            - "A CONFIRMED booking at the 4-bay Atlanta Dome with its TourStop and show timing set"
            - "One Competitor that will enter four different vehicle numbers on the same stop"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
            - call: "POST /competitors"
              payload: { team_name: "Bay Order Racing", driver_name: "T. Nolan", home_market_code: "CLT", vehicle_class: "LIGHT" }
              as: SeriesPromoter
              captures: { comp1: "$.data.id" }
          trigger:
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "1", vehicle_weight_lbs: 7200, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T18:00:00Z" }
              as: SeriesPromoter
              captures: { e_light_1: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "2", vehicle_weight_lbs: 9000, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T18:00:00Z" }
              as: SeriesPromoter
              captures: { e_heavy_1: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "3", vehicle_weight_lbs: 8999, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T18:00:00Z" }
              as: SeriesPromoter
              captures: { e_light_2: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "4", vehicle_weight_lbs: 12000, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T18:00:00Z" }
              as: SeriesPromoter
              captures: { e_heavy_2: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "5", vehicle_weight_lbs: 7000, haul_distance_miles: 100, scheduled_arrival_utc: "2026-11-14T18:00:00Z" }
              as: SeriesPromoter
              captures: { err_no_bay: "$.data.error_id" }
          assert:
            - "VehicleEntry.${e_light_1}.staging_bay_index == 1 (light rig takes MIN of {1,2,3,4})"
            - "VehicleEntry.${e_heavy_1}.staging_bay_index == 4 (9000 lbs is heavy at the inclusive boundary, so it takes MAX of {2,3,4})"
            - "VehicleEntry.${e_light_2}.staging_bay_index == 2 (8999 lbs is light, MIN of {2,3})"
            - "VehicleEntry.${e_heavy_2}.staging_bay_index == 3 (heavy, MAX of the single remaining candidate {3})"
            - "trigger call 5 returns HTTP 409 with ${err_no_bay} == ERR_NO_STAGING_BAY_AVAILABLE and creates nothing: GET /vehicle-entries with tour_stop_id ${stop_atl} still returns total_count == 4"
            - "every created entry has logistics_state == ENTERED, readiness_variant == PRE_STAGING and readiness_score == 100 (haul 100 mi gives FLOOR(100/500) == 0 risk blocks and the promised arrival 18:00Z precedes staging close 21:00Z)"

      - name: corner_calc_required_provisioning_at_the_attendance_6000_threshold
        claim_type: Constants Applied
        grounds:
          - calculations.required_safety_provisioning
          - global_constants.ALS_STAFF_COST_CENTS
          - global_constants.BLS_STAFF_COST_CENTS
          - global_constants.AMBULANCE_COST_CENTS
          - global_constants.BARRIER_COST_PER_FOOT_CENTS
