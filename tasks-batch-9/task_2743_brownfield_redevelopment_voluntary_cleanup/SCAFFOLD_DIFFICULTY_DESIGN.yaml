      - name: certify_owner_check_precedes_site_frozen_gate
        grounds:
          - validations[6].ERR_NOT_RESOURCE_OWNER
          - validations[10].ERR_SITE_FROZEN
          - validations[12].ERR_INVALID_OBLIGATION_STATE
          - validations[29].ERR_CERTIFICATION_WINDOW_CLOSED
          - state_machines.ContinuingObligation.CURRENT_to_LAPSED
        distinguishing_aspect: |
          Category pair = auth (priority 6) versus state (priority 10). The
          certify call is made by a second REDEVELOPER party that does not own
          the site, against an obligation on a FROZEN site whose status is
          already LAPSED and whose due_date has passed — four rules are violated
          at once (6, 10, 12, 29) and only the ownership error may surface.
          Re-running the identical call as the true owner returns
          ERR_SITE_FROZEN, which fixes the ordering of the next rung too.
        test_recipe:
          setup:
            - "Clock 2026-08-01; two REDEVELOPER parties (the site owner and an unrelated one), one consultant."
            - "Site with a LiabilityProtection carrying the REASONABLE_STEPS obligation due 2027-06-30 and the INSTITUTIONAL_CONTROL_MAINTENANCE obligation due 2027-02-05."
            - "Clock moved to 2027-07-01 and a compliance sweep run, so both obligations are LAPSED, bfpp_status is FORFEITED and Site.cleanup_posture is FROZEN."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - &k_redev2
              call: "POST /parties"
              payload: { legal_name: "Harborline Property Group LLC", party_type: REDEVELOPER, state_code: "OH" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { redev2_id: $.data.id }
            - *k_consult
            - *k_site
            - *k_prot
            - *k_ob_rs
            - *k_ob_ic
            - *k_clock_2707a
            - *k_sweep_2707a
          trigger:
            - &k_certify_wrong_owner
              call: "POST /continuing-obligations/${ob_ic_id}/certify"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev2_id}"
              captures: { c_err1: $.data.error_id }
            - &k_certify_owner_frozen
              call: "POST /continuing-obligations/${ob_ic_id}/certify"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { c_err2: $.data.error_id }
          assert:
            - "the first certify returns HTTP 403 with error_id == 'ERR_NOT_RESOURCE_OWNER' (priority 6 wins over priorities 10, 12 and 29)"
            - "the first certify does NOT return 'ERR_SITE_FROZEN', 'ERR_INVALID_OBLIGATION_STATE' or 'ERR_CERTIFICATION_WINDOW_CLOSED'"
            - "the second certify, by the true owner ${redev_id}, returns HTTP 409 with error_id == 'ERR_SITE_FROZEN' (priority 10 wins over 12 and 29)"
            - "Site.${site_id}.cleanup_posture == FROZEN and LiabilityProtection.${prot_id}.bfpp_status == FORFEITED"
            - "ContinuingObligation.${ob_ic_id}.status == LAPSED and certification_count == 0 after both rejected calls"
            - "ContinuingObligation.${ob_ic_id}.due_date == '2027-02-05' (unchanged: no certification advanced it)"

  # ===========================================================================
  # Rule 6 — Boundary / precision checks on four different metrics through four
  #          distinct endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: compliance_pct_exactly_at_threshold_returns_to_current
        grounds:
          - calculations.bfpp_compliance
          - entities.LiabilityProtection.fields.compliance_pct
          - state_machines.ContinuingObligation.AT_RISK_to_SATISFIED
          - state_machines.LiabilityProtection.AT_RISK_to_CURRENT
        distinguishing_aspect: |
          Metric = compliance_pct against COMPLIANCE_THRESHOLD 0.85, exercised
          through POST /continuing-obligations/{id}/certify. Certifying the
          weight-4 obligation moves the weighted score from
          (10 + 0 + 0.5*10)/20 = 0.7500 to (10 + 4 + 0.5*6)/20 = 0.8500 exactly.
          Because the comparison is >=, obligation_state must return to CURRENT;
          a strict > implementation would leave it AT_RISK. Certifying the
          weight-3 NOTIFICATION obligation instead would give 16.5/20 = 0.8250
          and would legitimately stay AT_RISK, so the boundary is the only thing
          the two cases differ on.
        test_recipe:
          setup:
            - "Clock 2026-08-01; site acquired with an AAI_COMPLETE inquiry so bfpp_status is ESTABLISHED."
            - "Five continuing obligations imposed by reviewer-alpha, total weight 20: REASONABLE_STEPS and LAND_USE_RESTRICTION_COMPLIANCE (weights 5 and 5) due 2027-06-30; INSTITUTIONAL_CONTROL_MAINTENANCE (4), ACCESS_AND_COOPERATION (3) and NOTIFICATION (3) due 2027-02-05."
            - "Clock 2027-01-10 and a compliance sweep at as_of_date 2027-01-10: the three obligations due 2027-02-05 are 26 days out, inside AT_RISK_GRACE_DAYS 30, so they become AT_RISK and compliance_pct falls to 0.7500."
          setup_api_calls:
            - *k_clock0
            - *k_redev
            - *k_consult
            - *k_site
            - *k_prot
            - *k_p1
            - *k_p1f
            - *k_p1sub
            - *k_p1app
            - *k_inq
            - *k_clock_acq
            - *k_acq
            - *k_ob_rs
            - *k_ob_lu
            - *k_ob_ic
            - *k_ob_ac
            - *k_ob_nt
            - &k_clock_2701b
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - &k_sweep_2701b
              call: "POST /compliance-sweeps"
              payload: { as_of_date: "2027-01-10", site_id: "${site_id}" }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          trigger:
            - &k_certify_ic
              call: "POST /continuing-obligations/${ob_ic_id}/certify"
              payload: {}
              as: Redeveloper
              as_user_id: "${redev_id}"
          assert:
            - "before the trigger: LiabilityProtection.${prot_id}.compliance_pct == 0.7500, obligation_state == AT_RISK, current_weight == 10, at_risk_weight == 10, satisfied_weight == 0"
            - "the sweep response had at_risk_count == 3 and lapsed_count == 0"
            - "after the trigger: LiabilityProtection.${prot_id}.compliance_pct == 0.8500 exactly"
            - "after the trigger: LiabilityProtection.${prot_id}.obligation_state == CURRENT (>= is inclusive at the threshold)"
            - "after the trigger: current_weight == 10, satisfied_weight == 4, at_risk_weight == 6, lapsed_weight == 0, obligations_total_weight == 20"
            - "LiabilityProtection.${prot_id}.bfpp_status == ESTABLISHED throughout"
            - "ContinuingObligation.${ob_ic_id}.status == SATISFIED, certification_count == 1, prior_due_date == '2027-02-05' and due_date == '2027-05-06' (2027-02-05 + 90 days)"

