scenario: |
  2257. Graduate Assistantship & Stipend Administration (university graduate school): assistantship type
  classification across teaching, research and administrative appointments, appointment percentage effort
  with tuition remission and health insurance eligibility, stipend minimum policies and pay period calendars
  tied to appointment dates, workload limits including international student hour restrictions, funding source
  assignment across grants and departmental budgets with cost sharing, appointment renewal, non-renewal notice
  and satisfactory progress requirements, over-appointment and dual-role conflict detection, taxation of
  tuition benefits above thresholds

domain_name: graduate-assistantship-stipend-administration

# Flat topology: peer collections joined by foreign keys, no single owning root resource.
# Every path below is absolute and lives directly under the empty prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Eleven peer collections linked by explicit FK fields. No nesting in URL paths except the two
  # AcademicTerm sub-resource reads (calendar + policy discovery), which exist for reverse reachability.

  state_machine_shape: parallel
  # Appointment carries two independent state axes (lifecycle_status x payroll_status) that advance on
  # disjoint trigger sets. RenewalDecision (SAP_CERTIFIED -> DRAFT), FundingSource (SUSPENDED -> ACTIVE)
  # and TaxAssessment (FINAL -> AMENDED -> FINAL) add revision cycles; FundingAllocation branches
  # COMMITTED -> {RELEASED, EXPENDED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # AcademicTerm -> PayPeriod / StipendPolicy / Appointment / TaxAssessment
    - many_to_many       # Appointment <-> FundingSource through FundingAllocation (cost sharing)
    - self_referential   # Appointment.renewed_from_appointment_id -> Appointment.id (renewal chain)
    - cross_aggregate    # StipendDisbursement splits reference FundingAllocation rows of another aggregate

  role_model: segregation_of_duties
  # Two enforced separations: (1) the user who certifies satisfactory academic progress on a
  # RenewalDecision may not issue that decision's notice; (2) the user who raised a student's effort cap
  # may not approve an appointment that relies on the raised cap.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 11 entities / 53 endpoints / 8 state machines / 9 calculations (2 dual-variant) / 56 error codes.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: AcademicTerm
    parent: null
    common_fields: true
    fields:
      - name: term_code
        type: string
        source: input
        description: Human-readable term identifier, e.g. FALL2026
        constraints: "unique across all AcademicTerm rows; 1-32 chars"
      - name: term_start
        type: string
        source: input
        description: First calendar date of the term (inclusive)
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: term_end
        type: string
        source: input
        description: Last calendar date of the term (inclusive)
        constraints: "ISO 8601 calendar date; must be >= term_start"
      - name: tax_calendar_year
        type: integer
        source: input
        description: Calendar year whose tuition-benefit exemption cap this term consumes
        constraints: "2000-2100"
      - name: session_type
        type: enum
        source: input
        description: Whether the term is an instructional session or a between-terms break
        constraints: "IN_SESSION | BREAK"
      - name: proration_method
        type: enum
        source: input
        description: Which pay-period proration algorithm this term's payroll uses
        constraints: "CALENDAR_DAY | WORKDAY"
      - name: remission_drop_deadline
        type: string
        source: input
        description: Date on/after which a terminated appointment keeps its tuition remission
        constraints: "ISO 8601 calendar date; must fall inside [term_start, term_end]"
      - name: status
        type: enum
        source: system
        description: Term lifecycle state; gates every child mutation
        default: PLANNING
        constraints: "PLANNING | OPEN | PAYROLL_LOCKED | CLOSED"
      - name: pay_period_count
        type: integer
        source: computed
        description: Count of PayPeriod rows whose term_id equals this term's id
        default: 0
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant at which status became PAYROLL_LOCKED; null before that
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which status became CLOSED; null before that
        default: null

  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Departmental short code, e.g. CHEM
        constraints: "1-16 chars; not required to be unique"
      - name: name
        type: string
        source: input
        description: Department display name
      - name: non_renewal_notice_days
        type: integer
        source: input
        description: Days before an appointment's end_date by which a NON_RENEW notice must be issued
        default: 60
        constraints: "1-180"

  - name: StipendPolicy
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term this policy governs"
      - name: assistantship_type
        type: enum
        source: input
        description: Appointment class this policy applies to
        constraints: "TEACHING | RESEARCH | ADMINISTRATIVE"
      - name: degree_level
        type: enum
        source: input
        description: Student degree level this policy applies to
        constraints: "MASTERS | DOCTORAL"
      - name: min_fte_monthly_stipend_cents
        type: integer
        source: input
        description: Minimum full-time-equivalent monthly stipend, in cents
        constraints: ">= 1"
      - name: insurance_min_effort_pct
        type: integer
        source: input
        description: Minimum appointment effort percentage for health-insurance eligibility
        default: 50
        constraints: "1-100"
      - name: min_insurance_duration_days
        type: integer
        source: input
        description: Minimum inclusive appointment duration in days for health-insurance eligibility
        default: 90
        constraints: ">= 1"
      - name: per_credit_tuition_cents
        type: integer
        source: input
        description: Tuition charge per enrolled credit hour, in cents
        constraints: ">= 1"
      - name: max_remission_cents_per_term
        type: integer
        source: input
        description: Hard ceiling on tuition remission for one appointment in one term, in cents
        constraints: ">= 1"
      - name: term_insurance_premium_cents
        type: integer
        source: input
        description: Full term health-insurance premium, in cents, before subsidy
        constraints: ">= 0"
      - name: tuition_tax_exempt_cap_cents
        type: integer
        source: input
        description: Per-calendar-year tuition-benefit amount exempt from imputed income
        default: 525000
        constraints: ">= 0"

  - name: PayPeriod
    parent: null
    common_fields: true
    fields:
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; the term whose payroll calendar this period belongs to"
      - name: sequence_no
        type: integer
        source: input
        description: 1-based ordinal of this period inside its term's calendar
        constraints: "1-24; unique per term_id"
      - name: period_start
        type: string
        source: input
        description: First date covered by the period (inclusive)
        constraints: "ISO 8601 calendar date"
      - name: period_end_exclusive
        type: string
        source: input
        description: First date NOT covered by the period (exclusive upper bound)
        constraints: "ISO 8601 calendar date; must be > period_start"
      - name: pay_date
        type: string
        source: input
        description: Date the period's stipend is disbursed
        constraints: "ISO 8601 calendar date; must be >= period_end_exclusive"
      - name: calendar_day_count
        type: integer
        source: computed
        description: (period_end_exclusive - period_start) in whole days
      - name: workday_count
        type: integer
        source: computed
        description: Count of Monday-Friday dates in [period_start, period_end_exclusive)
      - name: status
        type: enum
        source: system
        description: Payroll lock state of the period
        default: OPEN
        constraints: "OPEN | LOCKED | CLOSED"

  - name: GraduateStudent
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: Registrar student number
        constraints: "unique across all GraduateStudent rows"
      - name: full_name
        type: string
        source: input
        description: Student display name
      - name: degree_level
        type: enum
        source: input
        description: Degree program level
        constraints: "MASTERS | DOCTORAL"
      - name: is_international
        type: boolean
        source: input
        description: True when the student holds a non-immigrant visa subject to hour restrictions
      - name: visa_type
        type: enum
        source: input
        description: Visa classification
        default: NONE
        constraints: "F1 | J1 | NONE"
      - name: enrolled_credit_hours
        type: integer
        source: input
        description: Credit hours currently enrolled; read at appointment submit time
        default: 0
        constraints: "0-24"
      - name: cumulative_gpa
        type: number
        source: input
        description: Cumulative graduate GPA, 2 decimal places
        constraints: "0.00-4.00"
      - name: external_weekly_hours
        type: number
        source: input
        description: Weekly hours of non-assistantship university employment, 1 decimal place
        default: 0
        constraints: "0.0-40.0"
      - name: sap_status
        type: enum
        source: system
        description: Satisfactory academic progress standing
        default: SATISFACTORY
        constraints: "SATISFACTORY | PROBATION | UNSATISFACTORY"
      - name: effort_cap_pct
        type: integer
        source: system
        description: Maximum aggregate appointment effort percentage for this student
        default: 75
        constraints: "1-100; raised only by POST /students/{id}/effort-cap-override"
      - name: cap_override_by_user_id
        type: string
        source: system
        description: X-User-ID of the GradSchoolAdmin who last raised effort_cap_pct; null when never raised
        default: null
      - name: cap_override_justification
        type: string
        source: system
        description: Justification text recorded with the last effort-cap override
        default: null
      - name: total_effort_pct
        type: integer
        source: computed
        description: Aggregate effort percentage over the student's counted appointments (calc student_effort_aggregate)
        default: 0
      - name: assigned_hours_per_week
        type: number
        source: computed
        description: total_effort_pct expressed in weekly hours at 40 hours per 100 percent
        default: 0
      - name: tuition_benefit_ytd_cents
        type: integer
        source: computed
        description: Sum of benefit_cents over the student's FINAL TaxAssessment rows in the current tax_calendar_year
        default: 0
      - name: taxable_tuition_benefit_ytd_cents
        type: integer
        source: computed
        description: Sum of taxable_cents over the student's FINAL TaxAssessment rows in the current tax_calendar_year
        default: 0

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; department that administers this source"
      - name: source_code
        type: string
        source: input
        description: Account code, e.g. NSF-2231144
        constraints: "unique across all FundingSource rows"
      - name: source_type
        type: enum
        source: input
        description: Funding instrument class
        constraints: "GRANT | DEPARTMENTAL_BUDGET | FELLOWSHIP"
      - name: sponsor_code
        type: string
        source: input
        description: External sponsor identifier; null for internal budgets
        default: null
      - name: authorized_amount_cents
        type: integer
        source: input
        description: Total authorized budget for the period, in cents
        constraints: ">= 1"
      - name: budget_period_start
        type: string
        source: input
        description: First date the source may fund (inclusive)
        constraints: "ISO 8601 calendar date"
      - name: budget_period_end
        type: string
        source: input
        description: Last date the source may fund (inclusive)
        constraints: "ISO 8601 calendar date; must be >= budget_period_start"
      - name: allows_tuition_remission
        type: boolean
        source: input
        description: Whether tuition remission may be charged to this source
      - name: grant_effort_cap_pct
        type: integer
        source: input
        description: Maximum effort percentage a single appointment may draw from this source
        default: 100
        constraints: "1-100; enforced only when source_type == GRANT"
      - name: auto_reinstate_threshold_cents
        type: integer
        source: input
        description: available_amount_cents level at/above which an OVERCOMMITMENT suspension auto-clears
        default: 0
        constraints: ">= 0"
      - name: committed_amount_cents
        type: integer
        source: computed
        description: Encumbered but not yet disbursed funds (calc funding_source_balance)
        default: 0
      - name: expended_amount_cents
        type: integer
        source: computed
        description: Disbursed and closed-out funds (calc funding_source_balance)
        default: 0
      - name: available_amount_cents
        type: integer
        source: computed
        description: authorized_amount_cents - committed_amount_cents - expended_amount_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: Whether the source may accept new commitments
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | CLOSED"
      - name: suspension_reason
        type: enum
        source: system
        description: Why the source is SUSPENDED; null when ACTIVE or CLOSED
        default: null
        constraints: "SPONSOR_HOLD | OVERCOMMITMENT | AUDIT | null"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> GraduateStudent.id; the appointee"
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; appointing department"
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; term the appointment is paid in"
      - name: renewed_from_appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; predecessor appointment this one renews; null for a first appointment"
        default: null
      - name: assistantship_type
        type: enum
        source: input
        description: Appointment classification
        constraints: "TEACHING | RESEARCH | ADMINISTRATIVE"
      - name: effort_pct
        type: integer
        source: input
        description: Appointment percentage effort
        constraints: "1-100"
      - name: start_date
        type: string
        source: input
        description: First date of the appointment (inclusive)
        constraints: "ISO 8601 calendar date"
      - name: end_date
        type: string
        source: input
        description: Last date of the appointment (inclusive)
        constraints: "ISO 8601 calendar date; must be >= start_date"
      - name: monthly_stipend_cents
        type: integer
        source: input
        description: Contracted monthly stipend at the stated effort_pct, in cents
        constraints: ">= 1"
      - name: supervisor_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the supervising FacultySupervisor
      - name: weekly_hours
        type: number
        source: computed
        description: effort_pct/100 * 40, rounded to 1 decimal (calc appointment_effort_profile)
        default: 0
      - name: duration_days
        type: integer
        source: computed
        description: Inclusive day count (end_date - start_date + 1)
        default: 0
      - name: tuition_remission_pct
        type: integer
        source: computed
        description: Remission band percentage selected from effort_pct (calc tuition_remission_entitlement)
        default: 0
      - name: insurance_eligible
        type: boolean
        source: computed
        description: Health-insurance eligibility (calc appointment_effort_profile)
        default: false
      - name: projected_pay_period_count
        type: integer
        source: computed
        description: Count of the term's PayPeriod rows intersecting the appointment window; set at submit
        default: 0
      - name: total_stipend_cents
        type: integer
        source: computed
        description: Sum of per-pay-period prorated gross amounts (calc stipend_pay_schedule); set at submit
        default: 0
      - name: tuition_remission_cents
        type: integer
        source: computed
        description: Funded tuition remission for the term (calc tuition_remission_entitlement); set at submit
        default: 0
      - name: insurance_subsidy_cents
        type: integer
        source: computed
        description: Employer share of the term insurance premium (calc insurance_subsidy_and_net_stipend)
        default: 0
      - name: employee_premium_cents
        type: integer
        source: computed
        description: Student share of the term insurance premium (calc insurance_subsidy_and_net_stipend)
        default: 0
      - name: net_term_stipend_cents
        type: integer
        source: computed
        description: total_stipend_cents - employee_premium_cents (calc insurance_subsidy_and_net_stipend)
        default: 0
      - name: lifecycle_status
        type: enum
        source: system
        description: Approval-axis state of the appointment
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED | FUNDING_VERIFIED | APPROVED | ACTIVE | NON_RENEWAL_PENDING | COMPLETED | TERMINATED | CANCELLED"
      - name: payroll_status
        type: enum
        source: system
        description: Disbursement-axis state of the appointment; advances independently of lifecycle_status
        default: NOT_SCHEDULED
        constraints: "NOT_SCHEDULED | SCHEDULED | PARTIALLY_DISBURSED | FULLY_DISBURSED | PAY_SUSPENDED | PAY_VOIDED"
      - name: renewal_eligible
        type: boolean
        source: system
        description: False once a NON_RENEW notice has been issued against this appointment
        default: true
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that last submitted the appointment; null while DRAFT
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID that approved the appointment; null before approval
        default: null
      - name: return_reason
        type: string
        source: system
        description: Reason recorded when the appointment was returned for revision
        default: null
      - name: pay_suspension_reason
        type: string
        source: system
        description: Reason recorded when payroll_status became PAY_SUSPENDED
        default: null
      - name: termination_reason
        type: string
        source: system
        description: Reason recorded at termination
        default: null
      - name: termination_date
        type: string
        source: system
        description: Logical-clock calendar date on which the appointment was terminated
        default: null

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; appointment funded by this allocation"
      - name: funding_source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; source charged by this allocation"
      - name: share_pct
        type: number
        source: input
        description: Percentage of the appointment's cost charged to this source
        constraints: "0.01-100.00 with at most 2 decimal places"
      - name: is_cost_share
        type: boolean
        source: input
        description: True when this allocation is the institution's cost-share contribution
        default: false
      - name: plan_sequence
        type: integer
        source: system
        description: 1-based index of this allocation inside the funding plan array that created it; the pinned tie-break key
        constraints: ">= 1"
      - name: allocated_stipend_cents
        type: integer
        source: computed
        description: Stipend cents charged to this source (calc cost_share_allocation_split)
        default: 0
      - name: allocated_remission_cents
        type: integer
        source: computed
        description: Tuition-remission cents charged to this source (calc tuition_remission_entitlement)
        default: 0
      - name: disbursed_amount_cents
        type: integer
        source: computed
        description: Sum of this allocation's split amounts across PAID StipendDisbursement rows
        default: 0
      - name: status
        type: enum
        source: system
        description: Encumbrance state of the allocation
        default: PROPOSED
        constraints: "PROPOSED | COMMITTED | RELEASED | EXPENDED"
      - name: release_reason
        type: string
        source: system
        description: Reason recorded when the allocation moved to RELEASED
        default: null

  - name: StipendDisbursement
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; appointment being paid"
      - name: pay_period_id
        type: string
        source: input
        description: "FK -> PayPeriod.id; period being paid"
      - name: proration_method_applied
        type: enum
        source: system
        description: Snapshot of the term's proration_method at scheduling time
        constraints: "CALENDAR_DAY | WORKDAY"
      - name: covered_units
        type: integer
        source: computed
        description: Calendar days or workdays of the period covered by the appointment window
        default: 0
      - name: period_units
        type: integer
        source: computed
        description: Calendar days or workdays in the whole period
        default: 0
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Prorated gross stipend for this period (calc stipend_pay_schedule)
        default: 0
      - name: allocation_split
        type: array
        source: computed
        description: >-
          Per-source breakdown of gross_amount_cents; each element is
          { funding_allocation_id, plan_sequence, amount_cents } where funding_allocation_id holds the id of a
          FundingAllocation row whose appointment_id equals this row's appointment_id
        default: []
      - name: status
        type: enum
        source: system
        description: Disbursement state
        default: SCHEDULED
        constraints: "SCHEDULED | PAID | VOIDED | REVERSED"
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant of payment; null until PAID
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant of voiding; null unless VOIDED
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: Logical-clock instant of reversal; null unless REVERSED
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: Reason recorded at reversal
        default: null

  - name: RenewalDecision
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the expiring appointment under renewal review"
      - name: renewal_window_open_date
        type: string
        source: computed
        description: appointment.end_date minus RENEWAL_WINDOW_DAYS (calc renewal_notice_deadline)
      - name: notice_deadline_date
        type: string
        source: computed
        description: appointment.end_date minus department.non_renewal_notice_days (calc renewal_notice_deadline)
      - name: decision
        type: enum
        source: system
        description: Renewal outcome; PENDING until the notice is issued
        default: PENDING
        constraints: "PENDING | RENEW | NON_RENEW"
      - name: sap_certified
        type: boolean
        source: system
        description: Whether satisfactory academic progress has been certified for this review
        default: false
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that certified progress; cleared when the certification is revoked
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; null when not certified
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID that issued the notice; null before issuance
        default: null
      - name: notice_sent_date
        type: string
        source: system
        description: Logical-clock calendar date on which the notice was issued
        default: null
      - name: acknowledged_at
        type: datetime
        source: system
        description: Logical-clock instant the student acknowledged the notice
        default: null
      - name: revision_count
        type: integer
        source: system
        description: Number of times this decision has been forced back to DRAFT by a progress downgrade
        default: 0
      - name: status
        type: enum
        source: system
        description: Renewal review state
        default: DRAFT
        constraints: "DRAFT | SAP_CERTIFIED | NOTICE_ISSUED | ACKNOWLEDGED"

  - name: TaxAssessment
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> GraduateStudent.id; the taxpayer"
      - name: term_id
        type: string
        source: input
        description: "FK -> AcademicTerm.id; term whose tuition benefit is assessed"
      - name: tax_calendar_year
        type: integer
        source: computed
        description: Copied from the term's tax_calendar_year at creation
      - name: variant_applied
        type: enum
        source: system
        description: Which calculation variant produced the current numbers
        default: TERM_PROVISIONAL
        constraints: "TERM_PROVISIONAL | CALENDAR_YEAR_FINAL"
      - name: benefit_cents
        type: integer
        source: computed
        description: Tuition remission attributable to this student and term (calc tuition_benefit_tax_assessment)
        default: 0
      - name: exempt_cents
        type: integer
        source: computed
        description: Portion of benefit_cents shielded by the exemption cap
        default: 0
      - name: taxable_cents
        type: integer
        source: computed
        description: benefit_cents - exempt_cents
        default: 0
      - name: imputed_withholding_cents
        type: integer
        source: computed
        description: taxable_cents * IMPUTED_WITHHOLDING_RATE, rounded half-up
        default: 0
      - name: status
        type: enum
        source: system
        description: Assessment state
        default: PROVISIONAL
        constraints: "PROVISIONAL | SUPERSEDED | FINAL | AMENDED"
      - name: amendment_reason
        type: string
        source: system
        description: Reason recorded when the assessment moved to AMENDED
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: AcademicTerm
    state_field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /academic-terms/{id}/open"
        actor: GradSchoolAdmin
        preconditions:
          - "term.status == PLANNING"
          - "count(PayPeriod where term_id == term.id) >= 1 else ERR_TERM_CALENDAR_INCOMPLETE"
          - "count(StipendPolicy where term_id == term.id) >= 1 else ERR_TERM_CALENDAR_INCOMPLETE"
        side_effects:
          - "term.status = OPEN"
          - "term.pay_period_count recomputed"
      - from: OPEN
        to: PAYROLL_LOCKED
        trigger: "POST /academic-terms/{id}/lock-payroll"
        actor: GradSchoolAdmin
        preconditions:
          - "term.status == OPEN"
          - "count(Appointment where term_id == term.id and lifecycle_status == FUNDING_VERIFIED) == 0 else ERR_UNRESOLVED_APPOINTMENTS"
        side_effects:
          - "term.status = PAYROLL_LOCKED; term.locked_at = current logical clock"
          - "every PayPeriod with term_id == term.id and status == OPEN -> LOCKED"
        note: "Appointments still in SUBMITTED are permitted to remain; they simply cannot be verified while locked."
      - from: PAYROLL_LOCKED
        to: CLOSED
        trigger: "POST /academic-terms/{id}/close"
        actor: GradSchoolAdmin
        preconditions:
          - "term.status == PAYROLL_LOCKED"
          - "every StipendDisbursement whose pay_period_id belongs to this term has status IN {PAID, VOIDED, REVERSED} else ERR_UNSETTLED_DISBURSEMENTS"
          - "every TaxAssessment with term_id == term.id has status IN {FINAL, SUPERSEDED} else ERR_UNSETTLED_DISBURSEMENTS"
        side_effects:
          - "term.status = CLOSED; term.closed_at = current logical clock"
          - "every PayPeriod with term_id == term.id and status == LOCKED -> CLOSED"
          - "conditional cascade: every Appointment with term_id == term.id and lifecycle_status IN {ACTIVE, NON_RENEWAL_PENDING} and end_date <= term.term_end -> COMPLETED"
          - "caused by each Appointment entering COMPLETED: its FundingAllocation rows with status == COMMITTED -> EXPENDED, and each such allocation's disbursed_amount_cents is raised to allocated_stipend_cents + allocated_remission_cents"
          - "caused by each allocation entering EXPENDED: its FundingSource.committed_amount_cents / expended_amount_cents / available_amount_cents recomputed by calc funding_source_balance"

  - entity: Appointment
    state_field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /appointments/{id}/submit"
        actor: DepartmentAdmin
        preconditions:
          - "appointment.lifecycle_status IN {DRAFT, RETURNED}"
          - "term.status == OPEN else ERR_TERM_NOT_OPEN"
          - "assigned_hours_per_week (including this appointment) + student.external_weekly_hours <= INTERNATIONAL_MAX_WEEKLY_HOURS when student.is_international and term.session_type == IN_SESSION else ERR_INTERNATIONAL_HOUR_LIMIT_EXCEEDED"
          - "student.total_effort_pct (including this appointment) <= student.effort_cap_pct else ERR_OVER_APPOINTMENT"
          - "no dual-role conflict per validation priority 18 else ERR_DUAL_ROLE_CONFLICT"
          - "count(FundingAllocation where appointment_id == appointment.id and status == PROPOSED) >= 1 else ERR_FUNDING_ALLOCATION_MISSING"
          - "sum(share_pct over those PROPOSED allocations) == 100.00 else ERR_ALLOCATION_SHARES_INVALID"
          - "cost-share composition valid per validation priority 29 else ERR_COST_SHARE_SOURCE_INVALID"
          - "no PROPOSED allocation references a FELLOWSHIP source when assistantship_type == TEACHING else ERR_FELLOWSHIP_SERVICE_CONFLICT"
          - "every PROPOSED allocation's FundingSource budget window covers [start_date, end_date] else ERR_FUNDING_PERIOD_MISMATCH"
          - "round_half_up(monthly_stipend_cents * 100 / effort_pct) >= policy.min_fte_monthly_stipend_cents else ERR_STIPEND_BELOW_MINIMUM"
          - "for every PROPOSED allocation whose source_type == GRANT: effort_pct * share_pct / 100 <= source.grant_effort_cap_pct else ERR_GRANT_EFFORT_CAP_EXCEEDED"
        side_effects:
          - "appointment.lifecycle_status = SUBMITTED; submitted_by_user_id = X-User-ID; return_reason = null"
          - "calc stipend_pay_schedule (projection only): projected_pay_period_count and total_stipend_cents set"
          - "calc tuition_remission_entitlement: tuition_remission_cents set; each PROPOSED allocation's allocated_remission_cents set"
          - "calc cost_share_allocation_split: each PROPOSED allocation's allocated_stipend_cents set"
          - "calc insurance_subsidy_and_net_stipend: insurance_subsidy_cents, employee_premium_cents, net_term_stipend_cents set"
          - "caused by the effort change: student.total_effort_pct and student.assigned_hours_per_week recomputed; GraduateStudent.version incremented"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /appointments/{id}/return"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.lifecycle_status IN {SUBMITTED, FUNDING_VERIFIED}"
          - "term.status == OPEN else ERR_TERM_NOT_OPEN"
        side_effects:
          - "appointment.lifecycle_status = RETURNED; return_reason = request body return_reason"
          - "every FundingAllocation of this appointment with status == COMMITTED -> RELEASED with release_reason = 'APPOINTMENT_RETURNED', allocated_stipend_cents = 0, allocated_remission_cents = 0"
          - "caused by each allocation entering RELEASED: its FundingSource balances recomputed by calc funding_source_balance"
          - "caused by the effort change: student.total_effort_pct recomputed; GraduateStudent.version incremented"
        note: "RETURNED re-enters SUBMITTED through the same submit endpoint, so the review loop is a cycle."
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /appointments/{id}/submit"
        actor: DepartmentAdmin
        preconditions:
          - "same battery as DRAFT -> SUBMITTED"
        side_effects:
          - "same side effects as DRAFT -> SUBMITTED"
      - from: SUBMITTED
        to: FUNDING_VERIFIED
        trigger: "POST /appointments/{id}/verify-funding"
        actor: GrantAccountant
        preconditions:
          - "appointment.lifecycle_status == SUBMITTED"
          - "term.status == OPEN else ERR_TERM_NOT_OPEN"
          - "every FundingAllocation of this appointment has funding_source.status == ACTIVE else ERR_FUNDING_SOURCE_NOT_ACTIVE"
          - "for every referenced FundingSource: authorized_amount_cents - committed_amount_cents - expended_amount_cents - (sum of this appointment's allocations charged to that source) >= 0 else ERR_FUNDING_INSUFFICIENT"
        side_effects:
          - "appointment.lifecycle_status = FUNDING_VERIFIED"
          - "every FundingAllocation of this appointment with status == PROPOSED -> COMMITTED"
          - "caused by each allocation entering COMMITTED: its FundingSource.committed_amount_cents and available_amount_cents recomputed by calc funding_source_balance"
      - from: FUNDING_VERIFIED
        to: APPROVED
        trigger: "POST /appointments/{id}/approve"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.lifecycle_status == FUNDING_VERIFIED"
          - "term.status == OPEN else ERR_TERM_NOT_OPEN"
          - "student.sap_status == SATISFACTORY else ERR_SAP_NOT_SATISFACTORY"
          - "X-User-ID != student.cap_override_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "appointment.lifecycle_status = APPROVED; approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /appointments/{id}/activate"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.lifecycle_status == APPROVED"
          - "term.status == OPEN else ERR_TERM_NOT_OPEN"
        side_effects:
          - "appointment.lifecycle_status = ACTIVE"
      - from: ACTIVE
        to: NON_RENEWAL_PENDING
        trigger: "system: RenewalDecision SAP_CERTIFIED -> NOTICE_ISSUED with decision == NON_RENEW"
        actor: system
        preconditions:
          - "appointment.lifecycle_status == ACTIVE"
        side_effects:
          - "appointment.lifecycle_status = NON_RENEWAL_PENDING; renewal_eligible = false"
          - "caused by this appointment entering NON_RENEWAL_PENDING: every Appointment with renewed_from_appointment_id == this appointment.id and lifecycle_status IN {DRAFT, SUBMITTED, RETURNED, FUNDING_VERIFIED} -> CANCELLED"
          - "caused by each successor entering CANCELLED: its FundingAllocation rows with status IN {PROPOSED, COMMITTED} -> RELEASED with release_reason = 'PREDECESSOR_NON_RENEWED', allocated_stipend_cents = 0, allocated_remission_cents = 0"
          - "caused by each allocation entering RELEASED: its FundingSource.committed_amount_cents and available_amount_cents recomputed by calc funding_source_balance"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system: predecessor appointment entered NON_RENEWAL_PENDING"
        actor: system
        preconditions:
          - "appointment.renewed_from_appointment_id is not null"
          - "appointment.lifecycle_status IN {DRAFT, SUBMITTED, RETURNED, FUNDING_VERIFIED}"
        side_effects:
          - "appointment.lifecycle_status = CANCELLED"
          - "caused by CANCELLED: allocations released as described above"
          - "caused by the effort change: student.total_effort_pct recomputed; GraduateStudent.version incremented"
      - from: FUNDING_VERIFIED
        to: CANCELLED
        trigger: "system: predecessor appointment entered NON_RENEWAL_PENDING"
        actor: system
        preconditions:
          - "same as SUBMITTED -> CANCELLED"
        side_effects:
          - "same as SUBMITTED -> CANCELLED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /appointments/{id}/terminate"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.lifecycle_status IN {APPROVED, ACTIVE, NON_RENEWAL_PENDING}"
          - "term.status IN {OPEN, PAYROLL_LOCKED} else ERR_INVALID_TERM_STATE"
        side_effects:
          - "s1: appointment.lifecycle_status = TERMINATED; termination_reason set; termination_date = current logical-clock date; payroll_status = PAY_VOIDED"
          - "s2 (caused by s1): every StipendDisbursement of this appointment with status == SCHEDULED -> VOIDED with voided_at = current logical clock"
          - "s3 (caused by s2): every FundingAllocation of this appointment has allocated_stipend_cents recomputed as the sum of its split amounts across this appointment's StipendDisbursement rows with status == PAID (0 when none)"
          - "s4 (caused by s1): tuition_remission_cents = 0 when termination_date < term.remission_drop_deadline, otherwise unchanged; each allocation's allocated_remission_cents re-split by calc tuition_remission_entitlement"
          - "s5 (caused by s3 and s4): every FundingAllocation with status == COMMITTED and allocated_stipend_cents + allocated_remission_cents == 0 -> RELEASED with release_reason = 'APPOINTMENT_TERMINATED'"
          - "s6 (caused by s5): each affected FundingSource's committed_amount_cents / available_amount_cents recomputed by calc funding_source_balance"
          - "s7 (caused by s6): every FundingSource with status == SUSPENDED and suspension_reason == OVERCOMMITMENT and available_amount_cents >= auto_reinstate_threshold_cents -> ACTIVE with suspension_reason = null"
          - "s8 (caused by s1): student.total_effort_pct and student.assigned_hours_per_week recomputed; GraduateStudent.version incremented"
          - "s9 (caused by s4): student.tuition_benefit_ytd_cents recomputed"
      - from: NON_RENEWAL_PENDING
        to: COMPLETED
        trigger: "system: AcademicTerm PAYROLL_LOCKED -> CLOSED"
        actor: system
        preconditions:
          - "appointment.end_date <= term.term_end"
        side_effects:
          - "appointment.lifecycle_status = COMPLETED"
          - "allocations moved COMMITTED -> EXPENDED as described in the AcademicTerm close transition"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system: AcademicTerm PAYROLL_LOCKED -> CLOSED"
        actor: system
        preconditions:
          - "appointment.end_date <= term.term_end"
        side_effects:
          - "appointment.lifecycle_status = COMPLETED"
          - "allocations moved COMMITTED -> EXPENDED as described in the AcademicTerm close transition"

  - entity: Appointment
    state_field: payroll_status
    initial_state: NOT_SCHEDULED
    terminal_states: [FULLY_DISBURSED, PAY_VOIDED]
    transitions:
      - from: NOT_SCHEDULED
        to: SCHEDULED
        trigger: "POST /appointments/{id}/schedule-payroll"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.payroll_status == NOT_SCHEDULED"
          - "appointment.lifecycle_status == ACTIVE else ERR_INVALID_APPOINTMENT_STATE"
          - "term.status == OPEN else ERR_TERM_NOT_OPEN"
        side_effects:
          - "one StipendDisbursement row created per PayPeriod of the term intersecting [start_date, end_date], with proration_method_applied = term.proration_method, covered_units, period_units, gross_amount_cents from calc stipend_pay_schedule and allocation_split from calc cost_share_allocation_split"
          - "appointment.payroll_status = SCHEDULED"
        note: "sum(gross_amount_cents over created rows) == appointment.total_stipend_cents projected at submit."
      - from: SCHEDULED
        to: PARTIALLY_DISBURSED
        trigger: "POST /stipend-disbursements/{id}/pay (some SCHEDULED rows remain)"
        actor: GradSchoolAdmin
        preconditions:
          - "at least one StipendDisbursement of this appointment remains SCHEDULED after the payment"
        side_effects:
          - "appointment.payroll_status = PARTIALLY_DISBURSED"
      - from: PARTIALLY_DISBURSED
        to: FULLY_DISBURSED
        trigger: "POST /stipend-disbursements/{id}/pay (last SCHEDULED row)"
        actor: GradSchoolAdmin
        preconditions:
          - "no StipendDisbursement of this appointment remains SCHEDULED after the payment"
        side_effects:
          - "appointment.payroll_status = FULLY_DISBURSED"
      - from: SCHEDULED
        to: PAY_SUSPENDED
        trigger: "POST /appointments/{id}/suspend-pay"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.payroll_status IN {SCHEDULED, PARTIALLY_DISBURSED}"
          - "appointment.lifecycle_status IN {ACTIVE, NON_RENEWAL_PENDING} else ERR_INVALID_APPOINTMENT_STATE"
        side_effects:
          - "appointment.payroll_status = PAY_SUSPENDED; pay_suspension_reason set"
          - "lifecycle_status is NOT modified"
      - from: PARTIALLY_DISBURSED
        to: PAY_SUSPENDED
        trigger: "POST /appointments/{id}/suspend-pay"
        actor: GradSchoolAdmin
        preconditions:
          - "same as SCHEDULED -> PAY_SUSPENDED"
        side_effects:
          - "same as SCHEDULED -> PAY_SUSPENDED"
      - from: PAY_SUSPENDED
        to: SCHEDULED
        trigger: "POST /appointments/{id}/resume-pay"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.payroll_status == PAY_SUSPENDED"
          - "count(StipendDisbursement of this appointment with status == PAID) == 0"
        side_effects:
          - "appointment.payroll_status = SCHEDULED; pay_suspension_reason = null"
      - from: PAY_SUSPENDED
        to: PARTIALLY_DISBURSED
        trigger: "POST /appointments/{id}/resume-pay"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.payroll_status == PAY_SUSPENDED"
          - "count(StipendDisbursement of this appointment with status == PAID) >= 1"
        side_effects:
          - "appointment.payroll_status = PARTIALLY_DISBURSED; pay_suspension_reason = null"
      - from: SCHEDULED
        to: PAY_VOIDED
        trigger: "POST /appointments/{id}/terminate"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.payroll_status != PAY_VOIDED"
        side_effects:
          - "appointment.payroll_status = PAY_VOIDED (see the lifecycle TERMINATED cascade)"
      - from: PARTIALLY_DISBURSED
        to: PAY_VOIDED
        trigger: "POST /appointments/{id}/terminate"
        actor: GradSchoolAdmin
        preconditions:
          - "appointment.payroll_status != PAY_VOIDED"
        side_effects:
          - "appointment.payroll_status = PAY_VOIDED (see the lifecycle TERMINATED cascade)"

  - entity: FundingSource
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /funding-sources/{id}/suspend"
        actor: GrantAccountant
        preconditions:
          - "source.status == ACTIVE"
        side_effects:
          - "source.status = SUSPENDED; suspension_reason = request body reason"
        note: "Existing COMMITTED allocations are untouched; only new commitments are blocked."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /funding-sources/{id}/reinstate"
        actor: GrantAccountant
        preconditions:
          - "source.status == SUSPENDED"
        side_effects:
          - "source.status = ACTIVE; suspension_reason = null"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: available_amount_cents rose to >= auto_reinstate_threshold_cents after an allocation release"
        actor: system
        preconditions:
          - "source.status == SUSPENDED"
          - "source.suspension_reason == OVERCOMMITMENT"
          - "source.available_amount_cents >= source.auto_reinstate_threshold_cents"
        side_effects:
          - "source.status = ACTIVE; suspension_reason = null"
        note: "Only OVERCOMMITMENT suspensions auto-clear; SPONSOR_HOLD and AUDIT require the explicit reinstate call."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /funding-sources/{id}/close"
        actor: GrantAccountant
        preconditions:
          - "source.status IN {ACTIVE, SUSPENDED}"
          - "source.committed_amount_cents == 0 else ERR_FUNDING_SOURCE_HAS_COMMITMENTS"
        side_effects:
          - "source.status = CLOSED; suspension_reason = null"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /funding-sources/{id}/close"
        actor: GrantAccountant
        preconditions:
          - "same as ACTIVE -> CLOSED"
        side_effects:
          - "same as ACTIVE -> CLOSED"

  - entity: FundingAllocation
    state_field: status
    initial_state: PROPOSED
    terminal_states: [RELEASED, EXPENDED]
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /appointments/{id}/verify-funding"
        actor: GrantAccountant
        preconditions:
          - "allocation.status == PROPOSED"
          - "allocation.funding_source.status == ACTIVE else ERR_FUNDING_SOURCE_NOT_ACTIVE"
        side_effects:
          - "allocation.status = COMMITTED"
          - "caused by COMMITTED: FundingSource balances recomputed by calc funding_source_balance"
      - from: PROPOSED
        to: RELEASED
        trigger: "PUT /appointments/{id}/funding-plan (supersede) or system predecessor non-renewal cascade"
        actor: DepartmentAdmin
        preconditions:
          - "allocation.status == PROPOSED"
        side_effects:
          - "allocation.status = RELEASED; allocated_stipend_cents = 0; allocated_remission_cents = 0; release_reason set"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /funding-allocations/{id}/release"
        actor: GrantAccountant
        preconditions:
          - "allocation.status == COMMITTED"
          - "allocation.disbursed_amount_cents == 0 else ERR_ALLOCATION_PARTIALLY_DISBURSED"
          - "appointment.lifecycle_status NOT IN {APPROVED, ACTIVE} else ERR_ALLOCATION_LOCKED_BY_APPROVAL"
        side_effects:
          - "allocation.status = RELEASED; allocated_stipend_cents = 0; allocated_remission_cents = 0; release_reason set"
          - "caused by RELEASED: FundingSource.committed_amount_cents and available_amount_cents recomputed by calc funding_source_balance"
          - "caused by the source balance change: a SUSPENDED / OVERCOMMITMENT source whose available_amount_cents >= auto_reinstate_threshold_cents -> ACTIVE"
          - "caused by RELEASED: when appointment.lifecycle_status == FUNDING_VERIFIED it reverts to RETURNED with return_reason = 'FUNDING_RELEASED'"
      - from: COMMITTED
        to: EXPENDED
        trigger: "system: AcademicTerm close moved the appointment to COMPLETED"
        actor: system
        preconditions:
          - "allocation.status == COMMITTED"
          - "appointment.lifecycle_status == COMPLETED"
        side_effects:
          - "allocation.status = EXPENDED; disbursed_amount_cents = allocated_stipend_cents + allocated_remission_cents"
          - "caused by EXPENDED: FundingSource.committed_amount_cents decreases and expended_amount_cents increases by the same amount"
        note: "The COMMITTED fork is branching: RELEASED returns money to available, EXPENDED moves it to expended. available_amount_cents rises only on the RELEASED branch."

  - entity: StipendDisbursement
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [VOIDED, REVERSED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /stipend-disbursements/{id}/pay"
        actor: GradSchoolAdmin
        preconditions:
          - "disbursement.status == SCHEDULED"
          - "pay_period.status == LOCKED else ERR_PAY_PERIOD_NOT_LOCKED"
          - "appointment.payroll_status IN {SCHEDULED, PARTIALLY_DISBURSED} else ERR_INVALID_APPOINTMENT_STATE"
        side_effects:
          - "disbursement.status = PAID; paid_at = current logical clock"
          - "caused by PAID: for each allocation_split element, FundingAllocation.disbursed_amount_cents += amount_cents"
          - "caused by the allocation change: FundingSource.committed_amount_cents decreases and expended_amount_cents increases by that amount"
          - "caused by PAID: appointment.payroll_status = PARTIALLY_DISBURSED when a SCHEDULED sibling remains, otherwise FULLY_DISBURSED"
      - from: PAID
        to: REVERSED
        trigger: "POST /stipend-disbursements/{id}/reverse"
        actor: GradSchoolAdmin
        preconditions:
          - "disbursement.status == PAID"
          - "term.status != CLOSED else ERR_INVALID_TERM_STATE"
        side_effects:
          - "disbursement.status = REVERSED; reversed_at = current logical clock; reversal_reason set"
          - "caused by REVERSED: for each allocation_split element, FundingAllocation.disbursed_amount_cents -= amount_cents"
          - "caused by the allocation change: FundingSource.expended_amount_cents decreases and committed_amount_cents increases by that amount, leaving authorized_amount_cents == available + committed + expended unchanged"
          - "caused by REVERSED: appointment.payroll_status recomputed - PARTIALLY_DISBURSED when a PAID sibling remains, SCHEDULED when none does"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system: appointment terminated"
        actor: system
        preconditions:
          - "disbursement.status == SCHEDULED"
        side_effects:
          - "disbursement.status = VOIDED; voided_at = current logical clock; gross_amount_cents retained for audit"

  - entity: RenewalDecision
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SAP_CERTIFIED
        trigger: "POST /renewal-decisions/{id}/certify-progress"
        actor: FacultySupervisor
        preconditions:
          - "decision.status == DRAFT"
          - "student.sap_status == SATISFACTORY else ERR_SAP_NOT_SATISFACTORY"
          - "student.cumulative_gpa >= MIN_RENEWAL_GPA else ERR_SAP_NOT_SATISFACTORY"
        side_effects:
          - "decision.status = SAP_CERTIFIED; sap_certified = true; certified_by_user_id = X-User-ID; certified_at = current logical clock"
      - from: SAP_CERTIFIED
        to: DRAFT
        trigger: "system: PATCH /students/{id}/academic-progress set sap_status != SATISFACTORY"
        actor: system
        preconditions:
          - "decision.status == SAP_CERTIFIED"
          - "the patched student is the appointment's student_id"
        side_effects:
          - "decision.status = DRAFT; sap_certified = false; certified_by_user_id = null; certified_at = null; revision_count += 1"
        note: "This is the revision cycle: DRAFT -> SAP_CERTIFIED -> DRAFT -> SAP_CERTIFIED, with revision_count counting the loops."
      - from: SAP_CERTIFIED
        to: NOTICE_ISSUED
        trigger: "POST /renewal-decisions/{id}/issue-notice"
        actor: DepartmentAdmin
        preconditions:
          - "decision.status == SAP_CERTIFIED"
          - "X-User-ID != decision.certified_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "current logical-clock date <= decision.notice_deadline_date when request decision == NON_RENEW else ERR_NOTICE_DEADLINE_PASSED"
          - "appointment.lifecycle_status == ACTIVE else ERR_INVALID_APPOINTMENT_STATE"
        side_effects:
          - "decision.status = NOTICE_ISSUED; decision.decision = request body decision; issued_by_user_id = X-User-ID; notice_sent_date = current logical-clock date"
          - "when decision == NON_RENEW: the target appointment enters NON_RENEWAL_PENDING and the successor-cancellation cascade fires (see the Appointment lifecycle transition)"
          - "when decision == RENEW: appointment.renewal_eligible stays true and no appointment state changes"
      - from: NOTICE_ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /renewal-decisions/{id}/acknowledge"
        actor: StudentUser
        preconditions:
          - "decision.status == NOTICE_ISSUED"
          - "X-User-ID == appointment.student_id else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "decision.status = ACKNOWLEDGED; acknowledged_at = current logical clock"

  - entity: TaxAssessment
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /tax-assessments/{id}/finalize"
        actor: GradSchoolAdmin
        preconditions:
          - "assessment.status == PROVISIONAL"
          - "no Appointment of this student in this term has lifecycle_status IN {DRAFT, SUBMITTED, RETURNED, FUNDING_VERIFIED} else ERR_INVALID_APPOINTMENT_STATE"
        side_effects:
          - "calc tuition_benefit_tax_assessment variant CALENDAR_YEAR_FINAL recomputes benefit_cents, exempt_cents, taxable_cents, imputed_withholding_cents"
          - "assessment.status = FINAL; variant_applied = CALENDAR_YEAR_FINAL"
          - "caused by FINAL: student.tuition_benefit_ytd_cents and student.taxable_tuition_benefit_ytd_cents recomputed; GraduateStudent.version incremented"
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system: a new TaxAssessment was created for the same (student_id, term_id)"
        actor: system
        preconditions:
          - "assessment.status == PROVISIONAL"
        side_effects:
          - "assessment.status = SUPERSEDED"
      - from: FINAL
        to: AMENDED
        trigger: "POST /tax-assessments/{id}/amend"
        actor: GradSchoolAdmin
        preconditions:
          - "assessment.status == FINAL"
          - "recomputing calc tuition_benefit_tax_assessment variant CALENDAR_YEAR_FINAL yields benefit_cents different from the stored value else ERR_NO_ASSESSMENT_DELTA"
        side_effects:
          - "benefit_cents, exempt_cents, taxable_cents, imputed_withholding_cents recomputed; amendment_reason set"
          - "assessment.status = AMENDED"
          - "caused by AMENDED: student.tuition_benefit_ytd_cents and student.taxable_tuition_benefit_ytd_cents recomputed; GraduateStudent.version incremented"
      - from: AMENDED
        to: FINAL
        trigger: "POST /tax-assessments/{id}/finalize"
        actor: GradSchoolAdmin
        preconditions:
          - "assessment.status == AMENDED"
        side_effects:
          - "calc tuition_benefit_tax_assessment variant CALENDAR_YEAR_FINAL recomputed; assessment.status = FINAL"
          - "caused by FINAL: student.tuition_benefit_ytd_cents recomputed; GraduateStudent.version incremented"
        note: "FINAL -> AMENDED -> FINAL is the correction cycle; each pass re-derives the year-to-date exemption remainder."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================

concurrency_rules:
  - rule_id: funding-plan-replace-stale-appointment
    parent_entity: Appointment
    write_endpoint: "PUT /appointments/{id}/funding-plan"
    occ_field: "expected_appointment_version"
    description: |
      Replacing an appointment's funding plan when the appointment's version has advanced since the
      client last read it is rejected. A funding plan legitimately supersedes the previous allocation
      set, so a second replace based on a stale read would silently discard allocations the client
      never saw; the OCC check on Appointment.version turns that into a deterministic 412.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-student
    parent_entity: GraduateStudent
    write_endpoint: "POST /tax-assessments"
    occ_field: "expected_student_version"
    description: |
      Creating a TaxAssessment for a (student, term) pair whose GraduateStudent version has advanced
      since the client last read it is rejected. A new assessment legitimately supersedes the prior
      PROVISIONAL row for the same pair, and the student's remission-derived aggregates change whenever
      an appointment is submitted, terminated or finalized, so a stale view would assess the wrong
      benefit; the OCC check on GraduateStudent.version makes the rejection deterministic.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: appointment_effort_profile
    trigger: "POST /appointments (row creation)"
    algorithm: threshold
    formula: |
      weekly_hours = round_half_up(effort_pct / 100 * FULL_TIME_WEEKLY_HOURS, 1 decimal)
      duration_days = (end_date - start_date) in whole days + 1        # closed-closed, inclusive
      policy = the single StipendPolicy with (term_id, assistantship_type, degree_level) matching
               (appointment.term_id, appointment.assistantship_type, student.degree_level)
      insurance_eligible = (effort_pct >= policy.insurance_min_effort_pct)
                           AND (duration_days >= policy.min_insurance_duration_days)
      tuition_remission_pct = 0   if effort_pct < 25
                            = 50  if 25 <= effort_pct < 50
                            = 75  if 50 <= effort_pct < 75
                            = 100 if effort_pct >= 75
    input_set: "Only the appointment being created plus its matching StipendPolicy row and the referenced GraduateStudent.degree_level."
    constants:
      FULL_TIME_WEEKLY_HOURS: 40
    precision: "weekly_hours to 1 decimal place, round_half_up; all thresholds are inclusive lower bounds (>=)"

  - name: tuition_remission_entitlement
    trigger: "POST /appointments/{id}/submit; recomputed by the terminate cascade step s4"
    algorithm: tiered_pricing
    formula: |
      # Step order is pinned: band -> credit cap -> gross -> funding-eligible share -> policy ceiling.
      band_pct = appointment.tuition_remission_pct                      # from appointment_effort_profile
      remitted_credits = min(student.enrolled_credit_hours, MAX_REMITTED_CREDITS[student.degree_level])
      gross_remission_cents = round_half_up(remitted_credits * policy.per_credit_tuition_cents * band_pct / 100)
      remission_eligible_share_pct =
          sum(a.share_pct for a in FundingAllocation
              where a.appointment_id == appointment.id
                and a.status IN {PROPOSED, COMMITTED}
                and FundingSource(a.funding_source_id).allows_tuition_remission == true)
      funded_remission_cents = round_half_up(gross_remission_cents * remission_eligible_share_pct / 100)
      tuition_remission_cents = min(funded_remission_cents, policy.max_remission_cents_per_term)

      # Per-source split of tuition_remission_cents, over the eligible allocations only:
      # ordering key = (share_pct DESC, plan_sequence ASC)
      for each eligible allocation a in that order:
          a.allocated_remission_cents = truncate_to_cents(
              tuition_remission_cents * a.share_pct / remission_eligible_share_pct)
      remainder = tuition_remission_cents - sum(a.allocated_remission_cents over eligible allocations)
      the FIRST allocation in the ordering receives the whole remainder
      every non-eligible allocation gets allocated_remission_cents = 0
      # When remission_eligible_share_pct == 0 the whole result is 0 and no split runs.
    input_set: "FundingAllocation rows of this appointment with status IN {PROPOSED, COMMITTED}; RELEASED and EXPENDED rows are excluded."
    constants:
      MAX_REMITTED_CREDITS: { MASTERS: 9, DOCTORAL: 12 }
    precision: "gross and funded rounded half-up to whole cents in that order; per-source split truncated toward zero with the remainder assigned to the first allocation in (share_pct DESC, plan_sequence ASC) order"

  - name: cost_share_allocation_split
    trigger: "POST /appointments/{id}/submit; per-period split recomputed on POST /appointments/{id}/schedule-payroll"
    algorithm: waterfall_allocation
    formula: |
      # Rounding order is pinned: truncate per allocation FIRST, then hand the whole remainder to the
      # largest share. Rounding each line half-up and summing yields a different distribution and can
      # break the conservation identity; that alternative is explicitly NOT used.
      basis_cents = appointment.total_stipend_cents            # plan-level split at submit
                  | disbursement.gross_amount_cents            # per-period split at schedule-payroll
      order = allocations of the appointment with status IN {PROPOSED, COMMITTED},
              sorted by (share_pct DESC, plan_sequence ASC)
      for each allocation a in order:
          a_amount = truncate_to_cents(basis_cents * a.share_pct / 100)
      remainder = basis_cents - sum(a_amount over order)       # 0 <= remainder < count(order)
      the FIRST allocation in `order` receives the entire remainder
      invariant: sum of assigned amounts == basis_cents exactly
    input_set: "FundingAllocation rows of the appointment with status IN {PROPOSED, COMMITTED}, ordered by (share_pct DESC, plan_sequence ASC)."
    constants: {}
    precision: "truncate toward zero per allocation, then whole-remainder assignment; never round_half_up per line"

  - name: stipend_pay_schedule
    trigger: "POST /appointments/{id}/submit (projection into total_stipend_cents) and POST /appointments/{id}/schedule-payroll (row creation)"
    algorithm: interval_merge
    formula: |
      appointment_window = [start_date, end_date + 1 day)        # half-open form of the inclusive window
      for each PayPeriod p with p.term_id == appointment.term_id, ordered by p.sequence_no ASC:
          overlap_start = max(p.period_start, appointment.start_date)
          overlap_end   = min(p.period_end_exclusive, end_date + 1 day)
          if overlap_end <= overlap_start: skip this period entirely
          covered_units, period_units = per variant below
          gross_amount_cents = round_half_up(appointment.monthly_stipend_cents * covered_units / period_units)
      projected_pay_period_count = number of periods not skipped
      total_stipend_cents = sum of gross_amount_cents over the non-skipped periods
    input_set: "All PayPeriod rows of the appointment's term regardless of PayPeriod.status; periods with an empty intersection are skipped and produce no StipendDisbursement row."
    constants: {}
    precision: "each period's gross rounded half-up to whole cents independently, then summed (round-per-period-then-sum, never sum-then-round)"
    variants:
      - name: CALENDAR_DAY
        when: "term.proration_method == CALENDAR_DAY"
        difference: "covered_units = whole days in [overlap_start, overlap_end); period_units = whole days in [period_start, period_end_exclusive)"
      - name: WORKDAY
        when: "term.proration_method == WORKDAY"
        difference: "covered_units = Monday-Friday dates in [overlap_start, overlap_end); period_units = Monday-Friday dates in [period_start, period_end_exclusive). Weekend-heavy partial windows therefore pay a different amount than the calendar-day variant for identical appointment inputs."

  - name: insurance_subsidy_and_net_stipend
    trigger: "POST /appointments/{id}/submit"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned and each step runs exactly once. The subsidy tier is keyed on the
      # PRE-offset gross from step 1, never on the net produced in step 6 - keying it on the net would
      # select a lower tier whenever the gross sits just above a breakpoint.
      step1: gross_term_stipend_cents = appointment.total_stipend_cents      # from stipend_pay_schedule
      step2: premium_cents = policy.term_insurance_premium_cents if appointment.insurance_eligible else 0
      step3: subsidy_tier_pct = 90 if gross_term_stipend_cents < 1200000
                                75 if 1200000 <= gross_term_stipend_cents < 1800000
                                50 if gross_term_stipend_cents >= 1800000
      step4: insurance_subsidy_cents = round_half_up(premium_cents * subsidy_tier_pct / 100)
      step5: employee_premium_cents = premium_cents - insurance_subsidy_cents
      step6: net_term_stipend_cents = gross_term_stipend_cents - employee_premium_cents
    input_set: "The single appointment being submitted plus its matching StipendPolicy."
    constants:
      SUBSIDY_TIER_BREAK_LOW_CENTS: 1200000
      SUBSIDY_TIER_BREAK_HIGH_CENTS: 1800000
    precision: "subsidy rounded half-up to whole cents; tier boundaries are inclusive lower bounds (>=)"

  - name: student_effort_aggregate
    trigger: "POST /appointments/{id}/submit, POST /appointments/{id}/terminate, appointment cancellation cascade, POST /appointments/{id}/return"
    algorithm: aggregation
    formula: |
      counted_statuses = {SUBMITTED, FUNDING_VERIFIED, APPROVED, ACTIVE, NON_RENEWAL_PENDING}
      reference_window = [candidate.start_date, candidate.end_date]        # closed-closed, inclusive
      overlapping = [a for a in Appointment
                     where a.student_id == student.id
                       and a.id != candidate.id
                       and a.lifecycle_status IN counted_statuses
                       and a.start_date <= candidate.end_date
                       and a.end_date   >= candidate.start_date]           # inclusive on both ends
      total_effort_pct = candidate.effort_pct + sum(a.effort_pct for a in overlapping)
      assigned_hours_per_week = round_half_up(total_effort_pct / 100 * FULL_TIME_WEEKLY_HOURS, 1 decimal)
      # Persisted GraduateStudent.total_effort_pct uses the same expression with the candidate dropped
      # and reference_window taken from the most recently mutated counted appointment; when the student
      # has no counted appointment it is 0.
    input_set: "Appointment rows of the student in counted_statuses whose inclusive date window intersects the reference window; DRAFT, RETURNED, COMPLETED, TERMINATED and CANCELLED rows are excluded."
    constants:
      FULL_TIME_WEEKLY_HOURS: 40
      DEFAULT_EFFORT_CAP_PCT: 75
      INTERNATIONAL_MAX_WEEKLY_HOURS: 20
    precision: "effort percentages are integers; hours to 1 decimal, round_half_up; caps compared with <= (a value exactly equal to the cap passes)"

  - name: funding_source_balance
    trigger: "Any FundingAllocation status change, disbursement pay/reverse, or term close"
    algorithm: aggregation
    formula: |
      committed_amount_cents =
          sum(a.allocated_stipend_cents + a.allocated_remission_cents - a.disbursed_amount_cents
              for a in FundingAllocation where a.funding_source_id == source.id and a.status == COMMITTED)
      expended_amount_cents =
          sum(a.disbursed_amount_cents
              for a in FundingAllocation where a.funding_source_id == source.id and a.status == COMMITTED)
        + sum(a.allocated_stipend_cents + a.allocated_remission_cents
              for a in FundingAllocation where a.funding_source_id == source.id and a.status == EXPENDED)
      available_amount_cents = source.authorized_amount_cents - committed_amount_cents - expended_amount_cents
      invariant (funding conservation):
          authorized_amount_cents == available_amount_cents + committed_amount_cents + expended_amount_cents
    input_set: "FundingAllocation rows charged to the source with status IN {COMMITTED, EXPENDED}; PROPOSED rows never encumber and RELEASED rows contribute nothing (their allocated amounts are zeroed at release)."
    constants: {}
    precision: "whole cents; no rounding occurs in this aggregation"

  - name: tuition_benefit_tax_assessment
    trigger: "POST /tax-assessments (TERM_PROVISIONAL); POST /tax-assessments/{id}/finalize and POST /tax-assessments/{id}/amend (CALENDAR_YEAR_FINAL)"
    algorithm: threshold
    formula: |
      counted_statuses = {APPROVED, ACTIVE, NON_RENEWAL_PENDING, COMPLETED, TERMINATED}
      benefit_cents = sum(a.tuition_remission_cents for a in Appointment
                          where a.student_id == assessment.student_id
                            and a.term_id  == assessment.term_id
                            and a.lifecycle_status IN counted_statuses)
      CAP = policy_cap = the tuition_tax_exempt_cap_cents of any StipendPolicy of assessment.term_id
                         (all policies of one term MUST declare the same cap)
      # variant-specific exemption arithmetic below
      imputed_withholding_cents = round_half_up(taxable_cents * IMPUTED_WITHHOLDING_RATE)
    input_set: "Appointment rows of the (student, term) pair in counted_statuses; DRAFT / SUBMITTED / RETURNED / FUNDING_VERIFIED / CANCELLED rows are excluded. Sibling assessments considered by the FINAL variant are those of the same student with status == FINAL and the same tax_calendar_year, excluding this row."
    constants:
      IMPUTED_WITHHOLDING_RATE: 0.2200
    precision: "whole cents; withholding rounded half-up; cap comparisons are inclusive (a year total exactly equal to CAP is fully exempt)"
    variants:
      - name: TERM_PROVISIONAL
        when: "assessment.status == PROVISIONAL (produced by POST /tax-assessments)"
        difference: |
          The cap is applied per term in isolation:
            exempt_cents  = min(benefit_cents, CAP)
            taxable_cents = benefit_cents - exempt_cents
          Two terms of 400000 each therefore both report taxable_cents == 0.
      - name: CALENDAR_YEAR_FINAL
        when: "POST /tax-assessments/{id}/finalize or /amend (assessment.status becomes FINAL or AMENDED)"
        difference: |
          The cap is applied to the calendar-year running total, and only the unused remainder shields
          this term:
            prior_final = [x for x in TaxAssessment where x.student_id == this.student_id
                              and x.tax_calendar_year == this.tax_calendar_year
                              and x.status == FINAL and x.id != this.id]
            year_benefit_cents = benefit_cents + sum(x.benefit_cents for x in prior_final)
            year_exempt_cents  = min(year_benefit_cents, CAP)
            remaining_cap_cents = max(0, year_exempt_cents - sum(x.exempt_cents for x in prior_final))
            exempt_cents       = min(benefit_cents, remaining_cap_cents)   # clamped: never exceeds this term's own benefit
            taxable_cents      = benefit_cents - exempt_cents              # therefore never negative
          The same 400000 + 400000 pair now reports taxable_cents == 275000 on the second term, which is
          the divergence from TERM_PROVISIONAL.
          invariant (tuition-benefit conservation): benefit_cents == exempt_cents + taxable_cents, and
          sum(exempt_cents) over the student's FINAL assessments in one tax_calendar_year <= CAP.

  - name: renewal_notice_deadline
    trigger: "POST /renewal-decisions (row creation)"
    algorithm: interval_merge
    formula: |
      renewal_window_open_date = appointment.end_date - RENEWAL_WINDOW_DAYS days
      notice_deadline_date     = appointment.end_date - department.non_renewal_notice_days days
      # Both are plain calendar-date subtractions on the appointing department's configuration.
      creation requires: renewal_window_open_date <= current logical-clock date  (inclusive)
      NON_RENEW issuance requires: current logical-clock date <= notice_deadline_date  (inclusive)
    input_set: "The single appointment under review plus the Department row named by appointment.department_id."
    constants:
      RENEWAL_WINDOW_DAYS: 120
      MIN_RENEWAL_GPA: 3.00
    precision: "whole calendar days; both bounds inclusive"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "When X-User-Role == StudentUser, X-User-ID equals the student_id of the addressed resource (GET /students/{id}, GET /appointments with student_id filter, GET /tax-assessments with student_id filter, POST /renewal-decisions/{id}/acknowledge)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /students/{id}, GET /appointments, GET /tax-assessments, POST /renewal-decisions/{id}/acknowledge"

  - priority: 4
    category: existence
    check: "Path-segment ids resolve left to right to existing rows"
    error_id: ERR_TERM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with an {id} segment; error id is the one for the addressed collection (ERR_TERM_NOT_FOUND, ERR_DEPARTMENT_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_FUNDING_SOURCE_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_RENEWAL_DECISION_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND)"

  - priority: 5
    category: existence
    check: "Body foreign keys resolve to existing rows, checked in declaration order: term_id, department_id, student_id, funding_source_id, appointment_id, renewed_from_appointment_id"
    error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /stipend-policies, POST /pay-periods, POST /funding-sources, POST /appointments, PUT /appointments/{id}/funding-plan, POST /renewal-decisions, POST /tax-assessments"

  - priority: 6
    category: business_constraint
    check: "Required fields present; enum values in range; dates ISO 8601 YYYY-MM-DD; effort_pct 1-100; share_pct 0.01-100.00 with at most 2 decimals; allocations array holds 1-5 elements; limit 1-100; offset >= 0; end_date >= start_date; period_end_exclusive > period_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 7
    category: state
    check: "expected_appointment_version equals Appointment.version"
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412
    applies_to: "PUT /appointments/{id}/funding-plan"

  - priority: 8
    category: state
    check: "expected_student_version equals GraduateStudent.version"
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
    applies_to: "POST /tax-assessments"

  - priority: 9
    category: business_referential
    check: "Uniqueness: AcademicTerm.term_code; GraduateStudent.student_number; FundingSource.source_code; StipendPolicy per (term_id, assistantship_type, degree_level); PayPeriod per (term_id, sequence_no)"
    error_id: ERR_DUPLICATE_TERM_CODE
    http_status: 409
    applies_to: "POST /academic-terms (ERR_DUPLICATE_TERM_CODE), POST /students (ERR_DUPLICATE_STUDENT_NUMBER), POST /funding-sources (ERR_DUPLICATE_FUNDING_SOURCE_CODE), POST /stipend-policies (ERR_DUPLICATE_STIPEND_POLICY), POST /pay-periods (ERR_DUPLICATE_PAY_PERIOD_SEQUENCE)"

  - priority: 10
    category: state
    check: "The addressed resource is in a state that permits the requested transition (per §1.2)"
    error_id: ERR_INVALID_APPOINTMENT_STATE
    http_status: 409
    applies_to: "all action endpoints; error id is the one for the addressed entity (ERR_INVALID_TERM_STATE, ERR_INVALID_APPOINTMENT_STATE, ERR_INVALID_ALLOCATION_STATE, ERR_INVALID_DISBURSEMENT_STATE, ERR_INVALID_RENEWAL_STATE, ERR_INVALID_ASSESSMENT_STATE)"

  - priority: 11
    category: state
    check: "The governing AcademicTerm.status == OPEN"
    error_id: ERR_TERM_NOT_OPEN
    http_status: 409
    applies_to: "POST /stipend-policies (also accepts PLANNING), PUT /appointments/{id}/funding-plan, POST /appointments/{id}/submit, POST /appointments/{id}/return, POST /appointments/{id}/verify-funding, POST /appointments/{id}/approve, POST /appointments/{id}/activate, POST /appointments/{id}/schedule-payroll"

  - priority: 12
    category: state
    check: "Every FundingSource referenced by an allocation being committed has status == ACTIVE"
    error_id: ERR_FUNDING_SOURCE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /appointments/{id}/verify-funding"

  - priority: 13
    category: state
    check: "The disbursement's PayPeriod.status == LOCKED"
    error_id: ERR_PAY_PERIOD_NOT_LOCKED
    http_status: 409
    applies_to: "POST /stipend-disbursements/{id}/pay"

  - priority: 14
    category: business_safety
    check: "For an international student in an IN_SESSION term: assigned_hours_per_week including this appointment plus student.external_weekly_hours <= INTERNATIONAL_MAX_WEEKLY_HOURS (20.0); a value exactly equal to 20.0 passes"
    error_id: ERR_INTERNATIONAL_HOUR_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 15
    category: business_safety
    check: "student.sap_status == SATISFACTORY, and for renewal certification also cumulative_gpa >= MIN_RENEWAL_GPA (3.00)"
    error_id: ERR_SAP_NOT_SATISFACTORY
    http_status: 422
    applies_to: "POST /appointments/{id}/approve, POST /renewal-decisions/{id}/certify-progress"

  - priority: 16
    category: business_safety
    check: "Segregation of duties: on issue-notice X-User-ID != RenewalDecision.certified_by_user_id; on appointment approve X-User-ID != GraduateStudent.cap_override_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /renewal-decisions/{id}/issue-notice, POST /appointments/{id}/approve"

  - priority: 17
    category: business_constraint
    check: "Aggregate effort from calc student_effort_aggregate <= GraduateStudent.effort_cap_pct; a value exactly equal to the cap passes"
    error_id: ERR_OVER_APPOINTMENT
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 18
    category: business_constraint
    check: "Dual-role conflict: the set of assistantship_type values over {this appointment} plus the student's counted appointments whose inclusive date windows intersect this one must NOT contain both TEACHING and ADMINISTRATIVE"
    error_id: ERR_DUAL_ROLE_CONFLICT
    http_status: 409
    applies_to: "POST /appointments/{id}/submit"

  - priority: 19
    category: business_constraint
    check: "Opening a term requires at least one PayPeriod and at least one StipendPolicy for that term"
    error_id: ERR_TERM_CALENDAR_INCOMPLETE
    http_status: 422
    applies_to: "POST /academic-terms/{id}/open"

  - priority: 20
    category: business_constraint
    check: "Locking payroll requires zero appointments of the term in lifecycle_status FUNDING_VERIFIED"
    error_id: ERR_UNRESOLVED_APPOINTMENTS
    http_status: 409
    applies_to: "POST /academic-terms/{id}/lock-payroll"

  - priority: 21
    category: business_constraint
    check: "Closing a term requires every StipendDisbursement of its pay periods in {PAID, VOIDED, REVERSED} and every TaxAssessment of the term in {FINAL, SUPERSEDED}"
    error_id: ERR_UNSETTLED_DISBURSEMENTS
    http_status: 409
    applies_to: "POST /academic-terms/{id}/close"

  - priority: 22
    category: business_temporal
    check: "term.term_start <= appointment.start_date and appointment.end_date <= term.term_end"
    error_id: ERR_APPOINTMENT_DATES_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 23
    category: business_temporal
    check: "A new PayPeriod must not overlap an existing PayPeriod of the same term under half-open semantics: reject when new.period_start < existing.period_end_exclusive AND existing.period_start < new.period_end_exclusive. Exact adjacency (new.period_start == existing.period_end_exclusive) is allowed."
    error_id: ERR_PAY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /pay-periods"

  - priority: 24
    category: business_temporal
    check: "Each allocation's FundingSource budget window must cover the appointment window: source.budget_period_start <= appointment.start_date and appointment.end_date <= source.budget_period_end"
    error_id: ERR_FUNDING_PERIOD_MISMATCH
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 25
    category: business_temporal
    check: "Current logical-clock date >= appointment.end_date - RENEWAL_WINDOW_DAYS (inclusive)"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /renewal-decisions"

  - priority: 26
    category: business_temporal
    check: "For decision == NON_RENEW, current logical-clock date <= notice_deadline_date (inclusive)"
    error_id: ERR_NOTICE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /renewal-decisions/{id}/issue-notice"

  - priority: 27
    category: business_referential
    check: "The appointment has at least one FundingAllocation with status == PROPOSED (empty allocation set is rejected)"
    error_id: ERR_FUNDING_ALLOCATION_MISSING
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 28
    category: business_referential
    check: "sum(share_pct) over the appointment's PROPOSED allocations equals exactly 100.00"
    error_id: ERR_ALLOCATION_SHARES_INVALID
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 29
    category: business_referential
    check: "Every allocation with is_cost_share == true references a source whose source_type == DEPARTMENTAL_BUDGET, and a plan containing any cost-share allocation must also contain at least one allocation with is_cost_share == false"
    error_id: ERR_COST_SHARE_SOURCE_INVALID
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 30
    category: business_referential
    check: "A StipendPolicy exists for (appointment.term_id, appointment.assistantship_type, student.degree_level)"
    error_id: ERR_STIPEND_POLICY_MISSING
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/submit"

  - priority: 31
    category: business_referential
    check: "No allocation references a FELLOWSHIP source when appointment.assistantship_type == TEACHING"
    error_id: ERR_FELLOWSHIP_SERVICE_CONFLICT
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 32
    category: business_referential
    check: "At most one RenewalDecision per appointment with status != ACKNOWLEDGED"
    error_id: ERR_RENEWAL_DECISION_EXISTS
    http_status: 409
    applies_to: "POST /renewal-decisions"

  - priority: 33
    category: business_referential
    check: "No TaxAssessment with status IN {FINAL, AMENDED} exists for the (student_id, term_id) pair"
    error_id: ERR_ASSESSMENT_ALREADY_FINAL
    http_status: 409
    applies_to: "POST /tax-assessments"

  - priority: 34
    category: business_fiscal
    check: "round_half_up(monthly_stipend_cents * 100 / effort_pct) >= policy.min_fte_monthly_stipend_cents; a value exactly equal to the minimum passes"
    error_id: ERR_STIPEND_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 35
    category: business_fiscal
    check: "For every allocation whose source_type == GRANT: effort_pct * share_pct / 100 <= source.grant_effort_cap_pct; a value exactly equal to the cap passes"
    error_id: ERR_GRANT_EFFORT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /appointments/{id}/submit"

  - priority: 36
    category: business_fiscal
    check: "For every referenced FundingSource: available_amount_cents minus the sum of this appointment's allocations charged to it is >= 0"
    error_id: ERR_FUNDING_INSUFFICIENT
    http_status: 422
    applies_to: "POST /appointments/{id}/verify-funding"

  - priority: 37
    category: business_fiscal
    check: "allocation.disbursed_amount_cents == 0 at release time"
    error_id: ERR_ALLOCATION_PARTIALLY_DISBURSED
    http_status: 409
    applies_to: "POST /funding-allocations/{id}/release"

  - priority: 38
    category: business_constraint
    check: "The allocation's Appointment.lifecycle_status is NOT IN {APPROVED, ACTIVE}"
    error_id: ERR_ALLOCATION_LOCKED_BY_APPROVAL
    http_status: 409
    applies_to: "POST /funding-allocations/{id}/release"

  - priority: 39
    category: business_fiscal
    check: "source.committed_amount_cents == 0 at close time"
    error_id: ERR_FUNDING_SOURCE_HAS_COMMITMENTS
    http_status: 409
    applies_to: "POST /funding-sources/{id}/close"

  - priority: 40
    category: business_fiscal
    check: "Recomputing calc tuition_benefit_tax_assessment yields a benefit_cents different from the stored value"
    error_id: ERR_NO_ASSESSMENT_DELTA
    http_status: 409
    applies_to: "POST /tax-assessments/{id}/amend"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================

endpoints:

  # ---- AcademicTerm ---------------------------------------------------------
  - method: POST
    path: "/academic-terms"
    description: "Create an academic term in PLANNING"
    roles: [GradSchoolAdmin]
    code: 201
    input: [term_code, term_start, term_end, tax_calendar_year, session_type, proration_method, remission_drop_deadline]
    output: AcademicTerm
    side_effects: ["status = PLANNING", "pay_period_count = 0"]

  - method: GET
    path: "/academic-terms/{id}"
    description: "Read one academic term including its computed pay_period_count"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant, FacultySupervisor]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: []

  - method: POST
    path: "/academic-terms/{id}/open"
    description: "Open the term for appointment activity (PLANNING -> OPEN)"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["status = OPEN", "pay_period_count recomputed"]

  - method: POST
    path: "/academic-terms/{id}/lock-payroll"
    description: "Freeze the payroll calendar (OPEN -> PAYROLL_LOCKED) and lock every OPEN pay period"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: AcademicTerm
    side_effects: ["status = PAYROLL_LOCKED", "locked_at set", "PayPeriod OPEN -> LOCKED for the term"]

  - method: POST
    path: "/academic-terms/{id}/close"
    description: "Close the term (PAYROLL_LOCKED -> CLOSED), completing appointments and expending their commitments"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: AcademicTerm
    side_effects:
      - "status = CLOSED; closed_at set"
      - "PayPeriod LOCKED -> CLOSED"
      - "Appointment ACTIVE|NON_RENEWAL_PENDING with end_date <= term_end -> COMPLETED"
      - "their COMMITTED FundingAllocation rows -> EXPENDED; FundingSource balances recomputed"

  - method: GET
    path: "/academic-terms/{id}/stipend-policies"
    description: "List the stipend policies governing the term"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant, FacultySupervisor]
    code: 200
    input: ["assistantship_type?", "degree_level?", "limit?", "offset?"]
    output: StipendPolicy[]
    side_effects: []

  - method: GET
    path: "/academic-terms/{id}/pay-periods"
    description: "List the term's pay-period calendar ordered by sequence_no ASC"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant, FacultySupervisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayPeriod[]
    side_effects: []

  # ---- Department -----------------------------------------------------------
  - method: POST
    path: "/departments"
    description: "Create an appointing department"
    roles: [GradSchoolAdmin]
    code: 201
    input: [code, name, "non_renewal_notice_days?"]
    output: Department
    side_effects: ["non_renewal_notice_days defaults to 60"]

  - method: GET
    path: "/departments/{id}"
    description: "Read one department"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant, FacultySupervisor]
    code: 200
    input: []
    output: Department
    side_effects: []

  # ---- StipendPolicy --------------------------------------------------------
  - method: POST
    path: "/stipend-policies"
    description: "Declare the stipend/remission/insurance/tax policy for one (term, assistantship type, degree level)"
    roles: [GradSchoolAdmin]
    code: 201
    input: [term_id, assistantship_type, degree_level, min_fte_monthly_stipend_cents, per_credit_tuition_cents, max_remission_cents_per_term, term_insurance_premium_cents, "insurance_min_effort_pct?", "min_insurance_duration_days?", "tuition_tax_exempt_cap_cents?"]
    output: StipendPolicy
    side_effects: ["requires term.status IN {PLANNING, OPEN}"]

  # ---- PayPeriod ------------------------------------------------------------
  - method: POST
    path: "/pay-periods"
    description: "Append a half-open pay period to a term's payroll calendar"
    roles: [GradSchoolAdmin]
    code: 201
    input: [term_id, sequence_no, period_start, period_end_exclusive, pay_date]
    output: PayPeriod
    side_effects:
      - "requires term.status == PLANNING"
      - "calendar_day_count and workday_count computed"
      - "rejected on half-open overlap with an existing period of the term (adjacency allowed)"
      - "term.pay_period_count recomputed"

  # ---- GraduateStudent -----------------------------------------------------
  - method: POST
    path: "/students"
    description: "Register a graduate student"
    roles: [GradSchoolAdmin]
    code: 201
    input: [student_number, full_name, degree_level, is_international, cumulative_gpa, "visa_type?", "enrolled_credit_hours?", "external_weekly_hours?"]
    output: GraduateStudent
    side_effects: ["sap_status = SATISFACTORY", "effort_cap_pct = 75", "all computed aggregates = 0"]

  - method: GET
    path: "/students/{id}"
    description: "Read one student including effort and tuition-benefit aggregates"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant, FacultySupervisor, StudentUser]
    code: 200
    input: []
    output: GraduateStudent
    side_effects: []

  - method: PATCH
    path: "/students/{id}/academic-progress"
    description: "Record academic progress; a non-SATISFACTORY sap_status revokes any pending renewal certification"
    roles: [FacultySupervisor, GradSchoolAdmin]
    code: 200
    input: ["sap_status?", "cumulative_gpa?", "enrolled_credit_hours?", "external_weekly_hours?"]
    output: GraduateStudent
    side_effects:
      - "patched fields updated; GraduateStudent.version incremented"
      - "when sap_status becomes PROBATION or UNSATISFACTORY: every RenewalDecision of this student's appointments in status SAP_CERTIFIED -> DRAFT with sap_certified = false, certified_by_user_id = null and revision_count += 1"

  - method: POST
    path: "/students/{id}/effort-cap-override"
    description: "Raise a student's aggregate effort cap; records the approving user for segregation of duties"
    roles: [GradSchoolAdmin]
    code: 200
    input: [approved_max_effort_pct, justification]
    output: GraduateStudent
    side_effects:
      - "effort_cap_pct = approved_max_effort_pct; cap_override_by_user_id = X-User-ID; cap_override_justification set"
      - "GraduateStudent.version incremented"
      - "the recorded cap_override_by_user_id is thereafter barred from approving this student's appointments"

  # ---- FundingSource -------------------------------------------------------
  - method: POST
    path: "/funding-sources"
    description: "Create a grant, departmental budget or fellowship account"
    roles: [GrantAccountant, GradSchoolAdmin]
    code: 201
    input: [department_id, source_code, source_type, authorized_amount_cents, budget_period_start, budget_period_end, allows_tuition_remission, "sponsor_code?", "grant_effort_cap_pct?", "auto_reinstate_threshold_cents?"]
    output: FundingSource
    side_effects: ["status = ACTIVE", "committed = expended = 0", "available_amount_cents = authorized_amount_cents"]

  - method: GET
    path: "/funding-sources/{id}"
    description: "Read one funding source including its balance triple"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant]
    code: 200
    input: []
    output: FundingSource
    side_effects: []

  - method: GET
    path: "/funding-sources"
    description: "List funding sources, filterable by administering department, type and status"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant]
    code: 200
    input: ["department_id?", "source_type?", "status?", "limit?", "offset?"]
    output: FundingSource[]
    side_effects: []

  - method: POST
    path: "/funding-sources/{id}/suspend"
    description: "Suspend a source so it accepts no new commitments"
    roles: [GrantAccountant]
    code: 200
    input: [reason]
    output: FundingSource
    side_effects: ["status = SUSPENDED; suspension_reason = reason", "existing COMMITTED allocations untouched"]

  - method: POST
    path: "/funding-sources/{id}/reinstate"
    description: "Manually clear a suspension"
    roles: [GrantAccountant]
    code: 200
    input: []
    output: FundingSource
    side_effects: ["status = ACTIVE; suspension_reason = null"]

  - method: POST
    path: "/funding-sources/{id}/close"
    description: "Close out a source; requires zero outstanding commitments"
    roles: [GrantAccountant]
    code: 200
    input: []
    output: FundingSource
    side_effects: ["status = CLOSED; suspension_reason = null"]

  # ---- Appointment ---------------------------------------------------------
  - method: POST
    path: "/appointments"
    description: "Create a DRAFT assistantship appointment; computes the effort profile, remission band and insurance eligibility"
    roles: [DepartmentAdmin]
    code: 201
    input: [student_id, department_id, term_id, assistantship_type, effort_pct, start_date, end_date, monthly_stipend_cents, supervisor_user_id, "renewed_from_appointment_id?"]
    output: Appointment
    side_effects:
      - "lifecycle_status = DRAFT; payroll_status = NOT_SCHEDULED"
      - "calc appointment_effort_profile sets weekly_hours, duration_days, tuition_remission_pct, insurance_eligible"
      - "cents-valued fields remain 0 until submit"

  - method: GET
    path: "/appointments/{id}"
    description: "Read one appointment with both state axes and all computed money fields"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant, FacultySupervisor, StudentUser]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments filterable by student, department, term, predecessor and lifecycle state"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant, FacultySupervisor, StudentUser]
    code: 200
    input: ["student_id?", "department_id?", "term_id?", "renewed_from_appointment_id?", "lifecycle_status?", "payroll_status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: PUT
    path: "/appointments/{id}/funding-plan"
    description: "Replace the appointment's whole funding plan with a new cost-shared allocation set (OCC on Appointment.version)"
    roles: [DepartmentAdmin, GrantAccountant]
    code: 200
    input: [allocations, expected_appointment_version]
    output: Appointment
    side_effects:
      - "allocations is an array of 1-5 objects, each { funding_source_id, share_pct, is_cost_share? }"
      - "requires appointment.lifecycle_status IN {DRAFT, RETURNED, SUBMITTED} and term.status == OPEN"
      - "every existing FundingAllocation of the appointment with status IN {PROPOSED, COMMITTED} -> RELEASED with release_reason = 'PLAN_SUPERSEDED' and amounts zeroed"
      - "one new FundingAllocation row per element of allocations, status PROPOSED, plan_sequence = 1-based array index"
      - "affected FundingSource balances recomputed"
      - "increments Appointment.version by 1"

  - method: POST
    path: "/appointments/{id}/submit"
    description: "Submit the appointment for funding review; runs the full compliance, workload, cost-share and stipend-minimum battery and computes every money field"
    roles: [DepartmentAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "lifecycle_status DRAFT|RETURNED -> SUBMITTED; submitted_by_user_id set"
      - "calc stipend_pay_schedule projection sets projected_pay_period_count and total_stipend_cents"
      - "calc tuition_remission_entitlement sets tuition_remission_cents and each allocation's allocated_remission_cents"
      - "calc cost_share_allocation_split sets each allocation's allocated_stipend_cents"
      - "calc insurance_subsidy_and_net_stipend sets insurance_subsidy_cents, employee_premium_cents, net_term_stipend_cents"
      - "student.total_effort_pct / assigned_hours_per_week recomputed; GraduateStudent.version incremented"

  - method: POST
    path: "/appointments/{id}/return"
    description: "Return a submitted or funding-verified appointment for revision, releasing any committed allocations"
    roles: [GradSchoolAdmin]
    code: 200
    input: [return_reason]
    output: Appointment
    side_effects:
      - "lifecycle_status -> RETURNED; return_reason set"
      - "COMMITTED allocations -> RELEASED with amounts zeroed; FundingSource balances recomputed"
      - "student.total_effort_pct recomputed; GraduateStudent.version incremented"

  - method: POST
    path: "/appointments/{id}/verify-funding"
    description: "Commit the appointment's funding plan against its sources"
    roles: [GrantAccountant]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "lifecycle_status SUBMITTED -> FUNDING_VERIFIED"
      - "PROPOSED allocations -> COMMITTED"
      - "each FundingSource committed_amount_cents / available_amount_cents recomputed"

  - method: POST
    path: "/appointments/{id}/approve"
    description: "Approve a funding-verified appointment; blocked for the user who raised the student's effort cap"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle_status FUNDING_VERIFIED -> APPROVED; approved_by_user_id = X-User-ID"]

  - method: POST
    path: "/appointments/{id}/activate"
    description: "Activate an approved appointment"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle_status APPROVED -> ACTIVE"]

  - method: POST
    path: "/appointments/{id}/schedule-payroll"
    description: "Materialise the appointment's pay-period disbursements using the term's proration method"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "one StipendDisbursement per intersecting PayPeriod, each with covered_units, period_units, gross_amount_cents and allocation_split"
      - "payroll_status NOT_SCHEDULED -> SCHEDULED"

  - method: POST
    path: "/appointments/{id}/terminate"
    description: "Terminate an appointment; voids scheduled pay, re-derives remission and unwinds encumbrances"
    roles: [GradSchoolAdmin]
    code: 200
    input: [termination_reason]
    output: Appointment
    side_effects:
      - "lifecycle_status -> TERMINATED; payroll_status -> PAY_VOIDED; termination_date set"
      - "SCHEDULED disbursements -> VOIDED"
      - "allocation allocated_stipend_cents reduced to PAID splits; remission re-derived (0 before term.remission_drop_deadline)"
      - "fully-unwound COMMITTED allocations -> RELEASED; FundingSource balances recomputed"
      - "SUSPENDED/OVERCOMMITMENT sources at/above auto_reinstate_threshold_cents -> ACTIVE"
      - "student effort aggregates and tuition_benefit_ytd_cents recomputed; GraduateStudent.version incremented"

  - method: POST
    path: "/appointments/{id}/suspend-pay"
    description: "Suspend disbursements without touching the approval axis"
    roles: [GradSchoolAdmin]
    code: 200
    input: [pay_suspension_reason]
    output: Appointment
    side_effects: ["payroll_status -> PAY_SUSPENDED; pay_suspension_reason set", "lifecycle_status unchanged"]

  - method: POST
    path: "/appointments/{id}/resume-pay"
    description: "Resume disbursements; returns to SCHEDULED or PARTIALLY_DISBURSED depending on paid history"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["payroll_status -> SCHEDULED when no PAID disbursement exists, else PARTIALLY_DISBURSED", "pay_suspension_reason = null"]

  # ---- FundingAllocation ---------------------------------------------------
  - method: GET
    path: "/funding-allocations/{id}"
    description: "Read one funding allocation including its allocated and disbursed amounts"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []

  - method: GET
    path: "/funding-allocations"
    description: "List funding allocations filterable by appointment, source and status, ordered by plan_sequence ASC then created_at ASC; the only discovery channel for cascade-created rows"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant]
    code: 200
    input: ["appointment_id?", "funding_source_id?", "status?", "limit?", "offset?"]
    output: FundingAllocation[]
    side_effects: []

  - method: POST
    path: "/funding-allocations/{id}/release"
    description: "Release a committed, never-disbursed allocation back to its source"
    roles: [GrantAccountant]
    code: 200
    input: [release_reason]
    output: FundingAllocation
    side_effects:
      - "status COMMITTED -> RELEASED; allocated amounts zeroed"
      - "FundingSource committed/available recomputed; OVERCOMMITMENT suspension may auto-clear"
      - "an appointment in FUNDING_VERIFIED reverts to RETURNED with return_reason = 'FUNDING_RELEASED'"

  # ---- StipendDisbursement -------------------------------------------------
  - method: GET
    path: "/stipend-disbursements/{id}"
    description: "Read one disbursement including its per-source allocation split"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant]
    code: 200
    input: []
    output: StipendDisbursement
    side_effects: []

  - method: GET
    path: "/stipend-disbursements"
    description: "List disbursements filterable by appointment, pay period and status, ordered by pay_period sequence_no ASC"
    roles: [GradSchoolAdmin, DepartmentAdmin, GrantAccountant]
    code: 200
    input: ["appointment_id?", "pay_period_id?", "status?", "limit?", "offset?"]
    output: StipendDisbursement[]
    side_effects: []

  - method: POST
    path: "/stipend-disbursements/{id}/pay"
    description: "Pay a scheduled disbursement out of a locked pay period"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: StipendDisbursement
    side_effects:
      - "status SCHEDULED -> PAID; paid_at set"
      - "each split raises FundingAllocation.disbursed_amount_cents and moves the amount from committed to expended on its source"
      - "appointment.payroll_status -> PARTIALLY_DISBURSED or FULLY_DISBURSED"

  - method: POST
    path: "/stipend-disbursements/{id}/reverse"
    description: "Reverse a paid disbursement, returning the money to encumbrance without changing authorized totals"
    roles: [GradSchoolAdmin]
    code: 200
    input: [reversal_reason]
    output: StipendDisbursement
    side_effects:
      - "status PAID -> REVERSED; reversed_at set"
      - "each split lowers FundingAllocation.disbursed_amount_cents and moves the amount from expended back to committed"
      - "appointment.payroll_status recomputed"

  # ---- RenewalDecision -----------------------------------------------------
  - method: POST
    path: "/renewal-decisions"
    description: "Open a renewal review for an expiring appointment; computes the renewal window and non-renewal notice deadline"
    roles: [DepartmentAdmin]
    code: 201
    input: [appointment_id]
    output: RenewalDecision
    side_effects: ["status = DRAFT; decision = PENDING", "renewal_window_open_date and notice_deadline_date computed"]

  - method: GET
    path: "/renewal-decisions/{id}"
    description: "Read one renewal review"
    roles: [GradSchoolAdmin, DepartmentAdmin, FacultySupervisor, StudentUser]
    code: 200
    input: []
    output: RenewalDecision
    side_effects: []

  - method: GET
    path: "/renewal-decisions"
    description: "List renewal reviews filterable by appointment and status"
    roles: [GradSchoolAdmin, DepartmentAdmin, FacultySupervisor, StudentUser]
    code: 200
    input: ["appointment_id?", "status?", "decision?", "limit?", "offset?"]
    output: RenewalDecision[]
    side_effects: []

  - method: POST
    path: "/renewal-decisions/{id}/certify-progress"
    description: "Certify satisfactory academic progress for the review"
    roles: [FacultySupervisor, GradSchoolAdmin]
    code: 200
    input: []
    output: RenewalDecision
    side_effects: ["status DRAFT -> SAP_CERTIFIED; sap_certified = true; certified_by_user_id = X-User-ID; certified_at set"]

  - method: POST
    path: "/renewal-decisions/{id}/issue-notice"
    description: "Issue the renewal or non-renewal notice; the certifying user may not issue"
    roles: [DepartmentAdmin, GradSchoolAdmin]
    code: 200
    input: [decision]
    output: RenewalDecision
    side_effects:
      - "status SAP_CERTIFIED -> NOTICE_ISSUED; decision recorded; issued_by_user_id and notice_sent_date set"
      - "NON_RENEW: appointment ACTIVE -> NON_RENEWAL_PENDING, renewal_eligible = false, successor appointments CANCELLED and their allocations RELEASED with source balances recomputed"

  - method: POST
    path: "/renewal-decisions/{id}/acknowledge"
    description: "Student acknowledgement of the issued notice"
    roles: [StudentUser]
    code: 200
    input: []
    output: RenewalDecision
    side_effects: ["status NOTICE_ISSUED -> ACKNOWLEDGED; acknowledged_at set"]

  # ---- TaxAssessment -------------------------------------------------------
  - method: POST
    path: "/tax-assessments"
    description: "Create a provisional tuition-benefit tax assessment for a (student, term) pair (OCC on GraduateStudent.version)"
    roles: [GradSchoolAdmin]
    code: 201
    input: [student_id, term_id, expected_student_version]
    output: TaxAssessment
    side_effects:
      - "status = PROVISIONAL; variant_applied = TERM_PROVISIONAL"
      - "calc tuition_benefit_tax_assessment TERM_PROVISIONAL sets benefit_cents, exempt_cents, taxable_cents, imputed_withholding_cents"
      - "any prior PROVISIONAL assessment for the same pair -> SUPERSEDED"
      - "increments GraduateStudent.version by 1"

  - method: GET
    path: "/tax-assessments/{id}"
    description: "Read one tax assessment"
    roles: [GradSchoolAdmin, DepartmentAdmin, StudentUser]
    code: 200
    input: []
    output: TaxAssessment
    side_effects: []

  - method: GET
    path: "/tax-assessments"
    description: "List tax assessments filterable by student, term, year and status"
    roles: [GradSchoolAdmin, DepartmentAdmin, StudentUser]
    code: 200
    input: ["student_id?", "term_id?", "tax_calendar_year?", "status?", "limit?", "offset?"]
    output: TaxAssessment[]
    side_effects: []

  - method: POST
    path: "/tax-assessments/{id}/finalize"
    description: "Finalize the assessment using the calendar-year exemption remainder"
    roles: [GradSchoolAdmin]
    code: 200
    input: []
    output: TaxAssessment
    side_effects:
      - "status PROVISIONAL|AMENDED -> FINAL; variant_applied = CALENDAR_YEAR_FINAL"
      - "benefit/exempt/taxable/withholding recomputed against the student's other FINAL assessments in the same tax_calendar_year"
      - "student tuition_benefit_ytd_cents and taxable_tuition_benefit_ytd_cents recomputed; GraduateStudent.version incremented"

  - method: POST
    path: "/tax-assessments/{id}/amend"
    description: "Amend a finalized assessment after the underlying remission changed"
    roles: [GradSchoolAdmin]
    code: 200
    input: [amendment_reason]
    output: TaxAssessment
    side_effects:
      - "status FINAL -> AMENDED; amendment_reason set"
      - "benefit/exempt/taxable/withholding recomputed; rejected when nothing changed"
      - "student aggregates recomputed; GraduateStudent.version incremented"

  # ---- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time."
    roles: [GradSchoolAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock repositioned; no entity is mutated"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Authenticated role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "StudentUser addressed a student, appointment, assessment or renewal notice belonging to another student"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user certified the renewal being issued, or raised the effort cap of the student whose appointment is being approved"
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "term_id path segment or body field names no AcademicTerm"
  - id: ERR_DEPARTMENT_NOT_FOUND
    http: 404
    condition: "department_id names no Department"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id names no GraduateStudent"
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "funding_source_id names no FundingSource"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "appointment_id or renewed_from_appointment_id names no Appointment"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "Allocation id path segment names no FundingAllocation"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "Disbursement id path segment names no StipendDisbursement"
  - id: ERR_RENEWAL_DECISION_NOT_FOUND
    http: 404
    condition: "Renewal decision id path segment names no RenewalDecision"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "Assessment id path segment names no TaxAssessment"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad enum member, malformed date, out-of-range number, share_pct with more than 2 decimals, allocations array outside 1-5 elements, or limit/offset outside bounds"
  - id: ERR_STALE_APPOINTMENT_VERSION
    http: 412
    condition: "expected_appointment_version does not equal the Appointment's current version"
  - id: ERR_STALE_STUDENT_VERSION
    http: 412
    condition: "expected_student_version does not equal the GraduateStudent's current version"
  - id: ERR_DUPLICATE_TERM_CODE
    http: 409
    condition: "term_code already used by another AcademicTerm"
  - id: ERR_DUPLICATE_STUDENT_NUMBER
    http: 409
    condition: "student_number already used by another GraduateStudent"
  - id: ERR_DUPLICATE_FUNDING_SOURCE_CODE
    http: 409
    condition: "source_code already used by another FundingSource"
  - id: ERR_DUPLICATE_STIPEND_POLICY
    http: 409
    condition: "A StipendPolicy already exists for the (term_id, assistantship_type, degree_level) triple"
  - id: ERR_DUPLICATE_PAY_PERIOD_SEQUENCE
    http: 409
    condition: "A PayPeriod with that sequence_no already exists in the term"
  - id: ERR_INVALID_TERM_STATE
    http: 409
    condition: "AcademicTerm is not in a state that permits the requested operation"
  - id: ERR_INVALID_APPOINTMENT_STATE
    http: 409
    condition: "Appointment's lifecycle_status or payroll_status does not permit the requested transition"
  - id: ERR_INVALID_ALLOCATION_STATE
    http: 409
    condition: "FundingAllocation is not COMMITTED when a release is requested"
  - id: ERR_INVALID_DISBURSEMENT_STATE
    http: 409
    condition: "StipendDisbursement is not SCHEDULED for pay, or not PAID for reverse"
  - id: ERR_INVALID_RENEWAL_STATE
    http: 409
    condition: "RenewalDecision is not in the state required by the requested step"
  - id: ERR_INVALID_ASSESSMENT_STATE
    http: 409
    condition: "TaxAssessment is not PROVISIONAL/AMENDED for finalize, or not FINAL for amend"
  - id: ERR_TERM_NOT_OPEN
    http: 409
    condition: "The governing AcademicTerm.status is not OPEN"
  - id: ERR_FUNDING_SOURCE_NOT_ACTIVE
    http: 409
    condition: "An allocation being committed references a SUSPENDED or CLOSED FundingSource"
  - id: ERR_PAY_PERIOD_NOT_LOCKED
    http: 409
    condition: "Attempt to pay a disbursement whose PayPeriod is still OPEN or already CLOSED"
  - id: ERR_INTERNATIONAL_HOUR_LIMIT_EXCEEDED
    http: 422
    condition: "International student's assistantship hours plus external hours exceed 20.0 per week in an IN_SESSION term"
  - id: ERR_SAP_NOT_SATISFACTORY
    http: 422
    condition: "Student's sap_status is not SATISFACTORY, or cumulative_gpa is below 3.00 at renewal certification"
  - id: ERR_OVER_APPOINTMENT
    http: 422
    condition: "Aggregate effort across overlapping counted appointments would exceed the student's effort_cap_pct"
  - id: ERR_DUAL_ROLE_CONFLICT
    http: 409
    condition: "Overlapping counted appointments would combine a TEACHING and an ADMINISTRATIVE assistantship for one student"
  - id: ERR_TERM_CALENDAR_INCOMPLETE
    http: 422
    condition: "Opening a term with no PayPeriod rows or no StipendPolicy rows"
  - id: ERR_UNRESOLVED_APPOINTMENTS
    http: 409
    condition: "Locking payroll while an appointment of the term is still FUNDING_VERIFIED"
  - id: ERR_UNSETTLED_DISBURSEMENTS
    http: 409
    condition: "Closing a term with a SCHEDULED disbursement or a non-final tax assessment"
  - id: ERR_APPOINTMENT_DATES_OUTSIDE_TERM
    http: 422
    condition: "Appointment window is not contained in [term_start, term_end]"
  - id: ERR_PAY_PERIOD_OVERLAP
    http: 409
    condition: "New pay period overlaps an existing period of the same term under half-open interval semantics"
  - id: ERR_FUNDING_PERIOD_MISMATCH
    http: 422
    condition: "A funding source's budget period does not cover the whole appointment window"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "Renewal review opened more than RENEWAL_WINDOW_DAYS before the appointment's end_date"
  - id: ERR_NOTICE_DEADLINE_PASSED
    http: 422
    condition: "NON_RENEW notice issued after notice_deadline_date"
  - id: ERR_FUNDING_ALLOCATION_MISSING
    http: 422
    condition: "Submit attempted with an empty PROPOSED allocation set"
  - id: ERR_ALLOCATION_SHARES_INVALID
    http: 422
    condition: "Sum of share_pct over the appointment's PROPOSED allocations is not exactly 100.00"
  - id: ERR_COST_SHARE_SOURCE_INVALID
    http: 422
    condition: "A cost-share allocation points at a non-DEPARTMENTAL_BUDGET source, or the plan is entirely cost share"
  - id: ERR_STIPEND_POLICY_MISSING
    http: 422
    condition: "No StipendPolicy exists for the (term, assistantship_type, degree_level) triple"
  - id: ERR_FELLOWSHIP_SERVICE_CONFLICT
    http: 422
    condition: "A FELLOWSHIP source is used to fund a TEACHING appointment"
  - id: ERR_RENEWAL_DECISION_EXISTS
    http: 409
    condition: "A RenewalDecision that is not ACKNOWLEDGED already exists for the appointment"
  - id: ERR_ASSESSMENT_ALREADY_FINAL
    http: 409
    condition: "A FINAL or AMENDED assessment already exists for the (student, term) pair"
  - id: ERR_STIPEND_BELOW_MINIMUM
    http: 422
    condition: "Full-time-equivalent monthly stipend is below the policy minimum"
  - id: ERR_GRANT_EFFORT_CAP_EXCEEDED
    http: 422
    condition: "Effort drawn from a GRANT source exceeds that source's grant_effort_cap_pct"
  - id: ERR_FUNDING_INSUFFICIENT
    http: 422
    condition: "Committing the plan would drive a source's available_amount_cents below zero"
  - id: ERR_ALLOCATION_PARTIALLY_DISBURSED
    http: 409
    condition: "Release attempted on an allocation with disbursed_amount_cents greater than zero"
  - id: ERR_ALLOCATION_LOCKED_BY_APPROVAL
    http: 409
    condition: "Release attempted while the funded appointment is APPROVED or ACTIVE"
  - id: ERR_FUNDING_SOURCE_HAS_COMMITMENTS
    http: 409
    condition: "Close attempted on a source with committed_amount_cents greater than zero"
  - id: ERR_NO_ASSESSMENT_DELTA
    http: 409
    condition: "Amend attempted when recomputation yields the same benefit_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================

roles:
  - name: GradSchoolAdmin
    description: "Graduate school central office: owns term/calendar/policy configuration, appointment approval and activation, payroll scheduling and disbursement, termination, effort-cap overrides and tuition-benefit taxation."
    identity: opaque
    exclusive_operations:
      - "POST /academic-terms"
      - "POST /academic-terms/{id}/open"
      - "POST /academic-terms/{id}/lock-payroll"
      - "POST /academic-terms/{id}/close"
      - "POST /departments"
      - "POST /stipend-policies"
      - "POST /pay-periods"
      - "POST /students"
      - "POST /students/{id}/effort-cap-override"
      - "POST /appointments/{id}/return"
      - "POST /appointments/{id}/approve"
      - "POST /appointments/{id}/activate"
      - "POST /appointments/{id}/schedule-payroll"
      - "POST /appointments/{id}/terminate"
      - "POST /appointments/{id}/suspend-pay"
      - "POST /appointments/{id}/resume-pay"
      - "POST /stipend-disbursements/{id}/pay"
      - "POST /stipend-disbursements/{id}/reverse"
      - "POST /tax-assessments"
      - "POST /tax-assessments/{id}/finalize"
      - "POST /tax-assessments/{id}/amend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /funding-sources (with GrantAccountant)"
      - "PATCH /students/{id}/academic-progress (with FacultySupervisor)"
      - "POST /renewal-decisions/{id}/certify-progress (with FacultySupervisor)"
      - "POST /renewal-decisions/{id}/issue-notice (with DepartmentAdmin)"
      - "all GET reads except none"

  - name: DepartmentAdmin
    description: "Departmental appointment administrator: drafts appointments and funding plans, submits them for review, and opens renewal reviews. Cannot approve its own work."
    identity: opaque
    exclusive_operations:
      - "POST /appointments"
      - "POST /appointments/{id}/submit"
      - "POST /renewal-decisions"
    shared_operations:
      - "PUT /appointments/{id}/funding-plan (with GrantAccountant)"
      - "POST /renewal-decisions/{id}/issue-notice (with GradSchoolAdmin)"
      - "GET reads of terms, departments, policies, pay periods, students, funding sources, appointments, allocations, disbursements, renewal decisions, tax assessments"

  - name: GrantAccountant
    description: "Sponsored-programs accountant: owns funding source lifecycle, commits funding plans and releases encumbrances."
    identity: opaque
    exclusive_operations:
      - "POST /funding-sources/{id}/suspend"
      - "POST /funding-sources/{id}/reinstate"
      - "POST /funding-sources/{id}/close"
      - "POST /appointments/{id}/verify-funding"
      - "POST /funding-allocations/{id}/release"
    shared_operations:
      - "POST /funding-sources (with GradSchoolAdmin)"
      - "PUT /appointments/{id}/funding-plan (with DepartmentAdmin)"
      - "GET reads of terms, departments, policies, pay periods, students, funding sources, appointments, allocations, disbursements"

  - name: FacultySupervisor
    description: "Supervising faculty: records academic progress and certifies satisfactory progress for renewal reviews. May not issue the notice it certified."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "PATCH /students/{id}/academic-progress (with GradSchoolAdmin)"
      - "POST /renewal-decisions/{id}/certify-progress (with GradSchoolAdmin)"
      - "GET reads of terms, departments, policies, pay periods, students, appointments, renewal decisions"

  - name: StudentUser
    description: "The appointee. X-User-ID equals the GraduateStudent.id; may read only its own records and acknowledge its own notices."
    identity: "entity_backed:GraduateStudent"
    exclusive_operations:
      - "POST /renewal-decisions/{id}/acknowledge"
    shared_operations:
      - "GET /students/{id} (own row only)"
      - "GET /appointments and GET /appointments/{id} (own rows only)"
      - "GET /renewal-decisions and GET /renewal-decisions/{id} (own rows only)"
      - "GET /tax-assessments and GET /tax-assessments/{id} (own rows only)"
