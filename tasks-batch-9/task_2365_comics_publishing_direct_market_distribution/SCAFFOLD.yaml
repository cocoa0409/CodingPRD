      - "creates the statement in status DRAFT"
      - "computes lines, gross_royalty_cents, recoupment_applied_cents and payable_cents by royalty_accrual (which calls royalty_pool_split per channel)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TITLE_NOT_FOUND, ERR_CREATOR_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DUPLICATE_STATEMENT_PERIOD, ERR_NO_ASSIGNMENT_FOR_CREATOR]
  - method: GET
    path: "/comics/royalty-statements"
    purpose: "List statements, filterable by title and creator (reverse lookup for RoyaltyStatement.title_id and RoyaltyStatement.creator_id)."
    roles: [EditorInChief, RoyaltyAccountant, Creator]
    input: ["title_id?", "creator_id?", "period?", "basis?", "status?", "limit?", "offset?"]
    output: RoyaltyStatement[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: GET
    path: "/comics/royalty-statements/{id}"
    purpose: "Read one statement with its per-channel lines."
    roles: [EditorInChief, RoyaltyAccountant, Creator]
    input: []
    output: RoyaltyStatement
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STATEMENT_NOT_FOUND]
  - method: POST
    path: "/comics/royalty-statements/{id}/issue"
    purpose: "Issue the statement to the creator, posting it to the title and advance ledgers."
    roles: [RoyaltyAccountant]
    input: []
    output: RoyaltyStatement
    side_effects:
      - "statement.status DRAFT -> ISSUED and issued_by_user_id = X-User-ID"
      - "title.royalty_accrued_cents and assignment.unrecouped_advance_cents recomputed by title_royalty_ledger"
      - "increments RoyaltyStatement.version, Title.version and CreativeAssignment.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STATEMENT_NOT_FOUND, ERR_INVALID_STATE]
  - method: POST
    path: "/comics/royalty-statements/{id}/pay"
    purpose: "Pay an issued statement; the payer must not be the accountant who issued it."
    roles: [EditorInChief, RoyaltyAccountant]
    input: ["payment_reference"]
    output: RoyaltyStatement
    side_effects: ["statement.status ISSUED -> PAID with paid_by_user_id = X-User-ID", "increments RoyaltyStatement.version"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STATEMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_ZERO_PAYABLE_STATEMENT]
  - method: POST
    path: "/comics/royalty-statements/{id}/reverse"
    purpose: "Reverse an issued statement, exactly unwinding its ledger and advance-recoupment effects."
    roles: [RoyaltyAccountant]
    input: ["reason"]
    output: RoyaltyStatement
    side_effects:
      - "statement.status ISSUED -> REVERSED with reversal_reason"
      - "title.royalty_accrued_cents and assignment.unrecouped_advance_cents recomputed by title_royalty_ledger (restoring the pre-issue values exactly)"
      - "increments RoyaltyStatement.version, Title.version and CreativeAssignment.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_STATEMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_STATEMENT_ALREADY_PAID]

errors:
  - code: ERR_UNAUTHENTICATED
    http_status: 401
    when: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - code: ERR_UNAUTHORIZED
    http_status: 403
    when: "the acting role is not listed on the endpoint"
  - code: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    when: "an entity-backed identity acts on a resource it does not own (Creator on another creator's assignment or stage, Retailer on another retailer's order)"
  - code: ERR_INVALID_REQUEST
    http_status: 400
    when: "missing or malformed field, illegal enum member, out-of-range integer, malformed date or YYYY-MM period, inverted date pair, net receipts above gross receipts, or bad pagination parameters"
  - code: ERR_CREATOR_NOT_FOUND
    http_status: 404
    when: "creator id in the path or body does not exist"
  - code: ERR_TITLE_NOT_FOUND
    http_status: 404
    when: "title id in the path or body does not exist"
  - code: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    when: "creative assignment id in the path or body does not exist"
  - code: ERR_ISSUE_NOT_FOUND
    http_status: 404
    when: "issue id in the path or body does not exist"
  - code: ERR_STAGE_NOT_FOUND
    http_status: 404
    when: "production stage id in the path does not exist"
  - code: ERR_CATALOG_NOT_FOUND
    http_status: 404
    when: "catalog id in the path does not exist"
  - code: ERR_SOLICITATION_NOT_FOUND
    http_status: 404
    when: "solicitation id in the path does not exist"
  - code: ERR_VARIANT_COVER_NOT_FOUND
    http_status: 404
    when: "a variant_cover_ids member does not exist or belongs to a different issue"
  - code: ERR_RETAILER_NOT_FOUND
    http_status: 404
    when: "retailer id in the path or body does not exist"
  - code: ERR_ORDER_NOT_FOUND
    http_status: 404
    when: "retailer order id in the path does not exist"
  - code: ERR_PRINT_RUN_NOT_FOUND
    http_status: 404
    when: "print run id in the path does not exist"
  - code: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    when: "royalty statement id in the path does not exist"
  - code: ERR_STALE_TITLE_VERSION
    http_status: 412
    when: "expected_title_version does not equal the current Title.version on POST /comics/titles/{id}/creative-assignments"
  - code: ERR_INVALID_STATE
    http_status: 409
    when: "the requested transition does not exist from the resource's current state, including terminal-state lockdown and a repeated trigger"
  - code: ERR_STALE_ISSUE_VERSION
    http_status: 412
    when: "expected_issue_version does not equal the current Issue.version on POST /comics/issues/{id}/print-runs"
  - code: ERR_RETURNS_NOT_PERMITTED
    http_status: 409
    when: "cancellation attempted on an order that has already shipped, which direct-market non-returnable terms forbid"
  - code: ERR_STATEMENT_ALREADY_PAID
    http_status: 409
    when: "reversal attempted on a statement that has already been paid"
  - code: ERR_TITLE_NOT_GREENLIT
    http_status: 409
    when: "assignment or issue creation attempted while title.status is not IN {GREENLIT, IN_PRODUCTION, PUBLISHING}"
  - code: ERR_ASSIGNMENT_NOT_ACCEPTED
    http_status: 409
    when: "stage start attempted while the referenced assignment is not IN {ACCEPTED, ACTIVE}"
  - code: ERR_CATALOG_NOT_LOCKED
    http_status: 409
    when: "solicitation acceptance attempted while the catalog is not LOCKED"
  - code: ERR_ISSUE_NOT_SOLICITED
    http_status: 409
    when: "order submission attempted while the issue is neither SOLICITED (first order) nor ON_SALE (reorder)"
  - code: ERR_RETAILER_NOT_ACTIVE
    http_status: 409
    when: "order submission or invoicing attempted for a retailer whose status is not ACTIVE"
  - code: ERR_NOT_CAMERA_READY
    http_status: 409
    when: "print completion or release attempted while issue.production_status != CAMERA_READY"
  - code: ERR_PRINT_NOT_COMPLETE
    http_status: 409
    when: "shipping attempted while issue.printed_units < issue.total_ordered_units"
  - code: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    when: "the X-User-ID paying a royalty statement equals statement.issued_by_user_id"
  - code: ERR_NON_RETURNABLE_ACK_REQUIRED
    http_status: 409
    when: "order submission or invoicing attempted for a retailer whose non_returnable_ack is false"
  - code: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    when: "repropose attempted when negotiation_round has already reached MAX_NEGOTIATION_ROUNDS (3)"
  - code: ERR_SOLICITATION_WINDOW_CLOSED
    http_status: 409
    when: "solicitation submission attempted after catalog.submission_deadline"
  - code: ERR_CATALOG_DEADLINE_NOT_PASSED
    http_status: 409
    when: "catalog lock attempted while the logical clock is at or before catalog.submission_deadline"
  - code: ERR_FOC_NOT_REACHED
    http_status: 409
    when: "FOC lock attempted before issue.foc_date"
  - code: ERR_FOC_ALREADY_PASSED
    http_status: 409
    when: "order adjustment attempted at or after issue.foc_date"
  - code: ERR_ON_SALE_DATE_NOT_REACHED
    http_status: 409
    when: "release attempted before issue.target_on_sale_date"
  - code: ERR_DIGITAL_EMBARGO_VIOLATION
    http_status: 422
    when: "a DIGITAL release window is scheduled earlier than issue.target_on_sale_date + 30 calendar days"
  - code: ERR_CANNIBALIZATION_WINDOW_CONFLICT
    http_status: 409
    when: "a COLLECTED release window falls on or before the title's last on-sale date + 90 calendar days"
  - code: ERR_CREATOR_DOUBLE_BOOKED
    http_status: 409
    when: "the new assignment's half-open booking interval overlaps an existing open booking of the same creator"
  - code: ERR_ON_SALE_CADENCE_CONFLICT
    http_status: 409
    when: "the new issue's target_on_sale_date is fewer than 21 calendar days from a sibling issue's target_on_sale_date"
  - code: ERR_COLLECTED_EDITION_CONFLICT
    http_status: 409
    when: "a DEMAND_FORECAST printing is planned while a COLLECTED release window falls within the next 60 calendar days"
  - code: ERR_DUPLICATE_ISSUE_NUMBER
    http_status: 409
    when: "issue_number already exists for the title"
  - code: ERR_DUPLICATE_VARIANT_CODE
    http_status: 409
    when: "cover code already exists for the issue"
  - code: ERR_DUPLICATE_SOLICITATION
    http_status: 409
    when: "the issue already has a DRAFT, SUBMITTED or ACCEPTED solicitation in this catalog"
  - code: ERR_DUPLICATE_STATEMENT_PERIOD
    http_status: 409
    when: "a DRAFT, ISSUED or PAID statement already exists for the same title, creator, period and basis"
  - code: ERR_CATALOG_SLOTS_EXHAUSTED
    http_status: 409
    when: "solicitation acceptance attempted when catalog.accepted_slot_count already equals catalog.max_slots"
  - code: ERR_CRAFT_NOT_SUPPORTED
    http_status: 422
    when: "assignment craft is not a member of the creator's crafts list"
  - code: ERR_CRAFT_MISMATCH
    http_status: 422
    when: "stage craft differs from the referenced assignment's craft"
  - code: ERR_TITLE_SCOPE_MISMATCH
    http_status: 422
    when: "the referenced assignment belongs to a different title than the issue"
  - code: ERR_VARIANT_RATIO_INVALID
    http_status: 422
    when: "incentive_ratio is absent or not in {10, 25, 50, 100} on a RATIO_INCENTIVE cover, or present on any other cover kind"
  - code: ERR_VARIANT_NOT_AVAILABLE
    http_status: 422
    when: "exclusive_variant_qty > 0 while the issue has no RETAILER_EXCLUSIVE cover"
  - code: ERR_NO_QUALIFYING_ORDERS
    http_status: 409
    when: "FOC lock finds no SUBMITTED order, or an ORDER_DRIVEN printing finds an empty locked order book"
  - code: ERR_NO_ACCEPTED_SOLICITATIONS
    http_status: 409
    when: "catalog publish attempted with zero ACCEPTED solicitations"
  - code: ERR_STANDARD_COVER_REQUIRED
    http_status: 409
    when: "solicitation submission attempted while the issue has no STANDARD variant cover"
  - code: ERR_REQUIRED_CRAFT_STAGES_MISSING
    http_status: 409
    when: "print run creation (or completion) attempted while the issue has no ProductionStage row for one of REQUIRED_CRAFTS — e.g. an issue that reached FOC lock carrying only a SCRIPT stage"
  - code: ERR_NO_ASSIGNMENT_FOR_CREATOR
    http_status: 409
    when: "statement creation finds no ACCEPTED, ACTIVE or COMPLETED assignment for that creator on that title"
  - code: ERR_ROYALTY_SHARE_POOL_EXCEEDED
    http_status: 422
    when: "accepting the assignment would push title.committed_share_bps above 10000 - title.cover_participation_bps"
  - code: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    when: "the retailer's open balance already equals or exceeds its credit limit at submission (strict headroom required), or open balance plus the computed invoice total would exceed it at invoicing (landing exactly on the limit is allowed)"
  - code: ERR_ZERO_PAYABLE_STATEMENT
    http_status: 422
    when: "payment attempted on a statement whose payable_cents is 0 because the advance absorbed the whole accrual"

roles:
  - role: EditorInChief
    identity: opaque
    exclusive_operations:
      - "POST /comics/titles"
      - "POST /comics/titles/{id}/greenlight"
      - "POST /comics/titles/{id}/cancel"
      - "POST /comics/titles/{id}/creative-assignments"
      - "POST /comics/creative-assignments/{id}/repropose"
      - "POST /comics/creative-assignments/{id}/terminate"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /comics/creators"
      - "POST /comics/royalty-statements/{id}/pay"
      - "all GET endpoints except GET /comics/production-stages/{id} sibling-scoped reads already listed"
  - role: ManagingEditor
    identity: opaque
    exclusive_operations:
      - "POST /comics/titles/{id}/issues"
      - "POST /comics/issues/{id}/production-stages"
      - "POST /comics/issues/{id}/print-runs"
      - "POST /comics/print-runs/{id}/complete"
      - "POST /comics/print-runs/{id}/cancel"
      - "POST /comics/production-stages/{id}/kick-back"
      - "POST /comics/production-stages/{id}/approve"
      - "POST /comics/catalogs/{id}/solicitations"
      - "POST /comics/solicitations/{id}/submit"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /comics/creators"
      - "editorial GET endpoints (creators, titles, issues, stages, catalogs, solicitations, print runs)"
  - role: SalesDirector
    identity: opaque
    exclusive_operations:
      - "POST /comics/catalogs"
      - "POST /comics/catalogs/{id}/lock"
      - "POST /comics/catalogs/{id}/publish"
      - "POST /comics/solicitations/{id}/accept"
      - "POST /comics/solicitations/{id}/withdraw"
      - "POST /comics/issues/{id}/variant-covers"
      - "POST /comics/issues/{id}/foc-lock"
      - "POST /comics/issues/{id}/release"
      - "POST /comics/issues/{id}/release-windows"
      - "POST /comics/retailers"
      - "POST /comics/retailers/{id}/suspend"
      - "POST /comics/retailers/{id}/reinstate"
      - "POST /comics/retailer-orders/{id}/invoice"
      - "POST /comics/retailer-orders/{id}/ship"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /comics/retailer-orders/{id}/cancel"
      - "commercial GET endpoints (titles, issues, covers, catalogs, solicitations, retailers, orders, print runs, release windows, revenue events)"
  - role: RoyaltyAccountant
    identity: opaque
    exclusive_operations:
      - "POST /comics/revenue-events"
      - "POST /comics/royalty-statements"
      - "POST /comics/royalty-statements/{id}/issue"
      - "POST /comics/royalty-statements/{id}/reverse"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /comics/royalty-statements/{id}/pay"
      - "financial GET endpoints (creators, titles, assignments, issues, retailers, orders, statements, revenue events, release windows)"
    note: "Segregation of duties: the accountant user who issued a statement can never be the user who pays it, so payment requires a second RoyaltyAccountant user or the EditorInChief."
  - role: Creator
    identity: "entity_backed:Creator"
    exclusive_operations:
      - "POST /comics/creative-assignments/{id}/counter"
      - "POST /comics/creative-assignments/{id}/accept"
      - "POST /comics/production-stages/{id}/start"
      - "POST /comics/production-stages/{id}/deliver"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /comics/creators/{id}, GET /comics/creators/{id}/creative-assignments, GET /comics/creative-assignments/{id}, GET /comics/creative-assignments/{id}/production-stages, GET /comics/production-stages/{id}, GET /comics/issues/{id}/production-stages, GET /comics/titles/{id}, GET /comics/issues/{id}, GET /comics/royalty-statements, GET /comics/royalty-statements/{id}"
    note: "X-User-ID is the Creator.id; ownership is enforced through assignment.creator_id."
  - role: Retailer
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /comics/retailer-orders"
      - "POST /comics/retailer-orders/{id}/submit"
      - "POST /comics/retailer-orders/{id}/adjust"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "POST /comics/retailer-orders/{id}/cancel"
      - "GET /comics/retailers/{id}, GET /comics/retailer-orders, GET /comics/retailer-orders/{id}, GET /comics/issues/{id}, GET /comics/issues/{id}/variant-covers"
    note: "X-User-ID is the Retailer.id; POST /comics/retailer-orders requires body retailer_id == X-User-ID."
