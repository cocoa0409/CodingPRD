      - name: complaint_quota_window_inclusive_bounds
        claim_type: input_set_filtering
        grounds:
          - calculations.complaint_quota_rollup
          - entities.Route.fields.substantiated_complaints_30d
        distinguishing_aspect: |
          The rolling quota window [now - 30 days, now] is inclusive at both
          ends: a substantiated complaint observed exactly 30 days ago counts,
          one observed one minute earlier does not — route counter reads 1.
        test_recipe:
          setup:
            - "Base defaults (window 30d, threshold 3); route RC zones [VILLAGE]; flight F dep 2026-07-01T14:00 COMPLETED"
            - "Clock advanced to 2026-08-03T00:00:00Z; C_in observed 2026-07-04T00:00:00Z (exactly now - 30d), C_out observed 2026-07-03T23:59:00Z; both manually linked to F, reviewed, substantiated"
