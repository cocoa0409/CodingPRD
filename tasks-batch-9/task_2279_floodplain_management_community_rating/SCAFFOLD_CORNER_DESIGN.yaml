      - name: superseding_determination_case_withdraws_and_reverts_the_first
        claim_type: conditional_action
        grounds:
          - endpoints."POST /floodplain/determination-cases"
          - state_machines.DeterminationCase.DETERMINED_to_WITHDRAWN
        distinguishing_aspect: |
          Opening a second case is a conditional supersession: the DETERMINED first case moves
          to WITHDRAWN and, because it had already stamped the structure, substantial_status
          falls back to NONE while the fresh case sits at OPEN with no outcome — the structure
          is deliberately left un-flagged in between the two determinations.
        test_recipe:
          setup:
            - "Canonical base fixture; IMPROVEMENT record of 105000 on 2026-06-01 (52.50%)."
            - "First case opened with method CUMULATIVE and determined SUBSTANTIAL."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
