        grounds:
          - calculations.listing_market_valuation
          - entities.License.fields.last_transfer_price_cents
          - endpoints[GET /listings/{listing_id}/valuation-preview]
        distinguishing_aspect: "The comparable set is exactly the same-county licences carrying a last_transfer_price_cents: a 100000000-cent priced licence in another county and an unpriced same-county licence are both excluded, so comp_count is 2 and the median is 18500000."
        test_recipe:
          setup:
            - "County SON with quota_licenses_total 100 and county NAP with quota_licenses_total 100."
            - "In SON: two priced CLASS_47_ONSALE_GENERAL comps (16000000 and 21000000), one unpriced CLASS_47_ONSALE_GENERAL licence, and the unpriced subject licence with annual_gross_receipts_cents 120000000."
            - "In NAP: one priced licence at 100000000 that must never enter the SON comparable set."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_son: $.data.id }
