            - "trigger 2: HTTP 200 with arv_cents == 28000000, appraisal_date == '2026-09-15', as_is_value_cents still 21000000, purchase_price_cents still 20000000, valuation_revision_count == 1, version == 2, updated_at > created_at"
            - "trigger 3: the follow-up read is identical to the PATCH response - arv_cents == 28000000 and version == 2 - and does not bump the row again"
            - "the endpoint table declares no DELETE on any resource, so a Property (like every other row here) can only be superseded, never removed"
