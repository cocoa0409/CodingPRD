            - call: POST /funding-sources
              payload: { label: "General donations 2026", source_type: "INDIVIDUAL_DONATION", restriction_code: "UNRESTRICTED", total_cents: 2000000, admin_retention_allowed: true }
              as: LTRGAdmin
