            - call: "POST /marketplace/applications/${app_b_id}/interviews"
              payload: { starts_at: "2026-09-03T10:00:00Z", ends_at: "2026-09-03T11:00:00Z" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { iv_b_id: $.data.id }
            - call: "POST /marketplace/applications/${app_a_id}/offers"
              payload: { offered_hourly_rate_cents: 8500, start_date: "2026-09-15", expected_requisition_version: "${req1_v}" }
              as: Employer
