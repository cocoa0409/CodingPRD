            - "the persisted PosTransaction has status DECLINED and decline_reason_code INSUFFICIENT_SPLIT_TENDER"
            - "that row reads eligible_subtotal_cents 1000, ineligible_subtotal_cents 2000, tax_cents 165, ebt_tender_cents 0, other_tender_cents 0, split_tender_applied false"
            - "flagged_line_skus == [CIG-1]"
            - "GET /pos-transactions?store_id=${store_id}&status=DECLINED returns total_count == 1"

      - name: enforced_case_refuses_further_enforcement_and_further_review
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SanctionCase.terminal_states
          - validations.priority_9_state
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "ENFORCED is terminal: a repeated enforce and a late administrative-review request both return 409 ERR_INVALID_STATE, and the state gate (priority 9) beats the deadline gate (priority 12) so the review attempt does not surface ERR_ADMIN_REVIEW_WINDOW_CLOSED. Owner.permanent_disqualification_count stays 1, not 2."
        test_recipe:
          setup:
            - "A TRAFFICKING case carried all the way to ENFORCED: charge letter 2026-08-01 (reply due 2026-08-11), determination PERMANENT_DISQUALIFICATION at 2026-08-11 (admin review due 2026-08-21), finalize at 2026-08-21 (effective 2026-09-20), enforce at 2026-09-20."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - &k_inv_t
              call: "POST /investigations"
              payload: { store_id: "${store_id}", opened_reason: "TIP" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { inv_t_id: $.data.id }
            - &k_ev_buy
              call: "POST /investigations/${inv_t_id}/evidence"
              payload: { evidence_type: "UNDERCOVER_BUY", observed_at: "2026-07-20T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_ev_ebt
              call: "POST /investigations/${inv_t_id}/evidence"
              payload: { evidence_type: "EBT_ONLY_TRANSACTION_PATTERN", observed_at: "2026-07-25T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - &k_conclude_traffick
              call: "POST /investigations/${inv_t_id}/conclude"
              payload: { substantiated_violation: "TRAFFICKING" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-2"
            - &k_case_t
              call: "POST /sanction-cases"
              payload: { investigation_id: "${inv_t_id}", violation_type: "TRAFFICKING" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { case_t_id: $.data.id }
            - &k_charge_t
              call: "POST /sanction-cases/${case_t_id}/charge-letter"
              payload: { charge_summary: "Undercover purchase of cash for benefits plus an EBT-only redemption pattern." }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { case_t_v: $.data.version }
            - &k_clock_0811
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &k_det_pdq
              call: "POST /sanction-cases/${case_t_id}/determination"
              payload: { sanction_type: "PERMANENT_DISQUALIFICATION" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &k_clock_0821
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-21T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &k_finalize_t
              call: "POST /sanction-cases/${case_t_id}/finalize"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &k_clock_0920
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &k_enforce_t
              call: "POST /sanction-cases/${case_t_id}/enforce"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /sanction-cases/${case_t_id}/enforce"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { reenforce_error_id: $.data.error_id }
            - call: "POST /sanction-cases/${case_t_id}/administrative-review"
              payload: { grounds_text: "Requesting review after enforcement." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { late_review_error_id: $.data.error_id }
          assert:
            - "both attempts return 409 with ${reenforce_error_id} == ERR_INVALID_STATE and ${late_review_error_id} == ERR_INVALID_STATE"
            - "the second attempt does NOT return ERR_ADMIN_REVIEW_WINDOW_CLOSED (state precedes the deadline gate)"
            - "SanctionCase.${case_t_id}.status == ENFORCED and enforced_at == 2026-09-20T00:00:00Z"
            - "SanctionCase.${case_t_id}.admin_review_requested_at == null"
            - "Store.${store_id}.authorization_status == DISQUALIFIED and permanently_disqualified == true"
            - "Owner.${owner_id}.permanent_disqualification_count == 1 and sanction_flag == PERMANENTLY_DISQUALIFIED and status == ACTIVE"

      - name: withdrawn_application_refuses_submit_documents_and_decision
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Application.terminal_states
          - state_machines.Application.any_to_WITHDRAWN.side_effects
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Withdrawing from PENDING_VISIT cancels the SCHEDULED visit and releases the inspector's 120 minutes; afterwards submit, documents and decision all return 409 ERR_INVALID_STATE and the store is never authorized."
        test_recipe:
          setup:
            - "An application in PENDING_VISIT with one SCHEDULED visit, then withdrawn."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - call: "POST /applications/${app_id}/withdraw"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { wd_submit_error_id: $.data.error_id }
            - call: "POST /applications/${app_id}/documents"
              payload: { reported_inventory_lines: *k_inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { wd_docs_error_id: $.data.error_id }
            - call: "POST /applications/${app_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { wd_decision_error_id: $.data.error_id }
          assert:
            - "Application.${app_id}.status == WITHDRAWN and decision_reason_code == WITHDRAWN_BY_APPLICANT"
            - "StoreVisit.${visit_id}.status == CANCELLED"
            - "Inspector.${insp_id}.committed_minutes == 0"
            - "all three attempts return 409 with ${wd_submit_error_id} == ERR_INVALID_STATE, ${wd_docs_error_id} == ERR_INVALID_STATE and ${wd_decision_error_id} == ERR_INVALID_STATE"
            - "Store.${store_id}.authorization_status == NOT_AUTHORIZED and fns_number == null"

      - name: repeating_submit_and_close_does_not_double_apply_the_transition
        claim_type: Idempotency
        grounds:
          - validations.priority_9_state
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.RedemptionPeriod.OPEN_to_CLOSED
        distinguishing_aspect: "Neither action endpoint is idempotent-by-replay: the second submit and the second close both return 409 ERR_INVALID_STATE rather than 200, and neither re-stamps submitted_at/closed_at nor re-opens a second investigation."
        test_recipe:
          setup:
            - "A SUBMITTED application, and a CLOSED redemption period on the same store whose window has already elapsed."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_p1
            - *k_p1_import
            - *k_p1_close
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { resubmit_error_id: $.data.error_id }
            - call: "POST /redemption-periods/${p1_id}/close"
              payload: {}
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { reclose_error_id: $.data.error_id }
          assert:
            - "both return 409 with ${resubmit_error_id} == ERR_INVALID_STATE and ${reclose_error_id} == ERR_INVALID_STATE"
            - "Application.${app_id}.status == SUBMITTED and submitted_at == 2026-08-01T00:00:00Z"
            - "RedemptionPeriod.${p1_id}.status == CLOSED and closed_at == 2026-08-01T00:00:00Z"
            - "RedemptionPeriod.${p1_id}.flag_level == FLAG_L0 and anomaly_score == 0"
            - "GET /investigations?store_id=${store_id} returns total_count == 0"

      - name: application_deficiency_loop_reenters_pending_documents_twice_then_denies
        claim_type: Valid Transition
        grounds:
          - state_machines.Application.PENDING_VISIT_to_PENDING_DOCUMENTS
          - state_machines.Application.PENDING_VISIT_to_DENIED
        excluded_because:
          difficulty_instance: application_deficiency_cycle_loops_twice_then_third_failure_denies
          rationale: "The cyclic PENDING_DOCUMENTS re-entry, the deficiency_cycle_count 1 -> 2 -> 3 progression and the third-failure DENIED edge with its DEFICIENCY_CYCLES_EXHAUSTED reason are asserted end to end by that difficulty instance; a breadth probe would only replay its first lap."

      - name: store_authorization_and_sanction_dimensions_advance_independently
        claim_type: Valid Transition
        grounds:
          - state_machines.Store.authorization_status
          - state_machines.Store.sanction_status
        excluded_because:
          difficulty_instance: store_parallel_dimensions_move_independently_and_pair_gates_pos_sales
          rationale: "That instance already drives sanction_status NONE -> UNDER_INVESTIGATION -> CHARGED -> SANCTION_FINAL while authorization_status holds at AUTHORIZED, and then proves the pair - not either dimension alone - gates a POS sale."

      - name: enforcement_recalls_terminals_and_rolls_up_to_the_owner
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SanctionCase.SANCTION_FINAL_to_ENFORCED.side_effects
          - state_machines.TerminalDeployment.ACTIVE_to_RECALL_PENDING
        excluded_because:
          difficulty_instance: enforcement_cascade_case_store_deployment_terminal_depot_owner_five_levels
          rationale: "The five-level cascade from enforce down to the depot counters and back up to Owner.sanction_flag is asserted level by level there; repeating it as a breadth probe adds no distinct claim."

      - name: closing_a_flag_l3_period_opens_an_investigation_and_releases_reservations
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RedemptionPeriod.OPEN_to_CLOSED.side_effects
          - state_machines.Store.sanction_status.NONE_to_UNDER_INVESTIGATION
        excluded_because:
          difficulty_instance: period_close_cascade_flag_investigation_sanction_status_and_reserved_release
          rationale: "That instance asserts the whole close-time chain - flag_level FLAG_L3, the auto-opened investigation with opened_by_user_id 'system' and trigger_period_id, Store.sanction_status, and the RESERVED -> RELEASED deployment release with its depot counters."

      - name: terminal_status_follows_its_deployment_through_reserve_activate_return
        claim_type: Side Effect Execution
        grounds:
          - entities.EbtTerminal.fields.status
          - calculations.depot_unit_ledger
        excluded_because:
          difficulty_instance: depot_unit_conservation_reserve_activate_return_round_trip
          rationale: "EbtTerminal has no §1.2 dimension of its own; its IN_STOCK -> RESERVED -> DEPLOYED -> IN_STOCK walk and the depot conservation identity at every step are covered by that compensating-invariant instance."

  - section: calculations
    instances:

      - name: depth_of_stock_passes_at_exactly_the_convenience_floor_of_twenty_four_feet
        claim_type: Constants Applied
        grounds:
          - calculations.depth_of_stock_assessment
          - calculations.depth_of_stock_assessment.constants.MIN_SHELF_LINEAR_FEET
        distinguishing_aspect: "MIN_SHELF_LINEAR_FEET[CONVENIENCE] is 24 and the comparison is inclusive, so 24 observed feet passes; the discrepancy is floor(6 * 10000 / 30) == 2000 bps which is under the 2500 flag, so the application advances to UNDER_REVIEW rather than PENDING_DOCUMENTS."
        test_recipe:
          setup:
            - "A PENDING_VISIT CRITERION_A application on the CONVENIENCE store (declared 30 staple shelf feet) with an IN_PROGRESS visit."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
          trigger:
            - call: "POST /store-visits/${visit_id}/findings"
              payload: { observed_inventory_lines: *k_inv_pass, observed_staple_shelf_linear_feet: 24 }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "the response is 200 and StoreVisit.${visit_id}.status == FINDINGS_SUBMITTED"
            - "StoreVisit.${visit_id}.depth_of_stock_pass == true"
            - "StoreVisit.${visit_id}.shelf_discrepancy_bps == 2000"
            - "StoreVisit.${visit_id}.shelf_discrepancy_flag == false"
            - "StoreVisit.${visit_id}.verified_criterion_a_pass == true"
            - "Application.${app_id}.status == UNDER_REVIEW"
            - "Application.${app_id}.deficiency_cycle_count == 0"
            - "Inspector.${insp_id}.committed_minutes == 0 (findings release the commitment)"

      - name: shelf_discrepancy_above_twenty_five_hundred_bps_holds_the_application
        claim_type: Correct Result
        grounds:
          - calculations.depth_of_stock_assessment.constants.SHELF_DISCREPANCY_FLAG_BPS
          - state_machines.Application.PENDING_VISIT_to_PENDING_DOCUMENTS
        distinguishing_aspect: "60 observed feet against 30 declared is 10000 bps of discrepancy - the store is BETTER stocked than claimed and still fails, because the flag is on absolute deviation, not shortfall. Depth passes and the staple criterion passes, yet the application is held with hold_reason_code SHELF_DISCREPANCY."
        test_recipe:
          setup:
            - "A PENDING_VISIT CRITERION_A application on the CONVENIENCE store with an IN_PROGRESS visit."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
          trigger:
            - call: "POST /store-visits/${visit_id}/findings"
              payload: { observed_inventory_lines: *k_inv_pass, observed_staple_shelf_linear_feet: 60 }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "StoreVisit.${visit_id}.shelf_discrepancy_bps == 10000 and shelf_discrepancy_flag == true"
            - "StoreVisit.${visit_id}.depth_of_stock_pass == true and verified_criterion_a_pass == true"
            - "Application.${app_id}.status == PENDING_DOCUMENTS"
            - "Application.${app_id}.hold_reason_code == SHELF_DISCREPANCY"
            - "Application.${app_id}.deficiency_cycle_count == 1"
            - "Store.${store_id}.authorization_status == NOT_AUTHORIZED"

      - name: shelf_discrepancy_bps_floors_rather_than_rounds
        claim_type: Precision
        grounds:
          - calculations.depth_of_stock_assessment
        distinguishing_aspect: "37 observed against 30 declared is 7 / 30 == 23.333%: floor gives 2333 bps while round-half-up would give 2333 as well, but 23 observed gives 7/30 the other direction and 22 gives 8/30 == 26.66% -> 2666, so the pair 37 and 22 pins that the numerator is an absolute difference and the result is floored, never rounded up to 2334."
        test_recipe:
          setup:
            - "Two independent applications on two stores of the same owner, each with its own IN_PROGRESS visit, so both findings can be measured against the same declared 30 feet."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_store_b
            - *k_app_b
            - *k_submit_b
            - *k_visit_b
            - *k_clock_0401
            - *k_start_b
          trigger:
            - call: "POST /store-visits/${visit_id}/findings"
              payload: { observed_inventory_lines: *k_inv_pass, observed_staple_shelf_linear_feet: 37 }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /store-visits/${visit_b_id}/findings"
              payload: { observed_inventory_lines: *k_inv_pass, observed_staple_shelf_linear_feet: 22 }
              as: Inspector
              as_user_id: "${insp_id}"
          assert:
            - "StoreVisit.${visit_id}.shelf_discrepancy_bps == 2333 and shelf_discrepancy_flag == false"
            - "StoreVisit.${visit_b_id}.shelf_discrepancy_bps == 2666 and shelf_discrepancy_flag == true"
            - "StoreVisit.${visit_b_id}.depth_of_stock_pass == false (22 < the 24 ft CONVENIENCE floor)"
            - "Application.${app_id}.status == UNDER_REVIEW"
            - "Application.${app_b_id}.status == PENDING_DOCUMENTS and hold_reason_code == SHELF_DISCREPANCY"

