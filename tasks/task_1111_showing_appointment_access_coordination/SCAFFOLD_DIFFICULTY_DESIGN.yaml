          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L"
            - "R1 2026-05-01T10:00-10:30 confirmed, cancelled at t0 (10h < 24h) -> LATE_CANCEL strike ACTIVE"
