        claim_type: deny
        grounds: ["validations[priority 1]", "errors[ERR_UNAUTHENTICATED]", "roles[IntakeSpecialist]"]
        distinguishing_aspect: "Priority 1 rejects three distinct header shapes with 401 ERR_UNAUTHENTICATED - no X-User-Role at all, an X-User-Role that is not one of the eight declared roles, and a declared role with no X-User-ID - while the same body with IntakeSpecialist plus a user id is created. An implementation that only checks the role name accepts the third shape, and one that treats an unknown role as a permission problem returns 403 instead of 401."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-09-01T00:00:00Z; no other resource is needed because priority 1 precedes every other rule."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
