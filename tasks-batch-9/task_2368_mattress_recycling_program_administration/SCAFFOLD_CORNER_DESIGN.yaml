            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_id}/volume-reports"
              payload: { period_month: "2026-08", units_mattress: 320, units_foundation: 190 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Response: HTTP 409 with data.error_id == ERR_VOLUME_REPORT_NOT_SUBMITTED"
            - "VolumeReport.${vr_id}.status == ACCEPTED with accepted_at == 2026-08-01T00:00:00Z and credit_cents == 163328"
            - "StateProgram.${prog_wa_id}.site_credit_paid_cents == 163328 (not 326656)"
            - "StateProgram.${prog_wa_id}.reserve_balance_cents == 4836672"
            - "CollectionSite.${site_id}.units_on_hand == 510 and units_reported_total == 510"

      - name: deliver_before_pickup_confirm_is_an_invalid_transition
