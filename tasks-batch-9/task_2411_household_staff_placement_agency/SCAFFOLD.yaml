    roles: [AgencyPrincipal, PlacementConsultant, BillingAdministrator, ComplianceOfficer, Client]
    input: ["requisition_id?", "candidate_id?", "client_id?", "snapshot_fee_schedule_id?", "placement_status?", "billing_status?", "limit?", "offset?"]
