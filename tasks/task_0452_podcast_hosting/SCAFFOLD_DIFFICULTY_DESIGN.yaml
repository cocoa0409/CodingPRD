              as_user_id: "${pubSl}"
              captures: { epSl: $.data.id }
            - call: "POST /media-assets"
              payload: { episode_id: "${epSl}", source_filename: "sl.wav", source_duration_ms: 600000 }
              as: Publisher
              as_user_id: "${pubSl}"
              captures: { maSl: $.data.id }
            - call: "POST /media-assets/${maSl}/transcode-start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /media-assets/${maSl}/transcode-result"
              payload: { outcome: "SUCCESS", output_duration_ms: 600000 }
              as: PlatformAdmin
            - call: "POST /episodes/${epSl}/publish"
              payload: {}
              as: Publisher
              as_user_id: "${pubSl}"
            - call: "POST /advertisers"
              payload: { name: "AdvSl", billing_email: "asl@x.com" }
              as: PlatformAdmin
              captures: { advSl: $.data.id }
            - call: "POST /ad-campaigns"
              payload: { advertiser_id: "${advSl}", name: "cSlot", budget_cents: 1000000, bid_cpm_cents: 50000, targeting_category: "TECH", flight_start: "2026-01-01T00:00:00Z", flight_end: "2026-12-31T00:00:00Z" }
              as: Advertiser
              as_user_id: "${advSl}"
              captures: { cSlot: $.data.id }
            - call: "POST /ad-campaigns/${cSlot}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${advSl}"
              captures: { cSlotv: $.data.version }
            - call: "POST /ad-placements"
              payload: { campaign_id: "${cSlot}", episode_id: "${epSl}", position: "PRE_ROLL", ad_duration_ms: 30000, forecast_impressions: 5, expected_campaign_version: "${cSlotv}" }
              as: Advertiser
              as_user_id: "${advSl}"
              captures: { pSlot: $.data.id }
            - call: "POST /ad-placements/${pSlot}/insert"
              payload: {}
              as: Advertiser
              as_user_id: "${advSl}"
          trigger:
            - call: "POST /ad-placements/${pSlot}/cancel"
              payload: {}
              as: Advertiser
              as_user_id: "${advSl}"
          assert:
            - "AdPlacement.${pSlot}.status == CANCELLED"
            - "Episode.${epSl}.filled_slots == 0"
            - "Episode.${epSl}.available_slots == 2"
            - "Episode.${epSl}.fill_rate == 0.0"

  # ===========================================================================
  - rule_id: optimistic_concurrency
    instances:
      - name: placement_create_stale_campaign_version_rejected
        grounds:
          - concurrency_rules[placement-create-stale-campaign]
          - entities.AdCampaign.fields.version
          - errors[ERR_STALE_CAMPAIGN_VERSION]
        distinguishing_aspect: |
          OCC on AdCampaign.version: after one placement create bumps the campaign version, a second
          create still carrying the pre-bump expected_campaign_version is rejected with 412
          ERR_STALE_CAMPAIGN_VERSION.
        test_recipe:
          setup:
            - "ACTIVE TECH monetized show, PUBLISHED+READY episode total 3 PRE_ROLL+POST_ROLL"
            - "Campaign cOcc ACTIVE; client captured cOccv1 at activation"
            - "First placement create against cOccv1 succeeds and bumps campaign.version"
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "PubOcc", payout_email: "pocc@x.com" }
              as: PlatformAdmin
              captures: { pubOcc: $.data.id }
            - call: "POST /shows"
              payload: { publisher_id: "${pubOcc}", title: "ShowOcc", category: "TECH", monetization_enabled: true }
              as: Publisher
