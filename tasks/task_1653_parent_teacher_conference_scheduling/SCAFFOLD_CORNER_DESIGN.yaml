            - { call: "GET /conf/interpreter-requests/${r}", as: FrontOfficeStaff, captures: { r_status: $.data.status } }
            - { call: "GET /conf/waitlist-entries/${e2}", as: FrontOfficeStaff, captures: { e2_status: $.data.status } }
            - { call: "GET /conf/slots/${t1s0}", as: SchoolAdmin, captures: { slot_status: $.data.status } }
          assert:
            - "both students WITHDRAWN"
            - "booking CANCELLED with cancel_reason STUDENT_WITHDRAWN; slot t1s0 back to OPEN (window BOOKING_OPEN)"
            - "interpreter request CANCELLED"
            - "st2's WAITING entry WITHDRAWN"

  - section: calculations
    instances:
      - name: slot_grid_count_and_break_placement
        claim_type: correct_result
        grounds: [calculations.slot_grid_generation]
        distinguishing_aspect: "240-minute day with L=20 B=5 yields exactly 8 slots; the 4-slot break rule leaves a 20-minute gap between slot 3 (ends 16:35) and slot 4 (starts 16:55)."
        test_recipe:
          setup: ["window PUBLISHED; teacher T1 ELEMENTARY"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
          trigger:
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin, captures: { total: $.data.slots_total_count } }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0_start: "$.data[0].start_at", s3_end: "$.data[3].end_at", s4_start: "$.data[4].start_at", s7_end: "$.data[7].end_at" } }
          assert:
            - "slots_total_count == 8"
            - "slot[0].start_at == 2026-10-05T15:00:00Z and slot[3].end_at == 2026-10-05T16:35:00Z"
            - "slot[4].start_at == 2026-10-05T16:55:00Z (5 buffer + 15 break extra after every 4th slot)"
            - "slot[7].end_at == 2026-10-05T18:30:00Z and no slot would end past 19:00 (candidate 18:50+20 > 19:00 stops the loop)"

      - name: channel_allowed_derivation_and_teacher_skip
        claim_type: input_set_filtering
        grounds: [calculations.slot_grid_generation]
        distinguishing_aspect: "channel_allowed derives from teacher supports flags (in-only -> IN_PERSON, virtual-only -> VIRTUAL, both -> EITHER); a teacher supporting neither is skipped entirely (0 slots)."
        test_recipe:
          setup: ["SECONDARY window PUBLISHED; teachers: TIP (in only), TV (virtual only), TB (both), TN (neither)"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Sec", term_label: "2026-FALL", format: "SECONDARY", slot_length_minutes: 20, buffer_minutes: 0, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T16:20:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "TIP", email: "tip@x.edu", grade_band: "SECONDARY", subjects: [], supports_in_person: true, supports_virtual: false }, as: SchoolAdmin, captures: { tip: $.data.id } }
            - { call: "POST /conf/teachers", payload: { full_name: "TV", email: "tv@x.edu", grade_band: "SECONDARY", subjects: [], supports_in_person: false, supports_virtual: true }, as: SchoolAdmin, captures: { tv: $.data.id } }
            - { call: "POST /conf/teachers", payload: { full_name: "TB", email: "tb@x.edu", grade_band: "SECONDARY", subjects: [], supports_in_person: true, supports_virtual: true }, as: SchoolAdmin, captures: { tb: $.data.id } }
            - { call: "POST /conf/teachers", payload: { full_name: "TN", email: "tn@x.edu", grade_band: "SECONDARY", subjects: [], supports_in_person: false, supports_virtual: false }, as: SchoolAdmin, captures: { tn: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
          trigger:
            - { call: "GET /conf/teachers/${tip}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { ch_ip: "$.data[0].channel_allowed" } }
            - { call: "GET /conf/teachers/${tv}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { ch_v: "$.data[0].channel_allowed" } }
            - { call: "GET /conf/teachers/${tb}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { ch_b: "$.data[0].channel_allowed" } }
            - { call: "GET /conf/teachers/${tn}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin }
          assert:
            - "TIP slots (4) all channel_allowed == IN_PERSON; TV all VIRTUAL; TB all EITHER"
            - "TN has 0 slots (teacher with no supported channel is skipped at generation)"

      - name: waitlist_priority_score_computed_and_refreshed
        claim_type: correct_result
        grounds: [calculations.waitlist_priority_score]
        distinguishing_aspect: "score = 100 + 50 (required link) + 15 (1 sibling confirmed) = 165.00 at creation; after 50 waiting hours and a run-ops refresh it is 165 + 5*floor(50/24) = 175.00."
        test_recipe:
          setup: ["SECONDARY window BOOKING_OPEN; family F: stX linked to T1 with required_conference true, sibling stY holds a CONFIRMED booking with T2; entry created at clock 2026-09-10T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Sec", term_label: "2026-FALL", format: "SECONDARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "SECONDARY", subjects: ["math"], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/teachers", payload: { full_name: "T2", email: "t2@x.edu", grade_band: "SECONDARY", subjects: ["eng"], supports_in_person: true }, as: SchoolAdmin, captures: { t2: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/teachers/${t2}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { t2s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "X", grade_level: 9 }, as: FrontOfficeStaff, captures: { stX: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "Y", grade_level: 11 }, as: FrontOfficeStaff, captures: { stY: $.data.id } }
            - { call: "POST /conf/students/${stX}/teacher-links", payload: { teacher_id: "${t1}", required_conference: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${stY}/teacher-links", payload: { teacher_id: "${t2}" }, as: FrontOfficeStaff }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/bookings", payload: { slot_id: "${t2s0}", student_id: "${stY}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}" }
          trigger:
            - { call: "POST /conf/waitlist-entries", payload: { window_id: "${w}", student_id: "${stX}", teacher_id: "${t1}", channel_pref: "EITHER" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { entry: $.data.id, score_create: $.data.priority_score } }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T02:00:00Z" }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/run-ops", payload: {}, as: SchoolAdmin }
            - { call: "GET /conf/waitlist-entries/${entry}", as: FrontOfficeStaff, captures: { score_ops: $.data.priority_score } }
          assert:
            - "priority_score at creation == 165.00 (100 + 50 required + 15 * min(1 sibling, 2) - 0 + 0 wait)"
            - "after 50 hours and run-ops: priority_score == 175.00 (+ 5 * floor(50/24) = 10)"

      - name: promotion_tie_break_created_at_asc
        claim_type: correct_result
        grounds: [calculations.waitlist_promotion_selector]
