  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_rejected_verification_reopens_repair_dimension_then_passes
        grounds:
          - state_machines.WorkOrder.verification_status_UNVERIFIED_to_verification_status_REJECTED
          - state_machines.WorkOrder.repair_status_OPEN_to_repair_status_REPAIRED
          - state_machines.Deficiency.CORRECTED_to_OPEN
          - entities.WorkOrder.fields.rejection_count
          - entities.SelfAssessmentSweep.fields.closure_verified_rate
        distinguishing_aspect: |
          The WorkOrder carries two independent status dimensions and the graph is cyclic: a
          FAILED verification does not merely mark the verification dimension REJECTED, it sends
          repair_status REPAIRED -> OPEN, clears completed_at/completed_by_user_id and pulls the
          linked Deficiency back CORRECTED -> OPEN. The same work order is then completed and
          verified a second time, so the row visits REPAIRED twice and rejection_count settles at
          1 - a forward-only implementation cannot reach this end state.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard with LT_GAS and SEV_WINDOW definitions."
            - "Property Maple Court with unit 101 and an IN_PROGRESS self-assessment sweep whose planned_area_scope is ALL_AREAS."
            - "One SEV_WINDOW finding, generating one OPEN/UNVERIFIED work order, completed by technician tech-1 and then FAILED by the owner (segregation of duties satisfied), which reopens the repair dimension; the technician completes it a second time."
          setup_api_calls:
            - call: "POST /inspection-standards"
              payload: { code: "NSPIRE-2026", name: "NSPIRE 2026", effective_date: "2026-01-01T00:00:00.000Z", unit_weight_pct: 50.00, inside_weight_pct: 30.00, outside_weight_pct: 20.00 }
              as: PlatformAdmin
              captures: { std_id: $.data.id }
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "LT_GAS", name: "Gas leak at range connection", inspectable_area: "UNIT", severity: "LIFE_THREATENING", base_point_value: 10.00, correction_deadline_hours: 24 }
              as: PlatformAdmin
            - call: "POST /defect-definitions"
              payload: { standard_id: "${std_id}", code: "SEV_WINDOW", name: "Inoperable egress window", inspectable_area: "UNIT", severity: "SEVERE", base_point_value: 8.00, correction_deadline_hours: 720 }
              as: PlatformAdmin
              captures: { dd_sev: $.data.id }
            - call: "POST /inspection-standards/${std_id}/adopt"
              payload: { adopted_at: "2026-01-02T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Maple Court", total_unit_count: 4, capital_reserve_cents: 1000000, owner_contact_email: "owner@maple.example" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedroom_count: 2, occupancy_status: "OCCUPIED", occupant_display_name: "Household 101" }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /self-assessment-sweeps"
              payload: { property_id: "${prop_id}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-20T00:00:00.000Z", planned_area_scope: "ALL_AREAS" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_id: $.data.id }
            - call: "POST /self-assessment-sweeps/${sw_id}/start"
              payload: { started_at: "2026-08-02T08:00:00.000Z" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { sw_v1: $.data.version }
            - call: "POST /self-assessment-sweeps/${sw_id}/findings"
              payload: { expected_sweep_version: "${sw_v1}", defect_definition_id: "${dd_sev}", inspectable_area: "UNIT", unit_id: "${u1_id}", observed_at: "2026-08-03T09:00:00.000Z", note: "Egress window will not open" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { wo_id: $.data.id, def_id: $.data.deficiency_id }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { completed_at: "2026-08-04T10:00:00.000Z", resolution_note: "Sash replaced" }
              as: MaintenanceTechnician
