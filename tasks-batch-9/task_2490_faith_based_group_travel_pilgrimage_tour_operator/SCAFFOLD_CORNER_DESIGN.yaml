          rationale: "The same downstream release fan-out over travelers, plans, protections, services, land lines, air blocks and agreements is asserted by the named §1.8 instance."

  - section: errors
    instances:
      - name: unknown_program_fk_on_departure_create_returns_program_not_found
        claim_type: triggerable
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - validations[priority=26]
        distinguishing_aspect: "A body foreign key that resolves to nothing yields 404 ERR_PROGRAM_NOT_FOUND, not 400 ERR_INVALID_REQUEST, because the field is present and well formed."
        test_recipe:
          setup:
            - "Empty store; no program has been created."
          setup_api_calls: []
          trigger:
            - call: "POST /departures"
              payload: { program_id: "00000000-0000-4000-8000-000000000901", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15" }
              as: ProgramManager
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROGRAM_NOT_FOUND"

      - name: unknown_pilgrim_path_id_returns_pilgrim_not_found
        claim_type: triggerable
        grounds:
          - errors.ERR_PILGRIM_NOT_FOUND
          - validations[priority=20]
        distinguishing_aspect: "The path id is checked before anything else on the traveler read, so an unknown id gives 404 ERR_PILGRIM_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty store; no traveler has been created."
          setup_api_calls: []
          trigger:
