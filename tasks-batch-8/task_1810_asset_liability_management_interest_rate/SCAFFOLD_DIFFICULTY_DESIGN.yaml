            - { call: "POST /books/${b}/simulation-runs", payload: { scenario_id: "${sc}", prepayment_set_id: "${ps}", decay_set_id: "${ds}", beta_set_id: "${bs}", balance_sheet_convention: STATIC, expected_book_version: "${bv2}" }, as: TreasuryAnalyst, captures: { r2: $.data.id } }
          assert:
            - "SimulationRun.${r1}.nii_delta_pct == -4.57"
            - "SimulationRun.${r1}.breach_summary == EVE"
            - "SimulationRun.${r2}.breach_summary == BOTH"

      - name: dollar_offset_ratio_exactly_080_passes
        grounds:
          - calculations.hedge_effectiveness_result
        distinguishing_aspect: |
          Boundary on offset_ratio via POST /hedges/{id}/effectiveness-tests:
          the [0.8000, 1.2500] band is INCLUSIVE — ratio exactly 0.8000
          (hedge +4,000,000 vs hedged -5,000,000) is PASS while 0.7800
          (+3,900,000) is FAIL and auto-dedesignates. Different metric and
          endpoint than the NII-threshold sibling.
        test_recipe:
          setup:
            - "Book1 ACTIVE (floor 0); H1 ACTIVE DOLLAR_OFFSET 60,000,000 [2026-08,2027-08) on L1"
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: LOAN, balance_cents: 100000000, rate_bps: 600, scheduled_runoff_pct: 20.0, is_prepayment_eligible: true, duration_years: 3.0 }, as: TreasuryAnalyst, captures: { l1: $.data.id } }
            - { call: "POST /books/${b}/positions", payload: { category: DEPOSIT, deposit_segment: RETAIL_NONMATURITY, balance_cents: 80000000, rate_bps: 50, scheduled_runoff_pct: 0.0, duration_years: 0.5 }, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/activate", payload: {}, as: TreasuryAnalyst }
            - { call: "POST /books/${b}/hedges", payload: { position_id: "${l1}", instrument: PAYER_SWAP, designation_type: FAIR_VALUE, notional_cents: 60000000, fixed_rate_bps: 350 }, as: TreasuryAnalyst, captures: { h: $.data.id } }
            - { call: "POST /hedges/${h}/designate", payload: { start_month: "2026-08", end_month: "2027-08", effectiveness_method: DOLLAR_OFFSET }, as: ALCOChair, as_user_id: ch-1 }
            - { call: "POST /hedges/${h}/activate", payload: {}, as: ALCOChair, as_user_id: ch-1 }
          trigger:
            - { call: "POST /hedges/${h}/effectiveness-tests", payload: { test_month: "2026-08", hedge_value_change_cents: 4000000, hedged_item_value_change_cents: -5000000 }, as: ModelRiskValidator, captures: { t1: $.data.id } }
          assert:
            - "HedgeEffectivenessTest.${t1}.offset_ratio == 0.8000"
            - "HedgeEffectivenessTest.${t1}.result == PASS"
            - "HedgeRelationship.${h}.status == ACTIVE"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_rejected_when_pinned_set_not_approved
        grounds:
          - state_machines.SimulationRun
          - validations[priority=11]
        distinguishing_aspect: |
          Pair SimulationRun -> AssumptionSet: run creation requires all three
