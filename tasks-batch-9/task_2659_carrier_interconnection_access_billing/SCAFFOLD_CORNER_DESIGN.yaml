scaffold_corner_design:
- section: entities
  instances:
  - name: carrier_creation_returns_every_declared_field_with_zeroed_reserves
    claim_type: creation
    grounds:
    - entities.Carrier
    - endpoints.POST /interconnection/carriers
    distinguishing_aspect: |
      Creation claim for Carrier: all three input fields echo back and all five computed reserve/receivable fields start at 0.00 with version 1.
    test_recipe:
      setup:
      - Empty database, confirmed by a carrier listing that reports total_count 0.
      - The logical clock is at the 2026-08-01T00:00:00Z default.
      setup_api_calls: &id001
      - call: GET /interconnection/carriers
        payload:
          limit: 1
          offset: 0
        as: PlatformAdmin
      trigger:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      assert:
      - response.status == 201 and response.data.id is a server-minted UUID with no type prefix
      - response.data.carrier_name == Northstar Telecom LLC, ocn == 9241, carrier_type == ILEC
      - response.data.uncollectible_reserve_balance_usd == 0.00 and disputed_reserve_balance_usd == 0.00
      - response.data.open_receivable_usd == 0.00, disputed_receivable_usd == 0.00, net_receivable_usd == 0.00
      - response.data.version == 1 and created_at == 2026-08-01T00:00:00.000Z
      - response.meta.api_request_id and response.meta.api_request_timestamp are present and response_type == object
  - name: agreement_retrieval_returns_the_stored_opening_ask
    claim_type: retrieval
    grounds:
    - entities.InterconnectionAgreement
    - endpoints.GET /interconnection/agreements/{agreement_id}
    distinguishing_aspect: |
      Retrieval claim: a DRAFT agreement read back by id returns the stored opening ask and the null pinned terms, not the executed ones.
    test_recipe:
      setup:
      - A carrier with one DRAFT agreement whose opening ask is 0.061250 over 36 months.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      trigger:
      - call: GET /interconnection/agreements/${agr_id}
        payload: {}
        as: InterconnectionManager
      assert:
      - response.status == 200 and response.data.id == ${agr_id}
      - response.data.carrier_id == ${car_id} and agreement_label == ICA-NORTHSTAR-2026
      - response.data.status == DRAFT and negotiation_round == 0
      - response.data.proposed_reciprocal_rate_per_mou_usd == 0.061250 and proposed_term_months == 36
      - response.data.reciprocal_rate_per_mou_usd is null, term_months is null, poi_financial_responsibility is null, executed_at is null
      - response.data.poi_facility_capacity_trunks == 192, capacity_posture == NORMAL, poi_augment_pending_count == 0, total_in_service_trunks == 0
  - name: trunk_group_listing_paginates_and_filters_by_agreement
    claim_type: listing
    grounds:
    - entities.TrunkGroup
    - endpoints.GET /interconnection/trunk-groups
    - response_envelope.pagination_fields
    distinguishing_aspect: |
      Listing claim: limit/offset paging over three trunk groups of one agreement reports total_count 3 with has_more true on the first page and false on the second, in created_at ASC order.
    test_recipe:
      setup:
      - An EFFECTIVE agreement with poi_facility_capacity_trunks 192.
      - 'Three IN_SERVICE trunk groups created in this order: TG-DLLS-TWOWAY-001, TG-DLLS-OUT-002 (both at DLLSTXCTDS0) and TG-HSTN-TWOWAY-003 at HSTNTXCTDS0, 24 trunks each.'
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      - call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-DLLS-TWOWAY-001
          poi_clli_code: DLLSTXCTDS0
          lata_code: '552'
          poi_type: MEET_POINT
          direction: TWO_WAY
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures:
          tg1_id: $.data.id
      - call: POST /interconnection/trunk-groups/${tg1_id}/provision
        payload:
          provisioned_trunks: 24
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups/${tg1_id}/activate
        payload: {}
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-DLLS-OUT-002
          poi_clli_code: DLLSTXCTDS0
          lata_code: '552'
          poi_type: MEET_POINT
          direction: ONE_WAY_OUTBOUND
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures:
          tg2_id: $.data.id
      - call: POST /interconnection/trunk-groups/${tg2_id}/provision
        payload:
          provisioned_trunks: 24
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups/${tg2_id}/activate
        payload: {}
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-HSTN-TWOWAY-003
          poi_clli_code: HSTNTXCTDS0
          lata_code: '560'
          poi_type: MEET_POINT
          direction: TWO_WAY
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures:
          tg3_id: $.data.id
      - call: POST /interconnection/trunk-groups/${tg3_id}/provision
        payload:
          provisioned_trunks: 24
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups/${tg3_id}/activate
        payload: {}
        as: NetworkPlanner
      trigger:
      - call: GET /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          limit: 2
          offset: 0
        as: NetworkPlanner
      - call: GET /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          limit: 2
          offset: 2
        as: NetworkPlanner
      assert:
      - The first page returns response_type == array with 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0
      - The first page rows are TG-DLLS-TWOWAY-001 then TG-DLLS-OUT-002 in created_at ASC order
      - The second page returns 1 row (TG-HSTN-TWOWAY-003), total_count == 3, has_more == false, offset == 2
      - Every row has service_status == IN_SERVICE and provisioned_trunks == 24
      - GET /interconnection/trunk-groups with poi_clli_code DLLSTXCTDS0 returns total_count == 2
  - name: unknown_ids_on_read_endpoints_return_their_own_not_found_error
    claim_type: not_found
    grounds:
    - errors[ERR_CARRIER_NOT_FOUND]
    - errors[ERR_MEASUREMENT_NOT_FOUND]
    - errors[ERR_CDR_NOT_FOUND]
    - validations[priority=3]
    distinguishing_aspect: |
      Not-found claim: each read endpoint maps its own path id to its own 404 error_id rather than to a shared generic one; the probe uses one non-existent UUID against three different resource families.
    test_recipe:
      setup:
      - 'Empty database, confirmed by a carrier listing that reports total_count 0: no carrier, measurement or call detail record exists.'
      setup_api_calls: *id001
      trigger:
      - call: GET /interconnection/carriers/00000000-0000-4000-8000-000000000000
        payload: {}
        as: PlatformAdmin
        captures: &id002
          err: $.data.error_id
      - call: GET /interconnection/traffic-measurements/00000000-0000-4000-8000-000000000000
        payload: {}
        as: NetworkPlanner
        captures: *id002
      - call: GET /interconnection/call-detail-records/00000000-0000-4000-8000-000000000000
        payload: {}
        as: AccessBillingAnalyst
        captures: *id002
      assert:
      - The carrier read returns 404 with error_id ERR_CARRIER_NOT_FOUND
      - The measurement read returns 404 with error_id ERR_MEASUREMENT_NOT_FOUND
      - The call detail record read returns 404 with error_id ERR_CDR_NOT_FOUND
      - Every error body has response_type == error and a non-empty data.message
  - name: carrier_creation_without_ocn_is_an_invalid_request
    claim_type: required_fields
    grounds:
    - validations[priority=4]
    - errors[ERR_INVALID_REQUEST]
    - entities.Carrier.fields.ocn
    distinguishing_aspect: |
      Required-field claim: ocn has source input and no default, so omitting it is refused at priority 4 before any uniqueness check runs.
    test_recipe:
      setup:
      - Empty database, confirmed by a carrier listing that reports total_count 0, so the OCN 9241 slot is free.
      setup_api_calls: *id001
      trigger:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          carrier_type: ILEC
        as: PlatformAdmin
        captures: *id002
      assert:
      - response.status == 422 and response.data.error_id == ERR_INVALID_REQUEST
      - GET /interconnection/carriers returns total_count == 0
      - The error is ERR_INVALID_REQUEST, not ERR_DUPLICATE_OCN
  - name: agreement_transit_flag_defaults_to_false_when_omitted
    claim_type: defaults
    grounds:
    - entities.InterconnectionAgreement.fields.transit_traffic_allowed
    - endpoints.POST /interconnection/agreements
    distinguishing_aspect: |
      Defaults claim: transit_traffic_allowed is the one input field with a declared default, so omitting it yields false rather than null.
    test_recipe:
      setup:
      - A registered carrier.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      trigger:
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
      assert:
      - response.status == 201 and response.data.transit_traffic_allowed == false, not null
      - response.data.status == DRAFT and negotiation_round == 0 and capacity_posture == NORMAL
      - response.data.version == 1
  - name: trunk_group_provisioned_trunks_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.TrunkGroup.fields.provisioned_trunks
    - entities.TrunkGroup.fields.required_trunks
    - endpoints.POST /interconnection/trunk-groups
    distinguishing_aspect: |
      Computed-field claim: provisioned_trunks, required_trunks, latest_blocking_pct and open_augment_order_count have source computed, so a client-supplied provisioned_trunks of 96 is ignored and the row is created with the computed zero defaults.
    test_recipe:
      setup:
      - An EFFECTIVE agreement with poi_facility_capacity_trunks 192.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      trigger:
      - call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-DLLS-TWOWAY-001
          poi_clli_code: DLLSTXCTDS0
          lata_code: '552'
          poi_type: MEET_POINT
          direction: TWO_WAY
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
          provisioned_trunks: 96
          required_trunks: 96
        as: NetworkPlanner
        captures:
          tg1_id: $.data.id
      assert:
      - response.data.provisioned_trunks == 0 and required_trunks == 0, the client-supplied 96 is discarded
      - response.data.latest_blocking_pct == 0.00 and open_augment_order_count == 0
      - response.data.service_status == REQUESTED and augment_status == NONE and in_service_at is null
      - InterconnectionAgreement.${agr_id}.total_in_service_trunks == 0
  - name: carrier_system_fields_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Carrier
    - endpoints.POST /interconnection/carriers
    distinguishing_aspect: |
      System-field claim: id, created_at, updated_at and version are minted by the server, so client-supplied values for them are discarded and version still starts at 1.
    test_recipe:
      setup:
      - Empty database, confirmed by a carrier listing that reports total_count 0.
      - The logical clock is at the 2026-08-01T00:00:00Z default.
      setup_api_calls: *id001
      trigger:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
          id: 00000000-0000-4000-8000-000000000000
          version: 77
          created_at: '2020-01-01T00:00:00.000Z'
        as: PlatformAdmin
        captures:
          car_id: $.data.id
      assert:
      - response.data.id != 00000000-0000-4000-8000-000000000000
      - response.data.version == 1, not 77
      - response.data.created_at == 2026-08-01T00:00:00.000Z, not 2020-01-01T00:00:00.000Z
      - response.data.updated_at == 2026-08-01T00:00:00.000Z
  - name: carrier_type_outside_the_enum_is_an_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.Carrier.fields.carrier_type
    - entities.Carrier.fields.ocn
    - validations[priority=4]
    distinguishing_aspect: |
      Type-constraint claim: carrier_type accepts only {ILEC, CLEC, IXC, CMRS} and ocn is exactly four uppercase alphanumerics, so an out-of-enum type and a five-character OCN are both refused at priority 4.
    test_recipe:
      setup:
      - Empty database, confirmed by a carrier listing that reports total_count 0.
      setup_api_calls: *id001
      trigger:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: RBOC
        as: PlatformAdmin
        captures: *id002
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '92415'
          carrier_type: ILEC
        as: PlatformAdmin
        captures: *id002
      assert:
      - The out-of-enum carrier_type returns 422 with error_id ERR_INVALID_REQUEST
      - The five-character ocn returns 422 with error_id ERR_INVALID_REQUEST
      - GET /interconnection/carriers returns total_count == 0
  - name: negotiation_offer_is_immutable_and_carries_no_version_field
    claim_type: immutability
    grounds:
    - entities.NegotiationOffer
    - endpoints.GET /interconnection/negotiation-offers/{offer_id}
    distinguishing_aspect: |
      Immutability claim: NegotiationOffer declares common_fields false, so it exposes id and created_at but no version or updated_at, and §1.5 offers no update endpoint for it — its only mutation is the system-driven status move.
    test_recipe:
      setup:
      - A carrier with a DRAFT agreement carrying one OPEN PROPOSAL offer at 0.061250 over 36 months.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      trigger:
      - call: GET /interconnection/negotiation-offers/${offer1_id}
        payload: {}
        as: InterconnectionManager
      assert:
      - response.data has id and created_at but no version field and no updated_at field
      - response.data.round_number == 1, offering_party == CLEC_SIDE, status == OPEN, responded_at is null
      - response.data.agreement_id == ${agr_id} and reciprocal_rate_per_mou_usd == 0.061250
      - No PUT/PATCH/DELETE endpoint for negotiation offers exists in the API surface
  - name: trunk_group_creation_under_an_unknown_agreement_is_not_found
    claim_type: parent_relationships
    grounds:
    - validations[priority=5]
    - errors[ERR_AGREEMENT_NOT_FOUND]
    - entities.TrunkGroup.fields.agreement_id
    distinguishing_aspect: |
      Parent-relationship claim: TrunkGroup.agreement_id is a body FK checked at priority 5, so a non-existent parent yields 404 ERR_AGREEMENT_NOT_FOUND and no orphan row.
    test_recipe:
      setup:
      - A registered carrier holding one DRAFT agreement, so the agreements table is not empty.
      - The id 00000000-0000-4000-8000-000000000000 resolves to no agreement.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      trigger:
      - call: POST /interconnection/trunk-groups
        payload:
          agreement_id: 00000000-0000-4000-8000-000000000000
          trunk_group_serial: TG-DLLS-TWOWAY-001
          poi_clli_code: DLLSTXCTDS0
          lata_code: '552'
          poi_type: MEET_POINT
          direction: TWO_WAY
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures: *id002
      assert:
      - response.status == 404 and response.data.error_id == ERR_AGREEMENT_NOT_FOUND
      - 'GET /interconnection/trunk-groups returns total_count == 0: no orphan row was written'
      - 'InterconnectionAgreement.${agr_id}.total_in_service_trunks == 0 and version is still 1: the live agreement was untouched'
  - name: reserve_ledger_entry_links_carrier_and_invoice_across_aggregates
    claim_type: graph
    grounds:
    - entities.ReserveLedgerEntry
    - entities.ReserveLedgerEntry.fields.invoice_id
    - endpoints.GET /interconnection/reserve-ledger-entries
    distinguishing_aspect: |
      Graph-topology claim: ReserveLedgerEntry is a cross-aggregate leaf whose carrier_id and invoice_id both point at live rows in different aggregates, and the same entry is reachable by either foreign key.
    test_recipe:
      setup:
      - A carrier with one ISSUED invoice of 32.47; issuing it booked a single UNCOLLECTIBLE entry of 1.62.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
