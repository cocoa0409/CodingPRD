            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/access-appointments", payload: { box_id: "${box_id}", rental_id: "${rental_id}", scheduled_start: "2026-05-01T10:00:00Z", scheduled_end: "2026-05-01T11:00:00Z" }, as: VaultOfficer, captures: { appt_id: "$.data.id" } }
            - { call: "POST /vault/access-appointments/${appt_id}/check-in", payload: {}, as: VaultOfficer }
          trigger:
            - { call: "POST /vault/access-events", payload: { appointment_id: "${appt_id}", box_id: "${box_id}", rental_id: "${rental_id}", event_type: "ENTRY", primary_accessor_ref: "P1", dual_control_officer_ref: "O1", witness_count: 1 }, as: VaultOfficer, captures: { err: "$.data.error_id" } }
