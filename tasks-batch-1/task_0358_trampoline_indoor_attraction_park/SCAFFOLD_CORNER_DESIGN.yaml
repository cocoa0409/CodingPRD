        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[jump-pass-create-stale-slot]", endpoints]
        distinguishing_aspect: "Creating a jump pass with expected_slot_version exactly equal to the current SessionSlot.version succeeds (201) and bumps slot.version by 1."
