            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Filer B", official_title: "Aide", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filerB_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filerA_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filerA_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filerA_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filerA_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filerA_id}"
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filerB_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: sod_adjudicator_equals_investigator_rejected
        claim_type: Segregation of duties
        grounds: ["validations[priority=8]", "state_machines.Investigation.OPEN_to_SUSTAINED", "errors[ERR_SOD_CONFLICT]"]
        distinguishing_aspect: "Adjudicating with X-User-ID equal to the investigation's assigned_investigator_id returns ERR_SOD_CONFLICT."
        test_recipe:
          setup: ["Complaint SCREENED, Investigation opened by inv-1."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /complaints"
              payload: { filer_id: "${filer_id}", allegation: "conflict", complainant_ref: "cx-4" }
              as: EthicsOfficer
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/screen"
              payload: { decision: "SCREENED" }
