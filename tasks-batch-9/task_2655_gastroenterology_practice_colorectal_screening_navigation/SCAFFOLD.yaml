scenario: |
  Generate task harder than expert level!

  2655. Gastroenterology Practice & Colorectal Screening Navigation (gastroenterology practice): screening eligibility, risk stratification and interval assignment by prior findings, patient navigation for bowel preparation adherence and appointment completion, screening versus diagnostic classification affecting patient cost sharing, endoscopy suite scheduling with anesthesia coverage and turnover, pathology result routing and surveillance interval recalculation, adenoma detection rate and quality benchmark monitoring by physician, non-invasive screening test follow-up requiring diagnostic colonoscopy, open-access referral triage and pre-procedure risk screening
domain_name: colorectal-screening-navigation
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: beyond_expert
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  design_notes: |
    The endoscopy suite is the contended resource and it is contended along two geometrically
    different interval axes - a room block that enforces buffered single occupancy (turnover
    minutes are part of the occupied interval) and an anesthesia clinician who enforces an
    aggregate ceiling on the number of overlapping half-open coverage intervals. The money side
    is a two-algorithm ledger - the same colonoscopy is priced once at booking under the
    screening-preventive interpretation and once after pathology under the diagnostic
    interpretation, and the two numbers legitimately differ. Quality measurement is a second
    two-algorithm surface - the same completed procedures produce different adenoma detection
    rates depending on whether they are attributed by procedure date or by pathology
    finalization date. ScreeningEpisode carries two independent status dimensions - the clinical
    pathway and the navigation pathway - and the navigation dimension is itself cyclic. The
    referral triage dimension is cyclic with a bounded number of information-request rounds.

entities:
  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - name: plan_code
        type: string
        source: input
        description: External payer plan identifier, unique across InsurancePlan
        constraints: 1-32 chars, unique
      - name: payer_name
        type: string
        source: input
        description: Payer display name
      - name: preventive_coverage_pct
        type: number
        source: input
        description: Fraction of an allowed line amount the plan pays when the claim classification is SCREENING_PREVENTIVE
        default: 1.00
        constraints: 0.00-1.00
      - name: diagnostic_coinsurance_pct
        type: number
        source: input
        description: Patient coinsurance fraction applied to the post-deductible remainder of each line when the claim classification is DIAGNOSTIC
        default: 0.20
        constraints: 0.00-1.00
      - name: deductible_cents
        type: integer
        source: input
        description: Annual deductible in cents, consumed only by DIAGNOSTIC claims
        default: 0
        constraints: ">= 0"
      - name: out_of_pocket_max_cents
        type: integer
        source: input
        description: Annual out-of-pocket ceiling in cents that truncates patient_responsibility_cents
        default: 400000
        constraints: ">= 0"
      - name: polypectomy_carveout
        type: enum
        source: input
        description: Governs whether removing a polyp during a screening exam converts the claim to DIAGNOSTIC
        default: DIAGNOSTIC_CONVERTED
        constraints: one of PREVENTIVE_RETAINED|DIAGNOSTIC_CONVERTED
      - name: modifier_33_honored
        type: boolean
        source: input
        description: When true a colonoscopy that follows a POSITIVE non-invasive screening test keeps the SCREENING_PREVENTIVE classification at provisional pricing
        default: true
      - name: anesthesia_bundled
        type: boolean
        source: input
        description: When false the ANESTHESIA line is charged diagnostic_coinsurance_pct even under a SCREENING_PREVENTIVE classification
        default: false

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: Medical record number, unique across Patient
        constraints: 1-32 chars, unique
      - name: birth_date
        type: string
        source: input
        description: Date of birth in YYYY-MM-DD form, used for whole-year age at ScreeningEpisode.index_date
      - name: insurance_plan_id
        type: string
        source: input
        description: FK -> InsurancePlan.id; the plan whose cost-sharing terms price this patient's claims
      - name: family_history_crc
        type: boolean
        source: input
        description: First-degree relative with colorectal cancer
        default: false
      - name: ibd_diagnosis
        type: boolean
        source: input
        description: Inflammatory bowel disease involving the colon
        default: false
      - name: prior_crc_history
        type: boolean
        source: input
        description: Personal history of colorectal cancer
        default: false
      - name: anticoagulant_therapy
        type: boolean
        source: input
        description: Patient is on anticoagulant therapy
        default: false
      - name: asa_class
        type: integer
        source: input
        description: ASA physical status class used by pre-procedure risk screening
        default: 2
        constraints: 1-5
      - name: risk_tier
        type: enum
        source: computed
        description: Risk stratification derived from ibd_diagnosis, prior_crc_history and family_history_crc by the patient_risk_stratification calculation
        constraints: one of AVERAGE|INCREASED|HIGH
      - name: deductible_applied_cents
        type: integer
        source: system
        description: Running ledger of deductible consumed by BillingClaim rows in status FINALIZED
        default: 0
      - name: oop_applied_cents
        type: integer
        source: system
        description: Running ledger of patient responsibility committed by BillingClaim rows in status FINALIZED
        default: 0
      - name: open_episode_count
        type: integer
        source: computed
        description: Count of ScreeningEpisode rows for this patient whose clinical_status is in {OPEN, PROCEDURE_SCHEDULED, PATHOLOGY_PENDING}
        default: 0
      - name: navigation_priority
        type: enum
        source: computed
        description: HIGH when open_episode_count >= NAVIGATION_HIGH_PRIORITY_EPISODES, otherwise ROUTINE
        default: ROUTINE
        constraints: one of ROUTINE|HIGH

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: National provider identifier, unique across Clinician
        constraints: 1-20 chars, unique
      - name: full_name
        type: string
        source: input
        description: Display name
      - name: clinician_type
        type: enum
        source: input
        description: ENDOSCOPIST rows may lead sessions and perform bookings; ANESTHESIA rows may hold anesthesia coverage
        constraints: one of ENDOSCOPIST|ANESTHESIA
      - name: max_overlapping_rooms
        type: integer
        source: input
        description: Supervision ceiling - the largest number of ACTIVE AnesthesiaCoverage intervals of this clinician that may contain any single instant
        default: 1
        constraints: 1-4
      - name: adr_benchmark_pct
        type: number
        source: input
        description: Adenoma detection rate benchmark this endoscopist is measured against
        default: 0.25
        constraints: 0.00-1.00
      - name: credential_status
        type: enum
        source: input
        description: SUSPENDED blocks starting a procedure
        default: ACTIVE
        constraints: one of ACTIVE|SUSPENDED

  - name: EndoscopySession
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: Endoscopy suite room label
      - name: session_date
        type: string
        source: input
        description: Calendar date of the block in YYYY-MM-DD form
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start instant of the bookable block
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end instant of the bookable block
      - name: lead_endoscopist_id
        type: string
        source: input
        description: FK -> Clinician.id; must have clinician_type == ENDOSCOPIST
      - name: anesthesia_mode
        type: enum
        source: input
        description: MAC blocks require a fully covering ACTIVE AnesthesiaCoverage before a booking may start
        default: MODERATE_SEDATION
        constraints: one of MODERATE_SEDATION|MAC
      - name: turnover_minutes
        type: integer
        source: input
        description: Minutes appended to every booking's slot to form its room occupancy interval
        default: 15
        constraints: 0-60
      - name: max_procedures
        type: integer
        source: input
        description: Ceiling on the number of ProcedureBooking rows on this session whose status is not CANCELLED
        default: 8
        constraints: 1-20
      - name: capacity_minutes
        type: integer
        source: computed
        description: Whole minutes between window_start_utc and window_end_utc
      - name: booked_minutes
        type: integer
        source: computed
        description: Sum of duration_minutes plus turnover_minutes over ProcedureBooking rows on this session whose status is in {BOOKED, CHECKED_IN, IN_PROGRESS, COMPLETED, ABORTED_INADEQUATE_PREP}
        default: 0
      - name: remaining_minutes
        type: integer
        source: computed
        description: capacity_minutes minus booked_minutes
      - name: status
        type: enum
        source: system
        description: Block posture that gates child booking operations
        default: DRAFT
        constraints: one of DRAFT|PUBLISHED|COVERAGE_CONFIRMED|SUSPENDED|CLOSED
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded by the SUSPEND status action, null otherwise

  - name: AnesthesiaCoverage
    parent: EndoscopySession
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: FK -> EndoscopySession.id; the block this coverage staffs
      - name: anesthesia_clinician_id
        type: string
        source: input
        description: FK -> Clinician.id; must have clinician_type == ANESTHESIA
      - name: coverage_start_utc
        type: datetime
        source: input
        description: Inclusive start instant of the half-open coverage interval
      - name: coverage_end_utc
        type: datetime
        source: input
        description: Exclusive end instant of the half-open coverage interval
      - name: covers_full_window
        type: boolean
        source: computed
        description: True when coverage_start_utc <= session.window_start_utc and coverage_end_utc >= session.window_end_utc
      - name: overlap_index
        type: integer
        source: computed
        description: One-based count of this clinician's ACTIVE AnesthesiaCoverage intervals whose half-open span contains coverage_start_utc, this row included
      - name: status
        type: enum
        source: system
        description: RELEASED rows no longer staff the block and no longer count toward the overlap ceiling
        default: ACTIVE
        constraints: one of ACTIVE|RELEASED

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the referred patient
      - name: referring_provider_npi
        type: string
        source: input
        description: NPI of the outside provider who sent the referral
      - name: reason
        type: enum
        source: input
        description: Referral indication as stated by the referring provider
        constraints: one of AVERAGE_RISK_SCREENING|FAMILY_HISTORY|POSITIVE_FIT|SURVEILLANCE|SYMPTOMATIC_BLEEDING
      - name: asa_class_reported
        type: integer
        source: input
        description: ASA class as reported on the referral, may be revised by a RESPOND_INFO triage action
        constraints: 1-5
      - name: anticoagulant_reported
        type: boolean
        source: input
        description: Anticoagulant use as reported on the referral, may be revised by a RESPOND_INFO triage action
        default: false
      - name: status
        type: enum
        source: system
        description: Triage lifecycle state
        default: SUBMITTED
        constraints: one of SUBMITTED|UNDER_TRIAGE|INFO_REQUESTED|ACCEPTED_OPEN_ACCESS|ACCEPTED_OFFICE_VISIT|DECLINED
      - name: info_request_rounds
        type: integer
        source: system
        description: Number of REQUEST_INFO triage actions already applied, capped by MAX_INFO_REQUEST_ROUNDS
        default: 0
      - name: risk_screen_result
        type: enum
        source: computed
        description: Outcome of the pre-procedure risk screen recomputed on every triage action by the open_access_risk_screen calculation
        default: PENDING
        constraints: one of PENDING|CLEARED_OPEN_ACCESS|OFFICE_VISIT_REQUIRED
      - name: triage_decision_note
        type: string
        source: system
        description: Free-text note from the deciding triage action, or the literal AUTO_DECLINED_INFO_EXHAUSTED when the round ceiling forced a decline

  - name: ScreeningEpisode
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient whose screening cycle this episode tracks
      - name: referral_id
        type: string
        source: input
        description: FK -> Referral.id; null for practice-initiated episodes
      - name: preceding_episode_id
        type: string
        source: input
        description: FK -> ScreeningEpisode.id; the episode this one supersedes or follows, null for a first cycle
      - name: indication
        type: enum
        source: input
        description: Clinical indication that selects the eligibility rule set and the provisional billing classification
        constraints: one of SCREENING_AVERAGE_RISK|SCREENING_HIGH_RISK|SURVEILLANCE|DIAGNOSTIC_FOLLOWUP
      - name: origin
        type: enum
        source: computed
        description: DIRECT when referral_id is null and preceding_episode_id is null, REFERRAL when referral_id is set, NONINVASIVE_POSITIVE when the episode was created by the positive_noninvasive_followup cascade, SURVEILLANCE_RECALL when preceding_episode_id is set and referral_id is null
        constraints: one of DIRECT|REFERRAL|NONINVASIVE_POSITIVE|SURVEILLANCE_RECALL
      - name: index_date
        type: string
        source: computed
        description: Calendar date of the logical clock at creation in YYYY-MM-DD form, the anchor for age and due_date
      - name: eligibility_status
        type: enum
        source: computed
        description: Screening eligibility computed by the screening_eligibility calculation at creation and never revised
        constraints: one of ELIGIBLE|INELIGIBLE_AGE|INELIGIBLE_PRIOR_CRC|INELIGIBLE_RISK_MISMATCH
      - name: risk_tier_snapshot
        type: enum
        source: computed
        description: Copy of Patient.risk_tier taken at creation, used as the surveillance interval cap even if the patient record changes later
        constraints: one of AVERAGE|INCREASED|HIGH
      - name: assigned_interval_months
        type: integer
        source: computed
        description: Surveillance interval in months copied from the ACTIVE SurveillanceRecommendation, null until one exists
      - name: due_date
        type: string
        source: computed
        description: Date the next screening or diagnostic action is due in YYYY-MM-DD form
      - name: clinical_status
        type: enum
        source: system
        description: Clinical pathway dimension, advances independently of navigation_status
        default: OPEN
        constraints: one of OPEN|PROCEDURE_SCHEDULED|PATHOLOGY_PENDING|CLOSED_SURVEILLANCE_SET|CLOSED_DECLINED|CLOSED_SUPERSEDED
      - name: navigation_status
        type: enum
        source: system
        description: Bowel-preparation navigation dimension, advances independently of clinical_status and may cycle between OUTREACH_ACTIVE and PREP_AT_RISK
        default: NOT_STARTED
        constraints: one of NOT_STARTED|OUTREACH_ACTIVE|PREP_AT_RISK|PREP_CONFIRMED|NAVIGATION_COMPLETE
      - name: outreach_log
        type: array
        source: system
        description: Append-only list of objects with keys channel, occurred_at, acknowledged - one entry per accepted outreach action, ordered by insertion
        default: []
      - name: prep_attestation
        type: enum
        source: system
        description: NONE until the patient attests, then COMPLETED or NOT_COMPLETED
        default: NONE
        constraints: one of NONE|COMPLETED|NOT_COMPLETED
      - name: prep_adherence_score
        type: number
        source: computed
        description: Recency-weighted bowel-preparation adherence score in the range 0.00-10.00 produced by the prep_adherence_score calculation
        default: 0.00
      - name: closure_reason
        type: enum
        source: system
        description: Reason recorded by the close action, null while the episode is not closed
        constraints: one of PATIENT_DECLINED|LOST_TO_FOLLOW_UP|SUPERSEDED_BY_OTHER_PATHWAY

  - name: NoninvasiveTest
    parent: ScreeningEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: FK -> ScreeningEpisode.id; the episode that ordered this stool-based test
      - name: test_type
        type: enum
        source: input
        description: Stool-based screening modality
        constraints: one of FIT|MT_SDNA
      - name: collected_date
        type: string
        source: input
        description: Specimen collection date in YYYY-MM-DD form
      - name: result
        type: enum
        source: system
        description: Laboratory outcome, PENDING until a result action is posted
        default: PENDING
        constraints: one of PENDING|NEGATIVE|POSITIVE|INSUFFICIENT_SPECIMEN
      - name: resulted_at
        type: datetime
        source: system
        description: Logical clock instant at which the result was posted, null while PENDING
      - name: follow_up_episode_id
        type: string
        source: system
        description: FK -> ScreeningEpisode.id; the DIAGNOSTIC_FOLLOWUP episode created by the positive_noninvasive_followup cascade, null otherwise

  - name: ProcedureBooking
    parent: EndoscopySession
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: FK -> ScreeningEpisode.id; the episode this colonoscopy satisfies
      - name: session_id
        type: string
        source: input
        description: FK -> EndoscopySession.id; the room block that holds the slot
      - name: performing_endoscopist_id
        type: string
        source: input
        description: FK -> Clinician.id; must have clinician_type == ENDOSCOPIST
      - name: slot_start_utc
        type: datetime
        source: input
        description: Inclusive start instant of the procedure slot
      - name: duration_minutes
        type: integer
        source: input
        description: Scheduled procedure length in minutes
        constraints: 15-120
      - name: slot_end_utc
        type: datetime
        source: computed
        description: slot_start_utc plus duration_minutes
      - name: occupancy_end_utc
        type: datetime
        source: computed
        description: slot_end_utc plus the session's turnover_minutes, the exclusive end of the room occupancy interval
      - name: status
        type: enum
        source: system
        description: Booking lifecycle state
        default: BOOKED
        constraints: one of BOOKED|CHECKED_IN|IN_PROGRESS|COMPLETED|ABORTED_INADEQUATE_PREP|CANCELLED
      - name: prep_quality_bbps
        type: integer
        source: input
        description: Boston Bowel Preparation Scale total recorded at complete or abort, null before that
        constraints: 0-9
      - name: polyps_removed_count
        type: integer
        source: input
        description: Number of polyps removed during the exam, recorded at complete, null before that
        constraints: ">= 0"
      - name: largest_polyp_mm
        type: integer
        source: input
        description: Largest polyp diameter in millimetres as measured endoscopically, recorded at complete
        constraints: ">= 0"
      - name: specimen_count
        type: integer
        source: input
        description: Number of specimen containers sent to pathology, recorded at complete
        constraints: ">= 0"
      - name: planned_classification
        type: enum
        source: computed
        description: Billing classification chosen by the provisional variant of the claim_pricing calculation at booking time
        constraints: one of SCREENING_PREVENTIVE|DIAGNOSTIC
      - name: final_classification
        type: enum
        source: computed
        description: Billing classification chosen by the final variant of the claim_pricing calculation, null until the claim is repriced
        constraints: one of SCREENING_PREVENTIVE|DIAGNOSTIC
      - name: cancellation_reason
        type: string
        source: input
        description: Reason recorded by the cancel or abort action, null otherwise
      - name: released_minutes
        type: integer
        source: system
        description: Room minutes returned to the session by the cancel action, zero for every other status
        default: 0

  - name: PathologyReport
    parent: ProcedureBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> ProcedureBooking.id; the completed colonoscopy the specimens came from
      - name: accession_number
        type: string
        source: input
        description: Laboratory accession number, unique across PathologyReport
        constraints: 1-32 chars, unique
      - name: specimens
        type: array
        source: input
        description: List of objects with keys label (string), histology (enum) and size_mm (integer >= 0); histology is one of TUBULAR_ADENOMA|TUBULOVILLOUS_ADENOMA|SESSILE_SERRATED_LESION|HYPERPLASTIC|ADENOCARCINOMA|NORMAL_MUCOSA
        constraints: may be empty only while status is RECEIVED
      - name: high_grade_dysplasia
        type: boolean
        source: input
        description: Pathologist assertion of high-grade dysplasia anywhere in this report
        default: false
      - name: adenoma_count
        type: integer
        source: computed
        description: Count of specimens whose histology is TUBULAR_ADENOMA or TUBULOVILLOUS_ADENOMA
        default: 0
      - name: sessile_serrated_count
        type: integer
        source: computed
        description: Count of specimens whose histology is SESSILE_SERRATED_LESION
        default: 0
      - name: largest_adenoma_mm
        type: integer
        source: computed
        description: Maximum size_mm over specimens whose histology is TUBULAR_ADENOMA or TUBULOVILLOUS_ADENOMA, zero when there are none
        default: 0
      - name: villous_component
        type: boolean
        source: computed
        description: True when any specimen histology is TUBULOVILLOUS_ADENOMA
        default: false
      - name: adenocarcinoma_present
        type: boolean
        source: computed
        description: True when any specimen histology is ADENOCARCINOMA
        default: false
      - name: status
        type: enum
        source: system
        description: Routing lifecycle state; AMENDED rows are awaiting re-finalization
        default: RECEIVED
        constraints: one of RECEIVED|FINALIZED|AMENDED
      - name: amendment_count
        type: integer
        source: system
        description: Number of amend actions applied to this report
        default: 0
      - name: finalized_at
        type: datetime
        source: system
        description: Logical clock instant of the most recent finalize action, null until first finalized
      - name: routed_to_endoscopist_id
        type: string
        source: system
        description: FK -> Clinician.id; set at finalize to the booking's performing_endoscopist_id, the routing destination for the result
      - name: amendment_reason
        type: string
        source: input
        description: Reason recorded by the most recent amend action, null otherwise

  - name: SurveillanceRecommendation
    parent: ScreeningEpisode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: FK -> ScreeningEpisode.id; the episode whose surveillance interval this row assigns
      - name: pathology_report_id
        type: string
        source: input
        description: FK -> PathologyReport.id; the finalized report that anchored the interval, null when the exam produced no specimens
      - name: attesting_endoscopist_id
        type: string
        source: system
        description: FK -> Clinician.id; the endoscopist whose X-User-ID attested an override, null for GUIDELINE rows
      - name: computed_interval_months
        type: integer
        source: computed
        description: Interval produced by the surveillance_interval calculation from the finalized pathology aggregate, the risk tier snapshot and the prep score
      - name: override_interval_months
        type: integer
        source: input
        description: Attested override interval in months, null for GUIDELINE rows
        constraints: 6-120
      - name: override_reason
        type: string
        source: input
        description: Required whenever override_interval_months is supplied
      - name: assigned_interval_months
        type: integer
        source: computed
        description: override_interval_months when an attested override is present, otherwise computed_interval_months
      - name: next_due_date
        type: string
        source: computed
        description: Procedure date of the anchoring booking advanced by assigned_interval_months whole months in YYYY-MM-DD form
      - name: basis
        type: enum
        source: computed
        description: GUIDELINE when the assigned interval equals the computed interval, OVERRIDE_ATTESTED when an attested override was applied
        constraints: one of GUIDELINE|OVERRIDE_ATTESTED
      - name: status
        type: enum
        source: system
        description: Only one row per episode may be ACTIVE; older rows are SUPERSEDED
        default: ACTIVE
        constraints: one of ACTIVE|SUPERSEDED

  - name: BillingClaim
    parent: ProcedureBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: FK -> ProcedureBooking.id; the booking this claim prices
      - name: insurance_plan_id
        type: string
        source: input
        description: FK -> InsurancePlan.id; the plan snapshot used for pricing, copied from the patient at booking time
      - name: classification
        type: enum
        source: computed
        description: Screening versus diagnostic determination selected by the active variant of the claim_pricing calculation
        constraints: one of SCREENING_PREVENTIVE|DIAGNOSTIC
      - name: variant
        type: enum
        source: computed
        description: PROVISIONAL while priced from booking inputs, FINAL once repriced from procedure findings
        default: PROVISIONAL
        constraints: one of PROVISIONAL|FINAL
      - name: line_items
        type: array
        source: computed
        description: Ordered list of objects with keys code and allowed_cents; code is one of FACILITY|PROFESSIONAL|ANESTHESIA|ABORTED_TECHNICAL and the order is exactly FACILITY, PROFESSIONAL, ANESTHESIA
        default: []
      - name: base_allowed_cents
        type: integer
        source: computed
        description: Sum of line allowed_cents before the complexity outlier addon
        default: 0
      - name: complexity_tier
        type: enum
        source: computed
        description: Outlier tier selected from base_allowed_cents alone and never recomputed from the adjusted total
        constraints: one of TIER_1|TIER_2|TIER_3
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: base_allowed_cents plus the complexity tier addon, which is added to the FACILITY line
        default: 0
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: Portion of allowed_amount_cents absorbed by the plan deductible waterfall, always zero for SCREENING_PREVENTIVE
        default: 0
      - name: coinsurance_cents
        type: integer
        source: computed
        description: Sum of the per-line coinsurance amounts after per-line rounding
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: Patient share after per-line rounding and the out-of-pocket truncation
        default: 0
      - name: plan_paid_cents
        type: integer
        source: computed
        description: allowed_amount_cents minus patient_responsibility_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state
        default: PROVISIONAL_PRICED
        constraints: one of PROVISIONAL_PRICED|REPRICED|FINALIZED|DISPUTED|VOIDED
      - name: reprice_count
        type: integer
        source: system
        description: Number of times the final variant has been applied to this claim
        default: 0
      - name: dispute_reason
        type: string
        source: input
        description: Reason recorded by the dispute action, null otherwise

  - name: QualityPeriod
    parent: null
    common_fields: true
    fields:
      - name: endoscopist_id
        type: string
        source: input
        description: FK -> Clinician.id; the measured endoscopist, must have clinician_type == ENDOSCOPIST
      - name: period_start_date
        type: string
        source: input
        description: Inclusive first calendar date of the measurement window in YYYY-MM-DD form
      - name: period_end_date
        type: string
        source: input
        description: Inclusive last calendar date of the measurement window in YYYY-MM-DD form
      - name: attribution_basis
        type: enum
        source: input
        description: Selects which of the two adenoma_detection_rate variants attributes a completed booking to this window
        default: PROCEDURE_DATE
        constraints: one of PROCEDURE_DATE|PATHOLOGY_FINALIZATION_DATE
      - name: screening_colonoscopy_count
        type: integer
        source: computed
        description: Denominator - completed screening-indication bookings attributed to this window by the selected variant
        default: 0
      - name: adenoma_positive_count
        type: integer
        source: computed
        description: Numerator - attributed bookings having at least one FINALIZED PathologyReport with adenoma_count >= 1
        default: 0
      - name: adr_pct
        type: number
        source: computed
        description: adenoma_positive_count divided by screening_colonoscopy_count rounded to four decimals, null when the denominator is zero
      - name: benchmark_pct
        type: number
        source: computed
        description: Copy of Clinician.adr_benchmark_pct taken at lock time
      - name: benchmark_result
        type: enum
        source: computed
        description: Outcome of the benchmark comparison, null while the period is OPEN
        constraints: one of MET|MISSED|INSUFFICIENT_VOLUME
      - name: remediation_required
        type: boolean
        source: computed
        description: True only when benchmark_result is MISSED
        default: false
      - name: status
        type: enum
        source: system
        description: Measurement lifecycle state
        default: OPEN
        constraints: one of OPEN|LOCKED|ATTESTED
      - name: remediation_plan
        type: string
        source: input
        description: Plan text recorded by the attest action, null otherwise
      - name: attesting_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the quality officer who attested, null until ATTESTED

state_machines:
  - entity: Referral
    state_field: status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED_OPEN_ACCESS, ACCEPTED_OFFICE_VISIT, DECLINED]
    transitions:
      - from: SUBMITTED
        to: UNDER_TRIAGE
        trigger: "POST /referrals/{referral_id}/triage-actions with action == BEGIN_TRIAGE"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == SUBMITTED"
        side_effects:
          - "recompute referral.risk_screen_result via the open_access_risk_screen calculation"
      - from: UNDER_TRIAGE
        to: INFO_REQUESTED
        trigger: "POST /referrals/{referral_id}/triage-actions with action == REQUEST_INFO"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == UNDER_TRIAGE"
          - "referral.info_request_rounds < MAX_INFO_REQUEST_ROUNDS (2)"
        side_effects:
          - "increment referral.info_request_rounds by 1"
          - "set referral.triage_decision_note to the supplied note when present"
        note: "Revision loop - the referral may bounce between UNDER_TRIAGE and INFO_REQUESTED at most MAX_INFO_REQUEST_ROUNDS times."
      - from: UNDER_TRIAGE
        to: DECLINED
        trigger: "POST /referrals/{referral_id}/triage-actions with action == REQUEST_INFO when the round ceiling is already reached"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == UNDER_TRIAGE"
          - "referral.info_request_rounds == MAX_INFO_REQUEST_ROUNDS (2)"
        side_effects:
          - "set referral.triage_decision_note to the literal AUTO_DECLINED_INFO_EXHAUSTED, ignoring any supplied note"
          - "leave referral.info_request_rounds unchanged at 2"
        note: "The same trigger has two target states; the branch is selected by info_request_rounds, not by a separate action."
      - from: INFO_REQUESTED
        to: UNDER_TRIAGE
        trigger: "POST /referrals/{referral_id}/triage-actions with action == RESPOND_INFO"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == INFO_REQUESTED"
        side_effects:
          - "overwrite referral.asa_class_reported with updated_asa_class when supplied"
          - "overwrite referral.anticoagulant_reported with updated_anticoagulant when supplied"
          - "recompute referral.risk_screen_result via the open_access_risk_screen calculation from the revised values"
      - from: UNDER_TRIAGE
        to: ACCEPTED_OPEN_ACCESS
        trigger: "POST /referrals/{referral_id}/triage-actions with action == ACCEPT_OPEN_ACCESS"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == UNDER_TRIAGE"
          - "referral.risk_screen_result == CLEARED_OPEN_ACCESS after recomputation, else ERR_OPEN_ACCESS_RISK_SCREEN_FAILED"
        side_effects:
          - "set referral.triage_decision_note to the supplied note when present"
      - from: UNDER_TRIAGE
        to: ACCEPTED_OFFICE_VISIT
        trigger: "POST /referrals/{referral_id}/triage-actions with action == ACCEPT_OFFICE_VISIT"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == UNDER_TRIAGE"
        side_effects:
          - "set referral.triage_decision_note to the supplied note when present"
        note: "Accepting to an office visit is always permitted; it is the fallback when the open-access risk screen fails."
      - from: UNDER_TRIAGE
        to: DECLINED
        trigger: "POST /referrals/{referral_id}/triage-actions with action == DECLINE"
        actor: ReferralCoordinator
        preconditions:
          - "referral.status == UNDER_TRIAGE"
        side_effects:
          - "set referral.triage_decision_note to the supplied note when present"

  - entity: ScreeningEpisode
    state_field: clinical_status
    shape: parallel
    initial_state: OPEN
    terminal_states: [CLOSED_DECLINED, CLOSED_SUPERSEDED]
    note: "Clinical dimension. It advances independently of navigation_status; the combined observable state of a ScreeningEpisode is the pair (clinical_status, navigation_status)."
    transitions:
      - from: OPEN
        to: PROCEDURE_SCHEDULED
        trigger: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
        actor: ReferralCoordinator
        preconditions:
          - "episode.clinical_status == OPEN"
          - "episode.eligibility_status == ELIGIBLE, else ERR_EPISODE_NOT_ELIGIBLE"
        side_effects:
          - "create a ProcedureBooking in status BOOKED"
          - "recompute session.booked_minutes and session.remaining_minutes"
          - "increment EndoscopySession.version by 1"
          - "set booking.planned_classification from the provisional variant of claim_pricing"
          - "create a BillingClaim in status PROVISIONAL_PRICED with variant PROVISIONAL"
      - from: PROCEDURE_SCHEDULED
        to: OPEN
        trigger: "POST /procedure-bookings/{booking_id}/cancel"
        actor: ReferralCoordinator
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "set booking.status to CANCELLED and booking.released_minutes to duration_minutes + session.turnover_minutes"
          - "recompute session.booked_minutes and session.remaining_minutes so booked_minutes + remaining_minutes == capacity_minutes still holds"
          - "transition the booking's BillingClaim to VOIDED with allowed_amount_cents, patient_responsibility_cents and plan_paid_cents all 0 and line_items []"
      - from: PROCEDURE_SCHEDULED
        to: OPEN
        trigger: "POST /procedure-bookings/{booking_id}/abort"
        actor: Endoscopist
        preconditions:
          - "booking.status is in {CHECKED_IN, IN_PROGRESS}"
        side_effects:
          - "set booking.status to ABORTED_INADEQUATE_PREP and record prep_quality_bbps"
          - "leave session.booked_minutes unchanged - an aborted room block is not released"
          - "reprice the BillingClaim to a single ABORTED_TECHNICAL line of ABORT_TECHNICAL_FEE_CENTS, status REPRICED"
          - "set episode.navigation_status to PREP_AT_RISK when prep_quality_bbps <= 5"
      - from: PROCEDURE_SCHEDULED
        to: PATHOLOGY_PENDING
        trigger: "POST /procedure-bookings/{booking_id}/complete with specimen_count >= 1"
        actor: Endoscopist
        preconditions:
          - "booking.status == IN_PROGRESS"
        side_effects:
          - "set booking.status to COMPLETED and record prep_quality_bbps, polyps_removed_count, largest_polyp_mm and specimen_count"
          - "set episode.navigation_status to NAVIGATION_COMPLETE"
      - from: PROCEDURE_SCHEDULED
        to: CLOSED_SURVEILLANCE_SET
        trigger: "POST /procedure-bookings/{booking_id}/complete with specimen_count == 0"
        actor: Endoscopist
        preconditions:
          - "booking.status == IN_PROGRESS"
        side_effects:
          - "set booking.status to COMPLETED and episode.navigation_status to NAVIGATION_COMPLETE"
          - "create a SurveillanceRecommendation with pathology_report_id null, basis GUIDELINE and status ACTIVE, computed from an empty finalized-pathology aggregate"
          - "copy the recommendation's assigned_interval_months and next_due_date onto episode.assigned_interval_months and episode.due_date"
          - "reprice the booking's BillingClaim under the final variant of claim_pricing, status PROVISIONAL_PRICED to REPRICED, and set booking.final_classification"
      - from: PATHOLOGY_PENDING
        to: CLOSED_SURVEILLANCE_SET
        trigger: "POST /pathology-reports/{report_id}/finalize"
        actor: Pathologist
        preconditions:
          - "episode.clinical_status == PATHOLOGY_PENDING"
          - "report.status is in {RECEIVED, AMENDED}"
        side_effects:
          - "cascade hop 1 - report.status becomes FINALIZED, finalized_at is stamped from the logical clock and routed_to_endoscopist_id is set to booking.performing_endoscopist_id"
          - "cascade hop 2 - because the report is now FINALIZED, a SurveillanceRecommendation is created with basis GUIDELINE from the finalized-pathology aggregate and any previously ACTIVE recommendation on the episode becomes SUPERSEDED"
          - "cascade hop 3 - because that recommendation now exists, episode.assigned_interval_months and episode.due_date are set from it and clinical_status moves to CLOSED_SURVEILLANCE_SET"
          - "cascade hop 4 - because the episode closed, the booking's BillingClaim is repriced under the final variant of claim_pricing, status PROVISIONAL_PRICED to REPRICED, reprice_count incremented and booking.final_classification set"
      - from: CLOSED_SURVEILLANCE_SET
        to: CLOSED_SURVEILLANCE_SET
        trigger: "POST /pathology-reports/{report_id}/finalize after an amend"
        actor: Pathologist
        preconditions:
          - "episode.clinical_status == CLOSED_SURVEILLANCE_SET"
          - "report.status == AMENDED"
        side_effects:
          - "supersede the ACTIVE SurveillanceRecommendation and create a new ACTIVE one from the amended aggregate"
          - "overwrite episode.assigned_interval_months and episode.due_date"
          - "reprice the BillingClaim under the final variant again, incrementing reprice_count"
        note: "Self-loop: an amended report re-runs the whole cascade against a state that is already closed."
      - from: OPEN
        to: CLOSED_DECLINED
        trigger: "POST /screening-episodes/{episode_id}/close with reason in {PATIENT_DECLINED, LOST_TO_FOLLOW_UP}"
        actor: PatientNavigator
        preconditions:
          - "episode.clinical_status == OPEN"
        side_effects:
          - "set episode.closure_reason to the supplied reason"
          - "recompute Patient.open_episode_count and Patient.navigation_priority"
      - from: OPEN
        to: CLOSED_SUPERSEDED
        trigger: "POST /screening-episodes/{episode_id}/close with reason == SUPERSEDED_BY_OTHER_PATHWAY"
        actor: PatientNavigator
        preconditions:
          - "episode.clinical_status == OPEN"
        side_effects:
          - "set episode.closure_reason to SUPERSEDED_BY_OTHER_PATHWAY"
          - "recompute Patient.open_episode_count and Patient.navigation_priority"

  - entity: ScreeningEpisode
    state_field: navigation_status
    shape: cyclic
    initial_state: NOT_STARTED
    terminal_states: [NAVIGATION_COMPLETE]
    note: "Navigation dimension. Its transitions are driven by prep_adherence_score thresholds and never read clinical_status."
    transitions:
      - from: NOT_STARTED
        to: OUTREACH_ACTIVE
        trigger: "POST /screening-episodes/{episode_id}/outreach when the recomputed prep_adherence_score >= PREP_AT_RISK_THRESHOLD (3.00)"
        actor: PatientNavigator
        preconditions:
          - "episode.clinical_status is not in {CLOSED_SURVEILLANCE_SET, CLOSED_DECLINED, CLOSED_SUPERSEDED}"
        side_effects:
          - "append {channel, occurred_at, acknowledged} to episode.outreach_log"
          - "recompute episode.prep_adherence_score via the prep_adherence_score calculation"
      - from: NOT_STARTED
        to: PREP_AT_RISK
        trigger: "POST /screening-episodes/{episode_id}/outreach when the recomputed prep_adherence_score < PREP_AT_RISK_THRESHOLD (3.00)"
        actor: PatientNavigator
        preconditions:
          - "episode.clinical_status is not in {CLOSED_SURVEILLANCE_SET, CLOSED_DECLINED, CLOSED_SUPERSEDED}"
        side_effects:
          - "append to episode.outreach_log and recompute episode.prep_adherence_score"
      - from: OUTREACH_ACTIVE
        to: PREP_AT_RISK
        trigger: "POST /screening-episodes/{episode_id}/outreach when the recomputed prep_adherence_score < PREP_AT_RISK_THRESHOLD (3.00)"
        actor: PatientNavigator
        preconditions:
          - "episode.clinical_status is not in {CLOSED_SURVEILLANCE_SET, CLOSED_DECLINED, CLOSED_SUPERSEDED}"
        side_effects:
          - "append to episode.outreach_log and recompute episode.prep_adherence_score"
      - from: PREP_AT_RISK
        to: OUTREACH_ACTIVE
        trigger: "POST /screening-episodes/{episode_id}/outreach when the recomputed prep_adherence_score >= PREP_AT_RISK_THRESHOLD (3.00)"
        actor: PatientNavigator
        preconditions:
          - "episode.clinical_status is not in {CLOSED_SURVEILLANCE_SET, CLOSED_DECLINED, CLOSED_SUPERSEDED}"
        side_effects:
          - "append to episode.outreach_log and recompute episode.prep_adherence_score"
        note: "Closes the OUTREACH_ACTIVE to PREP_AT_RISK to OUTREACH_ACTIVE cycle; the loop is bounded only by the score threshold, never by a counter."
      - from: OUTREACH_ACTIVE
        to: PREP_CONFIRMED
        trigger: "POST /screening-episodes/{episode_id}/prep-attestation with regimen_completed == true when the recomputed prep_adherence_score >= PREP_CONFIRMED_THRESHOLD (5.00)"
        actor: Patient
        preconditions:
          - "episode.clinical_status is not in {CLOSED_SURVEILLANCE_SET, CLOSED_DECLINED, CLOSED_SUPERSEDED}"
          - "X-User-ID == episode.patient_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "set episode.prep_attestation to COMPLETED"
          - "recompute episode.prep_adherence_score with the attestation bonus applied"
      - from: PREP_AT_RISK
        to: PREP_CONFIRMED
        trigger: "POST /screening-episodes/{episode_id}/prep-attestation with regimen_completed == true when the recomputed prep_adherence_score >= PREP_CONFIRMED_THRESHOLD (5.00)"
        actor: Patient
        preconditions:
          - "X-User-ID == episode.patient_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "set episode.prep_attestation to COMPLETED and recompute episode.prep_adherence_score"
      - from: OUTREACH_ACTIVE
        to: PREP_AT_RISK
        trigger: "POST /screening-episodes/{episode_id}/prep-attestation when the recomputed prep_adherence_score < PREP_CONFIRMED_THRESHOLD (5.00)"
        actor: Patient
        preconditions:
          - "X-User-ID == episode.patient_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "set episode.prep_attestation to COMPLETED or NOT_COMPLETED per regimen_completed and recompute episode.prep_adherence_score"
      - from: PREP_CONFIRMED
        to: NAVIGATION_COMPLETE
        trigger: "POST /procedure-bookings/{booking_id}/complete"
        actor: Endoscopist
        preconditions:
          - "booking.status == IN_PROGRESS"
        side_effects:
          - "no further outreach or attestation is accepted on this episode"
      - from: PREP_CONFIRMED
        to: PREP_AT_RISK
        trigger: "POST /procedure-bookings/{booking_id}/abort with prep_quality_bbps <= 5"
        actor: Endoscopist
        preconditions:
          - "booking.status is in {CHECKED_IN, IN_PROGRESS}"
        side_effects:
          - "reset episode.prep_attestation to NONE so the navigation cycle can resume"
        note: "An inadequate preparation observed endoscopically demotes the navigation dimension even though the patient attested completion."

  - entity: EndoscopySession
    state_field: status
    shape: branching_with_revert
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == PUBLISH"
        actor: PracticeAdmin
        preconditions:
          - "session.status == DRAFT"
        side_effects:
          - "compute session.capacity_minutes and set session.remaining_minutes to capacity_minutes"
      - from: PUBLISHED
        to: COVERAGE_CONFIRMED
        trigger: "POST /endoscopy-sessions/{session_id}/anesthesia-coverage creating an ACTIVE coverage whose covers_full_window is true"
        actor: PracticeAdmin
        preconditions:
          - "session.status == PUBLISHED"
          - "the new coverage's covers_full_window is true, else ERR_COVERAGE_WINDOW_INSUFFICIENT"
        side_effects:
          - "create the AnesthesiaCoverage in status ACTIVE and set its overlap_index"
      - from: COVERAGE_CONFIRMED
        to: PUBLISHED
        trigger: "DELETE /anesthesia-coverage/{coverage_id}"
        actor: PracticeAdmin
        preconditions:
          - "coverage.status == ACTIVE"
          - "no remaining ACTIVE coverage on the session has covers_full_window true"
        side_effects:
          - "set coverage.status to RELEASED so it stops counting toward the clinician's overlap ceiling"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == SUSPEND"
        actor: PracticeAdmin
        preconditions:
          - "session.status == PUBLISHED"
          - "reason is supplied, else ERR_INVALID_REQUEST"
        side_effects:
          - "set session.suspension_reason and stop accepting new bookings"
      - from: COVERAGE_CONFIRMED
        to: SUSPENDED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == SUSPEND"
        actor: PracticeAdmin
        preconditions:
          - "session.status == COVERAGE_CONFIRMED"
          - "reason is supplied, else ERR_INVALID_REQUEST"
        side_effects:
          - "set session.suspension_reason and stop accepting new bookings"
      - from: SUSPENDED
        to: COVERAGE_CONFIRMED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == RESUME when an ACTIVE coverage with covers_full_window true exists"
        actor: PracticeAdmin
        preconditions:
          - "session.status == SUSPENDED"
        side_effects:
          - "clear session.suspension_reason"
        note: "Resume returns to the posture implied by current coverage, not to the posture the session held before suspension."
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == RESUME when no ACTIVE coverage with covers_full_window true exists"
        actor: PracticeAdmin
        preconditions:
          - "session.status == SUSPENDED"
        side_effects:
          - "clear session.suspension_reason"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == CLOSE"
        actor: PracticeAdmin
        preconditions:
          - "no ProcedureBooking on this session has status in {BOOKED, CHECKED_IN, IN_PROGRESS}"
        side_effects:
          - "release every ACTIVE AnesthesiaCoverage on the session to RELEASED"
      - from: COVERAGE_CONFIRMED
        to: CLOSED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == CLOSE"
        actor: PracticeAdmin
        preconditions:
          - "no ProcedureBooking on this session has status in {BOOKED, CHECKED_IN, IN_PROGRESS}"
        side_effects:
          - "release every ACTIVE AnesthesiaCoverage on the session to RELEASED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /endoscopy-sessions/{session_id}/status-actions with action == CLOSE"
        actor: PracticeAdmin
        preconditions:
          - "no ProcedureBooking on this session has status in {BOOKED, CHECKED_IN, IN_PROGRESS}"
        side_effects:
          - "release every ACTIVE AnesthesiaCoverage on the session to RELEASED"

  - entity: ProcedureBooking
    state_field: status
    shape: branching
    initial_state: BOOKED
    terminal_states: [COMPLETED, ABORTED_INADEQUATE_PREP, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /procedure-bookings/{booking_id}/check-in"
        actor: PatientNavigator
        preconditions:
          - "booking.status == BOOKED"
          - "episode.navigation_status == PREP_CONFIRMED, else ERR_PREP_NOT_CONFIRMED"
        side_effects:
          - "no ledger change - the room minutes were already committed at booking time"
      - from: CHECKED_IN
        to: IN_PROGRESS
        trigger: "POST /procedure-bookings/{booking_id}/start"
        actor: Endoscopist
        preconditions:
          - "booking.status == CHECKED_IN"
          - "X-User-ID == booking.performing_endoscopist_id, else ERR_NOT_RESOURCE_OWNER"
          - "the performing Clinician.credential_status == ACTIVE, else ERR_CLINICIAN_CREDENTIAL_SUSPENDED"
          - "when session.anesthesia_mode == MAC the session.status must be COVERAGE_CONFIRMED, else ERR_ANESTHESIA_COVERAGE_REQUIRED"
        side_effects:
          - "stamp booking.updated_at from the logical clock"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /procedure-bookings/{booking_id}/complete"
        actor: Endoscopist
        preconditions:
          - "booking.status == IN_PROGRESS"
          - "X-User-ID == booking.performing_endoscopist_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "record prep_quality_bbps, polyps_removed_count, largest_polyp_mm and specimen_count"
          - "advance episode.clinical_status to PATHOLOGY_PENDING when specimen_count >= 1, otherwise run the no-specimen closure cascade"
          - "set episode.navigation_status to NAVIGATION_COMPLETE"
      - from: CHECKED_IN
        to: ABORTED_INADEQUATE_PREP
        trigger: "POST /procedure-bookings/{booking_id}/abort"
        actor: Endoscopist
        preconditions:
          - "booking.status == CHECKED_IN"
        side_effects:
          - "revert episode.clinical_status to OPEN and demote episode.navigation_status to PREP_AT_RISK when prep_quality_bbps <= 5"
          - "reprice the BillingClaim to the single ABORTED_TECHNICAL line, without releasing room minutes"
      - from: IN_PROGRESS
        to: ABORTED_INADEQUATE_PREP
        trigger: "POST /procedure-bookings/{booking_id}/abort"
        actor: Endoscopist
        preconditions:
          - "booking.status == IN_PROGRESS"
        side_effects:
          - "revert episode.clinical_status to OPEN and demote episode.navigation_status to PREP_AT_RISK when prep_quality_bbps <= 5"
          - "reprice the BillingClaim to the single ABORTED_TECHNICAL line, without releasing room minutes"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /procedure-bookings/{booking_id}/cancel"
        actor: ReferralCoordinator
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "set booking.released_minutes to duration_minutes + session.turnover_minutes and return those minutes to session.remaining_minutes"
          - "revert episode.clinical_status to OPEN"
          - "void the BillingClaim"

  - entity: PathologyReport
    state_field: status
    shape: cyclic
    initial_state: RECEIVED
    terminal_states: []
    transitions:
      - from: RECEIVED
        to: FINALIZED
        trigger: "POST /pathology-reports/{report_id}/finalize"
        actor: Pathologist
        preconditions:
          - "report.status == RECEIVED"
          - "len(report.specimens) >= 1, else ERR_NO_SPECIMENS"
        side_effects:
          - "stamp finalized_at from the logical clock and set routed_to_endoscopist_id to booking.performing_endoscopist_id"
          - "trigger the four-hop surveillance and repricing cascade described on ScreeningEpisode PATHOLOGY_PENDING to CLOSED_SURVEILLANCE_SET"
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /pathology-reports/{report_id}/amend"
        actor: Pathologist
        preconditions:
          - "report.status == FINALIZED"
          - "amendment_reason is supplied, else ERR_INVALID_REQUEST"
        side_effects:
          - "replace report.specimens and report.high_grade_dysplasia, recompute adenoma_count, sessile_serrated_count, largest_adenoma_mm, villous_component and adenocarcinoma_present"
          - "increment report.amendment_count by 1"
          - "exclude this report from every FINALIZED-only aggregate until it is finalized again"
      - from: AMENDED
        to: FINALIZED
        trigger: "POST /pathology-reports/{report_id}/finalize"
        actor: Pathologist
        preconditions:
          - "report.status == AMENDED"
          - "len(report.specimens) >= 1, else ERR_NO_SPECIMENS"
        side_effects:
          - "re-stamp finalized_at from the logical clock"
          - "re-run the surveillance and repricing cascade, superseding the ACTIVE SurveillanceRecommendation"
        note: "Closes the FINALIZED to AMENDED to FINALIZED cycle; each pass moves finalized_at forward, which can move a booking in or out of a PATHOLOGY_FINALIZATION_DATE quality window."

  - entity: BillingClaim
    state_field: status
    shape: cyclic
    initial_state: PROVISIONAL_PRICED
    terminal_states: [VOIDED]
    transitions:
      - from: PROVISIONAL_PRICED
        to: REPRICED
        trigger: "system - the final variant of claim_pricing is applied by the pathology finalize cascade, the no-specimen completion cascade, or a booking abort"
        actor: system
        preconditions:
          - "claim.status == PROVISIONAL_PRICED"
        side_effects:
          - "replace line_items, base_allowed_cents, complexity_tier, allowed_amount_cents, deductible_applied_cents, coinsurance_cents, patient_responsibility_cents and plan_paid_cents"
          - "set claim.variant to FINAL and increment claim.reprice_count by 1"
          - "set booking.final_classification to claim.classification"
      - from: REPRICED
        to: REPRICED
        trigger: "system - the final variant is re-applied after a pathology amendment is finalized"
        actor: system
        preconditions:
          - "claim.status == REPRICED"
        side_effects:
          - "recompute every money field and increment claim.reprice_count by 1"
      - from: REPRICED
        to: FINALIZED
        trigger: "POST /billing-claims/{claim_id}/finalize"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == REPRICED"
        side_effects:
          - "add claim.deductible_applied_cents to Patient.deductible_applied_cents"
          - "add claim.patient_responsibility_cents to Patient.oop_applied_cents"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /billing-claims/{claim_id}/dispute"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == FINALIZED"
          - "dispute_reason is supplied, else ERR_INVALID_REQUEST"
        side_effects:
          - "subtract claim.deductible_applied_cents from Patient.deductible_applied_cents"
          - "subtract claim.patient_responsibility_cents from Patient.oop_applied_cents"
          - "leave every money field on the claim itself unchanged so the compensation is exact"
        note: "Compensating action for finalize - the two patient ledgers must return to the values they held before the finalize."
      - from: DISPUTED
        to: REPRICED
        trigger: "POST /billing-claims/{claim_id}/reprice"
        actor: BillingSpecialist
        preconditions:
          - "claim.status == DISPUTED"
        side_effects:
          - "re-run the final variant of claim_pricing against current booking and pathology state and increment claim.reprice_count by 1"
      - from: PROVISIONAL_PRICED
        to: VOIDED
        trigger: "POST /procedure-bookings/{booking_id}/cancel"
        actor: ReferralCoordinator
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "zero line_items, base_allowed_cents, allowed_amount_cents, deductible_applied_cents, coinsurance_cents, patient_responsibility_cents and plan_paid_cents"
      - from: REPRICED
        to: VOIDED
        trigger: "POST /procedure-bookings/{booking_id}/cancel"
        actor: ReferralCoordinator
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "zero every money field and clear line_items"

  - entity: QualityPeriod
    state_field: status
    shape: linear
    initial_state: OPEN
    terminal_states: [ATTESTED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /quality-periods/{period_id}/lock"
        actor: QualityOfficer
        preconditions:
          - "period.status == OPEN"
          - "date(logical clock) >= period.period_end_date, else ERR_QUALITY_PERIOD_NOT_ENDED"
        side_effects:
          - "run the adenoma_detection_rate calculation under period.attribution_basis and set screening_colonoscopy_count, adenoma_positive_count and adr_pct"
          - "copy Clinician.adr_benchmark_pct into period.benchmark_pct"
          - "set benchmark_result to INSUFFICIENT_VOLUME when screening_colonoscopy_count < MIN_SCREENING_VOLUME, otherwise MET when adr_pct >= benchmark_pct else MISSED"
          - "set remediation_required to true only when benchmark_result == MISSED"
      - from: LOCKED
        to: ATTESTED
        trigger: "POST /quality-periods/{period_id}/attest"
        actor: QualityOfficer
        preconditions:
          - "period.status == LOCKED"
          - "remediation_plan is supplied, else ERR_INVALID_REQUEST"
        side_effects:
          - "store remediation_plan and set attesting_user_id to the acting X-User-ID"

concurrency_rules:
  - rule_id: session-booking-stale-session
    parent_entity: EndoscopySession
    write_endpoint: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
    occ_field: "expected_session_version"
    description: |
      Creating a ProcedureBooking against an EndoscopySession whose version has advanced since the
      client last observed it is rejected. A booking legitimately consumes room minutes and slot
      geometry that another writer may have just consumed, so a create that carries a stale
      expected_session_version has priced its slot against a capacity picture that no longer holds.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
  - rule_id: recommendation-create-stale-episode
    parent_entity: ScreeningEpisode
    write_endpoint: "POST /screening-episodes/{episode_id}/surveillance-recommendations"
    occ_field: "expected_episode_version"
    description: |
      Creating a SurveillanceRecommendation against a ScreeningEpisode whose version has advanced
      since the client last observed it is rejected. An attested override recommendation legitimately
      supersedes the guideline recommendation the finalize cascade produced, so the request cannot be
      rejected on state alone - it is rejected only when the writer's view of the episode is stale.
    error_id: ERR_STALE_EPISODE_VERSION
    http_status: 412

calculations:
  - name: patient_risk_stratification
    trigger: "on POST /patients, recomputing Patient.risk_tier"
    algorithm: threshold
    formula: |
      if patient.ibd_diagnosis == true or patient.prior_crc_history == true:
          risk_tier = "HIGH"
      elif patient.family_history_crc == true:
          risk_tier = "INCREASED"
      else:
          risk_tier = "AVERAGE"
    input_set: "The single Patient row being created; no cross-entity data participates."
    constants: {}
    precision: "exact enum, no arithmetic"

  - name: open_access_risk_screen
    trigger: "on POST /referrals/{referral_id}/triage-actions for actions BEGIN_TRIAGE and RESPOND_INFO, recomputing Referral.risk_screen_result"
    algorithm: threshold
    formula: |
      if referral.asa_class_reported <= MAX_OPEN_ACCESS_ASA_CLASS
         and referral.anticoagulant_reported == false
         and referral.reason != "SYMPTOMATIC_BLEEDING":
          risk_screen_result = "CLEARED_OPEN_ACCESS"
      else:
          risk_screen_result = "OFFICE_VISIT_REQUIRED"
    input_set: "The Referral row's own asa_class_reported, anticoagulant_reported and reason, as most recently revised by a RESPOND_INFO action."
    constants:
      MAX_OPEN_ACCESS_ASA_CLASS: 3
    precision: "exact enum, no arithmetic"

  - name: screening_eligibility
    trigger: "on POST /screening-episodes, setting ScreeningEpisode.eligibility_status and ScreeningEpisode.risk_tier_snapshot"
    algorithm: threshold
    formula: |
      # whole-year age at the episode's index_date
      age_years = index_date.year - birth_date.year
      if (index_date.month, index_date.day) < (birth_date.month, birth_date.day):
          age_years = age_years - 1

      if indication in {"SCREENING_AVERAGE_RISK", "SCREENING_HIGH_RISK"} and patient.prior_crc_history == true:
          eligibility_status = "INELIGIBLE_PRIOR_CRC"
      elif indication == "SCREENING_AVERAGE_RISK":
          if age_years < SCREENING_START_AGE_YEARS or age_years > SCREENING_END_AGE_YEARS:
              eligibility_status = "INELIGIBLE_AGE"
          else:
              eligibility_status = "ELIGIBLE"
      elif indication == "SCREENING_HIGH_RISK":
          if age_years < HIGH_RISK_START_AGE_YEARS:
              eligibility_status = "INELIGIBLE_AGE"
          elif patient.risk_tier not in {"INCREASED", "HIGH"}:
              eligibility_status = "INELIGIBLE_RISK_MISMATCH"
          else:
              eligibility_status = "ELIGIBLE"
      else:  # SURVEILLANCE or DIAGNOSTIC_FOLLOWUP
          eligibility_status = "ELIGIBLE" if age_years >= ADULT_AGE_YEARS else "INELIGIBLE_AGE"
    input_set: "The one Patient row named by patient_id (fields birth_date, prior_crc_history, risk_tier) evaluated against index_date, which is the calendar date of the logical clock at creation. The value is frozen at creation and never revised."
    constants:
      SCREENING_START_AGE_YEARS: 45
      SCREENING_END_AGE_YEARS: 75
      HIGH_RISK_START_AGE_YEARS: 40
      ADULT_AGE_YEARS: 18
    precision: "whole years, inclusive comparisons at both ends (age 45 and age 75 are both eligible for SCREENING_AVERAGE_RISK)"

  - name: episode_due_date
    trigger: "on POST /screening-episodes and inside the positive_noninvasive_followup cascade, setting ScreeningEpisode.due_date"
    algorithm: threshold
    formula: |
      if indication == "DIAGNOSTIC_FOLLOWUP":
          days = EPISODE_DUE_DAYS_DIAGNOSTIC_FOLLOWUP
      else:
          days = EPISODE_DUE_DAYS_STANDARD
      due_date = index_date + days days

      # re-entry - only inside the positive_noninvasive_followup cascade, after the patient's
      # navigation_priority has been recomputed to HIGH by cascade hop 3
      if patient.navigation_priority == "HIGH":
          due_date = index_date + EPISODE_DUE_DAYS_HIGH_PRIORITY days
    input_set: "The episode's own indication and index_date, plus Patient.navigation_priority as it stands after the cascade hop that recomputes it. Outside the cascade the second branch never runs, because navigation_priority is read before any episode is created."
    constants:
      EPISODE_DUE_DAYS_STANDARD: 180
      EPISODE_DUE_DAYS_DIAGNOSTIC_FOLLOWUP: 90
      EPISODE_DUE_DAYS_HIGH_PRIORITY: 30
      NAVIGATION_HIGH_PRIORITY_EPISODES: 2
    precision: "whole calendar days, YYYY-MM-DD output"

  - name: prep_adherence_score
    trigger: "on POST /screening-episodes/{episode_id}/outreach and POST /screening-episodes/{episode_id}/prep-attestation, recomputing ScreeningEpisode.prep_adherence_score"
    algorithm: weighted_scoring
    formula: |
      # full recompute from the whole outreach_log every time - never an incremental update
      raw = 0.00
      for entry in episode.outreach_log:            # iteration order is outreach_log insertion order
          weight = CHANNEL_WEIGHT[entry.channel]
          ack    = ACK_MULTIPLIER_ACKED if entry.acknowledged else ACK_MULTIPLIER_UNACKED
          days_ago = floor((clock_now - entry.occurred_at) / 86400 seconds)
          decay  = min(1.00, max(DECAY_FLOOR, 1.00 - DECAY_PER_DAY * days_ago))
          contribution = round_half_up(weight * ack * decay, 2)     # ROUNDING IS PER TOUCHPOINT
          raw = raw + contribution                                   # then summed - never sum-then-round

      if episode.prep_attestation == "COMPLETED":
          bonus = ATTESTATION_BONUS_COMPLETED
      elif episode.prep_attestation == "NOT_COMPLETED":
          bonus = ATTESTATION_BONUS_NOT_COMPLETED
      else:
          bonus = 0.00

      prep_adherence_score = round_half_up(min(SCORE_MAX, max(SCORE_MIN, raw + bonus)), 2)
    input_set: "Every entry in this episode's outreach_log (the log is append-only, so no status filter applies), in insertion order, plus the episode's own prep_attestation. No other episode's outreach participates."
    constants:
      CHANNEL_WEIGHT: { PHONE: 3.0, SMS: 2.0, PORTAL: 1.5, MAIL: 1.0 }
      ACK_MULTIPLIER_ACKED: 1.0
      ACK_MULTIPLIER_UNACKED: 0.4
      DECAY_PER_DAY: 0.05
      DECAY_FLOOR: 0.25
      ATTESTATION_BONUS_COMPLETED: 2.50
      ATTESTATION_BONUS_NOT_COMPLETED: -1.00
      SCORE_MIN: 0.00
      SCORE_MAX: 10.00
      PREP_AT_RISK_THRESHOLD: 3.00
      PREP_CONFIRMED_THRESHOLD: 5.00
    precision: "2 decimal places, round_half_up, applied once per touchpoint and once to the final clamped total"

  - name: surveillance_interval_months
    trigger: "inside the pathology finalize cascade and the no-specimen completion cascade, setting SurveillanceRecommendation.computed_interval_months, assigned_interval_months and next_due_date"
    algorithm: constraint_propagation
    formula: |
      # ---- stage 1: findings tier, first matching branch wins, order is normative ----
      if agg.high_grade_dysplasia == true or agg.adenocarcinoma_present == true:
          base = 6
      elif agg.adenoma_count == 0 and agg.sessile_serrated_count == 0:
          base = 120
      elif agg.adenoma_count >= 10:
          base = 12
      elif agg.adenoma_count >= 5 or agg.largest_adenoma_mm >= 10 or agg.villous_component == true:
          base = 36
      elif agg.sessile_serrated_count >= 1:
          base = 60
      else:
          base = 84

      # ---- stage 2: patient risk cap, from the episode's frozen snapshot ----
      cap = RISK_TIER_CAP_MONTHS[episode.risk_tier_snapshot]
      stage2 = min(base, cap)

      # ---- stage 3: preparation-quality cap, then the global floor ----
      stage3 = min(stage2, POOR_PREP_CAP_MONTHS) if booking.prep_quality_bbps <= POOR_PREP_BBPS_MAX else stage2
      computed_interval_months = max(stage3, MIN_INTERVAL_MONTHS)

      # ---- override ----
      if override_interval_months is not null:
          assigned_interval_months = override_interval_months
          basis = "OVERRIDE_ATTESTED"
      else:
          assigned_interval_months = computed_interval_months
          basis = "GUIDELINE"

      # ---- next_due_date: add whole months to the procedure date, clamping the day ----
      anchor = date(booking.slot_start_utc)
      next_due_date = anchor + assigned_interval_months months, with the day clamped to the
                      last day of the target month when the anchor day does not exist there
    input_set: |
      agg is the aggregate over the specimens of every PathologyReport whose booking_id == the
      episode's booking and whose status == FINALIZED (reports in status RECEIVED or AMENDED are
      excluded): adenoma_count, sessile_serrated_count and villous_component are summed or OR-ed
      across those reports, largest_adenoma_mm is the maximum over them (0 when there are none),
      and high_grade_dysplasia / adenocarcinoma_present are true when any included report has them.
      When no FINALIZED report exists the aggregate is all zeros / false, which reaches the base 120
      branch. episode.risk_tier_snapshot and booking.prep_quality_bbps are read from the frozen
      values on those rows.
    constants:
      RISK_TIER_CAP_MONTHS: { AVERAGE: 120, INCREASED: 60, HIGH: 24 }
      POOR_PREP_CAP_MONTHS: 12
      POOR_PREP_BBPS_MAX: 5
      MIN_INTERVAL_MONTHS: 6
      MAX_OVERRIDE_INTERVAL_MONTHS: 120
      MAX_OVERRIDE_DELTA_MONTHS: 48
    precision: "whole months; the three stages compose as nested min/max and the stage order is normative - applying the risk cap before the findings tier, or the prep cap before the risk cap, yields different intervals"

  - name: claim_pricing
    trigger: "on POST /endoscopy-sessions/{session_id}/procedure-bookings (provisional variant) and inside the pathology finalize cascade, the no-specimen completion cascade and the abort repricing (final variant), setting every money field on BillingClaim plus ProcedureBooking.planned_classification and ProcedureBooking.final_classification"
    algorithm: waterfall_allocation
    formula: |
      # ===== STEP 1 - line items, in this fixed order =====
      polyps = 0 if variant == "PROVISIONAL" else booking.polyps_removed_count
      lines = []
      lines.append({ code: "FACILITY",
                     allowed_cents: FACILITY_BASE_CENTS + FACILITY_PER_MINUTE_CENTS * booking.duration_minutes })
      lines.append({ code: "PROFESSIONAL",
                     allowed_cents: PROF_BASE_CENTS + POLYPECTOMY_ADDON_CENTS * polyps })
      if session.anesthesia_mode == "MAC":
          lines.append({ code: "ANESTHESIA",
                         allowed_cents: ANESTHESIA_BASE_CENTS + ANESTHESIA_PER_MINUTE_CENTS * booking.duration_minutes })

      # abort override - a single technical line replaces the schedule above
      if booking.status == "ABORTED_INADEQUATE_PREP":
          lines = [ { code: "ABORTED_TECHNICAL", allowed_cents: ABORT_TECHNICAL_FEE_CENTS } ]

      # ===== STEP 2 - base total =====
      base_allowed_cents = sum(line.allowed_cents for line in lines)

      # ===== STEP 3 - complexity outlier tier, selected from base_allowed_cents ONLY =====
      if base_allowed_cents >= OUTLIER_TIER_3_FLOOR_CENTS:      complexity_tier = "TIER_3"
      elif base_allowed_cents >= OUTLIER_TIER_2_FLOOR_CENTS:    complexity_tier = "TIER_2"
      else:                                                     complexity_tier = "TIER_1"
      addon = { TIER_1: 0, TIER_2: OUTLIER_TIER_2_ADDON_CENTS, TIER_3: OUTLIER_TIER_3_ADDON_CENTS }[complexity_tier]
      lines[0].allowed_cents = lines[0].allowed_cents + addon      # the addon rides the first line
      allowed_amount_cents = base_allowed_cents + addon
      # the tier is NEVER re-selected from allowed_amount_cents - a base of 247250 stays TIER_2
      # even though the adjusted total 255750 sits above OUTLIER_TIER_3_FLOOR_CENTS

      # ===== STEP 4 - classification =====
      provisional_classification =
          "SCREENING_PREVENTIVE" if episode.indication in {"SCREENING_AVERAGE_RISK", "SCREENING_HIGH_RISK", "SURVEILLANCE"}
                                    or (episode.indication == "DIAGNOSTIC_FOLLOWUP"
                                        and episode.origin == "NONINVASIVE_POSITIVE"
                                        and plan.modifier_33_honored == true)
          else "DIAGNOSTIC"
      if variant == "PROVISIONAL" or booking.status == "ABORTED_INADEQUATE_PREP":
          classification = provisional_classification
      else:
          classification = provisional_classification
          if booking.polyps_removed_count >= 1 and plan.polypectomy_carveout == "DIAGNOSTIC_CONVERTED":
              classification = "DIAGNOSTIC"

      # ===== STEP 5 - cost sharing, walked over `lines` in the SAME fixed order =====
      deductible_remaining = max(0, plan.deductible_cents - patient.deductible_applied_cents)
      patient_total = 0; deductible_applied_cents = 0; coinsurance_cents = 0
      for line in lines:
          if classification == "SCREENING_PREVENTIVE":
              if line.code == "ANESTHESIA" and plan.anesthesia_bundled == false:
                  line_coins = round_half_up(line.allowed_cents * plan.diagnostic_coinsurance_pct, 0)
              else:
                  line_coins = round_half_up(line.allowed_cents * (1.00 - plan.preventive_coverage_pct), 0)
              line_ded = 0
          else:
              line_ded = min(line.allowed_cents, deductible_remaining)
              deductible_remaining = deductible_remaining - line_ded
              line_coins = round_half_up((line.allowed_cents - line_ded) * plan.diagnostic_coinsurance_pct, 0)
          deductible_applied_cents = deductible_applied_cents + line_ded
          coinsurance_cents = coinsurance_cents + line_coins
          patient_total = patient_total + line_ded + line_coins
      # ROUNDING IS PER LINE then summed - sum-then-round diverges (39367 vs 39366 at 0.175)

      # ===== STEP 6 - out-of-pocket truncation =====
      patient_responsibility_cents = min(patient_total, max(0, plan.out_of_pocket_max_cents - patient.oop_applied_cents))
      plan_paid_cents = allowed_amount_cents - patient_responsibility_cents
    input_set: "The one ProcedureBooking being priced, the EndoscopySession that holds it (anesthesia_mode), the ScreeningEpisode it satisfies (indication, origin), the InsurancePlan named by claim.insurance_plan_id, and the Patient's deductible_applied_cents / oop_applied_cents ledgers as they stand at pricing time (only BillingClaim rows in status FINALIZED have contributed to those ledgers)."
    constants:
      FACILITY_BASE_CENTS: 78000
      FACILITY_PER_MINUTE_CENTS: 950
      PROF_BASE_CENTS: 41500
      POLYPECTOMY_ADDON_CENTS: 13750
      ANESTHESIA_BASE_CENTS: 22000
      ANESTHESIA_PER_MINUTE_CENTS: 410
      OUTLIER_TIER_2_FLOOR_CENTS: 150000
      OUTLIER_TIER_3_FLOOR_CENTS: 250000
      OUTLIER_TIER_2_ADDON_CENTS: 8500
      OUTLIER_TIER_3_ADDON_CENTS: 19000
      ABORT_TECHNICAL_FEE_CENTS: 30000
    precision: "integer cents; round_half_up to 0 decimals applied per line item, then summed; the six steps are evaluated in the stated order and the tier in step 3 is never re-derived from the step-3 output"
    variants:
      - name: provisional
        when: "at POST /endoscopy-sessions/{session_id}/procedure-bookings, when polyps_removed_count is not yet known"
        difference: "polyps is forced to 0, so the PROFESSIONAL line carries no polypectomy addon, and the polypectomy carveout in step 4 cannot fire - the classification is the provisional one. Result is written to booking.planned_classification."
      - name: final
        when: "inside the pathology finalize cascade, the no-specimen completion cascade, and any later reprice"
        difference: "polyps is booking.polyps_removed_count, which enlarges the PROFESSIONAL line and can push base_allowed_cents into a higher outlier tier, and the DIAGNOSTIC_CONVERTED carveout can flip the classification from SCREENING_PREVENTIVE to DIAGNOSTIC, which switches step 5 from preventive coverage to the deductible waterfall. Result is written to booking.final_classification."

  - name: adenoma_detection_rate
    trigger: "on POST /quality-periods/{period_id}/lock, setting QualityPeriod.screening_colonoscopy_count, adenoma_positive_count, adr_pct, benchmark_pct, benchmark_result and remediation_required"
    algorithm: aggregation
    formula: |
      denominator_bookings = []
      for b in every ProcedureBooking with b.status == "COMPLETED"
                and b.performing_endoscopist_id == period.endoscopist_id
                and episode_of(b).indication in {"SCREENING_AVERAGE_RISK", "SCREENING_HIGH_RISK"}:
          finalized_reports = [ r for r in PathologyReport where r.booking_id == b.id and r.status == "FINALIZED" ]
          if period.attribution_basis == "PROCEDURE_DATE":
              attribution_date = date(b.slot_start_utc)
          else:  # PATHOLOGY_FINALIZATION_DATE
              if len(finalized_reports) == 0:
                  continue                      # not attributable under this basis - excluded entirely
              attribution_date = min(date(r.finalized_at) for r in finalized_reports)
          if period.period_start_date <= attribution_date <= period.period_end_date:
              denominator_bookings.append(b)

      screening_colonoscopy_count = len(denominator_bookings)
      adenoma_positive_count = count of b in denominator_bookings for which at least one
          PathologyReport with booking_id == b.id and status == "FINALIZED" has adenoma_count >= 1

      if screening_colonoscopy_count == 0:
          adr_pct = null
      else:
          adr_pct = round_half_up(adenoma_positive_count / screening_colonoscopy_count, 4)

      benchmark_pct = clinician.adr_benchmark_pct        # snapshot taken at lock time

      if screening_colonoscopy_count < MIN_SCREENING_VOLUME:
          benchmark_result = "INSUFFICIENT_VOLUME"; remediation_required = false
      elif adr_pct >= benchmark_pct:
          benchmark_result = "MET";                remediation_required = false
      else:
          benchmark_result = "MISSED";             remediation_required = true
    input_set: "ProcedureBooking rows in status COMPLETED only (BOOKED, CHECKED_IN, IN_PROGRESS, ABORTED_INADEQUATE_PREP and CANCELLED never enter either the numerator or the denominator), restricted to the period's endoscopist and to episodes whose indication is a screening indication, and windowed by the attribution date with BOTH endpoints inclusive. Only PathologyReport rows in status FINALIZED are consulted; a report in status AMENDED is invisible to both the numerator and the PATHOLOGY_FINALIZATION_DATE attribution. When a booking has several FINALIZED reports the earliest finalized_at is the attribution date - the aggregate is order-free and needs no tie-break."
    constants:
      MIN_SCREENING_VOLUME: 1
    precision: "adr_pct is 4 decimal places, round_half_up; null (not 0.0000) when the denominator is zero"
    variants:
      - name: procedure_date_attribution
        when: "period.attribution_basis == PROCEDURE_DATE"
        difference: "A booking is attributed by date(slot_start_utc), so a completed exam whose pathology is finalized after period_end_date still counts in the denominator, and it counts in the numerator only if a FINALIZED report with adenoma_count >= 1 exists at lock time."
      - name: pathology_finalization_date_attribution
        when: "period.attribution_basis == PATHOLOGY_FINALIZATION_DATE"
        difference: "A booking is attributed by the earliest finalized_at among its FINALIZED reports, and a booking with no FINALIZED report is dropped from the denominator altogether - so the same completed exams yield a different denominator, a different numerator and a different adr_pct than under PROCEDURE_DATE."

  - name: room_slot_feasibility
    trigger: "on POST /endoscopy-sessions/{session_id}/procedure-bookings, before the booking row is created"
    algorithm: interval_merge
    formula: |
      slot_end_utc      = slot_start_utc + duration_minutes minutes
      occupancy_end_utc = slot_end_utc + session.turnover_minutes minutes

      # window containment - the whole occupancy interval, turnover included, must fit
      if not (slot_start_utc >= session.window_start_utc and occupancy_end_utc <= session.window_end_utc):
          reject ERR_SLOT_OUTSIDE_SESSION_WINDOW

      # buffered single occupancy - closed start, open end, so touching intervals do NOT overlap
      for other in ProcedureBooking where other.session_id == session.id
              and other.status in {"BOOKED","CHECKED_IN","IN_PROGRESS","COMPLETED","ABORTED_INADEQUATE_PREP"}:
          if slot_start_utc < other.occupancy_end_utc and other.slot_start_utc < occupancy_end_utc:
              reject ERR_SLOT_OVERLAP

      # headcount ceiling
      if count(ProcedureBooking where session_id == session.id and status != "CANCELLED") >= session.max_procedures:
          reject ERR_SESSION_CAPACITY_EXCEEDED
    input_set: "ProcedureBooking rows on this session whose status is in {BOOKED, CHECKED_IN, IN_PROGRESS, COMPLETED, ABORTED_INADEQUATE_PREP}; CANCELLED rows are excluded from the overlap sweep, and the headcount ceiling counts every status except CANCELLED."
    constants: {}
    precision: "whole minutes; interval geometry is [slot_start_utc, occupancy_end_utc) - half-open, so a slot starting exactly at another slot's occupancy_end_utc is accepted"

  - name: anesthesia_overlap_load
    trigger: "on POST /endoscopy-sessions/{session_id}/anesthesia-coverage, before the coverage row is created"
    algorithm: interval_merge
    formula: |
      covers_full_window = (coverage_start_utc <= session.window_start_utc
                            and coverage_end_utc >= session.window_end_utc)
      if not covers_full_window:
          reject ERR_COVERAGE_WINDOW_INSUFFICIENT

      candidate = [coverage_start_utc, coverage_end_utc)
      existing  = [ c for c in AnesthesiaCoverage
                    where c.anesthesia_clinician_id == anesthesia_clinician_id and c.status == "ACTIVE" ]

      # sweep the candidate interval's start points plus every existing start point inside it
      event_points = [coverage_start_utc] + [ c.coverage_start_utc for c in existing
                                             if coverage_start_utc <= c.coverage_start_utc < coverage_end_utc ]
      peak = 0
      for t in event_points:
          load = 1 + count(c in existing where c.coverage_start_utc <= t < c.coverage_end_utc)
          peak = max(peak, load)
      overlap_index = 1 + count(c in existing where c.coverage_start_utc <= coverage_start_utc < c.coverage_end_utc)

      if peak > clinician.max_overlapping_rooms:
          reject ERR_ANESTHESIA_CONCURRENCY_EXCEEDED
    input_set: "AnesthesiaCoverage rows of the same anesthesia_clinician_id whose status == ACTIVE, across every EndoscopySession; RELEASED rows are excluded and stop counting immediately."
    constants: {}
    precision: "whole minutes; interval geometry is [coverage_start_utc, coverage_end_utc) - half-open, so a coverage beginning exactly when another ends adds no load, which is the opposite adjacency treatment from the buffered room interval only in that no turnover buffer is appended"

  - name: session_capacity_ledger
    trigger: "on POST /endoscopy-sessions/{session_id}/status-actions with action == PUBLISH, on POST /endoscopy-sessions/{session_id}/procedure-bookings, and on POST /procedure-bookings/{booking_id}/cancel"
    algorithm: aggregation
    formula: |
      capacity_minutes  = whole_minutes(session.window_end_utc - session.window_start_utc)
      booked_minutes    = sum(b.duration_minutes + session.turnover_minutes
                              for b in ProcedureBooking where b.session_id == session.id
                              and b.status in {"BOOKED","CHECKED_IN","IN_PROGRESS","COMPLETED","ABORTED_INADEQUATE_PREP"})
      remaining_minutes = capacity_minutes - booked_minutes
      # invariant: booked_minutes + remaining_minutes == capacity_minutes at every observable instant
      # cancel is the exact compensation of create: released_minutes == duration_minutes + turnover_minutes
      # abort is NOT a compensation - an aborted booking keeps its minutes committed
    input_set: "ProcedureBooking rows on this session whose status is in {BOOKED, CHECKED_IN, IN_PROGRESS, COMPLETED, ABORTED_INADEQUATE_PREP}; CANCELLED rows contribute nothing, which is what makes cancel an exact compensation."
    constants: {}
    precision: "whole minutes, full recompute on every mutation - never an incremental adjustment"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the eight roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "request body and query parameters conform to the endpoint's input schema - required fields present, enums in range, integers within their declared bounds, dates in YYYY-MM-DD form, instants in ISO 8601 UTC form, limit within 1-100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "every path-templated id resolves to an existing row, validated left to right along the path"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_COVERAGE_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_PATHOLOGY_NOT_FOUND | ERR_RECOMMENDATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_QUALITY_PERIOD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_CLINICIAN_NOT_FOUND | ERR_EPISODE_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_PATHOLOGY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /patients, POST /endoscopy-sessions, POST /endoscopy-sessions/{session_id}/anesthesia-coverage, POST /referrals, POST /screening-episodes, POST /endoscopy-sessions/{session_id}/procedure-bookings, POST /screening-episodes/{episode_id}/surveillance-recommendations, POST /quality-periods"
  - priority: 6
    category: existence
    check: "for an entity_backed role the acting X-User-ID owns the addressed resource - Patient must equal Patient.id / ScreeningEpisode.patient_id, Endoscopist must equal ProcedureBooking.performing_endoscopist_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /patients/{patient_id}, GET /screening-episodes/{episode_id}, POST /screening-episodes/{episode_id}/prep-attestation, POST /procedure-bookings/{booking_id}/start, POST /procedure-bookings/{booking_id}/complete, POST /procedure-bookings/{booking_id}/abort"
  - priority: 7
    category: state
    check: "the referral is in a status from which the requested triage action is declared in the Referral state machine"
    error_id: ERR_INVALID_REFERRAL_STATE
    http_status: 409
    applies_to: "POST /referrals/{referral_id}/triage-actions"
  - priority: 8
    category: state
    check: "the episode's clinical_status admits the operation - close and outreach and prep-attestation and booking create require a non-closed clinical_status, and surveillance-recommendation create requires clinical_status == CLOSED_SURVEILLANCE_SET"
    error_id: ERR_INVALID_EPISODE_STATE
    http_status: 409
    applies_to: "POST /screening-episodes/{episode_id}/close, POST /screening-episodes/{episode_id}/outreach, POST /screening-episodes/{episode_id}/prep-attestation, POST /screening-episodes/{episode_id}/noninvasive-tests, POST /endoscopy-sessions/{session_id}/procedure-bookings, POST /screening-episodes/{episode_id}/surveillance-recommendations"
  - priority: 9
    category: state
    check: "the requested session status action is declared from the session's current status in the EndoscopySession state machine, and CLOSE additionally requires that no ProcedureBooking on the session has status in {BOOKED, CHECKED_IN, IN_PROGRESS}"
    error_id: ERR_INVALID_SESSION_STATE
    http_status: 409
    applies_to: "POST /endoscopy-sessions/{session_id}/status-actions, POST /endoscopy-sessions/{session_id}/anesthesia-coverage, DELETE /anesthesia-coverage/{coverage_id}"
  - priority: 10
    category: state
    check: "session.status is in {PUBLISHED, COVERAGE_CONFIRMED} - a DRAFT, SUSPENDED or CLOSED block accepts no new bookings"
    error_id: ERR_SESSION_NOT_ACCEPTING_BOOKINGS
    http_status: 409
    applies_to: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
  - priority: 11
    category: state
    check: "the booking is in a status from which the requested action is declared in the ProcedureBooking state machine"
    error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    applies_to: "POST /procedure-bookings/{booking_id}/check-in, POST /procedure-bookings/{booking_id}/start, POST /procedure-bookings/{booking_id}/complete, POST /procedure-bookings/{booking_id}/abort, POST /procedure-bookings/{booking_id}/cancel, POST /procedure-bookings/{booking_id}/pathology-reports"
  - priority: 12
    category: state
    check: "the pathology report status admits the action - finalize requires status in {RECEIVED, AMENDED}, amend requires status == FINALIZED"
    error_id: ERR_INVALID_PATHOLOGY_STATE
    http_status: 409
    applies_to: "POST /pathology-reports/{report_id}/finalize, POST /pathology-reports/{report_id}/amend"
  - priority: 13
    category: state
    check: "the claim status admits the action - finalize requires REPRICED, dispute requires FINALIZED, reprice requires DISPUTED"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /billing-claims/{claim_id}/finalize, POST /billing-claims/{claim_id}/dispute, POST /billing-claims/{claim_id}/reprice"
  - priority: 14
    category: state
    check: "the quality period status admits the action - lock requires OPEN, attest requires LOCKED"
    error_id: ERR_INVALID_QUALITY_PERIOD_STATE
    http_status: 409
    applies_to: "POST /quality-periods/{period_id}/lock, POST /quality-periods/{period_id}/attest"
  - priority: 15
    category: state
    check: "the non-invasive test is still in result PENDING"
    error_id: ERR_TEST_ALREADY_RESULTED
    http_status: 409
    applies_to: "POST /noninvasive-tests/{test_id}/result"
  - priority: 16
    category: state
    check: "expected_session_version equals the current EndoscopySession.version (concurrency rule session-booking-stale-session)"
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
  - priority: 17
    category: state
    check: "expected_episode_version equals the current ScreeningEpisode.version (concurrency rule recommendation-create-stale-episode)"
    error_id: ERR_STALE_EPISODE_VERSION
    http_status: 412
    applies_to: "POST /screening-episodes/{episode_id}/surveillance-recommendations"
  - priority: 18
    category: business_safety
    check: "ACCEPT_OPEN_ACCESS requires the recomputed risk_screen_result == CLEARED_OPEN_ACCESS"
    error_id: ERR_OPEN_ACCESS_RISK_SCREEN_FAILED
    http_status: 422
    applies_to: "POST /referrals/{referral_id}/triage-actions"
  - priority: 19
    category: business_safety
    check: "the performing Clinician.credential_status == ACTIVE"
    error_id: ERR_CLINICIAN_CREDENTIAL_SUSPENDED
    http_status: 422
    applies_to: "POST /procedure-bookings/{booking_id}/start"
  - priority: 20
    category: business_safety
    check: "the episode's patient has asa_class <= PREPROCEDURE_MAX_UNSCREENED_ASA_CLASS (3), or the episode carries a referral_id whose Referral.status == ACCEPTED_OFFICE_VISIT - an ASA 4 or 5 patient may not be slotted straight into the suite"
    error_id: ERR_PREPROCEDURE_RISK_UNCLEARED
    http_status: 422
    applies_to: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
  - priority: 21
    category: business_safety
    check: "the episode's navigation_status == PREP_CONFIRMED at check-in"
    error_id: ERR_PREP_NOT_CONFIRMED
    http_status: 422
    applies_to: "POST /procedure-bookings/{booking_id}/check-in"
  - priority: 22
    category: business_safety
    check: "when session.anesthesia_mode == MAC the session.status must be COVERAGE_CONFIRMED at the moment the procedure starts"
    error_id: ERR_ANESTHESIA_COVERAGE_REQUIRED
    http_status: 409
    applies_to: "POST /procedure-bookings/{booking_id}/start"
  - priority: 23
    category: business_referential
    check: "a Clinician referenced as lead_endoscopist_id, performing_endoscopist_id or QualityPeriod.endoscopist_id has clinician_type == ENDOSCOPIST, and a Clinician referenced as anesthesia_clinician_id has clinician_type == ANESTHESIA"
    error_id: ERR_CLINICIAN_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /endoscopy-sessions, POST /endoscopy-sessions/{session_id}/anesthesia-coverage, POST /endoscopy-sessions/{session_id}/procedure-bookings, POST /quality-periods"
  - priority: 24
    category: business_referential
    check: "when referral_id is supplied the Referral.status is in {ACCEPTED_OPEN_ACCESS, ACCEPTED_OFFICE_VISIT}"
    error_id: ERR_REFERRAL_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /screening-episodes"
  - priority: 25
    category: business_referential
    check: "the episode's eligibility_status == ELIGIBLE"
    error_id: ERR_EPISODE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
  - priority: 26
    category: business_referential
    check: "the PathologyReport named by pathology_report_id has status == FINALIZED and its booking_id belongs to the addressed episode"
    error_id: ERR_PATHOLOGY_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /screening-episodes/{episode_id}/surveillance-recommendations"
  - priority: 27
    category: business_temporal
    check: "slot_start_utc >= session.window_start_utc and slot_end_utc + session.turnover_minutes <= session.window_end_utc"
    error_id: ERR_SLOT_OUTSIDE_SESSION_WINDOW
    http_status: 422
    applies_to: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
  - priority: 28
    category: business_temporal
    check: "the candidate occupancy interval [slot_start_utc, slot_end_utc + turnover_minutes) is disjoint from every existing occupancy interval on the session whose booking status is in {BOOKED, CHECKED_IN, IN_PROGRESS, COMPLETED, ABORTED_INADEQUATE_PREP}"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /endoscopy-sessions/{session_id}/procedure-bookings"
  - priority: 29
    category: business_temporal
    check: "the peak number of this anesthesia clinician's ACTIVE half-open coverage intervals containing any instant of the candidate interval, the candidate included, does not exceed Clinician.max_overlapping_rooms"
    error_id: ERR_ANESTHESIA_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /endoscopy-sessions/{session_id}/anesthesia-coverage"
  - priority: 30
    category: business_temporal
    check: "coverage_start_utc <= session.window_start_utc and coverage_end_utc >= session.window_end_utc"
    error_id: ERR_COVERAGE_WINDOW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /endoscopy-sessions/{session_id}/anesthesia-coverage"
  - priority: 31
    category: business_temporal
    check: "the calendar date of the logical clock is on or after period_end_date"
    error_id: ERR_QUALITY_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /quality-periods/{period_id}/lock"
  - priority: 32
    category: business_temporal
    check: "the requested [period_start_date, period_end_date] window does not intersect any existing QualityPeriod with the same endoscopist_id AND the same attribution_basis; windows differing in attribution_basis may overlap freely"
    error_id: ERR_QUALITY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /quality-periods"
  - priority: 33
    category: business_constraint
    check: "InsurancePlan.plan_code, Patient.mrn, Clinician.npi and PathologyReport.accession_number are each unique across their own entity"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /insurance-plans, POST /patients, POST /clinicians, POST /procedure-bookings/{booking_id}/pathology-reports"
  - priority: 34
    category: business_constraint
    check: "the patient has no other ScreeningEpisode with the same indication whose clinical_status is in {OPEN, PROCEDURE_SCHEDULED, PATHOLOGY_PENDING}"
    error_id: ERR_DUPLICATE_OPEN_EPISODE
    http_status: 409
    applies_to: "POST /screening-episodes"
  - priority: 35
    category: business_constraint
    check: "the report carries at least one specimen at finalize time"
    error_id: ERR_NO_SPECIMENS
    http_status: 422
    applies_to: "POST /pathology-reports/{report_id}/finalize"
  - priority: 36
    category: business_constraint
    check: "when override_interval_months is supplied it satisfies MIN_INTERVAL_MONTHS (6) <= override <= MAX_OVERRIDE_INTERVAL_MONTHS (120) and abs(override - computed_interval_months) <= MAX_OVERRIDE_DELTA_MONTHS (48), and override_reason is non-empty"
    error_id: ERR_OVERRIDE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /screening-episodes/{episode_id}/surveillance-recommendations"
  - priority: 37
    category: business_constraint
    check: "an override SurveillanceRecommendation is attested by a different person than the one who performed the anchoring procedure - X-User-ID != ProcedureBooking.performing_endoscopist_id; a GUIDELINE-basis recommendation carries no such restriction"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /screening-episodes/{episode_id}/surveillance-recommendations"
  - priority: 38
    category: business_fiscal
    check: "the count of ProcedureBooking rows on the session whose status != CANCELLED is below session.max_procedures"
    error_id: ERR_SESSION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /endoscopy-sessions/{session_id}/procedure-bookings"

endpoints:
  - method: POST
    path: "/insurance-plans"
    description: "Register a payer plan and its cost-sharing terms"
    roles: [PracticeAdmin]
    code: 201
    input: [plan_code, payer_name, "preventive_coverage_pct?", "diagnostic_coinsurance_pct?", "deductible_cents?", "out_of_pocket_max_cents?", "polypectomy_carveout?", "modifier_33_honored?", "anesthesia_bundled?"]
    output: InsurancePlan
    side_effects: ["rejects a duplicate plan_code with ERR_DUPLICATE_IDENTIFIER"]
  - method: GET
    path: "/insurance-plans/{plan_id}"
    description: "Read one payer plan"
    roles: [PracticeAdmin, BillingSpecialist]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []
  - method: POST
    path: "/clinicians"
    description: "Register an endoscopist or an anesthesia clinician"
    roles: [PracticeAdmin]
    code: 201
    input: [npi, full_name, clinician_type, "max_overlapping_rooms?", "adr_benchmark_pct?", "credential_status?"]
    output: Clinician
    side_effects: ["rejects a duplicate npi with ERR_DUPLICATE_IDENTIFIER"]
  - method: GET
    path: "/clinicians/{clinician_id}"
    description: "Read one clinician including the supervision ceiling and the ADR benchmark"
    roles: [PracticeAdmin, QualityOfficer, ReferralCoordinator, Endoscopist]
    code: 200
    input: []
    output: Clinician
    side_effects: []
  - method: POST
    path: "/patients"
    description: "Register a patient and stratify colorectal cancer risk"
    roles: [PracticeAdmin, ReferralCoordinator]
    code: 201
    input: [mrn, birth_date, insurance_plan_id, "family_history_crc?", "ibd_diagnosis?", "prior_crc_history?", "anticoagulant_therapy?", "asa_class?"]
    output: Patient
    side_effects: ["runs patient_risk_stratification to set risk_tier", "initialises deductible_applied_cents, oop_applied_cents and open_episode_count to 0 and navigation_priority to ROUTINE"]
  - method: GET
    path: "/patients/{patient_id}"
    description: "Read one patient including the deductible and out-of-pocket ledgers"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: ["role Patient may read only its own row, else ERR_NOT_RESOURCE_OWNER"]
  - method: GET
    path: "/patients"
    description: "List patients, filterable by plan, risk tier and navigation priority"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator]
    code: 200
    input: ["insurance_plan_id?", "risk_tier?", "navigation_priority?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, decay and window rule reads this clock."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the logical clock consulted by episode_due_date, prep_adherence_score decay, pathology finalized_at, quality period locking and every created_at / updated_at stamp"]
  - method: POST
    path: "/endoscopy-sessions"
    description: "Create an endoscopy suite room block in DRAFT"
    roles: [PracticeAdmin]
    code: 201
    input: [room_code, session_date, window_start_utc, window_end_utc, lead_endoscopist_id, "anesthesia_mode?", "turnover_minutes?", "max_procedures?"]
    output: EndoscopySession
    side_effects: ["computes capacity_minutes from the window", "rejects a lead whose clinician_type != ENDOSCOPIST with ERR_CLINICIAN_TYPE_MISMATCH"]
  - method: GET
    path: "/endoscopy-sessions/{session_id}"
    description: "Read one room block including capacity_minutes, booked_minutes, remaining_minutes and version"
    roles: [PracticeAdmin, ReferralCoordinator, Endoscopist]
    code: 200
    input: []
    output: EndoscopySession
    side_effects: []
  - method: GET
    path: "/endoscopy-sessions"
    description: "List room blocks, filterable by lead endoscopist, date and status"
    roles: [PracticeAdmin, ReferralCoordinator, Endoscopist]
    code: 200
    input: ["lead_endoscopist_id?", "session_date?", "status?", "limit?", "offset?"]
    output: EndoscopySession[]
    side_effects: []
  - method: POST
    path: "/endoscopy-sessions/{session_id}/status-actions"
    description: "Apply a block posture action - PUBLISH, SUSPEND, RESUME or CLOSE"
    roles: [PracticeAdmin]
    code: 200
    input: [action, "reason?"]
    output: EndoscopySession
    side_effects: ["PUBLISH sets remaining_minutes to capacity_minutes", "SUSPEND requires reason and stops new bookings", "RESUME returns to COVERAGE_CONFIRMED when a fully covering ACTIVE coverage exists, otherwise to PUBLISHED", "CLOSE releases every ACTIVE AnesthesiaCoverage on the block", "increments EndoscopySession.version by 1"]
  - method: POST
    path: "/endoscopy-sessions/{session_id}/anesthesia-coverage"
    description: "Assign an anesthesia clinician to cover the block"
    roles: [PracticeAdmin]
    code: 201
    input: [anesthesia_clinician_id, coverage_start_utc, coverage_end_utc]
    output: AnesthesiaCoverage
    side_effects: ["runs anesthesia_overlap_load to set covers_full_window and overlap_index", "moves session.status PUBLISHED to COVERAGE_CONFIRMED", "increments EndoscopySession.version by 1"]
  - method: GET
    path: "/anesthesia-coverage/{coverage_id}"
    description: "Read one anesthesia coverage row"
    roles: [PracticeAdmin, Endoscopist]
    code: 200
    input: []
    output: AnesthesiaCoverage
    side_effects: []
  - method: GET
    path: "/anesthesia-coverage"
    description: "List anesthesia coverage rows, filterable by block, clinician and status"
    roles: [PracticeAdmin, Endoscopist]
    code: 200
    input: ["session_id?", "anesthesia_clinician_id?", "status?", "limit?", "offset?"]
    output: AnesthesiaCoverage[]
    side_effects: []
  - method: DELETE
    path: "/anesthesia-coverage/{coverage_id}"
    description: "Release an anesthesia coverage row and return the released row"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: AnesthesiaCoverage
    side_effects: ["sets coverage.status to RELEASED so it stops counting toward the clinician's overlap ceiling", "moves session.status COVERAGE_CONFIRMED to PUBLISHED when no fully covering ACTIVE coverage remains", "increments EndoscopySession.version by 1"]
  - method: POST
    path: "/referrals"
    description: "Record an inbound referral in SUBMITTED"
    roles: [ReferralCoordinator]
    code: 201
    input: [patient_id, referring_provider_npi, reason, asa_class_reported, "anticoagulant_reported?"]
    output: Referral
    side_effects: ["initialises status to SUBMITTED, info_request_rounds to 0 and risk_screen_result to PENDING"]
  - method: GET
    path: "/referrals/{referral_id}"
    description: "Read one referral including the triage round counter and the risk screen result"
    roles: [ReferralCoordinator, PracticeAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/referrals"
    description: "List referrals, filterable by patient, status and reason"
    roles: [ReferralCoordinator, PracticeAdmin]
    code: 200
    input: ["patient_id?", "status?", "reason?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/referrals/{referral_id}/triage-actions"
    description: "Apply a triage action - BEGIN_TRIAGE, REQUEST_INFO, RESPOND_INFO, ACCEPT_OPEN_ACCESS, ACCEPT_OFFICE_VISIT or DECLINE"
    roles: [ReferralCoordinator]
    code: 200
    input: [action, "note?", "updated_asa_class?", "updated_anticoagulant?"]
    output: Referral
    side_effects: ["recomputes risk_screen_result via open_access_risk_screen on BEGIN_TRIAGE and RESPOND_INFO", "REQUEST_INFO increments info_request_rounds, or auto-declines with triage_decision_note AUTO_DECLINED_INFO_EXHAUSTED once the ceiling is reached", "RESPOND_INFO overwrites asa_class_reported and anticoagulant_reported when supplied"]
  - method: POST
    path: "/screening-episodes"
    description: "Open a screening, surveillance or diagnostic-followup episode and evaluate eligibility"
    roles: [ReferralCoordinator, PatientNavigator]
    code: 201
    input: [patient_id, indication, "referral_id?", "preceding_episode_id?"]
    output: ScreeningEpisode
    side_effects: ["sets index_date from the logical clock", "runs screening_eligibility to set eligibility_status and copies Patient.risk_tier into risk_tier_snapshot", "runs episode_due_date to set due_date", "derives origin from referral_id and preceding_episode_id", "recomputes Patient.open_episode_count and Patient.navigation_priority"]
  - method: GET
    path: "/screening-episodes/{episode_id}"
    description: "Read one episode including both status dimensions, the prep score, the outreach log and version"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator, Endoscopist, Patient]
    code: 200
    input: []
    output: ScreeningEpisode
    side_effects: ["role Patient may read only episodes whose patient_id equals the acting X-User-ID, else ERR_NOT_RESOURCE_OWNER"]
  - method: GET
    path: "/screening-episodes"
    description: "List episodes, filterable by patient, referral, preceding episode, either status dimension and indication"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator, Endoscopist]
    code: 200
    input: ["patient_id?", "referral_id?", "preceding_episode_id?", "clinical_status?", "navigation_status?", "indication?", "limit?", "offset?"]
    output: ScreeningEpisode[]
    side_effects: []
  - method: POST
    path: "/screening-episodes/{episode_id}/close"
    description: "Close an open episode as declined, lost to follow-up or superseded"
    roles: [PatientNavigator, ReferralCoordinator]
    code: 200
    input: [reason]
    output: ScreeningEpisode
    side_effects: ["sets clinical_status to CLOSED_DECLINED or CLOSED_SUPERSEDED per reason", "recomputes Patient.open_episode_count and Patient.navigation_priority"]
  - method: POST
    path: "/screening-episodes/{episode_id}/outreach"
    description: "Record a bowel-preparation navigation touchpoint and rescore adherence"
    roles: [PatientNavigator]
    code: 200
    input: [channel, "acknowledged?"]
    output: ScreeningEpisode
    side_effects: ["appends {channel, occurred_at, acknowledged} to outreach_log with occurred_at taken from the logical clock", "recomputes prep_adherence_score over the whole log", "moves navigation_status to OUTREACH_ACTIVE or PREP_AT_RISK against PREP_AT_RISK_THRESHOLD"]
  - method: POST
    path: "/screening-episodes/{episode_id}/prep-attestation"
    description: "Patient attests whether the bowel preparation regimen was completed"
    roles: [Patient]
    code: 200
    input: [regimen_completed]
    output: ScreeningEpisode
    side_effects: ["sets prep_attestation to COMPLETED or NOT_COMPLETED", "recomputes prep_adherence_score with the attestation bonus", "moves navigation_status to PREP_CONFIRMED or PREP_AT_RISK against PREP_CONFIRMED_THRESHOLD", "requires X-User-ID == episode.patient_id"]
  - method: POST
    path: "/screening-episodes/{episode_id}/noninvasive-tests"
    description: "Order a stool-based non-invasive screening test for the episode"
    roles: [ReferralCoordinator, PatientNavigator]
    code: 201
    input: [test_type, collected_date]
    output: NoninvasiveTest
    side_effects: ["initialises result to PENDING"]
  - method: GET
    path: "/noninvasive-tests/{test_id}"
    description: "Read one non-invasive test including the follow-up episode it spawned"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator, Pathologist]
    code: 200
    input: []
    output: NoninvasiveTest
    side_effects: []
  - method: GET
    path: "/noninvasive-tests"
    description: "List non-invasive tests, filterable by ordering episode, follow-up episode, result and modality"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator, Pathologist]
    code: 200
    input: ["episode_id?", "follow_up_episode_id?", "result?", "test_type?", "limit?", "offset?"]
    output: NoninvasiveTest[]
    side_effects: []
  - method: POST
    path: "/noninvasive-tests/{test_id}/result"
    description: "Post the laboratory result for a pending non-invasive test"
    roles: [Pathologist]
    code: 200
    input: [result]
    output: NoninvasiveTest
    side_effects: ["stamps resulted_at from the logical clock", "on POSITIVE runs the four-hop positive_noninvasive_followup cascade - creates a DIAGNOSTIC_FOLLOWUP ScreeningEpisode with origin NONINVASIVE_POSITIVE and preceding_episode_id set to this test's episode, sets follow_up_episode_id, recomputes Patient.open_episode_count and Patient.navigation_priority, then recomputes the new episode's due_date and moves its navigation_status to OUTREACH_ACTIVE"]
  - method: POST
    path: "/endoscopy-sessions/{session_id}/procedure-bookings"
    description: "Book a colonoscopy slot in a room block and price it provisionally"
    roles: [ReferralCoordinator, PracticeAdmin]
    code: 201
    input: [episode_id, performing_endoscopist_id, slot_start_utc, duration_minutes, expected_session_version]
    output: ProcedureBooking
    side_effects: ["runs room_slot_feasibility for window containment, buffered single occupancy and the headcount ceiling", "computes slot_end_utc and occupancy_end_utc", "recomputes session.booked_minutes and session.remaining_minutes via session_capacity_ledger", "moves episode.clinical_status OPEN to PROCEDURE_SCHEDULED", "runs the provisional variant of claim_pricing, sets planned_classification and creates a BillingClaim in PROVISIONAL_PRICED", "increments EndoscopySession.version by 1"]
  - method: GET
    path: "/procedure-bookings/{booking_id}"
    description: "Read one booking including both classifications and released_minutes"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator, Endoscopist, BillingSpecialist, QualityOfficer]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: []
  - method: GET
    path: "/procedure-bookings"
    description: "List bookings, filterable by episode, room block, performing endoscopist and status"
    roles: [PracticeAdmin, ReferralCoordinator, PatientNavigator, Endoscopist, BillingSpecialist, QualityOfficer]
    code: 200
    input: ["episode_id?", "session_id?", "performing_endoscopist_id?", "status?", "limit?", "offset?"]
    output: ProcedureBooking[]
    side_effects: []
  - method: POST
    path: "/procedure-bookings/{booking_id}/check-in"
    description: "Check the patient in for the booked procedure"
    roles: [PatientNavigator]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: ["requires episode.navigation_status == PREP_CONFIRMED"]
  - method: POST
    path: "/procedure-bookings/{booking_id}/start"
    description: "Start the procedure"
    roles: [Endoscopist]
    code: 200
    input: []
    output: ProcedureBooking
    side_effects: ["requires X-User-ID == performing_endoscopist_id", "requires the performing clinician's credential_status == ACTIVE", "requires session.status == COVERAGE_CONFIRMED when session.anesthesia_mode == MAC"]
  - method: POST
    path: "/procedure-bookings/{booking_id}/complete"
    description: "Complete the procedure and record the findings"
    roles: [Endoscopist]
    code: 200
    input: [prep_quality_bbps, polyps_removed_count, largest_polyp_mm, specimen_count]
    output: ProcedureBooking
    side_effects: ["sets episode.navigation_status to NAVIGATION_COMPLETE", "with specimen_count >= 1 moves episode.clinical_status to PATHOLOGY_PENDING", "with specimen_count == 0 runs the no-specimen closure cascade - creates a GUIDELINE SurveillanceRecommendation, copies its interval onto the episode, moves clinical_status to CLOSED_SURVEILLANCE_SET and reprices the claim under the final variant"]
  - method: POST
    path: "/procedure-bookings/{booking_id}/abort"
    description: "Abort the procedure for inadequate preparation"
    roles: [Endoscopist]
    code: 200
    input: [prep_quality_bbps, cancellation_reason]
    output: ProcedureBooking
    side_effects: ["reverts episode.clinical_status to OPEN", "demotes episode.navigation_status to PREP_AT_RISK and resets prep_attestation to NONE when prep_quality_bbps <= 5", "reprices the claim to a single ABORTED_TECHNICAL line without releasing room minutes"]
  - method: POST
    path: "/procedure-bookings/{booking_id}/cancel"
    description: "Cancel a booked slot and return its room minutes"
    roles: [ReferralCoordinator, PracticeAdmin]
    code: 200
    input: [cancellation_reason]
    output: ProcedureBooking
    side_effects: ["sets released_minutes to duration_minutes + session.turnover_minutes and recomputes session.booked_minutes and session.remaining_minutes", "reverts episode.clinical_status to OPEN", "voids the BillingClaim with every money field 0 and line_items []", "increments EndoscopySession.version by 1"]
  - method: POST
    path: "/procedure-bookings/{booking_id}/pathology-reports"
    description: "Receive a pathology report against a completed colonoscopy"
    roles: [Pathologist]
    code: 201
    input: [accession_number, specimens, "high_grade_dysplasia?"]
    output: PathologyReport
    side_effects: ["computes adenoma_count, sessile_serrated_count, largest_adenoma_mm, villous_component and adenocarcinoma_present from specimens", "initialises status to RECEIVED", "rejects a duplicate accession_number with ERR_DUPLICATE_IDENTIFIER"]
  - method: GET
    path: "/pathology-reports/{report_id}"
    description: "Read one pathology report including the derived findings counters and the routing destination"
    roles: [Pathologist, Endoscopist, PracticeAdmin, QualityOfficer]
    code: 200
    input: []
    output: PathologyReport
    side_effects: []
  - method: GET
    path: "/pathology-reports"
    description: "List pathology reports, filterable by booking, routing destination and status"
    roles: [Pathologist, Endoscopist, PracticeAdmin, QualityOfficer]
    code: 200
    input: ["booking_id?", "routed_to_endoscopist_id?", "status?", "limit?", "offset?"]
    output: PathologyReport[]
    side_effects: []
  - method: POST
    path: "/pathology-reports/{report_id}/finalize"
    description: "Finalize a pathology report, route it to the performing endoscopist and run the surveillance cascade"
    roles: [Pathologist]
    code: 200
    input: []
    output: PathologyReport
    side_effects: ["stamps finalized_at from the logical clock and sets routed_to_endoscopist_id", "cascade hop 2 creates a GUIDELINE SurveillanceRecommendation and supersedes any previously ACTIVE one", "cascade hop 3 copies assigned_interval_months and next_due_date onto the episode and moves clinical_status to CLOSED_SURVEILLANCE_SET", "cascade hop 4 reprices the BillingClaim under the final variant, increments reprice_count and sets booking.final_classification", "increments ScreeningEpisode.version by 1"]
  - method: POST
    path: "/pathology-reports/{report_id}/amend"
    description: "Amend a finalized pathology report, withdrawing it from every finalized-only aggregate"
    roles: [Pathologist]
    code: 200
    input: [specimens, "high_grade_dysplasia?", amendment_reason]
    output: PathologyReport
    side_effects: ["replaces specimens and recomputes every derived findings field", "increments amendment_count", "sets status to AMENDED so the report leaves the surveillance aggregate and the quality numerator until it is finalized again"]
  - method: POST
    path: "/screening-episodes/{episode_id}/surveillance-recommendations"
    description: "Record a surveillance interval recommendation, optionally overriding the guideline interval with an attestation"
    roles: [Endoscopist, PracticeAdmin]
    code: 201
    input: ["pathology_report_id?", "override_interval_months?", "override_reason?", expected_episode_version]
    output: SurveillanceRecommendation
    side_effects: ["runs surveillance_interval_months to set computed_interval_months, assigned_interval_months, basis and next_due_date", "supersedes the episode's previously ACTIVE recommendation", "copies assigned_interval_months and next_due_date onto the episode", "sets attesting_endoscopist_id to the acting X-User-ID for an override", "an override requires X-User-ID != booking.performing_endoscopist_id", "increments ScreeningEpisode.version by 1"]
  - method: GET
    path: "/surveillance-recommendations/{recommendation_id}"
    description: "Read one surveillance recommendation"
    roles: [Endoscopist, PracticeAdmin, PatientNavigator]
    code: 200
    input: []
    output: SurveillanceRecommendation
    side_effects: []
  - method: GET
    path: "/surveillance-recommendations"
    description: "List surveillance recommendations, filterable by episode, anchoring report, attesting endoscopist and status"
    roles: [Endoscopist, PracticeAdmin, PatientNavigator]
    code: 200
    input: ["episode_id?", "pathology_report_id?", "attesting_endoscopist_id?", "status?", "limit?", "offset?"]
    output: SurveillanceRecommendation[]
    side_effects: []
  - method: GET
    path: "/billing-claims/{claim_id}"
    description: "Read one claim including line items, tier, classification and every money field"
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: []
    output: BillingClaim
    side_effects: []
  - method: GET
    path: "/billing-claims"
    description: "List claims, filterable by booking, plan, status and classification"
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: ["booking_id?", "insurance_plan_id?", "status?", "classification?", "limit?", "offset?"]
    output: BillingClaim[]
    side_effects: []
  - method: POST
    path: "/billing-claims/{claim_id}/finalize"
    description: "Finalize a repriced claim and commit it to the patient ledgers"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["adds deductible_applied_cents to Patient.deductible_applied_cents and patient_responsibility_cents to Patient.oop_applied_cents"]
  - method: POST
    path: "/billing-claims/{claim_id}/dispute"
    description: "Dispute a finalized claim, reversing its ledger contribution exactly"
    roles: [BillingSpecialist]
    code: 200
    input: [dispute_reason]
    output: BillingClaim
    side_effects: ["subtracts deductible_applied_cents from Patient.deductible_applied_cents and patient_responsibility_cents from Patient.oop_applied_cents", "leaves every money field on the claim unchanged"]
  - method: POST
    path: "/billing-claims/{claim_id}/reprice"
    description: "Re-run the final pricing variant on a disputed claim"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["re-runs the final variant of claim_pricing against current booking and pathology state and increments reprice_count"]
  - method: POST
    path: "/quality-periods"
    description: "Open an adenoma detection rate measurement window for one endoscopist under one attribution basis"
    roles: [QualityOfficer]
    code: 201
    input: [endoscopist_id, period_start_date, period_end_date, "attribution_basis?"]
    output: QualityPeriod
    side_effects: ["rejects a window intersecting an existing period with the same endoscopist_id and the same attribution_basis with ERR_QUALITY_PERIOD_OVERLAP", "rejects a clinician whose clinician_type != ENDOSCOPIST with ERR_CLINICIAN_TYPE_MISMATCH"]
  - method: GET
    path: "/quality-periods/{period_id}"
    description: "Read one measurement window including the ADR and the benchmark outcome"
    roles: [QualityOfficer, PracticeAdmin]
    code: 200
    input: []
    output: QualityPeriod
    side_effects: []
  - method: GET
    path: "/quality-periods"
    description: "List measurement windows, filterable by endoscopist, status and benchmark outcome"
    roles: [QualityOfficer, PracticeAdmin]
    code: 200
    input: ["endoscopist_id?", "status?", "benchmark_result?", "limit?", "offset?"]
    output: QualityPeriod[]
    side_effects: []
  - method: POST
    path: "/quality-periods/{period_id}/lock"
    description: "Lock the window and compute the adenoma detection rate under the declared attribution basis"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: QualityPeriod
    side_effects: ["runs adenoma_detection_rate to set screening_colonoscopy_count, adenoma_positive_count and adr_pct", "snapshots Clinician.adr_benchmark_pct into benchmark_pct", "sets benchmark_result and remediation_required", "requires date(logical clock) >= period_end_date"]
  - method: POST
    path: "/quality-periods/{period_id}/attest"
    description: "Attest a locked window with a remediation plan"
    roles: [QualityOfficer]
    code: 200
    input: [remediation_plan]
    output: QualityPeriod
    side_effects: ["stores remediation_plan and sets attesting_user_id to the acting X-User-ID"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, integer outside its declared bound, malformed date or instant, limit outside 1-100, offset negative, SUSPEND without reason, amend without amendment_reason, dispute without dispute_reason, attest without remediation_plan"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role addresses a resource it does not own - Patient reading another patient's row or episode, or an Endoscopist acting on a booking whose performing_endoscopist_id is a different clinician"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id or insurance_plan_id does not resolve to an InsurancePlan"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "patient_id does not resolve to a Patient"
  - id: ERR_CLINICIAN_NOT_FOUND
    http: 404
    condition: "clinician_id, lead_endoscopist_id, anesthesia_clinician_id, performing_endoscopist_id or endoscopist_id does not resolve to a Clinician"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "session_id does not resolve to an EndoscopySession"
  - id: ERR_COVERAGE_NOT_FOUND
    http: 404
    condition: "coverage_id does not resolve to an AnesthesiaCoverage"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral_id does not resolve to a Referral"
  - id: ERR_EPISODE_NOT_FOUND
    http: 404
    condition: "episode_id or preceding_episode_id does not resolve to a ScreeningEpisode"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "test_id does not resolve to a NoninvasiveTest"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "booking_id does not resolve to a ProcedureBooking"
  - id: ERR_PATHOLOGY_NOT_FOUND
    http: 404
    condition: "report_id or pathology_report_id does not resolve to a PathologyReport"
  - id: ERR_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "recommendation_id does not resolve to a SurveillanceRecommendation"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id does not resolve to a BillingClaim"
  - id: ERR_QUALITY_PERIOD_NOT_FOUND
    http: 404
    condition: "period_id does not resolve to a QualityPeriod"
  - id: ERR_INVALID_REFERRAL_STATE
    http: 409
    condition: "the requested triage action is not declared from the referral's current status"
  - id: ERR_INVALID_EPISODE_STATE
    http: 409
    condition: "the episode's clinical_status does not admit the operation - a closed episode receiving outreach, attestation, a test order or a booking, or a surveillance recommendation created against an episode that is not CLOSED_SURVEILLANCE_SET"
  - id: ERR_INVALID_SESSION_STATE
    http: 409
    condition: "the requested session status action is not declared from the session's current status, or CLOSE is attempted while a booking on the block is still in {BOOKED, CHECKED_IN, IN_PROGRESS}"
  - id: ERR_SESSION_NOT_ACCEPTING_BOOKINGS
    http: 409
    condition: "a booking is created against a session whose status is DRAFT, SUSPENDED or CLOSED"
  - id: ERR_INVALID_BOOKING_STATE
    http: 409
    condition: "the requested booking action is not declared from the booking's current status, including receiving a pathology report against a booking that is not COMPLETED"
  - id: ERR_INVALID_PATHOLOGY_STATE
    http: 409
    condition: "finalize on a report already FINALIZED, or amend on a report that is not FINALIZED"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "finalize on a claim that is not REPRICED, dispute on a claim that is not FINALIZED, or reprice on a claim that is not DISPUTED"
  - id: ERR_INVALID_QUALITY_PERIOD_STATE
    http: 409
    condition: "lock on a period that is not OPEN, or attest on a period that is not LOCKED"
  - id: ERR_TEST_ALREADY_RESULTED
    http: 409
    condition: "a result is posted to a NoninvasiveTest whose result is no longer PENDING"
  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: "expected_session_version does not equal the current EndoscopySession.version at booking creation"
  - id: ERR_STALE_EPISODE_VERSION
    http: 412
    condition: "expected_episode_version does not equal the current ScreeningEpisode.version at surveillance recommendation creation"
  - id: ERR_OPEN_ACCESS_RISK_SCREEN_FAILED
    http: 422
    condition: "ACCEPT_OPEN_ACCESS while the recomputed risk_screen_result is OFFICE_VISIT_REQUIRED - asa_class_reported above 3, anticoagulant use reported, or reason SYMPTOMATIC_BLEEDING"
  - id: ERR_CLINICIAN_CREDENTIAL_SUSPENDED
    http: 422
    condition: "the performing endoscopist's credential_status is SUSPENDED at procedure start"
  - id: ERR_PREPROCEDURE_RISK_UNCLEARED
    http: 422
    condition: "a booking is created for a patient with asa_class 4 or 5 whose episode does not carry a referral accepted as ACCEPTED_OFFICE_VISIT"
  - id: ERR_PREP_NOT_CONFIRMED
    http: 422
    condition: "check-in while the episode's navigation_status is not PREP_CONFIRMED"
  - id: ERR_ANESTHESIA_COVERAGE_REQUIRED
    http: 409
    condition: "a procedure is started on a MAC block whose status is not COVERAGE_CONFIRMED"
  - id: ERR_CLINICIAN_TYPE_MISMATCH
    http: 422
    condition: "an ANESTHESIA clinician is used where an ENDOSCOPIST is required, or the reverse"
  - id: ERR_REFERRAL_NOT_ACCEPTED
    http: 422
    condition: "an episode is created with a referral_id whose Referral.status is not ACCEPTED_OPEN_ACCESS or ACCEPTED_OFFICE_VISIT"
  - id: ERR_EPISODE_NOT_ELIGIBLE
    http: 422
    condition: "a booking is created for an episode whose eligibility_status is INELIGIBLE_AGE, INELIGIBLE_PRIOR_CRC or INELIGIBLE_RISK_MISMATCH"
  - id: ERR_PATHOLOGY_NOT_FINALIZED
    http: 409
    condition: "a surveillance recommendation cites a pathology_report_id whose status is RECEIVED or AMENDED, or a report belonging to a different booking than the episode's"
  - id: ERR_SLOT_OUTSIDE_SESSION_WINDOW
    http: 422
    condition: "the occupancy interval, turnover minutes included, is not fully contained in the session window"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "the candidate occupancy interval intersects an existing occupancy interval on the same room block"
  - id: ERR_ANESTHESIA_CONCURRENCY_EXCEEDED
    http: 409
    condition: "the peak number of an anesthesia clinician's overlapping ACTIVE coverage intervals would exceed that clinician's max_overlapping_rooms"
  - id: ERR_COVERAGE_WINDOW_INSUFFICIENT
    http: 422
    condition: "a coverage interval does not span the whole session window"
  - id: ERR_QUALITY_PERIOD_NOT_ENDED
    http: 422
    condition: "a quality period is locked before the logical clock has reached its period_end_date"
  - id: ERR_QUALITY_PERIOD_OVERLAP
    http: 409
    condition: "a quality period intersects an existing period for the same endoscopist under the same attribution_basis"
  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "a duplicate InsurancePlan.plan_code, Patient.mrn, Clinician.npi or PathologyReport.accession_number is submitted"
  - id: ERR_DUPLICATE_OPEN_EPISODE
    http: 409
    condition: "the patient already has an episode with the same indication whose clinical_status is OPEN, PROCEDURE_SCHEDULED or PATHOLOGY_PENDING"
  - id: ERR_NO_SPECIMENS
    http: 422
    condition: "a pathology report with an empty specimens list is finalized"
  - id: ERR_OVERRIDE_OUT_OF_RANGE
    http: 422
    condition: "an override interval falls outside 6-120 months, deviates from the computed interval by more than 48 months, or is submitted without override_reason"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "an override surveillance recommendation is attested by the same clinician who performed the anchoring procedure"
  - id: ERR_SESSION_CAPACITY_EXCEEDED
    http: 409
    condition: "the number of non-cancelled bookings on the block already equals max_procedures"

roles:
  - name: PracticeAdmin
    description: "Practice operations - configures plans, clinicians, room blocks, anesthesia coverage and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /insurance-plans", "POST /clinicians", "POST /endoscopy-sessions", "POST /endoscopy-sessions/{session_id}/status-actions", "POST /endoscopy-sessions/{session_id}/anesthesia-coverage", "DELETE /anesthesia-coverage/{coverage_id}", "POST /_clock/set_current_utc"]
    shared_operations: ["POST /patients", "POST /endoscopy-sessions/{session_id}/procedure-bookings", "POST /procedure-bookings/{booking_id}/cancel", "POST /screening-episodes/{episode_id}/surveillance-recommendations", "every GET"]
  - name: ReferralCoordinator
    description: "Front-office triage - records referrals, drives triage rounds, opens episodes and schedules slots"
    identity: opaque
    exclusive_operations: ["POST /referrals", "POST /referrals/{referral_id}/triage-actions"]
    shared_operations: ["POST /patients", "POST /screening-episodes", "POST /screening-episodes/{episode_id}/close", "POST /screening-episodes/{episode_id}/noninvasive-tests", "POST /endoscopy-sessions/{session_id}/procedure-bookings", "POST /procedure-bookings/{booking_id}/cancel"]
  - name: PatientNavigator
    description: "Bowel-preparation navigation - records outreach touchpoints and checks patients in"
    identity: opaque
    exclusive_operations: ["POST /screening-episodes/{episode_id}/outreach", "POST /procedure-bookings/{booking_id}/check-in"]
    shared_operations: ["POST /screening-episodes", "POST /screening-episodes/{episode_id}/close", "POST /screening-episodes/{episode_id}/noninvasive-tests"]
  - name: Endoscopist
    description: "Performing physician - starts, completes and aborts procedures and records surveillance recommendations"
    identity: "entity_backed:Clinician"
    exclusive_operations: ["POST /procedure-bookings/{booking_id}/start", "POST /procedure-bookings/{booking_id}/complete", "POST /procedure-bookings/{booking_id}/abort"]
    shared_operations: ["POST /screening-episodes/{episode_id}/surveillance-recommendations", "GET /procedure-bookings", "GET /pathology-reports", "GET /surveillance-recommendations"]
  - name: Pathologist
    description: "Laboratory - posts non-invasive results, receives, finalizes and amends pathology reports"
    identity: opaque
    exclusive_operations: ["POST /noninvasive-tests/{test_id}/result", "POST /procedure-bookings/{booking_id}/pathology-reports", "POST /pathology-reports/{report_id}/finalize", "POST /pathology-reports/{report_id}/amend"]
    shared_operations: ["GET /noninvasive-tests", "GET /pathology-reports"]
  - name: BillingSpecialist
    description: "Revenue cycle - finalizes, disputes and reprices claims"
    identity: opaque
    exclusive_operations: ["POST /billing-claims/{claim_id}/finalize", "POST /billing-claims/{claim_id}/dispute", "POST /billing-claims/{claim_id}/reprice"]
    shared_operations: ["GET /billing-claims", "GET /insurance-plans/{plan_id}", "GET /procedure-bookings"]
  - name: QualityOfficer
    description: "Quality program - opens, locks and attests adenoma detection rate measurement windows"
    identity: opaque
    exclusive_operations: ["POST /quality-periods", "POST /quality-periods/{period_id}/lock", "POST /quality-periods/{period_id}/attest"]
    shared_operations: ["GET /quality-periods", "GET /procedure-bookings", "GET /pathology-reports", "GET /clinicians/{clinician_id}"]
  - name: Patient
    description: "The patient acting on their own record - attests bowel preparation completion"
    identity: "entity_backed:Patient"
    exclusive_operations: ["POST /screening-episodes/{episode_id}/prep-attestation"]
    shared_operations: ["GET /patients/{patient_id}", "GET /screening-episodes/{episode_id}"]
