              payload: { goal_cents: 100, start_date: "2020-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { tp_r: $.data.id }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_r}", gross_commission_cents: 200, payout_rate: 1.0, posted_at: "2020-01-02T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_r}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_r}"
            - call: "POST /branch-office/training-programs/${tp_r}/evaluate"
              payload: { window_end: "2020-04-01T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/territories"
              payload: { community_name: "Prio Town", household_capacity: 500 }
              as: HomeOfficeAdmin
              captures: { ter_id: $.data.id }
            - call: "POST /branch-office/branches"
              payload: { community_name: "Prio Town", site_address: "4 Ash St", territory_id: "${ter_id}" }
              as: HomeOfficeAdmin
              captures: { br_id: $.data.id }
            - call: "POST /branch-office/branches/${br_id}/approve-site"
              payload: { monthly_rent_cents: 150000, term_start: "2020-01-01T00:00:00Z", term_end: "2030-12-31T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_r}/assign-branch"
              payload: { branch_id: "${br_id}" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_r}", gross_commission_cents: 2400000, payout_rate: 1.0, posted_at: "2026-03-10T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/advisors/${adv_r}/declare-retirement"
              payload: {}
              as: Advisor
              as_user_id: "${adv_r}"
            - call: "POST /branch-office/advisors"
              payload: { full_name: "Succ D", email: "succd@x.com", hire_date: "2024-01-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { adv_s: $.data.id }
            - call: "POST /branch-office/goodwill-transfers"
              payload: { branch_id: "${br_id}", retiring_advisor_id: "${adv_r}", successor_advisor_id: "${adv_s}", valuation_mode: "INTERNAL_SUCCESSION", escrow_deposit_cents: 200000 }
              as: HomeOfficeAdmin
              captures: { gt_id: $.data.id, gt_v: $.data.version }
            - call: "POST /branch-office/goodwill-transfers/${gt_id}/counter-offer"
              payload: { expected_transfer_version: "${gt_v}", offer_price_cents: 1700000 }
              as: Advisor
              as_user_id: "${adv_s}"
              captures: { gt_v2: $.data.version }
            - call: "POST /branch-office/goodwill-transfers/${gt_id}/decline"
              payload: {}
              as: Advisor
              as_user_id: "${adv_r}"
          trigger:
            - call: "POST /branch-office/goodwill-transfers/${gt_id}/counter-offer"
              payload: { expected_transfer_version: "${gt_v2}", offer_price_cents: 1650000 }
              as: Advisor
              as_user_id: "${adv_s}"
              captures: { err1: $.data.error_id }
          assert:
            - "Counter-offer on DECLINED transfer returns error_id == ERR_INVALID_STATE (409): the priority-4 state check wins over the priority-6 alternation check even though the caller (successor, last offerer) also violates alternation"
            - "GoodwillTransfer.${gt_id}.status remains DECLINED and negotiation_round unchanged"
      - name: safety_vs_referential_on_solicitation_approval
