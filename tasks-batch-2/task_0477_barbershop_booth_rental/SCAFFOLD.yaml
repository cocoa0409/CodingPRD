# =============================================================================
# Barbershop & Booth Rental — Scaffold Seed Tables (§1.0–§1.7)
# Expert tier. Generated purely from the scenario + scaffold-generator spec.
# Flat topology: collections are top-level peers; children carry FK body fields.
# =============================================================================

scenario: "Barbershop & Booth Rental: chair booth-rent vs commission, walk-in queue & appointment, service menu & add-on, barber license & schedule, tip & daily settlement, loyalty/punch & membership, product retail, no-show/late"

domain_name: barbershop-booth-rental
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation       # booth-rent vs commission settlement on the same visit data
    - derived_field_reconciliation   # barber.unsettled_revenue_cents, shop ledgers, punch/strike counters
    - optimistic_concurrency         # OCC on Shop.version and Barber.version for true CREATE-with-supersede races
    - rate_threshold_triggers        # punch-card reward at >=N; no-show strike suspension at >=K
  entity_topology: flat
  # Shop is the OCC/config root; Barber/Chair/Customer/catalog are flat peers referencing it by shop_id;
  # Appointment/QueueTicket/Ticket/DailySettlement carry cross-aggregate FKs.

  state_machine_shape: branching
  # Appointment forks BOOKED -> {CHECKED_IN, NO_SHOW, CANCELLED}; license cycles SUSPENDED<->ACTIVE.

  relationship_patterns:
    - one_to_many        # Shop -> Barber/Chair/Customer/...; Barber -> BarberShift; Ticket -> lines via id arrays
    - many_to_many       # Membership <-> Customer (one plan, many customers)
    - cross_aggregate    # Ticket references Appointment OR QueueTicket; DailySettlement aggregates Tickets per barber per day

  role_model: peer_roles
  # ShopOwner (config + settlement + void), Barber (entity-backed; own reads), Receptionist (booking/queue/checkout), Customer (entity-backed; self-service).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Shop
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: name, type: string, source: input, description: "Shop display name." }
      - { name: tax_rate_pct, type: number, source: input, description: "Sales tax percent applied to taxable net. e.g. 8.5 means 8.5%.", constraints: ">= 0 and <= 30" }
      - { name: default_booth_rent_cents, type: integer, source: input, description: "Default daily booth rent charged to BOOTH_RENT barbers per settled business day.", constraints: ">= 0" }
      - { name: default_commission_pct, type: number, source: input, description: "Default shop-take service commission percent for COMMISSION barbers (shop keeps this % of service+addon revenue).", constraints: ">= 0 and <= 100" }
      - { name: product_commission_pct, type: number, source: input, description: "Commission percent a COMMISSION barber earns on commission-eligible product sales they ring up.", default: 0, constraints: ">= 0 and <= 100" }
      - { name: no_show_fee_cents, type: integer, source: input, description: "Flat fee charged to a Customer on no-show.", default: 0, constraints: ">= 0" }
      - { name: no_show_strike_limit, type: integer, source: input, description: "No-show strike count at which a Customer is auto-suspended from booking.", default: 3, constraints: ">= 1" }
      - { name: late_grace_minutes, type: integer, source: input, description: "Minutes after appointment start within which check-in is ON_TIME; beyond is LATE. Also the required inter-shift buffer.", default: 10, constraints: ">= 0" }
      - { name: punch_reward_threshold, type: integer, source: input, description: "Completed paid visits required to earn one free-service punch reward.", default: 10, constraints: ">= 1" }
      - { name: punch_reward_value_cents, type: integer, source: input, description: "Service-credit value granted when a punch reward is redeemed.", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED. CLOSED blocks booking/queue/check-in/serve/checkout/no-show.", constraints: "OPEN | CLOSED", default: "OPEN" }
      - { name: gross_service_revenue_cents, type: integer, source: computed, description: "Denormalized running sum of service_net_cents across PAID tickets; reconciled on every checkout and void.", default: 0 }
      - { name: gross_product_revenue_cents, type: integer, source: computed, description: "Denormalized running sum of product_net_cents across PAID tickets; reconciled on checkout and void.", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Barber
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: full_name, type: string, source: input, description: "Barber display name." }
      - { name: license_number, type: string, source: input, description: "State barber/cosmetology license number." }
      - { name: license_expires_on, type: string, source: input, description: "License expiry date, ISO 8601 date (YYYY-MM-DD). Compared against the logical clock date at activation." }
      - { name: comp_model, type: enum, source: input, description: "BOOTH_RENT | COMMISSION. Fixed at creation; selects the DailySettlement variant.", constraints: "BOOTH_RENT | COMMISSION" }
      - { name: booth_rent_cents, type: integer, source: input, description: "Daily booth rent when comp_model=BOOTH_RENT. Defaults to Shop.default_booth_rent_cents when omitted.", constraints: ">= 0" }
      - { name: commission_pct, type: number, source: input, description: "Shop-take service commission percent when comp_model=COMMISSION. Defaults to Shop.default_commission_pct when omitted.", constraints: ">= 0 and <= 100" }
      - { name: license_status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | REVOKED. Gates whether the barber may serve.", constraints: "PENDING | ACTIVE | SUSPENDED | REVOKED", default: "PENDING" }
      - { name: unsettled_revenue_cents, type: integer, source: computed, description: "Denormalized sum of service_net_cents on this barber's PAID-but-unsettled tickets (no DailySettlement for their business_date yet). Increments on checkout; decremented when the date is settled.", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE. Employment lifecycle flag; barbers are created ACTIVE (license lifecycle is tracked separately via license_status).", constraints: "ACTIVE", default: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: Chair
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: label, type: string, source: input, description: "Chair label e.g. 'Chair 1'." }
      - { name: status, type: enum, source: system, description: "AVAILABLE. Chairs are created AVAILABLE and remain so (no decommission flow in this version).", constraints: "AVAILABLE", default: "AVAILABLE" }

  # ---------------------------------------------------------------------------
  - name: BarberShift
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: barber_id, type: string, source: input, description: "FK -> Barber.id; the barber working this shift." }
      - { name: chair_id, type: string, source: input, description: "FK -> Chair.id; the chair occupied during this shift." }
      - { name: start_utc, type: datetime, source: input, description: "Shift start, ISO 8601 UTC. Half-open interval [start_utc, end_utc)." }
      - { name: end_utc, type: datetime, source: input, description: "Shift end, ISO 8601 UTC; must be > start_utc." }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED. CANCELLED frees the chair window.", constraints: "SCHEDULED | CANCELLED", default: "SCHEDULED" }

  # ---------------------------------------------------------------------------
  - name: ServiceMenuItem
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: name, type: string, source: input, description: "Service name e.g. 'Haircut'." }
      - { name: price_cents, type: integer, source: input, description: "Base service price in cents.", constraints: ">= 0" }
      - { name: duration_minutes, type: integer, source: input, description: "Scheduled chair time for this service.", constraints: ">= 1" }
      - { name: membership_included, type: boolean, source: input, description: "If true, fully covered by an ACTIVE membership (price waived).", default: false }
      - { name: status, type: enum, source: system, description: "LISTED | DELISTED. DELISTED items cannot be added to new tickets/appointments.", constraints: "LISTED | DELISTED", default: "LISTED" }

  # ---------------------------------------------------------------------------
  - name: AddOn
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: name, type: string, source: input, description: "Add-on name e.g. 'Beard Trim'." }
      - { name: price_cents, type: integer, source: input, description: "Add-on price in cents.", constraints: ">= 0" }
      - { name: extra_minutes, type: integer, source: input, description: "Additional chair time this add-on consumes.", default: 0, constraints: ">= 0" }
      - { name: membership_discount_pct, type: number, source: input, description: "Per-add-on percent discount for ACTIVE members; overrides the plan-level discount when > 0.", default: 0, constraints: ">= 0 and <= 100" }
      - { name: status, type: enum, source: system, description: "LISTED | DELISTED.", constraints: "LISTED | DELISTED", default: "LISTED" }

  # ---------------------------------------------------------------------------
  - name: ProductSku
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: name, type: string, source: input, description: "Retail product name e.g. 'Pomade'." }
      - { name: price_cents, type: integer, source: input, description: "Unit retail price in cents.", constraints: ">= 0" }
      - { name: stock_qty, type: integer, source: input, description: "On-hand units.", default: 0, constraints: ">= 0" }
      - { name: commission_eligible, type: boolean, source: input, description: "If true, a COMMISSION barber earns Shop.product_commission_pct on units rung up.", default: false }
      - { name: status, type: enum, source: system, description: "LISTED | DELISTED.", constraints: "LISTED | DELISTED", default: "LISTED" }

  # ---------------------------------------------------------------------------
  - name: Membership
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: name, type: string, source: input, description: "Plan name e.g. 'Gold'." }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly subscription fee.", constraints: ">= 0" }
      - { name: addon_discount_pct, type: number, source: input, description: "Plan-level percent discount applied to add-ons whose own membership_discount_pct is 0.", default: 0, constraints: ">= 0 and <= 100" }
      - { name: status, type: enum, source: system, description: "OFFERED | RETIRED. RETIRED plans accept no new subscribers.", constraints: "OFFERED | RETIRED", default: "OFFERED" }

  # ---------------------------------------------------------------------------
  - name: Customer
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: full_name, type: string, source: input, description: "Customer display name." }
      - { name: email, type: string, source: input, description: "Customer email, unique within the shop." }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the subscribed plan, or null. Set via subscribe endpoint.", default: null }
      - { name: membership_status, type: enum, source: system, description: "NONE | ACTIVE. ACTIVE (set on subscribe) unlocks membership pricing.", constraints: "NONE | ACTIVE", default: "NONE" }
      - { name: punch_count, type: integer, source: computed, description: "Completed paid visits since the last reward grant; +1 per checkout, minus threshold when a reward is granted.", default: 0 }
      - { name: reward_credits, type: integer, source: computed, description: "Unredeemed free-service punch rewards earned.", default: 0 }
      - { name: no_show_strikes, type: integer, source: computed, description: "Cumulative no-show strikes; at Shop.no_show_strike_limit the customer is SUSPENDED.", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. SUSPENDED customers cannot book or take a queue ticket.", constraints: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: Appointment
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; who booked." }
      - { name: barber_id, type: string, source: input, description: "FK -> Barber.id; requested barber." }
      - { name: chair_id, type: string, source: input, description: "FK -> Chair.id; chair occupied (must fall within a SCHEDULED shift of this barber on this chair)." }
      - { name: service_item_id, type: string, source: input, description: "FK -> ServiceMenuItem.id; the primary booked service (defines slot duration with add-ons)." }
      - { name: addon_ids, type: array, source: input, description: "Array of AddOn.id booked with this appointment; extends slot duration.", default: [] }
      - { name: start_utc, type: datetime, source: input, description: "Appointment start, ISO 8601 UTC. Slot is half-open [start_utc, end_utc)." }
      - { name: end_utc, type: datetime, source: computed, description: "Computed slot end = start_utc + service.duration_minutes + sum(addon.extra_minutes)." }
      - { name: check_in_punctuality, type: enum, source: computed, description: "UNSET | ON_TIME | LATE; set at check-in by comparing the clock to start_utc + Shop.late_grace_minutes.", constraints: "UNSET | ON_TIME | LATE", default: "UNSET" }
      - { name: ticket_id, type: string, source: computed, description: "FK -> Ticket.id; the sale opened at check-in. Null until checked in.", default: null }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED.", constraints: "BOOKED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", default: "BOOKED" }

  # ---------------------------------------------------------------------------
  - name: QueueTicket
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; walk-in customer." }
      - { name: requested_barber_id, type: string, source: input, description: "FK -> Barber.id; preferred barber, or null for next-available.", default: null }
      - { name: queue_position, type: integer, source: computed, description: "1-based position among WAITING tickets in this shop, ordered created_at ASC; recomputed on enqueue/serve/abandon." }
      - { name: assigned_barber_id, type: string, source: computed, description: "FK -> Barber.id; the barber chosen at serve time. Null while WAITING.", default: null }
      - { name: ticket_id, type: string, source: computed, description: "FK -> Ticket.id; the sale opened when served. Null until served.", default: null }
      - { name: status, type: enum, source: system, description: "WAITING | SERVING | DONE | ABANDONED.", constraints: "WAITING | SERVING | DONE | ABANDONED", default: "WAITING" }

  # ---------------------------------------------------------------------------
  - name: Ticket
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the paying customer." }
      - { name: barber_id, type: string, source: input, description: "FK -> Barber.id; the serving barber (drives settlement attribution)." }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; source appointment, or null for walk-in.", default: null }
      - { name: queue_ticket_id, type: string, source: input, description: "FK -> QueueTicket.id; source queue ticket, or null for appointment-based.", default: null }
      - { name: business_date, type: string, source: computed, description: "ISO 8601 date (YYYY-MM-DD) derived from the logical clock at ticket OPEN; the settlement bucket key." }
      - { name: service_line_ids, type: array, source: input, description: "Array of ServiceMenuItem.id sold on this ticket.", default: [] }
      - { name: addon_line_ids, type: array, source: input, description: "Array of AddOn.id sold on this ticket.", default: [] }
      - { name: product_lines, type: array, source: input, description: "Array of {product_sku_id, qty} retail lines.", default: [] }
      - { name: redeem_reward, type: boolean, source: input, description: "If true at checkout, redeem one Customer.reward_credits to waive the cheapest LISTED service line up to Shop.punch_reward_value_cents.", default: false }
      - { name: tip_cents, type: integer, source: input, description: "Tip entered at checkout; paid 100% to the barber, never shop-shared.", default: 0, constraints: ">= 0" }
      - { name: service_net_cents, type: integer, source: computed, description: "Net service+addon revenue after membership waivers/discounts and reward redemption (pre-tax).", default: 0 }
      - { name: product_net_cents, type: integer, source: computed, description: "Net product revenue (pre-tax).", default: 0 }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on the summed taxable net.", default: 0 }
      - { name: total_due_cents, type: integer, source: computed, description: "service_net + product_net + tax + tip (plus no-show fee on no-show-only tickets).", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOIDED. PAID is terminal for revenue; VOIDED reverses ledgers.", constraints: "OPEN | PAID | VOIDED", default: "OPEN" }

  # ---------------------------------------------------------------------------
  - name: DailySettlement
    parent: Shop
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only." }
      - { name: shop_id, type: string, source: input, description: "FK -> Shop.id; owning shop." }
      - { name: barber_id, type: string, source: input, description: "FK -> Barber.id; the barber being settled." }
      - { name: business_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) settled; unique per (barber_id, business_date)." }
      - { name: comp_model, type: enum, source: computed, description: "Snapshot of the barber's comp_model at settlement time.", constraints: "BOOTH_RENT | COMMISSION" }
      - { name: service_revenue_cents, type: integer, source: computed, description: "Sum of service_net_cents over the barber's PAID tickets on business_date.", default: 0 }
      - { name: product_revenue_cents, type: integer, source: computed, description: "Sum of product_net_cents over the barber's PAID tickets on business_date.", default: 0 }
      - { name: tip_total_cents, type: integer, source: computed, description: "Sum of tip_cents over the barber's PAID tickets on business_date.", default: 0 }
      - { name: booth_rent_charged_cents, type: integer, source: computed, description: "Barber.booth_rent_cents if BOOTH_RENT else 0.", default: 0 }
      - { name: shop_commission_cents, type: integer, source: computed, description: "Shop's take if COMMISSION (service commission + retained product share) else 0.", default: 0 }
      - { name: barber_payout_cents, type: integer, source: computed, description: "Net owed to the barber per comp_model variant (see calculations).", default: 0 }
      - { name: status, type: enum, source: system, description: "FINALIZED. Created already FINALIZED and immutable.", constraints: "FINALIZED", default: "FINALIZED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Shop
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /shops/{shopId}/close"
        actor: ShopOwner
        preconditions:
          - "No Appointment in CHECKED_IN and no Ticket in OPEN exists in this shop (ERR_OPEN_TICKETS_EXIST)."
        side_effects:
          - "increments Shop.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /shops/{shopId}/reopen"
        actor: ShopOwner
        preconditions: []
        side_effects:
          - "increments Shop.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Barber
    field: license_status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /barbers/{barberId}/license/activate"
        actor: ShopOwner
        preconditions:
          - "license_expires_on >= logical clock date (ERR_LICENSE_EXPIRED)."
        side_effects: []
        note: "A non-ACTIVE barber cannot be the barber on a new Appointment, a QueueTicket serve, or a Ticket checkout."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /barbers/{barberId}/license/suspend"
        actor: ShopOwner
        preconditions: []
        side_effects:
          - "CASCADE hop 1: every BOOKED Appointment of this barber with start_utc > clock -> CANCELLED (no no-show fee)."
        note: "Cross-entity cascade: license suspension cancels that barber's upcoming booked appointments."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /barbers/{barberId}/license/activate"
        actor: ShopOwner
        preconditions:
          - "license_expires_on >= logical clock date (ERR_LICENSE_EXPIRED)."
        side_effects: []
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE ... (non-linear shape on Barber)."
      - from: [PENDING, ACTIVE, SUSPENDED]
        to: REVOKED
        trigger: "POST /barbers/{barberId}/license/revoke"
        actor: ShopOwner
        preconditions: []
        side_effects:
          - "Every SCHEDULED BarberShift of this barber with end_utc > clock -> CANCELLED (cascade)."
          - "Every BOOKED Appointment of this barber -> CANCELLED (cascade); no no-show fee."

  # ---------------------------------------------------------------------------
  - entity: BarberShift
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shifts/{shiftId}/cancel"
        actor: ShopOwner
        preconditions:
          - "No BOOKED or CHECKED_IN Appointment falls within this shift's [start_utc, end_utc) on the same chair (ERR_SHIFT_HAS_APPOINTMENTS)."
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: Appointment
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /appointments/{appointmentId}/check-in"
        actor: Receptionist
        preconditions:
          - "Shop.status == OPEN (ERR_SHOP_CLOSED)."
          - "Barber.license_status == ACTIVE (ERR_BARBER_NOT_ACTIVE)."
          - "Customer.status == ACTIVE (ERR_CUSTOMER_SUSPENDED)."
        side_effects:
          - "CASCADE hop 1: opens a Ticket in OPEN seeded with service_item_id + addon_ids; Appointment.ticket_id set; Ticket.business_date stamped from clock."
          - "check_in_punctuality set ON_TIME if clock <= start_utc + Shop.late_grace_minutes else LATE."
        note: "Late check-in is permitted and merely recorded as LATE; only a no-show transition charges a strike/fee."
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (ticket checkout: POST /tickets/{ticketId}/checkout)"
        actor: system
        preconditions:
          - "The Appointment's Ticket transitions OPEN -> PAID."
        side_effects:
          - "Appointment.status -> COMPLETED."
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /appointments/{appointmentId}/no-show"
        actor: Receptionist
        preconditions:
          - "logical clock >= start_utc + Shop.late_grace_minutes (ERR_NO_SHOW_TOO_EARLY)."
        side_effects:
          - "CASCADE hop 1: Customer.no_show_strikes += 1."
          - "CASCADE hop 2: if Customer.no_show_strikes >= Shop.no_show_strike_limit then Customer.status -> SUSPENDED (which blocks future booking/queue) — caused by hop 1, not by the no-show call directly."
          - "If Shop.no_show_fee_cents > 0, a Ticket is opened then immediately PAID with only the no-show fee (total_due_cents == no_show_fee_cents); attributed to the appointment's barber for the current business_date."
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{appointmentId}/cancel"
        actor: [Receptionist, Customer]
        preconditions:
          - "logical clock < start_utc (ERR_CANCEL_TOO_LATE)."
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: QueueTicket
    field: status
    initial_state: WAITING
    terminal_states: [DONE, ABANDONED]
    transitions:
      - from: WAITING
        to: SERVING
        trigger: "POST /queue/{queueTicketId}/serve"
        actor: Receptionist
        preconditions:
          - "Shop.status == OPEN (ERR_SHOP_CLOSED)."
          - "Resolved barber's license_status == ACTIVE (ERR_BARBER_NOT_ACTIVE)."
          - "This is the front WAITING ticket: queue_position == 1 overall, or — when requested_barber_id is set — the lowest-created_at WAITING ticket among those requesting that barber (ERR_NOT_QUEUE_FRONT)."
        side_effects:
          - "assigned_barber_id resolved: requested_barber_id if set, else the ACTIVE barber in the shop with the fewest SERVING tickets, tie-break barber.created_at ASC."
          - "Opens a Ticket in OPEN; QueueTicket.ticket_id set; Ticket.business_date stamped from clock."
          - "Remaining WAITING tickets' queue_position recomputed (created_at ASC)."
      - from: SERVING
        to: DONE
        trigger: "system (ticket checkout)"
        actor: system
        preconditions:
          - "The QueueTicket's Ticket transitions OPEN -> PAID."
        side_effects:
          - "QueueTicket.status -> DONE."
      - from: WAITING
        to: ABANDONED
        trigger: "POST /queue/{queueTicketId}/abandon"
        actor: [Receptionist, Customer]
        preconditions: []
        side_effects:
          - "Remaining WAITING tickets' queue_position recomputed (created_at ASC)."

  # ---------------------------------------------------------------------------
  - entity: Ticket
    field: status
    initial_state: OPEN
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /tickets/{ticketId}/checkout"
        actor: Receptionist
        preconditions:
          - "Shop.status == OPEN (ERR_SHOP_CLOSED)."
          - "Barber.license_status == ACTIVE (ERR_BARBER_NOT_ACTIVE)."
          - "Every catalog line is LISTED (ERR_ITEM_DELISTED)."
          - "Every product line has ProductSku.stock_qty >= qty (ERR_INSUFFICIENT_STOCK)."
          - "If redeem_reward, Customer.reward_credits >= 1 (ERR_NO_REWARD_CREDITS)."
          - "No DailySettlement exists for (barber_id, business_date) (ERR_DATE_ALREADY_SETTLED)."
        side_effects:
          - "Computes service_net_cents, product_net_cents, tax_cents, total_due_cents (see calculations)."
          - "CASCADE hop 1: Decrements ProductSku.stock_qty per product line."
          - "CASCADE hop 1: Barber.unsettled_revenue_cents += service_net_cents; increments Barber.version by 1."
          - "Shop.gross_service_revenue_cents += service_net_cents; Shop.gross_product_revenue_cents += product_net_cents."
          - "CASCADE hop 1: Customer.punch_count += 1; CASCADE hop 2: if punch_count >= Shop.punch_reward_threshold then reward_credits += 1 and punch_count -= threshold (caused by hop 1)."
          - "If redeem_reward, Customer.reward_credits -= 1."
          - "If linked to an Appointment in CHECKED_IN -> COMPLETED; if linked to a QueueTicket in SERVING -> DONE."
      - from: OPEN
        to: VOIDED
        trigger: "POST /tickets/{ticketId}/void"
        actor: ShopOwner
        preconditions:
          - "Ticket.status == OPEN (ERR_INVALID_STATE)."
        side_effects:
          - "If the linked Appointment is CHECKED_IN it reverts to BOOKED (ticket_id cleared); if the linked QueueTicket is SERVING it reverts to WAITING and is re-queued at the back (queue_position recomputed)."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: shift-create-stale-shop
    parent_entity: Shop
    write_endpoint: "POST /shifts"
    occ_field: "expected_shop_version"
    description: |
      Creating a BarberShift requires the client to pin the Shop version it last
      observed. If Shop.version has advanced since that read (another writer
      reopened the shop or created a shift that bumped the shop), the stale create
      is rejected. This is the CREATE-with-supersede case: the new shift would
      legitimately succeed against the shop config the client believes it sees, but
      that config view is stale.
    error_id: ERR_STALE_SHOP_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-barber
    parent_entity: Barber
    write_endpoint: "POST /barbers/{barberId}/settlements"
    occ_field: "expected_barber_version"
    description: |
      Creating a DailySettlement requires the client to pin the Barber version it
      last observed. A ticket checkout bumps Barber.version (via the
      unsettled_revenue_cents reconcile) between the client's read of the barber and
      its settlement POST; a settlement computed against the stale revenue snapshot
      would supersede the client's view and is rejected so figures reflect the
      current barber state.
    error_id: ERR_STALE_BARBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (A) Ticket service pricing: combinatorial mode (a) ---------------------
  - name: ticket_service_net_cents
    trigger: "POST /tickets/{ticketId}/checkout (Ticket OPEN -> PAID)"
    algorithm: combinatorial_pricing
    formula: |
      EVALUATION ORDER IS PINNED — do not reorder:
      1. service_gross = sum over service_line_ids of:
           (item.membership_included AND customer.membership_status == ACTIVE) ? 0 : item.price_cents
      2. addon_gross = sum over addon_line_ids of addon_price_after_membership(addon):
           if customer.membership_status != ACTIVE: addon.price_cents
           else:
             pct = addon.membership_discount_pct if addon.membership_discount_pct > 0
                   else customer.plan.addon_discount_pct
             # ROUND PER ADD-ON LINE (half-up) THEN SUM — rounding order pinned at per-line
             round_half_up( addon.price_cents * (1 - pct/100) )
      3. reward_waiver:
           if redeem_reward AND customer.reward_credits >= 1 AND service_line_ids is non-empty:
              cheapest = min(item.price_cents) over LISTED service_line_ids (tie-break item.created_at ASC)
              reward_waiver = min(cheapest, Shop.punch_reward_value_cents)
           else reward_waiver = 0
      4. service_net_cents = max(0, service_gross + addon_gross - reward_waiver)
    input_set: "service_line_ids and addon_line_ids on the Ticket (only LISTED items are addable; DELISTED rejected at line add / checkout)."
    constants: {}
    precision: "integer cents; per-add-on-line discount rounded half-up BEFORE summing."
    note: "Mode (a): >=3 inputs (membership status, included flag, discount pct, reward credit) with conditional branches; rounding order pinned per-line."

  # --- (B) Ticket tax + total: combinatorial mode (b) -------------------------
  - name: ticket_tax_and_total_cents
    trigger: "POST /tickets/{ticketId}/checkout (Ticket OPEN -> PAID)"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED:
      1. product_net_cents = sum over product_lines of (sku.price_cents * qty)
      2. taxable_base = service_net_cents + product_net_cents     # SUM FIRST
      3. tax_cents = round_half_up( taxable_base * Shop.tax_rate_pct / 100 )   # THEN round once on the summed base
      4. total_due_cents = service_net_cents + product_net_cents + tax_cents + tip_cents
    input_set: "All lines on this Ticket; tip untaxed."
    constants: {}
    precision: "integer cents; tax rounded half-up on the SUMMED taxable base (sum-then-round), NOT per line."
    note: "Mode (b): 'tax per line then sum' vs 'sum then tax' diverge by a cent; scaffold pins sum-then-round."

  # --- (C) Daily settlement payout: DUAL-VARIANT (ledger reconciliation) ------
  - name: daily_settlement_payout_cents
    trigger: "POST /barbers/{barberId}/settlements (DailySettlement created)"
    algorithm: ledger_reconciliation
    formula: |
      Over the barber's Ticket rows with status==PAID and business_date==settlement.business_date (VOIDED excluded):
        svc           = sum(ticket.service_net_cents)
        prod          = sum(ticket.product_net_cents)
        tips          = sum(ticket.tip_cents)
        prod_eligible = sum over those tickets of (sum over product_lines where sku.commission_eligible of sku.price_cents * qty)
      EVALUATION ORDER PINNED:
      VARIANT BOOTH_RENT (barber.comp_model == BOOTH_RENT):
        booth_rent_charged_cents = barber.booth_rent_cents
        shop_commission_cents    = 0
        barber_payout_cents      = tips + svc + prod - barber.booth_rent_cents
      VARIANT COMMISSION (barber.comp_model == COMMISSION):
        booth_rent_charged_cents = 0
        service_commission = round_half_up( svc * barber.commission_pct / 100 )                 # SHOP's service take
        product_commission = round_half_up( prod_eligible * Shop.product_commission_pct / 100 ) # BARBER's product earn
        shop_commission_cents = service_commission + (prod - product_commission)                # shop keeps service take + non-barber product margin
        barber_payout_cents   = tips + (svc - service_commission) + product_commission
    input_set: "Barber's PAID tickets on business_date; VOIDED excluded. No-show-fee tickets count as svc=0/prod=0 service-wise but contribute their fee to neither svc nor prod (fee is shop revenue)."
    constants: {}
    precision: "integer cents; service commission and product commission rounded half-up independently."
    variants:
      - name: booth_rent
        when: "barber.comp_model == BOOTH_RENT"
        difference: "Flat daily rent debited; barber keeps gross service+product; shop_commission_cents=0."
      - name: commission
        when: "barber.comp_model == COMMISSION"
        difference: "No rent; shop takes commission_pct of service plus non-eligible product margin; barber keeps remainder + product commission."
    note: "DUAL-VARIANT: identical (svc, prod, tips) yield different barber_payout_cents under the two comp models."

  # --- (D) No-show fee + strike (threshold on time) ---------------------------
  - name: no_show_fee_and_strike
    trigger: "POST /appointments/{appointmentId}/no-show (BOOKED -> NO_SHOW)"
    algorithm: threshold
    formula: |
      Gate: clock >= start_utc + Shop.late_grace_minutes (strict >=; at exactly the boundary the no-show IS allowed).
      strike = Customer.no_show_strikes + 1 (always +1).
      if strike >= Shop.no_show_strike_limit: Customer.status -> SUSPENDED.
      if Shop.no_show_fee_cents > 0: open+PAY a Ticket whose total_due_cents == Shop.no_show_fee_cents (no tax, no tip, no lines).
    input_set: "Single Appointment; Shop config."
    constants: {}
    precision: "integer cents; integer strike counts."
    note: "Boundary: clock == start_utc + grace -> allowed (>=); one minute earlier -> ERR_NO_SHOW_TOO_EARLY. Suspension boundary at strike==limit (>=)."

  # --- (E) Punch / reward accrual (threshold on count) ------------------------
  - name: punch_reward_accrual
    trigger: "POST /tickets/{ticketId}/checkout (Ticket OPEN -> PAID)"
    algorithm: threshold
    formula: |
      On checkout, AFTER pricing:
        punch_count_new = Customer.punch_count + 1
        if punch_count_new >= Shop.punch_reward_threshold:
            Customer.reward_credits += 1
            Customer.punch_count = punch_count_new - Shop.punch_reward_threshold
        else:
            Customer.punch_count = punch_count_new
      Redemption (when redeem_reward true at this same checkout) consumes a credit
      that existed BEFORE this checkout's accrual; a credit earned on THIS visit
      cannot be redeemed on THIS visit.
    input_set: "Customer.punch_count, Shop.punch_reward_threshold."
    constants: {}
    precision: "integer counts."
    note: "Boundary: punch_count_new == threshold grants the reward (>=); threshold-1 does not. A zero-line ticket (empty service+product) still earns a punch."

  # --- (F) Appointment slot end (interval compute) ----------------------------
  - name: appointment_slot_end_utc
    trigger: "POST /appointments (create)"
    algorithm: interval_compute
    formula: |
      end_utc = start_utc + (service.duration_minutes + sum over addon_ids of addon.extra_minutes) minutes.
    input_set: "ServiceMenuItem.duration_minutes and each AddOn.extra_minutes referenced by addon_ids."
    constants: {}
    precision: "minute granularity."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed."
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted per §1.7; entity-backed roles (Barber, Customer) acting on their own resource must match X-User-ID to the resource's owner FK."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (shopId, barberId, chairId, shiftId, appointmentId, queueTicketId, ticketId, settlementId)."
    error_id: "ERR_SHOP_NOT_FOUND / ERR_BARBER_NOT_FOUND / ERR_CHAIR_NOT_FOUND / ERR_SHIFT_NOT_FOUND / ERR_APPOINTMENT_NOT_FOUND / ERR_QUEUE_TICKET_NOT_FOUND / ERR_TICKET_NOT_FOUND / ERR_SETTLEMENT_NOT_FOUND"
    http_status: 404
    applies_to: all path-nested endpoints

  - priority: 4
    category: existence
    check: "Body FKs resolve within the shop (shop_id, customer_id, barber_id, chair_id, service_item_id, addon_ids[], product_lines[].product_sku_id, membership_id)."
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "create/checkout endpoints carrying body FKs"

  - priority: 5
    category: business_constraint
    check: "Body well-formed: required fields present, enums valid, numbers in declared ranges, end_utc > start_utc, qty >= 1."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all create/update endpoints

  - priority: 6
    category: state
    check: "Shop.status == OPEN for booking, enqueue, check-in, serve, checkout, no-show."
    error_id: ERR_SHOP_CLOSED
    http_status: 409
    applies_to: "booking/queue/check-in/serve/checkout/no-show endpoints"

  - priority: 7
    category: state
    check: "Target resource in the correct state for the transition (Appointment BOOKED for check-in/cancel/no-show; Ticket OPEN for checkout/void; QueueTicket WAITING for serve/abandon; BarberShift SCHEDULED for cancel)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_referential
    check: "Catalog lines must be LISTED (ServiceMenuItem/AddOn/ProductSku); Membership must be OFFERED to subscribe."
    error_id: ERR_ITEM_DELISTED
    http_status: 409
    applies_to: "appointment create, ticket line edit, checkout, subscribe"

  - priority: 9
    category: business_safety
    check: "Serving barber's license_status == ACTIVE at appointment create, check-in, serve, and checkout."
    error_id: ERR_BARBER_NOT_ACTIVE
    http_status: 409
    applies_to: "appointment create, check-in, serve, checkout"

  - priority: 10
    category: business_safety
    check: "Customer.status == ACTIVE to book an appointment or take a queue ticket."
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "appointment create, queue enqueue"

  - priority: 11
    category: business_temporal
    check: "Appointment slot [start_utc, end_utc) must lie fully within ONE SCHEDULED BarberShift of the same barber on the same chair (half-open containment: shift.start <= slot.start AND slot.end <= shift.end)."
    error_id: ERR_OUTSIDE_SHIFT
    http_status: 409
    applies_to: "appointment create"

  - priority: 12
    category: business_temporal
    check: "Appointment slot [start_utc, end_utc) must not overlap any non-terminal (BOOKED/CHECKED_IN) appointment on the same chair. HALF-OPEN: touching endpoints (a.end == b.start) do NOT overlap."
    error_id: ERR_CHAIR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "appointment create"

  - priority: 13
    category: business_temporal
    check: "Two SCHEDULED BarberShifts on the same chair must keep a >= Shop.late_grace_minutes buffer: a.end_utc + grace <= b.start_utc (CLOSED-BUFFER). Back-to-back shifts that merely touch (gap 0) are rejected — distinct interval semantics from the half-open appointment overlap."
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "shift create"

  - priority: 14
    category: business_constraint
    check: "Queue serve must target the FIFO front (queue_position == 1 overall, or the lowest-created_at WAITING among those requesting that barber)."
    error_id: ERR_NOT_QUEUE_FRONT
    http_status: 409
    applies_to: "queue serve"

  - priority: 15
    category: business_constraint
    check: "Product checkout lines require ProductSku.stock_qty >= qty."
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "ticket checkout"

  - priority: 16
    category: business_constraint
    check: "redeem_reward at checkout requires Customer.reward_credits >= 1 (a credit existing BEFORE this checkout's accrual)."
    error_id: ERR_NO_REWARD_CREDITS
    http_status: 409
    applies_to: "ticket checkout"

  - priority: 17
    category: business_fiscal
    check: "No DailySettlement may already exist for (barber_id, business_date) on settlement create; and no Ticket may be checked out (PAID) for a (barber_id, business_date) that is already settled."
    error_id: ERR_DATE_ALREADY_SETTLED
    http_status: 409
    applies_to: "settlement create, ticket checkout"

  - priority: 18
    category: business_fiscal
    check: "OCC: expected_shop_version (shift create) / expected_barber_version (settlement create) must equal the live parent version."
    error_id: "ERR_STALE_SHOP_VERSION / ERR_STALE_BARBER_VERSION"
    http_status: 412
    applies_to: "shift create (Shop OCC); settlement create (Barber OCC)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an absolute ISO 8601 UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/window/business_date rules read this clock."
    roles: [ShopOwner]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced to the given instant."]

  # ---- Shop -----------------------------------------------------------------
  - method: POST
    path: "/shops"
    description: "Create a Shop."
    roles: [ShopOwner]
    code: 201
    input: [name, tax_rate_pct, default_booth_rent_cents, default_commission_pct, "product_commission_pct?", "no_show_fee_cents?", "no_show_strike_limit?", "late_grace_minutes?", "punch_reward_threshold?", "punch_reward_value_cents?"]
    output: Shop
    side_effects: ["status=OPEN, version=1, ledgers zeroed."]

  - method: GET
    path: "/shops"
    description: "List shops."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Shop[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}"
    description: "Get a shop."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: Shop
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/close"
    description: "Close the shop (blocks operational mutations)."
    roles: [ShopOwner]
    code: 200
    input: []
    output: Shop
    side_effects: ["status -> CLOSED", "increments Shop.version by 1"]

  - method: POST
    path: "/shops/{shopId}/reopen"
    description: "Reopen the shop."
    roles: [ShopOwner]
    code: 200
    input: []
    output: Shop
    side_effects: ["status -> OPEN", "increments Shop.version by 1"]

  # ---- Barber ---------------------------------------------------------------
  - method: POST
    path: "/barbers"
    description: "Create a Barber."
    roles: [ShopOwner]
    code: 201
    input: [shop_id, full_name, license_number, license_expires_on, comp_model, "booth_rent_cents?", "commission_pct?"]
    output: Barber
    side_effects: ["license_status=PENDING, status=ACTIVE, unsettled_revenue_cents=0; booth_rent_cents/commission_pct default from shop when omitted."]

  - method: GET
    path: "/barbers"
    description: "List barbers. Filterable by shop_id (reverse-reachability for Barber.shop_id)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "Barber[]"
    side_effects: []

  - method: GET
    path: "/barbers/{barberId}"
    description: "Get a barber."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: Barber
    side_effects: []

  - method: POST
    path: "/barbers/{barberId}/license/activate"
    description: "Activate (PENDING/SUSPENDED -> ACTIVE) the barber license."
    roles: [ShopOwner]
    code: 200
    input: []
    output: Barber
    side_effects: ["license_status -> ACTIVE (if not expired)."]

  - method: POST
    path: "/barbers/{barberId}/license/suspend"
    description: "Suspend (ACTIVE -> SUSPENDED); cascades cancellation of the barber's future BOOKED appointments."
    roles: [ShopOwner]
    code: 200
    input: []
    output: Barber
    side_effects: ["license_status -> SUSPENDED", "future BOOKED appointments -> CANCELLED (no no-show fee)."]

  - method: POST
    path: "/barbers/{barberId}/license/revoke"
    description: "Revoke the license (terminal); cascades future shift + appointment cancellation."
    roles: [ShopOwner]
    code: 200
    input: []
    output: Barber
    side_effects: ["license_status -> REVOKED", "future SCHEDULED shifts -> CANCELLED", "BOOKED appointments -> CANCELLED."]

  - method: GET
    path: "/barbers/{barberId}/settlements"
    description: "List DailySettlement rows for a barber (sub-resource reverse-reachability for DailySettlement.barber_id)."
    roles: [ShopOwner, Barber]
    code: 200
    input: ["business_date?", "limit?", "offset?"]
    output: "DailySettlement[]"
    side_effects: []

  - method: POST
    path: "/barbers/{barberId}/settlements"
    description: "Create (finalize) a DailySettlement for a barber on a business_date. Aggregates that day's PAID tickets and computes payout per comp_model variant. OCC on Barber.version."
    roles: [ShopOwner]
    code: 201
    input: [business_date, expected_barber_version]
    output: DailySettlement
    side_effects:
      - "Computes service/product/tip totals, booth_rent_charged_cents, shop_commission_cents, barber_payout_cents."
      - "Barber.unsettled_revenue_cents decremented by the settled service_net (reconciled toward 0 for that date)."
      - "increments Barber.version by 1."
      - "status=FINALIZED (immutable)."

  # ---- DailySettlement (top-level reads) ------------------------------------
  - method: GET
    path: "/settlements"
    description: "List DailySettlement rows. Filterable by shop_id, barber_id, business_date (reverse-reachability for DailySettlement.shop_id and DailySettlement.barber_id)."
    roles: [ShopOwner, Barber]
    code: 200
    input: ["shop_id?", "barber_id?", "business_date?", "limit?", "offset?"]
    output: "DailySettlement[]"
    side_effects: []

  - method: GET
    path: "/settlements/{settlementId}"
    description: "Get a single DailySettlement."
    roles: [ShopOwner, Barber]
    code: 200
    input: []
    output: DailySettlement
    side_effects: []

  # ---- Chair ----------------------------------------------------------------
  - method: POST
    path: "/chairs"
    description: "Create a Chair."
    roles: [ShopOwner]
    code: 201
    input: [shop_id, label]
    output: Chair
    side_effects: ["status=AVAILABLE."]

  - method: GET
    path: "/chairs"
    description: "List chairs. Filterable by shop_id (reverse-reachability for Chair.shop_id)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "Chair[]"
    side_effects: []

  - method: GET
    path: "/chairs/{chairId}"
    description: "Get a chair."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: Chair
    side_effects: []

  # ---- BarberShift ----------------------------------------------------------
  - method: POST
    path: "/shifts"
    description: "Schedule a BarberShift (barber on a chair for a UTC window). OCC on Shop.version; overlap-checked with closed-buffer semantics."
    roles: [ShopOwner]
    code: 201
    input: [shop_id, barber_id, chair_id, start_utc, end_utc, expected_shop_version]
    output: BarberShift
    side_effects: ["status=SCHEDULED.", "increments Shop.version by 1"]

  - method: GET
    path: "/shifts"
    description: "List BarberShifts. Filterable by shop_id, barber_id, chair_id (reverse-reachability for BarberShift.shop_id, barber_id, chair_id)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "barber_id?", "chair_id?", "limit?", "offset?"]
    output: "BarberShift[]"
    side_effects: []

  - method: GET
    path: "/shifts/{shiftId}"
    description: "Get a shift."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: BarberShift
    side_effects: []

  - method: POST
    path: "/shifts/{shiftId}/cancel"
    description: "Cancel a SCHEDULED shift."
    roles: [ShopOwner]
    code: 200
    input: []
    output: BarberShift
    side_effects: ["status -> CANCELLED."]

  # ---- Catalog --------------------------------------------------------------
  - method: POST
    path: "/services"
    description: "Create a ServiceMenuItem."
    roles: [ShopOwner]
    code: 201
    input: [shop_id, name, price_cents, duration_minutes, "membership_included?"]
    output: ServiceMenuItem
    side_effects: ["status=LISTED."]

  - method: GET
    path: "/services"
    description: "List services. Filterable by shop_id (reverse-reachability for ServiceMenuItem.shop_id)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "ServiceMenuItem[]"
    side_effects: []

  - method: GET
    path: "/services/{serviceId}"
    description: "Get a service."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: ServiceMenuItem
    side_effects: []

  - method: POST
    path: "/services/{serviceId}/delist"
    description: "Delist a ServiceMenuItem (LISTED -> DELISTED)."
    roles: [ShopOwner]
    code: 200
    input: []
    output: ServiceMenuItem
    side_effects: ["status -> DELISTED."]

  - method: POST
    path: "/addons"
    description: "Create an AddOn."
    roles: [ShopOwner]
    code: 201
    input: [shop_id, name, price_cents, "extra_minutes?", "membership_discount_pct?"]
    output: AddOn
    side_effects: ["status=LISTED."]

  - method: GET
    path: "/addons"
    description: "List add-ons. Filterable by shop_id (reverse-reachability for AddOn.shop_id)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "AddOn[]"
    side_effects: []

  - method: GET
    path: "/addons/{addonId}"
    description: "Get an add-on."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: POST
    path: "/addons/{addonId}/delist"
    description: "Delist an AddOn (LISTED -> DELISTED)."
    roles: [ShopOwner]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status -> DELISTED."]

  - method: POST
    path: "/products"
    description: "Create a ProductSku."
    roles: [ShopOwner]
    code: 201
    input: [shop_id, name, price_cents, "stock_qty?", "commission_eligible?"]
    output: ProductSku
    side_effects: ["status=LISTED."]

  - method: GET
    path: "/products"
    description: "List products. Filterable by shop_id (reverse-reachability for ProductSku.shop_id)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "ProductSku[]"
    side_effects: []

  - method: GET
    path: "/products/{productId}"
    description: "Get a product (stock check)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: ProductSku
    side_effects: []

  - method: POST
    path: "/products/{productId}/delist"
    description: "Delist a ProductSku (LISTED -> DELISTED)."
    roles: [ShopOwner]
    code: 200
    input: []
    output: ProductSku
    side_effects: ["status -> DELISTED."]

  - method: POST
    path: "/memberships"
    description: "Create a Membership plan."
    roles: [ShopOwner]
    code: 201
    input: [shop_id, name, monthly_fee_cents, "addon_discount_pct?"]
    output: Membership
    side_effects: ["status=OFFERED."]

  - method: GET
    path: "/memberships"
    description: "List membership plans. Filterable by shop_id (reverse-reachability for Membership.shop_id)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []

  - method: GET
    path: "/memberships/{membershipId}"
    description: "Get a membership plan."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: POST
    path: "/memberships/{membershipId}/retire"
    description: "Retire a Membership plan (OFFERED -> RETIRED)."
    roles: [ShopOwner]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> RETIRED."]

  # ---- Customer -------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Create a Customer."
    roles: [ShopOwner, Receptionist]
    code: 201
    input: [shop_id, full_name, email]
    output: Customer
    side_effects: ["status=ACTIVE, membership_status=NONE, punch_count=0, reward_credits=0, no_show_strikes=0."]

  - method: GET
    path: "/customers"
    description: "List customers. Filterable by shop_id and membership_id (reverse-reachability for Customer.shop_id and Customer.membership_id)."
    roles: [ShopOwner, Receptionist]
    code: 200
    input: ["shop_id?", "membership_id?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer (own record for the Customer role)."
    roles: [ShopOwner, Receptionist, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/customers/{customerId}/subscribe"
    description: "Subscribe a customer to an OFFERED membership plan."
    roles: [ShopOwner, Receptionist, Customer]
    code: 200
    input: [membership_id]
    output: Customer
    side_effects: ["membership_id set, membership_status -> ACTIVE."]

  # ---- Appointment ----------------------------------------------------------
  - method: POST
    path: "/appointments"
    description: "Book an appointment. Validates shift containment + chair non-overlap + barber active + customer active. end_utc computed."
    roles: [ShopOwner, Receptionist, Customer]
    code: 201
    input: [shop_id, customer_id, barber_id, chair_id, service_item_id, "addon_ids?", start_utc]
    output: Appointment
    side_effects: ["status=BOOKED, end_utc computed, check_in_punctuality=UNSET."]

  - method: GET
    path: "/appointments"
    description: "List appointments. Filterable by shop_id, customer_id, barber_id, chair_id, service_item_id, ticket_id (reverse-reachability for those FKs)."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "customer_id?", "barber_id?", "chair_id?", "service_item_id?", "ticket_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{appointmentId}"
    description: "Get an appointment."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{appointmentId}/check-in"
    description: "Check in a BOOKED appointment; opens its Ticket and records punctuality."
    roles: [ShopOwner, Receptionist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CHECKED_IN", "Ticket opened (OPEN), ticket_id set", "check_in_punctuality computed."]

  - method: POST
    path: "/appointments/{appointmentId}/no-show"
    description: "Mark a BOOKED appointment NO_SHOW after grace; increments strikes (auto-suspend at limit) and optionally charges a no-show fee ticket."
    roles: [ShopOwner, Receptionist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> NO_SHOW", "Customer.no_show_strikes += 1 (cascade may suspend)", "no-show fee ticket if configured."]

  - method: POST
    path: "/appointments/{appointmentId}/cancel"
    description: "Cancel a BOOKED appointment before its start."
    roles: [ShopOwner, Receptionist, Customer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status -> CANCELLED."]

  # ---- QueueTicket ----------------------------------------------------------
  - method: POST
    path: "/queue"
    description: "Take a walk-in queue ticket; queue_position assigned at the back (created_at ASC)."
    roles: [ShopOwner, Receptionist, Customer]
    code: 201
    input: [shop_id, customer_id, "requested_barber_id?"]
    output: QueueTicket
    side_effects: ["status=WAITING, queue_position computed."]

  - method: GET
    path: "/queue"
    description: "List queue tickets. Filterable by shop_id, customer_id, requested_barber_id, assigned_barber_id, ticket_id (reverse-reachability for those FKs); default ordered queue_position ASC among WAITING."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: ["shop_id?", "customer_id?", "requested_barber_id?", "assigned_barber_id?", "ticket_id?", "limit?", "offset?"]
    output: "QueueTicket[]"
    side_effects: []

  - method: GET
    path: "/queue/{queueTicketId}"
    description: "Get a queue ticket."
    roles: [ShopOwner, Receptionist, Barber, Customer]
    code: 200
    input: []
    output: QueueTicket
    side_effects: []

  - method: POST
    path: "/queue/{queueTicketId}/serve"
    description: "Serve the front WAITING queue ticket; resolves a barber, opens a Ticket, recomputes positions."
    roles: [ShopOwner, Receptionist]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["status -> SERVING", "assigned_barber_id resolved", "Ticket opened, ticket_id set", "positions recomputed."]

  - method: POST
    path: "/queue/{queueTicketId}/abandon"
    description: "Abandon a WAITING queue ticket."
    roles: [ShopOwner, Receptionist, Customer]
    code: 200
    input: []
    output: QueueTicket
    side_effects: ["status -> ABANDONED", "positions recomputed."]

  # ---- Ticket ---------------------------------------------------------------
  - method: GET
    path: "/tickets"
    description: "List tickets. Filterable by shop_id, customer_id, barber_id, appointment_id, queue_ticket_id, business_date (reverse-reachability for those FKs)."
    roles: [ShopOwner, Receptionist, Barber]
    code: 200
    input: ["shop_id?", "customer_id?", "barber_id?", "appointment_id?", "queue_ticket_id?", "business_date?", "limit?", "offset?"]
    output: "Ticket[]"
    side_effects: []

  - method: GET
    path: "/tickets/{ticketId}"
    description: "Get a ticket (current lines and computed totals)."
    roles: [ShopOwner, Receptionist, Barber]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: PUT
    path: "/tickets/{ticketId}/lines"
    description: "Replace the service/addon/product/tip/redeem fields on an OPEN ticket before checkout."
    roles: [ShopOwner, Receptionist]
    code: 200
    input: ["service_line_ids?", "addon_line_ids?", "product_lines?", "tip_cents?", "redeem_reward?"]
    output: Ticket
    side_effects: ["Ticket lines/tip/redeem flag updated (OPEN only); LISTED check applied."]

  - method: POST
    path: "/tickets/{ticketId}/checkout"
    description: "Check out (OPEN -> PAID): prices the ticket, decrements stock, reconciles ledgers, accrues/redeems punches, completes the source appointment/queue."
    roles: [ShopOwner, Receptionist]
    code: 200
    input: []
    output: Ticket
    side_effects:
      - "Computes service_net_cents/product_net_cents/tax_cents/total_due_cents."
      - "ProductSku.stock_qty decremented."
      - "Barber.unsettled_revenue_cents += service_net_cents; increments Barber.version by 1."
      - "Shop ledgers updated."
      - "Customer punch accrual + optional reward redemption."
      - "Source Appointment -> COMPLETED or QueueTicket -> DONE."

  - method: POST
    path: "/tickets/{ticketId}/void"
    description: "Void an OPEN ticket; reverts the linked appointment/queue ticket."
    roles: [ShopOwner]
    code: 200
    input: []
    output: Ticket
    side_effects: ["status -> VOIDED", "linked Appointment reverts to BOOKED / QueueTicket reverts to WAITING (re-queued at back)."]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid." }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the operation, or entity-backed actor acting on a resource it does not own." }
  # --- Not found ---
  - { id: ERR_SHOP_NOT_FOUND, http: 404, condition: "shopId does not exist." }
  - { id: ERR_BARBER_NOT_FOUND, http: 404, condition: "barberId does not exist." }
  - { id: ERR_CHAIR_NOT_FOUND, http: 404, condition: "chairId does not exist." }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "shiftId does not exist." }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "appointmentId does not exist." }
  - { id: ERR_QUEUE_TICKET_NOT_FOUND, http: 404, condition: "queueTicketId does not exist." }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "ticketId does not exist." }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlement id does not exist." }
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 404, condition: "A body FK (shop/customer/barber/chair/service/addon/product/membership) does not resolve within the shop." }
  # --- Request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range number, end_utc <= start_utc, qty < 1." }
  # --- State ---
  - { id: ERR_SHOP_CLOSED, http: 409, condition: "Operation requires Shop.status == OPEN." }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in the required state for the transition (appointment not BOOKED, ticket not OPEN, shift not SCHEDULED, queue ticket not WAITING)." }
  # --- Business ---
  - { id: ERR_ITEM_DELISTED, http: 409, condition: "A referenced ServiceMenuItem/AddOn/ProductSku is DELISTED, or Membership is RETIRED on subscribe." }
  - { id: ERR_BARBER_NOT_ACTIVE, http: 409, condition: "Serving barber license_status != ACTIVE at booking/check-in/serve/checkout." }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Customer.status == SUSPENDED at booking or queue enqueue." }
  - { id: ERR_LICENSE_EXPIRED, http: 409, condition: "license_expires_on < logical clock date at activation." }
  - { id: ERR_OUTSIDE_SHIFT, http: 409, condition: "Appointment slot not fully contained in one SCHEDULED shift of the barber on the chair." }
  - { id: ERR_CHAIR_DOUBLE_BOOKED, http: 409, condition: "Appointment slot overlaps a non-terminal appointment on the same chair (half-open)." }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New shift violates the closed-buffer gap against another SCHEDULED shift on the same chair." }
  - { id: ERR_SHIFT_HAS_APPOINTMENTS, http: 409, condition: "Cancelling a shift that still contains a BOOKED/CHECKED_IN appointment." }
  - { id: ERR_NOT_QUEUE_FRONT, http: 409, condition: "Serve called on a queue ticket that is not the front WAITING (overall, or among the requested barber)." }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Product line qty exceeds ProductSku.stock_qty at checkout." }
  - { id: ERR_NO_REWARD_CREDITS, http: 409, condition: "redeem_reward set but Customer.reward_credits < 1." }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "No-show called before start_utc + Shop.late_grace_minutes." }
  - { id: ERR_CANCEL_TOO_LATE, http: 409, condition: "Cancel called at/after start_utc." }
  - { id: ERR_OPEN_TICKETS_EXIST, http: 409, condition: "Closing a shop while an OPEN ticket or CHECKED_IN appointment exists." }
  # --- Fiscal / OCC ---
  - { id: ERR_DATE_ALREADY_SETTLED, http: 409, condition: "A DailySettlement already exists for (barber_id, business_date), or a checkout targets an already-settled (barber, date)." }
  - { id: ERR_STALE_SHOP_VERSION, http: 412, condition: "expected_shop_version != live Shop.version on shift create." }
  - { id: ERR_STALE_BARBER_VERSION, http: 412, condition: "expected_barber_version != live Barber.version on settlement create." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopOwner
    description: "Operator of the shop; full config, license lifecycle, settlement, void."
    identity: "opaque"
    exclusive_operations:
      - "POST /shops — create shop"
      - "POST /shops/{shopId}/close|reopen — shop lifecycle"
      - "POST /barbers — create barber"
      - "POST /barbers/{barberId}/license/activate|suspend|revoke — license lifecycle"
      - "POST /barbers/{barberId}/settlements — finalize daily settlement"
      - "POST /chairs — create chair"
      - "POST /shifts, /shifts/{id}/cancel — schedule/cancel shifts"
      - "POST /services|/addons|/products|/memberships — catalog create"
      - "POST /services/{id}/delist, /addons/{id}/delist, /memberships/{id}/retire — catalog lifecycle"
      - "POST /tickets/{ticketId}/void — void ticket"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /customers — create customer (with Receptionist)"
      - "POST /appointments — book (with Receptionist, Customer)"
      - "POST /appointments/{id}/check-in|no-show — (with Receptionist)"
      - "POST /appointments/{id}/cancel — (with Receptionist, Customer)"
      - "POST /queue, /queue/{id}/abandon — (with Receptionist, Customer)"
      - "POST /queue/{id}/serve — (with Receptionist)"
      - "PUT /tickets/{id}/lines, POST /tickets/{id}/checkout — (with Receptionist)"
      - "POST /customers/{id}/subscribe — (with Receptionist, Customer)"
      - "all GET reads"

  - name: Receptionist
    description: "Front-desk staff; booking, queue, check-in, checkout, customer management."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /customers — create customer (with ShopOwner)"
      - "POST /appointments — book (with ShopOwner, Customer)"
      - "POST /appointments/{id}/check-in|no-show — (with ShopOwner)"
      - "POST /appointments/{id}/cancel — (with ShopOwner, Customer)"
      - "POST /queue — enqueue (with ShopOwner, Customer)"
      - "POST /queue/{id}/serve — serve (with ShopOwner)"
      - "POST /queue/{id}/abandon — (with ShopOwner, Customer)"
      - "PUT /tickets/{id}/lines, POST /tickets/{id}/checkout — (with ShopOwner)"
      - "POST /customers/{id}/subscribe — (with ShopOwner, Customer)"
      - "GET reads (shops, barbers, chairs, shifts, services, addons, products, memberships, customers, appointments, queue, tickets)"

  - name: Barber
    description: "A licensed barber; reads own schedule, tickets, settlements. Entity-backed: X-User-ID equals a Barber.id."
    identity: "entity_backed:Barber"
    exclusive_operations: []
    shared_operations:
      - "GET /shops, /shops/{id} — read shops"
      - "GET /barbers, /barbers/{id} — read barbers"
      - "GET /shifts — read shifts"
      - "GET /barbers/{barberId}/settlements — read own settlements"
      - "GET /tickets — read tickets"
      - "GET /chairs, /services, /addons, /products, /memberships, /appointments, /queue — catalog and ops reads"

  - name: Customer
    description: "A shop customer; self-service booking, queue, subscribe, own reads. Entity-backed: X-User-ID equals a Customer.id."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /appointments — book own (with ShopOwner, Receptionist)"
      - "POST /appointments/{id}/cancel — cancel own (with ShopOwner, Receptionist)"
      - "POST /queue — enqueue self (with ShopOwner, Receptionist)"
      - "POST /queue/{id}/abandon — abandon own (with ShopOwner, Receptionist)"
      - "POST /customers/{id}/subscribe — subscribe self (with ShopOwner, Receptionist)"
      - "GET /customers/{customerId} — read own record"
      - "GET /shops, /barbers, /chairs, /shifts, /services, /addons, /products, /memberships, /appointments, /queue — reads"
