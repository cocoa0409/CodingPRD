  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: restricted_posture_from_stale_feed_blocks_new_redemption_while_pending_one_still_verifies
        grounds:
          - calculations.employer_program_posture
          - validations[priority=66]
          - errors[ERR_PROGRAM_RESTRICTED]
          - state_machines.Employer.integration_status.SYNCED_to_STALE
          - state_machines.Redemption.verification_status.PENDING_to_VERIFIED
          - endpoints[POST /_ops/run-epoch]
        distinguishing_aspect: |
          The entity pair under test is Redemption depending on Employer: whether a redemption
          write is permitted is decided by the OTHER entity's derived program_posture, and the
          dependency is asymmetric - the same RESTRICTED employer refuses redemption CREATION
          with ERR_PROGRAM_RESTRICTED while still permitting VERIFICATION of a redemption that
          was already PENDING.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; the full merchant/agreement/employer/offer chain is built and the eligibility batch is applied on that date, so Employer.last_sync_at = 2026-08-01T00:00:00Z and program_posture = LIVE."
            - "The clock is moved to 2026-09-14T00:00:00Z, still one day short of last_sync_at + 45 days, and one redemption is created while the program is LIVE."
            - "The clock is then moved to 2026-09-16T00:00:00Z, which is past last_sync_at + 45 days but still short of that redemption's verification_expires_at of 2026-09-17T00:00:00Z, and the epoch sweep is run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
