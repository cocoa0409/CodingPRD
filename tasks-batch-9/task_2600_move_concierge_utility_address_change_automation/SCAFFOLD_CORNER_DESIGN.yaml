# §1.9 Scaffold Corner Design — task 2600 Move Concierge & Utility/Address Change Automation
#
# One `section:` block per Claim Extraction Guide table, each holding the instances that make the
# scaffold's ordinary claims falsifiable. Corners that §1.8 already asserts appear here as
# `excluded_because:` stubs naming the difficulty instance that owns them, so the union of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml + this file covers every entity, transition, calculation,
# validation, endpoint, error code, role and cross-cutting layer declared in SCAFFOLD.yaml.
#
# Fixture conventions (shared with §1.8): the logical clock is pinned with
# POST /_clock/set_current_utc before anything else; every id, version and derived amount used by a
# later call is captured from an earlier response; every asserted number is a pre-computed literal.

scaffold_corner_design:

  - section: entities
    instances:

      - name: creation_resident_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - "endpoints[POST /residents]"
          - entities.Resident.fields.full_name
          - entities.Resident.fields.marketing_opt_out
          - entities.Resident.fields.opted_out_at
          - response_envelope.success
        distinguishing_aspect: |
          The plain creation claim for the root entity of the consent aggregate: all five required
          input fields echo back, the two non-input fields take their declared defaults, and the
          common fields appear exactly once. No state machine, no calculation.
        test_recipe:
          setup:
            - "Logical clock pinned to the startup default so created_at is a known literal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
          assert:
            - "HTTP 201 with response_type object"
            - "data.full_name == Dana Ruiz, data.email == dana.ruiz@example.com, data.phone_last4 == 4417, data.date_of_birth == 1988-04-12, data.ssn_last4 == 6621"
            - "data.marketing_opt_out == false (declared default) and data.opted_out_at == null"
            - "data.id is a server-generated identifier, data.version == 1, data.created_at == 2026-08-01T00:00:00Z, data.updated_at == 2026-08-01T00:00:00Z"

      - name: retrieval_move_returns_stored_intake_fields
        claim_type: retrieval
        grounds:
          - "endpoints[GET /moves/{id}]"
          - entities.MoveRecord.fields.external_reference
          - entities.MoveRecord.fields.lifecycle_status
          - entities.MoveRecord.fields.unmapped_utility_types
        distinguishing_aspect: |
          Read-back of the graph-topology hub entity: the four foreign keys, the input scalars and
          every system/computed default are visible on a bare GET with no intervening write, which
          is what later cascade instances diff against.
        test_recipe:
          setup:
            - "One feed source, one resident, an origin and a destination address, and a move at intake."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20", external_reference: "PM-77" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
          trigger:
            - call: "GET /moves/${mv_id}"
              payload: {}
              as: MoveOpsAgent
          assert:
            - "HTTP 200"
            - "data.resident_id == ${res_id}, data.feed_source_id == ${fs_id}, data.origin_address_id == ${orig_id}, data.destination_address_id == ${dest_id}"
            - "data.move_date == 2026-08-20 and data.external_reference == PM-77"
            - "data.lifecycle_status == INTAKE, data.duplicate_flag == NONE, data.duplicate_match_score == 0.00, data.duplicate_candidate_move_id == null, data.reactivation_candidate_move_id == null"
            - "data.consent_gate == OPEN, data.blocked_reason == NONE, data.verified_at == null, data.identity_attempt_count == 0, data.mapped_order_count == 0, data.unmapped_utility_types == []"
            - "data.readiness_score == 0 and data.version == 1"

      - name: listing_moves_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - "endpoints[GET /moves]"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Offset pagination over the hub list endpoint with three rows and limit 2: the window,
          total_count and has_more are asserted on both pages, and a lifecycle_status filter is
          combined with the same limit to show filter-then-paginate ordering.
        test_recipe:
          setup:
            - "Three residents with distinct names and emails, three destination addresses sharing one postal code, and three moves whose dates are 10 days apart so no pair reaches the suspect threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res1_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Ivan Cole", email: "ivan.cole@example.com", phone_last4: "9052", date_of_birth: "1979-11-02", ssn_last4: "3318" }
              as: PlatformAdmin
              captures: { res2_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Priya Nadar", email: "priya.nadar@example.com", phone_last4: "2288", date_of_birth: "1992-02-17", ssn_last4: "7714" }
              as: PlatformAdmin
              captures: { res3_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "915 Juniper St", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "77 Oak Ridge Rd", city: "Macon", state_code: "GA", postal_code: "31201" }
              as: PlatformAdmin
              captures: { d3_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res1_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d1_id}", move_date: "2026-08-10", external_reference: "PM-P1" }
              as: MoveOpsAgent
              captures: { mv1_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res2_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d2_id}", move_date: "2026-08-20", external_reference: "PM-P2" }
              as: MoveOpsAgent
              captures: { mv2_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res3_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d3_id}", move_date: "2026-08-30", external_reference: "PM-P3" }
              as: MoveOpsAgent
              captures: { mv3_id: $.data.id }
          trigger:
            - call: "GET /moves"
              payload: { limit: 2, offset: 0 }
              as: MoveOpsAgent
            - call: "GET /moves"
              payload: { limit: 2, offset: 2 }
              as: MoveOpsAgent
            - call: "GET /moves"
              payload: { lifecycle_status: "INTAKE", resident_id: "${res2_id}", limit: 2, offset: 0 }
              as: MoveOpsAgent
          assert:
            - "trigger call 1 returns HTTP 200 with response_type array, exactly 2 rows, total_count == 3 and has_more == true"
            - "trigger call 2 returns exactly 1 row, total_count == 3 and has_more == false"
            - "trigger call 3 returns exactly 1 row whose id == ${mv2_id}, total_count == 1 and has_more == false"
            - "every returned move has duplicate_flag == NONE (the 10-day spacing keeps each pair below DUP_SUSPECT_THRESHOLD)"

      - name: not_found_unknown_utility_order_path_id_returns_404
        claim_type: not_found
        grounds:
          - "endpoints[GET /utility-orders/{id}]"
          - "errors[ERR_UTILITY_ORDER_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: |
          Existence resolution for a child entity that has no create endpoint at all: the only way
          a UtilityOrder id can exist is provider mapping, so an unknown id must produce the
          entity-specific 404 rather than a generic one.
        test_recipe:
          setup:
            - "Clock pinned; no utility order is ever created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /utility-orders/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: MoveOpsAgent
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with response_type error"
            - "data.error_id == ERR_UTILITY_ORDER_NOT_FOUND"

      - name: required_fields_move_creation_missing_required_move_date_rejected
        claim_type: required_fields
        grounds:
          - "endpoints[POST /moves]"
          - "validations[priority=6]"
          - "errors[ERR_INVALID_REQUEST]"
          - entities.MoveRecord.fields.move_date
        distinguishing_aspect: |
          Schema conformance before any business rule: move_date is the input field every temporal
          rule reads, so its absence must be a 422 at priority 6 and must not be defaulted to the
          clock date.
        test_recipe:
          setup:
            - "Feed source, resident and both addresses exist, so the only defect is the missing field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
          trigger:
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}" }
              as: MoveOpsAgent
              captures: { err_id: $.data.error_id }
            - call: "GET /moves"
              payload: { resident_id: "${res_id}", limit: 10, offset: 0 }
              as: MoveOpsAgent
          assert:
            - "trigger call 1 returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST"
            - "trigger call 2 returns total_count == 0 (no partial row was written)"

      - name: defaults_feed_source_dedupe_window_and_trust_tier_applied
        claim_type: defaults
        grounds:
          - "endpoints[POST /feed-sources]"
          - entities.FeedSource.fields.dedupe_window_days
          - entities.FeedSource.fields.trust_tier
          - entities.FeedSource.fields.accrued_share_cents
          - entities.FeedSource.fields.feed_status
        distinguishing_aspect: |
          The two omitted optional inputs must fall back to DEFAULT_DEDUPE_WINDOW_DAYS and TIER_B,
          which are exactly the knobs the duplicate scorer and the intake auto-dismiss branch read,
          so a wrong default silently changes duplicate behaviour rather than failing loudly.
        test_recipe:
          setup:
            - "Clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /feed-sources"
              payload: { name: "Coastal Mover Feed", source_type: "MOVER", referral_revenue_share_pct: 0.1000 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "GET /feed-sources/${fs_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "trigger call 1 returns HTTP 201 with data.dedupe_window_days == 30 and data.trust_tier == TIER_B"
            - "data.accrued_share_cents == 0 and data.feed_status == ACTIVE (system default)"
            - "trigger call 2 returns the same values, so the defaults were persisted and not only echoed"

      - name: computed_fields_service_address_hash_normalizes_case_and_unit
        claim_type: computed_fields
        grounds:
          - "endpoints[POST /service-addresses]"
          - entities.ServiceAddress.fields.address_hash
          - entities.ServiceAddress.fields.usps_deliverable
        distinguishing_aspect: |
          The computed hash is the exact-match key of the duplicate scorer, so its normalization
          rules are asserted directly rather than through a score: case folding collapses two rows,
          a null unit is NOT the same as unit "7B", and postal code participates in the digest.
        test_recipe:
          setup:
            - "Clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { a1_id: $.data.id, a1_hash: $.data.address_hash }
            - call: "POST /service-addresses"
              payload: { line1: "402 peachtree way", unit: "7b", city: "ATLANTA", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { a2_id: $.data.id, a2_hash: $.data.address_hash }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { a3_id: $.data.id, a3_hash: $.data.address_hash }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30303" }
              as: PlatformAdmin
              captures: { a4_id: $.data.id, a4_hash: $.data.address_hash }
          assert:
            - "${a2_hash} == ${a1_hash} (line1 and unit are case-folded before hashing)"
            - "${a3_hash} != ${a1_hash} (a null unit hashes as the empty string, not as 7B)"
            - "${a4_hash} != ${a1_hash} (postal_code is part of the digest)"
            - "all four rows report usps_deliverable == true and distinct ids"

      - name: system_fields_move_timestamps_generated_and_lifecycle_input_ignored
        claim_type: system_fields
        grounds:
          - "endpoints[POST /moves]"
          - entities.MoveRecord.fields.lifecycle_status
          - entities.MoveRecord.fields.readiness_score
          - "validations[priority=6]"
        distinguishing_aspect: |
          The system-sourced lifecycle_status and the computed readiness_score are absent from the
          POST /moves input list, so a client that tries to seed them must be refused by the schema
          check rather than silently starting a move at VERIFIED with a fabricated score.
        test_recipe:
          setup:
            - "Feed source, resident and both addresses exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
          trigger:
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-21", lifecycle_status: "VERIFIED", readiness_score: 99 }
              as: MoveOpsAgent
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 201 with data.lifecycle_status == INTAKE, data.readiness_score == 0, data.version == 1, data.created_at == 2026-08-01T00:00:00Z and data.updated_at == 2026-08-01T00:00:00Z"
            - "trigger call 2 returns HTTP 422 with data.error_id == ERR_INVALID_REQUEST (lifecycle_status and readiness_score are not part of the endpoint input schema)"
            - "no second move exists for ${res_id}: GET /moves with resident_id ${res_id} reports total_count == 1"

      - name: type_constraints_address_and_partner_ranges_rejected
        claim_type: type_constraints
        grounds:
          - entities.ServiceAddress.fields.postal_code
          - entities.ServiceAddress.fields.state_code
          - entities.ReferralPartner.fields.rev_share_pct
          - entities.ReferralPartner.fields.vertical
          - "validations[priority=6]"
        distinguishing_aspect: |
          Four different constraint kinds in one instance — fixed-length digits, upper-case letters,
          a 4-decimal numeric ceiling and enum membership — all of which must fail at priority 6
          before any referential or business rule runs.
        test_recipe:
          setup:
            - "Clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", city: "Atlanta", state_code: "GA", postal_code: "3030" }
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", city: "Atlanta", state_code: "ga", postal_code: "30302" }
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /referral-partners"
              payload: { name: "Skyline Fiber", vertical: "INTERNET", payout_model: "REV_SHARE_PCT", rev_share_pct: 0.9500, attribution_window_days: 14, attribution_basis: "PLACEMENT_ACCEPTANCE", monthly_placement_cap: 5 }
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /referral-partners"
              payload: { name: "Skyline Fiber", vertical: "SOLAR", payout_model: "REV_SHARE_PCT", rev_share_pct: 0.3000, attribution_window_days: 14, attribution_basis: "PLACEMENT_ACCEPTANCE", monthly_placement_cap: 5 }
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
            - call: "POST /referral-partners"
              payload: { name: "Skyline Fiber", vertical: "INTERNET", payout_model: "REV_SHARE_PCT", rev_share_pct: 0.9000, attribution_window_days: 14, attribution_basis: "PLACEMENT_ACCEPTANCE", monthly_placement_cap: 5 }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 422 ERR_INVALID_REQUEST (postal_code must be exactly 5 digits)"
            - "trigger call 2 returns HTTP 422 ERR_INVALID_REQUEST (state_code must be exactly 2 upper-case letters)"
            - "trigger call 3 returns HTTP 422 ERR_INVALID_REQUEST (rev_share_pct 0.9500 exceeds the 0.9000 ceiling)"
            - "trigger call 4 returns HTTP 422 ERR_INVALID_REQUEST (SOLAR is not a member of the vertical enum)"
            - "trigger call 5 returns HTTP 201 with data.rev_share_pct == 0.9000, proving the ceiling itself is inclusive"

      - name: immutability_revenue_share_ledger_entry_has_no_update_path_or_version
        claim_type: immutability
        grounds:
          - entities.RevenueShareLedgerEntry.common_fields
          - entities.RevenueShareLedgerEntry.fields.posted_at
          - "endpoints[GET /revenue-share-ledger-entries]"
          - "endpoints[GET /revenue-share-ledger-entries/{id}]"
        distinguishing_aspect: |
          The only entity in §1.1 declared with common_fields false: its rows carry no version and
          no updated_at, §1.5 exposes no PATCH/PUT/DELETE for them, and a correction is expressed as
          a further append (the ADJUSTMENT pair) rather than an edit of the ACCRUAL row.
        test_recipe:
          setup:
            - "A converted placement so that an ACCRUAL and a FEED_SOURCE_SHARE entry exist, then a settlement that appends two more entries instead of editing the first two."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
