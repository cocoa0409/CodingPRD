            - call: "POST /archival-items"
              payload: { accession_id: "${acc_loan_id}", storage_zone_id: "${zone_id}", item_label: "TAPE-LOANED", unit_count: 7, condition_grade: "GOOD", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
