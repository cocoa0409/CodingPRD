  # --- Brand ---
  - method: POST
    path: "/messaging/accounts/{id}/brands"
    description: "Create a Brand (DRAFT)"
    roles: [BrandManager, PlatformAdmin]
    code: 201
    input: [legal_name, tax_id, business_type, address_line1, city, region_code, postal_code, country_code, website_url, opt_in_mechanism]
    output: Brand
    side_effects: ["status=DRAFT, identity_score=0, resubmission_count=0"]

  - method: GET
    path: "/messaging/accounts/{id}/brands/{id}"
    description: "Get a Brand"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, NumberProvisioner, CarrierReviewer, SystemDriver]
    code: 200
    input: []
    output: Brand
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/brands/{id}/campaigns"
    description: "List campaigns of a brand (FK reverse reachability Campaign.brand_id -> Brand)"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Campaign[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/brands/{id}/consent_records"
    description: "List consent records of a brand (FK reverse reachability ConsentRecord.brand_id -> Brand)"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/brands"
    description: "List Brands for an account"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?", "status?", "account_id?"]
    output: "Brand[]"
    side_effects: []

  - method: POST
    path: "/messaging/accounts/{id}/brands/{id}/submit"
    description: "Submit brand for identity verification (from DRAFT or UNVERIFIED)"
    roles: [BrandManager]
    code: 200
    input: []
    output: Brand
    side_effects:
      - "identity_scoring computed"
      - "Charge BRAND_VETTING recorded (reference_type BRAND, reference_id = brand.id)"
      - "Brand -> PENDING_VERIFICATION"

  - method: POST
    path: "/messaging/accounts/{id}/brands/{id}/verify"
    description: "Carrier verifies brand identity (requires score >= 60)"
    roles: [CarrierReviewer]
    code: 200
    input: []
    output: Brand
    side_effects: ["Brand -> VERIFIED"]

  - method: POST
    path: "/messaging/accounts/{id}/brands/{id}/fail"
    description: "Carrier fails brand verification; lands UNVERIFIED or REVOKED at resubmission cap"
    roles: [CarrierReviewer]
    code: 200
    input: []
    output: Brand
    side_effects:
      - "resubmission_count += 1"
      - "Brand -> UNVERIFIED, or REVOKED when resubmission_count reaches MAX_RESUBMISSIONS (3)"

  - method: POST
    path: "/messaging/accounts/{id}/brands/{id}/revoke"
    description: "Revoke a verified brand; cascades campaign suspensions"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Brand
    side_effects:
      - "Brand -> REVOKED"
      - "Each APPROVED campaign of brand -> SUSPENDED"
      - "cascade_suspend_campaign per affected campaign"

  # --- Campaign ---
  - method: POST
    path: "/messaging/accounts/{id}/campaigns"
    description: "Create a Campaign (DRAFT)"
    roles: [CampaignManager, PlatformAdmin]
    code: 201
    input: [brand_id, use_case, description, sample_messages, help_message, stop_message, path_kind]
    output: Campaign
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/messaging/accounts/{id}/campaigns/{id}"
    description: "Get a Campaign"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, NumberProvisioner, CarrierReviewer, SystemDriver]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/campaigns/{id}/numbers"
    description: "List numbers attached to a campaign (FK reverse reachability SenderNumber.campaign_id -> Campaign)"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, NumberProvisioner, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "SenderNumber[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/campaigns/{id}/messages"
    description: "List messages of a campaign (FK reverse reachability Message.campaign_id -> Campaign)"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Message[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/campaigns/{id}/feedback_events"
    description: "List feedback events of a campaign (FK reverse reachability FeedbackEvent.campaign_id -> Campaign)"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeedbackEvent[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/campaigns"
    description: "List Campaigns; brand_id filter supported"
    roles: [PlatformAdmin, ComplianceOfficer, BrandManager, CampaignManager, NumberProvisioner, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?", "status?", "brand_id?", "account_id?"]
    output: "Campaign[]"
    side_effects: []

  - method: POST
    path: "/messaging/accounts/{id}/campaigns/{id}/submit"
    description: "Submit campaign for carrier review (from DRAFT or REJECTED); OCC-guarded on resubmit"
    roles: [CampaignManager]
    code: 200
    input: ["expected_campaign_version?"]
    output: Campaign
    side_effects:
      - "trust_score initialized; allocated_mps computed"
      - "Charge CAMPAIGN_REGISTRATION recorded"
      - "Campaign -> PENDING_REVIEW"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/messaging/accounts/{id}/campaigns/{id}/approve"
    description: "Carrier approves campaign"
    roles: [CarrierReviewer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["Campaign -> APPROVED"]

  - method: POST
    path: "/messaging/accounts/{id}/campaigns/{id}/reject"
    description: "Carrier rejects campaign with reason code"
    roles: [CarrierReviewer]
    code: 200
    input: [rejection_reason_code]
    output: Campaign
    side_effects: ["Campaign -> REJECTED; rejected_cycle_count += 1"]

  - method: POST
    path: "/messaging/accounts/{id}/campaigns/{id}/suspend"
    description: "Suspend an approved campaign; cascades to attached numbers"
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: Campaign
    side_effects: ["Campaign -> SUSPENDED", "cascade_suspend_campaign"]

  - method: POST
    path: "/messaging/accounts/{id}/campaigns/{id}/reactivate"
    description: "Reactivate a suspended campaign; restores cascade-suspended numbers"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Campaign
    side_effects: ["Campaign -> APPROVED; numbers with suspended_reason CAMPAIGN_SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/messaging/accounts/{id}/campaigns/{id}/deactivate"
    description: "Deactivate a campaign with no ACTIVE numbers attached"
    roles: [CampaignManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["Campaign -> DEACTIVATED"]

  # --- SenderNumber ---
  - method: POST
    path: "/messaging/accounts/{id}/numbers"
    description: "Provision a number (new purchase or port-in). PORT_IN lands in PORTING automatically."
    roles: [NumberProvisioner, PlatformAdmin]
    code: 201
    input: [phone_number, number_type, country_code, "port_phone_number?", "port_letter_of_agency?", "port_losing_carrier?"]
    output: SenderNumber
    side_effects:
      - "provisioning_source = PORT_IN when port_phone_number present, else SHORT_CODE_ORDER when number_type SHORT_CODE, else NEW_PURCHASE"
      - "status = PORTING if PORT_IN else PENDING"

  - method: GET
    path: "/messaging/accounts/{id}/numbers/{id}"
    description: "Get a SenderNumber"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, NumberProvisioner, CarrierReviewer, SystemDriver]
    code: 200
    input: []
    output: SenderNumber
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/numbers/{id}/messages"
    description: "List messages sent from a number (FK reverse reachability Message.sender_number_id -> SenderNumber)"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, NumberProvisioner, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Message[]"
    side_effects: []

  - method: GET
    path: "/messaging/accounts/{id}/numbers"
    description: "List numbers; campaign_id filter supported"
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, NumberProvisioner, CarrierReviewer]
    code: 200
    input: ["limit?", "offset?", "status?", "campaign_id?", "account_id?"]
    output: "SenderNumber[]"
    side_effects: []

  - method: POST
    path: "/messaging/accounts/{id}/numbers/{id}/activate"
    description: "Activate a PENDING (non-port) number"
    roles: [NumberProvisioner]
    code: 200
    input: []
    output: SenderNumber
    side_effects: ["SenderNumber -> ACTIVE"]

  - method: POST
    path: "/messaging/accounts/{id}/numbers/{id}/complete_port"
    description: "Complete a port-in; PORTING -> ACTIVE"
    roles: [NumberProvisioner]
    code: 200
    input: []
    output: SenderNumber
    side_effects: ["SenderNumber -> ACTIVE"]

  - method: POST
    path: "/messaging/accounts/{id}/numbers/{id}/fail_port"
    description: "Fail a port-in; PORTING -> FAILED"
    roles: [NumberProvisioner]
    code: 200
    input: [reason]
    output: SenderNumber
    side_effects: ["SenderNumber -> FAILED"]

  - method: POST
    path: "/messaging/accounts/{id}/numbers/{id}/attach"
    description: "Attach an ACTIVE number to a campaign; OCC-guarded; one ACTIVE number per number_type per campaign"
    roles: [NumberProvisioner]
    code: 200
    input: [campaign_id, expected_campaign_version]
    output: SenderNumber
    side_effects:
      - "SenderNumber.campaign_id set"
      - "increments Campaign.version by 1"

  - method: POST
    path: "/messaging/accounts/{id}/numbers/{id}/detach"
    description: "Detach a number from its campaign"
    roles: [NumberProvisioner]
    code: 200
    input: []
    output: SenderNumber
    side_effects: ["SenderNumber.campaign_id cleared"]

  - method: POST
    path: "/messaging/accounts/{id}/numbers/{id}/reinstate"
    description: "Reinstate a suspended number"
    roles: [NumberProvisioner]
    code: 200
    input: []
    output: SenderNumber
    side_effects: ["SenderNumber -> ACTIVE when campaign APPROVED and account ACTIVE"]

  - method: POST
    path: "/messaging/accounts/{id}/numbers/{id}/release"
    description: "Release a number (from PENDING/FAILED/ACTIVE/SUSPENDED)"
    roles: [NumberProvisioner]
    code: 200
    input: []
    output: SenderNumber
    side_effects: ["SenderNumber -> RELEASED; detached from campaign"]

  # --- ConsentRecord ---
