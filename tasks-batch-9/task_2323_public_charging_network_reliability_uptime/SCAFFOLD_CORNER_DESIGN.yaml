        excluded_because:
          difficulty_instance: commission_state_check_wins_over_interop_constraint
          rationale: "That §1.8 instance violates priority 8 and priority 19 in the same request and asserts the 409 ERR_INVALID_STATE while the interop score sits at 60.00."

      - name: safety_check_outranks_referential_check_on_dispatch_creation
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: dispatch_technician_certification_check_wins_over_outage_port_mismatch
          rationale: "That §1.8 instance violates priority 11 and priority 13 simultaneously and asserts ERR_TECHNICIAN_NOT_CERTIFIED (422)."

