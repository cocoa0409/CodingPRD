    roles: [Trustee]
    code: 200
    input: []
    output: Claim
    side_effects: ["case.allowed_claims_total_cents -= prior allowed_amount_cents", "allowed_amount_cents = 0", "case.version += 1"]

  - method: POST
    path: "/trustee/claims/{id}/withdraw"
    description: "Creditor withdraws own claim (FILED or UNDER_REVIEW -> WITHDRAWN)"
    roles: [Creditor]
    code: 200
    input: []
    output: Claim
    side_effects: []

  # --- ClaimObjection ---
  - method: POST
