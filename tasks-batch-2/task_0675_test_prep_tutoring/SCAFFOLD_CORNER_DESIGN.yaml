              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "occa@x.com", full_name: "OccA" }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /students/register"
              payload: { email: "occb@x.com", full_name: "OccB" }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${a_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${a_id}"
              captures: { enr_a: $.data.id, cohort_v2: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${b_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v2} - 1" }
              as: Student
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: occ_correct_cohort_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-create-stale-cohort]", endpoints, entities.Cohort.fields.version]
        distinguishing_aspect: "Enroll carrying the current Cohort.version succeeds (201) and advances Cohort.version by 1; the cohort version increments on the enrollment write."
        test_recipe:
          setup: ["A SCHEDULED cohort (capacity 5); a registered student."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.5, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "occok@x.com", full_name: "OccOk" }
              as: Anonymous
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id, cohort_v2: $.data.version }
          assert:
            - "Enrollment.${enr_id}.status == PENDING_PAYMENT"
            - "HTTP status == 201"

      - name: retake_extends_materials_window_derived_field
        claim_type: derived_field_reconciliation
        grounds: [state_machines.GuaranteeClaim.UNDER_REVIEW_to_APPROVED, entities.Enrollment.fields.materials_expire_at]
        distinguishing_aspect: "Excluded — the RETAKE branch (which extends materials_expire_at) is exercised by the §1.8 branch instance."
        excluded_because:
          difficulty_instance: non_linear_state_machine / guarantee_claim_branch_refund_vs_retake
          rationale: "RETAKE_GRANTED + materials_expire_at extension is the asserted RETAKE branch outcome of the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cancel_cascade_atomic_in_single_response
        claim_type: immediate
        grounds: [state_machines.Enrollment.ACTIVE_to_CANCELLED, state_machines.InstallmentPlan.OPEN_to_REFUNDED]
        distinguishing_aspect: "Excluded — atomic single-request visibility of the cancel->refund cascade is established by the §1.8 depth-2 cascade instance."
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_active_cascades_plan_refund_depth2
          rationale: "The depth-2 cascade instance already asserts the plan is REFUNDED in the same request that cancels the enrollment, demonstrating immediate consistency."
