scaffold_difficulty_design:

  # =====================================================================================
  # RULE 1 — dual_variant_calc
  # Two instances on DIFFERENT entity domains: the fiscal cost model (FiscalImpactAnalysis /
  # Municipality) and the protest weighting model (ProtestFiling / PublicHearing).
  # =====================================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fiscal_variant_average_vs_marginal_diverge_on_identical_territory
        grounds:
          - calculations.fiscal_impact_projection
          - entities.FiscalImpactAnalysis.fields.base_service_cost_cents
          - entities.FiscalImpactAnalysis.fields.overhead_tier_pct
          - entities.FiscalImpactAnalysis.fields.deficit_ratio_pct
          - entities.StatuteProfile.fields.fiscal_method
          - validations[priority=83]
          - concurrency_rules[analysis-create-stale-case]
        distinguishing_aspect: |
          This instance's dual variant lives in the FiscalImpactAnalysis / Municipality cost domain:
          two statutes differing only in fiscal_method score byte-identical territory (100,000,000
          cents of assessed value, projected_population 100) into base_service_cost_cents 2,000,000
          under average_cost_per_capita versus 2,400,000 under marginal_cost_buildout, so
          net_annual_impact_cents differs by exactly 448,000 cents.
        test_recipe:
          setup:
            - "Two StatuteProfiles identical except fiscal_method (NC = AVERAGE_COST, SC = MARGINAL_COST), each requiring only POLICE service."
            - "Two Municipalities, one per statute, both with citywide_annual_service_cost_cents 800,000,000, citywide_population 40,000, general_fund_millage_rate 10.0, corporate_boundary_perimeter_feet 80,000."
            - "One AnnexationCase per municipality, still DRAFT, each holding the same four parcels: 40,000,000 / 30,000,000 / 20,000,000 / 10,000,000 cents (territory_assessed_value_cents 100,000,000 each)."
            - "No UtilityAccount exists, so projected_utility_revenue_cents is 0 on both sides."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"], fiscal_method: "AVERAGE_COST" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_avg: $.data.id }
            - call: "POST /statute-profiles"
              payload: { state_code: "SC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"], fiscal_method: "MARGINAL_COST" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_marg: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_avg}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_avg: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_marg}", name: "Pine Ridge", state_code: "SC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_marg: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { own1: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_avg}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_avg}"
              captures: { case_avg: $.data.id }
            - call: "POST /annexation-cases/${case_avg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "AVG-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_avg}"
            - call: "POST /annexation-cases/${case_avg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "AVG-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_avg}"
            - call: "POST /annexation-cases/${case_avg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "AVG-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_avg}"
            - call: "POST /annexation-cases/${case_avg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "AVG-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_avg}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_marg}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_marg}"
              captures: { case_marg: $.data.id }
            - call: "POST /annexation-cases/${case_marg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "MRG-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_marg}"
            - call: "POST /annexation-cases/${case_marg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "MRG-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_marg}"
            - call: "POST /annexation-cases/${case_marg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "MRG-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_marg}"
            - call: "POST /annexation-cases/${case_marg}/parcels"
              payload: { primary_owner_id: "${own1}", parcel_apn: "MRG-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_marg}"
            - call: "GET /annexation-cases/${case_avg}"
              payload: {}
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { case_avg_v: $.data.version }
            - call: "GET /annexation-cases/${case_marg}"
              payload: {}
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { case_marg_v: $.data.version }
          trigger:
            - call: "POST /fiscal-impact-analyses"
              payload: { annexation_case_id: "${case_avg}", analysis_method: "AVERAGE_COST", projected_population: 100, expected_case_version: "${case_avg_v}" }
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { an_avg: $.data.id }
            - call: "POST /fiscal-impact-analyses"
              payload: { annexation_case_id: "${case_marg}", analysis_method: "MARGINAL_COST", projected_population: 100, expected_case_version: "${case_marg_v}", marginal_police_cost_cents: 900000, marginal_fire_cost_cents: 800000, marginal_water_cost_cents: 400000, marginal_sewer_cost_cents: 300000 }
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { an_marg: $.data.id }
          assert:
            - "FiscalImpactAnalysis.${an_avg}.property_tax_revenue_cents == 1000000"
            - "FiscalImpactAnalysis.${an_avg}.projected_utility_revenue_cents == 0"
            - "FiscalImpactAnalysis.${an_avg}.shared_revenue_cents == 1200000"
            - "FiscalImpactAnalysis.${an_avg}.gross_annual_revenue_cents == 2200000"
            - "FiscalImpactAnalysis.${an_avg}.base_service_cost_cents == 2000000"
            - "FiscalImpactAnalysis.${an_avg}.overhead_tier_pct == 0.12"
            - "FiscalImpactAnalysis.${an_avg}.administrative_overhead_cents == 240000"
            - "FiscalImpactAnalysis.${an_avg}.projected_annual_service_cost_cents == 2240000"
            - "FiscalImpactAnalysis.${an_avg}.net_annual_impact_cents == -40000"
            - "FiscalImpactAnalysis.${an_avg}.deficit_ratio_pct == 1.82"
            - "FiscalImpactAnalysis.${an_marg}.gross_annual_revenue_cents == 2200000"
            - "FiscalImpactAnalysis.${an_marg}.base_service_cost_cents == 2400000"
            - "FiscalImpactAnalysis.${an_marg}.overhead_tier_pct == 0.12"
            - "FiscalImpactAnalysis.${an_marg}.administrative_overhead_cents == 288000"
            - "FiscalImpactAnalysis.${an_marg}.projected_annual_service_cost_cents == 2688000"
            - "FiscalImpactAnalysis.${an_marg}.net_annual_impact_cents == -488000"
            - "FiscalImpactAnalysis.${an_marg}.deficit_ratio_pct == 22.18"
            - "FiscalImpactAnalysis.${an_avg}.net_annual_impact_cents - FiscalImpactAnalysis.${an_marg}.net_annual_impact_cents == 448000"
            - "AnnexationCase.${case_avg}.territory_assessed_value_cents == AnnexationCase.${case_marg}.territory_assessed_value_cents == 100000000"

      - name: protest_variant_value_vs_owner_count_flips_outcome_on_identical_filings
        grounds:
          - calculations.protest_evaluation
          - entities.StatuteProfile.fields.protest_basis
          - entities.PublicHearing.fields.protest_pct
          - state_machines.PublicHearing.OPEN_to_FAILED
          - state_machines.PublicHearing.OPEN_to_SUSTAINED
          - state_machines.AnnexationCase.HEARING_HELD_to_PROTEST_SUSTAINED
        distinguishing_aspect: |
          This instance's dual variant lives in the ProtestFiling / PublicHearing objection domain
          (not the fiscal cost domain): one identical filing — the owner of the 10,000,000-cent
          parcel, 100% share, out of a 100,000,000-cent four-owner territory — yields
          protest_pct 10.00 and FAILED under assessed_value_basis but 25.00 and SUSTAINED under
          owner_count_basis, flipping AnnexationCase.status to PROTEST_SUSTAINED on one side only.
        test_recipe:
          setup:
            - "Two StatuteProfiles identical except protest_basis (NC = ASSESSED_VALUE, SC = OWNER_COUNT), both with protest_threshold_pct 20.00 and required_service_types [POLICE]."
            - "Two Municipalities (one per statute) each with a POLICE ServiceProvider."
            - "Four PropertyOwners reused across both territories, one per parcel, so territory_owner_count is 4 on each side."
            - "One AnnexationCase per municipality, each certified with four parcels 40,000,000 / 30,000,000 / 20,000,000 / 10,000,000 cents, an ADOPTED plan of services, a noticed hearing HELD at 2026-09-10T18:00:00Z, and one FILED protest from the owner of the 10,000,000-cent parcel at 100% share."
            - "Logical clock advanced to 2026-10-11T09:00:00Z, past both protest_closes_at values of 2026-10-10T18:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"], protest_basis: "ASSESSED_VALUE", protest_threshold_pct: 20.00 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_val: $.data.id }
            - call: "POST /statute-profiles"
              payload: { state_code: "SC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"], protest_basis: "OWNER_COUNT", protest_threshold_pct: 20.00 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_cnt: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_val}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_val: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_cnt}", name: "Pine Ridge", state_code: "SC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_cnt: $.data.id }
            - call: "POST /municipalities/${muni_val}/service-providers"
              payload: { provider_name: "Cedar Grove Police", service_types: ["POLICE"], concurrent_project_capacity: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
              captures: { prov_val: $.data.id }
            - call: "POST /municipalities/${muni_cnt}/service-providers"
              payload: { provider_name: "Pine Ridge Police", service_types: ["POLICE"], concurrent_project_capacity: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
              captures: { prov_cnt: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow1: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ben Ortiz", contact_email: "ben@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow2: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Cara Diaz", contact_email: "cara@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow3: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Dan Evans", contact_email: "dan@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow4: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_val}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
              captures: { case_val: $.data.id }
            - call: "POST /annexation-cases/${case_val}/parcels"
              payload: { primary_owner_id: "${ow1}", parcel_apn: "VAL-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
            - call: "POST /annexation-cases/${case_val}/parcels"
              payload: { primary_owner_id: "${ow2}", parcel_apn: "VAL-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
            - call: "POST /annexation-cases/${case_val}/parcels"
              payload: { primary_owner_id: "${ow3}", parcel_apn: "VAL-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
            - call: "POST /annexation-cases/${case_val}/parcels"
              payload: { primary_owner_id: "${ow4}", parcel_apn: "VAL-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
              captures: { parcel_val4: $.data.id }
            - call: "POST /annexation-cases/${case_val}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_cnt}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
              captures: { case_cnt: $.data.id }
            - call: "POST /annexation-cases/${case_cnt}/parcels"
              payload: { primary_owner_id: "${ow1}", parcel_apn: "CNT-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
            - call: "POST /annexation-cases/${case_cnt}/parcels"
              payload: { primary_owner_id: "${ow2}", parcel_apn: "CNT-2", assessed_value_cents: 30000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
            - call: "POST /annexation-cases/${case_cnt}/parcels"
              payload: { primary_owner_id: "${ow3}", parcel_apn: "CNT-3", assessed_value_cents: 20000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
            - call: "POST /annexation-cases/${case_cnt}/parcels"
              payload: { primary_owner_id: "${ow4}", parcel_apn: "CNT-4", assessed_value_cents: 10000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
              captures: { parcel_cnt4: $.data.id }
            - call: "POST /annexation-cases/${case_cnt}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_val}" }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
              captures: { plan_val: $.data.id, plan_val_v: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_val}", service_provider_id: "${prov_val}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 500000, committed_account_count: 0, expected_plan_of_services_version: "${plan_val_v}" }
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
              captures: { cm_val: $.data.id }
            - call: "POST /service-commitments/${cm_val}/activate"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_val}"
            - call: "POST /plans-of-services/${plan_val}/adopt"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_val}"
            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_cnt}" }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
              captures: { plan_cnt: $.data.id, plan_cnt_v: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_cnt}", service_provider_id: "${prov_cnt}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 500000, committed_account_count: 0, expected_plan_of_services_version: "${plan_cnt_v}" }
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
              captures: { cm_cnt: $.data.id }
            - call: "POST /service-commitments/${cm_cnt}/activate"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_cnt}"
            - call: "POST /plans-of-services/${plan_cnt}/adopt"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_cnt}"
            - call: "POST /public-hearings"
              payload: { annexation_case_id: "${case_val}", municipality_id: "${muni_val}", scheduled_start_at: "2026-09-10T18:00:00Z", scheduled_end_at: "2026-09-10T20:00:00Z", protest_window_days: 30 }
              as: CityClerk
              as_user_id: "${muni_val}"
              captures: { hear_val: $.data.id }
            - call: "POST /public-hearings"
              payload: { annexation_case_id: "${case_cnt}", municipality_id: "${muni_cnt}", scheduled_start_at: "2026-09-10T18:00:00Z", scheduled_end_at: "2026-09-10T20:00:00Z", protest_window_days: 30 }
              as: CityClerk
              as_user_id: "${muni_cnt}"
              captures: { hear_cnt: $.data.id }
            - call: "POST /public-hearings/${hear_val}/notice-publications"
              payload: { publication_type: "NEWSPAPER" }
              as: CityClerk
              as_user_id: "${muni_val}"
            - call: "POST /public-hearings/${hear_cnt}/notice-publications"
              payload: { publication_type: "NEWSPAPER" }
              as: CityClerk
              as_user_id: "${muni_cnt}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T18:00:00Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "POST /public-hearings/${hear_val}/hold"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_val}"
            - call: "POST /public-hearings/${hear_cnt}/hold"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_cnt}"
            - call: "POST /protest-filings"
              payload: { public_hearing_id: "${hear_val}", parcel_id: "${parcel_val4}", property_owner_id: "${ow4}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow4}"
            - call: "POST /protest-filings"
              payload: { public_hearing_id: "${hear_cnt}", parcel_id: "${parcel_cnt4}", property_owner_id: "${ow4}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow4}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T09:00:00Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
          trigger:
            - call: "POST /public-hearings/${hear_val}/close-protest-period"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_val}"
            - call: "POST /public-hearings/${hear_cnt}/close-protest-period"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_cnt}"
          assert:
            - "PublicHearing.${hear_val}.protest_pct == 10.00"
            - "PublicHearing.${hear_val}.protest_outcome == FAILED"
            - "AnnexationCase.${case_val}.protest_pct == 10.00"
            - "AnnexationCase.${case_val}.protest_outcome == FAILED"
            - "AnnexationCase.${case_val}.status == HEARING_HELD"
            - "PublicHearing.${hear_cnt}.protest_pct == 25.00"
            - "PublicHearing.${hear_cnt}.protest_outcome == SUSTAINED"
            - "AnnexationCase.${case_cnt}.protest_pct == 25.00"
            - "AnnexationCase.${case_cnt}.protest_outcome == SUSTAINED"
            - "AnnexationCase.${case_cnt}.status == PROTEST_SUSTAINED"
            - "PublicHearing.${hear_cnt}.protest_pct - PublicHearing.${hear_val}.protest_pct == 15.00"

  # =====================================================================================
  # RULE 2 — combinatorial_formula
  # Mode (a) conditional branching + step penalty inside territory_qualification;
  # mode (b) pinned per-parcel-then-sum rounding order inside tax_roll_proration;
  # mode (c) tier selection keyed on the PRE-overhead base cost inside fiscal_impact_projection.
  # =====================================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: qualification_index_combines_capped_ramp_bonus_and_step_penalty
        grounds:
          - calculations.territory_qualification
          - entities.AnnexationCase.fields.qualification_index
          - entities.AnnexationCase.fields.contiguity_ratio
          - entities.AnnexationCase.fields.urban_development_qualified
          - state_machines.AnnexationCase.DRAFT_to_TERRITORY_CERTIFIED
          - validations[priority=54]
        distinguishing_aspect: |
          Mode (a) — conditional branching: the same certify call runs a capped contiguity ramp
          (0.1250 / (2 * 0.125) = 0.5 → base 50.00), a conditional +25.00 urban bonus taken on the
          subdivision limb while the density limb fails (0.1500 units/acre < 2.00), a suppressed
          -15.00 density penalty, and a ceil() step penalty of -10.00 for 3.5 service miles,
          composing to qualification_index 65.00 — no single branch produces that number.
        test_recipe:
          setup:
            - "One StatuteProfile with default thresholds: contiguity_min_ratio 0.125, urban_density_min_units_per_acre 2.00, subdivision_test_min_developed_ratio 0.60, min_qualification_index 60.00."
