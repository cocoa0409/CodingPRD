              as: Scheduler
              captures: { ev_a: $.data.id, ev_a_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_a}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_a_v}" }
              as: Scheduler
              captures: { asg_a: $.data.id, booked_a: $.data.booked_minutes }
            - call: "POST /caption-ad/live-assignments/${asg_a}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "B", channel_id: "CH2", start_at: "2026-08-10T14:00:00Z", end_at: "2026-08-10T14:20:00Z", required_certification: "CERT_CBC", prep_minutes: 0, wrap_minutes: 0 }
              as: Scheduler
              captures: { ev_b: $.data.id, ev_b_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_b}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_b_v}" }
              as: Scheduler
              captures: { asg_b: $.data.id, booked_b: $.data.booked_minutes }
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "C", channel_id: "CH3", start_at: "2026-08-10T15:00:00Z", end_at: "2026-08-10T15:01:00Z", required_certification: "CERT_CBC", prep_minutes: 0, wrap_minutes: 0 }
              as: Scheduler
              captures: { ev_c: $.data.id, ev_c_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_c}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_c_v}" }
              as: Scheduler
              captures: { asg_c: $.data.id }
          trigger:
            - call: "POST /caption-ad/live-assignments/${asg_b}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/live-assignments/${asg_c}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
              captures: { err: $.data.error_id }
          assert:
            - "LiveAssignment.${asg_a}.booked_minutes == 280 and LiveAssignment.${asg_b}.booked_minutes == 20"
            - "Accept of B succeeds: committed == 300 exactly equals max_daily_live_minutes (inclusive <=)"
            - "Accept of C fails ERR_CAPACITY_EXCEEDED (422): 301 > 300 — one minute over the cap"
            - "LiveAssignment.${asg_b}.assignment_status == ACCEPTED; ${asg_c} remains OFFERED"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_media_cleared
        grounds:
          - state_machines.WorkOrder.QUOTED_to_CONFIRMED
          - validations[priority=11]
        distinguishing_aspect: |
          Pair WorkOrder x MediaAsset: the confirm transition's legality depends on
          the linked MediaAsset being CLEARED — an asset left INSPECTING blocks
          confirm with ERR_MEDIA_NOT_CLEARED even though the work order itself is
          correctly QUOTED.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "FCC client; asset in INSPECTING; work order QUOTED"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "FCC Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
          assert:
            - "First confirm fails ERR_MEDIA_NOT_CLEARED (409); WorkOrder remains QUOTED"
            - "After the asset transitions INSPECTING -> CLEARED, the identical confirm succeeds and due_at == '2026-08-24T10:00:00Z' (STANDARD 60 min, 120 business hours)"

