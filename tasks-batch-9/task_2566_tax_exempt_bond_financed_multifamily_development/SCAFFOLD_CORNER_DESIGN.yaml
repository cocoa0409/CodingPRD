          assert:
            - "captured status_1 == 'OVERSUBSCRIBED' with captured available_1 == -200000000 and captured awardable_1 == 600000000: three pending requests totalling 800000000 oversubscribe the pool without exhausting it"
            - "the first award returns HTTP 200 with status AWARDED; captured status_2 == 'OVERSUBSCRIBED' and captured awardable_2 == 200000000 (600000000 total less 400000000 committed)"
            - "no deferral fired on the first award: GET /volume-cap-allocations/${alloc_c} still shows status PENDING and GET /projects/${proj_c} shows financing_stalled false, because awardable_cents was still positive"
            - "captured err_over_cap == 'ERR_INSUFFICIENT_VOLUME_CAP' with HTTP 422 - 300000000 exceeds the 200000000 ceiling; the allocation stays PENDING and CapPool.version is unchanged, which is why the same token is reused on the next call"
            - "the 200000000 award returns HTTP 200: equality with awardable_cents is admissible and drives the pool to zero"
            - "captured status_3 == 'EXHAUSTED', captured awardable_3 == 0, captured committed_3 == 600000000, captured reserved_3 == 0 and captured available_3 == 0; EXHAUSTED is derived even though available_cents is not negative"
            - "the zero-crossing cascaded: GET /volume-cap-allocations/${alloc_c} shows status DEFERRED and GET /projects/${proj_c} shows volume_cap_deferral_count 1 and financing_stalled true"
            - "captured err_deferred_state == 'ERR_ALLOCATION_STATE_INVALID' with HTTP 409, not ERR_INSUFFICIENT_VOLUME_CAP: priority 81 outranks priority 110 once the deferral has moved the allocation out of PENDING"
            - "the return succeeds: GET /volume-cap-allocations/${alloc_a} shows status RETURNED with awarded_amount_cents null and expiry_date null"
            - "captured status_4 == 'OPEN', captured committed_4 == 200000000, captured awardable_4 == 400000000 and captured reserved_4 == 100000000 - the deferred request is back in PENDING and counting as reserved again, and GET /projects/${proj_c} shows financing_stalled false with volume_cap_deferral_count still 1"
            - "captured alloc_c_status == 'AWARDED' - the request that was refused twice, once on cap and once on state, is awardable after the reset"
            - "captured status_5 == 'OPEN', captured committed_5 == 300000000, captured reserved_5 == 0, captured awardable_5 == 300000000 and captured available_5 == 300000000; the conservation identity 600000000 == available + reserved + committed holds at every one of the five observations"

      - name: sponsor_project_count_and_pool_aggregates_reconcile_after_creates_and_after_the_source_project_is_withdrawn
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers[derived_field_reconciliation]
          - entities.Developer.fields.active_project_count
          - entities.CapPool.fields.committed_cents
          - endpoints[POST /projects].side_effects
          - state_machines[Project].transitions[FINANCED->WITHDRAWN]
          - state_machines[VolumeCapAllocation].transitions[COMMITTED->RELEASED]
        distinguishing_aspect: |
          active_project_count is defined by exclusion - every project of the sponsor
          whose development_status is not WITHDRAWN - so it is maintained on the
          create path but decremented only by a status change two entities away: a
          redemption on the bond issue withdraws the project, which is what the
          counter must notice. That is the derived-field equivalent of deleting the
          source row, and it lands on the sponsor row while the same redemption
          releases committed cap on the pool, so both denormalized counters must
          reconcile from a single trigger. A count materialized at creation and never
          revisited passes the first two checks and fails the third.
        test_recipe:
          setup:
            - "One sponsor with three projects; only the first is financed - four units, a RECORDED regulatory agreement, an AWARDED-then-COMMITTED 200000000 allocation and an ISSUED bond."
            - "The other two projects are freshly created and sit in PLANNING."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_40_60", compliance_period_years: 15, extended_use_years: 30, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /regulatory-agreements/${ra_id}/record"
              payload: { instrument_number: "KC-2026-0001" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 200000000, requested_closing_date: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_id: $.data.id }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_v: $.data.version }
            - call: "POST /volume-cap-allocations/${alloc_id}/decision"
              payload: { decision: "AWARD", awarded_amount_cents: 200000000, expiry_date: "2027-06-30T00:00:00Z", expected_cap_pool_version: "${pool_v}" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "POST /bond-issues"
              payload: { project_id: "${proj_id}", volume_cap_allocation_id: "${alloc_id}", eligible_cost_cents: 190000000, capitalized_interest_cents: 6000000, bond_yield_bps: 450, investment_yield_bps: 200 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { bond_id: $.data.id }
            - call: "POST /bond-issues/${bond_id}/issue"
              payload: { closing_date: "2026-09-15T00:00:00Z" }
              as: BondTrustee
              as_user_id: "trustee-1"
          trigger:
            - call: "GET /developers/${dev_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { count_1: $.data.active_project_count, dev_v1: $.data.version }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Bayside Two", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 30000000, depreciable_basis_cents: 280000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_b: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Cedar Court", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 20000000, depreciable_basis_cents: 150000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_c: $.data.id }
            - call: "GET /developers/${dev_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { count_2: $.data.active_project_count, dev_v2: $.data.version }
            - call: "POST /bond-issues/${bond_id}/mandatory-redeem"
              payload: { redemption_date: "2026-10-01T00:00:00Z", reason: "construction contract terminated" }
              as: BondTrustee
              as_user_id: "trustee-1"
            - call: "GET /developers/${dev_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { count_3: $.data.active_project_count, dev_v3: $.data.version }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { committed_after: $.data.committed_cents, awardable_after: $.data.awardable_cents, status_after: $.data.pool_status }
          assert:
            - "captured count_1 == 1 - the counter was maintained on the create path and the financed project is not withdrawn"
            - "captured count_2 == 3 after the two creates, and captured dev_v2 > captured dev_v1 because each project creation increments Developer.version as well as the count"
            - "the redemption returns HTTP 200: GET /bond-issues/${bond_id} shows status MANDATORY_REDEEMED and GET /projects/${proj_id} shows development_status WITHDRAWN with automatic_credit_triggered false and provisional_fifty_percent_ratio_bps null"
            - "captured count_3 == 2 - the withdrawn project drops out of a count no write ever touched directly, and captured dev_v3 > captured dev_v2"
            - "the other two projects are untouched: GET /projects/${proj_b} and GET /projects/${proj_c} both show development_status PLANNING"
            - "captured committed_after == 0, captured awardable_after == 600000000 and captured status_after == 'OPEN'; GET /volume-cap-allocations/${alloc_id} shows status RELEASED, so the same redemption reconciled the pool aggregates and the sponsor counter together"
            - "GET /projects?developer_id=${dev_id} returns total_count 3 while active_project_count is 2 - the list is not filtered by the exclusion that defines the counter"

      - name: three_level_cascade_from_a_noncompliance_finding_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[ComplianceReport].transitions[SUBMITTED->NONCOMPLIANCE_FOUND]
          - state_machines[CreditAllocation].transitions[ISSUED->RECAPTURE_PENDING]
          - state_machines[InvestorDelivery].transitions[ACCEPTED->RECAPTURE_FLAGGED]
          - calculations[recapture_exposure]
        excluded_because:
          difficulty_instance: noncompliance_finding_cascades_project_then_credit_allocation_then_accepted_delivery
          rationale: |
            The §1.8 instance already walks the full three-level chain from the
            agency finding through the project's compliance axis to the credit
            allocation and on to every ACCEPTED delivery, checks the ordering
            sensitivity of the recapture arithmetic against the triggering report
            only, and confirms that a RESCINDED delivery is skipped by the cascade.
            A second instance here would restate the same call sequence.

      - name: both_fifty_percent_variants_produce_their_expected_ratios_and_the_switch_delta_lands_on_the_credit_flag
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[fifty_percent_aggregate_basis_test]
          - entities.Project.fields.provisional_fifty_percent_ratio_bps
          - entities.Project.fields.final_fifty_percent_ratio_bps
          - entities.Project.fields.automatic_credit_triggered
        excluded_because:
          difficulty_instance: fifty_percent_test_provisional_passes_then_final_variant_revokes_the_credit
          rationale: |
            The §1.8 instance computes both variants over the same project - the
            provisional ratio from the sized par against the pre-certification
            aggregate basis at issuance, then the final ratio from actually funded
            draws against the certified basis - shows the two diverging on identical
            underlying data, and reconciles the switch by flipping
            automatic_credit_triggered. Selection, divergence and reconciliation are
            all covered there.

  - section: consistency_model
    instances:
      - name: every_derived_field_and_cascade_is_visible_in_the_same_request_cycle_with_no_re_read_delay
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations[cap_pool_availability]
          - calculations[applicable_fraction]
          - state_machines[VolumeCapAllocation].transitions[PENDING->DEFERRED]
          - entities.CapPool.fields.pool_status
          - entities.Project.fields.applicable_fraction_bps
          - response_envelope
        distinguishing_aspect: |
          The declared consistency model is immediate, which is a claim about the
          response body and not just about eventual convergence: the write's own
          response must already carry the recomputed denormalized fields, and a read
          issued straight afterwards must return byte-identical values with no
          settling step. Two shapes are probed - a same-entity recompute, where a
          unit re-designation must show up in the project's fractions instantly, and
          a cross-entity cascade, where an award that exhausts the pool must have
          already deferred a sibling allocation and stalled that sibling's project by
          the time the award response is returned. An implementation that queues
          either recompute would still converge, and would still fail here.
        test_recipe:
          setup:
            - "One sponsor with two projects on a single 2026 pool of 600000000 total cap."
            - "Annex carries four PROPOSED units - 101 and 102 RESTRICTED, 201 and 202 MARKET - and a PENDING request for the entire 600000000; Bayside carries a PENDING request for 100000000."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_a: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Bayside Two", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 30000000, depreciable_basis_cents: 280000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_b: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { unit_201: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_a}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_a}", cap_pool_id: "${pool_id}", requested_amount_cents: 600000000, requested_closing_date: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_a: $.data.id }
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_b}", cap_pool_id: "${pool_id}", requested_amount_cents: 100000000, requested_closing_date: "2026-09-20T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_b: $.data.id }
          trigger:
            - call: "PATCH /unit-restrictions/${unit_201}"
              payload: { designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { patched_designation: $.data.designation }
            - call: "GET /projects/${proj_a}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { restricted_now: $.data.restricted_unit_count, fraction_now: $.data.applicable_fraction_bps, ratio_now: $.data.set_aside_ratio_bps }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_v: $.data.version }
            - call: "POST /volume-cap-allocations/${alloc_a}/decision"
              payload: { decision: "AWARD", awarded_amount_cents: 600000000, expiry_date: "2027-06-30T00:00:00Z", expected_cap_pool_version: "${pool_v}" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { award_status: $.data.status, award_amount: $.data.awarded_amount_cents }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_status_now: $.data.pool_status, committed_now: $.data.committed_cents, reserved_now: $.data.reserved_cents, awardable_now: $.data.awardable_cents }
            - call: "GET /volume-cap-allocations/${alloc_b}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sibling_status: $.data.status }
            - call: "GET /projects/${proj_b}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sibling_stalled: $.data.financing_stalled, sibling_deferrals: $.data.volume_cap_deferral_count }
          assert:
            - "the PATCH returns HTTP 200 with captured patched_designation == 'RESTRICTED' and restricted_rent_cents 96000 already present on the unit in that same response (one bedroom, household 2, floor(floor(7200000*60/100*30/100)/12) = 108000 less the 12000 allowance)"
            - "captured restricted_now == 3, captured fraction_now == 7500 and captured ratio_now == 7500 on the very next read - three of four units and 2550 of 3400 sqft, both 7500, with no intermediate stale value observable"
            - "the award response itself carries captured award_status == 'AWARDED' and captured award_amount == 600000000 rather than a pending acknowledgement"
            - "captured pool_status_now == 'EXHAUSTED', captured committed_now == 600000000, captured reserved_now == 0 and captured awardable_now == 0 immediately after the award returns"
            - "captured sibling_status == 'DEFERRED' - the cross-entity cascade had already run when the award response was produced, not on a later sweep"
            - "captured sibling_stalled == true and captured sibling_deferrals == 1, so the second-order side effect on the sibling's project is visible in the same request cycle as well"
            - "no read is repeated to obtain a settled value anywhere in this recipe: each assertion holds on the first observation after its write"
