        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails priority 1 with ERR_UNAUTHENTICATED 401, before any role or existence check."
        test_recipe:
          setup: ["empty DB is fine"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/offers/11111111-2222-3333-4444-555555555555"
              as: Recruiter
              captures: { err: $.data.error_id }
          assert:
            - "request sent WITHOUT X-User-Role and X-User-ID headers -> error_id == ERR_UNAUTHENTICATED, http 401 (not 404 — auth precedes existence)"

