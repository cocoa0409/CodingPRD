    roles: [FosterCoordinator]
    code: 201
    input:
      - "foster_home_id"
      - "animal_id"
    output: FosterPlacement
    side_effects: ["increment FosterHome.active_placement_count", "Animal FOSTERED"]
  - method: GET
    path: "/foster-placements/{id}"
    description: "Read a foster placement"
    roles: [ShelterAdmin, FosterCoordinator]
    code: 200
    input: []
    output: FosterPlacement
    side_effects: []
  - method: GET
    path: "/foster-placements"
    description: "List foster placements, filterable by home or animal"
    roles: [ShelterAdmin, FosterCoordinator]
    code: 200
    input:
      - "foster_home_id?"
      - "animal_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: FosterPlacement[]
    side_effects: []
  - method: POST
    path: "/foster-placements/{id}/return"
    description: "Return a fostered animal; cyclic — animal goes back to AVAILABLE"
    roles: [FosterCoordinator]
    code: 200
    input: []
    output: FosterPlacement
    side_effects: ["set end_at", "decrement FosterHome.active_placement_count", "Animal AVAILABLE"]

  # ---- EuthanasiaDecision ----
  - method: POST
    path: "/euthanasia-decisions"
    description: "Open a euthanasia review; records requested_by_user_id"
    roles: [AdoptionCounselor, ShelterAdmin]
    code: 201
    input:
      - "animal_id"
      - "reason"
    output: EuthanasiaDecision
    side_effects: ["set requested_by_user_id"]
  - method: GET
    path: "/euthanasia-decisions/{id}"
    description: "Read a euthanasia decision"
    roles: [ShelterAdmin, AdoptionCounselor, Veterinarian]
    code: 200
    input: []
    output: EuthanasiaDecision
    side_effects: []
  - method: GET
    path: "/euthanasia-decisions"
    description: "List euthanasia decisions, filterable by animal"
    roles: [ShelterAdmin, AdoptionCounselor, Veterinarian]
    code: 200
    input:
      - "animal_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: EuthanasiaDecision[]
    side_effects: []
  - method: POST
    path: "/euthanasia-decisions/{id}/approve"
    description: "Veterinarian approves; segregation-of-duties enforced against requested_by_user_id"
    roles: [Veterinarian]
    code: 200
    input: []
    output: EuthanasiaDecision
    side_effects: ["set approved_by_user_id, status APPROVED"]
  - method: POST
    path: "/euthanasia-decisions/{id}/reject"
    description: "Veterinarian rejects the decision"
    roles: [Veterinarian]
    code: 200
    input: []
    output: EuthanasiaDecision
    side_effects: ["status REJECTED"]
  - method: POST
    path: "/euthanasia-decisions/{id}/execute"
    description: "Execute an approved decision; cascades Animal IN_CUSTODY -> EUTHANIZED and releases the kennel"
    roles: [Veterinarian]
    code: 200
    input: []
    output: EuthanasiaDecision
    side_effects: ["Animal EUTHANIZED", "release ACTIVE KennelAssignment", "decrement Kennel.occupied_count"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's logical UTC clock (test-driving; controls intake_at, release gates, cooldown math)"
    roles: [ShelterAdmin]
    code: 200
    input:
      - "to_iso8601"
    output: "{ now: datetime }"
    side_effects: ["all subsequent system timestamps and now>=release_at gates read this clock"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "caller's role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body FK does not resolve to an existing resource"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, or enum value not a declared member"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which the requested transition is defined"
  - id: ERR_CHIP_MISMATCH
    http: 409
    condition: "owner-claim approval where proof_chip_number does not match any Microchip on the animal"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "euthanasia approver X-User-ID equals the decision's requested_by_user_id"
  - id: ERR_STRAY_HOLD_ACTIVE
    http: 409
    condition: "make-available or euthanasia execute attempted before clock now >= Animal.stray_hold_release_at"
  - id: ERR_NOT_MEDICALLY_CLEARED
    http: 409
    condition: "make-available or adoption approve attempted while Animal.medical_status != CLEARED"
  - id: ERR_KENNEL_OCCUPIED
    http: 409
    condition: "kennel is not OPEN or an ACTIVE assignment overlaps the requested interval on it"
  - id: ERR_FOSTER_HOME_FULL
    http: 409
    condition: "foster home active_placement_count == max_concurrent at placement time"
  - id: ERR_FOSTER_COOLDOWN
    http: 409
    condition: "new placement start_at falls within cooldown_days of the most recent RETURNED placement's end_at"
  - id: ERR_APPLICATION_CONFLICT
    http: 409
    condition: "approving an application while another for the same animal is already APPROVED or FINALIZED"
  - id: ERR_DUPLICATE_CHIP
    http: 409
    condition: "chip_number already registered on another Microchip"
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "adopter email already registered on another AdopterAccount"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_kennel_version does not equal the kennel's current version"
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "pagination limit/offset out of [1,100] / [0,..] range"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ShelterAdmin
    description: "Shelter operator with configuration, ledger, claims, and refund authority"
    identity: "opaque"
    exclusive_operations:
      - "POST /shelters, PATCH /shelters/{id}"
      - "POST /kennels"
      - "POST /owner-claims/{id}/approve, POST /owner-claims/{id}/deny"
      - "POST /adoption-applications/{id}/refund"
      - "POST /_clock/set"
    shared_operations:
      - "POST /animals (with IntakeOfficer)"
      - "POST /microchips (with Veterinarian)"
      - "POST /owner-claims (with IntakeOfficer)"
      - "POST /euthanasia-decisions (with AdoptionCounselor)"
      - "POST /foster-homes (with FosterCoordinator)"
      - "GET reads across the system"
  - name: IntakeOfficer
    description: "Handles intake and kennel assignment"
    identity: "opaque"
    exclusive_operations:
      - "POST /intake-records"
      - "POST /kennel-assignments"
    shared_operations:
      - "POST /animals (with ShelterAdmin)"
      - "POST /owner-claims (with ShelterAdmin)"
      - "POST /kennel-assignments/{id}/release (with ShelterAdmin)"
      - "GET reads across custody/kennel/medical/microchip"
  - name: Veterinarian
    description: "Medical authority; records exams/spay-neuter and approves/executes euthanasia"
    identity: "opaque"
    exclusive_operations:
      - "POST /medical-records"
      - "POST /euthanasia-decisions/{id}/approve, /reject, /execute"
    shared_operations:
      - "POST /microchips (with ShelterAdmin)"
      - "GET reads across animals/medical/microchip/euthanasia"
  - name: AdoptionCounselor
    description: "Manages adoption applications and animal availability"
    identity: "opaque"
    exclusive_operations:
      - "POST /animals/{id}/make-available"
      - "POST /adoption-applications/{id}/approve, /reject, /finalize"
    shared_operations:
      - "POST /adoption-applications (with Adopter)"
      - "POST /adopter-accounts (with ShelterAdmin, Adopter)"
      - "POST /euthanasia-decisions (with ShelterAdmin)"
      - "GET reads across applications/animals/medical"
  - name: FosterCoordinator
    description: "Manages foster homes and placements"
    identity: "opaque"
    exclusive_operations:
      - "POST /foster-placements, POST /foster-placements/{id}/return"
    shared_operations:
      - "POST /foster-homes (with ShelterAdmin)"
      - "GET reads across foster homes/placements/animals"
  - name: Adopter
    description: "Public applicant acting on their own account and applications"
    identity: "entity_backed:AdopterAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /adopter-accounts (self-registration)"
      - "POST /adoption-applications (with AdoptionCounselor)"
      - "GET /animals, GET /adoption-applications (own), GET /adopter-accounts/{id} (own)"
