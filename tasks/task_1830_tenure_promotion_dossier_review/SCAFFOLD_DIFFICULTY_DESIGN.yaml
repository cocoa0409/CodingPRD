            - { call: "POST /api/rounds/${round_b}/certify", payload: { recommendation: "SUPPORT", letter_text: "Dept supports." }, as: CommitteeChair, as_user_id: "${chair_b}" }
          assert:
            - "ReviewRound.${round_a}.status == COMPLETED AND ReviewRound.${round_a}.passed == true AND ReviewRound.${round_a}.yes_percentage == 0.75"
            - "ReviewRound.${round_b}.status == COMPLETED AND ReviewRound.${round_b}.passed == false AND ReviewRound.${round_b}.yes_percentage == 0.75"
            - "Identical ballots diverge only via committee.pass_rule (STRICT 3/4 > 0.5 passes; SUPERMAJORITY 3/7 = 0.4286 < 0.6667 fails)"

      - name: clock_policy_anniversary_vs_day_count_diverge
        grounds:
          - calculations.mandatory_review_date
          - entities.TenureCase.fields.clock_policy
          - entities.TenureCase.fields.mandatory_review_date
        distinguishing_aspect: |
          Mandatory-review-date dual variants on the TenureCase/Candidate clock
          domain: identical tenure_clock_start 2020-08-01 with zero extensions
          yields mandatory_review_date 2026-08-01 under ANNIVERSARY (72 calendar
          months, month-anchored) but 2026-08-02 under DAY_COUNT
          (round_half_up(72 * 30.4375) = 2192 days) — the two variants disagree by
          exactly one day because the span includes the 2024 leap day.
        test_recipe:
          setup:
            - "Two candidates, same tenure_clock_start 2020-08-01, no clock extensions"
            - "Case X clock_policy ANNIVERSARY; case Y clock_policy DAY_COUNT"
          setup_api_calls:
            - { call: "POST /api/candidates", payload: { full_name: "Cand X", employee_id: "E300", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_x: $.data.id } }
            - { call: "POST /api/candidates", payload: { full_name: "Cand Y", employee_id: "E301", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_y: $.data.id } }
          trigger:
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_x}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_x_date: $.data.mandatory_review_date } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_y}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "DAY_COUNT" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_y_date: $.data.mandatory_review_date } }
          assert:
            - "TenureCase(X).mandatory_review_date == 2026-08-01 (ANNIVERSARY)"
            - "TenureCase(Y).mandatory_review_date == 2026-08-02 (DAY_COUNT: 2020-08-01 + 2192 days)"
            - "case_x_date != case_y_date although all other inputs are identical"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: dossier_strength_per_category_rounding_order
        grounds:
          - calculations.dossier_strength_index
          - entities.TenureCase.fields.dossier_strength_index
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds each category ratio
          to 3 dp BEFORE weighting (round-per-category then sum). Counts T3/R5/S1
          give ratios 1.5 / 1.6667(->1.667) / 1.0, contributions
          0.45 / 0.8335 / 0.20, index 1.4835; the forbidden sum-then-round order
          would yield 1.4833 — the two orders disagree in the 4th decimal.
        test_recipe:
          setup:
            - "Case in DOSSIER_ASSEMBLY with 3 TEACHING, 5 RESEARCH (exactly one is_peer_reviewed), 1 SERVICE items, all SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand S", employee_id: "E400", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_s: $.data.id } }
