        as: ThirdPartyAssessor
        as_user_id: 3pao-1
      - call: POST /poam-items/${poam_mod_id}/remediation
        payload:
          action: AUDIT
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
        captures: *id002
      assert:
      - 'START as ThirdPartyAssessor: HTTP 403 with error_id ERR_ACTION_ROLE_MISMATCH; remediation_status stays ''OPEN'''
      - 'START as CspComplianceLead: HTTP 200; remediation_status == ''IN_REMEDIATION'''
      - 'SUBMIT_EVIDENCE as ThirdPartyAssessor: HTTP 403 with error_id ERR_ACTION_ROLE_MISMATCH'
      - 'SUBMIT_EVIDENCE as CspComplianceLead: HTTP 200; remediation_status == ''AWAITING_VERIFICATION'''
      - 'VERIFY_CLOSE and REOPEN as CspComplianceLead: both HTTP 403 with error_id ERR_ACTION_ROLE_MISMATCH; remediation_status
        stays ''AWAITING_VERIFICATION'' and reopen_count stays 0'
      - 'VERIFY_CLOSE as ThirdPartyAssessor: HTTP 200; remediation_status == ''CLOSED'' and closure_reason == ''REMEDIATED'''
      - 'an unknown action value: HTTP 400 with error_id ERR_INVALID_REQUEST — priority 5 outranks the priority 3 action-role
        check'
      - PoamItem.${poam_mod_id}.risk_disposition == 'NONE' throughout — the role gate never touches the other dimension
- section: errors
  instances:
  - name: each_entity_reports_its_own_code_when_the_path_id_is_unknown
    claim_type: error_triggerable
    grounds:
    - validations[priority=6]
    - validations[priority=7]
    - errors[ERR_DATA_CATEGORY_NOT_FOUND]
    - errors[ERR_CONTROL_IMPLEMENTATION_NOT_FOUND]
    - errors[ERR_ENGAGEMENT_NOT_FOUND]
    - errors[ERR_PACKAGE_NOT_FOUND]
    - errors[ERR_DEVIATION_NOT_FOUND]
    - errors[ERR_MONITORING_PERIOD_NOT_FOUND]
    - errors[ERR_CHANGE_REQUEST_NOT_FOUND]
    - errors[ERR_REUSE_GRANT_NOT_FOUND]
    - errors[ERR_BASELINE_NOT_FOUND]
    distinguishing_aspect: 'The catalog carries thirteen distinct 404 codes, so a single generic ERR_NOT_FOUND would fail:
      each probe below is issued against an empty database and must come back with the code named after the entity the path
      segment addresses, never a neighbour''s code. The last probe is not a path id at all — the baseline_id filter of GET
      /offerings is a body-level foreign key at priority 7, and an unknown value there is a 404 rather than an empty list.'
    test_recipe:
      setup:
      - 'Empty database: no agency, baseline, offering, engagement, package, finding, period, change request or reuse grant
        rows exist.'
      - The five literal ids below are syntactically valid UUIDs that were never minted by the API.
      setup_api_calls: []
      trigger:
      - call: POST /data-categories/11111111-1111-4111-8111-111111111111/confirm
        payload:
          decision: CONFIRM
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures: *id002
      - call: GET /control-implementations/22222222-2222-4222-8222-222222222222
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: GET /assessment-engagements/33333333-3333-4333-8333-333333333333
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
        captures: *id002
      - call: GET /authorization-packages/44444444-4444-4444-8444-444444444444
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: GET /deviation-requests/55555555-5555-4555-8555-555555555555
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      - call: GET /monitoring-periods/11111111-1111-4111-8111-111111111111
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures: *id002
      - call: GET /significant-change-requests/22222222-2222-4222-8222-222222222222
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
        captures: *id002
      - call: GET /reuse-grants/33333333-3333-4333-8333-333333333333
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures: *id002
      - call: GET /offerings
        payload:
          baseline_id: 44444444-4444-4444-8444-444444444444
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures: *id002
      assert:
      - 'unknown data category: HTTP 404 with error_id ERR_DATA_CATEGORY_NOT_FOUND'
      - 'unknown control implementation: HTTP 404 with error_id ERR_CONTROL_IMPLEMENTATION_NOT_FOUND'
      - 'unknown assessment engagement: HTTP 404 with error_id ERR_ENGAGEMENT_NOT_FOUND'
      - 'unknown authorization package: HTTP 404 with error_id ERR_PACKAGE_NOT_FOUND — the package-access rule at priority
        9 never runs because the row cannot be resolved at priority 6'
      - 'unknown deviation request: HTTP 404 with error_id ERR_DEVIATION_NOT_FOUND'
      - 'unknown monitoring period: HTTP 404 with error_id ERR_MONITORING_PERIOD_NOT_FOUND'
      - 'unknown significant change request: HTTP 404 with error_id ERR_CHANGE_REQUEST_NOT_FOUND'
      - 'unknown reuse grant: HTTP 404 with error_id ERR_REUSE_GRANT_NOT_FOUND'
      - 'GET /offerings?baseline_id=<unknown>: HTTP 404 with error_id ERR_BASELINE_NOT_FOUND — not HTTP 200 with an empty
        data array'
      - 'every response body carries the error envelope shape { data: { error_id, message } } with response_type ''error'''
  - name: a_fourth_package_row_on_one_offering_is_refused_whatever_its_state
    claim_type: error_triggerable
    grounds:
    - validations[priority=31]
    - errors[ERR_REVISION_LIMIT_EXCEEDED]
    - state_machines.AuthorizationPackage.DRAFT_to_SUPERSEDED
    - entities.CloudServiceOffering.fields.superseded_package_count
    distinguishing_aspect: 'The revision limit counts package ROWS, not open ones: each new package supersedes the previous
      DRAFT, so open_package_count never rises above 1 and an implementation that gated on the open counter would happily
      accept package four. Three creates are legal, the fourth is a 409, and every create bumps the offering version so the
      fourth attempt must still present the current version to reach priority 31 at all.'
    test_recipe:
      setup:
      - Clock 2026-03-30T00:00:00Z; offering has a delivered assessment report and one DRAFT package.
