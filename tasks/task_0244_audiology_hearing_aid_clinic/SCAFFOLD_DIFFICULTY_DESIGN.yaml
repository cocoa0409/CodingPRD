            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: warranty_approve_requires_order_warranty_active
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.FittingOrder.PURCHASED_to_WARRANTY_ACTIVE
          - entities.FittingOrder.fields.status
        distinguishing_aspect: |
          Entity pair WarrantyClaim->FittingOrder (different pair than order->evaluation): a claim can
          only be submitted/approved when its FittingOrder.status == WARRANTY_ACTIVE; submitting against
          a merely PURCHASED order is rejected.
        test_recipe:
          setup:
