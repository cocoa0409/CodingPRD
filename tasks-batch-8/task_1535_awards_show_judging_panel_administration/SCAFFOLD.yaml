scenario: |
  Awards Show & Judging Panel Administration (industry awards program): category definition & eligibility window rules, entry submission with fee & material requirements, judge recruitment, conflict declaration & panel assignment, round-based scoring & normalization across panels, finalist notification & embargo, ceremony production & winner announcement logistics, trophy/certificate fulfillment, results appeal & integrity audit

domain_name: awards-show-judging
api_prefix: /awards

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: AwardSeason
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique human-readable season code (e.g. 'GALA-2026'); unique across all seasons"
        constraints: "1..40 chars; unique"
      - name: title
        type: string
        source: input
        description: "Display title of the season"
        constraints: "1..120 chars"
      - name: status
        type: enum
        source: system
        description: "Season lifecycle posture; gates all child operations"
        default: DRAFT
        constraints: "one of DRAFT, OPEN, SUBMISSION_CLOSED, JUDGING, FINALISTS_LOCKED, EMBARGOED, CEREMONY_LIVE, PUBLISHED, ARCHIVED, CANCELLED"
      - name: submission_opens_at
        type: datetime
        source: input
        description: "UTC instant when entry submission opens"
      - name: early_fee_ends_at
        type: datetime
        source: input
        description: "UTC instant when early-bird fee tier ends; must be >= submission_opens_at and <= submission_closes_at"
      - name: submission_closes_at
        type: datetime
        source: input
        description: "UTC instant after which new entries are rejected (late window closes at submission_closes_at + LATE_WINDOW_HOURS)"
      - name: eligibility_window_start
        type: datetime
        source: input
        description: "UTC start (inclusive) of work-product eligibility window applied to entries"
      - name: eligibility_window_end
        type: datetime
        source: input
        description: "UTC end (exclusive) of work-product eligibility window; must be > eligibility_window_start"
      - name: ceremony_scheduled_at
        type: datetime
        source: input
        description: "UTC instant of the live ceremony; required before EMBARGOED -> CEREMONY_LIVE"
      - name: embargo_lifts_at
        type: datetime
        source: input
        description: "UTC instant when embargoed results become publicly visible; set at EMBARGOED transition"
      - name: ack_window_hours
        type: integer
        source: input
        description: "Hours a finalist has to acknowledge notification before auto-decline (ACK_WINDOW_HOURS); default 72"
        default: 72
      - name: go_live_lead_minutes
        type: integer
        source: input
        description: "Minutes before ceremony.starts_at that go-live becomes permitted (GO_LIVE_LEAD_MINUTES); default 30"
        default: 30
      - name: max_appeals_per_entry
        type: integer
        source: input
        description: "Cap on appeals any single entry may file; default 2"
        default: 2
      - name: refund_policy
        type: enum
        source: input
        description: "Withdrawal refund policy for paid entries; drives withdrawal_refund variant selection"
        default: FLAT_FEE
        constraints: "one of FLAT_FEE, EARLY_BIRD_FREE"
      - name: active_entries_count
        type: integer
        source: computed
        description: "Derived count of entries whose status is not WITHDRAWN or DISQUALIFIED; recomputed on every entry status change"
        default: 0
      - name: integrity_flag
        type: enum
        source: computed
        description: "Aggregate audit posture derived from unresolved audits and upheld appeals"
        default: CLEAN
        constraints: "one of CLEAN, UNDER_REVIEW, COMPROMISED"

  - name: AwardCategory
    parent: AwardSeason
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> AwardSeason.id; owning season"
      - name: code
        type: string
        source: input
        description: "Category code unique within its season (e.g. 'BEST_PICTURE')"
        constraints: "unique per season_id"
      - name: name
        type: string
        source: input
        description: "Display name"
      - name: description
        type: string
        source: input
        description: "Free-text rubric description"
      - name: eligibility_rules_text
        type: string
        source: input
        description: "Human-readable eligibility text surfaced to entrants"
      - name: min_materials
        type: integer
        source: input
        description: "Minimum number of ACCEPTED EntryMaterial records required before an entry in this category may be SUBMITTED"
        default: 1
      - name: max_entries_per_entrant
        type: integer
        source: input
        description: "Cap on non-WITHDRAWN entries one Entrant may hold in this category"
        default: 3
      - name: early_fee_cents
        type: integer
        source: input
        description: "Fee charged when fee obligation is created before season.early_fee_ends_at"
      - name: standard_fee_cents
        type: integer
        source: input
        description: "Fee charged when fee obligation is created on/after early_fee_ends_at and on/before submission_closes_at"
      - name: late_fee_cents
        type: integer
        source: input
        description: "Fee charged when fee obligation is created inside the late window (after submission_closes_at, up to LATE_WINDOW_HOURS later)"
      - name: panel_size
        type: integer
        source: input
        description: "Required number of judges with PanelAssignment status ACTIVE in each scoring round for this category"
        default: 5
      - name: finalist_slots
        type: integer
        source: input
        description: "Number of finalist slots published when the final round closes"
        default: 3
      - name: scoring_rubric
        type: array
        source: input
        description: "Ordered list of criterion objects {criterion_code, weight_bp, max_score}; weight_bp values must sum to exactly 10000"
      - name: status
        type: enum
        source: system
        description: "Category lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, SUSPENDED, RETIRED"

  - name: Entrant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal entity name of the submitting organization"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email; unique"
        constraints: "unique; RFC5322-ish"
      - name: country_code
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country of incorporation"
      - name: standing
        type: enum
        source: system
        description: "Derived from fee-payment and integrity history"
        default: GOOD
        constraints: "one of GOOD, DELINQUENT, BARRED"
      - name: delinquent_since
        type: datetime
        source: system
        description: "UTC instant the entrant first became DELINQUENT in the current episode; null when standing == GOOD"
        default: null
      - name: lifetime_disqualifications
        type: integer
        source: computed
        description: "Count of this entrant's entries that reached DISQUALIFIED status; drives BARRED promotion"
        default: 0

  - name: Entry
    parent: AwardCategory
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> AwardCategory.id; category entered"
      - name: entrant_id
        type: string
        source: input
        description: "FK -> Entrant.id; submitting organization"
      - name: title
        type: string
        source: input
        description: "Work-product title"
      - name: work_completed_at
        type: datetime
        source: input
        description: "UTC instant the work product was completed; must fall inside the season eligibility window [eligibility_window_start, eligibility_window_end)"
      - name: status
        type: enum
        source: system
        description: "Entry lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, ELIGIBLE, INELIGIBLE, IN_JUDGING, FINALIST, NON_FINALIST, WINNER, NON_WINNER, WITHDRAWN, DISQUALIFIED"
      - name: payment_status
        type: enum
        source: system
        description: "Parallel payment dimension evolving independently of status"
        default: UNPAID
        constraints: "one of UNPAID, INVOICED, PAID, REFUNDED, WAIVED"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times the entry has returned ELIGIBLE -> UNDER_REVIEW via resubmission cycle"
        default: 0
      - name: fee_tier_applied
        type: enum
        source: computed
        description: "Which fee tier was applied to this entry's FeeInvoice; null until invoiced"
        constraints: "one of EARLY, STANDARD, LATE, null"
      - name: fee_waived
        type: boolean
        source: system
        description: "Set true by POST /awards/entries/{id}/waive-fee while entry is DRAFT; on submit no invoice is created and payment_status becomes WAIVED"
        default: false
      - name: final_composite_score
        type: number
        source: computed
        description: "Final normalized composite score in [0,100] after the terminal scoring round closes; null until then"
      - name: final_rank
        type: integer
        source: computed
        description: "1-based rank within category after terminal round; null until computed"
      - name: disqualified_reason
        type: string
        source: system
        description: "Reason recorded when status transitions to DISQUALIFIED"

  - name: EntryMaterial
    parent: Entry
    common_fields: false
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; owning entry"
      - name: material_type
        type: enum
        source: input
        description: "Kind of asset"
        constraints: "one of VIDEO, AUDIO, PDF, IMAGE, URL"
      - name: uri
        type: string
        source: input
        description: "Locator for the asset"
      - name: file_size_bytes
        type: integer
        source: input
        description: "Declared size; must be <= MAX_MATERIAL_BYTES (104857600 = 100 MiB)"
      - name: checksum_sha256
        type: string
        source: input
        description: "64-hex SHA-256 of the asset; tamper-evidence input to the integrity audit"
      - name: status
        type: enum
        source: system
        description: "Material review state"
        default: PENDING
        constraints: "one of PENDING, ACCEPTED, REJECTED"

  - name: FeeInvoice
    parent: Entry
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; entry this invoice charges"
      - name: amount_cents
        type: integer
        source: computed
        description: "Amount computed by entry_fee calculation at creation"
      - name: tier
        type: enum
        source: computed
        description: "EARLY | STANDARD | LATE per entry_fee calculation"
        constraints: "one of EARLY, STANDARD, LATE"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle"
        default: ISSUED
        constraints: "one of ISSUED, PAID, VOIDED, REFUNDED"
      - name: due_at
        type: datetime
        source: computed
        description: "created_at + INVOICE_DUE_HOURS; payment after due_at marks entrant DELINQUENT"
      - name: paid_at
        type: datetime
        source: system
        description: "UTC instant payment settled; null until PAID"
      - name: refund_cents
        type: integer
        source: computed
        description: "Amount returned to the entrant on REFUNDED per withdrawal_refund calculation; null until refunded"
        default: null
      - name: retained_cents
        type: integer
        source: computed
        description: "Amount retained by the program on REFUNDED per withdrawal_refund; invariant refund_cents + retained_cents == amount_cents"
        default: null

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Judge display name"
      - name: email
        type: string
        source: input
        description: "Judge email; unique"
        constraints: "unique"
      - name: expertise_tags
        type: array
        source: input
        description: "List of expertise strings used for panel-matching documentation"
      - name: affiliated_entrant_ids
        type: array
        source: input
        description: "List of Entrant.id values the judge is affiliated with; feeds conflict seeding"
      - name: status
        type: enum
        source: system
        description: "Judge recruitment lifecycle"
        default: INVITED
        constraints: "one of INVITED, ACCEPTED, DECLINED, ACTIVE, SUSPENDED, RETIRED"
      - name: reliability_score_bp
        type: integer
        source: computed
        description: "0..10000 basis-point reliability derived from completed assignments vs accepted assignments"
        default: 10000

  - name: ConflictDeclaration
    parent: null
    common_fields: false
    fields:
      - name: judge_id
        type: string
        source: input
        description: "FK -> Judge.id; declaring judge"
      - name: season_id
        type: string
        source: input
        description: "FK -> AwardSeason.id; scope of the conflict"
      - name: entrant_id
        type: string
        source: input
        description: "FK -> Entrant.id; entrant the judge conflicts with"
      - name: category_id
        type: string
        source: input
        description: "FK -> AwardCategory.id; optional category scope; null means all categories"
      - name: conflict_type
        type: enum
        source: input
        description: "Nature of conflict"
        constraints: "one of FINANCIAL, FAMILIAL, PROFESSIONAL, PERSONAL, OTHER"
      - name: severity
        type: enum
        source: input
        description: "HARD conflicts bar assignment outright; SOFT conflicts bar chair role only"
        constraints: "one of HARD, SOFT"
      - name: note
        type: string
        source: input
        description: "Free-text explanation"
      - name: status
        type: enum
        source: system
        description: "Declaration lifecycle"
        default: DECLARED
        constraints: "one of DECLARED, ACKNOWLEDGED, RESCINDED"

  - name: PanelAssignment
    parent: null
    common_fields: true
    fields:
      - name: judge_id
        type: string
        source: input
        description: "FK -> Judge.id; assigned judge"
      - name: category_id
        type: string
        source: input
        description: "FK -> AwardCategory.id; panel category"
      - name: scoring_round_id
        type: string
        source: input
        description: "FK -> ScoringRound.id; round this assignment belongs to"
      - name: role
        type: enum
        source: input
        description: "CHAIR can lock rounds; MEMBER cannot"
        constraints: "one of CHAIR, MEMBER"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle"
        default: PROPOSED
        constraints: "one of PROPOSED, ACTIVE, RECUSED, REMOVED, COMPLETED"

  - name: ScoringRound
    parent: AwardCategory
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> AwardCategory.id; category being scored"
      - name: round_index
        type: integer
        source: input
        description: "1-based round number; 1=SCREENING, 2=SEMIFINAL, 3=FINAL"
        constraints: "1..3; at most one non-VOIDED round per (category_id, round_index) — a VOIDED round may be superseded by a replacement round with the same round_index"
      - name: name
        type: enum
        source: computed
        description: "Derived from round_index: 1->SCREENING, 2->SEMIFINAL, 3->FINAL"
        constraints: "one of SCREENING, SEMIFINAL, FINAL"
      - name: status
        type: enum
        source: system
        description: "Round lifecycle"
        default: CONFIGURING
        constraints: "one of CONFIGURING, PANEL_LOCKED, OPEN, CLOSED, NORMALIZED, PUBLISHED, VOIDED"
      - name: advance_count
        type: integer
        source: input
        description: "How many top entries advance from this round; FINAL round uses category.finalist_slots instead"
      - name: scoring_mode
        type: enum
        source: input
        description: "Which composite-score variant this round uses"
        constraints: "one of RAW_RANK, Z_SCORE"
      - name: scheduled_window_start
        type: datetime
        source: input
        description: "Planned UTC start of this round's scoring window; used by the round-scheduling overlap rule"
      - name: scheduled_window_end
        type: datetime
        source: input
        description: "Planned UTC end; must be > scheduled_window_start; round windows within one category must leave a gap of at least SCORING_ROUND_GAP_HOURS (12h) between any two windows"
      - name: opened_at
        type: datetime
        source: system
        description: "UTC instant round entered OPEN"
      - name: closed_at
        type: datetime
        source: system
        description: "UTC instant round entered CLOSED"
      - name: normalization_snapshot
        type: object
        source: computed
        description: "Frozen per-judge statistics {judge_id: {mean, stddev, count, min, max}} captured at NORMALIZED; drives deterministic recomputation on appeal"

  - name: Score
    parent: ScoringRound
    common_fields: false
    fields:
      - name: scoring_round_id
        type: string
        source: input
        description: "FK -> ScoringRound.id; round scored in"
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; entry scored"
      - name: judge_id
        type: string
        source: input
        description: "FK -> Judge.id; scoring judge"
      - name: criterion_scores
        type: object
        source: input
        description: "Map criterion_code -> integer raw score in [0, criterion.max_score]"
      - name: weighted_raw
        type: number
        source: computed
        description: "Weighted raw composite in [0,100] per composite_raw calculation"
      - name: z_intermediate
        type: number
        source: computed
        description: "Per-judge z-score intermediate used only in Z_SCORE mode; null in RAW_RANK mode"
      - name: rank_among_judges_scores
        type: number
        source: computed
        description: "Average rank of this score among the same judge's LOCKED scores in the round (RAW_RANK mode only; ties share average rank); null in Z_SCORE mode"
      - name: normalized_score
        type: number
        source: computed
        description: "Judge-normalized score in [0,100] per score_normalization calculation; null until round NORMALIZED"
      - name: status
        type: enum
        source: system
        description: "Score lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, LOCKED, VOIDED"

  - name: FinalistRecord
    parent: AwardCategory
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> AwardCategory.id"
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; finalist entry"
      - name: announced_rank
        type: integer
        source: computed
        description: "Rank at finalist-announcement time; frozen snapshot"
      - name: notification_status
        type: enum
        source: system
        description: "Notification pipeline state"
        default: PENDING
        constraints: "one of PENDING, NOTIFIED, ACKNOWLEDGED, DECLINED, REVOKED"
      - name: notified_at
        type: datetime
        source: system
        description: "UTC instant notification dispatched"
      - name: embargo_visible
        type: boolean
        source: computed
        description: "Whether this record is publicly visible; false until season clock >= embargo_lifts_at AND season.status in {CEREMONY_LIVE, PUBLISHED}"
        default: false

  - name: Ceremony
    parent: AwardSeason
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> AwardSeason.id"
      - name: venue_name
        type: string
        source: input
        description: "Venue display name"
      - name: starts_at
        type: datetime
        source: input
        description: "UTC start instant; must equal season.ceremony_scheduled_at"
      - name: ends_at
        type: datetime
        source: input
        description: "UTC end instant; must be > starts_at"
      - name: status
        type: enum
        source: system
        description: "Ceremony lifecycle"
        default: PLANNING
        constraints: "one of PLANNING, REHEARSAL, LIVE, CONCLUDED, ABORTED"
      - name: rundown
        type: array
        source: input
        description: "Ordered rundown segments [{segment_no, category_id, duration_seconds}]; segment_no unique, contiguous from 1"

  - name: WinnerAnnouncement
    parent: AwardCategory
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> AwardCategory.id"
      - name: ceremony_id
        type: string
        source: input
        description: "FK -> Ceremony.id; ceremony at which the winner is announced"
      - name: winner_entry_id
        type: string
        source: computed
        description: "FK -> Entry.id; entry holding final_rank == 1 at announcement time"
      - name: status
        type: enum
        source: system
        description: "Announcement lifecycle"
        default: STAGED
        constraints: "one of STAGED, ANNOUNCED, RETRACTED, RESTAGED"
      - name: announced_at
        type: datetime
        source: system
        description: "UTC instant status became ANNOUNCED"
      - name: retraction_reason
        type: string
        source: system
        description: "Reason recorded when status transitions to RETRACTED"

  - name: FulfillmentOrder
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> AwardSeason.id"
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; entry whose trophy/certificate this order produces"
      - name: announcement_id
        type: string
        source: input
        description: "FK -> WinnerAnnouncement.id; announcement authorizing this order"
      - name: item_type
        type: enum
        source: input
        description: "TROPHY for rank-1 winners; CERTIFICATE for finalists"
        constraints: "one of TROPHY, CERTIFICATE"
      - name: engraving_text
        type: string
        source: input
        description: "Exact engraving text; immutable once status != DRAFT"
      - name: quantity
        type: integer
        source: input
        description: "Units to produce; must be >= 1"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Fulfillment lifecycle"
        default: DRAFT
        constraints: "one of DRAFT, QUEUED, IN_PRODUCTION, SHIPPED, DELIVERED, CANCELLED"
      - name: vendor_reference
        type: string
        source: system
        description: "Reference assigned by FulfillmentVendor on QUEUED"

  - name: Appeal
    parent: Entry
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; appealed entry"
      - name: filed_by_entrant_id
        type: string
        source: input
        description: "FK -> Entrant.id; the filing entrant. Must match the acting user's Entrant.id, and the filing entrant must own at least one non-WITHDRAWN entry in the appealed entry's category (competitor standing)"
      - name: grounds
        type: enum
        source: input
        description: "Appeal grounds"
        constraints: "one of SCORING_ERROR, CONFLICT_UNDECLARED, ELIGIBILITY_MISREAD, PROCEDURAL_VIOLATION"
      - name: narrative
        type: string
        source: input
        description: "Free-text statement of the appeal"
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle"
        default: FILED
        constraints: "one of FILED, UNDER_REVIEW, UPHELD, DENIED, WITHDRAWN"
      - name: decided_by
        type: string
        source: system
        description: "Auditor identity (opaque user id) who decided; recorded for segregation-of-duties audit"
      - name: decided_at
        type: datetime
        source: system
        description: "UTC instant of UPHELD or DENIED"
      - name: remedy
        type: enum
        source: system
        description: "Remedy applied when UPHELD"
        constraints: "one of RESCORE, REINSTATE, NONE, null"

  - name: AuditLog
    parent: AwardSeason
    common_fields: false
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> AwardSeason.id; season audited"
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role of the actor"
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID of the actor"
      - name: action
        type: string
        source: system
        description: "Machine action name (endpoint + transition)"
      - name: target_type
        type: string
        source: system
        description: "Entity type of the mutation target"
      - name: target_id
        type: string
        source: system
        description: "Entity id of the mutation target"
      - name: detail
        type: object
        source: system
        description: "Structured before/after payload for integrity reconstruction"
      - name: hash_chain_prev
        type: string
        source: system
        description: "SHA-256 of previous AuditLog row in this season; genesis row uses 64 zero hex chars"
      - name: hash_chain_self
        type: string
        source: system
        description: "SHA-256 over (hash_chain_prev || action || target_id || canonical(detail)); tamper evidence"

state_machines:
  - entity: AwardSeason
    initial_state: DRAFT
    terminal_states: [ARCHIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /awards/seasons/{id}/open"
        actor: ProgramAdmin
        preconditions:
          - "season.status == DRAFT"
          - "at least one AwardCategory with status == PUBLISHED exists for this season"
          - "submission_opens_at <= current_clock < submission_closes_at"
        side_effects:
          - "season.status := OPEN"
          - "append AuditLog(action='SEASON_OPEN')"
      - from: OPEN
        to: SUBMISSION_CLOSED
        trigger: "POST /awards/seasons/{id}/close-submissions OR auto-transition when current_clock > submission_closes_at + LATE_WINDOW_HOURS"
        actor: ProgramAdmin
        preconditions:
          - "season.status == OPEN"
          - "current_clock >= submission_closes_at"
        side_effects:
          - "season.status := SUBMISSION_CLOSED"
          - "for every Entry in this season with status == DRAFT: entry.status := WITHDRAWN (late-Draft sweep)"
          - "recompute season.active_entries_count"
          - "append AuditLog(action='SEASON_CLOSE_SUBMISSIONS')"
      - from: SUBMISSION_CLOSED
        to: JUDGING
        trigger: "POST /awards/seasons/{id}/begin-judging"
        actor: ProgramAdmin
        preconditions:
          - "season.status == SUBMISSION_CLOSED"
          - "every Entry with status == SUBMITTED or UNDER_REVIEW has been resolved to ELIGIBLE or INELIGIBLE"
          - "for every PUBLISHED category: at least one ScoringRound has status == PANEL_LOCKED, and the PANEL_LOCKED round's round_index equals the minimum round_index among that category's non-VOIDED rounds (rounds must be locked in ascending round_index order)"
        side_effects:
          - "season.status := JUDGING"
          - "for every Entry with status == ELIGIBLE: entry.status := IN_JUDGING"
          - "append AuditLog(action='SEASON_BEGIN_JUDGING')"
      - from: JUDGING
        to: FINALISTS_LOCKED
        trigger: "POST /awards/seasons/{id}/lock-finalists"
        actor: ProgramAdmin
        preconditions:
          - "season.status == JUDGING"
          - "for every PUBLISHED category: its FINAL ScoringRound has status == NORMALIZED"
        side_effects:
          - "season.status := FINALISTS_LOCKED"
          - "for every PUBLISHED category: create FinalistRecord rows for the top category.finalist_slots entries by final_composite_score (tie-break: final_composite_score DESC, then weighted_raw of the FINAL round DESC, then entry.created_at ASC)"
          - "for each FinalistRecord entry: entry.status := FINALIST; all other IN_JUDGING entries in the category: entry.status := NON_FINALIST"
          - "append AuditLog(action='SEASON_LOCK_FINALISTS')"
      - from: FINALISTS_LOCKED
        to: EMBARGOED
        trigger: "POST /awards/seasons/{id}/embargo"
        actor: ProgramAdmin
        preconditions:
          - "season.status == FINALISTS_LOCKED"
          - "every FinalistRecord.notification_status in {NOTIFIED, ACKNOWLEDGED, DECLINED}"
          - "ceremony_scheduled_at is set and > current_clock"
          - "embargo_lifts_at argument > current_clock"
        side_effects:
          - "season.status := EMBARGOED"
          - "season.embargo_lifts_at := embargo_lifts_at argument"
          - "append AuditLog(action='SEASON_EMBARGO')"
      - from: EMBARGOED
        to: CEREMONY_LIVE
        trigger: "POST /awards/seasons/{id}/go-live"
        actor: ProgramAdmin
        preconditions:
          - "season.status == EMBARGOED"
          - "exactly one Ceremony for this season has status == REHEARSAL (if several, the one with earliest starts_at is selected; ties broken by created_at ASC)"
          - "current_clock >= selected ceremony.starts_at - season.go_live_lead_minutes"
        side_effects:
          - "season.status := CEREMONY_LIVE"
          - "the selected REHEARSAL Ceremony.status := LIVE"
          - "if current_clock >= season.embargo_lifts_at: every FinalistRecord.embargo_visible := true"
          - "append AuditLog(action='SEASON_GO_LIVE')"
      - from: CEREMONY_LIVE
        to: PUBLISHED
        trigger: "POST /awards/seasons/{id}/publish-results"
        actor: ProgramAdmin
        preconditions:
          - "season.status == CEREMONY_LIVE"
          - "every PUBLISHED category has a WinnerAnnouncement with status == ANNOUNCED"
          - "the Ceremony.status == CONCLUDED"
        side_effects:
          - "season.status := PUBLISHED"
          - "every FinalistRecord.embargo_visible := true"
          - "append AuditLog(action='SEASON_PUBLISH')"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /awards/seasons/{id}/archive"
        actor: ProgramAdmin
        preconditions:
          - "season.status == PUBLISHED"
          - "no Appeal in {FILED, UNDER_REVIEW} for any entry in this season"
          - "every FulfillmentOrder for this season has status in {DELIVERED, CANCELLED}"
        side_effects:
          - "season.status := ARCHIVED"
          - "append AuditLog(action='SEASON_ARCHIVE')"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /awards/seasons/{id}/cancel"
        actor: ProgramAdmin
        preconditions:
          - "season.status in {DRAFT, OPEN}"
        side_effects:
          - "season.status := CANCELLED"
          - "every child Entry with status not in {WITHDRAWN, DISQUALIFIED}: status := WITHDRAWN"
          - "every FeeInvoice with status == ISSUED: status := VOIDED"
          - "append AuditLog(action='SEASON_CANCEL')"

  - entity: AwardCategory
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /awards/categories/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "parent season.status in {DRAFT, OPEN}"
          - "scoring_rubric weights sum to exactly 10000"
          - "panel_size >= 3"
          - "finalist_slots >= 1"
        side_effects:
          - "category.status := PUBLISHED"
          - "append AuditLog(action='CATEGORY_PUBLISH')"
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /awards/categories/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "parent season.status in {DRAFT, OPEN, SUBMISSION_CLOSED}"
        side_effects:
          - "category.status := SUSPENDED"
          - "entries in this category with status == DRAFT: status := WITHDRAWN"
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /awards/categories/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "parent season.status in {DRAFT, OPEN}"
          - "scoring_rubric weights sum to exactly 10000"
        side_effects:
          - "category.status := PUBLISHED"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /awards/categories/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "parent season.status in {PUBLISHED, ARCHIVED}"
          - "no Appeal in {FILED, UNDER_REVIEW} on entries of this category"
        side_effects:
          - "category.status := RETIRED"

  - entity: Entry
    initial_state: DRAFT
    terminal_states: [WINNER, NON_WINNER, WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /awards/entries/{id}/submit"
        actor: Entrant
        preconditions:
          - "entry.status == DRAFT"
          - "parent category.status == PUBLISHED"
          - "parent season.status == OPEN"
          - "current_clock < submission_closes_at + LATE_WINDOW_HOURS (late fee tier applies after submission_closes_at)"
          - "count of ACCEPTED EntryMaterial for this entry >= category.min_materials"
          - "work_completed_at within [season.eligibility_window_start, season.eligibility_window_end)"
          - "count of entrant's non-WITHDRAWN entries in this category < category.max_entries_per_entrant"
        side_effects:
          - "entry.status := SUBMITTED"
          - "create FeeInvoice via entry_fee calculation; entry.payment_status := INVOICED"
          - "entry.fee_tier_applied := computed tier"
          - "season.active_entries_count += 1"
          - "append AuditLog(action='ENTRY_SUBMIT')"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /awards/entries/{id}/payment-settled (webhook) when invoice paid"
        actor: system
        preconditions:
          - "entry.status == SUBMITTED"
          - "linked FeeInvoice.status == PAID OR entry.payment_status == WAIVED"
        side_effects:
          - "entry.status := UNDER_REVIEW"
          - "entry.payment_status := PAID (or stays WAIVED)"
      - from: UNDER_REVIEW
        to: ELIGIBLE
        trigger: "POST /awards/entries/{id}/mark-eligible"
        actor: ProgramAdmin
        preconditions:
          - "entry.status == UNDER_REVIEW"
          - "season.status in {OPEN, SUBMISSION_CLOSED}"
        side_effects:
          - "entry.status := ELIGIBLE"
          - "append AuditLog(action='ENTRY_MARK_ELIGIBLE')"
      - from: UNDER_REVIEW
        to: INELIGIBLE
        trigger: "POST /awards/entries/{id}/mark-ineligible"
        actor: ProgramAdmin
        preconditions:
          - "entry.status == UNDER_REVIEW"
          - "season.status in {OPEN, SUBMISSION_CLOSED}"
        side_effects:
          - "entry.status := INELIGIBLE"
          - "payment is retained while the revision loop is open: invoice stays PAID; no refund fires here (refund fires only on WITHDRAWN / terminal disposition)"
          - "season.active_entries_count unchanged (INELIGIBLE still counts as active; only WITHDRAWN/DISQUALIFIED leave the count)"
          - "append AuditLog(action='ENTRY_MARK_INELIGIBLE')"
      - from: INELIGIBLE
        to: UNDER_REVIEW
        trigger: "POST /awards/entries/{id}/request-recheck"
        actor: Entrant
        preconditions:
          - "entry.status == INELIGIBLE"
          - "entry.revision_count < 2 (MAX_REVISIONS = 2)"
          - "season.status in {OPEN, SUBMISSION_CLOSED}"
        side_effects:
          - "entry.status := UNDER_REVIEW"
          - "entry.revision_count += 1"
          - "entry.payment_status := PAID (recheck fee re-uses settled payment)"
      - from: ELIGIBLE
        to: IN_JUDGING
        trigger: "system cascade on season SUBMISSION_CLOSED -> JUDGING"
        actor: system
        preconditions:
          - "season.status transitions to JUDGING"
        side_effects:
          - "entry.status := IN_JUDGING"
      - from: IN_JUDGING
        to: FINALIST
        trigger: "system cascade on season lock-finalists"
        actor: system
        preconditions:
          - "entry in top category.finalist_slots by final_composite_score"
        side_effects:
          - "entry.status := FINALIST"
      - from: IN_JUDGING
        to: NON_FINALIST
        trigger: "system cascade on season lock-finalists"
        actor: system
        preconditions:
          - "entry NOT in top category.finalist_slots"
        side_effects:
          - "entry.status := NON_FINALIST"
          - "no FulfillmentOrder is created (certificates are issued only to FINALIST entries at announcement time)"
      - from: FINALIST
        to: WINNER
        trigger: "system cascade on WinnerAnnouncement ANNOUNCED where winner_entry_id == this entry"
        actor: system
        preconditions:
          - "announcement.status transitions to ANNOUNCED"
        side_effects:
          - "entry.status := WINNER"
          - "create FulfillmentOrder(item_type=TROPHY) for this entry"
      - from: FINALIST
        to: NON_WINNER
        trigger: "system cascade on WinnerAnnouncement ANNOUNCED where winner_entry_id != this entry"
        actor: system
        preconditions:
          - "announcement.status transitions to ANNOUNCED"
        side_effects:
          - "entry.status := NON_WINNER"
          - "create FulfillmentOrder(item_type=CERTIFICATE) for this entry"
      - from: WINNER
        to: DISQUALIFIED
        trigger: "system cascade on Appeal UPHELD with grounds=CONFLICT_UNDECLARED and remedy=RESCORE that drops entry out of rank 1 after renormalization"
        actor: system
        preconditions:
          - "appeal-driven recomputation displaces the entry from rank 1"
        side_effects:
          - "entry.status := DISQUALIFIED"
          - "entrant.lifetime_disqualifications += 1; if >= BARRED_THRESHOLD then entrant.standing := BARRED"
          - "linked FulfillmentOrder with status not in {SHIPPED, DELIVERED}: status := CANCELLED"
          - "season.active_entries_count -= 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /awards/entries/{id}/withdraw"
        actor: Entrant
        preconditions:
          - "entry.status in {DRAFT, SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "entry.status := WITHDRAWN"
          - "if FeeInvoice.status == ISSUED: invoice.status := VOIDED; entry.payment_status := UNPAID"
          - "if entry was SUBMITTED or UNDER_REVIEW: season.active_entries_count -= 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /awards/entries/{id}/withdraw"
        actor: Entrant
        preconditions:
          - "entry.status in {DRAFT, SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "entry.status := WITHDRAWN"
          - "if FeeInvoice.status == PAID: run withdrawal_refund; invoice.status := REFUNDED with refund_cents/retained_cents written; entry.payment_status := REFUNDED"
          - "season.active_entries_count -= 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /awards/entries/{id}/withdraw"
        actor: Entrant
        preconditions:
          - "entry.status in {DRAFT, SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "entry.status := WITHDRAWN"
          - "if FeeInvoice.status == PAID: run withdrawal_refund; invoice.status := REFUNDED with refund_cents/retained_cents written; entry.payment_status := REFUNDED"
          - "season.active_entries_count -= 1"

  - entity: FeeInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED, REFUNDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /awards/invoices/{id}/pay"
        actor: Entrant
        preconditions:
          - "invoice.status == ISSUED"
          - "entrant owns invoice.entry_id"
        side_effects:
          - "invoice.status := PAID; invoice.paid_at := current_clock"
          - "entry.payment_status := PAID"
          - "cascade entry SUBMITTED -> UNDER_REVIEW"
          - "if current_clock > invoice.due_at and entrant.standing == DELINQUENT: entrant.standing := GOOD, delinquent_since := null"
      - from: ISSUED
        to: VOIDED
        trigger: "system on entry withdraw / season cancel / entry ineligible before payment"
        actor: system
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "invoice.status := VOIDED"
          - "entry.payment_status := UNPAID"
      - from: PAID
        to: REFUNDED
        trigger: "system on entry INELIGIBLE ruling or entrant withdrawal"
        actor: system
        preconditions:
          - "invoice.status == PAID"
        side_effects:
          - "invoice.status := REFUNDED"
          - "entry.payment_status := REFUNDED"

  - entity: Judge
    initial_state: INVITED
    terminal_states: [DECLINED, RETIRED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /awards/judges/{id}/accept"
        actor: Judge
        preconditions:
          - "judge.status == INVITED"
        side_effects:
          - "judge.status := ACCEPTED"
          - "auto-seed ConflictDeclaration rows for each affiliated_entrant_ids entry (season scope resolved per assignment)"
      - from: INVITED
        to: DECLINED
        trigger: "POST /awards/judges/{id}/decline"
        actor: Judge
        preconditions:
          - "judge.status == INVITED"
        side_effects:
          - "judge.status := DECLINED"
      - from: ACCEPTED
        to: ACTIVE
        trigger: "POST /awards/judges/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "judge.status == ACCEPTED"
          - "judge has at least one ConflictDeclaration with status in {DECLARED, ACKNOWLEDGED} for the target season, OR judge.affiliated_entrant_ids is empty"
        side_effects:
          - "judge.status := ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /awards/judges/{id}/suspend"
        actor: ProgramAdmin
        preconditions:
          - "judge.status == ACTIVE"
        side_effects:
          - "judge.status := SUSPENDED"
          - "every PanelAssignment for this judge with status in {PROPOSED, ACTIVE}: status := REMOVED"
          - "recompute affected ScoringRound panel completeness; if any PANEL_LOCKED round drops below panel_size: round.status := CONFIGURING"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /awards/judges/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "judge.status == SUSPENDED"
        side_effects:
          - "judge.status := ACTIVE"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /awards/judges/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "judge.status in {ACTIVE, SUSPENDED}"
          - "no PanelAssignment with status == ACTIVE in a ScoringRound with status == OPEN"
        side_effects:
          - "judge.status := RETIRED"

  - entity: ConflictDeclaration
    initial_state: DECLARED
    terminal_states: [RESCINDED]
    transitions:
      - from: DECLARED
        to: ACKNOWLEDGED
        trigger: "POST /awards/conflict-declarations/{id}/acknowledge"
        actor: ProgramAdmin
        preconditions:
          - "declaration.status == DECLARED"
        side_effects:
          - "declaration.status := ACKNOWLEDGED"
      - from: DECLARED
        to: RESCINDED
        trigger: "POST /awards/conflict-declarations/{id}/rescind"
        actor: Judge
        preconditions:
          - "declaration.status == DECLARED"
          - "acting Judge.id == declaration.judge_id (or ProgramAdmin override)"
        side_effects:
          - "declaration.status := RESCINDED"
          - "if this was the only HARD conflict barring a PROPOSED PanelAssignment, that assignment's confirm becomes unblocked"

  - entity: PanelAssignment
    initial_state: PROPOSED
    terminal_states: [RECUSED, REMOVED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /awards/panel-assignments/{id}/confirm"
        actor: Judge
        preconditions:
          - "assignment.status == PROPOSED"
          - "acting Judge.id == assignment.judge_id"
          - "judge.status == ACTIVE"
          - "no ConflictDeclaration with status in {DECLARED, ACKNOWLEDGED}, severity == HARD, matching (this judge) AND (entrant of any IN_JUDGING/ELIGIBLE entry in assignment.category_id OR category scope null covering this season)"
          - "linked ScoringRound.status == CONFIGURING"
        side_effects:
          - "assignment.status := ACTIVE"
      - from: ACTIVE
        to: RECUSED
        trigger: "POST /awards/panel-assignments/{id}/recuse"
        actor: Judge
        preconditions:
          - "assignment.status == ACTIVE"
          - "acting Judge.id == assignment.judge_id"
        side_effects:
          - "assignment.status := RECUSED"
          - "create ConflictDeclaration(status=ACKNOWLEDGED, severity=HARD, conflict_type=OTHER) if none exists covering this category"
          - "every Score by this judge in this round with status == DRAFT: status := VOIDED"
          - "judge.reliability_score_bp recomputed via judge_reliability calculation"
          - "if round.status == PANEL_LOCKED and ACTIVE assignments < category.panel_size: round.status := CONFIGURING"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /awards/panel-assignments/{id}/remove"
        actor: ProgramAdmin
        preconditions:
          - "assignment.status == ACTIVE"
          - "linked ScoringRound.status in {CONFIGURING, PANEL_LOCKED}"
        side_effects:
          - "assignment.status := REMOVED"
          - "every Score by this judge in this round with status == DRAFT: status := VOIDED"
          - "judge.reliability_score_bp recomputed via judge_reliability calculation"
          - "if round.status == PANEL_LOCKED and ACTIVE assignments < category.panel_size: round.status := CONFIGURING"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system cascade when linked ScoringRound reaches NORMALIZED"
        actor: system
        preconditions:
          - "round.status transitions to NORMALIZED"
        side_effects:
          - "assignment.status := COMPLETED"
          - "judge.reliability_score_bp recomputed via judge_reliability calculation"

  - entity: ScoringRound
    initial_state: CONFIGURING
    terminal_states: [PUBLISHED, VOIDED]
    transitions:
      - from: CONFIGURING
        to: PANEL_LOCKED
        trigger: "POST /awards/scoring-rounds/{id}/lock-panel"
        actor: ProgramAdmin
        preconditions:
          - "round.status == CONFIGURING"
          - "count of PanelAssignment with status == ACTIVE for this round >= category.panel_size"
          - "exactly one ACTIVE assignment with role == CHAIR"
          - "season.status in {SUBMISSION_CLOSED, JUDGING}"
        side_effects:
          - "round.status := PANEL_LOCKED"
          - "append AuditLog(action='ROUND_PANEL_LOCKED')"
      - from: PANEL_LOCKED
        to: OPEN
        trigger: "POST /awards/scoring-rounds/{id}/open"
        actor: ProgramAdmin
        preconditions:
          - "round.status == PANEL_LOCKED"
          - "season.status == JUDGING"
          - "round.round_index == the minimum round_index among the category's non-VOIDED rounds that have not yet reached NORMALIZED (rounds run in ascending index order)"
          - "if a non-VOIDED round with round_index - 1 exists: that round's status == NORMALIZED"
          - "entry candidate set non-empty (lowest-indexed round: all IN_JUDGING entries in category; later rounds: entries that advanced from the immediately preceding round)"
        side_effects:
          - "round.status := OPEN; round.opened_at := current_clock"
          - "append AuditLog(action='ROUND_OPEN')"
      - from: OPEN
        to: CLOSED
        trigger: "POST /awards/scoring-rounds/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "round.status == OPEN"
          - "every ACTIVE PanelAssignment judge has status == SUBMITTED or LOCKED Score rows for every candidate entry (complete ballot)"
        side_effects:
          - "round.status := CLOSED; round.closed_at := current_clock"
          - "every Score in this round with status == SUBMITTED: status := LOCKED"
          - "append AuditLog(action='ROUND_CLOSE')"
      - from: CLOSED
        to: NORMALIZED
        trigger: "POST /awards/scoring-rounds/{id}/normalize"
        actor: ProgramAdmin
        preconditions:
          - "round.status == CLOSED"
        side_effects:
          - "run score_normalization calculation over LOCKED scores; write each Score.normalized_score"
          - "freeze round.normalization_snapshot with per-judge {mean, stddev, count, min, max}"
          - "compute composite standings; for round_index < 3: mark top advance_count entries as advancing; for round_index == 3: write entry.final_composite_score and final_rank via final_composite calculation"
          - "every PanelAssignment ACTIVE -> COMPLETED"
          - "round.status := NORMALIZED"
          - "append AuditLog(action='ROUND_NORMALIZED')"
      - from: NORMALIZED
        to: PUBLISHED
        trigger: "system cascade on season lock-finalists (for FINAL round)"
        actor: system
        preconditions:
          - "round.round_index == 3"
          - "season transitions JUDGING -> FINALISTS_LOCKED"
        side_effects:
          - "round.status := PUBLISHED"
      - from: NORMALIZED
        to: VOIDED
        trigger: "system cascade on Appeal UPHELD with remedy=RESCORE for an entry scored in this round"
        actor: system
        preconditions:
          - "appeal upheld against an entry scored in this round"
        side_effects:
          - "round.status := VOIDED"
          - "if appeal.grounds == CONFLICT_UNDECLARED: every LOCKED Score by the conflicted judge in this round: status := VOIDED"
          - "a replacement ScoringRound with the same round_index may then be created via POST /awards/categories/{category_id}/scoring-rounds (the VOIDED round no longer blocks uniqueness); its normalization MUST reuse this round's normalization_snapshot for judges whose scores remain LOCKED"
          - "season.integrity_flag := UNDER_REVIEW"

  - entity: Score
    initial_state: DRAFT
    terminal_states: [LOCKED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /awards/scores/{id}/submit"
        actor: Judge
        preconditions:
          - "score.status == DRAFT"
          - "acting Judge.id == score.judge_id"
          - "linked ScoringRound.status == OPEN"
          - "every criterion in category.scoring_rubric present in criterion_scores with 0 <= value <= criterion.max_score"
        side_effects:
          - "score.status := SUBMITTED"
          - "score.weighted_raw computed via composite_raw"
      - from: SUBMITTED
        to: LOCKED
        trigger: "system cascade on round close"
        actor: system
        preconditions:
          - "round.status transitions OPEN -> CLOSED"
        side_effects:
          - "score.status := LOCKED"
      - from: DRAFT
        to: VOIDED
        trigger: "system on judge recusal/removal"
        actor: system
        preconditions:
          - "assignment transitions to RECUSED or REMOVED"
        side_effects:
          - "score.status := VOIDED"
      - from: LOCKED
        to: VOIDED
        trigger: "system on appeal-driven round void"
        actor: system
        preconditions:
          - "round.status transitions NORMALIZED -> VOIDED and score.judge_id is the conflicted judge"
        side_effects:
          - "score.status := VOIDED"

  - entity: FinalistRecord
    initial_state: PENDING
    terminal_states: [DECLINED, REVOKED]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /awards/finalists/{id}/notify"
        actor: ProgramAdmin
        preconditions:
          - "record.notification_status == PENDING"
          - "season.status in {FINALISTS_LOCKED, EMBARGOED}"
        side_effects:
          - "record.notification_status := NOTIFIED; notified_at := current_clock"
      - from: NOTIFIED
        to: ACKNOWLEDGED
        trigger: "POST /awards/finalists/{id}/acknowledge"
        actor: Entrant
        preconditions:
          - "record.notification_status == NOTIFIED"
          - "acting Entrant.id == record.entry.entrant_id"
          - "current_clock <= notified_at + season.ack_window_hours"
        side_effects:
          - "record.notification_status := ACKNOWLEDGED"
      - from: NOTIFIED
        to: DECLINED
        trigger: "POST /awards/finalists/{id}/decline OR auto when current_clock > notified_at + season.ack_window_hours"
        actor: Entrant
        preconditions:
          - "record.notification_status == NOTIFIED"
        side_effects:
          - "record.notification_status := DECLINED"
          - "promote next-highest-ranked non-finalist entry to FINALIST via finalist promotion cascade (new FinalistRecord PENDING); demoted entry.status := NON_FINALIST"
      - from: ACKNOWLEDGED
        to: REVOKED
        trigger: "system on appeal-driven recomputation that displaces this finalist"
        actor: system
        preconditions:
          - "recomputed final_rank > category.finalist_slots"
        side_effects:
          - "record.notification_status := REVOKED"
          - "entry.status := NON_FINALIST"
          - "linked CERTIFICATE FulfillmentOrder with status in {DRAFT, QUEUED}: status := CANCELLED"

  - entity: Ceremony
    initial_state: PLANNING
    terminal_states: [CONCLUDED, ABORTED]
    transitions:
      - from: PLANNING
        to: REHEARSAL
        trigger: "POST /awards/ceremonies/{id}/rehearse"
        actor: ProgramAdmin
        preconditions:
          - "ceremony.status == PLANNING"
          - "season.status == EMBARGOED"
          - "rundown covers every PUBLISHED category exactly once"
        side_effects:
          - "ceremony.status := REHEARSAL"
      - from: REHEARSAL
        to: LIVE
        trigger: "system cascade on season go-live"
        actor: system
        preconditions:
          - "season transitions EMBARGOED -> CEREMONY_LIVE"
        side_effects:
          - "ceremony.status := LIVE"
      - from: LIVE
        to: CONCLUDED
        trigger: "POST /awards/ceremonies/{id}/conclude"
        actor: ProgramAdmin
        preconditions:
          - "ceremony.status == LIVE"
          - "every PUBLISHED category has WinnerAnnouncement status == ANNOUNCED"
        side_effects:
          - "ceremony.status := CONCLUDED"
      - from: PLANNING
        to: ABORTED
        trigger: "POST /awards/ceremonies/{id}/abort"
        actor: ProgramAdmin
        preconditions:
          - "ceremony.status in {PLANNING, REHEARSAL}"
        side_effects:
          - "ceremony.status := ABORTED"

  - entity: WinnerAnnouncement
    initial_state: STAGED
    terminal_states: [ANNOUNCED, RETRACTED]
    transitions:
      - from: STAGED
        to: ANNOUNCED
        trigger: "POST /awards/announcements/{id}/announce"
        actor: ProgramAdmin
        preconditions:
          - "announcement.status in {STAGED, RESTAGED}"
          - "season.status == CEREMONY_LIVE"
          - "ceremony.status == LIVE"
          - "current_clock >= season.embargo_lifts_at"
        side_effects:
          - "announcement.status := ANNOUNCED; announced_at := current_clock"
          - "winner_entry_id := entry with final_rank == 1 in this category"
          - "winner entry.status := WINNER; all other FINALIST entries in category := NON_WINNER"
          - "create FulfillmentOrder(TROPHY) for winner; FulfillmentOrder(CERTIFICATE) for each NON_WINNER finalist"
          - "append AuditLog(action='WINNER_ANNOUNCED')"
      - from: ANNOUNCED
        to: RETRACTED
        trigger: "POST /awards/announcements/{id}/retract"
        actor: Auditor
        preconditions:
          - "announcement.status == ANNOUNCED"
          - "an Appeal with status == UPHELD exists against the winner entry with remedy == RESCORE"
        side_effects:
          - "announcement.status := RETRACTED; retraction_reason recorded"
          - "winner entry.status := DISQUALIFIED if grounds == CONFLICT_UNDECLARED else stays FINALIST pending rescore"
          - "TROPHY FulfillmentOrder for the retracted winner with status in {DRAFT, QUEUED, IN_PRODUCTION}: status := CANCELLED"
          - "season.integrity_flag := UNDER_REVIEW"
          - "append AuditLog(action='WINNER_RETRACTED')"
      - from: RETRACTED
        to: RESTAGED
        trigger: "POST /awards/announcements/{id}/restage"
        actor: ProgramAdmin
        preconditions:
          - "announcement.status == RETRACTED"
          - "replacement FINAL round (revision) status == NORMALIZED"
        side_effects:
          - "announcement.status := RESTAGED"
          - "winner_entry_id recomputed from replacement round"

  - entity: FulfillmentOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUEUED
        trigger: "POST /awards/fulfillment-orders/{id}/queue"
        actor: FulfillmentVendor
        preconditions:
          - "order.status == DRAFT"
          - "linked WinnerAnnouncement.status == ANNOUNCED"
          - "season.status in {CEREMONY_LIVE, PUBLISHED}"
        side_effects:
          - "order.status := QUEUED; vendor_reference assigned"
      - from: QUEUED
        to: IN_PRODUCTION
        trigger: "POST /awards/fulfillment-orders/{id}/start-production"
        actor: FulfillmentVendor
        preconditions:
          - "order.status == QUEUED"
        side_effects:
          - "order.status := IN_PRODUCTION"
      - from: IN_PRODUCTION
        to: SHIPPED
        trigger: "POST /awards/fulfillment-orders/{id}/ship"
        actor: FulfillmentVendor
        preconditions:
          - "order.status == IN_PRODUCTION"
        side_effects:
          - "order.status := SHIPPED"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /awards/fulfillment-orders/{id}/deliver"
        actor: FulfillmentVendor
        preconditions:
          - "order.status == SHIPPED"
        side_effects:
          - "order.status := DELIVERED"
      - from: DRAFT
        to: CANCELLED
        trigger: "system cascade on winner retraction / finalist revocation / entry disqualification"
        actor: system
        preconditions:
          - "order.status in {DRAFT, QUEUED, IN_PRODUCTION}"
        side_effects:
          - "order.status := CANCELLED"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /awards/appeals/{id}/take-under-review"
        actor: Auditor
        preconditions:
          - "appeal.status == FILED"
          - "acting auditor is not the entrant that filed (segregation of duties: decided_by != filed_by_entrant_id mapped user)"
        side_effects:
          - "appeal.status := UNDER_REVIEW"
          - "season.integrity_flag := UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /awards/appeals/{id}/uphold"
        actor: Auditor
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "remedy argument in {RESCORE, REINSTATE, NONE}"
        side_effects:
          - "appeal.status := UPHELD; decided_at := current_clock; decided_by := acting auditor id; remedy := argument"
          - "if remedy == RESCORE: void the ScoringRound that produced the appealed score (NORMALIZED -> VOIDED), clone replacement round; if the appealed entry was WINNER, cascade WinnerAnnouncement retraction path opens"
          - "if remedy == REINSTATE and entry.status == INELIGIBLE: entry.status := UNDER_REVIEW and payment_status := PAID"
          - "append AuditLog(action='APPEAL_UPHELD')"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /awards/appeals/{id}/deny"
        actor: Auditor
        preconditions:
          - "appeal.status == UNDER_REVIEW"
        side_effects:
          - "appeal.status := DENIED; decided_at := current_clock"
          - "if no other appeal in {FILED, UNDER_REVIEW} for the season: season.integrity_flag := CLEAN"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /awards/appeals/{id}/withdraw"
        actor: Entrant
        preconditions:
          - "appeal.status == FILED"
          - "acting Entrant.id == appeal.filed_by_entrant_id"
        side_effects:
          - "appeal.status := WITHDRAWN"

concurrency_rules:
  - rule_id: panel-assignment-stale-round
    parent_entity: ScoringRound
    write_endpoint: "POST /awards/scoring-rounds/{id}/panel-assignments"
    occ_field: "expected_scoring_round_version"
    description: |
      Creating a PanelAssignment against a ScoringRound whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just added or confirmed an assignment (advancing the
      round's version and possibly reaching panel_size), so the current writer's
      view of remaining panel capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: conflict-declaration-stale-judge
    parent_entity: Judge
    write_endpoint: "POST /awards/judges/{id}/conflict-declarations"
    occ_field: "expected_judge_version"
    description: |
      Filing a ConflictDeclaration against a Judge whose version has advanced
      since the client last observed it is rejected. This captures the case where
      the judge's affiliation set or status changed after the client read the
      record, so the declaration would be computed against a stale affiliation
      baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: score-submit-stale-round
    parent_entity: ScoringRound
    write_endpoint: "POST /awards/scoring-rounds/{id}/scores"
    occ_field: "expected_scoring_round_version"
    description: |
      Submitting a Score against a ScoringRound whose version has advanced since
      the judge last observed it is rejected. A panel membership change or a
      round re-open advances the version; the late ballot is refused rather than
      silently merged into a changed panel composition.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: entry_fee
    trigger: "on Entry DRAFT -> SUBMITTED (FeeInvoice creation)"
    algorithm: threshold
    formula: |
      if current_clock < season.early_fee_ends_at:
          tier = EARLY;   amount_cents = category.early_fee_cents
      elif current_clock <= season.submission_closes_at:
          tier = STANDARD; amount_cents = category.standard_fee_cents
      else:
          tier = LATE;    amount_cents = category.late_fee_cents
      # Boundary pins: early_fee_ends_at exactly => STANDARD; submission_closes_at exactly => STANDARD; closes_at + 1s => LATE
      due_at = current_clock + INVOICE_DUE_HOURS
    input_set: "the submitting entry, its category, its parent season, current_clock"
    constants:
      INVOICE_DUE_HOURS: 72
      LATE_WINDOW_HOURS: 48
      WITHDRAWAL_FEE_CENTS: 2500
    precision: "integer cents; no rounding"
    variants:
      - name: waived
        when: "ProgramAdmin applies a fee waiver via POST /awards/entries/{id}/waive-fee before submission completes payment"
        difference: "no FeeInvoice is created; entry.payment_status := WAIVED; entry transitions SUBMITTED -> UNDER_REVIEW immediately on submit"

  - name: composite_raw
    trigger: "on Score DRAFT -> SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      # PINNED ROUNDING ORDER: round each criterion contribution to 4dp FIRST, then sum, then round the sum to 4dp.
      # (The alternative order — sum raw contributions then round once — yields different 4th-decimal results.)
      total = 0
      for each criterion c in category.scoring_rubric:
          raw = criterion_scores[c.criterion_code]
          contribution = round_half_up((raw / c.max_score) * c.weight_bp / 100.0, 4)
          total += contribution
      weighted_raw = round_half_up(total, 4)   # yields [0,100] with 4dp
    input_set: "the score's criterion_scores map and the category scoring_rubric at submission time (rubric version pinned to the round)"
    constants:
      BP_DENOMINATOR: 10000
    precision: "4 decimal places, round_half_up per criterion contribution, then round_half_up on the sum"

  - name: score_normalization
    trigger: "on ScoringRound CLOSED -> NORMALIZED"
    algorithm: aggregation
    formula: |
      # Per-judge z-score normalization, then min-max rescale to [0,100]
      # Variant selection by round.scoring_mode:
      if round.scoring_mode == Z_SCORE:
          for each judge j with LOCKED scores in this round:
              scores_j = [s.weighted_raw for s in LOCKED scores by j]
              mean_j = mean(scores_j); stddev_j = population_stddev(scores_j)
              for each score s by j:
                  z = if stddev_j > 0 then (s.weighted_raw - mean_j) / stddev_j else 0
                  s.z_intermediate = z
          zmin = min over all scores' z_intermediate; zmax = max
          for each score s: s.normalized_score = round_half_up( (s.z_intermediate - zmin) / (zmax - zmin) * 100, 4 ) if zmax > zmin else 50.0
      else:  # RAW_RANK
          N_entries = count of distinct candidate entries in this round
          for each judge j: rank their LOCKED scores by weighted_raw DESC (ties share the average rank); write s.rank_among_judges_scores
          for each score s: s.normalized_score = round_half_up( (N_entries - s.rank_among_judges_scores) / (N_entries - 1) * 100, 4 ) if N_entries > 1 else 100.0
      # Entry composite in this round = mean of normalized_score across ACTIVE-panel judges, round_half_up to 4dp
    input_set: "all Score rows with status == LOCKED in this round whose judge's PanelAssignment.status == COMPLETED (i.e., was ACTIVE at close)"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: raw_rank
        when: "round.scoring_mode == RAW_RANK"
        difference: "uses rank-position normalization (N - rank)/(N - 1) * 100 instead of z-score min-max; produces different normalized values for identical raw inputs"
      - name: z_score
        when: "round.scoring_mode == Z_SCORE"
        difference: "uses per-judge mean/stddev z-score then min-max rescale across the round; identical raw inputs yield different normalized values than raw_rank"

  - name: final_composite
    trigger: "on FINAL ScoringRound (round_index == 3) NORMALIZED"
    algorithm: weighted_scoring
    formula: |
      # Weighted blend across rounds for entries reaching the FINAL round.
      # Base weights: R1 0.20, R2 0.30, R3 (FINAL) 0.50, applied to each round's entry composite
      # (mean of judge normalized_score in that round, 4dp).
      # Missing rounds (category ran fewer than 3): the missing rounds' weights redistribute
      # PROPORTIONALLY onto the rounds that exist. E.g. FINAL-only category: effective weight of
      # R3 = 0.50 / 0.50 = 1.0. R1+R3 only: R1 = 0.20/0.70, R3 = 0.50/0.70.
      present = [r for r in (1,2,3) if a non-VOIDED round with round_index r exists for the category]
      wsum = sum(W[r] for r in present)
      entry.final_composite_score = round_half_up( sum(W[r]/wsum * comp_r for r in present), 4 )
      # Rank: final_composite_score DESC; tie-break 1: FINAL-round composite DESC; tie-break 2: entry.created_at ASC
    input_set: "entries that advanced into the FINAL round; their per-round composites from the non-VOIDED rounds of the same category"
    constants:
      W_R1: 0.20
      W_R2: 0.30
      W_R3: 0.50
    precision: "4 decimal places, round_half_up"

  - name: judge_reliability
    trigger: "on PanelAssignment -> COMPLETED or REMOVED or RECUSED"
    algorithm: aggregation
    formula: |
      completed = count of judge's PanelAssignment with status == COMPLETED
      decided = completed + count(status in {REMOVED, RECUSED})
      judge.reliability_score_bp = if decided == 0 then 10000 else round_half_up(completed / decided * 10000, 0)
    input_set: "all PanelAssignment rows for the judge in terminal states {COMPLETED, REMOVED, RECUSED}"
    constants: {}
    precision: "integer basis points"

  - name: entrant_standing
    trigger: "on FeeInvoice due_at passage (clock sweep) and on payment settlement"
    algorithm: threshold
    formula: |
      overdue = exists FeeInvoice for entrant with status == ISSUED and current_clock > due_at
      if entrant.lifetime_disqualifications >= BARRED_THRESHOLD:
          entrant.standing = BARRED
      elif overdue and entrant.standing == GOOD:
          entrant.standing = DELINQUENT; entrant.delinquent_since = current_clock
      elif not overdue and entrant.standing == DELINQUENT:
          entrant.standing = GOOD; entrant.delinquent_since = null
    input_set: "all FeeInvoice rows linked to entries owned by the entrant"
    constants:
      BARRED_THRESHOLD: 3
    precision: "n/a (enum derivation)"

  - name: finalist_promotion_rank
    trigger: "on FinalistRecord NOTIFIED -> DECLINED"
    algorithm: aggregation
    formula: |
      candidates = entries in category with status == NON_FINALIST, ordered by
        final_composite_score DESC, then FINAL-round composite DESC, then created_at ASC
      if candidates empty: no promotion (slot stays vacant)
      else promote candidates[0]: entry.status := FINALIST; create FinalistRecord(notification_status=PENDING, announced_rank = vacated rank)
    input_set: "NON_FINALIST entries of the category with computed final_composite_score"
    constants: {}
    precision: "n/a"

  - name: withdrawal_refund
    trigger: "on Entry SUBMITTED/UNDER_REVIEW -> WITHDRAWN when the linked FeeInvoice.status == PAID"
    algorithm: threshold
    formula: |
      # Variant selection by season.refund_policy. Both variants consume identical inputs
      # (invoice.amount_cents, fee tier, clock) and produce different refunds.
      if season.refund_policy == FLAT_FEE:
          retained_cents = WITHDRAWAL_FEE_CENTS
          refund_cents = max(0, invoice.amount_cents - WITHDRAWAL_FEE_CENTS)
      else:  # EARLY_BIRD_FREE
          if invoice.paid_at < season.early_fee_ends_at:
              retained_cents = 0
              refund_cents = invoice.amount_cents            # full refund for early-bird payers
          else:
              retained_cents = WITHDRAWAL_FEE_CENTS * 2      # steeper late-cancellation penalty
              refund_cents = max(0, invoice.amount_cents - retained_cents)
      # INVARIANT: refund_cents + retained_cents == invoice.amount_cents (except when clamped at 0,
      # in which case retained_cents := invoice.amount_cents and refund_cents := 0)
      if refund_cents == 0: retained_cents = invoice.amount_cents
    input_set: "the withdrawn entry's PAID FeeInvoice, the entry, the parent season"
    constants:
      WITHDRAWAL_FEE_CENTS: 2500
    precision: "integer cents; no rounding"
    variants:
      - name: flat_fee
        when: "season.refund_policy == FLAT_FEE"
        difference: "retains a flat 2500-cent withdrawal fee regardless of payment timing"
      - name: early_bird_free
        when: "season.refund_policy == EARLY_BIRD_FREE"
        difference: "full refund when invoice.paid_at < early_fee_ends_at; otherwise retains 5000 cents — identical inputs yield a different refund than flat_fee"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /awards/_clock/set_current_utc"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Payload well-formedness: required fields present, types correct, enum members valid, datetime parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (season, category, entry, round, score, ...)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Body-referenced FK resources exist (entrant_id, judge_id, category_id, etc.)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PUT/PATCH endpoints with FK body fields"
  - priority: 6
    category: state
    check: "Target entity is in a terminal state (no outbound transitions exist)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints on entities with terminal states"
  - priority: 7
    category: state
    check: "Target entity in a state that permits the requested transition; for child-creating endpoints, the parent's state gate (e.g., Score create requires ScoringRound OPEN; Entry create requires season in {DRAFT, OPEN} and category PUBLISHED; PanelAssignment create requires round CONFIGURING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints; POST /awards/scoring-rounds/{id}/scores; POST /awards/categories/{category_id}/entries; POST /awards/scoring-rounds/{id}/panel-assignments"
  - priority: 8
    category: state
    check: "OCC expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /awards/scoring-rounds/{id}/panel-assignments, POST /awards/judges/{id}/conflict-declarations, POST /awards/scoring-rounds/{id}/scores"
  - priority: 9
    category: business_temporal
    check: "Clock-based gates: submission window (incl. late window), embargo lift, ack window, go-live lead time"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "submit, open/close season, embargo, go-live, announce, acknowledge"
  - priority: 10
    category: business_temporal
    check: "Eligibility window: entry.work_completed_at within [season.eligibility_window_start, season.eligibility_window_end)"
    error_id: ERR_ELIGIBILITY_WINDOW
    http_status: 422
    applies_to: "POST /awards/entries/{id}/submit"
  - priority: 11
    category: business_temporal
    check: "Ceremony interval overlap: within one season, Ceremony [starts_at, ends_at) half-open intervals of non-terminal ceremonies must not overlap; touching endpoints (a.ends_at == b.starts_at) are permitted"
    error_id: ERR_CEREMONY_OVERLAP
    http_status: 422
    applies_to: "POST /awards/seasons/{season_id}/ceremonies"
  - priority: 12
    category: business_temporal
    check: "ScoringRound window gap: within one category, [scheduled_window_start, scheduled_window_end] intervals of non-VOIDED rounds must be separated by a closed buffer of at least SCORING_ROUND_GAP_HOURS (12h) — i.e., for any two rounds the gap between the earlier end and the later start is >= 12h; mere non-overlap is insufficient"
    error_id: ERR_ROUND_WINDOW_TOO_CLOSE
    http_status: 422
    applies_to: "POST /awards/categories/{category_id}/scoring-rounds"
  - priority: 13
    category: business_safety
    check: "Conflict-of-interest bars: HARD conflict blocks panel confirm; judge barred from scoring an entry whose entrant they conflict with"
    error_id: ERR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /awards/panel-assignments/{id}/confirm, POST /awards/scoring-rounds/{id}/scores, POST /awards/scores/{id}/submit"
  - priority: 14
    category: business_safety
    check: "Segregation of duties: appeal decided_by identity must differ from the filing entrant's owning user id; a judge may not confirm an assignment proposed for a different judge id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /awards/appeals/{id}/take-under-review, POST /awards/appeals/{id}/uphold, POST /awards/appeals/{id}/deny, POST /awards/panel-assignments/{id}/confirm"
  - priority: 15
    category: business_constraint
    check: "Uniqueness: season.code globally unique; entrant.contact_email unique; judge.email unique; category.code unique within season; non-VOIDED round_index unique within category; ceremony rundown segment_no contiguous from 1"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST create endpoints"
  - priority: 16
    category: business_constraint
    check: "Structural constraints: rubric weights sum to 10000, panel_size >= 3, exactly one CHAIR, rundown covers categories uniquely, max_entries_per_entrant, min_materials met, criterion_scores complete and within [0, max_score], file_size_bytes <= 104857600"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "category publish, panel lock, entry submit, score create/submit, ceremony rehearse, material attach"
  - priority: 17
    category: business_fiscal
    check: "Fiscal gates: entrant.standing != BARRED to submit; invoice payable only by owning entrant; refund arithmetic retains WITHDRAWAL_FEE_CENTS (2500)"
    error_id: ERR_FISCAL_BLOCK
    http_status: 402
    applies_to: "entry submit, invoice pay, entry withdraw"
  - priority: 18
    category: business_referential
    check: "Panel completeness at lock: ACTIVE assignments >= category.panel_size and exactly one CHAIR"
    error_id: ERR_PANEL_INCOMPLETE
    http_status: 422
    applies_to: "POST /awards/scoring-rounds/{id}/lock-panel"
  - priority: 19
    category: business_referential
    check: "Complete ballot at close: every ACTIVE judge has a SUBMITTED or LOCKED score for every candidate entry"
    error_id: ERR_INCOMPLETE_BALLOT
    http_status: 422
    applies_to: "POST /awards/scoring-rounds/{id}/close"
  - priority: 20
    category: business_referential
    check: "Score authorship: the acting judge holds an ACTIVE PanelAssignment in the score's round and the score's entry is a candidate of that round"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "POST /awards/scoring-rounds/{id}/scores"
  - priority: 21
    category: business_referential
    check: "Aggregate integrity: no orphan finalists (entry must be FINALIST), announcement winner must hold final_rank == 1"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "finalist notify, announce"
  - priority: 22
    category: business_referential
    check: "Appeal cap: entry has fewer than season.max_appeals_per_entry appeals in non-terminal states {FILED, UNDER_REVIEW}"
    error_id: ERR_APPEAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /awards/entries/{entry_id}/appeals"
  - priority: 23
    category: business_referential
    check: "Embargo gate: Anonymous read of finalists/announcements/entry score fields before embargo_lifts_at while season.status in {FINALISTS_LOCKED, EMBARGOED} is denied"
    error_id: ERR_EMBARGO_ACTIVE
    http_status: 403
    applies_to: "GET /awards/categories/{id}/finalists, GET /awards/categories/{category_id}/announcements, GET /awards/entries/{id}"
  - priority: 24
    category: business_referential
    check: "Audit hash chain integrity: on audit-log read, each row's hash_chain_self must verify against hash_chain_prev; mismatch flips season.integrity_flag to COMPROMISED"
    error_id: ERR_HASH_CHAIN_BROKEN
    http_status: 409
    applies_to: "GET /awards/seasons/{season_id}/audit-logs"

endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: /awards/_clock/set_current_utc
    description: "Set the logical server clock (test-driving endpoint). Before any call, the clock reads the fixed default 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "run clock-sweep side effects: late-Draft withdrawal when crossing submission_closes_at + LATE_WINDOW_HOURS; DELINQUENT standing flip when crossing invoice due_at; FinalistRecord NOTIFIED auto-DECLINED when crossing notified_at + season.ack_window_hours; embargo_visible flip when crossing embargo_lifts_at"

  # --- Season ---
  - method: POST
    path: /awards/seasons
    description: "Create a season in DRAFT"
    roles: [ProgramAdmin]
    code: 201
    input: [code, title, submission_opens_at, early_fee_ends_at, submission_closes_at, eligibility_window_start, eligibility_window_end, "ceremony_scheduled_at?", "max_appeals_per_entry?", "refund_policy?", "ack_window_hours?", "go_live_lead_minutes?"]
    output: AwardSeason
    side_effects: []
  - method: GET
    path: /awards/seasons
    description: "List seasons"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, FulfillmentVendor, Anonymous]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AwardSeason[]
    side_effects: []
  - method: GET
    path: /awards/seasons/{id}
    description: "Get season by id"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, FulfillmentVendor, Anonymous]
    code: 200
    input: []
    output: AwardSeason
    side_effects: []
  - method: POST
    path: /awards/seasons/{id}/open
    description: "DRAFT -> OPEN"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["AuditLog append", "increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/close-submissions
    description: "OPEN -> SUBMISSION_CLOSED; sweeps late drafts"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["late-Draft sweep to WITHDRAWN", "recompute active_entries_count", "increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/begin-judging
    description: "SUBMISSION_CLOSED -> JUDGING"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["ELIGIBLE entries -> IN_JUDGING", "increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/lock-finalists
    description: "JUDGING -> FINALISTS_LOCKED; creates FinalistRecords"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["create FinalistRecord rows", "entry status fan-out FINALIST/NON_FINALIST", "FINAL rounds -> PUBLISHED", "increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/embargo
    description: "FINALISTS_LOCKED -> EMBARGOED with embargo_lifts_at"
    roles: [ProgramAdmin]
    code: 200
    input: [embargo_lifts_at]
    output: AwardSeason
    side_effects: ["set embargo_lifts_at", "increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/go-live
    description: "EMBARGOED -> CEREMONY_LIVE"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["Ceremony REHEARSAL -> LIVE", "embargo_visible flip if past lift", "increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/publish-results
    description: "CEREMONY_LIVE -> PUBLISHED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["all FinalistRecord.embargo_visible := true", "increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/archive
    description: "PUBLISHED -> ARCHIVED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["increments AwardSeason.version by 1"]
  - method: POST
    path: /awards/seasons/{id}/cancel
    description: "DRAFT/OPEN -> CANCELLED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardSeason
    side_effects: ["children entries -> WITHDRAWN", "ISSUED invoices -> VOIDED", "increments AwardSeason.version by 1"]

  # --- Category ---
  - method: POST
    path: /awards/seasons/{id}/categories
    description: "Create category under season"
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, "description?", "eligibility_rules_text?", "min_materials?", "max_entries_per_entrant?", early_fee_cents, standard_fee_cents, late_fee_cents, "panel_size?", "finalist_slots?", scoring_rubric]
    output: AwardCategory
    side_effects: []
  - method: GET
    path: /awards/seasons/{id}/categories
    description: "List categories of a season"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, FulfillmentVendor, Anonymous]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AwardCategory[]
    side_effects: []
  - method: GET
    path: /awards/categories/{id}
    description: "Get category"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, FulfillmentVendor, Anonymous]
    code: 200
    input: []
    output: AwardCategory
    side_effects: []
  - method: POST
    path: /awards/categories/{id}/publish
    description: "Category DRAFT/SUSPENDED -> PUBLISHED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardCategory
    side_effects: ["increments AwardCategory.version by 1"]
  - method: POST
    path: /awards/categories/{id}/suspend
    description: "Category PUBLISHED -> SUSPENDED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardCategory
    side_effects: ["DRAFT entries in category -> WITHDRAWN", "increments AwardCategory.version by 1"]
  - method: POST
    path: /awards/categories/{id}/retire
    description: "Category PUBLISHED -> RETIRED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: AwardCategory
    side_effects: ["increments AwardCategory.version by 1"]

  # --- Entrant ---
  - method: POST
    path: /awards/entrants
    description: "Register entrant"
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, contact_email, country_code]
    output: Entrant
    side_effects: []
  - method: GET
    path: /awards/entrants
    description: "List entrants"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["standing?", "limit?", "offset?"]
    output: Entrant[]
    side_effects: []
  - method: GET
    path: /awards/entrants/{id}
    description: "Get entrant"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: []
    output: Entrant
    side_effects: []
  - method: GET
    path: /awards/entrants/{id}/entries
    description: "List entries owned by entrant (reverse reachability Entry.entrant_id)"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Entry[]
    side_effects: []

  # --- Entry ---
  - method: POST
    path: /awards/categories/{id}/entries
    description: "Create entry in DRAFT"
    roles: [Entrant]
    code: 201
    input: [entrant_id, title, work_completed_at]
    output: Entry
    side_effects: []
  - method: GET
    path: /awards/categories/{id}/entries
    description: "List entries in category (reverse reachability Entry.category_id)"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["status?", "entrant_id?", "limit?", "offset?"]
    output: Entry[]
    side_effects: []
  - method: GET
    path: /awards/entries/{id}
    description: "Get entry; final_composite_score/final_rank fields are nulled for Anonymous callers unless embargo lifted"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, Anonymous]
    code: 200
    input: []
    output: Entry
    side_effects: []
  - method: POST
    path: /awards/entries/{id}/materials
    description: "Attach material to entry"
    roles: [Entrant]
    code: 201
    input: [material_type, uri, file_size_bytes, checksum_sha256]
    output: EntryMaterial
    side_effects: []
  - method: GET
    path: /awards/entries/{id}/materials
    description: "List materials of entry (reverse reachability EntryMaterial.entry_id)"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EntryMaterial[]
    side_effects: []
  - method: POST
    path: /awards/materials/{id}/accept
    description: "Material PENDING -> ACCEPTED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: EntryMaterial
    side_effects: []
  - method: POST
    path: /awards/materials/{id}/reject
    description: "Material PENDING -> REJECTED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: EntryMaterial
    side_effects: []
  - method: POST
    path: /awards/entries/{id}/submit
    description: "Entry DRAFT -> SUBMITTED; creates FeeInvoice via entry_fee"
    roles: [Entrant]
    code: 200
    input: []
    output: Entry
    side_effects: ["create FeeInvoice", "entry_fee calculation", "season.active_entries_count += 1", "increments Entry.version by 1"]
  - method: POST
    path: /awards/entries/{id}/waive-fee
    description: "Admin grants fee waiver while entry is DRAFT (pre-submit); on submit the entry goes straight to UNDER_REVIEW with payment_status WAIVED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Entry
    side_effects: ["marks entry for waiver", "increments Entry.version by 1"]
  - method: POST
    path: /awards/entries/{id}/mark-eligible
    description: "UNDER_REVIEW -> ELIGIBLE"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Entry
    side_effects: ["increments Entry.version by 1"]
  - method: POST
    path: /awards/entries/{id}/mark-ineligible
    description: "UNDER_REVIEW -> INELIGIBLE; refunds paid invoice"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Entry
    side_effects: ["refund cascade", "season.active_entries_count -= 1", "increments Entry.version by 1"]
  - method: POST
    path: /awards/entries/{id}/request-recheck
    description: "INELIGIBLE -> UNDER_REVIEW revision loop"
    roles: [Entrant]
    code: 200
    input: []
    output: Entry
    side_effects: ["revision_count += 1", "increments Entry.version by 1"]
  - method: POST
    path: /awards/entries/{id}/withdraw
    description: "DRAFT/SUBMITTED/UNDER_REVIEW -> WITHDRAWN with fee consequences"
    roles: [Entrant]
    code: 200
    input: []
    output: Entry
    side_effects: ["invoice void/refund", "season.active_entries_count decrement when applicable", "increments Entry.version by 1"]

  # --- Invoice ---
  - method: GET
    path: /awards/entries/{id}/invoices
    description: "List invoices for entry (reverse reachability FeeInvoice.entry_id)"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []
  - method: GET
    path: /awards/invoices/{id}
    description: "Get invoice"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []
  - method: POST
    path: /awards/invoices/{id}/pay
    description: "ISSUED -> PAID; cascades entry to UNDER_REVIEW"
    roles: [Entrant]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["entry.payment_status := PAID", "entry SUBMITTED -> UNDER_REVIEW", "standing repair if delinquent", "increments FeeInvoice.version by 1"]

  # --- Judge ---
  - method: POST
    path: /awards/judges
    description: "Invite judge (creates INVITED)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, "expertise_tags?", "affiliated_entrant_ids?"]
    output: Judge
    side_effects: []
  - method: GET
    path: /awards/judges
    description: "List judges"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Judge[]
    side_effects: []
  - method: GET
    path: /awards/judges/{id}
    description: "Get judge"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: []
    output: Judge
    side_effects: []
  - method: POST
    path: /awards/judges/{id}/accept
    description: "INVITED -> ACCEPTED; seeds conflict declarations"
    roles: [Judge]
    code: 200
    input: []
    output: Judge
    side_effects: ["auto-seed ConflictDeclarations from affiliated_entrant_ids", "increments Judge.version by 1"]
  - method: POST
    path: /awards/judges/{id}/decline
    description: "INVITED -> DECLINED"
    roles: [Judge]
    code: 200
    input: []
    output: Judge
    side_effects: ["increments Judge.version by 1"]
  - method: POST
    path: /awards/judges/{id}/activate
    description: "ACCEPTED/SUSPENDED -> ACTIVE"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Judge
    side_effects: ["increments Judge.version by 1"]
  - method: POST
    path: /awards/judges/{id}/suspend
    description: "ACTIVE -> SUSPENDED; removes panel assignments"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Judge
    side_effects: ["PanelAssignment PROPOSED/ACTIVE -> REMOVED", "round demotion if under panel_size", "increments Judge.version by 1"]
  - method: POST
    path: /awards/judges/{id}/retire
    description: "ACTIVE/SUSPENDED -> RETIRED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Judge
    side_effects: ["increments Judge.version by 1"]

  # --- ConflictDeclaration ---
  - method: POST
    path: /awards/judges/{id}/conflict-declarations
    description: "File conflict declaration (OCC on judge.version)"
    roles: [Judge, ProgramAdmin]
    code: 201
    input: [season_id, entrant_id, "category_id?", conflict_type, severity, "note?", expected_judge_version]
    output: ConflictDeclaration
    side_effects: ["increments Judge.version by 1"]
  - method: GET
    path: /awards/judges/{id}/conflict-declarations
    description: "List declarations by judge (reverse reachability ConflictDeclaration.judge_id)"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []
  - method: GET
    path: /awards/seasons/{id}/conflict-declarations
    description: "List declarations by season (reverse reachability ConflictDeclaration.season_id)"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["judge_id?", "entrant_id?", "limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []
  - method: GET
    path: /awards/entrants/{id}/conflict-declarations
    description: "List declarations against an entrant (reverse reachability ConflictDeclaration.entrant_id)"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []
  - method: GET
    path: /awards/categories/{id}/conflict-declarations
    description: "List declarations scoped to a category (reverse reachability ConflictDeclaration.category_id)"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []
  - method: POST
    path: /awards/conflict-declarations/{id}/acknowledge
    description: "DECLARED -> ACKNOWLEDGED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ConflictDeclaration
    side_effects: []
  - method: POST
    path: /awards/conflict-declarations/{id}/rescind
    description: "DECLARED -> RESCINDED"
    roles: [Judge, ProgramAdmin]
    code: 200
    input: []
    output: ConflictDeclaration
    side_effects: []

  # --- ScoringRound ---
  - method: POST
    path: /awards/categories/{id}/scoring-rounds
    description: "Create scoring round"
    roles: [ProgramAdmin]
    code: 201
    input: [round_index, "advance_count?", scoring_mode, scheduled_window_start, scheduled_window_end]
    output: ScoringRound
    side_effects: []
  - method: GET
    path: /awards/categories/{id}/scoring-rounds
    description: "List rounds of category (reverse reachability ScoringRound.category_id)"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScoringRound[]
    side_effects: []
  - method: GET
    path: /awards/scoring-rounds/{id}
    description: "Get round"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: []
    output: ScoringRound
    side_effects: []
  - method: POST
    path: /awards/scoring-rounds/{id}/panel-assignments
    description: "Propose panel assignment (OCC on scoring_round.version)"
    roles: [ProgramAdmin]
    code: 201
    input: [judge_id, role, expected_scoring_round_version]
    output: PanelAssignment
    side_effects: ["increments ScoringRound.version by 1"]
  - method: GET
    path: /awards/scoring-rounds/{id}/panel-assignments
    description: "List assignments of round (reverse reachability PanelAssignment.scoring_round_id)"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PanelAssignment[]
    side_effects: []
  - method: GET
    path: /awards/judges/{id}/panel-assignments
    description: "List assignments of judge (reverse reachability PanelAssignment.judge_id)"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PanelAssignment[]
    side_effects: []
  - method: GET
    path: /awards/categories/{id}/panel-assignments
    description: "List assignments by category (reverse reachability PanelAssignment.category_id)"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PanelAssignment[]
    side_effects: []
  - method: POST
    path: /awards/panel-assignments/{id}/confirm
    description: "PROPOSED -> ACTIVE"
    roles: [Judge]
    code: 200
    input: []
    output: PanelAssignment
    side_effects: ["increments PanelAssignment.version by 1"]
  - method: POST
    path: /awards/panel-assignments/{id}/recuse
    description: "ACTIVE -> RECUSED"
    roles: [Judge]
    code: 200
    input: []
    output: PanelAssignment
    side_effects: ["draft scores VOIDED", "round demotion if under panel_size", "increments PanelAssignment.version by 1"]
  - method: POST
    path: /awards/panel-assignments/{id}/remove
    description: "ACTIVE -> REMOVED (admin)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: PanelAssignment
    side_effects: ["draft scores VOIDED", "round demotion if under panel_size", "increments PanelAssignment.version by 1"]
  - method: POST
    path: /awards/scoring-rounds/{id}/lock-panel
    description: "CONFIGURING -> PANEL_LOCKED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ScoringRound
    side_effects: ["increments ScoringRound.version by 1"]
  - method: POST
    path: /awards/scoring-rounds/{id}/open
    description: "PANEL_LOCKED -> OPEN"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ScoringRound
    side_effects: ["increments ScoringRound.version by 1"]
  - method: POST
    path: /awards/scoring-rounds/{id}/close
    description: "OPEN -> CLOSED; locks submitted scores"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ScoringRound
    side_effects: ["scores SUBMITTED -> LOCKED", "increments ScoringRound.version by 1"]
  - method: POST
    path: /awards/scoring-rounds/{id}/normalize
    description: "CLOSED -> NORMALIZED; runs score_normalization and final_composite on FINAL"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ScoringRound
    side_effects: ["score_normalization", "freeze normalization_snapshot", "advancement marking or final_composite", "assignments -> COMPLETED", "judge_reliability recompute", "increments ScoringRound.version by 1"]

  # --- Score ---
  - method: POST
    path: /awards/scoring-rounds/{id}/scores
    description: "Create DRAFT score (OCC on scoring_round.version)"
    roles: [Judge]
    code: 201
    input: [entry_id, judge_id, criterion_scores, expected_scoring_round_version]
    output: Score
    side_effects: ["increments ScoringRound.version by 1"]
  - method: GET
    path: /awards/scoring-rounds/{id}/scores
    description: "List scores of round (reverse reachability Score.scoring_round_id)"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: ["judge_id?", "entry_id?", "status?", "limit?", "offset?"]
    output: Score[]
    side_effects: []
  - method: GET
    path: /awards/entries/{id}/scores
    description: "List scores of entry (reverse reachability Score.entry_id)"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: ["scoring_round_id?", "limit?", "offset?"]
    output: Score[]
    side_effects: []
  - method: GET
    path: /awards/judges/{id}/scores
    description: "List scores by judge (reverse reachability Score.judge_id)"
    roles: [ProgramAdmin, Auditor, Judge]
    code: 200
    input: ["scoring_round_id?", "limit?", "offset?"]
    output: Score[]
    side_effects: []
  - method: POST
    path: /awards/scores/{id}/submit
    description: "Score DRAFT -> SUBMITTED; computes weighted_raw"
    roles: [Judge]
    code: 200
    input: []
    output: Score
    side_effects: ["composite_raw calculation"]

  # --- Finalist ---
  - method: GET
    path: /awards/categories/{id}/finalists
    description: "List finalist records of category (reverse reachability FinalistRecord.category_id); Anonymous callers see only records with embargo_visible == true"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, Anonymous]
    code: 200
    input: ["notification_status?", "limit?", "offset?"]
    output: FinalistRecord[]
    side_effects: []
  - method: GET
    path: /awards/entries/{id}/finalist-record
    description: "Get finalist record for entry (reverse reachability FinalistRecord.entry_id; array of 0..1)"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: []
    output: FinalistRecord[]
    side_effects: []
  - method: GET
    path: /awards/entries/{id}/announcements
    description: "List announcements whose winner_entry_id is this entry (reverse reachability WinnerAnnouncement.winner_entry_id; array of 0..N)"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: WinnerAnnouncement[]
    side_effects: []
  - method: POST
    path: /awards/finalists/{id}/notify
    description: "PENDING -> NOTIFIED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FinalistRecord
    side_effects: ["increments FinalistRecord.version by 1"]
  - method: POST
    path: /awards/finalists/{id}/acknowledge
    description: "NOTIFIED -> ACKNOWLEDGED"
    roles: [Entrant]
    code: 200
    input: []
    output: FinalistRecord
    side_effects: ["increments FinalistRecord.version by 1"]
  - method: POST
    path: /awards/finalists/{id}/decline
    description: "NOTIFIED -> DECLINED; promotes next entry"
    roles: [Entrant]
    code: 200
    input: []
    output: FinalistRecord
    side_effects: ["finalist_promotion_rank cascade", "increments FinalistRecord.version by 1"]

  # --- Ceremony ---
  - method: POST
    path: /awards/seasons/{id}/ceremonies
    description: "Create ceremony"
    roles: [ProgramAdmin]
    code: 201
    input: [venue_name, starts_at, ends_at, rundown]
    output: Ceremony
    side_effects: []
  - method: GET
    path: /awards/seasons/{id}/ceremonies
    description: "List ceremonies of season (reverse reachability Ceremony.season_id)"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, Anonymous]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Ceremony[]
    side_effects: []
  - method: GET
    path: /awards/ceremonies/{id}
    description: "Get ceremony by id"
    roles: [ProgramAdmin, Auditor, Entrant, Judge, Anonymous]
    code: 200
    input: []
    output: Ceremony
    side_effects: []
  - method: POST
    path: /awards/ceremonies/{id}/rehearse
    description: "PLANNING -> REHEARSAL"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Ceremony
    side_effects: ["increments Ceremony.version by 1"]
  - method: POST
    path: /awards/ceremonies/{id}/conclude
    description: "LIVE -> CONCLUDED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Ceremony
    side_effects: ["increments Ceremony.version by 1"]
  - method: POST
    path: /awards/ceremonies/{id}/abort
    description: "PLANNING/REHEARSAL -> ABORTED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Ceremony
    side_effects: ["increments Ceremony.version by 1"]

  # --- WinnerAnnouncement ---
  - method: POST
    path: /awards/categories/{id}/announcements
    description: "Stage winner announcement for a category at a ceremony"
    roles: [ProgramAdmin]
    code: 201
    input: [ceremony_id]
    output: WinnerAnnouncement
  - method: GET
    path: /awards/announcements/{id}
    description: "Get announcement by id"
    roles: [ProgramAdmin, Auditor, Anonymous]
    code: 200
    input: []
    output: WinnerAnnouncement
    side_effects: []
    side_effects: []
  - method: GET
    path: /awards/categories/{id}/announcements
    description: "List announcements of category (reverse reachability WinnerAnnouncement.category_id)"
    roles: [ProgramAdmin, Auditor, Anonymous]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WinnerAnnouncement[]
    side_effects: []
  - method: GET
    path: /awards/ceremonies/{id}/announcements
    description: "List announcements at ceremony (reverse reachability WinnerAnnouncement.ceremony_id)"
    roles: [ProgramAdmin, Auditor, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: WinnerAnnouncement[]
    side_effects: []
  - method: POST
    path: /awards/announcements/{id}/announce
    description: "STAGED/RESTAGED -> ANNOUNCED; cascades winner/non-winner + fulfillment orders"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: WinnerAnnouncement
    side_effects: ["winner_entry_id computed", "entry status fan-out", "create FulfillmentOrders", "increments WinnerAnnouncement.version by 1"]
  - method: POST
    path: /awards/announcements/{id}/retract
    description: "ANNOUNCED -> RETRACTED (auditor, on upheld appeal)"
    roles: [Auditor]
    code: 200
    input: [retraction_reason]
    output: WinnerAnnouncement
    side_effects: ["winner entry disposition", "TROPHY order cancellation", "season.integrity_flag := UNDER_REVIEW", "increments WinnerAnnouncement.version by 1"]
  - method: POST
    path: /awards/announcements/{id}/restage
    description: "RETRACTED -> RESTAGED after replacement round NORMALIZED"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: WinnerAnnouncement
    side_effects: ["winner_entry_id recomputed", "increments WinnerAnnouncement.version by 1"]

  # --- Fulfillment ---
  - method: GET
    path: /awards/seasons/{id}/fulfillment-orders
    description: "List fulfillment orders of season (reverse reachability FulfillmentOrder.season_id)"
    roles: [ProgramAdmin, FulfillmentVendor]
    code: 200
    input: ["status?", "item_type?", "limit?", "offset?"]
    output: FulfillmentOrder[]
    side_effects: []
  - method: GET
    path: /awards/entries/{id}/fulfillment-orders
    description: "List fulfillment orders of entry (reverse reachability FulfillmentOrder.entry_id)"
    roles: [ProgramAdmin, Entrant, FulfillmentVendor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FulfillmentOrder[]
    side_effects: []
  - method: GET
    path: /awards/announcements/{id}/fulfillment-orders
    description: "List orders authorized by announcement (reverse reachability FulfillmentOrder.announcement_id)"
    roles: [ProgramAdmin, FulfillmentVendor]
    code: 200
    input: ["limit?", "offset?"]
    output: FulfillmentOrder[]
    side_effects: []
  - method: POST
    path: /awards/fulfillment-orders/{id}/queue
    description: "DRAFT -> QUEUED"
    roles: [FulfillmentVendor]
    code: 200
    input: ["engraving_text?", "quantity?"]
    output: FulfillmentOrder
    side_effects: ["vendor_reference assigned", "increments FulfillmentOrder.version by 1"]
  - method: POST
    path: /awards/fulfillment-orders/{id}/start-production
    description: "QUEUED -> IN_PRODUCTION"
    roles: [FulfillmentVendor]
    code: 200
    input: []
    output: FulfillmentOrder
    side_effects: ["increments FulfillmentOrder.version by 1"]
  - method: POST
    path: /awards/fulfillment-orders/{id}/ship
    description: "IN_PRODUCTION -> SHIPPED"
    roles: [FulfillmentVendor]
    code: 200
    input: []
    output: FulfillmentOrder
    side_effects: ["increments FulfillmentOrder.version by 1"]
  - method: POST
    path: /awards/fulfillment-orders/{id}/deliver
    description: "SHIPPED -> DELIVERED"
    roles: [FulfillmentVendor]
    code: 200
    input: []
    output: FulfillmentOrder
    side_effects: ["increments FulfillmentOrder.version by 1"]

  # --- Appeal ---
  - method: POST
    path: /awards/entries/{id}/appeals
    description: "File appeal"
    roles: [Entrant]
    code: 201
    input: [filed_by_entrant_id, grounds, narrative]
    output: Appeal
    side_effects: []
  - method: GET
    path: /awards/entries/{id}/appeals
    description: "List appeals of entry (reverse reachability Appeal.entry_id)"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: GET
    path: /awards/entrants/{id}/appeals
    description: "List appeals filed by entrant (reverse reachability Appeal.filed_by_entrant_id)"
    roles: [ProgramAdmin, Auditor, Entrant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: /awards/appeals/{id}/take-under-review
    description: "FILED -> UNDER_REVIEW"
    roles: [Auditor]
    code: 200
    input: []
    output: Appeal
    side_effects: ["season.integrity_flag := UNDER_REVIEW", "increments Appeal.version by 1"]
  - method: POST
    path: /awards/appeals/{id}/uphold
    description: "UNDER_REVIEW -> UPHELD with remedy; cascades rescore"
    roles: [Auditor]
    code: 200
    input: [remedy]
    output: Appeal
    side_effects: ["round void + clone on RESCORE", "reinstate cascade on REINSTATE", "increments Appeal.version by 1"]
  - method: POST
    path: /awards/appeals/{id}/deny
    description: "UNDER_REVIEW -> DENIED"
    roles: [Auditor]
    code: 200
    input: []
    output: Appeal
    side_effects: ["integrity_flag cleanup if last open appeal", "increments Appeal.version by 1"]
  - method: POST
    path: /awards/appeals/{id}/withdraw
    description: "FILED -> WITHDRAWN by filing entrant"
    roles: [Entrant]
    code: 200
    input: []
    output: Appeal
    side_effects: ["increments Appeal.version by 1"]

  # --- Audit ---
  - method: GET
    path: /awards/seasons/{id}/audit-logs
    description: "List audit log rows of season (reverse reachability AuditLog.season_id); verifies hash chain on read"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["target_type?", "target_id?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for this endpoint (RBAC matrix)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource id does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced FK id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity in a state that forbids the requested transition"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Target entity already in a terminal state; no further transitions possible"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version mismatch on guarded write endpoint"
  - id: ERR_OUTSIDE_WINDOW
    http: 422
    condition: "Clock-based gate violated: submission closed, eligibility window missed, late window expired, embargo not lifted, ack window expired, go-live too early"
  - id: ERR_ELIGIBILITY_WINDOW
    http: 422
    condition: "work_completed_at not within [eligibility_window_start, eligibility_window_end)"
  - id: ERR_CONFLICT_OF_INTEREST
    http: 422
    condition: "HARD conflict bars panel confirm; judge attempts to score a conflicted entry; auditor attempts to decide an appeal filed by their own entrant account"
  - id: ERR_CONSTRAINT_VIOLATION
    http: 422
    condition: "Structural rule broken: rubric weights != 10000, panel_size < 3, duplicate CHAIR, incomplete criterion_scores, rundown gap/overlap, max_entries_per_entrant exceeded, min_materials unmet, file too large"
  - id: ERR_PANEL_INCOMPLETE
    http: 422
    condition: "lock-panel attempted with fewer ACTIVE assignments than category.panel_size, or no CHAIR"
  - id: ERR_INCOMPLETE_BALLOT
    http: 422
    condition: "close attempted while some ACTIVE judge lacks a SUBMITTED/LOCKED score for some candidate entry"
  - id: ERR_FISCAL_BLOCK
    http: 402
    condition: "Entrant BARRED from new submissions; non-owner payment attempt; invoice not in payable state"
  - id: ERR_REFERENTIAL_INTEGRITY
    http: 422
    condition: "Aggregate integrity violation: finalist for non-FINALIST entry, announcement without rank-1 holder, appeal cap exceeded, embargoed record requested publicly"
  - id: ERR_APPEAL_CAP_EXCEEDED
    http: 422
    condition: "Entry already has season.max_appeals_per_entry appeals in non-WITHDRAWN states"
  - id: ERR_EMBARGO_ACTIVE
    http: 403
    condition: "Anonymous or non-privileged read of embargo-protected result fields before embargo_lifts_at"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same identity attempted both filing and deciding an appeal, or ProgramAdmin attempted to confirm own panel assignment"
  - id: ERR_HASH_CHAIN_BROKEN
    http: 409
    condition: "Audit log hash chain verification failed on read; season flagged COMPROMISED"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed payload: missing required field, wrong type, invalid enum, bad datetime format"
  - id: ERR_CEREMONY_OVERLAP
    http: 422
    condition: "Ceremony [starts_at, ends_at) overlaps another non-terminal Ceremony of the same season; adjacency (touching endpoints) is allowed"
  - id: ERR_ROUND_WINDOW_TOO_CLOSE
    http: 422
    condition: "ScoringRound scheduled window violates the 12h minimum gap against another non-VOIDED round of the same category"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: season code, entrant email, judge email, category code within season, round_index within category (among non-VOIDED rounds)"

roles:
  - name: ProgramAdmin
    description: "Awards program staff; configures seasons/categories/rounds, rules on eligibility, locks panels and finalists, runs ceremony"
    identity: opaque
    exclusive_operations:
      - "season lifecycle transitions (open, close-submissions, begin-judging, lock-finalists, embargo, go-live, publish-results, archive, cancel)"
      - "category publish/suspend/retire"
      - "entrant registration"
      - "material accept/reject"
      - "entry mark-eligible/mark-ineligible, waive-fee"
      - "judge invite/activate/suspend/retire"
      - "panel-assignment propose/remove, round lock/open/close/normalize"
      - "finalist notify"
      - "ceremony create/rehearse/conclude/abort"
      - "announcement stage/announce/restage"
      - "clock set"
    shared_operations:
      - "read any entity"
      - "conflict-declaration file (on behalf of a judge) and acknowledge/rescind"
  - name: Entrant
    description: "Submitting organization; owns entries, materials, invoices, finalist acknowledgements, appeals"
    identity: "entity_backed:Entrant"
    exclusive_operations:
      - "entry create/submit/withdraw/request-recheck on own entries"
      - "material attach on own entries"
      - "invoice pay on own invoices"
      - "finalist acknowledge/decline on own records"
      - "appeal file/withdraw on own entries"
    shared_operations:
      - "read own entries, materials, invoices, appeals, finalist records"
      - "read seasons/categories/public results"
  - name: Judge
    description: "Scoring panelist; declares conflicts, confirms/recuses assignments, submits scores"
    identity: "entity_backed:Judge"
    exclusive_operations:
      - "judge accept/decline (own invitation)"
      - "panel-assignment confirm/recuse (own assignments)"
      - "score create/submit (own ballots)"
    shared_operations:
      - "read own declarations, assignments, scores"
      - "read seasons/categories/rounds"
  - name: Auditor
    description: "Independent integrity officer; reviews appeals, retracts announcements, reads audit logs"
    identity: opaque
    exclusive_operations:
      - "appeal take-under-review/uphold/deny"
      - "announcement retract"
      - "audit-log read with hash-chain verification"
    shared_operations:
      - "read any entity"
  - name: FulfillmentVendor
    description: "Trophy/certificate producer; advances fulfillment orders through production pipeline"
    identity: opaque
    exclusive_operations:
      - "fulfillment-order queue/start-production/ship/deliver"
    shared_operations:
      - "read fulfillment orders, seasons, ceremonies"
  - name: Anonymous
    description: "Unauthenticated public caller; reads published, embargo-lifted results only"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "read seasons/categories/ceremonies/announcements/finalists (embargo-gated fields suppressed)"
