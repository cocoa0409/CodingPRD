          PointLot carries TWO INDEPENDENT state dimensions on one row and
          neither gates the other: after the trigger, lot A is
          FULLY_REDEEMED + SETTLED, lot C is OUTSTANDING + SETTLED and lot B is
          OUTSTANDING + NOT_APPLICABLE - three distinct combined states, proving
