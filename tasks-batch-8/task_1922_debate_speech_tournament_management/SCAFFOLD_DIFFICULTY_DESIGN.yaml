      - name: late_fee_per_entry_rounding_order
        grounds:
          - calculations.entry_fee_total
          - calculations.school_invoice_total
          - entities.Entry.fields.fee_charged_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the 15% late surcharge is rounded
          per entry (round_half_up(1999 * 1.15) = 2299) and then summed (7 x 2299 = 16093);
          summing bases first and rounding once would give round(13993 * 1.15) = 16092.
          The scaffold pins per-entry-round-then-sum, so the invoice must read 16093, not 16092.
        test_recipe:
          setup:
            - "Tournament with entry_fee_cents 1999, late_fee_starts_at 2026-08-03T00:00:00Z, late_fee_surcharge_pct 0.15; division CX (cap 8); school Alpha; registration open; logical clock advanced to 2026-08-04 (after the late-fee start)."
