- section: cross_cutting_complexity_layers
  instances:
  - name: occ_event_patch_stale_version_rejected
    claim_type: occ_stale_version
    grounds:
    - concurrency_rules[event-patch-stale-version]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'OCC on Event.version: a PATCH carrying the version observed before another successful PATCH is rejected 412 ERR_STALE_VERSION; the fresh-version PATCH succeeds.'
    test_recipe:
      setup:
      - Canonical event in PLANNING; client observed version ${ev_v} at creation
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
