            - "Call 1 also proves authoring and SUBMITTING by the same user is legal - only the decision is walled off"
            - "Call 2: HTTP 200 from the SAME ROLE but a different user: state == 'APPROVED', decided_by_user_id == 'mgr-2', created_by_user_id still 'mgr-1', Employee.${e1_id}.current_eligibility_class == 'HYBRID' and required_days for a T-A week is now 3"
