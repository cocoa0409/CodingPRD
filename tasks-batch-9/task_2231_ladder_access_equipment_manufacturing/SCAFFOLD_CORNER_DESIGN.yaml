  instances:
  - name: duplicate_model_code_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=57]
    - errors[ERR_DUPLICATE_KEY]
    distinguishing_aspect: model_code is globally unique, so a second product reusing FG-EXT-24-IA is 409 even though its retail_sku differs — uniqueness is on the model code alone.
    test_recipe:
      setup:
      - Product FG-EXT-24-IA already exists.
      - The logical clock is 2026-08-01T00:00:00Z.
      setup_api_calls:
