  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_subscription_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[subscription-plan-change-occ]"
        distinguishing_aspect: "Each successful mutation on Subscription increments version by 1."
        test_recipe:
          setup: ["Subscription ACTIVE"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "occ2@x.com", full_name: "OCC2", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
