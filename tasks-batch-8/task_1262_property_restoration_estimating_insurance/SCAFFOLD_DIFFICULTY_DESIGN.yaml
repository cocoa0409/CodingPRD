# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Property Restoration Estimating & Insurance Repair
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via the listed setup_api_calls.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_rcv_acv_vs_final_invoice
        grounds:
          - calculations.rcv_acv_totals
          - calculations.line_extended_pricing
          - calculations.overhead_profit
          - calculations.depreciation_recovery
          - entities.EstimateLine.fields.qty_actual
        distinguishing_aspect: |
          Same approved scope priced twice: the provisional variant (planned qty,
          used at approval) yields grand_total 5,876,000 while the final variant
          (qty_actual override on one line, used at invoice creation) yields
          5,684,000, and the depreciation-recovery payment is capped at 608,000
          instead of the 800,000 projected at approval — entity domain: Estimate/Invoice money.
        test_recipe:
          setup:
            - "Carrier (tax 0.07, O&P 10%/10% min 3 trades) with entries P1 DEMOLITION/LABOR/200c dep 0.10 no-tax O&P-eligible, P2 DRYWALL/MATERIAL/150c dep 0.20 taxable O&P-eligible, P3 PAINT/MATERIAL/120c dep 0.25 taxable O&P-eligible, all effective 2026-01-01..2027-01-01"
            - "Policy: coverage_a 100,000,000, FLAT deductible 100,000, recoverable_depreciation true, ordinance 0.10/250,000, period 2026"
            - "Claim WATER date_of_loss 2026-03-10 driven INTAKE->ASSESSING->(completed inspection)->ESTIMATING"
            - "INITIAL estimate approved with L1=P1 qty 10000, L2=P2 qty 10000, L3=P3 qty 10000; claim AUTHORIZED via signed direct-pay WA; ACV advance 4,976,000 CLEARED; claim IN_PROGRESS"
            - "qty_actual recorded: L2 actual 9000 (others unrecorded => planned)"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07, overhead_rate: 0.10, profit_rate: 0.10, o_and_p_min_trades: 3, negotiation_response_days: 7 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "WTR-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "SF", unit_price_cents: 200, tax_applicable: false, o_and_p_eligible: true, default_depreciation_pct: 0.10, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "DRY-SHEET", trade: "DRYWALL", kind: "MATERIAL", unit: "SF", unit_price_cents: 150, tax_applicable: true, o_and_p_eligible: true, default_depreciation_pct: 0.20, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "PNT-WALL", trade: "PAINT", kind: "MATERIAL", unit: "SF", unit_price_cents: 120, tax_applicable: true, o_and_p_eligible: true, default_depreciation_pct: 0.25, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p3: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, ordinance_coverage_pct: 0.10, ordinance_flat_cap_cents: 250000, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-1", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "LOSS_OVERVIEW", file_ref: "f1.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "f2.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "MOISTURE_PROOF", file_ref: "f3.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/readings", payload: { area: "kitchen", material: "drywall", reading_value: 13, dry_standard: 12, recorded_at: "2026-05-02T09:10:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 10000 }, as: Estimator, captures: { l1: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p2}", qty: 10000 }, as: Estimator, captures: { l2: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p3}", qty: 10000 }, as: Estimator, captures: { l3: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/submit", payload: {}, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/approve", payload: {}, as: Adjuster }
            - { call: "POST /v1/claims/${cl_id}/work-authorizations", payload: { direct_pay_assignment: true, deductible_acknowledged: true }, as: ContractorAdmin, captures: { wa_id: $.data.id } }
            - { call: "POST /v1/work-authorizations/${wa_id}/sign", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /v1/claims/${cl_id}/payments", payload: {}, as: ContractorAdmin, captures: { adv_id: $.data.0.id } }
            - { call: "POST /v1/payments/${adv_id}/approve", payload: {}, as: Adjuster }
            - { call: "POST /v1/payments/${adv_id}/issue", payload: {}, as: Adjuster }
            - { call: "POST /v1/payments/${adv_id}/clear", payload: {}, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/start-work", payload: {}, as: ContractorAdmin }
            - { call: "POST /v1/estimates/${est_id}/record-actuals", payload: { entries: [ { estimate_line_id: "${l2}", qty_actual: 9000 } ] }, as: Estimator }
          trigger:
            - { call: "POST /v1/claims/${cl_id}/complete-work", payload: {}, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/invoices", payload: {}, as: ContractorAdmin, captures: { inv_id: $.data.id, inv_total: $.data.total_cents } }
            - { call: "POST /v1/invoices/${inv_id}/issue", payload: {}, as: ContractorAdmin }
            - { call: "GET /v1/claims/${cl_id}/payments", payload: {}, as: ContractorAdmin, captures: { rec_amt: $.data.1.amount_cents, rec_type: $.data.1.type } }
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { est_grand: $.data.grand_total_cents, est_status: $.data.status } }
          assert:
            - "Estimate.${est_id}.grand_total_cents == 5876000  # provisional variant: 4,700,000 RCV + 470,000 OH + 517,000 profit + 189,000 tax"
            - "Estimate.${est_id}.status == LOCKED  # invoice creation locks approved estimates"
            - "Invoice.${inv_id}.total_cents == 5684000  # final variant: L2 at 9000 -> RCV 4,550,000 + OH 455,000 + profit 500,500 + tax 178,500"
            - "Invoice.${inv_id}.total_cents != Estimate.${est_id}.grand_total_cents  # the two variants diverge for identical approved scope"
            - "captured rec_type == DEPRECIATION_RECOVERY and rec_amt == 608000  # min(800,000 recoverable, 5,684,000 - 4,976,000 advance - 100,000 deductible) = 608,000, not the 800,000 projected at approval"
      - name: drying_days_mean_vs_worst_reading
        grounds:
          - calculations.drying_days
          - entities.Inspection.fields.drying_days_worst_variant
          - entities.Inspection.fields.drying_days_mean_variant
        distinguishing_aspect: |
          Same moisture readings classified two sanctioned ways: worst-reading
          governs -> 3 days (max exceedance 16 in the 8..20 band), area-weighted
          mean -> 2 days (mean 13 in the 8..20 band); both persist on the
          Inspection — entity domain: Inspection assessment, not money.
        test_recipe:
          setup:
            - "Carrier/policy/claim WATER as in the shared bootstrap; inspection with 3 photos and two readings on (kitchen, drywall): 28 and 22 against dry_standard 12"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Pat Homeowner", email: "pat@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 100000000, deductible_type: "FLAT", flat_deductible_cents: 100000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "WATER", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-1", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "MOISTURE_PROOF", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/readings", payload: { area: "kitchen", material: "drywall", reading_value: 28, dry_standard: 12, recorded_at: "2026-05-02T09:10:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/readings", payload: { area: "kitchen", material: "drywall", reading_value: 22, dry_standard: 12, recorded_at: "2026-05-02T09:11:00Z" }, as: FieldTechnician }
          trigger:
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician, captures: { worst: $.data.drying_days_worst_variant, mean: $.data.drying_days_mean_variant } }
          assert:
            - "Inspection.${insp_id}.drying_days_worst_variant == 3  # max exceedance 16 -> band (8,20] -> 3 days"
            - "Inspection.${insp_id}.drying_days_mean_variant == 2   # mean exceedance 13 -> band (8,20] -> 2 days"
            - "Inspection.${insp_id}.drying_days_worst_variant != Inspection.${insp_id}.drying_days_mean_variant"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_then_sum_beats_sum_then_round
        grounds:
          - calculations.line_extended_pricing
          - entities.EstimateLine.fields.extended_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum, so
          three lines of qty 0.335 @ 199c total 201c; sum-then-round would give
          200c. The assertion separates the two orders on identical inputs.
        test_recipe:
          setup:
            - "Carrier with tax_rate 0 and O&P min trades 3; single entry P199 (trade DEMOLITION, LABOR, not taxable, not O&P-eligible, price 199)"
            - "Claim FIRE in ESTIMATING with completed inspection; INITIAL estimate holding three P199 lines of qty 0.335 each (one trade => O&P gate unmet, zero tax: the total isolates line-rounding)"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "ZeroTax Mutual", tax_rate: 0, o_and_p_min_trades: 3 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "GEN-DEMO", trade: "DEMOLITION", kind: "LABOR", unit: "EA", unit_price_cents: 199, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-R", coverage_a_limit_cents: 5000000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "FIRE", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-2", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "LOSS_OVERVIEW", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 0.335 }, as: Estimator, captures: { lx1_ext: $.data.extended_cents } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 0.335 }, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${p1}", qty: 0.335 }, as: Estimator }
          trigger:
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { rcv: $.data.rcv_total_cents, onp: $.data.overhead_profit_total_cents, tax: $.data.tax_total_cents } }
          assert:
            - "captured lx1_ext == 67  # round_half_up(0.335 * 199) = round_half_up(66.665) = 67 per line"
            - "Estimate.${est_id}.rcv_total_cents == 201  # 3 * 67; sum-then-round would yield round_half_up(199.995) = 200"
            - "Estimate.${est_id}.rcv_total_cents != 200"
            - "Estimate.${est_id}.overhead_profit_total_cents == 0  # single trade < 3"
            - "Estimate.${est_id}.tax_total_cents == 0"
      - name: overhead_profit_three_trade_gate_and_compounding
        grounds:
          - calculations.overhead_profit
          - entities.Carrier.fields.o_and_p_min_trades
        distinguishing_aspect: |
          Mode (a) combinatorial gate: with exactly two distinct trades O&P is 0;
          adding a third trade flips the gate and O&P compounds sequentially —
          overhead = round(35,000 x 0.10) = 3,500, profit = round((35,000+3,500) x 0.10)
          = 3,850, total 7,350 (not a flat 20% = 7,000).
        test_recipe:
          setup:
            - "Carrier tax 0, O&P rates 0.10/0.10, min trades 3; three O&P-eligible entries tradeA/B/C at 100c"
            - "Claim FIRE in ESTIMATING with completed inspection; estimate holding L1 tradeA qty 100 (10,000c) and L2 tradeB qty 200 (20,000c)"
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "ZeroTax Mutual", tax_rate: 0, overhead_rate: 0.10, profit_rate: 0.10, o_and_p_min_trades: 3 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "A-1", trade: "DEMOLITION", kind: "LABOR", unit: "EA", unit_price_cents: 100, o_and_p_eligible: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { pa: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "B-1", trade: "DRYWALL", kind: "LABOR", unit: "EA", unit_price_cents: 100, o_and_p_eligible: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { pb: $.data.id } }
            - { call: "POST /v1/carriers/${ca_id}/price-list-entries", payload: { category_code: "C-1", trade: "PAINT", kind: "LABOR", unit: "EA", unit_price_cents: 100, o_and_p_eligible: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ContractorAdmin, captures: { pc: $.data.id } }
            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-O", coverage_a_limit_cents: 5000000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
            - { call: "POST /v1/claims", payload: { policy_id: "${pol_id}", cause_of_loss: "FIRE", date_of_loss: "2026-03-10T00:00:00Z" }, as: ContractorAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ASSESSING" }, as: ContractorAdmin }
            - { call: "POST /v1/claims/${cl_id}/inspections", payload: { type: "INITIAL", assignee_id: "tech-2", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }, as: FieldTechnician, captures: { insp_id: $.data.id } }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "a.jpg", captured_at: "2026-05-02T09:05:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "AREA", file_ref: "b.jpg", captured_at: "2026-05-02T09:06:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/photos", payload: { claim_id: "${cl_id}", inspection_id: "${insp_id}", tag: "LOSS_OVERVIEW", file_ref: "c.jpg", captured_at: "2026-05-02T09:07:00Z" }, as: FieldTechnician }
            - { call: "POST /v1/inspections/${insp_id}/complete", payload: {}, as: FieldTechnician }
            - { call: "POST /v1/claims/${cl_id}/transition", payload: { to: "ESTIMATING" }, as: ContractorAdmin, captures: { cl_v: $.data.version } }
            - { call: "POST /v1/claims/${cl_id}/estimates", payload: { expected_claim_version: "${cl_v}" }, as: Estimator, captures: { est_id: $.data.id } }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${pa}", qty: 100 }, as: Estimator }
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${pb}", qty: 200 }, as: Estimator }
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { onp_2trades: $.data.overhead_profit_total_cents } }
          trigger:
            - { call: "POST /v1/estimates/${est_id}/lines", payload: { price_list_entry_id: "${pc}", qty: 50 }, as: Estimator }
            - { call: "GET /v1/estimates/${est_id}", payload: {}, as: Estimator, captures: { onp_3trades: $.data.overhead_profit_total_cents, grand: $.data.grand_total_cents } }
          assert:
            - "captured onp_2trades == 0  # 2 distinct trades < min 3 -> gate closed"
            - "captured onp_3trades == 7350  # overhead 3,500 + profit round(38,500*0.10) 3,850; sequential compounding, not flat 7,000"
            - "captured grand == 42350  # 35,000 base + 7,350 O&P + 0 tax"
      - name: deductible_recovery_evaluation_order
        grounds:
          - calculations.deductible_amount
          - calculations.acv_advance_amount
          - calculations.depreciation_recovery
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: the
          deductible (percentage variant: 2% x 2,500,000 = 50,000) is snapshotted
