              as_user_id: "mgr-fund-1"
              captures: { proj_v2: $.data.version }
            - call: "POST /qof/_clock/set_current_utc"
              payload: { current_utc: "2028-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /qof/improvement-projects/${proj_id}/expenditures"
              payload: { amount: 200000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${proj_v2}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err: $.data.error_id }
          assert:
            - "${w_end} == 2028-07-01T00:00:00Z == window_start + 30 calendar months, exclusive"
            - "the first expenditure returns HTTP 201 with ${in_window_counts} == true and spend_date 2026-08-01T00:00:00Z"
            - "${err} == ERR_EXPENDITURE_OUTSIDE_WINDOW with HTTP 422 for the identical body at 2028-08-01"
            - "ImprovementProject.${proj_id}.qualified_additions_total == 200000.00 and improvement_ratio_pct == 40.0000 (the refused row was not credited)"
            - "ImprovementProject.${proj_id}.status == OPEN and version == ${proj_v2} (still 2; the refused write did not version the project)"
            - "FundAsset.${asset_id}.adjusted_basis == 700000.00 (500000.00 plus the one accepted expenditure ${in_window_id})"

      - name: wcsh_aggregate_capacity_corner
        claim_type: aggregate
        grounds:
          - validations[priority=36]
          - errors[ERR_WCSH_AGGREGATE_CAP_EXCEEDED]
        distinguishing_aspect: "The aggregate-validation corner — each plan is individually legal while the per-month collective exceeds the business's capacity."
        excluded_because:
          difficulty_instance: wcsh_aggregate_capacity_over_overlapping_plans
          rationale: "That §1.8 resource_temporal_overlap instance stacks overlapping plans on one business up to 310000.00 against the 31-percent cap and shows the next plan refused only because of the months where the windows intersect."

      - name: safe_harbor_input_required_only_for_its_own_variant
        claim_type: conditional_validation
        grounds:
          - validations[priority=28]
          - errors[ERR_SAFE_HARBOR_INPUT_MISSING]
          - calculations.qozb_prong_evaluation
        distinguishing_aspect: "Priority 28 is symmetric and variant-scoped: FIFTY_PCT_HOURS without hours_zone_pct is 422, GROSS_INCOME_ACTUAL WITH hours_zone_pct is the same 422 (the input is rejected, not ignored), and FIFTY_PCT_AMOUNTS_PAID with its own percentage succeeds — three outcomes from one rule on one DRAFT test."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund and one QOZBusiness with declared_nqfp_amount 20000.00 and total_asset_value 1000000.00."
            - "One DRAFT BusinessTest on testing_date 2026-06-30."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Safe Harbor Input Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Safe Harbor Operating LLC", zone_tract_code: "12345678910", declared_nqfp_amount: 20000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 850000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/qoz-businesses/${biz_id}/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { bt_id: $.data.id }
          trigger:
            - call: "POST /qof/business-tests/${bt_id}/measure"
              payload: { safe_harbor_used: "FIFTY_PCT_HOURS", gross_income_zone_amount: 600000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 450000.00, intangibles_total_amount: 1000000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /qof/business-tests/${bt_id}/measure"
              payload: { safe_harbor_used: "GROSS_INCOME_ACTUAL", hours_zone_pct: 62.5000, gross_income_zone_amount: 600000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 450000.00, intangibles_total_amount: 1000000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { err_extra: $.data.error_id }
            - call: "POST /qof/business-tests/${bt_id}/measure"
              payload: { safe_harbor_used: "FIFTY_PCT_AMOUNTS_PAID", amounts_paid_zone_pct: 55.0000, gross_income_zone_amount: 600000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 450000.00, intangibles_total_amount: 1000000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { gi_pct: $.data.gross_income_pct, bt_status: $.data.status }
          assert:
            - "${err_missing} == ERR_SAFE_HARBOR_INPUT_MISSING with HTTP 422 (FIFTY_PCT_HOURS needs hours_zone_pct)"
            - "${err_extra} == ERR_SAFE_HARBOR_INPUT_MISSING with HTTP 422 (GROSS_INCOME_ACTUAL rejects hours_zone_pct outright)"
            - "the third call returns HTTP 200 with ${bt_status} == MEASURED and ${gi_pct} == 55.0000 taken verbatim from amounts_paid_zone_pct, not 60.0000 from the income amounts"
            - "BusinessTest.${bt_id}.gross_income_prong == PASS, intangibles_pct == 45.0000 with intangibles_prong PASS, nqfp_pct == 2.0000 with nqfp_prong PASS"
            - "BusinessTest.${bt_id}.version == 2 (only the accepted measurement versioned the row) and QOZBusiness.${biz_id}.qualification_status == UNTESTED until certification"

      - name: checkpoint_month_index_must_not_regress_or_exceed_bound
        claim_type: cascading_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_CHECKPOINT_INDEX_INVALID]
          - entities.WorkingCapitalPlan.fields.last_checkpoint_month_index
        distinguishing_aspect: "Priority 27's lower bound is not a constant — it is last_checkpoint_month_index, which only exists because an earlier checkpoint ran, so the bound check must consume the result of the previous evaluation: month 1 is legal before month 2 and illegal after it, while month 4 is illegal against schedule_month_count in both orders."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund, one QOZBusiness with declared_nqfp_amount 300000.00, and one ACTIVE WorkingCapitalPlan covering 300000.00 over three 100000.00 buckets."
            - "The full 300000.00 has already been spent as OPERATING_WORKING_CAPITAL, so no checkpoint can blow the plan on pacing."
            - "A checkpoint at month 2 has already been evaluated, setting last_checkpoint_month_index to 2."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Checkpoint Order Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "Checkpoint Operating LLC", zone_tract_code: "12345678910", declared_nqfp_amount: 300000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 700000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { biz_id: $.data.id }
            - call: "POST /qof/wcsh-plans"
              payload: { qoz_business_id: "${biz_id}", window_start: "2026-01-01T00:00:00Z", covered_amount: 300000.00, written_plan_reference: "WP-2662-CHECKPOINT-1", schedule_month_count: 3, spend_schedule: [ { month_index: 1, planned_amount: 100000.00 }, { month_index: 2, planned_amount: 100000.00 }, { month_index: 3, planned_amount: 100000.00 } ] }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { plan_id: $.data.id }
            - call: "POST /qof/wcsh-plans/${plan_id}/activate"
              payload: {}
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/wcsh-plans/${plan_id}/expenditures"
              payload: { amount: 300000.00, expenditure_kind: "OPERATING_WORKING_CAPITAL" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { spend_reached: $.data.schedule_month_index }
            - call: "POST /qof/wcsh-plans/${plan_id}/evaluate-checkpoint"
              payload: { checkpoint_month_index: 2 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cp2_status: $.data.status, cp2_index: $.data.last_checkpoint_month_index, cp2_shortfall: $.data.pacing_shortfall }
          trigger:
            - call: "POST /qof/wcsh-plans/${plan_id}/evaluate-checkpoint"
              payload: { checkpoint_month_index: 1 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_regress: $.data.error_id }
            - call: "POST /qof/wcsh-plans/${plan_id}/evaluate-checkpoint"
              payload: { checkpoint_month_index: 4 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { err_bound: $.data.error_id }
          assert:
            - "${spend_reached} == 3 (the 300000.00 spend cascaded through all three buckets)"
            - "${cp2_shortfall} == 0.00, ${cp2_status} == ACTIVE, ${cp2_index} == 2"
            - "${err_regress} == ERR_CHECKPOINT_INDEX_INVALID with HTTP 422 (1 < last_checkpoint_month_index 2)"
            - "${err_bound} == ERR_CHECKPOINT_INDEX_INVALID with HTTP 422 (4 > schedule_month_count 3)"
            - "WorkingCapitalPlan.${plan_id}.last_checkpoint_month_index == 2 and pacing_shortfall == 0.00 (neither refused call moved the checkpoint state)"
            - "WorkingCapitalPlan.${plan_id}.status == ACTIVE and unspent_amount == 0.00"

  - section: endpoints
    instances:
      - name: qoz_business_reported_figures_patch_recomputes_nqfp_only
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /qof/qoz-businesses/{id}/reported-figures]
          - entities.QOZBusiness.fields.nqfp_amount
