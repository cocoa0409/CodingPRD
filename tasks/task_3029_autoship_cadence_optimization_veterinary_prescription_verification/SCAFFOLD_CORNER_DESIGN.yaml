            - call: "POST /v1/autoship-plans/${plan_err2}/compose"
              payload: { expected_plan_version: "${plan_err2_v1}" }
              as: Customer
              as_user_id: "${pet_err2}"
              captures: { order_err2a: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/autoship-plans/${plan_err2}"
              payload: {}
