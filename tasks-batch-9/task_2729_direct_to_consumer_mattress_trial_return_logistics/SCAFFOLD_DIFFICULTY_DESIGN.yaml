      - name: refund_authorization_gated_on_disposition_assignment_intake_confirmation
        grounds:
          - validations[priority=11]
          - state_machines.DispositionAssignment.status.ASSIGNED_to_DELIVERED
          - state_machines.ReturnCase.financial_status.PENDING_to_AUTHORIZED
          - calculations.disposition_partner_selection
          - errors.ERR_DISPOSITION_NOT_CONFIRMED
        distinguishing_aspect: |
          Different direction of dependency from the first instance: the gating entity is a CHILD
          created by an earlier step of the same return (DispositionAssignment), the gated entity is
          a sibling ledger row (RefundAuthorization), and the two live on opposite axes of the
          ReturnCase - logistics_status is already DISPOSITIONED when the money axis is still
          refused. Confirming intake on the assignment, with no write to the ReturnCase, unblocks
          the byte-identical refund request under the same expected_return_case_version.
        test_recipe:
          setup:
