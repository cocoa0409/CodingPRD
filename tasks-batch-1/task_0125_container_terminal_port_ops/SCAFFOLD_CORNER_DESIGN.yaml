            - "error_id == ERR_FK_NOT_FOUND"

      - name: berth_window_vessel_draft_exceeded
        claim_type: Violation → Error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_BERTH_DRAFT_EXCEEDED]"
