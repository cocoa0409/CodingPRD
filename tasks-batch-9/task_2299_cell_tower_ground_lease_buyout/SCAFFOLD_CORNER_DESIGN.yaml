      - name: precision_settlement_holdback_half_cent_rounds_half_up_while_the_fee_rounds_down
        claim_type: precision
        grounds:
          - calculations.deal_settlement_statement
          - entities.Deal.fields.holdback_cents
          - entities.Deal.fields.broker_fee_cents
          - calculations.portfolio_capital_ledger
        distinguishing_aspect: |
          One acceptance exercises ROUND_HALF_UP in both directions on the same gross: with gross 30000020
          and one open dispute the broker fee is 30000020 x 150 / 10000 = 450000.30 -> 450000 (rounds down)
          while the holdback is 30000020 x 250 / 10000 = 750000.50 -> 750001 (a true half-cent that rounds
          up), so net proceeds are 29250019, total commitment is 30450020 and portfolio utilization is
          exactly 6090 bps — banker's rounding on the holdback would produce 750000 and 29250020.
        test_recipe:
          setup:
            - "A portfolio with 50000000 cents of capital."
            - "A stream valued at 44627011 with max_bid_cents 46858362, so a 30000020 cent offer clears the guardrail."
            - "One OPEN DisputeCase exists on the stream at acceptance time, so holdback_bps is 250."
            - "The offer of exactly 30000020 cents is SENT and still unexpired."
          setup_api_calls:
            - { call: "POST /lease-buyouts/portfolios", payload: { name: "Northeast Tower Aggregation", program_code: "NE-AGG-01", total_capital_cents: 50000000 }, as: PlatformAdmin, captures: { pf_id: $.data.id } }
