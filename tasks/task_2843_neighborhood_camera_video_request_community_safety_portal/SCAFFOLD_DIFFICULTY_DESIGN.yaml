  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: eligible_device_disc_boundary_inclusive_at_exact_radius_squared
        grounds:
          - calculations.eligible_device_set
          - entities.RequestArea.fields.eligible_device_count
          - entities.ConsentSolicitation.fields.distance_sq_m2
          - entities.ConsentSolicitation.fields.dispatch_rank
          - endpoints[POST /neighborhood-safety/request-areas/{id}/lock]
        distinguishing_aspect: |
          Metric #1 is the integer squared distance between a camera and the area centre,
          compared against radius_m squared with an INCLUSIVE bound, on the lock endpoint. The
          probe set brackets the bound by one metre: a camera at (300,400) has squared distance
          exactly 250000 == 500^2 and IS eligible, while a camera one metre further out at
          (300,401) has 250801 and is NOT. Because the comparison is on squared integers, an
          implementation that takes a square root and compares floats reads
          sqrt(250000) == 500.00000000000006 for the boundary camera and drops it — the eligible
          count silently becomes 2 and the whole canvass then fails the minimum-device gate.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency ONBOARDED with min_device_threshold 3; officer with duty_role REQUESTER."
            - "Four residents each owning one ACTIVE camera, at (0,10) squared distance 100, (0,20) squared distance 400, (300,400) squared distance exactly 250000, and (300,401) squared distance 250801."
            - "The RequestArea is centred (0,0) with radius_m 500, so the inclusion bound is exactly 250000; the area is still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
