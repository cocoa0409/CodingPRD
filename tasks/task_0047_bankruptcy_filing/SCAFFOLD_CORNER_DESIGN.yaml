        distinguishing_aspect: "A Creditor calling POST /cases/{id}/petition (a Debtor-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A DRAFT Chapter 7 case (complete) and a registered creditor."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "RbacD Debtor", email: "rbacd@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Rbac Cr" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
