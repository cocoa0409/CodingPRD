          - validations[priority=10]
        distinguishing_aspect: |
          The DRAFT->SENT transition's precondition is status == DRAFT, so re-sending an already
          SENT contract must fail at priority 10 with ERR_CONTRACT_STATE_INVALID and must not
          re-stamp or reset either signature field.
        test_recipe:
          setup:
            - "A CONFIRMED engagement with a DRAFT contract"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
