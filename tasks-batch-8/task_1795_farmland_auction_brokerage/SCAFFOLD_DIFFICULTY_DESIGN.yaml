  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: bid_closed_auction_low_amount_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - errors[ERR_AUCTION_NOT_OPEN]
          - errors[ERR_BID_BELOW_INCREMENT]
        distinguishing_aspect: |
          Error-category pair state-vs-business_fiscal: the bid violates BOTH the p5 state gate
          (auction CLOSED_PENDING_AWARD -> ERR_AUCTION_NOT_OPEN) and the p17 fiscal gate
          (amount 100 below any increment -> ERR_BID_BELOW_INCREMENT); p5 must win. The other
          Rule-5 instance exercises a different pair (business_safety vs business_temporal).
