    output: VendorEngagement
    side_effects: ["request QUEUED -> OUTSOURCED and CASE_RECOMPUTE(case)", "item_count snapshotted; base_amount_cents, rush_surcharge_cents, tier_basis_cents, volume_discount_pct, discount_amount_cents and award_amount_cents computed in the pinned order", "Vendor.encumbered_cents incremented by award_amount_cents", "engagement status AWARDED with awarded_at_utc stamped", "the closed window occupies one unit of the vendor's concurrent_case_capacity", "increments ExaminationRequest.version by 1"]
  - method: POST
    path: "/lab/vendor-engagements/{vendor_engagement_id}/confirm-shipment"
    description: "Confirm physical shipment of the evidence to the vendor laboratory"
    roles: [CaseManager]
    code: 200
    input: ["shipment_note?"]
    output: VendorEngagement
    side_effects: ["status AWARDED -> AT_VENDOR, shipped_at_utc stamped", "cascade: evidence item IN_VAULT -> IN_ANALYSIS with checkout_count incremented", "encumbrance and capacity occupation are unchanged", "increments VendorEngagement.version by 1"]
  - method: POST
    path: "/lab/vendor-engagements/{vendor_engagement_id}/record-return"
    description: "Record the vendor's return of the evidence and its invoice; the request rejoins the internal review path"
    roles: [CaseManager]
    code: 200
    input: [final_invoice_cents]
    output: VendorEngagement
    side_effects: ["status AT_VENDOR -> RETURNED (terminal), returned_at_utc stamped, custody_days and variance_cents computed", "Vendor.encumbered_cents decremented by award_amount_cents and spent_cents incremented by final_invoice_cents", "request OUTSOURCED -> TECH_REVIEW with vendor_custody_days refreshed; evidence item IN_ANALYSIS -> IN_VAULT", "a VENDOR_VARIANCE Nonconformance of severity MINOR is opened when abs(variance_cents) exceeds VENDOR_VARIANCE_TOLERANCE_PCT of award_amount_cents", "increments VendorEngagement.version by 1"]
  - method: POST
    path: "/lab/vendor-engagements/{vendor_engagement_id}/cancel"
    description: "Withdraw an award that has not been returned; the exact compensating action of the award"
    roles: [CaseManager]
    code: 200
    input: [cancellation_reason]
    output: VendorEngagement
    side_effects: ["status AWARDED or AT_VENDOR -> CANCELLED (terminal)", "Vendor.encumbered_cents decremented by exactly award_amount_cents, restoring the pre-award value with zero residue; spent_cents untouched", "the closed window stops occupying capacity", "request OUTSOURCED -> QUEUED and CASE_RECOMPUTE(case); an AT_VENDOR cancel also returns the evidence item IN_ANALYSIS -> IN_VAULT", "increments VendorEngagement.version by 1"]

  # ---------------------------------------------------------------- quality system
  - method: POST
