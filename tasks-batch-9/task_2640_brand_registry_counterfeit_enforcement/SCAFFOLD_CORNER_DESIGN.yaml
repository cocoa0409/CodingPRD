        distinguishing_aspect: "The registration-strength ladder is consulted by rung, not by a boolean: a PENDING registration yields 0.30, so even a perfect 1.0000 match tops out at a FULL score of 67.50 and substantiate returns ERR_CLAIM_NOT_SUBSTANTIATED without persisting the computed score."
