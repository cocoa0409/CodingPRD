            - { call: "GET /gifted/screening-cycles/${cyc}/disproportionality-report?variant=FINAL", as: GiftedCoordinator }
          assert:
            - "INTERIM report: variant == INTERIM, reference_group == WHITE, total_identified == 15 (14 IDENTIFIED + 1 AWAITING_COMMITTEE)"
            - "INTERIM report: group_metrics[WHITE].identified == 10, rate 0.2000, risk_ratio 1.000; group_metrics[BLACK].identified == 5, rate 0.2000, risk_ratio 1.000"
            - "FINAL report: variant == FINAL, total_identified == 14; group_metrics[BLACK].identified == 4, rate 0.1600, risk_ratio 0.800"
            - "the INTERIM-vs-FINAL delta is exactly the single denied band case (15 vs 14; BLACK 5 vs 4); FINAL flagged_groups == [] (0.800 is not < 0.800)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: composite_per_measure_rounding_then_sum
        grounds:
          - calculations.composite_score
        distinguishing_aspect: |
          Mode (b) nested rounding: with weights 0.35/0.25/0.25/0.15 and percentiles
          90.0/88.0/76.0/73.3, the pinned order (round each weighted contribution to 2dp
          half-up, then sum, then round to integer) yields 84 (31.50+22.00+19.00+11.00=83.50),
          while the unpinned sum-then-round order yields 83 (raw sum 83.495). The scaffold pins
          per-line-first; the test distinguishes the orders.
        test_recipe:
          setup:
            - "clock 2026-08-20; site; grade-3 student; cycle with profile weights 0.35/0.25/0.25/0.15, cut 85, floor 80, cut_2e 80, floor_2e 75, published, SCORING"
            - "case with all four measures present: ABILITY 90.0, ACHIEVEMENT 88.0, RATING_SCALE 76.0, PORTFOLIO 73.3"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site B", code: "SB", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-R", legal_name: "Stu R", grade_level: 3, school_site_id: "${site_id}", demographic_group: "ASIAN", primary_guardian_user_id: "guard-r" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P4", ability_weight: 0.35, achievement_weight: 0.25, rating_weight: 0.25, portfolio_weight: 0.15, cut_score: 85, review_band_floor: 80, cut_score_2e: 80, review_band_floor_2e: 75 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ABILITY", percentile: 90.0, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 88.0, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 76.0, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "PORTFOLIO", percentile: 73.3, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/finalize-scoring", payload: {}, as: GiftedCoordinator, captures: { comp: $.data.composite_score } }
          assert:
            - "GiftedCase.${case_id}.composite_score == 84 (per-line rounding), NOT 83 (sum-then-round)"
            - "MeasureScore PORTFOLIO weighted_contribution == 11.00 (73.3 * 0.15 = 10.995 rounds half-up to 11.00)"
            - "status == AWAITING_COMMITTEE (80 <= 84 < 85)"

      - name: exit_score_probation_repeat_forces_exit
        grounds:
          - calculations.exit_score_and_outcome
          - entities.ServicePlacement.fields.is_on_probation
        distinguishing_aspect: |
          Mode (a) formula with 3 inputs plus a conditional branch on entity state:
          exit_score = round_half_up(0.5*growth + 7.5*service + 4.0*teacher, 1) selects a band,
          but a second consecutive PROBATION band is overridden to EXITED. First conclude
          (60/3/4 -> 68.5) yields PROBATION; second conclude (45/3/3 -> 57.0, still the
          PROBATION band) yields EXITED only because placement.is_on_probation is now true.
        test_recipe:
          setup:
            - "clock 2026-08-20; site (pull_out capacity 2); student honored via TRANSFER_HONOR -> IDENTIFIED"
            - "PULL_OUT placement offered and accepted (ACTIVE) by guardian guard-1"
            - "re-evaluation #1 due 2027-01-15; clock advanced to 2027-01-15 (auto IN_REVIEW)"
          setup_api_calls:
