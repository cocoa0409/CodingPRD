              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/close"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/enforcement-actions"
              payload: { taxpayer_id: "${tp_id}", program_id: "${prog_id}", action_type: "ASSESSMENT", base_tax_cents: 50000 }
              as: ComplianceAuditor
              as_user_id: "auditor-one"
              captures: { act_id: $.data.id }
            - call: "POST /amnesty/enforcement-actions/${act_id}/issue"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-two"
          trigger:
            - call: "POST /amnesty/enforcement-actions/${act_id}/abate"
              payload: { abatement_reason: "TAXPAYER_PRODUCED_FILED_RETURNS" }
              as: ComplianceAuditor
              as_user_id: "auditor-one"
          assert:
            - "before the trigger Taxpayer.${tp_id}.open_enforcement_action_count == 1 and compliance_behavior_score == 92"
            - "EnforcementAction.${act_id}.status == \"ABATED\""
            - "EnforcementAction.${act_id}.abatement_reason == \"TAXPAYER_PRODUCED_FILED_RETURNS\""
            - "EnforcementAction.${act_id}.escalation_tier_applied == \"T0\""
            - "EnforcementAction.${act_id}.multiplier_applied == 1.00"
            - "EnforcementAction.${act_id}.behavior_adjustment_applied == 0.00"
            - "EnforcementAction.${act_id}.assessed_penalty_cents == 10000"
            - "EnforcementAction.${act_id}.created_by_user_id == \"auditor-one\""
            - "EnforcementAction.${act_id}.issued_by_user_id == \"auditor-two\""
            - "Taxpayer.${tp_id}.open_enforcement_action_count == 0"
            - "Taxpayer.${tp_id}.compliance_behavior_score == 100"
            - "Taxpayer.${tp_id}.escalation_tier == \"T0\""
