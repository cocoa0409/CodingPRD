              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_sr: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_sr}", danger_to_self: false, danger_to_others: true, grave_disability: true, capacity_present: true, clinical_summary: "Agitation, retains capacity." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_sr: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_sr}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "${p_sr}", evaluation_id: "${e_sr}", unit_id: "${u_sr}", requested_legal_status: "VOLUNTARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { a_sr: $.data.id }
            - call: "GET /behavioral-health/admissions/${a_sr}"
              payload: {}
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { a_sr_v1: $.data.version }
          trigger:
            - call: "POST /behavioral-health/capacity-determinations"
              payload: { admission_id: "${a_sr}", expected_admission_version: "${a_sr_v1}", capacity_present: false }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { missing_surrogate_err: $.data.error_id }
            - call: "POST /behavioral-health/capacity-determinations"
              payload: { admission_id: "${a_sr}", expected_admission_version: "${a_sr_v1}", capacity_present: false, surrogate_name: "Marta Sole" }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { partial_surrogate_err: $.data.error_id }
            - call: "POST /behavioral-health/capacity-determinations"
              payload: { admission_id: "${a_sr}", expected_admission_version: "${a_sr_v1}", capacity_present: true, surrogate_name: "Marta Sole", surrogate_relationship: "SPOUSE", surrogate_authority_scope: "FULL" }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { forbidden_surrogate_err: $.data.error_id }
            - call: "POST /behavioral-health/capacity-determinations"
              payload: { admission_id: "${a_sr}", expected_admission_version: "${a_sr_v1}", capacity_present: false, surrogate_name: "Marta Sole", surrogate_relationship: "SPOUSE", surrogate_authority_scope: "MEDICATION_ONLY" }
              as: AttendingPsychiatrist
              as_user_id: "${c_psa}"
              captures: { cd_sr: $.data.id }
          assert:
            - "capacity_present false with no surrogate triple is HTTP 422 with ${missing_surrogate_err} == \"ERR_SURROGATE_REQUIRED\""
            - "capacity_present false with only surrogate_name is HTTP 422 with ${partial_surrogate_err} == \"ERR_SURROGATE_REQUIRED\" (the triple is all-or-nothing)"
            - "capacity_present true carrying the surrogate triple is HTTP 422 with ${forbidden_surrogate_err} == \"ERR_SURROGATE_REQUIRED\" (the fields must be absent in that branch)"
            - "Admission.${a_sr}.version is still ${a_sr_v1} after the three rejections, which is why the same expected_admission_version keeps working"
            - "the complete triple with capacity_present false is HTTP 201: CapacityDetermination.${cd_sr}.status == \"ACTIVE\", capacity_present == false, surrogate_authority_scope == \"MEDICATION_ONLY\", determined_by_clinician_id == ${c_psa}, determined_at == \"2026-09-03T08:00:00.000Z\""
            - "Admission.${a_sr}.version increased by exactly 1 as a result of the accepted determination"

