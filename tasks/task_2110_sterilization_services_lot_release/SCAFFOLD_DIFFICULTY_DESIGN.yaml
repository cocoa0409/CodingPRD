              captures: { audit2_outcome: $.data.outcome, audit2_status_after: $.data.qualification_status_after }
          assert:
            - "${audit1_outcome} == CONDITIONAL_PASS and ${audit1_next} == 2026-09-19T00:00:00Z"
            - "${audit2_outcome} == CONDITIONAL_PASS"
            - "${audit2_status_after} == REVOKED"
            - "ProductQualification.${q1_id}.status == REVOKED"
            - "ProductQualification.${q1_id}.consecutive_conditional_count == 2"
            - "ProductQualification.${q1_id}.next_audit_due_at is null"
            - "DoseAudit rows under ${q1_id} number exactly 2"

  # ===========================================================================
  # Rule 4 - Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dose_deviation_depth4_cascade_strips_sibling_lot_from_another_load_map
        grounds:
          - state_machines.Cycle.DOSIMETRY_REVIEW_to_DOSE_DEVIATION
          - state_machines.Lot.PROCESSED_to_QUARANTINE
          - state_machines.ProductQualification.QUALIFIED_to_AUDIT_DUE
          - calculations.dose_conformance_verdict
          - calculations.cycle_load_density
          - entities.Lot.fields.schedulable
        distinguishing_aspect: |
          Depth-4 chain originating from the dosimetry-close DEVIATION branch:
          close -> cycle DOSE_DEVIATION (hop 1) -> because the cycle deviated,
          its lot is quarantined BI_POSITIVE (hop 2) -> because that lot was
          quarantined, its (product, recipe) qualification flips to AUDIT_DUE
          (hop 3) -> because that qualification is now AUDIT_DUE, an unrelated
          sibling lot of the same product is unstaged from a completely different
          cycle's load map, which reverts that cycle LOADING -> PLANNED (hop 4).
          Every hop is caused by the previous hop, none directly by the request.
        test_recipe:
          setup:
            - "Two GAMMA chambers CH-G1 and CH-G2 under one permit, one approved recipe RG2 requiring one MIN_DOSE dosimeter, one ROUTINE dosimeter and one biological indicator."
            - "Product P1 has a QUALIFIED ProductQualification against RG2."
            - "Lot L1 ran in cycle C1 on CH-G1, which is COMPLETED with all three indicators READ - the biological indicator reading is POSITIVE - so C1 sits in DOSIMETRY_REVIEW and L1 is PROCESSED."
            - "Lot L2 of the same product P1 is STAGED into cycle C2 on CH-G2, which sits in LOADING with loaded_pallet_count 2."
            - "The logical clock reads 2026-08-11T12:00:00Z."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
