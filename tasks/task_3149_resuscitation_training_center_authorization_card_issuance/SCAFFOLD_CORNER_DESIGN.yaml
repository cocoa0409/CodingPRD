              payload: { full_name: "Carl Candidate", email: "carl@x.example", discipline: "BLS", home_training_center_id: "${center_id}" }
              as: NationalAdmin
              captures: { cand_id: $.data.id }
            - call: "POST /aha/instructors/${cand_id}/monitor"
              payload: { monitored_at: "2026-09-05T00:00:00Z", course_type_observed: "BLS_PROVIDER", outcome: "SATISFACTORY" }
              as: TrainingFaculty
              as_user_id: "${faculty_id}"
            - call: "POST /aha/instructors/${cand_id}/teaching-evaluations"
