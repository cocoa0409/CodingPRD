      - name: reduction_execute_amends_oa_and_restores_building_sf
        grounds:
          - state_machines.SpaceReductionAction.APPROVED_to_EXECUTED
          - state_machines.OccupancyAgreement.ACTIVE_to_ACTIVE
          - calculations.space_inventory_reconciliation
          - entities.Building.fields.available_sf
        distinguishing_aspect: |
          Depth-2 cascade fired by reduction execute (different trigger from
          the clock-sweep instance): EXECUTED mutates the OA (assigned_sf
          20,000 -> 10,500 with an amendment_history entry and version bump,
          hop 1), and that OA mutation itself restores the owned building's
          available_sf 30,000 -> 39,500 (hop 2).
