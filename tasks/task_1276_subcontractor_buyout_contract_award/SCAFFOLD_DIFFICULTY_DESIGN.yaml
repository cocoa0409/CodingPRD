            - call: "POST /subcontracts/${sub_h}/insurance-certificates"
              payload: { certificate_number: "CERT-NL2", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01" }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_h}/issue"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_h}/execute"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_h}/schedule-of-values"
              payload: { lines: [{ wbs_code: "01", description: "Gear", weight_numerator: 50 }, { wbs_code: "02", description: "Labor", weight_numerator: 50 }] }
              as: BuyoutLead
              captures: { sov_id: $.data.id }
            - call: "POST /schedule-of-values/${sov_id}/reject"
