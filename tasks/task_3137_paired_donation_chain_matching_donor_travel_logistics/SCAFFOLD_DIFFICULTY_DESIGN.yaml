          trigger:
            # - call: "POST /nkr/shipments/${shipment}/depart" -> ERR_ORGAN_NOT_READY
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_ORGAN_NOT_READY"
            - "OrganShipment.shipment_state unchanged (still PLANNED)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: surgery_slot_overlap_half_open_interval
        grounds:
          - validations[priority=14]
          - entities.SurgeryScheduleSlot.fields.slot_state
        distinguishing_aspect: |
          Resource: SurgeryScheduleSlot at one center. Interval semantics:
          half-open [start, end). Adjacent slots where end == start are
          allowed (no overlap). Overlap of any non-zero duration rejected.
          Distinct semantics from the next instance.
        test_recipe:
          setup:
            - "Center A ACTIVE; Slot1 [09:00, 12:00) RESERVED; Slot2 [12:00, 15:00) OPEN (adjacent, allowed)"
            - "Attempt Slot3 [11:00, 13:00) — overlaps Slot1 by 1 hour"
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            # Setup elided; concrete in unit test.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            # - create Slot3 with [11:00, 13:00) — POST /nkr/slots -> ERR_SLOT_OVERLAP
            # - create Slot4 with [12:00, 15:00) — adjacent to Slot1, but conflicts with Slot2 if Slot2 is OPEN, not RESERVED — so allowed.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "POST /nkr/slots with [11:00, 13:00) -> ERR_SLOT_OVERLAP"
            - "Adjacent slot [12:00, 15:00) at center A is allowed (no overlap with [09:00, 12:00))"

      - name: chain_center_capacity_aggregated_occupancy
        grounds:
          - validations[priority=25]
          - entities.TransplantCenter.fields.active_chain_count
          - entities.TransplantCenter.fields.max_concurrent_chains
        distinguishing_aspect: |
          Resource: TransplantCenter's max_concurrent_chains. Interval
          semantics: aggregate capacity — at any instant, count of chains
          with at least one MatchOffer at this center in SCHEDULED state
          must be < max_concurrent_chains. Not a pairwise interval overlap
          but a concurrent-occupancy cap. Distinct semantics and resource.
        test_recipe:
          setup:
            - "Center A with max_concurrent_chains=1; Chain1 already SCHEDULED at A; Chain2 in LOCKED with one offer at A"
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            # Setup elided; concrete in unit test.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            # - call: "POST /nkr/chains/${chain2}/schedule" -> ERR_CENTER_AT_CAPACITY
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "POST /nkr/chains/{chain2}/schedule -> ERR_CENTER_AT_CAPACITY"
            - "Center.active_chain_count == 1 (unchanged)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: chain_run_supersede_restores_pool_composition
        grounds:
          - state_machines.ChainRun.PUBLISHED_to_SUPERSEDED
          - entities.Donor.fields.chain_participation_state
          - entities.Recipient.fields.chain_participation_state
        distinguishing_aspect: |
          Conserved quantity: total count of Donors and Recipients with
          chain_participation_state == POOL. Invariant: publish (POOL ->
          PROPOSED for all matched) followed by supersede (PROPOSED ->
          POOL for all matched) leaves the POOL cardinality unchanged.
        test_recipe:
          setup:
            - "Pool of N=4 pairs IN_POOL; chain run executed and published; two pairs are now PROPOSED"
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            # Setup elided; concrete in unit test.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            # - call: "POST /nkr/chain-runs/${run}/supersede"
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "Count of Donors with chain_participation_state == POOL == initial N (no drift)"
            - "Count of Recipients with chain_participation_state == POOL == initial N (no drift)"
            - "All MatchOffers from superseded run -> OFFER_FAILED with reason CHAIN_BREAK_PROPAGATION"

      - name: claim_approve_then_deny_reversal_conserves_bucket
        grounds:
          - calculations.protection_claim_headroom
          - state_machines.DonorProtectionClaim.UNDER_REVIEW_to_DENIED
          - entities.DonorProtectionPolicy.fields.complications_paid_cents
        distinguishing_aspect: |
          Conserved quantity: DonorProtectionPolicy bucket headroom.
          Invariant: claim SUBMITTED -> UNDER_REVIEW -> DENIED (compensating
          action for the review reservation) leaves
          policy.complications_paid_cents unchanged from before submission.
          Distinct conserved quantity from Rule 9 instance 1 (monetary
          cents vs entity count).
        test_recipe:
          setup:
            - "Donor with ACTIVE DonorProtectionPolicy; complications_paid_cents = 0"
            - "Claim submitted with claim_kind=COMPLICATION, requested_amount_cents=100000"
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            # Setup elided; concrete in unit test.
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            # - call: "POST /nkr/claims/${c}/start-review"
            # - call: "POST /nkr/claims/${c}/deny"
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "DonorProtectionPolicy.complications_paid_cents == 0 (unchanged)"
            - "DonorProtectionClaim.claim_state == DENIED"

  # =========================================================================
  # Rule 1 (3rd instance) — Dual-variant across entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: crossmatch_decision_indeterminate_vs_strong_positive
        grounds:
          - calculations.crossmatch_decision
        distinguishing_aspect: |
          Crossmatch decision rule has variant behaviour by virtual_result:
          INDETERMINATE always yields FAIL (conservative) regardless of MFI;
          STRONG_POSITIVE also always yields FAIL. The two variants share an
          outcome but diverge from the WEAK_POSITIVE/NEGATIVE branches.
          Distinct variant-axis from TravelItinerary cost and from the
          NEGATIVE-vs-WEAK thresholds.
        test_recipe:
          setup: ["Offer in PENDING_CROSSMATCH at center B"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "virtual_result=INDETERMINATE dsa_mfi_max=0 -> FAIL"
            - "virtual_result=STRONG_POSITIVE dsa_mfi_max=0 -> FAIL"
            - "virtual_result=NEGATIVE dsa_mfi_max=0 -> PASS"

  # =========================================================================
  # Rule 2 (3rd instance) — Combinatorial formulas mode (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: center_reputation_circular_evaluation_order
        grounds:
          - calculations.center_reputation_score
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. reputation_score_bps depends
          on shipped_organ_count and probed_cold_ischemia_violations; those
          counters are themselves updated when OrganShipment transitions
          occur; the score is derived from counters, not the reverse. The
          evaluation order is pinned: counters first (in the transition),
          then reputation_score_bps (in the same atomic update). Pinned
          formula resolves the apparent cycle.
        test_recipe:
          setup: ["Center with 3 shipped organs, 1 CIT violation, 0 failures"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            # reputation = 10000 - 0 - 800 + min(1000, 3*200) = 10000 - 800 + 600 = 9800
            - "Center.reputation_score_bps == 9800"

  # =========================================================================
  # Rule 3 (3rd instance) — Non-linear state machine on different entity
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: organ_shipment_branching_delay_reroute_paths
        grounds:
          - state_machines.OrganShipment
        distinguishing_aspect: |
          OrganShipment has a branching shape: PLANNED -> DEPARTED ->
          {DELAYED, REROUTED, DELIVERED}, and DELAYED -> REROUTED ->
          DELIVERED. Distinct entity from Donor and TransplantCenter.
        test_recipe:
          setup: ["Shipment in PLANNED"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "PLANNED -> DEPARTED -> DELAYED -> REROUTED -> DELIVERED path succeeds"
            - "PLANNED -> DEPARTED -> DELIVERED direct path also succeeds"

  # =========================================================================
  # Rule 4 (3rd instance) — Transitive cascade from another trigger
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: center_suspend_cascades_slots_offers
        grounds:
          - state_machines.TransplantCenter.ACTIVE_to_SUSPENDED
          - state_machines.SurgeryScheduleSlot
          - state_machines.MatchOffer
        distinguishing_aspect: |
          Cascade: POST /nkr/centers/{id}/suspend -> RESERVED slots RELEASED,
          CENTER_ACCEPTED offers rolled back to CROSSMATCH_PASSED, PENDING
          offers OFFER_FAILED. Distinct trigger (center suspension) from
          donor withdrawal and shipment delivery.
        test_recipe:
          setup: ["Center with 2 RESERVED slots, 1 CENTER_ACCEPTED offer, 1 PENDING_CROSSMATCH offer"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "All RESERVED slots at center -> RELEASED"
            - "CENTER_ACCEPTED offers rolled back to CROSSMATCH_PASSED"
            - "PENDING_CROSSMATCH offers -> OFFER_FAILED"

  # =========================================================================
  # Rule 5 (3rd instance) — Priority conflict: auth vs business_safety
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: auth_vs_center_suspended_on_nephrectomy
        grounds:
          - validations[priority=2]
          - validations[priority=5]
        distinguishing_aspect: |
          Pair (auth vs business_safety): CenterCoordinator role allowed,
          but home center SUSPENDED. Center suspension (priority 5) beats
          state and other lower priorities. Distinct pair from the earlier
          two.
        test_recipe:
          setup: ["Center A SUSPENDED; Donor at A in SURGERY_SCHEDULED"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "response.error_id == ERR_CENTER_SUSPENDED"

  # =========================================================================
  # Rule 6 (3rd instance) — Boundary: zero-count empty set
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: chain_run_zero_pool_returns_pool_too_small
        grounds:
          - validations[priority=16]
        distinguishing_aspect: |
          Metric: candidate_pool_size == 0 (empty set). Endpoint:
          chain-runs execute. Boundary: empty pool is below MIN_POOL_SIZE=2
          -> ERR_POOL_TOO_SMALL. Distinct metric (zero-set) vs the prior
          instances (threshold boundary at 1 vs 2, DSA threshold).
        test_recipe:
          setup: ["Empty pool"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/chain-runs"
              payload: { run_label: "empty-pool" }
              as: MatchOperator
              captures: { run_ep: $.data.id, run_ep_v: $.data.version }
          trigger:
            - call: "POST /nkr/chain-runs/${run_ep}/execute"
              payload: { expected_run_version: "${run_ep_v}" }
              as: MatchOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "response.error_id == ERR_POOL_TOO_SMALL"

  # =========================================================================
  # Rule 7 (3rd instance) — Cross-entity dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: chain_lock_gated_on_all_offers_center_accepted
        grounds:
          - state_machines.Chain.ACCEPTING_to_LOCKED
          - state_machines.MatchOffer
        distinguishing_aspect: |
          Entity pair (Chain, MatchOffer): Chain cannot transition
          ACCEPTING -> LOCKED unless every MatchOffer in this chain has
          offer_state == CENTER_ACCEPTED. Distinct pair from prior instances.
        test_recipe:
          setup: ["Chain in ACCEPTING with one offer still in PENDING_CROSSMATCH"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "POST /nkr/chains/{c}/lock -> ERR_PENDING_OFFERS"

  # =========================================================================
  # Rule 8 (3rd instance) — Resource overlap: itinerary donor-side timing
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: itinerary_departure_before_arrival_conflict
        grounds:
          - entities.TravelItinerary.fields.depart_utc
          - entities.TravelItinerary.fields.arrive_utc
        distinguishing_aspect: |
          Resource: TravelItinerary for one donor. Interval semantics: a
          donor cannot have two itineraries whose [depart, arrive) intervals
          overlap. Adjacent itineraries (arrive == depart of next) allowed.
          Distinct semantics from surgery slot and chain center capacity.
        test_recipe:
          setup: ["Donor with one CONFIRMED itinerary [T1, T2); second itinerary [T1+1h, T2+1h) attempted"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "GET /nkr/centers"
              payload: {}
              as: RegistryAdmin
          assert:
            - "Second itinerary rejected with ERR_INVALID_REQUEST (overlap)"

  # =========================================================================
  # Rule 9 (3rd instance) — Compensating invariant: itinerary cancel
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: itinerary_confirm_then_cancel_conserves_traveled_distance
        grounds:
          - state_machines.TravelItinerary.DRAFT_to_CONFIRMED
          - state_machines.TravelItinerary.CONFIRMED_to_CANCELLED
          - entities.Donor.fields.traveled_distance_miles
        distinguishing_aspect: |
          Conserved quantity: Donor.traveled_distance_miles (sum of CONFIRMED
          segment_miles). Invariant: itinerary confirm (DRAFT -> CONFIRMED)
          followed by cancel (CONFIRMED -> CANCELLED) leaves
          traveled_distance_miles unchanged from before the confirm.
          Distinct conserved quantity from pool cardinality and bucket cents.
        test_recipe:
          setup: ["Donor with traveled_distance_miles=0"]
          setup_api_calls:
            - call: "POST /nkr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /nkr/centers"
              payload: { center_code: "IC-001", name: "IC1", region_code: "T", tier: "STANDARD", max_concurrent_chains: 2 }
              as: RegistryAdmin
              captures: { ctr_ic: $.data.id }
            - call: "POST /nkr/donors"
              payload: { external_ref: "DIC1", home_center_id: "${ctr_ic}", abo_type: "O", hla_a: "A02,A24", hla_b: "B07,B44", hla_drb1: "DRB1*04,DRB1*07", kdri_score: 80, age_at_registration: 30, donor_kind: "PAIRED" }
              as: CenterCoordinator
              as_user_id: "${ctr_ic}"
              captures: { d_ic: $.data.id }
            - call: "POST /nkr/itineraries"
              payload: { donor_id: "${d_ic}", origin_airport_code: "SFO", destination_airport_code: "JFK", depart_utc: "2026-09-10T08:00:00Z", arrive_utc: "2026-09-10T16:00:00Z", segment_miles: 2586, lodging_nights: 0 }
              as: LogisticsCoordinator
              captures: { itin_ic: $.data.id }
          trigger:
            - call: "POST /nkr/itineraries/${itin_ic}/confirm"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /nkr/itineraries/${itin_ic}/cancel"
              payload: { cancelled_reason: "SCHEDULE_MOVED" }
              as: LogisticsCoordinator
          assert:
            - "Donor.${d_ic}.traveled_distance_miles == 0 (unchanged)"
            - "TravelItinerary.${itin_ic}.itinerary_state == CANCELLED"
