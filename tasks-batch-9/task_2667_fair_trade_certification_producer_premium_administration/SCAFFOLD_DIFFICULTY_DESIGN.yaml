              payload: { brand_holder_id: "${brand_id}", sku_code: "ALP-PURE-100", artwork_ref: "ART-2026-002", claim_type: "FT_CERTIFIED_100", requested_volume_kg: 5000 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { mur_100_id: $.data.id }
          trigger:
            - call: "POST /fairtrade/mark-usage-requests/${mur_mb_id}/decide"
              payload: { decision: "APPROVE", reason: "Artwork conforms" }
              as: CertificationOfficer
              as_user_id: "officer-1"
            - call: "POST /fairtrade/certificate-holders/${brand_id}/label-license/payments"
              payload: { amount_cents: 382950 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
            - call: "POST /fairtrade/mark-usage-requests/${mur_mb_id}/decide"
              payload: { decision: "APPROVE", reason: "Artwork conforms" }
              as: CertificationOfficer
              as_user_id: "officer-1"
            - call: "POST /fairtrade/mark-usage-requests/${mur_100_id}/decide"
              payload: { decision: "APPROVE", reason: "Artwork conforms" }
              as: CertificationOfficer
              as_user_id: "officer-1"
          assert:
            - "the first decide returns 402 with error_id == ERR_LICENSE_FEE_UNPAID and MarkUsageRequest.${mur_mb_id}.status is still SUBMITTED"
            - "after the payment CertificateHolder.${brand_id}.license_fee_paid_cents == 382950 and license_fee_settled == true"
            - "the second decide returns 200 and MarkUsageRequest.${mur_mb_id}.status == APPROVED with decided_by_user_id == officer-1 and decided_at == 2026-08-01T00:00:00Z"
            - "the third decide returns 422 with error_id == ERR_TRACEABILITY_MODE_MISMATCH and MarkUsageRequest.${mur_100_id}.status is still SUBMITTED, because the FT_CERTIFIED_100 claim needs chain_mode ALL_PHYSICAL"
            - "GET /fairtrade/certificate-holders/${brand_id}/traceability-summary returns chain_mode == CONTAINS_MASS_BALANCE, chain_node_count == 2, brand_node_count == 1, physical_node_count == 0, mass_balance_node_count == 2"

      - name: trade_creation_rejected_when_seller_node_suspended_by_its_holder
        grounds:
          - validations.priority_12_ERR_NODE_NOT_ACTIVE
          - state_machines.SupplyChainNode.ACTIVE_to_SUSPENDED
          - state_machines.CertificateHolder.SUSPENDED_to_CERTIFIED
        distinguishing_aspect: |
          A different entity pair: TradeTransaction creation depends on the SupplyChainNode status
          that is itself owned by a third entity, the CertificateHolder. The trade payload names
          only node ids, so the implementation has to reach through the node to the holder's
          lifecycle; the very same payload succeeds once the holder is reinstated.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED with one ACTIVE PHYSICAL cooperative node holding certified_input_kg 50000"
            - "BRAND holder CERTIFIED with one ACTIVE PHYSICAL BRAND_NODE downstream of that cooperative"
            - "the producer holder is then suspended, cascading its cooperative node ACTIVE -> SUSPENDED"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "POST /fairtrade/certificate-holders/${prod_id}/suspend"
              payload: { reason: "AUDIT_FINDING" }
              as: CertificationOfficer
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v_susp: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 8000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v_susp}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "POST /fairtrade/certificate-holders/${prod_id}/reinstate"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v_reinstated: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 8000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v_reinstated}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t_ok_id: $.data.id }
          assert:
            - "the first create returns 409 with error_id == ERR_NODE_NOT_ACTIVE"
            - "SupplyChainNode.${sell_node_id}.reserved_output_kg == 0.000 after the refusal and version == ${node_v_susp}"
            - "CertificateHolder.${prod_id}.certificate_status == CERTIFIED and suspension_reason == NONE after the reinstate"
            - "SupplyChainNode.${sell_node_id}.status == ACTIVE and ${node_v_reinstated} > ${node_v_susp}"
            - "the second create returns 201, TradeTransaction.${t_ok_id}.premium_cents == 640000 and SupplyChainNode.${sell_node_id}.reserved_output_kg == 8000.000"

  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: auditor_travel_buffer_blocks_a_window_that_merely_touches_the_buffer_edge
        grounds:
          - validations.priority_24_ERR_AUDITOR_WINDOW_CONFLICT
          - entities.Audit.fields.auditor_user_id
          - global_constants.AUDITOR_TRAVEL_BUFFER_DAYS
        distinguishing_aspect: |
          The contended resource is the auditor_user_id and the interval semantics are CLOSED on
          both ends with a 3-day travel buffer added to each side, so a window starting exactly
          AUDITOR_TRAVEL_BUFFER_DAYS after the previous window's end is still a conflict. The two
          audits belong to different holders, which isolates this rule from the holder rule.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "two CERTIFIED PRODUCER_ORG holders, H1 and H2"
            - "auditor-1 already holds a SCHEDULED audit on H1 over the window [2026-08-01, 2026-08-05)"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { h1_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${h1_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Cocoa Union", holder_type: "PRODUCER_ORG", country_code: "GH", product_code: "COCOA" }
              as: CertificationOfficer
              captures: { h2_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${h2_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${h1_id}", auditor_user_id: "auditor-1", audit_type: "SURVEILLANCE", window_start: "2026-08-01", window_end: "2026-08-05" }
              as: CertificationOfficer
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${h2_id}", auditor_user_id: "auditor-1", audit_type: "SURVEILLANCE", window_start: "2026-08-08", window_end: "2026-08-12" }
              as: CertificationOfficer
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${h2_id}", auditor_user_id: "auditor-1", audit_type: "SURVEILLANCE", window_start: "2026-08-09", window_end: "2026-08-13" }
              as: CertificationOfficer
              captures: { a3_id: $.data.id }
          assert:
            - "the 2026-08-08 request returns 409 with error_id == ERR_AUDITOR_WINDOW_CONFLICT, because 2026-08-08 <= 2026-08-05 + 3 days on a closed comparison"
            - "the 2026-08-09 request returns 201 and Audit.${a3_id}.status == SCHEDULED, because 2026-08-09 > 2026-08-08"
            - "GET /fairtrade/certificate-holders/${h2_id}/audits returns exactly 1 row, so the refused request wrote nothing"
            - "Audit.${a1_id}.status is still SCHEDULED and its window is unchanged"
            - "control: a window of [2026-07-25, 2026-07-29) for auditor-1 is also refused, since the buffer applies on the earlier side too"

      - name: holder_audit_windows_may_touch_but_not_overlap_by_a_single_day
        grounds:
          - validations.priority_25_ERR_HOLDER_AUDIT_WINDOW_CONFLICT
          - entities.Audit.fields.window_end
        distinguishing_aspect: |
          A different resource — the holder_id — and deliberately the opposite interval semantics:
          HALF-OPEN with no buffer, so back-to-back windows that merely touch at
          existing.window_end == new.window_start are legal while a one-day overlap is not. Both
          triggers use a second auditor so the auditor buffer rule cannot mask the outcome.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one CERTIFIED PRODUCER_ORG holder H1"
            - "auditor-1 already holds a SCHEDULED audit on H1 over the window [2026-08-01, 2026-08-05)"
            - "auditor-2 holds no audits at all"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { h1_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${h1_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${h1_id}", auditor_user_id: "auditor-1", audit_type: "SURVEILLANCE", window_start: "2026-08-01", window_end: "2026-08-05" }
              as: CertificationOfficer
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${h1_id}", auditor_user_id: "auditor-2", audit_type: "FOLLOW_UP", window_start: "2026-08-04", window_end: "2026-08-08" }
              as: CertificationOfficer
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${h1_id}", auditor_user_id: "auditor-2", audit_type: "FOLLOW_UP", window_start: "2026-08-05", window_end: "2026-08-09" }
              as: CertificationOfficer
              captures: { a2_id: $.data.id }
          assert:
            - "the [2026-08-04, 2026-08-08) request returns 409 with error_id == ERR_HOLDER_AUDIT_WINDOW_CONFLICT, since 2026-08-04 < 2026-08-05 and 2026-08-01 < 2026-08-08"
            - "the [2026-08-05, 2026-08-09) request returns 201 and Audit.${a2_id}.status == SCHEDULED, since a touching half-open window does not overlap"
            - "GET /fairtrade/certificate-holders/${h1_id}/audits returns exactly 2 rows ordered by created_at ASC, the first being ${a1_id}"
            - "the accepted window proves no travel buffer is applied on the holder axis, which is the opposite semantics from the auditor axis"
            - "control: a third window of [2026-08-08, 2026-08-12) for auditor-2 is refused with ERR_AUDITOR_WINDOW_CONFLICT rather than the holder error, since auditor-2 now occupies 2026-08-05..2026-08-09"

      - name: fund_window_capacity_rejects_the_aggregate_of_overlapping_use_periods
        grounds:
          - validations.priority_28_ERR_FUND_PERIOD_CAPACITY_EXCEEDED
          - entities.PremiumUseProposal.fields.use_period_start
          - global_constants.FUND_WINDOW_CAPACITY_PCT
        distinguishing_aspect: |
          A third resource entity — the PremiumFund — where the constraint is not pairwise
          exclusion but an AGGREGATE ceiling over the set of already-APPROVED proposals whose
          half-open use periods overlap the one being approved. Each proposal is individually
          affordable; only their overlapping sum breaches 80 percent of total_accrued_cents.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED with a PHYSICAL cooperative node and a 5-member committee chaired by chair-1"
            - "one 30000 kg organic coffee trade VERIFIED and SETTLED, so total_accrued_cents and balance_cents are 3000000 and the capacity ceiling is 2400000"
            - "proposal P1 for 1500000 cents over [2026-09-01, 2026-11-01) already APPROVED, so balance_cents is 1500000"
            - "proposal P2 for 950000 cents over [2026-10-01, 2026-12-01) UNDER_VOTE with 3 of 5 ballots cast, 2 of them APPROVE"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
            - call: "POST /fairtrade/premium-committees"
              payload: { holder_id: "${prod_id}", chair_user_id: "chair-1", member_count: 5, approved_use_categories: ["EDUCATION", "INFRASTRUCTURE"] }
              as: CertificationOfficer
              captures: { cmte_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", is_organic: true, volume_kg: 30000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/trade-transactions/${t1_id}/settle"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/certificate-holders/${prod_id}/premium-funds"
              payload: {}
              as: CertificationOfficer
              captures: { fund_id: "$.data[0].id", fund_v1: "$.data[0].version" }
            - call: "POST /fairtrade/premium-use-proposals"
