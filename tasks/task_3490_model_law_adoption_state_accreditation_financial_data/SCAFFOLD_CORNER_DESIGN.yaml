  - section: calculations
    instances:
      - name: ballot_quorum_exact_boundary
        claim_type: boundary_edge
        grounds:
          - calculations.ballot_adoption_rule
        distinguishing_aspect: "With 5 eligible states, exactly quorum (3) votes cast passes the quorum leg; unanimous YEA then adopts (3 >= ceil(2/3 x 3) == 2)."
        test_recipe:
          setup: ["States CA/NV/OR/WA/AZ all ACCREDITED; act MDL-820 v1 BALLOTING; exactly CA/NV/OR voted YEA"]
