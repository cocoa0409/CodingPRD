            - "response.status == 409"

      - name: operator_rest_buffer
        grounds:
          - validations[priority=10]
          - entities.Callout.fields.window_start_at
          - errors[ERR_OPERATOR_REST_VIOLATION]
        distinguishing_aspect: |
          A second Callout for the same operator whose window falls within OPERATOR_REST_BUFFER_HOURS (8h)
          of an existing {ISSUED,COMPLETED} callout (00:00-08:00 then 10:00-18:00, a 2h gap) is rejected
          ERR_OPERATOR_REST_VIOLATION. The 8h buffer (not mere overlap) distinguishes this from the
          vehicle's plain half-open semantics, and it sits on the Operator resource.
        test_recipe:
          setup:
            - "One operator with an ISSUED callout over 00:00-08:00 on 2026-02-10; a storm."
