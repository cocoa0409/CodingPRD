              captures: { plan_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST" }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}" }
              as: PracticeAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
              captures: { sess_v: $.data.version }
          trigger:
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_id}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v}" }
              as: ReferralCoordinator
              captures: { bk_id: $.data.id, w_end: $.data.slot_end_utc, w_occ: $.data.occupancy_end_utc, w_cls: $.data.planned_classification }
            - call: "GET /billing-claims"
              payload: { booking_id: "${bk_id}" }
              as: BillingSpecialist
              captures: { cl_tc: $.meta.total_count, cl_st: "$.data[0].status", cl_var: "$.data[0].variant", cl_allow: "$.data[0].allowed_amount_cents", cl_pat: "$.data[0].patient_responsibility_cents" }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: ReferralCoordinator
              captures: { r_bm: $.data.booked_minutes, r_rem: $.data.remaining_minutes }
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "SMS", acknowledged: true }
              as: PatientNavigator
              captures: { o_sc: $.data.prep_adherence_score, o_nav: $.data.navigation_status, o_log: $.data.outreach_log }
            - call: "GET /screening-episodes/${ep_id}"
              payload: {}
              as: PatientNavigator
              captures: { g_sc: $.data.prep_adherence_score, g_nav: $.data.navigation_status, g_cs: $.data.clinical_status }
          assert:
            - "the booking response already holds ${w_end} == 2026-09-15T13:45:00.000Z, ${w_occ} == 2026-09-15T14:00:00.000Z and ${w_cls} == SCREENING_PREVENTIVE"
            - "${cl_tc} == 1 with ${cl_st} == PROVISIONAL_PRICED, ${cl_var} == PROVISIONAL, ${cl_allow} == 170750 and ${cl_pat} == 0 - the claim exists before any further call"
            - "${r_bm} == 60 and ${r_rem} == 420 in the very next read"
            - "the outreach response already holds ${o_sc} == 2.00, ${o_nav} == PREP_AT_RISK and ${o_log} with exactly one entry {channel SMS, occurred_at 2026-09-01T00:00:00.000Z, acknowledged true}"
            - "${g_sc} == 2.00 and ${g_nav} == PREP_AT_RISK - the read repeats the write response instead of improving on it"
            - "${g_cs} == PROCEDURE_SCHEDULED, so both dimensions were already settled by their own writes"
