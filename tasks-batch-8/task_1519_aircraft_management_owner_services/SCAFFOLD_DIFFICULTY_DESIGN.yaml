              payload: { trip_id: "${t3_id}", crew_member_id: "${c1_id}", duty_role: PIC, duty_start_at: "2026-08-05T15:00:00Z", duty_end_at: "2026-08-05T18:00:00Z" }
              as: FlightOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "DutyAssignment.${a2_id} was created (touching endpoints end == start do not conflict)"
            - "trigger rejected with error_id == ERR_CREW_OVERLAP"
            - "GET /assignments?crew_member_id=${c1_id} returns exactly 2 assignments, both ASSIGNED"

      - name: aircraft_trips_require_turnaround_buffer
        grounds:
          - calculations.aircraft_occupancy_interval
          - validations[priority=7]
          - errors[ERR_AIRCRAFT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics on the Aircraft resource (different resource AND
          different semantics than the half-open crew windows): occupancy
          requires a >= 1h turnaround gap, so a second trip departing exactly
          1.0h after the first ends is scheduled, while a third departing 0.5h
          after the second ends is rejected with ERR_AIRCRAFT_OVERLAP.
        test_recipe:
          setup:
            - "Agreement ACTIVE; QUALIFIED captain C1 and first officer C2; ACCEPTED INSURANCE_COI valid_until 2027-01-01"
            - "T1 OWNER_USE SCHEDULED occupying [2026-08-10T08:00, 2026-08-10T12:00]"
            - "T2 OWNER_USE (departure 2026-08-10T13:00, est 4.0h) with crew assigned — gap to T1 exactly 1.0h"
            - "T3 OWNER_USE (departure 2026-08-10T17:30, est 2.0h) with crew assigned — gap to T2's [13:00,17:00] is 0.5h"
