  - method: GET
    path: "/platform/call-track-events/{eventId}"
    description: "Get a single call track event"
    roles: [PlatformOps, Advertiser, SupportAdmin]
    code: 200
    input: []
    output: CallTrackEvent
    side_effects: []

  - method: GET
    path: "/platform/attribution-reports"
    description: "List attribution reports; optional filters campaign_id, ad_account_id"
    roles: [PlatformOps, Advertiser, SupportAdmin]
    code: 200
    input: ["campaign_id?", "ad_account_id?"]
    output: AttributionReport[]
    side_effects: []

  - method: GET
    path: "/platform/attribution-reports/{reportId}"
    description: "Get a single attribution report"
    roles: [PlatformOps, Advertiser, SupportAdmin]
    code: 200
    input: []
    output: AttributionReport
    side_effects: []

  - method: POST
    path: "/platform/merge-requests/{mergeRequestId}/execute"
    description: "Execute the merge; OCC-guarded on duplicate page version; fires the three-hop merge cascade"
    roles: [SupportAdmin]
    code: 200
    input: [expected_duplicate_page_version]
    output: MergeRequest
    side_effects: ["increments duplicate BusinessPage.version by 1", "duplicate -> MERGED, merged_into_id set", "reviews re-pointed; survivor aggregates recomputed", "duplicate ad account CLOSED + campaigns CANCELLED", "duplicate alerts LIFTED, claims EXPIRED, pending merges REJECTED"]

  - method: POST
    path: "/platform/merge-requests/{mergeRequestId}/reject"
    description: "Reject a PENDING merge request"
    roles: [SupportAdmin]
    code: 200
    input: []
    output: MergeRequest
    side_effects: ["status -> REJECTED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, bad type, bad enum, text too short, rating outside [1,5], ends_on < starts_on" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state does not permit the operation per §1.2" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_PAGE_NOT_ACTIVE, http: 409, condition: "Review submission on a CLOSED/MERGED page, or page under ACTIVE consumer-alert review cooldown" }
  - { id: ERR_USER_NOT_ACTIVE, http: 409, condition: "Review submission by a SUSPENDED or PURGED author" }
  - { id: ERR_SOLICITATION_SUSPECT, http: 422, condition: "Author is the page's claimed owner, or author has an OPEN/INVESTIGATING solicitation case targeting their reviews on this page" }
  - { id: ERR_REVIEW_EVIDENCE_LOCKED, http: 409, condition: "Attempt to move an evidence_confirmed review to DISPLAYED" }
  - { id: ERR_EDIT_WINDOW_EXPIRED, http: 410, condition: "Review edit attempted more than 72h after submitted_at" }
  - { id: ERR_CLAIM_CONFLICT, http: 409, condition: "CLAIM on an already-claimed page, TRANSFER on an unclaimed page or by the current owner, claim on non-ACTIVE page, or an open claim already exists on the page" }
  - { id: ERR_VERIFICATION_EXPIRED, http: 410, condition: "Claim verify attempted after created_at + 7 days, or verification_code mismatch" }
  - { id: ERR_AD_ACCOUNT_CONFLICT, http: 409, condition: "Ad account create by non-owner, on unclaimed page, or page already has an ad account" }
  - { id: ERR_CAMPAIGN_CONFIG, http: 422, condition: "kind/call_tracking_enabled mismatch (CALL_TRACKING requires true; SPONSORED_PLACEMENT requires false)" }
  - { id: ERR_CAMPAIGN_OUT_OF_WINDOW, http: 409, condition: "Campaign activate outside [starts_on, ends_on] (logical date)" }
  - { id: ERR_CAMPAIGN_NOT_CALL_TRACKING, http: 422, condition: "Call event against a SPONSORED_PLACEMENT campaign or a non-ACTIVE campaign" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Charge would push spent_today_cents strictly above daily_budget_cents" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different campaign_id on the same account" }
  - { id: ERR_ATTRIBUTION_WINDOW, http: 422, condition: "called_at date outside the campaign's [starts_on, ends_on]" }
  - { id: ERR_COMPLAINT_CONFLICT, http: 409, condition: "Complaint by non-owner, review not on page, FILTERED_DISPUTE on a non-FILTERED review, or an open complaint already exists on the review" }
  - { id: ERR_REVIEW_STATE_CHANGED, http: 409, condition: "UPHOLD_FILTER resolve on a FILTERED_DISPUTE whose review is no longer FILTERED" }
  - { id: ERR_SELF_ACTION, http: 403, condition: "Segregation-of-duties violation: moderator decides own-filed complaint, or investigator confirms own-reported case" }
  - { id: ERR_CASE_TARGETS_INVALID, http: 422, condition: "Solicitation case targets empty, >10, duplicated, cross-page, or REMOVED reviews" }
  - { id: ERR_ALERT_CONFLICT, http: 409, condition: "Alert placement with SOLICITATION_EVIDENCE lacking a CONFIRMED case, or same-kind ACTIVE alert already on page" }
  - { id: ERR_ALERT_CASE_ACTIVE, http: 409, condition: "Lifting a case-linked alert whose case is not DISMISSED" }
  - { id: ERR_MEDIA_REQUEST_REFUSED, http: 422, condition: "Identity request with channel == MEDIA, or legal_process_ref missing for legal channels / present for MEDIA" }
  - { id: ERR_NOTICE_PERIOD_ACTIVE, http: 409, condition: "LEGAL_SUBPOENA release attempted before notice_deadline" }
  - { id: ERR_MERGE_CONFLICT, http: 409, condition: "Merge with same page twice, non-ACTIVE page, or a PENDING merge already references either page" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformOps
    description: "Platform operations agent; seeds users/pages, drives the logical clock, runs recommendation evaluation, purges/suspends users"
    identity: "opaque"
    exclusive_operations: ["_clock/set_current_utc", "users create/suspend/purge/trust-adjustments", "business-pages create", "reviews evaluate"]
    shared_operations: ["read-most GETs", "impressions/call-events/attribution-reports create"]

  - name: Reviewer
    description: "A review author; X-User-ID equals the User.id of the author"
    identity: "entity_backed:User"
    exclusive_operations: ["submit review", "edit own PENDING review"]
    shared_operations: ["read pages/reviews/alerts/users"]

  - name: BusinessOwner
    description: "A business owner; X-User-ID equals User.id; must equal page.claimed_by_user_id for owner-gated ops"
    identity: "entity_backed:User"
    exclusive_operations: ["page info PATCH (owner)", "page claims submit/verify", "ad-account create", "complaints file"]
    shared_operations: ["read pages/reviews/claims/complaints/alerts"]

  - name: Advertiser
    description: "Ad account operator; X-User-ID equals User.id and must equal ad_account.owner_user_id for account/campaign mutations"
    identity: "entity_backed:User"
    exclusive_operations: ["campaign create/activate/pause/cancel", "ad-account reactivate/close"]
    shared_operations: ["impressions/call-events/attribution-reports create", "read ad resources"]

  - name: ContentModerator
    description: "Complaint queue moderator; cannot decide a complaint filed by themselves (segregation of duties)"
    identity: "opaque"
    exclusive_operations: ["complaints start-review/escalate/resolve/reject"]
    shared_operations: ["read pages/reviews/complaints/alerts/users"]

  - name: TrustInvestigator
    description: "Trust & safety investigator for solicitation cases; cannot confirm a case they reported"
    identity: "opaque"
    exclusive_operations: ["solicitation-cases investigate/confirm/dismiss"]
    shared_operations: ["read pages/reviews/cases/alerts/users"]

  - name: SupportAdmin
    description: "Support administrator; approves claims, closes pages, places/lifts alerts, executes merges, suspends ad accounts"
    identity: "opaque"
    exclusive_operations: ["page-claims approve/reject", "business-pages close", "consumer-alerts place/lift", "merge-requests create/execute/reject", "ad-accounts suspend"]
    shared_operations: ["read pages/claims/complaints/cases/alerts/ad resources/merge-requests"]

  - name: LegalOps
    description: "Legal operations for identity requests"
    identity: "opaque"
    exclusive_operations: ["identity-requests create/start-review/send-notice/release/decline/withdraw"]
    shared_operations: ["read pages/reviews/users/alerts"]

  - name: Reporter
    description: "Any user reporting solicitation evidence; X-User-ID equals User.id"
    identity: "entity_backed:User"
    exclusive_operations: ["solicitation-cases create"]
    shared_operations: ["read pages/reviews/alerts/users"]
