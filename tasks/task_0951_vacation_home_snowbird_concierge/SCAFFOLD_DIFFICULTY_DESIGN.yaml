  - rule_id: resource_temporal_overlap
    instances:
      - name: reschedule_into_padded_turnover_window_rejected_half_open_geometry
        grounds:
          - calculations.turnover_overlap_detection
          - validations[priority=65]
          - errors[ERR_TURNOVER_WINDOW_OVERLAP]
          - state_machines.Visit.DEFERRED_to_SCHEDULED
          - entities.RentalTurnover.fields.checkin_at
        distinguishing_aspect: |
          Interval semantics 1 on the RentalTurnover resource: HALF-OPEN, STRICT inequalities
          with a symmetric 90-minute pad on BOTH edges. A reschedule that places the visit
          strictly inside [checkout_at - 90m, checkin_at + 90m] collides, while the touching
          instants do not. This geometry differs from the AccessGrant rule (closed, aggregate
          capacity) and from the VendorAssignment rule (closed, exclusive, unpadded).
        test_recipe:
          setup:
            - "A rental-enrolled Z2 Property with an ACTIVE STANDARD subscription."
            - "A BOOKED RentalTurnover with checkout_at 2026-06-10T11:00:00Z and checkin_at 2026-06-12T15:00:00Z."
            - "One ROUTINE_WATCH visit scheduled well clear of the turnover and then DEFERRED."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Sam Snowbird", email: "sam@example.com", phone: "+15550117", primary_residence_state: "VA" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
