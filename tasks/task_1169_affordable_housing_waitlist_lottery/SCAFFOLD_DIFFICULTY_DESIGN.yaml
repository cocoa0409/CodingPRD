  # ---------------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_closed_campaign_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_CAMPAIGN_NOT_OPEN]
          - errors[ERR_APPLICATION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair (state vs business_temporal): the campaign is CLOSED (state violation)
          AND the logical clock is past application_close_at (temporal violation); priority 6
          beats priority 8, so the winner is ERR_CAMPAIGN_NOT_OPEN, not ERR_APPLICATION_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "Campaign ran its window and was CLOSED at 2026-06-30; logical clock now 2026-07-05 (past close_at); a registered applicant tries to apply"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
