scenario: |
  On-Site Additive Construction Printing & Permitting (ICON): site preparation,
  foundation work and printer setup with leveling and gantry assembly, structural
  design adapted to printed wall systems with engineering review and code
  compliance pathways, material mix formulation with pumping consistency, cure
  timing and weather sensitivity during a print, jurisdictional permitting where
  printed construction lacks a prescriptive code path requiring alternative means
  approval, print scheduling with continuous operation requirements and
  interruption handling, integration of conventional trades for roof, mechanical,
  electrical and plumbing after printing, quality inspection of layer bonding and
  dimensional tolerance, community-scale deployments with repeated plans and
  learning curve effects

domain_name: site-additive-construction
api_prefix: /construction

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - pagination_with_filtering
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Stable jurisdiction code, unique (e.g. 'AUS-TX-TRAVIS')", constraints: "unique per Jurisdiction" }
      - { name: name, type: string, source: input, description: "Human-readable name" }
      - { name: permits_prescriptive_printed_path, type: boolean, source: input, description: "true iff this jurisdiction has a prescriptive building-code path for printed wall systems" }
      - { name: alternative_means_review_days, type: integer, source: input, description: "Jurisdictional SLA days for alternative-means review", constraints: ">= 1" }
      - { name: weather_station_id, type: string, source: input, description: "External weather station identifier used for gating" }
      - { name: status, type: enum, source: system, description: "Always ACTIVE (jurisdiction suspend removed from surface)", default: "ACTIVE" }

  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "References Jurisdiction.id; the permitting authority for this site" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: community_deployment_id, type: string, source: input, description: "References CommunityDeployment.id; null for stand-alone sites", required: false }
      - { name: soil_class, type: enum, source: input, description: "A | B | C | D per geotech report" }
      - { name: foundation_kind, type: enum, source: input, description: "SLAB | PIER_AND_BEAM | FOOTING" }
      - { name: status, type: enum, source: system, description: "REGISTERED | FOUNDATION_POURED | FOUNDATION_CURED | SITE_READY | ACTIVE_PRINT | COMPLETED | SUSPENDED", default: "REGISTERED" }
      - { name: foundation_poured_at, type: datetime, source: system, description: "When foundation was poured", required: false }
      - { name: foundation_cured_at, type: datetime, source: system, description: "When foundation reached cure spec (computed from poured_at + cure hours)", required: false }
      - { name: posture, type: enum, source: computed, description: "OPERATING | PRECAUTIONARY | STOP — derived from active weather violations, open stop-work items, and failed layer inspections awaiting disposition" }

  - name: CommunityDeployment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Deployment name" }
      - { name: jurisdiction_id, type: string, source: input, description: "References Jurisdiction.id; all sites in this deployment share the jurisdiction" }
      - { name: plan_id, type: string, source: input, description: "References StructuralPlan.id; the repeated plan printed on every site" }
      - { name: status, type: enum, source: system, description: "PLANNING | ACTIVE | CLOSED", default: "PLANNING" }
      - { name: planned_unit_count, type: integer, source: input, description: "Total units planned", constraints: ">= 2" }
      - { name: completed_unit_count, type: integer, source: computed, description: "Sites in this deployment that reached COMPLETED" }
      - { name: learning_curve_baseline_minutes, type: integer, source: computed, description: "Median print duration in minutes over the first BASELINE_WINDOW completed units; null until >= BASELINE_WINDOW units complete" }
      - { name: learning_curve_factor, type: number, source: computed, description: "Round_half_up( ratio of latest 3-unit rolling average to baseline, 4 decimals ); null until baseline exists" }
      - { name: learning_curve_variant, type: enum, source: system, description: "FORWARD_LOOKING | CHRONOLOGICAL — selects which dual-variant learning curve the deployment reports", default: "FORWARD_LOOKING" }

  - name: StructuralPlan
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: structural_system, type: enum, source: input, description: "PRINTED_WALL | PRINTED_WALL_WITH_CONVENTIONAL_ROOF | HYBRID" }
      - { name: wall_thickness_mm, type: integer, source: input, description: "Nominal wall thickness", constraints: ">= 50" }
      - { name: wall_height_mm, type: integer, source: input, description: "Nominal wall height", constraints: ">= 2000" }
      - { name: plan_area_m2, type: number, source: input, description: "Floor area", constraints: "> 0" }
      - { name: current_revision_id, type: string, source: computed, description: "References PlanRevision.id; latest non-VOIDED revision by created_at; null before first revision", required: false }
      - { name: approved_revision_id, type: string, source: computed, description: "References PlanRevision.id; latest APPROVED revision by created_at; null until one is approved", required: false }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | APPROVED | SUPERSEDED", default: "DRAFT" }

  - name: PlanRevision
    parent: StructuralPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "References StructuralPlan.id" }
      - { name: supersedes_revision_id, type: string, source: input, description: "References PlanRevision.id; the revision this one replaces", required: false }
      - { name: revision_number, type: integer, source: computed, description: "1 + count of prior non-VOIDED revisions on this plan (chronological by created_at)" }
      - { name: engineering_notes, type: string, source: input, description: "Free-form engineering summary" }
      - { name: required_code_path, type: enum, source: input, description: "PRESCRIPTIVE | ALTERNATIVE_MEANS — determined by engineer based on jurisdiction capability" }
      - { name: engineer_reviewer_id, type: string, source: system, description: "X-User-ID of the ENGINEER who submitted for review" }
      - { name: approval_reviewer_id, type: string, source: system, description: "X-User-ID of the ENGINEER who last transitioned this revision to APPROVED or REJECTED; null until decided", required: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | VOIDED", default: "DRAFT" }

  - name: PermitApplication
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: plan_revision_id, type: string, source: input, description: "References PlanRevision.id; the engineering revision under review" }
      - { name: requested_path, type: enum, source: input, description: "PRESCRIPTIVE | ALTERNATIVE_MEANS" }
      - { name: granted_path, type: enum, source: system, description: "PRESCRIPTIVE | ALTERNATIVE_MEANS — may differ from requested_path when jurisdiction routes to AM", required: false }
      - { name: review_round, type: integer, source: computed, description: "Increments on every RESUBMITTED transition" }
      - { name: am_submitted_at, type: datetime, source: system, description: "When ALTERNATIVE_MEANS dossier was submitted (clock-set); null otherwise", required: false }
      - { name: am_decision_due_at, type: datetime, source: computed, description: "am_submitted_at + jurisdiction.alternative_means_review_days; null until AM submission", required: false }
      - { name: fee_due_cents, type: integer, source: computed, description: "Permit fee per fee_schedule; recomputed on submission and on resubmission" }
      - { name: fee_paid_cents, type: integer, source: computed, description: "Sum of FEE_PAYMENT ledger entries posted against this application" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | AM_REVIEW | RESUBMIT_REQUIRED | APPROVED | DENIED | WITHDRAWN", default: "DRAFT" }

  - name: PrinterSetup
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: gantry_model, type: enum, source: input, description: "VULCAN_II | VULCAN_III | PHOENIX" }
      - { name: rail_span_mm, type: integer, source: input, description: "Gantry rail span", constraints: ">= 5000" }
      - { name: leveling_tolerance_mm, type: number, source: input, description: "Max permitted rail level deviation", constraints: "> 0" }
      - { name: measured_level_deviation_mm, type: number, source: input, description: "Actual deviation after leveling" }
      - { name: is_within_tolerance, type: boolean, source: computed, description: "measured_level_deviation_mm <= leveling_tolerance_mm" }
      - { name: status, type: enum, source: system, description: "ASSEMBLED | LEVELED | QUALIFIED", default: "ASSEMBLED" }

  - name: MaterialBatch
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: mix_code, type: enum, source: input, description: "LAVACRETE_A | LAVACRETE_B | LAVACRETE_C" }
      - { name: water_cement_ratio, type: number, source: input, description: "w/c ratio", constraints: "0.30 <= wc <= 0.60" }
      - { name: target_slump_mm, type: integer, source: input, description: "Target slump", constraints: ">= 50" }
      - { name: measured_slump_mm, type: integer, source: input, description: "Measured slump before pump" }
      - { name: slump_within_band, type: boolean, source: computed, description: "abs(measured_slump_mm - target_slump_mm) <= SLUMP_TOLERANCE_MM" }
      - { name: pump_consistency_kg_per_min, type: number, source: input, description: "Observed mass flow at nozzle" }
      - { name: pump_window_kg_per_min, type: array, source: computed, description: "[min, max] permitted flow derived from mix_code" }
      - { name: is_pumpable, type: boolean, source: computed, description: "slump_within_band AND pump_window[0] <= pump_consistency_kg_per_min <= pump_window[1]" }
      - { name: status, type: enum, source: system, description: "PROPORTIONED | QUALIFIED | EXHAUSTED", default: "PROPORTIONED" }

  - name: WeatherObservation
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: observed_at, type: datetime, source: input, description: "When the sample was taken (UTC)" }
      - { name: air_temp_c, type: number, source: input, description: "Air temperature, Celsius" }
      - { name: relative_humidity_pct, type: number, source: input, description: "0..100" }
      - { name: wind_speed_mps, type: number, source: input, description: "Wind speed in m/s" }
      - { name: precipitation_mm, type: number, source: input, description: "Precipitation in mm over the sample window", constraints: ">= 0" }
      - { name: is_print_permissible, type: boolean, source: computed, description: "TRUE iff ALL: 4 <= air_temp_c <= 38; relative_humidity_pct <= 90; wind_speed_mps <= 12; precipitation_mm == 0" }

  - name: PrintJob
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: plan_revision_id, type: string, source: input, description: "References PlanRevision.id; MUST be Site's permit application's approved revision at schedule time" }
      - { name: printer_setup_id, type: string, source: input, description: "References PrinterSetup.id; MUST be QUALIFIED" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Scheduled start" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "Scheduled end" }
      - { name: actual_start_at, type: datetime, source: system, description: "When print actually started", required: false }
      - { name: actual_end_at, type: datetime, source: system, description: "When print actually completed", required: false }
      - { name: total_layers_planned, type: integer, source: input, description: "Computed upstream from plan", constraints: ">= 1" }
      - { name: layers_printed, type: integer, source: system, description: "Cumulative layer count (driven by LayerInspection records and interruptions)", default: 0 }
      - { name: cumulative_interruption_minutes, type: integer, source: computed, description: "Sum of (resume_at - pause_at) over CLOSED PrintInterruptions on this job" }
      - { name: continuous_run_minutes, type: integer, source: computed, description: "(actual_end_at - actual_start_at) - cumulative_interruption_minutes; null until job COMPLETED", required: false }
      - { name: max_permissible_interruption_minutes, type: integer, source: computed, description: "From layer cure profile: MAX_INTERRUPTION_MIN by mix_code of batch at pause; tracked per pause" }
      - { name: posture, type: enum, source: computed, description: "READY | BLOCKED — derived from weather, batch pumpability, and overlapping print jobs on the site" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | READY_TO_PRINT | PRINTING | PAUSED | COMPLETED | ABORTED | CANCELLED", default: "SCHEDULED" }

  - name: PrintInterruption
    parent: PrintJob
    common_fields: true
    fields:
      - { name: print_job_id, type: string, source: system, description: "References PrintJob.id" }
      - { name: cause, type: enum, source: input, description: "WEATHER | MATERIAL | MECHANICAL | OPERATOR | INSPECTOR_HOLD" }
      - { name: paused_at, type: datetime, source: system, description: "When the pause began" }
      - { name: resumed_at, type: datetime, source: system, description: "When the pause ended; null while OPEN", required: false }
      - { name: duration_minutes, type: integer, source: computed, description: "resume_at - paused_at in whole minutes; null while OPEN", required: false }
      - { name: cure_penalty_layers, type: integer, source: computed, description: "ceil(duration_minutes / CURE_PENALTY_WINDOW_MIN) when cause is MATERIAL or WEATHER, else 0; null while OPEN", required: false }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | OVERRUN", default: "OPEN" }

  - name: LayerInspection
    parent: PrintJob
    common_fields: true
    fields:
      - { name: print_job_id, type: string, source: system, description: "References PrintJob.id" }
      - { name: layer_index_start, type: integer, source: input, description: "First layer in this inspected band (1-indexed)", constraints: ">= 1" }
      - { name: layer_index_end, type: integer, source: input, description: "Last layer in this inspected band", constraints: ">= layer_index_start" }
      - { name: bond_strength_mpa, type: number, source: input, description: "Measured interlayer bond strength" }
      - { name: dimensional_deviation_mm, type: number, source: input, description: "Max |measured - nominal| within band" }
      - { name: passes_bond, type: boolean, source: computed, description: "bond_strength_mpa >= BOND_MIN_MPA" }
      - { name: passes_dimensional, type: boolean, source: computed, description: "dimensional_deviation_mm <= DIM_TOL_MM" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL_BOND | FAIL_DIMENSIONAL | FAIL_BOTH — derived from passes_bond / passes_dimensional" }
      - { name: disposition, type: enum, source: system, description: "PENDING | ACCEPTED | REPAIR_REQUIRED | DEMOLISH_REQUIRED", default: "PENDING" }
      - { name: supersedes_inspection_id, type: string, source: input, description: "References LayerInspection.id for re-inspection after repair", required: false }

  - name: ConventionalTradeTask
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id" }
      - { name: trade, type: enum, source: input, description: "ROOF | ELECTRICAL | PLUMBING | MECHANICAL" }
      - { name: sequence_rank, type: integer, source: input, description: "Trade's ordering rank within site (lower runs first)", constraints: ">= 1" }
      - { name: earliest_start_at, type: datetime, source: input, description: "No-earlier-than start" }
      - { name: latest_end_at, type: datetime, source: input, description: "No-later-than completion" }
      - { name: depends_on_print_job_id, type: string, source: input, description: "References PrintJob.id; the print job this trade follows" }
      - { name: depends_on_trade_task_id, type: string, source: input, description: "References ConventionalTradeTask.id (self-referential); the prior trade task that must COMPLETE first", required: false }
      - { name: actual_start_at, type: datetime, source: system, description: "Actual start", required: false }
      - { name: actual_end_at, type: datetime, source: system, description: "Actual completion", required: false }
      - { name: is_startable, type: boolean, source: computed, description: "True iff: print job COMPLETED, all FAIL_* LayerInspections on it have disposition != PENDING, prior trade (if any) is COMPLETED, and now >= earliest_start_at" }
      - { name: start_blockers, type: array, source: computed, description: "Enum list: PRINT_INCOMPLETE | INSPECTION_PENDING | PRIOR_TRADE_INCOMPLETE | TOO_EARLY | SITE_STOPPED" }
      - { name: status, type: enum, source: system, description: "PLANNED | READY | IN_PROGRESS | COMPLETED | CANCELLED", default: "PLANNED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    initial_state: REGISTERED
    terminal_states: [COMPLETED, SUSPENDED]
    transitions:
      - from: REGISTERED
        to: FOUNDATION_POURED
        trigger: "POST /construction/sites/{id}/action (action=POUR_FOUNDATION)"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "foundation_poured_at = current logical clock"
          - "foundation_cured_at = foundation_poured_at + FOUNDATION_CURE_HOURS (scheduled)"
          - "Increments Site.version by 1"

      - from: FOUNDATION_POURED
        to: FOUNDATION_CURED
        trigger: "POST /construction/sites/{id}/action (action=CONFIRM_CURE) once logical clock >= foundation_cured_at"
        actor: SiteManager
        preconditions:
          - "current logical clock >= foundation_cured_at (ERR_FOUNDATION_NOT_CURED otherwise)"
        side_effects:
          - "Site.posture recomputes"

      - from: FOUNDATION_CURED
        to: SITE_READY
        trigger: "system event — POST /construction/sites/{id}/printer-setups/{setup_id}/advance (to_state=QUALIFIED) cascades a PrinterSetup to QUALIFIED"
        actor: system
        preconditions:
          - "Some PrinterSetup on this site has status == QUALIFIED"
        side_effects:
          - "Site.status = SITE_READY"

      - from: SITE_READY
        to: ACTIVE_PRINT
        trigger: "system event — a PrintJob on this Site transitions to PRINTING"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE_PRINT
        to: SITE_READY
        trigger: "system event — the only PRINTING/PAUSED PrintJob on this Site reaches COMPLETED, ABORTED, or CANCELLED AND no other print is active"
        actor: system
        preconditions: []
        side_effects: []

      - from: SITE_READY
        to: COMPLETED
        trigger: "POST /construction/sites/{id}/action (action=COMPLETE)"
        actor: SiteManager
        preconditions:
          - "Every PrintJob on this Site has status == COMPLETED"
          - "Every ConventionalTradeTask on this Site has status == COMPLETED"
          - "No LayerInspection on this Site's print jobs has disposition == PENDING or REPAIR_REQUIRED"
        side_effects:
          - "If Site.community_deployment_id is non-null: increments CommunityDeployment.completed_unit_count by 1"
          - "If CommunityDeployment.completed_unit_count reaches BASELINE_WINDOW: compute and freeze learning_curve_baseline_minutes"
          - "Recompute CommunityDeployment.learning_curve_factor"

      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /construction/sites/{id}/action (action=SUSPEND)"
        actor: PlatformAdmin
        preconditions:
          - "No PrintJob in PRINTING or PAUSED on this Site"
        side_effects:
          - "Open PrintJobs in SCHEDULED or READY_TO_PRINT cascade to CANCELLED"
          - "Open ConventionalTradeTasks in PLANNED or READY cascade to CANCELLED"
          - "Open PermitApplications in DRAFT or SUBMITTED or AM_REVIEW cascade to WITHDRAWN"

      - from: FOUNDATION_POURED
        to: SUSPENDED
        trigger: "POST /construction/sites/{id}/action (action=SUSPEND)"
        actor: PlatformAdmin
        preconditions: ["same as REGISTERED → SUSPENDED"]
        side_effects: ["same as REGISTERED → SUSPENDED"]

      - from: FOUNDATION_CURED
        to: SUSPENDED
        trigger: "POST /construction/sites/{id}/action (action=SUSPEND)"
        actor: PlatformAdmin
        preconditions: ["same as REGISTERED → SUSPENDED"]
        side_effects: ["same as REGISTERED → SUSPENDED"]

      - from: SITE_READY
        to: SUSPENDED
        trigger: "POST /construction/sites/{id}/action (action=SUSPEND)"
        actor: PlatformAdmin
        preconditions: ["same as REGISTERED → SUSPENDED"]
        side_effects: ["same as REGISTERED → SUSPENDED"]

  - entity: StructuralPlan
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /construction/structural-plans/{id}/revisions/{revision_id}/submit — when a PlanRevision of this plan transitions DRAFT → SUBMITTED"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system event — a PlanRevision on this plan transitions SUBMITTED → APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "approved_revision_id = the approved PlanRevision.id"
          - "current_revision_id = the approved PlanRevision.id"
          - "Any prior APPROVED PlanRevision on this plan transitions APPROVED → VOIDED (replaced by the new approval)"

      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "system event — a PlanRevision on this plan transitions SUBMITTED → REJECTED AND no other PlanRevision on this plan is SUBMITTED or APPROVED"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event — a NEWER PlanRevision on this plan transitions SUBMITTED → APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Prior approved_revision_id moves to PlanRevision VOIDED (cascaded by the new approval)"

      - from: SUPERSEDED
        to: APPROVED
        trigger: "system event — allowed only when the previously-superseding PlanRevision is itself VOIDED by reviewer action AND no other revision is APPROVED"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: ARCHIVED
        trigger: "POST /construction/structural-plans/{id}/archive"
        actor: PlatformAdmin
        preconditions:
          - "No PermitApplication referencing any PlanRevision of this plan is in SUBMITTED or AM_REVIEW"
          - "No PrintJob with plan_revision_id on this plan is in SCHEDULED, READY_TO_PRINT, PRINTING, or PAUSED"
        side_effects: []

      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /construction/structural-plans/{id}/archive"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: PlanRevision
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /construction/structural-plans/{id}/revisions/{revision_id}/action (action=SUBMIT)"
        actor: Engineer
        preconditions:
          - "No other PlanRevision on this plan is currently SUBMITTED (ERR_CONCURRENT_REVIEW)"
        side_effects:
          - "engineer_reviewer_id = X-User-ID of submitter"
          - "StructuralPlan.status transitions DRAFT → UNDER_REVIEW (if currently DRAFT)"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /construction/structural-plans/{id}/revisions/{revision_id}/action (action=APPROVE)"
        actor: Engineer
        preconditions:
          - "Segregation of duties: X-User-ID of decider MUST NOT equal engineer_reviewer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If required_code_path == PRESCRIPTIVE AND Jurisdiction.permits_prescriptive_printed_path == false for the site where this revision is later used, the permit application will be rerouted to ALTERNATIVE_MEANS"
        side_effects:
          - "approval_reviewer_id = X-User-ID of decider"
          - "StructuralPlan transitions to APPROVED"
          - "Prior APPROVED PlanRevision on the same plan (if any) transitions APPROVED → VOIDED"
          - "StructuralPlan.approved_revision_id and current_revision_id updated"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /construction/structural-plans/{id}/revisions/{revision_id}/action (action=REJECT)"
        actor: Engineer
        preconditions:
          - "Segregation of duties: decider != engineer_reviewer_id"
        side_effects:
          - "approval_reviewer_id = X-User-ID of decider"
          - "If no other PlanRevision on the plan is SUBMITTED or APPROVED: StructuralPlan transitions to DRAFT"

      - from: APPROVED
        to: VOIDED
        trigger: "system event — a newer PlanRevision on the same plan transitions SUBMITTED → APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Any PermitApplication referencing this revision and still in DRAFT or SUBMITTED cascades to WITHDRAWN (ERR_PERMIT_REVISION_SUPERSEDED on subsequent submissions)"

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=SUBMIT)"
        actor: PermitCoordinator
        preconditions:
          - "PlanRevision referenced by plan_revision_id is APPROVED"
          - "Site.jurisdiction.status == ACTIVE"
          - "If requested_path == PRESCRIPTIVE AND Jurisdiction.permits_prescriptive_printed_path == false: server reroutes to ALTERNATIVE_MEANS, granted_path stays null, status goes to AM_REVIEW (not SUBMITTED)"
          - "If requested_path == ALTERNATIVE_MEANS: status goes to AM_REVIEW directly"
        side_effects:
          - "fee_due_cents = permit_fee_calculation(this application)"
          - "am_submitted_at = current logical clock if routed to AM_REVIEW; am_decision_due_at computed from Jurisdiction.alternative_means_review_days"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=DECIDE, decision=APPROVE)"
        actor: JurisdictionReviewer
        preconditions:
          - "fee_paid_cents >= fee_due_cents (ERR_PERMIT_FEE_OUTSTANDING)"
        side_effects:
          - "granted_path = PRESCRIPTIVE"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=DECIDE, decision=DENY)"
        actor: JurisdictionReviewer
        preconditions: []
        side_effects: []

      - from: AM_REVIEW
        to: APPROVED
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=DECIDE, decision=APPROVE)"
        actor: JurisdictionReviewer
        preconditions:
          - "fee_paid_cents >= fee_due_cents"
          - "current logical clock <= am_decision_due_at (ERR_AM_REVIEW_EXPIRED if past due — application must be RESUBMIT_REQUIRED instead)"
        side_effects:
          - "granted_path = ALTERNATIVE_MEANS"

      - from: AM_REVIEW
        to: DENIED
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=DECIDE, decision=DENY)"
        actor: JurisdictionReviewer
        preconditions: []
        side_effects: []

      - from: AM_REVIEW
        to: RESUBMIT_REQUIRED
        trigger: "system event — logical clock passes am_decision_due_at without a decision (auto-transition on first read/write after due)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESUBMIT_REQUIRED
        to: AM_REVIEW
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=RESUBMIT)"
        actor: PermitCoordinator
        preconditions:
          - "review_round < MAX_AM_REVIEW_ROUNDS"
        side_effects:
          - "review_round += 1"
          - "fee_due_cents = permit_fee_calculation(this application) (resubmission re-prices)"
          - "am_submitted_at = current logical clock; am_decision_due_at recomputed"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=WITHDRAW)"
        actor: PermitCoordinator
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=WITHDRAW)"
        actor: PermitCoordinator
        preconditions: []
        side_effects:
          - "fee_paid_cents is non-refundable"

      - from: AM_REVIEW
        to: WITHDRAWN
        trigger: "POST /construction/sites/{id}/permit-applications/{application_id}/action (action=WITHDRAW)"
        actor: PermitCoordinator
        preconditions: []
        side_effects:
          - "fee_paid_cents is non-refundable"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "system event — referenced PlanRevision transitions APPROVED → VOIDED while this application is in DRAFT"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system event — referenced PlanRevision transitions APPROVED → VOIDED while this application is in SUBMITTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrinterSetup
    initial_state: ASSEMBLED
    terminal_states: []
    transitions:
      - from: ASSEMBLED
        to: LEVELED
        trigger: "POST /construction/sites/{id}/printer-setups/{setup_id}/advance (to_state=LEVELED)"
        actor: PrintOperator
        preconditions:
          - "Site.status in {FOUNDATION_POURED, FOUNDATION_CURED, SITE_READY}"
        side_effects:
          - "is_within_tolerance computed from measured_level_deviation_mm vs leveling_tolerance_mm"
          - "Increments Site.version by 1"

      - from: LEVELED
        to: QUALIFIED
        trigger: "POST /construction/sites/{id}/printer-setups/{setup_id}/advance (to_state=QUALIFIED)"
        actor: PrintOperator
        preconditions:
          - "is_within_tolerance == true (ERR_LEVELING_OUT_OF_TOLERANCE otherwise)"
          - "Site.status == FOUNDATION_CURED or SITE_READY (ERR_FOUNDATION_NOT_CURED)"
        side_effects:
          - "Site.status transitions FOUNDATION_CURED → SITE_READY (if not already SITE_READY)"

      - from: QUALIFIED
        to: DEMOBILIZED
        trigger: "POST /construction/sites/{site_id}/printer-setups/{id}/demobilize"
        actor: PrintOperator
        preconditions:
          - "No PrintJob referencing this printer_setup_id is in SCHEDULED, READY_TO_PRINT, PRINTING, or PAUSED"
        side_effects: []

      - from: ASSEMBLED
        to: DEMOBILIZED
        trigger: "POST /construction/sites/{site_id}/printer-setups/{id}/demobilize"
        actor: PrintOperator
        preconditions: []
        side_effects: []

      - from: LEVELED
        to: DEMOBILIZED
        trigger: "POST /construction/sites/{site_id}/printer-setups/{id}/demobilize"
        actor: PrintOperator
        preconditions: []
        side_effects: []

  - entity: MaterialBatch
    initial_state: PROPORTIONED
    terminal_states: [EXHAUSTED]
    transitions:
      - from: PROPORTIONED
        to: QUALIFIED
        trigger: "POST /construction/sites/{site_id}/material-batches/{id}/qualify"
        actor: PrintOperator
        preconditions:
          - "is_pumpable == true (ERR_BATCH_NOT_PUMPABLE otherwise)"
          - "Site.status in {FOUNDATION_CURED, SITE_READY, ACTIVE_PRINT}"
        side_effects: []

      - from: PROPORTIONED
        to: REJECTED
        trigger: "POST /construction/sites/{site_id}/material-batches/{id}/reject"
        actor: PrintOperator
        preconditions: []
        side_effects: []

      - from: QUALIFIED
        to: EXHAUSTED
        trigger: "system event — the PrintJob that consumed this batch reaches COMPLETED or ABORTED"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUALIFIED
        to: REJECTED
        trigger: "POST /construction/sites/{site_id}/material-batches/{id}/reject"
        actor: PrintOperator
        preconditions:
          - "No PrintJob in PRINTING or PAUSED is currently consuming this batch"
        side_effects: []

  - entity: PrintJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: READY_TO_PRINT
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=READY_TO_PRINT)"
        actor: PrintOperator
        preconditions:
          - "PermitApplication on this Site covering plan_revision_id has status == APPROVED (ERR_PERMIT_NOT_APPROVED)"
          - "PrinterSetup referenced is QUALIFIED"
          - "MaterialBatch available on this Site with status == QUALIFIED and is_pumpable == true"
          - "Latest WeatherObservation on this Site (by observed_at, tie-break created_at ASC) has is_print_permissible == true AND observed_at within WEATHER_OBSERVATION_VALID_MIN of current logical clock (ERR_WEATHER_NOT_PERMISSIBLE)"
          - "scheduled_start_at >= current logical clock AND scheduled_end_at > scheduled_start_at"
          - "No other PrintJob on this Site has overlapping [scheduled_start_at, scheduled_end_at) — half-open interval (ERR_PRINT_SCHEDULE_OVERLAP)"
        side_effects:
          - "posture = READY"

      - from: READY_TO_PRINT
        to: PRINTING
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=PRINTING)"
        actor: PrintOperator
        preconditions:
          - "current logical clock >= scheduled_start_at"
          - "Site.posture != STOP"
          - "Latest WeatherObservation is_print_permissible == true"
        side_effects:
          - "actual_start_at = current logical clock"
          - "Site.status transitions SITE_READY → ACTIVE_PRINT"

      - from: PRINTING
        to: PAUSED
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=PAUSED, cause=...)"
        actor: PrintOperator
        preconditions:
          - "cause provided"
        side_effects:
          - "Creates a PrintInterruption record with status=OPEN, paused_at = current logical clock"
          - "If cause == WEATHER: Site.posture recomputes"

      - from: PAUSED
        to: PRINTING
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=PRINTING from PAUSED)"
        actor: PrintOperator
        preconditions:
          - "The OPEN PrintInterruption on this job has duration_minutes <= max_permissible_interruption_minutes (ERR_INTERRUPTION_CURE_EXCEEDED otherwise — job must transition to ABORTED)"
          - "Latest WeatherObservation is_print_permissible == true"
          - "If interruption cause was MATERIAL: a fresh QUALIFIED MaterialBatch exists"
        side_effects:
          - "Open PrintInterruption transitions OPEN → CLOSED; resumed_at, duration_minutes, cure_penalty_layers computed"
          - "cumulative_interruption_minutes on PrintJob recomputed"
          - "If cumulative_interruption_minutes > HARD_INTERRUPTION_CAP_MIN: job auto-transitions to ABORTED (cascade, see below)"

      - from: PAUSED
        to: ABORTED
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=ABORTED)"
        actor: PrintOperator
        preconditions: []
        side_effects:
          - "Open PrintInterruption transitions OPEN → CLOSED with resumed_at = current logical clock"
          - "MaterialBatch being consumed transitions QUALIFIED → EXHAUSTED"
          - "Site.status recomputes (ACTIVE_PRINT → SITE_READY if no other active print)"

      - from: PRINTING
        to: ABORTED
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=ABORTED)"
        actor: PrintOperator
        preconditions: []
        side_effects:
          - "Same as PAUSED → ABORTED"
          - "If resume precondition ERR_INTERRUPTION_CURE_EXCEEDED would fire and operator instead issues abort, this transition is the correct recovery"

      - from: PRINTING
        to: COMPLETED
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=COMPLETED)"
        actor: PrintOperator
        preconditions:
          - "layers_printed >= total_layers_planned (ERR_PRINT_INCOMPLETE)"
          - "All LayerInspections on this job have disposition != PENDING"
          - "No LayerInspection on this job has disposition == DEMOLISH_REQUIRED"
        side_effects:
          - "actual_end_at = current logical clock"
          - "continuous_run_minutes computed"
          - "MaterialBatch consumed transitions QUALIFIED → EXHAUSTED"
          - "Site.status recomputes"
          - "If Site.community_deployment_id is non-null: CommunityDeployment.learning_curve_factor recomputes (chronological vs forward_looking variant)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=CANCELLED)"
        actor: PrintOperator
        preconditions: []
        side_effects: []

      - from: READY_TO_PRINT
        to: CANCELLED
        trigger: "POST /construction/sites/{id}/print-jobs/{job_id}/transition (to_state=CANCELLED)"
        actor: PrintOperator
        preconditions: []
        side_effects: []

  - entity: PrintInterruption
    initial_state: OPEN
    terminal_states: [CLOSED, OVERRUN]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system event — parent PrintJob transitions PAUSED → PRINTING or PAUSED → ABORTED"
        actor: system
        preconditions: []
        side_effects:
          - "resumed_at, duration_minutes, cure_penalty_layers computed"

      - from: OPEN
        to: OVERRUN
        trigger: "system event — current logical clock - paused_at > max_permissible_interruption_minutes AND parent PrintJob still PAUSED (auto-flagged on first read/write after threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent PrintJob posture becomes BLOCKED; resume attempts return ERR_INTERRUPTION_CURE_EXCEEDED"

  - entity: LayerInspection
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /construction/sites/{site_id}/print-jobs/{job_id}/layer-inspections/{id}/disposition (disposition=ACCEPTED)"
        actor: QualityInspector
        preconditions:
          - "outcome == PASS (ERR_INSPECTION_NOT_PASSING otherwise)"
        side_effects:
          - "Site.posture recomputes"

      - from: PENDING
        to: REPAIR_REQUIRED
        trigger: "POST /construction/sites/{site_id}/print-jobs/{job_id}/layer-inspections/{id}/disposition (disposition=REPAIR_REQUIRED)"
        actor: QualityInspector
        preconditions:
          - "outcome != PASS"
        side_effects:
          - "Site.posture recomputes (REPAIR_REQUIRED contributes to PRECAUTIONARY)"

      - from: PENDING
        to: DEMOLISH_REQUIRED
        trigger: "POST /construction/sites/{site_id}/print-jobs/{job_id}/layer-inspections/{id}/disposition (disposition=DEMOLISH_REQUIRED)"
        actor: QualityInspector
        preconditions:
          - "outcome == FAIL_BOTH (only FAIL_BOTH may go to DEMOLISH_REQUIRED)"
        side_effects:
          - "Site.posture becomes STOP"
          - "Parent PrintJob completion is blocked (ERR_PRINT_INCOMPLETE on complete attempt)"

      - from: REPAIR_REQUIRED
        to: PENDING
        trigger: "POST /construction/sites/{site_id}/print-jobs/{job_id}/layer-inspections — creates a NEW LayerInspection whose supersedes_inspection_id points to this one (cyclic: re-inspection after repair)"
        actor: QualityInspector
        preconditions:
          - "New inspection's layer_index range overlaps the REPAIR_REQUIRED inspection's range"
        side_effects:
          - "Old inspection remains REPAIR_REQUIRED; new one enters PENDING"
          - "Site.posture recomputes"

  - entity: ConventionalTradeTask
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "system event — depends_on_print_job_id reaches COMPLETED AND all LayerInspections on it have disposition != PENDING AND (depends_on_trade_task_id is null OR depends_on_trade_task_id is COMPLETED) (auto-evaluated on every dependency change)"
        actor: system
        preconditions: []
        side_effects:
          - "is_startable recomputed"

      - from: READY
        to: IN_PROGRESS
        trigger: "POST /construction/sites/{id}/trade-tasks/{task_id}/transition (to_state=IN_PROGRESS)"
        actor: TradeContractor
        preconditions:
          - "current logical clock >= earliest_start_at (ERR_TRADE_TOO_EARLY)"
          - "Site.posture != STOP (ERR_POSTURE_BLOCKED)"
          - "is_startable == true"
        side_effects:
          - "actual_start_at = current logical clock"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /construction/sites/{id}/trade-tasks/{task_id}/transition (to_state=COMPLETED)"
        actor: TradeContractor
        preconditions:
          - "current logical clock <= latest_end_at (ERR_TRADE_OVERRUN)"
        side_effects:
          - "actual_end_at = current logical clock"
          - "Downstream ConventionalTradeTasks whose depends_on_trade_task_id == this.id transition PLANNED → READY (cascade re-evaluation)"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /construction/sites/{id}/trade-tasks/{task_id}/transition (to_state=CANCELLED)"
        actor: SiteManager
        preconditions: []
        side_effects:
          - "Downstream trade tasks cascade-evaluate: those with depends_on_trade_task_id == this.id remain PLANNED forever and are blocked"

      - from: READY
        to: CANCELLED
        trigger: "POST /construction/sites/{id}/trade-tasks/{task_id}/transition (to_state=CANCELLED)"
        actor: SiteManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: printer-setup-stale-site
    parent_entity: Site
    write_endpoint: "POST /construction/sites/{site_id}/printer-setups"
    occ_field: "expected_site_version"
    description: |
      Creating a PrinterSetup against a Site whose version has advanced since
      the client last observed it is rejected. Captures the case where a
      foundation pour or another setup write has just bumped Site.version and
      the current writer's view of foundation/level state is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: print-job-stale-site
    parent_entity: Site
    write_endpoint: "POST /construction/sites/{site_id}/print-jobs"
    occ_field: "expected_site_version"
    description: |
      Scheduling a PrintJob against a Site whose version has advanced since
      the client last observed it is rejected. Captures the case where a
      sibling write (permit approval, printer qualify, weather posting that
      recomputed posture) has bumped Site.version and the scheduler's view of
      site readiness is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: trade-task-stale-site
    parent_entity: Site
    write_endpoint: "POST /construction/sites/{site_id}/trade-tasks"
    occ_field: "expected_site_version"
    description: |
      Creating a ConventionalTradeTask against a Site whose version has
      advanced since the client last observed it is rejected. Captures the
      case where a print job completed (bumping Site.version) or a layer
      inspection was dispositioned, and the planner's view of post-print
      readiness is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee_calculation
    trigger: "PermitApplication submission (DRAFT → SUBMITTED or DRAFT → AM_REVIEW) and RESUBMIT_REQUIRED → AM_REVIEW"
    algorithm: tiered_pricing
    formula: |
      base_cents = BASE_PERMIT_FEE_CENTS
      area_component = floor(plan.plan_area_m2) * PER_M2_FEE_CENTS     # floor FIRST, then multiply
      am_surcharge = (routed to ALTERNATIVE_MEANS) ? AM_SURCHARGE_CENTS : 0
      round_multiplier = (review_round == 0) ? 1.0 : (1.0 + AM_RESUBMIT_MARKUP_PCT * review_round)
      fee_due_cents = round_half_up( (base_cents + area_component + am_surcharge) * round_multiplier, 0 )
      # Pinning: floor(plan_area_m2) BEFORE multiply. Review-round multiplier applies to the SUM (including AM surcharge), not just base.
    input_set: "This PermitApplication, its referenced PlanRevision's StructuralPlan, and the Jurisdiction"
    constants:
      BASE_PERMIT_FEE_CENTS: 250000
      PER_M2_FEE_CENTS: 4500
      AM_SURCHARGE_CENTS: 175000
      AM_RESUBMIT_MARKUP_PCT: 0.10
    precision: "integer cents; floor on area, round_half_up on the final multiplier pass"
    variants:
      - name: prescriptive_path
        when: "granted_path == PRESCRIPTIVE"
        difference: "am_surcharge = 0; multiplier still applies on resubmission"
      - name: alternative_means_path
        when: "routed or requested ALTERNATIVE_MEANS"
        difference: "am_surcharge included before round multiplier"

  - name: print_window_utilization
    trigger: "PrintJob completion (PRINTING → COMPLETED)"
    algorithm: weighted_scoring
    formula: |
      # Forward-looking variant: uses SCHEDULED window.
      # Chronological variant: uses ACTUAL window.
      # Both produce different results whenever the actual run overruns or underruns the schedule.
      fwd_util = continuous_run_minutes_forward_looking_estimate / max(1, scheduled_end_at - scheduled_start_at in minutes)
      chrono_util = continuous_run_minutes / max(1, actual_end_at - actual_start_at in minutes)
      # continuous_run_minutes_forward_looking_estimate uses the plan's layer count and rated print rate
      est_minutes = ceil(total_layers_planned * LAYER_PRINT_MIN_PER_LAYER)
      # final reported utilization depends on the variant selected at completion time:
      utilization = (variant == FORWARD_LOOKING) ? min(1.0, est_minutes / max(1, scheduled_duration_min)) : min(1.0, continuous_run_minutes / max(1, actual_duration_min))
    input_set: "The completed PrintJob and (for FORWARD_LOOKING) the originating StructuralPlan"
    constants:
      LAYER_PRINT_MIN_PER_LAYER: 8
    precision: "4 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "CommunityDeployment.learning_curve_variant == FORWARD_LOOKING at completion time"
        difference: "uses plan-estimated minutes over scheduled window — ignores actual overrun"
      - name: chronological
        when: "CommunityDeployment.learning_curve_variant == CHRONOLOGICAL"
        difference: "uses actual run minutes over actual window — captures real overrun"

  - name: learning_curve_factor
    trigger: "Site → COMPLETED (cascades to CommunityDeployment recompute) and after PrintJob completion when deployment has >= BASELINE_WINDOW completed units"
    algorithm: chronological
    formula: |
      # Process the deployment's COMPLETED sites in chronological order by Site.foundation_poured_at, tie-break created_at ASC.
      # baseline_minutes = median of continuous_run_minutes over the FIRST BASELINE_WINDOW completed units (frozen once computed)
      # latest_avg_minutes = mean of continuous_run_minutes over the LAST ROLLING_WINDOW completed units
      # learning_curve_factor = round_half_up( latest_avg_minutes / baseline_minutes, 4 )
      # A factor < 1 means the deployment is printing FASTER than baseline (learning).
      # A factor > 1 means regression.
      # Variant behavior:
      #   FORWARD_LOOKING: include currently PRINTING jobs in latest_avg_minutes using forward_looking estimate
      #   CHRONOLOGICAL:  only COMPLETED jobs
    input_set: "CommunityDeployment's Sites, their COMPLETED PrintJobs; FORWARD_LOOKING variant also reads PRINTING jobs"
    constants:
      BASELINE_WINDOW: 3
      ROLLING_WINDOW: 3
    precision: "4 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "deployment.learning_curve_variant == FORWARD_LOOKING"
        difference: "rolling average mixes in in-flight print jobs at their forward_looking estimate"
      - name: chronological
        when: "deployment.learning_curve_variant == CHRONOLOGICAL"
        difference: "rolling average uses only completed jobs' actual continuous_run_minutes"

  - name: posture_derivation
    trigger: "WeatherObservation created, LayerInspection dispositioned, PrintJob state changes, PermitApplication state changes, Site suspended"
    algorithm: constraint_propagation
    formula: |
      # Evaluated in priority order — first matching rule wins.
      # 1) Site.status == SUSPENDED → STOP
      # 2) Any LayerInspection on any PrintJob of this Site with disposition == DEMOLISH_REQUIRED → STOP
      # 3) Any PrintInterruption on any active PrintJob of this Site with status == OVERRUN → STOP
      # 4) Latest WeatherObservation (by observed_at, tie-break created_at ASC) has is_print_permissible == false AND any PrintJob in PRINTING/PAUSED → PRECAUTIONARY
      # 5) Any LayerInspection with disposition == REPAIR_REQUIRED → PRECAUTIONARY
      # 6) Otherwise → OPERATING
    input_set: "Site, its Jurisdiction, its WeatherObservations, its PrintJobs, LayerInspections, PrintInterruptions"
    constants: {}
    precision: "n/a"

  - name: print_schedule_overlap
    trigger: "PrintJob creation and ready transition"
    algorithm: interval_merge
    formula: |
      # For two PrintJobs A (new) and B (existing) on the same Site with statuses in
      # {SCHEDULED, READY_TO_PRINT, PRINTING, PAUSED}: reject A if
      #     A.scheduled_start_at < B.scheduled_end_at AND B.scheduled_start_at < A.scheduled_end_at
      # (Half-open [start, end) intervals; A.start == B.end is permitted — adjacent, no overlap.)
      # Different interval semantics from weather_observation_validity (which is point-in-time with a
      # trailing lookback window [observed_at, observed_at + WEATHER_OBSERVATION_VALID_MIN] INCLUSIVE).
    input_set: "All PrintJobs on this Site in non-terminal states"
    constants:
      WEATHER_OBSERVATION_VALID_MIN: 30
    precision: "datetime, second resolution"

  - name: cure_penalty_layers
    trigger: "PrintInterruption OPEN → CLOSED"
    algorithm: threshold
    formula: |
      # cure_penalty_layers applies only when cause in {WEATHER, MATERIAL}; else 0.
      # Layer bond degradation is step-wise per CURE_PENALTY_WINDOW_MIN chunk:
      #   cure_penalty_layers = ceil( duration_minutes / CURE_PENALTY_WINDOW_MIN )   for cause in {WEATHER, MATERIAL}
      #   cure_penalty_layers = 0                                                    for cause in {MECHANICAL, OPERATOR, INSPECTOR_HOLD}
      # Boundary precision: duration_minutes == CURE_PENALTY_WINDOW_MIN yields penalty 1, NOT 0;
      # duration_minutes == 0 yields penalty 0.
      # max_permissible_interruption_minutes for the OPEN interruption is computed from the
      # mix_code of the MaterialBatch consumed at pause time: {A: 30, B: 20, C: 45}.
    input_set: "The closing PrintInterruption and the MaterialBatch active on the parent PrintJob at pause time"
    constants:
      CURE_PENALTY_WINDOW_MIN: 10
      HARD_INTERRUPTION_CAP_MIN: 60
      MAX_INTERRUPTION_MIN_A: 30
      MAX_INTERRUPTION_MIN_B: 20
      MAX_INTERRUPTION_MIN_C: 45
    precision: "integer layers"

  - name: foundation_cure_completion
    trigger: "Site foundation pour → scheduled transition"
    algorithm: threshold
    formula: |
      # foundation_cured_at = foundation_poured_at + FOUNDATION_CURE_HOURS
      # The confirm-cure endpoint requires current_logical_clock >= foundation_cured_at (>=, INCLUSIVE boundary).
      # Contrast: trade_task earliest_start_at also uses >= (inclusive).
      # Contrast: trade_task latest_end_at uses <= (inclusive).
    input_set: "Site.foundation_poured_at and current logical clock"
    constants:
      FOUNDATION_CURE_HOURS: 72
    precision: "datetime, second resolution"

  - name: pumping_window
    trigger: "MaterialBatch qualify"
    algorithm: threshold
    formula: |
      # pump_window[min,max] by mix_code:
      #   LAVACRETE_A: [40, 60]
      #   LAVACRETE_B: [55, 75]
      #   LAVACRETE_C: [30, 50]
      # Boundary: pump_consistency_kg_per_min == window_min is PUMPABLE (>=, inclusive);
      # pump_consistency_kg_per_min == window_max is PUMPABLE (<=, inclusive).
      # Slump tolerance: |measured_slump_mm - target_slump_mm| <= SLUMP_TOLERANCE_MM (<=, inclusive).
    input_set: "The MaterialBatch being qualified"
    constants:
      SLUMP_TOLERANCE_MM: 15
    precision: "integer mm and kg/min"

  - name: layer_inspection_outcome
    trigger: "LayerInspection creation"
    algorithm: threshold
    formula: |
      # passes_bond := bond_strength_mpa >= BOND_MIN_MPA (inclusive)
      # passes_dimensional := dimensional_deviation_mm <= DIM_TOL_MM (inclusive)
      # outcome :=
      #   PASS              if passes_bond AND passes_dimensional
      #   FAIL_BOND         if NOT passes_bond AND passes_dimensional
      #   FAIL_DIMENSIONAL  if passes_bond AND NOT passes_dimensional
      #   FAIL_BOTH         if NOT passes_bond AND NOT passes_dimensional
    input_set: "The LayerInspection being created"
    constants:
      BOND_MIN_MPA: 1.5
      DIM_TOL_MM: 6
    precision: "1 decimal place MPa; integer mm"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Idempotency-Key header required on POST"
    error_id: ERR_MISSING_IDEMPOTENCY_KEY
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 3
    category: auth
    check: "Idempotency-Key reuse with a different request body is rejected"
    error_id: ERR_IDEMPOTENCY_REPLAY_MISMATCH
    http_status: 409
    applies_to: "all POST endpoints"

  - priority: 4
    category: existence
    check: "Path ids must exist and form a valid containment chain (site_id ∈ jurisdiction, job_id ∈ site_id, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 5
    category: auth
    check: "Role authorized for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 6
    category: business_safety
    check: "Site.posture != STOP for start/resume operations; Jurisdiction.status != SUSPENDED for submissions and pours"
    error_id: ERR_POSTURE_BLOCKED
    http_status: 409
    applies_to: "print-jobs/{id}/start, print-jobs/{id}/resume, trade-tasks/{id}/start, sites/{id}/foundation/pour, permit-applications/{id}/submit"

  - priority: 7
    category: business_temporal
    check: "AM decision within am_decision_due_at; trade task within [earliest_start_at, latest_end_at]; foundation cure reached"
    error_id: "ERR_AM_REVIEW_EXPIRED | ERR_TRADE_TOO_EARLY | ERR_TRADE_OVERRUN | ERR_FOUNDATION_NOT_CURED"
    http_status: 409
    applies_to: "permit decide, trade-tasks start/complete, foundation/confirm-cure"

  - priority: 8
    category: state
    check: "Source state is in transition's from-set; target entity not terminal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_referential
    check: "Referenced entities exist, are in compatible states, and form a valid FK chain (PlanRevision APPROVED; PrinterSetup QUALIFIED; MaterialBatch QUALIFIED; PermitApplication APPROVED covering plan_revision_id)"
    error_id: "ERR_PERMIT_NOT_APPROVED | ERR_PLAN_REVISION_NOT_APPROVED | ERR_PRINTER_NOT_QUALIFIED | ERR_BATCH_NOT_PUMPABLE | ERR_PERMIT_REVISION_SUPERSEDED"
    http_status: 409
    applies_to: "print-job create/ready, permit submit, printer qualify, batch qualify"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: PlanRevision decider != submitter (X-User-ID equality); QualityInspector cannot disposition their own LayerInspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "revisions/{id}/decide, layer-inspections/{id}/disposition"

  - priority: 11
    category: business_constraint
    check: "Schedule overlaps, leveling tolerance, slump/pump band, weather gating"
    error_id: "ERR_PRINT_SCHEDULE_OVERLAP | ERR_LEVELING_OUT_OF_TOLERANCE | ERR_WEATHER_NOT_PERMISSIBLE | ERR_BATCH_NOT_PUMPABLE"
    http_status: 409
    applies_to: "print-job create/ready, printer level, batch qualify, print-job start/resume"

  - priority: 12
    category: business_fiscal
    check: "Permit fee paid before decision to approve"
    error_id: ERR_PERMIT_FEE_OUTSTANDING
    http_status: 409
    applies_to: "permit-applications/{id}/decide (decision=APPROVE)"

  - priority: 13
    category: business_temporal
    check: "PrintInterruption duration within max_permissible_interruption_minutes; cumulative interruptions within HARD_INTERRUPTION_CAP_MIN"
    error_id: "ERR_INTERRUPTION_CURE_EXCEEDED"
    http_status: 409
    applies_to: "print-jobs/{id}/resume"

  - priority: 14
    category: business_constraint
    check: "Required input fields present and well-formed"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/construction/_clock/set_current_utc"
    description: "Set the logical clock. Default before any call: 2026-09-01T00:00:00Z. Server MUST NOT fall back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "Triggers system events: AM review expiry transitions, PrintInterruption OVERRUN flagging, foundation cure evaluation"
      - "Recomputes Site.posture across all sites"

  # --- Jurisdiction ---
  - method: POST
    path: "/construction/jurisdictions"
    description: "Create a jurisdiction"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, permits_prescriptive_printed_path, alternative_means_review_days, weather_station_id]
    output: Jurisdiction
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/construction/jurisdictions/{id}/sites"
    description: "List sites under a jurisdiction"
    roles: [PlatformAdmin, SiteManager, PermitCoordinator, JurisdictionReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Site[]"
    side_effects: []

  - method: POST
    path: "/construction/community-deployments"
    description: "Create a community deployment"
    roles: [PlatformAdmin]
    code: 201
    input: [name, jurisdiction_id, plan_id, planned_unit_count]
    output: CommunityDeployment
    side_effects: ["status = PLANNING; completed_unit_count = 0; learning_curve_baseline_minutes = null; learning_curve_factor = null; learning_curve_variant = FORWARD_LOOKING"]

  - method: GET
    path: "/construction/community-deployments/{id}"
    description: "Fetch deployment with learning curve state"
    roles: [PlatformAdmin, SiteManager, Engineer]
    code: 200
    input: []
    output: CommunityDeployment
    side_effects: []

  - method: POST
    path: "/construction/community-deployments/{id}/activate"
    description: "Activate a PLANNING deployment"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CommunityDeployment
    side_effects: ["status = ACTIVE; requires plan_id references an APPROVED StructuralPlan"]

  - method: POST
    path: "/construction/community-deployments/{id}/set-learning-variant"
    description: "Switch learning_curve_variant between FORWARD_LOOKING and CHRONOLOGICAL"
    roles: [PlatformAdmin]
    code: 200
    input: [learning_curve_variant]
    output: CommunityDeployment
    side_effects: ["learning_curve_factor recomputed under the new variant"]

  # --- Site ---

  - method: POST
    path: "/construction/sites"
    description: "Register a site"
    roles: [SiteManager]
    code: 201
    input: [jurisdiction_id, address, "community_deployment_id?", soil_class, foundation_kind]
    output: Site
    side_effects: ["status = REGISTERED; posture = OPERATING"]

  - method: GET
    path: "/construction/sites/{id}"
    description: "Fetch site (lazy evaluation: AM expiry, interruption OVERRUN, posture recompute)"
    roles: [PlatformAdmin, SiteManager, PermitCoordinator, JurisdictionReviewer, Engineer, PrintOperator, QualityInspector, TradeContractor]
    code: 200
    input: []
    output: Site
    side_effects: ["Lazy system transitions evaluated"]

  - method: GET
    path: "/construction/sites/{id}/permit-applications"
    description: "List permit applications for a site"
    roles: [PlatformAdmin, SiteManager, PermitCoordinator, JurisdictionReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PermitApplication[]"
    side_effects: []

  - method: GET
    path: "/construction/sites/{id}/print-jobs"
    description: "List print jobs for a site"
    roles: [PlatformAdmin, SiteManager, PrintOperator, QualityInspector, TradeContractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PrintJob[]"
    side_effects: []

  - method: GET
    path: "/construction/sites/{id}/printer-setups"
    description: "List printer setups for a site"
    roles: [PlatformAdmin, SiteManager, PrintOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PrinterSetup[]"
    side_effects: []

  - method: GET
    path: "/construction/sites/{id}/material-batches"
    description: "List material batches for a site"
    roles: [PlatformAdmin, SiteManager, PrintOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MaterialBatch[]"
    side_effects: []

  - method: GET
    path: "/construction/sites/{id}/weather-observations"
    description: "List weather observations for a site, newest first"
    roles: [PlatformAdmin, SiteManager, PrintOperator, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: "WeatherObservation[]"
    side_effects: []

  - method: GET
    path: "/construction/sites/{id}/trade-tasks"
    description: "List conventional trade tasks for a site"
    roles: [PlatformAdmin, SiteManager, TradeContractor, QualityInspector]
    code: 200
    input: ["status?", "trade?", "limit?", "offset?"]
    output: "ConventionalTradeTask[]"
    side_effects: []

  - method: POST
    path: "/construction/structural-plans"
    description: "Create a structural plan"
    roles: [Engineer]
    code: 201
    input: [title, structural_system, wall_thickness_mm, wall_height_mm, plan_area_m2]
    output: StructuralPlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/construction/structural-plans/{id}/revisions"
    description: "List revisions for a plan"
    roles: [PlatformAdmin, SiteManager, PermitCoordinator, Engineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PlanRevision[]"
    side_effects: []

  - method: POST
    path: "/construction/structural-plans/{id}/revisions"
    description: "Create a new revision on a plan"
    roles: [Engineer]
    code: 201
    input: ["supersedes_revision_id?", engineering_notes, required_code_path]
    output: PlanRevision
    side_effects: ["status = DRAFT; revision_number = 1 + count of prior non-VOIDED revisions"]

  - method: POST
    path: "/construction/structural-plans/{id}/revisions/{revision_id}/action"
    description: "Plan revision action. action=SUBMIT (DRAFT → SUBMITTED; engineer_reviewer_id = X-User-ID; StructuralPlan DRAFT → UNDER_REVIEW; fails ERR_CONCURRENT_REVIEW if another revision is SUBMITTED). action=APPROVE (SUBMITTED → APPROVED; segregation of duties ERR_SEGREGATION_OF_DUTIES if X-User-ID == engineer_reviewer_id; plan → APPROVED; prior APPROVED revision → VOIDED; permits referencing VOIDED revision cascade to WITHDRAWN). action=REJECT (SUBMITTED → REJECTED; segregation of duties)."
    roles: [Engineer]
    code: 200
    input: [action]
    output: PlanRevision
    side_effects: ["see action-specific effects in description"]

  - method: POST
    path: "/construction/sites/{id}/permit-applications"
    description: "Open a permit application"
    roles: [PermitCoordinator]
    code: 201
    input: [plan_revision_id, requested_path]
    output: PermitApplication
    side_effects: ["status = DRAFT; review_round = 0; fee_paid_cents = 0"]

  - method: GET
    path: "/construction/sites/{id}/permit-applications/{application_id}"
    description: "Fetch a permit application"
    roles: [PlatformAdmin, SiteManager, PermitCoordinator, JurisdictionReviewer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["Lazy system transition: AM_REVIEW → RESUBMIT_REQUIRED if past due"]

  - method: POST
    path: "/construction/sites/{id}/permit-applications/{application_id}/action"
    description: "Permit application action. action=SUBMIT (PermitCoordinator only; DRAFT → SUBMITTED if jurisdiction permits prescriptive path AND requested_path=PRESCRIPTIVE, else DRAFT → AM_REVIEW with am_submitted_at and am_decision_due_at stamped; computes fee_due_cents). action=PAY_FEE (PermitCoordinator only; amount_cents required; fee_paid_cents += amount_cents). action=DECIDE (JurisdictionReviewer only; decision ∈ {APPROVE, DENY} required; SUBMITTED/AM_REVIEW → APPROVED or DENIED; APPROVE requires fee_paid_cents >= fee_due_cents else ERR_PERMIT_FEE_OUTSTANDING; AM_REVIEW decide also requires clock <= am_decision_due_at else ERR_AM_REVIEW_EXPIRED). action=RESUBMIT (PermitCoordinator only; RESUBMIT_REQUIRED → AM_REVIEW; review_round += 1; fee_due_cents recomputed; am_submitted_at, am_decision_due_at re-stamped). action=WITHDRAW (PermitCoordinator only; DRAFT/SUBMITTED/AM_REVIEW → WITHDRAWN)."
    roles: [PermitCoordinator, JurisdictionReviewer]
    code: 200
    input: [action, "decision?", "amount_cents?"]
    output: PermitApplication
    side_effects: ["see action-specific effects in description"]

  - method: POST
    path: "/construction/sites/{id}/printer-setups"
    description: "Create a printer setup (gantry assembly) for a site"
    roles: [PrintOperator]
    code: 201
    input: [gantry_model, rail_span_mm, leveling_tolerance_mm, measured_level_deviation_mm, expected_site_version]
    output: PrinterSetup
    side_effects: ["status = ASSEMBLED; is_within_tolerance computed; increments Site.version by 1"]

  - method: POST
    path: "/construction/sites/{id}/printer-setups/{setup_id}/advance"
    description: "Advance a printer setup. to_state=LEVELED marks ASSEMBLED → LEVELED (recomputes is_within_tolerance); to_state=QUALIFIED marks LEVELED → QUALIFIED (requires is_within_tolerance=true else ERR_LEVELING_OUT_OF_TOLERANCE; requires Site.status FOUNDATION_CURED or SITE_READY else ERR_FOUNDATION_NOT_CURED; flips Site FOUNDATION_CURED → SITE_READY)."
    roles: [PrintOperator]
    code: 200
    input: [to_state]
    output: PrinterSetup
    side_effects: ["increments Site.version by 1; to_state=QUALIFIED cascades Site FOUNDATION_CURED → SITE_READY"]

  - method: POST
    path: "/construction/sites/{id}/material-batches"
    description: "Proportion a new material batch"
    roles: [PrintOperator]
    code: 201
    input: [mix_code, water_cement_ratio, target_slump_mm, measured_slump_mm, pump_consistency_kg_per_min]
    output: MaterialBatch
    side_effects: ["status = PROPORTIONED; slump_within_band, pump_window_kg_per_min, is_pumpable computed"]

  - method: POST
    path: "/construction/sites/{id}/material-batches/{batch_id}/qualify"
    description: "Qualify a batch (requires pumpable)"
    roles: [PrintOperator]
    code: 200
    input: []
    output: MaterialBatch
    side_effects: ["PROPORTIONED → QUALIFIED"]

  - method: POST
    path: "/construction/sites/{id}/weather-observations"
    description: "Post a weather observation"
    roles: [PrintOperator, QualityInspector]
    code: 201
    input: [observed_at, air_temp_c, relative_humidity_pct, wind_speed_mps, precipitation_mm]
    output: WeatherObservation
    side_effects: ["is_print_permissible computed; Site.posture recomputed"]


  - method: POST
    path: "/construction/sites/{id}/action"
    description: "Site lifecycle action. action=POUR_FOUNDATION (REGISTERED → FOUNDATION_POURED, stamps poured_at and cured_at=poured+72h, increments Site.version); action=CONFIRM_CURE (FOUNDATION_POURED → FOUNDATION_CURED, requires clock >= foundation_cured_at else ERR_FOUNDATION_NOT_CURED); action=COMPLETE (SITE_READY → COMPLETED, requires all prints COMPLETED, all trades COMPLETED, no PENDING/REPAIR_REQUIRED inspections; increments CommunityDeployment.completed_unit_count and recomputes learning curve); action=SUSPEND (PlatformAdmin only; any non-terminal → SUSPENDED; cascades open PrintJobs, TradeTasks, PermitApplications)."
    roles: [SiteManager, PlatformAdmin]
    code: 200
    input: [action]
    output: Site
    side_effects: ["see action-specific effects in description; only PlatformAdmin may use action=SUSPEND"]

  - method: POST
    path: "/construction/sites/{id}/print-jobs/{job_id}/transition"
    description: "PrintJob state transition. to_state ∈ {READY_TO_PRINT, PRINTING, PAUSED, COMPLETED, ABORTED, CANCELLED}. From SCHEDULED: READY_TO_PRINT (gating checks: ERR_PERMIT_NOT_APPROVED, ERR_WEATHER_NOT_PERMISSIBLE, ERR_PRINT_SCHEDULE_OVERLAP, ERR_PRINTER_NOT_QUALIFIED, ERR_BATCH_NOT_PUMPABLE) or CANCELLED. From READY_TO_PRINT: PRINTING (requires clock >= scheduled_start_at, Site.posture != STOP, latest weather print-permissible; sets actual_start_at; flips Site SITE_READY → ACTIVE_PRINT) or CANCELLED. From PRINTING: PAUSED (requires cause ∈ {WEATHER, MATERIAL, MECHANICAL, OPERATOR, INSPECTOR_HOLD}; creates OPEN PrintInterruption), COMPLETED (requires layers_printed >= total_layers_planned and no PENDING/DEMOLISH_REQUIRED inspections else ERR_PRINT_INCOMPLETE; stamps actual_end_at, computes continuous_run_minutes, exhausts consumed batch, recomputes learning curve), or ABORTED. From PAUSED: PRINTING (closes OPEN interruption; ERR_INTERRUPTION_CURE_EXCEEDED if duration > max_permissible for the batch's mix_code; if cumulative_interruption_minutes > HARD_INTERRUPTION_CAP_MIN after close, job auto-ABORTED) or ABORTED. ABORTED/CANCELLED/COMPLETED are terminal."
    roles: [PrintOperator]
    code: 200
    input: [to_state, "cause?"]
    output: PrintJob
    side_effects: ["see to_state-specific effects in description"]

  # --- PrintJob ---
  - method: POST
    path: "/construction/sites/{id}/print-jobs"
    description: "Schedule a print job"
    roles: [PrintOperator]
    code: 201
    input: [plan_revision_id, printer_setup_id, scheduled_start_at, scheduled_end_at, total_layers_planned, expected_site_version]
    output: PrintJob
    side_effects: ["status = SCHEDULED; layers_printed = 0; cumulative_interruption_minutes = 0; increments Site.version by 1; posture computed"]

  - method: POST
    path: "/construction/sites/{id}/print-jobs/{job_id}/layer-inspections"
    description: "Record a layer inspection"
    roles: [QualityInspector]
    code: 201
    input: [layer_index_start, layer_index_end, bond_strength_mpa, dimensional_deviation_mm, "supersedes_inspection_id?"]
    output: LayerInspection
    side_effects: ["passes_bond, passes_dimensional, outcome computed; disposition = PENDING; layers_printed on parent PrintJob incremented by (layer_index_end - layer_index_start + 1) only when outcome == PASS and supersedes_inspection_id is null; Site.posture recomputed"]

  - method: GET
    path: "/construction/sites/{id}/print-jobs/{job_id}/layer-inspections"
    description: "List layer inspections on a job"
    roles: [PlatformAdmin, SiteManager, PrintOperator, QualityInspector]
    code: 200
    input: ["disposition?", "outcome?", "limit?", "offset?"]
    output: "LayerInspection[]"
    side_effects: []

  - method: POST
    path: "/construction/sites/{id}/print-jobs/{job_id}/layer-inspections/{inspection_id}/disposition"
    description: "Disposition a PENDING inspection"
    roles: [QualityInspector]
    code: 200
    input: [disposition]
    output: LayerInspection
    side_effects: ["PENDING → ACCEPTED/REPAIR_REQUIRED/DEMOLISH_REQUIRED; Site.posture recomputes; segregation of duties enforced"]

  # --- ConventionalTradeTask ---
  - method: POST
    path: "/construction/sites/{id}/trade-tasks"
    description: "Plan a conventional trade task"
    roles: [SiteManager]
    code: 201
    input: [trade, sequence_rank, earliest_start_at, latest_end_at, depends_on_print_job_id, "depends_on_trade_task_id?", expected_site_version]
    output: ConventionalTradeTask
    side_effects: ["status = PLANNED; is_startable, start_blockers computed; increments Site.version by 1"]

  - method: POST
    path: "/construction/sites/{id}/trade-tasks/{task_id}/transition"
    description: "ConventionalTradeTask state transition. to_state ∈ {IN_PROGRESS, COMPLETED, CANCELLED}. From READY → IN_PROGRESS (TradeContractor only; requires clock >= earliest_start_at else ERR_TRADE_TOO_EARLY; Site.posture != STOP else ERR_POSTURE_BLOCKED; is_startable == true; stamps actual_start_at). From IN_PROGRESS → COMPLETED (TradeContractor only; requires clock <= latest_end_at else ERR_TRADE_OVERRUN; stamps actual_end_at; downstream PLANNED tasks re-evaluate to READY). From PLANNED or READY → CANCELLED (SiteManager only)."
    roles: [TradeContractor, SiteManager]
    code: 200
    input: [to_state]
    output: ConventionalTradeTask
    side_effects: ["see to_state-specific effects in description"]

    roles: [SiteManager]
    code: 201
    input: [trade, sequence_rank, earliest_start_at, latest_end_at, depends_on_print_job_id, "depends_on_trade_task_id?", expected_site_version]
    output: ConventionalTradeTask
    side_effects: ["status = PLANNED; is_startable, start_blockers computed; increments Site.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_MISSING_IDEMPOTENCY_KEY, http: 400, condition: "POST without Idempotency-Key header" }
  - { id: ERR_IDEMPOTENCY_REPLAY_MISMATCH, http: 409, condition: "Idempotency-Key reuse with different request body" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or containment chain broken" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a from-state for this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_site_version does not match current Site.version" }
  - { id: ERR_POSTURE_BLOCKED, http: 409, condition: "Site.posture == STOP or Jurisdiction suspended blocks this action" }
  - { id: ERR_FOUNDATION_NOT_CURED, http: 409, condition: "current logical clock < foundation_cured_at" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "No APPROVED PermitApplication covers the plan_revision_id at ready time" }
  - { id: ERR_PERMIT_FEE_OUTSTANDING, http: 409, condition: "fee_paid_cents < fee_due_cents at decide time" }
  - { id: ERR_PERMIT_REVISION_SUPERSEDED, http: 409, condition: "Permit revision referenced has been VOIDED by newer approval" }
  - { id: ERR_AM_REVIEW_EXPIRED, http: 409, condition: "AM decision attempted after am_decision_due_at" }
  - { id: ERR_PLAN_REVISION_NOT_APPROVED, http: 409, condition: "Referenced PlanRevision not in APPROVED status" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID attempting both submitter and approver role (or inspector self-disposition)" }
  - { id: ERR_CONCURRENT_REVIEW, http: 409, condition: "Another PlanRevision on the same plan is already SUBMITTED" }
  - { id: ERR_LEVELING_OUT_OF_TOLERANCE, http: 409, condition: "measured_level_deviation_mm > leveling_tolerance_mm" }
  - { id: ERR_PRINTER_NOT_QUALIFIED, http: 409, condition: "PrinterSetup not in QUALIFIED status" }
  - { id: ERR_BATCH_NOT_PUMPABLE, http: 409, condition: "MaterialBatch is_pumpable == false" }
  - { id: ERR_WEATHER_NOT_PERMISSIBLE, http: 409, condition: "Latest weather observation fails the print-permissible predicate" }
  - { id: ERR_PRINT_SCHEDULE_OVERLAP, http: 409, condition: "Scheduled interval overlaps another non-terminal print job on the same site" }
  - { id: ERR_INTERRUPTION_CURE_EXCEEDED, http: 409, condition: "Interruption duration exceeded the batch's max_permissible_interruption_minutes" }
  - { id: ERR_PRINT_INCOMPLETE, http: 409, condition: "layers_printed < total_layers_planned or a DEMOLISH_REQUIRED inspection blocks completion" }
  - { id: ERR_INSPECTION_NOT_PASSING, http: 409, condition: "Attempted ACCEPTED disposition on a non-PASS outcome" }
  - { id: ERR_TRADE_TOO_EARLY, http: 409, condition: "current logical clock < earliest_start_at at trade-task start" }
  - { id: ERR_TRADE_OVERRUN, http: 409, condition: "current logical clock > latest_end_at at trade-task complete" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates jurisdictions, deployments, archives plans, suspends sites, and drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /construction/_clock/set_current_utc"
      - "POST /construction/jurisdictions"
      - "POST /construction/jurisdictions/{id}/suspend"
      - "POST /construction/jurisdictions/{id}/resume"
      - "POST /construction/community-deployments"
      - "POST /construction/community-deployments/{id}/activate"
      - "POST /construction/community-deployments/{id}/set-learning-variant"
      - "POST /construction/sites/{id}/suspend"
      - "POST /construction/structural-plans/{id}/archive"
    shared_operations:
      - "GET (read-only) on all resources"

  - name: SiteManager
    description: "Owns the site lifecycle from registration through completion"
    identity: opaque
    exclusive_operations:
      - "POST /construction/sites"
      - "POST /construction/sites/{id}/foundation/pour"
      - "POST /construction/sites/{id}/foundation/confirm-cure"
      - "POST /construction/sites/{id}/complete"
      - "POST /construction/sites/{id}/trade-tasks"
      - "POST /construction/sites/{id}/trade-tasks/{id}/cancel"
    shared_operations:
      - "GET (read-only) on site, plans, permits, prints, trades"

  - name: PermitCoordinator
    description: "Files and prosecutes permit applications"
    identity: opaque
    exclusive_operations:
      - "POST /construction/sites/{id}/permit-applications"
      - "POST /construction/sites/{id}/permit-applications/{id}/submit"
      - "POST /construction/sites/{id}/permit-applications/{id}/pay-fee"
      - "POST /construction/sites/{id}/permit-applications/{id}/resubmit"
      - "POST /construction/sites/{id}/permit-applications/{id}/withdraw"
    shared_operations:
      - "GET on permits, sites, plans, jurisdictions"

  - name: JurisdictionReviewer
    description: "Decides permit applications on behalf of the jurisdiction"
    identity: opaque
    exclusive_operations:
      - "POST /construction/sites/{id}/permit-applications/{id}/decide"
    shared_operations:
      - "GET on permits, sites, jurisdictions"

  - name: Engineer
    description: "Authors and reviews structural plan revisions"
    identity: opaque
    exclusive_operations:
      - "POST /construction/structural-plans"
      - "POST /construction/structural-plans/{id}/revisions"
      - "POST /construction/structural-plans/{id}/revisions/{id}/submit"
      - "POST /construction/structural-plans/{id}/revisions/{id}/decide"
    shared_operations:
      - "GET on plans, sites, deployments"

  - name: PrintOperator
    description: "Operates the printer, batch plant, and print jobs"
    identity: opaque
    exclusive_operations:
      - "POST /construction/sites/{id}/printer-setups"
      - "POST /construction/sites/{id}/printer-setups/{id}/level"
      - "POST /construction/sites/{id}/printer-setups/{id}/qualify"
      - "POST /construction/sites/{id}/printer-setups/{id}/demobilize"
      - "POST /construction/sites/{id}/material-batches"
      - "POST /construction/sites/{id}/material-batches/{id}/qualify"
      - "POST /construction/sites/{id}/material-batches/{id}/reject"
      - "POST /construction/sites/{id}/print-jobs"
      - "POST /construction/sites/{id}/print-jobs/{id}/ready"
      - "POST /construction/sites/{id}/print-jobs/{id}/start"
      - "POST /construction/sites/{id}/print-jobs/{id}/interrupt"
      - "POST /construction/sites/{id}/print-jobs/{id}/resume"
      - "POST /construction/sites/{id}/print-jobs/{id}/abort"
      - "POST /construction/sites/{id}/print-jobs/{id}/complete"
      - "POST /construction/sites/{id}/print-jobs/{id}/cancel"
    shared_operations:
      - "POST /construction/sites/{id}/weather-observations (shared with QualityInspector)"
      - "GET on site, prints, batches, setups, weather"

  - name: QualityInspector
    description: "Records and dispositions layer inspections"
    identity: opaque
    exclusive_operations:
      - "POST /construction/sites/{id}/print-jobs/{id}/layer-inspections"
      - "POST /construction/sites/{id}/print-jobs/{id}/layer-inspections/{id}/disposition"
    shared_operations:
      - "POST /construction/sites/{id}/weather-observations (shared with PrintOperator)"
      - "GET on prints, inspections, weather, batches, setups"

  - name: TradeContractor
    description: "Starts and completes conventional trade tasks after printing"
    identity: opaque
    exclusive_operations:
      - "POST /construction/sites/{id}/trade-tasks/{id}/start"
      - "POST /construction/sites/{id}/trade-tasks/{id}/complete"
    shared_operations:
      - "GET on trade tasks, sites, prints"

