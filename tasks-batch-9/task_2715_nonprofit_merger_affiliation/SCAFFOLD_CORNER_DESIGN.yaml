            - "AlignmentAssessment.${adj}.composite_score == 60.00"
            - "Restructuring.${deal}.status == DILIGENCE"

      - name: the_dossier_read_derives_the_two_variant_scores_and_their_delta
        claim_type: computed_read
        grounds:
          - endpoints.GET_/restructurings/{id}/dossier
          - calculations.mission_program_alignment_score
        excluded_because:
          difficulty_instance: alignment_screening_vs_diligence_adjusted_variant_divergence
          rationale: "That §1.8 instance ends by reading the dossier and asserting composite_delta == 30.00 against the 60.00 SCREENING and 90.00 DILIGENCE_ADJUSTED rows it just created, which is exactly the computed-read claim - a read-only projection that must recompute from the stored rows rather than store a column."

  # ---------------------------------------------------------------- errors
  # Table 6 of references/claim-extraction-guide.md declares NO claim-type rows for
  # this section. Its whole requirement is "verify every error code is triggerable:
  # for each error in the catalog, there must be at least one test that causes it",
  # so every instance below carries claim_type error_triggerable and names the exact
  # catalog codes it makes fire. The codes already fired by the S1.8 instances and by
  # the earlier S1.9 sections are not repeated here; this section closes the gap so
  # that all 51 S1.6 codes are covered by the union of the two design files.
  - section: errors
    instances:
      - name: unknown_row_lookups_each_return_their_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_LETTER_OF_INTENT_NOT_FOUND
          - errors.ERR_DILIGENCE_REQUEST_NOT_FOUND
          - errors.ERR_BOARD_APPROVAL_NOT_FOUND
          - errors.ERR_AG_FILING_NOT_FOUND
          - errors.ERR_INTEGRATION_TASK_NOT_FOUND
          - validations.priority_6_ERR_PROGRAM_NOT_FOUND
          - validations.priority_7_ERR_LETTER_OF_INTENT_NOT_FOUND
          - validations.priority_8_ERR_DILIGENCE_REQUEST_NOT_FOUND
          - validations.priority_10_ERR_BOARD_APPROVAL_NOT_FOUND
          - validations.priority_11_ERR_AG_FILING_NOT_FOUND
          - validations.priority_12_ERR_INTEGRATION_TASK_NOT_FOUND
        distinguishing_aspect: "Six of the nine 404 codes belong to entities that have no create-time FK of their own, so nothing else in the suite fires them. Each must return its OWN code rather than a generic ERR_NOT_FOUND, and the continuity-decision call proves the priority order inside the existence block: the body restructuring_id is real, so priority 5 passes and priority 6 speaks about the Program."
        test_recipe:
          setup:
            - "Two Organizations and one Restructuring, so that every body-level foreign key on the six probe calls resolves and the unknown path id is the only thing missing"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
          trigger:
            - call: "POST /programs/00000000-0000-0000-0000-0000000000a1/continuity-decision"
              payload: { restructuring_id: "${deal}", disposition: "TRANSFER" }
              as: IntegrationManager
              as_user_id: "im-001"
              captures: { e_program: $.data.error_id }
            - call: "POST /letters-of-intent/00000000-0000-0000-0000-0000000000a2/withdraw"
              payload: { withdrawal_reason: "probe" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { e_letter: $.data.error_id }
            - call: "POST /diligence-requests/00000000-0000-0000-0000-0000000000a3/respond"
              payload: { response_ref: "RESP-9999" }
              as: DiligenceLead
              as_user_id: "dl-001"
              captures: { e_finding: $.data.error_id }
            - call: "POST /board-approvals/00000000-0000-0000-0000-0000000000a4/certify"
              payload: { fiduciary_memo_ref: "MEMO-X", certifying_secretary_ref: "SEC-X" }
              as: BoardSecretary
              as_user_id: "${org_a}"
              captures: { e_approval: $.data.error_id }
            - call: "POST /ag-filings/00000000-0000-0000-0000-0000000000a5/decision"
              payload: { decision: "APPROVED" }
              as: StateCharitiesRegulator
              as_user_id: "reg-001"
              captures: { e_filing: $.data.error_id }
            - call: "GET /integration-tasks/00000000-0000-0000-0000-0000000000a6"
              payload: {}
              as: PlatformAdmin
              captures: { e_task: $.data.error_id }
          assert:
            - "all six calls return HTTP status 404"
            - "e_program == ERR_PROGRAM_NOT_FOUND"
            - "e_letter == ERR_LETTER_OF_INTENT_NOT_FOUND"
            - "e_finding == ERR_DILIGENCE_REQUEST_NOT_FOUND"
            - "e_approval == ERR_BOARD_APPROVAL_NOT_FOUND"
            - "e_filing == ERR_AG_FILING_NOT_FOUND"
            - "e_task == ERR_INTEGRATION_TASK_NOT_FOUND"
            - "every response body carries both envelope fields error_id and message"
            - "Restructuring.${deal}.version == 1 - not one of the six refusals mutated any row"

      - name: create_organization_with_a_missing_x_user_id_header_is_refused
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - roles
        distinguishing_aspect: "Priorities 1 and 2 are different rules with different statuses, and only a triple probe separates them: a request with NO auth headers and a request naming a role that is not one of the seven declared in S1.7 both fail authentication with 401, while a request naming a DECLARED role that simply is not on this endpoint's roles list fails authorisation with 403. The `as: NONE` call object below means the request is sent with neither X-User-Role nor X-User-Id."
        test_recipe:
          setup:
            - "Empty database - the three probes are refused before any body validation, so no fixture is needed"
          setup_api_calls: []
          trigger:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: NONE
              captures: { e_noheader: $.data.error_id }
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: GrantsManager
              as_user_id: "gm-001"
              captures: { e_unknownrole: $.data.error_id }
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: StrategyOfficer
              as_user_id: "so-001"
              captures: { e_wrongrole: $.data.error_id }
          assert:
            - "the header-less call returns HTTP status 401 and e_noheader == ERR_UNAUTHENTICATED"
            - "the GrantsManager call returns HTTP status 401 and e_unknownrole == ERR_UNAUTHENTICATED - an unrecognised role never reaches the roles list comparison"
            - "the StrategyOfficer call returns HTTP status 403 and e_wrongrole == ERR_ROLE_NOT_PERMITTED - the role exists but POST /organizations is PlatformAdmin only"
            - "no Organization row exists after the three refusals; GET /organizations returns an empty list with total 0"

      - name: a_second_organization_with_the_same_ein_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EIN_ALREADY_REGISTERED
          - validations.priority_25_ERR_EIN_ALREADY_REGISTERED
          - entities.Organization.fields.ein
        distinguishing_aspect: "EIN uniqueness is the only cross-row uniqueness constraint in the scaffold and it is checked at priority 25, AFTER body validation, so a well-formed duplicate returns 422 rather than 400 and the second row is never created."
        test_recipe:
          setup:
            - "One Organization registered under EIN 11-1111111"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
