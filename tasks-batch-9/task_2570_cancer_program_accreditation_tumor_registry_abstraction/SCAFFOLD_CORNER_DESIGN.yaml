              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
