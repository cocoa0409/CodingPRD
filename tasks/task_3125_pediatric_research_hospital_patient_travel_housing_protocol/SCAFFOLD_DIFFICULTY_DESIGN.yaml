# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3125
# Depth probe: the nine §0.5 Difficulty Rules, 2 instances each (18 total).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.6 and every call resolves to a
# §1.5 endpoint. Setup chains drive empty-DB into the stated precondition.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_fund_pools_at_commitment_vs_after_donation
        grounds:
          - calculations.fundraising_split_at_commitment
          - entities.ResearchFund.fields.research_balance_cents
          - entities.ResearchFund.fields.patient_support_balance_cents
          - endpoints.POST_/programs/research-funds/{id}/donations
        distinguishing_aspect: "Both variants divide the identical donor ledger by the identical 0.4 allocation, but the commitment-time split runs against 400000000 cents of net fundraising while the post-donation split runs against 420000000, so on the same fund the research pool reads 160000000 then 168000000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Donor fund SJ-FY26 created with 400000000 cents raised, 80000000 cents federal grant, research_allocation_pct 0.4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /programs/research-funds/${fund_id}/donations"
              payload: { amount_cents: 20000000, is_federal_grant: false }
              as: PlatformAdmin
              captures: { fund_after_id: $.data.id }
          assert:
            - "the fund creation response carried research_balance_cents == 160000000 and patient_support_balance_cents == 160000000"
            - "ResearchFund.${fund_after_id}.research_balance_cents == 168000000"
            - "ResearchFund.${fund_after_id}.patient_support_balance_cents == 172000000"
            - "the two variants disagree by 8000000 cents on the research pool and 12000000 cents on the patient-support pool for identical allocation inputs"

      - name: dual_variant_family_day_starter_rate_vs_tier_rated
        grounds:
          - calculations.provisional_family_day_charge
          - calculations.final_family_day_charge
          - entities.FamilySupportPledge.fields.provisional_settled_cents
          - entities.FamilySupportPledge.fields.final_settled_cents
          - validations[priority=17]
        distinguishing_aspect: "Both variants price the identical covered_days = 5 counter on the identical TN household; the flat starter rate yields 2250 cents while the resolved per-traveler-day tier rate yields 75000 cents, a 72750-cent divergence with no input changing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; fund, open ALL-INT-001, campus residence, Class C partner residence."
            - "Ava Reyes (TN, immunosuppressed, 245 expected days, 4000000 cents insurance) screened to ON_CAMPUS, arrived, consented, in ACTIVE_TREATMENT with one activated 1-night campus occupancy, pledge accrued 4 days, then placed ON_HIATUS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/clinical-protocols"
              payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
              as: ProtocolCoordinator
              captures: { protocol_id: $.data.id }
            - call: "POST /programs/clinical-protocols/${protocol_id}/open"
              payload: {}
              as: ProtocolCoordinator
              captures: { protocol_v: $.data.version }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "ONC-01", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 4, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_on_id: $.data.id }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "PTC-01", name: "Partner Class C", tier: "PARTNER_CLASS_C", total_beds: 6, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_c_id: $.data.id }
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
              as: IntakeCoordinator
              captures: { ref_tn_id: $.data.id }
            - call: "POST /programs/referrals/${ref_tn_id}/screen"
              payload: { expected_protocol_version: "${protocol_v}" }
              as: IntakeCoordinator
              captures: { ref_tn_v: $.data.version }
            - call: "POST /programs/referrals/${ref_tn_id}/arrive"
              payload: { expected_referral_version: "${ref_tn_v}" }
              as: IntakeCoordinator
              captures: { ref_tn_v2: $.data.version, enr_tn_id: $.data.enrollment_id }
            - call: "POST /programs/enrollments/${enr_tn_id}/sign-consent"
              payload: { consent_signer: "GUARDIAN_AND_CHILD", guardian_consent_signature_code: "GC-1001", child_assent_signature_code: "CA-1001" }
              as: IntakeCoordinator
              captures: { enr_tn_v: $.data.version }
            - call: "POST /programs/housing-assignments"
              payload: { enrollment_id: "${enr_tn_id}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-02T00:00:00Z", buffer_window_days: 1 }
              as: HousingCoordinator
              captures: { ha_tn_id: $.data.id }
            - call: "POST /programs/housing-assignments/${ha_tn_id}/activate"
              payload: {}
              as: HousingCoordinator
            - call: "POST /programs/enrollments/${enr_tn_id}/start-treatment"
              payload: {}
              as: IntakeCoordinator
              captures: { enr_tn_v2: $.data.version }
            - call: "POST /programs/family-support-pledges"
              payload: { enrollment_id: "${enr_tn_id}", patient_support_budget_cents: 12000 }
              as: PatientSupportOfficer
              captures: { pledge_tn_id: $.data.id }
            - call: "POST /programs/family-support-pledges/${pledge_tn_id}/accrue"
              payload: { days: 4 }
              as: PatientSupportOfficer
            - call: "POST /programs/enrollments/${enr_tn_id}/hiatus"
              payload: { hiatus_reason: "AFFILIATE_TRANSFER" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /programs/family-support-pledges/${pledge_tn_id}/settle"
              payload: {}
              as: PatientSupportOfficer
              captures: { pledge_settled_id: $.data.id }
          assert:
            - "FamilySupportPledge.${pledge_settled_id}.covered_days == 5"
            - "FamilySupportPledge.${pledge_settled_id}.provisional_settled_cents == 2250"
            - "FamilySupportPledge.${pledge_settled_id}.final_settled_cents == 75000"
            - "FamilySupportPledge.${pledge_settled_id}.billing_permitted_cents == 0"
            - "FamilySupportPledge.${pledge_settled_id}.status == SETTLED_FINAL"
            - "the variants disagree by exactly 72750 cents on identical covered_days and an identical household_state_code"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_immunosuppression_carve_out_overrides_duration_band
        grounds:
          - calculations.housing_tier_selector
          - entities.Referral.fields.applied_tier
          - entities.HousingFacility.fields.immunosuppression_capable
          - validations[priority=8]
        distinguishing_aspect: "The selector takes four inputs whose interaction is non-linear: two referrals both declaring 245 expected treatment days band to duration_steps 2 and would both rank to PARTNER_CLASS_A, but the immunosuppressed one is pinned to ON_CAMPUS by the carve-out, so identical durations land on different tiers."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; open ALL-INT-001 with protocol_budget_cents 10000000."
            - "Four open residences: ON_CAMPUS beds 4, PARTNER_CLASS_A beds 2, PARTNER_CLASS_B beds 6, PARTNER_CLASS_C beds 6, all buffers 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/clinical-protocols"
              payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
              as: ProtocolCoordinator
              captures: { protocol_id: $.data.id }
            - call: "POST /programs/clinical-protocols/${protocol_id}/open"
              payload: {}
              as: ProtocolCoordinator
              captures: { protocol_v: $.data.version }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "ONC-01", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 4, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_on_id: $.data.id }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "PTA-01", name: "Partner Class A", tier: "PARTNER_CLASS_A", total_beds: 2, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_a_id: $.data.id }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "PTB-01", name: "Partner Class B", tier: "PARTNER_CLASS_B", total_beds: 6, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_b_id: $.data.id }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "PTC-01", name: "Partner Class C", tier: "PARTNER_CLASS_C", total_beds: 6, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_c_id: $.data.id }
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
              as: IntakeCoordinator
              captures: { ref_tn_id: $.data.id }
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Noah Patel", child_date_of_birth: "2016-06-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: false, insurance_coverage_cents: 4000000 }
              as: IntakeCoordinator
              captures: { ref_tn2_id: $.data.id }
          trigger:
            - call: "POST /programs/referrals/${ref_tn_id}/screen"
              payload: { expected_protocol_version: "${protocol_v}" }
              as: IntakeCoordinator
              captures: { ref_tn_tier: $.data.applied_tier }
            - call: "POST /programs/referrals/${ref_tn2_id}/screen"
              payload: { expected_protocol_version: "${protocol_v}" }
              as: IntakeCoordinator
              captures: { ref_tn2_tier: $.data.applied_tier }
          assert:
            - "Referral.${ref_tn_id}.applied_tier == ON_CAMPUS"
            - "Referral.${ref_tn2_id}.applied_tier == PARTNER_CLASS_A"
            - "Referral.${ref_tn_id}.selector_window_days == 245 and Referral.${ref_tn2_id}.selector_window_days == 245"
            - "the two referrals carry identical durations and identical household states but land on different tiers, so the duration band alone does not decide the tier"
            - "ClinicalProtocol.${protocol_id}.reserved_cents == 1875000"
            - "ClinicalProtocol.${protocol_id}.available_cents == 8125000"
            - "ClinicalProtocol.${protocol_id}.is_budget_saturated == false"

      - name: combinatorial_selector_clamp_band_and_capacity_pool
        grounds:
          - calculations.housing_tier_selector
          - calculations.housing_occupancy_charge
          - validations[priority=10]
          - entities.HousingAssignment.fields.housing_cost_cents
        distinguishing_aspect: "The clamp and the band count interact non-linearly and the 180-night charge clamp then re-prices the result: 900 declared days and 300 declared days both clamp to 540 and band to duration_steps 3, both take PARTNER_CLASS_B, and a 5-night booking at that tier costs 65000 cents only because the tier rate is multiplied after the charge clamp rather than before."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; open ALL-INT-001 with protocol_budget_cents 10000000."
            - "One open Class B residence with total_beds 6 and buffer_beds 0."
            - "Two arrived enrolments: a 900-day TN family and a 300-day TN family, both immune-competent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/clinical-protocols"
              payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
              as: ProtocolCoordinator
              captures: { protocol_id: $.data.id }
            - call: "POST /programs/clinical-protocols/${protocol_id}/open"
              payload: {}
              as: ProtocolCoordinator
              captures: { protocol_v: $.data.version }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "PTB-01", name: "Partner Class B", tier: "PARTNER_CLASS_B", total_beds: 6, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_b_id: $.data.id }
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 900, is_immunosuppressed: false, insurance_coverage_cents: 4000000 }
              as: IntakeCoordinator
              captures: { ref_a_id: $.data.id }
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Noah Patel", child_date_of_birth: "2016-06-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 300, is_immunosuppressed: false, insurance_coverage_cents: 4000000 }
              as: IntakeCoordinator
              captures: { ref_b_id: $.data.id }
            - call: "POST /programs/referrals/${ref_a_id}/screen"
              payload: { expected_protocol_version: "${protocol_v}" }
              as: IntakeCoordinator
              captures: { ref_a_v: $.data.version }
            - call: "POST /programs/referrals/${ref_b_id}/screen"
              payload: { expected_protocol_version: "${protocol_v}" }
              as: IntakeCoordinator
              captures: { ref_b_v: $.data.version }
            - call: "POST /programs/referrals/${ref_a_id}/arrive"
              payload: { expected_referral_version: "${ref_a_v}" }
              as: IntakeCoordinator
              captures: { enr_a_id: $.data.enrollment_id }
            - call: "POST /programs/referrals/${ref_b_id}/arrive"
              payload: { expected_referral_version: "${ref_b_v}" }
              as: IntakeCoordinator
              captures: { enr_b_id: $.data.enrollment_id }
          trigger:
            - call: "POST /programs/housing-assignments"
              payload: { enrollment_id: "${enr_a_id}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-06T00:00:00Z", buffer_window_days: 1 }
              as: HousingCoordinator
              captures: { ha_a_id: $.data.id }
            - call: "POST /programs/housing-assignments"
              payload: { enrollment_id: "${enr_b_id}", start_at: "2026-09-07T00:00:00Z", end_at: "2026-09-12T00:00:00Z", buffer_window_days: 1 }
              as: HousingCoordinator
              captures: { ha_b_id: $.data.id }
          assert:
            - "HousingAssignment.${ha_a_id}.assigned_tier == PARTNER_CLASS_B and HousingAssignment.${ha_b_id}.assigned_tier == PARTNER_CLASS_B"
            - "HousingAssignment.${ha_a_id}.billed_nights == 5 and HousingAssignment.${ha_b_id}.billed_nights == 5"
            - "HousingAssignment.${ha_a_id}.nightly_rate_cents == 13000"
            - "HousingAssignment.${ha_a_id}.housing_cost_cents == 65000"
            - "HousingAssignment.${ha_b_id}.housing_cost_cents == 65000"
            - "HousingFacility.${fac_b_id}.active_beds_committed == 0 because both bookings are still SCHEDULED"
            - "the 900-day and 300-day families are priced identically, so the 540-day clamp precedes the band count and the 180-night clamp precedes the rate multiplication"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: non_linear_protocol_hold_cycle_with_asymmetric_thaw
        grounds:
          - state_machines.ClinicalProtocol.OPEN_to_HELD
          - state_machines.ClinicalProtocol.HELD_to_OPEN
          - state_machines.Referral.ACCEPTED_to_SUBMITTED
          - entities.ProtocolHold.fields.protocol_version
        distinguishing_aspect: "ClinicalProtocol runs a real OPEN → HELD → OPEN cycle whose thaw is not the mirror of its freeze: the freeze reverts every ACCEPTED referral to SUBMITTED and releases its reservation, while the release restores neither the acceptance nor the applied_tier, so the same family must be screened a second time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; fund, open ALL-INT-001 with protocol_budget_cents 10000000, campus residence beds 4."
            - "Ava Reyes (TN, immunosuppressed) screened and ACCEPTED at ON_CAMPUS holding a 1250000-cent reservation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/clinical-protocols"
              payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
              as: ProtocolCoordinator
              captures: { protocol_id: $.data.id }
            - call: "POST /programs/clinical-protocols/${protocol_id}/open"
              payload: {}
              as: ProtocolCoordinator
              captures: { protocol_v: $.data.version }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "ONC-01", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 4, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_on_id: $.data.id }
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
              as: IntakeCoordinator
              captures: { ref_tn_id: $.data.id }
            - call: "POST /programs/referrals/${ref_tn_id}/screen"
              payload: { expected_protocol_version: "${protocol_v}" }
              as: IntakeCoordinator
              captures: { ref_tn_v: $.data.version }
          trigger:
            - call: "POST /programs/clinical-protocols/${protocol_id}/holds"
              payload: { hold_reason: "IRB_REVIEW", initiated_at: "2026-09-02T00:00:00Z" }
              as: IRBReviewer
              captures: { hold_id: $.data.id, hold_v: $.data.version, protocol_v_held: $.data.protocol_version }
            - call: "POST /programs/protocol-holds/${hold_id}/release"
              payload: {}
              as: ProtocolCoordinator
              captures: { protocol_v_released: $.data.protocol_version }
          assert:
            - "ClinicalProtocol.${protocol_id}.status == OPEN after the release"
            - "ClinicalProtocol.${protocol_id}.is_protocol_held == false after the release"
            - "ProtocolHold.${hold_id}.status == RELEASED"
            - "Referral.${ref_tn_id}.status == SUBMITTED after the release, not ACCEPTED"
            - "Referral.${ref_tn_id}.applied_tier == PENDING after the release"
            - "Referral.${ref_tn_id}.reservation_basis_cents == 0 after the release"
            - "ClinicalProtocol.${protocol_id}.reserved_cents == 0 after the release"
            - "the cycle is not symmetric: the thaw returns the protocol to OPEN but leaves the family without an acceptance"

      - name: non_linear_travel_stamp_expiry_then_fresh_request_loop
        grounds:
          - state_machines.TravelArrangement.CONFIRMED_to_DISBURSED
          - state_machines.TravelArrangement.CONFIRMED_to_CANCELLED
          - state_machines.TravelArrangement.REQUESTED_to_CONFIRMED
          - validations[priority=11]
        distinguishing_aspect: "TravelArrangement carries a stamped expiry on its CONFIRMED state, so the machine loops back to REQUESTED rather than forward: once eligibility_confirmed_at is more than 30 clock days old the leg can never be disbursed, and cancelling it refunds nothing, so the only live path is a brand-new request."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-05T12:00:00Z; fund, open ALL-INT-001, campus residence."
            - "Ava Reyes screened, arrived, consented, in ACTIVE_TREATMENT with an activated 1-night campus occupancy and a CONFIRMED AIR_ECONOMY leg stamped 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /programs/research-funds"
              payload: { fund_code: "SJ-FY26", fiscal_year: 2026, fundraising_raised_cents: 400000000, research_allocation_pct: 0.4, federal_grant_cents: 80000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /programs/clinical-protocols"
              payload: { fund_id: "${fund_id}", protocol_code: "ALL-INT-001", disease_group: "ALL", age_min_years: 5, age_max_years: 17, required_stage: "NEWLY_DIAGNOSED", protocol_budget_cents: 10000000, capacity: 8 }
              as: ProtocolCoordinator
              captures: { protocol_id: $.data.id }
            - call: "POST /programs/clinical-protocols/${protocol_id}/open"
              payload: {}
              as: ProtocolCoordinator
              captures: { protocol_v: $.data.version }
            - call: "POST /programs/housing-facilities"
              payload: { facility_code: "ONC-01", name: "Campus Residence", tier: "ON_CAMPUS", total_beds: 4, buffer_beds: 0 }
              as: HousingCoordinator
              captures: { fac_on_id: $.data.id }
            - call: "POST /programs/referrals"
              payload: { protocol_id: "${protocol_id}", child_name: "Ava Reyes", child_date_of_birth: "2015-04-01T00:00:00Z", disease_group: "ALL", disease_stage: "NEWLY_DIAGNOSED", household_state_code: "TN", traveling_family_member_count: 3, expected_treatment_days: 245, is_immunosuppressed: true, insurance_coverage_cents: 4000000 }
