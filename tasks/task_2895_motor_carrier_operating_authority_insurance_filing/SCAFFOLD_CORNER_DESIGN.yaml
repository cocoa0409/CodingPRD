      - name: predecessor_existence_is_checked_before_predecessor_compatibility
        claim_type: cascading_validation
        grounds:
          - errors[ERR_PREDECESSOR_INVALID]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - validations[priority=6]
          - validations[priority=25]
        distinguishing_aspect: "Priority 6 must run before priority 25: an unknown predecessor id yields ERR_REFERENCE_NOT_FOUND at 404, while a real but incompatible predecessor on a NEW application yields ERR_PREDECESSOR_INVALID at 422 — the same request field produces two different errors depending on which check can even be evaluated."
        test_recipe:
          setup:
            - "one carrier owning one PENDING FOR_HIRE_PROPERTY authority"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
