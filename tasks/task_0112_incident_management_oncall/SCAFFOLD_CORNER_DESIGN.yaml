# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Incident Management & On-Call — Expert
# Breadth probe across the claim-extraction-guide sections. Every active instance
# grounds in SCAFFOLD.yaml §1.1–§1.7 and its setup_api_calls drives empty-DB ->
# precondition using only §1.5 endpoints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_service_returns_201_with_initialized_budget
        claim_type: Creation
        grounds:
          - entities.Service
          - endpoints
        distinguishing_aspect: "POST /services with name+error_budget_minutes returns 201; budget_status HEALTHY, consumed 0, remaining == budget."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /services"
              payload: { name: "Checkout", tier: "TIER_2", error_budget_minutes: 500 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, status: $.data.budget_status, consumed: $.data.error_budget_consumed_minutes, remaining: $.data.error_budget_remaining_minutes }
          assert:
            - "response code 201"
            - "Service.${s_id}.budget_status == 'HEALTHY'"
            - "Service.${s_id}.error_budget_consumed_minutes == 0"
            - "Service.${s_id}.error_budget_remaining_minutes == 500"

      - name: get_service_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Service
          - errors[ERR_SERVICE_NOT_FOUND]
        distinguishing_aspect: "GET /services/{id} with an unknown UUID returns ERR_SERVICE_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /services/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code 404"
            - "response error_id == 'ERR_SERVICE_NOT_FOUND'"

      - name: create_service_missing_required_budget_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Service.fields.error_budget_minutes
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting error_budget_minutes on POST /services returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /services"
              payload: { name: "NoBudget" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code 422"
            - "response error_id == 'ERR_INVALID_REQUEST'"

      - name: create_service_default_tier_applied
        claim_type: Defaults
        grounds:
          - entities.Service.fields.tier
        distinguishing_aspect: "Omitting tier on POST /services applies default TIER_2."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /services"
              payload: { name: "Defaulted", error_budget_minutes: 100 }
              as: PlatformAdmin
              captures: { tier: $.data.tier }
          assert:
            - "Service.tier == 'TIER_2' (default)"

      - name: create_service_invalid_tier_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Service.fields.tier
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /services with tier='TIER_9' (not a member) returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /services"
              payload: { name: "BadTier", tier: "TIER_9", error_budget_minutes: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code 422"
            - "response error_id == 'ERR_INVALID_REQUEST'"

      - name: incident_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Incident.fields.lifecycle_status
          - entities.Incident.fields.triggered_at
          - entities.Incident.fields.escalation_status
        distinguishing_aspect: "POST /incidents ignores any client-supplied status; server stamps lifecycle_status TRIGGERED, escalation_status ESCALATING, triggered_at from the clock."
        test_recipe:
          setup: ["Service+policy+schedule+shift+tier so the first page can fire."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15551001" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { life: $.data.lifecycle_status, esc: $.data.escalation_status, trig: $.data.triggered_at }
          assert:
            - "Incident.lifecycle_status == 'TRIGGERED'"
            - "Incident.escalation_status == 'ESCALATING'"
            - "Incident.triggered_at == '2026-06-01T12:00:00.000Z'"

      - name: pageattempt_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PageAttempt
        distinguishing_aspect: "PageAttempt has common_fields:false — its read shape exposes id and created_at only, no version/updated_at, and there is no update endpoint."
        test_recipe:
          setup: ["A triggered incident produced at least one PageAttempt."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15551002" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
          trigger:
            - call: "GET /incidents/${inc_id}/page-attempts"
              payload: {}
              as: IncidentCommander
              captures: { pa0_id: "$.data[0].id" }
          assert:
            - "page-attempts[0] has id and created_at"
            - "page-attempts[0] has no version and no updated_at field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: acknowledge_already_resolved_incident_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Incident.TRIGGERED_to_ACKNOWLEDGED
          - errors[ERR_INCIDENT_NOT_TRIGGERED]
        distinguishing_aspect: "Acknowledging an incident that is already RESOLVED fails with ERR_INCIDENT_NOT_TRIGGERED; no state change."
        test_recipe:
          setup: ["A RESOLVED incident."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15551003" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_INCIDENT_NOT_TRIGGERED'"
            - "Incident.${inc_id}.lifecycle_status == 'RESOLVED' (unchanged)"

      - name: resolve_triggered_incident_skips_ack_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Incident.ACKNOWLEDGED_to_RESOLVED
          - errors[ERR_INCIDENT_NOT_ACKNOWLEDGED]
        distinguishing_aspect: "Resolving a TRIGGERED (never-acknowledged) incident fails with ERR_INCIDENT_NOT_ACKNOWLEDGED."
        test_recipe:
          setup: ["A TRIGGERED incident, not acknowledged."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15551004" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_INCIDENT_NOT_ACKNOWLEDGED'"

      - name: publish_postmortem_from_draft_not_in_review
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Postmortem.IN_REVIEW_to_PUBLISHED
          - errors[ERR_POSTMORTEM_NOT_IN_REVIEW]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / publish_postmortem_safety_beats_state_when_both_off
          rationale: "The named §1.8 instance asserts ERR_POSTMORTEM_NOT_IN_REVIEW when publishing a DRAFT postmortem."

      - name: window_end_from_scheduled_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MaintenanceWindow.ACTIVE_to_ENDED
          - errors[ERR_WINDOW_NOT_ACTIVE]
        distinguishing_aspect: "Ending a SCHEDULED (never-activated) window fails with ERR_WINDOW_NOT_ACTIVE."
        test_recipe:
          setup: ["A SCHEDULED maintenance window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { service_id: "${s_id}", starts_at: "2026-06-02T10:00:00Z", ends_at: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
              captures: { mw_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows/${mw_id}/end"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_WINDOW_NOT_ACTIVE'"

      - name: war_room_close_requires_resolved_incident
        claim_type: guarded transitions
        grounds:
          - state_machines.WarRoom.OPEN_to_CLOSED
          - errors[ERR_INCIDENT_NOT_RESOLVED]
        distinguishing_aspect: "Closing a war room whose parent incident is still ACKNOWLEDGED fails with ERR_INCIDENT_NOT_RESOLVED (cross-entity guard)."
        test_recipe:
          setup: ["An ACKNOWLEDGED incident with an OPEN war room."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15551005" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /war-rooms"
              payload: { incident_id: "${inc_id}" }
              as: IncidentCommander
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /war-rooms/${wr_id}/close"
              payload: {}
              as: IncidentCommander
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_INCIDENT_NOT_RESOLVED'"

      - name: action_item_complete_bubbles_up_open_count
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ActionItem.IN_PROGRESS_to_DONE
          - entities.Postmortem.fields.open_action_item_count
        distinguishing_aspect: "Completing an IN_PROGRESS action item decrements parent Postmortem.open_action_item_count from 1 to 0 (bubble-up)."
        test_recipe:
          setup: ["Postmortem with one action item moved to IN_PROGRESS by its owner."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15551006" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /postmortems"
              payload: { incident_id: "${inc_id}", summary: "rca" }
              as: IncidentCommander
              captures: { pm_id: $.data.id }
            - call: "POST /action-items"
              payload: { postmortem_id: "${pm_id}", owner_responder_id: "${r_id}", description: "fix" }
              as: IncidentCommander
              captures: { ai_id: $.data.id }
            - call: "POST /action-items/${ai_id}/start"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /action-items/${ai_id}/complete"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "GET /postmortems/${pm_id}"
              payload: {}
              as: IncidentCommander
              captures: { open_count: $.data.open_action_item_count }
          assert:
            - "ActionItem.${ai_id}.status == 'DONE'"
            - "Postmortem.${pm_id}.open_action_item_count == 0"

      - name: postmortem_publish_happy_path_terminal
        claim_type: Valid Transition
        grounds:
          - state_machines.Postmortem.IN_REVIEW_to_PUBLISHED
          - validations[priority=12]
        distinguishing_aspect: "An IN_REVIEW postmortem with zero open action items publishes to PUBLISHED (terminal)."
        test_recipe:
          setup: ["IN_REVIEW postmortem, no action items."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15551007" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-05-31T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /escalation-policies"
              payload: { name: "P", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /escalation-tiers"
              payload: { policy_id: "${p_id}", schedule_id: "${sch_id}", tier_level: 1, delay_minutes: 0 }
              as: PlatformAdmin
            - call: "POST /incidents"
              payload: { service_id: "${s_id}", policy_id: "${p_id}", title: "i", severity: "SEV2" }
              as: IncidentCommander
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/acknowledge"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /incidents/${inc_id}/resolve"
              payload: {}
              as: ResponderUser
              as_user_id: "${r_id}"
            - call: "POST /postmortems"
              payload: { incident_id: "${inc_id}", summary: "rca" }
              as: IncidentCommander
              captures: { pm_id: $.data.id }
            - call: "POST /postmortems/${pm_id}/submit"
              payload: {}
              as: IncidentCommander
          trigger:
            - call: "POST /postmortems/${pm_id}/publish"
              payload: {}
              as: IncidentCommander
              captures: { st: $.data.status }
          assert:
            - "Postmortem.${pm_id}.status == 'PUBLISHED'"

  # ===========================================================================
  - section: calculations
    instances:
      - name: paging_fanout_one_attempt_per_enabled_channel
        claim_type: Correct Result
        grounds:
          - calculations.paging_fanout
          - entities.PageAttempt.fields.channel
        distinguishing_aspect: "A responder with email+sms+voice (no push) produces exactly 3 PageAttempt rows on the first page (VOICE, SMS, EMAIL), no PUSH."
        test_recipe:
