              payload: { property_legal_name: "Nd Prop", street_address: "9 N St", acquisition_price_cents: 1000000 }
              as: SponsorOperator
              captures: { prop_id: "$.data.id" }
            - call: "POST /syndications/${syn_id}/properties/${prop_id}/capital-events"
              payload: { event_kind: "REFINANCE", gross_proceeds_cents: 8500000, debt_payoff_cents: 2300000 }
              as: SponsorOperator
              captures: { ev_id: "$.data.id" }
          trigger:
            - call: "POST /syndications/${syn_id}/properties/${prop_id}/capital-events/${ev_id}/execute"
