      - name: ra_application_revision_cycle_capped_at_two_rounds
        grounds:
          - state_machines.RAApplication.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.RAApplication.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.RAApplication.SUBMITTED_to_UNDER_REVIEW
          - entities.RAApplication.fields.revision_count
          - validations[priority=32]
          - errors[ERR_REVISION_LIMIT_REACHED]
        distinguishing_aspect: |
          RAApplication is a different entity from RA and its non-linearity is a cycle rather
          than parallel dimensions: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED ->
          UNDER_REVIEW runs twice, revision_count reaches 2, and the third REQUEST_REVISION
          is refused with ERR_REVISION_LIMIT_REACHED while the row stays UNDER_REVIEW.
        test_recipe:
          setup:
            - "A student has an RAApplication for term 2026FA that has been through the revision loop twice."
