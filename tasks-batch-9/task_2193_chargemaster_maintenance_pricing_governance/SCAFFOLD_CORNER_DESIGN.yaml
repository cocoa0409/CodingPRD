              as: SystemAdmin
              captures: { rc250: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0637", description: "Self-administrable drugs", requires_hcpcs: true, allowed_code_types: ["HCPCS"], pricing_class: "PHARMACY", status: "RETIRED" }
              as: SystemAdmin
