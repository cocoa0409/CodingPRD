              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "EXCELLENT", machine_condition: "GOOD", door_equipment_condition: "FAIR" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /equipment-surveys/${s1_id}/score-preview"
              payload: { basis: "OBSERVED_ONLY" }
              as: ProjectManager
            - call: "GET /equipment-surveys/${s1_id}/score-preview"
              payload: { basis: "IMPUTED_FAILED" }
              as: ProjectManager
          assert:
            - "The OBSERVED_ONLY preview returns HTTP 200 with basis == OBSERVED_ONLY, score == 82.75, observed_weight_total == 1.00, recommended_scope_tier == CONTROLLER_ONLY"
            - "The IMPUTED_FAILED preview returns score == 82.75 and observed_weight_total == 1.00 as well, because no dimension was NOT_OBSERVED - the two bases only diverge on unobserved equipment"
            - "Neither preview mutates anything: EquipmentSurvey.${s1_id}.status is still SUBMITTED, final_score is still null, and ElevatorCar.${c1_id}.condition_score is still null"

