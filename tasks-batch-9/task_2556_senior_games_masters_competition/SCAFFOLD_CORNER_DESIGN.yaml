        grounds:
          - validations[priority=70]
          - errors[ERR_REGISTRATION_DEADLINE_PASSED]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Moving the logical clock one second past registration_deadline_utc makes POST /athletes and POST /sport-entries return HTTP 422 ERR_REGISTRATION_DEADLINE_PASSED even though the edition is still REGISTRATION_OPEN, so priority 70 is enforced on the clock rather than on the edition status."
