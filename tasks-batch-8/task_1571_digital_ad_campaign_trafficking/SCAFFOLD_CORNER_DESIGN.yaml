            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-10", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
