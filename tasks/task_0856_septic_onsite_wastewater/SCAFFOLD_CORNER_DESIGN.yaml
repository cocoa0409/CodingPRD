        grounds:
          - concurrency_rules[transfer-inspection-create-stale-parcel]
          - errors[ERR_STALE_PARCEL_VERSION]
          - endpoints[POST /transfer-inspections]
        distinguishing_aspect: "A fee payment recorded between the client's read and its transfer request bumps Parcel.version, so the request carrying the pre-payment version is refused with ERR_STALE_PARCEL_VERSION 412 and no TransferInspection row is created."
