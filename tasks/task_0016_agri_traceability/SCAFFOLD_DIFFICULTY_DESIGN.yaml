scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pass_fail_short_circuit_vs_full_eval
        grounds:
          - calculations.pass_fail_decision
          - calculations.pass_fail_decision.variants[aggregate_pass_fail]
          - entities.InspectionReport.fields.result
          - endpoints["POST /inspection-reports/{id}/issue"]
        distinguishing_aspect: |
          Two valid evaluation strategies on the SAME inputs of an InspectionReport (entity domain: quality
          inspection) — short-circuit on first failing test_item versus evaluating all items then aggregating —
          produce identical PASS/FAIL booleans but different audit details (which test_item is recorded as the
          first failing item). The scaffold pins short-circuit semantics. This is the inspection-domain dual variant.
        test_recipe:
          setup:
            - "Seed PesticideRegistry rows (e.g., PD-000001 with withdrawal=0, max_dosage=100)."
            - "Create PlantingBatch B1 by Grower g1; advance to HARVESTED via declare-growing then harvest-record."
            - "Create InspectionReport R1 for B1 by Inspector i1 with test_items=[PESTICIDE_RESIDUE, MICROORGANISMS], pesticide_residue_mg_per_kg=0.60 (>0.50 → FAIL), microorganism_cfu_per_g=200000 (>100000 → also FAIL)."
          trigger:
            - "POST /inspection-reports/{R1.id}/issue"
          assert:
            - "InspectionReport.result == 'FAIL'"
            - "AuditLog row for STATE_TRANSITION on InspectionReport R1 has change_summary.first_failing_item == 'PESTICIDE_RESIDUE' (not MICROORGANISMS), proving short-circuit order"
            - "PlantingBatch.status transitions to INSPECTED_FAIL and posture == 'BLOCKED'"

      - name: cold_chain_chronological_replay_vs_append_only
        grounds:
          - calculations.cold_chain_breach_detection
          - calculations.cold_chain_breach_detection.variants[chronological_replay]
          - entities.LogisticsLeg.fields.abnormal_segment_count
          - state_machines.LogisticsLeg.IN_TRANSIT_to_ABNORMAL
        distinguishing_aspect: |
          Two valid algorithms on the SAME SensorReading set for a LogisticsLeg (entity domain: logistics) — append-only
          (count breaches as ingested) vs chronological replay (re-sort by reading_at and recompute) — produce
          different abnormal_segment_count when readings arrive out of order. The scaffold pins chronological replay,
          and this is the logistics-domain dual variant, structurally distinct from the inspection-domain instance above.
        test_recipe:
          setup:
            - "Create batch B2 (Grower); progress to INSPECTED_PASS; mint QR; create LogisticsLeg L1 (depart_at=2026-04-01T00:00:00Z, arrive_at=2026-04-02T00:00:00Z, temperature_min_c=2, temperature_max_c=4)."
            - "POST /logistics-legs/{L1}/depart"
            - "Ingest sensor readings IN ORDER: t=01:00 temp=3 (in-range), t=02:00 temp=8 (out), t=03:00 temp=8 (out)."
            - "Now ingest a LATE reading with reading_at=01:30 temp=2 (in-range) — this BREAKS the contiguous run when chronologically replayed."
          trigger:
            - "POST /logistics-legs/{L1}/sensor-readings (the late in-range reading)"
          assert:
            - "LogisticsLeg.abnormal_segment_count == 0 (chronological replay: readings sorted by reading_at are [01:00 in, 01:30 in, 02:00 out, 03:00 out] — only 2 consecutive breaches < 3)"
            - "LogisticsLeg.status remains IN_TRANSIT (no auto-transition to ABNORMAL)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pass_fail_decision_multimode_thresholds
        grounds:
          - calculations.pass_fail_decision
          - calculations.pass_fail_decision.constants
          - entities.InspectionReport.fields.test_items
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (pesticide_residue, heavy_metals, microorganism_cfu) combined non-linearly
          via per-item conditional comparisons against tiered thresholds, with mixed boundary semantics (inclusive <=
          for residue/heavy-metals, strict < for microbes). The combination requires three independent threshold
          comparisons whose result short-circuits the aggregate; choosing different boundaries flips PASS/FAIL.
        test_recipe:
          setup:
            - "Create batch B3 by Grower; advance to HARVESTED."
            - "Create InspectionReport R3 with test_items=[PESTICIDE_RESIDUE, HEAVY_METALS, MICROORGANISMS], pesticide_residue_mg_per_kg=0.50 (== threshold → PASS), heavy_metals_mg_per_kg=0.20 (== threshold → PASS), microorganism_cfu_per_g=100000 (== threshold → FAIL strict)."
          trigger:
            - "POST /inspection-reports/{R3.id}/issue"
          assert:
            - "InspectionReport.result == 'FAIL'"
            - "change_summary.first_failing_item == 'MICROORGANISMS' — the strict-threshold input is the only failing one"
            - "PlantingBatch.status == 'INSPECTED_FAIL'"

      - name: recall_disposal_per_record_rounding_then_sum
        grounds:
          - calculations.recall_disposal_reconciliation
          - calculations.recall_disposal_reconciliation.precision
          - validations[priority=16]
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. Each disposal record's disposed_kg is rounded to 2
          decimals (round_half_up) BEFORE summing, then the sum is taken AS-IS without further rounding. The
          alternative — sum-then-round — produces a different cumulative when several disposals carry sub-cent
          fractions. The scaffold pins per-record-then-sum, distinct from instance #1 which is mode (a).
        test_recipe:
          setup:
            - "Create batch B4 with 3 HarvestRecord rows of quantity_kg = 33.335, 33.335, 33.330 → total_quantity_kg = 100.00 (sum exact)."
            - "RegulatoryOfficer initiates recall on B4 with reason_code=CONSUMER_COMPLAINT."
            - "Notify the recall."
          trigger:
            - "POST /recall-orders/{R}/disposals with disposed_kg=33.335 (rounds to 33.34)"
            - "POST /recall-orders/{R}/disposals with disposed_kg=33.335 (rounds to 33.34)"
            - "POST /recall-orders/{R}/disposals with disposed_kg=33.330 (rounds to 33.33)"
            - "POST /recall-orders/{R}/complete"
          assert:
            - "RecallOrder.total_quantity_disposed_kg == 100.01 (33.34 + 33.34 + 33.33), NOT 100.00 (sum-then-round would yield 100.00)"
            - "POST complete returns 422 with ERR_RECALL_OVER_DISPOSED on the third disposal because per-record rounding has pushed cumulative past total_recalled (proves per-record-rounding-then-sum order is enforced)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_report_branching_with_revert
        grounds:
          - state_machines.InspectionReport
          - state_machines.InspectionReport.DRAFT_to_ISSUED
          - state_machines.InspectionReport.ISSUED_to_REVOKED
        distinguishing_aspect: |
          InspectionReport's state machine branches at issuance (DRAFT→ISSUED with two divergent side-effect
          sets keyed by computed result==PASS vs FAIL on the parent batch) AND admits a revert edge (ISSUED→REVOKED
          that cascades the parent batch back to HARVESTED). This is non-linear (branching + revert) on entity
          InspectionReport.
        test_recipe:
          setup:
            - "Create batch B5 (Grower); harvest; create+issue InspectionReport R5 with all PASS values → batch INSPECTED_PASS."
          trigger:
            - "POST /inspection-reports/{R5.id}/revoke"
          assert:
            - "InspectionReport.status == 'REVOKED'"
            - "PlantingBatch.status reverts to 'HARVESTED' (cascade from revoke)"
            - "AuditLog has TWO STATE_TRANSITION entries: InspectionReport ISSUED→REVOKED and PlantingBatch INSPECTED_PASS→HARVESTED"

      - name: recall_order_cyclic_via_cancel
        grounds:
          - state_machines.RecallOrder
          - state_machines.RecallOrder.INITIATED_to_CANCELLED
          - state_machines.PlantingBatch.RECALLED_to_DISPOSED
          - entities.PlantingBatch.fields.recall_status
        distinguishing_aspect: |
          RecallOrder's machine has both a forward fork (INITIATED → NOTIFIED → IN_PROGRESS → COMPLETED) and a
          conditional revert edge (INITIATED → CANCELLED) that re-opens the parent batch's lifecycle. Combined
          with PlantingBatch admitting a cyclic re-entry into its earlier non-terminal status when the cancel
          fires, this exercises non-linear shape on a DIFFERENT entity (RecallOrder) than instance #1 above.
        test_recipe:
          setup:
            - "Create batch B6, deliver it to status DELIVERED."
            - "RegulatoryOfficer POSTs /recall-orders → batch.status=RECALLED, recall_status=ACTIVE_RECALL, QRCode revoked."
          trigger:
            - "POST /recall-orders/{R6.id}/cancel"
          assert:
            - "RecallOrder.status == 'CANCELLED'"
            - "PlantingBatch.recall_status == 'NONE'"
            - "PlantingBatch.status reverts to 'DELIVERED' (the prior status recorded in audit log change_summary)"
            - "QRCode.revoked == false (un-revoked on cancel)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cold_chain_breach_to_recall_to_qr_revocation_chain
        grounds:
          - state_machines.LogisticsLeg.IN_TRANSIT_to_ABNORMAL
          - state_machines.PlantingBatch.IN_TRANSIT_to_RECALLED
          - entities.QRCode.fields.revoked
          - calculations.cold_chain_breach_detection
        distinguishing_aspect: |
          Depth-3 cascade originating from a single SensorReading POST: A) sensor reading insert mutates
          LogisticsLeg.abnormal_segment_count and triggers leg → ABNORMAL; B) ABNORMAL transition itself
          (caused by A's mutation, not by the original action) auto-emits a recall, mutating PlantingBatch
          to RECALLED; C) the RECALLED transition itself (caused by B) cascades QRCode rows for the batch
          to revoked=true. Each link is caused strictly by the previous link's mutation.
        test_recipe:
          setup:
            - "Create batch B7 with one harvest, mint QR Q7, advance through INSPECTED_PASS, create leg L7 (depart 04-01T00:00, arrive 04-02T00:00, range [2,4])."
            - "POST /logistics-legs/{L7}/depart"
            - "Insert 2 out-of-range readings at 01:00 and 02:00 with temp=8."
          trigger:
            - "POST /logistics-legs/{L7}/sensor-readings at 03:00 with temp=8 (third consecutive breach)"
          assert:
            - "LogisticsLeg.status == 'ABNORMAL' AND abnormal_segment_count == 1"
            - "PlantingBatch.status == 'RECALLED' AND recall_status == 'ACTIVE_RECALL' (link B caused by A)"
            - "QRCode.revoked == true (link C caused by B)"
            - "AuditLog contains four entries in order: STATE_TRANSITION leg→ABNORMAL, RECALL_INITIATE, STATE_TRANSITION batch→RECALLED, UPDATE on QRCode"

      - name: prohibited_substance_flip_cascades_batch_posture_and_inspection_revoke
        grounds:
          - endpoints["PATCH /pesticide-registry/{registration_no}/prohibit"]
          - entities.PesticideRegistry.fields.prohibited
          - entities.PlantingBatch.fields.posture
          - state_machines.InspectionReport.ISSUED_to_REVOKED
          - endpoints["POST /_events/emit"]
        distinguishing_aspect: |
          Depth-2 cascade originating from a DIFFERENT trigger (regulatory prohibition action, not a sensor
          reading): A) PATCH /pesticide-registry/{r}/prohibit mutates PesticideRegistry.prohibited; B) the
          regulatory event emit (POST /_events/emit with event_type=REGULATORY_PROHIBITION_NOTICE) — caused by
          the registry flip — re-evaluates affected batches' posture from CLEAN to FLAGGED for any batch with
          AgrochemicalApplication referencing that registration_no. This is a fan-in re-evaluation, distinct
          from the sensor cascade above, originating from a regulatory trigger.
        test_recipe:
          setup:
            - "Seed PesticideRegistry PD-000099 (prohibited=false)."
            - "Create batch B8 by Grower; record AgrochemicalApplication using PD-000099; batch.status=GROWING, posture=CLEAN."
          trigger:
            - "PATCH /pesticide-registry/PD-000099/prohibit (RegulatoryOfficer)"
            - "POST /_events/emit with event_type='REGULATORY_PROHIBITION_NOTICE', payload={registration_no:'PD-000099'}"
          assert:
            - "PesticideRegistry.prohibited == true (link A)"
            - "PlantingBatch.posture == 'FLAGGED' (link B caused by link A's mutation propagating through the regulatory event)"
            - "AuditLog has UPDATE on PesticideRegistry, UPDATE on PlantingBatch.posture"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_priority_on_application
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PROHIBITED_SUBSTANCE
        distinguishing_aspect: |
          Conflict pair: state (priority 5) vs business_safety (priority 6). When a batch is already in HARVESTED
          and the Grower POSTs an AgrochemicalApplication referencing a prohibited registry entry, BOTH checks
          fail. Priority 5 fires first → ERR_INVALID_STATE wins, NOT ERR_PROHIBITED_SUBSTANCE. The error-category
          pair tested here is {state, business_safety}.
        test_recipe:
          setup:
            - "Seed PesticideRegistry PD-000050 with prohibited=true."
            - "Create batch B9 and progress to HARVESTED status."
          trigger:
            - "POST /planting-batches/{B9.id}/agrochemical-applications with registration_no=PD-000050"
          assert:
            - "Response status 409 with error_id == 'ERR_INVALID_STATE' (NOT ERR_PROHIBITED_SUBSTANCE)"

      - name: business_constraint_vs_business_referential_priority_on_harvest
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - errors.ERR_WITHDRAWAL_NOT_ELAPSED
          - errors.ERR_BIN_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Conflict pair: business_referential (priority 10, withdrawal-period referential check via registry) vs
          business_constraint (priority 13, storage-bin capacity). Both fail simultaneously when the harvest_date
          violates withdrawal AND quantity exceeds bin capacity. Priority 10 fires first → ERR_WITHDRAWAL_NOT_ELAPSED.
          This pair {business_referential, business_constraint} is structurally distinct from the {state,
          business_safety} pair in instance #1.
        test_recipe:
          setup:
            - "Seed PesticideRegistry PD-000010 with withdrawal_period_days=30, max_dosage=200."
            - "Create batch B10 (planting_date=2026-01-01); record application on 2026-04-01 → earliest_legal_harvest_date=2026-05-01."
            - "Create StorageBin BIN-100 with capacity_kg=10."
          trigger:
            - "POST /planting-batches/{B10.id}/harvest-records with harvest_date=2026-04-15 (BEFORE 2026-05-01) AND quantity_kg=50 (exceeds capacity 10) AND storage_bin_id=BIN-100"
          assert:
            - "Response status 422 with error_id == 'ERR_WITHDRAWAL_NOT_ELAPSED' (NOT ERR_BIN_CAPACITY_EXCEEDED)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: microorganism_strict_less_than_threshold
        grounds:
          - calculations.pass_fail_decision.constants
          - calculations.pass_fail_decision.variants[boundary_treatment]
          - endpoints["POST /inspection-reports/{id}/issue"]
        distinguishing_aspect: |
          Strict-less-than boundary on a numeric metric (microorganism_cfu_per_g). Threshold = 100000; value
          == 100000 must FAIL because the rule is < (not <=). Reachable via the issue endpoint. Metric:
          microbial CFU.
        test_recipe:
          setup:
            - "Create batch B11; harvest."
            - "Create InspectionReport R11 with test_items=[MICROORGANISMS], microorganism_cfu_per_g=100000 (exactly the threshold)."
          trigger:
            - "POST /inspection-reports/{R11.id}/issue"
          assert:
            - "InspectionReport.result == 'FAIL' (strict < boundary; equality fails)"
            - "PlantingBatch.status == 'INSPECTED_FAIL'"

      - name: empty_sensor_set_legal_acknowledge
        grounds:
          - state_machines.LogisticsLeg.IN_TRANSIT_to_HANDED_OVER
          - calculations.cold_chain_breach_detection
          - endpoints["POST /logistics-legs/{id}/acknowledge"]
        distinguishing_aspect: |
          Empty-collection edge case on a different metric (count of sensor readings = 0) reachable via a
          DIFFERENT endpoint (acknowledge). When a leg has zero SensorReading rows, abnormal_segment_count == 0
          and acknowledge MUST succeed, transitioning IN_TRANSIT → HANDED_OVER. Empty-set boundary is
          structurally distinct from the strict-numeric instance above.
        test_recipe:
          setup:
            - "Create batch B12 through INSPECTED_PASS; mint QR; create leg L12; POST /logistics-legs/{L12}/depart."
            - "Submit ZERO sensor readings (deliberately)."
          trigger:
            - "POST /logistics-legs/{L12}/acknowledge as Distributor (X-User-ID == leg.to_party_id)"
          assert:
            - "Response status 200; LogisticsLeg.status == 'HANDED_OVER', abnormal_segment_count == 0"
            - "PlantingBatch.status == 'DELIVERED' (last leg of batch)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: leg_depart_blocked_by_batch_posture
        grounds:
          - state_machines.LogisticsLeg.PLANNED_to_IN_TRANSIT
          - entities.PlantingBatch.fields.posture
          - entities.PlantingBatch.fields.status
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair {LogisticsLeg, PlantingBatch}: a LogisticsLeg can transition PLANNED→IN_TRANSIT only
          when its parent PlantingBatch.status ∈ {INSPECTED_PASS, IN_TRANSIT} AND posture != BLOCKED. The leg's
          valid transitions depend on the batch's state.
        test_recipe:
          setup:
            - "Create batch B13; harvest; issue InspectionReport with FAIL → batch.status=INSPECTED_FAIL, posture=BLOCKED."
            - "Plan a logistics leg L13 for the batch (creation is allowed because PLANNED is initial)."
          trigger:
            - "POST /logistics-legs/{L13.id}/depart"
          assert:
            - "Response status 409 with error_id == 'ERR_INVALID_STATE'"
            - "LogisticsLeg.status remains 'PLANNED'"

      - name: inspection_issue_blocked_by_segregation_grower_identity
        grounds:
          - state_machines.InspectionReport.DRAFT_to_ISSUED
          - validations[priority=7]
          - entities.PlantingBatch.fields.grower_id
          - errors.ERR_SEGREGATION_VIOLATION
        distinguishing_aspect: |
          Entity pair {InspectionReport, PlantingBatch} via Grower-as-actor identity: an InspectionReport's
          DRAFT→ISSUED transition is rejected when the inspector's X-User-ID equals the parent batch's
          grower_id. The dependency crosses inspection lifecycle ↔ batch ownership identity, structurally
          distinct from the {LogisticsLeg, PlantingBatch} pair above.
        test_recipe:
          setup:
            - "Create batch B14 with grower X-User-ID='user-grow-1'."
            - "Harvest the batch."
            - "Create InspectionReport R14 (Inspector role, X-User-ID='user-grow-1' — same id as grower, simulating identity overlap)."
          trigger:
            - "POST /inspection-reports/{R14.id}/issue with X-User-ID='user-grow-1', X-User-Role='Inspector'"
          assert:
            - "Response status 403 with error_id == 'ERR_SEGREGATION_VIOLATION'"
            - "InspectionReport.status remains 'DRAFT'"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: logistics_leg_closed_open_overlap
        grounds:
          - validations[priority=11]
          - entities.LogisticsLeg.fields.depart_at
          - entities.LogisticsLeg.fields.arrive_at
          - errors.ERR_LEG_INTERVAL_OVERLAP
        distinguishing_aspect: |
          Closed-open interval semantics on LogisticsLeg: a new leg's [depart_at, arrive_at) must not overlap
          any existing leg of the same batch. Adjacent boundaries — a leg ending at exactly T followed by
          another leg starting at exactly T — DO NOT overlap (the right endpoint is exclusive). This is the
          "back-to-back legal" interval semantics on the LogisticsLeg resource.
        test_recipe:
          setup:
            - "Create batch B15 through INSPECTED_PASS."
            - "Create leg L15a with depart_at=2026-04-01T00:00:00Z, arrive_at=2026-04-02T00:00:00Z."
          trigger:
            - "POST /planting-batches/{B15.id}/logistics-legs with leg_index=2, depart_at=2026-04-02T00:00:00Z (== L15a.arrive_at), arrive_at=2026-04-03T00:00:00Z"
            - "Then POST another leg with leg_index=3, depart_at=2026-04-02T12:00:00Z (mid-leg-2 → overlap), arrive_at=2026-04-04T00:00:00Z"
          assert:
            - "First request: 201 created (back-to-back legal, [00:00, 00:00) doesn't overlap)"
            - "Second request: 422 with error_id == 'ERR_LEG_INTERVAL_OVERLAP'"

      - name: bin_aggregate_capacity_overlap
        grounds:
          - validations[priority=13]
          - calculations.storage_bin_occupancy
          - entities.StorageBin.fields.capacity_kg
          - errors.ERR_BIN_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Aggregate-capacity occupation semantics on StorageBin (a different resource entity from LogisticsLeg).
          The "interval" here is a capacity occupation rather than a time interval; the rule rejects when
          sum(active HarvestRecord.quantity_kg) + new.quantity_kg > capacity_kg. Boundary semantics differ:
          equality (== capacity) is allowed (<=), making this aggregate-inclusive — structurally distinct
          from the time-based closed-open semantics in instance #1.
        test_recipe:
          setup:
            - "Create StorageBin BIN-200 with capacity_kg=100."
            - "Create batch B16 (no withdrawal constraints), advance to GROWING via declare-growing."
            - "Submit harvest record qty=70 to BIN-200 → occupied=70."
          trigger:
            - "POST /planting-batches/{B16.id}/harvest-records with quantity_kg=30, storage_bin_id=BIN-200"
            - "POST /planting-batches/{B16.id}/harvest-records with quantity_kg=1, storage_bin_id=BIN-200 (one kg over)"
          assert:
            - "First request: 201 (occupied becomes exactly 100 = capacity, allowed by <=)"
            - "Second request: 409 with error_id == 'ERR_BIN_CAPACITY_EXCEEDED' (101 > 100)"
            - "StorageBin.occupied_kg == 100.00 (unchanged by rejected request)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: recall_cancel_preserves_qr_revocation_count
        grounds:
          - state_machines.PlantingBatch.RECALLED_to_DISPOSED
          - state_machines.RecallOrder.INITIATED_to_CANCELLED
          - entities.QRCode.fields.revoked
        distinguishing_aspect: |
          Conserved quantity: count of non-revoked QRCode rows for the batch. The forward action (recall init,
          which sets all batch QRs revoked=true) paired with its compensating action (recall cancel, which
          sets all batch QRs revoked=false) MUST leave the count of non-revoked QR codes for the batch
          unchanged. Formula: count(QRCode where planting_batch_id == B and revoked == false) before recall
          init == count(...) after recall cancel. This is a categorical/count conservation.
        test_recipe:
          setup:
            - "Create batch B17, mint QR codes for 2 distinct harvest records (Q17a, Q17b). Both revoked=false."
            - "Snapshot pre_count = 2."
            - "Initiate recall on B17 (recall_class=CLASS_II)."
          trigger:
            - "POST /recall-orders/{R17.id}/cancel (no disposals yet)"
          assert:
            - "After cancel, count of QRCode where planting_batch_id == B17 and revoked == false equals 2 (== pre_count)"
            - "Both Q17a.revoked == false and Q17b.revoked == false"

      - name: bin_occupancy_conservation_under_revoke_then_reissue
        grounds:
          - state_machines.InspectionReport.ISSUED_to_REVOKED
          - state_machines.InspectionReport.DRAFT_to_ISSUED
          - calculations.storage_bin_occupancy
          - entities.StorageBin.fields.occupied_kg
        distinguishing_aspect: |
          Conserved quantity: StorageBin.occupied_kg (kilograms — a continuous mass quantity, distinct from
          the categorical count above). The forward action (inspection issue with PASS that does NOT alter
          occupancy) paired with its compensating action (inspection revoke, which reverts batch to HARVESTED
          but does NOT release bin) MUST leave occupied_kg unchanged. Formula: bin.occupied_kg before issue
          == bin.occupied_kg after revoke. The two actions exercise mass conservation rather than count
          conservation.
        test_recipe:
          setup:
            - "Create batch B18 with single harvest qty=50.00 to BIN-300 (capacity 100); bin.occupied_kg = 50.00."
            - "Create InspectionReport R18 with PASS values; issue → batch INSPECTED_PASS."
            - "Snapshot pre_occupied = bin.occupied_kg = 50.00."
          trigger:
            - "POST /inspection-reports/{R18.id}/revoke"
          assert:
            - "After revoke, bin.occupied_kg == 50.00 (== pre_occupied, mass conserved exactly)"
            - "PlantingBatch.status == 'HARVESTED' (reverted)"
            - "StorageBin.status remains 'AVAILABLE' (50/100 still under capacity)"
