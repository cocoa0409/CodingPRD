  - method: POST
    path: "/acquisitions/inspections/{id}/qa-reject"
    description: "COMPLETED -> QA_REJECTED; caller must differ from completer"
    roles: [PropertyOperationsLead]
    code: 200
    input: [reason]
    output: UnitWalkInspection
    side_effects: ["posture recomputed"]
  - method: POST
    path: "/acquisitions/inspections/{id}/reschedule"
