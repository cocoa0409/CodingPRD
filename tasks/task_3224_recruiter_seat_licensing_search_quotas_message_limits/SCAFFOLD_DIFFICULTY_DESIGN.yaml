      - name: stale_contract_state_beats_trueup_bounds
        grounds:
          - validations[priority=4]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TRUEUP_BOUNDS]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: approving a RenewalEvent
          on a SUSPENDED contract while the seats_delta would also breach
          the true-up bounds MUST surface ERR_INVALID_STATE (priority 4),
          not ERR_TRUEUP_BOUNDS (priority 14).
        test_recipe:
          setup:
            - "PRO contract with seats_purchased=2, both seats assigned (seats_assigned=2), then contract SUSPENDED via approved SUSPENSION event"
            - "a PROPOSED RenewalEvent kind=TRUE_UP seats_delta=-2 (which would drop seats_purchased to 0 < seats_assigned — bounds violation) created BEFORE suspension"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-PRI-2", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
