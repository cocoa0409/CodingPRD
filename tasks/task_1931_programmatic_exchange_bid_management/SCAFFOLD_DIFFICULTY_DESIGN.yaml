# =============================================================================
# Task 1931 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. All grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: first_price_vs_second_price_clearing_divergence
        grounds:
          - calculations.clearing_price
          - entities.Deal.fields.auction_type
          - entities.AuctionRecord.fields.clearing_cpm_micros
        distinguishing_aspect: |
          Identical bids, floors and impression counts on two otherwise identical
          deals produce different clearing prices purely from the auction_type
          variant: FIRST_PRICE pays the winning bid (2,000,000) while SECOND_PRICE
          pays max(pinned floor, runner-up + 1000) = 1,501,000. Entity domain:
          auction clearing on Deal/AuctionRecord.
        test_recipe:
          setup:
            - "Two publishers P_FP and P_SP, each with one ACTIVE package (base floor 1,000,000 micros CPM, no seasonal window)"
            - "One demand partner DP (max_qps 100, daily_cap 100,000,000 micros, ACTIVE)"
            - "Deal D_FP on P_FP's package: FIRST_PRICE, floor 1,000,000, flight 2026-08-01..2026-12-31, APPROVED (approved floor 1,000,000)"
            - "Deal D_SP on P_SP's package: SECOND_PRICE, same floor and flight, APPROVED (approved floor 1,000,000)"
            - "Logical clock at default 2026-08-01T00:00:00Z (inside both flights)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub FP", domain: "pubfp.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_fp: $.data.id } }
            - { call: "POST /publishers", payload: { name: "Pub SP", domain: "pubsp.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_sp: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg FP", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 1000000 }, as: PublisherManager, as_user_id: "${pub_fp}", captures: { pkg_fp: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg SP", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 1000000 }, as: PublisherManager, as_user_id: "${pub_sp}", captures: { pkg_sp: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_fp}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 1000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_fp}", captures: { deal_fp: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_sp}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "SECOND_PRICE", floor_cpm_micros: 1000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_sp}", captures: { deal_sp: $.data.id } }
            - { call: "POST /deals/${deal_fp}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_fp}" }
            - { call: "POST /deals/${deal_fp}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /deals/${deal_sp}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_sp}" }
            - { call: "POST /deals/${deal_sp}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - call: "POST /auctions/execute"
              payload: { publisher_id: "${pub_fp}", bids: [ { bid_cpm_micros: 2000000, impression_count: 1000, creative_domain: "x.com" }, { bid_cpm_micros: 1500000, impression_count: 1000, creative_domain: "y.com" } ] }
              as: DemandSide
              captures: { fp_clearing: $.data.auction_record.clearing_cpm_micros, fp_gross: $.data.auction_record.gross_micros }
            - call: "POST /auctions/execute"
              payload: { publisher_id: "${pub_sp}", bids: [ { bid_cpm_micros: 2000000, impression_count: 1000, creative_domain: "x.com" }, { bid_cpm_micros: 1500000, impression_count: 1000, creative_domain: "y.com" } ] }
              as: DemandSide
              captures: { sp_clearing: $.data.auction_record.clearing_cpm_micros, sp_gross: $.data.auction_record.gross_micros }
          assert:
            - "FIRST_PRICE record: clearing_cpm_micros == 2000000 and gross_micros == 2000000"
            - "SECOND_PRICE record: clearing_cpm_micros == 1501000 and gross_micros == 1501000 (runner-up 1,500,000 + step 1,000 exceeds pinned floor 1,000,000)"
            - "Variant delta on identical input: gross_micros differ by exactly 499000 micros"

      - name: sequential_liability_vs_guaranteed_payout_basis
        grounds:
          - calculations.payout_line_composition
          - entities.Publisher.fields.payment_terms
          - entities.PayoutLine.fields.payable_micros
        distinguishing_aspect: |
          Two publishers with byte-identical auction history (two records each,
          net 850,000 micros apiece, exactly one confirmed for the SL publisher)
          produce different payable amounts purely from the payment_terms variant:
          SEQUENTIAL_LIABILITY pays only DSP-confirmed net (850,000) while
          GUARANTEED pays full SSP net (1,700,000). Entity domain: publisher payout
          composition on Publisher/PayoutLine — a different domain from auction
          clearing.
        test_recipe:
          setup:
            - "Publisher P_SL (SEQUENTIAL_LIABILITY) and publisher P_G (GUARANTEED), each with one ACTIVE package (base floor 500,000) and one APPROVED FIRST_PRICE deal (floor 500,000, flight 2026-08-01..2026-12-31) on partner DP (max_qps 100, daily_cap 100,000,000)"
            - "Each publisher has exactly two filled auctions (single bid 1,000,000 CPM x 1000 imps each): gross 1,000,000, exchange fee 150,000, publisher_net 850,000 per record"
            - "For P_SL only the FIRST record is billing-confirmed; for P_G no confirmation is needed (basis ignores it)"
            - "Batch B created for period [2026-08-01, 2026-09-01)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub SL", domain: "sl.com", payment_terms: "SEQUENTIAL_LIABILITY" }, as: ExchangeAdmin, captures: { pub_sl: $.data.id } }
            - { call: "POST /publishers", payload: { name: "Pub G", domain: "g.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_g: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg SL", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_sl}", captures: { pkg_sl: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg G", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_g}", captures: { pkg_g: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_sl}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_sl}", captures: { deal_sl: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_g}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_g}", captures: { deal_g: $.data.id } }
            - { call: "POST /deals/${deal_sl}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_sl}" }
            - { call: "POST /deals/${deal_sl}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /deals/${deal_g}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_g}" }
            - { call: "POST /deals/${deal_g}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_sl}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_sl_1: $.data.auction_record.id } }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_sl}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_g}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_g}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /auction-records/${rec_sl_1}/confirm-billing", payload: {}, as: DemandSide }
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /payout-batches/${batch_id}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /payout-batches/${batch_id}/lines?status=PENDING", payload: {}, as: FinanceOfficer, captures: { sl_payable: "$.data[0].payable_micros", sl_status: "$.data[0].status" } }
            - { call: "GET /payout-batches/${batch_id}/lines?status=ELIGIBLE", payload: {}, as: FinanceOfficer, captures: { g_payable: "$.data[0].payable_micros", g_status: "$.data[0].status" } }
          assert:
            - "SEQUENTIAL_LIABILITY line: payable_micros == 850000 (confirmed portion only) and status == PENDING at submit"
            - "GUARANTEED line: payable_micros == 1700000 (full SSP net) and status == ELIGIBLE at submit"
            - "Identical gross history (1,700,000 net per publisher) yields a 850000-micros payable gap driven only by payment_terms"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_exchange_fee_marginal_slabs
        grounds:
          - calculations.exchange_fee
          - entities.AuctionRecord.fields.exchange_fee_micros
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: the exchange fee is a
          MARGINAL three-slab schedule (15%/10%/5% with caps at 5M and 20M micros),
          so gross 21,000,000 yields 2,300,000 (750,000 + 1,500,000 + 50,000),
          not 3,150,000 (flat 15%) and not 1,050,000 (flat 5% on all).
        test_recipe:
          setup:
            - "Publisher P with package (base floor 500,000), APPROVED FIRST_PRICE deal (floor 500,000, flight covers default clock), partner DP (max_qps 100, daily_cap 100,000,000)"
            - "No supply-chain nodes on the package (supply fee 0)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "VIDEO", category_tags: ["IAB2"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - call: "POST /auctions/execute"
              payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 4200000, impression_count: 5000, creative_domain: "big.com" } ] }
              as: DemandSide
              captures: { gross: $.data.auction_record.gross_micros, fee: $.data.auction_record.exchange_fee_micros, net: $.data.auction_record.publisher_net_micros }
          assert:
            - "gross_micros == 21000000 (clearing 4,200,000 CPM x 5000 imps / 1000)"
            - "exchange_fee_micros == 2300000 (slab1 750,000 + slab2 1,500,000 + slab3 50,000, each slab rounded then summed)"
            - "publisher_net_micros == 18700000 (no supply chain)"

      - name: supply_path_waterfall_per_hop_rounding
        grounds:
          - calculations.supply_path_fee_waterfall
          - entities.AuctionRecord.fields.supply_fee_micros
          - entities.AuctionRecord.fields.publisher_net_micros
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: hop fees are computed
          round-half-up per hop on the SHRINKING remainder (after the exchange fee
          and after each prior hop). On remainder0 = 4,081,700 with hops 10%/5% the
          pinned order yields 408,170 + 183,677 = 591,847 (hop1 rounds 183,676.5
          up); computing both hops off remainder0 would give 612,255, and rounding
          only at the end would give 591,846. Different mode from
          tiered_exchange_fee_marginal_slabs (which is mode (a)).
        test_recipe:
          setup:
            - "Publisher P with package (base floor 2,000,000), two supply-chain hops: hop0 fee 1000 bps, hop1 fee 500 bps"
            - "APPROVED SECOND_PRICE deal (floor 1,500,000 -> approved floor = max(2,000,000, 1,500,000) = 2,000,000), partner DP (max_qps 100, daily_cap 100,000,000)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 2000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /supply-chain-nodes", payload: { package_id: "${pkg_id}", seller_domain: "ssp1.com", fee_bps: 1000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { node0: $.data.id } }
            - { call: "POST /supply-chain-nodes", payload: { package_id: "${pkg_id}", seller_domain: "ssp2.com", fee_bps: 500, parent_node_id: "${node0}" }, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "SECOND_PRICE", floor_cpm_micros: 1500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - call: "POST /auctions/execute"
              payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 3000000, impression_count: 2000, creative_domain: "a.com" }, { bid_cpm_micros: 2400000, impression_count: 1000, creative_domain: "b.com" } ] }
              as: DemandSide
              captures: { clearing: $.data.auction_record.clearing_cpm_micros, gross: $.data.auction_record.gross_micros, fee: $.data.auction_record.exchange_fee_micros, supply_fee: $.data.auction_record.supply_fee_micros, net: $.data.auction_record.publisher_net_micros }
          assert:
            - "clearing_cpm_micros == 2401000 (SECOND_PRICE: max(2,000,000, 2,400,000 + 1,000))"
            - "gross_micros == 4802000; exchange_fee_micros == 720300 (slab1 only)"
            - "supply_fee_micros == 591847 (hop0 408,170 on remainder 4,081,700; hop1 183,677 on remainder 3,673,530)"
            - "publisher_net_micros == 3489853"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_renegotiation_cycle_repins_approved_floor
        grounds:
          - state_machines.Deal.ACTIVE_to_RENEGOTIATING
          - state_machines.Deal.RENEGOTIATING_to_PENDING_REVIEW
          - entities.Deal.fields.approved_floor_cpm_micros
          - concurrency_rules[deal-commercial-edit-stale-version]
        distinguishing_aspect: |
          Deal has a CYCLE (ACTIVE -> RENEGOTIATING -> PENDING_REVIEW -> ACTIVE):
          renegotiation clears the pinned floor and increments renegotiation_count,
          and re-approval re-pins max(package floor, edited deal floor). Non-linear
          shape on entity Deal.
        test_recipe:
          setup:
            - "Publisher P, package (base floor 2,000,000, no seasonal window), APPROVED FIRST_PRICE deal with floor 1,000,000 (approved_floor pinned 2,000,000), partner DP ACTIVE"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 2000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 1000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin, captures: { v_approved: $.data.version, floor_pinned: $.data.approved_floor_cpm_micros } }
          trigger:
            - { call: "POST /deals/${deal_id}/renegotiate", payload: {}, as: PublisherManager, as_user_id: "${pub_id}", captures: { v_reneg: $.data.version, reneg_count: $.data.renegotiation_count } }
            - { call: "PUT /deals/${deal_id}", payload: { expected_deal_version: "${v_reneg}", floor_cpm_micros: 2500000 }, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin, captures: { floor_repinned: $.data.approved_floor_cpm_micros, status_after: $.data.status } }
          assert:
            - "After approve: approved_floor_cpm_micros == 2000000 (max(package effective 2,000,000, deal 1,000,000))"
            - "After renegotiate: status == RENEGOTIATING, renegotiation_count == 1, approved_floor_cpm_micros == null"
            - "PUT with the post-renegotiate version succeeds (RENEGOTIATING is editable)"
            - "After re-approve: status == ACTIVE and approved_floor_cpm_micros == 2500000 (max(2,000,000, edited 2,500,000))"

      - name: reconciliation_report_branching_entry_into_disputed
        grounds:
          - state_machines.ReconciliationReport.OPEN_to_ACKNOWLEDGED
          - state_machines.ReconciliationReport.ACKNOWLEDGED_to_DISPUTED
          - calculations.impression_discrepancy
        distinguishing_aspect: |
          ReconciliationReport has a BRANCHING shape: DISPUTED is reachable two
          ways — automatically at creation when discrepancy_pct > 2.000 (50.505%
          here) and via the OPEN -> ACKNOWLEDGED -> DISPUTED walk for
          non-auto-flagged reports. Non-linear shape on entity ReconciliationReport,
          a different entity from Deal.
        test_recipe:
          setup:
            - "TWO publishers P_HI and P_LO, each with one package (floor 500,000) and ONE approved FIRST_PRICE deal (D_HI on P_HI, D_LO on P_LO) sharing partner DP — separate publishers guarantee each auction fills its intended deal"
            - "On D_HI (auctions on P_HI): one 1000-impression fill (unconfirmed) and one 980-impression fill (confirmed in-window) -> ssp 1980 vs dsp 980"
            - "On D_LO (auctions on P_LO): one 500-impression fill, confirmed in-window -> ssp 500 vs dsp 500"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub HI", domain: "phi.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_hi: $.data.id } }
            - { call: "POST /publishers", payload: { name: "Pub LO", domain: "plo.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_lo: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg HI", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_hi}", captures: { pkg_hi: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg LO", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_lo}", captures: { pkg_lo: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_hi}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_hi}", captures: { deal_hi: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_lo}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_lo}", captures: { deal_lo: $.data.id } }
            - { call: "POST /deals/${deal_hi}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_hi}" }
            - { call: "POST /deals/${deal_hi}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /deals/${deal_lo}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_lo}" }
            - { call: "POST /deals/${deal_lo}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_hi}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_hi}", bids: [ { bid_cpm_micros: 1000000, impression_count: 980, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_hi: $.data.auction_record.id } }
            - { call: "POST /auction-records/${rec_hi}/confirm-billing", payload: {}, as: DemandSide }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_lo}", bids: [ { bid_cpm_micros: 1000000, impression_count: 500, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_lo: $.data.auction_record.id } }
            - { call: "POST /auction-records/${rec_lo}/confirm-billing", payload: {}, as: DemandSide }
          trigger:
            - { call: "POST /reconciliation-reports", payload: { deal_id: "${deal_hi}", period_start: "2026-08-01", period_end: "2026-08-02" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep_hi: $.data.id, rep_hi_status: $.data.status, rep_hi_pct: $.data.discrepancy_pct, rep_hi_flag: $.data.auto_flagged } }
            - { call: "POST /reconciliation-reports", payload: { deal_id: "${deal_lo}", period_start: "2026-08-01", period_end: "2026-08-02" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep_lo: $.data.id, rep_lo_status: $.data.status, rep_lo_pct: $.data.discrepancy_pct } }
            - { call: "POST /reconciliation-reports/${rep_lo}/acknowledge", payload: {}, as: ExchangeAdmin }
            - { call: "POST /reconciliation-reports/${rep_lo}/dispute", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep_lo_final: $.data.status } }
          assert:
            - "High-discrepancy report: status == DISPUTED at creation, auto_flagged == true, discrepancy_pct == 50.505 (|1980-980|/1980)"
            - "Zero-discrepancy report: status == OPEN at creation, auto_flagged == false, discrepancy_pct == 0.000"
            - "After acknowledge + dispute the zero-discrepancy report reaches DISPUTED through the manual branch — same state, different path"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: publisher_suspension_cascades_package_then_deal
        grounds:
          - state_machines.Publisher.ACTIVE_to_SUSPENDED
          - state_machines.InventoryPackage.ACTIVE_to_PAUSED
          - state_machines.Deal.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          Depth-3 chain from POST /publishers/{id}/suspend: the publisher mutation
          pauses the package (hop 2), and the package pause itself pauses the deal
          (hop 3) — each hop is caused by the previous hop, not by the original
          call. Different trigger from the batch-release cascade.
        test_recipe:
          setup:
            - "Publisher P ACTIVE with one ACTIVE package (floor 500,000) and one APPROVED ACTIVE deal (FP, floor 500,000, flight covers default clock) on partner DP"
            - "Package.version == 1 and Deal.version == 3 before the trigger (create=1; deal submit=2, approve=3)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /publishers/${pub_id}/suspend", payload: {}, as: ExchangeAdmin, captures: { pub_status: $.data.status } }
            - { call: "GET /packages/${pkg_id}", payload: {}, as: ExchangeAdmin, captures: { pkg_status: $.data.status, pkg_version: $.data.version } }
            - { call: "GET /deals/${deal_id}", payload: {}, as: ExchangeAdmin, captures: { deal_status: $.data.status, deal_version: $.data.version } }
          assert:
            - "Publisher.status == SUSPENDED (hop 1)"
            - "InventoryPackage.status == PAUSED and version == 2 (hop 2 bumped the package exactly once)"
            - "Deal.status == PAUSED and version == 4 (hop 3 bumped the deal exactly once)"

      - name: batch_release_cascades_line_payment_then_publisher_accrual
        grounds:
          - state_machines.PayoutBatch.APPROVED_to_RELEASED
          - state_machines.PayoutLine.ELIGIBLE_to_PAID
          - calculations.publisher_accrual
        distinguishing_aspect: |
          Depth-3 chain from POST /payout-batches/{id}/release: the batch
          transition pays the ELIGIBLE line (hop 2), and the line payment mutates
          the publisher's paid_out_micros / accrued_open_micros (hop 3). Different
          trigger and different chain entities from the publisher-suspension
          cascade.
        test_recipe:
          setup:
            - "GUARANTEED publisher P with one filled FIRST_PRICE auction: gross 1,000,000, fee 150,000, publisher_net 850,000 (no supply chain)"
            - "Batch B [2026-08-01, 2026-09-01) submitted by FinanceOfficer fin-1 (one ELIGIBLE line, payable 850,000) and approved by a DIFFERENT operator (ExchangeAdmin admin-2)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
            - { call: "POST /payout-batches/${batch_id}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: ExchangeAdmin, as_user_id: "admin-2" }
          trigger:
            - { call: "POST /payout-batches/${batch_id}/release", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_status: $.data.status } }
            - { call: "GET /payout-batches/${batch_id}/lines?status=PAID", payload: {}, as: FinanceOfficer, captures: { line_paid: "$.data[0].paid_micros", line_status: "$.data[0].status" } }
            - { call: "GET /publishers/${pub_id}", payload: {}, as: ExchangeAdmin, captures: { pub_paid: $.data.paid_out_micros, pub_open: $.data.accrued_open_micros } }
          assert:
            - "PayoutBatch.status == SETTLED (APPROVED -> RELEASED -> SETTLED within the release call)"
            - "PayoutLine.status == PAID and paid_micros == 850000 (hop 2)"
            - "Publisher.paid_out_micros == 850000 and accrued_open_micros == 0 (hop 3: 850,000 lifetime net - 850,000 paid)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: deal_edit_state_gate_beats_time_range
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_DEAL_NOT_EDITABLE]
          - errors[ERR_INVALID_TIME_RANGE]
        distinguishing_aspect: |
          Category pair state vs business_temporal: a PUT on an ACTIVE (uneditable)
          deal that ALSO carries end_at < start_at must fail with
          ERR_DEAL_NOT_EDITABLE (priority 7), not ERR_INVALID_TIME_RANGE
          (priority 9).
        test_recipe:
          setup:
            - "Publisher P, package, APPROVED ACTIVE FIRST_PRICE deal (floor 500,000, flight 2026-08-01..2026-12-31), partner DP"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin, captures: { v_active: $.data.version } }
          trigger:
            - { call: "PUT /deals/${deal_id}", payload: { expected_deal_version: "${v_active}", start_at: "2026-12-31T00:00:00Z", end_at: "2026-08-01T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEAL_NOT_EDITABLE (http 409) — the state gate fires before the temporal check even though the time range is also invalid"
            - "Deal is unchanged: status == ACTIVE, start_at/end_at unchanged"

      - name: batch_state_gate_beats_segregation_of_duties
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors[ERR_BATCH_NOT_PENDING_APPROVAL]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: approving a batch that is still
          DRAFT with the creator's own user id must fail with
          ERR_BATCH_NOT_PENDING_APPROVAL (priority 6 state), not
          ERR_SEGREGATION_OF_DUTIES (priority 15 fiscal). Different category pair
          from deal_edit_state_gate_beats_time_range (state vs business_temporal).
        test_recipe:
          setup:
            - "PayoutBatch B created by FinanceOfficer fin-1 for [2026-08-01, 2026-09-01), still in DRAFT (never submitted)"
          setup_api_calls:
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: ExchangeAdmin, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BATCH_NOT_PENDING_APPROVAL (http 409) — the state gate fires before the fiscal segregation-of-duties check even though the approver id equals created_by_user_id"
            - "PayoutBatch.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: discrepancy_exactly_at_threshold_not_flagged
        grounds:
          - calculations.impression_discrepancy
          - entities.ReconciliationReport.fields.auto_flagged
          - errors[ERR_INVALID_TIME_RANGE]
        distinguishing_aspect: |
          Numeric threshold boundary on discrepancy_pct: exactly 2.000% is NOT
          flagged (the rule is strictly greater-than), while 2.100% is. Metric:
          discrepancy percentage; endpoint: POST /reconciliation-reports.
        test_recipe:
          setup:
            - "Publisher P, package (floor 500,000), APPROVED FIRST_PRICE deal D, partner DP"
            - "Auction A: 20 impressions, unconfirmed; auction B: 980 impressions, billing-confirmed in-window -> ssp_impressions 1000, dsp_impressions 980"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 20, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 980, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_b: $.data.auction_record.id } }
            - { call: "POST /auction-records/${rec_b}/confirm-billing", payload: {}, as: DemandSide }
          trigger:
            - { call: "POST /reconciliation-reports", payload: { deal_id: "${deal_id}", period_start: "2026-08-01", period_end: "2026-08-02" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep_id: $.data.id, pct: $.data.discrepancy_pct, flagged: $.data.auto_flagged, st: $.data.status } }
          assert:
            - "discrepancy_pct == 2.000 (|1000-980| / 1000 to 3 decimals)"
            - "auto_flagged == false and status == OPEN — 2.000 is NOT > 2.000; the boundary is strict"
            - "ssp_impressions == 1000 and dsp_impressions == 980"

      - name: qps_position_at_max_allowed_next_throttled
        grounds:
          - calculations.auction_throttle
          - calculations.deal_selection
          - state_machines.DemandPartner.ACTIVE_to_THROTTLED
        distinguishing_aspect: |
          Counter boundary on per-second auction positions: with max_qps == 1 the
          first candidate deal (would-be position 1, <= max_qps) competes while the
          second (position 2, == max_qps + 1) is excluded and the partner flips to
          THROTTLED. Metric: per-second auction count; endpoint:
          POST /auctions/execute — a different metric and endpoint from the
          discrepancy threshold.
        test_recipe:
          setup:
            - "Publisher P, package (floor 500,000), partner DP with max_qps == 1 and daily_cap 100,000,000"
            - "TWO APPROVED FIRST_PRICE deals on the same package/partner: D_HI floor 2,000,000 (ranks first by approved floor DESC), D_LO floor 1,000,000"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 1, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 2000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_hi: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 1000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_lo: $.data.id } }
            - { call: "POST /deals/${deal_hi}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_hi}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /deals/${deal_lo}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_lo}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 3000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { outcome: $.data.outcome, rec_deal: $.data.auction_record.deal_id, rec_clearing: $.data.auction_record.clearing_cpm_micros, throttled: $.data.throttled_deal_count } }
            - { call: "GET /demand-partners/${dp_id}", payload: {}, as: ExchangeAdmin, captures: { dp_status: $.data.status } }
          assert:
            - "outcome == FILL and the record's deal_id == D_HI (position 1 == max_qps is allowed; boundary is inclusive)"
            - "record clearing_cpm_micros == 3000000 (FIRST_PRICE)"
            - "throttled_deal_count == 1 (D_LO at would-be position 2 == max_qps + 1 is excluded)"
            - "DemandPartner.status == THROTTLED after the auction"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deal_submit_gated_by_package_state
        grounds:
          - state_machines.Deal.DRAFT_to_PENDING_REVIEW
          - state_machines.InventoryPackage.ACTIVE_to_PAUSED
          - errors[ERR_PACKAGE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Deal -> InventoryPackage: submitting a DRAFT deal whose
          package is PAUSED is rejected with ERR_PACKAGE_NOT_ACTIVE even though
          the deal itself is in a valid from-state.
        test_recipe:
          setup:
            - "Publisher P, package (floor 500,000) PAUSED by its owner, DRAFT deal on that package"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /packages/${pkg_id}/pause", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
          trigger:
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PACKAGE_NOT_ACTIVE (http 409)"
            - "Deal.status == DRAFT (unchanged)"

      - name: payout_line_hold_gated_by_batch_state
        grounds:
          - state_machines.PayoutLine.PENDING_to_HELD
          - state_machines.PayoutBatch.RELEASED_to_SETTLED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair PayoutLine -> PayoutBatch: holding a PENDING line whose
          parent batch is already SETTLED is rejected even though the line's own
          from-state (PENDING) is valid for hold. Different entity pair from
          deal_submit_gated_by_package_state (Deal -> InventoryPackage).
        test_recipe:
          setup:
            - "SEQUENTIAL_LIABILITY publisher P with one UNCONFIRMED filled auction (net 850,000); batch B [2026-08-01, 2026-09-01) submitted, approved by a different operator, and released -> SETTLED; the line stays PENDING because its payable basis is 0"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "SEQUENTIAL_LIABILITY" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
            - { call: "POST /payout-batches/${batch_id}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: ExchangeAdmin, as_user_id: "admin-2" }
            - { call: "POST /payout-batches/${batch_id}/release", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /payout-batches/${batch_id}/lines", payload: {}, as: FinanceOfficer, captures: { line_id: "$.data[0].id", line_status: "$.data[0].status" } }
          trigger:
            - { call: "POST /payout-batches/${batch_id}/lines/${line_id}/hold", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "Pre-trigger: line status == PENDING (zero payable basis for an unconfirmed SEQUENTIAL_LIABILITY line)"
            - "error_id == ERR_INVALID_STATE (http 409) — the batch is SETTLED, outside {PENDING_APPROVAL, APPROVED}"
            - "Line remains PENDING after the failed hold"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: seasonal_window_closed_interval_overlap
        grounds:
          - validations[priority=10]
          - calculations.effective_floor
          - entities.SeasonalPricingWindow.fields.end_date
        distinguishing_aspect: |
          CLOSED-interval semantics on resource InventoryPackage: windows
          [2026-11-20, 2026-11-30] and [2026-11-30, 2026-12-05] overlap because
          both endpoints are inclusive, while [2026-12-01, 2026-12-10] is legal
          adjacency (end + 1 day). Different interval semantics and resource from
          the payout-period instance.
        test_recipe:
          setup:
            - "Publisher P, package (base floor 2,000,000); logical clock moved to 2026-11-25T00:00:00Z so window W1 [2026-11-20, 2026-11-30] multiplier 15000 bps is live (effective floor 3,000,000)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 2000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /seasonal-windows", payload: { package_id: "${pkg_id}", name: "W1", start_date: "2026-11-20", end_date: "2026-11-30", multiplier_bps: 15000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { w1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-25T00:00:00Z" }, as: ExchangeAdmin }
            - { call: "GET /packages/${pkg_id}", payload: {}, as: ExchangeAdmin, captures: { eff_floor: $.data.effective_floor_cpm_micros } }
          trigger:
            - { call: "POST /seasonal-windows", payload: { package_id: "${pkg_id}", name: "W2", start_date: "2026-11-30", end_date: "2026-12-05", multiplier_bps: 12000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
            - { call: "POST /seasonal-windows", payload: { package_id: "${pkg_id}", name: "W3", start_date: "2026-12-01", end_date: "2026-12-10", multiplier_bps: 12000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { w3_id: $.data.id } }
          assert:
            - "Package effective_floor_cpm_micros == 3000000 while W1 is live (2,000,000 x 15000/10000)"
            - "W2 is rejected with ERR_SEASONAL_WINDOW_OVERLAP (shares the inclusive date 2026-11-30 with W1)"
            - "W3 is accepted (2026-12-01 == W1.end + 1 day: adjacency is not overlap)"

      - name: payout_period_half_open_overlap
        grounds:
          - validations[priority=11]
          - state_machines.PayoutBatch.DRAFT_to_PENDING_APPROVAL
          - errors[ERR_PAYOUT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the global payout-period resource:
          [2026-08-01, 2026-09-01) and [2026-08-15, 2026-10-01) conflict, while
          [2026-09-01, 2026-10-01) shares an exact boundary and is allowed. A
          failed submit leaves the offender in DRAFT, which never blocks.
          Different semantics (half-open vs closed) and resource (payout period
          vs package window) from the seasonal instance.
        test_recipe:
          setup:
            - "No publishers or auctions needed: zero-line batches still submit and settle"
            - "Batch B1 [2026-08-01, 2026-09-01) submitted (status PENDING_APPROVAL)"
          setup_api_calls:
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { b1: $.data.id } }
            - { call: "POST /payout-batches/${b1}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { b1_status: $.data.status, b1_lines: $.data.line_count } }
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-15", period_end: "2026-10-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { b2: $.data.id } }
            - { call: "POST /payout-batches", payload: { period_start: "2026-09-01", period_end: "2026-10-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { b3: $.data.id } }
          trigger:
            - { call: "POST /payout-batches/${b2}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
            - { call: "POST /payout-batches/${b3}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { b3_status: $.data.status } }
          assert:
            - "B1 submit succeeds with line_count == 0 (empty batches are legal)"
            - "B2 submit fails with ERR_PAYOUT_PERIOD_OVERLAP (2026-08-15 < 2026-09-01 and 2026-08-01 < 2026-10-01)"
            - "B3 submit succeeds (B3.start == B1.end: shared boundary is not an overlap; B2 is DRAFT and does not block)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: auction_void_restores_partner_spend_conservation
        grounds:
          - calculations.spend_conservation
          - state_machines.Deal.ACTIVE_to_PAUSED
          - entities.DemandPartner.fields.lifetime_spend_micros
        distinguishing_aspect: |
          Conserved quantity: demand-partner spend. The forward action (auction
          fill) and its compensating action (void) MUST leave
          lifetime_spend_micros == sum(gross over non-voided records) and, because
          the pair nets to zero records, exactly 0; delivered_impressions on the
          deal returns to 0 as well.
        test_recipe:
          setup:
            - "Publisher P, package (floor 500,000), APPROVED FIRST_PRICE deal D, partner DP (ACTIVE, lifetime_spend 0)"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_id: $.data.auction_record.id } }
            - { call: "GET /demand-partners/${dp_id}", payload: {}, as: ExchangeAdmin, captures: { spend_after_fill: $.data.lifetime_spend_micros, today_after_fill: $.data.spend_today_micros } }
            - { call: "POST /auction-records/${rec_id}/void", payload: {}, as: ExchangeAdmin, captures: { voided_flag: $.data.voided } }
            - { call: "GET /demand-partners/${dp_id}", payload: {}, as: ExchangeAdmin, captures: { spend_after_void: $.data.lifetime_spend_micros, today_after_void: $.data.spend_today_micros } }
            - { call: "GET /deals/${deal_id}", payload: {}, as: ExchangeAdmin, captures: { delivered_after_void: $.data.delivered_impressions } }
          assert:
            - "After fill: lifetime_spend_micros == 1000000 and spend_today_micros == 1000000"
            - "After void: record voided == true; lifetime_spend_micros == 0 and spend_today_micros == 0 (create+void pair conserves spend)"
            - "After void: deal delivered_impressions == 0"

      - name: publisher_accrual_identity_across_payment_and_makegood
        grounds:
          - calculations.publisher_accrual
          - calculations.payout_line_composition
          - state_machines.ReconciliationReport.DISPUTED_to_RESOLVED
        distinguishing_aspect: |
          Conserved quantity: publisher accrual identity
          accrued_open == lifetime_net + adjustments - paid_out - written_off.
          A SEQUENTIAL_LIABILITY publisher with 1,700,000 net (one half
          confirmed), a 100,000 make-good adjustment, and a 950,000 payment must
          show accrued_open_micros == 850,000 exactly. Different conserved
          quantity (publisher accrual vs partner spend) from the void instance.
        test_recipe:
          setup:
            - "SL publisher P; APPROVED FIRST_PRICE deal D on partner DP; two filled auctions (net 850,000 each); only the first confirmed"
            - "Reconciliation report on D for [2026-08-01, 2026-08-15) auto-flagged DISPUTED (ssp 2000 vs dsp 1000), resolved MAKE_GOOD with adjustment_micros 100,000 BEFORE batch submit"
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "SEQUENTIAL_LIABILITY" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_1: $.data.auction_record.id } }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide }
            - { call: "POST /auction-records/${rec_1}/confirm-billing", payload: {}, as: DemandSide }
            - { call: "POST /reconciliation-reports", payload: { deal_id: "${deal_id}", period_start: "2026-08-01", period_end: "2026-08-15" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep_id: $.data.id } }
            - { call: "POST /reconciliation-reports/${rep_id}/resolve", payload: { resolution_type: "MAKE_GOOD", adjustment_micros: 100000 }, as: ExchangeAdmin, captures: { rep_status: $.data.status } }
            - { call: "POST /payout-batches", payload: { period_start: "2026-08-01", period_end: "2026-09-01" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { batch_id: $.data.id } }
            - { call: "POST /payout-batches/${batch_id}/submit", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /payout-batches/${batch_id}/approve", payload: {}, as: ExchangeAdmin, as_user_id: "admin-2" }
          trigger:
            - { call: "POST /payout-batches/${batch_id}/release", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /payout-batches/${batch_id}/lines", payload: {}, as: FinanceOfficer, captures: { line_status: "$.data[0].status", line_paid: "$.data[0].paid_micros", line_adj: "$.data[0].adjustment_micros", line_gross: "$.data[0].gross_micros", line_confirmed: "$.data[0].confirmed_micros" } }
            - { call: "GET /publishers/${pub_id}", payload: {}, as: ExchangeAdmin, captures: { p_lifetime: $.data.lifetime_net_micros, p_paid: $.data.paid_out_micros, p_written: $.data.written_off_micros, p_open: $.data.accrued_open_micros } }
          assert:
            - "Line: gross_micros == 1700000, confirmed_micros == 850000, adjustment_micros == 100000, status == PAID, paid_micros == 950000 (sequential-liability basis: confirmed + adjustments)"
            - "Publisher: lifetime_net_micros == 1700000, paid_out_micros == 950000, written_off_micros == 0, accrued_open_micros == 850000"
            - "Identity: 1700000 + 100000 - 950000 - 0 == 850000 (no drift through the report -> batch -> release chain)"
