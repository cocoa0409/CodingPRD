        distinguishing_aspect: "The investigation-opening cascade is conditional on the child's state: the RESERVED deployment is RELEASED and its unit returns to stock - not to pending-return - while the ACTIVE deployment on the same store is untouched, so exactly one of two children moves and the depot's five units still reconcile."
        test_recipe:
