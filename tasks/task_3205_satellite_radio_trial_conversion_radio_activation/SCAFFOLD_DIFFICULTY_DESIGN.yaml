            - call: "POST /api/v1/offer-campaigns/${campA_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/offer-campaigns"
              payload: { code: "CB", name: "CB", lifecycle_phase: "POST_TRIAL", window_start_at: "2026-10-01T00:00:00Z", window_end_at: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { campB_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${campB_id}/steps"
              payload: { step_index: 0, plan_id: "${pz2_id}", step_up_rank: 0 }
              as: PlatformAdmin
            - call: "POST /api/v1/offer-campaigns"
              payload: { code: "CC", name: "CC", lifecycle_phase: "POST_TRIAL", window_start_at: "2026-09-30T23:59:59Z", window_end_at: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { campC_id: $.data.id }
            - call: "POST /api/v1/offer-campaigns/${campC_id}/steps"
              payload: { step_index: 0, plan_id: "${pz2_id}", step_up_rank: 0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/offer-campaigns/${campB_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { campB_state: $.data.state }
            - call: "POST /api/v1/offer-campaigns/${campC_id}/activate"
              payload: {}
