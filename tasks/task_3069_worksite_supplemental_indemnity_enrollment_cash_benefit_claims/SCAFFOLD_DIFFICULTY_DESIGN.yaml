  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: campaign_close_met_bulk_issuance_chain
        grounds:
          - state_machines.EnrollmentCampaign.LOCKED_to_MET
          - state_machines.Policy.APPLIED_to_ISSUED
          - entities.Policy.fields.benefit_schedule_id
          - entities.Policy.fields.monthly_premium_cents
        distinguishing_aspect: |
          Depth-2 cascade: POST /enrollment-campaigns/{id}/close mutates the
          CAMPAIGN (status MET, frozen required_enrollments); that campaign
          mutation itself fires the bulk-issuance transition on every APPLIED
          policy under it, pinning benefit_schedule_id and copying
          monthly_premium_cents — the policy mutations are caused by the campaign
          transition, not directly by the close call's own logic.
        test_recipe:
