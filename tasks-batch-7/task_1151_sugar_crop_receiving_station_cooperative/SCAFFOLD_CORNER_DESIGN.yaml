        test_recipe:
          setup: ["campaign, member, station, pile; bookings BA (08:00-10:00) and BB (10:00-12:00) CONFIRMED; TA lab 13.00/2.00, TB lab 12.99/2.00; both weighed 72000/32000 and accepted"]
