          setup: ["Festival F ON_SALE; one ticket T; camping area exists but is not supplied"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "CampReq F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/camping-areas"
              payload: { name: "Field A", capacity: 10, price_per_night: 30.00 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "cr@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t_id}/add-ons"
              payload: { kind: "CAMPING" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

  # =================================================================
  # RBAC
  # =================================================================
  - section: rbac
    instances:
      - name: missing_headers_returns_unauthenticated
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "POST /festivals with no X-User-Role/X-User-ID headers -> ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /festivals"
              payload: { name: "NoAuth F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.http_status == 401"

      - name: boxoffice_cannot_approve_application_forbidden
        claim_type: rbac_denial
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - roles
        distinguishing_aspect: "BoxOffice calling POST /vendor-applications/{id}/approve (a VendorManager exclusive op) -> ERR_FORBIDDEN_ROLE 403."
        test_recipe:
          setup: ["Festival F; zone Z; application AP UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "RbacApprove F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "RB Co", contact_email: "rb@x.com" }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
          trigger:
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v}" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"
            - "response.http_status == 403"

      - name: vendor_cannot_confirm_other_vendors_application_not_owner
        claim_type: rbac_denial
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_OWNER]"
          - roles
        distinguishing_aspect: "A Vendor whose X-User-ID != application.vendor_id calling POST /vendor-applications/{id}/confirm -> ERR_NOT_OWNER 403 (entity_backed Vendor ownership)."
        test_recipe:
          setup: ["Festival F; vendor V1 owns APPROVED application AP (fee paid in full); vendor V2 is a different vendor"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Owner F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "C", slot_capacity: 1 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "Own1", contact_email: "o1@x.com" }
              as: VendorManager
              captures: { v1_id: $.data.id }
            - call: "POST /vendors"
              payload: { company_name: "Own2", contact_email: "o2@x.com" }
              as: VendorManager
              captures: { v2_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v1_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 1, power_addon: false }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v}" }
              as: VendorManager
              captures: { fee: $.data.booth_fee }
            - call: "POST /vendor-applications/${ap_id}/pay-fee"
              payload: { amount: 150.00 }
              as: Vendor
              as_user_id: "${v1_id}"
          trigger:
            - call: "POST /vendor-applications/${ap_id}/confirm"
              payload: {}
              as: Vendor
              as_user_id: "${v2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_OWNER"
            - "response.http_status == 403"

  # =================================================================
  # Cross-Cutting Complexity Layers
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_approve_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.approve-application-stale-zone
          - entities.Zone.fields.version
        distinguishing_aspect: "Approving with the correct current Zone.version succeeds and bumps Zone.version by 1 (the happy path of the OCC rule)."
        test_recipe:
          setup: ["Festival F; zone Z slot_capacity 2 (version 1); application AP UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "OccOk F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 2 }
              as: FestivalDirector
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /vendors"
              payload: { company_name: "Occ Co", contact_email: "occ@x.com" }
              as: VendorManager
              captures: { v_id: $.data.id }
            - call: "POST /festivals/${f_id}/vendor-applications"
              payload: { vendor_id: "${v_id}", booth_zone_id: "${z_id}", booth_tier: "STANDARD", day_count: 2, power_addon: false }
              as: VendorManager
              captures: { ap_id: $.data.id }
            - call: "POST /vendor-applications/${ap_id}/start-review"
              payload: {}
              as: VendorManager
          trigger:
            - call: "POST /vendor-applications/${ap_id}/approve"
              payload: { expected_zone_version: "${z_v}" }
              as: VendorManager
              captures: { st: $.data.status }
            - call: "GET /zones/${z_id}"
              payload: {}
              as: VendorManager
              captures: { z_v_after: $.data.version }
          assert:
            - "VendorApplication.${ap_id}.status == APPROVED"
            - "Zone.${z_id}.version == 2"
            - "Zone.${z_id}.allocated_count == 1"

      - name: occ_approve_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.approve-application-stale-zone
          - "errors[ERR_STALE_ZONE_VERSION]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / zone_full_constraint_beats_stale_zone_occ
          rationale: "The stale-zone-version 412 path is exercised as the winning error of the named §1.8 priority-conflict instance."

      - name: derived_wallet_liability_recompute_on_unfreeze
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Wristband.FROZEN_to_ACTIVE
          - entities.Festival.fields.total_wallet_liability
        distinguishing_aspect: "Freezing a 40.00-balance ACTIVE wristband drops total_wallet_liability to 0.00; unfreezing re-includes it, restoring total_wallet_liability to 40.00 (reconciliation on both edges)."
        test_recipe:
          setup: ["Festival F LIVE; wristband W ACTIVE balance 40.00 (only wristband); W frozen so total_wallet_liability == 0.00"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Recon F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "rc@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-RC-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /wristbands/${w_id}/topup"
              payload: { amount: 40.00 }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /wristbands/${w_id}/freeze"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /wristbands/${w_id}/unfreeze"
              payload: {}
              as: FestivalDirector
              captures: { life: $.data.lifecycle_status }
            - call: "GET /festivals/${f_id}"
              payload: {}
              as: FestivalDirector
              captures: { liab: $.data.total_wallet_liability }
          assert:
            - "Wristband.${w_id}.lifecycle_status == ACTIVE"
            - "Festival.${f_id}.total_wallet_liability == 40.00"

      - name: rate_threshold_reentry_within_cap_succeeds
        claim_type: rate_threshold_triggers
        grounds:
          - "validations[priority=11]"
          - entities.Wristband.fields.reentry_used
          - entities.Festival.fields.max_reentries
        distinguishing_aspect: "With max_reentries 1, the first re-entry (reentry_used 0->1, just below the cap) is ADMITTED; this is the boundary just under the threshold checked in the §1.8 reentry-cap instance."
        test_recipe:
          setup: ["Festival F LIVE, max_reentries 1; wristband W ACTIVE that has done ENTER then EXIT (entry_count 1, reentry_used 0, OUTSIDE)"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "ReOk F", start_date: "2026-08-01", end_date: "2026-08-02", max_reentries: 1 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "ro@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-RO-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "EXIT" }
              as: GateAttendant
          trigger:
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
              captures: { outcome: $.data.outcome }
            - call: "GET /wristbands/${w_id}"
              payload: {}
              as: GateAttendant
              captures: { ru: $.data.reentry_used }
          assert:
            - "GateEvent.outcome == ADMITTED"
            - "Wristband.${w_id}.reentry_used == 1"

  # =================================================================
  # Consistency Model
  # =================================================================
  - section: consistency_model
    instances:
      - name: topup_balance_visible_immediately
        claim_type: immediate
        grounds:
          - entities.Wristband.fields.balance
          - endpoints
        distinguishing_aspect: "POST /wristbands/{id}/topup 25.00 then GET /wristbands/{id} in a later request -> balance 25.00 and total_wallet_liability 25.00 reflected immediately (no lag)."
        test_recipe:
          setup: ["Festival F ON_SALE; wristband W ACTIVE balance 0"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Immed F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "im@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-IM-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
          trigger:
            - call: "POST /wristbands/${w_id}/topup"
              payload: { amount: 25.00 }
              as: BoxOffice
            - call: "GET /wristbands/${w_id}"
              payload: {}
              as: BoxOffice
              captures: { bal: $.data.balance }
            - call: "GET /festivals/${f_id}"
              payload: {}
              as: FestivalDirector
              captures: { liab: $.data.total_wallet_liability }
          assert:
            - "Wristband.${w_id}.balance == 25.00"
            - "Festival.${f_id}.total_wallet_liability == 25.00"
