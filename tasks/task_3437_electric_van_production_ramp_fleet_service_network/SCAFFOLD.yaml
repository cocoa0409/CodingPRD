        default: null
      - name: mobile_van_id
        type: string
        source: input
        required: false
        description: "FK -> MobileVan.id; set for mobile visits; exactly one of service_center_id / mobile_van_id must be set"
        default: null
      - name: window_start
        type: datetime
        source: input
        required: true
