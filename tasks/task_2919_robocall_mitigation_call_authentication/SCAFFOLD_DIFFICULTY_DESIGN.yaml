  - rule_id: boundary_precision_check
    instances:
      - name: risk_index_exactly_at_auto_suspend_threshold_suspends
        grounds:
          - calculations.customer_traffic_risk_index
          - entities.TrafficObservation.fields.triggered_suspension
          - entities.Customer.fields.suspension_cause
          - "endpoints[POST /rmd/traffic-observations]"
        distinguishing_aspect: |
          Metric: traffic_risk_index against AUTO_SUSPEND_THRESHOLD 0.9000, on
          POST /rmd/traffic-observations. Customer A's window (100 calls, 100 short,
          100 unanswered, 1 complaint) lands on exactly 0.9000 and MUST suspend
          (>= is inclusive); customer B's window (1000/1000/1000/9) lands on 0.8900
          — one hundredth below after the 2-decimal subscore rounding — and MUST NOT
          suspend, even though both are risk_tier HIGH.
        test_recipe:
          setup:
            - "One provider with two kyc-VERIFIED, origination-ENABLED customers, each holding exactly one ACTIVE assignment, so active_assigned_number_count == 2"
            - "No prior observations for either customer, so each single window is the whole (renormalized) index"
            - "Logical clock at the 2026-08-01T00:00:00Z default, so a July window is closed and in the past"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Junction Voice Co", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
