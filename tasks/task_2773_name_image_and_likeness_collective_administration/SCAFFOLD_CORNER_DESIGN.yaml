      - name: communication_verdict_first_matching_clause_wins_over_later_clauses
        claim_type: correct_result
        grounds: [calculations.calc_communication_boundary_verdict, entities.CommunicationLog.fields.rationale_code, 'endpoints."POST /nil/communication-logs"']
        distinguishing_aspect: "Under MONITORED_CONTACT via INSTITUTION_PORTAL, clause 2b would return PERMITTED_WITH_DISCLOSURE, but a non-ENROLLED athlete makes clause 1 fire first and force PROHIBITED / ATHLETE_NOT_ENROLLED; an implementation that evaluates the coach clause first, or that ORs the clauses, returns the wrong rationale_code."
        test_recipe:
          setup:
            - "One collective with communication_policy MONITORED_CONTACT."
            - "Two athletes: one left ENROLLED and one moved to PORTAL_ENTERED."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Clause Collective", institution_name: "Clause Institution", institution_ipeds_code: "022900", home_state_code: "OH", association_ruleset: "NCAA_2026", communication_policy: "MONITORED_CONTACT" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Clause Enrolled", portal_user_id: "ath-clause-1", sport: "FOOTBALL", class_year: 2028 }
              as: ComplianceOfficer
              captures: { ath_ok: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Clause Portal", portal_user_id: "ath-clause-2", sport: "FOOTBALL", class_year: 2028 }
              as: ComplianceOfficer
              captures: { ath_portal: $.data.id }
            - call: "POST /nil/athletes/${ath_portal}/eligibility-changes"
              payload: { change: "ENTER_PORTAL" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /nil/communication-logs"
              payload: { collective_id: "${col_id}", actor_role: "HEAD_COACH", channel: "INSTITUTION_PORTAL", topic: "DEAL_TERMS", athlete_id: "${ath_ok}" }
              as: ComplianceOfficer
              captures: { v_2b: $.data.verdict, r_2b: $.data.rationale_code }
            - call: "POST /nil/communication-logs"
              payload: { collective_id: "${col_id}", actor_role: "HEAD_COACH", channel: "INSTITUTION_PORTAL", topic: "DEAL_TERMS", athlete_id: "${ath_portal}" }
              as: ComplianceOfficer
              captures: { v_1: $.data.verdict, r_1: $.data.rationale_code }
            - call: "POST /nil/communication-logs"
              payload: { collective_id: "${col_id}", actor_role: "HEAD_COACH", channel: "DIRECT_MESSAGE", topic: "DEAL_TERMS", athlete_id: "${ath_ok}" }
              as: ComplianceOfficer
              captures: { v_2c: $.data.verdict, r_2c: $.data.rationale_code }
            - call: "POST /nil/communication-logs"
              payload: { collective_id: "${col_id}", actor_role: "COMPLIANCE_OFFICER", channel: "INSTITUTION_PORTAL", topic: "COMPLIANCE_NOTICE", athlete_id: "${ath_ok}" }
              as: ComplianceOfficer
              captures: { v_4: $.data.verdict, r_4: $.data.rationale_code }
          assert:
            - "${v_2b} == PERMITTED_WITH_DISCLOSURE"
            - "${r_2b} == MONITORED_CHANNEL_REQUIRED"
            - "${v_1} == PROHIBITED"
            - "${r_1} == ATHLETE_NOT_ENROLLED"
            - "${v_2c} == PROHIBITED"
            - "${r_2c} == MONITORED_CHANNEL_REQUIRED"
            - "${v_4} == PERMITTED"
            - "${r_4} == POLICY_ALLOWS"
            - "All four calls return HTTP 201, including the two PROHIBITED ones, because the log is an audit trail and not an authorization gate."
            - "GET /nil/communication-logs?collective_id=${col_id}&verdict=PROHIBITED returns exactly 2 rows."

      - name: athlete_1099_threshold_is_inclusive_at_exactly_sixty_thousand
        claim_type: correct_result
        grounds: [calculations.calc_athlete_tax_reporting, entities.Athlete.fields.tax_form_required, global_constants.FORM_1099_THRESHOLD_CENTS]
        distinguishing_aspect: "The FORM_1099_THRESHOLD_CENTS comparison is inclusive, so a US_PERSON at 59999 gross requires NONE and a single additional cent flips the form to FORM_1099_NEC; a strictly-greater comparison keeps NONE at exactly 60000."
        test_recipe:
          setup:
            - "A collective with 116970 cents of settled UNRESTRICTED net funds (gross 120000, fee 3030)."
            - "One ENROLLED US_PERSON athlete and one ACTIVE contract worth 60000 with disclosure ACCEPTED."
            - "The releases are two CONTRACT_ADVANCE payouts of 59999 and then 1."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Threshold Collective", institution_name: "Threshold Institution", institution_ipeds_code: "023000", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Thresh Club", annual_dues_cents: 30000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Thresh Donor", email: "thresh@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 120000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Thresh Athlete", portal_user_id: "ath-thresh", sport: "WOMENS_BASKETBALL", class_year: 2028, tax_person_kind: "US_PERSON" }
              as: CollectiveDirector
              captures: { ath_id: $.data.id, form_before: $.data.tax_form_required }
            - call: "PATCH /nil/athletes/${ath_id}/tax-profile"
              payload: { taxpayer_doc_on_file: "W9" }
              as: TreasuryOfficer
              captures: { doc_on_file: $.data.taxpayer_doc_on_file }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 60000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "TX-51.9246", association_rule_citation: "NCAA-2024-12.5" }
