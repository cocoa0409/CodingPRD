        claim_type: variant_selection
        grounds:
          - calculations.participant_progress_ledger.variants
        excluded_because:
          difficulty_instance: correction_policy_ledger_truth_revokes_where_high_water_retains
          rationale: "That instance runs identical log/correction traffic against a LEDGER_TRUTH and a HIGH_WATER challenge, which is exactly the variant-selection claim."

