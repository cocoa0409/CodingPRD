# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3423_wholesaler_territory_agreements_brand_equity_draft_quality
# Breadth probe over §1.1-§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already covered there appear as
# excluded_because stubs. Unless a recipe sets the clock explicitly, the
# logical clock is at the startup default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: territory_create_defaults_vacant
        claim_type: Creation
        grounds: [entities.Territory, endpoints.POST_/territories]
        distinguishing_aspect: "A territory created with only name and state_code comes back 201 with status VACANT, incumbent_wholesaler_id null, version 1, and server-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /territories"
              payload: { name: "Hill Country", state_code: "TX" }
              as: BrewerAdmin
              captures: { tc0_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "Territory.${tc0_id}.status == VACANT and incumbent_wholesaler_id is null"
            - "Territory.${tc0_id}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: wholesaler_create_system_fields_input_ignored
        claim_type: Defaults
        grounds: [entities.Wholesaler, endpoints.POST_/wholesalers]
        distinguishing_aspect: "Client-supplied lifecycle fields are ignored: posting status TERMINATED and suspended_account_count 9 still yields an APPLICANT wholesaler with suspended_account_count 0, supplier_book [] and holds_retail_interest false."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /wholesalers"
              payload: { legal_name: "Ignorant Distributing", home_state: "TX", license_number: "TX-W-0001", tier: "BRONZE", financial_capacity_score: 50, warehouse_capacity_score: 50, market_coverage_score: 50, status: "TERMINATED", suspended_account_count: 9 }
              as: BrewerAdmin
              captures: { wc0_id: $.data.id }
          assert:
            - "HTTP 201; Wholesaler.${wc0_id}.status == APPLICANT (client status ignored)"
            - "Wholesaler.${wc0_id}.suspended_account_count == 0 (client value ignored)"
            - "Wholesaler.${wc0_id}.supplier_book == [] and holds_retail_interest == false (defaults applied)"

      - name: agreement_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Agreement
          - endpoints.GET_/agreements/{id}
          - errors[ERR_NOT_FOUND]
          - response_envelope.error
        distinguishing_aspect: "GET with a well-formed but absent UUID returns the canonical error envelope: HTTP 404, response_type error, data.error_id ERR_NOT_FOUND with a message, and the meta block still present."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: BrewerAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP 404 and nf_err == ERR_NOT_FOUND"
            - "Envelope: response_type == error, data.message is a non-empty string, meta.api_request_id is present"

      - name: retail_account_create_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.RetailAccount.fields.serving_wholesaler_id
          - endpoints.POST_/retail-accounts
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required serving_wholesaler_id fails schema validation with ERR_INVALID_REQUEST (400) before any existence check runs."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /retail-accounts"
              payload: { name: "No Owner Bar", state_code: "TX" }
              as: BrewerAdmin
              captures: { ir_err: $.data.error_id }
          assert:
            - "HTTP 400 and ir_err == ERR_INVALID_REQUEST"

      - name: draft_audit_result_and_counts_computed
        claim_type: Computed Fields
        grounds: [entities.DraftAudit.fields.result, entities.DraftAudit.fields.stale_keg_count, calculations.keg_freshness_index]
        distinguishing_aspect: "Audit result is fully computed server-side: one 95-day keg (stale, not critical) with fresh lines yields result FAIL, stale_keg_count 1, critical_keg_flag false, line_cleaning_overdue false — and the account stays ACTIVE because only CRITICAL_FAIL suspends."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to an appointed wholesaler; account AC served by it."
          setup_api_calls:
            - &mk_territory
              call: "POST /territories"
              payload: { name: "Computed Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tco_id: $.data.id }
            - &mk_wholesaler
              call: "POST /wholesalers"
              payload: { legal_name: "Computed Distributing", home_state: "TX", license_number: "TX-W-0201", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wco_id: $.data.id }
            - &mk_agreement
              call: "POST /agreements"
              payload: { territory_id: "${tco_id}", wholesaler_id: "${wco_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { aco_id: $.data.id }
            - &mk_account
              call: "POST /retail-accounts"
              payload: { name: "Computed Bar", state_code: "TX", serving_wholesaler_id: "${wco_id}" }
              as: BrewerAdmin
              captures: { acct0_id: $.data.id }
          trigger:
            - call: "POST /draft-audits"
              payload: { account_id: "${acct0_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-28T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-05-29T00:00:00Z", volume_bbl: 12 }] }
              as: DraftAuditor
              captures: { audc_id: $.data.id }
            - call: "GET /retail-accounts/${acct0_id}"
              payload: {}
              as: BrewerAdmin
          assert:
            - "HTTP 201; DraftAudit.${audc_id}.stale_keg_count == 1 and critical_keg_flag == false (95 days >= 90 but < 120)"
            - "DraftAudit.${audc_id}.line_cleaning_overdue == false (4-day gap <= 14-day frequency)"
            - "DraftAudit.${audc_id}.result == FAIL"
            - "RetailAccount.${acct0_id}.status == ACTIVE (FAIL does not suspend) and last_audit_at == 2026-09-01T00:00:00Z"
            - "Wholesaler.${wco_id}.suspended_account_count == 0"

  - section: state_machines
    instances:
      - name: agreement_create_awards_territory_and_appoints_wholesaler
        claim_type: Valid Transition
        grounds:
          - state_machines.Territory.VACANT_to_AWARDED
          - state_machines.Wholesaler.APPLICANT_to_APPOINTED
          - endpoints.POST_/agreements
        distinguishing_aspect: "One POST /agreements drives two cross-entity transitions at once: the territory flips VACANT -> AWARDED with the incumbent set, and the wholesaler flips APPLICANT -> APPOINTED, while the agreement itself is born ACTIVE at version 1."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z. One VACANT territory and one APPLICANT wholesaler."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Award Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { taw_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Award Distributing", home_state: "TX", license_number: "TX-W-1001", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { waw_id: $.data.id }
          trigger:
            - call: "POST /agreements"
              payload: { territory_id: "${taw_id}", wholesaler_id: "${waw_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { aaw_id: $.data.id }
            - call: "GET /territories/${taw_id}"
              payload: {}
              as: BrewerAdmin
            - call: "GET /wholesalers/${waw_id}"
              payload: {}
              as: BrewerAdmin
          assert:
            - "HTTP 201; Agreement.${aaw_id}.status == ACTIVE and version == 1 (born ACTIVE, no separate activation step)"
            - "Territory.${taw_id}.status == AWARDED and incumbent_wholesaler_id == ${waw_id}"
            - "Wholesaler.${waw_id}.status == APPOINTED"

      - name: agreement_amend_in_place_bumps_version_and_logs
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Agreement.ACTIVE_to_ACTIVE
          - entities.Agreement.fields.amendment_log
        distinguishing_aspect: "Amendment mutates terms in place without a state change: status stays ACTIVE, version goes 1 -> 2, and amendment_log gains exactly one entry naming the changed field."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z. Territory awarded via an ACTIVE agreement at version 1."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Amend Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tam_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Amend Distributing", home_state: "TX", license_number: "TX-W-1002", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wam_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tam_id}", wholesaler_id: "${wam_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { aam_id: $.data.id, aam_v: $.data.version }
          trigger:
            - call: "POST /agreements/${aam_id}/amendments"
              payload: { expected_agreement_version: "${aam_v}", share_target_pct: 50, declared_share_pct: 45 }
              as: BrewerAdmin
          assert:
            - "HTTP 200; Agreement.${aam_id}.version == 2 and status == ACTIVE"
            - "Agreement.${aam_id}.share_target_pct == 50 and declared_share_pct == 45; untouched fields keep their values (distribution_target_pct == 80)"
            - "amendment_log has exactly 1 entry with amended_at == 2026-09-01T00:00:00Z and fields_changed covering share_target_pct and declared_share_pct"

      - name: decision_on_rejected_transfer_returns_409
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TransferApplication.SUBMITTED_to_REJECTED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "A transfer whose buyer scored 50.00 (< 70.00) is REJECTED at qualification; any further decision on the terminal application is locked out with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to a seller; buyer wholesaler APPLICANT with scores 50/50/50; transfer created and qualification-reviewed straight to REJECTED (no ROFR holder)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Lockdown Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tlk_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Lockdown Seller", home_state: "TX", license_number: "TX-W-1003", tier: "SILVER", financial_capacity_score: 70, warehouse_capacity_score: 70, market_coverage_score: 70 }
              as: BrewerAdmin
              captures: { wlk_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Weak Buyer", home_state: "TX", license_number: "TX-W-1004", tier: "BRONZE", financial_capacity_score: 50, warehouse_capacity_score: 50, market_coverage_score: 50 }
              as: BrewerAdmin
              captures: { wwk_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tlk_id}", wholesaler_id: "${wlk_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { alk_id: $.data.id }
            - call: "POST /transfer-applications"
              payload: { agreement_id: "${alk_id}", buyer_wholesaler_id: "${wwk_id}", purchase_price_cents: 1000000 }
              as: WholesalerPrincipal
              as_user_id: "${wlk_id}"
              captures: { trl_id: $.data.id }
            - call: "POST /transfer-applications/${trl_id}/qualification-review"
              payload: {}
              as: BrewerCompliance
              captures: { trl_status: $.data.status, trl_score: $.data.qualification_score }
          trigger:
            - call: "POST /transfer-applications/${trl_id}/decision"
              payload: { decision: "APPROVE" }
              as: BrewerCompliance
              captures: { lock_err: $.data.error_id }
          assert:
            - "Qualification routed SUBMITTED -> REJECTED: trl_status == REJECTED and trl_score == 50.00"
            - "Decision on the terminal application: HTTP 409 and lock_err == ERR_INVALID_STATE_TRANSITION"

      - name: rofr_window_lapses_via_clock_sweep
        claim_type: Valid Transition
        grounds:
          - state_machines.TransferApplication.ROFR_OPEN_to_ROFR_LAPSED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Advancing the logical clock past rofr_deadline sweeps ROFR_OPEN -> ROFR_LAPSED with rofr_lapsed_count 1, and a lapsed window still permits a compliance APPROVE that keeps the original buyer as successor."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to seller via an agreement naming ROFR holder WH; buyer (scores 80/80/80) transfer qualified at the default clock, so rofr_deadline == 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Lapse Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tlp_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Lapse Seller", home_state: "TX", license_number: "TX-W-1005", tier: "SILVER", financial_capacity_score: 70, warehouse_capacity_score: 70, market_coverage_score: 70 }
              as: BrewerAdmin
              captures: { wls_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Lapse Holder", home_state: "TX", license_number: "TX-W-1006", tier: "GOLD", financial_capacity_score: 85, warehouse_capacity_score: 85, market_coverage_score: 85 }
              as: BrewerAdmin
              captures: { wlh_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Lapse Buyer", home_state: "TX", license_number: "TX-W-1007", tier: "BRONZE", financial_capacity_score: 80, warehouse_capacity_score: 80, market_coverage_score: 80 }
              as: BrewerAdmin
              captures: { wlb_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tlp_id}", wholesaler_id: "${wls_id}", rofr_holder_wholesaler_id: "${wlh_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { alp_id: $.data.id }
            - call: "POST /transfer-applications"
              payload: { agreement_id: "${alp_id}", buyer_wholesaler_id: "${wlb_id}", purchase_price_cents: 2000000 }
              as: WholesalerPrincipal
              as_user_id: "${wls_id}"
              captures: { trp2_id: $.data.id }
            - call: "POST /transfer-applications/${trp2_id}/qualification-review"
              payload: {}
              as: BrewerCompliance
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: BrewerAdmin
              captures: { lapsed_n: $.data.rofr_lapsed_count }
            - call: "GET /agreements/${alp_id}/transfer-applications"
              payload: {}
              as: BrewerAdmin
            - call: "POST /transfer-applications/${trp2_id}/decision"
              payload: { decision: "APPROVE" }
              as: BrewerCompliance
              captures: { trp2_status: $.data.status, trp2_succ: $.data.successor_wholesaler_id }
          assert:
            - "lapsed_n == 1 and the transfer's status in the agreement list == ROFR_LAPSED (clock 2026-10-02 > rofr_deadline 2026-10-01T00:00:00Z)"
            - "APPROVE from ROFR_LAPSED succeeds: trp2_status == APPROVED"
            - "trp2_succ == ${wlb_id} (the buyer, not the holder — the lapsed ROFR confers nothing)"
            - "consummation_deadline == 2026-12-01T00:00:00Z (approval at the advanced clock 2026-10-02 plus 60 days)"

      - name: approved_transfer_expires_via_clock_sweep
        claim_type: Valid Transition
        grounds:
          - state_machines.TransferApplication.APPROVED_to_EXPIRED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Advancing the clock past consummation_deadline sweeps APPROVED -> EXPIRED, and the terminal EXPIRED state then rejects consummation with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to seller (no ROFR holder); buyer 80/80/80; transfer qualified -> QUALIFIED and approved at the default clock, consummation_deadline 2026-10-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Expiry Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tex_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Expiry Seller", home_state: "TX", license_number: "TX-W-1008", tier: "SILVER", financial_capacity_score: 70, warehouse_capacity_score: 70, market_coverage_score: 70 }
              as: BrewerAdmin
              captures: { wes_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Expiry Buyer", home_state: "TX", license_number: "TX-W-1009", tier: "BRONZE", financial_capacity_score: 80, warehouse_capacity_score: 80, market_coverage_score: 80 }
              as: BrewerAdmin
              captures: { web_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tex_id}", wholesaler_id: "${wes_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { aex_id: $.data.id }
            - call: "POST /transfer-applications"
              payload: { agreement_id: "${aex_id}", buyer_wholesaler_id: "${web_id}", purchase_price_cents: 2500000 }
              as: WholesalerPrincipal
              as_user_id: "${wes_id}"
              captures: { trx_id: $.data.id }
            - call: "POST /transfer-applications/${trx_id}/qualification-review"
              payload: {}
              as: BrewerCompliance
            - call: "POST /transfer-applications/${trx_id}/decision"
              payload: { decision: "APPROVE" }
              as: BrewerCompliance
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BrewerAdmin
              captures: { expired_n: $.data.consummation_expired_count }
            - call: "POST /transfer-applications/${trx_id}/consummate"
              payload: {}
              as: BrewerAdmin
              captures: { exp_err: $.data.error_id }
            - call: "GET /territories/${tex_id}"
              payload: {}
              as: BrewerAdmin
          assert:
            - "expired_n == 1 (clock 2026-11-01 > consummation_deadline 2026-10-31T00:00:00Z)"
            - "Consummate after expiry: HTTP 409 and exp_err == ERR_INVALID_STATE_TRANSITION"
            - "Territory.${tex_id}.incumbent_wholesaler_id == ${wes_id} — the expired transfer changed nothing"
            - "Agreement.${aex_id} remains ACTIVE (via GET /wholesalers/${wes_id}/agreements)"

      - name: promotion_close_sweep_blocks_opt_in
        claim_type: Valid Transition
        grounds:
          - state_machines.PromotionProgram.OPEN_to_CLOSED
          - errors[ERR_OPT_IN_WINDOW_CLOSED]
        distinguishing_aspect: "A promotion whose ends_at passes under the advanced clock is swept OPEN -> CLOSED with promotions_closed_count 1, and a later opt-in is rejected with ERR_OPT_IN_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to wholesaler WO with brand_scope [BUD]; a BUD promotion window [2026-08-01T00:00:00Z, 2026-09-15T00:00:00Z) is OPEN."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Promo Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tpr_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Promo Distributing", home_state: "TX", license_number: "TX-W-1010", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wpr_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tpr_id}", wholesaler_id: "${wpr_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /promotion-programs"
              payload: { brand_code: "BUD", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-09-15T00:00:00Z", suggested_discount_pct: 5 }
              as: BrewerAdmin
              captures: { ppr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: BrewerAdmin
              captures: { closed_n: $.data.promotions_closed_count }
            - call: "POST /promotion-programs/${ppr_id}/opt-ins"
              payload: {}
              as: WholesalerPrincipal
              as_user_id: "${wpr_id}"
              captures: { opt_err: $.data.error_id }
          assert:
            - "closed_n == 1 (clock 2026-09-16 >= ends_at 2026-09-15)"
            - "opt_err == ERR_OPT_IN_WINDOW_CLOSED with HTTP 409"

      - name: account_reinstates_via_pass_audit_and_count_decrements
        claim_type: Compensation
        grounds:
          - state_machines.RetailAccount.SERVICE_SUSPENDED_to_ACTIVE
          - entities.Wholesaler.fields.suspended_account_count
        distinguishing_aspect: "The audit-driven suspension has a compensating path: a later PASS audit (respecting the 7-day buffer) returns the account to ACTIVE and decrements suspended_account_count, while the wholesaler — never having hit 3 — stays APPOINTED throughout."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to wholesaler WR2; account AR2 served by it; one CRITICAL_FAIL audit at 2026-09-01 suspends the account (count 1)."
