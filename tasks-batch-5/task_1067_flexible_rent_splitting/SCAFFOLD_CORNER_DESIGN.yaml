scaffold_corner_design:
  # =================================================================
  # Table 1 — Entities
  # =================================================================
  - section: entities
    instances:
      - name: property_creation_returns_all_fields
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /api/properties with all required fields returns 201 with id, integration_status, status mirrored, and common fields (version==1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #1", full_rent_cents: 90000, rent_due_day: 1, remittance_account_ref: "acct_c1", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Property.${prop_id}.full_rent_cents == 90000"
            - "Property.${prop_id}.status == ACTIVE"
            - "Property.${prop_id}.version == 1"

      - name: renter_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Renter, "errors[ERR_RENTER_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/renters/{unknown-uuid} returns ERR_RENTER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/renters/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_RENTER_NOT_FOUND"

      - name: property_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Property.fields.full_rent_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/properties omitting full_rent_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #2", rent_due_day: 1, remittance_account_ref: "acct_c2" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: application_prior_delinquency_defaults_zero
        claim_type: Defaults
        grounds: [entities.Application.fields.prior_delinquency_count, calculations.underwriting_risk_score]
        distinguishing_aspect: "Omitting prior_delinquency_count defaults to 0, yielding delinq_score 100; income 300000/portion 100000/split 2 -> risk_score 100 (LOW)."
        test_recipe:
          setup: ["Property ACTIVE; Renter portion 100000."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #3", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c3", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c3@x.com", full_name: "C Three", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
          trigger:
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.prior_delinquency_count == 0"
            - "Application.${app_id}.risk_score == 100"
            - "Application.${app_id}.risk_band == LOW"

      - name: renter_system_fields_ignore_client_input
        claim_type: System Fields
        grounds: [entities.Renter.fields.status, entities.Renter.fields.approved_limit_cents]
        distinguishing_aspect: "A newly created Renter starts status PROSPECT, approved_limit_cents 0, autopay_enabled false regardless of any client-sent values."
        test_recipe:
          setup: ["Property ACTIVE."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #4", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c4", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c4@x.com", full_name: "C Four", portion_rent_cents: 80000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
          assert:
            - "Renter.${renter_id}.status == PROSPECT"
            - "Renter.${renter_id}.approved_limit_cents == 0"
            - "Renter.${renter_id}.autopay_enabled == false"

  # =================================================================
  # Table 2 — State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: charge_already_paid_installment_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Installment.SCHEDULED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Charging an installment already PAID returns ERR_INVALID_STATE (409); no second REPAYMENT ledger entry."
        test_recipe:
          setup: ["Renter ENROLLED LOW portion 100000; SPLIT n=2 remitted; installment1 PAID."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #5", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c5", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c5@x.com", full_name: "C Five", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst1: "$.data[0].id" }
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: settle_before_remit_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BillingCycle.REMITTED_to_SETTLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a SCHEDULED (never-remitted) cycle returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle created but NOT remitted."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #6", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c6", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c6@x.com", full_name: "C Six", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: decision_on_already_decided_application_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Application.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second decision on an already-APPROVED application returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Application APPROVED for an enrolled renter."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #7", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c7", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c7@x.com", full_name: "C Seven", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
          trigger:
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "DECLINE" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: retry_beyond_max_attempts_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Installment.FAILED_to_SCHEDULED, "validations[priority=7]", "errors[ERR_MAX_ATTEMPTS_EXCEEDED]"]
        distinguishing_aspect: "After 3 failed charge attempts (attempt_count==3), a retry returns ERR_MAX_ATTEMPTS_EXCEEDED (409)."
        test_recipe:
          setup: ["Renter ENROLLED LOW portion 100000; SPLIT n=2 remitted; installment1 charged FAIL three times (attempt_count 3, FAILED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #8", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c8", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c8@x.com", full_name: "C Eight", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst1: "$.data[0].id" }
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "FAIL" }
              as: PlatformAdmin
            - call: "POST /api/installments/${inst1}/retry"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "FAIL" }
              as: PlatformAdmin
            - call: "POST /api/installments/${inst1}/retry"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "FAIL" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/installments/${inst1}/retry"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_MAX_ATTEMPTS_EXCEEDED"

      - name: late_fee_grace_boundary_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds: [state_machines.BillingCycle.REMITTED_to_DELINQUENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / late_fee_grace_days_ge_boundary
          rationale: "The DELINQUENT transition + flat late-fee side effect is asserted by the named §1.8 boundary instance."

  # =================================================================
  # Table 4 — Validations
  # =================================================================
  - section: validations
    instances:
      - name: defer_window_exceeded_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_DEFER_WINDOW_EXCEEDED]"]
        distinguishing_aspect: "Creating a DEFER cycle with planned_defer_days 30 (> MAX_DEFER_DAYS 25) returns ERR_DEFER_WINDOW_EXCEEDED (422)."
        test_recipe:
          setup: ["Renter ENROLLED LOW portion 100000."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #9", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c9", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c9@x.com", full_name: "C Nine", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
          trigger:
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "DEFER", split_count: 2, deferred_amount_cents: 60000, planned_defer_days: 30 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_DEFER_WINDOW_EXCEEDED"

      - name: invalid_split_count_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_INVALID_SPLIT_COUNT]"]
        distinguishing_aspect: "Creating a SPLIT cycle with split_count 5 (> MAX_SPLIT_COUNT 4) returns ERR_INVALID_SPLIT_COUNT (422)."
        test_recipe:
          setup: ["Renter ENROLLED LOW portion 100000."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #10", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c10", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c10@x.com", full_name: "C Ten", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
          trigger:
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 5 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_SPLIT_COUNT"

      - name: limit_exceeded_returns_402
        claim_type: Aggregate validation
        grounds: ["validations[priority=18]", "errors[ERR_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Renter portion 200000 with MEDIUM approved_limit 150000 (income 300000, ratio 1.5, split 2 -> score 70) fails cycle creation with ERR_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["Renter portion 200000; Application APPROVED MEDIUM approved_limit 150000; Renter ENROLLED."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #11", full_rent_cents: 200000, rent_due_day: 1, remittance_account_ref: "acct_c11", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c11@x.com", full_name: "C Eleven", portion_rent_cents: 200000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
          trigger:
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 402"
            - "response.data.error_id == ERR_LIMIT_EXCEEDED"

      - name: settle_insufficient_repayment_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=19]", "errors[ERR_INSUFFICIENT_REPAYMENT]"]
        distinguishing_aspect: "Settling a remitted cycle with only one of two installments paid (outstanding 50000 > 0) returns ERR_INSUFFICIENT_REPAYMENT (422)."
        test_recipe:
          setup: ["Renter ENROLLED LOW portion 100000; SPLIT n=2 remitted; installment1 PAID, installment2 unpaid."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #12", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c12", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c12@x.com", full_name: "C Twelve", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/billing-cycles/${cyc_id}/installments"
              payload: {}
              as: PlatformAdmin
              captures: { inst1: "$.data[0].id" }
            - call: "POST /api/installments/${inst1}/charge"
              payload: { method: "MANUAL", outcome: "SUCCEED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/settle"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INSUFFICIENT_REPAYMENT"

      - name: promise_window_exceeded_returns_422
        claim_type: Temporal validation
        grounds: ["validations[priority=13]", "errors[ERR_PROMISE_WINDOW_EXCEEDED]"]
        distinguishing_aspect: "PROMISE_SET with promise_date 30 days out (> PROMISE_MAX_DAYS 14) returns ERR_PROMISE_WINDOW_EXCEEDED (422)."
        test_recipe:
          setup: ["Delinquent case OPEN at 2026-07-21; agent records OUTREACH (IN_OUTREACH)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #13", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c13", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c13@x.com", full_name: "C Thirteen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/billing-cycles/${cyc_id}/remit"
              payload: {}
              as: PlatformAdmin
