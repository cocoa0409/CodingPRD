  # ===========================================================================
  # Rule 4 — transitive_cascade (3 instances, 3 different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_approval_cascade_releases_bays_and_recomputes_posture
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
          - state_machines.BayReservation.ACTIVE_to_RELEASED
          - calculations.capacity_posture
        distinguishing_aspect: |
          Depth-4 cascade from CO approval: approval mutates Production
          (price/deadline/hours); the deadline mutation itself auto-RELEASES
          the bay reservation whose window_end (2026-09-26) exceeds the new
          deadline (2026-09-23); the hours mutation recomputes
          Shop.committed_crew_hours (320 -> 280); that recompute flips
          Shop.posture TIGHT -> OPEN (ratio 7000bp). Each hop is caused by
          the previous link, not by the approval directly.
        test_recipe:
          setup:
            - "Production SCHEDULED, committed 320 (posture TIGHT at 8000bp), current_price 900000, deadline 2026-09-26, applied_revision 1"
            - "ACTIVE bay reservation slot 1 window [2026-09-01, 2026-09-26)"
            - "Package revision 2 uploaded (CURRENT)"
            - "PROPOSED change order: dm 0, dh -40, dd -3 (delta_price -480000: labor -40 x 8000 x 1.5 overtime in TIGHT, no rush because labor_component < 0)"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
