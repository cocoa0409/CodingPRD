scenario: |
  Engine Licensing Tiers, Runtime Economics & Developer Migration (Unity): licensing tiers
  by developer revenue and funding with seat requirements and feature differences, runtime
  and install-based fee structures with thresholds, exemptions and self-reporting
  obligations, retroactive policy change management with developer trust impact and
  grandfathering commitments, editor version support with long-term support releases and
  upgrade risk for shipped projects, asset store marketplace with creator revenue share
  and content review, platform export modules requiring separate agreements with console
  holders, education and personal tier eligibility with revenue ceilings and audit,
  migration risk when developers evaluate alternative engines.

domain_name: engine-licensing-runtime-economics
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TierConfig
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: enum, source: input, description: "PERSONAL | EDUCATION | PRO | ENTERPRISE" }
      - { name: revenue_ceiling_cents, type: integer, source: input, description: "Max effective annual revenue (inclusive) allowed on this tier; 0 means unlimited" }
      - { name: funding_ceiling_cents, type: integer, source: input, description: "Max lifetime funding (inclusive) allowed on this tier; 0 means unlimited" }
      - { name: seat_minimum, type: integer, source: input, description: "Minimum active seats required on this tier (0 = none)" }
      - { name: seat_overage_cents, type: integer, source: input, description: "Monthly charge per seat shortfall below seat_minimum" }
      - { name: runtime_fee_exempt, type: boolean, source: input, description: "PERSONAL/EDUCATION are runtime-fee exempt" }
      - { name: export_module_allowed, type: boolean, source: input, description: "Whether console export modules may be activated on this tier" }
      - { name: marketplace_sell_allowed, type: boolean, source: input, description: "Whether the org may publish paid asset listings on this tier" }
      - { name: supersedes_tier_config_id, type: string, source: input, description: "Optional FK -> TierConfig.id; self-referential link to the tier config this version replaces (null = original)" }
      - { name: tier_config_status, type: enum, source: system, description: "ACTIVE | SUPERSEDED", default: ACTIVE }

  - name: DeveloperOrg
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Studio legal name" }
      - { name: contact_email, type: string, source: input, description: "Billing contact email" }
      - { name: education_verified, type: boolean, source: input, description: "True only for accredited education institutions", default: false }
      - { name: declared_tier_code, type: enum, source: input, description: "PERSONAL | EDUCATION | PRO | ENTERPRISE — the tier the org signs up on" }
      - { name: effective_tier_code, type: enum, source: computed, description: "max(declared_tier_code, tier implied by revenue/funding signals) per tier_determination" }
      - { name: org_standing, type: enum, source: computed, description: "GOOD | REVIEW | SUSPENDED — derived from open AuditCase count, overdue invoice count, trust_score" }
      - { name: trust_score, type: integer, source: computed, description: "0..100; starts 80; decremented by adverse retroactive PolicyChange activations and audit conversions; drives standing" }
      - { name: migration_status, type: enum, source: computed, description: "NONE | ASSESSING | COOLING_OFF | MIGRATED — derived from latest non-terminal MigrationAssessment state" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Sum over RuntimeFeeInvoice of (final_amount_cents - paid_cents - waived_cents) for non-terminal-credit invoices; invariant per compensating rule" }
      - { name: marketplace_credit_cents, type: integer, source: computed, description: "Accumulated creator payout balance available for withdrawal; never negative" }

  - name: RevenueDeclaration
    parent: DeveloperOrg
    common_fields: false
    fields:
      - { name: org_id, type: string, source: input, description: "FK -> DeveloperOrg.id; owning org" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM the declaration covers; unique per org" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Self-reported gross revenue for the month" }
      - { name: funding_received_cents, type: integer, source: input, description: "New external funding received in the month" }
      - { name: declared_at, type: datetime, source: system, description: "Server timestamp of declaration" }

  - name: SeatSubscription
    parent: DeveloperOrg
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; owning org (from path)" }
      - { name: tier_code, type: enum, source: input, description: "PRO | ENTERPRISE — paid seat tiers only" }
      - { name: purchased_seats, type: integer, source: input, description: "Seats purchased on this subscription; must be >= 1" }
      - { name: active_seats, type: integer, source: computed, description: "Currently assigned seats; invariant: active_seats + available_seats == purchased_seats" }
      - { name: available_seats, type: integer, source: computed, description: "purchased_seats - active_seats" }
      - { name: coverage_start, type: string, source: input, description: "ISO date (YYYY-MM-DD) coverage begins, inclusive" }
      - { name: coverage_end, type: string, source: input, description: "ISO date coverage ends, exclusive (half-open [start, end)); must be > coverage_start" }
      - { name: subscription_status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED", default: ACTIVE }

  - name: EditorVersion
    parent: null
    common_fields: true
    fields:
      - { name: version_string, type: string, source: input, description: "e.g. 2022.3.45f1; unique" }
      - { name: major_line, type: string, source: input, description: "e.g. 2022.3 — groups versions into an LTS line" }
      - { name: released_on, type: string, source: input, description: "ISO date of release" }
      - { name: support_status, type: enum, source: system, description: "SUPPORTED | LTS | DEPRECATED | SUNSET", default: SUPPORTED }
      - { name: lts_window_start, type: string, source: system, description: "ISO date LTS window opens; set on transition to LTS" }
      - { name: lts_window_end, type: string, source: system, description: "ISO date LTS window closes (inclusive); set on transition to LTS" }
      - { name: deprecated_api_count, type: integer, source: input, description: "Count of APIs removed in the next major line; feeds upgrade risk", default: 0 }

  - name: GameProject
    parent: DeveloperOrg
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; owning org (from path)" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: editor_version_id, type: string, source: input, description: "FK -> EditorVersion.id; pinned editor version" }
      - { name: charity_flag, type: boolean, source: input, description: "Charity/hobby project exempt from runtime fees", default: false }
      - { name: project_status, type: enum, source: system, description: "DEVELOPMENT | SHIPPED | FROZEN | ARCHIVED", default: DEVELOPMENT }
      - { name: shipped_on, type: string, source: system, description: "ISO date of ship transition; null until SHIPPED" }
      - { name: lifetime_installs, type: integer, source: computed, description: "Sum of non-exempt installs across ACCEPTED reports" }
      - { name: upgrade_risk_score, type: integer, source: computed, description: "0..100 weighted score from editor age, support status, install base, deprecated API count" }
      - { name: pinned_policy_change_id, type: string, source: system, description: "FK -> PolicyChange.id; the retroactive policy this project is grandfathered against, null if none" }

  - name: InstallReport
    parent: GameProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> GameProject.id; owning project (from path)" }
      - { name: period_month, type: string, source: input, description: "YYYY-MM report period; at most one non-ARCHIVED report per project per period" }
      - { name: new_device_installs, type: integer, source: input, description: "Installs on devices never previously reported for this project" }
      - { name: reinstalls, type: integer, source: input, description: "Re-installs on previously counted devices (exempt from fee)" }
      - { name: bundle_installs, type: integer, source: input, description: "Installs sold via charity/subscription bundles (exempt from fee)" }
      - { name: report_status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | ACCEPTED | DISPUTED | ARCHIVED", default: DRAFT }
      - { name: billable_installs, type: integer, source: computed, description: "new_device_installs only; reinstalls and bundle_installs excluded" }
      - { name: supersedes_report_id, type: string, source: system, description: "FK -> InstallReport.id; the DRAFT report this creation archived, null if none" }
      - { name: review_note, type: string, source: system, description: "Reviewer note on dispute; null unless DISPUTED" }

  - name: RuntimeFeeInvoice
    parent: GameProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> GameProject.id; owning project (from path)" }
      - { name: report_id, type: string, source: system, description: "FK -> InstallReport.id; source report" }
      - { name: assessment_status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | DISPUTED | ADJUSTED | VOIDED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | WAIVED | OVERDUE" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Estimate from self-reported billable installs at assessment time" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Amount after acceptance/finalization; equals provisional unless report revised" }
      - { name: paid_cents, type: integer, source: computed, description: "Payments applied" }
      - { name: waived_cents, type: integer, source: computed, description: "Waived portion" }
      - { name: due_date, type: string, source: system, description: "ISO date; due 30 days after finalization" }
      - { name: fee_schedule_label, type: string, source: system, description: "Schedule label used: BASE | GRANDFATHERED | CONVERTED" }

  - name: PolicyChange
    parent: null
    common_fields: true
    fields:
      - { name: change_code, type: string, source: input, description: "Unique change identifier, e.g. RUNTIME-FEE-2023" }
      - { name: announcement_date, type: string, source: input, description: "ISO date the change is announced" }
      - { name: effective_date, type: string, source: input, description: "ISO date the new schedule applies" }
      - { name: retroactive_flag, type: boolean, source: input, description: "True when effective_date precedes announcement_date or applies to already-shipped projects" }
      - { name: adverse_flag, type: boolean, source: input, description: "True when the change increases fees for existing licensees; drives trust decrement" }
      - { name: grandfather_window_days, type: integer, source: input, description: "Days after announcement during which shipped projects may claim grandfathering" }
      - { name: new_per_install_cents, type: integer, source: input, description: "New marginal per-install rate under this change" }
      - { name: change_status, type: enum, source: system, description: "DRAFT | ACTIVE | RESCINDED", default: DRAFT }

  - name: GrandfatherCommitment
    parent: PolicyChange
    common_fields: true
    fields:
      - { name: policy_change_id, type: string, source: system, description: "FK -> PolicyChange.id; owning change" }
      - { name: org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; org holding the commitment" }
      - { name: project_id, type: string, source: system, description: "FK -> GameProject.id; grandfathered project" }
      - { name: locked_schedule_label, type: string, source: system, description: "Always BASE — schedule frozen at pre-change rates" }
      - { name: commitment_status, type: enum, source: system, description: "ACTIVE | VOIDED" }
      - { name: attestation_deadline, type: string, source: system, description: "ISO date: owning PolicyChange.announcement_date + grandfather_window_days; commitment VOIDED if not attested by then" }

  - name: AssetListing
    parent: DeveloperOrg
    common_fields: true
    fields:
      - { name: creator_org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; selling org (from path)" }
      - { name: title, type: string, source: input, description: "Listing title" }
      - { name: price_cents, type: integer, source: input, description: "List price; 0 allowed (free asset)" }
      - { name: listing_status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | APPROVED | REJECTED | DELISTED", default: DRAFT }
      - { name: review_rounds, type: integer, source: computed, description: "Count of PENDING_REVIEW entries; delist-resubmit loop increments" }

  - name: AssetPurchase
    parent: AssetListing
    common_fields: false
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> AssetListing.id; purchased listing (from path)" }
      - { name: buyer_org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; buying org (from caller identity)" }
      - { name: gross_cents, type: integer, source: computed, description: "Charge amount = listing price at purchase time" }
      - { name: platform_share_cents, type: integer, source: computed, description: "Platform cut per creator_revenue_share tiered schedule" }
      - { name: creator_share_cents, type: integer, source: computed, description: "gross - platform_share" }
      - { name: purchase_status, type: enum, source: system, description: "COMPLETED | REFUNDED" }
      - { name: purchased_at, type: datetime, source: system, description: "Server timestamp" }

  - name: ExportAgreement
    parent: DeveloperOrg
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; owning org (from path)" }
      - { name: platform_code, type: enum, source: input, description: "CONSOLE_A | CONSOLE_B | CONSOLE_C" }
      - { name: term_start, type: string, source: input, description: "ISO date term begins (inclusive — closed interval)" }
      - { name: term_end, type: string, source: input, description: "ISO date term ends (inclusive — closed interval); must be >= term_start" }
      - { name: agreement_status, type: enum, source: system, description: "PENDING | ACTIVE | REVOKED | EXPIRED", default: PENDING }

  - name: ExportBuild
    parent: GameProject
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> GameProject.id; owning project (from path)" }
      - { name: agreement_id, type: string, source: input, description: "FK -> ExportAgreement.id; agreement authorizing this export" }
      - { name: platform_code, type: enum, source: input, description: "CONSOLE_A | CONSOLE_B | CONSOLE_C" }
      - { name: build_label, type: string, source: input, description: "Free-form build tag" }
      - { name: created_on, type: string, source: system, description: "ISO date of export" }

  - name: AuditCase
    parent: DeveloperOrg
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; audited org (from path)" }
      - { name: trigger_reason, type: enum, source: input, description: "REVENUE_CEILING_BREACH | EDUCATION_ELIGIBILITY | MANUAL" }
      - { name: case_status, type: enum, source: system, description: "OPENED | EVIDENCE_REQUESTED | CLEARED | CONVERTED | APPEALED", default: OPENED }
      - { name: resolved_tier_code, type: enum, source: system, description: "Tier the org is converted to when CONVERTED; null otherwise" }
      - { name: back_bill_cents, type: integer, source: computed, description: "Retroactive seat/tier charges computed at conversion" }
      - { name: appeal_count, type: integer, source: computed, description: "Number of appeals filed", default: 0 }

  - name: MigrationAssessment
    parent: DeveloperOrg
    common_fields: true
    fields:
      - { name: org_id, type: string, source: system, description: "FK -> DeveloperOrg.id; migrating org (from path)" }
      - { name: target_engine, type: string, source: input, description: "Free-form alternative engine name" }
      - { name: assessment_status, type: enum, source: system, description: "REQUESTED | EXPORT_READY | COOLING_OFF | COMPLETED | ABANDONED", default: REQUESTED }
      - { name: buyout_quote_cents, type: integer, source: computed, description: "Outstanding invoice balance + committed seat remainder + early termination fee per buyout_settlement" }
      - { name: cooling_off_until, type: string, source: system, description: "ISO date cooling-off ends; set entering COOLING_OFF" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TierConfig
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /tiers with supersedes_tier_config_id pointing at this config"
        actor: PlatformAdmin
        preconditions:
          - "superseding config has same tier_code"
          - "this config is currently ACTIVE"
        side_effects:
          - "this config's tier_config_status becomes SUPERSEDED"
          - "superseding config created ACTIVE"
          - "orgs on this tier keep effective_tier_code but future tier_determination reads the superseding config's constants"

  - entity: SeatSubscription
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system — when active_seats reaches purchased_seats after an assign"
        actor: system
        preconditions: ["active_seats == purchased_seats"]
        side_effects: ["subscription_status := EXHAUSTED"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /seat-subscriptions/{id}/release frees at least one seat"
        actor: OrgOwner
        preconditions: ["active_seats >= 1"]
        side_effects:
          - "active_seats -= 1; available_seats += 1"
          - "subscription_status := ACTIVE when active_seats < purchased_seats"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — logical clock passes coverage_end"
        actor: system
        preconditions: ["current date >= coverage_end"]
        side_effects:
          - "subscription_status := EXPIRED"
          - "all seats released; active_seats := 0, available_seats := purchased_seats (recorded as released, not assignable)"
      - from: EXHAUSTED
        to: EXPIRED
        trigger: "system — logical clock passes coverage_end"
        actor: system
        preconditions: ["current date >= coverage_end"]
        side_effects: ["same as ACTIVE->EXPIRED"]

  - entity: EditorVersion
    initial_state: SUPPORTED
    terminal_states: [SUNSET]
    transitions:
      - from: SUPPORTED
        to: LTS
        trigger: "POST /editor-versions/{id}/transition to LTS with lts_window_start/lts_window_end"
        actor: PlatformAdmin
        preconditions:
          - "no other version on the same major_line has an LTS window overlapping [lts_window_start, lts_window_end] (closed intervals; adjacency on the same day counts as overlap)"
        side_effects:
          - "lts_window_start/lts_window_end set"
          - "every SHIPPED GameProject pinned to this version recomputes upgrade_risk_score"
      - from: LTS
        to: DEPRECATED
        trigger: "POST /editor-versions/{id}/transition to DEPRECATED"
        actor: PlatformAdmin
        preconditions: ["current date > lts_window_end"]
        side_effects:
          - "SHIPPED projects pinned to this version: upgrade_risk_score recomputed (higher weight)"
      - from: DEPRECATED
        to: SUNSET
        trigger: "POST /editor-versions/{id}/transition to SUNSET"
        actor: PlatformAdmin
        preconditions: ["lts_window_end at least 12 months in the past"]
        side_effects:
          - "GameProjects pinned to this version transition FROZEN if SHIPPED (no new install reports accepted)"
          - "frozen projects keep lifetime_installs; outstanding RuntimeFeeInvoices remain payable"
      - from: SUPPORTED
        to: DEPRECATED
        trigger: "POST /editor-versions/{id}/transition to DEPRECATED (skip LTS)"
        actor: PlatformAdmin
        preconditions: ["released_on at least 24 months in the past"]
        side_effects: ["same risk recompute as LTS->DEPRECATED"]

  - entity: GameProject
    initial_state: DEVELOPMENT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DEVELOPMENT
        to: SHIPPED
        trigger: "POST /projects/{id}/ship"
        actor: OrgOwner
        preconditions:
          - "owning org's org_standing != SUSPENDED"
          - "pinned EditorVersion.support_status != SUNSET"
        side_effects:
          - "shipped_on set to current date"
          - "runtime-fee tracking begins: lifetime_installs := 0"
          - "if an ACTIVE adverse retroactive PolicyChange exists whose grandfather window is open, a GrandfatherCommitment is created automatically for this project only if shipped_on <= policy_change.announcement_date + grandfather_window_days AND the project was SHIPPED before the announcement_date; projects shipped after announcement get CONVERTED schedule"
      - from: SHIPPED
        to: FROZEN
        trigger: "system cascade — pinned EditorVersion reaches SUNSET"
        actor: system
        preconditions: ["editor version SUNSET"]
        side_effects:
          - "no new InstallReport may be created (ERR_PROJECT_FROZEN)"
          - "upgrade_risk_score recomputed at max editor-age weight"
      - from: SHIPPED
        to: ARCHIVED
        trigger: "POST /migration-assessments/{id}/advance to COMPLETED on the owning org"
        actor: system
        preconditions: ["owning org migration completes"]
        side_effects: ["project ARCHIVED; non-terminal RuntimeFeeInvoices must already be PAID or WAIVED (gate at migration advance)"]
      - from: DEVELOPMENT
        to: ARCHIVED
        trigger: "POST /migration-assessments/{id}/advance with target COMPLETED"
        actor: system
        preconditions: ["owning org migration completes"]
        side_effects: ["project ARCHIVED; no invoice settlement required (never SHIPPED => no runtime invoices)"]
      - from: FROZEN
        to: ARCHIVED
        trigger: "POST /migration-assessments/{id}/advance with target COMPLETED"
        actor: system
        preconditions: ["owning org migration completes"]
        side_effects: ["project ARCHIVED"]

  - entity: InstallReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /install-reports/{id}/submit"
        actor: OrgOwner
        preconditions:
          - "owning project SHIPPED (not FROZEN/ARCHIVED)"
          - "owning org has no OPENED/EVIDENCE_REQUESTED AuditCase (reporting frozen during audit)"
        side_effects:
          - "RuntimeFeeInvoice created PROVISIONAL/UNPAID with provisional_amount_cents from runtime_fee_assessment provisional variant"
          - "GameProject.lifetime_installs unchanged until acceptance"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /install-reports/{id}/review with action REVIEW"
        actor: ReviewBoard
        preconditions: ["report_status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /install-reports/{id}/review with action ACCEPT"
        actor: ReviewBoard
        preconditions: ["billable_installs >= 0"]
        side_effects:
          - "GameProject.lifetime_installs += billable_installs (ledger sync)"
          - "RuntimeFeeInvoice assessment_status -> FINALIZED with final_amount_cents recomputed via final variant; due_date := current date + 30 days"
          - "DeveloperOrg.balance_due_cents += final_amount_cents"
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "POST /install-reports/{id}/review with action DISPUTE and review_note"
        actor: ReviewBoard
        preconditions: ["report_status == UNDER_REVIEW"]
        side_effects:
          - "review_note stored"
          - "RuntimeFeeInvoice assessment_status -> DISPUTED (amount frozen at provisional)"
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /install-reports/{id}/revise with corrected install figures"
        actor: OrgOwner
        preconditions: ["report_status == DISPUTED"]
        side_effects:
          - "figures replaced; billable_installs recomputed"
          - "RuntimeFeeInvoice assessment_status -> ADJUSTED, provisional_amount_cents recomputed (revision cycle: DISPUTED->DRAFT->SUBMITTED allowed repeatedly)"

  - entity: RuntimeFeeInvoice
    initial_state: "PROVISIONAL/UNPAID"
    terminal_states: ["FINALIZED/PAID", "FINALIZED/WAIVED", "VOIDED/UNPAID"]
    note: "Two parallel state dimensions on one row: assessment_status (PROVISIONAL | FINALIZED | DISPUTED | ADJUSTED | VOIDED) and payment_status (UNPAID | PAID | WAIVED | OVERDUE) evolve independently; payment actions require assessment_status FINALIZED."
    transitions:
      - from: "PROVISIONAL/UNPAID"
        to: "FINALIZED/UNPAID"
        trigger: "system — source InstallReport accepted (or POST /invoices/{id}/finalize by FinanceOps)"
        actor: system
        preconditions: ["source report ACCEPTED"]
        side_effects: ["final_amount_cents computed via final variant", "due_date set", "org balance_due_cents increases"]
      - from: "FINALIZED/UNPAID"
        to: "FINALIZED/PAID"
        trigger: "POST /invoices/{id}/pay with amount_cents == final_amount_cents - paid_cents - waived_cents"
        actor: FinanceOps
        preconditions:
          - "assessment_status == FINALIZED"
          - "payment_status in {UNPAID, OVERDUE}"
          - "payment amount equals outstanding balance exactly (no partial payment)"
        side_effects:
          - "paid_cents += amount; org balance_due_cents -= amount"
      - from: "FINALIZED/UNPAID"
        to: "FINALIZED/WAIVED"
        trigger: "POST /invoices/{id}/waive"
        actor: FinanceOps
        preconditions:
          - "assessment_status == FINALIZED"
          - "invoice qualifies: project charity_flag OR org effective tier PERSONAL/EDUCATION at finalization OR policy grandfathering applied in error"
        side_effects:
          - "waived_cents := final_amount_cents - paid_cents"
          - "org balance_due_cents -= waived_cents (compensating invariant: final - paid - waived - balance_due delta == 0)"
      - from: "FINALIZED/UNPAID"
        to: "FINALIZED/OVERDUE"
        trigger: "system — logical clock passes due_date with outstanding balance > 0"
        actor: system
        preconditions: ["current date > due_date", "outstanding > 0"]
        side_effects:
          - "payment_status := OVERDUE"
          - "DeveloperOrg.org_standing recomputed: >=1 overdue invoice forces at least REVIEW"
      - from: "DISPUTED/UNPAID"
        to: "ADJUSTED/UNPAID"
        trigger: "system — source report revised"
        actor: system
        preconditions: []
        side_effects: ["provisional_amount_cents recomputed"]
      - from: "PROVISIONAL/UNPAID"
        to: "VOIDED/UNPAID"
        trigger: "system — source report archived by supersession before submit"
        actor: system
        preconditions: []
        side_effects: ["provisional amounts discarded; no balance impact"]

  - entity: PolicyChange
    initial_state: DRAFT
    terminal_states: [ACTIVE, RESCINDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /policy-changes/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "effective_date and announcement_date set"
          - "if retroactive_flag is true, grandfather_window_days must be >= 30"
        side_effects:
          - "Cascade depth 3, hop 1: every GameProject with project_status == SHIPPED and shipped_on <= announcement_date gets a GrandfatherCommitment (locked_schedule_label BASE, attestation_deadline := announcement_date + grandfather_window_days) recorded"
          - "Cascade hop 2: each such project's pinned_policy_change_id set; RuntimeFeeInvoices with assessment_status == PROVISIONAL on those projects keep BASE schedule label"
          - "Cascade hop 3: if retroactive_flag AND adverse_flag, every affected org's trust_score -= 10; orgs whose trust_score falls below 50 flip org_standing to REVIEW, which cascades: their APPROVED AssetListings re-enter PENDING_REVIEW"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system — logical clock passes a GrandfatherCommitment's attestation_deadline with commitment_status still ACTIVE and unattested"
        actor: system
        preconditions: ["current date > commitment.attestation_deadline"]
        side_effects:
          - "commitment_status := VOIDED"
          - "the linked project's pinned_policy_change_id cleared; subsequent invoice re-rates use the current schedule, not BASE"
      - from: DRAFT
        to: RESCINDED
        trigger: "POST /policy-changes/{id}/rescind"
        actor: PlatformAdmin
        preconditions: ["change_status == DRAFT"]
        side_effects: []

  - entity: AssetListing
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /asset-listings/{id}/submit-review"
        actor: OrgOwner
        preconditions:
          - "creator org tier allows marketplace selling (marketplace_sell_allowed)"
          - "creator org_standing == GOOD"
          - "price_cents >= 0"
        side_effects: ["review_rounds += 1"]
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /asset-listings/{id}/review action APPROVE"
        actor: ReviewBoard
        preconditions: ["listing_status == PENDING_REVIEW"]
        side_effects: []
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /asset-listings/{id}/review action REJECT"
        actor: ReviewBoard
        preconditions: ["listing_status == PENDING_REVIEW"]
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /asset-listings/{id}/revise"
        actor: OrgOwner
        preconditions: []
        side_effects: ["title/price may change; revision loop REJECTED->DRAFT->PENDING_REVIEW"]
      - from: APPROVED
        to: DELISTED
        trigger: "POST /asset-listings/{id}/delist"
        actor: OrgOwner
        preconditions: []
        side_effects: ["listing no longer purchasable; historical AssetPurchases unaffected"]
      - from: APPROVED
        to: PENDING_REVIEW
        trigger: "system cascade — creator org standing drops to REVIEW/SUSPENDED (e.g. adverse retroactive policy activation)"
        actor: system
        preconditions: []
        side_effects: ["review_rounds += 1; listing must be re-approved before new purchases"]
      - from: DELISTED
        to: DRAFT
        trigger: "POST /asset-listings/{id}/revise"
        actor: OrgOwner
        preconditions: []
        side_effects: ["cycle continues"]

  - entity: ExportAgreement
    initial_state: PENDING
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /export-agreements/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "org effective tier has export_module_allowed"
          - "no other ACTIVE or PENDING agreement for same org + platform_code with term overlapping [term_start, term_end] (closed interval semantics: an existing agreement ending on the new term_start date still conflicts)"
        side_effects: ["org may create ExportBuilds for this platform while agreement ACTIVE"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /export-agreements/{id}/revoke"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Cascade depth 2, hop 1: future ExportBuild creation for this platform rejected"
          - "Cascade hop 2: billable console installs for this platform in subsequently submitted InstallReports become exempt (treated as bundle_installs) on projects whose only export channel was this agreement, changing provisional invoice amounts"

  - entity: AuditCase
    initial_state: OPENED
    terminal_states: [CLEARED, CONVERTED]
    transitions:
      - from: OPENED
        to: EVIDENCE_REQUESTED
        trigger: "POST /audit-cases/{id}/request-evidence"
        actor: Auditor
        preconditions: []
        side_effects: ["org blocked from submitting InstallReports while case open"]
      - from: EVIDENCE_REQUESTED
        to: CLEARED
        trigger: "POST /audit-cases/{id}/resolve with outcome CLEAR"
        actor: Auditor
        preconditions: ["evidence review complete"]
        side_effects: ["org restrictions lifted"]
      - from: EVIDENCE_REQUESTED
        to: CONVERTED
        trigger: "POST /audit-cases/{id}/resolve with outcome CONVERT and resolved_tier_code"
        actor: Auditor
        preconditions:
          - "resolved_tier_code is strictly higher than org's current effective_tier_code"
        side_effects:
          - "Cascade depth 3, hop 1: org effective_tier_code := resolved_tier_code; trust_score -= 15"
          - "Cascade hop 2: seat shortfall computed against new tier's seat_minimum; back_bill_cents := shortfall_seats * seat_overage_cents * months since breach detected"
          - "Cascade hop 3: open PROVISIONAL RuntimeFeeInvoices re-rated under new tier constants (fee_schedule_label := CONVERTED); if new tier is runtime_fee_exempt=false and old was exempt, provisional amounts may increase; balance_due_cents recomputed"
      - from: CONVERTED
        to: APPEALED
        trigger: "POST /audit-cases/{id}/appeal"
        actor: OrgOwner
        preconditions: ["appeal_count < 2"]
        side_effects: ["appeal_count += 1"]
      - from: APPEALED
        to: CLEARED
        trigger: "POST /audit-cases/{id}/resolve outcome CLEAR (appeal upheld)"
        actor: Auditor
        preconditions: []
        side_effects:
          - "org effective_tier_code restored to pre-conversion tier"
          - "trust_score += 15 (compensating reversal of conversion decrement)"
          - "CONVERTED-labeled PROVISIONAL invoices re-rated back to prior tier schedule; back_bill reversed"
      - from: APPEALED
        to: CONVERTED
        trigger: "POST /audit-cases/{id}/resolve outcome CONVERT (appeal denied)"
        actor: Auditor
        preconditions: []
        side_effects: ["conversion stands; no further state change"]

  - entity: MigrationAssessment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: REQUESTED
        to: EXPORT_READY
        trigger: "POST /migration-assessments/{id}/advance with target EXPORT_READY"
        actor: OrgOwner
        preconditions: []
        side_effects: ["buyout_quote_cents computed via buyout_settlement"]
      - from: EXPORT_READY
        to: COOLING_OFF
        trigger: "POST /migration-assessments/{id}/advance with target COOLING_OFF"
        actor: OrgOwner
        preconditions: ["buyout quote computed"]
        side_effects: ["cooling_off_until := current date + 14 days"]
      - from: COOLING_OFF
        to: COMPLETED
        trigger: "POST /migration-assessments/{id}/advance with target COMPLETED"
        actor: OrgOwner
        preconditions:
          - "current date >= cooling_off_until"
          - "all org RuntimeFeeInvoices have payment_status in {PAID, WAIVED} (cross-entity gate)"
          - "no OPENED/EVIDENCE_REQUESTED/APPEALED AuditCase on the org"
        side_effects:
          - "org migration_status := MIGRATED"
          - "all org GameProjects -> ARCHIVED"
          - "org's APPROVED AssetListings -> DELISTED"
      - from: COOLING_OFF
        to: ABANDONED
        trigger: "POST /migration-assessments/{id}/advance with target ABANDONED"
        actor: OrgOwner
        preconditions: []
        side_effects: ["org migration_status := NONE"]
      - from: REQUESTED
        to: ABANDONED
        trigger: "POST /migration-assessments/{id}/advance with target ABANDONED"
        actor: OrgOwner
        preconditions: []
        side_effects: ["org migration_status := NONE"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: install-report-create-stale-project
    parent_entity: GameProject
    write_endpoint: "POST /projects/{id}/install-reports"
    occ_field: "expected_project_version"
    description: |
      Creating an InstallReport against a GameProject whose version has advanced
      since the client last observed it is rejected. Creating a report for a
      period legitimately supersedes a still-DRAFT report for the same period
      (the prior draft is archived), so a client holding a stale project version
      would unknowingly archive someone else's draft.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: seat-subscription-create-stale-org
    parent_entity: DeveloperOrg
    write_endpoint: "POST /orgs/{id}/seat-subscriptions"
    occ_field: "expected_org_version"
    description: |
      Creating a SeatSubscription against a DeveloperOrg whose version has
      advanced since the client last observed it is rejected. Seat purchases
      depend on the org's current effective tier (seat_minimum, overage rate);
      a tier change or audit conversion bumps org version and invalidates the
      pricing basis the client used.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tier_determination
    trigger: "on every POST /orgs/{id}/revenue-declarations and on audit conversion; result readable via GET /orgs/{id}/tier-assessment"
    algorithm: threshold
    formula: |
      months = count of RevenueDeclaration rows for org (distinct period_month)
      ttm_revenue = sum(gross_revenue_cents over the up-to-12 most recent period_months)
      if months < 12:
        variant_actual:   effective_revenue = ttm_revenue
        variant_annualized: effective_revenue = round_half_up(ttm_revenue / months * 12)
      else:
        both variants: effective_revenue = ttm_revenue
      lifetime_funding = sum(funding_received_cents over ALL declarations)
      signal_tier = lowest tier whose revenue_ceiling_cents == 0 OR effective_revenue <= revenue_ceiling_cents,
                    AND whose funding_ceiling_cents == 0 OR lifetime_funding <= funding_ceiling_cents
      effective_tier = higher of (declared_tier, signal_tier) by rank PERSONAL < EDUCATION < PRO < ENTERPRISE
      (EDUCATION additionally requires education_verified == true; otherwise treated as PERSONAL rank)
    input_set: "all RevenueDeclaration rows for the org, any period; TierConfig rows with tier_config_status == ACTIVE"
    constants:
      TIER_RANK: "PERSONAL=1, EDUCATION=2, PRO=3, ENTERPRISE=4"
    precision: "integer cents; annualization uses round_half_up on the monthly average times 12"
    variants:
      - name: actual_ttm
        when: "audit review and invoice qualification decisions (conservative, uses real receipts only)"
        difference: "with <12 months declared, uses the raw partial sum — smaller than annualized, so an org can pass a revenue ceiling under actual_ttm and fail under annualized_projection for identical declaration data"
      - name: annualized_projection
        when: "self-service tier assessment and audit-trigger detection (POST /orgs/{id}/tier-assessment, automatic AuditCase suggestion)"
        difference: "annualizes the partial run-rate; identical declaration rows produce a larger effective_revenue whenever months < 12 and average monthly revenue > 0"

  - name: runtime_fee_assessment
    trigger: "on InstallReport submit (provisional) and on InstallReport accept / POST /invoices/{id}/finalize (final)"
    algorithm: tiered_pricing
    formula: |
      Eligibility gate (AND of both thresholds):
        project.lifetime_installs + report.billable_installs >= INSTALL_THRESHOLD
        AND org effective_revenue (actual_ttm variant) >= REVENUE_THRESHOLD_CENTS
      If org's ACTIVE TierConfig has runtime_fee_exempt == true: amount = 0.
      If project.charity_flag == true: amount = 0.
      Chargeable installs for the period:
        installs below the threshold are never charged; only the portion of
        billable_installs above (INSTALL_THRESHOLD - lifetime_installs_before) is chargeable
        when the threshold is crossed within this period.
      Per-install marginal rate by crossed-amount tier:
        first 100,000 chargeable installs in period: RATE_LOW_CENTS
        beyond 100,000: RATE_HIGH_CENTS
      fee_schedule selection (pinned order):
        1. project.pinned_policy_change_id != null AND its GrandfatherCommitment is ACTIVE
           (attested or still within window) -> BASE (pre-change rates)
        2. org converted by audit (CONVERTED label) -> current rates of new tier
        3. otherwise -> current ACTIVE PolicyChange rates if any, else BASE
      anti-double-counting rule: BASE constants and PolicyChange rates apply ONLY to
        the per-install RATES on installs counted once. An install is counted at most
        once across all reports (billable_installs are consumed into lifetime_installs
        at acceptance); no schedule, old or new, may re-charge installs already counted
        in lifetime_installs. Retroactivity changes the RATE going forward, never
        re-bills already-accepted installs.
      rounding: compute per-rate-tier line amounts, round each line to cents (round_half_up),
        then sum lines (line-then-sum order is PINNED; sum-then-round is forbidden)
    input_set: "source InstallReport (billable_installs = new_device_installs only); GameProject.lifetime_installs BEFORE this report is applied; org declarations for revenue gate"
    constants:
      INSTALL_THRESHOLD: 1000000
      REVENUE_THRESHOLD_CENTS: 100000000
      RATE_LOW_CENTS: 20
      RATE_HIGH_CENTS: 5
    precision: "integer cents, round_half_up per line, then sum"
    variants:
      - name: provisional
        when: "on report submit"
        difference: "uses self-reported billable_installs and lifetime_installs at submit time; may be computed while org is PERSONAL (exempt) and later re-rated on tier conversion"
      - name: final
        when: "on report acceptance or explicit finalize"
        difference: "recomputes billable_installs from the revised (post-dispute) figures and re-evaluates the eligibility gate with lifetime_installs at acceptance time; a dispute revision that lowers billable_installs below the crossing point yields final < provisional for identical submitted data"

  - name: invoice_net_settlement
    trigger: "on invoice finalize, pay, waive; feeds DeveloperOrg.balance_due_cents"
    algorithm: waterfall_allocation
    formula: |
      outstanding = final_amount_cents - paid_cents - waived_cents
      Evaluation order is PINNED (circular-looking dependency made explicit):
        1. waiver_credit_cap = round_half_up(final_amount_cents * WAIVER_CAP_PCT)
        2. waived_cents = min(requested_waiver, waiver_credit_cap) + paid_cents_adjustment(0)
        3. outstanding_after_waiver = final_amount_cents - paid_cents - waived_cents
        4. payment applies to outstanding_after_waiver; overpayment rejected (ERR_PAYMENT_EXCEEDS_BALANCE)
      org.balance_due_cents = sum over all invoices of max(outstanding, 0)
    input_set: "RuntimeFeeInvoice rows of all org projects with assessment_status in {FINALIZED, ADJUSTED} and payment_status in {UNPAID, OVERDUE}"
    constants:
      WAIVER_CAP_PCT: 0.5
    precision: "integer cents; cap rounded before min()"

  - name: creator_revenue_share
    trigger: "on POST /asset-listings/{id}/purchase"
    algorithm: tiered_pricing
    formula: |
      creator_lifetime_gross = sum(gross_cents over creator org's COMPLETED purchases) before this purchase
      platform_share_pct (average-rate tiered, applied to THIS purchase's gross only):
        tier boundary on creator_lifetime_gross:
          <  100000000 cents ( $1M ): 30%
          >= 100000000               : 25%
      platform_share_cents = round_half_up(gross_cents * platform_share_pct)
      creator_share_cents = gross_cents - platform_share_cents
      org.marketplace_credit_cents += creator_share_cents
    input_set: "AssetPurchase rows for the creator org with purchase_status == COMPLETED"
    constants:
      SHARE_BOUNDARY_CENTS: 100000000
      SHARE_LOW_PCT: 0.30
      SHARE_HIGH_PCT: 0.25
    precision: "integer cents, round_half_up on the share only; creator share is the remainder"

  - name: upgrade_risk_score
    trigger: "on project ship, on pinned EditorVersion support_status transitions, on install acceptance"
    algorithm: weighted_scoring
    formula: |
      score = min(100,
          25 * support_weight        # SUPPORTED=0, LTS=1, DEPRECATED=2, SUNSET=3 -> weight = support_weight/3
        + 20 * age_factor            # months since released_on / 36, capped at 1
        + 35 * install_factor        # log10(1 + lifetime_installs) / 7, capped at 1
        + 20 * api_factor            # min(deprecated_api_count, 200) / 200
      ) rounded to integer (round_half_up)
    input_set: "pinned EditorVersion fields; project lifetime_installs; logical clock date"
    constants:
      AGE_HORIZON_MONTHS: 36
      API_CAP: 200
    precision: "integer score 0..100"

  - name: buyout_settlement
    trigger: "on MigrationAssessment advance to EXPORT_READY"
    algorithm: aggregation
    formula: |
      outstanding_invoices = org.balance_due_cents
      committed_seat_remainder = sum over org's ACTIVE/EXHAUSTED SeatSubscriptions of
        purchased_seats * SEAT_MONTH_CENTS * remaining_whole_months(coverage_end, current date)
      early_termination_fee =
        if org tenure >= 36 months: 0
        elif tenure >= 12 months: round_half_up(0.10 * (outstanding_invoices + committed_seat_remainder))
        else: round_half_up(0.25 * (outstanding_invoices + committed_seat_remainder))
      buyout_quote_cents = outstanding_invoices + committed_seat_remainder + early_termination_fee
    input_set: "org invoices, subscriptions with coverage_end > current date, org created_at for tenure"
    constants:
      SEAT_MONTH_CENTS: 15000
      TENURE_FULL_WAIVER_MONTHS: 36
      TENURE_REDUCED_MONTHS: 12
    precision: "integer cents; remaining months are whole calendar months (partial month rounds UP)"

  - name: back_bill_computation
    trigger: "on AuditCase resolve with outcome CONVERT"
    algorithm: chronological
    formula: |
      Process RevenueDeclaration rows in period_month ascending order (tie-break: declared_at ASC).
      breach_month = first period_month where cumulative annualized effective_revenue exceeded
        the OLD tier's revenue_ceiling_cents (annualized_projection variant).
      months_since_breach = whole months between breach_month and current month (partial rounds DOWN)
      shortfall_seats = max(0, NEW tier seat_minimum - sum(purchased_seats over ACTIVE/EXHAUSTED subscriptions))
      back_bill_cents = shortfall_seats * NEW tier seat_overage_cents * months_since_breach
    input_set: "org declarations, ACTIVE/EXHAUSTED subscriptions, old/new ACTIVE TierConfig constants"
    precision: "integer cents; months computed from period_month strings, not wall clock"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted to call this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed role ownership: OrgOwner may act only on resources whose org chain resolves to X-User-ID"
    error_id: ERR_FORBIDDEN_ORG
    http_status: 403
    applies_to: "all org-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path resources exist, validated left-to-right (org, then project, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "Target resource state permits the transition (per §1.2 from-states and terminal lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Org-level gates: org_standing != SUSPENDED for ship/submit-review/purchase; migration_status != MIGRATED for any new business write"
    error_id: ERR_ORG_SUSPENDED
    http_status: 409
    applies_to: "POST /projects/{id}/ship, POST /asset-listings/{id}/submit-review, POST /asset-listings/{id}/purchase, POST /orgs/{id}/revenue-declarations"
  - priority: 7
    category: business_temporal
    check: "Interval validity: coverage_start < coverage_end (subscriptions); term_start <= term_end (agreements); dates well-formed"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /orgs/{id}/seat-subscriptions, POST /orgs/{id}/export-agreements, POST /editor-versions/{id}/transition"
  - priority: 8
    category: business_temporal
    check: "Subscription overlap: no two SeatSubscriptions for the same org + tier_code with overlapping half-open [coverage_start, coverage_end); adjacency (end == start) is allowed"
    error_id: ERR_SUBSCRIPTION_OVERLAP
    http_status: 409
    applies_to: "POST /orgs/{id}/seat-subscriptions"
  - priority: 9
    category: business_temporal
    check: "Agreement overlap: no two ACTIVE/PENDING ExportAgreements for same org + platform_code with overlapping closed [term_start, term_end]; adjacency (end == start) IS a conflict"
    error_id: ERR_AGREEMENT_OVERLAP
    http_status: 409
    applies_to: "POST /orgs/{id}/export-agreements, POST /export-agreements/{id}/activate"
  - priority: 10
    category: business_temporal
    check: "LTS window overlap: no two EditorVersions on same major_line with overlapping closed LTS windows"
    error_id: ERR_LTS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /editor-versions/{id}/transition"
  - priority: 11
    category: business_referential
    check: "Referenced EditorVersion exists and is not SUNSET at project creation/ship; referenced TierConfig ACTIVE"
    error_id: ERR_VERSION_UNSUPPORTED
    http_status: 422
    applies_to: "POST /orgs/{id}/projects, POST /projects/{id}/ship"
  - priority: 12
    category: business_referential
    check: "ExportAgreement referenced by ExportBuild belongs to same org, matches platform_code, and is ACTIVE"
    error_id: ERR_AGREEMENT_INACTIVE
    http_status: 409
    applies_to: "POST /projects/{id}/export-builds"
  - priority: 13
    category: business_constraint
    check: "Uniqueness: one RevenueDeclaration per org+period_month; one non-ARCHIVED InstallReport per project+period_month; version_string unique; change_code unique"
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /orgs/{id}/revenue-declarations, POST /projects/{id}/install-reports, POST /editor-versions, POST /policy-changes"
  - priority: 14
    category: business_constraint
    check: "Tier feature gate: marketplace_sell_allowed for listing submit; export_module_allowed for agreement activation; EDUCATION tier requires education_verified"
    error_id: ERR_TIER_FEATURE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /asset-listings/{id}/submit-review, POST /export-agreements/{id}/activate, POST /orgs"
  - priority: 15
    category: business_constraint
    check: "Seat capacity: assign requires available_seats >= 1 (subscription ACTIVE); release requires active_seats >= 1"
    error_id: ERR_SEAT_CAPACITY
    http_status: 409
    applies_to: "POST /seat-subscriptions/{id}/assign, POST /seat-subscriptions/{id}/release"
  - priority: 16
    category: business_fiscal
    check: "Payment exactness: pay amount equals outstanding balance; overpayment rejected; zero-outstanding pay rejected"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /invoices/{id}/pay"
  - priority: 17
    category: business_fiscal
    check: "Waiver eligibility and cap: invoice qualifies for waiver; waiver amount <= WAIVER_CAP_PCT of final amount unless full-waiver qualification"
    error_id: ERR_WAIVER_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /invoices/{id}/waive"
  - priority: 18
    category: business_safety
    check: "Migration completion gate: all invoices PAID/WAIVED, no open audit, cooling-off elapsed"
    error_id: ERR_MIGRATION_BLOCKED
    http_status: 409
    applies_to: "POST /migration-assessments/{id}/advance"
  - priority: 19
    category: business_safety
    check: "Audit freeze: org with open AuditCase (OPENED/EVIDENCE_REQUESTED/APPEALED) may not submit InstallReports"
    error_id: ERR_AUDIT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /install-reports/{id}/submit"
  - priority: 20
    category: business_constraint
    check: "Required input fields present with valid types/ranges (price_cents >= 0, purchased_seats >= 1, installs >= 0, enum members)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default time is 2026-09-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time. Advances system time for due-date, expiry, cooling-off, and tenure rules."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["evaluates EXPIRED transitions for SeatSubscriptions and ExportAgreements, OVERDUE transitions for invoices, SUNSET cascades"]

  - method: POST
