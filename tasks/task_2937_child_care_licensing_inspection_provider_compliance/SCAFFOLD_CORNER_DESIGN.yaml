          assert:
            - "${lic_st} == PROVISIONAL with provisional_started_at == 2026-08-05T09:00:00Z and license_number == LIC-01-0001"
            - "${e_early} == ERR_PROVISIONAL_PERIOD_NOT_ELAPSED with HTTP 409 at the licensure instant"
            - "Provider.${prov}.license_status is still PROVISIONAL after the refused call"
            - "Inspection.${ins_ann}.status == FINALIZED with final_compliance_score 100.00"
            - "${lic_full} == FULL — the period elapsed (PROVISIONAL_PERIOD_MONTHS 6) and open_violation_points == critical_open_count == 0"
            - "Provider.${prov}.application_status is still LICENSED and licensed_capacity is still 10"

  # ---------------------------------------------------------------------------
  # Guide section 6 — Errors. Table 6 declares no claim-type rows, so every
  # instance carries claim_type: error_triggerable. §1.6 declares 68 codes; 52
  # of them are already triggered by a §1.8 difficulty instance or by one of
  # the sections above. The twelve instances here plus the three in `rbac` and
  # ERR_STALE_PROVIDER_VERSION in `cross_cutting_complexity_layers` close the
  # remaining sixteen, so every declared code is reachable from some recipe.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: err_invalid_violation_state_uncorrected_before_finalize
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_VIOLATION_STATE]
          - validations.priority_43_ERR_INVALID_VIOLATION_STATE
          - state_machines.Violation
        distinguishing_aspect: "A freshly cited violation is CITED, and CITED to UNCORRECTED is not a declared edge — UNCORRECTED is reachable only from CORRECTION_PENDING, which finalize creates — so the disposition is refused with ERR_INVALID_VIOLATION_STATE 409 while VACATED from the very same CITED row is accepted."
        test_recipe:
          setup:
            - "A CRITICAL violation cited on an IN_PROGRESS inspection, before any finalize."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "Nap room left unattended." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio: $.data.id, vst: $.data.status, vpts: $.data.assessed_points }
          trigger:
            - call: "POST /licensing/violations/${vio}/disposition"
              payload: { disposition: "UNCORRECTED" }
              as: LicensingSupervisor
              captures: { e_vst: $.data.error_id }
            - call: "POST /licensing/violations/${vio}/disposition"
              payload: { disposition: "VACATED", vacated_reason: "Cited against the wrong room." }
              as: LicensingSupervisor
              captures: { vst2: $.data.status }
          assert:
            - "${vst} == CITED and ${vpts} == 15"
            - "${e_vst} == ERR_INVALID_VIOLATION_STATE with HTTP 409 and a message naming the required from-set"
            - "Violation.${vio}.status is still CITED after the refusal and Provider.${prov}.open_violation_points is still 15"
            - "${vst2} == VACATED — the same row is vacatable from CITED, so only the requested target state was wrong"
            - "Provider.${prov}.open_violation_points == 0 and lifetime_violation_points == 0 after the VACATED disposition"

      - name: err_invalid_check_state_waiver_requested_on_a_submitted_check
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_CHECK_STATE]
          - validations.priority_50_ERR_INVALID_CHECK_STATE
          - state_machines.BackgroundCheck
        distinguishing_aspect: "A waiver may only be sought for a DISQUALIFIED check: asking for one while the registry result is still outstanding (status SUBMITTED) returns ERR_INVALID_CHECK_STATE 409 and leaves both the check and the staff member's clearance_status untouched."
        test_recipe:
          setup:
            - "A DIRECTOR with one FBI_FINGERPRINT check still in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc: $.data.id, bst: $.data.status }
          trigger:
            - call: "POST /licensing/background-checks/${bc}/waiver"
              as: Applicant
              as_user_id: "${prov}"
              captures: { e_bst: $.data.error_id }
          assert:
            - "${bst} == SUBMITTED with waiver_requested_at == null"
            - "${e_bst} == ERR_INVALID_CHECK_STATE with HTTP 409"
            - "BackgroundCheck.${bc}.status is still SUBMITTED and waiver_requested_at is still null"
            - "StaffMember.${dir}.clearance_status is still PENDING — the refused waiver has no cascade"

      - name: err_duplicate_check_type_second_live_fingerprint_check
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_CHECK_TYPE]
          - validations.priority_79_ERR_DUPLICATE_CHECK_TYPE
          - endpoints.POST /licensing/background-checks
        distinguishing_aspect: "Liveness, not history, is what blocks a re-check: a second FBI_FINGERPRINT request for the same person is refused with ERR_DUPLICATE_CHECK_TYPE 409 while the first is SUBMITTED, and the sibling CHILD_ABUSE_REGISTRY request in the same breath is accepted because the pair (staff_member_id, check_type) is what must be unique."
        test_recipe:
          setup:
            - "A DIRECTOR with one FBI_FINGERPRINT check in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc1: $.data.id }
          trigger:
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { e_dup: $.data.error_id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc2: $.data.id }
          assert:
            - "${e_dup} == ERR_DUPLICATE_CHECK_TYPE with HTTP 409"
            - "BackgroundCheck.${bc1} is unchanged — no second FBI_FINGERPRINT row was created"
            - "${bc2} is a new row with status SUBMITTED, proving the uniqueness key includes check_type"
            - "GET /licensing/background-checks?staff_member_id=${dir} returns total_count 2"

      - name: err_repeat_reference_invalid_points_at_another_checklist_item
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REPEAT_REFERENCE_INVALID]
          - validations.priority_73_ERR_REPEAT_REFERENCE_INVALID
          - calculations.violation_point_assessment
        distinguishing_aspect: "A repeat must be a repeat of the same rule: naming a prior violation of the same provider but a different checklist_item_id returns ERR_REPEAT_REFERENCE_INVALID 422, so the REPEAT_MULTIPLIER can never be earned by chaining unrelated citations."
        test_recipe:
          setup:
            - "Two checklist items (SU-101 CRITICAL, RA-201 SERIOUS) and one IN_PROGRESS inspection already carrying an SU-101 citation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio maintained", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "Nap room left unattended." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio_su: $.data.id }
          trigger:
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "One staff member for fourteen preschoolers.", repeat_of_violation_id: "${vio_su}" }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { e_rep: $.data.error_id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "One staff member for fourteen preschoolers." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio_ra: $.data.id, depth: $.data.repeat_chain_depth, pts: $.data.assessed_points }
          assert:
            - "${e_rep} == ERR_REPEAT_REFERENCE_INVALID with HTTP 422"
            - "No Violation row was created by the refused call: Inspection.${ins}.violation_count is still 1 and Provider.${prov}.open_violation_points is still 15"
            - "${depth} == 0 and ${pts} == 8 for the accepted first-offence SERIOUS citation"
            - "Provider.${prov}.open_violation_points == 23 at the end (15 + 8)"

      - name: err_p1_cannot_be_screened_out_abuse_allegation
        claim_type: error_triggerable
        grounds:
          - errors[ERR_P1_CANNOT_BE_SCREENED_OUT]
          - validations.priority_61_ERR_P1_CANNOT_BE_SCREENED_OUT
          - calculations.complaint_priority_and_deadline
        distinguishing_aspect: "The highest-priority allegations cannot be disposed of at intake: an ABUSE complaint computes P1 for every age band, so SCREEN_OUT returns ERR_P1_CANNOT_BE_SCREENED_OUT 409 while SCREEN_IN on the identical row is accepted."
        test_recipe:
          setup:
            - "One ABUSE / PRESCHOOL complaint received at 2026-08-10T00:00:00Z against a provider with license_status NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "ABUSE", affected_age_group: "PRESCHOOL", narrative: "Caller reports a child was struck." }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id, pri: $.data.priority, due: $.data.investigation_due_at }
          trigger:
            - call: "POST /licensing/complaints/${cmp}/screen"
              payload: { decision: "SCREEN_OUT" }
              as: ComplaintIntakeSpecialist
              captures: { e_p1: $.data.error_id }
            - call: "POST /licensing/complaints/${cmp}/screen"
              payload: { decision: "SCREEN_IN" }
              as: ComplaintIntakeSpecialist
              captures: { cst: $.data.status }
          assert:
            - "${pri} == P1 (COMPLAINT_PRIORITY_MATRIX[ABUSE][OLDER]) and ${due} == 2026-09-09T00:00:00Z (30 days)"
            - "${e_p1} == ERR_P1_CANNOT_BE_SCREENED_OUT with HTTP 409"
            - "Complaint.${cmp}.status is still RECEIVED and screened_at is still null after the refusal"
            - "${cst} == SCREENED_IN with screened_at == 2026-08-10T00:00:00Z"

      - name: err_invalid_incident_state_close_before_review
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_INCIDENT_STATE]
          - validations.priority_48_ERR_INVALID_INCIDENT_STATE
          - state_machines.SeriousIncidentReport
        distinguishing_aspect: "Closing an incident is only legal from UNDER_REVIEW or INVESTIGATION_OPENED, so a REPORTED row goes to ERR_INVALID_INCIDENT_STATE 409 — and the MONITOR review that unlocks the close is itself refused for SERIOUS_INJURY only when the type demands an investigation, which this type does not."
        test_recipe:
          setup:
            - "A TIMELY SERIOUS_INJURY report filed at 2026-08-05T12:00:00Z for an event at 2026-08-05T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "SERIOUS_INJURY", occurred_at: "2026-08-05T10:00:00Z", affected_child_age_group: "PRESCHOOL", narrative: "Child fell from a climber and needed stitches." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { sir: $.data.id, sst: $.data.status, tim: $.data.reporting_timeliness }
          trigger:
