  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: screening_check_info_request_cycle
        grounds:
          - state_machines.ScreeningCheck.SUBMITTED_to_INFO_REQUESTED
          - state_machines.ScreeningCheck.INFO_REQUESTED_to_SUBMITTED
          - entities.ScreeningCheck.fields.resubmission_count
        distinguishing_aspect: |
          Cyclic machine on ScreeningCheck: SUBMITTED -> INFO_REQUESTED -> SUBMITTED
          -> INFO_REQUESTED -> SUBMITTED -> CLEARED loops twice through the same
          state; resubmission_count accumulates to 2 and reviewer_id/decided_at
          reflect the latest decision. Different entity from the Registration
          branching instance.
        test_recipe:
          setup:
            - "Program Alpha (DRAFT); volunteer v1 APPLIED with one BACKGROUND check SUBMITTED"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/volunteers", payload: { program_id: "${prog_id}", full_name: "Vera One", email: "vera1@example.com", phone: "555-0201", birth_date: "1990-05-20" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /vbs/screening-checks", payload: { volunteer_id: "${v1}", check_type: "BACKGROUND" }, as: Volunteer, as_user_id: "${v1}", captures: { chk: $.data.id } }
          trigger:
            - { call: "POST /vbs/screening-checks/${chk}/decide", payload: { decision: "INFO_REQUESTED", decision_notes: "Need a clearer scan" }, as: SafetyOfficer, as_user_id: "so-1", captures: { st1: $.data.status } }
            - { call: "POST /vbs/screening-checks/${chk}/resubmit", payload: { response_notes: "Re-scanned" }, as: Volunteer, as_user_id: "${v1}", captures: { st2: $.data.status, rc1: $.data.resubmission_count } }
            - { call: "POST /vbs/screening-checks/${chk}/decide", payload: { decision: "INFO_REQUESTED", decision_notes: "Still unreadable" }, as: SafetyOfficer, as_user_id: "so-1", captures: { st3: $.data.status } }
            - { call: "POST /vbs/screening-checks/${chk}/resubmit", payload: { response_notes: "Third attempt" }, as: Volunteer, as_user_id: "${v1}", captures: { rc2: $.data.resubmission_count } }
            - { call: "POST /vbs/screening-checks/${chk}/decide", payload: { decision: "CLEARED" }, as: SafetyOfficer, as_user_id: "so-1", captures: { stf: $.data.status, rcf: $.data.resubmission_count, rev: $.data.reviewer_id } }
          assert:
            - "${st1} == INFO_REQUESTED and ${st2} == SUBMITTED and ${st3} == INFO_REQUESTED  (cycle revisits SUBMITTED)"
            - "${rc1} == 1 and ${rc2} == 2 and ${rcf} == 2  (counter accumulates across the loop)"
            - "${stf} == CLEARED and ${rev} == so-1"
            - "Volunteer.${v1}.status == SCREENING  (only one of three required check types is CLEARED)"
      - name: registration_offer_branch_divergence
        grounds:
          - state_machines.Registration.OFFERED_to_ENROLLED
          - state_machines.Registration.OFFERED_to_DECLINED
          - state_machines.Registration.OFFERED_to_EXPIRED
        distinguishing_aspect: |
          Branching fork-join on Registration: creation forks ENROLLED|WAITLISTED,
          and OFFERED fans out to three branches with divergent side-effect sets —
          DECLINED fires the promotion loop for the next in queue while ENROLLED
          consumes the seat and fires NO promotion. Different entity from the
          ScreeningCheck cycle instance.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 1): A ENROLLED; B, C, D WAITLISTED (positions 1, 2, 3)"
            - "B has been promoted to OFFERED by cancelling A (offer expires 2026-08-03T00:00:00Z at the default clock)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 1 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "D", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kd: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_b: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_c: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kd}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_d: $.data.id } }
            - { call: "POST /vbs/registrations/${reg_a}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}" }
          trigger:
            - { call: "POST /vbs/registrations/${reg_b}/decline", payload: {}, as: Parent, as_user_id: "${fam_id}", captures: { b_status: $.data.status } }
            - { call: "GET /vbs/registrations/${reg_c}", payload: {}, as: RegistrationCoordinator, captures: { c_status: $.data.status, c_exp: $.data.offer_expires_at } }
            - { call: "POST /vbs/registrations/${reg_c}/accept", payload: {}, as: Parent, as_user_id: "${fam_id}", captures: { c_final: $.data.status } }
            - { call: "GET /vbs/registrations/${reg_d}", payload: {}, as: RegistrationCoordinator, captures: { d_status: $.data.status, d_pos: $.data.waitlist_position } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_enr: $.data.enrolled_count, k_status: $.data.status } }
          assert:
            - "${b_status} == DECLINED  (decline branch)"
            - "${c_status} == OFFERED and ${c_exp} == 2026-08-03T00:00:00Z  (decline fired the promotion loop for the next head)"
            - "${c_final} == ENROLLED  (accept branch: consumes the seat)"
            - "${d_status} == WAITLISTED and ${d_pos} == 1  (accept fires NO promotion — divergent side-effect set)"
            - "${k_enr} == 1 and ${k_status} == FULL"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: chains from DIFFERENT triggers (depths 3, 4, 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cancel_enrollee_promotes_waitlist_head
        grounds:
          - state_machines.Registration.ENROLLED_to_CANCELLED
          - state_machines.Classroom.FULL_to_ACCEPTING
          - state_machines.Registration.WAITLISTED_to_OFFERED
          - calculations.waitlist_position_ordering
        distinguishing_aspect: |
          Depth-3 chain triggered by a cancellation: reg cancel -> enrolled_count
          drops (hop 1) -> classroom flips FULL -> ACCEPTING because open_seats
          rose (hop 2, caused by hop 1) -> promotion loop offers the waitlist head
          with a TTL expiry (hop 3, caused by hop 2) -> remaining positions
          recompute. Trigger differs from the screening-decision cascade instance.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 2) FULL: A, B ENROLLED; C, D WAITLISTED (positions 1, 2)"
            - "Logical clock at the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "D", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kd: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_a: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_b: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_c: $.data.id } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kd}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { reg_d: $.data.id } }
          trigger:
            - { call: "POST /vbs/registrations/${reg_a}/cancel", payload: {}, as: Parent, as_user_id: "${fam_id}", captures: { a_status: $.data.status, a_reason: $.data.cancellation_reason } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_status: $.data.status, k_enr: $.data.enrolled_count, k_off: $.data.offered_count } }
            - { call: "GET /vbs/registrations/${reg_c}", payload: {}, as: RegistrationCoordinator, captures: { c_status: $.data.status, c_exp: $.data.offer_expires_at } }
            - { call: "GET /vbs/registrations/${reg_d}", payload: {}, as: RegistrationCoordinator, captures: { d_status: $.data.status, d_pos: $.data.waitlist_position } }
          assert:
            - "${a_status} == CANCELLED and ${a_reason} == FAMILY_REQUEST"
            - "${k_status} == ACCEPTING and ${k_enr} == 1  (hop 1+2: seat freed, FULL flipped back)"
            - "${k_off} == 1 and ${c_status} == OFFERED and ${c_exp} == 2026-08-03T00:00:00Z  (hop 3: head promoted with TTL)"
            - "${d_status} == WAITLISTED and ${d_pos} == 1  (hop 4: positions recomputed)"
      - name: screening_clearance_auto_confirms_assignment
        grounds:
          - state_machines.ScreeningCheck.SUBMITTED_to_CLEARED
          - state_machines.Volunteer.SCREENING_to_CLEARED
          - state_machines.RoleAssignment.PROPOSED_to_CONFIRMED
          - calculations.required_adults_and_staffing
        distinguishing_aspect: |
          Depth-4 chain triggered by a screening decision (different trigger from
          the cancellation cascade): check CLEARED -> volunteer SCREENING ->
          CLEARED because all three types are now cleared (hop 2, caused by hop 1)
          -> the volunteer's PROPOSED assignment auto-confirms (hop 3) ->
          classroom confirmed_adult_count rises and staffing_status recomputes
          (hop 4). Mid-chain, at 2 of 3 checks cleared, none of hops 2-4 fire.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 10) with 1 enrolled child (required_adults == 2)"
            - "Volunteer v1 with PROPOSED LEAD_TEACHER assignment asg1; BACKGROUND and REFERENCE checks already CLEARED; SAFE_MINISTRY_TRAINING still SUBMITTED"
