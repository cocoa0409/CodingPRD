    output: EnhancedVoucher
    roles: [PhaAdministrator]
    side_effects:
      - "Sets state = ISSUED, issuing_pha_user_id = X-User-ID, issued_on_date = clock date."
      - "Sets TenantHousehold.status = EV_ISSUED and increments the household's version by 1."
      - "Decrements Property.units_under_hap_count by 1, increments Property.enhanced_voucher_unit_count by 1 and increments Property.version by 1, holding calculations.assisted_unit_conservation."
  - method: POST
    path: /pbra/enhanced-vouchers/{id}/rescind
    purpose: "Compensating transition: withdraw an issued enhanced voucher and return the household to project-based assistance."
    input: [reason]
    output: EnhancedVoucher
    roles: [PhaAdministrator]
    side_effects:
      - "Sets state = RESCINDED."
      - "Sets TenantHousehold.status back to OPT_OUT_NOTICED and increments the household's version by 1."
      - "Increments Property.units_under_hap_count by 1, decrements Property.enhanced_voucher_unit_count by 1 and increments Property.version by 1, restoring all three counters to their pre-issue values."

  # ---- monthly voucher submissions --------------------------------------
  - method: POST
    path: /pbra/voucher-submissions
    purpose: "Open the monthly HAP voucher for one closed period, aggregating the governing certification of every assisted household."
    input: [contract_id, period_month, expected_contract_version]
    output: VoucherSubmission
    roles: [OwnerAgent]
    side_effects:
      - "Creates VoucherSubmission in state DRAFT with requested_hap_cents and included_certification_count per calculations.monthly_voucher_hap_request, paid_amount_cents = null."
      - "Increments HapContract.version by 1 (optimistic concurrency guard on the contract's rent and ledger)."
  - method: GET
    path: /pbra/voucher-submissions/{id}
    purpose: "Read one voucher submission."
    input: []
    output: VoucherSubmission
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice]
    side_effects: []
  - method: POST
    path: /pbra/voucher-submissions/{id}/submit
    purpose: "Submit the monthly voucher for payment once the period has fully elapsed."
    input: []
    output: VoucherSubmission
    roles: [OwnerAgent]
    side_effects:
      - "Recomputes requested_hap_cents and included_certification_count per calculations.monthly_voucher_hap_request against the certifications in force at submission time."
      - "Sets state = SUBMITTED."
  - method: POST
    path: /pbra/voucher-submissions/{id}/pay
    purpose: "Disburse the monthly voucher against the contract's HAP authorization."
    input: []
    output: VoucherSubmission
    roles: [ContractAdministrator]
    side_effects:
      - "Sets state = PAID, paid_amount_cents = requested_hap_cents, paid_on_date = clock date."
      - "Adds paid_amount_cents to HapContract.paid_hap_total_cents, subtracts it from HapContract.hap_ledger_balance_cents and increments the contract's version by 1."
  - method: POST
    path: /pbra/voucher-submissions/{id}/reverse
    purpose: "Compensating transition: reverse a paid voucher and restore the HAP ledger exactly."
    input: [reason]
    output: VoucherSubmission
    roles: [ContractAdministrator]
    side_effects:
      - "Sets state = REVERSED and reversal_reason = reason; paid_amount_cents is retained for audit but stops counting toward the ledger."
      - "Subtracts the retained paid_amount_cents from HapContract.paid_hap_total_cents, adds it back to HapContract.hap_ledger_balance_cents and increments the contract's version by 1, restoring calculations.hap_budget_conservation to its pre-payment figures."

  # ---- special claims ---------------------------------------------------
  - method: POST
    path: /pbra/special-claims
    purpose: "File a vacancy, unpaid-rent or tenant-damages special claim against the contract."
    input: [contract_id, claim_type, unit_number, claim_period_month, "vacancy_start_date?", "vacancy_end_date?", "estimated_vacancy_days?", "claimed_amount_cents?", "security_deposit_balance_cents?"]
    output: SpecialClaim
    roles: [OwnerAgent]
    side_effects:
      - "Creates SpecialClaim in state DRAFT with vacancy_days_claimed, valuation_variant and computed_amount_cents per calculations.special_claim_amount and paid_amount_cents = null."
  - method: GET
    path: /pbra/special-claims/{id}
    purpose: "Read one special claim, including its selected valuation variant."
    input: []
    output: SpecialClaim
    roles: [OwnerAgent, ContractAdministrator, HudFieldOffice]
    side_effects: []
  - method: POST
    path: /pbra/special-claims/{id}/submit
    purpose: "Submit the claim for review, re-running the valuation and enforcing the per-unit 60-day vacancy cap."
    input: []
    output: SpecialClaim
    roles: [OwnerAgent]
    side_effects:
      - "Recomputes vacancy_days_claimed, valuation_variant and computed_amount_cents per calculations.special_claim_amount against the contract's in-force per-unit rent."
      - "Sets state = SUBMITTED."
  - method: POST
    path: /pbra/special-claims/{id}/decide
    purpose: "Approve or deny a submitted claim (decision is APPROVE or DENY)."
    input: [decision, "reason?"]
    output: SpecialClaim
    roles: [ContractAdministrator]
    side_effects:
      - "Sets state = APPROVED when decision is APPROVE and DENIED when decision is DENY, and sets decision_reason = reason."
  - method: POST
    path: /pbra/special-claims/{id}/pay
    purpose: "Disburse an approved claim, but only after the voucher covering its claim period has been paid."
    input: []
    output: SpecialClaim
    roles: [ContractAdministrator]
    side_effects:
      - "Sets state = PAID and paid_amount_cents = computed_amount_cents."
      - "Adds paid_amount_cents to HapContract.paid_claims_total_cents, subtracts it from HapContract.hap_ledger_balance_cents and increments the contract's version by 1."

errors:
  # ---- authentication and authorization ---------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of OwnerAgent, ContractAdministrator, HudFieldOffice, PhaAdministrator."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles (e.g. an OwnerAgent calling POST /pbra/renewal-cases/{id}/approve-rents)."
  - id: ERR_NOT_PROPERTY_OWNER
    http: 403
    condition: "An OwnerAgent whose X-User-ID is not the Owner.id of the resource's property chain attempts a write on it."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ContractAdministrator calling approve-rents is the same X-User-ID recorded in RenewalCase.challenge_reviewer_user_id."
  - id: ERR_UA_CHANGE_REQUIRES_FIELD_OFFICE
    http: 403
    condition: "A ContractAdministrator decides a UtilityAllowanceAnalysis whose requires_field_office_approval is true; only HudFieldOffice may."
  # ---- not found ---------------------------------------------------------
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "owner_id in the path or body names no Owner."
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id in the path or body names no Property."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id in the path or body names no HapContract."
  - id: ERR_RENEWAL_CASE_NOT_FOUND
    http: 404
    condition: "renewal_case_id in the path or body names no RenewalCase."
  - id: ERR_STUDY_NOT_FOUND
    http: 404
    condition: "A study id in the path, in study_id, or in supersedes_study_id names no RentComparabilityStudy."
  - id: ERR_COMPARABLE_NOT_FOUND
    http: 404
    condition: "An id in struck_comparable_ids names no Comparable, or names a Comparable belonging to another study."
  - id: ERR_UA_ANALYSIS_NOT_FOUND
    http: 404
    condition: "The path id names no UtilityAllowanceAnalysis."
  - id: ERR_TENANT_NOT_FOUND
    http: 404
    condition: "tenant_id in the path or body names no TenantHousehold."
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "The path id names no TenantCertification."
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "The path id names no TenantNotice."
  - id: ERR_DETERMINATION_NOT_FOUND
    http: 404
    condition: "The path id names no RestructuringDetermination."
  - id: ERR_ENHANCED_VOUCHER_NOT_FOUND
    http: 404
    condition: "The path id names no EnhancedVoucher."
  - id: ERR_VOUCHER_SUBMISSION_NOT_FOUND
    http: 404
    condition: "The path id names no VoucherSubmission."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "The path id names no SpecialClaim."
  # ---- request shape ----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, a type is wrong, an enum member is unknown, a date is not ISO YYYY-MM-DD, period_month is not YYYY-MM, a method-specific field pairing is violated (FACTOR_BASED without utility_rate_change_pct, ENGINEERING_BASED without engineering_estimate_cents), cert_type is UA_ADJUSTMENT on a client write, or move_out_date precedes the household's ACTIVE certification effective_date."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative on a list endpoint."
  - id: ERR_DUPLICATE_TIN
    http: 409
    condition: "An Owner with the supplied tin already exists."
  - id: ERR_DUPLICATE_UNIT_NUMBER
    http: 409
    condition: "The property already has a TenantHousehold with this unit_number whose status is not MOVED_OUT."
  # ---- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_TENANT_VERSION
    http: 412
    condition: "expected_tenant_version does not equal the current TenantHousehold.version on POST /pbra/tenant-certifications."
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the current HapContract.version on POST /pbra/voucher-submissions or POST /pbra/renewal-cases/{id}/execute-renewal."
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version does not equal the current Property.version on POST /pbra/utility-allowance-analyses/{id}/apply."
  # ---- state and lifecycle ----------------------------------------------
  - id: ERR_TRANSITION_NOT_ALLOWED
    http: 409
    condition: "The requested trigger is not declared from the resource's current state, including a repeat of a trigger already applied, a trigger on a terminal state, an execute-renewal while notice_track_status is not RENEWAL_NOTICED, a comparable added to a study that has left DRAFT, and a supersedes_study_id naming a study that is not REJECTED or belongs to another case."
  - id: ERR_OPEN_RENEWAL_CASE_EXISTS
    http: 409
    condition: "The contract already has a RenewalCase whose rent_track_status is not EXECUTED."
  - id: ERR_MAX_CHALLENGE_ROUNDS
    http: 409
    condition: "A fourth challenge is attempted on a study whose challenge_round already equals MAX_CHALLENGE_ROUNDS (3)."
  - id: ERR_UA_ANALYSIS_IN_FLIGHT
    http: 409
    condition: "Another UtilityAllowanceAnalysis on the same property is already SUBMITTED or APPROVED."
  - id: ERR_DUPLICATE_VOUCHER_PERIOD
    http: 409
    condition: "A VoucherSubmission whose state is not REVERSED already exists for this contract_id and period_month."
  - id: ERR_RCS_NOT_ACCEPTED
    http: 409
    condition: "approve-rents is called on a case with rcs_required true and no RentComparabilityStudy in state ACCEPTED."
  - id: ERR_COVERING_VOUCHER_NOT_PAID
    http: 409
    condition: "A SpecialClaim is paid while the VoucherSubmission for the same contract and claim_period_month is absent or not PAID."
  - id: ERR_CLAIM_PAID_BLOCKS_REVERSAL
    http: 409
    condition: "A voucher reversal is attempted while a SpecialClaim for the same period_month is already PAID."
  - id: ERR_ENHANCED_VOUCHER_ISSUED_BLOCKS_RESCIND
    http: 409
    condition: "The one-year opt-out notice is rescinded while at least one EnhancedVoucher on the case is already ISSUED."
  # ---- election and eligibility -----------------------------------------
  - id: ERR_OPTION_NOT_PERMITTED_FOR_TYPE
    http: 422
    condition: "renewal_option is not in OPTION_TYPE_MATRIX[HapContract.contract_type]."
  - id: ERR_ADJUSTMENT_METHOD_CONFLICT
    http: 422
    condition: "BUDGET_BASED is elected on a case whose renewal_option is OPTION_1_MARK_UP_TO_MARKET, which admits OCAF only."
  - id: ERR_MUTM_OPTION_MISMATCH
    http: 422
    condition: "The determination branch being approved does not match RenewalCase.renewal_option (MUTM_ELIGIBLE needs OPTION_1_MARK_UP_TO_MARKET, M2M_REFERRED needs OPTION_3_MARK_TO_MARKET)."
  # ---- temporal ---------------------------------------------------------
  - id: ERR_OUTSIDE_RENEWAL_WINDOW
    http: 422
    condition: "Whole days from the clock date to HapContract.expiration_date is not in 1..RENEWAL_WINDOW_DAYS (420)."
  - id: ERR_NOTICE_WINDOW_NOT_MET
    http: 422
    condition: "The notice's lead_days is below NOTICE_LEAD_DAYS[notice_type]."
  - id: ERR_OPT_OUT_NOTICE_PERIOD_INCOMPLETE
    http: 422
    condition: "finalize-opt-out is called before the clock date reaches the effective_date of the case's one-year opt-out notice."
  - id: ERR_UA_INTERVAL_OVERLAP
    http: 409
    condition: "The analysis effective_date falls inside the 12-month coverage interval opened by Property.last_applied_ua_effective_date."
  - id: ERR_CERT_INTERVAL_CONFLICT
    http: 409
    condition: "The new certification's effective_date is not strictly more than CERT_BUFFER_DAYS (30) days after the household's ACTIVE certification effective_date."
  - id: ERR_PERIOD_NOT_ELAPSED
    http: 422
    condition: "A voucher is submitted before the first day of the month following its period_month."
  # ---- referential and aggregate ---------------------------------------
  - id: ERR_OPT_OUT_NOTICE_MISSING
    http: 422
    condition: "record-opt-out is called on a case with no ISSUED OPT_OUT_ONE_YEAR notice."
  - id: ERR_NO_ELIGIBLE_COMPARABLES
    http: 422
    condition: "A study is submitted while its accepted_comparable_count is 0 (every comparable struck, or none ever added)."
  - id: ERR_TENANT_VOUCHER_UNRESOLVED
    http: 422
    condition: "finalize-opt-out is called while a household of the property still has status OPT_OUT_NOTICED without an ISSUED EnhancedVoucher."
  - id: ERR_VACANCY_DAYS_CAP_EXCEEDED
    http: 422
    condition: "The claim's vacancy_days_claimed plus the already-claimed vacancy days for the same contract and unit_number exceeds VACANCY_DAY_CAP (60)."
  # ---- fiscal -----------------------------------------------------------
  - id: ERR_RENT_EXCEEDS_COMPARABLE
    http: 422
    condition: "The OCAF-track renewal rent exceeds RenewalCase.comparable_market_rent_cents on a case that requires a study."
  - id: ERR_BUDGET_RENT_EXCEEDS_CAP
    http: 422
    condition: "The budget-based renewal rent exceeds 110 percent of RenewalCase.comparable_market_rent_cents."
  - id: ERR_NO_ENHANCEMENT_ENTITLEMENT
    http: 422
    condition: "An EnhancedVoucher whose entitlement_cents is 0 is issued."
  - id: ERR_ZERO_VOUCHER_REQUEST
    http: 422
    condition: "A VoucherSubmission whose requested_hap_cents is 0 is submitted."
  - id: ERR_ZERO_CLAIM_AMOUNT
    http: 422
    condition: "A SpecialClaim whose computed_amount_cents is 0 (fully offset by the security deposit, or a zero-day vacancy) is submitted."
  - id: ERR_HAP_BUDGET_EXCEEDED
    http: 402
    condition: "The disbursement exceeds HapContract.hap_ledger_balance_cents on voucher payment or claim payment."

roles:
  - name: OwnerAgent
    description: "Assisted-housing owner or management agent: opens renewal cases, elects the renewal option and adjustment method, commissions rent comparability studies and utility allowance analyses, issues tenant notices, certifies households, files monthly vouchers and special claims."
    identity: "entity_backed:Owner"
    exclusive_operations: [create property, open renewal case, select renewal option, elect adjustment method, create rent comparability study, add comparable, submit study, create utility allowance analysis, submit analysis, create tenant household, record move-out, create tenant certification, issue tenant notice, rescind tenant notice, record opt-out, create voucher submission, submit voucher submission, create special claim, submit special claim]
    shared_operations: [set logical clock, read owners, read properties, read contracts, read renewal cases, read studies and comparables, read analyses, read households and certifications, read notices, read enhanced vouchers, read voucher submissions, read special claims, read reconciliation]
  - name: ContractAdministrator
    description: "Performance-based contract administrator acting for HUD: reviews and challenges comparability studies, approves renewal rents, executes renewals, finalizes opt-outs, applies approved utility allowances, and disburses vouchers and claims."
    identity: opaque
    exclusive_operations: [create owner, create hap contract, challenge study, decide study, approve renewal rents, execute renewal, finalize opt-out, apply utility allowance analysis, create restructuring determination, evaluate restructuring determination, pay voucher submission, reverse voucher submission, decide special claim, pay special claim]
    shared_operations: [set logical clock, decide utility allowance analysis, read owners, read properties, read contracts, read renewal cases, read studies and comparables, read analyses, read households and certifications, read notices, read enhanced vouchers, read voucher submissions, read special claims, read reconciliation]
  - name: HudFieldOffice
    description: "HUD field office: sole approver of utility allowance changes above the 10 percent threshold and of mark-up-to-market or mark-to-market restructuring determinations."
    identity: opaque
    exclusive_operations: [approve restructuring determination, decide utility allowance analysis whose requires_field_office_approval is true]
    shared_operations: [set logical clock, create owner, decide utility allowance analysis, read owners, read properties, read contracts, read renewal cases, read studies and comparables, read analyses, read households and certifications, read notices, read enhanced vouchers, read voucher submissions, read special claims, read reconciliation]
  - name: PhaAdministrator
    description: "Public housing agency administering tenant-based assistance: issues and rescinds the enhanced vouchers minted for households in an opting-out property."
    identity: opaque
    exclusive_operations: [issue enhanced voucher, rescind enhanced voucher]
    shared_operations: [set logical clock, read owners, read properties, read contracts, read renewal cases, read studies and comparables, read analyses, read households and certifications, read notices, read enhanced vouchers]
