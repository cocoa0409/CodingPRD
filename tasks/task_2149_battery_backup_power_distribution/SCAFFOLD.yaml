scenario: "desgin task harder than expert level.!!!!2149. Battery & Backup-Power Distribution (Interstate Batteries distributor): battery chemistry & runtime sizing, core exchange & lead recycling credit, hazmat shipping classification & carrier rules, shelf life/state-of-charge & refresh charging, warranty pro-rata by installation date, UPS service contract attach, emergency/storm-demand allocation, disposal & regulatory reporting"
domain_name: battery-backup-distribution
api_prefix: /distribution

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Peer entities linked by explicit foreign keys plus a self-referential
  # supersession edge (BatteryModel.replacement_model_id -> BatteryModel.id) and
  # cross-aggregate edges (CoreReturn -> DisposalManifest, InventoryLot ->
  # DisposalManifest, WarrantyClaim -> Order). Only OrderLine is created through
  # a nested path; every other entity is addressed flat.

  state_machine_shape: parallel
  # Order carries two independent state dimensions (fulfillment_status ×
  # credit_status). CoreReturn and DisposalManifest are cyclic. Shipment and
  # WarrantyClaim are branching fork machines with divergent side-effect sets.
  # InventoryLot.condition_state is a derived (compound) machine recomputed from
  # the logical clock on every read and every write.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The HazmatCertifier who certifies a Shipment must not be the operator who
  # packed it; the ComplianceOfficer who files a DisposalManifest must not be the
  # officer who created it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 58 endpoints / 52 error codes / 15 calculations (3 carrying
  # divergent variants) / 9 state-machine dimensions across 8 entities /
  # 3 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the dealer / fleet account."
      - name: account_tier
        type: enum
        source: input
        description: "Commercial tier driving the base line discount and the storm priority points."
        constraints: "one of {PLATINUM, GOLD, STANDARD}"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code of the account's ship-to region; matched against StormEvent.region_state_code."
        constraints: "exactly 2 uppercase letters"
      - name: storm_priority_rank
        type: integer
        source: input
        default: 9
        description: "Contractual storm-callout rank; 1 is the highest priority. Feeds RANK_POINTS in allocation_priority_score."
        constraints: "integer 1..9 inclusive"
      - name: credit_limit_cents
        type: integer
        source: input
        default: 0
        description: "Maximum open receivable the account may carry."
        constraints: ">= 0"
      - name: open_receivable_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of total_cents over this account's Orders whose fulfillment_status IN {SUBMITTED, ALLOCATED, SHIPPED, DELIVERED}. Debited on submit, credited back on cancel."
      - name: core_deposit_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Outstanding core-deposit liability booked when Orders reach DELIVERED and released when CoreReturns reach CREDITED."
      - name: warranty_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Accumulated warranty credit available to offset open_receivable_cents in the credit-limit check."
      - name: lifetime_lead_recovered_kg
        type: number
        source: computed
        default: 0.0
        description: "Cumulative lead mass credited back to this account through CREDITED CoreReturns; 3 decimal places."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE permits order submission; CREDIT_HOLD blocks it and forces every SUBMITTED/ALLOCATED order's credit_status to HELD."
        constraints: "one of {ACTIVE, CREDIT_HOLD}"

  - name: BatteryModel
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Catalog SKU; unique across BatteryModel rows regardless of status."
        constraints: "unique, non-empty"
      - name: chemistry
        type: enum
        source: input
        description: "Cell chemistry; drives depth-of-discharge limit, hazmat classification and service multiplier."
        constraints: "one of {FLOODED_LEAD_ACID, AGM, GEL, LITHIUM_IRON_PHOSPHATE, NICKEL_CADMIUM}"
      - name: nominal_voltage
        type: number
        source: input
        description: "Nominal terminal voltage of one unit, in volts."
        constraints: "> 0"
      - name: amp_hour_capacity
        type: number
        source: input
        description: "Rated capacity in amp-hours at the 20-hour rate."
        constraints: "> 0"
      - name: peukert_exponent
        type: number
        source: input
        description: "Peukert exponent used by runtime_sizing; higher means worse high-rate behaviour."
        constraints: ">= 1.0 and <= 1.5"
      - name: unit_weight_kg
        type: number
        source: input
        description: "Shipping weight of one unit in kilograms; drives hazmat package_count and the per-10 kg fee."
        constraints: "> 0"
      - name: lead_content_kg
        type: number
        source: input
        description: "Recoverable lead mass per unit in kilograms; 0.0 for lithium chemistries."
        constraints: ">= 0"
      - name: core_deposit_cents
        type: integer
        source: input
        description: "Core deposit charged per unit shipped without an immediate core exchange."
        constraints: ">= 0"
      - name: list_price_cents
        type: integer
        source: input
        description: "Undiscounted per-unit list price."
        constraints: "> 0"
      - name: warranty_free_replacement_months
        type: integer
        source: input
        description: "Length of the free-replacement band measured from installed_on."
        constraints: ">= 0"
      - name: warranty_prorata_months
        type: integer
        source: input
        description: "Length of the pro-rata band that follows the free-replacement band; also the pro-rata denominator."
        constraints: ">= 1"
      - name: shelf_life_days
        type: integer
        source: input
        description: "Maximum age in days from manufactured_on before a lot is forced to SHELF_EXPIRED."
        constraints: ">= 1"
      - name: self_discharge_pct_per_month
        type: number
        source: input
        description: "Percentage points of state of charge lost per stored 30-day month."
        constraints: "> 0"
      - name: watt_hour_rating
        type: number
        source: computed
        description: "round(nominal_voltage * amp_hour_capacity, 2). Used for the lithium Section II / Section IA split and the carrier per-package watt-hour cap."
      - name: hazmat_class_code
        type: enum
        source: computed
        description: "Shipping classification derived from chemistry, unit_weight_kg and watt_hour_rating."
        constraints: "one of {NON_REGULATED, UN2800_EXCEPTED, UN2795, UN2800, UN2794, UN3480_SECTION_II, UN3480_SECTION_IA}"
      - name: hazmat_severity_rank
        type: integer
        source: computed
        description: "HAZMAT_SEVERITY_RANK[hazmat_class_code]; the shipment class is the maximum rank over its lines."
      - name: replacement_model_id
        type: string
        source: system
        default: null
        description: "FK -> BatteryModel.id; self-referential supersession pointer set by the discontinue action. Null while status is ACTIVE."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE models may be ordered; DISCONTINUED models may not appear on a new OrderLine."
        constraints: "one of {ACTIVE, DISCONTINUED}"

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Warehouse short code; unique."
        constraints: "unique, non-empty"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code; matched against StormEvent.region_state_code for the storm reserve carve-out."
        constraints: "exactly 2 uppercase letters"
      - name: hazmat_endorsement
        type: boolean
        source: input
        default: false
        description: "True when the site holds a hazmat packaging endorsement; enables certification of shipments whose class is not NON_REGULATED and applies HAZMAT_ENDORSED_DISCOUNT to the surcharge."
      - name: storm_reserve_pct
        type: number
        source: input
        default: 0.0
        description: "Fraction of each lot's quantity_on_hand carved out for storm orders while a StormEvent with status IN {DECLARED, ALLOCATING} exists in this warehouse's state_code."
        constraints: ">= 0.0 and <= 0.5"
      - name: dock_capacity_kg_per_window
        type: number
        source: input
        description: "Maximum aggregate shipment weight this site may tender across any set of pickup windows that mutually overlap on closed intervals."
        constraints: "> 0"

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Carrier short code; unique."
        constraints: "unique, non-empty"
      - name: name
        type: string
        source: input
        description: "Carrier display name."
      - name: accepts_hazmat_classes
        type: array
        source: input
        description: "Explicit list of hazmat_class_code values this carrier tenders. A shipment whose class is absent is refused."
        constraints: "each element one of {NON_REGULATED, UN2800_EXCEPTED, UN2795, UN2800, UN2794, UN3480_SECTION_II, UN3480_SECTION_IA}"
      - name: max_lithium_watt_hours_per_package
        type: number
        source: input
        description: "Per-package watt-hour ceiling applied to lithium models on this carrier."
        constraints: ">= 0"
      - name: ground_only
        type: boolean
        source: input
        default: true
        description: "False means the carrier moves freight by air, which prohibits UN3480_SECTION_IA tenders."

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: battery_model_id
        type: string
        source: input
        description: "FK -> BatteryModel.id; the model stocked in this lot."
      - name: warehouse_id
        type: string
        source: input
        description: "FK -> Warehouse.id; the site holding this lot."
      - name: manufactured_on
        type: string
        source: input
        description: "Manufacturing date, ISO 8601 calendar date (YYYY-MM-DD). Baseline for shelf life and, until the first refresh charge, for state of charge."
      - name: quantity_on_hand
        type: integer
        source: input
        description: "Physical units held. Never changed by allocation or cancellation; only scrapping consumes it."
        constraints: ">= 0"
      - name: quantity_reserved
        type: integer
        source: computed
        default: 0
        description: "Units committed to OrderLines whose Order.fulfillment_status IN {ALLOCATED, SHIPPED}. Released on cancel and on delivery."
      - name: quantity_available
        type: integer
        source: computed
        default: 0
        description: "quantity_on_hand - quantity_reserved, further reduced by the storm carve-out for non-storm allocation."
      - name: last_refresh_charged_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp of the most recent refresh charge; resets the state-of-charge baseline."
      - name: refresh_charge_count
        type: integer
        source: system
        default: 0
        description: "Number of refresh charges applied; capped by MAX_REFRESH_CYCLES."
      - name: last_measured_open_circuit_voltage
        type: number
        source: system
        default: null
        description: "Open-circuit voltage recorded by the operator at the last refresh charge."
      - name: state_of_charge_pct
        type: number
        source: computed
        description: "Derived from the storage baseline, the model's self_discharge_pct_per_month and the logical clock; 1 decimal place."
      - name: condition_state
        type: enum
        source: computed
        description: "Derived lot posture recomputed on every read and every write; gates allocation."
        constraints: "one of {SELLABLE, REFRESH_REQUIRED, SHELF_EXPIRED, SCRAPPED}"
      - name: scrap_manifest_id
        type: string
        source: system
        default: null
        description: "FK -> DisposalManifest.id; set when the lot is scrapped onto a DRAFT manifest. Non-null forces condition_state to SCRAPPED."

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the buying account."
      - name: warehouse_id
        type: string
        source: input
        description: "FK -> Warehouse.id; the shipping site whose lots may satisfy this order."
      - name: storm_event_id
        type: string
        source: input
        default: null
        description: "FK -> StormEvent.id; non-null marks this order as an emergency draw against that event's allocation pool."
      - name: requested_ship_date
        type: string
        source: input
        description: "Requested ship date, ISO 8601 calendar date (YYYY-MM-DD)."
      - name: fulfillment_status
        type: enum
        source: system
        default: DRAFT
        description: "First of two independent state dimensions on this row."
        constraints: "one of {DRAFT, SUBMITTED, ALLOCATED, SHIPPED, DELIVERED, CANCELLED}"
      - name: credit_status
        type: enum
        source: system
        default: PENDING
        description: "Second, independent state dimension. ALLOCATED requires credit_status == CLEARED."
        constraints: "one of {PENDING, CLEARED, HELD, CLOSED}"
      - name: hazmat_hold
        type: boolean
        source: system
        default: false
        description: "Set true when a Shipment for this order is certified with decision REJECT; blocks dispatch of any later shipment on the same carrier_id."
      - name: rejected_carrier_ids
        type: array
        source: system
        default: []
        description: "Carrier ids that have refused this order at certification; a later shipment on a listed carrier cannot be dispatched."
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Number of OrderLine rows attached to this order."
      - name: subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of the per-line rounded line_total_cents; computed at submit, frozen thereafter."
      - name: core_deposit_charge_cents
        type: integer
        source: computed
        default: 0
        description: "Deposit charged at submit for units shipped without an immediate core exchange."
      - name: hazmat_fee_waived
        type: boolean
        source: computed
        default: false
        description: "True when subtotal_cents >= HAZMAT_FEE_WAIVER_SUBTOTAL_CENTS. Decided at submit against subtotal_cents only and never re-decided."
      - name: hazmat_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Order-level hazmat charge. Holds the order_forecast variant from submit until a Shipment is certified, then the shipment_actual variant."
      - name: service_contract_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Prepaid UPS service-contract fee booked onto the order when a ServiceContract is attached."
      - name: total_cents
        type: integer
        source: computed
        default: 0
        description: "subtotal_cents + core_deposit_charge_cents + hazmat_fee_cents + service_contract_fee_cents."
      - name: allocation_priority_score
        type: integer
        source: computed
        default: 0
        description: "Storm priority score computed at allocate time for storm orders; 0 for non-storm orders."
      - name: cancellation_reason
        type: string
        source: input
        default: null
        description: "Free text captured by the cancel action."

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; supplied by the nested creation path."
      - name: battery_model_id
        type: string
        source: input
        description: "FK -> BatteryModel.id; the model being purchased."
      - name: quantity
        type: integer
        source: input
        description: "Units ordered on this line."
        constraints: ">= 1"
      - name: core_expected_count
        type: integer
        source: input
        default: 0
        description: "Units for which the buyer promises to return a core; the remainder is charged a deposit at submit."
        constraints: ">= 0 and <= quantity"
      - name: unit_price_cents
        type: integer
        source: computed
        default: 0
        description: "Snapshot of BatteryModel.list_price_cents taken at submit."
      - name: discount_pct
        type: number
        source: computed
        default: 0.0
        description: "min(ACCOUNT_TIER_DISCOUNT[tier] + VOLUME_DISCOUNT(quantity), MAX_DISCOUNT_PCT); 4 decimal places."
      - name: line_total_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(unit_price_cents * quantity * (1 - discount_pct)); rounded on this line before any summation."
      - name: allocated_quantity
        type: integer
        source: computed
        default: 0
        description: "Units reserved from allocated_lot_id; equals quantity once the order is ALLOCATED, 0 otherwise."
      - name: allocated_lot_id
        type: string
        source: system
        default: null
        description: "FK -> InventoryLot.id; the lot chosen by the allocation selector policy."
      - name: core_due_by
        type: string
        source: system
        default: null
        description: "Calendar date by which the promised cores must be submitted; set at delivery to delivery date + CORE_RETURN_WINDOW_DAYS."

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being tendered."
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the tendering carrier."
      - name: pickup_window_start
        type: datetime
        source: input
        description: "Inclusive start of the dock pickup window, ISO 8601 UTC."
      - name: pickup_window_end
        type: datetime
        source: input
        description: "End of the dock pickup window, ISO 8601 UTC. Exclusive on the carrier axis, inclusive on the warehouse-capacity axis."
      - name: packed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the WarehouseOperator who created the shipment."
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the HazmatCertifier who certified the shipment; must differ from packed_by_user_id."
      - name: status
        type: enum
        source: system
        default: PACKED
        description: "Shipment lifecycle."
        constraints: "one of {PACKED, CERTIFIED, HAZMAT_REJECTED, DISPATCHED, DELIVERED, VOIDED}"
      - name: hazmat_class_code
        type: enum
        source: computed
        description: "Maximum hazmat_severity_rank over the order's lines' models, resolved back to its class code. Computed when the shipment row is created."
        constraints: "one of {NON_REGULATED, UN2800_EXCEPTED, UN2795, UN2800, UN2794, UN3480_SECTION_II, UN3480_SECTION_IA}"
      - name: total_weight_kg
        type: number
        source: computed
        default: 0.0
        description: "round(sum over order lines of quantity * unit_weight_kg, 3)."
      - name: total_lead_kg
        type: number
        source: computed
        default: 0.0
        description: "round(sum over order lines of quantity * lead_content_kg, 3)."
      - name: package_count
        type: integer
        source: computed
        default: 0
        description: "ceil(total_weight_kg / HAZMAT_MAX_PACKAGE_KG); the shipment_actual variant charges the base fee once per package."
      - name: hazmat_surcharge_cents
        type: integer
        source: computed
        default: 0
        description: "shipment_actual variant of the hazmat surcharge; replaces Order.hazmat_fee_cents at certification unless the order's fee is waived."
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: "Free text recorded when certification_decision is REJECT."
      - name: dispatched_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp at dispatch."
      - name: delivered_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp at delivery; baseline for the core-return window."

  - name: CoreReturn
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the returning account."
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the delivered order the cores came from."
      - name: battery_model_id
        type: string
        source: input
        description: "FK -> BatteryModel.id; cores of exactly one model per return."
      - name: declared_core_count
        type: integer
        source: input
        description: "Cores the account claims to be returning."
        constraints: ">= 1"
      - name: accepted_core_count
        type: integer
        source: system
        default: 0
        description: "Cores accepted at the most recent inspection round."
      - name: inspection_round
        type: integer
        source: system
        default: 0
        description: "Number of completed inspections; capped by MAX_INSPECTION_ROUNDS."
      - name: late_return
        type: boolean
        source: computed
        default: false
        description: "True when the submission date is strictly after the source order's earliest core_due_by."
      - name: provisional_credit_cents
        type: integer
        source: computed
        default: 0
        description: "declared_provisional variant of core_exchange_credit, computed at submission."
      - name: lead_recovered_kg
        type: number
        source: computed
        default: 0.0
        description: "round(accepted_core_count * lead_content_kg * LEAD_RECOVERY_YIELD, 3); computed at each inspection."
      - name: scrap_value_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(lead_recovered_kg * LEAD_PRICE_CENTS_PER_KG); computed at each inspection."
      - name: final_credit_cents
        type: integer
        source: computed
        default: 0
        description: "assayed_final variant of core_exchange_credit, computed when the return is credited."
      - name: dispute_reason
        type: string
        source: input
        default: null
        description: "Free text captured by the dispute action."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Cyclic inspection lifecycle."
        constraints: "one of {SUBMITTED, INSPECTED, DISPUTED, REJECTED, CREDITED}"
      - name: disposal_manifest_id
        type: string
        source: system
        default: null
        description: "FK -> DisposalManifest.id; set when attached to a DRAFT manifest, cleared when that manifest is rejected back to DRAFT."

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the claiming account."
      - name: battery_model_id
        type: string
        source: input
        description: "FK -> BatteryModel.id; the failed model."
      - name: serial_number
        type: string
        source: input
        description: "Unit serial number; unique across WarrantyClaim rows."
        constraints: "unique, non-empty"
      - name: installed_on
        type: string
        source: input
        description: "Installation date, ISO 8601 calendar date (YYYY-MM-DD)."
      - name: failed_on
        type: string
        source: input
        description: "Failure date, ISO 8601 calendar date (YYYY-MM-DD); must be >= installed_on."
      - name: months_in_service
        type: integer
        source: computed
        default: 0
        description: "Whole anniversary months between installed_on and failed_on."
      - name: coverage_band
        type: enum
        source: computed
        description: "Band the claim falls into once adjudicated."
        constraints: "one of {FREE, PRORATA, EXPIRED}"
      - name: credit_cents
        type: integer
        source: computed
        default: 0
        description: "Warranty credit awarded; full list price in the FREE band, pro-rated in the PRORATA band, 0 in EXPIRED."
      - name: settlement_mode
        type: enum
        source: input
        default: null
        description: "Chosen at settlement."
        constraints: "one of {ACCOUNT_CREDIT, REPLACEMENT_ORDER}"
      - name: replacement_order_id
        type: string
        source: system
        default: null
        description: "FK -> Order.id; the DRAFT order synthesized when settlement_mode is REPLACEMENT_ORDER."
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Branching adjudication lifecycle."
        constraints: "one of {SUBMITTED, APPROVED_FREE, APPROVED_PRORATA, DENIED, SETTLED}"

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the covered account."
      - name: order_id
        type: string
        source: system
        default: null
        description: "FK -> Order.id; set when the contract is attached to an order."
      - name: coverage_tier
        type: enum
        source: input
        description: "Service coverage tier driving COVERAGE_RATE and TIER_FLOOR_CENTS."
        constraints: "one of {BRONZE, SILVER, GOLD}"
      - name: load_watts
        type: number
        source: input
        description: "AC load the UPS string must carry."
        constraints: "> 0"
      - name: required_runtime_minutes
        type: integer
        source: input
        description: "Runtime the string must sustain at load_watts."
        constraints: ">= 1"
      - name: system_voltage
        type: number
        source: input
        description: "DC bus voltage of the UPS string."
        constraints: "> 0"
      - name: ambient_temp_c
        type: number
        source: input
        description: "Design ambient temperature in Celsius; selects the temperature derate tier."
      - name: allowed_chemistries
        type: array
        source: input
        description: "Explicit chemistries the customer will accept; the sizing selector's eligibility filter."
        constraints: "non-empty; each element one of {FLOODED_LEAD_ACID, AGM, GEL, LITHIUM_IRON_PHOSPHATE, NICKEL_CADMIUM}"
      - name: dc_load_amps
        type: number
        source: computed
        default: 0.0
        description: "round(load_watts / (system_voltage * INVERTER_EFFICIENCY), 3)."
      - name: required_peukert_ah
        type: number
        source: computed
        default: 0.0
        description: "round(dc_load_amps * (required_runtime_minutes / 60) ** peukert_exponent, 3) for the selected model."
      - name: temp_derate_factor
        type: number
        source: computed
        default: 0.0
        description: "TEMP_DERATE tier selected from ambient_temp_c."
      - name: sized_battery_model_id
        type: string
        source: computed
        default: null
        description: "FK -> BatteryModel.id; the model chosen by the sizing selector policy."
      - name: sized_string_count
        type: integer
        source: computed
        default: 0
        description: "Number of parallel strings: ceil(required_peukert_ah / usable_ah_per_unit)."
      - name: sized_units_per_string
        type: integer
        source: computed
        default: 0
        description: "Units wired in series inside one string: ceil(system_voltage / nominal_voltage)."
      - name: sized_unit_count
        type: integer
        source: computed
        default: 0
        description: "sized_string_count * sized_units_per_string."
      - name: covered_value_cents
        type: integer
        source: computed
        default: 0
        description: "sized_unit_count * list_price_cents of the sized model."
      - name: monthly_fee_cents
        type: integer
        source: computed
        default: 0
        description: "max(TIER_FLOOR_CENTS[coverage_tier], round_half_up(covered_value_cents * COVERAGE_RATE * CHEM_SERVICE_MULT)) with a single terminal rounding."
      - name: prepay_total_cents
        type: integer
        source: computed
        default: 0
        description: "monthly_fee_cents * CONTRACT_PREPAY_MONTHS; the amount booked onto the attached order."
      - name: attached_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp at attachment."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Contract lifecycle; ACTIVE is reached by cascade when the attached order is delivered."
        constraints: "one of {DRAFT, SIZED, ATTACHED, ACTIVE, SUPERSEDED, CANCELLED}"

  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Event name."
      - name: region_state_code
        type: string
        source: input
        description: "Two-letter US state code the event covers."
        constraints: "exactly 2 uppercase letters"
      - name: severity_tier
        type: enum
        source: input
        description: "Severity tier driving SEVERITY_POINTS and SEVERITY_MIN_SCORE."
        constraints: "one of {WATCH, WARNING, EMERGENCY}"
      - name: allocation_pool_units
        type: integer
        source: input
        description: "Total units set aside for this event."
        constraints: ">= 1"
      - name: allocated_units
        type: integer
        source: computed
        default: 0
        description: "Units drawn by ALLOCATED or SHIPPED or DELIVERED storm orders."
      - name: remaining_pool_units
        type: integer
        source: computed
        default: 0
        description: "allocation_pool_units - allocated_units; the conserved quantity of the storm-pool invariant."
      - name: min_priority_score
        type: integer
        source: computed
        default: 0
        description: "SEVERITY_MIN_SCORE[severity_tier]; the allocation gate."
      - name: status
        type: enum
        source: system
        default: DECLARED
        description: "DECLARED carves out warehouse reserve but refuses draws; ALLOCATING permits draws; CLOSED releases the carve-out."
        constraints: "one of {DECLARED, ALLOCATING, CLOSED}"

  - name: DisposalManifest
    parent: null
    common_fields: true
    fields:
      - name: warehouse_id
        type: string
        source: input
        description: "FK -> Warehouse.id; the generator site named on the manifest."
      - name: epa_id
        type: string
        source: input
        description: "EPA generator identifier printed on the manifest."
      - name: reporting_period
        type: string
        source: input
        description: "Regulatory reporting period label, e.g. 2026-Q3."
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who created the manifest."
      - name: filed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ComplianceOfficer who filed the manifest; must differ from created_by_user_id."
      - name: attached_core_return_count
        type: integer
        source: computed
        default: 0
        description: "Number of CoreReturn rows whose disposal_manifest_id equals this manifest."
      - name: scrapped_lot_count
        type: integer
        source: computed
        default: 0
        description: "Number of InventoryLot rows whose scrap_manifest_id equals this manifest."
      - name: core_lead_kg
        type: number
        source: computed
        default: 0.0
        description: "round(sum of lead_recovered_kg over attached CoreReturn rows with status == CREDITED, 3)."
      - name: lot_lead_kg
        type: number
        source: computed
        default: 0.0
        description: "round(sum over scrapped lots of quantity_on_hand * lead_content_kg, 3)."
      - name: total_lead_kg
        type: number
        source: computed
        default: 0.0
        description: "round(core_lead_kg + lot_lead_kg, 3); capped by EPA_MANIFEST_MAX_LEAD_KG."
      - name: rejection_reason
        type: string
        source: input
        default: null
        description: "Free text captured when a SUBMITTED manifest is rejected back to DRAFT."
      - name: filed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock timestamp at filing."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Cyclic filing lifecycle; FILED is terminal."
        constraints: "one of {DRAFT, SUBMITTED, FILED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # ---- Order, dimension 1 of 2: fulfillment_status -------------------------
  - entity: Order
    state_field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    note: |
      Order carries two independent state dimensions on the same row:
      fulfillment_status (this machine) and credit_status (the next machine).
      They advance on different triggers; the only coupling is the
      SUBMITTED -> ALLOCATED precondition credit_status == CLEARED.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /distribution/orders/{orderId}/submit"
        actor: SalesRep | Customer
        preconditions:
          - "order.fulfillment_status == DRAFT"
          - "order.line_count >= 1 (empty-line orders are rejected with ERR_ORDER_HAS_NO_LINES)"
          - "account.status == ACTIVE"
          - "every OrderLine's BatteryModel.status == ACTIVE"
          - "credit check passes: order.total_cents + account.open_receivable_cents - account.warranty_credit_cents <= account.credit_limit_cents"
        side_effects:
          - "runs calculation order_line_pricing over the order's lines in OrderLine.created_at ASC, writing unit_price_cents, discount_pct and line_total_cents on each line"
          - "runs calculation order_total_assembly, writing Order.subtotal_cents, Order.hazmat_fee_waived, Order.hazmat_fee_cents (variant order_forecast), Order.core_deposit_charge_cents and Order.total_cents"
          - "sets Order.credit_status from PENDING to CLEARED (second dimension)"
          - "ledger sync: Account.open_receivable_cents += Order.total_cents"
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "POST /distribution/orders/{orderId}/allocate"
        actor: WarehouseOperator | PlatformAdmin
        preconditions:
          - "order.fulfillment_status == SUBMITTED"
          - "order.credit_status == CLEARED"
          - "if order.storm_event_id is not null: storm_event.status == ALLOCATING, account.state_code == storm_event.region_state_code, order.allocation_priority_score >= storm_event.min_priority_score, and sum of line quantities <= storm_event.remaining_pool_units"
          - "for every OrderLine the lot_allocation_selector returns a lot"
        side_effects:
          - "runs calculation allocation_priority_score and writes Order.allocation_priority_score"
          - "for each OrderLine in OrderLine.created_at ASC: writes allocated_lot_id and allocated_quantity = quantity, and increments the chosen InventoryLot.quantity_reserved by quantity (quantity_available is re-derived)"
          - "if order.storm_event_id is not null: StormEvent.allocated_units += sum of line quantities and StormEvent.remaining_pool_units is re-derived"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "system event: the order's Shipment transitions CERTIFIED -> DISPATCHED"
        actor: system
        preconditions:
          - "order.fulfillment_status == ALLOCATED"
        side_effects:
          - "no ledger movement; Order.version increments by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "system event: the order's Shipment transitions DISPATCHED -> DELIVERED"
        actor: system
        preconditions:
          - "order.fulfillment_status == SHIPPED"
        side_effects:
          - "cascade hop 2 of delivery_cascade: sets Order.credit_status from CLEARED to CLOSED"
          - "for each OrderLine: sets core_due_by = date(shipment.delivered_at) + CORE_RETURN_WINDOW_DAYS days"
          - "for each OrderLine: decrements the allocated InventoryLot.quantity_reserved AND quantity_on_hand by allocated_quantity (units leave the building)"
          - "if a ServiceContract has order_id == this order and status == ATTACHED, it moves to ACTIVE"
          - "cascade hop 3: Account.core_deposit_balance_cents += sum over lines of core_expected_count * BatteryModel.core_deposit_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /distribution/orders/{orderId}/cancel"
        actor: SalesRep | PlatformAdmin | Customer
        preconditions:
          - "order.fulfillment_status == DRAFT"
        side_effects:
          - "sets Order.credit_status to CLOSED; no ledger movement (nothing was booked at DRAFT)"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /distribution/orders/{orderId}/cancel"
        actor: SalesRep | PlatformAdmin | Customer
        preconditions:
          - "order.fulfillment_status == SUBMITTED"
        side_effects:
          - "compensation: Account.open_receivable_cents -= Order.total_cents"
          - "sets Order.credit_status to CLOSED"
          - "any ServiceContract with order_id == this order and status IN {ATTACHED, ACTIVE} moves to CANCELLED"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /distribution/orders/{orderId}/cancel"
        actor: SalesRep | PlatformAdmin | Customer
        preconditions:
          - "order.fulfillment_status == ALLOCATED"
        side_effects:
          - "compensation: Account.open_receivable_cents -= Order.total_cents"
          - "compensation: for each OrderLine with allocated_lot_id not null, decrements that InventoryLot.quantity_reserved by allocated_quantity, then clears allocated_lot_id and sets allocated_quantity = 0"
          - "compensation: if order.storm_event_id is not null, StormEvent.allocated_units -= sum of line quantities and remaining_pool_units is re-derived"
          - "any Shipment with order_id == this order and status IN {PACKED, CERTIFIED} moves to VOIDED, releasing its carrier window and its dock-capacity contribution"
          - "sets Order.credit_status to CLOSED"
          - "any ServiceContract with order_id == this order and status IN {ATTACHED, ACTIVE} moves to CANCELLED"

  # ---- Order, dimension 2 of 2: credit_status ------------------------------
  - entity: Order
    state_field: credit_status
    initial_state: PENDING
    terminal_states: [CLOSED]
    note: "Independent dimension on the same Order row; driven by account-level events, not by fulfillment triggers, except for the two CLOSED edges."
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /distribution/orders/{orderId}/submit"
        actor: SalesRep | Customer
        preconditions:
          - "the fulfillment DRAFT -> SUBMITTED transition succeeded"
        side_effects:
          - "none beyond the fulfillment transition's own effects"
      - from: CLEARED
        to: HELD
        trigger: "system event: Account.status moves ACTIVE -> CREDIT_HOLD (cascade hop 5 of delivery_cascade)"
        actor: system
        preconditions:
          - "order.account_id == the account that entered CREDIT_HOLD"
          - "order.fulfillment_status IN {SUBMITTED, ALLOCATED}"
        side_effects:
          - "the order can no longer be allocated until credit_status returns to CLEARED"
      - from: HELD
        to: CLEARED
        trigger: "system event: Account.status moves CREDIT_HOLD -> ACTIVE (cascade hop 4 of core_credit_cascade)"
        actor: system
        preconditions:
          - "order.account_id == the account that left CREDIT_HOLD"
          - "order.fulfillment_status IN {SUBMITTED, ALLOCATED}"
        side_effects:
          - "allocation becomes possible again"
      - from: CLEARED
        to: CLOSED
        trigger: "system event: Order.fulfillment_status reaches DELIVERED or CANCELLED"
        actor: system
        preconditions:
          - "order.fulfillment_status IN {DELIVERED, CANCELLED}"
        side_effects: []
      - from: HELD
        to: CLOSED
        trigger: "system event: Order.fulfillment_status reaches CANCELLED"
        actor: system
        preconditions:
          - "order.fulfillment_status == CANCELLED"
        side_effects: []
      - from: PENDING
        to: CLOSED
        trigger: "system event: Order.fulfillment_status reaches CANCELLED from DRAFT"
        actor: system
        preconditions:
          - "order.fulfillment_status == CANCELLED"
        side_effects: []

  # ---- InventoryLot: derived posture machine -------------------------------
  - entity: InventoryLot
    state_field: condition_state
    initial_state: SELLABLE
    terminal_states: [SCRAPPED]
    note: |
      condition_state is a derived field, re-evaluated from the lot_condition_posture
      calculation on every read and on every write (including clock movement). The
      transitions below name the triggers that can flip it; the evaluation order
      inside lot_condition_posture is authoritative.
    transitions:
      - from: SELLABLE
        to: REFRESH_REQUIRED
        trigger: "system re-derivation after POST /distribution/_clock/set_current_utc advances the clock"
        actor: system
        preconditions:
          - "scrap_manifest_id is null"
          - "days_between(manufactured_on, clock_date) <= model.shelf_life_days"
          - "state_of_charge_pct < REFRESH_THRESHOLD_PCT"
        side_effects:
          - "the lot is removed from the lot_allocation_selector candidate set; allocation against it fails with ERR_LOT_REFRESH_REQUIRED"
      - from: SELLABLE
        to: SELLABLE
        trigger: "POST /distribution/inventory-lots/{inventoryLotId}/refresh-charge"
        actor: WarehouseOperator
        preconditions:
          - "condition_state IN {SELLABLE, REFRESH_REQUIRED}"
          - "refresh_charge_count < MAX_REFRESH_CYCLES"
          - "the closed cooldown interval [last_refresh_charged_at, last_refresh_charged_at + REFRESH_COOLDOWN_HOURS] has fully elapsed; a request whose clock lands on or inside that interval is rejected with ERR_REFRESH_COOLDOWN_ACTIVE"
        side_effects:
          - "sets last_refresh_charged_at = clock and increments refresh_charge_count by 1"
          - "writes last_measured_open_circuit_voltage from the request body"
          - "state_of_charge_pct re-derives to 100.0; the lot stays SELLABLE"
        note: "topping up an already-sellable lot is legitimate maintenance, so this self-edge exists and keeps the cooldown and cycle-cap rules reachable without first letting a lot decay"
      - from: REFRESH_REQUIRED
        to: SELLABLE
        trigger: "POST /distribution/inventory-lots/{inventoryLotId}/refresh-charge"
        actor: WarehouseOperator
        preconditions:
          - "condition_state IN {SELLABLE, REFRESH_REQUIRED}"
          - "refresh_charge_count < MAX_REFRESH_CYCLES"
          - "last_refresh_charged_at is null OR clock >= last_refresh_charged_at + REFRESH_COOLDOWN_HOURS hours is FALSE only when the closed cooldown interval has elapsed; a request whose clock is inside the closed interval [last_refresh_charged_at, last_refresh_charged_at + REFRESH_COOLDOWN_HOURS] is rejected with ERR_REFRESH_COOLDOWN_ACTIVE"
        side_effects:
          - "sets last_refresh_charged_at = clock, resetting the state-of-charge baseline so state_of_charge_pct re-derives to 100.0"
          - "increments refresh_charge_count by 1"
          - "writes last_measured_open_circuit_voltage from the request body"
      - from: SELLABLE
        to: SHELF_EXPIRED
        trigger: "system re-derivation after POST /distribution/_clock/set_current_utc advances the clock"
        actor: system
        preconditions:
          - "scrap_manifest_id is null"
          - "days_between(manufactured_on, clock_date) > model.shelf_life_days"
        side_effects:
          - "allocation against the lot fails with ERR_LOT_SHELF_EXPIRED"
      - from: REFRESH_REQUIRED
        to: SHELF_EXPIRED
        trigger: "system re-derivation after POST /distribution/inventory-lots/{inventoryLotId}/refresh-charge exhausts MAX_REFRESH_CYCLES, or after the clock passes shelf_life_days"
        actor: system
        preconditions:
          - "scrap_manifest_id is null"
          - "days_between(manufactured_on, clock_date) > model.shelf_life_days OR (refresh_charge_count >= MAX_REFRESH_CYCLES AND state_of_charge_pct < REFRESH_THRESHOLD_PCT)"
        side_effects:
          - "further refresh attempts fail with ERR_REFRESH_CYCLES_EXHAUSTED"
      - from: SHELF_EXPIRED
        to: SCRAPPED
        trigger: "POST /distribution/inventory-lots/{inventoryLotId}/scrap"
        actor: WarehouseOperator | ComplianceOfficer
        preconditions:
          - "condition_state IN {SHELF_EXPIRED, REFRESH_REQUIRED}"
          - "quantity_reserved == 0"
          - "the target DisposalManifest.status == DRAFT"
        side_effects:
          - "sets scrap_manifest_id to the manifest id"
          - "increments DisposalManifest.scrapped_lot_count by 1 and re-derives lot_lead_kg and total_lead_kg"
      - from: REFRESH_REQUIRED
        to: SCRAPPED
        trigger: "POST /distribution/inventory-lots/{inventoryLotId}/scrap"
        actor: WarehouseOperator | ComplianceOfficer
        preconditions:
          - "condition_state IN {SHELF_EXPIRED, REFRESH_REQUIRED}"
          - "quantity_reserved == 0"
          - "the target DisposalManifest.status == DRAFT"
        side_effects:
          - "sets scrap_manifest_id to the manifest id"
          - "increments DisposalManifest.scrapped_lot_count by 1 and re-derives lot_lead_kg and total_lead_kg"
      - from: SCRAPPED
        to: SHELF_EXPIRED
        trigger: "system event: the manifest holding this lot transitions SUBMITTED -> DRAFT via POST /distribution/disposal-manifests/{disposalManifestId}/reject"
        actor: system
        preconditions:
          - "scrap_manifest_id == the rejected manifest id"
        side_effects:
          - "clears scrap_manifest_id, so condition_state re-derives from age and state of charge"

  # ---- Shipment: branching fork at certification ---------------------------
  - entity: Shipment
    state_field: status
    initial_state: PACKED
    terminal_states: [DELIVERED, HAZMAT_REJECTED, VOIDED]
    note: "PACKED forks into CERTIFIED and HAZMAT_REJECTED with disjoint side-effect sets."
    transitions:
      - from: PACKED
        to: CERTIFIED
        trigger: "POST /distribution/shipments/{shipmentId}/certify with certification_decision == APPROVE"
        actor: HazmatCertifier
        preconditions:
          - "shipment.status == PACKED"
          - "X-User-ID != shipment.packed_by_user_id (segregation of duties)"
          - "if shipment.hazmat_class_code != NON_REGULATED then warehouse.hazmat_endorsement == true"
        side_effects:
          - "writes certified_by_user_id from X-User-ID"
          - "runs calculation hazmat_surcharge variant shipment_actual and writes Shipment.hazmat_surcharge_cents"
          - "cascade hop 2 of certification_cascade: if Order.hazmat_fee_waived == false, sets Order.hazmat_fee_cents = Shipment.hazmat_surcharge_cents and re-derives Order.total_cents"
          - "cascade hop 3: because Order.total_cents changed, Account.open_receivable_cents is adjusted by (new Order.total_cents - previous Order.total_cents)"
      - from: PACKED
        to: HAZMAT_REJECTED
        trigger: "POST /distribution/shipments/{shipmentId}/certify with certification_decision == REJECT"
        actor: HazmatCertifier
        preconditions:
          - "shipment.status == PACKED"
          - "X-User-ID != shipment.packed_by_user_id (segregation of duties)"
        side_effects:
          - "writes certified_by_user_id and rejection_reason"
          - "sets Order.hazmat_hold = true and appends shipment.carrier_id to Order.rejected_carrier_ids"
          - "releases the shipment's carrier window and its dock-capacity contribution"
          - "does NOT touch Order.hazmat_fee_cents, Order.total_cents or Account.open_receivable_cents"
      - from: CERTIFIED
        to: DISPATCHED
        trigger: "POST /distribution/shipments/{shipmentId}/dispatch"
        actor: WarehouseOperator
        preconditions:
          - "shipment.status == CERTIFIED"
          - "shipment.carrier_id NOT IN order.rejected_carrier_ids"
          - "clock >= shipment.pickup_window_start AND clock < shipment.pickup_window_end"
        side_effects:
          - "writes dispatched_at = clock"
          - "cross-entity: Order.fulfillment_status moves ALLOCATED -> SHIPPED"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /distribution/shipments/{shipmentId}/deliver"
        actor: WarehouseOperator
        preconditions:
          - "shipment.status == DISPATCHED"
        side_effects:
          - "cascade hop 1 of delivery_cascade: writes delivered_at = clock"
          - "cascade hop 2: Order.fulfillment_status moves SHIPPED -> DELIVERED, which in turn runs every effect listed on that Order transition (credit_status -> CLOSED, core_due_by stamping, lot depletion, ServiceContract ATTACHED -> ACTIVE)"
          - "cascade hop 3: because the Order reached DELIVERED, Account.core_deposit_balance_cents += sum over lines of core_expected_count * BatteryModel.core_deposit_cents"
          - "cascade hop 4: because Account.core_deposit_balance_cents changed, if it is now >= CORE_LIABILITY_ALERT_CENTS and Account.status == ACTIVE then Account.status becomes CREDIT_HOLD"
          - "cascade hop 5: because Account.status became CREDIT_HOLD, every Order of that account with fulfillment_status IN {SUBMITTED, ALLOCATED} and credit_status == CLEARED moves credit_status to HELD"
      - from: PACKED
        to: VOIDED
        trigger: "system event: Order.fulfillment_status moves ALLOCATED -> CANCELLED"
        actor: system
        preconditions:
          - "shipment.status IN {PACKED, CERTIFIED}"
        side_effects:
          - "releases the shipment's carrier window and dock-capacity contribution"
      - from: CERTIFIED
        to: VOIDED
        trigger: "system event: Order.fulfillment_status moves ALLOCATED -> CANCELLED"
        actor: system
        preconditions:
          - "shipment.status IN {PACKED, CERTIFIED}"
        side_effects:
          - "releases the shipment's carrier window and dock-capacity contribution"
          - "if Order.hazmat_fee_cents currently holds this shipment's hazmat_surcharge_cents, the order total is re-derived before the cancel compensation debits Account.open_receivable_cents"

  # ---- CoreReturn: cyclic inspect/dispute machine --------------------------
  - entity: CoreReturn
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [CREDITED, REJECTED]
    note: "INSPECTED -> DISPUTED -> INSPECTED is a true cycle bounded by MAX_INSPECTION_ROUNDS."
    transitions:
      - from: SUBMITTED
        to: INSPECTED
        trigger: "POST /distribution/core-returns/{coreReturnId}/inspect with accepted_core_count >= 1"
        actor: WarehouseOperator
        preconditions:
          - "core_return.status IN {SUBMITTED, DISPUTED}"
          - "accepted_core_count <= declared_core_count"
        side_effects:
          - "increments inspection_round by 1"
          - "writes accepted_core_count"
          - "runs calculation core_lead_recovery, writing lead_recovered_kg and scrap_value_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /distribution/core-returns/{coreReturnId}/inspect with accepted_core_count == 0"
        actor: WarehouseOperator
        preconditions:
          - "core_return.status IN {SUBMITTED, DISPUTED}"
        side_effects:
          - "increments inspection_round by 1"
          - "sets lead_recovered_kg = 0.0, scrap_value_cents = 0, final_credit_cents = 0"
          - "no Account ledger movement"
      - from: INSPECTED
        to: DISPUTED
        trigger: "POST /distribution/core-returns/{coreReturnId}/dispute"
        actor: Customer | SalesRep
        preconditions:
          - "core_return.status == INSPECTED"
          - "core_return.inspection_round < MAX_INSPECTION_ROUNDS"
        side_effects:
          - "writes dispute_reason"
          - "the next inspect call re-enters INSPECTED and increments inspection_round again"
      - from: DISPUTED
        to: INSPECTED
        trigger: "POST /distribution/core-returns/{coreReturnId}/inspect with accepted_core_count >= 1"
        actor: WarehouseOperator
        preconditions:
          - "core_return.status IN {SUBMITTED, DISPUTED}"
          - "accepted_core_count <= declared_core_count"
        side_effects:
          - "increments inspection_round by 1"
          - "overwrites accepted_core_count, lead_recovered_kg and scrap_value_cents with the new round's values"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /distribution/core-returns/{coreReturnId}/inspect with accepted_core_count == 0"
        actor: WarehouseOperator
        preconditions:
          - "core_return.status IN {SUBMITTED, DISPUTED}"
        side_effects:
          - "increments inspection_round by 1"
          - "sets lead_recovered_kg = 0.0, scrap_value_cents = 0, final_credit_cents = 0"
      - from: INSPECTED
        to: CREDITED
        trigger: "POST /distribution/core-returns/{coreReturnId}/credit"
        actor: SalesRep | PlatformAdmin
        preconditions:
          - "core_return.status == INSPECTED"
        side_effects:
          - "cascade hop 1 of core_credit_cascade: runs calculation core_exchange_credit variant assayed_final and writes CoreReturn.final_credit_cents"
          - "cascade hop 2: because the return was credited, Account.core_deposit_balance_cents -= final_credit_cents (floored at 0) and Account.lifetime_lead_recovered_kg += lead_recovered_kg"
          - "cascade hop 3: because Account.core_deposit_balance_cents changed, if it is now < CORE_LIABILITY_ALERT_CENTS and Account.status == CREDIT_HOLD then Account.status becomes ACTIVE"
          - "cascade hop 4: because Account.status became ACTIVE, every Order of that account with credit_status == HELD moves credit_status to CLEARED"

  # ---- WarrantyClaim: branching adjudication -------------------------------
  - entity: WarrantyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [SETTLED, DENIED]
    note: "SUBMITTED forks three ways on the computed months_in_service; settlement forks again on settlement_mode with disjoint effects."
    transitions:
      - from: SUBMITTED
        to: APPROVED_FREE
        trigger: "POST /distribution/warranty-claims/{warrantyClaimId}/adjudicate"
        actor: SalesRep | PlatformAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "months_in_service <= model.warranty_free_replacement_months"
        side_effects:
          - "writes months_in_service, coverage_band = FREE and credit_cents = model.list_price_cents"
      - from: SUBMITTED
        to: APPROVED_PRORATA
        trigger: "POST /distribution/warranty-claims/{warrantyClaimId}/adjudicate"
        actor: SalesRep | PlatformAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "months_in_service > model.warranty_free_replacement_months AND months_in_service < model.warranty_free_replacement_months + model.warranty_prorata_months"
        side_effects:
          - "writes months_in_service, coverage_band = PRORATA and credit_cents from calculation warranty_prorata_credit"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /distribution/warranty-claims/{warrantyClaimId}/adjudicate"
        actor: SalesRep | PlatformAdmin
        preconditions:
          - "claim.status == SUBMITTED"
          - "months_in_service >= model.warranty_free_replacement_months + model.warranty_prorata_months"
        side_effects:
          - "writes months_in_service, coverage_band = EXPIRED and credit_cents = 0"
      - from: APPROVED_FREE
        to: SETTLED
        trigger: "POST /distribution/warranty-claims/{warrantyClaimId}/settle"
        actor: SalesRep | PlatformAdmin
        preconditions:
          - "claim.status IN {APPROVED_FREE, APPROVED_PRORATA}"
          - "if settlement_mode == REPLACEMENT_ORDER then replacement_warehouse_id is present and resolves to a Warehouse"
        side_effects:
          - "branch ACCOUNT_CREDIT: Account.warranty_credit_cents += claim.credit_cents; replacement_order_id stays null"
          - "branch REPLACEMENT_ORDER: creates a DRAFT Order for account_id at replacement_warehouse_id with requested_ship_date = clock date, plus one OrderLine with quantity 1, core_expected_count 1 and battery_model_id = claim.battery_model_id when that model's status == ACTIVE, otherwise that model's replacement_model_id; writes claim.replacement_order_id; Account.warranty_credit_cents is NOT changed"
      - from: APPROVED_PRORATA
        to: SETTLED
        trigger: "POST /distribution/warranty-claims/{warrantyClaimId}/settle"
        actor: SalesRep | PlatformAdmin
        preconditions:
          - "claim.status IN {APPROVED_FREE, APPROVED_PRORATA}"
          - "if settlement_mode == REPLACEMENT_ORDER then replacement_warehouse_id is present and resolves to a Warehouse"
        side_effects:
          - "branch ACCOUNT_CREDIT: Account.warranty_credit_cents += claim.credit_cents; replacement_order_id stays null"
          - "branch REPLACEMENT_ORDER: creates a DRAFT Order and one OrderLine exactly as described on the APPROVED_FREE edge; Account.warranty_credit_cents is NOT changed"

  # ---- ServiceContract: sizing then attach ---------------------------------
  - entity: ServiceContract
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SIZED
        trigger: "POST /distribution/service-contracts/{serviceContractId}/size"
        actor: SalesRep | PlatformAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "the runtime_sizing_selector candidate set is non-empty"
        side_effects:
          - "runs calculation runtime_sizing, writing dc_load_amps, temp_derate_factor, required_peukert_ah, sized_battery_model_id, sized_string_count, sized_units_per_string, sized_unit_count and covered_value_cents"
          - "runs calculation service_contract_fee, writing monthly_fee_cents and prepay_total_cents"
      - from: SIZED
        to: ATTACHED
        trigger: "POST /distribution/service-contracts/{serviceContractId}/attach"
        actor: SalesRep
        preconditions:
          - "contract.status == SIZED"
          - "order.account_id == contract.account_id"
          - "order.fulfillment_status IN {SUBMITTED, ALLOCATED}"
          - "expected_order_version == order.version"
        side_effects:
          - "writes order_id and attached_at"
          - "any other ServiceContract with the same order_id and status IN {ATTACHED, ACTIVE} moves to SUPERSEDED"
          - "sets Order.service_contract_fee_cents = this contract's prepay_total_cents (replacing, not adding to, any superseded contract's contribution) and re-derives Order.total_cents"
          - "adjusts Account.open_receivable_cents by (new Order.total_cents - previous Order.total_cents)"
          - "increments Order.version by 1"
      - from: ATTACHED
        to: ACTIVE
        trigger: "system event: the attached Order reaches fulfillment_status DELIVERED"
        actor: system
        preconditions:
          - "contract.status == ATTACHED"
        side_effects:
          - "coverage begins; no ledger movement"
      - from: ATTACHED
        to: SUPERSEDED
        trigger: "system event: another ServiceContract attaches to the same Order"
        actor: system
        preconditions:
          - "contract.status IN {ATTACHED, ACTIVE}"
        side_effects:
          - "clears nothing on the contract itself; the order's service_contract_fee_cents is taken over by the new contract"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: another ServiceContract attaches to the same Order"
        actor: system
        preconditions:
          - "contract.status IN {ATTACHED, ACTIVE}"
        side_effects:
          - "the order's service_contract_fee_cents is taken over by the new contract"
      - from: ATTACHED
        to: CANCELLED
        trigger: "system event: the attached Order reaches fulfillment_status CANCELLED"
        actor: system
        preconditions:
          - "contract.status IN {ATTACHED, ACTIVE}"
        side_effects:
          - "coverage ends"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system event: the attached Order reaches fulfillment_status CANCELLED"
        actor: system
        preconditions:
          - "contract.status IN {ATTACHED, ACTIVE}"
        side_effects:
          - "coverage ends"

  # ---- StormEvent ----------------------------------------------------------
  - entity: StormEvent
    state_field: status
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: ALLOCATING
        trigger: "POST /distribution/storm-events/{stormEventId}/open-allocation"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "storm_event.status == DECLARED"
        side_effects:
          - "storm orders linked to this event may now be allocated"
      - from: DECLARED
        to: CLOSED
        trigger: "POST /distribution/storm-events/{stormEventId}/close"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "storm_event.status IN {DECLARED, ALLOCATING}"
        side_effects:
          - "the warehouse storm carve-out in region_state_code is released, so quantity_available for non-storm allocation rises"
      - from: ALLOCATING
        to: CLOSED
        trigger: "POST /distribution/storm-events/{stormEventId}/close"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "storm_event.status IN {DECLARED, ALLOCATING}"
        side_effects:
          - "the warehouse storm carve-out in region_state_code is released"
          - "further storm draws against this event are refused with ERR_INVALID_STATE; already-allocated draws are untouched"

  # ---- DisposalManifest: cyclic filing -------------------------------------
  - entity: DisposalManifest
    state_field: status
    initial_state: DRAFT
    terminal_states: [FILED]
    note: "SUBMITTED -> DRAFT is the compensating edge that restores the lead-mass invariant."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /distribution/disposal-manifests/{disposalManifestId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "manifest.status == DRAFT"
          - "manifest.attached_core_return_count + manifest.scrapped_lot_count >= 1"
          - "manifest.total_lead_kg <= EPA_MANIFEST_MAX_LEAD_KG"
        side_effects:
          - "freezes attachments; further attach or scrap calls against this manifest fail with ERR_INVALID_STATE"
      - from: SUBMITTED
        to: FILED
        trigger: "POST /distribution/disposal-manifests/{disposalManifestId}/file"
        actor: ComplianceOfficer
        preconditions:
          - "manifest.status == SUBMITTED"
          - "X-User-ID != manifest.created_by_user_id (segregation of duties)"
        side_effects:
          - "writes filed_by_user_id and filed_at; the manifest becomes immutable"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /distribution/disposal-manifests/{disposalManifestId}/reject"
        actor: ComplianceOfficer | PlatformAdmin
        preconditions:
          - "manifest.status == SUBMITTED"
        side_effects:
          - "writes rejection_reason"
          - "compensation: every CoreReturn with disposal_manifest_id == this manifest has that field cleared to null"
          - "compensation: every InventoryLot with scrap_manifest_id == this manifest has that field cleared to null, so its condition_state re-derives out of SCRAPPED"
          - "re-derives attached_core_return_count = 0, scrapped_lot_count = 0, core_lead_kg = 0.0, lot_lead_kg = 0.0 and total_lead_kg = 0.0"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: shipment-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /distribution/shipments"
    occ_field: "expected_order_version"
    description: |
      Packing a Shipment against an Order whose version has advanced since the
      client last observed it is rejected. An order may legitimately carry more
      than one shipment row over its life (a rejected tender is re-packed onto a
      different carrier), so a second create against a freshly observed version
      succeeds; only a stale view of the order is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-attach-stale-order
    parent_entity: Order
    write_endpoint: "POST /distribution/service-contracts/{serviceContractId}/attach"
    occ_field: "expected_order_version"
    description: |
      Attaching a ServiceContract to an Order whose version has advanced since
      the client last observed it is rejected. Attachment legitimately supersedes
      any contract already carried by the order, so an attach against a freshly
      observed version succeeds; a stale view means the attaching client did not
      see the fee it is about to replace.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: manifest-attach-stale-manifest
    parent_entity: DisposalManifest
    write_endpoint: "POST /distribution/disposal-manifests/{disposalManifestId}/attach-core-return"
    occ_field: "expected_disposal_manifest_version"
    description: |
      Attaching a CoreReturn to a DisposalManifest whose version has advanced
      since the client last observed it is rejected. A manifest legitimately
      accumulates many core returns, so each attach against a freshly observed
      version succeeds; a stale view means the client's total_lead_kg reading is
      behind and its EPA cap arithmetic cannot be trusted.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: lot_state_of_charge
    trigger: "re-derived on every read and every write of an InventoryLot, including after POST /distribution/_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      baseline_date = date(last_refresh_charged_at) if last_refresh_charged_at is not null
                      else manufactured_on
      months_stored = floor(days_between(baseline_date, date(current_utc)) / 30)
      state_of_charge_pct = round_half_up(
          max(0.0, 100.0 - model.self_discharge_pct_per_month * months_stored), 1)
    input_set: "Exactly one InventoryLot and its BatteryModel. Refresh charging is the reset event: once last_refresh_charged_at is set, manufactured_on no longer participates in this formula (it still drives shelf life)."
    constants:
      DAYS_PER_STORAGE_MONTH: 30
    precision: "1 decimal place, round_half_up; months_stored uses floor division on whole days"

  - name: lot_condition_posture
    trigger: "re-derived on every read and every write of an InventoryLot; the result is InventoryLot.condition_state"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top to bottom; the first matching clause wins.
      1. if scrap_manifest_id is not null                          -> SCRAPPED
      2. elif days_between(manufactured_on, date(current_utc))
              > model.shelf_life_days                              -> SHELF_EXPIRED
      3. elif refresh_charge_count >= MAX_REFRESH_CYCLES
              and state_of_charge_pct < REFRESH_THRESHOLD_PCT      -> SHELF_EXPIRED
      4. elif state_of_charge_pct < REFRESH_THRESHOLD_PCT          -> REFRESH_REQUIRED
      5. else                                                      -> SELLABLE
    input_set: "One InventoryLot, its BatteryModel and the logical clock. Clause 2 uses a strict > so a lot whose age in days equals shelf_life_days exactly is still eligible."
    constants:
      REFRESH_THRESHOLD_PCT: 75.0
      MAX_REFRESH_CYCLES: 3
    precision: "no rounding; state_of_charge_pct is consumed at its own 1-decimal precision, and the comparison at clauses 3 and 4 is a strict <, so exactly 75.0 is SELLABLE"

  - name: order_line_pricing
    trigger: "POST /distribution/orders/{orderId}/submit, on the DRAFT -> SUBMITTED transition"
    algorithm: tiered_pricing
    formula: |
      # Lines are processed in OrderLine.created_at ASC; ties (identical
      # created_at) are impossible because created_at carries milliseconds and
      # lines are created one request at a time.
      for line in order.lines ordered by created_at ASC:
          unit_price_cents = model.list_price_cents            # snapshot at submit
          tier_pct   = ACCOUNT_TIER_DISCOUNT[account.account_tier]
          volume_pct = 0.05 if line.quantity >= 100
                       else 0.03 if line.quantity >= 25
                       else 0.01 if line.quantity >= 10
                       else 0.00
          discount_pct = round_half_up(min(tier_pct + volume_pct, MAX_DISCOUNT_PCT), 4)
          line_total_cents = round_half_up(unit_price_cents * line.quantity
                                           * (1 - discount_pct))     # ROUND HERE
      subtotal_cents = sum(line_total_cents for every line)           # THEN SUM
    input_set: "Every OrderLine attached to the order, with no status filter (lines have no status of their own). The rounding order is pinned: each line is rounded to whole cents first and the rounded line totals are summed. Summing the unrounded products and rounding once at the end is explicitly NOT the rule and produces a different subtotal."
    constants:
      ACCOUNT_TIER_DISCOUNT: { PLATINUM: 0.12, GOLD: 0.07, STANDARD: 0.00 }
      VOLUME_DISCOUNT_BREAKS: { "100": 0.05, "25": 0.03, "10": 0.01 }
      MAX_DISCOUNT_PCT: 0.15
    precision: "line_total_cents is a whole number of cents, round_half_up; discount_pct carries 4 decimals"

  - name: order_total_assembly
    trigger: "POST /distribution/orders/{orderId}/submit; steps 3 and 5 are re-run when a Shipment is certified or a ServiceContract is attached"
    algorithm: constraint_propagation
    formula: |
      # The waiver looks circular: total_cents contains hazmat_fee_cents, and a
      # naive reader keys the waiver off total_cents. The evaluation order below
      # is pinned and makes the value well-defined.
      Step 1: subtotal_cents = order_line_pricing result
      Step 2: hazmat_fee_waived = (subtotal_cents >= HAZMAT_FEE_WAIVER_SUBTOTAL_CENTS)
              # keyed on subtotal_cents ONLY, decided once at submit, never
              # re-decided when hazmat_fee_cents or service_contract_fee_cents
              # change later
      Step 3: hazmat_fee_cents = 0 if hazmat_fee_waived
                                 else hazmat_surcharge(variant = order_forecast)
      Step 4: core_deposit_charge_cents =
                  sum over lines of (line.quantity - line.core_expected_count)
                                    * model.core_deposit_cents
      Step 5: total_cents = subtotal_cents
                          + core_deposit_charge_cents
                          + hazmat_fee_cents
                          + service_contract_fee_cents
    input_set: "All OrderLines of the order. service_contract_fee_cents is 0 until a ServiceContract attaches; on attach only Steps 3 (skipped) and 5 re-run, and Step 2's decision is reused verbatim."
    constants:
      HAZMAT_FEE_WAIVER_SUBTOTAL_CENTS: 5000000
    precision: "all values are whole cents; no rounding occurs in this calculation"

  - name: hazmat_classification
    trigger: "computed on POST /distribution/battery-models (BatteryModel.hazmat_class_code) and on POST /distribution/shipments (Shipment.hazmat_class_code)"
    algorithm: threshold
    formula: |
      # Per BatteryModel:
      watt_hour_rating = round_half_up(nominal_voltage * amp_hour_capacity, 2)
      if chemistry == FLOODED_LEAD_ACID:            class = UN2794
      elif chemistry == NICKEL_CADMIUM:             class = UN2795
      elif chemistry in {AGM, GEL}:
          class = UN2800_EXCEPTED if unit_weight_kg <= 30.0 else UN2800
      elif chemistry == LITHIUM_IRON_PHOSPHATE:
          class = NON_REGULATED     if watt_hour_rating <= LITHIUM_EXCEPTED_MAX_WH
                  else UN3480_SECTION_II if watt_hour_rating <= LITHIUM_SECTION_II_MAX_WH
                  else UN3480_SECTION_IA
      hazmat_severity_rank = HAZMAT_SEVERITY_RANK[class]

      # Per Shipment (over the order's lines, no quantity weighting):
      shipment.hazmat_class_code = the class whose HAZMAT_SEVERITY_RANK equals
          max(model.hazmat_severity_rank for every line of the order)
    input_set: "For a shipment: every OrderLine of shipment.order_id, regardless of allocated_quantity. NON_REGULATED is produced only by the lithium branch, for cells at or under 20.0 Wh; every other chemistry always classifies into one of the six regulated codes."
    constants:
      AGM_GEL_NON_SPILLABLE_MAX_KG: 30.0
      LITHIUM_EXCEPTED_MAX_WH: 20.0
      LITHIUM_SECTION_II_MAX_WH: 100.0
      HAZMAT_SEVERITY_RANK:
        NON_REGULATED: 0
        UN2800_EXCEPTED: 1
        UN2795: 2
        UN2800: 3
        UN2794: 4
        UN3480_SECTION_II: 5
        UN3480_SECTION_IA: 6
    precision: "watt_hour_rating carries 2 decimals; both threshold comparisons are <= so a 30.0 kg AGM unit is EXCEPTED and a 100.0 Wh lithium unit is SECTION_II"

  - name: hazmat_surcharge
    trigger: "variant order_forecast runs at POST /distribution/orders/{orderId}/submit; variant shipment_actual runs at POST /distribution/shipments/{shipmentId}/certify with certification_decision == APPROVE"
    algorithm: aggregation
    formula: |
      class        = the hazmat class code of the subject (order forecast or shipment)
      weight_kg    = round_half_up(sum over the order's lines of
                                   line.quantity * model.unit_weight_kg, 3)
      weight_fee   = ceil(weight_kg / 10.0) * HAZMAT_PER_10KG_CENTS
      base_fee     = HAZMAT_BASE_FEE_CENTS[class] * base_multiplier   # see variants
      raw_cents    = base_fee + weight_fee
      surcharge    = round_half_up(raw_cents * HAZMAT_ENDORSED_DISCOUNT)
                     if warehouse.hazmat_endorsement else raw_cents
    input_set: "Every OrderLine of the order, at full line.quantity. Both variants read the same lines and the same warehouse; only base_multiplier differs."
    constants:
      HAZMAT_PER_10KG_CENTS: 275
      HAZMAT_MAX_PACKAGE_KG: 30.0
      HAZMAT_ENDORSED_DISCOUNT: 0.85
      HAZMAT_BASE_FEE_CENTS:
        NON_REGULATED: 0
        UN2800_EXCEPTED: 1500
        UN2795: 4200
        UN2800: 5500
        UN2794: 7800
        UN3480_SECTION_II: 6400
        UN3480_SECTION_IA: 12500
    precision: "weight_kg carries 3 decimals; the surcharge is whole cents, round_half_up"
    variants:
      - name: order_forecast
        when: "Order submit, before any physical packing exists"
        difference: "base_multiplier = 1 — the forecast assumes the whole order tenders as a single hazmat package, so the class base fee is charged exactly once. Written to Order.hazmat_fee_cents."
      - name: shipment_actual
        when: "Shipment certification, when the physical package count is known"
        difference: "base_multiplier = package_count = ceil(weight_kg / HAZMAT_MAX_PACKAGE_KG) — the class base fee is charged once per 30 kg package. For identical order contents this returns a strictly larger surcharge whenever weight_kg > 30.0. Written to Shipment.hazmat_surcharge_cents and, unless Order.hazmat_fee_waived, copied over Order.hazmat_fee_cents."

  - name: core_lead_recovery
    trigger: "POST /distribution/core-returns/{coreReturnId}/inspect, on every inspection round"
    algorithm: aggregation
    formula: |
      lead_recovered_kg = round_half_up(accepted_core_count
                                        * model.lead_content_kg
                                        * LEAD_RECOVERY_YIELD, 3)
      scrap_value_cents = round_half_up(lead_recovered_kg * LEAD_PRICE_CENTS_PER_KG)
    input_set: "The single CoreReturn under inspection and its BatteryModel. Each round overwrites the previous round's values; only the latest round survives."
    constants:
      LEAD_RECOVERY_YIELD: 0.965
      LEAD_PRICE_CENTS_PER_KG: 196
    precision: "lead_recovered_kg carries 3 decimals, round_half_up; scrap_value_cents is whole cents, round_half_up, computed from the already-rounded lead_recovered_kg"

  - name: core_exchange_credit
    trigger: "variant declared_provisional runs at POST /distribution/core-returns; variant assayed_final runs at POST /distribution/core-returns/{coreReturnId}/credit"
    algorithm: forward_looking
    formula: |
      # declared_provisional
      provisional_credit_cents = declared_core_count * model.core_deposit_cents

      # assayed_final
      deposit_value = accepted_core_count * model.core_deposit_cents
      gross_cents   = max(deposit_value, scrap_value_cents)
      penalty_cents = round_half_up(gross_cents * LATE_CORE_PENALTY_PCT)
                      if late_return else 0
      final_credit_cents = gross_cents - penalty_cents
    input_set: "One CoreReturn plus its BatteryModel. late_return is true when date(core_return.created_at) is strictly after the earliest non-null core_due_by among the source Order's OrderLines whose battery_model_id equals the return's battery_model_id."
    constants:
      LATE_CORE_PENALTY_PCT: 0.25
      CORE_RETURN_WINDOW_DAYS: 45
      CORE_RETURN_GRACE_DAYS: 30
    precision: "whole cents, round_half_up on the penalty only"
    variants:
      - name: declared_provisional
        when: "Return submission, before physical inspection"
        difference: "Values every declared core at the flat core deposit and ignores lead assay and lateness entirely. Written to CoreReturn.provisional_credit_cents and never overwritten."
      - name: assayed_final
        when: "Credit issuance, after the last inspection round"
        difference: "Values only the accepted cores, takes the greater of deposit value and recycled lead scrap value, then subtracts the late penalty. For identical inputs it diverges from declared_provisional in both directions: upward when scrap_value_cents exceeds the deposit value, downward when cores are rejected or the return is late. Written to CoreReturn.final_credit_cents and it, not the provisional figure, moves Account.core_deposit_balance_cents."

  - name: warranty_prorata_credit
    trigger: "POST /distribution/warranty-claims/{warrantyClaimId}/adjudicate"
    algorithm: threshold
    formula: |
      months_in_service = (year(failed_on) - year(installed_on)) * 12
                        + (month(failed_on) - month(installed_on))
                        - (1 if day(failed_on) < day(installed_on) else 0)

      free    = model.warranty_free_replacement_months
      prorata = model.warranty_prorata_months

      if months_in_service <= free:
          coverage_band = FREE
          credit_cents  = model.list_price_cents
      elif months_in_service < free + prorata:
          coverage_band = PRORATA
          remaining_months = free + prorata - months_in_service
          credit_cents = round_half_up(model.list_price_cents
                                       * remaining_months / prorata)
      else:
          coverage_band = EXPIRED
          credit_cents  = 0
    input_set: "One WarrantyClaim and its BatteryModel. The pro-rata denominator is warranty_prorata_months alone, NOT free + prorata; the numerator counts whole months remaining in the pro-rata band."
    constants: {}
    precision: "whole cents, round_half_up; months_in_service is a whole anniversary-month count"
    variants:
      - name: free_replacement
        when: "months_in_service <= warranty_free_replacement_months"
        difference: "Awards the full list price with no pro-ration. The comparison is <=, so a claim landing exactly on the free-band anniversary month is a full replacement."
      - name: prorata
        when: "warranty_free_replacement_months < months_in_service < free + prorata"
        difference: "Awards list_price_cents * remaining_months / warranty_prorata_months. At exactly one month past the free band this pays strictly less than free_replacement for identical list prices, and the two bands are separated by a single month of service."

  - name: runtime_sizing
    trigger: "POST /distribution/service-contracts/{serviceContractId}/size"
    algorithm: constraint_propagation
    formula: |
      dc_load_amps       = round_half_up(load_watts
                                         / (system_voltage * INVERTER_EFFICIENCY), 3)
      runtime_hours      = required_runtime_minutes / 60
      temp_derate_factor = 1.00 if ambient_temp_c >= 25.0
                           else 0.95 if ambient_temp_c >= 15.0
                           else 0.87 if ambient_temp_c >= 5.0
                           else 0.75

      for each candidate model m:
          required_peukert_ah(m) = round_half_up(
              dc_load_amps * (runtime_hours ** m.peukert_exponent), 3)
          usable_ah_per_unit(m)  = round_half_up(
              m.amp_hour_capacity * DOD_LIMIT[m.chemistry] * temp_derate_factor, 3)
          units_per_string(m)    = ceil(system_voltage / m.nominal_voltage)
          string_count(m)        = ceil(required_peukert_ah(m) / usable_ah_per_unit(m))
          unit_count(m)          = string_count(m) * units_per_string(m)

      sized_battery_model_id = the winner of runtime_sizing_selector
      sized_string_count     = string_count(winner)
      sized_units_per_string = units_per_string(winner)
      sized_unit_count       = unit_count(winner)
      required_peukert_ah    = required_peukert_ah(winner)
      covered_value_cents    = sized_unit_count * winner.list_price_cents
    input_set: "Every BatteryModel in the runtime_sizing_selector candidate set; the four sized_* fields and required_peukert_ah are those of the winner only."
    constants:
      INVERTER_EFFICIENCY: 0.90
      DOD_LIMIT:
        FLOODED_LEAD_ACID: 0.50
        AGM: 0.60
        GEL: 0.60
        LITHIUM_IRON_PHOSPHATE: 0.90
        NICKEL_CADMIUM: 0.70
      TEMP_DERATE_BREAKS: { "25.0": 1.00, "15.0": 0.95, "5.0": 0.87, "below": 0.75 }
    precision: "dc_load_amps, required_peukert_ah and usable_ah_per_unit carry 3 decimals, round_half_up; both string counts use ceil on the already-rounded 3-decimal values"

  - name: runtime_sizing_selector
    trigger: "inside POST /distribution/service-contracts/{serviceContractId}/size, before runtime_sizing writes its results"
    algorithm: weighted_scoring
    formula: |
      eligibility filter (all must hold):
          m.status == ACTIVE
          m.chemistry IN contract.allowed_chemistries
          m.nominal_voltage <= contract.system_voltage
      ranking expression, applied in order:
          1. unit_count(m) ASC
          2. (unit_count(m) * m.list_price_cents) ASC
          3. m.created_at ASC
      empty-candidate fallback:
          reject the request with ERR_NO_ELIGIBLE_BATTERY_MODEL (422)
    input_set: "All BatteryModel rows. The eligibility filter names the status enum explicitly; no adjective stands in for it."
    constants: {}
    precision: "integer comparison on unit_count and on unit_count * list_price_cents; created_at compares at millisecond precision"

  - name: service_contract_fee
    trigger: "POST /distribution/service-contracts/{serviceContractId}/size, immediately after runtime_sizing"
    algorithm: weighted_scoring
    formula: |
      raw_cents = covered_value_cents
                * COVERAGE_RATE[coverage_tier]
                * CHEM_SERVICE_MULT[winner.chemistry]
      monthly_fee_cents = max(TIER_FLOOR_CENTS[coverage_tier],
                              round_half_up(raw_cents))     # single terminal rounding
      prepay_total_cents = monthly_fee_cents * CONTRACT_PREPAY_MONTHS
    input_set: "The sized contract and its winning BatteryModel. Both multipliers are applied to the unrounded product and the result is rounded exactly once, at the end."
    constants:
      COVERAGE_RATE: { BRONZE: 0.0075, SILVER: 0.0125, GOLD: 0.0200 }
      CHEM_SERVICE_MULT:
        FLOODED_LEAD_ACID: 1.30
        AGM: 1.10
        GEL: 1.15
        LITHIUM_IRON_PHOSPHATE: 0.90
        NICKEL_CADMIUM: 1.25
      TIER_FLOOR_CENTS: { BRONZE: 2500, SILVER: 4900, GOLD: 9900 }
      CONTRACT_PREPAY_MONTHS: 12
    precision: "whole cents, round_half_up, applied once after both multiplications"

  - name: allocation_priority_score
    trigger: "POST /distribution/orders/{orderId}/allocate, before the storm gate is evaluated"
    algorithm: weighted_scoring
    formula: |
      if order.storm_event_id is null:
          allocation_priority_score = 0
      else:
          tier_points     = TIER_POINTS[account.account_tier]
          rank_points     = max(0, 6 - account.storm_priority_rank) * 5
          severity_points = SEVERITY_POINTS[storm_event.severity_tier]
          value_points    = min(15, floor(order.subtotal_cents / 100000))
          allocation_priority_score = tier_points + rank_points
                                    + severity_points + value_points
      gate: allocation_priority_score >= SEVERITY_MIN_SCORE[storm_event.severity_tier]
            else ERR_STORM_PRIORITY_TOO_LOW (403)
    input_set: "One Order, its Account and its StormEvent. subtotal_cents is the value frozen at submit."
    constants:
      TIER_POINTS: { PLATINUM: 40, GOLD: 28, STANDARD: 12 }
      SEVERITY_POINTS: { WATCH: 5, WARNING: 12, EMERGENCY: 20 }
      SEVERITY_MIN_SCORE: { WATCH: 0, WARNING: 45, EMERGENCY: 70 }
    precision: "integer arithmetic throughout; the gate comparison is >=, so a score exactly equal to the minimum passes"

  - name: lot_allocation_selector
    trigger: "POST /distribution/orders/{orderId}/allocate, once per OrderLine in OrderLine.created_at ASC"
    algorithm: waterfall_allocation
    formula: |
      storm_carve_out(lot) =
          floor(lot.quantity_on_hand * warehouse.storm_reserve_pct)
          if at least one StormEvent exists with
             status IN {DECLARED, ALLOCATING}
             and region_state_code == warehouse.state_code
          else 0

      effective_available(lot) =
          lot.quantity_on_hand - lot.quantity_reserved
              if order.storm_event_id is not null
          else lot.quantity_on_hand - lot.quantity_reserved - storm_carve_out(lot)

      eligibility filter (all must hold):
          lot.battery_model_id == line.battery_model_id
          lot.warehouse_id     == order.warehouse_id
          lot.condition_state  == SELLABLE
          effective_available(lot) >= line.quantity

      ranking expression, applied in order:
          1. lot.manufactured_on ASC      (strict FIFO on age)
          2. lot.created_at ASC           (tie-break)

      empty-candidate fallback, evaluated in this exact order over the lots that
      match model and warehouse and have quantity_on_hand - quantity_reserved
      >= line.quantity:
          1. any such lot with condition_state == SHELF_EXPIRED
                 -> ERR_LOT_SHELF_EXPIRED (422)
          2. else any such lot with condition_state == REFRESH_REQUIRED
                 -> ERR_LOT_REFRESH_REQUIRED (422)
          3. else -> ERR_INSUFFICIENT_SELLABLE_STOCK (422)
    input_set: "All InventoryLot rows at order.warehouse_id for the line's model. SCRAPPED lots never enter either the candidate set or the fallback inspection. Lines are satisfied one lot each; a line whose quantity cannot be met from a single lot is not split."
    constants: {}
    precision: "integer unit arithmetic; storm_carve_out uses floor"

  - name: manifest_lead_totals
    trigger: "re-derived whenever a CoreReturn is attached to or detached from a DisposalManifest, whenever an InventoryLot is scrapped onto or released from one, and on every manifest read"
    algorithm: aggregation
    formula: |
      core_lead_kg = round_half_up(
          sum of CoreReturn.lead_recovered_kg over rows where
              disposal_manifest_id == manifest.id AND status == CREDITED, 3)
      lot_lead_kg  = round_half_up(
          sum over InventoryLot rows where scrap_manifest_id == manifest.id of
              lot.quantity_on_hand * model.lead_content_kg, 3)
      total_lead_kg = round_half_up(core_lead_kg + lot_lead_kg, 3)
      attached_core_return_count = count of those CoreReturn rows
      scrapped_lot_count         = count of those InventoryLot rows
    input_set: "CoreReturn rows filtered to status == CREDITED and this manifest id; InventoryLot rows filtered to this manifest id with no condition filter (a scrapped lot's condition_state is SCRAPPED by construction). The window is the manifest's whole life; there is no time filter and the sum is order-independent, so no tie-break is needed."
    constants:
      EPA_MANIFEST_MAX_LEAD_KG: 1000.000
    precision: "3 decimals, round_half_up on each of the three sums independently"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the first failing rule decides the response)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of {PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer, Customer}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "X-User-Role appears in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "every id embedded in the request path resolves to a stored row, validated left to right"
    error_id: ERR_ACCOUNT_NOT_FOUND | ERR_BATTERY_MODEL_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_CARRIER_NOT_FOUND | ERR_INVENTORY_LOT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_CORE_RETURN_NOT_FOUND | ERR_WARRANTY_CLAIM_NOT_FOUND | ERR_SERVICE_CONTRACT_NOT_FOUND | ERR_STORM_EVENT_NOT_FOUND | ERR_DISPOSAL_MANIFEST_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 5
    category: business_constraint
    check: "request body carries every required field, every value matches its declared type, every enum value is a declared member, quantity >= 1, core_expected_count <= quantity, storm_priority_rank in 1..9, failed_on >= installed_on, pickup_window_end > pickup_window_start, allowed_chemistries non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint with a request body"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row"
    error_id: ERR_ACCOUNT_NOT_FOUND | ERR_BATTERY_MODEL_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_CARRIER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_CORE_RETURN_NOT_FOUND | ERR_STORM_EVENT_NOT_FOUND | ERR_DISPOSAL_MANIFEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /distribution/orders, POST /distribution/orders/{orderId}/lines, POST /distribution/inventory-lots, POST /distribution/inventory-lots/{inventoryLotId}/scrap, POST /distribution/shipments, POST /distribution/core-returns, POST /distribution/warranty-claims, POST /distribution/warranty-claims/{warrantyClaimId}/settle, POST /distribution/service-contracts, POST /distribution/service-contracts/{serviceContractId}/attach, POST /distribution/disposal-manifests, POST /distribution/disposal-manifests/{disposalManifestId}/attach-core-return, POST /distribution/battery-models/{batteryModelId}/discontinue"

  - priority: 7
    category: auth
    check: "when X-User-Role is Customer, X-User-ID equals the account_id of the target resource (Order.account_id, CoreReturn.account_id, WarrantyClaim.account_id, ServiceContract.account_id, or the account_id in the request body)"
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles include Customer"

  - priority: 8
    category: business_safety
    check: "segregation of duties: at shipment certification X-User-ID != Shipment.packed_by_user_id; at manifest filing X-User-ID != DisposalManifest.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /distribution/shipments/{shipmentId}/certify, POST /distribution/disposal-manifests/{disposalManifestId}/file"

  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /distribution/shipments, POST /distribution/service-contracts/{serviceContractId}/attach, POST /distribution/disposal-manifests/{disposalManifestId}/attach-core-return"

  - priority: 10
    category: state
    check: "the target row, and every other row named by the requested transition's preconditions (the manifest behind a scrap, the order behind a contract attachment, the storm event behind an allocation), is in a state that §1.2 declares acceptable for this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"

  - priority: 11
    category: state
    check: "Account.status == ACTIVE when submitting an order"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /distribution/orders/{orderId}/submit"

  - priority: 12
    category: state
    check: "Order.line_count >= 1 when submitting an order"
    error_id: ERR_ORDER_HAS_NO_LINES
    http_status: 422
    applies_to: "POST /distribution/orders/{orderId}/submit"

  - priority: 13
    category: state
    check: "CoreReturn.inspection_round < MAX_INSPECTION_ROUNDS when disputing"
    error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /distribution/core-returns/{coreReturnId}/dispute"

  - priority: 14
    category: state
    check: "InventoryLot.refresh_charge_count < MAX_REFRESH_CYCLES when refresh charging"
    error_id: ERR_REFRESH_CYCLES_EXHAUSTED
    http_status: 409
    applies_to: "POST /distribution/inventory-lots/{inventoryLotId}/refresh-charge"

  - priority: 15
    category: business_safety
    check: "when Shipment.hazmat_class_code != NON_REGULATED, the order's Warehouse.hazmat_endorsement == true"
    error_id: ERR_WAREHOUSE_NOT_HAZMAT_ENDORSED
    http_status: 422
    applies_to: "POST /distribution/shipments/{shipmentId}/certify with certification_decision == APPROVE"

  - priority: 16
    category: business_safety
    check: "Shipment.hazmat_class_code appears in Carrier.accepts_hazmat_classes"
    error_id: ERR_CARRIER_HAZMAT_REFUSED
    http_status: 422
    applies_to: "POST /distribution/shipments"

  - priority: 17
    category: business_safety
    check: "when Shipment.hazmat_class_code == UN3480_SECTION_IA, Carrier.ground_only == true"
    error_id: ERR_AIR_MODE_PROHIBITED
    http_status: 422
    applies_to: "POST /distribution/shipments"

  - priority: 18
    category: business_safety
    check: "for every line whose model chemistry is LITHIUM_IRON_PHOSPHATE, model.watt_hour_rating <= Carrier.max_lithium_watt_hours_per_package"
    error_id: ERR_LITHIUM_WH_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /distribution/shipments"

  - priority: 19
    category: business_referential
    check: "BatteryModel.status == ACTIVE when a new OrderLine names it"
    error_id: ERR_MODEL_DISCONTINUED
    http_status: 422
    applies_to: "POST /distribution/orders/{orderId}/lines"

  - priority: 20
    category: business_referential
    check: "the account referenced by the child matches the account on the linked parent: CoreReturn.account_id == Order.account_id, ServiceContract.account_id == Order.account_id at attach"
    error_id: ERR_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /distribution/core-returns, POST /distribution/service-contracts/{serviceContractId}/attach"

  - priority: 21
    category: business_referential
    check: "for a storm order, Account.state_code == StormEvent.region_state_code"
    error_id: ERR_STORM_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /distribution/orders/{orderId}/allocate"

  - priority: 22
    category: business_referential
    check: "the CoreReturn's source Order.fulfillment_status == DELIVERED"
    error_id: ERR_ORDER_NOT_DELIVERED
    http_status: 422
    applies_to: "POST /distribution/core-returns"

  - priority: 23
    category: business_fiscal
    check: "order.total_cents + account.open_receivable_cents - account.warranty_credit_cents <= account.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /distribution/orders/{orderId}/submit"

  - priority: 24
    category: business_fiscal
    check: "for a storm order, allocation_priority_score >= StormEvent.min_priority_score"
    error_id: ERR_STORM_PRIORITY_TOO_LOW
    http_status: 403
    applies_to: "POST /distribution/orders/{orderId}/allocate"

  - priority: 25
    category: business_fiscal
    check: "for a storm order, sum of line quantities <= StormEvent.remaining_pool_units"
    error_id: ERR_STORM_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /distribution/orders/{orderId}/allocate"

  - priority: 26
    category: business_temporal
    check: "date(current_utc) <= earliest core_due_by of the matching OrderLines + CORE_RETURN_GRACE_DAYS days; skipped entirely when no matching OrderLine carries a non-null core_due_by"
    error_id: ERR_CORE_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /distribution/core-returns"

  - priority: 27
    category: business_temporal
    check: "current_utc lies outside the CLOSED cooldown interval [last_refresh_charged_at, last_refresh_charged_at + REFRESH_COOLDOWN_HOURS hours]; a request landing exactly on the upper bound is inside the interval and is rejected"
    error_id: ERR_REFRESH_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /distribution/inventory-lots/{inventoryLotId}/refresh-charge"

  - priority: 28
    category: business_temporal
    check: "the new pickup window does not intersect, on HALF-OPEN [start, end) semantics, the window of any other Shipment on the same carrier_id whose status IN {PACKED, CERTIFIED, DISPATCHED}; touching windows (end == other start) do not intersect and are accepted"
    error_id: ERR_CARRIER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /distribution/shipments"

  - priority: 29
    category: business_temporal
    check: "current_utc >= Shipment.pickup_window_start and current_utc < Shipment.pickup_window_end at dispatch"
    error_id: ERR_DISPATCH_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /distribution/shipments/{shipmentId}/dispatch"

  - priority: 30
    category: business_temporal
    check: "the lot_allocation_selector empty-candidate fallback found a shelf-expired lot for the line"
    error_id: ERR_LOT_SHELF_EXPIRED
    http_status: 422
    applies_to: "POST /distribution/orders/{orderId}/allocate"

  - priority: 31
    category: business_constraint
    check: "the lot_allocation_selector empty-candidate fallback found a refresh-required lot for the line and no shelf-expired one"
    error_id: ERR_LOT_REFRESH_REQUIRED
    http_status: 422
    applies_to: "POST /distribution/orders/{orderId}/allocate"

  - priority: 32
    category: business_constraint
    check: "the lot_allocation_selector candidate set is empty and the fallback found neither a shelf-expired nor a refresh-required lot"
    error_id: ERR_INSUFFICIENT_SELLABLE_STOCK
    http_status: 422
    applies_to: "POST /distribution/orders/{orderId}/allocate"

  - priority: 33
    category: business_constraint
    check: "declared_core_count <= sum of core_expected_count over the source order's lines whose battery_model_id equals the return's battery_model_id, minus the declared_core_count already committed by that order's CoreReturns with status IN {SUBMITTED, INSPECTED, DISPUTED, CREDITED}"
    error_id: ERR_CORE_COUNT_EXCEEDS_PROMISE
    http_status: 422
    applies_to: "POST /distribution/core-returns"

  - priority: 34
    category: business_constraint
    check: "InventoryLot.quantity_reserved == 0 when scrapping"
    error_id: ERR_LOT_RESERVED
    http_status: 409
    applies_to: "POST /distribution/inventory-lots/{inventoryLotId}/scrap"

  - priority: 35
    category: business_constraint
    check: "the new shipment's total_weight_kg plus the total_weight_kg of every other Shipment at the same Warehouse whose status IN {PACKED, CERTIFIED, DISPATCHED} and whose pickup window intersects the new one on CLOSED [start, end] semantics (touching windows DO aggregate) is <= Warehouse.dock_capacity_kg_per_window"
    error_id: ERR_DOCK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /distribution/shipments"

  - priority: 36
    category: business_constraint
    check: "DisposalManifest.attached_core_return_count + scrapped_lot_count >= 1 at submit"
    error_id: ERR_MANIFEST_EMPTY
    http_status: 422
    applies_to: "POST /distribution/disposal-manifests/{disposalManifestId}/submit"

  - priority: 37
    category: business_constraint
    check: "DisposalManifest.total_lead_kg <= EPA_MANIFEST_MAX_LEAD_KG at attach, at scrap and at submit"
    error_id: ERR_MANIFEST_LEAD_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /distribution/disposal-manifests/{disposalManifestId}/attach-core-return, POST /distribution/inventory-lots/{inventoryLotId}/scrap, POST /distribution/disposal-manifests/{disposalManifestId}/submit"

  - priority: 38
    category: business_constraint
    check: "the runtime_sizing_selector candidate set is non-empty"
    error_id: ERR_NO_ELIGIBLE_BATTERY_MODEL
    http_status: 422
    applies_to: "POST /distribution/service-contracts/{serviceContractId}/size"

  - priority: 39
    category: business_constraint
    check: "BatteryModel.sku is unique across all BatteryModel rows; Warehouse.code and Carrier.code are unique within their own collections"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /distribution/battery-models, POST /distribution/warehouses, POST /distribution/carriers"

  - priority: 40
    category: business_constraint
    check: "WarrantyClaim.serial_number is unique across all WarrantyClaim rows"
    error_id: ERR_DUPLICATE_SERIAL_NUMBER
    http_status: 409
    applies_to: "POST /distribution/warranty-claims"

  - priority: 41
    category: business_constraint
    check: "no other Shipment for the same order_id has status IN {PACKED, CERTIFIED, DISPATCHED, DELIVERED}"
    error_id: ERR_SHIPMENT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /distribution/shipments"

  - priority: 42
    category: business_constraint
    check: "Shipment.carrier_id is not present in Order.rejected_carrier_ids at dispatch"
    error_id: ERR_CARRIER_PREVIOUSLY_REJECTED
    http_status: 409
    applies_to: "POST /distribution/shipments/{shipmentId}/dispatch"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ---- Accounts ------------------------------------------------------------
  - method: POST
    path: "/distribution/accounts"
    description: "Register a dealer / fleet account."
    roles: [PlatformAdmin]
    code: 201
    input: [name, account_tier, state_code, credit_limit_cents, "storm_priority_rank?"]
    output: Account
    side_effects: ["status initialised to ACTIVE; all four ledger fields initialised to 0"]

  - method: GET
    path: "/distribution/accounts/{accountId}"
    description: "Read one account including its live ledger fields."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Account
    side_effects: []

  # ---- Battery models ------------------------------------------------------
  - method: POST
    path: "/distribution/battery-models"
    description: "Add a catalog model; hazmat_class_code, hazmat_severity_rank and watt_hour_rating are derived from the body and any supplied value is ignored."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, chemistry, nominal_voltage, amp_hour_capacity, peukert_exponent, unit_weight_kg, lead_content_kg, core_deposit_cents, list_price_cents, warranty_free_replacement_months, warranty_prorata_months, shelf_life_days, self_discharge_pct_per_month]
    output: BatteryModel
    side_effects: ["runs calculation hazmat_classification, writing watt_hour_rating, hazmat_class_code and hazmat_severity_rank", "status initialised to ACTIVE, replacement_model_id to null"]

  - method: GET
    path: "/distribution/battery-models/{batteryModelId}"
    description: "Read one catalog model."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: BatteryModel
    side_effects: []

  - method: GET
    path: "/distribution/battery-models"
    description: "List catalog models. replacement_model_id resolves the self-referential supersession edge (which models point at this one)."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer, Customer]
    code: 200
    input: ["chemistry?", "status?", "replacement_model_id?", "limit?", "offset?"]
    output: BatteryModel[]
    side_effects: []

  - method: POST
    path: "/distribution/battery-models/{batteryModelId}/discontinue"
    description: "Retire a model and point it at its successor."
    roles: [PlatformAdmin]
    code: 200
    input: [replacement_model_id]
    output: BatteryModel
    side_effects: ["sets status to DISCONTINUED and writes replacement_model_id", "new OrderLines naming this model are refused with ERR_MODEL_DISCONTINUED; warranty settlements on it fall through to the replacement model"]

  # ---- Warehouses ----------------------------------------------------------
  - method: POST
    path: "/distribution/warehouses"
    description: "Register a distribution site."
    roles: [PlatformAdmin]
    code: 201
    input: [code, state_code, hazmat_endorsement, storm_reserve_pct, dock_capacity_kg_per_window]
    output: Warehouse
    side_effects: []

  - method: GET
    path: "/distribution/warehouses/{warehouseId}"
    description: "Read one site."
    roles: [PlatformAdmin, SalesRep, WarehouseOperator, HazmatCertifier, ComplianceOfficer]
    code: 200
    input: []
    output: Warehouse
    side_effects: []

  # ---- Carriers ------------------------------------------------------------
  - method: POST
    path: "/distribution/carriers"
    description: "Register a carrier and its hazmat tender rules."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, accepts_hazmat_classes, max_lithium_watt_hours_per_package, ground_only]
    output: Carrier
