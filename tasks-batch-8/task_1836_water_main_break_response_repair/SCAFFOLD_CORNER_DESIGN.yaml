        claim_type: violation_to_error
        grounds: [calculations.correlation_eligibility, "errors[ERR_CROSS_REFERENCE_MISMATCH]"]
        distinguishing_aspect: "Anomaly on segment A cannot correlate to a break confirmed on segment B -> ERR_CROSS_REFERENCE_MISMATCH."
