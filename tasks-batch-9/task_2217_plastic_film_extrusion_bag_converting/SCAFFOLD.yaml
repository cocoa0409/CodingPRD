# =============================================================================
# PRD Benchmark Seed Tables — task_2217 Plastic Film Extrusion & Bag Converting
# §1.0–§1.7.  Difficulty design (§1.8) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design (§1.9) lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2217. Plastic Film Extrusion & Bag Converting (blown film and bag manufacturer): resin selection and blend design across polyethylene grades with additive packages for strength, clarity and slip, blown or cast film extrusion with gauge control, layflat width and bubble stability management, multilayer coextrusion structure design for barrier and strength requirements, printing operations with plate management, color matching and registration control, converting to bags with sealing, perforation, gusseting and bottom seal strength testing, scrap regrind reincorporation limits by product and food contact status, food contact and recycled content compliance documentation, roll and case packaging with count accuracy and customer specification adherence

domain_name: film-extrusion-bag-converting

# Flat topology: every entity collection is rooted directly at the API root and
# entities are linked by explicit foreign keys (no nested ownership paths).
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency          # OCC on RegrindPool.version and BagLot.version
    - cascading_side_effects          # 5-hop chains from run completion and dossier revocation
    - dual_variant_calculation        # nominal vs as-built recycled content; provisional vs final seal
    - derived_field_reconciliation    # pool mass balance, line posture, blend indices
    - rate_threshold_triggers         # Cpk bands, regrind caps, partial-case threshold

  entity_topology: flat
  # 13 peer entities linked by FK fields; no nesting in resource paths. Action
  # sub-paths (/extrusion-runs/{id}/complete) are verbs, not ownership segments.

  state_machine_shape: cyclic
  # BlendRecipe (SUBMITTED->REJECTED->DRAFT->SUBMITTED) and ExtrusionRun
  # (RUNNING<->HELD) are cyclic; PrintJob carries three independent state
  # dimensions (status x registration_state x color_state); BagLot forks at
  # finalize-tests into QUALIFIED / CONDITIONAL / FAILED with divergent side
  # effects; ExtrusionLine.posture is a derived aggregate that gates children.

  relationship_patterns:
    - one_to_many          # ExtrusionRun -> FilmRoll, BagLot -> seal specimens
    - self_referential     # BlendRecipe.supersedes_recipe_id, RegrindTransaction.reverses_transaction_id
    - polymorphic          # RegrindTransaction.origin_kind + origin_ref_id
    - cross_aggregate      # BagLot -> PrintJob -> FilmRoll -> ExtrusionRun -> ExtrusionLine

  role_model: segregation_of_duties
  # Six opaque operator roles. Two SoD invariants: the X-User-ID that submitted a
  # BlendRecipe may not approve it; the X-User-ID that entered any bottom-seal
  # specimen for a BagLot may not issue that lot's ComplianceDossier.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 62 endpoints / 58 error codes / 10 calculations / 8 state
  # machines / 2 OCC rules. Density target: every calculation reads fields
  # written by another entity's state transition.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: "Customer-facing product code"
        constraints: "unique across Product; 1..40 chars"
      - name: customer_code
        type: string
        source: input
        description: "Code of the customer owning this specification"
      - name: bag_style
        type: enum
        source: input
        description: "Converting style of the finished bag"
        constraints: "one of FLAT | GUSSETED | BOTTOM_SEAL_LINER"
      - name: food_contact_required
        type: boolean
        source: input
        description: "True when the product must satisfy food-contact rules"
        default: false
      - name: target_gauge_micron
        type: number
        source: input
        description: "Nominal film thickness target in micron"
        constraints: "> 0"
      - name: gauge_tolerance_pct
        type: number
        source: input
        description: "Symmetric gauge tolerance band as percent of target; USL = target*(1+p/100), LSL = target*(1-p/100)"
        default: 8.0
        constraints: "> 0 and < 100"
      - name: layflat_width_mm
        type: number
        source: input
        description: "Target layflat width of the tube in mm"
        constraints: "> 0"
      - name: bag_length_mm
        type: number
        source: input
        description: "Cut length of the finished bag in mm"
        constraints: "> 0"
      - name: gusset_depth_mm
        type: number
        source: input
        description: "Side gusset depth in mm"
        default: 0.0
        constraints: ">= 0; must be > 0 when bag_style == GUSSETED"
      - name: perforation_required
        type: boolean
        source: input
        description: "True when the converted bag must carry a perforation line"
        default: false
      - name: min_bottom_seal_n_per_15mm
        type: number
        source: input
        description: "Customer bottom-seal strength specification in newton per 15 mm"
        constraints: "> 0"
      - name: min_strength_index
        type: number
        source: input
        description: "Minimum acceptable BlendRecipe.strength_index for this product"
        constraints: ">= 0"
      - name: max_regrind_pct_food
        type: number
        source: input
        description: "Base regrind cap (percent of blend weight) applied when food_contact_required is true"
        default: 10.0
      - name: max_regrind_pct_nonfood
        type: number
        source: input
        description: "Base regrind cap (percent of blend weight) applied when food_contact_required is false"
        default: 35.0
      - name: declared_recycled_content_pct
        type: number
        source: input
        description: "Recycled-content percentage printed on customer documentation"
        default: 0.0
      - name: assumed_regrind_pcr_pct
        type: number
        source: input
        description: "Nominal PCR content assumed for regrind when computing BlendRecipe.nominal_recycled_content_pct"
        default: 0.0
      - name: bags_per_case
        type: integer
        source: input
        description: "Bag count of a full case"
        constraints: "> 0"
      - name: min_partial_case_bags
        type: integer
        source: input
        description: "Minimum bag count for a partial case to be shippable as a billable case"
        default: 0
        constraints: ">= 0 and <= bags_per_case"
      - name: cases_per_pallet
        type: integer
        source: input
        description: "Case count of a full pallet"
        constraints: "> 0"
      - name: count_accuracy_tolerance_pct
        type: number
        source: input
        description: "Maximum absolute deviation of BagLot.count_accuracy_pct from 100.00 accepted at release"
        default: 2.0
      - name: required_layer_count
        type: integer
        source: input
        description: "Coextrusion layer count the BlendRecipe must declare"
        default: 1
        constraints: ">= 1 and <= 9"

  - name: ResinGrade
    parent: null
    common_fields: true
    fields:
      - name: grade_code
        type: string
        source: input
        description: "Resin or masterbatch grade code"
        constraints: "unique across ResinGrade"
      - name: material_class
        type: enum
        source: input
        description: "Role of the material in a blend"
        constraints: "one of VIRGIN_RESIN | ADDITIVE_MASTERBATCH"
      - name: polymer_family
        type: enum
        source: input
        description: "Polymer family of the grade"
        constraints: "one of LDPE | LLDPE | HDPE | MDPE | EVOH | TIE"
      - name: melt_index
        type: number
        source: input
        description: "Melt flow index (g/10min)"
      - name: density_kg_m3
        type: number
        source: input
        description: "Solid density in kg per cubic metre"
        constraints: "> 0"
      - name: food_contact_approved
        type: boolean
        source: input
        description: "True when the grade carries food-contact approval"
        default: false
      - name: pcr_content_pct
        type: number
        source: input
        description: "Post-consumer-recycled content of the grade in percent"
        default: 0.0
        constraints: ">= 0 and <= 100"
      - name: cost_per_kg
        type: number
        source: input
        description: "Purchase cost per kg"
        constraints: ">= 0"
      - name: dart_impact_index
        type: number
        source: input
        description: "Relative dart-impact contribution used by strength_index"
      - name: haze_index
        type: number
        source: input
        description: "Relative haze contribution used by clarity_index (lower is clearer)"
      - name: cof_index
        type: number
        source: input
        description: "Coefficient-of-friction contribution used by slip_index (lower is slipperier)"
      - name: seal_initiation_temp_c
        type: number
        source: input
        description: "Seal initiation temperature in celsius"
      - name: is_barrier
        type: boolean
        source: input
        description: "True when the grade functions as a barrier layer material"
        default: false

  - name: BlendRecipe
    parent: null
    common_fields: true
    fields:
      - name: recipe_code
        type: string
        source: input
        description: "Recipe code"
        constraints: "unique across BlendRecipe"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this recipe is designed for"
      - name: supersedes_recipe_id
        type: string
        source: input
        description: "FK -> BlendRecipe.id; the APPROVED predecessor this recipe replaces on approval (null for a first-generation recipe)"
        default: null
      - name: process_type
        type: enum
        source: input
        description: "Extrusion process the recipe is designed for"
        constraints: "one of BLOWN | CAST"
      - name: layer_count
        type: integer
        source: input
        description: "Number of coextrusion layers declared by this recipe"
        constraints: ">= 1 and <= 9"
      - name: components
        type: array
        source: system
        description: "Append-only component list, one object per POST /blend-recipes/{id}/components call, in call order"
        default: []
        constraints: "object shape { layer_index: integer, component_kind: VIRGIN|ADDITIVE|REGRIND, resin_grade_id: string|null, weight_pct: number, position: integer }; position is the 1-based append index"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID that performed the most recent submit"
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID that approved this recipe"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Reason captured at reject"
        default: null
      - name: total_weight_pct
        type: number
        source: computed
        description: "Sum of components[].weight_pct, 3 dp"
        default: 0.0
      - name: regrind_pct
        type: number
        source: computed
        description: "Sum of weight_pct over components with component_kind == REGRIND, 3 dp"
        default: 0.0
      - name: additive_pct
        type: number
        source: computed
        description: "Sum of weight_pct over components with component_kind == ADDITIVE, 3 dp"
        default: 0.0
      - name: hdpe_pct
        type: number
        source: computed
        description: "Sum of weight_pct over VIRGIN components whose resin polymer_family == HDPE, 3 dp"
        default: 0.0
      - name: dominant_polymer_family
        type: enum
        source: computed
        description: "Polymer family with the greatest VIRGIN weight_pct total; tie-break polymer_family ASC; null when no VIRGIN component exists"
        default: null
        constraints: "one of LDPE | LLDPE | HDPE | MDPE | EVOH | TIE | null"
      - name: barrier_layer_present
        type: boolean
        source: computed
        description: "True when any VIRGIN or ADDITIVE component's resin has is_barrier == true"
        default: false
      - name: blend_cost_per_kg
        type: number
        source: computed
        description: "Per-component cost contribution rounded to 2 dp then summed then rounded to 2 dp (see calculations.blend_cost_and_density)"
        default: 0.0
      - name: blended_density_kg_m3
        type: number
        source: computed
        description: "Per-component density contribution rounded to 2 dp then summed then rounded to 2 dp"
        default: 0.0
      - name: strength_index
        type: number
        source: computed
        description: "Non-linear strength score, 2 dp (see calculations.blend_property_indices)"
        default: 0.0
      - name: clarity_index
        type: number
        source: computed
        description: "Clarity score 0..100, 2 dp"
        default: 0.0
      - name: slip_index
        type: number
        source: computed
        description: "Slip score 0..100, 2 dp"
        default: 0.0
      - name: virgin_pcr_pct
        type: number
        source: computed
        description: "PCR percentage contributed by VIRGIN components only, 3 dp (step 2 of calculations.regrind_cap_evaluation)"
        default: 0.0
      - name: pcr_band
        type: enum
        source: computed
        description: "Band selected from virgin_pcr_pct in step 3 of calculations.regrind_cap_evaluation"
        default: LOW
        constraints: "one of LOW | MID | HIGH"
      - name: regrind_cap_pct
        type: number
        source: computed
        description: "Regrind cap after band adjustment, 3 dp"
        default: 0.0
      - name: nominal_recycled_content_pct
        type: number
        source: computed
        description: "Nominal variant of recycled content: virgin_pcr_pct + regrind_pct/100 * product.assumed_regrind_pcr_pct, 3 dp"
        default: 0.0
      - name: food_contact_eligible
        type: boolean
        source: computed
        description: "True when the product is non-food, or every VIRGIN/ADDITIVE resin is food_contact_approved and regrind_pct <= regrind_cap_pct"
        default: false
      - name: pinned_run_count
        type: integer
        source: computed
        description: "Count of ExtrusionRun rows referencing this recipe with status IN {SCHEDULED, RUNNING, HELD}"
        default: 0
      - name: supersede_pending
        type: boolean
        source: system
        description: "Set true when a successor recipe was approved while pinned_run_count > 0; the recipe auto-transitions APPROVED -> SUPERSEDED once pinned_run_count reaches 0"
        default: false

  - name: ExtrusionLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: "Line code"
        constraints: "unique across ExtrusionLine"
      - name: process_type
        type: enum
        source: input
        description: "Process the line runs"
        constraints: "one of BLOWN | CAST"
      - name: max_layers
        type: integer
        source: input
        description: "Number of extruders/layers the line can coextrude"
        constraints: ">= 1"
      - name: min_gauge_micron
        type: number
        source: input
        description: "Thinnest gauge the line can hold"
      - name: max_gauge_micron
        type: number
        source: input
        description: "Thickest gauge the line can hold"
      - name: max_layflat_mm
        type: number
        source: input
        description: "Widest layflat the line can produce"
      - name: purge_buffer_minutes
        type: integer
        source: input
        description: "Changeover purge time required between two runs that differ in blend recipe or in food-contact status"
        default: 45
        constraints: ">= 0"
      - name: food_contact_certified
        type: boolean
        source: input
        description: "True when the line is certified for food-contact production"
        default: false
      - name: posture
        type: enum
        source: computed
        description: "Derived aggregate gate over the line's runs and revoked dossiers (see calculations.line_posture)"
        default: OPEN
        constraints: "one of OPEN | RESTRICTED | FROZEN"
      - name: incapable_run_count
        type: integer
        source: computed
        description: "Count of INCAPABLE runs inside the posture window"
        default: 0
      - name: active_hold_count
        type: integer
        source: computed
        description: "Count of ExtrusionRun rows on this line with status == HELD"
        default: 0
      - name: revoked_dossier_count
        type: integer
        source: computed
        description: "Count of REVOKED ComplianceDossier rows traceable to this line"
        default: 0

  - name: ExtrusionRun
    parent: null
    common_fields: true
    fields:
      - name: run_code
        type: string
        source: input
        description: "Run code"
        constraints: "unique across ExtrusionRun"
      - name: line_id
        type: string
        source: input
        description: "FK -> ExtrusionLine.id; the line occupied by this run"
      - name: blend_recipe_id
        type: string
        source: input
        description: "FK -> BlendRecipe.id; the recipe pinned by this run"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the line occupation window (inclusive)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the line occupation window (exclusive)"
        constraints: "> scheduled_start"
      - name: target_output_kg
        type: number
        source: input
        description: "Planned good output in kg; the regrind reincorporation budget is derived from it"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: SCHEDULED
        constraints: "one of SCHEDULED | RUNNING | HELD | COMPLETED | BLOCKED"
      - name: hold_count
        type: integer
        source: system
        description: "Number of times this run has been placed on hold"
        default: 0
      - name: hold_reason
        type: string
        source: input
        description: "Reason recorded by the most recent hold"
        default: null
      - name: gauge_readings
        type: array
        source: system
        description: "Append-only gauge sample log, one object per POST /extrusion-runs/{id}/gauge-readings call, in call order"
        default: []
        constraints: "object shape { seq: integer, thickness_micron: number, layflat_mm: number, bubble_deviation_mm: number, recorded_at: datetime }; seq is the 1-based append index"
      - name: gauge_sample_count
        type: integer
        source: computed
        description: "Length of gauge_readings"
        default: 0
      - name: gauge_mean_micron
        type: number
        source: computed
        description: "Mean thickness, 3 dp; null while gauge_sample_count < 5"
        default: null
      - name: gauge_sd_micron
        type: number
        source: computed
        description: "Population standard deviation of thickness (divide by n), 4 dp; null while gauge_sample_count < 5"
        default: null
      - name: gauge_cv_pct
        type: number
        source: computed
        description: "gauge_sd_micron / gauge_mean_micron * 100, 3 dp; null while gauge_sample_count < 5"
        default: null
      - name: gauge_capability_index
        type: number
        source: computed
        description: "Cpk against the product gauge tolerance band, 3 dp; null while gauge_sample_count < 5"
        default: null
      - name: gauge_capability_state
        type: enum
        source: computed
        description: "Band derived from the rounded gauge_capability_index"
        default: INSUFFICIENT_DATA
        constraints: "one of INSUFFICIENT_DATA | CAPABLE | MARGINAL | INCAPABLE"
      - name: layflat_deviation_max_mm
        type: number
        source: computed
        description: "Maximum absolute deviation of gauge_readings[].layflat_mm from product.layflat_width_mm, 2 dp; null when gauge_readings is empty"
        default: null
      - name: bubble_instability_events
        type: integer
        source: computed
        description: "Count of gauge_readings whose abs(bubble_deviation_mm) > BUBBLE_LIMIT_MM"
        default: 0
      - name: gross_output_kg
        type: number
        source: input
        description: "Total extruded mass reported at completion"
        default: null
      - name: scrap_kg
        type: number
        source: input
        description: "Scrap mass reported at completion; converted to a regrind IN transaction"
        default: null
      - name: net_good_kg
        type: number
        source: computed
        description: "gross_output_kg - scrap_kg, 3 dp"
        default: null
      - name: regrind_consumed_kg
        type: number
        source: computed
        description: "Sum of kg over non-reversed REINCORPORATION transactions on this run, 3 dp"
        default: 0.0
      - name: regrind_actual_pct
        type: number
        source: computed
        description: "regrind_consumed_kg / gross_output_kg * 100, 3 dp; null before completion"
        default: null
      - name: pcr_mass_kg
        type: number
        source: computed
        description: "As-built post-consumer-recycled mass in the run output, 3 dp"
        default: null
      - name: actual_recycled_content_pct
        type: number
        source: computed
        description: "As-built variant of recycled content: pcr_mass_kg / gross_output_kg * 100, 3 dp; null before completion"
        default: null
      - name: recipe_pin_released
        type: boolean
        source: system
        description: "True once this run no longer pins its recipe (set on COMPLETED and on BLOCKED)"
        default: false

  - name: FilmRoll
    parent: null
    common_fields: true
    fields:
      - name: extrusion_run_id
        type: string
        source: input
        description: "FK -> ExtrusionRun.id; the run that wound this roll"
      - name: roll_number
        type: integer
        source: input
        description: "Roll sequence number within the run"
        constraints: "> 0; unique per extrusion_run_id"
      - name: net_kg
        type: number
        source: input
        description: "Net film mass on the roll"
        constraints: "> 0"
      - name: layflat_mm
        type: number
        source: input
        description: "Measured layflat width of the wound roll"
      - name: gauge_micron_avg
        type: number
        source: input
        description: "Average measured gauge of the roll"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: WOUND
        constraints: "one of WOUND | QUARANTINED | RELEASED | CONSUMED | SCRAPPED"
      - name: actual_recycled_content_pct
        type: number
        source: computed
        description: "Copy of the producing ExtrusionRun.actual_recycled_content_pct, refreshed whenever that field changes; null before the run completes"
        default: null
      - name: release_blocked_reason
        type: string
        source: system
        description: "Reason stamped when a release attempt was rejected"
        default: null

  - name: RegrindPool
    parent: null
    common_fields: true
    fields:
      - name: pool_code
        type: string
        source: input
        description: "Pool code"
        constraints: "unique across RegrindPool"
      - name: food_contact_status
        type: enum
        source: input
        description: "Whether material in this pool may re-enter food-contact product"
        constraints: "one of FOOD_CONTACT_ELIGIBLE | NON_FOOD_ONLY"
      - name: polymer_family
        type: enum
        source: input
        description: "Polymer family segregation of the pool"
        constraints: "one of LDPE | LLDPE | HDPE | MDPE"
      - name: available_kg
        type: number
        source: computed
        description: "cumulative_in_kg - cumulative_out_kg, 3 dp (invariant I1)"
        default: 0.0
      - name: cumulative_in_kg
        type: number
        source: computed
        description: "Sum of kg over non-reversed IN transactions, 3 dp"
        default: 0.0
      - name: cumulative_out_kg
        type: number
        source: computed
        description: "Sum of kg over non-reversed OUT transactions, 3 dp"
        default: 0.0
      - name: cumulative_in_pcr_kg
        type: number
        source: computed
        description: "Sum of pcr_kg over non-reversed IN transactions, 3 dp"
        default: 0.0
      - name: embedded_pcr_pct
        type: number
        source: computed
        description: "cumulative_in_pcr_kg / cumulative_in_kg * 100, 3 dp; 0.000 when cumulative_in_kg == 0"
        default: 0.0
      - name: generation_count
        type: integer
        source: computed
        description: "Count of non-reversed IN transactions"
        default: 0
      - name: reincorporation_count
        type: integer
        source: computed
        description: "Count of non-reversed OUT transactions"
        default: 0

  - name: RegrindTransaction
    parent: null
    common_fields: false
    fields:
      - name: pool_id
        type: string
        source: input
        description: "FK -> RegrindPool.id; the pool this transaction moves mass through"
      - name: extrusion_run_id
        type: string
        source: input
        description: "FK -> ExtrusionRun.id; the run that generated (EXTRUSION_SCRAP) or consumed (REINCORPORATION) the mass; null for ROLL_SCRAP, LOT_SCRAP and REVERSAL"
        default: null
      - name: reverses_transaction_id
        type: string
        source: input
        description: "FK -> RegrindTransaction.id; the transaction this REVERSAL undoes; null otherwise"
        default: null
      - name: direction
        type: enum
        source: system
        description: "Whether mass enters or leaves the pool"
        constraints: "one of IN | OUT"
      - name: origin_kind
        type: enum
        source: system
        description: "What produced this transaction"
        constraints: "one of EXTRUSION_SCRAP | ROLL_SCRAP | LOT_SCRAP | REINCORPORATION | REVERSAL"
      - name: origin_ref_id
        type: string
        source: system
        description: "Polymorphic origin reference resolved by origin_kind: FilmRoll.id when origin_kind == ROLL_SCRAP, BagLot.id when origin_kind == LOT_SCRAP, null for every other origin_kind"
        default: null
      - name: kg
        type: number
        source: input
        description: "Mass moved, always positive; a REVERSAL carries the reversed transaction's kg"
        constraints: "> 0"
      - name: pcr_kg
        type: number
        source: computed
        description: "Post-consumer-recycled mass carried by this transaction, 3 dp"
        default: 0.0
      - name: pool_available_kg_after
        type: number
        source: computed
        description: "Snapshot of RegrindPool.available_kg immediately after this transaction was applied, 3 dp"
      - name: reversal_reason
        type: string
        source: input
        description: "Reason recorded on a REVERSAL transaction"
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp at which the transaction was applied"

  - name: PrintPress
    parent: null
    common_fields: true
    fields:
      - name: press_code
        type: string
        source: input
        description: "Press code"
        constraints: "unique across PrintPress"
      - name: cylinder_capacity
        type: integer
        source: input
        description: "Total print stations available concurrently on the press"
        constraints: ">= 1"
      - name: max_colors
        type: integer
        source: input
        description: "Maximum colors a single plate set may carry on this press"
        constraints: ">= 1"
      - name: registration_tolerance_micron
        type: number
        source: input
        description: "Maximum registration drift accepted on this press"
        constraints: "> 0"
      - name: max_delta_e
        type: number
        source: input
        description: "Maximum color deviation (delta-E) accepted on this press"
        default: 2.0

  - name: PlateSet
    parent: null
    common_fields: true
    fields:
      - name: plate_code
        type: string
        source: input
        description: "Plate set code"
        constraints: "unique across PlateSet"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this plate set prints"
      - name: color_count
        type: integer
        source: input
        description: "Number of colors (and therefore cylinders) the plate set occupies"
        constraints: ">= 1"
      - name: mounted_press_id
        type: string
        source: system
        description: "FK -> PrintPress.id; the press this plate set is currently mounted on; null when status != MOUNTED"
        default: null
      - name: wear_limit_impressions
        type: integer
        source: input
        description: "Impression count at which the plate set may no longer be mounted"
        default: 500000
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: NEW
        constraints: "one of NEW | MOUNTED | WORN"
      - name: impressions_count
        type: integer
        source: computed
        description: "Cumulative impressions; incremented by floor(PrintJob.printed_kg) on each print job completion"
        default: 0
      - name: nonconformance_count
        type: integer
        source: computed
        description: "Count of dossier revocations traced back to lots printed with this plate set"
        default: 0

  - name: PrintJob
    parent: null
    common_fields: true
    fields:
      - name: job_code
        type: string
        source: input
        description: "Print job code"
        constraints: "unique across PrintJob"
      - name: film_roll_id
        type: string
        source: input
        description: "FK -> FilmRoll.id; the roll fed into the press"
      - name: plate_set_id
        type: string
        source: input
        description: "FK -> PlateSet.id; the mounted plate set used"
      - name: press_id
        type: string
        source: input
        description: "FK -> PrintPress.id; the press whose cylinders this job occupies"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the press cylinder occupation window (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "End of the press cylinder occupation window (exclusive)"
        constraints: "> window_start"
      - name: cylinders_required
        type: integer
        source: computed
        description: "Copy of PlateSet.color_count frozen at job creation"
      - name: status
        type: enum
        source: system
        description: "Primary lifecycle dimension"
        default: SETUP
        constraints: "one of SETUP | PRINTING | COMPLETED | BLOCKED"
      - name: registration_state
        type: enum
        source: system
        description: "Registration dimension, evolving independently of status and color_state"
        default: REG_PENDING
        constraints: "one of REG_PENDING | REG_PASS | REG_FAIL"
      - name: color_state
        type: enum
        source: system
        description: "Color-match dimension, evolving independently of status and registration_state"
        default: COLOR_PENDING
        constraints: "one of COLOR_PENDING | COLOR_PASS | COLOR_FAIL"
      - name: registration_drift_micron
        type: number
        source: input
        description: "Most recent measured registration drift"
        default: null
      - name: delta_e_measured
        type: number
        source: input
        description: "Most recent measured color deviation"
        default: null
      - name: setup_attempt_count
        type: integer
        source: computed
        description: "Number of registration-check plus color-proof calls recorded on this job"
        default: 0
      - name: printed_kg
        type: number
        source: input
        description: "Printed mass reported at completion"
        default: null
      - name: blocked_reason
        type: string
        source: system
        description: "Reason stamped when the job was auto-blocked"
        default: null

  - name: BagLot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: "Bag lot code"
        constraints: "unique across BagLot"
      - name: print_job_id
        type: string
        source: input
        description: "FK -> PrintJob.id; the completed print job converted into this lot"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; must equal the plate set's product of the print job"
      - name: bag_count_produced
        type: integer
        source: input
        description: "Bags counted off the converting line; immutable after creation"
        constraints: "> 0"
      - name: bag_count_scrapped
        type: integer
        source: computed
        description: "Bags written off; seeded from the create payload and increased on the FAILED branch"
        default: 0
      - name: bag_count_unpacked
        type: integer
        source: computed
        description: "bag_count_produced - bag_count_scrapped - packed_bag_count (conservation invariant)"
      - name: packed_bag_count
        type: integer
        source: computed
        description: "Cumulative bags committed into cases across all packout calls"
        default: 0
      - name: packed_case_count
        type: integer
        source: computed
        description: "Cumulative billable case count across all packout calls"
        default: 0
      - name: partial_case_bag_count
        type: integer
        source: computed
        description: "Cumulative bags sitting in partial (short) cases"
        default: 0
      - name: pallet_count
        type: integer
        source: computed
        description: "ceil(packed_case_count / product.cases_per_pallet), recomputed from the cumulative case count on every packout"
        default: 0
      - name: bag_unit_weight_kg
        type: number
        source: computed
        description: "Theoretical mass of one bag, 6 dp (see calculations.bag_count_and_accuracy)"
      - name: bag_count_theoretical
        type: integer
        source: computed
        description: "floor(print_job.printed_kg / bag_unit_weight_kg)"
      - name: count_accuracy_pct
        type: number
        source: computed
        description: "bag_count_produced / bag_count_theoretical * 100, 2 dp; null when bag_count_theoretical == 0"
        default: null
      - name: count_accuracy_conforming
        type: boolean
        source: computed
        description: "abs(count_accuracy_pct - 100.00) <= product.count_accuracy_tolerance_pct"
        default: false
      - name: seal_specimens
        type: array
        source: system
        description: "Append-only seal specimen log, one object per POST /bag-lots/{id}/seal-tests call, in call order"
        default: []
        constraints: "object shape { specimen_index: integer, attempt: integer, test_kind: BOTTOM_SEAL|SIDE_SEAL|PERFORATION, measured_n_per_15mm: number, is_retest: boolean, entered_by_user_id: string, recorded_at: datetime }"
      - name: seal_provisional_mean_n
        type: number
        source: computed
        description: "Provisional variant: mean of first-pass BOTTOM_SEAL specimens, 2 dp; null while fewer than 3 exist"
        default: null
      - name: seal_provisional_verdict
        type: enum
        source: computed
        description: "Provisional verdict recomputed on every seal specimen append"
        default: PENDING
        constraints: "one of PENDING | PASS | FAIL"
      - name: seal_final_min_n
        type: number
        source: computed
        description: "Final variant: minimum over the superseding panel, 2 dp; null before finalize-tests"
        default: null
      - name: seal_final_mean_n
        type: number
        source: computed
        description: "Final variant: mean over the superseding panel, 2 dp; null before finalize-tests"
        default: null
      - name: seal_final_verdict
        type: enum
        source: computed
        description: "Final verdict written by finalize-tests"
        default: PENDING
        constraints: "one of PENDING | PASS | CONDITIONAL | FAIL"
      - name: perforation_verified
        type: boolean
        source: input
        description: "Converting operator confirmation that the perforation line was verified"
        default: false
      - name: gusset_verified
        type: boolean
        source: input
        description: "Converting operator confirmation that gusset depth was verified"
        default: false
      - name: actual_recycled_content_pct
        type: number
        source: computed
        description: "Copy of the producing FilmRoll.actual_recycled_content_pct, refreshed whenever that field changes"
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: CONVERTING
        constraints: "one of CONVERTING | TESTING | QUALIFIED | CONDITIONAL | FAILED | PACKED | RELEASED | SHIPPED | QUARANTINED"
      - name: quarantine_reason
        type: string
        source: system
        description: "Reason stamped when the lot was quarantined by a dossier revocation"
        default: null

  - name: ComplianceDossier
    parent: null
    common_fields: true
    fields:
      - name: dossier_code
        type: string
        source: input
        description: "Dossier code"
        constraints: "unique across ComplianceDossier"
      - name: bag_lot_id
        type: string
        source: input
        description: "FK -> BagLot.id; the lot this dossier documents"
      - name: food_contact_declared
        type: boolean
        source: input
        description: "Food-contact declaration asserted by the dossier"
      - name: recycled_content_claim_pct
        type: number
        source: input
        description: "Recycled-content percentage claimed by the dossier"
        constraints: ">= 0 and <= 100"
      - name: as_built_recycled_content_pct
        type: number
        source: computed
        description: "Copy of BagLot.actual_recycled_content_pct frozen at issue; null while DRAFT"
        default: null
      - name: claim_variance_pct
        type: number
        source: computed
        description: "recycled_content_claim_pct - as_built_recycled_content_pct, 3 dp; null while DRAFT"
        default: null
      - name: claim_conformance
        type: enum
        source: computed
        description: "CONFORMING when abs(claim_variance_pct) <= CLAIM_TOLERANCE_PCT, OVERSTATED when claim_variance_pct > CLAIM_TOLERANCE_PCT, UNDERSTATED otherwise; PENDING while DRAFT"
        default: PENDING
        constraints: "one of PENDING | CONFORMING | OVERSTATED | UNDERSTATED"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT | ISSUED | REVOKED"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID that issued the dossier"
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of issue"
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of revocation"
        default: null
      - name: revocation_reason
        type: string
        source: input
        description: "Reason recorded at revocation"
        default: null

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  # --- 1. BlendRecipe: branching-with-revert + cyclic (REJECTED -> DRAFT) -----
  - entity: BlendRecipe
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /blend-recipes/{id}/submit"
        actor: BlendEngineer
        preconditions:
          - "total_weight_pct == 100.000"
          - "layer_count == product.required_layer_count"
          - "components is non-empty and every components[].layer_index <= layer_count"
          - "when product.food_contact_required: every VIRGIN/ADDITIVE component's resin has food_contact_approved == true"
          - "regrind_pct <= regrind_cap_pct"
          - "when product.required_layer_count >= 3: barrier_layer_present == true"
          - "strength_index >= product.min_strength_index"
        side_effects:
          - "recomputes calculations.blend_composition_totals, blend_cost_and_density, blend_property_indices, regrind_cap_evaluation"
          - "sets submitted_by_user_id to the acting X-User-ID"
          - "clears rejection_reason"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /blend-recipes/{id}/approve"
        actor: QualityManager
        preconditions:
          - "acting X-User-ID != submitted_by_user_id (segregation of duties)"
          - "when supersedes_recipe_id is not null: that recipe status == APPROVED and its product_id == this recipe's product_id"
        side_effects:
          - "sets approved_by_user_id and food_contact_eligible"
          - "when supersedes_recipe_id is not null and the predecessor's pinned_run_count == 0: predecessor -> SUPERSEDED"
          - "when supersedes_recipe_id is not null and the predecessor's pinned_run_count > 0: predecessor.supersede_pending = true (deferred supersede)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /blend-recipes/{id}/reject"
        actor: QualityManager
        preconditions:
          - "acting X-User-ID != submitted_by_user_id (segregation of duties)"
          - "rejection_reason is present in the payload"
        side_effects: ["stores rejection_reason"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /blend-recipes/{id}/reopen"
        actor: BlendEngineer
        preconditions: ["no ExtrusionRun references this recipe with status IN {SCHEDULED, RUNNING, HELD}"]
        side_effects:
          - "clears submitted_by_user_id and rejection_reason"
          - "components remain and may be extended by further POST /blend-recipes/{id}/components calls"
        note: "Cycle: DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED. Each pass re-runs every blend calculation against the extended component list."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: successor recipe approved (immediate), or supersede_pending recipe's pinned_run_count reaches 0 via ExtrusionRun completion/blocking (deferred)"
        actor: system
        preconditions: ["pinned_run_count == 0", "a successor recipe with supersedes_recipe_id == this.id has status APPROVED"]
        side_effects:
          - "clears supersede_pending"
          - "further POST /extrusion-runs referencing this recipe are rejected with ERR_RECIPE_NOT_APPROVED"

  # --- 2. ExtrusionRun: cyclic (RUNNING <-> HELD) ----------------------------
  - entity: ExtrusionRun
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, BLOCKED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /extrusion-runs/{id}/start"
        actor: ExtrusionOperator
        preconditions:
          - "line.posture != FROZEN"
          - "blend_recipe.status == APPROVED"
          - "when product.food_contact_required: line.food_contact_certified == true"
          - "current logical clock >= scheduled_start"
        side_effects: ["line.active_hold_count and line.posture re-derived"]
      - from: RUNNING
        to: HELD
        trigger: "POST /extrusion-runs/{id}/hold"
        actor: ExtrusionOperator
        preconditions: ["hold_reason is present in the payload"]
        side_effects:
          - "increments hold_count"
          - "increments line.active_hold_count and re-derives line.posture"
      - from: HELD
        to: RUNNING
        trigger: "POST /extrusion-runs/{id}/resume"
        actor: ExtrusionOperator
        preconditions: ["line.posture != FROZEN", "hold_count <= MAX_RUN_HOLDS"]
        side_effects:
          - "clears hold_reason"
          - "decrements line.active_hold_count and re-derives line.posture"
        note: "Cyclic: a run may be held and resumed repeatedly until hold_count exceeds MAX_RUN_HOLDS (3), after which resume is rejected with ERR_RUN_HOLD_LIMIT_EXCEEDED and the run can only be completed or blocked."
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /extrusion-runs/{id}/complete"
        actor: ExtrusionOperator
        preconditions:
          - "gauge_sample_count >= MIN_GAUGE_SAMPLES"
          - "scrap_kg <= gross_output_kg"
          - "an eligible RegrindPool exists for the scrap (matching polymer family and food-contact status)"
        side_effects:
          - "runs calculations.gauge_capability -> gauge_capability_index and gauge_capability_state"
          - "runs calculations.run_mass_balance -> net_good_kg, regrind_actual_pct, pcr_mass_kg, actual_recycled_content_pct"
          - "propagates actual_recycled_content_pct to every FilmRoll of this run"
          - "creates a RegrindTransaction (direction IN, origin_kind EXTRUSION_SCRAP, kg = scrap_kg) and re-derives RegrindPool aggregates"
          - "sets recipe_pin_released = true and decrements blend_recipe.pinned_run_count"
          - "when gauge_capability_state == INCAPABLE: increments line.incapable_run_count"
          - "re-derives line.posture (cascade root A)"
      - from: SCHEDULED
        to: BLOCKED
        trigger: "system: line.posture becomes FROZEN"
        actor: system
        preconditions: ["status == SCHEDULED", "line.posture == FROZEN"]
        side_effects:
          - "sets recipe_pin_released = true and decrements blend_recipe.pinned_run_count"
          - "when the recipe now has supersede_pending == true and pinned_run_count == 0: recipe -> SUPERSEDED"
          - "releases the line occupancy window so a later run may be scheduled over it"

  # --- 3. FilmRoll ----------------------------------------------------------
  - entity: FilmRoll
    field: status
    initial_state: WOUND
    terminal_states: [CONSUMED, SCRAPPED]
    transitions:
      - from: WOUND
        to: RELEASED
        trigger: "POST /film-rolls/{id}/release"
        actor: QualityManager
        preconditions:
          - "extrusion_run.status == COMPLETED"
          - "extrusion_run.gauge_capability_state IN {CAPABLE, MARGINAL}"
          - "abs(layflat_mm - product.layflat_width_mm) <= LAYFLAT_TOLERANCE_MM"
          - "extrusion_run.line.posture != FROZEN"
        side_effects: ["clears release_blocked_reason"]
      - from: WOUND
        to: QUARANTINED
        trigger: "system: producing line's posture becomes FROZEN, or a ComplianceDossier traceable to this roll is revoked"
        actor: system
        preconditions: ["status == WOUND"]
        side_effects: ["stamps release_blocked_reason"]
      - from: RELEASED
        to: CONSUMED
        trigger: "system: POST /print-jobs creates a job referencing this roll"
        actor: system
        preconditions: ["status == RELEASED"]
        side_effects: ["a second POST /print-jobs against this roll is rejected with ERR_ROLL_STATE_INVALID"]
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /film-rolls/{id}/scrap"
        actor: QualityManager
        preconditions: ["status IN {WOUND, QUARANTINED}", "an eligible RegrindPool exists"]
        side_effects:
          - "creates a RegrindTransaction (direction IN, origin_kind ROLL_SCRAP, origin_ref_id = this roll id, kg = net_kg)"
          - "re-derives RegrindPool aggregates"
      - from: WOUND
        to: SCRAPPED
        trigger: "POST /film-rolls/{id}/scrap"
        actor: QualityManager
        preconditions: ["status IN {WOUND, QUARANTINED}", "an eligible RegrindPool exists"]
        side_effects:
          - "creates a RegrindTransaction (direction IN, origin_kind ROLL_SCRAP, origin_ref_id = this roll id, kg = net_kg)"
          - "re-derives RegrindPool aggregates"

  # --- 4. PlateSet ---------------------------------------------------------
  - entity: PlateSet
    field: status
    initial_state: NEW
    terminal_states: [WORN]
    transitions:
      - from: NEW
        to: MOUNTED
        trigger: "POST /plate-sets/{id}/mount"
        actor: PrintOperator
        preconditions:
          - "color_count <= press.max_colors"
        side_effects: ["sets mounted_press_id"]
        note: "no wear or nonconformance guard is needed here: impressions_count and nonconformance_count only advance while the plate is MOUNTED, and either one reaching its limit drives the plate to the terminal WORN state, from which a mount is already refused by priority 9 with ERR_PLATE_STATE_INVALID."
      - from: MOUNTED
        to: WORN
        trigger: "system: impressions_count reaches wear_limit_impressions after a print job completes, or nonconformance_count reaches PLATE_NONCONFORMANCE_LIMIT after a dossier revocation"
        actor: system
        preconditions: ["impressions_count >= wear_limit_impressions OR nonconformance_count >= PLATE_NONCONFORMANCE_LIMIT"]
        side_effects:
          - "clears mounted_press_id"
          - "every PrintJob on this plate set with status == SETUP -> BLOCKED, releasing its press cylinder window"

  # --- 5. PrintJob: three independent (parallel) state dimensions ----------
  - entity: PrintJob
    field: status
    initial_state: SETUP
    terminal_states: [COMPLETED, BLOCKED]
    transitions:
      - from: SETUP
        to: PRINTING
        trigger: "POST /print-jobs/{id}/start-print"
        actor: PrintOperator
        preconditions:
          - "registration_state == REG_PASS"
          - "color_state == COLOR_PASS"
          - "plate_set.status == MOUNTED and plate_set.mounted_press_id == press_id"
          - "film_roll.status == CONSUMED (it was claimed by this job)"
          - "current logical clock >= window_start"
        side_effects: []
      - from: PRINTING
        to: COMPLETED
        trigger: "POST /print-jobs/{id}/complete"
        actor: PrintOperator
        preconditions: ["printed_kg > 0 and printed_kg <= film_roll.net_kg"]
        side_effects:
          - "increments plate_set.impressions_count by floor(printed_kg)"
          - "when plate_set.impressions_count >= plate_set.wear_limit_impressions: plate_set -> WORN"
          - "releases the press cylinder window"
      - from: SETUP
        to: BLOCKED
        trigger: "system: plate_set -> WORN, or setup_attempt_count exceeds MAX_SETUP_ATTEMPTS"
        actor: system
        preconditions: ["status == SETUP"]
        side_effects:
          - "stamps blocked_reason"
          - "releases the press cylinder window so a later job may occupy the same interval"

  - entity: PrintJob
    field: registration_state
    initial_state: REG_PENDING
    terminal_states: []
    transitions:
      - from: REG_PENDING
        to: REG_PASS
        trigger: "POST /print-jobs/{id}/registration-check"
        actor: PrintOperator
        preconditions: ["status == SETUP", "registration_drift_micron <= press.registration_tolerance_micron"]
        side_effects: ["stores registration_drift_micron", "increments setup_attempt_count"]
      - from: REG_PENDING
        to: REG_FAIL
        trigger: "POST /print-jobs/{id}/registration-check"
        actor: PrintOperator
        preconditions: ["status == SETUP", "registration_drift_micron > press.registration_tolerance_micron"]
        side_effects: ["stores registration_drift_micron", "increments setup_attempt_count"]
      - from: REG_FAIL
        to: REG_PASS
        trigger: "POST /print-jobs/{id}/registration-check"
        actor: PrintOperator
        preconditions: ["status == SETUP", "registration_drift_micron <= press.registration_tolerance_micron"]
        side_effects: ["increments setup_attempt_count", "when setup_attempt_count > MAX_SETUP_ATTEMPTS: status -> BLOCKED"]
      - from: REG_PASS
        to: REG_FAIL
        trigger: "POST /print-jobs/{id}/registration-check"
        actor: PrintOperator
        preconditions: ["status == SETUP", "registration_drift_micron > press.registration_tolerance_micron"]
        side_effects: ["increments setup_attempt_count"]
        note: "registration_state evolves independently of color_state: a job can be REG_PASS while still COLOR_PENDING, and start-print requires both dimensions to be PASS."

  - entity: PrintJob
    field: color_state
    initial_state: COLOR_PENDING
    terminal_states: []
    transitions:
      - from: COLOR_PENDING
        to: COLOR_PASS
        trigger: "POST /print-jobs/{id}/color-proof"
        actor: PrintOperator
        preconditions: ["status == SETUP", "delta_e_measured <= press.max_delta_e"]
        side_effects: ["stores delta_e_measured", "increments setup_attempt_count"]
      - from: COLOR_PENDING
        to: COLOR_FAIL
        trigger: "POST /print-jobs/{id}/color-proof"
        actor: PrintOperator
        preconditions: ["status == SETUP", "delta_e_measured > press.max_delta_e"]
        side_effects: ["stores delta_e_measured", "increments setup_attempt_count"]
      - from: COLOR_FAIL
        to: COLOR_PASS
        trigger: "POST /print-jobs/{id}/color-proof"
        actor: PrintOperator
        preconditions: ["status == SETUP", "delta_e_measured <= press.max_delta_e"]
        side_effects: ["increments setup_attempt_count", "when setup_attempt_count > MAX_SETUP_ATTEMPTS: status -> BLOCKED"]
      - from: COLOR_PASS
        to: COLOR_FAIL
        trigger: "POST /print-jobs/{id}/color-proof"
        actor: PrintOperator
        preconditions: ["status == SETUP", "delta_e_measured > press.max_delta_e"]
        side_effects: ["increments setup_attempt_count"]

  # --- 6. BagLot: branching fork with divergent side effects ---------------
  - entity: BagLot
    field: status
    initial_state: CONVERTING
    terminal_states: [FAILED, SHIPPED, QUARANTINED]
    transitions:
      - from: CONVERTING
        to: TESTING
        trigger: "POST /bag-lots/{id}/seal-tests (first specimen appended)"
        actor: ConvertingOperator
        preconditions:
          - "when product.perforation_required: perforation_verified == true"
          - "when product.bag_style == GUSSETED: gusset_verified == true"
        side_effects: ["appends the specimen and recomputes seal_provisional_mean_n and seal_provisional_verdict"]
      - from: TESTING
        to: QUALIFIED
        trigger: "POST /bag-lots/{id}/finalize-tests"
        actor: QualityManager
        preconditions:
          - "the superseding BOTTOM_SEAL panel holds at least MIN_SEAL_SPECIMENS specimens"
          - "calculations.seal_strength_qualification final verdict == PASS"
        side_effects: ["writes seal_final_min_n, seal_final_mean_n, seal_final_verdict = PASS"]
      - from: TESTING
        to: CONDITIONAL
        trigger: "POST /bag-lots/{id}/finalize-tests"
        actor: QualityManager
        preconditions:
          - "the superseding BOTTOM_SEAL panel holds at least MIN_SEAL_SPECIMENS specimens"
          - "calculations.seal_strength_qualification final verdict == CONDITIONAL"
        side_effects:
          - "writes seal_final_verdict = CONDITIONAL"
          - "the lot may still be packed out, but release additionally requires an ISSUED ComplianceDossier whose claim_conformance == CONFORMING"
        note: "Divergent branch: CONDITIONAL keeps the lot shippable but tightens the release gate, unlike QUALIFIED."
      - from: TESTING
        to: FAILED
        trigger: "POST /bag-lots/{id}/finalize-tests"
        actor: QualityManager
        preconditions:
          - "the superseding BOTTOM_SEAL panel holds at least MIN_SEAL_SPECIMENS specimens"
          - "calculations.seal_strength_qualification final verdict == FAIL"
          - "an eligible RegrindPool exists for the lot's polymer family and food-contact status"
        side_effects:
          - "writes seal_final_verdict = FAIL"
          - "sets bag_count_scrapped = bag_count_produced and bag_count_unpacked = 0"
          - "creates a RegrindTransaction (direction IN, origin_kind LOT_SCRAP, origin_ref_id = this lot id, kg = bag_count_produced * bag_unit_weight_kg rounded to 3 dp)"
          - "re-derives RegrindPool aggregates"
        note: "Divergent branch: FAILED is terminal and converts the whole lot into pool mass, unlike the other two forks."
      - from: QUALIFIED
        to: PACKED
        trigger: "POST /bag-lots/{id}/packout"
        actor: ConvertingOperator
        preconditions:
          - "requested_bags <= bag_count_unpacked"
          - "expected_bag_lot_version matches version"
        side_effects:
          - "runs calculations.case_packout_allocation"
          - "increments packed_bag_count, packed_case_count, partial_case_bag_count; recomputes pallet_count from the cumulative case count"
          - "decrements bag_count_unpacked by the packed bag count (unallocated remainder stays unpacked)"
          - "increments version by 1"
      - from: CONDITIONAL
        to: PACKED
        trigger: "POST /bag-lots/{id}/packout"
        actor: ConvertingOperator
        preconditions:
          - "requested_bags <= bag_count_unpacked"
          - "expected_bag_lot_version matches version"
        side_effects:
          - "same allocation and counter updates as the QUALIFIED branch"
          - "increments version by 1"
      - from: PACKED
        to: RELEASED
        trigger: "POST /bag-lots/{id}/release"
        actor: QualityManager
        preconditions:
          - "count_accuracy_conforming == true"
          - "a ComplianceDossier for this lot has status == ISSUED"
          - "when seal_final_verdict == CONDITIONAL: that dossier's claim_conformance == CONFORMING"
          - "when product.food_contact_required: that dossier's food_contact_declared == true"
        side_effects: []
      - from: RELEASED
        to: SHIPPED
        trigger: "POST /bag-lots/{id}/ship"
        actor: PlantAdmin
        preconditions: ["packed_case_count > 0"]
        side_effects: []
      - from: PACKED
        to: QUARANTINED
        trigger: "system: ComplianceDossier for this lot is revoked"
        actor: system
        preconditions: ["status IN {QUALIFIED, CONDITIONAL, PACKED, RELEASED}"]
        side_effects:
          - "stamps quarantine_reason"
          - "unwinds the packout: packed_bag_count, packed_case_count, partial_case_bag_count and pallet_count reset to 0 and bag_count_unpacked is restored to bag_count_produced - bag_count_scrapped"
          - "increments plate_set.nonconformance_count via the lot's print job (cascade root B)"
      - from: RELEASED
        to: QUARANTINED
        trigger: "system: ComplianceDossier for this lot is revoked"
        actor: system
        preconditions: ["status IN {QUALIFIED, CONDITIONAL, PACKED, RELEASED}"]
        side_effects:
          - "stamps quarantine_reason"
          - "unwinds the packout as above"
          - "increments plate_set.nonconformance_count via the lot's print job (cascade root B)"

  # --- 7. ComplianceDossier ----------------------------------------------
  - entity: ComplianceDossier
    field: status
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /compliance-dossiers/{id}/issue"
        actor: QualityManager
        preconditions:
          - "bag_lot.status IN {QUALIFIED, CONDITIONAL, PACKED}"
          - "bag_lot.actual_recycled_content_pct is not null"
          - "acting X-User-ID does not appear in bag_lot.seal_specimens[*].entered_by_user_id (segregation of duties)"
          - "when food_contact_declared == true: the lot's blend recipe has food_contact_eligible == true and the producing line has food_contact_certified == true"
        side_effects:
          - "freezes as_built_recycled_content_pct from bag_lot.actual_recycled_content_pct"
          - "computes claim_variance_pct and claim_conformance"
          - "sets issued_by_user_id and issued_at from the logical clock"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /compliance-dossiers/{id}/revoke"
        actor: QualityManager
        preconditions: ["revocation_reason is present in the payload"]
        side_effects:
          - "sets revoked_at from the logical clock"
          - "bag_lot -> QUARANTINED with the packout unwound (cascade B, depth 2)"
          - "the lot's print job's plate set: nonconformance_count incremented (depth 3)"
          - "when that plate set reaches PLATE_NONCONFORMANCE_LIMIT: plate set -> WORN and its SETUP print jobs -> BLOCKED with their cylinder windows released (depth 4)"
          - "the producing line's revoked_dossier_count incremented and posture re-derived; a FROZEN posture quarantines that line's WOUND rolls and blocks its SCHEDULED runs (depth 5)"

  # --- 8. ExtrusionLine posture: compound / system-derived aggregate -------
  - entity: ExtrusionLine
    field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: calculations.line_posture re-derived after a run completes, holds or resumes"
        actor: system
        preconditions: ["incapable_run_count == 1 OR active_hold_count >= POSTURE_RESTRICTED_MIN_HOLDS"]
        side_effects: ["new POST /extrusion-runs whose recipe's product has food_contact_required == true are rejected with ERR_LINE_POSTURE_RESTRICTED; non-food runs may still be scheduled"]
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: calculations.line_posture re-derived after a run completes or a dossier is revoked"
        actor: system
        preconditions: ["incapable_run_count >= POSTURE_FROZEN_MIN_INCAPABLE OR revoked_dossier_count >= POSTURE_FROZEN_MIN_REVOKED"]
        side_effects:
          - "every SCHEDULED ExtrusionRun on this line -> BLOCKED"
          - "every WOUND FilmRoll produced on this line -> QUARANTINED"
      - from: OPEN
        to: FROZEN
        trigger: "system: calculations.line_posture re-derived after a dossier is revoked"
        actor: system
        preconditions: ["revoked_dossier_count >= POSTURE_FROZEN_MIN_REVOKED"]
        side_effects:
          - "every SCHEDULED ExtrusionRun on this line -> BLOCKED"
          - "every WOUND FilmRoll produced on this line -> QUARANTINED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: calculations.line_posture re-derived after POST /extrusion-lines/{id}/clear-capability-flags"
        actor: system
        preconditions: ["incapable_run_count == 0 and active_hold_count < POSTURE_RESTRICTED_MIN_HOLDS and revoked_dossier_count == 0"]
        side_effects: []
      - from: FROZEN
        to: OPEN
        trigger: "system: calculations.line_posture re-derived after POST /extrusion-lines/{id}/clear-capability-flags"
        actor: system
        preconditions: ["incapable_run_count == 0 and revoked_dossier_count == 0 and active_hold_count < POSTURE_RESTRICTED_MIN_HOLDS"]
        side_effects: ["already BLOCKED runs and QUARANTINED rolls are NOT restored — the cascade is not reversed by clearing flags"]
        note: "FROZEN is escapable but the cascade it fired is not undone; this asymmetry is deliberate."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC only — no other mechanism is sanctioned)
# -----------------------------------------------------------------------------
concurrency_rules:

  - rule_id: regrind-reincorporation-stale-pool
    parent_entity: RegrindPool
    write_endpoint: "POST /extrusion-runs/{id}/regrind-reincorporations"
    occ_field: "expected_regrind_pool_version"
    description: |
      Drawing regrind mass out of a pool while carrying a pool version that has
      advanced since the client last read the pool is rejected with 412. A
      reincorporation is legitimately repeatable — the same run may draw from the
      same pool many times, and any two draws that individually fit inside
      available_kg would each succeed on their own. The pool version is therefore
      the only observable that distinguishes a client working from a current view
      of available_kg from one working from a superseded view.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

  - rule_id: packout-stale-bag-lot
    parent_entity: BagLot
    write_endpoint: "POST /bag-lots/{id}/packout"
    occ_field: "expected_bag_lot_version"
    description: |
      Committing a packout allocation against a bag lot whose version has advanced
      since the client last read it is rejected with 412. Packout is legitimately
      repeatable — a lot is packed out incrementally and each call re-reads
      bag_count_unpacked, so a stale caller would otherwise commit an allocation
      computed against an unpacked count that no longer exists.
    error_id: ERR_STALE_BAG_LOT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: blend_composition_totals
    trigger: "On every POST /blend-recipes/{id}/components and on submit"
    algorithm: aggregation
    input_set: "All objects in BlendRecipe.components, in append (position) order"
    formula: |
      total_weight_pct = round(sum(c.weight_pct for c in components), 3)
      regrind_pct      = round(sum(c.weight_pct for c in components if c.component_kind == 'REGRIND'), 3)
      additive_pct     = round(sum(c.weight_pct for c in components if c.component_kind == 'ADDITIVE'), 3)
      hdpe_pct         = round(sum(c.weight_pct for c in components
                                   if c.component_kind == 'VIRGIN'
                                   and resin(c).polymer_family == 'HDPE'), 3)
      barrier_layer_present = any(resin(c).is_barrier for c in components
                                  if c.component_kind in ('VIRGIN','ADDITIVE'))
      # dominant polymer family over VIRGIN weight only
      family_totals = { fam: sum(c.weight_pct for c in components
                                 if c.component_kind == 'VIRGIN' and resin(c).polymer_family == fam) }
      dominant_polymer_family = null if family_totals is empty else
          the family with the greatest total; ties broken by polymer_family
          ascending alphabetically (LDPE < LLDPE < MDPE ...), never by id
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: blend_cost_and_density
    trigger: "On every POST /blend-recipes/{id}/components and on submit"
    algorithm: weighted_scoring
    input_set: "All objects in BlendRecipe.components; REGRIND components use the REGRIND_* constants instead of a ResinGrade row"
    formula: |
      # PINNED ROUNDING ORDER: round each component line to 2 dp FIRST, then sum,
      # then round the sum to 2 dp. Summing unrounded contributions and rounding
      # once at the end is a DIFFERENT (incorrect) result.
      for each component c in append order:
          unit_cost = REGRIND_COST_PER_KG if c.component_kind == 'REGRIND' else resin(c).cost_per_kg
          unit_dens = REGRIND_DENSITY     if c.component_kind == 'REGRIND' else resin(c).density_kg_m3
          cost_line[c] = round(c.weight_pct / 100 * unit_cost, 2)
          dens_line[c] = round(c.weight_pct / 100 * unit_dens, 2)
      blend_cost_per_kg     = round(sum(cost_line), 2)
      blended_density_kg_m3 = round(sum(dens_line), 2)
    constants:
      REGRIND_COST_PER_KG: 0.42
      REGRIND_DENSITY: 922.0
    precision: "2 decimal places, round_half_up; per-component rounding precedes summation"

  - name: blend_property_indices
    trigger: "On every POST /blend-recipes/{id}/components and on submit"
    algorithm: threshold
    input_set: "All objects in BlendRecipe.components; REGRIND components use REGRIND_DART / REGRIND_HAZE / REGRIND_COF"
    formula: |
      dart_base = sum(c.weight_pct / 100 * (REGRIND_DART if c.component_kind == 'REGRIND'
                                            else resin(c).dart_impact_index))
      # family penalty is FREE up to and including HDPE_FREE_PCT, then linear
      family_factor  = 1.000 if hdpe_pct <= HDPE_FREE_PCT
                       else max(FAMILY_FACTOR_FLOOR,
                                1.000 - HDPE_PENALTY_PER_PCT * (hdpe_pct - HDPE_FREE_PCT))
      regrind_factor = max(REGRIND_FACTOR_FLOOR, 1.000 - REGRIND_PENALTY_PER_PCT * regrind_pct)
      additive_boost = min(ADDITIVE_BOOST_CEILING,
                           1.000 + ADDITIVE_BOOST_PER_COMPONENT * count(components with kind ADDITIVE))
      # the two penalties do NOT multiply: the binding one wins
      strength_index = round(dart_base * min(family_factor, regrind_factor) * additive_boost, 2)

      haze_sum      = sum(c.weight_pct / 100 * (REGRIND_HAZE if REGRIND else resin(c).haze_index))
      clarity_index = round(max(0.00, 100.00 - HAZE_COEFF * haze_sum), 2)

      cof_sum    = sum(c.weight_pct / 100 * (REGRIND_COF if REGRIND else resin(c).cof_index))
      slip_index = round(min(100.00, max(0.00, (COF_REFERENCE - cof_sum) / COF_REFERENCE * 100.00)), 2)
    constants:
      REGRIND_DART: 34.0
      REGRIND_HAZE: 18.0
      REGRIND_COF: 0.55
      HDPE_FREE_PCT: 30.0
      HDPE_PENALTY_PER_PCT: 0.004
      FAMILY_FACTOR_FLOOR: 0.700
      REGRIND_PENALTY_PER_PCT: 0.006
      REGRIND_FACTOR_FLOOR: 0.800
      ADDITIVE_BOOST_PER_COMPONENT: 0.020
      ADDITIVE_BOOST_CEILING: 1.150
      HAZE_COEFF: 2.500
      COF_REFERENCE: 0.600
    precision: "2 decimal places, round_half_up; intermediate factors carried at full precision"

  - name: regrind_cap_evaluation
    trigger: "On every POST /blend-recipes/{id}/components and on submit"
    algorithm: threshold
    input_set: "BlendRecipe.components plus the parent Product's cap and assumed-PCR fields"
    formula: |
      # PINNED EVALUATION ORDER — the five steps run exactly in this sequence and
      # step 3 reads ONLY the step-2 output. Deriving the band from the step-5
      # nominal figure instead is a DIFFERENT (incorrect) result.
      # step 1
      regrind_pct = round(sum(c.weight_pct for c in components if kind == 'REGRIND'), 3)
      # step 2 — VIRGIN components only; regrind's embedded PCR is deliberately excluded here
      virgin_pcr_pct = round(sum(c.weight_pct / 100 * resin(c).pcr_content_pct
                                 for c in components if c.component_kind == 'VIRGIN'), 3)
      # step 3 — band from virgin_pcr_pct, then cap
      base_cap = product.max_regrind_pct_food if product.food_contact_required
                 else product.max_regrind_pct_nonfood
      pcr_band = 'HIGH' if virgin_pcr_pct >= PCR_BAND_HIGH_MIN
                 else ('MID' if virgin_pcr_pct >= PCR_BAND_MID_MIN else 'LOW')
      regrind_cap_pct = round(max(0.0, base_cap + CAP_DELTA[pcr_band]), 3)
      # step 4 — compare
      cap_satisfied = regrind_pct <= regrind_cap_pct        # inclusive at the boundary
      # step 5 — nominal recycled content (the NOMINAL variant; see run_mass_balance for as-built)
      nominal_recycled_content_pct = round(virgin_pcr_pct
                                           + regrind_pct / 100 * product.assumed_regrind_pcr_pct, 3)
      food_contact_eligible = (not product.food_contact_required) or
                              (all(resin(c).food_contact_approved for c in components
                                   if c.component_kind in ('VIRGIN','ADDITIVE')) and cap_satisfied)
    constants:
      PCR_BAND_HIGH_MIN: 20.0
      PCR_BAND_MID_MIN: 5.0
      CAP_DELTA_HIGH: -5.0
      CAP_DELTA_MID: -2.0
      CAP_DELTA_LOW: 0.0
    precision: "3 decimal places, round_half_up"

  - name: gauge_capability
    trigger: "On POST /extrusion-runs/{id}/gauge-readings and on POST /extrusion-runs/{id}/complete"
    algorithm: threshold
    input_set: "Every object in ExtrusionRun.gauge_readings (append order); no filtering by recency"
    formula: |
      n = len(gauge_readings)
      if n < MIN_GAUGE_SAMPLES:
          gauge_capability_index = null; gauge_capability_state = 'INSUFFICIENT_DATA'
      else:
          mean = sum(thickness_micron) / n
          # POPULATION standard deviation — divide by n, not (n-1)
          sd   = sqrt(sum((t - mean)^2) / n)
          USL  = product.target_gauge_micron * (1 + product.gauge_tolerance_pct / 100)
          LSL  = product.target_gauge_micron * (1 - product.gauge_tolerance_pct / 100)
          cpk_raw = CPK_CEILING if sd == 0
                    else min((USL - mean) / (3 * sd), (mean - LSL) / (3 * sd))
          # ROUND BEFORE BANDING: the band reads the 3-dp rounded value
          gauge_capability_index = round(min(CPK_CEILING, cpk_raw), 3)
          gauge_capability_state = 'CAPABLE'  if gauge_capability_index >= CPK_CAPABLE_MIN
                             else 'MARGINAL'  if gauge_capability_index >= CPK_MARGINAL_MIN
                             else 'INCAPABLE'
          gauge_mean_micron = round(mean, 3)
          gauge_sd_micron   = round(sd, 4)
          gauge_cv_pct      = round(sd / mean * 100, 3)
      layflat_deviation_max_mm = round(max(abs(r.layflat_mm - product.layflat_width_mm)
                                           for r in gauge_readings), 2)
      bubble_instability_events = count(r for r in gauge_readings
                                        if abs(r.bubble_deviation_mm) > BUBBLE_LIMIT_MM)
    constants:
      MIN_GAUGE_SAMPLES: 5
      CPK_CAPABLE_MIN: 1.330
      CPK_MARGINAL_MIN: 1.000
      CPK_CEILING: 4.000
      BUBBLE_LIMIT_MM: 3.0
      LAYFLAT_TOLERANCE_MM: 5.0
    precision: "gauge_capability_index 3 dp; gauge_sd_micron 4 dp; round_half_up"

  - name: run_mass_balance
    trigger: "On POST /extrusion-runs/{id}/complete"
    algorithm: aggregation
    input_set: "The run's non-reversed REINCORPORATION RegrindTransaction rows plus the completion payload's gross_output_kg and scrap_kg"
    formula: |
      regrind_consumed_kg = round(sum(t.kg for t in run's REINCORPORATION transactions
                                      where t is not reversed), 3)
      net_good_kg         = round(gross_output_kg - scrap_kg, 3)
      virgin_feed_kg      = round(max(0.0, gross_output_kg - regrind_consumed_kg), 3)
      # AS-BUILT recycled mass: virgin resin PCR plus the PCR actually carried in by the pool
      regrind_pcr_kg      = sum(t.pcr_kg for t in the same transactions)
      pcr_mass_kg         = round(virgin_feed_kg * (recipe.virgin_pcr_pct / 100) + regrind_pcr_kg, 3)
      regrind_actual_pct  = round(regrind_consumed_kg / gross_output_kg * 100, 3)
      actual_recycled_content_pct = round(pcr_mass_kg / gross_output_kg * 100, 3)
      # the scrap becomes pool mass carrying the run's own as-built PCR fraction
      scrap_pcr_kg = round(scrap_kg * actual_recycled_content_pct / 100, 3)
    constants: {}
    precision: "3 decimal places, round_half_up"
    variants:
      - name: nominal
        when: "Read from BlendRecipe.nominal_recycled_content_pct at design time (recipe submit/approve), before any material is extruded"
        difference: |
          Uses the recipe's declared regrind_pct multiplied by the product's
          assumed_regrind_pcr_pct — a design-book assumption. It never observes the
          pool's real embedded PCR nor the fact that the run may consume less (or
          more) regrind than the recipe declares.
      - name: as_built
        when: "Written to ExtrusionRun.actual_recycled_content_pct at completion and propagated to FilmRoll and BagLot"
        difference: |
          Uses the mass actually drawn from the pool and that pool's measured
          embedded_pcr_pct, against the real gross_output_kg. For a recipe whose
          declared regrind is only partly consumed, or whose pool carries a
          different PCR fraction than assumed, the two variants diverge; the
          dossier claim is checked against the as-built variant only.

  - name: pool_mass_balance
    trigger: "On every RegrindTransaction creation (extrusion scrap, roll scrap, lot scrap, reincorporation) and on POST /regrind-transactions/{id}/reverse"
    algorithm: aggregation
    input_set: "All RegrindTransaction rows for the pool with origin_kind != REVERSAL whose id does not appear as reverses_transaction_id on any REVERSAL row (a REVERSAL row is itself never summed — it only removes its target from the input set)"
    formula: |
      cumulative_in_kg     = round(sum(t.kg     for t in non-reversed rows with direction IN), 3)
      cumulative_out_kg    = round(sum(t.kg     for t in non-reversed rows with direction OUT), 3)
      cumulative_in_pcr_kg = round(sum(t.pcr_kg for t in non-reversed rows with direction IN), 3)
      available_kg         = round(cumulative_in_kg - cumulative_out_kg, 3)     # INVARIANT I1
      embedded_pcr_pct     = 0.000 if cumulative_in_kg == 0
                             else round(cumulative_in_pcr_kg / cumulative_in_kg * 100, 3)
      generation_count     = count(non-reversed IN rows)
      reincorporation_count = count(non-reversed OUT rows)
      # a REINCORPORATION carries out the pool's embedded PCR fraction AT DRAW TIME:
      #   pcr_kg = round(kg * embedded_pcr_pct_before_this_draw / 100, 3)
      # INVARIANT I2 (system total, checkable at any point):
      #   SYSTEM_REGRIND_MASS_KG = available_kg + sum(non-reversed OUT kg) == sum(non-reversed IN kg)
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: seal_strength_qualification
    trigger: "On POST /bag-lots/{id}/seal-tests (provisional variant) and on POST /bag-lots/{id}/finalize-tests (final variant)"
    algorithm: chronological
    input_set: "BagLot.seal_specimens rows with test_kind == BOTTOM_SEAL, in append order"
    formula: |
      # PROVISIONAL variant — first-pass specimens only (is_retest == false)
      first_pass = [s for s in bottom_seal_specimens if s.is_retest == false]
      if len(first_pass) < MIN_SEAL_SPECIMENS:
          seal_provisional_mean_n = null; seal_provisional_verdict = 'PENDING'
      else:
          seal_provisional_mean_n  = round(mean(first_pass.measured_n_per_15mm), 2)
          seal_provisional_verdict = 'PASS' if seal_provisional_mean_n >= product.min_bottom_seal_n_per_15mm
                                     else 'FAIL'

      # FINAL variant — the SUPERSEDING panel: for each specimen_index keep only the
      # row with the highest attempt (a retest supersedes the first pass entirely)
      panel = [ the row with max(attempt) for each distinct specimen_index ]
      if len(panel) < MIN_SEAL_SPECIMENS: reject with ERR_INSUFFICIENT_SEAL_PANEL
      seal_final_min_n  = round(min(panel.measured_n_per_15mm), 2)
      seal_final_mean_n = round(mean(panel.measured_n_per_15mm), 2)
      spec = product.min_bottom_seal_n_per_15mm
      pass_floor        = round(spec * SEAL_PASS_MIN_RATIO, 2)
      conditional_floor = round(spec * SEAL_COND_MIN_RATIO, 2)
      conditional_mean  = round(spec * SEAL_COND_MEAN_RATIO, 2)
      seal_final_verdict = 'PASS'        if seal_final_min_n >= pass_floor and seal_final_mean_n >= spec
                      else 'CONDITIONAL' if seal_final_min_n >= conditional_floor and seal_final_mean_n >= conditional_mean
                      else 'FAIL'
    constants:
      MIN_SEAL_SPECIMENS: 3
      SEAL_PASS_MIN_RATIO: 0.900
      SEAL_COND_MIN_RATIO: 0.800
      SEAL_COND_MEAN_RATIO: 0.950
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Recomputed on every seal specimen append while the lot is in TESTING"
        difference: |
          Averages ONLY first-pass specimens and ignores retests entirely, and
          judges on the mean alone against the raw customer spec. A weak specimen
          that was later retested still drags the provisional mean down; a retest
          that came out worse than the first pass is invisible to it.
      - name: final
        when: "Written once by POST /bag-lots/{id}/finalize-tests, and it is the only variant the lot's fork reads"
        difference: |
          Uses the superseding panel (highest attempt per specimen_index), applies a
          two-tier min-and-mean rule against ratio floors, and can therefore yield
          PASS where provisional said FAIL (a good retest replaced a weak specimen)
          or FAIL where provisional said PASS (the retest came out worse).

  - name: bag_count_and_accuracy
    trigger: "On POST /bag-lots and on POST /bag-lots/{id}/packout"
    algorithm: threshold
    input_set: "The lot's Product spec, the producing BlendRecipe's blended_density_kg_m3, and the parent PrintJob.printed_kg"
    formula: |
      # theoretical mass of one bag: two film plies across the layflat width,
      # length extended by the gusset, gauge in micron, density in kg/m3
      bag_unit_weight_kg = round((product.layflat_width_mm / 1000) * 2
                                 * ((product.bag_length_mm + product.gusset_depth_mm) / 1000)
                                 * (product.target_gauge_micron / 1000000)
                                 * recipe.blended_density_kg_m3, 6)
      bag_count_theoretical = floor(print_job.printed_kg / bag_unit_weight_kg)   # FLOOR, not round
      count_accuracy_pct    = null if bag_count_theoretical == 0
                              else round(bag_count_produced / bag_count_theoretical * 100, 2)
      count_accuracy_conforming = abs(count_accuracy_pct - 100.00)
                                  <= product.count_accuracy_tolerance_pct
      # CONSERVATION INVARIANT (checked after every packout and every unwind):
      #   bag_count_produced == bag_count_unpacked + packed_bag_count + bag_count_scrapped
    constants: {}
    precision: "bag_unit_weight_kg 6 dp; count_accuracy_pct 2 dp; round_half_up"

  - name: case_packout_allocation
    trigger: "On POST /bag-lots/{id}/packout"
    algorithm: waterfall_allocation
    input_set: "requested_bags from the payload plus the lot's cumulative packed counters"
    formula: |
      full_cases = floor(requested_bags / product.bags_per_case)
      remainder  = requested_bags - full_cases * product.bags_per_case
      # a short case counts as a billable case ONLY at or above the threshold
      partial_case = 1 if (remainder > 0 and remainder >= product.min_partial_case_bags) else 0
      partial_bags = remainder if partial_case == 1 else 0
      packed_now   = full_cases * product.bags_per_case + partial_bags
      # bags below the partial threshold are NOT packed and stay in bag_count_unpacked
      packed_bag_count      += packed_now
      packed_case_count     += full_cases + partial_case
      partial_case_bag_count += partial_bags
      # PINNED ORDER: the pallet count is a ceiling over the CUMULATIVE case count,
      # not the sum of per-packout ceilings.
      pallet_count = ceil(packed_case_count / product.cases_per_pallet)
    constants: {}
    precision: "integer arithmetic; ceiling on the cumulative case count"

  - name: line_posture
    trigger: "On run start/hold/resume/complete, on dossier revoke, and on POST /extrusion-lines/{id}/clear-capability-flags"
    algorithm: constraint_propagation
    input_set: "All ExtrusionRun rows on the line and all REVOKED ComplianceDossier rows traceable to the line via BagLot -> PrintJob -> FilmRoll -> ExtrusionRun"
    formula: |
      incapable_run_count  = count(runs on this line with status == COMPLETED
                                   and gauge_capability_state == 'INCAPABLE')
      active_hold_count    = count(runs on this line with status == HELD)
      revoked_dossier_count = count(REVOKED dossiers traceable to this line)
      posture = 'FROZEN'     if incapable_run_count >= POSTURE_FROZEN_MIN_INCAPABLE
                             or revoked_dossier_count >= POSTURE_FROZEN_MIN_REVOKED
           else 'RESTRICTED' if incapable_run_count == 1
                             or active_hold_count >= POSTURE_RESTRICTED_MIN_HOLDS
           else 'OPEN'
      # propagation reaches a fixed point in one pass: posture -> run BLOCKED and
      # roll QUARANTINED are both terminal-or-quarantine transitions that cannot
      # feed back into the counters above.
    constants:
      POSTURE_FROZEN_MIN_INCAPABLE: 2
      POSTURE_FROZEN_MIN_REVOKED: 1
      POSTURE_RESTRICTED_MIN_HOLDS: 2
    precision: "integer counts"

  - name: line_occupancy_conflict
    trigger: "On POST /extrusion-runs and on PATCH /extrusion-runs/{id}/reschedule"
    algorithm: interval_merge
    input_set: "ExtrusionRun rows on the same line_id with status IN {SCHEDULED, RUNNING, HELD} (COMPLETED and BLOCKED runs never occupy)"
    formula: |
      # The required gap is CONDITIONAL on what the two runs have in common:
      #   same blend_recipe_id AND same product.food_contact_required -> no purge needed
      #   otherwise the line must be purged
      for each occupying run E on the same line:
          gap_minutes = 0 if (E.blend_recipe_id == new.blend_recipe_id
                              and E.product.food_contact_required == new.product.food_contact_required)
                        else line.purge_buffer_minutes
          gap = gap_minutes minutes
          conflict if (new.scheduled_start < E.scheduled_end + gap
                       and E.scheduled_start < new.scheduled_end + gap)
      # half-open windows: a run starting exactly at an existing run's scheduled_end
      # with gap == 0 does NOT conflict.
    constants: {}
    precision: "minute resolution on the logical clock"

  - name: press_cylinder_capacity
    trigger: "On POST /print-jobs"
    algorithm: aggregation
    input_set: "PrintJob rows on the same press_id with status IN {SETUP, PRINTING} whose window overlaps the requested window (COMPLETED and BLOCKED jobs release their cylinders)"
    formula: |
      # aggregate resource, no buffer, half-open intervals
      overlapping = [ J for J in press jobs if J.window_start < new.window_end
                                            and new.window_start < J.window_end ]
      occupied = sum(J.cylinders_required for J in overlapping)
      new.cylinders_required = plate_set.color_count
      conflict if occupied + new.cylinders_required > press.cylinder_capacity
      # each individual job fits; only the collective sum can breach the capacity.
    constants: {}
    precision: "integer cylinder counts"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in priority order; the first
#      violated rule decides the response and no later rule is evaluated)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_referential
    check: "Request body parses; every required input field is present; types, enum members and per-field numeric constraints from §1.1 hold (including scheduled_end > scheduled_start and window_end > window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: business_referential
    check: "limit is an integer in [1,100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all collection GET endpoints"

  - priority: 5
    category: existence
    check: "Every path id resolves, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "Every foreign key in the request body resolves (product_id, resin_grade_id, blend_recipe_id, line_id, pool_id, film_roll_id, plate_set_id, press_id, print_job_id, bag_lot_id, supersedes_recipe_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"

  - priority: 7
    category: business_constraint
    check: "Code uniqueness: product_code, grade_code, recipe_code, line_code, run_code, pool_code, press_code, plate_code, job_code, lot_code, dossier_code are globally unique; roll_number is unique within its extrusion_run_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /products, POST /resin-grades, POST /blend-recipes, POST /extrusion-lines, POST /extrusion-runs, POST /regrind-pools, POST /print-presses, POST /plate-sets, POST /print-jobs, POST /bag-lots, POST /compliance-dossiers, POST /film-rolls"

  - priority: 8
    category: state
    check: "expected_regrind_pool_version equals RegrindPool.version / expected_bag_lot_version equals BagLot.version (§1.2.1 OCC)"
    error_id: "ERR_STALE_POOL_VERSION | ERR_STALE_BAG_LOT_VERSION"
    http_status: 412
    applies_to: "POST /extrusion-runs/{id}/regrind-reincorporations, POST /bag-lots/{id}/packout"

  - priority: 9
    category: state
    check: "The target entity named in the path is in a state from which this transition is declared in §1.2"
    error_id: "ERR_RECIPE_STATE_INVALID | ERR_RUN_STATE_INVALID | ERR_ROLL_STATE_INVALID | ERR_PLATE_STATE_INVALID | ERR_PRINT_JOB_STATE_INVALID | ERR_BAG_LOT_STATE_INVALID | ERR_DOSSIER_STATE_INVALID"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 10
    category: state
    check: "Cross-entity state gates: the referenced (non-path) entity is in the state this operation requires — recipe APPROVED for a run, roll RELEASED for a print job, plate MOUNTED on the same press for start-print, run COMPLETED for roll release, print job COMPLETED for a bag lot, dossier ISSUED for lot release, line posture not FROZEN / not RESTRICTED"
    error_id: "ERR_RECIPE_NOT_APPROVED | ERR_ROLL_STATE_INVALID | ERR_PLATE_STATE_INVALID | ERR_RUN_STATE_INVALID | ERR_PRINT_JOB_STATE_INVALID | ERR_DOSSIER_NOT_ISSUED | ERR_LINE_POSTURE_FROZEN | ERR_LINE_POSTURE_RESTRICTED"
    http_status: 409
    applies_to: "POST /extrusion-runs, POST /extrusion-runs/{id}/start, POST /extrusion-runs/{id}/resume, POST /film-rolls/{id}/release, POST /print-jobs, POST /print-jobs/{id}/start-print, POST /bag-lots, POST /bag-lots/{id}/release"

  - priority: 11
    category: business_safety
    check: "Food-contact and recycled-content compliance: every VIRGIN/ADDITIVE resin in a food-contact recipe is food_contact_approved; a food-contact run is scheduled only on a food_contact_certified line; a food-contact run draws only from a FOOD_CONTACT_ELIGIBLE pool; a food_contact_declared dossier is backed by an eligible recipe and a certified line; a dossier claim does not overstate the as-built content beyond CLAIM_TOLERANCE_PCT; a segregation-of-duties pairing is not violated"
    error_id: "ERR_FOOD_CONTACT_RESIN_INELIGIBLE | ERR_LINE_NOT_FOOD_CERTIFIED | ERR_FOOD_CONTACT_POOL_INELIGIBLE | ERR_FOOD_CONTACT_DECLARATION_INVALID | ERR_CLAIM_OVERSTATED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 422
    applies_to: "POST /blend-recipes/{id}/submit, POST /blend-recipes/{id}/approve, POST /blend-recipes/{id}/reject, POST /extrusion-runs, POST /extrusion-runs/{id}/start, POST /extrusion-runs/{id}/regrind-reincorporations, POST /compliance-dossiers/{id}/issue"

  - priority: 12
    category: business_referential
    check: "Structural coherence of the blend against its product: total weight, layer count and layer indices, barrier requirement for multilayer products, regrind cap, minimum strength index, product identity between a bag lot and its print job's plate set"
    error_id: "ERR_BLEND_WEIGHT_NOT_100 | ERR_LAYER_COUNT_MISMATCH | ERR_BARRIER_STRUCTURE_REQUIRED | ERR_REGRIND_CAP_EXCEEDED | ERR_STRENGTH_INDEX_BELOW_MIN | ERR_PRODUCT_MISMATCH"
    http_status: 422
    applies_to: "POST /blend-recipes/{id}/components, POST /blend-recipes/{id}/submit, POST /bag-lots"

  - priority: 13
    category: business_constraint
    check: "Resource capability and exclusive/aggregate occupancy: line layer, gauge and layflat capability; exclusive line occupancy with the conditional purge buffer; aggregate press cylinder capacity across overlapping windows; plate color count against press capability"
    error_id: "ERR_LINE_CAPABILITY_MISMATCH | ERR_LINE_WINDOW_CONFLICT | ERR_PRESS_CYLINDER_CAPACITY | ERR_PLATE_COLOR_EXCEEDS_PRESS"
    http_status: 409
    applies_to: "POST /extrusion-runs, PATCH /extrusion-runs/{id}/reschedule, POST /plate-sets/{id}/mount, POST /print-jobs"

  - priority: 14
    category: business_temporal
    check: "Clock-relative window gates: a scheduled window may not begin before the current logical clock; a run may not start before its scheduled_start; a print job may not start printing before its window_start; a run may not be resumed once hold_count exceeds MAX_RUN_HOLDS"
    error_id: "ERR_WINDOW_IN_PAST | ERR_RUN_NOT_YET_STARTABLE | ERR_PRINT_WINDOW_NOT_OPEN | ERR_RUN_HOLD_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "POST /extrusion-runs, PATCH /extrusion-runs/{id}/reschedule, POST /extrusion-runs/{id}/start, POST /extrusion-runs/{id}/resume, POST /print-jobs/{id}/start-print"

  - priority: 15
    category: business_fiscal
    check: "Quantity, capability-data and budget sufficiency: gauge sample count; seal panel size; scrap not exceeding gross output; an eligible pool existing for generated scrap; pool availability; the run's regrind budget; packout not exceeding unpacked bags; printed mass not exceeding the roll; count accuracy at release; layflat tolerance at roll release; gauge capability at roll release; reversal admissibility"
    error_id: "ERR_INSUFFICIENT_GAUGE_DATA | ERR_INSUFFICIENT_SEAL_PANEL | ERR_SCRAP_EXCEEDS_OUTPUT | ERR_NO_ELIGIBLE_REGRIND_POOL | ERR_REGRIND_INSUFFICIENT | ERR_REGRIND_BUDGET_EXCEEDED | ERR_PACKOUT_EXCEEDS_UNPACKED | ERR_PRINTED_KG_EXCEEDS_ROLL | ERR_COUNT_ACCURACY_OUT_OF_SPEC | ERR_LAYFLAT_OUT_OF_TOLERANCE | ERR_GAUGE_CAPABILITY_INSUFFICIENT | ERR_TRANSACTION_ALREADY_REVERSED | ERR_TRANSACTION_NOT_REVERSIBLE"
    http_status: 422
    applies_to: "POST /extrusion-runs/{id}/complete, POST /bag-lots/{id}/finalize-tests, POST /extrusion-runs/{id}/regrind-reincorporations, POST /bag-lots/{id}/packout, POST /bag-lots/{id}/release, POST /print-jobs/{id}/complete, POST /film-rolls/{id}/release, POST /film-rolls/{id}/scrap, POST /regrind-transactions/{id}/reverse"

  - priority: 16
    category: business_safety
    check: "Converting feature verification: a perforation-required product's lot has perforation_verified == true and a GUSSETED product's lot has gusset_verified == true before seal testing may begin"
    error_id: ERR_CONVERTING_FEATURE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /bag-lots/{id}/seal-tests"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # ---- test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it MUST NOT fall back to real wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["every subsequent clock-relative check (window gates, issued_at, revoked_at, recorded_at) reads the new value"]

  # ---- Product -------------------------------------------------------------
  - method: POST
    path: "/products"
    description: "Registers a customer product specification"
    roles: [PlantAdmin]
    code: 201
    input: [product_code, customer_code, bag_style, "food_contact_required?", target_gauge_micron, "gauge_tolerance_pct?", layflat_width_mm, bag_length_mm, "gusset_depth_mm?", "perforation_required?", min_bottom_seal_n_per_15mm, min_strength_index, "max_regrind_pct_food?", "max_regrind_pct_nonfood?", "declared_recycled_content_pct?", "assumed_regrind_pcr_pct?", bags_per_case, "min_partial_case_bags?", cases_per_pallet, "count_accuracy_tolerance_pct?", "required_layer_count?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Reads one product specification"
    roles: &READ_ROLES [PlantAdmin, BlendEngineer, QualityManager, ExtrusionOperator, PrintOperator, ConvertingOperator]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "Lists product specifications"
    roles: *READ_ROLES
    code: 200
    input: ["customer_code?", "food_contact_required?", "bag_style?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # ---- ResinGrade ----------------------------------------------------------
  - method: POST
    path: "/resin-grades"
    description: "Registers a resin or additive masterbatch grade"
    roles: [PlantAdmin]
    code: 201
    input: [grade_code, material_class, polymer_family, melt_index, density_kg_m3, "food_contact_approved?", "pcr_content_pct?", cost_per_kg, dart_impact_index, haze_index, cof_index, seal_initiation_temp_c, "is_barrier?"]
    output: ResinGrade
    side_effects: []
  - method: GET
    path: "/resin-grades/{id}"
    description: "Reads one resin grade"
    roles: *READ_ROLES
    code: 200
    input: []
    output: ResinGrade
    side_effects: []
  - method: GET
    path: "/resin-grades"
    description: "Lists resin grades"
    roles: *READ_ROLES
    code: 200
    input: ["polymer_family?", "material_class?", "food_contact_approved?", "is_barrier?", "limit?", "offset?"]
    output: ResinGrade[]
    side_effects: []

  # ---- BlendRecipe ---------------------------------------------------------
  - method: POST
    path: "/blend-recipes"
    description: "Opens a DRAFT blend recipe for a product"
    roles: [BlendEngineer, PlantAdmin]
    code: 201
    input: [recipe_code, product_id, process_type, layer_count, "supersedes_recipe_id?"]
    output: BlendRecipe
    side_effects: ["initialises components to an empty list and every derived index to its default"]
  - method: GET
    path: "/blend-recipes/{id}"
    description: "Reads one blend recipe with its components array and every derived index"
    roles: *READ_ROLES
    code: 200
    input: []
    output: BlendRecipe
    side_effects: []
  - method: GET
    path: "/blend-recipes"
    description: "Lists blend recipes; filterable by product, by superseded predecessor and by status"
    roles: *READ_ROLES
    code: 200
    input: ["product_id?", "supersedes_recipe_id?", "status?", "limit?", "offset?"]
    output: BlendRecipe[]
    side_effects: []
  - method: POST
    path: "/blend-recipes/{id}/components"
    description: "Appends one component line to a DRAFT recipe and recomputes every blend calculation"
    roles: [BlendEngineer]
    code: 201
    input: [layer_index, component_kind, weight_pct, "resin_grade_id?"]
    output: BlendRecipe
    side_effects:
      - "appends to components with position = 1-based append index"
      - "recomputes blend_composition_totals, blend_cost_and_density, blend_property_indices, regrind_cap_evaluation"
  - method: POST
    path: "/blend-recipes/{id}/submit"
    description: "Submits a DRAFT recipe for quality review"
    roles: [BlendEngineer]
    code: 200
    input: []
    output: BlendRecipe
    side_effects: ["DRAFT -> SUBMITTED", "stamps submitted_by_user_id"]
  - method: POST
    path: "/blend-recipes/{id}/approve"
    description: "Approves a SUBMITTED recipe (approver must differ from submitter)"
    roles: [QualityManager]
    code: 200
    input: []
    output: BlendRecipe
    side_effects: ["SUBMITTED -> APPROVED", "sets food_contact_eligible", "supersedes the predecessor immediately when its pinned_run_count == 0, otherwise sets predecessor.supersede_pending"]
  - method: POST
    path: "/blend-recipes/{id}/reject"
    description: "Rejects a SUBMITTED recipe"
    roles: [QualityManager]
    code: 200
    input: [rejection_reason]
    output: BlendRecipe
    side_effects: ["SUBMITTED -> REJECTED"]
  - method: POST
    path: "/blend-recipes/{id}/reopen"
    description: "Returns a REJECTED recipe to DRAFT so components may be revised"
    roles: [BlendEngineer]
    code: 200
    input: []
    output: BlendRecipe
    side_effects: ["REJECTED -> DRAFT", "clears submitted_by_user_id and rejection_reason"]

  # ---- ExtrusionLine -------------------------------------------------------
  - method: POST
    path: "/extrusion-lines"
    description: "Registers a blown or cast film line"
    roles: [PlantAdmin]
    code: 201
    input: [line_code, process_type, max_layers, min_gauge_micron, max_gauge_micron, max_layflat_mm, "purge_buffer_minutes?", "food_contact_certified?"]
    output: ExtrusionLine
    side_effects: ["posture initialised to OPEN"]
  - method: GET
    path: "/extrusion-lines/{id}"
    description: "Reads one line with its derived posture and counters"
    roles: *READ_ROLES
    code: 200
    input: []
    output: ExtrusionLine
    side_effects: []
  - method: GET
    path: "/extrusion-lines"
    description: "Lists lines"
    roles: *READ_ROLES
    code: 200
    input: ["process_type?", "posture?", "food_contact_certified?", "limit?", "offset?"]
    output: ExtrusionLine[]
    side_effects: []
  - method: POST
    path: "/extrusion-lines/{id}/clear-capability-flags"
    description: "Quality engineering clears a line's capability and revocation counters after corrective action; posture is re-derived but already-blocked runs and quarantined rolls are not restored"
    roles: [QualityManager, PlantAdmin]
    code: 200
    input: []
    output: ExtrusionLine
    side_effects: ["zeroes incapable_run_count and revoked_dossier_count", "re-derives posture via calculations.line_posture"]

  # ---- ExtrusionRun --------------------------------------------------------
  - method: POST
    path: "/extrusion-runs"
    description: "Schedules a run: pins an APPROVED recipe onto a line for an exclusive window"
    roles: [ExtrusionOperator, PlantAdmin]
    code: 201
    input: [run_code, line_id, blend_recipe_id, scheduled_start, scheduled_end, target_output_kg]
    output: ExtrusionRun
    side_effects:
      - "runs calculations.line_occupancy_conflict with the conditional purge buffer"
      - "increments blend_recipe.pinned_run_count"
  - method: GET
    path: "/extrusion-runs/{id}"
    description: "Reads one run with its gauge_readings array and every derived capability and mass-balance field"
    roles: *READ_ROLES
    code: 200
    input: []
    output: ExtrusionRun
    side_effects: []
  - method: GET
    path: "/extrusion-runs"
    description: "Lists runs; filterable by line, by recipe and by status"
    roles: *READ_ROLES
    code: 200
    input: ["line_id?", "blend_recipe_id?", "status?", "gauge_capability_state?", "limit?", "offset?"]
    output: ExtrusionRun[]
    side_effects: []
  - method: PATCH
    path: "/extrusion-runs/{id}/reschedule"
    description: "Moves a SCHEDULED run's window, re-running the occupancy check"
    roles: [ExtrusionOperator, PlantAdmin]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: ExtrusionRun
    side_effects: ["re-runs calculations.line_occupancy_conflict"]
  - method: POST
    path: "/extrusion-runs/{id}/start"
    description: "Starts extrusion on the line"
    roles: [ExtrusionOperator]
    code: 200
    input: []
    output: ExtrusionRun
    side_effects: ["SCHEDULED -> RUNNING"]
  - method: POST
    path: "/extrusion-runs/{id}/gauge-readings"
    description: "Appends one gauge/layflat/bubble sample to a RUNNING or HELD run and re-runs the capability calculation"
    roles: [ExtrusionOperator]
    code: 201
    input: [thickness_micron, "layflat_mm?", "bubble_deviation_mm?"]
    output: ExtrusionRun
    side_effects:
      - "appends to gauge_readings with seq = 1-based append index; layflat_mm defaults to product.layflat_width_mm and bubble_deviation_mm to 0.0"
      - "recomputes calculations.gauge_capability"
  - method: POST
    path: "/extrusion-runs/{id}/hold"
    description: "Places a RUNNING run on hold for bubble instability or gauge drift"
    roles: [ExtrusionOperator]
    code: 200
    input: [hold_reason]
    output: ExtrusionRun
    side_effects: ["RUNNING -> HELD", "increments hold_count and line.active_hold_count", "re-derives line.posture"]
  - method: POST
    path: "/extrusion-runs/{id}/resume"
    description: "Resumes a HELD run"
    roles: [ExtrusionOperator]
    code: 200
    input: []
    output: ExtrusionRun
    side_effects: ["HELD -> RUNNING", "decrements line.active_hold_count", "re-derives line.posture"]
  - method: POST
    path: "/extrusion-runs/{id}/regrind-reincorporations"
    description: "Draws regrind mass from a pool into a RUNNING or HELD run under optimistic concurrency on the pool"
    roles: [ExtrusionOperator]
    code: 201
    input: [pool_id, kg, expected_regrind_pool_version]
    output: RegrindTransaction
    side_effects:
      - "creates a RegrindTransaction (direction OUT, origin_kind REINCORPORATION) with pcr_kg from the pool's embedded_pcr_pct at draw time"
      - "re-derives calculations.pool_mass_balance"
      - "increments RegrindPool.version by 1"
  - method: POST
    path: "/extrusion-runs/{id}/complete"
    description: "Closes a RUNNING run, freezing capability and the as-built recycled content and converting scrap into pool mass (cascade root A)"
    roles: [ExtrusionOperator]
    code: 200
    input: [gross_output_kg, scrap_kg]
    output: ExtrusionRun
    side_effects:
      - "RUNNING -> COMPLETED"
      - "runs calculations.gauge_capability and calculations.run_mass_balance"
      - "propagates actual_recycled_content_pct to every FilmRoll of this run"
      - "creates a RegrindTransaction (direction IN, origin_kind EXTRUSION_SCRAP) and re-derives calculations.pool_mass_balance"
      - "decrements blend_recipe.pinned_run_count and may fire a deferred supersede"
      - "increments line.incapable_run_count when the capability state is INCAPABLE and re-derives calculations.line_posture, which may BLOCK the line's SCHEDULED runs and QUARANTINE its WOUND rolls"

  # ---- FilmRoll ------------------------------------------------------------
  - method: POST
    path: "/film-rolls"
    description: "Records a wound roll against a run"
    roles: [ExtrusionOperator]
    code: 201
    input: [extrusion_run_id, roll_number, net_kg, "layflat_mm?", "gauge_micron_avg?"]
    output: FilmRoll
    side_effects: ["layflat_mm defaults to product.layflat_width_mm and gauge_micron_avg to product.target_gauge_micron"]
  - method: GET
    path: "/film-rolls/{id}"
    description: "Reads one roll"
    roles: *READ_ROLES
    code: 200
    input: []
    output: FilmRoll
    side_effects: []
  - method: GET
    path: "/film-rolls"
    description: "Lists rolls; filterable by producing run and status"
    roles: *READ_ROLES
    code: 200
    input: ["extrusion_run_id?", "status?", "limit?", "offset?"]
    output: FilmRoll[]
    side_effects: []
  - method: POST
    path: "/film-rolls/{id}/release"
    description: "Releases a WOUND roll for printing after capability, layflat and posture checks"
    roles: [QualityManager]
    code: 200
    input: []
    output: FilmRoll
    side_effects: ["WOUND -> RELEASED"]
  - method: POST
    path: "/film-rolls/{id}/scrap"
    description: "Scraps a WOUND or QUARANTINED roll into a regrind pool"
    roles: [QualityManager]
    code: 200
    input: ["pool_id?"]
    output: FilmRoll
    side_effects:
      - "-> SCRAPPED"
      - "creates a RegrindTransaction (direction IN, origin_kind ROLL_SCRAP, origin_ref_id = this roll id, kg = net_kg); pool_id defaults to the single eligible pool for the product's polymer family and food-contact status"
      - "re-derives calculations.pool_mass_balance"

  # ---- RegrindPool / RegrindTransaction ------------------------------------
  - method: POST
    path: "/regrind-pools"
    description: "Creates a segregated regrind pool"
    roles: [PlantAdmin]
    code: 201
    input: [pool_code, food_contact_status, polymer_family]
    output: RegrindPool
    side_effects: []
  - method: GET
    path: "/regrind-pools/{id}"
    description: "Reads one pool with its derived balances"
    roles: *READ_ROLES
    code: 200
    input: []
    output: RegrindPool
    side_effects: []
  - method: GET
    path: "/regrind-pools"
    description: "Lists pools"
    roles: *READ_ROLES
    code: 200
    input: ["food_contact_status?", "polymer_family?", "limit?", "offset?"]
    output: RegrindPool[]
    side_effects: []
  - method: GET
    path: "/regrind-pools/{id}/balance"
    description: "Computed read: re-derives calculations.pool_mass_balance from the pool's non-reversed transactions and returns the pool with the reconciled aggregates, so a test can assert invariant I1 without trusting the stored copy"
    roles: *READ_ROLES
    code: 200
    input: []
    output: RegrindPool
    side_effects: []
  - method: GET
    path: "/regrind-transactions/{id}"
    description: "Reads one immutable regrind transaction"
    roles: *READ_ROLES
    code: 200
    input: []
    output: RegrindTransaction
    side_effects: []
  - method: GET
    path: "/regrind-transactions"
    description: "Lists regrind transactions; filterable by pool, by run, by the transaction a reversal undoes, and by direction/origin"
    roles: *READ_ROLES
    code: 200
    input: ["pool_id?", "extrusion_run_id?", "reverses_transaction_id?", "direction?", "origin_kind?", "limit?", "offset?"]
    output: RegrindTransaction[]
    side_effects: []
  - method: POST
    path: "/regrind-transactions/{id}/reverse"
    description: "Compensating action: books a REVERSAL transaction that removes an earlier transaction from every pool aggregate"
    roles: [QualityManager]
    code: 201
    input: [reversal_reason]
    output: RegrindTransaction
    side_effects:
      - "creates a RegrindTransaction (origin_kind REVERSAL, reverses_transaction_id = the target, kg = target.kg, direction opposite to the target)"
      - "re-derives calculations.pool_mass_balance so invariants I1 and I2 hold again"
      - "when the target was a REINCORPORATION: decrements the run's regrind_consumed_kg and re-derives its regrind_actual_pct"
      - "increments RegrindPool.version by 1"

  # ---- PrintPress / PlateSet ----------------------------------------------
  - method: POST
    path: "/print-presses"
    description: "Registers a printing press with its cylinder capacity and registration/color tolerances"
    roles: [PlantAdmin]
    code: 201
    input: [press_code, cylinder_capacity, max_colors, registration_tolerance_micron, "max_delta_e?"]
    output: PrintPress
    side_effects: []
  - method: GET
    path: "/print-presses/{id}"
    description: "Reads one press"
    roles: *READ_ROLES
    code: 200
    input: []
    output: PrintPress
    side_effects: []
  - method: GET
    path: "/print-presses"
    description: "Lists presses"
    roles: *READ_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: PrintPress[]
    side_effects: []
  - method: POST
    path: "/plate-sets"
    description: "Registers a plate set for a product"
    roles: [PrintOperator, PlantAdmin]
    code: 201
    input: [plate_code, product_id, color_count, "wear_limit_impressions?"]
    output: PlateSet
    side_effects: []
  - method: GET
    path: "/plate-sets/{id}"
    description: "Reads one plate set"
    roles: *READ_ROLES
    code: 200
    input: []
    output: PlateSet
    side_effects: []
  - method: GET
    path: "/plate-sets"
    description: "Lists plate sets; filterable by product and by the press they are mounted on"
    roles: *READ_ROLES
    code: 200
    input: ["product_id?", "mounted_press_id?", "status?", "limit?", "offset?"]
    output: PlateSet[]
    side_effects: []
  - method: POST
    path: "/plate-sets/{id}/mount"
    description: "Mounts a NEW plate set onto a press"
    roles: [PrintOperator]
    code: 200
    input: [press_id]
    output: PlateSet
    side_effects: ["NEW -> MOUNTED", "sets mounted_press_id"]

  # ---- PrintJob ------------------------------------------------------------
  - method: POST
    path: "/print-jobs"
    description: "Creates a print job, consuming a RELEASED roll and reserving press cylinders for a window"
    roles: [PrintOperator]
    code: 201
    input: [job_code, film_roll_id, plate_set_id, press_id, window_start, window_end]
    output: PrintJob
    side_effects:
      - "runs calculations.press_cylinder_capacity over overlapping SETUP/PRINTING jobs"
      - "freezes cylinders_required from plate_set.color_count"
      - "film_roll RELEASED -> CONSUMED"
  - method: GET
    path: "/print-jobs/{id}"
    description: "Reads one print job with all three state dimensions"
    roles: *READ_ROLES
    code: 200
    input: []
    output: PrintJob
    side_effects: []
  - method: GET
    path: "/print-jobs"
    description: "Lists print jobs; filterable by roll, plate set and press"
    roles: *READ_ROLES
    code: 200
    input: ["film_roll_id?", "plate_set_id?", "press_id?", "status?", "registration_state?", "color_state?", "limit?", "offset?"]
    output: PrintJob[]
    side_effects: []
  - method: POST
    path: "/print-jobs/{id}/registration-check"
    description: "Records a registration measurement, moving only the registration_state dimension"
    roles: [PrintOperator]
    code: 200
    input: [registration_drift_micron]
    output: PrintJob
    side_effects: ["sets registration_state to REG_PASS or REG_FAIL", "increments setup_attempt_count", "status -> BLOCKED once setup_attempt_count exceeds MAX_SETUP_ATTEMPTS"]
  - method: POST
    path: "/print-jobs/{id}/color-proof"
    description: "Records a color proof measurement, moving only the color_state dimension"
    roles: [PrintOperator]
    code: 200
    input: [delta_e_measured]
    output: PrintJob
    side_effects: ["sets color_state to COLOR_PASS or COLOR_FAIL", "increments setup_attempt_count", "status -> BLOCKED once setup_attempt_count exceeds MAX_SETUP_ATTEMPTS"]
  - method: POST
    path: "/print-jobs/{id}/start-print"
    description: "Starts printing; requires both the registration and color dimensions to have passed"
    roles: [PrintOperator]
    code: 200
    input: []
    output: PrintJob
    side_effects: ["SETUP -> PRINTING"]
  - method: POST
    path: "/print-jobs/{id}/complete"
    description: "Closes a PRINTING job, charging impressions to the plate set and releasing the cylinder window"
    roles: [PrintOperator]
    code: 200
    input: [printed_kg]
    output: PrintJob
    side_effects: ["PRINTING -> COMPLETED", "increments plate_set.impressions_count by floor(printed_kg)", "plate_set -> WORN at the wear limit, blocking its SETUP jobs"]

  # ---- BagLot --------------------------------------------------------------
  - method: POST
    path: "/bag-lots"
    description: "Opens a converting lot from a COMPLETED print job and computes the theoretical count and count accuracy"
    roles: [ConvertingOperator]
    code: 201
    input: [lot_code, print_job_id, product_id, bag_count_produced, "bag_count_scrapped?", "perforation_verified?", "gusset_verified?"]
    output: BagLot
    side_effects:
      - "runs calculations.bag_count_and_accuracy -> bag_unit_weight_kg, bag_count_theoretical, count_accuracy_pct, count_accuracy_conforming"
      - "sets bag_count_unpacked = bag_count_produced - bag_count_scrapped"
      - "copies actual_recycled_content_pct from the producing FilmRoll"
  - method: GET
    path: "/bag-lots/{id}"
    description: "Reads one lot with its seal_specimens array, both seal variants and every packout counter"
    roles: *READ_ROLES
    code: 200
    input: []
    output: BagLot
    side_effects: []
  - method: GET
    path: "/bag-lots"
    description: "Lists bag lots; filterable by print job and product"
    roles: *READ_ROLES
    code: 200
    input: ["print_job_id?", "product_id?", "status?", "limit?", "offset?"]
    output: BagLot[]
    side_effects: []
  - method: POST
    path: "/bag-lots/{id}/seal-tests"
    description: "Appends one seal specimen; attempt is derived as 1 + the number of earlier specimens with the same specimen_index and is_retest is derived as attempt > 1"
    roles: [ConvertingOperator, QualityManager]
    code: 201
    input: [specimen_index, measured_n_per_15mm, "test_kind?"]
    output: BagLot
    side_effects:
      - "CONVERTING -> TESTING on the first specimen"
      - "records entered_by_user_id from the acting X-User-ID (feeds the dossier segregation-of-duties rule)"
      - "recomputes the provisional variant of calculations.seal_strength_qualification"
  - method: POST
    path: "/bag-lots/{id}/finalize-tests"
    description: "Computes the final seal variant over the superseding panel and forks the lot to QUALIFIED, CONDITIONAL or FAILED"
    roles: [QualityManager]
    code: 200
    input: []
    output: BagLot
    side_effects:
      - "writes seal_final_min_n, seal_final_mean_n, seal_final_verdict"
      - "on FAIL: scraps the whole lot and books a LOT_SCRAP RegrindTransaction, re-deriving calculations.pool_mass_balance"
  - method: POST
    path: "/bag-lots/{id}/packout"
    description: "Allocates unpacked bags into cases and pallets under optimistic concurrency on the lot"
    roles: [ConvertingOperator]
    code: 200
    input: [requested_bags, expected_bag_lot_version]
    output: BagLot
    side_effects:
      - "runs calculations.case_packout_allocation"
      - "QUALIFIED/CONDITIONAL -> PACKED and updates every packout counter"
      - "increments BagLot.version by 1"
  - method: POST
    path: "/bag-lots/{id}/release"
    description: "Releases a PACKED lot to the customer after count-accuracy and dossier checks"
    roles: [QualityManager]
    code: 200
    input: []
    output: BagLot
    side_effects: ["PACKED -> RELEASED"]
  - method: POST
    path: "/bag-lots/{id}/ship"
    description: "Ships a RELEASED lot"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: BagLot
    side_effects: ["RELEASED -> SHIPPED"]

  # ---- ComplianceDossier ---------------------------------------------------
  - method: POST
    path: "/compliance-dossiers"
    description: "Drafts a food-contact and recycled-content dossier for a lot"
    roles: [QualityManager]
    code: 201
    input: [dossier_code, bag_lot_id, food_contact_declared, recycled_content_claim_pct]
    output: ComplianceDossier
    side_effects: []
  - method: GET
    path: "/compliance-dossiers/{id}"
    description: "Reads one dossier with its frozen as-built figure and claim conformance"
    roles: *READ_ROLES
    code: 200
    input: []
    output: ComplianceDossier
    side_effects: []
  - method: GET
    path: "/compliance-dossiers"
    description: "Lists dossiers; filterable by lot"
    roles: *READ_ROLES
    code: 200
    input: ["bag_lot_id?", "status?", "claim_conformance?", "limit?", "offset?"]
    output: ComplianceDossier[]
    side_effects: []
  - method: POST
    path: "/compliance-dossiers/{id}/issue"
    description: "Issues a DRAFT dossier, freezing the as-built recycled content and checking the claim against it"
    roles: [QualityManager]
    code: 200
    input: []
    output: ComplianceDossier
    side_effects: ["DRAFT -> ISSUED", "freezes as_built_recycled_content_pct and computes claim_variance_pct / claim_conformance", "stamps issued_by_user_id and issued_at"]
  - method: POST
    path: "/compliance-dossiers/{id}/revoke"
    description: "Revokes an ISSUED dossier (cascade root B, depth 5)"
    roles: [QualityManager]
    code: 200
    input: [revocation_reason]
    output: ComplianceDossier
    side_effects:
      - "ISSUED -> REVOKED and stamps revoked_at"
      - "bag_lot -> QUARANTINED with its packout unwound"
      - "increments the lot's plate set nonconformance_count, possibly wearing it out and blocking its SETUP jobs"
      - "increments the producing line's revoked_dossier_count and re-derives calculations.line_posture, which BLOCKs the line's SCHEDULED runs and QUARANTINEs its WOUND rolls"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # -- auth / schema --------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, bad type, unknown enum member, or a per-field constraint violation (non-positive mass, scheduled_end <= scheduled_start, window_end <= window_start, weight_pct <= 0)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset negative or non-integer"

  # -- not found ------------------------------------------------------------
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product id in a path or body does not resolve"
  - id: ERR_RESIN_GRADE_NOT_FOUND
    http: 404
    condition: "resin_grade_id does not resolve"
  - id: ERR_BLEND_RECIPE_NOT_FOUND
    http: 404
    condition: "blend recipe id in a path or body (including supersedes_recipe_id) does not resolve"
  - id: ERR_EXTRUSION_LINE_NOT_FOUND
    http: 404
    condition: "line id does not resolve"
  - id: ERR_EXTRUSION_RUN_NOT_FOUND
    http: 404
    condition: "extrusion run id does not resolve"
  - id: ERR_FILM_ROLL_NOT_FOUND
    http: 404
    condition: "film roll id does not resolve"
  - id: ERR_REGRIND_POOL_NOT_FOUND
    http: 404
    condition: "pool id does not resolve"
  - id: ERR_REGRIND_TRANSACTION_NOT_FOUND
    http: 404
    condition: "regrind transaction id does not resolve"
  - id: ERR_PRINT_PRESS_NOT_FOUND
    http: 404
    condition: "press id does not resolve"
  - id: ERR_PLATE_SET_NOT_FOUND
    http: 404
    condition: "plate set id does not resolve"
  - id: ERR_PRINT_JOB_NOT_FOUND
    http: 404
    condition: "print job id does not resolve"
  - id: ERR_BAG_LOT_NOT_FOUND
    http: 404
    condition: "bag lot id does not resolve"
  - id: ERR_DOSSIER_NOT_FOUND
    http: 404
    condition: "compliance dossier id does not resolve"

  # -- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A business code already exists (product_code, grade_code, recipe_code, line_code, run_code, pool_code, press_code, plate_code, job_code, lot_code, dossier_code), or roll_number is reused within the same extrusion run"

  # -- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_regrind_pool_version does not equal the pool's current version"
  - id: ERR_STALE_BAG_LOT_VERSION
    http: 412
    condition: "expected_bag_lot_version does not equal the lot's current version"

  # -- entity state --------------------------------------------------------
  - id: ERR_RECIPE_STATE_INVALID
    http: 409
    condition: "The recipe transition is not declared from its current status (submit on non-DRAFT, approve/reject on non-SUBMITTED, reopen on non-REJECTED, components appended to a non-DRAFT recipe)"
  - id: ERR_RUN_STATE_INVALID
    http: 409
    condition: "The run transition is not declared from its current status (start on non-SCHEDULED, hold on non-RUNNING, resume on non-HELD, complete on non-RUNNING, gauge readings or reincorporation on a run that is not RUNNING or HELD, reschedule on a non-SCHEDULED run), or a roll release names a run that is not COMPLETED"
  - id: ERR_ROLL_STATE_INVALID
    http: 409
    condition: "Release attempted on a non-WOUND roll, scrap attempted on a CONSUMED/RELEASED/SCRAPPED roll, or a print job names a roll that is not RELEASED"
  - id: ERR_PLATE_STATE_INVALID
    http: 409
    condition: "Mount attempted on a plate set that is not NEW, or a print job / start-print names a plate set that is not MOUNTED on the job's press"
  - id: ERR_PRINT_JOB_STATE_INVALID
    http: 409
    condition: "start-print on a non-SETUP job or on a SETUP job whose registration_state is not REG_PASS or whose color_state is not COLOR_PASS, complete on a non-PRINTING job, a measurement recorded on a job that is not in SETUP, or a bag lot created from a job that is not COMPLETED"
  - id: ERR_BAG_LOT_STATE_INVALID
    http: 409
    condition: "seal-tests on a lot that is not CONVERTING or TESTING, finalize-tests on a lot that is not TESTING, packout on a lot that is not QUALIFIED/CONDITIONAL/PACKED, release on a non-PACKED lot, ship on a non-RELEASED lot"
  - id: ERR_DOSSIER_STATE_INVALID
    http: 409
    condition: "issue on a non-DRAFT dossier, revoke on a non-ISSUED dossier, or a dossier drafted for a lot whose status is not QUALIFIED/CONDITIONAL/PACKED"

  # -- cross-entity state gates -------------------------------------------
  - id: ERR_RECIPE_NOT_APPROVED
    http: 409
    condition: "A run is scheduled or started against a recipe whose status is not APPROVED (including one that has been SUPERSEDED)"
  - id: ERR_DOSSIER_NOT_ISSUED
    http: 409
    condition: "A lot release finds no ISSUED dossier for the lot, or (for a CONDITIONAL lot) the dossier's claim_conformance is not CONFORMING"
  - id: ERR_LINE_POSTURE_FROZEN
    http: 409
    condition: "A run is scheduled, started or resumed, or a roll is released, on a line whose derived posture is FROZEN"
  - id: ERR_LINE_POSTURE_RESTRICTED
    http: 409
    condition: "A food-contact run is scheduled on a line whose derived posture is RESTRICTED"

  # -- business safety / compliance ---------------------------------------
  - id: ERR_FOOD_CONTACT_RESIN_INELIGIBLE
    http: 422
    condition: "A recipe for a food-contact product is submitted while some VIRGIN or ADDITIVE component's resin has food_contact_approved == false"
  - id: ERR_LINE_NOT_FOOD_CERTIFIED
    http: 422
    condition: "A run for a food-contact product is scheduled or started on a line whose food_contact_certified is false"
  - id: ERR_FOOD_CONTACT_POOL_INELIGIBLE
    http: 422
    condition: "A run for a food-contact product draws regrind from a pool whose food_contact_status is NON_FOOD_ONLY, or the pool's polymer_family differs from the recipe's dominant_polymer_family"
  - id: ERR_FOOD_CONTACT_DECLARATION_INVALID
    http: 422
    condition: "A dossier with food_contact_declared == true is issued while the lot's recipe has food_contact_eligible == false or the producing line is not food_contact_certified"
  - id: ERR_CLAIM_OVERSTATED
    http: 422
    condition: "A dossier is issued whose recycled_content_claim_pct exceeds the as-built figure by more than CLAIM_TOLERANCE_PCT (0.500)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID approved or rejected a recipe it had submitted, or issued a dossier for a lot in whose seal_specimens it appears as entered_by_user_id"
  - id: ERR_CONVERTING_FEATURE_NOT_VERIFIED
    http: 422
    condition: "Seal testing begins on a lot whose perforation-required product has perforation_verified == false, or whose GUSSETED product has gusset_verified == false"

  # -- blend structural coherence -----------------------------------------
  - id: ERR_BLEND_WEIGHT_NOT_100
    http: 422
    condition: "A recipe is submitted whose total_weight_pct is not exactly 100.000 (including an empty component list)"
  - id: ERR_LAYER_COUNT_MISMATCH
    http: 422
    condition: "A recipe's layer_count differs from product.required_layer_count at submit, or a component's layer_index is outside [1, layer_count]"
  - id: ERR_BARRIER_STRUCTURE_REQUIRED
    http: 422
    condition: "A recipe for a product with required_layer_count >= 3 is submitted with barrier_layer_present == false"
  - id: ERR_REGRIND_CAP_EXCEEDED
    http: 422
    condition: "A recipe is submitted whose regrind_pct exceeds regrind_cap_pct (equality at the cap is accepted)"
  - id: ERR_STRENGTH_INDEX_BELOW_MIN
    http: 422
    condition: "A recipe is submitted whose strength_index is below product.min_strength_index"
  - id: ERR_PRODUCT_MISMATCH
    http: 409
    condition: "A bag lot's product_id differs from the product of its print job's plate set, or a superseding recipe targets a different product than its predecessor"

  # -- resource capability, occupancy and capacity ------------------------
  - id: ERR_LINE_CAPABILITY_MISMATCH
    http: 422
    condition: "The recipe's layer_count exceeds line.max_layers, the recipe's process_type differs from line.process_type, or the product's target gauge or layflat is outside the line's range"
  - id: ERR_LINE_WINDOW_CONFLICT
    http: 409
    condition: "The requested run window overlaps an occupying run's window (status SCHEDULED, RUNNING or HELD) once the conditional purge buffer is applied"
  - id: ERR_PRESS_CYLINDER_CAPACITY
    http: 409
    condition: "The sum of cylinders_required across overlapping SETUP/PRINTING jobs plus the new job exceeds press.cylinder_capacity"
  - id: ERR_PLATE_COLOR_EXCEEDS_PRESS
    http: 422
    condition: "A plate set with color_count greater than press.max_colors is mounted"

  # -- temporal -----------------------------------------------------------
  - id: ERR_WINDOW_IN_PAST
    http: 409
    condition: "A run is scheduled or rescheduled with scheduled_start earlier than the current logical clock"
  - id: ERR_RUN_NOT_YET_STARTABLE
    http: 409
    condition: "A run is started while the current logical clock is earlier than scheduled_start"
  - id: ERR_PRINT_WINDOW_NOT_OPEN
    http: 409
    condition: "start-print is called while the current logical clock is earlier than window_start"
  - id: ERR_RUN_HOLD_LIMIT_EXCEEDED
    http: 409
    condition: "resume is called on a run whose hold_count already exceeds MAX_RUN_HOLDS (3)"

  # -- quantity, data sufficiency and budget ------------------------------
  - id: ERR_INSUFFICIENT_GAUGE_DATA
    http: 422
    condition: "A run is completed with fewer than MIN_GAUGE_SAMPLES (5) gauge readings"
  - id: ERR_INSUFFICIENT_SEAL_PANEL
    http: 422
    condition: "finalize-tests is called while the superseding BOTTOM_SEAL panel holds fewer than MIN_SEAL_SPECIMENS (3) distinct specimen indices"
  - id: ERR_SCRAP_EXCEEDS_OUTPUT
    http: 422
    condition: "A run is completed with scrap_kg greater than gross_output_kg"
  - id: ERR_NO_ELIGIBLE_REGRIND_POOL
    http: 409
    condition: "Scrap must be booked (run completion, roll scrap, failed-lot scrap) but no pool matches the required polymer family and food-contact status"
  - id: ERR_REGRIND_INSUFFICIENT
    http: 409
    condition: "A reincorporation requests more kg than the pool's available_kg"
  - id: ERR_REGRIND_BUDGET_EXCEEDED
    http: 422
    condition: "A reincorporation would push the run's cumulative regrind draw above target_output_kg * recipe.regrind_cap_pct / 100"
  - id: ERR_PACKOUT_EXCEEDS_UNPACKED
    http: 422
    condition: "requested_bags exceeds the lot's bag_count_unpacked"
  - id: ERR_PRINTED_KG_EXCEEDS_ROLL
    http: 422
    condition: "printed_kg reported at print job completion exceeds the roll's net_kg, or is not positive"
  - id: ERR_COUNT_ACCURACY_OUT_OF_SPEC
    http: 422
    condition: "A lot is released while count_accuracy_conforming is false"
  - id: ERR_LAYFLAT_OUT_OF_TOLERANCE
    http: 422
    condition: "A roll is released whose layflat_mm deviates from product.layflat_width_mm by more than LAYFLAT_TOLERANCE_MM (5.0)"
  - id: ERR_GAUGE_CAPABILITY_INSUFFICIENT
    http: 422
    condition: "A roll is released whose producing run has gauge_capability_state INCAPABLE or INSUFFICIENT_DATA"
  - id: ERR_TRANSACTION_ALREADY_REVERSED
    http: 409
    condition: "The target transaction is already referenced by an existing REVERSAL"
  - id: ERR_TRANSACTION_NOT_REVERSIBLE
    http: 422
    condition: "The target transaction is itself a REVERSAL, or reversing it would drive the pool's available_kg below zero"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties over six opaque operator roles
# -----------------------------------------------------------------------------
roles:

  - name: PlantAdmin
    description: "Plant master-data owner and shipping authority; owns the logical clock, product/resin/line/press/pool registries and the final ship step"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /products"
      - "POST /resin-grades"
      - "POST /extrusion-lines"
      - "POST /print-presses"
      - "POST /regrind-pools"
      - "POST /bag-lots/{id}/ship"
    shared_operations:
      - "POST /blend-recipes (with BlendEngineer)"
      - "POST /plate-sets (with PrintOperator)"
      - "POST /extrusion-runs and PATCH /extrusion-runs/{id}/reschedule (with ExtrusionOperator)"
      - "POST /extrusion-lines/{id}/clear-capability-flags (with QualityManager)"
      - "all GET endpoints"

  - name: BlendEngineer
    description: "Designs resin blends and coextrusion structures; may submit a recipe for review but never approve one"
    identity: opaque
    exclusive_operations:
      - "POST /blend-recipes/{id}/components"
      - "POST /blend-recipes/{id}/submit"
      - "POST /blend-recipes/{id}/reopen"
    shared_operations:
      - "POST /blend-recipes (with PlantAdmin)"
      - "all GET endpoints"

  - name: QualityManager
    description: "Quality and compliance authority: approves or rejects recipes, releases or scraps rolls, finalizes seal testing, reverses regrind transactions, releases lots, issues and revokes dossiers"
    identity: opaque
    exclusive_operations:
      - "POST /blend-recipes/{id}/approve"
      - "POST /blend-recipes/{id}/reject"
      - "POST /film-rolls/{id}/release"
      - "POST /film-rolls/{id}/scrap"
      - "POST /regrind-transactions/{id}/reverse"
      - "POST /bag-lots/{id}/finalize-tests"
      - "POST /bag-lots/{id}/release"
      - "POST /compliance-dossiers"
      - "POST /compliance-dossiers/{id}/issue"
      - "POST /compliance-dossiers/{id}/revoke"
    shared_operations:
      - "POST /bag-lots/{id}/seal-tests (with ConvertingOperator)"
      - "POST /extrusion-lines/{id}/clear-capability-flags (with PlantAdmin)"
      - "all GET endpoints"

  - name: ExtrusionOperator
    description: "Runs the film lines: schedules, starts, holds, resumes and completes runs, logs gauge samples, draws regrind and records wound rolls"
    identity: opaque
    exclusive_operations:
      - "POST /extrusion-runs/{id}/start"
      - "POST /extrusion-runs/{id}/gauge-readings"
      - "POST /extrusion-runs/{id}/hold"
      - "POST /extrusion-runs/{id}/resume"
      - "POST /extrusion-runs/{id}/regrind-reincorporations"
      - "POST /extrusion-runs/{id}/complete"
      - "POST /film-rolls"
    shared_operations:
      - "POST /extrusion-runs and PATCH /extrusion-runs/{id}/reschedule (with PlantAdmin)"
      - "all GET endpoints"

  - name: PrintOperator
    description: "Runs the presses: mounts plate sets, creates print jobs, records registration and color measurements and completes printing"
    identity: opaque
    exclusive_operations:
      - "POST /plate-sets/{id}/mount"
      - "POST /print-jobs"
      - "POST /print-jobs/{id}/registration-check"
      - "POST /print-jobs/{id}/color-proof"
      - "POST /print-jobs/{id}/start-print"
      - "POST /print-jobs/{id}/complete"
    shared_operations:
      - "POST /plate-sets (with PlantAdmin)"
      - "all GET endpoints"

  - name: ConvertingOperator
    description: "Runs the bag machines: opens lots, records seal specimens and commits case packouts"
    identity: opaque
    exclusive_operations:
      - "POST /bag-lots"
      - "POST /bag-lots/{id}/packout"
    shared_operations:
      - "POST /bag-lots/{id}/seal-tests (with QualityManager)"
      - "all GET endpoints"

segregation_of_duties_rules:
  - name: recipe_approver_distinct_from_submitter
    check: "On POST /blend-recipes/{id}/approve and POST /blend-recipes/{id}/reject, the acting X-User-ID MUST differ from BlendRecipe.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
  - name: dossier_issuer_not_a_seal_tester
    check: "On POST /compliance-dossiers/{id}/issue, the acting X-User-ID MUST NOT appear in bag_lot.seal_specimens[*].entered_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES

global_constants:
  DEFAULT_LOGICAL_CLOCK: "2026-08-01T00:00:00Z"
  MAX_RUN_HOLDS: 3
  MAX_SETUP_ATTEMPTS: 4
  PLATE_NONCONFORMANCE_LIMIT: 1
  CLAIM_TOLERANCE_PCT: 0.500


