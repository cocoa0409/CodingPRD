          Conserved quantity 1 of 2 — integer cell slots, pinned as
          committed_terminal_count + reserved_slot_count + free_slot_count == max_active_terminals.
          Activation moves one unit from reserved to committed and termination is its compensating
          action, returning the unit to free; the sum must equal 1 before, between and after, with no
          drift left in reserved_slot_count.
