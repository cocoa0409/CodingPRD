          Setup: Order O9 is CANCELLED (terminal). We attempt POST /orders/{id}/line-items with a
          DISCONTINUED paper. Server MUST return ERR_INVALID_STATE (priority 4), NOT ERR_PAPER_DISCONTINUED (priority 5).
