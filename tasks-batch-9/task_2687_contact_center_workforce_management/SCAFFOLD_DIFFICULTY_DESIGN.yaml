              as: SchedulingManager
              captures: { tpl_am_id: "$.data.id" }
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-MON-EVE", skill_code: "CHAT_EN", start_time_local: "20:00", duration_minutes: 240, unpaid_break_minutes: 0, days_of_week: [0], slots_total: 1 }
              as: SchedulingManager
