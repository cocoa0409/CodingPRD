# =============================================================================
# SCAFFOLD.yaml — Label & Flexible-Packaging Converter benchmark seed tables
# Scenario: artwork/plate & revision control, substrate & ink recipes,
# press setup & waste allowance by run length, die inventory & new-die charge,
# Delta-E color approval, roll rewind spec & splice limit, food-contact
# compliance letters, minimum-order & tiered price breaks.
# =============================================================================

scenario: |
  Label & Flexible-Packaging Converter (Multi-Color style converter): artwork/plate
  management & revision control, substrate & ink recipe, press setup & waste
  allowance by run length, die inventory & new-die charge, color measurement
  (Delta-E) approval, roll rewind spec & splice limit, food-contact compliance
  letter, minimum-order & tiered price break

domain_name: label-flexible-packaging-converter
api_prefix: /label-jobs

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
    - cascading_side_effects
  entity_topology: hybrid
  state_machine_shape: branching   # artwork revision cycle (cyclic) + job fork-join approval
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain       # Estimator → PrepressOperator → PressOperator → QualityManager
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Customer account name" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true, new jobs for this customer cannot be released to press" }
      - { name: preferred_currency, type: string, source: input, default: "USD", description: "Billing currency code" }

  - name: ArtworkVersion
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: artwork_code, type: string, source: input, description: "Human-readable artwork reference (unique per customer)" }
      - { name: revision_no, type: integer, source: input, description: "Revision number; must be strictly greater than the current max revision for the same artwork_code" }
      - { name: color_count, type: integer, source: input, description: "Number of print stations (1..8) required to reproduce this artwork" }
      - { name: plate_set_cost_cents, type: integer, source: input, description: "One-time cost of the plate set for this revision, in cents" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED | OBSOLETE" }

  - name: Substrate
    parent: null
    common_fields: true
    fields:
      - { name: substrate_code, type: string, source: input, description: "Material code (e.g., BOPP-30, PET-12), unique" }
      - { name: width_mm, type: integer, source: input, description: "Web width available in mm" }
      - { name: cost_per_msq_cents, type: integer, source: input, description: "Material cost per 1000 square inches (MSI), cents" }
      - { name: food_contact_certified, type: boolean, source: input, default: false, description: "Whether the substrate carries a food-contact certification" }

  - name: InkRecipe
    parent: null
    common_fields: true
    fields:
      - { name: recipe_code, type: string, source: input, description: "Ink recipe code, unique" }
      - { name: food_contact_compliant, type: boolean, source: input, default: false, description: "Whether the recipe is formulated for food-contact packaging" }
      - { name: cost_per_lb_cents, type: integer, source: input, description: "Ink cost per pound, cents" }

  - name: Die
    parent: null
    common_fields: true
    fields:
      - { name: die_code, type: string, source: input, description: "Die identifier, unique" }
      - { name: shape_description, type: string, source: input, description: "Free-text description of the die cut" }
      - { name: cavities_across, type: integer, source: input, description: "Number of label cavities across the web" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED — new dies start ACTIVE" }
      - { name: new_die_charge_cents, type: integer, source: computed, description: "One-time tooling charge applied to the first job that uses this die; 750000 cents if die was created via new-die purchase, else 0" }
      - { name: charge_collected, type: boolean, source: system, default: false, description: "Whether the new-die charge has already been billed on some job" }

  - name: Press
    parent: null
    common_fields: true
    fields:
      - { name: press_code, type: string, source: input, description: "Press identifier, unique" }
      - { name: station_count, type: integer, source: input, description: "Number of print stations (max colors the press can run)" }
      - { name: setup_waste_ft, type: integer, source: input, description: "Base feet of material consumed in makeready before first sellable impression" }
      - { name: run_waste_pct_numerator, type: integer, source: input, description: "Running waste percent numerator (e.g., 5 means 5% of running footage is wasted)" }

  - name: LabelJob
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; ordering customer" }
      - { name: artwork_version_id, type: string, source: input, description: "FK -> ArtworkVersion.id; must reference an APPROVED revision at release time" }
      - { name: substrate_id, type: string, source: input, description: "FK -> Substrate.id" }
      - { name: ink_recipe_id, type: string, source: input, description: "FK -> InkRecipe.id" }
      - { name: die_id, type: string, source: input, description: "FK -> Die.id" }
      - { name: press_id, type: string, source: input, description: "FK -> Press.id" }
      - { name: quantity_ordered, type: integer, source: input, description: "Ordered label count; must satisfy the minimum-order rule at release" }
      - { name: repeat_length_mm, type: integer, source: input, description: "Label repeat (cut-off) length in mm" }
      - { name: requires_food_contact_letter, type: boolean, source: input, default: false, description: "When true, a food-contact compliance letter must be issued before shipment" }
      - { name: rewind_max_rolls, type: integer, source: input, description: "Maximum number of finished rolls the customer accepts for this job" }
      - { name: max_splices_per_roll, type: integer, source: input, description: "Maximum splices the customer tolerates in any single finished roll" }
      - { name: material_ft, type: integer, source: computed, description: "Total linear feet required including press setup waste and running waste (see job_material_calc)" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Provisional quote at job creation (per-thousand tier on quantity_ordered)" }
      - { name: invoiced_price_cents, type: integer, source: computed, default: null, description: "Final invoice computed at job completion using ACTUAL good quantity shipped" }
      - { name: die_charge_applied_cents, type: integer, source: computed, default: 0, description: "New-die tooling charge billed into this job's quote, if this job was the die's first use" }
      - { name: status, type: enum, source: system, description: "QUOTED → APPROVED → RELEASED → ON_PRESS → PRINTED → REWOUND → SHIPPED | CANCELLED" }
      - { name: good_quantity_produced, type: integer, source: computed, default: null, description: "Recorded at press completion; drives invoice re-pricing" }

  - name: ColorMeasurement
    parent: LabelJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> LabelJob.id" }
      - { name: station_no, type: integer, source: input, description: "Print station measured (1..press.station_count)" }
      - { name: delta_e, type: number, source: input, description: "Measured Delta-E 2000 value against the approved standard" }
      - { name: verdict, type: enum, source: system, description: "PENDING → PASS | FAIL" }

  - name: RewindRoll
    parent: LabelJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> LabelJob.id" }
      - { name: roll_seq, type: integer, source: input, description: "Sequence number of this finished roll within the job (1-based)" }
      - { name: label_count, type: integer, source: input, description: "Number of good labels wound on this roll" }
      - { name: splice_count, type: integer, source: input, description: "Number of splices on this roll" }
      - { name: status, type: enum, source: system, description: "WOUND → ACCEPTED | REJECTED" }

  - name: ComplianceLetter
    parent: LabelJob
    common_fields: false
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> LabelJob.id" }
      - { name: letter_type, type: enum, source: input, description: "FOOD_CONTACT" }
      - { name: issued_at, type: datetime, source: system, description: "Server timestamp when the letter was issued" }
      - { name: body, type: string, source: input, description: "Letter text asserting substrate+recipe food-contact conformity" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ArtworkVersion
    initial_state: DRAFT
    terminal_states: [APPROVED, OBSOLETE]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /label-jobs/customers/{id}/artwork-versions/{artworkId}/submit
        actor: PrepressOperator
        preconditions:
          - "Artwork must be DRAFT (ERR_ARTWORK_NOT_DRAFT)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /label-jobs/customers/{id}/artwork-versions/{artworkId}/approve
        actor: PrepressOperator
        preconditions:
          - "Artwork must be SUBMITTED (ERR_ARTWORK_NOT_SUBMITTED)"
        side_effects:
          - "Any other ArtworkVersion with the same (customer_id, artwork_code) currently APPROVED flips to OBSOLETE (revision supersession)"
      - from: SUBMITTED
        to: DRAFT
        trigger: POST /label-jobs/customers/{id}/artwork-versions/{artworkId}/return
        actor: PrepressOperator
        preconditions:
          - "Artwork must be SUBMITTED (ERR_ARTWORK_NOT_SUBMITTED)"
        side_effects: []
      - from: APPROVED
        to: OBSOLETE
        trigger: "system (automatic when a newer revision of the same artwork_code is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Any QUOTED, APPROVED, or RELEASED LabelJob still referencing the now-OBSOLETE artwork flips to CANCELLED and its die charge, if collected on this job, is released (die.charge_collected set false, allowing re-billing on the next job that uses the die)"

  - entity: LabelJob
    initial_state: QUOTED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: POST /label-jobs/jobs/{id}/approve
        actor: Estimator
        preconditions:
          - "Job must be QUOTED (ERR_JOB_NOT_QUOTED)"
        side_effects: []
      - from: APPROVED
        to: RELEASED
        trigger: POST /label-jobs/jobs/{id}/release
        actor: Estimator
        preconditions:
          - "Job must be APPROVED (ERR_JOB_NOT_APPROVED)"
          - "Customer must not be on credit hold (ERR_CUSTOMER_CREDIT_HOLD)"
          - "quantity_ordered >= MIN_ORDER_QTY (1000) (ERR_BELOW_MINIMUM_ORDER)"
          - "Referenced artwork must be APPROVED (ERR_ARTWORK_NOT_APPROVED)"
          - "If requires_food_contact_letter: substrate.food_contact_certified AND ink_recipe.food_contact_compliant must both be true (ERR_FOOD_CONTACT_COMPONENT)"
        side_effects:
          - "If the referenced die has new_die_charge_cents > 0 and charge_collected == false: bill die_charge_applied_cents = die.new_die_charge_cents into this job, set die.charge_collected = true (increments Die.version)"
          - "material_ft computed via job_material_calc and frozen on the job"
      - from: RELEASED
        to: ON_PRESS
        trigger: POST /label-jobs/jobs/{id}/start-press
        actor: PressOperator
        preconditions:
          - "Job must be RELEASED (ERR_JOB_NOT_RELEASED)"
          - "Press referenced by job.press_id has no other job currently ON_PRESS (ERR_PRESS_OCCUPIED)"
        side_effects: []
      - from: ON_PRESS
        to: PRINTED
        trigger: POST /label-jobs/jobs/{id}/complete-press
        actor: PressOperator
        preconditions:
          - "Job must be ON_PRESS (ERR_JOB_NOT_ON_PRESS)"
          - "Every ColorMeasurement for this job has verdict == PASS, and at least one measurement row must exist — vacuous truth does NOT apply (ERR_COLOR_NOT_APPROVED)"
          - "good_quantity_produced must be supplied in the request body and must be > 0 (ERR_INVALID_GOOD_QTY)"
        side_effects:
          - "job.good_quantity_produced recorded"
      - from: PRINTED
        to: REWOUND
        trigger: "system (automatic when every RewindRoll of the job is ACCEPTED or REJECTED and at least one is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REWOUND
        to: SHIPPED
        trigger: POST /label-jobs/jobs/{id}/ship
        actor: QualityManager
        preconditions:
          - "Job must be REWOUND (ERR_JOB_NOT_REWOUND)"
          - "If job.requires_food_contact_letter: a ComplianceLetter with letter_type FOOD_CONTACT must exist for this job (ERR_COMPLIANCE_LETTER_MISSING)"
        side_effects:
          - "invoiced_price_cents computed via job_invoice_calc using good_quantity_produced and the tier table (replaces the provisional quote; the difference is the invoice variance)"
      - from: QUOTED
        to: CANCELLED
        trigger: POST /label-jobs/jobs/{id}/cancel
        actor: Estimator
        preconditions:
          - "Job must be QUOTED, APPROVED, or RELEASED (ERR_JOB_NOT_CANCELLABLE)"
        side_effects:
          - "If the job had collected a die charge (die_charge_applied_cents > 0 and it is still the die's billing job): die.charge_collected = false and die_charge_applied_cents released"
      - from: APPROVED
        to: CANCELLED
        trigger: POST /label-jobs/jobs/{id}/cancel
        actor: Estimator
        preconditions:
          - "Job must be QUOTED, APPROVED, or RELEASED (ERR_JOB_NOT_CANCELLABLE)"
        side_effects:
          - "Same die-charge release as QUOTED → CANCELLED"
      - from: RELEASED
        to: CANCELLED
        trigger: POST /label-jobs/jobs/{id}/cancel
        actor: Estimator
        preconditions:
          - "Job must be QUOTED, APPROVED, or RELEASED (ERR_JOB_NOT_CANCELLABLE)"
        side_effects:
          - "Same die-charge release as QUOTED → CANCELLED"
      - from: QUOTED
        to: CANCELLED
        trigger: "system (automatic when the job's referenced ArtworkVersion flips to OBSOLETE)"
        actor: system
        preconditions: []
        side_effects:
          - "Die-charge release as above (compensating action: the die returns to un-billed state)"

  - entity: ColorMeasurement
    initial_state: PENDING
    terminal_states: [PASS, FAIL]
    transitions:
      - from: PENDING
        to: PASS
        trigger: POST /label-jobs/jobs/{id}/color-measurements/{measurementId}/judge (verdict=PASS)
        actor: QualityManager
        preconditions:
          - "Measurement must be PENDING (ERR_MEASUREMENT_ALREADY_JUDGED)"
          - "Parent job must be ON_PRESS (ERR_JOB_NOT_ON_PRESS)"
          - "delta_e <= DELTA_E_PASS_MAX (2.0) is required for PASS; judging PASS with delta_e > 2.0 is rejected (ERR_DELTA_E_EXCEEDS_LIMIT)"
        side_effects: []
      - from: PENDING
        to: FAIL
        trigger: POST /label-jobs/jobs/{id}/color-measurements/{measurementId}/judge (verdict=FAIL)
        actor: QualityManager
        preconditions:
          - "Measurement must be PENDING (ERR_MEASUREMENT_ALREADY_JUDGED)"
          - "Parent job must be ON_PRESS (ERR_JOB_NOT_ON_PRESS)"
        side_effects:
          - "Failing a measurement does NOT block the press; a replacement PENDING measurement for the same station may be recorded"
      - from: FAIL
        to: PENDING
        trigger: "system (automatic re-open when a new ColorMeasurement is recorded for the same job+station: the old row stays FAIL and the new row is PENDING; FAIL rows never re-open)"
        actor: system
        preconditions: []
        side_effects: []
        note: "This transition is documented as non-executable — FAIL is terminal. A new measurement row is created instead (revision-by-append)."

  - entity: RewindRoll
    initial_state: WOUND
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: WOUND
        to: ACCEPTED
        trigger: POST /label-jobs/jobs/{id}/rewind-rolls/{rollId}/accept
        actor: QualityManager
        preconditions:
          - "Roll must be WOUND (ERR_ROLL_ALREADY_JUDGED)"
          - "Parent job must be PRINTED (ERR_JOB_NOT_PRINTED)"
          - "splice_count <= job.max_splices_per_roll (ERR_SPLICE_LIMIT_EXCEEDED)"
        side_effects:
          - "When all rolls of the job are judged and >=1 is ACCEPTED: job auto-transitions PRINTED → REWOUND"
      - from: WOUND
        to: REJECTED
        trigger: POST /label-jobs/jobs/{id}/rewind-rolls/{rollId}/reject
        actor: QualityManager
        preconditions:
          - "Roll must be WOUND (ERR_ROLL_ALREADY_JUDGED)"
          - "Parent job must be PRINTED (ERR_JOB_NOT_PRINTED)"
        side_effects:
          - "Same job auto-transition check as accept"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: job-release-stale-artwork
    parent_entity: ArtworkVersion
    write_endpoint: "POST /label-jobs/jobs/{id}/release"
    occ_field: "expected_artwork_version"
    description: |
      Releasing a LabelJob against an ArtworkVersion whose version has advanced
      since the client last observed it is rejected. This captures the case where
      a newer revision of the same artwork_code has just been approved (which
      legitimately supersedes the referenced revision under §1.2) and the
      releaser's view of the artwork is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: job-ship-stale-job
    parent_entity: LabelJob
    write_endpoint: "POST /label-jobs/jobs/{id}/ship"
    occ_field: "expected_job_version"
    description: |
      Shipping a LabelJob whose version has advanced since the client last
      observed it is rejected. This captures the case where a late-arriving
      rewind-roll judgment or compliance-letter issuance has legitimately
      mutated the job and the shipper's view of the job is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: job_material_calc
    trigger: "LabelJob release (APPROVED → RELEASED)"
    algorithm: threshold
    formula: |
      # Base running footage: ceil(quantity_ordered * repeat_length_mm / 1000 / 304.8) feet
      # (304.8 mm per foot; repeat_length converts count → mm → feet)
      running_ft = ceil(quantity_ordered * repeat_length_mm / 304.8 / 1)   # mm→ft directly
      # Setup waste is charged only when running footage is below the short-run threshold;
      # on long runs the makeready is amortized and no separate setup waste is billed.
      if running_ft < SHORT_RUN_THRESHOLD_FT:
        setup_ft = press.setup_waste_ft
      else:
        setup_ft = 0
      # Running waste: percent of running footage, rounded UP to whole feet.
      run_waste_ft = ceil(running_ft * press.run_waste_pct_numerator / 100)
      material_ft = running_ft + setup_ft + run_waste_ft
    constants:
      SHORT_RUN_THRESHOLD_FT: 5000
    precision: "integer feet, ceil for waste components"

  - name: job_quote_calc
    trigger: "LabelJob creation (→ QUOTED) — provisional price"
    algorithm: tiered_pricing
    formula: |
      # Tier table applies to the FULL ordered quantity at a single marginal
      # per-thousand rate determined by which bracket the quantity falls in
      # (average-rate pricing, NOT marginal/bracketed accumulation):
      #   qty < 5000             -> rate_a per thousand
      #   5000 <= qty < 20000    -> rate_b per thousand
      #   qty >= 20000           -> rate_c per thousand
      rate = rate_for(quantity_ordered)
      base_cents = ceil(quantity_ordered / 1000 * rate)
      # Material surcharge: substrate cost per MSI applied to material_ft * web width.
      # material_ft is NOT known at quote time (computed at release); the quote
      # uses the same formula with setup waste INCLUDED (provisional worst case).
      provisional_running_ft = ceil(quantity_ordered * repeat_length_mm / 304.8)
      provisional_ft = provisional_running_ft + press.setup_waste_ft + ceil(provisional_running_ft * press.run_waste_pct_numerator / 100)
      msq = provisional_ft * 12 * substrate.width_mm / 25.4 / 1000   # ft→in × width-in, in MSI
      material_cents = ceil(msq * substrate.cost_per_msq_cents)
      # Ink: 1 lb per 5000 linear feet per station, times artwork color_count.
      ink_lb = provisional_ft * artwork.color_count / 5000
      ink_cents = ceil(ink_lb * ink_recipe.cost_per_lb_cents)
      # Plates: one plate set per job.
      quoted_price_cents = base_cents + material_cents + ink_cents + artwork.plate_set_cost_cents
      # NOTE: the new-die charge is NOT in the quote; it is applied at release
      # when the system knows whether this job is the die's first use.
    constants:
      RATE_A_CENTS_PER_K: 4500   # qty < 5000
      RATE_B_CENTS_PER_K: 3800   # 5000 <= qty < 20000
      RATE_C_CENTS_PER_K: 3200   # qty >= 20000
      MIN_ORDER_QTY: 1000
    precision: "integer cents, ceil at each component"
    variants:
      - name: provisional
        when: "job creation (QUOTED)"
        difference: "uses quantity_ordered and includes press.setup_waste_ft unconditionally; excludes die charge"
      - name: final
        when: "job completion (ship) — see job_invoice_calc"
        difference: "uses good_quantity_produced and the RELEASED material_ft (setup waste possibly 0); includes die_charge_applied_cents"

  - name: job_invoice_calc
    trigger: "LabelJob ship (REWOUND → SHIPPED)"
    algorithm: tiered_pricing
    formula: |
      # Same tier table as job_quote_calc but keyed on good_quantity_produced
      # (what the customer actually receives). A short run that falls below the
      # quoted tier re-prices at the higher rate — the invoice is NOT the quote.
      rate = rate_for(good_quantity_produced)
      base_cents = ceil(good_quantity_produced / 1000 * rate)
      # Material uses the material_ft frozen at release (actual makeready policy
      # applied), NOT the provisional worst-case.
      msq = material_ft * 12 * substrate.width_mm / 25.4 / 1000
      material_cents = ceil(msq * substrate.cost_per_msq_cents)
      ink_lb = material_ft * artwork.color_count / 5000
      ink_cents = ceil(ink_lb * ink_recipe.cost_per_lb_cents)
      invoiced_price_cents = base_cents + material_cents + ink_cents
                             + artwork.plate_set_cost_cents
                             + die_charge_applied_cents
    constants:
      RATE_A_CENTS_PER_K: 4500
      RATE_B_CENTS_PER_K: 3800
      RATE_C_CENTS_PER_K: 3200
    precision: "integer cents, ceil at each component"
    variants:
      - name: final
        when: "ship"
        difference: "keyed on good_quantity_produced; uses released material_ft; adds die charge"

  - name: die_new_charge_rule
    trigger: "Die creation via purchase endpoint"
    algorithm: threshold
    formula: |
      if created_via == "new_die_purchase":
        new_die_charge_cents = NEW_DIE_CHARGE_CENTS   # 750000
      else:
        new_die_charge_cents = 0
      # Charged exactly once, to the first job that releases against this die.
      # On cancel/supersede of that job, charge_collected flips back to false
      # so the NEXT job using the die is billed instead (charge follows the die,
      # not the customer).
    constants:
      NEW_DIE_CHARGE_CENTS: 750000

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right (customer → job → measurement/roll)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request payload must be well-formed: all required fields present, no unknown fields, types and enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: state
    check: "Parent/target entity must be in a state that permits this operation (job state, artwork state, measurement PENDING, roll WOUND)"
    error_id: "varies: ERR_JOB_NOT_QUOTED | ERR_JOB_NOT_APPROVED | ERR_JOB_NOT_RELEASED | ERR_JOB_NOT_ON_PRESS | ERR_JOB_NOT_PRINTED | ERR_JOB_NOT_REWOUND | ERR_JOB_NOT_CANCELLABLE | ERR_ARTWORK_NOT_DRAFT | ERR_ARTWORK_NOT_SUBMITTED | ERR_MEASUREMENT_ALREADY_JUDGED | ERR_ROLL_ALREADY_JUDGED"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Food-contact compliance: a job with requires_food_contact_letter=true may only release when substrate is food_contact_certified AND ink recipe is food_contact_compliant"
    error_id: ERR_FOOD_CONTACT_COMPONENT
    http_status: 422
    applies_to: "POST /label-jobs/jobs/{id}/release"

  - priority: 7
    category: business_safety
    check: "Color approval: complete-press requires every ColorMeasurement verdict == PASS; judge PASS requires delta_e <= 2.0"
    error_id: "ERR_COLOR_NOT_APPROVED | ERR_DELTA_E_EXCEEDS_LIMIT"
    http_status: 422
    applies_to: "complete-press, judge"

  - priority: 8
    category: business_constraint
    check: "Press occupancy: only one job ON_PRESS per press; color_count <= press.station_count at job creation"
    error_id: "ERR_PRESS_OCCUPIED | ERR_COLOR_COUNT_EXCEEDS_PRESS"
    http_status: 409
    applies_to: "start-press, job create"

  - priority: 9
    category: business_constraint
    check: "Structural limits: rewind roll count for a job must not exceed rewind_max_rolls; accept requires splice_count <= max_splices_per_roll; a new artwork revision's revision_no must be strictly greater than the current max revision_no for the same (customer_id, artwork_code)"
    error_id: "ERR_ROLL_LIMIT_EXCEEDED | ERR_SPLICE_LIMIT_EXCEEDED | ERR_ARTWORK_REVISION_NOT_MONOTONIC"
    http_status: 422
    applies_to: "rewind-roll create, rewind-roll accept, artwork-version create"

  - priority: 10
    category: business_referential
    check: "Referenced artwork must be APPROVED at release; referenced die must not be RETIRED at job creation"
    error_id: "ERR_ARTWORK_NOT_APPROVED | ERR_DIE_RETIRED"
    http_status: 422
    applies_to: "release, job create"

  - priority: 11
    category: business_fiscal
    check: "Minimum order and credit: quantity_ordered >= 1000 at release; customer.credit_hold must be false at release"
    error_id: "ERR_BELOW_MINIMUM_ORDER | ERR_CUSTOMER_CREDIT_HOLD"
    http_status: 422
    applies_to: "release"

  - priority: 12
    category: business_fiscal
    check: "Optimistic concurrency: expected_*_version fields must match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "release, ship"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/label-jobs/customers"
    description: "Create a customer account"
    roles: [Estimator]
    code: 201
    input: [account_name, "credit_hold?", "preferred_currency?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/label-jobs/customers"
    description: "List customers"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/label-jobs/customers/{id}"
    description: "Get one customer"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: PATCH
    path: "/label-jobs/customers/{id}"
    description: "Update customer flags (e.g., place on credit hold)"
    roles: [Estimator]
    code: 200
    input: ["account_name?", "credit_hold?", "preferred_currency?"]
    output: Customer
    side_effects: ["increments Customer.version by 1"]

  # --- ArtworkVersion ---
  - method: POST
    path: "/label-jobs/customers/{id}/artwork-versions"
    description: "Register a new artwork revision under a customer"
    roles: [PrepressOperator]
    code: 201
    input: [artwork_code, revision_no, color_count, plate_set_cost_cents]
    output: ArtworkVersion
    side_effects: ["status = DRAFT", "revision_no must exceed the current max revision for the same (customer_id, artwork_code) (ERR_ARTWORK_REVISION_NOT_MONOTONIC)"]

  - method: GET
    path: "/label-jobs/customers/{id}/artwork-versions"
    description: "List artwork revisions for a customer"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "ArtworkVersion[]"
    side_effects: []

  - method: GET
    path: "/label-jobs/customers/{id}/artwork-versions/{artworkId}"
    description: "Get one artwork revision"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: []
    output: ArtworkVersion
    side_effects: []

  - method: POST
    path: "/label-jobs/customers/{id}/artwork-versions/{artworkId}/submit"
    description: "Submit a DRAFT revision for approval"
    roles: [PrepressOperator]
    code: 200
    input: []
    output: ArtworkVersion
    side_effects: ["status DRAFT → SUBMITTED", "increments ArtworkVersion.version by 1"]

  - method: POST
    path: "/label-jobs/customers/{id}/artwork-versions/{artworkId}/approve"
    description: "Approve a SUBMITTED revision; supersedes the previously APPROVED revision of the same artwork_code"
    roles: [PrepressOperator]
    code: 200
    input: []
    output: ArtworkVersion
    side_effects: ["status SUBMITTED → APPROVED", "prior APPROVED revision of same artwork_code → OBSOLETE", "QUOTED/APPROVED jobs referencing the now-OBSOLETE revision → CANCELLED with die-charge release", "increments ArtworkVersion.version by 1"]

  - method: POST
    path: "/label-jobs/customers/{id}/artwork-versions/{artworkId}/return"
    description: "Return a SUBMITTED revision to DRAFT for rework (revision loop)"
    roles: [PrepressOperator]
    code: 200
    input: []
    output: ArtworkVersion
    side_effects: ["status SUBMITTED → DRAFT", "increments ArtworkVersion.version by 1"]

  # --- Substrate ---
  - method: POST
    path: "/label-jobs/substrates"
    description: "Register a substrate"
    roles: [Estimator]
    code: 201
    input: [substrate_code, width_mm, cost_per_msq_cents, "food_contact_certified?"]
    output: Substrate
    side_effects: []

  - method: GET
    path: "/label-jobs/substrates"
    description: "List substrates"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Substrate[]"
    side_effects: []

  - method: GET
    path: "/label-jobs/substrates/{substrateId}"
    description: "Get one substrate"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: []
    output: Substrate
    side_effects: []

  # --- InkRecipe ---
  - method: POST
    path: "/label-jobs/ink-recipes"
    description: "Register an ink recipe"
    roles: [Estimator]
    code: 201
    input: [recipe_code, "food_contact_compliant?", cost_per_lb_cents]
    output: InkRecipe
    side_effects: []

  - method: GET
    path: "/label-jobs/ink-recipes"
    description: "List ink recipes"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "InkRecipe[]"
    side_effects: []

  # --- Die ---
  - method: POST
    path: "/label-jobs/dies"
    description: "Register an existing die already on the shelf (no tooling charge)"
    roles: [Estimator]
    code: 201
    input: [die_code, shape_description, cavities_across]
    output: Die
    side_effects: ["status = ACTIVE", "new_die_charge_cents = 0", "charge_collected = false"]

  - method: POST
    path: "/label-jobs/dies/purchase"
    description: "Order a new die from the toolmaker; carries the one-time new-die charge billed to its first job"
    roles: [Estimator]
    code: 201
    input: [die_code, shape_description, cavities_across]
    output: Die
    side_effects: ["status = ACTIVE", "new_die_charge_cents = 750000", "charge_collected = false"]

  - method: GET
    path: "/label-jobs/dies"
    description: "List dies"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Die[]"
    side_effects: []

  - method: GET
    path: "/label-jobs/dies/{dieId}"
    description: "Get one die"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: []
    output: Die
    side_effects: []

  - method: POST
    path: "/label-jobs/dies/{dieId}/retire"
    description: "Retire a die; retired dies cannot be referenced by new jobs"
    roles: [Estimator]
    code: 200
    input: []
    output: Die
    side_effects: ["status → RETIRED", "increments Die.version by 1"]

  # --- Press ---
  - method: POST
    path: "/label-jobs/presses"
    description: "Register a press"
    roles: [Estimator]
    code: 201
    input: [press_code, station_count, setup_waste_ft, run_waste_pct_numerator]
    output: Press
    side_effects: []

  - method: GET
    path: "/label-jobs/presses"
    description: "List presses"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Press[]"
    side_effects: []

  - method: GET
    path: "/label-jobs/presses/{pressId}"
    description: "Get one press"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: []
    output: Press
    side_effects: []

  # --- LabelJob ---
  - method: POST
    path: "/label-jobs/customers/{id}/jobs"
    description: "Create a job (quote); computes provisional quoted_price_cents"
    roles: [Estimator]
    code: 201
    input: [artwork_version_id, substrate_id, ink_recipe_id, die_id, press_id, quantity_ordered, repeat_length_mm, "requires_food_contact_letter?", rewind_max_rolls, max_splices_per_roll]
    output: LabelJob
    side_effects: ["status = QUOTED", "quoted_price_cents computed via job_quote_calc (provisional variant)", "die referenced must not be RETIRED (ERR_DIE_RETIRED)", "artwork.color_count <= press.station_count (ERR_COLOR_COUNT_EXCEEDS_PRESS)"]

  - method: GET
    path: "/label-jobs/customers/{id}/jobs"
    description: "List jobs for a customer"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "LabelJob[]"
    side_effects: []

  - method: GET
    path: "/label-jobs/jobs"
    description: "List jobs across customers with optional FK filters (reverse reachability for job FKs)"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["customer_id?", "artwork_version_id?", "substrate_id?", "ink_recipe_id?", "die_id?", "press_id?", "status?", "limit?", "offset?"]
    output: "LabelJob[]"
    side_effects: []

  - method: GET
    path: "/label-jobs/jobs/{id}"
    description: "Get one job"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: []
    output: LabelJob
    side_effects: []

  - method: POST
    path: "/label-jobs/jobs/{id}/approve"
    description: "Approve the quote"
    roles: [Estimator]
    code: 200
    input: []
    output: LabelJob
    side_effects: ["status QUOTED → APPROVED", "increments LabelJob.version by 1"]

  - method: POST
    path: "/label-jobs/jobs/{id}/release"
    description: "Release job to production; computes material_ft; bills new-die charge on the die's first use"
    roles: [Estimator]
    code: 200
    input: [expected_artwork_version]
    output: LabelJob
    side_effects: ["status APPROVED → RELEASED", "material_ft computed via job_material_calc", "die first-use charge applied (Die.charge_collected → true, Die.version +1)", "increments LabelJob.version by 1"]

  - method: POST
    path: "/label-jobs/jobs/{id}/start-press"
    description: "Put the job on press (only one job ON_PRESS per press)"
    roles: [PressOperator]
    code: 200
    input: []
    output: LabelJob
    side_effects: ["status RELEASED → ON_PRESS", "increments LabelJob.version by 1"]

  - method: POST
    path: "/label-jobs/jobs/{id}/complete-press"
    description: "Finish the press run; requires all color measurements PASS; records good quantity"
    roles: [PressOperator]
    code: 200
    input: [good_quantity_produced]
    output: LabelJob
    side_effects: ["status ON_PRESS → PRINTED", "good_quantity_produced recorded", "increments LabelJob.version by 1"]

  - method: POST
    path: "/label-jobs/jobs/{id}/ship"
    description: "Ship the job; computes final invoiced_price_cents from good_quantity_produced"
    roles: [QualityManager]
    code: 200
    input: [expected_job_version]
    output: LabelJob
    side_effects: ["status REWOUND → SHIPPED", "invoiced_price_cents computed via job_invoice_calc (final variant)", "increments LabelJob.version by 1"]

  - method: POST
    path: "/label-jobs/jobs/{id}/cancel"
    description: "Cancel a job before it goes on press; releases any die charge billed to it"
    roles: [Estimator]
    code: 200
    input: []
    output: LabelJob
    side_effects: ["status → CANCELLED", "die-charge release if this job was the die's billing job", "increments LabelJob.version by 1"]

  # --- ColorMeasurement ---
  - method: POST
    path: "/label-jobs/jobs/{id}/color-measurements"
    description: "Record a Delta-E measurement for a print station while the job is on press"
    roles: [PressOperator]
    code: 201
    input: [station_no, delta_e]
    output: ColorMeasurement
    side_effects: ["verdict = PENDING", "parent job must be ON_PRESS (ERR_JOB_NOT_ON_PRESS)"]

  - method: GET
    path: "/label-jobs/jobs/{id}/color-measurements"
    description: "List color measurements for a job"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "ColorMeasurement[]"
    side_effects: []

  - method: POST
    path: "/label-jobs/jobs/{id}/color-measurements/{measurementId}/judge"
    description: "Judge a PENDING measurement PASS or FAIL (PASS requires delta_e <= 2.0)"
    roles: [QualityManager]
    code: 200
    input: [verdict]
    output: ColorMeasurement
    side_effects: ["verdict PENDING → PASS|FAIL", "increments ColorMeasurement.version by 1"]

  # --- RewindRoll ---
  - method: POST
    path: "/label-jobs/jobs/{id}/rewind-rolls"
    description: "Record a finished roll off the rewinder"
    roles: [PressOperator]
    code: 201
    input: [roll_seq, label_count, splice_count]
    output: RewindRoll
    side_effects: ["status = WOUND", "parent job must be PRINTED (ERR_JOB_NOT_PRINTED)", "roll count for the job must not exceed job.rewind_max_rolls (ERR_ROLL_LIMIT_EXCEEDED)"]

  - method: GET
    path: "/label-jobs/jobs/{id}/rewind-rolls"
    description: "List finished rolls for a job"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "RewindRoll[]"
    side_effects: []

  - method: POST
    path: "/label-jobs/jobs/{id}/rewind-rolls/{rollId}/accept"
    description: "Accept a WOUND roll (splice limit enforced); may auto-advance job PRINTED → REWOUND"
    roles: [QualityManager]
    code: 200
    input: []
    output: RewindRoll
    side_effects: ["status WOUND → ACCEPTED", "splice_count <= job.max_splices_per_roll enforced (ERR_SPLICE_LIMIT_EXCEEDED)", "job PRINTED → REWOUND when all rolls judged and >=1 ACCEPTED", "increments RewindRoll.version by 1"]

  - method: POST
    path: "/label-jobs/jobs/{id}/rewind-rolls/{rollId}/reject"
    description: "Reject a WOUND roll"
    roles: [QualityManager]
    code: 200
    input: []
    output: RewindRoll
    side_effects: ["status WOUND → REJECTED", "job PRINTED → REWOUND when all rolls judged and >=1 ACCEPTED", "increments RewindRoll.version by 1"]

  # --- ComplianceLetter ---
  - method: POST
    path: "/label-jobs/jobs/{id}/compliance-letters"
    description: "Issue a food-contact compliance letter for a job (idempotent per job: one FOOD_CONTACT letter max)"
    roles: [QualityManager]
    code: 201
    input: [letter_type, body]
    output: ComplianceLetter
    side_effects: ["parent job must be PRINTED or REWOUND (ERR_JOB_NOT_READY_FOR_LETTER)", "duplicate FOOD_CONTACT letter for the same job rejected (ERR_DUPLICATE_LETTER)", "substrate and ink recipe must be food-contact qualified (ERR_FOOD_CONTACT_COMPONENT)"]

  - method: GET
    path: "/label-jobs/jobs/{id}/compliance-letters"
    description: "List compliance letters for a job"
    roles: [Estimator, PrepressOperator, PressOperator, QualityManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "ComplianceLetter[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id does not exist (customer, artwork, substrate, ink recipe, die, press, job, measurement, roll, letter)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown payload field, wrong type, or enum value out of domain" }
  - { id: ERR_JOB_NOT_QUOTED, http: 409, condition: "approve requires job in QUOTED" }
  - { id: ERR_JOB_NOT_APPROVED, http: 409, condition: "release requires job in APPROVED" }
  - { id: ERR_JOB_NOT_RELEASED, http: 409, condition: "start-press requires job in RELEASED" }
  - { id: ERR_JOB_NOT_ON_PRESS, http: 409, condition: "complete-press or color-measurement record requires job in ON_PRESS" }
  - { id: ERR_JOB_NOT_PRINTED, http: 409, condition: "rewind-roll record/accept/reject requires job in PRINTED" }
  - { id: ERR_JOB_NOT_REWOUND, http: 409, condition: "ship requires job in REWOUND" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "cancel requires job in QUOTED, APPROVED, or RELEASED" }
  - { id: ERR_JOB_NOT_READY_FOR_LETTER, http: 409, condition: "compliance letter issuance requires job in PRINTED or REWOUND" }
  - { id: ERR_ARTWORK_NOT_DRAFT, http: 409, condition: "submit requires artwork in DRAFT" }
  - { id: ERR_ARTWORK_NOT_SUBMITTED, http: 409, condition: "approve/return requires artwork in SUBMITTED" }
  - { id: ERR_ARTWORK_NOT_APPROVED, http: 422, condition: "release requires the referenced artwork revision to be APPROVED" }
  - { id: ERR_MEASUREMENT_ALREADY_JUDGED, http: 409, condition: "judge requires measurement verdict PENDING" }
  - { id: ERR_ROLL_ALREADY_JUDGED, http: 409, condition: "accept/reject requires roll status WOUND" }
  - { id: ERR_DELTA_E_EXCEEDS_LIMIT, http: 422, condition: "judging PASS with delta_e > 2.0" }
  - { id: ERR_COLOR_NOT_APPROVED, http: 422, condition: "complete-press requires every ColorMeasurement of the job to be PASS" }
  - { id: ERR_PRESS_OCCUPIED, http: 409, condition: "another job is ON_PRESS on the referenced press" }
  - { id: ERR_COLOR_COUNT_EXCEEDS_PRESS, http: 409, condition: "artwork.color_count exceeds press.station_count at job creation" }
  - { id: ERR_ROLL_LIMIT_EXCEEDED, http: 422, condition: "recording another roll would exceed job.rewind_max_rolls" }
  - { id: ERR_SPLICE_LIMIT_EXCEEDED, http: 422, condition: "accepting a roll whose splice_count exceeds job.max_splices_per_roll" }
  - { id: ERR_FOOD_CONTACT_COMPONENT, http: 422, condition: "job requires food-contact letter but substrate or ink recipe is not food-contact qualified (also applies at letter issuance)" }
  - { id: ERR_DIE_RETIRED, http: 422, condition: "job creation references a RETIRED die" }
  - { id: ERR_BELOW_MINIMUM_ORDER, http: 422, condition: "release with quantity_ordered < 1000" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 422, condition: "release while customer.credit_hold is true" }
  - { id: ERR_COMPLIANCE_LETTER_MISSING, http: 422, condition: "ship a food-contact job with no FOOD_CONTACT letter issued" }
  - { id: ERR_DUPLICATE_LETTER, http: 409, condition: "a FOOD_CONTACT compliance letter already exists for this job" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_GOOD_QTY, http: 422, condition: "complete-press with good_quantity_produced missing or <= 0" }
  - { id: ERR_ARTWORK_REVISION_NOT_MONOTONIC, http: 422, condition: "artwork-version create with revision_no not strictly greater than the current max revision for the same (customer_id, artwork_code)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Estimator
    description: "Commercial desk: customers, substrates, ink recipes, dies, presses, job quoting/approval/release/cancel"
    identity: opaque
    exclusive_operations:
      - "POST /label-jobs/customers — create customer"
      - "PATCH /label-jobs/customers/{id} — update customer (credit hold)"
      - "POST /label-jobs/substrates — register substrate"
      - "POST /label-jobs/ink-recipes — register ink recipe"
      - "POST /label-jobs/dies — register existing die"
      - "POST /label-jobs/dies/purchase — purchase new die"
      - "POST /label-jobs/dies/{id}/retire — retire die"
      - "POST /label-jobs/presses — register press"
      - "POST /label-jobs/customers/{id}/jobs — create job (quote)"
      - "POST /label-jobs/jobs/{id}/approve — approve quote"
      - "POST /label-jobs/jobs/{id}/release — release to production"
      - "POST /label-jobs/jobs/{id}/cancel — cancel job"
    shared_operations:
      - "All GET endpoints"

  - name: PrepressOperator
    description: "Prepress: artwork revision lifecycle (submit/approve/return)"
    identity: opaque
    exclusive_operations:
      - "POST /label-jobs/customers/{id}/artwork-versions — register revision"
      - "POST .../artwork-versions/{id}/submit — submit revision"
      - "POST .../artwork-versions/{id}/approve — approve revision (supersedes prior)"
      - "POST .../artwork-versions/{id}/return — return revision to DRAFT"
    shared_operations:
      - "All GET endpoints"

  - name: PressOperator
    description: "Pressroom: start/complete press runs, record color measurements and finished rolls"
    identity: opaque
    exclusive_operations:
      - "POST /label-jobs/jobs/{id}/start-press"
      - "POST /label-jobs/jobs/{id}/complete-press"
      - "POST /label-jobs/jobs/{id}/color-measurements"
      - "POST /label-jobs/jobs/{id}/rewind-rolls"
    shared_operations:
      - "All GET endpoints"

  - name: QualityManager
    description: "QA: judge color measurements, accept/reject rolls, issue compliance letters, ship jobs"
    identity: opaque
    exclusive_operations:
      - "POST .../color-measurements/{id}/judge"
      - "POST .../rewind-rolls/{id}/accept"
      - "POST .../rewind-rolls/{id}/reject"
      - "POST /label-jobs/jobs/{id}/compliance-letters"
      - "POST /label-jobs/jobs/{id}/ship"
    shared_operations:
      - "All GET endpoints"
