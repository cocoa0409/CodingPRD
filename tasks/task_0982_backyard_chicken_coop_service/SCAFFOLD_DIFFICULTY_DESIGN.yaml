          household is SUSPENDED (state, priority 6) and the total 30000 also
          exceeds wallet 0 + CREDIT_LIMIT 20000 (fiscal, priority 12) must
          return ERR_ACCOUNT_SUSPENDED, not ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "URBAN household, then SUSPENDED by BillingAdmin (no subscription, so no cascade side effects)"
