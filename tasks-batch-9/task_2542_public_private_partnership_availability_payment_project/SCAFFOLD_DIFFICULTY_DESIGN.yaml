  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reserve_withdrawal_then_reversal_conserves_the_ledger_balance
        conserved_quantity: "Concession.lifecycle_reserve_balance_cents == sum(signed_amount_cents) over the concession's LifecycleReserveTransaction rows == the highest-sequence row's resulting_balance_cents"
        grounds:
          - calculations.reserve_ledger_conservation
          - calculations.lifecycle_reserve_balance
          - entities.LifecycleReserveTransaction
          - endpoints.POST_ppp_reserve_transactions_id_reverse
        distinguishing_aspect: |
          Conserved quantity #1 is the append-only reserve ledger. The compensating action is
          a REVERSAL, which must restore the balance WITHOUT mutating or deleting the
          withdrawal: the ledger grows from 2 rows to 3, every historical
          resulting_balance_cents stays exactly as it was written, and the balance returns to
          8000000. Reversal is also idempotency-hostile in both directions — a row may be
          reversed at most once, and a REVERSAL may never itself be reversed — so the identity
          cannot be gamed by stacking compensations.
        test_recipe:
          setup:
            - "Concession at CONSTRUCTION with lifecycle_reserve_balance_cents 8000000 from a single system CONSTRUCTION_SEED row at sequence_no 1."
            - "handback_status is NOT_SURVEYED, so withdrawals are permitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
