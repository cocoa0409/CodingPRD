            - call: "POST /pets/${pet_id}/vaccinations"
              payload: { vaccine_type: "RABIES", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /route-days"
              payload: { van_id: "${van_id}", service_date: "2026-06-23T00:00:00Z", window_start: "2026-06-23T09:00:00Z", window_end: "2026-06-23T17:00:00Z", coverage_zip: "90017" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v0: $.data.version }
            - call: "POST /appointments"
              payload: { pet_id: "${pet_id}", service_tier_id: "${tier_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/quote"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/schedule"
              payload: { route_day_id: "${rd_id}", slot_start: "2026-06-23T09:30:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/no-show"
              payload: {}
              as: Dispatcher
            - call: "GET /customers/${cust_id}/fee-charges"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /fee-charges/${fee_id}/settle"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { settle_status: $.data.settlement_status }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { outstanding: $.data.outstanding_fee_cents }
          assert:
            - "Before settle: Customer.${cust_id}.outstanding_fee_cents == 3000."
            - "FeeCharge.${fee_id}.settlement_status == SETTLED after settle."
            - "After settle: Customer.${cust_id}.outstanding_fee_cents == 0 (money invariant restored)."

      - name: cancel_void_conserves_route_booked_minutes
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - calculations.route_load_capacity
          - entities.RouteDay.fields.booked_minutes
          - entities.RouteStop.fields.status
        distinguishing_aspect: |
          Conserved quantity = route load minutes (different from money): invariant
          RouteDay.booked_minutes == sum(scheduled_minutes + TRAVEL_BUFFER_MIN of non-VOIDED stops).
          Scheduling one 50-min stop adds load 65 (booked 65); cancelling VOIDs that stop and frees the
          load, returning booked_minutes to 0 — forward + compensating leaves the minutes invariant
          exactly restored, with no drift.
        test_recipe:
          setup:
            - "A RouteDay with one 50-min RESERVED stop; booked_minutes == 65 (50 + 15 buffer); cancel far enough out to avoid any late fee."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
