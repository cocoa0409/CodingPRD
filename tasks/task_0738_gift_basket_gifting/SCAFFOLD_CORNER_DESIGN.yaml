              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { branding_id: $.data.id }
          trigger:
            - call: "GET /corporate-accounts/${acct_id}/branding-profiles"
              payload: {}
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
