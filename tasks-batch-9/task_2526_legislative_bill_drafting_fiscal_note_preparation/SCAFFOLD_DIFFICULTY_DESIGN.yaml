            - "L2 - DraftingRequest.${dr_b}.status == RETURNED_FOR_CLARIFICATION and sla_due_utc == null"
            - "L2 - Drafter.${d1_id}.active_engagement_count == 0 (both requests have now left the occupancy set)"
            - "L2 - Member.${m1_id}.clarification_pending_count == 2"
            - "L3 - Member.${m1_id}.intake_hold == true"
