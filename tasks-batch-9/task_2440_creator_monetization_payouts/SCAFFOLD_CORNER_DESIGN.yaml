          - "endpoints[PATCH /monetization/revenue-products/{product_id}]"
        distinguishing_aspect: "The PATCH supplies only creator_share_bps 6000; the rule must merge it with the stored platform_fee_bps 3000 and reject the resulting 9000 sum, so the stored row keeps 7000/3000."
