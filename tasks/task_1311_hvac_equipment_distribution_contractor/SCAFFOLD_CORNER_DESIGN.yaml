scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: contractor_create_required_fields_and_defaults
        claim_type: creation_defaults
        grounds: [entities.Contractor]
        distinguishing_aspect: "POST /contractors with only required fields returns 201 with tier STANDARD, ytd 0, accruals 0, compliance_standing GOOD, credit_hold false, version 1."
        test_recipe:
          setup: ["empty DB; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Fresh Air Co", license_number: "LIC-C100" }
              as: DistributorAdmin
              captures: { cc_id: $.data.id }
          assert:
            - "Contractor.${cc_id}.tier == STANDARD"
            - "Contractor.${cc_id}.ytd_purchase_cents == 0"
            - "Contractor.${cc_id}.coop_accrual_provisional_cents == 0"
            - "Contractor.${cc_id}.coop_accrual_final_cents == 0"
            - "Contractor.${cc_id}.compliance_standing == GOOD"
            - "Contractor.${cc_id}.credit_hold == false"
            - "Contractor.${cc_id}.version == 1"

      - name: contractor_create_missing_license_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Contractor, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required license_number on create is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "No License LLC" }
              as: DistributorAdmin
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST and http status 400"

      - name: contractor_duplicate_license_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second contractor with the same license_number yields ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["one contractor with license LIC-DUP exists"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "First", license_number: "LIC-DUP" }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Second", license_number: "LIC-DUP" }
              as: DistributorAdmin
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUPLICATE and http status 409"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID for any collection returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/contractors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistributorAdmin
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND and http status 404"

      - name: computed_field_input_ignored_on_create
        claim_type: computed_fields
        grounds: [entities.Contractor.fields.tier, entities.Contractor.fields.ytd_purchase_cents]
        distinguishing_aspect: "Client-supplied computed fields (tier, ytd_purchase_cents) are ignored on create; server values prevail."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Sneaky Inc", license_number: "LIC-C101", tier: "PLATINUM", ytd_purchase_cents: 999999999 }
              as: DistributorAdmin
              captures: { cs_id: $.data.id, cs_err: $.data.error_id }
          assert:
            - "either the request is rejected with ERR_INVALID_REQUEST (unknown-field policy), or the created contractor has tier == STANDARD and ytd_purchase_cents == 0 — pinned: ERR_INVALID_REQUEST per validations[priority=22]"
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: refrigerant_event_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.RefrigerantEvent]
        distinguishing_aspect: "RefrigerantEvent (common_fields: false) exposes id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup:
            - "cylinder CYL-E issued then returned so at least two events exist"
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Event Co", license_number: "LIC-C102" }
              as: DistributorAdmin
              captures: { ce_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders"
              payload: { cylinder_tag: "CYL-E100", refrigerant_type: "R410A", tare_weight_lbs: 20.00, full_weight_lbs: 50.00 }
              as: DistributorAdmin
              captures: { cye_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders/${cye_id}/issue"
              payload: { contractor_id: "${ce_id}" }
              as: DistributorAdmin
          trigger:
            - call: "GET /api/v1/refrigerant-cylinders/${cye_id}/events"
              payload: {}
              as: DistributorAdmin
          assert:
            - "each event object in $.data has id, cylinder_id, event_type, weight_delta_lbs, recorded_at and has NO version field"

      - name: order_lines_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET_orders"]
        distinguishing_aspect: "List endpoints honor limit/offset and return total_count + has_more in the envelope's data per pagination_fields."
        test_recipe:
          setup: ["contractor with 3 orders"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Page Co", license_number: "LIC-C103" }
              as: DistributorAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cp_id}" }
              as: ContractorUser
              as_user_id: "${cp_id}"
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cp_id}" }
              as: ContractorUser
              as_user_id: "${cp_id}"
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cp_id}" }
              as: ContractorUser
              as_user_id: "${cp_id}"
          trigger:
            - call: "GET /api/v1/orders?contractor_id=${cp_id}&limit=2&offset=0"
              payload: {}
              as: DistributorAdmin
          assert:
            - "response data has total_count == 3 and has_more == true and exactly 2 items"
            - "second page request with offset=2 returns has_more == false and 1 item"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: order_cancel_from_shipped_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is legal only from DRAFT/SUBMITTED/BACKORDERED; cancelling a SHIPPED order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["order O-S shipped"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "State Co", license_number: "LIC-C200" }
              as: DistributorAdmin
              captures: { cs2_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-S200", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-J", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { ms2_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cs2_id}" }
              as: ContractorUser
              as_user_id: "${cs2_id}"
              captures: { os2_id: $.data.id }
            - call: "POST /api/v1/orders/${os2_id}/lines"
              payload: { equipment_model_id: "${ms2_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cs2_id}"
            - call: "POST /api/v1/orders/${os2_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cs2_id}"
            - call: "POST /api/v1/orders/${os2_id}/ship"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/orders/${os2_id}/cancel"
              payload: {}
              as: ContractorUser
              as_user_id: "${cs2_id}"
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "Order.${os2_id}.status remains SHIPPED"

      - name: order_terminal_delivered_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Order, "validations[priority=6]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A DELIVERED order rejects ship/cancel transitions with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["order O-T delivered"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Term Co", license_number: "LIC-C201" }
              as: DistributorAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-T201", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-J", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { mt_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${ct_id}" }
              as: ContractorUser
              as_user_id: "${ct_id}"
              captures: { ot_id: $.data.id }
            - call: "POST /api/v1/orders/${ot_id}/lines"
              payload: { equipment_model_id: "${mt_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${ct_id}"
            - call: "POST /api/v1/orders/${ot_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${ct_id}"
            - call: "POST /api/v1/orders/${ot_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${ot_id}/deliver"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/orders/${ot_id}/ship"
              payload: {}
              as: DistributorAdmin
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ALREADY_TERMINAL"

      - name: cylinder_initial_state_and_issue_cycle
        claim_type: valid_transition
        grounds: [state_machines.RefrigerantCylinder.IN_STOCK_to_ISSUED]
        distinguishing_aspect: "New cylinder starts IN_STOCK; issue transitions to ISSUED, appends ISSUE event, sets holder and issued_at."
        test_recipe:
          setup: ["contractor C-CY ACTIVE, cylinder CY created"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Cycle Co", license_number: "LIC-C202" }
              as: DistributorAdmin
              captures: { ccy_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders"
              payload: { cylinder_tag: "CYL-C202", refrigerant_type: "R454B", tare_weight_lbs: 22.00, full_weight_lbs: 55.00 }
              as: DistributorAdmin
              captures: { cy2_id: $.data.id }
          trigger:
            - call: "POST /api/v1/refrigerant-cylinders/${cy2_id}/issue"
              payload: { contractor_id: "${ccy_id}" }
              as: DistributorAdmin
          assert:
            - "RefrigerantCylinder.${cy2_id}.status == ISSUED"
            - "RefrigerantCylinder.${cy2_id}.holder_contractor_id == ${ccy_id}"
            - "events list for ${cy2_id} contains exactly one event with event_type == ISSUE"

      - name: rebate_qualify_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RebateSubmission, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "QUALIFY is legal only from DOCS_COMPLETE; a DRAFT dossier cannot be qualified."
        test_recipe:
          setup: ["DRAFT rebate submission RB-Q (order DELIVERED, rating ACTIVE PREMIUM)"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Qual Co", license_number: "LIC-C203" }
              as: DistributorAdmin
              captures: { cq_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "OU-Q203", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-I", list_price_cents: 500000 }
              as: DistributorAdmin
              captures: { ouq_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "IU-Q203", equipment_type: "COIL", refrigerant_type: "NONE", capacity_btuh: 36000, family_code: "FAM-I", list_price_cents: 100000 }
              as: DistributorAdmin
              captures: { iuq_id: $.data.id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-9203", outdoor_unit_id: "${ouq_id}", indoor_unit_id: "${iuq_id}", seer2: 17.0, eer2: 12.5 }
              as: DistributorAdmin
              captures: { rq_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cq_id}" }
              as: ContractorUser
              as_user_id: "${cq_id}"
              captures: { oq_id: $.data.id }
            - call: "POST /api/v1/orders/${oq_id}/lines"
              payload: { ahri_rating_id: "${rq_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cq_id}"
            - call: "POST /api/v1/orders/${oq_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cq_id}"
            - call: "POST /api/v1/orders/${oq_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${oq_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/rebate-submissions"
              payload: { contractor_id: "${cq_id}", order_id: "${oq_id}", ahri_rating_id: "${rq_id}", program_type: "FEDERAL_TAX_CREDIT", homeowner_name: "Q", install_address: "3 Elm", install_date: "2026-08-01T00:00:00Z" }
              as: ContractorUser
              as_user_id: "${cq_id}"
              captures: { rbq_id: $.data.id }
          trigger:
            - call: "POST /api/v1/rebate-submissions/${rbq_id}/decision"
              payload: { action: "QUALIFY" }
              as: ComplianceOfficer
              captures: { e: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: coop_claim_resubmit_loop_restores_submitted
        claim_type: valid_transition
        grounds: [state_machines.CoopClaim.DISPUTED_to_SUBMITTED]
        distinguishing_aspect: "DISPUTED -> SUBMITTED via RESUBMIT replaces spend_cents and resets eligible_amount_cents to 0 until re-verified."
        test_recipe:
          setup: ["contractor with 200000 final accrual; claim CC-D verified then disputed"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Dispute Co", license_number: "LIC-C204" }
              as: DistributorAdmin
              captures: { cd_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-D204", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-H", list_price_cents: 10000000 }
              as: DistributorAdmin
              captures: { md_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cd_id}" }
              as: ContractorUser
              as_user_id: "${cd_id}"
              captures: { od_id: $.data.id }
            - call: "POST /api/v1/orders/${od_id}/lines"
              payload: { equipment_model_id: "${md_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cd_id}"
            - call: "POST /api/v1/orders/${od_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cd_id}"
            - call: "POST /api/v1/orders/${od_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${od_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/coop-claims"
              payload: { contractor_id: "${cd_id}", invoice_reference: "INV-D204", period: "2026-H2", spend_cents: 80000 }
              as: ContractorUser
              as_user_id: "${cd_id}"
              captures: { ccd_id: $.data.id }
            - call: "POST /api/v1/coop-claims/${ccd_id}/decision"
              payload: { action: "VERIFY" }
              as: DistributorAdmin
            - call: "POST /api/v1/coop-claims/${ccd_id}/decision"
              payload: { action: "DISPUTE" }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/coop-claims/${ccd_id}/decision"
              payload: { action: "RESUBMIT", spend_cents: 60000 }
              as: ContractorUser
              as_user_id: "${cd_id}"
          assert:
            - "CoopClaim.${ccd_id}.status == SUBMITTED"
            - "CoopClaim.${ccd_id}.spend_cents == 60000"
            - "CoopClaim.${ccd_id}.eligible_amount_cents == 0"

      - name: registration_lapse_cascade_covered_by_difficulty
        claim_type: side_effect_execution
        grounds: [state_machines.WarrantyRegistration.PENDING_REGISTRATION_to_LAPSED]
        excluded_because:
          difficulty_instance: transitive_cascade / registration_lapse_denies_open_claim
          rationale: "Lapse transition and its claim-denial cascade are asserted end-to-end by the named §1.8 instance."

      - name: billing_parallel_dimension_covered_by_difficulty
        claim_type: parallel_dimensions
        grounds: [state_machines.OrderBilling]
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_parallel_billing_and_fulfillment_dimensions
          rationale: "The invoice-final join gate and independent dimension evolution are asserted by the named §1.8 instance."

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: ahri_classification_high_boundary_and_tax_credit
        claim_type: boundary_edge
        grounds: [calculations.ahri_matchup_classification]
        distinguishing_aspect: "seer2 == 15.2 and eer2 == 11.7 (inclusive boundary) classify HIGH; a heat pump rating with hspf2 == 8.1 is tax_credit_eligible while the same ratings with hspf2 == 8.0 is not."
        test_recipe:
          setup: ["two outdoor heat-pump models and two indoor coils"]
          setup_api_calls:
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "HP-B1", equipment_type: "HEAT_PUMP", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-G2", list_price_cents: 900000 }
              as: DistributorAdmin
              captures: { hpb1_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "AH-B1", equipment_type: "AIR_HANDLER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-G2", list_price_cents: 300000 }
              as: DistributorAdmin
              captures: { ahb1_id: $.data.id }
          trigger:
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-B1A", outdoor_unit_id: "${hpb1_id}", indoor_unit_id: "${ahb1_id}", seer2: 15.2, eer2: 11.7, hspf2: 8.1 }
              as: DistributorAdmin
              captures: { rb1a_id: $.data.id }
            - call: "POST /api/v1/ahri-ratings"
              payload: { ahri_reference_number: "AHRI-B1B", outdoor_unit_id: "${hpb1_id}", indoor_unit_id: "${ahb1_id}", seer2: 15.2, eer2: 11.7, hspf2: 8.0 }
              as: DistributorAdmin
              captures: { rb1b_id: $.data.id }
          assert:
            - "AHRISystemRating.${rb1a_id}.efficiency_class == HIGH and tax_credit_eligible == true"
            - "AHRISystemRating.${rb1b_id}.efficiency_class == HIGH and tax_credit_eligible == false"

      - name: warranty_coverage_age_bands_and_labor_rule
        claim_type: correct_result
        grounds: [calculations.warranty_coverage_calculation]
        distinguishing_aspect: "Coverage branches on age band AND registration status: a failure at age 6 on an on-time-REGISTERED unit (10-year coverage) covers 50% parts and 0% labor — part 100000 -> 50000, labor 40000 -> 0, award 50000; the same failure on a LAPSED unit (5-year coverage) would cover 0 but LAPSED registrations auto-deny claims, so the REGISTERED long-coverage branch is the reachable one."
        test_recipe:
          setup:
            - "clock starts 2020-08-15: contractor C-W, delivered order, registration W-A install 2020-08-01 registered 2020-08-15 (on time, coverage 10y)"
            - "clock advanced to 2026-08-05; claim failure_date 2026-08-04 (age 6 years)"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2020-08-15T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Cover Co", license_number: "LIC-C300" }
              as: DistributorAdmin
              captures: { cw_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-W300", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-F", list_price_cents: 800000 }
              as: DistributorAdmin
              captures: { mw_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${cw_id}" }
              as: ContractorUser
              as_user_id: "${cw_id}"
              captures: { ow_id: $.data.id }
            - call: "POST /api/v1/orders/${ow_id}/lines"
              payload: { equipment_model_id: "${mw_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${cw_id}"
            - call: "POST /api/v1/orders/${ow_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${cw_id}"
            - call: "POST /api/v1/orders/${ow_id}/ship"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/orders/${ow_id}/deliver"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/warranty-registrations"
              payload: { serial_number: "SN-WA", equipment_model_id: "${mw_id}", contractor_id: "${cw_id}", order_id: "${ow_id}", install_date: "2020-08-01T00:00:00Z" }
              as: ContractorUser
              as_user_id: "${cw_id}"
              captures: { wa_id: $.data.id }
            - call: "POST /api/v1/warranty-registrations/${wa_id}/register"
              payload: {}
              as: ContractorUser
              as_user_id: "${cw_id}"
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: DistributorAdmin
            - call: "POST /api/v1/parts-claims"
              payload: { warranty_registration_id: "${wa_id}", contractor_id: "${cw_id}", failure_date: "2026-08-04T00:00:00Z", part_cost_cents: 100000, labor_cost_cents: 40000 }
              as: ContractorUser
              as_user_id: "${cw_id}"
              captures: { cw30_id: $.data.id }
            - call: "POST /api/v1/parts-claims/${cw30_id}/decision"
              payload: { action: "BEGIN_REVIEW" }
              as: WarrantyProcessor
          trigger:
            - call: "POST /api/v1/parts-claims/${cw30_id}/decision"
              payload: { action: "APPROVE" }
              as: WarrantyProcessor
          assert:
