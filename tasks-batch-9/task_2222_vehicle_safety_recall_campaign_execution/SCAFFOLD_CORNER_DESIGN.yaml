            - "response.data.status == \"PLANNED\" and response.data.sequence_number == 1"
            - "response.data.auto_created == false and response.data.cancel_reason is null"
            - "response.data.wave_type == \"INTERIM\" and response.data.target_region_code == \"NE\" and response.data.scheduled_mail_date == \"2026-08-20\""
            - "response.data.planned_vehicle_count == 0 and response.data.mailed_vehicle_count == 0 and response.data.actual_mail_date is null"

