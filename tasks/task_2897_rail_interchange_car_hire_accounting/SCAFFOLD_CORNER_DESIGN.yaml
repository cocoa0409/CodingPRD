      - name: compute_breaching_the_payer_credit_limit_returns_402
        claim_type: Aggregate validation
        grounds:
          - validations.priority_53_ERR_PER_DIEM_CREDIT_LIMIT_EXCEEDED
          - entities.Railroad.fields.per_diem_credit_limit_cents
          - calculations.per_diem_exposure
        distinguishing_aspect: "This is the only 402 in the catalog and the only rule that fires AFTER a successful computation and then rolls it back: the cycle must be left in OPEN with its money fields still at their zero defaults, so an implementation that persists the computed totals and only then raises the error is detectably wrong."
        test_recipe:
          setup:
            - "As CYCLE_1, except BN is registered with per_diem_credit_limit_cents = 5000 — far below the 11464 of hire it is about to owe. Clock 2026-09-01T00:00:00Z after the car has been delivered 2026-08-24T00:00:00Z odo 1000 LOADED and returned 2026-08-28T00:00:00Z odo 1240 LOADED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway", per_diem_credit_limit_cents: 5000 }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 1000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-28T00:00:00Z", odometer_miles: 1240, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/settlement-cycles"
              payload: { payer_road_id: "${bn_id}", payee_road_id: "${cx_id}", period_month: "2026-08" }
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { cycle_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/settlement-cycles/${cycle_id}/compute"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { e_limit: "$.data.error_id" }
            - call: "GET /car-hire/settlement-cycles/${cycle_id}"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { status_after: "$.data.status", gross_after: "$.data.gross_hire_cents", net_after: "$.data.net_settlement_cents", lines_after: "$.data.movement_line_count" }
          assert:
            - "e_limit == ERR_PER_DIEM_CREDIT_LIMIT_EXCEEDED with HTTP 402 — the only 402 in the catalog"
            - "status_after == OPEN, gross_after == 0, net_after == 0, lines_after == 0 — the refused computation left nothing behind"
            - "the movement's settlement_cycle_id is still null, so it remains available to a later cycle"
            - "raising BN's per_diem_credit_limit_cents above 11464 and repeating the compute returns 200 with gross_hire_cents 11464"

      - name: embargo_issued_in_another_roads_name_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_21_ERR_EMBARGO_SELF_ISSUED
          - entities.EmbargoOrder.fields.issuing_road_id
          - entities.Junction.fields.road_a_id
        distinguishing_aspect: "issuing_road_id is an INPUT field that must agree with the acting railroad header AND with the junction's road pair, so there are two independent ways to fail one rule: filing in a counterparty's name, and filing at a junction the acting road does not touch. Trusting the body field alone would let CX embargo traffic in BN's name."
        test_recipe:
          setup:
            - "Railroads BN, CX and NS (all ACTIVE); car type XM; junction JCT-CHI joining CX and BN. NS is not a road of JCT-CHI. Clock 2026-08-28T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "NS", name: "North Summit RR" }
              as: ClearinghouseAdmin
              captures: { ns_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${bn_id}", junction_id: "${jct_id}", car_type_id: "${xm_id}", effective_from: "2026-08-20T00:00:00Z", effective_to: "2026-08-22T00:00:00Z", reason: "Filed by CX in BN's name" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { e_other_name: "$.data.error_id" }
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${ns_id}", junction_id: "${jct_id}", car_type_id: "${xm_id}", effective_from: "2026-08-20T00:00:00Z", effective_to: "2026-08-22T00:00:00Z", reason: "NS has no standing at Chicago" }
              as: InterchangeClerk
              as_user_id: "${ns_id}"
              captures: { e_not_at_junction: "$.data.error_id" }
            - call: "POST /car-hire/embargo-orders"
              payload: { issuing_road_id: "${cx_id}", junction_id: "${jct_id}", car_type_id: "${xm_id}", effective_from: "2026-08-22T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", reason: "Backwards interval" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { e_interval: "$.data.error_id" }
          assert:
            - "e_other_name == ERR_EMBARGO_SELF_ISSUED (422) — issuing_road_id ${bn_id} does not match the acting railroad ${cx_id}"
            - "e_not_at_junction == ERR_EMBARGO_SELF_ISSUED (422) — NS matches the header but is not a road of JCT-CHI"
            - "e_interval == ERR_INVALID_INTERVAL (422) — priority 40 outranks nothing here, but confirms the interval test also guards this endpoint"
            - "GET /car-hire/embargo-orders?junction_id=${jct_id} returns total_count 0"

      - name: movement_not_closed_masks_window_outside_movement
        claim_type: Priority Ordering
        grounds:
          - validations.priority_12_ERR_MOVEMENT_NOT_CLOSED
          - validations.priority_33_ERR_RECLAIM_WINDOW_OUTSIDE_MOVEMENT
        distinguishing_aspect: "A reclaim filed against an OPEN movement with a window that also falls outside the segment violates two rules 21 priorities apart, and only the lower number may be reported."
        excluded_because:
          difficulty_instance: reclaim_movement_not_closed_at_12_masks_window_outside_movement_at_33
          rationale: "The §1.8 index already exercises exactly this pair, in the required order, including the follow-up that closes the movement and re-files to surface the priority-33 error on its own. Repeating it here would duplicate the same call chain."

      - name: dispute_subject_scope_masks_the_amount_ceiling
        claim_type: Priority Ordering
        grounds:
          - validations.priority_24_ERR_DISPUTE_SUBJECT_NOT_IN_CYCLE
          - validations.priority_54_ERR_DISPUTED_AMOUNT_EXCEEDS_SUBJECT
        distinguishing_aspect: "A dispute naming a movement stamped into a DIFFERENT cycle, with an amount above that movement's net, must report the scope error at priority 24 and never the fiscal ceiling at priority 54."
        excluded_because:
          difficulty_instance: dispute_subject_not_in_cycle_at_24_masks_disputed_amount_exceeds_subject_at_54
          rationale: "The §1.8 index builds two cycles for this pair and then re-files against the correct cycle to expose the priority-54 error alone; a corner-design duplicate would add no new discrimination."

      - name: late_event_capture_limit_boundary
        claim_type: Temporal validation
        grounds:
          - validations.priority_31_ERR_LATE_EVENT_REQUIRES_CORRECTION
          - global_constants.LATE_REPORT_LIMIT_HOURS
        distinguishing_aspect: "The 168-hour late-reporting limit is inclusive at the boundary and is bypassed entirely by an applied MISSED_EVENT_INSERT correction, so the same instant is refused on the capture endpoint and accepted through the correction workflow."
        excluded_because:
          difficulty_instance: late_event_limit_inclusive_at_exactly_168_hours_and_refused_at_169
          rationale: "The §1.8 index already probes exactly 168 h, 168 h + 1 min and the correction bypass on one fixture; a second pass at the same boundary would be redundant."

      - name: reclaim_window_overlap_on_the_same_movement
        claim_type: Violation → Error
        grounds:
          - validations.priority_42_ERR_RECLAIM_WINDOW_OVERLAP
        distinguishing_aspect: "Reclaim windows are half-open, so abutting claims coexist while one minute of true intersection is refused, and DISALLOWED or WITHDRAWN claims release their window for re-filing."
        excluded_because:
          difficulty_instance: reclaim_windows_are_half_open_so_touching_endpoints_coexist
          rationale: "The §1.8 index covers the abutting-accepted / overlapping-refused / withdrawn-frees-the-window trio on a single movement, which is the whole of this rule."

      - name: embargo_window_conflict_and_cooling_gap
        claim_type: Violation → Error
        grounds:
          - validations.priority_43_ERR_EMBARGO_WINDOW_CONFLICT
        distinguishing_aspect: "Embargo intervals are CLOSED at both ends and additionally carry a 24-hour cooling gap, so an interval that merely touches or starts within a day of an existing order conflicts — the opposite convention from reclaim windows on the same fixture."
        excluded_because:
          difficulty_instance: embargo_intervals_are_closed_and_carry_a_24_hour_cooling_gap
          rationale: "The §1.8 index contrasts the closed-interval-plus-gap convention against the half-open reclaim convention in one instance; splitting it would lose the contrast that makes the claim discriminating."

      - name: movement_reclaim_locked_after_a_reverse_route_violation
        claim_type: Violation → Error
        grounds:
          - validations.priority_44_ERR_MOVEMENT_RECLAIM_LOCKED
        distinguishing_aspect: "reclaim_locked is set by a routing-obligation violation on a different aggregate and permanently bars new reclaims on the segment, even ones that satisfy every window and evidence rule."
        excluded_because:
          difficulty_instance: wrong_junction_empty_return_cascades_to_obligation_penalty_and_reclaim_lock
          rationale: "The §1.8 index sets the lock through the full three-level cascade and then attempts an otherwise-valid reclaim, which is the only meaningful way to reach this rule."

      - name: dispute_rounds_exhausted_and_turn_order
        claim_type: Violation → Error
        grounds:
          - validations.priority_46_ERR_DISPUTE_ROUNDS_EXHAUSTED
          - validations.priority_52_ERR_DISPUTE_TURN_VIOLATION
          - global_constants.MAX_DISPUTE_ROUNDS
        distinguishing_aspect: "Whose turn it is flips with the dispute's state, and the third counter succeeds while the fourth is refused — two rules that can only be reached by walking the OPEN/COUNTERED loop."
        excluded_because:
          difficulty_instance: dispute_open_countered_loop_alternates_actor_and_caps_at_three_rounds
          rationale: "The §1.8 index walks the full alternating loop to exhaustion and attempts an out-of-turn move at each state, covering both rules in the only fixture that can reach round 3."

      - name: open_disputes_block_settlement
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_49_ERR_OPEN_DISPUTES_BLOCK_SETTLEMENT
        distinguishing_aspect: "The settle guard reads rows of a different entity keyed on this cycle, so a single OPEN or COUNTERED Dispute blocks the payer's remittance even though the cycle itself is a valid EXCHANGED row."
        excluded_because:
          difficulty_instance: cycle_settle_blocked_by_a_dispute_row_in_another_aggregate
          rationale: "The §1.8 index blocks the settle, resolves the dispute both by acceptance and by withdrawal, and re-settles, which is the complete behaviour of this guard."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: correction_request_expire_due_sweep_is_idempotent
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/car-hire/correction-requests/expire-due
          - entities.CorrectionRequest.fields.confirm_deadline_at
          - global_constants.CORRECTION_CONFIRM_WINDOW_HOURS
        distinguishing_aspect: "The sweep is the only bulk endpoint in the API and its skip semantics are per-row, not all-or-nothing: with one due and one not-yet-due request outstanding it must expire exactly one, name it in expired_correction_request_ids, and leave the other FILED — and an immediate second call must report expired_count 0 rather than re-expiring or erroring."
        test_recipe:
          setup:
            - "Railroads BN/CX, car type XM, junction JCT-CHI, CX-owned car CX 100001 delivered to BN at 2026-08-24T00:00:00Z."
            - "Correction A filed by BN at clock 2026-08-26T00:00:00Z (confirm_deadline_at 2026-08-29T00:00:00Z); correction B filed by BN at clock 2026-08-27T00:00:00Z (confirm_deadline_at 2026-08-30T00:00:00Z). Both are FILED."
