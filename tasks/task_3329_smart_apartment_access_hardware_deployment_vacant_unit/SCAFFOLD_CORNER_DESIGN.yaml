          trigger:
            - call: "POST /devices/${dev_cs}/replace_battery"
              payload: {}
              as: HardwareTechnician
          assert:
            - "Device.${dev_cs}.battery_pct == 100"
            - "Device.${dev_cs}.battery_replacements == 1"

      - name: device_scan_response_carries_alert_envelope_fields
        claim_type: Computed read
        grounds:
          - endpoints.POST_/buildings/{buildingId}/device-scans
          - response_envelope.success
          - response_envelope.error
        distinguishing_aspect: "The scan response uses response_type array with data carrying DeviceAlert rows (alert_type/status/severity), and every response — success or error — carries meta.api_request_id."
        test_recipe:
