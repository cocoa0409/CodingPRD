          setup:
            - "Two LIVE partners, 'Ridgeline Commerce' (subject) and 'Foxglove Commerce' (control), each with reserve_requirement_bps = 500, FBO_END_USER 5000000 and RESERVE 312500 so both are OPEN posture with shortfall 0."
