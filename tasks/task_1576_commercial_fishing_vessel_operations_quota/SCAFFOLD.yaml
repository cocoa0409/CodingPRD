# =============================================================================
# Task 1576: Commercial Fishing Vessel Operations & Quota Management
# Alaska catch-share fishery — scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Commercial Fishing Vessel Operations & Quota Management (Alaska catch-share
  fishery): permit/license & quota share holdings, trip planning by season/area
  opening, catch reporting & landing declaration, quota lease/transfer between
  vessels, observer coverage requirement & scheduling, crew share settlement
  after trip expenses, gear loss & maintenance, vessel monitoring system
  compliance

domain_name: commercial-fishing-quota
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (17 entities)
# common_fields: true => id (UUID, no prefix), created_at, updated_at, version
# common_fields: false => id + created_at only (append-only event entities)
# =============================================================================
entities:
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: vessel_name, type: string, source: input, description: "Display name of the vessel" }
      - { name: license_number, type: string, source: input, description: "State license number; unique across all vessels", constraints: "unique" }
      - { name: home_port, type: string, source: input, description: "Home port code, e.g. HOMER" }
      - { name: length_ft, type: integer, source: input, description: "Vessel length in feet; must be > 0" }
      - { name: observer_coverage_class, type: enum, source: input, description: "FULL | PARTIAL | EXEMPT — drives observer_required on trips" }
      - { name: vms_unit_id, type: string, source: input, description: "VMS transponder id; optional — when absent, VMS gap check is skipped on trip return", constraints: "optional" }
      - { name: compliance_points, type: integer, source: system, default: 100, description: "Compliance standing; starts at 100; vessel auto-suspended when it drops below 50" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | SUSPENDED | DECOMMISSIONED" }

  - name: Permit
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id; owning vessel" }
      - { name: fishery_code, type: enum, source: input, description: "HALIBUT | SABLEFISH | POLLOCK | PACIFIC_COD" }
      - { name: gear_type, type: enum, source: input, description: "TRAWL_NET | LONGLINE | POT | GILLNET" }
      - { name: valid_from, type: datetime, source: input, description: "Permit validity start (ISO8601 UTC)" }
      - { name: valid_to, type: datetime, source: input, description: "Permit validity end (ISO8601 UTC); must be > valid_from" }
      - { name: status, type: enum, source: system, description: "ISSUED | SUSPENDED | REVOKED | EXPIRED" }

  - name: QuotaShareHolding
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id; holding vessel" }
      - { name: fishery_code, type: enum, source: input, description: "HALIBUT | SABLEFISH | POLLOCK | PACIFIC_COD" }
      - { name: season_year, type: integer, source: input, description: "Quota season year, e.g. 2026" }
      - { name: initial_pounds, type: integer, source: input, description: "Annual allocation in lbs; must be > 0" }
      - { name: landed_pounds, type: integer, source: computed, default: 0, description: "Sum of declared_lbs from VERIFIED or FINALIZED landing declaration lines for this fishery/year" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED — CLOSED when clock passes season year end" }

  - name: SeasonOpening
    parent: null
    common_fields: true
    fields:
      - { name: fishery_code, type: enum, source: input, description: "HALIBUT | SABLEFISH | POLLOCK | PACIFIC_COD" }
      - { name: area_code, type: string, source: input, description: "Regulatory area, e.g. 3A" }
      - { name: opens_at, type: datetime, source: input, description: "Opening instant (ISO8601 UTC)" }
      - { name: closes_at, type: datetime, source: input, description: "Closing instant; must be > opens_at" }
      - { name: tac_pounds, type: integer, source: input, description: "Total allowable catch for this opening; must be > 0" }
      - { name: landed_against_tac_pounds, type: integer, source: computed, default: 0, description: "Sum of VERIFIED/FINALIZED landing lbs attributed to this opening" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | CLOSED_EARLY" }

  - name: FishingTrip
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; vessel undertaking the trip" }
      - { name: season_opening_id, type: string, source: input, description: "FK -> SeasonOpening.id; opening this trip fishes under" }
      - { name: planned_departure_utc, type: datetime, source: input, description: "Planned departure; must be >= opening.opens_at" }
      - { name: planned_return_utc, type: datetime, source: input, description: "Planned return; must be > planned_departure_utc and <= opening.closes_at" }
      - { name: gear_requirements, type: array, source: input, default: [], description: "Optional list of {gear_type, units} required at depart" }
      - { name: observer_required, type: boolean, source: computed, description: "true when vessel class FULL, or class PARTIAL and planned duration strictly > 72h; false for EXEMPT" }
      - { name: observer_waived, type: boolean, source: computed, default: false, description: "true once a regulator waives the trip's observer requirement" }
      - { name: actual_departure_utc, type: datetime, source: system, description: "Set from the logical clock at depart", constraints: "null until DEPARTED" }
      - { name: actual_return_utc, type: datetime, source: system, description: "Set from the logical clock at return", constraints: "null until RETURNED" }
      - { name: status, type: enum, source: system, description: "PLANNED | DEPARTED | RETURNED | LANDING_FINALIZED | SETTLED | CANCELLED" }

  - name: CatchReport
    parent: FishingTrip
    common_fields: false
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FishingTrip.id" }
      - { name: haul_seq, type: integer, source: system, description: "Per-trip sequence number starting at 1, assigned in creation order" }
      - { name: fishery_code, type: enum, source: input, description: "HALIBUT | SABLEFISH | POLLOCK | PACIFIC_COD" }
      - { name: report_type, type: enum, source: input, description: "HARVEST | DISCARD" }
      - { name: reported_lbs, type: integer, source: input, description: "Reported pounds; must be > 0" }
      - { name: reported_at, type: datetime, source: input, description: "When the haul occurred (ISO8601 UTC)" }

  - name: LandingDeclaration
    parent: FishingTrip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FishingTrip.id; at most one declaration per trip" }
      - { name: port_code, type: string, source: input, description: "Landing port code" }
      - { name: lines, type: array, source: input, description: "List of {fishery_code, declared_lbs}; declared_lbs >= 0; non-empty" }
      - { name: discrepancy_details, type: array, source: computed, description: "Per-line {fishery_code, expected_lbs, declared_lbs, within_tolerance} computed at submit/verify" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DISPUTED | AMENDED | VERIFIED | FINALIZED" }

  - name: QuotaTransfer
    parent: null
    common_fields: true
    fields:
      - { name: from_vessel_id, type: string, source: input, description: "FK -> Vessel.id; leasing-out vessel" }
      - { name: to_vessel_id, type: string, source: input, description: "FK -> Vessel.id; leasing-in vessel" }
      - { name: fishery_code, type: enum, source: input, description: "HALIBUT | SABLEFISH | POLLOCK | PACIFIC_COD" }
      - { name: season_year, type: integer, source: input, description: "Season year the pounds apply to" }
      - { name: pounds, type: integer, source: input, description: "Pounds to lease; > 0; overwritten by counter offers" }
      - { name: price_per_lb_cents, type: integer, source: input, description: "Lease price per lb in cents; >= 0; overwritten by counter offers" }
      - { name: round_number, type: integer, source: system, default: 1, description: "Negotiation round; increments on every counter" }
      - { name: last_offered_by, type: enum, source: system, description: "FROM_VESSEL | TO_VESSEL — which side tabled the current offer" }
      - { name: transfer_fee_cents, type: integer, source: computed, description: "Tiered lease fee computed at settle; null until SETTLED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | ACCEPTED | SETTLED | DECLINED | WITHDRAWN | EXPIRED" }

  - name: Observer
    parent: null
    common_fields: true
    fields:
      - { name: observer_name, type: string, source: input, description: "Observer full name" }
      - { name: certification_level, type: enum, source: input, description: "A | B | C — A highest" }
      - { name: home_base, type: string, source: input, description: "Observer home port" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | ON_ASSIGNMENT — ON_ASSIGNMENT while any assignment is ASSIGNED, CONFIRMED, or DEPLOYED" }

  - name: ObserverAssignment
    parent: FishingTrip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FishingTrip.id" }
      - { name: observer_id, type: string, source: input, description: "FK -> Observer.id; null until assigned" }
      - { name: coverage_from, type: datetime, source: input, description: "Coverage window start; null until assigned" }
      - { name: coverage_to, type: datetime, source: input, description: "Coverage window end; null until assigned; must be > coverage_from" }
      - { name: auto_created, type: boolean, source: system, description: "true when created automatically at trip creation or on release" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ASSIGNED | CONFIRMED | DEPLOYED | DEBRIEFED | RELEASED | WAIVED | CANCELLED" }

  - name: CrewShareContract
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id" }
      - { name: crew_name, type: string, source: input, description: "Crew member name" }
      - { name: share_points, type: number, source: input, description: "Share points for settlement split; must be > 0" }
      - { name: joined_at, type: datetime, source: input, description: "Date crew joined; used in payout remainder ordering" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: ExpenseRecord
    parent: FishingTrip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FishingTrip.id" }
      - { name: category, type: enum, source: input, description: "FUEL | BAIT | ICE | GROCERIES | GEAR_REPAIR | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Expense amount; must be > 0" }
      - { name: incurred_at, type: datetime, source: input, description: "When the expense was incurred" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }

  - name: TripSettlement
    parent: FishingTrip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FishingTrip.id; at most one settlement per trip" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "Gross ex-vessel revenue for the trip; must be > 0" }
      - { name: provisional_total_expenses_cents, type: integer, source: computed, description: "Provisional variant: PENDING + VERIFIED expenses at settlement creation" }
      - { name: provisional_processing_fee_cents, type: integer, source: computed, description: "Provisional variant processing fee" }
      - { name: provisional_vessel_share_cents, type: integer, source: computed, description: "Provisional variant vessel share" }
      - { name: provisional_crew_pool_cents, type: integer, source: computed, description: "Provisional variant crew pool" }
      - { name: total_expenses_cents, type: integer, source: computed, description: "Final variant: VERIFIED expenses only; null until CALCULATED" }
      - { name: observer_fee_cents, type: integer, source: computed, description: "ceil(coverage hours / 24) x 45000 per DEBRIEFED/DEPLOYED assignment; null until CALCULATED" }
      - { name: gear_loss_charge_cents, type: integer, source: computed, description: "(LOSS units - REPAIR units on this trip, floored at 0) x 25000; null until CALCULATED" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "round_half_up(0.015 x net_before_fee); null until CALCULATED" }
      - { name: net_cents, type: integer, source: computed, description: "net_before_fee - processing_fee; null until CALCULATED" }
      - { name: vessel_share_cents, type: integer, source: computed, description: "round_half_up(net x 0.60); null until CALCULATED" }
      - { name: crew_pool_cents, type: integer, source: computed, description: "net - vessel_share; null until CALCULATED" }
      - { name: crew_payouts, type: array, source: computed, description: "Per-active-contract {crew_contract_id, crew_name, payout_cents}; sums exactly to crew_pool_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | CALCULATED | DISPUTED | APPROVED | PAID" }

  - name: GearAsset
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id" }
      - { name: gear_type, type: enum, source: input, description: "TRAWL_NET | LONGLINE | POT | GILLNET" }
      - { name: units_total, type: integer, source: input, description: "Total owned units; must be > 0" }
      - { name: units_lost, type: integer, source: computed, default: 0, description: "Cumulative LOST units minus REPAIR-recovered units (floor 0)" }
      - { name: units_in_maintenance, type: integer, source: computed, default: 0, description: "Units currently under maintenance" }
      - { name: units_operational, type: integer, source: computed, description: "units_total - units_lost - units_in_maintenance" }
      - { name: status, type: enum, source: computed, description: "OPERATIONAL when units_operational > 0 else DOWN" }

  - name: GearEvent
    parent: GearAsset
    common_fields: false
    fields:
      - { name: gear_asset_id, type: string, source: system, description: "FK -> GearAsset.id" }
      - { name: trip_id, type: string, source: input, description: "FK -> FishingTrip.id; optional — set when loss/repair happened on a trip", constraints: "optional" }
      - { name: event_type, type: enum, source: input, description: "LOSS | REPAIR | MAINTENANCE_START | MAINTENANCE_END" }
      - { name: units, type: integer, source: input, description: "Units affected; must be > 0" }
      - { name: occurred_at, type: datetime, source: input, description: "When the event occurred" }

  - name: VMSPing
    parent: Vessel
    common_fields: false
    fields:
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id" }
      - { name: recorded_at, type: datetime, source: input, description: "Ping timestamp (ISO8601 UTC)" }
      - { name: latitude, type: number, source: input, description: "Degrees latitude" }
      - { name: longitude, type: number, source: input, description: "Degrees longitude" }

  - name: ComplianceViolation
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id; cited vessel" }
      - { name: trip_id, type: string, source: input, description: "FK -> FishingTrip.id; optional associated trip", constraints: "optional" }
      - { name: violation_type, type: enum, source: input, description: "OVER_QUOTA | OUT_OF_SEASON | OBSERVER_BREACH | VMS_GAP | GEAR_MISMATCH | MANUAL_CITATION" }
      - { name: details, type: string, source: input, description: "Free-text citation details" }
      - { name: season_year, type: integer, source: system, description: "Calendar year of the logical clock at creation; scopes the repeat-offense factor" }
      - { name: severity_points, type: integer, source: computed, description: "Penalty points computed at adjudication; null until ADJUDICATED" }
      - { name: status, type: enum, source: system, description: "OPEN | ADJUDICATED | DISMISSED | APPEALED | REVERSED | UPHELD" }

# =============================================================================
# §1.2 State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: Vessel
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /vessels/{id}/activate"
        actor: FisheriesRegulator
        preconditions:
          - "vessel.status == REGISTERED (else ERR_VESSEL_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — automatic when a violation adjudication drops Vessel.compliance_points below 50"
        actor: system
        preconditions:
          - "compliance_points < 50 after penalty application"
        side_effects:
          - "all Permits of this vessel in ISSUED -> SUSPENDED"
          - "all FishingTrips of this vessel in PLANNED -> CANCELLED (cascade: their non-terminal ObserverAssignments -> CANCELLED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vessels/{id}/reinstate"
        actor: FisheriesRegulator
        preconditions:
          - "vessel.status == SUSPENDED (else ERR_VESSEL_NOT_ACTIVE)"
          - "compliance_points >= 50 (else ERR_COMPLIANCE_TOO_LOW)"
        side_effects:
          - "all Permits of this vessel in SUSPENDED -> ISSUED (only if permit.valid_to > current clock)"
      - from: REGISTERED
        to: DECOMMISSIONED
        trigger: "POST /vessels/{id}/decommission"
        actor: FisheriesRegulator
        preconditions:
          - "no FishingTrip of this vessel in PLANNED, DEPARTED, RETURNED, or LANDING_FINALIZED (else ERR_VESSEL_HAS_OPEN_TRIPS)"
        side_effects:
          - "all Permits of this vessel in ISSUED or SUSPENDED -> REVOKED"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /vessels/{id}/decommission"
        actor: FisheriesRegulator
        preconditions:
          - "no FishingTrip of this vessel in PLANNED, DEPARTED, RETURNED, or LANDING_FINALIZED (else ERR_VESSEL_HAS_OPEN_TRIPS)"
        side_effects:
          - "all Permits of this vessel in ISSUED or SUSPENDED -> REVOKED"
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST /vessels/{id}/decommission"
        actor: FisheriesRegulator
        preconditions:
          - "no FishingTrip of this vessel in PLANNED, DEPARTED, RETURNED, or LANDING_FINALIZED (else ERR_VESSEL_HAS_OPEN_TRIPS)"
        side_effects:
          - "all Permits of this vessel in ISSUED or SUSPENDED -> REVOKED"

  - entity: Permit
    initial_state: ISSUED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: FisheriesRegulator
        preconditions:
          - "permit.status == ISSUED or SUSPENDED (else ERR_PERMIT_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: FisheriesRegulator
        preconditions:
          - "permit.status == ISSUED or SUSPENDED (else ERR_PERMIT_NOT_ACTIVE)"
        side_effects: []
      - from: ISSUED
        to: SUSPENDED
        trigger: "system — cascade from Vessel ACTIVE -> SUSPENDED"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ISSUED
        trigger: "system — cascade from Vessel SUSPENDED -> ACTIVE reinstate (only when valid_to > current clock)"
        actor: system
        preconditions:
          - "permit.valid_to > current logical clock"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system — on POST /_clock/set_current_utc when clock > permit.valid_to"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system — on POST /_clock/set_current_utc when clock > permit.valid_to"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SeasonOpening
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CLOSED_EARLY]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system — on POST /_clock/set_current_utc when clock >= opens_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system — on POST /_clock/set_current_utc when clock > closes_at"
        actor: system
        preconditions: []
        side_effects:
          - "all FishingTrips on this opening in PLANNED -> CANCELLED (cascade: their non-terminal ObserverAssignments -> CANCELLED)"
      - from: OPEN
        to: CLOSED_EARLY
        trigger: "POST /season-openings/{id}/close-early (manual) OR system when a landing verification pushes landed_against_tac_pounds >= tac_pounds"
        actor: FisheriesRegulator | system
        preconditions:
          - "manual path: opening.status == OPEN (else ERR_OPENING_NOT_OPEN)"
        side_effects:
          - "all FishingTrips on this opening in PLANNED -> CANCELLED (cascade: their non-terminal ObserverAssignments -> CANCELLED; each cancelled assignment recomputes its Observer.status)"
      - from: SCHEDULED
        to: CLOSED
        trigger: "system — on POST /_clock/set_current_utc when clock > closes_at (opening never opened because opens_at was skipped past is impossible; SCHEDULED->CLOSED occurs only when opens_at == closes_at edge is rejected, so this is unused)"
        actor: system
        preconditions: []
        side_effects: []
        note: "kept for completeness; normally unreachable because opens_at < closes_at and clock crosses opens_at first"

  - entity: FishingTrip
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DEPARTED
        trigger: "POST /fishing-trips/{id}/depart"
        actor: Captain
        preconditions:
          - "trip.status == PLANNED (else ERR_TRIP_NOT_PLANNED)"
          - "trip.vessel.status == ACTIVE (else ERR_VESSEL_NOT_ACTIVE)"
          - "season opening of trip.status == OPEN and clock within [opens_at, closes_at] (else ERR_OUTSIDE_OPENING_WINDOW)"
          - "observer coverage: trip.observer_required == false OR trip.observer_waived == true OR exists ObserverAssignment of trip in CONFIRMED (else ERR_OBSERVER_COVERAGE_MISSING)"
          - "gear: for each gear_requirements entry, sum of units_operational over the vessel's GearAssets with that gear_type >= required units (else ERR_GEAR_SHORTAGE)"
        side_effects:
          - "actual_departure_utc = current logical clock"
          - "ObserverAssignment of this trip in CONFIRMED -> DEPLOYED"
      - from: DEPARTED
        to: RETURNED
        trigger: "POST /fishing-trips/{id}/return"
        actor: Captain
        preconditions:
          - "trip.status == DEPARTED (else ERR_TRIP_NOT_DEPARTED)"
        side_effects:
          - "actual_return_utc = current logical clock"
          - "if vessel.vms_unit_id is set: run vms_gap_detection over [actual_departure_utc, actual_return_utc]; on failure create ComplianceViolation(violation_type=VMS_GAP, status=OPEN, trip_id=this trip)"
      - from: RETURNED
        to: LANDING_FINALIZED
        trigger: "system — automatic when the trip's LandingDeclaration reaches FINALIZED"
        actor: system
        preconditions: []
        side_effects: []
      - from: LANDING_FINALIZED
        to: SETTLED
        trigger: "system — automatic when the trip's TripSettlement reaches PAID"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /fishing-trips/{id}/cancel (manual) OR system cascade (opening closed/closed-early, vessel suspended)"
        actor: VesselOwner | Captain | system
        preconditions:
          - "manual path: trip.status == PLANNED (else ERR_TRIP_NOT_PLANNED)"
        side_effects:
          - "all ObserverAssignments of this trip in REQUESTED, ASSIGNED, or CONFIRMED -> CANCELLED (each cancellation recomputes Observer.status)"

  - entity: CatchReport
    initial_state: RECORDED
    terminal_states: [RECORDED]
    transitions: []
    note: "append-only; creation is the only write. Creation requires trip.status == DEPARTED (ERR_TRIP_NOT_DEPARTED)."

  - entity: LandingDeclaration
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /landing-declarations/{id}/submit"
        actor: Captain
        preconditions:
          - "declaration.status in {DRAFT, AMENDED} (else ERR_DECLARATION_NOT_SUBMITTED)"
          - "trip.status == RETURNED (else ERR_TRIP_NOT_RETURNED)"
        side_effects:
          - "recompute discrepancy_details per line"
      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /landing-declarations/{id}/submit"
        actor: Captain
        preconditions:
          - "declaration.status in {DRAFT, AMENDED} (else ERR_DECLARATION_NOT_SUBMITTED)"
          - "trip.status == RETURNED (else ERR_TRIP_NOT_RETURNED)"
        side_effects:
          - "recompute discrepancy_details per line"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /landing-declarations/{id}/verify"
        actor: FisheriesRegulator
        preconditions:
          - "declaration.status == SUBMITTED (else ERR_DECLARATION_NOT_SUBMITTED)"
          - "observer gate: trip.observer_required == false OR trip.observer_waived == true OR exists assignment of trip in DEBRIEFED (else ERR_OBSERVER_NOT_DEBRIEFED)"
          - "discrepancy gate: every line within_tolerance == true; if any line exceeds tolerance the declaration transitions to DISPUTED instead of raising an error"
          - "quota gate: for each line, holding.available_committed_pounds >= line.declared_lbs (else ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "for each line: holding.landed_pounds += declared_lbs; opening.landed_against_tac_pounds += declared_lbs"
          - "if opening.landed_against_tac_pounds >= opening.tac_pounds: opening -> CLOSED_EARLY with full cascade"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "system — during POST /landing-declarations/{id}/verify when any line exceeds the discrepancy tolerance"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: AMENDED
        trigger: "POST /landing-declarations/{id}/amend"
        actor: Captain
        preconditions:
          - "declaration.status == DISPUTED (else ERR_DECLARATION_NOT_DISPUTED)"
        side_effects:
          - "lines replaced by payload lines"
      - from: VERIFIED
        to: FINALIZED
        trigger: "POST /landing-declarations/{id}/finalize"
        actor: FisheriesRegulator
        preconditions:
          - "declaration.status == VERIFIED (else ERR_DECLARATION_NOT_VERIFIED)"
        side_effects:
          - "trip -> LANDING_FINALIZED (bubble up)"

  - entity: QuotaTransfer
    initial_state: PROPOSED
    terminal_states: [SETTLED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /quota-transfers/{id}/counter"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "expected_transfer_version == transfer.version (else ERR_STALE_VERSION)"
          - "actor is owner of to_vessel when status == PROPOSED, owner of from_vessel when status == COUNTERED (the side that did NOT table the current offer; else ERR_TRANSFER_OWN_OFFER)"
        side_effects:
          - "pounds and price_per_lb_cents replaced by payload; round_number += 1; last_offered_by flips"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /quota-transfers/{id}/counter"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "expected_transfer_version == transfer.version (else ERR_STALE_VERSION)"
          - "actor is the side that did NOT table the current offer (else ERR_TRANSFER_OWN_OFFER)"
        side_effects:
          - "pounds and price_per_lb_cents replaced by payload; round_number += 1; last_offered_by flips"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /quota-transfers/{id}/accept"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "actor is the side that did NOT table the current offer (else ERR_TRANSFER_OWN_OFFER)"
          - "both vessels hold a Permit for transfer.fishery_code in ISSUED (else ERR_PERMIT_NOT_ACTIVE)"
          - "from-holding.available_conservative_pounds >= transfer.pounds (else ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "from-holding leased-out increases by pounds (available_committed and available_conservative both drop)"
          - "to-holding leased-in increases by pounds"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /quota-transfers/{id}/accept"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "actor is the side that did NOT table the current offer (else ERR_TRANSFER_OWN_OFFER)"
          - "both vessels hold a Permit for transfer.fishery_code in ISSUED (else ERR_PERMIT_NOT_ACTIVE)"
          - "from-holding.available_conservative_pounds >= transfer.pounds (else ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "from-holding leased-out increases by pounds"
          - "to-holding leased-in increases by pounds"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /quota-transfers/{id}/decline"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "actor is the side that did NOT table the current offer (else ERR_TRANSFER_OWN_OFFER)"
        side_effects: []
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /quota-transfers/{id}/decline"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "actor is the side that did NOT table the current offer (else ERR_TRANSFER_OWN_OFFER)"
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /quota-transfers/{id}/withdraw"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "actor is the side that tabled the current offer (last_offered_by side; else ERR_TRANSFER_OWN_OFFER)"
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /quota-transfers/{id}/withdraw"
        actor: VesselOwner
        preconditions:
          - "transfer.status in {PROPOSED, COUNTERED} (else ERR_TRANSFER_NOT_OPEN)"
          - "actor is the side that tabled the current offer (else ERR_TRANSFER_OWN_OFFER)"
        side_effects: []
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /quota-transfers/{id}/settle"
        actor: SettlementClerk
        preconditions:
          - "transfer.status == ACCEPTED (else ERR_TRANSFER_NOT_ACCEPTED)"
        side_effects:
          - "transfer_fee_cents computed per transfer_fee_schedule"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system — on POST /_clock/set_current_utc when clock > season_year-12-31T23:59:59Z"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: EXPIRED
        trigger: "system — on POST /_clock/set_current_utc when clock > season_year-12-31T23:59:59Z"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system — on POST /_clock/set_current_utc when clock > season_year-12-31T23:59:59Z"
        actor: system
        preconditions: []
        side_effects:
          - "compensating release: from-holding leased-out -= pounds; to-holding leased-in -= pounds"

  - entity: ObserverAssignment
    initial_state: REQUESTED
    terminal_states: [DEBRIEFED, RELEASED, WAIVED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "POST /observer-assignments/{id}/assign"
        actor: ObserverCoordinator
        preconditions:
          - "assignment.status == REQUESTED (else ERR_ASSIGNMENT_NOT_REQUESTED)"
          - "expected_observer_version == observer.version (else ERR_STALE_VERSION)"
          - "certification: vessel class FULL requires cert A; PARTIAL requires A or B; EXEMPT allows any (else ERR_OBSERVER_CERT_INSUFFICIENT)"
          - "no overlap with the observer's other assignments in ASSIGNED, CONFIRMED, or DEPLOYED: new.coverage_from >= existing.coverage_to + 24h OR new.coverage_to + 24h <= existing.coverage_from (else ERR_OBSERVER_DOUBLE_BOOKED)"
        side_effects:
          - "observer.status -> ON_ASSIGNMENT; observer.version increments by 1"
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /observer-assignments/{id}/confirm"
        actor: Observer
        preconditions:
          - "assignment.status == ASSIGNED (else ERR_ASSIGNMENT_NOT_ASSIGNED)"
          - "X-User-ID == assignment.observer_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: CONFIRMED
        to: DEPLOYED
        trigger: "system — automatic when the trip departs"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLOYED
        to: DEBRIEFED
        trigger: "POST /observer-assignments/{id}/debrief"
        actor: Observer
        preconditions:
          - "assignment.status == DEPLOYED (else ERR_ASSIGNMENT_NOT_DEPLOYED)"
          - "X-User-ID == assignment.observer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "trip.status in {RETURNED, LANDING_FINALIZED, SETTLED} (else ERR_TRIP_NOT_RETURNED)"
        side_effects:
          - "observer.status recomputed (AVAILABLE when no other non-terminal assignments)"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /observer-assignments/{id}/release"
        actor: ObserverCoordinator
        preconditions:
          - "assignment.status == CONFIRMED (else ERR_ASSIGNMENT_NOT_CONFIRMABLE)"
        side_effects:
          - "observer.status recomputed"
          - "compensating re-request: if trip.status == PLANNED and trip.observer_required and not observer_waived, auto-create a fresh ObserverAssignment in REQUESTED for the trip"
      - from: REQUESTED
        to: WAIVED
        trigger: "POST /observer-assignments/{id}/waive"
        actor: FisheriesRegulator
        preconditions:
          - "assignment.status == REQUESTED (else ERR_ASSIGNMENT_NOT_REQUESTED)"
        side_effects:
          - "trip.observer_waived = true"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system — cascade from trip cancellation"
        actor: system
        preconditions: []
        side_effects:
          - "observer.status recomputed if observer_id set"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system — cascade from trip cancellation"
        actor: system
        preconditions: []
        side_effects:
          - "observer.status recomputed"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system — cascade from trip cancellation"
        actor: system
        preconditions: []
        side_effects:
          - "observer.status recomputed"

  - entity: ExpenseRecord
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /expenses/{id}/verify"
        actor: SettlementClerk
        preconditions:
          - "expense.status == PENDING (else ERR_EXPENSE_NOT_PENDING)"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /expenses/{id}/reject"
        actor: SettlementClerk
        preconditions:
          - "expense.status == PENDING (else ERR_EXPENSE_NOT_PENDING)"
        side_effects: []

  - entity: TripSettlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: CALCULATED
        trigger: "POST /trip-settlements/{id}/calculate"
        actor: SettlementClerk
        preconditions:
          - "settlement.status == DRAFT (else ERR_SETTLEMENT_NOT_DRAFT)"
          - "every ExpenseRecord of the trip in VERIFIED or REJECTED (else ERR_EXPENSES_UNRESOLVED)"
          - "at least one CrewShareContract of the vessel in ACTIVE (else ERR_NO_ACTIVE_CREW)"
          - "net_before_fee >= 0 (else ERR_SETTLEMENT_UNDERWATER)"
        side_effects:
          - "run settlement_totals (final variant) then crew_pool_split; populate crew_payouts"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /trip-settlements/{id}/approve"
        actor: VesselOwner
        preconditions:
          - "settlement.status == CALCULATED (else ERR_SETTLEMENT_NOT_CALCULATED)"
          - "X-User-ID == trip.vessel_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: CALCULATED
        to: DISPUTED
        trigger: "POST /trip-settlements/{id}/dispute"
        actor: CrewMember
        preconditions:
          - "settlement.status == CALCULATED (else ERR_SETTLEMENT_NOT_CALCULATED)"
          - "X-User-ID is an ACTIVE CrewShareContract id on the trip's vessel (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: DISPUTED
        to: CALCULATED
        trigger: "POST /trip-settlements/{id}/recalculate"
        actor: SettlementClerk
        preconditions:
          - "settlement.status == DISPUTED (else ERR_SETTLEMENT_NOT_DISPUTED)"
          - "expected_settlement_version == settlement.version (else ERR_STALE_VERSION)"
          - "every ExpenseRecord of the trip in VERIFIED or REJECTED (else ERR_EXPENSES_UNRESOLVED)"
          - "net_before_fee >= 0 (else ERR_SETTLEMENT_UNDERWATER)"
        side_effects:
          - "recompute settlement_totals and crew_pool_split from current data"
      - from: APPROVED
        to: PAID
        trigger: "POST /trip-settlements/{id}/pay"
        actor: SettlementClerk
        preconditions:
          - "settlement.status == APPROVED (else ERR_SETTLEMENT_NOT_APPROVED)"
        side_effects:
          - "trip -> SETTLED (bubble up)"

  - entity: ComplianceViolation
    initial_state: OPEN
    terminal_states: [DISMISSED, REVERSED, UPHELD]
    transitions:
      - from: OPEN
        to: ADJUDICATED
        trigger: "POST /violations/{id}/adjudicate"
        actor: FisheriesRegulator
        preconditions:
          - "violation.status == OPEN (else ERR_VIOLATION_NOT_OPEN)"
        side_effects:
          - "severity_points computed via violation_penalty_score"
          - "vessel.compliance_points -= severity_points"
          - "if vessel.compliance_points < 50: vessel -> SUSPENDED with full cascade (permits SUSPENDED, PLANNED trips CANCELLED, their assignments CANCELLED)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /violations/{id}/dismiss"
        actor: FisheriesRegulator
        preconditions:
          - "violation.status == OPEN (else ERR_VIOLATION_NOT_OPEN)"
        side_effects: []
      - from: ADJUDICATED
        to: APPEALED
        trigger: "POST /violations/{id}/appeal"
        actor: VesselOwner
        preconditions:
          - "violation.status == ADJUDICATED (else ERR_VIOLATION_NOT_ADJUDICATED)"
          - "X-User-ID == violation.vessel_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: APPEALED
        to: REVERSED
        trigger: "POST /violations/{id}/reverse"
        actor: FisheriesRegulator
        preconditions:
          - "violation.status == APPEALED (else ERR_VIOLATION_NOT_APPEALED)"
        side_effects:
          - "compensation: vessel.compliance_points += severity_points (suspension is NOT auto-lifted; reinstate is manual)"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /violations/{id}/uphold"
        actor: FisheriesRegulator
        preconditions:
          - "violation.status == APPEALED (else ERR_VIOLATION_NOT_APPEALED)"
        side_effects: []

  - entity: GearAsset
    initial_state: OPERATIONAL
    terminal_states: []
    transitions: []
    note: "status is a computed projection (OPERATIONAL when units_operational > 0 else DOWN) over GearEvents; no explicit transitions."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; 412 on stale)
# =============================================================================
concurrency_rules:
  - rule_id: observer-assignment-stale-observer
    parent_entity: Observer
    write_endpoint: "POST /observer-assignments/{id}/assign"
    occ_field: expected_observer_version
    description: |
      Assigning an observer whose version has advanced since the client last
      read it is rejected: the client is selecting an observer from a stale
      availability picture (e.g., the observer has since been assigned to
      another trip, which legitimately succeeded). The stale write is refused
      with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: trip-reschedule-stale-trip
    parent_entity: FishingTrip
    write_endpoint: "PATCH /fishing-trips/{id}"
    occ_field: expected_trip_version
    description: |
      Rescheduling a trip whose version has advanced since the client last
      read it is rejected: the client's planned window no longer reflects the
      trip's current state. Refused with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-recalc-stale-settlement
    parent_entity: TripSettlement
    write_endpoint: "POST /trip-settlements/{id}/recalculate"
    occ_field: expected_settlement_version
    description: |
      Recalculating a settlement whose version has advanced since the client
      last read it is rejected: the recalculation basis (expense set, dispute
      round) is stale. Refused with ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-counter-stale-transfer
    parent_entity: QuotaTransfer
    write_endpoint: "POST /quota-transfers/{id}/counter"
    occ_field: expected_transfer_version
    description: |
      Countering a transfer offer whose version has advanced since the client
      last read it is rejected: a counter supersedes the prior offer round, so
      the client must have observed the latest round. Refused with
      ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (10 rules)
# =============================================================================
calculations:
  - name: available_quota
    trigger: "evaluated on transfer create/accept and landing verify (committed variant) and on GET /quota-holdings/{id}/availability (both variants)"
    algorithm: aggregation
    formula: |
      leased_out = sum(pounds of QuotaTransfers with from_vessel_id == holding.vessel_id,
                       fishery_code == holding.fishery_code, season_year == holding.season_year,
                       status in {ACCEPTED, SETTLED})
      leased_in  = sum(pounds of QuotaTransfers with to_vessel_id == holding.vessel_id,
                       fishery_code == holding.fishery_code, season_year == holding.season_year,
                       status in {ACCEPTED, SETTLED})
      available_committed = initial_pounds - landed_pounds + leased_in - leased_out
      pending_out = sum(pounds of QuotaTransfers with from_vessel_id == holding.vessel_id,
                        same fishery/year, status in {PROPOSED, COUNTERED})
      available_conservative = available_committed - pending_out
    input_set: "transfers filtered by vessel side, fishery_code, season_year, and the explicit status sets above; landed_pounds from VERIFIED/FINALIZED landing lines"
    constants: {}
    precision: "integer pounds; no rounding"
    variants:
      - name: committed
        when: "landing verification quota gate and availability endpoint"
        difference: "counts only ACCEPTED/SETTLED leases; ignores open negotiation rounds"
      - name: conservative
        when: "transfer create and transfer accept quota gate"
        difference: "additionally subtracts PROPOSED/COUNTERED outgoing offers so a vessel cannot over-commit while offers are open; identical inputs yield a lower number than committed whenever open offers exist"

  - name: landing_discrepancy_check
    trigger: "on POST /landing-declarations/{id}/submit (recompute discrepancy_details) and on POST /landing-declarations/{id}/verify (gate)"
    algorithm: aggregation
    formula: |
      for each declaration line with fishery_code F:
        expected_lbs = sum(reported_lbs of CatchReports on the trip with fishery_code == F
                           and report_type == HARVEST)
                     - sum(reported_lbs with fishery_code == F and report_type == DISCARD)
        diff = abs(line.declared_lbs - expected_lbs)
        if expected_lbs == 0:
          within_tolerance = (line.declared_lbs == 0)
        else:
          within_tolerance = (diff <= round_half_up(0.05 * expected_lbs))
      verification passes only when every line has within_tolerance == true;
      otherwise the declaration transitions SUBMITTED -> DISPUTED (no error raised)
    input_set: "CatchReports of the trip (append-only, all rows); declaration lines"
    constants:
      DISCREPANCY_TOLERANCE_PCT: 0.05
    precision: "integer pounds; tolerance = round_half_up(0.05 * expected_lbs); boundary is inclusive (diff == tolerance passes)"

  - name: tac_consumption_and_early_closure
    trigger: "on landing verification (each VERIFIED line adds declared_lbs to opening.landed_against_tac_pounds)"
    algorithm: threshold
    formula: |
      opening.landed_against_tac_pounds += declared_lbs (per verified line)
      if landed_against_tac_pounds >= tac_pounds:
        opening -> CLOSED_EARLY and cascade (PLANNED trips cancelled, their
        non-terminal assignments cancelled, observer statuses recomputed)
    input_set: "all VERIFIED/FINALIZED landing lines of trips on this opening"
    constants: {}
    precision: "integer pounds; boundary is inclusive — landing exactly up to tac_pounds closes the opening"

  - name: settlement_totals
    trigger: "settlement creation (provisional variant) and POST /trip-settlements/{id}/calculate or /recalculate (final variant)"
    algorithm: waterfall_allocation
    formula: |
      PINNED EVALUATION ORDER (breaks the circularity that the fee is a
      percentage of crew-visible money while the crew pool depends on the fee):
      1. total_expenses = sum(amount_cents of ExpenseRecords of the trip)
         final variant: status == VERIFIED only
         provisional variant: status in {PENDING, VERIFIED}
      2. observer_fee = sum over the trip's assignments in {DEPLOYED, DEBRIEFED}
         of ceil((coverage_to - coverage_from) hours / 24) * OBSERVER_DAY_RATE_CENTS
      3. gear_loss_charge = max(0, LOSS units - REPAIR units among GearEvents
         with trip_id == this trip) * GEAR_UNIT_REPLACEMENT_CENTS
      4. net_before_fee = gross_revenue_cents - total_expenses - observer_fee - gear_loss_charge
         (calculation precondition: net_before_fee >= 0 else ERR_SETTLEMENT_UNDERWATER)
      5. processing_fee = round_half_up(PROCESSING_FEE_PCT * net_before_fee)
      6. net = net_before_fee - processing_fee
      7. vessel_share = round_half_up(VESSEL_SHARE_PCT * net)
      8. crew_pool = net - vessel_share
      Invariant: gross == total_expenses + observer_fee + gear_loss_charge
                          + processing_fee + vessel_share + crew_pool
    input_set: "expenses of the trip filtered by status per variant; assignments of the trip in DEPLOYED/DEBRIEFED; GearEvents with trip_id == trip"
    constants:
      VESSEL_SHARE_PCT: 0.60
      PROCESSING_FEE_PCT: 0.015
      OBSERVER_DAY_RATE_CENTS: 45000
      GEAR_UNIT_REPLACEMENT_CENTS: 25000
    precision: "integer cents; round_half_up at steps 5 and 7 only"
    variants:
      - name: provisional
        when: "computed at settlement creation, before expense adjudication finishes"
        difference: "expense set includes PENDING records, so provisional_crew_pool_cents differs from final crew_pool_cents whenever any expense is still PENDING at creation"
      - name: final
        when: "calculate / recalculate"
        difference: "expense set is VERIFIED only; requires all expenses terminal"

  - name: crew_pool_split
    trigger: "inside settlement_totals final variant (calculate/recalculate)"
    algorithm: waterfall_allocation
    formula: |
      contracts = CrewShareContracts of the vessel with status == ACTIVE
      total_points = sum(share_points of contracts)   (precondition: >= 1 contract)
      for each contract (evaluation order: share_points DESC, joined_at ASC, created_at ASC):
        raw = crew_pool * share_points / total_points
        payout = floor(raw)
      remainder = crew_pool - sum(payouts)
      distribute remainder one cent at a time to contracts in the same order
      (share_points DESC, joined_at ASC, created_at ASC) until remainder == 0
      Invariant: sum(crew_payouts.payout_cents) == crew_pool exactly
    input_set: "ACTIVE CrewShareContracts of the trip's vessel"
    constants: {}
    precision: "integer cents; floor per member THEN distribute remainder — pinned order; a sum-then-round alternative yields different per-member cents and is non-conformant"

  - name: transfer_fee_schedule
    trigger: "on POST /quota-transfers/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      value = pounds * price_per_lb_cents
      if pounds <= 1000:
        fee = FLAT_FEE_CENTS
      elif pounds <= 10000:
        fee = FLAT_FEE_CENTS + round_half_up(0.04 * value)
      else:
        fee = FLAT_FEE_CENTS + round_half_up(0.04 * 10000 * price_per_lb_cents)
              + round_half_up(0.07 * (pounds - 10000) * price_per_lb_cents)
    input_set: "the settled QuotaTransfer's current pounds and price_per_lb_cents (i.e., the last countered values)"
    constants:
      FLAT_FEE_CENTS: 25000
      MID_TIER_PCT: 0.04
      HIGH_TIER_PCT: 0.07
      MID_TIER_MAX_LBS: 10000
      FLAT_TIER_MAX_LBS: 1000
    precision: "integer cents; round_half_up per tier component"

  - name: violation_penalty_score
    trigger: "on POST /violations/{id}/adjudicate (before points are deducted); reverse refunds the same stored severity_points"
    algorithm: weighted_scoring
    formula: |
      base = BASE_POINTS[violation_type]
      tier_multiplier: vessel.compliance_points BEFORE deduction
        >= 80 -> 1.0 ; 50..79 -> 1.5 ; < 50 -> 2.0
      repeat_factor = 1.5 if any other violation of the same vessel with the
        same violation_type and same season_year has status in {ADJUDICATED, UPHELD}
        else 1.0
      severity_points = round_half_up(base * tier_multiplier * repeat_factor)
    input_set: "violation type; vessel.compliance_points at adjudication time; prior same-type violations of the vessel in ADJUDICATED/UPHELD for the same season_year"
    constants:
      BASE_POINTS_OVER_QUOTA: 20
      BASE_POINTS_OUT_OF_SEASON: 25
      BASE_POINTS_OBSERVER_BREACH: 15
      BASE_POINTS_VMS_GAP: 10
      BASE_POINTS_GEAR_MISMATCH: 5
      BASE_POINTS_MANUAL_CITATION: 10
      TIER1_MIN_POINTS: 80
      TIER2_MIN_POINTS: 50
      REPEAT_FACTOR: 1.5
      SUSPENSION_THRESHOLD: 50
    precision: "integer points; round_half_up once at the end; suspension fires when resulting compliance_points < 50 (exactly 50 does NOT suspend)"

  - name: vms_gap_detection
    trigger: "on POST /fishing-trips/{id}/return, only when vessel.vms_unit_id is set"
    algorithm: chronological
    formula: |
      pings = VMSPings of the vessel with recorded_at in
              [actual_departure_utc, actual_return_utc], sorted by recorded_at ASC
              (tie-break: created_at ASC)
      boundaries: treat actual_departure_utc and actual_return_utc as synthetic pings
      gaps = consecutive differences (including the synthetic boundary pings)
      if any gap > MAX_GAP_MINUTES minutes: create ComplianceViolation
        (violation_type=VMS_GAP, status=OPEN, trip_id=this trip, details record the longest gap)
      exactly MAX_GAP_MINUTES is compliant (boundary is strictly greater-than)
    input_set: "VMSPings of the vessel inside the trip's actual window plus synthetic boundary pings"
    constants:
      MAX_GAP_MINUTES: 120
    precision: "whole minutes; strict > comparison"

  - name: observer_fee_accrual
    trigger: "inside settlement_totals step 2"
    algorithm: aggregation
    formula: |
      for each ObserverAssignment of the trip in {DEPLOYED, DEBRIEFED}:
        hours = (coverage_to - coverage_from) in hours (fractional allowed)
        fee += ceil(hours / 24) * OBSERVER_DAY_RATE_CENTS
      assignments in REQUESTED/ASSIGNED/CONFIRMED/RELEASED/WAIVED/CANCELLED contribute 0
    input_set: "assignments of the trip in DEPLOYED or DEBRIEFED"
    constants:
      OBSERVER_DAY_RATE_CENTS: 45000
    precision: "integer cents; ceil on day count per assignment"

  - name: gear_operational_units
    trigger: "on every GearEvent creation (projection update on the parent GearAsset)"
    algorithm: projection
    formula: |
      replay the asset's GearEvents ordered by occurred_at ASC, tie-break created_at ASC:
        LOSS:               units_lost += units
        REPAIR:             units_lost = max(0, units_lost - units)
        MAINTENANCE_START:  units_in_maintenance += units
                            (requires units_operational >= units else ERR_INVALID_GEAR_EVENT)
        MAINTENANCE_END:    units_in_maintenance -= units
                            (requires units_in_maintenance >= units else ERR_INVALID_GEAR_EVENT)
      units_operational = units_total - units_lost - units_in_maintenance
      status = OPERATIONAL if units_operational > 0 else DOWN
    input_set: "all GearEvents of the GearAsset"
    constants: {}
    precision: "integer units"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "the caller's role must be allowed on this endpoint; entity-backed roles must also satisfy ownership (VesselOwner/Captain: X-User-ID == the vessel id of the target resource; Observer: X-User-ID == assignment.observer_id; CrewMember: X-User-ID == an ACTIVE CrewShareContract id on the relevant vessel)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
    description: "ownership mismatch on an otherwise-allowed role returns ERR_NOT_RESOURCE_OWNER (403) at this same priority"
  - priority: 3
    category: existence
    check: "path ids must exist, validated left-to-right (vessel before permit, trip before declaration, etc.); body-referenced ids (vessel_id, season_opening_id, from/to_vessel_id, observer_id, holding lookups by fishery/year) must exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body resource references"
  - priority: 4
    category: state
    check: "OCC: when the endpoint declares expected_<parent>_version, it must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /observer-assignments/{id}/assign; PATCH /fishing-trips/{id}; POST /trip-settlements/{id}/recalculate; POST /quota-transfers/{id}/counter"
  - priority: 5
    category: state
    check: "the target resource must be in the state the transition requires (trip PLANNED for depart, DEPARTED for return, declaration SUBMITTED for verify, transfer PROPOSED/COUNTERED for counter/accept/decline/withdraw, etc.)"
    error_id: "state-specific: ERR_TRIP_NOT_PLANNED | ERR_TRIP_NOT_DEPARTED | ERR_TRIP_NOT_RETURNED | ERR_DECLARATION_NOT_SUBMITTED | ERR_DECLARATION_NOT_DISPUTED | ERR_DECLARATION_NOT_VERIFIED | ERR_TRANSFER_NOT_OPEN | ERR_TRANSFER_NOT_ACCEPTED | ERR_ASSIGNMENT_NOT_REQUESTED | ERR_ASSIGNMENT_NOT_ASSIGNED | ERR_ASSIGNMENT_NOT_DEPLOYED | ERR_ASSIGNMENT_NOT_CONFIRMABLE | ERR_EXPENSE_NOT_PENDING | ERR_SETTLEMENT_NOT_DRAFT | ERR_SETTLEMENT_NOT_CALCULATED | ERR_SETTLEMENT_NOT_DISPUTED | ERR_SETTLEMENT_NOT_APPROVED | ERR_VIOLATION_NOT_OPEN | ERR_VIOLATION_NOT_ADJUDICATED | ERR_VIOLATION_NOT_APPEALED | ERR_OPENING_NOT_OPEN | ERR_VESSEL_NOT_ACTIVE | ERR_COMPLIANCE_TOO_LOW | ERR_VESSEL_HAS_OPEN_TRIPS | ERR_TRIP_NOT_LANDING_FINALIZED | ERR_DECLARATION_EXISTS | ERR_SETTLEMENT_EXISTS"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "observer coverage at depart (CONFIRMED assignment or waiver) and at landing verify (DEBRIEFED or waived); gear sufficiency at depart; observer certification level at assign"
    error_id: "ERR_OBSERVER_COVERAGE_MISSING | ERR_OBSERVER_NOT_DEBRIEFED | ERR_GEAR_SHORTAGE | ERR_OBSERVER_CERT_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /fishing-trips/{id}/depart; POST /landing-declarations/{id}/verify; POST /observer-assignments/{id}/assign"
    description: "ERR_OBSERVER_CERT_INSUFFICIENT is 422; the other three are 409"
  - priority: 7
    category: business_temporal
    check: "opening window containment for trip create/patch (planned window within [opens_at, closes_at]) and depart (opening OPEN, clock within window); opening overlap for the same fishery+area (closed-interval semantics: touching windows conflict); vessel trip overlap (half-open: back-to-back allowed); observer assignment overlap with a 24h rest buffer"
    error_id: "ERR_OUTSIDE_OPENING_WINDOW | ERR_OPENING_WINDOW_OVERLAP | ERR_TRIP_WINDOW_OVERLAP | ERR_OBSERVER_DOUBLE_BOOKED"
    http_status: 409
    applies_to: "POST /fishing-trips; PATCH /fishing-trips/{id}; POST /fishing-trips/{id}/depart; POST /season-openings; POST /observer-assignments/{id}/assign"
  - priority: 8
    category: business_referential
    check: "cross-entity link state: vessel must be ACTIVE for trip creation and transfer creation (both sides); a Permit for the opening's fishery must be ISSUED at trip creation and at transfer create/accept (both vessels); a QuotaShareHolding matching fishery+year must exist for both transfer sides"
    error_id: "ERR_VESSEL_NOT_ACTIVE | ERR_PERMIT_NOT_ACTIVE | ERR_QUOTA_HOLDING_NOT_FOUND"
    http_status: 409
    applies_to: "POST /fishing-trips; POST /quota-transfers; POST /quota-transfers/{id}/accept"
    description: "ERR_QUOTA_HOLDING_NOT_FOUND is 404 (existence of a body-implied resource); the other two are 409"
  - priority: 9
    category: business_constraint
    check: "shape/consistency rules: from_vessel_id != to_vessel_id; unique (vessel, fishery_code, season_year) holding; unique license_number; one landing declaration per trip; one settlement per trip; gear event legality; at least one ACTIVE crew contract at calculate; declared lines reference fish with holdings; landing discrepancy gate (violation transitions to DISPUTED rather than erroring)"
    error_id: "ERR_SELF_TRANSFER | ERR_DUPLICATE_HOLDING | ERR_DUPLICATE_LICENSE | ERR_DECLARATION_EXISTS | ERR_SETTLEMENT_EXISTS | ERR_INVALID_GEAR_EVENT | ERR_NO_ACTIVE_CREW | ERR_INVALID_REQUEST | ERR_INVALID_TIME_WINDOW | ERR_CLOCK_REGRESSION"
    http_status: 422
    applies_to: "resource creation and gear/settlement endpoints"
    description: "ERR_DECLARATION_EXISTS and ERR_SETTLEMENT_EXISTS and ERR_DUPLICATE_HOLDING and ERR_DUPLICATE_LICENSE are 409; ERR_CLOCK_REGRESSION, ERR_INVALID_REQUEST, ERR_INVALID_TIME_WINDOW are 400"
  - priority: 10
    category: business_fiscal
    check: "quota gates: transfer create/accept requires available_conservative >= pounds; landing verify requires available_committed >= declared_lbs per line; settlement requires net_before_fee >= 0"
    error_id: "ERR_QUOTA_EXCEEDED | ERR_SETTLEMENT_UNDERWATER"
    http_status: 402
    applies_to: "POST /quota-transfers; POST /quota-transfers/{id}/accept; POST /landing-declarations/{id}/verify; POST /trip-settlements/{id}/calculate; POST /trip-settlements/{id}/recalculate"
    description: "ERR_SETTLEMENT_UNDERWATER is 422; ERR_QUOTA_EXCEEDED is 402"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (84 endpoints)
# Roles list abbreviation: ALL = [VesselOwner, Captain, CrewMember, Observer,
#   ObserverCoordinator, FisheriesRegulator, SettlementClerk] — every GET lists
#   all seven roles explicitly.
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default clock 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). May only move forward. Triggers time-based transitions: openings SCHEDULED->OPEN (clock >= opens_at), OPEN->CLOSED (clock > closes_at), permits ISSUED/SUSPENDED->EXPIRED (clock > valid_to), transfers PROPOSED/COUNTERED/ACCEPTED->EXPIRED (clock > season_year-12-31T23:59:59Z), holdings ACTIVE->CLOSED at year end."
    roles: [FisheriesRegulator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["fires all time-based transitions listed in the description"]

  # --- Vessel ---
  - method: POST
    path: "/vessels"
    description: "Register a vessel"
    roles: [FisheriesRegulator]
    code: 201
    input: [vessel_name, license_number, home_port, length_ft, observer_coverage_class, "vms_unit_id?"]
    output: Vessel
    side_effects: ["status = REGISTERED", "compliance_points = 100"]
  - method: GET
    path: "/vessels"
    description: "List vessels"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Vessel[]"
    side_effects: []
  - method: GET
    path: "/vessels/{id}"
    description: "Get one vessel"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: Vessel
    side_effects: []
  - method: POST
    path: "/vessels/{id}/activate"
    description: "Activate a REGISTERED vessel"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: Vessel
    side_effects: ["status -> ACTIVE", "increments Vessel.version by 1"]
  - method: POST
    path: "/vessels/{id}/reinstate"
    description: "Reinstate a SUSPENDED vessel (requires compliance_points >= 50)"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: Vessel
    side_effects: ["status -> ACTIVE", "SUSPENDED permits with valid_to > clock -> ISSUED", "increments Vessel.version by 1"]
  - method: POST
    path: "/vessels/{id}/decommission"
    description: "Decommission a vessel with no open trips"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: Vessel
    side_effects: ["status -> DECOMMISSIONED", "ISSUED/SUSPENDED permits -> REVOKED", "increments Vessel.version by 1"]

  # --- Permit ---
  - method: POST
    path: "/vessels/{id}/permits"
    description: "Issue a fishery permit to a vessel"
    roles: [FisheriesRegulator]
    code: 201
    input: [fishery_code, gear_type, valid_from, valid_to]
    output: Permit
    side_effects: ["status = ISSUED"]
  - method: GET
    path: "/vessels/{id}/permits"
    description: "List permits of a vessel (FK reverse reachability for Permit.vessel_id)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Permit[]"
    side_effects: []
  - method: POST
    path: "/permits/{id}/revoke"
    description: "Revoke an ISSUED or SUSPENDED permit"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> REVOKED", "increments Permit.version by 1"]

  # --- QuotaShareHolding ---
  - method: POST
    path: "/vessels/{id}/quota-holdings"
    description: "Allocate an annual quota share holding (unique per vessel+fishery+year)"
    roles: [FisheriesRegulator]
    code: 201
    input: [fishery_code, season_year, initial_pounds]
    output: QuotaShareHolding
    side_effects: ["status = ACTIVE", "landed_pounds = 0"]
  - method: GET
    path: "/vessels/{id}/quota-holdings"
    description: "List quota holdings of a vessel"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "fishery_code?", "season_year?"]
    output: "QuotaShareHolding[]"
    side_effects: []
  - method: GET
    path: "/quota-holdings/{id}"
    description: "Get one quota holding"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: QuotaShareHolding
    side_effects: []
  - method: GET
    path: "/quota-holdings/{id}/availability"
    description: "Computed read of both availability variants per available_quota"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: { available_committed_pounds: integer, available_conservative_pounds: integer, landed_pounds: integer, leased_in_pounds: integer, leased_out_pounds: integer }
    side_effects: []

  # --- SeasonOpening ---
  - method: POST
    path: "/season-openings"
    description: "Create a season/area opening (windows for the same fishery+area must not overlap; touching windows conflict)"
    roles: [FisheriesRegulator]
    code: 201
    input: [fishery_code, area_code, opens_at, closes_at, tac_pounds]
    output: SeasonOpening
    side_effects: ["status = SCHEDULED", "landed_against_tac_pounds = 0"]
  - method: GET
    path: "/season-openings"
    description: "List season openings"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "fishery_code?", "area_code?", "status?"]
    output: "SeasonOpening[]"
    side_effects: []
  - method: GET
    path: "/season-openings/{id}"
    description: "Get one season opening"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: SeasonOpening
    side_effects: []
  - method: POST
    path: "/season-openings/{id}/close-early"
    description: "Manually close an OPEN opening early; cascades cancel PLANNED trips and their non-terminal assignments"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: SeasonOpening
    side_effects: ["status -> CLOSED_EARLY", "PLANNED trips -> CANCELLED", "their ObserverAssignments in REQUESTED/ASSIGNED/CONFIRMED -> CANCELLED", "increments SeasonOpening.version by 1"]

  # --- FishingTrip ---
  - method: POST
    path: "/fishing-trips"
    description: "Plan a trip inside an opening window"
    roles: [VesselOwner, Captain]
    code: 201
    input: [vessel_id, season_opening_id, planned_departure_utc, planned_return_utc, "gear_requirements?"]
    output: FishingTrip
    side_effects:
      - "status = PLANNED; observer_required computed from vessel class and duration"
      - "if observer_required: auto-create ObserverAssignment(REQUESTED, auto_created=true)"
  - method: GET
    path: "/fishing-trips"
    description: "List trips (FK reverse reachability for FishingTrip.vessel_id and FishingTrip.season_opening_id)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "vessel_id?", "season_opening_id?", "status?"]
    output: "FishingTrip[]"
    side_effects: []
  - method: GET
    path: "/fishing-trips/{id}"
    description: "Get one trip"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: FishingTrip
    side_effects: []
  - method: PATCH
    path: "/fishing-trips/{id}"
    description: "Reschedule a PLANNED trip (OCC on trip version)"
    roles: [VesselOwner, Captain]
    code: 200
    input: [planned_departure_utc, planned_return_utc, expected_trip_version]
    output: FishingTrip
    side_effects: ["recompute observer_required", "increments FishingTrip.version by 1"]
  - method: POST
    path: "/fishing-trips/{id}/depart"
    description: "Depart on a PLANNED trip"
    roles: [Captain]
    code: 200
    input: []
    output: FishingTrip
    side_effects: ["status -> DEPARTED", "actual_departure_utc = clock", "CONFIRMED assignment -> DEPLOYED", "increments FishingTrip.version by 1"]
  - method: POST
    path: "/fishing-trips/{id}/return"
    description: "Return from a DEPARTED trip; runs vms_gap_detection when the vessel has a vms_unit_id"
    roles: [Captain]
    code: 200
    input: []
    output: FishingTrip
    side_effects: ["status -> RETURNED", "actual_return_utc = clock", "may create ComplianceViolation(VMS_GAP)", "increments FishingTrip.version by 1"]
  - method: POST
    path: "/fishing-trips/{id}/cancel"
    description: "Cancel a PLANNED trip"
    roles: [VesselOwner, Captain]
    code: 200
    input: []
    output: FishingTrip
    side_effects: ["status -> CANCELLED", "non-terminal assignments -> CANCELLED", "increments FishingTrip.version by 1"]

  # --- CatchReport ---
  - method: POST
    path: "/fishing-trips/{id}/catch-reports"
    description: "Append a catch report while the trip is DEPARTED"
    roles: [Captain]
    code: 201
    input: [fishery_code, report_type, reported_lbs, reported_at]
    output: CatchReport
    side_effects: ["haul_seq = next per-trip sequence"]
  - method: GET
    path: "/fishing-trips/{id}/catch-reports"
    description: "List catch reports of a trip"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "CatchReport[]"
    side_effects: []

  # --- LandingDeclaration ---
  - method: POST
    path: "/fishing-trips/{id}/landing-declarations"
    description: "Create the trip's landing declaration (at most one per trip; trip must be RETURNED)"
    roles: [Captain]
    code: 201
    input: [port_code, lines]
    output: LandingDeclaration
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/fishing-trips/{id}/landing-declarations"
    description: "List landing declarations of a trip (0 or 1 rows)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "LandingDeclaration[]"
    side_effects: []
  - method: GET
    path: "/landing-declarations/{id}"
    description: "Get one landing declaration"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: LandingDeclaration
    side_effects: []
  - method: POST
    path: "/landing-declarations/{id}/submit"
    description: "Submit a DRAFT or AMENDED declaration"
    roles: [Captain]
    code: 200
    input: []
    output: LandingDeclaration
    side_effects: ["status -> SUBMITTED", "recompute discrepancy_details", "increments LandingDeclaration.version by 1"]
  - method: POST
    path: "/landing-declarations/{id}/verify"
    description: "Verify a SUBMITTED declaration; discrepancy over tolerance transitions it to DISPUTED (200, no error); quota gate raises ERR_QUOTA_EXCEEDED"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: LandingDeclaration
    side_effects: ["status -> VERIFIED", "holdings landed_pounds += declared per line", "opening landed_against_tac_pounds += declared per line", "TAC threshold may fire CLOSED_EARLY cascade", "increments LandingDeclaration.version by 1"]
  - method: POST
    path: "/landing-declarations/{id}/amend"
    description: "Amend a DISPUTED declaration's lines"
    roles: [Captain]
    code: 200
    input: [lines]
    output: LandingDeclaration
    side_effects: ["status -> AMENDED", "lines replaced", "increments LandingDeclaration.version by 1"]
  - method: POST
    path: "/landing-declarations/{id}/finalize"
    description: "Finalize a VERIFIED declaration; bubbles the trip to LANDING_FINALIZED"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: LandingDeclaration
    side_effects: ["status -> FINALIZED", "trip -> LANDING_FINALIZED", "increments LandingDeclaration.version by 1"]

  # --- QuotaTransfer ---
  - method: POST
    path: "/quota-transfers"
    description: "Propose a quota lease between two vessels (round 1, last_offered_by = FROM_VESSEL)"
    roles: [VesselOwner]
    code: 201
    input: [from_vessel_id, to_vessel_id, fishery_code, season_year, pounds, price_per_lb_cents]
    output: QuotaTransfer
    side_effects: ["status = PROPOSED", "round_number = 1", "last_offered_by = FROM_VESSEL"]
  - method: GET
    path: "/quota-transfers"
    description: "List transfers (FK reverse reachability for from_vessel_id and to_vessel_id)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "from_vessel_id?", "to_vessel_id?", "status?"]
    output: "QuotaTransfer[]"
    side_effects: []
  - method: GET
    path: "/quota-transfers/{id}"
    description: "Get one transfer"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: QuotaTransfer
    side_effects: []
  - method: POST
    path: "/quota-transfers/{id}/counter"
    description: "Counter-offer the current round (OCC on transfer version; only the side that did not table the current offer)"
    roles: [VesselOwner]
    code: 200
    input: [pounds, price_per_lb_cents, expected_transfer_version]
    output: QuotaTransfer
    side_effects: ["pounds/price replaced", "round_number += 1", "last_offered_by flips", "status toggles PROPOSED<->COUNTERED", "increments QuotaTransfer.version by 1"]
  - method: POST
    path: "/quota-transfers/{id}/accept"
    description: "Accept the current offer (only the side that did not table it); debits from-holding, credits to-holding"
    roles: [VesselOwner]
    code: 200
    input: []
    output: QuotaTransfer
    side_effects: ["status -> ACCEPTED", "from-holding leased-out += pounds", "to-holding leased-in += pounds", "increments QuotaTransfer.version by 1 and both holdings' versions by 1"]
  - method: POST
    path: "/quota-transfers/{id}/decline"
    description: "Decline the current offer (only the side that did not table it)"
    roles: [VesselOwner]
    code: 200
    input: []
    output: QuotaTransfer
    side_effects: ["status -> DECLINED", "increments QuotaTransfer.version by 1"]
  - method: POST
    path: "/quota-transfers/{id}/withdraw"
    description: "Withdraw your own tabled offer (only the last_offered_by side)"
    roles: [VesselOwner]
    code: 200
    input: []
    output: QuotaTransfer
    side_effects: ["status -> WITHDRAWN", "increments QuotaTransfer.version by 1"]
  - method: POST
    path: "/quota-transfers/{id}/settle"
    description: "Settle an ACCEPTED transfer; computes the tiered transfer fee"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: QuotaTransfer
    side_effects: ["status -> SETTLED", "transfer_fee_cents computed per transfer_fee_schedule", "increments QuotaTransfer.version by 1"]

  # --- Observer registry ---
  - method: POST
    path: "/observers"
    description: "Register an observer"
    roles: [ObserverCoordinator]
    code: 201
    input: [observer_name, certification_level, home_base]
    output: Observer
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/observers"
    description: "List observers"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Observer[]"
    side_effects: []
  - method: GET
    path: "/observers/{id}"
    description: "Get one observer"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: Observer
    side_effects: []

  # --- ObserverAssignment ---
  - method: GET
    path: "/observer-assignments"
    description: "List assignments (FK reverse reachability for trip_id and observer_id)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "trip_id?", "observer_id?", "status?"]
    output: "ObserverAssignment[]"
    side_effects: []
  - method: GET
    path: "/observer-assignments/{id}"
    description: "Get one assignment"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: ObserverAssignment
    side_effects: []
  - method: POST
    path: "/observer-assignments/{id}/assign"
    description: "Assign an observer to a REQUESTED assignment (OCC on observer version; 24h rest-buffer overlap rule)"
    roles: [ObserverCoordinator]
    code: 200
    input: [observer_id, coverage_from, coverage_to, expected_observer_version]
    output: ObserverAssignment
    side_effects: ["status -> ASSIGNED", "observer_id and coverage window set", "observer.status -> ON_ASSIGNMENT", "increments Observer.version by 1"]
  - method: POST
    path: "/observer-assignments/{id}/confirm"
    description: "Observer confirms their assignment"
    roles: [Observer]
    code: 200
    input: []
    output: ObserverAssignment
    side_effects: ["status -> CONFIRMED", "increments ObserverAssignment.version by 1"]
  - method: POST
    path: "/observer-assignments/{id}/debrief"
    description: "Observer debriefs after the trip has RETURNED"
    roles: [Observer]
    code: 200
    input: []
    output: ObserverAssignment
    side_effects: ["status -> DEBRIEFED", "observer.status recomputed", "increments ObserverAssignment.version by 1"]
  - method: POST
    path: "/observer-assignments/{id}/release"
    description: "Release a CONFIRMED assignment; auto-creates a fresh REQUESTED assignment when the trip still requires coverage"
    roles: [ObserverCoordinator]
    code: 200
    input: []
    output: ObserverAssignment
    side_effects: ["status -> RELEASED", "observer.status recomputed", "compensating re-request: new REQUESTED assignment auto-created when trip PLANNED and still observer_required and not waived", "increments ObserverAssignment.version by 1"]
  - method: POST
    path: "/observer-assignments/{id}/waive"
    description: "Regulator waives a REQUESTED assignment; sets trip.observer_waived"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: ObserverAssignment
    side_effects: ["status -> WAIVED", "trip.observer_waived = true", "increments ObserverAssignment.version by 1"]

  # --- CrewShareContract ---
  - method: POST
    path: "/vessels/{id}/crew-contracts"
    description: "Add a crew share contract (owner only, own vessel)"
    roles: [VesselOwner]
    code: 201
    input: [crew_name, share_points, joined_at]
    output: CrewShareContract
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/vessels/{id}/crew-contracts"
    description: "List crew contracts of a vessel"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CrewShareContract[]"
    side_effects: []
  - method: POST
    path: "/crew-contracts/{id}/deactivate"
    description: "Deactivate a crew contract (excluded from future settlement splits)"
    roles: [VesselOwner]
    code: 200
    input: []
    output: CrewShareContract
    side_effects: ["status -> INACTIVE", "increments CrewShareContract.version by 1"]

  # --- ExpenseRecord ---
  - method: POST
    path: "/fishing-trips/{id}/expenses"
    description: "Record a trip expense"
    roles: [Captain, VesselOwner]
    code: 201
    input: [category, amount_cents, incurred_at]
    output: ExpenseRecord
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/fishing-trips/{id}/expenses"
    description: "List expenses of a trip"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ExpenseRecord[]"
    side_effects: []
  - method: POST
    path: "/expenses/{id}/verify"
    description: "Verify a PENDING expense"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: ExpenseRecord
    side_effects: ["status -> VERIFIED", "increments ExpenseRecord.version by 1"]
  - method: POST
    path: "/expenses/{id}/reject"
    description: "Reject a PENDING expense"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: ExpenseRecord
    side_effects: ["status -> REJECTED", "increments ExpenseRecord.version by 1"]

  # --- TripSettlement ---
  - method: POST
    path: "/fishing-trips/{id}/settlement"
    description: "Create the trip's settlement in DRAFT (trip must be LANDING_FINALIZED); provisional variant computed immediately including PENDING expenses"
    roles: [SettlementClerk]
    code: 201
    input: [gross_revenue_cents]
    output: TripSettlement
    side_effects: ["status = DRAFT", "provisional_* fields computed via settlement_totals provisional variant"]
  - method: GET
    path: "/fishing-trips/{id}/settlement"
    description: "Get the settlement of a trip (array of 0 or 1)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: "TripSettlement[]"
    side_effects: []
  - method: GET
    path: "/trip-settlements/{id}"
    description: "Get one settlement"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: TripSettlement
    side_effects: []
  - method: POST
    path: "/trip-settlements/{id}/calculate"
    description: "Calculate final settlement from DRAFT (requires all expenses terminal, at least one ACTIVE crew contract, net_before_fee >= 0)"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: TripSettlement
    side_effects: ["status -> CALCULATED", "settlement_totals final variant + crew_pool_split populate all final fields and crew_payouts", "increments TripSettlement.version by 1"]
  - method: POST
    path: "/trip-settlements/{id}/recalculate"
    description: "Recalculate a DISPUTED settlement (OCC on settlement version)"
    roles: [SettlementClerk]
    code: 200
    input: [expected_settlement_version]
    output: TripSettlement
    side_effects: ["status -> CALCULATED", "recompute all final fields and crew_payouts", "increments TripSettlement.version by 1"]
  - method: POST
    path: "/trip-settlements/{id}/approve"
    description: "Vessel owner approves a CALCULATED settlement"
    roles: [VesselOwner]
    code: 200
    input: []
    output: TripSettlement
    side_effects: ["status -> APPROVED", "increments TripSettlement.version by 1"]
  - method: POST
    path: "/trip-settlements/{id}/dispute"
    description: "Crew member (ACTIVE contract on the trip's vessel) disputes a CALCULATED settlement"
    roles: [CrewMember]
    code: 200
    input: []
    output: TripSettlement
    side_effects: ["status -> DISPUTED", "increments TripSettlement.version by 1"]
  - method: POST
    path: "/trip-settlements/{id}/pay"
    description: "Pay an APPROVED settlement; bubbles the trip to SETTLED"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: TripSettlement
    side_effects: ["status -> PAID", "trip -> SETTLED", "increments TripSettlement.version by 1"]

  # --- GearAsset / GearEvent ---
  - method: POST
    path: "/vessels/{id}/gear-assets"
    description: "Register a gear asset (owner only, own vessel)"
    roles: [VesselOwner]
    code: 201
    input: [gear_type, units_total]
    output: GearAsset
    side_effects: ["units_lost = 0", "units_in_maintenance = 0", "units_operational = units_total", "status = OPERATIONAL"]
  - method: GET
    path: "/vessels/{id}/gear-assets"
    description: "List gear assets of a vessel"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "gear_type?"]
    output: "GearAsset[]"
    side_effects: []
  - method: GET
    path: "/gear-assets/{id}"
    description: "Get one gear asset"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: GearAsset
    side_effects: []
  - method: POST
    path: "/gear-assets/{id}/events"
    description: "Append a gear event (loss/repair/maintenance); replays gear_operational_units projection"
    roles: [VesselOwner, Captain]
    code: 201
    input: [event_type, units, occurred_at, "trip_id?"]
    output: GearEvent
    side_effects: ["recompute units_lost / units_in_maintenance / units_operational / status on the parent GearAsset"]
  - method: GET
    path: "/gear-assets/{id}/events"
    description: "List events of a gear asset (FK reverse reachability for GearEvent.gear_asset_id)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "GearEvent[]"
    side_effects: []
  - method: GET
    path: "/fishing-trips/{id}/gear-events"
    description: "List gear events attributed to a trip (FK reverse reachability for GearEvent.trip_id)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "GearEvent[]"
    side_effects: []

  # --- VMSPing ---
  - method: POST
    path: "/vessels/{id}/vms-pings"
    description: "Ingest a VMS position ping (captain relays transponder data)"
    roles: [Captain]
    code: 201
    input: [recorded_at, latitude, longitude]
    output: VMSPing
    side_effects: []
  - method: GET
    path: "/vessels/{id}/vms-pings"
    description: "List VMS pings of a vessel"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "VMSPing[]"
    side_effects: []

  # --- ComplianceViolation ---
  - method: POST
    path: "/violations"
    description: "Manually cite a vessel (regulator); system also creates VMS_GAP violations on trip return"
    roles: [FisheriesRegulator]
    code: 201
    input: [vessel_id, violation_type, details, "trip_id?"]
    output: ComplianceViolation
    side_effects: ["status = OPEN", "season_year = clock year"]
  - method: GET
    path: "/violations"
    description: "List violations (FK reverse reachability for vessel_id and trip_id)"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: ["limit?", "offset?", "vessel_id?", "trip_id?", "status?"]
    output: "ComplianceViolation[]"
    side_effects: []
  - method: GET
    path: "/violations/{id}"
    description: "Get one violation"
    roles: [VesselOwner, Captain, CrewMember, Observer, ObserverCoordinator, FisheriesRegulator, SettlementClerk]
    code: 200
    input: []
    output: ComplianceViolation
    side_effects: []
  - method: POST
    path: "/violations/{id}/adjudicate"
    description: "Adjudicate an OPEN violation; computes severity_points and deducts from vessel compliance_points; may suspend the vessel"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: ComplianceViolation
    side_effects: ["status -> ADJUDICATED", "severity_points computed", "vessel.compliance_points -= severity_points", "if < 50: vessel SUSPENDED cascade", "increments ComplianceViolation.version by 1"]
  - method: POST
    path: "/violations/{id}/dismiss"
    description: "Dismiss an OPEN violation (no penalty)"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: ComplianceViolation
    side_effects: ["status -> DISMISSED", "increments ComplianceViolation.version by 1"]
  - method: POST
    path: "/violations/{id}/appeal"
    description: "Vessel owner appeals an ADJUDICATED violation"
    roles: [VesselOwner]
    code: 200
    input: []
    output: ComplianceViolation
    side_effects: ["status -> APPEALED", "increments ComplianceViolation.version by 1"]
  - method: POST
    path: "/violations/{id}/reverse"
    description: "Uphold an appeal: refund severity_points to the vessel (does not auto-lift suspension)"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: ComplianceViolation
    side_effects: ["status -> REVERSED", "vessel.compliance_points += severity_points", "increments ComplianceViolation.version by 1"]
  - method: POST
    path: "/violations/{id}/uphold"
    description: "Deny an appeal: penalty stands"
    roles: [FisheriesRegulator]
    code: 200
    input: []
    output: ComplianceViolation
    side_effects: ["status -> UPHELD", "increments ComplianceViolation.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (48 errors)
# =============================================================================
errors:
  # auth & roles
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not allowed on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "role allowed but X-User-ID fails the ownership check (wrong vessel, wrong observer, wrong crew contract)" }
  # existence (404)
  - { id: ERR_VESSEL_NOT_FOUND, http: 404, condition: "vessel id in path or body does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permit id does not exist" }
  - { id: ERR_QUOTA_HOLDING_NOT_FOUND, http: 404, condition: "quota holding id does not exist, or no holding matches a required fishery_code+season_year for a vessel" }
  - { id: ERR_SEASON_OPENING_NOT_FOUND, http: 404, condition: "season opening id does not exist" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "fishing trip id does not exist" }
  - { id: ERR_LANDING_DECLARATION_NOT_FOUND, http: 404, condition: "landing declaration id does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "quota transfer id does not exist" }
  - { id: ERR_OBSERVER_NOT_FOUND, http: 404, condition: "observer id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "observer assignment id does not exist" }
  - { id: ERR_CREW_CONTRACT_NOT_FOUND, http: 404, condition: "crew share contract id does not exist" }
  - { id: ERR_EXPENSE_NOT_FOUND, http: 404, condition: "expense record id does not exist" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "trip settlement id does not exist" }
  - { id: ERR_GEAR_ASSET_NOT_FOUND, http: 404, condition: "gear asset id does not exist" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "compliance violation id does not exist" }
  # request shape (400)
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, invalid enum value, or non-positive amount/quantity" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "end not after start (valid_to <= valid_from, closes_at <= opens_at, planned_return <= planned_departure, coverage_to <= coverage_from)" }
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "POST /_clock/set_current_utc with to_iso8601 <= current logical clock" }
  # OCC (412)
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version" }
  # state (409)
  - { id: ERR_VESSEL_NOT_ACTIVE, http: 409, condition: "vessel not in the required state (activate requires REGISTERED; reinstate requires SUSPENDED; trip creation/depart require ACTIVE)" }
  - { id: ERR_COMPLIANCE_TOO_LOW, http: 409, condition: "reinstate requires compliance_points >= 50" }
  - { id: ERR_VESSEL_HAS_OPEN_TRIPS, http: 409, condition: "decommission requires no trips in PLANNED, DEPARTED, RETURNED, or LANDING_FINALIZED" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "permit required for this fishery is missing, SUSPENDED, REVOKED, or EXPIRED" }
  - { id: ERR_OPENING_NOT_OPEN, http: 409, condition: "close-early requires opening in OPEN" }
  - { id: ERR_TRIP_NOT_PLANNED, http: 409, condition: "operation requires trip in PLANNED" }
  - { id: ERR_TRIP_NOT_DEPARTED, http: 409, condition: "operation requires trip in DEPARTED" }
  - { id: ERR_TRIP_NOT_RETURNED, http: 409, condition: "operation requires trip in RETURNED (or later where specified)" }
  - { id: ERR_TRIP_NOT_LANDING_FINALIZED, http: 409, condition: "settlement creation requires trip in LANDING_FINALIZED" }
  - { id: ERR_DECLARATION_EXISTS, http: 409, condition: "a landing declaration already exists for this trip" }
  - { id: ERR_DECLARATION_NOT_SUBMITTED, http: 409, condition: "verify requires SUBMITTED; submit requires DRAFT or AMENDED" }
  - { id: ERR_DECLARATION_NOT_DISPUTED, http: 409, condition: "amend requires DISPUTED" }
  - { id: ERR_DECLARATION_NOT_VERIFIED, http: 409, condition: "finalize requires VERIFIED" }
  - { id: ERR_TRANSFER_NOT_OPEN, http: 409, condition: "counter/accept/decline/withdraw require PROPOSED or COUNTERED" }
  - { id: ERR_TRANSFER_NOT_ACCEPTED, http: 409, condition: "settle requires ACCEPTED" }
  - { id: ERR_TRANSFER_OWN_OFFER, http: 409, condition: "accept/decline must come from the side that did not table the current offer; withdraw must come from the side that did" }
  - { id: ERR_ASSIGNMENT_NOT_REQUESTED, http: 409, condition: "assign/waive require REQUESTED" }
  - { id: ERR_ASSIGNMENT_NOT_ASSIGNED, http: 409, condition: "confirm requires ASSIGNED" }
  - { id: ERR_ASSIGNMENT_NOT_DEPLOYED, http: 409, condition: "debrief requires DEPLOYED" }
  - { id: ERR_ASSIGNMENT_NOT_CONFIRMABLE, http: 409, condition: "release requires CONFIRMED" }
  - { id: ERR_EXPENSE_NOT_PENDING, http: 409, condition: "verify/reject require PENDING" }
  - { id: ERR_EXPENSES_UNRESOLVED, http: 409, condition: "calculate/recalculate require every expense of the trip in VERIFIED or REJECTED" }
  - { id: ERR_SETTLEMENT_EXISTS, http: 409, condition: "a settlement already exists for this trip" }
  - { id: ERR_SETTLEMENT_NOT_DRAFT, http: 409, condition: "calculate requires DRAFT" }
  - { id: ERR_SETTLEMENT_NOT_CALCULATED, http: 409, condition: "approve/dispute require CALCULATED" }
  - { id: ERR_SETTLEMENT_NOT_DISPUTED, http: 409, condition: "recalculate requires DISPUTED" }
  - { id: ERR_SETTLEMENT_NOT_APPROVED, http: 409, condition: "pay requires APPROVED" }
  - { id: ERR_VIOLATION_NOT_OPEN, http: 409, condition: "adjudicate/dismiss require OPEN" }
  - { id: ERR_VIOLATION_NOT_ADJUDICATED, http: 409, condition: "appeal requires ADJUDICATED" }
  - { id: ERR_VIOLATION_NOT_APPEALED, http: 409, condition: "reverse/uphold require APPEALED" }
  # business_safety
  - { id: ERR_OBSERVER_COVERAGE_MISSING, http: 409, condition: "depart requires a CONFIRMED observer assignment or a waiver when observer_required" }
  - { id: ERR_OBSERVER_NOT_DEBRIEFED, http: 409, condition: "landing verify requires a DEBRIEFED assignment or waiver when observer_required" }
  - { id: ERR_GEAR_SHORTAGE, http: 409, condition: "operational units of a required gear type below the trip's gear_requirements at depart" }
  - { id: ERR_OBSERVER_CERT_INSUFFICIENT, http: 422, condition: "observer certification level below the vessel's coverage-class requirement" }
  # business_temporal (409)
  - { id: ERR_OUTSIDE_OPENING_WINDOW, http: 409, condition: "planned window not contained in [opens_at, closes_at], or depart attempted while the opening is not OPEN / clock outside the window" }
  - { id: ERR_OPENING_WINDOW_OVERLAP, http: 409, condition: "opening window overlaps another opening with the same fishery_code+area_code (closed-interval semantics: touching counts as overlap)" }
  - { id: ERR_TRIP_WINDOW_OVERLAP, http: 409, condition: "trip window overlaps another non-CANCELLED trip of the same vessel (half-open semantics: back-to-back allowed)" }
  - { id: ERR_OBSERVER_DOUBLE_BOOKED, http: 409, condition: "assignment coverage collides with the observer's existing ASSIGNED/CONFIRMED/DEPLOYED coverage including a 24h rest buffer after each assignment" }
  # business_constraint
  - { id: ERR_SELF_TRANSFER, http: 422, condition: "from_vessel_id == to_vessel_id" }
  - { id: ERR_DUPLICATE_HOLDING, http: 409, condition: "a holding already exists for this vessel+fishery_code+season_year" }
  - { id: ERR_DUPLICATE_LICENSE, http: 409, condition: "license_number already registered" }
  - { id: ERR_INVALID_GEAR_EVENT, http: 422, condition: "MAINTENANCE_START exceeds units_operational, or MAINTENANCE_END exceeds units_in_maintenance" }
  - { id: ERR_NO_ACTIVE_CREW, http: 422, condition: "calculate requires at least one ACTIVE crew share contract on the vessel" }
  # business_fiscal
  - { id: ERR_QUOTA_EXCEEDED, http: 402, condition: "transfer exceeds available_conservative_pounds, or a verified landing line exceeds available_committed_pounds" }
  - { id: ERR_SETTLEMENT_UNDERWATER, http: 422, condition: "net_before_fee < 0 at calculate/recalculate" }

# =============================================================================
# §1.7 RBAC Matrix (7 roles)
# =============================================================================
roles:
  - name: VesselOwner
    description: "Owns and administers a vessel: permits context, quota holdings, transfers (both sides), trips planning, gear, crew contracts, settlement approval, violation appeals"
    identity: "entity_backed:Vessel"
    exclusive_operations:
      - "POST /quota-transfers — propose a lease (from_vessel_id must equal X-User-ID)"
      - "POST /quota-transfers/{id}/counter|accept|decline|withdraw — negotiation moves (ownership = the vessel side making the move)"
      - "POST /vessels/{id}/crew-contracts and /crew-contracts/{id}/deactivate"
      - "POST /vessels/{id}/gear-assets"
      - "POST /trip-settlements/{id}/approve"
      - "POST /violations/{id}/appeal"
    shared_operations:
      - "POST /fishing-trips, PATCH /fishing-trips/{id}, POST /fishing-trips/{id}/cancel (shared with Captain)"
      - "POST /fishing-trips/{id}/expenses (shared with Captain)"
      - "POST /gear-assets/{id}/events (shared with Captain)"
      - "all GET endpoints"
  - name: Captain
    description: "Operates the vessel at sea: depart/return, catch reports, landing declarations, expenses, VMS pings"
    identity: "entity_backed:Vessel"
    exclusive_operations:
      - "POST /fishing-trips/{id}/depart and /return"
      - "POST /fishing-trips/{id}/catch-reports"
      - "POST /fishing-trips/{id}/landing-declarations, /landing-declarations/{id}/submit, /landing-declarations/{id}/amend"
      - "POST /vessels/{id}/vms-pings"
    shared_operations:
      - "POST /fishing-trips, PATCH /fishing-trips/{id}, POST /fishing-trips/{id}/cancel (shared with VesselOwner)"
      - "POST /fishing-trips/{id}/expenses (shared with VesselOwner)"
      - "POST /gear-assets/{id}/events (shared with VesselOwner)"
      - "all GET endpoints"
  - name: CrewMember
    description: "Crew share contract holder; may dispute a calculated settlement"
    identity: "entity_backed:CrewShareContract"
    exclusive_operations:
      - "POST /trip-settlements/{id}/dispute (X-User-ID must be an ACTIVE CrewShareContract id on the trip's vessel)"
    shared_operations:
      - "all GET endpoints"
  - name: Observer
    description: "Certified fisheries observer; confirms and debriefs own assignments"
    identity: "entity_backed:Observer"
    exclusive_operations:
      - "POST /observer-assignments/{id}/confirm and /debrief (X-User-ID must equal assignment.observer_id)"
    shared_operations:
      - "all GET endpoints"
  - name: ObserverCoordinator
    description: "Schedules observer coverage; maintains the observer registry"
    identity: "opaque"
    exclusive_operations:
      - "POST /observers"
      - "POST /observer-assignments/{id}/assign and /release"
    shared_operations:
      - "all GET endpoints"
  - name: FisheriesRegulator
    description: "Regulator: registers vessels, issues permits and quota, manages openings, verifies/finalizes landings, waives observer coverage, adjudicates violations, drives the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /vessels, /vessels/{id}/activate, /reinstate, /decommission"
      - "POST /vessels/{id}/permits and /permits/{id}/revoke"
      - "POST /vessels/{id}/quota-holdings"
      - "POST /season-openings and /season-openings/{id}/close-early"
      - "POST /landing-declarations/{id}/verify and /finalize"
      - "POST /observer-assignments/{id}/waive"
      - "POST /violations and /violations/{id}/adjudicate, /dismiss, /reverse, /uphold"
    shared_operations:
      - "all GET endpoints"
  - name: SettlementClerk
    description: "Back-office settlement processor; segregated from the vessel owner who approves"
    identity: "opaque"
    exclusive_operations:
      - "POST /expenses/{id}/verify and /reject"
      - "POST /fishing-trips/{id}/settlement"
      - "POST /trip-settlements/{id}/calculate, /recalculate, /pay"
      - "POST /quota-transfers/{id}/settle"
    shared_operations:
      - "all GET endpoints"
