            - call: "POST /deviations/${dev_id}/classify"
              payload: { classification: "CRITICAL", classification_rationale: "Potential sterility impact." }
              as: QaReviewer
              as_user_id: "qa-001"
            - call: "POST /deviations/${dev_id}/submit-capa"
              payload: { capa_summary: "HVAC balancing repeated and requalified." }
              as: QaReviewer
              as_user_id: "qa-001"
            - call: "POST /deviations/${dev_id}/decide-capa"
              payload: { outcome: "APPROVED", decision_note: "Effectiveness check accepted." }
              as: QaReviewer
              as_user_id: "qa-002"
          trigger:
            - call: "POST /client-projects/${proj_id}/release-hold"
              payload: { release_rationale: "CRITICAL deviation closed with an approved CAPA." }
              as: QaReviewer
              as_user_id: "qa-002"
          assert:
            - "before the trigger: ClientProject.${proj_id}.status == ON_HOLD, BatchOrder.${batch_id}.production_status == SUSPENDED and quality_status == QUARANTINED, FillingSuite.${suite_id}.committed_minutes == 0, ClientProject.${proj_id}.committed_demand_units == 0"
            - "HTTP status == 200 or 201"
            - "ClientProject.${proj_id}.status == ACTIVE"
            - "BatchOrder.${batch_id}.production_status == SCHEDULED"
            - "BatchOrder.${batch_id}.quality_status == QUARANTINED — the quality axis is not restored by release-hold"
            - "FillingSuite.${suite_id}.committed_minutes == 540"
            - "ClientProject.${proj_id}.committed_demand_units == 21560"
            - "ClientProject.${proj_id}.open_deviation_risk_total == 0 and Deviation.${dev_id}.status == CLOSED"

      - name: conditional_cascade_of_a_media_fill_failure_across_five_levels
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: media_fill_failure_five_level_freeze_and_component_restoration
          rationale: "The §1.8 transitive_cascade instance already drives the FAILED readout through aseptic INVALIDATED -> posture FROZEN -> batch SUSPENDED/QUARANTINED -> reservation RELEASED with released_reason SUITE_FREEZE_SUSPENSION -> lot EXHAUSTED -> RELEASED, and asserts that only non-terminal children are touched."

      - name: cyclic_deviation_capa_loop_reentry
        claim_type: cyclic_shape
        excluded_because:
          difficulty_instance: deviation_capa_rejection_cycle_escalates_risk_on_reentry
          rationale: "The §1.8 non_linear_state_machine instance already loops CAPA_PENDING -> UNDER_INVESTIGATION -> CAPA_PENDING and asserts that re-entering the same state yields a strictly higher risk_score, which is the loop-count claim for this shape."

      - name: parallel_axes_change_independently_on_the_batch_order
        claim_type: parallel_shape
        excluded_because:
          difficulty_instance: batch_quality_axis_leaves_quarantine_while_production_axis_stays_filled
          rationale: "The §1.8 non_linear_state_machine instance already asserts that the quality axis moves QUARANTINED -> BR_REVIEW while the production axis remains FILLED, which is the independence claim for parallel state dimensions."

      - name: compensation_reverses_every_side_effect_of_a_cancelled_batch
        claim_type: compensation
        excluded_because:
          difficulty_instance: batch_cancellation_restores_component_unit_ledger_exactly
          rationale: "The §1.8 compensating_invariant instance already asserts that cancellation reverses the reservation, lot-status, committed_minutes and committed_demand_units effects exactly, with no drift."

      - name: guarded_transition_start_fill_requires_open_suite_posture
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: start_fill_blocked_by_derived_suite_posture_until_excursion_investigation_closes
          rationale: "The §1.8 cross_entity_state_dependency instance already asserts that SETUP -> FILLING is gated on a derived property of another entity (the suite's posture) and that only closing the excursion investigation unblocks it."

  - section: calculations
    instances:

      - name: em_grade_a_single_colony_is_action_and_the_core_term_saturates_at_one_hundred
        claim_type: correct_result
        grounds:
          - calculations.em_sample_limits
          - calculations.em_sample_classification
          - calculations.em_excursion_risk_index
        distinguishing_aspect: "Grade A has alert == action == 1, so cfu 0 is WITHIN_LIMIT with risk 0 while cfu 1 is an ACTION excursion (never merely ALERT) scoring round_half_up(min(100, 1/1 * 20 * 3.0)) = 60; a PERSONNEL_GLOVE row at cfu 2 shows the inner cap and the surcharge composing to min(150, 100 + 25) = 125 rather than 120 + 25."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FillingSuite FS-A of grade A with no media fill, no cleaning validation and no qualified operators."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-A", grade: "A", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_a_id: $.data.id }
          trigger:
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_a_id}", sample_type: "VIABLE_AIR", cfu_count: 0 }
              as: MicrobiologyAnalyst
              captures: { s0_id: $.data.id }
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_a_id}", sample_type: "VIABLE_AIR", cfu_count: 1 }
              as: MicrobiologyAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_a_id}", sample_type: "PERSONNEL_GLOVE", cfu_count: 2 }
              as: MicrobiologyAnalyst
              captures: { s2_id: $.data.id }
          assert:
            - "EmSample.${s0_id}.alert_limit == 1 and action_limit == 1 and classification == WITHIN_LIMIT and risk_index == 0 and investigation_status == NOT_REQUIRED"
            - "EmSample.${s1_id}.classification == ACTION and risk_index == 60 and investigation_status == OPEN"
            - "EmSample.${s2_id}.alert_limit == 1 and action_limit == 1 and classification == ACTION and risk_index == 125"
            - "FillingSuite.${suite_a_id}.open_action_excursion_count == 2"

      - name: em_alert_excursion_is_excluded_from_the_open_action_excursion_count
        claim_type: input_set_filtering
        grounds:
          - calculations.em_excursion_risk_index
          - calculations.suite_posture
          - entities.FillingSuite.fields.open_action_excursion_count
        distinguishing_aspect: "open_action_excursion_count counts only samples whose classification is ACTION, so a grade B VIABLE_AIR sample at cfu 7 (alert 5, action 10) is an ALERT with risk_index round_half_up(0.7 * 20 * 2.0) = 28 and an OPEN investigation, yet the count stays 0 and the suite's posture remains OPEN — an alert does not restrict the suite."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; FS-1 grade B QUALIFIED, cleaning validated for MOL-A, OP-A and OP-B QUALIFIED, media_fill_valid_until 2027-03-03, posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
