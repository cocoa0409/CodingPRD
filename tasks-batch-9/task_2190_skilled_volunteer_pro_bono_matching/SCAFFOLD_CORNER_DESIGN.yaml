            - "GET /scope-definitions/${scope_id} shows status == \"WITHDRAWN\""

      - name: sm_partner_suspended_terminal_cannot_return_to_active
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PartnerOrg.terminal_states, "endpoints[PATCH /partner-orgs/{id}/status]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "SUSPENDED is the only terminal PartnerOrg state and no transition leaves it, so a reinstatement PATCH is rejected at priority 17 and suspended_at is not cleared."
        test_recipe:
          setup: ["One PartnerOrg already moved to SUSPENDED."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "PATCH /partner-orgs/${partner_id}/status", as: ProgramManager, as_user_id: "pm-1", payload: {to_status: "SUSPENDED"}}
          trigger:
            - {call: "PATCH /partner-orgs/${partner_id}/status", as: ProgramManager, as_user_id: "pm-1", payload: {to_status: "ACTIVE"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""
            - "GET /partner-orgs/${partner_id} still shows status == \"SUSPENDED\" with suspended_at == \"2026-08-01T00:00:00Z\""

      - name: sm_request_draft_to_scoping_on_submit_for_scoping
        claim_type: valid_transition
        grounds: [state_machines.ProjectRequest.transitions.DRAFT_to_SCOPING, "endpoints[POST /project-requests/{id}/submit-for-scoping]"]
        distinguishing_aspect: "The initial state DRAFT advances to SCOPING and the request's version increments to 2, which is the value the very next scope-revision write must echo in expected_project_request_version."
        test_recipe:
          setup: ["One partner, one cycle, one DRAFT request."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
          trigger:
            - {call: "POST /project-requests/${req_id}/submit-for-scoping", as: PartnerContact, as_user_id: "${partner_id}"}
          assert:
            - "HTTP 200"
            - "data.status == \"SCOPING\""
            - "data.version == 2"
            - "data.active_scope_revision_no == 0"
            - "data.closed_at == null"

      - name: sm_request_terminal_abandoned_cannot_be_submitted_for_scoping
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProjectRequest.terminal_states, "validations[priority=20]", "errors[ERR_INVALID_REQUEST_STATE]"]
        distinguishing_aspect: "ABANDONED is terminal, so submit-for-scoping answers ERR_INVALID_REQUEST_STATE (409) and closed_at keeps its original stamp instead of being re-opened."
        test_recipe:
          setup: ["One DRAFT request already abandoned."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
            - {call: "POST /project-requests/${req_id}/abandon", as: ProgramManager, as_user_id: "pm-1", payload: {reason: "Partner withdrew the ask before scoping."}}
          trigger:
            - {call: "POST /project-requests/${req_id}/submit-for-scoping", as: PartnerContact, as_user_id: "${partner_id}", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_INVALID_REQUEST_STATE\""
            - "GET /project-requests/${req_id} still shows status == \"ABANDONED\" and closed_at == \"2026-08-01T00:00:00Z\""

      - name: sm_request_draft_to_abandoned_withdraws_open_draft_revision
        claim_type: side_effect_execution
        grounds: [state_machines.ProjectRequest.transitions.SCOPING_to_ABANDONED, state_machines.ScopeDefinition.transitions.DRAFT_to_WITHDRAWN, "endpoints[POST /project-requests/{id}/abandon]"]
        distinguishing_aspect: "Abandoning a SCOPING request drags its still-DRAFT revision to WITHDRAWN (not SUPERSEDED), and no cycle capacity moves because nothing was ever reserved."
        test_recipe:
          setup: ["One SCOPING request carrying one DRAFT ScopeDefinition with no deliverables."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
            - {call: "POST /project-requests/${req_id}/submit-for-scoping", as: PartnerContact, as_user_id: "${partner_id}", captures: {req_v: "$.data.version"}}
            - {call: "POST /project-requests/${req_id}/scope-definitions", as: ScopingSpecialist, as_user_id: "spec-1", payload: {expected_project_request_version: "${req_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: STANDARD, ip_disposition: ASSIGN_TO_PARTNER}, captures: {scope_id: "$.data.id"}}
          trigger:
            - {call: "POST /project-requests/${req_id}/abandon", as: ProgramManager, as_user_id: "pm-1", payload: {reason: "Board deferred the engagement."}}
          assert:
