            - "call 4: HTTP 200 with the same body for the opaque LeagueDataOps role (no ownership dimension)"
            - "GET /feed-sessions?licensee_id=${lic_b} as LeagueDataOps returns pagination.total_count 0; GET /licensees/${lic_b} shows reserved_units 0 and available_units 1000"

      - name: segregation_of_duties_blocks_self_certification_and_self_review
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=30]
          - entities.TrackingInstallation.fields.latest_run_engineer_user_id
          - entities.EventTag.fields.tagged_by_user_id
          - entities.CorrectionRequest.fields.submitted_by_user_id
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          All three counterparty checkpoints in one run, each attempted by a user holding the correct role
          and refused only because the X-User-ID matches the recorded counterparty: certifying RIG-B as
          user eng-01 who signed its PASS run, accepting a tag as user stat-01 who authored it, and
          resolving a correction as user stat-01 who filed it. A different user id in the same role
          succeeds immediately afterwards in every case, so the refusals cannot be state artefacts. RIG-A
          is certified by ops-01 first so the venue posture never blocks the game workflow.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor Arena requires 1 certified installation"
            - "RIG-A: PASS run by eng-01, certified by ops-01 (venue CERTIFIED); RIG-B: PASS run by eng-01, still VALIDATED"
            - "game LIVE; player Ada Ruiz on the home club"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
