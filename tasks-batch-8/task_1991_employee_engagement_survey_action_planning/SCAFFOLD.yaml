scenario: |
  1991. Employee Engagement Survey & Action Planning (HR people analytics team): survey instrument & item bank selection, sampling/census & confidentiality threshold for reporting, response rate campaign & reminder cadence, result distribution by manager unit with minimum-n suppression, action plan creation & progress tracking, pulse survey cadence between census surveys, linkage to attrition/performance outcomes, executive reporting & benchmark comparison

domain_name: "engagement-survey"
api_prefix: "/engagement"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ItemBank
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable bank label", constraints: "non-empty, unique per tenant" }
      - { name: framework, type: enum, source: input, description: "Question framework family", constraints: "one of {EWI, Q12, CUSTOM}" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: DRAFT, constraints: "one of {DRAFT, ACTIVE, RETIRED}" }

  - name: SurveyItem
    parent: ItemBank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: input, description: "FK -> ItemBank.id; owning item bank" }
      - { name: item_code, type: string, source: input, description: "Stable code within bank, e.g. EWI-01", constraints: "unique within bank_id" }
      - { name: dimension, type: enum, source: input, description: "Engagement dimension", constraints: "one of {PURPOSE, GROWTH, MANAGER_SUPPORT, BELONGING, WORKLOAD, RECOGNITION}" }
      - { name: weight, type: number, source: input, description: "Scoring weight; positive decimal with exactly 1 fractional digit", constraints: "0.1 <= weight <= 5.0, 1 decimal place" }
      - { name: has_free_text, type: boolean, source: input, description: "Whether item carries a verbatim comment", default: false }
      - { name: status, type: enum, source: system, description: "Item lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, RETIRED}" }

  - name: OrgUnit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Unit label" }
      - { name: parent_unit_id, type: string, source: input, description: "FK -> OrgUnit.id; parent unit, null for root", constraints: "must not create a cycle; null only on root" }
      - { name: manager_user_id, type: string, source: input, description: "X-User-ID of the UnitManager who owns this unit's reports" }
      - { name: min_n_threshold, type: integer, source: input, description: "Minimum submitted-response count for numeric rollup visibility", default: 5, constraints: "3 <= min_n_threshold <= 20" }
      - { name: verbatim_n_threshold, type: integer, source: input, description: "Minimum submitted-response count for verbatim comment visibility", default: 10, constraints: "verbatim_n_threshold >= min_n_threshold" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: external_ref, type: string, source: input, description: "HRIS reference, unique", constraints: "unique" }
      - { name: unit_id, type: string, source: input, description: "FK -> OrgUnit.id; employee's current unit" }
      - { name: employment_status, type: enum, source: input, description: "Roster state", constraints: "one of {ACTIVE, LEAVE, TERMINATED}" }
      - { name: hired_at, type: datetime, source: input, description: "Hire timestamp; tenure gate for census eligibility" }
      - { name: exited_at, type: datetime, source: input, description: "Exit timestamp; set when employment_status becomes TERMINATED", default: null }

  - name: SurveyCycle
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Cycle label, e.g. '2026 Census'" }
      - { name: cycle_kind, type: enum, source: input, description: "Census covers full eligible population; Pulse covers a sample", constraints: "one of {CENSUS, PULSE}" }
      - { name: bank_id, type: string, source: input, description: "FK -> ItemBank.id; instrument source" }
      - { name: opens_at, type: datetime, source: input, description: "Window open (inclusive)" }
      - { name: closes_at, type: datetime, source: input, description: "Window close (exclusive); closes_at > opens_at" }
      - { name: status, type: enum, source: system, description: "Cycle lifecycle", default: DRAFT, constraints: "one of {DRAFT, CONFIGURED, OPEN, CLOSED, SCORING, REPORTED, ARCHIVED}" }
      - { name: min_n_default, type: integer, source: input, description: "Cycle-wide minimum-n applied when unit does not override", default: 5, constraints: "3 <= min_n_default <= 20" }
      - { name: sampling_ratio, type: number, source: input, description: "Fraction of eligible population invited for PULSE cycles; 1.0 for CENSUS", default: 1.0, constraints: "0 < sampling_ratio <= 1.0, 2 decimal places" }
      - { name: invited_count, type: integer, source: computed, description: "Derived count of SurveyInvite rows in {INVITED, REMINDED, SUBMITTED, PARTIAL}" }
      - { name: submitted_count, type: integer, source: computed, description: "Derived count of SurveyInvite rows in SUBMITTED" }
      - { name: partial_count, type: integer, source: computed, description: "Derived count of SurveyInvite rows in PARTIAL" }
      - { name: response_rate, type: number, source: computed, description: "Derived per response_rate calculation; 4 decimal places" }
      - { name: attrition_risk, type: number, source: computed, description: "Derived per attrition_risk_index; provisional variant computed at SCORING, final variant once OutcomeLinkage rows exist; null before SCORING", default: null }

  - name: CycleItem
    parent: SurveyCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id; owning cycle" }
      - { name: item_id, type: string, source: input, description: "FK -> SurveyItem.id; pinned item" }
      - { name: pinned_weight, type: number, source: input, description: "Weight snapshot at selection time; immune to later SurveyItem edits", constraints: "copied from SurveyItem.weight at creation" }
      - { name: display_order, type: integer, source: input, description: "Presentation order within cycle, 1-based, unique within cycle" }

  - name: SurveyInvite
    parent: SurveyCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: unit_id_at_invite, type: string, source: input, description: "FK -> OrgUnit.id; unit snapshot at invite time for rollup attribution" }
      - { name: status, type: enum, source: system, description: "Invite lifecycle", default: INVITED, constraints: "one of {INVITED, REMINDED, SUBMITTED, PARTIAL, EXPIRED}" }
      - { name: reminder_count, type: integer, source: system, description: "Number of reminders sent", default: 0 }
      - { name: last_reminded_at, type: datetime, source: system, description: "Timestamp of most recent reminder", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of final submission", default: null }

  - name: SurveyResponse
    parent: SurveyInvite
    common_fields: false
    fields:
      - { name: invite_id, type: string, source: input, description: "FK -> SurveyInvite.id; one response row set per invite", constraints: "unique per invite_id" }
      - { name: answers, type: array, source: input, description: "List of {cycle_item_id, score (integer 1..5), comment (string, optional)}; must cover every CycleItem of the cycle" }
      - { name: is_partial, type: boolean, source: system, description: "True when submitted with at least one unanswered item but window still open", default: false }

  - name: ReportSnapshot
    parent: SurveyCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> OrgUnit.id; rollup unit" }
      - { name: scope, type: enum, source: input, description: "DIRECT = unit's own invitees only; SUBTREE = unit plus all descendant units", constraints: "one of {DIRECT, SUBTREE}" }
      - { name: submitted_n, type: integer, source: computed, description: "Submitted invite count attributed to this scope" }
      - { name: dimension_scores, type: object, source: computed, description: "Map of dimension -> weighted score (2dp); empty object when suppressed" }
      - { name: overall_score, type: number, source: computed, description: "Weighted overall engagement score (2dp); null when suppressed" }
      - { name: benchmark_percentile, type: number, source: computed, description: "Percentile vs linked BenchmarkSet (2dp); null when suppressed or no benchmark" }
      - { name: numeric_suppressed, type: boolean, source: computed, description: "True when submitted_n < effective min_n", default: false }
      - { name: verbatim_suppressed, type: boolean, source: computed, description: "True when submitted_n < effective verbatim_n", default: false }
      - { name: generation, type: integer, source: system, description: "Recompute generation; increments on each recompute", default: 1 }

  - name: BenchmarkSet
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Benchmark label, e.g. 'Tech Industry 2026'" }
      - { name: dimension_scores, type: array, source: input, description: "Distribution of reference overall scores (numbers, 2dp); used for percentile rank", constraints: "at least 5 entries, each 0..100" }
      - { name: status, type: enum, source: system, description: "Availability", default: ACTIVE, constraints: "one of {ACTIVE, RETIRED}" }

  - name: ActionPlan
    parent: SurveyCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> OrgUnit.id; plan owner unit" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: focus_dimension, type: enum, source: input, description: "Dimension the plan targets", constraints: "one of {PURPOSE, GROWTH, MANAGER_SUPPORT, BELONGING, WORKLOAD, RECOGNITION}" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", default: DRAFT, constraints: "one of {DRAFT, SUBMITTED, APPROVED, IN_PROGRESS, COMPLETED, REJECTED, ABANDONED}" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of submission", default: null }
      - { name: due_at, type: datetime, source: input, description: "Completion deadline; must be after cycle.closes_at" }
      - { name: progress_pct, type: integer, source: computed, description: "Derived 0..100 from child ActionItem states" }
      - { name: rejection_reason, type: string, source: input, description: "Reviewer note on rejection", default: null }

  - name: ActionItem
    parent: ActionPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> ActionPlan.id" }
      - { name: description, type: string, source: input, description: "Milestone text" }
      - { name: owner_user_id, type: string, source: input, description: "X-User-ID of accountable owner" }
      - { name: status, type: enum, source: system, description: "Milestone lifecycle", default: OPEN, constraints: "one of {OPEN, DONE, DROPPED}" }
      - { name: target_at, type: datetime, source: input, description: "Milestone target date; must be <= plan.due_at" }

  - name: OutcomeLinkage
    parent: Employee
    common_fields: false
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: cycle_id, type: string, source: input, description: "FK -> SurveyCycle.id; the census cycle this linkage evaluates" }
      - { name: outcome_kind, type: enum, source: input, description: "Outcome family", constraints: "one of {ATTRITION, PERFORMANCE}" }
      - { name: outcome_value, type: string, source: input, description: "ATTRITION: one of {VOLUNTARY, INVOLUNTARY, NONE}; PERFORMANCE: one of {BELOW, MEETS, EXCEEDS}" }
      - { name: recorded_at, type: datetime, source: system, description: "When the linkage row was recorded", default: "system now" }

  - name: ReminderEvent
    parent: SurveyInvite
    common_fields: false
    fields:
      - { name: invite_id, type: string, source: input, description: "FK -> SurveyInvite.id" }
      - { name: sent_at, type: datetime, source: system, description: "Dispatch timestamp" }
      - { name: sequence_no, type: integer, source: system, description: "1-based reminder ordinal for this invite" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BenchmarkSet
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /engagement/benchmark-sets/{id}/retire"
        actor: PeopleAnalyst
        preconditions: []
        side_effects:
          - "increments BenchmarkSet.version by 1"

  - entity: ItemBank
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /engagement/item-banks/{id}/activate"
        actor: HRAdmin
        preconditions:
          - "bank has at least 3 SurveyItem rows with status=ACTIVE"
        side_effects:
          - "increments ItemBank.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /engagement/item-banks/{id}/retire"
        actor: HRAdmin
        preconditions:
          - "no SurveyCycle with bank_id == this bank in status {CONFIGURED, OPEN, SCORING}"
        side_effects:
          - "SurveyItem rows with bank_id == this bank and status=ACTIVE flip to RETIRED"
          - "increments ItemBank.version by 1"

  - entity: SurveyCycle
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: CONFIGURED
        trigger: "POST /engagement/survey-cycles/{id}/configure"
        actor: HRAdmin
        preconditions:
          - "cycle has at least 3 CycleItem rows"
          - "closes_at > opens_at"
          - "linked ItemBank.status == ACTIVE"
        side_effects:
          - "increments SurveyCycle.version by 1"
      - from: CONFIGURED
        to: OPEN
        trigger: "POST /engagement/survey-cycles/{id}/open"
        actor: HRAdmin
        preconditions:
          - "logical clock >= opens_at"
          - "no other SurveyCycle with status == OPEN (single-open invariant)"
        side_effects:
          - "eligibility sweep creates SurveyInvite rows (status=INVITED) per sampling_ratio calculation"
          - "SurveyCycle.invited_count recomputed"
          - "increments SurveyCycle.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /engagement/survey-cycles/{id}/close OR system auto-close at closes_at"
        actor: HRAdmin | system
        preconditions:
          - "logical clock >= closes_at for system path; HRAdmin path allowed at any time after open"
        side_effects:
          - "SurveyInvite rows in {INVITED, REMINDED} flip to EXPIRED"
          - "SurveyInvite rows in PARTIAL stay PARTIAL (counted at half weight in response_rate)"
          - "SurveyCycle.response_rate recomputed"
          - "increments SurveyCycle.version by 1"
      - from: CLOSED
        to: SCORING
        trigger: "POST /engagement/survey-cycles/{id}/score"
        actor: PeopleAnalyst
        preconditions:
          - "cycle.status == CLOSED"
        side_effects:
          - "ReportSnapshot rows generated for every OrgUnit with >=1 invite in cycle (both DIRECT and SUBTREE scopes)"
          - "engagement_score calculation runs per snapshot"
          - "benchmark_percentile calculation runs when an ACTIVE BenchmarkSet is linked"
          - "increments SurveyCycle.version by 1"
      - from: SCORING
        to: REPORTED
        trigger: "POST /engagement/survey-cycles/{id}/publish"
        actor: HRAdmin
        preconditions:
          - "all ReportSnapshot rows for cycle have generation >= 1"
        side_effects:
          - "snapshots become visible to UnitManager role (own unit subtree only)"
          - "increments SurveyCycle.version by 1"
      - from: REPORTED
        to: ARCHIVED
        trigger: "POST /engagement/survey-cycles/{id}/archive"
        actor: HRAdmin
        preconditions:
          - "every ActionPlan with cycle_id == this cycle is in {COMPLETED, ABANDONED}"
        side_effects:
          - "increments SurveyCycle.version by 1"

  - entity: SurveyInvite
    initial_state: INVITED
    terminal_states: [SUBMITTED, EXPIRED]
    transitions:
      - from: INVITED
        to: REMINDED
        trigger: "POST /engagement/survey-cycles/{id}/remind (bulk sweep)"
        actor: PeopleAnalyst
        preconditions:
          - "cycle.status == OPEN"
          - "invite.reminder_count < 3"
          - "logical clock - invite.last_reminded_at >= 48h (or invite.last_reminded_at is null and clock >= cycle.opens_at + 24h)"
        side_effects:
          - "ReminderEvent row appended with next sequence_no"
          - "invite.reminder_count += 1; invite.last_reminded_at = now"
          - "increments SurveyInvite.version by 1"
      - from: REMINDED
        to: REMINDED
        trigger: "POST /engagement/survey-cycles/{id}/remind (bulk sweep)"
        actor: PeopleAnalyst
        preconditions:
          - "cycle.status == OPEN"
          - "invite.reminder_count < 3"
          - "logical clock - invite.last_reminded_at >= 48h"
        side_effects:
          - "ReminderEvent row appended with next sequence_no"
          - "invite.reminder_count += 1; invite.last_reminded_at = now"
          - "increments SurveyInvite.version by 1"
      - from: INVITED
        to: SUBMITTED
        trigger: "POST /engagement/survey-invites/{id}/submit"
        actor: EmployeeRole
        preconditions:
          - "cycle.status == OPEN and logical clock < cycle.closes_at"
          - "answers cover every CycleItem of the cycle"
          - "X-User-ID == invite.employee_id"
        side_effects:
          - "SurveyResponse row created (is_partial=false)"
          - "invite.submitted_at = now"
          - "SurveyCycle.submitted_count += 1 and response_rate recomputed"
          - "increments SurveyInvite.version by 1"
      - from: REMINDED
        to: SUBMITTED
        trigger: "POST /engagement/survey-invites/{id}/submit"
        actor: EmployeeRole
        preconditions:
          - "cycle.status == OPEN and logical clock < cycle.closes_at"
          - "answers cover every CycleItem of the cycle"
          - "X-User-ID == invite.employee_id"
        side_effects:
          - "SurveyResponse row created (is_partial=false)"
          - "invite.submitted_at = now"
          - "SurveyCycle.submitted_count += 1 and response_rate recomputed"
          - "increments SurveyInvite.version by 1"
      - from: INVITED
        to: PARTIAL
        trigger: "POST /engagement/survey-invites/{id}/submit-partial"
        actor: EmployeeRole
        preconditions:
          - "cycle.status == OPEN and logical clock < cycle.closes_at"
          - "answers cover at least 1 but not all CycleItem rows"
          - "X-User-ID == invite.employee_id"
        side_effects:
          - "SurveyResponse row created (is_partial=true)"
          - "SurveyCycle.partial_count += 1 and response_rate recomputed"
          - "increments SurveyInvite.version by 1"
      - from: REMINDED
        to: PARTIAL
        trigger: "POST /engagement/survey-invites/{id}/submit-partial"
        actor: EmployeeRole
        preconditions:
          - "cycle.status == OPEN and logical clock < cycle.closes_at"
          - "answers cover at least 1 but not all CycleItem rows"
          - "X-User-ID == invite.employee_id"
        side_effects:
          - "SurveyResponse row created (is_partial=true)"
          - "SurveyCycle.partial_count += 1 and response_rate recomputed"
          - "increments SurveyInvite.version by 1"
      - from: PARTIAL
        to: SUBMITTED
        trigger: "POST /engagement/survey-invites/{id}/submit"
        actor: EmployeeRole
        preconditions:
          - "cycle.status == OPEN and logical clock < cycle.closes_at"
          - "answers cover every CycleItem of the cycle"
          - "X-User-ID == invite.employee_id"
        side_effects:
          - "SurveyResponse row replaced (is_partial=false)"
          - "SurveyCycle.partial_count -= 1, submitted_count += 1, response_rate recomputed"
          - "increments SurveyInvite.version by 1"
      - from: INVITED
        to: EXPIRED
        trigger: "system at cycle close"
        actor: system
        preconditions: []
        side_effects: []
      - from: REMINDED
        to: EXPIRED
        trigger: "system at cycle close"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ActionPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /engagement/action-plans/{id}/submit"
        actor: UnitManager
        preconditions:
          - "plan has at least 1 ActionItem in status OPEN"
          - "plan.unit's ReportSnapshot for cycle is not numeric_suppressed (manager must have seen own scores)"
          - "X-User-ID == OrgUnit.manager_user_id of plan.unit_id"
        side_effects:
          - "plan.submitted_at = now"
          - "increments ActionPlan.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /engagement/action-plans/{id}/approve"
        actor: PeopleAnalyst
        preconditions:
          - "cycle.status == REPORTED"
        side_effects:
          - "increments ActionPlan.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /engagement/action-plans/{id}/reject"
        actor: PeopleAnalyst
        preconditions:
          - "rejection_reason provided (non-empty)"
        side_effects:
          - "increments ActionPlan.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /engagement/action-plans/{id}/revise"
        actor: UnitManager
        preconditions:
          - "X-User-ID == OrgUnit.manager_user_id of plan.unit_id"
        side_effects:
          - "plan.rejection_reason cleared to null"
          - "increments ActionPlan.version by 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /engagement/action-plans/{id}/start"
        actor: UnitManager
        preconditions:
          - "X-User-ID == OrgUnit.manager_user_id of plan.unit_id"
        side_effects:
          - "increments ActionPlan.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system auto-transition when last OPEN ActionItem resolves"
        actor: system
        preconditions:
          - "all ActionItem rows of plan are in {DONE, DROPPED} and at least one is DONE"
        side_effects:
          - "plan.progress_pct recomputed to 100"
          - "increments ActionPlan.version by 1"
      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "POST /engagement/action-plans/{id}/abandon"
        actor: UnitManager
        preconditions:
          - "X-User-ID == OrgUnit.manager_user_id of plan.unit_id"
          - "logical clock > plan.due_at"
        side_effects:
          - "remaining OPEN ActionItem rows flip to DROPPED"
          - "increments ActionPlan.version by 1"
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /engagement/action-plans/{id}/abandon"
        actor: UnitManager
        preconditions:
          - "X-User-ID == OrgUnit.manager_user_id of plan.unit_id"
          - "logical clock > plan.due_at"
        side_effects:
          - "increments ActionPlan.version by 1"

  - entity: ActionItem
    initial_state: OPEN
    terminal_states: [DONE, DROPPED]
    transitions:
      - from: OPEN
        to: DONE
        trigger: "POST /engagement/action-items/{id}/complete"
        actor: UnitManager
        preconditions:
          - "parent ActionPlan.status == IN_PROGRESS"
          - "X-User-ID == ActionItem.owner_user_id OR X-User-ID == OrgUnit.manager_user_id of plan.unit_id"
        side_effects:
          - "parent ActionPlan.progress_pct recomputed"
          - "when last OPEN item resolves and at least one DONE exists, parent ActionPlan auto-transitions IN_PROGRESS -> COMPLETED"
          - "increments ActionItem.version by 1"
      - from: OPEN
        to: DROPPED
        trigger: "POST /engagement/action-items/{id}/drop"
        actor: UnitManager
        preconditions:
          - "parent ActionPlan.status == IN_PROGRESS"
          - "X-User-ID == OrgUnit.manager_user_id of plan.unit_id"
        side_effects:
          - "parent ActionPlan.progress_pct recomputed"
          - "when last OPEN item resolves and at least one DONE exists, parent ActionPlan auto-transitions IN_PROGRESS -> COMPLETED"
          - "increments ActionItem.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-configure-stale-version
    parent_entity: SurveyCycle
    write_endpoint: "POST /engagement/survey-cycles/{id}/configure"
    occ_field: "expected_cycle_version"
    description: |
      Configuring a SurveyCycle whose version has advanced since the client
      last observed it is rejected. Captures the case where another writer
      has just added or removed a CycleItem (which bumps SurveyCycle.version
      as a cascade) and the current writer's view of the cycle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-submit-stale-version
    parent_entity: ActionPlan
    write_endpoint: "POST /engagement/action-plans/{id}/submit"
    occ_field: "expected_plan_version"
    description: |
      Submitting an ActionPlan whose version has advanced since the client
      last observed it is rejected. Captures the case where a reviewer
      rejection (which bumps ActionPlan.version) landed after the manager's
      last read, making the manager's submission stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engagement_score
    trigger: "SurveyCycle CLOSED -> SCORING transition; recompute on POST /engagement/report-snapshots/{id}/recompute"
    algorithm: weighted_scoring
    formula: |
      For each SUBMITTED invite attributed to the snapshot scope:
        for each answer (cycle_item_id, score):
          scaled = (score - 1) * 25                      # Likert 1..5 -> 0..100
          per_answer_weighted = round_half_up(scaled * CycleItem.pinned_weight, 4)
      dimension_score[d] = round_half_up(
          sum(per_answer_weighted over answers whose item.dimension == d)
          / sum(CycleItem.pinned_weight over items of dimension d), 2)
      overall_score = round_half_up(
          sum(per_answer_weighted over ALL answers)
          / sum(CycleItem.pinned_weight over ALL items) , 2)
      # Weight denominators divide by item weight ONCE PER RESPONDENT:
      # denominators are multiplied by submitted_n internally.
      Evaluation order pinned: (1) per-answer weighted product at 4dp,
      (2) dimension means at 2dp, (3) overall at 2dp from the unrounded
      4dp products — NOT from the rounded 2dp dimension means.
    input_set: "SurveyInvite rows in status SUBMITTED attributed to snapshot scope (PARTIAL excluded entirely, not half-weighted)"
    constants:
      LIKERT_STEP: 25
      DIMENSION_DP: 2
      PRODUCT_DP: 4
    precision: "dimension_scores and overall_score 2 decimal places, round_half_up; intermediate products 4 decimal places"
    variants:
      - name: census_weighted
        when: "cycle.cycle_kind == CENSUS"
        difference: "weights = CycleItem.pinned_weight (per-item weights apply)"
      - name: pulse_unweighted
        when: "cycle.cycle_kind == PULSE"
        difference: "all pinned_weight values treated as 1.0 regardless of stored value; identical answers yield a different overall_score than census_weighted"

  - name: response_rate
    trigger: "on every SurveyInvite status mutation (submit, submit-partial, expire) and at cycle close"
    algorithm: aggregation
    formula: |
      invited_count   = count(SurveyInvite of cycle in {INVITED, REMINDED, SUBMITTED, PARTIAL})
      submitted_count = count(SurveyInvite of cycle in SUBMITTED)
      partial_count   = count(SurveyInvite of cycle in PARTIAL)
      response_rate   = round_half_up(
          (submitted_count + 0.5 * partial_count) / invited_count, 4)
      # EXPIRED rows remain in invited_count denominator (they were invited).
      # invited_count is frozen at cycle close; zero invites -> response_rate null.
    input_set: "all SurveyInvite rows of the cycle regardless of status (EXPIRED included in denominator only)"
    constants:
      PARTIAL_WEIGHT: 0.5
      RATE_DP: 4
    precision: "4 decimal places, round_half_up"

  - name: eligibility_sampling
    trigger: "SurveyCycle CONFIGURED -> OPEN transition"
    algorithm: forward_looking
    formula: |
      eligible = Employee where employment_status == ACTIVE
                 AND hired_at <= (cycle.opens_at - TENURE_GATE_DAYS)
      if cycle.cycle_kind == CENSUS: invite_set = eligible (sampling_ratio ignored)
      if cycle.cycle_kind == PULSE:
        target_count = floor(len(eligible) * cycle.sampling_ratio)
        invite_set = first target_count of eligible ordered by
                     (hired_at ASC, created_at ASC)
      Create one SurveyInvite per invite_set member with
      unit_id_at_invite = employee.unit_id at sweep time.
    input_set: "Employee rows with employment_status == ACTIVE at sweep time; LEAVE and TERMINATED excluded"
    constants:
      TENURE_GATE_DAYS: 30
    precision: "integer invite count via floor"

  - name: minimum_n_suppression
    trigger: "ReportSnapshot generation and every recompute"
    algorithm: threshold
    formula: |
      effective_min_n     = OrgUnit.min_n_threshold     (unit override always wins;
                                                         cycle.min_n_default unused when
                                                         unit row exists, which it always does)
      effective_verbatim_n = OrgUnit.verbatim_n_threshold
      numeric_suppressed  = (submitted_n <  effective_min_n)     # strict <: AT threshold is VISIBLE
      verbatim_suppressed = (submitted_n <  effective_verbatim_n)
      if numeric_suppressed: dimension_scores = {} and overall_score = null
      verbatim comments are served only when verbatim_suppressed == false
    input_set: "ReportSnapshot.submitted_n (SUBMITTED invites only; PARTIAL never counts toward n)"
    constants: {}
    precision: "integer comparison, boundary at exactly min_n is visible"

  - name: benchmark_percentile
    trigger: "ReportSnapshot generation when an ACTIVE BenchmarkSet is linked to the cycle's tenant"
    algorithm: aggregation
    formula: |
      dist = BenchmarkSet.dimension_scores (array of reference overall scores)
      below = count(d in dist where d <  snapshot.overall_score)
      ties  = count(d in dist where d == snapshot.overall_score)
      benchmark_percentile = round_half_up((below + 0.5 * ties) / len(dist) * 100, 2)
      # null when numeric_suppressed or no ACTIVE BenchmarkSet exists
    input_set: "BenchmarkSet.dimension_scores of the ACTIVE set; RETIRED sets excluded"
    constants:
      PERCENTILE_DP: 2
    precision: "2 decimal places, round_half_up"

  - name: action_progress
    trigger: "on every ActionItem status transition and on plan abandon"
    algorithm: aggregation
    formula: |
      done    = count(ActionItem of plan in DONE)
      dropped = count(ActionItem of plan in DROPPED)
      open    = count(ActionItem of plan in OPEN)
      if done + dropped + open == 0: progress_pct = 0
      else: progress_pct = floor(100 * done / (done + dropped + open))
      # DROPPED items stay in the denominator: dropping does not inflate progress.
    input_set: "all ActionItem rows of the plan regardless of status"
    constants: {}
    precision: "integer percent via floor"

  - name: attrition_risk_index
    trigger: "provisional variant: on SurveyCycle CLOSED -> SCORING (snapshots exist, so low_engagement is decidable); final variant: on every OutcomeLinkage creation with outcome_kind=ATTRITION for the cycle"
    algorithm: weighted_scoring
    formula: |
      base_rate = count(OutcomeLinkage rows of cycle with outcome_kind=ATTRITION
                        AND outcome_value in {VOLUNTARY, INVOLUNTARY})
                  / count(SurveyInvite of cycle in SUBMITTED)
      if base_rate denominator == 0: risk = null
      low_engagement = (snapshot.overall_score < LOW_SCORE_FLOOR)
      risk = round_half_up(base_rate * (1 + RISK_COEFF * (1 if low_engagement else 0)), 4)
    input_set: "OutcomeLinkage rows for the cycle; SUBMITTED invite denominator"
    constants:
      LOW_SCORE_FLOOR: 60.00
      RISK_COEFF: 1.75
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional_risk
        when: "computed at the CLOSED -> SCORING transition, before any OutcomeLinkage rows exist"
        difference: "base_rate taken as BASE_RATE_PRIOR constant (0.08) instead of observed attrition; forward-looking estimate"
      - name: final_risk
        when: "computed once OutcomeLinkage rows exist for the cycle"
        difference: "base_rate is the observed chronological attrition ratio; supersedes provisional value"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 0, category: auth, check: "request shape: required body fields present, field types valid, enum members legal, numeric ranges honored", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 0, category: auth, check: "query envelope: pagination limit within 1..100, offset >= 0, no unknown query params", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all GET list endpoints" }
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is declared", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-template resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "body-referenced FK ids (bank_id, item_id, unit_id, employee_id, cycle_id, plan_id) exist", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "all POST/PUT/PATCH with body FKs" }
  - { priority: 5, category: state, check: "target resource's state machine permits the requested transition from current state", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "confidentiality: UnitManager may only read ReportSnapshot rows whose unit_id is in the manager's own unit subtree, and never any SurveyResponse row; numeric_suppressed snapshots expose no scores; UnitManager-facing snapshot reads before the cycle reaches REPORTED are refused", error_id: ERR_CONFIDENTIALITY, http_status: 403, applies_to: "GET /engagement/report-snapshots/{id}, GET /engagement/report-snapshots, GET /engagement/report-snapshots/{id}/verbatims" }
  - { priority: 6, category: business_safety, check: "plan ownership: UnitManager X-User-ID must equal OrgUnit.manager_user_id of the plan's unit for plan create/submit/revise/start/abandon and item add/complete/drop", error_id: ERR_PLAN_OWNERSHIP, http_status: 403, applies_to: "POST /engagement/action-plans, POST /engagement/action-plans/{id}/items, POST /engagement/action-plans/{id}/submit, POST /engagement/action-plans/{id}/revise, POST /engagement/action-plans/{id}/start, POST /engagement/action-plans/{id}/abandon, POST /engagement/action-items/{id}/complete, POST /engagement/action-items/{id}/drop" }
  - { priority: 6, category: business_safety, check: "manager-facing snapshot read attempted while cycle is SCORING (snapshots exist but are unpublished)", error_id: ERR_SNAPSHOT_NOT_PUBLISHED, http_status: 409, applies_to: "GET /engagement/report-snapshots/{id}, GET /engagement/report-snapshots" }
  - { priority: 7, category: business_safety, check: "segregation of duties: HRAdmin who created a SurveyCycle may not also perform the SCORING transition on it; PeopleAnalyst may not create ItemBank/SurveyItem rows", error_id: ERR_DUTY_SEGREGATION, http_status: 403, applies_to: "POST /engagement/survey-cycles/{id}/score, POST /engagement/item-banks, POST /engagement/item-banks/{id}/items" }
  - { priority: 8, category: business_constraint, check: "uniqueness: SurveyItem.item_code unique within bank; CycleItem.display_order unique within cycle; CycleItem.item_id unique within cycle (an item pinned once per cycle); Employee.external_ref unique", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "POST create endpoints" }
  - { priority: 9, category: business_temporal, check: "window checks: submit only while OPEN and clock < closes_at; action item target_at <= plan.due_at; plan due_at > cycle.closes_at", error_id: ERR_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /engagement/survey-invites/{id}/submit, POST /engagement/survey-invites/{id}/submit-partial, POST /engagement/action-plans, POST /engagement/action-plans/{id}/items" }
  - { priority: 10, category: business_temporal, check: "reminder cadence: reminder_count < 3 and 48h since last reminder (24h since open for first) — cap-blocked or cadence-blocked invites are SKIPPED by the bulk sweep (it returns 200 with reminded_count reflecting actual sends); a sweep on a non-OPEN cycle is a state error instead", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /engagement/survey-cycles/{id}/remind" }
  - { priority: 11, category: business_referential, check: "OrgUnit.parent_unit_id must not create a cycle in the unit tree", error_id: ERR_UNIT_CYCLE, http_status: 422, applies_to: "POST /engagement/org-units, PATCH /engagement/org-units/{id}" }
  - { priority: 12, category: business_constraint, check: "verbatim_n_threshold >= min_n_threshold on OrgUnit create/update", error_id: ERR_THRESHOLD_INVERSION, http_status: 422, applies_to: "POST /engagement/org-units, PATCH /engagement/org-units/{id}" }
  - { priority: 13, category: business_constraint, check: "single-open-cycle invariant: no other SurveyCycle in OPEN", error_id: ERR_CYCLE_ALREADY_OPEN, http_status: 409, applies_to: "POST /engagement/survey-cycles/{id}/open" }
  - { priority: 14, category: business_constraint, check: "configure requires >= 3 CycleItem rows; activate bank requires >= 3 ACTIVE items", error_id: ERR_INSUFFICIENT_ITEMS, http_status: 422, applies_to: "POST /engagement/survey-cycles/{id}/configure, POST /engagement/item-banks/{id}/activate" }
  - { priority: 15, category: business_fiscal, check: "OCC: expected_*_version matches current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /engagement/survey-cycles/{id}/configure, POST /engagement/action-plans/{id}/submit" }

