          setup:
            - "Rule SUP_HEALTH (REGULATED, weight 3.00, requires_disclaimer false, auto 0.90, manual 0.20) and rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification false, requires_disclaimer true, auto 0.90, manual 0.20), neither with a country override."
