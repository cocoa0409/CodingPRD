  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_apply_then_void_restores_amount_due
        grounds:
          - calculations.credit_waterfall_allocation
          - state_machines.CreditMemo.EXHAUSTED_to_VOID
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY at invoice level — amount_due_cents ==
          subtotal_cents - credits_applied_cents - payments_applied_cents must hold after
          the forward action (5000-cent memo application: due 24840 -> 19840) AND after
          its compensating void (due restored to 24840, credits 0, org outstanding back to
          24840). Any drift in the chain breaks the invariant.
        test_recipe:
          setup:
            - "FIXTURE A invoice ISSUED with subtotal/due 24840; org outstanding_balance_cents == 24840"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /orgs"
              payload: { name: "Metro Hospital", org_type: "MEDICAL", credit_limit_cents: 500000 }
              as: PlatformAdmin
              captures: { org1: $.data.id }
            - call: "POST /rate-cards"
              payload: { modality: "ASL_ONSITE", ada_context: "MEDICAL", credential_level: "CERTIFIED", hourly_rate_cents: 9000, minimum_billable_minutes: 120, travel_rate_cents_per_hour: 3000, mileage_rate_cents_per_mile: 70, vri_platform_fee_cents_per_min: 0, cancel_full_refund_notice_hours: 48, cancel_partial_notice_hours: 24, late_cancel_fee_pct: 0.5, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
