              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns 412 with error_id ERR_STALE_INSPECTION_RECORD_VERSION"
            - "GET /decon-orders?inspection_record_id=${rec_id} returns meta.total_count == 1, so the refused create left no second order"
            - "GET /inspection-records/${rec_id} still shows version == ${rec_v2} and inspection_status == DECON_REQUIRED"
            - "control: the identical body with expected_inspection_record_version ${rec_v2} returns 201, GET /decon-orders?inspection_record_id=${rec_id} then reports meta.total_count == 2, and the record version has advanced to ${rec_v2} + 1"
            - "the state precondition cannot substitute for the OCC check: the record sat in DECON_REQUIRED for the first order, the refused one and the accepted one alike"

      - name: cascading_side_effects_suspending_a_certified_inspector_closes_decon_service
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Inspector.status
          - entities.InspectionStation.certified_inspector_count
          - entities.InspectionStation.decon_service_available
        distinguishing_aspect: "The staffing cascade runs in the subtractive direction and only for certified levels: suspending one of two certified inspectors drops certified_inspector_count to 1, which drops decon_service_available below CERTIFIED_INSPECTOR_DECON_THRESHOLD 2, while suspending an uncertified LEVEL_1 inspector at the same station moves neither field - and administrative reinstatement restores both."
        test_recipe:
          setup:
            - "Hot-water station with three inspectors at 2026-08-01T00:00:00Z: insp_b DECON_CERTIFIED (40 h passed, endorsed), insp_c LEVEL_2 (40 h passed, no endorsement), insp_a LEVEL_1 (8 h passed)."
            - "So certified_inspector_count == 2 and decon_service_available == true before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
