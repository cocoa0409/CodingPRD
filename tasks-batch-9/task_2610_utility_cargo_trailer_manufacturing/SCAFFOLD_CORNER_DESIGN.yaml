      - name: error_unit_creation_against_a_withdrawn_model_is_rejected
        claim_type: Error Triggerable
        grounds:
          - validations[priority=58]
          - errors.ERR_MODEL_NOT_BUILDABLE
          - state_machines.TrailerModel
        distinguishing_aspect: |
          WITHDRAWN is the only certification_status that blocks a new build record - DRAFT and
          IN_ENGINEERING_REVIEW are both buildable, because a unit may be opened before its model is certified
          and simply held out of the jig by priority 59. The withdrawn model keeps its certified GVWR for the
          units it already produced, so a naive check on certified_gvwr_lbs would wrongly admit this call.
        test_recipe:
          setup:
            - "Model TA-7X14 was CERTIFIED, resubmitted, then WITHDRAWN; no units exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
