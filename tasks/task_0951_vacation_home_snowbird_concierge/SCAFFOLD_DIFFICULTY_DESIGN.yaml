      - name: vendor_assignment_closed_interval_exclusive_occupancy_conflict
        grounds:
          - calculations.assignment_window_overlap
          - validations[priority=48]
          - errors[ERR_VENDOR_WINDOW_CONFLICT]
          - state_machines.VendorAssignment.OFFERED_to_ACCEPTED
          - entities.VendorAssignment.fields.window_start_at
        distinguishing_aspect: |
          Interval semantics 3 on the Vendor resource: CLOSED interval, EXCLUSIVE occupancy
          (capacity exactly one) and NO buffer at all. Two assignments that touch at 12:00
          conflict, so the second accept is rejected while the first assignment stays ACCEPTED
          and the second stays OFFERED.
