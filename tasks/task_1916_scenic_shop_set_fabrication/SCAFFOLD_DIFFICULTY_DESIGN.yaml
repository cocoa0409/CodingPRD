              as: ShopForeman
              captures: { overlap_err: $.data.error_id }
          assert:
            - "adjacent reservation created (HTTP 201): BayReservation.${res_2}.status == ACTIVE  # end == start is allowed"
            - "overlapping reservation rejected with ERR_BAY_OVERLAP (HTTP 409)  # [09-09, 09-11) intersects [09-01, 09-10)"

      - name: stock_decrement_to_exactly_zero_depletes
        grounds:
          - errors[ERR_STOCK_INSUFFICIENT]
          - state_machines.StockItem.ACTIVE_to_DEPLETED
          - calculations.stock_valuation
        distinguishing_aspect: |
          Metric: zero quantity. A STOCK line consuming exactly the on-hand
          quantity (30 of 30) must be ACCEPTED (the insufficiency check is
          strict-greater), leaving quantity_on_hand exactly 0 and flipping the
          item to DEPLETED — an off-by-one (>=) reading would wrongly reject.
        test_recipe:
          setup:
            - "Shop; client; package; StockItem PAINT_GAL grade A qty 30 replacement 4000 (reuse unit 2400)"
            - "DRAFT takeoff exists"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
