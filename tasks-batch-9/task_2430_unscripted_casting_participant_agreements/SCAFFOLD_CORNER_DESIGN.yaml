            - "${e_co} == ERR_ROLE_FORBIDDEN"
            - "${e_ba} == ERR_ROLE_FORBIDDEN"
            - "${e_wo} == ERR_ROLE_FORBIDDEN"
            - "HTTP 403 (not 401) on all four denied requests"
            - "HTTP 201 for ProductionAdmin"
            - "${ok_posture} == OPEN"

      - name: applicant_cannot_read_another_applicants_record_forbidden
        claim_type: peer_roles
        grounds:
          - roles.Applicant.identity
          - roles.Applicant.shared_operations
          - validations.priority_4
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          Peer-role claim: two callers hold the SAME role and therefore pass the priority-3
          role check, yet each may only reach its own rows. Applicant A reading B's
          applicant record and B's agreement both answer ERR_NOT_RESOURCE_OWNER at 403 (not
          404, so the caller learns nothing about existence), while A's reads of A's own
          rows return 200 and a staff role reads either row freely. This separates
          entity-backed identity from role membership.
        test_recipe:
          setup:
            - "One production and one published call with two CLEARED adult applicants A and B, each holding one DRAFTED agreement."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
