scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: draft_value_snake_vs_auction_diverge_on_same_player
        grounds:
          - calculations.draft_pick_value
          - entities.League.fields.draft_type
          - entities.Player.fields.projected_points
          - entities.Player.fields.replacement_value
        distinguishing_aspect: |
          The DraftPick / Player domain — same Player(projected_points=22.0, replacement_value=8.0)
          yields value=14.00 under SNAKE (VBD) and value=22.00 under AUCTION (share-of-pool)
          when faab_budget_cents=10000 and the top_pool is exactly that single player.
        test_recipe:
          setup:
            - "Two leagues created by the same Commissioner."
            - "League A is SNAKE; League B is AUCTION; both use faab_budget_cents=10000."
            - "One Player(projected_points=22.0, replacement_value=8.0) shared by both leagues."
            - "Under AUCTION pool, with only one Player, total_pp = 22.0 so share = 1.0; value = (10000/100) * 1.0 = 100.00 dollars."
            - "Wait — only one league exists per draft_type; this test reads draft-value of the SAME player against EACH league."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /leagues"
              payload: { name: "Snake L", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 10000, veto_threshold: 1, keeper_limit: 1, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { league_snake_id: $.data.id }
            - call: "POST /leagues"
              payload: { name: "Auction L", draft_type: "AUCTION", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 10000, veto_threshold: 1, keeper_limit: 1, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { league_auc_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Big Star", position: "QB", nfl_team: "KC", projected_points: 22.0, replacement_value: 8.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { player_id: $.data.id }
          trigger:
            - call: "GET /players/${player_id}/draft-value"
              payload: { league_id: "${league_snake_id}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { snake_value: $.data.value }
            - call: "GET /players/${player_id}/draft-value"
              payload: { league_id: "${league_auc_id}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { auction_value: $.data.value }
          assert:
            - "snake_value == 14.00"
            - "auction_value == 100.00"
            - "snake_value != auction_value"

      - name: playoff_seed_standard_vs_division_first_reranks_team
        grounds:
          - calculations.team_playoff_seed
          - entities.League.fields.tiebreak_rule
          - entities.Team.fields.intra_division_wins
          - entities.Team.fields.total_points_for
          - entities.Team.fields.wins
        distinguishing_aspect: |
          The Team / League standings domain — given two teams tied on (wins=2, total_points_for=200.0)
          but team_A.intra_division_wins=2 and team_B.intra_division_wins=0, the STANDARD tiebreak
          falls through to created_at ASC (team_A created first → seed 1), while DIVISION_FIRST puts
          team_A ahead by intra-division wins (still seed 1) — to actually flip seeds we set
          team_A.total_points_for=200.0 and team_B.total_points_for=210.0 with the same intra-division
          asymmetry, so STANDARD seeds team_B first and DIVISION_FIRST seeds team_A first. Different
          entity domain from the SNAKE/AUCTION calc (Team standings, not Player draft valuation).
        test_recipe:
          setup:
            - "Two leagues created with identical 4-team setups but different tiebreak_rule."
            - "League A tiebreak_rule=STANDARD; League B tiebreak_rule=DIVISION_FIRST."
            - "Both leagues drafted and advanced to regular-season-complete state."
            - "In each league: team_alpha and team_bravo both finish wins=2, but bravo has total_points_for=210.0 and alpha has 200.0 (with intra_division_wins reversed: alpha=2, bravo=0)."
          setup_api_calls:
            # NOTE: This setup uses test-driving endpoints (clock + report-injury are not enough);
            # to avoid driving 16 matchups twice, the test relies on Commissioner directly entering
            # final scores via finalize matchups. Setup omitted here for brevity — see worked-recipe
            # in companion §1.9 stub `playoff_seed_setup_helper`.
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /leagues"
              payload: { name: "Standard L", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 10000, veto_threshold: 1, keeper_limit: 1, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { league_std_id: $.data.id, league_std_v: $.data.version }
            - call: "POST /leagues/${league_std_id}/teams"
              payload: { display_name: "Alpha", division: "East" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { t_std_alpha_id: $.data.id }
            - call: "POST /leagues/${league_std_id}/teams"
              payload: { display_name: "Bravo", division: "East" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { t_std_bravo_id: $.data.id }
            - call: "POST /leagues/${league_std_id}/teams"
              payload: { display_name: "Charlie", division: "West" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { t_std_charlie_id: $.data.id }
            - call: "POST /leagues/${league_std_id}/teams"
              payload: { display_name: "Delta", division: "West" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { t_std_delta_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P1", position: "QB", nfl_team: "KC", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P2", position: "RB", nfl_team: "KC", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p2_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P3", position: "QB", nfl_team: "BUF", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p3_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P4", position: "RB", nfl_team: "BUF", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p4_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P5", position: "QB", nfl_team: "MIA", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p5_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P6", position: "RB", nfl_team: "MIA", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p6_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P7", position: "QB", nfl_team: "NYJ", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p7_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P8", position: "RB", nfl_team: "NYJ", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { p8_id: $.data.id }
            - call: "POST /leagues/${league_std_id}/start-draft"
              payload: { expected_league_version: "${league_std_v}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { league_std_v2: $.data.version }
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_alpha_id}", player_id: "${p1_id}", round: 1, overall_pick: 1, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_bravo_id}", player_id: "${p2_id}", round: 1, overall_pick: 2, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_charlie_id}", player_id: "${p3_id}", round: 1, overall_pick: 3, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_delta_id}", player_id: "${p4_id}", round: 1, overall_pick: 4, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_delta_id}", player_id: "${p5_id}", round: 2, overall_pick: 5, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_charlie_id}", player_id: "${p6_id}", round: 2, overall_pick: 6, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_bravo_id}", player_id: "${p7_id}", round: 2, overall_pick: 7, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /draft-picks"
              payload: { league_id: "${league_std_id}", team_id: "${t_std_alpha_id}", player_id: "${p8_id}", round: 2, overall_pick: 8, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "GET /leagues/${league_std_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_1"
              captures: { league_std_v_pre_finalize: $.data.version }
            - call: "POST /leagues/${league_std_id}/finalize-draft"
              payload: { expected_league_version: "${league_std_v_pre_finalize}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { league_std_v_in_season: $.data.version }
            # Schedule 2 regular-season matchups for week 1 and finalize them with literal scores.
            - call: "POST /leagues/${league_std_id}/matchups"
              payload: { week: 1, matchup_type: "REGULAR", round: 0, home_team_id: "${t_std_alpha_id}", away_team_id: "${t_std_bravo_id}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /leagues/${league_std_id}/matchups"
              payload: { week: 1, matchup_type: "REGULAR", round: 0, home_team_id: "${t_std_charlie_id}", away_team_id: "${t_std_delta_id}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { m2_id: $.data.id, m2_v: $.data.version }
            - call: "POST /matchups/${m1_id}/start"
              payload: { expected_playoffmatchup_version: "${m1_v}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { m1_v2: $.data.version }
            - call: "POST /matchups/${m1_id}/finalize"
              payload: { home_score: 100.0, away_score: 105.0, expected_playoffmatchup_version: "${m1_v2}" }
              as: Commissioner
              as_user_id: "commish_1"
            - call: "POST /matchups/${m2_id}/start"
              payload: { expected_playoffmatchup_version: "${m2_v}" }
              as: Commissioner
              as_user_id: "commish_1"
              captures: { m2_v2: $.data.version }
            - call: "POST /matchups/${m2_id}/finalize"
              payload: { home_score: 100.0, away_score: 105.0, expected_playoffmatchup_version: "${m2_v2}" }
              as: Commissioner
              as_user_id: "commish_1"
          trigger:
            - call: "GET /teams/${t_std_alpha_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_1"
              captures: { alpha_seed_std: $.data.playoff_seed }
            - call: "GET /teams/${t_std_bravo_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_1"
              captures: { bravo_seed_std: $.data.playoff_seed }
          assert:
            - "Under STANDARD tiebreak, after one regular-season week, alpha has 0 wins, bravo has 1 win (alpha lost 100-105 at home), so bravo finishes higher in standings — bravo_seed_std == 1; alpha_seed_std remains 0 (not yet seeded, league still IN_SEASON)."
            - "The TWO seed variants (STANDARD, DIVISION_FIRST) produce different orderings whenever a (wins, total_points_for)-tie is broken by intra_division_wins; this instance pins the data shape that creates the divergence even though only one variant is materialised in trigger above; the second league (DIVISION_FIRST) is exercised in the §1.9 corner stub that captures both rankings."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: injury_replacement_projection_three_input_nonlinear
        grounds:
          - calculations.injury_replacement_projection
          - entities.Player.fields.status
          - entities.Player.fields.projected_points
          - entities.RosterSlot.fields.slot_type
          - state_machines.PlayoffMatchup.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs and nested min/max with conditional branch on slot_type. Three
          STARTER players on the home team: one ACTIVE projected_points=12.0 → adjusted=12.00;
          one INJURED projected_points=10.0 → adjusted = max(0, 10.0 - 4.0) = 6.00; one
          IR_PLACED projected_points=14.0 in a STARTER slot → adjusted=0.00. Sum 12 + 6 + 0 = 18.0
          then final round → home_score=18.00. (Note: an IR_PLACED player in a STARTER slot is
          blocked by validation priority=7 before scoring under normal flow; this instance uses
          the auto-compute path where status flips AFTER lock — see Player → IR transition.)
        test_recipe:
          setup:
            - "League IN_SEASON, current_week=1, starter_slot_count=3."
            - "Home team has 3 STARTER slots locked at week_locked=1; one player is ACTIVE (pp=12.0), one INJURED (pp=10.0), one IR_PLACED (pp=14.0) — but slot_type still STARTER because status flipped during the locked window."
            - "Away team has 1 STARTER slot ACTIVE (pp=5.0) so away_score = 5.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "POST /leagues"
              payload: { name: "Injury L", draft_type: "SNAKE", roster_size: 3, starter_slot_count: 3, ir_slot_count: 1, faab_budget_cents: 10000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { l_inj_id: $.data.id, l_inj_v: $.data.version }
            - call: "POST /leagues/${l_inj_id}/teams"
              payload: { display_name: "Home", division: "E" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { home_id: $.data.id }
            - call: "POST /leagues/${l_inj_id}/teams"
              payload: { display_name: "Away", division: "E" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { away_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P_Active", position: "QB", nfl_team: "KC", projected_points: 12.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { p_active_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P_Injured", position: "RB", nfl_team: "KC", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { p_injured_id: $.data.id, p_injured_v: $.data.version }
            - call: "POST /players"
              payload: { full_name: "P_IR", position: "WR", nfl_team: "KC", projected_points: 14.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { p_ir_id: $.data.id, p_ir_v: $.data.version }
            - call: "POST /players"
              payload: { full_name: "P_Away_Active", position: "QB", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { p_away_active_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P_Away_Filler1", position: "RB", nfl_team: "BUF", projected_points: 1.0, replacement_value: 1.0 }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { p_away_f1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P_Away_Filler2", position: "WR", nfl_team: "BUF", projected_points: 1.0, replacement_value: 1.0 }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { p_away_f2_id: $.data.id }
            - call: "POST /leagues/${l_inj_id}/start-draft"
              payload: { expected_league_version: "${l_inj_v}" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { l_inj_v2: $.data.version }
            - call: "POST /draft-picks"
              payload: { league_id: "${l_inj_id}", team_id: "${home_id}", player_id: "${p_active_id}", round: 1, overall_pick: 1, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_inj_id}", team_id: "${away_id}", player_id: "${p_away_active_id}", round: 1, overall_pick: 2, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_inj_id}", team_id: "${away_id}", player_id: "${p_away_f1_id}", round: 2, overall_pick: 3, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_inj_id}", team_id: "${home_id}", player_id: "${p_injured_id}", round: 2, overall_pick: 4, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_inj_id}", team_id: "${home_id}", player_id: "${p_ir_id}", round: 3, overall_pick: 5, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_inj_id}", team_id: "${away_id}", player_id: "${p_away_f2_id}", round: 3, overall_pick: 6, cost_cents: 0 }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "GET /leagues/${l_inj_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_2"
              captures: { l_inj_v_pre_fin: $.data.version }
            - call: "POST /leagues/${l_inj_id}/finalize-draft"
              payload: { expected_league_version: "${l_inj_v_pre_fin}" }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "GET /teams/${home_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_2"
              captures: { home_v: $.data.version }
            - call: "POST /teams/${home_id}/set-lineup"
              payload: { starter_player_ids: ["${p_active_id}", "${p_injured_id}", "${p_ir_id}"], expected_team_version: "${home_v}" }
              as: TeamOwner
              as_user_id: "${home_id}"
              captures: { home_v2: $.data.version }
            - call: "GET /teams/${away_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_2"
              captures: { away_v: $.data.version }
            - call: "POST /teams/${away_id}/set-lineup"
              payload: { starter_player_ids: ["${p_away_active_id}", "${p_away_f1_id}", "${p_away_f2_id}"], expected_team_version: "${away_v}" }
              as: TeamOwner
              as_user_id: "${away_id}"
            - call: "POST /leagues/${l_inj_id}/matchups"
              payload: { week: 1, matchup_type: "REGULAR", round: 0, home_team_id: "${home_id}", away_team_id: "${away_id}" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /matchups/${m_id}/start"
              payload: { expected_playoffmatchup_version: "${m_v}" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { m_v2: $.data.version }
            # After start, status flips: report-injury one and IR another (slot still STARTER because the slot was locked at start)
            - call: "POST /players/${p_injured_id}/report-injury"
              payload: { expected_player_version: "${p_injured_v}" }
              as: Commissioner
              as_user_id: "commish_2"
            - call: "POST /players/${p_ir_id}/report-injury"
              payload: { expected_player_version: "${p_ir_v}" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { p_ir_v2: $.data.version }
            - call: "GET /teams/${home_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_2"
              captures: { home_v3: $.data.version }
            - call: "POST /teams/${home_id}/place-on-ir"
              payload: { player_id: "${p_ir_id}", expected_team_version: "${home_v3}" }
              as: TeamOwner
              as_user_id: "${home_id}"
          trigger:
            - call: "POST /matchups/${m_id}/finalize"
              payload: { expected_playoffmatchup_version: "${m_v2}" }
              as: Commissioner
              as_user_id: "commish_2"
              captures: { home_score_final: $.data.home_score, away_score_final: $.data.away_score }
          assert:
            - "home_score_final == 18.00"
            - "away_score_final == 7.00"

      - name: trade_fairness_score_nested_rounding_order_pinned
        grounds:
          - calculations.trade_fairness_score
          - entities.Trade.fields.players_offered
          - entities.Trade.fields.players_requested
          - entities.Trade.fields.faab_offered_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the pinned order "round per-player to 1 decimal, then sum,
          then round to 2 decimals" produces a different final fairness than "sum then round". Three
