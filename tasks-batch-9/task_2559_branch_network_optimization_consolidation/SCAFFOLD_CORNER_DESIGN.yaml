          - calculations.property_carry_cost
        distinguishing_aspect: "The clock endpoint is a two-sweep bulk action whose response counters must report exactly what it moved: the 2026-11-01 advance makes one FILED notice EFFECTIVE while touching no property (the disposition is still PENDING), and the 2026-12-05 advance moves one expired lease to HOLDOVER and re-runs the savings chain behind it."
