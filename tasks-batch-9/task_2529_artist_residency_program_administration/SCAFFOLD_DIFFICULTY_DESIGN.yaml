              captures: { pa_a1_p2: "$.data.id" }
            - call: "POST /panel-assignments"
              payload: { application_id: "${app2}", panelist_id: "${p1}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { pa_a2_p1: "$.data.id" }
