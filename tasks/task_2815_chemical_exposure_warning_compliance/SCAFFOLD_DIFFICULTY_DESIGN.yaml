          Conflicting pair is (40 v_transition_legal_for_state, 55 v_finalize_requires_peer_review):
          a FINALIZE against a DRAFT assessment with reviewed_by_user_id null violates both, and
          only ERR_INVALID_STATE_TRANSITION may be returned; the control call proves 55 is not dead
          because FINALIZE from SUBMITTED is a legal edge and then fails with
          ERR_PEER_REVIEW_REQUIRED.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and Product SKU-PC1 has one ACTIVE component, so SUBMIT is available."
            - "A MODELED assessment sits in DRAFT and has never been peer reviewed, so reviewed_by_user_id is null."
