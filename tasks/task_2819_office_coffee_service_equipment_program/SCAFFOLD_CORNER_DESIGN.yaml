            - call: "POST /ocs/service-visits/${visit_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "00000000-0000-0000-0000-000000000003"
              captures: { e_unknown_route: "$.data.error_id" }
            - call: "POST /ocs/service-visits/${visit_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route2_id}"
              captures: { e_foreign_route: "$.data.error_id" }
            - call: "POST /ocs/maintenance-work-orders/${wo_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: RouteTechnician
              as_user_id: "${route2_id}"
              captures: { e_foreign_wo: "$.data.error_id" }
            - call: "POST /ocs/service-visits/${visit_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route1_id}"
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { e_unknown_contact: "$.data.error_id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "${acct2_id}"
              captures: { e_foreign_contact: "$.data.error_id" }
            - call: "POST /ocs/price-adjustments/${adj_id}/respond"
              payload: { disposition: "ACCEPT" }
              as: CustomerContact
              as_user_id: "${acct1_id}"
          assert:
            - "the first call, sent with the X-User-ID header omitted entirely, is HTTP 401 with data.error_id == ERR_MISSING_AUTH_HEADERS"
            - "the call carrying an X-User-ID that is not any Route is HTTP 401 with data.error_id == ERR_UNKNOWN_ACTOR_IDENTITY - identity resolution (priority 3) precedes the ownership check"
            - "the call carrying route 2's real id is HTTP 403 with data.error_id == ERR_ACTOR_NOT_ON_ROUTE, because the visit's route_id is ${route1_id}"
            - "advancing the work order as route 2 is also HTTP 403 ERR_ACTOR_NOT_ON_ROUTE - the scoping follows the work order's site's route, and wo_status stays OPEN"
            - "the same line call as ${route1_id} is 2xx and adds exactly one line to the visit, proving the first four refusals were about identity and not about the body"
            - "the ACCEPT with an unresolvable X-User-ID is HTTP 401 ERR_UNKNOWN_ACTOR_IDENTITY, and the ACCEPT as account 2 is HTTP 403 ERR_ACTOR_NOT_ACCOUNT_CONTACT with adj_status still PROPOSED"
            - "the ACCEPT as ${acct1_id} is 2xx: adj_status == ACCEPTED, so the only difference between the 403 and the 200 is the identity header"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_placement_creation_rejects_a_stale_site_version_and_succeeds_after_a_re_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[placement-create-stale-site]
          - validations[priority=9]
          - errors[ERR_STALE_SITE_VERSION]
          - endpoints[POST /ocs/equipment-placements]
        distinguishing_aspect: "The OCC token is the SITE's version, not the placement's, and a PATCH that touches only headcount is enough to invalidate it. The rejected write is a pure 412 - it consumes no asset and creates no row - and the identical body succeeds once the client re-reads the site."
