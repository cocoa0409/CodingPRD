                  - { gross_lbs: 40000, tare_lbs: 15000 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_SCALE_CAPACITY_EXCEEDED: every draft is 40000 lb but the sum 120000 exceeds capacity_lbs 100000"
            - "GET /grain-inspection/inspection-requests/${req} -> weighing_status == PENDING and certified_quantity_bushels == 1100 (still the declared quantity)"
            - "Two drafts of gross_lbs 50000 and tare_lbs 20000 (sum exactly 100000) -> 201, since the rule forbids exceeding rather than reaching capacity"
            - "That accepted record, with dockage_pct omitted and therefore 0, yields dockage_lbs 0, net_lbs 60000 and net_bushels 1071.43 (60000 / 56 rounded half up to 2 decimals)"
            - "A body with a draft where gross_lbs 20000 equals tare_lbs 20000 -> 422 ERR_SCALE_CAPACITY_EXCEEDED (the same rule requires gross_lbs > tare_lbs)"

      - name: heat_damage_may_not_exceed_total_damage
        claim_type: violation_error
        grounds:
