      - { name: capability_id, type: string, source: computed, description: "FK -> RecoveryCapability.id for capability gaps; null for finding-linked remediation gaps" }
      - { name: finding_id, type: string, source: input, description: "FK -> Finding.id for finding-linked gaps; null for capability gaps" }
      - { name: gap_type, type: enum, source: computed, description: "CAPABILITY when produced by a ValidationRun; FINDING when linked to a Finding" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | HIGH | MEDIUM | LOW" }
      - { name: description, type: string, source: input, description: "Gap narrative" }
      - { name: due_date, type: datetime, source: input, description: "Remediation due date (ISO8601 UTC)" }
      - { name: overdue, type: boolean, source: computed, description: "True iff status is OPEN or IN_PROGRESS and now > due_date" }
      - { name: closed_by_contact_id, type: string, source: computed, description: "FK -> Contact.id; closer; null until CLOSED" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | CLOSED | ACCEPTED_RISK" }

  - name: CommNode
    parent: null
    common_fields: true
    fields:
      - { name: tree_label, type: string, source: input, description: "Crisis communication tree label; nodes sharing a label form one tree" }
      - { name: contact_name, type: string, source: input, description: "Display name of the notified party" }
      - { name: role_title, type: string, source: input, description: "Organizational role title" }
      - { name: parent_node_id, type: string, source: input, description: "FK -> CommNode.id (self-referential); null marks the tree root; only one root per tree_label" }
      - { name: order_index, type: integer, source: input, description: "Sibling order; unique among siblings (same parent_node_id)" }
      - { name: channel, type: enum, source: input, description: "PHONE | EMAIL | SMS" }
      - { name: ack_deadline_minutes, type: integer, source: input, description: "Minutes from activation start by which acknowledgement is due" }
      - { name: active_flag, type: boolean, source: input, description: "Whether the node participates in cascades; deactivating allowed only when all children are inactive" }

  - name: Activation
    parent: null
    common_fields: true
    fields:
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; process in crisis" }
      - { name: plan_id, type: string, source: computed, description: "FK -> Plan.id; the process's currently APPROVED plan pinned at activation" }
      - { name: declared_severity, type: enum, source: input, description: "SEV1 | SEV2 | SEV3" }
      - { name: activation_criterion, type: enum, source: input, description: "CRITERION_A | CRITERION_B | CRITERION_C; server maps SEV1->{A,B}, SEV2->{A}, SEV3->{}" }
      - { name: criterion_justification, type: string, source: input, description: "Free-text justification" }
      - { name: expected_notifications, type: integer, source: computed, description: "Count of distinct active CommNodes in the tree labelled TREE_<process.name> (union of channels per node counts once)" }
      - { name: notified_count, type: integer, source: computed, description: "Notifications in SENT or ACKED state" }
      - { name: acked_count, type: integer, source: computed, description: "Notifications in ACKED state" }
      - { name: escalation_level, type: integer, source: computed, description: "Escalation depth reached (0 = initial cascade)" }
      - { name: acknowledged_at, type: datetime, source: computed, description: "Timestamp when the last notification reached ACKED; null until all acked" }
      - { name: deactivated_by_contact_id, type: string, source: computed, description: "FK -> Contact.id; deactivator; null until DEACTIVATED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ALL_NOTIFIED | ACKNOWLEDGED | DEACTIVATED" }

  - name: Attestation
    parent: null
    common_fields: true
    fields:
      - { name: process_id, type: string, source: input, description: "FK -> Process.id; attested process" }
      - { name: attestation_type, type: enum, source: input, description: "REGULATORY | CUSTOMER" }
      - { name: period_start, type: datetime, source: input, description: "Coverage period start (ISO8601 UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage period end (ISO8601 UTC); must be after period_start" }
      - { name: readiness_score, type: integer, source: computed, description: "Integer 0-100 per calculations.attestation_readiness" }
      - { name: snapshot_payload, type: object, source: computed, description: "Immutable readiness evidence snapshot captured at signing" }
      - { name: signed_by_contact_id, type: string, source: computed, description: "FK -> Contact.id; signer; null until SIGNED" }
      - { name: signer_declaration, type: boolean, source: input, description: "Signer truthfulness declaration; required true at signing" }
      - { name: revoked_reason, type: string, source: input, description: "Reason recorded on revoke; optional" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | REVOKED" }

  - name: Notification
    parent: null
    common_fields: false
    fields:
      - { name: activation_id, type: string, source: system, description: "FK -> Activation.id; owning activation (cascade-created)" }
      - { name: comm_node_id, type: string, source: system, description: "FK -> CommNode.id; target node" }
      - { name: channel, type: enum, source: system, description: "Channel copied from the node at fan-out time: PHONE | EMAIL | SMS" }
      - { name: status, type: enum, source: system, description: "SENT | ACKED" }
      - { name: sent_at, type: datetime, source: system, description: "Fan-out timestamp (server clock)" }
      - { name: acked_at, type: datetime, source: system, description: "Acknowledgement timestamp; null until ACKED" }
      - { name: ack_token, type: string, source: system, description: "Per-notification acknowledgement token required by the ack endpoint" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Process
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /resilience/processes/{processId}/activate"
        actor: ResilienceAdmin
        preconditions:
          - "Process must be in DRAFT (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /resilience/processes/{processId}/suspend"
        actor: ResilienceAdmin
        preconditions:
          - "Process must be in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All ProcessRegistrations of this process are hidden from public listing; the process's plans and BIAs remain readable but no new BIA or Plan may be created for a SUSPENDED process"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /resilience/processes/{processId}/resume"
        actor: ResilienceAdmin
        preconditions:
          - "Process must be in SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /resilience/processes/{processId}/retire"
        actor: ResilienceAdmin
        preconditions:
          - "Process must be in ACTIVE (ERR_INVALID_STATE)"
          - "No Plan of this process in APPROVED (ERR_PROCESS_HAS_OPEN_ITEMS)"
          - "No BIA of this process in SUBMITTED (ERR_PROCESS_HAS_OPEN_ITEMS)"
          - "No Exercise of this process in SCHEDULED or IN_PROGRESS (ERR_PROCESS_HAS_OPEN_ITEMS)"
          - "No Activation of this process in ACTIVE, ALL_NOTIFIED, or ACKNOWLEDGED (ERR_PROCESS_HAS_OPEN_ITEMS)"
        side_effects:
          - "All Plans of this process in DRAFT or IN_REVIEW transition to RETIRED (increments each Plan.version)"
          - "All BIAs of this process in DRAFT or REJECTED transition to SUPERSEDED (increments each Bia.version)"

  - entity: Bia
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /resilience/bias/{biaId}/submit"
        actor: BIAAnalyst
        preconditions:
          - "BIA must be in DRAFT (ERR_INVALID_STATE)"
          - "Referenced Process must be in ACTIVE (ERR_PROCESS_NOT_ACTIVE)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /resilience/bias/{biaId}/decide with decision=APPROVE"
        actor: RiskCommittee
        preconditions:
          - "BIA must be in SUBMITTED (ERR_INVALID_STATE)"
          - "Segregation of duties: acting Contact (X-User-ID) must differ from Bia.decided_by_contact_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "Sets Bia.decided_by_contact_id := acting Contact id"
          - "Sets Bia.score_variant := FINAL (criticality_score frozen; never recomputed again)"
          - "Supersede hop: the previously APPROVED BIA of the same process (if any) transitions APPROVED -> SUPERSEDED (increments that BIA's version)"
          - "Adoption refresh (same process): for every Plan in DRAFT or IN_REVIEW whose target_bia_id resolves to a different BIA than this newly APPROVED one, re-pin target_bia_id to this BIA and set last_adoption_check_cycle to this BIA's cycle_label (each re-pin increments Plan.version)"
          - "Recalculation refresh: for every RecoveryCapability of the same process recompute meets_bia against this BIA's targets; for every Assessment of the same process in DRAFT recompute meets_required_rto against this BIA's rto_target_hours"
          - "Increments Bia.version"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /resilience/bias/{biaId}/decide with decision=REJECT"
        actor: RiskCommittee
        preconditions:
          - "BIA must be in SUBMITTED (ERR_INVALID_STATE)"
          - "Segregation of duties: acting Contact (X-User-ID) must differ from Bia.decided_by_contact_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "Sets Bia.decided_by_contact_id := acting Contact id (increments Bia.version)"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /resilience/bias/{biaId}/submit (revision loop)"
        actor: BIAAnalyst
        preconditions:
          - "BIA must be in DRAFT or REJECTED (ERR_INVALID_STATE)"
          - "Referenced Process must be in ACTIVE (ERR_PROCESS_NOT_ACTIVE)"
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a newer BIA of the same process is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "The superseded BIA's score remains FINAL; Plans already targeting it keep their pin until the adoption refresh of the newer approval re-pins them (increments Bia.version)"

  - entity: Plan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /resilience/plans/{planId}/submit"
        actor: PlanAuthor
        preconditions:
          - "Plan must be in DRAFT (ERR_INVALID_STATE)"
          - "Referenced Process must be in ACTIVE (ERR_PROCESS_NOT_ACTIVE)"
          - "Plan must carry at least the required sections: RECOVERY_STRATEGY, DEPENDENCY_MAP, COMMS_PLAN (ERR_REQUIRED_SECTION_MISSING)"
        side_effects: []

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /resilience/plans/{planId}/approve"
        actor: PlanApprover
        preconditions:
          - "Plan must be in IN_REVIEW (ERR_INVALID_STATE)"
          - "Plan.target_bia_id must be non-null and that BIA must be in APPROVED (ERR_PLAN_TARGETS_UNAPPROVED_BIA)"
          - "Plan.rto_committed_hours <= target BIA.rto_target_hours (ERR_PLAN_EXCEEDS_BIA_RTO)"
          - "Plan.rpo_committed_hours <= target BIA.rpo_target_hours (ERR_PLAN_EXCEEDS_BIA_RPO)"
        side_effects:
          - "Sets Plan.approved_version_no := Plan.version_no"
          - "Supersede cascade: if another Plan of the same process is currently APPROVED, that plan transitions APPROVED -> RETIRED and this plan records supersedes_plan_id := that plan's id (increments the retired plan's version)"
          - "Activation eligibility: the plan becomes the process's activatable plan for future activations (increments Plan.version)"

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /resilience/plans/{planId}/reject"
        actor: PlanApprover
        preconditions:
          - "Plan must be in IN_REVIEW (ERR_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: RETIRED
        trigger: "POST /resilience/plans/{planId}/retire OR system supersede cascade"
        actor: PlanApprover
        preconditions:
          - "Plan must be in APPROVED (ERR_INVALID_STATE)"
          - "Manual retire only: no Exercise referencing this plan is in SCHEDULED or IN_PROGRESS (ERR_PLAN_HAS_ACTIVE_EXERCISE)"
          - "Manual retire only: no Activation of this plan's process is in ACTIVE, ALL_NOTIFIED, or ACKNOWLEDGED (ERR_PLAN_HAS_LIVE_ACTIVATION)"
        side_effects: []
        note: "The two guarding preconditions apply to the manual retire endpoint only; the supersede cascade inside plan approval force-retires the prior APPROVED plan even while exercises reference it (those exercises later fail completion with ERR_PLAN_NOT_APPROVED_FOR_EXERCISE)."

      - from: DRAFT
        to: RETIRED
        trigger: "POST /resilience/plans/{planId}/retire OR system (process retirement)"
        actor: PlanApprover
        preconditions:
          - "Plan must be in DRAFT (ERR_INVALID_STATE)"
        side_effects: []

      - from: IN_REVIEW
        to: RETIRED
        trigger: "system (process retirement cascade only)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ThirdParty
    initial_state: ONBOARDING
    terminal_states: [EXITED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /resilience/third-parties/{thirdPartyId}/activate"
        actor: VendorManager
        preconditions:
          - "ThirdParty must be in ONBOARDING (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /resilience/third-parties/{thirdPartyId}/suspend"
        actor: VendorManager
        preconditions:
          - "ThirdParty must be in ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /resilience/third-parties/{thirdPartyId}/activate"
        actor: VendorManager
        preconditions:
          - "ThirdParty must be in SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: EXITED
        trigger: "POST /resilience/third-parties/{thirdPartyId}/exit"
        actor: VendorManager
        preconditions:
          - "ThirdParty must be in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "All Assessments of this vendor in DRAFT remain readable but cannot be finalized; RecoveryCapabilities with capability_ref_id == this vendor id and capability_type == VENDOR_FAILOVER transition to GAP_IDENTIFIED if currently VALIDATED, and each flip auto-creates a Gap (gap_type CAPABILITY, capability_id set, severity HIGH, due_date := now + 90 days) (increments each RecoveryCapability.version)"

      - from: SUSPENDED
        to: EXITED
        trigger: "POST /resilience/third-parties/{thirdPartyId}/exit"
        actor: VendorManager
        preconditions:
          - "ThirdParty must be in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade as ACTIVE -> EXITED"

  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /resilience/assessments/{assessmentId}/finalize"
        actor: VendorManager
        preconditions:
          - "Assessment must be in DRAFT (ERR_INVALID_STATE)"
          - "Referenced ThirdParty must be in ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
          - "Segregation of duties: acting Contact (X-User-ID) must differ from ThirdParty.owner_contact_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "Sets Assessment.score_variant := FINAL (continuity_score frozen; never recomputed)"
          - "Sets Assessment.finalized_by_contact_id := acting Contact id"
          - "When meets_required_rto is false, auto-creates a Gap (gap_type CAPABILITY, capability_id null, finding_id null, severity HIGH, description auto-generated, due_date := now + 90 days) linked to the assessment's process (increments Assessment.version and the new Gap counts toward gap-backlog calculations)"

  - entity: AlternateSite
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /resilience/alternate-sites/{siteId}/retire"
        actor: ResilienceAdmin
        preconditions:
          - "Site must be in ACTIVE (ERR_INVALID_STATE)"
          - "No SiteReservation of this site in CONFIRMED (ERR_SITE_HAS_ACTIVE_RESERVATIONS)"
        side_effects:
          - "RecoveryCapabilities with capability_type == SITE and capability_ref_id == this site id transition VALIDATED -> GAP_IDENTIFIED when currently VALIDATED, each flip auto-creating a Gap (gap_type CAPABILITY, capability_id set, severity HIGH, due_date := now + 90 days) (increments each RecoveryCapability.version)"

  - entity: SiteReservation
    initial_state: CONFIRMED
    terminal_states: [RELEASED]
    transitions:
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /resilience/site-reservations/{reservationId}/release"
        actor: SiteCoordinator
        preconditions:
          - "Reservation must be in CONFIRMED (ERR_INVALID_STATE)"
          - "Segregation of duties: acting Contact (X-User-ID) must differ from SiteReservation.created_by_contact_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "Frees seats_reserved against the site's capacity window effective immediately"

  - entity: Exercise
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /resilience/exercises/{exerciseId}/start"
        actor: ExerciseOfficer
        preconditions:
          - "Exercise must be in SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /resilience/exercises/{exerciseId}/complete"
        actor: ExerciseOfficer
        preconditions:
          - "Exercise must be in IN_PROGRESS (ERR_INVALID_STATE)"
          - "Referenced Plan must be in APPROVED (ERR_PLAN_NOT_APPROVED_FOR_EXERCISE)"
        side_effects:
          - "Computes Exercise.result per calculations.exercise_result from completion_outcome, achieved_rto_hours, achieved_rpo_hours and the plan's committed targets"
          - "When exercise_type == FAILOVER and requires_capability_check is true: auto-creates a ValidationRun (method FAILOVER, exercise_id := this exercise, measured_rto_hours := achieved_rto_hours, measured_rpo_hours := achieved_rpo_hours, capability_id := the process's RecoveryCapability of capability_type SITE — eligibility: status IN {UNPROVEN, VALIDATED, GAP_IDENTIFIED}; ranking: created_at ASC; tie-break: none needed (created_at unique); empty pool -> no run created) and pins Exercise.validation_run_id"
          - "The created ValidationRun immediately computes its own result per calculations.validation_run_result and fires the capability cascade: VALIDATED -> RecoveryCapability status VALIDATED with proven_* refreshed; GAP_IDENTIFIED -> RecoveryCapability status GAP_IDENTIFIED plus a new Gap (gap_type CAPABILITY) created; last_validation_run_id set; validation_freshness recomputed (increments Exercise.version and RecoveryCapability.version)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /resilience/exercises/{exerciseId}/cancel"
        actor: ExerciseOfficer
        preconditions:
          - "Exercise must be in SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /resilience/exercises/{exerciseId}/cancel"
        actor: ExerciseOfficer
        preconditions:
          - "Exercise must be in SCHEDULED or IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Finding
    initial_state: OPEN
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: OPEN
        to: REMEDIATING
        trigger: "POST /resilience/findings/{findingId}/remediate"
        actor: PlanAuthor
        preconditions:
          - "Finding must be in OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Auto-creates a remediation Gap (gap_type FINDING, finding_id := this finding, capability_id null, severity := finding severity, due_date := finding due_date) in OPEN (increments Finding.version)"

      - from: REMEDIATING
        to: VERIFIED
        trigger: "POST /resilience/findings/{findingId}/verify"
        actor: RiskCommittee
        preconditions:
          - "Finding must be in REMEDIATING (ERR_INVALID_STATE)"
        side_effects:
          - "Sets Finding.verified_by_contact_id := acting Contact id"
          - "The remediation Gap created by the remediate transition (Gap.finding_id == this finding) transitions to CLOSED with closed_by_contact_id := acting Contact id; this Gap closure recomputes gap-backlog aggregates: the owning process's overdue-gap flags refresh, and every RecoveryCapability of the same process recomputes validation_freshness (increments Gap.version and each affected RecoveryCapability.version)"

      - from: REMEDIATING
        to: REJECTED
        trigger: "POST /resilience/findings/{findingId}/reject"
        actor: RiskCommittee
        preconditions:
          - "Finding must be in REMEDIATING (ERR_INVALID_STATE)"
        side_effects:
          - "The remediation Gap (Gap.finding_id == this finding) transitions to ACCEPTED_RISK; gap-backlog aggregates refresh as on verify (increments Gap.version)"

  - entity: RecoveryCapability
    initial_state: UNPROVEN
    terminal_states: []
    transitions:
      - from: UNPROVEN
        to: VALIDATED
        trigger: "system (ValidationRun result == VALIDATED) or POST /resilience/recovery-capabilities/{capabilityId}/mark-remediated"
        actor: system
        preconditions: []
        side_effects:
          - "proven_rto_hours / proven_rpo_hours recomputed as the measured values of the capability's RECORDED run when its result is VALIDATED (at most one RECORDED run per capability exists at any time — older runs are SUPERSEDED and never drive proven_*); when the latest run is GAP_IDENTIFIED the proven_* values keep their last VALIDATED measurements; meets_bia recomputed against the process's latest APPROVED BIA; last_validation_run_id set to the triggering run; validation_freshness recomputed (increments RecoveryCapability.version)"

      - from: VALIDATED
        to: GAP_IDENTIFIED
        trigger: "system (ValidationRun result == GAP_IDENTIFIED, or AlternateSite retirement, or ThirdParty exit)"
        actor: system
        preconditions: []
        side_effects:
          - "last_validation_run_id set when triggered by a run; validation_freshness recomputed (increments RecoveryCapability.version)"

      - from: UNPROVEN
        to: GAP_IDENTIFIED
        trigger: "system (ValidationRun result == GAP_IDENTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Same refresh side effects as VALIDATED -> GAP_IDENTIFIED (increments RecoveryCapability.version)"

      - from: GAP_IDENTIFIED
        to: REMEDIATED
        trigger: "POST /resilience/recovery-capabilities/{capabilityId}/mark-remediated"
        actor: PlanAuthor
        preconditions:
          - "Capability must be in GAP_IDENTIFIED (ERR_INVALID_STATE)"
          - "Every Gap with capability_id == this capability must be in CLOSED or ACCEPTED_RISK (ERR_CAPABILITY_HAS_OPEN_GAPS)"
        side_effects:
          - "validation_freshness recomputed (increments RecoveryCapability.version)"

      - from: REMEDIATED
        to: VALIDATED
        trigger: "system (next ValidationRun result == VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "proven_* refreshed from the RECORDED run when VALIDATED; last_validation_run_id set; validation_freshness recomputed (increments RecoveryCapability.version)"

      - from: GAP_IDENTIFIED
        to: VALIDATED
        trigger: "system (next ValidationRun result == VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "proven_* refreshed; last_validation_run_id set; validation_freshness recomputed (increments RecoveryCapability.version)"

      - from: REMEDIATED
        to: GAP_IDENTIFIED
        trigger: "system (next ValidationRun result == GAP_IDENTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "last_validation_run_id set; validation_freshness recomputed (increments RecoveryCapability.version)"

  - entity: ValidationRun
    initial_state: RECORDED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "system (automatic when a newer ValidationRun for the same capability is recorded)"
        actor: system
        preconditions: []
        side_effects:
          - "The superseded run remains queryable but no longer drives proven_* values; the capability's last_validation_run_id already points at the newer run (increments ValidationRun row's updated_at; common_fields false so no version bump)"

  - entity: Gap
    initial_state: OPEN
    terminal_states: [CLOSED, ACCEPTED_RISK]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /resilience/gaps/{gapId}/start"
        actor: PlanAuthor
        preconditions:
          - "Gap must be in OPEN (ERR_INVALID_STATE)"
        side_effects: []

      - from: IN_PROGRESS
        to: OPEN
        trigger: "POST /resilience/gaps/{gapId}/reopen"
        actor: PlanAuthor
        preconditions:
          - "Gap must be in IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /resilience/gaps/{gapId}/close"
        actor: RiskCommittee
        preconditions:
          - "Gap must be in OPEN or IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Sets Gap.closed_by_contact_id := acting Contact id"
          - "If this Gap is a finding-remediation Gap (finding_id non-null) and the Finding is still REMEDIATING, the closure does NOT auto-verify the Finding (verification is a separate guarded transition)"
          - "Closure refreshes gap-backlog aggregates: overdue flags recompute and each RecoveryCapability of the same process recomputes validation_freshness (increments affected RecoveryCapability.version)"

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /resilience/gaps/{gapId}/close"
        actor: RiskCommittee
        preconditions:
          - "Gap must be in OPEN or IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Same side effects as OPEN -> CLOSED"

      - from: OPEN
        to: ACCEPTED_RISK
        trigger: "POST /resilience/gaps/{gapId}/accept-risk"
        actor: RiskCommittee
        preconditions:
          - "Gap must be in OPEN or IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Gap-backlog aggregates refresh as on close (increments affected RecoveryCapability.version)"

      - from: IN_PROGRESS
        to: ACCEPTED_RISK
        trigger: "POST /resilience/gaps/{gapId}/accept-risk"
        actor: RiskCommittee
        preconditions:
          - "Gap must be in OPEN or IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Same side effects as OPEN -> ACCEPTED_RISK"

  - entity: Activation
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      - from: ACTIVE
        to: ALL_NOTIFIED
        trigger: "system (automatic when every cascade Notification has been created — i.e., notified_count reaches expected_notifications right after fan-out)"
        actor: system
        preconditions: []
        side_effects:
          - "notified_count == expected_notifications asserted; escalation_level stays 0 (increments Activation.version)"

      - from: ALL_NOTIFIED
        to: ACKNOWLEDGED
        trigger: "system (automatic when acked_count == expected_notifications)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets acknowledged_at := current server time (increments Activation.version)"

      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /resilience/activations/{activationId}/deactivate"
        actor: CrisisOfficer
        preconditions:
          - "Activation must be in ACTIVE, ALL_NOTIFIED, or ACKNOWLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "Sets deactivated_by_contact_id := acting Contact id; pending Notifications remain in SENT (no retro-acking)"

      - from: ALL_NOTIFIED
        to: DEACTIVATED
        trigger: "POST /resilience/activations/{activationId}/deactivate"
        actor: CrisisOfficer
        preconditions:
          - "Activation must be in ACTIVE, ALL_NOTIFIED, or ACKNOWLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "Sets deactivated_by_contact_id := acting Contact id"

      - from: ACKNOWLEDGED
        to: DEACTIVATED
        trigger: "POST /resilience/activations/{activationId}/deactivate"
        actor: CrisisOfficer
        preconditions:
          - "Activation must be in ACTIVE, ALL_NOTIFIED, or ACKNOWLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "Sets deactivated_by_contact_id := acting Contact id"

  - entity: Notification
    initial_state: SENT
    terminal_states: [ACKED]
    transitions:
      - from: SENT
        to: ACKED
        trigger: "POST /resilience/notifications/{notificationId}/ack"
        actor: CrisisOfficer
        preconditions:
          - "Notification must be in SENT (ERR_NOTIFICATION_ALREADY_ACKED)"
          - "payload.ack_token must equal Notification.ack_token (ERR_ACK_TOKEN_MISMATCH)"
          - "Owning Activation must be in ACTIVE or ALL_NOTIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "Sets acked_at := current server time"
          - "Activation.acked_count += 1; when acked_count reaches expected_notifications the owning Activation auto-transitions ALL_NOTIFIED -> ACKNOWLEDGED (increments Activation.version)"

  - entity: Attestation
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /resilience/attestations/{attestationId}/sign"
        actor: AttestationSigner
        preconditions:
          - "Attestation must be in DRAFT (ERR_INVALID_STATE)"
          - "signer_declaration must be true (ERR_INVALID_REQUEST)"
          - "Readiness gate per calculations.attestation_readiness: readiness_score must be > 70 (ERR_READINESS_BELOW_THRESHOLD)"
        side_effects:
          - "Sets signed_by_contact_id := acting Contact id"
          - "Captures snapshot_payload: immutable JSON of the readiness inputs (approved plan id/version, capability states, open-gap counts, exercise recency) at signing time; later mutations never rewrite the snapshot (increments Attestation.version)"

      - from: SIGNED
        to: REVOKED
        trigger: "POST /resilience/attestations/{attestationId}/revoke"
        actor: RiskCommittee
        preconditions:
          - "Attestation must be in SIGNED (ERR_INVALID_STATE)"
          - "Segregation of duties: acting Contact (X-User-ID) must differ from Attestation.signed_by_contact_id (ERR_SOD_VIOLATION)"
        side_effects: []

  - entity: CommNode
    initial_state: null
    terminal_states: []
    transitions:
      - from: null
        to: null
        trigger: "CommNode carries no lifecycle states; structural mutations only (create/update). Deactivation (active_flag := false) requires all child nodes inactive (ERR_NODE_HAS_ACTIVE_CHILDREN); re-parenting that would create a cycle is rejected (ERR_COMM_TREE_CYCLE); a second root for the same tree_label is rejected (ERR_TREE_ROOT_EXISTS)"
        actor: CrisisOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-update-stale-version
    parent_entity: Plan
    write_endpoint: "PUT /resilience/plans/{planId}"
    occ_field: "expected_plan_version"
    description: |
      Updating a Plan whose version has advanced since the author last
      observed it is rejected. This captures the case where an adoption
      refresh (a BIA approval re-pinning target_bia_id) has just rewritten
      the plan's targets and the author's edit is therefore based on a stale
      read of the plan.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: exercise-update-stale-version
    parent_entity: Exercise
    write_endpoint: "PUT /resilience/exercises/{exerciseId}"
    occ_field: "expected_exercise_version"
    description: |
      Rescheduling an Exercise whose version has advanced since the officer
      last observed it is rejected. This captures the case where another
      officer has just rescheduled the same exercise and the current
      officer's view of its window is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bia_criticality_score
    trigger: "On Bia create and on every PUT /resilience/bias/{biaId} while score_variant == PROVISIONAL; once the BIA is APPROVED the score is FINAL and never recomputed (a REJECTED BIA keeps score_variant PROVISIONAL and keeps recomputing)"
    algorithm: weighted_scoring
    formula: |
      impact_score = impact_financial_per_hour / 10000        # no cap
      reg_score    = {NONE: 0, LOW: 1, HIGH: 2}[impact_regulatory]
      peak_score   = 1 if peak_period_flag else 0
      ops_score    = {NONE: 0, LOW: 1, HIGH: 2}[impact_operational]
      provisional_raw = impact_score*45 + reg_score*25 + peak_score*20 + ops_score*10
      provisional = round_half_up(provisional_raw, 2)
      final = round_half_up(provisional_raw * (1 + TIER1_UPLIFT), 2)
            if Process.criticality_tier == "TIER_1"
            else provisional
    input_set: "The BIA's own input fields plus the owning Process.criticality_tier; runs while Bia.status in {DRAFT, SUBMITTED, REJECTED} for PROVISIONAL, and exactly once at APPROVED for FINAL"
    constants:
      TIER1_UPLIFT: 0.15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Bia.status in {DRAFT, SUBMITTED, REJECTED}"
        difference: "No tier uplift applied; recomputed on every BIA update"
      - name: FINAL
        when: "Exactly once when Bia transitions SUBMITTED -> APPROVED"
        difference: "Applies TIER1_UPLIFT for TIER_1 processes, then freezes; identical inputs thereafter yield the frozen value, not a recomputed one"

  - name: vendor_continuity_score
    trigger: "On Assessment create and PUT while status == DRAFT (PROVISIONAL); exactly once at finalize (FINAL, frozen)"
    algorithm: weighted_scoring
    formula: |
      required_rto = (latest APPROVED Bia of Assessment.process_id).rto_target_hours
                     if such a BIA exists else Assessment.rto_required_hours
      required_rpo = (latest APPROVED Bia of Assessment.process_id).rpo_target_hours
                     if such a BIA exists else Assessment.rpo_required_hours
      rto_component = clamp(100 - max(0, assessed_rto_hours - required_rto) * 10, 0, 100)
      rpo_component = clamp(100 - max(0, assessed_rpo_hours - required_rpo) * 5, 0, 100)
      provisional = floor(0.6 * rto_component + 0.4 * rpo_component)
      final = max(0, provisional - EVENT_DRIVEN_DISCOUNT)
              if assessment_type == "EVENT_DRIVEN"
              else provisional
      meets_required_rto = (assessed_rto_hours <= required_rto)   # <= is inclusive
    input_set: "The Assessment's own fields plus the latest APPROVED Bia of the referenced process (status filter: Bia.status == APPROVED, tie-break: updated_at DESC, then created_at DESC); the fallback to Assessment.rto_required_hours applies only when no APPROVED BIA exists"
    constants:
      EVENT_DRIVEN_DISCOUNT: 15
    precision: "integer, floor for provisional"
    variants:
      - name: PROVISIONAL
        when: "Assessment.status == DRAFT"
        difference: "No event-driven discount; recomputed on every update"
      - name: FINAL
        when: "Exactly once at DRAFT -> FINALIZED"
        difference: "EVENT_DRIVEN assessments take a 15-point discount, then the score freezes"

  - name: dependency_blast_radius
    trigger: "GET /resilience/processes/{processId}/blast-radius (computed read)"
    algorithm: topological
    formula: |
      Walk Dependency edges in the from_process_id -> to_process_id direction,
      BFS from the target process; a process is in the blast set iff a directed
      path from the target reaches it (excluding the target itself).
      blast_radius = count of the blast set.
      Return order of the blast list: Dependency.created_at ASC for the edge by
      which each process was first discovered; no ties (created_at has
      millisecond resolution and edges are created sequentially).
      Cycles are impossible: Dependency creation rejects any edge that would
      close a directed cycle (ERR_DEPENDENCY_CYCLE) and any self-loop
      (ERR_DEPENDENCY_SELF_LOOP).
    input_set: "All Dependency rows regardless of criticality; endpoint processes regardless of status"
    constants: {}
    precision: "integer count"

  - name: site_capacity_utilization
    trigger: "GET /resilience/alternate-sites/{siteId}/utilization (computed read at a probe instant)"
    algorithm: aggregation
    formula: |
      occupants = SiteReservations of the site with status == CONFIRMED and
                  starts_at <= probe_at < ends_at        # half-open window
      per_reservation_i = round_half_up(seats_reserved_i / capacity_seats * 100, 1)
      utilization_pct = round_half_up( sum(per_reservation_i), 1 )
      # PINNED ORDER: round each reservation to 1dp FIRST, then sum.
      # The alternative (sum seats, then round once) is a different, wrong
      # algorithm: capacity 6 with three 1-seat reservations yields 50.1 here
      # vs 50.0 under sum-then-round.
    input_set: "SiteReservation rows with status == CONFIRMED whose half-open [starts_at, ends_at) window contains probe_at; RELEASED reservations excluded"
    constants: {}
    precision: "1 decimal place, round_half_up, per-reservation-then-sum"

  - name: exercise_result
    trigger: "POST /resilience/exercises/{exerciseId}/complete (exactly once, frozen in Exercise.result)"
    algorithm: threshold
    formula: |
      plan = the Exercise's referenced Plan (targets read at completion time:
             rto_committed_hours / rpo_committed_hours)
      rto_ok = achieved_rto_hours <= plan.rto_committed_hours   # inclusive boundary
      rpo_ok = achieved_rpo_hours <= plan.rpo_committed_hours   # inclusive boundary
      if not (rto_ok and rpo_ok):        result = MISSED
      elif completion_outcome == "MET":  result = MET
      else:                              result = completion_outcome   # PARTIAL or MISSED as declared
    input_set: "The completing Exercise and its referenced Plan"
    constants: {}
    precision: "enum result; boundary comparisons are inclusive (<=)"

  - name: validation_run_result
    trigger: "POST /resilience/validation-runs create, and the FAILOVER exercise-completion cascade (exactly once at recording, frozen in ValidationRun.result)"
    algorithm: threshold
    formula: |
      targets = (latest APPROVED Bia of the capability's process).(rto_target_hours, rpo_target_hours)
                if such a BIA exists
                else (process's APPROVED Plan).(rto_committed_hours, rpo_committed_hours)
                if such a Plan exists
                else -> a standalone run is rejected with ERR_CAPABILITY_TARGETS_UNKNOWN
                (for the exercise-completion cascade: no run is created at all)
      result = GAP_IDENTIFIED if measured_rto_hours > targets.rto
                            or measured_rpo_hours > targets.rpo
               else VALIDATED                    # inclusive boundary: equal-to-target passes
    input_set: "The ValidationRun's measured values, the owning RecoveryCapability's process, that process's latest APPROVED BIA (else APPROVED plan)"
    constants: {}
    precision: "enum result; boundary comparisons inclusive (equal-to-target passes)"

  - name: attestation_readiness
    trigger: "Recomputed on GET /resilience/attestations/{attestationId} and evaluated (gate) inside POST /resilience/attestations/{attestationId}/sign"
    algorithm: aggregation
    formula: |
      # PINNED EVALUATION ORDER (gap counts feed the points, the points feed the
      # subtotal, the multiplier keys on the non-overdue open count — evaluate
      # strictly top to bottom so the value is well-defined):
      1. overdue flags: for every Gap of the process with status IN {OPEN, IN_PROGRESS},
         overdue := (now > Gap.due_date)  -- strict: due exactly now is NOT overdue
      2. plan_points        = 40 if an APPROVED Plan exists for the process else 0
      3. capability_base    = 25 if at least one RecoveryCapability exists for the
                             process AND every one of them has status IN
                             {VALIDATED, REMEDIATED} else 0
      4. overdue_count      = count(Gap with overdue == true)
      5. capability_points  = max(0, capability_base - 10 * overdue_count)
      6. exercise_points    = 25 if the most recent COMPLETED Exercise of the process
                             (rank: scheduled_end DESC, tie-break created_at DESC) has
                             result == MET and scheduled_end >= now - 365 days;
                             10 if that exercise exists, is within 365 days, and its
                             result is PARTIAL or MISSED; 0 otherwise
      7. subtotal           = plan_points + capability_points + exercise_points
      8. open_count         = count(Gap status IN {OPEN, IN_PROGRESS} and overdue == false)
      9. multiplier         = 0.8 if open_count > 0 else 1.0
      10. readiness_score   = floor(min(100, subtotal * multiplier))
      Sign gate: readiness_score >= 70 (ERR_READINESS_BELOW_THRESHOLD otherwise).
    input_set: "Process's Plans (status == APPROVED), RecoveryCapabilities (any status), Gaps (status IN {OPEN, IN_PROGRESS}), Exercises (status == COMPLETED) — all filtered to the attestation's process"
    constants:
      SIGN_THRESHOLD: 70
      PLAN_POINTS: 40
      CAPABILITY_BASE: 25
      OVERDUE_PENALTY_PER_GAP: 10
      EXERCISE_POINTS_MET: 25
      EXERCISE_POINTS_OTHER: 10
      OPEN_GAP_MULTIPLIER: 0.8
      RECENCY_DAYS: 365
    precision: "integer, floor at the final step only"

  - name: gap_backlog_pressure
    trigger: "GET /resilience/processes/{processId}/gap-pressure (computed read); also refreshed as the 'gap-backlog aggregates' side effect of Gap transitions"
    algorithm: weighted_scoring
    formula: |
      For each Gap of the process with status IN {OPEN, IN_PROGRESS}:
        w = {CRITICAL: 4, HIGH: 3, MEDIUM: 2, LOW: 1}[severity]
        age_factor = 2 if (now > due_date) else 1        # strict overdue
        contribution = w * age_factor
      pressure_score = sum(contribution)
      if any overdue Gap has severity == CRITICAL: pressure_score = pressure_score * 2
    input_set: "Gap rows of the process with status IN {OPEN, IN_PROGRESS}; CLOSED and ACCEPTED_RISK excluded"
    constants:
      CRITICAL_OVERDUE_MULTIPLIER: 2
    precision: "integer"

  - name: activation_ack_coverage
    trigger: "GET /resilience/activations/{activationId} read; counters maintained incrementally by the fan-out and ack transitions"
    algorithm: aggregation
    formula: |
      expected_notifications = count of CommNodes with tree_label == "TREE_" + Process.name
                               and active_flag == true (one Notification per node,
                               regardless of channel)
      notified_count = count(Notification of the activation with status IN {SENT, ACKED})
      acked_count    = count(Notification of the activation with status == ACKED)
      coverage_pct   = 0 if expected_notifications == 0
                       else round_half_up(acked_count / expected_notifications * 100, 0)
      # Empty-tree guard: an activation over a zero-node tree fans out zero
      # Notifications, transitions ACTIVE -> ALL_NOTIFIED -> ACKNOWLEDGED
      # immediately, and reports coverage_pct 0.
    input_set: "CommNodes (active only) of the process's tree; Notifications of the activation"
    constants: {}
    precision: "integer percent, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID header present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles; for entity_backed roles X-User-ID must identify an existing Contact when the endpoint performs an ownership or segregation-of-duties comparison", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-template resources exist, validated left-to-right (process before plan before section, etc.)", error_id: ERR_PROCESS_NOT_FOUND, http_status: 404, applies_to: "all nested endpoints — the leftmost missing ancestor's error wins (ERR_PROCESS_NOT_FOUND | ERR_BIA_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_DEPENDENCY_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_EXERCISE_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_CAPABILITY_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_GAP_NOT_FOUND | ERR_NODE_NOT_FOUND | ERR_ACTIVATION_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND | ERR_ATTESTATION_NOT_FOUND | ERR_CONTACT_NOT_FOUND)" }
  - { priority: 4, category: existence, check: "Body-referenced foreign keys exist (process_id, plan_id, third_party_id, site_id, capability_id, exercise_id, finding_id, parent_node_id, owner_contact_id, created_by_contact_id)", error_id: ERR_PROCESS_NOT_FOUND, http_status: 404, applies_to: "all create/action endpoints with FK payloads — each missing FK maps to its own ERR_*_NOT_FOUND (e.g. plan_id -> ERR_PLAN_NOT_FOUND, third_party_id -> ERR_VENDOR_NOT_FOUND, site_id -> ERR_SITE_NOT_FOUND, capability_id -> ERR_CAPABILITY_NOT_FOUND, exercise_id -> ERR_EXERCISE_NOT_FOUND, finding_id -> ERR_FINDING_NOT_FOUND, parent_node_id -> ERR_NODE_NOT_FOUND, *_contact_id -> ERR_CONTACT_NOT_FOUND)" }
  - { priority: 5, category: business_constraint, check: "Request shape: required fields present (ERR_INVALID_REQUEST); enum values in-domain, integers positive where required, end > start for windows, rpo/rto non-negative (ERR_VALIDATION); BIA mtpd_hours >= rto_target_hours (ERR_MTPD_BELOW_RTO)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: state, check: "Target resource is in a state from which the invoked transition exists (per §1.2); terminal-state lockdown enforced", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints and state-guarded writes (PUT /bias while DRAFT/REJECTED only; PUT /plans while DRAFT only; PUT /exercises while SCHEDULED only; PUT /assessments while DRAFT only; Finding creation requires exercise COMPLETED; PlanSection writes require plan DRAFT)" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: BIA decide — actor != Bia.decided_by_contact_id; Assessment finalize — actor != ThirdParty.owner_contact_id; SiteReservation release — actor != created_by_contact_id; Attestation revoke — actor != signed_by_contact_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /bias/{id}/decide, POST /assessments/{id}/finalize, POST /site-reservations/{id}/release, POST /attestations/{id}/revoke" }
  - { priority: 8, category: business_safety, check: "Referenced Process must be ACTIVE for BIA submit, Plan submit, Exercise create, Activation create; ERR_PROCESS_NOT_ACTIVE otherwise", error_id: ERR_PROCESS_NOT_ACTIVE, http_status: 409, applies_to: "POST /bias/{id}/submit, POST /plans/{id}/submit, POST /exercises, POST /activations" }
  - { priority: 9, category: business_safety, check: "Referenced ThirdParty must be ACTIVE when finalizing an Assessment", error_id: ERR_VENDOR_NOT_ACTIVE, http_status: 409, applies_to: "POST /assessments/{id}/finalize" }
  - { priority: 10, category: business_safety, check: "ValidationRun targets resolvable: process has an APPROVED BIA or an APPROVED Plan", error_id: ERR_CAPABILITY_TARGETS_UNKNOWN, http_status: 422, applies_to: "POST /validation-runs" }
  - { priority: 11, category: business_safety, check: "Exercise's referenced Plan must be APPROVED — at scheduling time (create/reschedule) and again at completion time (a supersede cascade may have retired it in between)", error_id: ERR_PLAN_NOT_APPROVED_FOR_EXERCISE, http_status: 409, applies_to: "POST /exercises, PUT /exercises/{id}, POST /exercises/{id}/complete" }
  - { priority: 12, category: business_safety, check: "Attestation readiness gate: attestation_readiness >= 70 at signing", error_id: ERR_READINESS_BELOW_THRESHOLD, http_status: 422, applies_to: "POST /attestations/{id}/sign" }
  - { priority: 13, category: business_constraint, check: "Uniqueness: ThirdParty.name unique; AlternateSite.name unique; Contact.email unique; (process_id, cycle_label) unique among BIAs not in SUPERSEDED; (process_id, version_no) unique among Plans not in RETIRED; (plan_id, order_index) unique among PlanSections; (tree_label, parent_node_id, order_index) unique among CommNodes", error_id: ERR_DUPLICATE, http_status: 409, applies_to: "create/update endpoints of those entities" }
  - { priority: 14, category: business_constraint, check: "Plan carries required sections (RECOVERY_STRATEGY, DEPENDENCY_MAP, COMMS_PLAN) before submit", error_id: ERR_REQUIRED_SECTION_MISSING, http_status: 422, applies_to: "POST /plans/{id}/submit" }
  - { priority: 15, category: business_constraint, check: "Dependency graph acyclic: new edge must not close a directed cycle; self-loop forbidden (ERR_DEPENDENCY_SELF_LOOP when from_process_id == to_process_id)", error_id: ERR_DEPENDENCY_CYCLE, http_status: 422, applies_to: "POST /dependencies" }
  - { priority: 16, category: business_constraint, check: "CommNode tree integrity: exactly one root per tree_label (ERR_TREE_ROOT_EXISTS when a second null-parent node is created for the same label); re-parenting must not create a cycle (ERR_COMM_TREE_CYCLE); deactivation requires all children inactive (ERR_NODE_HAS_ACTIVE_CHILDREN)", error_id: ERR_TREE_ROOT_EXISTS, http_status: 409, applies_to: "POST /comm-nodes, PUT /comm-nodes/{id}" }
  - { priority: 17, category: business_constraint, check: "Activation gating: process must have an APPROVED Plan (ERR_NO_APPROVED_PLAN); no other Activation of the same process in ACTIVE/ALL_NOTIFIED/ACKNOWLEDGED (ERR_ACTIVATION_ALREADY_ACTIVE); declared_severity must permit activation_criterion per the SEV mapping (ERR_CRITERION_NOT_ALLOWED)", error_id: ERR_NO_APPROVED_PLAN, http_status: 422, applies_to: "POST /activations" }
  - { priority: 18, category: business_constraint, check: "Notification ack token must match the notification's ack_token", error_id: ERR_ACK_TOKEN_MISMATCH, http_status: 403, applies_to: "POST /notifications/{id}/ack" }
  - { priority: 19, category: business_constraint, check: "Notification not already acknowledged", error_id: ERR_NOTIFICATION_ALREADY_ACKED, http_status: 409, applies_to: "POST /notifications/{id}/ack" }
  - { priority: 20, category: business_constraint, check: "Retirement guards: Process retire requires no APPROVED plans, no SUBMITTED BIAs, no SCHEDULED/IN_PROGRESS exercises, no live activations (ERR_PROCESS_HAS_OPEN_ITEMS); AlternateSite retire requires no CONFIRMED reservations (ERR_SITE_HAS_ACTIVE_RESERVATIONS); Plan retire requires no SCHEDULED/IN_PROGRESS exercises referencing it (ERR_PLAN_HAS_ACTIVE_EXERCISE) and no live activation of its process (ERR_PLAN_HAS_LIVE_ACTIVATION); mark-remediated requires all capability gaps terminal (ERR_CAPABILITY_HAS_OPEN_GAPS)", error_id: ERR_PROCESS_HAS_OPEN_ITEMS, http_status: 409, applies_to: "retire/mark-remediated endpoints" }
  - { priority: 21, category: business_temporal, check: "Site capacity: overlapping CONFIRMED reservations (half-open windows) of the site plus the new reservation's seats must not exceed capacity_seats", error_id: ERR_SITE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /site-reservations" }
  - { priority: 22, category: business_temporal, check: "Same-process exclusive occupation: a CONFIRMED reservation may not overlap (half-open) another CONFIRMED reservation of the same process_id on the same site", error_id: ERR_SITE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /site-reservations" }
  - { priority: 23, category: business_temporal, check: "FAILOVER exercise windows of the same process must be strictly disjoint — touching endpoints count as overlap (closed-interval semantics)", error_id: ERR_EXERCISE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /exercises, PUT /exercises/{id}" }
  - { priority: 24, category: business_temporal, check: "Site reservation window must lie within the site contract: ends_at <= contracted_through", error_id: ERR_SITE_CONTRACT_EXPIRED, http_status: 422, applies_to: "POST /site-reservations" }
  - { priority: 25, category: business_fiscal, check: "Plan approval target check: Plan.target_bia_id must resolve to an APPROVED BIA", error_id: ERR_PLAN_TARGETS_UNAPPROVED_BIA, http_status: 422, applies_to: "POST /plans/{id}/approve" }
  - { priority: 26, category: business_fiscal, check: "Plan.rto_committed_hours <= target BIA.rto_target_hours", error_id: ERR_PLAN_EXCEEDS_BIA_RTO, http_status: 422, applies_to: "POST /plans/{id}/approve" }
  - { priority: 27, category: business_fiscal, check: "Plan.rpo_committed_hours <= target BIA.rpo_target_hours", error_id: ERR_PLAN_EXCEEDS_BIA_RPO, http_status: 422, applies_to: "POST /plans/{id}/approve" }
  - { priority: 28, category: business_referential, check: "Finding.process_id must equal the referenced Exercise.process_id; Exercise.plan_id must belong to the same process as exercise.process_id; RecoveryCapability.capability_ref_id must reference an existing AlternateSite (SITE) or ThirdParty (VENDOR_FAILOVER)", error_id: ERR_VALIDATION, http_status: 422, applies_to: "POST /findings, POST /exercises, POST /recovery-capabilities" }
  - { priority: 29, category: state, check: "OCC: expected_plan_version / expected_exercise_version must equal the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PUT /plans/{id}, PUT /exercises/{id}" }
  - { priority: 30, category: state, check: "Finding creation requires the exercise COMPLETED; PlanSection create/update/delete requires plan DRAFT; Assessment update requires DRAFT; BIA update requires DRAFT or REJECTED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /findings, POST|PUT|DELETE /plans/{id}/sections, PUT /assessments/{id}, PUT /bias/{id}" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - { method: POST, path: "/resilience/_clock/set_current_utc", description: "Test-driving endpoint: sets the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time.", roles: [ResilienceAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["Recomputes all time-derived fields (Gap.overdue, RecoveryCapability.validation_freshness, attestation exercise recency) against the new clock"] }

  # ---- contacts ----
  - { method: POST, path: "/resilience/contacts", description: "Register a contact (committee member, owner, signer)", roles: [ResilienceAdmin], code: 201, input: [full_name, email, role_title, "active_flag?"], output: Contact, side_effects: [] }
  - { method: GET, path: "/resilience/contacts", description: "List contacts", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: ["email?", "limit?", "offset?"], output: "Contact[]", side_effects: [] }
  - { method: GET, path: "/resilience/contacts/{contactId}", description: "Get a contact", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: Contact, side_effects: [] }

  # ---- processes ----
  - { method: POST, path: "/resilience/processes", description: "Create a business process (starts DRAFT)", roles: [ResilienceAdmin], code: 201, input: [name, business_unit, owner_contact_id, criticality_tier], output: Process, side_effects: [] }
  - { method: GET, path: "/resilience/processes", description: "List processes with filters", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: ["business_unit?", "criticality_tier?", "status?", "owner_contact_id?", "limit?", "offset?"], output: "Process[]", side_effects: [] }
  - { method: GET, path: "/resilience/processes/{processId}", description: "Get a process", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: Process, side_effects: [] }
  - { method: PUT, path: "/resilience/processes/{processId}", description: "Update process fields (any non-terminal state)", roles: [ResilienceAdmin], code: 200, input: ["name?", "business_unit?", "owner_contact_id?", "criticality_tier?"], output: Process, side_effects: ["increments Process.version by 1"] }
  - { method: POST, path: "/resilience/processes/{processId}/activate", description: "DRAFT -> ACTIVE", roles: [ResilienceAdmin], code: 200, input: [], output: Process, side_effects: ["increments Process.version by 1"] }
  - { method: POST, path: "/resilience/processes/{processId}/suspend", description: "ACTIVE -> SUSPENDED", roles: [ResilienceAdmin], code: 200, input: [], output: Process, side_effects: ["increments Process.version by 1"] }
  - { method: POST, path: "/resilience/processes/{processId}/resume", description: "SUSPENDED -> ACTIVE", roles: [ResilienceAdmin], code: 200, input: [], output: Process, side_effects: ["increments Process.version by 1"] }
  - { method: POST, path: "/resilience/processes/{processId}/retire", description: "ACTIVE -> RETIRED with cascade to non-terminal plans/BIAs", roles: [ResilienceAdmin], code: 200, input: [], output: Process, side_effects: ["Plans in DRAFT/IN_REVIEW -> RETIRED (version+1 each)", "BIAs in DRAFT/REJECTED -> SUPERSEDED (version+1 each)", "increments Process.version by 1"] }
  - { method: GET, path: "/resilience/processes/{id}/bias", description: "BIAs of a process", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: "Bia[]", side_effects: [] }
  - { method: GET, path: "/resilience/processes/{id}/plans", description: "Plans of a process", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: "Plan[]", side_effects: [] }
  - { method: GET, path: "/resilience/processes/{id}/recovery-capabilities", description: "Capabilities of a process", roles: [ResilienceAdmin, BIAAnalyst, PlanAuthor, PlanApprover, RiskCommittee, ExerciseOfficer, SiteCoordinator, VendorManager, CrisisOfficer, AttestationSigner], code: 200, input: [], output: "RecoveryCapability[]", side_effects: [] }
