              payload: { termination_reason: "Family relocated out of district." }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          assert:
            - "Checkpoint 1 (after both authorizations, before payment): encumbered_cents == 7146000, available_cents == 92854000, disbursed_cents == 0, and 100000000 == 92854000 + 7146000 + 0"
            - "TuitionInvoice.${inv_id}.gross_billable_cents == 793726, volume_credit_cents == 11906, admin_fee_cents == 17591 and verified_amount_cents == 799411"
            - "Checkpoint 2 (after payment): encumbered_cents == 6346589, available_cents == 92854000, disbursed_cents == 799411, and 100000000 == 92854000 + 6346589 + 799411"
            - "Placement.${pl_id}.paid_total_ytd_cents == 799411 after payment"
            - "Checkpoint 3 (after the trigger): available_cents == 99200589, encumbered_cents == 0, disbursed_cents == 799411, and 100000000 == 99200589 + 0 + 799411"
            - "Placement.${pl_id}.released_encumbrance_cents == 6346589 (4960589 contract remainder + 792000 + 594000 addenda)"
            - "Placement.${pl_id}.contract_encumbrance_cents == 799411 and Placement.${pl_id}.encumbrance_cents == 0"
            - "ServiceAddendum.${add1_id}.status == TERMINATED with encumbrance_cents == 0 and ServiceAddendum.${add2_id}.status == TERMINATED with encumbrance_cents == 0"
            - "Placement.${pl_id}.addendum_encumbrance_cents == 0"
            - "available_cents (99200589) is strictly LESS than authorized_cents, i.e. the 799411 already spent was not handed back"

      - name: route_seat_identity_survives_waitlist_promotion_and_double_release
        grounds:
          - entities.TransportRoute.fields.seat_capacity
          - entities.TransportRoute.fields.seats_committed
          - entities.TransportRoute.fields.seats_available
          - state_machines.TransportationAssignment.ACTIVE_to_RELEASED
          - state_machines.TransportationAssignment.WAITLISTED_to_ACTIVE
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          seat_capacity == seats_committed + seats_available must hold at every observable point
          on a capacity-1 route driven through assign -> waitlist -> release -> promote ->
          release. The release/promote pair happens inside ONE request, so an implementation that
          increments seats_available on release and then forgets to decrement it on promotion
          reports 1 committed + 1 available on a 1-seat route; one that promotes without first
          freeing the seat reports 2 committed. Releasing a WAITLISTED assignment must move no
          seat and no money at all.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-09-01T08:00:00Z then 2026-10-01T08:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000."
            - "One TransportRoute R-31 with seat_capacity 1, daily_rate_cents 6200, service window 360..600."
            - "Two students with ACTIVE DAY placements PL_A and PL_B, both transportation_required true (contract_encumbrance_cents 5760000 each)."
            - "ASG_A on PL_A at 420..450 resolves to ACTIVE (encumbrance 1152270, route full); ASG_B on PL_B at 470..500 resolves to WAITLISTED (encumbrance 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/private-schools"
              payload: { name: "Harbor Academy", state_approval_id: "SA-7781", approval_status: "APPROVED", residential_capable: true, medicaid_provider_number: "MP-4410" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { sch_id: $.data.id, sch_v: $.data.version }
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs_id: $.data.id }
            - call: "POST /ood-placements/transport-routes"
              payload: { route_code: "R-31", seat_capacity: 1, daily_rate_cents: 6200, service_window_start_min: 360, service_window_end_min: 600 }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { route_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-0027", full_name: "Anwar Sithole", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79", medicaid_eligible: false, medicaid_consent_on_file: false }
              as: PlacementCoordinator
