          - state_machines.Claim.REINSTATED_to_APPEALED
        distinguishing_aspect: "The 30-day dispute window is half-open on the claim's created_at boundary while the 14-day post-reinstatement lockout is measured from the reinstating appeal's created_at — two different interval semantics (upload-bounded window vs decision-instant lockout) on the same Claim."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z, exactly 14 days after a claim created at 2026-09-01T00:00:00Z; the claim was appealed, upheld into REINSTATED, and left alone since."
