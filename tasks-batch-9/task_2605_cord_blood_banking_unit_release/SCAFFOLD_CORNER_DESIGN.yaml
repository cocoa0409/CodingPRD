      - name: corner_nightly_run_advances_each_invoice_at_most_one_stage
        claim_type: chronological
        grounds: "§1.3 delinquency_stage_advance processes invoices in due_date ASC then created_at ASC order with 'at most ONE stage advance per invoice per run' and PAST_DUE_DAYS 30 / DELINQUENT_DAYS 90; §1.5 POST /cbb/ops/nightly-run returns per-stage counters."
        distinguishing_aspect: "Processing order and per-run step limit: the invoice is 123 days past due, so both ladder rungs are eligible in the same run, and only the pinned one-stage-per-run rule keeps it at PAST_DUE with exactly one late fee applied."
        test_recipe:
          setup:
            - "Empty database; logical clock opens at 2026-08-01T00:00:00Z."
            - "One PRIVATE_FAMILY enrollment owning a 1-year StorageAccount (ANNIVERSARY_ACCRUAL) prepaid through 2026-08-01T00:00:00Z."
            - "One invoice for the full year (prorated_days 365): base_line 18000, surcharge 0 (no PREMIUM tank), admin_line 225, amount_due 18225, due_date 2026-08-31T00:00:00Z."
            - "The clock is then moved to 2027-01-01T00:00:00Z, which is 123 days past that due_date — past BOTH the 30-day and the 90-day rung."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
            - call: "POST /cbb/storage-accounts"
              payload: { enrollment_id: "${enr_id}", billing_contact_email: "avery@example.com", plan_term_years: 1, prepaid_through_date: "2026-08-01T00:00:00Z" }
              as: BillingAdministrator
              as_user_id: "ba-001"
              captures: { acct_id: "$.data.id" }
            - call: "POST /cbb/storage-invoices"
              payload: { account_id: "${acct_id}", billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2027-08-01T00:00:00Z", prorated_days: 365 }
              as: BillingAdministrator
              as_user_id: "ba-001"
              captures: { inv_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/ops/nightly-run"
              as: PlatformAdmin
            - call: "GET /cbb/storage-invoices/${inv_id}"
              as: BillingAdministrator
              as_user_id: "ba-001"
            - call: "GET /cbb/storage-accounts/${acct_id}"
              as: BillingAdministrator
              as_user_id: "ba-001"
          assert:
            - "at issue the invoice carried base_line_cents == 18000, surcharge_line_cents == 0, admin_line_cents == 225, late_fee_line_cents == 0, amount_due_cents == 18225, due_date == 2026-08-31T00:00:00Z and status == ISSUED"
            - "the nightly run returns HTTP 200 with invoices_advanced_past_due == 1 and invoices_advanced_delinquent == 0"
            - "the same run reports accounts_advanced == 1, units_flagged_pending_abandonment == 0, kits_expired == 0, screenings_expired == 0, reservations_expired == 0, excursions_escalated == 0, tanks_entered_maintenance == 0, tanks_exited_maintenance == 0"
            - "invoice read: status == PAST_DUE (NOT DELINQUENT, despite 123 days past due), late_fee_line_cents == 273 (round_half_up(18225 * 0.015) = 273), amount_due_cents == 18498, amount_paid_cents == 0, stage_advanced_at == 2027-01-01T00:00:00Z"
            - "account read: status == PAST_DUE, balance_cents == 18498, lifetime_paid_cents == 0, delinquency_stage_entered_at == 2027-01-01T00:00:00Z"

      - name: corner_balance_only_counts_unpaid_outstanding_invoices
        claim_type: input_set_filtering
        excluded_because:
          difficulty_instance: account_balance_equals_unpaid_residual_across_delinquency_then_full_payment
          rationale: "That §1.8 instance already walks the account_balance_reconciliation input set across ISSUED, PAST_DUE, DELINQUENT and PAID states and asserts that only unpaid residuals of the first three contribute, which is exactly the input-set-filtering claim."

      - name: corner_invoice_line_rounding_precision
        claim_type: precision
        excluded_because:
          difficulty_instance: invoice_per_line_rounding_order_pinned_mode_b
          rationale: "The pinned round-then-sum order and the whole-cent round_half_up precision of every invoice line are the entire subject of that §1.8 instance, including the one-cent divergence the alternative order would produce."

      - name: corner_storage_fee_tiered_proration
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: invoice_per_line_rounding_order_pinned_mode_b
          rationale: "storage_invoice_total is the only tiered_pricing rule in §1.3, and that §1.8 instance exercises its base / surcharge / admin / late-fee tiers on both a STANDARD and a PREMIUM tank."

      - name: corner_disposition_waterfall_allocation
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: disposition_settlement_tier_keyed_on_pre_fee_subtotal_mode_c
          rationale: "The five pinned steps of disposition_settlement (balance, refund, subtotal, tier keyed on the PRE-fee subtotal, total) are asserted step by step in §1.8 across the credit, small and large tiers."

      - name: corner_hold_interval_merge_with_buffer
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: unit_hold_windows_closed_intervals_with_symmetric_24h_buffer
          rationale: "reservation_hold_conflict is asserted there at exactly 24 hours (accepted) and at 23:59:59 (rejected) on both sides of an incumbent hold, which covers adjacency, overlap and disjointness in one instance."

      - name: corner_eligibility_constraint_propagation
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: unit_eligibility_gated_on_maternal_screening_row_state
          rationale: "That instance propagates screening row-state changes through unit_eligibility_determination to a fixed point (PENDING -> INDETERMINATE -> ELIGIBLE), which is the constraint-propagation claim for the only rule of that algorithm type."

      - name: corner_dose_variants_diverge_on_identical_inputs
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: dose_variant_divergence_pre_cryo_vs_post_thaw
          rationale: "PRE_CRYO and POST_THAW are computed from identical unit counts and patient weight in that §1.8 instance, with both numbers and their delta asserted literally."

      - name: corner_dose_variant_selected_per_operation
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: dose_variant_divergence_pre_cryo_vs_post_thaw
          rationale: "The same instance pins which variant gates which operation (PRE_CRYO at reservation and in search ranking, POST_THAW as the sole release gate) and asserts dose_variant_applied flipping at release."

      - name: corner_settlement_reconciliation_on_variant_switch
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: storage_fee_variant_prorated_termination_vs_anniversary_accrual
          rationale: "That §1.8 instance runs two accounts with identical paid_through_date and unused_days through both storage_fee_assessment variants and reconciles each resulting settlement onto the account ledger, covering the delta-on-switch claim."

  - section: validations
    instances:
      - name: corner_second_storage_account_on_one_enrollment_is_rejected
        claim_type: violation_to_error
        grounds: "§1.4 priority 22 ERR_DUPLICATE_STORAGE_ACCOUNT (409) 'the Enrollment does not already own a StorageAccount'; §1.1 StorageAccount.enrollment_id 'at most one StorageAccount per Enrollment'."
        distinguishing_aspect: "Single-rule violation with nothing else in flight: the first account is accepted and the second identical request is refused by the uniqueness rule, so the returned error_id can only come from priority 22."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
            - "One PRIVATE_FAMILY enrollment that already owns exactly one StorageAccount."
          setup_api_calls:
