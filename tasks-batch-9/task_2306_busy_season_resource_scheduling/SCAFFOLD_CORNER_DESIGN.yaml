  # Error-catalog coverage audit (§1.6, 56 codes). Every code is reached by a named instance:
  #   9 x *_NOT_FOUND + ERR_INVALID_REQUEST ....... section: entities
  #   7 x *_INVALID_STATE ......................... section: state_machines
  #   ERR_PARTNER_ROTATION_LIMIT, ERR_NO_ELIGIBLE_STAFF ... section: calculations
  #   ERR_INVALID_PAGINATION, ERR_INVALID_DATE_RANGE, ERR_NOT_WEEK_START,
  #   ERR_PHASE_WINDOW_AFTER_DEADLINE, ERR_ASSIGNMENT_OUTSIDE_PHASE_WINDOW,
  #   4 x ERR_DUPLICATE_*, ERR_EXCEPTION_OVERLAP, ERR_STAFF_UNAVAILABLE,
  #   ERR_LEVEL_MISMATCH, ERR_SPECIALIZATION_MISMATCH, ERR_LICENSURE_REQUIRED,
  #   ERR_REVIEW_OWNER_REQUIRED, ERR_REVIEW_OWNER_NOT_ELIGIBLE, ERR_REVIEW_WINDOW_MISSING,
  #   ERR_WORKLOAD_CAP_EXCEEDED, ERR_TIME_ENTRY_OUT_OF_WINDOW,
  #   ERR_TIME_ENTRY_EXCEEDS_ALLOCATION, ERR_SIMULATION_STALE, ERR_PHASE_FULLY_STAFFED,
  #   ERR_PARTNER_LEVEL_REQUIRED, ERR_REWORK_LIMIT_EXCEEDED,
  #   ERR_TURNOVER_RISK_BLOCK ..................... section: validations
  #   ERR_UNAUTHENTICATED, ERR_INVALID_ROLE, ERR_UNAUTHORIZED, ERR_NOT_RESOURCE_OWNER,
  #   ERR_SEGREGATION_OF_DUTIES ................... section: rbac
  #   ERR_STALE_PHASE_VERSION, ERR_STALE_ENGAGEMENT_VERSION ... section: cross_cutting_complexity_layers
  #   the five codes stubbed below ................ owned by SCAFFOLD_DIFFICULTY_DESIGN.yaml
  - section: errors
    instances:
      - name: engagement_blocked_code_triggerable
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_ENGAGEMENT_BLOCKED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_create_rejected_while_owning_engagement_client_blocked
          rationale: |
            ERR_ENGAGEMENT_BLOCKED (409) is raised there by booking into a phase whose
            engagement is CLIENT_BLOCKED, which is the only situation the priority-12 rule
            describes; a §1.9 twin would repeat the same call.

      - name: phase_not_in_progress_code_triggerable
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_PHASE_NOT_IN_PROGRESS]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_activate_rejected_until_owning_phase_in_progress
          rationale: |
            ERR_PHASE_NOT_IN_PROGRESS (409) is raised there by activating an assignment whose
            phase is still FULLY_STAFFED, and the same instance shows the call succeeding once
            the phase is started.

      - name: independence_restricted_code_triggerable
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_INDEPENDENCE_RESTRICTED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / independence_safety_priority_14_beats_workload_fiscal_priority_33
          rationale: |
            ERR_INDEPENDENCE_RESTRICTED (409) is the asserted response of that priority-pair
            instance, which books a restricted staff member onto the restricted client inside
            the restriction's effective window.

      - name: daily_capacity_exceeded_code_triggerable
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_DAILY_CAPACITY_EXCEEDED]"
        excluded_because:
          difficulty_instance: boundary_precision_check / daily_capacity_admits_exact_equality_and_rejects_one_hundredth_over
          rationale: |
            ERR_DAILY_CAPACITY_EXCEEDED (409) is raised on the over-by-0.01 leg of that
            boundary instance, which also pins the accept-at-equality leg; the satisfaction
            side is additionally shown by
            training_exception_day_admits_a_booking_that_fits_under_it above.

      - name: review_capacity_exceeded_code_triggerable
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_REVIEW_CAPACITY_EXCEEDED]"
        excluded_because:
          difficulty_instance: boundary_precision_check / review_capacity_admits_exact_equality_and_rejects_next_rework_block
          rationale: |
            ERR_REVIEW_CAPACITY_EXCEEDED (409) is raised there when the next 1.00-hour rework
            block would pass a review window that is already filled to exactly its capacity.

  - section: rbac
    instances:
      - name: missing_or_unknown_identity_headers_rejected_before_any_lookup
        claim_type: unauthorized_operation
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_INVALID_ROLE]
          - roles
        distinguishing_aspect: |
          The identity gate runs at priorities 1 and 2, ahead of every path-FK lookup: a
          request with an empty X-User-ID and a request naming a role that does not exist both
          fail on the headers even though the referenced staff member id is a live one.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z; one DOMESTIC senior S1 exists."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /scheduling/staff-members/${s1_id}"
              payload: {}
              as: "SchedulingManager with an empty X-User-ID header"
              captures: { err_no_user: $.data.error_id }
            - call: "GET /scheduling/staff-members/${s1_id}"
              payload: {}
              as: "an empty X-User-Role header"
              captures: { err_no_role: $.data.error_id }
            - call: "GET /scheduling/staff-members/${s1_id}"
              payload: {}
              as: "ResourcePlanner (a role that is not one of the five declared in §1.7)"
              captures: { err_bad_role: $.data.error_id }
            - call: "GET /scheduling/staff-members/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: "ResourcePlanner (unknown role AND unknown staff member id)"
              captures: { err_role_before_lookup: $.data.error_id }
          assert:
            - "first trigger: HTTP 401 and ${err_no_user} == 'ERR_UNAUTHENTICATED'"
            - "second trigger: HTTP 401 and ${err_no_role} == 'ERR_UNAUTHENTICATED'"
            - "third trigger: HTTP 401 and ${err_bad_role} == 'ERR_INVALID_ROLE'"
            - "fourth trigger: HTTP 401 and ${err_role_before_lookup} == 'ERR_INVALID_ROLE' — priority 2 beats the path-FK lookup at priority 4, so it is not ERR_STAFF_MEMBER_NOT_FOUND"

      - name: each_role_is_refused_the_other_roles_exclusive_operations
        claim_type: unauthorized_operation
        grounds:
          - roles
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
