              captures: { pc: $.data.periodic_cents }
          assert:
            - "HTTP status == 200"
            - "BillingPeriod.${period_id}.periodic_cents == 12000 (120 min straight, no overage)"

      - name: callback_credit_minor_uses_bare_pct
        claim_type: Variant Divergence
        grounds:
          - calculations.callback_credit
          - entities.Complaint.fields.severity
          - entities.Complaint.fields.credit_applied_cents
        distinguishing_aspect: "MINOR variant uses bare callback_credit_pct (no MAJOR_BONUS_PCT): round(300000 * 0.10) = 30000, vs the MAJOR 45000 — verifies minor_vs_major divergence."
        test_recipe:
