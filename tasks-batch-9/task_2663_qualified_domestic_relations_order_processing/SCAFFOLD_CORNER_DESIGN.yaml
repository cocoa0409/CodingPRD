              captures: { d2b: $.data.id, codes2b: $.data.deficiency_codes }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case3}", expected_case_version: "${case3_v}", document_reference: "DRO-2663-DIRTY", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "FLAT_DOLLAR", provisions: ["BENEFIT_NOT_OTHERWISE_AVAILABLE", "REQUIRES_INCREASED_TOTAL_BENEFIT", "ASSIGNS_BENEFITS_ALREADY_ASSIGNED", "SURVIVOR_ANNUITY_FOR_AP", "REQUIRES_QJSA_FOR_AP_SPOUSE", "LUMP_SUM_ELECTION"], proposed_flat_amount_cents: 250000 }
              as: QdroAnalyst
              captures: { d3: $.data.id, codes3: $.data.deficiency_codes }
          assert:
            - "${codes1} == [\"PROHIBITED_FORM_NOT_OFFERED\"] — exactly one element: the two annuity-form provisions collapse into a single code and LUMP_SUM_ELECTION contributes nothing."
            - "${codes2} == [] — an undefined marital_period_end is NOT a deficiency under PERCENTAGE_OF_ACCOUNT, and the case is fully qualifiable."
            - "${codes2b} == [\"MARITAL_PERIOD_UNDEFINED\"] — the SAME case becomes deficient the moment the superseding draft names COVERTURE_FRACTION, proving the predicate is conditional on the formula and is recomputed on every receipt; GET /draft-orders/${d2} now reports status \"SUPERSEDED\"."
            - "${codes3} == [\"AP_IDENTIFICATION_INCOMPLETE\", \"FORMULA_NOT_ACCEPTABLE\", \"MISSING_MODEL_LANGUAGE\", \"PROHIBITED_ALREADY_ASSIGNED\", \"PROHIBITED_BENEFIT_NOT_AVAILABLE\", \"PROHIBITED_FORM_NOT_OFFERED\", \"PROHIBITED_INCREASED_BENEFIT\"] — seven codes in ASCII-ascending order from six provisions plus three non-provision predicates, with the two annuity provisions again collapsing into one code and LUMP_SUM_ELECTION again silent."
            - "The set is derived, not stored from the request: GET /draft-orders/${d1} re-reports [\"PROHIBITED_FORM_NOT_OFFERED\"] and GET /draft-orders/${d3} re-reports the same seven codes in the same order."
            - "A deficient draft is still received and still places a hold: GET /segregation-holds with qdro_case_id=${case3} returns 1 row with hold_amount_cents 250000 (the FLAT_DOLLAR raw amount, under the 500000 percentage ceiling), and GET /qdro-cases/${case3} reports review_status \"UNDER_REVIEW\" — deficiencies do not block receipt, only qualification."

      - name: earnings_adjustment_rounds_per_source_before_summing
        claim_type: precision
        grounds:
          - calculations.earnings_adjustment
          - calculations.per_source_allocation
          - calculations.earnings_growth_bps
        distinguishing_aspect: |
          The rounding ORDER is pinned: round_half_up is applied to each source's growth and only then are
          the results summed, which differs from rounding the aggregate by a cent on the declared
          allocation vector — a difference no amount of extra precision can hide.
        excluded_because:
          difficulty_instance: earnings_adjustment_per_source_rounding_beats_aggregate_rounding
          rationale: |
            The pinned rounding order (round_half_up per source, THEN sum, which differs from
            round-the-aggregate by exactly 1 cent on the declared allocation vector) is the entire subject
            of the §1.8 combinatorial_formula instance, including the money-source-level debits that expose it.

      - name: assigned_amount_branches_and_ceilings_interact
        claim_type: threshold
        grounds:
          - calculations.gross_assigned_amount
          - calculations.assignable_base
          - calculations.marital_coverture_fraction
        distinguishing_aspect: |
          Three formula branches (percentage of account, coverture fraction, flat dollar) each meet two
          independent ceilings (percentage and absolute amount), and the interaction matters: a flat-
          dollar order above the ceiling is trimmed with floor rather than refused.
        excluded_because:
          difficulty_instance: assigned_amount_three_formula_branches_against_two_ceilings
          rationale: |
            gross_assigned_amount's three formula branches crossed with the percentage and flat-amount
            ceilings — including the case where a FLAT_DOLLAR order is silently trimmed rather than
            rejected — are enumerated by the §1.8 combinatorial_formula instance.

      - name: administrative_fee_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.distribution_settlement
        distinguishing_aspect: |
          The fee tier is keyed on net_before_fee rather than on the gross, so the tier boundaries at
          100000 and 999999 must be probed on the post-withholding figure — the same gross lands in
          different tiers depending on the election.
        excluded_because:
          difficulty_instance: admin_fee_tier_keyed_on_net_after_withholding
          rationale: |
            Every fee-tier boundary, and the fact that the tier is keyed on net_before_fee rather than on
            gross so the election alone changes the fee, is asserted by the §1.8 combinatorial_formula instance.

      - name: withholding_floor_is_evaluated_on_the_taxable_amount
        claim_type: constants_applied
        grounds:
          - calculations.distribution_settlement
        distinguishing_aspect: |
          The 20% mandatory withholding constant is triggered by the TAXABLE amount after basis recovery,
          not by the gross, so a large gross that is mostly after-tax basis must escape withholding while
          a smaller fully taxable gross does not.
        excluded_because:
          difficulty_instance: withholding_triggers_at_exactly_twenty_thousand_taxable_cents
          rationale: |
            The WITHHOLDING_TAXABLE_FLOOR_CENTS constant is probed at floor-1, floor and floor+1 on the
            TAXABLE amount (not the gross) by the §1.8 boundary_precision_check instance, which also shows
            the larger gross netting less.

      - name: valuation_interval_selection_and_empty_candidate_set
        claim_type: interval_merge
        grounds:
          - calculations.earnings_growth_bps
          - entities.ValuationSnapshot
        distinguishing_aspect: |
          The interval endpoints are selected rather than supplied: v0 must match the case's
          valuation_date exactly and v1 is the EARLIEST snapshot on or after the segregation date, with
          snapshots strictly inside the interval ignored and an empty candidate set collapsing the growth
          to zero rather than erroring.
        excluded_because:
          difficulty_instance: empty_post_segregation_snapshot_set_yields_zero_earnings
          rationale: |
            v1 selection (earliest snapshot on or after the segregation date, snapshots strictly inside the
            interval ignored), the empty-candidate-set collapse to 0 bps and the exact-boundary snapshot are
            asserted by the §1.8 boundary_precision_check instance.

      - name: per_source_waterfall_remainder_lands_on_the_last_source
        claim_type: waterfall_allocation
        grounds:
          - calculations.per_source_allocation
        distinguishing_aspect: |
          The allocation is a waterfall over source_code in ASCII ascending order where every source but
          the last is rounded half-up and the LAST source absorbs the remainder, so the parts must sum to
          the whole exactly regardless of how ugly the individual quotients are.
        excluded_because:
          difficulty_instance: earnings_adjustment_per_source_rounding_beats_aggregate_rounding
          rationale: |
            The source_code-ordered allocation vector, the remainder absorbed by the highest source_code and
            the exact-sum property are asserted alongside the earnings rounding by the §1.8
            combinatorial_formula instance.

      - name: tax_ledger_replays_to_a_zero_net_position
        claim_type: projection
        grounds:
          - calculations.tax_report_net_position
          - entities.TaxReport
        distinguishing_aspect: |
          The tax ledger is an append-only event log replayed into a net position: a correction must be a
          new negated row carrying the ORIGINAL tax_year and a pointer to the row it offsets, so the net
          of a voided distribution is zero while the row count still grows.
        excluded_because:
          difficulty_instance: append_only_tax_ledger_nets_to_zero_after_void
          rationale: |
            The append-only TaxReport ledger, the negated corrective line carrying the ORIGINAL tax_year and
            the zero net position with a row count of 2 are asserted by the §1.8 compensating_invariant instance.

      - name: distribution_and_projection_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.distribution_settlement
          - calculations.benefit_assignment_projection
        distinguishing_aspect: |
          Two calculations branch on data the caller supplies or the case stores — the election and the
          approach — and each pair must produce measurably different money from identical stored state,
          with the correct branch chosen from context rather than defaulted.
        excluded_because:
          difficulty_instance: cash_versus_direct_rollover_settlement_divergence
          rationale: |
            Variant divergence and selection for distribution_settlement (CASH vs DIRECT_ROLLOVER) and for
            benefit_assignment_projection (SEPARATE_INTEREST vs SHARED_PAYMENT) are asserted by the §1.8
            dual_variant_calc instances, which pin both branches and the delta between them.

      - name: earnings_method_variants_diverge
        claim_type: variant_selection
        grounds:
          - calculations.earnings_growth_bps
          - entities.Plan
        distinguishing_aspect: |
          The earnings variant is selected by the PLAN's earnings_adjustment_method, so two otherwise
          identical cases under two plans must adjust differently on the same snapshots, with the pro-rata
          daily result strictly smaller in magnitude than the period-end result.
        excluded_because:
          difficulty_instance: period_end_versus_pro_rata_daily_earnings_divergence
          rationale: |
            Selection of the PERIOD_END versus PRO_RATA_DAILY earnings variant by plan configuration, and the
            strictly smaller magnitude of the pro-rata result on identical snapshots, are asserted by the §1.8
            dual_variant_calc instance.

  - section: validations
    instances:
      - name: uniqueness_rules_refuse_the_second_row_in_each_scope
        claim_type: violation_to_error
        grounds:
          - validations[priority=65]
          - errors.ERR_PLAN_ACCOUNT_ALREADY_EXISTS
          - errors.ERR_MONEY_SOURCE_DUPLICATE
          - errors.ERR_SNAPSHOT_DUPLICATE
          - entities.PlanAccount
          - entities.MoneySource
          - entities.ValuationSnapshot
        distinguishing_aspect: |
          Three different uniqueness scopes share one priority rung and must not be conflated: one
          PlanAccount per Participant, one MoneySource per (account, source_code) pair, one
          ValuationSnapshot per (account, as_of_date) pair. Each is scoped to its own parent, so the SAME
          source_code and the SAME as_of_date must be accepted on a DIFFERENT account — an implementation
          with a global unique index passes the negative tests and fails the positives.
        test_recipe:
          setup:
            - "A PUBLISHED plan with two participants, each already holding one plan account; participant A's account has a PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Unique Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Unique A", ssn_last4: "1717", date_of_birth: "1970-01-07", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { partA: $.data.id }
            - call: "POST /participants/${partA}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acctA: $.data.id }
            - call: "POST /plan-accounts/${acctA}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acctA}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Unique B", ssn_last4: "1818", date_of_birth: "1970-01-08", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { partB: $.data.id }
            - call: "POST /participants/${partB}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acctB: $.data.id }
          trigger:
            - call: "POST /participants/${partA}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { e_acct: $.data.error_id }
            - call: "POST /plan-accounts/${acctA}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 5 }
              as: PlanAdministrator
              captures: { e_ms: $.data.error_id }
            - call: "POST /plan-accounts/${acctA}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 7, source: "MANUAL_ADJUSTMENT" }
              as: PlanAdministrator
              captures: { e_snap: $.data.error_id }
            - call: "POST /plan-accounts/${acctB}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 400000 }
              as: PlanAdministrator
              captures: { ok_ms: $.data.id, ok_ms_bal: $.data.balance_cents }
            - call: "POST /plan-accounts/${acctB}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 400000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
              captures: { ok_snap: $.data.id, ok_snap_date: $.data.as_of_date }
            - call: "POST /plan-accounts/${acctA}/money-sources"
              payload: { source_code: "ROTH", balance_cents: 200000, basis_cents: 200000 }
              as: PlanAdministrator
              captures: { ok_roth: $.data.id }
          assert:
            - "${e_acct} == \"ERR_PLAN_ACCOUNT_ALREADY_EXISTS\", ${e_ms} == \"ERR_MONEY_SOURCE_DUPLICATE\" and ${e_snap} == \"ERR_SNAPSHOT_DUPLICATE\", all HTTP 409."
            - "${ok_ms_bal} == 400000 and ${ok_snap_date} == \"2026-06-30\" — the same source_code and the same as_of_date are perfectly legal on participant B's account, so the scope is (parent, key) and not global."
            - "${ok_roth} is a new id — a DIFFERENT source_code on account A is accepted, so the constraint is on the pair and not on the account alone."
            - "Nothing was overwritten: GET /plan-accounts/${acctA}/money-sources returns exactly 2 rows and the PRE_TAX_DEFERRAL row still reports balance_cents 1000000 (never 5), and GET /plan-accounts/${acctA}/valuation-snapshots with as_of_date=2026-06-30 returns 1 row of 1000000 (never 7)."
            - "GET /participants/${partA}/plan-accounts returns exactly 1 row — the refused second account was not created."
            - "GET /plan-accounts/${acctA} reports vested_balance_cents 1200000 and after_tax_basis_cents 200000 after the ROTH insert, proving the successful writes still re-derive the aggregates."

      - name: the_first_five_priority_rungs_are_peeled_one_at_a_time
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - validations[priority=25]
          - validations[priority=30]
          - validations[priority=32]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          A single request can violate all five leading rungs at once — no credentials, a role that this
          endpoint never allows, a missing required field, an unknown path id and an unknown body foreign
          key — and the server must report exactly the LOWEST-numbered violation each time. Fixing one
          defect at a time walks the ladder 401 -> 403 -> 400 -> 404(path) -> 404(body FK) -> 201, which is
          the only way to prove the order rather than a coincidence: an implementation that authenticates
          after loading the resource returns 404 on the first call.
        test_recipe:
          setup:
            - "A PUBLISHED plan, one participant with an assignable PRE_TAX_DEFERRAL source of 1000000, one INTAKE case at clock 2026-09-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Ladder Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Ladder Member", ssn_last4: "1919", date_of_birth: "1970-01-09", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Ladder Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1972-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "00000000-0000-4000-8000-00000000000f", expected_case_version: "${case_v}", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: NO_CREDENTIALS
              captures: { e_401: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "00000000-0000-4000-8000-00000000000f", expected_case_version: "${case_v}", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: AlternatePayee
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { e_403: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "00000000-0000-4000-8000-00000000000f", expected_case_version: "${case_v}", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { e_400: $.data.error_id }
            - call: "POST /draft-orders/{id}/deny"
              payload: { denial_reason: "ORDER_NOT_QUALIFIABLE" }
              as: PlanAdministrator
              captures: { e_404_path: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "00000000-0000-4000-8000-00000000000f", expected_case_version: "${case_v}", document_reference: "DRO-2663-LAD", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { e_404_body: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-LAD", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { ok_draft: $.data.id, ok_status: $.data.status }
          assert:
            - "${e_401} == \"ERR_UNAUTHENTICATED\" with HTTP 401 — the request carries no credentials at all (no role header), and the missing document_reference and the unknown case id are both ignored because priority 10 runs first."
            - "${e_403} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — AlternatePayee is not among the roles §1.5 declares for POST /draft-orders, and the answer is still not a 400 or a 404."
            - "${e_400} == \"ERR_INVALID_REQUEST\" with HTTP 400 — an allowed role plus a missing required document_reference reports the shape error, still ahead of the unknown body foreign key."
            - "${e_404_path} == \"ERR_DRAFT_ORDER_NOT_FOUND\" with HTTP 404 — a well-formed body against an unknown PATH id resolves at priority 30."
            - "${e_404_body} == \"ERR_QDRO_CASE_NOT_FOUND\" with HTTP 404 — with the shape now valid, the unknown BODY foreign key finally surfaces at priority 32, one rung later."
            - "${ok_status} == \"UNDER_REVIEW\" with HTTP 201 — the sixth call, identical except for a real case id, succeeds, so the five refusals were about the ladder and not about the endpoint."
            - "None of the five refusals mutated anything: GET /draft-orders with qdro_case_id=${case_id} returns exactly 1 row whose id is ${ok_draft}, and GET /qdro-cases/${case_id} reports version ${case_v} + 1 (the single increment from the successful receipt)."

      - name: the_segregation_window_closes_qualification_and_resubmission_alike
        claim_type: temporal_validation
        grounds:
          - validations[priority=55]
          - errors.ERR_SEGREGATION_WINDOW_EXPIRED
          - calculations.hold_window_and_deadlines
          - endpoints[POST /_ops/run-segregation-sweep]
        distinguishing_aspect: |
          The 548-day segregation window is enforced on the REQUEST PATH, not only by the sweep. If the
          clock passes expires_at and no sweep has run, the hold is still HELD and the case is still
          UNDER_REVIEW/DEFICIENT, yet both qualification and resubmission must be refused with
          ERR_SEGREGATION_WINDOW_EXPIRED — an implementation that only checks the window inside the sweep
          happily qualifies an 18-month-stale order. Priority 55 also outranks the deficiency readiness
          check at 62, so a deficient AND stale draft reports the window error, and it outranks the still
          open resubmission window on the notice, so the tighter statutory clock wins.
        test_recipe:
          setup:
            - "A PUBLISHED plan (requires_model_language true, segregation_period_days 548, resubmission_window_days 60), one participant with an assignable PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30."
            - "A draft WITHOUT model language is received at clock 2026-09-01, so the hold expires 2028-03-02T00:00:00Z and the draft is deficient."
            - "A deficiency notice is issued at 2028-03-01 — one day before expiry — so its own 60-day resubmission window is still open at 2028-03-05."
            - "The clock is then moved to 2028-03-05T00:00:00Z and NO sweep is run."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Window Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, segregation_period_days: 548, resubmission_window_days: 60, earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Stale Member", ssn_last4: "2121", date_of_birth: "1970-02-01", participation_start_date: "2004-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Stale Payee", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1972-02-02", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-STALE", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", hold_exp: "$.data[0].expires_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "late notice, window still open" }
              as: QdroAnalyst
              as_user_id: "analyst-4"
              captures: { notice_deadline: $.data.resubmission_deadline_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-05T00:00:00Z" }
              as: PlanAdministrator
          trigger:
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-STALE-r2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: Participant
              as_user_id: "${part_id}"
              captures: { e_resubmit: $.data.error_id }
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-6"
              captures: { e_qualify: $.data.error_id }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { hold_status: $.data.status }
            - call: "GET /plan-accounts/${acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { held_now: $.data.held_amount_cents, avail_now: $.data.available_balance_cents }
          assert:
            - "${hold_exp} == \"2028-03-02T00:00:00Z\" and ${notice_deadline} == \"2028-04-30T00:00:00Z\" — the notice's own window extends well past the hold's expiry, which is exactly the conflict under test."
            - "${e_resubmit} == \"ERR_SEGREGATION_WINDOW_EXPIRED\" with HTTP 409 — not ERR_RESUBMISSION_WINDOW_CLOSED (that window is open until 2028-04-30) and not ERR_MAX_REVISIONS_EXCEEDED (revision_number is 1)."
            - "${e_qualify} == \"ERR_SEGREGATION_WINDOW_EXPIRED\" with HTTP 409 — not ERR_QUALIFICATION_DEFICIENCIES_PRESENT, even though the draft still carries MISSING_MODEL_LANGUAGE, because priority 55 precedes priority 62."
            - "${hold_status} == \"HELD\" with ${held_now} == 400000 and ${avail_now} == 600000 — the refusals did NOT lapse the hold; only the sweep does that, so the window check is a pure read-side guard."
            - "GET /draft-orders/${draft_id} still reports status \"DEFICIENT\" with revision_number 1 and denial_reason null, and GET /draft-orders/${draft_id}/deficiency-notices returns exactly 1 row still in status \"ISSUED\" — neither refusal cured or expired the notice."
            - "GET /qdro-cases/${case_id} still reports review_status \"DEFICIENT\" and segregation_status \"HELD\", so the case remains exactly where it was and only POST /_ops/run-segregation-sweep can move it."

      - name: a_void_is_legal_on_the_last_second_of_the_tax_year_and_illegal_one_second_later
        claim_type: temporal_validation
        grounds:
          - validations[priority=62]
          - errors.ERR_VOID_ACROSS_TAX_YEARS
          - calculations.tax_report_net_position
          - endpoints[POST /distributions/{id}/void]
        distinguishing_aspect: |
          The void window is a CALENDAR-YEAR comparison against the distribution's stored tax_year, not an
          elapsed-time window: a distribution issued in September can still be voided at
          2026-12-31T23:59:59Z (three and a half months later) while one issued at that very instant
          cannot be voided at 2027-01-01T00:00:00Z (one second later). Two distributions with identical
          amounts therefore get opposite answers, which is only reproducible by comparing years rather
          than by a day-count. The refused void must also leave the append-only tax ledger untouched — no
          corrective line, no edit of the original.
        test_recipe:
          setup:
            - "A qualified SEPARATE_INTEREST case whose alternate payee account holds 400000 with after_tax_basis_cents 0, established at clock 2026-09-15."
            - "Distribution D1 of 100000 CASH is issued at 2026-09-15 (tax_year 2026): withholding 20000, fee 2500, net 77500, code CODE_2."
            - "The clock is moved to 2026-12-31T23:59:59Z and D1 is voided there — still inside tax year 2026."
            - "Distribution D2 of 100000 CASH is then issued at 2026-12-31T23:59:59Z, also tax_year 2026, and the clock is moved to 2027-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-31T23:59:59Z" }
              as: PlanAdministrator
              captures: { prev_utc: $.data.previous_utc }
            - call: "GET /alternate-payee-accounts/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { ap_v1: $.data.version, bal1: $.data.balance_cents }
          trigger:
            - call: "POST /distributions/{id}/void"
              payload: {}
              as: PlanAdministrator
              captures: { d1_status: $.data.status, d1_voided_at: $.data.voided_at, d1_tax_year: $.data.tax_year }
            - call: "GET /alternate-payee-accounts/{id}"
              payload: {}
              as: PlanAdministrator
              captures: { ap_v2: $.data.version, bal2: $.data.balance_cents, gross2: $.data.total_distributed_gross_cents }
            - call: "POST /alternate-payee-accounts/{id}/distributions"
              payload: { expected_ap_account_version: "${ap_v2}", election: "CASH", gross_amount_cents: 100000 }
              as: PlanAdministrator
              captures: { d2_id: $.data.id, d2_tax_year: $.data.tax_year, d2_net: $.data.net_amount_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /distributions/${d2_id}/void"
              payload: {}
              as: PlanAdministrator
              captures: { e_void: $.data.error_id }
            - call: "GET /distributions/${d2_id}"
              payload: {}
              as: PlanAdministrator
              captures: { d2_status_after: $.data.status, d2_voided_after: $.data.voided_at }
          assert:
            - "${prev_utc} == \"2026-09-15T00:00:00Z\" — the clock endpoint echoes the instant D1 was issued at, so the two voids differ only in the observation time."
            - "${d1_status} == \"VOIDED\" with HTTP 200, ${d1_voided_at} == \"2026-12-31T23:59:59Z\" and ${d1_tax_year} == 2026 — 107 days after issuance is fine because the year still matches."
            - "${ap_v2} == ${ap_v1} + 1, ${bal2} == 400000 (restored from ${bal1} == 300000) and ${gross2} == 0 — the compensation credited the funding side back and re-derived the totals from the ISSUED set only."
            - "${d2_tax_year} == 2026 and ${d2_net} == 77500 — D2 is issued at the last second of 2026 and is priced identically to D1."
            - "${e_void} == \"ERR_VOID_ACROSS_TAX_YEARS\" with HTTP 409 — one second of clock movement, and the same operation that just succeeded is now refused."
            - "${d2_status_after} == \"ISSUED\" and ${d2_voided_after} is null — the refusal left D2 exactly as issued."
            - "GET /tax-reports with alternate_payee_account_id set returns exactly 3 lines in append order: D1's positive line, D1's corrective line with reportable_gross_cents -100000 / reportable_taxable_cents -100000 / federal_withheld_cents -20000 and tax_year 2026, then D2's positive line — the refused void appended NOTHING, so the ledger nets to exactly D2's line (100000 / 100000 / 20000)."

      - name: election_and_approach_rules_only_bite_on_the_configurations_they_name
        claim_type: conditional_validation
        grounds:
          - validations[priority=65]
          - validations[priority=62]
          - errors.ERR_ROLLOVER_INSTITUTION_REQUIRED
          - errors.ERR_APPROACH_NOT_PERMITTED
          - calculations.distribution_settlement
        distinguishing_aspect: |
          Both rules are conditional on data outside the request. rollover_institution is required only
          when election is DIRECT_ROLLOVER — the identical body minus that field is perfectly valid for
          CASH — and the approach compatibility rule points in BOTH directions: SHARED_PAYMENT needs a
          participant whose benefit has commenced, SEPARATE_INTEREST needs one whose benefit has not, so
          the same proposed_approach is legal on one case and illegal on another with no request-level
          difference. A DIRECT_ROLLOVER also proves the fee tier is keyed on the net after withholding:
          zero withholding pushes the same 400000 gross into the middle fee tier.
        test_recipe:
          setup:
            - "A PUBLISHED plan allowing both SEPARATE_INTEREST and SHARED_PAYMENT."
            - "Participant P1 has benefit_commenced true with monthly_payment_cents 320000; participant P2 has benefit_commenced false, an assignable PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30 of 1000000."
            - "Case C1 on P1 carries a SEPARATE_INTEREST draft; case C2 on P2 carries a SHARED_PAYMENT draft. Clock 2026-09-01."
          setup_api_calls:
            - call: "POST /draft-orders/{c1_draft}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-7"
              captures: { e_sep: $.data.error_id }
            - call: "POST /draft-orders/{c2_draft}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-7"
              captures: { e_shared: $.data.error_id }
            - call: "GET /qdro-cases/{c2}"
              payload: {}
              as: PlanAdministrator
              captures: { c2_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{c2}", expected_case_version: "${c2_v}", document_reference: "DRO-2663-COND-r2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { c2_draft2: $.data.id }
            - call: "POST /draft-orders/${c2_draft2}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-7"
              captures: { ok_status: $.data.status }
            - call: "GET /qdro-cases/{c2}/alternate-payee-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { ap_id: "$.data[0].id", ap_v: "$.data[0].version", ap_bal: "$.data[0].balance_cents" }
          trigger:
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v}", election: "DIRECT_ROLLOVER", gross_amount_cents: 400000 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { e_inst: $.data.error_id }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v}", election: "CASH", gross_amount_cents: 100000 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { cash_wh: $.data.federal_withheld_cents, cash_fee: $.data.admin_fee_cents, cash_net: $.data.net_amount_cents, cash_code: $.data.distribution_code }
            - call: "GET /alternate-payee-accounts/${ap_id}"
              payload: {}
              as: PlanAdministrator
              captures: { ap_v2: $.data.version }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v2}", election: "DIRECT_ROLLOVER", gross_amount_cents: 300000, rollover_institution: "Vanguard Fiduciary Trust" }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { ro_wh: $.data.federal_withheld_cents, ro_fee: $.data.admin_fee_cents, ro_net: $.data.net_amount_cents, ro_code: $.data.distribution_code }
          assert:
            - "${e_sep} == \"ERR_APPROACH_NOT_PERMITTED\" with HTTP 422 — SEPARATE_INTEREST is refused on P1 because the benefit has already commenced, even though the plan lists the approach as allowed."
            - "${e_shared} == \"ERR_APPROACH_NOT_PERMITTED\" with HTTP 422 — the SAME error from the opposite direction: SHARED_PAYMENT needs a commenced benefit and P2 has none, so the rule is a compatibility pair and not a plan-level allow-list check."
            - "${ok_status} == \"QUALIFIED\" and ${ap_bal} == 400000 — swapping only the approach on the same case, same participant and same balances qualifies, which isolates the condition to the participant's benefit_commenced flag."
            - "${e_inst} == \"ERR_ROLLOVER_INSTITUTION_REQUIRED\" with HTTP 422 — DIRECT_ROLLOVER without a receiving institution is refused, and nothing was debited."
            - "${cash_wh} == 20000, ${cash_fee} == 2500, ${cash_net} == 77500 and ${cash_code} == \"CODE_2\" — the identical body shape WITHOUT rollover_institution is valid for CASH, so the requirement is conditional on the election alone."
            - "${ro_wh} == 0, ${ro_fee} == 5000, ${ro_net} == 295000 and ${ro_code} == \"CODE_G\" — the rollover withholds nothing, so its net-before-fee of 300000 lands in the middle fee tier (5000) while the CASH net-before-fee of 80000 landed in the low tier (2500): the tier is keyed on the post-withholding figure."
            - "GET /alternate-payee-accounts/${ap_id} reports balance_cents 0, total_distributed_gross_cents 400000 and status \"CLOSED\" — only the two accepted distributions moved money, so the refused rollover truly had no effect."

      - name: priority_pair_conflicts_are_covered_by_the_difficulty_design
        claim_type: priority_conflict
        grounds:
          - validations[priority=40]
          - validations[priority=50]
          - validations[priority=55]
          - validations[priority=58]
          - validations[priority=62]
        distinguishing_aspect: |
          Adjacent-rung conflicts (own-state 409 before deficiency readiness, resubmission window before
          the revision cap, disclosure scope before attorney authorization) are the whole subject of the
          priority_pair_validation_conflict rule, each with both a conflict case and a control that shows
          the lower-priority rule still fires when the higher one is satisfied.
        excluded_because:
          difficulty_instance: qualify_state_check_precedes_deficiency_readiness_check
          rationale: |
            §1.8 already pins all three pairs (qualify state vs deficiency readiness, resubmission window
            vs revision cap, disclosure scope vs attorney authorization) with computed expectations on
            both sides of each pair. Repeating a pair here would duplicate the same assertions.

      - name: cross_entity_validation_is_covered_by_the_difficulty_design
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=52]
          - validations[priority=40]
          - errors.ERR_PLAN_PROCEDURES_NOT_PUBLISHED
          - errors.ERR_CASE_NOT_DENIED
        distinguishing_aspect: |
          Three validations read a state that lives on a different entity than the one being written: the
          plan's procedures_status gates qualification, the case's review_status gates hold release, and
          the authorization's status gates attorney communications.
        excluded_because:
          difficulty_instance: qualification_blocked_by_plan_procedures_amendment_pending
          rationale: |
            §1.8's cross_entity_state_dependency instances already test all three gates in both polarities
            — blocked while the remote entity is in the wrong state, permitted the moment it moves — using
            the same endpoints and error ids this instance would use.

      - name: aggregate_validation_is_covered_by_the_difficulty_design
        claim_type: aggregate_validation
        grounds:
          - validations[priority=62]
          - errors.ERR_HOLD_CAPACITY_EXCEEDED
          - calculations.hold_aggregate_exposure
        distinguishing_aspect: |
          Each hold is individually within the vested balance, yet their sum is not — the check has to be
          an aggregate over the other HELD holds on the same account rather than a per-request comparison.
        excluded_because:
          difficulty_instance: aggregate_segregation_hold_capacity_refused_though_each_is_legal
          rationale: |
            §1.8's resource_temporal_overlap instance already builds two concurrent cases on one account,
            proves each candidate hold is legal alone, and shows the second is refused only because of the
            first — including the control where releasing the first immediately frees the capacity.

      - name: cascading_validation_order_is_covered_by_the_difficulty_design
        claim_type: cascading_validation
        grounds:
          - validations[priority=55]
          - validations[priority=58]
          - errors.ERR_RESUBMISSION_WINDOW_CLOSED
          - errors.ERR_MAX_REVISIONS_EXCEEDED
        distinguishing_aspect: |
          The revision-cap check is only meaningful once the window check has passed, so the two must run
          in a fixed order on the same request rather than being reported by whichever query finishes.
        excluded_because:
          difficulty_instance: resubmission_window_check_precedes_revision_cap_check
          rationale: |
            §1.8 already drives a draft to the revision cap and then closes the window on top of it, so the
            ordering is asserted there with both errors observed from the same endpoint.

      - name: marital_period_overlap_validation_is_covered_by_the_difficulty_design
        claim_type: temporal_validation
        grounds:
          - validations[priority=60]
          - errors.ERR_MARITAL_PERIOD_OVERLAP
        distinguishing_aspect: |
          Two cases on one participant may not claim overlapping marital periods, but half-open adjacency
          (one period ending exactly where the next begins) must be accepted — an inclusive comparison
          rejects a legal filing.
        excluded_because:
          difficulty_instance: marital_period_half_open_adjacency_allowed_overlap_refused
          rationale: |
            §1.8's resource_temporal_overlap instance already tests the adjacency boundary and the
            one-day overlap on either side, plus the open-ended (null marital_period_end) case.

  - section: endpoints
    instances:
      - name: creations_return_201_actions_return_200_and_both_are_immediately_reachable
        claim_type: standard_crud
        grounds:
          - endpoints[POST /plans]
          - endpoints[POST /participants]
          - endpoints[POST /plan-accounts/{id}/money-sources]
          - endpoints[POST /plans/{id}/procedure-status]
          - endpoints[GET /plans/{id}/participants]
          - endpoints[GET /plan-accounts/{id}/money-sources]
        distinguishing_aspect: |
          The API has no PUT, PATCH or DELETE at all: every mutation is either a creation (declared 201)
          or a named action that returns the mutated resource with 200. The two families must not be
          conflated — an action endpoint that answers 201, or a creation that answers 200, is a contract
          break even when the body is right. Every created row must also be reachable through its declared
          list endpoint in the same instant, with no separate commit step.
        test_recipe:
          setup:
            - "Empty database, startup clock 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "CRUD Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id, plan_status: $.data.procedures_status, plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
              captures: { after_status: $.data.procedures_status, after_v: $.data.version }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Crud Member", ssn_last4: "2323", date_of_birth: "1971-03-03", participation_start_date: "2005-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id, emp: $.data.employment_status }
            - call: "GET /plans/${plan_id}/participants"
              payload: { employment_status: "ACTIVE", limit: 10, offset: 0 }
              as: QdroAnalyst
              captures: { listed_id: "$.data[0].id" }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "AFTER_TAX", balance_cents: 250000, basis_cents: 250000 }
              as: PlanAdministrator
              captures: { ms_id: $.data.id, ms_assignable: $.data.is_assignable }
            - call: "GET /plan-accounts/${acct_id}/money-sources"
              payload: {}
              as: Participant
              as_user_id: "${part_id}"
              captures: { ms_listed: "$.data[0].id", ms_listed_basis: "$.data[0].basis_cents" }
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: QdroAnalyst
              captures: { reread_status: $.data.procedures_status }
          assert:
            - "The four creations answered HTTP 201 (plan, participant, plan account, money source) while POST /plans/${plan_id}/procedure-status answered HTTP 200 and returned the mutated Plan, matching each endpoint's declared `code`."
            - "${plan_status} == \"DRAFT\" and ${plan_v} == 1 on creation; ${after_status} == \"PUBLISHED\" and ${after_v} == 2 — the action's own response already carries the new state and the incremented version, so no re-read is needed to observe it."
            - "${reread_status} == \"PUBLISHED\" — the re-read agrees with the action response."
            - "${listed_id} == ${part_id} and ${emp} == \"ACTIVE\" — the participant appears in the plan's list in the same instant, and the default employment_status is what makes the ACTIVE filter match."
            - "${ms_listed} == ${ms_id}, ${ms_listed_basis} == 250000 and ${ms_assignable} is true — the list echoes the stored row including the defaulted is_assignable."
            - "GET /participants/${part_id}/plan-accounts returns exactly 1 row whose vested_balance_cents is 250000 and after_tax_basis_cents is 250000 — the parent's derived fields were re-run by the child creation, not by a later job."

      - name: the_sweep_acts_on_the_eligible_rows_and_silently_skips_the_rest
        claim_type: bulk_action
        grounds:
          - endpoints[POST /_ops/run-segregation-sweep]
          - state_machines.SegregationHold.status
          - state_machines.DeficiencyNotice.status
          - calculations.hold_window_and_deadlines
        distinguishing_aspect: |
          The sweep is skip-based, not transactional: it must act on exactly the rows whose own deadline
          has passed and leave every other row untouched, including rows of the same type in the same
          phase. Its three phases are independent — an expired notice in phase 2 must NOT touch its draft
          order's status, even though phase 1 would have denied that same draft — and a second run
          immediately afterwards must be a pure no-op with empty id lists, because the first run moved
          every eligible row out of its candidate state. Two holds with different expiry instants prove the
          eligibility test is per-row rather than per-account or global.
        test_recipe:
          setup:
            - "One PUBLISHED plan (segregation_period_days 548, resubmission_window_days 60) with two participants, each with an assignable PRE_TAX_DEFERRAL source of 1000000."
            - "Case X: draft received at clock 2026-09-01 (hold expires 2028-03-02T00:00:00Z) with a deficiency notice issued the same day (deadline 2026-10-31T00:00:00Z)."
            - "Case Y: draft received at clock 2026-10-01 (hold expires 2028-04-02T00:00:00Z), clean, no notice."
          setup_api_calls:
            - call: "GET /segregation-holds"
              payload: { status: "HELD" }
              as: PlanAdministrator
              captures: { holdX: "$.data[0].id", holdY: "$.data[1].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { s1_eval: $.data.evaluated_count, s1_notices: "$.data.expired_notice_ids[0]" }
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { s2_eval: $.data.evaluated_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-02T00:00:01Z" }
              as: PlanAdministrator
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { s3_holds: "$.data.expired_hold_ids[0]", s3_cases: "$.data.lapsed_case_ids[0]", s3_drafts: "$.data.denied_draft_order_ids[0]" }
            - call: "GET /segregation-holds/${holdY}"
              payload: {}
              as: PlanAdministrator
              captures: { holdY_mid: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-05-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: PlanAdministrator
              captures: { s4_holds: "$.data.expired_hold_ids[0]" }
          assert:
            - "First sweep: ${s1_eval} == 3 (two HELD holds plus one ISSUED notice; no ESTABLISHED SHARED_PAYMENT account exists) and ${s1_notices} == case X's notice id, while expired_hold_ids, lapsed_case_ids, denied_draft_order_ids and closed_ap_account_ids are all empty — in 2026 no hold is anywhere near its 548-day expiry."
            - "Phase independence: after the first sweep GET /draft-orders/{draftX} still reports status \"DEFICIENT\" (never DENIED) and GET /qdro-cases/{caseX} still reports segregation_status \"HELD\" — expiring a notice does not lapse anything."
            - "Second sweep: ${s2_eval} == 2 and every id list is empty — the notice is no longer ISSUED, so re-running is a no-op and nothing is double-processed."
            - "Third sweep at 2028-03-02T00:00:01Z: ${s3_holds} == ${holdX}, ${s3_cases} == case X's id, ${s3_drafts} == draft X's id, and expired_notice_ids is empty because that notice was already EXPIRED — the full phase-1 cascade fires exactly once."
            - "${holdY_mid} == \"HELD\" — case Y's hold, one month from its own expiry, is skipped in the same sweep that destroyed case X's, so eligibility is evaluated per row."
            - "Case Y is fully intact after the third sweep: GET /draft-orders/{draftY} reports \"UNDER_REVIEW\" and GET /qdro-cases/{caseY} reports review_status \"UNDER_REVIEW\" with segregation_status \"HELD\" and an unchanged version."
            - "Fourth sweep at 2028-05-01: ${s4_holds} == ${holdY} and its cascade fires now, while case X's rows are not revisited — GET /qdro-cases/{caseX} reports the same version it had after the third sweep, so terminal rows are never re-swept."

      - name: an_attorney_is_linked_to_exactly_one_case_and_only_through_a_live_authorization
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /qdro-cases/{id}/attorney-authorizations]
          - endpoints[POST /draft-orders]
          - endpoints[GET /draft-orders]
          - validations[priority=35]
          - validations[priority=36]
          - errors.ERR_NOT_RESOURCE_OWNER
          - errors.ERR_ATTORNEY_NOT_AUTHORIZED
        distinguishing_aspect: |
          An Attorney's identity IS the authorization row, so the link is three-way: the acting id must
          resolve to an authorization on the case reached from the target resource (priority 35), that
          authorization must be ACTIVE and inside its effective window (priority 36), and on
          POST /draft-orders a body attorney_authorization_id must equal the acting id — an attorney
          cannot file under a colleague's authorization even on a case where both are authorized. The two
          refusals are one rung apart and must not be swapped: a stranger to the case gets
          ERR_NOT_RESOURCE_OWNER, a revoked insider gets ERR_ATTORNEY_NOT_AUTHORIZED.
        test_recipe:
          setup:
            - "Two cases on two participants of the same PUBLISHED plan, both with an assignable PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30. Clock 2026-09-01."
            - "Case A has authorization AUTH_A1 (represents PARTICIPANT, disclosure_scope FULL, effective 2026-08-01 to 2027-08-01) and AUTH_A2 (represents ALTERNATE_PAYEE, scope LIMITED, same window). Case B has authorization AUTH_B1 (represents PARTICIPANT, scope FULL, same window)."
          setup_api_calls:
            - call: "GET /qdro-cases/{caseA}/attorney-authorizations"
              payload: { represents: "PARTICIPANT" }
              as: PlanAdministrator
              captures: { authA1: "$.data[0].id" }
            - call: "GET /qdro-cases/{caseA}"
              payload: {}
              as: PlanAdministrator
              captures: { caseA_v: $.data.version }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{caseA}", expected_case_version: "${caseA_v}", document_reference: "DRO-2663-XREF-a", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, attorney_authorization_id: "${authA1}" }
              as: Attorney
              as_user_id: "{authB1}"
              captures: { e_stranger: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{caseA}", expected_case_version: "${caseA_v}", document_reference: "DRO-2663-XREF-a", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, attorney_authorization_id: "{authA2}" }
              as: Attorney
              as_user_id: "${authA1}"
              captures: { e_borrowed: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{caseA}", expected_case_version: "${caseA_v}", document_reference: "DRO-2663-XREF-a", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, attorney_authorization_id: "${authA1}" }
              as: Attorney
              as_user_id: "${authA1}"
              captures: { draft_id: $.data.id, draft_auth: $.data.attorney_authorization_id, draft_status: $.data.status }
            - call: "GET /draft-orders"
              payload: { attorney_authorization_id: "${authA1}", limit: 10, offset: 0 }
              as: Attorney
              as_user_id: "${authA1}"
              captures: { filtered_id: "$.data[0].id" }
            - call: "POST /attorney-authorizations/${authA1}/revoke"
              payload: {}
              as: PlanAdministrator
              captures: { revoked_status: $.data.status }
            - call: "GET /draft-orders/${draft_id}"
              payload: {}
              as: Attorney
              as_user_id: "${authA1}"
              captures: { e_revoked: $.data.error_id }
          assert:
            - "${e_stranger} == \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 — case B's attorney cannot file on case A even though the BODY names a valid case-A authorization: priority 35 resolves the acting identity against the case reached from the request before any body check."
            - "${e_borrowed} == \"ERR_ATTORNEY_NOT_AUTHORIZED\" with HTTP 403 — AUTH_A1 acting under AUTH_A2's number is refused at priority 36; both rows are on the same case and both are ACTIVE, so only the equality rule can explain the refusal."
            - "${draft_status} == \"UNDER_REVIEW\" with HTTP 201 and ${draft_auth} == ${authA1} — the third call differs from the second only in the body id and succeeds, and the link is stored on the draft."
            - "${filtered_id} == ${draft_id} — GET /draft-orders filtered by attorney_authorization_id returns the linked draft, so the association is queryable from both ends."
            - "${revoked_status} == \"REVOKED\", and afterwards ${e_revoked} == \"ERR_ATTORNEY_NOT_AUTHORIZED\" with HTTP 403 — the SAME identity that just created the draft can no longer even read it, so authorization is evaluated per request against the live row rather than captured at filing time."
            - "The draft itself survives the revocation: GET /draft-orders/${draft_id} as PlanAdministrator still reports status \"UNDER_REVIEW\" with attorney_authorization_id ${authA1} — revoking an authorization is not a cascade over the work already filed."

      - name: action_endpoint_preconditions_are_covered_by_the_difficulty_design
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /draft-orders/{id}/qualify]
          - endpoints[POST /draft-orders/{id}/resubmit]
          - endpoints[POST /draft-orders/{id}/deficiency-notices]
        distinguishing_aspect: |
          The three review actions form the non-linear core of the API: each has an ordered precondition
          list and a multi-level side-effect list, and the revision cycle must return to UNDER_REVIEW
          without forgetting the reviewer identity or resetting the revision counter.
        excluded_because:
          difficulty_instance: draft_order_deficiency_revision_cycle_preserves_review_memory
          rationale: |
            §1.8 already drives notice -> resubmit -> notice -> resubmit -> qualify on one draft with the
            reviewer memory, revision_number and per-notice deadlines asserted at every step, which
            subsumes a per-action precondition instance here.

      - name: computed_read_of_the_benefit_projection_is_covered_by_the_difficulty_design
        claim_type: computed_read
        grounds:
          - endpoints[GET /qdro-cases/{id}/benefit-projection]
          - calculations.benefit_assignment_projection
        distinguishing_aspect: |
          The projection endpoint prices both approaches from the same stored data without mutating
          anything, so its output must match the calculation chain exactly for whichever approach the
          caller names.
        excluded_because:
          difficulty_instance: separate_interest_versus_shared_payment_projection_divergence
          rationale: |
            §1.8's dual_variant instance already reads the endpoint under both approaches on one case and
            pins every field of both projections plus their delta.

      - name: conditional_action_gating_is_covered_by_the_difficulty_design
        claim_type: conditional_action
        grounds:
          - endpoints[POST /segregation-holds/{id}/release]
          - endpoints[POST /distributions/{id}/void]
        distinguishing_aspect: |
          Release and void are both allowed only under a condition that lives outside the request — the
          case must already be DENIED, the tax year must still be open.
        excluded_because:
          difficulty_instance: hold_release_blocked_until_case_review_status_denied
          rationale: |
            §1.8 already tests release in both polarities against the case's review_status, and the void
            condition is pinned by the temporal_validation instance in this file's validations section.

  # Error-catalog coverage audit: all 47 §1.6 ids are triggered by a recipe in this file or in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml. The two 412 stale-version ids are triggered by the
  # optimistic_concurrency instances in cross_cutting_complexity_layers below; the two residual ids
  # (ERR_NO_ACTIVE_DRAFT_ORDER, ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE) are triggered here.
  - section: errors
    instances:
      - name: prerequisite_errors_fire_when_the_object_of_the_action_does_not_exist_yet
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_ACTIVE_DRAFT_ORDER
          - errors.ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE
          - validations[priority=62]
          - validations[priority=70]
        distinguishing_aspect: |
          Two errors describe a missing prerequisite rather than a bad request, and both are one unit away
          from success. A case in INTAKE has no operative draft order, so a manual communication about it
          has nothing to describe — but the identical call succeeds the moment a draft is received, so the
          check is on the case's draft set and not on the case's existence. A distribution of exactly the
          account balance must be accepted while balance + 1 is refused, which is the only way to show the
          comparison is `>` against the live balance rather than `>=` or a comparison against the original
          assignment.
        test_recipe:
          setup:
            - "A PUBLISHED plan, a participant with an assignable PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30, and a case created at clock 2026-09-01 that is still in review_status INTAKE with segregation_status NONE."
          setup_api_calls:
            - call: "GET /qdro-cases/{case_id}"
              payload: {}
              as: QdroAnalyst
              captures: { rs: $.data.review_status, ss: $.data.segregation_status, case_v: $.data.version }
          trigger:
            - call: "POST /qdro-cases/{case_id}/communications"
              payload: { recipient_type: "PARTICIPANT", template_code: "RECEIPT_ACKNOWLEDGMENT", disclosure_level: "FULL" }
              as: QdroAnalyst
              captures: { e_no_draft: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-PREREQ", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "POST /qdro-cases/{case_id}/communications"
              payload: { recipient_type: "PARTICIPANT", template_code: "STATUS_UPDATE", disclosure_level: "FULL" }
              as: QdroAnalyst
              captures: { ok_comm: $.data.id, ok_origin: $.data.origin }
            - call: "POST /draft-orders/${draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-9"
              captures: { qualified: $.data.status }
            - call: "GET /qdro-cases/{case_id}/alternate-payee-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { ap_id: "$.data[0].id", ap_v: "$.data[0].version", ap_bal: "$.data[0].balance_cents" }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v}", election: "CASH", gross_amount_cents: 400001 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { e_over: $.data.error_id }
            - call: "POST /alternate-payee-accounts/${ap_id}/distributions"
              payload: { expected_ap_account_version: "${ap_v}", election: "CASH", gross_amount_cents: 400000 }
              as: AlternatePayee
              as_user_id: "${ap_id}"
              captures: { ok_gross: $.data.gross_amount_cents, ok_net: $.data.net_amount_cents }
          assert:
            - "${rs} == \"INTAKE\" and ${ss} == \"NONE\" — the case exists and is readable, which is why the refusal cannot be a 404."
            - "${e_no_draft} == \"ERR_NO_ACTIVE_DRAFT_ORDER\" with HTTP 409 — a manual communication on a case with no draft order is refused at priority 62, after the role and ownership rungs have passed."
            - "${ok_comm} is a new id with ${ok_origin} == \"MANUAL\" — the same endpoint, same role and same case succeed once a draft exists, isolating the prerequisite to the draft set."
            - "${qualified} == \"QUALIFIED\" and ${ap_bal} == 400000 — the segregated 40% of the 1000000 account is the payee's entire distributable balance."
            - "${e_over} == \"ERR_INSUFFICIENT_DISTRIBUTABLE_BALANCE\" with HTTP 409 — one cent over the balance is refused at priority 70, and GET /alternate-payee-accounts/${ap_id} still reports balance_cents 400000 with total_distributed_gross_cents 0."
            - "${ok_gross} == 400000 and ${ok_net} == 315000 (withholding 80000, fee 5000) — exactly the balance is permitted, so the boundary is strict inequality; the account then reports balance_cents 0 and status \"CLOSED\"."

      - name: one_error_id_keeps_one_status_and_one_envelope_shape_wherever_it_is_raised
        claim_type: error_envelope_consistency
        grounds:
          - response_envelope.error
          - errors.ERR_QDRO_CASE_NOT_FOUND
          - errors.ERR_FORBIDDEN_ROLE
          - validations[priority=30]
          - validations[priority=32]
          - validations[priority=20]
        distinguishing_aspect: |
          The same error id is reachable from different rungs and different endpoints —
          ERR_QDRO_CASE_NOT_FOUND from a path id at priority 30 and from a body foreign key at priority 32,
          ERR_FORBIDDEN_ROLE from an administrator-only endpoint and from an analyst-only endpoint — and
          every one of those responses must carry the identical status and the identical envelope: meta
          with api_request_id and api_request_timestamp, response_type "error", and a data object holding
          exactly error_id and message. A partially-populated envelope on the error path (no meta, or a
          data payload that leaks the resource) is the common failure.
        test_recipe:
          setup:
            - "A PUBLISHED plan with one participant and one INTAKE case; the plan administrator and the analyst are distinct opaque identities."
          setup_api_calls:
            - call: "GET /qdro-cases/{case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { case_v: $.data.version }
          trigger:
            - call: "GET /qdro-cases/00000000-0000-4000-8000-0000000000e1"
              payload: {}
              as: PlanAdministrator
              captures: { e_path: $.data.error_id, m_path: $.data.message }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "00000000-0000-4000-8000-0000000000e1", expected_case_version: "${case_v}", document_reference: "DRO-2663-ENV", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: PlanAdministrator
              captures: { e_body: $.data.error_id, m_body: $.data.message }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: QdroAnalyst
              captures: { e_role_a: $.data.error_id }
            - call: "POST /qdro-cases/{case_id}/communications"
              payload: { recipient_type: "PARTICIPANT", template_code: "STATUS_UPDATE", disclosure_level: "FULL" }
              as: PlanAdministrator
              captures: { e_role_b: $.data.error_id }
          assert:
            - "${e_path} == \"ERR_QDRO_CASE_NOT_FOUND\" and ${e_body} == \"ERR_QDRO_CASE_NOT_FOUND\", both HTTP 404 — the same id from two different priority rungs and two different endpoints, never a 400 for the body case."
            - "${m_path} and ${m_body} are both non-empty strings; nothing in the suite depends on their text, and neither echoes the unknown UUID as if it were a resource."
            - "${e_role_a} == \"ERR_FORBIDDEN_ROLE\" and ${e_role_b} == \"ERR_FORBIDDEN_ROLE\", both HTTP 403 — the administrator is NOT a superset of the analyst, so the two exclusive families deny each other symmetrically with one id."
            - "All four responses carry a meta object with a non-empty api_request_id and api_request_timestamp, response_type == \"error\", and a data object whose ONLY keys are error_id and message."
            - "None of the four mutated anything: GET /qdro-cases/{case_id} still reports version ${case_v} and review_status \"INTAKE\", and GET /draft-orders returns an empty data array with total_count 0."

      - name: review_path_error_family_is_covered_by_the_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DRAFT_ORDER_NOT_UNDER_REVIEW
          - errors.ERR_QUALIFICATION_DEFICIENCIES_PRESENT
          - errors.ERR_DRAFT_ORDER_NOT_DEFICIENT
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_MAX_REVISIONS_EXCEEDED
          - errors.ERR_RESUBMISSION_WINDOW_CLOSED
        distinguishing_aspect: |
          The review path raises six ids that only appear together on a draft order that has been through
          at least one deficiency cycle, so they are cheapest to trigger from a single long chain rather
          than from six independent fixtures.
        excluded_because:
          difficulty_instance: draft_order_deficiency_revision_cycle_preserves_review_memory
          rationale: |
            §1.8's non_linear_state_machine and priority_pair instances already raise every one of these
            ids from the same revision chain, each with the competing rule satisfied so the id is
            unambiguous.

  - section: rbac
    instances:
      - name: the_two_opaque_roles_deny_each_others_exclusive_operations_symmetrically
        claim_type: exclusive_operation_denial
        grounds:
          - roles.PlanAdministrator
          - roles.QdroAnalyst
          - validations[priority=20]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          This is deliberately NOT a hierarchy: the administrator holds the determination powers (qualify,
          deny, release, void, revoke, clock, sweep, and all plan/participant/account setup) and the
          analyst holds the review-correspondence powers (deficiency notices, manual communications), and
          NEITHER can perform the other's exclusives. An implementation that treats PlanAdministrator as a
          superuser passes every administrator test and still breaks the segregation the plan's procedures
          depend on. The denials must also beat every later rung: the analyst's attempt to qualify a
          perfectly qualifiable draft is a 403, not a 409 or a 200.
        test_recipe:
          setup:
            - "A PUBLISHED plan with a participant, an assignable PRE_TAX_DEFERRAL source of 1000000, a snapshot on 2026-06-30, a case at clock 2026-09-01 and one clean UNDER_REVIEW draft order (so qualification would otherwise succeed) plus a HELD hold."
            - "A second case whose draft is deficient, so a deficiency notice would otherwise be issuable."
          setup_api_calls:
            - call: "GET /draft-orders"
              payload: { status: "UNDER_REVIEW", limit: 10, offset: 0 }
              as: PlanAdministrator
              captures: { clean_draft: "$.data[0].id" }
          trigger:
            - call: "POST /draft-orders/${clean_draft}/qualify"
              payload: {}
              as: QdroAnalyst
              as_user_id: "analyst-2"
              captures: { e_qualify: $.data.error_id }
            - call: "POST /draft-orders/${clean_draft}/deny"
              payload: { denial_reason: "ORDER_NOT_QUALIFIABLE" }
              as: QdroAnalyst
              as_user_id: "analyst-2"
              captures: { e_deny: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: QdroAnalyst
              captures: { e_clock: $.data.error_id }
            - call: "POST /_ops/run-segregation-sweep"
              payload: {}
              as: QdroAnalyst
              captures: { e_sweep: $.data.error_id }
            - call: "POST /plans"
              payload: { plan_name: "Analyst Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: QdroAnalyst
              captures: { e_plan: $.data.error_id }
            - call: "POST /draft-orders/{deficient_draft}/deficiency-notices"
              payload: { reviewer_notes: "administrator attempt" }
              as: PlanAdministrator
              captures: { e_notice: $.data.error_id }
            - call: "POST /qdro-cases/{case2}/communications"
              payload: { recipient_type: "PARTICIPANT", template_code: "STATUS_UPDATE", disclosure_level: "FULL" }
              as: PlanAdministrator
              captures: { e_comm: $.data.error_id }
            - call: "POST /draft-orders/{deficient_draft}/deficiency-notices"
              payload: { reviewer_notes: "analyst does its own job" }
              as: QdroAnalyst
              as_user_id: "analyst-2"
              captures: { ok_notice: $.data.id }
            - call: "POST /draft-orders/${clean_draft}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-2"
              captures: { ok_qualified: $.data.status }
          assert:
            - "${e_qualify}, ${e_deny}, ${e_clock}, ${e_sweep} and ${e_plan} are all \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — five of the administrator's thirteen exclusive operations refused to the analyst."
            - "${e_notice} and ${e_comm} are both \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — the analyst's two exclusive operations refused to the ADMINISTRATOR, which is the asymmetry-breaking assertion."
            - "${e_qualify} is a 403 even though the draft is fully qualifiable — the role rung at priority 20 runs before every state, window and readiness check, so the analyst never learns whether the order would have qualified."
            - "${ok_notice} is a new id and ${ok_qualified} == \"QUALIFIED\" — each role performs its own exclusives on the same fixtures that refused the other, so the denials are about identity and not about state."
            - "None of the seven refusals mutated anything: GET /draft-orders/${clean_draft} reported \"UNDER_REVIEW\" with an unchanged version until the administrator's own call, GET /draft-orders/{deficient_draft}/deficiency-notices returned 0 rows before the analyst's call, and no new plan id was minted for the analyst's POST /plans attempt (its response carried no $.data.id at all, only the error object)."

      - name: entity_backed_roles_reach_their_own_rows_and_nothing_else
        claim_type: shared_operation_access
        grounds:
          - roles.Participant
          - roles.AlternatePayee
          - validations[priority=10]
          - validations[priority=35]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          Participant and AlternatePayee are peer roles whose X-User-ID IS an entity id, so authorization is
          a graph walk rather than a flag: a participant reaches a draft order only through
          draft -> case -> participant, and an alternate payee reaches a distribution only through
          distribution -> account. Both must be able to exercise their shared operations on their own rows
          — including POST /draft-orders, which a participant may file on their OWN case only — and both
          must be refused on the other party's rows with ERR_NOT_RESOURCE_OWNER rather than a 404 that
          would leak nothing or a 403 role error that would blame the role itself.
        test_recipe:
          setup:
            - "One PUBLISHED plan with participants P1 and P2, each with an assignable PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30, and one case each (C1 on P1, C2 on P2) at clock 2026-09-01."
            - "C2 is already qualified, so payee account AP2 exists with a balance of 400000."
          setup_api_calls:
            - call: "GET /qdro-cases/{c1}"
              payload: {}
              as: PlanAdministrator
              captures: { c1_v: $.data.version }
            - call: "GET /qdro-cases/{c2}"
              payload: {}
              as: PlanAdministrator
              captures: { c2_v: $.data.version }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{c1}", expected_case_version: "${c1_v}", document_reference: "DRO-2663-OWN", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: Participant
              as_user_id: "{p1}"
              captures: { own_draft: $.data.id, own_status: $.data.status }
            - call: "GET /participants/{p1}/qdro-cases"
              payload: { review_status: "UNDER_REVIEW" }
              as: Participant
              as_user_id: "{p1}"
              captures: { own_case: "$.data[0].id" }
            - call: "GET /qdro-cases/{c2}"
              payload: {}
              as: Participant
              as_user_id: "{p1}"
              captures: { e_other_case: $.data.error_id }
            - call: "GET /participants/{p2}"
              payload: {}
              as: Participant
              as_user_id: "{p1}"
              captures: { e_other_participant: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{c2}", expected_case_version: "${c2_v}", document_reference: "DRO-2663-FOREIGN", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: Participant
              as_user_id: "{p1}"
              captures: { e_foreign_file: $.data.error_id }
            - call: "GET /alternate-payee-accounts/{ap2}"
              payload: {}
              as: AlternatePayee
              as_user_id: "{ap2}"
              captures: { ap_bal: $.data.balance_cents }
            - call: "GET /alternate-payee-accounts/{ap2}"
              payload: {}
              as: AlternatePayee
              as_user_id: "00000000-0000-4000-8000-0000000000b2"
              captures: { e_other_ap: $.data.error_id }
            - call: "GET /qdro-cases/{c1}"
              payload: {}
              as: NO_CREDENTIALS
              captures: { e_anon: $.data.error_id }
          assert:
            - "${own_status} == \"UNDER_REVIEW\" and ${own_case} == \"{c1}\" — P1 files on their own case and sees only their own case in the participant-scoped list."
            - "${e_other_case} and ${e_other_participant} are both \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 — P1 cannot read P2's case or participant record even though Participant is an allowed role on both endpoints, so the check is the ownership walk at priority 35 and not the role rung at 20."
            - "${e_foreign_file} == \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 — filing on someone else's case is refused by ownership before the case version at priority 44 is ever compared, and a perfectly fresh expected_case_version does not change the answer."
            - "${ap_bal} == 400000 for the owning payee, while ${e_other_ap} == \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 for a different AlternatePayee id on the same path — the AlternatePayee identity must equal the account id in the path."
            - "${e_anon} == \"ERR_UNAUTHENTICATED\" with HTTP 401 — the same read that P1 is entitled to is refused outright with no credentials, and 401 precedes both 403 rungs."
            - "GET /draft-orders as P1 returns exactly the one draft ${own_draft} — list endpoints are scoped by the acting identity rather than returning every row with a filter applied afterwards."

      - name: segregation_of_duties_is_covered_by_the_difficulty_design
        claim_type: segregation_of_duties
        grounds:
          - roles.QdroAnalyst
          - validations[priority=38]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          The X-User-ID that issued a deficiency notice on a draft order can never qualify that same order,
          and the memory survives the whole revision cycle — the marker is not cleared when the draft
          returns to UNDER_REVIEW.
        excluded_because:
          difficulty_instance: draft_order_deficiency_revision_cycle_preserves_review_memory
          rationale: |
            §1.8 already asserts ERR_SEGREGATION_OF_DUTIES after the resubmission has moved the draft back
            to UNDER_REVIEW, and then qualifies the same draft under a different X-User-ID, which is the
            complete claim for this role model.

  - section: cross_cutting_complexity_layers
    instances:
      - name: a_second_draft_filed_on_a_stale_case_version_is_refused_and_supersedes_nothing
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.draft-order-supersede-stale-case
          - endpoints[POST /draft-orders]
          - validations[priority=44]
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: |
          This is the §1.2.1 rule `draft-order-supersede-stale-case` in full: the write endpoint is
          POST /draft-orders, the OCC field is expected_case_version and the failure is
          ERR_STALE_CASE_VERSION (412). Receiving a draft mutates the CASE (review_status and version), so
          the version a client read before its own first submission is already stale for the second — the
          replay must be refused rather than silently superseding the live draft, and the refusal must not
          place a second hold or supersede anything. Re-reading the case and retrying with the fresh
          version then does supersede, so the guard is the version comparison and nothing else.
        test_recipe:
          setup:
            - "A PUBLISHED plan, a participant with an assignable PRE_TAX_DEFERRAL source of 1000000 and a snapshot on 2026-06-30, and one case in INTAKE at clock 2026-09-01."
          setup_api_calls:
            - call: "GET /qdro-cases/{case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { v1: $.data.version, rs1: $.data.review_status }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{case_id}", expected_case_version: "${v1}", document_reference: "DRO-2663-OCC-1", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { d1: $.data.id, d1_status: $.data.status }
            - call: "GET /qdro-cases/{case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { v2: $.data.version, rs2: $.data.review_status }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{case_id}", expected_case_version: "${v1}", document_reference: "DRO-2663-OCC-replay", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 3000 }
              as: QdroAnalyst
              captures: { e_stale: $.data.error_id }
            - call: "GET /draft-orders/${d1}"
              payload: {}
              as: PlanAdministrator
              captures: { d1_after: $.data.status, d1_pct: $.data.proposed_percentage_bps }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "{case_id}", expected_case_version: "${v2}", document_reference: "DRO-2663-OCC-2", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 3000 }
              as: QdroAnalyst
              captures: { d2: $.data.id, d2_status: $.data.status }
            - call: "GET /draft-orders/${d1}"
              payload: {}
              as: PlanAdministrator
              captures: { d1_final: $.data.status }
            - call: "GET /qdro-cases/{case_id}"
              payload: {}
              as: PlanAdministrator
              captures: { v3: $.data.version }
          assert:
            - "${rs1} == \"INTAKE\" with ${v1} == 1, and after the first receipt ${rs2} == \"UNDER_REVIEW\" with ${v2} == 2 — the write bumped the CASE version, which is what makes the client's cached ${v1} stale."
            - "${e_stale} == \"ERR_STALE_CASE_VERSION\" with HTTP 412 — the replayed submission is refused on the version alone; every other field in it is valid."
            - "${d1_after} == \"UNDER_REVIEW\" and ${d1_pct} == 4000 — the refused replay did NOT supersede the live draft and did not overwrite its percentage."
            - "The refused replay created nothing: GET /draft-orders with qdro_case_id={case_id} returns exactly 1 row, GET /segregation-holds with qdro_case_id={case_id} returns exactly 1 HELD hold, and GET /plan-accounts/{acct} still reports held_amount_cents 400000 (not 700000, which is what a second 30% hold would have added)."
            - "${d2_status} == \"UNDER_REVIEW\" and ${d1_final} == \"SUPERSEDED\" — the identical body with the FRESH version is accepted and does supersede, so the endpoint's supersede behaviour is intact and only the stale replay was blocked."
            - "${v3} == 3 — every accepted write increments the case version by exactly one, so the OCC token advances monotonically and a client that keeps re-reading always converges."

      - name: a_distribution_elected_against_a_stale_payee_account_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.distribution-stale-ap-account
          - endpoints[POST /alternate-payee-accounts/{id}/distributions]
          - endpoints[POST /distributions/{id}/void]
          - validations[priority=44]
          - errors.ERR_STALE_AP_ACCOUNT_VERSION
        distinguishing_aspect: |
          This is the §1.2.1 rule `distribution-stale-ap-account`: the write endpoint is
          POST /alternate-payee-accounts/{id}/distributions, the OCC field is expected_ap_account_version
          and the failure is ERR_STALE_AP_ACCOUNT_VERSION (412). Every distribution debits the account, so
          a double-submitted election is exactly the double-payment this guard exists to stop. A VOID also
          bumps the account version, so a client holding a pre-void token is stale too even though the
          balance has been restored to what it saw — proving the token is a version counter and not a
          balance check.
        test_recipe:
          setup:
            - "A qualified SEPARATE_INTEREST case whose alternate payee account holds 400000 with after_tax_basis_cents 0, established at clock 2026-09-15."
          setup_api_calls:
            - call: "GET /alternate-payee-accounts/{ap_id}"
              payload: {}
              as: AlternatePayee
              as_user_id: "{ap_id}"
              captures: { av1: $.data.version, ab1: $.data.balance_cents }
          trigger:
            - call: "POST /alternate-payee-accounts/{ap_id}/distributions"
              payload: { expected_ap_account_version: "${av1}", election: "CASH", gross_amount_cents: 100000 }
              as: AlternatePayee
              as_user_id: "{ap_id}"
              captures: { dist1: $.data.id, dist1_net: $.data.net_amount_cents }
            - call: "POST /alternate-payee-accounts/{ap_id}/distributions"
              payload: { expected_ap_account_version: "${av1}", election: "CASH", gross_amount_cents: 100000 }
              as: AlternatePayee
              as_user_id: "{ap_id}"
              captures: { e_stale1: $.data.error_id }
            - call: "GET /alternate-payee-accounts/{ap_id}"
              payload: {}
              as: AlternatePayee
              as_user_id: "{ap_id}"
              captures: { av2: $.data.version, ab2: $.data.balance_cents }
            - call: "POST /alternate-payee-accounts/{ap_id}/distributions"
              payload: { expected_ap_account_version: "${av2}", election: "CASH", gross_amount_cents: 100000 }
              as: AlternatePayee
              as_user_id: "{ap_id}"
              captures: { dist2: $.data.id, dist2_net: $.data.net_amount_cents }
            - call: "POST /distributions/${dist2}/void"
              payload: {}
              as: PlanAdministrator
              captures: { void_status: $.data.status }
            - call: "POST /alternate-payee-accounts/{ap_id}/distributions"
              payload: { expected_ap_account_version: "${av2}", election: "CASH", gross_amount_cents: 100000 }
              as: AlternatePayee
              as_user_id: "{ap_id}"
              captures: { e_stale2: $.data.error_id }
            - call: "GET /alternate-payee-accounts/{ap_id}"
              payload: {}
              as: AlternatePayee
              as_user_id: "{ap_id}"
              captures: { av4: $.data.version, ab4: $.data.balance_cents }
          assert:
            - "${av1} == 1 and ${ab1} == 400000 at establishment; the first election succeeds with ${dist1_net} == 77500."
            - "${e_stale1} == \"ERR_STALE_AP_ACCOUNT_VERSION\" with HTTP 412 — the duplicate submission is refused, and GET /alternate-payee-accounts/{ap_id}/distributions returns exactly 1 ISSUED row, so no double payment occurred."
            - "${av2} == 2 and ${ab2} == 300000 — the accepted distribution bumped the version and debited the balance in the same request."
            - "${dist2_net} == 77500 with HTTP 201 — the retry with the fresh token succeeds, so the guard is purely the version."
            - "${void_status} == \"VOIDED\" and ${ab4} == 300000 — the void restored the balance to exactly what the client saw when it captured ${av2}."
            - "${e_stale2} == \"ERR_STALE_AP_ACCOUNT_VERSION\" with HTTP 412 and ${av4} == 4 — even though the BALANCE matches the client's view again, the pre-void token is stale because the distribution and the void each incremented the version, so the token is a counter and not a checksum of the money fields."

      - name: cascading_side_effects_are_covered_by_the_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /draft-orders/{id}/qualify]
          - endpoints[POST /_ops/run-segregation-sweep]
          - endpoints[POST /distributions/{id}/void]
        distinguishing_aspect: |
          Three multi-level chains exist — qualification (six levels), the segregation lapse sweep (five
          levels) and the distribution void compensation (three levels) — and each must be verified
          end-to-end including the ordering of the appended communications.
        excluded_because:
          difficulty_instance: qualification_six_level_segregation_to_payee_cascade
          rationale: |
            §1.8's three transitive_cascade instances already walk all three chains level by level with the
            derived balances, the communication ordering and the version increments pinned at each level.

      - name: dual_variant_calculations_are_covered_by_the_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.benefit_assignment_projection
          - calculations.distribution_settlement
          - calculations.earnings_growth_bps
        distinguishing_aspect: |
          Three calculations carry variants — the approach (separate interest vs shared payment), the
          election (cash vs direct rollover) and the plan's earnings method (period end vs pro-rata daily)
          — and each pair must diverge on identical stored data.
        excluded_because:
          difficulty_instance: separate_interest_versus_shared_payment_projection_divergence
          rationale: |
            §1.8's three dual_variant_calc instances already pin both branches and the exact delta for all
            three pairs, including the variant-selection rule that decides which branch applies.

      - name: rate_threshold_triggers_are_covered_by_the_difficulty_design
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.distribution_settlement
          - calculations.gross_assigned_amount
        distinguishing_aspect: |
          Two thresholds must be tested exactly at their boundary: the 20000-cent taxable floor that turns
          on 20% mandatory withholding, and the administrative fee tier edges at 100000 and 999999.
        excluded_because:
          difficulty_instance: withholding_triggers_at_exactly_twenty_thousand_taxable_cents
          rationale: |
            §1.8's boundary_precision_check and combinatorial_formula instances already probe the
            withholding floor at 19999 / 20000 / 20001 taxable cents and both fee tier edges.

      - name: derived_field_reconciliation_is_covered_by_the_difficulty_design
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.plan_account_derived_balances
          - calculations.ap_account_derived_totals
          - calculations.tax_report_net_position
        distinguishing_aspect: |
          Three families of derived fields must reconcile after every mutation in either direction: the
          plan account's held and available balances, the payee account's distributed totals, and the
          append-only tax ledger's net position.
        excluded_because:
          difficulty_instance: custody_conservation_across_supersede_conversion_and_release
          rationale: |
            §1.8's two compensating_invariant instances already assert the conservation identity after
            supersede, conversion, release and void, and that the tax ledger nets to zero once a
            distribution is voided.

  - section: consistency_model
    instances:
      - name: every_cascade_level_is_visible_in_the_same_instant_it_was_written
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /draft-orders/{id}/qualify]
          - calculations.plan_account_derived_balances
          - calculations.ap_account_derived_totals
        distinguishing_aspect: |
          The consistency model is `immediate`, so there is no lag anywhere and no background settling: the
          qualification response itself must already show the draft QUALIFIED, and reads issued immediately
          afterwards — with no sweep, no clock movement and no second write — must show the converted hold,
          the lapsed availability, the new payee account, the bumped case version and both appended
          communications. A design that defers any derived field to the next request (or to the sweep) is
          observable here as a stale read on the very next call.
        test_recipe:
          setup:
            - "A PUBLISHED plan, a participant with an assignable PRE_TAX_DEFERRAL source of 1000000 (basis 0) and a snapshot on 2026-06-30 of 1000000, a case at clock 2026-09-01 with a clean 4000 bps SEPARATE_INTEREST draft and a HELD hold of 400000."
          setup_api_calls:
            - call: "GET /plan-accounts/{acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { before_held: $.data.held_amount_cents, before_avail: $.data.available_balance_cents }
          trigger:
            - call: "POST /draft-orders/{draft_id}/qualify"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-11"
              captures: { q_status: $.data.status }
            - call: "GET /plan-accounts/{acct_id}"
              payload: {}
              as: PlanAdministrator
              captures: { after_held: $.data.held_amount_cents, after_avail: $.data.available_balance_cents, after_vested: $.data.vested_balance_cents }
            - call: "GET /qdro-cases/{case_id}/alternate-payee-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { ap_id: "$.data[0].id", ap_bal: "$.data[0].balance_cents", ap_status: "$.data[0].status" }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "{case_id}" }
              as: PlanAdministrator
              captures: { hold_status: "$.data[0].status" }
            - call: "GET /qdro-cases/{case_id}/communications"
              payload: { template_code: "QUALIFICATION_NOTICE" }
              as: QdroAnalyst
              captures: { comm1: "$.data[0].recipient_type", comm2: "$.data[1].recipient_type" }
          assert:
            - "${before_held} == 400000 and ${before_avail} == 600000 — the pre-qualification view, established by the receipt alone."
            - "${q_status} == \"QUALIFIED\" in the ACTION'S OWN response body — the caller does not have to re-read the draft to learn the outcome."
            - "${after_held} == 0, ${after_avail} == 600000 and ${after_vested} == 600000 — the very next read shows the hold converted and the 400000 permanently debited from the participant's sources, with no intermediate state where the money is counted twice or not at all."
            - "${ap_bal} == 400000 with ${ap_status} == \"ESTABLISHED\" and ${hold_status} == \"CONVERTED\" — the child that did not exist one call earlier is already listed, and the hold's terminal state is already visible."
            - "${comm1} == \"PARTICIPANT\" and ${comm2} == \"ALTERNATE_PAYEE\" — both cascade-appended communications are readable immediately and in the pinned order, so nothing is queued for later delivery."
            - "The conservation identity holds at every observation point with no transient window: participant vested_balance_cents + payee balance_cents == 1000000 both before qualification (1000000 + 0, of which 400000 was merely held) and immediately after it (600000 + 400000)."
