  # ===========================================================================
  # SECTION 4 — VALIDATIONS (51 ordered rules; the priority-conflict, cross-entity
  # and temporal patterns are carried by §1.8 and stubbed here)
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_source_system_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - errors[ERR_DUPLICATE_CODE]
          - entities.SourceSystem.fields.code
        distinguishing_aspect: "The uniqueness rule fires on the second create with the same code and nothing is written: 409 ERR_DUPLICATE_CODE, and the collection still holds exactly one source system."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem already registered with code VA_DUP."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "VA_DUP"
                display_name: "Duplicate Code Feed"
                channel_type: "TRANSACTIONS"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/source-systems"
              payload:
                code: "VA_DUP"
                display_name: "Second Feed With The Same Code"
                channel_type: "WEB"
                trust_tier: 5
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          assert:
            - "the response status is 409"
            - "the response body error_id == ERR_DUPLICATE_CODE"
            - "GET /cdp/source-systems returns total_count 1 and the surviving id is ${src_id}"
            - "SourceSystem.${src_id}.display_name is still Duplicate Code Feed and trust_tier is still 3 — the refused create did not overwrite the incumbent"

      - name: activation_at_exactly_min_audience_size_dispatches
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=33]
          - calculations.activation_audience_resolution
          - endpoints[POST /cdp/activations/{activationId}/dispatch]
        distinguishing_aspect: "The k-anonymity floor is satisfied, not violated, at exactly the boundary: an audience of exactly min_audience_size (2) dispatches with 200 and no error, proving the comparison is inclusive rather than strict."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of two fully valid records, both postal_code 10001 with an EMAIL/MARKETING OPT_IN signal."
            - "One ACTIVE EMAIL Destination with min_audience_size exactly 2, min_match_rate 0.10 and daily_hash_quota 300."
            - "One APPROVED Segment on postal_code EQ 10001 with a DRAFT Activation."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "VA_PASS"
                display_name: "Satisfaction Feed"
                channel_type: "LOYALTY"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Satisfaction Pair"
                records:
                  - external_id: "SA1"
                    email_raw: "sa1@example.com"
                    phone_raw: "+1 (555) 510-0001"
                    loyalty_number: "LY00005101"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-30T10:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
                  - external_id: "SA2"
                    email_raw: "sa2@example.com"
                    phone_raw: "+1 (555) 510-0002"
                    loyalty_number: "LY00005102"
                    first_name: "Ben"
                    last_name: "Bravo"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-30T11:00:00Z"
                    consent_signals:
                      - { channel: "EMAIL", purpose: "MARKETING", consent_state: "OPT_IN" }
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/destinations"
              payload:
                code: "VA_PASS_DEST"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 300
                min_audience_size: 2
                min_match_rate: 0.10
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "Satisfaction Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-05T00:00:00Z"
                window_end_at: "2026-08-05T02:00:00Z"
                expected_segment_version: "${seg_v}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/activations/${act_id}/dispatch"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "the response status is 200 and no error_id is present"
            - "Activation.${act_id}.status == DISPATCHED with audience_size == 2 and dispatched_hash_count == 2"
            - "Destination.${dest_id}.remaining_daily_hash_quota == 298"
            - "Segment.${seg_id}.active_activation_count == 1"

      - name: two_rules_violated_returns_the_lower_priority_number
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: dispatch_conflict_unauthorized_outranks_invalid_state
          rationale: "That §1.8 instance violates the RBAC rule at priority 2 and the state rule at priority 21 in a single dispatch call and asserts the priority-2 error wins, which is the priority-ordering claim."

      - name: adjacent_priority_rules_resolve_to_the_earlier_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=33]
          - validations[priority=48]
        excluded_because:
          difficulty_instance: dispatch_conflict_k_anonymity_outranks_hash_quota
          rationale: "That §1.8 instance violates the k-anonymity gate at priority 33 and the hash-quota gate at priority 48 simultaneously and asserts the 422 from the earlier gate, then repairs it to show the later gate's 409 surfacing."

      - name: validity_depends_on_another_entitys_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_LEGAL_HOLD_ACTIVE]
        excluded_because:
          difficulty_instance: deletion_propagate_depends_on_suppression_legal_hold_state
          rationale: "That §1.8 instance blocks a propagate while a LEGAL_HOLD SuppressionEntry on a different entity is ACTIVE and lets the same call through once that entry is RELEASED, covering both the valid and invalid sides."

      - name: future_window_conflict_is_detected_at_create_time
        claim_type: temporal_validation
        grounds:
          - validations[priority=46]
          - errors[ERR_ACTIVATION_COOLDOWN_VIOLATION]
        excluded_because:
          difficulty_instance: destination_cooldown_closed_interval_gap_boundary
          rationale: "That §1.8 instance creates an activation whose future window is legal in isolation but violates the destination's cooldown gap against an existing window, then accepts the window that starts exactly at previous_end + cooldown_minutes."

      - name: third_overlapping_window_exceeds_destination_concurrency_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority=47]
          - errors[ERR_ACTIVATION_CONCURRENCY_EXCEEDED]
          - entities.Destination.fields.max_concurrent_activations
        distinguishing_aspect: "Each activation is individually legal — same segment, same legal window, cooldown_minutes 0 so the gap rule at priority 46 never applies to intersecting windows — but the COLLECTIVE coverage of one instant by three DRAFT windows breaches max_concurrent_activations 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Destination with max_concurrent_activations 2 and cooldown_minutes 0 (so intersecting windows are judged only by the concurrency sweep)."
            - "One APPROVED Segment, and two DRAFT Activations on that destination both covering 2026-08-02T00:00:00Z..2026-08-02T02:00:00Z. Each create is preceded by a fresh segment read because every accepted create bumps Segment.version."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/destinations"
              payload:
                code: "VA_CONC_DEST"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 300
                min_audience_size: 1
                cooldown_minutes: 0
                max_concurrent_activations: 2
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "Concurrency Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v0: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-02T00:00:00Z"
                window_end_at: "2026-08-02T02:00:00Z"
                expected_segment_version: "${seg_v0}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act_1_id: "$.data.id" }
            - call: "GET /cdp/segments/${seg_id}"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_v1: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-02T00:00:00Z"
                window_end_at: "2026-08-02T02:00:00Z"
                expected_segment_version: "${seg_v1}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act_2_id: "$.data.id" }
            - call: "GET /cdp/segments/${seg_id}"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_v2: "$.data.version" }
          trigger:
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-02T01:00:00Z"
                window_end_at: "2026-08-02T01:30:00Z"
                expected_segment_version: "${seg_v2}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "both setup creates returned 201 — two overlapping windows are exactly at the cap, not over it"
            - "the trigger returns status 409"
            - "the response body error_id == ERR_ACTIVATION_CONCURRENCY_EXCEEDED, not ERR_ACTIVATION_COOLDOWN_VIOLATION — with cooldown_minutes 0 intersecting windows are judged only by the concurrency sweep"
            - "GET /cdp/activations with destination_id == ${dest_id} returns total_count 2, namely ${act_1_id} and ${act_2_id}"
            - "Segment.${seg_id}.version is still ${seg_v2} — a refused create must not bump the parent"

      - name: sensitive_segment_requires_destination_permission_and_governance_flag
        claim_type: conditional_validation
        grounds:
          - validations[priority=31]
          - errors[ERR_SENSITIVE_ATTRIBUTE_NOT_PERMITTED]
          - entities.Destination.fields.sensitive_attribute_permitted
        distinguishing_aspect: "The rule applies ONLY when the segment's uses_sensitive_attributes flag is true, and then demands BOTH sides: with sensitive_use_approved already true, the same create is refused on the destination whose sensitive_attribute_permitted is false and accepted on the one where it is true."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two ACTIVE EMAIL Destinations: VA_SENS_NO with sensitive_attribute_permitted false (the default) and VA_SENS_YES with it true. Both have min_audience_size 1."
            - "One Segment whose only criterion is inferred_health_interest EQ FITNESS, so uses_sensitive_attributes is true; it is submitted with a governance_justification and APPROVED with sensitive_use_approved true. No profile carries that attribute, so its member_count is 0."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/destinations"
              payload:
                code: "VA_SENS_NO"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 300
                min_audience_size: 1
                sensitive_attribute_permitted: false
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_no_id: "$.data.id" }
            - call: "POST /cdp/destinations"
              payload:
                code: "VA_SENS_YES"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 300
                min_audience_size: 1
                sensitive_attribute_permitted: true
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_yes_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "Sensitive Wellness Segment"
                criteria:
                  - { attribute: "inferred_health_interest", operator: "EQ", value: "FITNESS" }
                governance_justification: "Wellness retargeting approved by counsel for the autumn campaign."
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: true }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v0: "$.data.version" }
          trigger:
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_no_id}"
                window_start_at: "2026-08-05T00:00:00Z"
                window_end_at: "2026-08-05T02:00:00Z"
                expected_segment_version: "${seg_v0}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_yes_id}"
                window_start_at: "2026-08-05T00:00:00Z"
                window_end_at: "2026-08-05T02:00:00Z"
                expected_segment_version: "${seg_v0}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act_ok_id: "$.data.id" }
          assert:
            - "Segment.${seg_id}.uses_sensitive_attributes == true and sensitive_use_approved == true and status == APPROVED"
            - "trigger step 1 returns status 409 with error_id ERR_SENSITIVE_ATTRIBUTE_NOT_PERMITTED — the governance half is satisfied but the destination half is not"
            - "trigger step 1 leaves Segment.${seg_id}.version equal to ${seg_v0}, so the second create may reuse the same token"
            - "trigger step 2 returns status 201 and Activation.${act_ok_id}.status == DRAFT — the identical payload passes once both halves are true"
            - "a subsequent POST /cdp/activations/${act_ok_id}/dispatch returns 422 ERR_EMPTY_AUDIENCE, confirming the sensitive gate at priority 31 was cleared before the audience gate at priority 32 was ever reached"

      - name: existence_check_precedes_state_check_on_unknown_activation_not_found
        claim_type: cascading_validation
        grounds:
          - validations[priority=15]
          - validations[priority=21]
          - errors[ERR_ACTIVATION_NOT_FOUND]
        distinguishing_aspect: "The state check at priority 21 cannot run until the existence check at priority 15 has resolved the entity, so pausing a wholly unknown activation is a 404 ERR_ACTIVATION_NOT_FOUND and never a 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No Activation exists at all."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/activations/11111111-2222-3333-4444-555555555555/pause"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "the response status is 404"
            - "the response body error_id == ERR_ACTIVATION_NOT_FOUND"
            - "the response body does NOT carry ERR_INVALID_STATE — the downstream check never ran"
            - "GET /cdp/activations returns total_count 0"

  # ===========================================================================
  # SECTION 5 — ENDPOINTS (57 endpoints across the CRUD, action, fan-out,
  # cross-reference, computed-read and conditional-action patterns)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: match_rule_create_read_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /cdp/match-rules]
          - endpoints[GET /cdp/match-rules/{matchRuleId}]
          - endpoints[GET /cdp/match-rules]
        distinguishing_aspect: "The full read path agrees with the write: the created rule's optional inputs and computed counters come back byte-identical from the item read and from the filtered collection read, and there is no update or delete endpoint to contradict them."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no MatchRule exists yet."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /cdp/match-rules"
              payload:
                code: "EP_DET_EMAIL"
                rule_kind: "DETERMINISTIC"
                deterministic_key: "EMAIL_NORM"
                review_floor: 0.70
                auto_merge_threshold: 0.95
                min_precision: 0.80
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { rule_id: "$.data.id" }
            - call: "GET /cdp/match-rules/${rule_id}"
              payload: {}
              as: IdentitySteward
              as_user_id: "u_steward"
            - call: "GET /cdp/match-rules"
              payload: { rule_kind: "DETERMINISTIC", status: "ENABLED" }
