            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotB}", nominated_mmbtu: 50000 }, as: GasScheduler }
            - { call: "POST /api/pipeline-day-schedules/${sched}/nominations", payload: { cargo_slot_id: "${slotC}", nominated_mmbtu: 20000 }, as: GasScheduler }
            - { call: "POST /api/pipeline-day-schedules/${sched}/close", payload: {}, as: GasScheduler, captures: { sch_closed: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-04-15T00:00:00Z" }, as: TerminalOperator }
          trigger:
            - { call: "POST /api/cargo-slots/${slotB}/cancellations", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
          assert:
            - "after close: PipelineDaySchedule.${sched}.total_confirmed_mmbtu + total_cut_mmbtu == 100000 + 30000 == total_nominated_mmbtu == 130000"
            - "after cancellation: PipelineDaySchedule.${sched}.total_confirmed_mmbtu == 80000"
            - "after cancellation: PipelineDaySchedule.${sched}.total_cut_mmbtu == 50000"
            - "invariant holds: 80000 + 50000 == 130000 (no drift from forward + compensating actions)"

      - name: adp_quantity_conservation_on_cancellation
        grounds:
          - entities.AnnualDeliveryProgram.fields.scheduled_quantity_mmbtu
          - entities.AnnualDeliveryProgram.fields.cancelled_quantity_mmbtu
          - entities.AnnualDeliveryProgram.fields.unallocated_quantity_mmbtu
          - state_machines.CargoSlot.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: contractual cargo quantity (different from pipeline
          gas). scheduled + cancelled + unallocated == ACQ before and after a cargo
          cancellation: 7,200,000 + 0 + 0 == 3,600,000 + 3,600,000 + 0 == ACQ.
        test_recipe:
          setup:
            - "SPA ACQ 7,200,000; confirmed ADP with exactly two slots of 3,600,000 (fully allocated); clock 2027-04-15 gives >30 days notice to the 2027-06-01 window"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { legal_name: "Pi Resources", credit_rating: "A" }, as: TerminalOperator, captures: { cust: $.data.id } }
            - { call: "POST /api/spas", payload: { customer_id: "${cust}", contract_year_start: 2027, term_years: 5, annual_contract_quantity_mmbtu: 7200000, fixed_liquefaction_fee_usd_per_mmbtu: 3.50, commodity_multiplier: 1.15, commodity_index: "HENRY_HUB", destination_flexibility: "FOB", title_transfer_point: "LOADING_FLANGE", cancellation_notice_days: 30, tolerance_pct: 0.05, estimated_index_price_usd_per_mmbtu: 2.85 }, as: CommercialManager, captures: { spa: $.data.id, spa_v: $.data.version } }
            - { call: "POST /api/trains", payload: { name: "Train 1", design_capacity_mtpa: 5.0, daily_capacity_mmbtu: 700000, commissioning_cargoes_required: 0 }, as: TerminalOperator, captures: { tr: $.data.id } }
            - { call: "POST /api/trains/${tr}/begin-commissioning", payload: {}, as: TerminalOperator }
            - { call: "POST /api/trains/${tr}/declare-cod", payload: { cod_date: "2026-12-01", performance_test_passed: true }, as: TerminalOperator }
            - { call: "POST /api/spas/${spa}/commence-deliveries", payload: {}, as: CommercialManager, captures: { spa_v2: $.data.version } }
            - { call: "POST /api/adps", payload: { spa_id: "${spa}", contract_year: 2027, expected_spa_version: "${spa_v2}" }, as: CommercialManager, captures: { adp: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-06-01T00:00:00Z", window_end: "2027-06-08T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot1: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-09-01T00:00:00Z", window_end: "2027-09-08T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot2: $.data.id } }
            - { call: "POST /api/adps/${adp}/propose", payload: {}, as: CommercialManager }
            - { call: "POST /api/adps/${adp}/confirm", payload: {}, as: CustomerRep, as_user_id: "${cust}", captures: { adp_pre: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-04-15T00:00:00Z" }, as: TerminalOperator }
          trigger:
            - { call: "POST /api/cargo-slots/${slot1}/cancellations", payload: {}, as: CustomerRep, as_user_id: "${cust}" }
          assert:
            - "before: scheduled 7200000 + cancelled 0 + unallocated 0 == ACQ 7200000"
            - "after: AnnualDeliveryProgram.${adp}.scheduled_quantity_mmbtu == 3600000"
            - "after: AnnualDeliveryProgram.${adp}.cancelled_quantity_mmbtu == 3600000"
            - "after: AnnualDeliveryProgram.${adp}.unallocated_quantity_mmbtu == 0"
            - "invariant holds: 3600000 + 3600000 + 0 == 7200000"
