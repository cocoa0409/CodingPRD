  # =========================================================================
  - section: state_machines
    instances:
      - name: new_event_booking_starts_in_draft_with_null_hold_fields
        claim_type: initial_state
        grounds:
          - state_machines.EventBooking.initial_state
          - entities.EventBooking.fields.status
        distinguishing_aspect: "A freshly created booking reads status DRAFT with hold_tier, hold_placed_at, hold_expires_at, displaced_by_booking_id and release_reason all null."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE; logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
          trigger:
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk: $.data.id }
          assert:
            - "HTTP 201"
            - "EventBooking.${bk}.status == DRAFT"
            - "EventBooking.${bk}.hold_tier == null"
            - "EventBooking.${bk}.hold_placed_at == null"
            - "EventBooking.${bk}.hold_expires_at == null"
            - "EventBooking.${bk}.displaced_by_booking_id == null"
            - "EventBooking.${bk}.release_reason == null"
            - "Venue.${venue_id}.open_hold_count == 0, because a DRAFT booking is not a hold"

      - name: hold_moves_draft_to_held_and_applies_every_declared_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.EventBooking.transitions.DRAFT_to_HELD
          - calculations.hold_expires_at
          - entities.AnchorTenant.fields.holds_consumed
          - entities.Venue.fields.open_hold_count
        distinguishing_aspect: "Holding a TIER_2 anchor booking at 2026-08-01T00:00:00Z writes hold_tier TIER_2, hold_placed_at 2026-08-01T00:00:00.000Z and hold_expires_at 2026-08-08T00:00:00.000Z (168 hours), lifts AnchorTenant.holds_consumed to 1 and Venue.open_hold_count to 1, and bumps Venue.version by exactly 1."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE, one TIER_2 anchor tenant with three guaranteed holds, one DRAFT anchor booking."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/anchor-tenants"
              payload: { name: "Lakeside Hockey Club", hold_priority_tier: "TIER_2", guaranteed_holds_per_season: 3 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { t1: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", tenant_id: "${t1}", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: AnchorTenantRep
              as_user_id: "${t1}"
              captures: { bk: $.data.id }
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /event-bookings/${bk}/hold"
              payload: {}
              as: AnchorTenantRep
              as_user_id: "${t1}"
          assert:
            - "HTTP 200"
            - "EventBooking.${bk}.status == HELD"
            - "EventBooking.${bk}.hold_tier == TIER_2"
            - "EventBooking.${bk}.hold_placed_at == 2026-08-01T00:00:00.000Z"
            - "EventBooking.${bk}.hold_expires_at == 2026-08-08T00:00:00.000Z"
            - "the AnchorTenant row ${t1} in GET /venues/${venue_id}/anchor-tenants reads holds_consumed == 1"
            - "Venue.${venue_id}.open_hold_count == 1"
            - "Venue.${venue_id}.version == ${v0} + 1"

      - name: confirm_moves_held_to_confirmed_and_clears_the_open_hold_counter
        claim_type: valid_transition
        grounds:
          - state_machines.EventBooking.transitions.HELD_to_CONFIRMED
          - calculations.rigging_committed_load_kg
          - concurrency_rules.booking-confirm-stale-venue
        distinguishing_aspect: "A confirm carrying the freshly read Venue.version returns 200 with status CONFIRMED, drops open_hold_count back to 0, bumps Venue.version by 1, and leaves Venue.rigging_committed_load_kg at 0.00 because the logical clock 2026-08-01T00:00:00Z lies outside the September event window."
        test_recipe:
          setup:
            - "One venue with PROFILE ICE and one HELD promoter booking on 2026-09-10; logical clock still 2026-08-01T00:00:00Z, well inside the 24-hour OPEN hold window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk: $.data.id }
            - call: "POST /event-bookings/${bk}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /event-bookings/${bk}/confirm"
              payload: { expected_venue_version: "${v1}" }
              as: BookingManager
          assert:
            - "HTTP 200"
            - "EventBooking.${bk}.status == CONFIRMED"
            - "EventBooking.${bk}.hold_expires_at is unchanged at 2026-08-02T00:00:00.000Z (OPEN tier, 24 hours) and is simply no longer consulted"
            - "Venue.${venue_id}.open_hold_count == 0"
            - "Venue.${venue_id}.rigging_committed_load_kg == 0.00"
            - "Venue.${venue_id}.version == ${v1} + 1"

      - name: holding_an_already_held_booking_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.EventBooking.transitions.DRAFT_to_HELD.preconditions
          - validations[priority=50]
          - errors.ERR_INVALID_BOOKING_STATE
        distinguishing_aspect: "The second POST /hold on the same booking returns 409 ERR_INVALID_BOOKING_STATE and leaves open_hold_count at 1, so the hold is not double-counted."
        test_recipe:
