              as: ReturnsExaminer
            - call: "POST /mft/returns/${d_ret_id}/schedules"
              payload: { schedule_code: "SCH_6_EXEMPT_SALES", product_code: "UNDYED_DIESEL", total_gallons: 200.00 }
              as: ReturnsExaminer
