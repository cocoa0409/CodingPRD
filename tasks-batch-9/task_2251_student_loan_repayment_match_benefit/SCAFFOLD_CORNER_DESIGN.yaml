      - name: corner_clock_endpoint_moves_employee_into_unpaid_leave
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - state_machines.Employee.ACTIVE_to_LEAVE_UNPAID
          - endpoints[POST /leave-events]
        distinguishing_aspect: "With the logical clock moved to 2026-03-15T00:00:00Z, an UNPAID leave spanning 2026-03-01..2026-03-31 contains the clock and flips employment_status ACTIVE -> LEAVE_UNPAID with day_count 31."
