    instances:
      - name: obligation_conserved_on_mod_reject_after_approve
        grounds:
          - state_machines.Modification.PROPOSED_to_APPROVED
          - calculations.obligated_amount
          - entities.Contract.fields.obligated_amount_cents
        distinguishing_aspect: |
          Conserved quantity = Contract.obligated_amount_cents == base_value_cents + sum(APPROVED FUNDING/OPTION
          deltas). A FUNDING mod left PROPOSED (never approved) contributes 0, so obligated equals base exactly:
          forward (propose) + non-approval leaves the funding obligation unchanged.
        test_recipe:
          setup:
            - "An ACTIVE FFP contract base_value_cents 50000000, obligated 50000000; one APPROVED FUNDING mod +10000000 (obligated 60000000); then a second PROPOSED FUNDING mod +5000000 that gets REJECTED."
