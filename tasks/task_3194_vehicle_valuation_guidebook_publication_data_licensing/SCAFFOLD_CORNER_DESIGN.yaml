              captures: { r_idem2: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_idem2}", name: "Dup", external_key: "ext-dup" }
              as: DataOps
              captures: { src_idem2: $.data.id }
          trigger:
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_idem2}", name: "Dup", external_key: "ext-dup" }
              as: DataOps
              captures: { src_idem2b: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "AUCTION", region_id: "${r_idem2}", name: "DupChanged", external_key: "ext-dup" }
              as: DataOps
              captures: { idem2_err: $.data.error_id }
          assert:
            - "src_idem2 == src_idem2b"
            - "idem2_err == ERR_DUPLICATE_KEY"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cascade_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [state_machines.ValuationEdition.PUBLISHED_to_WITHDRAWN, complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: after POST /valuation-editions/{id}/withdraw returns 200, a GET on the edition and its QUOTED offers in the same test (no waits) already show WITHDRAWN and VOID."
        test_recipe:
          setup:
            - "std published edition E_cons (cfg_cons SEDAN, region EAST); offer o_cons QUOTED on it"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_cons: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "CONS", year: 2023, trim: "X", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-cons" }
              as: ValuationAdmin
              captures: { cfg_cons: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_cons}", name: "CONSD", external_key: "src-cons" }
              as: DataOps
              captures: { src_cons: $.data.id }
            - call: "POST /sources/${src_cons}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_cons}", submission_ref: "b-cons", items: [ { configuration_id: "${cfg_cons}", region_id: "${r_cons}", sold_price_cents: 2000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { b_cons: $.data.id }
            - call: "POST /batches/${b_cons}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_cons}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_cons}", region_id: "${r_cons}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-cons" }
              as: ValuationAdmin
              captures: { s_cons: $.data.id }
            - call: "POST /valuation-series/${s_cons}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_cons}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_cons: $.data.id }
            - call: "POST /valuation-editions/${e_cons}/publish"
              payload: {}
              as: ValuationAdmin
            - call: "POST /consumer-profiles"
              payload: { email: "cons@x.com", full_name: "Cons" }
              as: Consumer
              captures: { cons_cons: $.data.id }
            - call: "POST /cash-offers"
              payload: { edition_id: "${e_cons}", funding_dealer_id: "${src_cons}", consumer_id: "${cons_cons}", mileage: 20000, age_years: 2, declared_condition_tier: "GOOD", option_ids: [] }
              as: DealerPartner
              as_user_id: "${src_cons}"
              captures: { o_cons: $.data.id }
          trigger:
            - call: "POST /valuation-editions/${e_cons}/withdraw"
              payload: {}
              as: ValuationAdmin
            - call: "GET /valuation-editions/${e_cons}"
              as: ValuationAdmin
              captures: { cons_status: $.data.status }
            - call: "GET /cash-offers/${o_cons}"
              as: ValuationAdmin
              captures: { cons_offer_status: $.data.status }
          assert:
            - "cons_status == WITHDRAWN"
            - "cons_offer_status == VOID"
