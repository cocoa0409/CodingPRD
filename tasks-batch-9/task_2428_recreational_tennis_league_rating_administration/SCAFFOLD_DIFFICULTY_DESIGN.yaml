          on the revert edge: one withdrawal drops registered_team_count to 1 and pushes the
          surviving ROSTER_LOCKED team back to REGISTERED while its scheduled match is
          CANCELLED, so the state graph is cyclic and a forward-only lifecycle cannot produce
