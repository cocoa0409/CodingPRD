  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_member_version_on_contract_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-create-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a Contract with an expected_member_version one behind the member's current version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A member whose version was advanced by a sign-waiver after the client read it."]
          setup_api_calls:
            - call: "POST /dojo/programs"
              payload: { name: "OCC Prog", discipline: "BJJ", base_monthly_tuition_cents: 9000, test_fee_cents: 3000, min_attendance_for_test: 0, min_days_in_rank: 0 }
              as: FrontDesk
              captures: { prog_id: $.data.id }
            - call: "POST /dojo/members"
              payload: { full_name: "OCC M", email: "occm@x.com", date_of_birth: "1990-01-01", waiver_signed: false }
              as: FrontDesk
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /dojo/members/${m_id}/freeze"
              payload: { expected_member_version: "${m_v0}" }
              as: FrontDesk
            - call: "POST /dojo/members/${m_id}/unfreeze"
              payload: { expected_member_version: "${m_v0} + 1" }
              as: FrontDesk
          trigger:
            - call: "POST /dojo/contracts"
              payload: { member_id: "${m_id}", program_id: "${prog_id}", term_months: 12, billing_anchor_day: 1, expected_member_version: "${m_v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response code 412 and error_id == ERR_STALE_VERSION (m_v0 is two versions stale after freeze+unfreeze)"

      - name: occ_correct_member_version_on_enrollment_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enroll-create-stale-member]", entities.Member]
        distinguishing_aspect: "Creating an Enrollment with the member's CURRENT version (the common-field version) succeeds and bumps the member version by 1."
        test_recipe:
