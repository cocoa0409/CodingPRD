  - rule_id: boundary_precision_check
    instances:
      - name: odr_exactly_at_breach_threshold_breaches_and_one_unit_below_does_not
        grounds:
          - "calculations.order_defect_rate (precision note)"
          - "calculations.metric_tier"
          - "calculations.health_score"
        distinguishing_aspect: |
          Metric under test: the ODR breach threshold on POST /sellers/{id}/health-evaluations.
          Three sellers straddle it on the ROUNDED 4-decimal rate: 20/2000 = 0.0100 exactly
          breaches (>=), 20/2010 = 0.0099502 ROUNDS UP to 0.0100 and also breaches, and 20/2020 =
          0.0099010 rounds to 0.0099 and does not. The fixture also pins the two-sided asymmetry:
          late_shipment_rate exactly 0.0400 breaches while valid_tracking_rate exactly 0.9500 does
          not, and all three sellers score 100.00 because the score measures overage, not crossing.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "No SHIPPING_PERFORMANCE / ACCOUNT PolicyRule exists, so a BREACHING evaluation mints no auto-violation and every posture stays ACTIVE / NORMAL."
            - "Seller A: one snapshot order_volume 2000, delivered_or_refunded 2000, substantiated 20, pending 0, late 80, cancellations 0, shipments 2000, valid tracking 1900."
            - "Seller B: order_volume 2100, delivered_or_refunded 2010, substantiated 20, pending 0, late 84, cancellations 0, shipments 2100, valid tracking 1995."
            - "Seller C: order_volume 2100, delivered_or_refunded 2020, substantiated 20, pending 0, late 84, cancellations 0, shipments 2100, valid tracking 1995."
