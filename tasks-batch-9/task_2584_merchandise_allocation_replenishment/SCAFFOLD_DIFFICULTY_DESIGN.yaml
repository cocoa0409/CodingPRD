            - "The action for ${pr_id} is MARKDOWN with markdown_pct_bp == 0: broken_ratio_bp == FLOOR(1 * 10000 / 8) == 1250, which is below the first tier boundary 2500, so no markdown depth is taken at all"
      - name: stock_status_band_edges_at_min_at_max_and_at_zero
        grounds:
          - calculations.assortment_health_derivation
          - entities.StorePosition.fields.stock_status
          - entities.StorePosition.fields.available_units
          - state_machines[StorePosition].field:stock_status
        distinguishing_aspect: |
          Every boundary of the four-band stock ladder is sat on exactly, by four positions in one
          dataset: available 0 with min_units 0 is STOCKOUT (the zero test precedes the range tests, so it
          is not IN_STOCK even though 0 <= max); available 5 with min 5 is IN_STOCK because the LOW test is
          a strict <; available 4 with min 12 is LOW; and the approve moves the donor from available 30
          (> max 24, OVERSTOCK) to available exactly 24, which is IN_STOCK because the upper test is <=.
          One unit either way on any of the four flips a band.
