              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/f1.jpg"], damage_reported: true, estimated_damage_cost_cents: 10000 }
              as: Technician
