            - "Product.${prod}.open_exception_count == 0"

      - name: chargeback_on_an_unconfirmed_test_purchase_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]"]
        distinguishing_aspect: "A chargeback requires the test purchase to be CONFIRMED_UNAUTHORIZED: a merely SERIAL_CAPTURED purchase gives ERR_TEST_PURCHASE_NOT_CONFIRMED even though the traced unit is already known."
        test_recipe:
          setup: ["Northwind shipped SN-0001; a test purchase in SERIAL_CAPTURED against a grey listing; the outcome has not been confirmed."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *DISTNW
            - *SU0001
