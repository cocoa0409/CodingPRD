            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=ADJUSTMENT returns meta total_count == 0"
            - "Member.${cm_id}.available_points == 200 (the transfer stands)"

      - name: unfreeze_is_blocked_while_an_alt_id_sharing_signal_is_still_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Household.FROZEN_to_ACTIVE
          - validations[priority=46]
          - entities.FraudSignal.fields.signal_type
        distinguishing_aspect: "The FROZEN -> ACTIVE back-edge is guarded by signal type, not by score: with an OPEN ALT_ID_SHARING signal of weight 10 (far below the threshold 60) the unfreeze is refused, and the identical unfreeze succeeds only after that signal is cleared."
        test_recipe:
          setup:
            - "Banner CORE with household HH-CORE-1 frozen manually by a supervisor, then given one OPEN ALT_ID_SHARING signal of weight 10; logical clock at 2026-08-01T00:00:00Z."
