              payload: { intake_channel: "PUBLIC", narrative: "Rude tone at a traffic stop.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Ira Fox", complainant_contact: "ira@example.org", complainant_demographic_code: "DG_C" }
              as: Complainant
              captures: { c3_id: $.data.id }
