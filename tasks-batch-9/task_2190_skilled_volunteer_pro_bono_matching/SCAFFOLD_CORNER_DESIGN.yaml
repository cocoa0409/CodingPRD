  - section: calculations
    instances:
      - name: calc_capacity_class_just_below_small_floor_stays_micro
        claim_type: threshold_boundary
        grounds: [calculations.partner_capacity_class, "constants.BAND_SMALL_FLOOR_USD"]
        distinguishing_aspect: "One cent below the 250000.00 band floor the partner is still MICRO with a single concurrent engagement, proving the floor comparison is >= and not >."
        test_recipe:
          setup: ["No prior state; the logical clock sits at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Nearly Small Trust", contact_email: "ns@x.example", sector: HEALTH, annual_budget_usd: 249999.99}}
          assert:
            - "HTTP 201"
            - "data.capacity_class == \"MICRO\""
            - "data.max_concurrent_engagements == 1"
            - "data.annual_budget_usd == 249999.99"
      - name: calc_capacity_class_at_exact_small_floor_is_small
        claim_type: threshold_boundary
        grounds: [calculations.partner_capacity_class, "constants.BAND_SMALL_FLOOR_USD"]
        distinguishing_aspect: "Exactly on the 250000.00 floor the band flips to SMALL with two concurrent engagements - the inclusive-floor half of the same boundary pair."
        test_recipe:
          setup: ["No prior state."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Exactly Small Trust", contact_email: "es@x.example", sector: HEALTH, annual_budget_usd: 250000.00}}
          assert:
            - "HTTP 201"
            - "data.capacity_class == \"SMALL\""
            - "data.max_concurrent_engagements == 2"
      - name: calc_capacity_class_at_exact_large_floor_is_large
        claim_type: threshold_boundary
        grounds: [calculations.partner_capacity_class, "constants.BAND_LARGE_FLOOR_USD"]
        distinguishing_aspect: "The top band has no ceiling: exactly 10000000.00 already yields LARGE with six concurrent engagements, which is the constant that later gates ERR_PARTNER_ENGAGEMENT_LIMIT."
        test_recipe:
          setup: ["No prior state."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "2026-08-01T00:00:01Z"}}
          trigger:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Metro Health Foundation", contact_email: "mh@x.example", sector: HEALTH, annual_budget_usd: 10000000.00}}
          assert:
            - "HTTP 201"
            - "data.capacity_class == \"LARGE\""
            - "data.max_concurrent_engagements == 6"
