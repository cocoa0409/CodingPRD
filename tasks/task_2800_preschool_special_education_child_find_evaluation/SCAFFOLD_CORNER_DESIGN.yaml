            - call: "POST /child-find/consent-records/${consentB_id}/decision"
              payload: { decision: "GRANTED" }
              as: Parent
              as_user_id: "${childB_id}"
            - call: "POST /child-find/children"
              payload: { first_name: "Cy", last_name: "C", date_of_birth: "2023-08-01", guardian_full_name: "G C", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { childC_id: "$.data.id" }
            - call: "POST /child-find/referrals"
              payload: { child_id: "${childC_id}", source: "PEDIATRICIAN", referring_provider_npi: "1234567893" }
              as: ChildFindCoordinator
              captures: { referralC_id: "$.data.id" }
            - call: "POST /child-find/referrals/${referralC_id}/consent-requests"
              payload: { notice_language_code: "en", notice_delivery_method: "MAIL" }
              as: ChildFindCoordinator
