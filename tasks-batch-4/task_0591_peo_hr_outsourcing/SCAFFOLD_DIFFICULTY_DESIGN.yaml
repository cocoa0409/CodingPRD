  - rule_id: resource_temporal_overlap
    instances:
      - name: benefit_coverage_half_open_adjacency_ok_overlap_rejected
        grounds:
          - validations[priority=62]
          - errors[ERR_COVERAGE_OVERLAP]
          - entities.BenefitEnrollment.fields.coverage_end_date
          - entities.BenefitEnrollment.fields.plan_type
        distinguishing_aspect: |
          Interval semantics #1 — HALF-OPEN [coverage_start_date, coverage_end_date) on the resource
          (WorksiteEmployee, plan_type): a second enrollment starting EXACTLY on the first one's
          coverage_end_date (2026-09-01) is ACCEPTED because the end is exclusive, while a third
          enrollment starting 2026-08-01 (inside the first window) is REJECTED with
          ERR_COVERAGE_OVERLAP. Touching endpoints do not collide here.
        test_recipe:
          setup:
            - "ACTIVE client, one ACTIVE benefits-eligible employee (hire 2026-05-01), clock at 2026-06-01, enrollment window 2026-05-15..2026-06-30 OPEN."
            - "MEDICAL plan with pool_capacity 5 and participation_minimum_count 1."
            - "Enrollment A already exists on that employee with coverage [2026-06-01, 2026-09-01)."
          setup_api_calls:
            - call: "POST /wc-policies"
              payload: { master_policy_number: "WCM-2026-015", carrier_name: "Granite Mutual", policy_year: 2026, master_ein: "98-7654321" }
              as: PeoAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /wc-policies/${policy_id}/class-codes"
              payload: { class_code: "8810", description: "Clerical office", base_rate_per_100_cents: 250 }
              as: PeoAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Papa Press", fein: "16-3456785", state_code: "CO", service_agreement_signed: true }
              as: PeoAdmin
              captures: { client_p: $.data.id }
            - call: "POST /clients/${client_p}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${client_p}/worksite-employees"
              payload: { wc_class_code_id: "${cc_id}", first_name: "Zed", last_name: "Amir", ssn_last4: "2020", birth_year: 1990, hire_date: "2026-05-01", annual_salary_cents: 2400120, employment_type: "FULL_TIME" }
              as: ClientAdmin
              as_user_id: "${client_p}"
              captures: { emp1: $.data.id, emp1_v: $.data.version }
            - call: "POST /worksite-employees/${emp1}/onboarding-packet"
              payload: { expected_employee_version: "${emp1_v}", i9_completed: true, w4_completed: true, direct_deposit_completed: true }
              as: ClientAdmin
              as_user_id: "${client_p}"
              captures: { pkt1: $.data.id }
            - call: "POST /onboarding-packets/${pkt1}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_p}"
            - call: "POST /onboarding-packets/${pkt1}/review"
              payload: { decision: "APPROVE" }
              as: PeoAdmin
            - call: "POST /benefit-plans"
              payload: { carrier_name: "BlueRock", plan_type: "MEDICAL", plan_year: 2026, composite_rate_cents: 45000, age_band_base_rate_cents: 40000, pool_capacity: 5, participation_minimum_count: 1, rating_method: "COMPOSITE", employer_contribution_pct: 0.60 }
              as: PeoAdmin
              captures: { plan_med: $.data.id }
            - call: "POST /clients/${client_p}/enrollment-windows"
              payload: { plan_year: 2026, open_date: "2026-05-15", close_date: "2026-06-30" }
              as: PeoAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PeoAdmin
            - call: "POST /worksite-employees/${emp1}/benefit-enrollments"
              payload: { benefit_plan_id: "${plan_med}", coverage_start_date: "2026-06-01", coverage_end_date: "2026-09-01" }
              as: ClientAdmin
              as_user_id: "${client_p}"
              captures: { enr_a: $.data.id }
          trigger:
            - call: "POST /worksite-employees/${emp1}/benefit-enrollments"
              payload: { benefit_plan_id: "${plan_med}", coverage_start_date: "2026-09-01" }
              as: ClientAdmin
              as_user_id: "${client_p}"
              captures: { enr_b: $.data.id }
            - call: "POST /worksite-employees/${emp1}/benefit-enrollments"
              payload: { benefit_plan_id: "${plan_med}", coverage_start_date: "2026-08-01" }
              as: ClientAdmin
              as_user_id: "${client_p}"
          assert:
            - "Enrollment B (start 2026-09-01 == A's exclusive end) is CREATED: HTTP 201, BenefitEnrollment.${enr_b}.status == PENDING, coverage_end_date == null"
            - "Enrollment C (start 2026-08-01, inside A's window) returns HTTP 409 with error_id ERR_COVERAGE_OVERLAP"
            - "BenefitPlan.${plan_med}.enrolled_count == 2 (A and B only) and pool_status == ACTIVE"
            - "GET /benefit-enrollments?worksite_employee_id=${emp1} returns exactly 2 rows"

      - name: pay_period_closed_interval_touching_endpoints_collide
        grounds:
          - validations[priority=60]
