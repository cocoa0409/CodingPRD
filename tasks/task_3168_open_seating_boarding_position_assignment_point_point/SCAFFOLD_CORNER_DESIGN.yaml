              as: Passenger
              as_user_id: "${pa1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FAMILY_ANCHOR_INELIGIBLE with HTTP 422 (anchor passenger is not under 6 on flight date)"

      - name: err_station_closed_triggerable
        claim_type: error_triggerable
        grounds: [ "errors[ERR_STATION_CLOSED]", "state_machines.Station.ACTIVE_to_CLOSED" ]
        distinguishing_aspect: "Creating a flight leg whose origin station has been CLOSED via POST /ops/stations/{id}/status (CLOSE) fails with ERR_STATION_CLOSED/409; reopening restores acceptance."
        test_recipe:
          setup: ["station DAL (created ACTIVE then CLOSED) and station HOU (ACTIVE)"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/stations/${st_dal}/status"
              payload: { action: "CLOSE" }
              as: OpsController
          trigger:
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { err: $.data.error_id }
            - call: "POST /ops/stations/${st_dal}/status"
              payload: { action: "REOPEN" }
              as: OpsController
          assert:
            - "leg creation against CLOSED station returns error_id == ERR_STATION_CLOSED with HTTP 409"
            - "after REOPEN the same leg creation succeeds (201) — Station cycle ACTIVE→CLOSED→ACTIVE exercised"

