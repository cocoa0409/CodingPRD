scaffold_corner_design:
  - section: entities
    instances:
      - name: shelter_program_creation_stamps_derived_defaults
        claim_type: creation
        grounds:
          - entities.ShelterProgram
          - endpoints[POST /ryhs/shelter-programs]
          - calculations.program_posture
        distinguishing_aspect: "A freshly created ShelterProgram echoes all nine input fields and stamps every derived counter to zero with posture OPEN and version 1, independently of any program created before it."
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program already exists, so the assertion is about this row's own derived fields rather than about an empty database"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ent_first_program_id: $.data.id }
          trigger:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ent_second_program_id: $.data.id }
          assert:
            - "the request returns HTTP 201"
            - "ShelterProgram.${ent_second_program_id}.name == Northside Transitional Living"
            - "ShelterProgram.${ent_second_program_id}.program_type == TRANSITIONAL_LIVING"
            - "ShelterProgram.${ent_second_program_id}.licensed_bed_capacity == 3"
            - "ShelterProgram.${ent_second_program_id}.max_placement_days == 540"
            - "ShelterProgram.${ent_second_program_id}.savings_match_rate_bp == 2500"
            - "ShelterProgram.${ent_second_program_id}.occupied_beds == 0"
            - "ShelterProgram.${ent_second_program_id}.waitlisted_count == 0"
            - "ShelterProgram.${ent_second_program_id}.overdue_notification_count == 0"
            - "ShelterProgram.${ent_second_program_id}.utilization_bp == 0"
            - "ShelterProgram.${ent_second_program_id}.posture == OPEN"
            - "ShelterProgram.${ent_second_program_id}.version == 1"
            - "ShelterProgram.${ent_second_program_id}.id != ShelterProgram.${ent_first_program_id}.id"

      - name: youth_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Youth
          - endpoints[GET /ryhs/youths/{id}]
          - calculations.youth_age_years
        distinguishing_aspect: "GET /ryhs/youths/{id} returns the persisted row with age_years 16 derived from the logical clock 2026-08-01T00:00:00Z and every counter still at its default."
        test_recipe:
          setup:
            - "one Youth created at the default logical clock 2026-08-01T00:00:00Z with date_of_birth 2010-03-15 and no contacts, screenings, admissions or placements"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Mara", legal_last_name: "Cole", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ent_mara_id: $.data.id }
          trigger:
            - call: "GET /ryhs/youths/${ent_mara_id}"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
          assert:
            - "the request returns HTTP 200"
            - "Youth.${ent_mara_id}.legal_first_name == Mara"
            - "Youth.${ent_mara_id}.date_of_birth == 2010-03-15"
            - "Youth.${ent_mara_id}.age_years == 16"
            - "Youth.${ent_mara_id}.status == PROSPECT"
            - "Youth.${ent_mara_id}.risk_posture == OPEN"
            - "Youth.${ent_mara_id}.trafficking_risk_score == 0"
            - "Youth.${ent_mara_id}.trafficking_risk_tier == LOW"
            - "Youth.${ent_mara_id}.engagement_contact_count == 0"
            - "Youth.${ent_mara_id}.cumulative_shelter_nights == 0"
            - "Youth.${ent_mara_id}.governance_vote_eligible == false"
            - "Youth.${ent_mara_id}.version == 1"

      - name: youth_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /ryhs/youths]
          - response_envelope
        distinguishing_aspect: "With exactly three youths stored, limit 2 offset 0 returns 2 items with total_count 3 and has_more true, and limit 2 offset 2 returns 1 item with total_count 3 and has_more false."
        test_recipe:
          setup:
            - "exactly three Youth rows exist, created in the order Uno, Dos, Tres at the default clock"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Uno", legal_last_name: "Reyes", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ent_uno_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Dos", legal_last_name: "Reyes", date_of_birth: "2011-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ent_dos_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Tres", legal_last_name: "Reyes", date_of_birth: "2012-03-15", unaccompanied: false }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ent_tres_id: $.data.id }
          trigger:
            - call: "GET /ryhs/youths"
              payload: { limit: 2, offset: 0 }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "GET /ryhs/youths"
              payload: { limit: 2, offset: 2 }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "GET /ryhs/youths"
              payload: { status: "PROSPECT", limit: 50, offset: 0 }
              as: ShelterCaseManager
              as_user_id: "cm-1"
          assert:
            - "the first page returns HTTP 200 with 2 items, total_count 3 and has_more true"
            - "the second page returns 1 item, total_count 3 and has_more false"
            - "the status=PROSPECT page returns total_count 3 and has_more false"
            - "every response body carries the data / total_count / has_more envelope keys"
            - "no youth id appears on both pages"

      - name: admission_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors.ERR_ADMISSION_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown admission id returns 404 ERR_ADMISSION_NOT_FOUND even though a real admission exists in the database, so the 404 is about the id, not about emptiness."
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program and one youth with a CLEARED screening hold one ACTIVE Admission, so the collection is non-empty"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { nf_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Nia", legal_last_name: "Okafor", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { nf_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${nf_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { nf_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${nf_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${nf_youth_id}", program_id: "${nf_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { nf_adm_id: $.data.id }
          trigger:
            - call: "GET /ryhs/admissions/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { nf_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 404 with error_id ERR_ADMISSION_NOT_FOUND"
            - "the response body carries the error_id / message / error envelope shape"
            - "Admission.${nf_adm_id}.status == ACTIVE"
            - "GET /ryhs/admissions?program_id=${nf_program_id} still returns total_count 1"

      - name: youth_creation_missing_date_of_birth_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Youth.fields.date_of_birth
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "date_of_birth has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Youth row is created."
        test_recipe:
          setup:
            - "one Youth already exists so the listing count can be compared before and after the rejected request"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Existing", legal_last_name: "Youth", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { req_existing_id: $.data.id }
          trigger:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "NoBirthdate", legal_last_name: "Case" }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { req_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /ryhs/youths returns total_count 1"
            - "Youth.${req_existing_id}.version == 1"

      - name: youth_unaccompanied_defaults_to_true_when_omitted
        claim_type: defaults
        grounds:
          - entities.Youth.fields.unaccompanied
          - endpoints[POST /ryhs/youths]
        distinguishing_aspect: "Omitting unaccompanied stores true (the declared default) while an explicit false is preserved, so the default is applied only on absence."
        test_recipe:
          setup:
            - "one Youth created with unaccompanied explicitly false, as the contrast case"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Accompanied", legal_last_name: "Youth", date_of_birth: "2010-03-15", unaccompanied: false }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { def_false_id: $.data.id }
          trigger:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Default", legal_last_name: "Youth", date_of_birth: "2010-03-15" }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { def_true_id: $.data.id }
          assert:
            - "the request returns HTTP 201"
            - "Youth.${def_true_id}.unaccompanied == true"
            - "Youth.${def_false_id}.unaccompanied == false"
            - "Youth.${def_true_id}.status == PROSPECT"

      - name: outreach_contact_recomputes_youth_engagement_counters
        claim_type: computed_fields
        grounds:
          - state_machines.Youth.PROSPECT_to_ENGAGED
          - entities.Youth.fields.engagement_contact_count
          - entities.Youth.fields.basic_needs_provision_count
          - entities.OutreachContact
        distinguishing_aspect: "One OutreachContact carrying three basic needs raises engagement_contact_count to 1 and basic_needs_provision_count to 3 - the needs counter counts items, not contacts - and moves Youth.status from PROSPECT to ENGAGED."
        test_recipe:
          setup:
            - "one Youth in status PROSPECT with both counters at 0 at the default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Piet", legal_last_name: "Nkomo", date_of_birth: "2011-01-05", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { comp_youth_id: $.data.id }
          trigger:
            - call: "POST /ryhs/youths/${comp_youth_id}/outreach-contacts"
              payload: { engagement_stage: "FIRST_CONTACT", basic_needs_provided: ["FOOD", "HYGIENE_KIT", "TRANSIT_PASS"], indicator_flags: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { comp_contact_id: $.data.id }
          assert:
            - "the request returns HTTP 201"
            - "OutreachContact.${comp_contact_id}.contacted_at == 2026-08-01T00:00:00Z"
            - "OutreachContact.${comp_contact_id}.worker_user_id == worker-1"
            - "Youth.${comp_youth_id}.engagement_contact_count == 1"
            - "Youth.${comp_youth_id}.basic_needs_provision_count == 3"
            - "Youth.${comp_youth_id}.status == ENGAGED"
            - "Youth.${comp_youth_id}.trafficking_risk_score == 0"
            - "Youth.${comp_youth_id}.governance_vote_eligible == false"
            - "Youth.${comp_youth_id}.version == 2"

      - name: shelter_program_creation_with_zero_bed_capacity_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.ShelterProgram.fields.licensed_bed_capacity
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "licensed_bed_capacity is constrained to >= 1, so a payload of 0 returns 400 ERR_INVALID_REQUEST and no program row is created."
        test_recipe:
          setup:
            - "one valid program already exists, so the rejection is attributable to the field constraint rather than to a global refusal to create programs"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { tc_program_id: $.data.id }
          trigger:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Zero Bed Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 0, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { tc_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /ryhs/shelter-programs returns total_count 1"
            - "ShelterProgram.${tc_program_id}.licensed_bed_capacity == 2"

      - name: safety_screening_with_duplicate_indicator_codes_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.SafetyScreening.fields.indicator_codes
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "indicator_codes must be a duplicate-free subset of the six declared codes, so [CURFEW_ENFORCED, CURFEW_ENFORCED] returns 400 ERR_INVALID_REQUEST rather than double-counting 10 points."
        test_recipe:
          setup:
            - "one youth with one accepted screening carrying a single CURFEW_ENFORCED code, score 10, so the duplicate payload can be compared against it"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Dana", legal_last_name: "Iqbal", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { dup_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${dup_youth_id}/safety-screenings"
              payload: { indicator_codes: ["CURFEW_ENFORCED"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { dup_scr_id: $.data.id }
          trigger:
            - call: "POST /ryhs/youths/${dup_youth_id}/safety-screenings"
              payload: { indicator_codes: ["CURFEW_ENFORCED", "CURFEW_ENFORCED"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { dup_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "SafetyScreening.${dup_scr_id}.score == 10"
            - "SafetyScreening.${dup_scr_id}.tier == LOW"
            - "GET /ryhs/youths/${dup_youth_id}/safety-screenings returns total_count 1"

      - name: savings_ledger_entry_is_immutable_and_exposes_no_version
        claim_type: immutability
        grounds:
          - entities.SavingsLedgerEntry
          - endpoints[GET /ryhs/tlp-placements/{id}/savings-entries]
          - calculations.savings_match_award
        distinguishing_aspect: "SavingsLedgerEntry declares common_fields false, so no version field is returned, no update or delete endpoint exists in the surface, and the first entry's balance_after_cents 1263 stays frozen after a second entry moves the placement balance to 3763."
        test_recipe:
          setup:
            - "an EMERGENCY_SHELTER program, a TRANSITIONAL_LIVING program, and youth Ola Sanchez (dob 2010-03-15, age 16) with a CLEARED screening, an ACTIVE admission whose notification was attempted then resolved CONTACTED, and therefore Youth.status SHELTERED with risk_posture OPEN"
            - "a TlpPlacement in tenancy_status PLACED with documented_monthly_income_cents 90000"
            - "one 1010-cent DEPOSIT has already posted, awarding a 253-cent match and a 1263-cent balance"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { imm_shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { imm_tlp_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ola", legal_last_name: "Sanchez", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { imm_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${imm_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { imm_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${imm_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${imm_youth_id}", program_id: "${imm_shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { imm_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${imm_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { imm_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${imm_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${imm_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${imm_youth_id}", program_id: "${imm_tlp_id}", documented_monthly_income_cents: 90000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { imm_plc_id: $.data.id, imm_plc_v1: $.data.version }
            - call: "POST /ryhs/tlp-placements/${imm_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1010, expected_placement_version: "${imm_plc_v1}", source_note: "first deposit" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { imm_entry1_id: $.data.id }
            - call: "GET /ryhs/tlp-placements/${imm_plc_id}"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { imm_plc_v2: $.data.version }
          trigger:
            - call: "POST /ryhs/tlp-placements/${imm_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 2000, expected_placement_version: "${imm_plc_v2}", source_note: "second deposit" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { imm_entry2_id: $.data.id }
            - call: "GET /ryhs/tlp-placements/${imm_plc_id}/savings-entries"
              payload: { limit: 50, offset: 0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "SavingsLedgerEntry rows expose no version field at all"
            - "SavingsLedgerEntry.${imm_entry1_id}.balance_after_cents == 1263"
            - "SavingsLedgerEntry.${imm_entry1_id}.match_component_cents == 253"
            - "SavingsLedgerEntry.${imm_entry2_id}.balance_after_cents == 3763"
            - "TlpPlacement.${imm_plc_id}.savings_balance_cents == 3763"
            - "GET /ryhs/tlp-placements/${imm_plc_id}/savings-entries returns total_count 2"
            - "the endpoint surface declares no PATCH, PUT or DELETE for savings entries"

      - name: outreach_contact_under_unknown_youth_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.OutreachContact.fields.youth_id
          - validations[priority=4]
          - errors.ERR_YOUTH_NOT_FOUND
        distinguishing_aspect: "The nested outreach-contact path validates its youth segment first, so an unknown youth id returns 404 ERR_YOUTH_NOT_FOUND and no OutreachContact row is created for the real youth."
        test_recipe:
          setup:
            - "one real Youth exists with one OutreachContact already logged, so the collection is non-empty"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Rune", legal_last_name: "Halstead", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { par_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${par_youth_id}/outreach-contacts"
              payload: { engagement_stage: "FIRST_CONTACT", basic_needs_provided: ["FOOD"], indicator_flags: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { par_contact_id: $.data.id }
          trigger:
            - call: "POST /ryhs/youths/22222222-2222-2222-2222-222222222222/outreach-contacts"
              payload: { engagement_stage: "FIRST_CONTACT", basic_needs_provided: ["FOOD"], indicator_flags: [] }
              as: OutreachWorker
