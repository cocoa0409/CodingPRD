  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_subtotal_rounds_each_program_block_line_before_summing
        grounds:
          - calculations.booking_quote_subtotal
          - entities.Booking.fields.raw_subtotal_cents
          - entities.Booking.fields.billable_head_count
          - endpoints["POST /challenge-course/bookings/{booking_id}/quote"]
        distinguishing_aspect: |
          Mode (b) — nested rounding order. The five-line PARTNER program at four
          billable heads sums to 35706 cents when round_half_up runs per program
          block line, and to 35705 cents when the lines are summed first and
          rounded once; the scaffold pins per-line rounding, so 35706 is the only
          correct answer and the one-cent gap falsifies the wrong order.
        test_recipe:
          setup:
            - "Clock at 2026-08-10; one course with GROUND_INITIATIVE, LOW_ELEMENT and HIGH_ELEMENT elements; a PARTNER-tier client (7.5% discount); a booking for 2026-09-15 carrying four non-chaperone participants and the canonical five-block program (icebreaker, ground initiative, low element, high element, debrief)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/courses"
              payload: { course_name: "Pine Ridge Challenge Course", ems_response_minutes: 18, ems_access_note: "Gravel access road; ALS 18 minutes" }
              as: ProgramDirector
              captures: { course_id: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Nitro Crossing", element_type: "GROUND_INITIATIVE", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
              captures: { g_id: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Whale Watch", element_type: "LOW_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 20.0, max_participant_weight_kg: 136.0 }
              as: ProgramDirector
              captures: { l_id: $.data.id }
            - call: "POST /challenge-course/elements"
              payload: { course_id: "${course_id}", element_name: "Pamper Pole", element_type: "HIGH_ELEMENT", installed_on: "2024-08-10", next_professional_inspection_due_on: "2027-06-30", min_participant_weight_kg: 27.0, max_participant_weight_kg: 113.0 }
              as: ProgramDirector
              captures: { h_id: $.data.id }
            - call: "POST /challenge-course/group-clients"
              payload: { client_name: "Ridgeview Middle School", org_type: "SCHOOL", tier: "PARTNER" }
              as: ProgramDirector
              captures: { gc_id: $.data.id }
            - call: "POST /challenge-course/bookings"
              payload: { course_id: "${course_id}", group_client_id: "${gc_id}", program_date: "2026-09-15", expected_participant_count: 4 }
              as: ProgramDirector
              captures: { b_id: $.data.id, b_v0: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v0}", full_name: "Ada Lin", birth_date: "2013-05-10", weight_kg: 45.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "GET /challenge-course/bookings/${b_id}"
              payload: {}
              as: ProgramDirector
              captures: { b_v1: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v1}", full_name: "Ben Ortiz", birth_date: "2013-02-18", weight_kg: 52.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "GET /challenge-course/bookings/${b_id}"
              payload: {}
              as: ProgramDirector
              captures: { b_v2: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v2}", full_name: "Cleo Park", birth_date: "2012-12-01", weight_kg: 61.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "GET /challenge-course/bookings/${b_id}"
              payload: {}
              as: ProgramDirector
              captures: { b_v3: $.data.version }
            - call: "POST /challenge-course/participants"
              payload: { booking_id: "${b_id}", expected_booking_version: "${b_v3}", full_name: "Dev Rao", birth_date: "2013-08-22", weight_kg: 58.0, is_chaperone: false }
              as: GroupCoordinator
              as_user_id: "${gc_id}"
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 1, phase: "ICEBREAKER", planned_start_at: "2026-09-15T09:00:00Z", planned_end_at: "2026-09-15T09:45:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 2, phase: "GROUND_INITIATIVE", element_id: "${g_id}", planned_start_at: "2026-09-15T09:45:00Z", planned_end_at: "2026-09-15T10:30:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 3, phase: "LOW_ELEMENT", element_id: "${l_id}", planned_start_at: "2026-09-15T10:30:00Z", planned_end_at: "2026-09-15T11:30:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 4, phase: "HIGH_ELEMENT", element_id: "${h_id}", planned_start_at: "2026-09-15T13:00:00Z", planned_end_at: "2026-09-15T15:00:00Z" }
              as: ProgramDirector
            - call: "POST /challenge-course/program-blocks"
              payload: { booking_id: "${b_id}", sequence_index: 5, phase: "DEBRIEF", planned_start_at: "2026-09-15T15:15:00Z", planned_end_at: "2026-09-15T16:00:00Z" }
              as: ProgramDirector
            - call: "GET /challenge-course/bookings/${b_id}"
              payload: {}
              as: ProgramDirector
              captures: { b_v4: $.data.version }
          trigger:
            - call: "POST /challenge-course/bookings/${b_id}/quote"
              payload: { expected_booking_version: "${b_v4}" }
              as: ProgramDirector
          assert:
            - "Booking.${b_id}.billable_head_count == 4"
            - "Booking.${b_id}.block_count == 5"
            - "Booking.${b_id}.raw_subtotal_cents == 35706"
            - "Booking.${b_id}.raw_subtotal_cents != 35705"
            - "Booking.${b_id}.status == QUOTED"
            - "Booking.${b_id}.quote_index == 1"

      - name: high_element_surcharge_band_resolved_once_from_pre_surcharge_subtotal
        grounds:
          - calculations.booking_high_element_surcharge
          - calculations.booking_quote_subtotal
          - calculations.booking_deposit_requirement
          - entities.Booking.fields.high_element_surcharge_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order.
          The surcharge band is keyed on raw_subtotal_cents (35706 → 5%) giving
          861 cents and a 36567-cent total; re-resolving the band against the
          surcharge-inclusive total (36567 → 3%) gives 517 cents and 36223, so the
          declared once-only, pre-surcharge evaluation is directly falsifiable.
        test_recipe:
          setup:
