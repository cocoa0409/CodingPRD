  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: session_credit_conservation_across_book_cancel_cycles
        grounds:
          - entities.Enrollment.fields.sessions_consumed
          - entities.Enrollment.fields.sessions_remaining
          - state_machines.Session.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = session credits: for any Enrollment, sessions_consumed
          + sessions_remaining + count(SCHEDULED) + count(FORFEITED) == sessions_total
