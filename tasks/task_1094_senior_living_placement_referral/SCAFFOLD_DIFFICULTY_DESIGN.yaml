        grounds:
          - validations[priority=12]
          - entities.Community.fields.status
          - errors[ERR_COMMUNITY_NOT_ACTIVE]
          - state_machines.Match.SHORTLISTED_to_TOUR_SCHEDULED
        distinguishing_aspect: |
          A DIFFERENT entity pair, Tour -> Community: the Match is in the correct SHORTLISTED
          from-state and the slot and calendar are both free, yet the tour is refused solely
          because the Community was moved to SUSPENDED after the match was created.
        test_recipe:
