            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions/${r}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /meetings/${m}/cancel"
              as: CorporateSecretary
          assert:
            - "Meeting.${m}.status == CANCELLED"
            - "AgendaItem.${ai}.status == DROPPED   # hop 1: meeting -> agenda"
            - "Resolution.${r}.status == DRAFT   # hop 2: dropped item -> linked resolution"
            - "VoteRecord.${v1}.status == VOIDED   # hop 3: reverted resolution -> its ballots"
            - "Resolution.${r}.for_count == 0"

      - name: director_resignation_cascade_to_committee_posture
        grounds:
          - state_machines.Director.ACTIVE_to_RESIGNED
          - state_machines.CommitteeMembership.ACTIVE_to_ENDED
          - state_machines.Committee.ACTIVE_to_BELOW_QUORUM
        distinguishing_aspect: |
          Depth-2 chain from the resign trigger (different trigger than the meeting-cancel
          cascade): Director RESIGNED ends its ACTIVE memberships; each ended membership
          re-evaluates its Committee, flipping it ACTIVE -> BELOW_QUORUM and raising
          chair_vacant. The committee mutation is caused by the membership mutation.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 2 ACTIVE directors D1 D2"
            - "Committee (COMPENSATION, quorum_fixed_count=2) ACTIVE; memberships: D1 CHAIR, D2 MEMBER; active_member_count == 2"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp X2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "Comp", committee_type: "COMPENSATION", charter_text: "charter", quorum_fixed_count: 2 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
            - call: "POST /committees/${cm}/activate"
              as: CorporateSecretary
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d1}", committee_role: "CHAIR", term_start: "2026-02-01T00:00:00Z", term_end: "2028-02-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { mb1: $.data.id }
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d2}", committee_role: "MEMBER", term_start: "2026-02-01T00:00:00Z", term_end: "2028-02-01T00:00:00Z" }
              as: CorporateSecretary
          trigger:
            - call: "POST /directors/${d1}/resign"
              as: Director
              as_user_id: "${d1}"
          assert:
            - "Director.${d1}.status == RESIGNED"
            - "CommitteeMembership.${mb1}.status == ENDED"
            - "CommitteeMembership.${mb1}.ended_reason == DIRECTOR_RESIGNED   # hop 1: director -> membership"
            - "Committee.${cm}.status == BELOW_QUORUM   # hop 2: ended membership -> committee posture (1 < 2)"
            - "Committee.${cm}.chair_vacant == true"
            - "Committee.${cm}.active_member_count == 1"
            - "Corporation.${corp}.active_director_count == 1"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different error-category pairs.
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: convene_cancelled_meeting_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_MEETING_NOT_YET]
        distinguishing_aspect: |
          Category pair (state, business_temporal): convening a CANCELLED meeting while the
          clock is still before scheduled_start violates both p5 (state) and p6 (temporal);
          the p5 state error must win.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 1 ACTIVE director D1 (chair)"
            - "Meeting scheduled 2026-06-20T10:00:00Z then cancelled from SCHEDULED; clock left at default 2026-05-01T00:00:00Z (before start)"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp PP1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/cancel"
              as: CorporateSecretary
          trigger:
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION   # state (p5) beats business_temporal (p6 ERR_MEETING_NOT_YET)"
            - "Meeting.${m}.status == CANCELLED"

      - name: conflicted_director_second_ballot_safety_beats_duplicate
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_CONFLICT_RECUSAL_REQUIRED]
          - errors[ERR_DUPLICATE_VOTE]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint) — different pair than the
          sibling's (state, business_temporal): a conflicted director's second ballot that is
          also non-RECUSED violates both the recusal-compliance rule (p6) and the
          one-ballot uniqueness rule (p8); the safety error must win.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 3 ACTIVE directors (D1 chair); quorum required = 2, all 3 present"
            - "D3 has OPEN disclosure for related_party 'Acme'"
            - "Resolution R (related_party 'Acme') VOTE_OPEN; D3 already cast a compliant RECUSED ballot"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp PP2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D3", email: "d3@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d3: $.data.id }
            - call: "POST /conflict_disclosures"
              payload: { director_id: "${d3}", corporation_id: "${corp}", related_party: "Acme", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d1}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d2}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /attendance_records"
              payload: { meeting_id: "${m}", director_id: "${d3}", attendance_mode: "IN_PERSON" }
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T10:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "Acme deal", text: "text", related_party: "Acme" }
              as: CorporateSecretary
              captures: { r: $.data.id }
            - call: "POST /resolutions/${r}/table"
              as: CorporateSecretary
            - call: "POST /resolutions/${r}/open_vote"
              as: BoardChair
              as_user_id: "${d1}"
            - call: "POST /vote_records"
              payload: { resolution_id: "${r}", channel: "MEETING_BALLOT", vote: "RECUSED" }
              as: Director
              as_user_id: "${d3}"
          trigger:
            - call: "POST /vote_records"
              payload: { resolution_id: "${r}", channel: "MEETING_BALLOT", vote: "FOR" }
              as: Director
              as_user_id: "${d3}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONFLICT_RECUSAL_REQUIRED   # business_safety (p7) beats business_constraint duplicate (p8)"
            - "Resolution.${r}.recused_count == 1 and Resolution.${r}.for_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics on different endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exactly_at_required_count
        grounds:
          - calculations.quorum_determination
          - state_machines.Resolution.TABLED_to_VOTE_OPEN
        distinguishing_aspect: |
          Metric: director head-count; endpoint: POST /resolutions/{id}/open_vote. The boundary
          is >= (inclusive): exactly quorum_required_count present opens the vote; the sibling
          instance's boundary is a timestamp on a different endpoint.
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws (quorum_percent=60, quorum_fixed_count=1), 5 ACTIVE directors (D1 chair) -> required = 3"
            - "Meeting IN_SESSION with EXACTLY 3 present (D1, D2, D3 IN_PERSON); resolution TABLED"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp B1", incorporation_state: "DE" }
