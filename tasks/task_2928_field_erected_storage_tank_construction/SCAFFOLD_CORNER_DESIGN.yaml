              as: ErectionSuperintendent
          assert:
            - "HTTP 200 and the response body is the ShellCourse: data.id == ${course_id}, allocated_plate_lot_id == ${lot_id}, allocated_weight_lb == 8000.00, allocation_status == 'ALLOCATED'"
            - "PlateLot.${lot_id}.allocated_weight_lb == 8000.00 and remaining_weight_lb == 4505.00 (12505.00 - 8000.00)"
            - "Tank.${tank_id}.steel_received_lb == 12505.00 and steel_allocated_lb == 8000.00"
            - "the link is reverse-reachable from both sides: GET /shell-courses?allocated_plate_lot_id=${lot_id} returns total_count == 1 and GET /plate-lots?tank_id=${tank_id} returns total_count == 1"

      - name: tank_summary_computed_read_matches_the_underlying_rows
        claim_type: computed_read
        grounds:
