  - section: calculations
    instances:
      - name: siting_criteria_evaluation_flags_every_violated_criterion
        claim_type: correct_result
        grounds:
          - calculations.siting_criteria_evaluation
          - entities.MonitoringSite.fields.siting_violation_codes
          - entities.MonitoringSite.fields.siting_waiver_required
        distinguishing_aspect: "A population-oriented site with probe_height_m 1.5, distance_to_roadway_m 5.0 and distance_to_obstruction_m 4.0 under a 6.0 m obstruction returns siting_violation_codes exactly ['OBSTRUCTION_CLEARANCE', 'PROBE_HEIGHT', 'ROADWAY_SETBACK'] in ascending alphabetical order, while the source and background criteria fire only for their own site_type."
        test_recipe:
          setup:
            - "one network with no sites, logical clock at 2026-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
          trigger:
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-BAD", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 1.5, distance_to_roadway_m: 5.0, distance_to_obstruction_m: 4.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { s_bad_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-BKG", site_type: "BACKGROUND", latitude: 40.10, longitude: -105.30, population_served: 0, probe_height_m: 4.0, distance_to_roadway_m: 50.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { s_bkg_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-SRC", site_type: "SOURCE_ORIENTED", latitude: 39.60, longitude: -104.80, population_served: 12000, probe_height_m: 4.0, distance_to_roadway_m: 40.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 800.0 }
              as: NetworkAdmin
              captures: { s_src_id: "$.data.id" }
          assert:
            - "MonitoringSite.${s_bad_id}.siting_violation_codes == ['OBSTRUCTION_CLEARANCE', 'PROBE_HEIGHT', 'ROADWAY_SETBACK'] and siting_waiver_required == true"
            - "MonitoringSite.${s_bkg_id}.siting_violation_codes == ['BACKGROUND_ISOLATION'] and siting_waiver_required == true - 50.0 is below BACKGROUND_ROADWAY_MIN_M 100.0, and the 2:1 clearance of 2 * (6.0 - 4.0) == 4.0 m is met by 12.0 m"
            - "MonitoringSite.${s_src_id}.siting_violation_codes == ['SOURCE_DISTANCE'] and siting_waiver_required == true - 800.0 exceeds SOURCE_MAX_DISTANCE_M 500.0, and the roadway setback does not apply to a SOURCE_ORIENTED site"
            - "MonitoringNetwork.${net_id}.total_site_count == 3 and waiver_required_site_count == 3"

      - name: siting_criteria_boundaries_are_inclusive_and_yield_no_violation
        claim_type: constants_applied
        grounds:
          - calculations.siting_criteria_evaluation
          - calculations.siting_criteria_evaluation.constants
        distinguishing_aspect: "probe_height_m exactly 2.0 and exactly 15.0, distance_to_roadway_m exactly 10.0 and a clearance of exactly 2 * (6.0 - 2.0) == 8.0 m all pass, while probe_height_m 15.01 alone raises PROBE_HEIGHT - the band ends are inclusive and the clearance test is strict-less-than."
        test_recipe:
          setup:
            - "one network with no sites"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
          trigger:
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-LOW", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 2.0, distance_to_roadway_m: 10.0, distance_to_obstruction_m: 8.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { s_low_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-HIGH", site_type: "POPULATION_ORIENTED", latitude: 39.76, longitude: -104.98, population_served: 400000, probe_height_m: 15.0, distance_to_roadway_m: 10.0, distance_to_obstruction_m: 0.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { s_high_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-OVER", site_type: "POPULATION_ORIENTED", latitude: 39.77, longitude: -104.97, population_served: 400000, probe_height_m: 15.01, distance_to_roadway_m: 10.0, distance_to_obstruction_m: 0.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { s_over_id: "$.data.id" }
          assert:
            - "MonitoringSite.${s_low_id}.siting_violation_codes == [] and siting_waiver_required == false"
            - "MonitoringSite.${s_high_id}.siting_violation_codes == [] and siting_waiver_required == false - the required clearance 2 * (6.0 - 15.0) is negative, so the obstruction test is skipped entirely"
            - "MonitoringSite.${s_over_id}.siting_violation_codes == ['PROBE_HEIGHT'] and siting_waiver_required == true"
            - "MonitoringNetwork.${net_id}.waiver_required_site_count == 1 out of total_site_count 3"

