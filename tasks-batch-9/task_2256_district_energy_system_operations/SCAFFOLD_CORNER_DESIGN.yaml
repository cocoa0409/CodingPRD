            - "the July creation still carrying version 2 returns 412 with ${e_stale_after_issue} == ERR_STALE_AGREEMENT_VERSION, ahead of the period-overlap and meter-data checks"
            - "GET /district-energy/invoices?agreement_id=${cg1_id} still has total_count == 1"

      - name: arrears_threshold_fires_only_strictly_above_the_ceiling_and_resets_on_payment
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.ConnectionAgreement.CURRENT_to_IN_ARREARS
          - state_machines.ConnectionAgreement.IN_ARREARS_to_CURRENT
          - calculations.invoice_billing_determinants
        distinguishing_aspect: "The arrears cascade uses a strict comparison against ARREARS_THRESHOLD_AMOUNT, so a balance of exactly 25000.00 stays CURRENT while 25000.01 flips to IN_ARREARS; both totals are pinned by the minimum-bill floor rather than by usage, and paying the larger invoice in full drives the balance back to 0.00 and the billing dimension back to CURRENT while the contract dimension never moves."
        test_recipe:
          setup:
            - "Two RateSchedules identical except for the floor: RS-T1 with minimum_bill_amount 25000.00 and RS-T2 with 25000.01."
            - "Agreements CT1 on RS-T1 and CT2 on RS-T2, both ACTIVE on LOOP-T with reserved_capacity_kw 100.0."
            - "Each agreement has one commissioned meter with ACTUAL reads 0.000 at 40.0 and 1.000 at 45.0, so the computed subtotal is 420.00 and the floor decides the total."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-T", name: "Threshold Loop T", service_mode: "HEATING", design_supply_temp_c: 88.0, max_pressure_kpa: 1300.0, rated_capacity_kw: 4000.0 }
