            - call: "POST /health-office/action-plans/${plan_id}/submit"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/action-plans/${plan_id}/guardian-consent"
              payload: {}
              as: Guardian
