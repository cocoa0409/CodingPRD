# =============================================================================
# SCAFFOLD — Payment Card Security Assessment (Qualified Security Assessor firm)
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines · §1.2.1 Concurrency
# §1.3 Calculations · §1.4 Validations · §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2588. Payment Card Security Assessment (qualified security assessor firm): scope definition with
  cardholder data environment boundaries, segmentation validation and connected system identification,
  assessment planning across requirements with sampling methodology for facilities and systems,
  evidence collection through documentation review, interviews and observation with testing procedures
  per requirement, compensating control worksheet development where a stated requirement cannot be met,
  remediation coordination for gaps identified during the assessment before report finalization, report
  on compliance authoring with attestation signature and submission to acquirers or brands, quarterly
  scanning coordination with approved scanning vendors and dispute of false positives, annual
  reassessment planning with change tracking during the year

domain_name: payment-card-security-assessment
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Segments form a self-referential tree (NetworkSegment.parent_segment_id) whose subtree closure
  # drives component reclassification; components, requirement assessments, evidence, scan findings
  # and remediation items reference each other across aggregate boundaries by foreign key rather
  # than by URL nesting depth. No entity is reachable only through a single ownership chain.

  state_machine_shape: parallel
  # RequirementAssessment carries two independent state dimensions (test_status x remediation_status);
  # NetworkSegment is cyclic (TEST_PLANNED -> FAILED -> TEST_PLANNED); RocReport and Engagement are
  # cyclic through QA rejection; CompensatingControlWorksheet and ScanCycle are branching fork shapes.

  relationship_patterns:
    - one_to_many        # Engagement -> segments, components, requirement assessments, scan cycles
    - self_referential   # NetworkSegment.parent_segment_id -> NetworkSegment.id (subtree closure)
    - cross_aggregate    # RemediationItem.source_scan_finding_id -> ScanFinding.id (scan -> ROC path)
    - polymorphic        # RemediationItem.source distinguishes conclusion / reopen / scan origins

  role_model: segregation_of_duties
  # The QA reviewer of a Report on Compliance may not be the engagement lead and may not have
  # collected any evidence on that engagement; the ASV that decides a false-positive dispute is a
  # different party from the assessor that raised it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities · 69 endpoints · 69 error codes · 9 calculations (3 dual-variant) · 10 state
  # machine dimensions across 9 entities (3 cyclic, 1 parallel, 3 branching). Deliberately above
  # the Expert band because the brief asks for a task harder than expert level; the extra volume
  # is all coupling surface — five cascade chains, three conserved-quantity invariants and two
  # sampling variants that disagree on the same component inventory.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Assessor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the QSA-certified individual; must match an attestation signature verbatim.
      - name: email
        type: string
        source: input
        description: Contact address; unique across assessors.
        constraints: unique
      - name: certification_expires_at
        type: datetime
        source: input
        description: Instant at which this individual's QSA certification lapses (ISO 8601 UTC).
      - name: qa_qualified
        type: boolean
        source: input
        description: Whether the firm has authorised this individual to perform internal quality assurance review.
        default: false
      - name: status
        type: enum
        source: system
        description: Administrative standing of the assessor.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: certification_status
        type: enum
        source: computed
        description: ACTIVE when logical clock < certification_expires_at, else LAPSED.
        constraints: "ACTIVE | LAPSED"
      - name: lead_engagement_count
        type: integer
        source: computed
        description: Count of Engagement rows whose lead_assessor_id is this assessor and whose status != REASSESSMENT_PLANNED.

  - name: AsvVendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Trading name of the Approved Scanning Vendor.
        constraints: unique
      - name: approval_expires_at
        type: datetime
        source: input
        description: Instant at which the vendor's ASV approval lapses (ISO 8601 UTC).
      - name: approval_status
        type: enum
        source: system
        description: Administrative standing of the vendor approval.
        default: APPROVED
        constraints: "APPROVED | REVOKED"
      - name: effective_approval
        type: enum
        source: computed
        description: "REVOKED when approval_status == REVOKED; else EXPIRED when logical clock >= approval_expires_at; else APPROVED."
        constraints: "APPROVED | EXPIRED | REVOKED"

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - name: client_legal_name
        type: string
        source: input
        description: Legal entity name of the assessed merchant or service provider.
      - name: merchant_level
        type: enum
        source: input
        description: Card-brand merchant level; L1 attracts the onsite-assessment surcharge in §1.3 assessment_fee_total.
        constraints: "L1 | L2 | L3 | L4"
      - name: assessment_year
        type: integer
        source: input
        description: Calendar year the assessment covers.
      - name: acquirer_name
        type: string
        source: input
        description: Acquiring bank that receives the attestation.
      - name: fieldwork_start_date
        type: string
        source: input
        description: "First calendar date of onsite fieldwork (YYYY-MM-DD); closed-interval start for the assessor calendar rule in §1.4 priority 12."
      - name: fieldwork_end_date
        type: string
        source: input
        description: "Last calendar date of onsite fieldwork (YYYY-MM-DD); closed-interval end. Must be >= fieldwork_start_date."
      - name: approved_budget_amount
        type: number
        source: input
        description: Fee ceiling the client approved; assessment_fee_total may never exceed it.
        constraints: "> 0, 2 decimal places"
      - name: lead_assessor_id
        type: string
        source: input
        description: "FK -> Assessor.id; the QSA of record who signs the attestation."
      - name: qa_reviewer_id
        type: string
        source: system
        description: "FK -> Assessor.id; internal quality-assurance reviewer, set by POST /engagements/{id}/qa-reviewer. Null until assigned."
        default: null
      - name: status
        type: enum
        source: system
        description: Engagement lifecycle state (see §1.2 Engagement).
        default: SCOPING
        constraints: "SCOPING | FIELDWORK | REPORTING | ATTESTED | SUBMITTED | REASSESSMENT_PLANNED"
      - name: posture
        type: enum
        source: computed
        description: Derived gate over all child write operations; recomputed by §1.3 engagement_posture after every mutation that touches segments, remediation items, sampling plans or engagement status.
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: scope_locked
        type: boolean
        source: system
        description: True once POST /engagements/{id}/scope-lock has succeeded; segments and components may still be added while FIELDWORK but every addition is change-logged.
        default: false
      - name: cde_component_count
        type: integer
        source: computed
        description: Count of SystemComponent rows for this engagement with scope_class == CDE.
      - name: connected_component_count
        type: integer
        source: computed
        description: Count of SystemComponent rows for this engagement with scope_class == CONNECTED.
      - name: out_of_scope_component_count
        type: integer
        source: computed
        description: Count of SystemComponent rows for this engagement with scope_class == OUT_OF_SCOPE.
      - name: in_scope_component_count
        type: integer
        source: computed
        description: "cde_component_count + connected_component_count; the conserved partition invariant is cde + connected + out_of_scope == total component rows."
      - name: unvalidated_segment_count
        type: integer
        source: computed
        description: Count of NetworkSegment rows for this engagement with segmentation_status IN {DECLARED, TEST_PLANNED, FAILED}.
      - name: open_gap_count
        type: integer
        source: computed
        description: Count of RemediationItem rows for this engagement with status IN {OPEN, IN_PROGRESS, RETEST_FAILED}.
      - name: unmet_requirement_count
        type: integer
        source: computed
        description: Count of RequirementAssessment rows for this engagement with test_status IN {NOT_IN_PLACE, NOT_TESTED}.
      - name: applicable_requirement_count
        type: integer
        source: computed
        description: Count of RequirementAssessment rows for this engagement with test_status != NOT_APPLICABLE.
      - name: accepted_ccw_count
        type: integer
        source: computed
        description: Count of CompensatingControlWorksheet rows for this engagement with status == ACCEPTED.
      - name: active_sampling_plan_id
        type: string
        source: computed
        description: "Id of the single SamplingPlan row for this engagement whose status == ACTIVE (selector: GET /sampling-plans?engagement_id=<id>&status=ACTIVE); null when none exists."
        default: null
      - name: active_plan_stale
        type: boolean
        source: computed
        description: True when the engagement's most recently created SamplingPlan has status == STALE.
        default: false
      - name: estimated_hours
        type: number
        source: computed
        description: Output of step 1 of §1.3 assessment_fee_total.
      - name: assessment_fee_total
        type: number
        source: computed
        description: Output of §1.3 assessment_fee_total; recomputed on sampling-plan creation, CCW acceptance and engagement patch.
      - name: as_found_compliance_percentage
        type: number
        source: computed
        description: AS_FOUND variant of §1.3 compliance_projection, 2 decimal places.
      - name: as_attested_compliance_percentage
        type: number
        source: computed
        description: AS_ATTESTED variant of §1.3 compliance_projection, 2 decimal places.
      - name: quarterly_scan_compliant
        type: boolean
        source: computed
        description: True when at least one ScanCycle for this engagement has status == PASSING and window_start <= logical clock < window_start + 90 days.
      - name: scope_affecting_change_count
        type: integer
        source: computed
        description: Count of ChangeLogEntry rows for this engagement with triggers_reassessment == true.
      - name: reassessment_required
        type: boolean
        source: computed
        description: "True when scope_affecting_change_count >= 3 (inclusive threshold, §1.3 reassessment_trigger)."
        default: false
      - name: reassessment_due_date
        type: string
        source: system
        description: "Date the next assessment is due (YYYY-MM-DD); set to clock_date + 365 days on ROC submission and pulled forward to clock_date + 90 days when reassessment_required first flips true."
        default: null
      - name: next_assessment_start_date
        type: string
        source: system
        description: "Planned start date of the following year's assessment (YYYY-MM-DD), set by POST /engagements/{id}/reassessment-plan."
        default: null
      - name: attested_at
        type: datetime
        source: system
        description: Logical-clock instant at which the ROC was attested; null before attestation.
        default: null

  - name: NetworkSegment
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; taken from the creation path."
      - name: name
        type: string
        source: input
        description: Human label of the network zone.
        constraints: "unique per engagement_id"
      - name: segment_class
        type: enum
        source: input
        description: Class the client declared for this zone before segmentation testing.
        constraints: "CDE | CONNECTED | OUT_OF_SCOPE"
      - name: parent_segment_id
        type: string
        source: input
        description: "FK -> NetworkSegment.id; enclosing zone within the same engagement, null for a root zone. A parent chain that revisits this row is rejected."
        default: null
      - name: segmentation_status
        type: enum
        source: system
        description: Segmentation-validation state (see §1.2 NetworkSegment).
        default: DECLARED
        constraints: "DECLARED | TEST_PLANNED | VALIDATED | FAILED | WITHDRAWN"
      - name: test_method
        type: enum
        source: system
        description: Method recorded by POST /network-segments/{id}/segmentation-test-plan; null while DECLARED.
        default: null
        constraints: "PEN_TEST | CONFIG_REVIEW | TRAFFIC_ANALYSIS"
      - name: planned_date
        type: string
        source: system
        description: "Planned segmentation-test date (YYYY-MM-DD) recorded with the test plan; null while DECLARED."
        default: null
      - name: effective_class
        type: enum
        source: computed
        description: "segment_class while segmentation_status != FAILED; CDE for this row and every descendant row once a FAILED verdict lands on this row or any ancestor (segmentation unproven => treat as cardholder data environment)."
        constraints: "CDE | CONNECTED | OUT_OF_SCOPE"
      - name: scope_expanded_by_failure
        type: boolean
        source: computed
        description: True while this row's FAILED verdict is still the reason its subtree carries effective_class CDE; cleared when a later PASS verdict restores declared classes.
        default: false
      - name: revalidation_round
        type: integer
        source: system
        description: Number of times this row has re-entered TEST_PLANNED from FAILED.
        default: 0
      - name: last_validated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent PASS verdict; null until then.
        default: null

  - name: SystemComponent
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; taken from the creation path."
      - name: segment_id
        type: string
        source: input
        description: "FK -> NetworkSegment.id; the zone this component sits in. Must belong to the same engagement."
      - name: hostname
        type: string
        source: input
        description: Identifier used as the deterministic secondary sort key of the in-sample selector.
        constraints: "unique per engagement_id"
      - name: component_type
        type: enum
        source: input
        description: Sampling stratum of the component.
        constraints: "SERVER | NETWORK_DEVICE | POS_TERMINAL | APPLICATION | DATABASE"
      - name: function_class
        type: enum
        source: input
        description: Functional role for requirement mapping.
        constraints: "PAYMENT_APPLICATION | DATA_STORE | SECURITY_SERVICE | CONNECTED_SUPPORT | SEGMENTATION_CONTROL"
      - name: stores_chd
        type: boolean
        source: input
        description: Whether the component stores cardholder data; primary sort key of the in-sample selector (true first).
      - name: facility_name
        type: string
        source: input
        description: Physical location grouping key; all components sharing a facility_name within an engagement must share facility_type.
      - name: facility_type
        type: enum
        source: input
        description: Facility category driving the facility sampling rank (DATA_CENTER=1, CALL_CENTER=2, RETAIL_STORE=3, OFFICE=4).
        constraints: "DATA_CENTER | CALL_CENTER | RETAIL_STORE | OFFICE"
      - name: declared_scope_class
        type: enum
        source: computed
        description: Copy of the owning segment's segment_class at creation time; never changes afterwards. Input set of the PRELIMINARY sampling variant.
        constraints: "CDE | CONNECTED | OUT_OF_SCOPE"
      - name: scope_class
        type: enum
        source: computed
        description: Owning segment's effective_class, recomputed on every segmentation verdict cascade. Input set of the FINAL sampling variant.
        constraints: "CDE | CONNECTED | OUT_OF_SCOPE"
      - name: sampling_stratum
        type: enum
        source: computed
        description: Equal to component_type; named separately because the sampling allocation iterates strata in a pinned order.
        constraints: "SERVER | NETWORK_DEVICE | POS_TERMINAL | APPLICATION | DATABASE"
      - name: in_sample
        type: boolean
        source: computed
        description: True when the engagement's ACTIVE SamplingPlan selected this component; reset to false for every component of the engagement whenever a new plan is created.
        default: false

  - name: SamplingPlan
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; taken from the creation path."
      - name: plan_variant
        type: enum
        source: input
        description: Which §1.3 sampling variant computed this plan.
        constraints: "PRELIMINARY | FINAL"
      - name: justification_text
        type: string
        source: input
        description: Assessor rationale required by the sampling methodology.
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: Plan validity state (see §1.2 SamplingPlan).
        default: ACTIVE
        constraints: "ACTIVE | STALE | SUPERSEDED"
      - name: eligible_component_count
        type: integer
        source: computed
        description: Size of the variant's eligible population at creation time.
      - name: component_sample_size
        type: integer
        source: computed
        description: Output of §1.3 component_sample_allocation (per-stratum ceiling then sum).
      - name: stratum_allocations
        type: object
        source: computed
        description: "Map of stratum -> allocated count, keys emitted in the pinned stratum order."
      - name: facility_population_count
        type: integer
        source: computed
        description: Number of distinct facility_name groups holding at least one eligible component.
      - name: facility_sample_size
        type: integer
        source: computed
        description: Output of §1.3 facility_sample_selection.
      - name: sampled_facility_names
        type: array
        source: computed
        description: Selected facility_name values in the pinned ranking order.
      - name: coverage_ratio
        type: number
        source: computed
        description: "round(component_sample_size / eligible_component_count, 4), round_half_up; 0.0000 when the population is empty is unreachable because an empty population is rejected."
      - name: superseded_at
        type: datetime
        source: system
        description: Logical-clock instant at which a newer plan replaced this one; null while ACTIVE or STALE.
        default: null

  - name: RequirementAssessment
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; taken from the creation path."
      - name: requirement_ref
        type: string
        source: input
        description: Dotted requirement identifier such as "6.4.1".
        constraints: "unique per engagement_id"
      - name: requirement_family
        type: enum
        source: input
        description: Top-level requirement family; drives risk_points and therefore remediation severity and CCW risk offset.
        constraints: "R1 | R2 | R3 | R4 | R5 | R6 | R7 | R8 | R9 | R10 | R11 | R12"
      - name: testing_procedure_count
        type: integer
        source: input
        description: Number of testing procedures the requirement carries; the evidence-completeness floor.
        constraints: ">= 1"
      - name: applicability
        type: enum
        source: input
        description: Whether the requirement applies to this client.
        constraints: "APPLICABLE | NOT_APPLICABLE"
      - name: test_status
        type: enum
        source: system
        description: Testing dimension of the parallel state machine (see §1.2 RequirementAssessment / test_status).
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_TESTING | IN_PLACE | IN_PLACE_WITH_CCW | NOT_IN_PLACE | NOT_TESTED | NOT_APPLICABLE"
      - name: remediation_status
        type: enum
        source: system
        description: Gap dimension of the parallel state machine, independent of test_status (see §1.2 RequirementAssessment / remediation_status).
        default: NONE
        constraints: "NONE | GAP_OPEN | GAP_REMEDIATED | GAP_ACCEPTED_CCW"
      - name: evidence_item_count
        type: integer
        source: computed
        description: Count of EvidenceItem rows whose requirement_assessment_id is this row.
        default: 0
      - name: evidence_type_coverage
        type: array
        source: computed
        description: Distinct evidence_type values collected so far with sufficiency == SUFFICIENT, ordered DOCUMENT_REVIEW, INTERVIEW, OBSERVATION, SYSTEM_CONFIG.
      - name: evidence_completeness
        type: boolean
        source: computed
        description: "True when evidence_item_count >= testing_procedure_count AND evidence_type_coverage contains all of DOCUMENT_REVIEW, INTERVIEW and OBSERVATION (INSUFFICIENT items count toward evidence_item_count but never toward coverage)."
        default: false
      - name: conclusion_rationale
        type: string
        source: system
        description: Rationale text recorded by the most recent conclusion; null before the first conclusion.
        default: null
      - name: reopen_count
        type: integer
        source: system
        description: Number of times a concluded requirement has been driven back into IN_TESTING.
        default: 0
      - name: risk_points
        type: integer
        source: computed
        description: "Family risk weight from §1.3 constants FAMILY_RISK_POINTS; drives RemediationItem.severity and the CCW risk offset."

  - name: EvidenceItem
    parent: RequirementAssessment
    common_fields: false
    fields:
      - name: requirement_assessment_id
        type: string
        source: system
        description: "FK -> RequirementAssessment.id; taken from the creation path."
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; denormalised from the parent requirement so the independence check can scan an engagement's collectors in one query."
      - name: evidence_type
        type: enum
        source: input
        description: Collection technique used for this procedure.
        constraints: "DOCUMENT_REVIEW | INTERVIEW | OBSERVATION | SYSTEM_CONFIG"
      - name: procedure_ref
        type: string
        source: input
        description: Testing-procedure identifier this item satisfies; the triple (procedure_ref, evidence_type, component_id) is unique per requirement.
      - name: component_id
        type: string
        source: input
        description: "FK -> SystemComponent.id; the sampled component observed, required for OBSERVATION and SYSTEM_CONFIG, null otherwise."
        default: null
      - name: interviewee_name
        type: string
        source: input
        description: Name of the client staff member interviewed; required when evidence_type == INTERVIEW.
        default: null
      - name: interviewee_title
        type: string
        source: input
        description: Job title of the interviewee; optional.
        default: null
      - name: sufficiency
        type: enum
        source: input
        description: Assessor judgement of whether this item alone satisfies the procedure.
        constraints: "SUFFICIENT | INSUFFICIENT"
      - name: collector_assessor_id
        type: string
        source: system
        description: "FK -> Assessor.id; taken from the X-User-ID header of the collecting call. Read by the QA independence rule."
      - name: collected_at
        type: datetime
        source: system
        description: Logical-clock instant at which the item was recorded.
      - name: note
        type: string
        source: input
        description: Free-text observation note.
        default: null

  - name: CompensatingControlWorksheet
    parent: RequirementAssessment
    common_fields: true
    fields:
      - name: requirement_assessment_id
        type: string
        source: system
        description: "FK -> RequirementAssessment.id; taken from the creation path."
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; denormalised from the parent requirement."
      - name: constraint_text
        type: string
        source: input
        description: Section 1 of the worksheet - the business or technical constraint preventing the stated requirement.
        constraints: "non-empty"
      - name: objective_text
        type: string
        source: input
        description: Section 2 - objective of the original requirement.
        constraints: "non-empty"
      - name: identified_risk_text
        type: string
        source: input
        description: Section 3 - risk arising from the absent control.
        constraints: "non-empty"
      - name: control_refs
        type: array
        source: input
        description: Section 4 - identifiers of the compensating controls; distinct entries drive control_depth_points.
        constraints: "array of non-empty strings, >= 1 entry"
      - name: monitoring_interval_days
        type: integer
        source: input
        description: Section 5 - how often the compensating controls are verified, in days.
        constraints: ">= 1"
      - name: validation_text
        type: string
        source: input
        description: Section 5 narrative - how the controls were validated.
        constraints: "non-empty"
      - name: maintenance_text
        type: string
        source: input
        description: Section 6 - how the controls will be maintained.
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: Worksheet lifecycle state (see §1.2 CompensatingControlWorksheet).
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED"
      - name: control_depth_points
        type: number
        source: computed
        description: "min(100, CONTROL_UNIT_POINTS * count(distinct control_refs))."
      - name: monitoring_factor
        type: number
        source: computed
        description: Step function of monitoring_interval_days per §1.3 ccw_rigor_score.
      - name: risk_offset_points
        type: number
        source: computed
        description: "max(0, 100 - 15 * parent requirement risk_points)."
      - name: rigor_score
        type: number
        source: computed
        description: Output of §1.3 ccw_rigor_score, 2 decimal places; the acceptance gate compares it to 70.00 inclusively.
      - name: thin_control_capped
        type: boolean
        source: computed
        description: True when fewer than 2 distinct control_refs forced the score down to the 40.00 cap.
        default: false
      - name: reviewer_note
        type: string
        source: system
        description: QA reviewer note recorded with the decision; null while DRAFT or SUBMITTED.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the accept/reject decision; null before it.
        default: null

  - name: RemediationItem
    parent: RequirementAssessment
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; copied from the requirement that produced the gap."
      - name: requirement_assessment_id
        type: string
        source: system
        description: "FK -> RequirementAssessment.id; the requirement whose gap this item tracks."
      - name: source
        type: enum
        source: system
        description: Which cascade created this row.
        constraints: "REQUIREMENT_CONCLUSION | REQUIREMENT_REOPEN | SCAN_FINDING_REJECTED"
      - name: source_scan_finding_id
        type: string
        source: system
        description: "FK -> ScanFinding.id; set only when source == SCAN_FINDING_REJECTED, null otherwise."
        default: null
      - name: gap_description
        type: string
        source: system
        description: Text minted by the creating cascade, quoting the requirement_ref and the trigger.
      - name: severity
        type: enum
        source: computed
        description: "CRITICAL when parent risk_points >= 5, HIGH when == 4, MEDIUM when == 3, LOW when <= 2."
        constraints: "CRITICAL | HIGH | MEDIUM | LOW"
      - name: status
        type: enum
        source: system
        description: Remediation lifecycle state (see §1.2 RemediationItem).
        default: OPEN
        constraints: "OPEN | IN_PROGRESS | RETEST_PASSED | RETEST_FAILED | CLOSED_BY_CCW"
      - name: owner_reference
        type: string
        source: input
        description: Client-side owner label recorded at assignment; null while OPEN.
        default: null
      - name: due_date
        type: string
        source: input
        description: "Client commitment date (YYYY-MM-DD) recorded at assignment; null while OPEN."
        default: null
      - name: retest_count
        type: integer
        source: system
        description: Number of retest verdicts recorded against this item.
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the item reached RETEST_PASSED or CLOSED_BY_CCW.
        default: null

  - name: RocReport
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; taken from the creation path. At most one row per engagement."
      - name: roc_version_label
        type: string
        source: input
        description: Firm's document version label for the report.
      - name: status
        type: enum
        source: system
        description: Report lifecycle state (see §1.2 RocReport).
        default: DRAFTING
        constraints: "DRAFTING | IN_QA | QA_APPROVED | QA_REJECTED | ATTESTED | SUBMITTED"
      - name: applicable_requirement_count
        type: integer
        source: computed
        description: Denominator of §1.3 compliance_projection, frozen at each recomputation point.
      - name: in_place_count
        type: integer
        source: computed
        description: Count of parent-engagement requirements with test_status == IN_PLACE.
      - name: ccw_covered_count
        type: integer
        source: computed
        description: Count of parent-engagement requirements with test_status == IN_PLACE_WITH_CCW.
      - name: not_in_place_count
        type: integer
        source: computed
        description: Count of parent-engagement requirements with test_status IN {NOT_IN_PLACE, NOT_TESTED}.
      - name: as_found_compliance_percentage
        type: number
        source: computed
        description: AS_FOUND variant of §1.3 compliance_projection at the moment of the latest recomputation.
      - name: as_attested_compliance_percentage
        type: number
        source: computed
        description: AS_ATTESTED variant of §1.3 compliance_projection at the moment of the latest recomputation.
      - name: compliance_result
        type: enum
        source: computed
        description: "COMPLIANT when as_attested_compliance_percentage == 100.00, else NON_COMPLIANT."
        constraints: "COMPLIANT | NON_COMPLIANT"
      - name: attestation_signature_name
        type: string
        source: input
        description: Typed signature captured at attestation; must equal the attesting assessor's full_name verbatim.
        default: null
      - name: attesting_assessor_id
        type: string
        source: system
        description: "FK -> Assessor.id; the X-User-ID of the attesting call, null before attestation."
        default: null
      - name: attested_at
        type: datetime
        source: system
        description: Logical-clock instant of attestation; null before it.
        default: null
      - name: submitted_to
        type: enum
        source: input
        description: Recipient of the submission; null before submission.
        default: null
        constraints: "ACQUIRER | CARD_BRAND"
      - name: submission_reference
        type: string
        source: input
        description: Recipient-side tracking reference; null before submission.
        default: null
      - name: qa_decision_note
        type: string
        source: system
        description: Note recorded by the latest QA decision; null before the first decision.
        default: null
      - name: revision_count
        type: integer
        source: system
        description: Number of times the report has returned to DRAFTING after a QA rejection.
        default: 0

  - name: ScanCycle
    parent: Engagement
    common_fields: true
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; taken from the creation path."
      - name: asv_vendor_id
        type: string
        source: input
        description: "FK -> AsvVendor.id; the approved scanning vendor running this quarter's external scan."
      - name: quarter_label
        type: string
        source: input
        description: Client-facing quarter label such as "2026-Q3".
        constraints: "unique per engagement_id"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the 90-day scan window (ISO 8601 UTC).
      - name: window_end
        type: datetime
        source: computed
        description: "Exclusive end of the scan window: window_start + 90 days. Two cycles may share this instant exactly."
      - name: status
        type: enum
        source: system
        description: Scan cycle state (see §1.2 ScanCycle).
        default: SCHEDULED
        constraints: "SCHEDULED | PASSING | FAILING | DISPUTE_OPEN"
      - name: raw_high_finding_count
        type: integer
        source: computed
        description: Count of child ScanFinding rows with severity_class == HIGH_OR_ABOVE.
        default: 0
      - name: accepted_false_positive_count
        type: integer
        source: computed
        description: Count of child ScanFinding rows with severity_class == HIGH_OR_ABOVE and dispute_status == ACCEPTED_FALSE_POSITIVE.
        default: 0
      - name: effective_high_finding_count
        type: integer
        source: computed
        description: "raw_high_finding_count - accepted_false_positive_count; the conserved finding-ledger identity is raw == effective + accepted_false_positive."
        default: 0
      - name: open_dispute_count
        type: integer
        source: computed
        description: Count of child ScanFinding rows with dispute_status == DISPUTED.
        default: 0
      - name: scan_completed_at
        type: datetime
        source: system
        description: Logical-clock instant stamped when the cycle leaves SCHEDULED; null before that.
        default: null
      - name: attestation_of_scan_compliance
        type: boolean
        source: computed
        description: True exactly when status == PASSING.
        default: false

  - name: ScanFinding
    parent: ScanCycle
    common_fields: true
    fields:
      - name: scan_cycle_id
        type: string
        source: system
        description: "FK -> ScanCycle.id; taken from the creation path."
      - name: component_id
        type: string
        source: input
        description: "FK -> SystemComponent.id; the scanned host. Must belong to the cycle's engagement."
      - name: plugin_reference
        type: string
        source: input
        description: Vendor plugin or CVE identifier.
      - name: cvss_score
        type: number
        source: input
        description: Base CVSS score reported by the vendor, 1 decimal place.
        constraints: "0.0 .. 10.0"
      - name: severity_class
        type: enum
        source: computed
        description: "HIGH_OR_ABOVE when cvss_score >= 4.0 (inclusive), else LOW."
        constraints: "HIGH_OR_ABOVE | LOW"
      - name: dispute_status
        type: enum
        source: system
        description: False-positive dispute dimension (see §1.2 ScanFinding).
        default: NONE
        constraints: "NONE | DISPUTED | ACCEPTED_FALSE_POSITIVE | REJECTED"
      - name: dispute_rationale
        type: string
        source: input
        description: Assessor or client argument for the false-positive claim; null while NONE.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Vendor note recorded with the dispute decision; null before it.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the dispute decision; null before it.
        default: null

  - name: ChangeLogEntry
    parent: Engagement
    common_fields: false
    fields:
      - name: engagement_id
        type: string
        source: system
        description: "FK -> Engagement.id; taken from the creation path."
      - name: component_id
        type: string
        source: input
        description: "FK -> SystemComponent.id; component the change concerns, null for organisational changes."
        default: null
      - name: change_type
        type: enum
        source: input
        description: Category of the in-year change.
        constraints: "COMPONENT_ADDED_TO_CDE | SEGMENT_RECLASSIFIED | THIRD_PARTY_ADDED | APPLICATION_UPDATED | STAFF_CHANGE"
      - name: description
        type: string
        source: input
        description: Narrative of what changed.
        constraints: "non-empty"
      - name: affects_scope
        type: boolean
        source: input
        description: Client's assertion of whether the change touches the cardholder data environment.
      - name: triggers_reassessment
        type: boolean
        source: computed
        description: "True when affects_scope == true AND change_type IN {COMPONENT_ADDED_TO_CDE, SEGMENT_RECLASSIFIED, THIRD_PARTY_ADDED}; false otherwise (an APPLICATION_UPDATED or STAFF_CHANGE row never triggers, even when affects_scope is true)."
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant at which the entry was recorded.

# =============================================================================
# §1.2 State Machine Table
# 10 state dimensions across 9 entities. Non-linear shapes:
#   · NetworkSegment      — cyclic (TEST_PLANNED -> FAILED -> TEST_PLANNED)
#   · RequirementAssessment — parallel (test_status x remediation_status)
#   · Engagement / RocReport — cyclic (REPORTING -> FIELDWORK via QA rejection)
#   · CompensatingControlWorksheet / ScanCycle / ScanFinding — branching forks
# =============================================================================
state_machines:

  - entity: Engagement
    initial_state: SCOPING
    terminal_states: [REASSESSMENT_PLANNED]
    transitions:
      - from: SCOPING
        to: FIELDWORK
        trigger: "POST /engagements/{id}/scope-lock"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.posture == OPEN"
          - "at least one NetworkSegment of this engagement has segment_class == CDE and segmentation_status == VALIDATED"
          - "engagement.active_sampling_plan_id != null and that SamplingPlan has plan_variant == FINAL and status == ACTIVE"
        side_effects:
          - "engagement.scope_locked = true"
          - "engagement.posture recomputed by §1.3 engagement_posture (stays OPEN)"
          - "engagement.version incremented by 1"
      - from: FIELDWORK
        to: REPORTING
        trigger: "POST /engagements/{id}/rocs"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.posture == OPEN (open_gap_count == 0, unvalidated_segment_count == 0, active_plan_stale == false)"
          - "engagement.applicable_requirement_count >= 1"
          - "no RequirementAssessment of this engagement has test_status IN {NOT_STARTED, IN_TESTING}"
          - "no RocReport row exists for this engagement"
        side_effects:
          - "a RocReport row is created with status DRAFTING"
          - "§1.3 compliance_projection runs for both variants; RocReport.as_found_compliance_percentage / as_attested_compliance_percentage / compliance_result and the mirrored Engagement fields are written"
          - "engagement.posture recomputed to FROZEN (status now REPORTING)"
          - "engagement.version incremented by 1"
      - from: REPORTING
        to: FIELDWORK
        trigger: "POST /rocs/{id}/revise (after a QA rejection)"
        actor: LeadAssessor
        preconditions:
          - "the engagement's RocReport has status QA_REJECTED"
        side_effects:
          - "RocReport QA_REJECTED -> DRAFTING, revision_count incremented by 1"
          - "engagement.posture recomputed: FROZEN -> OPEN or RESTRICTED depending on open_gap_count / unvalidated_segment_count / active_plan_stale"
          - "engagement.version incremented by 1"
        note: "This is the cycle edge — the engagement re-enters fieldwork and evidence collection is permitted again."
      - from: REPORTING
        to: ATTESTED
        trigger: "POST /rocs/{id}/attest"
        actor: LeadAssessor
        preconditions:
          - "the engagement's RocReport has status QA_APPROVED"
          - "Assessor(engagement.lead_assessor_id).certification_status == ACTIVE at the logical clock"
          - "engagement.quarterly_scan_compliant == true"
          - "payload attestation_signature_name == Assessor(lead_assessor_id).full_name verbatim"
        side_effects:
          - "RocReport QA_APPROVED -> ATTESTED, attestation_signature_name / attesting_assessor_id / attested_at written"
          - "engagement.attested_at = logical clock"
          - "engagement.posture stays FROZEN"
          - "engagement.version incremented by 1"
      - from: ATTESTED
        to: SUBMITTED
        trigger: "POST /rocs/{id}/submission"
        actor: LeadAssessor
        preconditions:
          - "the engagement's RocReport has status ATTESTED"
        side_effects:
          - "RocReport ATTESTED -> SUBMITTED with submitted_to and submission_reference written"
          - "engagement.reassessment_due_date = logical-clock date + 365 days"
          - "engagement.version incremented by 1"
      - from: SUBMITTED
        to: REASSESSMENT_PLANNED
        trigger: "POST /engagements/{id}/reassessment-plan"
        actor: LeadAssessor
        preconditions:
          - "payload target_year == engagement.assessment_year + 1"
        side_effects:
          - "engagement.next_assessment_start_date = payload planned_start_date"
          - "engagement.posture stays FROZEN"
          - "engagement.version incremented by 1"

  - entity: NetworkSegment
    initial_state: DECLARED
    terminal_states: [VALIDATED, WITHDRAWN]
    transitions:
      - from: DECLARED
        to: TEST_PLANNED
        trigger: "POST /network-segments/{id}/segmentation-test-plan"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
          - "engagement.status IN {SCOPING, FIELDWORK}"
        side_effects:
          - "test_method and planned_date written"
          - "segment.version incremented by 1"
      - from: TEST_PLANNED
        to: FAILED
        trigger: "POST /network-segments/{id}/validation-result with outcome FAIL"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
        side_effects:
          - "LINK 1: this row's segmentation_status -> FAILED, scope_expanded_by_failure = true, effective_class = CDE"
          - "LINK 2 (caused by LINK 1): because this row's effective_class became CDE, every NetworkSegment in this row's descendant closure via parent_segment_id gets effective_class = CDE (their own segment_class is left untouched)"
          - "LINK 3 (caused by LINK 2): because those segments' effective_class became CDE, every SystemComponent whose segment_id is in the closure and whose scope_class was CONNECTED or OUT_OF_SCOPE gets scope_class = CDE"
          - "LINK 4 (caused by LINK 3): because the component partition changed, engagement.cde_component_count / connected_component_count / out_of_scope_component_count / in_scope_component_count are recomputed AND the engagement's most recently created SamplingPlan, if status == ACTIVE, transitions ACTIVE -> STALE (engagement.active_sampling_plan_id -> null, active_plan_stale = true)"
          - "LINK 5 (caused by LINK 4): because active_plan_stale became true, §1.3 engagement_posture recomputes posture to RESTRICTED, which blocks POST /engagements/{id}/rocs and POST /engagements/{id}/scope-lock"
          - "engagement.unvalidated_segment_count unchanged (FAILED is still an unvalidated state)"
          - "segment.version and engagement.version each incremented by 1"
        note: "Cascade chain A — depth 5, each link caused by the previous one, not by the original call."
      - from: TEST_PLANNED
        to: VALIDATED
        trigger: "POST /network-segments/{id}/validation-result with outcome PASS"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
        side_effects:
          - "segmentation_status -> VALIDATED, last_validated_at = logical clock, effective_class = own segment_class"
          - "COMPENSATION (only when scope_expanded_by_failure == true): scope_expanded_by_failure = false and every NetworkSegment in this row's descendant closure gets effective_class = its own segment_class"
          - "because those effective classes changed, every SystemComponent in the closure gets scope_class = its segment's effective_class — restoring the pre-FAILED partition exactly, so engagement.cde_component_count returns to its pre-FAILED value (conserved-quantity invariant CQ-2)"
          - "still inside the COMPENSATION branch only (scope_expanded_by_failure was true): because the eligible population changed again, the engagement's most recently created SamplingPlan, if status == ACTIVE, transitions ACTIVE -> STALE. A PASS on a segment that never failed leaves the component partition untouched and therefore leaves an ACTIVE SamplingPlan ACTIVE."
          - "engagement.unvalidated_segment_count decremented by 1; posture recomputed"
          - "segment.version and engagement.version each incremented by 1"
      - from: FAILED
        to: TEST_PLANNED
        trigger: "POST /network-segments/{id}/remediation-revalidation"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.posture != FROZEN"
        side_effects:
          - "revalidation_round incremented by 1; test_method and planned_date overwritten from the payload"
          - "scope_expanded_by_failure stays true and the subtree keeps effective_class CDE until a PASS verdict lands"
          - "segment.version incremented by 1"
        note: "Cycle edge — a segment may fail and be re-planned any number of times."
      - from: DECLARED
        to: WITHDRAWN
        trigger: "POST /network-segments/{id}/withdraw"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "no SystemComponent row has segment_id == this row"
          - "no NetworkSegment row has parent_segment_id == this row"
          - "engagement.posture != FROZEN"
        side_effects:
          - "engagement.unvalidated_segment_count decremented by 1; posture recomputed (may flip RESTRICTED -> OPEN)"
          - "segment.version and engagement.version each incremented by 1"

  - entity: SamplingPlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: STALE
        trigger: "system — segmentation verdict cascade (LINK 4 of chain A, or the compensating PASS verdict) changed the eligible component population"
        actor: system
        preconditions:
          - "this row is the most recently created SamplingPlan of the engagement and its status == ACTIVE"
        side_effects:
          - "engagement.active_sampling_plan_id -> null and engagement.active_plan_stale = true"
          - "engagement.posture recomputed to RESTRICTED"
          - "plan.version incremented by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — POST /engagements/{id}/sampling-plans created a newer plan"
        actor: system
        preconditions:
          - "a newer SamplingPlan row for the same engagement was just created"
        side_effects:
          - "superseded_at = logical clock"
          - "every SystemComponent of the engagement has in_sample reset to false before the new plan's selector runs"
      - from: STALE
        to: SUPERSEDED
        trigger: "system — POST /engagements/{id}/sampling-plans created a newer plan"
        actor: system
        preconditions:
          - "a newer SamplingPlan row for the same engagement was just created"
        side_effects:
          - "superseded_at = logical clock"
          - "engagement.active_plan_stale = false once the newer plan is ACTIVE; posture recomputed"

  - entity: RequirementAssessment
    dimension: test_status
    initial_state: NOT_STARTED
    terminal_states: [NOT_APPLICABLE]
    transitions:
      - from: NOT_STARTED
        to: NOT_APPLICABLE
        trigger: "POST /engagements/{id}/requirement-assessments with applicability NOT_APPLICABLE"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
        side_effects:
          - "row is created directly in test_status NOT_APPLICABLE; it never enters the applicable_requirement_count denominator"
        note: "Creation-time branch — the only producer of NOT_APPLICABLE."
      - from: NOT_STARTED
        to: IN_TESTING
        trigger: "POST /requirement-assessments/{id}/start-testing"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
          - "applicability == APPLICABLE"
        side_effects:
          - "requirement.version incremented by 1"
      - from: IN_TESTING
        to: IN_PLACE
        trigger: "POST /requirement-assessments/{id}/conclusion with conclusion IN_PLACE"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
          - "evidence_completeness == true"
          - "engagement.active_sampling_plan_id != null and that SamplingPlan has plan_variant == FINAL and status == ACTIVE"
        side_effects:
          - "conclusion_rationale written"
          - "engagement.unmet_requirement_count recomputed; §1.3 compliance_projection recomputed for both variants on the engagement"
          - "requirement.version and engagement.version each incremented by 1"
      - from: IN_TESTING
        to: NOT_IN_PLACE
        trigger: "POST /requirement-assessments/{id}/conclusion with conclusion NOT_IN_PLACE"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
          - "evidence_completeness == true"
          - "engagement.active_sampling_plan_id != null and that SamplingPlan has plan_variant == FINAL and status == ACTIVE"
        side_effects:
          - "LINK 1: test_status -> NOT_IN_PLACE and remediation_status NONE -> GAP_OPEN"
          - "LINK 2 (caused by LINK 1): because remediation_status became GAP_OPEN, a RemediationItem is created with source REQUIREMENT_CONCLUSION, status OPEN and severity derived from the requirement's risk_points"
          - "LINK 3 (caused by LINK 2): because that RemediationItem exists, engagement.open_gap_count is recomputed upward and engagement.unmet_requirement_count increases"
          - "LINK 4 (caused by LINK 3): because open_gap_count >= 1, §1.3 engagement_posture recomputes posture to RESTRICTED, which blocks POST /engagements/{id}/rocs"
          - "requirement.version and engagement.version each incremented by 1"
        note: "Cascade chain B — depth 4 from a different trigger than chain A."
      - from: IN_TESTING
        to: NOT_TESTED
        trigger: "POST /requirement-assessments/{id}/conclusion with conclusion NOT_TESTED"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
          - "engagement.active_sampling_plan_id != null and that SamplingPlan has plan_variant == FINAL and status == ACTIVE"
        side_effects:
          - "conclusion_rationale written; no RemediationItem is created and remediation_status stays NONE"
          - "engagement.unmet_requirement_count recomputed; compliance_projection recomputed"
          - "requirement.version and engagement.version each incremented by 1"
        note: "The only conclusion that does not require evidence_completeness — it records that the procedure could not be executed."
      - from: NOT_IN_PLACE
        to: IN_PLACE_WITH_CCW
        trigger: "system — POST /ccws/{id}/decision with decision ACCEPT"
        actor: system
        preconditions:
          - "the accepted CompensatingControlWorksheet's requirement_assessment_id == this row"
        side_effects:
          - "remediation_status GAP_OPEN -> GAP_ACCEPTED_CCW (see cascade chain C on CompensatingControlWorksheet)"
          - "requirement.version incremented by 1"
      - from: IN_PLACE
        to: IN_TESTING
        trigger: "POST /requirement-assessments/{id}/reopen"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.posture != FROZEN"
          - "test_status == IN_PLACE (a requirement covered by an ACCEPTED worksheet may not be reopened)"
        side_effects:
          - "LINK 1: test_status -> IN_TESTING, reopen_count incremented by 1, remediation_status -> GAP_OPEN"
          - "LINK 2 (caused by LINK 1): a RemediationItem with source REQUIREMENT_REOPEN and status OPEN is created"
          - "LINK 3 (caused by LINK 2): engagement.open_gap_count increases by 1 and as_attested_compliance_percentage falls"
          - "LINK 4 (caused by LINK 3): posture recomputed to RESTRICTED"
          - "requirement.version and engagement.version each incremented by 1"
        note: "Forward half of conserved-quantity invariant CQ-1 (gap ledger)."
      - from: IN_TESTING
        to: IN_PLACE
        trigger: "system — POST /remediation-items/{id}/retest with outcome PASS"
        actor: system
        preconditions:
          - "the retested RemediationItem's requirement_assessment_id == this row and its status was IN_PROGRESS"
          - "evidence_completeness == true (evidence is append-only, so it remains satisfied)"
        side_effects:
          - "test_status -> IN_PLACE and remediation_status GAP_OPEN -> GAP_REMEDIATED"
          - "engagement.open_gap_count decremented, as_attested_compliance_percentage restored, as_found_compliance_percentage NOT restored (GAP_REMEDIATED is excluded from the AS_FOUND numerator)"
          - "requirement.version and engagement.version each incremented by 1"
        note: "Compensating half of CQ-1 — see cascade chain D."

  - entity: RequirementAssessment
    dimension: remediation_status
    initial_state: NONE
    terminal_states: [GAP_ACCEPTED_CCW]
    transitions:
      - from: NONE
        to: GAP_OPEN
        trigger: "system — NOT_IN_PLACE conclusion or POST /requirement-assessments/{id}/reopen"
        actor: system
        preconditions:
          - "a RemediationItem was just created for this requirement"
        side_effects:
          - "engagement.open_gap_count recomputed"
      - from: GAP_OPEN
        to: GAP_REMEDIATED
        trigger: "system — POST /remediation-items/{id}/retest with outcome PASS"
        actor: system
        preconditions:
          - "the requirement has no RemediationItem left in status IN {OPEN, IN_PROGRESS, RETEST_FAILED}"
        side_effects:
          - "the AS_FOUND compliance numerator permanently excludes this requirement while AS_ATTESTED includes it"
      - from: GAP_OPEN
        to: GAP_ACCEPTED_CCW
        trigger: "system — POST /ccws/{id}/decision with decision ACCEPT"
        actor: system
        preconditions:
          - "the accepted worksheet belongs to this requirement"
        side_effects:
          - "every RemediationItem of this requirement in status IN {OPEN, IN_PROGRESS, RETEST_FAILED} -> CLOSED_BY_CCW"
      - from: GAP_REMEDIATED
        to: GAP_OPEN
        trigger: "system — a later POST /requirement-assessments/{id}/reopen"
        actor: system
        preconditions:
          - "test_status was IN_PLACE and is being driven back to IN_TESTING"
        side_effects:
          - "a second RemediationItem with source REQUIREMENT_REOPEN is created"
        note: "Cycle edge on the remediation dimension; the two dimensions advance independently — (IN_PLACE, GAP_REMEDIATED) and (IN_PLACE, NONE) are both reachable and are exactly what the two compliance variants discriminate."

  - entity: CompensatingControlWorksheet
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ccws/{id}/submit"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.posture != FROZEN"
          - "parent RequirementAssessment.test_status == NOT_IN_PLACE"
          - "constraint_text, objective_text, identified_risk_text, validation_text and maintenance_text are all non-empty and control_refs has >= 1 entry"
        side_effects:
          - "ccw.version incremented by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /ccws/{id}/decision with decision ACCEPT"
        actor: QaReviewer
        preconditions:
          - "acting X-User-ID == engagement.qa_reviewer_id"
          - "rigor_score >= 70.00 (inclusive)"
          - "monitoring_interval_days <= 30"
          - "parent RequirementAssessment.test_status == NOT_IN_PLACE"
        side_effects:
          - "LINK 1: status -> ACCEPTED, decided_at and reviewer_note written"
          - "LINK 2 (caused by LINK 1): because the worksheet was accepted, the parent RequirementAssessment moves NOT_IN_PLACE -> IN_PLACE_WITH_CCW and remediation_status GAP_OPEN -> GAP_ACCEPTED_CCW"
          - "LINK 3 (caused by LINK 2): because the requirement's gap is now covered, every RemediationItem of that requirement in status IN {OPEN, IN_PROGRESS, RETEST_FAILED} moves to CLOSED_BY_CCW with closed_at set, and engagement.open_gap_count / unmet_requirement_count are recomputed downward"
          - "LINK 4 (caused by LINK 3): because engagement.accepted_ccw_count rose and open_gap_count fell, §1.3 assessment_fee_total is recomputed (PER_ACCEPTED_CCW_HOURS added), §1.3 compliance_projection is recomputed for both variants, and posture is recomputed (RESTRICTED -> OPEN once open_gap_count reaches 0)"
          - "ccw.version, requirement.version and engagement.version each incremented by 1"
        note: "Cascade chain C — branching fork whose ACCEPT branch carries a 4-link cascade while the REJECT branch carries none."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ccws/{id}/decision with decision REJECT"
        actor: QaReviewer
        preconditions:
          - "acting X-User-ID == engagement.qa_reviewer_id"
        side_effects:
          - "status -> REJECTED, decided_at and reviewer_note written"
          - "parent RequirementAssessment is untouched: test_status stays NOT_IN_PLACE, remediation_status stays GAP_OPEN, open_gap_count unchanged"
          - "ccw.version incremented by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system — POST /requirement-assessments/{id}/ccws created a newer worksheet for the same requirement"
        actor: system
        preconditions:
          - "a newer CompensatingControlWorksheet row for the same requirement_assessment_id was just created"
        side_effects:
          - "superseded worksheet is excluded from every rigor and acceptance query"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system — POST /requirement-assessments/{id}/ccws created a newer worksheet for the same requirement"
        actor: system
        preconditions:
          - "a newer CompensatingControlWorksheet row for the same requirement_assessment_id was just created"
        side_effects:
          - "superseded worksheet is excluded from every rigor and acceptance query"

  - entity: RemediationItem
    initial_state: OPEN
    terminal_states: [RETEST_PASSED, CLOSED_BY_CCW]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /remediation-items/{id}/assign"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.posture != FROZEN"
        side_effects:
          - "owner_reference and due_date written; item still counts toward engagement.open_gap_count"
          - "item.version incremented by 1"
      - from: IN_PROGRESS
        to: RETEST_PASSED
        trigger: "POST /remediation-items/{id}/retest with outcome PASS"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
          - "status == IN_PROGRESS"
        side_effects:
          - "LINK 1: status -> RETEST_PASSED, retest_count incremented by 1, closed_at = logical clock"
          - "LINK 2 (caused by LINK 1): because this was the requirement's last non-closed gap, the parent RequirementAssessment moves remediation_status GAP_OPEN -> GAP_REMEDIATED and test_status IN_TESTING -> IN_PLACE"
          - "LINK 3 (caused by LINK 2): because the requirement is back in place, engagement.open_gap_count decrements to its pre-reopen value (a requirement that was reopened sat in IN_TESTING, which unmet_requirement_count never counted, so that counter does not move)"
          - "LINK 4 (caused by LINK 3): posture recomputed to OPEN; as_attested_compliance_percentage returns to its pre-reopen literal while as_found_compliance_percentage stays lower"
          - "item.version, requirement.version and engagement.version each incremented by 1"
        note: "Cascade chain D — compensating half of CQ-1."
      - from: IN_PROGRESS
        to: RETEST_FAILED
        trigger: "POST /remediation-items/{id}/retest with outcome FAIL"
        actor: "LeadAssessor | Assessor"
        preconditions:
          - "engagement.posture != FROZEN"
          - "status == IN_PROGRESS"
        side_effects:
          - "status -> RETEST_FAILED, retest_count incremented by 1; the item still counts toward engagement.open_gap_count so posture stays RESTRICTED"
          - "parent RequirementAssessment untouched (test_status stays IN_TESTING / NOT_IN_PLACE)"
          - "item.version incremented by 1"
      - from: RETEST_FAILED
        to: IN_PROGRESS
        trigger: "POST /remediation-items/{id}/assign"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.posture != FROZEN"
        side_effects:
          - "owner_reference and due_date overwritten; item.version incremented by 1"
        note: "Cycle edge — remediation may iterate FAIL -> reassign -> retest any number of times."
      - from: OPEN
        to: CLOSED_BY_CCW
        trigger: "system — POST /ccws/{id}/decision with decision ACCEPT on the same requirement"
        actor: system
        preconditions:
          - "an ACCEPTED worksheet now covers this item's requirement_assessment_id"
        side_effects:
          - "closed_at = logical clock; engagement.open_gap_count decremented"
      - from: IN_PROGRESS
        to: CLOSED_BY_CCW
        trigger: "system — POST /ccws/{id}/decision with decision ACCEPT on the same requirement"
        actor: system
        preconditions:
          - "an ACCEPTED worksheet now covers this item's requirement_assessment_id"
        side_effects:
          - "closed_at = logical clock; engagement.open_gap_count decremented"
      - from: RETEST_FAILED
        to: CLOSED_BY_CCW
        trigger: "system — POST /ccws/{id}/decision with decision ACCEPT on the same requirement"
        actor: system
        preconditions:
          - "an ACCEPTED worksheet now covers this item's requirement_assessment_id"
        side_effects:
          - "closed_at = logical clock; engagement.open_gap_count decremented"

  - entity: RocReport
    initial_state: DRAFTING
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFTING
        to: IN_QA
        trigger: "POST /rocs/{id}/qa-submit"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "engagement.qa_reviewer_id != null"
        side_effects:
          - "roc.version incremented by 1; engagement stays REPORTING and posture stays FROZEN"
      - from: IN_QA
        to: QA_APPROVED
        trigger: "POST /rocs/{id}/qa-review with decision APPROVE"
        actor: QaReviewer
        preconditions:
          - "acting X-User-ID == engagement.qa_reviewer_id"
          - "acting X-User-ID != engagement.lead_assessor_id"
          - "no EvidenceItem of this engagement has collector_assessor_id == acting X-User-ID"
          - "Assessor(acting X-User-ID).certification_status == ACTIVE"
        side_effects:
          - "qa_decision_note written; §1.3 compliance_projection recomputed for both variants onto the report"
          - "roc.version incremented by 1"
      - from: IN_QA
        to: QA_REJECTED
        trigger: "POST /rocs/{id}/qa-review with decision REJECT"
        actor: QaReviewer
        preconditions:
          - "acting X-User-ID == engagement.qa_reviewer_id"
          - "acting X-User-ID != engagement.lead_assessor_id"
          - "no EvidenceItem of this engagement has collector_assessor_id == acting X-User-ID"
          - "Assessor(acting X-User-ID).certification_status == ACTIVE"
        side_effects:
          - "qa_decision_note written; no compliance recomputation"
          - "roc.version incremented by 1"
        note: "Fork point — APPROVE and REJECT carry disjoint side-effect sets and only REJECT can lead back to fieldwork."
      - from: QA_REJECTED
        to: DRAFTING
        trigger: "POST /rocs/{id}/revise"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
        side_effects:
          - "revision_count incremented by 1"
          - "engagement.status REPORTING -> FIELDWORK and posture recomputed away from FROZEN, re-enabling evidence collection and reopen"
          - "roc.version and engagement.version each incremented by 1"
      - from: QA_APPROVED
        to: ATTESTED
        trigger: "POST /rocs/{id}/attest"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
          - "Assessor(lead_assessor_id).certification_status == ACTIVE"
          - "engagement.quarterly_scan_compliant == true"
          - "payload attestation_signature_name == Assessor(lead_assessor_id).full_name"
        side_effects:
          - "attestation fields written; engagement.status REPORTING -> ATTESTED and engagement.attested_at set"
          - "roc.version and engagement.version each incremented by 1"
      - from: ATTESTED
        to: SUBMITTED
        trigger: "POST /rocs/{id}/submission"
        actor: LeadAssessor
        preconditions:
          - "acting X-User-ID == engagement.lead_assessor_id"
        side_effects:
          - "submitted_to and submission_reference written; engagement.status ATTESTED -> SUBMITTED"
          - "engagement.reassessment_due_date = logical-clock date + 365 days"
          - "roc.version and engagement.version each incremented by 1"

  - entity: ScanCycle
    initial_state: SCHEDULED
    terminal_states: [PASSING]
    transitions:
      - from: SCHEDULED
        to: PASSING
        trigger: "POST /scan-cycles/{id}/complete"
        actor: AsvVendor
        preconditions:
          - "acting X-User-ID == scan_cycle.asv_vendor_id"
          - "effective_high_finding_count == 0"
        side_effects:
          - "scan_completed_at written; attestation_of_scan_compliance = true"
          - "engagement.quarterly_scan_compliant recomputed to true when the logical clock is inside this cycle's window"
          - "cycle.version and engagement.version each incremented by 1"
      - from: SCHEDULED
        to: FAILING
        trigger: "POST /scan-cycles/{id}/complete"
        actor: AsvVendor
        preconditions:
          - "acting X-User-ID == scan_cycle.asv_vendor_id"
          - "effective_high_finding_count >= 1"
        side_effects:
          - "scan_completed_at written; attestation_of_scan_compliance stays false"
          - "engagement.quarterly_scan_compliant recomputed to false unless another PASSING cycle covers the clock"
          - "cycle.version and engagement.version each incremented by 1"
        note: "Branch point on the same trigger — the arm is chosen by the finding ledger, not by the payload."
      - from: FAILING
        to: DISPUTE_OPEN
        trigger: "system — POST /scan-findings/{id}/dispute on a child finding"
        actor: system
        preconditions:
          - "the disputed finding has severity_class == HIGH_OR_ABOVE and dispute_status NONE"
        side_effects:
          - "open_dispute_count incremented by 1"
      - from: DISPUTE_OPEN
        to: PASSING
        trigger: "system — POST /scan-findings/{id}/dispute-decision resolved the last open dispute"
        actor: system
        preconditions:
          - "open_dispute_count reached 0 and effective_high_finding_count == 0"
        side_effects:
          - "attestation_of_scan_compliance = true; engagement.quarterly_scan_compliant recomputed"
      - from: DISPUTE_OPEN
        to: FAILING
        trigger: "system — POST /scan-findings/{id}/dispute-decision resolved the last open dispute"
        actor: system
        preconditions:
          - "open_dispute_count reached 0 and effective_high_finding_count >= 1"
        side_effects:
          - "see cascade chain E on ScanFinding — the requirement revert and remediation creation hang off this transition"

  - entity: ScanFinding
    dimension: dispute_status
    initial_state: NONE
    terminal_states: [ACCEPTED_FALSE_POSITIVE, REJECTED]
    transitions:
      - from: NONE
        to: DISPUTED
        trigger: "POST /scan-findings/{id}/dispute"
        actor: "LeadAssessor | ClientRepresentative"
        preconditions:
          - "severity_class == HIGH_OR_ABOVE"
          - "parent ScanCycle.status IN {FAILING, DISPUTE_OPEN}"
        side_effects:
          - "dispute_rationale written; parent cycle.open_dispute_count incremented and cycle FAILING -> DISPUTE_OPEN"
          - "finding.version and cycle.version each incremented by 1"
      - from: DISPUTED
        to: ACCEPTED_FALSE_POSITIVE
        trigger: "POST /scan-findings/{id}/dispute-decision with decision ACCEPT"
        actor: AsvVendor
        preconditions:
          - "acting X-User-ID == parent ScanCycle.asv_vendor_id"
          - "dispute_status == DISPUTED"
        side_effects:
          - "decided_at and decision_note written"
          - "cycle.accepted_false_positive_count incremented and effective_high_finding_count decremented — the conserved identity raw_high_finding_count == effective_high_finding_count + accepted_false_positive_count still holds (CQ-3)"
          - "when open_dispute_count reaches 0 and effective_high_finding_count == 0 the cycle moves DISPUTE_OPEN -> PASSING and engagement.quarterly_scan_compliant becomes true"
          - "finding.version, cycle.version and engagement.version each incremented by 1"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /scan-findings/{id}/dispute-decision with decision REJECT"
        actor: AsvVendor
        preconditions:
          - "acting X-User-ID == parent ScanCycle.asv_vendor_id"
          - "dispute_status == DISPUTED"
        side_effects:
          - "LINK 1: dispute_status -> REJECTED, decided_at and decision_note written, cycle.open_dispute_count decremented; effective_high_finding_count unchanged"
          - "LINK 2 (caused by LINK 1): because the last open dispute closed with effective_high_finding_count >= 1, the parent ScanCycle moves DISPUTE_OPEN -> FAILING"
          - "LINK 3 (caused by LINK 2): because the cycle is FAILING, engagement.quarterly_scan_compliant is recomputed to false (a cycle cannot recover compliance while any effective high finding stands) and every RequirementAssessment of that engagement with requirement_ref == '11.3.1' and test_status == IN_PLACE reverts to IN_TESTING with remediation_status -> GAP_OPEN"
          - "LINK 4 (caused by LINK 3): because that requirement reverted, a RemediationItem is created with source SCAN_FINDING_REJECTED and source_scan_finding_id == this finding, and engagement.open_gap_count increments"
          - "LINK 5 (caused by LINK 4): because open_gap_count >= 1, posture recomputes to RESTRICTED, which blocks POST /engagements/{id}/rocs"
          - "finding.version, cycle.version, requirement.version and engagement.version each incremented by 1"
        note: "Cascade chain E — depth 5 from a scan-vendor trigger, structurally disjoint from chain A."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: sampling-plan-create-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/sampling-plans"
    occ_field: "expected_engagement_version"
    description: |
      Creating a SamplingPlan against an Engagement whose version has advanced since the client last
      read it is rejected. A newly created plan legitimately supersedes the engagement's prior ACTIVE
      or STALE plan and re-derives every component's in_sample flag, so a writer holding a stale view
      of the engagement would silently discard a sampling decision it never saw.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: ccw-create-stale-requirement
    parent_entity: RequirementAssessment
    write_endpoint: "POST /requirement-assessments/{id}/ccws"
    occ_field: "expected_requirement_assessment_version"
    description: |
      Creating a CompensatingControlWorksheet against a RequirementAssessment whose version has
      advanced since the client last read it is rejected. A new worksheet legitimately supersedes the
      requirement's prior DRAFT or REJECTED worksheet, so a writer working from a stale view of the
      requirement would supersede a worksheet whose rejection note it has not read.
    error_id: ERR_STALE_REQUIREMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation & Derivation Rules
# 9 rules; component_sample_allocation, facility_sample_selection and
# compliance_projection are dual-variant. Every rounding step is half-up.
# =============================================================================
calculations:

  - name: component_sample_allocation
    algorithm_type: aggregation
    trigger: "POST /engagements/{id}/sampling-plans (writes SamplingPlan.component_sample_size, stratum_allocations, eligible_component_count, coverage_ratio)"
    constants:
      SAMPLE_RATE: 0.25
      MIN_PER_STRATUM: 2
      STRATUM_ORDER: ["SERVER", "NETWORK_DEVICE", "POS_TERMINAL", "APPLICATION", "DATABASE"]
    variants:
      - name: PRELIMINARY
        selected_when: "payload plan_variant == PRELIMINARY"
        input_set: "SystemComponent rows of the engagement whose declared_scope_class IN {CDE, CONNECTED} — the class implied by the segment's own segment_class at component creation, ignoring any later segmentation verdict"
      - name: FINAL
        selected_when: "payload plan_variant == FINAL"
        input_set: "SystemComponent rows of the engagement whose scope_class IN {CDE, CONNECTED} — the effective class after every segmentation verdict cascade has been applied"
    formula: |
      eligible = variant input set (above)
      eligible_component_count = count(eligible)
      for each stratum S in STRATUM_ORDER:
          pop(S) = count of eligible rows whose component_type == S
          alloc(S) = 0                                            when pop(S) == 0
          alloc(S) = min(pop(S), max(MIN_PER_STRATUM,
                         ceil(pop(S) * SAMPLE_RATE)))              when pop(S) >= 1
      component_sample_size = sum over STRATUM_ORDER of alloc(S)
      stratum_allocations   = ordered map { S: alloc(S) } in STRATUM_ORDER
      coverage_ratio        = round(component_sample_size / eligible_component_count, 4)
    evaluation_order: |
      The per-stratum ceiling is applied BEFORE the sum. Computing
      ceil(eligible_component_count * SAMPLE_RATE) over the pooled population is wrong and yields a
      materially smaller sample: for a 6-component population split {SERVER 3, APPLICATION 2,
      DATABASE 1} the pooled form gives ceil(1.5) = 2 while the per-stratum form gives 5.
      The MIN_PER_STRATUM floor is applied before the min(pop, ...) cap, so a stratum with a
      population of 1 contributes 1, not 2.
    precision: "coverage_ratio rounded half-up to 4 decimal places; allocations are integers"
    worked_examples:
      - inputs: "PRELIMINARY variant, eligible {SERVER 3, APPLICATION 2, DATABASE 1}"
        output: "stratum_allocations {SERVER 2, NETWORK_DEVICE 0, POS_TERMINAL 0, APPLICATION 2, DATABASE 1}, component_sample_size 5, eligible_component_count 6, coverage_ratio 0.8333"
      - inputs: "FINAL variant over the same engagement after a segmentation FAIL pulled 4 POS_TERMINAL rows into scope: eligible {SERVER 3, POS_TERMINAL 4, APPLICATION 2, DATABASE 1}"
        output: "stratum_allocations {SERVER 2, NETWORK_DEVICE 0, POS_TERMINAL 2, APPLICATION 2, DATABASE 1}, component_sample_size 7, eligible_component_count 10, coverage_ratio 0.7000"
      - inputs: "eligible {SERVER 1, APPLICATION 2}"
        output: "stratum_allocations {SERVER 1, NETWORK_DEVICE 0, POS_TERMINAL 0, APPLICATION 2, DATABASE 0}, component_sample_size 3, eligible_component_count 3, coverage_ratio 1.0000"

  - name: facility_sample_selection
    algorithm_type: aggregation
    trigger: "POST /engagements/{id}/sampling-plans (writes SamplingPlan.facility_population_count, facility_sample_size, sampled_facility_names)"
    constants:
      FACILITY_SAMPLE_RATE: 0.34
      MIN_FACILITIES: 1
    variants:
      - name: PRELIMINARY
        selected_when: "payload plan_variant == PRELIMINARY"
        input_set: "distinct facility_name values among components whose declared_scope_class IN {CDE, CONNECTED}"
      - name: FINAL
        selected_when: "payload plan_variant == FINAL"
        input_set: "distinct facility_name values among components whose scope_class IN {CDE, CONNECTED}"
    formula: |
      facility_population_count = count(distinct facility_name in the variant input set)
      facility_sample_size = 0                                                    when population == 0
      facility_sample_size = min(population,
                                 max(MIN_FACILITIES,
                                     ceil(population * FACILITY_SAMPLE_RATE)))     when population >= 1
      sampled_facility_names = the first facility_sample_size distinct facility_name values
                               ordered by facility_name ASC (byte-wise ascending)
    evaluation_order: "The MIN_FACILITIES floor is applied before the min(population, ...) cap. Selection order is facility_name ASC only — never row id and never insertion order."
    precision: "integers; sampled_facility_names is an ordered array of strings"
    worked_examples:
      - inputs: "population 1 (facility_name 'DC-EAST')"
        output: "facility_sample_size 1, sampled_facility_names ['DC-EAST']"
      - inputs: "population 3 ('DC-EAST', 'RETAIL-12', 'RETAIL-40')"
        output: "facility_sample_size 2, sampled_facility_names ['DC-EAST', 'RETAIL-12']"
      - inputs: "population 5"
        output: "facility_sample_size 2"
      - inputs: "population 0"
        output: "facility_sample_size 0, sampled_facility_names []"

  - name: component_in_sample_selection
    algorithm_type: chronological
    trigger: "POST /engagements/{id}/sampling-plans (writes SystemComponent.in_sample and sampling_stratum for every component of the engagement)"
    constants: {}
    formula: |
      step 1: every SystemComponent of the engagement has in_sample reset to false
      step 2: for each stratum S in component_sample_allocation.STRATUM_ORDER:
                candidates = eligible rows (per the chosen variant) whose component_type == S,
                             ordered by hostname ASC
                the first alloc(S) candidates get in_sample = true
      step 3: sampling_stratum = component_type for every eligible row, null for ineligible rows
    evaluation_order: "Stratum iteration follows STRATUM_ORDER; within a stratum the ordering key is hostname ASC. Ties are impossible because hostname is unique per engagement, so no id-based or random selection ever occurs."
    precision: "boolean flags"
    worked_examples:
      - inputs: "SERVER stratum with hostnames ['app-01', 'app-02', 'app-03'] and alloc(SERVER) == 2"
        output: "'app-01' and 'app-02' get in_sample true; 'app-03' stays false"

  - name: ccw_rigor_score
    algorithm_type: weighted_scoring
    trigger: "POST /requirement-assessments/{id}/ccws and POST /ccws/{id}/submit (writes control_depth_points, monitoring_factor, risk_offset_points, rigor_score, thin_control_capped)"
    constants:
      W_DEPTH: 0.40
      W_MONITORING: 0.35
      W_RISK: 0.25
      DEPTH_PER_REF: 20
      DEPTH_CAP: 100
      MONITORING_BANDS: "interval_days <= 1 -> 100 | <= 7 -> 80 | <= 30 -> 55 | > 30 -> 25"
      RISK_PER_POINT: 15
      THIN_CONTROL_MIN_REFS: 2
      THIN_CONTROL_CAP: 40.00
      FAMILY_RISK_POINTS: "{ R1: 3, R2: 2, R3: 5, R4: 4, R5: 2, R6: 4, R7: 3, R8: 3, R9: 2, R10: 4, R11: 3, R12: 1 }"
    formula: |
      step 1: distinct_refs        = count of distinct entries in control_refs
      step 2: control_depth_points = min(DEPTH_CAP, DEPTH_PER_REF * distinct_refs)
      step 3: monitoring_factor    = MONITORING_BANDS applied to monitoring_interval_days
      step 4: risk_offset_points   = max(0, 100 - RISK_PER_POINT * FAMILY_RISK_POINTS[parent requirement_family])
      step 5: raw = W_DEPTH * control_depth_points
                  + W_MONITORING * monitoring_factor
                  + W_RISK * risk_offset_points
      step 6: thin_control_capped = (distinct_refs < THIN_CONTROL_MIN_REFS)
              rigor_score = min(raw, THIN_CONTROL_CAP) when thin_control_capped else raw
      step 7: rigor_score rounded half-up to 2 decimal places
    evaluation_order: "The thin-control cap in step 6 is applied AFTER the weighted sum, never as a weight adjustment. Duplicate entries in control_refs collapse in step 1, so listing the same control twice does not buy depth."
    precision: "rigor_score, control_depth_points, monitoring_factor and risk_offset_points all carried to 2 decimal places, half-up"
    worked_examples:
      - inputs: "control_refs 4 distinct, monitoring_interval_days 7, requirement_family R6 (4 risk points)"
        output: "depth 80, monitoring 80, risk_offset 40, rigor_score 70.00 — exactly the acceptance boundary"
      - inputs: "control_refs 4 distinct, monitoring_interval_days 7, requirement_family R3 (5 risk points)"
        output: "depth 80, monitoring 80, risk_offset 25, rigor_score 66.25 — one family step below the boundary, rejected"
      - inputs: "control_refs 5 distinct, monitoring_interval_days 1, requirement_family R6"
        output: "depth 100, monitoring 100, risk_offset 40, rigor_score 85.00"
      - inputs: "control_refs 1, monitoring_interval_days 1, requirement_family R12 (1 risk point)"
        output: "raw 64.25 but thin_control_capped true, rigor_score 40.00"
      - inputs: "control_refs 4 distinct, monitoring_interval_days 8, requirement_family R6"
        output: "monitoring band drops to 55, rigor_score 61.25"
      - inputs: "control_refs 4 distinct, monitoring_interval_days 31, requirement_family R6"
        output: "monitoring band drops to 25, rigor_score 50.75"
      - inputs: "control_refs 2 distinct, monitoring_interval_days 7, requirement_family R6"
        output: "depth 40, rigor_score 54.00"
      - inputs: "control_refs 3 distinct, monitoring_interval_days 30, requirement_family R6"
        output: "monitoring 55, rigor_score 53.25"
      - inputs: "control_refs 5 distinct, monitoring_interval_days 7, requirement_family R6"
        output: "rigor_score 78.00"

  - name: compliance_projection
    algorithm_type: projection
    trigger: "POST /engagements/{id}/rocs, POST /requirement-assessments/{id}/conclusion, POST /ccws/{id}/decision, POST /remediation-items/{id}/retest, POST /rocs/{id}/qa-review (writes both percentages plus in_place_count, ccw_covered_count, not_in_place_count, compliance_result)"
    constants:
      COMPLIANT_THRESHOLD: 100.00
    variants:
      - name: AS_FOUND
        selected_when: "always computed; surfaced as as_found_compliance_percentage"
        input_set: "RequirementAssessment rows with applicability == APPLICABLE whose test_status == IN_PLACE AND remediation_status == NONE — a requirement that was ever gapped is excluded even after successful retest"
      - name: AS_ATTESTED
        selected_when: "always computed; surfaced as as_attested_compliance_percentage and it alone decides compliance_result"
        input_set: "RequirementAssessment rows with applicability == APPLICABLE whose test_status IN {IN_PLACE, IN_PLACE_WITH_CCW} — remediated and compensating-control-covered requirements both count"
    formula: |
      denominator = applicable_requirement_count
                  = count(RequirementAssessment of the engagement with applicability == APPLICABLE)
      numerator   = count(variant input set)
      percentage  = round(numerator / denominator * 100, 2)
      in_place_count      = count(test_status == IN_PLACE)
      ccw_covered_count   = count(test_status == IN_PLACE_WITH_CCW)
      not_in_place_count  = count(test_status IN {NOT_IN_PLACE, NOT_TESTED})
      compliance_result   = COMPLIANT when as_attested_compliance_percentage == 100.00
                            else NON_COMPLIANT
    evaluation_order: "NOT_APPLICABLE rows never enter the denominator. compliance_result is keyed on the AS_ATTESTED percentage only — keying it on AS_FOUND would report a remediated engagement as non-compliant."
    precision: "percentages rounded half-up to 2 decimal places"
    worked_examples:
      - inputs: "4 applicable requirements: two (IN_PLACE, NONE), one (IN_PLACE, GAP_REMEDIATED), one (IN_PLACE_WITH_CCW, GAP_ACCEPTED_CCW)"
        output: "as_found 50.00, as_attested 100.00, in_place_count 3, ccw_covered_count 1, not_in_place_count 0, compliance_result COMPLIANT"
      - inputs: "4 applicable requirements: two (IN_PLACE, NONE), one (NOT_IN_PLACE, GAP_OPEN), one (NOT_TESTED, NONE)"
        output: "as_found 50.00, as_attested 50.00, not_in_place_count 2, compliance_result NON_COMPLIANT"
      - inputs: "3 applicable requirements, one (IN_PLACE, NONE)"
        output: "as_found 33.33, as_attested 33.33"
      - inputs: "3 applicable requirements, two (IN_PLACE, NONE)"
        output: "as_found 66.67, as_attested 66.67"
      - inputs: "2 applicable requirements plus 1 NOT_APPLICABLE row, one (IN_PLACE, NONE)"
        output: "denominator 2 not 3, as_found 50.00"

  - name: assessment_fee_total
    algorithm_type: tiered_pricing
    trigger: "POST /engagements/{id}/sampling-plans, POST /ccws/{id}/decision with ACCEPT, PATCH /engagements/{id} (writes Engagement.estimated_hours and assessment_fee_total)"
    constants:
      HOURLY_RATE: 250.00
      BASE_HOURS: 160
      PER_SAMPLE_COMPONENT_HOURS: 12
      PER_FACILITY_HOURS: 30
      PER_ACCEPTED_CCW_HOURS: 20
      L1_SURCHARGE_PCT: 0.08
      VOLUME_TIERS: "subtotal >= 120000 -> 0.10 | >= 90000 -> 0.06 | >= 60000 -> 0.03 | otherwise 0.00"
    formula: |
      step 1: estimated_hours = BASE_HOURS
                              + PER_SAMPLE_COMPONENT_HOURS * component_sample_size
                              + PER_FACILITY_HOURS          * facility_sample_size
                              + PER_ACCEPTED_CCW_HOURS      * accepted_ccw_count
              (component_sample_size and facility_sample_size come from the engagement's
               most recently created SamplingPlan; accepted_ccw_count is the count of
               CompensatingControlWorksheet rows of the engagement with status == ACCEPTED)
      step 2: base_amount = round(estimated_hours * HOURLY_RATE, 2)
      step 3: onsite_surcharge = round(base_amount * L1_SURCHARGE_PCT, 2) when merchant_level == L1
                               = 0.00                                     otherwise
      step 4: subtotal = base_amount + onsite_surcharge
      step 5: tier_pct = VOLUME_TIERS looked up against SUBTOTAL (post-surcharge, pre-discount)
      step 6: volume_discount = round(subtotal * tier_pct, 2)
      step 7: assessment_fee_total = subtotal - volume_discount
    evaluation_order: |
      The seven steps are strictly ordered and the tier lookup in step 5 reads the step-4 subtotal.
      Two orderings that look equivalent are not: (a) keying the tier on base_amount instead of the
      post-surcharge subtotal, and (b) applying the L1 surcharge after the volume discount. For a
      226-hour L1 engagement the correct total is 59189.40 while form (a) leaves the engagement in
      the 0.00 tier (base_amount 56500.00 < 60000) and reports 61020.00.
    precision: "all money values rounded half-up to 2 decimal places at each of steps 2, 3 and 6; estimated_hours is an integer"
    worked_examples:
      - inputs: "component_sample_size 3, facility_sample_size 1, accepted_ccw_count 0, merchant_level L1"
        output: "estimated_hours 226, base 56500.00, surcharge 4520.00, subtotal 61020.00, tier 0.03, discount 1830.60, assessment_fee_total 59189.40"
      - inputs: "component_sample_size 3, facility_sample_size 1, accepted_ccw_count 1, merchant_level L1"
        output: "estimated_hours 246, base 61500.00, surcharge 4920.00, subtotal 66420.00, discount 1992.60, assessment_fee_total 64427.40"
      - inputs: "component_sample_size 7, facility_sample_size 2, accepted_ccw_count 0, merchant_level L1"
        output: "estimated_hours 304, base 76000.00, surcharge 6080.00, subtotal 82080.00, discount 2462.40, assessment_fee_total 79617.60"
      - inputs: "component_sample_size 5, facility_sample_size 1, accepted_ccw_count 0, merchant_level L1"
        output: "estimated_hours 250, base 62500.00, surcharge 5000.00, subtotal 67500.00, discount 2025.00, assessment_fee_total 65475.00"
      - inputs: "component_sample_size 3, facility_sample_size 1, accepted_ccw_count 0, merchant_level L4"
        output: "estimated_hours 226, base 56500.00, surcharge 0.00, subtotal 56500.00, tier 0.00, assessment_fee_total 56500.00"
      - inputs: "component_sample_size 2, facility_sample_size 1, accepted_ccw_count 0, merchant_level L1"
        output: "estimated_hours 214, base 53500.00, surcharge 4280.00, subtotal 57780.00, tier 0.00, assessment_fee_total 57780.00"
      - inputs: "component_sample_size 0, facility_sample_size 0, accepted_ccw_count 0, merchant_level L1"
        output: "estimated_hours 160, base 40000.00, surcharge 3200.00, subtotal 43200.00, assessment_fee_total 43200.00"

  - name: engagement_posture
    algorithm_type: constraint_propagation
    trigger: "recomputed at the end of every write that touches the engagement or any of its children"
    constants:
      OPEN_GAP_STATES: ["OPEN", "IN_PROGRESS", "RETEST_FAILED"]
      UNVALIDATED_SEGMENT_STATES: ["DECLARED", "TEST_PLANNED", "FAILED"]
      FROZEN_ENGAGEMENT_STATES: ["REPORTING", "ATTESTED", "SUBMITTED", "REASSESSMENT_PLANNED"]
    formula: |
      open_gap_count            = count(RemediationItem of the engagement whose status IN OPEN_GAP_STATES)
      unvalidated_segment_count = count(NetworkSegment of the engagement whose
                                        segmentation_status IN UNVALIDATED_SEGMENT_STATES)
      active_plan_stale         = the engagement's most recently created SamplingPlan has status == STALE

      posture = FROZEN      when engagement.status IN FROZEN_ENGAGEMENT_STATES
      posture = RESTRICTED  when engagement.status IN {SCOPING, FIELDWORK}
                             AND (open_gap_count >= 1
                                  OR unvalidated_segment_count >= 1
                                  OR active_plan_stale == true)
      posture = OPEN        otherwise
    evaluation_order: |
      The FROZEN arm is evaluated first, so a reporting engagement with open gaps is FROZEN, not
      RESTRICTED — the two postures raise different errors (ERR_ENGAGEMENT_FROZEN blocks child
      writes, ERR_ENGAGEMENT_RESTRICTED blocks only scope-lock and ROC creation), so the order is
      observable. The three RESTRICTED disjuncts are recomputed from the child rows on every write;
      none of them is a latch.
    precision: "integer counts; posture is an enum"
    worked_examples:
      - inputs: "status FIELDWORK, no remediation items, all segments VALIDATED, latest plan ACTIVE"
        output: "open_gap_count 0, unvalidated_segment_count 0, active_plan_stale false, posture OPEN"
      - inputs: "status FIELDWORK, one RemediationItem in OPEN"
        output: "open_gap_count 1, posture RESTRICTED"
      - inputs: "status FIELDWORK, one RemediationItem in RETEST_PASSED and one in RETEST_FAILED"
        output: "open_gap_count 1 (RETEST_PASSED does not count), posture RESTRICTED"
      - inputs: "status REPORTING, one RemediationItem in OPEN"
        output: "posture FROZEN (the FROZEN arm wins over RESTRICTED)"
      - inputs: "status SCOPING, one segment in TEST_PLANNED"
        output: "unvalidated_segment_count 1, posture RESTRICTED"

  - name: scan_cycle_effective_findings
    algorithm_type: threshold
    trigger: "POST /scan-cycles/{id}/findings, POST /scan-findings/{id}/dispute, POST /scan-findings/{id}/dispute-decision, POST /scan-cycles/{id}/complete"
    constants:
      HIGH_CVSS_THRESHOLD: 4.0
      SCAN_WINDOW_DAYS: 90
      PASSING_EFFECTIVE_MAX: 0
    formula: |
      per finding: severity_class = HIGH_OR_ABOVE when cvss_score >= HIGH_CVSS_THRESHOLD
                                  = LOW           otherwise
      window_end                   = window_start + SCAN_WINDOW_DAYS days, exclusive
      raw_high_finding_count       = count(children with severity_class == HIGH_OR_ABOVE)
      accepted_false_positive_count= count(children with severity_class == HIGH_OR_ABOVE
                                           AND dispute_status == ACCEPTED_FALSE_POSITIVE)
      effective_high_finding_count = raw_high_finding_count - accepted_false_positive_count
      open_dispute_count           = count(children with dispute_status == DISPUTED)
      attestation_of_scan_compliance = (status == PASSING)
      engagement.quarterly_scan_compliant = true iff some ScanCycle of the engagement has
                                   status == PASSING AND window_start <= clock < window_end
    evaluation_order: |
      The CVSS threshold is inclusive at 4.0, so a 4.0 finding is HIGH_OR_ABOVE and a 3.9 finding is
      not. A REJECTED dispute never decrements effective_high_finding_count; only
      ACCEPTED_FALSE_POSITIVE does, which keeps the conserved identity
      raw_high_finding_count == effective_high_finding_count + accepted_false_positive_count true
      at every point in the dispute lifecycle.
    precision: "cvss_score carried to 1 decimal place; counts are integers"
    worked_examples:
      - inputs: "findings with cvss 7.5, 4.0 and 3.9, no disputes"
        output: "raw_high_finding_count 2, effective_high_finding_count 2, complete -> FAILING"
      - inputs: "the same three findings after the 7.5 finding's dispute is ACCEPTED and the 4.0 finding's dispute is ACCEPTED"
        output: "raw 2, accepted_false_positive_count 2, effective 0, open_dispute_count 0, cycle -> PASSING"
      - inputs: "the same three findings after the 7.5 dispute is REJECTED"
        output: "raw 2, accepted_false_positive_count 0, effective 2, open_dispute_count 0, cycle -> FAILING"
      - inputs: "window_start 2026-04-01T00:00:00Z"
        output: "window_end 2026-06-30T00:00:00Z (exclusive)"

  - name: reassessment_trigger
    algorithm_type: rate_threshold
    trigger: "POST /engagements/{id}/change-log-entries, POST /rocs/{id}/submission, POST /engagements/{id}/reassessment-plan"
    constants:
      SCOPE_CHANGE_REASSESS_THRESHOLD: 3
      REASSESSMENT_INTERVAL_DAYS: 365
      ACCELERATED_INTERVAL_DAYS: 90
      TRIGGERING_CHANGE_TYPES: ["COMPONENT_ADDED_TO_CDE", "SEGMENT_RECLASSIFIED", "THIRD_PARTY_ADDED"]
    formula: |
      per entry: triggers_reassessment = (affects_scope == true
                                          AND change_type IN TRIGGERING_CHANGE_TYPES)
      scope_affecting_change_count = count(ChangeLogEntry of the engagement with
                                           triggers_reassessment == true)
      reassessment_required = scope_affecting_change_count >= SCOPE_CHANGE_REASSESS_THRESHOLD
      on ROC submission:            reassessment_due_date = clock date + REASSESSMENT_INTERVAL_DAYS days
      when reassessment_required first flips true:
                                    reassessment_due_date = clock date + ACCELERATED_INTERVAL_DAYS days
    evaluation_order: |
      The per-entry predicate is evaluated first and both conjuncts must hold: an APPLICATION_UPDATED
      row with affects_scope true does NOT increment the counter, and a COMPONENT_ADDED_TO_CDE row
      with affects_scope false does not either. The threshold is inclusive at 3, so the second
      triggering entry leaves reassessment_required false and the third flips it true. The
      accelerated due date overwrites a previously set 365-day date; it is never pushed back out.
    precision: "integer count; dates as YYYY-MM-DD"
    worked_examples:
      - inputs: "two entries COMPONENT_ADDED_TO_CDE / affects_scope true, one APPLICATION_UPDATED / affects_scope true"
        output: "scope_affecting_change_count 2, reassessment_required false"
      - inputs: "a third entry SEGMENT_RECLASSIFIED / affects_scope true at clock 2026-08-01T00:00:00Z"
        output: "scope_affecting_change_count 3, reassessment_required true, reassessment_due_date 2026-10-30"
      - inputs: "ROC submission at clock 2026-08-01T00:00:00Z with scope_affecting_change_count 0"
        output: "reassessment_due_date 2027-08-01, reassessment_required false"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# The ladder is: auth · authorization · request shape · path existence ·
# body-reference existence · ownership · referential · posture · target state ·
# OCC · safety · temporal · constraint · fiscal.
# Two deliberate priority pairs are exercised in §1.8:
#   Pair A  priority 10 ERR_STALE_ENGAGEMENT_VERSION beats priority 14 ERR_ASSESSMENT_BUDGET_EXCEEDED
#           (both reachable on POST /engagements/{id}/sampling-plans: a stale expected_engagement_version
#            on a plan whose recomputed fee also overruns approved_budget_amount)
#   Pair B  priority 11 ERR_INDEPENDENCE_VIOLATION beats priority 12 ERR_ASSESSOR_CERTIFICATION_EXPIRED
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID header is present and resolves to a known Assessor row, a known AsvVendor row, or one of the opaque actors (client representative, platform administrator)."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Request shape: every required input present; enum values inside their declared domain; numbers of the declared type and sign; fieldwork_end_date >= fieldwork_start_date; monitoring_interval_days >= 1; cvss_score between 0.0 and 10.0; control_refs a non-empty array of strings; limit within 1..100 and offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Each path id is resolved left to right; an unresolved id yields that entity's own 404."
    error_id: "ERR_ASSESSOR_NOT_FOUND | ERR_ASV_VENDOR_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_SAMPLING_PLAN_NOT_FOUND | ERR_REQUIREMENT_NOT_FOUND | ERR_EVIDENCE_NOT_FOUND | ERR_CCW_NOT_FOUND | ERR_REMEDIATION_ITEM_NOT_FOUND | ERR_ROC_NOT_FOUND | ERR_SCAN_CYCLE_NOT_FOUND | ERR_SCAN_FINDING_NOT_FOUND | ERR_CHANGE_LOG_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "Ids supplied in the request body are resolved after path ids: lead_assessor_id and qa_reviewer_id -> ERR_ASSESSOR_NOT_FOUND, asv_vendor_id -> ERR_ASV_VENDOR_NOT_FOUND, parent_segment_id -> ERR_SEGMENT_NOT_FOUND, segment_id and component_id -> ERR_COMPONENT_NOT_FOUND or ERR_SEGMENT_NOT_FOUND as declared."
    error_id: "the referenced entity's NOT_FOUND code"
    http_status: 404
    applies_to: "POST /engagements, PATCH /engagements/{id}, POST /engagements/{id}/qa-reviewer, POST /engagements/{id}/network-segments, POST /engagements/{id}/system-components, POST /engagements/{id}/scan-cycles, POST /requirement-assessments/{id}/evidence-items, POST /engagements/{id}/change-log-entries, POST /scan-cycles/{id}/findings"

  - priority: 6
    category: auth
    check: "Lead-only operations require acting X-User-ID == engagement.lead_assessor_id."
    error_id: ERR_NOT_ENGAGEMENT_LEAD
    http_status: 403
    applies_to: "POST /engagements/{id}/scope-lock, POST /engagements/{id}/qa-reviewer, PATCH /engagements/{id}, POST /engagements/{id}/rocs, POST /engagements/{id}/reassessment-plan, PATCH /network-segments/{id}, POST /network-segments/{id}/remediation-revalidation, POST /network-segments/{id}/withdraw, POST /requirement-assessments/{id}/reopen, POST /requirement-assessments/{id}/ccws, POST /ccws/{id}/submit, POST /remediation-items/{id}/assign, POST /rocs/{id}/qa-submit, POST /rocs/{id}/revise, POST /rocs/{id}/attest, POST /rocs/{id}/submission"

  - priority: 6
    category: auth
    check: "QA-only operations require acting X-User-ID == engagement.qa_reviewer_id."
    error_id: ERR_NOT_ENGAGEMENT_QA_REVIEWER
    http_status: 403
    applies_to: "POST /ccws/{id}/decision, POST /rocs/{id}/qa-review"

  - priority: 6
    category: auth
    check: "Vendor operations require acting X-User-ID == the target ScanCycle's asv_vendor_id."
    error_id: ERR_VENDOR_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "POST /scan-cycles/{id}/complete, POST /scan-cycles/{id}/findings, POST /scan-findings/{id}/dispute-decision"

  - priority: 7
    category: business_referential
    check: "Every cross-entity reference in a payload must belong to the same Engagement as the path resource: parent_segment_id, segment_id, component_id on an evidence item, component_id on a change-log entry, component_id on a scan finding."
    error_id: ERR_CROSS_ENGAGEMENT_REFERENCE
    http_status: 422
    applies_to: "POST /engagements/{id}/network-segments, PATCH /network-segments/{id}, POST /engagements/{id}/system-components, POST /requirement-assessments/{id}/evidence-items, POST /engagements/{id}/change-log-entries, POST /scan-cycles/{id}/findings"

  - priority: 7
    category: business_referential
    check: "Walking parent_segment_id upward from the proposed parent must not revisit the row being re-parented; the segment graph stays a forest. On PATCH /network-segments/{id} the walk starts at the proposed parent and fails the moment it reaches the path row (the parent itself counts, so a row may not become its own parent)."
    error_id: ERR_SEGMENT_CYCLE
    http_status: 422
    applies_to: "PATCH /network-segments/{id}"

  - priority: 7
    category: business_referential
    check: "The referenced AsvVendor must have effective_approval == APPROVED at the logical clock."
    error_id: ERR_ASV_NOT_APPROVED
    http_status: 422
    applies_to: "POST /engagements/{id}/scan-cycles"

  - priority: 8
    category: state
    check: "When engagement.posture == FROZEN, every child write on that engagement is refused."
    error_id: ERR_ENGAGEMENT_FROZEN
    http_status: 409
    applies_to: "POST /engagements/{id}/network-segments, POST /engagements/{id}/system-components, POST /engagements/{id}/sampling-plans, POST /engagements/{id}/requirement-assessments, PATCH /engagements/{id}, PATCH /network-segments/{id}, POST /network-segments/{id}/segmentation-test-plan, POST /network-segments/{id}/validation-result, POST /network-segments/{id}/remediation-revalidation, POST /network-segments/{id}/withdraw, POST /requirement-assessments/{id}/start-testing, POST /requirement-assessments/{id}/conclusion, POST /requirement-assessments/{id}/reopen, POST /requirement-assessments/{id}/evidence-items, POST /requirement-assessments/{id}/ccws, POST /ccws/{id}/submit, POST /remediation-items/{id}/assign, POST /remediation-items/{id}/retest"
    note: "A FROZEN engagement answers this code before any fiscal or constraint rule; the frozen posture is set the moment a RocReport row exists, so no sampling plan can be priced against a frozen engagement."

  - priority: 8
    category: state
    check: "When engagement.posture == RESTRICTED, scope lock and report creation are refused (child data entry stays open)."
    error_id: ERR_ENGAGEMENT_RESTRICTED
    http_status: 409
    applies_to: "POST /engagements/{id}/scope-lock, POST /engagements/{id}/rocs"

  - priority: 9
    category: state
    check: "The engagement must be in a status from which the requested transition exists in §1.2 (for example reassessment planning requires SUBMITTED)."
    error_id: ERR_INVALID_ENGAGEMENT_STATE
    http_status: 409
    applies_to: "POST /engagements/{id}/scope-lock, POST /engagements/{id}/rocs, POST /engagements/{id}/reassessment-plan"

  - priority: 9
    category: state
    check: "The segment must be in a state from which the requested segmentation transition exists (test plan from DECLARED, verdict from TEST_PLANNED, revalidation from FAILED, withdraw from DECLARED). Re-parenting requires the path row's segmentation_status == DECLARED and no segmentation_status == FAILED row anywhere in the proposed parent's upward chain."
    error_id: ERR_INVALID_SEGMENT_STATE
    http_status: 409
    applies_to: "POST /network-segments/{id}/segmentation-test-plan, POST /network-segments/{id}/validation-result, POST /network-segments/{id}/remediation-revalidation, POST /network-segments/{id}/withdraw, PATCH /network-segments/{id}"

  - priority: 9
    category: state
    check: "The requirement must be in a state from which the requested transition exists (start-testing from NOT_STARTED, conclusion from IN_TESTING, reopen from IN_PLACE only, worksheet creation from NOT_IN_PLACE)."
    error_id: ERR_INVALID_REQUIREMENT_STATE
    http_status: 409
    applies_to: "POST /requirement-assessments/{id}/start-testing, POST /requirement-assessments/{id}/conclusion, POST /requirement-assessments/{id}/reopen, POST /requirement-assessments/{id}/ccws, POST /requirement-assessments/{id}/evidence-items"

  - priority: 9
    category: state
    check: "The worksheet must be in a state from which the requested transition exists (submit from DRAFT, decision from SUBMITTED)."
    error_id: ERR_INVALID_CCW_STATE
    http_status: 409
    applies_to: "POST /ccws/{id}/submit, POST /ccws/{id}/decision"

  - priority: 9
    category: state
    check: "The remediation item must be in a state from which the requested transition exists (assign from OPEN or RETEST_FAILED, retest from IN_PROGRESS)."
    error_id: ERR_INVALID_REMEDIATION_STATE
    http_status: 409
    applies_to: "POST /remediation-items/{id}/assign, POST /remediation-items/{id}/retest"

  - priority: 9
    category: state
    check: "The report must be in a state from which the requested transition exists (qa-submit from DRAFTING, qa-review from IN_QA, revise from QA_REJECTED, attest from QA_APPROVED, submission from ATTESTED)."
    error_id: ERR_INVALID_ROC_STATE
    http_status: 409
    applies_to: "POST /rocs/{id}/qa-submit, POST /rocs/{id}/qa-review, POST /rocs/{id}/revise, POST /rocs/{id}/attest, POST /rocs/{id}/submission"

  - priority: 9
    category: state
    check: "Scan-cycle operations require the cycle in the right state: findings may only be added while SCHEDULED, completion only from SCHEDULED."
    error_id: ERR_INVALID_SCAN_CYCLE_STATE
    http_status: 409
    applies_to: "POST /scan-cycles/{id}/findings, POST /scan-cycles/{id}/complete"

  - priority: 9
    category: state
    check: "A dispute may only be raised on a finding whose dispute_status == NONE and decided on a finding whose dispute_status == DISPUTED."
    error_id: ERR_INVALID_FINDING_DISPUTE_STATE
    http_status: 409
    applies_to: "POST /scan-findings/{id}/dispute, POST /scan-findings/{id}/dispute-decision"

  - priority: 10
    category: state
    check: "expected_engagement_version must equal the current Engagement.version (§1.2.1 sampling-plan-create-stale-engagement)."
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /engagements/{id}/sampling-plans"

  - priority: 10
    category: state
    check: "expected_requirement_assessment_version must equal the current RequirementAssessment.version (§1.2.1 ccw-create-stale-requirement)."
    error_id: ERR_STALE_REQUIREMENT_VERSION
    http_status: 412
    applies_to: "POST /requirement-assessments/{id}/ccws"

  - priority: 11
    category: business_safety
    check: "The QA reviewer deciding a report must not have collected evidence on that engagement (no EvidenceItem with collector_assessor_id == acting user) and must not be the engagement lead."
    error_id: ERR_INDEPENDENCE_VIOLATION
    http_status: 422
    applies_to: "POST /rocs/{id}/qa-review, POST /ccws/{id}/decision"
    note: "Priority pair B — this beats ERR_ASSESSOR_CERTIFICATION_EXPIRED (priority 12) on POST /rocs/{id}/qa-review."

  - priority: 11
    category: business_safety
    check: "The assessor nominated as QA reviewer must differ from the engagement's lead_assessor_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /engagements/{id}/qa-reviewer, POST /engagements, PATCH /engagements/{id}"

  - priority: 11
    category: business_safety
    check: "The assessor nominated as QA reviewer must have qa_qualified == true."
    error_id: ERR_QA_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /engagements/{id}/qa-reviewer, POST /engagements"

  - priority: 11
    category: business_safety
    check: "Any Assessor named as lead or QA reviewer must have status == ACTIVE."
    error_id: ERR_ASSESSOR_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /engagements, PATCH /engagements/{id}, POST /engagements/{id}/qa-reviewer"

  - priority: 12
    category: business_temporal
    check: "An assessor acting as lead or QA reviewer, and any assessor named at engagement creation, must have certification_status == ACTIVE at the logical clock."
    error_id: ERR_ASSESSOR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /engagements, POST /engagements/{id}/qa-reviewer, POST /rocs/{id}/qa-review, POST /rocs/{id}/attest"

  - priority: 12
    category: business_temporal
    check: "A lead assessor's engagement calendar uses the closed interval [fieldwork_start_date, fieldwork_end_date] widened by a 3-day cooldown on both sides: the assignment is refused when new.start <= other.end + 3 days AND other.start <= new.end + 3 days for any other engagement led by the same assessor whose status != REASSESSMENT_PLANNED."
    error_id: ERR_ASSESSOR_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /engagements, PATCH /engagements/{id}"

  - priority: 12
    category: business_temporal
    check: "A new ScanCycle's half-open window [window_start, window_start + 90 days) must not intersect the window of any existing ScanCycle of the same engagement. Adjacency is permitted: a cycle starting exactly at another cycle's window_end is accepted."
    error_id: ERR_SCAN_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /engagements/{id}/scan-cycles"

  - priority: 12
    category: business_temporal
    check: "Attestation requires engagement.quarterly_scan_compliant == true — a ScanCycle in status PASSING whose window contains the logical clock."
    error_id: ERR_NO_PASSING_SCAN
    http_status: 422
    applies_to: "POST /rocs/{id}/attest"

  - priority: 13
    category: business_constraint
    check: "Assessor.email is unique across assessors."
    error_id: ERR_DUPLICATE_ASSESSOR_EMAIL
    http_status: 422
    applies_to: "POST /assessors, PATCH /assessors/{id}"

  - priority: 13
    category: business_constraint
    check: "AsvVendor.name is unique across vendors."
    error_id: ERR_DUPLICATE_VENDOR_NAME
    http_status: 422
    applies_to: "POST /asv-vendors, PATCH /asv-vendors/{id}"

  - priority: 13
    category: business_constraint
    check: "NetworkSegment.name is unique within an engagement."
    error_id: ERR_DUPLICATE_SEGMENT_NAME
    http_status: 422
    applies_to: "POST /engagements/{id}/network-segments"

  - priority: 13
    category: business_constraint
    check: "SystemComponent.hostname is unique within an engagement."
    error_id: ERR_DUPLICATE_HOSTNAME
    http_status: 422
    applies_to: "POST /engagements/{id}/system-components"

  - priority: 13
    category: business_constraint
    check: "RequirementAssessment.requirement_ref is unique within an engagement."
    error_id: ERR_DUPLICATE_REQUIREMENT_REF
    http_status: 422
    applies_to: "POST /engagements/{id}/requirement-assessments"

  - priority: 13
    category: business_constraint
    check: "ScanCycle.quarter_label is unique within an engagement."
    error_id: ERR_DUPLICATE_QUARTER_LABEL
    http_status: 422
    applies_to: "POST /engagements/{id}/scan-cycles"

  - priority: 13
    category: business_constraint
    check: "A component's facility_name may not appear under two different facility_type values within one engagement."
    error_id: ERR_FACILITY_TYPE_CONFLICT
    http_status: 422
    applies_to: "POST /engagements/{id}/system-components"

  - priority: 13
    category: business_constraint
    check: "A sampling plan requires a non-empty eligible population for the chosen variant (eligible_component_count >= 1)."
    error_id: ERR_EMPTY_SAMPLE_POPULATION
    http_status: 422
    applies_to: "POST /engagements/{id}/sampling-plans"

  - priority: 13
    category: business_constraint
    check: "Concluding a requirement requires the engagement's most recently created SamplingPlan to be status ACTIVE with plan_variant FINAL."
    error_id: ERR_SAMPLING_PLAN_STALE
    http_status: 422
    applies_to: "POST /requirement-assessments/{id}/conclusion"

  - priority: 13
    category: business_constraint
    check: "Scope lock requires at least one NetworkSegment with segment_class == CDE and segmentation_status == VALIDATED."
    error_id: ERR_NO_CDE_SEGMENT
    http_status: 422
    applies_to: "POST /engagements/{id}/scope-lock"

  - priority: 13
    category: business_constraint
    check: "A segment may not be withdrawn while any SystemComponent references it or any NetworkSegment names it as parent_segment_id."
    error_id: ERR_SEGMENT_HAS_COMPONENTS
    http_status: 422
    applies_to: "POST /network-segments/{id}/withdraw"

  - priority: 13
    category: business_constraint
    check: "An evidence item that names a component_id requires that component to have in_sample == true under the engagement's active plan."
    error_id: ERR_COMPONENT_NOT_IN_SAMPLE
    http_status: 422
    applies_to: "POST /requirement-assessments/{id}/evidence-items"

  - priority: 13
    category: business_constraint
    check: "An OBSERVATION or SYSTEM_CONFIG evidence item requires component_id."
    error_id: ERR_EVIDENCE_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /requirement-assessments/{id}/evidence-items"

  - priority: 13
    category: business_constraint
    check: "An INTERVIEW evidence item requires interviewee_name and interviewee_title."
    error_id: ERR_INTERVIEWEE_REQUIRED
    http_status: 422
    applies_to: "POST /requirement-assessments/{id}/evidence-items"

  - priority: 13
    category: business_constraint
    check: "An IN_PLACE or NOT_IN_PLACE conclusion requires evidence_completeness == true — at least one SUFFICIENT evidence item of each of DOCUMENT_REVIEW, INTERVIEW and OBSERVATION."
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /requirement-assessments/{id}/conclusion"

  - priority: 13
    category: business_constraint
    check: "Submitting a worksheet requires all five narrative sections non-empty and control_refs with at least one entry."
    error_id: ERR_CCW_SECTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /ccws/{id}/submit"

  - priority: 13
    category: business_constraint
    check: "Accepting a worksheet requires monitoring_interval_days <= 30."
    error_id: ERR_CCW_MONITORING_INTERVAL_TOO_LONG
    http_status: 422
    applies_to: "POST /ccws/{id}/decision"

  - priority: 13
    category: business_constraint
    check: "Accepting a worksheet requires rigor_score >= 70.00 (inclusive)."
    error_id: ERR_CCW_RIGOR_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ccws/{id}/decision"

  - priority: 13
    category: business_constraint
    check: "Creating a report requires every RequirementAssessment of the engagement to have left NOT_STARTED and IN_TESTING."
    error_id: ERR_REQUIREMENT_TESTING_INCOMPLETE
    http_status: 422
    applies_to: "POST /engagements/{id}/rocs"

  - priority: 13
    category: business_constraint
    check: "Creating a report requires applicable_requirement_count >= 1 so the compliance denominator is non-zero."
    error_id: ERR_NO_APPLICABLE_REQUIREMENTS
    http_status: 422
    applies_to: "POST /engagements/{id}/rocs"

  - priority: 13
    category: business_constraint
    check: "At most one RocReport row may exist per engagement; revisions reuse the existing row."
    error_id: ERR_ROC_ALREADY_EXISTS
    http_status: 422
    applies_to: "POST /engagements/{id}/rocs"

  - priority: 13
    category: business_constraint
    check: "Submitting a report to QA requires engagement.qa_reviewer_id to be set."
    error_id: ERR_QA_REVIEWER_NOT_ASSIGNED
    http_status: 422
    applies_to: "POST /rocs/{id}/qa-submit"

  - priority: 13
    category: business_constraint
    check: "attestation_signature_name must equal the lead assessor's full_name verbatim."
    error_id: ERR_ATTESTATION_SIGNATURE_MISMATCH
    http_status: 422
    applies_to: "POST /rocs/{id}/attest"

  - priority: 13
    category: business_constraint
    check: "Only a finding with severity_class == HIGH_OR_ABOVE may be disputed."
    error_id: ERR_FINDING_NOT_HIGH_SEVERITY
    http_status: 422
    applies_to: "POST /scan-findings/{id}/dispute"

  - priority: 13
    category: business_constraint
    check: "A reassessment plan's target_year must equal assessment_year + 1 and planned_start_date must be on or after the logical-clock date."
    error_id: ERR_INVALID_REASSESSMENT_YEAR
    http_status: 422
    applies_to: "POST /engagements/{id}/reassessment-plan"

  - priority: 14
    category: business_fiscal
    check: "The recomputed assessment_fee_total may not exceed engagement.approved_budget_amount."
    error_id: ERR_ASSESSMENT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /engagements/{id}/sampling-plans, POST /ccws/{id}/decision, PATCH /engagements/{id}"
    note: "Deliberately last — fiscal ceilings are checked after every safety, temporal and constraint rule, so a frozen engagement whose budget was cut below its current fee still answers ERR_ENGAGEMENT_FROZEN."

# =============================================================================
# §1.5 API Endpoint Table
# 69 endpoints, all top-level collections (api_prefix is empty). Every FK in §1.1
# is reverse-reachable through a filtered list endpoint. Roles are from §1.7.
# =============================================================================
endpoints:

  # ----- Assessor -----------------------------------------------------------
  - method: POST
    path: "/assessors"
    description: "Register a QSA-certified individual."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, certification_expires_at, "qa_qualified?"]
    output: Assessor
    side_effects: ["certification_status derived from the logical clock", "status defaults to ACTIVE", "qa_qualified defaults to false"]

  - method: GET
    path: "/assessors/{id}"
    description: "Read one assessor."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: Assessor
    side_effects: []

  - method: GET
    path: "/assessors"
    description: "List assessors with optional filters."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["status?", "certification_status?", "qa_qualified?", "limit?", "offset?"]
    output: Assessor[]
    side_effects: []

  - method: PATCH
    path: "/assessors/{id}"
    description: "Amend an assessor's record — used to expire a certification or suspend an individual."
    roles: [PlatformAdmin]
    code: 200
    input: ["full_name?", "email?", "certification_expires_at?", "qa_qualified?", "status?"]
    output: Assessor
    side_effects: ["certification_status recomputed", "assessor.version incremented by 1"]

  # ----- AsvVendor ----------------------------------------------------------
  - method: POST
    path: "/asv-vendors"
    description: "Register an Approved Scanning Vendor."
    roles: [PlatformAdmin]
    code: 201
    input: [name, approval_expires_at]
    output: AsvVendor
    side_effects: ["approval_status defaults to APPROVED", "effective_approval derived from the logical clock"]

  - method: GET
    path: "/asv-vendors/{id}"
    description: "Read one scanning vendor."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: AsvVendor
    side_effects: []

  - method: GET
    path: "/asv-vendors"
    description: "List scanning vendors."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["approval_status?", "effective_approval?", "limit?", "offset?"]
    output: AsvVendor[]
    side_effects: []

  - method: PATCH
    path: "/asv-vendors/{id}"
    description: "Amend a vendor record — used to revoke or re-date an ASV approval."
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "approval_expires_at?", "approval_status?"]
    output: AsvVendor
    side_effects: ["effective_approval recomputed", "vendor.version incremented by 1"]

  # ----- Engagement ---------------------------------------------------------
  - method: POST
    path: "/engagements"
    description: "Open an assessment engagement for a client."
    roles: [PlatformAdmin, LeadAssessor]
    code: 201
    input: [client_legal_name, merchant_level, assessment_year, acquirer_name, fieldwork_start_date, fieldwork_end_date, approved_budget_amount, lead_assessor_id, "qa_reviewer_id?"]
    output: Engagement
    side_effects: ["status SCOPING and posture OPEN", "lead assessor calendar checked per §1.4 priority 12 (closed interval plus 3-day cooldown)", "§1.3 assessment_fee_total computed from a zero sample (estimated_hours 160)", "Assessor.lead_engagement_count recomputed"]

  - method: GET
    path: "/engagements/{id}"
    description: "Read one engagement including posture, counts and both compliance percentages."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/engagements"
    description: "List engagements; the lead_assessor_id and qa_reviewer_id filters make both Assessor FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["status?", "posture?", "lead_assessor_id?", "qa_reviewer_id?", "merchant_level?", "assessment_year?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: GET
    path: "/engagements/{id}/summary"
    description: "Computed read: the scope partition, gap ledger, fee breakdown and both compliance variants in one payload."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: "{ engagement_id: string, posture: string, cde_component_count: integer, connected_component_count: integer, out_of_scope_component_count: integer, total_component_count: integer, open_gap_count: integer, unvalidated_segment_count: integer, accepted_ccw_count: integer, estimated_hours: number, assessment_fee_total: number, as_found_compliance_percentage: number, as_attested_compliance_percentage: number, quarterly_scan_compliant: boolean, scope_affecting_change_count: integer, reassessment_required: boolean }"
    side_effects: []

  - method: PATCH
    path: "/engagements/{id}"
    description: "Amend engagement terms — budget ceiling, acquirer, fieldwork window or QA reviewer."
    roles: [LeadAssessor]
    code: 200
    input: ["approved_budget_amount?", "acquirer_name?", "fieldwork_start_date?", "fieldwork_end_date?", "qa_reviewer_id?"]
    output: Engagement
    side_effects: ["§1.3 assessment_fee_total recomputed and re-checked against approved_budget_amount (§1.4 priority 14)", "lead calendar re-checked when the fieldwork window moves", "posture recomputed", "engagement.version incremented by 1"]

  - method: POST
    path: "/engagements/{id}/qa-reviewer"
    description: "Nominate the internal quality-assurance reviewer for the engagement."
    roles: [LeadAssessor]
    code: 200
    input: [qa_reviewer_id]
    output: Engagement
    side_effects: ["segregation-of-duties, qa_qualified, active-status and certification checks run in §1.4 priority order", "engagement.version incremented by 1"]

  - method: POST
    path: "/engagements/{id}/scope-lock"
    description: "Close scope definition and move the engagement into fieldwork."
    roles: [LeadAssessor]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status SCOPING -> FIELDWORK", "scope_locked = true", "posture recomputed", "engagement.version incremented by 1"]

  - method: POST
    path: "/engagements/{id}/reassessment-plan"
    description: "Record next year's assessment plan after submission."
    roles: [LeadAssessor]
    code: 200
    input: [target_year, planned_start_date]
    output: Engagement
    side_effects: ["status SUBMITTED -> REASSESSMENT_PLANNED", "next_assessment_start_date written", "engagement.version incremented by 1"]

  # ----- NetworkSegment -----------------------------------------------------
  - method: POST
    path: "/engagements/{id}/network-segments"
    description: "Declare a network zone and its claimed scope class."
    roles: [LeadAssessor, Assessor]
    code: 201
    input: [name, segment_class, "parent_segment_id?"]
    output: NetworkSegment
    side_effects: ["segmentation_status DECLARED and effective_class = segment_class", "parent chain checked for cycles (§1.4 priority 7)", "engagement.unvalidated_segment_count incremented and posture recomputed to RESTRICTED"]

  - method: GET
    path: "/network-segments/{id}"
    description: "Read one network segment."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: NetworkSegment
    side_effects: []

  - method: GET
    path: "/network-segments"
    description: "List network segments; the engagement_id and parent_segment_id filters make both FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "parent_segment_id?", "segmentation_status?", "segment_class?", "effective_class?", "limit?", "offset?"]
    output: NetworkSegment[]
    side_effects: []

  - method: PATCH
    path: "/network-segments/{id}"
    description: "Re-parent a segment that has not yet been tested — the scope-definition surface a lead uses when the client corrects the network diagram. Only parent_segment_id may change, and only while segmentation_status == DECLARED."
    roles: [LeadAssessor]
    code: 200
    input: ["parent_segment_id?"]
    output: NetworkSegment
    side_effects: ["parent_segment_id written (null detaches the row to the forest root)", "the proposed parent must belong to the same engagement (§1.4 priority 7 ERR_CROSS_ENGAGEMENT_REFERENCE) and its upward chain must not contain this row (§1.4 priority 7 ERR_SEGMENT_CYCLE)", "no effective_class moves: the endpoint refuses a parent whose upward chain contains a segmentation_status == FAILED row (ERR_INVALID_SEGMENT_STATE), so the component partition and any ACTIVE SamplingPlan are untouched", "segment.version incremented by 1"]

  - method: POST
    path: "/network-segments/{id}/segmentation-test-plan"
    description: "Record how and when segmentation will be tested."
    roles: [LeadAssessor, Assessor]
    code: 200
    input: [test_method, planned_date]
    output: NetworkSegment
    side_effects: ["segmentation_status DECLARED -> TEST_PLANNED", "segment.version incremented by 1"]

  - method: POST
    path: "/network-segments/{id}/validation-result"
    description: "Record the segmentation test verdict; a FAIL expands the cardholder data environment across the subtree."
    roles: [LeadAssessor, Assessor]
    code: 200
    input: [outcome, "note?"]
    output: NetworkSegment
    side_effects: ["PASS -> VALIDATED and, when scope_expanded_by_failure was true, the subtree's effective_class and every affected component's scope_class are restored", "FAIL -> FAILED and cascade chain A runs (subtree effective_class CDE, component reclassification, engagement counts, ACTIVE plan -> STALE, posture RESTRICTED)", "engagement.unvalidated_segment_count and posture recomputed", "segment.version and engagement.version incremented by 1"]

  - method: POST
    path: "/network-segments/{id}/remediation-revalidation"
    description: "Re-plan a segmentation test after a failure."
    roles: [LeadAssessor]
    code: 200
    input: [test_method, planned_date]
    output: NetworkSegment
    side_effects: ["segmentation_status FAILED -> TEST_PLANNED", "revalidation_round incremented by 1", "segment.version incremented by 1"]

  - method: POST
    path: "/network-segments/{id}/withdraw"
    description: "Withdraw a declared zone that turned out not to exist."
    roles: [LeadAssessor]
    code: 200
    input: [reason]
    output: NetworkSegment
    side_effects: ["segmentation_status DECLARED -> WITHDRAWN", "engagement.unvalidated_segment_count decremented and posture recomputed", "segment.version and engagement.version incremented by 1"]

  # ----- SystemComponent ----------------------------------------------------
  - method: POST
    path: "/engagements/{id}/system-components"
    description: "Inventory a system component inside a declared zone at a named facility."
    roles: [LeadAssessor, Assessor]
    code: 201
    input: [hostname, component_type, function_class, stores_chd, facility_name, facility_type, segment_id]
    output: SystemComponent
    side_effects: ["declared_scope_class frozen from the segment's segment_class", "scope_class derived from the segment's current effective_class", "engagement scope counts recomputed", "in_sample defaults to false until a sampling plan runs"]

  - method: GET
    path: "/system-components/{id}"
    description: "Read one system component."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: SystemComponent
    side_effects: []

  - method: GET
    path: "/system-components"
    description: "List system components; the engagement_id and segment_id filters make both FKs reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "segment_id?", "scope_class?", "declared_scope_class?", "component_type?", "in_sample?", "facility_name?", "limit?", "offset?"]
    output: SystemComponent[]
    side_effects: []

  # ----- SamplingPlan -------------------------------------------------------
  - method: POST
    path: "/engagements/{id}/sampling-plans"
    description: "Derive a stratified sample of components and facilities; supersedes the engagement's previous plan."
    roles: [LeadAssessor]
    code: 201
    input: [plan_variant, justification_text, expected_engagement_version]
    output: SamplingPlan
    side_effects: ["OCC check against Engagement.version (§1.2.1 sampling-plan-create-stale-engagement)", "§1.3 component_sample_allocation, facility_sample_selection and component_in_sample_selection run for the chosen variant", "the engagement's previous plan moves to SUPERSEDED and active_plan_stale is cleared", "engagement.active_sampling_plan_id points at this row", "§1.3 assessment_fee_total recomputed and checked against approved_budget_amount", "increments Engagement.version by 1"]

  - method: GET
    path: "/sampling-plans/{id}"
    description: "Read one sampling plan including its stratum allocations."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: SamplingPlan
    side_effects: []

  - method: GET
    path: "/sampling-plans"
    description: "List sampling plans; the engagement_id filter makes the FK reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "plan_variant?", "status?", "limit?", "offset?"]
    output: SamplingPlan[]
    side_effects: []

  # ----- RequirementAssessment ---------------------------------------------
  - method: POST
    path: "/engagements/{id}/requirement-assessments"
    description: "Add a requirement to the assessment programme with its applicability determination."
    roles: [LeadAssessor, Assessor]
    code: 201
    input: [requirement_ref, requirement_family, testing_procedure_count, applicability]
    output: RequirementAssessment
    side_effects: ["test_status NOT_STARTED for APPLICABLE rows and NOT_APPLICABLE otherwise", "risk_points set from §1.3 ccw_rigor_score FAMILY_RISK_POINTS", "engagement.applicable_requirement_count recomputed and compliance percentages recomputed"]

  - method: GET
    path: "/requirement-assessments/{id}"
    description: "Read one requirement assessment including both state dimensions and evidence coverage."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: RequirementAssessment
    side_effects: []

  - method: GET
    path: "/requirement-assessments"
    description: "List requirement assessments; the engagement_id filter makes the FK reverse-reachable."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "requirement_family?", "test_status?", "remediation_status?", "applicability?", "limit?", "offset?"]
    output: RequirementAssessment[]
    side_effects: []

  - method: POST
    path: "/requirement-assessments/{id}/start-testing"
    description: "Begin executing the testing procedures for a requirement."
    roles: [LeadAssessor, Assessor]
    code: 200
    input: []
    output: RequirementAssessment
    side_effects: ["test_status NOT_STARTED -> IN_TESTING", "requirement.version incremented by 1"]

  - method: POST
    path: "/requirement-assessments/{id}/conclusion"
    description: "Record the tester's conclusion for a requirement."
    roles: [LeadAssessor, Assessor]
    code: 200
    input: [conclusion, conclusion_rationale]
    output: RequirementAssessment
    side_effects: ["test_status IN_TESTING -> IN_PLACE | NOT_IN_PLACE | NOT_TESTED", "a NOT_IN_PLACE conclusion runs cascade chain B (GAP_OPEN, RemediationItem creation, open_gap_count, posture RESTRICTED)", "§1.3 compliance_projection recomputed for both variants", "requirement.version and engagement.version incremented by 1"]

  - method: POST
    path: "/requirement-assessments/{id}/reopen"
    description: "Reopen a requirement whose conclusion no longer holds."
    roles: [LeadAssessor]
    code: 200
    input: [reason]
    output: RequirementAssessment
    side_effects: ["test_status IN_PLACE -> IN_TESTING and remediation_status -> GAP_OPEN", "reopen_count incremented by 1", "a RemediationItem with source REQUIREMENT_REOPEN is created", "engagement.open_gap_count incremented and posture recomputed to RESTRICTED", "requirement.version and engagement.version incremented by 1"]

  # ----- EvidenceItem -------------------------------------------------------
  - method: POST
    path: "/requirement-assessments/{id}/evidence-items"
    description: "Append an evidence record — document review, interview, observation or system configuration."
    roles: [LeadAssessor, Assessor]
    code: 201
    input: [evidence_type, procedure_ref, sufficiency, "component_id?", "interviewee_name?", "interviewee_title?", "note?"]
    output: EvidenceItem
    side_effects: ["collector_assessor_id taken from the X-User-ID header", "collected_at set from the logical clock", "requirement.evidence_item_count, evidence_type_coverage and evidence_completeness recomputed", "the collector becomes ineligible to QA-review this engagement's report (§1.4 priority 11)"]

  - method: GET
    path: "/evidence-items/{id}"
    description: "Read one evidence item."
    roles: [LeadAssessor, Assessor, QaReviewer, AsvVendor, ClientRepresentative, PlatformAdmin]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []

  - method: GET
    path: "/evidence-items"
