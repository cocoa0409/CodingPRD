            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Single Seat", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 1, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
