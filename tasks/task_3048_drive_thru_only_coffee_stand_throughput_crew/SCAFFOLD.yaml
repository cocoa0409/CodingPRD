    roles: [StandOperator]
    code: 201
    input: [crew_member_id, role, starts_at, ends_at, expected_shift_version]
    output: ShiftAssignment
    side_effects: ["assignment created ASSIGNED", "increments Shift.version by 1"]

  - method: GET
    path: "/shift-assignments/{assignmentId}"
    description: "Get a shift assignment"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []

  - method: GET
    path: "/shift-assignments"
    description: "List shift assignments, filterable by shift or crew member"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: ["shift_id?", "crew_member_id?", "status?", "limit?", "offset?"]
    output: "ShiftAssignment[]"
    side_effects: []

  - method: POST
    path: "/shift-assignments/{assignmentId}/cancel"
    description: "Cancel an ASSIGNED assignment while the shift is DRAFT or PUBLISHED"
    roles: [StandOperator]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status ASSIGNED -> CANCELLED"]

  - method: POST
    path: "/shift-assignments/{assignmentId}/check-in"
    description: "Crew member checks themself into an assignment on an IN_PROGRESS shift"
    roles: [CrewMember]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status ASSIGNED -> CHECKED_IN"]

  - method: POST
    path: "/shifts/{shiftId}/publish"
    description: "Publish a DRAFT shift; requires ACTIVE agreement; computes provisional deficit score"
    roles: [StandOperator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status DRAFT -> PUBLISHED", "provisional_deficit_score computed"]

  - method: POST
    path: "/shifts/{shiftId}/start"
    description: "Start a PUBLISHED shift once the clock reaches starts_at"
    roles: [StandOperator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status PUBLISHED -> IN_PROGRESS"]

  - method: POST
    path: "/shifts/{shiftId}/reconcile"
    description: "Reconcile an ended IN_PROGRESS shift; un-checked-in assignments become NO_SHOW; reconciled deficit computed"
    roles: [StandOperator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status IN_PROGRESS -> RECONCILED", "ASSIGNED -> NO_SHOW sweep", "reconciled_deficit_score computed"]

  - method: POST
    path: "/shifts/{shiftId}/lock"
    description: "Lock a RECONCILED shift (terminal)"
    roles: [StandOperator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status RECONCILED -> LOCKED"]

  # --- Order & OrderItem ---
  - method: POST
    path: "/orders"
    description: "Create an order. WINDOW (tablet): lane_code required, enters lane immediately as MERGED. LOYALTY_APP: loyalty_account_id required, starts QUEUED (merges later). OCC on stand version. Computes per-line totals and build-time snapshots."
    roles: [CrewMember, ShiftLead, LoyaltyCustomer]
    code: 201
    input: [stand_id, source, "lane_code?", "loyalty_account_id?", items, expected_stand_version]
    output: Order
    side_effects: ["OrderItems created with snapshots", "WINDOW: lane slot reserved, lane_seq assigned", "increments Stand.version by 1", "app orders require stand OPEN; window orders allow OPEN|THROTTLED"]

  - method: GET
    path: "/orders/{orderId}"
    description: "Get an order (all three status dimensions, totals, lane assignment)"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember, LoyaltyCustomer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders, filterable by stand, loyalty account, queue status"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: ["stand_id?", "loyalty_account_id?", "queue_status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/merge"
    description: "Merge an app-ahead order into a lane (selector: min projected clear time, then fewest occupied, then lane_code asc; OCC on stand version)"
    roles: [LoyaltyCustomer]
    code: 200
    input: [expected_stand_version]
    output: Order
    side_effects: ["queue_status QUEUED -> MERGED", "lane_code + lane_seq assigned", "lane slot reserved", "increments Stand.version by 1"]

  - method: POST
    path: "/orders/{orderId}/abandon"
    description: "Abandon a non-terminal order with no captured payment; voids AUTHORIZED payment, releases lane slot, cancels open items"
    roles: [ShiftLead]
    code: 200
    input: []
    output: Order
    side_effects: ["queue_status -> ABANDONED", "AUTHORIZED payment -> VOIDED", "lane slot released", "items PENDING/BUILDING -> CANCELLED"]

  - method: POST
    path: "/orders/{orderId}/call-to-window"
    description: "Advance a MERGED order to AT_WINDOW"
    roles: [ShiftLead]
    code: 200
    input: []
    output: Order
    side_effects: ["queue_status MERGED -> AT_WINDOW"]

  - method: POST
    path: "/orders/{orderId}/handoff"
    description: "Hand off an AT_WINDOW order: requires payment CAPTURED and build READY; sets handoff_at, releases lane slot"
    roles: [ShiftLead]
    code: 200
    input: []
    output: Order
    side_effects: ["queue_status -> SERVED", "build_status -> HANDED_OFF", "handoff_at set", "lane slot released"]

  - method: GET
    path: "/order-items/{itemId}"
    description: "Get an order item"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember, LoyaltyCustomer]
    code: 200
    input: []
    output: OrderItem
    side_effects: []

  - method: GET
    path: "/order-items"
    description: "List order items, filterable by order or recipe"
    roles: [PlatformAdmin, RegionalManager, StandOperator, ShiftLead, CrewMember]
    code: 200
    input: ["order_id?", "recipe_id?", "build_status?", "limit?", "offset?"]
    output: "OrderItem[]"
    side_effects: []

  - method: POST
    path: "/order-items/{itemId}/start-build"
    description: "Start building a PENDING item on a MERGED|AT_WINDOW order"
    roles: [CrewMember]
    code: 200
    input: []
    output: OrderItem
