              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-A", name: "Alpha Mart", collection_method: "HYBRID", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 15000, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: false }
              as: DataCollector
              captures: { o_oos: $.data.id }
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 16000, collection_method: "STORE_AUDIT", observed_at: "2026-07-28T23:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_stale: $.data.id }
          trigger:
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 17000, collection_method: "HYBRID", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_win: $.data.id }
            - call: "POST /pricing/observations"
              payload: { link_id: "${l_id}", observed_price_cents: 17500, collection_method: "ONLINE", observed_at: "2026-07-31T20:00:00Z", in_stock: true }
              as: DataCollector
              captures: { o_new: $.data.id }
          assert:
            - "CompetitorProductLink.${l_id}.selected_observation_id == ${o_win} and latest_effective_price_cents == 17000"
            - "It is not 15000 (out of stock), not 16000 (73 hours old, outside the 72-hour TTL) and not 17500 (newer but dearer — price leads, recency only breaks ties)"
            - "CompetitorProductLink.${l_id}.data_status == SUFFICIENT and gap_bp == round_half_up(20000 * 10000 / 17000) == 11765"
            - "After the first trigger alone the selection is already 17000, and the second trigger does not move it"

      - name: corner_low_image_ceiling_applies_below_score_50
        claim_type: constants_applied
        grounds: [calculations.match_confidence_score.constants.LOW_IMAGE_SCORE_THRESHOLD, calculations.match_confidence_score.constants.LOW_IMAGE_CONFIDENCE_CEILING_BP]
        distinguishing_aspect: "The ATTRIBUTE_BLEND ceiling is keyed on image_score strictly below 50: scores 100/100/49 blend to 9235 but are capped to exactly 6000 (grade CLOSE), while 100/100/50 keep their blend of 9250 (grade EXACT) — a one-point change in the least-weighted channel swings the result by 3250 bp."
