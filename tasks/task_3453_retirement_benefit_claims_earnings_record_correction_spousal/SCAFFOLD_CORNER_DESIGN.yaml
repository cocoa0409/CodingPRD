- section: calculations
  instances:
  - name: aime_zero_when_no_earnings_record
    claim_type: correct_result
    grounds:
    - calculations.aime_computation
    - calculations.pia_bend_point
    distinguishing_aspect: 'Empty-set edge: with no EarningsYear rows at all, AIME is 0 (35 implicit zero years), PIA is 0, and the claim still
      approves to ENTITLED with monthly_benefit_cents == 0.'
    test_recipe:
      setup:
      - Worker w3a with no wage reports; RETIREMENT claim entitled 2026-06
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Zero Record
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w3a: $.data.id
          w3a_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${w3a}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${w3a}
        captures:
          c3a: $.data.id
      trigger:
      - call: POST /ssa/claims/${c3a}/approve
        payload: {}
        as: ClaimsSpecialist
      assert:
      - BenefitClaim.${c3a}.status == ENTITLED
      - aime_cents == 0, pia_cents == 0, monthly_benefit_cents == 0
  - name: indexation_face_value_at_eligibility_minus_two
    claim_type: input_set_filtering
    grounds:
    - calculations.earnings_indexation
    distinguishing_aspect: 'Boundary of the indexation window: tax_year 2025 >= eligibility_year(2026) - 2 = 2024 enters at FACE value (1975000),
      not indexed down by AWI(2024)/AWI(2025). A wrong-boundary implementation computes AIME 4600 instead of 4700.'
    test_recipe:
      setup:
      - 'Worker w3b born 1964-06 with a single wage report: 2025 = 1975000'
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Face Value
