    code: 200
    input: []
    output: PracticePricingAgreement
    side_effects: []

  - method: POST
    path: "/networks/pricing-agreements/{agreementId}/submit"
    description: "Submit a pricing agreement for approval"
    roles: [PracticeAdmin]
    code: 200
    input: [expected_practice_version]
    output: PracticePricingAgreement
    side_effects:
      - "status = PENDING_APPROVAL"
      - "submitted_by_user_id = X-User-ID"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/pricing-agreements/{agreementId}/approve"
    description: "Approve a submitted pricing agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PracticePricingAgreement
    side_effects:
      - "status = ACTIVE; approved_by_user_id = X-User-ID"
      - "Overlapping ACTIVE agreements of the same practice and tier → SUPERSEDED with superseded_by_agreement_id set"
      - "Practice.tier_level set to this agreement's tier_level"
      - "market_share_pct recomputed against the newly effective rebate routing term for the practice's open RebateQualification rows"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/pricing-agreements/{agreementId}/return-to-draft"
    description: "Return a pending or active agreement to DRAFT"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PracticePricingAgreement
    side_effects: ["status = DRAFT", "approved_by_user_id = null"]

  - method: POST
    path: "/networks/pricing-agreements/{agreementId}/reject"
    description: "Reject a submitted pricing agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PracticePricingAgreement
    side_effects: ["status = REJECTED"]

  - method: POST
    path: "/networks/pricing-agreements/{agreementId}/reinstate"
    description: "Reinstate a suspended pricing agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PracticePricingAgreement
    side_effects:
      - "status = ACTIVE"
      - "Practice.tier_level recomputed from trailing_12m_network_purchases_cents against the ladder"
      - "increments Practice.version by 1"

  # --- Purchase orders ------------------------------------------------------
  - method: POST
    path: "/networks/drug-purchase-orders"
    description: "Submit a drug purchase order"
    roles: [PracticeAdmin]
    code: 201
    input: ["practice_id?", "drug_product_id?", "quantity_units?", "shortage_allocation_id?"]
    output: DrugPurchaseOrder
    side_effects:
      - "status = SUBMITTED; submitted_at = the logical clock"
      - "unit_price_cents, extended_cost_cents and pricing_tier_applied resolved via practice_observed_unit_price_cents"
      - "Idempotency-Key honored when supplied"

  - method: POST
    path: "/networks/drug-purchase-orders/{orderId}/confirm"
    description: "Confirm a submitted purchase order"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DrugPurchaseOrder
    side_effects:
      - "status = CONFIRMED"
      - "For shortage-restricted products: the allocation's committed_units increases and DrugShortage.allocated_units increases"
      - "increments DrugShortage.version by 1 when the order draws on an allocation"

  - method: POST
    path: "/networks/drug-purchase-orders/{orderId}/backorder"
    description: "Mark a confirmed order backordered"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DrugPurchaseOrder
    side_effects: ["status = BACKORDERED"]

  - method: POST
    path: "/networks/drug-purchase-orders/{orderId}/ship"
    description: "Ship a confirmed order"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DrugPurchaseOrder
    side_effects: ["status = SHIPPED"]

  - method: POST
    path: "/networks/drug-purchase-orders/{orderId}/receive"
    description: "Receive a shipped order, creating an inventory lot"
    roles: [PracticeAdmin]
    code: 200
    input: [lot_number, expires_at]
    output: DrugPurchaseOrder
    side_effects:
      - "status = RECEIVED; received_at = the logical clock"
      - "An InventoryLot is created with quantity_received = quantity_remaining = quantity_units and acquisition_cost_cents_per_unit = unit_price_cents"
      - "Practice.trailing_12m_network_purchases_cents += extended_cost_cents"
      - "Practice.tier_level recomputed against the network ladder"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/drug-purchase-orders/{orderId}/cancel"
    description: "Cancel a non-terminal purchase order"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: DrugPurchaseOrder
    side_effects:
      - "status = CANCELLED"
      - "For shortage-restricted products: the allocation's committed_units and DrugShortage.allocated_units each decrease by quantity_units"
      - "increments DrugShortage.version by 1 when the order drew on an allocation"

  # --- Inventory lots -------------------------------------------------------
  - method: POST
    path: "/networks/inventory-lots/{lotId}/quarantine"
    description: "Quarantine an available lot"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status = QUARANTINED; the lot leaves the FIFO candidate set"]

  - method: POST
    path: "/networks/inventory-lots/{lotId}/release"
    description: "Release a quarantined lot back to AVAILABLE"
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: InventoryLot
    side_effects: ["status = AVAILABLE"]

  - method: POST
    path: "/networks/inventory-lots/{lotId}/read-expiry"
    description: "Evaluate a lot's expiry against the logical clock or a supplied instant"
    roles: [PracticeAdmin, NetworkAdmin]
    code: 200
    input: [as_of]
    output: InventoryLot
    side_effects: ["status = EXPIRED when expires_at <= as_of"]

  # --- Patient treatments ---------------------------------------------------
  - method: POST
    path: "/networks/patient-treatments"
    description: "Schedule a patient treatment"
    roles: [PracticeAdmin]
    code: 201
    input: [practice_id, provider_id, drug_product_id, pathway_protocol_id, patient_reference, regimen_code, payer_name, administered_units, dose_count, vial_yield_units, admin_fee_cents, administered_at]
    output: PatientTreatment
    side_effects:
      - "status = SCHEDULED"
      - "pathway_protocol_id must resolve to a PUBLISHED protocol for the product's drug class"

  - method: POST
    path: "/networks/patient-treatments/{treatmentId}/administer"
    description: "Administer the treatment, drawing vials FIFO and creating the claim"
    roles: [PracticeAdmin]
    code: 200
    input: [dose_plan, expected_practice_version]
    output: PatientTreatment
    side_effects:
      - "status = ADMINISTERED"
      - "LotConsumption rows created in FIFO order with consumption_sequence 1..N"
      - "wastage drawn from the terminal lot as a final is_wastage row when the dose plan rounds up"
      - "acquisition_cost_basis_cents and wastage_units computed"
      - "is_pathway_concordant computed and pathway_adherence_pct recomputed"
      - "Drawn lots' quantity_remaining reduced; depleted lots → DEPLETED"
      - "A PayerClaim is created in status DRAFT"

  - method: POST
    path: "/networks/patient-treatments/{treatmentId}/void"
    description: "Void an administered or billed treatment"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PatientTreatment
    side_effects:
      - "status = VOIDED"
      - "pathway_adherence_pct recomputed over the remaining ADMINISTERED and BILLED rows"

  # --- Payer claims ---------------------------------------------------------
  - method: POST
    path: "/networks/payer-claims/{claimId}/submit"
    description: "Submit a draft claim, pinning billed_amount_cents"
    roles: [RevenueCycleManager]
    code: 200
    input: ["expected_practice_version?", "write_off_tier?", "post_settlement_disclosure?"]
    output: PayerClaim
    side_effects:
      - "status = SUBMITTED"
      - "billed_amount_cents computed with the pinned end-of-line rounding order"
      - "Parent treatment → BILLED"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/payer-claims/{claimId}/adjudicate"
    description: "Record a payer remittance"
    roles: [PayerAdjudicator]
    code: 200
    input: [paid_amount_cents]
    output: PayerClaim
    side_effects:
      - "status = ADJUDICATED_PAID"
      - "allowed_amount_cents = min(billed_amount_cents, paid_amount_cents + the pinned write-off)"
      - "The practice's net-collections basis gains allowed_amount_cents"
      - "Practice.settled_claim_count recomputed"

  - method: POST
    path: "/networks/payer-claims/{claimId}/deny"
    description: "Record a payer denial"
    roles: [PayerAdjudicator]
    code: 200
    input: [denial_reason_code]
    output: PayerClaim
    side_effects:
      - "status = DENIED; denial_reason_code stored"
      - "Practice.unsettled_balance_cents += billed_amount_cents"
      - "Practice.denied_claim_count and settled_claim_count recomputed"
      - "If the recomputed denial ratio strictly exceeds the practice's denial_ratio_threshold_pct, the practice's ACTIVE pricing agreements → SUSPENDED with status_changed_by = DENIAL_RATIO_BREACH"
      - "increments Practice.version by 1"

  - method: POST
    path: "/networks/payer-claims/{claimId}/appeal"
    description: "Appeal a denied claim"
    roles: [RevenueCycleManager]
    code: 200
    input: []
    output: PayerClaim
    side_effects:
      - "status = APPEALED; appeal_round += 1"
      - "Practice.unsettled_balance_cents -= billed_amount_cents"

  - method: POST
    path: "/networks/payer-claims/{claimId}/void"
    description: "Void a draft or un-appealed denied claim"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PayerClaim
    side_effects:
      - "status = VOIDED"
      - "For a denied claim: Practice.unsettled_balance_cents -= billed_amount_cents"

  # --- Rebate programs and qualifications -----------------------------------
  - method: POST
    path: "/networks/{networkId}/rebate-programs"
    description: "Create a rebate program in DRAFT"
    roles: [NetworkAdmin]
    code: 201
    input: [program_name, drug_ndc_scope, market_share_threshold_pct, rebate_pct, compliance_min_score, period_epoch_index, weight_reporting_compliance, weight_adherence_steering, weight_transparency]
    output: RebateProgram
    side_effects: ["status = DRAFT"]

  - method: POST
    path: "/networks/rebate-programs/{programId}/activate"
    description: "Activate a rebate program"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RebateProgram
    side_effects: ["status = ACTIVE"]

  - method: POST
    path: "/networks/rebate-programs/{programId}/close"
    description: "Close a rebate program"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RebateProgram
    side_effects: ["status = CLOSED"]

  - method: POST
    path: "/networks/rebate-qualifications"
    description: "Create a rebate qualification evaluation for a practice and program"
    roles: [PracticeAdmin]
    code: 201
    input: [practice_id, rebate_program_id]
    output: RebateQualification
    side_effects:
      - "status = PENDING"
      - "period_epoch_index copied from the program"
      - "market_share_pct and compliance_score computed; is_qualified set by the inclusive thresholds"
      - "compact_discount_credit_cents computed from compliance_score"
      - "rebate_amount_cents computed with the variant selected by the period position"

  - method: POST
    path: "/networks/rebate-qualifications/{qualificationId}/report"
    description: "Practice submits the compliance report for the epoch"
    roles: [PracticeAdmin]
    code: 200
    input: [compliance_attestation]
    output: RebateQualification
    side_effects:
      - "compliance_report_submitted_at = the logical clock"
      - "Submission beyond the network's compliance_report_grace_days after the epoch closed is rejected"

  - method: POST
    path: "/networks/rebate-qualifications/{qualificationId}/verify-report"
    description: "Network verifies the compliance report"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RebateQualification
    side_effects: ["compliance_report_verified = true"]

  - method: POST
    path: "/networks/rebate-qualifications/{qualificationId}/evaluate"
    description: "Evaluate a pending qualification"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RebateQualification
    side_effects:
      - "status = QUALIFIED or DISQUALIFIED"
      - "rebate_amount_cents recomputed with the provisional or final variant by period position"
      - "Practice.is_rebate_qualified mirrored"

  - method: POST
    path: "/networks/rebate-qualifications/{qualificationId}/pay"
    description: "Pay a qualified rebate"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RebateQualification
    side_effects: ["status = PAID"]

  - method: POST
    path: "/networks/rebate-qualifications/{qualificationId}/reclaim"
    description: "Reclaim a qualified rebate"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RebateQualification
    side_effects:
      - "status = RECLAIMED; holdback_cents = rebate_amount_cents; rebate_amount_cents = 0"
      - "Practice.unsettled_balance_cents += the reclaimed amount"
      - "Practice.is_rebate_qualified = false"

  # --- Practice management agreements ---------------------------------------
  - method: POST
    path: "/networks/practice-management-agreements"
    description: "Create a practice-management agreement in DRAFT"
    roles: [NetworkAdmin]
    code: 201
    input: [practice_id, service_line, fee_basis, fee_rate, fixed_fee_cents, per_fte_fee_cents, per_claim_fee_cents, fte_count, term_start, term_end]
    output: PracticeManagementAgreement
    side_effects: ["status = DRAFT"]

  - method: POST
    path: "/networks/practice-management-agreements/{agreementId}/activate"
    description: "Activate (or resume) a management agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PracticeManagementAgreement
    side_effects:
      - "status = ACTIVE"
      - "active_month_count pinned and accrued_fee_cents computed via management_fee_accrual"

  - method: POST
    path: "/networks/practice-management-agreements/{agreementId}/suspend"
    description: "Suspend an active management agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PracticeManagementAgreement
    side_effects: ["status = SUSPENDED; accrued_fee_cents frozen"]

  - method: POST
    path: "/networks/practice-management-agreements/{agreementId}/terminate"
    description: "Terminate a management agreement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: PracticeManagementAgreement
    side_effects:
      - "status = TERMINATED"
      - "Practice.unsettled_balance_cents += accrued_fee_cents"

  # --- Research participations ----------------------------------------------
  - method: POST
    path: "/networks/practices/{practiceId}/research-participations"
    description: "Open a clinical research participation at a community site"
    roles: [NetworkAdmin]
    code: 201
    input: [study_protocol_number, study_phase, sponsor_name, target_enrollment]
    output: ResearchParticipation
    side_effects: ["site_status = APPLIED", "enrolled_participant_count = 0"]

  - method: POST
    path: "/networks/research-participations/{participationId}/begin-feasibility"
    description: "Begin the site feasibility review"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ResearchParticipation
    side_effects: ["site_status = FEASIBILITY_REVIEW"]

  - method: POST
    path: "/networks/research-participations/{participationId}/activate"
    description: "Activate (or resume) the research site"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ResearchParticipation
    side_effects: ["site_status = ACTIVATED"]

  - method: POST
    path: "/networks/research-participations/{participationId}/suspend"
    description: "Suspend the research site"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ResearchParticipation
    side_effects: ["site_status = SUSPENDED"]

  - method: POST
    path: "/networks/research-participations/{participationId}/deactivate"
    description: "Deactivate the research site"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: ResearchParticipation
    side_effects: ["site_status = DEACTIVATED"]

  - method: POST
    path: "/networks/research-participations/{participationId}/enroll-participant"
    description: "Enroll one participant at the site"
    roles: [NetworkAdmin]
    code: 201
    input: [participant_reference]
    output: ResearchParticipation
    side_effects: ["enrolled_participant_count += 1"]

  # --- Drug shortages -------------------------------------------------------
  - method: POST
    path: "/networks/{networkId}/drug-shortages"
    description: "Report a drug shortage event"
    roles: [NetworkAdmin]
    code: 201
    input: [drug_product_id, reported_at, supply_available_units, allocation_method]
    output: DrugShortage
    side_effects: ["status = REPORTED", "allocated_units = 0", "unallocated_units = supply_available_units"]

  - method: POST
    path: "/networks/drug-shortages/{shortageId}/allocate"
    description: "Run the shortage allocation waterfall across the network"
    roles: [NetworkAdmin]
    code: 200
    input: [practice_consumption_authorization_cents]
    output: DrugShortage
    side_effects:
      - "status = ALLOCATING"
      - "One ShortageAllocation per affiliated practice with allocation_rank and expires_epoch_index = allocation_epoch_index + 1"
      - "allocated_units set to the sum of the grants; unallocated_units = supply_available_units - allocated_units"
      - "Method-dependent ordering and remainder handling per shortage_allocation_units; on a re-run, prior GRANTED and PARTIALLY_COMMITTED grants are revoked first"
      - "practice_consumption_authorization_cents, a practice_id -> cents map, sets each created grant's consumption_authorization_cents and seeds DrugShortage.unclaimed_authorization_cents"

  - method: POST
    path: "/networks/drug-shortages/{shortageId}/activate"
    description: "Activate a shortage once its allocation is complete"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DrugShortage
    side_effects: ["status = ACTIVE", "DrugProduct.status → SHORTAGE_RESTRICTED"]

  - method: POST
    path: "/networks/drug-shortages/{shortageId}/resolve"
    description: "Resolve a shortage event"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: DrugShortage
    side_effects:
      - "status = RESOLVED"
      - "Uncommitted grants → EXPIRED, releasing their uncommitted units"
      - "DrugProduct.status → ACTIVE when no other shortage for the product remains live"

  # --- Affiliation contracts ------------------------------------------------
  - method: POST
    path: "/networks/practices/{practiceId}/affiliation-contracts"
    description: "Create an affiliation contract in DRAFT"
    roles: [NetworkAdmin]
    code: 201
    input: [contract_type, term_start, term_end, notice_period_days]
    output: AffiliationContract
    side_effects:
      - "status = DRAFT"
      - "pricing_agreements_unwound = false; open_orders_closed = false; rebate_holdback_cents = 0"

  - method: POST
    path: "/networks/affiliation-contracts/{contractId}/activate"
    description: "Activate an affiliation contract"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: AffiliationContract
    side_effects:
      - "status = ACTIVE"
      - "Practice.affiliation_status → AFFILIATED when it was PROSPECTIVE"

  - method: POST
    path: "/networks/affiliation-contracts/{contractId}/complete-unwind"
    description: "Complete the contract unwind after departure"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: AffiliationContract
    side_effects:
      - "status = TERMINATED"
      - "pricing_agreements_unwound = true; open_orders_closed = true"
      - "The withheld rebate total is reported and the practice is unbound from the network"

  - method: POST
    path: "/networks/affiliation-contracts/{contractId}/terminate"
    description: "Terminate a contract for a still-prospective practice"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: AffiliationContract
    side_effects: ["status = TERMINATED"]# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- Authentication & authorization --------------------------------------
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing, or the role is unknown"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting role is not permitted for this operation"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The user approving a pricing agreement is the user who submitted it, or is the practice's own PracticeAdmin identity"

  # --- Not found ------------------------------------------------------------
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Generic resource not found"
  - id: ERR_NETWORK_NOT_FOUND
    http: 404
    condition: "OncologyNetwork not found"
  - id: ERR_PRACTICE_NOT_FOUND
    http: 404
    condition: "Practice not found"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "Provider not found"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "DrugProduct not found"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "PracticePricingAgreement not found"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "DrugPurchaseOrder not found"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "InventoryLot not found"
  - id: ERR_TREATMENT_NOT_FOUND
    http: 404
    condition: "PatientTreatment not found"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "PayerClaim not found"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "RebateProgram not found"
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "RebateQualification not found"
  - id: ERR_PROTOCOL_NOT_FOUND
    http: 404
    condition: "PathwayProtocol not found"
  - id: ERR_MANAGEMENT_AGREEMENT_NOT_FOUND
    http: 404
    condition: "PracticeManagementAgreement not found"
  - id: ERR_PARTICIPATION_NOT_FOUND
    http: 404
    condition: "ResearchParticipation not found"
  - id: ERR_SHORTAGE_NOT_FOUND
    http: 404
    condition: "DrugShortage not found"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "ShortageAllocation not found"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "AffiliationContract not found"

  # --- Request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, or a value outside a closed enum"
  - id: ERR_CROSS_NETWORK_REFERENCE
    http: 400
    condition: "A body foreign key names an entity belonging to a different network"
  - id: ERR_PRACTICE_MISMATCH
    http: 400
    condition: "A body practice id does not match the practice named in the path"
  - id: ERR_DUPLICATE_PRACTICE_NPI
    http: 409
    condition: "Another practice in the same network already carries this practice_npi"
  - id: ERR_INVALID_EFFECTIVE_WINDOW
    http: 400
    condition: "effective_to is present and not strictly greater than effective_from"
  - id: ERR_INVALID_MANAGEMENT_TERM
    http: 400
    condition: "term_end precedes term_start on a management agreement"
  - id: ERR_INVALID_CONTRACT_TERM
    http: 400
    condition: "term_end precedes term_start on an affiliation contract"
  - id: ERR_INVALID_FEE_BASIS
    http: 400
    condition: "A REVENUE_CYCLE service line was given a fee basis other than PERCENT_OF_NET_COLLECTIONS"
  - id: ERR_INVALID_ADMINISTRATION_TIME
    http: 400
    condition: "administered_at is in the future relative to the logical clock"
  - id: ERR_INVALID_PROTOCOL_FOR_PRODUCT
    http: 400
    condition: "The named pathway protocol is not published for the administered product's drug class"

  # --- Temporal conflicts ---------------------------------------------------
  - id: ERR_PRICING_WINDOW_OVERLAP
    http: 409
    condition: "Another agreement of the same practice and tier already holds an intersecting window while PENDING_APPROVAL or ACTIVE"
  - id: ERR_MANAGEMENT_TERM_OVERLAP
    http: 409
    condition: "A management agreement for the same practice and service_line starts less than 30 days after the prior term's closed end"
  - id: ERR_PRICING_WINDOW_BEFORE_CONTRACT
    http: 409
    condition: "An agreement's effective_from precedes the practice's earliest affiliation contract term_start"
  - id: ERR_CONTRACT_LAPSED
    http: 409
    condition: "The practice's ACTIVE affiliation contract does not cover the confirmation instant"
  - id: ERR_COMPLIANCE_REPORT_LATE
    http: 409
    condition: "The compliance report was submitted after the network's grace period for the epoch closed"
  - id: ERR_DEPARTURE_ALREADY_EFFECTIVE
    http: 409
    condition: "The departure allocation epoch has already been reached, so the notice can no longer be withdrawn"

  # --- State preconditions --------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic state precondition failure"
  - id: ERR_PRACTICE_NOT_PROSPECTIVE
    http: 409
    condition: "Practice.affiliation_status is not PROSPECTIVE"
  - id: ERR_PRACTICE_NOT_AFFILIATED
    http: 409
    condition: "Practice.affiliation_status is not AFFILIATED"
  - id: ERR_PRACTICE_NOT_SUSPENDED
    http: 409
    condition: "Practice.affiliation_status is not SUSPENDED"
  - id: ERR_PRACTICE_NOT_DEPARTING
    http: 409
    condition: "Practice.affiliation_status is not DEPARTING"
  - id: ERR_PRACTICE_DEPARTURE_NOT_ALLOWED
    http: 409
    condition: "Practice.affiliation_status is not one that may issue a departure notice or withdraw an affiliation"
  - id: ERR_PRACTICE_NOT_AFFILIATABLE
    http: 409
    condition: "Practice.affiliation_status is neither PROSPECTIVE nor AFFILIATED"
  - id: ERR_AGREEMENT_NOT_DRAFT
    http: 409
    condition: "PracticePricingAgreement.status is not DRAFT"
  - id: ERR_AGREEMENT_NOT_PENDING
    http: 409
    condition: "PracticePricingAgreement.status is not PENDING_APPROVAL"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "PracticePricingAgreement.status is not ACTIVE"
  - id: ERR_AGREEMENT_NOT_SUSPENDED
    http: 409
    condition: "PracticePricingAgreement.status is not SUSPENDED"
  - id: ERR_AGREEMENT_IN_USE
    http: 409
    condition: "Orders have already been confirmed, shipped or received under this agreement, so it cannot be reopened"
  - id: ERR_ORDER_NOT_SUBMITTED
    http: 409
    condition: "DrugPurchaseOrder.status is not SUBMITTED (or BACKORDERED, for a re-confirm)"
  - id: ERR_ORDER_NOT_CONFIRMED
    http: 409
    condition: "DrugPurchaseOrder.status is not CONFIRMED"
  - id: ERR_ORDER_NOT_SHIPPED
    http: 409
    condition: "DrugPurchaseOrder.status is not SHIPPED"
  - id: ERR_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "DrugPurchaseOrder.status is terminal or already shipped and received"
  - id: ERR_LOT_NOT_AVAILABLE
    http: 409
    condition: "InventoryLot.status is not AVAILABLE"
  - id: ERR_LOT_NOT_QUARANTINED
    http: 409
    condition: "InventoryLot.status is not QUARANTINED"
  - id: ERR_LOT_EXPIRED
    http: 409
    condition: "InventoryLot.expires_at is at or before the logical clock"
  - id: ERR_LOT_QUARANTINE_BLOCKED_BY_SHORTAGE
    http: 409
    condition: "The lot's product is the subject of an ACTIVE shortage, so it may not be pulled from circulation"
  - id: ERR_TREATMENT_NOT_SCHEDULED
    http: 409
    condition: "PatientTreatment.status is not SCHEDULED"
  - id: ERR_TREATMENT_NOT_ADMINISTERED
    http: 409
    condition: "PatientTreatment.status is not ADMINISTERED or BILLED as the operation requires"
  - id: ERR_TREATMENT_HAS_SUBMITTED_CLAIM
    http: 409
    condition: "The treatment's claim is already submitted or appealed, so the administration cannot be voided"
  - id: ERR_CLAIM_NOT_DRAFT
    http: 409
    condition: "PayerClaim.status is not DRAFT"
  - id: ERR_CLAIM_NOT_SUBMITTED
    http: 409
    condition: "PayerClaim.status is not SUBMITTED or APPEALED as the operation requires"
  - id: ERR_CLAIM_NOT_DENIED
    http: 409
    condition: "PayerClaim.status is not DENIED"
  - id: ERR_CLAIM_NOT_VOIDABLE
    http: 409
    condition: "PayerClaim.status is not DRAFT, or is DENIED with an appeal already filed"
  - id: ERR_CLAIM_NOTHING_TO_BILL
    http: 422
    condition: "billed_amount_cents evaluates to zero at submission"
  - id: ERR_QUALIFICATION_NOT_PENDING
    http: 409
    condition: "RebateQualification.status is not PENDING"
  - id: ERR_QUALIFICATION_NOT_QUALIFIED
    http: 409
    condition: "RebateQualification.status is not QUALIFIED"
  - id: ERR_QUALIFICATION_PERIOD_NOT_ELAPSED
    http: 409
    condition: "The qualification's period epoch has not been reached by the network's allocation epoch"
  - id: ERR_SHORTAGE_NOT_REPORTED
    http: 409
    condition: "DrugShortage.status is not REPORTED"
  - id: ERR_SHORTAGE_NOT_ALLOCATING
    http: 409
    condition: "DrugShortage.status is not ALLOCATING"
  - id: ERR_SHORTAGE_NOT_ACTIVE
    http: 409
    condition: "DrugShortage.status is not ACTIVE"
  - id: ERR_MANAGEMENT_AGREEMENT_NOT_DRAFT
    http: 409
    condition: "PracticeManagementAgreement.status is not DRAFT (or SUSPENDED, for a resume)"
  - id: ERR_MANAGEMENT_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "PracticeManagementAgreement.status is neither ACTIVE nor SUSPENDED as the operation requires"
  - id: ERR_SITE_NOT_APPLIED
    http: 409
    condition: "ResearchParticipation.site_status is not APPLIED"
  - id: ERR_SITE_NOT_IN_FEASIBILITY
    http: 409
    condition: "ResearchParticipation.site_status is not FEASIBILITY_REVIEW (or SUSPENDED, for a resume)"
  - id: ERR_SITE_NOT_ACTIVATED
    http: 409
    condition: "ResearchParticipation.site_status is neither ACTIVATED nor SUSPENDED as the operation requires"
  - id: ERR_SITE_ALREADY_ACTIVE_TRIAL
    http: 409
    condition: "The practice already holds an ACTIVATED research participation"
  - id: ERR_PROTOCOL_NOT_DRAFT
    http: 409
    condition: "PathwayProtocol.status is not DRAFT"
  - id: ERR_PROTOCOL_NOT_PUBLISHED
    http: 409
    condition: "PathwayProtocol.status is not PUBLISHED"
  - id: ERR_CONTRACT_NOT_DRAFT
    http: 409
    condition: "AffiliationContract.status is not DRAFT"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "AffiliationContract.status is not ACTIVE"
  - id: ERR_CONTRACT_NOT_UNWINDING
    http: 409
    condition: "AffiliationContract.status is not UNWIND_IN_PROGRESS"
  - id: ERR_CONTRACT_NOT_TERMINABLE_WHILE_AFFILIATED
    http: 409
    condition: "An affiliation contract may only be terminated outright while the practice is still PROSPECTIVE"
  - id: ERR_PATHWAY_NOT_ACTIVE
    http: 409
    condition: "Practice.pathway_steering_status is not ACTIVE"
  - id: ERR_PATHWAY_ALREADY_ADOPTED
    http: 409
    condition: "Practice.pathway_steering_status is already ACTIVE (or is not adoptable from its current value)"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "The claim has already used both permitted appeal rounds"

  # --- Business rules -------------------------------------------------------
  - id: ERR_OFF_PATHWAY_REGIMEN_REJECTED
    http: 422
    condition: "The selected regimen_code is outside the pathway protocol's declared code set entirely"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "Usable on-hand units do not cover the vial-rounded demand at the administration instant"
  - id: ERR_ALLOCATION_OVERCOMMIT
    http: 409
    condition: "Confirming the order would drive a shortage allocation's uncommitted units below zero"
  - id: ERR_NO_SHORTAGE_ALLOCATION
    http: 409
    condition: "A shortage-restricted order has no grant covering its quantity"
  - id: ERR_PRODUCT_NOT_ORDERABLE
    http: 409
    condition: "DrugProduct.status is not ACTIVE"
  - id: ERR_TERMS_FROZEN
    http: 403
    condition: "No pricing agreement may be created or submitted while network commercial terms are frozen"
  - id: ERR_TERMS_ALREADY_FROZEN
    http: 409
    condition: "The network's commercial terms are already frozen"
  - id: ERR_OPEN_REBATE_CLAIMS_EXIST
    http: 409
    condition: "A rebate qualification for the target epoch is still PENDING, so the epoch cannot be advanced"
  - id: ERR_OPEN_MANAGEMENT_AGREEMENT
    http: 409
    condition: "A practice-management agreement is still live (DRAFT, ACTIVE or SUSPENDED) where termination is required"
  - id: ERR_OPEN_MANAGEMENT_SUSPENSION
    http: 409
    condition: "A practice-management agreement is still SUSPENDED, so the practice may not return to AFFILIATED"
  - id: ERR_OPEN_ORDERS_EXIST
    http: 409
    condition: "A purchase order is still non-terminal, so the contract unwind cannot complete"
  - id: ERR_OPEN_RESEARCH_SITE
    http: 409
    condition: "A research participation is still live, so the contract unwind cannot complete"
  - id: ERR_COMPLIANCE_REPORT_NOT_VERIFIED
    http: 409
    condition: "The rebate's compliance report has not been verified by the network"
  - id: ERR_REBATE_ON_HOLDBACK
    http: 409
    condition: "The rebate carries a nonzero holdback and may not be paid"
  - id: ERR_PAYER_OVERPAYMENT
    http: 422
    condition: "paid_amount_cents exceeds billed_amount_cents"
  - id: ERR_DENIAL_RATIO_STILL_BREACHED
    http: 409
    condition: "The practice's denial ratio is still strictly above the threshold, so the agreement cannot be reinstated"
  - id: ERR_NO_ELIGIBLE_PRACTICES
    http: 409
    condition: "No practice in the network is AFFILIATED, so a shortage cannot be allocated"
  - id: ERR_THRESHOLD_NOT_MET
    http: 409
    condition: "A threshold that must be crossed for the operation is not met (e.g. zero supply reported on a shortage)"
  - id: ERR_ALLOCATION_INCOMPLETE
    http: 409
    condition: "The allocation grants do not sum to the shortage's available supply"
  - id: ERR_NO_PUBLISHED_PROTOCOL
    http: 409
    condition: "The network has no PUBLISHED pathway protocol, so the pathways program cannot be adopted"
  - id: ERR_NO_ACTIVE_AFFILIATION_CONTRACT
    http: 409
    condition: "The practice has no ACTIVE affiliation contract to act upon"
  - id: ERR_NO_PRICING_AGREEMENT
    http: 409
    condition: "The practice has no pricing agreement in DRAFT or ACTIVE, so it cannot be affiliated"

  # --- Concurrency ----------------------------------------------------------
  - id: ERR_VERSION_MISMATCH
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: NetworkAdmin
    description: "Network operations owner: onboarding, agreement approval, purchasing confirmations, shortage allocation runs, rebate lifecycle, contract unwind. Opaque operator identity — not tied to a persisted entity."
    identity: opaque
    exclusive_operations:
      - "POST /networks — Create a network"
      - "POST /networks/{id}/advance-epoch — Advance the allocation epoch"
      - "POST /networks/{id}/freeze-commercial-terms — Freeze commercial terms"
      - "POST /networks/{id}/unfreeze-commercial-terms — Lift the freeze"
      - "POST /networks/{id}/drug-products — Create a drug product"
      - "POST /networks/drug-products/{id}/recall — Recall a drug product"
      - "POST /networks/{id}/pathway-protocols — Create a pathway protocol"
      - "PUT /networks/pathway-protocols/{id} — Publish or retire a protocol"
      - "POST /networks/{id}/rebate-programs — Create a rebate program"
      - "POST /networks/rebate-programs/{id}/activate — Activate a rebate program"
      - "POST /networks/rebate-programs/{id}/close — Close a rebate program"
      - "POST /networks/{id}/drug-shortages — Report a shortage"
      - "POST /networks/drug-shortages/{id}/allocate — Run the allocation waterfall"
      - "POST /networks/drug-shortages/{id}/activate — Activate a shortage"
      - "POST /networks/drug-shortages/{id}/resolve — Resolve a shortage"
      - "POST /networks/practices/{id}/affiliate — Affiliate a practice"
      - "POST /networks/practices/{id}/suspend — Suspend a practice"
      - "POST /networks/practices/{id}/reinstate — Reinstate a practice"
      - "POST /networks/practices/{id}/withdraw-affiliation — Withdraw a prospective affiliation"
      - "POST /networks/practices/{id}/pathways/suspend — Suspend the pathways program"
      - "POST /networks/pricing-agreements/{id}/approve — Approve a pricing agreement"
      - "POST /networks/pricing-agreements/{id}/return-to-draft — Return an agreement to draft"
      - "POST /networks/pricing-agreements/{id}/reject — Reject an agreement"
      - "POST /networks/pricing-agreements/{id}/reinstate — Reinstate a suspended agreement"
      - "POST /networks/drug-purchase-orders/{id}/confirm — Confirm an order"
      - "POST /networks/drug-purchase-orders/{id}/backorder — Backorder an order"
      - "POST /networks/drug-purchase-orders/{id}/ship — Ship an order"
      - "POST /networks/rebate-qualifications — Create a qualification evaluation for a practice"
      - "POST /networks/rebate-qualifications/{id}/verify-report — Verify a compliance report"
      - "POST /networks/rebate-qualifications/{id}/evaluate — Evaluate a qualification"
      - "POST /networks/rebate-qualifications/{id}/pay — Pay a rebate"
      - "POST /networks/rebate-qualifications/{id}/reclaim — Reclaim a rebate"
      - "POST /networks/practice-management-agreements — Create a management agreement"
      - "POST /networks/practice-management-agreements/{id}/activate — Activate a management agreement"
      - "POST /networks/practice-management-agreements/{id}/suspend — Suspend a management agreement"
      - "POST /networks/practice-management-agreements/{id}/terminate — Terminate a management agreement"
      - "POST /networks/practices/{id}/research-participations — Open a research participation"
      - "POST /networks/research-participations/{id}/* — Every research site transition"
      - "POST /networks/practices/{id}/affiliation-contracts — Create an affiliation contract"
      - "POST /networks/affiliation-contracts/{id}/activate — Activate a contract"
      - "POST /networks/affiliation-contracts/{id}/complete-unwind — Complete the contract unwind"
      - "POST /networks/affiliation-contracts/{id}/terminate — Terminate a contract"
      - "POST /networks/patient-treatments/{id}/void — Void a treatment"
      - "POST /networks/payer-claims/{id}/void — Void a claim"
    shared_operations:
      - "GET /networks/* — All reads, shared with every role"

  - name: PracticeAdmin
    description: "The affiliated practice itself. Entity-backed: X-User-ID equals the id of the Practice it acts as. Owns ordering, administration, inventory custody, its own pricing agreement drafts and its own departure notices."
    identity: "entity_backed:Practice"
    exclusive_operations:
      - "POST /networks/drug-purchase-orders — Submit an order"
      - "POST /networks/drug-purchase-orders/{id}/receive — Receive an order into a lot"
      - "POST /networks/drug-purchase-orders/{id}/cancel — Cancel an order"
      - "POST /networks/inventory-lots/{id}/quarantine — Quarantine a lot"
      - "POST /networks/inventory-lots/{id}/release — Release a lot"
      - "POST /networks/inventory-lots/{id}/read-expiry — Read a lot's expiry"
      - "POST /networks/patient-treatments — Schedule a treatment"
      - "POST /networks/patient-treatments/{id}/administer — Administer a treatment"
      - "POST /networks/practices/{id}/providers — Create a provider"
      - "POST /networks/providers/{id}/deactivate — Deactivate a provider"
      - "POST /networks/providers/{id}/reactivate — Reactivate a provider"
      - "POST /networks/rebate-qualifications/{id}/report — Submit the compliance report"
    shared_operations:
      - "POST /networks/practices/{id}/pricing-agreements — Draft a pricing agreement (shared with NetworkAdmin)"
      - "POST /networks/pricing-agreements/{id}/submit — Submit for approval (PracticeAdmin only in practice)"
      - "POST /networks/practices/{id}/pathways/adopt — Adopt the pathways program (shared with NetworkAdmin)"
      - "POST /networks/practices/{id}/pathways/withdraw — Withdraw from pathways (shared with NetworkAdmin)"
      - "POST /networks/practices/{id}/departure-notice — Issue a departure notice (shared with NetworkAdmin)"
      - "POST /networks/practices/{id}/withdraw-departure — Withdraw a departure notice (shared with NetworkAdmin)"
      - "GET /networks/* — All reads"

  - name: RevenueCycleManager
    description: "Revenue-cycle services operator: claim submission, appeal, and the management-services fee workflow. Opaque operator identity."
    identity: opaque
    exclusive_operations:
      - "POST /networks/payer-claims/{id}/submit — Submit a claim"
      - "POST /networks/payer-claims/{id}/appeal — Appeal a denied claim"
    shared_operations:
      - "GET /networks/* — All reads, including the management-agreement statement"

  - name: PayerAdjudicator
    description: "External payer's claims-processing identity: records remittances and denials. Opaque operator identity."
    identity: opaque
    exclusive_operations:
      - "POST /networks/payer-claims/{id}/adjudicate — Record a remittance"
      - "POST /networks/payer-claims/{id}/deny — Record a denial"
    shared_operations:
      - "GET /networks/* — All reads"

  - name: NetworkAnalyst
    description: "Read-only analytics identity used to audit tiering, rebate share and adherence without any write authority. Opaque operator identity."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /networks/* — All reads"

  - name: PlatformAdmin
    description: "Benchmark operator identity that owns only the test-driving clock endpoint. Opaque operator identity — it is deliberately NOT a superuser: it holds no business write authority."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — Set the logical clock"
    shared_operations:
      - "GET /networks/* — All reads"