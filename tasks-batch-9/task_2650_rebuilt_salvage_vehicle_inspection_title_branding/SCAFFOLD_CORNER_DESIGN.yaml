              as_user_id: "adj-01"
              captures: { rep_a: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_a}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_a}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_a: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_a}", rebuilder_id: "${rb_id}", salvage_title_id: "${title_a}", declared_repair_cost_cents: 320000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_a: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007340", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_b: $.data.id }
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_b}", insurer_name: "Cascade Mutual", claim_number: "CM-93040", basis_code: "GROSS_ESTIMATE", acv_cents: 400000, repair_estimate_cents: 320000, damage_type: "COLLISION", odometer_reading_miles: 0, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_b: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_b}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_b}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_b: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_b}", rebuilder_id: "${rb_id}", salvage_title_id: "${title_b}", declared_repair_cost_cents: 320000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_b: $.data.id }
          trigger:
            - call: "POST /v1/fraud-referrals"
              payload: { vehicle_id: "${veh_a}", application_id: "${app_a}", referral_type: "DOCUMENT_FORGERY", evidence_summary: "receipt letterhead mismatch on the first build" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { ref_a: $.data.id }
            - call: "GET /v1/rebuilders/${rb_id}"
              payload: { }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_after_first: $.data.version }
            - call: "POST /v1/fraud-referrals"
              payload: { vehicle_id: "${veh_b}", application_id: "${app_b}", referral_type: "DOCUMENT_FORGERY", evidence_summary: "same letterhead reused on the second build" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { ref_b: $.data.id }
          assert:
            - "after the first referral Rebuilder.${rb_id}.open_referral_count == 1 and license_status == ACTIVE"
            - "after the second referral Rebuilder.${rb_id}.open_referral_count == 2 and license_status == PROBATION"
            - "FraudReferral.${ref_a}.status == OPEN and FraudReferral.${ref_b}.status == OPEN"
            - "Vehicle.${veh_a}.fraud_hold == UNDER_REFERRAL and Vehicle.${veh_b}.fraud_hold == UNDER_REFERRAL"
            - "Rebuilder.${rb_id}.substantiated_referral_count == 0 (no investigation has closed, so the SUSPENDED cascade did not fire)"
            - "Rebuilder.${rb_id}.last_license_action_by_user_id is null (the move to PROBATION was a system cascade, not an admin action)"

      - name: stolen_component_finding_cascade_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: "A single inspector finding must propagate across four entities in one request."
        excluded_because:
          difficulty_instance: stolen_component_finding_cascades_document_referral_vehicle_and_rebuilder
          rationale: "The §1.8 instance already walks the four-level chain from the finding through the parts document, the auto-opened referral, the vehicle hold and the rebuilder counters, with every intermediate value asserted."

      - name: referral_substantiation_cascade_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: "Closing a fraud case must void the title, void the application and suspend the licence together."
        excluded_because:
          difficulty_instance: substantiated_referral_cascades_title_void_application_void_and_suspension
          rationale: "The §1.8 instance already asserts the full fan-out of a SUBSTANTIATED resolution, so a corner-level repeat would duplicate the same call sequence and the same terminal states."

      - name: damage_basis_dual_variant_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        distinguishing_aspect: "The two damage-ratio bases must diverge on identical damage figures."
        excluded_because:
          difficulty_instance: damage_basis_variant_flips_recommended_brand_on_identical_damage
          rationale: "The §1.8 instance already files the same loss under both basis codes and shows the recommended brand flipping, which is exactly the dual-variant claim for this layer."

      - name: salvage_ratio_threshold_layer_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        distinguishing_aspect: "The instantaneous damage-ratio threshold must be tested exactly at the boundary."
        excluded_because:
          difficulty_instance: damage_ratio_exactly_at_salvage_threshold_brands_but_one_ten_thousandth_below_does_not
          rationale: "The §1.8 instance already pins the at-threshold and one-ten-thousandth-below cases with pre-computed ratios, covering the instantaneous arm of this layer."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: submit_publishes_the_escrow_move_in_the_same_request
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /v1/applications/{id}/submit]
          - entities.Rebuilder.fields.fee_balance_cents
        distinguishing_aspect: "consistency_model is immediate, so the submit response itself already carries the escrowed amount and the derived documentation figures, and an immediately following read of the rebuilder shows the balance reduced by exactly the escrow with no lag and no reconciliation step."
        test_recipe:
          setup: ["a rebuilder funded with 500000 cents and a complete TRAILER application in DRAFT"]
          setup_api_calls:
            - call: "POST /v1/vehicles"
              payload: { vin: "1HGCM82633A007341", model_year: 2020, make: "Wells", model: "Cargo", body_class: "TRAILER", registered_state_code: "NV" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { veh_id: $.data.id }
            - call: "POST /v1/rebuilders"
              payload: { legal_name: "Sierra Rebuilders LLC", license_number: "RB-9341", license_expires_at: "2027-06-30T00:00:00Z", bond_amount_cents: 2500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { rb_id: $.data.id }
            - call: "POST /v1/rebuilders/${rb_id}/deposits"
              payload: { amount_cents: 500000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /v1/damage-reports"
              payload: { vehicle_id: "${veh_id}", insurer_name: "Cascade Mutual", claim_number: "CM-93041", basis_code: "GROSS_ESTIMATE", acv_cents: 400000, repair_estimate_cents: 320000, damage_type: "COLLISION", odometer_reading_miles: 0, report_effective_at: "2026-07-20T00:00:00Z", total_loss_declared: true }
              as: InsurerAdjuster
              as_user_id: "adj-01"
              captures: { rep_id: $.data.id }
            - call: "POST /v1/title-records"
              payload: { vehicle_id: "${veh_id}", issuing_state_code: "NV", owner_name: "Ada Reyes", source_damage_report_id: "${rep_id}" }
              as: StateTitleClerk
              as_user_id: "clerk-01"
              captures: { title_id: $.data.id }
            - call: "POST /v1/applications"
              payload: { vehicle_id: "${veh_id}", rebuilder_id: "${rb_id}", salvage_title_id: "${title_id}", declared_repair_cost_cents: 320000 }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "FRONT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "REAR" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "LEFT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
            - call: "POST /v1/applications/${app_id}/parts-documents"
              payload: { doc_type: "PHOTOGRAPH", part_class: "PHOTO_SET", source_type: "OWNER_SUPPLIED", photo_view_code: "RIGHT" }
              as: Rebuilder
              as_user_id: "${rb_id}"
          trigger:
            - call: "POST /v1/applications/${app_id}/submit"
              payload: { attestation_signed: true }
              as: Rebuilder
              as_user_id: "${rb_id}"
              captures: { app_v: $.data.version }
            - call: "GET /v1/rebuilders/${rb_id}"
              payload: { }
              as: ProgramAdmin
              as_user_id: "admin-01"
          assert:
            - "the submit response body already shows status SUBMITTED, assessed_fee_cents 7500, fee_escrowed_cents 7500, total_program_charge_cents 7500, documentation_completeness_pct 100.00 and photo_view_count 4"
            - "the immediately following rebuilder read shows fee_balance_cents 492500, escrowed_fee_total_cents 7500, fees_deposited_cents 500000 and fees_consumed_cents 0"
            - "492500 + 7500 == 500000, so the ledger reconciles inside the same request with no eventual-consistency lag"
            - "${app_v} is greater than 1"

      - name: verified_document_rejection_visibility
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "A compensating write must republish the derived aggregate in the same response."
        excluded_because:
          difficulty_instance: rejecting_a_previously_verified_document_restores_the_parts_cost_aggregate
          rationale: "The §1.8 instance already reads the application's documented_parts_cost_cents immediately before and after the rejection and shows the aggregate restored within the same request, which is the immediate-consistency claim for a compensating write."
