    roles: [Registrar, AcademicAdvisor, CertificationOfficer, LearningSpecialist, ComplianceOfficer, AppealsCommittee, AthleticsOperations]
    code: 200
    input: ["declared_program_id?", "sport_code?", "risk_tier?", "eligibility_state?", "support_status?", "limit?", "offset?"]
    output: StudentAthlete[]
    side_effects: []

  - method: GET
    path: "/athletics/student-athletes/{student_athlete_id}/eligibility-summary"
    description: "Recompute and return the student's full eligibility picture on demand. audit_variant selects the catalog year used by degree_applicable_credit_audit; risk_variant selects the GPA basis for academic_risk_score. Omitting both applies the default variant selection rules from §1.3."
    roles: [Registrar, AcademicAdvisor, CertificationOfficer, LearningSpecialist, ComplianceOfficer, AppealsCommittee, StudentAthlete]
    code: 200
    input: ["audit_variant?", "risk_variant?"]
    output: "{ student_athlete_id: string, audit_variant: string, risk_variant: string, degree_applicable_credits: number, progress_pct: number, required_progress_pct: number, benchmark_result: string, failure_reasons: string[], cumulative_gpa: number, completed_full_time_terms: integer, transfer_credits_accepted: number, risk_score: number, risk_tier: string, required_study_hall_hours: number, missed_class_units_charged: number, missed_class_units_remaining: number, apr_points_possible: integer, apr_points_earned: number, apr_points_forfeited: number, version: integer }"
    side_effects:
      - "runs degree_applicable_credit_audit, progress_benchmark_evaluation, academic_risk_score and support_requirement_hours and persists the results onto StudentAthlete when the default variants are in force"

  - method: GET
