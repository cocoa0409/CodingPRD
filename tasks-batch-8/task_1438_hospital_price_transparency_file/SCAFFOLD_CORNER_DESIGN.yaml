      - name: rbac_contract_manager_cannot_create_service_item
        claim_type: exclusive_operation_denied
        grounds: ["roles[ContractManager]", "endpoints: POST /transparency/service-items"]
        distinguishing_aspect: "ContractManager attempting a TransparencyOfficer-exclusive operation fails ERR_FORBIDDEN_ROLE (403) at priority 2, before any facility existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /transparency/service-items", payload: { facility_id: "00000000-0000-0000-0000-000000000000", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: ContractManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE (http 403)"]

      - name: rbac_officer_cannot_create_payer
