            - "the SIGN is HTTP 200 with status == 'SIGNED' and signed_at == '2026-08-01T00:00:00Z' from the logical clock"
            - "${e_no_tier} == 'ERR_NO_PACKAGE_TIER' (HTTP 409) - with the contract signed the second precondition finally surfaces"
