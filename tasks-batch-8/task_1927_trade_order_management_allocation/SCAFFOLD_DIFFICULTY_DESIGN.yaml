            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/securities/${sec}/status", payload: { to_status: HALTED }, as: DeskAdmin }
          trigger:
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 10, fill_price_cents: 1000, executed_at: "2026-07-31T23:00:00Z" }, as: ExecutionDesk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SECURITY_HALTED (safety, priority 8) — not ERR_FILL_BEFORE_ROUTE (temporal, priority 10), though executed_at 2026-07-31T23:00:00Z < routed_at"
            - "BlockOrder.${blk}.filled_qty remains 0; no Fill created"

  - rule_id: boundary_precision_check
