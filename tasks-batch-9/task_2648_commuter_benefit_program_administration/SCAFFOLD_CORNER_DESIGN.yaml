      - name: stale_expected_account_version_on_election_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.election-create-stale-account
          - errors.ERR_STALE_ACCOUNT_VERSION
          - validations[priority=78]
          - endpoints.POST_/benefits/elections
        distinguishing_aspect: "The §1.2.1 election-create-stale-account race, driven serially: the FIRST create bumps BenefitAccount.version from 1 to 2, so re-sending expected_account_version 1 must return ERR_STALE_ACCOUNT_VERSION (412) with the account still at version 2 and still exactly one election, and only the request carrying version 2 supersedes the prior election."
        test_recipe:
          setup:
            - "Employer 'Version Race Co' is ACTIVE in US-TX-AUS with transit_group_limit_cents 30000, pretax_ratio_cap_pct 100 and an ACTIVE TRANSIT_PASS category (limit 30000)."
