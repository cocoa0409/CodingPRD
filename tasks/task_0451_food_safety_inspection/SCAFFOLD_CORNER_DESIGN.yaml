              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "ROUTINE", scheduled_index: 0 }
              as: PermitClerk
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { establishment_id: "${e1}", inspector_id: "${i1}", inspection_type: "REINSPECTION", scheduled_index: 1, reinspection_of_id: "${insp1}" }
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REINSPECTION_TARGET"

      - name: val_hearing_in_past_rejected
        claim_type: Temporal validation
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_HEARING_IN_PAST]"
        distinguishing_aspect: "Scheduling a hearing with hearing_index below the current clock index -> ERR_HEARING_IN_PAST (409)."
        test_recipe:
          setup: ["Establishment e1 PERMITTED; OPENED case; clock at 300."]
          setup_api_calls:
            - call: "POST /_clock/set_current_index"
              payload: { to_index: 300 }
              as: HealthDirector
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
            - call: "POST /plan-reviews/${pr1}/approve"
              payload: {}
              as: PermitClerk
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
            - call: "POST /enforcement-cases"
              payload: { establishment_id: "${e1}", alleged_penalty_cents: 10000 }
              as: EnforcementOfficer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /enforcement-cases/${c1}/schedule-hearing"
              payload: { hearing_index: 250 }
              as: EnforcementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_HEARING_IN_PAST"

      - name: val_permit_requires_approved_plan_review
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_PLAN_REVIEW_NOT_APPROVED]"
          - "state_machines.Establishment.PRELICENSE_to_PERMITTED"
        distinguishing_aspect: "Issuing a permit against a SUBMITTED (not APPROVED) plan review -> ERR_PLAN_REVIEW_NOT_APPROVED (409); establishment stays PRELICENSE."
        test_recipe:
          setup: ["Establishment e1 PRELICENSE with a SUBMITTED (un-approved) plan review."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /permits"
              payload: { establishment_id: "${e1}", plan_review_id: "${pr1}" }
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PLAN_REVIEW_NOT_APPROVED"
            - "Establishment.${e1}.status == PRELICENSE"

      - name: val_reject_requires_rejection_reason
        claim_type: Violation → Error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_MISSING_REJECTION_REASON]"
          - "state_machines.PlanReview.SUBMITTED_to_REJECTED"
        distinguishing_aspect: "Rejecting a plan review with an empty rejection_reason -> ERR_MISSING_REJECTION_REASON (400)."
        test_recipe:
          setup: ["Establishment e1 with a SUBMITTED plan review."]
          setup_api_calls:
            - call: "POST /establishments"
              payload: { name: "Diner E1", address: "1 Main St", seating_capacity: 40 }
              as: PermitClerk
              captures: { e1: $.data.id }
            - call: "POST /plan-reviews"
              payload: { establishment_id: "${e1}", submitted_layout_sqft: 400, equipment_count: 5 }
              as: PermitClerk
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /plan-reviews/${pr1}/reject"
              payload: { rejection_reason: "" }
              as: PermitClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_MISSING_REJECTION_REASON"
            - "PlanReview.${pr1}.status == SUBMITTED"

