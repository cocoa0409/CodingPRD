endpoints:
  # --- PlatformAdmin: suppliers, properties, rate windows, zones, clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any call the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["Re-evaluate PENDING OpaqueBid EXPIRED transitions against the new clock"]

  - method: POST
    path: "/opaque/suppliers"
    description: "Register a supplier"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, opaque_commission_pct, concealment_discount_min_pct, "parity_protection_enabled?"]
    output: Supplier
    side_effects: []

  - method: GET
    path: "/opaque/suppliers"
    description: "List suppliers"
    roles: [PlatformAdmin, FinanceOps, CustomerService]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Supplier[]"
    side_effects: []

  - method: GET
    path: "/opaque/suppliers/{supplierId}"
    description: "Get a supplier"
