            - "error_id == ERR_FORBIDDEN (403)"
            - "Order.${rb2_o}.build_status == DRAFT"

      - name: factory_ops_cannot_lock_program
        claim_type: role_denial
        grounds: ['roles[FactoryOps]', 'roles[AccountManager]', 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "Program lock is AccountManager-exclusive; FactoryOps is denied even on a valid program."
        test_recipe:
          setup: ["account with an OPEN program"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "RB3", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { rb3_a: $.data.id } }
            - { call: "POST /api/accounts/${rb3_a}/programs", payload: { name: "P-RB3", asset_tag_prefix: "FE", custom_image_ref: "img-std" }, as: AccountManager, captures: { rb3_p: $.data.id } }
          trigger:
            - { call: "POST /api/programs/${rb3_p}/lock", payload: {}, as: FactoryOps, captures: { rb3_err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"
            - "AccountProgram.${rb3_p}.status == OPEN"

      - name: customer_cannot_access_other_accounts_order
        claim_type: role_denial
        grounds: ['roles[CustomerUser]', 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "entity_backed ownership: X-User-ID of account B reading account A's order is forbidden — tenant isolation via the identity mapping."
        test_recipe:
          setup: ["two accounts A and B; A has an order"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "RB4A", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { rb4_a: $.data.id } }
            - { call: "POST /api/accounts", payload: { company_name: "RB4B", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { rb4_b: $.data.id } }
            - { call: "POST /api/orders", payload: { account_id: "${rb4_a}", po_number: "PO-RB4" }, as: CustomerUser, as_user_id: "${rb4_a}", captures: { rb4_o: $.data.id } }
          trigger:
            - { call: "GET /api/orders/${rb4_o}", payload: {}, as: CustomerUser, as_user_id: "${rb4_b}", captures: { rb4_err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: order_submit_stale_configuration_version_occ
        claim_type: occ_stale_version
        grounds: ['concurrency_rules[order-submit-stale-configuration]', 'errors[ERR_STALE_CONFIGURATION_VERSION]']
        distinguishing_aspect: "Client submits with the configuration version observed at validation (v); an intervening submit of another order bumped the configuration to v+1, so the second submit carrying the old expected version is rejected with 412."
        test_recipe:
          setup: ["account; chassis; component; rule; one VALIDATED configuration CF (version captured after validate); order O-A submitted (bumps CF version); order O-B with a line on CF still holding the pre-submit version"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "XL1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { xl1_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "XLL1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { xl1_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "XLC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { xl1_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${xl1_l}", component_id: "${xl1_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${xl1_a}"
                chassis_model_id: "${xl1_l}"
                component_selections: [{ component_id: "${xl1_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${xl1_a}"
              captures: { xl1_cf: $.data.id }
            - { call: "POST /api/configurations/${xl1_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${xl1_a}", captures: { xl1_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${xl1_a}", po_number: "PO-XL1A" }, as: CustomerUser, as_user_id: "${xl1_a}", captures: { xl1_oa: $.data.id } }
            - { call: "POST /api/orders/${xl1_oa}/lines", payload: { configuration_id: "${xl1_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${xl1_a}" }
            - { call: "POST /api/orders/${xl1_oa}/submit", payload: { expected_configuration_version: "${xl1_cv}" }, as: CustomerUser, as_user_id: "${xl1_a}" }
            - { call: "POST /api/orders", payload: { account_id: "${xl1_a}", po_number: "PO-XL1B" }, as: CustomerUser, as_user_id: "${xl1_a}", captures: { xl1_ob: $.data.id } }
            - { call: "POST /api/orders/${xl1_ob}/lines", payload: { configuration_id: "${xl1_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${xl1_a}" }
          trigger:
            - { call: "POST /api/orders/${xl1_ob}/submit", payload: { expected_configuration_version: "${xl1_cv}" }, as: CustomerUser, as_user_id: "${xl1_a}", captures: { xl1_err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_CONFIGURATION_VERSION (412)   # CF version advanced when O-A submitted"
            - "Order.${xl1_ob}.build_status == DRAFT"

      - name: restock_stale_component_version_occ
        claim_type: occ_stale_version
        grounds: ['concurrency_rules[component-restock-stale-version]', 'errors[ERR_STALE_COMPONENT_VERSION]']
        distinguishing_aspect: "A restock carrying the component version observed before an allocation cycle is rejected with 412; a restock carrying the fresh version succeeds and increments the version again."
        test_recipe:
          setup: ["account; chassis; component stock 10 version captured at creation (v=1); config validated; order submitted and allocated (allocation bumped component version to 2); client restocks carrying the stale captured version 1"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "XL2", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { xl2_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "XLL2", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { xl2_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "XLC2", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { xl2_c: $.data.id, xl2_cver: $.data.version } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${xl2_l}", component_id: "${xl2_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${xl2_a}"
                chassis_model_id: "${xl2_l}"
                component_selections: [{ component_id: "${xl2_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${xl2_a}"
              captures: { xl2_cf: $.data.id }
            - { call: "POST /api/configurations/${xl2_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${xl2_a}", captures: { xl2_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${xl2_a}", po_number: "PO-XL2" }, as: CustomerUser, as_user_id: "${xl2_a}", captures: { xl2_o: $.data.id } }
            - { call: "POST /api/orders/${xl2_o}/lines", payload: { configuration_id: "${xl2_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${xl2_a}" }
            - { call: "POST /api/orders/${xl2_o}/submit", payload: { expected_configuration_version: "${xl2_cv}" }, as: CustomerUser, as_user_id: "${xl2_a}" }
            - call: "GET /api/orders/${xl2_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                xl2_j: $.data[0].id
            - { call: "POST /api/build-jobs/${xl2_j}/allocate", payload: {}, as: FactoryOps }
          trigger:
            - { call: "POST /api/components/${xl2_c}/restock", payload: { add_units: 5, expected_component_version: "${xl2_cver}" }, as: FactoryOps, captures: { xl2_err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_COMPONENT_VERSION (412)"
            - "Component.${xl2_c}.stock_on_hand == 10   # unchanged"

      - name: submit_creates_build_job_cascade
        claim_type: cascade_side_effect
        grounds: [state_machines.Order."build DRAFT"_to_"build SUBMITTED", entities.BuildJob.fields.sequence_rank]
        distinguishing_aspect: "One submit creates exactly one BuildJob per OrderLine in QUEUED with a non-null sequence_rank — the cascade fan-out is observable via the reverse GET."
        test_recipe:
          setup: ["account; chassis; component; rule; validated config; order with TWO lines (qty 1 and qty 3)"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "XL3", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { xl3_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "XLL3", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { xl3_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "XLC3", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { xl3_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${xl3_l}", component_id: "${xl3_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${xl3_a}"
                chassis_model_id: "${xl3_l}"
                component_selections: [{ component_id: "${xl3_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${xl3_a}"
              captures: { xl3_cf: $.data.id }
            - { call: "POST /api/configurations/${xl3_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${xl3_a}", captures: { xl3_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${xl3_a}", po_number: "PO-XL3" }, as: CustomerUser, as_user_id: "${xl3_a}", captures: { xl3_o: $.data.id } }
            - { call: "POST /api/orders/${xl3_o}/lines", payload: { configuration_id: "${xl3_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${xl3_a}" }
            - { call: "POST /api/orders/${xl3_o}/lines", payload: { configuration_id: "${xl3_cf}", qty: 3, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${xl3_a}" }
          trigger:
            - { call: "POST /api/orders/${xl3_o}/submit", payload: { expected_configuration_version: "${xl3_cv}" }, as: CustomerUser, as_user_id: "${xl3_a}" }
            - { call: "GET /api/orders/${xl3_o}/build-jobs", payload: {}, as: FactoryOps }
          assert:
            - "exactly 2 BuildJobs exist for Order.${xl3_o}, both QUEUED, with qty 1 and 3"
            - "every job has a non-null integer sequence_rank"

      - name: outstanding_cents_reconciles_after_delivery
        claim_type: derived_field_reconciliation
        grounds: [entities.CustomerAccount.fields.outstanding_cents, state_machines.Order."ship SHIPPED"_to_"ship DELIVERED"]
        distinguishing_aspect: "outstanding_cents rises at submit (120000), holds through build and ship, and settles to 0 only on final delivery — the derived field tracks the full lifecycle, not just creation."
        test_recipe:
          setup: ["fully built order; wave released and shipped; clock inside window"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "XL4", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { xl4_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "XLL4", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { xl4_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "XLC4", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 10, revision: "A01" }, as: PlatformAdmin, captures: { xl4_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${xl4_l}", component_id: "${xl4_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${xl4_a}"
                chassis_model_id: "${xl4_l}"
                component_selections: [{ component_id: "${xl4_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${xl4_a}"
              captures: { xl4_cf: $.data.id }
            - { call: "POST /api/configurations/${xl4_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${xl4_a}", captures: { xl4_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${xl4_a}", po_number: "PO-XL4" }, as: CustomerUser, as_user_id: "${xl4_a}", captures: { xl4_o: $.data.id } }
            - { call: "POST /api/orders/${xl4_o}/lines", payload: { configuration_id: "${xl4_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${xl4_a}", captures: { xl4_ol: $.data.id } }
            - { call: "POST /api/orders/${xl4_o}/submit", payload: { expected_configuration_version: "${xl4_cv}" }, as: CustomerUser, as_user_id: "${xl4_a}" }
            - call: "GET /api/orders/${xl4_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                xl4_j: $.data[0].id
            - { call: "POST /api/build-jobs/${xl4_j}/allocate", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${xl4_j}/start", payload: {}, as: FactoryOps }
            - { call: "POST /api/build-jobs/${xl4_j}/complete", payload: {}, as: FactoryOps }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/orders/${xl4_o}/deployment-waves"
              payload:
                wave_label: "W1"
                ship_window_start: "2026-09-02T00:00:00Z"
                ship_window_end: "2026-09-20T00:00:00Z"
                destinations: [{ employee_ref: "HQ", address: "1 Main St", units: 1 }]
              as: AccountManager
              captures: { xl4_w: $.data.id }
            - { call: "POST /api/deployment-waves/${xl4_w}/release", payload: {}, as: AccountManager }
            - { call: "POST /api/deployment-waves/${xl4_w}/ship", payload: {}, as: FactoryOps }
          trigger:
            - { call: "POST /api/deployment-waves/${xl4_w}/receive", payload: {}, as: CustomerUser, as_user_id: "${xl4_a}" }
          assert:
            - "before receive: CustomerAccount.${xl4_a}.outstanding_cents == 120000"
            - "after receive: CustomerAccount.${xl4_a}.outstanding_cents == 0"
            - "Order.${xl4_o}.ship_status == DELIVERED and asset under OrderLine.${xl4_ol} is DELIVERED"

  # ===========================================================================
  # Section 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: allocation_effects_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Component.fields.available_units]
        distinguishing_aspect: "Immediate consistency: the allocate response's BuildJob is ALLOCATED, and a follow-up GET on the component (same test, no waiting) already shows reserved_units applied — no eventual lag."
        test_recipe:
          setup: ["order submitted; job QUEUED; component stock 4, reserved 0"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "CM1", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { cm1_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "CML1", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { cm1_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "CMC1", kind: "CPU", price_cents: 20000, lead_time_days: 3, stock_on_hand: 4, revision: "A01" }, as: PlatformAdmin, captures: { cm1_c: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${cm1_l}", component_id: "${cm1_c}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${cm1_a}"
                chassis_model_id: "${cm1_l}"
                component_selections: [{ component_id: "${cm1_c}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${cm1_a}"
              captures: { cm1_cf: $.data.id }
            - { call: "POST /api/configurations/${cm1_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${cm1_a}", captures: { cm1_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${cm1_a}", po_number: "PO-CM1" }, as: CustomerUser, as_user_id: "${cm1_a}", captures: { cm1_o: $.data.id } }
            - { call: "POST /api/orders/${cm1_o}/lines", payload: { configuration_id: "${cm1_cf}", qty: 3, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${cm1_a}" }
            - { call: "POST /api/orders/${cm1_o}/submit", payload: { expected_configuration_version: "${cm1_cv}" }, as: CustomerUser, as_user_id: "${cm1_a}" }
            - call: "GET /api/orders/${cm1_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                cm1_j: $.data[0].id
          trigger:
            - { call: "POST /api/build-jobs/${cm1_j}/allocate", payload: {}, as: FactoryOps }
            - { call: "GET /api/components/${cm1_c}", payload: {}, as: FactoryOps, captures: { cm1_avail: $.data.available_units, cm1_res: $.data.reserved_units } }
          assert:
            - "Component.${cm1_c}.reserved_units == 3 and available_units == 1 immediately after allocate"
            - "BuildJob.${cm1_j}.status == ALLOCATED"
