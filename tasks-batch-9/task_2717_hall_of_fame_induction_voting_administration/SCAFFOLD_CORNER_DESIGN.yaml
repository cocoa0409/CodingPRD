      - name: vote_submission_response_carries_the_post_write_ballot_version
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /vote-submissions]
          - entities.VoteSubmission.fields.ballot_version_after
          - entities.Ballot.fields.ballots_cast
        distinguishing_aspect: |
          A confidential submission is the one write whose parent the caller may not always re-read in
          time to chain the next call, so the response carries ballot_version_after: the value in the
          201 body must equal the ballot's version as a separate read reports it in the same sequence,
          and ballots_cast must already include this submission. Nothing about this write is deferred.
