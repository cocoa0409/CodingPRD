              as: PlatformAdmin
              captures: { mv_id: $.data.id }
          trigger:
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:00:00Z", requests: 0, input_tokens: 25000, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { ur_id: $.data.id }
            - call: "GET /organizations/${org_id}/rate-limit-windows"
              payload: { model_version_id: "${mv_id}" }
              as: PlatformAdmin
          assert:
            - "usage record with requests == 0 is admitted (201 Created), proving zero quantity is within the >= 0 boundary"
            - "RateLimitWindow created implicitly with requests_used == 0 and tokens_used == 25000 (zero request slots consumed, token slots consumed)"
            - "a follow-up record of 50 requests and 25000 tokens fits exactly at the cap: requests_used == 50 (boundary == cap, not over)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥ 2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: model_activation_requires_safety_pass
        grounds:
          - state_machines.ModelVersion.GATED_to_ACTIVE
          - state_machines.SafetyEvaluation.OPEN_to_PASSED
          - calculations.safety_gate_threshold
        distinguishing_aspect: |
          Entity pair: ModelVersion <-> SafetyEvaluation. ModelVersion's
          GATED -> ACTIVE transition is gated on a separate entity
          (SafetyEvaluation) reaching PASSED with score >= threshold. With
          capability_class FRONTIER (threshold 0.90), a verdict of 0.89 fails
          and the model returns to DRAFT; a verdict of exactly 0.90 (inclusive
          boundary) on a fresh evaluation passes and releases the model.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Model created (DRAFT). First FRONTIER evaluation opened, failed at 0.89; model back in DRAFT; second FRONTIER evaluation opened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-opus", version_tag: "5-1", pricing: { input_per_mtok_cents: 1500, output_per_mtok_cents: 7500, cached_per_mtok_cents: 150 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /model-versions/${mv_id}/safety-evaluations"
              payload: { capability_class: "FRONTIER" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { eval1_id: $.data.id }
            - call: "POST /safety-evaluations/${eval1_id}/submit-verdict"
              payload: { score: 0.89 }
              as: TrustLead
              as_user_id: "lead-1"
              captures: { eval1_status: $.data.status }
            - call: "POST /model-versions/${mv_id}/safety-evaluations"
              payload: { capability_class: "FRONTIER" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { eval2_id: $.data.id }
          trigger:
            - call: "POST /safety-evaluations/${eval2_id}/submit-verdict"
              payload: { score: 0.90 }
              as: TrustLead
              as_user_id: "lead-1"
              captures: { eval2_status: $.data.status }
            - call: "GET /model-versions/${mv_id}"
              payload: {}
              as: PlatformAdmin
              captures: { mv_status: $.data.status }
          assert:
            - "eval1 (score 0.89 < 0.90): SafetyEvaluation.${eval1_id}.status == FAILED; ModelVersion returned to DRAFT and never reached ACTIVE without a passing evaluation"
            - "eval2 (score exactly 0.90, inclusive boundary): SafetyEvaluation.${eval2_id}.status == PASSED"
            - "ModelVersion.${mv_id}.status == ACTIVE — the cross-entity transition fired only because the sibling SafetyEvaluation reached PASSED"

      - name: countersign_requires_organization_active
        grounds:
          - state_machines.EnterpriseAgreement.DRAFT_to_ACTIVE
          - state_machines.Organization.PROVISIONAL_to_ACTIVE
        distinguishing_aspect: |
          Entity pair: EnterpriseAgreement <-> Organization. The agreement's
          DRAFT -> ACTIVE transition requires the counterparty Organization to
          be in status ACTIVE. Countersigning while the organization is still
          PROVISIONAL is rejected; after the organization activates (itself
          requiring a settled payment), the same countersign succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization PROVISIONAL with one settled payment but not yet activated. DRAFT enterprise agreement exists for the organization."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Gated Countersign Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /enterprise-agreements"
              payload: { organization_id: "${org_id}", committed_tpm: 5000, dedicated_capacity_pct: 10, effective_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ea_id: $.data.id }
          trigger:
            - call: "POST /enterprise-agreements/${ea_id}/countersign"
              payload: {}
              as: PlatformAdmin
              captures: { err_state: $.data.error_id }
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /enterprise-agreements/${ea_id}/countersign"
              payload: {}
              as: PlatformAdmin
              captures: { ea_status: $.data.status }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: PlatformAdmin
              captures: { org_tier: $.data.tier }
          assert:
            - "countersign while Organization is PROVISIONAL returns http 409 and error_id == ERR_INVALID_STATE (cross-entity precondition unmet)"
            - "after POST /organizations/{id}/activate, the same countersign succeeds: EnterpriseAgreement.${ea_id}.status == ACTIVE"
            - "Organization.${org_id}.tier == ENTERPRISE (cascade from the now-ACTIVE agreement)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: invoice_period_closed_open_overlap
        grounds:
          - validations.priority_10_business_constraint
          - entities.Invoice.fields.period_start
          - entities.Invoice.fields.period_end
        distinguishing_aspect: |
          Interval semantics = closed-open [start, end) on Invoice periods for
          a single organization. Adjacent periods ([A,B) and [B,C)) are
          permitted (gap=0 is not overlap); periods sharing any interior point
          conflict.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE with one existing DRAFT invoice over [2026-09-01, 2026-09-15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Overlap Test Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /invoices"
              payload: { organization_id: "${org_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-15T00:00:00Z" }
              as: BillingContact
              captures: { inv1: $.data.id }
          trigger:
            - call: "POST /invoices"
              payload: { organization_id: "${org_id}", period_start: "2026-09-15T00:00:00Z", period_end: "2026-09-30T00:00:00Z" }
              as: BillingContact
              captures: { inv2: $.data.id }
            - call: "POST /invoices"
              payload: { organization_id: "${org_id}", period_start: "2026-09-14T23:59:59Z", period_end: "2026-09-16T00:00:00Z" }
              as: BillingContact
              captures: { err: $.data.error_id }
          assert:
            - "second invoice [09-15, 09-30) succeeds — closed-open adjacency at 09-15 is NOT overlap"
            - "third invoice [09-14T23:59:59, 09-16) returns http 409 and error_id == ERR_PERIOD_OVERLAP — interior point shared with the first invoice"

      - name: rate_limit_window_half_open_minute
        grounds:
          - entities.RateLimitWindow.fields.window_start
          - calculations.rate_limit_for_window
          - endpoints.POST_/usage-records
        distinguishing_aspect: |
          Interval semantics = half-open minute window [window_start,
          window_start + 60s) on RateLimitWindow. A usage record in the
          00:01 minute window belongs to a NEW window, not the 00:00 window;
          distinct from the invoice semantics because the granularity is
          minute-aligned and the window resource is created implicitly.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE TIER_1 (rpm 50). Model created. The 00:00 window already has requests_used == 50 and the burst pool of 100 fully consumed (total 150 admitted)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Window Edge Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:00:00Z", requests: 50, input_tokens: 1, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:00:00Z", requests: 100, input_tokens: 1, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:00:00Z", requests: 1, input_tokens: 1, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { err_limited: $.data.error_id }
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:01:00Z", requests: 1, input_tokens: 1, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { admitted_next: $.data.id }
            - call: "GET /organizations/${org_id}/rate-limit-windows"
              payload: { model_version_id: "${mv_id}" }
              as: PlatformAdmin
          assert:
            - "151st request into the 00:00 window returns http 429 ERR_RATE_LIMITED (base 50 + burst 100 exhausted)"
            - "request into the 00:01 window succeeds — half-open semantics: 00:01 opens a NEW window with fresh counters"
            - "the 00:00 window reports requests_used == 150; the 00:01 window reports requests_used == 1"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥ 2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: credit_balance_topup_then_invoice_debit
        grounds:
          - entities.Organization.fields.credit_balance_cents
          - state_machines.PaymentEvent.PENDING_to_SETTLED
          - state_machines.Invoice.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Conserved quantity = Organization.credit_balance_cents. Forward
          action: PREPAID_TOPUP settlement of N cents increments the balance
          by N. Compensating action: invoice finalize debits the balance by
          min(total_cents, balance). After a topup of 1_000_000 and an invoice
          finalize with total 1000, balance_new == balance_old + 1_000_000 -
          1000 — the paired actions conserve the quantity exactly.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE with credit_balance_cents == 1_000_000 (one settled topup). Model created with pricing {input: 300, output: 1500, cached: 30}. DRAFT invoice with one INPUT_TOKENS line of quantity 3_333_334 at 300 cents/MTok."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Credit Invariant Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p_topup: $.data.id }
            - call: "POST /payment-events/${p_topup}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /invoices"
              payload:
                organization_id: "${org_id}"
                period_start: "2026-09-01T00:00:00Z"
                period_end: "2026-09-02T00:00:00Z"
                lines:
                  - { model_version_id: "${mv_id}", kind: "INPUT_TOKENS", quantity: 3333334, rate_per_mtok_cents: 300 }
              as: BillingContact
              captures: { inv_id: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: BillingContact
              captures: { balance_before: $.data.credit_balance_cents }
            - call: "POST /invoices/${inv_id}/finalize"
              payload: {}
              as: BillingContact
              captures: { inv_total: $.data.total_cents }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: BillingContact
              captures: { balance_after: $.data.credit_balance_cents }
          assert:
            - "balance_before == 1000000"
            - "invoice total_cents == 1000 (line amount = round_half_up(3333334 * 300 / 1000000) = round_half_up(1000.0002) = 1000; no batch lines so discount is 0)"
            - "balance_after == 999000 (1000000 - 1000): forward+compensating actions conserve balance_new = balance_old + topup - invoice_total exactly"

      - name: queued_request_admission_then_drop_conserves_capacity
        grounds:
          - entities.RateLimitWindow.fields.requests_used
          - state_machines.QueuedRequest.QUEUED_to_ADMITTED
          - state_machines.QueuedRequest.QUEUED_to_DROPPED
        distinguishing_aspect: |
          Conserved quantity = total requests admitted into a RateLimitWindow
          across its lifetime. Forward action: clock-driven dequeue admits the
          head-of-line item (increments requests_used by its cost). Compensating
          action: a DROPPED queued item never contributes to requests_used.
          Invariant: requests_used == direct admissions + admitted-from-queue;
          DROPPED items leave the counter unchanged.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE TIER_1. Model created. 00:00 window has 40 direct admissions. Two queued requests Q1 (cost 5) and Q2 (cost 5) enqueued. MEDIUM case claimed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Queue Invariant Co" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /payment-events"
              payload: { organization_id: "${org_id}", kind: "PREPAID_TOPUP", amount_cents: 1000000 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /payment-events/${p1}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /organizations/${org_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /model-versions"
              payload: { model_slug: "claude-sonnet", version_tag: "4-5", pricing: { input_per_mtok_cents: 300, output_per_mtok_cents: 1500, cached_per_mtok_cents: 30 } }
              as: PlatformAdmin
              captures: { mv_id: $.data.id }
            - call: "POST /usage-records"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", minute_window_start: "2026-09-01T00:00:00Z", requests: 40, input_tokens: 1, output_tokens: 0, cached_tokens: 0 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
            - call: "POST /queued-requests"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", requests_cost: 5, tokens_cost: 10 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { q1: $.data.id }
            - call: "POST /queued-requests"
              payload: { organization_id: "${org_id}", model_version_id: "${mv_id}", requests_cost: 5, tokens_cost: 10 }
              as: OrganizationAdmin
              as_user_id: "${org_id}"
              captures: { q2: $.data.id }
            - call: "POST /abuse-cases"
              payload: { organization_id: "${org_id}", source: "MANUAL", severity: "MEDIUM" }
              as: TrustAnalyst
              captures: { case_id: $.data.id }
            - call: "POST /abuse-cases/${case_id}/claim"
              payload: {}
              as: TrustAnalyst
              as_user_id: "analyst-1"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:01:00Z" }
              as: PlatformAdmin
            - call: "GET /organizations/${org_id}/queued-requests"
              payload: { status: "ADMITTED" }
              as: PlatformAdmin
            - call: "POST /abuse-cases/${case_id}/actions"
              payload: { action_type: "RESTRICT", expected_abuse_case_version: "${case_v}" }
              as: TrustAnalyst
              as_user_id: "analyst-1"
            - call: "GET /organizations/${org_id}/queued-requests"
              payload: { status: "DROPPED" }
              as: PlatformAdmin
            - call: "GET /organizations/${org_id}/rate-limit-windows"
              payload: { model_version_id: "${mv_id}" }
              as: PlatformAdmin
          assert:
            - "QueuedRequest.${q1}.status == ADMITTED after the clock crossed the 00:01 boundary — head-of-line dequeued into the fresh 00:01 window (forward action, +5 requests in the 00:01 window)"
            - "QueuedRequest.${q2}.status == DROPPED after the RESTRICT cascade (compensating action) and contributed 0 anywhere"
            - "00:00 window requests_used == 40 (untouched by queue activity); 00:01 window requests_used == 5 — the invariant holds: DROPPED items do not change any counter"
