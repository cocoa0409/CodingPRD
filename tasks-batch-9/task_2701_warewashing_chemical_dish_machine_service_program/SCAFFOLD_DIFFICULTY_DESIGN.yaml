              captures: { rev_b: $.data.id, rev_b_start: $.data.period_start }
            - call: "POST /warewashing/usage-variance-reviews"
              payload: { site_id: "${site_id}", product_id: "${det_id}", period_start: "2026-08-31T23:59:59Z", period_end: "2026-09-30T00:00:00Z", basis: "NAMEPLATE", opening_inventory_ml: 5000, ending_inventory_ml: 5000 }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "${twin_status} == DRAFT and creating it did not fail - two DRAFT reviews may cover the identical window, which is how the two bases are compared"
            - "${rev_a_status} == PUBLISHED - publication is what claims the August window"
            - "${rev_b_start} == 2026-09-01T00:00:00Z and review B was created with HTTP 201 - the shared instant belongs only to B because A's window is half-open and no buffer is applied"
            - "${err_overlap} == ERR_REVIEW_PERIOD_OVERLAP with HTTP 409 - a single second of intersection is enough"
            - "only two reviews exist besides the DRAFT twin: ${rev_a} (PUBLISHED) and ${rev_b} (DRAFT); the rejected third window created no row"
            - "publishing ${rev_draft_twin} would now also fail with ERR_REVIEW_PERIOD_OVERLAP, because the same check re-runs at publish time against the PUBLISHED review A"

  - rule_id: compensating_invariant
    instances:
      - name: equipment_value_ledger_returns_to_zero_after_cancel_and_retrieval
        grounds:
          - entities.Customer.fields.equipment_on_placement_value_cents
          - state_machines.MachinePlacement.placement_status.PENDING_INSTALL_to_CANCELLED
          - state_machines.MachinePlacement.placement_status.RETRIEVAL_SCHEDULED_to_RETRIEVED
          - entities.ServiceAgreement.fields.placement_count
        distinguishing_aspect: |
          The conserved quantity is MONEY - Customer.equipment_on_placement_value_cents, a cents-valued
          ledger of equipment currently on customer premises - and the invariant is that it always
          equals the summed equipment_value_cents of that customer's placements in
          {PENDING_INSTALL, INSTALLED, RETRIEVAL_SCHEDULED}. Two DIFFERENT compensations restore it: the
          never-installed placement is credited back by cancellation, and the installed one by retrieval
          completion. Both paths must land on exactly 0 with no residue, and the intermediate peak of
          960000 proves the debits were really applied rather than skipped.
        test_recipe:
          setup:
            - "Logical clock stays at its 2026-08-01T00:00:00Z default."
            - "One customer with no placements: equipment_on_placement_value_cents starts at 0."
            - "One ACTIVE agreement and one DT-88 model whose equipment_value_cents is 480000."
            - "No ticket is ever filed, so retrieval completion is never blocked."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Marigold Senior Living", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id, ledger_0: $.data.equipment_on_placement_value_cents }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Marigold Dining Room", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-2701-Q", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v1: $.data.version }
            - call: "POST /warewashing/technicians"
              payload: { name: "Gus Larkin", region_code: "NW", certification_level: "L2", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
          trigger:
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-D01", expected_agreement_version: "${agr_v1}" }
              as: AccountManager
              captures: { pl_1: $.data.id }
            - call: "GET /warewashing/service-agreements/${agr_id}"
              payload: {}
              as: AccountManager
              captures: { agr_v2: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-D02", expected_agreement_version: "${agr_v2}" }
              as: AccountManager
              captures: { pl_2: $.data.id }
            - call: "GET /warewashing/customers/${cust_id}"
              payload: {}
              as: AccountManager
              captures: { ledger_peak: $.data.equipment_on_placement_value_cents }
            - call: "POST /warewashing/machine-placements/${pl_2}/retrieval-order"
              payload: {}
              as: AccountManager
              captures: { pl_2_state: $.data.placement_status, pl_2_op: $.data.operational_status }
            - call: "GET /warewashing/customers/${cust_id}"
              payload: {}
              as: AccountManager
              captures: { ledger_after_cancel: $.data.equipment_on_placement_value_cents }
            - call: "POST /warewashing/machine-placements/${pl_1}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "GET /warewashing/customers/${cust_id}"
              payload: {}
              as: AccountManager
              captures: { ledger_after_install: $.data.equipment_on_placement_value_cents }
            - call: "POST /warewashing/machine-placements/${pl_1}/retrieval-order"
              payload: { retrieval_due_date: "2026-09-15" }
              as: AccountManager
            - call: "GET /warewashing/customers/${cust_id}"
              payload: {}
              as: AccountManager
              captures: { ledger_after_order: $.data.equipment_on_placement_value_cents }
            - call: "POST /warewashing/machine-placements/${pl_1}/retrieval-completion"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { pl_1_state: $.data.placement_status }
            - call: "GET /warewashing/customers/${cust_id}"
              payload: {}
              as: AccountManager
              captures: { ledger_final: $.data.equipment_on_placement_value_cents, agreements_final: $.data.active_agreement_count }
          assert:
            - "${ledger_0} == 0 and ${ledger_peak} == 960000 - both PENDING_INSTALL placements are debited at creation, before any installation"
            - "${pl_2_state} == CANCELLED and ${pl_2_op} == OFFLINE - a retrieval order on a never-installed placement cancels it"
            - "${ledger_after_cancel} == 480000 - the cancellation credited back exactly 480000, not a partial or doubled amount"
            - "${ledger_after_install} == 480000 and ${ledger_after_order} == 480000 - installing and scheduling retrieval move no money; only creation and removal do"
            - "${pl_1_state} == RETRIEVED and ${ledger_final} == 0 - the ledger is back to its pre-placement value with zero residue"
            - "ServiceAgreement.${agr_id}.placement_count == 0 while ${agreements_final} == 1 - the agreement itself is still ACTIVE, so the compensation is scoped to the equipment ledger"
            - "the invariant holds at every observation: equipment_on_placement_value_cents equals the summed equipment_value_cents of this customer's placements in {PENDING_INSTALL, INSTALLED, RETRIEVAL_SCHEDULED}"

      - name: technician_workload_slots_restored_by_visit_rejection
        grounds:
          - state_machines.ServiceVisit.visit_status.SUBMITTED_to_REJECTED
          - state_machines.ServiceTicket.status.PENDING_VERIFICATION_to_QUEUED
          - entities.Technician.fields.open_ticket_count
          - entities.Technician.fields.quality_flag_count
        distinguishing_aspect: |
          A different KIND of conserved quantity: an integer capacity counter (workload slots), not
          money. The invariant is that the sum of Technician.open_ticket_count over all technicians
          always equals the number of tickets in {DISPATCHED, ON_SITE, PENDING_VERIFICATION}. Rejection
          is the compensating branch: it releases the slot, clears assigned_technician_id and returns
          the ticket to QUEUED while leaving the dose ledger completely untouched (no calibration record
          is applied and the frozen priority_score and response_deadline_at are NOT recomputed), and
          re-dispatching consumes the slot again - so the counter is restored rather than merely
          decremented, and quality_flag_count is the only monotone residue the rejection leaves behind.
        test_recipe:
          setup:
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and is moved to 2026-08-01T10:00:00Z for the arrival."
            - "One INSTALLED placement with a DET-100 dispenser at dose 8.00 (prior_dose null, last_calibrated_at null)."
            - "One AVAILABLE NW technician with open_ticket_count 0 and quality_flag_count 0."
            - "One CUSTOMER_REPORT RACK_QUALITY ticket, dispatched, visited, given one ADJUSTED calibration record (measured 1380 ppm against target 1200: drift +15.00, adjusted dose 9.20) and submitted."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Quarry Lane Brewpub", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
            - call: "POST /warewashing/chemical-products"
              payload: { sku: "DET-100", product_type: "DETERGENT", concentration_target_ppm: 1200, spec_dose_ml_per_rack: 8.00, unit_size_ml: 20000, unit_price_cents: 9600 }
              as: PlatformAdmin
              captures: { det_id: $.data.id }
            - call: "POST /warewashing/machine-models"
              payload: { model_code: "DT-88", machine_class: "DOOR_TYPE", racks_per_hour: 60, rated_water_l_per_rack: 0.74, rated_kwh_per_rack: 0.41, min_final_rinse_temp_f: 180, min_wash_temp_f: 150, min_rinse_pressure_psi: 15, max_rinse_pressure_psi: 25, equipment_value_cents: 480000, max_cycles_between_calibrations: 20000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /warewashing/sites"
              payload: { customer_id: "${cust_id}", name: "Quarry Lane Glass Room", region_code: "NW", operating_window_start_minute_utc: 600, operating_window_end_minute_utc: 1320, baseline_water_l_per_rack: 1.20, baseline_kwh_per_rack: 0.62, water_cost_cents_per_1000l: 480, energy_cost_cents_per_kwh: 14 }
              as: AccountManager
              captures: { site_id: $.data.id }
            - call: "POST /warewashing/service-agreements"
              payload: { customer_id: "${cust_id}", agreement_code: "AGR-2701-R", start_date: "2026-08-01", minimum_term_months: 36, monthly_minimum_spend_cents: 20000, covered_product_ids: ["${det_id}"] }
              as: AccountManager
              captures: { agr_id: $.data.id }
            - call: "POST /warewashing/service-agreements/${agr_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_v: $.data.version }
            - call: "POST /warewashing/machine-placements"
              payload: { site_id: "${site_id}", agreement_id: "${agr_id}", machine_model_id: "${model_id}", asset_tag: "AT-D03", expected_agreement_version: "${agr_v}" }
              as: AccountManager
              captures: { pl_id: $.data.id }
            - call: "POST /warewashing/technicians"
              payload: { name: "Yara Nasser", region_code: "NW", certification_level: "L2", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id, load_0: $.data.open_ticket_count, flags_0: $.data.quality_flag_count }
            - call: "POST /warewashing/machine-placements/${pl_id}/install"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/dispensers"
              payload: { placement_id: "${pl_id}", product_id: "${det_id}", calibrated_dose_ml_per_rack: 8.00 }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { disp_id: $.data.id, disp_v: $.data.version }
            - call: "POST /warewashing/service-tickets"
              payload: { placement_id: "${pl_id}", reported_symptom: "RACK_QUALITY" }
              as: CustomerContact
              as_user_id: "${cust_id}"
              captures: { ticket_id: $.data.id, score_0: $.data.priority_score, deadline_0: $.data.response_deadline_at }
            - call: "POST /warewashing/service-tickets/${ticket_id}/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { assigned_0: $.data.assigned_technician_id }
            - call: "GET /warewashing/technicians/${tech_id}"
              payload: {}
              as: PlatformAdmin
              captures: { load_1: $.data.open_ticket_count }
            - call: "POST /warewashing/service-visits"
              payload: { ticket_id: "${ticket_id}", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T11:00:00Z" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /warewashing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warewashing/service-visits/${visit_id}/arrive"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /warewashing/service-visits/${visit_id}/calibration-records"
              payload: { dispenser_id: "${disp_id}", measured_ppm: 1380, measured_dose_ml_per_rack: 8.00, adjusted_dose_ml_per_rack: 9.20, expected_dispenser_version: "${disp_v}" }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { rec_id: $.data.id, rec_verdict: $.data.calibration_verdict, rec_applied: $.data.applied }
            - call: "POST /warewashing/service-visits/${visit_id}/submit"
              payload: { repair_confirmed: true }
              as: ServiceTechnician
              as_user_id: "${tech_id}"
              captures: { load_2: $.data.version }
          trigger:
            - call: "POST /warewashing/service-visits/${visit_id}/verify"
              payload: { decision: "REJECTED", rejection_reason: "concentration not re-verified after the dose change" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { visit_state: $.data.visit_status, rejected_reason: $.data.rejection_reason }
            - call: "GET /warewashing/technicians/${tech_id}"
              payload: {}
              as: PlatformAdmin
              captures: { load_3: $.data.open_ticket_count, flags_3: $.data.quality_flag_count }
            - call: "POST /warewashing/service-tickets/${ticket_id}/dispatch"
              payload: {}
              as: PlatformAdmin
              captures: { assigned_2: $.data.assigned_technician_id, score_2: $.data.priority_score, deadline_2: $.data.response_deadline_at }
            - call: "GET /warewashing/technicians/${tech_id}"
              payload: {}
              as: PlatformAdmin
              captures: { load_4: $.data.open_ticket_count }
          assert:
            - "${load_0} == 0 and ${flags_0} == 0 and ${assigned_0} == ${tech_id} and ${load_1} == 1 - the slot was consumed at dispatch"
            - "${rec_verdict} == ADJUSTED (drift_pct 15.00) and ${rec_applied} == false at creation"
            - "${visit_state} == REJECTED and ${rejected_reason} is the supplied string and verified_by_user_id == auditor-1"
            - "${load_3} == 0 - the workload slot is restored, not merely frozen, and the sum over all technicians again equals the number of tickets in {DISPATCHED, ON_SITE, PENDING_VERIFICATION}, which is now 0"
            - "${flags_3} == 1 - quality_flag_count is the only residue the rejection leaves behind"
            - "ServiceTicket.${ticket_id}.status == QUEUED with assigned_technician_id == null"
            - "the dose ledger is untouched: Dispenser.${disp_id}.calibrated_dose_ml_per_rack == 8.00, prior_dose_ml_per_rack == null, last_calibrated_at == null, last_drift_pct == null, dose_effective_at still equal to the dispenser's created_at, and CalibrationRecord.${rec_id}.applied == false"
            - "${score_2} == ${score_0} and ${deadline_2} == ${deadline_0} - priority_score and response_deadline_at are stamped once at ticket creation and are never recomputed by re-dispatch"
            - "${load_4} == 1 - re-dispatching consumes the released slot again, closing the conservation loop"
