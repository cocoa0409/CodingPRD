scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: line_pricing_ordered_tier_vs_allocated_charge
        grounds:
          - calculations.line_pricing
          - entities.OrderLine.fields.unit_case_price_cents
          - entities.OrderLine.fields.extended_price_cents
          - state_machines.Order.SUBMITTED_to_SUBMITTED
        distinguishing_aspect: |
          On a single OrderLine the tier price is selected on the ORDERED case-equivalents (5 cases -> tier2 @ 2200)
          while the extended charge multiplies only the ALLOCATED quantity (48 splits = 4 cases) -> 8800, not 11000;
          this is the Order pricing domain, distinct from Rule 1's Return-crediting instance.
        test_recipe:
          setup:
            - "Distributor with clock 2026-06-15T12:00:00Z."
            - "Warehouse WH; Route R (delivery_dow=2 Wed, cutoff_lead_hours=24, min_delivery_gap_days=0)."
            - "Product P splits_per_case=12, split_allowed=true, non-perishable, case_cost 1000."
            - "PriceTiers on P: (min_cases 1, 2400), (min_cases 5, 2200), (min_cases 10, 2000)."
            - "Only 48 splits of P in stock (1 lot, 48 on_hand) so a 5-case order shorts to 4 cases."
            - "Customer C credit_limit 100000, split_fee 0, ar_balance 0, route R."
            - "Order O for C, delivery 2026-06-17; one line CASE qty 5 of P; submitted; credit-approved."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 5, case_price_cents: 2200 }
              as: DistributorAdmin
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 10, case_price_cents: 2000 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 48 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 5 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
              captures: { order_total: $.data.order_total_cents }
          assert:
            - "OrderLine.${line}.unit_case_price_cents == 2200"
            - "OrderLine.${line}.allocated_splits == 48"
            - "OrderLine.${line}.short_splits == 12"
            - "OrderLine.${line}.extended_price_cents == 8800"
            - "Order.${order}.order_total_cents == 8800"

      - name: return_credit_overage_fee_vs_damage_full
        grounds:
          - calculations.return_credit
          - entities.Return.fields.restock_fee_cents
          - entities.Return.fields.credit_amount_cents
          - state_machines.Return.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          On the Return entity, an OVERAGE return of 4 splits yields credit 680 (15% restock fee on 800),
          whereas a DAMAGED return of the same 4 splits yields the full 800; same quantity, two credit results.
          This is the Return-crediting domain, distinct from Rule 1's Order-pricing instance.
        test_recipe:
          setup:
            - "Distributor clock 2026-06-15T12:00:00Z; Warehouse, Route (dow=2, cutoff 24, gap 0)."
            - "Product P splits_per_case=12, one PriceTier (min_cases 1, 2400); 14 splits in stock."
            - "Customer C credit_limit 100000, split_fee 0."
            - "Order O delivery 2026-06-17, one SPLIT line qty 14 of P -> extended 2800 (1 case 2400 + 2 splits @200)."
            - "Order approved, picked, loaded, POD'd -> DELIVERED; allocated_splits 14."
            - "Two returns are requested against the delivered line: one OVERAGE 4, one DAMAGED 4."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 14 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "SPLIT", ordered_qty: 14 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
            - call: "POST /orders/${order}/start-pick"
              payload: {}
              as: WarehouseOp
            - call: "GET /shipments"
              payload: { order_id: "${order}" }
              as: WarehouseOp
              captures: { ship: $.data.0.id }
            - call: "POST /shipments/${ship}/load"
              payload: {}
              as: WarehouseOp
            - call: "POST /shipments/${ship}/pod"
              payload: { pod_signature: "J. Receiver" }
              as: WarehouseOp
            - call: "POST /returns"
              payload: { customer_id: "${cust}", order_id: "${order}", order_line_id: "${line}", reason: "OVERAGE", return_splits: 4 }
              as: SalesRep
              captures: { ret_over: $.data.id }
            - call: "POST /returns"
              payload: { customer_id: "${cust}", order_id: "${order}", order_line_id: "${line}", reason: "DAMAGED", return_splits: 4 }
              as: SalesRep
              captures: { ret_dmg: $.data.id }
          trigger:
            - call: "POST /returns/${ret_over}/approve"
              payload: {}
              as: CreditManager
              captures: { over_credit: $.data.credit_amount_cents, over_fee: $.data.restock_fee_cents }
            - call: "POST /returns/${ret_dmg}/approve"
              payload: {}
              as: CreditManager
              captures: { dmg_credit: $.data.credit_amount_cents, dmg_fee: $.data.restock_fee_cents }
          assert:
            - "Return.${ret_over}.restock_fee_cents == 120"
            - "Return.${ret_over}.credit_amount_cents == 680"
            - "Return.${ret_dmg}.restock_fee_cents == 0"
            - "Return.${ret_dmg}.credit_amount_cents == 800"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_pricing_tier_select_with_split_residual_mode_a
        grounds:
          - calculations.line_pricing
          - entities.OrderLine.fields.extended_price_cents
          - entities.PriceTier.fields.case_price_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (ordered_qty, splits_per_case, tier table, allocated_splits) with non-linear
          interaction — floor for full cases, ceil for the per-split residual, and greatest-min_cases tier selection.
          A SPLIT 14 line on splits_per_case 12 @ tier 2400 -> 1*2400 + 2*ceil(2400/12)=2*200 = 2800.
        test_recipe:
          setup:
            - "Distributor clock 2026-06-15T12:00:00Z; Warehouse, Route (dow=2, cutoff 24, gap 0)."
            - "Product P splits_per_case=12, split_allowed=true, one PriceTier (min_cases 1, 2400); 14 splits stocked."
            - "Customer C credit_limit 100000, split_fee 0; Order O delivery 2026-06-17, SPLIT line qty 14."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 14 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "SPLIT", ordered_qty: 14 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
          assert:
            - "OrderLine.${line}.unit_case_price_cents == 2400"
            - "OrderLine.${line}.extended_price_cents == 2800"

      - name: order_totals_round_per_line_then_sum_mode_b
        grounds:
          - calculations.order_totals
          - calculations.line_pricing
          - entities.Order.fields.goods_subtotal_cents
          - entities.Order.fields.split_fee_total_cents
          - entities.Order.fields.order_total_cents
        distinguishing_aspect: |
          Mode (b): rounding-order pinned — each line's split residual is rounded (ceil) at the LINE level,
          then the order sums the already-rounded lines and adds the per-SPLIT-line handling fee. Line1 CASE 5 @ tier2
          = 11000, line2 SPLIT 14 = 2800, plus one split_fee of 50 -> 13850; summing pre-rounded lines, not re-deriving.
        test_recipe:
          setup:
            - "Distributor clock 2026-06-15T12:00:00Z; Warehouse, Route (dow=2, cutoff 24, gap 0)."
            - "Product P splits_per_case=12, split_allowed=true; tiers (1,2400),(5,2200),(10,2000); 74 splits stocked."
            - "Customer C credit_limit 100000, split_fee_cents 50."
            - "Order O delivery 2026-06-17: line1 CASE 5 (60 splits), line2 SPLIT 14 -> 74 total exactly in stock."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 5, case_price_cents: 2200 }
              as: DistributorAdmin
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 10, case_price_cents: 2000 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 74 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 50 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 5 }
              as: SalesRep
              captures: { line1: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "SPLIT", ordered_qty: 14 }
              as: SalesRep
              captures: { line2: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
          assert:
            - "OrderLine.${line1}.extended_price_cents == 11000"
            - "OrderLine.${line2}.extended_price_cents == 2800"
            - "Order.${order}.goods_subtotal_cents == 13800"
            - "Order.${order}.split_fee_total_cents == 50"
            - "Order.${order}.order_total_cents == 13850"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_fulfillment_and_credit_dimensions
        grounds:
          - state_machines.Order.SUBMITTED_to_SUBMITTED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.credit_status
        distinguishing_aspect: |
          The Order carries two independent state axes: approve-credit advances credit_status PENDING->APPROVED
          while fulfillment_status stays SUBMITTED — proving the dimensions evolve independently on one row.
        test_recipe:
          setup:
            - "Distributor clock 2026-06-15T12:00:00Z; Warehouse, Route (dow=2, cutoff 24, gap 0)."
            - "Product P splits_per_case=12, tier (1,2400); 12 splits stocked; Customer C credit_limit 100000."
            - "Order O delivery 2026-06-17, CASE line qty 1; submitted (fulfillment SUBMITTED, credit PENDING)."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 12 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
          assert:
            - "Order.${order}.credit_status == APPROVED"
            - "Order.${order}.fulfillment_status == SUBMITTED"

      - name: return_branching_fork_approve_vs_reject
        grounds:
          - state_machines.Return.REQUESTED_to_APPROVED
          - state_machines.Return.REQUESTED_to_REJECTED
          - entities.Return.fields.status
        distinguishing_aspect: |
          From REQUESTED the Return forks to APPROVED (runs return_credit, computes credit) OR REJECTED (no credit);
          divergent side-effect sets per branch on a different entity than the Order instance.
        test_recipe:
          setup:
            - "A delivered order line (allocated_splits 14, extended 2800) exists for Customer C, line L."
            - "Two returns requested against L: ret_a (DAMAGED 2) to be approved, ret_b (DAMAGED 2) to be rejected."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, split_allowed: true, perishable: false, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 14 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000, split_fee_cents: 0 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "SPLIT", ordered_qty: 14 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
            - call: "POST /orders/${order}/start-pick"
              payload: {}
              as: WarehouseOp
            - call: "GET /shipments"
              payload: { order_id: "${order}" }
              as: WarehouseOp
              captures: { ship: $.data.0.id }
            - call: "POST /shipments/${ship}/load"
              payload: {}
              as: WarehouseOp
            - call: "POST /shipments/${ship}/pod"
              payload: { pod_signature: "J. Receiver" }
              as: WarehouseOp
            - call: "POST /returns"
              payload: { customer_id: "${cust}", order_id: "${order}", order_line_id: "${line}", reason: "DAMAGED", return_splits: 2 }
              as: SalesRep
              captures: { ret_a: $.data.id }
            - call: "POST /returns"
              payload: { customer_id: "${cust}", order_id: "${order}", order_line_id: "${line}", reason: "DAMAGED", return_splits: 2 }
