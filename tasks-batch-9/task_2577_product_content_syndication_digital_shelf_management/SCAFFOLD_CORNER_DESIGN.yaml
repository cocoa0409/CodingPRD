          difficulty_instance: completeness_declared_vs_certified_diverge_on_same_listing
          rationale: "That difficulty instance is exactly the two-variant divergence on a single listing (different source revision, presence-only versus ceiling-and-approval credit) with both stored fields asserted."

      - name: shelf_summary_selects_the_requested_lift_variant
        claim_type: variant_selection
        grounds:
