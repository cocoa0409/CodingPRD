      - name: function_space_hold_45_minute_turnover_buffer
        grounds:
          - validations[priority=25].ERR_FUNCTION_SPACE_CONFLICT
          - entities.FunctionSpaceHold.fields.start_at
          - entities.FunctionSpaceHold.fields.end_at
          - endpoints["POST /group-sales/function-space-holds"]
        distinguishing_aspect: |
          Overlap is computed after extending every existing hold's end_at by TURNOVER_MINUTES (45), so
          a hold on 2026-11-09T09:00Z..12:00Z occupies GRAND_BALLROOM until 12:45Z: a request starting
          at 12:00Z conflicts even though the raw intervals only touch, and a request starting exactly at
          12:45Z succeeds because the buffered interval is half-open. Ignoring the buffer accepts the
          12:00Z request; applying the buffer to the new request's start as well rejects the 12:45Z one.
          The same 12:00Z..13:00Z window on a different space_code (SALON_A) must also succeed.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; InventoryDay rows are irrelevant to holds and are not needed"
            - "one CORPORATE account and one lead (no qualification required to hold space)"
            - "an existing HELD FunctionSpaceHold on GRAND_BALLROOM 2026-11-09T09:00:00Z..2026-11-09T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "op-001"
            - call: "POST /group-sales/accounts"
