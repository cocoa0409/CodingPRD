  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: framing_approve_requires_linked_order_ready
        grounds:
          - state_machines.FramingOrder.QUOTED_to_APPROVED
          - errors[ERR_LINKED_ORDER_NOT_READY]
          - entities.FramingOrder.fields.order_id
        distinguishing_aspect: "FramingOrder->Order pair: FramingOrder QUOTED->APPROVED is blocked unless the linked Order.fulfillment_status is SUBMITTED or READY_FOR_PICKUP; a BUILDING order yields ERR_LINKED_ORDER_NOT_READY."
        test_recipe:
          setup:
            - "FramingOrder F (QUOTED) linked to Order O which is still BUILDING."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c13@x.com", full_name: "C Thirteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { order_id: "${o_id}", customer_id: "${c_id}", width_in: 20, height_in: 20 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /framing-orders/${f_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_LINKED_ORDER_NOT_READY"

      - name: order_pay_requires_loyalty_points_balance
        grounds:
          - state_machines.Order.field.payment_status
          - errors[ERR_INSUFFICIENT_POINTS]
          - entities.LoyaltyAccount.fields.points_balance
        distinguishing_aspect: "Order->LoyaltyAccount pair (distinct from FramingOrder->Order): paying a SUBMITTED order redeeming more points than the customer's LoyaltyAccount.points_balance yields ERR_INSUFFICIENT_POINTS."
        test_recipe:
          setup:
            - "Order O SUBMITTED, payment UNPAID. Customer's LoyaltyAccount.points_balance=0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c14@x.com", full_name: "C Fourteen", home_store_code: "CA01" }
              as: StoreAssociate
              captures: { c_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "UNIT-800", name: "Yarn", sell_mode: "UNIT", unit_price_cents: 800 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
