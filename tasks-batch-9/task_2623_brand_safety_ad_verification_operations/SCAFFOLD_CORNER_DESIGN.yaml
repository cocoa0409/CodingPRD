      - name: publish_gate_only_looks_at_allow_publisher_entries
        claim_type: violation_to_error
        grounds:
          - validations.priority_28
          - errors[ERR_LIST_CONTAINS_RESTRICTED_PUBLISHER]
          - state_machines.InventoryList.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          The publish gate is narrowly scoped: it fires only for an entry that is
          simultaneously action ALLOW, entry_type PUBLISHER and pointed at a
          RESTRICTED or DELISTED publisher. The control list in this fixture
          names the very same delisted publisher by DOMAIN and must publish
          cleanly - an implementation that resolves domains back to publishers,
          or that also blocks BLOCK entries, over-refuses.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; publisher Beacon is DELISTED by the platform. List L1 (INCLUSION) holds a PUBLISHER entry naming Beacon; list L2 (INCLUSION) holds a DOMAIN entry for beacon.example.com; list L3 (EXCLUSION) holds a PUBLISHER entry naming Beacon, which is a BLOCK entry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Beacon Allowlist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /inventory-lists/${l1_id}/entries"
              payload: { entry_type: "PUBLISHER", entry_value: "${pub_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Beacon Domain Allowlist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /inventory-lists/${l2_id}/entries"
              payload: { entry_type: "DOMAIN", entry_value: "beacon.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Beacon Blocklist" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { l3_id: $.data.id }
            - call: "POST /inventory-lists/${l3_id}/entries"
              payload: { entry_type: "PUBLISHER", entry_value: "${pub_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /publishers/${pub_id}/status"
              payload: { new_status: "DELISTED", reason: "Repeated fraud findings" }
              as: PlatformAdmin
          trigger:
            - call: "POST /inventory-lists/${l1_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_restricted: $.data.error_id }
            - call: "POST /inventory-lists/${l2_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { l2_status: $.data.status }
            - call: "POST /inventory-lists/${l3_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { l3_status: $.data.status }
          assert:
            - "Trigger 1: HTTP 409 and ${e_restricted} == ERR_LIST_CONTAINS_RESTRICTED_PUBLISHER; InventoryList.${l1_id}.status is still DRAFT with published_version null and published_at null"
            - "Trigger 2: HTTP 200 and ${l2_status} == PUBLISHED - a DOMAIN entry is out of scope for the gate even though it addresses the same delisted publisher"
            - "Trigger 3: HTTP 200 and ${l3_status} == PUBLISHED - the entry is action BLOCK (EXCLUSION parent), and blocking a delisted publisher is exactly what an advertiser should be able to do"
            - "Publisher.${pub_id}.publisher_status == DELISTED throughout; none of the three publish attempts changed it"

      - name: appeal_target_and_remedy_guards_answer_their_own_errors
        claim_type: violation_to_error
        grounds:
          - validations.priority_19
          - validations.priority_14
          - errors[ERR_CLASSIFICATION_SUPERSEDED]
          - errors[ERR_REVISED_TIER_REQUIRED]
        distinguishing_aspect: |
          Two guards frame the appeal lifecycle. On the way in, an appeal must
          name the page's CURRENTLY EFFECTIVE classification - the superseded
          first record is refused even though the page itself is legally
          HUMAN_CONFIRMED, which is what distinguishes ERR_CLASSIFICATION_SUPERSEDED
          from ERR_INVALID_PAGE_STATE. On the way out, an OVERTURNED remedy must
          be STRICTLY better than the disputed tier (equal is not better, worse
          is absurd) and an UPHELD decision must supply no tier at all: three
          different mistakes, one error id, and one accepted remedy that proves
          the guard is not simply rejecting everything.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z. Page P is classified HUMAN ['GAMBLING'] (base 15 risk points -> MEDIUM_RISK) and CONFIRMED by analyst-2 as cls_1; then P is reclassified with the same inputs as cls_2 and CONFIRMED again, which leaves cls_1 SUPERSEDED and cls_2 both CONFIRMED and current. TIER_RANK order is FLOOR < HIGH_RISK < MEDIUM_RISK < LOW_RISK < SAFE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/odds" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver_0: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver_0}", classifier_kind: "HUMAN", category_codes: ["GAMBLING"], ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_1: $.data.id }
            - call: "POST /page-classifications/${cls_1}/review"
              payload: { decision: "CONFIRM", review_note: "Sportsbook odds page" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
            - call: "GET /pages/${page_id}"
              payload: {}
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { page_ver_1: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver_1}", classifier_kind: "HUMAN", category_codes: ["GAMBLING"], ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_2: $.data.id }
            - call: "POST /page-classifications/${cls_2}/review"
              payload: { decision: "CONFIRM", review_note: "Recrawl agrees with the first read" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
          trigger:
            - call: "POST /appeals"
              payload: { classification_id: "${cls_1}", reason_code: "STALE_CRAWL", evidence_note: "The first crawl predates our sportsbook removal" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { e_superseded: $.data.error_id }
            - call: "POST /appeals"
              payload: { classification_id: "${cls_2}", reason_code: "CATEGORY_MISREAD", evidence_note: "Editorial coverage of odds, no wagering offered" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "OVERTURNED", revised_tier: "MEDIUM_RISK", decision_note: "Same tier as disputed" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_equal: $.data.error_id }
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "OVERTURNED", revised_tier: "HIGH_RISK", decision_note: "Worse tier than disputed" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_worse: $.data.error_id }
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "UPHELD", revised_tier: "SAFE", decision_note: "Upheld but a tier was supplied anyway" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_upheld: $.data.error_id }
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "OVERTURNED", revised_tier: "LOW_RISK", decision_note: "Editorial context accepted" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { final_state: $.data.appeal_state }
          assert:
            - "Setup: PageClassification.${cls_1}.review_state == SUPERSEDED, PageClassification.${cls_2}.review_state == CONFIRMED, Page.${page_id}.current_classification_id == ${cls_2}, current_tier == MEDIUM_RISK and classification_state == HUMAN_CONFIRMED"
            - "Trigger 1: HTTP 409 and ${e_superseded} == ERR_CLASSIFICATION_SUPERSEDED - the page state is legal, only the cited record is stale, so ERR_INVALID_PAGE_STATE is the wrong answer; Page.${page_id}.appeal_count is still 0"
            - "Trigger 2: HTTP 201; Appeal.${appeal_id}.appeal_state == FILED, round_no == 1, and Page.${page_id}.classification_state == APPEALED"
            - "Trigger 3 (equal tier): HTTP 422 and ${e_equal} == ERR_REVISED_TIER_REQUIRED - MEDIUM_RISK is not strictly better than MEDIUM_RISK"
            - "Trigger 4 (worse tier): HTTP 422 and ${e_worse} == ERR_REVISED_TIER_REQUIRED"
            - "Trigger 5 (UPHELD with a tier): HTTP 422 and ${e_upheld} == ERR_REVISED_TIER_REQUIRED - an UPHELD decision must not carry a remedy"
            - "After triggers 3-5: Appeal.${appeal_id}.appeal_state is still FILED, round_no is still 1, decided_by_user_id is null, and Publisher.${pub_id}.decided_appeal_count == 0"
            - "Trigger 6: HTTP 200 and ${final_state} == OVERTURNED with revised_tier LOW_RISK; Page.${page_id}.classification_state == RECLASSIFIED, current_tier == LOW_RISK, PageClassification.${cls_2}.review_state == VACATED, and Publisher.${pub_id}.overturned_appeal_count == 1"

