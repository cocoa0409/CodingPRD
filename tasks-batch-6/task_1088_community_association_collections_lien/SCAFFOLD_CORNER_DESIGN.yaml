# =============================================================================
# task_1088 — §1.9 Scaffold Corner Design (breadth coverage)
# Enumerates testable claims beyond the nine Difficulty Rules. Same seven-point
# per-instance contract as §1.8. excluded_because stubs cite §1.8 instances by
# name. Clock default = 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: account_creation_success
        claim_type: Creation
        grounds:
          - entities.Account
          - endpoints["POST /collections/accounts"]
        distinguishing_aspect: "POST /collections/accounts with all required fields returns 201, status CURRENT, total_balance_cents 0, version 1, and a server-minted UUID id."
        test_recipe:
          setup: ["An Association exists."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Rowan HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
          trigger:
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "100", owner_name: "Pat Kerr" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id, st: $.data.status, bal: $.data.total_balance_cents, ver: $.data.version }
          assert:
            - "response HTTP status == 201"
            - "response data.status == CURRENT"
            - "response data.total_balance_cents == 0"
            - "response data.version == 1"

      - name: account_not_found
        claim_type: Not Found
        grounds:
          - entities.Account
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /collections/accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /collections/accounts/00000000-0000-4000-8000-000000000000"
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: assessment_missing_required_amount_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Assessment.fields.amount_cents
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /collections/assessments without amount_cents returns ERR_VALIDATION (422); no assessment is created."
        test_recipe:
          setup: ["An Account exists."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Teak HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Al Vez" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_VALIDATION"

      - name: assessment_invalid_enum_charge_type
        claim_type: Type Constraints
        grounds:
          - entities.Assessment.fields.charge_type
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "POST /collections/assessments with charge_type outside the declared member set returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["An Account exists."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Yew HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Bo Cox" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "BOGUS", amount_cents: 1000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_INVALID_ENUM"

      - name: assessment_invalid_amount_zero
        claim_type: Type Constraints
        grounds:
          - entities.Assessment.fields.amount_cents
          - validations[priority=13]
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: "POST /collections/assessments with amount_cents 0 returns ERR_INVALID_AMOUNT (422)."
        test_recipe:
          setup: ["An Account exists."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Ash HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Cy Dill" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 0, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_INVALID_AMOUNT"

      - name: account_aging_buckets_computed
        claim_type: Computed Fields
        grounds:
          - entities.Account.fields.aging
          - calculations.aging_buckets
        distinguishing_aspect: "Aging buckets split OPEN assessment balances by whole-day days_overdue at clock 2026-05-01: 5000 current, 10000 in 1-30, 20000 in 31-60, 30000 in 61-90, 40000 in 91+."
        test_recipe:
          setup: ["Account with five REGULAR assessments due 2026-05-15, 2026-04-10, 2026-03-15, 2026-02-20, 2026-01-01 for 5000/10000/20000/30000/40000. Clock 2026-05-01."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Bay HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Di Egan" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 5000, due_date: "2026-05-15T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 10000, due_date: "2026-04-10T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 20000, due_date: "2026-03-15T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 30000, due_date: "2026-02-20T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 40000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { bal: $.data.total_balance_cents }
          assert:
            - "response data.total_balance_cents == 105000"
            - "response data.aging.bucket_current == 5000"
            - "response data.aging.bucket_1_30 == 10000"
            - "response data.aging.bucket_31_60 == 20000"
            - "response data.aging.bucket_61_90 == 30000"
            - "response data.aging.bucket_91_plus == 40000"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: notice_invalid_transition_draft_to_expired
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Notice
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A DRAFT Notice cannot transition directly to EXPIRED (no such edge); returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Account with a DRAFT DEMAND notice."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Fig HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Ed Fry" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "DEMAND" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "EXPIRED" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: payment_reverse_already_reversed_invalid
        claim_type: Idempotency
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reversing an already-REVERSED payment returns ERR_INVALID_STATE (409); the second reverse does not double-debit trust."
        test_recipe:
          setup: ["Account with a POSTED payment 20000 already reversed once."]
          setup_api_calls:
            - call: "POST /collections/associations"
              payload: { name: "Oak2 HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Fi Gow" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 20000, received_date: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { pay_id: $.data.id }
            - call: "POST /collections/payments/${pay_id}/reverse"
              payload: { reversal_reason: "NSF" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/payments/${pay_id}/reverse"
              payload: { reversal_reason: "ADJUSTMENT" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: payment_reversal_reopens_assessment_and_delinquent
        claim_type: Compensation
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - state_machines.Assessment.PAID_to_OPEN
          - state_machines.Account.DELINQUENT_to_CURRENT
        distinguishing_aspect: "Reversal is the compensation of allocation: a fully-paid assessment reverts PAID->OPEN with balance restored, and the account that had gone CURRENT reverts to DELINQUENT."
        test_recipe:
          setup: ["Account DELINQUENT with REGULAR 40000 due 2026-01-01; payment 40000 pays it (Assessment PAID, Account CURRENT). Clock 2026-05-01."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Elm2 HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Gwen Ho" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 40000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { asm_id: $.data.id }
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/payments"
              payload: { account_id: "${acct_id}", amount_cents: 40000, received_date: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /collections/payments/${pay_id}/reverse"
              payload: { reversal_reason: "NSF" }
              as: CollectionsAgent
              captures: { st: $.data.status }
          assert:
            - "trigger response data.status == REVERSED"
            - "GET /collections/assessments/${asm_id} data.status == OPEN"
            - "GET /collections/assessments/${asm_id} data.balance_cents == 40000"
            - "GET /collections/accounts/${acct_id} data.status == DELINQUENT"
            - "GET /collections/accounts/${acct_id} data.total_balance_cents == 40000"

      - name: foreclosure_sale_charges_off_and_waives
        claim_type: Cross-entity
        grounds:
          - state_machines.ForeclosureReferral.FILED_to_SALE_COMPLETED
          - state_machines.Account.FORECLOSURE_to_CHARGED_OFF
          - state_machines.Assessment.OPEN_to_WAIVED
          - state_machines.Lien.FORECLOSING_to_RELEASED
        distinguishing_aspect: "Referral FILED->SALE_COMPLETED cascades: Account FORECLOSURE->CHARGED_OFF, its open Assessments WAIVED, and the FORECLOSING Lien RELEASED."
        test_recipe:
          setup: ["Account at FORECLOSURE: REGULAR 200000 due 2026-01-01, delinquent, INTENT_TO_LIEN sent 2026-01-01, lien recorded 2026-02-01 (officer-1), referral (officer-2) FILED."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Palm HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Hank Ip" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 200000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
              captures: { asm_id: $.data.id }
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { lien_id: $.data.id }
            - call: "POST /collections/foreclosure-referrals"
              payload: { account_id: "${acct_id}", lien_id: "${lien_id}", attorney_name: "Firm A" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { ref_id: $.data.id }
            - call: "POST /collections/foreclosure-referrals/${ref_id}/transition"
              payload: { to_status: "FILED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
          trigger:
            - call: "POST /collections/foreclosure-referrals/${ref_id}/transition"
              payload: { to_status: "SALE_COMPLETED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { st: $.data.status }
          assert:
            - "trigger response data.status == SALE_COMPLETED"
            - "GET /collections/accounts/${acct_id} data.status == CHARGED_OFF"
            - "GET /collections/assessments/${asm_id} data.status == WAIVED"
            - "GET /collections/liens/${lien_id} data.status == RELEASED"

      - name: bankruptcy_dismissal_lifts_stay
        claim_type: Cross-entity
        grounds:
          - state_machines.BankruptcyCase.FILED_to_DISMISSED
          - state_machines.Account.BANKRUPTCY_to_DELINQUENT
          - state_machines.Lien.STAYED_to_RECORDED
        distinguishing_aspect: "Dismissing a bankruptcy lifts the stay: Account BANKRUPTCY->DELINQUENT and the STAYED Lien reverts to RECORDED."
        test_recipe:
          setup: ["Account LIEN (lien RECORDED). Bankruptcy filed (Account BANKRUPTCY, Lien STAYED). Then dismissed."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Cork HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Ida Jib" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 200000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { lien_id: $.data.id }
            - call: "POST /collections/bankruptcy-cases"
              payload: { account_id: "${acct_id}", chapter: "CH7", case_number: "26-1", filed_date: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /collections/bankruptcy-cases/${bk_id}/transition"
              payload: { to_status: "DISMISSED" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { st: $.data.status }
          assert:
            - "trigger response data.status == DISMISSED"
            - "GET /collections/accounts/${acct_id} data.status == DELINQUENT"
            - "GET /collections/liens/${lien_id} data.status == RECORDED"

      - name: plan_complete_requires_full_payment
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing an ACTIVE plan whose amount_paid_cents < total_amount_cents returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Account DELINQUENT (REGULAR 60000 due 2026-01-01). Plan total 60000 active, no payments. Clock 2026-05-01."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Moss HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Jax Kim" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 60000, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "GET /collections/accounts/${acct_id}"
              as: CollectionsAgent
              captures: { acct_v: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { account_id: "${acct_id}", total_amount_cents: 60000, installment_cents: 20000, num_installments: 3, first_due_date: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: CollectionsAgent
              captures: { plan_id: $.data.id }
            - call: "POST /collections/payment-plans/${plan_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/payment-plans/${plan_id}/transition"
              payload: { to_status: "COMPLETED" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: mark_delinquent_not_overdue_returns_not_delinquent
        claim_type: Violation → Error
        grounds:
          - state_machines.Account.CURRENT_to_DELINQUENT
          - errors[ERR_NOT_DELINQUENT]
        distinguishing_aspect: "Marking DELINQUENT when the only assessment is not yet due (positive balance but no overdue OPEN/PARTIAL assessment) returns ERR_NOT_DELINQUENT (409)."
        test_recipe:
          setup: ["Account with REGULAR 10000 due 2026-12-01 (future). Clock 2026-05-01."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Lark HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Kai Lum" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 10000, due_date: "2026-12-01T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_NOT_DELINQUENT"

      - name: lien_minimum_below_threshold_rejected
        claim_type: Priority Ordering
        grounds:
          - validations[priority=12]
          - errors[ERR_LIEN_MINIMUM_NOT_MET]
        distinguishing_aspect: "Complement of the >= boundary: balance 179999 (one cent below LIEN_MINIMUM_BALANCE_CENTS) with all other lien gates satisfied returns ERR_LIEN_MINIMUM_NOT_MET (422)."
        test_recipe:
          setup: ["Account DELINQUENT, REGULAR 179999 due 2026-01-01, INTENT_TO_LIEN sent 2026-01-01, clock 2026-01-31 (elapsed)."]
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/associations"
              payload: { name: "Nook HOA", state_code: "CA" }
              as: CollectionsAgent
              captures: { assoc_id: $.data.id }
            - call: "POST /collections/accounts"
              payload: { association_id: "${assoc_id}", unit_number: "1", owner_name: "Lena Mo" }
              as: CollectionsAgent
              captures: { acct_id: $.data.id }
            - call: "POST /collections/assessments"
              payload: { account_id: "${acct_id}", charge_type: "REGULAR", amount_cents: 179999, due_date: "2026-01-01T00:00:00Z" }
              as: CollectionsAgent
            - call: "POST /collections/accounts/${acct_id}/transition"
              payload: { to_status: "DELINQUENT" }
              as: CollectionsAgent
            - call: "POST /collections/notices"
              payload: { account_id: "${acct_id}", notice_type: "INTENT_TO_LIEN" }
              as: CollectionsAgent
              captures: { notice_id: $.data.id }
            - call: "POST /collections/notices/${notice_id}/transition"
              payload: { to_status: "SENT" }
              as: CollectionsAgent
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: CollectionsAgent
          trigger:
            - call: "POST /collections/liens"
              payload: { account_id: "${acct_id}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 422"
            - "response data.error_id == ERR_LIEN_MINIMUM_NOT_MET"

      - name: validation_period_29_days_active
        claim_type: Temporal validation
        grounds:
          - validations[priority=10]
          - errors[ERR_VALIDATION_PERIOD_ACTIVE]
        distinguishing_aspect: "Temporal boundary complement: at 29 days after the INTENT_TO_LIEN send (< VALIDATION_PERIOD_DAYS 30) with balance above minimum, the lien is refused ERR_VALIDATION_PERIOD_ACTIVE (409)."
        test_recipe:
          setup: ["Account DELINQUENT, REGULAR 200000 due 2026-01-01, INTENT_TO_LIEN sent 2026-01-01, clock 2026-01-30 (29 days)."]
          setup_api_calls:
