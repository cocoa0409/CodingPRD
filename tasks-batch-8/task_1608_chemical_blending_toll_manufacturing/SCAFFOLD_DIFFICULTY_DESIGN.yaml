  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_blocked_state_vs_credit_hold_priority
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Conflict pair: state (priority 5, ERR_INVALID_STATE) vs
          business_safety (priority 6, ERR_CUSTOMER_CREDIT_HOLD). A batch
          already in RELEASED state AND a customer on credit_hold both fail;
          the higher-priority state error must win.
        test_recipe:
          setup:
            - "Customer C9 with credit_hold=true"
            - "PA9 ACTIVE TOLLING_FEE, R9 APPROVED, T9 CLEAN_VALIDATED, L9 lot"
            - "BJ9 already in RELEASED state (was released BEFORE credit_hold was set — but credit_hold was set at create time, so to reach RELEASED we must set credit_hold=false initially, release, then suspend customer and flip credit_hold via a suspend+reinstate? Actually credit_hold is input at create and there's no endpoint to update it. Simplest: create customer with credit_hold=false, build BJ9, release BJ9. Then use a SEPARATE batch BJ9b created against same customer but never released, and POST /release on BJ9b. But then credit_hold=false. Alternative: suspend the customer (sets status=SUSPENDED, which also trips the credit-hold validation per the priority-6 check 'credit_hold OR status != ACTIVE'). That gives us a state-vs-safety conflict on BJ9b's release."
            - "Then: suspend customer (Customer.status=SUSPENDED). BJ9 still in RELEASED. Create BJ9b in INTAKE. Try to release BJ9b — should hit priority 6 (business_safety ERR_CUSTOMER_CREDIT_HOLD) because BJ9b IS in INTAKE (state is valid)."
            - "Now try to release BJ9 a second time (BJ9 already in RELEASED — state invalid) while customer is SUSPENDED: both priority 5 (state) AND priority 6 (safety) fail; state error must win."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /toll-operations/customers"
              payload: { legal_name: "Theta Pigments", credit_hold: false }
              as: QualityManager
              captures: { c9: $.data.id }
            - call: "POST /toll-operations/customers/${c9}/raw-material-lots"
              payload: { material_code: "PIG", ghS_class: "NON_HAZ", quantity_kg_received: 2000, storage_zone: "Z_GENERAL", received_at: "2026-08-02T08:00:00Z" }
              as: BatchScheduler
              captures: { l9: $.data.id }
            - call: "POST /toll-operations/recipes"
              payload: { name: "Pigment Dispersion", revision: 1, customer_id: "${c9}", target_density_kg_per_l: 1.4, theoretical_yield_pct: 95, components: [{ material_code: "PIG", mass_fraction_pct: 100.000, charge_order: 1 }] }
              as: QualityManager
              captures: { r9: $.data.id }
            - call: "POST /toll-operations/recipes/${r9}/approve"
              payload: {}
              as: QualityManager
            - call: "POST /toll-operations/customers/${c9}/pricing-agreements"
              payload: { pricing_mode: "TOLLING_FEE", tolling_base_fee_cents: 100, tolling_per_kg_cents: 1, formulated_price_per_kg_cents: 0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: QualityManager
              captures: { pa9: $.data.id, pa9_v: $.data.version }
            - call: "POST /toll-operations/customers/${c9}/pricing-agreements/${pa9}/activate"
              payload: { expected_pricing_agreement_version: "${pa9_v}" }
              as: QualityManager
            - call: "POST /toll-operations/tanks"
              payload: { tank_code: "TK-901", capacity_l: 500, working_capacity_l: 500, current_zone: "Z_GENERAL" }
              as: QualityManager
              captures: { t9: $.data.id }
            - call: "POST /toll-operations/tanks/${t9}/cleaning-records"
              payload: { method: "DRY_PURGE", started_at: "2026-08-02T08:00:00Z", completed_at: "2026-08-02T09:00:00Z", residue_ppm: 0 }
              as: TankOperator
              captures: { cr9: $.data.id }
            - call: "POST /toll-operations/tanks/${t9}/cleaning-records/${cr9}/submit"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t9}/cleaning-records/${cr9}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            - call: "POST /toll-operations/customers/${c9}/batch-jobs"
              payload: { recipe_id: "${r9}", pricing_agreement_id: "${pa9}", tank_id: "${t9}", batch_size_l: 100, scheduled_start: "2026-10-10T08:00:00Z", scheduled_end: "2026-10-10T12:00:00Z" }
              as: BatchScheduler
              captures: { bj9: $.data.id, bj9_v: $.data.version }
            - call: "POST /toll-operations/customers/${c9}/batch-jobs/${bj9}/release"
              payload: { expected_batch_job_version: "${bj9_v}" }
              as: BatchScheduler
              captures: { bj9_after: $.data.version }
            - call: "POST /toll-operations/customers/${c9}/suspend"
              payload: {}
              as: QualityManager
          trigger:
            # BJ9 already in RELEASED (state invalid), customer SUSPENDED (safety fails too). Expect ERR_INVALID_STATE to win.
            - call: "POST /toll-operations/customers/${c9}/batch-jobs/${bj9}/release"
              payload: { expected_batch_job_version: "${bj9_after}" }
              as: BatchScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "Second /release on BJ9 returns error_id == ERR_INVALID_STATE (state priority beats safety priority)"

      - name: complete_blocked_sds_vs_placard_priority
        grounds:
          - validations[priority=19]
          - validations[priority=22]
        distinguishing_aspect: |
          Conflict pair: business_safety at priority 19 (ERR_SDS_NOT_ISSUED)
          vs business_safety at priority 22 (ERR_PLACARD_MISSING). Both are
