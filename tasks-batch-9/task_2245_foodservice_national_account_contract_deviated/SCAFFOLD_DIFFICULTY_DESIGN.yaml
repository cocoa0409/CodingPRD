  # ===========================================================================
  # Rule 5 — Priority-pair validation conflicts on different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspended_contract_outranks_deviated_price_ceiling
        grounds:
          - validations[priority=6]
          - validations[priority=40]
          - errors.ERR_CONTRACT_NOT_ACTIVE
          - errors.ERR_DEVIATED_PRICE_ABOVE_CEILING
          - calculations.deviated_price_resolution
          - state_machines.Contract.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Category pair state (priority 6) versus business_fiscal (priority 40): one
          request violates both because the contract is SUSPENDED and the resolved
          deviated price 4100 exceeds the 4000 ceiling, and the response must be
          ERR_CONTRACT_NOT_ACTIVE with HTTP 409, never the 422 ceiling error.
        test_recipe:
          setup:
            - "Operator HLG, manufacturer CPC, DC-SEA, product P-CHKN with last_cost_cents 4200 owned by CPC."
            - "Contract HLG-2026 built with one unbounded PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier and one IN_MARKET coverage, signed to ACTIVE, then suspended."
            - "Contract version re-read after the suspend so the request carries a fresh expected_contract_version and cannot be short-circuited by the priority 8 OCC check."
            - "Logical clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
