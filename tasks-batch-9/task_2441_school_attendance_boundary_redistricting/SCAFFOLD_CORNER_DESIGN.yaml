      setup:
      - The Riverbend study is in BOARD_DECISION with Scenario A in BOARD_READY; its students_reassigned_pct is 0.00 because every area keeps the school it already had.
      - board-1 casts every vote and is not the scenario's author, so ERR_SELF_ADOPTION_FORBIDDEN cannot mask the vote arithmetic, and each failed attempt leaves the scenario BOARD_READY for the next try.
      - The clock reads 2026-09-01, the effective date is 2027-07-01 and the transfer deadline is 2027-08-15, so the date-window rule is satisfied on all three attempts.
