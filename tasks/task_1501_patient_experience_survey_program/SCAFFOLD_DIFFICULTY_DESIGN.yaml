            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 24, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/cycles/${cy}", payload: {}, as: Any, captures: { elig: "$.data.publication_eligible" } }
            - { call: "POST /api/cycles/${cy}/publish", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "SurveyCycle.${cy}.scored_completed_responses == 24 and scored_response_rate == 100.0"
            - "publication_eligible == false (24 < 25 despite rate passing)"
            - "publish -> 422 ERR_BELOW_PUBLICATION_THRESHOLD; cycle remains SCORING"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: adjudicate_gated_by_cycle_posture
        grounds:
          - state_machines.SurveyResponse.PENDING_REVIEW_to_INCLUDED
          - validations[priority=4]
          - errors[ERR_CYCLE_NOT_RECONCILING]
        distinguishing_aspect: |
          Entity pair SurveyResponse -> SurveyCycle: a response in the correct
          local state (PENDING_REVIEW) still cannot be adjudicated while its
          cycle is FIELDING rather than RECONCILIATION — the valid transition
          set of the response depends on the parent cycle's posture.
        test_recipe:
          setup:
            - "Cycle FIELDING (fielding_end_date 2026-08-31); case IN_FIELD; logical clock advanced to 2026-09-05 so intake is late"
            - "Late response recorded: is_late == true, status PENDING_REVIEW"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CE1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[0]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}", captures: { rsp: "$.data.id", rsp_st: "$.data.status" } }
          trigger:
            - { call: "POST /api/responses/${rsp}/adjudicate", payload: { decision: "INCLUDE" }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "intake produced response status == PENDING_REVIEW (is_late true: 2026-09-05 > 2026-08-31)"
            - "adjudicate -> 409 ERR_CYCLE_NOT_RECONCILING (cycle still FIELDING)"
            - "SurveyResponse.${rsp}.status still == PENDING_REVIEW"

      - name: initiative_activate_gated_by_baseline_cycle_state
        grounds:
          - state_machines.ImprovementInitiative.DRAFT_to_ACTIVE
          - errors[ERR_BASELINE_CYCLE_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair ImprovementInitiative -> SurveyCycle (different pair from
          the sibling instance): activation is rejected while the baseline cycle
          is merely SCORING — it must be PUBLISHED.
        test_recipe:
          setup:
            - "Cycle C1 in SCORING (25 completed all-4 MAIL responses); cycle C2 DRAFT idx2; initiative (U1, OVERALL_RATING, baseline C1, evaluation C2, target 90.0) in DRAFT"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CE2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/cycles/${c1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 25, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
