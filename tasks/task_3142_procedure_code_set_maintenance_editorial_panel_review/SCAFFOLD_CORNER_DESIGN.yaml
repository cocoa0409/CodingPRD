              payload: { year: 2030, comment_open: "2026-06-01T00:00:00Z", comment_close: "2026-07-15T00:00:00Z", addendum_comment_close: "2026-11-15T00:00:00Z", meeting_ids: ["${mtg_un}"], code_set_capacity: 400, errata_deadline: "2030-06-30T00:00:00Z", single_floor_budgeting: false }
              as: EditorialStaff
              captures: { cyc_un: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/release-cycles/${cyc_un}/returns"
              payload: { reason: "Open the submission window for the probe" }
              as: EditorialStaff
              captures: { un_v_pre: $.data.version }
            - call: "POST /cpt/code-changes"
              payload: { code: "00081", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_un}", clinical_evidence_tier: "TIER_II", procedure_volume_threshold: 700, descriptor_current: "Placeholder descriptor" }
              as: EditorialStaff
