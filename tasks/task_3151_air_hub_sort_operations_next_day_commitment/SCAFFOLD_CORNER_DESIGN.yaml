              as: SortSupervisor
              captures: { closed: $.data.status }
            - call: "POST /airhub/lanes/${lane_p1_id}/close"
              payload: {}
              as: SortSupervisor
              captures: { err_close_again: $.data.error_id }
            - call: "POST /airhub/lanes/${lane_p1_id}/reopen"
              payload: {}
              as: SortSupervisor
              captures: { reopened: $.data.status }
            - call: "POST /airhub/lanes/${lane_p1_id}/reopen"
              payload: {}
              as: SortSupervisor
              captures: { err_reopen_again: $.data.error_id }
          assert:
            - "the close reports ${closed} == CLOSED and the repeat returns 409 with ${err_close_again} == ERR_INVALID_STATE"
            - "the reopen reports ${reopened} == AVAILABLE and the repeat returns 409 with ${err_reopen_again} == ERR_INVALID_STATE"
            - "the lane was AVAILABLE at creation with lane_load_grams 0"
            - "the terminal members CLOSED and SATURATED remain distinct: SortLane.${lane_p1_id}.status == AVAILABLE at the end"

      - name: clear_upgrade_hold_gated_on_the_inbound_aircraft_status
        claim_type: invalid_transition
        grounds:
          - state_machines.Package.transitions.UPGRADED_HELD_to_COMMITTED
          - errors.ERR_AIRCRAFT_NOT_CANCELLED
        distinguishing_aspect: "Clearing an upgrade hold is gated on the package's inbound aircraft no longer being CANCELLED, so a package held by a cancellation cannot be released while that aircraft is still grounded."
        test_recipe:
          setup:
            - "Clock 1600. SDF hub with alternate IND, BANK_A with N701UP landed and unloaded and N702UP landed then cancelled, shift N-B, package H aboard N702UP held by the cancellation."
          setup_api_calls:
            - *c_clock
