  - name: RiskCommittee
    identity: opaque
    description: >
      The sponsor bank's credit and enterprise-risk approval body, scoped to the contractual
      layer of the program. Executes or rejects program agreements, terminates an executed agreement on a contracted
      trigger, and approves or rejects wind-down plans. Read-only everywhere else. It never authors the artefact it
      approves, and the ERR_SEGREGATION_OF_DUTIES check (validation priority 14) enforces that the deciding
      X-User-ID differs from the recorded originator.
