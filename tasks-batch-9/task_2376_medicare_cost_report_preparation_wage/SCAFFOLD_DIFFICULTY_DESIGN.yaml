            - "cost centers 00300 Dietary (GENERAL_SERVICE, allocation_basis MEALS_SERVED, stepdown_order 1, statistics {}), 03000 Routine (statistics {SQUARE_FEET: 3000}) and 05000 Ancillary (statistics {SQUARE_FEET: 2000}) — no center reports a MEALS_SERVED statistic"
            - "three mapped trial balance lines of 60000000 / 200000000 / 120000000 so unmapped_tb_total_cents == 0"
          setup_api_calls:
