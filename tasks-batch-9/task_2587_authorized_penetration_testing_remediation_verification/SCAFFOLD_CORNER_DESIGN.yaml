            - call: "POST /pentest/remediations"
              payload: { finding_id: "00000000-0000-0000-0000-0000000000f1", owner_user_id: "owner-1", validation_requirement: "EVIDENCE_ONLY", remediation_plan: "Self-assigned work" }
              as: RemediationOwner
              as_user_id: "owner-1"
              captures: { err_rem: $.data.error_id }
            - call: "POST /pentest/findings"
              payload: { engagement_id: "00000000-0000-0000-0000-0000000000e1", asset_id: "${asset_a_id}", title: "Manager-filed finding", reproduction_steps: "1. Look 2. See", business_impact_narrative: "Impact", technical_base_score: 5.00, exposure_class: "PARTNER", root_cause_theme: "ACCESS_CONTROL", expected_engagement_version: "${pv1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err_finding: $.data.error_id }
            - call: "POST /pentest/retest-verifications"
              payload: { remediation_id: "00000000-0000-0000-0000-0000000000r1", evidence_uri: "s3://evidence/x", outcome: "PASS" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err_verify: $.data.error_id }
            - call: "GET /pentest/test-plans/${plan_id}"
              payload: {}
