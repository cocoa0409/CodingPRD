      - name: eligible_programs_projection_separates_eligible_capped_out_and_blocked
        claim_type: waterfall_allocation
        grounds:
          - calculations.delivery_stack_allocation
          - endpoints.GET_deliveries_id_eligible_programs
        distinguishing_aspect: "One read-only call fills all three output buckets at once from a single waterfall pass in (priority_rank ASC, created_at ASC) order: the cheapest program is accepted, the second is CAPPED OUT by its own stack_cap_cents once the running total is counted, and the third is BLOCKED by a FORBIDDEN edge to the already-accepted first — proving the evaluation is sequential and stateful, not three independent filters."
