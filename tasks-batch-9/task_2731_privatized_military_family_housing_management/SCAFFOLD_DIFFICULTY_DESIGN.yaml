  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # Four instances on FOUR different endpoints, each pinning a DIFFERENT
  # inclusive/exclusive metric:
  #   6.1  overdue-hours threshold (>= 0h) vs sla_breached (strict >)
  #        endpoint POST /work-orders/{id}/escalate
  #   6.2  candidate-pool exact equality (bedroom_count, rank_category)
  #        endpoint POST /installations/{id}/waitlist-offer-run
  #   6.3  dependent age ceiling with the birthday landing ON the control date
  #        endpoint POST /waitlist-applications
  #   6.4  half-open night count collapsing to zero width
  #        endpoint POST /displacement-lodgings/{id}/close
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: emergency_escalation_eligible_at_exact_completion_due_at
        grounds:
          - calculations.habitability_escalation_eligibility
          - calculations.work_order_priority_classification
          - validations[priority=43]
          - entities.WorkOrder.fields.escalation_level
          - entities.WorkOrder.fields.sla_breached
          - endpoints.POST_/work-orders/{id}/escalate
        distinguishing_aspect: |
          The metric is the overdue-hours comparison, and its two operators
          disagree by exactly one second at the same instant: escalation
          eligibility uses `overdue >= needed` with
          ESCALATION_HOURS_EMERGENCY_L1 == 0, so an EMERGENCY order becomes
          escalatable at exactly completion_due_at, while sla_breached uses the
          strict `completed_at > completion_due_at`, so the very same instant is
          still inside SLA. One second earlier the escalation is rejected. The
          level-2 boundary is then probed at exactly +24h. No other instance of
          this rule touches this endpoint or an hours threshold.
        test_recipe:
          setup:
            - "One installation, one 2-bedroom TOWNHOME unit, one E5 sponsor with three full-time-custody dependents (the youngest born 2022-03-15, hence under six)."
            - "Lease 1 is OCCUPIED / ACTIVE from 2026-09-01."
            - "The clock is set to 2026-09-10T09:00:00Z and a NO_HEAT work order with habitability_impact true is created, so CATEGORY_TIER_NO_HEAT 3 already yields EMERGENCY, response_due_at is 2026-09-10T13:00:00Z and completion_due_at is min(reported+24h, reported+72h) == 2026-09-11T09:00:00Z."
            - "The order is left in status SUBMITTED throughout; escalation never changes status."
