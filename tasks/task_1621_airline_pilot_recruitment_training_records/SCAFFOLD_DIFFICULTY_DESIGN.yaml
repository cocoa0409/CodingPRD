            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ca1}", phase: "GROUND_SCHOOL", event_type: "MILESTONE", scheduled_start: "2026-08-14T13:00:00Z", scheduled_end: "2026-08-14T15:00:00Z" }, as: TrainingCoordinator, captures: { ev_gm: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-14T13:00:00Z" }, as: SystemAdmin }
