            - call: "POST /playtests/applications/${appa_id}/approve"
              payload: {}
              as: Researcher
            - call: "GET /playtests/nda-signatures?participant_id=${pa_id}&status=PENDING"
              as: ResearchOpsAdmin
              captures: { siga_id: "$.data[0].id"}
            - call: "POST /playtests/nda-signatures/${siga_id}/sign"
              payload: {}
              as: Participant
              as_user_id: "${pa_id}"
            - call: "POST /playtests/applications"
