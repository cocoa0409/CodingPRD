scenario: "2311. Multiemployer Plan Withdrawal Liability (contributing employer): contribution history and allocation fraction analysis under the plan's chosen allocation method, complete versus partial withdrawal determination on cessation of covered work or contribution obligation, withdrawal liability assessment review with actuarial assumption challenges and interest rate arguments, twenty-year payment cap and de minimis reduction application, request for review deadlines and mandatory arbitration initiation, payment schedule compliance during dispute with default and acceleration risk, construction and entertainment industry special rules, successor liability, controlled group exposure and transaction due diligence"

domain_name: multiemployer-plan-withdrawal-liability

# Flat topology: every entity is a top-level peer collection linked by foreign
# keys carried in request bodies. There is no single owning root resource, so the
# API prefix is empty and all collection paths sit at the root.
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  difficulty_rationale: |
    The same certified contribution history and the same certified valuation set
    yield four different gross allocations (PRESUMPTIVE / MODIFIED_PRESUMPTIVE /
    ROLLING_5 / DIRECT_ATTRIBUTION) that differ not only in pool selection but in
    ROUNDING ORDER (per-pool-term rounding vs single terminal rounding) and in
    RATIO BASIS (contribution dollars vs contribution base units). Downstream of
    that, the de minimis phase-out and the twenty-year payment cap form a
    circular-looking dependency that must be evaluated in a pinned order, and the
    assessment carries three independent state dimensions (lifecycle / review /
    collection) because the statute forces payments to continue during dispute.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Plan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Plan legal name.
        constraints: 1..200 chars, required
      - name: industry
        type: enum
        source: input
        description: Industry classification that selects the withdrawal-determination rule set.
        default: GENERAL
        constraints: "one of {GENERAL, CONSTRUCTION, ENTERTAINMENT, TRUCKING}"
      - name: allocation_method
        type: enum
        source: input
        description: Allocation method the plan has adopted for allocating unfunded vested benefits.
        default: PRESUMPTIVE
        constraints: "one of {PRESUMPTIVE, MODIFIED_PRESUMPTIVE, ROLLING_5, DIRECT_ATTRIBUTION}"
      - name: de_minimis_variant
        type: enum
        source: input
        description: Which de minimis reduction schedule the plan has elected.
        default: STATUTORY
        constraints: "one of {STATUTORY, PLAN_ELECTED_HIGH}"
      - name: interest_rate_bps
        type: integer
        source: input
        description: Plan-wide actuarial discount rate in basis points, used for present-value amortization when a valuation does not override it.
        constraints: 1..3000, required
      - name: unattributable_uvb_cents
        type: integer
        source: input
        description: Portion of unfunded vested benefits that cannot be directly attributed to any employer; used only by the DIRECT_ATTRIBUTION method.
        default: 0
        constraints: ">= 0"
      - name: mass_withdrawal_declared
        type: boolean
        source: input
        description: True when substantially all employers have withdrawn; suppresses the de minimis reduction and disapplies the twenty-year payment cap.
        default: false
      - name: employer_count
        type: integer
        source: computed
        description: "Count of Employer rows with plan_id == this Plan.id (all statuses)."
        default: 0
      - name: issued_assessment_count
        type: integer
        source: computed
        description: "Count of LiabilityAssessment rows reachable from this Plan whose lifecycle_status IN {ISSUED, FINAL}."
        default: 0

  - name: ControlledGroup
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Controlled group name.
        constraints: 1..200 chars, required
      - name: common_control_basis
        type: enum
        source: input
        description: Basis on which the members are under common control.
        constraints: "one of {PARENT_SUBSIDIARY, BROTHER_SISTER, COMBINED}, required"
      - name: bond_posture
        type: enum
        source: computed
        description: "BONDED when an AssetSaleTransaction with buyer_controlled_group_id == this.id has exemption_status == EXEMPT_4204 and bond_period_end_plan_year >= the plan year of the current logical clock; otherwise UNBONDED."
        default: UNBONDED
        constraints: "one of {UNBONDED, BONDED}"
      - name: joint_exposure_cents
        type: integer
        source: computed
        description: "Sum of Employer.outstanding_liability_cents over Employer rows with controlled_group_id == this.id and status IN {PARTIAL_WITHDRAWN, COMPLETE_WITHDRAWN, DEFAULTED}. Joint-and-several exposure of the group."
        default: 0
      - name: contingent_exposure_cents
        type: integer
        source: computed
        description: "Sum of AssetSaleTransaction.required_bond_cents over transactions with buyer_controlled_group_id == this.id, exemption_status == EXEMPT_4204 and bond_period_end_plan_year >= current clock plan year."
        default: 0
      - name: exposure_score
        type: number
        source: computed
        description: "Weighted exposure score per calculations.controlled_group_exposure_score; 4 decimal places."
        default: 0.0

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> Plan.id; the multiemployer plan this employer contributes to.
        constraints: required
      - name: controlled_group_id
        type: string
        source: input
        description: FK -> ControlledGroup.id; the controlled group whose members are jointly and severally liable.
        constraints: required
      - name: legal_name
        type: string
        source: input
        description: Employer legal name.
        constraints: 1..200 chars, required
      - name: ein
        type: string
        source: input
        description: Employer identification number; unique across all Employer rows.
        constraints: "exactly 9 digits, required, globally unique"
      - name: obligation_start_year
        type: integer
        source: input
        description: First plan year in which the employer had an obligation to contribute.
        constraints: 1900..2200, required
      - name: obligation_end_year
        type: integer
        source: computed
        description: "Plan year in which the obligation to contribute ceased; set to WithdrawalEvent.withdrawal_plan_year when a COMPLETE withdrawal is determined, reset to null when an arbitration award VACATEs the assessment."
        default: null
      - name: covered_work_status
        type: enum
        source: input
        description: Whether the employer still performs covered work in the plan's jurisdiction; decisive under CONSTRUCTION_RULES and ENTERTAINMENT_RULES.
        default: PERFORMING
        constraints: "one of {PERFORMING, CEASED}"
      - name: cba_count
        type: integer
        source: input
        description: Number of collective bargaining agreements under which the employer is obligated to contribute.
        default: 1
        constraints: ">= 1"
      - name: ceased_cba_count
        type: integer
        source: computed
        description: "Copied from the determined WithdrawalEvent.ceased_cba_count when determined_type == PARTIAL_CBA_CESSATION; else 0."
        default: 0
      - name: directly_attributed_vested_benefits_cents
        type: integer
        source: input
        description: Present value of vested benefits directly attributable to this employer's participants; used only by DIRECT_ATTRIBUTION.
        default: 0
        constraints: ">= 0"
      - name: directly_attributed_assets_cents
        type: integer
        source: input
        description: Plan assets directly attributed to this employer; used only by DIRECT_ATTRIBUTION.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: Withdrawal/collection posture of the employer.
        default: CONTRIBUTING
        constraints: "one of {CONTRIBUTING, PARTIAL_WITHDRAWN, COMPLETE_WITHDRAWN, DEFAULTED, LIABILITY_SATISFIED}"
      - name: outstanding_liability_cents
        type: integer
        source: computed
        description: "Sum of Installment.principal_cents over installments whose payment_schedule_id belongs to a PaymentSchedule with status IN {ACTIVE, DEFAULT_ELIGIBLE, NOTICED} for this employer's assessments, and whose Installment.status IN {SCHEDULED, DUE, DELINQUENT}. Conserved quantity EMPLOYER_OUTSTANDING_LIABILITY."
        default: 0
      - name: credit_watch
        type: boolean
        source: computed
        description: "True when any LiabilityAssessment for this employer has collection_status IN {DELINQUENT, DEFAULTED, ACCELERATED}."
        default: false
      - name: delinquency_strikes
        type: integer
        source: computed
        description: "Cumulative count of Installment rows for this employer that have ever entered status DELINQUENT; never decremented by a cure."
        default: 0

  - name: PlanYearValuation
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> Plan.id; the plan this valuation measures.
        constraints: required
      - name: plan_year
        type: integer
        source: input
        description: Calendar plan year the valuation measures.
        constraints: 1900..2200, required
      - name: measurement_window_start
        type: datetime
        source: input
        description: Inclusive start of the actuarial measurement window (half-open interval start).
        constraints: required, ISO 8601 UTC
      - name: measurement_window_end
        type: datetime
        source: input
        description: Exclusive end of the actuarial measurement window (half-open interval end); must be strictly after measurement_window_start.
        constraints: required, ISO 8601 UTC
      - name: uvb_total_cents
        type: integer
        source: input
        description: Total unfunded vested benefits of the plan as of the end of plan_year.
        constraints: ">= 0, required"
      - name: uvb_pool_cents
        type: integer
        source: input
        description: Increment in unfunded vested benefits attributable to plan_year; the allocable pool used by the PRESUMPTIVE method.
        constraints: ">= 0, required"
      - name: all_employer_contributions_cents
        type: integer
        source: input
        description: Total contributions remitted by all contributing employers for plan_year; denominator of the dollar-basis allocation fraction.
        constraints: ">= 0, required"
      - name: all_employer_cbu
        type: integer
        source: input
        description: Total contribution base units credited for all employers for plan_year; denominator of the CBU-basis allocation fraction.
        constraints: ">= 0, required"
      - name: interest_rate_bps
        type: integer
        source: input
        description: Actuarial discount rate assumption certified for this plan year, in basis points; overrides Plan.interest_rate_bps when the valuation is the assessment's anchor valuation.
        constraints: 1..3000, required
      - name: certify_on_create_used
        type: boolean
        source: system
        description: True when the create request set certify_on_create; recorded so the audit trail shows create-and-certify happened in one act.
        default: false
      - name: status
        type: enum
        source: computed
        description: Certification state of the valuation.
        default: DRAFT
        constraints: "one of {DRAFT, CERTIFIED, SUPERSEDED}"
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlanActuary who certified this valuation; compared against the issuing trustee's id by the segregation-of-duties check.
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant at which the valuation was certified.
        default: null
      - name: allocated_uvb_cents
        type: integer
        source: computed
        description: "Sum of LiabilityAssessment.net_assessed_cents over assessments with valuation_id == this.id and lifecycle_status IN {ISSUED, FINAL}."
        default: 0
      - name: unallocated_uvb_cents
        type: integer
        source: computed
        description: "uvb_total_cents - allocated_uvb_cents. Conserved quantity PLAN_UVB_ALLOCATION: allocated_uvb_cents + unallocated_uvb_cents == uvb_total_cents at all times."
        default: 0

  - name: ContributionRecord
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the employer whose contribution history this record documents.
        constraints: required
      - name: supersedes_record_id
        type: string
        source: input
        description: "FK -> ContributionRecord.id; the CERTIFIED record this audit correction amends. When supplied, the referenced record must cover exactly the same [plan_year_start, plan_year_end] interval and is flipped to AMENDED."
        default: null
      - name: plan_year_start
        type: integer
        source: input
        description: First plan year covered by this record (closed interval start).
        constraints: 1900..2200, required
      - name: plan_year_end
        type: integer
        source: input
        description: Last plan year covered by this record (closed interval end); must be >= plan_year_start.
        constraints: 1900..2200, required
      - name: contribution_base_units
        type: integer
        source: input
        description: Total contribution base units credited over the whole covered interval; spread across plan years by calculations.per_year_contribution_index.
        constraints: ">= 0, required"
      - name: contribution_amount_cents
        type: integer
        source: input
        description: Total contributions remitted over the whole covered interval; spread across plan years by calculations.per_year_contribution_index.
        constraints: ">= 0, required"
      - name: contribution_rate_cents_per_cbu
        type: integer
        source: input
        description: Negotiated contribution rate in cents per contribution base unit in effect over the covered interval; independent of contribution_amount_cents, which is the amount actually remitted.
        constraints: ">= 0, required"
      - name: status
        type: enum
        source: computed
        description: Certification state; only CERTIFIED records feed any calculation.
        default: CERTIFIED
        constraints: "one of {CERTIFIED, AMENDED, VOID}"
      - name: employer_version_at_apply
        type: integer
        source: system
        description: Value of Employer.version immediately after this record was applied; lets a client chain successive history corrections without a separate read.
        default: 1

  - name: WithdrawalEvent
    parent: null
    common_fields: true
    fields:
      - name: employer_id
        type: string
        source: input
        description: FK -> Employer.id; the employer whose cessation is being evaluated.
        constraints: required
      - name: cessation_date
        type: datetime
        source: input
        description: Date on which the obligation to contribute or the covered work ceased.
        constraints: required, ISO 8601 UTC
      - name: withdrawal_plan_year
        type: integer
        source: input
        description: Plan year W in which the cessation occurred; anchors every lookback window.
        constraints: 1900..2200, required, must equal the calendar year of cessation_date
      - name: reported_cause
        type: enum
        source: input
        description: Cause as reported by the employer or fund administrator.
        constraints: "one of {CONTRIBUTION_OBLIGATION_CEASED, COVERED_WORK_CEASED, CBA_PARTIAL_CESSATION, FACILITY_CESSATION, CBU_DECLINE}, required"
      - name: ceased_cba_count
        type: integer
        source: input
        description: Number of collective bargaining agreements under which the obligation ceased; only meaningful when reported_cause == CBA_PARTIAL_CESSATION.
        default: 0
        constraints: ">= 0"
      - name: rules_variant
        type: enum
        source: computed
        description: "Rule set applied, derived from Plan.industry: CONSTRUCTION -> CONSTRUCTION_RULES, ENTERTAINMENT -> ENTERTAINMENT_RULES, otherwise GENERAL_RULES."
        default: GENERAL_RULES
        constraints: "one of {GENERAL_RULES, CONSTRUCTION_RULES, ENTERTAINMENT_RULES}"
      - name: determined_type
        type: enum
        source: computed
        description: Withdrawal classification produced by calculations.withdrawal_type_determination.
        default: NONE
        constraints: "one of {NONE, COMPLETE, PARTIAL_70_DECLINE, PARTIAL_CBA_CESSATION, PARTIAL_FACILITY_CESSATION}"
      - name: high_base_year_average_cbu
        type: number
        source: computed
        description: Average contribution base units of the two highest base plan years, 4 decimal places; produced by calculations.seventy_percent_decline_test.
        default: 0.0
      - name: testing_period_average_cbu
        type: number
        source: computed
        description: Average contribution base units over the three-plan-year testing period, 4 decimal places.
        default: 0.0
      - name: decline_ratio
        type: number
        source: computed
        description: testing_period_average_cbu / high_base_year_average_cbu, 6 decimal places, round_half_up.
        default: 0.0
      - name: base_year_one
        type: integer
        source: computed
        description: Earlier of the two selected base plan years; exposes the base-year tie-break for audit.
        default: null
      - name: base_year_two
        type: integer
        source: computed
        description: Later of the two selected base plan years.
        default: null
      - name: partial_withdrawal_fraction
        type: number
        source: computed
        description: Fraction of the complete-withdrawal basis assessed for a partial withdrawal, 4 decimal places; 1.0000 for COMPLETE, 0.0000 for NONE.
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: Determination lifecycle of the event.
        default: REPORTED
        constraints: "one of {REPORTED, COMPLETE_DETERMINED, PARTIAL_DETERMINED, NO_WITHDRAWAL, ASSESSED}"
      - name: determined_at
        type: datetime
        source: computed
        description: Logical-clock instant of determination.
        default: null

  - name: LiabilityAssessment
    parent: null
    common_fields: true
    fields:
      - name: withdrawal_event_id
        type: string
        source: input
        description: FK -> WithdrawalEvent.id; the determined withdrawal this assessment quantifies.
        constraints: required
      - name: valuation_id
        type: string
        source: computed
        description: "FK -> PlanYearValuation.id; the anchor valuation selected by calculations.anchor_valuation_selector (CERTIFIED valuation for plan year W-1)."
      - name: allocation_method_applied
        type: enum
        source: computed
        description: Plan.allocation_method pinned at assessment-creation time; later edits to the plan do not re-open an existing assessment.
        constraints: "one of {PRESUMPTIVE, MODIFIED_PRESUMPTIVE, ROLLING_5, DIRECT_ATTRIBUTION}"
      - name: de_minimis_variant_applied
        type: enum
        source: computed
        description: Plan.de_minimis_variant pinned at assessment-creation time.
        constraints: "one of {STATUTORY, PLAN_ELECTED_HIGH}"
      - name: interest_rate_bps_applied
        type: integer
        source: computed
        description: Discount rate pinned at assessment-creation time from the anchor valuation's interest_rate_bps; replaced by the challenged rate when an assumption challenge is SUSTAINED and a new schedule generation is minted.
      - name: gross_allocated_cents
        type: integer
        source: computed
        description: Gross allocable share of unfunded vested benefits before any reduction; produced by calculations.allocation_fraction_and_gross_share.
        default: 0
      - name: pool_term_breakdown
        type: array
        source: computed
        description: "Per-pool audit trail, only populated when allocation_method_applied == PRESUMPTIVE: ordered ascending by plan_year, each element { plan_year, decay_factor, ratio, term_cents }."
        default: []
      - name: de_minimis_reduction_cents
        type: integer
        source: computed
        description: Reduction produced by calculations.de_minimis_reduction.
        default: 0
      - name: award_adjustment_cents
        type: integer
        source: computed
        description: Cumulative reduction ordered by a review decision or arbitration award; increases only, never negative.
        default: 0
      - name: net_assessed_cents
        type: integer
        source: computed
        description: "gross_allocated_cents - de_minimis_reduction_cents - award_adjustment_cents; the amount demanded."
        default: 0
      - name: high_3yr_average_cbu
        type: number
        source: computed
        description: Highest three-consecutive-plan-year average contribution base units in the ten-year lookback, 4 decimal places.
        default: 0.0
      - name: high_3yr_window_start_year
        type: integer
        source: computed
        description: First plan year of the winning three-year window; exposes the earliest-window tie-break for audit.
        default: null
      - name: peak_contribution_rate_cents_per_cbu
        type: integer
        source: computed
        description: Highest contribution rate in effect during the ten-year lookback.
        default: 0
      - name: peak_rate_plan_year
        type: integer
        source: computed
        description: Earliest plan year in which peak_contribution_rate_cents_per_cbu was in effect; exposes the earliest-year tie-break for audit.
        default: null
      - name: annual_payment_cents
        type: integer
        source: computed
        description: Level annual payment produced by calculations.annual_payment_amount; depends only on contribution history, never on the assessed amount.
        default: 0
      - name: lifecycle_status
        type: enum
        source: computed
        description: Primary lifecycle dimension of the assessment.
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, RESCINDED, FINAL}"
      - name: review_status
        type: enum
        source: computed
        description: Dispute dimension, independent of lifecycle_status and collection_status.
        default: NONE
        constraints: "one of {NONE, REQUESTED, DECIDED, ARBITRATED}"
      - name: collection_status
        type: enum
        source: computed
        description: "Collection dimension, independent of review_status; derived from the ACTIVE-generation PaymentSchedule and its installments per calculations.collection_status_projection."
        default: NOT_YET_DUE
        constraints: "one of {NOT_YET_DUE, CURRENT, DELINQUENT, DEFAULTED, ACCELERATED, SATISFIED}"
      - name: issued_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the demand notification was delivered; anchors the 90-day request-for-review window.
        default: null
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the PlanTrustee who issued the demand; compared against the deciding trustee's id by the segregation-of-duties check.
        default: null
      - name: review_deadline_at
        type: datetime
        source: computed
        description: "issued_at + REVIEW_WINDOW_DAYS; a request for review filed at exactly this instant is timely."
        default: null
      - name: active_schedule_generation
        type: integer
        source: computed
        description: generation_seq of the PaymentSchedule currently in a non-terminal status for this assessment; 0 when none exists.
        default: 0

  - name: PaymentSchedule
    parent: null
    common_fields: true
    fields:
      - name: liability_assessment_id
        type: string
        source: input
        description: FK -> LiabilityAssessment.id; the assessment this schedule amortizes.
        constraints: required
      - name: generation_seq
        type: integer
        source: computed
        description: 1 for the schedule minted at issuance; incremented for every superseding regeneration.
        default: 1
      - name: source
        type: enum
        source: input
        description: Why this generation was minted.
        default: ISSUANCE
        constraints: "one of {ISSUANCE, REVIEW_DECISION, ARBITRATION_AWARD, ACTUARIAL_CORRECTION}"
      - name: interest_rate_bps
        type: integer
        source: computed
        description: Discount rate used for the present-value amortization of this generation.
      - name: annual_payment_cents
        type: integer
        source: computed
        description: Copied from LiabilityAssessment.annual_payment_cents; history-derived and therefore stable across generations.
        default: 0
      - name: applied_credit_cents
        type: integer
        source: computed
        description: Sum of Installment.amount_paid_cents across all prior generations of this assessment; credited against the amortization basis of this generation.
        default: 0
      - name: amortization_basis_cents
        type: integer
        source: computed
        description: "LiabilityAssessment.net_assessed_cents - applied_credit_cents; the amount this generation must amortize."
        default: 0
      - name: forgiven_by_cap_cents
        type: integer
        source: computed
        description: Amount extinguished by the twenty-year payment cap; computed from the pre-cap basis and never recomputed from the post-cap figure.
        default: 0
      - name: capped_basis_cents
        type: integer
        source: computed
        description: "amortization_basis_cents - forgiven_by_cap_cents; equals the sum of Installment.principal_cents on this generation."
        default: 0
      - name: amortization_years
        type: integer
        source: computed
        description: Number of level annual payments after the cap is applied.
        default: 0
      - name: installment_count
        type: integer
        source: computed
        description: amortization_years * 4.
        default: 0
      - name: quarterly_installment_cents
        type: integer
        source: computed
        description: "floor(capped_basis_cents / installment_count); the principal of every installment except the last."
        default: 0
      - name: final_installment_cents
        type: integer
        source: computed
        description: "capped_basis_cents - quarterly_installment_cents * (installment_count - 1); absorbs the whole rounding remainder."
        default: 0
      - name: first_due_date
        type: datetime
        source: computed
        description: "Logical-clock instant at which this generation was minted, plus FIRST_DUE_OFFSET_DAYS."
        default: null
      - name: consecutive_delinquent_count
        type: integer
        source: computed
        description: Number of installments on this generation currently in status DELINQUENT; reset to 0 by a cure.
        default: 0
      - name: default_notice_issued_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the plan issued the notice of default.
        default: null
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "default_notice_issued_at + CURE_WINDOW_DAYS."
        default: null
      - name: accelerated_balance_cents
        type: integer
        source: computed
        description: Sum of Installment.principal_cents over installments accelerated by this schedule.
        default: 0
      - name: refund_due_cents
        type: integer
        source: computed
        description: Sum of Installment.amount_paid_cents on this generation when the schedule is VOIDed by a rescinding award.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Schedule state.
        default: ACTIVE
        constraints: "one of {ACTIVE, DEFAULT_ELIGIBLE, NOTICED, ACCELERATED, SUPERSEDED, SATISFIED, VOID}"

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - name: payment_schedule_id
        type: string
        source: input
        description: FK -> PaymentSchedule.id; the generation this installment belongs to.
        constraints: required
      - name: sequence_number
        type: integer
        source: computed
        description: 1-based position within the generation; the only ordering key used for due-date and remainder assignment.
      - name: due_date
        type: datetime
        source: computed
        description: "PaymentSchedule.first_due_date advanced by INSTALLMENT_INTERVAL_MONTHS * (sequence_number - 1) calendar months, day-of-month clamped to the last day of the target month."
      - name: principal_cents
        type: integer
        source: computed
        description: Principal allocated to this installment; equals PaymentSchedule.quarterly_installment_cents except for the last sequence_number, which carries final_installment_cents.
        default: 0
      - name: amount_due_cents
        type: integer
        source: computed
        description: Amount the employer must remit for this installment; equals principal_cents.
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Amount actually remitted against this installment.
        default: 0
      - name: delinquent_on
        type: datetime
        source: computed
        description: "due_date + INSTALLMENT_GRACE_DAYS; the collection sweep flips the installment to DELINQUENT once the logical clock reaches this instant."
      - name: paid_at
        type: datetime
        source: computed
        description: Logical-clock instant of payment.
        default: null
      - name: status
        type: enum
        source: computed
        description: Installment state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DUE, PAID, DELINQUENT, ACCELERATED, VOID}"

  - name: ReviewRequest
    parent: null
    common_fields: true
    fields:
      - name: liability_assessment_id
        type: string
        source: input
        description: FK -> LiabilityAssessment.id; the assessment under review.
        constraints: required
      - name: grounds_summary
        type: string
        source: input
        description: Employer's stated grounds for review.
        constraints: 1..2000 chars, required
      - name: challenged_assumption
        type: enum
        source: input
        description: Actuarial assumption the employer challenges.
        default: NONE
        constraints: "one of {NONE, INTEREST_RATE, MORTALITY, UVB_POOL_ALLOCATION}"
      - name: proposed_interest_rate_bps
        type: integer
        source: input
        description: Discount rate the employer contends should apply; required when challenged_assumption == INTEREST_RATE, forbidden otherwise.
        default: null
        constraints: 1..3000 when present
      - name: filed_at
        type: datetime
        source: computed
        description: Logical-clock instant of filing.
      - name: filed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the EmployerRepresentative who filed; equals the owning Employer.id.
      - name: plan_response_deadline_at
        type: datetime
        source: computed
        description: "filed_at + PLAN_RESPONSE_WINDOW_DAYS; the collection sweep flips an undecided request to DEEMED_DENIED once the logical clock reaches this instant."
      - name: arbitration_deadline_at
        type: datetime
        source: computed
        description: Last instant at which arbitration may be initiated; produced by calculations.arbitration_window.
      - name: status
        type: enum
        source: computed
        description: Review lifecycle.
        default: PENDING
        constraints: "one of {PENDING, DECIDED, DEEMED_DENIED, WITHDRAWN}"
      - name: decision
        type: enum
        source: computed
        description: Plan's disposition of the review.
        default: NONE
        constraints: "one of {NONE, AFFIRMED, REDUCED, REVERSED}"
      - name: assumption_ruling
        type: enum
        source: computed
        description: Plan's ruling on the challenged assumption.
        default: PENDING
        constraints: "one of {PENDING, SUSTAINED, REJECTED, NOT_RAISED}"
      - name: recomputed_net_assessed_cents
        type: integer
        source: computed
        description: Net amount the plan concedes on review; a proposal only, applied to the assessment when a new PaymentSchedule generation is minted with source == REVIEW_DECISION.
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: Logical-clock instant of the plan's decision.
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the deciding PlanTrustee.
        default: null

  - name: Arbitration
    parent: null
    common_fields: true
    fields:
      - name: liability_assessment_id
        type: string
        source: input
        description: FK -> LiabilityAssessment.id; the assessment in arbitration.
        constraints: required
      - name: review_request_id
        type: string
        source: input
        description: FK -> ReviewRequest.id; the review whose disposition opened the arbitration window.
        constraints: required
      - name: initiated_at
        type: datetime
        source: computed
        description: Logical-clock instant of initiation.
      - name: round_number
        type: integer
        source: computed
        description: Current briefing round; starts at 1 and increments on every REMAND.
        default: 1
      - name: status
        type: enum
        source: computed
        description: Arbitration stage; cycles BRIEFING -> HEARING -> AWARD_ISSUED -> REMANDED -> BRIEFING.
        default: BRIEFING
        constraints: "one of {BRIEFING, HEARING, AWARD_ISSUED, REMANDED, CLOSED}"
      - name: award_outcome
        type: enum
        source: computed
        description: Disposition of the most recent award.
        default: NONE
        constraints: "one of {NONE, AFFIRM, REDUCE, VACATE, REMAND}"
      - name: assumption_ruling
        type: enum
        source: computed
        description: Arbitrator's ruling on the challenged actuarial assumption.
        default: PENDING
        constraints: "one of {PENDING, SUSTAINED, REJECTED, NOT_RAISED}"
      - name: awarded_net_assessed_cents
        type: integer
        source: computed
        description: Net amount the arbitrator sets; required when award_outcome == REDUCE.
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the arbitration reached CLOSED.
        default: null

  - name: AssetSaleTransaction
    parent: null
    common_fields: true
    fields:
      - name: seller_employer_id
        type: string
        source: input
        description: FK -> Employer.id; the selling contributing employer.
        constraints: required
      - name: buyer_controlled_group_id
        type: string
        source: input
        description: FK -> ControlledGroup.id; the acquiring controlled group.
        constraints: required
      - name: closing_date
        type: datetime
        source: input
        description: Closing date of the asset sale.
        constraints: required, ISO 8601 UTC
      - name: closing_plan_year
        type: integer
        source: input
        description: Plan year C in which the sale closed; anchors the bond lookback.
        constraints: 1900..2200, required, must equal the calendar year of closing_date
      - name: purchase_price_cents
        type: integer
        source: input
        description: Total purchase price; caps the required bond.
        constraints: ">= 0, required"
      - name: bond_amount_cents
        type: integer
        source: input
        description: Bond or escrow actually posted by the purchaser.
        default: 0
        constraints: ">= 0"
      - name: buyer_assumes_contribution_obligation
        type: boolean
        source: input
        description: Whether the purchaser contractually assumed a substantially identical obligation to contribute.
        constraints: required
      - name: workforce_continuity_pct
        type: number
        source: input
        description: Fraction of the seller's covered workforce retained by the purchaser.
        constraints: "0.0..1.0, required"
      - name: asset_continuity_pct
        type: number
        source: input
        description: Fraction of the seller's operating assets acquired.
        constraints: "0.0..1.0, required"
      - name: customer_continuity_pct
        type: number
        source: input
        description: Fraction of the seller's customer relationships continued.
        constraints: "0.0..1.0, required"
      - name: required_bond_cents
        type: integer
        source: computed
        description: Bond amount the sale-of-assets exemption requires; produced by calculations.required_sale_of_assets_bond.
        default: 0
      - name: substantial_continuity_score
        type: number
        source: computed
        description: Weighted continuity score, 4 decimal places; produced by calculations.substantial_continuity_score.
        default: 0.0
      - name: bond_period_end_plan_year
        type: integer
        source: computed
        description: "closing_plan_year + BOND_PERIOD_PLAN_YEARS; last plan year of the contingent-liability bond period."
        default: null
      - name: exemption_status
        type: enum
        source: computed
        description: Disposition of the sale-of-assets exemption claim.
        default: PENDING
        constraints: "one of {PENDING, EXEMPT_4204, NOT_EXEMPT}"
      - name: successor_determination
        type: enum
        source: computed
        description: Disposition of the successor-liability question.
        default: PENDING
        constraints: "one of {PENDING, SUCCESSOR_LIABLE, NO_SUCCESSOR_LIABILITY}"
      - name: status
        type: enum
        source: computed
        description: Due-diligence lifecycle; branches on the trustee's disposition.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, EXEMPTION_CERTIFIED, SUCCESSOR_DETERMINED, REJECTED}"
      - name: adjudicated_at
        type: datetime
        source: computed
        description: Logical-clock instant of adjudication.
        default: null

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:

  # ---------------- PlanYearValuation: linear with supersede ----------------
  - entity: PlanYearValuation
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /plan-year-valuations/{plan_year_valuation_id}/certify, or POST /plan-year-valuations with certify_on_create == true"
        actor: PlanActuary
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "sets certified_by_user_id = X-User-ID and certified_at = current logical clock"
          - "recomputes allocated_uvb_cents (0 at certification) and unallocated_uvb_cents = uvb_total_cents"
        note: "certify_on_create performs DRAFT and DRAFT->CERTIFIED in one request; certify_on_create_used is set true."
      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "POST /plan-year-valuations with the same plan_id and plan_year while no LiabilityAssessment references the incumbent valuation"
        actor: PlanActuary
        preconditions:
          - "status == CERTIFIED"
          - "no LiabilityAssessment has valuation_id == this.id"
        side_effects:
          - "the incumbent valuation's status becomes SUPERSEDED and it is excluded from every denominator and from anchor selection"

  # ---------------- ContributionRecord: linear with amendment ----------------
  - entity: ContributionRecord
    state_field: status
    initial_state: CERTIFIED
    terminal_states: [AMENDED, VOID]
    transitions:
      - from: CERTIFIED
        to: AMENDED
        trigger: "POST /contribution-records carrying supersedes_record_id == this.id"
        actor: FundAdministrator
        preconditions:
          - "status == CERTIFIED"
          - "the incoming record covers exactly the same [plan_year_start, plan_year_end] interval"
        side_effects:
          - "this record leaves every calculation input set; the new record replaces it for the same plan years"
          - "increments Employer.version by 1 and stamps the new record's employer_version_at_apply"
      - from: CERTIFIED
        to: VOID
        trigger: "system: arbitration award VACATE on an assessment whose anchor valuation year overlaps this record's interval and whose assumption_ruling == SUSTAINED for UVB_POOL_ALLOCATION"
        actor: system
        preconditions:
          - "status == CERTIFIED"
          - "Arbitration.assumption_ruling == SUSTAINED and Arbitration.award_outcome == VACATE and ReviewRequest.challenged_assumption == UVB_POOL_ALLOCATION"
        side_effects:
          - "record leaves every calculation input set; Employer.version increments by 1"

  # ---------------- WithdrawalEvent: branching fork-join ----------------
  - entity: WithdrawalEvent
    state_field: status
    initial_state: REPORTED
    terminal_states: [NO_WITHDRAWAL]
    transitions:
      - from: REPORTED
        to: COMPLETE_DETERMINED
        trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine"
        actor: PlanActuary
        preconditions:
          - "status == REPORTED"
          - "a PlanYearValuation with plan_id == Employer.plan_id, plan_year == withdrawal_plan_year - 1 and status == CERTIFIED exists"
          - "calculations.withdrawal_type_determination yields COMPLETE"
        side_effects:
          - "sets determined_type = COMPLETE, partial_withdrawal_fraction = 1.0000, determined_at = clock"
          - "sets Employer.status = COMPLETE_WITHDRAWN and Employer.obligation_end_year = withdrawal_plan_year"
      - from: REPORTED
        to: PARTIAL_DETERMINED
        trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine"
        actor: PlanActuary
        preconditions:
          - "status == REPORTED"
          - "a PlanYearValuation with plan_id == Employer.plan_id, plan_year == withdrawal_plan_year - 1 and status == CERTIFIED exists"
          - "calculations.withdrawal_type_determination yields PARTIAL_70_DECLINE, PARTIAL_CBA_CESSATION or PARTIAL_FACILITY_CESSATION"
        side_effects:
          - "sets determined_type to the partial classification and partial_withdrawal_fraction per calculations.partial_withdrawal_fraction"
          - "sets Employer.status = PARTIAL_WITHDRAWN; leaves Employer.obligation_end_year null"
          - "when determined_type == PARTIAL_CBA_CESSATION, copies ceased_cba_count onto Employer.ceased_cba_count"
        note: "Divergent side-effect set versus the COMPLETE branch: no obligation_end_year is stamped and the fraction is < 1."
      - from: REPORTED
        to: NO_WITHDRAWAL
        trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine"
        actor: PlanActuary
        preconditions:
          - "status == REPORTED"
          - "a PlanYearValuation with plan_id == Employer.plan_id, plan_year == withdrawal_plan_year - 1 and status == CERTIFIED exists"
          - "calculations.withdrawal_type_determination yields NONE"
        side_effects:
          - "sets determined_type = NONE, partial_withdrawal_fraction = 0.0000; Employer.status unchanged"
      - from: COMPLETE_DETERMINED
        to: ASSESSED
        trigger: "POST /liability-assessments/{liability_assessment_id}/issue (join point of both determined branches)"
        actor: PlanTrustee
        preconditions:
          - "status IN {COMPLETE_DETERMINED, PARTIAL_DETERMINED}"
          - "the assessment being issued has withdrawal_event_id == this.id and lifecycle_status == DRAFT"
        side_effects:
          - "every other DRAFT assessment for this event becomes RESCINDED"
      - from: PARTIAL_DETERMINED
        to: ASSESSED
        trigger: "POST /liability-assessments/{liability_assessment_id}/issue (join point of both determined branches)"
        actor: PlanTrustee
        preconditions:
          - "status IN {COMPLETE_DETERMINED, PARTIAL_DETERMINED}"
          - "the assessment being issued has withdrawal_event_id == this.id and lifecycle_status == DRAFT"
        side_effects:
          - "every other DRAFT assessment for this event becomes RESCINDED"
      - from: ASSESSED
        to: NO_WITHDRAWAL
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome == VACATE"
        actor: Arbitrator
        preconditions:
          - "status == ASSESSED"
        side_effects:
          - "sets determined_type = NONE and partial_withdrawal_fraction = 0.0000"
          - "cascade link 4 of the VACATE chain: Employer.status returns to CONTRIBUTING and Employer.obligation_end_year is reset to null"

  # ---------- LiabilityAssessment dimension 1 of 3: lifecycle_status ----------
  - entity: LiabilityAssessment
    state_field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [RESCINDED, FINAL]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /liability-assessments/{liability_assessment_id}/issue"
        actor: PlanTrustee
        preconditions:
          - "lifecycle_status == DRAFT"
          - "X-User-ID != PlanYearValuation[valuation_id].certified_by_user_id (segregation of duties)"
          - "no other assessment for the same withdrawal_event_id has lifecycle_status IN {ISSUED, FINAL}"
        side_effects:
          - "sets issued_at = clock, issued_by_user_id = X-User-ID, review_deadline_at = clock + 90 days"
          - "cascade link 1: mints PaymentSchedule generation 1 with source = ISSUANCE (skipped entirely when net_assessed_cents == 0)"
          - "cascade link 2: because the schedule exists, Installment rows 1..installment_count are minted"
          - "cascade link 3: because installments exist, Employer.outstanding_liability_cents is recomputed"
          - "cascade link 4: because Employer.outstanding_liability_cents changed, ControlledGroup.joint_exposure_cents and exposure_score are recomputed"
          - "PlanYearValuation[valuation_id].allocated_uvb_cents increases by net_assessed_cents and unallocated_uvb_cents decreases by the same amount"
          - "WithdrawalEvent.status becomes ASSESSED; sibling DRAFT assessments become RESCINDED"
          - "when net_assessed_cents == 0 the assessment goes straight to FINAL with collection_status = SATISFIED and no schedule is minted"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome == VACATE"
        actor: Arbitrator
        preconditions:
          - "lifecycle_status == ISSUED"
        side_effects:
          - "VACATE cascade link 1: the ACTIVE-generation PaymentSchedule becomes VOID and refund_due_cents is set to the sum of its amount_paid_cents"
          - "VACATE cascade link 2: because the schedule became VOID, its installments whose status IN {SCHEDULED, DUE, DELINQUENT} become VOID"
          - "VACATE cascade link 3: because those installments became VOID, Employer.outstanding_liability_cents returns to 0"
          - "VACATE cascade link 4: because Employer.outstanding_liability_cents returned to 0, Employer.status returns to CONTRIBUTING and obligation_end_year is reset to null"
          - "VACATE cascade link 5: because Employer.status returned to CONTRIBUTING, ControlledGroup.joint_exposure_cents drops to 0 and exposure_score is recomputed"
          - "PlanYearValuation[valuation_id].allocated_uvb_cents decreases by net_assessed_cents; unallocated_uvb_cents rises by the same amount, preserving PLAN_UVB_ALLOCATION"
          - "review_status becomes ARBITRATED; collection_status becomes NOT_YET_DUE"
      - from: ISSUED
        to: FINAL
        trigger: "POST /collection-sweeps (system) once every dispute avenue is closed"
        actor: system
        preconditions:
          - "lifecycle_status == ISSUED"
          - "review_status == NONE and clock > review_deadline_at, OR review_status == ARBITRATED and the Arbitration status == CLOSED, OR review_status == DECIDED and clock > ReviewRequest.arbitration_deadline_at with no Arbitration row"
        side_effects:
          - "no monetary change; the assessment amount becomes unchallengeable and further review-dimension transitions are rejected"

  # ---------- LiabilityAssessment dimension 2 of 3: review_status ----------
  - entity: LiabilityAssessment
    state_field: review_status
    initial_state: NONE
    terminal_states: [ARBITRATED]
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /review-requests"
        actor: EmployerRepresentative
        preconditions:
          - "lifecycle_status == ISSUED"
          - "review_status == NONE"
          - "clock <= review_deadline_at"
        side_effects:
          - "a ReviewRequest is created in PENDING with plan_response_deadline_at = clock + 120 days"
          - "collection_status is untouched: installments keep their due dates and the employer must keep paying during the dispute"
      - from: REQUESTED
        to: DECIDED
        trigger: "POST /review-requests/{review_request_id}/decide, or POST /collection-sweeps deeming the request denied"
        actor: PlanTrustee | system
        preconditions:
          - "review_status == REQUESTED"
          - "ReviewRequest.status == PENDING"
          - "for the trustee path: X-User-ID != LiabilityAssessment.issued_by_user_id (segregation of duties)"
        side_effects:
          - "ReviewRequest.status becomes DECIDED (trustee) or DEEMED_DENIED (sweep) and arbitration_deadline_at is recomputed"
          - "when decision == REDUCED, ReviewRequest.recomputed_net_assessed_cents is recorded as a proposal only; the assessment amount is unchanged until a new PaymentSchedule generation is minted"
          - "collection_status is untouched"
      - from: DECIDED
        to: ARBITRATED
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome IN {AFFIRM, REDUCE, VACATE}"
        actor: Arbitrator
        preconditions:
          - "review_status == DECIDED"
          - "Arbitration.status == HEARING"
        side_effects:
          - "Arbitration.status becomes CLOSED and closed_at is stamped"
          - "for REDUCE: award_adjustment_cents is raised so that net_assessed_cents == awarded_net_assessed_cents, then the schedule regeneration cascade runs"

  # ---------- LiabilityAssessment dimension 3 of 3: collection_status ----------
  - entity: LiabilityAssessment
    state_field: collection_status
    initial_state: NOT_YET_DUE
    terminal_states: [SATISFIED, ACCELERATED]
    transitions:
      - from: NOT_YET_DUE
        to: CURRENT
        trigger: "POST /installments/{installment_id}/pay (first successful payment on the ACTIVE generation)"
        actor: EmployerRepresentative
        preconditions:
          - "lifecycle_status == ISSUED"
          - "no installment on the ACTIVE generation has status DELINQUENT"
        side_effects:
          - "recomputed by calculations.collection_status_projection; independent of review_status, so a fully disputed assessment can still be CURRENT"
      - from: NOT_YET_DUE
        to: DELINQUENT
        trigger: "POST /collection-sweeps"
        actor: system
        preconditions:
          - "at least one installment on the ACTIVE generation reached its delinquent_on instant unpaid"
        side_effects:
          - "delinquency cascade link 3 (see PaymentSchedule ACTIVE -> DEFAULT_ELIGIBLE)"
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /collection-sweeps"
        actor: system
        preconditions:
          - "at least one installment on the ACTIVE generation reached its delinquent_on instant unpaid"
        side_effects:
          - "Employer.credit_watch becomes true and Employer.delinquency_strikes increases by the number of newly delinquent installments"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /payment-schedules/{payment_schedule_id}/cure"
        actor: EmployerRepresentative
        preconditions:
          - "the ACTIVE generation has status IN {DEFAULT_ELIGIBLE, NOTICED}"
          - "clock <= PaymentSchedule.cure_deadline_at when status == NOTICED"
        side_effects:
          - "every DELINQUENT installment becomes PAID with amount_paid_cents = amount_due_cents"
          - "PaymentSchedule.consecutive_delinquent_count resets to 0 and status returns to ACTIVE"
          - "Employer.credit_watch becomes false; Employer.delinquency_strikes is NOT decremented"
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "POST /payment-schedules/{payment_schedule_id}/default-notice"
        actor: PlanTrustee
        preconditions:
          - "the ACTIVE generation has status == DEFAULT_ELIGIBLE"
        side_effects:
          - "PaymentSchedule.status becomes NOTICED with cure_deadline_at = clock + 60 days"
      - from: DEFAULTED
        to: ACCELERATED
        trigger: "POST /payment-schedules/{payment_schedule_id}/accelerate"
        actor: PlanTrustee
        preconditions:
          - "the ACTIVE generation has status == NOTICED"
          - "clock > PaymentSchedule.cure_deadline_at"
        side_effects:
          - "every installment with status IN {SCHEDULED, DUE, DELINQUENT} becomes ACCELERATED and accelerated_balance_cents is set to the sum of their principal_cents"
          - "PaymentSchedule.status becomes ACCELERATED; Employer.status becomes DEFAULTED"
      - from: CURRENT
        to: SATISFIED
        trigger: "POST /installments/{installment_id}/pay (final unpaid installment)"
        actor: EmployerRepresentative
        preconditions:
          - "after this payment every installment on the ACTIVE generation has status IN {PAID, VOID}"
        side_effects:
          - "PaymentSchedule.status becomes SATISFIED; Employer.outstanding_liability_cents becomes 0 and Employer.status becomes LIABILITY_SATISFIED"
          - "ControlledGroup.joint_exposure_cents is recomputed and drops this employer's contribution"

  # ---------------- PaymentSchedule: branching with supersede ----------------
  - entity: PaymentSchedule
    state_field: status
    initial_state: ACTIVE
    terminal_states: [ACCELERATED, SUPERSEDED, SATISFIED, VOID]
    transitions:
      - from: ACTIVE
        to: DEFAULT_ELIGIBLE
        trigger: "POST /collection-sweeps"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "consecutive_delinquent_count reaches DEFAULT_ELIGIBLE_DELINQUENT_COUNT (2) after the sweep flips installments to DELINQUENT"
        side_effects:
          - "delinquency cascade link 1 (direct sweep effect): installments past delinquent_on become DELINQUENT"
          - "delinquency cascade link 2: because those installments became DELINQUENT, consecutive_delinquent_count reaches 2 and this schedule becomes DEFAULT_ELIGIBLE"
          - "delinquency cascade link 3: because this schedule became DEFAULT_ELIGIBLE, LiabilityAssessment.collection_status becomes DELINQUENT"
          - "delinquency cascade link 4: because the assessment's collection_status became DELINQUENT, Employer.credit_watch becomes true and delinquency_strikes increases"
          - "delinquency cascade link 5: because Employer.credit_watch changed, ControlledGroup.joint_exposure_cents and exposure_score are recomputed"
      - from: DEFAULT_ELIGIBLE
        to: NOTICED
        trigger: "POST /payment-schedules/{payment_schedule_id}/default-notice"
        actor: PlanTrustee
        preconditions:
          - "status == DEFAULT_ELIGIBLE"
        side_effects:
          - "default_notice_issued_at = clock; cure_deadline_at = clock + 60 days; LiabilityAssessment.collection_status becomes DEFAULTED"
      - from: DEFAULT_ELIGIBLE
        to: ACTIVE
        trigger: "POST /payment-schedules/{payment_schedule_id}/cure"
        actor: EmployerRepresentative
        preconditions:
          - "status == DEFAULT_ELIGIBLE"
          - "payment_amount_cents equals the sum of amount_due_cents over installments with status == DELINQUENT"
        side_effects:
          - "DELINQUENT installments become PAID; consecutive_delinquent_count resets to 0; Employer.outstanding_liability_cents drops by the cured principal"
      - from: NOTICED
        to: ACTIVE
        trigger: "POST /payment-schedules/{payment_schedule_id}/cure"
        actor: EmployerRepresentative
        preconditions:
          - "status == NOTICED"
          - "clock <= cure_deadline_at"
          - "payment_amount_cents equals the sum of amount_due_cents over installments with status == DELINQUENT"
        side_effects:
          - "same as DEFAULT_ELIGIBLE -> ACTIVE; default_notice_issued_at and cure_deadline_at are cleared"
      - from: NOTICED
        to: ACCELERATED
        trigger: "POST /payment-schedules/{payment_schedule_id}/accelerate"
        actor: PlanTrustee
        preconditions:
          - "status == NOTICED"
          - "clock > cure_deadline_at"
        side_effects:
          - "installments with status IN {SCHEDULED, DUE, DELINQUENT} become ACCELERATED; accelerated_balance_cents set; Employer.status becomes DEFAULTED; ControlledGroup.joint_exposure_cents recomputed"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /payment-schedules (new generation), or POST /arbitrations/{arbitration_id}/award with award_outcome == REDUCE"
        actor: PlanActuary | Arbitrator
        preconditions:
          - "status IN {ACTIVE, DEFAULT_ELIGIBLE, NOTICED}"
        side_effects:
          - "REDUCE cascade link 1: LiabilityAssessment.award_adjustment_cents rises so net_assessed_cents equals the awarded/recomputed amount"
          - "REDUCE cascade link 2: because net_assessed_cents changed, this schedule becomes SUPERSEDED and a new generation with generation_seq + 1 is minted, carrying applied_credit_cents = sum of amount_paid_cents over all prior generations"
          - "REDUCE cascade link 3: because the new generation exists, this generation's installments with status IN {SCHEDULED, DUE, DELINQUENT} become VOID and fresh installments are minted on the new generation"
          - "REDUCE cascade link 4: because installments changed, Employer.outstanding_liability_cents is recomputed to the new generation's capped_basis_cents"
          - "REDUCE cascade link 5: because Employer.outstanding_liability_cents changed, ControlledGroup.joint_exposure_cents and exposure_score are recomputed"
      - from: DEFAULT_ELIGIBLE
        to: SUPERSEDED
        trigger: "POST /payment-schedules (new generation), or POST /arbitrations/{arbitration_id}/award with award_outcome == REDUCE"
        actor: PlanActuary | Arbitrator
        preconditions:
          - "status == DEFAULT_ELIGIBLE"
        side_effects:
          - "same five-link REDUCE cascade; consecutive_delinquent_count on the superseded generation is frozen and the new generation starts at 0"
      - from: ACTIVE
        to: SATISFIED
        trigger: "POST /installments/{installment_id}/pay (final unpaid installment)"
        actor: EmployerRepresentative
        preconditions:
          - "every installment on this generation has status IN {PAID, VOID} after the payment"
        side_effects:
          - "LiabilityAssessment.collection_status becomes SATISFIED; Employer.status becomes LIABILITY_SATISFIED"
      - from: ACTIVE
        to: VOID
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome == VACATE"
        actor: Arbitrator
        preconditions:
          - "status IN {ACTIVE, DEFAULT_ELIGIBLE, NOTICED}"
        side_effects:
          - "refund_due_cents = sum of amount_paid_cents on this generation; installments with status IN {SCHEDULED, DUE, DELINQUENT} become VOID"

  # ---------------- Installment: branching with cure ----------------
  - entity: Installment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PAID, ACCELERATED, VOID]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "POST /collection-sweeps"
        actor: system
        preconditions:
          - "clock >= due_date"
          - "PaymentSchedule.status IN {ACTIVE, DEFAULT_ELIGIBLE, NOTICED}"
        side_effects:
          - "no monetary change; the installment becomes payable"
      - from: DUE
        to: PAID
        trigger: "POST /installments/{installment_id}/pay"
        actor: EmployerRepresentative
        preconditions:
          - "status IN {DUE, DELINQUENT}"
          - "payment_amount_cents == amount_due_cents"
        side_effects:
          - "amount_paid_cents = amount_due_cents; paid_at = clock"
          - "Employer.outstanding_liability_cents drops by principal_cents; ControlledGroup.joint_exposure_cents recomputed"
      - from: DUE
        to: DELINQUENT
        trigger: "POST /collection-sweeps"
        actor: system
        preconditions:
          - "clock >= delinquent_on"
          - "status == DUE"
        side_effects:
          - "PaymentSchedule.consecutive_delinquent_count increments; Employer.delinquency_strikes increments"
      - from: DELINQUENT
        to: PAID
        trigger: "POST /installments/{installment_id}/pay, or POST /payment-schedules/{payment_schedule_id}/cure"
        actor: EmployerRepresentative
        preconditions:
          - "status == DELINQUENT"
          - "for the per-installment path: payment_amount_cents == amount_due_cents"
        side_effects:
          - "amount_paid_cents = amount_due_cents; PaymentSchedule.consecutive_delinquent_count decrements (floor 0)"
      - from: DELINQUENT
        to: ACCELERATED
        trigger: "POST /payment-schedules/{payment_schedule_id}/accelerate"
        actor: PlanTrustee
        preconditions:
          - "PaymentSchedule.status == NOTICED and clock > PaymentSchedule.cure_deadline_at"
        side_effects:
          - "principal_cents rolls into PaymentSchedule.accelerated_balance_cents"
      - from: SCHEDULED
        to: ACCELERATED
        trigger: "POST /payment-schedules/{payment_schedule_id}/accelerate"
        actor: PlanTrustee
        preconditions:
          - "PaymentSchedule.status == NOTICED and clock > PaymentSchedule.cure_deadline_at"
        side_effects:
          - "principal_cents rolls into PaymentSchedule.accelerated_balance_cents"
      - from: SCHEDULED
        to: VOID
        trigger: "system: PaymentSchedule becomes SUPERSEDED or VOID"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, DUE, DELINQUENT}"
        side_effects:
          - "principal_cents leaves Employer.outstanding_liability_cents"
      - from: DUE
        to: VOID
        trigger: "system: PaymentSchedule becomes SUPERSEDED or VOID"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, DUE, DELINQUENT}"
        side_effects:
          - "principal_cents leaves Employer.outstanding_liability_cents"
      - from: DELINQUENT
        to: VOID
        trigger: "system: PaymentSchedule becomes SUPERSEDED or VOID"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, DUE, DELINQUENT}"
        side_effects:
          - "principal_cents leaves Employer.outstanding_liability_cents; consecutive_delinquent_count on the superseded generation is frozen"

  # ---------------- ReviewRequest: branching ----------------
  - entity: ReviewRequest
    state_field: status
    initial_state: PENDING
    terminal_states: [DECIDED, DEEMED_DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: DECIDED
        trigger: "POST /review-requests/{review_request_id}/decide"
        actor: PlanTrustee
        preconditions:
          - "status == PENDING"
          - "LiabilityAssessment.lifecycle_status == ISSUED"
          - "X-User-ID != LiabilityAssessment.issued_by_user_id"
        side_effects:
          - "decided_at = clock; decided_by_user_id = X-User-ID; arbitration_deadline_at recomputed per calculations.arbitration_window"
          - "LiabilityAssessment.review_status becomes DECIDED"
          - "when decision == REDUCED, recomputed_net_assessed_cents must be supplied and is stored as a proposal"
      - from: PENDING
        to: DEEMED_DENIED
        trigger: "POST /collection-sweeps"
        actor: system
        preconditions:
          - "status == PENDING"
          - "clock >= plan_response_deadline_at"
        side_effects:
          - "arbitration_deadline_at recomputed as min(plan_response_deadline_at + 60 days, filed_at + 180 days)"
          - "LiabilityAssessment.review_status becomes DECIDED"
      - from: PENDING
        to: WITHDRAWN
        trigger: "system: arbitration award VACATE rescinds the underlying assessment"
        actor: system
        preconditions:
          - "status == PENDING"
          - "LiabilityAssessment.lifecycle_status becomes RESCINDED"
        side_effects:
          - "no further decision may be recorded"

  # ---------------- Arbitration: cyclic with remand rounds ----------------
  - entity: Arbitration
    state_field: status
    initial_state: BRIEFING
    terminal_states: [CLOSED]
    transitions:
      - from: BRIEFING
        to: HEARING
        trigger: "POST /arbitrations/{arbitration_id}/advance with to_status == HEARING"
        actor: Arbitrator
        preconditions:
          - "status == BRIEFING"
        side_effects:
          - "no monetary change"
      - from: HEARING
        to: AWARD_ISSUED
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome == REMAND"
        actor: Arbitrator
        preconditions:
          - "status == HEARING"
          - "round_number < MAX_ARBITRATION_ROUNDS"
        side_effects:
          - "records award_outcome = REMAND and assumption_ruling; the assessment amount is untouched"
      - from: AWARD_ISSUED
        to: REMANDED
        trigger: "system: immediately after an award with award_outcome == REMAND is recorded"
        actor: system
        preconditions:
          - "award_outcome == REMAND"
        side_effects:
          - "round_number increments by 1"
      - from: REMANDED
        to: BRIEFING
        trigger: "POST /arbitrations/{arbitration_id}/advance with to_status == BRIEFING"
        actor: Arbitrator
        preconditions:
          - "status == REMANDED"
          - "round_number <= MAX_ARBITRATION_ROUNDS"
        side_effects:
          - "closes the cycle BRIEFING -> HEARING -> AWARD_ISSUED -> REMANDED -> BRIEFING"
      - from: HEARING
        to: CLOSED
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome IN {AFFIRM, REDUCE, VACATE}"
        actor: Arbitrator
        preconditions:
          - "status == HEARING"
        side_effects:
          - "closed_at = clock; LiabilityAssessment.review_status becomes ARBITRATED"
          - "AFFIRM: no monetary change"
          - "REDUCE: runs the five-link schedule regeneration cascade documented on PaymentSchedule ACTIVE -> SUPERSEDED"
          - "VACATE: runs the five-link rescission cascade documented on LiabilityAssessment ISSUED -> RESCINDED"

  # ---------------- Employer: cyclic (withdrawal and reversion) ----------------
  - entity: Employer
    state_field: status
    initial_state: CONTRIBUTING
    terminal_states: [DEFAULTED, LIABILITY_SATISFIED]
    transitions:
      - from: CONTRIBUTING
        to: COMPLETE_WITHDRAWN
        trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine yielding COMPLETE"
        actor: PlanActuary
        preconditions:
          - "status == CONTRIBUTING"
        side_effects:
          - "obligation_end_year = WithdrawalEvent.withdrawal_plan_year"
      - from: CONTRIBUTING
        to: PARTIAL_WITHDRAWN
        trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine yielding a PARTIAL_* type"
        actor: PlanActuary
        preconditions:
          - "status == CONTRIBUTING"
        side_effects:
          - "obligation_end_year stays null; ceased_cba_count is copied for PARTIAL_CBA_CESSATION"
      - from: PARTIAL_WITHDRAWN
        to: COMPLETE_WITHDRAWN
        trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine yielding COMPLETE on a later WithdrawalEvent"
        actor: PlanActuary
        preconditions:
          - "status == PARTIAL_WITHDRAWN"
        side_effects:
          - "obligation_end_year = the later event's withdrawal_plan_year"
      - from: COMPLETE_WITHDRAWN
        to: CONTRIBUTING
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome == VACATE"
        actor: Arbitrator
        preconditions:
          - "status IN {COMPLETE_WITHDRAWN, PARTIAL_WITHDRAWN}"
          - "outstanding_liability_cents returns to 0 after the VACATE cascade"
        side_effects:
          - "obligation_end_year reset to null; credit_watch reset to false; closes the cycle CONTRIBUTING -> COMPLETE_WITHDRAWN -> CONTRIBUTING"
      - from: PARTIAL_WITHDRAWN
        to: CONTRIBUTING
        trigger: "POST /arbitrations/{arbitration_id}/award with award_outcome == VACATE"
        actor: Arbitrator
        preconditions:
          - "status == PARTIAL_WITHDRAWN"
          - "outstanding_liability_cents returns to 0 after the VACATE cascade"
        side_effects:
          - "ceased_cba_count reset to 0"
      - from: COMPLETE_WITHDRAWN
        to: DEFAULTED
        trigger: "POST /payment-schedules/{payment_schedule_id}/accelerate"
        actor: PlanTrustee
        preconditions:
          - "status IN {COMPLETE_WITHDRAWN, PARTIAL_WITHDRAWN}"
        side_effects:
          - "outstanding_liability_cents is replaced by the accelerated balance carried on the schedule"
      - from: COMPLETE_WITHDRAWN
        to: LIABILITY_SATISFIED
        trigger: "POST /installments/{installment_id}/pay (final unpaid installment)"
        actor: EmployerRepresentative
        preconditions:
          - "status IN {COMPLETE_WITHDRAWN, PARTIAL_WITHDRAWN}"
          - "outstanding_liability_cents becomes 0"
        side_effects:
          - "ControlledGroup.joint_exposure_cents drops this employer's contribution"

  # ---------------- AssetSaleTransaction: branching fork ----------------
  - entity: AssetSaleTransaction
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [EXEMPTION_CERTIFIED, SUCCESSOR_DETERMINED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: EXEMPTION_CERTIFIED
        trigger: "POST /asset-sale-transactions/{asset_sale_transaction_id}/adjudicate with disposition == CERTIFY_4204_EXEMPTION"
        actor: PlanTrustee
        preconditions:
          - "status == SUBMITTED"
          - "bond_amount_cents >= required_bond_cents"
          - "buyer_assumes_contribution_obligation == true"
          - "seller Employer.status == CONTRIBUTING"
        side_effects:
          - "exemption_status becomes EXEMPT_4204; bond_period_end_plan_year = closing_plan_year + 5"
          - "buyer ControlledGroup.bond_posture becomes BONDED and contingent_exposure_cents rises by required_bond_cents"
          - "buyer ControlledGroup.exposure_score is recomputed under the SELLER_CONTINUING variant"
          - "seller Employer.status is untouched: the sale is not treated as a withdrawal"
      - from: SUBMITTED
        to: SUCCESSOR_DETERMINED
        trigger: "POST /asset-sale-transactions/{asset_sale_transaction_id}/adjudicate with disposition == DETERMINE_SUCCESSOR"
        actor: PlanTrustee
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "substantial_continuity_score is computed; successor_determination becomes SUCCESSOR_LIABLE when the score >= 0.7000, else NO_SUCCESSOR_LIABILITY"
          - "when SUCCESSOR_LIABLE, buyer ControlledGroup.joint_exposure_cents rises by the seller Employer.outstanding_liability_cents and exposure_score is recomputed under the SUCCESSOR_ASSUMPTION variant"
          - "exemption_status becomes NOT_EXEMPT; bond_posture is untouched"
        note: "Divergent side-effect set versus the exemption branch: no bond period, joint exposure moves instead of contingent exposure."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /asset-sale-transactions/{asset_sale_transaction_id}/adjudicate with disposition == REJECT"
        actor: PlanTrustee
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "exemption_status becomes NOT_EXEMPT; successor_determination becomes NO_SUCCESSOR_LIABILITY; no exposure figures change"

# ===========================================================================
# §1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: contribution-record-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /contribution-records"
    occ_field: "expected_employer_version"
    description: |
      Filing a contribution record against an Employer whose version has advanced
      since the client last observed it is rejected. Contribution history is
      legitimately amendable — an audit correction may supersede a CERTIFIED
      record for the same plan years — so a second writer working from a stale
      view of the employer would otherwise silently overwrite an amendment that
      already landed. The stale-version check forces the writer to re-read.
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412

  - rule_id: schedule-generation-stale-assessment
    parent_entity: LiabilityAssessment
    write_endpoint: "POST /payment-schedules"
    occ_field: "expected_assessment_version"
    description: |
      Minting a new PaymentSchedule generation against a LiabilityAssessment whose
      version has advanced since the client last observed it is rejected. A new
      generation legitimately supersedes the incumbent one, so nothing in the
      state machine stops a second regeneration; the stale-version check is the
      only thing that prevents a regeneration derived from an obsolete
      net_assessed_cents from replacing a newer generation.
    error_id: ERR_STALE_ASSESSMENT_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:

  - name: per_year_contribution_index
    trigger: "Evaluated as an input set by withdrawal_type_determination, seventy_percent_decline_test, allocation_fraction_and_gross_share, annual_payment_amount and required_sale_of_assets_bond; recomputed on every POST /withdrawal-events/{id}/determine and POST /liability-assessments."
    algorithm: aggregation
    formula: |
      # For Employer E and plan year y:
      recs = ContributionRecord rows where employer_id == E.id
                                   and status == 'CERTIFIED'
                                   and plan_year_start <= y <= plan_year_end
      # The overlap validation (priority 11) guarantees |recs| <= 1.
      if recs is empty:
          cbu(y) = 0 ; dollars(y) = 0 ; rate(y) = 0
      else:
          r  = recs[0]
          n  = r.plan_year_end - r.plan_year_start + 1
          bc = r.contribution_base_units // n            # floor division
          rc = r.contribution_base_units - bc * n        # remainder in whole CBUs
          cbu(y) = bc + (rc if y == r.plan_year_start else 0)
          ba = r.contribution_amount_cents // n
          ra = r.contribution_amount_cents - ba * n
          dollars(y) = ba + (ra if y == r.plan_year_start else 0)
          rate(y) = r.contribution_rate_cents_per_cbu
      # Plan-wide denominators come from the anchor-eligible valuation set:
      vals(y) = PlanYearValuation rows with plan_id == E.plan_id
                                     and plan_year == y
                                     and status == 'CERTIFIED'
      if vals(y) is empty: all_dollars(y) = 0 ; all_cbu(y) = 0
      else: v = vals(y) ordered by certified_at DESC, then created_at DESC, first row
            all_dollars(y) = v.all_employer_contributions_cents
            all_cbu(y)     = v.all_employer_cbu
    input_set: "Only ContributionRecord rows with status == CERTIFIED and only PlanYearValuation rows with status == CERTIFIED. AMENDED, VOID and SUPERSEDED rows are excluded from every window."
    constants:
      REMAINDER_ASSIGNMENT: earliest_plan_year_in_interval
    precision: "Whole contribution base units and whole cents; floor division with the entire remainder assigned to the earliest plan year of the record's interval."

  - name: anchor_valuation_selector
    trigger: "POST /liability-assessments, before any allocation arithmetic runs."
    algorithm: aggregation
    formula: |
      W = WithdrawalEvent.withdrawal_plan_year
      candidates = PlanYearValuation rows where plan_id == Employer.plan_id
                                          and plan_year == W - 1
                                          and status == 'CERTIFIED'
      # eligibility filter: exactly the predicate above (DRAFT and SUPERSEDED excluded)
      # ranking expression: certified_at DESC
      # tie-break: created_at DESC
      # empty-candidate fallback: reject with ERR_VALUATION_YEAR_MISSING (422)
      valuation_id = candidates ordered by (certified_at DESC, created_at DESC) first row .id
    input_set: "PlanYearValuation rows for the employer's plan and plan year W-1 whose status == CERTIFIED."
    constants:
      VALUATION_QUIET_BUFFER_DAYS: 30
    precision: "Not numeric; selection only."

  - name: allocation_fraction_and_gross_share
    trigger: "POST /liability-assessments; the value is written to LiabilityAssessment.gross_allocated_cents and (for PRESUMPTIVE only) pool_term_breakdown."
    algorithm: forward_looking
    formula: |
      W  = WithdrawalEvent.withdrawal_plan_year
      AV = the anchor valuation chosen by anchor_valuation_selector (plan year W-1)
      f  = WithdrawalEvent.partial_withdrawal_fraction   # 1.0000 for COMPLETE

      # ---- step A: complete-withdrawal basis, by pinned method ----
      if allocation_method_applied == 'MODIFIED_PRESUMPTIVE':
          num   = sum(dollars(t)     for t in [W-5 .. W-1])
          den   = sum(all_dollars(t) for t in [W-5 .. W-1])
          basis = round_half_up(AV.uvb_total_cents * num / den)      # ONE rounding, at the end

      elif allocation_method_applied == 'ROLLING_5':
          num   = sum(cbu(t)     for t in [W-5 .. W-1])
          den   = sum(all_cbu(t) for t in [W-5 .. W-1])
          basis = round_half_up(AV.uvb_total_cents * num / den)      # ONE rounding, CBU basis

      elif allocation_method_applied == 'PRESUMPTIVE':
          basis = 0 ; breakdown = []
          for y in [W-3, W-2, W-1]:                                  # ascending
              V     = the CERTIFIED valuation for plan year y
              decay = max(0, 1 - POOL_DECAY_PER_YEAR * (W - 1 - y))
              rnum  = sum(dollars(t)     for t in [y-2 .. y])
              rden  = sum(all_dollars(t) for t in [y-2 .. y])
              ratio = 0 if rden == 0 else rnum / rden
              term  = round_half_up(V.uvb_pool_cents * decay * ratio) # ROUND EVERY TERM
              breakdown.append({plan_year: y, decay_factor: decay,
                                ratio: round(ratio, 10), term_cents: term})
              basis += term
          # Rounding order is PINNED: round each pool term to whole cents FIRST,
          # then sum. Summing the unrounded terms and rounding once is WRONG and
          # can differ by one or more cents.

      else:  # DIRECT_ATTRIBUTION
          num   = sum(cbu(t)     for t in [W-5 .. W-1])
          den   = sum(all_cbu(t) for t in [W-5 .. W-1])
          share = 0 if den == 0 else round_half_up(Plan.unattributable_uvb_cents * num / den)
          basis = max(0, Employer.directly_attributed_vested_benefits_cents
                         - Employer.directly_attributed_assets_cents
                         + share)

      # ---- step B: partial-withdrawal scaling (second rounding, pinned order) ----
      gross_allocated_cents = basis if f == 1.0000 else round_half_up(basis * f)
      # The fraction is applied to the ALREADY-ROUNDED basis, never to the
      # unrounded intermediate.
    input_set: "CERTIFIED ContributionRecord rows of the withdrawing employer and CERTIFIED PlanYearValuation rows of its plan; every plan year in [W-5, W-1] must have a CERTIFIED valuation or the request is rejected with ERR_VALUATION_YEAR_MISSING."
    constants:
      RATIO_WINDOW_YEARS: 5
      PRESUMPTIVE_POOL_YEARS: 3
      PRESUMPTIVE_RATIO_WINDOW_YEARS: 3
      POOL_DECAY_PER_YEAR: 0.05
    precision: "Whole cents, round_half_up. PRESUMPTIVE rounds once per pool term and then sums; MODIFIED_PRESUMPTIVE, ROLLING_5 and DIRECT_ATTRIBUTION round exactly once at the end. Partial scaling adds one further rounding applied to the rounded basis."
    variants:
      - name: dollar_basis_pool_decayed
        when: "allocation_method_applied == PRESUMPTIVE"
        difference: "Three decayed annual pools, three-year rolling dollar ratios, one rounding per pool term."
      - name: dollar_basis_single_pool
        when: "allocation_method_applied == MODIFIED_PRESUMPTIVE"
        difference: "Single total-UVB pool, five-year dollar ratio, one rounding overall."
      - name: cbu_basis_single_pool
        when: "allocation_method_applied == ROLLING_5"
        difference: "Same single pool as MODIFIED_PRESUMPTIVE but the ratio is built from contribution base units instead of dollars, so identical data yields a different number whenever the employer's rate profile differs from the plan average."
      - name: direct_attribution
        when: "allocation_method_applied == DIRECT_ATTRIBUTION"
        difference: "Employer-specific vested benefits net of attributed assets plus a CBU-weighted share of the unattributable pool; ignores AV.uvb_total_cents entirely."

  - name: de_minimis_reduction
    trigger: "POST /liability-assessments, immediately after allocation_fraction_and_gross_share."
    algorithm: threshold
    formula: |
      UVB = anchor_valuation.uvb_total_cents
      if de_minimis_variant_applied == 'STATUTORY':
          CAP = DE_MINIMIS_CAP_STATUTORY_CENTS            # 5000000
          PHS = DE_MINIMIS_PHASEOUT_START_STATUTORY_CENTS # 10000000
      else:
          CAP = DE_MINIMIS_CAP_HIGH_CENTS                 # 15000000
          PHS = DE_MINIMIS_PHASEOUT_START_HIGH_CENTS      # 15000000
      base = min(CAP, floor(UVB * DE_MINIMIS_UVB_FRACTION_BPS / 10000))
      if Plan.mass_withdrawal_declared:
          reduction = 0
      elif gross_allocated_cents <= PHS:                   # INCLUSIVE at the boundary
          reduction = base
      else:
          reduction = max(0, base - (gross_allocated_cents - PHS))
      de_minimis_reduction_cents = min(reduction, gross_allocated_cents)
      net_assessed_cents = gross_allocated_cents - de_minimis_reduction_cents
                                                 - award_adjustment_cents
    input_set: "The single anchor valuation and the plan's pinned de minimis variant; no other rows participate."
    constants:
      DE_MINIMIS_CAP_STATUTORY_CENTS: 5000000
      DE_MINIMIS_PHASEOUT_START_STATUTORY_CENTS: 10000000
      DE_MINIMIS_CAP_HIGH_CENTS: 15000000
      DE_MINIMIS_PHASEOUT_START_HIGH_CENTS: 15000000
      DE_MINIMIS_UVB_FRACTION_BPS: 75
    precision: "Whole cents; the 0.75%-of-UVB figure is FLOORED, the comparison at the phase-out start is inclusive (<=)."

  - name: annual_payment_amount
    trigger: "POST /liability-assessments; writes high_3yr_average_cbu, high_3yr_window_start_year, peak_contribution_rate_cents_per_cbu, peak_rate_plan_year and annual_payment_cents."
    algorithm: aggregation
    formula: |
      W = WithdrawalEvent.withdrawal_plan_year
      # ranking expression: three-consecutive-plan-year average CBU, DESC
      # tie-break: smallest window start year (earliest window wins)
      best = null
      for s in [W-10 .. W-3]:                       # ascending, so ties keep the earliest s
          avg = (cbu(s) + cbu(s+1) + cbu(s+2)) / 3
          if best is null or avg > best.avg: best = {s: s, avg: avg}
      high_3yr_average_cbu     = round_half_up(best.avg, 4)
      high_3yr_window_start_year = best.s
      # ranking expression: rate(y) DESC ; tie-break: smallest y
      pk = null
      for y in [W-10 .. W-1]:                       # ascending
          if pk is null or rate(y) > pk.rate: pk = {y: y, rate: rate(y)}
      peak_contribution_rate_cents_per_cbu = pk.rate
      peak_rate_plan_year                  = pk.y
      annual_payment_cents = round_half_up(high_3yr_average_cbu
                                           * peak_contribution_rate_cents_per_cbu)
      # empty-candidate fallback: when annual_payment_cents == 0 the assessment
      # cannot be amortized -> ERR_ANNUAL_PAYMENT_ZERO (422)
    input_set: "cbu(y) and rate(y) from per_year_contribution_index for y in [W-10, W-1]; years with no CERTIFIED record contribute 0."
    constants:
      ANNUAL_PAYMENT_LOOKBACK_YEARS: 10
      HIGH_AVERAGE_WINDOW_YEARS: 3
    precision: "high_3yr_average_cbu at 4 decimal places round_half_up; annual_payment_cents in whole cents round_half_up of the 4-decimal average times the integer rate."

  - name: amortization_and_twenty_year_cap
    trigger: "Whenever a PaymentSchedule generation is minted: POST /liability-assessments/{id}/issue, POST /payment-schedules, and the REDUCE branch of POST /arbitrations/{id}/award."
    algorithm: waterfall_allocation
    formula: |
      i  = PaymentSchedule.interest_rate_bps / 10000
      A  = LiabilityAssessment.annual_payment_cents
      applied_credit_cents    = sum of Installment.amount_paid_cents over EVERY
                                prior generation of this assessment
      amortization_basis_cents = LiabilityAssessment.net_assessed_cents
                                 - applied_credit_cents
      P  = amortization_basis_cents
      PV(n) = A * (1 - (1 + i) ** (-n)) / i

      # --- EVALUATION ORDER IS PINNED. The dependency looks circular
      #     (P -> n -> forgiven -> P); the order below breaks it. ---
      # STEP 1: n_req = smallest integer n in [1 .. MAX_AMORTIZATION_SEARCH_YEARS]
      #         with PV(n) >= P ; null when no such n exists.
      # STEP 2: if Plan.mass_withdrawal_declared:
      #             if n_req is null -> reject ERR_UNAMORTIZABLE_ASSESSMENT (422)
      #             else amortization_years = n_req ; forgiven_by_cap_cents = 0
      #         else:
      #             if n_req is not null and n_req <= 20:
      #                 amortization_years = n_req ; forgiven_by_cap_cents = 0
      #             else:
      #                 amortization_years  = 20
      #                 forgiven_by_cap_cents = P - round_half_up(PV(20))
      # STEP 3: capped_basis_cents = P - forgiven_by_cap_cents
      #         forgiven_by_cap_cents was derived from the PRE-cap P in STEP 2 and
      #         is NEVER recomputed from capped_basis_cents.
      # STEP 4: installment_count            = amortization_years * 4
      #         quarterly_installment_cents  = capped_basis_cents // installment_count
      #         final_installment_cents      = capped_basis_cents
      #                                      - quarterly_installment_cents
      #                                        * (installment_count - 1)
      #         principal_cents(k) = quarterly_installment_cents for k < installment_count
      #         principal_cents(installment_count) = final_installment_cents
      #         amount_due_cents(k) = principal_cents(k)
      #         first_due_date = clock + FIRST_DUE_OFFSET_DAYS
      #         due_date(k)    = first_due_date + 3 * (k - 1) calendar months,
      #                          day clamped to the last day of the target month
      #         delinquent_on(k) = due_date(k) + INSTALLMENT_GRACE_DAYS
      # INVARIANT EMPLOYER_LIABILITY_DECOMPOSITION:
      #   sum(principal_cents over this generation)
      #     + forgiven_by_cap_cents + applied_credit_cents
      #   == LiabilityAssessment.net_assessed_cents
    input_set: "The assessment's net_assessed_cents and annual_payment_cents plus the sum of amount_paid_cents over all prior generations of the same assessment (installments with status VOID still count toward applied_credit_cents if they were paid before being voided)."
    constants:
      MAX_AMORTIZATION_YEARS_CAP: 20
      MAX_AMORTIZATION_SEARCH_YEARS: 100
      FIRST_DUE_OFFSET_DAYS: 60
      INSTALLMENT_INTERVAL_MONTHS: 3
      INSTALLMENT_GRACE_DAYS: 60
    precision: "Present values are computed in exact decimal arithmetic and rounded_half_up to whole cents only where the formula says so; the entire floor-division remainder lands on the final installment."
    variants:
      - name: capped_twenty_year
        when: "Plan.mass_withdrawal_declared == false and no n in [1..100] satisfies PV(n) >= P, or the smallest such n exceeds 20"
        difference: "Exactly 20 annual payments; the shortfall between P and PV(20) is forgiven and never collected."
      - name: uncapped_mass_withdrawal
        when: "Plan.mass_withdrawal_declared == true"
        difference: "The 20-year ceiling is disapplied; the schedule runs to n_req even beyond 20 years, and an assessment whose annual payment can never amortize the basis is rejected outright instead of being forgiven."

  - name: collection_status_projection
    trigger: "Recomputed after every POST /installments/{id}/pay, POST /payment-schedules/{id}/cure, POST /payment-schedules/{id}/default-notice, POST /payment-schedules/{id}/accelerate, POST /payment-schedules, POST /collection-sweeps and the REDUCE/VACATE branches of POST /arbitrations/{id}/award."
    algorithm: projection
    formula: |
      S = the PaymentSchedule for this assessment whose status IN
          {ACTIVE, DEFAULT_ELIGIBLE, NOTICED, ACCELERATED, SATISFIED}
          # eligibility filter as written; ranking: generation_seq DESC;
          # tie-break: created_at DESC; empty fallback: NOT_YET_DUE
      if S is null:                          collection_status = NOT_YET_DUE
      elif S.status == 'ACCELERATED':        collection_status = ACCELERATED
      elif S.status == 'NOTICED':            collection_status = DEFAULTED
      elif S.status == 'SATISFIED':          collection_status = SATISFIED
      elif any installment of S has status == 'DELINQUENT':
                                             collection_status = DELINQUENT
      elif any installment of S has status == 'PAID':
                                             collection_status = CURRENT
      else:                                  collection_status = NOT_YET_DUE
      # review_status is NOT an input: the dispute dimension and the collection
      # dimension evolve independently on the same row.
    input_set: "Only the highest-generation non-terminal PaymentSchedule of the assessment and its installments; SUPERSEDED and VOID generations are ignored."
    constants:
      DEFAULT_ELIGIBLE_DELINQUENT_COUNT: 2
      CURE_WINDOW_DAYS: 60
    precision: "Not numeric."

  - name: withdrawal_type_determination
    trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine."
    algorithm: constraint_propagation
    formula: |
      rules_variant = CONSTRUCTION_RULES   if Plan.industry == 'CONSTRUCTION'
                      ENTERTAINMENT_RULES  if Plan.industry == 'ENTERTAINMENT'
                      GENERAL_RULES        otherwise

      if rules_variant == 'GENERAL_RULES':
          CONTRIBUTION_OBLIGATION_CEASED -> COMPLETE
          COVERED_WORK_CEASED            -> COMPLETE
          CBU_DECLINE  -> PARTIAL_70_DECLINE when seventy_percent_decline_test
                          reports decline_ratio <= DECLINE_THRESHOLD, else NONE
          CBA_PARTIAL_CESSATION -> COMPLETE                  if ceased_cba_count >= Employer.cba_count
                                   PARTIAL_CBA_CESSATION     if 0 < ceased_cba_count < Employer.cba_count
                                   reject ERR_CBA_CESSATION_COUNT_INVALID if ceased_cba_count == 0
          FACILITY_CESSATION -> PARTIAL_FACILITY_CESSATION

      elif rules_variant == 'CONSTRUCTION_RULES':
          CONTRIBUTION_OBLIGATION_CEASED -> COMPLETE if Employer.covered_work_status == 'PERFORMING' else NONE
          COVERED_WORK_CEASED            -> COMPLETE if Employer.covered_work_status == 'PERFORMING' else NONE
          CBU_DECLINE           -> reject ERR_PARTIAL_WITHDRAWAL_NOT_AVAILABLE (the
                                   70% decline test does not apply to the construction industry)
          CBA_PARTIAL_CESSATION -> same as GENERAL_RULES
          FACILITY_CESSATION    -> reject ERR_PARTIAL_WITHDRAWAL_NOT_AVAILABLE

      else:  # ENTERTAINMENT_RULES
          CONTRIBUTION_OBLIGATION_CEASED -> COMPLETE if Employer.covered_work_status == 'PERFORMING' else NONE
          COVERED_WORK_CEASED            -> COMPLETE if Employer.covered_work_status == 'PERFORMING' else NONE
          CBU_DECLINE           -> reject ERR_PARTIAL_WITHDRAWAL_NOT_AVAILABLE
          CBA_PARTIAL_CESSATION -> reject ERR_PARTIAL_WITHDRAWAL_NOT_AVAILABLE
          FACILITY_CESSATION    -> PARTIAL_FACILITY_CESSATION
    input_set: "Plan.industry, Employer.covered_work_status, Employer.cba_count, WithdrawalEvent.reported_cause, WithdrawalEvent.ceased_cba_count, and cbu(y) from per_year_contribution_index."
    constants:
      DECLINE_THRESHOLD: 0.30
    precision: "Not numeric; classification only."
    variants:
      - name: general_rules
        when: "Plan.industry IN {GENERAL, TRUCKING}"
        difference: "Cessation of the contribution obligation alone is a complete withdrawal, and both the 70% decline test and the facility-cessation partial are available."
      - name: construction_rules
        when: "Plan.industry == CONSTRUCTION"
        difference: "A complete withdrawal additionally requires that the employer still performs covered work in the jurisdiction; neither the 70% decline test nor the facility-cessation partial is available."
      - name: entertainment_rules
        when: "Plan.industry == ENTERTAINMENT"
        difference: "Same continued-covered-work requirement as construction, but the facility-cessation partial IS available while the CBA-cessation partial is not."

  - name: seventy_percent_decline_test
    trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine when reported_cause == CBU_DECLINE and rules_variant == GENERAL_RULES."
    algorithm: threshold
    formula: |
      W    = withdrawal_plan_year
      TEST = [W-2, W-1, W]                       # three-plan-year testing period
      POOL = [W-7, W-6, W-5, W-4, W-3]           # five plan years preceding TEST
      # ranking expression: cbu(y) DESC ; tie-break: smaller plan year first
      ordered = POOL sorted by (cbu(y) DESC, y ASC)
      b1, b2  = the first two entries of ordered, then relabelled so
                base_year_one = min(b1, b2) and base_year_two = max(b1, b2)
      high_base_year_average_cbu = round_half_up((cbu(b1) + cbu(b2)) / 2, 4)
      testing_period_average_cbu = round_half_up((cbu(W-2) + cbu(W-1) + cbu(W)) / 3, 4)
      decline_ratio = 0.000000 if high_base_year_average_cbu == 0
                      else round_half_up(testing_period_average_cbu
                                         / high_base_year_average_cbu, 6)
      is_seventy_percent_decline = (decline_ratio <= DECLINE_THRESHOLD)   # INCLUSIVE
    input_set: "cbu(y) from per_year_contribution_index for y in [W-7, W]; a plan year with no CERTIFIED record contributes 0 and remains eligible for base-year selection."
    constants:
      DECLINE_TEST_TESTING_PERIOD_YEARS: 3
      DECLINE_TEST_BASE_POOL_YEARS: 5
      DECLINE_TEST_BASE_YEARS_USED: 2
      DECLINE_THRESHOLD: 0.30
    precision: "Averages at 4 decimal places round_half_up; decline_ratio at 6 decimal places round_half_up; the threshold comparison is <= (a ratio of exactly 0.300000 IS a 70% decline)."

  - name: partial_withdrawal_fraction
    trigger: "POST /withdrawal-events/{withdrawal_event_id}/determine, immediately after withdrawal_type_determination yields a partial classification."
    algorithm: threshold
    formula: |
      W = withdrawal_plan_year
      if determined_type == 'COMPLETE':                 f = 1.0000
      elif determined_type == 'NONE':                   f = 0.0000
      elif determined_type == 'PARTIAL_70_DECLINE':
          avg5 = (cbu(W-5) + cbu(W-4) + cbu(W-3) + cbu(W-2) + cbu(W-1)) / 5
          f = 0.0000 if avg5 == 0 else
              round_half_up(clamp(1 - cbu(W) / avg5, 0, 1), 4)
      elif determined_type == 'PARTIAL_CBA_CESSATION':
          f = round_half_up(ceased_cba_count / Employer.cba_count, 4)
      else:  # PARTIAL_FACILITY_CESSATION
          f = 0.0000 if cbu(W-1) == 0 else
              round_half_up(clamp(1 - cbu(W) / cbu(W-1), 0, 1), 4)
    input_set: "cbu(y) from per_year_contribution_index for y in [W-5, W], plus Employer.cba_count and WithdrawalEvent.ceased_cba_count."
    constants: {}
    precision: "4 decimal places, round_half_up, clamped into [0.0000, 1.0000]."

  - name: arbitration_window
    trigger: "Recomputed on POST /review-requests, POST /review-requests/{id}/decide and every POST /collection-sweeps that deems a request denied; read by POST /arbitrations."
    algorithm: interval_merge
    formula: |
      plan_response_deadline_at = filed_at + PLAN_RESPONSE_WINDOW_DAYS days
      if status == 'DECIDED':
          trigger_at = min(decided_at, plan_response_deadline_at)
      elif status == 'DEEMED_DENIED':
          trigger_at = plan_response_deadline_at
      else:  # PENDING
          trigger_at = null
      inner_bound = null if trigger_at is null
                    else trigger_at + ARBITRATION_WINDOW_DAYS days
      outer_bound = filed_at + ARBITRATION_OUTER_WINDOW_DAYS days
      arbitration_deadline_at = outer_bound if inner_bound is null
                                else min(inner_bound, outer_bound)
      # POST /arbitrations is timely when clock <= arbitration_deadline_at
      # (INCLUSIVE at the exact instant).
    input_set: "The single ReviewRequest row addressed by the arbitration attempt."
    constants:
      REVIEW_WINDOW_DAYS: 90
      PLAN_RESPONSE_WINDOW_DAYS: 120
      ARBITRATION_WINDOW_DAYS: 60
      ARBITRATION_OUTER_WINDOW_DAYS: 180
      MAX_ARBITRATION_ROUNDS: 3
    precision: "Whole days added to the stored UTC instant; comparisons at second granularity, inclusive at the deadline instant."

  - name: required_sale_of_assets_bond
    trigger: "POST /asset-sale-transactions (stored on the row) and re-verified on POST /asset-sale-transactions/{id}/adjudicate with disposition == CERTIFY_4204_EXEMPTION."
    algorithm: tiered_pricing
    formula: |
      C    = closing_plan_year
      avg3 = round_half_up((dollars(C-1) + dollars(C-2) + dollars(C-3)) / 3)
      last = dollars(C-1)
      required_bond_cents = min(max(avg3, last), purchase_price_cents)
      # Three inputs interacting non-linearly through a nested max/min: the
      # greater of the three-year average and the most recent year, then capped
      # by the purchase price.
    input_set: "dollars(y) from per_year_contribution_index for the SELLER employer and y in [C-3, C-1]; years with no CERTIFIED record contribute 0."
    constants:
      BOND_PERIOD_PLAN_YEARS: 5
      BOND_LOOKBACK_YEARS: 3
    precision: "Whole cents; the three-year average is rounded_half_up before the max/min comparison, never after."

  - name: substantial_continuity_score
    trigger: "POST /asset-sale-transactions/{id}/adjudicate with disposition == DETERMINE_SUCCESSOR."
    algorithm: weighted_scoring
    formula: |
      score = round_half_up(CONTINUITY_WEIGHT_WORKFORCE * workforce_continuity_pct
                          + CONTINUITY_WEIGHT_ASSETS    * asset_continuity_pct
                          + CONTINUITY_WEIGHT_CUSTOMERS * customer_continuity_pct, 4)
      successor_determination = SUCCESSOR_LIABLE if score >= SUCCESSOR_CONTINUITY_THRESHOLD
                                else NO_SUCCESSOR_LIABILITY     # >= is INCLUSIVE
    input_set: "The three continuity fractions on the single AssetSaleTransaction row."
    constants:
      CONTINUITY_WEIGHT_WORKFORCE: 0.50
      CONTINUITY_WEIGHT_ASSETS: 0.30
      CONTINUITY_WEIGHT_CUSTOMERS: 0.20
      SUCCESSOR_CONTINUITY_THRESHOLD: 0.70
    precision: "4 decimal places, round_half_up; the threshold comparison is >= (a score of exactly 0.7000 IS successor liability)."

  - name: controlled_group_exposure_score
    trigger: "Recomputed whenever any Employer of the group changes status or outstanding_liability_cents, and on both adjudication branches of POST /asset-sale-transactions/{id}/adjudicate."
    algorithm: weighted_scoring
    formula: |
      joint_exposure_cents = sum(Employer.outstanding_liability_cents
          for Employer where controlled_group_id == G.id
          and status IN {PARTIAL_WITHDRAWN, COMPLETE_WITHDRAWN, DEFAULTED})
      contingent_exposure_cents = sum(AssetSaleTransaction.required_bond_cents
          for txn where buyer_controlled_group_id == G.id
          and exemption_status == 'EXEMPT_4204'
          and bond_period_end_plan_year >= calendar year of the current clock)
      # variant selection is driven by the most recently adjudicated transaction
      # of the group, ranked by adjudicated_at DESC, tie-break created_at DESC;
      # empty fallback: SELLER_CONTINUING with contingent_exposure_cents == 0
      if variant == 'SELLER_CONTINUING':
          exposure_score = round_half_up((joint_exposure_cents
              + CONTINGENT_EXPOSURE_WEIGHT_4204 * contingent_exposure_cents)
              / 100000, 4)
      else:  # SUCCESSOR_ASSUMPTION
          exposure_score = round_half_up((joint_exposure_cents
              + contingent_exposure_cents) / 100000, 4)
    input_set: "Employer rows of the group filtered to the three withdrawn/defaulted statuses, and EXEMPT_4204 transactions whose bond period has not lapsed."
    constants:
      CONTINGENT_EXPOSURE_WEIGHT_4204: 0.25
    precision: "4 decimal places, round_half_up; exposure is expressed in units of 1000 dollars (100000 cents)."
    variants:
      - name: SELLER_CONTINUING
        when: "the group's most recently adjudicated transaction has exemption_status == EXEMPT_4204"
        difference: "Only a quarter of the bonded contingent exposure is scored, because the seller remains primarily liable during the bond period."
      - name: SUCCESSOR_ASSUMPTION
        when: "the group's most recently adjudicated transaction has successor_determination == SUCCESSOR_LIABLE"
        difference: "The full contingent exposure is scored and the seller's outstanding liability also lands inside joint_exposure_cents, so identical dollar inputs produce a materially higher score than SELLER_CONTINUING."

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body shape: every required field present, enum values members of the declared set, integers within declared ranges, numbers within 0.0..1.0 where declared, plan_year_start <= plan_year_end, measurement_window_end > measurement_window_start, withdrawal_plan_year equals the calendar year of cessation_date, closing_plan_year equals the calendar year of closing_date, proposed_interest_rate_bps present exactly when challenged_assumption == INTEREST_RATE, recomputed_net_assessed_cents present exactly when decision == REDUCED, awarded_net_assessed_cents present exactly when award_outcome == REDUCE, limit within 1..100, offset >= 0."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every path-templated id resolves, validated left to right."
    error_id: ERR_PLAN_NOT_FOUND | ERR_CONTROLLED_GROUP_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_CONTRIBUTION_RECORD_NOT_FOUND | ERR_WITHDRAWAL_EVENT_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_INSTALLMENT_NOT_FOUND | ERR_REVIEW_REQUEST_NOT_FOUND | ERR_ARBITRATION_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path-templated id"

  - priority: 5
    category: existence
    check: "Every foreign key carried in the request body resolves, validated in the order the fields are declared in §1.5's input list."
    error_id: ERR_PLAN_NOT_FOUND | ERR_CONTROLLED_GROUP_NOT_FOUND | ERR_EMPLOYER_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_REVIEW_REQUEST_NOT_FOUND | ERR_CONTRIBUTION_RECORD_NOT_FOUND | ERR_WITHDRAWAL_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /employers, POST /plan-year-valuations, POST /contribution-records, POST /withdrawal-events, POST /liability-assessments, POST /payment-schedules, POST /review-requests, POST /arbitrations, POST /asset-sale-transactions, POST /collection-sweeps"

  - priority: 6
    category: auth
    check: "When X-User-Role == EmployerRepresentative, X-User-ID equals the id of the Employer that owns the target resource, resolved through Employer.id, WithdrawalEvent.employer_id, LiabilityAssessment -> WithdrawalEvent.employer_id, PaymentSchedule -> LiabilityAssessment -> WithdrawalEvent.employer_id, Installment -> PaymentSchedule -> ..., ReviewRequest -> LiabilityAssessment -> ..., or AssetSaleTransaction.seller_employer_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /withdrawal-events, POST /review-requests, POST /arbitrations, POST /installments/{installment_id}/pay, POST /payment-schedules/{payment_schedule_id}/cure, POST /asset-sale-transactions"

  - priority: 7
    category: state
    check: "expected_employer_version equals the current Employer.version."
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412
    applies_to: "POST /contribution-records"

  - priority: 7
    category: state
    check: "expected_assessment_version equals the current LiabilityAssessment.version."
    error_id: ERR_STALE_ASSESSMENT_VERSION
    http_status: 412
    applies_to: "POST /payment-schedules"

  - priority: 8
    category: state
    check: "PlanYearValuation.status == DRAFT."
    error_id: ERR_VALUATION_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /plan-year-valuations/{plan_year_valuation_id}/certify"

  - priority: 8
    category: state
    check: "WithdrawalEvent.status == REPORTED."
    error_id: ERR_WITHDRAWAL_ALREADY_DETERMINED
    http_status: 409
    applies_to: "POST /withdrawal-events/{withdrawal_event_id}/determine"

  - priority: 8
    category: state
    check: "WithdrawalEvent.status IN {COMPLETE_DETERMINED, PARTIAL_DETERMINED}; a REPORTED event yields ERR_WITHDRAWAL_NOT_DETERMINED and a NO_WITHDRAWAL event yields ERR_NO_WITHDRAWAL_DETERMINED."
    error_id: ERR_WITHDRAWAL_NOT_DETERMINED | ERR_NO_WITHDRAWAL_DETERMINED
    http_status: 409
    applies_to: "POST /liability-assessments"

  - priority: 8
    category: state
    check: "LiabilityAssessment.lifecycle_status == DRAFT."
    error_id: ERR_ASSESSMENT_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /liability-assessments/{liability_assessment_id}/issue"

  - priority: 8
    category: state
    check: "LiabilityAssessment.lifecycle_status == ISSUED; a RESCINDED assessment yields ERR_ASSESSMENT_RESCINDED and a DRAFT or FINAL one yields ERR_ASSESSMENT_NOT_ISSUED."
    error_id: ERR_ASSESSMENT_NOT_ISSUED | ERR_ASSESSMENT_RESCINDED
    http_status: 409
    applies_to: "POST /review-requests, POST /payment-schedules, POST /review-requests/{review_request_id}/decide, POST /arbitrations"

  - priority: 8
    category: state
    check: "LiabilityAssessment.review_status == NONE (only one review dimension entry point exists)."
    error_id: ERR_DUPLICATE_REVIEW_REQUEST
    http_status: 409
    applies_to: "POST /review-requests"

  - priority: 8
    category: state
    check: "ReviewRequest.status == PENDING."
    error_id: ERR_REVIEW_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /review-requests/{review_request_id}/decide"

  - priority: 8
    category: state
    check: "PaymentSchedule.status == DEFAULT_ELIGIBLE."
    error_id: ERR_SCHEDULE_NOT_DEFAULT_ELIGIBLE
    http_status: 409
    applies_to: "POST /payment-schedules/{payment_schedule_id}/default-notice"

  - priority: 8
    category: state
    check: "PaymentSchedule.status == NOTICED."
    error_id: ERR_SCHEDULE_NOT_NOTICED
    http_status: 409
    applies_to: "POST /payment-schedules/{payment_schedule_id}/accelerate"

  - priority: 8
    category: state
    check: "PaymentSchedule.status IN {DEFAULT_ELIGIBLE, NOTICED}."
    error_id: ERR_SCHEDULE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /payment-schedules/{payment_schedule_id}/cure"

  - priority: 8
    category: state
    check: "Installment.status IN {DUE, DELINQUENT}."
    error_id: ERR_INSTALLMENT_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /installments/{installment_id}/pay"

  - priority: 8
    category: state
    check: "Arbitration.status == HEARING for an award; Arbitration.status == BRIEFING for advance to HEARING and == REMANDED for advance to BRIEFING; a CLOSED arbitration rejects both."
    error_id: ERR_ARBITRATION_NOT_IN_AWARDABLE_STATE | ERR_INVALID_ARBITRATION_ADVANCE | ERR_ARBITRATION_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /arbitrations/{arbitration_id}/advance, POST /arbitrations/{arbitration_id}/award"

  - priority: 8
    category: state
    check: "AssetSaleTransaction.status == SUBMITTED."
    error_id: ERR_TRANSACTION_ALREADY_ADJUDICATED
    http_status: 409
    applies_to: "POST /asset-sale-transactions/{asset_sale_transaction_id}/adjudicate"

  - priority: 9
    category: business_safety
    check: "X-User-ID must differ from PlanYearValuation[valuation_id].certified_by_user_id when issuing an assessment, and from LiabilityAssessment.issued_by_user_id when deciding the request for review."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /liability-assessments/{liability_assessment_id}/issue, POST /review-requests/{review_request_id}/decide"

  - priority: 9
    category: business_safety
    check: "bond_amount_cents >= required_bond_cents."
    error_id: ERR_4204_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /asset-sale-transactions/{asset_sale_transaction_id}/adjudicate with disposition == CERTIFY_4204_EXEMPTION"

  - priority: 9
    category: business_safety
    check: "The logical clock is strictly after PaymentSchedule.cure_deadline_at; the statutory cure period may not be cut short."
    error_id: ERR_CURE_DEADLINE_NOT_EXPIRED
    http_status: 409
    applies_to: "POST /payment-schedules/{payment_schedule_id}/accelerate"

  - priority: 10
    category: business_referential
    check: "A CERTIFIED PlanYearValuation exists for the employer's plan for every plan year in [W-5, W-1] on assessment creation, and for plan year W-1 on withdrawal determination."
    error_id: ERR_VALUATION_YEAR_MISSING
    http_status: 422
    applies_to: "POST /liability-assessments, POST /withdrawal-events/{withdrawal_event_id}/determine"

  - priority: 10
    category: business_referential
    check: "At least one CERTIFIED ContributionRecord covers at least one plan year in [W-5, W-1]."
    error_id: ERR_EMPTY_CONTRIBUTION_WINDOW
    http_status: 422
    applies_to: "POST /liability-assessments"

  - priority: 10
    category: business_referential
    check: "The referenced ReviewRequest's status IN {DECIDED, DEEMED_DENIED}; a PENDING or WITHDRAWN request is not a gateway to arbitration. This rule looks only at the request's own status, so a DECIDED request that belongs to some other assessment passes here and is caught later at priority 12."
    error_id: ERR_REVIEW_REQUEST_NOT_DECIDED
    http_status: 422
    applies_to: "POST /arbitrations"

  - priority: 10
    category: business_referential
    check: "For source == REVIEW_DECISION a ReviewRequest with status == DECIDED, decision == REDUCED and a non-null recomputed_net_assessed_cents must exist for the assessment; for source == ARBITRATION_AWARD an Arbitration with award_outcome == REDUCE must exist; for source == ACTUARIAL_CORRECTION override_net_assessed_cents must be supplied. In every case the conceded amount must be at or below the assessment's current net_assessed_cents, because award_adjustment_cents only ever increases."
    error_id: ERR_NO_REDUCTION_TO_APPLY
    http_status: 422
    applies_to: "POST /payment-schedules"

  - priority: 11
    category: business_temporal
    check: "The logical clock is at or before LiabilityAssessment.review_deadline_at."
    error_id: ERR_REVIEW_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /review-requests"

  - priority: 11
    category: business_temporal
    check: "The logical clock is at or before ReviewRequest.arbitration_deadline_at."
    error_id: ERR_ARBITRATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /arbitrations"

  - priority: 11
    category: business_temporal
    check: "The new record's closed plan-year interval [plan_year_start, plan_year_end] shares no plan year with any other CERTIFIED ContributionRecord of the same employer. Touching endpoints are permitted: an existing interval ending in year Y and a new interval starting in Y+1 do not conflict. The record named by supersedes_record_id is excluded from the comparison."
    error_id: ERR_CONTRIBUTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /contribution-records"

  - priority: 11
    category: business_temporal
    check: "The new valuation's half-open window [measurement_window_start, measurement_window_end) neither intersects nor starts inside the quiet buffer of any DRAFT or CERTIFIED valuation of the same plan: reject when measurement_window_start < other.measurement_window_end + VALUATION_QUIET_BUFFER_DAYS and measurement_window_end > other.measurement_window_start. A window starting exactly at other.measurement_window_end + 30 days is permitted."
    error_id: ERR_VALUATION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /plan-year-valuations"

  - priority: 11
    category: business_temporal
    check: "to_iso8601 is strictly after the current logical clock; the clock never runs backwards."
    error_id: ERR_CLOCK_MUST_ADVANCE
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 12
    category: business_constraint
    check: "ein is unique across all Employer rows."
    error_id: ERR_DUPLICATE_EIN
    http_status: 409
    applies_to: "POST /employers"

  - priority: 12
    category: business_constraint
    check: "The ReviewRequest named by review_request_id has liability_assessment_id equal to the liability_assessment_id named in the same request, so an employer cannot borrow another employer's decided request for review as its own gateway to arbitration."
    error_id: ERR_EMPLOYER_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /arbitrations"

  - priority: 12
    category: business_constraint
    check: "Arbitration.round_number < MAX_ARBITRATION_ROUNDS before a REMAND award, and <= MAX_ARBITRATION_ROUNDS before advancing back to BRIEFING."
    error_id: ERR_ARBITRATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /arbitrations/{arbitration_id}/award, POST /arbitrations/{arbitration_id}/advance"

  - priority: 12
    category: business_constraint
    check: "ceased_cba_count is strictly greater than 0 when reported_cause == CBA_PARTIAL_CESSATION."
    error_id: ERR_CBA_CESSATION_COUNT_INVALID
    http_status: 422
    applies_to: "POST /withdrawal-events/{withdrawal_event_id}/determine"

  - priority: 12
    category: business_constraint
    check: "The reported cause is available under the plan's rules_variant per calculations.withdrawal_type_determination."
    error_id: ERR_PARTIAL_WITHDRAWAL_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /withdrawal-events/{withdrawal_event_id}/determine"

  - priority: 12
    category: business_constraint
    check: "buyer_assumes_contribution_obligation is true."
    error_id: ERR_4204_OBLIGATION_NOT_ASSUMED
    http_status: 422
    applies_to: "POST /asset-sale-transactions/{asset_sale_transaction_id}/adjudicate with disposition == CERTIFY_4204_EXEMPTION"

  - priority: 12
    category: business_constraint
    check: "When supersedes_record_id is supplied, the referenced record has status == CERTIFIED, the same employer_id, and exactly the same plan_year_start and plan_year_end."
    error_id: ERR_SUPERSEDED_RECORD_PERIOD_MISMATCH
    http_status: 422
    applies_to: "POST /contribution-records"

  - priority: 13
    category: business_fiscal
    check: "payment_amount_cents equals Installment.amount_due_cents exactly; partial and over payments are rejected."
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /installments/{installment_id}/pay"

  - priority: 13
    category: business_fiscal
    check: "payment_amount_cents equals the sum of amount_due_cents over the schedule's DELINQUENT installments exactly."
    error_id: ERR_CURE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /payment-schedules/{payment_schedule_id}/cure"

  - priority: 13
    category: business_fiscal
    check: "annual_payment_cents computed from the contribution history is strictly greater than 0."
    error_id: ERR_ANNUAL_PAYMENT_ZERO
    http_status: 422
    applies_to: "POST /liability-assessments"

  - priority: 13
    category: business_fiscal
    check: "When Plan.mass_withdrawal_declared is true, some n in [1, MAX_AMORTIZATION_SEARCH_YEARS] satisfies PV(n) >= amortization_basis_cents; otherwise the assessment can never be amortized and no cap is available to forgive the shortfall."
    error_id: ERR_UNAMORTIZABLE_ASSESSMENT
    http_status: 422
    applies_to: "POST /liability-assessments/{liability_assessment_id}/issue, POST /payment-schedules"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:

  # ---------------- Plan ----------------
  - method: POST
    path: "/plans"
    description: "Register a multiemployer plan with its adopted allocation method, de minimis election and discount-rate assumption."
    roles: [FundAdministrator]
    code: 201
    input: ["name", "industry?", "allocation_method?", "de_minimis_variant?", "interest_rate_bps", "unattributable_uvb_cents?", "mass_withdrawal_declared?"]
    output: Plan
    side_effects: ["initializes employer_count = 0 and issued_assessment_count = 0"]

  - method: PATCH
    path: "/plans/{plan_id}"
    description: "Amend the plan's adopted allocation method, de minimis election, discount rate, unattributable pool or mass-withdrawal declaration. Existing assessments keep the values pinned at their creation."
    roles: [FundAdministrator]
    code: 200
    input: ["allocation_method?", "de_minimis_variant?", "interest_rate_bps?", "unattributable_uvb_cents?", "mass_withdrawal_declared?"]
    output: Plan
    side_effects: ["increments Plan.version by 1", "no recomputation of existing LiabilityAssessment rows"]

  - method: GET
    path: "/plans/{plan_id}"
    description: "Read a plan."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: Plan
    side_effects: []

  # ---------------- ControlledGroup ----------------
  - method: POST
    path: "/controlled-groups"
    description: "Register a controlled group whose members are jointly and severally liable."
    roles: [FundAdministrator]
    code: 201
    input: [name, common_control_basis]
    output: ControlledGroup
    side_effects: ["initializes bond_posture = UNBONDED, joint_exposure_cents = 0, contingent_exposure_cents = 0, exposure_score = 0.0"]

  - method: GET
    path: "/controlled-groups/{controlled_group_id}"
    description: "Read a controlled group including its recomputed joint, contingent and scored exposure."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: ControlledGroup
    side_effects: []

  # ---------------- Employer ----------------
  - method: POST
    path: "/employers"
    description: "Register a contributing employer under a plan and a controlled group."
    roles: [FundAdministrator]
    code: 201
    input: ["plan_id", "controlled_group_id", "legal_name", "ein", "obligation_start_year", "covered_work_status?", "cba_count?", "directly_attributed_vested_benefits_cents?", "directly_attributed_assets_cents?"]
    output: Employer
    side_effects: ["increments Plan.employer_count by 1", "initializes status = CONTRIBUTING, outstanding_liability_cents = 0, version = 1"]

  - method: GET
    path: "/employers"
    description: "List employers, filterable by plan, controlled group and status."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["plan_id?", "controlled_group_id?", "status?", "limit?", "offset?"]
    output: Employer[]
    side_effects: []

  - method: GET
    path: "/employers/{employer_id}"
    description: "Read an employer, including the current version needed for optimistic-concurrency writes against its contribution history."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: PATCH
    path: "/employers/{employer_id}"
    description: "Amend the employer's covered-work status, bargaining-agreement count or direct-attribution figures."
    roles: [FundAdministrator]
    code: 200
    input: ["covered_work_status?", "cba_count?", "directly_attributed_vested_benefits_cents?", "directly_attributed_assets_cents?"]
    output: Employer
    side_effects: ["increments Employer.version by 1"]

  # ---------------- PlanYearValuation ----------------
  - method: POST
    path: "/plan-year-valuations"
    description: "File an actuarial valuation for one plan year. When certify_on_create is true the valuation is created and certified in the same act, stamping certified_by_user_id with the acting actuary's X-User-ID."
    roles: [PlanActuary]
    code: 201
    input: ["plan_id", "plan_year", "measurement_window_start", "measurement_window_end", "uvb_total_cents", "uvb_pool_cents", "all_employer_contributions_cents", "all_employer_cbu", "interest_rate_bps", "certify_on_create?"]
    output: PlanYearValuation
    side_effects: ["an incumbent CERTIFIED valuation for the same plan_id and plan_year with no referencing assessment becomes SUPERSEDED", "sets unallocated_uvb_cents = uvb_total_cents"]

  - method: POST
    path: "/plan-year-valuations/{plan_year_valuation_id}/certify"
    description: "Certify a DRAFT valuation, stamping the certifying actuary's X-User-ID for the later segregation-of-duties check."
    roles: [PlanActuary]
    code: 200
    input: []
    output: PlanYearValuation
    side_effects: ["sets status = CERTIFIED, certified_by_user_id, certified_at", "increments PlanYearValuation.version by 1"]

  - method: GET
    path: "/plan-year-valuations"
    description: "List valuations, filterable by plan, plan year and certification status."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["plan_id?", "plan_year?", "status?", "limit?", "offset?"]
    output: PlanYearValuation[]
    side_effects: []

  - method: GET
    path: "/plan-year-valuations/{plan_year_valuation_id}"
    description: "Read a valuation including allocated and unallocated unfunded vested benefits."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: PlanYearValuation
    side_effects: []

  # ---------------- ContributionRecord ----------------
  - method: POST
    path: "/contribution-records"
    description: "File a certified contribution record covering one or more consecutive plan years, optionally superseding an earlier record for exactly the same interval."
    roles: [FundAdministrator]
    code: 201
    input: ["employer_id", "plan_year_start", "plan_year_end", "contribution_base_units", "contribution_amount_cents", "contribution_rate_cents_per_cbu", "expected_employer_version", "supersedes_record_id?"]
    output: ContributionRecord
    side_effects: ["increments Employer.version by 1 and records the new value on employer_version_at_apply", "the superseded record's status becomes AMENDED"]

  - method: GET
    path: "/contribution-records"
    description: "List contribution records, filterable by employer, covered plan year, status and superseded record."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["employer_id?", "plan_year?", "status?", "supersedes_record_id?", "limit?", "offset?"]
    output: ContributionRecord[]
    side_effects: []

  - method: GET
    path: "/contribution-records/{contribution_record_id}"
    description: "Read a contribution record."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: ContributionRecord
    side_effects: []

  # ---------------- WithdrawalEvent ----------------
  - method: POST
    path: "/withdrawal-events"
    description: "Report a cessation of the contribution obligation, of covered work, of a bargaining agreement, of a facility, or a decline in contribution base units."
    roles: [FundAdministrator, EmployerRepresentative]
    code: 201
    input: ["employer_id", "cessation_date", "withdrawal_plan_year", "reported_cause", "ceased_cba_count?"]
    output: WithdrawalEvent
    side_effects: ["sets rules_variant from Plan.industry", "status = REPORTED, determined_type = NONE"]

  - method: POST
    path: "/withdrawal-events/{withdrawal_event_id}/determine"
    description: "Determine whether the reported cessation is a complete withdrawal, a partial withdrawal, or no withdrawal, applying the industry rule set and the seventy-percent decline test."
    roles: [PlanActuary]
    code: 200
    input: []
    output: WithdrawalEvent
    side_effects: ["runs calculations.withdrawal_type_determination, seventy_percent_decline_test and partial_withdrawal_fraction", "sets Employer.status and, for COMPLETE, Employer.obligation_end_year", "increments Employer.version by 1"]

  - method: GET
    path: "/withdrawal-events"
    description: "List withdrawal events, filterable by employer and determination status."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["employer_id?", "status?", "limit?", "offset?"]
    output: WithdrawalEvent[]
    side_effects: []

  - method: GET
    path: "/withdrawal-events/{withdrawal_event_id}"
    description: "Read a withdrawal event including the decline-test audit figures."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: WithdrawalEvent
    side_effects: []

  # ---------------- LiabilityAssessment ----------------
  - method: POST
    path: "/liability-assessments"
    description: "Compute a draft withdrawal liability assessment: select the anchor valuation, allocate unfunded vested benefits under the plan's currently adopted method, apply the de minimis reduction and derive the level annual payment from the contribution history."
    roles: [PlanActuary]
    code: 201
    input: [withdrawal_event_id]
    output: LiabilityAssessment
    side_effects: ["pins allocation_method_applied, de_minimis_variant_applied and interest_rate_bps_applied", "runs anchor_valuation_selector, allocation_fraction_and_gross_share, de_minimis_reduction and annual_payment_amount", "no PaymentSchedule is minted and no state outside the assessment changes"]

  - method: POST
    path: "/liability-assessments/{liability_assessment_id}/issue"
    description: "Issue the notice and demand for payment, starting the ninety-day request-for-review clock and minting the first payment-schedule generation."
    roles: [PlanTrustee]
    code: 200
    input: []
    output: LiabilityAssessment
    side_effects: ["five-link issuance cascade: schedule -> installments -> Employer.outstanding_liability_cents -> ControlledGroup.joint_exposure_cents and exposure_score", "debits PlanYearValuation.unallocated_uvb_cents by net_assessed_cents", "WithdrawalEvent.status becomes ASSESSED and sibling DRAFT assessments become RESCINDED", "increments Plan.issued_assessment_count by 1"]

  - method: GET
    path: "/liability-assessments"
    description: "List assessments, filterable by withdrawal event, anchor valuation and any of the three independent state dimensions."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["withdrawal_event_id?", "valuation_id?", "lifecycle_status?", "review_status?", "collection_status?", "limit?", "offset?"]
    output: LiabilityAssessment[]
    side_effects: []

  - method: GET
    path: "/liability-assessments/{liability_assessment_id}"
    description: "Read an assessment including the per-pool allocation breakdown, the tie-break audit fields and the current version needed for optimistic-concurrency schedule regeneration."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: LiabilityAssessment
    side_effects: []

  # ---------------- PaymentSchedule ----------------
  - method: POST
    path: "/payment-schedules"
    description: "Mint a new payment-schedule generation for an issued assessment after a review decision, an arbitration award, or an actuarial correction, superseding the incumbent generation."
    roles: [PlanActuary]
    code: 201
    input: ["liability_assessment_id", "expected_assessment_version", "source", "override_net_assessed_cents?"]
    output: PaymentSchedule
    side_effects: ["raises LiabilityAssessment.award_adjustment_cents so net_assessed_cents equals the conceded amount", "five-link regeneration cascade: assessment amount -> supersede incumbent -> void and re-mint installments -> Employer.outstanding_liability_cents -> ControlledGroup exposure", "increments LiabilityAssessment.version by 1"]

  - method: GET
    path: "/payment-schedules"
    description: "List payment-schedule generations, filterable by assessment and status."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["liability_assessment_id?", "status?", "limit?", "offset?"]
    output: PaymentSchedule[]
    side_effects: []

  - method: GET
    path: "/payment-schedules/{payment_schedule_id}"
    description: "Read a payment-schedule generation including the amount forgiven by the twenty-year cap."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: PaymentSchedule
    side_effects: []

  - method: POST
    path: "/payment-schedules/{payment_schedule_id}/default-notice"
    description: "Issue the written notice of default on a schedule that has accumulated two delinquent installments, opening the sixty-day cure window."
    roles: [PlanTrustee]
    code: 200
    input: []
    output: PaymentSchedule
    side_effects: ["sets default_notice_issued_at and cure_deadline_at", "LiabilityAssessment.collection_status becomes DEFAULTED"]

  - method: POST
    path: "/payment-schedules/{payment_schedule_id}/cure"
    description: "Cure every delinquent installment on the schedule with a single exact payment, restoring the schedule to ACTIVE."
    roles: [EmployerRepresentative]
    code: 200
    input: [payment_amount_cents]
    output: PaymentSchedule
    side_effects: ["DELINQUENT installments become PAID", "consecutive_delinquent_count resets to 0 and status returns to ACTIVE", "Employer.outstanding_liability_cents and credit_watch are recomputed; delinquency_strikes is not decremented"]

  - method: POST
    path: "/payment-schedules/{payment_schedule_id}/accelerate"
    description: "Accelerate the entire remaining balance after the cure window has expired unremedied."
    roles: [PlanTrustee]
    code: 200
    input: []
    output: PaymentSchedule
    side_effects: ["remaining installments become ACCELERATED and accelerated_balance_cents is set", "LiabilityAssessment.collection_status becomes ACCELERATED and Employer.status becomes DEFAULTED", "ControlledGroup.joint_exposure_cents and exposure_score are recomputed"]

  # ---------------- Installment ----------------
  - method: GET
    path: "/installments"
    description: "List installments, filterable by schedule generation and status; ordered by sequence_number ascending."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["payment_schedule_id?", "status?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []

  - method: GET
    path: "/installments/{installment_id}"
    description: "Read a single installment."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: Installment
    side_effects: []

  - method: POST
    path: "/installments/{installment_id}/pay"
    description: "Remit the exact amount due for one installment. Payments continue to be required while a review or arbitration is pending."
    roles: [EmployerRepresentative]
    code: 200
    input: [payment_amount_cents]
    output: Installment
    side_effects: ["sets amount_paid_cents and paid_at; status becomes PAID", "Employer.outstanding_liability_cents drops by principal_cents", "LiabilityAssessment.collection_status is recomputed; the final payment drives it to SATISFIED and Employer.status to LIABILITY_SATISFIED"]

  # ---------------- ReviewRequest ----------------
  - method: POST
    path: "/review-requests"
    description: "File the employer's request for review within ninety days of notification, optionally challenging an actuarial assumption and proposing a different interest rate."
    roles: [EmployerRepresentative]
    code: 201
    input: ["liability_assessment_id", "grounds_summary", "challenged_assumption?", "proposed_interest_rate_bps?"]
    output: ReviewRequest
    side_effects: ["LiabilityAssessment.review_status becomes REQUESTED; collection_status and the installment due dates are untouched", "sets plan_response_deadline_at and arbitration_deadline_at"]

  - method: POST
    path: "/review-requests/{review_request_id}/decide"
    description: "Record the plan sponsor's decision on the request for review and its ruling on the challenged actuarial assumption."
    roles: [PlanTrustee]
    code: 200
    input: ["decision", "assumption_ruling", "recomputed_net_assessed_cents?"]
    output: ReviewRequest
    side_effects: ["sets decided_at, decided_by_user_id and recomputes arbitration_deadline_at", "LiabilityAssessment.review_status becomes DECIDED; no monetary field on the assessment changes"]

  - method: GET
    path: "/review-requests"
    description: "List requests for review, filterable by assessment and status."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["liability_assessment_id?", "status?", "limit?", "offset?"]
    output: ReviewRequest[]
    side_effects: []

  - method: GET
    path: "/review-requests/{review_request_id}"
    description: "Read a request for review including its computed plan-response and arbitration deadlines."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: ReviewRequest
    side_effects: []

  # ---------------- Arbitration ----------------
  - method: POST
    path: "/arbitrations"
    description: "Initiate mandatory arbitration within the statutory window after the plan's review decision or its deemed denial."
    roles: [EmployerRepresentative]
    code: 201
    input: [liability_assessment_id, review_request_id]
    output: Arbitration
    side_effects: ["sets initiated_at, round_number = 1, status = BRIEFING"]

  - method: POST
    path: "/arbitrations/{arbitration_id}/advance"
    description: "Advance the arbitration from briefing to hearing, or back to briefing after a remand."
    roles: [Arbitrator]
    code: 200
    input: [to_status]
    output: Arbitration
    side_effects: ["status transitions per the arbitration cycle; no monetary change"]

  - method: POST
    path: "/arbitrations/{arbitration_id}/award"
    description: "Issue the arbitrator's award: affirm, reduce, vacate, or remand for a further round, together with the ruling on the challenged actuarial assumption."
    roles: [Arbitrator]
    code: 200
    input: ["award_outcome", "assumption_ruling", "awarded_net_assessed_cents?"]
    output: Arbitration
    side_effects: ["REMAND: status becomes REMANDED and round_number increments", "AFFIRM: status becomes CLOSED and LiabilityAssessment.review_status becomes ARBITRATED", "REDUCE: five-link regeneration cascade documented on PaymentSchedule ACTIVE -> SUPERSEDED, and LiabilityAssessment.version increments", "VACATE: five-link rescission cascade documented on LiabilityAssessment ISSUED -> RESCINDED"]

  - method: GET
    path: "/arbitrations"
    description: "List arbitrations, filterable by assessment, originating review request and status."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["liability_assessment_id?", "review_request_id?", "status?", "limit?", "offset?"]
    output: Arbitration[]
    side_effects: []

  - method: GET
    path: "/arbitrations/{arbitration_id}"
    description: "Read an arbitration including its current briefing round."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: Arbitration
    side_effects: []

  # ---------------- AssetSaleTransaction ----------------
  - method: POST
    path: "/asset-sale-transactions"
    description: "Submit an asset sale for withdrawal-liability due diligence, declaring the bond posted and the continuity metrics."
    roles: [EmployerRepresentative, FundAdministrator]
    code: 201
    input: [seller_employer_id, buyer_controlled_group_id, closing_date, closing_plan_year, purchase_price_cents, bond_amount_cents, buyer_assumes_contribution_obligation, workforce_continuity_pct, asset_continuity_pct, customer_continuity_pct]
    output: AssetSaleTransaction
    side_effects: ["runs calculations.required_sale_of_assets_bond and stores required_bond_cents", "status = SUBMITTED, exemption_status = PENDING, successor_determination = PENDING"]

  - method: POST
    path: "/asset-sale-transactions/{asset_sale_transaction_id}/adjudicate"
    description: "Certify the sale-of-assets exemption, determine successor liability on the substantial-continuity test, or reject the submission."
    roles: [PlanTrustee]
    code: 200
    input: [disposition]
    output: AssetSaleTransaction
    side_effects: ["CERTIFY_4204_EXEMPTION: exemption_status becomes EXEMPT_4204, bond_period_end_plan_year is set, buyer ControlledGroup.bond_posture becomes BONDED and contingent_exposure_cents and exposure_score are recomputed under SELLER_CONTINUING", "DETERMINE_SUCCESSOR: substantial_continuity_score is computed and, when SUCCESSOR_LIABLE, buyer ControlledGroup.joint_exposure_cents and exposure_score are recomputed under SUCCESSOR_ASSUMPTION", "REJECT: no exposure figures change"]

  - method: GET
    path: "/asset-sale-transactions"
    description: "List asset sale transactions, filterable by seller employer, buyer controlled group and exemption status."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: ["seller_employer_id?", "buyer_controlled_group_id?", "exemption_status?", "limit?", "offset?"]
    output: AssetSaleTransaction[]
    side_effects: []

  - method: GET
    path: "/asset-sale-transactions/{asset_sale_transaction_id}"
    description: "Read an asset sale transaction including the required bond and continuity score."
    roles: [FundAdministrator, PlanActuary, PlanTrustee, EmployerRepresentative, Arbitrator]
    code: 200
    input: []
    output: AssetSaleTransaction
    side_effects: []

  # ---------------- Operations ----------------
  - method: POST
    path: "/collection-sweeps"
    description: "Run the fund's periodic collection and deadline sweep for one plan at the current logical clock: mark installments due, mark unpaid installments delinquent past their grace period, flip schedules to DEFAULT_ELIGIBLE, deem undecided review requests denied, and finalize assessments whose dispute avenues have closed."
    roles: [FundAdministrator]
    code: 200
    input: [plan_id]
    output: "{ swept_at: string, installments_marked_due: integer, installments_marked_delinquent: integer, schedules_default_eligible: integer, review_requests_deemed_denied: integer, assessments_finalized: integer }"
    side_effects: ["a single sweep applies both installment hops in order within the same pass: SCHEDULED -> DUE for every installment whose due_date has arrived, then DUE -> DELINQUENT for every installment whose delinquent_on has arrived, so one sweep can carry an installment from SCHEDULED to DELINQUENT", "runs the five-link delinquency cascade documented on PaymentSchedule ACTIVE -> DEFAULT_ELIGIBLE", "ReviewRequest PENDING -> DEEMED_DENIED with arbitration_deadline_at recomputed", "LiabilityAssessment ISSUED -> FINAL where every dispute avenue has closed"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock only moves forward."
    roles: [FundAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["no entity is mutated; deadline and due-date comparisons read the new instant"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role not one of the five declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed for the endpoint in §1.5."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An EmployerRepresentative whose X-User-ID is not the owning Employer.id acts on that employer's resource."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, out-of-range number, inverted interval, or a conditionally required field that is absent or forbidden."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id in the path or body does not resolve."
  - id: ERR_CONTROLLED_GROUP_NOT_FOUND
    http: 404
    condition: "controlled_group_id or buyer_controlled_group_id does not resolve."
  - id: ERR_EMPLOYER_NOT_FOUND
    http: 404
    condition: "employer_id or seller_employer_id does not resolve."
  - id: ERR_VALUATION_NOT_FOUND
    http: 404
    condition: "plan_year_valuation_id in the path does not resolve."
  - id: ERR_CONTRIBUTION_RECORD_NOT_FOUND
    http: 404
    condition: "contribution_record_id in the path or supersedes_record_id in the body does not resolve."
  - id: ERR_WITHDRAWAL_EVENT_NOT_FOUND
    http: 404
    condition: "withdrawal_event_id in the path or body does not resolve."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "liability_assessment_id in the path or body does not resolve."
  - id: ERR_SCHEDULE_NOT_FOUND
    http: 404
    condition: "payment_schedule_id in the path does not resolve."
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "installment_id in the path does not resolve."
  - id: ERR_REVIEW_REQUEST_NOT_FOUND
    http: 404
    condition: "review_request_id in the path or body does not resolve."
  - id: ERR_ARBITRATION_NOT_FOUND
    http: 404
    condition: "arbitration_id in the path does not resolve."
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "asset_sale_transaction_id in the path does not resolve."
  - id: ERR_STALE_EMPLOYER_VERSION
    http: 412
    condition: "expected_employer_version does not equal the current Employer.version on POST /contribution-records."
  - id: ERR_STALE_ASSESSMENT_VERSION
    http: 412
    condition: "expected_assessment_version does not equal the current LiabilityAssessment.version on POST /payment-schedules."
  - id: ERR_VALUATION_ALREADY_CERTIFIED
    http: 409
    condition: "Certify attempted on a valuation whose status is not DRAFT."
  - id: ERR_WITHDRAWAL_ALREADY_DETERMINED
    http: 409
    condition: "Determine attempted on a withdrawal event whose status is not REPORTED."
  - id: ERR_WITHDRAWAL_NOT_DETERMINED
    http: 409
    condition: "Assessment creation attempted while the withdrawal event is still REPORTED."
  - id: ERR_NO_WITHDRAWAL_DETERMINED
    http: 409
    condition: "Assessment creation attempted on a withdrawal event determined to be NO_WITHDRAWAL."
  - id: ERR_ASSESSMENT_ALREADY_ISSUED
    http: 409
    condition: "Issue attempted on an assessment whose lifecycle_status is not DRAFT, or a second assessment for the same withdrawal event is already ISSUED or FINAL."
  - id: ERR_ASSESSMENT_NOT_ISSUED
    http: 409
    condition: "An operation requiring an issued demand is attempted while the assessment is DRAFT or already FINAL."
  - id: ERR_ASSESSMENT_RESCINDED
    http: 409
    condition: "An operation is attempted on an assessment whose lifecycle_status is RESCINDED."
  - id: ERR_DUPLICATE_REVIEW_REQUEST
    http: 409
    condition: "A request for review is filed while the assessment's review_status is no longer NONE."
  - id: ERR_REVIEW_ALREADY_DECIDED
    http: 409
    condition: "Decide attempted on a request for review whose status is not PENDING."
  - id: ERR_SCHEDULE_NOT_ACTIVE
    http: 409
    condition: "Cure attempted on a schedule whose status is not DEFAULT_ELIGIBLE or NOTICED."
  - id: ERR_SCHEDULE_NOT_DEFAULT_ELIGIBLE
    http: 409
    condition: "Default notice attempted on a schedule whose status is not DEFAULT_ELIGIBLE."
  - id: ERR_SCHEDULE_NOT_NOTICED
    http: 409
    condition: "Acceleration attempted on a schedule whose status is not NOTICED."
  - id: ERR_INSTALLMENT_NOT_PAYABLE
    http: 409
    condition: "Payment attempted on an installment whose status is not DUE or DELINQUENT."
  - id: ERR_ARBITRATION_NOT_IN_AWARDABLE_STATE
    http: 409
    condition: "Award attempted while the arbitration status is not HEARING."
  - id: ERR_INVALID_ARBITRATION_ADVANCE
    http: 409
    condition: "Advance attempted to a status that is not reachable from the arbitration's current status."
  - id: ERR_ARBITRATION_ALREADY_CLOSED
    http: 409
    condition: "Advance or award attempted on an arbitration whose status is CLOSED."
  - id: ERR_TRANSACTION_ALREADY_ADJUDICATED
    http: 409
    condition: "Adjudicate attempted on an asset sale transaction whose status is not SUBMITTED."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID certified the anchor valuation being issued against, or issued the demand now being reviewed."
  - id: ERR_4204_BOND_INSUFFICIENT
    http: 422
    condition: "bond_amount_cents is below required_bond_cents when the sale-of-assets exemption is certified."
  - id: ERR_4204_OBLIGATION_NOT_ASSUMED
    http: 422
    condition: "buyer_assumes_contribution_obligation is false when the sale-of-assets exemption is certified."
  - id: ERR_CURE_DEADLINE_NOT_EXPIRED
    http: 409
    condition: "Acceleration attempted at or before the schedule's cure_deadline_at."
  - id: ERR_VALUATION_YEAR_MISSING
    http: 422
    condition: "A required plan year in the lookback window has no CERTIFIED valuation for the employer's plan."
  - id: ERR_EMPTY_CONTRIBUTION_WINDOW
    http: 422
    condition: "No CERTIFIED contribution record covers any plan year in [W-5, W-1]."
  - id: ERR_REVIEW_REQUEST_NOT_DECIDED
    http: 422
    condition: "Arbitration initiated against a request for review whose status is PENDING or WITHDRAWN."
  - id: ERR_NO_REDUCTION_TO_APPLY
    http: 422
    condition: "A schedule regeneration is requested but the declared source has no conceded amount behind it."
  - id: ERR_REVIEW_WINDOW_CLOSED
    http: 409
    condition: "A request for review is filed after the assessment's review_deadline_at."
  - id: ERR_ARBITRATION_WINDOW_CLOSED
    http: 409
    condition: "Arbitration is initiated after the request for review's arbitration_deadline_at."
  - id: ERR_CONTRIBUTION_PERIOD_OVERLAP
    http: 409
    condition: "The new contribution record's plan-year interval shares a plan year with another CERTIFIED record of the same employer."
  - id: ERR_VALUATION_WINDOW_CONFLICT
    http: 409
    condition: "The new valuation's measurement window intersects another window of the same plan or starts inside its thirty-day quiet buffer."
  - id: ERR_CLOCK_MUST_ADVANCE
    http: 422
    condition: "to_iso8601 is at or before the current logical clock."
  - id: ERR_DUPLICATE_EIN
    http: 409
    condition: "An employer with the same ein already exists."
  - id: ERR_EMPLOYER_PLAN_MISMATCH
    http: 422
    condition: "The referenced review request belongs to a different liability assessment than the one named in the same arbitration request."
  - id: ERR_ARBITRATION_ROUND_LIMIT
    http: 409
    condition: "A remand would push round_number past MAX_ARBITRATION_ROUNDS."
  - id: ERR_CBA_CESSATION_COUNT_INVALID
    http: 422
    condition: "reported_cause is CBA_PARTIAL_CESSATION but ceased_cba_count is 0."
  - id: ERR_PARTIAL_WITHDRAWAL_NOT_AVAILABLE
    http: 422
    condition: "The reported cause is unavailable under the plan's industry rule set."
  - id: ERR_SUPERSEDED_RECORD_PERIOD_MISMATCH
    http: 422
    condition: "supersedes_record_id points at a record with a different employer, a non-CERTIFIED status, or a different plan-year interval."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "payment_amount_cents does not equal the installment's amount_due_cents exactly."
  - id: ERR_CURE_AMOUNT_MISMATCH
    http: 422
    condition: "payment_amount_cents does not equal the total amount due on the schedule's delinquent installments exactly."
  - id: ERR_ANNUAL_PAYMENT_ZERO
    http: 422
    condition: "The contribution history yields an annual payment of zero, so no amortization is possible."
  - id: ERR_UNAMORTIZABLE_ASSESSMENT
    http: 422
    condition: "Under a declared mass withdrawal the annual payment can never amortize the basis and no twenty-year cap is available to forgive the shortfall."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: FundAdministrator
    description: "Fund office operations: registers plans, controlled groups, employers and certified contribution history, and runs the periodic collection and deadline sweep."
    identity: opaque
    exclusive_operations:
      - "POST /plans"
      - "PATCH /plans/{plan_id}"
      - "POST /controlled-groups"
      - "POST /employers"
      - "PATCH /employers/{employer_id}"
      - "POST /contribution-records"
      - "POST /collection-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /withdrawal-events (shared with EmployerRepresentative)"
      - "POST /asset-sale-transactions (shared with EmployerRepresentative)"
      - "all GET endpoints"

  - name: PlanActuary
    description: "Enrolled actuary: files and certifies plan year valuations, determines withdrawal type, computes draft assessments and mints payment-schedule generations. Cannot issue a demand."
    identity: opaque
    exclusive_operations:
      - "POST /plan-year-valuations"
      - "POST /plan-year-valuations/{plan_year_valuation_id}/certify"
      - "POST /withdrawal-events/{withdrawal_event_id}/determine"
      - "POST /liability-assessments"
      - "POST /payment-schedules"
    shared_operations:
      - "all GET endpoints"

  - name: PlanTrustee
    description: "Plan sponsor's trustee: issues the notice and demand, decides requests for review, issues notices of default, accelerates, and adjudicates asset sale due diligence. Segregation of duties forbids the same user id from certifying the anchor valuation and issuing against it, or from issuing a demand and then deciding its review."
    identity: opaque
    exclusive_operations:
      - "POST /liability-assessments/{liability_assessment_id}/issue"
      - "POST /review-requests/{review_request_id}/decide"
      - "POST /payment-schedules/{payment_schedule_id}/default-notice"
      - "POST /payment-schedules/{payment_schedule_id}/accelerate"
      - "POST /asset-sale-transactions/{asset_sale_transaction_id}/adjudicate"
    shared_operations:
      - "all GET endpoints"

  - name: EmployerRepresentative
    description: "Counsel or officer acting for one contributing employer. X-User-ID is that Employer's id, and every write must target a resource owned by it."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /review-requests"
      - "POST /arbitrations"
      - "POST /installments/{installment_id}/pay"
      - "POST /payment-schedules/{payment_schedule_id}/cure"
    shared_operations:
      - "POST /withdrawal-events (shared with FundAdministrator)"
      - "POST /asset-sale-transactions (shared with FundAdministrator)"
      - "all GET endpoints"

  - name: Arbitrator
    description: "Neutral arbitrator appointed under the mandatory arbitration rules: advances the proceeding and issues awards. Cannot initiate an arbitration or decide a request for review."
    identity: opaque
    exclusive_operations:
      - "POST /arbitrations/{arbitration_id}/advance"
      - "POST /arbitrations/{arbitration_id}/award"
    shared_operations:
      - "all GET endpoints"
