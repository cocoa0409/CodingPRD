          Release is the one endpoint carrying three independent preconditions,
          and this instance shows their declared order on orders where more than
          one fails at once: with no mould AND no qualified lot the answer is
          ERR_NO_ELIGIBLE_MOLD, with a FROZEN target site on top of both the
