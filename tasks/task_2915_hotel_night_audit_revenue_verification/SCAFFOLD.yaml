scenario: |
  2915. Hotel Night Audit & Revenue Verification (hotel accounting operations): daily close
  sequence with room and tax posting, no-show and late checkout charge application, rate
  variance and comp room authorization review against approval documentation, cash and credit
  settlement reconciliation across front desk, food and beverage outlets and remote points of
  sale, house account, city ledger and advance deposit ledger balancing, allowance and
  adjustment review with reason codes and manager approval thresholds, daily revenue report
  distribution with occupancy statistics and pace comparison, credit card authorization aging
  and declined authorization follow-up, month-end tie-out to the general ledger and audit trail
  retention

domain_name: hotel-night-audit-revenue-verification
api_prefix: "/night-audit"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection
  # (`/night-audit/<collection>/{id}`); parentage is expressed only through
  # foreign-key fields in request bodies, never through nested URL paths.

  state_machine_shape: parallel
  # Folio carries two independent state dimensions (stay_status x settlement_status)
  # that advance on different triggers; Allowance and SettlementBatch each carry a
  # revision cycle; AccountingPeriod carries a retry cycle; BusinessDate carries a
  # reopen cycle plus a compound precondition over its SettlementBatch children.

  relationship_patterns:
    - one_to_many
    - self_referential      # JournalPosting.reverses_posting_id, Allowance.reverses_allowance_id
    - cross_aggregate       # JournalPosting straddles Folio and LedgerAccount in one journal

  role_model: segregation_of_duties
  # The user who requests an allowance may never approve it; the user who posted a
  # journal line may never reverse it; approval authority is tiered by amount.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: HotelProperty
    parent: null
    common_fields: true
    description: Configuration entity holding every rate, tax, tolerance and approval threshold the audit engine reads.
    fields:
      - name: name
        type: string
        source: input
        description: Property trade name.
      - name: room_count_total
        type: integer
        source: input
        description: Physical sellable room inventory of the property.
        constraints: ">= 1"
      - name: standard_room_rate_amount
        type: number
        source: input
        description: Published rack rate used as the denominator of Folio.rate_variance_pct.
        constraints: "> 0, 2 decimal places"
      - name: occupancy_tax_rate_pct
        type: number
        source: input
        description: Occupancy tax percentage applied to room-department charge lines.
        constraints: ">= 0, 3 decimal places (e.g. 8.875)"
      - name: fb_tax_rate_pct
        type: number
        source: input
        description: Food-and-beverage tax percentage applied to OutletTicket.taxable_base_amount.
        constraints: ">= 0, 3 decimal places"
      - name: service_charge_pct
        type: number
        source: input
        description: Mandatory outlet service charge percentage applied to OutletTicket.gross_amount.
        constraints: ">= 0"
      - name: large_ticket_threshold_amount
        type: number
        source: input
        description: OutletTicket.taxable_base_amount at or above which the large-party discount applies.
        constraints: "> 0, 2 decimal places"
      - name: large_party_discount_pct
        type: number
        source: input
        description: Discount percentage applied to OutletTicket.gross_amount once the large-ticket threshold is met.
        constraints: ">= 0"
      - name: late_checkout_grace_minutes
        type: integer
        source: input
        default: 30
        description: Overdue minutes that may be exceeded before any late-checkout charge is raised.
        constraints: ">= 0"
      - name: allowance_manager_threshold_amount
        type: number
        source: input
        description: Allowance.requested_amount at or above which RevenueManager (or Controller) approval is required.
        constraints: "> 0, 2 decimal places"
      - name: allowance_controller_threshold_amount
        type: number
        source: input
        description: Allowance.requested_amount at or above which only Controller may approve.
        constraints: "> allowance_manager_threshold_amount"
      - name: rate_variance_tolerance_pct
        type: number
        source: input
        description: Absolute Folio.rate_variance_pct that may be exceeded only with an ACTIVE RATE_OVERRIDE AuthorizationDocument.
        constraints: ">= 0"
      - name: settlement_variance_tolerance_amount
        type: number
        source: input
        description: Absolute SettlementBatch.variance_amount tolerated before the batch is flagged.
        constraints: ">= 0, 2 decimal places"
      - name: card_authorization_valid_days
        type: integer
        source: input
        default: 7
        description: CardAuthorization.aging_days at or above which an APPROVED authorization lapses to EXPIRED.
        constraints: ">= 1"
      - name: city_ledger_fee_pct
        type: number
        source: input
        description: Fee percentage charged per folio swept to the city ledger.
        constraints: ">= 0"
      - name: no_show_charge_policy
        type: enum
        source: input
        default: FIRST_NIGHT_PLUS_TAX
        description: Which charge the night audit raises against a RESERVED folio that never arrived.
        constraints: "one of {FIRST_NIGHT_PLUS_TAX, FULL_STAY_NO_TAX, NONE}"

  - name: Outlet
    parent: null
    common_fields: true
    description: A revenue capture point - front desk, food-and-beverage outlet, or remote point of sale - that settles its own shift batches.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> HotelProperty.id; the property this outlet belongs to."
      - name: outlet_code
        type: string
        source: input
        description: Short operator code, unique within the property.
      - name: outlet_name
        type: string
        source: input
        description: Human-readable outlet name.
      - name: outlet_type
        type: enum
        source: input
        description: Capture-point class; REMOTE_POS tickets may transmit after the shift window closes.
        constraints: "one of {FRONT_DESK, FB_OUTLET, REMOTE_POS}"
      - name: requires_shift_settlement
        type: boolean
        source: input
        default: true
        description: When true a SettlementBatch must exist and be resolved for this outlet before its BusinessDate may reach BALANCED.
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: ACTIVE outlets accept tickets and batches; SUSPENDED outlets reject both.
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: AccountingPeriod
    parent: null
    common_fields: true
    description: Calendar month container created by the system on first BusinessDate of the month; owns month-end general-ledger tie-out and audit-trail retention.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> HotelProperty.id; the property whose month this period closes."
      - name: period_month
        type: string
        source: system
        description: Month key in YYYY-MM form, unique per property; derived from the first BusinessDate.business_date placed in it.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Period lifecycle state.
        constraints: "one of {OPEN, TIE_OUT_IN_PROGRESS, TIE_OUT_FAILED, TIED_OUT}"
      - name: gl_control_total_amount
        type: number
        source: input
        description: General-ledger control total supplied by Controller at each tie-out attempt.
        constraints: "2 decimal places; null until the first tie-out attempt"
      - name: subsystem_total_amount
        type: number
        source: computed
        description: Sum of BusinessDate.total_revenue_amount over BusinessDates of this period whose status is CLOSED or ARCHIVED.
      - name: tie_out_variance_amount
        type: number
        source: computed
        description: gl_control_total_amount minus subsystem_total_amount, rounded to 2 decimals.
      - name: tie_out_attempt_count
        type: integer
        source: system
        default: 0
        description: Number of tie-out attempts already consumed; capped at GL_TIE_OUT_ATTEMPT_LIMIT.
      - name: tied_out_by_user_id
        type: string
        source: system
        description: X-User-ID of the Controller whose attempt reached TIED_OUT; null otherwise.
      - name: tied_out_at
        type: datetime
        source: system
        description: Logical-clock instant at which the period reached TIED_OUT, ISO 8601 UTC with three fractional digits; null before that.
      - name: audit_trail_retention_until_date
        type: string
        source: computed
        description: Retention horizon (YYYY-MM-DD) stamped when the period reaches TIED_OUT; null before that.

  - name: BusinessDate
    parent: null
    common_fields: true
    description: One hotel operating day and the aggregate under audit; every posting, ticket, batch and report is stamped with exactly one BusinessDate.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> HotelProperty.id; the audited property."
      - name: accounting_period_id
        type: string
        source: system
        description: "FK -> AccountingPeriod.id; the YYYY-MM period this date rolls up into, created on demand when the month's first date is opened."
      - name: business_date
        type: string
        source: input
        description: Operating day in YYYY-MM-DD form, unique per property.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Daily close sequence position.
        constraints: "one of {OPEN, ROOM_POSTING, CHARGES_SEALED, SETTLEMENT_REVIEW, BALANCED, CLOSED, REOPENED, ARCHIVED}"
      - name: out_of_order_room_count
        type: integer
        source: input
        default: 0
        description: Rooms withdrawn from inventory for this day.
        constraints: ">= 0 and <= HotelProperty.room_count_total"
      - name: benchmark_calendar_room_revenue_amount
        type: number
        source: input
        default: 0.00
        description: Prior-year same-calendar-day room revenue, the CALENDAR_ALIGNED pace denominator.
        constraints: ">= 0, 2 decimal places"
      - name: benchmark_weekday_room_revenue_amount
        type: number
        source: input
        default: 0.00
        description: Prior-year same-weekday room revenue, the WEEKDAY_ALIGNED pace denominator.
        constraints: ">= 0, 2 decimal places"
      - name: rooms_available_count
        type: integer
        source: computed
        description: HotelProperty.room_count_total minus out_of_order_room_count.
      - name: rooms_occupied_count
        type: integer
        source: computed
        description: Count of distinct JournalPosting.folio_id over ROOM lines of this date that are not referenced by any posting's reverses_posting_id.
      - name: room_night_revenue_amount
        type: number
        source: computed
        description: Signed sum of JournalPosting.amount for this date over charge_type in {ROOM, ALLOWANCE}; the ADR and RevPAR numerator. OCCUPANCY_TAX and TAX_TRUE_UP are excluded.
      - name: other_room_revenue_amount
        type: number
        source: computed
        description: Signed sum of JournalPosting.amount for this date over charge_type in {NO_SHOW, LATE_CHECKOUT}.
      - name: room_revenue_amount
        type: number
        source: computed
        description: room_night_revenue_amount plus other_room_revenue_amount; the pace-comparison numerator.
      - name: tax_revenue_amount
        type: number
        source: computed
        description: Signed sum of JournalPosting.amount for this date over charge_type in {OCCUPANCY_TAX, TAX_TRUE_UP}.
      - name: outlet_revenue_amount
        type: number
        source: computed
        description: Sum of OutletTicket.total_amount for this date whose status is CLOSED.
      - name: closed_outlet_ticket_count
        type: integer
        source: computed
        description: Count of OutletTicket rows for this date whose status is CLOSED.
      - name: allowance_credit_amount
        type: number
        source: computed
        description: Signed sum of JournalPosting.amount for this date over charge_type ALLOWANCE (zero or negative).
      - name: total_revenue_amount
        type: number
        source: computed
        description: room_revenue_amount plus tax_revenue_amount plus outlet_revenue_amount; ALLOWANCE lines are already netted inside room_night_revenue_amount.
      - name: occupancy_pct
        type: number
        source: computed
        description: rooms_occupied_count divided by rooms_available_count times 100, 2 decimals; 0.00 when rooms_available_count is 0.
      - name: adr_amount
        type: number
        source: computed
        description: room_night_revenue_amount divided by rooms_occupied_count, 2 decimals; 0.00 when rooms_occupied_count is 0.
      - name: revpar_amount
        type: number
        source: computed
        description: room_night_revenue_amount divided by rooms_available_count, 2 decimals; 0.00 when rooms_available_count is 0.
      - name: settlement_variance_total_amount
        type: number
        source: computed
        description: Sum of the absolute value of SettlementBatch.variance_amount over batches of this date whose status is not RECOUNT_REQUESTED.
      - name: unresolved_settlement_batch_count
        type: integer
        source: computed
        description: Count of SettlementBatch rows of this date whose status is in {DECLARED, VARIANCE_FLAGGED, RECOUNT_REQUESTED}.
      - name: ledger_control_amount
        type: number
        source: computed
        description: Signed sum of JournalPosting.amount for this date over charge_type in {LEDGER_TRANSFER, DEPOSIT_APPLIED} across both the folio side and the ledger side; every system-generated transfer is a balanced pair, so a non-zero total can only come from a manually posted one-sided transfer. Must be exactly 0.00 before the date may reach BALANCED.
      - name: declined_authorization_count
        type: integer
        source: computed
        description: Count of CardAuthorization rows whose status is DECLINED and follow_up_status is not RESOLVED, over folios of this property.
      - name: city_ledger_swept_folio_count
        type: integer
        source: computed
        description: Number of folios the most recent city-ledger sweep of this date moved to TRANSFERRED_TO_CITY_LEDGER; 0 before any sweep and 0 after a sweep that found nothing to move.
      - name: city_ledger_transferred_balance_total_amount
        type: number
        source: computed
        description: Sum of the pre-fee folio balances the most recent city-ledger sweep of this date transferred; 0.00 before any sweep.
      - name: city_ledger_fee_total_amount
        type: number
        source: computed
        description: Sum of the per-folio city-ledger fees the most recent sweep of this date raised, each already rounded to 2 decimals before summing; 0.00 before any sweep.
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: Number of times Controller has reopened this date after CLOSED.

  - name: Folio
    parent: null
    common_fields: true
    description: Guest account carrying two independent state dimensions - the stay lifecycle and the settlement lifecycle - that advance on different triggers.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> HotelProperty.id; owning property."
      - name: arrival_business_date_id
        type: string
        source: input
        description: "FK -> BusinessDate.id; the operating day the reservation is booked to arrive on."
      - name: confirmation_code
        type: string
        source: input
        description: Reservation confirmation code, unique per property.
      - name: guest_name
        type: string
        source: input
        description: Registered guest name.
      - name: room_number
        type: string
        source: input
        description: Assigned room number as a free-form label.
      - name: nights_count
        type: integer
        source: input
        description: Contracted number of room nights.
        constraints: ">= 1"
      - name: contracted_rate_amount
        type: number
        source: input
        description: Nightly room rate agreed with the guest; the base of ROOM, NO_SHOW and LATE_CHECKOUT charges.
        constraints: ">= 0, 2 decimal places"
      - name: rate_plan_code
        type: string
        source: input
        description: Rate plan label recorded for audit.
      - name: market_segment
        type: enum
        source: input
        description: Statistical segment of the stay.
        constraints: "one of {TRANSIENT, GROUP, CORPORATE, COMP}"
      - name: settlement_method
        type: enum
        source: input
        description: Planned settlement channel; drives the check-out routing cascade.
        constraints: "one of {CASH, CREDIT_CARD, DIRECT_BILL, HOUSE_ACCOUNT}"
      - name: scheduled_checkout_at
        type: datetime
        source: input
        description: Contractual checkout instant, ISO 8601 UTC with three fractional digits.
      - name: actual_checkout_at
        type: datetime
        source: system
        description: Instant supplied at check-out; null until the folio departs.
      - name: is_comp
        type: boolean
        source: input
        default: false
        description: When true the night audit posts a 0.00 ROOM line and demands an ACTIVE COMP_ROOM AuthorizationDocument covering the night.
      - name: credit_limit_amount
        type: number
        source: input
        default: 500.00
        description: Maximum permitted balance_amount after any charge posting.
        constraints: ">= 0, 2 decimal places"
      - name: stay_status
        type: enum
        source: system
        default: RESERVED
        description: Stay dimension of the folio's parallel state.
        constraints: "one of {RESERVED, IN_HOUSE, DEPARTED, NO_SHOW, CANCELLED}"
      - name: settlement_status
        type: enum
        source: system
        default: UNSETTLED
        description: Settlement dimension of the folio's parallel state, independent of stay_status.
        constraints: "one of {UNSETTLED, PARTIALLY_SETTLED, SETTLED, TRANSFERRED_TO_CITY_LEDGER}"
      - name: rate_variance_pct
        type: number
        source: computed
        description: contracted_rate_amount minus HotelProperty.standard_room_rate_amount, divided by standard_room_rate_amount, times 100, 2 decimals.
      - name: charges_total_amount
        type: number
        source: computed
        description: Sum of JournalPosting.amount over this folio's postings whose amount is greater than 0.
      - name: credits_total_amount
        type: number
        source: computed
        description: Sum of JournalPosting.amount over this folio's postings whose amount is less than 0 (zero or negative).
      - name: balance_amount
        type: number
        source: computed
        description: Signed sum of every JournalPosting.amount whose folio_id is this folio.
      - name: settlement_hold
        type: boolean
        source: computed
        description: True when at least one CardAuthorization of this folio has status DECLINED and follow_up_status not RESOLVED.

  - name: JournalPosting
    parent: null
    common_fields: false
    description: Append-only journal line. One table serves both the guest-folio side and the ledger-account side, so a transfer is two rows that net to zero. Rows are never mutated; a correction is a new row carrying reverses_posting_id.
    fields:
      - name: folio_id
        type: string
        source: input
        description: "FK -> Folio.id; the guest account debited or credited; null on a pure ledger-side row."
      - name: ledger_account_id
        type: string
        source: input
        description: "FK -> LedgerAccount.id; the ledger account debited or credited; null on a pure folio-side row."
      - name: business_date_id
        type: string
        source: input
        description: "FK -> BusinessDate.id; the operating day the line is stamped to."
      - name: outlet_ticket_id
        type: string
        source: system
        description: "FK -> OutletTicket.id; set on OUTLET_TRANSFER lines produced by closing a room-charge ticket; null otherwise."
      - name: allowance_id
        type: string
        source: system
        description: "FK -> Allowance.id; set on ALLOWANCE lines produced by allowance approval; null otherwise."
      - name: reverses_posting_id
        type: string
        source: system
        description: "FK -> JournalPosting.id; set on a compensating row that negates an earlier row; null on original rows."
      - name: charge_type
        type: enum
        source: input
        description: Journal line class. Only MISC_CHARGE, PAYMENT, LEDGER_TRANSFER and DEPOSIT_APPLIED may be supplied directly through POST /night-audit/journal-postings; every other value is minted by a declared side effect. LEDGER_TRANSFER and DEPOSIT_APPLIED are the two transfer classes the ledger control total sums over.
        constraints: "one of {ROOM, OCCUPANCY_TAX, TAX_TRUE_UP, NO_SHOW, LATE_CHECKOUT, MISC_CHARGE, OUTLET_TRANSFER, ALLOWANCE, PAYMENT, DEPOSIT_APPLIED, LEDGER_TRANSFER, CITY_LEDGER_FEE}"
      - name: amount
        type: number
        source: input
        description: Signed money. Debits to the guest (charges) are positive; credits (payments, allowances, transfers out) are negative.
        constraints: "2 decimal places, non-zero"
      - name: night_index
        type: integer
        source: system
        description: 1-based room night ordinal on ROOM and OCCUPANCY_TAX lines; null on every other charge_type.
      - name: source_channel
        type: enum
        source: system
        description: Which subsystem produced the line, derived from the endpoint that created it.
        constraints: "one of {NIGHT_AUDIT, FRONT_DESK, OUTLET_POS, ALLOWANCE_WORKFLOW, LEDGER_SWEEP}"
      - name: reason_code
        type: enum
        source: input
        description: Reason code carried by ALLOWANCE lines and by reversals; null elsewhere.
        constraints: "one of {SERVICE_RECOVERY, RATE_ERROR, POSTING_ERROR, GUEST_DISPUTE, MANAGER_DISCRETION}"
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose request created the line; the segregation-of-duties key for reversal.
      - name: memo
        type: string
        source: input
        description: Free-text audit note.

  - name: OutletTicket
    parent: null
    common_fields: true
    description: A check raised at a front desk, food-and-beverage outlet or remote point of sale; remote tickets may transmit after their shift window has closed.
    fields:
      - name: outlet_id
        type: string
        source: input
        description: "FK -> Outlet.id; the capture point that raised the ticket."
      - name: business_date_id
        type: string
        source: input
        description: "FK -> BusinessDate.id; the operating day the ticket belongs to."
      - name: room_charge_folio_id
        type: string
        source: input
        description: "FK -> Folio.id; required when settlement_type is ROOM_CHARGE, null otherwise."
      - name: ticket_number
        type: string
        source: input
        description: Operator ticket number, unique per outlet per business date.
      - name: gross_amount
        type: number
        source: input
        description: Pre-service-charge, pre-tax sale value.
        constraints: "> 0, 2 decimal places"
      - name: settlement_type
        type: enum
        source: input
        description: How the ticket is tendered; ROOM_CHARGE tickets transfer to a folio instead of entering a cash or card settlement batch.
        constraints: "one of {CASH, CREDIT_CARD, ROOM_CHARGE}"
      - name: opened_at
        type: datetime
        source: input
        description: Instant the check was opened, ISO 8601 UTC with three fractional digits.
      - name: transmitted_at
        type: datetime
        source: input
        default: "the logical clock reading at close time"
        description: Instant the ticket reached the audit system; the value matched against SettlementBatch shift windows.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Ticket lifecycle state.
        constraints: "one of {OPEN, CLOSED, VOID}"
      - name: service_charge_amount
        type: number
        source: computed
        description: Service charge stamped at close; 0.00 while OPEN.
      - name: taxable_base_amount
        type: number
        source: computed
        description: gross_amount plus service_charge_amount, stamped at close; the large-ticket threshold comparand.
      - name: tax_amount
        type: number
        source: computed
        description: Food-and-beverage tax on taxable_base_amount, stamped at close.
      - name: large_party_discount_amount
        type: number
        source: computed
        description: Large-party discount stamped at close; 0.00 when the threshold is not met.
      - name: total_amount
        type: number
        source: computed
        description: gross_amount plus service_charge_amount plus tax_amount minus large_party_discount_amount, stamped at close; 0.00 while OPEN and after VOID.
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who closed the ticket.
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the ticket was closed, ISO 8601 UTC with three fractional digits; null while OPEN.
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant at which the ticket was voided, ISO 8601 UTC with three fractional digits; null unless VOID.

  - name: SettlementBatch
    parent: null
    common_fields: true
    description: An outlet's declared cash or card takings for one shift window on one business date, reconciled against the tickets whose transmitted_at falls inside the half-open window.
    fields:
      - name: business_date_id
        type: string
        source: input
        description: "FK -> BusinessDate.id; the operating day being settled."
      - name: outlet_id
        type: string
        source: input
        description: "FK -> Outlet.id; the capture point declaring the takings."
      - name: tender_type
        type: enum
        source: input
        description: Which tender the batch declares; ROOM_CHARGE tickets never enter a batch.
        constraints: "one of {CASH, CREDIT_CARD}"
      - name: shift_start_at
        type: datetime
        source: input
        description: Inclusive start of the shift window, ISO 8601 UTC with three fractional digits.
      - name: shift_end_at
        type: datetime
        source: input
        description: Exclusive end of the shift window, ISO 8601 UTC with three fractional digits.
        constraints: "> shift_start_at"
      - name: declared_amount
        type: number
        source: input
        description: Money the operator physically counted for this window.
        constraints: ">= 0, 2 decimal places"
      - name: system_amount
        type: number
        source: computed
        description: Sum of OutletTicket.total_amount over CLOSED tickets of this outlet and date whose settlement_type matches tender_type and whose transmitted_at is inside the half-open window.
      - name: variance_amount
        type: number
        source: computed
        description: declared_amount minus system_amount, 2 decimals; recomputed on every declaration and redeclaration.
      - name: status
        type: enum
        source: system
        default: DECLARED
        description: Reconciliation state; DECLARED is transient and auto-resolves to MATCHED or VARIANCE_FLAGGED inside the same request.
        constraints: "one of {DECLARED, MATCHED, VARIANCE_FLAGGED, RECOUNT_REQUESTED, ACCEPTED_WITH_VARIANCE}"
      - name: recount_round
        type: integer
        source: system
        default: 0
        description: Number of recounts already requested on this batch; capped at SETTLEMENT_RECOUNT_LIMIT.
      - name: declared_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who last declared or redeclared the batch.
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the RevenueManager who accepted the variance; null otherwise.

  - name: LedgerAccount
    parent: null
    common_fields: true
    description: A non-guest receivable or liability account - house account, city ledger, or advance deposit ledger - carrying its own general-ledger code and credit limit.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> HotelProperty.id; owning property."
      - name: ledger_type
        type: enum
        source: input
        description: Which balancing ledger this account belongs to.
        constraints: "one of {HOUSE_ACCOUNT, CITY_LEDGER, ADVANCE_DEPOSIT}"
      - name: account_code
        type: string
        source: input
        description: Operator account code, unique per property.
      - name: gl_account_code
        type: string
        source: input
        description: General-ledger account number the month-end tie-out reports against.
      - name: opening_balance_amount
        type: number
        source: input
        default: 0.00
        description: Balance carried in before any JournalPosting.
        constraints: "2 decimal places"
      - name: credit_limit_amount
        type: number
        source: input
        description: Maximum permitted current_balance_amount after any posting to this account.
        constraints: ">= 0, 2 decimal places"
      - name: current_balance_amount
        type: number
        source: computed
        description: opening_balance_amount plus the signed sum of every JournalPosting.amount whose ledger_account_id is this account.

  - name: Allowance
    parent: null
    common_fields: true
    description: A rebate or adjustment requested against a folio, carrying a reason code, a revision cycle, and an amount-tiered approval requirement.
    fields:
      - name: folio_id
        type: string
        source: input
        description: "FK -> Folio.id; the guest account to be credited."
      - name: business_date_id
        type: string
        source: input
        description: "FK -> BusinessDate.id; the operating day the credit will be stamped to."
      - name: reverses_allowance_id
        type: string
        source: system
        description: "FK -> Allowance.id; set on the compensating allowance minted by reversing a POSTED allowance; null on originals."
      - name: reason_code
        type: enum
        source: input
        description: Why the allowance is sought; RATE_ERROR additionally demands supporting_document_reference.
        constraints: "one of {SERVICE_RECOVERY, RATE_ERROR, POSTING_ERROR, GUEST_DISPUTE, MANAGER_DISCRETION}"
      - name: requested_amount
        type: number
        source: input
        description: Credit sought, as a positive magnitude; the sole input to the approval-tier calculation.
        constraints: "> 0, 2 decimal places"
      - name: approved_amount
        type: number
        source: input
        description: Credit actually granted, supplied at approval; must be greater than 0 and at most requested_amount. Null before approval.
        constraints: "> 0 and <= requested_amount, 2 decimal places"
      - name: narrative
        type: string
        source: input
        description: Free-text justification recorded for audit.
      - name: supporting_document_reference
        type: string
        source: input
        description: External approval-documentation reference; required when reason_code is RATE_ERROR.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Allowance workflow state; APPROVED auto-advances to POSTED inside the approving request.
        constraints: "one of {DRAFT, SUBMITTED, RETURNED_FOR_REVISION, APPROVED, POSTED, REJECTED, REVERSED}"
      - name: required_approval_role
        type: enum
        source: computed
        description: Lowest role permitted to approve, derived from requested_amount against the property thresholds; frozen at creation and never re-derived from approved_amount.
        constraints: "one of {NightAuditor, RevenueManager, Controller}"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: Number of times this allowance has been returned for revision; capped at ALLOWANCE_REVISION_LIMIT.
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the creator; the segregation-of-duties key that bars self-approval.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approver; null until APPROVED.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit, ISO 8601 UTC with three fractional digits; re-stamped on every resubmit after a revision.
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant at which the allowance was approved, ISO 8601 UTC with three fractional digits; null until APPROVED.

  - name: AuthorizationDocument
    parent: null
    common_fields: true
    description: Scanned approval paperwork authorizing a comp room or an off-tolerance rate for one folio over a closed date interval.
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> HotelProperty.id; owning property."
      - name: folio_id
        type: string
        source: input
        description: "FK -> Folio.id; the folio the authorization covers. Required when doc_type is COMP_ROOM or RATE_OVERRIDE, null when doc_type is ALLOWANCE_APPROVAL."
      - name: allowance_id
        type: string
        source: input
        description: "FK -> Allowance.id; the allowance the paperwork authorizes. Required when doc_type is ALLOWANCE_APPROVAL, null otherwise."
      - name: doc_type
        type: enum
        source: input
        description: Which exception the paperwork authorizes.
        constraints: "one of {COMP_ROOM, RATE_OVERRIDE, ALLOWANCE_APPROVAL}"
      - name: authorized_by_name
        type: string
        source: input
        description: Name of the executive who signed the paperwork.
      - name: document_reference
        type: string
        source: input
        description: Archive reference of the scanned document.
      - name: authorized_rate_amount
        type: number
        source: input
        description: Rate the paperwork authorizes; required when doc_type is RATE_OVERRIDE, ignored for COMP_ROOM.
        constraints: ">= 0, 2 decimal places"
      - name: valid_from_date
        type: string
        source: input
        description: First covered operating day, YYYY-MM-DD, inclusive.
      - name: valid_to_date
        type: string
        source: input
        description: Last covered operating day, YYYY-MM-DD, inclusive.
        constraints: ">= valid_from_date"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Review state; only ACTIVE documents satisfy comp and rate-variance gates.
        constraints: "one of {PENDING, ACTIVE, REJECTED, REVOKED}"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the RevenueManager who reviewed or revoked the document; null while PENDING.
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who filed the paperwork; the segregation-of-duties key that bars the filer from reviewing their own document.
      - name: reviewed_at
        type: datetime
        source: system
        description: Logical-clock instant of the review decision, ISO 8601 UTC with three fractional digits; null while PENDING.

  - name: CardAuthorization
    parent: null
    common_fields: true
    description: A credit card authorization held against a folio, ageing against the logical clock and carrying an independent declined-authorization follow-up dimension.
    fields:
      - name: folio_id
        type: string
        source: input
        description: "FK -> Folio.id; the folio the hold secures."
      - name: obtained_at
        type: datetime
        source: input
        description: Instant the authorization was obtained, ISO 8601 UTC with three fractional digits; the ageing anchor.
      - name: authorized_amount
        type: number
        source: input
        description: Money the issuer approved.
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: system
        default: APPROVED
        description: Authorization dimension of this entity's parallel state.
        constraints: "one of {APPROVED, DECLINED, EXPIRED, CAPTURED}"
      - name: follow_up_status
        type: enum
        source: system
        default: NOT_REQUIRED
        description: Declined-authorization follow-up dimension, advancing independently of status.
        constraints: "one of {NOT_REQUIRED, PENDING, CONTACTED, RESOLVED, ESCALATED}"
      - name: decline_code
        type: enum
        source: input
        description: Issuer decline reason, supplied when the authorization is declined; null otherwise.
        constraints: "one of {INSUFFICIENT_FUNDS, EXPIRED_CARD, DO_NOT_HONOR, SUSPECTED_FRAUD}"
      - name: aging_days
        type: integer
        source: computed
        description: Whole days between obtained_at and the logical clock, floored; re-derived on every read and on every write that touches this row.
      - name: captured_amount
        type: number
        source: input
        description: Money actually captured at settlement; null until CAPTURED.
        constraints: "> 0 and <= authorized_amount, 2 decimal places"
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor who moved follow_up_status to RESOLVED or ESCALATED; null otherwise.
      - name: follow_up_note
        type: string
        source: input
        description: Free-text record of the most recent follow-up contact, replaced on every follow-up action; null while follow_up_status is NOT_REQUIRED.

  - name: RevenueReport
    parent: null
    common_fields: true
    description: Immutable-by-content daily revenue snapshot with occupancy statistics and a pace comparison; creating a newer report for the same date supersedes the older one.
    fields:
      - name: business_date_id
        type: string
        source: input
        description: "FK -> BusinessDate.id; the operating day reported on."
      - name: pace_basis
        type: enum
        source: input
        default: CALENDAR_ALIGNED
        description: Which prior-year benchmark the pace index divides by.
        constraints: "one of {CALENDAR_ALIGNED, WEEKDAY_ALIGNED}"
      - name: rooms_available_count
        type: integer
        source: computed
        description: Snapshot of BusinessDate.rooms_available_count at generation.
      - name: rooms_occupied_count
        type: integer
        source: computed
        description: Snapshot of BusinessDate.rooms_occupied_count at generation.
      - name: occupancy_pct
        type: number
        source: computed
        description: Snapshot of BusinessDate.occupancy_pct at generation.
      - name: adr_amount
        type: number
        source: computed
        description: Snapshot of BusinessDate.adr_amount at generation.
      - name: revpar_amount
        type: number
        source: computed
        description: Snapshot of BusinessDate.revpar_amount at generation.
      - name: room_revenue_amount
        type: number
        source: computed
        description: Snapshot of BusinessDate.room_revenue_amount at generation; the pace numerator.
      - name: tax_revenue_amount
        type: number
        source: computed
        description: Snapshot of BusinessDate.tax_revenue_amount at generation.
      - name: outlet_revenue_amount
        type: number
        source: computed
        description: Snapshot of BusinessDate.outlet_revenue_amount at generation.
      - name: total_revenue_amount
        type: number
        source: computed
        description: Snapshot of BusinessDate.total_revenue_amount at generation.
      - name: benchmark_room_revenue_amount
        type: number
        source: computed
        description: The benchmark selected by pace_basis, copied from the BusinessDate at generation.
      - name: pace_index_pct
        type: number
        source: computed
        description: room_revenue_amount divided by benchmark_room_revenue_amount times 100, 2 decimals; 0.00 when the benchmark is 0.00.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Distribution state; SUPERSEDED is stamped when a newer report is generated for the same date.
        constraints: "one of {DRAFT, DISTRIBUTED, SUPERSEDED}"
      - name: recipient_role_list
        type: array
        source: input
        description: Role names the report was distributed to, supplied at distribution; empty until then.
      - name: distributed_at
        type: datetime
        source: system
        description: Logical-clock reading when the report was distributed; null while DRAFT.
      - name: generated_by_user_id
        type: string
        source: system
        description: X-User-ID of the NightAuditor who generated the report.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: BusinessDate
    dimension: status
    initial_state: OPEN
    terminal_states: [ARCHIVED]
    shape: linear pipeline with a Controller reopen cycle (CLOSED -> REOPENED -> BALANCED) and a compound precondition over SettlementBatch children
    transitions:
      - from: OPEN
        to: ROOM_POSTING
        trigger: "POST /night-audit/business-dates/{id}/post-room-and-tax"
        actor: NightAuditor
        preconditions:
          - "status == OPEN"
          - "for every Folio with property_id == this.property_id and stay_status == IN_HOUSE and is_comp == true that is due a room night on this date, an AuthorizationDocument exists with folio_id == that folio, doc_type == COMP_ROOM, status == ACTIVE and valid_from_date <= this.business_date <= valid_to_date; otherwise the whole run is rejected with ERR_COMP_AUTHORIZATION_MISSING and no line is written"
        side_effects:
          - "for each Folio with property_id == this.property_id, stay_status == IN_HOUSE and (count of existing ROOM lines for that folio) < nights_count: append a ROOM JournalPosting (amount 0.00 when is_comp == true, else contracted_rate_amount) with night_index == that count + 1, plus an OCCUPANCY_TAX JournalPosting per calculation room_and_tax_provisional_posting; both carry source_channel NIGHT_AUDIT"
          - "for each Folio with arrival_business_date_id == this.id and stay_status == RESERVED: set that folio's stay_status to NO_SHOW and, per HotelProperty.no_show_charge_policy, append the NO_SHOW and OCCUPANCY_TAX lines described in calculation no_show_charge"
          - "each appended line re-derives its Folio.balance_amount, charges_total_amount, credits_total_amount and settlement_status"
          - "the re-derived folio figures roll up into this date's rooms_occupied_count, room_night_revenue_amount, other_room_revenue_amount, tax_revenue_amount, occupancy_pct, adr_amount, revpar_amount and total_revenue_amount"
          - "increments BusinessDate.version by 1"
        note: A folio already carrying nights_count ROOM lines is skipped, which makes the run idempotent in effect while still rejecting a second call on state.
      - from: ROOM_POSTING
        to: CHARGES_SEALED
        trigger: "POST /night-audit/business-dates/{id}/seal-charges"
        actor: NightAuditor
        preconditions:
          - "status == ROOM_POSTING"
        side_effects:
          - "for every Folio holding at least one room-department line on this date, append a TAX_TRUE_UP JournalPosting of the non-zero delta produced by calculation occupancy_tax_final_true_up; folios whose delta is exactly 0.00 receive no line"
          - "each appended line re-derives its Folio.balance_amount and settlement_status"
          - "this date's tax_revenue_amount and total_revenue_amount are recomputed from the appended lines"
          - "increments BusinessDate.version by 1"
      - from: CHARGES_SEALED
        to: SETTLEMENT_REVIEW
        trigger: "POST /night-audit/business-dates/{id}/verify-settlements"
        actor: NightAuditor
        preconditions:
          - "status == CHARGES_SEALED"
          - "for every Outlet with property_id == this.property_id, status == ACTIVE and requires_shift_settlement == true, at least one SettlementBatch exists with business_date_id == this.id and outlet_id == that outlet; otherwise ERR_SETTLEMENTS_UNRESOLVED"
        side_effects:
          - "recomputes system_amount and variance_amount on every SettlementBatch of this date per calculation settlement_reconciliation, and re-derives each batch's status from DECLARED to MATCHED or VARIANCE_FLAGGED"
          - "the re-derived batch statuses roll up into this date's settlement_variance_total_amount and unresolved_settlement_batch_count"
          - "increments BusinessDate.version by 1"
      - from: SETTLEMENT_REVIEW
        to: SETTLEMENT_REVIEW
        trigger: "POST /night-audit/business-dates/{id}/verify-settlements"
        actor: NightAuditor
        preconditions:
          - "status == SETTLEMENT_REVIEW"
          - "the same mandatory-batch existence precondition as the CHARGES_SEALED -> SETTLEMENT_REVIEW hop"
        side_effects:
          - "re-reconciles every SettlementBatch of this date that is still DECLARED - which is how a batch redeclared after a recount is re-judged - and leaves MATCHED, ACCEPTED_WITH_VARIANCE, VARIANCE_FLAGGED and RECOUNT_REQUESTED batches alone"
          - "recomputes this date's settlement_variance_total_amount and unresolved_settlement_batch_count"
          - "increments BusinessDate.version by 1"
        note: "A re-verify is what closes the recount cycle: request-recount, redeclare, verify-settlements again. Without it a redeclared batch could never leave DECLARED and the recount limit would be unreachable."
      - from: SETTLEMENT_REVIEW
        to: BALANCED
        trigger: "POST /night-audit/business-dates/{id}/balance"
        actor: NightAuditor
        preconditions:
          - "status == SETTLEMENT_REVIEW or status == REOPENED"
          - "unresolved_settlement_batch_count == 0, else ERR_SETTLEMENTS_UNRESOLVED"
          - "ledger_control_amount == 0.00, else ERR_LEDGERS_OUT_OF_BALANCE"
          - "declined_authorization_count == 0, else ERR_DECLINED_AUTH_UNRESOLVED"
        side_effects:
          - "every CardAuthorization of this property's folios whose status == APPROVED and aging_days >= HotelProperty.card_authorization_valid_days is lapsed to EXPIRED before the preconditions are evaluated"
          - "increments BusinessDate.version by 1"
      - from: REOPENED
        to: BALANCED
        trigger: "POST /night-audit/business-dates/{id}/balance"
        actor: NightAuditor
        preconditions:
          - "status == REOPENED"
          - "unresolved_settlement_batch_count == 0 and ledger_control_amount == 0.00 and declined_authorization_count == 0"
        side_effects:
          - "identical to the SETTLEMENT_REVIEW -> BALANCED transition"
          - "increments BusinessDate.version by 1"
      - from: BALANCED
        to: CLOSED
        trigger: "POST /night-audit/business-dates/{id}/close"
        actor: NightAuditor
        preconditions:
          - "status == BALANCED"
          - "a RevenueReport exists with business_date_id == this.id and status == DISTRIBUTED, else ERR_REPORT_NOT_DISTRIBUTED"
        side_effects:
          - "the owning AccountingPeriod.subsystem_total_amount is recomputed to include this date's total_revenue_amount"
          - "increments BusinessDate.version by 1"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /night-audit/business-dates/{id}/reopen"
        actor: Controller
        preconditions:
          - "status == CLOSED"
          - "the owning AccountingPeriod.status == OPEN, else ERR_PERIOD_NOT_OPEN"
        side_effects:
          - "reopen_count += 1"
          - "every RevenueReport of this date whose status is DRAFT or DISTRIBUTED is set to SUPERSEDED"
          - "because no DISTRIBUTED report remains, the owning AccountingPeriod.subsystem_total_amount is recomputed and this date no longer contributes to it"
          - "increments BusinessDate.version by 1"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /night-audit/accounting-periods/{id}/tie-out reaching TIED_OUT"
        actor: system
        preconditions:
          - "the owning AccountingPeriod transitions to TIED_OUT in this request"
        side_effects:
          - "status becomes ARCHIVED; every subsequent write naming this date is rejected with ERR_BUSINESS_DATE_ARCHIVED"
          - "increments BusinessDate.version by 1"

  - entity: Folio
    dimension: stay_status
    initial_state: RESERVED
    terminal_states: [DEPARTED, NO_SHOW, CANCELLED]
    shape: branching; advances independently of the folio's settlement_status dimension
    transitions:
      - from: RESERVED
        to: IN_HOUSE
        trigger: "POST /night-audit/folios/{id}/check-in"
        actor: FrontDeskAgent
        preconditions:
          - "stay_status == RESERVED, else ERR_FOLIO_NOT_RESERVED"
          - "the BusinessDate named by arrival_business_date_id has status in {OPEN, ROOM_POSTING, REOPENED}"
          - "when abs(rate_variance_pct) > HotelProperty.rate_variance_tolerance_pct, an AuthorizationDocument exists with folio_id == this.id, doc_type == RATE_OVERRIDE, status == ACTIVE and valid_from_date <= arrival BusinessDate.business_date <= valid_to_date, else ERR_RATE_VARIANCE_UNAUTHORIZED"
        side_effects:
          - "stay_status becomes IN_HOUSE; settlement_status is untouched"
          - "increments Folio.version by 1"
      - from: IN_HOUSE
        to: DEPARTED
        trigger: "POST /night-audit/folios/{id}/check-out"
        actor: FrontDeskAgent
        preconditions:
          - "stay_status == IN_HOUSE, else ERR_FOLIO_NOT_IN_HOUSE"
          - "settlement_hold == false, else ERR_DECLINED_AUTH_UNRESOLVED"
          - "when settlement_method == CREDIT_CARD, a CardAuthorization of this folio has status == APPROVED and authorized_amount >= the folio balance projected after the late-checkout charge, else ERR_AUTHORIZATION_SHORTFALL"
          - "the BusinessDate named in the request has status in {OPEN, ROOM_POSTING, REOPENED}, else ERR_CHARGES_ALREADY_SEALED"
        side_effects:
          - "actual_checkout_at is stamped and stay_status becomes DEPARTED"
          - "hop 1: when calculation late_checkout_charge returns a value greater than 0.00, a LATE_CHECKOUT JournalPosting of that amount is appended with source_channel FRONT_DESK"
          - "hop 2: that appended line re-derives this Folio.balance_amount, charges_total_amount and settlement_status"
          - "hop 3: the same line re-derives the named BusinessDate.other_room_revenue_amount, room_revenue_amount and total_revenue_amount"
          - "hop 4: the changed BusinessDate revenue aggregates set every RevenueReport of that date whose status is DRAFT or DISTRIBUTED to SUPERSEDED"
          - "increments Folio.version by 1"
        note: Hops 2-4 each fire because of the previous hop, not because of the check-out itself; a folio whose late-checkout charge is 0.00 produces none of them.
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /night-audit/business-dates/{id}/post-room-and-tax where arrival_business_date_id == that date"
        actor: system
        preconditions:
          - "stay_status == RESERVED and arrival_business_date_id == the date being posted"
        side_effects:
          - "stay_status becomes NO_SHOW and the lines described in calculation no_show_charge are appended"
          - "increments Folio.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /night-audit/folios/{id}/cancel"
        actor: FrontDeskAgent
        preconditions:
          - "stay_status == RESERVED, else ERR_FOLIO_NOT_RESERVED"
          - "balance_amount == 0.00, else ERR_FOLIO_BALANCE_NOT_ZERO"
        side_effects:
          - "stay_status becomes CANCELLED; the folio is skipped by every later post-room-and-tax run"
          - "increments Folio.version by 1"

  - entity: Folio
    dimension: settlement_status
    initial_state: UNSETTLED
    terminal_states: [TRANSFERRED_TO_CITY_LEDGER]
    shape: parallel dimension; re-derived from balance_amount and credits_total_amount on every posting, so it can move backwards while stay_status stays put
    transitions:
      - from: UNSETTLED
        to: PARTIALLY_SETTLED
        trigger: "POST /night-audit/folios/{id}/payments or POST /night-audit/journal-postings or POST /night-audit/card-authorizations/{id}/capture"
        actor: FrontDeskAgent
        preconditions:
          - "after the posting, balance_amount != 0.00 and credits_total_amount != 0.00"
        side_effects:
          - "settlement_status is re-derived to PARTIALLY_SETTLED; stay_status is untouched"
          - "increments Folio.version by 1"
      - from: PARTIALLY_SETTLED
        to: SETTLED
        trigger: "POST /night-audit/folios/{id}/payments or POST /night-audit/journal-postings or POST /night-audit/card-authorizations/{id}/capture"
        actor: FrontDeskAgent
        preconditions:
          - "after the posting, balance_amount == 0.00"
        side_effects:
          - "settlement_status is re-derived to SETTLED"
          - "increments Folio.version by 1"
      - from: UNSETTLED
        to: SETTLED
        trigger: "POST /night-audit/folios/{id}/payments settling the whole balance in one tender"
        actor: FrontDeskAgent
        preconditions:
          - "after the posting, balance_amount == 0.00"
        side_effects:
          - "settlement_status is re-derived to SETTLED"
          - "increments Folio.version by 1"
      - from: SETTLED
        to: UNSETTLED
        trigger: "POST /night-audit/journal-postings appending a charge to an already settled folio"
        actor: FrontDeskAgent
        preconditions:
          - "after the posting, balance_amount != 0.00 and credits_total_amount == 0.00"
        side_effects:
          - "settlement_status is re-derived back to UNSETTLED even when stay_status is already DEPARTED"
          - "increments Folio.version by 1"
        note: This backwards edge is what makes the two Folio dimensions genuinely independent.
      - from: SETTLED
        to: PARTIALLY_SETTLED
        trigger: "POST /night-audit/journal-postings appending a charge to an already settled folio that carries credits"
        actor: FrontDeskAgent
        preconditions:
          - "after the posting, balance_amount != 0.00 and credits_total_amount != 0.00"
        side_effects:
          - "settlement_status is re-derived back to PARTIALLY_SETTLED"
          - "increments Folio.version by 1"
      - from: UNSETTLED
        to: TRANSFERRED_TO_CITY_LEDGER
        trigger: "POST /night-audit/business-dates/{id}/city-ledger-sweep"
        actor: system
        preconditions:
          - "stay_status == DEPARTED and settlement_method == DIRECT_BILL and balance_amount > 0.00"
        side_effects:
          - "the CITY_LEDGER_FEE and LEDGER_TRANSFER lines described in calculation city_ledger_sweep are appended, driving balance_amount to exactly 0.00"
          - "settlement_status becomes TRANSFERRED_TO_CITY_LEDGER and no further payment may be applied to the folio"
          - "increments Folio.version by 1"
      - from: PARTIALLY_SETTLED
        to: TRANSFERRED_TO_CITY_LEDGER
        trigger: "POST /night-audit/business-dates/{id}/city-ledger-sweep"
        actor: system
        preconditions:
          - "stay_status == DEPARTED and settlement_method == DIRECT_BILL and balance_amount > 0.00"
        side_effects:
          - "identical to the UNSETTLED -> TRANSFERRED_TO_CITY_LEDGER edge"
          - "increments Folio.version by 1"

  - entity: Allowance
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED, REVERSED]
    shape: cyclic (SUBMITTED <-> RETURNED_FOR_REVISION, capped at 2 rounds) with a branching approve/reject fork and a compensating REVERSED tail
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /night-audit/allowances/{id}/submit"
        actor: NightAuditor
        preconditions:
          - "status == DRAFT or status == RETURNED_FOR_REVISION, else ERR_ALLOWANCE_NOT_SUBMITTABLE"
          - "reason_code is not NULL, else ERR_REASON_CODE_REQUIRED"
        side_effects:
          - "submitted_at is stamped"
          - "increments Allowance.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /night-audit/allowances/{id}/return-for-revision"
        actor: RevenueManager
        preconditions:
          - "status == SUBMITTED, else ERR_ALLOWANCE_NOT_PENDING"
          - "revision_round < 2, else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "revision_round += 1"
          - "increments Allowance.version by 1"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /night-audit/allowances/{id}/submit"
        actor: NightAuditor
        preconditions:
          - "status == RETURNED_FOR_REVISION"
        side_effects:
          - "submitted_at is re-stamped; revision_round is left where the return-for-revision left it"
          - "increments Allowance.version by 1"
        note: required_approval_role was frozen at creation from requested_amount and is never recomputed by this cycle.
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /night-audit/allowances/{id}/approve"
        actor: RevenueManager
        preconditions:
          - "status == SUBMITTED, else ERR_ALLOWANCE_NOT_PENDING"
          - "the caller's role satisfies required_approval_role per validation allowance_approval_tier, else ERR_APPROVAL_TIER_INSUFFICIENT"
          - "X-User-ID != requested_by_user_id, else ERR_SELF_APPROVAL_FORBIDDEN"
          - "approved_amount <= requested_amount, else ERR_APPROVED_AMOUNT_EXCEEDS_REQUEST"
          - "when requested_amount >= HotelProperty.allowance_controller_threshold_amount, an AuthorizationDocument exists with allowance_id == this.id, doc_type == ALLOWANCE_APPROVAL, status == ACTIVE, else ERR_ALLOWANCE_DOCUMENT_MISSING"
          - "the BusinessDate of this allowance's folio has status in {OPEN, ROOM_POSTING, REOPENED}, else ERR_CHARGES_ALREADY_SEALED"
        side_effects:
          - "approved_amount, approved_by_user_id and approved_at are stamped"
          - "the allowance moves straight on to POSTED inside the same request"
          - "increments Allowance.version by 1"
      - from: APPROVED
        to: POSTED
        trigger: "POST /night-audit/allowances/{id}/approve"
        actor: system
        preconditions:
          - "status == APPROVED inside the approve request"
        side_effects:
          - "hop 1: an ALLOWANCE JournalPosting of -approved_amount is appended to the folio with source_channel NIGHT_AUDIT and its allowance_id is set to this allowance"
          - "hop 2: that line re-derives the Folio.balance_amount, charges_total_amount and settlement_status"
          - "hop 3: the same line re-derives the BusinessDate.room_night_revenue_amount, room_revenue_amount, total_revenue_amount, adr_amount and revpar_amount"
          - "hop 4: the changed BusinessDate revenue aggregates set every RevenueReport of that date whose status is DRAFT or DISTRIBUTED to SUPERSEDED"
          - "increments Allowance.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /night-audit/allowances/{id}/reject"
        actor: RevenueManager
        preconditions:
          - "status == SUBMITTED, else ERR_ALLOWANCE_NOT_PENDING"
          - "X-User-ID != requested_by_user_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "no JournalPosting is written and the allowance is terminal"
          - "increments Allowance.version by 1"
      - from: POSTED
        to: REVERSED
        trigger: "POST /night-audit/allowances/{id}/reverse"
        actor: RevenueManager
        preconditions:
          - "status == POSTED, else ERR_ALLOWANCE_NOT_POSTED"
          - "reverses_allowance_id is NULL, else ERR_ALREADY_A_REVERSAL"
          - "the BusinessDate of this allowance's folio has status in {OPEN, ROOM_POSTING, REOPENED}, else ERR_CHARGES_ALREADY_SEALED"
        side_effects:
          - "a compensating Allowance is minted with status POSTED, reverses_allowance_id == this.id, reason_code copied from this allowance, requested_amount == approved_amount == this.approved_amount"
          - "a JournalPosting of +approved_amount and charge_type ALLOWANCE is appended, so the folio's balance_amount returns to its pre-approval value exactly while charges_total_amount rises by approved_amount and credits_total_amount keeps the original -approved_amount"
          - "the BusinessDate revenue aggregates return to their pre-approval values exactly and every affected RevenueReport is SUPERSEDED again"
          - "increments Allowance.version by 1"

  - entity: SettlementBatch
    dimension: status
    initial_state: DECLARED
    terminal_states: [MATCHED, ACCEPTED_WITH_VARIANCE]
    shape: cyclic (VARIANCE_FLAGGED -> RECOUNT_REQUESTED -> DECLARED, capped at 2 recounts) with a branching match/variance fork evaluated by the system
    transitions:
      - from: DECLARED
        to: MATCHED
        trigger: "POST /night-audit/business-dates/{id}/verify-settlements"
        actor: system
        preconditions:
          - "status == DECLARED and abs(variance_amount) <= HotelProperty.settlement_variance_tolerance_amount"
        side_effects:
          - "system_amount and variance_amount are stamped and the batch stops counting towards BusinessDate.unresolved_settlement_batch_count"
          - "increments SettlementBatch.version by 1"
      - from: DECLARED
        to: VARIANCE_FLAGGED
        trigger: "POST /night-audit/business-dates/{id}/verify-settlements"
        actor: system
        preconditions:
          - "status == DECLARED and abs(variance_amount) > HotelProperty.settlement_variance_tolerance_amount"
        side_effects:
          - "system_amount and variance_amount are stamped and the batch counts towards BusinessDate.unresolved_settlement_batch_count and settlement_variance_total_amount"
          - "increments SettlementBatch.version by 1"
      - from: VARIANCE_FLAGGED
        to: RECOUNT_REQUESTED
        trigger: "POST /night-audit/settlement-batches/{id}/request-recount"
        actor: NightAuditor
        preconditions:
          - "status == VARIANCE_FLAGGED, else ERR_BATCH_NOT_FLAGGED"
          - "recount_round < 2, else ERR_RECOUNT_LIMIT_REACHED"
        side_effects:
          - "recount_round += 1; the batch still counts as unresolved"
          - "increments SettlementBatch.version by 1"
      - from: RECOUNT_REQUESTED
        to: DECLARED
        trigger: "POST /night-audit/settlement-batches/{id}/redeclare"
        actor: OutletManager
        preconditions:
          - "status == RECOUNT_REQUESTED, else ERR_BATCH_NOT_AWAITING_RECOUNT"
          - "the caller's outlet_id equals this batch's outlet_id, else ERR_OUTLET_SCOPE_VIOLATION"
        side_effects:
          - "declared_amount is replaced, variance_amount is cleared to NULL and the batch awaits the next verify-settlements run"
          - "increments SettlementBatch.version by 1"
      - from: VARIANCE_FLAGGED
        to: ACCEPTED_WITH_VARIANCE
        trigger: "POST /night-audit/settlement-batches/{id}/accept-variance"
        actor: RevenueManager
        preconditions:
          - "status == VARIANCE_FLAGGED, else ERR_BATCH_NOT_FLAGGED"
          - "X-User-ID != declared_by_user_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "the batch stops counting towards BusinessDate.unresolved_settlement_batch_count while still contributing to settlement_variance_total_amount"
          - "increments SettlementBatch.version by 1"

  - entity: CardAuthorization
    dimension: status
    initial_state: APPROVED
    terminal_states: [EXPIRED, CAPTURED]
    shape: branching, with an aging-driven system lapse to EXPIRED; advances independently of the follow_up_status dimension
    transitions:
      - from: APPROVED
        to: DECLINED
        trigger: "POST /night-audit/card-authorizations/{id}/decline"
        actor: FrontDeskAgent
        preconditions:
          - "status == APPROVED, else ERR_AUTHORIZATION_NOT_APPROVED"
        side_effects:
          - "hop 1: follow_up_status is forced from NOT_REQUIRED to PENDING on the parallel dimension"
          - "hop 2: the owning Folio.settlement_hold becomes true, which blocks check-out with ERR_DECLINED_AUTH_UNRESOLVED"
          - "hop 3: the folio's BusinessDate.declined_authorization_count is recomputed upwards, which blocks the date from reaching BALANCED"
          - "increments CardAuthorization.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /night-audit/business-dates/{id}/balance or any read of the authorization"
        actor: system
        preconditions:
          - "status == APPROVED and aging_days >= HotelProperty.card_authorization_valid_days"
        side_effects:
          - "the authorization stops satisfying the CREDIT_CARD check-out precondition, so check-out then fails with ERR_AUTHORIZATION_SHORTFALL"
          - "increments CardAuthorization.version by 1"
      - from: APPROVED
        to: CAPTURED
        trigger: "POST /night-audit/card-authorizations/{id}/capture"
        actor: NightAuditor
        preconditions:
          - "aging_days < HotelProperty.card_authorization_valid_days, else ERR_AUTHORIZATION_EXPIRED - the aging recompute runs before the status gate on capture, so an authorization that lapses during this request is reported as EXPIRED and not as NOT_APPROVED"
          - "status is APPROVED, or was APPROVED until this request's own lapse pass, else ERR_AUTHORIZATION_NOT_APPROVED - which is how a DECLINED or CAPTURED authorization is refused"
          - "captured_amount <= authorized_amount, else ERR_CAPTURE_EXCEEDS_AUTHORIZATION"
        side_effects:
          - "a PAYMENT JournalPosting of -captured_amount is appended to the folio with source_channel FRONT_DESK"
          - "the folio's credits_total_amount, balance_amount and settlement_status are re-derived; the BusinessDate revenue aggregates are unchanged because PAYMENT is not a revenue charge_type"
          - "increments CardAuthorization.version by 1"

  - entity: CardAuthorization
    dimension: follow_up_status
    initial_state: NOT_REQUIRED
    terminal_states: [RESOLVED, ESCALATED]
    shape: parallel dimension; only a decline opens it, and it can reach RESOLVED while the status dimension stays DECLINED forever
    transitions:
      - from: NOT_REQUIRED
        to: PENDING
        trigger: "POST /night-audit/card-authorizations/{id}/decline"
        actor: system
        preconditions:
          - "the status dimension moves APPROVED -> DECLINED in this request"
        side_effects:
          - "follow_up_status becomes PENDING"
      - from: PENDING
        to: CONTACTED
        trigger: "POST /night-audit/card-authorizations/{id}/follow-up with follow_up_action CONTACT"
        actor: FrontDeskAgent
        preconditions:
          - "follow_up_status == PENDING, else ERR_FOLLOW_UP_NOT_PENDING"
        side_effects:
          - "follow_up_note is stored; Folio.settlement_hold stays true"
          - "increments CardAuthorization.version by 1"
      - from: CONTACTED
        to: RESOLVED
        trigger: "POST /night-audit/card-authorizations/{id}/follow-up with follow_up_action RESOLVE"
        actor: FrontDeskAgent
        preconditions:
          - "follow_up_status == CONTACTED, else ERR_FOLLOW_UP_NOT_CONTACTED"
          - "the owning Folio has at least one JournalPosting with charge_type PAYMENT, else ERR_FOLLOW_UP_NO_REPLACEMENT_TENDER"
        side_effects:
          - "Folio.settlement_hold is recomputed to false and the folio's BusinessDate.declined_authorization_count is recomputed downwards, unblocking BALANCED"
          - "increments CardAuthorization.version by 1"
      - from: CONTACTED
        to: ESCALATED
        trigger: "POST /night-audit/card-authorizations/{id}/follow-up with follow_up_action ESCALATE"
        actor: FrontDeskAgent
        preconditions:
          - "follow_up_status == CONTACTED, else ERR_FOLLOW_UP_NOT_CONTACTED"
        side_effects:
          - "the folio balance is left for the city-ledger sweep; Folio.settlement_hold stays true and declined_authorization_count is unchanged"
          - "increments CardAuthorization.version by 1"

  - entity: AccountingPeriod
    dimension: status
    initial_state: OPEN
    terminal_states: [TIED_OUT]
    shape: cyclic (TIE_OUT_FAILED -> TIE_OUT_IN_PROGRESS retry, capped at 3 attempts) with a system-evaluated pass/fail fork
    transitions:
      - from: OPEN
        to: TIE_OUT_IN_PROGRESS
        trigger: "POST /night-audit/accounting-periods/{id}/tie-out"
        actor: Controller
        preconditions:
          - "status == OPEN or status == TIE_OUT_FAILED, else ERR_PERIOD_NOT_TIEABLE"
          - "every BusinessDate of this period has status in {CLOSED, ARCHIVED}, else ERR_PERIOD_HAS_OPEN_DATES"
        side_effects:
          - "gl_control_total_amount from the request is stored and subsystem_total_amount is recomputed from the period's CLOSED dates"
          - "tie_out_variance_amount is computed per calculation period_tie_out and the period moves on to TIED_OUT or TIE_OUT_FAILED inside the same request"
          - "increments AccountingPeriod.version by 1"
      - from: TIE_OUT_IN_PROGRESS
        to: TIED_OUT
        trigger: "POST /night-audit/accounting-periods/{id}/tie-out"
        actor: system
        preconditions:
          - "abs(tie_out_variance_amount) <= 0.00"
        side_effects:
          - "tied_out_at is stamped and audit_trail_retention_until_date is computed per calculation audit_retention_date"
          - "every BusinessDate of this period with status CLOSED becomes ARCHIVED; dates already ARCHIVED are left alone"
          - "increments AccountingPeriod.version by 1"
      - from: TIE_OUT_IN_PROGRESS
        to: TIE_OUT_FAILED
        trigger: "POST /night-audit/accounting-periods/{id}/tie-out"
        actor: system
        preconditions:
          - "abs(tie_out_variance_amount) > 0.00"
        side_effects:
          - "tie_out_attempt_count += 1; no BusinessDate is archived and audit_trail_retention_until_date stays NULL"
          - "increments AccountingPeriod.version by 1"
      - from: TIE_OUT_FAILED
        to: TIE_OUT_IN_PROGRESS
        trigger: "POST /night-audit/accounting-periods/{id}/tie-out"
        actor: Controller
        preconditions:
          - "status == TIE_OUT_FAILED"
          - "tie_out_attempt_count < 3, else ERR_TIE_OUT_ATTEMPT_LIMIT_REACHED"
        side_effects:
          - "the retry re-reads gl_control_total_amount from the new request and re-evaluates the fork"
          - "increments AccountingPeriod.version by 1"

  - entity: AuthorizationDocument
    dimension: status
    initial_state: PENDING
    terminal_states: [REJECTED, REVOKED]
    shape: branching review fork with a revocation tail that only affects future evaluations
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /night-audit/authorization-documents/{id}/review with decision APPROVE"
        actor: RevenueManager
        preconditions:
          - "status == PENDING, else ERR_DOCUMENT_NOT_PENDING"
          - "X-User-ID != filed_by_user_id, else ERR_SELF_APPROVAL_FORBIDDEN"
        side_effects:
          - "reviewed_by_user_id and reviewed_at are stamped; the document now satisfies comp, rate-override and allowance-approval preconditions inside its date interval"
          - "increments AuthorizationDocument.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /night-audit/authorization-documents/{id}/review with decision REJECT"
        actor: RevenueManager
        preconditions:
          - "status == PENDING, else ERR_DOCUMENT_NOT_PENDING"
        side_effects:
          - "the document never satisfies any precondition and is terminal"
          - "increments AuthorizationDocument.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /night-audit/authorization-documents/{id}/revoke"
        actor: Controller
        preconditions:
          - "status == ACTIVE, else ERR_DOCUMENT_NOT_ACTIVE"
        side_effects:
          - "lines already posted under the document are left in place; every later evaluation treats the document as absent, so the next post-room-and-tax run over a covered comp folio fails with ERR_COMP_AUTHORIZATION_MISSING"
          - "increments AuthorizationDocument.version by 1"
        note: Deliberately not retroactive; this is what lets a revoke break tomorrow's audit run without rewriting yesterday's ledger.

  - entity: OutletTicket
    dimension: status
    initial_state: OPEN
    terminal_states: [VOID]
    shape: linear with a compensating void tail
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /night-audit/outlet-tickets/{id}/close"
        actor: OutletManager
        preconditions:
          - "status == OPEN, else ERR_TICKET_NOT_OPEN"
          - "the caller's outlet_id equals this ticket's outlet_id, else ERR_OUTLET_SCOPE_VIOLATION"
          - "the BusinessDate has status in {OPEN, ROOM_POSTING, REOPENED}, else ERR_CHARGES_ALREADY_SEALED"
        side_effects:
          - "closed_at is stamped; the ticket now counts towards BusinessDate.closed_outlet_ticket_count and its total_amount towards SettlementBatch.system_amount for any batch of the same outlet, date and tender type whose half-open window contains transmitted_at"
          - "when room_charge_folio_id is not NULL, an OUTLET_TRANSFER JournalPosting of total_amount is appended and the folio's charges_total_amount, balance_amount and settlement_status are re-derived"
          - "increments OutletTicket.version by 1"
      - from: CLOSED
        to: VOID
        trigger: "POST /night-audit/outlet-tickets/{id}/void"
        actor: OutletManager
        preconditions:
          - "status == CLOSED, else ERR_TICKET_NOT_CLOSED"
          - "the BusinessDate has status in {OPEN, ROOM_POSTING, REOPENED}, else ERR_CHARGES_ALREADY_SEALED"
        side_effects:
          - "voided_at is stamped and BusinessDate.closed_outlet_ticket_count returns to exactly its pre-close value"
          - "when room_charge_folio_id is not NULL, a reversing OUTLET_TRANSFER JournalPosting of -total_amount is appended so the folio's balance_amount returns to exactly its pre-close value; charges_total_amount is unchanged and credits_total_amount falls by total_amount"
          - "the ticket no longer contributes to SettlementBatch.system_amount"
          - "increments OutletTicket.version by 1"

  - entity: RevenueReport
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear with a system-driven supersede tail fed by three different producers
    transitions:
      - from: DRAFT
        to: DISTRIBUTED
        trigger: "POST /night-audit/revenue-reports/{id}/distribute"
        actor: RevenueManager
        preconditions:
          - "status == DRAFT, else ERR_REPORT_NOT_DRAFT"
          - "recipient_role_list is a non-empty array, else ERR_DISTRIBUTION_LIST_EMPTY"
        side_effects:
          - "distributed_at is stamped and the report now satisfies the BusinessDate close precondition"
          - "increments RevenueReport.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /night-audit/revenue-reports for the same business_date_id, or POST /night-audit/business-dates/{id}/reopen, or any JournalPosting that changes that date's revenue aggregates"
        actor: system
        preconditions:
          - "status == DRAFT and a newer report or an aggregate change exists for the same business_date_id"
        side_effects:
          - "the report is terminal and can no longer be distributed"
          - "increments RevenueReport.version by 1"
      - from: DISTRIBUTED
        to: SUPERSEDED
        trigger: "POST /night-audit/revenue-reports for the same business_date_id, or POST /night-audit/business-dates/{id}/reopen, or any JournalPosting that changes that date's revenue aggregates"
        actor: system
        preconditions:
          - "status == DISTRIBUTED and a newer report or an aggregate change exists for the same business_date_id"
        side_effects:
          - "the date loses its DISTRIBUTED report, so BusinessDate close is blocked again with ERR_REPORT_NOT_DISTRIBUTED"
          - "increments RevenueReport.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: revenue-report-create-stale-business-date
    parent_entity: BusinessDate
    child_entity: RevenueReport
    write_endpoint: "POST /night-audit/revenue-reports"
    occ_field: expected_business_date_version
    contention_window: "A revenue report snapshots the whole revenue picture of one BusinessDate and, on success, supersedes the date's previous report. Any write that lands on that date between the read and the report creation - a late outlet transfer, an allowance approval, a settlement verification, a reopen - moves the date's version and changes the numbers the caller believed it was publishing."
    check: "The client reads the BusinessDate, notes its version, and sends that value as expected_business_date_version. The server compares the value against the BusinessDate.version it holds at the moment the report is created; equal means the snapshot is still current and the report is written, unequal means the caller was working from stale revenue aggregates."
    resolution: "On mismatch nothing is written: no RevenueReport row is created, the previous report keeps its DISTRIBUTED status, and the BusinessDate.version is untouched. The caller must re-read the BusinessDate and resubmit with the fresh version."
    error_id: ERR_STALE_BUSINESS_DATE_VERSION
    http_status: 412
    note: "This is the only OCC-guarded write in the API. Every other endpoint mutates a single aggregate whose own state preconditions already reject a stale caller, so guarding them with a version token would add ceremony without adding a real check."

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: rate_variance_pct
    trigger: On Folio creation and on every read of the folio.
    algorithm: aggregation
    formula: |
      standard = HotelProperty(folio.property_id).standard_room_rate_amount
      rate_variance_pct = round((folio.contracted_rate_amount - standard) * 100 / standard, 2)
    input_set: The single folio and its property's published rack rate; no other folio and no posting participates.
    constants: {}
    precision: "2 decimal places, round_half_up; signed - a discount is negative, an upsell positive"

  - name: occupancy_tax
    trigger: "PROVISIONAL runs inside POST /night-audit/business-dates/{id}/post-room-and-tax; FINAL runs inside POST /night-audit/business-dates/{id}/seal-charges."
    algorithm: aggregation
    formula: |
      pct = HotelProperty(folio.property_id).occupancy_tax_rate_pct
      taxable_types = {ROOM, NO_SHOW, ALLOWANCE}

      # variant PROVISIONAL - one rounded tax line per taxable charge line, gross of credits
      for each line L just appended with L.charge_type in {ROOM, NO_SHOW}:
          tax_line_amount = round(L.amount * pct / 100, 2)

      # variant FINAL - one rounded figure per folio, net of credits
      net_base = signed_sum(L.amount for L in folio lines
                            where L.business_date_id == date.id
                              and L.charge_type in taxable_types)
      final_tax = round(net_base * pct / 100, 2)
    input_set: JournalPosting rows of one folio stamped to the date being audited whose charge_type is in the taxable set. OCCUPANCY_TAX, TAX_TRUE_UP, LATE_CHECKOUT, MISC_CHARGE, OUTLET_TRANSFER, PAYMENT, DEPOSIT_APPLIED, LEDGER_TRANSFER and CITY_LEDGER_FEE lines never enter either variant's base.
    constants:
      TAXABLE_CHARGE_TYPES: [ROOM, NO_SHOW, ALLOWANCE]
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "During the room-and-tax run, before allowances for the day have been reviewed. Each ROOM or NO_SHOW line is taxed on its own gross amount and rounded independently, so the day's provisional tax is a sum of per-line roundings."
        difference: "ALLOWANCE credits are invisible to it, and rounding happens per line rather than once per folio."
      - name: FINAL
        when: "During seal-charges, once the day's allowances are posted. One base is formed by netting every taxable line of the folio - credits included - and rounded once."
        difference: "Net-of-credit base plus sum-then-round. On a folio carrying ROOM 189.99 and ALLOWANCE -50.00 at 8.875%, PROVISIONAL yields 16.86 while FINAL yields 12.42 from the same rows."

  - name: occupancy_tax_final_true_up
    trigger: "POST /night-audit/business-dates/{id}/seal-charges, once per folio holding at least one taxable line on the date."
    algorithm: aggregation
    formula: |
      posted_provisional = signed_sum(L.amount for L in folio lines
                                      where L.business_date_id == date.id
                                        and L.charge_type == OCCUPANCY_TAX)
      final_tax = occupancy_tax variant FINAL for this folio and date
      delta = round(final_tax - posted_provisional, 2)
      if delta == 0.00:  append nothing
      else:              append a TAX_TRUE_UP line of amount == delta
    input_set: One folio's OCCUPANCY_TAX lines for the date, compared against a freshly computed FINAL figure. Folios with no taxable line on the date are skipped entirely.
    constants: {}
    precision: "2 decimal places, round_half_up; the delta is signed and is negative whenever the folio received an allowance after its provisional tax was posted"
    note: "Worked example - ROOM 189.99, ALLOWANCE -50.00, occupancy_tax_rate_pct 8.875: posted_provisional 16.86, final_tax 12.42, delta -4.44, and the folio's balance after the true-up is 189.99 + 16.86 - 50.00 - 4.44 = 152.41."

  - name: room_and_tax_provisional_posting
    trigger: "POST /night-audit/business-dates/{id}/post-room-and-tax"
    algorithm: chronological
    formula: |
      # folios are processed in ascending Folio.created_at, never by id
      for folio in folios(property_id == date.property_id, stay_status == IN_HOUSE)
                    ordered by created_at ascending:
          posted_nights = count(L for L in folio lines where L.charge_type == ROOM)
          if posted_nights >= folio.nights_count:  skip this folio
          room_amount = 0.00 if folio.is_comp else folio.contracted_rate_amount
          append ROOM line   (amount = room_amount, night_index = posted_nights + 1)
          append OCCUPANCY_TAX line (amount = round(room_amount * pct / 100, 2),
                                     night_index = posted_nights + 1)
    input_set: Folios of the audited property whose stay_status is IN_HOUSE and whose already-posted ROOM line count is below nights_count. RESERVED folios are handled by no_show_charge instead; DEPARTED, NO_SHOW and CANCELLED folios are skipped.
    constants: {}
    precision: "2 decimal places, round_half_up; a comp folio produces a ROOM line of exactly 0.00 and an OCCUPANCY_TAX line of exactly 0.00, both of which still exist as rows"
    note: The night_index makes a repeated run a no-op for already-fully-posted folios while still letting a multi-night stay accrue one night per audit run.

  - name: no_show_charge
    trigger: "POST /night-audit/business-dates/{id}/post-room-and-tax, for folios whose arrival_business_date_id is the date being audited and whose stay_status is still RESERVED."
    algorithm: threshold
    formula: |
      policy = HotelProperty(folio.property_id).no_show_charge_policy
      if policy == NONE:
          append nothing; stay_status still becomes NO_SHOW
      elif policy == FIRST_NIGHT_PLUS_TAX:
          append NO_SHOW line       (amount = folio.contracted_rate_amount)
          append OCCUPANCY_TAX line (amount = round(folio.contracted_rate_amount * pct / 100, 2))
      elif policy == FULL_STAY_NO_TAX:
          append NO_SHOW line       (amount = round(folio.contracted_rate_amount * folio.nights_count, 2))
          append no OCCUPANCY_TAX line
    input_set: One RESERVED folio whose arrival date is the date under audit. A RESERVED folio arriving on a later date is untouched, and a CANCELLED folio is never a no-show.
    constants: {}
    precision: "2 decimal places, round_half_up"
    note: "Worked example - contracted_rate_amount 175.00, nights_count 2, occupancy_tax_rate_pct 8.875: FIRST_NIGHT_PLUS_TAX yields 175.00 + 15.53, FULL_STAY_NO_TAX yields 350.00 alone, NONE yields nothing."

  - name: late_checkout_charge
    trigger: "POST /night-audit/folios/{id}/check-out"
    algorithm: tiered_pricing
    formula: |
      grace   = HotelProperty(folio.property_id).late_checkout_grace_minutes
      rate    = folio.contracted_rate_amount
      overdue = floor((actual_checkout_at - folio.scheduled_checkout_at) / 60 seconds)

      if overdue <= grace:                       charge = 0.00
      else:
          if   overdue <= TIER_1_MINUTES:  pct = 0.25
          elif overdue <= TIER_2_MINUTES:  pct = 0.50
          else:                            pct = 1.00
          # the tier result is rounded FIRST, then clamped by a floor and a ceiling
          tiered = round(rate * pct, 2)
          charge = round(min(max(tiered, LATE_CHECKOUT_FLOOR_AMOUNT), rate), 2)
    input_set: The single folio being checked out, its property's grace window, and the logical clock reading stamped into actual_checkout_at. No other folio and no posting participates.
    constants:
      TIER_1_MINUTES: 180
      TIER_2_MINUTES: 360
      TIER_1_PCT: 0.25
      TIER_2_PCT: 0.50
      TIER_3_PCT: 1.00
      LATE_CHECKOUT_FLOOR_AMOUNT: 25.00
    precision: "2 decimal places, round_half_up; overdue minutes are floored, so 30 minutes and 59 seconds is 30 overdue minutes"
    note: |
      The nested min(max(...), rate) is order-sensitive and the ceiling deliberately wins over the floor.
      Worked examples at grace 30 - (189.99, 30 min) -> 0.00; (189.99, 31 min) -> 47.50;
      (250.00, 180 min) -> 62.50; (250.00, 181 min) -> 125.00; (250.00, 361 min) -> 250.00;
      (80.00, 60 min) -> 25.00 because the floor bites; (20.00, 400 min) -> 20.00 because the
      rate ceiling overrides the 25.00 floor. Applying the floor after the ceiling would return
      25.00 for that last case and is wrong.

  - name: outlet_ticket_total
    trigger: "POST /night-audit/outlet-tickets/{id}/close"
    algorithm: threshold
    formula: |
      prop = HotelProperty(Outlet(ticket.outlet_id).property_id)

      service_charge_amount      = round(ticket.gross_amount * prop.service_charge_pct / 100, 2)
      taxable_base_amount        = ticket.gross_amount + service_charge_amount
      tax_amount                 = round(taxable_base_amount * prop.fb_tax_rate_pct / 100, 2)

      # the threshold is tested against taxable_base_amount,
      # but the discount is a percentage of gross_amount
      if taxable_base_amount >= prop.large_ticket_threshold_amount:
          large_party_discount_amount = round(ticket.gross_amount * prop.large_party_discount_pct / 100, 2)
      else:
          large_party_discount_amount = 0.00

      # the discount NEVER feeds back into service_charge_amount or tax_amount
      total_amount = taxable_base_amount + tax_amount - large_party_discount_amount
    input_set: One OutletTicket and its outlet's property configuration. The ticket's own gross_amount is the only money input; no other ticket on the same shift or folio participates.
    constants: {}
    precision: "2 decimal places, round_half_up; each of service_charge_amount, tax_amount and large_party_discount_amount is rounded independently before total_amount is formed"
    note: |
      The dependency looks circular and is not: the discount is gated on a base that already
      contains the service charge, yet the discount must not cause the service charge or the tax
      to be recomputed on the discounted amount. At service_charge_pct 18.0, fb_tax_rate_pct 6.25,
      large_ticket_threshold_amount 472.00 and large_party_discount_pct 5.0:
        gross 400.00 -> svc 72.00, base 472.00 (exactly at the threshold, so the discount applies),
                        tax 29.50, discount 20.00, total 481.50
        gross 399.99 -> svc 72.00, base 471.99 (one cent below, no discount),
                        tax 29.50, discount 0.00, total 501.49
        gross 500.00 -> svc 90.00, base 590.00, tax 36.88, discount 25.00, total 601.88
        gross 120.00 -> svc 21.60, base 141.60, tax  8.85, discount  0.00, total 150.45
      Discounting first and then recomputing the service charge and tax on 380.00 returns 476.43
      for the gross-400.00 ticket - a 5.07 divergence from the correct 481.50.

  - name: city_ledger_sweep
    trigger: "POST /night-audit/business-dates/{id}/city-ledger-sweep"
    algorithm: chronological
    formula: |
      prop    = HotelProperty(date.property_id)
      city_gl = LedgerAccount(property_id == date.property_id, ledger_type == CITY_LEDGER)

      fee_total = 0.00 ; transferred_total = 0.00 ; swept = 0
      for folio in folios(property_id == date.property_id,
                          stay_status == DEPARTED,
                          settlement_method == DIRECT_BILL,
                          settlement_status != TRANSFERRED_TO_CITY_LEDGER,
                          balance_amount > 0.00)
                    ordered by created_at ascending:
          balance = folio.balance_amount
          fee     = round(balance * prop.city_ledger_fee_pct / 100, 2)   # rounded per folio
          append CITY_LEDGER_FEE  line (folio_id = folio.id, ledger_account_id = null,
                                        amount = +fee)
          append LEDGER_TRANSFER  line (folio_id = folio.id, ledger_account_id = null,
                                        amount = -(balance + fee))
          append LEDGER_TRANSFER  line (folio_id = null,     ledger_account_id = city_gl.id,
                                        amount = +(balance + fee))
          folio.settlement_status = TRANSFERRED_TO_CITY_LEDGER
          fee_total         += fee          # sum of already-rounded per-folio fees
          transferred_total += balance
          swept             += 1

      date.city_ledger_swept_folio_count               = swept
      date.city_ledger_transferred_balance_total_amount = transferred_total
      date.city_ledger_fee_total_amount                 = fee_total
    input_set: DEPARTED, DIRECT_BILL folios of the property with a strictly positive balance that have not already been swept. Folios still IN_HOUSE, folios settled to zero, CREDIT_CARD or CASH folios, and folios already TRANSFERRED_TO_CITY_LEDGER are all excluded, which makes a second sweep of the same date a no-op that resets all three totals to 0.00 / 0.
    constants: {}
    precision: "2 decimal places, round_half_up, applied once per folio BEFORE summation - never once over the summed balances"
    note: |
      Round-then-sum is observable. At city_ledger_fee_pct 1.5 over balances 210.00, 77.77 and
      101.67 taken in created_at order, the per-folio fees are 3.15, 1.17 and 1.53 for a
      city_ledger_fee_total_amount of 5.85; rounding once over the summed 389.44 would give 5.84.
      The two LEDGER_TRANSFER rows per folio are equal and opposite, so the sweep leaves
      BusinessDate.ledger_control_amount at exactly 0.00.

  - name: settlement_reconciliation
    trigger: "POST /night-audit/business-dates/{id}/verify-settlements, once per SettlementBatch of the date whose status is DECLARED."
    algorithm: interval_merge
    formula: |
      matching = [t for t in OutletTicket
                    where t.outlet_id         == batch.outlet_id
                      and t.business_date_id  == batch.business_date_id
                      and t.status            == CLOSED
                      and t.settlement_type   == batch.tender_type
                      and batch.shift_start_at <= t.transmitted_at < batch.shift_end_at]

      system_amount   = sum(t.total_amount for t in matching)
      variance_amount = round(batch.declared_amount - system_amount, 2)

      if abs(variance_amount) <= HotelProperty.settlement_variance_tolerance_amount:
          batch.status = MATCHED
      else:
          batch.status = VARIANCE_FLAGGED
    input_set: CLOSED tickets of the same outlet, date and tender type whose transmitted_at falls in the half-open window [shift_start_at, shift_end_at). OPEN and VOID tickets never count, ROOM_CHARGE tickets never match any tender type, and a remote point-of-sale ticket that transmits at exactly shift_end_at falls into the NEXT shift.
    constants: {}
    precision: "2 decimal places, round_half_up; the window comparison is inclusive at the start and exclusive at the end, so two adjacent shifts sharing an instant never double-count a ticket"
    note: |
      Worked example at settlement_variance_tolerance_amount 5.00 with a CASH window of
      [2026-08-01T14:00:00.000Z, 2026-08-01T22:00:00.000Z) - tickets totalling 150.45 (transmitted
      15:00:00.000Z) and 481.50 (transmitted 21:59:59.999Z) are inside, a 75.23 ticket transmitted
      at exactly 22:00:00.000Z is outside, so system_amount is 631.95. Declared 707.18 gives
      variance +75.23 and VARIANCE_FLAGGED; declared 636.95 gives exactly 5.00 and MATCHED;
      declared 636.96 gives 5.01 and VARIANCE_FLAGGED.

  - name: folio_balance
    trigger: On every JournalPosting append that names the folio, and on every read of the folio.
    algorithm: aggregation
    formula: |
      charges_total_amount = sum(L.amount for L in folio lines if L.amount > 0)
      credits_total_amount = sum(L.amount for L in folio lines if L.amount < 0)
      balance_amount       = round(charges_total_amount + credits_total_amount, 2)

      if   balance_amount == 0.00:                                   settlement_status = SETTLED
      elif credits_total_amount != 0.00:                             settlement_status = PARTIALLY_SETTLED
      else:                                                          settlement_status = UNSETTLED
      # a folio already TRANSFERRED_TO_CITY_LEDGER is never re-derived
    input_set: Every JournalPosting row whose folio_id is this folio, across every business date - the folio balance is not date-scoped. Reversing rows participate as ordinary signed rows rather than deleting their originals.
    constants: {}
    precision: "2 decimal places, round_half_up; credits_total_amount is a negative magnitude"
    note: The derivation runs on every append, which is why a charge landing on an already SETTLED folio drives settlement_status backwards without disturbing stay_status.

  - name: occupancy_statistics
    trigger: On every JournalPosting append stamped to the date, on every business-date transition, and on RevenueReport creation.
    algorithm: aggregation
    formula: |
      rooms_available_count = HotelProperty.room_count_total - date.out_of_order_room_count
      rooms_occupied_count  = count(distinct L.folio_id for L in lines(date)
                                     if L.charge_type == ROOM
                                        and no other line reverses L)

      occupancy_pct = 0.00 if rooms_available_count == 0
                      else round(rooms_occupied_count * 100 / rooms_available_count, 2)
      adr_amount    = 0.00 if rooms_occupied_count == 0
                      else round(date.room_night_revenue_amount / rooms_occupied_count, 2)
      revpar_amount = 0.00 if rooms_available_count == 0
                      else round(date.room_night_revenue_amount / rooms_available_count, 2)

      total_revenue_amount = date.room_revenue_amount
                           + date.tax_revenue_amount
                           + date.outlet_revenue_amount
    input_set: ROOM lines of the date decide occupancy - a comp room's 0.00 ROOM line still counts as an occupied room, while a NO_SHOW line does not. room_night_revenue_amount nets ALLOWANCE credits, so an allowance lowers ADR without lowering the occupied count.
    constants: {}
    precision: "2 decimal places, round_half_up; the empty-set cases return exactly 0.00 rather than erroring or yielding null"
    note: |
      Worked example - room_count_total 100, out_of_order_room_count 4, three folios receiving
      ROOM lines of 189.99, 249.00 and 0.00 (comp) plus one no-show at 175.00, occupancy tax
      8.875%, no outlet tickets: rooms_available_count 96, rooms_occupied_count 3,
      room_night_revenue_amount 438.99, other_room_revenue_amount 175.00,
      room_revenue_amount 613.99, tax_revenue_amount 54.49, occupancy_pct 3.13,
      adr_amount 146.33, revpar_amount 4.57, total_revenue_amount 668.48.

  - name: pace_index
    trigger: "POST /night-audit/revenue-reports, evaluated once at report creation and frozen into the report row."
    algorithm: aggregation
    formula: |
      # variant CALENDAR_ALIGNED
      benchmark_room_revenue_amount = date.benchmark_calendar_room_revenue_amount
      # variant WEEKDAY_ALIGNED
      benchmark_room_revenue_amount = date.benchmark_weekday_room_revenue_amount

      pace_index_pct = 0.00 if benchmark_room_revenue_amount == 0.00
                       else round(date.room_revenue_amount * 100
                                  / benchmark_room_revenue_amount, 2)
    input_set: One BusinessDate's room_revenue_amount over one of its two stored prior-year benchmarks, selected by the report's pace_basis. Tax and outlet revenue never enter the pace numerator.
    constants: {}
    precision: "2 decimal places, round_half_up; a zero benchmark yields exactly 0.00 rather than a division error"
    variants:
      - name: CALENDAR_ALIGNED
        when: "pace_basis == CALENDAR_ALIGNED - compares the day against the same calendar day of the prior year."
        difference: "Divides by benchmark_calendar_room_revenue_amount."
      - name: WEEKDAY_ALIGNED
        when: "pace_basis == WEEKDAY_ALIGNED - compares the day against the same weekday of the prior year, which is a different calendar date and therefore a different denominator."
        difference: "Divides by benchmark_weekday_room_revenue_amount. On a date with room_revenue_amount 613.99, benchmark_calendar 400.00 and benchmark_weekday 520.00, CALENDAR_ALIGNED yields 153.50 and WEEKDAY_ALIGNED yields 118.08 from identical revenue."

  - name: ledger_control
    trigger: On every JournalPosting append stamped to the date and on every read of the date.
    algorithm: aggregation
    formula: |
      ledger_control_amount = round(
          sum(L.amount for L in lines(date)
              if L.charge_type in {LEDGER_TRANSFER, DEPOSIT_APPLIED}), 2)
    input_set: Only LEDGER_TRANSFER and DEPOSIT_APPLIED lines of the date, counting both the folio side and the ledger-account side. Every transfer the system mints is a balanced equal-and-opposite pair, so the total stays 0.00 unless a client posts one leg on its own.
    constants: {}
    precision: "2 decimal places, round_half_up; the date may reach BALANCED only while this figure is exactly 0.00"

  - name: authorization_aging
    trigger: On every read of a CardAuthorization and on every write that touches its row, including the balance run's lapse pass.
    algorithm: decay_function
    formula: |
      elapsed_seconds = logical_clock_now - authorization.obtained_at
      aging_days      = floor(elapsed_seconds / 86400)

      if authorization.status == APPROVED
         and aging_days >= HotelProperty.card_authorization_valid_days:
          authorization.status = EXPIRED
    input_set: One authorization's obtained_at against the logical clock. Real wall-clock time is never consulted.
    constants:
      SECONDS_PER_DAY: 86400
    precision: "whole days, floored; the lapse test is >= so an authorization obtained at 2026-07-25T00:00:00Z with card_authorization_valid_days 7 is still APPROVED at clock 2026-07-31T23:59:59.999Z (aging_days 6) and EXPIRED at clock 2026-08-01T00:00:00Z (aging_days 7)"

  - name: allowance_approval_tier
    trigger: On Allowance creation only; the result is frozen and never re-derived.
    algorithm: threshold
    formula: |
      prop = HotelProperty(Folio(allowance.folio_id).property_id)
      if   allowance.requested_amount >= prop.allowance_controller_threshold_amount:
          required_approval_role = Controller
      elif allowance.requested_amount >= prop.allowance_manager_threshold_amount:
          required_approval_role = RevenueManager
      else:
          required_approval_role = NightAuditor
    input_set: The allowance's requested_amount alone. approved_amount - which may be far lower - never re-derives the tier, and neither does a return-for-revision cycle.
    constants: {}
    precision: "exact decimal comparison at the boundary; the comparison is >= so requested_amount 250.00 against allowance_manager_threshold_amount 250.00 requires RevenueManager, while 249.99 does not"
    note: "Freezing the tier at creation is what makes a 1000.00 request approved down to 10.00 still need Controller."

  - name: period_tie_out
    trigger: "POST /night-audit/accounting-periods/{id}/tie-out"
    algorithm: aggregation
    formula: |
      subsystem_total_amount = round(
          sum(d.total_revenue_amount for d in BusinessDate(accounting_period_id == period.id)
              if d.status in {CLOSED, ARCHIVED}), 2)
      tie_out_variance_amount = round(period.gl_control_total_amount
                                      - subsystem_total_amount, 2)

      if abs(tie_out_variance_amount) <= GL_TIE_OUT_TOLERANCE:
          period.status = TIED_OUT
      else:
          period.status              = TIE_OUT_FAILED
          period.tie_out_attempt_count += 1
    input_set: BusinessDates of this period whose status is CLOSED or ARCHIVED. A date left OPEN, ROOM_POSTING, CHARGES_SEALED, SETTLEMENT_REVIEW, BALANCED or REOPENED blocks the tie-out outright with ERR_PERIOD_HAS_OPEN_DATES rather than being silently excluded.
    constants:
      GL_TIE_OUT_TOLERANCE: 0.00
      GL_TIE_OUT_ATTEMPT_LIMIT: 3
    precision: "2 decimal places, round_half_up; the tolerance is zero, so a one-cent difference fails the tie-out"

  - name: audit_retention_date
    trigger: "The moment an AccountingPeriod reaches TIED_OUT."
    algorithm: aggregation
    formula: |
      last_day_of_period = last calendar day of period.period_month
      audit_trail_retention_until_date = last_day_of_period + AUDIT_RETENTION_YEARS years
      # expressed as YYYY-MM-DD; a 29 February anchor lands on 28 February of the target year
    input_set: The period's period_month alone; no business date, posting or report participates.
    constants:
      AUDIT_RETENTION_YEARS: 7
    precision: "whole calendar days; period_month 2026-08 yields 2033-08-31"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (Ordered by Priority)
# ---------------------------------------------------------------------------
# Priority bands: 1-2 authentication, 3-5 authorization, 10-24 existence
# (left-to-right through the path, then through the body), 30-49 state
# preconditions, 50-69 business safety and compliance, 70-84 business
# constraint (uniqueness, temporal overlap, referential coherence),
# 85-99 business fiscal (money and quota checks last).
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty. A header supplied as an empty string, or omitted entirely, fails here."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names one of the six roles declared in §1.7. An unknown role string fails here rather than at authorization."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When X-User-Role is OutletManager, X-User-ID is the id of an existing Outlet, because OutletManager is entity_backed:Outlet."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint whose roles list contains OutletManager"

  - priority: 5
    category: auth
    check: "The request body is a JSON object and every supplied field name appears in the endpoint's declared input list; unknown fields are ignored rather than rejected, but a non-object body fails here."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 10
    category: existence
    check: "The id in the path resolves to an existing HotelProperty."
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "GET /night-audit/properties/{id}"

  - priority: 11
    category: existence
    check: "The id in the path resolves to an existing BusinessDate."
    error_id: ERR_BUSINESS_DATE_NOT_FOUND
    http_status: 404
    applies_to: "every /night-audit/business-dates/{id} path"

  - priority: 12
    category: existence
    check: "The id in the path resolves to an existing Folio."
    error_id: ERR_FOLIO_NOT_FOUND
    http_status: 404
    applies_to: "every /night-audit/folios/{id} path"

  - priority: 13
    category: existence
    check: "The id in the path resolves to an existing OutletTicket, SettlementBatch, Allowance, AuthorizationDocument, CardAuthorization, RevenueReport, JournalPosting, LedgerAccount, Outlet or AccountingPeriod respectively."
    error_id: ERR_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "every /night-audit/outlet-tickets/{id} path; the sibling collections raise their own not-found code from priority 14"

  - priority: 14
    category: existence
    check: "The id in the path resolves to an existing row of the addressed collection: ERR_BATCH_NOT_FOUND for settlement-batches, ERR_ALLOWANCE_NOT_FOUND for allowances, ERR_DOCUMENT_NOT_FOUND for authorization-documents, ERR_AUTHORIZATION_NOT_FOUND for card-authorizations, ERR_REPORT_NOT_FOUND for revenue-reports, ERR_POSTING_NOT_FOUND for journal-postings, ERR_LEDGER_ACCOUNT_NOT_FOUND for ledger-accounts, ERR_OUTLET_NOT_FOUND for outlets, ERR_PERIOD_NOT_FOUND for accounting-periods."
    error_id: ERR_BATCH_NOT_FOUND
    http_status: 404
    applies_to: "every remaining /night-audit/<collection>/{id} path"

  - priority: 20
    category: existence
    check: "property_id in the body resolves to an existing HotelProperty."
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "POST /night-audit/outlets, POST /night-audit/business-dates, POST /night-audit/folios, POST /night-audit/ledger-accounts, POST /night-audit/authorization-documents"

  - priority: 21
    category: existence
    check: "business_date_id in the body resolves to an existing BusinessDate."
    error_id: ERR_BUSINESS_DATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /night-audit/journal-postings, POST /night-audit/outlet-tickets, POST /night-audit/settlement-batches, POST /night-audit/allowances, POST /night-audit/revenue-reports"

  - priority: 22
    category: existence
    check: "folio_id, room_charge_folio_id or allowance_id in the body resolves to an existing Folio or Allowance; the body fields are validated in the order folio, ledger account, allowance."
    error_id: ERR_FOLIO_NOT_FOUND
    http_status: 404
    applies_to: "POST /night-audit/journal-postings, POST /night-audit/outlet-tickets, POST /night-audit/allowances, POST /night-audit/authorization-documents, POST /night-audit/card-authorizations, POST /night-audit/folios/{id}/payments"

  - priority: 23
    category: existence
    check: "outlet_id in the body resolves to an existing Outlet."
    error_id: ERR_OUTLET_NOT_FOUND
    http_status: 404
    applies_to: "POST /night-audit/outlet-tickets, POST /night-audit/settlement-batches"

  - priority: 24
    category: existence
    check: "ledger_account_id in the body resolves to an existing LedgerAccount."
    error_id: ERR_LEDGER_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "POST /night-audit/journal-postings"

  - priority: 30
    category: state
    check: "The BusinessDate named by the request has status ARCHIVED - no write of any kind is accepted against an archived day, and this outranks every other state check."
    error_id: ERR_BUSINESS_DATE_ARCHIVED
    http_status: 409
    applies_to: "every write naming a business_date_id, and every /night-audit/business-dates/{id}/... action"

  - priority: 31
    category: state
    check: "For a charge-bearing write, the BusinessDate has status in {OPEN, ROOM_POSTING, REOPENED}. A date in CHARGES_SEALED, SETTLEMENT_REVIEW, BALANCED or CLOSED refuses new revenue lines. POST /night-audit/journal-postings/{id}/reverse is the one carve-out: correcting a mis-posted line is exactly what the settlement-review step exists for, so its allowed set widens to {OPEN, ROOM_POSTING, CHARGES_SEALED, SETTLEMENT_REVIEW, BALANCED, REOPENED} and only CLOSED is refused."
    error_id: ERR_CHARGES_ALREADY_SEALED
    http_status: 409
    applies_to: "POST /night-audit/journal-postings, POST /night-audit/journal-postings/{id}/reverse (widened set), POST /night-audit/folios/{id}/payments, POST /night-audit/folios/{id}/check-out, POST /night-audit/outlet-tickets, POST /night-audit/outlet-tickets/{id}/close, POST /night-audit/outlet-tickets/{id}/void, POST /night-audit/allowances, POST /night-audit/allowances/{id}/approve, POST /night-audit/allowances/{id}/reverse, POST /night-audit/card-authorizations/{id}/capture"

  - priority: 32
    category: state
    check: "POST /night-audit/business-dates/{id}/post-room-and-tax requires status OPEN."
    error_id: ERR_BUSINESS_DATE_NOT_OPEN
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/post-room-and-tax"

  - priority: 33
    category: state
    check: "POST /night-audit/business-dates/{id}/seal-charges requires status ROOM_POSTING."
    error_id: ERR_DATE_NOT_READY_TO_SEAL
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/seal-charges"

  - priority: 34
    category: state
    check: "POST /night-audit/business-dates/{id}/verify-settlements requires status CHARGES_SEALED or SETTLEMENT_REVIEW; a date already in SETTLEMENT_REVIEW may be re-verified, which re-reconciles the batches that are still DECLARED and is the only way a redeclared batch is judged again."
    error_id: ERR_DATE_NOT_READY_TO_VERIFY
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/verify-settlements"

  - priority: 35
    category: state
    check: "POST /night-audit/business-dates/{id}/balance requires status SETTLEMENT_REVIEW or REOPENED; POST /night-audit/business-dates/{id}/city-ledger-sweep requires status in {ROOM_POSTING, CHARGES_SEALED, SETTLEMENT_REVIEW, REOPENED}; POST /night-audit/revenue-reports requires the named date to be in SETTLEMENT_REVIEW, BALANCED or REOPENED."
    error_id: ERR_DATE_NOT_READY_TO_BALANCE
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/balance, POST /night-audit/business-dates/{id}/city-ledger-sweep, POST /night-audit/revenue-reports"

  - priority: 36
    category: state
    check: "POST /night-audit/business-dates/{id}/close requires status BALANCED."
    error_id: ERR_DATE_NOT_BALANCED
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/close"

  - priority: 37
    category: state
    check: "POST /night-audit/business-dates/{id}/reopen requires status CLOSED."
    error_id: ERR_DATE_NOT_CLOSED
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/reopen"

  - priority: 38
    category: state
    check: "POST /night-audit/folios/{id}/check-in and POST /night-audit/folios/{id}/cancel require stay_status RESERVED."
    error_id: ERR_FOLIO_NOT_RESERVED
    http_status: 409
    applies_to: "POST /night-audit/folios/{id}/check-in, POST /night-audit/folios/{id}/cancel"

  - priority: 39
    category: state
    check: "POST /night-audit/folios/{id}/check-out requires stay_status IN_HOUSE."
    error_id: ERR_FOLIO_NOT_IN_HOUSE
    http_status: 409
    applies_to: "POST /night-audit/folios/{id}/check-out"

  - priority: 40
    category: state
    check: "The target Folio has settlement_status other than TRANSFERRED_TO_CITY_LEDGER; a swept folio accepts no further posting or payment."
    error_id: ERR_FOLIO_ALREADY_TRANSFERRED
    http_status: 409
    applies_to: "POST /night-audit/journal-postings, POST /night-audit/folios/{id}/payments, POST /night-audit/allowances/{id}/approve"

  - priority: 41
    category: state
    check: "Allowance submit requires status DRAFT or RETURNED_FOR_REVISION (ERR_ALLOWANCE_NOT_SUBMITTABLE); approve, reject and return-for-revision require SUBMITTED (ERR_ALLOWANCE_NOT_PENDING); reverse requires POSTED (ERR_ALLOWANCE_NOT_POSTED)."
    error_id: ERR_ALLOWANCE_NOT_PENDING
    http_status: 409
    applies_to: "POST /night-audit/allowances/{id}/submit, POST /night-audit/allowances/{id}/approve, POST /night-audit/allowances/{id}/reject, POST /night-audit/allowances/{id}/return-for-revision, POST /night-audit/allowances/{id}/reverse"

  - priority: 42
    category: state
    check: "SettlementBatch request-recount and accept-variance require status VARIANCE_FLAGGED (ERR_BATCH_NOT_FLAGGED); redeclare requires RECOUNT_REQUESTED (ERR_BATCH_NOT_AWAITING_RECOUNT)."
    error_id: ERR_BATCH_NOT_FLAGGED
    http_status: 409
    applies_to: "POST /night-audit/settlement-batches/{id}/request-recount, POST /night-audit/settlement-batches/{id}/accept-variance, POST /night-audit/settlement-batches/{id}/redeclare"

  - priority: 43
    category: state
    check: "OutletTicket close requires status OPEN (ERR_TICKET_NOT_OPEN); void requires status CLOSED (ERR_TICKET_NOT_CLOSED)."
    error_id: ERR_TICKET_NOT_OPEN
    http_status: 409
    applies_to: "POST /night-audit/outlet-tickets/{id}/close, POST /night-audit/outlet-tickets/{id}/void"

  - priority: 44
    category: state
    check: "AuthorizationDocument review requires status PENDING (ERR_DOCUMENT_NOT_PENDING); revoke requires status ACTIVE (ERR_DOCUMENT_NOT_ACTIVE)."
    error_id: ERR_DOCUMENT_NOT_PENDING
    http_status: 409
    applies_to: "POST /night-audit/authorization-documents/{id}/review, POST /night-audit/authorization-documents/{id}/revoke"

  - priority: 45
    category: state
    check: "CardAuthorization decline and capture require status APPROVED. On a capture the aging
      recompute runs first, so an authorization that has lapsed - or lapses during this very
      request - is reported by ERR_AUTHORIZATION_EXPIRED at priority 92; this rule therefore
      catches DECLINED and CAPTURED on either action, and EXPIRED on decline only."
    error_id: ERR_AUTHORIZATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /night-audit/card-authorizations/{id}/decline, POST /night-audit/card-authorizations/{id}/capture"

  - priority: 46
    category: state
    check: "follow_up_action CONTACT requires follow_up_status PENDING (ERR_FOLLOW_UP_NOT_PENDING); RESOLVE and ESCALATE require CONTACTED (ERR_FOLLOW_UP_NOT_CONTACTED)."
    error_id: ERR_FOLLOW_UP_NOT_PENDING
    http_status: 409
    applies_to: "POST /night-audit/card-authorizations/{id}/follow-up"

  - priority: 47
    category: state
    check: "RevenueReport distribute requires status DRAFT."
    error_id: ERR_REPORT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /night-audit/revenue-reports/{id}/distribute"

  - priority: 48
    category: state
    check: "AccountingPeriod tie-out requires status OPEN or TIE_OUT_FAILED (ERR_PERIOD_NOT_TIEABLE); BusinessDate reopen requires the owning period to be OPEN (ERR_PERIOD_NOT_OPEN)."
    error_id: ERR_PERIOD_NOT_TIEABLE
    http_status: 409
    applies_to: "POST /night-audit/accounting-periods/{id}/tie-out, POST /night-audit/business-dates/{id}/reopen"

  - priority: 49
    category: state
    check: "The JournalPosting being reversed is an original row - reverses_posting_id is null - and no other row already names it in reverses_posting_id."
    error_id: ERR_POSTING_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /night-audit/journal-postings/{id}/reverse"

  - priority: 50
    category: business_safety
    check: "The acting X-User-ID differs from the recorded originator: requested_by_user_id on allowance approve, reject and return-for-revision; declared_by_user_id on settlement accept-variance; filed_by_user_id on authorization-document review; posted_by_user_id on journal-posting reverse (which raises ERR_SELF_REVERSAL_FORBIDDEN instead)."
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /night-audit/allowances/{id}/approve, POST /night-audit/allowances/{id}/reject, POST /night-audit/allowances/{id}/return-for-revision, POST /night-audit/settlement-batches/{id}/accept-variance, POST /night-audit/authorization-documents/{id}/review"

  - priority: 51
    category: business_safety
    check: "The X-User-ID reversing a JournalPosting differs from the line's posted_by_user_id."
    error_id: ERR_SELF_REVERSAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /night-audit/journal-postings/{id}/reverse"

  - priority: 52
    category: business_safety
    check: "The acting role is at or above Allowance.required_approval_role on the ladder NightAuditor < RevenueManager < Controller. The tier was frozen from requested_amount at creation, so a low approved_amount does not lower it."
    error_id: ERR_APPROVAL_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /night-audit/allowances/{id}/approve"

  - priority: 53
    category: business_safety
    check: "When X-User-Role is OutletManager, the addressed OutletTicket's outlet_id or SettlementBatch's outlet_id equals the caller's X-User-ID."
    error_id: ERR_OUTLET_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /night-audit/outlet-tickets, POST /night-audit/outlet-tickets/{id}/close, POST /night-audit/outlet-tickets/{id}/void, POST /night-audit/settlement-batches, POST /night-audit/settlement-batches/{id}/redeclare"

  - priority: 54
    category: business_safety
    check: "Every comp folio due a room night on the date under audit is covered by an AuthorizationDocument with doc_type COMP_ROOM, status ACTIVE, and valid_from_date <= business_date <= valid_to_date. One uncovered comp folio rejects the whole run and writes no line at all."
    error_id: ERR_COMP_AUTHORIZATION_MISSING
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/post-room-and-tax"

  - priority: 55
    category: business_safety
    check: "A folio whose abs(rate_variance_pct) exceeds HotelProperty.rate_variance_tolerance_pct is covered by an AuthorizationDocument with doc_type RATE_OVERRIDE, status ACTIVE, and an interval containing the arrival business date."
    error_id: ERR_RATE_VARIANCE_UNAUTHORIZED
    http_status: 409
    applies_to: "POST /night-audit/folios/{id}/check-in"

  - priority: 56
    category: business_safety
    check: "An allowance whose requested_amount is at or above HotelProperty.allowance_controller_threshold_amount is covered by an AuthorizationDocument with doc_type ALLOWANCE_APPROVAL, allowance_id equal to this allowance, and status ACTIVE."
    error_id: ERR_ALLOWANCE_DOCUMENT_MISSING
    http_status: 409
    applies_to: "POST /night-audit/allowances/{id}/approve"

  - priority: 57
    category: business_safety
    check: "A folio carrying settlement_hold true - the consequence of an unresolved declined authorization - may not be checked out."
    error_id: ERR_DECLINED_AUTH_UNRESOLVED
    http_status: 409
    applies_to: "POST /night-audit/folios/{id}/check-out"

  - priority: 58
    category: business_safety
    check: "A business date may reach BALANCED only while declined_authorization_count is 0."
    error_id: ERR_DECLINED_AUTH_UNRESOLVED
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/balance"

  - priority: 59
    category: business_safety
    check: "Moving follow_up_status to RESOLVED requires the folio to carry at least one JournalPosting with charge_type PAYMENT, so a decline is never closed without a replacement tender."
    error_id: ERR_FOLLOW_UP_NO_REPLACEMENT_TENDER
    http_status: 409
    applies_to: "POST /night-audit/card-authorizations/{id}/follow-up"

  - priority: 70
    category: business_constraint
    check: "charge_type supplied directly by a client is one of MISC_CHARGE, PAYMENT, LEDGER_TRANSFER or DEPOSIT_APPLIED; every other value is reserved for declared side effects."
    error_id: ERR_CHARGE_TYPE_NOT_POSTABLE
    http_status: 422
    applies_to: "POST /night-audit/journal-postings"

  - priority: 71
    category: business_referential
    check: "Every entity named in one request belongs to the same HotelProperty: the folio's property_id matches the business date's property_id, the outlet's property_id matches the ticket's business date, and the ledger account's property_id matches the posting's business date."
    error_id: ERR_CROSS_PROPERTY_REFERENCE
    http_status: 422
    applies_to: "POST /night-audit/journal-postings, POST /night-audit/outlet-tickets, POST /night-audit/settlement-batches, POST /night-audit/allowances, POST /night-audit/authorization-documents, POST /night-audit/folios"

  - priority: 72
    category: business_referential
    check: "AuthorizationDocument target coherence: COMP_ROOM and RATE_OVERRIDE require folio_id and forbid allowance_id; ALLOWANCE_APPROVAL requires allowance_id and forbids folio_id; RATE_OVERRIDE additionally requires authorized_rate_amount."
    error_id: ERR_DOCUMENT_TARGET_MISMATCH
    http_status: 422
    applies_to: "POST /night-audit/authorization-documents"

  - priority: 73
    category: business_referential
    check: "An OutletTicket with settlement_type ROOM_CHARGE carries room_charge_folio_id; a CASH or CREDIT_CARD ticket leaves it null."
    error_id: ERR_TICKET_FOLIO_REQUIRED
    http_status: 422
    applies_to: "POST /night-audit/outlet-tickets"

  - priority: 74
    category: business_constraint
    check: "Uniqueness: BusinessDate.business_date per property (ERR_DUPLICATE_BUSINESS_DATE), Outlet.outlet_code per property (ERR_DUPLICATE_OUTLET_CODE), OutletTicket.ticket_number per outlet per business date (ERR_DUPLICATE_TICKET_NUMBER)."
    error_id: ERR_DUPLICATE_BUSINESS_DATE
    http_status: 409
    applies_to: "POST /night-audit/business-dates, POST /night-audit/outlets, POST /night-audit/outlet-tickets"

  - priority: 75
    category: business_temporal
    check: "SettlementBatch.shift_start_at is strictly before shift_end_at, and AuthorizationDocument.valid_from_date is at or before valid_to_date."
    error_id: ERR_SHIFT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /night-audit/settlement-batches, POST /night-audit/authorization-documents"

  - priority: 76
    category: business_temporal
    check: "No other SettlementBatch of the same outlet, business date and tender_type whose status is not RECOUNT_REQUESTED occupies an overlapping half-open window [shift_start_at, shift_end_at). Two adjacent shifts where one ends at exactly the instant the next begins do not overlap and are both accepted."
    error_id: ERR_SHIFT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /night-audit/settlement-batches, POST /night-audit/settlement-batches/{id}/redeclare"

  - priority: 77
    category: business_temporal
    check: "No other AuthorizationDocument with the same folio_id and doc_type whose status is PENDING or ACTIVE occupies an overlapping closed interval [valid_from_date, valid_to_date]. Because both endpoints are inclusive, two documents that merely touch - one ending on the day the next begins - DO overlap and the second is rejected."
    error_id: ERR_AUTHORIZATION_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /night-audit/authorization-documents"

  - priority: 78
    category: business_constraint
    check: "Allowance.reason_code is present at submit time, and reason_code RATE_ERROR additionally requires a non-empty supporting_document_reference."
    error_id: ERR_REASON_CODE_REQUIRED
    http_status: 422
    applies_to: "POST /night-audit/allowances/{id}/submit"

  - priority: 79
    category: business_constraint
    check: "reason_code RATE_ERROR requires a non-empty supporting_document_reference."
    error_id: ERR_SUPPORTING_DOCUMENT_REQUIRED
    http_status: 422
    applies_to: "POST /night-audit/allowances/{id}/submit"

  - priority: 80
    category: business_constraint
    check: "Allowance.revision_round is below ALLOWANCE_REVISION_LIMIT (2) before another return-for-revision is accepted; SettlementBatch.recount_round is below SETTLEMENT_RECOUNT_LIMIT (2) before another recount; AccountingPeriod.tie_out_attempt_count is below GL_TIE_OUT_ATTEMPT_LIMIT (3) before another retry."
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /night-audit/allowances/{id}/return-for-revision, POST /night-audit/settlement-batches/{id}/request-recount, POST /night-audit/accounting-periods/{id}/tie-out"

  - priority: 81
    category: business_constraint
    check: "recipient_role_list is a non-empty array of role names before a report may be distributed."
    error_id: ERR_DISTRIBUTION_LIST_EMPTY
    http_status: 422
    applies_to: "POST /night-audit/revenue-reports/{id}/distribute"

  - priority: 82
    category: business_constraint
    check: "Every Outlet of the property with status ACTIVE and requires_shift_settlement true has at least one SettlementBatch on the date, and no batch of the date remains in DECLARED, VARIANCE_FLAGGED or RECOUNT_REQUESTED when BALANCED is sought."
    error_id: ERR_SETTLEMENTS_UNRESOLVED
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/verify-settlements, POST /night-audit/business-dates/{id}/balance"

  - priority: 83
    category: business_constraint
    check: "Every BusinessDate of the period being tied out has status CLOSED or ARCHIVED."
    error_id: ERR_PERIOD_HAS_OPEN_DATES
    http_status: 409
    applies_to: "POST /night-audit/accounting-periods/{id}/tie-out"

  - priority: 84
    category: business_constraint
    check: "A DISTRIBUTED RevenueReport exists for the date before it may be closed."
    error_id: ERR_REPORT_NOT_DISTRIBUTED
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/close"

  - priority: 85
    category: business_constraint
    check: "expected_business_date_version equals the current BusinessDate.version at the moment the report row is written."
    error_id: ERR_STALE_BUSINESS_DATE_VERSION
    http_status: 412
    applies_to: "POST /night-audit/revenue-reports"

  - priority: 90
    category: business_fiscal
    check: "BusinessDate.ledger_control_amount is exactly 0.00 before the date may reach BALANCED."
    error_id: ERR_LEDGERS_OUT_OF_BALANCE
    http_status: 409
    applies_to: "POST /night-audit/business-dates/{id}/balance"

  - priority: 91
    category: business_fiscal
    check: "A folio with settlement_method CREDIT_CARD carries a CardAuthorization with status APPROVED whose authorized_amount is at or above the balance the folio will hold after the late-checkout charge is applied."
    error_id: ERR_AUTHORIZATION_SHORTFALL
    http_status: 409
    applies_to: "POST /night-audit/folios/{id}/check-out"

  - priority: 92
    category: business_fiscal
    check: "The CardAuthorization being captured has aging_days below HotelProperty.card_authorization_valid_days."
    error_id: ERR_AUTHORIZATION_EXPIRED
    http_status: 409
    applies_to: "POST /night-audit/card-authorizations/{id}/capture"

  - priority: 93
    category: business_fiscal
    check: "captured_amount is greater than 0 and at most authorized_amount."
    error_id: ERR_CAPTURE_EXCEEDS_AUTHORIZATION
    http_status: 422
    applies_to: "POST /night-audit/card-authorizations/{id}/capture"

  - priority: 94
    category: business_fiscal
    check: "approved_amount is greater than 0 and at most requested_amount."
    error_id: ERR_APPROVED_AMOUNT_EXCEEDS_REQUEST
    http_status: 422
    applies_to: "POST /night-audit/allowances/{id}/approve"

  - priority: 95
    category: business_fiscal
    check: "A folio's balance_amount is exactly 0.00 before it may be cancelled."
    error_id: ERR_FOLIO_BALANCE_NOT_ZERO
    http_status: 409
    applies_to: "POST /night-audit/folios/{id}/cancel"

  - priority: 96
    category: business_fiscal
    check: "A MISC_CHARGE or OUTLET_TRANSFER line would not carry the folio's balance_amount above Folio.credit_limit_amount."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /night-audit/journal-postings, POST /night-audit/outlet-tickets/{id}/close"

  - priority: 97
    category: business_fiscal
    check: "The Outlet named by a ticket or batch has status ACTIVE rather than SUSPENDED."
    error_id: ERR_OUTLET_SUSPENDED
    http_status: 409
    applies_to: "POST /night-audit/outlet-tickets, POST /night-audit/settlement-batches"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (test-driving, /_ namespace) -------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which is the ONLY time source every aging, grace, expiry and shift-window rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: [current_utc]
    output: "null"
    side_effects:
      - "every CardAuthorization.aging_days is re-derived on its next read"
      - "no state transition fires as a consequence of the clock move on its own"

  # --- HotelProperty ------------------------------------------------------
  - method: POST
    path: "/night-audit/properties"
    description: Registers a property together with every rate, tax, tolerance and approval threshold the audit engine reads.
    roles: [PropertyAdmin]
    code: 201
    input: [name, room_count_total, standard_room_rate_amount, occupancy_tax_rate_pct, fb_tax_rate_pct, service_charge_pct, large_ticket_threshold_amount, large_party_discount_pct, allowance_manager_threshold_amount, allowance_controller_threshold_amount, rate_variance_tolerance_pct, settlement_variance_tolerance_amount, city_ledger_fee_pct, "late_checkout_grace_minutes?", "card_authorization_valid_days?", "no_show_charge_policy?"]
    output: HotelProperty
    side_effects:
      - "no other row is created; ledger accounts and outlets are registered separately"
  - method: GET
    path: "/night-audit/properties/{id}"
    description: Reads one property's full configuration.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: HotelProperty
    side_effects: []
  - method: GET
    path: "/night-audit/properties"
    description: Lists properties.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["limit?", "offset?"]
    output: HotelProperty[]
    side_effects: []

  # --- Outlet -------------------------------------------------------------
  - method: POST
    path: "/night-audit/outlets"
    description: Registers a revenue capture point under a property.
    roles: [PropertyAdmin]
    code: 201
    input: [property_id, outlet_code, outlet_name, outlet_type, "requires_shift_settlement?"]
    output: Outlet
    side_effects:
      - "the outlet's id is the X-User-ID an OutletManager acts as, because OutletManager is entity_backed:Outlet"
  - method: GET
    path: "/night-audit/outlets/{id}"
    description: Reads one outlet.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: Outlet
    side_effects: []
  - method: GET
    path: "/night-audit/outlets"
    description: "Lists outlets, filterable by owning property - the reverse-reachability channel for Outlet.property_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["property_id?", "outlet_type?", "status?", "requires_shift_settlement?", "limit?", "offset?"]
    output: Outlet[]
    side_effects: []
  - method: POST
    path: "/night-audit/outlets/{id}/suspend"
    description: Suspends an outlet so it stops accepting tickets and batches while remaining addressable for prior-day audit.
    roles: [PropertyAdmin]
    code: 200
    input: []
    output: Outlet
    side_effects:
      - "status becomes SUSPENDED; every later POST /night-audit/outlet-tickets or POST /night-audit/settlement-batches naming it fails with ERR_OUTLET_SUSPENDED"
      - "a SUSPENDED outlet no longer contributes a mandatory batch to the verify-settlements precondition"
      - "increments Outlet.version by 1"

  # --- AccountingPeriod ---------------------------------------------------
  - method: GET
    path: "/night-audit/accounting-periods/{id}"
    description: Reads one accounting period, including its tie-out figures and retention horizon.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: AccountingPeriod
    side_effects: []
  - method: GET
    path: "/night-audit/accounting-periods"
    description: "Lists accounting periods, filterable by owning property - the reverse-reachability channel for AccountingPeriod.property_id. Periods are never created directly; POST /night-audit/business-dates mints the month's period on demand."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["property_id?", "period_month?", "status?", "limit?", "offset?"]
    output: AccountingPeriod[]
    side_effects: []
  - method: POST
    path: "/night-audit/accounting-periods/{id}/tie-out"
    description: Runs the month-end tie-out of the audit subsystem against the general-ledger control total; passes or fails inside the same request.
    roles: [Controller]
    code: 200
    input: [gl_control_total_amount]
    output: AccountingPeriod
    side_effects:
      - "recomputes subsystem_total_amount and tie_out_variance_amount per calculation period_tie_out"
      - "on a zero variance: status TIED_OUT, tied_out_at and tied_out_by_user_id stamped, audit_trail_retention_until_date computed per calculation audit_retention_date, and every CLOSED BusinessDate of the period becomes ARCHIVED"
      - "on a non-zero variance: status TIE_OUT_FAILED and tie_out_attempt_count += 1, with no date archived"
      - "increments AccountingPeriod.version by 1"

  # --- BusinessDate -------------------------------------------------------
  - method: POST
    path: "/night-audit/business-dates"
    description: Opens one hotel operating day and attaches it to its calendar-month accounting period, creating that period when the month's first date is opened.
    roles: [PropertyAdmin, NightAuditor]
    code: 201
    input: [property_id, business_date, "out_of_order_room_count?", "benchmark_calendar_room_revenue_amount?", "benchmark_weekday_room_revenue_amount?"]
    output: BusinessDate
    side_effects:
      - "creates an AccountingPeriod with period_month derived from business_date when none exists for that property and month, and stamps accounting_period_id"
      - "rooms_available_count is computed as HotelProperty.room_count_total minus out_of_order_room_count; every other aggregate starts at 0 or 0.00"
      - "status starts at OPEN"
  - method: GET
    path: "/night-audit/business-dates/{id}"
    description: Reads one operating day with its full set of revenue, occupancy, settlement and control aggregates.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: BusinessDate
    side_effects: []
  - method: GET
    path: "/night-audit/business-dates"
    description: "Lists operating days, filterable by property and by accounting period - the reverse-reachability channel for BusinessDate.property_id and BusinessDate.accounting_period_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["property_id?", "accounting_period_id?", "business_date?", "status?", "limit?", "offset?"]
    output: BusinessDate[]
    side_effects: []
  - method: POST
    path: "/night-audit/business-dates/{id}/post-room-and-tax"
    description: First step of the daily close - posts room and occupancy-tax lines for in-house folios and no-show charges for folios that never arrived.
    roles: [NightAuditor]
    code: 200
    input: []
    output: BusinessDate
    side_effects:
      - "appends ROOM and OCCUPANCY_TAX lines per calculation room_and_tax_provisional_posting, taking folios in ascending Folio.created_at"
      - "moves every RESERVED folio arriving on this date to NO_SHOW and appends the lines from calculation no_show_charge"
      - "recomputes each touched Folio.charges_total_amount, balance_amount and settlement_status"
      - "recomputes rooms_occupied_count, room_night_revenue_amount, other_room_revenue_amount, tax_revenue_amount, total_revenue_amount, occupancy_pct, adr_amount and revpar_amount per calculation occupancy_statistics"
      - "status becomes ROOM_POSTING"
      - "increments BusinessDate.version by 1"
  - method: POST
    path: "/night-audit/business-dates/{id}/seal-charges"
    description: Second step - trues up occupancy tax from the provisional per-line basis to the final net-of-allowance basis and closes the day to further revenue lines.
    roles: [NightAuditor]
    code: 200
    input: []
    output: BusinessDate
    side_effects:
      - "appends one TAX_TRUE_UP line per folio whose delta from calculation occupancy_tax_final_true_up is non-zero, and none for folios whose delta is 0.00"
      - "recomputes each touched Folio.balance_amount and settlement_status, then this date's tax_revenue_amount and total_revenue_amount"
      - "status becomes CHARGES_SEALED, after which every charge-bearing write fails with ERR_CHARGES_ALREADY_SEALED"
      - "increments BusinessDate.version by 1"
  - method: POST
    path: "/night-audit/business-dates/{id}/verify-settlements"
    description: Third step - reconciles every declared settlement batch of the day against the tickets inside its half-open shift window. Callable again while the date is already in SETTLEMENT_REVIEW, which re-reconciles only the batches that are still DECLARED and leaves the date's status where it is.
    roles: [NightAuditor]
    code: 200
    input: []
    output: BusinessDate
    side_effects:
      - "stamps system_amount and variance_amount on each DECLARED batch and moves it to MATCHED or VARIANCE_FLAGGED per calculation settlement_reconciliation"
      - "recomputes settlement_variance_total_amount and unresolved_settlement_batch_count"
      - "status becomes SETTLEMENT_REVIEW, or stays SETTLEMENT_REVIEW when the date was re-verified after a recount"
      - "increments BusinessDate.version by 1"
  - method: POST
    path: "/night-audit/business-dates/{id}/city-ledger-sweep"
    description: Sweeps departed direct-bill folios with a positive balance to the city ledger, raising a per-folio fee; runs before balancing and is exempt from the seal gate because it writes transfers rather than revenue.
    roles: [NightAuditor]
    code: 200
    input: []
    output: BusinessDate
    side_effects:
      - "appends the CITY_LEDGER_FEE and paired LEDGER_TRANSFER lines described in calculation city_ledger_sweep, taking folios in ascending Folio.created_at"
      - "moves each swept Folio.settlement_status to TRANSFERRED_TO_CITY_LEDGER with balance_amount exactly 0.00"
      - "raises LedgerAccount.current_balance_amount on the CITY_LEDGER account by the swept total"
      - "stamps city_ledger_swept_folio_count, city_ledger_transferred_balance_total_amount and city_ledger_fee_total_amount, replacing any values a prior sweep of the same date left"
      - "leaves ledger_control_amount at exactly 0.00 because every transfer is a balanced pair"
      - "increments BusinessDate.version by 1"
  - method: POST
    path: "/night-audit/business-dates/{id}/balance"
    description: Fourth step - lapses aged card authorizations and then asserts that settlements, ledgers and declined authorizations are all clear.
    roles: [NightAuditor]
    code: 200
    input: []
    output: BusinessDate
    side_effects:
      - "before the preconditions are evaluated, every APPROVED CardAuthorization of this property's folios whose aging_days has reached HotelProperty.card_authorization_valid_days becomes EXPIRED"
      - "status becomes BALANCED"
      - "increments BusinessDate.version by 1"
  - method: POST
    path: "/night-audit/business-dates/{id}/close"
    description: Final step - closes the day once its revenue report has been distributed, and rolls the day's revenue into its accounting period.
    roles: [NightAuditor]
    code: 200
    input: []
    output: BusinessDate
    side_effects:
      - "status becomes CLOSED"
      - "recomputes the owning AccountingPeriod.subsystem_total_amount to include this date's total_revenue_amount"
      - "increments BusinessDate.version by 1"
  - method: POST
    path: "/night-audit/business-dates/{id}/reopen"
    description: Reopens a closed day for correction while its accounting period is still open, invalidating the day's distributed report.
    roles: [Controller]
    code: 200
    input: []
    output: BusinessDate
    side_effects:
      - "status becomes REOPENED and reopen_count += 1"
      - "every DRAFT or DISTRIBUTED RevenueReport of this date becomes SUPERSEDED"
      - "the owning AccountingPeriod.subsystem_total_amount is recomputed and no longer includes this date"
      - "charge-bearing writes are accepted again until the date is re-balanced"
      - "increments BusinessDate.version by 1"

  # --- Folio --------------------------------------------------------------
  - method: POST
    path: "/night-audit/folios"
    description: Creates a guest account in RESERVED / UNSETTLED, computing its rate variance against the property's rack rate.
    roles: [FrontDeskAgent, NightAuditor]
    code: 201
    input: [property_id, arrival_business_date_id, confirmation_code, guest_name, room_number, nights_count, contracted_rate_amount, rate_plan_code, market_segment, settlement_method, scheduled_checkout_at, "is_comp?", "credit_limit_amount?"]
    output: Folio
    side_effects:
      - "rate_variance_pct is computed per calculation rate_variance_pct"
      - "stay_status starts at RESERVED and settlement_status at UNSETTLED; charges_total_amount, credits_total_amount and balance_amount all start at 0.00 and settlement_hold at false"
  - method: GET
    path: "/night-audit/folios/{id}"
    description: Reads one folio with both state dimensions and its derived money figures.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: Folio
    side_effects: []
  - method: GET
    path: "/night-audit/folios"
    description: "Lists folios, filterable by property and by arrival date - the reverse-reachability channel for Folio.property_id and Folio.arrival_business_date_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["property_id?", "arrival_business_date_id?", "stay_status?", "settlement_status?", "settlement_method?", "is_comp?", "confirmation_code?", "limit?", "offset?"]
    output: Folio[]
    side_effects: []
  - method: POST
    path: "/night-audit/folios/{id}/check-in"
    description: Moves a reserved folio in-house, refusing an off-tolerance rate that carries no active rate-override paperwork.
    roles: [FrontDeskAgent, NightAuditor]
    code: 200
    input: []
    output: Folio
    side_effects:
      - "stay_status becomes IN_HOUSE; settlement_status is untouched"
      - "the folio now participates in every later post-room-and-tax run until its nights_count is exhausted"
      - "increments Folio.version by 1"
  - method: POST
    path: "/night-audit/folios/{id}/check-out"
    description: Departs an in-house folio, raising the tiered late-checkout charge when the guest overstayed the grace window.
    roles: [FrontDeskAgent, NightAuditor]
    code: 200
    input: [business_date_id]
    output: Folio
    side_effects:
      - "actual_checkout_at is stamped from the logical clock and stay_status becomes DEPARTED"
      - "when calculation late_checkout_charge returns more than 0.00, appends a LATE_CHECKOUT line of that amount with source_channel FRONT_DESK"
      - "that line re-derives charges_total_amount, balance_amount and settlement_status on this folio"
      - "that line re-derives other_room_revenue_amount, room_revenue_amount and total_revenue_amount on the named BusinessDate"
      - "the changed date aggregates set every DRAFT or DISTRIBUTED RevenueReport of that date to SUPERSEDED"
      - "increments Folio.version by 1"
  - method: POST
    path: "/night-audit/folios/{id}/cancel"
    description: Cancels a reserved folio that carries no balance, so the night audit never treats it as a no-show.
    roles: [FrontDeskAgent, NightAuditor]
    code: 200
    input: []
    output: Folio
    side_effects:
      - "stay_status becomes CANCELLED and the folio is skipped by every later post-room-and-tax run"
      - "increments Folio.version by 1"
  - method: POST
    path: "/night-audit/folios/{id}/payments"
    description: Applies a tender to a folio, appending a PAYMENT line and re-deriving the folio's settlement dimension.
    roles: [FrontDeskAgent, NightAuditor]
    code: 200
    input: [business_date_id, amount, "ledger_account_id?", "memo?"]
    output: Folio
    side_effects:
      - "appends a PAYMENT JournalPosting of -amount with source_channel FRONT_DESK"
      - "re-derives credits_total_amount, balance_amount and settlement_status per calculation folio_balance"
      - "the BusinessDate revenue aggregates are unchanged because PAYMENT is not a revenue charge_type"
      - "increments Folio.version by 1"

  # --- JournalPosting -----------------------------------------------------
  - method: POST
    path: "/night-audit/journal-postings"
    description: "Appends a journal line by hand. Only MISC_CHARGE, PAYMENT, LEDGER_TRANSFER and DEPOSIT_APPLIED may be supplied; a one-sided LEDGER_TRANSFER or DEPOSIT_APPLIED is accepted and is exactly what drives BusinessDate.ledger_control_amount off zero."
    roles: [NightAuditor, FrontDeskAgent, Controller]
    code: 201
    input: [business_date_id, charge_type, amount, "folio_id?", "ledger_account_id?", "reason_code?", "memo?"]
    output: JournalPosting
    side_effects:
      - "source_channel is stamped FRONT_DESK for FrontDeskAgent callers and NIGHT_AUDIT otherwise; posted_by_user_id is stamped from X-User-ID"
      - "when folio_id is supplied, re-derives that Folio.charges_total_amount, credits_total_amount, balance_amount and settlement_status per calculation folio_balance"
      - "when ledger_account_id is supplied, re-derives that LedgerAccount.current_balance_amount"
      - "re-derives the named BusinessDate revenue aggregates and ledger_control_amount"
      - "a changed revenue aggregate sets every DRAFT or DISTRIBUTED RevenueReport of that date to SUPERSEDED"
  - method: GET
    path: "/night-audit/journal-postings/{id}"
    description: Reads one journal line. Lines are append-only and are never updated or deleted.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: JournalPosting
    side_effects: []
  - method: GET
    path: "/night-audit/journal-postings"
    description: "Lists journal lines, filterable by every foreign key the line carries - the reverse-reachability channel for JournalPosting.folio_id, .ledger_account_id, .business_date_id, .outlet_ticket_id, .allowance_id and .reverses_posting_id. This is the only discovery channel for lines minted by side effects."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["folio_id?", "ledger_account_id?", "business_date_id?", "outlet_ticket_id?", "allowance_id?", "reverses_posting_id?", "charge_type?", "source_channel?", "limit?", "offset?"]
    output: JournalPosting[]
    side_effects: []
  - method: POST
    path: "/night-audit/journal-postings/{id}/reverse"
    description: Appends a compensating line that negates an earlier line exactly; the original row is never mutated and the reverser may not be the poster.
    roles: [NightAuditor, Controller]
    code: 201
    input: ["memo?"]
    output: JournalPosting
    side_effects:
      - "creates a new JournalPosting with amount == -original.amount, the same folio_id, ledger_account_id, business_date_id and charge_type, and reverses_posting_id set to the original"
      - "every NET figure the original moved - Folio.balance_amount, LedgerAccount.current_balance_amount, the BusinessDate revenue aggregates and ledger_control_amount - returns to exactly its pre-original value"
      - "the GROSS figures Folio.charges_total_amount and Folio.credits_total_amount do NOT return: the reversing row is an ordinary signed row per calculation folio_balance, so one of the two grows by the reversal magnitude and settlement_status is re-derived from the new pair rather than restored"
      - "the reversal of a one-sided LEDGER_TRANSFER returns ledger_control_amount to exactly 0.00, which is what unblocks the balance step"

  # --- OutletTicket -------------------------------------------------------
  - method: POST
    path: "/night-audit/outlet-tickets"
    description: Opens a check at an outlet. Money fields stay at 0.00 until the ticket is closed.
    roles: [OutletManager, NightAuditor]
    code: 201
    input: [outlet_id, business_date_id, ticket_number, gross_amount, settlement_type, opened_at, "room_charge_folio_id?", "transmitted_at?"]
    output: OutletTicket
    side_effects:
      - "status starts at OPEN with service_charge_amount, taxable_base_amount, tax_amount, large_party_discount_amount and total_amount all 0.00"
      - "an OPEN ticket contributes to no settlement batch and to no business-date aggregate"
  - method: GET
    path: "/night-audit/outlet-tickets/{id}"
    description: Reads one ticket with its stamped service charge, tax, discount and total.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: OutletTicket
    side_effects: []
  - method: GET
    path: "/night-audit/outlet-tickets"
    description: "Lists tickets, filterable by outlet, business date and room-charge folio - the reverse-reachability channel for OutletTicket.outlet_id, .business_date_id and .room_charge_folio_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["outlet_id?", "business_date_id?", "room_charge_folio_id?", "status?", "settlement_type?", "limit?", "offset?"]
    output: OutletTicket[]
    side_effects: []
  - method: POST
    path: "/night-audit/outlet-tickets/{id}/close"
    description: Closes a check, stamping the service charge, tax, large-party discount and total, and transferring a room-charge ticket to its folio.
    roles: [OutletManager, NightAuditor]
    code: 200
    input: ["transmitted_at?"]
    output: OutletTicket
    side_effects:
      - "stamps service_charge_amount, taxable_base_amount, tax_amount, large_party_discount_amount and total_amount per calculation outlet_ticket_total"
      - "stamps closed_at and closed_by_user_id from the logical clock and X-User-ID; transmitted_at defaults to closed_at when the request omits it"
      - "status becomes CLOSED, raising the date's outlet_revenue_amount, closed_outlet_ticket_count and total_revenue_amount"
      - "when room_charge_folio_id is set, appends an OUTLET_TRANSFER line of total_amount with source_channel OUTLET_POS and re-derives that folio's charges_total_amount, balance_amount and settlement_status"
      - "the ticket now matches any SettlementBatch of its outlet, date and tender type whose half-open window contains transmitted_at"
      - "increments OutletTicket.version by 1"
  - method: POST
    path: "/night-audit/outlet-tickets/{id}/void"
    description: Voids a closed check, undoing every figure the close moved without deleting a single row.
    roles: [OutletManager, NightAuditor]
    code: 200
    input: []
    output: OutletTicket
    side_effects:
      - "stamps voided_at and sets status VOID; total_amount returns to 0.00"
      - "the date's outlet_revenue_amount, closed_outlet_ticket_count and total_revenue_amount return to exactly their pre-close values"
      - "when room_charge_folio_id is set, appends a reversing OUTLET_TRANSFER line of -total_amount carrying reverses_posting_id, so the folio's balance_amount returns to exactly its pre-close value while charges_total_amount is unchanged and credits_total_amount falls by total_amount, because the reversing row is an ordinary signed row"
      - "the ticket stops matching any settlement batch, so the next verify-settlements run computes a lower system_amount"
      - "increments OutletTicket.version by 1"

  # --- SettlementBatch ----------------------------------------------------
  - method: POST
    path: "/night-audit/settlement-batches"
    description: Declares an outlet's counted takings for one half-open shift window on one business date.
    roles: [OutletManager, NightAuditor]
    code: 201
    input: [business_date_id, outlet_id, tender_type, shift_start_at, shift_end_at, declared_amount]
    output: SettlementBatch
    side_effects:
      - "status starts at DECLARED with system_amount and variance_amount null; declared_by_user_id is stamped from X-User-ID"
      - "the batch immediately counts towards BusinessDate.unresolved_settlement_batch_count"
  - method: GET
    path: "/night-audit/settlement-batches/{id}"
    description: Reads one settlement batch with its reconciled system amount and variance.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []
  - method: GET
    path: "/night-audit/settlement-batches"
    description: "Lists settlement batches, filterable by business date and outlet - the reverse-reachability channel for SettlementBatch.business_date_id and .outlet_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["business_date_id?", "outlet_id?", "status?", "tender_type?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []
  - method: POST
    path: "/night-audit/settlement-batches/{id}/request-recount"
    description: Sends a flagged batch back to the outlet for a physical recount, consuming one of two allowed rounds.
    roles: [NightAuditor]
    code: 200
    input: []
    output: SettlementBatch
    side_effects:
      - "status becomes RECOUNT_REQUESTED and recount_round += 1"
      - "the batch leaves settlement_variance_total_amount while still counting as unresolved"
      - "increments SettlementBatch.version by 1"
  - method: POST
    path: "/night-audit/settlement-batches/{id}/redeclare"
    description: Replaces a recounted batch's declared amount and sends it back for reconciliation.
    roles: [OutletManager, NightAuditor]
    code: 200
    input: [declared_amount, "shift_start_at?", "shift_end_at?"]
    output: SettlementBatch
    side_effects:
      - "declared_amount is replaced, variance_amount is cleared to null and status returns to DECLARED"
      - "recount_round is left untouched, so the second flag is the last one that may be recounted"
      - "increments SettlementBatch.version by 1"
  - method: POST
    path: "/night-audit/settlement-batches/{id}/accept-variance"
    description: Accepts a flagged variance on management authority; the declarer may never accept their own batch.
    roles: [RevenueManager, Controller]
    code: 200
    input: []
    output: SettlementBatch
    side_effects:
      - "status becomes ACCEPTED_WITH_VARIANCE and accepted_by_user_id is stamped"
      - "the batch stops counting towards BusinessDate.unresolved_settlement_batch_count while still contributing its absolute variance to settlement_variance_total_amount"
      - "increments SettlementBatch.version by 1"

  # --- LedgerAccount ------------------------------------------------------
  - method: POST
    path: "/night-audit/ledger-accounts"
    description: Opens a house-account, city-ledger or advance-deposit ledger account under a property.
    roles: [PropertyAdmin, Controller]
    code: 201
    input: [property_id, ledger_type, account_code, gl_account_code, "opening_balance_amount?", "credit_limit_amount?"]
    output: LedgerAccount
    side_effects:
      - "current_balance_amount starts equal to opening_balance_amount"
  - method: GET
    path: "/night-audit/ledger-accounts/{id}"
    description: Reads one ledger account with its running balance.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: LedgerAccount
    side_effects: []
  - method: GET
    path: "/night-audit/ledger-accounts"
    description: "Lists ledger accounts, filterable by owning property - the reverse-reachability channel for LedgerAccount.property_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["property_id?", "ledger_type?", "account_code?", "limit?", "offset?"]
    output: LedgerAccount[]
    side_effects: []

  # --- Allowance ----------------------------------------------------------
  - method: POST
    path: "/night-audit/allowances"
    description: Raises an allowance request against a folio and freezes its approval tier from the requested amount.
    roles: [NightAuditor, FrontDeskAgent, RevenueManager]
    code: 201
    input: [folio_id, business_date_id, requested_amount, "reason_code?", "narrative?", "supporting_document_reference?"]
    output: Allowance
    side_effects:
      - "required_approval_role is computed per calculation allowance_approval_tier and never re-derived"
      - "status starts at DRAFT, revision_round at 0, and requested_by_user_id is stamped from X-User-ID"
      - "reason_code may be left null on a draft and supplied later through POST /night-audit/allowances/{id}/submit; submitting while it is still null fails with ERR_REASON_CODE_REQUIRED"
  - method: GET
    path: "/night-audit/allowances/{id}"
    description: Reads one allowance with its frozen approval tier and revision count.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: Allowance
    side_effects: []
  - method: GET
    path: "/night-audit/allowances"
    description: "Lists allowances, filterable by folio, business date and reversed original - the reverse-reachability channel for Allowance.folio_id, .business_date_id and .reverses_allowance_id. This is the only discovery channel for the compensating allowance a reversal mints."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["folio_id?", "business_date_id?", "reverses_allowance_id?", "status?", "reason_code?", "required_approval_role?", "limit?", "offset?"]
    output: Allowance[]
    side_effects: []
  - method: POST
    path: "/night-audit/allowances/{id}/submit"
    description: Submits a draft or revised allowance for approval, optionally replacing its reason code, narrative and supporting reference.
    roles: [NightAuditor, FrontDeskAgent, RevenueManager]
    code: 200
    input: ["reason_code?", "narrative?", "supporting_document_reference?"]
    output: Allowance
    side_effects:
      - "status becomes SUBMITTED and submitted_at is stamped from the logical clock"
      - "revision_round and required_approval_role are both left untouched"
      - "increments Allowance.version by 1"
  - method: POST
    path: "/night-audit/allowances/{id}/approve"
    description: Approves a submitted allowance at or below the requested amount and posts the credit in the same request; the requester may never approve.
    roles: [NightAuditor, RevenueManager, Controller]
    code: 200
    input: [approved_amount]
    output: Allowance
    side_effects:
      - "stamps approved_amount, approved_by_user_id and approved_at, then advances status through APPROVED to POSTED inside the same request"
      - "appends an ALLOWANCE JournalPosting of -approved_amount with source_channel ALLOWANCE_WORKFLOW and allowance_id set to this allowance"
      - "that line re-derives the folio's charges_total_amount, balance_amount and settlement_status"
      - "that line re-derives the date's room_night_revenue_amount, allowance_credit_amount, room_revenue_amount, total_revenue_amount, adr_amount and revpar_amount"
      - "the changed date aggregates set every DRAFT or DISTRIBUTED RevenueReport of that date to SUPERSEDED"
      - "increments Allowance.version by 1"
  - method: POST
    path: "/night-audit/allowances/{id}/reject"
    description: Rejects a submitted allowance outright; no journal line is ever written.
    roles: [RevenueManager, Controller]
    code: 200
    input: []
    output: Allowance
    side_effects:
      - "status becomes REJECTED, which is terminal"
      - "increments Allowance.version by 1"
  - method: POST
    path: "/night-audit/allowances/{id}/return-for-revision"
    description: Sends a submitted allowance back to its requester, consuming one of two allowed revision rounds.
    roles: [RevenueManager, Controller]
    code: 200
    input: []
    output: Allowance
    side_effects:
      - "status becomes RETURNED_FOR_REVISION and revision_round += 1"
      - "required_approval_role is untouched, so a revision cannot lower the approval tier"
      - "increments Allowance.version by 1"
  - method: POST
    path: "/night-audit/allowances/{id}/reverse"
    description: Reverses a posted allowance by minting a compensating allowance and an equal-and-opposite journal line.
    roles: [RevenueManager, Controller]
    code: 200
    input: []
    output: Allowance
    side_effects:
      - "status becomes REVERSED, which is terminal"
      - "mints a second Allowance with status POSTED, reverses_allowance_id set to this one, reason_code copied, and requested_amount == approved_amount == this allowance's approved_amount"
      - "appends an ALLOWANCE JournalPosting of +approved_amount carrying reverses_posting_id, so the folio's balance_amount returns to exactly its pre-approval value while charges_total_amount rises by approved_amount and credits_total_amount keeps the original -approved_amount, leaving settlement_status re-derived from the new pair rather than restored"
      - "the date's room_night_revenue_amount, allowance_credit_amount, room_revenue_amount, total_revenue_amount, adr_amount and revpar_amount return to exactly their pre-approval values"
      - "every DRAFT or DISTRIBUTED RevenueReport of that date is set to SUPERSEDED again"
      - "increments Allowance.version by 1"

  # --- AuthorizationDocument ---------------------------------------------
  - method: POST
    path: "/night-audit/authorization-documents"
    description: Files approval paperwork for a comp room, an off-tolerance rate, or a large allowance, over a closed inclusive date interval.
    roles: [FrontDeskAgent, NightAuditor, RevenueManager, Controller]
    code: 201
    input: [property_id, doc_type, authorized_by_name, document_reference, valid_from_date, valid_to_date, "folio_id?", "allowance_id?", "authorized_rate_amount?"]
    output: AuthorizationDocument
    side_effects:
      - "status starts at PENDING and filed_by_user_id is stamped from X-User-ID; a PENDING document satisfies no gate"
  - method: GET
    path: "/night-audit/authorization-documents/{id}"
    description: Reads one authorization document.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: AuthorizationDocument
    side_effects: []
  - method: GET
    path: "/night-audit/authorization-documents"
    description: "Lists authorization documents, filterable by property, folio and allowance - the reverse-reachability channel for AuthorizationDocument.property_id, .folio_id and .allowance_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["property_id?", "folio_id?", "allowance_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: AuthorizationDocument[]
    side_effects: []
  - method: POST
    path: "/night-audit/authorization-documents/{id}/review"
    description: Approves or rejects filed paperwork; the filer may never review their own document.
    roles: [RevenueManager, Controller]
    code: 200
    input: [decision]
    output: AuthorizationDocument
    side_effects:
      - "decision APPROVE sets status ACTIVE, decision REJECT sets status REJECTED; reviewed_by_user_id and reviewed_at are stamped either way"
      - "an ACTIVE document immediately satisfies the comp, rate-variance or allowance-document gate for every day inside its inclusive interval"
      - "increments AuthorizationDocument.version by 1"
  - method: POST
    path: "/night-audit/authorization-documents/{id}/revoke"
    description: Revokes active paperwork going forward, without rewriting any line already posted under it.
    roles: [Controller]
    code: 200
    input: []
    output: AuthorizationDocument
    side_effects:
      - "status becomes REVOKED and reviewed_by_user_id is re-stamped"
      - "lines already posted under the document are left untouched, but every later evaluation treats it as absent, so the next post-room-and-tax run over a covered comp folio fails with ERR_COMP_AUTHORIZATION_MISSING"
      - "increments AuthorizationDocument.version by 1"

  # --- CardAuthorization -------------------------------------------------
  - method: POST
    path: "/night-audit/card-authorizations"
    description: Records a credit card authorization held against a folio, ageing from obtained_at against the logical clock.
    roles: [FrontDeskAgent, NightAuditor]
    code: 201
    input: [folio_id, obtained_at, authorized_amount]
    output: CardAuthorization
    side_effects:
      - "status starts at APPROVED and follow_up_status at NOT_REQUIRED"
      - "aging_days is computed per calculation authorization_aging and may already have lapsed the authorization to EXPIRED on its first read"
  - method: GET
    path: "/night-audit/card-authorizations/{id}"
    description: Reads one authorization, re-deriving aging_days from the logical clock on every read.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: CardAuthorization
    side_effects:
      - "an APPROVED authorization whose aging_days has reached HotelProperty.card_authorization_valid_days is observed as EXPIRED"
  - method: GET
    path: "/night-audit/card-authorizations"
    description: "Lists card authorizations, filterable by folio - the reverse-reachability channel for CardAuthorization.folio_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["folio_id?", "status?", "follow_up_status?", "limit?", "offset?"]
    output: CardAuthorization[]
    side_effects: []
  - method: POST
    path: "/night-audit/card-authorizations/{id}/decline"
    description: Records an issuer decline, opening the follow-up dimension and holding the folio.
    roles: [FrontDeskAgent, NightAuditor]
    code: 200
    input: [decline_code]
    output: CardAuthorization
    side_effects:
      - "status becomes DECLINED and follow_up_status is forced from NOT_REQUIRED to PENDING"
      - "the owning Folio.settlement_hold becomes true, blocking check-out with ERR_DECLINED_AUTH_UNRESOLVED"
      - "the folio's BusinessDate.declined_authorization_count rises, blocking the date from reaching BALANCED"
      - "increments CardAuthorization.version by 1"
  - method: POST
    path: "/night-audit/card-authorizations/{id}/capture"
    description: Captures an approved, unexpired authorization and applies the money to the folio as a PAYMENT line.
    roles: [NightAuditor]
    code: 200
    input: [captured_amount, business_date_id, "ledger_account_id?"]
    output: CardAuthorization
    side_effects:
      - "status becomes CAPTURED and captured_amount is stamped"
      - "appends a PAYMENT JournalPosting of -captured_amount with source_channel FRONT_DESK"
      - "re-derives the folio's credits_total_amount, balance_amount and settlement_status; the date's revenue aggregates are unchanged"
      - "increments CardAuthorization.version by 1"
  - method: POST
    path: "/night-audit/card-authorizations/{id}/follow-up"
    description: Advances the declined-authorization follow-up dimension independently of the authorization's own status.
    roles: [FrontDeskAgent, NightAuditor]
    code: 200
    input: [follow_up_action, "follow_up_note?"]
    output: CardAuthorization
    side_effects:
      - "follow_up_action CONTACT moves follow_up_status PENDING -> CONTACTED and stores follow_up_note; the folio stays held"
      - "follow_up_action RESOLVE moves CONTACTED -> RESOLVED, stamps resolved_by_user_id, clears Folio.settlement_hold to false and lowers BusinessDate.declined_authorization_count"
      - "follow_up_action ESCALATE moves CONTACTED -> ESCALATED, stamps resolved_by_user_id and leaves both the hold and the count in place"
      - "status stays DECLINED throughout; the two dimensions never constrain each other"
      - "increments CardAuthorization.version by 1"

  # --- RevenueReport ------------------------------------------------------
  - method: POST
    path: "/night-audit/revenue-reports"
    description: "Snapshots one operating day's revenue, occupancy statistics and pace comparison, superseding the day's previous report. Guarded by expected_business_date_version so a caller cannot publish figures that moved underneath it."
    roles: [RevenueManager, NightAuditor]
    code: 201
    input: [business_date_id, recipient_role_list, expected_business_date_version, "pace_basis?"]
    output: RevenueReport
    side_effects:
      - "on a version mismatch nothing is written, the previous report keeps its status, BusinessDate.version is untouched, and the call fails with ERR_STALE_BUSINESS_DATE_VERSION"
      - "copies rooms_available_count, rooms_occupied_count, occupancy_pct, adr_amount, revpar_amount, room_revenue_amount, tax_revenue_amount, outlet_revenue_amount and total_revenue_amount from the named BusinessDate"
      - "computes benchmark_room_revenue_amount and pace_index_pct per calculation pace_index using the requested pace_basis"
      - "sets every DRAFT or DISTRIBUTED RevenueReport of the same date to SUPERSEDED"
      - "status starts at DRAFT and generated_by_user_id is stamped from X-User-ID"
      - "increments BusinessDate.version by 1"
  - method: GET
    path: "/night-audit/revenue-reports/{id}"
    description: Reads one revenue report snapshot.
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: []
    output: RevenueReport
    side_effects: []
  - method: GET
    path: "/night-audit/revenue-reports"
    description: "Lists revenue reports, filterable by business date - the reverse-reachability channel for RevenueReport.business_date_id."
    roles: [PropertyAdmin, NightAuditor, FrontDeskAgent, OutletManager, RevenueManager, Controller]
    code: 200
    input: ["business_date_id?", "status?", "pace_basis?", "limit?", "offset?"]
    output: RevenueReport[]
    side_effects: []
  - method: POST
    path: "/night-audit/revenue-reports/{id}/distribute"
    description: Distributes a draft report to its recipient roles, which is the last precondition the day's close requires.
    roles: [RevenueManager, Controller]
    code: 200
    input: ["recipient_role_list?"]
    output: RevenueReport
    side_effects:
      - "status becomes DISTRIBUTED and distributed_at is stamped from the logical clock"
      - "the owning BusinessDate now satisfies the close precondition"
      - "increments RevenueReport.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization -----------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: X-User-ID or X-User-Role is missing or empty, or X-User-Role is not one of the six declared roles.
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: The caller's role is not listed on the endpoint, or an OutletManager's X-User-ID is not the id of an existing Outlet.
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: The body is not a JSON object, a required input field is missing, a field carries the wrong JSON type, or an enum field carries a value outside its declared set.

  # --- not found ----------------------------------------------------------
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: A path id or body property_id does not resolve to a HotelProperty.
  - id: ERR_OUTLET_NOT_FOUND
    http: 404
    condition: A path id or body outlet_id does not resolve to an Outlet.
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: A path id does not resolve to an AccountingPeriod.
  - id: ERR_BUSINESS_DATE_NOT_FOUND
    http: 404
    condition: A path id or body business_date_id does not resolve to a BusinessDate.
  - id: ERR_FOLIO_NOT_FOUND
    http: 404
    condition: A path id, body folio_id or body room_charge_folio_id does not resolve to a Folio.
  - id: ERR_POSTING_NOT_FOUND
    http: 404
    condition: A path id does not resolve to a JournalPosting.
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: A path id does not resolve to an OutletTicket.
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: A path id does not resolve to a SettlementBatch.
  - id: ERR_LEDGER_ACCOUNT_NOT_FOUND
    http: 404
    condition: A path id or body ledger_account_id does not resolve to a LedgerAccount.
  - id: ERR_ALLOWANCE_NOT_FOUND
    http: 404
    condition: A path id or body allowance_id does not resolve to an Allowance.
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: A path id does not resolve to an AuthorizationDocument.
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: A path id does not resolve to a CardAuthorization.
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: A path id does not resolve to a RevenueReport.

  # --- business-date lifecycle -------------------------------------------
  - id: ERR_BUSINESS_DATE_ARCHIVED
    http: 409
    condition: A write names a BusinessDate whose status is ARCHIVED; an archived day accepts nothing at all.
  - id: ERR_CHARGES_ALREADY_SEALED
    http: 409
    condition: A charge-bearing write names a BusinessDate whose status is not OPEN, ROOM_POSTING or REOPENED.
  - id: ERR_BUSINESS_DATE_NOT_OPEN
    http: 409
    condition: post-room-and-tax is called on a date whose status is not OPEN, including a second call on a date already in ROOM_POSTING.
  - id: ERR_DATE_NOT_READY_TO_SEAL
    http: 409
    condition: seal-charges is called on a date whose status is not ROOM_POSTING.
  - id: ERR_DATE_NOT_READY_TO_VERIFY
    http: 409
    condition: verify-settlements is called on a date whose status is neither CHARGES_SEALED nor SETTLEMENT_REVIEW.
  - id: ERR_DATE_NOT_READY_TO_BALANCE
    http: 409
    condition: balance is called on a date that is neither SETTLEMENT_REVIEW nor REOPENED, city-ledger-sweep is called outside {ROOM_POSTING, CHARGES_SEALED, SETTLEMENT_REVIEW, REOPENED}, or a revenue report is created for a date outside {SETTLEMENT_REVIEW, BALANCED, REOPENED}.
  - id: ERR_DATE_NOT_BALANCED
    http: 409
    condition: close is called on a date whose status is not BALANCED.
  - id: ERR_DATE_NOT_CLOSED
    http: 409
    condition: reopen is called on a date whose status is not CLOSED.
  - id: ERR_DUPLICATE_BUSINESS_DATE
    http: 409
    condition: A BusinessDate already exists for that property and business_date.

  # --- folio lifecycle ----------------------------------------------------
  - id: ERR_FOLIO_NOT_RESERVED
    http: 409
    condition: check-in or cancel is called on a folio whose stay_status is not RESERVED.
  - id: ERR_FOLIO_NOT_IN_HOUSE
    http: 409
    condition: check-out is called on a folio whose stay_status is not IN_HOUSE, including a second check-out of a DEPARTED folio.
  - id: ERR_FOLIO_ALREADY_TRANSFERRED
    http: 409
    condition: A posting, payment or allowance approval targets a folio whose settlement_status is already TRANSFERRED_TO_CITY_LEDGER.
  - id: ERR_FOLIO_BALANCE_NOT_ZERO
    http: 409
    condition: cancel is called on a reserved folio whose balance_amount is not exactly 0.00.
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: A MISC_CHARGE posting or a room-charge ticket close would carry the folio's balance_amount above Folio.credit_limit_amount.
  - id: ERR_RATE_VARIANCE_UNAUTHORIZED
    http: 409
    condition: check-in is attempted on a folio whose abs(rate_variance_pct) exceeds the property tolerance with no ACTIVE RATE_OVERRIDE document covering the arrival date.
  - id: ERR_COMP_AUTHORIZATION_MISSING
    http: 409
    condition: post-room-and-tax finds a comp folio due a room night with no ACTIVE COMP_ROOM document whose inclusive interval contains the business date; the run writes nothing.

  # --- journal and ledger -------------------------------------------------
  - id: ERR_CHARGE_TYPE_NOT_POSTABLE
    http: 422
    condition: A client-supplied charge_type is not one of MISC_CHARGE, PAYMENT, LEDGER_TRANSFER or DEPOSIT_APPLIED.
  - id: ERR_POSTING_ALREADY_REVERSED
    http: 409
    condition: The line being reversed is itself a reversal, or another line already names it in reverses_posting_id.
  - id: ERR_SELF_REVERSAL_FORBIDDEN
    http: 403
    condition: The X-User-ID reversing a journal line equals the line's posted_by_user_id.
  - id: ERR_LEDGERS_OUT_OF_BALANCE
    http: 409
    condition: balance is attempted while BusinessDate.ledger_control_amount is not exactly 0.00, which happens when a one-sided LEDGER_TRANSFER or DEPOSIT_APPLIED line has been posted by hand.
  - id: ERR_CROSS_PROPERTY_REFERENCE
    http: 422
    condition: Two entities named in one request belong to different HotelProperty rows.

  # --- outlet, ticket and settlement -------------------------------------
  - id: ERR_OUTLET_SUSPENDED
    http: 409
    condition: A ticket or batch names an Outlet whose status is SUSPENDED.
  - id: ERR_OUTLET_SCOPE_VIOLATION
    http: 403
    condition: An OutletManager addresses a ticket or batch whose outlet_id is not the caller's own X-User-ID.
  - id: ERR_TICKET_FOLIO_REQUIRED
    http: 422
    condition: A ROOM_CHARGE ticket omits room_charge_folio_id, or a CASH or CREDIT_CARD ticket supplies one.
  - id: ERR_DUPLICATE_TICKET_NUMBER
    http: 409
    condition: An OutletTicket already exists with that ticket_number for the same outlet and business date.
  - id: ERR_DUPLICATE_OUTLET_CODE
    http: 409
    condition: An Outlet already exists with that outlet_code under the same property.
  - id: ERR_TICKET_NOT_OPEN
    http: 409
    condition: close is called on a ticket whose status is not OPEN.
  - id: ERR_TICKET_NOT_CLOSED
    http: 409
    condition: void is called on a ticket whose status is not CLOSED, including a second void.
  - id: ERR_SHIFT_WINDOW_INVALID
    http: 422
    condition: SettlementBatch.shift_start_at is at or after shift_end_at, or AuthorizationDocument.valid_from_date is after valid_to_date.
  - id: ERR_SHIFT_WINDOW_OVERLAP
    http: 409
    condition: Another live SettlementBatch of the same outlet, business date and tender_type already occupies an overlapping half-open window; two windows that merely touch do not overlap.
  - id: ERR_BATCH_NOT_FLAGGED
    http: 409
    condition: request-recount or accept-variance is called on a batch whose status is not VARIANCE_FLAGGED.
  - id: ERR_BATCH_NOT_AWAITING_RECOUNT
    http: 409
    condition: redeclare is called on a batch whose status is not RECOUNT_REQUESTED.
  - id: ERR_RECOUNT_LIMIT_REACHED
    http: 409
    condition: request-recount is called on a batch whose recount_round has already reached SETTLEMENT_RECOUNT_LIMIT of 2.
  - id: ERR_SETTLEMENTS_UNRESOLVED
    http: 409
    condition: verify-settlements finds an ACTIVE outlet requiring shift settlement with no batch on the date, or balance finds a batch still DECLARED, VARIANCE_FLAGGED or RECOUNT_REQUESTED.

  # --- allowance workflow -------------------------------------------------
  - id: ERR_ALLOWANCE_NOT_SUBMITTABLE
    http: 409
    condition: submit is called on an allowance whose status is neither DRAFT nor RETURNED_FOR_REVISION.
  - id: ERR_ALLOWANCE_NOT_PENDING
    http: 409
    condition: approve, reject or return-for-revision is called on an allowance whose status is not SUBMITTED.
  - id: ERR_ALLOWANCE_NOT_POSTED
    http: 409
    condition: reverse is called on an allowance whose status is not POSTED.
  - id: ERR_ALREADY_A_REVERSAL
    http: 409
    condition: reverse is called on a compensating allowance that already carries reverses_allowance_id.
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: return-for-revision is called on an allowance whose revision_round has already reached ALLOWANCE_REVISION_LIMIT of 2.
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 403
    condition: The acting X-User-ID equals the recorded originator - requested_by_user_id on an allowance decision, declared_by_user_id on a settlement acceptance, or filed_by_user_id on a document review.
  - id: ERR_APPROVAL_TIER_INSUFFICIENT
    http: 403
    condition: The acting role sits below Allowance.required_approval_role on the ladder NightAuditor < RevenueManager < Controller.
  - id: ERR_APPROVED_AMOUNT_EXCEEDS_REQUEST
    http: 422
    condition: approved_amount is not greater than 0, or exceeds requested_amount.
  - id: ERR_REASON_CODE_REQUIRED
    http: 422
    condition: submit is attempted on an allowance carrying no reason_code.
  - id: ERR_SUPPORTING_DOCUMENT_REQUIRED
    http: 422
    condition: An allowance with reason_code RATE_ERROR is submitted with an empty or absent supporting_document_reference.
  - id: ERR_ALLOWANCE_DOCUMENT_MISSING
    http: 409
    condition: An allowance whose requested_amount reaches the controller threshold is approved with no ACTIVE ALLOWANCE_APPROVAL document naming it.

  # --- authorization documents -------------------------------------------
  - id: ERR_DOCUMENT_NOT_PENDING
    http: 409
    condition: review is called on a document whose status is not PENDING.
  - id: ERR_DOCUMENT_NOT_ACTIVE
    http: 409
    condition: revoke is called on a document whose status is not ACTIVE.
  - id: ERR_DOCUMENT_TARGET_MISMATCH
    http: 422
    condition: doc_type and the supplied target do not agree - a COMP_ROOM or RATE_OVERRIDE document without folio_id or with allowance_id, an ALLOWANCE_APPROVAL document without allowance_id or with folio_id, or a RATE_OVERRIDE document without authorized_rate_amount.
  - id: ERR_AUTHORIZATION_INTERVAL_OVERLAP
    http: 409
    condition: Another PENDING or ACTIVE document of the same folio_id and doc_type occupies an overlapping closed interval; because both endpoints are inclusive, documents that merely touch overlap.

  # --- card authorizations ------------------------------------------------
  - id: ERR_AUTHORIZATION_NOT_APPROVED
    http: 409
    condition: "decline or capture is called on an authorization whose status is DECLINED or CAPTURED,
      or decline is called on an authorization that has already lapsed to EXPIRED; a capture aimed at
      an EXPIRED authorization raises ERR_AUTHORIZATION_EXPIRED instead."
  - id: ERR_AUTHORIZATION_EXPIRED
    http: 409
    condition: capture is called on an authorization whose aging_days has reached HotelProperty.card_authorization_valid_days.
  - id: ERR_CAPTURE_EXCEEDS_AUTHORIZATION
    http: 422
    condition: captured_amount is not greater than 0, or exceeds authorized_amount.
  - id: ERR_AUTHORIZATION_SHORTFALL
    http: 409
    condition: A CREDIT_CARD folio is checked out with no APPROVED authorization whose authorized_amount covers the balance the folio will hold after the late-checkout charge.
  - id: ERR_DECLINED_AUTH_UNRESOLVED
    http: 409
    condition: check-out is attempted on a folio whose settlement_hold is true, or balance is attempted while BusinessDate.declined_authorization_count is above 0.
  - id: ERR_FOLLOW_UP_NOT_PENDING
    http: 409
    condition: follow_up_action CONTACT is used on an authorization whose follow_up_status is not PENDING.
  - id: ERR_FOLLOW_UP_NOT_CONTACTED
    http: 409
    condition: follow_up_action RESOLVE or ESCALATE is used on an authorization whose follow_up_status is not CONTACTED.
  - id: ERR_FOLLOW_UP_NO_REPLACEMENT_TENDER
    http: 409
    condition: follow_up_action RESOLVE is used on a folio carrying no JournalPosting with charge_type PAYMENT.

  # --- revenue report and period ----------------------------------------
  - id: ERR_STALE_BUSINESS_DATE_VERSION
    http: 412
    condition: expected_business_date_version does not match the BusinessDate.version held at the moment the revenue report would be written.
  - id: ERR_REPORT_NOT_DRAFT
    http: 409
    condition: distribute is called on a report whose status is DISTRIBUTED or SUPERSEDED.
  - id: ERR_DISTRIBUTION_LIST_EMPTY
    http: 422
    condition: distribute is called on a report whose recipient_role_list is an empty array.
  - id: ERR_REPORT_NOT_DISTRIBUTED
    http: 409
    condition: close is attempted on a date with no DISTRIBUTED RevenueReport, including a date whose only report was superseded.
  - id: ERR_PERIOD_NOT_TIEABLE
    http: 409
    condition: tie-out is called on a period whose status is neither OPEN nor TIE_OUT_FAILED.
  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: reopen is attempted on a date whose accounting period is no longer OPEN.
  - id: ERR_PERIOD_HAS_OPEN_DATES
    http: 409
    condition: tie-out is attempted while any BusinessDate of the period has a status other than CLOSED or ARCHIVED.
  - id: ERR_TIE_OUT_ATTEMPT_LIMIT_REACHED
    http: 409
    condition: tie-out is retried on a period whose tie_out_attempt_count has already reached GL_TIE_OUT_ATTEMPT_LIMIT of 3.

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PropertyAdmin
    description: Sets up the property, its outlets and its ledger accounts. Holds no operational authority over any business day - it cannot post, approve or close anything.
    identity: opaque
    exclusive_operations:
      - "POST /night-audit/properties"
      - "POST /night-audit/outlets"
      - "POST /night-audit/outlets/{id}/suspend"
    shared_operations:
      - "POST /night-audit/business-dates (shared with NightAuditor)"
      - "POST /night-audit/ledger-accounts (shared with Controller)"
      - "every GET endpoint"

  - name: NightAuditor
    description: Drives the daily close sequence end to end - room and tax posting, sealing, settlement verification, the city-ledger sweep, balancing and closing - and may raise allowances but only approve those in the lowest tier.
    identity: opaque
    exclusive_operations:
      - "POST /night-audit/business-dates/{id}/post-room-and-tax"
      - "POST /night-audit/business-dates/{id}/seal-charges"
      - "POST /night-audit/business-dates/{id}/verify-settlements"
      - "POST /night-audit/business-dates/{id}/city-ledger-sweep"
      - "POST /night-audit/business-dates/{id}/balance"
      - "POST /night-audit/business-dates/{id}/close"
      - "POST /night-audit/settlement-batches/{id}/request-recount"
      - "POST /night-audit/card-authorizations/{id}/capture"
    shared_operations:
      - "POST /night-audit/business-dates (shared with PropertyAdmin)"
      - "POST /night-audit/folios and its check-in, check-out, cancel and payments actions (shared with FrontDeskAgent)"
      - "POST /night-audit/journal-postings (shared with FrontDeskAgent and Controller)"
      - "POST /night-audit/journal-postings/{id}/reverse (shared with Controller)"
      - "POST /night-audit/outlet-tickets and its close and void actions (shared with OutletManager)"
      - "POST /night-audit/settlement-batches and redeclare (shared with OutletManager)"
      - "POST /night-audit/allowances and submit (shared with FrontDeskAgent and RevenueManager)"
      - "POST /night-audit/allowances/{id}/approve (shared with RevenueManager and Controller, but only for allowances whose required_approval_role is NightAuditor)"
      - "POST /night-audit/authorization-documents (shared with FrontDeskAgent, RevenueManager and Controller)"
      - "POST /night-audit/card-authorizations, decline and follow-up (shared with FrontDeskAgent)"
      - "POST /night-audit/revenue-reports (shared with RevenueManager)"
      - "every GET endpoint"

  - name: FrontDeskAgent
    description: Handles arrivals, departures, tenders and card authorizations. May raise an allowance but never decide one, and may never touch the close sequence.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /night-audit/folios and its check-in, check-out, cancel and payments actions (shared with NightAuditor)"
      - "POST /night-audit/journal-postings (shared with NightAuditor and Controller)"
      - "POST /night-audit/allowances and submit (shared with NightAuditor and RevenueManager)"
      - "POST /night-audit/authorization-documents (shared with NightAuditor, RevenueManager and Controller)"
      - "POST /night-audit/card-authorizations, decline and follow-up (shared with NightAuditor)"
      - "every GET endpoint"

  - name: OutletManager
    description: Runs one revenue capture point. Every write it makes must name its own outlet, because its X-User-ID IS that outlet's id.
    identity: "entity_backed:Outlet"
    exclusive_operations: []
    shared_operations:
      - "POST /night-audit/outlet-tickets and its close and void actions, restricted to tickets whose outlet_id equals the caller's X-User-ID (shared with NightAuditor)"
      - "POST /night-audit/settlement-batches and redeclare, restricted to batches whose outlet_id equals the caller's X-User-ID (shared with NightAuditor)"
      - "every GET endpoint"

  - name: RevenueManager
    description: Reviews allowances, rate and comp paperwork, settlement variances and the daily revenue report. Sits above NightAuditor and below Controller on the approval ladder.
    identity: opaque
    exclusive_operations:
      - "POST /night-audit/allowances/{id}/reject"
      - "POST /night-audit/allowances/{id}/return-for-revision"
      - "POST /night-audit/allowances/{id}/reverse"
      - "POST /night-audit/settlement-batches/{id}/accept-variance"
      - "POST /night-audit/authorization-documents/{id}/review"
      - "POST /night-audit/revenue-reports/{id}/distribute"
    shared_operations:
      - "POST /night-audit/allowances and submit (shared with NightAuditor and FrontDeskAgent)"
      - "POST /night-audit/allowances/{id}/approve (shared with NightAuditor and Controller, up to the controller threshold)"
      - "POST /night-audit/authorization-documents (shared with NightAuditor, FrontDeskAgent and Controller)"
      - "POST /night-audit/revenue-reports (shared with NightAuditor)"
      - "every GET endpoint"
    note: "Every one of its exclusive_operations additionally refuses the caller when X-User-ID equals the originator recorded on the target row - segregation of duties outranks role authority."

  - name: Controller
    description: Financial control. Owns the reopen, the revoke and the month-end tie-out, and is the only role that may approve an allowance at or above the controller threshold.
    identity: opaque
    exclusive_operations:
      - "POST /night-audit/business-dates/{id}/reopen"
      - "POST /night-audit/authorization-documents/{id}/revoke"
      - "POST /night-audit/accounting-periods/{id}/tie-out"
    shared_operations:
      - "POST /night-audit/ledger-accounts (shared with PropertyAdmin)"
      - "POST /night-audit/journal-postings (shared with NightAuditor and FrontDeskAgent)"
      - "POST /night-audit/journal-postings/{id}/reverse (shared with NightAuditor)"
      - "POST /night-audit/allowances/{id}/approve, reject, return-for-revision and reverse (shared with RevenueManager)"
      - "POST /night-audit/settlement-batches/{id}/accept-variance (shared with RevenueManager)"
      - "POST /night-audit/authorization-documents and review (shared with RevenueManager)"
      - "POST /night-audit/revenue-reports/{id}/distribute (shared with RevenueManager)"
      - "every GET endpoint"
    note: "The approval ladder is NightAuditor < RevenueManager < Controller and applies only to Allowance.required_approval_role; it does NOT make Controller a superset of every other role - Controller cannot run the close sequence, cannot check a guest in, and cannot close an outlet ticket."
