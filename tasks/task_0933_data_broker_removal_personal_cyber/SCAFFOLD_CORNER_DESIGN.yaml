scaffold_corner_design:

  # =========================================================================
  # Section 1 — Entities
  # =========================================================================
  - section: entities
    instances:

      - name: plan_creation_returns_201_with_declared_quota_columns
        claim_type: Creation
        grounds:
          - entities.Plan
          - endpoints[POST /plans]
        distinguishing_aspect: "POST /plans with all eight declared inputs returns 201, echoes every quota column verbatim and stamps version 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Plan.${plan_id}.tier == FAMILY and monthly_fee_cents == 2200 and max_members == 4"
            - "Plan.${plan_id}.profile_quota_per_cycle == 4, scan_quota_per_cycle == 12, removal_quota_per_cycle == 60, per_member_removal_subcap == 25"
            - "Plan.${plan_id}.version == 1 and created_at is present"

      - name: account_creation_mints_primary_member_cycle_and_three_grants
        claim_type: Creation
        grounds:
          - entities.Account
          - entities.Member.fields.is_primary
          - entities.BillingCycle.fields.cycle_seq
          - entities.EntitlementLedgerEntry.fields.reason_code
        distinguishing_aspect: "POST /accounts creates four kinds of row in one call: the Account, its primary Member in ACTIVE, BillingCycle cycle_seq 1 running 2026-05-01 to 2026-05-31, and three CYCLE_GRANT ledger rows carrying the plan quotas."
        test_recipe:
          setup:
            - "A FAMILY plan exists; the logical clock is at its startup default 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "GET /accounts/${acct_id}/members"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m0_id: "$.data[0].id" }
            - call: "GET /accounts/${acct_id}/billing-cycles"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: "$.data[0].id" }
          assert:
            - "HTTP status is 201; Account.${acct_id}.status == ACTIVE and legal_hold == false and version == 1"
            - "GET /accounts/${acct_id}/members returns total_count == 1 and $.data[0].id == ${owner_id}"
            - "Member.${owner_id}.is_primary == true, status == ACTIVE, authorization_status == GRANTED, role_in_family == PRIMARY, invitation_token is null"
            - "BillingCycle.${cycle_id}.cycle_seq == 1, status == OPEN, starts_at == 2026-05-01T00:00:00.000Z, ends_at == 2026-05-31T00:00:00.000Z, base_charge_cents == 2200"
            - "GET /entitlement-ledger?account_id=${acct_id}&entry_type=GRANT returns total_count == 3 with amounts 4 (PROFILE), 12 (SCAN) and 60 (REMOVAL), all reason_code CYCLE_GRANT"
            - "Account.${acct_id}.profile_units_remaining == 4, scan_units_remaining == 12, removal_units_remaining == 60"

      - name: get_account_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unknown UUID in {id} yields ERR_ACCOUNT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_ACCOUNT_NOT_FOUND"
            - "The response envelope carries response_type == error and a meta block with api_request_id and api_request_timestamp"

      - name: monitored_profile_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=6]
          - errors[ERR_VALIDATION]
          - endpoints[POST /monitored-profiles]
        distinguishing_aspect: "Omitting the required primary_address on POST /monitored-profiles returns ERR_VALIDATION (422), not a 500 and not a silent default."
        test_recipe:
          setup:
            - "A FAMILY plan and an ACTIVE account with its primary member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
          trigger:
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == ERR_VALIDATION"
            - "GET /members/${owner_id}/monitored-profiles returns total_count == 0"

      - name: monitored_profile_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.MonitoredProfile.fields.rescan_cadence_days
          - entities.MonitoredProfile.fields.two_factor_attested
        distinguishing_aspect: "Omitting rescan_cadence_days and two_factor_attested yields the declared defaults 30 and false, and the profile starts in DRAFT."
        test_recipe:
          setup:
            - "A FAMILY plan and an ACTIVE account with its primary member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
          trigger:
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "MonitoredProfile.${prof_id}.rescan_cadence_days == 30"
            - "MonitoredProfile.${prof_id}.two_factor_attested == false"
            - "MonitoredProfile.${prof_id}.status == DRAFT, activated_at is null, last_completed_scan_at is null"
            - "MonitoredProfile.${prof_id}.hygiene_score == 100.00 and hygiene_band == STRONG with zero findings"

      - name: broker_invalid_enum_opt_out_method_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "opt_out_method is on rung 8's exhaustive enum list, so a value outside {WEB_FORM, EMAIL, POSTAL, PHONE} returns ERR_INVALID_ENUM, not ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /brokers"
              payload: { name: "Bad Broker", opt_out_method: "FAX", jurisdiction: "US_CA", response_window_days: 30, requires_identity_verification: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == ERR_INVALID_ENUM"
            - "No Broker row is created"

      - name: broker_response_window_out_of_range_returns_value_out_of_range
        claim_type: Type Constraints
        grounds:
          - validations[priority=9]
          - errors[ERR_VALUE_OUT_OF_RANGE]
          - calculations.removal_sla_deadline
        distinguishing_aspect: "response_window_days 91 exceeds BROKER_WINDOW_MAX_DAYS (90) and is a numeric-range violation, so it routes to ERR_VALUE_OUT_OF_RANGE (rung 9), a different rung from the enum rung above."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /brokers"
              payload: { name: "Slow Broker", opt_out_method: "EMAIL", jurisdiction: "EU", response_window_days: 91, requires_identity_verification: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == ERR_VALUE_OUT_OF_RANGE"
            - "The same call with response_window_days 90 succeeds with HTTP 201, proving the boundary is inclusive"

      - name: identifier_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Identifier
          - endpoints[GET /monitored-profiles/{id}/identifiers]
        distinguishing_aspect: "Identifier declares common_fields false: the created row exposes id, created_at, profile_id, identifier_type and identifier_value, and the API surface offers no update or delete endpoint for it at all."
        test_recipe:
          setup:
            - "A FAMILY plan, an ACTIVE account and one DRAFT monitored profile."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
          trigger:
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "SSN_LAST4", identifier_value: "4417", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { ident_id: $.data.id }
            - call: "GET /monitored-profiles/${prof_id}/identifiers"
              as: AccountOwner
              as_user_id: "${owner_id}"
          assert:
            - "HTTP status is 201 and Identifier.${ident_id}.identifier_type == SSN_LAST4 and identifier_value == 4417"
            - "GET /monitored-profiles/${prof_id}/identifiers returns total_count == 1"
            - "MonitoredProfile.${prof_id}.version == 2 — adding the identifier bumped the parent, not the child"

      - name: account_listing_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /accounts]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /accounts with limit 2 over three accounts returns exactly two rows, total_count 3 and has_more true, ordered by created_at ASC."
        test_recipe:
          setup:
            - "One FAMILY plan and three accounts created in a fixed order."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "a@example.com", primary_member_full_name: "A Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "b@example.com", primary_member_full_name: "B Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_b: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "c@example.com", primary_member_full_name: "C Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_c: $.data.id }
          trigger:
            - call: "GET /accounts?limit=2&offset=0"
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "The response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "first_id == ${acct_a} — ordering is created_at ASC"
            - "GET /accounts?limit=2&offset=2 returns 1 row (${acct_c}) with has_more == false"
            - "GET /accounts?plan_id=${plan_family_id} returns total_count == 3"

      - name: monitored_profile_create_with_unknown_member_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=11]
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "Flat topology FK integrity: a body member_id that resolves to nothing returns ERR_MEMBER_NOT_FOUND (404) at rung 11, before any ownership or state rung."
        test_recipe:
          setup:
            - "A FAMILY plan and an ACTIVE account with its primary member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
          trigger:
            - call: "POST /monitored-profiles"
              payload: { member_id: "00000000-0000-4000-8000-000000000000", full_name: "Ghost", date_of_birth: "1990-01-01", primary_address: "nowhere" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: member_create_system_field_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Member.fields.status
          - entities.Member.fields.invitation_token
        distinguishing_aspect: "Server-owned Member fields cannot be seeded from the request body: an invited member always lands in INVITED with a server-issued invitation_token whatever the caller sends."
        test_recipe:
          setup:
            - "A FAMILY plan and an ACTIVE account."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id, acct_v1: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/members"
              payload: { email: "kid@example.com", full_name: "Robin Kid", role_in_family: "MINOR", expected_account_version: "${acct_v1}", status: "ACTIVE", is_primary: true }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { kid_id: $.data.id }
          assert:
            - "Member.${kid_id}.status == INVITED — the supplied status was ignored"
            - "Member.${kid_id}.is_primary == false — the supplied is_primary was ignored"
            - "Member.${kid_id}.invitation_token is a non-empty server-issued string"
            - "Member.${kid_id}.authorization_status == GRANTED and activated_at is null"

      - name: account_entitlement_fields_are_computed_from_the_ledger
        claim_type: Computed Fields
        grounds:
          - entities.Account.fields.scan_units_remaining
          - calculations.entitlement_remaining
        distinguishing_aspect: "Account.scan_units_* are derived, never stored: queuing two scans moves consumed from 0 to 2 and remaining from 12 to 10 without any endpoint ever accepting those fields as input."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one ACTIVE profile with an identifier."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan1_id: $.data.id }
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "RECURRING" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan2_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { rem: $.data.scan_units_remaining }
          assert:
            - "Account.${acct_id}.scan_units_granted == 12, scan_units_consumed == 2, scan_units_released == 0, scan_units_remaining == 10"
            - "Account.${acct_id}.profile_units_consumed == 1 and profile_units_remaining == 3"
            - "GET /entitlement-ledger?account_id=${acct_id}&resource_type=SCAN&entry_type=CONSUME returns total_count == 2, both reason_code SCAN_QUEUED"
            - "A RECURRING scan queued while last_completed_scan_at is still null is admitted — the 7-day rung only applies once a scan has completed"

  # =========================================================================
  # Section 2 — State machines
  # =========================================================================
  - section: state_machines
    instances:

      - name: cancel_account_twice_returns_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Account.ACTIVE_to_CANCELLED
          - validations[priority=19]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "CANCELLED is a terminal state of the Account status axis, so the second cancel returns ERR_ALREADY_TERMINAL (rung 19) and no side effect re-runs."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, already cancelled once."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /accounts/${acct_id}/cancel"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { v_after_first: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/cancel"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_ALREADY_TERMINAL"
            - "Account.${acct_id}.status == CANCELLED and version is unchanged from v_after_first"
            - "GET /accounts/${acct_id}/billing-cycles returns exactly one cycle, still CLOSED — the cancel cascade did not run twice"

      - name: resume_an_active_account_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Account.SUSPENDED_to_ACTIVE
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACTIVE has no declared resume transition, and ACTIVE is not terminal, so rung 18 fires with ERR_INVALID_STATE rather than rung 19's ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "FAMILY plan and a freshly created ACTIVE account."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/resume"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
