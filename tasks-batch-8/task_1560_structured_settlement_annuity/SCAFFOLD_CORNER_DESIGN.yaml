  - section: errors
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with X-User-ID / X-User-Role omitted fails auth before anything else: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), response_type 'error'. (The test omits both headers; the `as:` below is documentation of intent.)"
        test_recipe:
          setup: ["empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "GET /annuity/payees"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
