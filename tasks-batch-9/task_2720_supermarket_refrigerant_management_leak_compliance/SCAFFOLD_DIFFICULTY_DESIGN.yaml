            - call: "GET /leak-events"
              payload: { system_id: "${sys1_id}" }
              as: ComplianceManager
              captures: { event_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair-attempts"
              payload: { leak_event_id: "${event_id}", system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", repair_method_code: "BRAZE_JOINT", repair_completed_at: "2026-08-05T09:00:00Z" }
              as: Technician
              as_user_id: "${tech1_id}"
