  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_window_half_open_overlap_same_rental
        grounds:
          - validations[priority=8]
          - entities.Delivery.fields.window_start_clock
          - entities.Delivery.fields.window_end_clock
        distinguishing_aspect: |
          Delivery windows use half-open [start,end) semantics on the Delivery resource: a second
          SCHEDULED delivery for the SAME rental sharing any instant in [start,end) is rejected with
          ERR_DELIVERY_WINDOW_CONFLICT; an exactly-adjacent window (prev.end == next.start) is allowed.
        test_recipe:
          setup:
            - "A rental with one SCHEDULED INITIAL delivery [08:00,12:00); a second overlapping delivery [10:00,14:00) is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_id: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { del_id: $.data.id }
          trigger:
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T10:00:00Z", window_end_clock: "2026-06-01T14:00:00Z" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DELIVERY_WINDOW_CONFLICT (shared instant 10:00 in [08:00,12:00))"
            - "HTTP status == 409"

      - name: bike_servicing_whole_span_mutual_exclusion
        grounds:
          - validations[priority=9]
          - entities.Bike.fields.bike_status
          - state_machines.ServiceTicket.OPEN_to_IN_PROGRESS
        distinguishing_aspect: |
          Bike servicing uses whole-span mutual exclusion on the Bike resource (different interval
          semantics than the half-open delivery window): once a bike is SERVICING, any new ServiceTicket
          on it is rejected with ERR_BIKE_ALREADY_SERVICING regardless of clock values — the entire
          servicing span is the buffer.
        test_recipe:
          setup:
            - "ACTIVE rental; a CRITICAL ticket put the bike into SERVICING; a second ticket is attempted while SERVICING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "GET /bike-models/${model_id}"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${acct_id}", model_id: "${model_id}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { rent_id: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { del_id: $.data.id }
            - call: "POST /deliveries/${del_id}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rent_id}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${acct_id}"
            - call: "POST /service-tickets"
              payload: { rental_id: "${rent_id}", issue_type: "BATTERY", severity: "CRITICAL", description: "battery fault" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { tkt1: $.data.id }
          trigger:
            - call: "POST /service-tickets"
              payload: { rental_id: "${rent_id}", issue_type: "MOTOR", severity: "MAJOR", description: "second issue" }
              as: Subscriber
