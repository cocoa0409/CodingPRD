  - method: GET
    path: "/api/vendors"
    description: "List vendors (filtered)"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["production_id?", "residency_status?", "limit?", "offset?"]
    output: "Vendor[]"
    side_effects: []
  - method: GET
    path: "/api/vendors/{vendorId}"
    description: "Get a vendor"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
