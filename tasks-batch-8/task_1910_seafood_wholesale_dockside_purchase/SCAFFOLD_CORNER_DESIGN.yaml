            - { call: "POST /sales-orders", payload: { customer_id: "${c_id}", required_delivery_date: "2026-08-05" }, as: Customer, as_user_id: "${c_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /allocations", payload: { order_line_id: "00000000-0000-0000-0000-000000000000", inventory_lot_id: "00000000-0000-0000-0000-000000000000", qty_kg: 1.00, transit_hours: 1, expected_sales_order_version: "${o_v}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403) — role denial (priority 2) precedes the 404s (priority 4) and the OCC check (priority 5)"

      - name: rbac_sod_hold_release_same_officer_rejected
        claim_type: rbac_denial
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - entities.InspectionHold.fields.placed_by_user_id
          - state_machines.InventoryLot
        distinguishing_aspect: "Segregation of duties on the place/release pair: the officer who placed the hold cannot release it; a second officer releases it and the lot returns to CLEAR."
        test_recipe:
          setup: ["Lot 50.00 kg ACTIVE; hold PLACED by off_1"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
            - { call: "POST /catch-areas", payload: { fao_code: "FAO27", name: "Northeast Atlantic", region: "Atlantic" }, as: OperationsManager, captures: { ca_id: $.data.id } }
            - { call: "POST /species", payload: { species_code: "COD", common_name: "Atlantic Cod", labeling_name: "Cod", substitution_group: "GADOID", fresh_shelf_life_hours: 72, frozen_shelf_life_days: 30 }, as: OperationsManager, captures: { sp_id: $.data.id, sp_v: $.data.version } }
