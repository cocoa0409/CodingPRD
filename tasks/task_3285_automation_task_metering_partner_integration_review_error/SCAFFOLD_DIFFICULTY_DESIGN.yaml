          role: OWNER
        as: PlatformAdmin
        captures:
          mem_id: $.data.id
      - call: POST /zapier/members/register
        payload:
          account_id: ${acct_id}
          email: mem@x.test
          full_name: Mem Ber
          role: MEMBER
        as: PlatformAdmin
        captures:
          mem_x: $.data.id
      - call: POST /zapier/integrations
        payload:
          name: Slack
          partner_name: Partner Inc
          auth_method: OAUTH2
        as: PartnerAdmin
        captures:
          intg_id: $.data.id
      - call: POST /zapier/integrations/${intg_id}/endpoints
        payload:
          path: /v1/op1
          has_response_schema: true
        as: PartnerAdmin
        captures:
          ep1: $.data.id
      - call: POST /zapier/connections
        payload:
          account_id: ${acct_id}
          integration_id: ${intg_id}
          owner_member_id: ${mem_x}
        as: Member
        as_user_id: ${mem_x}
        captures:
          conn_id: $.data.id
      - call: POST /zapier/folders
        payload:
          account_id: ${acct_id}
          name: Ops
        as: Member
        as_user_id: ${mem_id}
        captures:
          fld_id: $.data.id
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: W
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_id: $.data.id
      - call: POST /zapier/workflows/${wf_id}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
        captures:
          act1: $.data.id
      - call: POST /zapier/workflows/${wf_id}/activate
        as: Member
        as_user_id: ${mem_id}
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: Instant
          folder_id: ${fld_id}
          trigger_type: INSTANT_WEBHOOK
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_inst: $.data.id
      - call: POST /zapier/workflows/${wf_inst}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
      - call: POST /zapier/workflows/${wf_inst}/activate
        as: Member
        as_user_id: ${mem_id}
      - call: POST /zapier/workflows
        payload:
          account_id: ${acct_id}
          name: Polled
          folder_id: ${fld_id}
          trigger_type: POLLING
          poll_interval_seconds: 900
        as: Member
        as_user_id: ${mem_id}
        captures:
          wf_poll: $.data.id
      - call: POST /zapier/workflows/${wf_poll}/actions
        payload:
          position: 1
          integration_id: ${intg_id}
          connection_id: ${conn_id}
          action_type: send_message
        as: Member
        as_user_id: ${mem_id}
      - call: POST /zapier/workflows/${wf_poll}/activate
        as: Member
        as_user_id: ${mem_id}
      trigger:
      - call: POST /zapier/workflows/${wf_poll}/runs
        payload:
          charge: success
        as: Member
        as_user_id: ${mem_id}
      - call: POST /zapier/workflows/${wf_inst}/runs
        payload:
