# =============================================================================
# Task 1146 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests, §1.9)
# Breadth probe across the claim-extraction-guide sections. Every chain starts
# from empty-DB; logical clock default 2026-05-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ================================================================ entities
  - section: entities
    instances:
      - name: patient_create_missing_required_mrn_rejected
        claim_type: required_fields
        grounds: [entities.Patient.fields.mrn, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field mrn yields 400 ERR_VALIDATION; no row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/patients", payload: { full_name: "No Mrn", date_of_birth: "1960-01-01", phone: "555-1000", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 400 ERR_VALIDATION"

      - name: patient_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Patient.fields.insurance_plan, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "insurance_plan outside {MEDICARE, COMMERCIAL, SELF_PAY} yields 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/patients", payload: { full_name: "Bad Enum", date_of_birth: "1960-01-01", mrn: "MRN-2001", phone: "555-1001", insurance_plan: "GOLD" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 400 ERR_VALIDATION"

      - name: patient_create_extra_id_field_input_ignored
        claim_type: system_fields
        grounds: [entities.Patient]
        distinguishing_aspect: "Client-supplied id in the create payload is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/patients", payload: { id: "client-supplied", full_name: "Sys Fields", date_of_birth: "1960-01-01", mrn: "MRN-2002", phone: "555-1002", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
          assert:
            - "trigger returns 201 and Patient.${p_id}.id != client-supplied (server-minted UUID)"
            - "Patient.${p_id}.version == 1 and created_at == 2026-05-01T00:00:00Z (clock default)"

      - name: patient_duplicate_mrn_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=9] (ERR_DUPLICATE_MRN)"]
        distinguishing_aspect: "Second patient with an existing mrn yields 409 ERR_DUPLICATE_MRN."
        test_recipe:
          setup: ["one patient with mrn MRN-2003"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "First", date_of_birth: "1960-01-01", mrn: "MRN-2003", phone: "555-1003", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator }
          trigger:
            - { call: "POST /v1/patients", payload: { full_name: "Second", date_of_birth: "1961-01-01", mrn: "MRN-2003", phone: "555-1004", insurance_plan: "SELF_PAY" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 409 ERR_DUPLICATE_MRN"

      - name: physician_duplicate_npi_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=9] (ERR_DUPLICATE_NPI)"]
        distinguishing_aspect: "Second physician with an existing npi yields 409 ERR_DUPLICATE_NPI."
        test_recipe:
          setup: ["one physician with npi 2000000001"]
          setup_api_calls:
            - { call: "POST /v1/physicians", payload: { full_name: "Dr One", npi: "2000000001", specialty: "CARDIOLOGY" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Two", npi: "2000000001", specialty: "EP" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 409 ERR_DUPLICATE_NPI"

      - name: device_duplicate_serial_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=9] (ERR_DUPLICATE_SERIAL)"]
        distinguishing_aspect: "Second device with an existing serial_number yields 409 ERR_DUPLICATE_SERIAL."
        test_recipe:
          setup: ["one device with serial EV-2003"]
          setup_api_calls:
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2003", model: "HOLTER" }, as: InventoryManager }
          trigger:
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2003", model: "EVENT" }, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 409 ERR_DUPLICATE_SERIAL"

      - name: derived_open_compliance_events_counter
        claim_type: computed_fields
        grounds: [entities.Patient.fields.open_compliance_events]
        distinguishing_aspect: "Patient.open_compliance_events tracks create/resolve of ComplianceEvent rows: 0 -> 1 after the gap sweep, back to 0 after resolve."
        test_recipe:
          setup: ["EVENT episode MONITORING from 2026-05-01; one sweep at +48h creates a TRANSMISSION_GAP event"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Derived Cnt", date_of_birth: "1962-01-01", mrn: "MRN-2004", phone: "555-1005", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Cnt", npi: "2000000004", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2004", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 10 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev_id: "$.data[0].id" } }
          trigger:
            - { call: "GET /v1/patients/${p_id}", as: EnrollmentCoordinator }
            - { call: "POST /v1/compliance-events/${ev_id}/resolve", payload: { resolution_action: "CONTACTED_PATIENT" }, as: EnrollmentCoordinator }
            - { call: "GET /v1/patients/${p_id}", as: EnrollmentCoordinator }
          assert:
            - "First GET: Patient.${p_id}.open_compliance_events == 1"
            - "Second GET (after resolve): Patient.${p_id}.open_compliance_events == 0"

      - name: episode_read_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_EPISODE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent episode id yields 404 ERR_EPISODE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/episodes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 404 ERR_EPISODE_NOT_FOUND"

      - name: report_read_not_found_returns_generic_404
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent report id yields 404 ERR_RESOURCE_NOT_FOUND (generic bucket for non-headline resources)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Physician, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 404 ERR_RESOURCE_NOT_FOUND"

  # ================================================================ state_machines
  - section: state_machines
    instances:
      - name: enrollment_initial_state_and_defaults
        claim_type: initial_state
        grounds: [state_machines.Enrollment]
        distinguishing_aspect: "New enrollment starts INITIATED with education_completed false and attempts_count 0; device RESERVED in the same response cycle."
        test_recipe:
          setup: ["patient, physician, EVENT device, order"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Init State", date_of_birth: "1963-01-01", mrn: "MRN-2005", phone: "555-1006", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Init", npi: "2000000005", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2005", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
          assert:
            - "Enrollment.${e_id}.status == INITIATED and education_completed == false and attempts_count == 0"
            - "Device.${d_id}.status == RESERVED"

      - name: activate_before_education_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Enrollment.transitions, "errors[ERR_EDUCATION_INCOMPLETE]"]
        distinguishing_aspect: "activate from INITIATED (education not completed) yields 422 ERR_EDUCATION_INCOMPLETE."
        test_recipe:
          setup: ["enrollment INITIATED"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "No Edu", date_of_birth: "1964-01-01", mrn: "MRN-2006", phone: "555-1007", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Edu", npi: "2000000006", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2006", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
          trigger:
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 422 ERR_EDUCATION_INCOMPLETE; Enrollment.${e_id}.status stays INITIATED"

      - name: activation_failed_retry_cycle
        claim_type: cyclic_transition
        grounds: [state_machines.Enrollment.EDUCATED_to_ACTIVATION_FAILED, state_machines.Enrollment.ACTIVATION_FAILED_to_INITIATED, state_machines.Device.RESERVED_to_REFURBISHING]
        distinguishing_aspect: "baseline_signal_quality 39 (< 40) fails activation: enrollment ACTIVATION_FAILED with attempts_count 1, device quarantined REFURBISHING with refurbishment_due_at == now+48h; retry with a fresh device loops back to INITIATED and retains education."
        test_recipe:
          setup: ["enrollment EDUCATED with device EV-2007 RESERVED; second EVENT device EV-2008 IN_STOCK"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Retry Loop", date_of_birth: "1965-01-01", mrn: "MRN-2007", phone: "555-1008", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Retry", npi: "2000000007", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2007", model: "EVENT" }, as: InventoryManager, captures: { d1_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2008", model: "EVENT" }, as: InventoryManager, captures: { d2_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d1_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "IN_PERSON" }, as: EnrollmentCoordinator }
          trigger:
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 39 }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/retry", payload: { device_id: "${d2_id}" }, as: EnrollmentCoordinator }
          assert:
            - "After first trigger: Enrollment.${e_id}.status == ACTIVATION_FAILED and attempts_count == 1"
            - "Device.${d1_id}.status == REFURBISHING and refurbishment_due_at == 2026-05-03T09:00:00Z"
            - "After retry: Enrollment.${e_id}.status == INITIATED, education_completed == true, device_id == ${d2_id}"
            - "Device.${d2_id}.status == RESERVED"

      - name: abort_terminal_lockdown_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Enrollment]
        distinguishing_aspect: "Aborting an already-ABORTED enrollment yields 409 ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["enrollment INITIATED, then aborted"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Term Lock", date_of_birth: "1966-01-01", mrn: "MRN-2008", phone: "555-1009", insurance_plan: "SELF_PAY" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Lock", npi: "2000000008", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2009", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/abort", payload: {}, as: EnrollmentCoordinator }
          trigger:
            - { call: "POST /v1/enrollments/${e_id}/abort", payload: {}, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger returns http 409 ERR_INVALID_STATE"

      - name: order_cancel_conditional_cascade
        claim_type: cascade_down
        grounds: [state_machines.MonitoringOrder.OPEN_to_CANCELLED, state_machines.Enrollment, state_machines.Device.RESERVED_to_IN_STOCK]
        distinguishing_aspect: "Cancelling an OPEN order aborts only its non-terminal enrollments and releases their RESERVED devices; cancelling an IN_SERVICE order is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["order O1 with EDUCATED enrollment + RESERVED device D1; order O2 activated (IN_SERVICE) with device D2 for a second patient"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Cascade One", date_of_birth: "1967-01-01", mrn: "MRN-2009", phone: "555-1010", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p1_id: $.data.id } }
            - { call: "POST /v1/patients", payload: { full_name: "Cascade Two", date_of_birth: "1968-01-01", mrn: "MRN-2010", phone: "555-1011", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p2_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Cascade", npi: "2000000009", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2010", model: "EVENT" }, as: InventoryManager, captures: { d1_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2011", model: "EVENT" }, as: InventoryManager, captures: { d2_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p1_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o1_id: $.data.id, o1_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p2_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o2_id: $.data.id, o2_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o1_id}/enrollments", payload: { device_id: "${d1_id}", expected_order_version: "${o1_v}" }, as: EnrollmentCoordinator, captures: { e1_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e1_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/monitoring-orders/${o2_id}/enrollments", payload: { device_id: "${d2_id}", expected_order_version: "${o2_v}" }, as: EnrollmentCoordinator, captures: { e2_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e2_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e2_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o1_id}/cancel", payload: {}, as: Physician, as_user_id: "${dr_id}" }
            - { call: "POST /v1/monitoring-orders/${o2_id}/cancel", payload: {}, as: Physician, as_user_id: "${dr_id}", captures: { err: $.data.error_id } }
          assert:
            - "MonitoringOrder.${o1_id}.status == CANCELLED; Enrollment.${e1_id}.status == ABORTED; Device.${d1_id}.status == IN_STOCK"
            - "Second trigger returns http 409 ERR_INVALID_STATE (IN_SERVICE orders cannot be cancelled; episode must complete first)"

      - name: episode_complete_bubbles_order_fulfilled
        claim_type: bubble_up
        grounds: [state_machines.MonitoringOrder.IN_SERVICE_to_FULFILLED, state_machines.MonitoringEpisode (clinical_status)]
        distinguishing_aspect: "Completing the episode auto-transitions the parent order IN_SERVICE -> FULFILLED in the same request."
        test_recipe:
          setup: ["EVENT episode MONITORING, no OPEN compliance events"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Bubble Up", date_of_birth: "1969-01-01", mrn: "MRN-2011", phone: "555-1012", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Bubble", npi: "2000000011", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2012", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "PHONE" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
          trigger:
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "TERMINATED_EARLY" }, as: EnrollmentCoordinator }
          assert:
            - "MonitoringEpisode.${ep_id}.clinical_status == TERMINATED_EARLY and completed_at == 2026-05-01T00:00:00Z"
            - "MonitoringOrder.${o_id}.status == FULFILLED (bubble-up side effect)"

      - name: alert_close_from_new_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ArrhythmiaAlert]
        distinguishing_aspect: "close is not a listed transition from NEW; yields 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["EVENT episode MONITORING; one ROUTINE alert NEW"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Close New", date_of_birth: "1970-01-01", mrn: "MRN-2012", phone: "555-1013", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Close", npi: "2000000012", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Tech Close", certification_level: "CCT", shift_capacity: 5 }, as: PlatformAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-2013", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
