          assert:
            - "setup: routing_state == \"ROUTED_SPONSOR\", billing_state == \"UNBILLED\" and finding_status == \"RESPONDED\""
            - "trigger response 409 with error_id == \"ERR_CHARGE_NOT_BILLED_TO_PAYER\""
            - "GET /research-billing/audit-findings/${finding_id} still shows status == \"RESPONDED\" and refund_amount_cents == 0"
            - "GET /research-billing/charges?study_id=${study_id} still returns total_count == 1 - no REFUND_REPLACEMENT charge was created - and GET /research-billing/studies/${study_id} reads payer_refunded_cents 0 with open_finding_count 1"
