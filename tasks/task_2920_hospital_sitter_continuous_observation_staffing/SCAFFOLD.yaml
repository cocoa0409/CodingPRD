# =============================================================================
# Task 2920 — Hospital Sitter & Continuous Observation Staffing
# Seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2920. Hospital Sitter & Continuous Observation Staffing (hospital patient safety attendant program): observation order criteria for fall, elopement and self-harm risk with reassessment intervals, sitter assignment, break relief and shift handoff documentation, video monitoring alternative with remote observer span-of-control limits, escalation protocol when a patient attempts to leave or becomes aggressive, staffing pool sourcing across internal float, agency and trained volunteers, cost tracking by unit with discontinuation review, incident review when an event occurs under observation, competency training and de-escalation certification

domain_name: hospital-sitter-observation
api_prefix: /observation

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  secondary_state_machine_shapes:
    - parallel_dimensions   # SitterAssignment.watch_status x SitterAssignment.documentation_status
    - branching             # SafetyEvent REPORTED -> {ESCALATED_RESPONSE, INCIDENT_REVIEW} -> CLOSED
  relationship_patterns:
    - one_to_many
    - self_referential      # HandoffRecord links two SitterAssignment rows (outgoing/incoming)
    - cross_aggregate       # CostEntry references both Unit and SitterAssignment
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Difficulty is carried by four coupled mechanics rather than by table volume:
    (1) two dual-variant calculations on unrelated subjects (money on Unit/CostEntry,
    risk on ObservationOrder/Patient); (2) a span-of-control admission rule whose
    capacity limit is itself derived from the acuity of the feeds already admitted,
    evaluated over overlapping half-open intervals; (3) two cyclic/independent-axis
    state machines whose transitions are guarded by sibling-entity state; and
    (4) a cost ledger that must survive compensating actions with zero drift.
    Endpoint count runs above the Expert band because every foreign key declared in
    §1.1 owes the test layer a reverse-reachability GET (§1.5); the business write
    surface itself is 27 endpoints.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Short nursing-unit code", constraints: "3-12 chars, unique across all Unit rows" }
      - { name: name, type: string, source: input, description: "Human-readable unit name", constraints: "1-120 chars" }
      - { name: video_monitoring_enabled, type: boolean, source: input, default: false, description: "Whether continuous video monitoring is a permitted modality on this unit" }
      - { name: observation_cost_budget_cents, type: integer, source: input, description: "Observation-labor budget ceiling for this unit, in cents", constraints: ">= 0" }
      - { name: observed_cost_to_date_cents, type: integer, source: computed, default: 0, description: "Denormalised ledger head = sum(CostEntry.amount_cents WHERE CostEntry.unit_id == this.id AND CostEntry.status == POSTED); recomputed on every CostEntry post and reversal" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Unit observation posture", constraints: "OPEN | RESTRICTED" }
      - { name: restriction_reason, type: enum, source: system, default: null, description: "Why the unit is RESTRICTED; null while status == OPEN", constraints: "null | BUDGET_THRESHOLD_REACHED | OBSERVATION_ORDER_LAPSED" }
      - { name: open_order_count, type: integer, source: computed, default: 0, description: "= count(ObservationOrder o WHERE o.patient_id IN (Patient p WHERE p.unit_id == this.id) AND o.status IN {ACTIVE, REASSESSMENT_DUE, ESCALATED, DISCONTINUATION_REVIEW})" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the nursing unit the patient physically occupies" }
      - { name: mrn, type: string, source: input, description: "Medical record number", constraints: "4-24 chars, unique across all Patient rows" }
      - { name: full_name, type: string, source: input, description: "Patient name", constraints: "1-120 chars" }
      - { name: age_years, type: integer, source: input, description: "Patient age in whole years; feeds the risk-score age adjustment", constraints: ">= 0 and <= 120" }
      - { name: status, type: enum, source: system, default: ADMITTED, description: "Admission posture", constraints: "ADMITTED | DISCHARGED" }
      - { name: discharged_at, type: datetime, source: system, default: null, description: "Logical-clock instant of discharge; null while ADMITTED" }

  - name: Staff
    parent: null
    common_fields: true
    fields:
      - { name: home_unit_id, type: string, source: input, description: "FK -> Unit.id; the unit this observer is based on; drives the float-authorization rule" }
      - { name: full_name, type: string, source: input, description: "Observer name", constraints: "1-120 chars" }
      - { name: source_pool, type: enum, source: input, description: "Staffing pool this observer is sourced from", constraints: "INTERNAL_FLOAT | AGENCY | VOLUNTEER" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base hourly labor rate in cents before pool multiplier", constraints: ">= 0 and <= 100000" }
      - { name: competency_level, type: enum, source: input, description: "Observation competency tier earned through training", constraints: "NOT_TRAINED | BASIC | ADVANCED" }
      - { name: deescalation_cert_expires_on, type: datetime, source: input, description: "ISO-8601 UTC instant at which the de-escalation certification expires; the cert counts as EXPIRED when clock_now >= this instant" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Duty posture", constraints: "AVAILABLE | ON_ASSIGNMENT | SUSPENDED" }
      - { name: suspension_reason, type: enum, source: system, default: null, description: "Why the observer is SUSPENDED; null otherwise", constraints: "null | INCIDENT_REVIEW_OPENED" }
      - { name: last_shift_end_at, type: datetime, source: computed, default: null, description: "= max(SitterAssignment.shift_end_at WHERE SitterAssignment.staff_id == this.id AND SitterAssignment.watch_status != VOIDED); null when this observer has no non-voided assignment" }
      - { name: total_watch_minutes, type: integer, source: computed, default: 0, description: "= sum of closed watch-segment minutes across all SitterAssignment rows WHERE staff_id == this.id AND watch_status != VOIDED" }

  - name: ObservationOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the patient under continuous observation" }
      - { name: ordering_provider_user_id, type: string, source: input, description: "Opaque X-User-ID of the AttendingProvider who wrote the order; pinned here so the segregation-of-duties rule on discontinuation-decision can compare against it" }
      - { name: risk_categories, type: array, source: input, description: "Observation criteria met by this patient", constraints: "non-empty subset of {FALL, ELOPEMENT, SELF_HARM}, no duplicates" }
      - { name: required_modality, type: enum, source: input, description: "Observation modality in force", constraints: "ONE_TO_ONE_SITTER | VIDEO_MONITORING" }
      - { name: clinical_rationale, type: string, source: input, description: "Free-text ordering rationale", constraints: "1-500 chars" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Order lifecycle state", constraints: "ACTIVE | REASSESSMENT_DUE | ESCALATED | DISCONTINUATION_REVIEW | DISCONTINUED | LAPSED" }
      - { name: elopement_risk_score, type: number, source: computed, description: "Persisted risk score, 1 decimal place, produced by calculations.patient_elopement_risk_score; recomputed only at the four points listed in that calculation's trigger" }
      - { name: risk_score_variant, type: enum, source: computed, description: "Which variant produced the currently persisted elopement_risk_score", constraints: "ADMISSION_BASELINE | ROLLING_EVENT_WEIGHTED" }
      - { name: reassessment_interval_hours, type: integer, source: computed, description: "Produced by calculations.reassessment_interval_hours", constraints: "4 | 8 | 12 | 24" }
      - { name: last_reassessed_at, type: datetime, source: system, description: "Logical-clock instant of order creation, or of the most recent Reassessment" }
      - { name: next_reassessment_due_at, type: datetime, source: computed, description: "= last_reassessed_at + reassessment_interval_hours" }
      - { name: reassessment_count, type: integer, source: computed, default: 0, description: "= count(Reassessment WHERE order_id == this.id)" }
      - { name: coverage_gap_flag, type: boolean, source: system, default: false, description: "Set true when a watch is completed with completion_reason == SHIFT_END_NO_SUCCESSOR while the order is still non-terminal" }
      - { name: discontinuation_recommendation, type: enum, source: system, default: null, description: "Recommendation captured when the discontinuation review is opened", constraints: "null | DISCONTINUE | CONTINUE" }
      - { name: discontinuation_review_opened_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the provider who opened the discontinuation review" }
      - { name: discontinued_at, type: datetime, source: system, default: null, description: "Logical-clock instant the order reached DISCONTINUED" }
      - { name: lapsed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the order reached LAPSED" }

  - name: SitterAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ObservationOrder.id; the order this watch covers" }
      - { name: staff_id, type: string, source: input, description: "FK -> Staff.id; the observer who will keep the watch" }
      - { name: shift_start_at, type: datetime, source: input, description: "Planned watch window start, ISO-8601 UTC instant" }
      - { name: shift_end_at, type: datetime, source: input, description: "Planned watch window end, ISO-8601 UTC instant; the window is half-open [shift_start_at, shift_end_at)", constraints: "> shift_start_at and <= shift_start_at + 12h" }
      - { name: float_authorization_code, type: string, source: input, default: null, description: "Cross-unit float authorization code; required when Staff.home_unit_id != Patient.unit_id" }
      - { name: watch_status, type: enum, source: system, default: SCHEDULED, description: "Watch dimension of this assignment's state; evolves independently of documentation_status", constraints: "SCHEDULED | ON_WATCH | ON_BREAK | COMPLETED | VOIDED" }
      - { name: documentation_status, type: enum, source: system, default: PENDING, description: "Handoff-documentation dimension of this assignment's state; evolves independently of watch_status", constraints: "PENDING | HANDOFF_DRAFTED | HANDOFF_SIGNED | WAIVED" }
      - { name: scheduled_minutes, type: integer, source: computed, description: "= whole minutes between shift_start_at and shift_end_at" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "Produced by calculations.assignment_labor_cost variant `provisional` at creation time" }
      - { name: final_cost_cents, type: integer, source: computed, default: null, description: "Produced by calculations.assignment_labor_cost variant `final` when watch_status reaches COMPLETED; null before that" }
      - { name: watch_segment_count, type: integer, source: computed, default: 0, description: "= count(CostEntry WHERE assignment_id == this.id AND entry_kind == FINAL_SEGMENT AND status == POSTED)" }
      - { name: watched_minutes, type: integer, source: computed, default: 0, description: "= sum(CostEntry.segment_minutes WHERE assignment_id == this.id AND entry_kind == FINAL_SEGMENT AND status == POSTED)" }
      - { name: current_segment_started_at, type: datetime, source: system, default: null, description: "Logical-clock instant the currently open watch segment began; null unless watch_status == ON_WATCH" }
      - { name: break_started_at, type: datetime, source: system, default: null, description: "Logical-clock instant the current break began; null unless watch_status == ON_BREAK" }
      - { name: completion_reason, type: enum, source: system, default: null, description: "Why the watch ended", constraints: "null | HANDOFF_COMPLETE | SHIFT_END_NO_SUCCESSOR | ORDER_DISCONTINUED" }
      - { name: voided_at, type: datetime, source: system, default: null, description: "Logical-clock instant the assignment was voided" }

  - name: MonitoringStation
    parent: null
    common_fields: true
    fields:
      - { name: observer_staff_id, type: string, source: input, description: "FK -> Staff.id; the remote observer who staffs this station" }
      - { name: station_label, type: string, source: input, description: "Console label", constraints: "1-60 chars" }
      - { name: declared_max_span, type: integer, source: input, description: "Nominal span-of-control ceiling declared for this console", constraints: ">= 1 and <= 12" }
      - { name: status, type: enum, source: system, default: IDLE, description: "Console posture", constraints: "IDLE | ACTIVE_MONITORING | OFFLINE" }
      - { name: active_feed_count, type: integer, source: computed, default: 0, description: "= count(VideoFeed WHERE station_id == this.id AND status == ACTIVE)" }
      - { name: active_acuity_weight, type: number, source: computed, default: 0.0, description: "= sum(VideoFeed.acuity_weight WHERE station_id == this.id AND status == ACTIVE), 1 decimal place" }
      - { name: effective_span_limit, type: integer, source: computed, description: "Produced by calculations.station_effective_span_limit from declared_max_span and active_acuity_weight" }
      - { name: offlined_at, type: datetime, source: system, default: null, description: "Logical-clock instant the console went OFFLINE" }

  - name: VideoFeed
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> MonitoringStation.id; the console rendering this feed" }
      - { name: order_id, type: string, source: input, description: "FK -> ObservationOrder.id; the order this feed satisfies" }
      - { name: monitor_start_at, type: datetime, source: input, description: "Planned feed window start, ISO-8601 UTC instant" }
      - { name: monitor_end_at, type: datetime, source: input, description: "Planned feed window end; the window is half-open [monitor_start_at, monitor_end_at)", constraints: "> monitor_start_at" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Feed posture", constraints: "ACTIVE | RELEASED" }
      - { name: acuity_weight, type: number, source: computed, description: "Frozen at creation = sum(FEED_ACUITY_WEIGHTS[c] for c in ObservationOrder.risk_categories) of the referenced order, 1 decimal place" }
      - { name: release_reason, type: enum, source: system, default: null, description: "Why the feed was released", constraints: "null | OBSERVER_RELEASE | MODALITY_FORCED_TO_SITTER | ORDER_TERMINATED" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Logical-clock instant of release" }

  - name: Reassessment
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ObservationOrder.id; the order reassessed" }
      - { name: performed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the AttendingProvider who performed the reassessment" }
      - { name: risk_categories_after, type: array, source: input, description: "Risk categories in force after this reassessment", constraints: "non-empty subset of {FALL, ELOPEMENT, SELF_HARM}, no duplicates" }
      - { name: score_before, type: number, source: system, description: "ObservationOrder.elopement_risk_score immediately before this reassessment, 1 decimal place" }
      - { name: score_after, type: number, source: system, description: "ObservationOrder.elopement_risk_score immediately after this reassessment, 1 decimal place" }
      - { name: interval_hours_after, type: integer, source: system, description: "ObservationOrder.reassessment_interval_hours immediately after this reassessment" }
      - { name: reassessed_at, type: datetime, source: system, description: "Logical-clock instant of the reassessment" }

  - name: HandoffRecord
    parent: null
    common_fields: true
    fields:
      - { name: outgoing_assignment_id, type: string, source: input, description: "FK -> SitterAssignment.id; the watch being handed off" }
      - { name: incoming_assignment_id, type: string, source: input, description: "FK -> SitterAssignment.id; the watch receiving the handoff; must reference the same order_id as the outgoing assignment" }
      - { name: behavior_summary, type: string, source: input, description: "Documented patient behaviour during the outgoing watch", constraints: "1-500 chars" }
      - { name: interventions_used, type: array, source: input, description: "De-escalation interventions applied during the outgoing watch", constraints: "each element in {VERBAL_REDIRECTION, DISTRACTION, FAMILY_PRESENCE, BED_ALARM, NONE}" }
      - { name: countersigned_by_staff_id, type: string, source: system, default: null, description: "Staff.id of the incoming observer who countersigned; null until countersigned" }
      - { name: countersigned_at, type: datetime, source: system, default: null, description: "Logical-clock instant of countersignature" }
      - { name: documentation_state, type: enum, source: system, default: DRAFTED, description: "Handoff document posture", constraints: "DRAFTED | SIGNED" }

  - name: SafetyEvent
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ObservationOrder.id; the order under which the event occurred" }
      - { name: assignment_id, type: string, source: input, default: null, description: "FK -> SitterAssignment.id; the sitter watch in force when the event occurred; null when the event was reported from a video-monitoring console" }
      - { name: event_kind, type: enum, source: input, description: "Category of safety event", constraints: "ELOPEMENT_ATTEMPT | AGGRESSION | FALL_WITH_INJURY | SELF_HARM_ATTEMPT" }
      - { name: narrative, type: string, source: input, description: "Reporter narrative", constraints: "1-1000 chars" }
      - { name: reported_by_staff_id, type: string, source: system, description: "Staff.id taken from the reporting caller's X-User-ID" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "Event workflow state; REPORTED forks to exactly one of the two review branches", constraints: "REPORTED | ESCALATED_RESPONSE | INCIDENT_REVIEW | CLOSED" }
      - { name: response_actions, type: array, source: system, default: null, description: "Actions recorded on the ESCALATED_RESPONSE branch; null on the INCIDENT_REVIEW branch" }
      - { name: review_opened_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the SafetyOfficer who opened the incident review" }
      - { name: review_findings, type: string, source: system, default: null, description: "Findings recorded when an INCIDENT_REVIEW branch event is closed" }
      - { name: closed_by_user_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the SafetyOfficer who closed the event" }
      - { name: resolution, type: enum, source: system, default: null, description: "Closing disposition", constraints: "null | CONTINUE_OBSERVATION | MODALITY_ESCALATED | STAFF_RETRAINING_REQUIRED" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock instant the event was reported; this is the instant the trailing-24h discontinuation window and the rolling risk variant read" }

  - name: CostEntry
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; copied from Patient.unit_id of the assignment's order at post time" }
      - { name: assignment_id, type: string, source: system, description: "FK -> SitterAssignment.id; the watch this entry bills" }
      - { name: entry_kind, type: enum, source: system, description: "PROVISIONAL entries are written at assignment creation; FINAL_SEGMENT entries are written once per closed watch segment", constraints: "PROVISIONAL | FINAL_SEGMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed-positive amount in cents; never mutated after post (reversal flips status, it does not edit the amount)" }
      - { name: status, type: enum, source: system, default: POSTED, description: "Ledger posture", constraints: "POSTED | REVERSED" }
      - { name: source_pool, type: enum, source: system, description: "Staff.source_pool frozen at post time", constraints: "INTERNAL_FLOAT | AGENCY | VOLUNTEER" }
      - { name: segment_index, type: integer, source: system, default: null, description: "1-based watch-segment ordinal for FINAL_SEGMENT entries; null for PROVISIONAL" }
      - { name: segment_minutes, type: integer, source: system, default: null, description: "Whole minutes billed by this FINAL_SEGMENT entry; null for PROVISIONAL" }
      - { name: night_differential_applied, type: boolean, source: system, default: false, description: "True when the night differential multiplied this entry" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant the entry was posted; the cost-close subtotal filters on this field" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the entry was reversed; null while POSTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # CYCLIC: ACTIVE <-> REASSESSMENT_DUE, ACTIVE <-> ESCALATED,
  #         ACTIVE <-> DISCONTINUATION_REVIEW
  # ---------------------------------------------------------------------------
  - entity: ObservationOrder
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED, LAPSED]
    transitions:
      - from: ACTIVE
        to: REASSESSMENT_DUE
        trigger: "POST /observation/_clock/set_current_utc (reassessment sweep run as a side effect of every clock advance)"
        actor: system
        preconditions:
          - "order.status == ACTIVE"
          - "new_clock_now >= order.next_reassessment_due_at (inclusive: equality fires the transition)"
        side_effects:
          - "no field other than status, updated_at and version changes"
          - "increments ObservationOrder.version by 1"
        note: "Sweep processes candidate orders in ascending next_reassessment_due_at, tie-break created_at ASC. At most ONE transition per order per clock call; precedence is (i) the REASSESSMENT_DUE -> LAPSED rule, then (ii) this rule. An ACTIVE order therefore needs two clock calls to reach LAPSED."

      - from: REASSESSMENT_DUE
        to: LAPSED
        trigger: "POST /observation/_clock/set_current_utc (reassessment sweep)"
        actor: system
        preconditions:
          - "order.status == REASSESSMENT_DUE"
          - "new_clock_now >= order.next_reassessment_due_at + REASSESSMENT_GRACE_HOURS (6h), inclusive"
        side_effects:
          - "sets ObservationOrder.lapsed_at = new_clock_now"
          - "CASCADE hop 1: every VideoFeed WHERE order_id == order.id AND status == ACTIVE transitions to RELEASED with release_reason = ORDER_TERMINATED, ordered by VideoFeed.created_at ASC"
          - "CASCADE hop 2: because those feeds left ACTIVE, each affected MonitoringStation recomputes active_feed_count and active_acuity_weight; any station whose active_feed_count reaches 0 transitions ACTIVE_MONITORING -> IDLE"
          - "CASCADE hop 3: because a station became IDLE, its observer Staff transitions ON_ASSIGNMENT -> AVAILABLE"
          - "sets Unit.status = RESTRICTED with restriction_reason = OBSERVATION_ORDER_LAPSED on the Unit referenced by Patient.unit_id of order.patient_id (no-op when the unit is already RESTRICTED)"
          - "increments ObservationOrder.version, and the version of every entity mutated by the hops above, by 1 each"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /observation/orders/{id}/reassessments"
        actor: AttendingProvider
        preconditions:
          - "order.status == ACTIVE (early reassessment before the interval elapses is permitted)"
          - "Patient.status == ADMITTED for order.patient_id"
        side_effects:
          - "creates a Reassessment row with score_before = current elopement_risk_score"
          - "sets ObservationOrder.risk_categories = request.risk_categories_after"
          - "recomputes elopement_risk_score using calculations.patient_elopement_risk_score variant `rolling_event_weighted`; sets risk_score_variant = ROLLING_EVENT_WEIGHTED"
          - "recomputes reassessment_interval_hours from the new score"
          - "sets last_reassessed_at = clock_now and next_reassessment_due_at = clock_now + reassessment_interval_hours"
          - "increments reassessment_count by 1"
          - "increments ObservationOrder.version by 1"

      - from: REASSESSMENT_DUE
        to: ACTIVE
        trigger: "POST /observation/orders/{id}/reassessments"
        actor: AttendingProvider
        preconditions:
          - "order.status == REASSESSMENT_DUE"
          - "Patient.status == ADMITTED for order.patient_id"
        side_effects:
          - "identical side-effect set to the ACTIVE -> ACTIVE reassessment transition"
          - "increments ObservationOrder.version by 1"

      - from: ACTIVE
        to: ESCALATED
        trigger: "POST /observation/safety-events with event_kind IN {ELOPEMENT_ATTEMPT, AGGRESSION}"
        actor: Sitter | RemoteObserver
        preconditions:
          - "order.status IN {ACTIVE, REASSESSMENT_DUE}"
        side_effects:
          - "creates a SafetyEvent row in status REPORTED with occurred_at = clock_now"
          - "ObservationOrder.required_modality is NOT changed by escalation (only the incident-review branch forces the modality)"
          - "increments ObservationOrder.version by 1"

      - from: REASSESSMENT_DUE
        to: ESCALATED
        trigger: "POST /observation/safety-events with event_kind IN {ELOPEMENT_ATTEMPT, AGGRESSION}"
        actor: Sitter | RemoteObserver
        preconditions:
          - "order.status == REASSESSMENT_DUE"
        side_effects:
          - "identical side-effect set to the ACTIVE -> ESCALATED transition; the pending reassessment obligation is preserved (next_reassessment_due_at is untouched)"
          - "increments ObservationOrder.version by 1"

      - from: ESCALATED
        to: ACTIVE
        trigger: "POST /observation/safety-events/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "the SafetyEvent being closed references this order and is in status ESCALATED_RESPONSE or INCIDENT_REVIEW"
          - "no other SafetyEvent WHERE order_id == order.id AND status != CLOSED remains after this close"
        side_effects:
          - "recomputes elopement_risk_score using variant `rolling_event_weighted`; sets risk_score_variant = ROLLING_EVENT_WEIGHTED"
          - "recomputes reassessment_interval_hours and next_reassessment_due_at = last_reassessed_at + reassessment_interval_hours (last_reassessed_at is NOT moved by a close)"
          - "when request.resolution == MODALITY_ESCALATED: sets required_modality = ONE_TO_ONE_SITTER and releases every ACTIVE VideoFeed on the order with release_reason = MODALITY_FORCED_TO_SITTER"
          - "increments ObservationOrder.version by 1"

      - from: ACTIVE
        to: DISCONTINUATION_REVIEW
        trigger: "POST /observation/orders/{id}/discontinuation-review"
        actor: AttendingProvider
        preconditions:
          - "order.status == ACTIVE"
          - "order.reassessment_count >= 1 (an order may not be reviewed for discontinuation before its first reassessment)"
        side_effects:
          - "sets discontinuation_recommendation = request.recommendation"
          - "sets discontinuation_review_opened_by_user_id = caller X-User-ID"
          - "increments ObservationOrder.version by 1"
        note: "Orders in DISCONTINUATION_REVIEW are immune to the clock reassessment sweep (the sweep only considers ACTIVE and REASSESSMENT_DUE)."

      - from: DISCONTINUATION_REVIEW
        to: DISCONTINUED
        trigger: "POST /observation/orders/{id}/discontinuation-decision with decision == APPROVE"
        actor: AttendingProvider
        preconditions:
          - "order.status == DISCONTINUATION_REVIEW"
          - "caller X-User-ID != order.ordering_provider_user_id (segregation of duties)"
          - "count(SafetyEvent WHERE order_id == order.id AND occurred_at >= clock_now - 24h) == 0 (the >= makes an event exactly 24h old still blocking)"
        side_effects:
          - "sets discontinued_at = clock_now"
          - "every SitterAssignment WHERE order_id == order.id AND watch_status == SCHEDULED transitions to VOIDED (ordered by SitterAssignment.created_at ASC)"
          - "every SitterAssignment WHERE order_id == order.id AND watch_status IN {ON_WATCH, ON_BREAK} transitions to COMPLETED with completion_reason = ORDER_DISCONTINUED"
          - "every VideoFeed WHERE order_id == order.id AND status == ACTIVE transitions to RELEASED with release_reason = ORDER_TERMINATED"
          - "increments ObservationOrder.version by 1"

      - from: DISCONTINUATION_REVIEW
        to: ACTIVE
        trigger: "POST /observation/orders/{id}/discontinuation-decision with decision == REJECT"
        actor: AttendingProvider
        preconditions:
          - "order.status == DISCONTINUATION_REVIEW"
          - "caller X-User-ID != order.ordering_provider_user_id (segregation of duties)"
        side_effects:
          - "sets discontinuation_recommendation = null and discontinuation_review_opened_by_user_id = null"
          - "sets last_reassessed_at = clock_now and next_reassessment_due_at = clock_now + reassessment_interval_hours (the rejected review restarts the reassessment interval)"
          - "increments ObservationOrder.version by 1"

      - from: ACTIVE | REASSESSMENT_DUE | ESCALATED | DISCONTINUATION_REVIEW
        to: DISCONTINUED
        trigger: "POST /observation/patients/{id}/discharge"
        actor: NurseManager
        preconditions:
          - "Patient.status == ADMITTED"
        side_effects:
          - "CASCADE hop 1: Patient transitions ADMITTED -> DISCHARGED, and because the patient left ADMITTED every non-terminal ObservationOrder WHERE patient_id == patient.id transitions to DISCONTINUED with discontinued_at = clock_now, ordered by ObservationOrder.created_at ASC"
          - "CASCADE hop 2: because each order became DISCONTINUED, its SitterAssignment rows in watch_status IN {ON_WATCH, ON_BREAK} transition to COMPLETED with completion_reason = ORDER_DISCONTINUED and documentation_status PENDING -> WAIVED, and its rows in watch_status == SCHEDULED transition to VOIDED"
          - "CASCADE hop 3: because those assignments reached COMPLETED, each closes its open watch segment at clock_now, posts a FINAL_SEGMENT CostEntry per calculations.assignment_labor_cost variant `final`, reverses its PROVISIONAL CostEntry, and the Unit ledger head observed_cost_to_date_cents is recomputed; assignments that reached VOIDED reverse their PROVISIONAL CostEntry with no FINAL_SEGMENT posted"
          - "CASCADE hop 4: because the Unit ledger head moved, the Unit re-evaluates the budget threshold and transitions OPEN -> RESTRICTED with restriction_reason = BUDGET_THRESHOLD_REACHED when observed_cost_to_date_cents >= observation_cost_budget_cents"
          - "every ACTIVE VideoFeed on each discontinued order transitions to RELEASED with release_reason = ORDER_TERMINATED"
          - "increments the version of every mutated entity by 1 each"

  # ---------------------------------------------------------------------------
  # INDEPENDENT STATE DIMENSIONS on one SitterAssignment row.
  # Dimension A: watch_status. Dimension B: documentation_status.
  # Neither dimension constrains the other except at the single coupling point
  # documented on the ON_WATCH -> COMPLETED transition.
  # ---------------------------------------------------------------------------
  - entity: SitterAssignment
    state_field: watch_status
    shape: parallel_dimensions
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: ON_WATCH
        trigger: "POST /observation/sitter-assignments/{id}/start-watch"
        actor: Sitter
        preconditions:
          - "assignment.watch_status == SCHEDULED"
          - "ObservationOrder.status IN {ACTIVE, REASSESSMENT_DUE, ESCALATED} for assignment.order_id"
          - "Staff.status == AVAILABLE for assignment.staff_id (cross-entity guard; SitterAssignment creation does NOT check this)"
          - "clock_now >= assignment.shift_start_at - EARLY_START_GRACE_MINUTES (15) AND clock_now < assignment.shift_end_at"
          - "caller X-User-ID == assignment.staff_id"
        side_effects:
          - "sets current_segment_started_at = clock_now"
          - "Staff transitions AVAILABLE -> ON_ASSIGNMENT for assignment.staff_id"
          - "increments SitterAssignment.version and Staff.version by 1 each"

      - from: ON_WATCH
        to: ON_BREAK
        trigger: "POST /observation/sitter-assignments/{id}/break-start"
        actor: Sitter
        preconditions:
          - "assignment.watch_status == ON_WATCH"
          - "whole_minutes(clock_now - current_segment_started_at) >= BREAK_ELIGIBILITY_MINUTES (120)"
          - "caller X-User-ID == assignment.staff_id"
        side_effects:
          - "closes the open watch segment at clock_now and posts one FINAL_SEGMENT CostEntry per calculations.assignment_labor_cost variant `final` with segment_index = watch_segment_count + 1"
          - "Unit.observed_cost_to_date_cents is recomputed from the POSTED CostEntry set"
          - "the Unit re-evaluates the budget threshold and transitions OPEN -> RESTRICTED with restriction_reason = BUDGET_THRESHOLD_REACHED when observed_cost_to_date_cents >= observation_cost_budget_cents"
          - "sets break_started_at = clock_now and current_segment_started_at = null"
          - "increments SitterAssignment.version by 1 (and Unit.version by 1)"

      - from: ON_BREAK
        to: ON_WATCH
        trigger: "POST /observation/sitter-assignments/{id}/break-end"
        actor: Sitter
        preconditions:
          - "assignment.watch_status == ON_BREAK"
          - "whole_minutes(clock_now - break_started_at) >= MIN_BREAK_MINUTES (15)"
          - "caller X-User-ID == assignment.staff_id"
        side_effects:
          - "sets current_segment_started_at = clock_now and break_started_at = null"
          - "no CostEntry is written for the break itself (break minutes are never billed)"
          - "increments SitterAssignment.version by 1"

      - from: ON_WATCH
        to: COMPLETED
        trigger: "POST /observation/sitter-assignments/{id}/complete"
        actor: Sitter
        preconditions:
          - "assignment.watch_status == ON_WATCH"
          - "caller X-User-ID == assignment.staff_id"
          - "COUPLING POINT: when request.completion_reason == HANDOFF_COMPLETE, assignment.documentation_status MUST be HANDOFF_SIGNED; when request.completion_reason == SHIFT_END_NO_SUCCESSOR no documentation_status is required"
        side_effects:
          - "closes the open watch segment at clock_now and posts one FINAL_SEGMENT CostEntry per calculations.assignment_labor_cost variant `final`"
          - "sets the assignment's PROVISIONAL CostEntry to status REVERSED with reversed_at = clock_now"
          - "sets final_cost_cents = sum(CostEntry.amount_cents WHERE assignment_id == this.id AND entry_kind == FINAL_SEGMENT AND status == POSTED)"
          - "sets completion_reason = request.completion_reason"
          - "Unit.observed_cost_to_date_cents is recomputed; the Unit re-evaluates the budget threshold (OPEN -> RESTRICTED when observed_cost_to_date_cents >= observation_cost_budget_cents)"
          - "Staff transitions ON_ASSIGNMENT -> AVAILABLE for assignment.staff_id"
          - "when request.completion_reason == SHIFT_END_NO_SUCCESSOR and ObservationOrder.status is non-terminal, sets ObservationOrder.coverage_gap_flag = true"
          - "increments SitterAssignment.version, Staff.version, Unit.version and (when flagged) ObservationOrder.version by 1 each"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /observation/sitter-assignments/{id}/void"
        actor: NurseManager
        preconditions:
          - "assignment.watch_status == SCHEDULED (a watch that has already started can never be voided)"
        side_effects:
          - "sets voided_at = clock_now"
          - "sets the assignment's PROVISIONAL CostEntry to status REVERSED with reversed_at = clock_now; amount_cents is never edited"
          - "Unit.observed_cost_to_date_cents is recomputed from the POSTED CostEntry set"
          - "Unit.status is NOT changed by a reversal: RESTRICTED is cleared only by POST /observation/units/{id}/cost-close"
          - "increments SitterAssignment.version and Unit.version by 1 each"

      - from: ON_WATCH | ON_BREAK
        to: COMPLETED
        trigger: "system cascade from ObservationOrder -> DISCONTINUED (patient discharge or approved discontinuation)"
        actor: system
        preconditions:
          - "the owning ObservationOrder is transitioning to DISCONTINUED"
        side_effects:
          - "closes any open watch segment at clock_now and posts its FINAL_SEGMENT CostEntry; an assignment in ON_BREAK has no open segment and posts none"
          - "sets completion_reason = ORDER_DISCONTINUED, reverses the PROVISIONAL CostEntry, recomputes final_cost_cents and the Unit ledger head"
          - "sets documentation_status PENDING -> WAIVED (see the documentation dimension)"
          - "Staff transitions ON_ASSIGNMENT -> AVAILABLE"
          - "increments the version of every mutated entity by 1 each"

      - from: SCHEDULED
        to: VOIDED
        trigger: "system cascade from ObservationOrder -> DISCONTINUED"
        actor: system
        preconditions:
          - "the owning ObservationOrder is transitioning to DISCONTINUED"
        side_effects:
          - "identical to the NurseManager void transition, with voided_at = clock_now"
          - "increments SitterAssignment.version and Unit.version by 1 each"

  - entity: SitterAssignment
    state_field: documentation_status
    shape: parallel_dimensions
    initial_state: PENDING
    terminal_states: [HANDOFF_SIGNED, WAIVED]
    transitions:
      - from: PENDING
        to: HANDOFF_DRAFTED
        trigger: "POST /observation/handoffs"
        actor: Sitter
        preconditions:
          - "outgoing assignment.documentation_status == PENDING"
          - "outgoing assignment.watch_status IN {ON_WATCH, ON_BREAK}"
          - "incoming assignment.watch_status == SCHEDULED"
          - "incoming assignment.order_id == outgoing assignment.order_id"
          - "caller X-User-ID == outgoing assignment.staff_id"
        side_effects:
          - "creates a HandoffRecord in documentation_state DRAFTED"
          - "sets outgoing assignment.documentation_status = HANDOFF_DRAFTED; watch_status is untouched"
          - "increments SitterAssignment.version by 1"

      - from: HANDOFF_DRAFTED
        to: HANDOFF_SIGNED
        trigger: "POST /observation/handoffs/{id}/countersign"
        actor: Sitter
        preconditions:
          - "handoff.documentation_state == DRAFTED"
          - "caller X-User-ID == the incoming assignment's staff_id"
          - "the incoming assignment's staff_id != the outgoing assignment's staff_id (segregation of duties on documentation)"
        side_effects:
          - "sets HandoffRecord.documentation_state = SIGNED, countersigned_by_staff_id = caller X-User-ID, countersigned_at = clock_now"
          - "sets outgoing assignment.documentation_status = HANDOFF_SIGNED; watch_status is untouched"
          - "increments HandoffRecord.version and SitterAssignment.version by 1 each"

      - from: PENDING
        to: WAIVED
        trigger: "POST /observation/sitter-assignments/{id}/complete with completion_reason == SHIFT_END_NO_SUCCESSOR, POST /observation/sitter-assignments/{id}/void, or the system cascade from ObservationOrder -> DISCONTINUED"
        actor: Sitter | NurseManager | system
        preconditions:
          - "assignment.documentation_status == PENDING at the moment the watch ends (a documentation_status already in HANDOFF_DRAFTED or HANDOFF_SIGNED is left untouched)"
        side_effects:
          - "handoff documentation is waived because there is no successor watch to hand off to"
          - "increments SitterAssignment.version by 1"
        note: "This is the only transition where the two SitterAssignment dimensions interact in the WAIVED direction; the reverse coupling is the HANDOFF_SIGNED precondition on complete with completion_reason == HANDOFF_COMPLETE."

  # ---------------------------------------------------------------------------
  # CYCLIC: IDLE <-> ACTIVE_MONITORING, with a guarded exit to OFFLINE.
  # ---------------------------------------------------------------------------
  - entity: MonitoringStation
    state_field: status
    shape: cyclic
    initial_state: IDLE
    terminal_states: [OFFLINE]
    transitions:
      - from: IDLE
        to: ACTIVE_MONITORING
        trigger: "POST /observation/video-feeds (admitted feed on this station)"
        actor: system
        preconditions:
          - "station.status == IDLE"
          - "the candidate feed passed the span-of-control admission rule (validations priority 22)"
        side_effects:
          - "recomputes active_feed_count, active_acuity_weight and effective_span_limit"
          - "the observer Staff transitions AVAILABLE -> ON_ASSIGNMENT; a Staff already in ON_ASSIGNMENT stays ON_ASSIGNMENT"
          - "increments MonitoringStation.version and (when it moved) Staff.version by 1 each"

      - from: ACTIVE_MONITORING
        to: IDLE
        trigger: "system, when the station's active_feed_count reaches 0 after any VideoFeed leaves ACTIVE (observer release, modality force, order termination)"
        actor: system
        preconditions:
          - "station.status == ACTIVE_MONITORING"
          - "active_feed_count == 0 after the releasing mutation"
        side_effects:
          - "recomputes active_acuity_weight (0.0) and effective_span_limit (= declared_max_span)"
          - "the observer Staff transitions ON_ASSIGNMENT -> AVAILABLE; a Staff in SUSPENDED stays SUSPENDED"
          - "increments MonitoringStation.version and (when it moved) Staff.version by 1 each"

      - from: IDLE
        to: OFFLINE
        trigger: "POST /observation/monitoring-stations/{id}/offline"
        actor: RemoteObserver
        preconditions:
          - "station.status == IDLE (equivalently active_feed_count == 0) — cross-entity guard on the station's VideoFeed children"
          - "caller X-User-ID == station.observer_staff_id"
        side_effects:
          - "sets offlined_at = clock_now"
          - "increments MonitoringStation.version by 1"
        note: "An attempt from ACTIVE_MONITORING is rejected with ERR_STATION_HAS_ACTIVE_FEEDS; OFFLINE is terminal, so a station cannot be brought back."

  - entity: VideoFeed
    state_field: status
    shape: linear
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /observation/video-feeds/{id}/release"
        actor: RemoteObserver
        preconditions:
          - "feed.status == ACTIVE"
          - "caller X-User-ID == MonitoringStation.observer_staff_id for feed.station_id"
        side_effects:
          - "sets release_reason = OBSERVER_RELEASE and released_at = clock_now"
          - "the owning MonitoringStation recomputes active_feed_count, active_acuity_weight and effective_span_limit; when active_feed_count reaches 0 the station transitions ACTIVE_MONITORING -> IDLE"
          - "increments VideoFeed.version and MonitoringStation.version by 1 each"

      - from: ACTIVE
        to: RELEASED
        trigger: "system cascade (SafetyEvent -> INCIDENT_REVIEW, SafetyEvent close with resolution MODALITY_ESCALATED, ObservationOrder -> DISCONTINUED, ObservationOrder -> LAPSED)"
        actor: system
        preconditions:
          - "feed.status == ACTIVE"
        side_effects:
          - "sets release_reason = MODALITY_FORCED_TO_SITTER for the two modality-forcing triggers, ORDER_TERMINATED for the two order-terminating triggers; released_at = clock_now"
          - "the owning MonitoringStation recomputes its counters and may transition ACTIVE_MONITORING -> IDLE"
          - "increments VideoFeed.version and MonitoringStation.version by 1 each"

  # ---------------------------------------------------------------------------
  # BRANCHING fork-join: REPORTED forks to exactly one review branch by
  # event_kind, and the two branches carry divergent side-effect sets before
  # joining at CLOSED.
  # ---------------------------------------------------------------------------
  - entity: SafetyEvent
    state_field: status
    shape: branching
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ESCALATED_RESPONSE
        trigger: "POST /observation/safety-events/{id}/escalate-response"
        actor: SafetyOfficer
        preconditions:
          - "event.status == REPORTED"
          - "event.event_kind IN {ELOPEMENT_ATTEMPT, AGGRESSION}"
        side_effects:
          - "sets response_actions = request.response_actions"
          - "review_opened_by_user_id stays null on this branch, which is why the close-time segregation-of-duties check is vacuous here"
          - "no ObservationOrder, VideoFeed, MonitoringStation or Staff field is mutated on this branch"
          - "increments SafetyEvent.version by 1"

      - from: REPORTED
        to: INCIDENT_REVIEW
        trigger: "POST /observation/safety-events/{id}/open-incident-review"
        actor: SafetyOfficer
        preconditions:
          - "event.status == REPORTED"
          - "event.event_kind IN {FALL_WITH_INJURY, SELF_HARM_ATTEMPT}"
        side_effects:
          - "sets review_opened_by_user_id = caller X-User-ID"
          - "CASCADE hop 1: sets ObservationOrder.required_modality = ONE_TO_ONE_SITTER on event.order_id (no-op when it is already ONE_TO_ONE_SITTER)"
          - "CASCADE hop 2: because the order's modality left VIDEO_MONITORING, every VideoFeed WHERE order_id == event.order_id AND status == ACTIVE transitions to RELEASED with release_reason = MODALITY_FORCED_TO_SITTER, ordered by VideoFeed.created_at ASC"
          - "CASCADE hop 3: because those feeds left ACTIVE, each affected MonitoringStation recomputes active_feed_count / active_acuity_weight / effective_span_limit, and any station whose active_feed_count reaches 0 transitions ACTIVE_MONITORING -> IDLE"
          - "CASCADE hop 4: because a station became IDLE, its observer Staff transitions ON_ASSIGNMENT -> AVAILABLE"
          - "recomputes ObservationOrder.elopement_risk_score with variant `rolling_event_weighted`, plus reassessment_interval_hours and next_reassessment_due_at = last_reassessed_at + reassessment_interval_hours"
          - "AFTER the four cascade hops: when event.assignment_id != null, the Staff of that assignment transitions to SUSPENDED with suspension_reason = INCIDENT_REVIEW_OPENED — applied last so SUSPENDED wins over any AVAILABLE written by hop 4"
          - "increments the version of every mutated entity by 1 each"

      - from: ESCALATED_RESPONSE | INCIDENT_REVIEW
        to: CLOSED
        trigger: "POST /observation/safety-events/{id}/close"
        actor: SafetyOfficer
        preconditions:
          - "event.status IN {ESCALATED_RESPONSE, INCIDENT_REVIEW}"
          - "caller X-User-ID != event.review_opened_by_user_id (segregation of duties; vacuous on the ESCALATED_RESPONSE branch where that field is null)"
          - "when event.status == INCIDENT_REVIEW, request.review_findings MUST be present and non-empty"
        side_effects:
          - "sets resolution = request.resolution, closed_by_user_id = caller X-User-ID, review_findings = request.review_findings (INCIDENT_REVIEW branch only)"
          - "when the owning ObservationOrder is ESCALATED and no other non-CLOSED SafetyEvent remains on it, the order transitions ESCALATED -> ACTIVE"
          - "recomputes ObservationOrder.elopement_risk_score with variant `rolling_event_weighted`, plus reassessment_interval_hours and next_reassessment_due_at = last_reassessed_at + reassessment_interval_hours"
          - "when request.resolution == MODALITY_ESCALATED: sets ObservationOrder.required_modality = ONE_TO_ONE_SITTER and releases every ACTIVE VideoFeed on the order with release_reason = MODALITY_FORCED_TO_SITTER"
          - "increments the version of every mutated entity by 1 each"

  - entity: Patient
    state_field: status
    shape: linear
    initial_state: ADMITTED
    terminal_states: [DISCHARGED]
    transitions:
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /observation/patients/{id}/discharge"
        actor: NurseManager
        preconditions:
          - "patient.status == ADMITTED"
        side_effects:
          - "sets discharged_at = clock_now"
          - "drives the four-hop cascade documented on ObservationOrder's ACTIVE|REASSESSMENT_DUE|ESCALATED|DISCONTINUATION_REVIEW -> DISCONTINUED transition"
          - "increments Patient.version by 1"

  - entity: Staff
    state_field: status
    shape: cyclic
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_ASSIGNMENT
        trigger: "system, on SitterAssignment SCHEDULED -> ON_WATCH or on MonitoringStation IDLE -> ACTIVE_MONITORING"
        actor: system
        preconditions:
          - "staff.status == AVAILABLE"
        side_effects:
          - "increments Staff.version by 1"

      - from: ON_ASSIGNMENT
        to: AVAILABLE
        trigger: "system, on SitterAssignment ON_WATCH -> COMPLETED or on MonitoringStation ACTIVE_MONITORING -> IDLE"
        actor: system
        preconditions:
          - "staff.status == ON_ASSIGNMENT"
        side_effects:
          - "increments Staff.version by 1"

      - from: AVAILABLE | ON_ASSIGNMENT
        to: SUSPENDED
        trigger: "system, on SafetyEvent REPORTED -> INCIDENT_REVIEW where the event names an assignment_id"
        actor: system
        preconditions:
          - "the event's assignment_id is not null"
        side_effects:
          - "sets suspension_reason = INCIDENT_REVIEW_OPENED"
          - "increments Staff.version by 1"

      - from: SUSPENDED
        to: AVAILABLE
        trigger: "POST /observation/staff/{id}/certifications"
        actor: StaffingCoordinator
        preconditions:
          - "staff.status == SUSPENDED"
          - "request.deescalation_cert_expires_on > clock_now"
        side_effects:
          - "sets suspension_reason = null, competency_level = request.competency_level, deescalation_cert_expires_on = request.deescalation_cert_expires_on"
          - "increments Staff.version by 1"
        note: "Re-certification is the only path out of SUSPENDED, which is how competency training gates reinstatement."

  - entity: Unit
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system, whenever Unit.observed_cost_to_date_cents is recomputed upward by a CostEntry post"
        actor: system
        preconditions:
          - "unit.status == OPEN"
          - "observed_cost_to_date_cents >= observation_cost_budget_cents after the post (inclusive: equality restricts)"
        side_effects:
          - "sets restriction_reason = BUDGET_THRESHOLD_REACHED"
          - "increments Unit.version by 1"

      - from: OPEN
        to: RESTRICTED
        trigger: "system, on ObservationOrder REASSESSMENT_DUE -> LAPSED for a patient on this unit"
        actor: system
        preconditions:
          - "unit.status == OPEN"
        side_effects:
          - "sets restriction_reason = OBSERVATION_ORDER_LAPSED"
          - "increments Unit.version by 1"

      - from: RESTRICTED
        to: OPEN
        trigger: "POST /observation/units/{id}/cost-close"
        actor: StaffingCoordinator
        preconditions:
          - "unit.status == RESTRICTED"
          - "after applying request.budget_increase_cents, observed_cost_to_date_cents < observation_cost_budget_cents AND no ObservationOrder on this unit is in status LAPSED"
        side_effects:
          - "sets observation_cost_budget_cents += request.budget_increase_cents and restriction_reason = null"
          - "increments Unit.version by 1"
        note: "A cost-close call on an OPEN unit performs the charge calculation and the budget increase but makes no status transition."

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: sitter-assignment-create-stale-order
    parent_entity: ObservationOrder
    write_endpoint: "POST /observation/sitter-assignments"
    occ_field: "expected_order_version"
    description: |
      Creating a SitterAssignment against an ObservationOrder whose version has
      advanced since the client last read it is rejected with a stale-version
      error. This is a genuine supersede case rather than a state precondition:
      an order legitimately accepts additional watches (relief shifts, handoff
      successors), so a second create observing the same order state would
      itself succeed under the product semantics. The stale-version check is
      what forces the coordinator to re-read the order — whose required_modality,
      elopement_risk_score and reassessment posture may all have moved — before
      committing labor to it.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: patient_elopement_risk_score
    trigger: "At ObservationOrder creation (POST /observation/orders); at every Reassessment (POST /observation/orders/{id}/reassessments); on SafetyEvent REPORTED -> INCIDENT_REVIEW; on SafetyEvent -> CLOSED. Persisted into ObservationOrder.elopement_risk_score and ObservationOrder.risk_score_variant. No other endpoint recomputes it."
    algorithm: weighted_scoring
    formula: |
      RISK_CATEGORY_WEIGHTS = { FALL: 1.5, ELOPEMENT: 2.5, SELF_HARM: 3.0 }
      base = sum(RISK_CATEGORY_WEIGHTS[c] for c in ObservationOrder.risk_categories)
      age_adjustment = 1.0 if Patient.age_years >= 75 else 0.0     # inclusive at exactly 75
      event_component = <variant-specific, see variants>
      raw = base + age_adjustment + event_component
      elopement_risk_score = round_half_up(min(10.0, raw), 1)      # cap applied BEFORE rounding
    input_set: |
      ObservationOrder.risk_categories of the order being scored, and Patient.age_years
      of ObservationOrder.patient_id. The event component reads SafetyEvent rows
      WHERE order_id == order.id, regardless of each event's own status (a CLOSED
      event still counts) — see the variant table for the two windows.
    constants:
      FALL_WEIGHT: 1.5
      ELOPEMENT_WEIGHT: 2.5
      SELF_HARM_WEIGHT: 3.0
      AGE_ADJUSTMENT_THRESHOLD_YEARS: 75
      AGE_ADJUSTMENT_POINTS: 1.0
      ATTEMPT_EVENT_POINTS: 1.0
      HARM_EVENT_POINTS: 2.0
      ATTEMPT_WINDOW_HOURS: 24
      SCORE_CEILING: 10.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: admission_baseline
        when: "Only at ObservationOrder creation (POST /observation/orders). Sets risk_score_variant = ADMISSION_BASELINE."
        difference: "event_component is fixed at 0.0 — no SafetyEvent row is read at all, even if the patient already has events under an earlier order."
      - name: rolling_event_weighted
        when: "At every Reassessment, and on SafetyEvent INCIDENT_REVIEW open and on SafetyEvent close. Sets risk_score_variant = ROLLING_EVENT_WEIGHTED."
        difference: |
          event_component = ATTEMPT_EVENT_POINTS * count(SafetyEvent WHERE order_id == order.id
                              AND event_kind IN {ELOPEMENT_ATTEMPT, AGGRESSION}
                              AND occurred_at >= clock_now - 24h)          # trailing window, >= is inclusive
                          + HARM_EVENT_POINTS  * count(SafetyEvent WHERE order_id == order.id
                              AND event_kind IN {FALL_WITH_INJURY, SELF_HARM_ATTEMPT})  # all-time, no window
          Identical order data therefore yields a strictly higher score than the
          admission_baseline variant whenever any SafetyEvent exists on the order.

  - name: reassessment_interval_hours
    trigger: "Runs immediately after every patient_elopement_risk_score recomputation, and on ObservationOrder DISCONTINUATION_REVIEW -> ACTIVE (decision REJECT). Persisted into ObservationOrder.reassessment_interval_hours."
    algorithm: threshold
    formula: |
      score = ObservationOrder.elopement_risk_score      # already rounded to 1 dp
      if   score >= 8.0: interval_hours = 4
      elif score >= 6.0: interval_hours = 8
      elif score >= 3.0: interval_hours = 12
      else:              interval_hours = 24
      next_reassessment_due_at = last_reassessed_at + interval_hours
    input_set: "The single persisted elopement_risk_score of the order; no aggregation."
    constants:
      TIER_4H_MIN_SCORE: 8.0
      TIER_8H_MIN_SCORE: 6.0
      TIER_12H_MIN_SCORE: 3.0
      DEFAULT_INTERVAL_HOURS: 24
      REASSESSMENT_GRACE_HOURS: 6
    precision: "integer hours; all three tier comparisons are inclusive (>=), so a score of exactly 6.0 selects the 8-hour tier"

  - name: video_modality_gate
    trigger: "On POST /observation/orders when request.required_modality == VIDEO_MONITORING, and on POST /observation/video-feeds."
    algorithm: threshold
    formula: |
      permitted = (Unit.video_monitoring_enabled == true)
              AND ("SELF_HARM" NOT IN ObservationOrder.risk_categories)
              AND (ObservationOrder.elopement_risk_score < VIDEO_SCORE_CEILING)   # strict <
      # a score of exactly 6.0 is NOT permitted; 5.9 is
    input_set: "The Unit referenced by Patient.unit_id of the order's patient, plus the order's own persisted risk_categories and elopement_risk_score. No SafetyEvent row is read here — the gate reads the persisted score, which is why the score's own recomputation points fully determine this gate's answer."
    constants:
      VIDEO_SCORE_CEILING: 6.0
    precision: "comparison on a 1-decimal-place score; the boundary is strict (score < 6.0 permits, score == 6.0 denies)"

  - name: assignment_labor_cost
    trigger: "Variant `provisional` runs on POST /observation/sitter-assignments and writes SitterAssignment.provisional_cost_cents plus one PROVISIONAL CostEntry. Variant `final` runs on every watch-segment close (break-start, complete, and the ORDER_DISCONTINUED cascade) and writes one FINAL_SEGMENT CostEntry per segment plus SitterAssignment.final_cost_cents at completion."
    algorithm: tiered_pricing
    formula: |
      POOL_MULTIPLIER = { INTERNAL_FLOAT: 1.00, AGENCY: 1.45, VOLUNTEER: 0.00 }
      NIGHT_DIFFERENTIAL = 1.15
      def is_night(instant):   # UTC hour-of-day of the SEGMENT START only
          h = instant.hour
          return h >= 23 or h < 7

      # --- variant `provisional` (one single rounding over the whole window) ---
      scheduled_minutes    = whole_minutes(shift_end_at - shift_start_at)
      provisional_cost_cents = round_half_up(
          Staff.hourly_rate_cents * (scheduled_minutes / 60) * POOL_MULTIPLIER[Staff.source_pool] )
      # no night differential and no break deduction in this variant

      # --- variant `final` (ROUND PER SEGMENT, THEN SUM — pinned order) ---
      for each closed watch segment s, in ascending s.started_at:
          minutes_s = whole_minutes(s.closed_at - s.started_at)
          raw_s     = Staff.hourly_rate_cents * (minutes_s / 60)
                      * POOL_MULTIPLIER[Staff.source_pool]
                      * (NIGHT_DIFFERENTIAL if is_night(s.started_at) else 1.0)
          segment_cost_cents_s = round_half_up(raw_s)          # <-- rounding happens HERE
      final_cost_cents = sum(segment_cost_cents_s over all POSTED FINAL_SEGMENT entries)
      # The alternative reading — sum the raw per-segment amounts and round once at
      # the end — is explicitly NOT the rule and can differ by one or more cents.
    input_set: |
      Staff.hourly_rate_cents and Staff.source_pool frozen at each post time; the
      assignment's own shift window for `provisional`; and for `final` exactly the
      closed watch segments of that assignment (break minutes are never in a
      segment, so they are never billed). CostEntry rows in status REVERSED are
      excluded from final_cost_cents.
    constants:
      POOL_MULTIPLIER_INTERNAL_FLOAT: 1.00
      POOL_MULTIPLIER_AGENCY: 1.45
      POOL_MULTIPLIER_VOLUNTEER: 0.00
      NIGHT_DIFFERENTIAL: 1.15
      NIGHT_START_HOUR_UTC: 23
      NIGHT_END_HOUR_UTC: 7
    precision: "whole cents, round_half_up, applied once per watch segment for `final` and once for the whole window for `provisional`"
    variants:
      - name: provisional
        when: "At SitterAssignment creation, before any watch minute exists."
        difference: "Bills the full scheduled window with no break deduction and no night differential, rounded once. For identical staff and identical realised minutes it produces a different number from `final`."
      - name: final
        when: "At every watch-segment close and at completion."
        difference: "Bills only realised watch minutes, excludes break minutes, applies the night differential per segment, and rounds per segment before summing."

  - name: station_effective_span_limit
    trigger: "Recomputed on every VideoFeed create and every VideoFeed release (observer or cascade). Persisted into MonitoringStation.effective_span_limit and MonitoringStation.active_acuity_weight."
    algorithm: threshold
    formula: |
      FEED_ACUITY_WEIGHTS = { FALL: 1.0, ELOPEMENT: 2.0, SELF_HARM: 3.0 }
      # VideoFeed.acuity_weight is frozen at feed creation:
      acuity_weight = round_half_up(sum(FEED_ACUITY_WEIGHTS[c] for c in order.risk_categories), 1)

      active_acuity_weight = round_half_up(
          sum(VideoFeed.acuity_weight WHERE station_id == station.id AND status == ACTIVE), 1)
      if   active_acuity_weight >= 6.0: penalty = 2
      elif active_acuity_weight >= 4.0: penalty = 1
      else:                             penalty = 0
      effective_span_limit = max(1, MonitoringStation.declared_max_span - penalty)
    input_set: "Only VideoFeed rows on this station in status ACTIVE. RELEASED feeds are excluded, which is what makes the limit recover after a release."
    constants:
      FEED_WEIGHT_FALL: 1.0
      FEED_WEIGHT_ELOPEMENT: 2.0
      FEED_WEIGHT_SELF_HARM: 3.0
      PENALTY_TIER_2_MIN_WEIGHT: 6.0
      PENALTY_TIER_1_MIN_WEIGHT: 4.0
      SPAN_FLOOR: 1
    precision: "active_acuity_weight to 1 decimal place, round_half_up; effective_span_limit is an integer >= 1; both tier comparisons are inclusive (>=)"

  - name: feed_admission_overlap_capacity
    trigger: "On POST /observation/video-feeds, immediately before the feed row is written. Its failure raises ERR_SPAN_OF_CONTROL_EXCEEDED (validations priority 22)."
    algorithm: interval_merge
    formula: |
      # EVALUATION ORDER IS PINNED and deliberately asymmetric:
      #  step 1 — the capacity limit is read from the station's state BEFORE the
      #           candidate is admitted (the candidate's own acuity does not
      #           lower the limit it must satisfy);
      #  step 2 — the occupancy count INCLUDES the candidate.
      limit = MonitoringStation.effective_span_limit           # pre-candidate value
      overlapping = count(VideoFeed f WHERE f.station_id == station.id
                          AND f.status == ACTIVE
                          AND f.monitor_start_at < candidate.monitor_end_at
                          AND candidate.monitor_start_at < f.monitor_end_at)   # half-open [start, end)
      admitted = (overlapping + 1) <= limit
    input_set: |
      ACTIVE VideoFeed rows on the candidate's station only. Intervals are
      half-open [monitor_start_at, monitor_end_at): a feed that ends exactly when
      the candidate starts does NOT overlap. The rule is aggregate-capacity, not
      pairwise: a station may legitimately hold more ACTIVE feeds than its
      effective_span_limit as long as no instant is covered by more than the limit.
    constants:
      CANDIDATE_COUNTS_AS: 1
    precision: "integer counts; the admission comparison is inclusive (overlapping + 1 <= limit admits)"

  - name: unit_daily_observation_charge
    trigger: "On POST /observation/units/{id}/cost-close. Returned in the response body; not persisted on Unit."
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED to break the apparent circularity between the
      # surcharge tier and the total it feeds:
      #   1. subtotal_cents            (pure aggregation, no surcharge)
      #   2. coverage_surcharge_pct    selected from a tier keyed on subtotal_cents ALONE
      #   3. coverage_surcharge_cents  = round_half_up(subtotal_cents * pct)
      #   4. charge_total_cents        = subtotal_cents + coverage_surcharge_cents
      # Reading step 2 as "the tier keyed on charge_total_cents" is the natural but
      # WRONG reading; it is circular and produces a different number whenever the
      # surcharge would push the subtotal across a tier boundary.
      subtotal_cents = sum(CostEntry.amount_cents
                           WHERE CostEntry.unit_id == unit.id
                             AND CostEntry.status == POSTED
                             AND CostEntry.posted_at < request.close_through_utc)   # strict <
      if   subtotal_cents >= 150000: coverage_surcharge_pct = 0.12
      elif subtotal_cents >=  60000: coverage_surcharge_pct = 0.08
      elif subtotal_cents >=  20000: coverage_surcharge_pct = 0.04
      else:                          coverage_surcharge_pct = 0.00
      coverage_surcharge_cents = round_half_up(subtotal_cents * coverage_surcharge_pct)
      charge_total_cents = subtotal_cents + coverage_surcharge_cents
    input_set: |
      CostEntry rows of this unit only, in status POSTED only (REVERSED rows are
      excluded, so a voided assignment leaves no trace in the charge), with
      posted_at strictly before request.close_through_utc. Entries posted exactly
      at close_through_utc are EXCLUDED.
    constants:
      TIER_12_PCT_MIN_SUBTOTAL_CENTS: 150000
      TIER_8_PCT_MIN_SUBTOTAL_CENTS: 60000
      TIER_4_PCT_MIN_SUBTOTAL_CENTS: 20000
      SURCHARGE_PCT_TIER_12: 0.12
      SURCHARGE_PCT_TIER_8: 0.08
      SURCHARGE_PCT_TIER_4: 0.04
    precision: "whole cents, round_half_up, applied once to the surcharge only; the subtotal is an exact integer sum"

  - name: unit_cost_ledger_head
    trigger: "Recomputed on every CostEntry post and every CostEntry reversal (assignment create, break-start, complete, void, and every cascade that posts or reverses). Persisted into Unit.observed_cost_to_date_cents."
    algorithm: aggregation
    formula: |
      Unit.observed_cost_to_date_cents = sum(CostEntry.amount_cents
                                            WHERE CostEntry.unit_id == unit.id
                                              AND CostEntry.status == POSTED)
      # CONSERVED-QUANTITY INVARIANT: for any forward action paired with its
      # compensating action (create assignment / void assignment; post segment /
      # reverse provisional) this identity must hold exactly, with zero drift:
      #   Unit.observed_cost_to_date_cents == sum of POSTED CostEntry.amount_cents
      # A void must therefore return the ledger head to its pre-create value to the cent.
    input_set: "All CostEntry rows of the unit in status POSTED, both PROVISIONAL and FINAL_SEGMENT kinds. Order-independent full recompute — never an incremental delta — so repeated reversals cannot drift."
    constants: {}
    precision: "exact integer cents; no rounding"

  - name: station_span_occupancy_head
    trigger: "Recomputed on every VideoFeed create and release. Persisted into MonitoringStation.active_feed_count."
    algorithm: aggregation
    formula: |
      MonitoringStation.active_feed_count = count(VideoFeed
                                                 WHERE station_id == station.id
                                                   AND status == ACTIVE)
      # CONSERVED-QUANTITY INVARIANT: creating a feed and then releasing that same
      # feed must return both active_feed_count AND effective_span_limit to their
      # exact pre-create values — the span occupancy is conserved across the pair.
    input_set: "All VideoFeed rows on the station in status ACTIVE. Full recompute, never an incremental counter."
    constants: {}
    precision: "exact integer count"

  - name: staff_shift_conflict_check
    trigger: "On POST /observation/sitter-assignments, before any cost is computed. Raises ERR_STAFF_SHIFT_OVERLAP (validations priority 17) or ERR_STAFF_REST_BUFFER_VIOLATION (priority 18)."
    algorithm: interval_merge
    formula: |
      peers = SitterAssignment WHERE staff_id == candidate.staff_id
                                 AND watch_status != VOIDED
      # (1) HALF-OPEN OVERLAP — [shift_start_at, shift_end_at)
      overlap = any(p in peers WHERE p.shift_start_at < candidate.shift_end_at
                                 AND candidate.shift_start_at < p.shift_end_at)
      if overlap: raise ERR_STAFF_SHIFT_OVERLAP
      # (2) REST BUFFER on the non-overlapping gap, evaluated in BOTH directions
      for p in peers:
          gap_minutes = whole_minutes(candidate.shift_start_at - p.shift_end_at) if candidate.shift_start_at >= p.shift_end_at
                        else whole_minutes(p.shift_start_at - candidate.shift_end_at)
          if gap_minutes < MIN_REST_BUFFER_MINUTES: raise ERR_STAFF_REST_BUFFER_VIOLATION
    input_set: "Non-VOIDED SitterAssignment rows of the same staff member, across all orders and all units. VOIDED rows are excluded, so voiding a shift frees both the interval and the rest buffer around it."
    constants:
      MIN_REST_BUFFER_MINUTES: 480
      MAX_SHIFT_MINUTES: 720
    precision: "whole minutes; overlap uses strict < on both sides (touching intervals do not overlap) and the rest-buffer comparison is inclusive (gap of exactly 480 minutes passes)"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (an empty-string header counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles AND is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body shape: every required input field present, every enum value a declared member, integers within their declared ranges, arrays non-empty and duplicate-free where declared, ISO-8601 instants parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-segment resources exist, validated left to right"
    error_id: "ERR_UNIT_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_FEED_NOT_FOUND | ERR_HANDOFF_NOT_FOUND | ERR_SAFETY_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "Body foreign-key references exist, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_UNIT_NOT_FOUND | ERR_PATIENT_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_STATION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /observation/patients, POST /observation/staff, POST /observation/orders, POST /observation/sitter-assignments, POST /observation/monitoring-stations, POST /observation/video-feeds, POST /observation/handoffs, POST /observation/safety-events"

  - priority: 6
    category: auth
    check: "Ownership for entity_backed roles: a Sitter or RemoteObserver X-User-ID must equal the Staff.id the operation belongs to (assignment.staff_id, station.observer_staff_id, or the incoming assignment's staff_id for a countersignature)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /observation/sitter-assignments/{id}/start-watch, break-start, break-end, complete; POST /observation/handoffs; POST /observation/handoffs/{id}/countersign; POST /observation/video-feeds; POST /observation/video-feeds/{id}/release; POST /observation/monitoring-stations/{id}/offline; POST /observation/safety-events"

  - priority: 7
    category: state
    check: "OCC: request.expected_order_version equals the current ObservationOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /observation/sitter-assignments"

  - priority: 8
    category: state
    check: "The target resource is in a state from which this transition is declared in §1.2 (includes terminal lockdown and second-attempt idempotency rejection)"
    error_id: "ERR_INVALID_ORDER_STATE | ERR_INVALID_ASSIGNMENT_STATE | ERR_INVALID_STATION_STATE | ERR_INVALID_FEED_STATE | ERR_INVALID_EVENT_STATE | ERR_INVALID_HANDOFF_STATE | ERR_PATIENT_DISCHARGED"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 9
    category: state
    check: "Start-watch cross-entity guard: Staff.status == AVAILABLE for the assignment's staff"
    error_id: ERR_STAFF_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /observation/sitter-assignments/{id}/start-watch"

  - priority: 10
    category: business_safety
    check: "The staff member's de-escalation certification is unexpired: Staff.deescalation_cert_expires_on > clock_now"
    error_id: ERR_DEESCALATION_CERT_EXPIRED
    http_status: 422
    applies_to: "POST /observation/sitter-assignments, POST /observation/video-feeds"

  - priority: 11
    category: business_safety
    check: "Competency floor: an order whose risk_categories include SELF_HARM requires Staff.competency_level == ADVANCED; any other order requires BASIC or ADVANCED (NOT_TRAINED is never eligible)"
    error_id: ERR_COMPETENCY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /observation/sitter-assignments, POST /observation/video-feeds"

  - priority: 12
    category: business_safety
    check: "The staff member is not SUSPENDED"
    error_id: ERR_STAFF_SUSPENDED
    http_status: 422
    applies_to: "POST /observation/sitter-assignments, POST /observation/video-feeds"

  - priority: 13
    category: business_safety
    check: "Volunteer eligibility: a Staff whose source_pool == VOLUNTEER may not be assigned to an order whose risk_categories include SELF_HARM or ELOPEMENT"
    error_id: ERR_VOLUNTEER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /observation/sitter-assignments"

  - priority: 14
    category: business_safety
    check: "Video modality gate per calculations.video_modality_gate: unit video enabled, SELF_HARM absent, elopement_risk_score < 6.0"
    error_id: ERR_VIDEO_MODALITY_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /observation/orders (when required_modality == VIDEO_MONITORING), POST /observation/video-feeds"

  - priority: 15
    category: business_safety
    check: "Discontinuation safety window: count(SafetyEvent WHERE order_id == order.id AND occurred_at >= clock_now - 24h) == 0"
    error_id: ERR_RECENT_SAFETY_EVENT_BLOCKS_DISCONTINUATION
    http_status: 409
    applies_to: "POST /observation/orders/{id}/discontinuation-decision (decision == APPROVE only)"

  - priority: 16
    category: business_safety
    check: "Segregation of duties: (a) the discontinuation decider's X-User-ID differs from ObservationOrder.ordering_provider_user_id; (b) the safety-event closer's X-User-ID differs from SafetyEvent.review_opened_by_user_id; (c) the handoff countersigner's Staff.id differs from the outgoing assignment's staff_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /observation/orders/{id}/discontinuation-decision, POST /observation/safety-events/{id}/close, POST /observation/handoffs/{id}/countersign"

  - priority: 17
    category: business_temporal
    check: "Half-open shift overlap for the same staff member per calculations.staff_shift_conflict_check step (1)"
    error_id: ERR_STAFF_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /observation/sitter-assignments"

  - priority: 18
    category: business_temporal
    check: "Rest buffer of at least 480 whole minutes between this staff member's non-overlapping shifts, per calculations.staff_shift_conflict_check step (2)"
    error_id: ERR_STAFF_REST_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /observation/sitter-assignments"

  - priority: 19
    category: business_temporal
    check: "Shift window sanity: shift_end_at > shift_start_at and the window is at most MAX_SHIFT_MINUTES (720) whole minutes"
    error_id: ERR_INVALID_SHIFT_WINDOW
    http_status: 422
    applies_to: "POST /observation/sitter-assignments"

  - priority: 20
    category: business_temporal
    check: "Start-watch window: clock_now >= shift_start_at - 15 minutes AND clock_now < shift_end_at"
    error_id: ERR_OUTSIDE_SHIFT_WINDOW
    http_status: 422
    applies_to: "POST /observation/sitter-assignments/{id}/start-watch"

  - priority: 21
    category: business_temporal
    check: "Break eligibility: at least BREAK_ELIGIBILITY_MINUTES (120) whole minutes on the current open watch segment before a break may start; and at least MIN_BREAK_MINUTES (15) whole minutes of break before the watch may resume"
    error_id: "ERR_BREAK_NOT_YET_ELIGIBLE | ERR_BREAK_TOO_SHORT"
    http_status: 422
    applies_to: "POST /observation/sitter-assignments/{id}/break-start, POST /observation/sitter-assignments/{id}/break-end"

  - priority: 22
    category: business_constraint
    check: "Span of control per calculations.feed_admission_overlap_capacity: (overlapping ACTIVE feeds + 1) <= the station's pre-candidate effective_span_limit"
    error_id: ERR_SPAN_OF_CONTROL_EXCEEDED
    http_status: 409
    applies_to: "POST /observation/video-feeds"

  - priority: 23
    category: business_constraint
    check: "A station with ACTIVE feeds may not be taken offline"
    error_id: ERR_STATION_HAS_ACTIVE_FEEDS
    http_status: 409
    applies_to: "POST /observation/monitoring-stations/{id}/offline"

  - priority: 24
    category: business_constraint
    check: "At most one ACTIVE VideoFeed per ObservationOrder"
    error_id: ERR_DUPLICATE_ACTIVE_FEED
    http_status: 409
    applies_to: "POST /observation/video-feeds"

  - priority: 25
    category: business_constraint
    check: "Uniqueness: Unit.unit_code and Patient.mrn are unique across their tables"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /observation/units, POST /observation/patients"

  - priority: 26
    category: business_referential
    check: "Cross-unit float authorization: when Staff.home_unit_id != Patient.unit_id of the order's patient, request.float_authorization_code MUST be present and non-empty"
    error_id: ERR_FLOAT_AUTHORIZATION_MISSING
    http_status: 422
    applies_to: "POST /observation/sitter-assignments"

  - priority: 27
    category: business_referential
    check: "Handoff linkage: the incoming assignment's order_id equals the outgoing assignment's order_id, and the two assignment ids differ"
    error_id: ERR_HANDOFF_ORDER_MISMATCH
    http_status: 422
    applies_to: "POST /observation/handoffs"

  - priority: 28
    category: business_fiscal
    check: "Unit observation budget: Unit.observed_cost_to_date_cents + the candidate assignment's provisional_cost_cents must not exceed Unit.observation_cost_budget_cents (strictly greater than the budget is rejected; equal is accepted)"
    error_id: ERR_UNIT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /observation/sitter-assignments"

  - priority: 29
    category: business_fiscal
    check: "A RESTRICTED unit may not take on new AGENCY-pool labor (INTERNAL_FLOAT and VOLUNTEER remain permitted)"
    error_id: ERR_UNIT_RESTRICTED_AGENCY_BLOCKED
    http_status: 402
    applies_to: "POST /observation/sitter-assignments"

