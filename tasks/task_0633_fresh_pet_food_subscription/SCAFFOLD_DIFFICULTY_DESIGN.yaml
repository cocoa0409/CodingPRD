# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Fresh Pet-Food Subscription — Expert band
# 9 rule_ids x >=2 instances. Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
#
# Canonical fixtures (all literals pre-computed in code against §1.3 formulas):
#  MAIN pet  : DOG, current=ideal=20.0kg, MODERATE, ADULT, MAINTAIN, neutered
#              -> daily_calorie_target = 794
#  Recipe P80: DOG, kcal_per_gram=2.0, price_per_100g_cents=80, regions [US]
#              cad28 -> grams/day 397, total 11116g, disc .10, cycle_price 8004 (free ship)
#              cad14 -> grams/day 397, total 5558g,  disc .05, cycle_price 4224 (paid ship 999)
#  Recipe P70: DOG, kcal_per_gram=2.0, price_per_100g_cents=70, regions [US]
#              cad28 -> cycle_price 7003 (paid ship 999)
#  RESIZE pet: DOG, MODERATE, ADULT, MAINTAIN, neutered, recipe kcal 2.0 price120 cad14;
#              10kg -> dct 472 (g/day 236, cycle 3965); 15kg -> dct 640 (g/day 320, cycle 5107)
#  24kg DOG  : dct 911
#  Referral  : REFERRED_FLAT 2000, REFERRER_FLAT 1500, CAP 9000
#  Default clock: 2026-01-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cycle_price_estimate_vs_actual_snapshot_diverge_on_weight_change
        grounds:
          - calculations.cycle_price
          - entities.Subscription.fields.cycle_price_cents
          - entities.Order.fields.food_subtotal_cents
          - state_machines.Order.SCHEDULED_to_CHARGING
        distinguishing_aspect: |
          The estimate variant (Subscription.cycle_price_cents) recomputes from the pet's live
          daily_calorie_target after a resize, while the actual variant (Order.food_subtotal_cents)
          is frozen on the SCHEDULED order at generation; after a same-cycle resize the two values
          diverge — portion-pricing on the Subscription/Order domain.
        test_recipe:
          setup:
            - "Account + DOG pet (10kg, MODERATE, ADULT, MAINTAIN, neutered) -> dct 472"
            - "PUBLISHED DOG recipe kcal_per_gram 2.0, price_per_100g_cents 120, regions [US]"
            - "ACTIVE subscription cadence 14; one SCHEDULED order generated (food_subtotal frozen 3965)"
            - "Pet then gains weight to 15kg (dct 640); subscription resized immediately"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "dv1@x.com", full_name: "DV One", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Rex", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 10.0, ideal_weight_kg: 10.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Beef", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 120, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}", cadence_days: 14 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v_act: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v_act}" }
              as: BillingAdmin
              captures: { ord1: $.data.id }
            - call: "GET /api/subscriptions/${sub}"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v_pre_resize: $.data.version }
            - call: "POST /api/weight-logs"
              payload: { pet_id: "${pet}", weight_kg: 15.0, effective_date: "2026-01-01T00:00:00Z" }
              as: PetParent
              as_user_id: "${acc}"
          trigger:
            - call: "POST /api/subscriptions/${sub}/resize"
              payload: { expected_subscription_version: "${v_pre_resize}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub_est: $.data.cycle_price_cents }
            - call: "GET /api/orders/${ord1}"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { ord_actual: $.data.food_subtotal_cents }
          assert:
            - "Subscription.${sub}.cycle_price_cents == 5107"   # 15kg: g/day 320, tot 4480, disc .05, round(44.8*114)
            - "Order.${ord1}.food_subtotal_cents == 3965"       # frozen at 10kg snapshot (g/day 236, tot 3304, disc 0)
            - "Subscription.${sub}.cycle_price_cents != Order.${ord1}.food_subtotal_cents"

      - name: referral_credit_amount_vs_cycle_price_different_domains
        grounds:
          - calculations.referral_credit
          - calculations.cycle_price
          - entities.ReferralCredit.fields.amount_cents
          - entities.Subscription.fields.cycle_price_cents
        distinguishing_aspect: |
          referral_credit computes a capped flat grant on the ReferralCredit/Account domain
          (referrer grant = min(1500, cap - lifetime)), a fundamentally different algorithm and
          subject than cycle_price's portion-times-rate pricing on the Subscription domain — two
          dual-variant calcs on different entity domains.
        test_recipe:
          setup:
            - "Referrer R registered organically (lifetime 0)"
            - "Referred F registered with R's referral_code -> two PENDING SIGNUP credits (REFERRED 2000, REFERRER 1500)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "ref-r@x.com", full_name: "R", country_code: "US" }
              as: Anonymous
              captures: { accR: $.data.id, codeR: $.data.referral_code }
            - call: "POST /api/accounts/register"
              payload: { email: "ref-f@x.com", full_name: "F", country_code: "US", referral_code: "${codeR}" }
              as: Anonymous
              captures: { accF: $.data.id }
          trigger:
            - call: "GET /api/referral-credits"
              payload: { referred_account_id: "${accF}", beneficiary: "REFERRER" }
              as: BillingAdmin
              captures: { referrer_amt: "$.data[0].amount_cents" }
            - call: "GET /api/referral-credits"
              payload: { referred_account_id: "${accF}", beneficiary: "REFERRED" }
              as: BillingAdmin
              captures: { referred_amt: "$.data[0].amount_cents" }
          assert:
            - "the REFERRER-beneficiary ReferralCredit row has amount_cents == 1500"
            - "the REFERRED-beneficiary ReferralCredit row has amount_cents == 2000"
            - "both rows have status == PENDING (no order PAID yet)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: daily_calorie_target_nested_multipliers_mode_a
        grounds:
          - calculations.daily_calorie_target
          - entities.Pet.fields.daily_calorie_target
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — RER (weight**0.75) times four selected
          multipliers (neuter x activity x life_stage x goal) with a conditional basis-weight switch
          for LOSE/GAIN; nested, branch-on-state, single final rounding.
        test_recipe:
          setup:
            - "DOG pet, current 20.0kg, ideal 20.0kg, MODERATE, ADULT, MAINTAIN, neutered -> dct 794"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "cal-a@x.com", full_name: "Cal A", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
          assert:
            - "Pet.${pet}.daily_calorie_target == 794"   # round(70*20^.75 * 1.0*1.2*1.0*1.0)
            - "Pet.${pet}.current_weight_kg == 20.0 and life_stage == ADULT"

      - name: cycle_price_rounding_order_mode_b
        grounds:
          - calculations.cycle_price
          - entities.Subscription.fields.pack_grams_per_day
          - entities.Subscription.fields.cycle_price_cents
        distinguishing_aspect: |
          Mode (b): rounding order is load-bearing — grams/day is rounded to whole grams FIRST
          (round_half_up(794/2.0)=397), then multiplied by cadence and scaled by the discounted
          per-100g rate with a single final round; rounding after scaling yields a different cent value.
        test_recipe:
          setup:
            - "MAIN pet dct 794; PUBLISHED DOG recipe kcal 2.0, price_per_100g 80, regions [US]; cadence 28"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "cal-b@x.com", full_name: "Cal B", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
          trigger:
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}", cadence_days: 28 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
          assert:
            - "Subscription.${sub}.pack_grams_per_day == 397"     # round_half_up(794/2.0)
            - "Subscription.${sub}.pack_total_grams == 11116"     # 397*28
            - "Subscription.${sub}.cycle_price_cents == 8004"     # round(111.16 * 80*0.9)

      - name: order_charge_settlement_pinned_order_mode_c
        grounds:
          - calculations.order_charge_settlement
          - calculations.shipping_fee
          - entities.Order.fields.shipping_cents
          - entities.Order.fields.credit_applied_cents
          - state_machines.Order.SCHEDULED_to_CHARGING
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned — shipping is decided from the PRE-credit
          subtotal (step 2) before credit is applied to the gross (step 4); applying credit first
          could push the subtotal below the free-ship threshold and change shipping, so the
          evaluation order is fixed to make the result well-defined.
        test_recipe:
          setup:
            - "MAIN pet dct 794; recipe kcal 2.0 price_per_100g 80 regions [US]; cadence 14"
            - "ACTIVE subscription, one SCHEDULED order (food_subtotal 4224); owning account wallet 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "cal-c@x.com", full_name: "Cal C", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}", cadence_days: 14 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v_act: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v_act}" }
              as: BillingAdmin
              captures: { ord1: $.data.id }
          trigger:
            - call: "POST /api/orders/${ord1}/charge"
              payload: {}
              as: BillingAdmin
              captures: { ship: $.data.shipping_cents, credit: $.data.credit_applied_cents, total: $.data.total_charged_cents }
          assert:
            - "Order.${ord1}.shipping_cents == 999"            # subtotal 4224 < 8000 -> paid, from pre-credit subtotal
            - "Order.${ord1}.credit_applied_cents == 0"        # wallet 0
            - "Order.${ord1}.total_charged_cents == 5223"      # 4224 + 999 - 0

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_active_paused_active_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.pause_until
        distinguishing_aspect: |
          Subscription exhibits a cycle ACTIVE->PAUSED->ACTIVE (revision loop) on the Subscription
          entity, returning to a previously-visited state — not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE subscription for MAIN pet (recipe P80 cad28)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "nl-1@x.com", full_name: "NL1", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
          trigger:
            - call: "POST /api/subscriptions/${sub}/pause"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { st_paused: $.data.status }
            - call: "POST /api/subscriptions/${sub}/resume"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { st_resumed: $.data.status }
          assert:
            - "after pause Subscription.${sub}.status == PAUSED"
            - "after resume Subscription.${sub}.status == ACTIVE"
            - "Subscription.${sub}.pause_until == null after resume"

      - name: order_branching_skip_vs_charge_divergent_side_effects
        grounds:
          - state_machines.Order.SCHEDULED_to_SKIPPED
          - state_machines.Order.SCHEDULED_to_CHARGING
          - state_machines.Order.CHARGING_to_FAILED
          - entities.Order.fields.status
        distinguishing_aspect: |
          Order branches from SCHEDULED into {SKIPPED, CHARGING} with divergent side-effect sets
          (skip advances next_order_date with no charge; charge finalizes settlement and can fork
          again CHARGING->{PAID,FAILED}) — a branching fork on the Order entity, distinct from the
          Subscription cycle above.
        test_recipe:
          setup:
            - "ACTIVE subscription with a SCHEDULED order #1 (MAIN pet, recipe P80 cad28); clock kept before ship date"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "nl-2@x.com", full_name: "NL2", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v_act: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v_act}" }
              as: BillingAdmin
              captures: { ord1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-31T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /api/orders/${ord1}/skip"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { st: $.data.status }
          assert:
            - "Order.${ord1}.status == SKIPPED"   # SKIPPED branch taken; no charge occurred
            - "Order.${ord1}.total_charged_cents == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: declined_charge_to_past_due_to_cancelled_to_skipped_orders_depth3
        grounds:
          - state_machines.Order.CHARGING_to_FAILED
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - state_machines.Subscription.PAST_DUE_to_CANCELLED
          - entities.Subscription.fields.consecutive_failed_charges
          - entities.Order.fields.status
        distinguishing_aspect: |
          Depth-3 chain triggered by a DECLINED settle: Order CHARGING->FAILED causes Subscription
          ACTIVE->PAST_DUE; the same failure that pushes consecutive_failed_charges to MAX_FAILED_CHARGES
          causes Subscription PAST_DUE->CANCELLED; that cancellation in turn cascades a sibling SCHEDULED
          order to SKIPPED. Each hop is caused by the prior hop, not the original settle directly.
        test_recipe:
          setup:
            - "ACTIVE subscription; order #1 declined twice (consecutive_failed_charges 2), retried into CHARGING for attempt 3"
            - "A second SCHEDULED order #2 also exists on the subscription"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "tc-1@x.com", full_name: "TC1", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"], vet_formulated: true }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v1: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v1}" }
              as: BillingAdmin
              captures: { ord1: $.data.id }
            - call: "GET /api/subscriptions/${sub}"
              payload: {}
              as: BillingAdmin
              captures: { v2: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v2}" }
              as: BillingAdmin
              captures: { ord2: $.data.id }
            - call: "POST /api/orders/${ord1}/charge"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/orders/${ord1}/settle-charge"
              payload: { outcome: "DECLINED" }
              as: BillingAdmin
            - call: "POST /api/orders/${ord1}/retry-charge"
              payload: {}
              as: BillingAdmin
            - call: "POST /api/orders/${ord1}/settle-charge"
              payload: { outcome: "DECLINED" }
              as: BillingAdmin
            - call: "POST /api/orders/${ord1}/retry-charge"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /api/orders/${ord1}/settle-charge"
              payload: { outcome: "DECLINED" }
              as: BillingAdmin
          assert:
            - "Subscription.${sub}.consecutive_failed_charges == 3"
            - "Subscription.${sub}.status == CANCELLED"
            - "Order.${ord2}.status == SKIPPED"        # sibling SCHEDULED order forced SKIPPED by the cascade

      - name: paid_first_order_grants_referral_credit_updates_both_accounts_depth2
        grounds:
          - state_machines.Order.CHARGING_to_PAID
          - calculations.referral_credit
          - entities.ReferralCredit.fields.status
          - entities.Account.fields.wallet_credit_cents
          - entities.Account.fields.lifetime_referral_grants_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (CHARGING->PAID): the referred account's first PAID
          order flips its PENDING SIGNUP ReferralCredit rows to GRANTED; that grant in turn mutates
          BOTH the referrer's lifetime_referral_grants_cents and each beneficiary's wallet_credit_cents.
          The wallet/lifetime change is caused by the credit GRANT, not directly by the PAID order.
        test_recipe:
          setup:
            - "Referrer R (lifetime 0) and referred F (registered with R's code; 2 PENDING SIGNUP credits)"
            - "F has an ACTIVE subscription and one SCHEDULED order #1, CHARGING (wallet 0 at charge -> credit 0)"
