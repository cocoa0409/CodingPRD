            - "the first create returns 201 and SpecChangeRequest.${scr1}.status == DRAFT"
            - "ProductSpec.${spec1}.version == 3 after the first create (activation took it to 2)"
            - "the second create returns HTTP 412 with data.error_id == ERR_STALE_SPEC_VERSION"
            - "GET /spec-change-requests?product_spec_id=${spec1} returns total_count 1"
            - "ProductSpec.${spec1}.target_kv100_cst is still 7.600 and revision is still 1"

      - name: occ_stale_customer_version_rejects_second_credit_application
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[takeback-credit-apply-stale-customer]
          - validations[priority=9]
          - errors[ERR_STALE_CUSTOMER_VERSION]
          - endpoints[POST /orders/{id}/apply-takeback-credit]
        distinguishing_aspect: "Drawing credit against a second order is a legitimate operation, so it is refused only because expected_customer_version still names the version observed before the first draw bumped it; the response is HTTP 412 ERR_STALE_CUSTOMER_VERSION and the balance is untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "Customer BRAVO is TIER_B with takeback_agreement_status ACTIVE, credit_limit_cents 5000000 and a takeback_credit_balance_cents of 1357500."
            - "Two CONFIRMED, takeback_linked PACKAGED orders each carry one line of 37 private-label pails, so each has pre_credit_total_cents 400728."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { name: "Bravo Distribution", customer_type: "PRIVATE_LABEL", contract_tier: "TIER_B", credit_limit_cents: 5000000, takeback_agreement_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
              as: ProductManager
              captures: { spec1: $.data.id }
            - call: "POST /product-specs/${spec1}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /package-configurations"
              payload: { product_spec_id: "${spec1}", package_type: "PAIL_20L", label_brand: "Bravo Blue", fill_volume_l: 20.0, private_label: true, customer_id: "${cust1}", claim_codes: [] }
              as: ProductManager
              captures: { cfg_pail: $.data.id }
            - call: "POST /package-configurations/${cfg_pail}/activate"
              payload: {}
              as: ProductManager
            - call: "POST /takeback-collections"
              payload: { customer_id: "${cust1}", scheduled_volume_l: 60000.0 }
              as: SalesRep
              captures: { tb1: $.data.id }
            - call: "POST /takeback-collections/${tb1}/collect"
              payload: { collected_volume_l: 60000.0 }
              as: SalesRep
            - call: "POST /takeback-collections/${tb1}/assay"
              payload: { water_pct: 6.5, sediment_pct: 3.0 }
              as: QCTechnician
            - call: "POST /takeback-collections/${tb1}/credit"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust1}", delivery_mode: "PACKAGED", takeback_linked: true }
              as: SalesRep
              captures: { ord1: $.data.id }
            - call: "POST /orders/${ord1}/lines"
              payload: { package_configuration_id: "${cfg_pail}", quantity_units: 37 }
              as: SalesRep
              captures: { line1: $.data.id }
            - call: "POST /orders/${ord1}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust1}", delivery_mode: "PACKAGED", takeback_linked: true }
              as: SalesRep
              captures: { ord2: $.data.id }
            - call: "POST /orders/${ord2}/lines"
              payload: { package_configuration_id: "${cfg_pail}", quantity_units: 37 }
              as: SalesRep
              captures: { line2: $.data.id }
            - call: "POST /orders/${ord2}/confirm"
              payload: {}
              as: SalesRep
            - call: "GET /customers/${cust1}"
              payload: {}
              as: SalesRep
              captures: { cust1_v: $.data.version }
          trigger:
            - call: "POST /orders/${ord1}/apply-takeback-credit"
              payload: { expected_customer_version: "${cust1_v}" }
              as: SalesRep
            - call: "POST /orders/${ord2}/apply-takeback-credit"
              payload: { expected_customer_version: "${cust1_v}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "the first application succeeds: Order.${ord1}.takeback_credit_applied_cents == 60109 and total_cents == 340619"
            - "Customer.${cust1}.takeback_credit_balance_cents == 1297391 after the first application"
            - "the second application returns HTTP 412 with data.error_id == ERR_STALE_CUSTOMER_VERSION"
            - "Order.${ord2}.takeback_credit_applied_cents == 0 and total_cents == 400728"
            - "Customer.${cust1}.takeback_credit_balance_cents is still 1297391"

      - name: claim_repins_to_the_new_spec_revision_on_resubmit
        claim_type: version_pinning_on_approval
        grounds:
          - entities.ApprovalClaim.fields.pinned_spec_revision
          - state_machines.ApprovalClaim.SUSPENDED_to_SUBMITTED
          - state_machines.SpecChangeRequest.CLEARED_to_EFFECTIVE
        distinguishing_aspect: "A claim pinned to revision 1 is suspended by the spec change and, once a fresh recipe pinned to revision 2 is ACTIVE, re-submits with pinned_spec_revision 2 - the pin follows the spec forward rather than staying at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T06:00:00Z."
            - "ApprovalClaim API / 'API SP' was ACTIVE and pinned to revision 1; a cleared SpecChangeRequest to 7.700 has been made effective, taking the spec to revision 2 and suspending the claim."
            - "A second recipe created after the change is ACTIVE and pinned to revision 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specs"
              payload: { product_code: "LUBE-0W20-SP", sae_grade: "0W-20", target_kv100_cst: 7.600, kv100_tolerance_pct: 3.0, min_additive_treat_pct: 8.00, base_stock_group: "GROUP_II", additive_family: "ZDDP_PCMO" }
