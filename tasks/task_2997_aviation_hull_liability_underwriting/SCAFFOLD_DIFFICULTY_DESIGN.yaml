  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_coverage_half_open_adjacency_allowed
        grounds:
          - validations[priority=28]
          - validations[priority=26]
          - entities.AircraftSchedule.fields.effective_from
          - entities.AircraftSchedule.fields.effective_to
          - endpoints[POST /aviation/schedules]
          - complexity_profile.temporal_semantics
        distinguishing_aspect: |
          The contended resource is a single AIRFRAME and the interval semantics are HALF-OPEN
          [effective_from, effective_to): two schedules whose windows merely touch
          (A.effective_to == B.effective_from) are adjacent, not overlapping, and both are accepted,
          while a window that genuinely straddles the boundary is refused with a 409. The naive
          closed-interval implementation rejects the legitimate adjacent pair, and the naive
          "same aircraft twice" implementation rejects it too.
        test_recipe:
          setup:
            - "Clock at 2026-08-15T00:00:00Z."
            - "One DRAFT FLEET policy, WORLDWIDE, term 2026-09-01 to 2027-09-01, hull_aggregate_limit_cents 900000000 (so the aggregate rule at priority 40 never fires and only the overlap rule can)."
