        distinguishing_aspect: "The QualityManager whose X-User-ID equals the analyst_user_id on a recorded SafetyTest is forbidden from dispositioning that lot (403 ERR_DISPOSITION_FORBIDDEN); a different manager succeeds — segregation of duties keyed on identity, not role."
