scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: flat_vs_transactional_invoice_divergence
        grounds:
          - calculations.invoice_total_calculation
          - entities.Invoice.fields.total_cents
          - entities.SubscriptionPlan.fields.billing_model
        distinguishing_aspect: |
          Two billing-model variants of invoice_total_calculation on the billing/Invoice
          entity domain: identical metered usage (5 SEARCH + 4 DOC_VIEW in the window)
          yields 5906 cents under the FLAT_RATE variant and 1980 cents under the
          TRANSACTIONAL variant. (The citator variant pair lives on the document
          domain, so the two dual-variant instances operate on different entity domains.)
        test_recipe:
          setup:
            - "Flat plan: FLAT_RATE, monthly 5000, included 2 searches / 1 view, overage fees 250/105, 15% volume discount at >= 4 combined overage units; transactional plan: 300 per search, 120 per view, no base"
            - "One subscription per plan (different accounts), one seated user each, logical clock 2026-09-10"
            - "Identical usage on both: 5 SEARCH + 4 DOC_VIEW, all LITIGATION (in scope)"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Flat Small Lit", practice_area: LITIGATION, jurisdiction_scope: NATIONAL, firm_size_tier: SMALL, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 5000, included_searches: 2, included_doc_views: 1, overage_search_fee_cents: 250, overage_doc_view_fee_cents: 105, volume_discount_pct: 0.15, discount_threshold_overage_units: 4}
              as: LicensingManager
              captures: {p_flat: $.data.id}
            - call: "POST /legal-research/plans"
              payload: {name: "Gov Transactional", practice_area: ALL, jurisdiction_scope: FEDERAL, firm_size_tier: SOLO, billing_model: TRANSACTIONAL, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, per_search_fee_cents: 300, per_doc_view_fee_cents: 120}
              as: LicensingManager
              captures: {p_txn: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Flat Firm LLC", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_flat: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Txn Agency", account_type: GOVERNMENT, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_txn: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_flat}", plan_id: "${p_flat}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 2}
              as: LicensingManager
              captures: {s_flat: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_txn}", plan_id: "${p_txn}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 2}
              as: LicensingManager
              captures: {s_txn: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_flat}/seats", payload: {action: ASSIGN, user_email: "f1@flat.com", user_full_name: "Flat One"}, as: FirmAdmin, as_user_id: "${a_flat}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_flat}"}, as: FirmAdmin, as_user_id: "${a_flat}", captures: {u_flat: "$.data[0].id"}}
            - {call: "POST /legal-research/subscriptions/${s_txn}/seats", payload: {action: ASSIGN, user_email: "t1@txn.gov", user_full_name: "Txn One"}, as: FirmAdmin, as_user_id: "${a_txn}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_txn}"}, as: FirmAdmin, as_user_id: "${a_txn}", captures: {u_txn: "$.data[0].id"}}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_flat}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_txn}"}
          trigger:
            - {call: "POST /legal-research/invoices/generate", payload: {subscription_id: "${s_flat}", period_start: "2026-09-01", period_end: "2026-10-01"}, as: BillingAdmin, captures: {inv_flat_id: $.data.id}}
            - {call: "POST /legal-research/invoices/generate", payload: {subscription_id: "${s_txn}", period_start: "2026-09-01", period_end: "2026-10-01"}, as: BillingAdmin, captures: {inv_txn_id: $.data.id}}
          assert:
            - "Invoice.${inv_flat_id}.total_cents == 5906"
            - "Invoice.${inv_flat_id}.base_fee_cents == 5000 and overage_fee_cents == 906 and overage_search_units == 3 and overage_view_units == 3"
            - "Invoice.${inv_txn_id}.total_cents == 1980 and base_fee_cents == 0 and overage_fee_cents == 0"
            - "Invoice.${inv_flat_id}.total_cents != Invoice.${inv_txn_id}.total_cents for identical event counts"

      - name: citator_auto_vs_editorial_override_divergence
        grounds:
          - calculations.citator_signal_derivation
          - concurrency_rules[citator-override-stale-version]
          - entities.PrimaryDocument.fields.citator_signal
        distinguishing_aspect: |
          Two variants of citator_signal_derivation on the PrimaryDocument (content/citator)
          domain: with an identical reference set scoring 100, AUTO_DERIVED yields RED while
          EDITORIAL_OVERRIDE pins YELLOW. Different entity domain from the invoice pair.
        test_recipe:
          setup:
            - "Document B published with no outgoing references; document A published citing B with treatment OVERRULED / depth EXAMINED (weight 100)"
            - "B has no editorial override; logical clock 2026-09-05"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "B v. Base", raw_citation_string: "500 F.3d 100", decision_date: "2026-01-10"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "A v. Cites", raw_citation_string: "501 F.3d 200", decision_date: "2026-02-10"}
              as: ContentIngester
              captures: {doc_a: $.data.id}
            - call: "POST /legal-research/documents/${doc_a}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: OVERRULED, depth: EXAMINED}]}
              as: ContentIngester
            - {call: "GET /legal-research/documents/${doc_b}", as: CitatorAnalyst, captures: {b_v: $.data.version}}
          trigger:
            - {call: "POST /legal-research/documents/${doc_b}/citator-override", payload: {override_signal: YELLOW, rationale: "Editorial analysis: overruling limited to facts", expected_document_version: "${b_v}"}, as: CitatorAnalyst}
          assert:
            - "PrimaryDocument.${doc_b}.citator_score == 100 (score still computed from the reference set)"
            - "PrimaryDocument.${doc_b}.citator_signal == YELLOW (override) while AUTO_DERIVED on the same score would be RED (100 >= 80)"
            - "PrimaryDocument.${doc_b}.editorial_override_signal == YELLOW and version == ${b_v} + 1"

  - rule_id: combinatorial_formula
    instances:
      - name: citator_weighted_matrix_mixed_treatments_score
        grounds:
          - calculations.citator_signal_derivation
          - entities.CitingReference.fields.treatment
          - entities.CitingReference.fields.depth
        distinguishing_aspect: |
          Mode (a) combinatorial formula: the citator score mixes a 6x4 treatment-by-depth
          weight matrix with a negative FOLLOWED weight and dual thresholds (>= 80 RED,
          >= 40 YELLOW). Three references (50 + 15 - 10) net 55 -> YELLOW; removing the
          negative-offset term or changing any single matrix cell changes the band.
          The other combinatorial instance uses mode (b) nested rounding on invoices.
        test_recipe:
          setup:
            - "Document B published; documents A1, A2, A3 each published citing B with QUESTIONED/EXAMINED, DISTINGUISHED/DISCUSSED, FOLLOWED/CITED respectively"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "B v. Matrix", raw_citation_string: "600 U.S. 1", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "A1 v. Q", raw_citation_string: "601 U.S. 11", decision_date: "2026-02-01"}
              as: ContentIngester
              captures: {doc_a1: $.data.id}
            - call: "POST /legal-research/documents/${doc_a1}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: QUESTIONED, depth: EXAMINED}]}
              as: ContentIngester
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "A2 v. D", raw_citation_string: "602 U.S. 22", decision_date: "2026-03-01"}
              as: ContentIngester
              captures: {doc_a2: $.data.id}
            - call: "POST /legal-research/documents/${doc_a2}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: DISTINGUISHED, depth: DISCUSSED}]}
              as: ContentIngester
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "US", document_type: CASE, title: "A3 v. F", raw_citation_string: "603 U.S. 33", decision_date: "2026-04-01"}
              as: ContentIngester
              captures: {doc_a3: $.data.id}
            - call: "POST /legal-research/documents/${doc_a3}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: FOLLOWED, depth: CITED}]}
              as: ContentIngester
          trigger:
            - {call: "GET /legal-research/documents/${doc_b}", as: CitatorAnalyst}
          assert:
            - "PrimaryDocument.${doc_b}.citator_score == 55 (50 + 15 - 10)"
            - "PrimaryDocument.${doc_b}.citator_signal == YELLOW (40 <= 55 < 80)"

      - name: invoice_per_component_rounding_then_sum
        grounds:
          - calculations.invoice_total_calculation
          - entities.Invoice.fields.overage_fee_cents
        distinguishing_aspect: |
          Mode (b) combinatorial formula with pinned nested-rounding order: overage
          components are rounded half-up per component BEFORE summation. 3 overage
          searches @250 + 3 overage views @105 at 15% discount give 638 + 268 = 906;
          the alternative sum-then-round order would give round(1065 * 0.85) = 905.
          Distinct mode from the citator weighted-matrix instance (mode a).
        test_recipe:
          setup:
            - "Flat plan (base 5000, included 2s/1v, overage fees 250/105, 15% discount at >= 4 combined units), one subscription, one seated user, 5 SEARCH + 4 DOC_VIEW in the September window"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Round Plan", practice_area: LITIGATION, jurisdiction_scope: NATIONAL, firm_size_tier: SMALL, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 5000, included_searches: 2, included_doc_views: 1, overage_search_fee_cents: 250, overage_doc_view_fee_cents: 105, volume_discount_pct: 0.15, discount_threshold_overage_units: 4}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Round Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "r1@round.com", user_full_name: "Round One"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_id}"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {u_id: "$.data[0].id"}}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/usage-events", payload: {event_type: DOC_VIEW, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
          trigger:
            - {call: "POST /legal-research/invoices/generate", payload: {subscription_id: "${s_id}", period_start: "2026-09-01", period_end: "2026-10-01"}, as: BillingAdmin, captures: {inv_id: $.data.id}}
          assert:
            - "Invoice.${inv_id}.overage_fee_cents == 906 (per-component rounding 638 + 268), NOT 905 (sum-then-round)"
            - "Invoice.${inv_id}.total_cents == 5906"
            - "Invoice.${inv_id}.overage_search_units == 3 and overage_view_units == 3"

  - rule_id: non_linear_state_machine
    instances:
      - name: headnote_reject_resubmit_cycle
        grounds:
          - state_machines.Headnote.IN_REVIEW_to_DRAFT
          - state_machines.Headnote.DRAFT_to_IN_REVIEW
          - state_machines.Headnote.IN_REVIEW_to_PUBLISHED
        distinguishing_aspect: |
          Headnote's machine is cyclic (DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW ->
          PUBLISHED): a REJECT loops the headnote back to DRAFT and it can be resubmitted
          and later approved. The parallel-dimension instance lives on PrimaryDocument,
          so the two non-linear machines belong to different entities.
        test_recipe:
          setup:
            - "Published public document D; headnote H authored by editor ed-author-1; reviewer ed-reviewer-1 is a different AttorneyEditor"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "NY", document_type: CASE, title: "Cycle v. Loop", raw_citation_string: "10 N.Y.3d 1", decision_date: "2026-05-01"}
              as: ContentIngester
              captures: {doc_d: $.data.id}
            - {call: "POST /legal-research/documents/${doc_d}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents/${doc_d}/headnotes"
              payload: {topic_code: LITIGATION, headnote_text: "Holding text", synopsis_text: "Synopsis text"}
              as: AttorneyEditor
              as_user_id: "ed-author-1"
              captures: {hn_id: $.data.id}
            - {call: "POST /legal-research/headnotes/${hn_id}/submit", payload: {}, as: AttorneyEditor, as_user_id: "ed-author-1"}
            - {call: "POST /legal-research/headnotes/${hn_id}/decide", payload: {decision: REJECT, review_note: "Rework the synopsis"}, as: AttorneyEditor, as_user_id: "ed-reviewer-1"}
          trigger:
            - {call: "POST /legal-research/headnotes/${hn_id}/submit", payload: {}, as: AttorneyEditor, as_user_id: "ed-author-1"}
            - {call: "POST /legal-research/headnotes/${hn_id}/decide", payload: {decision: APPROVE, review_note: "Looks good"}, as: AttorneyEditor, as_user_id: "ed-reviewer-1"}
          assert:
            - "after the first decide(REJECT): Headnote.${hn_id}.status == DRAFT and reviewer_editor_id == \"ed-reviewer-1\""
            - "after resubmit: Headnote.${hn_id}.status == IN_REVIEW (cycle re-entered)"
            - "after the second decide(APPROVE): Headnote.${hn_id}.status == PUBLISHED and review_note == \"Looks good\""

      - name: document_parallel_ingestion_visibility_axes
        grounds:
          - state_machines.PrimaryDocument.RECEIVED_to_PUBLISHED
          - state_machines.PrimaryDocument.PUBLIC_to_SEALED
          - state_machines.PrimaryDocument.SEALED_to_PUBLIC
        distinguishing_aspect: |
          PrimaryDocument carries two independent state dimensions: ingestion
          (RECEIVED -> PUBLISHED) and visibility (PUBLIC -> SEALED -> PUBLIC via
          removal order). A document sealed while still RECEIVED reaches
          (PUBLISHED, SEALED) when later published, proving the axes evolve
          independently; the cyclic instance lives on Headnote.
        test_recipe:
          setup:
            - "Document C created but never published; sealing order S on C effective 2026-09-01..2026-09-30; logical clock 2026-09-15"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-15T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: LEGISLATURE, jurisdiction_code: "US", document_type: STATUTE, title: "Parallel Act", raw_citation_string: "15 U.S.C. 7001", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_c: $.data.id}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_c}", scope: SEAL, effective_from: "2026-09-01", effective_until: "2026-09-30", reason: "Court order 26-991"}
              as: ComplianceOfficer
              captures: {ord_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: APPLIED}, as: ComplianceOfficer}
            - {call: "POST /legal-research/documents/${doc_c}/publish", payload: {references: []}, as: ContentIngester}
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: REVERSED}, as: ComplianceOfficer}
          assert:
            - "after apply: PrimaryDocument.${doc_c} == (ingestion_status RECEIVED, visibility_status SEALED) — sealing does not require publication"
            - "after publish while sealed: == (PUBLISHED, SEALED) — publish moved only the ingestion axis"
            - "after reverse: == (PUBLISHED, PUBLIC) — reverse moved only the visibility axis"

  - rule_id: transitive_cascade
    instances:
      - name: removal_apply_depth3_citator_collapse
        grounds:
          - state_machines.PrimaryDocument.PUBLIC_to_SEALED
          - state_machines.CitingReference.ACTIVE_to_INACTIVE
          - calculations.citator_signal_derivation
          - state_machines.Headnote.PUBLISHED_to_RETRACTED
        distinguishing_aspect: |
          Depth-3 chain from the order-apply trigger: RemovalOrder APPLIED mutates
          document A (visibility SEALED); A's sealing flips its outgoing reference
          A->B to INACTIVE; that deactivation recomputes B's citator_score/signal
          (RED 100 -> GREEN 0). A's PUBLISHED headnote retracts as a parallel
          fan-out branch. The other cascade originates from the invoice-VOID trigger.
        test_recipe:
          setup:
            - "B published; A published citing B OVERRULED/EXAMINED (B: score 100, RED); A carries a PUBLISHED headnote"
            - "SEAL order on A, window 2026-09-01..2026-09-30; clock 2026-09-15"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "B v. Cited", raw_citation_string: "700 F.3d 10", decision_date: "2026-01-10"}
              as: ContentIngester
              captures: {doc_b: $.data.id}
            - {call: "POST /legal-research/documents/${doc_b}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "A v. Sealed", raw_citation_string: "701 F.3d 20", decision_date: "2026-02-10"}
              as: ContentIngester
              captures: {doc_a: $.data.id}
            - call: "POST /legal-research/documents/${doc_a}/publish"
              payload: {references: [{cited_document_id: "${doc_b}", treatment: OVERRULED, depth: EXAMINED}]}
              as: ContentIngester
            - call: "POST /legal-research/documents/${doc_a}/headnotes"
              payload: {topic_code: LITIGATION, headnote_text: "A headnote", synopsis_text: "A synopsis"}
              as: AttorneyEditor
              as_user_id: "ed-author-1"
              captures: {hn_id: $.data.id}
            - {call: "POST /legal-research/headnotes/${hn_id}/submit", payload: {}, as: AttorneyEditor, as_user_id: "ed-author-1"}
            - {call: "POST /legal-research/headnotes/${hn_id}/decide", payload: {decision: APPROVE, review_note: "ok"}, as: AttorneyEditor, as_user_id: "ed-reviewer-1"}
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-15T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/removal-orders"
              payload: {document_id: "${doc_a}", scope: SEAL, effective_from: "2026-09-01", effective_until: "2026-09-30", reason: "Seal order"}
              as: ComplianceOfficer
              captures: {ord_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/removal-orders/${ord_id}/transition", payload: {target_status: APPLIED}, as: ComplianceOfficer}
          assert:
            - "PrimaryDocument.${doc_a}.visibility_status == SEALED (link 1)"
            - "CitingReference(A -> B).status == INACTIVE and deactivated_by_order_id == ${ord_id} (link 2, via GET /legal-research/documents/${doc_a}/citing-references direction=FROM)"
            - "PrimaryDocument.${doc_b}.citator_score == 0 and citator_signal == GREEN (link 3: the deactivation, not the order, caused the recompute)"
            - "Headnote.${hn_id}.status == RETRACTED (fan-out branch of link 1)"

      - name: invoice_void_depth2_auto_resume
        grounds:
          - state_machines.Invoice.OVERDUE_to_VOID
          - state_machines.Subscription.SUSPENDED_to_ACTIVE
          - state_machines.Invoice.ISSUED_to_OVERDUE
        distinguishing_aspect: |
          Depth-2 chain from the invoice-transition trigger (different trigger from the
          removal-order cascade): VOIDing the only OVERDUE invoice removes its balance
          contribution (link 1), and that balance change flips the subscription from
          SUSPENDED (INVOICE_OVERDUE) back to ACTIVE (link 2) with no direct
          subscription call.
        test_recipe:
          setup:
            - "Flat-plan subscription with one seated user and 1 SEARCH event on 2026-09-10; invoice for September generated and ISSUED on 2026-09-10 (due 2026-10-10)"
            - "Clock advanced to 2026-10-11: the invoice materializes OVERDUE and the subscription is auto-suspended with suspension_reason INVOICE_OVERDUE"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Void Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 5000, included_searches: 2, included_doc_views: 1, overage_search_fee_cents: 250, overage_doc_view_fee_cents: 105, volume_discount_pct: 0.15, discount_threshold_overage_units: 4}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Void Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "v1@void.com", user_full_name: "Void One"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "GET /legal-research/users", payload: {account_id: "${a_id}"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {u_id: "$.data[0].id"}}
            - {call: "POST /legal-research/usage-events", payload: {event_type: SEARCH, practice_area_tag: LITIGATION}, as: Researcher, as_user_id: "${u_id}"}
            - {call: "POST /legal-research/invoices/generate", payload: {subscription_id: "${s_id}", period_start: "2026-09-01", period_end: "2026-10-01"}, as: BillingAdmin, captures: {inv_id: $.data.id}}
            - {call: "POST /legal-research/invoices/${inv_id}/transition", payload: {target_status: ISSUED}, as: BillingAdmin}
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-10-11T00:00:00Z"}, as: PlatformAdmin}
            - {call: "GET /legal-research/invoices/${inv_id}", as: BillingAdmin}
          trigger:
            - {call: "POST /legal-research/invoices/${inv_id}/transition", payload: {target_status: VOID}, as: BillingAdmin}
          assert:
            - "before VOID: Invoice.${inv_id}.status == OVERDUE and Subscription.${s_id}.status == SUSPENDED with suspension_reason == INVOICE_OVERDUE (lazy materialization cascade)"
            - "after VOID: Invoice.${inv_id}.status == VOID (link 1)"
            - "after VOID: Subscription.${s_id}.status == ACTIVE and suspension_reason == null (link 2, no direct subscription call was made)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: seat_assign_state_precedes_fiscal
        grounds:
          - validations[priority=21]
          - validations[priority=38]
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
          - errors[ERR_NO_SEATS_AVAILABLE]
        distinguishing_aspect: |
          Category pair state (p21) vs business_fiscal (p38): the seat ASSIGN request
          violates BOTH (subscription SUSPENDED and seats_used == seats_total == 1);
          the state error ERR_SUBSCRIPTION_NOT_ACTIVE must win because state (p21)
          outranks fiscal (p38). The other conflict instance uses the pair
          state vs business_safety.
        test_recipe:
          setup:
            - "Subscription with seats_total 1 on an ACTIVE flat plan; user A assigned (seat pool now full); subscription then SUSPENDED manually"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Prio Plan", practice_area: LITIGATION, jurisdiction_scope: STATE, firm_size_tier: SOLO, billing_model: FLAT_RATE, scope_enforcement: SOFT, government_only: false, cost_recovery_allowed: false, monthly_fee_cents: 1000, included_searches: 5, included_doc_views: 5, overage_search_fee_cents: 100, overage_doc_view_fee_cents: 100, volume_discount_pct: 0.1, discount_threshold_overage_units: 10}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Prio Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_id: $.data.id}
            - call: "POST /legal-research/subscriptions"
              payload: {account_id: "${a_id}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}
              as: LicensingManager
              captures: {s_id: $.data.id}
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "a@prio.com", user_full_name: "User A"}, as: FirmAdmin, as_user_id: "${a_id}"}
            - {call: "POST /legal-research/subscriptions/${s_id}/status", payload: {target_status: SUSPENDED}, as: LicensingManager}
          trigger:
            - {call: "POST /legal-research/subscriptions/${s_id}/seats", payload: {action: ASSIGN, user_email: "b@prio.com", user_full_name: "User B"}, as: FirmAdmin, as_user_id: "${a_id}", captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_SUBSCRIPTION_NOT_ACTIVE (state, p21), NOT ERR_NO_SEATS_AVAILABLE (business_fiscal, p38), although both conditions hold"

      - name: decide_state_precedes_safety
        grounds:
          - validations[priority=18]
          - validations[priority=26]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REVIEWER_IS_AUTHOR]
        distinguishing_aspect: |
          Category pair state (p18) vs business_safety (p26): the author attempts
          decide(APPROVE) on a DRAFT headnote, violating both the from-state gate
          (must be IN_REVIEW) and segregation of duties; ERR_INVALID_STATE must win.
          Different error-category pair from the seat instance (state vs fiscal).
        test_recipe:
          setup:
            - "Published public document; headnote H authored by ed-author-1 and left in DRAFT (never submitted)"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "TX", document_type: CASE, title: "Prio v. Pair", raw_citation_string: "800 S.W.3d 1", decision_date: "2026-03-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
            - {call: "POST /legal-research/documents/${doc_id}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents/${doc_id}/headnotes"
              payload: {topic_code: CORPORATE, headnote_text: "H", synopsis_text: "S"}
              as: AttorneyEditor
              as_user_id: "ed-author-1"
              captures: {hn_id: $.data.id}
          trigger:
            - {call: "POST /legal-research/headnotes/${hn_id}/decide", payload: {decision: APPROVE, review_note: "self approve"}, as: AttorneyEditor, as_user_id: "ed-author-1", captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_INVALID_STATE (state, p18: from-state DRAFT), NOT ERR_REVIEWER_IS_AUTHOR (business_safety, p26), although the actor IS the author"
            - "Headnote.${hn_id}.status remains DRAFT"

  - rule_id: boundary_precision_check
    instances:
      - name: overage_units_at_exactly_included_quota
        grounds:
          - calculations.invoice_total_calculation
          - entities.Invoice.fields.overage_search_units
          - validations[priority=38]
        distinguishing_aspect: |
          Numeric-threshold boundary on the overage metric via POST invoices/generate:
          at exactly included quota (2 SEARCH, 1 DOC_VIEW) the overage is 0 and the
          invoice is the bare 5000-cent base; ONE additional search (3rd) flips
          overage_search_units to 1 and adds exactly 250 cents (discount NOT applied:
          1 combined unit < threshold 4). The empty-set boundary instance sits on a
          different metric (citation reference set) and different endpoint.
        test_recipe:
          setup:
            - "Flat plan (base 5000, included 2s/1v, fees 250/105, 15% at >= 4 units); two accounts/subscriptions/users; clock 2026-09-10"
            - "Subscription A usage: exactly 2 SEARCH + 1 DOC_VIEW; subscription B usage: exactly 3 SEARCH + 1 DOC_VIEW"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-10T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
