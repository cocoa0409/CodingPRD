          - errors.ERR_STALE_CREDIT_LINE_VERSION
        distinguishing_aspect: "Two REQUESTED advances on the same line: funding the first bumps CreditLine.version, so funding the second with the version read before that write is a genuine stale-capacity view and returns 412 while every row stays untouched."
