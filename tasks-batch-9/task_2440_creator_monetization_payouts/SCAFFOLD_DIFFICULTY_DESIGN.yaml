          assert:
            - "${seed_fee} == 250 and ${seed_amount} == 1000000 (CHECK tier T3 fee waterfall)"
            - "Creator.${cr_id}.lifetime_paid_cents == 1000000 (exactly on the inclusive lower bound of the +400 bps tier bucket)"
            - "${ev_share_bps} == 5400 (min(8800+400, 9000) == 9000, then floor(9000*6000/10000))"
            - "${ev_share_bps} != 5520 (the value produced by multiplying before capping: floor(9200*6000/10000))"
            - "${ev_share} == 666 (ROUND_HALF_UP(1234*5400/10000) == ROUND_HALF_UP(666.36))"
            - "${ev_share} != 681 (ROUND_HALF_UP(1234*5520/10000) == ROUND_HALF_UP(681.168), the wrong-order answer)"
            - "RevenueEvent.${ev_id}.status == ACCRUED (666 >= min_payable_cents 0)"
