              as_user_id: "${cust}"
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "B" }
              as: Customer
              as_user_id: "${cust}"
              captures: { projB: $.data.id }
            - call: "POST /projects/${projB}/photos"
