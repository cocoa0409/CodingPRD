      - name: crossing_risk_ceiling_45_accepted_46_rejected
        grounds:
          - "calculations.crossing_risk_score"
          - "validations[priority=66]"
          - "entities.ServiceZone.fields.max_crossing_risk"
          - "state_machines.SidewalkSegment.SURVEYED_to_APPROVED"
        distinguishing_aspect: >-
          The metric is the one-decimal crossing_risk_score and the endpoint is
          POST /sidewalk-segments/{segment_id}/transitions with action APPROVE: a MIDBLOCK crossing
          scoring exactly 45.0 against max_crossing_risk 45.0 is approved because the gate rejects only
          scores strictly above the ceiling, while the same crossing with pedestrian_flow_per_min 15.5
          scores 45.7 and is rejected.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PROVISIONED with max_crossing_risk at its default 45.0 and ordinance_min_clearance_cm 90.0"
            - "segment S7 CROSSING MIDBLOCK, sightline_m 20.0 (tier 8), pedestrian_flow_per_min 15.0 (term 21.0), surface_grade_pct 3.0 (hinge 0), curb_ramp_present true (credit -6), measured_clearance_cm 98.0, so crossing_risk_score is exactly 45.0"
            - "segment S8 identical except pedestrian_flow_per_min 15.5 (term 21.7), so crossing_risk_score is 45.7"
            - "both segments are SURVEYED and their clearance satisfies safety rule 69"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
