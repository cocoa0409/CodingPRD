              as: Analyst
              as_user_id: "${ana}"
              captures: { veh: $.data.id }
            - call: "POST /fof/managers/${mgr}/vehicles/${veh}/begin-diligence"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
            - call: "GET /fof/vehicles/${veh}/dd-reviews"
