            - "Bookings 1 and 2 return 201 (booked_count reaches exactly room_capacity 2 — equality is the last legal state)"
            - "Booking 3 fails: captured error_id == ERR_TEST_SESSION_FULL (HTTP 409)"
            - "GET /admissions/test-sessions/${tss}: booked_count == 2 (the rejected booking did not consume capacity)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_blocked_until_award_accepted
        grounds:
          - state_machines.Application.OFFERED_to_CONTRACT_ISSUED
          - errors[ERR_AID_NOT_FINALIZED]
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair Application x AidApplication: issue-contract's valid transition
          set on the application depends on the linked aid application's award_status —
          OFFERED award blocks (ERR_AID_NOT_FINALIZED), ACCEPTED award unblocks. Distinct
          pair from the evaluation-instance's EntranceEvaluation x Application.
        test_recipe:
          setup:
            - "fam-a EARLY application OFFERED after close (composite 84.0, capacity 1); aid finalized OFFERED at 1,820,000 (verified 12,000,000 hh4) but NOT yet accepted"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
