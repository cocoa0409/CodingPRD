# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3329_smart_apartment_access_hardware_deployment_vacant_unit
# 9 rules × 2 instances = 18 instances. Each grounds in SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: maintenance_accrual_provisional_vs_final
        grounds:
          - calculations.maintenance_budget_accrual_cents
          - calculations.maintenance_budget_accrual_cents.variants.provisional
          - calculations.maintenance_budget_accrual_cents.variants.final
          - entities.Property.fields.budget_committed_cents
          - state_machines.MaintenanceVisit.transitions.NOTICE_CERTIFIED_to_COMPLETED
          - validations[priority=20]
        distinguishing_aspect: "The SAME MaintenanceVisit accrues 4100 cents provisionally at certify_notice (ceil(planned_hours)=3) but only 3400 cents finally at complete (ceil(actual_hours)=2), so the Property budget committed by the visit drops by exactly 700 when the visit finalises."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with temp_budget_cents_per_day=500000 and unit_capacity=1."
            - "Unit U of P is VACANT; a non-emergency MaintenanceVisit V is requested for U with plan start 2026-09-03T10:00:00Z and end 2026-09-03T12:30:00Z (planned_hours=2.5)."
            - "V has been notice-certified, so it sits in NOTICE_CERTIFIED with accrued_cost_cents=4100 and P.budget_committed_cents=4100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Cedar Park", address_line: "1 Cedar Way", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_p: $.data.id, prop_p_v: $.data.version }
            - call: "POST /properties/${prop_p}/units"
              payload: { unit_number: "U-2C" }
              as: PropertyManager
              captures: { unit_u: $.data.id }
            - call: "POST /units/${unit_u}/maintenance-visits"
              payload: { technician_id: "tech-marcus", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T12:30:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_v: $.data.id }
            - call: "POST /maintenance-visits/${visit_v}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
              captures: { visit_v_v: $.data.version }
          trigger:
            - call: "POST /maintenance-visits/${visit_v}/complete"
              payload: { actual_hours: 1.5 }
              as: MaintenanceTechnician
          assert:
            - "MaintenanceVisit.${visit_v}.status == COMPLETED"
            - "MaintenanceVisit.${visit_v}.accrued_cost_cents == 3400 (final variant: 2000 + ceil(1.5)*700)"
            - "Property.${prop_p}.budget_committed_cents == 3400 (the provisional 4100 was replaced, not added)"
            - "the certify_notice response had already reported accrued_cost_cents == 4100 (2000 + ceil(2.5)*700)"

      - name: setpoint_comfort_variant_vs_dehumidification_override
        grounds:
          - calculations.vacant_unit_setpoint_c
          - calculations.vacant_unit_setpoint_c.variants.base
          - calculations.vacant_unit_setpoint_c.variants.humid_stress
          - entities.Unit.fields.target_setpoint_c
          - state_machines.Unit.transitions.NOTICE_ENDED_to_VACANT
        distinguishing_aspect: "For a hot forecast (>=27C) the base variant clamps the setpoint up to 27.0C, but the humid-stress variant for the same forecast returns 24.0C — the two variants diverge by 3.0C on identical forecast input, keyed only on relative_humidity_pct crossing 60."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with one unit U (VACANT, target_setpoint_c=26.0)."
            - "U has no living resident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Humidity Hall", address_line: "9 Marsh Ln", unit_capacity: 4, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_h: $.data.id }
            - call: "POST /properties/${prop_h}/units"
              payload: { unit_number: "U-101" }
              as: PropertyManager
              captures: { unit_hu: $.data.id }
          trigger:
            - call: "POST /units/${unit_hu}/vacant-automation"
              payload: { window_forecast_c: 33, relative_humidity_pct: 70 }
              as: PropertyManager
          assert:
            - "the trigger response Unit.${unit_hu}.target_setpoint_c == 24.0 (humid_stress variant)"
            - "re-running with window_forecast_c: 33, relative_humidity_pct: 45 yields target_setpoint_c == 27.0 (base variant)"
            - "the divergence between the two variants for the same 33C forecast is exactly 3.0C"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: battery_health_nested_rounding_order
        grounds:
          - calculations.device_battery_health_score
          - entities.Device.fields.battery_pct
          - entities.DeviceAlert.fields.status
          - endpoints.POST_/buildings/{buildingId}/device-scans
        distinguishing_aspect: "Combinatorial mode (b): the health score rounds EACH weighted term to 1dp before summing; a device with battery_pct=87, firmware=OLD and 1 open alert scores 68.6 under the pinned per-term-round order, which differs from the 68.7 a sum-then-round order would give."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B (FIELD_MESH, wifi_rssi_dbm=-60) in property P; one unit U in B."
            - "Device D in U has device_type=SMART_LOCK, firmware_version=OLD, battery_pct=87."
            - "D is UNREACHABLE and carries one OPEN OFFLINE DeviceAlert, so open_alert_count=1 and firmware_score=40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Rounding Ridge", address_line: "3 Sum St", unit_capacity: 2, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_r: $.data.id }
            - call: "POST /properties/${prop_r}/buildings"
              payload: { name: "B-1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_b: $.data.id }
            - call: "POST /properties/${prop_r}/units"
              payload: { unit_number: "U-R1", building_id: "${bld_b}" }
              as: PropertyManager
              captures: { unit_r: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_r}", building_id: "${bld_b}", firmware_version: "OLD", battery_pct: 87 }
              as: HardwareTechnician
              captures: { dev_d: $.data.id }
            - call: "POST /buildings/${bld_b}/device-scans"
              payload: { reachable_device_ids: [] }
              as: HardwareTechnician
              captures: { alert_cnt: "$.data[0].id" }
          trigger:
            - call: "POST /buildings/${bld_b}/device-scans"
              payload: { reachable_device_ids: [] }
              as: HardwareTechnician
              captures: { alert_now: "$.data[0].id" }
          assert:
            - "Device.${dev_d}.status == UNREACHABLE"
            - "device_battery_health_score for Device.${dev_d} == 68.6 (0.5*87=43.5, 0.3*40=12.0, 0.2*75=15.0, each rounded then summed)"
            - "the score is NOT 68.7 (the sum-then-round result), pinning the per-term rounding order"

      - name: installation_labor_tier_before_rework
        grounds:
          - calculations.installation_labor_hours
          - entities.InstallationJob.fields.labor_hours
          - entities.InstallationJob.fields.device_type
          - endpoints.POST_/installation-jobs/{installationJobId}/complete
        distinguishing_aspect: "Combinatorial mode (c): the rework surcharge is keyed on the tier derived from `base` (a circular-looking dependency); evaluation order is pinned base -> tier -> rework -> total, so a HUB install (base=1.0) resolves to STANDARD and totals 1.25, not 1.0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with building B (FIELD_MESH, wifi_rssi_dbm=-60 => connectivity_ok true)."
            - "InstallationJob J for a HUB in B is IN_PROGRESS; J was started via the schedule endpoint so a PROVISIONED HUB device exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Order Oaks", address_line: "4 Tier Ct", unit_capacity: 3, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_o: $.data.id }
            - call: "POST /properties/${prop_o}/buildings"
              payload: { name: "O-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_o: $.data.id, bld_o_v: $.data.version }
            - call: "POST /buildings/${bld_o}/installation-jobs"
              payload: { device_type: "HUB", requires_resident_coordination: false, access_window_start: "2026-09-02T13:00:00Z", access_window_end: "2026-09-02T17:00:00Z", expected_building_version: "${bld_o_v}" }
              as: PropertyManager
              captures: { job_j: $.data.id }
            - call: "POST /installation-jobs/${job_j}/schedule"
              payload: { scheduled_start_at: "2026-09-02T13:30:00Z" }
              as: HardwareTechnician
              captures: { job_j_v: $.data.version }
          trigger:
            - call: "POST /installation-jobs/${job_j}/complete"
              payload: {}
              as: HardwareTechnician
          assert:
            - "InstallationJob.${job_j}.status == COMPLETED"
            - "InstallationJob.${job_j}.labor_hours == 1.25 (base HUB=1.0, tier STANDARD, rework 0.25*1.0)"
            - "the labor is NOT 1.0, proving rework was keyed on the tier derived from base rather than skipped"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: tour_verification_deny_retry_cycle
        grounds:
          - state_machines.TourSession.transitions.REQUESTED_to_DENIED
          - state_machines.TourSession.transitions.DENIED_to_REQUESTED
          - state_machines.TourSession.transitions.REQUESTED_to_VERIFIED
          - entities.TourSession.fields.verify_attempts
          - errors[ERR_IDENTITY_VERIFICATION_FAILED]
        distinguishing_aspect: "TourSession runs a cycle REQUESTED→DENIED→REQUESTED→VERIFIED (a non-linear machine), not a pipeline; each deny increments verify_attempts and each retry returns the session to REQUESTED before it can pass."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P, VACANT unit U, TourSession T for U with prospect_id_document='DL-77', requested_start_at=2026-09-02T15:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Loop Landing", address_line: "7 Cycle Ave", unit_capacity: 2, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_l: $.data.id }
            - call: "POST /properties/${prop_l}/units"
              payload: { unit_number: "U-L9" }
              as: PropertyManager
              captures: { unit_l: $.data.id }
            - call: "POST /units/${unit_l}/tour-sessions"
              payload: { prospect_name: "Dana Loop", prospect_id_document: "DL-77", requested_start_at: "2026-09-02T15:00:00Z", duration_minutes: 60 }
              as: LeasingAgent
              captures: { tour_t: $.data.id }
          trigger:
            - call: "POST /tour-sessions/${tour_t}/verify"
              payload: { identity_document_number: "DL-00" }
              as: LeasingAgent
            - call: "POST /tour-sessions/${tour_t}/verify"
              payload: { identity_document_number: "DL-77" }
              as: LeasingAgent
          assert:
            - "after the first verify TourSession.${tour_t}.status == DENIED and verify_attempts == 1"
            - "the first verify surfaces ERR_IDENTITY_VERIFICATION_FAILED (422) and issues no credential"
            - "after the second verify TourSession.${tour_t}.status == VERIFIED and verify_attempts == 2"
            - "exactly one ACTIVE TOUR AccessCredential exists with unit_id == ${unit_l}"

      - name: unit_occupancy_cycle_vacant_occupied_vacant
        grounds:
          - state_machines.Unit.transitions.VACANT_to_OCCUPIED
          - state_machines.Unit.transitions.OCCUPIED_to_NOTICE
          - state_machines.Unit.transitions.NOTICE_to_NOTICE_ENDED
          - state_machines.Unit.transitions.NOTICE_ENDED_to_VACANT
          - entities.Unit.fields.occupancy_status
        distinguishing_aspect: "Unit is a cyclic machine — VACANT→OCCUPIED→NOTICE→NOTICE_ENDED→VACANT returns to its starting state, and VacantEntryWindow is recomputed fresh each time VACANT is re-entered rather than being a terminal end."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with unit U (VACANT)."
            - "Resident R has been created on U and is PENDING_CREDENTIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Circle Court", address_line: "5 Round Rd", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_c: $.data.id }
            - call: "POST /properties/${prop_c}/buildings"
              payload: { name: "C-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_c: $.data.id }
            - call: "POST /properties/${prop_c}/units"
              payload: { unit_number: "U-C1", building_id: "${bld_c}" }
              as: PropertyManager
              captures: { unit_c: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_c}", building_id: "${bld_c}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_c}", unit_id: "${unit_c}", full_name: "Rae Circle", email: "rae@x.com" }
              as: PropertyManager
              captures: { res_c: $.data.id }
            - call: "POST /residents/${res_c}/onboard"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /residents/${res_c}/deactivate"
              payload: { notice_end_at: "2026-09-10T00:00:00Z" }
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /units/${unit_c}/vacant-automation"
              payload: { window_forecast_c: 25, relative_humidity_pct: 40 }
              as: PropertyManager
          assert:
            - "after POST /residents, Unit.${unit_c}.occupancy_status == OCCUPIED"
            - "after deactivate, Unit.${unit_c}.occupancy_status == NOTICE"
            - "after the clock reaches 2026-09-11, Unit.${unit_c}.occupancy_status == NOTICE_ENDED"
            - "after vacant-automation, Unit.${unit_c}.occupancy_status == VACANT (the cycle returned U to its start state)"
            - "Unit.${unit_c}.hvac_mode == VACANT_AUTO and target_setpoint_c == 26.0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: sensor_alert_wo_replacement_three_hop_chain
        grounds:
          - state_machines.Device.transitions.ONLINE_to_UNREACHABLE
          - state_machines.DeviceAlert.transitions.OPEN_to_ACKNOWLEDGED
          - state_machines.WorkOrder.transitions.OPEN_to_ASSIGNED
          - state_machines.WorkOrder.transitions.ASSIGNED_to_CLOSED
          - entities.Device.fields.battery_replacements
        distinguishing_aspect: "Depth-3 chain from an independently-triggered Device transition: an unreachable LEAK_SENSOR raises an OFFLINE DeviceAlert, that alert spawns a WorkOrder whose assignment acknowledges the alert, and closing the WO with battery_replaced increments the Device's battery_replacements — each hop caused by the previous hop."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B (FIELD_MESH, rssi=-60), unit U in B, LEAK_SENSOR device S in U."
            - "Device T in U is a real SMART_LOCK so the building has an online lock; S has battery_pct=10 and firmware_version=OLD."
            - "A first scan with reachable_device_ids=[T] has already driven S to UNREACHABLE and raised one OPEN OFFLINE alert A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Chain Chase", address_line: "11 Link Blvd", unit_capacity: 2, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_ch: $.data.id }
            - call: "POST /properties/${prop_ch}/buildings"
              payload: { name: "CH-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_ch: $.data.id }
            - call: "POST /properties/${prop_ch}/units"
              payload: { unit_number: "U-CH1", building_id: "${bld_ch}" }
              as: PropertyManager
              captures: { unit_ch: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_ch}", building_id: "${bld_ch}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_t: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "LEAK_SENSOR", unit_id: "${unit_ch}", building_id: "${bld_ch}", firmware_version: "OLD", battery_pct: 10 }
              as: HardwareTechnician
              captures: { dev_s: $.data.id }
            - call: "POST /buildings/${bld_ch}/device-scans"
              payload: { reachable_device_ids: ["${dev_t}"] }
              as: HardwareTechnician
              captures: { alert_a: "$.data[0].id" }
          trigger:
            - call: "GET /device-alerts"
              payload: { device_id: "${dev_s}" }
              as: PropertyManager
              captures: { alert_a2: "$.data[0].id", alert_a2_v: "$.data[0].version" }
            - call: "POST /device-alerts/${alert_a2}/work-orders"
              payload: { assigned_technician_id: "tech-nia", expected_device_alert_version: "${alert_a2_v}" }
              as: HardwareTechnician
              captures: { wo_k: $.data.id }
            - call: "POST /work-orders/${wo_k}/assign"
              payload: { technician_id: "tech-nia", confirm_repair: true }
              as: HardwareTechnician
              captures: { wo_k2: $.data.id }
            - call: "POST /work-orders/${wo_k2}/assign"
              payload: { technician_id: "tech-nia", replaced_battery: true, confirm_repair: true }
              as: HardwareTechnician
          assert:
            - "hop 1: Device.${dev_s}.status == UNREACHABLE and exactly one DeviceAlert with device_id ${dev_s} and alert_type OFFLINE was created"
            - "hop 2: GET /device-alerts?device_id=${dev_s} shows that alert at status ACKNOWLEDGED after the first assign"
            - "hop 3: Device.${dev_s}.battery_replacements == 1 and Device.${dev_s}.battery_pct == 100"
            - "WorkOrder.${wo_k2}.status == CLOSED and the alert is RESOLVED"

      - name: resident_moveout_credential_revocation_three_hop_chain
        grounds:
          - state_machines.Unit.transitions.OCCUPIED_to_NOTICE
          - state_machines.Resident.transitions.ACTIVE_to_DEACTIVATING
          - state_machines.AccessCredential.transitions.ACTIVE_to_REVOKED
          - state_machines.GuestPass.transitions.ACTIVE_to_REVOKED
          - state_machines.Resident.transitions.DEACTIVATING_to_REVOKED
        distinguishing_aspect: "Depth-3 chain from a resident transition: deactivating Resident R sets Unit U to NOTICE, which revokes R's live resident credential AND R's hosted GuestPass, and the emptied credential set then bubbles Resident R from DEACTIVATING to REVOKED — three distinct entity hops."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P, building B with connectivity_ok, unit U, ONLINE SMART_LOCK L on U."
            - "Resident R on U is ACTIVE with a live RESIDENT credential and one ACTIVE guest pass G hosted by R."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Moveout Manor", address_line: "22 Exit St", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_m: $.data.id }
            - call: "POST /properties/${prop_m}/buildings"
              payload: { name: "M-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_m: $.data.id }
            - call: "POST /properties/${prop_m}/units"
              payload: { unit_number: "U-M1", building_id: "${bld_m}" }
              as: PropertyManager
              captures: { unit_m: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_m}", building_id: "${bld_m}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_l: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_m}", unit_id: "${unit_m}", full_name: "Mona Moveout", email: "mona@x.com" }
              as: PropertyManager
              captures: { res_r: $.data.id }
            - call: "POST /residents/${res_r}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /units/${unit_m}/guest-passes"
              payload: { host_resident_id: "${res_r}", guest_label: "Sister", start_at: "2026-09-02T09:00:00Z", end_at: "2026-09-04T09:00:00Z" }
              as: PropertyManager
              captures: { pass_g: $.data.id }
          trigger:
            - call: "POST /residents/${res_r}/deactivate"
              payload: { notice_end_at: "2026-09-20T00:00:00Z" }
              as: PropertyManager
          assert:
            - "hop 1: Resident.${res_r}.status == DEACTIVATING and Unit.${unit_m}.occupancy_status == NOTICE"
            - "hop 2: GuestPass.${pass_g}.status == REVOKED and every AccessCredential with subject_resident_id == ${res_r} is REVOKED"
            - "hop 3: Resident.${res_r}.status == REVOKED (bubbled up once no live credential remains)"
            - "Resident.${res_r}.portal_credential_status == REVOKED"
            - "GET /resident-status-events?resident_id=${res_r} returns three events: PENDING_CREDENTIAL->ACTIVE, ACTIVE->DEACTIVATING, DEACTIVATING->REVOKED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: resident_not_active_beats_credential_scope_on_guest_pass
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_RESIDENT_NOT_ACTIVE]
          - errors[ERR_CREDENTIAL_OUT_OF_SCOPE]
          - state_machines.Resident.transitions.ACTIVE_to_DEACTIVATING
        distinguishing_aspect: "state vs business_referential error-category pair: a guest pass hosted by a DEACTIVATING resident violates both the resident-state check (priority 7) and the credential-scope check (priority 16); the state check wins, returning ERR_RESIDENT_NOT_ACTIVE, not ERR_CREDENTIAL_OUT_OF_SCOPE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P, building B (rssi=-60), unit U with an ONLINE SMART_LOCK."
            - "Resident R on U is DEACTIVATING: there is no ACTIVE resident, so issuing a guest pass for R violates both the resident-state rule and the credential-scope rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Notice Nook", address_line: "8 Late Ln", unit_capacity: 2, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_n: $.data.id }
            - call: "POST /properties/${prop_n}/buildings"
              payload: { name: "N-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_n: $.data.id }
            - call: "POST /properties/${prop_n}/units"
              payload: { unit_number: "U-N1", building_id: "${bld_n}" }
              as: PropertyManager
              captures: { unit_n: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_n}", building_id: "${bld_n}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_n: $.data.id }
            - call: "POST /buildings/${bld_n}/device-scans"
              payload: { reachable_device_ids: ["${dev_n}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_n}", unit_id: "${unit_n}", full_name: "Omar Notice", email: "omar@x.com" }
              as: PropertyManager
              captures: { res_n: $.data.id }
            - call: "POST /residents/${res_n}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /residents/${res_n}/deactivate"
              payload: { notice_end_at: "2026-09-20T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /units/${unit_n}/guest-passes"
              payload: { host_resident_id: "${res_n}", guest_label: "Too Soon", start_at: "2026-09-25T09:00:00Z", end_at: "2026-09-26T09:00:00Z" }
              as: PropertyManager
              captures: { err_n: $.data.error_id }
          assert:
            - "the response error_id == ERR_RESIDENT_NOT_ACTIVE (priority 7 wins over priority 16)"
            - "the response is NOT ERR_CREDENTIAL_OUT_OF_SCOPE even though the DEACTIVATING host also fails the credential-scope check"
            - "http status == 409 and Resident.${res_n}.status remains DEACTIVATING with no guest pass created"

      - name: no_hub_connectivity_safety_beats_budget_fiscal_on_hub_job
        grounds:
          - validations[priority=14]
          - validations[priority=20]
          - errors[ERR_NO_HUB_CONNECTIVITY]
          - errors[ERR_BUDGET_EXCEEDED]
          - endpoints.POST_/buildings/{buildingId}/installation-jobs
        distinguishing_aspect: "business_safety vs business_fiscal error-category pair: creating a HUB installation job in a building that fails connectivity_ok AND into a property whose budget is already at its cap violates both the safety check (priority 14) and the fiscal check (priority 20); safety wins, returning ERR_NO_HUB_CONNECTIVITY, not ERR_BUDGET_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B has wifi_rssi_dbm=-90 (connectivity_ok false)."
            - "Property P has temp_budget_cents_per_day=72000; a non-emergency MaintenanceVisit V for 100 planned hours has been certified, so budget_committed_cents is already 72000 (at the cap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Dead Zone Depot", address_line: "1 Dead Zone", unit_capacity: 2, temp_budget_cents_per_day: 72000 }
              as: PlatformAdmin
              captures: { prop_s: $.data.id }
            - call: "POST /properties/${prop_s}/buildings"
              payload: { name: "S-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -90 }
              as: PlatformAdmin
              captures: { bld_s: $.data.id, bld_s_v: $.data.version }
            - call: "POST /properties/${prop_s}/units"
              payload: { unit_number: "U-S1", building_id: "${bld_s}" }
              as: PropertyManager
              captures: { unit_s: $.data.id }
            - call: "POST /units/${unit_s}/maintenance-visits"
              payload: { technician_id: "tech-sam", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-07T14:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_s: $.data.id }
            - call: "POST /maintenance-visits/${visit_s}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
            - call: "GET /buildings"
              payload: { property_id: "${prop_s}" }
              as: PropertyManager
              captures: { bld_s_now_v: "$.data[0].version" }
          trigger:
            - call: "POST /buildings/${bld_s}/installation-jobs"
              payload: { device_type: "HUB", requires_resident_coordination: false, access_window_start: "2026-09-08T09:00:00Z", access_window_end: "2026-09-08T12:00:00Z", expected_building_version: "${bld_s_now_v}" }
              as: PropertyManager
              captures: { err_s: $.data.error_id }
          assert:
            - "the response error_id == ERR_NO_HUB_CONNECTIVITY (priority 14 wins over priority 20)"
            - "the response is NOT ERR_BUDGET_EXCEEDED even though Property.${prop_s}.budget_committed_cents == 72000 == temp_budget_cents_per_day so the 2000-cent reserve would exceed the cap"
            - "http status == 409 and no InstallationJob is created for Building.${bld_s}"

# ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: building_connectivity_threshold_inclusive_boundary
        grounds:
          - calculations.building_connectivity_ok
          - constants.NET_RSSI_THRESHOLD_DBM_FIELD_MESH
          - entities.Building.fields.connectivity_ok
          - entities.Building.fields.wifi_rssi_dbm
        distinguishing_aspect: "The dBm comparison is inclusive on the strong side: a FIELD_MESH building at exactly -75 dBm yields connectivity_ok true, while -76 yields false — a one-dBm step across the boundary flips the flag."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Edge Estates", address_line: "75 Boundary Rd", unit_capacity: 2, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_bp: $.data.id }
          trigger:
            - call: "POST /properties/${prop_bp}/buildings"
              payload: { name: "At Edge", network_design: "FIELD_MESH", wifi_rssi_dbm: -75 }
              as: PlatformAdmin
              captures: { bld_edge: $.data.id }
            - call: "POST /properties/${prop_bp}/buildings"
              payload: { name: "Below Edge", network_design: "FIELD_MESH", wifi_rssi_dbm: -76 }
              as: PlatformAdmin
              captures: { bld_below: $.data.id }
          assert:
            - "Building.${bld_edge}.connectivity_ok == true at exactly wifi_rssi_dbm == -75"
            - "Building.${bld_below}.connectivity_ok == false at wifi_rssi_dbm == -76"
            - "the inclusive boundary is the >= comparison, not >"

      - name: maintenance_complete_rejects_zero_actual_hours
        grounds:
          - entities.MaintenanceVisit.fields.actual_hours
          - state_machines.MaintenanceVisit.transitions.NOTICE_CERTIFIED_to_COMPLETED
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/maintenance-visits/{maintenanceVisitId}/complete
        distinguishing_aspect: "The maintenance completion gate rejects the zero-quantity boundary: actual_hours == 0 is refused (ERR_INVALID_REQUEST) while actual_hours == 0.5 is accepted — an empty/zero-count edge on a distinct metric and endpoint from the dBm boundary."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P, unit U (VACANT), non-emergency MaintenanceVisit V requested for 2026-09-03T10:00–12:30 and already notice-certified (NOTICE_CERTIFIED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Zero Nook", address_line: "0 Zip Ln", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_z: $.data.id }
            - call: "POST /properties/${prop_z}/units"
              payload: { unit_number: "U-Z1" }
              as: PropertyManager
              captures: { unit_z: $.data.id }
            - call: "POST /units/${unit_z}/maintenance-visits"
              payload: { technician_id: "tech-priya", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T12:30:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_z: $.data.id }
            - call: "POST /maintenance-visits/${visit_z}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /maintenance-visits/${visit_z}/complete"
              payload: { actual_hours: 0 }
              as: MaintenanceTechnician
              captures: { err_z: $.data.error_id }
            - call: "POST /maintenance-visits/${visit_z}/complete"
              payload: { actual_hours: 0.5 }
              as: MaintenanceTechnician
          assert:
            - "the actual_hours == 0 call returns ERR_INVALID_REQUEST and MaintenanceVisit.${visit_z}.status stays NOTICE_CERTIFIED"
            - "the actual_hours == 0.5 call succeeds and MaintenanceVisit.${visit_z}.status == COMPLETED"
            - "MaintenanceVisit.${visit_z}.accrued_cost_cents == 2700 (2000 + ceil(0.5)*700)"

