  - rule_id: cross_entity_state_dependency
    instances:
      - name: market_data_refresh_invalidates_legal_clearance_through_screen_staleness
        grounds:
          - endpoints.POST_/exec-comp/companies/{id}/market-data
          - calculations.realized_and_realizable_pay
          - state_machines.ProxyAdvisorScreen.SCREENED_to_STALE
          - state_machines.CdaDraft.LEGAL_CLEARED_to_DRAFTING
          - validations.priority_14_ERR_CDA_STATE_INVALID
        distinguishing_aspect: |
          Whether the `file` operation is permitted depends on the state of a Company row four hops away:
          Company.share_price_usd -> PayoutAward.realizable_value_usd -> PayProgram.realizable_pay_total_usd ->
          ProxyAdvisorScreen.status -> CdaDraft.status. Nothing about the CdaDraft or the filing request itself
          changes; a price tick on an unrelated aggregate root revokes a legal clearance that was valid a moment
          earlier.
