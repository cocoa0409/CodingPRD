  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: registrar_cannot_decide_appeal
        claim_type: violation_to_error
        grounds: ['roles[Registrar]', 'roles[CommitteeMember]', 'errors[ERR_UNAUTHORIZED]']
        distinguishing_aspect: "Approval chain is strict: the Registrar (earlier chain role) cannot perform the CommitteeMember's decide step."
        test_recipe:
          setup: ["Student suspended at T2; appeal UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-RD", name: "RegDecide", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-5001", full_name: "Chain Guard", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "OTHER", statement: "s", documents: [{ doc_type: "NOTE", description: "n" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer }
          trigger:
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "APPROVED", resolution: "PROBATION_ONLY", rationale: "registrar overreach" }, as: Registrar, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNAUTHORIZED (403); appeal stays UNDER_REVIEW"]

      - name: committee_cannot_screen_appeal
        claim_type: violation_to_error
        grounds: ['roles[CommitteeMember]', 'roles[AidOfficer]', 'errors[ERR_UNAUTHORIZED]']
        distinguishing_aspect: "The final chain role cannot perform the middle screening step (screening is AidOfficer-exclusive)."
        test_recipe:
          setup: ["Student suspended at T2; appeal SUBMITTED"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-CS", name: "CommScreen", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-5002", full_name: "Screen Guard", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "OTHER", statement: "s", documents: [{ doc_type: "NOTE", description: "n" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /sap/appeals/${ap}/screen", as: CommitteeMember, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_UNAUTHORIZED (403); appeal stays SUBMITTED"]

      - name: auditor_is_read_only
        claim_type: violation_to_error
        grounds: ['roles[Auditor]', 'errors[ERR_UNAUTHORIZED]']
        distinguishing_aspect: "Auditor can read the audit trail but cannot mutate: POST /sap/programs as Auditor is ERR_UNAUTHORIZED while GET /sap/audit-events succeeds."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sap/programs", payload: { code: "BS-AU", name: "AuditorWrite", required_credits: 120 }, as: Auditor, captures: { err: $.data.error_id } }
            - { call: "GET /sap/audit-events", as: Auditor }
          assert:
            - "write as Auditor: ERR_UNAUTHORIZED (403)"
            - "GET /sap/audit-events as Auditor: 200 with response_type array (empty list, total_count 0)"

      - name: student_cannot_read_other_student_record
        claim_type: violation_to_error
        grounds: ['validations[priority=4]', 'roles[Student]', 'errors[ERR_OWNERSHIP_VIOLATION]']
        distinguishing_aspect: "entity_backed identity: a Student whose X-User-ID differs from the path student id gets ERR_OWNERSHIP_VIOLATION (403), not the record."
        test_recipe:
          setup: ["Program with students S1 and S2"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-OWN", name: "Ownership", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-5003", full_name: "Mine", program_id: "${prog}" }, as: Registrar, captures: { stu1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-5004", full_name: "Not Mine", program_id: "${prog}" }, as: Registrar, captures: { stu2: $.data.id } }
          trigger:
            - { call: "GET /sap/students/${stu2}", as: Student, as_user_id: "${stu1}", captures: { err: $.data.error_id } }
            - { call: "GET /sap/students/${stu1}", as: Student, as_user_id: "${stu1}", captures: { ok_name: $.data.full_name } }
          assert:
            - "reading another student's record: ERR_OWNERSHIP_VIOLATION (403)"
            - "reading own record succeeds: full_name == 'Mine'"

  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_appeal_create_stale_version_rejected
        claim_type: stale_version_conflict
        grounds: ['concurrency_rules[appeal-create-stale-student]', 'errors[ERR_STALE_VERSION]', 'validations[priority=5]']
        distinguishing_aspect: "OCC on Student.version: a second appeal create carrying the pre-supersede version is rejected 412 ERR_STALE_VERSION; the first create incremented Student.version and superseded the prior SUBMITTED appeal."
        test_recipe:
          setup: ["Student suspended at T2; client observes student version V before any appeal exists"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-OCC", name: "Occ", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-6001", full_name: "Occ Tester", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
          trigger:
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MEDICAL", statement: "first appeal", documents: [{ doc_type: "NOTE", description: "n1" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap1: $.data.id } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "FAMILY_EMERGENCY", statement: "stale second appeal", documents: [{ doc_type: "NOTE", description: "n2" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { err: $.data.error_id } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v_after: $.data.version } }
          assert:
            - "first appeal (expected_student_version == observed version) succeeds: 201"
            - "second appeal with the same (now stale) version: ERR_STALE_VERSION (412)"
            - "Student.version advanced by exactly 1 across the successful create (version_after == version_before + 1)"
            - "supersede semantics of the FIRST (valid) create are preserved: exactly one appeal exists and it is SUBMITTED"

      - name: appeal_supersede_replaces_submitted_appeal
        claim_type: cross_entity
        grounds: [state_machines.Appeal.SUBMITTED_to_SUPERSEDED, 'endpoints["POST /sap/appeals"]']
        distinguishing_aspect: "A fresh in-window appeal with the CURRENT student version legitimately supersedes the prior SUBMITTED appeal (the OCC-guarded happy path): old row flips to SUPERSEDED with an APPEAL_SUPERSEDED audit event."
        test_recipe:
          setup: ["Student suspended at T2; first appeal SUBMITTED"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-SUP", name: "Supersede", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-6002", full_name: "Super Sede", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MEDICAL", statement: "v1", documents: [{ doc_type: "NOTE", description: "n1" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap1: $.data.id } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v2: $.data.version } }
          trigger:
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MILITARY", statement: "v2 with better docs", documents: [{ doc_type: "ORDERS", description: "n2" }], expected_student_version: "${s_v2}" }, as: Student, as_user_id: "${stu}", captures: { ap2: $.data.id } }
            - { call: "GET /sap/appeals/${ap1}", as: AidOfficer, captures: { ap1_status: $.data.status } }
            - { call: "GET /sap/appeals?student_id=${stu}&status=SUPERSEDED", as: AidOfficer }
          assert:
            - "second appeal created (201) with current version; first appeal status == SUPERSEDED"
            - "appeals list for the student: total_count == 2 (one SUPERSEDED, one SUBMITTED)"
            - "audit trail contains APPEAL_SUPERSEDED for the first appeal and APPEAL_SUBMITTED for both"

      - name: amend_cascade_supersedes_evaluation_and_reinstates
        claim_type: cascading_side_effects
        grounds: [state_machines.TermEnrollment.POSTED_to_AMENDED, state_machines.SapEvaluation.OFFICIAL_to_SUPERSEDED, state_machines.Student.SUSPENSION_to_GOOD_STANDING, calculations.term_evaluation_pipeline]
        distinguishing_aspect: "The amendment cascade re-runs the per-student pipeline: the T2 OFFICIAL evaluation is SUPERSEDED, a replacement OFFICIAL row shows GOOD_STANDING, the student is reinstated, and a REINSTATEMENT notification is queued — all from one amend call."
        test_recipe:
          setup:
            - "Student suspended at T2: T1 attempted 6 earned 3 QP 6.0 gh 6 (WARNING); T2 attempted 12 earned 3 QP 6.0 gh 6 (SUSPENSION)"
            - "Registrar amends the T2 enrollment to earned 12 QP 48.0 gh 12 (grade appeal upheld)"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-AM", name: "AmendCascade", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-6003", full_name: "Amend Cascade", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 12 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}&status=OFFICIAL", as: AidOfficer, captures: { ev2_old: "$.data[0].id" } }
          trigger:
            - { call: "POST /sap/term-enrollments/${e2}/amend", payload: { earned_credits: 12, quality_points: 48.0, gpa_hours: 12, amendment_reason: "Grade appeal upheld: F -> A" }, as: Registrar, captures: { e2_status: $.data.status } }
            - { call: "GET /sap/evaluations/${ev2_old}", as: AidOfficer, captures: { ev_old_status: $.data.status } }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}&status=OFFICIAL", as: AidOfficer, captures: { ev2_new: "$.data[0].id", ev2_result: "$.data[0].result_standing", ev2_pace: "$.data[0].pace_pct", ev2_gpa: "$.data[0].cumulative_gpa" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_status: $.data.sap_status, s_pace: $.data.pace_pct } }
            - { call: "GET /sap/notifications?student_id=${stu}&kind=REINSTATEMENT", as: AidOfficer, captures: { rn: "$.data[0].status" } }
            - { call: "GET /sap/audit-events?student_id=${stu}&action=EVALUATION_SUPERSEDED", as: Auditor }
          assert:
            - "old T2 evaluation status == SUPERSEDED; a new OFFICIAL evaluation exists for (student, T2)"
            - "new evaluation: result_standing == GOOD_STANDING, pace_pct == 83.33 (15/18), cumulative_gpa == 3.0 (54/18)"
            - "Student.sap_status == GOOD_STANDING; one REINSTATEMENT notification QUEUED"
            - "audit contains EVALUATION_SUPERSEDED, EVALUATION_POSTED, STANDING_CHANGED, NOTIFICATION_QUEUED for the cascade"

      - name: dual_variant_preview_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.pace_calculation, calculations.max_timeframe_check]
        excluded_because:
          difficulty_instance: pace_official_vs_preview_projection
          rationale: "Variant divergence and variant selection are asserted by the two §1.8 dual_variant_calc instances."

      - name: pace_threshold_boundary_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.pace_calculation]
        excluded_because:
          difficulty_instance: pace_exactly_67_passes_vs_66_fails
          rationale: "The inclusive 67.00 boundary is asserted in the named §1.8 instance; pace_two_thirds_fails_below_threshold (calculations section) covers the 66.67 rounding trap."

      - name: notifications_filter_by_student_and_status
        claim_type: pagination_with_filtering
        grounds: ['endpoints["GET /sap/notifications"]']
        distinguishing_aspect: "Filter composition: student_id + kind + status narrow the list deterministically (suspension world yields 4 queued rows for the student, 2 of them reminders)."
        test_recipe:
          setup: ["Student suspended at T2 (default clock; nothing dispatched)"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-NF", name: "NotifFilter", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-6004", full_name: "Filter Fan", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
          trigger:
            - { call: "GET /sap/notifications?student_id=${stu}&status=QUEUED", as: AidOfficer }
            - { call: "GET /sap/notifications?student_id=${stu}&kind=APPEAL_DEADLINE_REMINDER", as: AidOfficer }
            - { call: "GET /sap/notifications?student_id=${stu}&kind=REINSTATEMENT", as: AidOfficer }
          assert:
            - "status=QUEUED: total_count == 4 (T1 notice + T2 notice + 2 reminders)"
            - "kind=APPEAL_DEADLINE_REMINDER: total_count == 2 with scheduled_at 2026-08-08T00:00:00Z and 2026-08-14T00:00:00Z"
            - "kind=REINSTATEMENT: total_count == 0"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: amend_response_immediately_reflects_new_values
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, 'endpoints["POST /sap/term-enrollments/{id}/amend"]']
        distinguishing_aspect: "Immediate consistency: the amend response body already carries the new values, and a follow-up GET of the student shows recomputed cumulatives with no lag or reconciliation delay."
        test_recipe:
          setup: ["Program, T1, student, enrollment attempted 6 POSTED earned 3 QP 9.0 gh 6 (term not evaluated)"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-IC", name: "Immediate", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-7001", full_name: "Imm Ediate", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 9.0, gpa_hours: 6 }, as: Registrar }
          trigger:
            - { call: "POST /sap/term-enrollments/${e1}/amend", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 6, amendment_reason: "correction" }, as: Registrar, captures: { e_earn: $.data.earned_credits, e_status: $.data.status, e_ver: $.data.version } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_earn: $.data.cumulative_earned_credits, s_qp: $.data.cumulative_quality_points, s_gpa: $.data.cumulative_gpa } }
          assert:
            - "amend response itself: earned_credits == 6, status == AMENDED, version incremented"
            - "immediate follow-up GET: cumulative_earned_credits == 6, cumulative_quality_points == 24.0, cumulative_gpa == 4.0 (visible in the same logical instant)"
