              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { st: $.data.status, at: $.data.assignment_type, fr: $.data.first_responded_at, rb: $.data.response_sla_breached, v: $.data.version, tid: $.data.assigned_technician_id }
          assert:
            - "status == ASSIGNED, assignment_type == IN_HOUSE, assigned_technician_id == ${tech_id}"
            - "first_responded_at == 2026-08-01T00:00:00Z (logical clock default)"
            - "response_sla_breached == false (responded well before 2026-08-04 due)"
            - "version == 2"

      - name: complete_with_damage_creates_pending_chargeback
        claim_type: action_endpoint
        grounds: ["endpoints[POST /work-orders/{id}/complete]", state_machines.Chargeback, entities.Chargeback.fields.provisional_amount_cents]
        distinguishing_aspect: "Completion with damage_reported=true creates exactly one PENDING chargeback whose provisional_amount_cents equals the completion estimate and whose resident_id matches the work order."
        test_recipe:
          setup: ["work order IN_PROGRESS with sign-off"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "CbCreate Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "502", full_name: "R Cb", email: "rcb@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Damage job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/m1.jpg"], damage_reported: true, estimated_damage_cost_cents: 7000 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st: $.data.status, cb_flag: $.data.completion_sla_breached }
            - call: "GET /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: PropertyManager
              captures: {cb_status: "$.data[0].status", cb_prov: "$.data[0].provisional_amount_cents", cb_res: "$.data[0].resident_id"}
          assert:
            - "WorkOrder.${wo_id}.status == COMPLETED"
            - "Exactly one chargeback for the work order (total_count == 1)"
            - "Chargeback: status == PENDING, provisional_amount_cents == 7000, resident_id == ${res_id}, final_amount_cents == null"

      - name: receive_increments_part_stock
        claim_type: action_endpoint
        grounds: ["endpoints[POST /purchase-requests/{id}/events]", state_machines.PurchaseRequest.APPROVED_to_RECEIVED, calculations.part_stock_ledger]
        distinguishing_aspect: "RECEIVE on an auto-approved purchase request moves it to RECEIVED and adds its quantity to Part.quantity_on_hand (0 -> 5)."
        test_recipe:
          setup: ["work order ASSIGNED to technician (version 2); part with initial_stock 0; auto-approved purchase request for 5 units (total 540 <= 50000)"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Recv Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "503", full_name: "R Recv", email: "rrecv@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "WSH-1", name: "Washer", unit_cost_cents: 100, reorder_level: 0, initial_stock: 0 }
              as: PropertyManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Washer job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 5, quoted_unit_cost_cents: 100, shipping_fee_cents: 0, expected_work_order_version: "${wo_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr_id: $.data.id, pr_status: $.data.status }
          trigger:
            - call: "POST /purchase-requests/${pr_id}/events"
              payload: { event_type: "RECEIVE" }
              as: PropertyManager
              captures: { pr_final: $.data.status }
            - call: "GET /parts/${part_id}"
              payload: {}
              as: PropertyManager
              captures: { onhand: $.data.quantity_on_hand }
          assert:
            - "PurchaseRequest.${pr_id} was APPROVED at creation (total 540 == 500 + handling 40 <= 50000)"
            - "After RECEIVE: status == RECEIVED"
            - "Part.${part_id}.quantity_on_hand == 5"

      - name: patch_triage_recomputes_due_timestamps
        claim_type: action_endpoint
        grounds: ["endpoints[PATCH /work-orders/{id}]", calculations.sla_due_timestamps, "concurrency_rules[wo-triage-stale-version]"]
        distinguishing_aspect: "PATCH priority ROUTINE -> EMERGENCY recomputes due timestamps from created_at with emergency hours (4/24): response_due_at 2026-08-01T04:00:00Z, completion_due_at 2026-08-02T00:00:00Z; version 1 -> 2."
        test_recipe:
          setup: ["ROUTINE work order TRIAGED, created at default clock 2026-08-01T00:00:00Z (version 1)"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Patch Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "504", full_name: "R Patch", email: "rpatch@x.com" }
              as: PropertyManager
