# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — EXPERT tier
# PR & Media-Relations Firm (task_0703)
# Single top-level key: scaffold_corner_design
# Breadth probe over claim-extraction-guide sections (Entities / State Machines /
# Calculations / Validations / Endpoints / Errors / RBAC / Cross-Cutting Layers /
# Consistency Model). section: and claim_type: values come from the guide only.
# Corners already exercised by a §1.8 instance are emitted as excluded_because: stubs
# (the cited difficulty_instance exists by name in SCAFFOLD_DIFFICULTY_DESIGN.yaml).
# All formula-derived asserts are literals computed against §1.3. Clock default 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults_and_computed_zero
        claim_type: Creation
        grounds:
          - entities.Client
          - endpoints
        distinguishing_aspect: "POST /agency/clients with all required fields returns 201; account_tier defaults to STANDARD, status ACTIVE, lifetime_earned_media_cents 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /agency/clients"
              payload: { name: "Acme", industry: "TECH", monthly_retainer_cents: 500000, monthly_hours_cap: 40, overage_rate_cents: 15000 }
              as: AccountManager
              captures: { client_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Client.${client_id}.account_tier == STANDARD"
            - "Client.${client_id}.status == ACTIVE"
            - "Client.${client_id}.lifetime_earned_media_cents == 0"
            - "Client.${client_id}.version == 1"

      - name: get_nonexistent_client_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Client
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /agency/clients/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /agency/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_campaign_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Campaign
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /agency/campaigns omitting budget_cents returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A Client exists."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Beta", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "NoBudget", objective: "LAUNCH", target_beat: "TECH" }
              as: AccountManager
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_campaign_bad_enum_objective_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Campaign.fields.objective
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /agency/campaigns with objective not in {LAUNCH,THOUGHT_LEADERSHIP,CRISIS,AWARENESS} returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A Client exists."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Gamma", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "BadEnum", objective: "BANANA", budget_cents: 100000, target_beat: "TECH" }
              as: AccountManager
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_spokesperson_default_prep_buffer_thirty
        claim_type: Defaults
        grounds:
          - entities.Spokesperson.fields.prep_buffer_minutes
        distinguishing_aspect: "POST /agency/spokespersons omitting prep_buffer_minutes applies default 30."
        test_recipe:
          setup:
            - "A Client exists."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Delta", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /agency/spokespersons"
              payload: { client_id: "${client_id}", full_name: "Pat Speaker", title: "CEO" }
              as: AccountManager
              captures: { spokesperson_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Spokesperson.${spokesperson_id}.prep_buffer_minutes == 30"
            - "Spokesperson.${spokesperson_id}.status == ACTIVE"

      - name: create_pitch_with_journalist_not_in_list_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Pitch
          - validations[priority=8]
          - errors[ERR_JOURNALIST_NOT_IN_LIST]
        distinguishing_aspect: "POST /agency/pitches whose journalist_id is not in the MediaList.journalist_ids returns 409 ERR_JOURNALIST_NOT_IN_LIST (flat-topology FK cross-reference integrity)."
        test_recipe:
          setup:
            - "An ACTIVE Campaign with an ACTIVE MediaList containing journalist J1; a second journalist J2 NOT in the list."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Eps", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "NIL", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "NIL Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "J One", email: "j1@nl.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { j1_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "J Two", email: "j2@nl.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { j2_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "NIL List", journalist_ids: ["${j1_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
          trigger:
            - call: "POST /agency/pitches"
              payload: { campaign_id: "${campaign_id}", media_list_id: "${media_list_id}", journalist_id: "${j2_id}", angle: "outsider" }
              as: MediaSpecialist
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_JOURNALIST_NOT_IN_LIST"

      - name: create_journalist_with_nonexistent_outlet_reference_not_found
        claim_type: Not Found
        grounds:
          - entities.Journalist.fields.outlet_id
          - validations[priority=4]
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "POST /agency/journalists with an outlet_id FK that does not exist returns 404 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB (no outlets)."
          setup_api_calls: []
          trigger:
            - call: "POST /agency/journalists"
              payload: { outlet_id: "00000000-0000-4000-8000-000000000000", full_name: "Ghost", email: "ghost@x.com", beat: "TECH" }
              as: MediaSpecialist
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_REFERENCE_NOT_FOUND"

      - name: outlet_is_immutable_reference_data_only_id_created_at
        claim_type: Immutability
        grounds:
          - entities.Outlet
        distinguishing_aspect: "Outlet has common_fields:false — its create response carries id and created_at but no version or updated_at field (immutable reference data)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /agency/outlets"
              payload: { name: "Imm Outlet", tier: "BLOG", monthly_unique_visitors: 50000, domain_authority: 20 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Outlet.${outlet_id}.id is present"
            - "Outlet.${outlet_id} has no field 'version'"

      - name: journalist_outlet_id_reverse_reachable_via_filtered_list
        claim_type: Retrieval
        grounds:
          - entities.Journalist.fields.outlet_id
          - endpoints
        distinguishing_aspect: "GET /agency/journalists?outlet_id={id} returns the Journalist[] for that outlet (FK reverse-reachability)."
        test_recipe:
          setup:
            - "An Outlet with one Journalist on it."
          setup_api_calls:
            - call: "POST /agency/outlets"
              payload: { name: "Rev Outlet", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Rev Jo", email: "rev@ro.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
          trigger:
            - call: "GET /agency/journalists?outlet_id=${outlet_id}"
              payload: {}
              as: MediaSpecialist
          assert:
            - "response.status == 200"
            - "response.data contains exactly one Journalist with id == ${journalist_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_campaign_from_completed_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Campaign
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /agency/campaigns/{id}/activate on a COMPLETED campaign (no DRAFT/PAUSED->ACTIVE edge from COMPLETED) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A Campaign moved DRAFT->ACTIVE->COMPLETED (no open pitches/interviews)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Zeta", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Done", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/campaigns/${campaign_id}/complete"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: archive_then_archive_again_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Campaign
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ARCHIVED is terminal: a second archive on an already-ARCHIVED campaign returns 409 ERR_INVALID_STATE; no cascade re-fires."
        test_recipe:
          setup:
            - "A DRAFT Campaign archived to ARCHIVED (no children)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Eta", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Arch", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id }
            - call: "POST /agency/campaigns/${campaign_id}/archive"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /agency/campaigns/${campaign_id}/archive"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: complete_campaign_with_open_sent_pitch_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Campaign.ACTIVE_to_COMPLETED
          - errors[ERR_CAMPAIGN_HAS_OPEN_PITCHES]
        distinguishing_aspect: "POST /agency/campaigns/{id}/complete with a Pitch in SENT returns 409 ERR_CAMPAIGN_HAS_OPEN_PITCHES."
        test_recipe:
          setup:
            - "An ACTIVE Campaign; ACTIVE MediaList + ACTIVE Journalist; one Pitch moved DRAFT->SENT."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Theta", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "OpenP", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "OP Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "OP Jo", email: "op@ot.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "OP List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/pitches"
              payload: { campaign_id: "${campaign_id}", media_list_id: "${media_list_id}", journalist_id: "${journalist_id}", angle: "op angle" }
              as: MediaSpecialist
              captures: { pitch_id: $.data.id }
            - call: "POST /agency/pitches/${pitch_id}/send"
              payload: {}
              as: MediaSpecialist
          trigger:
            - call: "POST /agency/campaigns/${campaign_id}/complete"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CAMPAIGN_HAS_OPEN_PITCHES"

      - name: complete_campaign_with_open_interview_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Campaign.ACTIVE_to_COMPLETED
          - errors[ERR_CAMPAIGN_HAS_OPEN_INTERVIEWS]
        distinguishing_aspect: "POST /agency/campaigns/{id}/complete with an Interview in REQUESTED returns 409 ERR_CAMPAIGN_HAS_OPEN_INTERVIEWS."
        test_recipe:
          setup:
            - "An ACTIVE Campaign; an ACTIVE Spokesperson; an ACTIVE Journalist; one REQUESTED Interview on the campaign; no open pitches."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Iota", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "OpenI", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "OI Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "OI Jo", email: "oi@oit.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/spokespersons"
              payload: { client_id: "${client_id}", full_name: "OI Spoke", title: "CEO" }
              as: AccountManager
              captures: { spokesperson_id: $.data.id }
            - call: "POST /agency/interviews"
              payload: { campaign_id: "${campaign_id}", spokesperson_id: "${spokesperson_id}", journalist_id: "${journalist_id}", starts_at: "2026-04-20T10:00:00Z", ends_at: "2026-04-20T11:00:00Z" }
              as: SchedulingCoordinator
              captures: { interview_id: $.data.id }
          trigger:
            - call: "POST /agency/campaigns/${campaign_id}/complete"
              payload: {}
              as: AccountManager
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CAMPAIGN_HAS_OPEN_INTERVIEWS"

      - name: press_release_release_delivers_queued_distributions
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PressRelease.SCHEDULED_to_RELEASED
          - state_machines.Distribution
          - entities.Distribution.fields.delivered_at
        distinguishing_aspect: "Releasing a SCHEDULED PressRelease after embargo moves all QUEUED Distributions to DELIVERED with delivered_at = current clock (2026-03-15T00:00:00Z)."
        test_recipe:
          setup:
            - "An ACTIVE Campaign; ACTIVE MediaList + ACTIVE Journalist; a PressRelease with embargo_until=2026-03-15T00:00:00Z, scheduled while clock=2026-03-01; one QUEUED Distribution to the journalist; clock advanced to 2026-03-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Kappa", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Rel", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Rel Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Rel Jo", email: "rel@rt.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Rel List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/press-releases"
              payload: { campaign_id: "${campaign_id}", headline: "Big News", embargo_until: "2026-03-15T00:00:00Z" }
              as: MediaSpecialist
              captures: { pr_id: $.data.id }
            - call: "POST /agency/press-releases/${pr_id}/schedule"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/distributions"
              payload: { press_release_id: "${pr_id}", journalist_id: "${journalist_id}" }
              as: MediaSpecialist
              captures: { dist_id: $.data.id }
            - call: "POST /agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agency/press-releases/${pr_id}/release"
              payload: {}
              as: MediaSpecialist
          assert:
            - "PressRelease.${pr_id}.status == RELEASED"
            - "PressRelease.${pr_id}.released_at == 2026-03-15T00:00:00Z"
            - "Distribution.${dist_id}.status == DELIVERED"
            - "Distribution.${dist_id}.delivered_at == 2026-03-15T00:00:00Z"

      - name: withdraw_scheduled_press_release_bounces_queued_distributions
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PressRelease.SCHEDULED_to_WITHDRAWN
          - state_machines.Distribution
        distinguishing_aspect: "Withdrawing a SCHEDULED PressRelease moves all QUEUED Distributions to BOUNCED."
        test_recipe:
          setup:
            - "An ACTIVE Campaign; ACTIVE MediaList + ACTIVE Journalist; a SCHEDULED PressRelease (embargo future) with one QUEUED Distribution."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Lam", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Wd", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Wd Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Wd Jo", email: "wd@wt.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Wd List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/press-releases"
              payload: { campaign_id: "${campaign_id}", headline: "Pulled", embargo_until: "2026-03-20T00:00:00Z" }
              as: MediaSpecialist
              captures: { pr_id: $.data.id }
            - call: "POST /agency/press-releases/${pr_id}/schedule"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/distributions"
              payload: { press_release_id: "${pr_id}", journalist_id: "${journalist_id}" }
              as: MediaSpecialist
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /agency/press-releases/${pr_id}/withdraw"
              payload: {}
              as: MediaSpecialist
          assert:
            - "PressRelease.${pr_id}.status == WITHDRAWN"
            - "Distribution.${dist_id}.status == BOUNCED"

      - name: interview_reschedule_cycle_updates_times_in_place
        claim_type: Valid Transition
        grounds:
          - state_machines.Interview.REQUESTED_to_REQUESTED
          - entities.Interview.fields.starts_at
        distinguishing_aspect: "Rescheduling a REQUESTED Interview to non-overlapping times updates starts_at/ends_at in place and leaves status REQUESTED (cyclic self-edge)."
        test_recipe:
          setup:
            - "An ACTIVE Campaign; ACTIVE Spokesperson; ACTIVE Journalist; one REQUESTED Interview at [10:00,11:00)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Mu", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
