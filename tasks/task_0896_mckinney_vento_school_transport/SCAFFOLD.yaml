    path: "/mv/students"
    description: "Intake a student (status INTAKE, eligibility UNDETERMINED, PROVISIONAL priority)"
    roles: [Registrar, StateCoordinator]
    code: 201
    input: [first_name, last_name, birthdate, enrolled_district_id, origin_district_id, living_situation, "self_declared_category?", "records_received?"]
    output: Student
    side_effects:
      - "priority_score set to PROVISIONAL variant from living_situation; priority_basis=PROVISIONAL"
  - method: GET
    path: "/mv/students/{studentId}"
    description: "Get a student"
    roles: [StateCoordinator, TransportCoordinator, Liaison, Registrar]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/mv/students"
    description: "List students (reverse-reachability for enrolled_district_id, origin_district_id, liaison_id)"
    roles: [StateCoordinator, TransportCoordinator, Liaison, Registrar]
    code: 200
    input: ["enrolled_district_id?", "origin_district_id?", "liaison_id?", "limit?", "offset?"]
    output: Student[]
    side_effects: []
  - method: POST
    path: "/mv/students/{studentId}/enroll"
    description: "Immediate enrollment (INTAKE -> ENROLLED); succeeds regardless of records_received"
    roles: [Registrar, StateCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: ["status -> ENROLLED"]
  - method: POST
    path: "/mv/students/{studentId}/withdraw"
    description: "Withdraw a student (ENROLLED -> WITHDRAWN); cascades plan termination and benefit revocation"
    roles: [Registrar, StateCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: ["status -> WITHDRAWN", "cascade terminate plans", "cascade revoke ACTIVE BenefitLinks"]
  - method: POST
    path: "/mv/students/{studentId}/assign-liaison"
