# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Professional Licensing Exam Prep — Expert
# Breadth probe across §1.1–§1.7 surfaces; §1.8 covers the depth probe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_license_program_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.LicenseProgram, endpoints]
        distinguishing_aspect: "POST /license-programs with all required fields returns 201 and a LicenseProgram with status DRAFT and a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /license-programs"
              payload: { license_code: "C-CREATE", title: "Create", passing_scaled_score: 75, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
          assert:
            - "HTTP 201; LicenseProgram.${prog_id}.status == DRAFT"
            - "response data.license_code == C-CREATE and data.passing_scaled_score == 75"

      - name: get_enrollment_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Enrollment, endpoints]
        distinguishing_aspect: "GET /enrollments/{id} returns the previously created enrollment with status DRAFT."
        test_recipe:
          setup: ["A published program, a plan, a learner, and a DRAFT enrollment."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "C-GET", title: "Get", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "g@x.com", full_name: "G" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
          trigger:
            - call: "GET /enrollments/${enr_id}"
              as: Learner
              as_user_id: "${learner_id}"
          assert:
            - "HTTP 200; data.id == ${enr_id}; data.status == DRAFT"

      - name: list_license_programs_paginated_envelope
        claim_type: Listing
        grounds: [entities.LicenseProgram, endpoints]
        distinguishing_aspect: "GET /license-programs returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two programs created."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "L-1", title: "L1", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
            - call: "POST /license-programs"
              payload: { license_code: "L-2", title: "L2", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
          trigger:
            - call: "GET /license-programs"
              payload: { limit: 1, offset: 0 }
              as: ContentAdmin
          assert:
            - "response_type == array; meta.total_count >= 2; data length == 1; has_more == true"

      - name: get_nonexistent_enrollment_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Enrollment"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /enrollments/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000000"
              as: ContentAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_plan_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.SubscriptionPlan"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /subscription-plans omitting required total_price_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: plan_default_status_active
        claim_type: Defaults
        grounds: [entities.SubscriptionPlan.fields.status]
        distinguishing_aspect: "A plan created without an explicit status defaults to ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
          assert:
            - "SubscriptionPlan.${plan_id}.status == ACTIVE"

      - name: enrollment_computed_financing_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.Enrollment.fields.financing_total_due_cents, entities.Enrollment.fields.readiness_score]
        distinguishing_aspect: "On enrollment create, financing_total_due_cents is computed from the plan price (not client-supplied) and readiness_score initializes to 0."
        test_recipe:
          setup: ["Published program, BASIC plan total 30000, learner."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CF", title: "CF", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "cf@x.com", full_name: "CF" }
              as: Learner
              captures: { learner_id: "$.data.id" }
          trigger:
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
          assert:
            - "Enrollment.${enr_id}.financing_total_due_cents == 30000"
            - "Enrollment.${enr_id}.readiness_score == 0 and completed_mock_count == 0"

      - name: enrollment_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Enrollment.fields.status, entities.Enrollment.fields.version]
        distinguishing_aspect: "Server mints id/created_at/version and sets status=DRAFT; any client-sent status is ignored."
        test_recipe:
          setup: ["Published program, plan, learner."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "SF", title: "SF", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "sf@x.com", full_name: "SF" }
              as: Learner
              captures: { learner_id: "$.data.id" }
          trigger:
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id", v: "$.data.version" }
          assert:
            - "Enrollment.${enr_id}.version == 1; status == DRAFT; created_at present"

      - name: create_plan_invalid_tier_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.SubscriptionPlan.fields.tier"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /subscription-plans with tier=GOLD (not in BASIC|PLUS|PRO) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /subscription-plans"
              payload: { tier: "GOLD", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422; error_id == ERR_INVALID_REQUEST"

      - name: question_item_immutable_no_version
        claim_type: Immutability
        grounds: [entities.QuestionItem, endpoints]
        distinguishing_aspect: "QuestionItem has common_fields:false — no update/state endpoint exists; it is created once and only read via the program items list."
        test_recipe:
          setup: ["A DRAFT program with one item added."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "QI", title: "QI", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
              captures: { item_id: "$.data.id" }
          trigger:
            - call: "GET /license-programs/${prog_id}/items"
              as: ContentAdmin
          assert:
            - "list contains an item with id ${item_id}; QuestionItem carries no version field"

      - name: item_domain_not_in_blueprint_rejected
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_REFERENCE_INCOMPATIBLE]"
        distinguishing_aspect: "POST /license-programs/{id}/items with domain_code Z not in the program's blueprint returns ERR_REFERENCE_INCOMPATIBLE (409)."
        test_recipe:
          setup: ["A program whose blueprint has only domain A."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "ITDOM", title: "ItDom", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "Z", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_REFERENCE_INCOMPATIBLE"

      - name: ce_bundle_fk_filtered_list_reverse_reachable
        claim_type: Parent Relationships
        grounds: [entities.CEBundle.fields.license_program_id, endpoints]
        distinguishing_aspect: "GET /ce-bundles?license_program_id=<prog> returns only bundles for that program (FK reverse-reachability)."
        test_recipe:
          setup: ["A program with one CE bundle."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CEB", title: "CEB", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /ce-bundles"
              payload: { license_program_id: "${prog_id}", ce_credits_total: 12, modules_total: 4 }
              as: ContentAdmin
              captures: { bundle_id: "$.data.id" }
          trigger:
            - call: "GET /ce-bundles"
              payload: { license_program_id: "${prog_id}" }
              as: ContentAdmin
          assert:
            - "response_type == array; every item.license_program_id == ${prog_id}; contains ${bundle_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_program_initial_to_published
        claim_type: Valid Transition
        grounds: [state_machines.LicenseProgram.DRAFT_to_PUBLISHED]
        distinguishing_aspect: "A DRAFT program with >=1 item and valid weights publishes to PUBLISHED (200) and version increments to 2."
        test_recipe:
          setup: ["DRAFT program with one item."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "PUB", title: "Pub", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
          trigger:
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
          assert:
            - "LicenseProgram.${prog_id}.status == PUBLISHED and version == 2"

      - name: publish_program_with_no_items_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.LicenseProgram.DRAFT_to_PUBLISHED"
          - "errors[ERR_PROGRAM_HAS_NO_ITEMS]"
        distinguishing_aspect: "Publishing a DRAFT program with zero QuestionItems returns ERR_PROGRAM_HAS_NO_ITEMS (409)."
        test_recipe:
          setup: ["DRAFT program, no items."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "NOITEM", title: "NoItem", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_PROGRAM_HAS_NO_ITEMS; status still DRAFT"

      - name: publish_program_bad_weights_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.LicenseProgram.DRAFT_to_PUBLISHED"
          - "errors[ERR_BLUEPRINT_WEIGHTS_INVALID]"
        distinguishing_aspect: "Publishing a program whose domain_weights sum to 0.90 (not 1.00) returns ERR_BLUEPRINT_WEIGHTS_INVALID (409)."
        test_recipe:
          setup: ["DRAFT program with weights summing to 0.90 and one item."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "BADW", title: "BadW", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 0.60 }, { domain_code: "B", weight: 0.30 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
          trigger:
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_BLUEPRINT_WEIGHTS_INVALID"

      - name: activate_enrollment_materializes_study_plan_domains
        claim_type: Side Effect Execution
        grounds: [state_machines.Enrollment.DRAFT_to_ACTIVE, entities.StudyPlanDomain]
        distinguishing_aspect: "Activating a 3-domain enrollment materializes exactly 3 StudyPlanDomain rows each with mastery 50 and the program's weights."
        test_recipe:
          setup: ["Published 3-domain program (A .5/B .3/C .2), BASIC plan, DRAFT enrollment."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "SPD", title: "SPD", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 0.50 }, { domain_code: "B", weight: 0.30 }, { domain_code: "C", weight: 0.20 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "spd@x.com", full_name: "SPD" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "GET /enrollments/${enr_id}/domains"
              as: Learner
              as_user_id: "${learner_id}"
          assert:
            - "Enrollment.${enr_id}.status == ACTIVE"
            - "GET domains returns total_count == 3; each mastery == 50; weights are 0.50/0.30/0.20"

      - name: activate_already_active_enrollment_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Enrollment"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling activate on an already-ACTIVE enrollment returns ERR_INVALID_STATE (409); no side effects re-fire."
        test_recipe:
          setup: ["An ACTIVE paid-in-full enrollment."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "AA", title: "AA", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "aa@x.com", full_name: "AA" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: certify_exam_twice_already_certified
        claim_type: Idempotency
        grounds:
          - "state_machines.Enrollment.ACTIVE_to_FAILED"
          - "errors[ERR_EXAM_ALREADY_CERTIFIED]"
        distinguishing_aspect: "Certifying a second outcome on an enrollment whose exam_outcome != PENDING returns ERR_EXAM_ALREADY_CERTIFIED (409)."
        test_recipe:
          setup: ["An ACTIVE enrollment already certified FAIL."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CT2", title: "CT2", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "ct2@x.com", full_name: "CT2" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/certify-exam"
              payload: { outcome: "FAIL" }
              as: ExamProctor
          trigger:
            - call: "POST /enrollments/${enr_id}/certify-exam"
              payload: { outcome: "PASS" }
              as: ExamProctor
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_EXAM_ALREADY_CERTIFIED; status still FAILED"

      - name: cohort_open_to_full_then_full_to_open_compound
        claim_type: Bubble up
        grounds: [state_machines.Cohort.OPEN_to_FULL, state_machines.Cohort.FULL_to_OPEN, entities.Cohort.fields.seats_taken]
        distinguishing_aspect: "Joining a capacity-1 cohort flips OPEN->FULL (seats_taken 1); dropping that membership flips FULL->OPEN (seats_taken 0)."
        test_recipe:
          setup: ["A capacity-1 cohort and one ACTIVE enrollment on the same program."]
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CFL", title: "CFL", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
