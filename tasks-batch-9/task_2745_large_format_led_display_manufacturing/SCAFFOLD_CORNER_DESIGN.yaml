              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj1: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Tier Floor Two", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj2: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Tier Floor Three", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj3: $.data.id }
          trigger:
            - call: "POST /service-contracts"
              payload: { project_id: "${pj1}", tier: "GOLD", spare_pct_bp: 299, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
            - call: "POST /service-contracts"
              payload: { project_id: "${pj2}", tier: "GOLD", spare_pct_bp: 300, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { sc_gold: $.data.id }
            - call: "POST /service-contracts"
              payload: { project_id: "${pj3}", tier: "SILVER", spare_pct_bp: 299, term_months: 60 }
