scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: projected_vs_actual_batch_yield_diverge
        grounds:
          - calculations.plantable_yield_projection
          - entities.CropBatch.fields.projected_plantable
          - entities.CropBatch.fields.plantable_count
        distinguishing_aspect: |
          Production-domain dual variant: the forward-looking estimate floor(300 * 88 * 0.85 * 0.88) = 19747
          is computed at sow, while the physical grading variant records plantable_count = 20000 for the same
          batch; the two algorithms legitimately disagree on identical seed-lot inputs.
        test_recipe:
          setup:
            - "Seed zone Z-SRC exists; seed lot of 500 g DOUGLAS_FIR with germination 0.85"
            - "Crop batch sown with 300 g, then lifted 21000, then graded 20000 plantable"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-SRC", min_elevation_ft: 1000, max_elevation_ft: 2000 }, as: NurseryManager, captures: { z_src: $.data.id } }
            - { call: "POST /reforestation/seed-lots", payload: { source_zone_id: "${z_src}", species: "DOUGLAS_FIR", collected_on: "2026-07-15", quantity_grams: 500, germination_pct: 0.85 }, as: NurseryManager, captures: { lot_id: $.data.id, lot_v: $.data.version } }
            - { call: "POST /reforestation/crop-batches", payload: { seed_lot_id: "${lot_id}", planned_sow_date: "2026-09-01", lift_window_start: "2027-03-01", lift_window_end: "2027-03-31", expected_seed_lot_version: "${lot_v}" }, as: NurseryManager, captures: { b_id: $.data.id } }
            - { call: "POST /reforestation/crop-batches/${b_id}/sow", payload: { actual_sow_date: "2026-09-01", sown_grams: 300 }, as: NurseryManager, captures: { b_proj: $.data.projected_plantable } }
            - { call: "POST /reforestation/crop-batches/${b_id}/lift", payload: { lifted_on: "2027-03-10", lifted_count: 21000 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/grade", payload: { plantable_count: 20000 }, as: NurseryManager, captures: { b_cull: $.data.cull_count, b_plant: $.data.plantable_count } }
          trigger:
            - { call: "GET /reforestation/crop-batches/${b_id}", payload: {}, as: NurseryManager }
          assert:
            - "captured b_proj == 19747 (forward-looking variant: floor(300 * 88 * 0.85 * 0.88))"
            - "captured b_plant == 20000 (actual grading variant)"
            - "b_proj != b_plant: the two variants disagree by 253 seedlings on identical inputs"
            - "captured b_cull == 1000 (cull_count = lifted_count - plantable_count)"
      - name: survey_threshold_standard_vs_cost_share
        grounds:
          - calculations.survival_pct_and_threshold
          - entities.SurvivalSurvey.fields.threshold_pct
          - state_machines.PlantingContract.SURVEYED_to_CLOSED
          - state_machines.PlantingContract.SURVEYED_to_REPLANT_REQUIRED
        distinguishing_aspect: |
          Field-survival-domain dual variant (different entity domain from the production-yield instance):
          two contracts surveyed with identical alive/planted data (3000/4000 = 75.00 pct) diverge purely on
          landowner funding context — the standard contract passes at 70.00 and closes, the cost-share-backed
          contract fails at 80.00 and opens a replant obligation.
        test_recipe:
          setup:
            - "Landowner A with no enrollment; landowner B with an APPROVED cost-share enrollment"
            - "Two identical contracts (10 acres, 400 TPA, contingency 0) each fully planted at 4000 seedlings"
            - "Both surveyed on 2028-02-15 with alive_count 3000"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-SRC", min_elevation_ft: 1000, max_elevation_ft: 2000 }, as: NurseryManager, captures: { z_src: $.data.id } }
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-DST", min_elevation_ft: 1400, max_elevation_ft: 2400 }, as: NurseryManager, captures: { z_dst: $.data.id } }
            - { call: "POST /reforestation/landowners", payload: { legal_name: "Owner A", contact_email: "a@x.com", tax_id: "T-A" }, as: ContractOfficer, captures: { lo_a: $.data.id } }
            - { call: "POST /reforestation/landowners", payload: { legal_name: "Owner B", contact_email: "b@x.com", tax_id: "T-B" }, as: ContractOfficer, captures: { lo_b: $.data.id } }
            - { call: "POST /reforestation/seed-lots", payload: { source_zone_id: "${z_src}", species: "DOUGLAS_FIR", collected_on: "2026-07-15", quantity_grams: 200, germination_pct: 0.85 }, as: NurseryManager, captures: { lot_id: $.data.id, lot_v: $.data.version } }
            - { call: "POST /reforestation/crop-batches", payload: { seed_lot_id: "${lot_id}", planned_sow_date: "2026-09-01", lift_window_start: "2027-03-01", lift_window_end: "2027-03-31", expected_seed_lot_version: "${lot_v}" }, as: NurseryManager, captures: { b_id: $.data.id } }
            - { call: "POST /reforestation/crop-batches/${b_id}/sow", payload: { actual_sow_date: "2026-09-01", sown_grams: 100 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/lift", payload: { lifted_on: "2027-03-10", lifted_count: 9500 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/grade", payload: { plantable_count: 9000 }, as: NurseryManager }
            - { call: "POST /reforestation/seedling-orders", payload: { landowner_id: "${lo_a}", destination_zone_id: "${z_dst}", species: "DOUGLAS_FIR", quantity: 4000, requested_ship_date: "2027-04-05" }, as: Landowner, as_user_id: "${lo_a}", captures: { o_a: $.data.id } }
            - { call: "POST /reforestation/seedling-orders/${o_a}/confirm", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/seedling-orders/${o_a}/allocations", payload: { crop_batch_id: "${b_id}", quantity: 4000 }, as: ContractOfficer }
            - { call: "POST /reforestation/seedling-orders", payload: { landowner_id: "${lo_b}", destination_zone_id: "${z_dst}", species: "DOUGLAS_FIR", quantity: 4000, requested_ship_date: "2027-04-05" }, as: Landowner, as_user_id: "${lo_b}", captures: { o_b: $.data.id } }
            - { call: "POST /reforestation/seedling-orders/${o_b}/confirm", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/seedling-orders/${o_b}/allocations", payload: { crop_batch_id: "${b_id}", quantity: 4000 }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts", payload: { landowner_id: "${lo_a}", seedling_order_id: "${o_a}", site_zone_id: "${z_dst}", acres: 10, trees_per_acre: 400, contingency_pct: 0, planting_window_start: "2027-04-01", planting_window_end: "2027-04-30" }, as: ContractOfficer, captures: { c_a: $.data.id } }
            - { call: "POST /reforestation/planting-contracts", payload: { landowner_id: "${lo_b}", seedling_order_id: "${o_b}", site_zone_id: "${z_dst}", acres: 10, trees_per_acre: 400, contingency_pct: 0, planting_window_start: "2027-04-01", planting_window_end: "2027-04-30" }, as: ContractOfficer, captures: { c_b: $.data.id } }
            - { call: "POST /reforestation/cost-share-enrollments", payload: { landowner_id: "${lo_b}", program_code: "EQIP-27", enrolled_acres: 10, rate_per_acre_cents: 15000, cap_cents: 200000 }, as: Landowner, as_user_id: "${lo_b}", captures: { e_b: $.data.id } }
            - { call: "POST /reforestation/cost-share-enrollments/${e_b}/submit", payload: { documented_acres: 10, documented_cost_cents: 90000 }, as: Landowner, as_user_id: "${lo_b}" }
            - { call: "POST /reforestation/cost-share-enrollments/${e_b}/approve", payload: {}, as: ProgramAdministrator }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2027-03-15T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/planting-contracts/${c_a}/record-site-prep", payload: { herbicide_applied_on: "2027-03-01" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_a}/verify-site-prep", payload: {}, as: FieldAuditor }
            - { call: "POST /reforestation/planting-contracts/${c_a}/mark-ready", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_b}/record-site-prep", payload: { herbicide_applied_on: "2027-03-01" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_b}/verify-site-prep", payload: {}, as: FieldAuditor }
            - { call: "POST /reforestation/planting-contracts/${c_b}/mark-ready", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/crews", payload: { crew_code: "CR-1", capacity_per_day: 2000 }, as: ContractOfficer, captures: { crew_id: $.data.id } }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_a}", start_date: "2027-04-01", end_date: "2027-04-03", planned_seedlings: 4000 }, as: ContractOfficer, captures: { asg_a: $.data.id } }
            - { call: "POST /reforestation/crew-assignments/${asg_a}/confirm", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_b}", start_date: "2027-04-06", end_date: "2027-04-08", planned_seedlings: 4000 }, as: ContractOfficer, captures: { asg_b: $.data.id } }
            - { call: "POST /reforestation/crew-assignments/${asg_b}/confirm", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/storage-units", payload: { unit_code: "CU-1", capacity_units: 20000, temp_min_c: -2, temp_max_c: 2 }, as: NurseryManager, captures: { unit_id: $.data.id } }
            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 9000, placed_on: "2027-03-12" }, as: NurseryManager }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/planting-contracts/${c_a}/start-planting", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/shipments", payload: { planting_contract_id: "${c_a}", crop_batch_id: "${b_id}", quantity: 4000 }, as: NurseryManager, captures: { sh_a: $.data.id } }
            - { call: "POST /reforestation/shipments/${sh_a}/deliver", payload: { delivered_at: "2027-04-01T08:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/shipments/${sh_a}/confirm-planted", payload: { planted_confirmed_at: "2027-04-02T09:00:00Z" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_a}/complete-planting", payload: { planted_qty: 4000 }, as: ContractOfficer }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2027-04-06T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/planting-contracts/${c_b}/start-planting", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/shipments", payload: { planting_contract_id: "${c_b}", crop_batch_id: "${b_id}", quantity: 4000 }, as: NurseryManager, captures: { sh_b: $.data.id } }
            - { call: "POST /reforestation/shipments/${sh_b}/deliver", payload: { delivered_at: "2027-04-06T08:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/shipments/${sh_b}/confirm-planted", payload: { planted_confirmed_at: "2027-04-07T09:00:00Z" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_b}/complete-planting", payload: { planted_qty: 4000 }, as: ContractOfficer }
          trigger:
            - { call: "POST /reforestation/survival-surveys", payload: { planting_contract_id: "${c_a}", surveyed_on: "2028-02-15", alive_count: 3000 }, as: FieldAuditor, captures: { sv_a: $.data.id, sv_a_pct: $.data.survival_pct, sv_a_thr: $.data.threshold_pct } }
            - { call: "POST /reforestation/survival-surveys", payload: { planting_contract_id: "${c_b}", surveyed_on: "2028-02-15", alive_count: 3000 }, as: FieldAuditor, captures: { sv_b_pct: $.data.survival_pct, sv_b_thr: $.data.threshold_pct, sv_b_obl: $.data.obligation_status, sv_b_owed: $.data.owed_quantity } }
            - { call: "GET /reforestation/planting-contracts/${c_a}", payload: {}, as: ContractOfficer, captures: { c_a_status: $.data.status } }
            - { call: "GET /reforestation/planting-contracts/${c_b}", payload: {}, as: ContractOfficer, captures: { c_b_status: $.data.status } }
          assert:
            - "sv_a_pct == 75.00 and sv_b_pct == 75.00 (identical survey data)"
            - "sv_a_thr == 70.00 (standard variant) and sv_b_thr == 80.00 (cost-share variant)"
            - "c_a_status == CLOSED (75.00 >= 70.00 passes)"
            - "c_b_status == REPLANT_REQUIRED (75.00 < 80.00 fails)"
            - "sv_b_obl == OPEN and sv_b_owed == 200 (required_surviving ceil(4000*0.80)=3200 minus 3000 alive)"
  - rule_id: combinatorial_formula
    instances:
      - name: replant_owed_first_vs_repeat_escalation
        grounds:
          - calculations.replant_owed_quantity
          - entities.PlantingContract.fields.obligation_count
          - entities.SurvivalSurvey.fields.owed_quantity
        distinguishing_aspect: |
          Mode (a) combinatorial: nested min/max with a conditional branch on obligation_count —
          the first below-threshold survey owes max(0, ceil(18060*0.70) - 11000) = 1642, while the second
          failure escalates to ceil(642 * 1.25) = 803; caps min(planted, owed) and min(2*planted, ...) bound both.
        test_recipe:
          setup:
            - "Contract 40 acres x 430 TPA x 1.05 contingency -> required_seedlings 18060; order 19000 fully allocated; planted 18060"
            - "First survey 11000 alive -> below 70.00; replant cycle completed; second survey 12000 alive -> below again"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-SRC", min_elevation_ft: 1000, max_elevation_ft: 2000 }, as: NurseryManager, captures: { z_src: $.data.id } }
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-DST", min_elevation_ft: 1400, max_elevation_ft: 2400 }, as: NurseryManager, captures: { z_dst: $.data.id } }
            - { call: "POST /reforestation/landowners", payload: { legal_name: "Owner R", contact_email: "r@x.com", tax_id: "T-R" }, as: ContractOfficer, captures: { lo_id: $.data.id } }
            - { call: "POST /reforestation/seed-lots", payload: { source_zone_id: "${z_src}", species: "DOUGLAS_FIR", collected_on: "2026-07-15", quantity_grams: 500, germination_pct: 0.85 }, as: NurseryManager, captures: { lot_id: $.data.id, lot_v: $.data.version } }
            - { call: "POST /reforestation/crop-batches", payload: { seed_lot_id: "${lot_id}", planned_sow_date: "2026-09-01", lift_window_start: "2027-03-01", lift_window_end: "2027-03-31", expected_seed_lot_version: "${lot_v}" }, as: NurseryManager, captures: { b_id: $.data.id } }
            - { call: "POST /reforestation/crop-batches/${b_id}/sow", payload: { actual_sow_date: "2026-09-01", sown_grams: 300 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/lift", payload: { lifted_on: "2027-03-10", lifted_count: 21000 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/grade", payload: { plantable_count: 20000 }, as: NurseryManager }
            - { call: "POST /reforestation/seedling-orders", payload: { landowner_id: "${lo_id}", destination_zone_id: "${z_dst}", species: "DOUGLAS_FIR", quantity: 19000, requested_ship_date: "2027-04-05" }, as: Landowner, as_user_id: "${lo_id}", captures: { o_id: $.data.id } }
            - { call: "POST /reforestation/seedling-orders/${o_id}/confirm", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/seedling-orders/${o_id}/allocations", payload: { crop_batch_id: "${b_id}", quantity: 19000 }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts", payload: { landowner_id: "${lo_id}", seedling_order_id: "${o_id}", site_zone_id: "${z_dst}", acres: 40, trees_per_acre: 430, contingency_pct: 0.05, planting_window_start: "2027-04-01", planting_window_end: "2028-12-31" }, as: ContractOfficer, captures: { c_id: $.data.id, c_req: $.data.required_seedlings } }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2027-03-15T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/planting-contracts/${c_id}/record-site-prep", payload: { herbicide_applied_on: "2027-03-01" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_id}/verify-site-prep", payload: {}, as: FieldAuditor }
            - { call: "POST /reforestation/planting-contracts/${c_id}/mark-ready", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/crews", payload: { crew_code: "CR-1", capacity_per_day: 5000 }, as: ContractOfficer, captures: { crew_id: $.data.id } }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_id}", start_date: "2027-04-01", end_date: "2027-04-05", planned_seedlings: 18060 }, as: ContractOfficer, captures: { asg_1: $.data.id } }
            - { call: "POST /reforestation/crew-assignments/${asg_1}/confirm", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/storage-units", payload: { unit_code: "CU-1", capacity_units: 25000, temp_min_c: -2, temp_max_c: 2 }, as: NurseryManager, captures: { unit_id: $.data.id } }
            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 20000, placed_on: "2027-03-12" }, as: NurseryManager }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/planting-contracts/${c_id}/start-planting", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/shipments", payload: { planting_contract_id: "${c_id}", crop_batch_id: "${b_id}", quantity: 18060 }, as: NurseryManager, captures: { sh_1: $.data.id } }
            - { call: "POST /reforestation/shipments/${sh_1}/deliver", payload: { delivered_at: "2027-04-01T08:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/shipments/${sh_1}/confirm-planted", payload: { planted_confirmed_at: "2027-04-02T09:00:00Z" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_id}/complete-planting", payload: { planted_qty: 18060 }, as: ContractOfficer }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2028-02-15T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/survival-surveys", payload: { planting_contract_id: "${c_id}", surveyed_on: "2028-02-15", alive_count: 11000 }, as: FieldAuditor, captures: { sv_1: $.data.id, owed_1: $.data.owed_quantity } }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2028-06-01T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/survival-surveys/${sv_1}/schedule-replant", payload: { replant_date: "2028-06-10" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_id}/record-site-prep", payload: { herbicide_applied_on: "2028-05-20" }, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_id}/verify-site-prep", payload: {}, as: FieldAuditor }
            - { call: "POST /reforestation/planting-contracts/${c_id}/mark-ready", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/crew-assignments", payload: { crew_id: "${crew_id}", planting_contract_id: "${c_id}", start_date: "2028-06-10", end_date: "2028-06-12", planned_seedlings: 1642 }, as: ContractOfficer, captures: { asg_2: $.data.id } }
            - { call: "POST /reforestation/crew-assignments/${asg_2}/confirm", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2028-06-10T00:00:00Z" }, as: NurseryManager }
            - { call: "POST /reforestation/planting-contracts/${c_id}/start-planting", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/planting-contracts/${c_id}/complete-planting", payload: { planted_qty: 1642 }, as: ContractOfficer }
            - { call: "POST /reforestation/survival-surveys/${sv_1}/fulfill-replant", payload: {}, as: ContractOfficer }
            - { call: "POST /reforestation/_clock/set_current_utc", payload: { to_iso8601: "2029-05-01T00:00:00Z" }, as: NurseryManager }
          trigger:
            - { call: "POST /reforestation/survival-surveys", payload: { planting_contract_id: "${c_id}", surveyed_on: "2029-05-01", alive_count: 12000 }, as: FieldAuditor, captures: { owed_2: $.data.owed_quantity, obl_2: $.data.obligation_status } }
          assert:
            - "c_req == 18060 (ceil(40 * 430 * 1.05))"
            - "owed_1 == 1642 (first failure: max(0, ceil(18060*0.70) - 11000) = 12642 - 11000, no escalation)"
            - "owed_2 == 803 (repeat failure: base 12642 - 12000 = 642 escalated ceil(642 * 1.25) = 803, below caps)"
            - "obl_2 == OPEN"
      - name: cost_share_award_component_rounding
        grounds:
          - calculations.cost_share_award
          - entities.CostShareEnrollment.fields.provisional_award_cents
          - entities.CostShareEnrollment.fields.final_award_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order pinned — base rounded, bonus rounded on the rounded
          base, then summed: round(33.33*15001)=499983 plus round(499983*0.10)=49998 gives 549981;
          the forbidden sum-then-round yields 549982. Provisional (enrolled 40 acres) diverges at 660044.
        test_recipe:
          setup:
            - "Landowner with enrollment: enrolled_acres 40, rate 15001 cents/acre, cap 99999999"
            - "Documentation submitted with documented_acres 33.33, then approved"
          setup_api_calls:
            - { call: "POST /reforestation/landowners", payload: { legal_name: "Owner E", contact_email: "e@x.com", tax_id: "T-E" }, as: ContractOfficer, captures: { lo_id: $.data.id } }
            - { call: "POST /reforestation/cost-share-enrollments", payload: { landowner_id: "${lo_id}", program_code: "EQIP-27", enrolled_acres: 40, rate_per_acre_cents: 15001, cap_cents: 99999999 }, as: Landowner, as_user_id: "${lo_id}", captures: { e_id: $.data.id, prov_create: $.data.provisional_award_cents } }
            - { call: "POST /reforestation/cost-share-enrollments/${e_id}/submit", payload: { documented_acres: 33.33, documented_cost_cents: 499983 }, as: Landowner, as_user_id: "${lo_id}", captures: { prov_submit: $.data.provisional_award_cents } }
          trigger:
            - { call: "POST /reforestation/cost-share-enrollments/${e_id}/approve", payload: {}, as: ProgramAdministrator, captures: { final_award: $.data.final_award_cents } }
          assert:
            - "prov_create == 660044 (round(40*15001)=600040 base + round(600040*0.10)=60004 bonus)"
            - "prov_submit == 549981 (documented 33.33 basis: 499983 + 49998)"
            - "final_award == 549981 (per-component rounding; sum-then-round would give 549982)"
            - "prov_create != final_award (provisional vs final variant divergence)"
      - name: order_price_tier_keyed_on_prediscount_subtotal
        grounds:
          - calculations.order_total_price
          - entities.SeedlingOrder.fields.total_price_cents
          - concurrency_rules[order-amend-stale-order]
        distinguishing_aspect: |
          Mode (c) combinatorial: the discount tier is keyed on the PRE-discount subtotal (pinned evaluation
          order) — quantity 16000 at 320 cents gives subtotal 5120000 (>= 5000000 -> 15 pct) so total is
          4352000; keying the tier on the post-discount total (4352000 -> 10 pct) would give 4608000.
        test_recipe:
          setup:
            - "Zone and landowner exist; order for 16000 DOUGLAS_FIR at 320 cents"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-DST", min_elevation_ft: 1400, max_elevation_ft: 2400 }, as: NurseryManager, captures: { z_dst: $.data.id } }
            - { call: "POST /reforestation/landowners", payload: { legal_name: "Owner P", contact_email: "p@x.com", tax_id: "T-P" }, as: ContractOfficer, captures: { lo_id: $.data.id } }
            - { call: "POST /reforestation/seedling-orders", payload: { landowner_id: "${lo_id}", destination_zone_id: "${z_dst}", species: "DOUGLAS_FIR", quantity: 16000, requested_ship_date: "2027-04-05" }, as: Landowner, as_user_id: "${lo_id}", captures: { o_id: $.data.id, o_v: $.data.version, total_16k: $.data.total_price_cents } }
          trigger:
            - { call: "POST /reforestation/seedling-orders/${o_id}/amend", payload: { quantity: 10000, expected_seedling_order_version: "${o_v}" }, as: Landowner, as_user_id: "${lo_id}", captures: { total_10k: $.data.total_price_cents, o_status: $.data.status } }
          assert:
            - "total_16k == 4352000 (pre-discount subtotal 5120000 selects the 15 pct tier)"
            - "total_16k != 4608000 (the value the forbidden post-discount tiering would produce)"
            - "total_10k == 2880000 (subtotal 3200000 -> 10 pct tier after amend)"
            - "o_status == PENDING_REVIEW (amend reopens review)"
  - rule_id: non_linear_state_machine
    instances:
      - name: seed_lot_quarantine_release_cycle
        grounds:
          - state_machines.SeedLot.AVAILABLE_to_QUARANTINED
          - state_machines.SeedLot.QUARANTINED_to_AVAILABLE
          - validations[priority=6]
        distinguishing_aspect: |
          Cyclic machine on SeedLot: AVAILABLE -> QUARANTINED -> AVAILABLE -> QUARANTINED -> AVAILABLE
          traverses the loop twice with no loop limit, and the retest germination (0.90) overwrites the
          original 0.85, shifting projected_plantable for batches sown afterwards (floor(300*88*0.90*0.88)=20908).
        test_recipe:
          setup:
            - "Zone Z-SRC; lot 500 g DOUGLAS_FIR germination 0.85; batch planned against it"
          setup_api_calls:
            - { call: "POST /reforestation/seed-zones", payload: { zone_code: "Z-SRC", min_elevation_ft: 1000, max_elevation_ft: 2000 }, as: NurseryManager, captures: { z_src: $.data.id } }
