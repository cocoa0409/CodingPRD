        grounds: ["concurrency_rules[gear-assign-stale-gear-version]", "errors[ERR_STALE_GEAR_VERSION]", "validations[priority=8]"]
        distinguishing_aspect: "The acceptance inspection bumps RiggingGear.version from 1 to 2, so an assignment still carrying version 1 is rejected with ERR_STALE_GEAR_VERSION (412) — a different parent entity and error code from the LiftPlan OCC rule."
        test_recipe:
          setup: ["A SURVEYED plan exists; a sling was created (version 1) and then passed inspection (version 2)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { account_name: "Harborline Fabricators" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /sites"
              payload: { customer_id: "${cust_id}", address_label: "Pier 9 Yard", jurisdiction_code: "NJ-HUDSON", soil_bearing_capacity_psf: 3500 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /lift-plans"
              payload: { site_id: "${site_id}", job_reference: "JOB-9801", window_start: "2026-09-10T06:00:00Z", window_end: "2026-09-10T16:00:00Z", load_weight_lb: 60000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /lift-plans/${plan_id}/site-survey"
              payload: { confirmed_soil_bearing_capacity_psf: 3500, access_notes: "apron", mat_inventory_available: true }
              as: Dispatcher
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-5001", gear_type: "SLING", rated_wll_lb: 30000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id, gear_v0: $.data.version }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "acceptance" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: Dispatcher
              captures: { gear_v1: $.data.version }
          trigger:
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 4, sling_angle_deg: 60, expected_gear_version: "${gear_v0}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /gear-assignments"
              payload: { lift_plan_id: "${plan_id}", gear_id: "${gear_id}", leg_count: 4, sling_angle_deg: 60, expected_gear_version: "${gear_v1}" }
              as: Dispatcher
              captures: { ga_id: $.data.id, ga_st: $.data.status }
          assert:
            - "${gear_v0} == 1 and ${gear_v1} == 2"
            - "${err} == ERR_STALE_GEAR_VERSION with HTTP 412"
            - "${ga_st} == ACTIVE"
            - "RiggingGear.${gear_id}.committed_assignment_count == 1 and RiggingGear.${gear_id}.version == 3"

      - name: stale_expected_lift_plan_version_on_invoice_create_returns_412
        claim_type: optimistic_concurrency
