  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: offer_on_a_stale_tract_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tract-offer-supersede]
          - validations[ERR_STALE_TRACT_VERSION].check
        distinguishing_aspect: "The tract's version advanced when the first offer was extended, so a re-offer quoting the version read at creation time is refused with ERR_STALE_TRACT_VERSION (412) at priority 7 — before the offer-round cap at 30 — and offer_round stays 1 with the first offer's compensation intact."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE; tract on segment 1 created at version 1 and then OFFERED (version 2)"
          setup_api_calls: *cCERT
          trigger:
            - *c32
            - *c41
            - *c42
            - call: "POST /siting/easement-tracts/${tract1}/offers"
              payload: { expected_tract_version: "${t1v}", offer_note: "Sweetened offer from a stale view" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_TRACT_VERSION"
            - "EasementTract.${tract1}.offer_round == 1"
            - "EasementTract.${tract1}.offered_compensation_cents == 4163406"
            - "EasementTract.${tract1}.acquisition_status == OFFERED"
            - "EasementTract.${tract1}.version == ${t1v2}"

      - name: offer_on_the_current_tract_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[tract-offer-supersede]
          - state_machines.EasementTract.REJECTED_to_OFFERED
        distinguishing_aspect: "The same endpoint with the version returned by the landowner's rejection succeeds: the tract re-enters OFFERED at offer_round 2 with an escalated quote and its version advances again, showing the OCC token is a moving target rather than a constant."
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE; tract offered once and REJECTED by the landowner"
          setup_api_calls: *cCERT
          trigger:
            - *c32
            - *c41
            - *c42
            - *c44
            - call: "POST /siting/easement-tracts/${tract1}/offers"
              payload: { expected_tract_version: "${t1v3}", offer_note: "Round two after rejection" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { t1v4: "$.data.version" }
          assert:
            - "response.status == 201"
            - "EasementTract.${tract1}.acquisition_status == OFFERED"
            - "EasementTract.${tract1}.offer_round == 2"
            - "EasementTract.${tract1}.offered_compensation_cents > 4163406"
            - "EasementTract.${tract1}.agreed_compensation_cents == null"

      - name: amendment_on_a_stale_application_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[application-amendment-supersede]
          - validations[ERR_STALE_APPLICATION_VERSION].check
        distinguishing_aspect: "The deficiency ruling bumped the docket's version, so an amendment quoting the version read while the filing was still FILED is refused with ERR_STALE_APPLICATION_VERSION (412) — the statutory clock is not restarted, amendment_round stays 0 and the deficiency note survives."
        test_recipe:
          setup:
            - "Application FILED at 2026-08-31, then returned DEFICIENT by commission staff"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - *c04
            - *c05
            - *c06
            - *c07
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c13
            - *c14
            - *c15
            - *c16
            - *c17
            - *c18
            - *c19
            - *c20
            - *c21
            - *c22
            - *c23
          trigger:
            - call: "GET /siting/applications/${app}"
              payload: {}
              as: Developer
              as_user_id: "dev-fila"
              captures: { appv1: "$.data.version" }
            - call: "POST /siting/applications/${app}/sufficiency-review"
              payload: { outcome: "REJECT", deficiency_note: "Impact assessment for the alternate route is missing" }
              as: CommissionStaff
              as_user_id: "staff-lin"
            - call: "POST /siting/applications/${app}/amendments"
              payload: { expected_application_version: "${appv1}", amendment_summary: "Alternate route impact assessment added" }
              as: Developer
              as_user_id: "dev-fila"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_APPLICATION_VERSION"
            - "SitingApplication.${app}.review_status == DEFICIENT"
            - "SitingApplication.${app}.amendment_round == 0"
            - "SitingApplication.${app}.deficiency_note == Impact assessment for the alternate route is missing"
            - "SitingApplication.${app}.filed_at == 2026-08-31T00:00:00Z"

      - name: amendment_on_the_current_application_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[application-amendment-supersede]
          - state_machines.SitingApplication.DEFICIENT_to_FILED
        distinguishing_aspect: "With the version returned by the deficiency ruling the amendment lands: review_status returns to FILED, amendment_round becomes 1 and filed_at plus decision_deadline_at are restamped from the logical clock moved to 2026-10-04, which is exactly the write the stale token was protecting."
        test_recipe:
          setup:
            - "Application FILED at 2026-08-31, then returned DEFICIENT (version advanced)"
            - "Logical clock moved to 2026-10-04T00:00:00Z before the amendment"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - *c04
            - *c05
            - *c06
            - *c07
            - *c08
            - *c09
            - *c10
            - *c11
            - *c12
            - *c13
            - *c14
            - *c15
            - *c16
            - *c17
            - *c18
            - *c19
            - *c20
            - *c21
            - *c22
            - *c23
          trigger:
            - call: "POST /siting/applications/${app}/sufficiency-review"
              payload: { outcome: "REJECT", deficiency_note: "Impact assessment for the alternate route is missing" }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { appv2: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-04T00:00:00Z" }
              as: Developer
              as_user_id: "dev-fila"
            - call: "POST /siting/applications/${app}/amendments"
              payload: { expected_application_version: "${appv2}", amendment_summary: "Alternate route impact assessment added" }
              as: Developer
              as_user_id: "dev-fila"
          assert:
            - "response.status == 201"
            - "SitingApplication.${app}.review_status == FILED"
            - "SitingApplication.${app}.amendment_round == 1"
            - "SitingApplication.${app}.deficiency_note == null"
            - "SitingApplication.${app}.filed_at == 2026-10-04T00:00:00Z"
            - "SitingApplication.${app}.decision_deadline_at == 2027-10-04T00:00:00Z"
            - "SitingApplication.${app}.record_status == SCHEDULING"
            - "Project.${proj}.slack_days == 180"

      - name: non_transmission_selector_ranks_the_eligible_pool
        claim_type: selector_policy
        grounds:
          - calculations.need_case_margin.selector_policy
          - calculations.need_case_margin.input_set
        distinguishing_aspect: "The selector ignores a cheaper SCREENED_OUT portfolio (150000000.00 per MW) and the TRANSMISSION alternative entirely, ranking only SCREENED_IN NON_TRANSMISSION/HYBRID rows: the HYBRID at 230000000.00 wins over the storage-only row at 250000000.00 and becomes selected_nta_alternative_id, while all three screened-in rows still count toward the two-alternative gate."
        test_recipe:
          setup:
            - "Study with transmission_capex 80000000000 over a 400 MW deficit (levelized 200000000.00)"
            - "Alternatives: TRANSMISSION screened in; HYBRID 230000000.00 screened in; NON_TRANSMISSION 250000000.00 screened in; NON_TRANSMISSION 150000000.00 screened out"
          setup_api_calls:
            - *c01
            - *c02
            - *c03
            - *c05
            - call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "HYBRID", description: "Storage plus reconductoring package", capex_cents: 92000000000, deliverable_mw: 400 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt_hy: "$.data.id" }
            - call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "NON_TRANSMISSION", description: "Storage-only portfolio", capex_cents: 100000000000, deliverable_mw: 400 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt_st: "$.data.id" }
            - call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "NON_TRANSMISSION", description: "Demand response only, insufficient duration", capex_cents: 60000000000, deliverable_mw: 400 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt_dr: "$.data.id" }
            - call: "POST /siting/alternatives/${alt_hy}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Deliverability confirmed" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - call: "POST /siting/alternatives/${alt_st}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Deliverability confirmed" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - call: "POST /siting/alternatives/${alt_dr}/screening"
