scaffold_corner_design:

  # =========================================================================
  # Section 1: Entities
  # =========================================================================
  - section: entities
    instances:
      - name: league_creation_returns_full_envelope_with_system_fields
        claim_type: Creation
        grounds:
          - entities.League
        distinguishing_aspect: "POST /leagues with all required fields → 201 + League envelope including id, created_at, updated_at, version=1, status=SETUP."
        test_recipe:
          setup:
            - "Empty DB; Commissioner identity opaque."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Commissioner
              as_user_id: "c1"
          trigger:
            - call: "POST /leagues"
              payload: { name: "L1", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c1"
              captures: { l_id: $.data.id, l_v: $.data.version, l_status: $.data.status, l_cw: $.data.current_week }
          assert:
            - "l_status == SETUP"
            - "l_v == 1"
            - "l_cw == 0"

      - name: get_nonexistent_league_returns_not_found
        claim_type: NotFound
        grounds:
          - entities.League
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /leagues/{id} with a non-existent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /leagues/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Commissioner
              as_user_id: "c2"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND"

      - name: missing_required_field_on_league_create
        claim_type: RequiredFields
        grounds:
          - entities.League
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /leagues missing draft_type → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /leagues"
              payload: { name: "L1", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c3"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: invalid_enum_draft_type_rejected
        claim_type: TypeConstraints
        grounds:
          - entities.League.fields.draft_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /leagues with draft_type='SALARY' (not in {SNAKE, AUCTION}) → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /leagues"
              payload: { name: "L1", draft_type: "SALARY", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c4"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: computed_field_status_ignored_in_input
        claim_type: ComputedFields
        grounds:
          - entities.League.fields.status
        distinguishing_aspect: "League.status is computed; if a client tries to set it on POST, the value is ignored (server stamps SETUP)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /leagues"
              payload: { name: "L1", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c5"
              captures: { l_status: $.data.status }
          assert:
            - "l_status == SETUP (server-stamped regardless of any client attempt to set it)."

      - name: list_leagues_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.League
        distinguishing_aspect: "GET /leagues returns paginated envelope with limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Two leagues exist."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L1", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c6"
            - call: "POST /leagues"
              payload: { name: "L2", draft_type: "AUCTION", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c6"
          trigger:
            - call: "GET /leagues"
              payload: { limit: 1, offset: 0 }
              as: Commissioner
              as_user_id: "c6"
          assert:
            - "Response envelope includes pagination_fields {limit, offset, total_count, has_more} with limit=1 and total_count >= 2."

      - name: team_unique_display_name_within_league
        claim_type: TypeConstraints
        grounds:
          - entities.Team.fields.display_name
        distinguishing_aspect: "Two POST /leagues/{id}/teams with the same display_name (case-insensitive) within the same league — second fails ERR_INVALID_REQUEST (uniqueness constraint)."
        test_recipe:
          setup: ["A league in SETUP exists."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L1", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c7"
              captures: { l_id: $.data.id }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "Alpha", division: "E" }
              as: Commissioner
              as_user_id: "c7"
          trigger:
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "alpha", division: "E" }
              as: Commissioner
              as_user_id: "c7"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST (display_name uniqueness within league is case-insensitive)."

  # =========================================================================
  # Section 2: State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: trade_invalid_from_terminal_returns_invalid_state
        claim_type: TerminalStateLockdown
        grounds:
          - state_machines.Trade.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After Trade reaches REJECTED, POST /trades/{id}/accept against the same trade returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Trade in REJECTED terminal state exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: Commissioner
              as_user_id: "c8"
            - call: "POST /leagues"
              payload: { name: "L_T1", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c8"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "A", division: "E" }
              as: Commissioner
              as_user_id: "c8"
              captures: { ta_id: $.data.id }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "B", division: "E" }
              as: Commissioner
              as_user_id: "c8"
              captures: { tb_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P1", position: "QB", nfl_team: "KC", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "c8"
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P2", position: "RB", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c8"
              captures: { p2: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P3", position: "QB", nfl_team: "BUF", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "c8"
              captures: { p3: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P4", position: "RB", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c8"
              captures: { p4: $.data.id }
            - call: "POST /leagues/${l_id}/start-draft"
              payload: { expected_league_version: "${l_v}" }
              as: Commissioner
              as_user_id: "c8"
              captures: { l_v2: $.data.version }
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${p1}", round: 1, overall_pick: 1, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c8"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${tb_id}", player_id: "${p3}", round: 1, overall_pick: 2, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c8"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${tb_id}", player_id: "${p4}", round: 2, overall_pick: 3, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c8"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${p2}", round: 2, overall_pick: 4, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c8"
            - call: "GET /leagues/${l_id}"
              payload: {}
              as: Commissioner
              as_user_id: "c8"
              captures: { l_v3: $.data.version }
            - call: "POST /leagues/${l_id}/finalize-draft"
              payload: { expected_league_version: "${l_v3}" }
              as: Commissioner
              as_user_id: "c8"
            - call: "POST /trades"
              payload: { league_id: "${l_id}", proposing_team_id: "${ta_id}", target_team_id: "${tb_id}", players_offered: ["${p1}"], players_requested: ["${p3}"], faab_offered_cents: 0 }
              as: TeamOwner
              as_user_id: "${ta_id}"
              captures: { tr_id: $.data.id, tr_v: $.data.version }
            - call: "POST /trades/${tr_id}/reject"
              payload: { expected_trade_version: "${tr_v}" }
              as: TeamOwner
              as_user_id: "${tb_id}"
              captures: { tr_v2: $.data.version }
          trigger:
            - call: "POST /trades/${tr_id}/accept"
              payload: { expected_trade_version: "${tr_v2}" }
              as: TeamOwner
              as_user_id: "${tb_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (Trade in REJECTED terminal state cannot transition to ACCEPTED)."

      - name: error_trade_cross_entity_state_blocked
        claim_type: GuardedTransition
        grounds:
          - validations[priority=11]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / trade_finalize_blocked_when_matchup_in_progress
          rationale: "Asserted as the rejection path of the named §1.8 instance — ERR_TRADE_LOCKED_DURING_GAME."

      - name: cyclic_state_machine_player_active_after_loop
        claim_type: CyclicShape
        grounds:
          - state_machines.Player.transitions
        excluded_because:
          difficulty_instance: non_linear_state_machine / player_cyclic_active_injured_ir_active
          rationale: "§1.8 instance asserts the cyclic loop ACTIVE→INJURED→IR_PLACED→ACTIVE."

      - name: draft_pick_when_league_in_setup_rejected
        claim_type: PreconditionEnforcement
        grounds:
          - state_machines.League.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /draft-picks when League.status=SETUP (not yet DRAFTING) → ERR_INVALID_STATE."
        test_recipe:
          setup: ["League in SETUP; team created."]
          setup_api_calls:
            - call: "POST /leagues"
              payload: { name: "L1", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c9"
              captures: { l_id: $.data.id }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "A", division: "E" }
              as: Commissioner
              as_user_id: "c9"
              captures: { ta_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "P1", position: "QB", nfl_team: "KC", projected_points: 10.0, replacement_value: 5.0 }
              as: Commissioner
              as_user_id: "c9"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${p1}", round: 1, overall_pick: 1, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c9"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (League not DRAFTING)."

  # =========================================================================
  # Section 3: Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: dynasty_keeper_cost_two_keepers_round_decreases_by_one_each
        claim_type: CorrectResult
        grounds:
          - calculations.dynasty_keeper_cost
        distinguishing_aspect: "Team designates 2 keepers; the first keeper (oldest by created_at) keeps original round R; second keeper costs max(1, R-1). Pinned chronological order."
        test_recipe:
          setup:
            - "League in PLAYOFFS or post-season state ready for keeper-cost recomputation; team has two drafted players p_a (round 5) and p_b (round 3); team designates both as keepers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /leagues"
              payload: { name: "DK L", draft_type: "SNAKE", roster_size: 5, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 2, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c10"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "A", division: "E" }
              as: Commissioner
              as_user_id: "c10"
              captures: { ta_id: $.data.id }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "B", division: "E" }
              as: Commissioner
              as_user_id: "c10"
              captures: { tb_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa1", position: "QB", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pa1: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa2", position: "RB", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pa2: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa3", position: "WR", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pa3: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa4", position: "TE", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pa4: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa5", position: "K", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pa5: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb1", position: "QB", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pb1: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb2", position: "RB", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pb2: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb3", position: "WR", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pb3: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb4", position: "TE", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pb4: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb5", position: "K", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { pb5: $.data.id }
            - call: "POST /leagues/${l_id}/start-draft"
              payload: { expected_league_version: "${l_v}" }
              as: Commissioner
              as_user_id: "c10"
              captures: { l_v2: $.data.version }
            # Make pa1 round 3 pick and pa2 round 5 pick (so created_at order: pa1 created first)
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${pa1}", round: 3, overall_pick: 1, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { dp_pa1_id: $.data.id }
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${tb_id}", player_id: "${pb1}", round: 1, overall_pick: 2, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${tb_id}", player_id: "${pb2}", round: 2, overall_pick: 3, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${pa2}", round: 5, overall_pick: 4, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
              captures: { dp_pa2_id: $.data.id }
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${pa3}", round: 5, overall_pick: 5, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${tb_id}", player_id: "${pb3}", round: 3, overall_pick: 6, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${tb_id}", player_id: "${pb4}", round: 4, overall_pick: 7, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${pa4}", round: 4, overall_pick: 8, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${ta_id}", player_id: "${pa5}", round: 5, overall_pick: 9, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "POST /draft-picks"
              payload: { league_id: "${l_id}", team_id: "${tb_id}", player_id: "${pb5}", round: 5, overall_pick: 10, cost_cents: 0 }
              as: Commissioner
              as_user_id: "c10"
            - call: "GET /leagues/${l_id}"
              payload: {}
              as: Commissioner
              as_user_id: "c10"
              captures: { l_v3: $.data.version }
            - call: "POST /leagues/${l_id}/finalize-draft"
              payload: { expected_league_version: "${l_v3}" }
              as: Commissioner
              as_user_id: "c10"
            - call: "GET /teams/${ta_id}"
              payload: {}
              as: Commissioner
              as_user_id: "c10"
              captures: { ta_v: $.data.version }
          trigger:
            - call: "PATCH /teams/${ta_id}/keepers"
              payload: { keeper_player_ids: ["${pa1}", "${pa2}"], expected_team_version: "${ta_v}" }
              as: TeamOwner
              as_user_id: "${ta_id}"
            - call: "GET /draft-picks/${dp_pa1_id}"
              payload: {}
              as: Commissioner
              as_user_id: "c10"
              captures: { kr_pa1: $.data.keeper_round }
            - call: "GET /draft-picks/${dp_pa2_id}"
              payload: {}
              as: Commissioner
              as_user_id: "c10"
              captures: { kr_pa2: $.data.keeper_round }
          assert:
            - "kr_pa1 == 3 (first keeper by created_at ASC: max(1, original_round=3 - idx=0) = 3)."
            - "kr_pa2 == 4 (second keeper: max(1, original_round=5 - idx=1) = 4)."

      - name: keeper_cost_floors_at_round_one
        claim_type: BoundaryEdge
        grounds:
          - calculations.dynasty_keeper_cost
          - calculations.dynasty_keeper_cost.constants.KEEPER_FLOOR_ROUND
        distinguishing_aspect: "Player originally drafted in round 1, kept as second keeper (idx=1): new_round = max(1, 1-1) = max(1, 0) = 1 (floors at KEEPER_FLOOR_ROUND, not 0)."
        test_recipe:
          setup:
            - "Team has player_x drafted round 2, player_y drafted round 1; both designated as keepers (player_x created first by created_at)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: Commissioner
              as_user_id: "c11"
            - call: "POST /leagues"
              payload: { name: "Floor L", draft_type: "SNAKE", roster_size: 2, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 2, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "c11"
              captures: { l_id: $.data.id, l_v: $.data.version }
            - call: "POST /leagues/${l_id}/teams"
              payload: { display_name: "A", division: "E" }
              as: Commissioner
              as_user_id: "c11"
              captures: { ta_id: $.data.id }
