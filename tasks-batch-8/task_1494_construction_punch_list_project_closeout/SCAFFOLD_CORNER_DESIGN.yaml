            - { call: "POST /closeout/warranty-cases", payload: { project_id: "${p}", title: "Too early", severity: "MINOR", description: "not closed yet" }, as: OwnerRep, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PROJECT_NOT_CLOSED"

      - name: foreign_trade_on_walk_create_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_TRADE_NOT_IN_PROJECT]"]
        distinguishing_aspect: "Referential integrity on walk creation: the trade must belong to the walk's project (state gate passes — project A is PUNCH_ACTIVE — so the referential error is what surfaces)."
        test_recipe:
          setup: ["Project A PUNCH_ACTIVE with trade A; project B with trade B"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj A", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/projects", payload: { name: "Proj B", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { pb: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pb}", trade_name: "PLUMBING", responsible_type: "SUBCONTRACTOR", subcontractor_org: "PipeCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_TRADE_NOT_IN_PROJECT"

      - name: walk_from_other_project_on_item_create_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_WALK_NOT_IN_PROJECT]"]
        distinguishing_aspect: "An item's optional punch_walk_id must belong to the same project as the item."
        test_recipe:
          setup: ["Projects A and B both PUNCH_ACTIVE; walk belongs to B"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj A", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/projects", payload: { name: "Proj B", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { pb: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pb}", trade_name: "PLUMBING", responsible_type: "SUBCONTRACTOR", subcontractor_org: "PipeCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/projects/${pb}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pb}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wb: $.data.id } }
          trigger:
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Cross-walk", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "i1", punch_walk_id: "${wb}" }, as: GCInspector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_WALK_NOT_IN_PROJECT"

      - name: occupancy_before_sc_date_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_OCCUPANCY_BEFORE_SC]"]
        distinguishing_aspect: "occupancy_date earlier than substantial_completion_date is rejected; a date equal to the SC instant is accepted."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project with SC date 2026-08-03T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
          trigger:
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-01T00:00:00Z" }, as: OwnerRep, captures: { err: $.data.error_id } }
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-03T10:00:00Z" }, as: OwnerRep, captures: { okf: $.data.beneficial_occupancy_registered } }
          assert:
            - "${err} == ERR_OCCUPANCY_BEFORE_SC"
            - "${okf} == true  # date equal to SC instant accepted"

      - name: double_occupancy_registration_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_OCCUPANCY_ALREADY_REGISTERED]"]
        distinguishing_aspect: "Beneficial occupancy registration is one-shot."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project with occupancy already registered"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
          trigger:
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-05T00:00:00Z" }, as: OwnerRep, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OCCUPANCY_ALREADY_REGISTERED"
            - "Project.${p}.beneficial_occupancy_date == 2026-08-04T00:00:00Z (unchanged)"

      - name: start_closeout_without_occupancy_returns_error
        claim_type: violation_to_error
        grounds: ["state_machines.Project.SUBSTANTIALLY_COMPLETE_to_CLOSEOUT_IN_PROGRESS", "errors[ERR_OCCUPANCY_NOT_REGISTERED]"]
        distinguishing_aspect: "Closeout cannot begin until beneficial occupancy is registered."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project, occupancy NOT registered"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
          trigger:
            - { call: "POST /closeout/projects/${p}/start-closeout", as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OCCUPANCY_NOT_REGISTERED"
            - "Project.${p}.status == SUBSTANTIALLY_COMPLETE"

      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID is rejected at priority 1 before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /closeout/projects", payload: { name: "NoAuth", contract_value_cents: 10000000, retainage_pct: 0.10 }, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

      - name: priority_conflict_safety_vs_minor_constraint
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: sc_request_safety_error_beats_minor_count_constraint
          rationale: "Dual-failure priority asserted there (ERR_OPEN_LIFE_SAFETY_ITEMS wins over ERR_TOO_MANY_OPEN_MINOR_ITEMS)."

      - name: priority_conflict_state_vs_referential
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: item_create_state_error_beats_foreign_trade_referential
          rationale: "Dual-failure priority asserted there (ERR_INVALID_STATE wins over ERR_TRADE_NOT_IN_PROJECT)."

  # ------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: get_punch_item_returns_persisted_fields
        claim_type: standard_crud
        grounds: [entities.PunchItem]
        distinguishing_aspect: "GET by id returns every stored input field verbatim plus system fields (id, created_at, updated_at, version=1) and computed defaults (rejection_count=0)."
        test_recipe:
          setup: ["PUNCH_ACTIVE project with one created item"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "Cracked tile", severity: "MINOR", location_building: "B2", location_floor: "L3", location_area: "Lobby", photo_ref: "img-77" }, as: GCInspector, captures: { it: $.data.id } }
          trigger:
            - { call: "GET /closeout/punch-items/${it}", as: OwnerRep, captures: { ti: $.data.title, sev: $.data.severity, lb: $.data.location_building, lf: $.data.location_floor, la: $.data.location_area, ph: $.data.photo_ref, st: $.data.status, rc: $.data.rejection_count, v: $.data.version } }
          assert:
            - "${ti} == Cracked tile AND ${sev} == MINOR AND ${lb} == B2 AND ${lf} == L3 AND ${la} == Lobby AND ${ph} == img-77"
            - "${st} == OPEN AND ${rc} == 0 AND ${v} == 1"
            - "response envelope: meta.api_request_id present, response_type == object"

      - name: filtered_lists_reverse_fk_lookup
        claim_type: cross_reference_link
        grounds: [entities.PunchItem.fields.trade_package_id, entities.TradePackage.fields.project_id]
        distinguishing_aspect: "Every child FK is reverse-reachable: GET /punch-items?trade_package_id=X returns exactly X's items; GET /trade-packages?project_id=P returns exactly P's trades."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, trades A and B; two items on A, one on B"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "PLUMBING", responsible_type: "SUBCONTRACTOR", subcontractor_org: "PipeCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${ta}", title: "A1", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "a1" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${ta}", title: "A2", severity: "MAJOR", location_building: "B1", location_floor: "L1", location_area: "R2", photo_ref: "a2" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${tb}", title: "B1", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R3", photo_ref: "b1" }, as: GCInspector }
          trigger:
            - { call: "GET /closeout/punch-items", payload: { trade_package_id: "${ta}" }, as: GCProjectManager }
            - { call: "GET /closeout/punch-items", payload: { trade_package_id: "${tb}", severity: "MINOR" }, as: GCProjectManager }
            - { call: "GET /closeout/trade-packages", payload: { project_id: "${p}" }, as: GCProjectManager }
          assert:
            - "items?trade_package_id=${ta}: total_count == 2"
            - "items?trade_package_id=${tb}&severity=MINOR: total_count == 1"
            - "trade-packages?project_id=${p}: total_count == 2"

      - name: response_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "The fixed envelope holds on both paths: success carries meta + response_type object + data; error carries response_type error + data.error_id/message."
        test_recipe:
          setup: ["one project exists"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
          trigger:
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager }
            - { call: "GET /closeout/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "Success response: meta.api_request_id present AND response_type == object AND data.id == ${p}"
            - "${err} == ERR_NOT_FOUND with response_type == error"

  # ------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: begin_punch_by_owner_returns_forbidden
        claim_type: role_denied_other_exclusive
        grounds: ["roles[GCProjectManager]", "errors[ERR_FORBIDDEN]", "validations[priority=2]"]
        distinguishing_aspect: "OwnerRep cannot drive GC lifecycle actions: begin-punch is GCProjectManager-exclusive."
        test_recipe:
          setup: ["Project with one trade (MOBILIZED)"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/projects/${p}/begin-punch", as: OwnerRep, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "Project.${p}.status == MOBILIZED"

      - name: verify_by_subcontractor_returns_forbidden
        claim_type: role_denied_other_exclusive
        grounds: ["roles[GCInspector]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SubcontractorRep is not in the verify role set at all — sign-off authority belongs to inspector/PM only."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, walked trade, item READY_FOR_REVIEW"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "Paint", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "i1" }, as: GCInspector, captures: { it: $.data.id } }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${t}" }
          trigger:
            - { call: "POST /closeout/punch-items/${it}/verify", as: SubcontractorRep, as_user_id: "${t}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "PunchItem.${it}.status == READY_FOR_REVIEW"

      - name: release_approve_by_pm_returns_forbidden
        claim_type: role_denied_other_exclusive
        grounds: ["roles[OwnerRep]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Retainage release approval is OwnerRep-exclusive — the GC PM who requested the money cannot approve it."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project with a REQUESTED REDUCTION release"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD" }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager, captures: { pv: $.data.version } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${p}", kind: "REDUCTION", expected_project_version: "${pv}" }, as: GCProjectManager, captures: { r: $.data.id } }
          trigger:
            - { call: "POST /closeout/retainage-releases/${r}/approve", as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "RetainageRelease.${r}.status == REQUESTED"

      - name: subcontractor_cannot_mark_ready_other_trade
        claim_type: role_exclusive_operation
        grounds: ["validations[priority=3]", "errors[ERR_NOT_RESPONSIBLE_PARTY]", "roles[SubcontractorRep]"]
        distinguishing_aspect: "Ownership is pinned to the entity-backed identity: SubcontractorRep with X-User-ID = trade A cannot mark ready an item owned by trade B."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, trades A and B both walked; one OPEN item on B"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "PLUMBING", responsible_type: "SUBCONTRACTOR", subcontractor_org: "PipeCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${tb}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: GCProjectManager, captures: { wb: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-walks/${wb}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${tb}", title: "Leak", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "i1" }, as: GCInspector, captures: { it: $.data.id } }
          trigger:
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${ta}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_RESPONSIBLE_PARTY"
            - "PunchItem.${it}.status == OPEN AND ready_by_user_id == null"

      - name: sod_verify_by_same_user_forbidden_then_other_user_ok
        claim_type: segregation_of_duties_pair
        grounds: ["validations[priority=4]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.PunchItem.READY_FOR_REVIEW_to_VERIFIED"]
        distinguishing_aspect: "Segregation of duties on self-performed correction: the PM user who marked the item ready cannot also sign it off; a different user (inspector) can."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, SELF_PERFORMED trade (GC self-performed correction), walk completed, item OPEN"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "DRYWALL", responsible_type: "SELF_PERFORMED" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "Screw pops", severity: "MINOR", location_building: "B1", location_floor: "L4", location_area: "R401", photo_ref: "i1" }, as: GCInspector, captures: { it: $.data.id } }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: GCProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /closeout/punch-items/${it}/verify", as: GCProjectManager, as_user_id: "pm-1", captures: { err: $.data.error_id } }
            - { call: "POST /closeout/punch-items/${it}/verify", as: GCInspector, as_user_id: "insp-1", captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES  # pm-1 marked ready; pm-1 cannot verify"
            - "${st} == VERIFIED  # insp-1 != pm-1 passes"
            - "PunchItem.${it}.verified_by_user_id == insp-1"

      - name: escalated_item_verify_requires_pm
        claim_type: role_denied_other_exclusive
        grounds: ["validations[priority=4]", "errors[ERR_VERIFICATION_ESCALATED]", "entities.PunchItem.fields.rejection_count"]
        distinguishing_aspect: "Conditional role gating: after 2 rejections the inspector loses sign-off authority; only GCProjectManager (a different user than ready_by) may verify."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, walked SUBCONTRACTOR trade; item rejected twice (rejection_count == 2), currently READY_FOR_REVIEW"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "Breaker mislabeled", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "i1" }, as: GCInspector, captures: { it: $.data.id } }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${t}" }
            - { call: "POST /closeout/punch-items/${it}/reject", payload: { reason: "still wrong" }, as: GCInspector }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${t}" }
            - { call: "POST /closeout/punch-items/${it}/reject", payload: { reason: "wrong again" }, as: GCInspector }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${t}" }
          trigger:
            - { call: "POST /closeout/punch-items/${it}/verify", as: GCInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
            - { call: "POST /closeout/punch-items/${it}/verify", as: GCProjectManager, as_user_id: "pm-2", captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_VERIFICATION_ESCALATED  # rejection_count == 2 locks out the inspector"
            - "${st} == VERIFIED  # pm-2 != ready_by ${t} and PM role satisfies escalation"
            - "PunchItem.${it}.rejection_count == 2"

  # ------------------------------------------------------------- cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: release_create_stale_project_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[release-create-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Stale expected_project_version on release create: first REDUCTION succeeds and bumps Project.version; after voiding it (kind reusable), a second create carrying the ORIGINAL version is rejected with 412."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project; version captured before first release"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD" }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${p}", kind: "REDUCTION", expected_project_version: "${pv}" }, as: GCProjectManager, captures: { r: $.data.id } }
            - { call: "POST /closeout/retainage-releases/${r}/void", as: GCProjectManager }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${p}", kind: "REDUCTION", expected_project_version: "${pv}" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "First create succeeded with fresh version ${pv} (OCC success path)"
            - "${err} == ERR_STALE_VERSION  # same version reused after the create bumped Project.version"

      - name: session_reschedule_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[session-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Stale expected_training_session_version on reschedule: a first reschedule succeeds (session stays SCHEDULED, version increments); replaying the same version is rejected with 412."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE project with one SCHEDULED session (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${p}", trade_package_id: "${t}", system_name: "AHU-1", location_room: "TR-7", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: GCProjectManager, captures: { s: $.data.id, sv: $.data.version } }
          trigger:
            - { call: "POST /closeout/training-sessions/${s}/reschedule", payload: { scheduled_start: "2026-08-11T09:00:00Z", scheduled_end: "2026-08-11T10:00:00Z", expected_training_session_version: "${sv}" }, as: GCProjectManager, captures: { sv2: $.data.version } }
            - { call: "POST /closeout/training-sessions/${s}/reschedule", payload: { scheduled_start: "2026-08-12T09:00:00Z", scheduled_end: "2026-08-12T10:00:00Z", expected_training_session_version: "${sv}" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${sv2} == ${sv} + 1  # version increments on every mutation"
            - "${err} == ERR_STALE_VERSION"
            - "TrainingSession.${s}.scheduled_start == 2026-08-11T09:00:00Z (stale reschedule did not apply)"

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.release_amount, calculations.warranty_sla_due_at]
        excluded_because:
          difficulty_instance: retainage_reduction_standard_vs_adjusted_variant
          rationale: "Both variants of both calculations asserted in §1.8 rule 1 (money domain + time domain)."

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [calculations.trade_closeout_ready, "state_machines.Project.CLOSEOUT_IN_PROGRESS_to_FINAL_RELEASE_PENDING"]
        excluded_because:
          difficulty_instance: verify_last_item_cascades_trade_ready_to_project_advance
          rationale: "Depth-3 cascade verified end-to-end there; a second trigger-path cascade in waiver_accept_cascades_trade_ready_to_project_advance."

      - name: rate_threshold_layer
        claim_type: rate_threshold_triggers
        grounds: [calculations.sc_eligibility]
        excluded_because:
          difficulty_instance: sc_minor_allowance_exactly_five_passes_six_fails
          rationale: "Cumulative threshold boundary (<= 5 vs 6) asserted there."

  # ------------------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: doc_approve_immediately_visible_on_trade
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "state_machines.CloseoutDocument.SUBMITTED_to_APPROVED"]
        distinguishing_aspect: "Immediate consistency: the approve response itself shows APPROVED, and the very next GET on the trade shows om_doc_approved == true (no lag, no read-repair)."
        test_recipe:
          setup: ["CLOSEOUT_IN_PROGRESS project; OM_MANUAL doc submitted"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/start-closeout", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "OM_MANUAL", file_ref: "om" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d: $.data.id } }
          trigger:
            - { call: "POST /closeout/closeout-documents/${d}/approve", as: GCProjectManager, captures: { dst: $.data.status } }
            - { call: "GET /closeout/trade-packages/${t}", as: GCProjectManager, captures: { omf: $.data.om_doc_approved } }
          assert:
            - "${dst} == APPROVED"
            - "${omf} == true  # visible immediately on the parent trade"
