        excluded_because:
          difficulty_instance: unwound_delivery_cascades_four_links_to_the_accrual_ledger
          rationale: "That §1.8 instance already walks the full four-link chain end-to-end (claim -> chargeback -> BudgetAccrual REVERSAL -> program ledger and objective units) and reconciles every intermediate value, which is exactly the layer's `N-level chain verified end-to-end` claim. A §1.9 restatement would duplicate it without adding a distinguishing aspect."

      - name: layer_dual_variant_calculation_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.claim_payable_amount.variants
        excluded_because:
          difficulty_instance: claim_rate_basis_snapshot_versus_repriced_current
          rationale: "That §1.8 instance runs the same claim under both variants of calculations.claim_payable_amount, pins each result and the delta the switch produces, and additionally pins which variant applies at which point in the RETROACTIVE_TO_MONTH_START window — the layer's three claims (both variants, variant selection, reconciliation) in one recipe."

      - name: layer_rate_threshold_triggers_at_the_cumulative_boundary
