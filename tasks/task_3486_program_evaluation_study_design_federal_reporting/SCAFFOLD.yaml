# =============================================================================
# Scaffold: Program Evaluation Study Design & Federal Reporting
# =============================================================================

scenario: |
  Program Evaluation Study Design & Federal Reporting (Mathematica): evaluation contract award with research questions, design constraints and reporting deliverables specified by a federal agency, randomized and quasi-experimental design selection with power analysis and site recruitment feasibility, site and participant recruitment with informed consent, institutional review board approval and burden minimization, data collection across surveys, administrative records and site visits with linkage and privacy protections, analysis plan preregistration with prespecified outcomes to prevent selective reporting, findings reporting to the agency with peer review, comment and publication timelines, restricted-use data file preparation for outside researchers with disclosure risk review, dissemination and technical assistance to program operators

domain_name: program-evaluation-federal-reporting
api_prefix: /evaluation

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - version_pinning_on_approval   # preregistered primary outcomes + IRB consent-form version pinned on approval
    - cascading_side_effects        # IRB expiry and site withdrawal propagate 3 levels deep
    - temporal_windowing            # IRB approval windows, wave windows, report deadlines on a logical clock
    - optimistic_concurrency        # OCC on Study.version guards design-plan supersede
  entity_topology: hierarchical     # contract -> study -> children; one cross-branch link (ResponseRecord -> Participant)
  state_machine_shape: cyclic       # revision loops on DesignPlan, IRBProtocol, FindingsReport, RestrictedUseFile, DataCollectionWave
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # ResponseRecord references Participant across the wave branch; Site capacity feeds Study projections
  role_model: segregation_of_duties # report author cannot peer-review own report; RUF preparer cannot decide own disclosure review
  consistency_model: immediate

# =============================================================================
# Global constants (referenced by calculations, validations, state machines)
# Each is defined exactly once, here.
# =============================================================================
constants:
  CLOCK_DEFAULT_UTC: "2026-09-01T00:00:00Z"   # server logical clock default before any set_current_utc call
  Z_ALPHA_CRIT: 1.96        # two-sided alpha=0.05 critical value
  Z_POWER_CRIT: 0.84        # power=0.80 critical value
  QED_VARIANCE_INFLATION: 1.44  # quasi-experimental variance inflation factor (1.2^2)
  YIELD_PROSPECTED: 0.10    # pipeline yield credit for PROSPECTED sites
  YIELD_CONTACTED: 0.35     # pipeline yield credit for CONTACTED sites
  K_ANONYMITY_MIN: 5        # cells with count < 5 are suppressed in restricted-use files
  MAX_DISCLOSURE_RISK: 0.20 # release gate: max_risk must be <= 0.20 (exactly 0.20 passes)
  MAX_TOTAL_BURDEN_MINUTES: 480  # per-participant billed-burden cap across a study (exactly 480 allowed)
  MODE_FACTOR_SURVEY: 1.0
  MODE_FACTOR_SITE_VISIT: 1.25
  MODE_FACTOR_ADMIN_RECORDS: 0.5
  SITE_VISIT_MIN_GAP_DAYS: 7     # minimum gap between SITE_VISIT wave windows at the same site (gap >= 7 passes)
  IRB_MAX_APPROVAL_DAYS: 365     # maximum length of an IRB approval window
  PEER_REVIEW_DAYS: 45           # informational peer-review due offset from report submission
  AGENCY_COMMENT_DAYS: 30        # informational agency comment window after peer review
  REVISION_DAYS: 60              # revision due = agency decision at + 60d (submit strictly after due fails)
  PUBLICATION_DAYS: 90           # publication due = accepted_at + 90d (publish at exactly due passes)

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EvaluationContract
    parent: null
    common_fields: true
    fields:
      - { name: agency_code, type: string, source: input, description: "Federal agency code (e.g. ACF-OPRE)" }
      - { name: title, type: string, source: input, description: "Contract title" }
      - { name: award_amount_cents, type: integer, source: input, description: "Total awarded amount in cents; must be > 0" }
      - { name: deliverable_report_count, type: integer, source: input, default: 1, description: "Number of FINAL reports the agency requires; must be >= 1" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of payment milestones disbursed on report publication" }
      - { name: forfeited_cents, type: integer, source: computed, default: 0, description: "Undisbursed remainder forfeited on termination or closeout" }
      - { name: remaining_cents, type: integer, source: computed, description: "= award_amount_cents - disbursed_cents - forfeited_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED | TERMINATED" }
      - { name: terminated_reason, type: string, source: system, description: "Reason recorded on termination; null otherwise", default: null }

  - name: Study
    parent: EvaluationContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> EvaluationContract.id; owning contract" }
      - { name: title, type: string, source: input, description: "Study title" }
      - { name: research_question, type: string, source: input, description: "Primary research question text" }
      - { name: status, type: enum, source: system, description: "DESIGN | RECRUITMENT | DATA_COLLECTION | ANALYSIS | REPORTING | DISSEMINATION | COMPLETED | TERMINATED" }
      - { name: committed_projected_n, type: integer, source: computed, default: 0, description: "Sum of max_participants over sites in RECRUITED or ACTIVE" }
      - { name: pipeline_projected_n, type: integer, source: computed, default: 0, description: "committed_projected_n + floor(max_participants * yield) per CONTACTED or PROSPECTED site (see recruitment_feasibility_projection)" }
      - { name: enrolled_total, type: integer, source: computed, default: 0, description: "Count of participants in CONSENTED, RANDOMIZED_TREATMENT, or RANDOMIZED_CONTROL across all sites of this study" }
      - { name: quarantined_record_count, type: integer, source: computed, default: 0, description: "Count of ResponseRecords in QUARANTINED across all waves of this study" }
      - { name: sample_adequacy, type: enum, source: computed, default: UNASSESSED, description: "UNASSESSED when no non-superseded design plan exists; ADEQUATE when pipeline_projected_n >= current plan required_total_n; else UNDERPOWERED" }

  - name: DesignPlan
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: design_type, type: enum, source: input, description: "RCT | QED_MATCHING | QED_RDD | QED_DID; any QED_* selects the quasi-experimental variant" }
      - { name: mde, type: number, source: input, description: "Minimum detectable effect (standardized); must be > 0" }
      - { name: cluster_size, type: integer, source: input, description: "Average participants per cluster; must be >= 1" }
      - { name: icc, type: number, source: input, description: "Intra-cluster correlation; 0 <= icc <= 1" }
      - { name: attrition_rate, type: number, source: input, description: "Assumed attrition; 0 <= attrition_rate < 1" }
      - { name: alpha, type: number, source: input, default: 0.05, description: "Significance level; informational (critical value pinned by Z_ALPHA_CRIT)" }
      - { name: power_target, type: number, source: input, default: 0.8, description: "Target power; informational (critical value pinned by Z_POWER_CRIT)" }
      - { name: randomization_ratio_num, type: integer, source: input, default: 1, description: "Treatment slots per allocation cycle; >= 1 and < randomization_ratio_den" }
      - { name: randomization_ratio_den, type: integer, source: input, default: 2, description: "Total slots per allocation cycle; >= 2" }
      - { name: n_per_arm, type: integer, source: computed, description: "Required sample size per arm (see required_sample_size)" }
      - { name: required_total_n, type: integer, source: computed, description: "= 2 * n_per_arm" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "1 on creation; +1 on each revise" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | AGENCY_APPROVED | RETURNED_FOR_REVISION | LOCKED | SUPERSEDED" }

  - name: IRBProtocol
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: title, type: string, source: input, description: "Protocol title" }
      - { name: estimated_burden_minutes, type: integer, source: input, description: "Estimated per-participant burden; must be >= 0 and <= MAX_TOTAL_BURDEN_MINUTES" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | MODIFICATIONS_REQUIRED | EXPIRED" }
      - { name: approval_start, type: datetime, source: system, description: "Set by IRBReviewer on APPROVED decision; start of approval window (inclusive)" }
      - { name: approval_end, type: datetime, source: system, description: "End of approval window (exclusive); window length must be <= IRB_MAX_APPROVAL_DAYS" }
      - { name: consent_form_version, type: integer, source: system, default: 1, description: "Approved consent form version; starts 1, +1 each time a protocol is APPROVED after MODIFICATIONS_REQUIRED" }
      - { name: submitted_by_id, type: string, source: system, description: "X-User-ID of the most recent submitter" }
      - { name: decided_by_id, type: string, source: system, description: "X-User-ID of the deciding IRBReviewer" }

  - name: Site
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: max_participants, type: integer, source: input, description: "Recruitment capacity; must be >= 1" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Participants of this site in CONSENTED, RANDOMIZED_TREATMENT, or RANDOMIZED_CONTROL" }
      - { name: randomized_count, type: integer, source: system, default: 0, description: "Number of randomizations performed at this site; drives deterministic arm allocation" }
      - { name: status, type: enum, source: system, description: "PROSPECTED | CONTACTED | RECRUITED | ACTIVE | DECLINED | WITHDRAWN | COMPLETED" }

  - name: Participant
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; recruiting site" }
      - { name: external_ref, type: string, source: input, description: "Site-local reference code (not a government identifier)" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | CONSENTED | RANDOMIZED_TREATMENT | RANDOMIZED_CONTROL | COMPLETED | WITHDRAWN" }
      - { name: consent_form_version, type: integer, source: system, description: "IRBProtocol.consent_form_version consented against; null until consented", default: null }
      - { name: consented_at, type: datetime, source: system, description: "Logical clock time of consent; null until consented", default: null }
      - { name: burden_total_minutes, type: integer, source: computed, default: 0, description: "Sum of billed_minutes over this participant's non-QUARANTINED records (per-record rounding; see participant_burden_total)" }
      - { name: withdrawal_reason, type: string, source: system, description: "PARTICIPANT_INITIATED | SITE_WITHDRAWN | CONTRACT_TERMINATED; null until withdrawn", default: null }

  - name: DataCollectionWave
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: wave_type, type: enum, source: input, description: "SURVEY | ADMIN_RECORDS | SITE_VISIT" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; required when wave_type = SITE_VISIT, forbidden otherwise", default: null }
      - { name: open_at, type: datetime, source: input, description: "Window start (inclusive)" }
      - { name: close_at, type: datetime, source: input, description: "Window end (exclusive); must be > open_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | SUSPENDED | CLOSED | LINKED | CANCELLED" }

  - name: ResponseRecord
    parent: DataCollectionWave
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: system, description: "FK -> DataCollectionWave.id; collecting wave" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; responding participant" }
      - { name: instrument_minutes, type: integer, source: input, description: "Raw instrument burden minutes; must be >= 1" }
      - { name: payload_ref, type: string, source: input, description: "Opaque reference to the collected instrument payload" }
      - { name: billed_minutes, type: integer, source: computed, description: "round_half_up(instrument_minutes * mode factor of wave.wave_type); computed per record before summing" }
      - { name: linkage_key, type: string, source: system, description: "Pseudonymous linkage key assigned at wave LINKED; null before", default: null }
      - { name: status, type: enum, source: system, description: "RECEIVED | VALIDATED | LINKED | QUARANTINED" }

  - name: AnalysisPlan
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: primary_outcomes, type: array, source: input, description: "Prespecified primary outcome codes; frozen at preregistration" }
      - { name: secondary_outcomes, type: array, source: input, description: "Secondary outcome codes; amendable after registration" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Number of post-registration amendments applied" }
      - { name: registered_at, type: datetime, source: system, description: "Logical clock time of preregistration; null until registered", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | PREREGISTERED" }

  - name: FindingsReport
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: title, type: string, source: input, description: "Report title" }
      - { name: report_type, type: enum, source: input, description: "INTERIM | FINAL" }
      - { name: addressed_primary_outcomes, type: array, source: input, description: "Primary outcome codes this report addresses; must cover every preregistered primary outcome at submit" }
      - { name: payment_milestone_cents, type: integer, source: input, description: "Contract payment disbursed on publication; must be >= 0" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of REVISION_REQUIRED decisions received" }
      - { name: submitted_by_id, type: string, source: system, description: "X-User-ID of the PrincipalInvestigator who last submitted" }
      - { name: reviewed_by_id, type: string, source: system, description: "X-User-ID of the PeerReviewer; null until reviewed", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time of last submission; null until submitted", default: null }
      - { name: accepted_at, type: datetime, source: system, description: "Logical clock time of acceptance; null until accepted", default: null }
      - { name: peer_review_due, type: datetime, source: computed, description: "= submitted_at + PEER_REVIEW_DAYS (informational)" }
      - { name: revision_due, type: datetime, source: computed, description: "= agency decision time + REVISION_DAYS; null unless in REVISION", default: null }
      - { name: publication_due, type: datetime, source: computed, description: "= accepted_at + PUBLICATION_DAYS; null unless ACCEPTED", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PEER_REVIEWED | ACCEPTED | REVISION | PUBLISHED | CANCELLED" }

  - name: RestrictedUseFile
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: title, type: string, source: input, description: "File title" }
      - { name: cell_counts, type: array, source: input, description: "Anonymized cell sizes (integers >= 1); parallel to sensitivity_weights; non-empty" }
      - { name: sensitivity_weights, type: array, source: input, description: "Per-cell sensitivity weight in (0, 1]; same length as cell_counts" }
      - { name: suppressed_cell_count, type: integer, source: computed, description: "Number of cells with count < K_ANONYMITY_MIN (excluded from risk denominators)" }
      - { name: max_risk, type: number, source: computed, description: "max over surviving cells of sensitivity_weight / count; 4 decimal places, round_half_up" }
      - { name: mean_risk, type: number, source: computed, description: "sum(sensitivity_weights of surviving cells) / sum(counts of surviving cells); 4 decimal places, round_half_up" }
      - { name: prepared_by_id, type: string, source: system, description: "X-User-ID of the DataManager who created the file" }
      - { name: status, type: enum, source: system, description: "DRAFT | DISCLOSURE_REVIEW | RISK_REJECTED | RELEASED" }

  - name: DisseminationActivity
    parent: Study
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; owning study" }
      - { name: activity_type, type: enum, source: input, description: "WEBINAR | TA_SESSION | BRIEF" }
      - { name: title, type: string, source: input, description: "Activity title" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled logical time" }
      - { name: operator_count, type: integer, source: input, description: "Number of program operators served; must be >= 1" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EvaluationContract
    initial_state: ACTIVE
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /evaluation/contracts/{contractId}/terminate"
        actor: AgencyOfficer
        preconditions:
          - "Contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "forfeited_cents = remaining_cents; remaining_cents = 0"
          - "Every non-terminal Study of this contract -> TERMINATED"
          - "Study termination itself cascades: each non-terminal Site -> WITHDRAWN (reason cascade), each non-terminal Participant of those sites -> WITHDRAWN (withdrawal_reason=CONTRACT_TERMINATED), each RECEIVED/VALIDATED record of withdrawn participants -> QUARANTINED, each OPEN/SUSPENDED/PLANNED wave -> CANCELLED, each DRAFT/SUBMITTED/PEER_REVIEWED/REVISION report -> CANCELLED, each PLANNED dissemination activity -> CANCELLED"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /evaluation/contracts/{contractId}/closeout"
        actor: AgencyOfficer
        preconditions:
          - "Contract must be ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Every Study of this contract must be COMPLETED (ERR_STUDIES_NOT_COMPLETED)"
        side_effects:
          - "forfeited_cents = remaining_cents; remaining_cents = 0"

  - entity: Study
    initial_state: DESIGN
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DESIGN
        to: RECRUITMENT
        trigger: "system (automatic when the study's current design plan becomes LOCKED)"
        actor: system
        preconditions:
          - "A DesignPlan of this study transitions AGENCY_APPROVED -> LOCKED"
        side_effects: []
      - from: RECRUITMENT
        to: DATA_COLLECTION
        trigger: "system (automatic when the study's first wave enters OPEN)"
        actor: system
        preconditions:
          - "A DataCollectionWave of this study transitions PLANNED -> OPEN and no other wave was OPEN before"
        side_effects: []
      - from: DATA_COLLECTION
        to: ANALYSIS
        trigger: "system (automatic when a wave closes and no wave of the study remains in PLANNED, OPEN, or SUSPENDED)"
        actor: system
        preconditions:
          - "The transitioning wave reaches CLOSED and every other wave is in CLOSED, LINKED, or CANCELLED"
        side_effects: []
      - from: ANALYSIS
        to: REPORTING
        trigger: "system (automatic when the study's first FindingsReport is created)"
        actor: system
        preconditions:
          - "POST /evaluation/studies/{studyId}/reports succeeds while study is ANALYSIS"
        side_effects: []
      - from: REPORTING
        to: DISSEMINATION
        trigger: "system (automatic when the study's first report reaches PUBLISHED)"
        actor: system
        preconditions:
          - "A FindingsReport of this study transitions ACCEPTED -> PUBLISHED"
        side_effects: []
      - from: DISSEMINATION
        to: COMPLETED
        trigger: "system (automatic when dissemination completes the contract)"
        actor: system
        preconditions:
          - "Count of this study's PUBLISHED reports with report_type FINAL >= contract.deliverable_report_count"
          - "At least one DisseminationActivity of this study is COMPLETED"
        side_effects:
          - "Every ACTIVE Site of this study -> COMPLETED"
          - "Every CONSENTED or RANDOMIZED_* Participant of those sites -> COMPLETED (site completion cascades)"
      - from: DESIGN
        to: TERMINATED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as contract terminate, scoped to this study"]
      - from: RECRUITMENT
        to: TERMINATED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as contract terminate, scoped to this study"]
      - from: DATA_COLLECTION
        to: TERMINATED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as contract terminate, scoped to this study"]
      - from: ANALYSIS
        to: TERMINATED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as contract terminate, scoped to this study"]
      - from: REPORTING
        to: TERMINATED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as contract terminate, scoped to this study"]
      - from: DISSEMINATION
        to: TERMINATED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as contract terminate, scoped to this study"]

  - entity: DesignPlan
    initial_state: DRAFT
    terminal_states: [LOCKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /evaluation/design-plans/{planId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Plan must be DRAFT (ERR_DESIGN_PLAN_INVALID_STATE)"
          - "Study pipeline_projected_n >= this plan's required_total_n (ERR_INSUFFICIENT_POWER)"
        side_effects: []
      - from: SUBMITTED
        to: AGENCY_APPROVED
        trigger: "POST /evaluation/design-plans/{planId}/agency-decision with decision=APPROVED"
        actor: AgencyOfficer
        preconditions:
          - "Plan must be SUBMITTED (ERR_DESIGN_PLAN_INVALID_STATE)"
        side_effects:
          - "If at least one Site of the study is RECRUITED or ACTIVE: this plan immediately continues to LOCKED (same request), Study DESIGN -> RECRUITMENT if still DESIGN"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /evaluation/design-plans/{planId}/agency-decision with decision=RETURNED"
        actor: AgencyOfficer
        preconditions:
          - "Plan must be SUBMITTED (ERR_DESIGN_PLAN_INVALID_STATE)"
        side_effects: []
      - from: RETURNED_FOR_REVISION
        to: DRAFT
        trigger: "POST /evaluation/design-plans/{planId}/revise"
        actor: PrincipalInvestigator
        preconditions:
          - "Plan must be RETURNED_FOR_REVISION (ERR_DESIGN_PLAN_INVALID_STATE)"
        side_effects:
          - "revision_number += 1"
      - from: AGENCY_APPROVED
        to: LOCKED
        trigger: "system (automatic when the first Site of the study reaches RECRUITED or ACTIVE, or immediately on approval if one already is)"
        actor: system
        preconditions:
          - "Plan is AGENCY_APPROVED and at least one Site of the study is RECRUITED or ACTIVE"
        side_effects:
          - "Study DESIGN -> RECRUITMENT if study still DESIGN"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a newer DesignPlan is created for the same study while this plan is DRAFT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED_FOR_REVISION
        to: SUPERSEDED
        trigger: "system (automatic when a newer DesignPlan is created for the same study while this plan is RETURNED_FOR_REVISION)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: IRBProtocol
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /evaluation/irb-protocols/{irbId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Protocol must be DRAFT (ERR_IRB_INVALID_STATE)"
        side_effects:
          - "submitted_by_id = X-User-ID"
      - from: MODIFICATIONS_REQUIRED
        to: SUBMITTED
        trigger: "POST /evaluation/irb-protocols/{irbId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Protocol must be MODIFICATIONS_REQUIRED (ERR_IRB_INVALID_STATE)"
        side_effects:
          - "submitted_by_id = X-User-ID"
      - from: EXPIRED
        to: SUBMITTED
        trigger: "POST /evaluation/irb-protocols/{irbId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Protocol must be EXPIRED (ERR_IRB_INVALID_STATE)"
        side_effects:
          - "submitted_by_id = X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /evaluation/irb-protocols/{irbId}/decision with decision=APPROVED"
        actor: IRBReviewer
        preconditions:
          - "Protocol must be SUBMITTED (ERR_IRB_INVALID_STATE)"
          - "decided_by_id (X-User-ID) must differ from submitted_by_id (ERR_SEGREGATION_OF_DUTIES)"
          - "approval_start and approval_end required; approval_end > approval_start; window length <= IRB_MAX_APPROVAL_DAYS (ERR_INVALID_REQUEST)"
          - "Half-open window [approval_start, approval_end) must not overlap any other APPROVED protocol window of the same study; touching endpoints (start == other end) are allowed (ERR_IRB_WINDOW_OVERLAP)"
        side_effects:
          - "If previous status before this submission cycle included MODIFICATIONS_REQUIRED at least once: consent_form_version += 1"
      - from: SUBMITTED
        to: MODIFICATIONS_REQUIRED
        trigger: "POST /evaluation/irb-protocols/{irbId}/decision with decision=MODIFICATIONS_REQUIRED"
        actor: IRBReviewer
        preconditions:
          - "Protocol must be SUBMITTED (ERR_IRB_INVALID_STATE)"
          - "decided_by_id (X-User-ID) must differ from submitted_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic when POST /_clock/set_current_utc advances the logical clock to >= approval_end)"
        actor: system
        preconditions:
          - "Protocol is APPROVED and current logical time >= approval_end (half-open window: at exactly approval_end the protocol is expired)"
        side_effects:
          - "Every OPEN wave of the study -> SUSPENDED"
          - "Wave suspension itself cascades: each RECEIVED or VALIDATED record of a newly suspended wave -> QUARANTINED"
          - "Study quarantined_record_count recomputed (records newly quarantined included)"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /evaluation/irb-protocols/{irbId}/continuing-review"
        actor: IRBReviewer
        preconditions:
          - "Protocol must be APPROVED (ERR_IRB_INVALID_STATE)"
          - "new_approval_end > current approval_end and new_approval_end <= approval_start + IRB_MAX_APPROVAL_DAYS measured from the ORIGINAL approval_start (ERR_INVALID_REQUEST)"
        side_effects:
          - "approval_end = new_approval_end (version += 1)"
        note: "Self-loop: continuing review extends the existing window; it never shortens it"

  - entity: Site
    initial_state: PROSPECTED
    terminal_states: [DECLINED, WITHDRAWN, COMPLETED]
    transitions:
      - from: PROSPECTED
        to: CONTACTED
        trigger: "POST /evaluation/sites/{siteId}/outreach with outcome=CONTACTED"
        actor: StudyDirector
        preconditions:
          - "Site must be PROSPECTED (ERR_SITE_INVALID_STATE)"
        side_effects:
          - "Study pipeline_projected_n recomputed"
      - from: PROSPECTED
        to: DECLINED
        trigger: "POST /evaluation/sites/{siteId}/outreach with outcome=DECLINED"
        actor: StudyDirector
        preconditions:
          - "Site must be PROSPECTED (ERR_SITE_INVALID_STATE)"
        side_effects:
          - "Study pipeline_projected_n recomputed"
      - from: CONTACTED
        to: RECRUITED
        trigger: "POST /evaluation/sites/{siteId}/sign-mou"
        actor: StudyDirector
        preconditions:
          - "Site must be CONTACTED (ERR_SITE_INVALID_STATE)"
          - "Study must be DESIGN or RECRUITMENT (ERR_STUDY_INVALID_STATE)"
        side_effects:
          - "Study committed_projected_n and pipeline_projected_n recomputed"
          - "If the study's current (latest non-SUPERSEDED) DesignPlan is AGENCY_APPROVED: plan -> LOCKED; Study DESIGN -> RECRUITMENT if still DESIGN"
      - from: RECRUITED
        to: ACTIVE
        trigger: "POST /evaluation/sites/{siteId}/activate"
        actor: StudyDirector
        preconditions:
          - "Site must be RECRUITED (ERR_SITE_INVALID_STATE)"
          - "Study must have an IRBProtocol in APPROVED whose window covers the current logical time (ERR_NO_APPROVED_IRB if none APPROVED; ERR_IRB_EXPIRED if all approved windows passed)"
          - "Study's current DesignPlan must be LOCKED (ERR_DESIGN_PLAN_INVALID_STATE)"
        side_effects:
          - "Study committed_projected_n recomputed (site now ACTIVE)"
      - from: RECRUITED
        to: WITHDRAWN
        trigger: "POST /evaluation/sites/{siteId}/withdraw"
        actor: StudyDirector
        preconditions:
          - "Site must be RECRUITED or ACTIVE (ERR_SITE_INVALID_STATE)"
        side_effects:
          - "Every non-terminal Participant of this site -> WITHDRAWN (withdrawal_reason=SITE_WITHDRAWN); each withdrawal itself quarantines that participant's RECEIVED/VALIDATED records and decrements site enrolled_count when the participant had consented"
          - "Study committed_projected_n, pipeline_projected_n, enrolled_total, and sample_adequacy recomputed (adequacy may flip ADEQUATE -> UNDERPOWERED)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /evaluation/sites/{siteId}/withdraw"
        actor: StudyDirector
        preconditions:
          - "Site must be RECRUITED or ACTIVE (ERR_SITE_INVALID_STATE)"
        side_effects:
          - "Same cascade as RECRUITED -> WITHDRAWN"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cascade when study reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every CONSENTED or RANDOMIZED_* Participant of this site -> COMPLETED"

  - entity: Participant
    initial_state: IDENTIFIED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: IDENTIFIED
        to: CONSENTED
        trigger: "POST /evaluation/participants/{participantId}/consent"
        actor: Participant
        preconditions:
          - "Participant must be IDENTIFIED (ERR_PARTICIPANT_INVALID_STATE)"
          - "X-User-ID must equal participant.id (ERR_UNAUTHORIZED_ROLE)"
          - "Site must be ACTIVE (ERR_SITE_INVALID_STATE)"
          - "Study must have an IRBProtocol APPROVED whose window covers now (ERR_NO_APPROVED_IRB / ERR_IRB_EXPIRED)"
          - "Payload consent_form_version must equal that protocol's consent_form_version (ERR_CONSENT_VERSION_STALE)"
          - "Site enrolled_count < site.max_participants (ERR_SITE_CAPACITY_EXCEEDED; at exactly capacity the consent is rejected)"
        side_effects:
          - "consent_form_version and consented_at recorded; site enrolled_count += 1; study enrolled_total recomputed"
      - from: CONSENTED
        to: RANDOMIZED_TREATMENT
        trigger: "POST /evaluation/participants/{participantId}/randomize"
        actor: PrincipalInvestigator
        preconditions:
          - "Participant must be CONSENTED (ERR_PARTICIPANT_INVALID_STATE)"
          - "Study's current DesignPlan must be LOCKED (ERR_DESIGN_PLAN_INVALID_STATE)"
          - "Deterministic allocation: let p = site.randomized_count mod plan.randomization_ratio_den; TREATMENT iff p < plan.randomization_ratio_num (this transition applies when p < num)"
        side_effects:
          - "site.randomized_count += 1"
      - from: CONSENTED
        to: RANDOMIZED_CONTROL
        trigger: "POST /evaluation/participants/{participantId}/randomize"
        actor: PrincipalInvestigator
        preconditions:
          - "Participant must be CONSENTED (ERR_PARTICIPANT_INVALID_STATE)"
          - "Study's current DesignPlan must be LOCKED (ERR_DESIGN_PLAN_INVALID_STATE)"
          - "Deterministic allocation: p = site.randomized_count mod plan.randomization_ratio_den; CONTROL iff p >= plan.randomization_ratio_num (this transition applies when p >= num)"
        side_effects:
          - "site.randomized_count += 1"
      - from: IDENTIFIED
        to: WITHDRAWN
        trigger: "POST /evaluation/participants/{participantId}/withdraw, or cascade"
        actor: Participant | StudyDirector | system
        preconditions:
          - "Participant must be IDENTIFIED, CONSENTED, RANDOMIZED_TREATMENT, or RANDOMIZED_CONTROL (ERR_PARTICIPANT_INVALID_STATE)"
          - "If actor is Participant role: X-User-ID must equal participant.id (ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "If leaving CONSENTED/RANDOMIZED_*: site enrolled_count -= 1 and study enrolled_total recomputed"
          - "Every RECEIVED or VALIDATED ResponseRecord of this participant -> QUARANTINED; study quarantined_record_count recomputed"
          - "withdrawal_reason = PARTICIPANT_INITIATED | SITE_WITHDRAWN | CONTRACT_TERMINATED by origin"
      - from: CONSENTED
        to: WITHDRAWN
        trigger: "POST /evaluation/participants/{participantId}/withdraw, or cascade"
        actor: Participant | StudyDirector | system
        preconditions:
          - "Same as IDENTIFIED -> WITHDRAWN"
        side_effects:
          - "Same as IDENTIFIED -> WITHDRAWN"
      - from: RANDOMIZED_TREATMENT
        to: WITHDRAWN
        trigger: "POST /evaluation/participants/{participantId}/withdraw, or cascade"
        actor: Participant | StudyDirector | system
        preconditions:
          - "Same as IDENTIFIED -> WITHDRAWN"
        side_effects:
          - "Same as IDENTIFIED -> WITHDRAWN"
      - from: RANDOMIZED_CONTROL
        to: WITHDRAWN
        trigger: "POST /evaluation/participants/{participantId}/withdraw, or cascade"
        actor: Participant | StudyDirector | system
        preconditions:
          - "Same as IDENTIFIED -> WITHDRAWN"
        side_effects:
          - "Same as IDENTIFIED -> WITHDRAWN"
      - from: CONSENTED
        to: COMPLETED
        trigger: "system (cascade when owning site reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RANDOMIZED_TREATMENT
        to: COMPLETED
        trigger: "system (cascade when owning site reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RANDOMIZED_CONTROL
        to: COMPLETED
        trigger: "system (cascade when owning site reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DataCollectionWave
    initial_state: PLANNED
    terminal_states: [LINKED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /evaluation/waves/{waveId}/open"
        actor: DataManager
        preconditions:
          - "Wave must be PLANNED or SUSPENDED (ERR_WAVE_INVALID_STATE)"
          - "Current logical time must be within [open_at, close_at) — at exactly open_at opening is allowed, at exactly close_at it is not (ERR_WAVE_WINDOW_NOT_STARTED)"
        side_effects:
          - "If study is RECRUITMENT and this is its first OPEN wave: study -> DATA_COLLECTION"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /evaluation/waves/{waveId}/open"
        actor: DataManager
        preconditions:
          - "Wave must be PLANNED or SUSPENDED (ERR_WAVE_INVALID_STATE)"
          - "Study must have an IRBProtocol APPROVED covering now (ERR_NO_APPROVED_IRB / ERR_IRB_EXPIRED)"
          - "Current logical time within [open_at, close_at) (ERR_WAVE_WINDOW_NOT_STARTED)"
        side_effects:
          - "Records of this wave that were QUARANTINED by the IRB-expiry cascade stay QUARANTINED (no auto-restore)"
      - from: OPEN
        to: SUSPENDED
        trigger: "system (cascade when the study's IRB protocol expires)"
        actor: system
        preconditions: []
        side_effects:
          - "Each RECEIVED or VALIDATED record of this wave -> QUARANTINED"
      - from: OPEN
        to: CLOSED
        trigger: "POST /evaluation/waves/{waveId}/close"
        actor: DataManager
        preconditions:
          - "Wave must be OPEN (ERR_WAVE_INVALID_STATE)"
        side_effects:
          - "Every RECEIVED record of this wave -> VALIDATED"
          - "If every other wave of the study is CLOSED, LINKED, or CANCELLED and study is DATA_COLLECTION: study -> ANALYSIS"
      - from: CLOSED
        to: LINKED
        trigger: "POST /evaluation/waves/{waveId}/link"
        actor: DataManager
        preconditions:
          - "Wave must be CLOSED (ERR_WAVE_INVALID_STATE)"
          - "No record of this wave may remain in RECEIVED (ERR_RECORDS_UNRESOLVED)"
        side_effects:
          - "Every VALIDATED record -> LINKED and receives a linkage_key (pseudonymization at linkage)"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ResponseRecord
    initial_state: RECEIVED
    terminal_states: [LINKED, QUARANTINED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "system (when the owning wave closes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: LINKED
        trigger: "system (when the owning wave links)"
        actor: system
        preconditions: []
        side_effects:
          - "linkage_key assigned"
      - from: RECEIVED
        to: QUARANTINED
        trigger: "system (participant withdrawal or IRB-expiry cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Study quarantined_record_count recomputed"
      - from: VALIDATED
        to: QUARANTINED
        trigger: "system (participant withdrawal or IRB-expiry cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Study quarantined_record_count recomputed"

  - entity: AnalysisPlan
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PREREGISTERED
        trigger: "POST /evaluation/analysis-plans/{planId}/register"
        actor: PrincipalInvestigator
        preconditions:
          - "Plan must be DRAFT (ERR_ANALYSIS_PLAN_INVALID_STATE)"
          - "Study's current DesignPlan must be LOCKED (ERR_DESIGN_PLAN_INVALID_STATE)"
          - "No wave of the study may be CLOSED or LINKED yet — preregistration precedes unblinded data (ERR_PREREGISTRATION_TOO_LATE)"
        side_effects:
          - "registered_at = current logical time; primary_outcomes frozen (version-pinned at registration)"
      - from: PREREGISTERED
        to: PREREGISTERED
        trigger: "POST /evaluation/analysis-plans/{planId}/amend"
        actor: PrincipalInvestigator
        preconditions:
          - "Plan must be PREREGISTERED (ERR_ANALYSIS_PLAN_INVALID_STATE)"
          - "Payload must not contain primary_outcomes (ERR_PRIMARY_OUTCOME_FROZEN)"
        side_effects:
          - "secondary_outcomes replaced; amendment_count += 1"
        note: "Self-loop: amendments never alter frozen primary outcomes and never leave PREREGISTERED"

  - entity: FindingsReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /evaluation/reports/{reportId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Report must be DRAFT or REVISION (ERR_REPORT_INVALID_STATE)"
          - "Study's AnalysisPlan must be PREREGISTERED (ERR_ANALYSIS_PLAN_NOT_REGISTERED)"
          - "addressed_primary_outcomes must include every code in the plan's frozen primary_outcomes (ERR_UNREPORTED_PRIMARY_OUTCOME)"
        side_effects:
          - "submitted_at = now; submitted_by_id = X-User-ID; peer_review_due = submitted_at + PEER_REVIEW_DAYS"
      - from: REVISION
        to: SUBMITTED
        trigger: "POST /evaluation/reports/{reportId}/submit"
        actor: PrincipalInvestigator
        preconditions:
          - "Report must be DRAFT or REVISION (ERR_REPORT_INVALID_STATE)"
          - "Current logical time <= revision_due (ERR_REVISION_DEADLINE_MISSED; at exactly revision_due resubmission is allowed)"
          - "Study's AnalysisPlan must be PREREGISTERED (ERR_ANALYSIS_PLAN_NOT_REGISTERED)"
          - "addressed_primary_outcomes must include every frozen primary outcome (ERR_UNREPORTED_PRIMARY_OUTCOME)"
        side_effects:
          - "submitted_at = now; submitted_by_id = X-User-ID; peer_review_due recomputed; revision_due cleared"
      - from: SUBMITTED
        to: PEER_REVIEWED
        trigger: "POST /evaluation/reports/{reportId}/review"
        actor: PeerReviewer
        preconditions:
          - "Report must be SUBMITTED (ERR_REPORT_INVALID_STATE)"
          - "X-User-ID must differ from submitted_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_id = X-User-ID"
      - from: PEER_REVIEWED
        to: ACCEPTED
        trigger: "POST /evaluation/reports/{reportId}/agency-decision with decision=ACCEPTED"
        actor: AgencyOfficer
        preconditions:
          - "Report must be PEER_REVIEWED (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "accepted_at = now; publication_due = accepted_at + PUBLICATION_DAYS"
      - from: PEER_REVIEWED
        to: REVISION
        trigger: "POST /evaluation/reports/{reportId}/agency-decision with decision=REVISION_REQUIRED"
        actor: AgencyOfficer
        preconditions:
          - "Report must be PEER_REVIEWED (ERR_REPORT_INVALID_STATE)"
        side_effects:
          - "revision_count += 1; revision_due = now + REVISION_DAYS"
      - from: ACCEPTED
        to: PUBLISHED
        trigger: "POST /evaluation/reports/{reportId}/publish"
        actor: AgencyOfficer
        preconditions:
          - "Report must be ACCEPTED (ERR_REPORT_INVALID_STATE)"
          - "Current logical time <= publication_due (ERR_PUBLICATION_DEADLINE_MISSED; at exactly publication_due publishing is allowed)"
          - "payment_milestone_cents <= contract.remaining_cents (ERR_INSUFFICIENT_CONTRACT_FUNDS)"
        side_effects:
          - "contract.disbursed_cents += payment_milestone_cents; contract.remaining_cents recomputed"
          - "If study is REPORTING and this is its first PUBLISHED report: study -> DISSEMINATION"
      - from: DRAFT
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PEER_REVIEWED
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RestrictedUseFile
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: DISCLOSURE_REVIEW
        trigger: "POST /evaluation/restricted-use-files/{fileId}/submit-review"
        actor: DataManager
        preconditions:
          - "File must be DRAFT or RISK_REJECTED (ERR_RUF_INVALID_STATE)"
        side_effects:
          - "suppressed_cell_count, max_risk, mean_risk computed (see disclosure_risk_score)"
      - from: RISK_REJECTED
        to: DISCLOSURE_REVIEW
        trigger: "POST /evaluation/restricted-use-files/{fileId}/submit-review"
        actor: DataManager
        preconditions:
          - "File must be DRAFT or RISK_REJECTED (ERR_RUF_INVALID_STATE)"
        side_effects:
          - "suppressed_cell_count, max_risk, mean_risk recomputed"
      - from: DISCLOSURE_REVIEW
        to: RELEASED
        trigger: "POST /evaluation/restricted-use-files/{fileId}/review-decision with decision=APPROVE"
        actor: AgencyOfficer
        preconditions:
          - "File must be DISCLOSURE_REVIEW (ERR_RUF_INVALID_STATE)"
          - "X-User-ID must differ from prepared_by_id (ERR_SEGREGATION_OF_DUTIES)"
          - "max_risk <= MAX_DISCLOSURE_RISK (ERR_DISCLOSURE_RISK_TOO_HIGH; exactly MAX_DISCLOSURE_RISK passes)"
        side_effects: []
      - from: DISCLOSURE_REVIEW
        to: RISK_REJECTED
        trigger: "POST /evaluation/restricted-use-files/{fileId}/review-decision with decision=REJECT"
        actor: AgencyOfficer
        preconditions:
          - "File must be DISCLOSURE_REVIEW (ERR_RUF_INVALID_STATE)"
          - "X-User-ID must differ from prepared_by_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: DisseminationActivity
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /evaluation/dissemination-activities/{activityId}/complete"
        actor: PrincipalInvestigator
        preconditions:
          - "Activity must be PLANNED (ERR_DISSEMINATION_INVALID_STATE)"
        side_effects:
          - "If this completion satisfies study completion preconditions (FINAL report count met and this is the first COMPLETED activity): study DISSEMINATION -> COMPLETED"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade from contract termination)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: design-plan-create-stale-study
    parent_entity: Study
    write_endpoint: "POST /evaluation/studies/{studyId}/design-plans"
    occ_field: expected_study_version
    description: |
      Creating a DesignPlan supersedes the study's current DRAFT or
      RETURNED_FOR_REVISION plan and bumps Study.version. A create request
      carrying an expected_study_version that no longer matches Study.version
      is rejected as stale: another design-plan write has legitimately
      superseded the prior plan since the client last observed the study.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: required_sample_size
    trigger: "DesignPlan creation (both n_per_arm and required_total_n stamped at create; recomputed on revise is not allowed — revise keeps parameters, only reopens submission)"
    algorithm: tiered_scoring
    formula: |
      design_effect = 1 + (cluster_size - 1) * icc
      raw = 2 * (Z_ALPHA_CRIT + Z_POWER_CRIT)^2 * design_effect / (mde^2)
      if design_type == RCT:
        n_per_arm = ceil(raw / (1 - attrition_rate))
      else (any QED_* design_type):
        n_per_arm = ceil(raw * QED_VARIANCE_INFLATION / (1 - attrition_rate))
      required_total_n = 2 * n_per_arm
    input_set: "The DesignPlan's own mde, cluster_size, icc, attrition_rate, design_type"
    constants_used: [Z_ALPHA_CRIT, Z_POWER_CRIT, QED_VARIANCE_INFLATION]
    precision: "ceil to integer per arm; required_total_n = 2 * n_per_arm (exact)"
    variants:
      - name: randomized
        when: "design_type == RCT"
        difference: "no variance inflation; n_per_arm = ceil(raw / (1 - attrition_rate))"
      - name: quasi_experimental
        when: "design_type is QED_MATCHING, QED_RDD, or QED_DID"
        difference: "raw inflated by QED_VARIANCE_INFLATION before attrition division, so identical inputs yield a larger n_per_arm than randomized"
    worked_example: "mde=0.5, cluster_size=10, icc=0.05, attrition_rate=0.15: design_effect=1.45, raw=90.944; RCT n_per_arm=107, required_total_n=214; QED n_per_arm=155, required_total_n=310"

  - name: recruitment_feasibility_projection
    trigger: "recomputed on every Site create/outreach/sign-mou/activate/withdraw and on DesignPlan create; result stored on Study.committed_projected_n, Study.pipeline_projected_n, Study.sample_adequacy"
    algorithm: forward_looking
    formula: |
      committed_projected_n = sum of max_participants over sites with status in {RECRUITED, ACTIVE}
      pipeline_projected_n = committed_projected_n
          + sum of floor(max_participants * YIELD_CONTACTED) over sites with status CONTACTED
          + sum of floor(max_participants * YIELD_PROSPECTED) over sites with status PROSPECTED
      current_plan = latest-created DesignPlan of the study with status not SUPERSEDED (tie impossible: creation is sequential)
      if current_plan is none: sample_adequacy = UNASSESSED
      else: sample_adequacy = ADEQUATE when pipeline_projected_n >= current_plan.required_total_n else UNDERPOWERED
    input_set: "Sites of the study with status in {PROSPECTED, CONTACTED, RECRUITED, ACTIVE}; DECLINED, WITHDRAWN, COMPLETED sites contribute 0 to both variants"
    constants_used: [YIELD_CONTACTED, YIELD_PROSPECTED]
    precision: "floor per site contribution, then sum (integer)"
    variants:
      - name: committed_only
        when: "reported as committed_projected_n"
        difference: "counts only secured capacity (RECRUITED/ACTIVE); ignores pipeline yield, so identical site data yields a smaller projection than pipeline"
      - name: pipeline
        when: "reported as pipeline_projected_n and used by sample_adequacy and the design-submit gate"
        difference: "adds floor(capacity * yield) per PROSPECTED/CONTACTED site"
    worked_example: "sites RECRUITED 60 + CONTACTED 300 + CONTACTED 300: committed=60, pipeline=60+105+105=270"

  - name: participant_burden_total
    trigger: "ResponseRecord creation (cap check) and any read of Participant.burden_total_minutes"
    algorithm: aggregation
    formula: |
      per record: billed_minutes = round_half_up(instrument_minutes * MODE_FACTOR(wave.wave_type))
        MODE_FACTOR: SURVEY -> MODE_FACTOR_SURVEY (1.0); SITE_VISIT -> MODE_FACTOR_SITE_VISIT (1.25); ADMIN_RECORDS -> MODE_FACTOR_ADMIN_RECORDS (0.5)
      participant burden_total_minutes = sum of billed_minutes over the participant's records
        with status in {RECEIVED, VALIDATED, LINKED} (QUARANTINED records excluded)
      ROUNDING ORDER IS PINNED: round each record's billed_minutes FIRST, then sum the integers.
      The alternative (sum raw products, then round once) is explicitly rejected.
    input_set: "ResponseRecords of the participant with status in {RECEIVED, VALIDATED, LINKED}"
    constants_used: [MODE_FACTOR_SURVEY, MODE_FACTOR_SITE_VISIT, MODE_FACTOR_ADMIN_RECORDS, MAX_TOTAL_BURDEN_MINUTES]
    precision: "round_half_up to integer minutes per record; totals are exact integer sums"
    worked_example: "two SITE_VISIT records of 45 min and one SURVEY record of 45 min: per-record 56+56+45=157 (sum-first would give round_half_up(157.5)=158)"

  - name: disclosure_risk_score
    trigger: "RestrictedUseFile submit-review (computed on DRAFT->DISCLOSURE_REVIEW and RISK_REJECTED->DISCLOSURE_REVIEW)"
    algorithm: tiered_scoring
    formula: |
      EVALUATION ORDER IS PINNED (suppress first, then compute on survivors only):
      1. surviving cells = cells whose count >= K_ANONYMITY_MIN; all others are suppressed
      2. suppressed_cell_count = number of suppressed cells
      3. denominators use surviving cells only (suppressed cells never enter any sum)
      4. per-cell risk = sensitivity_weight / count for each surviving cell
      5. max_risk = max of per-cell risks
      6. mean_risk = sum(sensitivity_weights of surviving cells) / sum(counts of surviving cells)
      If no cells survive: max_risk = 1.0 and mean_risk = 1.0 (empty-survivor fallback)
    input_set: "The file's own cell_counts and sensitivity_weights (parallel arrays)"
    constants_used: [K_ANONYMITY_MIN, MAX_DISCLOSURE_RISK]
    precision: "4 decimal places, round_half_up"
    variants:
      - name: max_cell
        when: "stored as max_risk; the release gate uses this variant"
        difference: "worst-case single cell; identical input yields a value >= the mean_weighted variant"
      - name: mean_weighted
        when: "stored as mean_risk; informational"
        difference: "weight-weighted average over surviving cells; strictly smaller than max_cell whenever surviving cell risks differ"
    worked_example: "cell_counts=[5,4,12,30], weights=[1.0,1.0,0.5,0.5]: cell of 4 suppressed; surviving [5,12,30]; max_risk=1.0/5=0.20 (exactly MAX_DISCLOSURE_RISK, passes); mean_risk=(1.0+0.5+0.5)/47=0.0426"

  - name: contract_funds_ledger
    trigger: "report publish (disburse), contract terminate/closeout (forfeit)"
    algorithm: waterfall_allocation
    formula: |
      remaining_cents = award_amount_cents - disbursed_cents - forfeited_cents
      on publish: disbursed_cents += report.payment_milestone_cents
      on terminate or closeout: forfeited_cents = remaining_cents (then remaining_cents = 0)
      INVARIANT (compensating pair): at every observable instant,
        disbursed_cents + forfeited_cents + remaining_cents == award_amount_cents
    input_set: "The contract's own ledger fields and the published report's payment_milestone_cents"
    precision: "integer cents, exact"

  - name: enrollment_reconciliation
    trigger: "participant consent, participant withdraw (any origin), site withdraw cascade"
    algorithm: aggregation
    formula: |
      counted(participant) = participant.status in {CONSENTED, RANDOMIZED_TREATMENT, RANDOMIZED_CONTROL}
      site.enrolled_count = count of counted participants at that site
      study.enrolled_total = count of counted participants across all sites of the study
      INVARIANT (compensating pair): consent (+1) and withdraw (-1) leave
        sum over sites of enrolled_count == study.enrolled_total == direct recount of counted participants
    input_set: "Participants of the study's sites in the counted statuses"
    precision: "integer counts, exact"

  - name: report_timeline
    trigger: "report submit / agency-decision / publish"
    algorithm: threshold
    formula: |
      on submit: peer_review_due = submitted_at + PEER_REVIEW_DAYS days
      on REVISION_REQUIRED: revision_due = decision_time + REVISION_DAYS days
      on ACCEPTED: publication_due = accepted_at + PUBLICATION_DAYS days
      boundary: an action at exactly its due timestamp PASSES (<= semantics); one second past fails
    input_set: "The report's own timestamps"
    constants_used: [PEER_REVIEW_DAYS, AGENCY_COMMENT_DAYS, REVISION_DAYS, PUBLICATION_DAYS]
    precision: "ISO8601 datetimes, second precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's role list; for entity-backed role Participant acting on a participant resource, X-User-ID must equal that participant's id"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right; a nested resource must belong to its path parent (e.g. study under contract, wave under study)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 3.5
    category: existence
    check: "Request body must satisfy the endpoint's input schema: required fields present, no undeclared fields, types valid, enum values in range, window end > start where applicable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: business_temporal
    check: "OCC: expected_study_version must equal the study's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /evaluation/studies/{studyId}/design-plans"

  - priority: 5
    category: state
    check: "Target entity must be in a valid from-state for the requested transition (per the state machines), including: contract ACTIVE for child creation; wave OPEN for record creation; study in DESIGN or RECRUITMENT for site and design-plan creation, in RECRUITMENT or DATA_COLLECTION for wave creation, in DESIGN..ANALYSIS for analysis-plan creation, in ANALYSIS, REPORTING, or DISSEMINATION for report creation, and not TERMINATED or COMPLETED for any child creation; site RECRUITED or ACTIVE for participant creation; design plan LOCKED for site activation, randomize, and analysis-plan register"
    error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_STUDY_INVALID_STATE | ERR_DESIGN_PLAN_INVALID_STATE | ERR_IRB_INVALID_STATE | ERR_SITE_INVALID_STATE | ERR_PARTICIPANT_INVALID_STATE | ERR_WAVE_INVALID_STATE | ERR_ANALYSIS_PLAN_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_RUF_INVALID_STATE | ERR_DISSEMINATION_INVALID_STATE | ERR_WAVE_NOT_OPEN"
    http_status: 409
    applies_to: "all transition/action endpoints and child-creating POSTs"

  - priority: 6
    category: business_safety
    check: "Human-subjects compliance: study must hold an IRBProtocol APPROVED whose window covers now (site activate, wave open, consent); consent_form_version must match current approved version; participant billed burden must not exceed MAX_TOTAL_BURDEN_MINUTES; preregistration must precede any closed wave; primary outcomes frozen; segregation of duties (IRB decider != submitter, report reviewer != submitter, RUF decider != preparer); RUF release risk gate"
    error_id: "ERR_NO_APPROVED_IRB | ERR_IRB_EXPIRED | ERR_CONSENT_VERSION_STALE | ERR_BURDEN_CAP_EXCEEDED | ERR_PREREGISTRATION_TOO_LATE | ERR_PRIMARY_OUTCOME_FROZEN | ERR_SEGREGATION_OF_DUTIES | ERR_DISCLOSURE_RISK_TOO_HIGH"
    http_status: "403 or 409 or 422 per error catalog"
    applies_to: "site activate; wave open; participant consent; record create; analysis plan register/amend; irb decision; report review; ruf review-decision"

  - priority: 7
    category: business_temporal
    check: "Window and deadline rules: wave open within [open_at, close_at); SITE_VISIT windows at the same site must neither overlap nor sit closer than SITE_VISIT_MIN_GAP_DAYS; new IRB approval window must not overlap another APPROVED window of the study; report resubmission by revision_due; publication by publication_due"
    error_id: "ERR_WAVE_WINDOW_NOT_STARTED | ERR_VISIT_WINDOW_CONFLICT | ERR_IRB_WINDOW_OVERLAP | ERR_REVISION_DEADLINE_MISSED | ERR_PUBLICATION_DEADLINE_MISSED"
    http_status: 409
    applies_to: "wave create/open; irb decision; report submit; report publish"
    note: "ERR_IRB_WINDOW_OVERLAP is listed under business_temporal; ERR_REVISION_DEADLINE_MISSED and ERR_PUBLICATION_DEADLINE_MISSED carry http 422 per the error catalog"

  - priority: 8
    category: business_constraint
    check: "Capacity, coverage, and gate rules: site enrolled_count < max_participants at consent; design submit requires pipeline_projected_n >= required_total_n; report submit must address every frozen primary outcome; record create requires participant consented-or-randomized and not withdrawn; RUF create and dissemination create require at least one PUBLISHED report of the study; contract closeout requires all studies COMPLETED"
    error_id: "ERR_SITE_CAPACITY_EXCEEDED | ERR_INSUFFICIENT_POWER | ERR_UNREPORTED_PRIMARY_OUTCOME | ERR_PARTICIPANT_NOT_CONSENTED | ERR_NO_PUBLISHED_REPORT | ERR_STUDIES_NOT_COMPLETED"
    http_status: "409 or 422 per error catalog"
    applies_to: "participant consent; design-plan submit; report submit; wave link; record create; ruf create; dissemination create; contract closeout"

  - priority: 9
    category: business_fiscal
    check: "Fiscal sufficiency: report payment_milestone_cents must not exceed contract.remaining_cents at publish"
    error_id: ERR_INSUFFICIENT_CONTRACT_FUNDS
    http_status: 402
    applies_to: "POST /evaluation/reports/{reportId}/publish"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Contracts ---
  - method: POST
    path: "/evaluation/contracts"
    description: "Award a new evaluation contract (starts ACTIVE)"
    roles: [AgencyOfficer]
    code: 201
    input: [agency_code, title, award_amount_cents, "deliverable_report_count?"]
    output: EvaluationContract
    side_effects: ["status = ACTIVE; disbursed_cents = 0; forfeited_cents = 0; remaining_cents = award_amount_cents"]

  - method: GET
    path: "/evaluation/contracts/{contractId}"
    description: "Get one contract"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: EvaluationContract
    side_effects: []

  - method: POST
    path: "/evaluation/contracts/{contractId}/terminate"
    description: "Terminate a contract; cascades termination through studies, sites, participants, waves, reports, activities"
    roles: [AgencyOfficer]
    code: 200
    input: [reason]
    output: EvaluationContract
    side_effects: ["status -> TERMINATED; forfeited_cents = remaining_cents; remaining_cents = 0; full cascade per EvaluationContract state machine"]

  - method: POST
    path: "/evaluation/contracts/{contractId}/closeout"
    description: "Close a contract once every study is COMPLETED"
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: EvaluationContract
    side_effects: ["status -> CLOSED; forfeited_cents = remaining_cents; remaining_cents = 0"]

  # --- Studies ---
  - method: POST
    path: "/evaluation/contracts/{id}/studies"
    description: "Create a study under a contract (starts DESIGN)"
    roles: [PrincipalInvestigator]
    code: 201
    input: [title, research_question]
    output: Study
    side_effects: ["status = DESIGN; projections initialized to 0; sample_adequacy = UNASSESSED"]

  - method: GET
    path: "/evaluation/contracts/{id}/studies"
    description: "List studies of a contract"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "Study[]"
    side_effects: []

  - method: GET
    path: "/evaluation/studies/{studyId}"
    description: "Get one study (projections, adequacy, counters)"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: Study
    side_effects: []

  # --- Design Plans ---
  - method: POST
    path: "/evaluation/studies/{id}/design-plans"
    description: "Create a design plan revision (OCC-guarded; supersedes the study's current DRAFT or RETURNED_FOR_REVISION plan)"
    roles: [PrincipalInvestigator]
    code: 201
    input: [design_type, mde, cluster_size, icc, attrition_rate, expected_study_version, "alpha?", "power_target?", "randomization_ratio_num?", "randomization_ratio_den?"]
    output: DesignPlan
    side_effects: ["status = DRAFT; revision_number = 1 (or prior plan revision_number + 1 when superseding); prior DRAFT/RETURNED_FOR_REVISION plan -> SUPERSEDED; n_per_arm and required_total_n computed per required_sample_size; increments Study.version by 1; study projections recomputed"]

  - method: GET
    path: "/evaluation/studies/{id}/design-plans"
    description: "List design plans of a study"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "DesignPlan[]"
    side_effects: []

  - method: POST
    path: "/evaluation/design-plans/{planId}/submit"
    description: "Submit a DRAFT plan to the agency (feasibility gate)"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: DesignPlan
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/evaluation/design-plans/{planId}/agency-decision"
    description: "Agency approves or returns a submitted plan"
    roles: [AgencyOfficer]
    code: 200
    input: [decision]
    output: DesignPlan
    side_effects: ["decision=APPROVED -> AGENCY_APPROVED (then auto-LOCKED if a site is RECRUITED/ACTIVE, which also moves study DESIGN -> RECRUITMENT); decision=RETURNED -> RETURNED_FOR_REVISION"]

  - method: POST
    path: "/evaluation/design-plans/{planId}/revise"
    description: "Reopen a RETURNED_FOR_REVISION plan as DRAFT (revision_number += 1)"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: DesignPlan
    side_effects: ["status -> DRAFT; revision_number += 1"]

  # --- IRB Protocols ---
  - method: POST
    path: "/evaluation/studies/{id}/irb-protocols"
    description: "Create an IRB protocol draft"
    roles: [PrincipalInvestigator]
    code: 201
    input: [title, estimated_burden_minutes]
    output: IRBProtocol
    side_effects: ["status = DRAFT; consent_form_version = 1"]

  - method: GET
    path: "/evaluation/studies/{id}/irb-protocols"
    description: "List IRB protocols of a study"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "IRBProtocol[]"
    side_effects: []

  - method: POST
    path: "/evaluation/irb-protocols/{irbId}/submit"
    description: "Submit (or resubmit) a protocol to the IRB"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: IRBProtocol
    side_effects: ["status -> SUBMITTED; submitted_by_id = X-User-ID"]

  - method: POST
    path: "/evaluation/irb-protocols/{irbId}/decision"
    description: "IRB decision; APPROVED pins the half-open approval window and bumps consent_form_version after a modifications cycle"
    roles: [IRBReviewer]
    code: 200
    input: [decision, "approval_start?", "approval_end?"]
    output: IRBProtocol
    side_effects: ["decision=APPROVED -> APPROVED with window; decision=MODIFICATIONS_REQUIRED -> MODIFICATIONS_REQUIRED; decided_by_id = X-User-ID"]

  - method: POST
    path: "/evaluation/irb-protocols/{irbId}/continuing-review"
    description: "Continuing review: extend approval_end of an APPROVED protocol"
    roles: [IRBReviewer]
    code: 200
    input: [new_approval_end]
    output: IRBProtocol
    side_effects: ["approval_end = new_approval_end; version += 1"]

  # --- Sites ---
  - method: POST
    path: "/evaluation/studies/{id}/sites"
    description: "Add a recruitment site (starts PROSPECTED)"
    roles: [StudyDirector]
    code: 201
    input: [name, max_participants]
    output: Site
    side_effects: ["status = PROSPECTED; study pipeline_projected_n recomputed"]

  - method: GET
    path: "/evaluation/studies/{id}/sites"
    description: "List sites of a study"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "Site[]"
    side_effects: []

  - method: POST
    path: "/evaluation/sites/{siteId}/outreach"
    description: "Record outreach outcome: CONTACTED advances the pipeline, DECLINED terminates the site"
    roles: [StudyDirector]
    code: 200
    input: [outcome]
    output: Site
    side_effects: ["outcome=CONTACTED -> CONTACTED; outcome=DECLINED -> DECLINED; study pipeline_projected_n recomputed"]

  - method: POST
    path: "/evaluation/sites/{siteId}/sign-mou"
    description: "Sign the site MOU (CONTACTED -> RECRUITED); may lock the approved design plan"
    roles: [StudyDirector]
    code: 200
    input: []
    output: Site
    side_effects: ["status -> RECRUITED; committed/pipeline projections recomputed; if current DesignPlan is AGENCY_APPROVED: plan -> LOCKED and study DESIGN -> RECRUITMENT"]

  - method: POST
    path: "/evaluation/sites/{siteId}/activate"
    description: "Activate a recruited site (requires unexpired IRB approval and LOCKED design plan)"
    roles: [StudyDirector]
    code: 200
    input: []
    output: Site
    side_effects: ["status -> ACTIVE; committed_projected_n recomputed"]

  - method: POST
    path: "/evaluation/sites/{siteId}/withdraw"
    description: "Withdraw a site; cascades to its participants and their records and recomputes study projections"
    roles: [StudyDirector]
    code: 200
    input: ["reason?"]
    output: Site
    side_effects: ["status -> WITHDRAWN; participants non-terminal -> WITHDRAWN (SITE_WITHDRAWN); their RECEIVED/VALIDATED records -> QUARANTINED; study projections, enrolled_total, sample_adequacy, quarantined_record_count recomputed"]

  # --- Participants ---
  - method: POST
    path: "/evaluation/sites/{siteId}/participants"
    description: "Identify a prospective participant at a site (starts IDENTIFIED)"
    roles: [StudyDirector]
    code: 201
    input: [external_ref]
    output: Participant
    side_effects: ["status = IDENTIFIED"]

  - method: GET
    path: "/evaluation/participants"
    description: "List participants, optionally filtered"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: ["site_id?", "status?"]
    output: "Participant[]"
    side_effects: []

  - method: GET
    path: "/evaluation/participants/{participantId}"
    description: "Get one participant; the Participant role may read only its own record (X-User-ID == participant id)"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: POST
    path: "/evaluation/participants/{participantId}/consent"
    description: "Participant self-consents against the current approved consent form version"
    roles: [Participant]
    code: 200
    input: [consent_form_version]
    output: Participant
    side_effects: ["status -> CONSENTED; consent_form_version and consented_at recorded; site enrolled_count += 1; study enrolled_total recomputed"]

  - method: POST
    path: "/evaluation/participants/{participantId}/randomize"
    description: "Deterministic arm allocation by per-site allocation counter and the locked plan's ratio"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: Participant
    side_effects: ["status -> RANDOMIZED_TREATMENT or RANDOMIZED_CONTROL per allocation rule; site.randomized_count += 1"]

  - method: POST
    path: "/evaluation/participants/{participantId}/withdraw"
    description: "Withdraw a participant (self-initiated or study-directed); quarantines their unresolved records"
    roles: [Participant, StudyDirector]
    code: 200
    input: ["reason?"]
    output: Participant
    side_effects: ["status -> WITHDRAWN; enrolled counters decremented if consented; RECEIVED/VALIDATED records -> QUARANTINED; study enrolled_total and quarantined_record_count recomputed"]

  # --- Data Collection Waves ---
  - method: POST
    path: "/evaluation/studies/{id}/waves"
    description: "Plan a data collection wave; SITE_VISIT waves carry site_id and must not overlap or sit within SITE_VISIT_MIN_GAP_DAYS of another SITE_VISIT at the same site"
    roles: [DataManager]
    code: 201
    input: [wave_type, open_at, close_at, "site_id?"]
    output: DataCollectionWave
    side_effects: ["status = PLANNED"]

  - method: GET
    path: "/evaluation/studies/{id}/waves"
    description: "List waves of a study"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "DataCollectionWave[]"
    side_effects: []

  - method: GET
    path: "/evaluation/waves"
    description: "List waves across studies, optionally filtered (supports site_id reverse lookup)"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: ["site_id?", "study_id?", "wave_type?", "status?"]
    output: "DataCollectionWave[]"
    side_effects: []

  - method: GET
    path: "/evaluation/waves/{waveId}"
    description: "Get one wave"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: DataCollectionWave
    side_effects: []

  - method: POST
    path: "/evaluation/waves/{waveId}/open"
    description: "Open a planned or suspended wave inside its window (requires unexpired IRB approval)"
    roles: [DataManager]
    code: 200
    input: []
    output: DataCollectionWave
    side_effects: ["status -> OPEN; first OPEN wave moves study RECRUITMENT -> DATA_COLLECTION"]

  - method: POST
    path: "/evaluation/waves/{waveId}/close"
    description: "Close an open wave; validates its received records; may move study to ANALYSIS"
    roles: [DataManager]
    code: 200
    input: []
    output: DataCollectionWave
    side_effects: ["status -> CLOSED; RECEIVED records -> VALIDATED; study -> ANALYSIS when no wave remains PLANNED/OPEN/SUSPENDED"]

  - method: POST
    path: "/evaluation/waves/{waveId}/link"
    description: "Link a closed wave: assigns pseudonymous linkage_key to validated records"
    roles: [DataManager]
    code: 200
    input: []
    output: DataCollectionWave
    side_effects: ["status -> LINKED; VALIDATED records -> LINKED with linkage_key assigned"]

  # --- Response Records ---
  - method: POST
    path: "/evaluation/waves/{id}/records"
    description: "Add a collected record to an OPEN wave (burden-cap checked per participant)"
    roles: [DataManager]
    code: 201
    input: [participant_id, instrument_minutes, payload_ref]
    output: ResponseRecord
    side_effects: ["status = RECEIVED; billed_minutes computed per participant_burden_total; participant burden_total_minutes recomputed"]

  - method: GET
    path: "/evaluation/waves/{id}/records"
    description: "List records of a wave"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "ResponseRecord[]"
    side_effects: []

  - method: GET
    path: "/evaluation/participants/{id}/records"
    description: "List records of a participant"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "ResponseRecord[]"
    side_effects: []

  # --- Analysis Plans (preregistration) ---
  - method: POST
    path: "/evaluation/studies/{id}/analysis-plans"
    description: "Draft an analysis plan with prespecified primary and secondary outcomes"
    roles: [PrincipalInvestigator]
    code: 201
    input: [primary_outcomes, "secondary_outcomes?"]
    output: AnalysisPlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/evaluation/studies/{id}/analysis-plans"
    description: "List analysis plans of a study"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "AnalysisPlan[]"
    side_effects: []

  - method: POST
    path: "/evaluation/analysis-plans/{planId}/register"
    description: "Preregister the plan: freezes primary outcomes; must precede any closed wave"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: AnalysisPlan
    side_effects: ["status -> PREREGISTERED; registered_at = now; primary_outcomes frozen"]

  - method: POST
    path: "/evaluation/analysis-plans/{planId}/amend"
    description: "Amend secondary outcomes post-registration; primary outcomes are frozen"
    roles: [PrincipalInvestigator]
    code: 200
    input: ["secondary_outcomes?", "primary_outcomes?"]
    output: AnalysisPlan
    side_effects: ["secondary_outcomes replaced; amendment_count += 1; any primary_outcomes key in payload -> ERR_PRIMARY_OUTCOME_FROZEN"]

  # --- Findings Reports ---
  - method: POST
    path: "/evaluation/studies/{id}/reports"
    description: "Draft a findings report (study ANALYSIS -> REPORTING on first creation)"
    roles: [PrincipalInvestigator]
    code: 201
    input: [title, report_type, addressed_primary_outcomes, payment_milestone_cents]
    output: FindingsReport
    side_effects: ["status = DRAFT; if study is ANALYSIS and this is its first report: study -> REPORTING"]

  - method: GET
    path: "/evaluation/studies/{id}/reports"
    description: "List reports of a study"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "FindingsReport[]"
    side_effects: []

  - method: POST
    path: "/evaluation/reports/{reportId}/submit"
    description: "Submit (or resubmit after REVISION) a report to the agency"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: FindingsReport
    side_effects: ["status -> SUBMITTED; submitted_at/peer_review_due set; from REVISION: revision_due cleared"]

  - method: POST
    path: "/evaluation/reports/{reportId}/review"
    description: "Peer review a submitted report (reviewer must not be the submitter)"
    roles: [PeerReviewer]
    code: 200
    input: ["reviewer_notes?"]
    output: FindingsReport
    side_effects: ["status -> PEER_REVIEWED; reviewed_by_id = X-User-ID"]

  - method: POST
    path: "/evaluation/reports/{reportId}/agency-decision"
    description: "Agency accepts the report or returns it for revision"
    roles: [AgencyOfficer]
    code: 200
    input: [decision]
    output: FindingsReport
    side_effects: ["ACCEPTED -> accepted_at and publication_due set; REVISION_REQUIRED -> revision_count += 1 and revision_due set"]

  - method: POST
    path: "/evaluation/reports/{reportId}/publish"
    description: "Publish an accepted report within its publication deadline; disburses the payment milestone"
    roles: [AgencyOfficer]
    code: 200
    input: []
    output: FindingsReport
    side_effects: ["status -> PUBLISHED; contract.disbursed_cents += payment_milestone_cents; first PUBLISHED report moves study REPORTING -> DISSEMINATION"]

  # --- Restricted-Use Files ---
  - method: POST
    path: "/evaluation/studies/{id}/restricted-use-files"
    description: "Prepare a restricted-use data file (requires at least one PUBLISHED report of the study)"
    roles: [DataManager]
    code: 201
    input: [title, cell_counts, sensitivity_weights]
    output: RestrictedUseFile
    side_effects: ["status = DRAFT; prepared_by_id = X-User-ID"]

  - method: GET
    path: "/evaluation/studies/{id}/restricted-use-files"
    description: "List restricted-use files of a study (ExternalResearcher sees only RELEASED files; other listed roles see all)"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer, ExternalResearcher]
    code: 200
    input: []
    output: "RestrictedUseFile[]"
    side_effects: []

  - method: POST
    path: "/evaluation/restricted-use-files/{fileId}/submit-review"
    description: "Submit a file for disclosure-risk review (computes suppression and risk scores)"
    roles: [DataManager]
    code: 200
    input: []
    output: RestrictedUseFile
    side_effects: ["status -> DISCLOSURE_REVIEW; suppressed_cell_count, max_risk, mean_risk computed per disclosure_risk_score"]

  - method: POST
    path: "/evaluation/restricted-use-files/{fileId}/review-decision"
    description: "Agency disclosure decision (decider must not be the preparer; release gated on max_risk <= MAX_DISCLOSURE_RISK)"
    roles: [AgencyOfficer]
    code: 200
    input: [decision]
    output: RestrictedUseFile
    side_effects: ["APPROVE -> RELEASED when risk gate passes; REJECT -> RISK_REJECTED"]

  # --- Dissemination ---
  - method: POST
    path: "/evaluation/studies/{id}/dissemination-activities"
    description: "Plan a dissemination or technical-assistance activity (requires at least one PUBLISHED report of the study)"
    roles: [PrincipalInvestigator]
    code: 201
    input: [activity_type, title, scheduled_at, operator_count]
    output: DisseminationActivity
    side_effects: ["status = PLANNED"]

  - method: GET
    path: "/evaluation/studies/{id}/dissemination-activities"
    description: "List dissemination activities of a study"
    roles: [AgencyOfficer, PrincipalInvestigator, StudyDirector, DataManager, IRBReviewer, PeerReviewer]
    code: 200
    input: []
    output: "DisseminationActivity[]"
    side_effects: []

  - method: POST
    path: "/evaluation/dissemination-activities/{activityId}/complete"
    description: "Mark an activity completed; may complete the study (all required FINAL reports published)"
    roles: [PrincipalInvestigator]
    code: 200
    input: []
    output: DisseminationActivity
    side_effects: ["status -> COMPLETED; study DISSEMINATION -> COMPLETED when contract deliverable_report_count FINAL reports are PUBLISHED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock (ISO8601). Before any call, the clock reads exactly 2026-09-01T00:00:00Z (CLOCK_DEFAULT_UTC) and never falls back to wall-clock time. Advancing the clock past an APPROVED IRB protocol's approval_end expires it and fires the suspension cascade."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock set; IRB expiry transitions evaluated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role name" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's role list; or entity-backed Participant acting on a participant whose id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist, or nested child does not belong to the path parent" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, undeclared field, type mismatch, invalid enum, or malformed window (end <= start, IRB window > IRB_MAX_APPROVAL_DAYS)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_study_version does not match the study's current version on design-plan create" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Contract must be ACTIVE (child creation, terminate, closeout)" }
  - { id: ERR_STUDY_INVALID_STATE, http: 409, condition: "Study not in a valid state for the operation (e.g. sign-mou outside DESIGN/RECRUITMENT, child creation on a TERMINATED/COMPLETED study)" }
  - { id: ERR_DESIGN_PLAN_INVALID_STATE, http: 409, condition: "Design plan not in a valid from-state for the transition; also raised when a LOCKED-plan precondition fails (site activate, randomize, analysis register)" }
  - { id: ERR_IRB_INVALID_STATE, http: 409, condition: "IRB protocol not in a valid from-state for submit/decision/continuing-review" }
  - { id: ERR_SITE_INVALID_STATE, http: 409, condition: "Site not in a valid from-state for the transition; also raised when consent requires an ACTIVE site" }
  - { id: ERR_PARTICIPANT_INVALID_STATE, http: 409, condition: "Participant not in a valid from-state for consent/randomize/withdraw" }
  - { id: ERR_WAVE_INVALID_STATE, http: 409, condition: "Wave not in a valid from-state for open/close/link" }
  - { id: ERR_ANALYSIS_PLAN_INVALID_STATE, http: 409, condition: "Analysis plan not in a valid from-state for register/amend" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "Report not in a valid from-state for submit/review/agency-decision/publish" }
  - { id: ERR_RUF_INVALID_STATE, http: 409, condition: "Restricted-use file not in a valid from-state for submit-review/review-decision" }
  - { id: ERR_DISSEMINATION_INVALID_STATE, http: 409, condition: "Dissemination activity not in PLANNED for complete" }
  - { id: ERR_INSUFFICIENT_POWER, http: 422, condition: "Design-plan submit: study pipeline_projected_n < plan required_total_n" }
  - { id: ERR_NO_APPROVED_IRB, http: 409, condition: "No IRBProtocol of the study is APPROVED (site activate, wave open from PLANNED, consent)" }
  - { id: ERR_IRB_EXPIRED, http: 409, condition: "Every approved IRB window of the study has passed (site activate, wave open, consent)" }
  - { id: ERR_IRB_WINDOW_OVERLAP, http: 409, condition: "New APPROVED window overlaps another APPROVED protocol window of the same study; touching endpoints allowed" }
  - { id: ERR_CONSENT_VERSION_STALE, http: 409, condition: "consent_form_version != the currently approved protocol's consent_form_version" }
  - { id: ERR_SITE_CAPACITY_EXCEEDED, http: 409, condition: "Consent would raise site enrolled_count above max_participants (at exactly capacity the consent is rejected)" }
  - { id: ERR_BURDEN_CAP_EXCEEDED, http: 422, condition: "Record would raise participant burden_total_minutes above MAX_TOTAL_BURDEN_MINUTES (exactly 480 allowed)" }
  - { id: ERR_VISIT_WINDOW_CONFLICT, http: 409, condition: "SITE_VISIT window at the same site overlaps, or sits closer than SITE_VISIT_MIN_GAP_DAYS to, another non-CANCELLED SITE_VISIT wave window (gap >= 7 days passes)" }
  - { id: ERR_PREREGISTRATION_TOO_LATE, http: 409, condition: "Analysis plan register attempted after a wave of the study reached CLOSED or LINKED" }
  - { id: ERR_PRIMARY_OUTCOME_FROZEN, http: 409, condition: "Amend payload contains primary_outcomes after preregistration" }
  - { id: ERR_UNREPORTED_PRIMARY_OUTCOME, http: 422, condition: "Report addressed_primary_outcomes does not cover every frozen primary outcome at submit" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "IRB decider == submitter, report reviewer == submitter, or RUF decider == preparer" }
  - { id: ERR_REVISION_DEADLINE_MISSED, http: 422, condition: "Resubmission attempted after revision_due (at exactly revision_due allowed)" }
  - { id: ERR_PUBLICATION_DEADLINE_MISSED, http: 422, condition: "Publish attempted after publication_due (at exactly publication_due allowed)" }
  - { id: ERR_DISCLOSURE_RISK_TOO_HIGH, http: 422, condition: "APPROVE decision while max_risk > MAX_DISCLOSURE_RISK" }
  - { id: ERR_NO_PUBLISHED_REPORT, http: 409, condition: "RUF create or dissemination create while the study has no PUBLISHED report" }
  - { id: ERR_STUDIES_NOT_COMPLETED, http: 409, condition: "Contract closeout while any study is not COMPLETED" }
  - { id: ERR_PARTICIPANT_NOT_CONSENTED, http: 409, condition: "Record create or randomize requires participant CONSENTED or RANDOMIZED_* (records) / CONSENTED (randomize) and not WITHDRAWN" }
  - { id: ERR_WAVE_NOT_OPEN, http: 409, condition: "Record create requires wave OPEN" }
  - { id: ERR_RECORDS_UNRESOLVED, http: 409, condition: "Wave link while any record remains RECEIVED" }
  - { id: ERR_WAVE_WINDOW_NOT_STARTED, http: 409, condition: "Wave open outside [open_at, close_at): before open_at or at/after close_at" }
  - { id: ERR_ANALYSIS_PLAN_NOT_REGISTERED, http: 409, condition: "Report submit requires a PREREGISTERED analysis plan on the study" }
  - { id: ERR_INSUFFICIENT_CONTRACT_FUNDS, http: 402, condition: "Report payment_milestone_cents exceeds contract.remaining_cents at publish" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyOfficer
    description: "Federal agency project officer: awards and closes contracts, decides design plans and reports, publishes, and decides disclosure reviews"
    identity: opaque
    exclusive_operations:
      - "POST /evaluation/contracts"
      - "POST /evaluation/contracts/{contractId}/terminate"
      - "POST /evaluation/contracts/{contractId}/closeout"
      - "POST /evaluation/design-plans/{planId}/agency-decision"
      - "POST /evaluation/reports/{reportId}/agency-decision"
      - "POST /evaluation/reports/{reportId}/publish"
      - "POST /evaluation/restricted-use-files/{fileId}/review-decision"
    shared_operations: ["All staff GET list/detail endpoints"]

  - name: PrincipalInvestigator
    description: "Evaluator-side study lead: creates studies, design plans, IRB protocols, analysis plans, reports, dissemination activities; randomizes participants"
    identity: opaque
    exclusive_operations:
      - "POST /evaluation/contracts/{contractId}/studies"
      - "POST /evaluation/studies/{studyId}/design-plans"
      - "POST /evaluation/design-plans/{planId}/submit"
      - "POST /evaluation/design-plans/{planId}/revise"
      - "POST /evaluation/studies/{studyId}/irb-protocols"
      - "POST /evaluation/irb-protocols/{irbId}/submit"
      - "POST /evaluation/participants/{participantId}/randomize"
      - "POST /evaluation/studies/{studyId}/analysis-plans"
      - "POST /evaluation/analysis-plans/{planId}/register"
      - "POST /evaluation/analysis-plans/{planId}/amend"
      - "POST /evaluation/studies/{studyId}/reports"
      - "POST /evaluation/reports/{reportId}/submit"
      - "POST /evaluation/studies/{studyId}/dissemination-activities"
      - "POST /evaluation/dissemination-activities/{activityId}/complete"
    shared_operations: ["All staff GET list/detail endpoints"]

  - name: StudyDirector
    description: "Evaluator-side field director: manages sites and participant identification/withdrawal"
    identity: opaque
    exclusive_operations:
      - "POST /evaluation/studies/{studyId}/sites"
      - "POST /evaluation/sites/{siteId}/outreach"
      - "POST /evaluation/sites/{siteId}/sign-mou"
      - "POST /evaluation/sites/{siteId}/activate"
      - "POST /evaluation/sites/{siteId}/withdraw"
      - "POST /evaluation/sites/{siteId}/participants"
    shared_operations:
      - "All staff GET list/detail endpoints"
      - "POST /evaluation/participants/{participantId}/withdraw (shared with Participant)"

  - name: DataManager
    description: "Evaluator-side data lead: plans waves, collects records, links data, prepares restricted-use files"
    identity: opaque
    exclusive_operations:
      - "POST /evaluation/studies/{studyId}/waves"
      - "POST /evaluation/waves/{waveId}/open"
      - "POST /evaluation/waves/{waveId}/close"
      - "POST /evaluation/waves/{waveId}/link"
      - "POST /evaluation/waves/{waveId}/records"
      - "POST /evaluation/studies/{studyId}/restricted-use-files"
      - "POST /evaluation/restricted-use-files/{fileId}/submit-review"
    shared_operations: ["All staff GET list/detail endpoints"]

  - name: IRBReviewer
    description: "Institutional review board reviewer: decides protocols and conducts continuing review; must not decide a protocol they submitted (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /evaluation/irb-protocols/{irbId}/decision"
      - "POST /evaluation/irb-protocols/{irbId}/continuing-review"
    shared_operations: ["All staff GET list/detail endpoints"]

  - name: PeerReviewer
    description: "Independent peer reviewer for findings reports; must not review a report they submitted (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /evaluation/reports/{reportId}/review"
    shared_operations: ["All staff GET list/detail endpoints"]

  - name: Participant
    description: "Study participant (entity-backed): consents and withdraws on their own record only — X-User-ID equals the Participant id"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /evaluation/participants/{participantId}/consent"
    shared_operations:
      - "POST /evaluation/participants/{participantId}/withdraw (shared with StudyDirector)"
      - "GET /evaluation/participants/{participantId} (self only)"

  - name: ExternalResearcher
    description: "Outside researcher: may list a study's restricted-use files, seeing RELEASED files only"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /evaluation/studies/{studyId}/restricted-use-files (filtered to RELEASED)"

  - name: PlatformAdmin
    description: "Benchmark operator role for the logical-clock test-driving endpoint only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
