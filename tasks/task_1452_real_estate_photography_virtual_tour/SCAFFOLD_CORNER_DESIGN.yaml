      - name: occ_stale_version_on_booking_reschedule
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-reschedule-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "POST /reschedule requires expected_booking_version; after a successful reschedule bumps the version, a second reschedule replaying the pre-first version is rejected 412 ERR_STALE_VERSION even though every business rule (window, reason code, cap) would pass — OCC is the only rejection."
