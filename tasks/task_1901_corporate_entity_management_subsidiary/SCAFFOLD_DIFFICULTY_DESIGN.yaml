# =============================================================================
# Task 1901 - Section 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x >=2 instances. Every instance grounds in SCAFFOLD.yaml
# sections 1.1-1.7 and is replayable from empty-DB via its setup_api_calls.
#
# Canonical fixtures (literal values in payloads):
#   J1 "US-DE": FIXED_MONTH_DAY 12/31, grace 10, SHARES_TIERED, CALENDAR_DAYS,
#               penalty base 12500 cap 50000, report_fee 5000, cert 5000,
#               notice 30, forfeiture 120.
#   J3 "US-NV": FIXED_MONTH_DAY 9/30, grace 15, franchise NONE, CALENDAR_DAYS,
#               penalty base 8000 cap 20000, report_fee 3000, cert 3000,
#               notice 30, forfeiture 60.
#   E-formed: formation_date 2025-06-15, shares 10000, FYE 12
#     -> first filings period 2026, due 2026-12-31 (Thursday, no weekend roll)
#   Default logical clock: 2026-08-01T00:00:00Z (pinned in section 1.5)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: franchise_tax_estimated_vs_actual_basis
        grounds:
          - calculations.franchise_tax
          - entities.AnnualFiling.fields.tax_estimated_cents
          - entities.AnnualFiling.fields.tax_assessed_cents
        distinguishing_aspect: |
          Fiscal domain variant pair on AnnualFiling: the ESTIMATED variant
          (prior-period shares basis 10000 -> 26000 cents, computed at prepare)
          and the ACTUAL variant (current authorized_shares 25000 -> 34500
          cents, computed at submit) are computed for the same filing and
          diverge because authorized_shares changed between prepare and submit.
        test_recipe:
          setup:
            - "J1 jurisdiction and agent AG1 exist; entity E1 is ACTIVE in J1 with authorized_shares 10000"
            - "FRANCHISE_TAX filing for period 2026 (due 2026-12-31) exists with status SCHEDULED"
            - "filing prepared at default clock: tax_estimated_cents == 26000 (basis 10000 shares)"
            - "logical clock remains at the 2026-08-01 default (on/before due_date, so no penalty)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
            - call: "POST /api/registered-agents"
              payload: { name: "DE Agent Co", jurisdiction_id: "${j1}", address: "1 Agent Way" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ag1: "$.data.id" }
            - call: "POST /api/entities"
              payload: { legal_name: "Acme Holdings Inc", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", fiscal_year_end_month: 12, authorized_shares: 10000 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e1: "$.data.id", e_v: "$.data.version" }
            - call: "POST /api/entities/${e1}/agent-appointments"
              payload: { agent_id: "${ag1}", jurisdiction_id: "${j1}", start_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/resolutions"
              payload: { resolution_type: "AUTHORIZE_FORMATION", payload: {}, effective_date: "2025-06-15" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { r_form: "$.data.id" }
            - call: "POST /api/resolutions/${r_form}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "POST /api/resolutions/${r_form}/adopt"
              payload: { expected_entity_version: "${e_v}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/submit-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${e1}/confirm-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "GET /api/filings?entity_id=${e1}&filing_type=FRANCHISE_TAX&period_year=2026"
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ft1: "$.data[0].id" }
            - call: "POST /api/filings/${ft1}/prepare"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
          trigger:
            - call: "PATCH /api/entities/${e1}"
              payload: { authorized_shares: 25000 }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/filings/${ft1}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { ft_tax_est: "$.data.tax_estimated_cents", ft_tax_act: "$.data.tax_assessed_cents", ft_fee: "$.data.fee_cents" }
          assert:
            - "AnnualFiling.${ft1}.tax_estimated_cents == 26000 (ESTIMATED variant: basis 10000 shares -> 17500 + ceil(5000/10000)*8500)"
            - "AnnualFiling.${ft1}.tax_assessed_cents == 34500 (ACTUAL variant: 25000 shares -> 17500 + ceil(20000/10000)*8500)"
            - "AnnualFiling.${ft1}.tax_estimated_cents != AnnualFiling.${ft1}.tax_assessed_cents"
            - "AnnualFiling.${ft1}.penalty_cents == 0 and AnnualFiling.${ft1}.days_late == 0 (submitted 2026-08-01, on/before due 2026-12-31)"
            - "AnnualFiling.${ft1}.fee_cents == 39500 (5000 report fee + 34500 tax + 0 penalty)"
            - "GET /api/entities/${e1}: fees_accrued_cents == 39500"

      - name: ownership_direct_vs_look_through
        grounds:
          - calculations.ownership_consolidation
          - entities.OwnershipRecord.fields.percentage_bps
        distinguishing_aspect: |
          Governance/ownership domain variant pair (distinct from the fiscal
          AnnualFiling domain of franchise_tax_estimated_vs_actual_basis): the
          same three ACTIVE ownership records yield DIRECT 1000 bps on edge
          U->E but LOOK_THROUGH 5000 bps for node E (path U->A->E contributes
          8000*5000/10000 = 4000, plus 1000 direct).
        test_recipe:
          setup:
            - "J1 and agent AG1 exist; three ACTIVE entities U, A, E2 formed in J1"
            - "OwnershipRecords: U->A 8000 bps, A->E2 5000 bps, U->E2 1000 bps, all effective 2026-01-01, all status ACTIVE"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-DE", name: "Delaware", annual_report_due_rule: "FIXED_MONTH_DAY", annual_report_due_month: 12, annual_report_due_day: 31, grace_period_days: 10, franchise_tax_method: "SHARES_TIERED", late_penalty_base_cents: 12500, late_penalty_cap_cents: 50000, penalty_day_counting: "CALENDAR_DAYS", report_fee_cents: 5000, cert_fee_cents: 5000, ra_resignation_notice_days: 30, forfeiture_window_days: 120 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { j1: "$.data.id" }
            - call: "POST /api/registered-agents"
              payload: { name: "DE Agent Co", jurisdiction_id: "${j1}", address: "1 Agent Way" }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { ag1: "$.data.id" }
            - call: "POST /api/entities"
              payload: { legal_name: "Ultimate Parent Corp", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", authorized_shares: 10000 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { u_id: "$.data.id", u_v: "$.data.version" }
            - call: "POST /api/entities/${u_id}/agent-appointments"
              payload: { agent_id: "${ag1}", jurisdiction_id: "${j1}", start_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${u_id}/resolutions"
              payload: { resolution_type: "AUTHORIZE_FORMATION", payload: {}, effective_date: "2025-06-15" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { ru: "$.data.id" }
            - call: "POST /api/resolutions/${ru}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "POST /api/resolutions/${ru}/adopt"
              payload: { expected_entity_version: "${u_v}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${u_id}/submit-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${u_id}/confirm-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities"
              payload: { legal_name: "Midco A LLC", entity_type: "LLC", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", authorized_shares: 0 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { a_id: "$.data.id", a_v: "$.data.version" }
            - call: "POST /api/entities/${a_id}/agent-appointments"
              payload: { agent_id: "${ag1}", jurisdiction_id: "${j1}", start_date: "2025-06-15" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${a_id}/resolutions"
              payload: { resolution_type: "AUTHORIZE_FORMATION", payload: {}, effective_date: "2025-06-15" }
              as: FilingCoordinator
              as_user_id: "fc-01"
              captures: { ra: "$.data.id" }
            - call: "POST /api/resolutions/${ra}/submit"
              payload: {}
              as: FilingCoordinator
              as_user_id: "fc-01"
            - call: "POST /api/resolutions/${ra}/adopt"
              payload: { expected_entity_version: "${a_v}" }
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${a_id}/submit-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities/${a_id}/confirm-formation"
              payload: {}
              as: CorporateSecretary
              as_user_id: "sec-01"
            - call: "POST /api/entities"
              payload: { legal_name: "Opco E Inc", entity_type: "CORPORATION", formation_jurisdiction_id: "${j1}", formation_date: "2025-06-15", authorized_shares: 10000 }
              as: CorporateSecretary
