            - "after the first prepare: CorrectionCase.${case_id}.total_exposure_cents == 335625 and filing_status == FILING_IN_PROGRESS"
            - "after the first prepare: Employer.${emp_id}.open_exposure_cents == 335625"
            - "after the void: AmendedReturn.${ar1_id}.status == VOID"
            - "after the void: CorrectionCase.${case_id}.total_exposure_cents == 0 — exactly the pre-prepare value, not a residue"
            - "after the void: Employer.${emp_id}.open_exposure_cents == 0"
            - "after the void: CorrectionCase.${case_id}.filing_status == FILING_PENDING (the compensating transition of the PREPARED path)"
            - "after the void: all three Discrepancy rows are still CATEGORIZED (voiding withdraws money, not classification work)"
            - "after preparing the replacement: CorrectionCase.${case_id}.total_exposure_cents == 335625 again"
            - "after preparing the replacement: Employer.${emp_id}.open_exposure_cents == 335625 (the peak is reproduced exactly, so nothing double-counted)"
            - "after preparing the replacement: AmendedReturn.${ar2_id}.interest_cents == 20000 and penalty_cents == 65625"

      - name: reissue_conserves_case_corrected_wage_base
        grounds:
          - calculations.corrected_wage_base_rollup
          - state_machines.CorrectedWageStatement.ISSUED_to_RETURNED_UNDELIVERABLE
          - state_machines.CorrectedWageStatement.RETURNED_UNDELIVERABLE_to_VOIDED
          - entities.Employee.fields.active_statement_count
        distinguishing_aspect: |
          A different conserved quantity: REPORTABLE WAGE BASE — the case's
          corrected_wage_base_cents together with Employee.active_statement_count, neither of which
          is money. Taking a statement out of the issued set must restore the raw register total of
          1000000, and the successor carrying the same wage_delta_cents must restore 600000
          exactly; the count of live statements must ride the same 1 -> 0 -> 1 arc, so a
          void/reissue pair is provably conservative rather than merely approximately so.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "Employer Acme; federal agency FED-941 with jurisdiction_code US."
            - "One POSTED 2025 Q1 register line for Dana Reed of 1000000 taxable wage / 150000 withheld with work_jurisdiction_code NJ and workday_ratio_bps 4000; the filed return reports both totals exactly, so JURISDICTION_ASSIGNMENT 400000 is the only variance and it is categorised."
            - "A MAIL corrected wage statement for 2025 with wage_delta_cents -400000 has been ISSUED, so the case shows corrected_wage_base_cents 600000 and the employee shows active_statement_count 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NJ" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 150000, work_jurisdiction_code: "NJ", workday_ratio_bps: 4000 }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 1000000, reported_withheld_cents: 150000 }
              as: TaxPreparer
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "JURISDICTION_ASSIGNMENT" }
              as: PayrollAnalyst
              captures: { d_jur_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_jur_id}/categorize"
              payload: { category: "JURISDICTION_ASSIGNMENT", root_cause_code: "JURISDICTION_MAPPING_ERROR" }
              as: PayrollAnalyst
            - call: "POST /corrected-wage-statements"
              payload: { correction_case_id: "${case_id}", employee_id: "${e1_id}", tax_year: 2025, delivery_channel: "MAIL" }
              as: TaxPreparer
              captures: { st1_id: "$.data.id" }
            - call: "POST /corrected-wage-statements/${st1_id}/issue"
              payload: {}
              as: TaxPreparer
          trigger:
            - call: "POST /corrected-wage-statements/${st1_id}/report-undeliverable"
              payload: { undeliverable_reason: "Carrier returned the envelope: no such street number." }
              as: TaxPreparer
              captures: { st1_ver: "$.data.version" }
            - call: "POST /corrected-wage-statements/${st1_id}/reissue"
              payload: { expected_statement_version: "${st1_ver}", delivery_channel: "PORTAL", reissue_reason: "Switching to portal delivery.", corrected_mailing_state_code: "PA" }
              as: TaxPreparer
              captures: { st2_id: "$.data.id" }
            - call: "POST /corrected-wage-statements/${st2_id}/issue"
              payload: {}
              as: TaxPreparer
          assert:
            - "before the trigger: CorrectionCase.${case_id}.corrected_wage_base_cents == 600000 and Employee.${e1_id}.active_statement_count == 1"
            - "after report-undeliverable: CorrectedWageStatement.${st1_id}.status == RETURNED_UNDELIVERABLE"
            - "after report-undeliverable: CorrectionCase.${case_id}.corrected_wage_base_cents == 1000000 — the untouched register total is restored exactly"
            - "after report-undeliverable: Employee.${e1_id}.active_statement_count == 0"
            - "after the reissue: CorrectedWageStatement.${st1_id}.status == VOIDED and the successor is DRAFT with sequence_no 2 and wage_delta_cents == -400000"
            - "after the reissue: CorrectionCase.${case_id}.corrected_wage_base_cents is still 1000000 (a DRAFT successor contributes nothing)"
            - "after the reissue: Employee.${e1_id}.mailing_state_code == PA"
            - "after issuing the successor: CorrectionCase.${case_id}.corrected_wage_base_cents == 600000 — the same value the predecessor produced, so the void/reissue pair is exactly conservative"
            - "after issuing the successor: Employee.${e1_id}.active_statement_count == 1"
            - "after issuing the successor: GET /corrected-wage-statements?correction_case_id=${case_id} returns total_count == 2, of which exactly one is ISSUED"
