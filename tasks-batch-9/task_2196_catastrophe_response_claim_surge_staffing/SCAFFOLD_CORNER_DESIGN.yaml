      - name: corner_err_advance_cap_exceeded_at_zero_headroom
        claim_type: error_triggerable
        grounds: [errors.ERR_ADVANCE_CAP_EXCEEDED, validations.priority_39]
        excluded_because:
          difficulty_instance: advance_headroom_exact_zero_cents_rejected_one_cent_accepted
          rationale: "The named §1.8 instance already fires ERR_ADVANCE_CAP_EXCEEDED at headroom exactly 0.00 and contrasts it with the accepted one-cent case."

      - name: corner_err_housing_block_empty_on_open
