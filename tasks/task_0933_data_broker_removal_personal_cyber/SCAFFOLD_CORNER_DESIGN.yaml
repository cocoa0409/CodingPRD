            - "After retiring profile 1: Account.${acct_id}.profile_units_released == 1 and profile_units_remaining == 1"
            - "Second attempt: HTTP 200 with MonitoredProfile.${prof2_id}.status == ACTIVE"
            - "Account.${acct_id}.profile_units_granted == 1, profile_units_consumed == 2, profile_units_released == 1, profile_units_remaining == 0"

      - name: second_removal_draft_rejected_by_the_shared_pool
        claim_type: Violation → Error
        grounds:
          - validations[priority=45]
