        claim_type: standard_crud
        grounds:
          - endpoints[POST /venues]
          - endpoints[GET /venues/{id}]
          - endpoints[GET /venues]
          - entities.Venue
        distinguishing_aspect: |
          The surface exposes create, read and list for Venue and deliberately no update or delete verb — the
          catalogue holds no PATCH, PUT or DELETE route at all — so the CRUD claim is that the write is readable
          verbatim through both the item read and the filtered list, and that the jurisdiction filter plus
          limit/offset produce total_count 2 with has_more true on the first page.
        test_recipe:
          setup:
            - "Jurisdiction OH exists; no venues yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_n1: "$.data.id" }
          trigger:
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_n1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
