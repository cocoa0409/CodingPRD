  instances:
  - name: coverage_ratio_exactly_one_approves_below_one_rejects
    grounds:
    - validations[priority=13]
    - calculations.financing_payment
    - errors.ERR_COVERAGE_BELOW_ONE
    distinguishing_aspect: 'Numeric threshold boundary: coverage_ratio >= 1.0000 approves. With

      a zero-rate LEASE, payment == principal/term exactly: guarantee

      120000 vs payment 120000 → ratio exactly 1.0000 → APPROVED; a second

      facility with guarantee-side shortfall (payment 120000, guarantee

      119900) → ratio 0.9992 → ERR_COVERAGE_BELOW_ONE. Tests >= vs >.

      '
    test_recipe:
      setup:
      - 'Contract with guaranteed_annual_savings_cents 120000 in SCOPED. Facility G: LEASE, principal 1200000, rate 0.0, term 10 → payment 120000, coverage exactly 1.0000. Facility H: THIRD_PARTY... simpler:
        a second contract with guarantee 119900 and identical facility.'
