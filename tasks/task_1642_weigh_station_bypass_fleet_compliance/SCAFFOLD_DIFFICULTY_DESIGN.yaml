        distinguishing_aspect: |
          Category pair state vs business_safety: the credential is ALREADY ACTIVE (priority-5 from-state
          violation for a ->ACTIVE transition) AND its vehicle is OUT_OF_SERVICE (priority-11 safety gate) —
          the response must be ERR_INVALID_STATE_TRANSITION (409), not ERR_VEHICLE_NOT_IN_SERVICE.
        test_recipe:
          setup:
            - "Clock 2026-08-01; config CA PARTICIPATING; carrier ACTIVE (iss 30); vehicle with ACTIVE subscription and credential already ACTIVE; then vehicle patched OUT_OF_SERVICE (credential stays ACTIVE — vehicle PATCH does not cascade)"
