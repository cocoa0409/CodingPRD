              payload: { expected_allowance_account_version: "${acct_v1}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 3.000, vintage_year: 2028 }
              as: AllowanceTrader
              captures: { e_high: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v1}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 3.000, vintage_year: 2025 }
              as: AllowanceTrader
              captures: { tx_prior: $.data.id }
            - call: "POST /emissions/allowance-transactions/${tx_prior}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/allowance-transactions/${tx_prior}/transition"
              payload: { action: "SETTLE" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
              captures: { acct_v_after_prior: $.data.allowance_account_version_after }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_v_after_prior}", allowance_account_id: "${acct_id}", transaction_type: "PURCHASE", quantity_tons: 4.000, vintage_year: 2027 }
              as: AllowanceTrader
              captures: { tx_next: $.data.id }
            - call: "POST /emissions/allowance-transactions/${tx_next}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/allowance-transactions/${tx_next}/transition"
              payload: { action: "SETTLE" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
          assert:
            - "trigger 1 returns HTTP 422 with error_id == ERR_VINTAGE_YEAR_INVALID (2024 is compliance_year - 2)"
            - "trigger 2 returns HTTP 422 with error_id == ERR_VINTAGE_YEAR_INVALID (2028 is compliance_year + 2)"
            - "trigger 3 returns HTTP 201 and after trigger 5 AllowanceAccount.${acct_id}.holdings_prior_vintage_tons == 4.000 with current 1.000 and next 1.000"
            - "trigger 6 returns HTTP 201 and after trigger 8 holdings_next_vintage_tons == 5.000 with prior 4.000 and current 1.000"
            - "the two refused proposals created no rows: GET /emissions/allowance-transactions?allowance_account_id=${acct_id} returns total_count == 2"

      - name: val_priority_ordering_returns_the_higher_priority_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=100]
        excluded_because:
          difficulty_instance: priority_unauthorized_role_beats_missing_facility_lookup
          rationale: "That instance violates the role check and the path-existence check in the same request and asserts that ERR_UNAUTHORIZED wins, then repairs one violation at a time to prove the ladder."

      - name: val_priority_conflict_between_two_business_rules
        claim_type: priority_conflict
        grounds:
          - validations[priority=240]
          - validations[priority=345]
        excluded_because:
          difficulty_instance: priority_monitor_out_of_control_beats_data_availability_floor
          rationale: "Both rules are violated by the same validate call and that instance asserts ERR_MONITOR_OUT_OF_CONTROL, the lower-numbered priority, is the one returned."

      - name: val_temporal_conflict_is_detected_at_write_time
        claim_type: temporal
        grounds:
          - validations[priority=310]
          - validations[priority=315]
        excluded_because:
          difficulty_instance: overlap_rata_windows_are_half_open_per_monitoring_system
          rationale: "That instance covers the half-open interval algebra, the abutting-window acceptance and the in-the-past rejection, which are the temporal-validation claims for this scaffold."

      - name: val_aggregate_limit_is_evaluated_across_siblings
        claim_type: aggregate
        grounds:
          - validations[priority=325]
        excluded_because:
          difficulty_instance: overlap_facility_wide_active_outage_ceiling_is_aggregate_not_pairwise
          rationale: "Each individual outage window is valid while the third activation breaches the facility-wide ceiling; that instance asserts exactly the aggregate claim."

      - name: val_cascading_check_depends_on_an_earlier_check
        claim_type: cascading
        grounds:
          - validations[priority=335]
        excluded_because:
          difficulty_instance: dual_variant_appendix_d_hour_rejects_cems_measurement_fields
          rationale: "ERR_METHOD_FIELD_MISMATCH is only reachable once the numeric range checks have passed, and that instance walks both orders on the same hour payload."

  # ===========================================================================
  # From Table 5 (Endpoints)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: ep_facility_create_read_update_and_list_all_work
        claim_type: standard_crud
        grounds:
          - endpoints[POST /emissions/facilities]
          - endpoints[GET /emissions/facilities/{id}]
          - endpoints[PATCH /emissions/facilities/{id}]
          - endpoints[GET /emissions/facilities]
        distinguishing_aspect: "The PATCH accepts a partial body, moves only the two supplied fields, advances version from 1 to 2, and the list endpoint's filters see the updated row — while no DELETE route exists for any entity in this API."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
          trigger:
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "GET /emissions/facilities/${fac_id}"
              payload: {}
              as: AllowanceTrader
            - call: "PATCH /emissions/facilities/${fac_id}"
              payload: { true_up_deadline_utc: "2027-04-01T00:00:00Z", max_concurrent_control_outages: 4 }
              as: RegulatoryReviewer
            - call: "GET /emissions/facilities"
              payload: { state_code: "OH", status: "OPERATING", limit: 10, offset: 0 }
              as: RegulatoryReviewer
            - call: "GET /emissions/facilities"
              payload: { state_code: "PA" }
              as: RegulatoryReviewer
          assert:
            - "trigger 1 returns HTTP 201 with version == 1, status == OPERATING and compliance_posture == COMPLIANT"
            - "trigger 2 returns HTTP 200 with the identical stored row, including max_concurrent_control_outages == 2 from the default"
            - "trigger 3 returns HTTP 200 with true_up_deadline_utc == 2027-04-01T00:00:00Z, max_concurrent_control_outages == 4, version == 2, and name / orispl_code / state_code / operator_org / programs unchanged"
            - "trigger 4 returns total_count == 1, has_more == false and the single item carries version == 2"
            - "trigger 5 returns total_count == 0 with an empty data array"

      - name: ep_bulk_hour_append_is_all_or_nothing_and_spends_one_version
        claim_type: bulk_action
        grounds:
          - endpoints[POST /emissions/units/{id}/operating-hours/bulk]
          - validations[priority=355]
          - validations[priority=225]
          - errors[ERR_BULK_SIZE_INVALID]
          - errors[ERR_DUPLICATE_OPERATING_HOUR]
        distinguishing_aspect: "A batch containing one duplicate hour persists none of its other hours and leaves the report version untouched, and a two-hour batch supplied in descending order advances the report version by exactly 1 rather than once per hour."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "U1 with a CERTIFIED SO2 CEM and an empty DRAFT 2026 Q2 report at version 1"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
          trigger:
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_empty: $.data.error_id }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 100.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_dup_in_batch: $.data.error_id }
            - call: "GET /emissions/operating-hours"
              payload: { unit_id: "${unit_id}" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_v2: "$.data[0].quarterly_report_version_after" }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v2}", hours: [{ hour_begin_utc: "2026-04-01T02:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }, { hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_dup_persisted: $.data.error_id }
            - call: "GET /emissions/quarterly-reports/${q2_id}"
              payload: {}
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
          assert:
            - "trigger 1 returns HTTP 422 with error_id == ERR_BULK_SIZE_INVALID — an empty array is not a no-op"
            - "trigger 2 returns HTTP 409 with error_id == ERR_DUPLICATE_OPERATING_HOUR; the 01:00 hour, which was individually valid, is discarded with the batch"
            - "trigger 3 returns total_count == 0 and QuarterlyReport.${q2_id}.version is still 1 — the refused batch persisted nothing and spent no version"
            - "trigger 4 returns HTTP 201 with two OperatingHour rows in hour_begin_utc ASC order (00:00 first) despite the descending payload"
            - "after trigger 4 QuarterlyReport.${q2_id}.version == 2 — exactly one recompute for the whole batch, not one per hour"
            - "trigger 5 returns HTTP 409 with error_id == ERR_DUPLICATE_OPERATING_HOUR — the batch collides with an already persisted hour, so the new 02:00 hour is discarded too"
            - "trigger 6 shows version == 2, operating_hour_count == 2, total_heat_input_mmbtu == 1111.112, total_so2_lbs == 584.4, total_nox_lbs == 200.0, total_co2_tons == 119.400 and total_so2_tons == 0.292"

      - name: ep_transfer_out_settlement_links_two_accounts
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /emissions/allowance-transactions]
          - endpoints[POST /emissions/allowance-transactions/{id}/transition]
          - calculations.allowance_transaction_settlement
          - validations[priority=110]
        distinguishing_aspect: "A TRANSFER_OUT settlement debits the sender's oldest vintage bucket and credits the counterparty's bucket chosen by that counterparty's own compliance_year, and an unknown counterparty id is refused as ERR_ALLOWANCE_ACCOUNT_NOT_FOUND before any state check runs."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "facility A (7101) with an ARP_SO2 2026 account holding prior 2.000 / current 10.000 / next 0.000"
            - "facility B (7102) with an ARP_SO2 2026 account holding 0.000 in every bucket"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_a: $.data.id }
            - call: "POST /emissions/facilities"
              payload: { name: "Harrier Energy Center", orispl_code: "7102", state_code: "IN", operator_org: "op_beta", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_b: $.data.id }
            - call: "POST /emissions/facilities/${fac_a}/allowance-accounts"
              payload: { program: "ARP_SO2", compliance_year: 2026, holdings_current_vintage_tons: 10.000, holdings_prior_vintage_tons: 2.000, holdings_next_vintage_tons: 0.000 }
              as: RegulatoryReviewer
              captures: { acct_a: $.data.id, acct_a_v1: $.data.version }
            - call: "POST /emissions/facilities/${fac_b}/allowance-accounts"
              payload: { program: "ARP_SO2", compliance_year: 2026, holdings_current_vintage_tons: 0.000, holdings_prior_vintage_tons: 0.000, holdings_next_vintage_tons: 0.000 }
              as: RegulatoryReviewer
              captures: { acct_b: $.data.id }
          trigger:
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_a_v1}", allowance_account_id: "${acct_a}", transaction_type: "TRANSFER_OUT", quantity_tons: 3.000, vintage_year: 2026, counterparty_account_id: "00000000-0000-4000-8000-000000000000" }
              as: AllowanceTrader
              captures: { e_unknown_cpty: $.data.error_id }
            - call: "POST /emissions/allowance-transactions"
              payload: { expected_allowance_account_version: "${acct_a_v1}", allowance_account_id: "${acct_a}", transaction_type: "TRANSFER_OUT", quantity_tons: 3.000, vintage_year: 2026, counterparty_account_id: "${acct_b}" }
              as: AllowanceTrader
              captures: { tx_id: $.data.id }
            - call: "POST /emissions/allowance-transactions/${tx_id}/transition"
              payload: { action: "RECORD" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "POST /emissions/allowance-transactions/${tx_id}/transition"
              payload: { action: "SETTLE" }
              as: DesignatedRepresentative
              as_user_id: "dr_1"
            - call: "GET /emissions/allowance-accounts/${acct_b}"
              payload: {}
              as: AllowanceTrader
          assert:
            - "trigger 1 returns HTTP 404 with error_id == ERR_ALLOWANCE_ACCOUNT_NOT_FOUND and creates nothing"
            - "trigger 2 returns HTTP 201 with status == PROPOSED, origin == MANUAL and every debited_* field 0.0 — no holdings moved at proposal time"
            - "trigger 3 returns HTTP 200 with status == RECORDED and AllowanceAccount.${acct_a} holdings still 2.000 / 10.000 / 0.000"
            - "trigger 4 returns HTTP 200 with status == SETTLED, debited_prior_tons == 2.000, debited_current_tons == 1.000 and debited_next_tons == 0.0 — the oldest vintage drains first"
            - "AllowanceAccount.${acct_a}.holdings_prior_vintage_tons == 0.000 and holdings_current_vintage_tons == 9.000"
            - "trigger 5 shows AllowanceAccount.${acct_b}.holdings_current_vintage_tons == 3.000 — the credit lands in the bucket selected by B's own compliance_year, undivided by the sender's split"
            - "AllowanceAccount.${acct_a}.surrendered_tons == 0.000 — a transfer is not a surrender"

      - name: ep_substitution_runs_only_over_unavailable_hours
        claim_type: conditional_action
        grounds:
