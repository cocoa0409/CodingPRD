              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
            - call: "POST /warranty/labor-rate-requests"
              payload: { dealer_id: "${d1_id}", requested_labor_rate_cents: 17600, requested_parts_markup_pct: 0.30, sample_repair_order_count: 6, sample_median_rate_cents: 17600, effective_date: "2026-07-01", expected_dealer_version: "${d1_version}" }
              as: DealerWarrantyAdmin
