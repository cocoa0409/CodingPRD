              as: Operator
              as_user_id: "${c_op57_id}"
              captures: { c_est57a_id: $.data.id }
            - call: "GET /mining/permits/${c_permit57_id}"
              as: PermitReviewer
              captures: { c_p57v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${c_est57a_id}/accept"
              payload: { expected_permit_version: "${c_p57v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${c_permit57_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${c_op57_id}"
              captures: { c_inst57_id: $.data.id }
            - call: "POST /mining/bond-instruments/${c_inst57_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${c_permit57_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "PATCH /mining/permits/${c_permit57_id}/disturbance"
              payload: { disturbed_acres: 60.00 }
              as: Operator
              as_user_id: "${c_op57_id}"
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${c_permit57_id}", estimator_firm: "Basin Closure Consultants", estimator_license_no: "RE-5290", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6500.00 }
              as: Operator
              as_user_id: "${c_op57_id}"
              captures: { c_est57b_id: $.data.id }
            - call: "GET /mining/permits/${c_permit57_id}"
              as: BondSpecialist
              as_user_id: "bs-001"
              captures: { c_p57v2: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${c_est57b_id}/accept"
              payload: { expected_permit_version: "${c_p57v2}" }
              as: PermitReviewer
          trigger:
            - call: "POST /mining/permits/${c_permit57_id}/recalculate-bond"
              payload: { basis: "INCREMENTAL", expected_permit_version: "${c_p57v2}" }
              as: BondSpecialist
              as_user_id: "bs-001"
              captures: { c_err_occ2: $.data.error_id }
            - call: "GET /mining/permits/${c_permit57_id}"
              as: BondSpecialist
              as_user_id: "bs-001"
              captures: { c_p57v3: $.data.version }
            - call: "POST /mining/permits/${c_permit57_id}/recalculate-bond"
              payload: { basis: "INCREMENTAL", expected_permit_version: "${c_p57v3}" }
              as: BondSpecialist
              as_user_id: "bs-001"
              captures: { c_recalc_basis: $.data.bond_basis }
          assert:
            - "HTTP 412 with ${c_err_occ2} == ERR_STALE_PERMIT_VERSION"
            - "After the rejected call Permit.${c_permit57_id}.bond_basis == FULL_PLAN and bond_required_amount == 938164.50"
            - "${c_p57v3} == ${c_p57v2} + 1"
            - "${c_recalc_basis} == INCREMENTAL with bond_required_amount == 469082.25 (per_acre_loaded 7702.50 x 60.00 = 462150.00, admin_fee 6932.25)"
            - "Permit.${c_permit57_id}.bond_deficiency_amount == 0.00 and compliance_posture == COMPLIANT with bond_held_amount == 900000.00"

