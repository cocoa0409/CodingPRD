      - name: segregation_then_stale_version_then_savings_floor_ladder
        grounds:
          - validations.priority_3_ERR_SEGREGATION_OF_DUTIES
          - validations.priority_10_ERR_STALE_CASE_VERSION
          - validations.priority_46_ERR_SAVINGS_BELOW_FLOOR
          - calculations.net_consolidation_savings
        distinguishing_aspect: |
          Cross-family three-level ladder on POST /consolidation-cases/{caseId}/decision spanning 43
          priority slots: auth (403) outranks concurrency (412) which outranks the fiscal floor (422).
