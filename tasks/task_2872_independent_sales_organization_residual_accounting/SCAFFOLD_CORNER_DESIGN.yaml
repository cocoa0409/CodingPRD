            - "GET /chargeback-events/${cb3} returns amount_cents 3000, occurred_on 2026-07-12, period_month 2026-07, liability AGENT_CHARGED, merchant_id ${m1}"
            - "GET /chargeback-events?merchant_id=${m1}&limit=2&offset=2 returns exactly 2 rows with total_count 5, limit 2, offset 2 and has_more true"
            - "GET /chargeback-events?merchant_id=${m1}&limit=2&offset=4 returns exactly 1 row with total_count 5, offset 4 and has_more false; the two pages together cover 3 distinct ids with no repetition"
            - "GET /chargeback-events?merchant_id=${m1}&period_month=2026-07 returns total_count 2 (${cb3} and ${cb4}) — ${cb5} occurred in July but is BOOKED to 2026-08 and is excluded"
            - "GET /chargeback-events?period_month=2026-07&liability=AGENT_CHARGED returns total_count 2 (${cb3} and ${cb6}) across both merchants — the filters compose"
            - "GET /chargeback-events with no filter returns total_count 6 with default limit 10 and has_more false"

      - name: clock_move_crosses_the_vesting_cliff_from_zero_to_twenty_five
        claim_type: Conditional action
        grounds:
          - endpoints.POST /_clock/set_current_utc
          - calculations.agent_vesting_pct (VESTING_CLIFF_MONTHS, VESTING_STEP_PCT)
          - entities.Agent.fields.vested_pct
        distinguishing_aspect: "vested_pct is derived from the logical clock on every read, never frozen at creation: the same agent reads 0 at the 2026-08-01 default, still 0 at 2027-06-14 (11 whole months because the day-of-month has not been reached) and 25 at 2027-06-15, the inclusive cliff. A wall-clock implementation or a stored-at-create value fails the first assertion."
        test_recipe:
          setup: ["One agent whose vesting_start_date is 2026-06-15, so it is pre-cliff at the server's default clock."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "A1 Fresh", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2026-06-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "GET /agents/${a1}"
              payload: {}
              as: IsoAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-14T00:00:00Z" }
              as: IsoAdmin
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: IsoAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-15T00:00:00Z" }
              as: IsoAdmin
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: IsoAdmin
          assert:
            - "at the startup default clock the setup read gives Agent.${a1}.vested_pct == 0 and vested_pct_at_departure == null — 2026-06-15 to 2026-08-01 is 1 whole month, under the 12-month cliff"
            - "each clock call returns 200 echoing current_utc"
            - "at 2027-06-14 portfolio-summary reports vested_pct == 0 — months_elapsed is 12 by calendar subtraction but decremented to 11 because day 14 < day 15"
            - "at 2027-06-15 portfolio-summary reports vested_pct == 25 — months_elapsed 12 is INCLUSIVE of the cliff and 25 x floor(12 / 12) == 25"
            - "GET /agents/${a1} reports the same vested_pct 25, and Agent.${a1}.version was NOT incremented by either clock move — vested_pct is derived, not written"
            - "trailing_residual_cents, advance_outstanding_cents and lifetime_clawback_cents all stay 0 across the clock moves"

  - section: errors
    instances:

      - name: error_adjustment_state_invalid_on_approve
        claim_type: Violation → Error
        grounds:
          - errors.ERR_ADJUSTMENT_STATE_INVALID
          - validations[priority 9 / ERR_ADJUSTMENT_STATE_INVALID]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_own_unreviewed_adjustment_reports_state_over_segregation
          rationale: "That §1.8 instance approves a still-PROPOSED adjustment and asserts ERR_ADJUSTMENT_STATE_INVALID as the reported error, which is the only trigger this code needs."

      - name: error_segregation_of_duties_on_approve
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority 10 / ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_own_unreviewed_adjustment_reports_state_over_segregation
          rationale: "The same §1.8 instance then reviews the adjustment and re-approves it as its own creator, asserting ERR_SEGREGATION_OF_DUTIES once the priority-9 state check no longer masks it."

      - name: error_program_suspended_on_batch_post
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PROGRAM_SUSPENDED
          - validations[priority 12 / ERR_PROGRAM_SUSPENDED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / batch_post_gated_by_processor_program_status
          rationale: "That §1.8 instance suspends the program under an already-NORMALIZED batch, asserts ERR_PROGRAM_SUSPENDED on the post, then reinstates and re-posts successfully."

      - name: error_duplicate_file_checksum_on_ingest
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_FILE_CHECKSUM
          - validations[priority 12 / ERR_DUPLICATE_FILE_CHECKSUM]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / batch_ingest_overlap_and_duplicate_checksum_reports_temporal_over_constraint
          rationale: "That §1.8 instance re-ingests a released checksum after a reversal and also asserts ERR_DUPLICATE_FILE_CHECKSUM for a live duplicate, covering both directions of the rule."

      - name: error_coverage_overlap_on_ingest
        claim_type: Violation → Error
        grounds:
          - errors.ERR_COVERAGE_OVERLAP
          - validations[priority 11 / ERR_COVERAGE_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / coverage_interval_half_open_adjacency_versus_overlap
          rationale: "That §1.8 instance contrasts an adjacent window (accepted) with a one-day overlap (ERR_COVERAGE_OVERLAP) on the same program, which is exactly this code's trigger."

      - name: error_batches_not_posted_on_issue
        claim_type: Violation → Error
        grounds:
          - errors.ERR_BATCHES_NOT_POSTED
          - validations[priority 12 / ERR_BATCHES_NOT_POSTED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_issue_gated_by_sibling_batch_state_of_another_program
          rationale: "That §1.8 instance leaves a same-period batch of a DIFFERENT program in NORMALIZED and asserts ERR_BATCHES_NOT_POSTED on an unrelated agent's issue."

  - section: rbac
    instances:

      - name: auth_headers_are_checked_before_every_other_rule
        claim_type: Violation → Error
        grounds:
          - validations[priority 1 / ERR_MISSING_AUTH_HEADERS]
          - roles (the four declared roles)
        distinguishing_aspect: "Priority 1 sits above existence and shape: a header-less GET of a non-existent agent reports ERR_MISSING_AUTH_HEADERS rather than ERR_AGENT_NOT_FOUND, and a header-less POST with a missing required field reports it rather than ERR_INVALID_REQUEST. An unrecognised role string is treated as missing, not as ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["No fixtures are required — the header check precedes every lookup."]
          setup_api_calls: []
          trigger:
            - call: "POST /processor-programs"
              payload: { name: "Headerless", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: "<no X-User-Role header>"
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /processor-programs"
              payload: { name: "No User Id", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              as_user_id: "<no X-User-ID header>"
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /processor-programs"
              payload: { name: "Wrong Role", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: Auditor
              as_user_id: auditor-1
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
            - call: "GET /agents/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: "<no X-User-Role header>"
              is_negative_trigger: true
              captures: { e4: $.data.error_id }
            - call: "POST /agents"
              payload: { split_pct: 0.50 }
              as: "<no X-User-Role header>"
              is_negative_trigger: true
              captures: { e5: $.data.error_id }
            - call: "POST /processor-programs"
              payload: { name: "Properly Authenticated", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              as_user_id: admin-1
              captures: { p1: $.data.id }
          assert:
            - "${e1} == ERR_MISSING_AUTH_HEADERS with HTTP 401 — X-User-Role absent"
            - "${e2} == ERR_MISSING_AUTH_HEADERS with HTTP 401 — X-User-ID absent even though the role is valid"
            - "${e3} == ERR_MISSING_AUTH_HEADERS and NOT ERR_UNAUTHORIZED — 'Auditor' is not one of the four declared roles, so the priority-1 rule owns it"
            - "${e4} == ERR_MISSING_AUTH_HEADERS and NOT ERR_AGENT_NOT_FOUND — priority 1 outranks the priority-6 existence rule"
            - "${e5} == ERR_MISSING_AUTH_HEADERS and NOT ERR_INVALID_REQUEST — priority 1 outranks the priority-4 shape rule even with name and override_pct missing"
            - "the final call returns 201 and ProcessorProgram.${p1}.status == ACTIVE; GET /processor-programs returns total_count 1, so none of the five refused calls created a row"

      - name: role_exclusivity_across_the_money_boundary
        claim_type: Violation → Error
        grounds:
          - validations[priority 2 / ERR_UNAUTHORIZED]
          - roles.ResidualController.exclusive_operations
          - roles.IsoAdmin.exclusive_operations
        distinguishing_aspect: "The peer boundary cuts both ways: the analyst and even the IsoAdmin are refused the post and the issue (only the controller moves money), the controller is refused master-data writes, the Agent is refused merchant boarding, and the analyst is refused the one read it does not share — GET /agent-advances. Every refusal leaves the batch NORMALIZED and the statement DRAFT."
        test_recipe:
          setup: ["Program P1 with agent A1 and merchant M1; batch B1 for 2026-06 posted by the controller so a DRAFT statement exists; batch B2 for 2026-07 left NORMALIZED."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-06", coverage_start: "2026-06-01", coverage_end: "2026-07-01", file_checksum: "sha256:rb-0006" }
