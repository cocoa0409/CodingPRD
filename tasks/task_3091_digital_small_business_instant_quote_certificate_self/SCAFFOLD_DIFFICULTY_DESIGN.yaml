scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_premium_provisional_vs_final_claims_free
        grounds:
          - calculations.premium_calculation
          - entities.Quote.fields.annual_premium_cents
          - entities.Policy.fields.base_annual_premium_cents
        distinguishing_aspect: |
          On the Quote/Policy domain the provisional premium (claim-free at quote
          time) and the final premium at bind (claim-free flag flipped false by a
          PAID claim in between) differ for identical exposure/lines/class:
          153900 vs 162000 cents.
        test_recipe:
          setup:
            - "Class CC_A: eligible [GL,PL,TOOLS], rates GL=12000 PL=18000 TOOLS=6000 cents/unit, risk_factor 1.0, appetite_active."
            - "ADMIT rule keyword 'contractor' -> CC_A."
            - "Account A (DIRECT) with no signals and empty uw_answers."
            - "Q1 created for [GL,TOOLS], exposure 10, effective 2026-09-01 -> provisional premium 153900 (2-line package 10% + claims-free 5%)."
            - "P0: same account, class CC_B (GL-only, rate 10000, rf 1.5), bound; a claim filed and PAID (adjuster adj-1, distinct finance fin-1) flipping claims_free_flag to false."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_A", description: "Contractor", eligible_lines: ["GL", "PL", "TOOLS"], base_rates_cents: { GL: 12000, PL: 18000, TOOLS: 6000 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/class-codes"
              payload: { code: "CC_B", description: "Builder", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 1.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "contractor", class_code: "CC_A", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "builder", class_code: "CC_B", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner GC", contact_email: "gc@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_gc: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_gc}", raw_description: "general contractor office and tools", selected_lines: ["GL", "TOOLS"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { q1_id: $.data.id, q1_prem: $.data.annual_premium_cents }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_gc}", raw_description: "builder", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { q0_id: $.data.id, q0_v: $.data.version }
            - call: "POST /ins/quotes/${q0_id}/bind"
              payload: { expected_quote_version: "${q0_v}" }
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { p0_id: $.data.id }
            - call: "POST /ins/claims"
              payload: { policy_id: "${p0_id}", loss_occurred_at: "2026-09-01T00:00:00Z", description: "Ladder fell on client", claim_amount_cents: 150000 }
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { cl_id: $.data.id }
            - call: "POST /ins/claims/${cl_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
            - call: "POST /ins/claims/${cl_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
            - call: "POST /ins/claims/${cl_id}/payout"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "GET /ins/quotes/${q1_id}"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { q1_v: $.data.version }
          trigger:
            - call: "POST /ins/quotes/${q1_id}/bind"
              payload: { expected_quote_version: "${q1_v}" }
              as: Policyholder
              as_user_id: "${ba_gc}"
              captures: { p1_base: $.data.base_annual_premium_cents }
          assert:
            - "Quote.${q1_id}.annual_premium_cents == 153900 (provisional, claim-free at quote time)"
            - "Policy bound from ${q1_id}.base_annual_premium_cents == 162000 (final, claims_free_flag now false)"
            - "BusinessAccount.${ba_gc}.claims_free_flag == false"

      - name: cancellation_credit_short_rate_vs_pro_rata
        grounds:
          - calculations.midterm_proration
          - entities.BusinessAccount.fields.account_credit_cents
        distinguishing_aspect: |
          On the Policy/BusinessAccount domain the short-rate cancellation variant
          (factor 0.90) and the pro-rata endorsement variant (factor 1.0) produce
          different monetary results for the identical remaining-day arithmetic:
          short-rate credit 94167 vs the pro-rata downgrade credit 52315 booked
          earlier on the same policy.
        test_recipe:
          setup:
            - "CC_A as above; account B with no signals (claims_free true)."
            - "P_S bound from quote [GL], exposure 10, effective 2026-09-01 -> base premium 114000."
            - "Clock at 2026-10-01 (day 273; remaining 335 days of 365)."
            - "E1 COVERAGE_ADJUST exposure 10 -> 5 effective day 273: pro-rata delta = round_half_up((57000-114000)*335/365) = -52315 credited."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_A", description: "Contractor", eligible_lines: ["GL", "PL", "TOOLS"], base_rates_cents: { GL: 12000, PL: 18000, TOOLS: 6000 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "contractor", class_code: "CC_A", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Second Site LLC", contact_email: "ss@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ss: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ss}", raw_description: "contractor", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ss}"
              captures: { qs_id: $.data.id, qs_v: $.data.version }
            - call: "POST /ins/quotes/${qs_id}/bind"
              payload: { expected_quote_version: "${qs_v}" }
              as: Policyholder
              as_user_id: "${ba_ss}"
              captures: { ps_id: $.data.id, ps_v: $.data.version }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ins/policies/${ps_id}/endorsements"
              payload: { endorsement_type: "COVERAGE_ADJUST", effective_at: "2026-10-01T00:00:00Z", expected_policy_version: "${ps_v}", new_exposure_units: 5 }
              as: Policyholder
              as_user_id: "${ba_ss}"
              captures: { e1_delta: $.data.premium_delta_cents }
          trigger:
            - call: "POST /ins/policies/${ps_id}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_ss}"
            - call: "GET /ins/business-accounts/${ba_ss}"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_ss}"
              captures: { ba_credit: $.data.account_credit_cents }
          assert:
            - "Endorsement E1.premium_delta_cents == -52315 (pro-rata variant)"
            - "BusinessAccount.${ba_ss}.account_credit_cents == 146482 (52315 downgrade credit + 94167 short-rate cancel credit)"
            - "A hypothetical pro-rata cancellation credit would have been 104630; the booked short-rate credit is 94167 (factor 0.90, not 1.0)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: premium_tiered_multi_line_discount_interaction
        grounds:
          - calculations.premium_calculation
        distinguishing_aspect: |
          Mode (a): premium has 4 interacting inputs (exposure tier multiplier,
          class risk_factor, line-count package discount, claims-free discount) with
          non-linear min/tier selection; exposure 10 vs 200 flips the tier multiplier
          1.00 -> 1.30 (20x exposure yields 26x premium, not 20x).
        test_recipe:
          setup:
            - "CC_A; account C, no signals, claims_free true."
            - "P_T bound: [GL,PL,TOOLS], exposure 10, effective 2026-09-01 -> base 273600."
            - "Clock at 2026-10-01 (day 273, remaining 335)."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_A", description: "Contractor", eligible_lines: ["GL", "PL", "TOOLS"], base_rates_cents: { GL: 12000, PL: 18000, TOOLS: 6000 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "contractor", class_code: "CC_A", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Tier Co", contact_email: "tier@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_t: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_t}", raw_description: "contractor", selected_lines: ["GL", "PL", "TOOLS"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_t}"
              captures: { qt_id: $.data.id, qt_v: $.data.version }
            - call: "POST /ins/quotes/${qt_id}/bind"
              payload: { expected_quote_version: "${qt_v}" }
              as: Policyholder
              as_user_id: "${ba_t}"
              captures: { pt_id: $.data.id, pt_v: $.data.version, pt_base: $.data.base_annual_premium_cents }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ins/policies/${pt_id}/endorsements"
              payload: { endorsement_type: "COVERAGE_ADJUST", effective_at: "2026-10-01T00:00:00Z", expected_policy_version: "${pt_v}", new_exposure_units: 200 }
              as: Policyholder
              as_user_id: "${ba_t}"
              captures: { e_delta: $.data.premium_delta_cents }
          assert:
            - "Policy.${pt_id}.base_annual_premium_cents == 273600"
            - "Endorsement.premium_delta_cents == 6473676 (new final premium 7327008 with tier 1.30 and 3% exposure-audit uplift, pro-rated 335/365)"
            - "Policy.${pt_id}.exposure_units == 200"

      - name: premium_rounding_order_sum_then_round
        grounds:
          - calculations.premium_calculation
        distinguishing_aspect: |
          Mode (b): per-line values carry fractional cents (54004.50 and 27004.50);
          the pinned order sums unrounded lines then rounds once to 69263, while
          rounding each line first yields 69264 — the order matters and the scaffold
          pins sum-then-round.
        test_recipe:
          setup:
            - "CC_R: eligible [GL,TOOLS], rates GL=12001 TOOLS=6001 cents/unit, risk_factor 1.5, appetite_active."
            - "ADMIT rule keyword 'roofer' -> CC_R."
            - "Account R, no signals, claims_free true, empty answers."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_R", description: "Roofer", eligible_lines: ["GL", "TOOLS"], base_rates_cents: { GL: 12001, TOOLS: 6001 }, risk_factor: 1.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "roofer", class_code: "CC_R", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Roof Right", contact_email: "rr@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_r: $.data.id }
          trigger:
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_r}", raw_description: "roofer", selected_lines: ["GL", "TOOLS"], exposure_units: 3, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_r}"
              captures: { qr_prem: $.data.annual_premium_cents }
          assert:
            - "Quote.annual_premium_cents == 69263 (sum-then-round: round_half_up((54004.50 + 27004.50) * 0.9 * 0.95))"
            - "Quote.annual_premium_cents != 69264 (the per-line-round-first wrong order)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_referral_loop_back_to_quoted
        grounds:
          - state_machines.Quote.CLASSIFYING_to_REFERRED
          - state_machines.Quote.REFERRED_to_QUOTED
        distinguishing_aspect: |
          Quote has a branch-and-loop: CLASSIFYING -> REFERRED -> QUOTED via
          underwriter approval (risk 65 in [60,85)); the approved quote can then
          bind. Decline would end in DECLINED — the fork outcome depends on the
          referral decision.
        test_recipe:
          setup:
            - "CC_A; account with one severity-80 LOSS_HISTORY signal (+25) and two 'yes' hazard answers (+20): base 20 + 25 + 20 = 65 -> REFERRED."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_A", description: "Contractor", eligible_lines: ["GL", "PL", "TOOLS"], base_rates_cents: { GL: 12000, PL: 18000, TOOLS: 6000 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "contractor", class_code: "CC_A", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Risky GC", contact_email: "rg@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_rg: $.data.id }
            - call: "POST /ins/risk-signals"
              payload: { business_account_id: "${ba_rg}", signal_type: "LOSS_HISTORY", severity: 80, detail: "Prior loss" }
              as: PlatformAdmin
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_rg}", raw_description: "contractor", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: { q1: "yes", q2: "yes" } }
              as: Policyholder
              as_user_id: "${ba_rg}"
              captures: { qrg_id: $.data.id, qrg_status: $.data.status, qrg_score: $.data.risk_score }
            - call: "GET /ins/quotes/${qrg_id}/referral"
              payload: {}
              as: Underwriter
              captures: { ref_id: $.data.0.id }
          trigger:
            - call: "POST /ins/referrals/${ref_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: uw-1
            - call: "GET /ins/quotes/${qrg_id}"
              payload: {}
              as: Underwriter
          assert:
            - "Quote.${qrg_id} entered REFERRED with risk_score == 65"
            - "after approval Quote.${qrg_id}.status == QUOTED"
            - "UnderwriterReferral.${ref_id}.status == RESOLVED and decision == APPROVED"

      - name: policy_nonrenewal_branch_vs_renewal_branch
        grounds:
          - state_machines.Policy.ACTIVE_to_NON_RENEWAL_PENDING
          - state_machines.Policy.NON_RENEWAL_PENDING_to_NON_RENEWED
          - state_machines.Policy.ACTIVE_to_RENEWED
        distinguishing_aspect: |
          Policy has branching fork paths out of ACTIVE — NON_RENEWAL_PENDING ->
          NON_RENEWED (clock reaches term_end) versus RENEWED via /renew — with
          divergent side-effect sets per branch (notice + lapse vs successor policy
          + credit consumption).
        test_recipe:
          setup:
            - "CC_C class (GL rate 10000, rf 0.5, appetite_active) with ADMIT keyword 'handyman'."
            - "Account with bound ACTIVE policy P (premium 142500), no claims."
            - "Clock advanced to 2027-07-18 (day 563; inside renewal window [488,608); RISK_ESCALATION minimum 30 days satisfied: 608-563 = 45 >= 30)."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Corner Handy", contact_email: "ch@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ch: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ch}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { qc_id: $.data.id, qc_v: $.data.version }
            - call: "POST /ins/quotes/${qc_id}/bind"
              payload: { expected_quote_version: "${qc_v}" }
              as: Policyholder
              as_user_id: "${ba_ch}"
              captures: { pc_id: $.data.id }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-18T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ins/policies/${pc_id}/non-renewal-notices"
              payload: { reason_code: "RISK_ESCALATION" }
              as: ComplianceOfficer
              as_user_id: co-1
              captures: { nrn_id: $.data.id, nrn_days: $.data.days_before_term_end }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ins/policies/${pc_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "NonRenewalNotice.${nrn_id}.days_before_term_end == 45"
            - "Policy.${pc_id}.status == NON_RENEWAL_PENDING after notice"
            - "Policy.${pc_id}.status == NON_RENEWED after clock reaches term_end"
            - "no successor policy was created for BusinessAccount.${ba_ch}"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_paid_cascade_to_renewal_gate
        grounds:
          - state_machines.Claim.APPROVED_to_PAID
          - calculations.premium_calculation
          - entities.BusinessAccount.fields.claims_free_flag
        distinguishing_aspect: |
          Depth-4 cascade from FinanceOfficer payout: Claim APPROVED->PAID flips
          BusinessAccount.claims_free_flag false; that flip removes the 5% discount
          in premium_calculation; the repriced renewal basis then feeds
          account_credit_ledger consumption at renew — each hop caused by the
          previous, not by the payout directly.
        test_recipe:
          setup:
            - "CC_C; account with ACTIVE policy P (base 142500), claim paid before renewal window."
            - "Clock advanced into renewal window (2027-07-03, day 548); P has no open claims."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Cascade Co", contact_email: "cc@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_cc: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_cc}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_cc}"
              captures: { qc_id: $.data.id, qc_v: $.data.version }
            - call: "POST /ins/quotes/${qc_id}/bind"
              payload: { expected_quote_version: "${qc_v}" }
              as: Policyholder
              as_user_id: "${ba_cc}"
              captures: { pc_id: $.data.id }
            - call: "POST /ins/claims"
              payload: { policy_id: "${pc_id}", loss_occurred_at: "2026-09-01T00:00:00Z", description: "Property damage", claim_amount_cents: 150000 }
              as: Policyholder
              as_user_id: "${ba_cc}"
              captures: { cl_id: $.data.id }
            - call: "POST /ins/claims/${cl_id}/triage"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
            - call: "POST /ins/claims/${cl_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: adj-1
          trigger:
            - call: "POST /ins/claims/${cl_id}/payout"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "GET /ins/business-accounts/${ba_cc}"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_cc}"
              captures: { ba_cf: $.data.claims_free_flag }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ins/policies/${pc_id}"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_cc}"
              captures: { pc_v: $.data.version }
            - call: "POST /ins/policies/${pc_id}/renew"
              payload: { expected_policy_version: "${pc_v}" }
              as: Policyholder
              as_user_id: "${ba_cc}"
              captures: { pc2_base: $.data.base_annual_premium_cents }
          assert:
            - "Claim.${cl_id}.status == PAID"
            - "BusinessAccount.${ba_cc}.claims_free_flag == false after payout (hop 1)"
            - "Successor policy base_annual_premium_cents == 50000 (hop 2: 5% claims-free discount removed; CC_C rf 0.5 -> 10000*10*0.5 with no discount)"
            - "Policy.${pc_id}.status == RENEWED"

      - name: appetite_flip_cascade_to_notice_and_certificate_state
        grounds:
          - state_machines.Policy.ACTIVE_to_NON_RENEWAL_PENDING
          - entities.ClassCode.fields.appetite_active
          - state_machines.Certificate.ISSUED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 cascade from PATCH class-codes: appetite_active true->false
          auto-issues NonRenewalNotice (APPETITE_CHANGE) on every in-window policy
          of the class, and each noticed policy flips ACTIVE -> NON_RENEWAL_PENDING;
          a subsequent cancel of such a policy then voids its certificates — the
          last hop is caused by the policy transition, not the class flip.
        test_recipe:
          setup:
            - "CC_D class (GL rate 8000, rf 1.0) appetite_active, ADMIT keyword 'dogwalker'."
            - "Account with ACTIVE policy P_D (base 91200 = 8000*10*1.0*0.95), one EFFECTIVE AI endorsement, one ISSUED certificate."
            - "Clock at 2027-07-18 (day 563; inside renewal window and APPETITE_CHANGE statutory minimum 608-563 = 45 satisfied)."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_D", description: "Pet care", eligible_lines: ["GL"], base_rates_cents: { GL: 8000 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
              captures: { ccd_id: $.data.id }
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "dogwalker", class_code: "CC_D", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Happy Tails", contact_email: "ht@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_ht: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_ht}", raw_description: "dogwalker", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_ht}"
              captures: { qd_id: $.data.id, qd_v: $.data.version }
            - call: "POST /ins/quotes/${qd_id}/bind"
              payload: { expected_quote_version: "${qd_v}" }
              as: Policyholder
              as_user_id: "${ba_ht}"
              captures: { pd_id: $.data.id, pd_v: $.data.version }
            - call: "POST /ins/policies/${pd_id}/endorsements"
              payload: { endorsement_type: "ADDITIONAL_INSURED", effective_at: "2026-09-01T00:00:00Z", expected_policy_version: "${pd_v}", ai_holder_name: "Park District" }
              as: Policyholder
              as_user_id: "${ba_ht}"
              captures: { end_id: $.data.id }
            - call: "POST /ins/certificates"
              payload: { policy_id: "${pd_id}", endorsement_id: "${end_id}" }
              as: Policyholder
              as_user_id: "${ba_ht}"
              captures: { cert_id: $.data.id }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-18T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "PATCH /ins/class-codes/${ccd_id}"
              payload: { appetite_active: false }
              as: PlatformAdmin
            - call: "GET /ins/policies/${pd_id}/non-renewal-notices"
              payload: {}
              as: ComplianceOfficer
              captures: { nrn0_id: $.data.0.id }
            - call: "GET /ins/policies/${pd_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { pd_status: $.data.status }
            - call: "POST /ins/policies/${pd_id}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_ht}"
            - call: "GET /ins/policies/${pd_id}/certificates"
              payload: {}
              as: PlatformAdmin
          assert:
            - "exactly one NonRenewalNotice exists for Policy.${pd_id} with reason_code APPETITE_CHANGE (hop 1)"
            - "Policy.${pd_id} was NON_RENEWAL_PENDING after the class flip (hop 2)"
            - "after cancel, Certificate.${cert_id}.status == VOIDED (hop 3, caused by the policy cancel, not the class flip)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancel_with_open_claims_and_agent_role
        grounds:
          - validations[priority=2]
          - validations[priority=9]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Pair (auth vs business_fiscal): an Agent calling cancel on a policy that
          also has open claims must get the priority-2 role error ERR_FORBIDDEN_ROLE,
          never the priority-9 fiscal error ERR_OPEN_CLAIMS_BLOCK.
        test_recipe:
          setup:
            - "CC_C; account with ACTIVE policy and one open (SUBMITTED) claim."
          setup_api_calls:
