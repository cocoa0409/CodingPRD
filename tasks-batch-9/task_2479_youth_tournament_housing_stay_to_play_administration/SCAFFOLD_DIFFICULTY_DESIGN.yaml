# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2479 — Youth Tournament Housing & Stay-to-Play Administration
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every numeric literal in every `assert:` was computed by executing the
# referenced calculations[].formula against the pinned setup inputs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: roster_room_requirement_segregated_vs_pooled_occupancy
        grounds:
          - calculations.roster_room_requirement
          - entities.TeamRegistration.fields.required_rooms_registered
          - entities.TeamRegistration.fields.minimum_rooms_for_compliance
          - entities.TeamRegistration.fields.effective_required_rooms
          - validations[priority=84]
        distinguishing_aspect: |
          Entity domain is the TeamRegistration roster: two defensible occupancy readings of
          one roster disagree by two rooms. segregated_occupancy ceils players and staff in
          separate buckets at different per-room capacities and lands on 6 rooms, which becomes
          the booking CEILING enforced by validations priority 84; pooled_occupancy ceils the
          combined head count once and lands on 4 rooms, which becomes the compliance FLOOR.
          The same registration is therefore simultaneously allowed to book up to 6 rooms and
          judged compliant at 4.
        test_recipe:
          setup:
            - "One Tournament posture OPEN with night_count 3 (2026-09-10 to 2026-09-13)."
            - "One Team, no registration yet."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
            - call: "POST /housing/teams"
              payload: { name: "Riverside FC 16U", home_city: "Farville", home_state: "ST", org_contact_email: "riverside@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { team1_id: "$.data.id" }
          trigger:
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team1_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg1_id: "$.data.id" }
          assert:
            - "Tournament.${tourn_id}.night_count == 3"
            - "TeamRegistration.${reg1_id}.required_rooms_registered == 6"
            - "TeamRegistration.${reg1_id}.minimum_rooms_for_compliance == 4"
            - "TeamRegistration.${reg1_id}.required_rooms_registered != TeamRegistration.${reg1_id}.minimum_rooms_for_compliance"
            - "TeamRegistration.${reg1_id}.required_room_nights == 18"
            - "TeamRegistration.${reg1_id}.effective_required_rooms == 4"
            - "TeamRegistration.${reg1_id}.exempt_rooms_granted == 0"
            - "TeamRegistration.${reg1_id}.committed_rooms == 0"
            - "TeamRegistration.${reg1_id}.local_team_flag == false"
            - "TeamRegistration.${reg1_id}.status == PENDING_HOUSING"

      - name: attrition_shortfall_per_block_vs_contract_aggregate
        grounds:
          - calculations.attrition_shortfall
          - calculations.rebate_invoice_amount
          - entities.RebateInvoice.fields.attrition_shortfall_room_nights_per_block
          - entities.RebateInvoice.fields.attrition_shortfall_room_nights_aggregate
          - entities.RoomBlock.fields.actualized_room_nights
        distinguishing_aspect: |
          Entity domain is room-night attrition across a HotelContract's RoomBlocks — a
          different subject and a different metric from the roster instance. per_block_attrition
          clamps each block at zero independently and bills 7 shortfall room nights;
          contract_aggregate_attrition clamps once over the contract totals and reports 5,
          because block A's 2 surplus nights can offset block B's deficit only in the
          aggregate reading. Only the per-block figure reaches attrition_penalty_cents.
        test_recipe:
          setup:
            - "Tournament posture BOOKING_CLOSED, night_count 3."
            - "One EXECUTED HotelContract with attrition_threshold_pct 0.80, rebate_model PER_ROOM_NIGHT_FLAT at 900 cents, attrition_penalty_rate_cents_per_room_night 900."
            - "Two RoomBlocks of 4 rooms each over 3 nights, so contracted_nights is 12 and threshold_nights is ceil(12*0.80) = 10 per block."
            - "Block A has actualized_room_nights 12 (over threshold by 2); block B has 3 (under threshold by 7)."
            - "Both bookings are CHECKED_OUT with rebate_status ACCRUED."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
            - call: "POST /housing/hotels"
              payload: { name: "Host Inn Metro", city: "Metro", total_rooms: 100, distance_miles_from_venue: 3.0 }
              as: HousingManager
              captures: { hotel_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.80, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 4, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { blockA_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "KING", block_size_rooms: 4, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { blockB_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/teams"
              payload: { name: "Riverside FC 16U", home_city: "Farville", home_state: "ST", org_contact_email: "riverside@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { team1_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team1_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg1_id: "$.data.id", reg1_v1: "$.data.version" }
            - call: "POST /housing/teams"
              payload: { name: "Lakeside SC 14U", home_city: "Lakeside", home_state: "ST", org_contact_email: "lakeside@example.com", distance_miles_from_venue: 200.0 }
              as: HousingManager
              captures: { team2_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team2_id}", roster_player_count: 4, roster_staff_count: 0 }
              as: HousingManager
              captures: { reg2_id: "$.data.id", reg2_v1: "$.data.version" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg1_id}", room_block_id: "${blockA_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg1_v1}" }
              as: HousingManager
              captures: { bkA_id: "$.data.id" }
            - call: "POST /housing/bookings/${bkA_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 4, minor_occupant_count: 0 }
              as: HousingManager
            - call: "POST /housing/bookings/${bkA_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg2_id}", room_block_id: "${blockB_id}", rooms_requested: 1, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg2_v1}" }
              as: HousingManager
              captures: { bkB_id: "$.data.id" }
            - call: "POST /housing/bookings/${bkB_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
              as: HousingManager
            - call: "POST /housing/bookings/${bkB_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
            - call: "POST /housing/bookings/${bkA_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "block A folio total" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/bookings/${bkB_id}/actualizations"
              payload: { reported_room_nights: 3, report_note: "block B folio total" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
          trigger:
            - call: "POST /housing/rebate-invoices"
              payload: { contract_id: "${contract_id}", period_label: "2026-09" }
              as: HousingManager
              captures: { inv_id: "$.data.id" }
          assert:
            - "RoomBlock.${blockA_id}.actualized_room_nights == 12"
            - "RoomBlock.${blockB_id}.actualized_room_nights == 3"
            - "RebateInvoice.${inv_id}.attrition_shortfall_room_nights_per_block == 7"
            - "RebateInvoice.${inv_id}.attrition_shortfall_room_nights_aggregate == 5"
            - "RebateInvoice.${inv_id}.attrition_shortfall_room_nights_per_block != RebateInvoice.${inv_id}.attrition_shortfall_room_nights_aggregate"
            - "RebateInvoice.${inv_id}.invoiced_room_nights == 15"
            - "RebateInvoice.${inv_id}.invoiced_rebate_cents == 13500"
            - "RebateInvoice.${inv_id}.attrition_penalty_cents == 6300"
            - "RebateInvoice.${inv_id}.total_due_cents == 7200"
            - "RebateInvoice.${inv_id}.outstanding_cents == 7200"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: revenue_share_split_admin_tier_keyed_on_gross_not_distributable
        grounds:
          - calculations.revenue_share_split
          - entities.RevenueDistribution.fields.admin_fee_pct
          - entities.RevenueDistribution.fields.distributable_cents
          - entities.RevenueDistribution.fields.rounding_remainder_cents
          - concurrency_rules[distribution-create-stale-invoice]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. admin_fee_pct
          is a tier function of an amount and distributable_cents is that amount minus the fee,
          so the two readings are mutually defining. The scaffold pins the tier key to
          gross_collected_cents: at gross 50001 the tier is 0.06 and admin_fee_cents is 3000,
          whereas keying the tier on distributable_cents (47001, below ADMIN_TIER_1_MAX_CENTS)
          would select 0.08 and produce 4000. The fixture straddles the boundary precisely so
          the two evaluation orders are observably different.
        test_recipe:
          setup:
            - "Tournament posture RECONCILING with shares 0.50 / 0.30 / 0.20."
            - "One EXECUTED HotelContract, rebate_model PER_ROOM_NIGHT_FLAT at 1500 cents, attrition_threshold_pct 0.10."
            - "One RoomBlock of 20 rooms over 3 nights; contracted_nights 60, threshold_nights 6."
            - "Two CHECKED_OUT bookings of 6 rooms x 3 nights each, both actualized at 18 room nights, so total actualized is 36 and attrition shortfall is 0."
            - "One RebateInvoice with total_due_cents 54000, status PARTIALLY_PAID after a single remittance of 50001 cents, so collected_cents is exactly 50001 and outstanding_cents is 3999."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
            - call: "POST /housing/hotels"
              payload: { name: "Host Inn Metro", city: "Metro", total_rooms: 100, distance_miles_from_venue: 3.0 }
              as: HousingManager
              captures: { hotel_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 1500, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { block_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/teams"
              payload: { name: "Riverside FC 16U", home_city: "Farville", home_state: "ST", org_contact_email: "riverside@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { team1_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team1_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg1_id: "$.data.id", reg1_v1: "$.data.version" }
            - call: "POST /housing/teams"
              payload: { name: "Lakeside SC 16U", home_city: "Lakeside", home_state: "ST", org_contact_email: "lakeside@example.com", distance_miles_from_venue: 200.0 }
              as: HousingManager
              captures: { team2_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team2_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg2_id: "$.data.id", reg2_v1: "$.data.version" }
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg1_id}", room_block_id: "${block_id}", rooms_requested: 6, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg1_v1}" }
              as: HousingManager
              captures: { bk1_id: "$.data.id" }
            - call: "POST /housing/bookings/${bk1_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 5, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 6, occupant_count: 2, minor_occupant_count: 0 }
              as: HousingManager
            - call: "POST /housing/bookings/${bk1_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "POST /housing/bookings"
              payload: { registration_id: "${reg2_id}", room_block_id: "${block_id}", rooms_requested: 6, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg2_v1}" }
              as: HousingManager
              captures: { bk2_id: "$.data.id" }
            - call: "POST /housing/bookings/${bk2_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 5, occupant_count: 2, minor_occupant_count: 0 }
                  - { room_index: 6, occupant_count: 2, minor_occupant_count: 0 }
              as: HousingManager
            - call: "POST /housing/bookings/${bk2_id}/confirm"
              payload: {}
              as: HousingManager
            - call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
            - call: "POST /housing/bookings/${bk1_id}/actualizations"
              payload: { reported_room_nights: 18 }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/bookings/${bk2_id}/actualizations"
              payload: { reported_room_nights: 18 }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/rebate-invoices"
              payload: { contract_id: "${contract_id}", period_label: "2026-09" }
              as: HousingManager
              captures: { inv_id: "$.data.id" }
            - call: "POST /housing/rebate-invoices/${inv_id}/lifecycle"
              payload: { action: "ISSUE" }
              as: HousingManager
            - call: "POST /housing/rebate-invoices/${inv_id}/remit"
              payload: { amount_cents: 50001 }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "GET /housing/rebate-invoices/${inv_id}"
              payload: {}
              as: HousingManager
              captures: { inv_v: "$.data.version" }
          trigger:
            - call: "POST /housing/revenue-distributions"
              payload: { tournament_id: "${tourn_id}", source_invoice_id: "${inv_id}", expected_invoice_version: "${inv_v}" }
              as: HousingManager
              captures: { dist_id: "$.data.id" }
          assert:
            - "RebateInvoice.${inv_id}.total_due_cents == 54000"
            - "RebateInvoice.${inv_id}.collected_cents == 50001"
            - "RebateInvoice.${inv_id}.outstanding_cents == 3999"
            - "RevenueDistribution.${dist_id}.gross_collected_cents == 50001"
            - "RevenueDistribution.${dist_id}.admin_fee_pct == 0.06"
            - "RevenueDistribution.${dist_id}.admin_fee_cents == 3000"
            - "RevenueDistribution.${dist_id}.distributable_cents == 47001"
            - "RevenueDistribution.${dist_id}.organizer_cents == 23501"
            - "RevenueDistribution.${dist_id}.rights_holder_cents == 14100"
            - "RevenueDistribution.${dist_id}.destination_cents == 9400"
            - "RevenueDistribution.${dist_id}.rounding_remainder_cents == 1"
            - "RevenueDistribution.${dist_id}.organizer_cents + RevenueDistribution.${dist_id}.rights_holder_cents + RevenueDistribution.${dist_id}.destination_cents == 47001"
            - "RevenueDistribution.${dist_id}.status == CALCULATED"

      - name: rebate_invoice_round_per_line_then_sum_not_sum_then_round
        grounds:
          - calculations.rebate_invoice_amount
          - calculations.booking_rebate_line
          - entities.HotelContract.fields.rebate_percent
          - entities.RebateInvoice.fields.invoiced_rebate_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents, on a different axis from
          the revenue-split instance. With negotiated_nightly_rate_cents 14999 and rebate_percent
          0.0825 the two invoice lines are 4949.67 and 7424.505 raw cents. Rounding each line
          half-up first yields 4950 + 7425 = 12375; summing the raw products and rounding once
          yields 12374. The scaffold pins round-per-line-then-sum, so 12375 is the only correct
          invoiced_rebate_cents and 12374 is a detectable wrong answer.
        test_recipe:
          setup:
            - "Tournament posture BOOKING_CLOSED, night_count 3."
            - "One EXECUTED HotelContract, rebate_model PERCENT_OF_ROOM_REVENUE, negotiated_nightly_rate_cents 14999, rebate_percent 0.0825, attrition_threshold_pct 0.05."
            - "One RoomBlock of 20 rooms over 3 nights; contracted_nights 60, threshold_nights 3."
            - "Booking X is 2 rooms for 2 nights, actualized at 4 room nights; Booking Y is 2 rooms for 3 nights, actualized at 6 room nights. Total 10 actualized nights, so attrition shortfall is 0."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
            - call: "POST /housing/hotels"
              payload: { name: "Host Inn Metro", city: "Metro", total_rooms: 100, distance_miles_from_venue: 3.0 }
              as: HousingManager
              captures: { hotel_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14999, rebate_model: "PERCENT_OF_ROOM_REVENUE", rebate_percent: 0.0825, attrition_threshold_pct: 0.05, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { block_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "POST /housing/teams"
              payload: { name: "Riverside FC 12U", home_city: "Farville", home_state: "ST", org_contact_email: "riverside12@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { teamX_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${teamX_id}", roster_player_count: 5, roster_staff_count: 1 }
              as: HousingManager
              captures: { regX_id: "$.data.id", regX_v1: "$.data.version" }
            - call: "POST /housing/teams"
              payload: { name: "Lakeside SC 12U", home_city: "Lakeside", home_state: "ST", org_contact_email: "lakeside12@example.com", distance_miles_from_venue: 200.0 }
