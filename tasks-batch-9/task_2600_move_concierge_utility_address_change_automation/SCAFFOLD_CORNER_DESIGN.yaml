      - name: parallel_dimensions_credit_and_provision_advance_independently
        claim_type: valid_transition
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.UtilityOrder.state_field
        excluded_because:
          difficulty_instance: non_linear_state_machine / utility_order_parallel_credit_and_provision_dimensions
          rationale: "The parallel-shape claim (each dimension moves without the other, combined state correct) is the whole subject of that §1.8 instance."

      - name: cyclic_filing_resubmission_respects_the_loop_bound
        claim_type: valid_transition
        grounds:
          - state_machines.AddressChangeFiling.REJECTED_to_SUBMITTED
          - "errors[ERR_RESUBMIT_LIMIT_REACHED]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / filing_rejected_resubmit_cycle_bounded_by_counter
          rationale: "That instance walks the SUBMITTED to REJECTED to SUBMITTED cycle twice and asserts the third attempt is refused by MAX_FILING_RESUBMITS."

      - name: branching_accept_fork_side_effect_sets_are_disjoint
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReferralPlacement.ACCEPTED_to_CONVERTED
          - state_machines.ReferralPlacement.ACCEPTED_to_DECLINED
        excluded_because:
          difficulty_instance: non_linear_state_machine / placement_accept_branch_divergent_side_effects
          rationale: "The fork at ACCEPTED and the disjoint ledger side effects of its two branches are asserted there."

      - name: cascade_down_consent_revocation_suspends_only_non_terminal_children
        claim_type: side_effect_execution
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.UtilityOrder.OPEN_PROVISION_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / consent_revocation_four_hop_cascade
          rationale: "All four hops, and the fact that terminal children are left alone, are asserted end to end there."

      - name: conditional_cascade_merge_touches_only_open_children
        claim_type: side_effect_execution
        grounds:
          - state_machines.UtilityOrder.OPEN_PROVISION_to_CANCELLED
          - state_machines.AddressChangeFiling.OPEN_FILING_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / duplicate_merge_three_hop_cascade
          rationale: "The MERGE_INTO cascade there asserts which children are rewritten and which are left in their terminal states."

      - name: guarded_transition_activation_reads_the_sibling_credit_dimension
        claim_type: precondition_enforcement
        grounds:
          - state_machines.UtilityOrder.SCHEDULED_to_ACTIVE_SERVICE
          - "errors[ERR_CREDIT_NOT_CLEARED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_activation_blocked_by_deposit_due_handoff
          rationale: "The cross-dimension guard (activation refused purely because the sibling handoff answered DEPOSIT_REQUIRED) is asserted there, including the repair path."

      - name: compensation_reversal_reverses_every_original_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReferralPlacement.CONVERTED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / placement_reversal_zeroes_ledger_net
          rationale: "That instance asserts the conserved quantity placement_ledger_net_cents returns to exactly 0 with no drift."

  - section: calculations
    instances:

      - name: constants_applied_partial_name_and_partial_address_components
        claim_type: constants_applied
        grounds:
          - calculations.duplicate_match_score.constants.PARTIAL_NAME_SCORE
          - calculations.duplicate_match_score.constants.PARTIAL_ADDRESS_SCORE
          - calculations.duplicate_match_score.constants.W_NAME
          - calculations.duplicate_match_score.constants.W_ADDRESS
          - calculations.duplicate_match_score.formula
        distinguishing_aspect: |
          The two partial-credit constants are the only inputs to duplicate scoring that no other
          test touches: every §1.8 duplicate instance drives exact matches (component 1.00) or an
          empty pool. Here the surname-only name match must contribute exactly 0.6 * 0.35 = 0.21
          and the same-postal-different-street address must contribute exactly 0.5 * 0.25 = 0.125,
          so a design that treats a partial match as a full match (0.35 / 0.25) or as no match
          (0.00) produces 0.86 or 0.375 instead of 0.71.
        test_recipe:
          setup:
            - "Two residents who share one email address but have different given names, and three destination addresses: two in postal 30302 on different streets and one in postal 31201."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res1_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Marco Ruiz", email: "dana.ruiz@example.com", phone_last4: "9052", date_of_birth: "1979-11-02", ssn_last4: "3318" }
              as: PlatformAdmin
              captures: { res2_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "915 Juniper St", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res1_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d1_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_a_id: $.data.id }
          trigger:
            - call: "POST /moves"
              payload: { resident_id: "${res2_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${d2_id}", move_date: "2026-08-25" }
              as: MoveOpsAgent
