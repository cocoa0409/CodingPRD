              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /activities"
              payload: { service_id: "${svc_id}", activity_code: "CLUBHOUSE", participation_required_elements: ["SCREEN_NAME", "EMAIL"] }
              as: ComplianceOfficer
              captures: { act_id: $.data.id }
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "SCREEN_NAME", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "ANONYMIZE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Screen name retained while the clubhouse membership is active." }
              as: ComplianceOfficer
            - call: "POST /retention-schedules"
              payload: { service_id: "${svc_id}", data_element_code: "EMAIL", purpose_code: "PARTICIPATION_CORE", retention_days: 30, disposal_method: "CRYPTO_ERASE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", defined_purpose_statement: "Child email retained only to deliver clubhouse notices." }
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Direct notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], disclosed_integration_vendors: ["AdKid Network"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv2: $.data.version }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.c@x.test", child_pseudonym: "child-101", intended_uses: ["PARTICIPATION_CORE", "THIRD_PARTY_DISCLOSURE"], consent_method: "GOVT_ID_MATCH", expected_service_version: "${sv2}" }
