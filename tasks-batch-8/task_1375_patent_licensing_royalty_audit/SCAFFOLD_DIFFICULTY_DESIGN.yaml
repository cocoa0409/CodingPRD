                lines: [ { product_label: "A", units_sold: 10, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r1_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r1_id}/accept"
              payload: {}
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/distribution-runs"
              payload: { agreement_id: "${ag_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", pool_cents: 999999 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_PERIOD_NOT_CLOSED (temporal priority 11 wins over fiscal priority 13)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: screening_threshold_exact_equality
        grounds:
          - calculations.underreport_screening
          - validations[priority=8]
        distinguishing_aspect: |
          Metric = currency cents, endpoint = POST /royalty-reports/{id}/validate.
          Threshold round_half_up(200000 * 9000/10000) = 180000; reported exactly
          180000 passes (VALIDATED) while 179999 fails (FLAGGED) — the `<` is strict.
        test_recipe:
          setup:
            - "AG ACTIVE tolerance 1000 bp; two reports in disjoint periods, benchmark 200000"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Edge Co", tax_id: "TAX-EG-1", contact_email: "e@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-22222-K1"
                title: "Edge"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-01-01T00:00:00Z"
                period_end: "2026-01-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 18, gross_sales_cents: 180000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-02-01T00:00:00Z"
                period_end: "2026-02-28T00:00:00Z"
                lines: [ { product_label: "B", units_sold: 18, gross_sales_cents: 179999, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /licensing/royalty-reports/${r1_id}/validate"
              payload: { benchmark_net_sales_cents: 200000 }
              as: LicensingAnalyst
              captures: { r1_st: $.data.status }
            - call: "POST /licensing/royalty-reports/${r2_id}/validate"
              payload: { benchmark_net_sales_cents: 200000 }
              as: LicensingAnalyst
              captures: { r2_st: $.data.status }
          assert:
            - "captured r1_st == VALIDATED (reported 180000 == threshold 180000; inclusive pass)"
            - "captured r2_st == FLAGGED (179999 < 180000; strict below)"
      - name: audit_window_last_day_boundary
        grounds:
          - calculations.audit_window_check
          - errors[ERR_AUDIT_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Metric = time (months), endpoint = POST /audits — distinct from the
          currency-metric /validate instance. With window 24 months and clock
          2026-08-01, cutoff is 2024-08-01: scope ending exactly 2024-08-01 is
          auditable (inclusive >=); scope ending 2024-07-31 is expired.
        test_recipe:
          setup:
            - "AG ACTIVE audit_window_months 24; logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Win Co", tax_id: "TAX-WN-1", contact_email: "w@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-33333-L1"
                title: "Window"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                audit_window_months: 24
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2024-08-01T00:00:00Z", scope_period_end: "2024-08-01T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au1_id: $.data.id }
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2024-07-30T00:00:00Z", scope_period_end: "2024-07-31T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { err: $.data.error_id }
          assert:
            - "Audit ${au1_id} created (scope end exactly on the 2024-08-01 cutoff is auditable — inclusive >=)"
            - "captured err == ERR_AUDIT_WINDOW_EXPIRED (scope end 2024-07-31 precedes cutoff; the two scopes do not overlap, isolating the temporal rule)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_requires_active_agreement
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_SUSPENDED
          - validations[priority=7]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair RoyaltyReport -> LicenseAgreement: a RoyaltyReport create is
          rejected while the referenced LicenseAgreement is SUSPENDED.
        test_recipe:
          setup:
            - "AG ACTIVE then SUSPENDED; licensee ACTIVE"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Gate Co", tax_id: "TAX-GT-1", contact_email: "g@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-44444-M1"
                title: "Gate"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: SUSPEND }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 1000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_AGREEMENT_NOT_ACTIVE"
      - name: finding_requires_audit_fieldwork
        grounds:
          - state_machines.RoyaltyAudit.INITIATED_to_FIELDWORK
          - validations[priority=8]
          - errors[ERR_AUDIT_INVALID_STATE]
        distinguishing_aspect: |
          Pair AuditFinding -> RoyaltyAudit (distinct from RoyaltyReport ->
          LicenseAgreement): finding creation is rejected while the audit is
          still INITIATED; only FIELDWORK admits findings.
        test_recipe:
          setup:
            - "FLAGGED report referred to an audit that remains INITIATED"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Fw Co", tax_id: "TAX-FW-1", contact_email: "fw@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-55555-N1"
                title: "FW"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                audit_window_months: 24
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 200000 }
              as: LicensingAnalyst
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-03-01T00:00:00Z", scope_period_end: "2026-03-31T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /licensing/audit-findings"
              payload: { audit_id: "${au_id}", report_id: "${r_id}", finding_type: UNDERREPORTED_BASE, audited_base_cents: 180000 }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_AUDIT_INVALID_STATE (audit INITIATED, not FIELDWORK)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics/resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: report_period_half_open_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource = RoyaltyReport periods; HALF-OPEN semantics: a new report
          starting exactly at another's period_end is allowed, while a straddling
          period is rejected with ERR_REPORT_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "AG ACTIVE; R1 [2026-02-01, 2026-03-01) submitted"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Adj Co", tax_id: "TAX-AJ-1", contact_email: "a@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-66666-P1"
                title: "Adjacency"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-02-01T00:00:00Z"
                period_end: "2026-03-01T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 10000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-04-01T00:00:00Z"
                lines: [ { product_label: "B", units_sold: 1, gross_sales_cents: 10000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-02-15T00:00:00Z"
                period_end: "2026-03-15T00:00:00Z"
                lines: [ { product_label: "C", units_sold: 1, gross_sales_cents: 10000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Report ${r2_id} created (adjacent start == prior end is allowed under half-open semantics)"
            - "captured err == ERR_REPORT_PERIOD_OVERLAP (straddling period collides with both neighbors)"
      - name: audit_scope_closed_interval_touch
        grounds:
          - validations[priority=10]
          - errors[ERR_AUDIT_SCOPE_OVERLAP]
        distinguishing_aspect: |
          Resource = RoyaltyAudit scope windows; CLOSED-interval semantics
          (distinct from the report half-open rule): a scope whose start touches
          an existing open audit's end date counts as overlapping and is
          rejected; a scope starting the next day is accepted.
        test_recipe:
          setup:
            - "AG ACTIVE audit_window_months 24; Audit1 [2026-01-01, 2026-03-31] open (INITIATED)"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Scope Co", tax_id: "TAX-SC-1", contact_email: "sc@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-77777-Q1"
                title: "Scope"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                audit_window_months: 24
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-01-01T00:00:00Z", scope_period_end: "2026-03-31T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au1_id: $.data.id }
          trigger:
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-03-31T00:00:00Z", scope_period_end: "2026-06-30T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { err: $.data.error_id }
            - call: "POST /licensing/audits"
              payload: { agreement_id: "${ag_id}", scope_period_start: "2026-04-01T00:00:00Z", scope_period_end: "2026-06-30T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "ana-1"
              captures: { au3_id: $.data.id }
          assert:
            - "captured err == ERR_AUDIT_SCOPE_OVERLAP (touching endpoint 2026-03-31 counts as overlap under closed-interval semantics)"
            - "Audit ${au3_id} created (start 2026-04-01 is strictly after existing end)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: distribution_approve_void_pool_conservation
        grounds:
          - state_machines.DistributionRun.DRAFT_to_POSTED
          - state_machines.DistributionRun.POSTED_to_VOIDED
          - calculations.inventor_share_distribution
          - entities.LicenseAgreement.fields.undistributed_pool_cents
        distinguishing_aspect: |
          Conserved quantity = LicenseAgreement.undistributed_pool_cents:
          approve debits 5000 and void credits exactly 5000 back, so the pool
          after the round trip equals the pool before (5000); also
          sum(lines) == pool at POSTED (3000 + 2000 == 5000).
        test_recipe:
          setup:
            - "AG ACTIVE with pool 5000 (one accepted report final 5000); run pool 5000 created by fin-1"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Pool Co", tax_id: "TAX-PL-1", contact_email: "pl@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-88888-R1"
                title: "Pool"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 6000 }, { inventor_name: "Alan", share_bp: 4000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 10, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r1_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r1_id}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/distribution-runs"
              payload: { agreement_id: "${ag_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", pool_cents: 5000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /licensing/distribution-runs/${run_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
            - call: "GET /licensing/license-agreements/${ag_id}"
              as: FinanceOfficer
              captures: { pool_posted: $.data.undistributed_pool_cents }
            - call: "POST /licensing/distribution-runs/${run_id}/void"
              payload: { reason: "posted in error" }
              as: FinanceOfficer
              as_user_id: "fin-2"
              captures: { run_status: $.data.status }
            - call: "GET /licensing/license-agreements/${ag_id}"
              as: FinanceOfficer
              captures: { pool_after: $.data.undistributed_pool_cents }
          assert:
            - "captured pool_posted == 0 (approve debited the 5000 pool)"
            - "run lines == [Ada 3000, Alan 2000]; sum == 5000 == pool_cents at POSTED"
            - "captured run_status == VOIDED"
            - "captured pool_after == 5000 (approve+void round trip conserves undistributed_pool_cents)"
      - name: accept_void_roundtrip_balance_conservation
        grounds:
          - state_machines.RoyaltyReport.ACCEPTED_to_VOIDED
          - state_machines.Milestone.ACHIEVED_to_PENDING
          - entities.Licensee.fields.outstanding_balance_cents
          - entities.LicenseAgreement.fields.cumulative_accepted_base_cents
        distinguishing_aspect: |
          Conserved quantities = Licensee.outstanding_balance_cents AND
          LicenseAgreement.cumulative_accepted_base_cents (distinct from the
          distribution pool of instance one): accept(R2) then void-acceptance(R2)
          leaves balance 5000 and cumulative 100000 — identical to the pre-accept
          values — and the milestone reverts ACHIEVED -> PENDING with its fee
          un-accrued.
        test_recipe:
          setup:
            - "AG ACTIVE 500 bp min 0; milestone CUMULATIVE_SALES threshold 300000 fee 25000"
            - "R1 net 100000 ACCEPTED (balance 5000, cumulative 100000)"
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Undo Co", tax_id: "TAX-UN-1", contact_email: "u@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-99999-S1"
                title: "Undo"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/milestones"
              payload: { agreement_id: "${ag_id}", name: "M300", trigger_type: CUMULATIVE_SALES, threshold_cents: 300000, fee_cents: 25000 }
              as: LicensingAnalyst
              captures: { ms_id: $.data.id }
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-01-01T00:00:00Z"
                period_end: "2026-01-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 10, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r1_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r1_id}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-02-01T00:00:00Z"
                period_end: "2026-02-28T00:00:00Z"
                lines: [ { product_label: "B", units_sold: 25, gross_sales_cents: 250000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r2_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r2_id}/accept"
              payload: {}
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/royalty-reports/${r2_id}/void-acceptance"
              payload: { reason: "acceptance error" }
              as: LicensingAnalyst
              captures: { r2_status: $.data.status }
            - call: "GET /licensing/licensees/${l1_id}"
              as: LicensingAnalyst
              captures: { l_bal: $.data.outstanding_balance_cents }
            - call: "GET /licensing/license-agreements/${ag_id}"
              as: LicensingAnalyst
              captures: { ag_cum: $.data.cumulative_accepted_base_cents, ag_pool: $.data.undistributed_pool_cents }
          assert:
            - "captured r2_status == VOIDED"
            - "captured l_bal == 5000 (== balance before R2 accept; R2 royalty 12500 and milestone fee 25000 both un-accrued)"
            - "captured ag_cum == 100000 (== cumulative before R2 accept)"
            - "captured ag_pool == 5000"
            - "Milestone ${ms_id}.status == PENDING with achieved_at cleared (revert because 100000 < 300000)"
