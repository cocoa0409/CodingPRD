              as: PlatformAdmin
          assert:
            - "HTTP 409 with error_id == 'ERR_UNIT_ALREADY_OCCUPIED'"
            - "Resident.${r1_id} is untouched and GET /valet/residents?property_id=${prop_id} returns total_count 1"

      - name: scan_of_a_resident_outside_the_route_range_returns_unit_not_in_route
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_UNIT_NOT_IN_ROUTE]
          - entities.RouteAssignment.fields.unit_to
        distinguishing_aspect: "The resident belongs to the right property but lives at unit 103, outside the route's closed [101, 102] range, so the scan is rejected with HTTP 409 ERR_UNIT_NOT_IN_ROUTE — a different failure from the cross-property rejection at priority 7."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4, contract ACTIVE, residents 101 and 103"
            - "Night 2026-09-01 with an ACCEPTED route over 101-102"
