    roles: [StudioManager, Client]
    code: 201
    input: [studio_id, room_id, client_id, booking_kind, start_at, end_at]
    output: Booking
    side_effects: ["compute base_charge_cents (base_charge calc)", "compute deposit_due_cents", "set hold_expires_at = Clock.current_utc + 24h", "settlement_status=AWAITING_DEPOSIT, schedule_status=HELD"]
