      - name: party_scoped_uniqueness_does_not_apply
        claim_type: multi_tenancy
        grounds:
          - complexity_profile.complexity_layers
          - entities.Player.fields.idp_number
        distinguishing_aspect: "The scaffold declares no multi-tenancy layer, so the only uniqueness rule is the unscoped idp_number collision already covered elsewhere; there is no party-scoped variant to test."
        excluded_because:
          difficulty_instance: recognition_raise_and_void_are_equal_and_opposite
          rationale: "Complexes are peer resources rather than tenants, so no cross-tenant leakage claim exists; the adjacent uniqueness claim is asserted by the rbac corner instance and the validations corner instance duplicate_idp_number_is_rejected_across_the_whole_player_table."
        # NO test_recipe.

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_write_is_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/camp-ops/workout-groups/{groupId}/publish
          - endpoints.GET_/camp-ops/complexes/{complexId}
        distinguishing_aspect: "The occupancy change caused by publishing a group is visible in the publish response and in the immediately following complex read, so no eventual-consistency lag exists for the derived fields."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with one FORMING group of 40 units and a pending mutation."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Cubs Mesa Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 200 }
              as: PlatformAdmin
              captures: { cx: $.data.id }
            - call: "POST /camp-ops/complexes/${cx}/workout-groups"
              payload: { complex_id: "${cx}", roster_bucket: "MAJOR", group_name: "Pitchers Group A", facility_kind: "FIELD", capacity_units: 40 }
              as: ComplexDirector
              captures: { wg: $.data.id, wg_v: $.data.version }
          trigger:
            - call: "POST /camp-ops/workout-groups/${wg}/publish"
              payload: { expected_group_version: "${wg_v}" }
              as: ComplexDirector
              captures: { pub_status: $.data.group_status }
            - call: "GET /camp-ops/complexes/${cx}"
              payload: {}
              as: ComplexDirector
              captures: { occ: $.data.posted_occupancy_units, posture: $.data.facility_posture }
          assert:
            - "the publish response itself already reports group_status PUBLISHED"
            - "the immediately following complex read reports posted_occupancy_units == 40"
            - "no re-read delay or polling is needed because the consistency model is immediate"
            - "Complex.${cx}.facility_posture == NORMAL because 40 is under the 95 percent floor of 190"

