          assert:
            - "diff == tolerance exactly: a_st == PAID, a_res == CLEAN (boundary is inclusive)"
            - "diff == tolerance + 1: b_st == EXCEPTION_HELD, b_res == AMOUNT_MISMATCH"

      - name: decision_deadline_exact_second_inclusive
        grounds:
          - calculations.decision_deadline
          - state_machines.ExceptionItem.OPEN_to_DECISIONED_PAY
          - errors[ERR_DECISION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Metric: timestamp (seconds) on POST /treasury/exceptions/{id}/decision.
          A decision at clock == decision_deadline_at is ACCEPTED (inclusive
          boundary); one second later the same call fails — while DAILY_SWEEP
          still only defaults deadlines STRICTLY before the clock.
        test_recipe:
          setup:
            - "ACTIVE REVERSE-tier enrollment, ROLLING_HOURS 24, default PAY; two exceptions created at presented_at 2026-08-03T13:00:00Z => deadline 2026-08-04T13:00:00Z"
