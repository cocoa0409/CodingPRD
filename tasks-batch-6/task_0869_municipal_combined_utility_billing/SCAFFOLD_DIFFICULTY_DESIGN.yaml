  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bill_period_overlap_half_open_on_account
        grounds:
          - validations[priority=7]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.Bill.fields.period_start
        distinguishing_aspect: |
          A new bill [2026-01-15, 2026-02-15) overlapping an existing [2026-01-01,
          2026-02-01) bill is rejected, but an adjacent [2026-02-01, 2026-03-01) bill
          (end==start) is accepted — half-open interval semantics on Account bills.
        test_recipe:
          setup:
            - "Account with a WATER meter read 9500 and one bill [2026-01-01, 2026-02-01)."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Lap Lily", service_address: "18 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-01-10T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-01-15T00:00:00Z", period_end: "2026-02-15T00:00:00Z" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b3_id: $.data.id }
          assert:
            - "overlapping bill returns error_id == ERR_PERIOD_OVERLAP (409)"
            - "adjacent bill ${b3_id} is created (201)"

      - name: moratorium_window_overlap_closed_with_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_MORATORIUM_OVERLAP]
          - entities.MoratoriumWindow.fields.start_date
        distinguishing_aspect: |
          A new SYSTEM moratorium [2026-06-30, 2026-07-15] that merely TOUCHES an
          existing [2026-06-01, 2026-06-30] window at 2026-06-30 is rejected (closed
          interval; adjacency IS a conflict), whereas a gap window [2026-07-01, ...]
          is accepted — different interval arithmetic than the half-open bill overlap.
        test_recipe:
          setup:
            - "One ACTIVE SYSTEM moratorium [2026-06-01, 2026-06-30]."
          setup_api_calls:
            - call: "POST /moratorium-windows"
              payload: { scope: "SYSTEM", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T00:00:00Z", reason: "WEATHER" }
              as: CollectionsOfficer
              captures: { mw1_id: $.data.id }
          trigger:
            - call: "POST /moratorium-windows"
              payload: { scope: "SYSTEM", start_date: "2026-06-30T00:00:00Z", end_date: "2026-07-15T00:00:00Z", reason: "WEATHER" }
              as: CollectionsOfficer
              captures: { err: $.data.error_id }
            - call: "POST /moratorium-windows"
              payload: { scope: "SYSTEM", start_date: "2026-07-01T00:00:00Z", end_date: "2026-07-31T00:00:00Z", reason: "WEATHER" }
              as: CollectionsOfficer
              captures: { mw3_id: $.data.id }
          assert:
            - "touching window returns error_id == ERR_MORATORIUM_OVERLAP (409)"
            - "gap window ${mw3_id} is created (201)"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_amount_equals_applied_plus_refunded
        grounds:
          - calculations.deposit_settlement
          - state_machines.Deposit.HELD_to_APPLIED
          - entities.Deposit.fields.applied_cents
          - entities.Deposit.fields.refunded_cents
        distinguishing_aspect: |
          On finalize, a 6000 deposit against a 4640 final bill splits into applied
          4640 and refunded 1360, and 4640 + 1360 == 6000 == Deposit.amount_cents; the
          conserved quantity is deposit cash.
        test_recipe:
          setup:
            - "Account with WATER meter read 9500 and a HELD deposit 6000."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Dep Dora", service_address: "19 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/deposits"
              payload: { amount_cents: 6000, reason: "NEW_SERVICE" }
              as: BillingSpecialist
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /accounts/${a_id}/finalize"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
          assert:
            - "Deposit.${d_id}.applied_cents == 4640"
            - "Deposit.${d_id}.refunded_cents == 1360"
            - "Deposit.${d_id}.applied_cents + Deposit.${d_id}.refunded_cents == Deposit.${d_id}.amount_cents == 6000"

      - name: payment_reversal_restores_account_receivable
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - state_machines.Bill.PAID_to_PARTIAL
          - entities.Account.fields.current_balance_cents
        distinguishing_aspect: |
          Paying 4640 zeroes the account receivable and reversing that payment restores
          current_balance_cents to 4640 with the bill back to UNPAID — the conserved
          quantity is account receivable, distinct from deposit cash above.
        test_recipe:
          setup:
            - "Account with WATER meter read 9500, bill 4640, fully paid (bill PAID, balance 0)."
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { service_type: "WATER", unit: "GALLON", fixed_charge_cents: 1000, tiers: [{upper_bound_units: 6000, rate_cents_per_1000: 315}, {upper_bound_units: 12000, rate_cents_per_1000: 500}, {upper_bound_units: null, rate_cents_per_1000: 800}], effective_date: "2026-01-01T00:00:00Z" }
              as: BillingSpecialist
            - call: "POST /accounts"
              payload: { account_holder_name: "Rev Rob", service_address: "20 Elm St", occupant_type: "RESIDENTIAL" }
              as: BillingSpecialist
              captures: { a_id: $.data.id }
            - call: "POST /accounts/${a_id}/meters"
              payload: { service_type: "WATER" }
              as: BillingSpecialist
              captures: { m_id: $.data.id }
            - call: "POST /meters/${m_id}/readings"
              payload: { read_date: "2026-04-15T00:00:00Z", reading_value: 9500, read_type: "ACTUAL" }
              as: MeterTech
            - call: "POST /accounts/${a_id}/bills"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { b_id: $.data.id }
            - call: "POST /accounts/${a_id}/payments"
              payload: { amount_cents: 4640, method: "ACH" }
              as: BillingSpecialist
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: BillingSpecialist
          assert:
            - "before reverse: Bill.${b_id}.payment_status == PAID and Account.${a_id}.current_balance_cents == 0"
            - "Payment.${pay_id}.status == REVERSED"
            - "Bill.${b_id}.payment_status == UNPAID"
            - "Bill.${b_id}.amount_paid_cents == 0"
            - "Account.${a_id}.current_balance_cents == 4640"
