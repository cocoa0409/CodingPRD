      - name: plan_rejection_supersede_loop
        grounds:
          - state_machines.InvestigationPlan.SUBMITTED_to_REJECTED
          - state_machines.InvestigationPlan.REJECTED_to_SUPERSEDED
          - entities.InvestigationPlan.fields.plan_version
          - concurrency_rules[plan-create-stale-case]
        distinguishing_aspect: |
          InvestigationPlan machine loops via supersession: SUBMITTED -> REJECTED,
          then a fresh create supersedes the REJECTED plan (REJECTED -> SUPERSEDED)
          and the new DRAFT carries plan_version 2; approving it finally moves the
          case PLANNING -> FIELDWORK. OCC on Case.version guards each superseding create.
        test_recipe:
          setup:
            - "Case TRIAGED; first plan submitted then rejected by a manager other than the drafter"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
