              captures: { t1: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { hold_booked: $.data.fiduciary_holding_minor, pv2: $.data.version }
            - call: "POST /fiduciary-transactions/${t1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compl-1"
              captures: { t1_appr: $.data.status }
            - call: "POST /fiduciary-transactions/${t1}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { t1_state: $.data.status, t1_value_date: $.data.value_date }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
