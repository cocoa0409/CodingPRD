# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Retail Pharmacy Prescription Fulfillment — Expert tier
# Walks the claim-extraction-guide taxonomy against §1.1-§1.7.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_drug_product_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.DrugProduct, endpoints]
        distinguishing_aspect: "POST /drug-products with all required fields returns 201, status ACTIVE, is_active true, server-minted id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
          trigger:
            - call: "POST /drug-products"
              payload: { ndc: "11111-1111-11", name: "Aspirin", unit_price_cents: 200 }
              as: PharmacyAdmin
              captures: { d: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "DrugProduct.status == ACTIVE"
            - "DrugProduct.is_active == true"
            - "DrugProduct.version == 1"

      - name: get_nonexistent_drug_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.DrugProduct"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /drug-products/{id} for a random UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
          trigger:
            - call: "GET /drug-products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PharmacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_prescription_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Prescription"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /prescriptions omitting days_supply returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Patient, prescriber, drug exist"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /drug-products"
              payload: { ndc: "22222-2222-22", name: "DrugX", unit_price_cents: 300 }
              as: PharmacyAdmin
              captures: { dx: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P", date_of_birth: "1980-01-01" }
              as: Technician
              captures: { px: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr X", npi: "2000000001" }
              as: PharmacyAdmin
              captures: { prx: $.data.id }
          trigger:
            - call: "POST /prescriptions"
              payload: { patient_id: "${px}", prescriber_id: "${prx}", drug_id: "${dx}", quantity_per_fill: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_patient_defaults_applied
        claim_type: Defaults
        grounds: [entities.Patient.fields.auto_refill_enrolled, entities.Patient.fields.allergy_classes, entities.Patient.fields.pdmp_flag]
        distinguishing_aspect: "Omitting auto_refill_enrolled/allergy_classes yields false/[]; pdmp_flag defaults CLEAR, controlled_status ELIGIBLE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Defaulter", date_of_birth: "1990-01-01" }
              as: Technician
              captures: { p: $.data.id, ar: $.data.auto_refill_enrolled, fl: $.data.pdmp_flag, cs: $.data.controlled_status }
          assert:
            - "Patient.auto_refill_enrolled == false"
            - "Patient.allergy_classes == []"
            - "Patient.pdmp_flag == CLEAR"
            - "Patient.controlled_status == ELIGIBLE"

      - name: prescription_expires_utc_computed_180_for_controlled
        claim_type: Computed Fields
        grounds: [entities.Prescription.fields.expires_utc, entities.DrugProduct.fields.dea_schedule]
        distinguishing_aspect: "A CII prescription written 2026-01-01 gets expires_utc 2026-06-30 (+180d), not +365d."
        test_recipe:
          setup: ["CII drug, prescriber with valid DEA"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /drug-products"
              payload: { ndc: "33333-3333-33", name: "CtrlDrug", dea_schedule: "CII", unit_price_cents: 1000 }
              as: PharmacyAdmin
              captures: { cd: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "P2", date_of_birth: "1980-01-01" }
              as: Technician
              captures: { p2: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Y", npi: "2000000002", dea_number: "BY1234567", dea_active: true }
              as: PharmacyAdmin
              captures: { pry: $.data.id }
          trigger:
            - call: "POST /prescriptions"
              payload: { patient_id: "${p2}", prescriber_id: "${pry}", drug_id: "${cd}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { exp: $.data.expires_utc }
          assert:
            - "Prescription.expires_utc == 2026-06-30T00:00:00.000Z"

      - name: create_drug_system_fields_ignore_client_input
        claim_type: System Fields
        grounds: [entities.DrugProduct.fields.status, entities.DrugProduct.fields.is_active]
        distinguishing_aspect: "status/is_active are system/computed; a create response always shows ACTIVE/true regardless of any client-sent value."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
          trigger:
            - call: "POST /drug-products"
              payload: { ndc: "44444-4444-44", name: "SysFieldDrug", unit_price_cents: 100 }
              as: PharmacyAdmin
              captures: { sd: $.data.id, st: $.data.status }
          assert:
            - "DrugProduct.status == ACTIVE"
            - "DrugProduct.is_active == true"

      - name: duplicate_ndc_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.DrugProduct.fields.ndc"
          - "errors[ERR_DUPLICATE_NDC]"
        distinguishing_aspect: "Creating a second DrugProduct with an existing ndc returns ERR_DUPLICATE_NDC 409."
        test_recipe:
          setup: ["One drug with ndc 55555-5555-55 exists"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /drug-products"
              payload: { ndc: "55555-5555-55", name: "Dup1", unit_price_cents: 100 }
              as: PharmacyAdmin
          trigger:
            - call: "POST /drug-products"
              payload: { ndc: "55555-5555-55", name: "Dup2", unit_price_cents: 200 }
              as: PharmacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_NDC"
            - "HTTP status == 409"

      - name: self_referential_substitute_link_filter
        claim_type: Parent Relationships
        grounds: [entities.DrugProduct.fields.therapeutic_substitute_of_id, endpoints]
        distinguishing_aspect: "GET /drug-products?therapeutic_substitute_of_id={brand} returns the generic that points back to the brand (self-referential FK reverse-reachability)."
        test_recipe:
          setup: ["Brand drug and a generic with therapeutic_substitute_of_id = brand"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /drug-products"
              payload: { ndc: "66666-6666-66", name: "Brand", unit_price_cents: 5000 }
              as: PharmacyAdmin
              captures: { brand: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "66666-6666-67", name: "Generic", unit_price_cents: 500, therapeutic_substitute_of_id: "${brand}" }
              as: PharmacyAdmin
              captures: { generic: $.data.id }
          trigger:
            - call: "GET /drug-products?therapeutic_substitute_of_id=${brand}"
              payload: {}
              as: Pharmacist
              captures: { first: "$.data[0].id" }
          assert:
            - "result list contains the generic ${generic}"
            - "result list excludes the brand ${brand}"

      - name: reference_not_found_on_prescription_bad_drug
        claim_type: Parent Relationships
        grounds:
          - "entities.Prescription.fields.drug_id"
          - "errors[ERR_REFERENCE_NOT_FOUND]"
        distinguishing_aspect: "POST /prescriptions with a non-existent drug_id returns ERR_REFERENCE_NOT_FOUND 404."
        test_recipe:
          setup: ["Valid patient + prescriber, bogus drug_id"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "P3", date_of_birth: "1980-01-01" }
              as: Technician
              captures: { p3: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Z", npi: "2000000003" }
              as: PharmacyAdmin
              captures: { prz: $.data.id }
          trigger:
            - call: "POST /prescriptions"
              payload: { patient_id: "${p3}", prescriber_id: "${prz}", drug_id: "00000000-0000-4000-8000-000000000001", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REFERENCE_NOT_FOUND"
            - "HTTP status == 404"

      - name: list_patients_pagination_envelope
        claim_type: Listing
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "GET /patients returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two patients registered"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "PA", date_of_birth: "1980-01-01" }
              as: Technician
            - call: "POST /patients"
              payload: { full_name: "PB", date_of_birth: "1981-01-01" }
              as: Technician
          trigger:
            - call: "GET /patients?limit=1&offset=0"
              payload: {}
              as: Pharmacist
          assert:
            - "response meta has total_count == 2"
            - "response has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: run_dur_from_dispensed_fill_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Fill"
          - "errors[ERR_FILL_NOT_ENTERED]"
        distinguishing_aspect: "run-dur on a fill already past ENTERED (DUR_REVIEW) returns ERR_FILL_NOT_ENTERED 409."
        test_recipe:
          setup: ["Fill in DUR_REVIEW (run-dur already executed once with an alert)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "700001", pcn: "CA", name: "C Plan A", copay_pct: 0.10, copay_max_cents: 10000 }
              as: PharmacyAdmin
              captures: { cp: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "77777-0001-01", name: "DurDrug", unit_price_cents: 500 }
              as: PharmacyAdmin
              captures: { dd: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Allergic", date_of_birth: "1980-01-01", plan_id: "${cp}", allergy_classes: ["PENICILLIN"] }
              as: Technician
              captures: { ap: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr DUR", npi: "2000000010" }
              as: PharmacyAdmin
              captures: { dpr: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${ap}", prescriber_id: "${dpr}", drug_id: "${dd}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { drx: $.data.id }
            - call: "POST /fills"
              payload: { prescription_id: "${drx}" }
              as: Technician
              captures: { dfi: $.data.id }
            - call: "POST /fills/${dfi}/run-dur"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /fills/${dfi}/run-dur"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FILL_NOT_ENTERED"
            - "HTTP status == 409"

      - name: dispense_from_cancelled_terminal_fill_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Fill"
          - "errors[ERR_FILL_NOT_WILL_CALL]"
        distinguishing_aspect: "A CANCELLED fill (terminal) cannot be dispensed; dispense returns ERR_FILL_NOT_WILL_CALL 409."
        test_recipe:
          setup: ["Fill created then cancelled (terminal CANCELLED)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /drug-products"
              payload: { ndc: "77777-0002-01", name: "TermDrug", unit_price_cents: 500 }
              as: PharmacyAdmin
              captures: { td: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Term P", date_of_birth: "1980-01-01" }
              as: Technician
              captures: { tp: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Term", npi: "2000000011" }
              as: PharmacyAdmin
              captures: { tpr: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${tp}", prescriber_id: "${tpr}", drug_id: "${td}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { trx: $.data.id }
            - call: "POST /fills"
              payload: { prescription_id: "${trx}" }
              as: Technician
              captures: { tfi: $.data.id }
            - call: "POST /fills/${tfi}/cancel"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /fills/${tfi}/dispense"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FILL_NOT_WILL_CALL"
            - "HTTP status == 409"

      - name: approve_already_approved_pa_returns_pa_not_pending
        claim_type: Idempotency
        grounds:
          - "state_machines.PriorAuthRequest"
          - "errors[ERR_PA_NOT_PENDING]"
        distinguishing_aspect: "Approving a PA twice: the second approve sees status APPROVED and returns ERR_PA_NOT_PENDING 409."
        test_recipe:
          setup: ["PA approved once already"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "700002", pcn: "CB", name: "C Plan B", copay_pct: 0.10, copay_max_cents: 10000 }
              as: PharmacyAdmin
              captures: { cpb: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "77777-0003-01", name: "PaDrug", unit_price_cents: 500, pa_required: true }
              as: PharmacyAdmin
              captures: { pad: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${cpb}", drug_id: "${pad}", tier: 4, allowed_amount_cents: 400 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pa P", date_of_birth: "1980-01-01", plan_id: "${cpb}" }
              as: Technician
              captures: { pap: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Pa", npi: "2000000012" }
              as: PharmacyAdmin
              captures: { papr: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pap}", prescriber_id: "${papr}", drug_id: "${pad}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { parx: $.data.id }
            - call: "POST /fills"
              payload: { prescription_id: "${parx}" }
              as: Technician
              captures: { pafi: $.data.id }
            - call: "POST /fills/${pafi}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${parx}"
              payload: {}
              as: Technician
              captures: { parxv: $.data.version }
            - call: "POST /fills/${pafi}/submit-claim"
              payload: { expected_prescription_version: "${parxv}" }
              as: Technician
            - call: "GET /prior-auth-requests?fill_id=${pafi}"
              payload: {}
              as: Pharmacist
              captures: { pa: "$.data[0].id", pav: "$.data[0].version" }
            - call: "POST /prior-auth-requests/${pa}/approve"
              payload: { expected_priorauthrequest_version: "${pav}" }
              as: Pharmacist
            - call: "GET /prior-auth-requests/${pa}"
              payload: {}
              as: Pharmacist
              captures: { pav2: $.data.version }
          trigger:
            - call: "POST /prior-auth-requests/${pa}/approve"
              payload: { expected_priorauthrequest_version: "${pav2}" }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PA_NOT_PENDING"
            - "HTTP status == 409"

      - name: prescription_initial_state_active
        claim_type: Initial State
        grounds: [state_machines.Prescription, entities.Prescription.fields.status]
        distinguishing_aspect: "A newly intaken prescription starts in ACTIVE with refills_remaining == refills_authorized."
        test_recipe:
          setup: ["Patient, prescriber, drug exist"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /drug-products"
              payload: { ndc: "77777-0004-01", name: "InitDrug", unit_price_cents: 500 }
              as: PharmacyAdmin
              captures: { idd: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Init P", date_of_birth: "1980-01-01" }
              as: Technician
              captures: { ipp: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Init", npi: "2000000013" }
              as: PharmacyAdmin
              captures: { ipr: $.data.id }
          trigger:
            - call: "POST /prescriptions"
              payload: { patient_id: "${ipp}", prescriber_id: "${ipr}", drug_id: "${idd}", quantity_per_fill: 10, days_supply: 30, refills_authorized: 3, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { st: $.data.status, rr: $.data.refills_remaining }
          assert:
            - "Prescription.status == ACTIVE"
            - "Prescription.refills_remaining == 3"

      - name: prescription_expires_via_sweep_past_expiry
        claim_type: Valid Transition
        grounds: [state_machines.Prescription.ACTIVE_to_EXPIRED, entities.Prescription.fields.expires_utc]
        distinguishing_aspect: "After advancing the clock beyond expires_utc, POST /prescriptions/{id}/expire-scan transitions ACTIVE -> EXPIRED."
        test_recipe:
          setup: ["Non-controlled prescription written 2026-01-01 (expires 2027-01-01); clock advanced to 2027-01-02"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /drug-products"
              payload: { ndc: "77777-0005-01", name: "ExpDrug", unit_price_cents: 500 }
              as: PharmacyAdmin
              captures: { exd: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Exp P", date_of_birth: "1980-01-01" }
              as: Technician
              captures: { exp_p: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Exp", npi: "2000000014" }
              as: PharmacyAdmin
              captures: { expr: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${exp_p}", prescriber_id: "${expr}", drug_id: "${exd}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { exrx: $.data.id }
            - call: "POST /_clock/set"
              payload: { current_utc: "2027-01-02T00:00:00.000Z" }
              as: PharmacyAdmin
          trigger:
            - call: "POST /prescriptions/${exrx}/expire-scan"
              payload: {}
              as: PharmacyAdmin
              captures: { st: $.data.status }
          assert:
            - "Prescription.status == EXPIRED"

      - name: will_call_expire_sweep_returns_to_stock_and_reverses
        claim_type: Side Effect Execution
        grounds: [state_machines.Fill.WILL_CALL_to_RETURNED_TO_STOCK, entities.Fill.fields.claim_status]
        distinguishing_aspect: "expire-will-call on a past-deadline WILL_CALL fill sets status RETURNED_TO_STOCK, claim_status REVERSED, plan_paid 0."
        test_recipe:
          setup: ["Fill in WILL_CALL (deadline 2026-02-04); clock advanced to 2026-02-10"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-25T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "700003", pcn: "CC", name: "C Plan C", copay_pct: 0.10, copay_max_cents: 10000 }
              as: PharmacyAdmin
              captures: { cpc: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "77777-0006-01", name: "WcDrug", unit_price_cents: 500 }
              as: PharmacyAdmin
              captures: { wcd: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${cpc}", drug_id: "${wcd}", tier: 2, allowed_amount_cents: 400 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Wc P", date_of_birth: "1980-01-01", plan_id: "${cpc}" }
              as: Technician
              captures: { wcp: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr Wc", npi: "2000000015" }
              as: PharmacyAdmin
              captures: { wcpr: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${wcp}", prescriber_id: "${wcpr}", drug_id: "${wcd}", quantity_per_fill: 30, days_supply: 30, written_utc: "2026-01-25T00:00:00.000Z" }
              as: Technician
