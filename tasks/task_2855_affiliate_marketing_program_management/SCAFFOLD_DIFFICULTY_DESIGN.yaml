  - rule_id: compensating_invariant
    instances:

      - name: approve_then_void_conserves_affiliate_balance_and_ledger_row_count
        grounds:
          - state_machines.PayoutBatch.APPROVED_to_VOIDED
          - entities.Affiliate.fields.accrued_balance_cents
          - entities.Affiliate.fields.reserved_balance_cents
          - entities.CommissionLedgerEntry.fields.payout_batch_id
          - calculations.payout_line_settlement
        distinguishing_aspect: >-
          Conserved money quantity: accrued_balance_cents + reserved_balance_cents
          must equal the signed sum of the partner's CommissionLedgerEntry rows at
          every step. Approval shifts 4000 cents from accrued to reserved and voiding
