            - call: "GET /horses/${h1}"
              payload: {}
              as: HorseProgramDirector
              captures: { hv1: $.data.version }
            - call: "POST /activity-reservations/${seat1}/mount-assignments"
              payload: { horse_id: "${h1}", expected_horse_version: "${hv1}" }
              as: HorseProgramDirector
            - call: "GET /activity-slots/${slot_id}"
              payload: {}
              as: RanchManager
              captures: { posture_mounted: $.data.readiness_posture, mounts_mounted: $.data.mount_assigned_count }
            - call: "POST /activity-slots/${slot_id}/guide-assignments"
