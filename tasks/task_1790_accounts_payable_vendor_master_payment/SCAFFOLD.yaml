# =============================================================================
# SCAFFOLD — Accounts Payable Vendor Master & Payment Fraud Controls
# =============================================================================

scenario: |
  Accounts Payable Vendor Master & Payment Fraud Controls (shared services AP department): vendor creation with segregation-of-duties & documentation, bank detail change verification via callback to known contact, duplicate/fuzzy vendor detection & merge, sanctions/watchlist screening at setup & payment, dormant vendor deactivation, invoice approval matrix & threshold routing, payment file controls & positive pay integration, audit of master data changes

domain_name: ap-vendor-master-payment-controls
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, rate_threshold_triggers, cascading_side_effects, ops_run_checkpoint]
  entity_topology: flat          # peer entities joined by FK references; a few sub-resource GETs
  state_machine_shape: cyclic    # Vendor ACTIVE<->SUSPENDED + DORMANT loop; Invoice reject/resubmit loop
  relationship_patterns: [one_to_many, self_referential, polymorphic, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name; changing it while ACTIVE|SUSPENDED re-triggers sanctions_screening" }
      - { name: dba_name, type: string, source: input, required: false, description: "Optional trade name; included in duplicate_detection candidate matching" }
      - { name: tax_id, type: string, source: input, description: "Tax identifier (e.g. EIN); immutable after create; unique among non-MERGED non-REJECTED vendors" }
      - { name: remit_email, type: string, source: input, description: "Remittance contact email" }
      - { name: phone, type: string, source: input, description: "Known contact phone; the callback verification MUST dial this pre-existing number" }
      - { name: address_line1, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: country, type: string, source: input, description: "ISO country code" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Net terms in days" }
      - { name: early_pay_discount_pct, type: number, source: input, default: 0, description: "Early-pay discount fraction, e.g. 0.02; 0 disables discounting" }
      - { name: discount_window_days, type: integer, source: input, default: 0, description: "Days from invoice received_date during which the discount applies (inclusive end)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | ACTIVE | SUSPENDED | DORMANT | BLOCKED | REJECTED | MERGED | DEACTIVATED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (SoD-1 anchor)" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of approving VendorManager" }
      - { name: first_activated_at, type: datetime, source: system, required: false, description: "First transition into ACTIVE; drives NEW_VENDOR_DAYS tier bump" }
      - { name: last_payment_cleared_at, type: datetime, source: system, required: false, description: "Set when one of this vendor's payments reaches CLEARED; dormancy reference" }
      - { name: dormant_since_at, type: datetime, source: system, required: false, description: "Set when swept into DORMANT" }
      - { name: duplicate_review_required, type: boolean, source: system, default: false, description: "True when created inside the fuzzy review band with duplicate_acknowledged=true" }
      - { name: fraud_hold_reason, type: string, source: system, required: false, description: "Set when SUSPENDED via positive-pay mismatch cascade" }
      - { name: primary_bank_account_id, type: string, source: system, required: false, description: "FK -> VendorBankAccount.id; current primary VERIFIED account (nullable until first verification)" }
      - { name: merged_into_vendor_id, type: string, source: system, required: false, description: "FK -> Vendor.id; survivor id when status == MERGED" }

  - name: VendorBankAccount
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; owning vendor (path-bound at create)" }
      - { name: account_number, type: string, source: input, description: "Full account number (simulated)" }
      - { name: routing_number, type: string, source: input, description: "9-digit routing number" }
      - { name: account_holder_name, type: string, source: input, description: "Name on account" }
      - { name: is_primary, type: boolean, source: input, default: false, description: "Requested primary flag; becomes effective primary only upon VERIFIED" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | SUPERSEDED | REJECTED | DISABLED" }
      - { name: requested_by_user_id, type: string, source: system, description: "Creator X-User-ID (SoD-3 anchor: confirmer must differ)" }
      - { name: verified_at, type: datetime, source: system, required: false, description: "Set on VERIFIED; drives cooling-off and bank-recency tier bump" }

  - name: CallbackVerification
    parent: null
    common_fields: true
    fields:
      - { name: bank_account_id, type: string, source: system, description: "FK -> VendorBankAccount.id; account under verification" }
      - { name: verification_code, type: string, source: system, description: "Server-issued 6-digit code 'phoned' to the vendor's known contact; exposed on read (simulation)" }
      - { name: attempts, type: integer, source: system, default: 0, description: "Failed confirmation attempts; locked at CALLBACK_MAX_ATTEMPTS" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | LOCKED | EXPIRED" }
      - { name: expires_at, type: datetime, source: system, description: "created_at + CALLBACK_EXPIRY_HOURS; strict-greater comparison at sweep" }
      - { name: confirmed_by_user_id, type: string, source: system, required: false, description: "Confirmer X-User-ID" }

  - name: VendorDocument
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id" }
      - { name: doc_type, type: enum, source: input, description: "W9 | INSURANCE_CERT | BANK_AUTHORIZATION" }
      - { name: valid_from, type: string, source: input, description: "ISO date, inclusive lower bound" }
      - { name: valid_until, type: string, source: input, description: "ISO date, inclusive upper bound (closed interval semantics)" }
      - { name: status, type: enum, source: system, description: "VALID | SUPERSEDED | EXPIRED (EXPIRED set by sweep cache; business checks use live document_validity)" }

  - name: WatchlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: name_pattern, type: string, source: input, description: "Name to screen against; normalized via vendor_name_normalization before matching" }
      - { name: severity, type: enum, source: input, description: "BLOCK | REVIEW" }
      - { name: list_source, type: string, source: input, description: "List provenance, e.g. OFAC_SDN | INTERNAL_FRAUD" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: ScreeningCheck
    parent: null
    common_fields: false
    fields:
      - { name: subject_type, type: enum, source: system, description: "VENDOR | PAYMENT" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; screened vendor" }
      - { name: payment_id, type: string, source: system, required: false, description: "FK -> Payment.id; set when subject_type == PAYMENT" }
      - { name: matched_watchlist_entry_id, type: string, source: system, required: false, description: "FK -> WatchlistEntry.id; best-match entry when result != CLEAR" }
      - { name: match_score, type: number, source: system, description: "Best Dice score, 4 decimal places round_half_up; 1.0000 on exact normalized equality" }
      - { name: result, type: enum, source: system, description: "CLEAR | REVIEW | HIT" }
      - { name: screened_at, type: datetime, source: system, description: "Logical clock at screening time" }

  - name: SanctionsReviewCase
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id" }
      - { name: payment_id, type: string, source: system, required: false, description: "FK -> Payment.id; set for payment-time screening origin" }
      - { name: screening_check_id, type: string, source: system, description: "FK -> ScreeningCheck.id; originating check" }
      - { name: opened_reason, type: enum, source: system, description: "SETUP_SCREENING | PAYMENT_SCREENING" }
      - { name: status, type: enum, source: system, description: "OPEN | CLEARED | CONFIRMED_HIT; at most one OPEN case per vendor" }
      - { name: dispositioned_by_user_id, type: string, source: system, required: false, description: "ComplianceOfficer X-User-ID" }
      - { name: disposition_note, type: string, source: input, required: false, description: "Analyst note recorded at disposition" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; payee" }
      - { name: invoice_number, type: string, source: input, description: "Vendor's invoice number; unique per vendor among non-CANCELLED invoices" }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount in cents; must be > 0" }
      - { name: cost_center, type: string, source: input, description: "Cost center code; selects ApprovalMatrixRule (GLOBAL fallback)" }
      - { name: received_date, type: string, source: input, required: false, description: "ISO date invoice received; default = logical clock date" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PENDING_APPROVAL | REJECTED | APPROVED | IN_PAYMENT_RUN | ON_HOLD | PAID | CANCELLED" }
      - { name: pre_hold_status, type: enum, source: system, required: false, description: "Status to resume to when a hold lifts; cleared on resume" }
      - { name: required_tier, type: integer, source: system, required: false, description: "Approval tier snapshot via invoice_approval_routing at submit/resubmit (pinned against later matrix edits)" }
      - { name: approval_round, type: integer, source: system, default: 0, description: "Increments on each submit/resubmit; scopes InvoiceApproval rows and SoD-5" }
      - { name: submitted_by_user_id, type: string, source: system, required: false, description: "Submitter X-User-ID (SoD-2 anchor)" }
      - { name: provisional_discount_cents, type: integer, source: system, required: false, description: "invoice_pay_amount provisional variant snapshot taken at final-tier approval" }

  - name: InvoiceApproval
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: round_no, type: integer, source: system, description: "Invoice.approval_round at approval time" }
      - { name: tier, type: integer, source: system, description: "Approved tier (1|2|3)" }
      - { name: approver_user_id, type: string, source: system, description: "Approver X-User-ID" }
      - { name: approver_role, type: string, source: system, description: "Role used for this tier per TIER_ROLE" }

  - name: ApprovalMatrixRule
    parent: null
    common_fields: true
    fields:
      - { name: cost_center, type: string, source: input, description: "Cost center code, or literal GLOBAL as the fallback scope" }
      - { name: min_amount_cents, type: integer, source: input, description: "Bracket lower bound, inclusive; >= 0" }
      - { name: max_amount_cents, type: integer, source: input, required: false, description: "Bracket upper bound, EXCLUSIVE; null = unbounded" }
      - { name: tier, type: integer, source: input, description: "Base tier 1|2|3 for amounts in [min, max)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: PaymentRun
    parent: null
    common_fields: true
    fields:
      - { name: scheduled_date, type: string, source: input, description: "ISO value date; drives invoice_pay_amount final variant" }
      - { name: payment_method, type: enum, source: input, description: "CHECK | ACH | WIRE (WIRE adds WIRE_FEE_CENTS per payment)" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPILED | APPROVED | RELEASED | CLOSED | VOIDED" }
      - { name: total_amount_cents, type: integer, source: computed, default: 0, description: "payment_run_totals: sum of net_amount_cents over non-VOIDED payments" }
      - { name: item_count, type: integer, source: computed, default: 0, description: "Count of non-VOIDED payments" }
      - { name: created_by_user_id, type: string, source: system, description: "Creator X-User-ID (SoD-4 anchor)" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "Approver X-User-ID" }
      - { name: released_by_user_id, type: string, source: system, required: false, description: "Releaser X-User-ID" }
      - { name: released_at, type: datetime, source: system, required: false, description: "Logical timestamp of release; daily_release_limit bucketing key" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: payment_run_id, type: string, source: system, description: "FK -> PaymentRun.id" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; denormalized at add time" }
      - { name: bank_account_id, type: string, source: system, description: "FK -> VendorBankAccount.id; snapshot of vendor primary at add time" }
      - { name: bank_account_version, type: integer, source: system, description: "Version of the bank account at snapshot time; re-checked at release" }
      - { name: amount_cents, type: integer, source: system, description: "Invoice gross at add time" }
      - { name: discount_applied_cents, type: integer, source: system, description: "invoice_pay_amount final variant at add time" }
      - { name: fee_cents, type: integer, source: system, description: "WIRE_FEE_CENTS when run method is WIRE, else 0" }
      - { name: net_amount_cents, type: integer, source: computed, description: "amount_cents - discount_applied_cents + fee_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | RELEASED | CLEARED | VOIDED" }
      - { name: void_reason, type: enum, source: system, required: false, description: "MANUAL_REMOVED | VENDOR_BLOCKED | POSITIVE_PAY_MISMATCH | RUN_VOIDED" }

  - name: VendorMergeRecord
    parent: null
    common_fields: false
    fields:
      - { name: survivor_vendor_id, type: string, source: system, description: "FK -> Vendor.id; merge target (path id)" }
      - { name: merged_vendor_id, type: string, source: system, description: "FK -> Vendor.id; absorbed duplicate" }
      - { name: match_score, type: number, source: system, description: "name_similarity_score between the two legal names at merge time, 4dp" }
      - { name: invoices_repointed_count, type: integer, source: system, description: "Non-terminal invoices re-pointed to the survivor" }
      - { name: bank_accounts_disabled_count, type: integer, source: system, description: "Merged vendor's PENDING_VERIFICATION|VERIFIED accounts disabled" }
      - { name: merged_by_user_id, type: string, source: system, description: "VendorManager X-User-ID" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Entity type name (e.g. Vendor, VendorBankAccount)" }
      - { name: entity_id, type: string, source: system, description: "Polymorphic target id interpreted via entity_type; NOT a strict foreign key" }
      - { name: event_type, type: string, source: system, description: "CREATE | UPDATE | STATUS_CHANGE | VERIFY | MERGE | RETIRE | DISPOSITION" }
      - { name: field_name, type: string, source: system, required: false, description: "Changed field for UPDATE/STATUS_CHANGE" }
      - { name: old_value, type: string, source: system, required: false, description: "Stringified prior value" }
      - { name: new_value, type: string, source: system, required: false, description: "Stringified new value" }
      - { name: actor_user_id, type: string, source: system, description: "Caller X-User-ID" }
      - { name: actor_role, type: string, source: system, description: "Caller X-User-Role" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Vendor
    initial_state: DRAFT
    terminal_states: [REJECTED, MERGED, DEACTIVATED, BLOCKED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /vendors/{id}/submit"
        actor: VendorSpecialist | VendorManager
        preconditions:
          - "Vendor has >= 1 W9 document live-valid at the current logical date (document_validity), else ERR_REQUIRED_DOCUMENT_MISSING"
        side_effects: ["AuditEvent STATUS_CHANGE status DRAFT->PENDING_APPROVAL"]
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /vendors/{id}/approve"
        actor: VendorManager
        preconditions:
          - "SoD-1: caller X-User-ID != created_by_user_id, else ERR_SOD_VENDOR_CREATOR_CANNOT_APPROVE"
          - "Inline sanctions_screening (setup variant) result == CLEAR"
        side_effects:
          - "approved_by_user_id = caller; first_activated_at = logical now (first entry only)"
          - "ScreeningCheck row (subject VENDOR, result CLEAR, match_score recorded)"
          - "AuditEvent STATUS_CHANGE -> ACTIVE"
      - from: PENDING_APPROVAL
        to: SUSPENDED
        trigger: "POST /vendors/{id}/approve when inline sanctions_screening result == REVIEW"
        actor: VendorManager
        preconditions: ["SoD-1 as above"]
        side_effects:
          - "ScreeningCheck row (result REVIEW); SanctionsReviewCase OPEN (SETUP_SCREENING) unless an OPEN case already exists for this vendor"
          - "AuditEvent STATUS_CHANGE -> SUSPENDED"
      - from: PENDING_APPROVAL
        to: BLOCKED
        trigger: "POST /vendors/{id}/approve when inline sanctions_screening result == HIT"
        actor: VendorManager
        preconditions: ["SoD-1 as above"]
        side_effects: ["ScreeningCheck row (result HIT)", "AuditEvent STATUS_CHANGE -> BLOCKED"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /vendors/{id}/reject"
        actor: VendorManager
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE -> REJECTED"]
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /vendors/{id}/reject"
        actor: VendorManager
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE -> REJECTED"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/suspend, or system (payment-time screening REVIEW at POST /payment-runs/{id}/invoices), or system (positive-pay MISMATCH cascade), or system (PATCH legal_name re-screen REVIEW)"
        actor: VendorManager | ComplianceOfficer | system
        preconditions: []
        side_effects:
          - "Hold cascade: this vendor's invoices in {PENDING_APPROVAL, APPROVED} -> ON_HOLD with pre_hold_status recorded (invoice already ON_HOLD keeps its original pre_hold_status)"
          - "When triggered by screening: SanctionsReviewCase OPEN unless one already OPEN for this vendor"
          - "AuditEvent STATUS_CHANGE -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendors/{id}/reinstate, or system (SanctionsReviewCase disposition CLEARED)"
        actor: VendorManager | system
        preconditions:
          - "No SanctionsReviewCase with status OPEN references this vendor, else ERR_VENDOR_HAS_OPEN_CASE (manual path)"
        side_effects:
          - "Resume cascade: this vendor's ON_HOLD invoices return to their pre_hold_status and pre_hold_status is cleared"
          - "AuditEvent STATUS_CHANGE -> ACTIVE"
      - from: ACTIVE
        to: DORMANT
        trigger: "system (POST /vendor-sweeps/run dormancy_evaluation)"
        actor: system
        preconditions:
          - "reference = last_payment_cleared_at if set else first_activated_at; now - reference >= DORMANCY_DAYS"
          - "No invoices in {RECEIVED, PENDING_APPROVAL, APPROVED, IN_PAYMENT_RUN, ON_HOLD}"
        side_effects: ["dormant_since_at = now", "AuditEvent STATUS_CHANGE -> DORMANT"]
      - from: DORMANT
        to: ACTIVE
        trigger: "POST /vendors/{id}/reactivate when inline re-screening result == CLEAR"
        actor: VendorManager
        preconditions: []
        side_effects: ["dormant_since_at = null", "ScreeningCheck row", "AuditEvent STATUS_CHANGE -> ACTIVE"]
      - from: DORMANT
        to: SUSPENDED
        trigger: "POST /vendors/{id}/reactivate when inline re-screening result == REVIEW"
        actor: VendorManager
        preconditions: []
        side_effects: ["ScreeningCheck row (REVIEW); SanctionsReviewCase OPEN unless already OPEN", "AuditEvent STATUS_CHANGE -> SUSPENDED"]
      - from: DORMANT
        to: BLOCKED
        trigger: "POST /vendors/{id}/reactivate when inline re-screening result == HIT"
        actor: VendorManager
        preconditions: []
        side_effects: ["ScreeningCheck row (HIT)", "AuditEvent STATUS_CHANGE -> BLOCKED"]
      - from: DORMANT
        to: DEACTIVATED
        trigger: "system (POST /vendor-sweeps/run) or POST /vendors/{id}/deactivate"
        actor: system | VendorManager
        preconditions:
          - "Sweep path: dormant_since_at set and now - dormant_since_at >= DORMANT_DEACTIVATE_DAYS and no invoices in {RECEIVED, PENDING_APPROVAL, APPROVED, IN_PAYMENT_RUN, ON_HOLD}"
          - "Manual path: same invoice precondition, else ERR_VENDOR_HAS_OPEN_INVOICES; also no payments in {PENDING, RELEASED}"
        side_effects: ["AuditEvent STATUS_CHANGE -> DEACTIVATED"]
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /vendors/{id}/deactivate"
        actor: VendorManager
        preconditions: ["No invoices in {RECEIVED, PENDING_APPROVAL, APPROVED, IN_PAYMENT_RUN, ON_HOLD} (ERR_VENDOR_HAS_OPEN_INVOICES)", "No payments in {PENDING, RELEASED}"]
        side_effects: ["AuditEvent STATUS_CHANGE -> DEACTIVATED"]
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /vendors/{id}/deactivate"
        actor: VendorManager
        preconditions: ["Same as ACTIVE -> DEACTIVATED"]
        side_effects: ["AuditEvent STATUS_CHANGE -> DEACTIVATED"]
      - from: SUSPENDED
        to: BLOCKED
        trigger: "system (SanctionsReviewCase disposition CONFIRMED_HIT, or payment-time screening HIT, or PATCH legal_name re-screen HIT)"
        actor: system
        preconditions: []
        side_effects:
          - "Block cascade (ordered): (1) this vendor's invoices in {PENDING_APPROVAL, APPROVED}, plus invoices in IN_PAYMENT_RUN whose payment is still PENDING (run not yet released), -> ON_HOLD (pre_hold_status recorded; existing ON_HOLD rows keep original pre_hold_status); invoices in RELEASED runs are NOT held and ride to their ack outcome"
          - "(2) each payment whose invoice just became ON_HOLD from IN_PAYMENT_RUN (all such payments are PENDING by step 1's filter) -> VOIDED with void_reason VENDOR_BLOCKED"
          - "(3) each such payment's run recomputes payment_run_totals; a run in APPROVED whose contents changed auto-demotes to COMPILED"
          - "AuditEvent STATUS_CHANGE -> BLOCKED"
      - from: ACTIVE
        to: BLOCKED
        trigger: "system (payment-time screening HIT at POST /payment-runs/{id}/invoices, or PATCH legal_name re-screen HIT)"
        actor: system
        preconditions: []
        side_effects: ["Same ordered block cascade as SUSPENDED -> BLOCKED"]
      - from: DRAFT
        to: MERGED
        trigger: "POST /vendors/{survivorId}/merge with this vendor as duplicate_vendor_id"
        actor: VendorManager
        preconditions: ["Merge gate per ERR_VENDOR_NOT_MERGEABLE (see validation 25)"]
        side_effects: ["merged_into_vendor_id = survivor id; shared merge side effects (see ACTIVE -> MERGED)"]
      - from: PENDING_APPROVAL
        to: MERGED
        trigger: "POST /vendors/{survivorId}/merge"
        actor: VendorManager
        preconditions: ["Merge gate"]
        side_effects: ["merged_into_vendor_id set; shared merge side effects"]
      - from: ACTIVE
        to: MERGED
        trigger: "POST /vendors/{survivorId}/merge"
        actor: VendorManager
        preconditions: ["Merge gate"]
        side_effects:
          - "merged_into_vendor_id = survivor id"
          - "All invoices of the merged vendor with status NOT IN {PAID, CANCELLED} are re-pointed to the survivor (invoice.vendor_id = survivor id)"
          - "Merged vendor's bank accounts in {PENDING_VERIFICATION, VERIFIED} -> DISABLED; survivor primary unchanged"
          - "VendorMergeRecord created with match_score + repoint/disable counts; AuditEvent MERGE on both vendors"
      - from: SUSPENDED
        to: MERGED
        trigger: "POST /vendors/{survivorId}/merge"
        actor: VendorManager
        preconditions: ["Merge gate; source must have no OPEN SanctionsReviewCase"]
        side_effects: ["merged_into_vendor_id set; shared merge side effects"]
      - from: DORMANT
        to: MERGED
        trigger: "POST /vendors/{survivorId}/merge"
        actor: VendorManager
        preconditions: ["Merge gate"]
        side_effects: ["merged_into_vendor_id set; shared merge side effects"]

  - entity: VendorBankAccount
    initial_state: PENDING_VERIFICATION
    terminal_states: [SUPERSEDED, REJECTED, DISABLED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /bank-accounts/{id}/confirm-verification with matching code"
        actor: VendorSpecialist | VendorManager
        preconditions:
          - "Verification in PENDING (LOCKED -> ERR_CALLBACK_LOCKED; EXPIRED -> ERR_CALLBACK_EXPIRED; CONFIRMED -> ERR_INVALID_STATE_TRANSITION)"
          - "SoD-3: caller X-User-ID != requested_by_user_id, else ERR_SOD_CALLBACK_REQUESTER_CANNOT_CONFIRM"
          - "verification_code matches, else ERR_CALLBACK_CODE_MISMATCH (and attempts += 1; 3rd mismatch locks)"
        side_effects:
          - "verified_at = now; verification -> CONFIRMED"
          - "If is_primary: previous VERIFIED primary of this vendor -> SUPERSEDED (its version increments); vendor.primary_bank_account_id = this account and Vendor.version increments by 1"
          - "AuditEvent VERIFY"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "system (3rd code mismatch via callback_attempt_policy, or sweep expiry of the PENDING verification)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE -> REJECTED"]
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system (another account of the same vendor confirmed with is_primary=true)"
        actor: system
        preconditions: []
        side_effects: ["version increments", "AuditEvent STATUS_CHANGE -> SUPERSEDED"]
      - from: VERIFIED
        to: DISABLED
        trigger: "POST /bank-accounts/{id}/disable, or system (vendor merge disables source accounts)"
        actor: VendorManager | system
        preconditions:
          - "Manual path: no payments in {PENDING, RELEASED} reference this account, else ERR_BANK_ACCOUNT_IN_USE"
        side_effects:
          - "If this was vendor.primary_bank_account_id: vendor.primary_bank_account_id = null and Vendor.version increments by 1"
          - "AuditEvent STATUS_CHANGE -> DISABLED"

  - entity: CallbackVerification
    initial_state: PENDING
    terminal_states: [CONFIRMED, LOCKED, EXPIRED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /bank-accounts/{id}/confirm-verification (code match)"
        actor: VendorSpecialist | VendorManager
        preconditions: ["attempts < CALLBACK_MAX_ATTEMPTS", "now <= expires_at"]
        side_effects: ["confirmed_by_user_id = caller; parent account VERIFIED chain fires"]
      - from: PENDING
        to: LOCKED
        trigger: "system (attempts reaches CALLBACK_MAX_ATTEMPTS on a failed confirmation)"
        actor: system
        preconditions: []
        side_effects: ["parent VendorBankAccount -> REJECTED"]
      - from: PENDING
        to: EXPIRED
        trigger: "system (POST /vendor-sweeps/run when now > expires_at)"
        actor: system
        preconditions: []
        side_effects: ["parent VendorBankAccount (still PENDING_VERIFICATION) -> REJECTED"]

  - entity: VendorDocument
    initial_state: VALID
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: VALID
        to: SUPERSEDED
        trigger: "POST /documents/{id}/supersede"
        actor: VendorSpecialist
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE -> SUPERSEDED"]
      - from: VALID
        to: EXPIRED
        trigger: "system (POST /vendor-sweeps/run when valid_until < current logical date)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE -> EXPIRED"]
    note: "Business checks (vendor submit, payment add) use live document_validity: status == VALID AND valid_from <= today <= valid_until. status is a sweep-maintained cache; a VALID row whose window has passed fails live checks with ERR_DOCUMENT_EXPIRED."

  - entity: WatchlistEntry
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /watchlist-entries/{id}/retire"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["AuditEvent RETIRE"]
    note: "sanctions_screening considers only status == ACTIVE entries; retiring changes future screening outcomes (setup vs payment variant divergence)."

  - entity: SanctionsReviewCase
    initial_state: OPEN
    terminal_states: [CLEARED, CONFIRMED_HIT]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /sanctions-cases/{id}/disposition decision=CLEARED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "dispositioned_by_user_id = caller"
          - "If the referenced vendor is SUSPENDED and has no other OPEN case: vendor SUSPENDED -> ACTIVE, firing the resume cascade"
          - "AuditEvent DISPOSITION"
      - from: OPEN
        to: CONFIRMED_HIT
        trigger: "POST /sanctions-cases/{id}/disposition decision=CONFIRMED_HIT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Vendor SUSPENDED -> BLOCKED, firing the ordered block cascade (invoice hold -> payment void -> run recompute/demote)"
          - "AuditEvent DISPOSITION"

  - entity: Invoice
    initial_state: RECEIVED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: RECEIVED
        to: PENDING_APPROVAL
        trigger: "POST /invoices/{id}/submit"
        actor: APClerk | APSupervisor | APManager
        preconditions:
          - "Vendor status == ACTIVE, else ERR_VENDOR_NOT_ACTIVE (21)"
          - "A matching ApprovalMatrixRule exists, else ERR_NO_APPROVAL_RULE (26)"
        side_effects:
          - "approval_round += 1; submitted_by_user_id = caller"
          - "required_tier = invoice_approval_routing snapshot at submit time"
      - from: PENDING_APPROVAL
        to: PENDING_APPROVAL
        trigger: "POST /invoices/{id}/approve (intermediate tiers)"
        actor: APSupervisor | APManager | Controller
        preconditions:
          - "Caller role == TIER_ROLE[tier] else ERR_FORBIDDEN_FOR_ROLE (2)"
          - "tier == count(approvals this round) + 1; a lower-or-equal tier -> ERR_INVALID_STATE_TRANSITION (6); skipping ahead -> ERR_APPROVAL_TIER_OUT_OF_ORDER (27)"
          - "SoD-2: caller != submitted_by_user_id else ERR_SOD_INVOICE_SUBMITTER_CANNOT_APPROVE (16)"
          - "SoD-5: caller not among this round's prior approvers else ERR_SOD_SAME_APPROVER_TWO_TIERS (17)"
        side_effects: ["InvoiceApproval row (round_no, tier, approver)"]
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /invoices/{id}/approve when tier == required_tier"
        actor: APSupervisor | APManager | Controller
        preconditions: ["Same tier/SoD preconditions as intermediate approve"]
        side_effects:
          - "InvoiceApproval row"
          - "provisional_discount_cents = invoice_pay_amount provisional variant (clock date vs received_date + discount_window_days)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /invoices/{id}/reject"
        actor: APSupervisor | APManager | Controller
        preconditions: ["Caller role == TIER_ROLE[tier] and tier == next pending tier (same ordering rules as approve)"]
        side_effects: ["AuditEvent STATUS_CHANGE -> REJECTED with reason"]
      - from: REJECTED
        to: PENDING_APPROVAL
        trigger: "POST /invoices/{id}/resubmit"
        actor: APClerk | APSupervisor | APManager
        preconditions: ["Vendor status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)", "Matching ApprovalMatrixRule exists (ERR_NO_APPROVAL_RULE)"]
        side_effects:
          - "approval_round += 1; submitted_by_user_id = caller"
          - "required_tier RE-SNPASHOTTED via invoice_approval_routing at resubmit time (matrix edits and vendor aging since the first submit take effect now)"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /invoices/{id}/cancel"
        actor: APClerk
        preconditions: []
        side_effects: []
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /invoices/{id}/cancel"
        actor: APClerk
        preconditions: []
        side_effects: ["This round's InvoiceApproval rows remain as history"]
      - from: REJECTED
        to: CANCELLED
        trigger: "POST /invoices/{id}/cancel"
        actor: APClerk
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_PAYMENT_RUN
        trigger: "system (POST /payment-runs/{id}/invoices adds this invoice)"
        actor: TreasuryAnalyst
        preconditions: ["Run-level gates per endpoint (screening CLEAR, W9 live-valid, bank VERIFIED + cooling-off elapsed)"]
        side_effects: ["Payment row created (PENDING) with bank snapshot + final discount + fee"]
      - from: IN_PAYMENT_RUN
        to: APPROVED
        trigger: "system (payment voided pre-release via POST /payments/{id}/void or run void)"
        actor: TreasuryAnalyst | system
        preconditions: []
        side_effects: []
      - from: IN_PAYMENT_RUN
        to: PAID
        trigger: "system (positive-pay ack MATCH clears the payment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_APPROVAL
        to: ON_HOLD
        trigger: "system (vendor suspend/block cascade)"
        actor: system
        preconditions: []
        side_effects: ["pre_hold_status = PENDING_APPROVAL"]
      - from: APPROVED
        to: ON_HOLD
        trigger: "system (vendor suspend/block cascade, incl. positive-pay mismatch chain)"
        actor: system
        preconditions: []
        side_effects: ["pre_hold_status = APPROVED"]
      - from: IN_PAYMENT_RUN
        to: ON_HOLD
        trigger: "system (vendor BLOCK cascade only; plain SUSPEND does not touch IN_PAYMENT_RUN invoices)"
        actor: system
        preconditions: []
        side_effects: ["pre_hold_status = IN_PAYMENT_RUN"]
      - from: ON_HOLD
        to: PENDING_APPROVAL
        trigger: "system (vendor reinstated/reactivated to ACTIVE and pre_hold_status == PENDING_APPROVAL)"
        actor: system
        preconditions: []
        side_effects: ["pre_hold_status cleared"]
      - from: ON_HOLD
        to: APPROVED
        trigger: "system (vendor reinstated and pre_hold_status == APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["pre_hold_status cleared"]
    note: "ON_HOLD with pre_hold_status == IN_PAYMENT_RUN arises only via the block cascade (whose payment is voided) and never resumes, because BLOCKED is terminal; resume targets are therefore only PENDING_APPROVAL and APPROVED."

  - entity: PaymentRun
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DRAFT
        to: COMPILED
        trigger: "POST /payment-runs/{id}/compile"
        actor: TreasuryAnalyst
        preconditions: ["item_count >= 1 else ERR_EMPTY_PAYMENT_RUN (33)"]
        side_effects: ["payment_run_totals recomputed over non-VOIDED payments"]
      - from: COMPILED
        to: DRAFT
        trigger: "POST /payment-runs/{id}/uncompile"
        actor: TreasuryAnalyst
        preconditions: []
        side_effects: []
      - from: COMPILED
        to: APPROVED
        trigger: "POST /payment-runs/{id}/approve"
        actor: TreasuryManager
        preconditions: ["SoD-4a: caller != created_by_user_id else ERR_SOD_RUN_CREATOR_CANNOT_APPROVE (18)"]
        side_effects: ["approved_by_user_id = caller"]
      - from: APPROVED
        to: COMPILED
        trigger: "POST /payment-runs/{id}/revoke-approval, or system (content changed underneath: payment voided / block cascade)"
        actor: TreasuryManager | system
        preconditions: []
        side_effects: ["approved_by_user_id = null"]
      - from: APPROVED
        to: RELEASED
        trigger: "POST /payment-runs/{id}/release"
        actor: TreasuryManager
        preconditions:
          - "SoD-4b: caller != created_by_user_id else ERR_SOD_RUN_CREATOR_CANNOT_RELEASE (19)"
          - "For every payment: vendor.primary_bank_account_id == payment.bank_account_id AND that account's current version == payment.bank_account_version, else ERR_BANK_SNAPSHOT_STALE (37)"
          - "daily_release_limit: sum of total_amount_cents over runs in {RELEASED, CLOSED} released_at the same logical UTC date + this run's total_amount_cents <= TREASURY_DAILY_LIMIT_CENTS, else ERR_DAILY_LIMIT_EXCEEDED (38)"
        side_effects:
          - "released_by_user_id = caller; released_at = now"
          - "Every PENDING payment -> RELEASED (positive-pay file deemed issued to the bank)"
      - from: RELEASED
        to: CLOSED
        trigger: "system (bubble-up: the last non-terminal payment reaches CLEARED or VOIDED via positive-pay acks)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "POST /payment-runs/{id}/void"
        actor: TreasuryAnalyst | TreasuryManager
        preconditions: []
        side_effects: ["All PENDING payments -> VOIDED (RUN_VOIDED); their invoices IN_PAYMENT_RUN -> APPROVED; totals recomputed"]
      - from: COMPILED
        to: VOIDED
        trigger: "POST /payment-runs/{id}/void"
        actor: TreasuryAnalyst | TreasuryManager
        preconditions: []
        side_effects: ["Same payment/invoice unwind as DRAFT -> VOIDED"]

  - entity: Payment
    initial_state: PENDING
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: PENDING
        to: RELEASED
        trigger: "system (run release)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: VOIDED
        trigger: "POST /payments/{id}/void (manual), or system (run void), or system (vendor block cascade)"
        actor: TreasuryAnalyst | system
        preconditions: ["Manual path: run not RELEASED/CLOSED/VOIDED (payment no longer PENDING -> ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "void_reason set (MANUAL_REMOVED | RUN_VOIDED | VENDOR_BLOCKED)"
          - "Invoice IN_PAYMENT_RUN -> APPROVED (manual/run-void paths)"
          - "Run totals recomputed via payment_run_totals; run in APPROVED auto-demotes to COMPILED"
      - from: RELEASED
        to: CLEARED
        trigger: "system (POST /payment-runs/{id}/positive-pay-acks item ack_result == MATCH)"
        actor: BankFileProcessor
        preconditions: ["Run RELEASED; payment currently RELEASED, else ERR_PAYMENT_ALREADY_TERMINAL (9)"]
        side_effects:
          - "Invoice IN_PAYMENT_RUN -> PAID"
          - "vendor.last_payment_cleared_at = now (Vendor.version increments by 1)"
          - "Run bubble-up check: all payments terminal -> run CLOSED"
      - from: RELEASED
        to: VOIDED
        trigger: "system (positive-pay ack MISMATCH)"
        actor: BankFileProcessor
        preconditions: ["Payment currently RELEASED, else ERR_PAYMENT_ALREADY_TERMINAL (9)"]
        side_effects:
          - "void_reason = POSITIVE_PAY_MISMATCH (ordered chain:)"
          - "(1) its invoice IN_PAYMENT_RUN -> APPROVED"
          - "(2) vendor -> SUSPENDED with fraud_hold_reason = POSITIVE_PAY_MISMATCH"
          - "(3) vendor suspend cascade holds invoices in {PENDING_APPROVAL, APPROVED} -> ON_HOLD (this catches the invoice reverted in step 1; it ends ON_HOLD with pre_hold_status = APPROVED)"
          - "Run bubble-up check"

  - entity: ApprovalMatrixRule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /approval-matrix-rules/{id}/retire"
        actor: Controller
        preconditions: []
        side_effects: ["AuditEvent RETIRE"]
    note: "Overlap gate (ERR_RULE_RANGE_OVERLAP) applies among rules with status == ACTIVE sharing a cost_center, over half-open [min, max); adjacency (new.min == existing.max) is allowed. In-flight invoices keep their required_tier snapshot."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: vendor-patch-stale-version
    parent_entity: Vendor
    write_endpoint: "PATCH /vendors/{id}"
    occ_field: "expected_vendor_version"
    description: |
      Updating a Vendor whose version has advanced since the client last
      observed it is rejected: the updater's master-data view is stale, so
      the write is refused rather than silently layered over the newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: vendor-merge-stale-version
    parent_entity: Vendor
    write_endpoint: "POST /vendors/{id}/merge"
    occ_field: "expected_vendor_version"
    description: |
      Merging a duplicate into a survivor Vendor whose version has advanced
      since the client last observed it is rejected: another merge or master
      data write has legitimately superseded the observed state, and the
      survivor's current contents must be re-read before absorbing a vendor.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bank-account-create-stale-vendor
    parent_entity: Vendor
    write_endpoint: "POST /vendors/{id}/bank-accounts"
    occ_field: "expected_vendor_version"
    description: |
      Adding a bank account against a Vendor whose version has advanced since
      the client last observed it is rejected: a primary-superseding account
      create must be based on the vendor's current account landscape, so a
      stale view is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: vendor_name_normalization
    trigger: "shared by duplicate_vendor_detection and sanctions_screening"
    algorithm: normalization
    formula: |
      1. uppercase
      2. replace every character outside [A-Z0-9] with a space
      3. split on whitespace; drop tokens in SUFFIX_TOKENS
      4. concatenate remaining tokens with no separator
    input_set: "a single raw name string"
    constants:
      SUFFIX_TOKENS: [INC, LLC, CORP, CORPORATION, COMPANY, CO, LTD, LP, LLP, PLLC, PC]
    precision: "exact string transform"

  - name: name_similarity_score
    trigger: "shared by duplicate_vendor_detection and sanctions_screening"
    algorithm: weighted_scoring
    formula: |
      a = vendor_name_normalization(name_a); b = vendor_name_normalization(name_b)
      T(s) = set of character trigrams of s ({s} itself when length(s) < 3)
      score = 2 * |T(a) INTERSECT T(b)| / (|T(a)| + |T(b)|)
      If a == b exactly, score = 1.0000 (exact path, no trigram math)
    input_set: "two raw name strings"
    constants:
      SCORE_DECIMALS: 4
    precision: "4 decimal places, round_half_up"

  - name: duplicate_vendor_detection
    trigger: "POST /vendors (create time only; never re-run on PATCH or approve)"
    algorithm: threshold
    formula: |
      candidates = vendors with status NOT IN {MERGED, REJECTED, DEACTIVATED}
      strict: if any candidate.tax_id == new.tax_id -> ERR_DUPLICATE_TAX_ID
      relaxed: score = max over candidates of name_similarity_score(new legal_name,
                 candidate legal_name) and (candidate dba_name when present)
      if score >= DUP_HARD_BLOCK_THRESHOLD -> ERR_DUPLICATE_VENDOR_HARD_BLOCK
      elif score >= DUP_REVIEW_THRESHOLD and duplicate_acknowledged != true
        -> ERR_DUPLICATE_VENDOR_REVIEW_REQUIRED
      elif score >= DUP_REVIEW_THRESHOLD -> create with duplicate_review_required = true
      else create with duplicate_review_required = false
    input_set: "new vendor fields vs all non-terminal vendors"
    constants:
      DUP_HARD_BLOCK_THRESHOLD: 0.9000
      DUP_REVIEW_THRESHOLD: 0.7500
    precision: "thresholds compared against the 4dp rounded score (>= semantics)"
    variants:
      - name: strict
        when: "tax_id equality and exact normalized-name equality leg"
        difference: "flags only exact collisions; a one-character typo name with a different tax_id passes strict cleanly"
      - name: relaxed
        when: "trigram Dice leg (the enforcement variant at create)"
        difference: "catches typo-squats at >= 0.9000, so identical input produces a hard block where strict produced no match"

  - name: sanctions_screening
    trigger: "vendor approve, vendor reactivate, vendor PATCH of legal_name while ACTIVE|SUSPENDED (setup variant); POST /payment-runs/{id}/invoices (payment variant)"
    algorithm: threshold
    formula: |
      entries = WatchlistEntry where status == ACTIVE
      for each entry: s = name_similarity_score(vendor legal_name, entry name_pattern)
      best = entry with max s (tie-break: entry.created_at ASC)
      if best s == 1.0000 and best severity == BLOCK -> result HIT
      elif best s == 1.0000 (severity REVIEW) -> result REVIEW
      elif best s >= SCREEN_FUZZY_THRESHOLD -> result REVIEW
      else -> result CLEAR
      Always persist a ScreeningCheck row (subject, match_score = best s, matched entry when not CLEAR).
    input_set: "vendor legal_name vs ACTIVE watchlist entries at the moment of screening"
    constants:
      SCREEN_FUZZY_THRESHOLD: 0.8000
    precision: "score 4dp round_half_up; >= threshold semantics"
    variants:
      - name: setup_screening
        when: "vendor lifecycle transitions (approve / reactivate / name PATCH)"
        difference: "evaluated against the watchlist as of that transition; CLEAR then does NOT immunize against later entries"
      - name: payment_screening
        when: "adding an invoice to a payment run (subject_type PAYMENT)"
        difference: "re-evaluated against the CURRENT ACTIVE watchlist; an entry created after vendor approval flips the same vendor from CLEAR to REVIEW/HIT at payment time"

  - name: invoice_approval_routing
    trigger: "invoice submit and resubmit (snapshot onto invoice.required_tier)"
    algorithm: threshold
    formula: |
      rules = ApprovalMatrixRule with status == ACTIVE
      scope = rules with cost_center == invoice.cost_center; if empty, scope = rules with cost_center == GLOBAL
      rule = the unique scope rule with min_amount_cents <= amount_cents and
             (max_amount_cents is null or amount_cents < max_amount_cents)
      if no rule -> ERR_NO_APPROVAL_RULE
      base = rule.tier
      bump_new_vendor = 1 if (vendor.first_activated_at set and submit_time < first_activated_at + NEW_VENDOR_DAYS) else 0
      bump_recent_bank = 1 if (vendor primary VERIFIED account exists and submit_time < verified_at + BANK_RECENT_HOURS) else 0
      required_tier = min(base + bump_new_vendor + bump_recent_bank, MAX_TIER)
      TIER_ROLE = {1: APSupervisor, 2: APManager, 3: Controller}
    input_set: "invoice amount/cost_center, vendor activation and bank verification timestamps at submit time"
    constants:
      NEW_VENDOR_DAYS: 30
      BANK_RECENT_HOURS: 72
      MAX_TIER: 3
    precision: "integer tiers; strict < for bump windows (exactly 30 days old => no bump); bracket bounds [min inclusive, max exclusive)"

  - name: invoice_pay_amount
    trigger: "provisional: final-tier invoice approval; final: POST /payment-runs/{id}/invoices (add time)"
    algorithm: threshold
    formula: |
      window_end = invoice.received_date + vendor.discount_window_days (date arithmetic, inclusive)
      provisional (at approve): applies if current logical DATE <= window_end
      final (at run add): applies if run.scheduled_date <= window_end
      discount_cents = round_half_up(invoice.amount_cents * vendor.early_pay_discount_pct) when applies, else 0
      provisional result is stored on invoice.provisional_discount_cents
      final result is stored on payment.discount_applied_cents
    input_set: "single invoice + vendor discount config + date reference"
    constants: {}
    precision: "whole cents, round_half_up, per single invoice (never batched before rounding)"
    variants:
      - name: provisional
        when: "final-tier approval; date reference = logical clock date at approval"
        difference: "answers 'would the discount apply if we paid today' — approves optimistically inside the window"
      - name: final
        when: "payment run add; date reference = run.scheduled_date"
        difference: "a run scheduled past window_end yields discount_applied_cents == 0 on the SAME invoice whose provisional snapshot was non-zero"

  - name: payment_run_totals
    trigger: "payment add, payment void, run compile, run void, block cascade"
    algorithm: aggregation
    formula: |
      per payment (set at add time):
        discount_applied_cents = invoice_pay_amount final variant (rounded per payment)
        fee_cents = WIRE_FEE_CENTS if run.payment_method == WIRE else 0
        net_amount_cents = amount_cents - discount_applied_cents + fee_cents
      run.total_amount_cents = SUM(net_amount_cents) over payments with status != VOIDED
      run.item_count = COUNT(payments with status != VOIDED)
      ROUNDING ORDER IS PINNED: round each payment's discount to whole cents FIRST,
      then sum the net amounts. Sum-then-round is FORBIDDEN (it diverges by cents).
    input_set: "payments of the run with status != VOIDED"
    constants:
      WIRE_FEE_CENTS: 2500
    precision: "whole cents, round_half_up per payment line, then integer sum"

  - name: dormancy_evaluation
    trigger: "POST /vendor-sweeps/run"
    algorithm: threshold
    formula: |
      for each vendor status == ACTIVE:
        reference = last_payment_cleared_at if set else first_activated_at
        if reference set and now - reference >= DORMANCY_DAYS
           and no invoices in {RECEIVED, PENDING_APPROVAL, APPROVED, IN_PAYMENT_RUN, ON_HOLD}:
          -> DORMANT, dormant_since_at = now
      for each vendor status == DORMANT:
        if now - dormant_since_at >= DORMANT_DEACTIVATE_DAYS
           and the same no-open-invoices gate holds:
          -> DEACTIVATED
    input_set: "vendors in ACTIVE and DORMANT at sweep time"
    constants:
      DORMANCY_DAYS: 180
      DORMANT_DEACTIVATE_DAYS: 90
    precision: ">= boundary semantics (exactly 180 days dormant-eligible => DORMANT)"

  - name: callback_attempt_policy
    trigger: "failed confirm-verification call; vendor sweep for expiry"
    algorithm: threshold
    formula: |
      on code mismatch: attempts += 1
        if attempts < CALLBACK_MAX_ATTEMPTS -> ERR_CALLBACK_CODE_MISMATCH
        else -> verification LOCKED, parent account REJECTED, error ERR_CALLBACK_LOCKED
      expiry: verification PENDING and now > expires_at (strict) -> EXPIRED, account REJECTED
      expires_at is fixed at creation = created_at + CALLBACK_EXPIRY_HOURS
    input_set: "the account's latest CallbackVerification"
    constants:
      CALLBACK_MAX_ATTEMPTS: 3
      CALLBACK_EXPIRY_HOURS: 48
    precision: "strict > for expiry (at exactly expires_at the verification is still confirmable)"

  - name: daily_release_limit
    trigger: "POST /payment-runs/{id}/release"
    algorithm: threshold
    formula: |
      today = logical UTC date at release
      committed = SUM(total_amount_cents) over PaymentRun with status IN {RELEASED, CLOSED}
                  and released_at on `today`
      allowed iff committed + candidate.total_amount_cents <= TREASURY_DAILY_LIMIT_CENTS
    input_set: "runs released on the same logical UTC date"
    constants:
      TREASURY_DAILY_LIMIT_CENTS: 10000000
    precision: "<= boundary (landing exactly on the limit is allowed; one cent over is rejected)"

  - name: document_validity
    trigger: "vendor submit gate; payment-run add gate; vendor sweep (cache update)"
    algorithm: threshold
    formula: |
      live_valid(doc, today) = doc.status == VALID and doc.valid_from <= today <= doc.valid_until
      A vendor passes the W9 gate iff at least one doc of type W9 is live_valid.
      Business gates ALWAYS use live evaluation; doc.status == EXPIRED is a sweep-maintained
      cache and a stale VALID row whose window has passed still fails live checks
      (ERR_DOCUMENT_EXPIRED at payment add, ERR_REQUIRED_DOCUMENT_MISSING at vendor submit
      when no W9 exists at all).
    input_set: "documents of one vendor vs current logical date (or run scheduled context date = today at add time)"
    constants: {}
    precision: "both bounds INCLUSIVE (valid_until == today => still valid)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed on the endpoint; on invoice approve/reject the caller role must also equal TIER_ROLE[tier]", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body parses; required fields present; enums valid; amount_cents > 0; min_amount_cents >= 0; tax_id not present in PATCH /vendors; valid_from <= valid_until", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: state, check: "expected_vendor_version equals the vendor's current version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /vendors/{id}, POST /vendors/{id}/bank-accounts, POST /vendors/{id}/merge" }
  - { priority: 6, category: state, check: "Target resource is in a from-state of the requested transition (includes already-terminal guards and edit-window states)", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all transition endpoints, PATCH /invoices/{id}, PATCH /vendors/{id}" }
  - { priority: 7, category: state, check: "Callback verification LOCKED", error_id: ERR_CALLBACK_LOCKED, http_status: 409, applies_to: "POST /bank-accounts/{id}/confirm-verification" }
  - { priority: 8, category: state, check: "Callback verification EXPIRED", error_id: ERR_CALLBACK_EXPIRED, http_status: 409, applies_to: "POST /bank-accounts/{id}/confirm-verification" }
  - { priority: 9, category: state, check: "Positive-pay ack targets a payment already CLEARED or VOIDED", error_id: ERR_PAYMENT_ALREADY_TERMINAL, http_status: 409, applies_to: "POST /payment-runs/{id}/positive-pay-acks" }
  - { priority: 10, category: business_safety, check: "Vendor status == BLOCKED blocks invoice creation and payment-run adds", error_id: ERR_VENDOR_BLOCKED, http_status: 409, applies_to: "POST /invoices, POST /payment-runs/{id}/invoices" }
  - { priority: 11, category: business_safety, check: "Vendor has an OPEN SanctionsReviewCase, or fresh payment-time screening returns REVIEW (vendor auto-suspends and a case opens as a side effect)", error_id: ERR_SANCTIONS_REVIEW_PENDING, http_status: 409, applies_to: "POST /payment-runs/{id}/invoices" }
  - { priority: 12, category: business_safety, check: "tax_id already exists on a non-terminal vendor", error_id: ERR_DUPLICATE_TAX_ID, http_status: 409, applies_to: "POST /vendors" }
  - { priority: 13, category: business_safety, check: "duplicate_vendor_detection relaxed score >= 0.9000", error_id: ERR_DUPLICATE_VENDOR_HARD_BLOCK, http_status: 409, applies_to: "POST /vendors" }
  - { priority: 14, category: business_safety, check: "relaxed score in [0.7500, 0.9000) and duplicate_acknowledged != true", error_id: ERR_DUPLICATE_VENDOR_REVIEW_REQUIRED, http_status: 409, applies_to: "POST /vendors" }
  - { priority: 15, category: business_safety, check: "SoD-1: vendor approver must differ from vendor creator", error_id: ERR_SOD_VENDOR_CREATOR_CANNOT_APPROVE, http_status: 403, applies_to: "POST /vendors/{id}/approve" }
  - { priority: 16, category: business_safety, check: "SoD-2: invoice approver must differ from the submitter of the current round", error_id: ERR_SOD_INVOICE_SUBMITTER_CANNOT_APPROVE, http_status: 403, applies_to: "POST /invoices/{id}/approve" }
  - { priority: 17, category: business_safety, check: "SoD-5: one user may approve at most one tier per round", error_id: ERR_SOD_SAME_APPROVER_TWO_TIERS, http_status: 403, applies_to: "POST /invoices/{id}/approve" }
  - { priority: 18, category: business_safety, check: "SoD-4a: run approver must differ from run creator", error_id: ERR_SOD_RUN_CREATOR_CANNOT_APPROVE, http_status: 403, applies_to: "POST /payment-runs/{id}/approve" }
  - { priority: 19, category: business_safety, check: "SoD-4b: run releaser must differ from run creator", error_id: ERR_SOD_RUN_CREATOR_CANNOT_RELEASE, http_status: 403, applies_to: "POST /payment-runs/{id}/release" }
  - { priority: 20, category: business_safety, check: "SoD-3: callback confirmer must differ from the bank account requester", error_id: ERR_SOD_CALLBACK_REQUESTER_CANNOT_CONFIRM, http_status: 403, applies_to: "POST /bank-accounts/{id}/confirm-verification" }
  - { priority: 21, category: business_constraint, check: "Vendor must be ACTIVE (invoice create/submit/resubmit; run add)", error_id: ERR_VENDOR_NOT_ACTIVE, http_status: 409, applies_to: "POST /invoices, POST /invoices/{id}/submit, POST /invoices/{id}/resubmit, POST /payment-runs/{id}/invoices" }
  - { priority: 22, category: business_constraint, check: "Vendor submit requires a live-valid W9 (none on file at all)", error_id: ERR_REQUIRED_DOCUMENT_MISSING, http_status: 409, applies_to: "POST /vendors/{id}/submit" }
  - { priority: 23, category: business_constraint, check: "Same-vendor same-doc_type document windows are CLOSED intervals and must not overlap (a shared endpoint day is an overlap)", error_id: ERR_DOCUMENT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /vendors/{id}/documents" }
  - { priority: 24, category: business_constraint, check: "Same-cost_center ACTIVE matrix rules must not overlap on half-open [min, max); adjacency allowed", error_id: ERR_RULE_RANGE_OVERLAP, http_status: 409, applies_to: "POST /approval-matrix-rules" }
  - { priority: 25, category: business_constraint, check: "Merge gate: source in {DRAFT, PENDING_APPROVAL, ACTIVE, SUSPENDED, DORMANT}; target ACTIVE; source != target; no payments of either vendor in {PENDING, RELEASED}; no OPEN case on either; re-pointing must not collide invoice_number on the survivor", error_id: ERR_VENDOR_NOT_MERGEABLE, http_status: 409, applies_to: "POST /vendors/{id}/merge" }
  - { priority: 26, category: business_constraint, check: "invoice_approval_routing finds no matching ACTIVE rule (cost_center scope then GLOBAL)", error_id: ERR_NO_APPROVAL_RULE, http_status: 409, applies_to: "POST /invoices/{id}/submit, POST /invoices/{id}/resubmit" }
  - { priority: 27, category: business_constraint, check: "approve/reject tier must equal next pending tier (skip-ahead)", error_id: ERR_APPROVAL_TIER_OUT_OF_ORDER, http_status: 409, applies_to: "POST /invoices/{id}/approve, POST /invoices/{id}/reject" }
  - { priority: 28, category: business_constraint, check: "invoice_number unique per vendor among non-CANCELLED invoices", error_id: ERR_DUPLICATE_INVOICE_NUMBER, http_status: 409, applies_to: "POST /invoices, PATCH /invoices/{id}" }
  - { priority: 29, category: business_constraint, check: "Vendor has a primary VERIFIED bank account", error_id: ERR_BANK_ACCOUNT_NOT_VERIFIED, http_status: 409, applies_to: "POST /payment-runs/{id}/invoices" }
  - { priority: 30, category: business_constraint, check: "Disable blocked while payments in {PENDING, RELEASED} reference the account", error_id: ERR_BANK_ACCOUNT_IN_USE, http_status: 409, applies_to: "POST /bank-accounts/{id}/disable" }
  - { priority: 31, category: business_constraint, check: "Reinstate blocked while an OPEN SanctionsReviewCase references the vendor", error_id: ERR_VENDOR_HAS_OPEN_CASE, http_status: 409, applies_to: "POST /vendors/{id}/reinstate" }
  - { priority: 32, category: business_constraint, check: "Deactivate blocked while invoices occupy {RECEIVED, PENDING_APPROVAL, APPROVED, IN_PAYMENT_RUN, ON_HOLD}", error_id: ERR_VENDOR_HAS_OPEN_INVOICES, http_status: 409, applies_to: "POST /vendors/{id}/deactivate" }
  - { priority: 33, category: business_constraint, check: "Compile requires item_count >= 1", error_id: ERR_EMPTY_PAYMENT_RUN, http_status: 409, applies_to: "POST /payment-runs/{id}/compile" }
  - { priority: 34, category: business_constraint, check: "verification_code mismatch (increments attempts; locks at 3)", error_id: ERR_CALLBACK_CODE_MISMATCH, http_status: 409, applies_to: "POST /bank-accounts/{id}/confirm-verification" }
  - { priority: 35, category: business_temporal, check: "Bank cooling-off: now >= primary account verified_at + BANK_RECENT_HOURS", error_id: ERR_BANK_CHANGE_COOLING_OFF, http_status: 409, applies_to: "POST /payment-runs/{id}/invoices" }
  - { priority: 36, category: business_temporal, check: "Vendor has a live-valid W9 at add time; a W9 exists but its window has passed", error_id: ERR_DOCUMENT_EXPIRED, http_status: 409, applies_to: "POST /payment-runs/{id}/invoices" }
  - { priority: 37, category: business_temporal, check: "Every payment's bank snapshot still matches the vendor's current primary (id and version)", error_id: ERR_BANK_SNAPSHOT_STALE, http_status: 409, applies_to: "POST /payment-runs/{id}/release" }
  - { priority: 38, category: business_fiscal, check: "daily_release_limit over runs released the same logical UTC date", error_id: ERR_DAILY_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /payment-runs/{id}/release" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving / ops ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (never wall-clock)."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock = to_iso8601"]

  - method: POST
    path: "/vendor-sweeps/run"
    description: "Ops-run checkpoint: dormancy_evaluation, DORMANT->DEACTIVATED, document EXPIRED cache update, callback verification expiry cascade"
    roles: [SystemAdmin]
    code: 200
    input: []
    output: { vendors_marked_dormant: integer, vendors_deactivated: integer, documents_expired: integer, callback_verifications_expired: integer }
    side_effects: ["dormancy_evaluation", "document EXPIRED sweep", "callback_attempt_policy expiry leg (verification EXPIRED -> account REJECTED)"]

  # --- vendors ---
  - method: POST
    path: "/vendors"
    description: "Create a vendor in DRAFT; runs duplicate_vendor_detection (strict tax_id leg, then relaxed trigram band)"
    roles: [VendorSpecialist, VendorManager]
    code: 201
    input: [legal_name, tax_id, remit_email, phone, address_line1, city, country, "dba_name?", "payment_terms_days?", "early_pay_discount_pct?", "discount_window_days?", "duplicate_acknowledged?"]
    output: Vendor
    side_effects: ["status=DRAFT, created_by_user_id=caller", "duplicate_vendor_detection", "AuditEvent CREATE"]

  - method: GET
    path: "/vendors"
    description: "List vendors with filters"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["status?", "name_contains?", "merged_into_vendor_id?", "primary_bank_account_id?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: PATCH
    path: "/vendors/{id}"
    description: "Update vendor master data (OCC). Editable only while status IN {DRAFT, PENDING_APPROVAL, ACTIVE, SUSPENDED, DORMANT} (else ERR_INVALID_STATE_TRANSITION). legal_name change while ACTIVE|SUSPENDED re-runs sanctions_screening and may SUSPEND (case) or BLOCK (cascade)."
    roles: [VendorSpecialist]
    code: 200
    input: [expected_vendor_version, "legal_name?", "dba_name?", "remit_email?", "phone?", "address_line1?", "city?", "country?", "payment_terms_days?", "early_pay_discount_pct?", "discount_window_days?"]
    output: Vendor
    side_effects: ["increments Vendor.version by 1", "AuditEvent UPDATE per changed field", "conditional sanctions_screening setup variant"]

  - method: POST
    path: "/vendors/{id}/submit"
    description: "DRAFT -> PENDING_APPROVAL (requires live-valid W9)"
    roles: [VendorSpecialist, VendorManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/vendors/{id}/approve"
    description: "Approve vendor; inline sanctions_screening routes to ACTIVE / SUSPENDED(+case) / BLOCKED"
    roles: [VendorManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["sanctions_screening setup variant", "first_activated_at on CLEAR", "AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/vendors/{id}/reject"
    description: "DRAFT|PENDING_APPROVAL -> REJECTED"
    roles: [VendorManager]
    code: 200
    input: [reason]
    output: Vendor
    side_effects: ["AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/vendors/{id}/suspend"
    description: "ACTIVE -> SUSPENDED with invoice hold cascade"
    roles: [VendorManager, ComplianceOfficer]
    code: 200
    input: [reason]
    output: Vendor
    side_effects: ["hold invoices in {PENDING_APPROVAL, APPROVED}", "AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/vendors/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE with resume cascade; blocked while an OPEN case exists"
    roles: [VendorManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["resume ON_HOLD invoices to pre_hold_status", "AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/vendors/{id}/reactivate"
    description: "DORMANT -> re-screen -> ACTIVE / SUSPENDED(+case) / BLOCKED"
    roles: [VendorManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["sanctions_screening setup variant", "AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/vendors/{id}/deactivate"
    description: "ACTIVE|SUSPENDED|DORMANT -> DEACTIVATED (no open invoices or in-flight payments)"
    roles: [VendorManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["AuditEvent STATUS_CHANGE"]

  - method: POST
    path: "/vendors/{id}/merge"
    description: "Absorb duplicate_vendor_id into this (survivor) vendor; OCC on survivor version"
    roles: [VendorManager]
    code: 200
    input: [duplicate_vendor_id, expected_vendor_version]
    output: VendorMergeRecord
    side_effects:
      - "increments survivor Vendor.version by 1"
      - "source vendor -> MERGED (merged_into_vendor_id = survivor)"
      - "non-terminal invoices re-pointed; source bank accounts DISABLED; VendorMergeRecord persisted; AuditEvent MERGE on both"

  - method: GET
    path: "/vendor-merge-records"
    description: "List merge records"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["survivor_vendor_id?", "merged_vendor_id?", "limit?", "offset?"]
    output: VendorMergeRecord[]
    side_effects: []

  - method: GET
    path: "/vendor-merge-records/{id}"
    description: "Get one merge record"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: VendorMergeRecord
    side_effects: []

  # --- bank accounts & callbacks ---
  - method: POST
    path: "/vendors/{id}/bank-accounts"
    description: "Add a bank account (OCC on vendor); vendor status must be IN {DRAFT, PENDING_APPROVAL, ACTIVE, SUSPENDED} (else ERR_INVALID_STATE_TRANSITION); spawns a CallbackVerification addressed to the vendor's known phone contact"
    roles: [VendorSpecialist]
    code: 201
    input: [account_number, routing_number, account_holder_name, "is_primary?", expected_vendor_version]
    output: VendorBankAccount
    side_effects: ["increments Vendor.version by 1", "CallbackVerification PENDING created (code minted, expires_at = now + 48h)", "AuditEvent CREATE"]

  - method: GET
    path: "/vendors/{id}/bank-accounts"
    description: "List a vendor's bank accounts"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VendorBankAccount[]
    side_effects: []

  - method: GET
    path: "/bank-accounts/{id}"
    description: "Get a bank account"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: VendorBankAccount
    side_effects: []

  - method: POST
    path: "/bank-accounts/{id}/confirm-verification"
    description: "Confirm the callback code; success VERIFIED the account and applies primary supersede"
    roles: [VendorSpecialist, VendorManager]
    code: 200
    input: [verification_code]
    output: VendorBankAccount
    side_effects: ["callback_attempt_policy", "primary supersede: old primary VERIFIED -> SUPERSEDED, vendor.primary_bank_account_id updated (Vendor.version +1 when primary changes)", "AuditEvent VERIFY"]

  - method: POST
    path: "/bank-accounts/{id}/disable"
    description: "VERIFIED -> DISABLED (blocked while in use by in-flight payments)"
    roles: [VendorManager]
    code: 200
    input: []
    output: VendorBankAccount
    side_effects: ["clears vendor.primary_bank_account_id when applicable (Vendor.version +1)", "AuditEvent STATUS_CHANGE"]

  - method: GET
    path: "/bank-accounts/{id}/callback-verifications"
    description: "List callback verifications for an account (exposes verification_code for the simulated callback)"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CallbackVerification[]
    side_effects: []

  # --- documents ---
  - method: POST
    path: "/vendors/{id}/documents"
    description: "Attach a compliance document; closed-interval overlap gate per (vendor, doc_type)"
    roles: [VendorSpecialist]
    code: 201
    input: [doc_type, valid_from, valid_until]
    output: VendorDocument
    side_effects: ["AuditEvent CREATE"]

  - method: GET
    path: "/vendors/{id}/documents"
    description: "List a vendor's documents"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["doc_type?", "status?", "limit?", "offset?"]
    output: VendorDocument[]
    side_effects: []

  - method: POST
    path: "/documents/{id}/supersede"
    description: "VALID -> SUPERSEDED"
    roles: [VendorSpecialist]
    code: 200
    input: []
    output: VendorDocument
    side_effects: ["AuditEvent STATUS_CHANGE"]

  # --- watchlist & screening ---
  - method: POST
    path: "/watchlist-entries"
    description: "Create an ACTIVE watchlist entry"
    roles: [ComplianceOfficer]
    code: 201
    input: [name_pattern, severity, list_source]
    output: WatchlistEntry
    side_effects: ["AuditEvent CREATE"]

  - method: POST
    path: "/watchlist-entries/{id}/retire"
    description: "ACTIVE -> RETIRED (changes future screening outcomes)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: WatchlistEntry
    side_effects: ["AuditEvent RETIRE"]

  - method: GET
    path: "/screening-checks"
    description: "List screening checks"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["vendor_id?", "payment_id?", "matched_watchlist_entry_id?", "result?", "limit?", "offset?"]
    output: ScreeningCheck[]
    side_effects: []

  - method: GET
    path: "/screening-checks/{id}"
    description: "Get a screening check"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: ScreeningCheck
    side_effects: []

  - method: GET
    path: "/sanctions-cases"
    description: "List sanctions review cases"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: ["vendor_id?", "payment_id?", "screening_check_id?", "status?", "limit?", "offset?"]
    output: SanctionsReviewCase[]
    side_effects: []

  - method: GET
    path: "/sanctions-cases/{id}"
    description: "Get a sanctions review case"
    roles: [VendorSpecialist, VendorManager, ComplianceOfficer, APClerk, APSupervisor, APManager, Controller, TreasuryAnalyst, TreasuryManager, BankFileProcessor, Auditor, SystemAdmin]
    code: 200
    input: []
    output: SanctionsReviewCase
    side_effects: []

  - method: POST
    path: "/sanctions-cases/{id}/disposition"
    description: "Compliance disposition: CLEARED reinstates a suspended vendor; CONFIRMED_HIT blocks it (ordered block cascade)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "note?"]
