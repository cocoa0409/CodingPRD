# =============================================================================
# Task 1874: Flatbed & Specialized Heavy Haul — scaffold seed tables
# =============================================================================

scenario: |
  1874. Flatbed & Specialized Heavy Haul (heavy haul carrier): load
  dimension/weight & trailer configuration selection, route survey & bridge
  analysis, permit acquisition by state & travel-time restrictions,
  escort/pilot car requirement & booking, securement plan & tarping,
  loading/unloading crane coordination, delay/standby billing, damage &
  overweight fine responsibility

domain_name: flatbed-heavy-haul
api_prefix: /heavy-haul

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # permits, fines, securement regulation, audit trail of scale tickets
  secondary_archetype: temporal_windowing    # permit travel windows, curfew, escort/crane interval conflicts
  complexity_layers:
    - optimistic_concurrency                 # OCC on Load.version for permit filing & escort booking
    - cascading_side_effects                 # scale-ticket violation -> permit revoke -> load hold -> escort cancel
    - dual_variant_calculation               # provisional estimate vs final invoice; declared vs measured permit fee
    - rate_threshold_triggers                # escort thresholds, standby tiers, overweight fine tiers, credit breach
  entity_topology: flat                      # peer entities joined by FK references; no nested ownership tree
  state_machine_shape: branching             # Load: forward pipeline + replan loops + ON_HOLD branch; Permit: cyclic refile loops
  relationship_patterns:
    - one_to_many                            # Customer->Load, Load->Permit/EscortBooking/...
    - cross_aggregate                        # all FKs cross aggregate boundaries (flat topology)
  role_model: approval_chain                 # Dispatcher plans -> SafetyManager approves -> PermitClerk files -> StateAuthority grants -> Driver executes -> BillingClerk bills
  consistency_model: immediate               # every mutation + cascade visible in the same request's response/reads
  difficulty_calibration: |
    Expert-leaning. Endpoint count (40) exceeds the 20-32 guideline band
    deliberately: each endpoint traces to one of the eight scenario workflow
    bullets or to a difficulty-rule reachability requirement; nothing is
    padding. Difficulty is carried by the scale-violation cascade, the
    provisional-vs-final invoice divergence, and pinned validation ordering.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Shipper company name; unique per customer" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding receivables; must be > 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum of Invoice.total_cents over this customer's invoices with status ISSUED; debited on issue, credited on pay/void" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; auto-SUSPENDED when outstanding_balance_cents exceeds credit_limit_cents after an invoice issue; reinstated via POST reinstate" }

  - name: Load
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; set from X-User-ID of the creating Shipper" }
      - { name: cargo_description, type: string, source: input, description: "Free-text cargo description" }
      - { name: cargo_requires_tarp, type: boolean, source: input, default: false, description: "Whether cargo must be tarped (drives securement method validation)" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Shipper-declared gross vehicle+cargo weight; must be > 0" }
      - { name: width_in, type: integer, source: input, description: "Cargo width in whole inches; must be > 0" }
      - { name: height_in, type: integer, source: input, description: "Cargo height in whole inches (excluding trailer deck); must be > 0" }
      - { name: length_in, type: integer, source: input, description: "Cargo length in whole inches; must be > 0" }
      - { name: origin, type: string, source: input, description: "Origin city/state free text" }
      - { name: destination, type: string, source: input, description: "Destination city/state free text" }
      - { name: declared_value_cents, type: integer, source: input, default: 0, description: "Declared cargo value; must be >= 0" }
      - { name: trailer_type, type: enum, source: input, description: "Set by plan: FLATBED | STEP_DECK | RGN_LOWBOY | EXTENDABLE_DOUBLE_DROP; capacity/deck-height/rate looked up in TRAILER_CATALOG constants" }
      - { name: trailer_axle_count, type: integer, source: input, description: "Set by plan: axle count of the configured trailer; must be >= 2" }
      - { name: driver_name, type: string, source: input, description: "Set by plan: assigned driver name" }
      - { name: driver_oversize_endorsed, type: boolean, source: input, description: "Set by plan: whether assigned driver holds oversize endorsement" }
      - { name: overall_height_in, type: integer, source: computed, description: "= height_in + TRAILER_CATALOG[trailer_type].deck_height_in; null until planned" }
      - { name: is_oversize, type: boolean, source: computed, description: "width_in > 102 OR height_in > 162 OR length_in > 636" }
      - { name: is_overweight, type: boolean, source: computed, description: "gross_weight_lbs > 80000" }
      - { name: is_superload, type: boolean, source: computed, description: "gross_weight_lbs > 150000 OR width_in > 192" }
      - { name: required_axles, type: integer, source: computed, description: "= max(2, ceil(gross_weight_lbs / 20000))" }
      - { name: required_escort_positions, type: array, source: computed, description: "Derived at plan: width_in >= 168 -> [FRONT, REAR]; 144 <= width_in < 168 -> [REAR]; else []; plus POLE_FRONT appended if overall_height_in >= 192" }
      - { name: route_miles, type: integer, source: input, description: "Set by survey: surveyed route miles; must be > 0" }
      - { name: states_crossed, type: array, source: input, description: "Set by survey: ordered list of two-letter state codes the route crosses; must be non-empty, values drawn from {CA, NV, AZ, TX, OR}" }
      - { name: min_bridge_clearance_in, type: integer, source: input, description: "Set by survey: lowest bridge/overpass clearance on route; must be > 0" }
      - { name: max_bridge_weight_lbs, type: integer, source: input, description: "Set by survey: lowest bridge weight rating on route; must be > 0" }
      - { name: survey_result, type: enum, source: system, description: "PASSED | FAILED | null until first survey; PASSED iff overall_height_in + 6 <= min_bridge_clearance_in AND gross_weight_lbs <= max_bridge_weight_lbs" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLANNED | SURVEYED | CLEARED | ON_HOLD | IN_TRANSIT | DELIVERED | CANCELLED" }
      - { name: hold_reason, type: enum, source: system, description: "SCALE_OVERWEIGHT | null; set when scale-violation cascade places load ON_HOLD" }

  - name: SecurementPlan
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: method, type: enum, source: input, description: "CHAINS | STRAPS | CHAINS_AND_TARPS" }
      - { name: tiedown_count, type: integer, source: input, description: "Number of tiedowns/chains; must be >= 2" }
      - { name: wll_per_tiedown_lbs, type: integer, source: input, description: "Working load limit per tiedown; must be > 0" }
      - { name: aggregate_wll_lbs, type: integer, source: computed, description: "= tiedown_count * wll_per_tiedown_lbs" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED; created directly in SUBMITTED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: state_code, type: enum, source: input, description: "CA | NV | AZ | TX | OR" }
      - { name: permit_type, type: enum, source: input, description: "OVERSIZE | OVERWEIGHT | SUPERLOAD" }
      - { name: weight_basis_lbs, type: integer, source: computed, description: "Weight the fee was computed on: declared gross_weight_lbs, or latest ScaleTicket.measured_gross_lbs when a scale ticket exists at (re)filing time" }
      - { name: fee_cents, type: integer, source: computed, description: "Permit fee per permit_fee calculation; computed at every DRAFT->FILED / DENIED->FILED / REVOKED->FILED transition" }
      - { name: travel_window_start, type: datetime, source: input, description: "Set at grant: earliest legal travel instant (ISO 8601 UTC)" }
      - { name: travel_window_end, type: datetime, source: input, description: "Set at grant: latest legal travel instant; must be > travel_window_start" }
      - { name: denial_reason, type: string, source: input, description: "Set at deny: free-text reason" }
      - { name: status, type: enum, source: system, description: "DRAFT | FILED | GRANTED | DENIED | REVOKED | EXPIRED | WITHDRAWN" }

  - name: EscortBooking
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: provider_name, type: string, source: input, description: "Pilot-car provider identifier; calendar resource for overlap checks" }
      - { name: position, type: enum, source: input, description: "FRONT | REAR | POLE_FRONT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Booking window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Booking window end; must be > scheduled_start" }
      - { name: scheduled_minutes, type: integer, source: computed, description: "= (scheduled_end - scheduled_start) in whole minutes" }
      - { name: rate_per_hour_cents, type: integer, source: input, description: "Booked hourly rate; must be > 0" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | COMPLETED | CANCELLED; created directly in CONFIRMED" }

  - name: CraneAppointment
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: site, type: enum, source: input, description: "ORIGIN | DESTINATION" }
      - { name: crane_id, type: string, source: input, description: "Crane resource identifier; calendar resource for buffered overlap checks" }
      - { name: window_start, type: datetime, source: input, description: "Lift window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Lift window end; must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED; created directly in SCHEDULED" }

  - name: DelayEvent
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: kind, type: enum, source: input, description: "CUSTOMER_DELAY | CARRIER_DELAY | WEATHER; only CUSTOMER_DELAY is billable" }
      - { name: started_at, type: datetime, source: input, description: "Delay start (ISO 8601 UTC)" }
      - { name: ended_at, type: datetime, source: input, description: "Delay end; must be > started_at" }
      - { name: duration_minutes, type: integer, source: computed, description: "= (ended_at - started_at) in whole minutes" }
      - { name: billable_minutes, type: integer, source: computed, description: "= max(0, duration_minutes - 120) when kind == CUSTOMER_DELAY, else 0" }
      - { name: standby_amount_cents, type: integer, source: computed, description: "Tiered standby charge per standby_billing calculation; 0 for non-customer delays" }

  - name: ScaleTicket
    parent: null
    common_fields: false   # immutable append-only event: id + created_at only
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: measured_gross_lbs, type: integer, source: input, description: "Certified scale reading of gross weight; must be > 0" }
      - { name: weighed_at, type: datetime, source: input, description: "When the weighing occurred (ISO 8601 UTC)" }
      - { name: excess_lbs, type: integer, source: computed, description: "= max(0, measured_gross_lbs - Load.gross_weight_lbs) at recording time" }
      - { name: is_violation, type: boolean, source: computed, description: "true iff measured_gross_lbs * 100 > Load.gross_weight_lbs * 103 (3% tolerance, integer-exact)" }

  - name: Fine
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: kind, type: enum, source: input, description: "OVERWEIGHT | DAMAGE | PERMIT_VIOLATION; OVERWEIGHT is system-created only (via scale-ticket cascade)" }
      - { name: amount_cents, type: integer, source: input, description: "Fine amount; input for DAMAGE/PERMIT_VIOLATION, system-computed for OVERWEIGHT (overweight_fine calculation); must be > 0" }
      - { name: description, type: string, source: input, description: "Free-text description of damage or violation" }
      - { name: liable_party, type: enum, source: computed, description: "CUSTOMER | CARRIER; default CUSTOMER for OVERWEIGHT, CARRIER for DAMAGE and PERMIT_VIOLATION; overwritten by resolve" }
      - { name: status, type: enum, source: system, description: "PENDING | DISPUTED | RESOLVED_CUSTOMER_LIABLE | RESOLVED_CARRIER_LIABLE | APPLIED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: load_id, type: string, source: system, description: "FK -> Load.id; owning load" }
      - { name: linehaul_cents, type: integer, source: computed, description: "= route_miles * TRAILER_CATALOG[trailer_type].cost_per_mile_cents" }
      - { name: permits_cents, type: integer, source: computed, description: "= sum of fee_cents over the load's permits with status GRANTED" }
      - { name: escorts_cents, type: integer, source: computed, description: "= sum over COMPLETED escort bookings of round_half_up(scheduled_minutes * rate_per_hour_cents / 60), each booking rounded before summing" }
      - { name: standby_cents, type: integer, source: computed, description: "= sum of standby_amount_cents over the load's delay events" }
      - { name: fines_cents, type: integer, source: computed, description: "= sum of amount_cents over the load's fines with liable_party CUSTOMER and status in {PENDING, RESOLVED_CUSTOMER_LIABLE}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "= linehaul_cents + permits_cents + escorts_cents + standby_cents + fines_cents" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "= round_half_up(subtotal_cents * 0.12) when subtotal_cents >= 5000000, else round_half_up(subtotal_cents * 0.08); tier keys on the pre-surcharge subtotal" }
      - { name: total_cents, type: integer, source: computed, description: "= subtotal_cents + fuel_surcharge_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | VOID; created directly in ISSUED (snapshot of line items at creation)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when an invoice issue pushes outstanding_balance_cents above credit_limit_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "POST /heavy-haul/loads for this customer starts failing with ERR_CUSTOMER_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /heavy-haul/customers/{id}/reinstate
        actor: BillingClerk
        preconditions:
          - "Customer must be SUSPENDED (ERR_INVALID_STATE)"
          - "outstanding_balance_cents <= credit_limit_cents (ERR_REINSTATE_NOT_ALLOWED)"
        side_effects: []

  - entity: Load
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: POST /heavy-haul/loads/{id}/plan
        actor: Dispatcher
        preconditions:
          - "Load must be DRAFT, PLANNED, or SURVEYED (ERR_LOAD_INVALID_STATE)"
          - "TRAILER_CATALOG[trailer_type].max_payload_lbs >= gross_weight_lbs (ERR_TRAILER_CAPACITY_EXCEEDED)"
          - "trailer_axle_count >= required_axles (ERR_AXLE_COUNT_INSUFFICIENT)"
          - "If is_oversize OR is_overweight: driver_oversize_endorsed must be true (ERR_DRIVER_NOT_ENDORSED)"
        side_effects:
          - "Compute is_oversize, is_overweight, is_superload, required_axles, overall_height_in, required_escort_positions"
          - "Store trailer_type, trailer_axle_count, driver_name, driver_oversize_endorsed"
          - "Increments Load.version by 1"
      - from: PLANNED
        to: PLANNED
        trigger: POST /heavy-haul/loads/{id}/plan (re-plan with new trailer/driver)
        actor: Dispatcher
        preconditions: ["Same as DRAFT -> PLANNED"]
        side_effects: ["Same computed-field refresh as DRAFT -> PLANNED", "Increments Load.version by 1"]
      - from: SURVEYED
        to: PLANNED
        trigger: POST /heavy-haul/loads/{id}/plan (re-plan invalidates the survey because deck height/capacity may change)
        actor: Dispatcher
        preconditions: ["Same as DRAFT -> PLANNED"]
        side_effects:
          - "survey_result reset to null (stale after configuration change)"
          - "Same computed-field refresh as DRAFT -> PLANNED"
          - "Increments Load.version by 1"
      - from: PLANNED
        to: SURVEYED
        trigger: POST /heavy-haul/loads/{id}/survey with survey_result PASSED
        actor: Dispatcher
        preconditions:
          - "Load must be PLANNED or SURVEYED (ERR_LOAD_INVALID_STATE)"
        side_effects:
          - "Store route_miles, states_crossed, min_bridge_clearance_in, max_bridge_weight_lbs, survey_result"
          - "Increments Load.version by 1"
      - from: SURVEYED
        to: SURVEYED
        trigger: POST /heavy-haul/loads/{id}/survey with survey_result PASSED (re-survey of a surveyed load)
        actor: Dispatcher
        preconditions: ["Load must be PLANNED or SURVEYED (ERR_LOAD_INVALID_STATE)"]
        side_effects: ["Survey fields overwritten; permits already filed keep their computed fees", "Increments Load.version by 1"]
      - from: SURVEYED
        to: PLANNED
        trigger: POST /heavy-haul/loads/{id}/survey with survey_result FAILED
        actor: Dispatcher
        preconditions: ["Load must be PLANNED or SURVEYED (ERR_LOAD_INVALID_STATE)"]
        side_effects: ["survey_result = FAILED; load demoted for re-planning", "Increments Load.version by 1"]
        note: "PLANNED + FAILED survey stays PLANNED (same trigger, no state change beyond field store)"
      - from: SURVEYED
        to: CLEARED
        trigger: "system (automatic readiness gate, re-evaluated after every permit grant, escort booking creation, crane appointment creation, and securement approval)"
        actor: system
        preconditions:
          - "survey_result == PASSED"
          - "For every state in states_crossed: if is_superload, a GRANTED SUPERLOAD permit exists; else a GRANTED OVERSIZE permit exists if is_oversize and a GRANTED OVERWEIGHT permit exists if is_overweight (STANDARD loads need no permits)"
          - "For every position in required_escort_positions: at least one CONFIRMED EscortBooking with that position exists (POLE_FRONT counts once even if appended once)"
          - "At least one SCHEDULED CraneAppointment with site ORIGIN and at least one with site DESTINATION exist"
          - "An APPROVED SecurementPlan exists for the load"
        side_effects:
          - "status -> CLEARED"
          - "Increments Load.version by 1"
      - from: CLEARED
        to: IN_TRANSIT
        trigger: POST /heavy-haul/loads/{id}/depart
        actor: Driver
        preconditions:
          - "Load must be CLEARED (ERR_LOAD_INVALID_STATE)"
          - "Every required escort position still covered by a CONFIRMED booking (ERR_ESCORT_REQUIREMENT_UNMET)"
          - "Current logical clock within every GRANTED permit's [travel_window_start, travel_window_end]; permits whose window has passed flip to EXPIRED first (ERR_OUTSIDE_TRAVEL_WINDOW)"
          - "Current logical clock UTC hour in [5, 21) (ERR_CURFEW_VIOLATION)"
          - "cost_estimate provisional total_cents <= Customer.credit_limit_cents - Customer.outstanding_balance_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "status -> IN_TRANSIT"
          - "Increments Load.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /heavy-haul/loads/{id}/arrive
        actor: Driver
        preconditions:
          - "Load must be IN_TRANSIT (ERR_LOAD_INVALID_STATE)"
        side_effects:
          - "status -> DELIVERED"
          - "All CONFIRMED EscortBookings of this load -> COMPLETED"
          - "All SCHEDULED CraneAppointments of this load -> COMPLETED"
          - "Increments Load.version by 1"
      - from: CLEARED
        to: ON_HOLD
        trigger: "system (scale-ticket violation cascade: a ScaleTicket with is_violation true is recorded while load is CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason = SCALE_OVERWEIGHT"
          - "All CONFIRMED EscortBookings -> CANCELLED (windows freed)"
          - "Increments Load.version by 1"
      - from: IN_TRANSIT
        to: ON_HOLD
        trigger: "system (scale-ticket violation cascade while load is IN_TRANSIT)"
        actor: system
        preconditions: []
        side_effects: ["Same cascade as CLEARED -> ON_HOLD"]
      - from: ON_HOLD
        to: SURVEYED
        trigger: POST /heavy-haul/loads/{id}/release-hold
        actor: SafetyManager
        preconditions:
          - "Load must be ON_HOLD (ERR_LOAD_INVALID_STATE)"
          - "Every required (state_code, permit_type) pair again has a GRANTED permit (ERR_PERMIT_REQUIREMENT_UNMET)"
        side_effects:
          - "hold_reason = null; status -> SURVEYED"
          - "Readiness gate re-evaluated (may immediately advance to CLEARED if escorts/cranes/securement are again satisfied)"
          - "Increments Load.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /heavy-haul/loads/{id}/cancel
        actor: Shipper
        preconditions:
          - "Load must be in DRAFT, PLANNED, SURVEYED, CLEARED, or ON_HOLD (ERR_LOAD_NOT_CANCELLABLE)"
          - "Acting Shipper must own the load: X-User-ID == Load.customer_id (ERR_NOT_OWN_RESOURCE)"
        side_effects:
          - "All non-terminal Permits (DRAFT, FILED, GRANTED, DENIED, REVOKED) -> WITHDRAWN"
          - "All CONFIRMED EscortBookings -> CANCELLED"
          - "All SCHEDULED CraneAppointments -> CANCELLED"
          - "Increments Load.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /heavy-haul/loads/{id}/cancel
        actor: Shipper
        preconditions: ["Same as DRAFT -> CANCELLED"]
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: SURVEYED
        to: CANCELLED
        trigger: POST /heavy-haul/loads/{id}/cancel
        actor: Shipper
        preconditions: ["Same as DRAFT -> CANCELLED"]
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: CLEARED
        to: CANCELLED
        trigger: POST /heavy-haul/loads/{id}/cancel
        actor: Shipper
        preconditions: ["Same as DRAFT -> CANCELLED"]
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: POST /heavy-haul/loads/{id}/cancel
        actor: Shipper
        preconditions: ["Same as DRAFT -> CANCELLED"]
        side_effects: ["Same cascade as DRAFT -> CANCELLED"]

  - entity: SecurementPlan
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /heavy-haul/securement-plans/{id}/approve
        actor: SafetyManager
        preconditions:
          - "Plan must be SUBMITTED (ERR_INVALID_STATE)"
          - "aggregate_wll_lbs >= ceil(Load.gross_weight_lbs / 2) (ERR_SECUREMENT_WLL_INSUFFICIENT)"
          - "If Load.cargo_requires_tarp: method must be CHAINS_AND_TARPS (ERR_TARPING_REQUIRED)"
        side_effects:
          - "Load readiness gate re-evaluated (Load SURVEYED -> CLEARED when all conditions met)"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /heavy-haul/securement-plans/{id}/reject
        actor: SafetyManager
        preconditions:
          - "Plan must be SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []
        note: "REJECTED is terminal; a replacement plan is filed via a new POST securement-plans"

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: POST /heavy-haul/permits/{id}/file
        actor: PermitClerk
        preconditions:
          - "Permit must be DRAFT, DENIED, or REVOKED (ERR_INVALID_STATE)"
          - "Load must be SURVEYED, CLEARED, or ON_HOLD (ERR_LOAD_INVALID_STATE)"
        side_effects:
          - "fee_cents computed per permit_fee calculation (weight basis: latest ScaleTicket.measured_gross_lbs if any scale ticket exists for the load, else Load.gross_weight_lbs)"
          - "weight_basis_lbs recorded"
      - from: FILED
        to: GRANTED
        trigger: POST /heavy-haul/permits/{id}/grant
        actor: StateAuthority
        preconditions:
          - "Permit must be FILED (ERR_INVALID_STATE)"
        side_effects:
          - "travel_window_start / travel_window_end stored"
          - "Load readiness gate re-evaluated"
      - from: FILED
        to: DENIED
        trigger: POST /heavy-haul/permits/{id}/deny
        actor: StateAuthority
        preconditions:
          - "Permit must be FILED (ERR_INVALID_STATE)"
        side_effects: ["denial_reason stored"]
      - from: DENIED
        to: FILED
        trigger: POST /heavy-haul/permits/{id}/file (re-file after amendment)
        actor: PermitClerk
        preconditions: ["Same as DRAFT -> FILED"]
        side_effects: ["fee_cents recomputed per permit_fee calculation (current weight basis)"]
        note: "DENIED is NOT terminal: the refile loop is the negotiation cycle"
      - from: GRANTED
        to: REVOKED
        trigger: "system (scale-ticket violation cascade: a ScaleTicket with is_violation true revokes every GRANTED OVERWEIGHT or SUPERLOAD permit of the load; OVERSIZE permits are unaffected)"
        actor: system
        preconditions: []
        side_effects:
          - "Load (if CLEARED or IN_TRANSIT) -> ON_HOLD with hold_reason SCALE_OVERWEIGHT"
          - "That Load transition cascades: CONFIRMED escort bookings -> CANCELLED"
      - from: REVOKED
        to: FILED
        trigger: POST /heavy-haul/permits/{id}/file (re-file at measured weight)
        actor: PermitClerk
        preconditions: ["Same as DRAFT -> FILED"]
        side_effects: ["fee_cents recomputed on measured weight basis (a scale ticket now exists)"]
      - from: GRANTED
        to: EXPIRED
        trigger: "system (lazy: when the readiness gate or depart evaluates permits and the logical clock is past travel_window_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (load cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "system (load cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: WITHDRAWN
        trigger: "system (load cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DENIED
        to: WITHDRAWN
        trigger: "system (load cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVOKED
        to: WITHDRAWN
        trigger: "system (load cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EscortBooking
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (automatic when the owning load transitions IN_TRANSIT -> DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /heavy-haul/escort-bookings/{id}/cancel
        actor: Dispatcher
        preconditions:
          - "Booking must be CONFIRMED (ERR_INVALID_STATE)"
        side_effects:
          - "Provider calendar window [scheduled_start, scheduled_end) freed"
          - "Load readiness gate re-evaluated (a CLEARED load is NOT demoted; only upward transitions are automatic)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (load cancel cascade, or scale-violation hold cascade)"
        actor: system
        preconditions: []
        side_effects: ["Provider calendar window freed"]

  - entity: CraneAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (automatic when the owning load transitions IN_TRANSIT -> DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (load cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Fine
    initial_state: PENDING
    terminal_states: [RESOLVED_CARRIER_LIABLE]
    note: "RESOLVED_CUSTOMER_LIABLE and APPLIED are NOT terminal: the invoice sweep moves RESOLVED_CUSTOMER_LIABLE -> APPLIED, and void compensation moves APPLIED -> PENDING"
    transitions:
      - from: PENDING
        to: DISPUTED
        trigger: POST /heavy-haul/fines/{id}/dispute
        actor: Shipper
        preconditions:
          - "Fine must be PENDING (ERR_FINE_NOT_DISPUTABLE)"
          - "Fine.liable_party must be CUSTOMER (carrier-liable fines are absorbed, not disputed) (ERR_FINE_NOT_DISPUTABLE)"
          - "Acting Shipper must own the fine's load (ERR_NOT_OWN_RESOURCE)"
        side_effects: []
      - from: PENDING
        to: RESOLVED_CUSTOMER_LIABLE
        trigger: POST /heavy-haul/fines/{id}/resolve with resolution CUSTOMER_LIABLE
        actor: SafetyManager
        preconditions: ["Fine must be PENDING or DISPUTED (ERR_INVALID_STATE)"]
        side_effects: ["liable_party = CUSTOMER; amount_cents replaced by adjusted_amount_cents when supplied"]
      - from: PENDING
        to: RESOLVED_CARRIER_LIABLE
        trigger: POST /heavy-haul/fines/{id}/resolve with resolution CARRIER_LIABLE
        actor: SafetyManager
        preconditions: ["Fine must be PENDING or DISPUTED (ERR_INVALID_STATE)"]
        side_effects: ["liable_party = CARRIER; fine is excluded from all invoice computations"]
      - from: DISPUTED
        to: RESOLVED_CUSTOMER_LIABLE
        trigger: POST /heavy-haul/fines/{id}/resolve with resolution CUSTOMER_LIABLE
        actor: SafetyManager
        preconditions: ["Fine must be PENDING or DISPUTED (ERR_INVALID_STATE)"]
        side_effects: ["liable_party = CUSTOMER; amount_cents replaced by adjusted_amount_cents when supplied"]
      - from: DISPUTED
        to: RESOLVED_CARRIER_LIABLE
        trigger: POST /heavy-haul/fines/{id}/resolve with resolution CARRIER_LIABLE
        actor: SafetyManager
        preconditions: ["Fine must be PENDING or DISPUTED (ERR_INVALID_STATE)"]
        side_effects: ["liable_party = CARRIER"]
      - from: PENDING
        to: APPLIED
        trigger: "system (invoice creation sweeps customer-liable PENDING fines into the invoice)"
        actor: system
        preconditions: []
        side_effects: ["amount_cents included in Invoice.fines_cents"]
      - from: RESOLVED_CUSTOMER_LIABLE
        to: APPLIED
        trigger: "system (invoice creation sweeps RESOLVED_CUSTOMER_LIABLE fines into the invoice)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: PENDING
        trigger: "system (invoice void compensates: fines of a VOID invoice return to PENDING so a replacement invoice can include them)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: POST /heavy-haul/invoices/{id}/pay
        actor: BillingClerk
        preconditions:
          - "Invoice must be ISSUED (ERR_INVOICE_NOT_ISSUED)"
          - "amount_cents must equal Invoice.total_cents exactly (ERR_INVALID_REQUEST)"
        side_effects:
          - "Customer.outstanding_balance_cents -= total_cents"
      - from: ISSUED
        to: VOID
        trigger: POST /heavy-haul/invoices/{id}/void
        actor: BillingClerk
        preconditions:
          - "Invoice must be ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "Customer.outstanding_balance_cents -= total_cents"
          - "Fines swept into this invoice: APPLIED -> PENDING (compensation)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version; serial-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: permit-create-stale-load
    parent_entity: Load
    write_endpoint: "POST /heavy-haul/loads/{id}/permits"
    occ_field: expected_load_version
    description: |
      Creating a Permit against a Load whose version has advanced since the
      client last observed it is rejected. Permit class and fee derive from
      the load's declared dimensions/weight; a client whose view of the load
      predates the latest mutation (e.g., a re-plan that changed trailer or
      a survey that changed states_crossed) files on a stale basis, so the
      write is refused with 412 rather than silently permitting the wrong class.
    error_id: ERR_STALE_LOAD_VERSION
    http_status: 412

  - rule_id: escort-booking-stale-load
    parent_entity: Load
    write_endpoint: "POST /heavy-haul/loads/{id}/escort-bookings"
    occ_field: expected_load_version
    description: |
      Creating an EscortBooking against a Load whose version has advanced
      since the client last observed it is rejected. The required escort
      positions derive from the load's computed dimensions; a client whose
      view is stale may book the wrong positions, so the write is refused
      with 412 and the client must re-read the load first.
    error_id: ERR_STALE_LOAD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee
    trigger: "Permit transition DRAFT->FILED, DENIED->FILED, or REVOKED->FILED"
    algorithm: tiered_pricing
    formula: |
      weight_basis = (latest ScaleTicket by created_at for the load).measured_gross_lbs
                     if any ScaleTicket exists, else Load.gross_weight_lbs
      fee_cents = STATE_BASE_CENTS[state_code][permit_type]
                + weight_surcharge + width_surcharge
      weight_surcharge (permit_type OVERWEIGHT or SUPERLOAD; 0 for OVERSIZE):
        excess = max(0, weight_basis - 80000)
        marginal tiers: first 20000 lbs @ 1 cent/lb,
                        next 30000 lbs @ 2 cents/lb,
                        beyond 50000 lbs @ 4 cents/lb
      width_surcharge (permit_type OVERSIZE or SUPERLOAD; 0 for OVERWEIGHT):
        Load.width_in > 192 -> 10000; else > 168 -> 5000; else > 144 -> 2500;
        else 0  (highest applicable bracket only, flat not marginal)
    input_set: "The permit being filed; its load's current dimensions and latest scale ticket (any status — tickets are immutable events)"
    constants:
      STATE_BASE_CENTS: {CA: {OVERSIZE: 9000, OVERWEIGHT: 15000, SUPERLOAD: 50000}, NV: {OVERSIZE: 7000, OVERWEIGHT: 12000, SUPERLOAD: 40000}, AZ: {OVERSIZE: 8000, OVERWEIGHT: 13000, SUPERLOAD: 45000}, TX: {OVERSIZE: 10000, OVERWEIGHT: 16000, SUPERLOAD: 55000}, OR: {OVERSIZE: 8500, OVERWEIGHT: 14000, SUPERLOAD: 48000}}
      LEGAL_GROSS_LBS: 80000
    precision: "integer cents; no rounding needed (all terms integer)"
    variants:
      - name: declared_basis
        when: "No ScaleTicket exists for the load at filing time"
        difference: "weight_basis_lbs = Load.gross_weight_lbs (shipper-declared)"
      - name: measured_basis
        when: "At least one ScaleTicket exists for the load at filing time (typical for refile after revocation)"
        difference: "weight_basis_lbs = latest ScaleTicket.measured_gross_lbs; identical load dimensions produce a different fee whenever measured != declared"

  - name: required_escort_positions
    trigger: "Load plan (DRAFT/PLANNED/SURVEYED -> PLANNED)"
    algorithm: threshold
    formula: |
      positions = []
      if Load.width_in >= 168: positions += [FRONT, REAR]
      elif Load.width_in >= 144: positions += [REAR]
      if overall_height_in >= 192: positions += [POLE_FRONT]
      (overall_height_in = height_in + TRAILER_CATALOG[trailer_type].deck_height_in)
      Boundary semantics are >= : width_in == 144 exactly requires REAR,
      width_in == 143 requires none; overall_height_in == 192 exactly adds POLE_FRONT.
    input_set: "The load being planned"
    constants:
      ESCORT_WIDTH_TWO_IN: 168
      ESCORT_WIDTH_ONE_IN: 144
      POLE_HEIGHT_IN: 192
      TRAILER_CATALOG: {FLATBED: {max_payload_lbs: 48000, deck_height_in: 60, cost_per_mile_cents: 350}, STEP_DECK: {max_payload_lbs: 46000, deck_height_in: 42, cost_per_mile_cents: 400}, RGN_LOWBOY: {max_payload_lbs: 90000, deck_height_in: 24, cost_per_mile_cents: 550}, EXTENDABLE_DOUBLE_DROP: {max_payload_lbs: 150000, deck_height_in: 22, cost_per_mile_cents: 700}}
    precision: "integer inches; strict >= comparisons"

  - name: trailer_selection_check
    trigger: "Load plan"
    algorithm: threshold
    formula: |
      capacity_ok = TRAILER_CATALOG[trailer_type].max_payload_lbs >= gross_weight_lbs
      required_axles = max(2, ceil(gross_weight_lbs / 20000))
      axles_ok = trailer_axle_count >= required_axles
      endorsement_ok = (NOT (is_oversize OR is_overweight)) OR driver_oversize_endorsed
      Reject first failing check in order: capacity (ERR_TRAILER_CAPACITY_EXCEEDED),
      axles (ERR_AXLE_COUNT_INSUFFICIENT), endorsement (ERR_DRIVER_NOT_ENDORSED).
    input_set: "The load being planned plus the plan payload"
    constants:
      PER_AXLE_LIMIT_LBS: 20000
      LEGAL_WIDTH_IN: 102
      LEGAL_HEIGHT_IN: 162
      LEGAL_LENGTH_IN: 636
      SUPERLOAD_WEIGHT_LBS: 150000
      SUPERLOAD_WIDTH_IN: 192
    precision: "integer; capacity boundary is >= (payload == weight passes)"

  - name: survey_evaluation
    trigger: "POST /heavy-haul/loads/{id}/survey"
    algorithm: threshold
    formula: |
      survey_result = PASSED iff
        overall_height_in + 6 <= min_bridge_clearance_in
        AND gross_weight_lbs <= max_bridge_weight_lbs
      else FAILED.  (BRIDGE_SAFETY_MARGIN_IN = 6; clearance boundary is <= after margin.)
    input_set: "The load (must be PLANNED so overall_height_in is known) and the survey payload"
    constants:
      BRIDGE_SAFETY_MARGIN_IN: 6
    precision: "integer inches"

  - name: standby_billing
    trigger: "DelayEvent creation"
    algorithm: tiered_pricing
    formula: |
      duration_minutes = ended_at - started_at (whole minutes)
      billable_minutes = max(0, duration_minutes - 120) when kind == CUSTOMER_DELAY else 0
      tier1 = min(billable_minutes, 360); tier2 = max(0, billable_minutes - 360)
      standby_amount_cents = round_half_up((tier1 * 17500 + tier2 * 26250) / 60)
      (17500 cents/hr standard; 26250 cents/hr = 1.5x premium beyond 360 billable minutes;
       exactly 120 minutes of customer delay bills 0; exactly 480 minutes bills 360 at standard only)
    input_set: "The single delay event being created (tiers apply per event, not per load)"
    constants:
      FREE_MINUTES: 120
      PREMIUM_AFTER_BILLABLE_MINUTES: 360
      STANDBY_RATE_CENTS_PER_HOUR: 17500
      STANDBY_PREMIUM_CENTS_PER_HOUR: 26250
    precision: "integer cents, round_half_up on the final division"

  - name: overweight_violation_and_fine
    trigger: "ScaleTicket creation"
    algorithm: threshold
    formula: |
      violation iff measured_gross_lbs * 100 > Load.gross_weight_lbs * 103  (integer-exact, no floats)
      excess_lbs = max(0, measured_gross_lbs - Load.gross_weight_lbs)
      if violation: create Fine(kind=OVERWEIGHT, liable_party=CUSTOMER) with
        fine_cents = marginal tiers over excess_lbs:
          first 2000 lbs @ 25 cents/lb, next 3000 lbs @ 50 cents/lb, beyond 5000 lbs @ 100 cents/lb
        then cascade: GRANTED OVERWEIGHT/SUPERLOAD permits -> REVOKED;
        Load CLEARED/IN_TRANSIT -> ON_HOLD (hold_reason=SCALE_OVERWEIGHT);
        that hold cascades: CONFIRMED escort bookings -> CANCELLED.
    input_set: "The new scale ticket plus the load's permits, escort bookings, and status"
    constants:
      OVERWEIGHT_TOLERANCE_NUM: 103
      OVERWEIGHT_TOLERANCE_DEN: 100
      FINE_TIER1_LBS: 2000
      FINE_TIER1_CENTS_PER_LB: 25
      FINE_TIER2_LBS: 3000
      FINE_TIER2_CENTS_PER_LB: 50
      FINE_TIER3_CENTS_PER_LB: 100
    precision: "integer cents; marginal tier allocation (each tier priced only on the pounds inside it)"

  - name: invoice_total
    trigger: "Invoice creation (POST /heavy-haul/loads/{id}/invoices)"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED (rounding order matters — mode (b)):
      1. linehaul_cents = route_miles * TRAILER_CATALOG[trailer_type].cost_per_mile_cents
      2. permits_cents = sum(fee_cents) over permits with status == GRANTED
         (REVOKED / EXPIRED / WITHDRAWN / DENIED / FILED / DRAFT excluded)
      3. escorts_cents: per COMPLETED booking compute
         round_half_up(scheduled_minutes * rate_per_hour_cents / 60), THEN sum
         (per-line rounding before summation; sum-then-round is FORBIDDEN)
      4. standby_cents = sum(standby_amount_cents) over all DelayEvents of the load
      5. fines_cents = sum(amount_cents) over fines with liable_party == CUSTOMER
         and status in {PENDING, RESOLVED_CUSTOMER_LIABLE}
         (DISPUTED and RESOLVED_CARRIER_LIABLE excluded)
      6. subtotal_cents = linehaul + permits + escorts + standby + fines
      7. fuel_surcharge per fuel_surcharge calculation (tier keys on subtotal)
      8. total_cents = subtotal_cents + fuel_surcharge_cents
    input_set: "The DELIVERED load, its GRANTED permits, COMPLETED escort bookings, all delay events, and customer-liable PENDING/RESOLVED_CUSTOMER_LIABLE fines"
    precision: "integer cents, round_half_up wherever a division occurs; per-line rounding pinned in step 3"

  - name: fuel_surcharge
    trigger: "Inside invoice_total and cost_estimate, after subtotal is known"
    algorithm: threshold
    formula: |
      pct = 0.12 if subtotal_cents >= 5000000 else 0.08
      fuel_surcharge_cents = round_half_up(subtotal_cents * pct)
      EVALUATION ORDER PINNED (mode (c)): the surcharge tier keys on the
      PRE-SURCHARGE subtotal, never on the total — subtotal -> tier -> surcharge
      -> total. A reader who keys the tier on the total gets a different rate
      near the boundary (e.g. subtotal 4800000 -> total 5184000 crosses 5000000
      but the 8% tier still applies).
    input_set: "The just-computed subtotal_cents"
    constants:
      FUEL_TIER_THRESHOLD_CENTS: 5000000
      FUEL_PCT_HIGH: 0.12
      FUEL_PCT_LOW: 0.08
    precision: "integer cents, round_half_up"

  - name: cost_estimate
    trigger: "GET /heavy-haul/loads/{id}/cost-estimate (provisional variant of invoice_total)"
    algorithm: forward_looking
    formula: |
      Same pinned order as invoice_total, with provisional input set:
      1. linehaul_cents = route_miles * TRAILER_CATALOG[trailer_type].cost_per_mile_cents
      2. permits_cents = sum(fee_cents) over permits with status in {FILED, GRANTED}
      3. escorts_cents: per CONFIRMED booking round_half_up(scheduled_minutes *
         rate_per_hour_cents / 60), then sum
      4. standby_cents = 0, fines_cents = 0 (provisional excludes both)
      5. subtotal -> fuel_surcharge (same tier rule) -> total_cents
      Requires Load.status in {SURVEYED, CLEARED, ON_HOLD, IN_TRANSIT, DELIVERED}
      (ERR_LOAD_INVALID_STATE otherwise, since route_miles/trailer must exist).
    input_set: "The load, its FILED+GRANTED permits, and CONFIRMED escort bookings"
    precision: "integer cents, round_half_up; per-line rounding identical to invoice_total"
    variants:
      - name: provisional
        when: "cost_estimate endpoint, any time after SURVEYED"
        difference: "Permits counted in {FILED, GRANTED} at their current fees; escorts counted while still CONFIRMED; standby and fines excluded"
      - name: final
        when: "invoice_total at invoice creation after DELIVERED"
        difference: "Permits counted only when GRANTED (denied/refiled fees settled, measured-basis refiles change the number); escorts counted only when COMPLETED (cancellations drop out); standby and customer-liable fines included — identical load data yields a different total whenever any of these moved"

  - name: credit_availability
    trigger: "POST depart validation; Customer suspension evaluation after invoice creation"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(total_cents) over the customer's invoices with status == ISSUED
      depart gate: cost_estimate total_cents <= credit_limit_cents - outstanding_balance_cents
        (boundary: equality PASSES; strictly greater fails with ERR_CREDIT_LIMIT_EXCEEDED)
      suspension: after an invoice issue, if outstanding_balance_cents > credit_limit_cents
        then Customer -> SUSPENDED (strictly greater; equality stays ACTIVE)
    input_set: "Customer plus all of its ISSUED invoices (PAID and VOID excluded)"
    precision: "integer cents; both boundaries pinned (<= passes at depart, > suspends)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist (validated left-to-right; child must belong to the parent in the path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: auth
    check: "Ownership/scope: Shipper may only act on loads/fines/invoices of the Customer whose id equals X-User-ID"
    error_id: ERR_NOT_OWN_RESOURCE
    http_status: 403
    applies_to: "POST /heavy-haul/loads/{id}/cancel; POST /heavy-haul/fines/{id}/dispute; Shipper reads of loads/cost-estimate/invoices/fines"
  - priority: 5
    category: state
    check: "OCC: expected_load_version equals Load.version on permit/escort creation"
    error_id: ERR_STALE_LOAD_VERSION
    http_status: 412
    applies_to: "POST /heavy-haul/loads/{id}/permits; POST /heavy-haul/loads/{id}/escort-bookings"
  - priority: 6
    category: business_constraint
    check: "Request body sanity: required fields present, enum members valid, integer fields meet their >0 / >=0 floors, datetime ranges have end > start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 7
    category: state
    check: "Target resource state precondition for the operation (load phase, permit status, plan SUBMITTED, fine PENDING, invoice ISSUED, customer not SUSPENDED for load creation)"
    error_id: "ERR_LOAD_INVALID_STATE | ERR_INVALID_STATE | ERR_CUSTOMER_SUSPENDED | ERR_LOAD_NOT_CANCELLABLE | ERR_FINE_NOT_DISPUTABLE | ERR_INVOICE_NOT_ISSUED | ERR_REINSTATE_NOT_ALLOWED | ERR_PERMIT_REQUIREMENT_UNMET"
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints"
  - priority: 8
    category: business_safety
    check: "Safety/regulatory adequacy: trailer capacity, axle count, driver endorsement, securement WLL 50% rule, tarping, escort-position coverage at depart"
    error_id: "ERR_TRAILER_CAPACITY_EXCEEDED | ERR_AXLE_COUNT_INSUFFICIENT | ERR_DRIVER_NOT_ENDORSED | ERR_SECUREMENT_WLL_INSUFFICIENT | ERR_TARPING_REQUIRED | ERR_ESCORT_REQUIREMENT_UNMET"
    http_status: 422
    applies_to: "plan; securement approve; depart"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: permit travel windows and curfew at depart; escort half-open overlap; crane buffered overlap"
    error_id: "ERR_OUTSIDE_TRAVEL_WINDOW | ERR_CURFEW_VIOLATION | ERR_ESCORT_WINDOW_OVERLAP | ERR_CRANE_WINDOW_OVERLAP"
    http_status: 409
    applies_to: "depart; escort-booking create; crane-appointment create"
  - priority: 10
    category: business_constraint
    check: "Domain consistency: permit type matches load flags; no duplicate non-terminal (state_code, permit_type) permit per load; OVERWEIGHT fines not manually creatable; no second ISSUED invoice per load; scale-ticket/securement/etc. only in documented load states"
    error_id: "ERR_PERMIT_TYPE_NOT_REQUIRED | ERR_DUPLICATE_PERMIT | ERR_FINE_KIND_NOT_MANUAL | ERR_INVOICE_EXISTS"
    http_status: 409
    applies_to: "permit create; fine create; invoice create"
  - priority: 11
    category: business_fiscal
    check: "Credit: provisional estimate must fit remaining credit at depart"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /heavy-haul/loads/{id}/depart"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; outside business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/heavy-haul/customers"
    description: "Register a shipper customer"
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, credit_limit_cents]
    output: Customer
    side_effects: ["status = ACTIVE; outstanding_balance_cents = 0"]

  - method: GET
    path: "/heavy-haul/customers/{id}"
    description: "Get a customer"
    roles: [PlatformAdmin, BillingClerk, Dispatcher, SafetyManager, Shipper]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/heavy-haul/customers/{id}/reinstate"
    description: "Reinstate a SUSPENDED customer once outstanding is within the credit limit"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Customer
    side_effects: ["status SUSPENDED -> ACTIVE"]

  # --- Load ---
  - method: POST
    path: "/heavy-haul/loads"
    description: "Create a load in DRAFT for the calling Shipper's customer"
    roles: [Shipper]
    code: 201
    input: [cargo_description, gross_weight_lbs, width_in, height_in, length_in, origin, destination, "cargo_requires_tarp?", "declared_value_cents?"]
    output: Load
    side_effects: ["customer_id set from X-User-ID; status = DRAFT; survey_result = null"]

  - method: GET
    path: "/heavy-haul/loads"
    description: "List loads; Shipper callers are auto-scoped to their own customer_id"
    roles: [Shipper, Dispatcher, PermitClerk, StateAuthority, SafetyManager, Driver, BillingClerk, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "Load[]"
    side_effects: []

  - method: GET
    path: "/heavy-haul/loads/{id}"
    description: "Get a load"
    roles: [Shipper, Dispatcher, PermitClerk, StateAuthority, SafetyManager, Driver, BillingClerk, PlatformAdmin]
    code: 200
    input: []
    output: Load
    side_effects: []

  - method: POST
    path: "/heavy-haul/loads/{id}/plan"
    description: "Select trailer configuration and driver; computes oversize/overweight/superload flags, required axles and escort positions"
    roles: [Dispatcher]
    code: 200
    input: [trailer_type, trailer_axle_count, driver_name, driver_oversize_endorsed]
    output: Load
    side_effects: ["DRAFT/PLANNED -> PLANNED; SURVEYED -> PLANNED with survey_result reset to null; computed fields refreshed; increments Load.version by 1"]

  - method: POST
    path: "/heavy-haul/loads/{id}/survey"
    description: "Record route survey + bridge analysis; auto-evaluates PASSED/FAILED against load dimensions"
    roles: [Dispatcher]
    code: 200
    input: [route_miles, states_crossed, min_bridge_clearance_in, max_bridge_weight_lbs]
    output: Load
    side_effects: ["PLANNED -> SURVEYED on PASSED; SURVEYED -> PLANNED on FAILED; survey fields stored; increments Load.version by 1"]

  - method: POST
    path: "/heavy-haul/loads/{id}/cancel"
    description: "Cancel a pre-transit load; cascades to permits, escort bookings, crane appointments"
    roles: [Shipper, Dispatcher]
    code: 200
    input: []
    output: Load
    side_effects: ["status -> CANCELLED; non-terminal permits -> WITHDRAWN; CONFIRMED escorts -> CANCELLED; SCHEDULED cranes -> CANCELLED; increments Load.version by 1"]

  - method: POST
    path: "/heavy-haul/loads/{id}/depart"
    description: "Depart on a CLEARED load; enforces escort coverage, permit travel windows, curfew, and credit"
    roles: [Driver]
    code: 200
    input: []
    output: Load
    side_effects: ["CLEARED -> IN_TRANSIT; GRANTED permits past travel_window_end flip to EXPIRED during evaluation; increments Load.version by 1"]

  - method: POST
    path: "/heavy-haul/loads/{id}/arrive"
    description: "Mark an IN_TRANSIT load delivered; completes escort bookings and crane appointments"
    roles: [Driver]
    code: 200
    input: []
    output: Load
    side_effects: ["IN_TRANSIT -> DELIVERED; CONFIRMED escorts -> COMPLETED; SCHEDULED cranes -> COMPLETED; increments Load.version by 1"]

  - method: POST
    path: "/heavy-haul/loads/{id}/release-hold"
    description: "Release an ON_HOLD load after revoked permits have been refiled and re-granted"
    roles: [SafetyManager]
    code: 200
    input: []
    output: Load
    side_effects: ["ON_HOLD -> SURVEYED; readiness gate re-evaluated; increments Load.version by 1"]

  - method: GET
    path: "/heavy-haul/loads/{id}/cost-estimate"
    description: "Provisional cost estimate (forward-looking variant of the invoice calculation)"
    roles: [Dispatcher, BillingClerk, Shipper, PlatformAdmin]
    code: 200
    input: []
    output: "{ linehaul_cents: integer, permits_cents: integer, escorts_cents: integer, standby_cents: integer, fines_cents: integer, subtotal_cents: integer, fuel_surcharge_cents: integer, total_cents: integer }"
    side_effects: []

  # --- SecurementPlan ---
  - method: POST
    path: "/heavy-haul/loads/{id}/securement-plans"
    description: "File a securement & tarping plan (created SUBMITTED)"
    roles: [Dispatcher]
    code: 201
    input: [method, tiedown_count, wll_per_tiedown_lbs]
    output: SecurementPlan
    side_effects: ["aggregate_wll_lbs computed; status = SUBMITTED; requires Load PLANNED or SURVEYED (ERR_LOAD_INVALID_STATE)"]

  - method: GET
    path: "/heavy-haul/loads/{id}/securement-plans"
    description: "List securement plans of a load"
    roles: [Shipper, Dispatcher, SafetyManager, BillingClerk, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SecurementPlan[]"
    side_effects: []

  - method: POST
    path: "/heavy-haul/securement-plans/{id}/approve"
    description: "Approve a securement plan after WLL 50% rule and tarping validation"
    roles: [SafetyManager]
    code: 200
    input: []
    output: SecurementPlan
    side_effects: ["SUBMITTED -> APPROVED; Load readiness gate re-evaluated"]

  - method: POST
    path: "/heavy-haul/securement-plans/{id}/reject"
    description: "Reject a securement plan (terminal; a replacement must be refiled)"
    roles: [SafetyManager]
    code: 200
    input: []
    output: SecurementPlan
    side_effects: ["SUBMITTED -> REJECTED"]

  # --- Permit ---
  - method: POST
    path: "/heavy-haul/loads/{id}/permits"
    description: "Create a permit application in DRAFT (OCC-guarded on Load.version)"
    roles: [PermitClerk]
    code: 201
    input: [state_code, permit_type, expected_load_version]
    output: Permit
    side_effects: ["status = DRAFT; increments Load.version by 1; duplicate non-terminal (state_code, permit_type) rejected (ERR_DUPLICATE_PERMIT); permit_type must be required by load flags (ERR_PERMIT_TYPE_NOT_REQUIRED); Load must be SURVEYED, CLEARED, or ON_HOLD"]

  - method: GET
    path: "/heavy-haul/loads/{id}/permits"
    description: "List permits of a load"
    roles: [Shipper, Dispatcher, PermitClerk, StateAuthority, SafetyManager, BillingClerk, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  - method: POST
    path: "/heavy-haul/permits/{id}/file"
    description: "File (or re-file after DENIED/REVOKED) a permit; computes fee on the current weight basis"
    roles: [PermitClerk]
    code: 200
    input: []
    output: Permit
    side_effects: ["DRAFT/DENIED/REVOKED -> FILED; fee_cents and weight_basis_lbs computed per permit_fee calculation"]

  - method: POST
    path: "/heavy-haul/permits/{id}/grant"
    description: "Grant a filed permit with its legal travel window"
    roles: [StateAuthority]
    code: 200
    input: [travel_window_start, travel_window_end]
    output: Permit
    side_effects: ["FILED -> GRANTED; travel window stored; Load readiness gate re-evaluated"]

  - method: POST
    path: "/heavy-haul/permits/{id}/deny"
    description: "Deny a filed permit"
    roles: [StateAuthority]
    code: 200
    input: [denial_reason]
    output: Permit
    side_effects: ["FILED -> DENIED"]

  # --- EscortBooking ---
  - method: POST
    path: "/heavy-haul/loads/{id}/escort-bookings"
    description: "Book a pilot car (created CONFIRMED); OCC-guarded on Load.version; half-open overlap per provider rejected"
    roles: [Dispatcher]
    code: 201
    input: [provider_name, position, scheduled_start, scheduled_end, rate_per_hour_cents, expected_load_version]
    output: EscortBooking
    side_effects: ["status = CONFIRMED; scheduled_minutes computed; increments Load.version by 1; Load readiness gate re-evaluated; Load must be PLANNED, SURVEYED, CLEARED, or ON_HOLD (ERR_LOAD_INVALID_STATE)"]

  - method: GET
    path: "/heavy-haul/loads/{id}/escort-bookings"
    description: "List escort bookings of a load"
    roles: [Shipper, Dispatcher, SafetyManager, Driver, BillingClerk, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "EscortBooking[]"
    side_effects: []

  - method: POST
    path: "/heavy-haul/escort-bookings/{id}/cancel"
    description: "Cancel a CONFIRMED escort booking, freeing the provider window"
    roles: [Dispatcher]
    code: 200
    input: []
    output: EscortBooking
    side_effects: ["CONFIRMED -> CANCELLED; provider window freed; readiness gate re-evaluated (no demotion of CLEARED loads)"]

  # --- CraneAppointment ---
  - method: POST
    path: "/heavy-haul/loads/{id}/crane-appointments"
    description: "Schedule a crane lift window; buffered overlap (45-minute turnaround) per crane_id rejected"
    roles: [Dispatcher]
    code: 201
    input: [site, crane_id, window_start, window_end]
    output: CraneAppointment
    side_effects: ["status = SCHEDULED; Load readiness gate re-evaluated; Load must be PLANNED, SURVEYED, CLEARED, or ON_HOLD (ERR_LOAD_INVALID_STATE)"]

  - method: GET
    path: "/heavy-haul/loads/{id}/crane-appointments"
    description: "List crane appointments of a load"
    roles: [Shipper, Dispatcher, SafetyManager, Driver, PlatformAdmin]
    code: 200
    input: ["site?", "limit?", "offset?"]
    output: "CraneAppointment[]"
    side_effects: []

  # --- DelayEvent ---
  - method: POST
    path: "/heavy-haul/loads/{id}/delay-events"
    description: "Record a delay/standby event; computes billable minutes and tiered standby charge"
    roles: [Driver]
    code: 201
    input: [kind, started_at, ended_at]
    output: DelayEvent
    side_effects: ["duration_minutes, billable_minutes, standby_amount_cents computed; Load must be CLEARED, ON_HOLD, or IN_TRANSIT (ERR_LOAD_INVALID_STATE)"]

  - method: GET
    path: "/heavy-haul/loads/{id}/delay-events"
    description: "List delay events of a load"
    roles: [Shipper, Dispatcher, Driver, BillingClerk, PlatformAdmin]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: "DelayEvent[]"
    side_effects: []

  # --- ScaleTicket ---
  - method: POST
    path: "/heavy-haul/loads/{id}/scale-tickets"
    description: "Record a certified scale ticket; overweight violations cascade to fines, permit revocations, and load hold"
    roles: [Driver]
    code: 201
    input: [measured_gross_lbs, weighed_at]
    output: ScaleTicket
    side_effects: ["excess_lbs and is_violation computed; on violation: OVERWEIGHT Fine created (CUSTOMER-liable), GRANTED OVERWEIGHT/SUPERLOAD permits -> REVOKED, Load CLEARED/IN_TRANSIT -> ON_HOLD, CONFIRMED escorts -> CANCELLED; Load must be CLEARED, IN_TRANSIT, or ON_HOLD (ERR_LOAD_INVALID_STATE)"]

  - method: GET
    path: "/heavy-haul/loads/{id}/scale-tickets"
    description: "List scale tickets of a load (immutable, append-only)"
    roles: [Shipper, Dispatcher, SafetyManager, Driver, BillingClerk, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScaleTicket[]"
    side_effects: []

  # --- Fine ---
  - method: POST
    path: "/heavy-haul/loads/{id}/fines"
    description: "Report a damage or permit-violation fine (OVERWEIGHT fines are system-created only)"
    roles: [Driver, SafetyManager]
    code: 201
    input: [kind, amount_cents, description]
    output: Fine
    side_effects: ["status = PENDING; liable_party defaulted by kind (DAMAGE/PERMIT_VIOLATION -> CARRIER); Load must be CLEARED, ON_HOLD, IN_TRANSIT, or DELIVERED (ERR_LOAD_INVALID_STATE)"]

  - method: GET
    path: "/heavy-haul/loads/{id}/fines"
    description: "List fines of a load"
    roles: [Shipper, Dispatcher, SafetyManager, Driver, BillingClerk, PlatformAdmin]
    code: 200
    input: ["status?", "kind?", "limit?", "offset?"]
    output: "Fine[]"
    side_effects: []

  - method: POST
    path: "/heavy-haul/fines/{id}/dispute"
    description: "Shipper disputes a customer-liable PENDING fine"
    roles: [Shipper]
    code: 200
    input: []
    output: Fine
    side_effects: ["PENDING -> DISPUTED"]

  - method: POST
    path: "/heavy-haul/fines/{id}/resolve"
    description: "Resolve a PENDING or DISPUTED fine, fixing final liability and optionally adjusting the amount"
    roles: [SafetyManager]
    code: 200
    input: [resolution, "adjusted_amount_cents?"]
    output: Fine
    side_effects: ["-> RESOLVED_CUSTOMER_LIABLE or RESOLVED_CARRIER_LIABLE; liable_party and amount updated accordingly"]

  # --- Invoice ---
  - method: POST
    path: "/heavy-haul/loads/{id}/invoices"
    description: "Create the final invoice for a DELIVERED load (issued immediately as a snapshot)"
    roles: [BillingClerk]
    code: 201
    input: []
    output: Invoice
    side_effects: ["Line items computed per invoice_total (final variant); status = ISSUED; swept fines PENDING/RESOLVED_CUSTOMER_LIABLE -> APPLIED; Customer.outstanding_balance_cents += total_cents; Customer auto-SUSPENDED if outstanding exceeds credit limit"]

  - method: GET
    path: "/heavy-haul/loads/{id}/invoices"
    description: "List invoices of a load"
    roles: [Shipper, Dispatcher, BillingClerk, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/heavy-haul/invoices/{id}/pay"
    description: "Pay an ISSUED invoice in full"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["ISSUED -> PAID; Customer.outstanding_balance_cents -= total_cents"]

  - method: POST
    path: "/heavy-haul/invoices/{id}/void"
    description: "Void an ISSUED invoice; compensates outstanding balance and un-sweeps fines"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["ISSUED -> VOID; Customer.outstanding_balance_cents -= total_cents; swept fines APPLIED -> PENDING"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or X-User-Role not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist, or child does not belong to the path parent" }
  - { id: ERR_NOT_OWN_RESOURCE, http: 403, condition: "Shipper's X-User-ID does not match the resource's owning Customer id" }
  - { id: ERR_STALE_LOAD_VERSION, http: 412, condition: "expected_load_version does not equal the load's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, non-positive integer where >0 required, negative where >=0 required, end not after start, or payment amount not equal to invoice total" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Load creation attempted for a SUSPENDED customer" }
  - { id: ERR_LOAD_INVALID_STATE, http: 409, condition: "Load is not in a state that permits the requested operation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Non-load resource (permit, securement plan, fine, customer) is not in a state that permits the requested operation" }
  - { id: ERR_LOAD_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on a load in IN_TRANSIT, DELIVERED, or CANCELLED" }
  - { id: ERR_PERMIT_REQUIREMENT_UNMET, http: 409, condition: "Release-hold attempted while a required (state_code, permit_type) pair lacks a GRANTED permit" }
  - { id: ERR_FINE_NOT_DISPUTABLE, http: 409, condition: "Dispute attempted on a non-PENDING or carrier-liable fine" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Pay or void attempted on an invoice not in ISSUED status" }
  - { id: ERR_REINSTATE_NOT_ALLOWED, http: 409, condition: "Reinstate attempted while outstanding_balance_cents still exceeds credit_limit_cents, or customer not SUSPENDED" }
  - { id: ERR_TRAILER_CAPACITY_EXCEEDED, http: 422, condition: "TRAILER_CATALOG[trailer_type].max_payload_lbs < gross_weight_lbs at plan" }
  - { id: ERR_AXLE_COUNT_INSUFFICIENT, http: 422, condition: "trailer_axle_count < required_axles (max(2, ceil(gross_weight_lbs/20000))) at plan" }
  - { id: ERR_DRIVER_NOT_ENDORSED, http: 422, condition: "Oversize or overweight load planned with driver_oversize_endorsed = false" }
  - { id: ERR_SECUREMENT_WLL_INSUFFICIENT, http: 422, condition: "aggregate_wll_lbs < ceil(gross_weight_lbs / 2) at securement approval" }
  - { id: ERR_TARPING_REQUIRED, http: 422, condition: "cargo_requires_tarp is true but securement method is not CHAINS_AND_TARPS" }
  - { id: ERR_ESCORT_REQUIREMENT_UNMET, http: 409, condition: "Depart attempted without a CONFIRMED booking for every required escort position" }
  - { id: ERR_OUTSIDE_TRAVEL_WINDOW, http: 409, condition: "Depart attempted with the logical clock outside a GRANTED permit's travel window (overdue permits flip to EXPIRED)" }
  - { id: ERR_CURFEW_VIOLATION, http: 409, condition: "Depart attempted when the logical clock's UTC hour is not in [5, 21)" }
  - { id: ERR_ESCORT_WINDOW_OVERLAP, http: 409, condition: "New escort booking's half-open [scheduled_start, scheduled_end) intersects another CONFIRMED booking for the same provider_name (adjacency end == start is allowed)" }
  - { id: ERR_CRANE_WINDOW_OVERLAP, http: 409, condition: "New crane window intersects another SCHEDULED appointment for the same crane_id after each window is expanded by a 45-minute turnaround buffer" }
  - { id: ERR_PERMIT_TYPE_NOT_REQUIRED, http: 409, condition: "permit_type does not match the load's computed flags (SUPERLOAD for superloads; OVERSIZE only if is_oversize; OVERWEIGHT only if is_overweight and not superload)" }
  - { id: ERR_DUPLICATE_PERMIT, http: 409, condition: "A permit with the same (state_code, permit_type) already exists for the load in DRAFT, FILED, or GRANTED status" }
  - { id: ERR_FINE_KIND_NOT_MANUAL, http: 409, condition: "Manual fine creation attempted with kind OVERWEIGHT (system-created via scale tickets only)" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "Invoice creation attempted while the load already has an ISSUED invoice" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Depart attempted while the provisional estimate exceeds credit_limit_cents - outstanding_balance_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Carrier platform operator; manages customers and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /heavy-haul/customers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"
  - name: Shipper
    description: "Customer-side shipper user; owns loads under their Customer account"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /heavy-haul/loads"
      - "POST /heavy-haul/fines/{id}/dispute"
    shared_operations:
      - "POST /heavy-haul/loads/{id}/cancel (shared with Dispatcher; Shipper restricted to own loads)"
      - "GET endpoints for own loads, cost-estimate, child collections, and own Customer record"
  - name: Dispatcher
    description: "Carrier load planner; plans loads, surveys routes, files securement plans, books escorts and cranes"
    identity: opaque
    exclusive_operations:
      - "POST /heavy-haul/loads/{id}/plan"
      - "POST /heavy-haul/loads/{id}/survey"
      - "POST /heavy-haul/loads/{id}/securement-plans"
      - "POST /heavy-haul/loads/{id}/escort-bookings"
      - "POST /heavy-haul/escort-bookings/{id}/cancel"
      - "POST /heavy-haul/loads/{id}/crane-appointments"
    shared_operations:
      - "POST /heavy-haul/loads/{id}/cancel (shared with Shipper)"
      - "GET endpoints across loads and child collections"
  - name: PermitClerk
    description: "Permit service clerk; creates and files state permit applications"
    identity: opaque
    exclusive_operations:
      - "POST /heavy-haul/loads/{id}/permits"
      - "POST /heavy-haul/permits/{id}/file"
    shared_operations:
      - "GET /heavy-haul/loads, GET /heavy-haul/loads/{id}, GET permits"
  - name: StateAuthority
    description: "State DOT permit authority; grants or denies filed permits with travel windows"
    identity: opaque
    exclusive_operations:
      - "POST /heavy-haul/permits/{id}/grant"
      - "POST /heavy-haul/permits/{id}/deny"
    shared_operations:
      - "GET /heavy-haul/loads, GET /heavy-haul/loads/{id}, GET permits"
  - name: SafetyManager
    description: "Carrier safety/compliance manager; approves securement, resolves fines, releases holds"
    identity: opaque
    exclusive_operations:
      - "POST /heavy-haul/securement-plans/{id}/approve"
      - "POST /heavy-haul/securement-plans/{id}/reject"
      - "POST /heavy-haul/fines/{id}/resolve"
      - "POST /heavy-haul/loads/{id}/release-hold"
    shared_operations:
      - "POST /heavy-haul/loads/{id}/fines (shared with Driver)"
      - "GET endpoints across loads and child collections"
  - name: Driver
    description: "Line-haul driver; executes departure/arrival and records operational events"
    identity: opaque
    exclusive_operations:
      - "POST /heavy-haul/loads/{id}/depart"
      - "POST /heavy-haul/loads/{id}/arrive"
      - "POST /heavy-haul/loads/{id}/delay-events"
      - "POST /heavy-haul/loads/{id}/scale-tickets"
    shared_operations:
      - "POST /heavy-haul/loads/{id}/fines (shared with SafetyManager)"
      - "GET endpoints across loads and child collections"
  - name: BillingClerk
    description: "Carrier billing specialist; issues/collects/voids invoices and reinstates customers"
    identity: opaque
    exclusive_operations:
      - "POST /heavy-haul/loads/{id}/invoices"
      - "POST /heavy-haul/invoices/{id}/pay"
      - "POST /heavy-haul/invoices/{id}/void"
      - "POST /heavy-haul/customers/{id}/reinstate"
    shared_operations:
      - "GET endpoints across customers, loads, invoices, fines, delay events"
