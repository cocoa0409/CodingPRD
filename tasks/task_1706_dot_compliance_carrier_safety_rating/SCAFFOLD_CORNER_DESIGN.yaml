            - { call: "POST /safety/compliance-audit-cases", payload: { carrier_id: "${c_id}", audit_type: "COMPLIANCE_REVIEW", scheduled_date: "2026-08-01T00:00:00Z", field_work_duration_days: 7 }, as: SafetyAdmin, captures: { au_id: $.data.id } }
