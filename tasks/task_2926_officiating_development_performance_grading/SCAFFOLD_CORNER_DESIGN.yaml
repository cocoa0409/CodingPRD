              payload: { game_id: "${g_id}", official_id: "${dan_id}", position: "UMPIRE", expected_game_version: "${g_v0}" }
              as: CrewScheduler
              captures: { imm_a_id: $.data.id, imm_a_from: $.data.occupied_from_utc }
            - call: "POST /crew-assignments/${imm_a_id}/confirm"
              payload: {}
              as: CrewScheduler
              captures: { imm_a_status: $.data.status }
            - call: "GET /games/${g_id}"
              payload: {}
              as: CrewScheduler
              captures: { imm_g_posture: $.data.crew_posture, imm_g_ccc: $.data.confirmed_crew_count, imm_g_csi: $.data.crew_strength_index }
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q3-P22", call_category: "HOLDING", grade_code: "MISSED_CALL", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { imm_pg_id: $.data.id, imm_pg_points: $.data.error_points, imm_pg_status: $.data.grade_status }
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures: { imm_index_draft: "$.data[0].accuracy_index", imm_n_draft: "$.data[0].graded_play_count" }
            - call: "POST /play-grades/${imm_pg_id}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { imm_pg_status_posted: $.data.grade_status, imm_pg_posted_at: $.data.posted_at }
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures: { imm_index_posted: "$.data[0].accuracy_index", imm_wep_posted: "$.data[0].weighted_error_points", imm_n_posted: "$.data[0].graded_play_count" }
          assert:
            - "${imm_a_from} == 2026-09-12T17:00:00Z in the create response — the derived window is not computed lazily on read"
            - "${imm_a_status} == CONFIRMED and the immediately following read shows ${imm_g_posture} == STAFFED with ${imm_g_ccc} == 1 and ${imm_g_csi} == 4.80"
            - "${imm_pg_points} == 0.75 and ${imm_pg_status} == DRAFT in the create response, while ${imm_index_draft} == 100.00 with ${imm_n_draft} == 0 — a DRAFT grade is outside both included sets"
            - "${imm_pg_status_posted} == POSTED with ${imm_pg_posted_at} == 2026-09-13T21:30:00Z"
            - "the very next read shows ${imm_n_posted} == 1, ${imm_wep_posted} == 0.75 and ${imm_index_posted} == 85.00 — no second call, retry or delay is needed for the recompute to be visible"
