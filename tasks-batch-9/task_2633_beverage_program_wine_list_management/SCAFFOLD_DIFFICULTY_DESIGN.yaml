            - call: "POST /beverage-program/btg-slots/${s1_id}/close"
              payload: { pours_sold: 2, staff_education_pours: 1 }
              as: VenueSommelier
              as_user_id: "${v1_id}"
            - call: "POST /beverage-program/venues/${v1_id}/pour-cost-runs"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-02T00:00:00Z" }
              as: BeverageDirector
