  - section: consistency_model
    instances:
      - name: writes_and_their_cascades_are_visible_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ResponseDraft.APPROVED_to_SENT
          - calculations.company_disclosure_posture
        distinguishing_aspect: "Every write's cascade is readable in the same response and in the next read with no settling step, and the flip side is that a stored derived field only changes when something writes it: moving the clock into the blackout window without a recompute leaves posture OPEN, so the send still succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One company whose blackout window is 2026-08-10T00:00:00Z to 2026-08-20T00:00:00Z, so the posture stored at creation is OPEN."
