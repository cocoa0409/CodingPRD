  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: package_accept_cascades_accruals_distribution_and_shortfall_call
        grounds:
          - state_machines.MonthlyReportPackage.financial_status_==_SUBMITTED_to_financial_status_==_ACCEPTED
          - state_machines.FeeAccrual.ACCRUED_to_INVOICED
          - calculations.cash_distribution_waterfall
          - entities.WorkingCapitalCall.fields.auto_created
        distinguishing_aspect: |
          Depth-4 forward cascade from a single owner decision: ACCEPT (1) invoices three accruals,
          (2) which creates a CashDistribution, (3) whose partially-filled buckets produce
          shortfall_cents 1158754, (4) which auto-creates a DISTRIBUTION_SHORTFALL working capital
          call — each hop is a different entity and hop 4 exists only because hop 3's arithmetic left
          demand unmet.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with working_capital_balance_cents 1000000 against a floor of 500000, ffe_reserve_pct 0.04, owner_priority_cents 12000000 and funding_due_days at the default 15."
            - "APPROVED FY2026 OperatingBudget."
            - "One MonthlyReportPackage for (2026, 9) with financial_status SUBMITTED, closing_cash_available_cents 6000000 and three ACCRUED FeeAccrual rows (BASE 1787500, CENTRALIZED_SERVICES 500000, INCENTIVE 2171253)."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Cascade Waterfall Hotel", owner_entity_name: "Depth Four Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0.04, centralized_services_cap_pct: 0.015, working_capital_floor_cents: 500000, initial_working_capital_cents: 1000000, funding_due_days: 15 }
              as: PlatformAdmin
              captures: { agr4a: $.data.id }
            - call: "POST /hotel-management/agreements/${agr4a}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agr4a_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agr4a}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, budgeted_operating_expenses_cents: 400000000, expected_agreement_version: "${agr4a_v2}" }
              as: HotelManagerOps
              captures: { bud4a: $.data.id }
            - call: "POST /hotel-management/budgets/${bud4a}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud4a}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr4a}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 6000000 }
              as: HotelManagerOps
              captures: { pkg4a: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg4a}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 10000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { chg4a: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg4a}/submit"
              payload: {}
              as: HotelManagerOps
          trigger:
            - call: "POST /hotel-management/report-packages/${pkg4a}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/report-packages/${pkg4a}/fee-accruals"
              payload: {}
              as: AssetManager
            - call: "GET /hotel-management/report-packages/${pkg4a}/distributions"
              payload: {}
              as: AssetManager
              captures: { dist4a: "$.data[0].id" }
            - call: "GET /hotel-management/agreements/${agr4a}/working-capital-calls"
