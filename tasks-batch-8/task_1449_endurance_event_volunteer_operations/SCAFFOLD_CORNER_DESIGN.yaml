  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check (even for a nonexistent resource id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /volunteer-ops/events/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "with auth headers stripped by the test client: 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (${err}) — auth (p1) precedes existence (p3), so the missing id never surfaces"
      - name: duplicate_signup_same_shift_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - ERR_DUPLICATE_SIGNUP
        distinguishing_aspect: "A second signup for the same (volunteer, shift) while the first is non-terminal -> ERR_DUPLICATE_SIGNUP; after cancelling the first, a fresh signup succeeds."
        test_recipe:
          setup: ["PUBLISHED event; V1 ELIGIBLE with REQUESTED signup on the shift"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 2 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id, sg2_st: $.data.status } }
          assert:
            - "second concurrent signup rejected ERR_DUPLICATE_SIGNUP (${err})"
            - "after cancelling the first: fresh signup succeeds 201 REQUESTED (${sg2_st}) — CANCELLED is terminal and does not block"
      - name: duplicate_training_record_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - ERR_DUPLICATE_TRAINING_RECORD
        distinguishing_aspect: "One TrainingRecord per (volunteer, module): second enroll -> ERR_DUPLICATE_TRAINING_RECORD; re-enroll is the sanctioned retry path."
        test_recipe:
          setup: ["volunteer with an ENROLLED SAFETY_BRIEFING record"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
