            - *cx_banner
            - *cx_member
            - *cx_household
          trigger:
            - call: "POST /household-links"
              payload: { household_id: "00000000-0000-4000-8000-000000000003", member_id: "00000000-0000-4000-8000-000000000004", link_role: "PRIMARY" }
              as: LoyaltyAnalyst
              as_user_id: "analyst-1"
              captures: { both_err: $.data.error_id }
            - call: "POST /household-links"
