          - state_machines.RenewalDecision.VOTING_to_DECIDED_RENEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / restructure_branch_execution_omits_the_renew_branch_side_effects
          rationale: "That §1.8 instance executes the RESTRUCTURE branch and asserts the absence of every RENEW-branch side effect."
      - name: restructure_revert_reverses_all_side_effects
        claim_type: compensation
        grounds:
          - state_machines.RenewalDecision.EXECUTED_to_REVERTED
        excluded_because:
          difficulty_instance: compensating_invariant / reverting_a_restructure_restores_the_title_count_and_the_price
          rationale: "The compensation and the absence of drift are the whole subject of that §1.8 instance."
      - name: member_ledger_stays_in_sync_with_confirmed_pledges
        claim_type: ledger_sync
        grounds:
          - entities.Member.fields.annual_committed_cents
          - state_machines.Commitment.CONFIRMED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / withdrawing_a_confirmed_pledge_restores_the_member_ledger_identity
          rationale: "The before/after reconciliation of the ledger identity is asserted there."
      - name: signing_cascade_reaches_the_member_and_its_trials
        claim_type: cascade_down
        grounds:
          - state_machines.Negotiation.AGREED_to_SIGNED
          - state_machines.Trial.DRAFT_to_WITHDRAWN
        excluded_because:
          difficulty_instance: transitive_cascade / signing_cascade_confirms_pledge_then_overcommits_member_then_withdraws_draft_trial
          rationale: "All four hops, including the DRAFT-only trial withdrawal, are asserted there."
      - name: only_draft_trials_are_withdrawn_by_the_standing_flip
        claim_type: conditional_cascade
        grounds:
          - state_machines.Trial.DRAFT_to_WITHDRAWN
          - entities.Member.fields.standing
        excluded_because:
          difficulty_instance: transitive_cascade / signing_cascade_confirms_pledge_then_overcommits_member_then_withdraws_draft_trial
          rationale: "That instance asserts the DRAFT trial becomes WITHDRAWN while the ENDORSED trial of the same member is untouched."
      - name: access_incident_cascade_crosses_into_the_renewal_decision
        claim_type: cross_entity
        grounds:
          - state_machines.AccessIncident.RESOLVED_to_REOPENED
          - state_machines.Subscription.CONFIGURED_to_DEGRADED
        excluded_because:
          difficulty_instance: transitive_cascade / incident_reopen_cascade_accrues_sla_credit_and_refreshes_the_voting_offer
          rationale: "The incident write, the subscription axis change and the RenewalDecision refresh are all asserted there."
      - name: signing_is_guarded_by_the_referenced_trial_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Negotiation.AGREED_to_SIGNED
          - entities.Trial.fields.status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / signing_rejected_while_the_referenced_trial_is_still_draft
          rationale: "The cross-entity guard is exactly what that §1.8 instance falsifies."
  - section: calculations
    instances:
      - name: cost_per_use_over_a_single_month_window_lands_in_the_poor_band
        claim_type: correct_result
        grounds:
          - calculations.cost_per_use_cents
          - endpoints.GET_/erm/subscriptions/{id}/cost-per-use
          - entities.Subscription.fields.negotiated_price_cents
        distinguishing_aspect: |
          Known inputs pinned by the chain: settled_invoice_total_cents is the subscription's
          negotiated_price_cents 9000000 and pooled usage over the window [2027-01, 2027-01] is 3000, so
          cost_per_use_cents must be exactly round_half_up(9000000 / 3000) = 3000, which is above
          CPU_GOOD_MAX_CENTS 1500 and therefore lands in the POOR band.
        test_recipe:
          setup:
            - "Vendor, product and Member Alpha College; the subscription is signed at 9000000 cents for 2027-01-01..2027-12-31 and is ACTIVE from 2027-01-02."
