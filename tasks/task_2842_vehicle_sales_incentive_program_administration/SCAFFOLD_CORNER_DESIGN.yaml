              payload: { dealer_id: "${dealer_b}", limit: 10 }
              as: Dealer
              as_user_id: "${dealer_a}"
              captures: { cross_obj_total: $.pagination.total_count, cross_obj_first: "$.data[0].id" }
            - call: "GET /incentives/deliveries"
              payload: { limit: 100 }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { del_total: $.pagination.total_count }
          assert:
            - "${err_report_for_other} == ERR_DEALER_MISMATCH (403): dealer A cannot report a sale for dealer B even though both dealers exist and the payload is otherwise valid"
            - "${err_protest_other} == ERR_DEALER_MISMATCH — the ownership check reads objective.dealer_id, which is one hop away from the path parameter"
            - "${err_claim_other} == ERR_DEALER_MISMATCH — the ownership check reads the CLAIM's delivery.dealer_id, two hops from the body, and it fires before any eligibility or objective reasoning"
            - "${err_ghost_dealer} == ERR_DEALER_MISMATCH, not ERR_UNAUTHENTICATED (the headers were complete and Dealer is a declared role) and not ERR_DEALER_NOT_FOUND (no dealer is named in the path): an X-User-ID that is not this resource's owner is a mismatch regardless of whether it is a dealer at all"
            - "${ok_del_dealer} == ${dealer_a}, ${ok_prot_status} == OPEN, and ${ok_claim_dealer} == ${dealer_a} (computed from the delivery, never supplied) — all three dealer-exclusive writes succeed for the owner"
            - "${cross_read_code} == ${dealer_b_code} == CRN-D-OWB — reads are deliberately NOT owner-scoped; priority 4 lists only the three POST endpoints"
            - "${cross_obj_total} == 1 and ${cross_obj_first} == ${obj_b} — dealer A may filter the objective list to dealer B and see it, so a test that expects tenant isolation on reads is wrong about this design"
            - "${del_total} == 2 — only the setup delivery and the one owner-authorised delivery exist; the three mismatched writes persisted nothing"

