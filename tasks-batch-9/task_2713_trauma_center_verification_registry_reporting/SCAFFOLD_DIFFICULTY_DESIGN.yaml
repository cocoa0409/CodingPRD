              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /verification-cycles/00000000-0000-0000-0000-000000000000/submit"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403 and data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "data.error_id != ERR_CYCLE_NOT_FOUND"
            - "GET /verification-cycles returns an empty list, confirming nothing was created"
  - rule_id: boundary_precision_check
    instances:
      - name: surgeon_response_exactly_at_limit_is_compliant
        grounds:
          - calculations.response_time_compliance
          - entities.ResponseLog.fields.response_minutes
          - entities.ResponseLog.fields.compliance_status
          - entities.ActivationCriteriaTier.fields.surgeon_response_limit_minutes
        distinguishing_aspect: |
          The comparison is inclusive: a surgeon arriving exactly 15.00 minutes after notification is
          COMPLIANT, while 15 minutes 36 seconds rounds to 15.60 and is LATE — one hundredth of a
          minute either side of the tier limit decides the outcome and whether a DELAYED_SURGEON PIEvent
          is opened.
        test_recipe:
          setup:
            - "one trauma center with a TIER_1_FULL tier whose surgeon_response_limit_minutes is 15 and specialty limit is 30"
            - "two INCLUDED cases MRN-R1 and MRN-R2, both PENDING and UNREVIEWED"
            - "no PI events exist, so open_pi_event_count is 0 and the posture is READY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Clearwater Trauma", state_code: "FL", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { tier_full: $.data.id }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-R1", arrival_at: "2026-07-26T08:00:00Z", injury_severity_score: 26, los_hours: 120.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k1: $.data.id }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-R2", arrival_at: "2026-07-27T08:00:00Z", injury_severity_score: 28, los_hours: 120.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k2: $.data.id }
          trigger:
            - call: "POST /registry-cases/${k1}/response-logs"
              payload: { responder_role: "SURGEON", responder_user_id: "u_surgeon_1", notified_at: "2026-07-26T08:00:00Z", arrived_at: "2026-07-26T08:15:00Z" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { log_ok: $.data.id }
            - call: "POST /registry-cases/${k2}/response-logs"
              payload: { responder_role: "SURGEON", responder_user_id: "u_surgeon_1", notified_at: "2026-07-27T09:00:00Z", arrived_at: "2026-07-27T09:15:36Z" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { log_late: $.data.id }
          assert:
            - "ResponseLog.${log_ok}.response_minutes == 15.00, applicable_limit_minutes == 15 and compliance_status == COMPLIANT"
            - "ResponseLog.${log_late}.response_minutes == 15.60, applicable_limit_minutes == 15 and compliance_status == LATE"
            - "GET /pi-events?center_id=${c1} returns exactly one PIEvent, with event_type == DELAYED_SURGEON and origin == SYSTEM_AUTO — the compliant log created none"
            - "TraumaCenter.${c1}.open_pi_event_count == 1 and TraumaCenter.${c1}.readiness_posture == READY"
      - name: submit_accepted_when_readiness_lands_exactly_on_seventy
        grounds:
          - validations[priority=70]
          - calculations.verification_readiness_score
          - state_machines.VerificationCycle.PREP_to_SUBMITTED
          - entities.VerificationCycle.fields.readiness_score
        distinguishing_aspect: |
          SUBMIT_MIN_READINESS is a >= gate: with two TYPE_II_MAJOR deficiencies (12) and the full
          national outreach gap (18.00) the score is exactly 70.00 and the submission succeeds; a single
          extra TYPE_III_MINOR would make it 68.00 and be refused.
        test_recipe:
          setup:
            - "one trauma center with zero verified outreach hours and registry_compliance_score 100.00"
            - "one NATIONAL_VERIFICATION cycle in PREP with exactly two OPEN TYPE_II_MAJOR deficiencies and readiness_score 70.00"
            - "no PI events, so readiness_posture is READY and the posture gate at priority 50 passes"
          setup_api_calls:
