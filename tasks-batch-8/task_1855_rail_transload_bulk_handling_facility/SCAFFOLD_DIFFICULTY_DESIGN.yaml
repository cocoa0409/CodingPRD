  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_release
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_UNPAID_CHARGES]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a SPOTTED (not
          READY_FOR_RELEASE) car whose customer has an ISSUED unpaid invoice is
          released -> the priority-5 state check wins with ERR_INVALID_STATE
          (409), never the priority-13 fiscal ERR_UNPAID_CHARGES (402).
        test_recipe:
          setup:
            - "Facility (free_switches_per_period 0); customer; clean=false product; lot; track cap 1; car ARRIVED with spot order SCHEDULED (which created an 18500-cent ACCRUED SWITCHING charge); invoice covering the charge ISSUED (unpaid); car executed -> SPOTTED (not READY)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-P1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "80001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/invoices", payload: { customer_id: "${cust}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z" }, as: BillingClerk, captures: { inv: $.data.id } }
            - { call: "POST /transload/invoices/${inv}/issue", payload: {}, as: BillingClerk }
          trigger:
            - { call: "POST /transload/railcars/${car}/release", payload: {}, as: YardMaster, captures: { err: $.data.error_id } }
          assert:
            - "release rejected with error_id == ERR_INVALID_STATE (HTTP 409), not ERR_UNPAID_CHARGES (402)"
            - "Railcar.placement_status remains SPOTTED; Invoice.status remains ISSUED (no side effects fired)"
      - name: safety_beats_credit_on_activate
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_FACILITY_SUSPENDED]
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal (different pair than
          state vs fiscal): with posture SUSPENDED and customer on CREDIT_HOLD,
          transfer activation is rejected with ERR_FACILITY_SUSPENDED (priority
          7 safety), never ERR_CREDIT_HOLD (priority 12 fiscal).
        test_recipe:
          setup:
            - "Facility; customer later set to CREDIT_HOLD; clean=false product; lot; track cap 1; equipment; car SPOTTED; PLANNED transfer order; CRITICAL incident open so posture == SUSPENDED; customer credit_standing == CREDIT_HOLD."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-P2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-1", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "80002", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 10.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/incidents", payload: { severity: "CRITICAL", description: "Derail" }, as: SafetyOfficer }
            - { call: "PATCH /transload/customers/${cust}", payload: { credit_standing: "CREDIT_HOLD" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator, captures: { err: $.data.error_id } }
          assert:
            - "activate rejected with error_id == ERR_FACILITY_SUSPENDED (HTTP 409), not ERR_CREDIT_HOLD"
            - "TransferOrder.status remains PLANNED; Equipment.status remains AVAILABLE"
  # =====================================================================
  # Rule 6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: demurrage_free_minute_boundary
        grounds:
          - calculations.demurrage_accrual
          - entities.Railcar.fields.demurrage_billable_days
        distinguishing_aspect: |
          Metric = demurrage minutes on GET /transload/railcars/{id}: elapsed
          exactly 2880 minutes (== free) yields 0 billable days / 0 cents, while
          2881 minutes yields ceil(1/1440) = 1 day / 7500 cents — the boundary
          is inclusive-free (max(0, elapsed - free) with ceil only above 0).
        test_recipe:
          setup:
            - "Facility (free_demurrage_hours 48 -> 2880 min); customer CONSTRUCTIVE GOOD; product; two lots; car A and car B both ARRIVED at 2026-08-03T00:00Z (never spotted; constructive clock runs)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-B1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lotA: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lotB: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lotA}", car_initials: "WATX", car_number: "90001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { carA: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lotB}", car_initials: "WATX", car_number: "90002", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { carB: $.data.id } }
            - { call: "POST /transload/railcars/${carA}/arrive", payload: {}, as: YardMaster }
            - { call: "POST /transload/railcars/${carB}/arrive", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "GET /transload/railcars/${carA}", payload: {}, as: YardMaster, captures: { a_days: $.data.demurrage_billable_days, a_cents: $.data.demurrage_accrued_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:01:00Z" }, as: FacilityAdmin }
            - { call: "GET /transload/railcars/${carB}", payload: {}, as: YardMaster, captures: { b_days: $.data.demurrage_billable_days, b_cents: $.data.demurrage_accrued_cents } }
          assert:
            - "at exactly 2880 elapsed minutes: car A demurrage_billable_days == 0 and demurrage_accrued_cents == 0"
            - "at 2881 elapsed minutes: car B demurrage_billable_days == 1 and demurrage_accrued_cents == 7500"
      - name: payload_exact_vs_over
        grounds:
          - entities.WeightTicket.fields.net_weight_tons
          - errors[ERR_PAYLOAD_EXCEEDED]
          - state_machines.WeightTicket.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          Metric = truck payload tons on POST
          /transload/weight-tickets/{id}/certify (different metric and endpoint
          than the demurrage boundary): net == truck_max_payload_tons exactly is
          accepted (<=), while net exceeding it by 0.001 t is rejected with
          ERR_PAYLOAD_EXCEEDED.
        test_recipe:
          setup:
            - "Facility; customer; clean=false product; lot; track cap 1; equipment; car (60.0 t) SPOTTED; transfer order planned 60.0 t ACTIVE; ticket A net 25.000 (gross 40.000 tare 15.000) max 25.000; ticket B net 25.001 (gross 40.001 tare 15.000) max 25.000."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-B2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "90003", quantity_loaded_tons: 60.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 60.0 }, as: TransferOperator, captures: { to: $.data.id } }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-A", gross_weight_tons: 40.0, tare_weight_tons: 15.0, truck_max_payload_tons: 25.0 }, as: TransferOperator, captures: { wtA: $.data.id, wtA_net: $.data.net_weight_tons } }
            - { call: "POST /transload/transfer-orders/${to}/weight-tickets", payload: { truck_reference: "TRK-B", gross_weight_tons: 40.001, tare_weight_tons: 15.0, truck_max_payload_tons: 25.0 }, as: TransferOperator, captures: { wtB: $.data.id, wtB_net: $.data.net_weight_tons } }
          trigger:
            - { call: "POST /transload/weight-tickets/${wtA}/certify", payload: {}, as: TransferOperator, captures: { wtA_st: $.data.status } }
            - { call: "POST /transload/weight-tickets/${wtB}/certify", payload: {}, as: TransferOperator, captures: { err: $.data.error_id } }
          assert:
            - "ticket A net_weight_tons == 25.0 and certify succeeds: status == CERTIFIED (net == max is allowed)"
            - "ticket B net_weight_tons == 25.001 and certify rejected: error_id == ERR_PAYLOAD_EXCEEDED (HTTP 409)"
            - "TransferOrder.quantity_completed_tons == 25.0 (only ticket A applied)"
  # =====================================================================
  # Rule 7 — cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activate_requires_car_spotted
        grounds:
          - state_machines.TransferOrder.PLANNED_to_ACTIVE
          - errors[ERR_CAR_NOT_SPOTTED]
        distinguishing_aspect: |
          Pair TransferOrder -> Railcar: activation of a PLANNED order is
          rejected with ERR_CAR_NOT_SPOTTED while the car is ARRIVED, and the
          same activation succeeds after the car's spot order executes (car
          SPOTTED) — the valid transition set of TransferOrder depends on
          Railcar.placement_status.
        test_recipe:
          setup:
            - "Facility; customer; clean=false product; lot; track cap 1; equipment; car ARRIVED with a SCHEDULED spot order (window 01:00-05:00, clock 02:00); PLANNED transfer order on the car."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-X1" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Salt", hazard_class: "NON_HAZARDOUS", segregation_group: "CHEMICAL", requires_full_clean: false }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "PUMP-1", equipment_type: "PUMP" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "91001", quantity_loaded_tons: 40.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
            - { call: "POST /transload/railcars/${car}/spot-orders", payload: { expected_railcar_version: "${car_v}", track_id: "${trk}", spot_number: 1, window_start: "2026-08-03T01:00:00Z", window_end: "2026-08-03T05:00:00Z" }, as: YardMaster, captures: { so: $.data.id } }
            - { call: "POST /transload/spot-orders/${so}/schedule", payload: {}, as: YardMaster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T02:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/transfer-orders", payload: { railcar_id: "${car}", equipment_id: "${eq}", quantity_planned_tons: 10.0 }, as: TransferOperator, captures: { to: $.data.id } }
          trigger:
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator, captures: { err: $.data.error_id } }
            - { call: "POST /transload/spot-orders/${so}/execute", payload: {}, as: YardMaster }
            - { call: "POST /transload/transfer-orders/${to}/activate", payload: {}, as: TransferOperator, captures: { to_st: $.data.status } }
          assert:
            - "while car ARRIVED: activate rejected error_id == ERR_CAR_NOT_SPOTTED (HTTP 409); TO stays PLANNED; equipment stays AVAILABLE"
            - "after spot execute (car SPOTTED): activate succeeds; TO.status == ACTIVE and Railcar.placement_status == IN_TRANSFER"
      - name: release_blocked_by_derail_and_invoice
        grounds:
          - state_machines.Railcar.READY_FOR_RELEASE_to_RELEASED
          - errors[ERR_DERAIL_ENGAGED]
          - errors[ERR_UNPAID_CHARGES]
        distinguishing_aspect: |
          Pairs Railcar -> Track and Railcar -> Invoice (different pairs than
          TransferOrder -> Railcar): a READY_FOR_RELEASE car cannot release
          while its track's derail device is ENGAGED (ERR_DERAIL_ENGAGED), nor
          while its customer has an ISSUED unpaid invoice (ERR_UNPAID_CHARGES,
          402); clearing both gates lets the same release succeed.
        test_recipe:
          setup:
            - "Facility; customer; product with requires_full_clean=true; lot; track cap 1; car emptied (10.0 t planned/certified) -> EMPTY_AWAITING_CLEANING -> start-cleaning (DETERGENT, 600000-cent charge ACCRUED) -> pass-cleaning -> READY_FOR_RELEASE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /transload/facilities", payload: { name: "FT-X2" }, as: FacilityAdmin }
            - { call: "POST /transload/customers", payload: { name: "C1", allocated_car_spots: 5 }, as: FacilityAdmin, captures: { cust: $.data.id } }
            - { call: "POST /transload/products", payload: { name: "Flour", hazard_class: "FOOD_GRADE", segregation_group: "FOOD_GRAIN", requires_full_clean: true }, as: FacilityAdmin, captures: { prod: $.data.id } }
            - { call: "POST /transload/lots", payload: { customer_id: "${cust}", product_id: "${prod}", sit_daily_rate_cents: 5000 }, as: FacilityAdmin, captures: { lot: $.data.id } }
            - { call: "POST /transload/tracks", payload: { name: "T1", spot_capacity: 1 }, as: FacilityAdmin, captures: { trk: $.data.id } }
            - { call: "POST /transload/equipment", payload: { name: "CONV-1", equipment_type: "CONVEYOR" }, as: FacilityAdmin, captures: { eq: $.data.id } }
            - { call: "POST /transload/railcars", payload: { customer_id: "${cust}", product_id: "${prod}", lot_id: "${lot}", car_initials: "WATX", car_number: "91002", quantity_loaded_tons: 10.0 }, as: YardMaster, captures: { car: $.data.id } }
            - { call: "POST /transload/railcars/${car}/arrive", payload: {}, as: YardMaster, captures: { car_v: $.data.version } }
