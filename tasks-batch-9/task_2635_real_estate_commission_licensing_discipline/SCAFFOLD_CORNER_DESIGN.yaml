          the client's OWN previous affiliation, because each affiliation recomputes
          affiliated_licensee_count and bumps the parent. This is the trap that makes every
          multi-licensee setup in this scaffold re-read the brokerage between affiliations: a
          hardcoded or cached version works for the first affiliation and fails for the second.
