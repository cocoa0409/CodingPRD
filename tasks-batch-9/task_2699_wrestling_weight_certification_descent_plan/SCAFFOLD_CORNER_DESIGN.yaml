# §1.9 Scaffold Corner Design — breadth probe over SCAFFOLD.yaml §1.1–§1.7.
# Section values and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml)
# holds the depth probe and is referenced by `excluded_because:` stubs where a
# corner is already covered there.
#
# Pinned fixture arithmetic reused across instances (all pre-computed with
# Decimal / ROUND_HALF_UP against the §1.4 formulas):
#   wrestler A: measured 159.6, body_fat 14.0, male floor 7.0
#     -> lean 137.3, minimum_certified_weight 147.6, min_weight_class 150, alpha 159.6
#   WEEKLY_STEP plan (alpha 159.6, rate 1.5, target 150, start 2026-11-02):
#     w = [159.6, 157.2, 154.8, 152.5, 150.2, 147.9], total_weeks 5, milestone_count 6,
#     effective_date = [11-02, 11-09, 11-16, 11-23, 11-30, 12-07],
#     min_eligible_class = [165, 165, 157, 157, 157, 150],
#     projected_certification_date 2026-12-07
#   max weekly delta = round_half_up(159.6 * 1.5 / 100, 1) = 2.4

scaffold_corner_design:

  # =====================================================================
  # 1. ENTITIES
  # =====================================================================
  - section: entities
    instances:

      - name: season_creation_returns_all_declared_defaults_and_counters
        claim_type: creation
        grounds:
          - entities.Season
          - endpoints[POST /seasons]
          - response_envelope.success
        distinguishing_aspect: "POST /seasons with only the two required inputs returns 201 and every one of the 13 optional tuning constants at its declared default, status SETUP, both computed counters at 0 and version 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_new: $.data.id }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"
            - "Season.name == '2026-27 State Wrestling Season' and Season.start_date == '2026-11-01'"
            - "Season.weight_classes == [106, 113, 120, 126, 132, 138, 144, 150, 157, 165, 175, 190, 215, 285]"
            - "Season.min_body_fat_pct_male == 7.0 and Season.min_body_fat_pct_female == 12.0"
            - "Season.hydration_max_specific_gravity == 1.025 and Season.max_weekly_descent_pct == 1.5"
            - "Season.assessor_min_training_hours == 8 and Season.assessor_daily_assessment_capacity == 3"
            - "Season.audit_fail_threshold_pct == 2.0 and Season.audit_min_sample_count == 3"
            - "Season.max_consecutive_day_allowance_lbs == 2.0 and Season.appeal_filing_window_days == 5"
            - "Season.max_appeal_retest_rounds == 2 and Season.plan_breach_limit == 2"
            - "Season.status == 'SETUP', Season.team_count == 0, Season.certified_wrestler_count == 0"
            - "Season.id is a server-minted string, Season.version == 1, created_at == updated_at"

      - name: wrestler_retrieval_returns_stored_and_certified_figures
        claim_type: retrieval
        grounds:
          - entities.Wrestler
          - endpoints[GET /wrestlers/{id}]
        distinguishing_aspect: "GET /wrestlers/{id} echoes the three input fields unchanged and the five figures copied from the source assessment (147.6 / 150 / 159.6 / 14.0) together with both state dimensions."
        test_recipe:
          setup:
            - "Open season, one team, one CERTIFIED assessor, wrestler A assessed at 159.6 lbs / 14.0% body fat and certified through a certified WEEKLY_STEP plan."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_a: $.data.id }
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wa_ver_1: $.data.version }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver_1}" }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { plan_p1: $.data.id }
            - call: "POST /descent-plans/${plan_p1}/certify"
              payload: {}
              as: StateOffice
          trigger:
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: StateOffice
          assert:
            - "HTTP 200 and Wrestler.id == ${wrestler_a}"
            - "Wrestler.full_name == 'Alex Mercer', Wrestler.sex == 'M', Wrestler.grade == 11, Wrestler.team_id == ${team_id}"
            - "Wrestler.certification_status == 'CERTIFIED' and Wrestler.eligibility_status == 'ELIGIBLE'"
            - "Wrestler.source_assessment_id == ${assess_a}"
            - "Wrestler.alpha_weight_lbs == 159.6 and Wrestler.body_fat_pct == 14.0"
            - "Wrestler.minimum_certified_weight_lbs == 147.6 and Wrestler.min_weight_class_lbs == 150"
            - "Wrestler.open_health_flag_count == 0, disqualified_at == null, certification_hold_reason == null"

      - name: assessments_listing_paginates_and_filters
        claim_type: listing
        grounds:
          - endpoints[GET /assessments]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three DRAFT assessments of one wrestler paginate as 2 + 1 with total_count 3 across both pages, and has_more flips true -> false at the last page."
        test_recipe:
          setup:
            - "Open season, one team, one CERTIFIED assessor, wrestler A with exactly three DRAFT assessments recorded on 2026-11-01 (the assessor's daily capacity is 3, so all three are accepted)."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T07:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_1: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "BIA", assessed_at: "2026-11-01T08:00:00Z", measured_weight_lbs: 159.4, body_fat_pct: 14.2, urine_specific_gravity: 1.019 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_2: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.2, body_fat_pct: 14.4, urine_specific_gravity: 1.018 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_3: $.data.id }
          trigger:
            - call: "GET /assessments?wrestler_id=${wrestler_a}&status=DRAFT&limit=2&offset=0"
              payload: {}
              as: StateOffice
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /assessments?wrestler_id=${wrestler_a}&status=DRAFT&limit=2&offset=2"
              payload: {}
              as: StateOffice
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "First call: HTTP 200, response_type == 'array', data length == 2, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "Second call: data length == 1, limit == 2, offset == 2, total_count == 3, has_more == false"
            - "The three ids returned across both pages are exactly {${assess_1}, ${assess_2}, ${assess_3}} with no repeats"
            - "Every returned row has status == 'DRAFT' and wrestler_id == ${wrestler_a}"

      - name: unknown_ids_on_every_read_endpoint_return_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_SEASON_NOT_FOUND]
          - errors[ERR_TEAM_NOT_FOUND]
          - errors[ERR_ASSESSOR_NOT_FOUND]
          - errors[ERR_WRESTLER_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_APPEAL_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_EVENT_NOT_FOUND]
          - errors[ERR_ENTRY_NOT_FOUND]
          - errors[ERR_WEIGH_IN_NOT_FOUND]
          - errors[ERR_ELIGIBILITY_CHECK_NOT_FOUND]
          - errors[ERR_HEALTH_FLAG_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
        distinguishing_aspect: "Each of the 13 single-row GET endpoints answers a syntactically valid but unknown UUID with its own entity-specific 404 error_id, never a generic 404 or a 500."
        test_recipe:
          setup:
            - "Empty database — no row of any entity exists, so every id below is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /seasons/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: StateOffice
              captures: { e_season: $.data.error_id }
            - call: "GET /teams/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: StateOffice
              captures: { e_team: $.data.error_id }
            - call: "GET /assessors/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: StateOffice
              captures: { e_assessor: $.data.error_id }
            - call: "GET /wrestlers/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: StateOffice
              captures: { e_wrestler: $.data.error_id }
            - call: "GET /assessments/00000000-0000-0000-0000-0000000000a5"
              payload: {}
              as: StateOffice
              captures: { e_assessment: $.data.error_id }
            - call: "GET /appeals/00000000-0000-0000-0000-0000000000a6"
              payload: {}
              as: StateOffice
              captures: { e_appeal: $.data.error_id }
            - call: "GET /descent-plans/00000000-0000-0000-0000-0000000000a7"
              payload: {}
              as: StateOffice
              captures: { e_plan: $.data.error_id }
            - call: "GET /events/00000000-0000-0000-0000-0000000000a8"
              payload: {}
              as: StateOffice
              captures: { e_event: $.data.error_id }
            - call: "GET /entries/00000000-0000-0000-0000-0000000000a9"
              payload: {}
              as: StateOffice
              captures: { e_entry: $.data.error_id }
            - call: "GET /weigh-ins/00000000-0000-0000-0000-0000000000b1"
              payload: {}
              as: StateOffice
              captures: { e_weigh_in: $.data.error_id }
            - call: "GET /eligibility-checks/00000000-0000-0000-0000-0000000000b2"
              payload: {}
              as: StateOffice
              captures: { e_check: $.data.error_id }
            - call: "GET /health-flags/00000000-0000-0000-0000-0000000000b3"
              payload: {}
              as: StateOffice
              captures: { e_flag: $.data.error_id }
            - call: "GET /audits/00000000-0000-0000-0000-0000000000b4"
              payload: {}
              as: StateOffice
              captures: { e_audit: $.data.error_id }
          assert:
            - "Every one of the 13 calls returns HTTP 404 with response_type == 'error' and a non-empty data.message"
            - "${e_season} == 'ERR_SEASON_NOT_FOUND', ${e_team} == 'ERR_TEAM_NOT_FOUND', ${e_assessor} == 'ERR_ASSESSOR_NOT_FOUND'"
            - "${e_wrestler} == 'ERR_WRESTLER_NOT_FOUND', ${e_assessment} == 'ERR_ASSESSMENT_NOT_FOUND', ${e_appeal} == 'ERR_APPEAL_NOT_FOUND'"
            - "${e_plan} == 'ERR_PLAN_NOT_FOUND', ${e_event} == 'ERR_EVENT_NOT_FOUND', ${e_entry} == 'ERR_ENTRY_NOT_FOUND'"
            - "${e_weigh_in} == 'ERR_WEIGH_IN_NOT_FOUND', ${e_check} == 'ERR_ELIGIBILITY_CHECK_NOT_FOUND'"
            - "${e_flag} == 'ERR_HEALTH_FLAG_NOT_FOUND', ${e_audit} == 'ERR_AUDIT_NOT_FOUND'"

      - name: wrestler_creation_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - entities.Wrestler.fields.full_name
          - entities.Wrestler.fields.sex
          - entities.Wrestler.fields.grade
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Each of the three input fields of Wrestler is individually required: omitting any one returns ERR_INVALID_REQUEST (400) and creates no row, so Team.roster_count stays 0."
        test_recipe:
          setup:
            - "Open season with one team; no wrestler exists yet."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
          trigger:
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { e_no_name: $.data.error_id }
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { e_no_sex: $.data.error_id }
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M" }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { e_no_grade: $.data.error_id }
            - call: "GET /teams/${team_id}"
              payload: {}
              as: StateOffice
          assert:
            - "All three POSTs return HTTP 400 with ${e_no_name} == ${e_no_sex} == ${e_no_grade} == 'ERR_INVALID_REQUEST'"
            - "Team.roster_count == 0 and Team.version == 1 after the three rejected calls"
            - "GET /wrestlers?team_id=${team_id} returns total_count == 0"

      - name: event_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Event.fields.competition_days
          - entities.Event.fields.weigh_in_days
          - entities.Event.fields.consecutive_day_allowance_lbs
          - endpoints[POST /seasons/{id}/events]
        distinguishing_aspect: "Omitting the three optional Event inputs yields competition_days 1, weigh_in_days 1 and consecutive_day_allowance_lbs 1.0, with all four bracket counters at 0 and both booleans false."
        test_recipe:
          setup:
            - "Open season with no events."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
          trigger:
            - call: "POST /seasons/${season_id}/events"
              payload: { name: "Northgate Duals", event_type: "DUAL", event_date: "2026-11-04" }
              as: StateOffice
              captures: { event_id: $.data.id }
          assert:
            - "HTTP 201, Event.season_id == ${season_id}, Event.event_date == '2026-11-04', Event.event_type == 'DUAL'"
            - "Event.competition_days == 1, Event.weigh_in_days == 1, Event.consecutive_day_allowance_lbs == 1.0"
            - "Event.status == 'SCHEDULED', Event.bracket_locked == false, Event.reseed_required == false"
            - "Event.entry_count == 0, Event.weighed_in_count == 0, Event.seeded_entry_count == 0, Event.seed_integrity_sum == 0"
            - "Event.version == 1"

      - name: assessment_computed_figures_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Assessment.fields.lean_body_weight_lbs
          - entities.Assessment.fields.minimum_certified_weight_lbs
          - entities.Assessment.fields.min_weight_class_lbs
          - entities.Assessment.fields.alpha_weight_lbs
          - calculations.minimum_certified_weight
        distinguishing_aspect: "Client-supplied values for the four computed assessment figures and for status are discarded: creation leaves all four null in DRAFT, and finalize writes 137.3 / 147.6 / 150 / 159.6 from the formula."
        test_recipe:
          setup:
            - "Open season, one team, one CERTIFIED assessor, one UNCERTIFIED wrestler."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
          trigger:
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020, lean_body_weight_lbs: 999.9, minimum_certified_weight_lbs: 1.0, min_weight_class_lbs: 106, alpha_weight_lbs: 0.1, status: "VALIDATED", hydration_passed: false }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_a: $.data.id }
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
          assert:
            - "Creation response: Assessment.status == 'DRAFT' (the supplied 'VALIDATED' is ignored)"
            - "Creation response: lean_body_weight_lbs, minimum_certified_weight_lbs, min_weight_class_lbs, alpha_weight_lbs and hydration_passed are all null"
            - "Finalize response: Assessment.status == 'VALIDATED' and hydration_passed == true"
            - "Finalize response: lean_body_weight_lbs == 137.3 (round_half_up(159.6 * 0.86, 1)), not 999.9"
            - "Finalize response: minimum_certified_weight_lbs == 147.6 (round_half_up(137.3 / 0.93, 1)), not 1.0"
            - "Finalize response: min_weight_class_lbs == 150 and alpha_weight_lbs == 159.6, not 106 and 0.1"

      - name: team_system_fields_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Team.fields.roster_count
          - entities.Team.fields.compliance_status
          - entities.Season.fields.team_count
        distinguishing_aspect: "id, created_at, updated_at, version and the three computed Team fields are all server-generated: supplying them in the POST body changes nothing and Season.team_count still moves 0 -> 1."
        test_recipe:
          setup:
            - "Open season with no teams."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
          trigger:
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High", id: "11111111-1111-1111-1111-111111111111", created_at: "2000-01-01T00:00:00Z", updated_at: "2000-01-01T00:00:00Z", version: 47, roster_count: 99, open_flag_severity_total: 12, compliance_status: "PROBATION" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: StateOffice
          assert:
            - "HTTP 201 and Team.id != '11111111-1111-1111-1111-111111111111'"
            - "Team.version == 1 and Team.created_at is the current logical clock instant, not '2000-01-01T00:00:00Z'"
            - "Team.roster_count == 0, Team.open_flag_severity_total == 0, Team.compliance_status == 'CLEAR'"
            - "Season.team_count == 1"

      - name: wrestler_creation_invalid_enum_and_range_rejected
        claim_type: type_constraints
        grounds:
