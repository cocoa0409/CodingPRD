  - rule_id: boundary_precision_check
    instances:
      - name: grant_utilization_equality_boundary
        grounds:
          - calculations.grant_utilization
          - validations[priority=19]
          - errors.ERR_GRANT_EXHAUSTED
        distinguishing_aspect: |
          Metric: integer-cents fiscal capacity. The boundary is EXACT
          equality: reservation bringing utilization to exactly amount_cents
          succeeds and flips the grant to EXHAUSTED; one cent more is
          rejected. Reached through POST /archive/budget-lines.
        test_recipe:
          setup:
            - "Grant G4 amount_cents 7777 OPEN."
          setup_api_calls:
            - call: "POST /archive/funding-grants"
              payload: { donor_name: "Sloan", amount_cents: 7777 }
              as: FinanceAdmin
              captures: { grant4: $.data.id }
          trigger:
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant4}", category: "STORAGE", budget_reservation_cents: 7777 }
              as: FinanceAdmin
              captures: { bl_ok: $.data.id }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant4}", category: "BANDWIDTH", budget_reservation_cents: 1 }
              as: FinanceAdmin
              captures: { bl_over: $.data.error_id }
          assert:
            - "the 7777-cent reservation succeeds: BudgetLine.${bl_ok}.status == OPEN and FundingGrant.${grant4}.status == EXHAUSTED"
            - "FundingGrant.${grant4}.reserved_cents == 7777 and spent_cents == 0"
            - "the 1-cent overflow is rejected with bl_over == ERR_GRANT_EXHAUSTED (strictly-greater rejects; equality is allowed)"
      - name: strike_count_third_expiry_suspension_boundary
        grounds:
          - calculations.patron_loan_cap
