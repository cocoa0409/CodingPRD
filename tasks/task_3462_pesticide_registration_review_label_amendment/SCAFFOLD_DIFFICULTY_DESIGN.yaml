  - rule_id: cross_entity_state_dependency
    instances:

      - name: state_grant_blocked_while_product_under_review
        grounds:
          - state_machines.StateRegistration.SUBMITTED_to_GRANTED
          - state_machines.Product.REGISTERED_to_UNDER_REVIEW
          - errors.ERR_PRODUCT_NOT_REGISTERED
        distinguishing_aspect: |
          Entity pair StateRegistration x Product: a state grant decision is gated on
          the product's CURRENT federal status at decision time — SUBMITTED while the
          product is REGISTERED, the decision fails with ERR_PRODUCT_NOT_REGISTERED
          once the product flips UNDER_REVIEW (review case opened), and succeeds after
          the case completes back to REGISTERED.
        test_recipe:
          setup:
            - "NON_FOOD_USE GENERAL_USE product REGISTERED. StateRegistration IA SUBMITTED. Manual review case scheduled [2027-01-05, 2027-07-04); clock advanced to 2027-01-05T00:00:00Z so the case is OPEN and the product UNDER_REVIEW."
