          Two coupons carry serial SER-1. The one captured FIRST is adjudicated
          SECOND, and the ranking key is adjudicated_at ASC (created_at only
          breaks ties), so the later-captured item wins the serial and the
          earlier-captured one is rejected pointing at it. A capture-order
          implementation would reverse both verdicts and the duplicate_of_item_id
