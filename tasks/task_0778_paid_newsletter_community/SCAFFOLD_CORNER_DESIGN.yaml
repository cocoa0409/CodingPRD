# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Paid-Newsletter & Membership Community — Expert
# Breadth probe across §1.1–§1.7; excludes corners already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ------------------------------- Entities ---------------------------------
  - section: entities
    instances:
      - name: create_publication_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Publication.fields.id, entities.Publication.fields.status]
        distinguishing_aspect: "POST /publications with {name} returns 201; id/created_at/updated_at/version are system-minted, status defaults ACTIVE, deliverability_status HEALTHY, platform_fee_bps defaults 1000."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id, v: $.data.version }
          assert:
            - "Response HTTP status == 201"
            - "Publication.${pub_id}.status == ACTIVE"
            - "Publication.${pub_id}.deliverability_status == HEALTHY"
            - "Publication.${pub_id}.platform_fee_bps == 1000"
            - "Publication.${pub_id}.version == 1"

      - name: member_default_status_pending_and_token_issued
        claim_type: Defaults
        grounds: [entities.Member.fields.status, entities.Member.fields.verification_token]
        distinguishing_aspect: "A new member has status PENDING and a non-null verification_token; email_bounced defaults false."
        test_recipe:
          setup: ["a publication"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.status == PENDING"
            - "Member.${m_id}.email_bounced == false"

      - name: computed_tier_is_free_true_for_rank_zero
        claim_type: Computed Fields
        grounds: [entities.Tier.fields.is_free]
        distinguishing_aspect: "A tier with tier_rank 0 / price 0 has computed is_free == true; a paid tier has is_free == false."
        test_recipe:
          setup: ["a publication"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Free", tier_rank: 0, monthly_price_cents: 0, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { t_id: $.data.id }
          assert:
            - "Tier.${t_id}.is_free == true"

      - name: create_tier_missing_required_returns_422
        claim_type: Required Fields
        grounds: [entities.Tier.fields.tier_rank, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST tiers omitting the required tier_rank field is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["a publication"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Bad", monthly_price_cents: 1000 }
              as: Creator
              as_user_id: "creator_1"
          assert:
            - "Response HTTP status == 422"
            - "Response data.error_id == ERR_VALIDATION"

      - name: member_email_unique_per_publication_returns_409
        claim_type: Type Constraints
        grounds: [entities.Member.fields.email, "errors[ERR_EMAIL_TAKEN]"]
        distinguishing_aspect: "Registering a second member with an email already used in the same publication is rejected with ERR_EMAIL_TAKEN (409)."
        test_recipe:
          setup: ["a publication with a member m@x.com"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
          trigger:
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M2" }
              as: Anonymous
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == ERR_EMAIL_TAKEN"

      - name: tier_rank_unique_per_publication_returns_409
        claim_type: Type Constraints
        grounds: [entities.Tier.fields.tier_rank, "errors[ERR_TIER_RANK_TAKEN]"]
        distinguishing_aspect: "Creating a second tier with an already-used tier_rank in the same publication is rejected with ERR_TIER_RANK_TAKEN (409)."
        test_recipe:
          setup: ["a publication with a tier at rank 1"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Plus", tier_rank: 1, monthly_price_cents: 1000, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
          trigger:
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Plus2", tier_rank: 1, monthly_price_cents: 2000, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == ERR_TIER_RANK_TAKEN"

      - name: get_member_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{unknown} returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: get_publication_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PUBLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /publications/{unknown} returns ERR_PUBLICATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /publications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_PUBLICATION_NOT_FOUND"

      - name: get_subscription_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_SUBSCRIPTION_NOT_FOUND]"]
        distinguishing_aspect: "GET /subscriptions/{unknown} returns ERR_SUBSCRIPTION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /subscriptions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_SUBSCRIPTION_NOT_FOUND"

      - name: settle_payout_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PAYOUT_NOT_FOUND]"]
        distinguishing_aspect: "POST /payouts/{unknown}/settle returns ERR_PAYOUT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /payouts/00000000-0000-0000-0000-000000000000/settle"
              payload: { outcome: "PAID" }
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_PAYOUT_NOT_FOUND"

      - name: moderate_comment_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_COMMENT_NOT_FOUND]"]
        distinguishing_aspect: "POST /comments/{unknown}/moderate returns ERR_COMMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /comments/00000000-0000-0000-0000-000000000000/moderate"
              payload: { decision: "APPROVE" }
              as: Creator
              as_user_id: "creator_1"
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_COMMENT_NOT_FOUND"

      - name: get_registration_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_REGISTRATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /registrations/{unknown} returns ERR_REGISTRATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /registrations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_REGISTRATION_NOT_FOUND"

      - name: register_nonexistent_event_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "POST /events/{unknown}/registrations returns ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /events/00000000-0000-0000-0000-000000000000/registrations"
              payload: {}
              as: Member
              as_user_id: "member_x"
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_EVENT_NOT_FOUND"

      - name: get_post_content_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_POST_NOT_FOUND]"]
        distinguishing_aspect: "GET /posts/{unknown}/content returns ERR_POST_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /posts/00000000-0000-0000-0000-000000000000/content"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_POST_NOT_FOUND"

      - name: get_invoice_nonexistent_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_INVOICE_NOT_FOUND]"]
        distinguishing_aspect: "GET /invoices/{unknown} returns ERR_INVOICE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /invoices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_INVOICE_NOT_FOUND"

      - name: change_tier_nonexistent_tier_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_TIER_NOT_FOUND]"]
        distinguishing_aspect: "change-tier to an unknown tier_id returns ERR_TIER_NOT_FOUND (404)."
        test_recipe:
          setup: ["a member with an ACTIVE free subscription"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Free", tier_rank: 0, monthly_price_cents: 0, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { free_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${free_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/change-tier"
              payload: { new_tier_id: "00000000-0000-0000-0000-000000000000", expected_subscription_version: "${sub_v}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Response HTTP status == 404"
            - "Response data.error_id == ERR_TIER_NOT_FOUND"

  # ---------------------------- State Machines ------------------------------
  - section: state_machines
    instances:
      - name: moderate_terminal_rejected_comment_invalid_state_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Comment.PENDING_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED comment (terminal) cannot be moderated again; a second APPROVE is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a PENDING comment moderated to REJECTED"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Free", tier_rank: 0, monthly_price_cents: 0, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { free_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${free_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /publications/${pub_id}/posts"
              payload: { title: "T", body: "B", content_type: "POST", min_tier_rank: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { post_id: $.data.id }
            - call: "POST /posts/${post_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
            - call: "POST /posts/${post_id}/comments"
              payload: { body: "hi" }
              as: Member
              as_user_id: "${m_id}"
              captures: { cmt_id: $.data.id }
            - call: "POST /comments/${cmt_id}/moderate"
              payload: { decision: "REJECT" }
              as: Creator
              as_user_id: "creator_1"
          trigger:
            - call: "POST /comments/${cmt_id}/moderate"
              payload: { decision: "APPROVE" }
              as: Creator
              as_user_id: "creator_1"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == ERR_INVALID_STATE"

      - name: settle_already_paid_payout_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Payout.REQUESTED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a payout that is already PAID (terminal) again is rejected with ERR_INVALID_STATE (409); balances are not double-moved."
        test_recipe:
          setup: ["a PAID payout drawn from a 2250 balance"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_v: $.data.version }
            - call: "POST /publications/${pub_id}/payouts"
              payload: { amount_cents: 2250, expected_publication_version: "${pub_v}" }
              as: Creator
              as_user_id: "creator_1"
              captures: { payout_id: $.data.id }
            - call: "POST /payouts/${payout_id}/settle"
              payload: { outcome: "PAID" }
              as: PlatformAdmin
          trigger:
            - call: "POST /payouts/${payout_id}/settle"
              payload: { outcome: "PAID" }
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == ERR_INVALID_STATE"
            - "Publication.${pub_id}.lifetime_paid_out_cents == 2250"

      - name: renew_before_period_end_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Subscription.ACTIVE_to_ACTIVE, "errors[ERR_PERIOD_NOT_ENDED]"]
        distinguishing_aspect: "Calling renew while clock < current_period_end is rejected with ERR_PERIOD_NOT_ENDED (409)."
        test_recipe:
          setup: ["an ACTIVE PRO subscription with period ending 2026-03-31; clock 2026-03-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "P", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/renew"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == ERR_PERIOD_NOT_ENDED"

      - name: reactivate_after_winback_window_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Subscription.CANCELED_to_ACTIVE, "errors[ERR_WINBACK_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Reactivating a CANCELED subscription after canceled_at + 30 days is rejected with ERR_WINBACK_WINDOW_EXPIRED (409)."
        test_recipe:
          setup: ["a PRO subscription canceled at 2026-03-01; clock advanced to 2026-05-01 (> 30 days later)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "P", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/reactivate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == ERR_WINBACK_WINDOW_EXPIRED"

      - name: comment_reject_from_pending_sets_reason
        claim_type: Valid Transition
        grounds: [state_machines.Comment.PENDING_to_REJECTED, entities.Comment.fields.moderation_reason]
        distinguishing_aspect: "Moderating a PENDING comment with decision REJECT moves it to REJECTED (terminal)."
        test_recipe:
          setup: ["a PENDING comment from an active free member"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Free", tier_rank: 0, monthly_price_cents: 0, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { free_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${free_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /publications/${pub_id}/posts"
              payload: { title: "T", body: "B", content_type: "POST", min_tier_rank: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { post_id: $.data.id }
            - call: "POST /posts/${post_id}/publish"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
