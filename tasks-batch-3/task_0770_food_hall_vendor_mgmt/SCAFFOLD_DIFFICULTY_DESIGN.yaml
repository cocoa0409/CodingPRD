          - endpoints[POST /seating-allocations]
        distinguishing_aspect: "Seat-count boundary on POST /seating-allocations: with 70 concurrent seats reserved, a 30-seat request (sum==100==capacity) is admitted while a 31-seat request (sum==101) is rejected - the <= boundary, on the seats metric."
