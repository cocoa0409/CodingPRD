            - "Logical clock at 2026-06-15T00:00:00Z and the PARKS category version captured for the OCC guard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
