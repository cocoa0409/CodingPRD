        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LeaseAgreement[APPROVED -> WITHDRAWN]
          - endpoints[POST /wetlease/leases/{leaseId}/withdraw]
          - validations[priority 41 ERR_LEASE_INVALID_STATE]
          - state_machines.CrewQualification[QUALIFIED -> REVOKED]
        distinguishing_aspect: |
          WITHDRAWN is an absorbing state reached from the pre-operational side of the lifecycle, and it
          is not a soft cancel: the authority docket is pulled to REVOKED and every QUALIFIED crew
          qualification on the lease is REVOKED in the same request. Because the lease was never
          activated the airframe was never assigned, so it must still read AVAILABLE with
          assigned_lease_id null rather than being "released" a second time. Both an activate and a
