# =============================================================================
# Task 1897 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances. Every literal below was computed by executing the
# §1.3 formulas. Shared fixtures:
#   RULE_CA: {state_code: CA, min_percent_funded_pct: 50, allowed_plan_types:
#             [BASELINE, THRESHOLD, FULL], site_visit_interval_years: 3,
#             disclosure_deadline_days: 30, annual_update_required: true}
#   RULE_NV: same but state_code NV, min_percent_funded_pct 0,
#             annual_update_required false
#   F1 study: fiscal_year 2026, study_type FULL, inflation 0.03, interest 0.02,
#             association fiscal_year_end_month 12, cash 500000, contribution 0,
#             components C1 (UL 5, RUL 2, 100000) + C2 (UL 4, RUL 1, 50000).
#   Logical clock default 2026-08-01T00:00:00Z (FY2026 when end month is 12).
# =============================================================================

scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: funding_plan_variants_diverge
        grounds:
          - calculations.funding_plan_contribution
          - calculations.component_replacement_schedule
          - entities.FundingPlan.fields.annual_contribution_cents
        distinguishing_aspect: |
          Dual-variant logic on the funding-plan entity domain: identical component
          data, cash, and rates yield three different solved contributions —
          BASELINE 28825, THRESHOLD 31820 (floor 123964), FULL 33077 — because only
          the per-year floor function changes.
        test_recipe:
          setup:
            - "RULE_CA exists; association (cash 500000, end month 12, contribution 0)"
            - "F1 study in DRAFT with C1 (UL 5, RUL 2, 100000) and C2 (UL 4, RUL 1, 50000), both ACTIVE included"
            - "no site visit needed (no submit in this instance)"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Harbor Oaks HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000, current_annual_contribution_cents: 0 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Paving", category: "PAVING", useful_life_years: 4, remaining_useful_life_years: 1, current_replacement_cost_cents: 50000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv2: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "THRESHOLD", expected_study_version: "${sv2}" }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv3: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "FULL", expected_study_version: "${sv3}" }
              as: ReserveSpecialist
          trigger:
            - call: "GET /reserve-studies/${s1}/funding-plans"
              as: ReserveSpecialist
              captures: { c_base: "$.data[0].annual_contribution_cents", c_thr: "$.data[1].annual_contribution_cents", t_floor: "$.data[1].threshold_floor_cents", c_full: "$.data[2].annual_contribution_cents" }
          assert:
            - "c_base == 28825"
            - "c_thr == 31820"
            - "t_floor == 123964"
            - "c_full == 33077"
            - "c_base != c_thr and c_thr != c_full and c_base != c_full"

      - name: expenditure_variance_chronological_vs_forward
        grounds:
          - calculations.expenditure_variance_reconciliation
          - entities.Expenditure.fields.planned_chronological_cents
          - entities.Expenditure.fields.planned_forward_cents
        distinguishing_aspect: |
          Dual-variant logic on the expenditure-reconciliation entity domain
          (distinct from funding plans): one expenditure carries two planned
          amounts — CHRONOLOGICAL 100000 (anchored to the SUPERSEDED FY2026 study,
          inflation 0.03) vs FORWARD_LOOKING 90909 (anchored to the current ADOPTED
          FY2027 study, inflation 0.10) — diverging because the anchor studies differ.
        test_recipe:
          setup:
            - "RULE_CA; association cash 1000000, contribution 0, end month 12"
            - "study S1 FY2026 FULL inflation 0.03 ADOPTED with component X (UL 5, RUL 2, 100000), then SUPERSEDED"
            - "study S2 FY2027 UPDATE_NO_VISIT inflation 0.10 ADOPTED with component Y (UL 5, RUL 2, 100000)"
            - "expenditure on Y, amount 105000, incurred 2026-03-10 (FY2026), PLANNED_REPLACEMENT, APPROVED"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Twin Peaks HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 1000000, current_annual_contribution_cents: 0 }
              as: ReserveSpecialist
              captures: { a2: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a2}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a2}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a2}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /reserve-studies"
              payload: { association_id: "${a2}", fiscal_year: 2027, study_type: "UPDATE_NO_VISIT", inflation_rate: 0.10, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s2: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s2}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { cy: $.data.id }
            - call: "GET /associations/${a2}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv2: "$.data[1].version"}
            - call: "POST /reserve-studies/${s2}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv2}" }
              as: ReserveSpecialist
              captures: { p2: $.data.id }
            - call: "POST /reserve-studies/${s2}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p2}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s2}/adopt"
              as: BoardMember
            - call: "POST /expenditures"
              payload: { association_id: "${a2}", component_id: "${cy}", amount_cents: 105000, incurred_date: "2026-03-10", kind: "PLANNED_REPLACEMENT" }
              as: AssociationManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /expenditures/${e1}/approve"
              as: BoardMember
              captures: { pl_ch: $.data.planned_chronological_cents, v_ch: $.data.variance_chronological_cents, pl_fw: $.data.planned_forward_cents, v_fw: $.data.variance_forward_cents, rec: $.data.reconciliation_status }
          assert:
            - "pl_ch == 100000"
            - "v_ch == 5000"
            - "pl_fw == 90909"
            - "v_fw == 14091"
            - "rec == MATCHED (|5000| <= max(500, round_half_up(0.10*100000)) = 10000)"
            - "pl_ch != pl_fw — same expenditure, two anchor studies, two planned amounts"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: threshold_floor_multi_input_solve
        grounds:
          - calculations.funding_plan_contribution
          - calculations.component_replacement_schedule
        distinguishing_aspect: |
          Combinatorial mode (a): the THRESHOLD solve combines 5 inputs (starting
          cash, 12-event inflated outflow schedule, inflation, interest, peak ratio)
          with non-linear interaction (max over years -> fixed floor -> minimal-C
          bisection); pinned outputs floor 123964 and contribution 31820.
        test_recipe:
          setup:
            - "RULE_CA; F1 study in DRAFT (cash 500000, C1 UL 5 RUL 2 100000, C2 UL 4 RUL 1 50000)"
            - "outflow schedule peaks at year 17 with 247927 cents -> floor = round_half_up(0.5 * 247927) = 123964"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Harbor Oaks HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000, current_annual_contribution_cents: 0 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Paving", category: "PAVING", useful_life_years: 4, remaining_useful_life_years: 1, current_replacement_cost_cents: 50000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
          trigger:
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "THRESHOLD", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { c_thr: $.data.annual_contribution_cents, t_floor: $.data.threshold_floor_cents }
          assert:
            - "t_floor == 123964"
            - "c_thr == 31820"
            - "minimal-C check: 31820 is the least integer cents keeping B_y >= 123964 for all y in 1..30"

      - name: disclosure_allocation_largest_remainder
        grounds:
          - calculations.disclosure_component_allocation
          - entities.Disclosure.fields.allocation_lines
        distinguishing_aspect: |
          Combinatorial mode (b) — nested rounding order, distinct from mode (a):
          per-line floor then largest-remainder cent assignment is pinned; with
          equal weights 103000/103000 and odd contribution 51485, raw shares are
          25742.5/25742.5, so the remainder cent goes to the earliest-created
          component (25743 vs 25742). Independent per-line round_half_up would
          mis-sum (25743 + 25743 = 51486 != 51485) and is the forbidden order.
        test_recipe:
          setup:
            - "RULE_CA; association cash 100000, contribution 0, end month 12"
            - "study FY2026 FULL inflation 0.03: A1 (UL 5, RUL 1, 100000) created first, A2 (UL 9, RUL 1, 100000) second — equal first-replacement weights 103000"
            - "BASELINE plan contribution 51485; study SUBMITTED, plan SELECTED, study ADOPTED -> ADOPTION_SUMMARY disclosure"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Even Split HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 100000, current_annual_contribution_cents: 0 }
              as: ReserveSpecialist
              captures: { a3: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a3}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a3}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "A1 Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 1, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "A2 Elevator", category: "MECHANICAL", useful_life_years: 9, remaining_useful_life_years: 1, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a3}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id, c_base: $.data.annual_contribution_cents }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
          trigger:
            - call: "GET /reserve-studies/${s1}/disclosures"
              as: ReserveSpecialist
              captures: { dlines: "$.data[0].allocation_lines", dtype: "$.data[0].disclosure_type"}
          assert:
            - "c_base == 51485"
            - "dtype == ADOPTION_SUMMARY"
            - "dlines has 2 entries ordered by component created_at ASC"
            - "dlines[0] (A1, earliest created_at, wins the fractional tie) share_cents == 25743"
            - "dlines[1] (A2) share_cents == 25742"
            - "25743 + 25742 == 51485 (per-line floor + largest remainder sums exactly)"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: study_submit_reject_revision_loop
        grounds:
          - state_machines.ReserveStudy.SUBMITTED_to_DRAFT
          - state_machines.FundingPlan.SELECTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic machine on ReserveStudy: SUBMITTED -> DRAFT rejection loop, with
          the compensation side effect that the SELECTED plan reverts to DRAFT;
          the study can be re-submitted and adopted after the loop.
        test_recipe:
          setup:
            - "RULE_CA; association cash 500000; study FY2026 FULL with one component (UL 5, RUL 2, 100000) and a BASELINE plan; visit 2026-06-30 COMPLETED"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Loop HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
          trigger:
            - call: "POST /reserve-studies/${s1}/reject"
              payload: { reason: "needs more components" }
              as: BoardMember
              captures: { st_after_reject: $.data.status }
            - call: "GET /reserve-studies/${s1}/funding-plans"
              as: ReserveSpecialist
              captures: { plan_after_reject: "$.data[0].status"}
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
              captures: { st_resubmit: $.data.status }
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
              captures: { st_final: $.data.status }
          assert:
            - "st_after_reject == DRAFT (cycle SUBMITTED -> DRAFT)"
            - "plan_after_reject == DRAFT (SELECTED -> DRAFT compensation)"
            - "st_resubmit == SUBMITTED (loop closed, re-entry allowed)"
            - "st_final == ADOPTED"

      - name: expenditure_independent_approval_reconciliation_axes
        grounds:
          - state_machines.Expenditure
          - calculations.expenditure_variance_reconciliation
        distinguishing_aspect: |
          Two independent state axes on Expenditure (approval_status x
          reconciliation_status): three APPROVED expenditures land in MATCHED,
          UNRECONCILED, and exact-tolerance MATCHED respectively, and
          accept-variance moves only the reconciliation axis while approval_status
          stays APPROVED.
        test_recipe:
          setup:
            - "RULE_NV; association cash 2000000; adopted FY2026 FULL study (inflation 0.03) with component (UL 5, RUL 0, 100000) -> chronological planned 100000, tolerance max(500, 10000) = 10000"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "NV", min_percent_funded_pct: 0, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: false }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Axes HOA", state_code: "NV", fiscal_year_end_month: 12, reserve_cash_balance_cents: 2000000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 0, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 105000, incurred_date: "2026-05-10", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e1: $.data.id }
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 112000, incurred_date: "2026-05-11", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e2: $.data.id }
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 110000, incurred_date: "2026-05-12", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e3: $.data.id }
          trigger:
            - call: "POST /expenditures/${e1}/approve"
              as: BoardMember
              captures: { e1_appr: $.data.approval_status, e1_rec: $.data.reconciliation_status }
            - call: "POST /expenditures/${e2}/approve"
              as: BoardMember
              captures: { e2_appr: $.data.approval_status, e2_rec: $.data.reconciliation_status }
            - call: "POST /expenditures/${e3}/approve"
              as: BoardMember
              captures: { e3_appr: $.data.approval_status, e3_rec: $.data.reconciliation_status }
            - call: "POST /expenditures/${e2}/accept-variance"
              payload: { reason: "board-noted overage" }
              as: ReserveSpecialist
              captures: { e2_appr2: $.data.approval_status, e2_rec2: $.data.reconciliation_status }
          assert:
            - "e1_appr == APPROVED and e1_rec == MATCHED (variance 5000 <= 10000)"
            - "e2_appr == APPROVED and e2_rec == UNRECONCILED (variance 12000 > 10000)"
            - "e3_appr == APPROVED and e3_rec == MATCHED (variance 10000 == tolerance, <= holds)"
            - "e2_rec2 == VARIANCE_ACCEPTED and e2_appr2 == APPROVED (axes move independently)"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: adoption_supersedes_prior_study_cascade
        grounds:
          - state_machines.ReserveStudy.SUBMITTED_to_ADOPTED
          - state_machines.ReserveStudy.ADOPTED_to_SUPERSEDED
          - state_machines.Disclosure
        distinguishing_aspect: |
          Depth-2 cascade from the adopt trigger: adopting S2 mutates prior study
          S1 -> SUPERSEDED, and S1's supersession itself mutates S1's SELECTED plan
          -> RETIRED and S1's PENDING disclosure -> VOIDED (each link caused by the
          previous one, not by the original call).
        test_recipe:
          setup:
            - "RULE_CA; association cash 1000000; S1 FY2026 FULL ADOPTED (plan P1 SELECTED, ADOPTION_SUMMARY disclosure PENDING); S2 FY2027 UPDATE_NO_VISIT ready to adopt"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Cascade HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 1000000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2027, study_type: "UPDATE_NO_VISIT", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s2: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s2}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 1, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv2: "$.data[1].version"}
            - call: "POST /reserve-studies/${s2}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv2}" }
              as: ReserveSpecialist
              captures: { p2: $.data.id }
            - call: "POST /reserve-studies/${s2}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p2}/select"
              as: BoardMember
          trigger:
            - call: "POST /reserve-studies/${s2}/adopt"
              as: BoardMember
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { s1_status: "$.data[0].status", s2_status: "$.data[1].status"}
            - call: "GET /reserve-studies/${s1}/funding-plans"
              as: ReserveSpecialist
              captures: { p1_status: "$.data[0].status"}
            - call: "GET /reserve-studies/${s1}/disclosures"
              as: ReserveSpecialist
              captures: { d1_status: "$.data[0].status"}
            - call: "GET /reserve-studies/${s2}/disclosures"
              as: ReserveSpecialist
              captures: { d2_status: "$.data[0].status", d2_due: "$.data[0].due_date"}
          assert:
            - "s1_status == SUPERSEDED (link 1: adoption mutated prior study)"
            - "s2_status == ADOPTED"
            - "p1_status == RETIRED (link 2: supersession retired S1's SELECTED plan)"
            - "d1_status == VOIDED (link 2: supersession voided S1's PENDING disclosure)"
            - "d2_status == PENDING and d2_due == 2026-08-31 (adoption at 2026-08-01 + 30 days)"

      - name: expenditure_approve_compliance_cascade
        grounds:
          - state_machines.Expenditure
          - calculations.fully_funded_balance_and_percent_funded
          - entities.Association.fields.statutory_compliance_status
        distinguishing_aspect: |
          Depth-3 cascade from the approve trigger: approval debits association
          cash (link 1); the cash mutation forces the adopted study's
          percent_funded recompute (link 2); the recomputed percent crossing below
          the state minimum flips association.statutory_compliance_status to
          NON_COMPLIANT (link 3) — each hop caused by the previous mutation.
        test_recipe:
          setup:
            - "RULE_CA; association cash 60000; study FY2026 FULL with C1 (UL 2, RUL 0, 100000) and C2 (UL 10, RUL 9, 10000) -> FFB 101000, percent 59.41 >= 50"
            - "study ADOPTED; association COMPLIANT; expenditure 15001 UNPLANNED_REPAIR on C1, incurred 2026-05-10"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Thin Cash HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 60000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Fence", category: "EXTERIOR", useful_life_years: 2, remaining_useful_life_years: 0, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Gate", category: "EXTERIOR", useful_life_years: 10, remaining_useful_life_years: 9, current_replacement_cost_cents: 10000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "GET /associations/${a1}"
              as: ReserveSpecialist
              captures: { comp_before: $.data.statutory_compliance_status }
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 15001, incurred_date: "2026-05-10", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /expenditures/${e1}/approve"
              as: BoardMember
              captures: { e_appr: $.data.approval_status }
            - call: "GET /associations/${a1}"
              as: ReserveSpecialist
              captures: { cash_after: $.data.reserve_cash_balance_cents, comp_after: $.data.statutory_compliance_status }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { pct_after: "$.data[0].percent_funded"}
            - call: "GET /reserve-studies/${s1}/components"
              as: ReserveSpecialist
              captures: { c1_actuals: "$.data[0].actual_expenditure_cents"}
          assert:
            - "comp_before == COMPLIANT (59.41 >= 50 at adoption)"
            - "e_appr == APPROVED"
            - "cash_after == 44999 (link 1: 60000 - 15001)"
            - "pct_after == 44.55 (link 2: round_half_up(44999*100/101000, 2))"
            - "comp_after == NON_COMPLIANT (link 3: 44.55 < 50)"
            - "c1_actuals == 15001"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_rejected_expenditure_state_beats_fiscal
        grounds:
          - "validations[priority=5]"
          - "validations[priority=11]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_CASH_INSUFFICIENT]"
        distinguishing_aspect: |
          Category pair state vs business_fiscal: approving an already-REJECTED
          expenditure whose amount (999999) also exceeds cash (1000) must surface
          ERR_INVALID_STATE (priority 5), never ERR_CASH_INSUFFICIENT (priority 11).
        test_recipe:
          setup:
            - "RULE_NV (min percent 0); association cash 1000; adopted FY2026 study with component (UL 5, RUL 2, 100000)"
            - "expenditure 999999 created then REJECTED by the board"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "NV", min_percent_funded_pct: 0, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: false }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Tiny Cash HOA", state_code: "NV", fiscal_year_end_month: 12, reserve_cash_balance_cents: 1000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 999999, incurred_date: "2026-05-10", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e1: $.data.id }
            - call: "POST /expenditures/${e1}/reject"
              as: BoardMember
          trigger:
            - call: "POST /expenditures/${e1}/approve"
              as: BoardMember
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (state precondition beats the fiscal check)"
            - "err != ERR_CASH_INSUFFICIENT even though 999999 > cash 1000"

      - name: submit_cadence_temporal_beats_constraint
        grounds:
          - "validations[priority=8]"
          - "validations[priority=10]"
          - "errors[ERR_SITE_VISIT_CADENCE]"
          - "errors[ERR_NO_FUNDING_PLAN]"
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint (distinct from
          state-vs-fiscal): submitting a FULL study that has a component but no
          completed site visit AND no funding plan must surface
          ERR_SITE_VISIT_CADENCE (priority 8), never ERR_NO_FUNDING_PLAN (priority 10).
        test_recipe:
          setup:
            - "RULE_CA; association cash 500000; study FY2026 FULL with one ACTIVE included component; no site visits; no funding plans"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "No Visit HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
          trigger:
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SITE_VISIT_CADENCE (temporal rule beats constraint rule)"
            - "err != ERR_NO_FUNDING_PLAN even though the study has no plan"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: percent_funded_exact_statutory_minimum
        grounds:
          - calculations.fully_funded_balance_and_percent_funded
          - "validations[priority=9]"
          - "errors[ERR_PERCENT_FUNDED_BELOW_MINIMUM]"
        distinguishing_aspect: |
          Percent-funded metric on the adopt endpoint with >= semantics: exactly
          50.00 (cash 5000 / FFB 10000) adopts; one cent less cash (4999 -> 49.99)
          is rejected. Distinct metric and endpoint from the site-visit gap boundary.
        test_recipe:
          setup:
            - "RULE_CA (min 50); two associations, each with an FY2026 FULL study holding one component (UL 10, RUL 5, cost 20000 -> FFB 10000), a completed visit, a SELECTED BASELINE plan"
            - "association OK has cash 5000; association LOW has cash 4999"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Exact HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 5000 }
              as: ReserveSpecialist
              captures: { a_ok: $.data.id }
            - call: "POST /associations"
              payload: { name: "Below HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 4999 }
              as: ReserveSpecialist
              captures: { a_lo: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a_ok}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v_ok: $.data.id }
            - call: "POST /site-visits/${v_ok}/complete"
              as: AssociationManager
            - call: "POST /site-visits"
              payload: { association_id: "${a_lo}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v_lo: $.data.id }
            - call: "POST /site-visits/${v_lo}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a_ok}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s_ok: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s_ok}", name: "Roof", category: "ROOFING", useful_life_years: 10, remaining_useful_life_years: 5, current_replacement_cost_cents: 20000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a_ok}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv_ok: "$.data[0].version"}
            - call: "POST /reserve-studies/${s_ok}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv_ok}" }
              as: ReserveSpecialist
              captures: { p_ok: $.data.id }
            - call: "POST /reserve-studies/${s_ok}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p_ok}/select"
              as: BoardMember
            - call: "POST /reserve-studies"
              payload: { association_id: "${a_lo}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s_lo: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s_lo}", name: "Roof", category: "ROOFING", useful_life_years: 10, remaining_useful_life_years: 5, current_replacement_cost_cents: 20000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a_lo}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv_lo: "$.data[0].version"}
            - call: "POST /reserve-studies/${s_lo}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv_lo}" }
              as: ReserveSpecialist
              captures: { p_lo: $.data.id }
            - call: "POST /reserve-studies/${s_lo}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p_lo}/select"
              as: BoardMember
          trigger:
            - call: "POST /reserve-studies/${s_ok}/adopt"
              as: BoardMember
              captures: { st_ok: $.data.status, pct_ok: $.data.percent_funded }
            - call: "POST /reserve-studies/${s_lo}/adopt"
              as: BoardMember
              captures: { err_lo: $.data.error_id }
          assert:
            - "pct_ok == 50.00 and st_ok == ADOPTED (>= admits the exact minimum)"
            - "err_lo == ERR_PERCENT_FUNDED_BELOW_MINIMUM (49.99 < 50 with one cent less cash)"

      - name: site_visit_exact_min_gap_boundary
        grounds:
          - calculations.site_visit_cadence_and_gap
          - "errors[ERR_SITE_VISIT_TOO_SOON]"
        distinguishing_aspect: |
          Days-gap metric on the site-visit creation endpoint with >= semantics:
          a visit exactly 30 days after an existing one (2026-01-15 -> 2026-02-14)
          is accepted; 29 days (2026-02-13) is rejected. Distinct metric and
          endpoint from the percent-funded boundary.
        test_recipe:
          setup:
            - "RULE_CA; association with one visit at 2026-01-15"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Gap HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-01-15" }
              as: AssociationManager
          trigger:
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-02-13" }
              as: AssociationManager
              captures: { err_29: $.data.error_id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-02-14" }
              as: AssociationManager
              captures: { v2_status: $.data.status }
          assert:
            - "err_29 == ERR_SITE_VISIT_TOO_SOON (29 days < 30)"
            - "v2_status == SCHEDULED (exactly 30 days satisfies the >= gap)"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: component_edit_gated_by_study_state
        grounds:
          - state_machines.Component
          - "errors[ERR_STUDY_NOT_DRAFT]"
        distinguishing_aspect: |
          Entity pair Component -> ReserveStudy: a component mutation (PATCH) is
          rejected with ERR_STUDY_NOT_DRAFT the moment its owning study leaves
          DRAFT, even though the component itself is ACTIVE and otherwise editable.
        test_recipe:
          setup:
            - "RULE_CA; association cash 500000; study with one component (UL 5, RUL 2, 100000) and a BASELINE plan; visit completed; study SUBMITTED"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Gate HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
          trigger:
            - call: "PATCH /components/${c1}"
              payload: { current_replacement_cost_cents: 110000 }
              as: ReserveSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STUDY_NOT_DRAFT (Component edit gated by ReserveStudy.status)"

      - name: expenditure_approve_gated_by_component_currency
        grounds:
          - state_machines.Expenditure
          - "validations[priority=7]"
          - "errors[ERR_COMPONENT_NOT_CURRENT]"
        distinguishing_aspect: |
          Entity pair Expenditure -> Component (distinct from Component ->
          ReserveStudy): an expenditure that was SUBMITTED while its component
          belonged to the adopted study can no longer be approved after a new
          study supersedes it — the component is no longer current.
        test_recipe:
          setup:
            - "RULE_CA; association cash 1000000; S1 FY2026 ADOPTED with component X; expenditure E on X is SUBMITTED"
            - "S2 FY2027 UPDATE_NO_VISIT adopted afterwards -> S1 SUPERSEDED, X no longer in the current adopted study"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Supersede HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 1000000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { cx: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${cx}", amount_cents: 5000, incurred_date: "2026-05-10", kind: "UNPLANNED_REPAIR" }
              as: AssociationManager
              captures: { e1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2027, study_type: "UPDATE_NO_VISIT", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s2: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s2}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 1, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv2: "$.data[1].version"}
            - call: "POST /reserve-studies/${s2}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv2}" }
              as: ReserveSpecialist
              captures: { p2: $.data.id }
            - call: "POST /reserve-studies/${s2}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p2}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s2}/adopt"
              as: BoardMember
          trigger:
            - call: "POST /expenditures/${e1}/approve"
              as: BoardMember
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMPONENT_NOT_CURRENT (approve re-checks component currency after supersession)"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: study_fiscal_window_overlap_adjacency
        grounds:
          - calculations.fiscal_year_derivation
          - "errors[ERR_STUDY_WINDOW_OVERLAP]"
        distinguishing_aspect: |
          Half-open fiscal-window semantics on ReserveStudy: a new FY2026 study
          collides with the ADOPTED FY2026 study's window [2026-01-01, 2027-01-01)
          and is rejected, while FY2027 touches the window boundary without
          overlap and is accepted (adjacency allowed).
        test_recipe:
          setup:
            - "RULE_CA; association cash 1000000; FY2026 FULL study ADOPTED (window [2026-01-01, 2027-01-01))"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Window HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 1000000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
          trigger:
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "UPDATE_NO_VISIT", inflation_rate: 0.04, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { err_ovl: $.data.error_id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2027, study_type: "UPDATE_NO_VISIT", inflation_rate: 0.04, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s2_status: $.data.status, s2_win: $.data.window_start_date }
          assert:
            - "err_ovl == ERR_STUDY_WINDOW_OVERLAP (same FY window intersects [2026-01-01, 2027-01-01))"
            - "s2_status == DRAFT and s2_win == 2027-01-01 (adjacent window starts exactly at the prior window's exclusive end)"

      - name: site_visit_min_gap_buffer
        grounds:
          - calculations.site_visit_cadence_and_gap
          - "errors[ERR_SITE_VISIT_TOO_SOON]"
        distinguishing_aspect: |
          Point-event buffer semantics on SiteVisit (distinct from the study's
          half-open window adjacency): each visit occupies a +/-30-day exclusion
          zone around its date, so a visit 5 days after an existing one collides
          even though no two visits occupy any shared interval.
        test_recipe:
          setup:
            - "RULE_CA; association with a SCHEDULED visit at 2026-01-15"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Buffer HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-01-15" }
              as: AssociationManager
          trigger:
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-01-20" }
              as: AssociationManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SITE_VISIT_TOO_SOON (|2026-01-20 - 2026-01-15| = 5 days < 30-day buffer)"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: approve_then_reverse_conserves_reserve_cash
        grounds:
          - state_machines.Expenditure
          - entities.Association.fields.reserve_cash_balance_cents
        distinguishing_aspect: |
          Conserved quantity = association reserve cash cents: approve (debit
          105000) composed with its compensating reverse (credit 105000) returns
          reserve_cash_balance_cents to exactly its pre-approve value 2000000,
          and the component's actual_expenditure_cents and
          remaining_useful_life_years are likewise restored (0 and 2).
        test_recipe:
          setup:
            - "RULE_NV; association cash 2000000; adopted FY2026 study with component (UL 5, RUL 2, 100000)"
            - "expenditure 105000 PLANNED_REPLACEMENT incurred 2026-05-10 (FY2026); logical clock stays at the 2026-08-01 default (FY2026) so the reversal window is open"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "NV", min_percent_funded_pct: 0, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: false }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Conserve HOA", state_code: "NV", fiscal_year_end_month: 12, reserve_cash_balance_cents: 2000000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /site-visits"
              payload: { association_id: "${a1}", visit_date: "2026-06-30" }
              as: AssociationManager
              captures: { v1: $.data.id }
            - call: "POST /site-visits/${v1}/complete"
              as: AssociationManager
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "GET /associations/${a1}/reserve-studies"
              as: ReserveSpecialist
              captures: { sv1: "$.data[0].version"}
            - call: "POST /reserve-studies/${s1}/funding-plans"
              payload: { plan_type: "BASELINE", expected_study_version: "${sv1}" }
              as: ReserveSpecialist
              captures: { p1: $.data.id }
            - call: "POST /reserve-studies/${s1}/submit"
              as: ReserveSpecialist
            - call: "POST /funding-plans/${p1}/select"
              as: BoardMember
            - call: "POST /reserve-studies/${s1}/adopt"
              as: BoardMember
            - call: "POST /expenditures"
              payload: { association_id: "${a1}", component_id: "${c1}", amount_cents: 105000, incurred_date: "2026-05-10", kind: "PLANNED_REPLACEMENT" }
              as: AssociationManager
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /expenditures/${e1}/approve"
              as: BoardMember
            - call: "GET /associations/${a1}"
              as: ReserveSpecialist
              captures: { cash_mid: $.data.reserve_cash_balance_cents }
            - call: "POST /expenditures/${e1}/reverse"
              as: BoardMember
              captures: { e_appr: $.data.approval_status, e_rec: $.data.reconciliation_status }
            - call: "GET /associations/${a1}"
              as: ReserveSpecialist
              captures: { cash_end: $.data.reserve_cash_balance_cents }
            - call: "GET /reserve-studies/${s1}/components"
              as: ReserveSpecialist
              captures: { c_actuals: "$.data[0].actual_expenditure_cents", c_rul: "$.data[0].remaining_useful_life_years"}
          assert:
            - "cash_mid == 1895000 (2000000 - 105000)"
            - "cash_end == 2000000 (invariant: approve + reverse conserves reserve cash)"
            - "c_actuals == 0 and c_rul == 2 (component restored from component_rul_before_years)"
            - "e_appr == REVERSED and e_rec == NOT_APPLICABLE"

      - name: retire_then_restore_conserves_component_count
        grounds:
          - state_machines.Component
          - calculations.fully_funded_balance_and_percent_funded
        distinguishing_aspect: |
          Conserved quantity = count of ACTIVE funding-included components (a
          cardinality, distinct from cash cents): retire removes C1 from the set
          (FFB drops 97500 -> 37500) and its compensating restore returns the
          count to exactly 2 and FFB to exactly 97500 — no drift in the aggregate.
        test_recipe:
          setup:
            - "RULE_CA; association cash 500000; F1 study in DRAFT with C1 (UL 5, RUL 2, 100000) and C2 (UL 4, RUL 1, 50000), both ACTIVE included -> FFB 97500, count 2"
          setup_api_calls:
            - call: "POST /state-reserve-rules"
              payload: { state_code: "CA", min_percent_funded_pct: 50, allowed_plan_types: ["BASELINE", "THRESHOLD", "FULL"], site_visit_interval_years: 3, disclosure_deadline_days: 30, annual_update_required: true }
              as: PlatformAdmin
            - call: "POST /associations"
              payload: { name: "Restore HOA", state_code: "CA", fiscal_year_end_month: 12, reserve_cash_balance_cents: 500000 }
              as: ReserveSpecialist
              captures: { a1: $.data.id }
            - call: "POST /reserve-studies"
              payload: { association_id: "${a1}", fiscal_year: 2026, study_type: "FULL", inflation_rate: 0.03, interest_rate: 0.02 }
              as: ReserveSpecialist
              captures: { s1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Roof", category: "ROOFING", useful_life_years: 5, remaining_useful_life_years: 2, current_replacement_cost_cents: 100000, is_included_in_funding: true }
              as: ReserveSpecialist
              captures: { c1: $.data.id }
            - call: "POST /components"
              payload: { study_id: "${s1}", name: "Paving", category: "PAVING", useful_life_years: 4, remaining_useful_life_years: 1, current_replacement_cost_cents: 50000, is_included_in_funding: true }
              as: ReserveSpecialist
            - call: "GET /reserve-studies/${s1}"
              as: ReserveSpecialist
              captures: { ffb_before: $.data.fully_funded_balance_cents }
          trigger:
            - call: "POST /components/${c1}/retire"
              as: ReserveSpecialist
            - call: "GET /reserve-studies/${s1}"
              as: ReserveSpecialist
              captures: { ffb_mid: $.data.fully_funded_balance_cents }
            - call: "POST /components/${c1}/restore"
              as: ReserveSpecialist
            - call: "GET /reserve-studies/${s1}"
              as: ReserveSpecialist
              captures: { ffb_end: $.data.fully_funded_balance_cents }
            - call: "GET /reserve-studies/${s1}/components?status=ACTIVE"
              as: ReserveSpecialist
          assert:
            - "ffb_before == 97500 (round(100000*3/5) + round(50000*3/4))"
            - "ffb_mid == 37500 (C1 excluded while RETIRED)"
            - "ffb_end == 97500 (invariant: retire + restore conserves the aggregate)"
            - "ACTIVE included component count == 2 before retire and after restore"
