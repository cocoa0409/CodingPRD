# =============================================================================
# Recreational Race Registration (5K / marathon) — Benchmark Seed Tables
# §1.0–§1.7 (SCAFFOLD.yaml). Difficulty: Expert.
# =============================================================================

scenario: |
  Recreational Race Registration (5K/marathon): event/distance & wave, capacity &
  waitlist, tiered pricing by date, bib/corral assignment, transfer/deferral, packet
  pickup, timing-chip results, charity entry/fundraising minimum.

domain_name: recreational-race-registration
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Event -> Distance -> Wave forms a hierarchy; Registration, WaitlistEntry,
  # FundraisingPledge, TransferRequest, BibAssignment, PacketPickup, ResultRecord
  # are flat resources with FK references that cut across the tree.

  state_machine_shape: branching
  # Registration is branching-with-revert + cyclic (deferral loop back to a new
  # event); WaitlistEntry is branching (OFFERED -> {CLAIMED, EXPIRED, DECLINED});
  # TransferRequest is branching-with-revert. Not a single linear pipeline.

  relationship_patterns:
    - one_to_many        # Event->Distance, Distance->Wave, Distance->PricingTier
    - cross_aggregate    # Registration references Distance+Wave+Participant
    - self_referential   # Registration.deferred_to_registration_id -> Registration.id

  role_model: peer_roles
  # Participant owns own Registrations/Pledges; RaceDirector owns Events/Distances/
  # Waves/Tiers and finalizes assignments; PacketStaff handles pickup; TimingOfficial
  # posts results. No role can do another's exclusive work.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Unique participant email", constraints: "unique across Participants" }
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: birthdate, type: string, source: input, description: "ISO date YYYY-MM-DD; used to derive age on race day" }
      - { name: gender, type: enum, source: input, description: "M | F | X" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: name, type: string, source: input, description: "Race event name" }
      - { name: race_date_utc, type: datetime, source: input, description: "Race day start instant (ISO 8601 UTC)" }
      - { name: registration_opens_utc, type: datetime, source: input, description: "Registration window open instant" }
      - { name: registration_closes_utc, type: datetime, source: input, description: "Registration window close instant (exclusive upper bound)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED | RESULTS_POSTED | CANCELLED", default: "DRAFT", constraints: "DRAFT|OPEN|CLOSED|RESULTS_POSTED|CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1; bumped on cancel and every mutation" }

  - name: Distance
    parent: Event
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: label, type: enum, source: input, description: "FIVE_K | TEN_K | HALF_MARATHON | MARATHON" }
      - { name: distance_km, type: number, source: input, description: "Course length in km (e.g., 5.0, 42.195)" }
      - { name: capacity_total, type: integer, source: input, description: "Confirmed-registration cap for this distance", constraints: ">= 1" }
      - { name: charity_capacity, type: integer, source: input, description: "Sub-cap of capacity_total reserved for CHARITY entries", default: 0, constraints: "0 <= charity_capacity <= capacity_total" }
      - { name: charity_fundraising_minimum_cents, type: integer, source: input, description: "Fundraising floor (cents) each CHARITY registration on this distance must reach before bib assignment", default: 0, constraints: ">= 0" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of Registrations on this distance in {CONFIRMED, BIB_ASSIGNED, FINISHED}" }
      - { name: charity_confirmed_count, type: integer, source: computed, description: "Count of confirmed CHARITY Registrations on this distance" }
      - { name: waitlist_open, type: boolean, source: computed, description: "True when confirmed_count >= capacity_total" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1; bumped on every registration confirm/cancel/promote that touches this distance" }

  - name: Wave
    parent: Distance
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: distance_id, type: string, source: input, description: "FK -> Distance.id; owning distance" }
      - { name: name, type: string, source: input, description: "Wave label, e.g. 'Wave 1 - 07:00'" }
      - { name: start_offset_seconds, type: integer, source: input, description: "Seconds after gun start that this wave begins" }
      - { name: wave_capacity, type: integer, source: input, description: "Max confirmed registrations assignable to this wave", constraints: ">= 1" }
      - { name: corral_capacity, type: integer, source: input, description: "Max bibs per corral letter within this wave", constraints: ">= 1" }
      - { name: assigned_count, type: integer, source: computed, description: "Count of BibAssignments referencing this wave" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: PricingTier
    parent: Distance
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: distance_id, type: string, source: input, description: "FK -> Distance.id; owning distance" }
      - { name: tier_name, type: enum, source: input, description: "EARLY_BIRD | REGULAR | LATE" }
      - { name: effective_from_utc, type: datetime, source: input, description: "Inclusive lower bound; tier active for now >= effective_from_utc", constraints: "unique effective_from_utc within a distance" }
      - { name: base_price_cents, type: integer, source: input, description: "Entry fee in cents for a STANDARD registration created while this tier is active", constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; denormalized owning event for query convenience" }
      - { name: distance_id, type: string, source: input, description: "FK -> Distance.id; chosen distance" }
      - { name: wave_id, type: string, source: input, description: "FK -> Wave.id; requested wave (must belong to distance_id)" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the registrant" }
      - { name: entry_type, type: enum, source: input, description: "STANDARD | CHARITY", default: "STANDARD", constraints: "STANDARD|CHARITY" }
      - { name: party_size, type: integer, source: input, description: "Number of registrants in the group buy (drives group discount tier)", default: 1, constraints: ">= 1" }
      - { name: promo_code, type: string, source: input, description: "Optional promo code applied to base price", default: null }
      - { name: qualifying_time_seconds, type: integer, source: input, description: "Self-reported seed time for corral seeding; null if unseeded", default: null }
      - { name: fundraising_minimum_cents, type: integer, source: computed, description: "0 for STANDARD; copied from Distance charity floor for CHARITY at creation" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | CONFIRMED | BIB_ASSIGNED | WAITLISTED | CANCELLED | DEFERRED | TRANSFERRED | FINISHED", default: "PENDING_PAYMENT", constraints: "PENDING_PAYMENT|CONFIRMED|BIB_ASSIGNED|WAITLISTED|CANCELLED|DEFERRED|TRANSFERRED|FINISHED" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Provisional charge computed at creation from active tier (see registration_amount_due calc, provisional variant)" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Final charge captured at confirm time (final variant); 0 until CONFIRMED" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "Non-refundable processing fee component of amount_paid_cents" }
      - { name: refund_cents, type: integer, source: computed, description: "Refund issued on cancellation; 0 until CANCELLED" }
      - { name: deferred_to_registration_id, type: string, source: system, description: "FK -> Registration.id; the new registration this one deferred into (self-reference); null unless DEFERRED" }
      - { name: deferral_credit_cents, type: integer, source: computed, description: "Credit carried into the deferred registration; 0 unless DEFERRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; the registration-date input to tier selection" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: WaitlistEntry
    parent: Distance
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: distance_id, type: string, source: input, description: "FK -> Distance.id; the full distance queued against" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the PENDING_PAYMENT registration parked on the waitlist" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the queued registrant" }
      - { name: queue_position, type: integer, source: computed, description: "1-based FIFO position by created_at ASC among QUEUED entries on this distance" }
      - { name: status, type: enum, source: system, description: "QUEUED | OFFERED | CLAIMED | EXPIRED | DECLINED | WITHDRAWN", default: "QUEUED", constraints: "QUEUED|OFFERED|CLAIMED|EXPIRED|DECLINED|WITHDRAWN" }
      - { name: offer_expires_utc, type: datetime, source: computed, description: "now + OFFER_TTL_HOURS when promoted to OFFERED; null otherwise" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; FIFO ordering key" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: FundraisingPledge
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the CHARITY registration this pledge funds" }
      - { name: donor_name, type: string, source: input, description: "Donor display name" }
      - { name: amount_cents, type: integer, source: input, description: "Pledged amount in cents", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "PLEDGED | SETTLED | VOIDED", default: "PLEDGED", constraints: "PLEDGED|SETTLED|VOIDED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the CONFIRMED registration being handed off" }
      - { name: from_participant_id, type: string, source: input, description: "FK -> Participant.id; current registrant" }
      - { name: to_participant_id, type: string, source: input, description: "FK -> Participant.id; proposed new registrant" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | CANCELLED", default: "PROPOSED", constraints: "PROPOSED|ACCEPTED|REJECTED|CANCELLED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: BibAssignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the registration this bib belongs to" }
      - { name: distance_id, type: string, source: input, description: "FK -> Distance.id; denormalized owning distance" }
      - { name: wave_id, type: string, source: input, description: "FK -> Wave.id; assigned wave" }
      - { name: bib_number, type: integer, source: computed, description: "Sequential bib number within the distance, assigned at BIB_ASSIGNED time" }
      - { name: corral, type: string, source: computed, description: "Corral letter (A, B, C, ...) seeded by qualifying_time_seconds within the wave" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: PacketPickup
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the registration picking up a packet" }
      - { name: picked_up_by_name, type: string, source: input, description: "Name of person collecting the packet" }
      - { name: id_verified, type: boolean, source: input, description: "Whether photo ID was checked", default: false }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED", default: "ISSUED", constraints: "ISSUED|VOIDED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: ResultRecord
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; the finisher's registration" }
      - { name: distance_id, type: string, source: input, description: "FK -> Distance.id; denormalized owning distance" }
      - { name: gun_start_clock_seconds, type: integer, source: input, description: "Gun-start clock reading (seconds) for the wave" }
      - { name: mat_cross_clock_seconds, type: integer, source: input, description: "Clock reading when the chip crossed the start mat" }
      - { name: finish_clock_seconds, type: integer, source: input, description: "Clock reading at finish line" }
      - { name: gun_time_seconds, type: integer, source: computed, description: "finish_clock - gun_start_clock (official/place time)" }
      - { name: chip_time_seconds, type: integer, source: computed, description: "finish_clock - mat_cross_clock (net/personal time)" }
      - { name: pace_seconds_per_km, type: integer, source: computed, description: "round_half_up(chip_time_seconds / distance_km)" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | OFFICIAL | DQ", default: "PROVISIONAL", constraints: "PROVISIONAL|OFFICIAL|DQ" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /events/{event_id}/open"
        actor: RaceDirector
        preconditions:
          - "Event has at least one Distance with at least one Wave and at least one PricingTier"
          - "Current clock >= registration_opens_utc"
        side_effects:
          - "Registrations may now be created against this event's distances"

      - from: OPEN
        to: CLOSED
        trigger: "POST /events/{event_id}/close"
        actor: RaceDirector
        preconditions:
          - "Event.status == OPEN"
        side_effects:
          - "New Registration creation rejected with ERR_REGISTRATION_CLOSED"
          - "Existing CONFIRMED registrations may still be assigned bibs and have packets picked up"

      - from: CLOSED
        to: RESULTS_POSTED
        trigger: "POST /events/{event_id}/post-results"
        actor: TimingOfficial
        preconditions:
          - "Event.status == CLOSED"
          - "Current clock >= race_date_utc"
        side_effects:
          - "ResultRecords may transition PROVISIONAL -> OFFICIAL"

      - from: [DRAFT, OPEN, CLOSED]
        to: CANCELLED
        trigger: "POST /events/{event_id}/cancel"
        actor: RaceDirector
        preconditions:
          - "Event.status != RESULTS_POSTED"
        side_effects:
          - "CASCADE: every non-terminal Registration on every Distance of this event transitions to CANCELLED (see registration cancel side-effects), which itself releases distance capacity and recomputes Distance.confirmed_count"
          - "CASCADE: every QUEUED or OFFERED WaitlistEntry on every Distance transitions to WITHDRAWN"
          - "Refunds for CONFIRMED/BIB_ASSIGNED registrations follow registration cancel (full refund of amount_paid including processing fee on organizer-initiated cancellation)"
          - "increments Event.version by 1"

  - entity: Registration
    field: status
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED, TRANSFERRED, DEFERRED, FINISHED]
    note: "Branching with revert + self-referential cyclic deferral. PENDING_PAYMENT forks to CONFIRMED (capacity available) or WAITLISTED (full)."
    transitions:
      - from: PENDING_PAYMENT
        to: CONFIRMED
        trigger: "POST /registrations/{registration_id}/confirm-payment"
        actor: Participant
        preconditions:
          - "Owning Event.status == OPEN"
          - "Distance.confirmed_count < Distance.capacity_total (capacity check uses >=: full when confirmed_count >= capacity_total)"
          - "For CHARITY entry: Distance.charity_confirmed_count < Distance.charity_capacity"
          - "expected_distance_version matches Distance.version (OCC)"
        side_effects:
          - "amount_paid_cents set via registration_amount_due final variant (tier active at confirm-time clock)"
          - "processing_fee_cents recorded"
          - "Distance.confirmed_count incremented; charity_confirmed_count incremented for CHARITY"
          - "increments Distance.version by 1"

      - from: PENDING_PAYMENT
        to: WAITLISTED
        trigger: "POST /registrations/{registration_id}/confirm-payment (distance full)"
        actor: Participant
        preconditions:
          - "Owning Event.status == OPEN"
          - "Distance.confirmed_count >= Distance.capacity_total (or CHARITY sub-cap full for CHARITY entry)"
        side_effects:
          - "A WaitlistEntry (status QUEUED) is created for this registration on the distance"
          - "No charge captured; amount_paid_cents stays 0"

      - from: WAITLISTED
        to: CONFIRMED
        trigger: "POST /waitlist-entries/{waitlist_entry_id}/claim"
        actor: Participant
        preconditions:
          - "WaitlistEntry.status == OFFERED"
          - "Current clock < WaitlistEntry.offer_expires_utc"
          - "Distance.confirmed_count < Distance.capacity_total"
        side_effects:
          - "WaitlistEntry -> CLAIMED"
          - "amount_paid_cents captured via final variant; Distance.confirmed_count incremented; increments Distance.version by 1"

      - from: CONFIRMED
        to: BIB_ASSIGNED
        trigger: "POST /registrations/{registration_id}/assign-bib"
        actor: RaceDirector
        preconditions:
          - "Registration.status == CONFIRMED"
          - "For CHARITY entry: settled_pledged_cents >= fundraising_minimum_cents (final fundraising variant)"
          - "Requested Wave.assigned_count < Wave.wave_capacity"
        side_effects:
          - "A BibAssignment is created with bib_number (next sequential within distance) and corral (corral_assignment calc)"
          - "Wave.assigned_count incremented; increments Wave.version by 1"

      - from: [PENDING_PAYMENT, CONFIRMED, BIB_ASSIGNED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /registrations/{registration_id}/cancel"
        actor: Participant
        preconditions:
          - "Registration.status in {PENDING_PAYMENT, CONFIRMED, BIB_ASSIGNED, WAITLISTED}"
        side_effects:
          - "refund_cents computed via registration_refund calc (0 for PENDING_PAYMENT/WAITLISTED since nothing captured)"
          - "If was CONFIRMED or BIB_ASSIGNED: Distance.confirmed_count decremented (and charity_confirmed_count for CHARITY); increments Distance.version by 1"
          - "If was BIB_ASSIGNED: associated BibAssignment is deleted and Wave.assigned_count decremented; increments Wave.version by 1"
          - "CASCADE: freeing a confirmed slot promotes the head QUEUED WaitlistEntry on that distance to OFFERED (waitlist_promotion), which itself stamps offer_expires_utc and bumps that WaitlistEntry.version"
          - "Any PROPOSED TransferRequest on this registration -> CANCELLED"

      - from: CONFIRMED
        to: TRANSFERRED
        trigger: "POST /transfer-requests/{transfer_request_id}/accept"
        actor: Participant
        preconditions:
          - "TransferRequest.status == PROPOSED and references this registration"
          - "Owning Event.status == OPEN"
          - "Registration.status == CONFIRMED (not yet BIB_ASSIGNED)"
        side_effects:
          - "A NEW Registration is created for to_participant_id, inheriting distance/wave, status CONFIRMED, amount_paid_cents = 0 (paid slot carried over), entry_type STANDARD"
          - "TransferRequest -> ACCEPTED"
          - "Distance.confirmed_count unchanged (slot moves, not freed); increments Distance.version by 1"

      - from: CONFIRMED
        to: DEFERRED
        trigger: "POST /registrations/{registration_id}/defer"
        actor: Participant
        preconditions:
          - "Registration.status == CONFIRMED"
          - "Target Event provided in body is in {DRAFT, OPEN} and differs from current event"
        side_effects:
          - "deferral_credit_cents computed via registration_deferral_credit calc"
          - "A NEW PENDING_PAYMENT Registration is created on the target event's matching distance; deferred_to_registration_id set to it (self-reference)"
          - "Distance.confirmed_count decremented on the original distance; increments Distance.version by 1"
          - "CASCADE: freeing a confirmed slot promotes head QUEUED WaitlistEntry to OFFERED (waitlist_promotion)"

      - from: BIB_ASSIGNED
        to: FINISHED
        trigger: "POST /registrations/{registration_id}/finish"
        actor: TimingOfficial
        preconditions:
          - "Registration.status == BIB_ASSIGNED"
          - "Owning Event.status in {CLOSED, RESULTS_POSTED}"
          - "A ResultRecord exists for this registration with status OFFICIAL"
        side_effects:
          - "Registration moves to terminal FINISHED"

  - entity: WaitlistEntry
    field: status
    initial_state: QUEUED
    terminal_states: [CLAIMED, EXPIRED, DECLINED, WITHDRAWN]
    note: "Branching: QUEUED -> OFFERED -> {CLAIMED, EXPIRED, DECLINED}. Promotion is FIFO by created_at ASC."
    transitions:
      - from: QUEUED
        to: OFFERED
        trigger: "system (waitlist_promotion: a confirmed slot is freed on the distance)"
        actor: system
        preconditions:
          - "This entry is the head of the QUEUED queue (lowest created_at) on its distance"
          - "Distance.confirmed_count < Distance.capacity_total"
        side_effects:
          - "offer_expires_utc set to now + OFFER_TTL_HOURS"

      - from: OFFERED
        to: CLAIMED
        trigger: "POST /waitlist-entries/{waitlist_entry_id}/claim"
        actor: Participant
        preconditions:
          - "Current clock < offer_expires_utc"
          - "Distance.confirmed_count < Distance.capacity_total"
        side_effects:
          - "Linked Registration -> CONFIRMED (capture charge), Distance.confirmed_count incremented; increments Distance.version by 1"

      - from: OFFERED
        to: EXPIRED
        trigger: "POST /waitlist-entries/{waitlist_entry_id}/expire-check (system sweep)"
        actor: system
        preconditions:
          - "Current clock >= offer_expires_utc"
        side_effects:
          - "CASCADE: the next QUEUED entry (lowest created_at) on this distance is promoted to OFFERED (waitlist_promotion), which itself stamps its offer_expires_utc"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /waitlist-entries/{waitlist_entry_id}/decline"
        actor: Participant
        preconditions:
          - "WaitlistEntry.status == OFFERED"
        side_effects:
          - "Linked Registration -> CANCELLED"
          - "CASCADE: next QUEUED entry on this distance promoted to OFFERED (waitlist_promotion)"

      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /waitlist-entries/{waitlist_entry_id}/withdraw"
        actor: Participant
        preconditions:
          - "WaitlistEntry.status == QUEUED"
        side_effects:
          - "Linked Registration -> CANCELLED"

  - entity: TransferRequest
    field: status
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, CANCELLED]
    note: "Branching-with-revert: PROPOSED -> {ACCEPTED, REJECTED, CANCELLED}."
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /transfer-requests/{transfer_request_id}/accept"
        actor: Participant
        preconditions:
          - "Acting Participant == to_participant_id"
          - "Linked Registration.status == CONFIRMED"
          - "Owning Event.status == OPEN"
        side_effects:
          - "Linked Registration -> TRANSFERRED (see registration TRANSFERRED side-effects)"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /transfer-requests/{transfer_request_id}/reject"
        actor: Participant
        preconditions:
          - "Acting Participant == to_participant_id"
        side_effects:
          - "Linked Registration stays CONFIRMED"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /transfer-requests/{transfer_request_id}/cancel"
        actor: Participant
        preconditions:
          - "Acting Participant == from_participant_id"
        side_effects:
          - "Linked Registration stays CONFIRMED"

  - entity: ResultRecord
    field: status
    initial_state: PROVISIONAL
    terminal_states: [DQ]
    note: "Branching: PROVISIONAL -> {OFFICIAL, DQ}; OFFICIAL -> DQ on protest."
    transitions:
      - from: PROVISIONAL
        to: OFFICIAL
        trigger: "POST /results/{result_id}/finalize"
        actor: TimingOfficial
        preconditions:
          - "Owning Event.status == RESULTS_POSTED"
          - "Linked Registration.status == BIB_ASSIGNED"
        side_effects:
          - "gun_time/chip_time/pace frozen as official"

      - from: [PROVISIONAL, OFFICIAL]
        to: DQ
        trigger: "POST /results/{result_id}/disqualify"
        actor: TimingOfficial
        preconditions:
          - "ResultRecord.status in {PROVISIONAL, OFFICIAL}"
        side_effects:
          - "Result excluded from rankings; linked Registration cannot transition to FINISHED"

  - entity: FundraisingPledge
    field: status
    initial_state: PLEDGED
    terminal_states: [VOIDED]
    transitions:
      - from: PLEDGED
        to: SETTLED
        trigger: "POST /pledges/{pledge_id}/settle"
        actor: Participant
        preconditions:
          - "Linked Registration.entry_type == CHARITY"
          - "Linked Registration.status != CANCELLED"
        side_effects:
          - "Pledge counted in settled_pledged_cents for fundraising_progress final variant"

      - from: [PLEDGED, SETTLED]
        to: VOIDED
        trigger: "POST /pledges/{pledge_id}/void"
        actor: Participant
        preconditions:
          - "FundraisingPledge.status in {PLEDGED, SETTLED}"
        side_effects:
          - "Pledge removed from both provisional and settled fundraising totals"

  - entity: PacketPickup
    field: status
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /packet-pickups/{pickup_id}/void"
        actor: PacketStaff
        preconditions:
          - "PacketPickup.status == ISSUED"
        side_effects:
          - "Registration becomes eligible to pick up a packet again"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: confirm-against-stale-distance
    parent_entity: Distance
    write_endpoint: "POST /registrations/{registration_id}/confirm-payment"
    occ_field: "expected_distance_version"
    description: |
      Confirming a PENDING_PAYMENT registration against a Distance whose version
      has advanced since the client last observed it is rejected with a stale
      version error. The version advances whenever another registration confirms,
      cancels, defers, or is promoted from the waitlist on the same distance —
      each of those events changes confirmed_count and therefore whether this
      confirmation should succeed or fall through to the waitlist. A client
      holding a stale distance view is forced to re-read before retrying.
    error_id: ERR_STALE_DISTANCE_VERSION
    http_status: 412

  - rule_id: claim-against-stale-distance
    parent_entity: Distance
    write_endpoint: "POST /waitlist-entries/{waitlist_entry_id}/claim"
    occ_field: "expected_distance_version"
    description: |
      Claiming an OFFERED waitlist slot against a Distance whose version has
      advanced since the client last read it is rejected as stale. Another
      writer confirming or claiming on the same distance bumps the version and
      may have consumed the freed slot; the claimant must re-read the distance
      to learn the current confirmed_count before retrying.
    error_id: ERR_STALE_DISTANCE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: registration_amount_due
    trigger: "Registration creation (provisional) and confirm-payment transition (final)"
    algorithm: tiered_pricing
    formula: |
      # Step order is PINNED (circular-looking: discount depends on base tier,
      # fee depends on discounted base):
      # 1. base = active PricingTier.base_price_cents for the distance, where the
      #    active tier is the one with the greatest effective_from_utc such that
      #    effective_from_utc <= reference_clock (INCLUSIVE). If no tier qualifies
      #    (reference_clock < earliest effective_from_utc) -> ERR_NO_ACTIVE_PRICING_TIER.
      #    For entry_type == CHARITY, base = 0 (entry fee waived).
      # 2. group_discount_pct: party_size >= 4 -> 0.10; party_size >= 2 -> 0.05; else 0.00
      # 3. promo_discount_pct: PROMO_TABLE.get(promo_code, 0.00)
      # 4. discount_pct = min(group_discount_pct + promo_discount_pct, MAX_DISCOUNT_PCT)
      # 5. discount_cents = round_half_up(base * discount_pct)
      # 6. discounted_base = base - discount_cents
      # 7. processing_fee_cents = ceil(discounted_base * PROCESSING_FEE_RATE)
      # 8. amount = discounted_base + processing_fee_cents
    input_set: "Single Registration plus its Distance's PricingTier rows; tier filtered by effective_from_utc <= reference_clock."
    constants:
      PROCESSING_FEE_RATE: 0.029
      MAX_DISCOUNT_PCT: 0.20
      PROMO_TABLE: { SPRING10: 0.10, WELCOME05: 0.05 }
    precision: "Integer cents. round_half_up for percentage discounts; ceil for processing fee."
    variants:
      - name: provisional
        when: "At Registration creation"
        difference: "reference_clock = creation clock; writes amount_due_cents. Charge not captured."
      - name: final
        when: "At confirm-payment (PENDING_PAYMENT->CONFIRMED) or waitlist claim"
        difference: "reference_clock = confirm/claim clock; writes amount_paid_cents and processing_fee_cents. If the active tier changed between creation and confirmation, the final figure diverges from amount_due_cents."

  - name: registration_refund
    trigger: "Registration cancel transition (participant-initiated)"
    algorithm: aggregation
    formula: |
      # Rounding ORDER is PINNED: cancellation fee is computed on the net base
      # (paid minus non-refundable processing fee) and rounded INDEPENDENTLY,
      # then subtracted. ("round the fee component, then subtract" — NOT
      # "subtract a fractional fee then round the whole refund").
      # 1. if status in {PENDING_PAYMENT, WAITLISTED}: refund = 0 (nothing captured)
      # 2. net = amount_paid_cents - processing_fee_cents   # processing fee never refunded
      # 3. cancellation_fee_cents = round_half_up(net * CANCELLATION_FEE_RATE)
      # 4. refund_cents = net - cancellation_fee_cents
      # ORGANIZER-INITIATED cancellation (Event cancel cascade) overrides: refund = amount_paid_cents (full, incl. processing fee), cancellation_fee waived.
    input_set: "Single Registration. Branch on status and on initiator (participant vs organizer cascade)."
    constants:
      CANCELLATION_FEE_RATE: 0.15
    precision: "Integer cents, round_half_up on the fee component only."

  - name: fundraising_progress
    trigger: "Pledge create/settle/void; read on assign-bib eligibility check"
    algorithm: aggregation
    formula: |
      # provisional_pledged_cents = sum(amount_cents) over FundraisingPledge where
      #   registration_id == R.id AND status IN {PLEDGED, SETTLED}
      # settled_pledged_cents    = sum(amount_cents) over FundraisingPledge where
      #   registration_id == R.id AND status == SETTLED
      # VOIDED pledges excluded from both.
    input_set: "All FundraisingPledge rows for the registration; status filter differs per variant."
    constants: {}
    precision: "Integer cents (exact sum, no rounding)."
    variants:
      - name: provisional
        when: "Displayed progress / informational read"
        difference: "Includes PLEDGED and SETTLED — optimistic view of fundraising."
      - name: final
        when: "assign-bib eligibility gate for CHARITY entries"
        difference: "Counts SETTLED only; settled_pledged_cents >= fundraising_minimum_cents required to allow BIB_ASSIGNED."

  - name: corral_assignment
    trigger: "assign-bib transition (CONFIRMED->BIB_ASSIGNED)"
    algorithm: chronological
    formula: |
      # Within the assigned Wave, rank all registrations that already hold a
      # BibAssignment in that wave PLUS the one being assigned now, ordered by:
      #   1. qualifying_time_seconds ASC (NULL sorts LAST)
      #   2. created_at ASC (tie-break)
      # rank is 0-based. corral_index = rank // Wave.corral_capacity.
      # corral letter = chr(ord('A') + corral_index)  ->  A, B, C, ...
      # bib_number = next sequential integer within the distance, starting at
      #   BIB_START_NUMBER, assigned in created_at-ASC order of BibAssignment rows.
    input_set: "Existing BibAssignments in the wave + the registration under assignment; ranked by qualifying_time then created_at."
    constants:
      BIB_START_NUMBER: 100
    precision: "Integer rank/index; created_at ASC tie-break (never id)."

  - name: timing_result
    trigger: "ResultRecord creation by TimingOfficial"
    algorithm: aggregation
    formula: |
      # gun_time_seconds  = finish_clock_seconds - gun_start_clock_seconds
      # chip_time_seconds = finish_clock_seconds - mat_cross_clock_seconds
      # pace_seconds_per_km = round_half_up(chip_time_seconds / distance_km)
      # Requires mat_cross_clock_seconds >= gun_start_clock_seconds and
      # finish_clock_seconds > mat_cross_clock_seconds, else ERR_INVALID_TIMING.
    input_set: "Single ResultRecord plus its Distance.distance_km."
    precision: "Integer seconds; round_half_up for pace."
    variants:
      - name: gun_time
        when: "Official placement / awards"
        difference: "Measured from gun start; larger for back-of-wave starters."
      - name: chip_time
        when: "Personal net time and pace"
        difference: "Measured from mat crossing; basis for pace_seconds_per_km."

  - name: registration_deferral_credit
    trigger: "Registration defer transition (CONFIRMED->DEFERRED)"
    algorithm: aggregation
    formula: |
      # net = amount_paid_cents - processing_fee_cents   # processing fee non-transferable
      # deferral_credit_cents = max(net - DEFERRAL_FEE_CENTS, 0)
      # The credit is recorded on the original registration and carried as the
      # new registration's starting amount_paid_cents is 0 (credit tracked separately).
    input_set: "Single Registration being deferred."
    constants:
      DEFERRAL_FEE_CENTS: 1500
    precision: "Integer cents; floored at 0 (no negative credit)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting entity_backed Participant owns the targeted Registration/Pledge/TransferRequest (X-User-ID == owning participant_id); transfer accept/reject requires X-User-ID == to_participant_id; transfer cancel requires == from_participant_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "participant-owned mutation endpoints"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum values within declared set; party_size>=1; amounts>=1 where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: business_referential
    check: "wave_id belongs to distance_id, and distance_id belongs to event_id, for the Registration being created; pledge target registration is CHARITY; result target registration belongs to distance_id"
    error_id: ERR_RELATION_MISMATCH
    http_status: 422
    applies_to: "POST /registrations, POST /pledges, POST /results"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition (state-machine from-set)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_temporal
    check: "Registration creation only while owning Event.status == OPEN and registration_opens_utc <= now < registration_closes_utc; event open requires now >= registration_opens_utc; post-results requires now >= race_date_utc"
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST /registrations, POST /events/{id}/open, POST /events/{id}/post-results"

  - priority: 9
    category: business_temporal
    check: "Waitlist claim only while current clock < offer_expires_utc"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /waitlist-entries/{id}/claim"

  - priority: 10
    category: business_constraint
    check: "An active PricingTier exists for the distance at the reference clock (now >= earliest effective_from_utc)"
    error_id: ERR_NO_ACTIVE_PRICING_TIER
    http_status: 409
    applies_to: "POST /registrations, POST /registrations/{id}/confirm-payment"

  - priority: 11
    category: business_safety
    check: "For CHARITY entry, settled_pledged_cents >= fundraising_minimum_cents before bib assignment"
    error_id: ERR_FUNDRAISING_MINIMUM_NOT_MET
    http_status: 409
    applies_to: "POST /registrations/{id}/assign-bib"

  - priority: 12
    category: business_temporal
    check: "Wave capacity not exceeded for the corral/wave being assigned (Wave.assigned_count < Wave.wave_capacity)"
    error_id: ERR_WAVE_FULL
    http_status: 409
    applies_to: "POST /registrations/{id}/assign-bib"

  - priority: 13
    category: business_fiscal
    check: "Distance capacity check on confirm/claim: confirmed_count < capacity_total (CHARITY also bounded by charity_capacity). On confirm, full distance routes to WAITLISTED rather than erroring; explicit over-cap claim errors"
    error_id: ERR_DISTANCE_FULL
    http_status: 409
    applies_to: "POST /waitlist-entries/{id}/claim"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_distance_version equals Distance.version on confirm/claim"
    error_id: ERR_STALE_DISTANCE_VERSION
    http_status: 412
    applies_to: "POST /registrations/{id}/confirm-payment, POST /waitlist-entries/{id}/claim"

  - priority: 15
    category: business_constraint
    check: "A Registration may hold at most one ISSUED PacketPickup at a time; second issue rejected"
    error_id: ERR_PACKET_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /packet-pickups"

  - priority: 16
    category: business_constraint
    check: "Packet pickup requires Registration.status in {CONFIRMED, BIB_ASSIGNED}"
    error_id: ERR_PACKET_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /packet-pickups"

  - priority: 17
    category: business_temporal
    check: "A new PricingTier's effective_from_utc must not equal an existing tier's effective_from_utc on the same distance (half-open date windows must tile the timeline without sharing a start instant)"
    error_id: ERR_DUPLICATE_PRICING_TIER
    http_status: 409
    applies_to: "POST /distances/{distance_id}/pricing-tiers"

  - priority: 18
    category: business_temporal
    check: "ResultRecord clocks well-ordered: mat_cross_clock_seconds >= gun_start_clock_seconds and finish_clock_seconds > mat_cross_clock_seconds"
    error_id: ERR_INVALID_TIMING
    http_status: 422
    applies_to: "POST /results"

  - priority: 19
    category: business_referential
    check: "Defer target event is in {DRAFT, OPEN}, differs from source event, and has a Distance matching the source Distance.label"
    error_id: ERR_TARGET_EVENT_INVALID
    http_status: 409
    applies_to: "POST /registrations/{id}/defer"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Participant ---
  - method: POST
    path: "/participants"
    description: "Register a participant account"
    roles: [RaceDirector, Participant]
    code: 201
    input: [email, full_name, birthdate, gender]
    output: Participant
    side_effects: ["status n/a; version=1"]

  - method: GET
    path: "/participants/{participant_id}"
    description: "Read a participant"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: Participant
    side_effects: []

  # --- Event ---
  - method: POST
    path: "/events"
    description: "Create a race event (DRAFT)"
    roles: [RaceDirector]
    code: 201
    input: [name, race_date_utc, registration_opens_utc, registration_closes_utc]
    output: Event
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/events/{event_id}"
    description: "Read an event"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: POST
    path: "/events/{event_id}/open"
    description: "Open registration"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status DRAFT->OPEN; increments Event.version by 1"]

  - method: POST
    path: "/events/{event_id}/close"
    description: "Close registration"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects: ["status OPEN->CLOSED; increments Event.version by 1"]

  - method: POST
    path: "/events/{event_id}/post-results"
    description: "Move event to RESULTS_POSTED"
    roles: [TimingOfficial]
    code: 200
    input: []
    output: Event
    side_effects: ["status CLOSED->RESULTS_POSTED; increments Event.version by 1"]

  - method: POST
    path: "/events/{event_id}/cancel"
    description: "Cancel an event and cascade-cancel registrations and waitlist"
    roles: [RaceDirector]
    code: 200
    input: []
    output: Event
    side_effects:
      - "status->CANCELLED; cascade cancel non-terminal Registrations (full refund); withdraw QUEUED/OFFERED WaitlistEntries"
      - "increments Event.version by 1"

  # --- Distance (sub-resource of Event) ---
  - method: POST
    path: "/events/{event_id}/distances"
    description: "Create a distance under an event"
    roles: [RaceDirector]
    code: 201
    input: [label, distance_km, capacity_total, "charity_capacity?", "charity_fundraising_minimum_cents?"]
    output: Distance
    side_effects: ["confirmed_count=0; version=1"]

  - method: GET
    path: "/events/{event_id}/distances"
    description: "List distances for an event (FK reverse-reachability for Distance.event_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: Distance[]
    side_effects: []

  - method: GET
    path: "/distances/{distance_id}"
    description: "Read a distance (includes computed counts and version for OCC)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: Distance
    side_effects: []

  - method: GET
    path: "/distances"
    description: "List/filter distances (flat FK reverse-reachability for Distance.event_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["event_id?", "limit?", "offset?"]
    output: Distance[]
    side_effects: []

  # --- Wave (sub-resource of Distance) ---
  - method: POST
    path: "/distances/{distance_id}/waves"
    description: "Create a wave under a distance"
    roles: [RaceDirector]
    code: 201
    input: [name, start_offset_seconds, wave_capacity, corral_capacity]
    output: Wave
    side_effects: ["assigned_count=0; version=1"]

  - method: GET
    path: "/distances/{distance_id}/waves"
    description: "List waves for a distance (FK reverse-reachability for Wave.distance_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: Wave[]
    side_effects: []

  - method: GET
    path: "/waves/{wave_id}"
    description: "Read a wave"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: Wave
    side_effects: []

  - method: GET
    path: "/waves"
    description: "List/filter waves (flat FK reverse-reachability for Wave.distance_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["distance_id?", "limit?", "offset?"]
    output: Wave[]
    side_effects: []

  # --- PricingTier (sub-resource of Distance) ---
  - method: POST
    path: "/distances/{distance_id}/pricing-tiers"
    description: "Add a date-based pricing tier to a distance"
    roles: [RaceDirector]
    code: 201
    input: [tier_name, effective_from_utc, base_price_cents]
    output: PricingTier
    side_effects: []

  - method: GET
    path: "/pricing-tiers/{pricing_tier_id}"
    description: "Read a pricing tier"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: PricingTier
    side_effects: []

  - method: GET
    path: "/pricing-tiers"
    description: "List/filter pricing tiers (flat FK reverse-reachability for PricingTier.distance_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["distance_id?", "limit?", "offset?"]
    output: PricingTier[]
    side_effects: []

  # --- Registration ---
  - method: POST
    path: "/registrations"
    description: "Create a registration (PENDING_PAYMENT); computes provisional amount_due"
    roles: [Participant]
    code: 201
    input: [event_id, distance_id, wave_id, participant_id, "entry_type?", "party_size?", "promo_code?", "qualifying_time_seconds?"]
    output: Registration
    side_effects: ["status=PENDING_PAYMENT; amount_due_cents via registration_amount_due provisional; fundraising_minimum_cents set for CHARITY"]

  - method: GET
    path: "/registrations/{registration_id}"
    description: "Read a registration"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: "/registrations"
    description: "List/filter registrations (FK reverse-reachability for distance_id, event_id, wave_id, participant_id, deferred_to_registration_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["event_id?", "distance_id?", "wave_id?", "participant_id?", "deferred_to_registration_id?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: "/registrations/{registration_id}/confirm-payment"
    description: "Confirm payment; CONFIRMED if capacity available else WAITLISTED"
    roles: [Participant]
    code: 200
    input: [expected_distance_version]
    output: Registration
    side_effects:
      - "On capacity available: status->CONFIRMED, amount_paid_cents via final variant, Distance.confirmed_count++, increments Distance.version by 1"
      - "On full: status->WAITLISTED, WaitlistEntry(QUEUED) created"

  - method: POST
    path: "/registrations/{registration_id}/cancel"
    description: "Participant cancels; refund computed; cascade waitlist promotion"
    roles: [Participant]
    code: 200
    input: []
    output: Registration
    side_effects:
      - "status->CANCELLED; refund_cents via registration_refund; release capacity; promote head waitlist entry; delete bib if BIB_ASSIGNED"
      - "increments Distance.version by 1 when a confirmed slot is released"

  - method: POST
    path: "/registrations/{registration_id}/assign-bib"
    description: "Assign bib and corral to a CONFIRMED registration"
    roles: [RaceDirector]
    code: 201
    input: []
    output: BibAssignment
    side_effects:
      - "status CONFIRMED->BIB_ASSIGNED; BibAssignment created (bib_number, corral via corral_assignment); Wave.assigned_count++; increments Wave.version by 1"

  - method: POST
    path: "/registrations/{registration_id}/defer"
    description: "Defer a CONFIRMED registration to another event"
    roles: [Participant]
    code: 200
    input: [target_event_id]
    output: Registration
    side_effects:
      - "status CONFIRMED->DEFERRED; deferral_credit_cents via registration_deferral_credit; new PENDING_PAYMENT Registration created on target event; deferred_to_registration_id set"
      - "Distance.confirmed_count--; increments Distance.version by 1; promote head waitlist entry"

  - method: POST
    path: "/registrations/{registration_id}/finish"
    description: "Mark a bib-assigned registration FINISHED after official result"
    roles: [TimingOfficial]
    code: 200
    input: []
    output: Registration
    side_effects: ["status BIB_ASSIGNED->FINISHED"]

  - method: GET
    path: "/registrations/{registration_id}/bib-assignments"
    description: "List bib assignments for a registration (FK reverse-reachability for BibAssignment.registration_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: BibAssignment[]
    side_effects: []

  - method: GET
    path: "/registrations/{registration_id}/fundraising-pledges"
    description: "List pledges for a registration (FK reverse-reachability for FundraisingPledge.registration_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: FundraisingPledge[]
    side_effects: []

  - method: GET
    path: "/registrations/{registration_id}/packet-pickups"
    description: "List packet pickups for a registration (FK reverse-reachability for PacketPickup.registration_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: PacketPickup[]
    side_effects: []

  - method: GET
    path: "/registrations/{registration_id}/results"
    description: "List results for a registration (FK reverse-reachability for ResultRecord.registration_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: ResultRecord[]
    side_effects: []

  # --- WaitlistEntry ---
  - method: GET
    path: "/waitlist-entries/{waitlist_entry_id}"
    description: "Read a waitlist entry"
    roles: [RaceDirector, Participant]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/distances/{distance_id}/waitlist-entries"
    description: "List waitlist entries for a distance (sub-resource convenience)"
    roles: [RaceDirector, Participant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: GET
    path: "/waitlist-entries"
    description: "List/filter waitlist entries (flat FK reverse-reachability for WaitlistEntry.distance_id, registration_id, participant_id)"
    roles: [RaceDirector, Participant]
    code: 200
    input: ["distance_id?", "registration_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: POST
    path: "/waitlist-entries/{waitlist_entry_id}/claim"
    description: "Claim an OFFERED waitlist slot (confirms the linked registration)"
    roles: [Participant]
    code: 200
    input: [expected_distance_version]
    output: WaitlistEntry
    side_effects:
      - "status OFFERED->CLAIMED; linked Registration->CONFIRMED; amount captured; Distance.confirmed_count++; increments Distance.version by 1"

  - method: POST
    path: "/waitlist-entries/{waitlist_entry_id}/decline"
    description: "Decline an OFFERED waitlist slot"
    roles: [Participant]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status OFFERED->DECLINED; linked Registration->CANCELLED; promote next QUEUED entry"]

  - method: POST
    path: "/waitlist-entries/{waitlist_entry_id}/withdraw"
    description: "Withdraw a QUEUED waitlist entry"
    roles: [Participant]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status QUEUED->WITHDRAWN; linked Registration->CANCELLED"]

  - method: POST
    path: "/waitlist-entries/{waitlist_entry_id}/expire-check"
    description: "System sweep: expire an OFFERED slot whose offer window elapsed"
    roles: [RaceDirector]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status OFFERED->EXPIRED when now >= offer_expires_utc; promote next QUEUED entry"]

  # --- FundraisingPledge ---
  - method: POST
    path: "/pledges"
    description: "Record a fundraising pledge for a CHARITY registration"
    roles: [Participant]
    code: 201
    input: [registration_id, donor_name, amount_cents]
    output: FundraisingPledge
    side_effects: ["status=PLEDGED; counts toward provisional fundraising total"]

  - method: GET
    path: "/pledges/{pledge_id}"
    description: "Read a pledge"
    roles: [RaceDirector, Participant]
    code: 200
    input: []
    output: FundraisingPledge
    side_effects: []

  - method: GET
    path: "/pledges"
    description: "List/filter pledges (flat FK reverse-reachability for FundraisingPledge.registration_id)"
    roles: [RaceDirector, Participant]
    code: 200
    input: ["registration_id?", "status?", "limit?", "offset?"]
    output: FundraisingPledge[]
    side_effects: []

  - method: POST
    path: "/pledges/{pledge_id}/settle"
    description: "Settle a pledge (counts toward final fundraising total)"
    roles: [Participant]
    code: 200
    input: []
    output: FundraisingPledge
    side_effects: ["status PLEDGED->SETTLED"]

  - method: POST
    path: "/pledges/{pledge_id}/void"
    description: "Void a pledge"
    roles: [Participant]
    code: 200
    input: []
    output: FundraisingPledge
    side_effects: ["status->VOIDED; removed from all fundraising totals"]

  # --- TransferRequest ---
  - method: POST
    path: "/transfer-requests"
    description: "Propose transferring a CONFIRMED registration to another participant"
    roles: [Participant]
    code: 201
    input: [registration_id, to_participant_id]
    output: TransferRequest
    side_effects: ["status=PROPOSED; from_participant_id taken from registration owner"]

  - method: GET
    path: "/transfer-requests/{transfer_request_id}"
    description: "Read a transfer request"
    roles: [RaceDirector, Participant]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  - method: GET
    path: "/transfer-requests"
    description: "List/filter transfer requests (flat FK reverse-reachability for registration_id, from_participant_id, to_participant_id)"
    roles: [RaceDirector, Participant]
    code: 200
    input: ["registration_id?", "from_participant_id?", "to_participant_id?", "status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []

  - method: GET
    path: "/registrations/{registration_id}/transfer-requests"
    description: "List transfer requests for a registration (FK reverse-reachability for TransferRequest.registration_id)"
    roles: [RaceDirector, Participant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []

  - method: POST
    path: "/transfer-requests/{transfer_request_id}/accept"
    description: "Recipient accepts; registration transfers"
    roles: [Participant]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status->ACCEPTED; original Registration->TRANSFERRED; new CONFIRMED Registration created for recipient; increments Distance.version by 1"]

  - method: POST
    path: "/transfer-requests/{transfer_request_id}/reject"
    description: "Recipient rejects the transfer"
    roles: [Participant]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status->REJECTED"]

  - method: POST
    path: "/transfer-requests/{transfer_request_id}/cancel"
    description: "Proposer cancels the transfer"
    roles: [Participant]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["status->CANCELLED"]

  # --- BibAssignment ---
  - method: GET
    path: "/bib-assignments/{bib_assignment_id}"
    description: "Read a bib assignment"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: BibAssignment
    side_effects: []

  - method: GET
    path: "/bib-assignments"
    description: "List/filter bib assignments (flat FK reverse-reachability for registration_id, distance_id, wave_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["registration_id?", "distance_id?", "wave_id?", "limit?", "offset?"]
    output: BibAssignment[]
    side_effects: []

  - method: GET
    path: "/waves/{wave_id}/bib-assignments"
    description: "List bib assignments in a wave (FK reverse-reachability for BibAssignment.wave_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: BibAssignment[]
    side_effects: []

  - method: GET
    path: "/distances/{distance_id}/bib-assignments"
    description: "List bib assignments in a distance (FK reverse-reachability for BibAssignment.distance_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["limit?", "offset?"]
    output: BibAssignment[]
    side_effects: []

  # --- PacketPickup ---
  - method: POST
    path: "/packet-pickups"
    description: "Issue a packet pickup for a CONFIRMED/BIB_ASSIGNED registration"
    roles: [PacketStaff]
    code: 201
    input: [registration_id, picked_up_by_name, "id_verified?"]
    output: PacketPickup
    side_effects: ["status=ISSUED"]

  - method: GET
    path: "/packet-pickups/{pickup_id}"
    description: "Read a packet pickup"
    roles: [RaceDirector, Participant, PacketStaff]
    code: 200
    input: []
    output: PacketPickup
    side_effects: []

  - method: GET
    path: "/packet-pickups"
    description: "List/filter packet pickups (flat FK reverse-reachability for PacketPickup.registration_id)"
    roles: [RaceDirector, Participant, PacketStaff]
    code: 200
    input: ["registration_id?", "status?", "limit?", "offset?"]
    output: PacketPickup[]
    side_effects: []

  - method: POST
    path: "/packet-pickups/{pickup_id}/void"
    description: "Void a packet pickup"
    roles: [PacketStaff]
    code: 200
    input: []
    output: PacketPickup
    side_effects: ["status ISSUED->VOIDED"]

  # --- ResultRecord ---
  - method: POST
    path: "/results"
    description: "Post a timing-chip result for a bib-assigned registration"
    roles: [TimingOfficial]
    code: 201
    input: [registration_id, distance_id, gun_start_clock_seconds, mat_cross_clock_seconds, finish_clock_seconds]
    output: ResultRecord
    side_effects: ["status=PROVISIONAL; gun_time/chip_time/pace via timing_result"]

  - method: GET
    path: "/results/{result_id}"
    description: "Read a result record"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: []
    output: ResultRecord
    side_effects: []

  - method: GET
    path: "/results"
    description: "List/filter results (flat FK reverse-reachability for ResultRecord.registration_id, distance_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["registration_id?", "distance_id?", "status?", "limit?", "offset?"]
    output: ResultRecord[]
    side_effects: []

  - method: GET
    path: "/distances/{distance_id}/results"
    description: "List results for a distance (FK reverse-reachability for ResultRecord.distance_id)"
    roles: [RaceDirector, Participant, PacketStaff, TimingOfficial]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ResultRecord[]
    side_effects: []

  - method: POST
    path: "/results/{result_id}/finalize"
    description: "Mark a result OFFICIAL"
    roles: [TimingOfficial]
    code: 200
    input: []
    output: ResultRecord
    side_effects: ["status PROVISIONAL->OFFICIAL"]

  - method: POST
    path: "/results/{result_id}/disqualify"
    description: "Disqualify a result"
    roles: [TimingOfficial]
    code: 200
    input: []
    output: ResultRecord
    side_effects: ["status->DQ"]

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC clock"
    roles: [RaceDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock advanced/rewound to to_iso8601 for time-gated logic"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting participant is not the owner / not the required transfer party" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed body field, bad enum, party_size<1, amount<1" }
  - { id: ERR_RELATION_MISMATCH, http: 422, condition: "wave/distance/event chain inconsistent, pledge target not CHARITY, or result registration not on distance" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_REGISTRATION_CLOSED, http: 409, condition: "Registration window not open (event not OPEN, or clock outside open/close window)" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Waitlist claim attempted at/after offer_expires_utc" }
  - { id: ERR_NO_ACTIVE_PRICING_TIER, http: 409, condition: "No PricingTier active at the reference clock for the distance" }
  - { id: ERR_FUNDRAISING_MINIMUM_NOT_MET, http: 409, condition: "CHARITY settled pledges below fundraising_minimum_cents at bib assignment" }
  - { id: ERR_WAVE_FULL, http: 409, condition: "Wave.assigned_count >= Wave.wave_capacity at bib assignment" }
  - { id: ERR_DISTANCE_FULL, http: 409, condition: "Distance at/over capacity on an explicit claim" }
  - { id: ERR_STALE_DISTANCE_VERSION, http: 412, condition: "expected_distance_version != Distance.version on confirm/claim (OCC)" }
  - { id: ERR_PACKET_ALREADY_ISSUED, http: 409, condition: "Registration already holds an ISSUED PacketPickup" }
  - { id: ERR_PACKET_NOT_ELIGIBLE, http: 409, condition: "Packet pickup requires registration CONFIRMED or BIB_ASSIGNED" }
  - { id: ERR_INVALID_TIMING, http: 422, condition: "mat_cross < gun_start, or finish <= mat_cross when posting a result" }
  - { id: ERR_TARGET_EVENT_INVALID, http: 409, condition: "Defer target event missing matching distance, not in {DRAFT,OPEN}, or same as source event" }
  - { id: ERR_DUPLICATE_PRICING_TIER, http: 409, condition: "A PricingTier with the same effective_from_utc already exists on the distance" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Participant
    description: "A registrant; owns their Registrations, FundraisingPledges, and TransferRequests"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /registrations — create own registration"
      - "POST /registrations/{id}/confirm-payment — confirm own"
      - "POST /registrations/{id}/cancel — cancel own"
      - "POST /registrations/{id}/defer — defer own"
      - "POST /pledges — pledge for own CHARITY registration"
      - "POST /pledges/{id}/settle, /void"
      - "POST /transfer-requests — propose; /accept, /reject, /cancel"
      - "POST /waitlist-entries/{id}/claim, /decline, /withdraw"
    shared_operations:
      - "POST /participants — self-register (shared with RaceDirector)"
      - "GET reads of own and public race data"

  - name: RaceDirector
    description: "Organizer; owns Events, Distances, Waves, PricingTiers; assigns bibs; runs waitlist sweeps"
    identity: "opaque"
    exclusive_operations:
      - "POST /events, /events/{id}/open, /close, /cancel"
      - "POST /events/{id}/distances, /distances/{id}/waves, /distances/{id}/pricing-tiers"
      - "POST /registrations/{id}/assign-bib"
      - "POST /waitlist-entries/{id}/expire-check"
    shared_operations:
      - "POST /participants — create participants (shared with Participant)"
      - "GET reads across all resources"

  - name: PacketStaff
    description: "Race-week staff handling packet pickup"
    identity: "opaque"
    exclusive_operations:
      - "POST /packet-pickups — issue packet"
      - "POST /packet-pickups/{id}/void"
    shared_operations:
      - "GET reads of registrations, participants, packet pickups"

  - name: TimingOfficial
    description: "Posts and finalizes timing-chip results; moves events to RESULTS_POSTED; marks finishers"
    identity: "opaque"
    exclusive_operations:
      - "POST /events/{id}/post-results"
      - "POST /results, /results/{id}/finalize, /disqualify"
      - "POST /registrations/{id}/finish"
    shared_operations:
      - "GET reads of results, registrations, distances"
