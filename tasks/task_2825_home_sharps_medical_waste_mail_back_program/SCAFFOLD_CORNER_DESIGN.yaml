      - name: autoship_processes_enrollments_in_created_at_order_so_the_earlier_one_takes_the_last_funding
        claim_type: chronological
        grounds:
          - calculations.autoship_due_evaluation
          - calculations.autoship_due_evaluation.constants.SKIP_REASON_ORDER
          - entities.SponsorshipProgram.fields.available_cents
          - endpoints.POST /sharps/programs/{id}/funding-adjustments
        distinguishing_aspect: "The program can fund exactly one 1465-cent kit, and the enrollment created at 00:00:00Z takes it while the one created at 01:00:00Z is counted in kits_skipped_funding — processing order is created_at ASC, and the running available_cents is what starves the later enrollment. After a +1000 top-up the second run flips the roles and reports kits_skipped_unfilled for the first enrollment, proving unfilled is evaluated before funding."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule; MANUFACTURER sponsor; program with a deliberately tiny ceiling of 2000 cents and a 5000-cent per-kit allowance."
            - "Ada's enrollment created at 2026-08-01T00:00:00Z and approved; the clock is then moved to 2026-08-01T01:00:00Z and Ben's enrollment is created and approved, so Ada.created_at < Ben.created_at strictly."
            - "Both are ACTIVE, cadence 30, 3 kits authorized, both with next_autoship_due_date 2026-08-01 and no kit yet; each would cost 1465 cents (ONE_QUART)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-TIGHT", funding_ceiling_cents: 2000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Ada Stone", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "ada@example.com" }
              as: ProgramAdmin
              captures: { pat_a: $.data.id }
            - call: "POST /sharps/patients/${pat_a}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_a}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_a: $.data.id }
            - call: "POST /sharps/enrollments/${enr_a}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_a}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/patients"
              payload: { full_name: "Ben Ortiz", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "ben@example.com" }
              as: ProgramAdmin
              captures: { pat_b: $.data.id }
            - call: "POST /sharps/patients/${pat_b}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_b}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_b: $.data.id }
            - call: "POST /sharps/enrollments/${enr_b}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_b}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
          trigger:
            - call: "POST /sharps/auto-ship-runs"
              payload: { as_of_date: "2026-08-01" }
              as: ProgramAdmin
              captures: { run1: $.data.id }
            - call: "GET /sharps/kits?enrollment_id=${enr_a}"
              payload: {}
              as: ProgramAdmin
              captures: { kit_a: "$.data[0].id" }
            - call: "GET /sharps/programs/${prog}"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v: $.data.version }
            - call: "POST /sharps/programs/${prog}/funding-adjustments"
              payload: { delta_cents: 1000, expected_program_version: "${prog_v}", memo: "top-up so the starved enrollment can ship" }
              as: ProgramAdmin
            - call: "POST /sharps/auto-ship-runs"
              payload: { as_of_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { run2: $.data.id }
            - call: "GET /sharps/kits?enrollment_id=${enr_b}"
              payload: {}
              as: ProgramAdmin
              captures: { kit_b: "$.data[0].id" }
          assert:
            - "AutoShipRun.${run1}.enrollments_evaluated == 2, kits_created == 1, kits_skipped_funding == 1, kits_skipped_not_due == 0, kits_skipped_risk == 0, kits_skipped_unfilled == 0"
            - "AutoShipRun.${run1}.created_kit_ids == [\"${kit_a}\"] (Ada, the earlier created_at, wins the last 1465 cents)"
            - "Kit.${kit_a}.provisional_cost_cents == 1465 and Kit.${kit_a}.auto_ship_run_id == ${run1}"
            - "immediately after ${run1}: SponsorshipProgram.${prog}.reserved_cents == 1465, available_cents == 535 and status == \"ACTIVE\""
            - "immediately after ${run1}: Enrollment.${enr_a}.kits_issued == 1 and next_autoship_due_date == \"2026-08-31\"; Enrollment.${enr_b}.kits_issued == 0 and next_autoship_due_date == \"2026-08-01\" (unchanged by the skip)"
            - "GET /sharps/kits?enrollment_id=${enr_b} returns total_count == 0 immediately after ${run1}"
            - "the funding adjustment returns HTTP 200 with funding_ceiling_cents == 3000, available_cents == 1535 and version == ${prog_v} + 1"
            - "AutoShipRun.${run2}.enrollments_evaluated == 2, kits_created == 1, kits_skipped_unfilled == 1, kits_skipped_funding == 0, kits_skipped_not_due == 0, kits_skipped_risk == 0"
            - "AutoShipRun.${run2}.created_kit_ids == [\"${kit_b}\"] (Ada is skipped as unfilled, which is evaluated before funding)"
            - "after ${run2}: SponsorshipProgram.${prog}.reserved_cents == 2930, available_cents == 70, kits_issued_count == 2 and status == \"ACTIVE\""
            - "after ${run2}: Enrollment.${enr_b}.kits_issued == 1 and next_autoship_due_date == \"2026-09-30\" (as_of_date 2026-08-31 plus 30 days)"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns exactly 3 entries in sequence_no ASC: (RESERVATION, +1465, kit_id ${kit_a}), (FUNDING_ADJUSTMENT, +1000, kit_id null), (RESERVATION, +1465, kit_id ${kit_b})"

      - name: retention_deadline_takes_the_stricter_state_and_clamps_the_feb_29_anniversary
        claim_type: constants_applied
        grounds:
          - calculations.certificate_retention_deadline
          - entities.StateSharpsRule.fields.certificate_retention_years
          - entities.DestructionCertificate.fields.retention_until_date
          - entities.DestructionCertificate.fields.destruction_date
        distinguishing_aspect: "The patient's state demands 3 years and the facility's state 7, so the deadline is keyed on 7 (2035-02-28), not 3 (2031-02-28); and because 2035 has no 29 February the calendar-year anniversary of a 2028-02-29 destruction clamps back to 2035-02-28, while a destruction one day later yields an unclamped 2035-03-01."
        test_recipe:
          setup:
            - "Clock at 2028-02-20T00:00:00Z; CA rule with certificate_retention_years 3 (governs the patient) and NY rule with certificate_retention_years 7 (governs the facility)."
            - "ACTIVE packaging spec; facility \"NY-TF-0007\" bound to the NY rule, capacity 200."
            - "MANUFACTURER sponsor, program 500000 / 5000; patient Dana on the CA rule (INSULIN_PEN_NEEDLES, 20/week) ENROLLED, enrollment ACTIVE cadence 30, 3 kits."
            - "Kit ONE_QUART issued, acknowledged, sealed at 60 units / 1200 g, labelled, tendered for intake 2028-02-25, delivered and screened CONFORMING at 1200 g by tech-77."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-20T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/state-rules"
              payload: { state_code: "NY", household_sharps_classification: "REGULATED_MEDICAL_WASTE", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 7 }
              as: ProgramAdmin
              captures: { sr_ny: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "MB-4G-STD", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 8000, allowed_container_sizes: [ONE_QUART, TWO_GALLON] }
              as: ProgramAdmin
              captures: { spec: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Hudson Medical Waste Works", state_rule_id: "${sr_ny}", permit_number: "NY-TF-0007", accepted_hazard_classes: [UN3291_SHARPS_ONLY], daily_intake_capacity_units: 200 }
              as: ProgramAdmin
              captures: { fac: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2028", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /sharps/enrollments/${enr}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_v: $.data.version }
            - call: "POST /sharps/enrollments/${enr}/kits"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ProgramAdmin
              captures: { kit: $.data.id }
            - call: "POST /sharps/kits/${kit}/acknowledge-receipt"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit}/seal"
              payload: { fill_units: 60, sealed_gross_weight_grams: 1200 }
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit}/return-labels"
              payload: { packaging_spec_id: "${spec}" }
              as: LogisticsCoordinator
              captures: { lbl: $.data.id }
            - call: "POST /sharps/return-labels/${lbl}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2028-02-25", declared_gross_weight_grams: 1200 }
              as: LogisticsCoordinator
              captures: { shp: $.data.id }
            - call: "POST /sharps/shipments/${shp}/transport-events"
              payload: { event_type: "IN_TRANSIT" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp}/transport-events"
              payload: { event_type: "DELIVERED" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp}/conformance-screening"
              payload: { outcome: "CONFORMING", observed_gross_weight_grams: 1200 }
              as: IntakeTechnician
              as_user_id: "tech-77"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-29T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/shipments/${shp}/destruction-certificates"
              payload: { destroyed_units: 60 }
              as: DestructionOfficer
              as_user_id: "officer-12"
              captures: { cert_leap: $.data.id }
            - call: "POST /sharps/destruction-certificates/${cert_leap}/void"
              payload: { void_reason: "wrong destruction date recorded" }
              as: DestructionOfficer
              as_user_id: "officer-12"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-01T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/shipments/${shp}/destruction-certificates"
              payload: { destroyed_units: 60 }
              as: DestructionOfficer
              as_user_id: "officer-12"
              captures: { cert_march: $.data.id }
          assert:
            - "DestructionCertificate.${cert_leap}.destruction_date == \"2028-02-29\""
            - "DestructionCertificate.${cert_leap}.retention_until_date == \"2035-02-28\" (7 years from the facility's NY rule, clamped off the missing 29 February)"
            - "DestructionCertificate.${cert_leap}.retention_until_date != \"2031-02-28\" (the patient's 3-year CA rule does not win)"
            - "DestructionCertificate.${cert_leap}.certificate_number == \"CERT-NY-TF-0007-00001\""
            - "DestructionCertificate.${cert_leap}.final_kit_cost_cents == 1676 and rebate_pct_applied == 0.00"
            - "DestructionCertificate.${cert_march}.destruction_date == \"2028-03-01\""
            - "DestructionCertificate.${cert_march}.retention_until_date == \"2035-03-01\" (no clamp needed one day later)"
            - "DestructionCertificate.${cert_march}.certificate_number == \"CERT-NY-TF-0007-00002\""
            - "Kit.${kit}.status == \"DESTROYED\" and TreatmentFacility.${fac}.destroyed_units_total == 60"
            - "TreatmentFacility.${fac}.certificates_issued_count == 2 and pending_intake_units == 0"

