      - name: selector_policy_filters_before_it_ranks_and_breaks_a_symmetric_price_tie_by_the_cheaper_sku
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers.selector_policy
          - calculations.substitute_sku_selector
          - state_machines.PickTask.RETRIEVING->SHORT
        distinguishing_aspect: "Four candidates share the group and zone temperature: two are removed by the eligibility filter BEFORE ranking even though their price distance is zero (one is out of stock for the ordered quantity, one sits in an AUDIT_HOLD zone), and the two survivors are exactly symmetric at 50 cents above and below the ordered price, so only the second rank key -- unit_price_cents ASC -- can decide. The winner is the CHEAPER substitute and the resulting delta is negative."
