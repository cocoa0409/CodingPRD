      - name: lease_below_the_minimum_term_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=43]", "errors[ERR_BELOW_MIN_LEASE_TERM]", "entities.Lease.fields.initial_cycles"]
        distinguishing_aspect: "initial_cycles 2 is below MIN_LEASE_CYCLES and returns ERR_BELOW_MIN_LEASE_TERM (422) at rung 43, BEFORE the vendor minimum-term check at rung 44 gets a chance to complain about the same install."
        test_recipe:
          setup: ["The submitted-pull VACANT project with a vendor whose min_lease_cycles is 12."]
          setup_api_calls: *v_submitted_c
          trigger:
            - call: "POST /staging/pulls/${pull_id}/commit"
              payload: { expected_project_version: "${proj_v}" }
              as: WarehouseManager
            - call: "POST /staging/projects/${proj_id}/installs"
              payload: { scheduled_at: "2026-06-10T09:00:00Z", crew_size: 3, initial_cycles: 2 }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_BELOW_MIN_LEASE_TERM"
            - "Project.${proj_id}.workflow_state == PULL_OPEN"

      - name: vendor_minimum_term_unreachable_even_at_the_extension_cap_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=44]", "errors[ERR_VENDOR_MIN_TERM_VIOLATION]", "calculations.vendor_effective_term_cycles"]
        distinguishing_aspect: "With initial_cycles 3 the project could reach at most 9 cycles, below the vendor's 12-cycle effective term, so rung 44 returns ERR_VENDOR_MIN_TERM_VIOLATION (422) — a vendor minimum that merely EXCEEDS the term would have been allowed and billed as a shortfall."
        test_recipe:
          setup: ["The submitted-pull VACANT project with a vendor whose min_lease_cycles is 12."]
          setup_api_calls: *v_submitted_c
          trigger:
            - call: "POST /staging/pulls/${pull_id}/commit"
              payload: { expected_project_version: "${proj_v}" }
              as: WarehouseManager
            - call: "POST /staging/projects/${proj_id}/installs"
              payload: { scheduled_at: "2026-06-10T09:00:00Z", crew_size: 3, initial_cycles: 3 }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_VENDOR_MIN_TERM_VIOLATION"
            - "RentalOrder.${ro_id}.effective_term_cycles == 12"
            - "Project.${proj_id}.workflow_state == PULL_OPEN"

      - name: zero_cycle_extension_request_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=45]", "errors[ERR_PARTIAL_CYCLE_EXTENSION]", "entities.Extension.fields.requested_cycles"]
        distinguishing_aspect: "requested_cycles 0 passes the shape gate but fails rung 45 with ERR_PARTIAL_CYCLE_EXTENSION (422); no Extension row is created and the lease keeps billed_cycles 4."
        test_recipe:
          setup: ["The canonical VACANT project with an ACTIVE four-cycle lease."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "GET /staging/leases/${lease_id}"
              payload: {}
              as: StagingCoordinator
              captures: { lease_v: "$.data.version" }
            - call: "POST /staging/leases/${lease_id}/extensions"
              payload: { requested_cycles: 0, expected_lease_version: "${lease_v}" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_PARTIAL_CYCLE_EXTENSION"
            - "Lease.${lease_id}.billed_cycles == 4"
            - "Lease.${lease_id}.extension_cycles == 0"

      - name: extension_beyond_the_total_cycle_cap_rejected
        claim_type: Aggregate validation
        grounds: ["validations[priority=46]", "errors[ERR_EXTENSION_LIMIT_REACHED]", "calculations.lease_term_cycles"]
        distinguishing_aspect: "A 7-cycle request passes the whole-increment check but would push extension_cycles past MAX_EXTENSION_CYCLES_TOTAL, so rung 46 returns ERR_EXTENSION_LIMIT_REACHED (409)."
        test_recipe:
          setup: ["The canonical VACANT project with an ACTIVE four-cycle lease and no extensions applied."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "GET /staging/leases/${lease_id}"
              payload: {}
              as: StagingCoordinator
              captures: { lease_v: "$.data.version" }
            - call: "POST /staging/leases/${lease_id}/extensions"
              payload: { requested_cycles: 7, expected_lease_version: "${lease_v}" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_EXTENSION_LIMIT_REACHED"
            - "Lease.${lease_id}.extension_cycles == 0"
            - "Lease.${lease_id}.billed_cycles == 4"

      - name: upgrade_to_the_same_tier_rejected_as_invalid_tier_change
        claim_type: Violation to Error
        grounds: ["validations[priority=47]", "errors[ERR_INVALID_TIER_CHANGE]", "calculations.upgrade_adjustment"]
        distinguishing_aspect: "An upgrade whose target tier_rank is not STRICTLY greater than the current one returns ERR_INVALID_TIER_CHANGE (422); contract_value is untouched at 7690.00."
        test_recipe:
          setup: ["The canonical VACANT project staged on the SIGNATURE tier."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "POST /staging/projects/${proj_id}/upgrade-package"
              payload: { package_tier_id: "${tier_sig}" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_TIER_CHANGE"
            - "Project.${proj_id}.package_tier_id == ${tier_sig}"
            - "Project.${proj_id}.contract_value == 7690.00"

      - name: shoot_scheduled_before_install_completion_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=48]", "errors[ERR_SHOOT_BEFORE_INSTALL]", "state_machines.Install.IN_PROGRESS_to_COMPLETE"]
        distinguishing_aspect: "On a VACANT_STAGING project with no COMPLETE install, scheduling a shoot returns ERR_SHOOT_BEFORE_INSTALL (409) — the Pipeline V prerequisite that has no counterpart on the occupied arm."
        test_recipe:
          setup: ["A VACANT project at PULL_OPEN with a committed pull and no install at all."]
          setup_api_calls: *v_committed_c
          trigger:
            - call: "POST /staging/projects/${proj_id}/photo-shoots"
              payload: { scheduled_at: "2026-06-20T10:00:00Z", is_reshoot: false }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_SHOOT_BEFORE_INSTALL"
            - "Project.${proj_id}.photo_sessions_consumed == 0"

      - name: second_reshoot_request_exhausts_the_entitlement
        claim_type: Conditional validation
        grounds: ["validations[priority=51]", "errors[ERR_RESHOOT_ENTITLEMENT_EXHAUSTED]", "entities.Project.fields.reshoot_credits_remaining", "conservation_invariants.photo_entitlement_conservation"]
        distinguishing_aspect: "RESHOOT_ENTITLEMENT_PER_PACKAGE is 1, so the first reshoot request succeeds and drops reshoot_credits_remaining to 0 while the second returns ERR_RESHOOT_ENTITLEMENT_EXHAUSTED (409)."
        test_recipe:
          setup: ["The canonical VACANT project staged with one COMPLETED shoot on 2026-06-11T10:00:00Z."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "POST /staging/projects/${proj_id}/photo-shoots"
              payload: { scheduled_at: "2026-06-11T10:00:00Z", is_reshoot: false }
              as: StagingCoordinator
              captures: { shoot_1: "$.data.id" }
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/photo-shoots/${shoot_1}/complete"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/photo-shoots/${shoot_1}/request-reshoot"
              payload: { scheduled_at: "2026-06-12T10:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { shoot_2: "$.data.id" }
            - call: "POST /staging/photo-shoots/${shoot_1}/request-reshoot"
              payload: { scheduled_at: "2026-06-13T10:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_RESHOOT_ENTITLEMENT_EXHAUSTED"
            - "Project.${proj_id}.reshoot_credits_remaining == 0"
            - "Project.${proj_id}.photo_sessions_consumed == 1"
            - "PhotoShoot.${shoot_2}.is_reshoot == true"
            - "PhotoShoot.${shoot_2}.state == SCHEDULED"

      - name: pull_line_room_label_outside_the_scope_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=52]", "errors[ERR_SCOPE_ITEM_NOT_FOUND]", "entities.PullLine.fields.room_label"]
        distinguishing_aspect: "A pull line naming a room that no ScopeItem on the project's consultation declares returns ERR_SCOPE_ITEM_NOT_FOUND (404) at rung 52 — the ONLY not-found code raised by a value rather than by an id."
        test_recipe:
          setup: ["A VACANT project at PULL_OPEN whose consultation scopes only the room named Living."]
          setup_api_calls: *v_submitted_c
          trigger:
            - call: "POST /staging/pulls/${pull_id}/lines"
              payload: { source: "OWNED", category: "SOFA", room_label: "Sunroom", quantity: 1 }
              as: WarehouseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_SCOPE_ITEM_NOT_FOUND"
            - "InventoryPull.${pull_id}.requested_unit_count == 4"

      - name: pickup_scheduled_outside_the_window_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=60]", "errors[ERR_PICKUP_OUTSIDE_WINDOW]", "calculations.pickup_window"]
        distinguishing_aspect: "A pickup proposed for 2026-11-01T09:00:00Z, twelve days past pickup_window_end, returns ERR_PICKUP_OUTSIDE_WINDOW (422)."
        test_recipe:
          setup: ["The canonical VACANT project with its term marked complete and the auto-created pickup cancelled out of the way by an escrow round trip."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/listings/${listing_id}/fall-out-of-escrow"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /staging/leases/${lease_id}/mark-term-complete"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/projects/${proj_id}/pickups"
              payload: { lease_id: "${lease_id}", scheduled_at: "2026-11-01T09:00:00Z" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_PICKUP_OUTSIDE_WINDOW"
            - "Lease.${lease_id}.pickup_window_end == 2026-10-20T09:00:00.000Z"

  - section: rbac
    instances:

      - name: missing_role_header_returns_unauthenticated
        claim_type: Cannot perform other roles exclusive operations
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header is refused at rung 1 with ERR_UNAUTHENTICATED (401) before any existence check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: *clk
          trigger:
            - call: "GET /staging/projects/11111111-1111-4111-8111-11111111112a"
              payload: {}
              as: MISSING
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: entity_backed_role_missing_x_user_id_returns_identity_required
        claim_type: Segregation of duties
        grounds: ["validations[priority=3]", "errors[ERR_IDENTITY_REQUIRED]", "roles.ListingAgent.identity"]
        distinguishing_aspect: "ListingAgent is entity_backed:Client, so omitting X-User-ID returns ERR_IDENTITY_REQUIRED (401) at rung 3 — a check the opaque roles never face."
        test_recipe:
          setup: ["An ACTIVE listing with a known listing agent."]
          setup_api_calls: *listing_ready_2
          trigger:
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 401"
            - "response.data.error_id == ERR_IDENTITY_REQUIRED"
            - "Listing.${listing_id}.listing_state == ACTIVE"

      - name: foreign_listing_agent_cannot_drive_another_agents_listing
        claim_type: peer_roles
        grounds: ["validations[priority=10]", "errors[ERR_NOT_LISTING_AGENT]", "entities.Listing.fields.listing_agent_client_id"]
        distinguishing_aspect: "A ListingAgent whose X-User-ID is not the listing's listing_agent_client_id is refused at rung 10 with ERR_NOT_LISTING_AGENT (403), even though the ListingAgent ROLE is permitted on the endpoint."
        test_recipe:
          setup: ["An ACTIVE listing owned by agent A, plus a second unrelated LISTING_AGENT B."]
          setup_api_calls: *listing_ready_2
          trigger:
            - call: "POST /staging/clients"
              payload: { client_type: "LISTING_AGENT", full_name: "Vi Chen", email: "vi@ex.com", personal_authorization_cap: 4500.00 }
              as: PlatformAdmin
              captures: { agent_b: "$.data.id" }
            - call: "POST /staging/listings/${listing_id}/under-contract"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_NOT_LISTING_AGENT"
            - "Listing.${listing_id}.listing_state == ACTIVE"

      - name: foreign_seller_cannot_record_consent_for_another_seller
        claim_type: peer_roles
        grounds: ["validations[priority=11]", "errors[ERR_NOT_PROPERTY_OWNER]", "endpoints.POST./staging/clients/{client_id}/seller-consent"]
        distinguishing_aspect: "seller-consent demands X-User-ID equal to the {client_id} in the path; a different SELLER is refused at rung 11 with ERR_NOT_PROPERTY_OWNER (403) and consent_on_file stays false."
        test_recipe:
          setup: ["Two SELLER clients."]
          setup_api_calls: *listing_ready_2
          trigger:
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Sam Okoye", email: "sam@ex.com" }
              as: PlatformAdmin
              captures: { seller_b: "$.data.id" }
            - call: "POST /staging/clients/${seller_id}/seller-consent"
              payload: {}
              as: Seller
              as_user_id: "${seller_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_NOT_PROPERTY_OWNER"
            - "Client.${seller_id}.consent_on_file == false"

      - name: foreign_brokerage_admin_cannot_authorize_another_firms_project
        claim_type: peer_roles
        grounds: ["validations[priority=12]", "errors[ERR_NOT_PROJECT_PARTY]", "roles.BrokerageAdmin.identity"]
        distinguishing_aspect: "BrokerageAdmin is entity_backed:Brokerage, so an X-User-ID that is not the project's brokerage_id is refused at rung 12 with ERR_NOT_PROJECT_PARTY (403)."
        test_recipe:
          setup: ["The canonical VACANT project in DRAFT with brokerage_id unset, plus a second brokerage."]
          setup_api_calls: *v_draft_c
          trigger:
            - call: "POST /staging/brokerages"
              payload: { name: "Alder Group", license_code: "BR-7788", authorization_cap: 15000.00 }
              as: PlatformAdmin
              captures: { brk_b: "$.data.id" }
            - call: "POST /staging/projects/${proj_id}/authorize"
              payload: {}
              as: BrokerageAdmin
              as_user_id: "${brk_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_NOT_PROJECT_PARTY"
            - "Project.${proj_id}.workflow_state == DRAFT"

      - name: foreign_vendor_rep_cannot_confirm_another_vendors_order
        claim_type: peer_roles
        grounds: ["validations[priority=13]", "errors[ERR_NOT_ORDER_VENDOR]", "roles.VendorRep.identity"]
        distinguishing_aspect: "VendorRep is entity_backed:VendorPartner; confirming with an X-User-ID that is not the order's vendor_id is refused at rung 13 with ERR_NOT_ORDER_VENDOR (403) and the order stays PLACED."
        test_recipe:
          setup: ["A VACANT project with a PLACED order against Metro Rentals and a second, unrelated vendor."]
          setup_api_calls: *v_submitted_c
          trigger:
            - call: "POST /staging/vendors"
              payload: { name: "Cascade Staging Supply", lead_time_days: 5, min_lease_cycles: 3, cancel_cutoff_days: 2, rate_multiplier: 1.20 }
              as: WarehouseManager
              captures: { vendor_b: "$.data.id" }
            - call: "POST /staging/rental-orders"
              payload: { project_id: "${proj_id}", vendor_id: "${vendor_b}", unit_count: 2 }
              as: WarehouseManager
              captures: { ro_b: "$.data.id" }
            - call: "POST /staging/rental-orders/${ro_b}/place"
              payload: {}
              as: WarehouseManager
            - call: "POST /staging/rental-orders/${ro_b}/confirm"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_NOT_ORDER_VENDOR"
            - "RentalOrder.${ro_b}.state == PLACED"

      - name: warehouse_manager_cannot_issue_an_invoice
        claim_type: Segregation of duties
        grounds: ["validations[priority=4]", "errors[ERR_UNAUTHORIZED]", "roles.WarehouseManager.description", "roles.BillingClerk.exclusive_operations"]
        distinguishing_aspect: "Invoice issuance is a BillingClerk exclusive; the WarehouseManager who ran the allocation pass is refused at rung 4 with ERR_UNAUTHORIZED (403), which is the segregation-of-duties boundary the role model declares."
        test_recipe:
          setup: ["Empty database; only the endpoint's role list is under test."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/invoices/11111111-1111-4111-8111-11111111112b/issue"
              payload: {}
              as: WarehouseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: billing_clerk_cannot_adjudicate_a_damage_appeal
        claim_type: Segregation of duties
        grounds: ["validations[priority=4]", "errors[ERR_UNAUTHORIZED]", "roles.PlatformAdmin.exclusive_operations", "roles.BillingClerk.description"]
        distinguishing_aspect: "Damage-appeal adjudication is a PlatformAdmin exclusive; the BillingClerk who will bill the damage is refused at rung 4 with ERR_UNAUTHORIZED (403) — the mirror image of the warehouse-cannot-invoice boundary."
        test_recipe:
          setup: ["Empty database; only the endpoint's role list is under test."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/damage-assessments/11111111-1111-4111-8111-11111111112c/adjudicate"
              payload: { decision: "UPHOLD" }
              as: BillingClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: staging_coordinator_cannot_run_the_allocation_pass
        claim_type: peer_roles
        grounds: ["validations[priority=4]", "errors[ERR_UNAUTHORIZED]", "roles.WarehouseManager.exclusive_operations"]
        distinguishing_aspect: "The allocation pass is a WarehouseManager exclusive; the StagingCoordinator who schedules the install is refused at rung 4 with ERR_UNAUTHORIZED (403) and the pull stays SUBMITTED."
        test_recipe:
          setup: ["A VACANT project with a SUBMITTED pull."]
          setup_api_calls: *v_submitted_c
          trigger:
            - call: "POST /staging/pulls/${pull_id}/commit"
              payload: { expected_project_version: "${proj_v}" }
              as: StagingCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "InventoryPull.${pull_id}.state == SUBMITTED"

  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_project_version_on_pull_commit_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pull-commit-stale-project]", "validations[priority=35]", "errors[ERR_STALE_PROJECT_VERSION]"]
        distinguishing_aspect: "A commit carrying expected_project_version one behind the stored Project.version is refused with ERR_STALE_PROJECT_VERSION (412) and the pull stays SUBMITTED; the same call with the correct version succeeds."
        test_recipe:
          setup: ["A VACANT project with a SUBMITTED, fully filled pull and the project's current version read."]
          setup_api_calls: *v_submitted_c
          trigger:
            - call: "POST /staging/pulls/${pull_id}/commit"
              payload: { expected_project_version: "${proj_v} - 1" }
              as: WarehouseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_PROJECT_VERSION"
            - "InventoryPull.${pull_id}.state == SUBMITTED"
            - "InventoryPull.${pull_id}.committed_at is null"

      - name: correct_project_version_on_pull_commit_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pull-commit-stale-project]", "endpoints.POST./staging/pulls/{pull_id}/commit", "entities.Project.fields.version"]
        distinguishing_aspect: "The matching expected_project_version commits the pull and INCREMENTS Project.version by exactly one, which is what makes any subsequent stale writer deterministically fail."
        test_recipe:
          setup: ["A VACANT project with a SUBMITTED, fully filled pull and the project's current version read."]
          setup_api_calls: *v_submitted_c
          trigger:
            - call: "POST /staging/pulls/${pull_id}/commit"
              payload: { expected_project_version: "${proj_v}" }
              as: WarehouseManager
            - call: "GET /staging/projects/${proj_id}"
              payload: {}
              as: WarehouseManager
              captures: { proj_v2: "$.data.version" }
          assert:
            - "InventoryPull.${pull_id}.state == COMMITTED"
            - "InventoryPull.${pull_id}.fill_rate == 1.0000"
            - "Project.${proj_id}.version == ${proj_v} + 1"

      - name: stale_pickup_version_on_damage_finalize_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[damage-finalize-stale-pickup]", "validations[priority=37]", "errors[ERR_STALE_PICKUP_VERSION]"]
        distinguishing_aspect: "The first finalize bumps Pickup.version, so a second finalize still carrying the pre-first value is refused with ERR_STALE_PICKUP_VERSION (412) and damage_total stays at the first charge alone."
        test_recipe:
          setup: ["The canonical VACANT project with its pickup IN_PROGRESS and two ASSESSED findings: the SOFA MISSING at 840.00 and the TABLE MINOR at 40.00."]
          setup_api_calls: *v_staged_c
          trigger:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/leases/${lease_id}/mark-term-complete"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-13T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /staging/pickups?project_id=${proj_id}"
              payload: {}
              as: StagingCoordinator
              captures: { pickup_id: "$.data[0].id" }
            - call: "POST /staging/pickups/${pickup_id}/start"
              payload: {}
              as: StagingCoordinator
            - call: "POST /staging/pickups/${pickup_id}/damage-assessments"
              payload: { pull_line_id: "${line_a}", condition_at_pickup: "MISSING", repair_cost_estimate: 0.00 }
              as: WarehouseManager
              captures: { as_1: "$.data.id" }
            - call: "POST /staging/pickups/${pickup_id}/damage-assessments"
              payload: { pull_line_id: "${line_c}", condition_at_pickup: "MINOR", repair_cost_estimate: 40.00 }
              as: WarehouseManager
              captures: { as_2: "$.data.id" }
            - call: "POST /staging/damage-assessments/${as_1}/assess"
              payload: {}
              as: WarehouseManager
            - call: "POST /staging/damage-assessments/${as_2}/assess"
              payload: {}
              as: WarehouseManager
            - call: "GET /staging/pickups/${pickup_id}"
              payload: {}
              as: WarehouseManager
              captures: { pick_v: "$.data.version" }
            - call: "POST /staging/damage-assessments/${as_1}/finalize"
              payload: { expected_pickup_version: "${pick_v}" }
              as: WarehouseManager
            - call: "POST /staging/damage-assessments/${as_2}/finalize"
              payload: { expected_pickup_version: "${pick_v}" }
              as: WarehouseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_PICKUP_VERSION"
            - "DamageAssessment.${as_1}.state == FINAL"
            - "DamageAssessment.${as_2}.state == ASSESSED"
