# ===========================================================================
# §1.9 Scaffold Corner Design — Newsroom Standards & Corrections (2805)
#
# Breadth probe over the surface declared in SCAFFOLD.yaml §1.1-§1.7. The nine
# `section:` values and every `claim_type:` are taken verbatim (snake_cased)
# from references/claim-extraction-guide.md; no categories are invented.
#
# Conventions shared by every recipe below:
#   * The logical clock reads 2026-08-01T00:00:00Z until
#     POST /standards-desk/_clock/set_current_utc moves it.
#   * The bootstrap chain is always: newsroom -> EXECUTIVE_EDITOR journalist
#     (`exec`) -> STANDARDS_EDITOR (`sed`) -> REPORTER (`rep`), created with
#     as_user_id "bootstrap-exec" for the two bootstrap-exempt calls and
#     "${exec}" afterwards.
#   * Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted
#     as `excluded_because:` stubs and carry no test_recipe.
# ===========================================================================

scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: newsroom_creation_returns_all_declared_fields_with_derived_zeroes
        claim_type: creation
        grounds:
          - entities.Newsroom
          - endpoints[POST /standards-desk/newsrooms]
          - calculations.newsroom_standards_posture
          - calculations.desk_training_compliance_index
        distinguishing_aspect: "A newsroom created with every input field supplied returns 201 with name, correction_response_sla_hours 48, high_severity_open_threshold 3, required_module_codes [SOURCING, CORRECTIONS], standards_posture OPEN, open_high_severity_count 0 and training_compliance_index 0.00."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Harbor Dispatch", correction_response_sla_hours: 48, high_severity_open_threshold: 3, required_module_codes: ["SOURCING", "CORRECTIONS"] }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.name == 'Harbor Dispatch'"
            - "response.data.correction_response_sla_hours == 48"
            - "response.data.high_severity_open_threshold == 3"
            - "response.data.required_module_codes == ['SOURCING', 'CORRECTIONS']"
            - "response.data.standards_posture == OPEN"
            - "response.data.open_high_severity_count == 0"
            - "response.data.training_compliance_index == 0.00"
            - "response.data.id is a non-empty string and response.data.version == 1"

      - name: story_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.Story
          - endpoints[GET /standards-desk/stories/{id}]
          - calculations.story_risk_index
        distinguishing_aspect: "GET on a freshly created story echoes the three declared claim counts and the derived risk_index_estimate 13.00, risk_tier STANDARD, risk_index_actual null, publication_status DRAFT and standards_status CLEAN."
        test_recipe:
          setup:
            - "One newsroom, one executive editor and one reporter exist"
            - "The reporter has created a story with defamation_claim_count 1, privacy_subject_count 2 and unverified_document_count 1"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Three unverified permits", defamation_claim_count: 1, privacy_subject_count: 2, unverified_document_count: 1 }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
          trigger:
            - call: "GET /standards-desk/stories/${st}"
              payload: {}
              as: Reporter
              as_user_id: "${rep}"
          assert:
            - "response.status == 200"
            - "response.data.id == ${st}"
            - "response.data.headline == 'Three unverified permits'"
            - "response.data.defamation_claim_count == 1"
            - "response.data.privacy_subject_count == 2"
            - "response.data.unverified_document_count == 1"
            - "response.data.risk_index_estimate == 13.00"
            - "response.data.risk_tier == STANDARD"
            - "response.data.risk_index_actual == null"
            - "response.data.publication_status == DRAFT"
            - "response.data.standards_status == CLEAN"

      - name: journalist_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /standards-desk/newsrooms/{id}/journalists]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three journalists in the newsroom, limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true, and limit 2 / offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One newsroom holds exactly three journalists: one executive editor, one standards editor and one reporter"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Sam Okoye", email: "sam@ledger.test", role_title: "STANDARDS_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { sed: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
          trigger:
            - call: "GET /standards-desk/newsrooms/${nr}/journalists"
              payload: { limit: 2, offset: 0 }
              as: ExecutiveEditor
              as_user_id: "${exec}"
          assert:
            - "response.status == 200"
            - "response.response_type == 'array'"
            - "len(response.data) == 2"
            - "response.total_count == 3"
            - "response.has_more == true"
            - "the same call with limit 2 and offset 2 returns len(response.data) == 1 and has_more == false"
            - "the same call with role_title REPORTER returns len(response.data) == 1 and total_count == 1"

      - name: story_get_with_unknown_id_returns_story_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_STORY_NOT_FOUND]
          - endpoints[GET /standards-desk/stories/{id}]
        distinguishing_aspect: "A GET against a syntactically valid but unknown story id returns 404 ERR_STORY_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "One newsroom and one executive editor exist; no story has ever been created"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
          trigger:
            - call: "GET /standards-desk/stories/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_STORY_NOT_FOUND"
            - "response.response_type == 'error'"

      - name: correction_request_without_claim_text_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.CorrectionRequest.claim_text
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required claim_text on correction intake returns 400 ERR_INVALID_REQUEST and persists no CorrectionRequest, leaving Story.open_correction_request_count at 0."
        test_recipe:
          setup:
            - "One newsroom, one executive editor, one reporter and one DRAFT story exist"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "A story readers will dispute" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
          trigger:
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "READER", submitter_email: "reader@example.test", claimed_error_category: "FACTUAL", reader_reported_reach: 500, subject_named: false }
              as: PublicEditor
              as_user_id: "public-editor-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "Story.${st}.open_correction_request_count == 0"

      - name: newsroom_defaults_applied_when_optional_configuration_omitted
        claim_type: defaults
        grounds:
          - entities.Newsroom.correction_response_sla_hours
          - entities.Newsroom.high_severity_open_threshold
          - entities.Newsroom.required_module_codes
          - endpoints[POST /standards-desk/newsrooms]
        distinguishing_aspect: "Creating a newsroom with only name supplied applies correction_response_sla_hours 72, high_severity_open_threshold 2 and required_module_codes ['SOURCING']."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Riverside Beacon" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.correction_response_sla_hours == 72"
            - "response.data.high_severity_open_threshold == 2"
            - "response.data.required_module_codes == ['SOURCING']"
            - "response.data.standards_posture == OPEN"

      - name: reviewer_available_minutes_computed_at_registration
        claim_type: computed_fields
        grounds:
          - entities.Reviewer.reserved_minutes
          - entities.Reviewer.available_minutes
          - calculations.reviewer_minute_ledger
          - endpoints[POST /standards-desk/reviewers]
        distinguishing_aspect: "A reviewer registered with weekly_capacity_minutes 240 comes back with reserved_minutes 0 and available_minutes 240 — the ledger is derived from capacity, never accepted from the request body."
        test_recipe:
          setup:
            - "One newsroom and one executive editor exist"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
          trigger:
            - call: "POST /standards-desk/reviewers"
              payload: { newsroom_id: "${nr}", full_name: "Kai Brandt", discipline: "STANDARDS", weekly_capacity_minutes: 240 }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rev: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.weekly_capacity_minutes == 240"
            - "response.data.reserved_minutes == 0"
            - "response.data.available_minutes == 240"
            - "response.data.discipline == STANDARDS"

      - name: story_system_fields_are_server_assigned_and_ignore_client_values
        claim_type: system_fields
        grounds:
          - entities.Story.publication_status
          - entities.Story.standards_status
          - entities.Story.published_at
          - endpoints[POST /standards-desk/stories]
        distinguishing_aspect: "Story creation always yields publication_status DRAFT, standards_status CLEAN, published_at null, unpublished_at null, editors_note_text null and version 1 — none of these appear in the endpoint's input, so no client value can set them."
        test_recipe:
          setup:
            - "One newsroom, one executive editor and one reporter exist"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "A brand new draft" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.publication_status == DRAFT"
            - "response.data.standards_status == CLEAN"
            - "response.data.published_at == null"
            - "response.data.unpublished_at == null"
            - "response.data.editors_note_text == null"
            - "response.data.version == 1"
            - "response.data.created_at and response.data.updated_at are server-generated ISO-8601 strings"

      - name: reviewer_capacity_below_declared_minimum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Reviewer.weekly_capacity_minutes
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "weekly_capacity_minutes 30 is below the declared floor of 60, so registration returns 400 ERR_INVALID_REQUEST and no Reviewer row is created; the same call with an out-of-range discipline value is rejected identically."
        test_recipe:
          setup:
            - "One newsroom and one executive editor exist and no reviewer has been registered"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
          trigger:
            - call: "POST /standards-desk/reviewers"
              payload: { newsroom_id: "${nr}", full_name: "Kai Brandt", discipline: "LEGAL", weekly_capacity_minutes: 30 }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /standards-desk/newsrooms/${nr}/reviewers returns total_count == 0"
            - "the same call with discipline 'EDITORIAL' also returns 400 ERR_INVALID_REQUEST"

      - name: training_record_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.TrainingRecord
          - endpoints[POST /standards-desk/training-records]
          - endpoints[GET /standards-desk/journalists/{id}/training-records]
        distinguishing_aspect: "TrainingRecord is declared common_fields: false, so the created row exposes id, journalist_id, module_code, case_study_reference and completed_at but no version and no updated_at, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "One newsroom, one executive editor and one reporter exist"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /standards-desk/training-records"
              payload: { journalist_id: "${rep}", module_code: "CORRECTIONS", case_study_reference: "CS-2026-014" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { trn: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.module_code == CORRECTIONS"
            - "response.data.case_study_reference == 'CS-2026-014'"
            - "response.data.completed_at == '2026-08-01T00:00:00Z'"
            - "response.data contains no 'version' key and no 'updated_at' key"
            - "GET /standards-desk/journalists/${rep}/training-records returns exactly one row whose id == ${trn}"

      - name: story_with_unknown_newsroom_id_returns_newsroom_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Story.newsroom_id
          - validations[priority=7]
          - errors[ERR_NEWSROOM_NOT_FOUND]
        distinguishing_aspect: "Under the flat topology the newsroom_id in the body is a validated foreign key: an unknown value returns 404 ERR_NEWSROOM_NOT_FOUND before any risk computation, and the reporter's own newsroom is never substituted."
        test_recipe:
          setup:
            - "One newsroom, one executive editor and one reporter exist"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "00000000-0000-4000-8000-0000000000ff", lead_journalist_id: "${rep}", headline: "Story against a phantom newsroom" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NEWSROOM_NOT_FOUND"
            - "GET /standards-desk/stories with newsroom_id ${nr} returns total_count == 0"

  # =========================================================================
  - section: state_machines
    instances:
      - name: anonymous_source_starts_in_requested_with_documentation_complete_derived
        claim_type: initial_state
        grounds:
          - state_machines.AnonymousSourceApproval.initial_state
          - entities.AnonymousSourceApproval.documentation_complete
          - endpoints[POST /standards-desk/anonymous-source-approvals]
        distinguishing_aspect: "A newly filed source request is created in status REQUESTED with decided_by_user_id null, decided_at null and documentation_complete true because identity_known_to_editor is true and the justification exceeds 20 characters."
        test_recipe:
          setup:
            - "One newsroom, one executive editor, one reporter and one DRAFT story exist"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Inside the permit office" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
          trigger:
            - call: "POST /standards-desk/anonymous-source-approvals"
              payload: { story_id: "${st}", source_alias: "permit-clerk", source_category: "GOVERNMENT", harm_risk: "ELEVATED", identity_known_to_editor: true, corroboration_count: 1, justification_text: "Only person with direct access to the permit ledger." }
              as: Reporter
              as_user_id: "${rep}"
              captures: { src: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.status == REQUESTED"
            - "response.data.documentation_complete == true"
            - "response.data.decided_by_user_id == null"
            - "response.data.decided_at == null"
            - "Story.${st}.approved_anonymous_source_count == 0"
            - "Story.${st}.risk_index_estimate == 0.00"

      - name: disclosure_review_from_acknowledged_terminal_state_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ConflictDisclosure.terminal_states
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACKNOWLEDGED is a declared terminal state of ConflictDisclosure, so a second review call returns 409 ERR_INVALID_STATE and neither status nor restricted_beats changes."
        test_recipe:
          setup:
            - "One newsroom, one executive editor, one standards editor and one reporter exist"
            - "The reporter has filed a FINANCIAL disclosure that the standards editor has already ACKNOWLEDGED"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
