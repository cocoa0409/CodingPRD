  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_allocation_apply_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-apply-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Allocation apply with expected_plan_year_version one behind the observed version is rejected 412; the same call with the observed version succeeds and bumps the plan version."
        test_recipe:
          setup: ["Plan OPEN (version captured); ACTIVE leaf T; DRAFT allocation AL pool 100000"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${t}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { al: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv} - 1" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
          assert:
            - "Stale apply: ${err} == ERR_STALE_VERSION (HTTP 412); allocation remains DRAFT"
            - "Correct-version apply: TopDownAllocation.${al}.status == APPLIED and PlanYear.${plan}.version == ${pv} + 1"

      - name: occ_reconciliation_apply_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reconciliation-apply-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Reconciliation apply carries the same OCC guard on the plan version: stale 412, current version applies."
        test_recipe:
          setup: ["Plan SUBMISSIONS_CLOSED (leaf T); COMPUTED run RN; version captured"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv} - 1" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
          assert:
            - "Stale apply: ${err} == ERR_STALE_VERSION (HTTP 412); run remains COMPUTED, plan remains SUBMISSIONS_CLOSED"
            - "Correct-version apply: ReconciliationRun.${run}.status == APPLIED and plan becomes RECONCILED"

      - name: occ_change_approve_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-approve-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Change-request approval carries the plan-version OCC guard: stale 412, current version approves."
        test_recipe:
          setup: ["Plan COMMUNICATED; TF owns account A; TT ACTIVE; CR PENDING; version captured"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TF", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { tf: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TT", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { tt: $.data.id } }
            - { call: "POST /sales-planning/territories/${tf}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/territories/${tt}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${tf}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "SMB", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/change-requests", payload: { plan_year_id: "${plan}", account_id: "${acc}", from_territory_id: "${tf}", to_territory_id: "${tt}", effective_date: "2027-07-01" }, as: SalesOpsAnalyst, as_user_id: "analyst-1", captures: { cr: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/change-requests/${cr}/approve", payload: { expected_plan_year_version: "${pv2} - 1" }, as: RevOpsManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /sales-planning/change-requests/${cr}/approve", payload: { expected_plan_year_version: "${pv2}" }, as: RevOpsManager, as_user_id: "mgr-1" }
          assert:
            - "Stale approve: ${err} == ERR_STALE_VERSION (HTTP 412); request remains PENDING"
            - "Correct-version approve: TerritoryChangeRequest.${cr}.status == APPROVED, decided_by_user_id == 'mgr-1'"

      - name: plan_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.PlanYear", "state_machines.PlanYear.DRAFT_to_OPEN"]
        distinguishing_aspect: "common_fields versioning is observable: create yields version 1 and the open transition increments it to 2 with refreshed updated_at."
        test_recipe:
          setup: ["Plan created (version 1); territory T ACTIVE"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id, v0: $.data.version } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin, captures: { v1: $.data.version } }
          assert:
            - "${v0} == 1 and ${v1} == 2 (open incremented the plan version exactly once)"
            - "PlanYear.${plan}.updated_at changed between the two reads"

      - name: selector_named_rule_overrides_geo
        claim_type: selector_policy
        grounds: ["calculations.assignment_resolution"]
        distinguishing_aspect: "An ACTIVE NAMED_ACCOUNT rule beats every matching GEO_SEGMENT rule regardless of specificity or priority: after evaluate, the account lands on the named rule's territory with source NAMED_RULE."
        test_recipe:
          setup: ["Plan DRAFT; ACTIVE territories TN and TG; account A (US) created before any rule (UNASSIGNED); GEO rule {US} -> TG and NAMED rule (A) -> TN both created afterwards"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TN", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { tn: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "TG", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { tg: $.data.id } }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "ENTERPRISE", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 1, territory_id: "${tg}", country_code: "US", segment: "ENTERPRISE" }, as: SalesOpsAdmin, captures: { rg: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "NAMED_ACCOUNT", priority: 99, territory_id: "${tn}", named_account_id: "${acc}" }, as: SalesOpsAdmin, captures: { rn: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/plan-years/${plan}/evaluate-assignments", as: SalesOpsAdmin }
          assert:
            - "Account.${acc}.assigned_territory_id == ${tn}, assignment_source == NAMED_RULE, assignment_rule_id == ${rn}"
            - "The GEO rule ${rg} (higher specificity, lower priority value) loses to the named pin"

      - name: selector_specificity_then_priority_then_created_at
        claim_type: selector_policy
        grounds: ["calculations.assignment_resolution"]
        distinguishing_aspect: "GEO ranking is specificity DESC, then priority ASC, then created_at ASC: R2 {US,ENTERPRISE} prio 20 beats R1 {US} prio 5 (specificity first) and beats R3 {US,ENTERPRISE} prio 20 created later (created_at tie-break)."
        test_recipe:
          setup: ["Plan DRAFT; ACTIVE territories T1, T2, T3; rules R1 {US} prio 5 -> T1, R2 {US,ENTERPRISE} prio 20 -> T2, R3 {US,ENTERPRISE} prio 20 -> T3, created in that order"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T1", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t1: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T2", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T3", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t3: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 5, territory_id: "${t1}", country_code: "US" }, as: SalesOpsAdmin, captures: { r1: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 20, territory_id: "${t2}", country_code: "US", segment: "ENTERPRISE" }, as: SalesOpsAdmin, captures: { r2: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 20, territory_id: "${t3}", country_code: "US", segment: "ENTERPRISE" }, as: SalesOpsAdmin, captures: { r3: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "ENTERPRISE", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
          assert:
            - "Account.${acc}.assigned_territory_id == ${t2} and assignment_rule_id == ${r2}"
            - "R1 loses despite the lowest priority value (specificity dominates); R3 loses the tie on created_at"

      - name: derived_field_attainment_recompute_on_reverse
        claim_type: derived_field_reconciliation
        grounds: ["calculations.attainment_rollup", "state_machines.CreditEvent.POSTED_to_REVERSED"]
        distinguishing_aspect: "RepAssignment.attainment_cents is a live rollup: posting a 5000 booking moves it 0 -> 5000 (attainment_pct 5.00 against final 99996) and reversing the booking returns it to 0 with pct 0.00."
        test_recipe:
          setup: ["Plan COMMUNICATED; leaf T final 100000 with rep R (hired 2025-01-05, fully ramped: final 99996); account A on T; clock 2027-06-05"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${t}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { al: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv1: $.data.version } }
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv1}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin, captures: { asg: $.data.id } }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${t}", country_code: "US" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "SMB", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
            - { call: "POST /sales-planning/plan-years/${plan}/close-submissions", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reconciliation-runs", payload: { plan_year_id: "${plan}" }, as: SalesOpsAdmin, captures: { run: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv2: $.data.version } }
            - { call: "POST /sales-planning/reconciliation-runs/${run}/apply", payload: { expected_plan_year_version: "${pv2}" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/communicate", as: SalesOpsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-05T00:00:00Z" }, as: SalesOpsAdmin }
          trigger:
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 5000, booking_date: "2027-06-05" }, as: SalesOpsAdmin, captures: { evt: "$.data[0].id" } }
            - { call: "POST /sales-planning/credit-events/${evt}/reverse", as: SalesOpsAdmin }
          assert:
            - "After posting: RepAssignment.${asg}.attainment_cents == 5000 and attainment_pct == 5.00 (5000*100/99996 rounded half-up to 2dp)"
            - "After reversing: attainment_cents == 0 and attainment_pct == 0.00; CreditEvent.${evt}.status == REVERSED"

      - name: change_apply_cascade_coverage
        claim_type: cascading_side_effects
        grounds: ["state_machines.TerritoryChangeRequest.APPROVED_to_APPLIED"]
        excluded_because:
          difficulty_instance: change_apply_four_hop_cascade
          rationale: "The four-hop apply cascade is asserted hop-by-hop in the named §1.8 instance."

      - name: assignment_end_cascade_coverage
        claim_type: cascading_side_effects
        grounds: ["state_machines.RepAssignment.ACTIVE_to_ENDED"]
        excluded_because:
          difficulty_instance: assignment_end_share_recompute_cascade
          rationale: "The end-triggered share/ramp recompute is asserted in the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the quota written by an allocation apply is readable on the very next GET, and a created submission reads back SUBMITTED with submitted_by_rep_id from the header."
        test_recipe:
          setup: ["Plan OPEN; ACTIVE leaf T; rep R assigned to T"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/open", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/reps", payload: { full_name: "R", email: "r@x.com", hire_date: "2025-01-05" }, as: SalesOpsAdmin, captures: { rep: $.data.id } }
            - { call: "POST /sales-planning/rep-assignments", payload: { plan_year_id: "${plan}", rep_id: "${rep}", territory_id: "${t}", effective_from: "2027-01-01" }, as: SalesOpsAdmin }
            - { call: "POST /sales-planning/allocations", payload: { plan_year_id: "${plan}", scope_territory_id: "${t}", pool_cents: 100000 }, as: SalesOpsAdmin, captures: { al: $.data.id } }
            - { call: "GET /sales-planning/plan-years/${plan}", as: SalesOpsAdmin, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /sales-planning/allocations/${al}/apply", payload: { expected_plan_year_version: "${pv}" }, as: SalesOpsAdmin }
            - { call: "GET /sales-planning/territories/${t}", as: SalesOpsAdmin, captures: { tq: $.data.assigned_quota_cents } }
            - { call: "POST /sales-planning/submissions", payload: { plan_year_id: "${plan}", territory_id: "${t}", proposed_quota_cents: 90000 }, as: SalesRep, as_user_id: "${rep}", captures: { sub: $.data.id } }
            - { call: "GET /sales-planning/submissions/${sub}", as: SalesOpsAdmin }
          assert:
            - "${tq} == 100000 on the immediately following GET (no reconciliation lag)"
            - "GET submission: status == SUBMITTED and submitted_by_rep_id == ${rep}"
