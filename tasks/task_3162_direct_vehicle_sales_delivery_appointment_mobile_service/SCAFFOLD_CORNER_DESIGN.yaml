        distinguishing_aspect: "A state that bars direct sales but permits a lawful sale executed elsewhere makes an in-state handover invalid: arrival at an in-state center fails 403 with ERR_OUT_OF_STATE_DELIVERY_REQUIRED while arrival at a neighboring-state center succeeds."
        test_recipe:
          setup:
