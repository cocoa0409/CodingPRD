          setup:
            - "one restaurant with prep_lead_minutes 45, one package with kitchen_prep_minutes_per_cover 12"
            - "one PUBLISHED Saturday HIGH service seating at 2026-09-12T22:00:00Z with kitchen_prep_capacity_minutes 600, one table seating 2 to 4"
            - "one guest with a CONFIRMED party-of-2 reservation (deposit 11583 paid)"
