  - section: cross_cutting_complexity_layers
    instances:
      - name: version_tokens_are_monotonic_so_a_formerly_valid_token_is_rejected_on_every_occ_surface
        claim_type: optimistic_concurrency
        grounds:
          - cross_cutting_complexity_layers[optimistic_concurrency]
          - concurrency_rules[change-request-approve-stale-item]
          - concurrency_rules[transparency-build-stale-facility]
          - endpoints[POST /chargemaster/change-requests/{request_id}/decisions]
          - endpoints[PATCH /chargemaster/facilities/{facility_id}]
          - endpoints[POST /chargemaster/transparency-files]
          - errors[ERR_STALE_ITEM_VERSION]
          - errors[ERR_STALE_FACILITY_VERSION]
          - validations[priority=16]
          - validations[priority=17]
        distinguishing_aspect: "Replay rather than guesswork: every rejected token below was the LIVE, correct token one call earlier, so the failure isolates monotonicity from mere mismatch. It also proves the two declared concurrency rules use different occ_field targets (item version on the decision, facility version on the build and the patch), that a successful approval bumps the item version itself (5 -> 6) so the approver's own token is immediately stale, and that a rejected 412 leaves the version untouched — the same token that just failed still fails, it does not become valid by having been tried."
        test_recipe:
          setup:
            - "Clock 2026-09-01; facility CCN-0001 (NEAREST_CENT); revenue code 0300; department CC-100 (mgr_cath); COST_PLUS_MARKUP rule; item CDM-1001 ACTIVE/PRICED_CURRENT at gross 240000 and version 5."
            - "Two SUBMITTED PRICE_CHANGE requests from mgr_cath: cr1 (150000) and cr2 (200000), each REVIEWED by ria_2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
