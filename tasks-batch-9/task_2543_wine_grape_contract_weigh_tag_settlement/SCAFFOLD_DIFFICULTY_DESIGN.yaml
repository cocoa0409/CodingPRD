              payload: {}
              as: GrowerRelationsManager
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-NOALLOC", contract_basis: "TONNAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "REJECT", term_start_vintage: 2026, term_end_vintage: 2028, committed_tons: 10.000, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { noalloc_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts/${noalloc_id}/offer"
              payload: {}
