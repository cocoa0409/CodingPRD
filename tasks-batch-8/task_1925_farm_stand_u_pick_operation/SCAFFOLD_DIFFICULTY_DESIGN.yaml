            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "South", rotation_group: "RG1", rotation_order: 2, estimated_harvest_oz: 500 }, as: FarmManager, captures: { fb_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day1: $.data.id } }
