          setup:
            - "Canonical TX chain to ACQUIRED (released 2026-09-05); portfolio PRO; LE valid through 2027-01-16"
            - "Snapshot S1 [2026-09-01, 2026-12-01) created at clock 2026-12-01 and FINALIZED"
