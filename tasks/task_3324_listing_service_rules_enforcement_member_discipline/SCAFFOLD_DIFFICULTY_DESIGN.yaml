              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R1", effective_at: "2026-09-01T00:00:00Z", comp_display_mode: "COMP_DISPLAY_ON", expected_association_version: "${assoc_v0}" }
              as: AssociationStaff
              captures: { assoc_v_after_r1: $.data.version }
            - call: "POST /mls/_clock/advance_day"
              payload: { days: 1 }
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings"
              payload: { listing_member_id: "${mb_id}", mls_number: "MLS-C1", property_address: "7 Circle Ct", list_price_cents: 30000000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices/${office_id}/listings/${listing_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
            - call: "POST /mls/associations/${assoc_id}/data-licenses"
              payload: { licensee_name: "PortalX", scope: "IDX", display_ruleset_version: 1, listing_field_allowlist: ["property_address"] }
              as: AssociationStaff
              captures: { license_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/data-licenses/${license_id}/activate"
              payload: {}
              as: AssociationStaff
            - call: "POST /mls/associations/${assoc_id}/policy-revisions"
              payload: { revision_code: "R2", effective_at: "2026-09-10T00:00:00Z", comp_display_mode: "COMP_DISPLAY_OFF", expected_association_version: "${assoc_v_after_r1}" }
