      - name: the_transient_pool_refuses_the_public_outright_while_the_member_pool_waitlists
        claim_type: error_triggerable
        grounds:
          - validations[priority=46]
          - errors[ERR_NO_TRANSIENT_CAPACITY]
          - calculations.park_capacity_allocation
          - endpoints["POST /transient-reservations"]
        distinguishing_aspect: "A two-site park splits 1 member / 1 transient, and the same night of exhaustion produces two different outcomes by booker type: the second member booking becomes WAITLISTED while the second transient booking is refused 409, because the public is never waitlisted and TRANSIENT_FLOOR_SITES 1 leaves nothing for the member pool to borrow. The third transient arrives on the first guest's departure day and succeeds, proving the refusal was a true night overlap and not a park-level lockout."
        test_recipe:
          setup:
            - "One CLASS_C park with total_sites 2 and member_allocation_pct 50, opened for a season that spans every probe date: member pool floor(2 x 50 / 100) = 1 site, transient pool 2 - 1 = 1 site"
