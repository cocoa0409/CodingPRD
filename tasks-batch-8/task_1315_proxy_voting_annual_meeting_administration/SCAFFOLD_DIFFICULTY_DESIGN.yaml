              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (business_safety priority 5 beats business_constraint priority 8, not ERR_UNRESOLVED_CHALLENGES)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exactly_at_threshold_is_met
        grounds:
          - calculations.quorum_calculation
          - endpoints[GET /proxy/meetings/{id}/quorum]
        distinguishing_aspect: |
          Metric: basis-point share ratio at the GET quorum endpoint. shares_present exactly
          equal to threshold (5000/10000 = 5000bp >= 5000bp) must satisfy quorum — the
          comparison is >=, not > — and conclude must succeed at the exact boundary.
        test_recipe:
          setup:
            - "ANNUAL meeting, outstanding_shares 10000, quorum_threshold_pct 0.5"
            - "a1 5000 COMMON voted FOR; meeting convened"
          setup_api_calls:
