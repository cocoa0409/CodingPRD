  - rule_id: boundary_precision_check
    instances:
      - name: primary_purpose_tests_opposite_boundary_directions
        grounds:
          - calculations.primary_purpose_tests
          - entities.PrimaryPurposeException.fields.test_outcome
          - entities.PrimaryPurposeException.fields.business_line_deposit_ratio_bps
          - validations[priority=42]
        distinguishing_aspect: |
          Metric 1 - the two primary-purpose ratios on POST /primary-purpose-exceptions,
          where the boundary directions are deliberately opposite: 2499 bps QUALIFIES and
          exactly 2500 bps FAILS the strictly-below 25% test, while exactly 7500 bps
          QUALIFIES and 7497 bps fails the at-or-above enabling-transactions test.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Institution and one Broker; no agreement or program is needed because the tests read the exception row alone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Boundary Bank NA", cert_id: "CERT-2834-13", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Boundary Sweep Advisors LLC", broker_type: "LISTING_SERVICE", has_placement_discretion: false, fee_structure: "PER_ACCOUNT_FEE", fee_flat_cents: 1000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
          trigger:
            - call: "POST /primary-purpose-exceptions"
              payload: { broker_id: "${brk_id}", institution_id: "${inst_id}", exception_basis: "TWENTY_FIVE_PERCENT_TEST", designated_business_line: "advisory cash sweep just under", total_customer_assets_cents: 40000000000, deposits_placed_at_ifs_cents: 9999999999 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { exc_below_id: $.data.id }
            - call: "POST /primary-purpose-exceptions"
              payload: { broker_id: "${brk_id}", institution_id: "${inst_id}", exception_basis: "TWENTY_FIVE_PERCENT_TEST", designated_business_line: "advisory cash sweep exactly at", total_customer_assets_cents: 40000000000, deposits_placed_at_ifs_cents: 10000000000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { exc_at_id: $.data.id }
            - call: "POST /primary-purpose-exceptions"
              payload: { broker_id: "${brk_id}", institution_id: "${inst_id}", exception_basis: "ENABLING_TRANSACTIONS_TEST", designated_business_line: "payment enabling exactly at", total_customer_assets_cents: 40000000000, deposits_placed_at_ifs_cents: 1000000000, enabling_transaction_count: 3, total_transaction_count: 4 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { exc_txn_at_id: $.data.id }
            - call: "POST /primary-purpose-exceptions"
              payload: { broker_id: "${brk_id}", institution_id: "${inst_id}", exception_basis: "ENABLING_TRANSACTIONS_TEST", designated_business_line: "payment enabling just under", total_customer_assets_cents: 40000000000, deposits_placed_at_ifs_cents: 1000000000, enabling_transaction_count: 2999, total_transaction_count: 4000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { exc_txn_below_id: $.data.id }
          assert:
            - "PrimaryPurposeException.${exc_below_id}.business_line_deposit_ratio_bps == 2499 and test_outcome == QUALIFIED"
            - "PrimaryPurposeException.${exc_at_id}.business_line_deposit_ratio_bps == 2500 and test_outcome == NOT_QUALIFIED"
            - "PrimaryPurposeException.${exc_txn_at_id}.enabling_transaction_ratio_bps == 7500 and test_outcome == QUALIFIED"
            - "PrimaryPurposeException.${exc_txn_below_id}.enabling_transaction_ratio_bps == 7497 and test_outcome == NOT_QUALIFIED"
            - "all four rows have filing_type == NOTICE and status == DRAFT and reporting_due_date == \"2026-10-30\""
            - "PrimaryPurposeException.${exc_txn_at_id}.business_line_deposit_ratio_bps == 250 — the unused ratio is still computed, not null"

      - name: maturity_window_aggregate_cap_inclusive_boundary
        grounds:
          - calculations.maturity_window_exposure
          - validations[priority=48]
          - entities.DepositPlacement.fields.maturity_date
        distinguishing_aspect: |
          Metric 2, reached through a different endpoint (POST /deposit-placements): the
          ladder aggregate is an inclusive lower-bound rejection in whole cents, so a
          candidate of 7,500,000,000 next to a 10,000,000,000 neighbour hits the
          17,500,000,000 cap exactly and is refused, while 7,499,999,999 is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Institution WELL_CAPITALIZED with core_deposits_cents 40,000,000,000."
            - "OPEN_FOR_PLACEMENT brokered program holding one ACTIVE placement of 10,000,000,000 cents maturing 2026-09-30, so total_deposits_cents is 50,000,000,000 and the ladder cap is 17,500,000,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Inclusive Cap Bank NA", cert_id: "CERT-2834-14", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Inclusive Cap Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 25000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-14", fee_structure: "FLAT_FEE", fee_flat_cents: 25000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Inclusive Cap CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 10000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_neighbour_id: $.data.id }
            - call: "POST /deposit-placements/${pl_neighbour_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          trigger:
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 7500000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 7499999999, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 60 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_ok_id: $.data.id }
          assert:
            - "DepositPlacement.${pl_neighbour_id}.maturity_date == \"2026-09-30\" and tenor_bucket == DAYS_31_90"
            - "the 7,500,000,000 request returns HTTP 422 with error_id == ERR_MATURITY_WINDOW_CONCENTRATION (exposure 17,500,000,000 == cap 17,500,000,000)"
            - "the 7,499,999,999 request returns HTTP 201 (exposure 17,499,999,999 < cap 17,500,000,000)"
            - "DepositPlacement.${pl_ok_id}.principal_cents == 7499999999 and funding_status == PENDING and maturity_date == \"2026-09-30\""
            - "Institution.${inst_id}.brokered_deposits_cents == 10000000000 — a PENDING placement adds nothing to the bucket"

      - name: average_daily_ratio_empty_set_and_zero_denominator
        grounds:
          - calculations.wholesale_funding_ratio
          - calculations.single_broker_concentration
          - calculations.concentration_headroom
          - entities.Institution.fields.total_deposits_cents
        distinguishing_aspect: |
          Metric 3, reached through a third endpoint
          (GET /institutions/{id}/wholesale-funding-summary): the empty-set and
          zero-denominator edge. With no placements and core_deposits_cents 0 every ratio
          is 0 rather than an error, brokered_headroom_cents is the -1 unbounded sentinel
          because no limit exists, and a single-day AVERAGE_DAILY period returns
          day_count == 1 because both endpoints are inclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One freshly registered Institution with core_deposits_cents 0, total_liabilities_cents 0, tier1_capital_cents 0, liquidity_buffer_cents 0."
            - "No DepositProgram, no DepositPlacement and no ConcentrationLimit rows exist for it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "De Novo Bank NA", cert_id: "CERT-2834-15", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 0, total_liabilities_cents: 0, tier1_capital_cents: 0, liquidity_buffer_cents: 0 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "GET /institutions/${inst_id}/wholesale-funding-summary"
              as: TreasuryController
              as_user_id: "op_alm"
            - call: "GET /institutions/${inst_id}/wholesale-funding-summary"
              payload: { basis: "AVERAGE_DAILY", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: TreasuryController
              as_user_id: "op_alm"
          assert:
            - "the POINT_IN_TIME response has total_deposits_cents == 0 and wholesale_funding_ratio_bps == 0 (no divide-by-zero, no error)"
            - "the POINT_IN_TIME response has brokered_deposits_cents == 0 and listing_service_deposits_cents == 0 and reciprocal_deposits_cents == 0"
            - "the POINT_IN_TIME response has single_broker_max_ratio_bps == 0"
            - "both responses have brokered_headroom_cents == -1, the unbounded sentinel for no ACTIVE BROKERED_TO_TOTAL_DEPOSITS limit"
            - "both responses have concentration_posture == OPEN and breached_metric_count == 0"
            - "the AVERAGE_DAILY response has day_count == 1 for period_start == period_end == \"2026-08-01\""
            - "the AVERAGE_DAILY response has avg_wholesale_cents == 0 and average_daily_ratio_bps == 0"
            - "Institution.${inst_id}.rate_cap_regime == EXEMPT and Institution.${inst_id}.total_deposits_cents == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: program_creation_gated_on_broker_agreement_status
        grounds:
          - validations[priority=27]
          - state_machines.BrokerAgreement
          - entities.Broker.fields.diligence_status
        distinguishing_aspect: |
          Entity pair 1 - DepositProgram depends on BrokerAgreement/Broker: the very
          creation of the child is refused while the counterparty paperwork is DRAFT or
          UNDER_DILIGENCE, and the same request succeeds unchanged once the agreement
          reaches APPROVED. Nothing about the program payload changes between the two
          attempts; only the other entity's state does.
