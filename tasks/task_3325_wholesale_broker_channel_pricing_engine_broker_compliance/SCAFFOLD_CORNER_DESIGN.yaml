              as: ChannelManager
              captures: { rs921: $.data.id, rs921_v: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs921}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 30000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs921_v}" }
