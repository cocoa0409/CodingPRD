        distinguishing_aspect: "A request that violates both the role rule (priority 2) and the payload rule (priority 5) returns ERR_UNAUTHORIZED (403), never ERR_INVALID_REQUEST (422): the ladder is walked in priority order and the body is not parsed for validity first."
        test_recipe:
