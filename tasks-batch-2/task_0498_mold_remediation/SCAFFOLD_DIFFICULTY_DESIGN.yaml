      # ---- Instance 2: state INVALID_STATE (priority 10) vs business_safety ZONE_NOT_ACTIVE (priority 13)
      - name: invalid_state_outranks_zone_not_active_on_complete
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - state_machines.AbatementOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Completing a PLANNED (never-started) order whose zone is also non-ACTIVE fails
