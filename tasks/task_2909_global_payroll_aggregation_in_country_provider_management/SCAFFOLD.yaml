  - rule_id: transition-complete-live-cycles
    scope: "POST /payroll/engagements/{id}/transition-decision"
    category: state
    priority: 30
    condition: "decision == COMPLETE while a PayrollCycle of the engagement has status in {INPUTS_LOCKED, RESULTS_APPROVED, FUNDED}"
    error_id: ERR_CYCLE_INVALID_STATE
    status_code: 409

  - rule_id: bank-account-currency-match
