# Scaffold Difficulty Design (Test Targeting Index) for task_2904
# Collision Repair Estimating & Parts Procurement
#
# Every instance grounds in SCAFFOLD.yaml sections 1.1-1.7 only. Deleting this file leaves the
# declared behaviour identical; it only makes coverage harder to audit.
# All money literals are integer cents and were computed by executing the pinned formulas.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: refinish_allocation_provisional_versus_final_on_identical_lines
        grounds:
          - calculations.refinish_labor_allocation
          - entities.RepairOrder.fields.refinish_hours_provisional
          - entities.RepairOrder.fields.refinish_hours_final
          - entities.EstimateLine.fields.allocated_hours
          - state_machines.RepairOrder.TEARDOWN_to_BLUEPRINTED
          - state_machines.RepairOrder.BLUEPRINTED_to_ESTIMATE_LOCKED
        distinguishing_aspect: |
          The PROVISIONAL and FINAL variants read the same three refinish EstimateLine rows and return
          6.6 h versus 5.7 h, because FINAL alone ranks the lines, adds the clearcoat 0.3 h to the major
          panel, deducts the 0.4 h overlap from the adjacent panel and halves the blend panel.
        test_recipe:
          setup:
            - "One customer, one insurer whose rate_ceiling_cents is BODY 6000 / FRAME 8000 / REFINISH 5800 / MECHANICAL 11000 / ALUMINUM_BODY 8800."
            - "One repair order for a 2019 vehicle, deductible 25000, initial authorisation 400000, at stage TEARDOWN with one damage finding."
            - "Five DRAFT estimate lines: REFINISH 2.8 two_stage, REFINISH 2.2 adjacent, REFINISH 1.6 blend, BODY 4.5, FRAME 3.0."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", phone: "555-0100", email: "dana@example.com", preferred_alternate_parts_ok: false }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "NRTH-1", name: "Northline Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 }, aftermarket_allowed: true, recycled_allowed: true, reconditioned_allowed: false, alternate_parts_min_vehicle_age_years: 3, parts_price_ceiling_pct: 1.1, supplement_round_limit: 2 }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77014", vehicle_vin: "1HGCV1F30LA000111", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-FENDER", severity: "MODERATE", requires_blend: true, adas_component_touched: false, structural: false }
              as: Estimator
              as_user_id: "est-001"
              captures: { dl1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "REF-A", labor_type: "REFINISH", guide_hours: 2.8, two_stage: true, is_adjacent_panel: false, is_blend: false, not_included_operation: false, pay_type: "INSURER" }
              as: Estimator
              as_user_id: "est-001"
              captures: { el1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "REF-B", labor_type: "REFINISH", guide_hours: 2.2, two_stage: false, is_adjacent_panel: true, is_blend: false, not_included_operation: false, pay_type: "INSURER" }
              as: Estimator
              as_user_id: "est-001"
              captures: { el2_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "REF-C", labor_type: "REFINISH", guide_hours: 1.6, two_stage: false, is_adjacent_panel: false, is_blend: true, not_included_operation: false, pay_type: "INSURER" }
              as: Estimator
              as_user_id: "est-001"
              captures: { el3_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5, not_included_operation: false, pay_type: "INSURER" }
              as: Estimator
              as_user_id: "est-001"
              captures: { el4_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "FRM-1", labor_type: "FRAME", guide_hours: 3.0, not_included_operation: false, pay_type: "INSURER" }
              as: Estimator
              as_user_id: "est-001"
              captures: { el5_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
          assert:
            - "RepairOrder.${ro_id}.refinish_hours_provisional == 6.6"
            - "RepairOrder.${ro_id}.refinish_hours_final == 5.7"
            - "EstimateLine.${el1_id}.allocated_hours == 3.1"
            - "EstimateLine.${el2_id}.allocated_hours == 1.8"
            - "EstimateLine.${el3_id}.allocated_hours == 0.8"
            - "EstimateLine.${el4_id}.allocated_hours == 4.5"
            - "RepairOrder.${ro_id}.approved_labor_hours == 13.2"
            - "RepairOrder.${ro_id}.labor_subtotal_cents == 84060"

      - name: vendor_fulfillment_score_rolling_window_versus_lifetime
        grounds:
          - calculations.vendor_fulfillment_score
          - entities.PartsVendor.fields.fulfillment_score_rolling
          - entities.PartsVendor.fields.fulfillment_score_lifetime
          - entities.PartsLine.fields.vendor_order_seq
          - entities.PartsLine.fields.on_time
        distinguishing_aspect: |
          Dual-variant logic on a second entity domain - supplier risk on PartsVendor, not labor time on
          RepairOrder: four closed lines where only vendor_order_seq 1 arrived on time give
          fulfillment_score_lifetime 55 and fulfillment_score_rolling 40, because the rolling window
          keeps only the three most recent lines by vendor_order_seq DESC.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; one customer, one insurer, one repair order locked with a single BODY 4.5 h line."
            - "One vendor, discount_pct 0, max_qty_per_line 4, part_types_offered [OEM]."
            - "Four OEM parts lines of 10000 cents each, all PRICE_LOCKED then ORDERED in order, so vendor_order_seq is 1,2,3,4."
            - "Line 1 promised 2026-08-10, lines 2-4 promised 2026-08-05; the clock is then moved to 2026-08-08 and all four are received CORRECT, so only line 1 is on_time."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ivy Chen", phone: "555-0111", email: "ivy@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "NRTH-2", name: "Northline Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /parts-vendors"
              payload: { name: "Metro OEM Parts", vendor_type: "OEM_DEALER", part_types_offered: ["OEM"], status: "ACTIVE", discount_pct: 0, core_charge_cents: 0, restocking_fee_pct: 0.2, max_qty_per_line: 4 }
              as: PartsManager
              captures: { v_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77020", vehicle_vin: "1HGCV1F30LA000112", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "RT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-001"
              captures: { dl1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-001"
              captures: { el_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /estimate-lines/${el_id}/parts-lines"
              payload: { part_number: "P-0001", part_description: "Door shell", part_type: "OEM", list_price_cents: 10000, qty: 1 }
              as: PartsManager
              captures: { pl1_id: $.data.id }
            - call: "POST /parts-lines/${pl1_id}/quote"
              payload: { vendor_id: "${v_id}", quoted_unit_price_cents: 10000 }
              as: PartsManager
            - call: "POST /parts-lines/${pl1_id}/accept-price"
              payload: {}
              as: PartsManager
            - call: "POST /parts-lines/${pl1_id}/order"
              payload: { promised_eta: "2026-08-10T00:00:00Z" }
              as: PartsManager
            - call: "POST /estimate-lines/${el_id}/parts-lines"
              payload: { part_number: "P-0002", part_description: "Door handle", part_type: "OEM", list_price_cents: 10000, qty: 1 }
              as: PartsManager
              captures: { pl2_id: $.data.id }
            - call: "POST /parts-lines/${pl2_id}/quote"
              payload: { vendor_id: "${v_id}", quoted_unit_price_cents: 10000 }
              as: PartsManager
            - call: "POST /parts-lines/${pl2_id}/accept-price"
              payload: {}
              as: PartsManager
            - call: "POST /parts-lines/${pl2_id}/order"
              payload: { promised_eta: "2026-08-05T00:00:00Z" }
              as: PartsManager
            - call: "POST /estimate-lines/${el_id}/parts-lines"
              payload: { part_number: "P-0003", part_description: "Mirror", part_type: "OEM", list_price_cents: 10000, qty: 1 }
              as: PartsManager
              captures: { pl3_id: $.data.id }
            - call: "POST /parts-lines/${pl3_id}/quote"
              payload: { vendor_id: "${v_id}", quoted_unit_price_cents: 10000 }
              as: PartsManager
            - call: "POST /parts-lines/${pl3_id}/accept-price"
              payload: {}
              as: PartsManager
            - call: "POST /parts-lines/${pl3_id}/order"
              payload: { promised_eta: "2026-08-05T00:00:00Z" }
              as: PartsManager
            - call: "POST /estimate-lines/${el_id}/parts-lines"
              payload: { part_number: "P-0004", part_description: "Weatherstrip", part_type: "OEM", list_price_cents: 10000, qty: 1 }
              as: PartsManager
              captures: { pl4_id: $.data.id }
            - call: "POST /parts-lines/${pl4_id}/quote"
              payload: { vendor_id: "${v_id}", quoted_unit_price_cents: 10000 }
              as: PartsManager
            - call: "POST /parts-lines/${pl4_id}/accept-price"
              payload: {}
              as: PartsManager
            - call: "POST /parts-lines/${pl4_id}/order"
              payload: { promised_eta: "2026-08-05T00:00:00Z" }
              as: PartsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /parts-lines/${pl1_id}/receive"
              payload: { received_qty: 1, condition: "CORRECT" }
              as: PartsManager
            - call: "POST /parts-lines/${pl2_id}/receive"
              payload: { received_qty: 1, condition: "CORRECT" }
              as: PartsManager
            - call: "POST /parts-lines/${pl3_id}/receive"
              payload: { received_qty: 1, condition: "CORRECT" }
              as: PartsManager
          trigger:
            - call: "POST /parts-lines/${pl4_id}/receive"
              payload: { received_qty: 1, condition: "CORRECT" }
              as: PartsManager
          assert:
            - "PartsVendor.${v_id}.fulfillment_score_lifetime == 55"
            - "PartsVendor.${v_id}.fulfillment_score_rolling == 40"
            - "PartsLine.${pl1_id}.on_time == true"
            - "PartsLine.${pl4_id}.on_time == false"
            - "PartsLine.${pl1_id}.vendor_order_seq == 1 and PartsLine.${pl4_id}.vendor_order_seq == 4"

  - rule_id: combinatorial_formula
    instances:
      - name: parts_extended_price_rounds_per_unit_before_multiplying_quantity
        grounds:
          - calculations.parts_line_extended_price
          - entities.PartsLine.fields.unit_extended_cents
          - entities.PartsLine.fields.extended_price_cents
          - entities.PartsVendor.fields.discount_pct
        distinguishing_aspect: |
          Mode (b) nested-rounding order: a 10101-cent aftermarket part at a 3.5% vendor discount over
          qty 3 must round the unit first (9747 x 3 = 29241); the forbidden sum-then-round order gives
          29242, so the one-cent difference proves which order the implementation pinned.
        test_recipe:
          setup:
            - "One customer, one insurer with aftermarket_allowed true and alternate_parts_min_vehicle_age_years 3."
            - "A 2019 repair order (7 model years old at the default clock) locked with a single BODY 4.5 h line, so the aftermarket line is INSURER_ALLOWED and no consent is needed."
            - "An aftermarket vendor with discount_pct 0.035 offering AFTERMARKET."
            - "A PLANNED aftermarket parts line, list_price_cents 10101, qty 3, quoted at 10101 per unit (inside the 1.1 x list ceiling of 11111)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Omar Diaz", phone: "555-0122", email: "omar@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "NRTH-3", name: "Northline Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 }, aftermarket_allowed: true, alternate_parts_min_vehicle_age_years: 3, parts_price_ceiling_pct: 1.1 }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /parts-vendors"
              payload: { name: "Valley Aftermarket", vendor_type: "AFTERMARKET_DISTRIBUTOR", part_types_offered: ["AFTERMARKET"], discount_pct: 0.035, max_qty_per_line: 4 }
              as: PartsManager
              captures: { v_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77031", vehicle_vin: "1HGCV1F30LA000113", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "RR-BUMPER", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-001"
              captures: { dl1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-001"
              captures: { el_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /estimate-lines/${el_id}/parts-lines"
              payload: { part_number: "AM-9001", part_description: "Bumper clip set", part_type: "AFTERMARKET", list_price_cents: 10101, qty: 3 }
              as: PartsManager
              captures: { pl_id: $.data.id }
            - call: "POST /parts-lines/${pl_id}/quote"
              payload: { vendor_id: "${v_id}", quoted_unit_price_cents: 10101 }
              as: PartsManager
          trigger:
            - call: "POST /parts-lines/${pl_id}/accept-price"
              payload: {}
              as: PartsManager
          assert:
            - "PartsLine.${pl_id}.unit_extended_cents == 9747"
            - "PartsLine.${pl_id}.extended_price_cents == 29241"
            - "PartsLine.${pl_id}.extended_price_cents != 29242"
            - "RepairOrder.${ro_id}.parts_gross_cents == 29241"
            - "RepairOrder.${ro_id}.parts_discount_cents == 0"
            - "RepairOrder.${ro_id}.pre_tax_total_cents == 57321"
            - "PartsLine.${pl_id}.authorization_status == INSURER_ALLOWED"

      - name: estimate_totals_nested_min_max_over_rate_ceiling_and_authorisation
        grounds:
          - calculations.estimate_totals
          - calculations.refinish_labor_allocation
          - entities.Insurer.fields.rate_ceiling_cents
          - entities.RepairOrder.fields.insurer_authorized_cents
          - entities.RepairOrder.fields.customer_pay_cents
          - state_machines.RepairOrder.BLUEPRINTED_to_ESTIMATE_LOCKED
        distinguishing_aspect: |
          Mode (a) non-linear interaction: every labor line runs through min(SHOP_RATE_CENTS[labor_type],
          Insurer.rate_ceiling_cents[labor_type]) and the split runs through max(0, min(pre_tax -
          deductible - betterment, authorization_ceiling)), so five lines plus two parts lines resolve to
          labor 84060, supplies 3362, parts 107404/3222/104182, pre-tax 191604 and a 25000 customer share.
        test_recipe:
          setup:
            - "The insurer's REFINISH ceiling 5800 is below the shop rate 6000 and its BODY ceiling 6000 is below 6500, so every line prices at the ceiling."
            - "A locked estimate carrying the five fixture lines (REFINISH 2.8 two_stage, REFINISH 2.2 adjacent, REFINISH 1.6 blend, BODY 4.5, FRAME 3.0)."
            - "Two priced parts lines: OEM 84500 at a 7.5% vendor discount qty 1, and AFTERMARKET 10101 at a 3.5% vendor discount qty 3."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rae Kim", phone: "555-0133", email: "rae@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "NRTH-4", name: "Northline Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 }, aftermarket_allowed: true, alternate_parts_min_vehicle_age_years: 3, parts_price_ceiling_pct: 1.1 }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /parts-vendors"
              payload: { name: "Metro OEM Parts", vendor_type: "OEM_DEALER", part_types_offered: ["OEM"], discount_pct: 0.075, max_qty_per_line: 4 }
              as: PartsManager
              captures: { v_oem_id: $.data.id }
            - call: "POST /parts-vendors"
              payload: { name: "Valley Aftermarket", vendor_type: "AFTERMARKET_DISTRIBUTOR", part_types_offered: ["AFTERMARKET"], discount_pct: 0.035, max_qty_per_line: 4 }
              as: PartsManager
              captures: { v_am_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77014", vehicle_vin: "1HGCV1F30LA000111", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-FENDER", severity: "MODERATE", requires_blend: true }
              as: Estimator
              as_user_id: "est-001"
              captures: { dl1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "REF-A", labor_type: "REFINISH", guide_hours: 2.8, two_stage: true }
              as: Estimator
              as_user_id: "est-001"
              captures: { el1_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "REF-B", labor_type: "REFINISH", guide_hours: 2.2, is_adjacent_panel: true }
              as: Estimator
              as_user_id: "est-001"
              captures: { el2_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "REF-C", labor_type: "REFINISH", guide_hours: 1.6, is_blend: true }
              as: Estimator
              as_user_id: "est-001"
              captures: { el3_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-001"
              captures: { el4_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1_id}", operation_code: "FRM-1", labor_type: "FRAME", guide_hours: 3.0 }
              as: Estimator
              as_user_id: "est-001"
              captures: { el5_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-001"
            - call: "POST /estimate-lines/${el4_id}/parts-lines"
              payload: { part_number: "OEM-5501", part_description: "Fender assembly", part_type: "OEM", list_price_cents: 84500, qty: 1 }
              as: PartsManager
              captures: { pl1_id: $.data.id }
            - call: "POST /parts-lines/${pl1_id}/quote"
              payload: { vendor_id: "${v_oem_id}", quoted_unit_price_cents: 84500 }
              as: PartsManager
            - call: "POST /parts-lines/${pl1_id}/accept-price"
              payload: {}
              as: PartsManager
            - call: "POST /estimate-lines/${el4_id}/parts-lines"
              payload: { part_number: "AM-9001", part_description: "Clip set", part_type: "AFTERMARKET", list_price_cents: 10101, qty: 3 }
              as: PartsManager
              captures: { pl2_id: $.data.id }
            - call: "POST /parts-lines/${pl2_id}/quote"
              payload: { vendor_id: "${v_am_id}", quoted_unit_price_cents: 10101 }
              as: PartsManager
          trigger:
            - call: "POST /parts-lines/${pl2_id}/accept-price"
              payload: {}
              as: PartsManager
          assert:
            - "EstimateLine.${el1_id}.effective_rate_cents == 5800"
            - "EstimateLine.${el1_id}.line_amount_cents == 17980"
