            - "a 1-day changeover gap is not enough: planned_start 2026-10-01 clears the overlap test yet returns 422 ERR_PHASE_BUFFER_VIOLATION because 2026-10-01 - 2026-09-30 == 1 < PHASE_BUFFER_DAYS"
            - "the two rejections carry different error_ids for start dates one day apart, so overlap and buffer must be evaluated as separate ordered checks"
            - "exactly 2 days is accepted: planned_start 2026-10-02 returns 201 (>= boundary, not > )"
            - "RenovationPhase.${ph15_2}.sequence_no == 2 and RenovationPhase.${ph15_2}.status == PENDING and exactly two phases exist on the project"
            - "no phase row was created by either rejected call, so sequence_no 2 was still free for the accepted attempt (a rejected create must not consume the ordinal)"
            - "RenovationProject.${proj15_id}.status == SCOPING throughout and sum of phase budget_cents == 12000000 == estimate_cents"
            - "CommitmentTranche.${tr15_ren}.encumbered_cents == 0 and available_balance_cents == 12000000 (phase planning moves no money before award)"

  # =========================================================================
  # Rule 9 - compensating invariants over two different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_tranche_budget_identity_with_no_drift
        grounds:
          - calculations.tranche_balance_identity
          - state_machines.EquipmentOrder.transitions.ORDERED_to_CANCELLED
          - calculations.encumbrance_waterfall
          - calculations.cost_share_split
          - entities.SpendTransaction.fields.reverses_transaction_id
        distinguishing_aspect: |
          Conserved quantity: the per-tranche budget identity
          amount_cents + carried_in == available + encumbered + disbursed + carried_out + expired
          + recaptured, asserted to the cent before and after a compensating cancellation. The
          amount 12_345_679 is chosen because its 45/35/20 split needs largest-remainder repair
          (5_555_555 / 4_320_988 / 2_469_136 against floors that sum to 12_345_677), so a RELEASE
          that re-derives the split independently instead of copying the stored ENCUMBRANCE shares
          leaves the funder pools off by a cent even though the tranche identity still balances.
        test_recipe:
          setup:
            - "BASE fixture (package ACTIVE, spend_status SPENDING, faculty ACTIVE), clock 2026-08-01T00:00:00Z."
            - "One DRY room and one EquipmentOrder quoted at 12_345_679, placed so a single ENCUMBRANCE row lands on the earliest-expiring EQUIPMENT tranche (25_000_000, expires 2027-01-01)."
            - "Balances are recorded immediately after the place call and must be restored exactly by the cancellation."
