            - "${level_after} == OV (derived from validation_type, not supplied on input)"
            - "the unknown-id call returns HTTP 404 and ${err_profile_missing} == ERR_PROFILE_NOT_FOUND"
            - "GET /ca/certificate-profiles?status=ACTIVE returns total_count == 1"

