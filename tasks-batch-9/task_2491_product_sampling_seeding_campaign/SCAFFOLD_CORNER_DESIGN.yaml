              as: CampaignManager
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "mf1@example.com", display_name: "MF One", address_hash: "H-MF1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
          trigger:
            - call: "POST /purchase-matches"
              payload: { enrollment_id: "${e1_id}", retailer_channel_code: "CH-AT-FLOOR", purchase_amount_cents: 1999, purchased_at: "2026-10-30T00:00:00Z", match_confidence: 0.8 }
              as: PlatformAdmin
              captures: { pm_at_id: $.data.id }
            - call: "POST /purchase-matches"
              payload: { enrollment_id: "${e1_id}", retailer_channel_code: "CH-BELOW-FLOOR", purchase_amount_cents: 1999, purchased_at: "2026-10-30T00:00:00Z", match_confidence: 0.7999 }
