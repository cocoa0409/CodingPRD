              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /modules?display_model_id=${dm}&limit=5&offset=10"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /modules?display_model_id=${dm}&module_state=TESTED"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /modules?display_model_id=${dm}&module_state=CALIBRATED&limit=1&offset=1"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /modules?display_model_id=${dm}&limit=0"
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { err_low: $.data.error_id }
            - call: "GET /modules?display_model_id=${dm}&limit=101"
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { err_high: $.data.error_id }
          assert:
            - "trigger call 1 -> 200 with limit == 10 (the §1.0 default, not 12), offset == 0, 10 rows returned, total_count == 12, has_more == true"
            - "trigger call 2 -> 200 with 2 rows (12 - 10), total_count == 12, has_more == false"
            - "trigger call 3 -> 200 with total_count == 2 and both rows in module_state TESTED: ${m3} and ${m4} — the filtered count, not 12, and calibration has already moved ${m1}/${m2} out of this bucket"
            - "trigger call 4 -> 200 with 1 row, total_count == 2, has_more == false: offset 1 of 2 filtered CALIBRATED rows"
            - "trigger call 5 -> 400 with ${err_low} == 'ERR_VALIDATION_FAILED' (limit must be in 1..100; 0 is not clamped to the default)"
            - "trigger call 6 -> 400 with ${err_high} == 'ERR_VALIDATION_FAILED'"
            - "GET /display-models -> total_count == 1, has_more == false: the envelope is present on every list endpoint, not only the busy ones"
            - "GET /modules/${m12} -> 200 with module_state CREATED, color_bin null, cabinet_id null: the single-row read shape matches the list row shape"

      - name: spare_reservation_links_a_module_to_a_contract_both_ways
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /service-contracts/{service_contract_id}/spare-reservations]
          - endpoints[GET /modules]
          - state_machines.ServiceContract
          - errors.ERR_MODULE_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
        distinguishing_aspect: |
          A reservation is a pure link write: both ends must resolve before anything
          happens, the module side gains reserved_service_contract_id, the contract
          side gains a counter increment and an OCC version bump, and the link must
          be queryable from the module collection by the contract id. Nothing about
          it changes module_state — the spare stays CALIBRATED, which is exactly
          what makes it eligible — and the contract need not be ACTIVE, so a
          PENDING contract can stock its shelf before the wall is even built.
        test_recipe:
          setup:
            - "A PENDING contract ${sc} on a fresh FP10-IN project, plus two CALIBRATED modules ${sp1} and ${sp2} of that model that are installed nowhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
