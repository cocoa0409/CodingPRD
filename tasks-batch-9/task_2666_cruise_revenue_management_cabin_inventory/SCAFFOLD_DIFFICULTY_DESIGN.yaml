              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000, upgrade_to_category_id: "${cat_ov}" }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail1: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_ia: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ov}", physical_cabins: 1, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_ov: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 120, window_close_days_to_sail: 60, base_lower_berth_fare_cents: 219995, third_berth_fare_cents: 69997, fourth_berth_fare_cents: 54997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ov}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 289995, third_berth_fare_cents: 79997, fourth_berth_fare_cents: 64997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ov}", window_open_days_to_sail: 120, window_close_days_to_sail: 60, base_lower_berth_fare_cents: 289995, third_berth_fare_cents: 79997, fourth_berth_fare_cents: 64997 }
              as: RevenueManager
            - call: "POST /sailings/${sail1}/open-for-sale"
