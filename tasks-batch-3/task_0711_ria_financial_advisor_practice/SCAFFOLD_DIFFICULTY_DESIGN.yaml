            - "Household.${hh_id}.aggregated_aum_cents == 200000000 (FROZEN account still aggregated)"
            - "Household.${hh_id}.breakpoint_tier_index == 1"

      - name: ips_approve_supersede_and_compliance_item_depth2
        grounds:
          - state_machines.InvestmentPolicyStatement.PROPOSED_to_APPROVED
          - state_machines.InvestmentPolicyStatement.APPROVED_to_SUPERSEDED
          - entities.ComplianceItem.fields.status
          - entities.InvestmentPolicyStatement.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different origin trigger (IPS APPROVE, not Account FREEZE): approving a second
          IPS (link1: PROPOSED->APPROVED) CAUSES the client's prior APPROVED IPS to flip APPROVED->SUPERSEDED
          (link2, caused by link1). A new OPEN ComplianceItem(IPS_ARCHIVE) is also spawned by the same approve.
        test_recipe:
          setup:
