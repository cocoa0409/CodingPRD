            - "moving the clock to that instant drives the system transition: Prescription.${rx_s5}.rx_status == ${rx_s5_status} == \"EXPIRED\""
            - "the item is marked rather than merely flagged on the prescription: AutoshipItem.${item_s5}.verification_state == EXPIRATION_MARKED"
            - "one day earlier the prescription is still usable, so the transition is a boundary rather than a gradual decay"

  # ===========================================================================
  - section: calculations
    instances:

      - name: first_order_discount_rate_switch
        claim_type: variant_selection
        grounds:
          - calculations.autoship_discount_cents
          - entities.Order.fields.order_kind
        excluded_because:
          difficulty_instance: discount_rounding_order_changes_the_order_total
          rationale: "That instance pins both the FIRST and RECURRING rate applications and the per-line rounding order."
      - name: order_total_components_recompute
        claim_type: correct_result
        grounds:
          - calculations.autoship_discount_cents
          - entities.Order.fields.order_total_cents
          - calculations.autoship_promo_reconciliation
        excluded_because:
          difficulty_instance: discount_rounding_order_changes_the_order_total
          rationale: "The components sum and its reconciliation to order_total_cents are asserted there for a two-line basket."
      - name: cold_pack_reserve_on_pack_and_release_on_cancel
        claim_type: correct_result
        grounds:
          - calculations.cold_pack_units
          - calculations.cold_pack_reserved_units
        excluded_because:
          difficulty_instance: cold_pack_release_restores_the_sites_committed_load
          rationale: "Both the commit arithmetic and the release compensation are asserted in that §1.8 instance."
      - name: empty_basket_composes_a_zero_line_order
        claim_type: correct_result
        grounds:
          - entities.Order.fields.bundle_line_count
          - calculations.autoship_discount_cents
        excluded_because:
          difficulty_instance: empty_due_set_composes_a_zero_line_order
          rationale: "The empty-due-set boundary is the whole subject of that §1.8 instance."

      - name: first_order_discount_uses_the_fixed_rate_and_per_line_rounding
        claim_type: Constants Applied
        grounds:
          - calculations.autoship_discount_cents
          - entities.Order.fields.order_kind
          - entities.OrderLine.fields.line_autoship_discount_cents
        distinguishing_aspect: "The first-order rate constant 0.35 is applied per line with round_half_up before summing, so a single-line order reads exactly round_half_up(subtotal * 0.35) rather than the recurring constant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A plan with one item priced so the discount rounding is exercised at a half-cent boundary."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "CAL-12", product_name: "First order pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1001 }
              as: PlatformAdmin
              captures: { prod_calc2: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Fennel", species: "DOG", breed: "Schipperke", weight_kg: 7.0, owner_state: "CA" }
              as: Customer
              captures: { pet_calc2: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_calc2}" }
              as: Customer
              as_user_id: "${pet_calc2}"
              captures: { plan_calc2: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_calc2}/items"
              payload: { product_id: "${prod_calc2}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_calc2}"
              captures: { item_calc2: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_calc2}"
              payload: {}
              as: Customer
              as_user_id: "${pet_calc2}"
              captures: { plan_calc2_v: $.data.version }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_calc2}/compose"
              payload: { expected_plan_version: "${plan_calc2_v}" }
              as: Customer
              as_user_id: "${pet_calc2}"
              captures: { order_calc2: $.data.id, kind_calc2: $.data.order_kind }
          assert:
            - "Order.${order_calc2}.order_kind == ${kind_calc2} == \"FIRST\" because the plan had no prior composed order"
            - "Order.${order_calc2}.merchandise_subtotal_cents == 1001 and autoship_discount_cents == 350"
            - "the constant applied is 0.35 rather than 0.10: round_half_up(1001 * 0.35) == round_half_up(350.35) == 350, whereas the recurring constant would give 100"
            - "Order.${order_calc2}.order_total_cents == 651, being 1001 minus 350 with no cold-pack or controlled-substance fee"

      - name: refill_consumption_uses_the_ceiling_of_daily_doses
        claim_type: Precision
        grounds:
          - calculations.refill_units_consumed
          - calculations.dosage_mg_per_day
          - entities.Prescription.fields.authorized_qty_remaining
        distinguishing_aspect: "The consumption figure is the ceiling of the daily dose count multiplied by the item's cadence, so a fractional daily dose rounds up rather than truncating and the debit reflects that."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A verified prescription on a 30-day item for a pet whose daily dose is fractional."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "SAN10", site_state: "CA", licensed_states: ["CA"], cold_pack_capacity_units: 400, csr_registered: true }
              as: ComplianceOfficer
              captures: { site_calc3: $.data.id }
            - call: "POST /v1/products"
              payload: { sku: "CAL-13", product_name: "Fractional dose pack", medication_scope: "PRESCRIPTION", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1500 }
              as: PlatformAdmin
              captures: { prod_calc3: $.data.id }
            - call: "POST /v1/veterinarians"
              payload: { full_name: "Dr Hollis Reed", clinic_name: "Bay Ridge Vet", clinic_phone: "4155550106", vet_email: "hreed@bayridgevet.example", license_number: "VET-CA-9006", license_state: "CA" }
              as: PharmacyTechnician
              captures: { vet_calc3: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Marlow", species: "DOG", breed: "Borzoi", weight_kg: 40.0, owner_state: "CA" }
              as: Customer
              captures: { pet_calc3: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_calc3}" }
              as: Customer
              as_user_id: "${pet_calc3}"
              captures: { plan_calc3: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_calc3}/items"
              payload: { product_id: "${prod_calc3}", cadence_days: 30, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_calc3}"
              captures: { item_calc3: $.data.id }
            - call: "POST /v1/prescriptions"
              payload: { autoship_item_id: "${item_calc3}", prescriber_id: "${vet_calc3}", script_source: "UPLOADED_SCRIPT", script_document_id: "doc-refill-1", drug_schedule: "NONE", temperature_sensitive: false, authorized_qty_total: 900, refills_authorized: 3 }
              as: PharmacyTechnician
              captures: { rx_calc3: $.data.id }
            - call: "POST /v1/prescriptions/${rx_calc3}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
            - call: "POST /v1/prescriptions/${rx_calc3}/clinic-authorizations"
              payload: {}
              as: ClinicContact
              as_user_id: "${vet_calc3}"
            - call: "POST /v1/prescriptions/${rx_calc3}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
            - call: "GET /v1/autoship-plans/${plan_calc3}"
              payload: {}
              as: Customer
              as_user_id: "${pet_calc3}"
              captures: { plan_calc3_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_calc3}/compose"
              payload: { expected_plan_version: "${plan_calc3_v}" }
              as: Customer
              as_user_id: "${pet_calc3}"
              captures: { order_calc3: $.data.id }
            - call: "POST /v1/shipments"
              payload: { order_id: "${order_calc3}" }
              as: PharmacyTechnician
              captures: { ship_calc3: $.data.id }
          trigger:
            - call: "POST /v1/orders/${order_calc3}/ship"
              payload: {}
              as: PharmacyTechnician
            - call: "GET /v1/prescriptions/${rx_calc3}"
              payload: {}
              as: PharmacyTechnician
              captures: { remaining_calc3: $.data.authorized_qty_remaining, used_calc3: $.data.refills_used }
          assert:
            - "the rounded dosage is round_half_up(0.02 * 40.0 * 1.2, 2) == 0.96, so doses_per_day is ceil(0.96 / 0.02) == ceil(48.0) == 48 rather than the truncated 47 a plain division would give"
            - "the consumption is 48 * 30 * 1 == 1440, so the debit is 1440 and Prescription.${rx_calc3}.authorized_qty_remaining == ${remaining_calc3} == 1440"
            - "Prescription.${rx_calc3}.refills_used == ${used_calc3} == 1, so exactly one refill cycle was recorded"
            - "the debit is larger than the authorized total 900, which is what makes the refill-cap rule on the same request observable: ERR_REFILL_LIMIT_EXCEEDED is returned rather than a partial debit"

      - name: band_variant_and_base_variant_disagree_on_equivalent_duration
        claim_type: Variant Divergence
        grounds:
          - calculations.run_cadence_days
          - calculations.cadence_prompt_due_days_delta
          - entities.AutoshipItem.fields.unit_lifecycle_equivalent_days
        distinguishing_aspect: "The band_cadence variant reads a whole-day band where the base variant reads the tiered pipeline, so the same row yields 4 versus 30 days and the derived prompt state flips from UNDER_CONSUMPTION to ALIGNED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One 40.0 kg dog with a 28-day item on a 30-unit pack dosed at 0.035 mg per kg."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/products"
              payload: { sku: "CAL-14", product_name: "Divergence pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.035, pack_size_units: 30, unit_price_cents: 1610 }
              as: PlatformAdmin
              captures: { prod_calc4: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Tansy", species: "DOG", breed: "Great Dane", weight_kg: 40.0, owner_state: "CA" }
              as: Customer
              captures: { pet_calc4: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_calc4}" }
              as: Customer
              as_user_id: "${pet_calc4}"
              captures: { plan_calc4: $.data.id }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_calc4}/items"
              payload: { product_id: "${prod_calc4}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_calc4}"
              captures: { item_calc4: $.data.id }
          assert:
            - "the two readings of the same inputs are 30 and 4, so no derivation of the field can be assumed"
            - "AutoshipItem.${item_calc4}.unit_lifecycle_equivalent_days == 30 under the pinned tiered pipeline"
            - "AutoshipItem.${item_calc4}.cadence_prompt_state == ALIGNED because 30 - 28 == 2 does not exceed the 3-day window"
            - "under the band_cadence variant the equivalent duration is 4, so cadence_days 28 minus 4 exceeds the window and the state becomes UNDER_CONSUMPTION"

  # ===========================================================================
  - section: validations
    instances:

      - name: plan_suspension_outranks_the_unverified_prescription
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: verification_failure_but_paused_plan_reports_the_state_error
          rationale: "That dual-failure pairing is asserted there with ERR_PLAN_PAUSED winning over ERR_RX_NOT_VERIFIED."
      - name: prescriber_status_outranks_the_site_licence
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: inactive_prescriber_outranks_the_site_licence_conflict
          rationale: "That dual-failure pairing is asserted there with ERR_PRESCRIBER_NOT_VERIFIED winning over ERR_SITE_NOT_LICENSED."
      - name: cadence_window_blackout_overlap
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors.ERR_CADENCE_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: cadence_window_boundary_moves_with_one_day_of_blackout_start
          rationale: "The half-open adjacency boundary on the cadence window is asserted there."
      - name: transit_buffer_overlap_with_the_blackout
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors.ERR_TEMPERATURE_CHAIN_RISK
        excluded_because:
          difficulty_instance: transit_buffer_makes_the_adjacent_interval_conflict
          rationale: "The buffered interval semantics that distinguish this rule from the cadence window are asserted there."

      - name: missing_user_context_header_returns_401_before_existence
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_USER_CONTEXT
        distinguishing_aspect: "The header rule sits at priority 1, so an anonymous request naming a nonexistent resource still returns the authentication error rather than the existence error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/pets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err_v1: $.data.error_id }
          assert:
            - "the response status is 401, not 404, even though the named pet does not exist"
            - "error_id == ${err_v1} == \"ERR_MISSING_USER_CONTEXT\""
            - "the priority-1 rule short-circuits the priority-3 existence rule, so the body never discloses whether the id exists"

      - name: shipping_a_single_controlled_prescription_carries_the_expedited_fee
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=19]
          - calculations.autoship_discount_cents
          - entities.Order.fields.order_total_cents
          - entities.Order.fields.expedited_shipping_fee_cents
        distinguishing_aspect: "A satisfied fiscal rule is observable: an ordinary order composes successfully with a zero expedited fee, and the fee only appears once a CII or CIII prescription is on the order."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A plan with one OTC item due on the logical date."
