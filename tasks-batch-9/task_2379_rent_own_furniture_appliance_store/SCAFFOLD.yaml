  - method: GET
    path: /delivery-orders
    roles: [PlatformAdmin, ComplianceOfficer, StoreManager, SalesAssociate, ServiceTechnician]
    input:
      agreement_id?: string
      crew_id?: string
      status?: enum
      limit?: integer
      offset?: integer
    output: DeliveryOrder[]
    side_effects: []
    notes: "Reverse-reachability for DeliveryOrder.agreement_id and DeliveryOrder.crew_id. Ordered by window_start_at ASC, then created_at ASC."

  - method: POST
    path: /delivery-orders/{id}/complete
    roles: [PlatformAdmin, StoreManager, ServiceTechnician]
    input:
      setup_completed: boolean
    output: DeliveryOrder
    side_effects:
      - "sets status = COMPLETED, completed_at = the logical clock and setup_completed = the submitted value"
      - "transitions the agreement PENDING_DELIVERY -> DELIVERED and the unit RESERVED -> ON_RENT"
      - "increments Store.units_on_rent_count"
    notes: "An APPLIANCE unit may not be completed with setup_completed == false (ERR_SETUP_NOT_COMPLETED)."

  - method: POST
    path: /delivery-orders/{id}/fail-attempt
    roles: [PlatformAdmin, StoreManager, ServiceTechnician]
    input:
      reason: enum
    output: DeliveryOrder
    side_effects:
      - "increments attempt_count; the order stays SCHEDULED at attempt_count 1 and 2 and moves SCHEDULED -> FAILED_ATTEMPT when attempt_count reaches 3"
      - "when the order reaches FAILED_ATTEMPT, releases the reservation: the unit returns RESERVED -> AVAILABLE and the agreement's possession_status stays PENDING_DELIVERY so a fresh order may be cut for another crew, which supersedes the failed one"
    notes: "reason is CUSTOMER_ABSENT | ACCESS_BLOCKED | VEHICLE_ISSUE. No money moves and no loyalty is written by a failed attempt."

