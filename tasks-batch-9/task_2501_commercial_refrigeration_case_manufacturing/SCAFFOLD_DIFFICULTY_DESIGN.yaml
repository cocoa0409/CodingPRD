scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: energy_index_lab_variant_versus_field_variant_divergence
        grounds:
          - calculations.energy_use_index
          - entities.EnergyTest.fields.lab_rated_index
          - entities.EnergyTest.fields.field_projected_daily_kwh
          - entities.EnergyTest.fields.field_projected_index
          - entities.EnergyTest.fields.field_exceedance
          - state_machines.EnergyTest.RUNNING_to_COMPLETED_PASS
        distinguishing_aspect: |
          The dual variant lives on the EnergyTest lab-measurement domain: the same metered
          17.0 kWh yields lab_rated_index 0.644 (certifiable) and field_projected_index 0.823
          (over the limit), so the certification decision and the store projection disagree on
          identical data.
        test_recipe:
          setup:
            - "Refrigerant R-448A with gwp_100yr 1387, safety_class A1, max_charge_grams 999999, allowed on REMOTE and SELF_CONTAINED."
            - "EnergyStandard DOE-2027-RSC-MT effective 2026-01-01, limit_coefficient_a 0.62, limit_constant_b 1.20, temperature_class MT, system_type_scope ANY."
            - "TestChamber CH-1 supporting HT/MT/LT, turnaround_hours 12, max_tda_sqft 80."
            - "CaseModel MDL-MT-8 (MT, REMOTE, tda_sqft 26.4, defrost_cycles_per_day 4) modelled and submitted for test, so its design_revision is 1 and status is SUBMITTED_FOR_TEST."
            - "EnergyTest scheduled with test_ambient_c 24.0 and store_ambient_c 31.0, limit_daily_kwh pinned to 17.568, then started so its status is RUNNING."
          setup_api_calls:
            - call: "POST /refrigerants"
              payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }
              as: PlatformAdmin
              captures: { ref_a1_id: "$.data.id" }
            - call: "POST /energy-standards"
              payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { std_mt_id: "$.data.id" }
            - call: "POST /test-chambers"
              payload: { chamber_code: "CH-1", name: "Psychrometric Bay 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }
              as: PlatformAdmin
              captures: { chamber_id: "$.data.id" }
            - call: "POST /case-models"
              payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_a1_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_id: "$.data.id" }
            - call: "POST /case-models/${cm_id}/airflow-model"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /case-models/${cm_id}/submit-for-test"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_v: "$.data.version" }
            - call: "POST /energy-tests"
              payload: { case_model_id: "${cm_id}", test_chamber_id: "${chamber_id}", energy_standard_id: "${std_mt_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 31.0, expected_case_model_version: "${cm_v}" }
              as: TestLabTechnician
              captures: { test_id: "$.data.id" }
            - call: "POST /energy-tests/${test_id}/start"
              payload: {}
              as: TestLabTechnician
          trigger:
            - call: "POST /energy-tests/${test_id}/complete"
              payload: { measured_kwh_24h: 17.0, measured_defrost_cycles: 2 }
              as: TestLabTechnician
          assert:
            - "EnergyTest.${test_id}.limit_daily_kwh == 17.568"
            - "EnergyTest.${test_id}.status == COMPLETED_PASS"
            - "EnergyTest.${test_id}.lab_rated_index == 0.644"
            - "EnergyTest.${test_id}.field_projected_daily_kwh == 21.725"
            - "EnergyTest.${test_id}.field_projected_index == 0.823"
            - "EnergyTest.${test_id}.field_exceedance == true"
            - "EnergyTest.${test_id}.field_projected_index != EnergyTest.${test_id}.lab_rated_index"
            - "CaseModel.${cm_id}.status == TESTED_PASS"

      - name: refrigerant_charge_nameplate_basis_versus_installed_basis
        grounds:
          - calculations.refrigerant_charge_basis
          - entities.CaseModel.fields.installed_charge_grams
          - entities.CaseModel.fields.nameplate_co2e_kg
          - entities.CaseModel.fields.installed_co2e_kg
          - state_machines.CaseModel.DRAFT_to_MODELED
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain — CaseModel refrigerant
          accounting, not EnergyTest energy measurement: the nameplate basis reports 5825.4 kg
          CO2e from the 4200 g sealed charge while the installed basis reports 10152.8 kg from
          the 7320 g charge that includes the 120 ft field line set.
        test_recipe:
          setup:
            - "Refrigerant R-448A with gwp_100yr 1387 and max_charge_grams 999999."
            - "CaseModel MDL-MT-8 created as REMOTE with charge_grams 4200 and line_set_length_ft 120, still DRAFT with every computed charge field null."
          setup_api_calls:
            - call: "POST /refrigerants"
              payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }
              as: PlatformAdmin
              captures: { ref_a1_id: "$.data.id" }
            - call: "POST /case-models"
              payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_a1_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_id: "$.data.id" }
          trigger:
            - call: "POST /case-models/${cm_id}/airflow-model"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
          assert:
            - "CaseModel.${cm_id}.charge_grams == 4200"
            - "CaseModel.${cm_id}.installed_charge_grams == 7320"
            - "CaseModel.${cm_id}.nameplate_co2e_kg == 5825.4"
            - "CaseModel.${cm_id}.installed_co2e_kg == 10152.8"
            - "CaseModel.${cm_id}.status == MODELED"

  - rule_id: combinatorial_formula
    instances:
      - name: airflow_design_load_nonlinear_branching_formula
        grounds:
          - calculations.airflow_load_model
          - entities.CaseModel.fields.infiltration_load_w
          - entities.CaseModel.fields.anti_sweat_load_w
          - entities.CaseModel.fields.total_design_load_w
          - state_machines.CaseModel.DRAFT_to_MODELED
        distinguishing_aspect: |
          Mode (a): the design load multiplies five inputs with two nested max() clamps
          (curtain_factor floor, velocity_factor rectifier) and adds a conditional
          self-contained condenser-reject branch, so an MT REMOTE case lands at 442.91 W while
          an LT SELF_CONTAINED case with glass doors lands at 910.80 W.
        test_recipe:
          setup:
            - "Refrigerant R-448A allowed on both REMOTE and SELF_CONTAINED."
            - "CaseModel MDL-MT-8: MT, REMOTE, tda_sqft 26.4, nominal_length_ft 8, curtain_layers 2, discharge_velocity_mps 0.55, case_air_temp_c 2.0, ambient_dew_point_c 15.5, lighting 12.0 W/ft, fan 9.5 W/ft, 4 defrost cycles, OPEN with 0 glass doors."
            - "CaseModel MDL-LT-6: LT, SELF_CONTAINED, tda_sqft 18.0, nominal_length_ft 6, curtain_layers 3, discharge_velocity_mps 0.60, case_air_temp_c -24.0, ambient_dew_point_c 12.0, lighting 14.0 W/ft, fan 11.0 W/ft, 6 defrost cycles, GLASS_DOOR with 3 glass doors, line_set_length_ft 0."
          setup_api_calls:
            - call: "POST /refrigerants"
              payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }
              as: PlatformAdmin
              captures: { ref_a1_id: "$.data.id" }
            - call: "POST /case-models"
              payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_a1_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_mt_id: "$.data.id" }
            - call: "POST /case-models"
              payload: { model_code: "MDL-LT-6", application: "FROZEN_REACH_IN", temperature_class: "LT", system_type: "SELF_CONTAINED", refrigerant_id: "${ref_a1_id}", nominal_length_ft: 6, tda_sqft: 18.0, charge_grams: 1800, line_set_length_ft: 0, door_type: "GLASS_DOOR", glass_door_count: 3, curtain_layers: 3, discharge_velocity_mps: 0.60, case_air_temp_c: -24.0, ambient_dew_point_c: 12.0, lighting_w_per_ft: 14.0, fan_w_per_ft: 11.0, defrost_cycles_per_day: 6 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_lt_id: "$.data.id" }
          trigger:
            - call: "POST /case-models/${cm_mt_id}/airflow-model"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /case-models/${cm_lt_id}/airflow-model"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
          assert:
            - "CaseModel.${cm_mt_id}.curtain_factor == 0.88"
            - "CaseModel.${cm_mt_id}.infiltration_load_w == 255.51"
            - "CaseModel.${cm_mt_id}.lighting_load_w == 96.00"
            - "CaseModel.${cm_mt_id}.fan_load_w == 76.00"
            - "CaseModel.${cm_mt_id}.defrost_load_w == 15.40"
            - "CaseModel.${cm_mt_id}.anti_sweat_load_w == 0.00"
            - "CaseModel.${cm_mt_id}.total_design_load_w == 442.91"
            - "CaseModel.${cm_lt_id}.curtain_factor == 0.76"
            - "CaseModel.${cm_lt_id}.infiltration_load_w == 551.58"
            - "CaseModel.${cm_lt_id}.anti_sweat_load_w == 126.00"
            - "CaseModel.${cm_lt_id}.total_design_load_w == 910.80"

      - name: store_plan_total_pinned_evaluation_order_discount_then_freight_cap
        grounds:
          - calculations.store_plan_commercial_total
          - calculations.case_unit_price_cents
          - entities.StorePlan.fields.volume_discount_bps
          - entities.StorePlan.fields.freight_cents
          - entities.StorePlan.fields.total_cents
          - state_machines.StorePlan.DRAFT_to_PRICED
        distinguishing_aspect: |
          Mode (c): the volume tier is keyed on subtotal_cents (5217500 -> 300 bps) while freight
          and the install allowance are keyed on net_cents, which already contains that discount —
          reading the three as one all-at-once system of equations is circular, so the six-step order
          is the only way to reach total_cents 5389938.
        test_recipe:
          setup:
            - "Certified CaseModel MDL-MT-8 (MT, REMOTE, nominal_length_ft 8, OPEN) with an ISSUED ComplianceLabel."
            - "StorePlan FreshMart/0412 in region OH, remodel window 2026-09-14 to 2026-09-27, credit_limit_cents 20000000, commercial_status DRAFT."
            - "One line: 5 units of MDL-MT-8 at 8 ft with a LEFT end cap and options LED_CANOPY + NIGHT_CURTAIN, so unit_price_cents is 1043500 and extended_price_cents is 5217500."
          setup_api_calls:
            - call: "POST /refrigerants"
              payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }
              as: PlatformAdmin
              captures: { ref_a1_id: "$.data.id" }
            - call: "POST /energy-standards"
              payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { std_mt_id: "$.data.id" }
            - call: "POST /test-chambers"
              payload: { chamber_code: "CH-1", name: "Psychrometric Bay 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }
              as: PlatformAdmin
              captures: { chamber_id: "$.data.id" }
            - call: "POST /case-models"
              payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_a1_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_id: "$.data.id" }
            - call: "POST /case-models/${cm_id}/airflow-model"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /case-models/${cm_id}/submit-for-test"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_v: "$.data.version" }
            - call: "POST /energy-tests"
              payload: { case_model_id: "${cm_id}", test_chamber_id: "${chamber_id}", energy_standard_id: "${std_mt_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }
              as: TestLabTechnician
              captures: { test_id: "$.data.id" }
            - call: "POST /energy-tests/${test_id}/start"
              payload: {}
              as: TestLabTechnician
            - call: "POST /energy-tests/${test_id}/complete"
              payload: { measured_kwh_24h: 15.0, measured_defrost_cycles: 4 }
              as: TestLabTechnician
            - call: "POST /compliance-labels"
              payload: { case_model_id: "${cm_id}", energy_test_id: "${test_id}", label_code: "LBL-MT-8-A" }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { label_id: "$.data.id" }
            - call: "POST /store-plans"
              payload: { banner_name: "FreshMart", store_number: "0412", region_code: "OH", remodel_window_start: "2026-09-14T00:00:00Z", remodel_window_end: "2026-09-27T00:00:00Z", credit_limit_cents: 20000000 }
              as: SalesEngineer
              as_user_id: "sales-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /store-plans/${plan_id}/lines"
              payload: { case_model_id: "${cm_id}", length_ft: 8, quantity: 5, end_cap: "LEFT", merchandising_options: ["LED_CANOPY", "NIGHT_CURTAIN"] }
              as: SalesEngineer
              as_user_id: "sales-001"
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /store-plans/${plan_id}/price"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-001"
          assert:
            - "StorePlanLine.${line_id}.unit_price_cents == 1043500"
            - "StorePlanLine.${line_id}.extended_price_cents == 5217500"
            - "StorePlan.${plan_id}.subtotal_cents == 5217500"
            - "StorePlan.${plan_id}.volume_discount_bps == 300"
            - "StorePlan.${plan_id}.volume_discount_cents == 156525"
            - "StorePlan.${plan_id}.net_cents == 5060975"
            - "StorePlan.${plan_id}.freight_cents == 202439"
            - "StorePlan.${plan_id}.install_allowance_cents == 126524"
            - "StorePlan.${plan_id}.total_cents == 5389938"
            - "StorePlan.${plan_id}.commercial_status == PRICED"
            - "StorePlan.${plan_id}.production_status == NOT_RELEASED"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_model_certified_cycles_back_to_draft_on_refrigerant_transition
        grounds:
          - state_machines.CaseModel.CERTIFIED_to_DRAFT
          - state_machines.CaseModel.note
          - state_machines.ComplianceLabel.ISSUED_to_SUPERSEDED
          - entities.CaseModel.fields.design_revision
          - endpoints.POST./case-models/{id}/engineering-change
        distinguishing_aspect: |
          Non-linearity by backward cycle on the CaseModel design machine: CERTIFIED is not
          terminal — a lower-GWP refrigerant transition walks the row back to DRAFT at
          design_revision 2 with every computed field cleared, so the same row must traverse
          DRAFT -> MODELED -> SUBMITTED_FOR_TEST -> TESTED_PASS -> CERTIFIED a second time.
        test_recipe:
          setup:
            - "Refrigerant R-448A (gwp_100yr 1387, A1) and Refrigerant R-454C (gwp_100yr 148, safety_class A2L, max_charge_grams 4000), both allowed on REMOTE."
            - "EnergyStandard DOE-2027-RSC-MT and TestChamber CH-1 registered."
            - "CaseModel MDL-MT-8 driven all the way to CERTIFIED on R-448A with ISSUED ComplianceLabel LBL-MT-8-A pinned at design_revision 1."
          setup_api_calls:
            - call: "POST /refrigerants"
              payload: { refrigerant_code: "R-448A", trade_name: "Solstice N40", gwp_100yr: 1387, safety_class: "A1", max_charge_grams: 999999, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }
              as: PlatformAdmin
              captures: { ref_a1_id: "$.data.id" }
            - call: "POST /refrigerants"
              payload: { refrigerant_code: "R-454C", trade_name: "Opteon XL20", gwp_100yr: 148, safety_class: "A2L", max_charge_grams: 4000, allowed_system_types: ["REMOTE", "SELF_CONTAINED"] }
              as: PlatformAdmin
              captures: { ref_a2l_id: "$.data.id" }
            - call: "POST /energy-standards"
              payload: { standard_code: "DOE-2027-RSC-MT", effective_date: "2026-01-01T00:00:00Z", max_gwp: 1500, limit_coefficient_a: 0.62, limit_constant_b: 1.20, temperature_class: "MT", system_type_scope: "ANY" }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { std_mt_id: "$.data.id" }
            - call: "POST /test-chambers"
              payload: { chamber_code: "CH-1", name: "Psychrometric Bay 1", supported_temperature_classes: ["HT", "MT", "LT"], turnaround_hours: 12, max_tda_sqft: 80.0 }
              as: PlatformAdmin
              captures: { chamber_id: "$.data.id" }
            - call: "POST /case-models"
              payload: { model_code: "MDL-MT-8", application: "DAIRY_MULTIDECK", temperature_class: "MT", system_type: "REMOTE", refrigerant_id: "${ref_a1_id}", nominal_length_ft: 8, tda_sqft: 26.4, charge_grams: 4200, line_set_length_ft: 120, door_type: "OPEN", glass_door_count: 0, curtain_layers: 2, discharge_velocity_mps: 0.55, case_air_temp_c: 2.0, ambient_dew_point_c: 15.5, lighting_w_per_ft: 12.0, fan_w_per_ft: 9.5, defrost_cycles_per_day: 4 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_id: "$.data.id" }
            - call: "POST /case-models/${cm_id}/airflow-model"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
            - call: "POST /case-models/${cm_id}/submit-for-test"
              payload: {}
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { cm_v: "$.data.version" }
            - call: "POST /energy-tests"
              payload: { case_model_id: "${cm_id}", test_chamber_id: "${chamber_id}", energy_standard_id: "${std_mt_id}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-04T08:00:00Z", test_ambient_c: 24.0, store_ambient_c: 27.0, expected_case_model_version: "${cm_v}" }
              as: TestLabTechnician
              captures: { test_id: "$.data.id" }
            - call: "POST /energy-tests/${test_id}/start"
              payload: {}
              as: TestLabTechnician
            - call: "POST /energy-tests/${test_id}/complete"
              payload: { measured_kwh_24h: 15.0, measured_defrost_cycles: 4 }
              as: TestLabTechnician
            - call: "POST /compliance-labels"
              payload: { case_model_id: "${cm_id}", energy_test_id: "${test_id}", label_code: "LBL-MT-8-A" }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { label_id: "$.data.id" }
          trigger:
            - call: "POST /case-models/${cm_id}/engineering-change"
              payload: { refrigerant_id: "${ref_a2l_id}", charge_grams: 3600, line_set_length_ft: 120, change_note: "R-454C transition for the 2027 GWP step-down" }
              as: DesignEngineer
              as_user_id: "eng-001"
          assert:
            - "CaseModel.${cm_id}.status == DRAFT"
            - "CaseModel.${cm_id}.design_revision == 2"
            - "CaseModel.${cm_id}.refrigerant_id == ${ref_a2l_id}"
            - "CaseModel.${cm_id}.charge_grams == 3600"
            - "CaseModel.${cm_id}.total_design_load_w IS NULL"
            - "CaseModel.${cm_id}.installed_charge_grams IS NULL"
            - "CaseModel.${cm_id}.nameplate_co2e_kg IS NULL"
            - "CaseModel.${cm_id}.submitted_by_user_id IS NULL"
            - "ComplianceLabel.${label_id}.label_status == SUPERSEDED"
            - "ComplianceLabel.${label_id}.pinned_design_revision == 1"
            - "EnergyTest.${test_id}.status == COMPLETED_PASS"

      - name: store_plan_commercial_hold_does_not_rewind_production_dimension
        grounds:
          - state_machines.StorePlan.note
          - state_machines.StorePlan.APPROVED_to_HOLD_PENDING_RECERT
          - state_machines.StorePlan.NOT_RELEASED_to_IN_PRODUCTION
          - state_machines.WorkOrder.QUEUED_to_HELD
          - entities.StorePlan.fields.held_line_count
        distinguishing_aspect: |
          Non-linearity by two independent dimensions on one StorePlan row rather than by a
          backward cycle: a label revocation drives commercial_status APPROVED ->
