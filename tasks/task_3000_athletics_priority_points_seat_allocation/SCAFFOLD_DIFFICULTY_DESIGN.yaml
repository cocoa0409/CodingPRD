  - rule_id: resource_temporal_overlap
    instances:
      - name: selection_event_windows_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations.priority_16
          - state_machines.SelectionEvent.SLOTS_PUBLISHED_to_OPEN
          - calculations.slot_window_assignment
          - errors.ERR_SELECTION_WINDOW_OVERLAP
        distinguishing_aspect: |
          Event windows are half-open, so two events on the same recalculation may
          touch at a shared boundary instant: gating EV2, whose window_start is
          exactly EV1's window_end, must succeed, while gating EV3, whose window
          starts one day inside EV2's window, must fail with
          ERR_SELECTION_WINDOW_OVERLAP and leave EV3 in SLOTS_PUBLISHED. A
          closed-interval reading of the same three windows rejects the legal
          adjacency.
