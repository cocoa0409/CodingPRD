            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "POST /v1/component-lots"
              payload: { supplier_name: "GlassCo", lot_code: "LOT-US-1", component_type: "GLASS", country_of_origin: "US", lot_cost_usd: 400.0 }
              as: SupplyChainAuditor
              captures: { lot_id: $.data.id }
            - call: "POST /v1/component-lots/${lot_id}/verify"
              payload: {}
              as: SupplyChainAuditor
            - call: "POST /v1/deliveries"
              payload: { reservation_id: "${res_id}", scheduled_window_start: "2027-03-01T00:00:00Z", scheduled_window_end: "2027-04-01T00:00:00Z", volume_mw: 2.0, lot_ids: ["${lot_id}"] }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { del_id: $.data.id }
            - call: "POST /v1/production-lines/${line_id}/suspend"
              payload: {}
              as: PlantManager
