            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://eg-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-EGM", name: "EG Mgr" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-EG", name: "EG Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-EG-1", full_name: "EG Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-EG-1", full_name: "EG Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-09-01T00:00:00Z", statement_version: "STMT-EG" }, as: ComplianceAdmin, captures: { camp: "$.data.id" } }
            - { call: "POST /compliance/campaigns/${camp}/open", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/employees/${emp}/attestations", as: ComplianceAdmin, captures: { att: "$.data[0].id" } }
            - { call: "POST /compliance/attestations/${att}/exceptions", payload: { reason_code: "ROLE_TRANSITION", detail: "Moved departments mid-cycle" }, as: Manager, as_user_id: "${mgr}", captures: { exc: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/exceptions/${exc}/approve", payload: {}, as: ComplianceAdmin, captures: { exc_st: "$.data.status" } }
            - { call: "GET /compliance/attestations/${att}", as: ComplianceAdmin, captures: { att_st: "$.data.status" } }
            - { call: "POST /compliance/exceptions/${exc}/deny", payload: { decision_note: "too late" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "exc_st == \"APPROVED\" and att_st == \"EXEMPTED\""
            - "err == \"ERR_EXCEPTION_NOT_PENDING\" (decided exceptions are terminal)"

      - name: role_change_reverse_blocked_by_verified_completion
        claim_type: precondition_enforcement
        grounds:
          - "errors[ERR_ROLE_CHANGE_NOT_REVERSIBLE]"
          - "state_machines.EmployeeRoleChange.APPLIED_to_REVERSED"
        distinguishing_aspect: "Reverse is blocked twice over: first because a SCHEDULED change is not APPLIED, then (after applying and verifying a change-created assignment) because an ACCEPTED completion exists on a change-created assignment."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-RVB; curricula CUR-RVB1, CUR-RVB2 ACTIVE; R-RVB1 (req on CUR-RVB1), R-RVB2 (req on CUR-RVB2, due 30 SOFT); employee E-RVB in R-RVB1"
            - "RC1 to R-RVB2 effective 2026-08-10 (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-RVB", name: "RVB Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
