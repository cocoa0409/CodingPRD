      - name: chargeback_ledger_counts_only_adjudicated_claims
        claim_type: input_set_filtering
        grounds:
          - calculations.party_chargeback_ledger
          - entities.Hauler.fields.chargeback_balance_cents
          - endpoints[GET /installations/orders/{id}/summary]
        distinguishing_aspect: |
          The ledger's input set is exactly the ADJUDICATED rows: a SUBMITTED claim
          and an UNDER_REVIEW claim both contribute 0, adjudication moves 90000
          into the sum, a second SUBMITTED claim for twice the money still
          contributes nothing, and reversal drops the row back out. Because the
          recompute is total rather than incremental, the conserved
          network_chargeback_cents tracks the ADJUDICATED approved amounts at every
          step.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, one SetCrew, a single-section AZ order with the section created"
            - "claim 1 for 100000 cents discovered IN_TRANSIT, still SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-014" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771004", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-88", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1660", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 720, declared_weight_lb: 22000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "IN_TRANSIT", claimed_amount_cents: 100000, blocks_set: false, plant_evidence_points: 0, hauler_evidence_points: 1, installer_evidence_points: 0 }
              as: ClaimsAdjuster
              captures: { claim1_id: $.data.id }
          trigger:
            - call: "POST /installations/damage-claims/${claim1_id}/review"
              payload: { notes: "under review, nothing charged yet" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim1_id}/adjudicate"
              payload: { allocation_basis: "STAGE" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${order_id}", section_id: "${sec_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "IN_TRANSIT", claimed_amount_cents: 200000, blocks_set: false, plant_evidence_points: 0, hauler_evidence_points: 1, installer_evidence_points: 0 }
              as: ClaimsAdjuster
              captures: { claim2_id: $.data.id }
            - call: "POST /installations/damage-claims/${claim1_id}/reverse"
              payload: { reason_code: "NEW_EVIDENCE" }
              as: ClaimsAdjuster
          assert:
            - "before trigger: Hauler.${hauler_id}.chargeback_balance_cents == 0"
            - "after trigger step 1: DamageClaim.${claim1_id}.status == UNDER_REVIEW"
            - "after trigger step 1: Hauler.${hauler_id}.chargeback_balance_cents == 0"
            - "after trigger step 2: DamageClaim.${claim1_id}.approved_amount_cents == 90000"
            - "after trigger step 2: DamageClaim.${claim1_id}.hauler_charge_cents == 90000"
            - "after trigger step 2: DamageClaim.${claim1_id}.plant_charge_cents == 0"
            - "after trigger step 2: Hauler.${hauler_id}.chargeback_balance_cents == 90000"
            - "after trigger step 2: Hauler.${hauler_id}.status == ACTIVE"
            - "after trigger step 3: DamageClaim.${claim2_id}.status == SUBMITTED"
            - "after trigger step 3: Hauler.${hauler_id}.chargeback_balance_cents == 90000"
            - "after trigger step 3: GET /installations/orders/${order_id}/summary returns open_claim_count == 1 and network_chargeback_cents == 90000"
            - "after trigger step 4: Hauler.${hauler_id}.chargeback_balance_cents == 0"
            - "after trigger step 4: GET /installations/orders/${order_id}/summary returns network_chargeback_cents == 0"

      - name: escort_matrix_constants_night_bonus_overheight_and_leg_threshold
        claim_type: constants_applied
        grounds:
          - calculations.escort_requirement_matrix
          - calculations.permit_fee_assessment
          - entities.TransportPermit.fields.pilot_car_required
        distinguishing_aspect: |
          Three permits on the same AZ order isolate one constant each while every
          other input is held fixed at 168 in wide: 3 planned legs trips
          PILOT_CAR_LEG_THRESHOLD with 0 escorts (fee 12000 + 3 x 4500 = 25500);
          night_move true adds NIGHT_MOVE_ESCORT_BONUS to AZ's zero base for 1
          escort (12000 + 9000 + 7500 = 28500) without requiring a pilot car; and a
          height of exactly OVERHEIGHT_IN adds both an escort and the 9000
          surcharge (12000 + 9000 + 7500 + 9000 = 37500). None of the three is
