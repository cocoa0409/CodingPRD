            - { call: "POST /compliance/employees", payload: { employee_no: "E-DD-1", full_name: "DD Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id", a_dl0: "$.data[0].deadline_status" } }
          trigger:
