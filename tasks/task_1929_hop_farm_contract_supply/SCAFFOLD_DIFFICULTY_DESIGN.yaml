# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 1929 Hop Farm & Contract Supply
# 9 rules x 2 instances = 18 instances. Every recipe is empty-DB executable
# against SCAFFOLD.yaml §1.5.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_price_provisional_vs_final
        grounds:
          - calculations.alpha_price_adjustment
          - calculations.pellet_blend
          - entities.Allocation.fields.estimated_unit_price_cents
        distinguishing_aspect: |
          Entity domain: contract pricing on Allocation. The provisional variant
          (alpha_eff = final-else-provisional) and the final variant (all-final
          alphas) produce different unit prices for identical delivery data:
          555 vs 530 cents once source lot A's FINAL posts 12.0 against its
          PROVISIONAL 13.0.
        test_recipe:
          setup:
            - "CASCADE 2026 plan (40 ac) with two released lots: A dried 500 (PROVISIONAL alpha 13.0, no FINAL), B dried 300 (FINAL 14.0)"
            - "Pellet lot from A+B: qty 736, blended_alpha 13.38"
            - "ACTIVE contract BrewCo CASCADE 2026-2028 vol 736 base 500 floor 12.0 premium 40 discount 60; allocation allocated 736; confirmed; delivered"
            - "estimated_unit_price_cents is 555 before the FINAL on lot A posts"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1875 }, as: FarmManager, captures: { lot_a: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_a}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/finish-drying", payload: { dried_lbs: 500 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "PROVISIONAL", alpha_pct: 13.0 }, as: LabTechnician }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1125 }, as: FarmManager, captures: { lot_b: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_b}/finish-drying", payload: { dried_lbs: 300 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_b}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_b}", test_type: "PROVISIONAL", alpha_pct: 14.0 }, as: LabTechnician }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_b}", test_type: "FINAL", alpha_pct: 14.0 }, as: LabTechnician }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_a}", "${lot_b}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager }
            - { call: "POST /api/allocation-runs", payload: { crop_year: 2026, variety: "CASCADE" }, as: ContractManager }
            - { call: "GET /api/allocations", payload: {}, as: ContractManager, captures: { a_id: "$.data[0].id" } }
            - { call: "POST /api/allocations/${a_id}/confirm", payload: {}, as: ContractManager }
            - { call: "POST /api/allocations/${a_id}/deliver", payload: {}, as: ContractManager, captures: { est_before: $.data.estimated_unit_price_cents } }
          trigger:
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "FINAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "GET /api/allocations/${a_id}", payload: {}, as: ContractManager, captures: { est_after: $.data.estimated_unit_price_cents, alpha_after: $.data.delivered_alpha_pct } }
            - { call: "GET /api/pellet-lots/${pellet_id}", payload: {}, as: FarmManager, captures: { blend_after: $.data.blended_alpha_pct } }
          assert:
            - "captured est_before == 555 (provisional variant over blend 13.38: 500 + 1.38 x 40 = 555.2 -> 555)"
            - "captured blend_after == 12.75 (regrade: (500 x 12.0 + 300 x 14.0) / 800)"
            - "captured alpha_after == 12.75"
            - "captured est_after == 530 (final-flavored variant over 12.75: 500 + 0.75 x 40)"
            - "est_before != est_after (provisional and final variants diverge on identical delivery data)"

      - name: insurance_indemnity_preliminary_vs_final
        grounds:
          - calculations.indemnity_payment
          - entities.InsuranceClaim.fields.indemnity_estimate_cents
          - entities.InsuranceClaim.fields.indemnity_final_cents
        distinguishing_aspect: |
          Entity domain: crop insurance on InsuranceClaim (not pricing). The
          preliminary variant uses projected yield (72000 lbs) and yields 0
          cents; the final variant uses actual kiln-dried production (50000 lbs)
          and yields 1200000 cents for the same claim.
        test_recipe:
          setup:
            - "CASCADE 2026 plan, 40 acres, projected_yield_lbs 72000; claim filed with price election 300, default coverage 0.75 -> guarantee_lbs 54000, estimate 0"
            - "Harvest produces one DRIED lot of 50000 lbs; plan COMPLETE with actual_yield_lbs 50000; claim APPROVED"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/insurance-claims", payload: { planting_plan_id: "${p_id}", price_election_cents_per_lb: 300 }, as: FarmManager, as_user_id: "grower-1", captures: { claim_id: $.data.id, est0: $.data.indemnity_estimate_cents, guar: $.data.guarantee_lbs } }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 187500 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-09-01T06:00:00Z", kiln_window_end: "2026-09-02T06:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 50000 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/complete", payload: {}, as: FarmManager }
            - { call: "POST /api/insurance-claims/${claim_id}/begin-review", payload: {}, as: InsuranceAdjuster, as_user_id: "adjuster-9" }
            - { call: "POST /api/insurance-claims/${claim_id}/decide", payload: { outcome: "APPROVED" }, as: InsuranceAdjuster, as_user_id: "adjuster-9" }
          trigger:
            - { call: "POST /api/insurance-claims/${claim_id}/pay", payload: {}, as: InsuranceAdjuster, as_user_id: "adjuster-9", captures: { final_ind: $.data.indemnity_final_cents, st: $.data.status } }
            - { call: "GET /api/insurance-claims/${claim_id}", payload: {}, as: InsuranceAdjuster, captures: { est_after: $.data.indemnity_estimate_cents } }
          assert:
            - "captured guar == 54000 (round_half_up(40 x 1800 x 0.75))"
            - "captured est0 == 0 (preliminary variant: max(0, 54000 - 72000) x 300)"
            - "captured final_ind == 1200000 (final variant: (54000 - 50000) x 300)"
            - "captured est_after == 0 (estimate is filing-time frozen, not recomputed)"
            - "captured st == PAID"

  - rule_id: combinatorial_formula
    instances:
      - name: alpha_price_branch_and_floor
        grounds:
          - calculations.alpha_price_adjustment
        distinguishing_aspect: |
          Mode (a): a branched formula with >= 3 interacting inputs (alpha vs
          floor selects premium or discount branch; base, premium, discount,
          and MIN_PRICE floor interact). Premium branch at alpha 12.75 yields
          unit 530 and settlement 390080 for delivered 736.
        test_recipe:
          setup:
            - "Pellet lot qty 736 blended_alpha 12.75 (sources dried 500 @ FINAL 12.0 + dried 300 @ FINAL 14.0)"
            - "ACTIVE contract vol 736 base 500 floor 12.0 premium 40 discount 60; allocation allocated 736, confirmed, delivered"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1875 }, as: FarmManager, captures: { lot_a: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_a}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/finish-drying", payload: { dried_lbs: 500 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "PROVISIONAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "FINAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1125 }, as: FarmManager, captures: { lot_b: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_b}/finish-drying", payload: { dried_lbs: 300 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_b}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_b}", test_type: "PROVISIONAL", alpha_pct: 14.0 }, as: LabTechnician }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_b}", test_type: "FINAL", alpha_pct: 14.0 }, as: LabTechnician }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_a}", "${lot_b}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/contracts", payload: { brewery_name: "BrewCo", variety: "CASCADE", term_start_year: 2026, term_end_year: 2028, annual_volume_lbs: 736, base_price_cents_per_lb: 500, alpha_floor_pct: 12.0, alpha_premium_cents_per_point: 40, alpha_discount_cents_per_point: 60 }, as: ContractManager, captures: { c_id: $.data.id } }
            - { call: "POST /api/contracts/${c_id}/activate", payload: {}, as: ContractManager }
            - { call: "POST /api/allocation-runs", payload: { crop_year: 2026, variety: "CASCADE" }, as: ContractManager }
            - { call: "GET /api/allocations", payload: {}, as: ContractManager, captures: { a_id: "$.data[0].id" } }
            - { call: "POST /api/allocations/${a_id}/confirm", payload: {}, as: ContractManager }
            - { call: "POST /api/allocations/${a_id}/deliver", payload: {}, as: ContractManager }
          trigger:
            - { call: "POST /api/allocations/${a_id}/settle", payload: {}, as: ContractManager, captures: { unit: $.data.unit_price_cents, total: $.data.settlement_total_cents, dshort: $.data.delivery_shortfall_lbs } }
            - { call: "GET /api/contracts/${c_id}", payload: {}, as: ContractManager, captures: { c_status: $.data.status, c_counter: $.data.consecutive_shortfall_years } }
          assert:
            - "captured unit == 530 (premium branch: 500 + (12.75 - 12.0) x 40)"
            - "captured total == 390080 (736 x 530)"
            - "captured dshort == 0"
            - "captured c_status == ACTIVE and c_counter == 0 (fully delivered year resets the counter)"

      - name: pellet_blend_rounding_order
        grounds:
          - calculations.pellet_blend
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Pinned order
          aggregate-then-round yields qty 191 from dried 104 + 104
          (round_half_up(208 x 0.92) = 191); the forbidden per-lot-then-sum
          order yields 96 + 96 = 192. Distinct mode from
          alpha_price_branch_and_floor's mode (a).
        test_recipe:
          setup:
            - "CASCADE 2026 plan; two DRIED lots, each wet 390 dried 104 (moisture exactly 10.0), FINAL alphas 12.0 and 14.0"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 390 }, as: FarmManager, captures: { lot_a: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_a}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/finish-drying", payload: { dried_lbs: 104 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "PROVISIONAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "FINAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 390 }, as: FarmManager, captures: { lot_b: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_b}/finish-drying", payload: { dried_lbs: 104 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_b}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_b}", test_type: "PROVISIONAL", alpha_pct: 14.0 }, as: LabTechnician }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_b}", test_type: "FINAL", alpha_pct: 14.0 }, as: LabTechnician }
          trigger:
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_a}", "${lot_b}"], storage_room: "R1" }, as: FarmManager, captures: { qty: $.data.qty_lbs, alpha: $.data.blended_alpha_pct } }
          assert:
            - "captured qty == 191 (aggregate-then-round: round_half_up(208 x 0.92, 0); NOT 192 from per-lot rounding)"
            - "captured alpha == 13.0 ((104 x 12.0 + 104 x 14.0) / 208)"

  - rule_id: non_linear_state_machine
    instances:
      - name: harvest_lot_redry_cycle
        grounds:
          - state_machines.HarvestLot.MOISTURE_CHECK_to_IN_KILN
          - state_machines.HarvestLot.IN_KILN_to_MOISTURE_CHECK
          - calculations.kiln_moisture
        distinguishing_aspect: |
          Cyclic machine on HarvestLot: MOISTURE_CHECK -> IN_KILN -> MOISTURE_CHECK
          redry loop is traversed once before release; moisture is recomputed per
          cycle (14.3 then 8.7). Distinct entity from the PelletLot parallel-
          dimension instance.
        test_recipe:
          setup:
            - "CASCADE 2026 plan HARVESTING; kiln K1; lot wet 1000 loaded 08:00-12:00"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 280 }, as: FarmManager, captures: { m1: $.data.moisture_pct, s1: $.data.status } }
            - { call: "POST /api/harvest-lots/${lot_id}/redry", payload: { kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager, captures: { s2: $.data.status } }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 263 }, as: FarmManager, captures: { m2: $.data.moisture_pct, s3: $.data.status } }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager, captures: { s4: $.data.status } }
          assert:
            - "captured m1 == 14.3 and s1 == MOISTURE_CHECK (cycle entry)"
            - "captured s2 == IN_KILN (redry loops the machine back)"
            - "captured m2 == 8.7 and s3 == MOISTURE_CHECK (second pass recomputes moisture)"
            - "captured s4 == DRIED (release after the loop)"

      - name: pellet_lot_parallel_dimensions
        grounds:
          - state_machines.PelletLot.AVAILABLE_to_RESERVED
          - state_machines.PelletLotAgeClass.CURRENT_to_CARRYOVER
          - calculations.carryover_decay
        distinguishing_aspect: |
          Parallel dimensions on PelletLot: a spot-sale draft flips
          inventory_status AVAILABLE -> RESERVED while age_class stays CURRENT;
          a later rollover flips age_class CURRENT -> CARRYOVER (with alpha
          decay) without touching inventory_status. Distinct entity from the
          HarvestLot redry cycle.
        test_recipe:
          setup:
            - "Pellet lot qty 736 alpha 12.00 (single source lot dried 800, FINAL 12.0), entered_storage_at 2026-08-01T00:00:00Z (default clock)"
            - "Spot sale DRAFT holds the lot RESERVED; logical clock advanced to 2027-08-01"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /api/planting-plans", payload: { field_id: "${f_id}", crop_year: 2026, variety: "CASCADE", planned_acreage: 40 }, as: FarmManager, captures: { p_id: $.data.id } }
            - { call: "POST /api/planting-plans/${p_id}/approve", payload: {}, as: FarmManager }
            - { call: "POST /api/planting-plans/${p_id}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 3000 }, as: FarmManager, captures: { lot_id: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_id}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/finish-drying", payload: { dried_lbs: 800 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_id}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_id}", test_type: "PROVISIONAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_id}", test_type: "FINAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_id}"], storage_room: "R1" }, as: FarmManager, captures: { pellet_id: $.data.id } }
            - { call: "POST /api/spot-sales", payload: { pellet_lot_id: "${pellet_id}", buyer_name: "CraftBrew", price_cents_per_lb: 650, buyer_credit_limit_cents: 1000000 }, as: ContractManager, captures: { sale_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /api/ops/crop-year-rollover", payload: {}, as: FarmManager }
            - { call: "GET /api/pellet-lots/${pellet_id}", payload: {}, as: FarmManager, captures: { inv: $.data.inventory_status, age: $.data.age_class, alpha: $.data.blended_alpha_pct } }
          assert:
            - "captured inv == RESERVED (rollover did not disturb the inventory dimension)"
            - "captured age == CARRYOVER (age dimension flipped independently: crop_year 2026 < clock year 2027)"
            - "captured alpha == 11.3 (decay: 12.00 x 0.99^6 = 11.2978 -> 11.30; 12 months stored, 6 grace)"

  - rule_id: transitive_cascade
    instances:
      - name: lab_finalize_regrades_downstream
        grounds:
          - state_machines.HarvestLot.transitions
          - calculations.pellet_blend
          - calculations.alpha_price_adjustment
          - entities.Allocation.fields.delivered_alpha_pct
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /api/lab-tests (FINAL): LabTest mutates
          HarvestLot.alpha_pct_final (hop 1); that mutation recomputes
          PelletLot.blended_alpha_pct 13.38 -> 12.75 (hop 2); that recomputes
          Allocation.delivered_alpha_pct and estimated_unit_price_cents
          555 -> 530 on the pre-SETTLED delivered allocation (hop 3). Distinct
          trigger from the settle-driven shortfall cascade.
        test_recipe:
          setup:
            - "Same pipeline as allocation_price_provisional_vs_final: pellet 736 (blend 13.38 from provisional 13.0 lot A + final 14.0 lot B), delivered to an allocation; estimate 555"
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f_id: $.data.id } }
