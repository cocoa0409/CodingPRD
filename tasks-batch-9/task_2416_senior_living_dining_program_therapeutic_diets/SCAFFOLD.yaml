    roles: [ProgramAdministrator, ClinicalStaff, RegisteredDietitian, DiningServicesManager, ResidentRepresentative]
    code: 200
    input: ["resident_id?", "trigger_observation_id?", "status?", "outcome?", "limit?", "offset?"]
    output: PlanOfCareReview[]
    side_effects: []

  # ---------------------------------------------------------------- writes
  - method: POST
    path: "/communities"
    description: "Register a senior living community"
    roles: [ProgramAdministrator]
    code: 201
    input: [name, care_levels_offered, "guest_meal_sponsor_cap_cents?", "variance_tolerance_cents?"]
    output: Community
    side_effects: ["pending_dietitian_review_count initialised to 0", "active_menu_cycle_id initialised to null"]
  - method: POST
    path: "/venues"
    description: "Register a dining venue or satellite kitchen under a community"
    roles: [ProgramAdministrator]
    code: 201
    input: [community_id, name, venue_kind, seat_capacity, care_levels_served, "seating_turn_minutes?", "turnover_buffer_minutes?"]
    output: DiningVenue
    side_effects: ["temp_compliance_posture initialised to COMPLIANT, consecutive_temp_violation_count to 0, status to OPEN"]
  - method: POST
    path: "/residents"
    description: "Admit a resident into a community's dining program"
    roles: [ProgramAdministrator]
    code: 201
    input: [community_id, full_name, care_level, baseline_weight_kg, "allergens?", "dislikes?", "preference_strictness?"]
    output: Resident
    side_effects: ["dining_status initialised to ACTIVE, tray_card_state to CLEAR, current_weight_kg to baseline_weight_kg, every monitoring metric to its default"]
  - method: POST
    path: "/residents/{id}/dining-status"
    description: "Move a resident between ACTIVE, ON_LEAVE and DISCHARGED dining participation"
    roles: [ProgramAdministrator]
    code: 200
    input: [dining_status]
    output: Resident
    side_effects: ["recomputes calculation intake_risk_score (SEVERITY_MULTIPLIER changes with ON_LEAVE)", "DISCHARGED removes the resident from eligible_resident_count in calculation menu_refresh_index"]
  - method: POST
    path: "/diet-orders"
    description: "Clinical staff record a diet order for a resident; supersedes_order_id names the ACTIVE order this one replaces once approved"
    roles: [ClinicalStaff]
    code: 201
    input: [resident_id, texture_level, liquid_consistency, expected_resident_version, "therapeutic_codes?", "supersedes_order_id?"]
    output: DietOrder
    side_effects: ["increments Resident.version by 1", "clinical_status = PENDING_REVIEW, review_status = AWAITING_DIETITIAN, review_round = 0, ordered_by_user_id = X-User-ID", "recomputes Community.pending_dietitian_review_count"]
  - method: POST
    path: "/diet-orders/{id}/dietitian-review"
    description: "Registered dietitian record an APPROVE or REQUEST_CHANGES decision on the review_status axis"
    roles: [RegisteredDietitian]
    code: 200
    input: [decision, "reviewer_note?"]
    output: DietOrder
    side_effects: ["APPROVE: review_status -> APPROVED and clinical_status PENDING_REVIEW -> ACTIVE with activated_at stamped", "APPROVE: cascade the superseded order ACTIVE -> SUPERSEDED", "APPROVE from REREVIEW_REQUIRED: cascade Resident.tray_card_state HOLD_PENDING_REVIEW -> CLEAR", "REQUEST_CHANGES: review_round += 1, review_status -> CHANGES_REQUESTED", "recomputes Community.pending_dietitian_review_count", "recomputes calculation intake_risk_score"]
  - method: POST
    path: "/diet-orders/{id}/resubmit"
    description: "Clinical staff amend and resubmit an order that came back CHANGES_REQUESTED"
    roles: [ClinicalStaff]
    code: 200
    input: ["texture_level?", "liquid_consistency?", "therapeutic_codes?"]
    output: DietOrder
    side_effects: ["review_status CHANGES_REQUESTED -> AWAITING_DIETITIAN, review_round retained", "re-applies the texture liberalization gate", "recomputes Community.pending_dietitian_review_count"]
  - method: POST
    path: "/diet-orders/{id}/discontinue"
    description: "Clinical staff discontinue an order on the clinical_status axis, freezing review_status where it stands"
    roles: [ClinicalStaff]
    code: 200
    input: ["reason?"]
    output: DietOrder
    side_effects: ["clinical_status -> DISCONTINUED, review_status unchanged (parallel axes)", "recomputes calculation intake_risk_score (texture/therapeutic/liquid points drop to 0)", "recomputes Community.pending_dietitian_review_count"]
  - method: POST
    path: "/residents/{id}/substitution-rules"
    description: "Clinical staff add an allergy, texture or dislike substitution rule to the resident's profile"
    roles: [ClinicalStaff]
    code: 201
    input: [trigger_type, match_value, replacement_item_code, priority_rank]
    output: SubstitutionRule
    side_effects: ["status initialised to ACTIVE", "changes the outcome of calculation tray_card_resolution for this resident"]
  - method: POST
    path: "/seating-reservations"
    description: "Book a resident into a dining venue seating window; with allow_waitlist the row lands WAITLISTED instead of failing the capacity check"
    roles: [DiningServicesManager]
    code: 201
    input: [resident_id, venue_id, service_date, meal_period, seat_start_utc, party_size, expected_venue_version, "allow_waitlist?"]
    output: SeatingReservation
    side_effects: ["increments DiningVenue.version by 1", "seat_end_utc = seat_start_utc + DiningVenue.seating_turn_minutes", "runs calculations resident_meal_spacing_conflict then venue_capacity_conflict in that order"]
  - method: POST
    path: "/seating-reservations/{id}/seat"
    description: "Seat a reserved party; resolves the tray card and issues the RESIDENT meal ticket"
    roles: [DiningServicesManager]
    code: 200
    input: []
    output: SeatingReservation
    side_effects: ["status RESERVED -> SEATED, seated_at stamped", "cascade: creates a MealServiceTicket with ticket_type RESIDENT, status ISSUED and billed_amount_cents from calculation ticket_billed_amount", "runs calculation tray_card_resolution and refuses a BLOCKED tray"]
  - method: POST
    path: "/seating-reservations/{id}/release"
    description: "Release a reservation and run the waitlist promotion selector for the freed (venue_id, service_date, meal_period)"
    roles: [DiningServicesManager]
    code: 200
    input: ["reason?"]
    output: SeatingReservation
    side_effects: ["status -> RELEASED", "increments DiningVenue.version by 1", "cascade: the waitlist promotion selector may move one WAITLISTED row to RESERVED (created_at ASC winner)"]
  - method: POST
    path: "/menu-cycles"
    description: "Create a draft menu cycle for a community"
    roles: [DiningServicesManager]
    code: 201
    input: [community_id, cycle_number, week_count, effective_start_date, effective_end_date]
    output: MenuCycle
    side_effects: ["status initialised to DRAFT, refresh_round to 0, refresh_index to 0.00, refresh_tier to ADVISORY"]
  - method: POST
    path: "/menu-cycles/{id}/items"
    description: "Add a menu item to a DRAFT cycle at a (day_index, meal_period) slot"
    roles: [DiningServicesManager]
    code: 201
    input: [item_code, name, day_index, meal_period, base_texture, "allergen_tags?", "required_therapeutic_codes?"]
    output: MenuItem
    side_effects: ["extension_coverage_status set to NOT_REQUIRED when required_therapeutic_codes is empty, else INCOMPLETE"]
  - method: POST
    path: "/menu-items/{id}/therapeutic-extensions"
    description: "Author a therapeutic diet extension covering one diet_code for a menu item"
    roles: [RegisteredDietitian]
    code: 201
    input: [diet_code, "nutrient_overrides?"]
    output: TherapeuticExtension
    side_effects: ["review_status initialised to DRAFT, review_round to 0, authored_by_user_id = X-User-ID"]
  - method: POST
    path: "/therapeutic-extensions/{id}/submit"
    description: "Submit a DRAFT or CHANGES_REQUESTED extension for dietitian review"
    roles: [RegisteredDietitian]
    code: 200
    input: []
    output: TherapeuticExtension
    side_effects: ["review_status -> SUBMITTED, review_round retained"]
  - method: POST
    path: "/therapeutic-extensions/{id}/review"
    description: "Record an APPROVE or REQUEST_CHANGES decision on a SUBMITTED extension"
    roles: [RegisteredDietitian]
    code: 200
    input: [decision, "reviewer_note?"]
    output: TherapeuticExtension
    side_effects: ["APPROVE: review_status -> APPROVED", "REQUEST_CHANGES: review_round += 1, review_status -> CHANGES_REQUESTED", "cascade: recomputes MenuItem.extension_coverage_status"]
  - method: POST
    path: "/menu-cycles/{id}/submit"
    description: "Submit a DRAFT cycle for dietitian sign-off"
    roles: [DiningServicesManager]
    code: 200
    input: []
    output: MenuCycle
    side_effects: ["status DRAFT -> PENDING_DIETITIAN_SIGNOFF"]
  - method: POST
    path: "/menu-cycles/{id}/publish"
    description: "Registered dietitian sign off and publish a cycle; enforces therapeutic coverage and the PUBLISHED date-range non-overlap rule"
    roles: [RegisteredDietitian]
    code: 200
    input: []
    output: MenuCycle
    side_effects: ["status PENDING_DIETITIAN_SIGNOFF -> PUBLISHED, signed_off_by_user_id = X-User-ID", "cascade: strictly earlier PUBLISHED cycles of the community move to ARCHIVED", "recomputes Community.active_menu_cycle_id"]
  - method: POST
    path: "/menu-cycles/{id}/refresh"
    description: "Execute the committee-driven refresh of a REFRESH_PENDING cycle, returning it to DRAFT for the next menu cycle"
    roles: [DiningServicesManager]
    code: 200
    input: [refresh_reason]
    output: MenuCycle
    side_effects: ["status REFRESH_PENDING -> DRAFT, refresh_round += 1, refresh_index reset to 0.00, refresh_tier reset to ADVISORY", "cascade: SUBMITTED CommitteeFeedback of the cycle moves to ACKNOWLEDGED", "cascade: APPROVED TherapeuticExtension rows of the cycle's items move to RETIRED, which recomputes MenuItem.extension_coverage_status"]
  - method: POST
    path: "/menu-cycles/{id}/committee-feedback"
    description: "A resident food-committee member casts one ballot on a menu item of the cycle; the ballot may push the cycle into REFRESH_PENDING"
    roles: [ResidentRepresentative]
    code: 201
    input: [resident_id, menu_item_code, sentiment]
    output: CommitteeFeedback
    side_effects: ["vote_weight computed from Resident.care_level", "runs calculation menu_refresh_index and persists refresh_index and refresh_tier onto the cycle", "cascade: PUBLISHED -> REFRESH_PENDING when the index reaches the tier threshold, which recomputes Community.active_menu_cycle_id"]
  - method: POST
    path: "/meal-tickets"
    description: "Issue a meal ticket at a venue: a walk-in RESIDENT meal, a sponsored GUEST meal, or a TAKEOUT meal"
    roles: [DiningServicesManager, SatelliteKitchenLead]
    code: 201
    input: [venue_id, ticket_type, service_date, meal_period, "resident_id?", "reservation_id?"]
    output: MealServiceTicket
    side_effects: ["billed_amount_cents from calculation ticket_billed_amount", "recomputes Resident.guest_meal_charge_balance_cents when resident_id is supplied", "enforces the venue posture gate and the sponsorship cap"]
  - method: POST
    path: "/meal-tickets/{id}/serve"
    description: "Mark an issued ticket served; completes the linked seating when there is one"
    roles: [DiningServicesManager, SatelliteKitchenLead]
    code: 200
    input: []
    output: MealServiceTicket
    side_effects: ["status ISSUED -> SERVED", "cascade: a linked SEATED reservation moves to COMPLETED and leaves calculation venue_committed_seats"]
  - method: POST
    path: "/meal-tickets/{id}/void"
    description: "Void a ticket; a void of an already BILLED ticket becomes a chargeback credit against a later reconciliation"
    roles: [BillingSpecialist]
    code: 200
    input: ["void_reason?"]
    output: MealServiceTicket
    side_effects: ["voided_amount_cents = billed_amount_cents before the write, billed_amount_cents = 0", "recomputes Resident.guest_meal_charge_balance_cents", "cascade hop 2: a linked SEATED/COMPLETED reservation moves to RELEASED", "cascade hop 3: the waitlist promotion selector runs for the freed (venue_id, service_date, meal_period)"]
  - method: POST
    path: "/reconciliations"
    description: "Reconcile meal counts for a community over a closed service-date period; computes both variants and the whole fee waterfall"
    roles: [BillingSpecialist]
    code: 201
    input: [community_id, period_start_date, period_end_date]
    output: BillingReconciliation
    side_effects: ["runs both variants of calculation meal_count_reconciliation and stores variance_cents", "runs calculation reconciliation_net_billable in its pinned step order", "status initialised to RECONCILED"]
  - method: POST
    path: "/reconciliations/{id}/finalize"
    description: "Finalize a reconciliation, closing the period and billing every served ticket inside it"
    roles: [BillingSpecialist]
    code: 200
    input: ["variance_note?"]
    output: BillingReconciliation
    side_effects: ["status RECONCILED -> FINALIZED, finalized_by_user_id = X-User-ID", "re-runs both variants and refuses on drift with ERR_RECONCILIATION_STALE", "cascade: SERVED tickets inside the period move to BILLED with billed_reconciliation_id set"]
  - method: POST
    path: "/venues/{id}/temperature-logs"
    description: "Satellite kitchen lead log a probe reading; drives the venue's food-safety posture ladder"
    roles: [SatelliteKitchenLead]
    code: 201
    input: [probe_point, temperature_f, "corrective_action_code?"]
    output: TemperatureLog
    side_effects: ["runs calculation temperature_posture: in_range, consecutive_temp_violation_count and violation_sequence_index", "cascade: posture may escalate to WATCH or SUSPENDED, or reset to COMPLIANT", "cascade hop 3 on escalation to SUSPENDED: future RESERVED reservations of the venue move to WAITLISTED with suspension_hold = true"]
  - method: POST
    path: "/residents/{id}/intake-observations"
    description: "Record a meal intake observation, optionally carrying a weight; head of the four-hop monitoring cascade"
    roles: [ClinicalStaff]
    code: 201
    input: [observation_date, meal_period, intake_pct, "weight_kg?"]
    output: IntakeObservation
    side_effects: ["cascade hop 1: recomputes both variants of calculation resident_weight_trend, avg_intake_pct_7d, current_weight_kg and intake_risk_score", "cascade hop 2: opens a PlanOfCareReview when calculation plan_of_care_trigger breaches and no OPEN review exists", "cascade hop 3: the resident's ACTIVE DietOrder moves review_status APPROVED -> REREVIEW_REQUIRED", "cascade hop 4: ACTIVE TEXTURE substitution rules of the resident flip to SUPERSEDED and Resident.tray_card_state CLEAR -> HOLD_PENDING_REVIEW"]
  - method: POST
    path: "/plan-of-care-reviews/{id}/complete"
    description: "Registered dietitian close an OPEN plan-of-care review with one of three outcomes, each firing a different side-effect set"
    roles: [RegisteredDietitian]
    code: 200
    input: [outcome, "note?"]
    output: PlanOfCareReview
    side_effects: ["status OPEN -> COMPLETED, completed_by_user_id = X-User-ID", "NO_CHANGE: no cross-entity mutation", "DIET_ORDER_REREVIEW: the ACTIVE DietOrder is forced to REREVIEW_REQUIRED and Resident.tray_card_state -> HOLD_PENDING_REVIEW", "ESCALATED: Resident.tray_card_state -> BLOCKED and no DietOrder mutation"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to wall-clock time."
    roles: [ProgramAdministrator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["every window, threshold and stamping rule reads the new logical clock"]

errors:
  # --- authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the seven declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed on the endpoint, or a ResidentRepresentative addresses a resident other than the one its X-User-ID resolves to"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewing/completing X-User-ID equals the authoring X-User-ID (DietOrder.ordered_by_user_id, TherapeuticExtension.authored_by_user_id, or the trigger IntakeObservation.recorded_by_user_id)"
  # --- request shape
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong JSON type, enum value outside the declared set, number outside the declared range, malformed date/datetime, service_date not equal to the UTC date of seat_start_utc, or an inverted date range"
  # --- existence
  - id: ERR_COMMUNITY_NOT_FOUND
    http: 404
    condition: "community id in the path or body does not resolve"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue id in the path or body does not resolve"
  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    condition: "resident id in the path or body does not resolve"
  - id: ERR_DIET_ORDER_NOT_FOUND
    http: 404
    condition: "diet order id in the path or a supplied supersedes_order_id does not resolve"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "seating reservation id in the path or a supplied reservation_id does not resolve"
  - id: ERR_MENU_CYCLE_NOT_FOUND
    http: 404
    condition: "menu cycle id in the path or body does not resolve"
  - id: ERR_MENU_ITEM_NOT_FOUND
    http: 404
    condition: "menu item id in the path does not resolve"
  - id: ERR_EXTENSION_NOT_FOUND
    http: 404
    condition: "therapeutic extension id in the path does not resolve"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "meal service ticket id in the path does not resolve"
  - id: ERR_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "billing reconciliation id in the path does not resolve"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "plan-of-care review id in the path does not resolve"
  - id: ERR_OBSERVATION_NOT_FOUND
    http: 404
    condition: "intake observation id supplied as trigger_observation_id does not resolve"
  # --- referential integrity
  - id: ERR_CROSS_COMMUNITY_REFERENCE
    http: 422
    condition: "Two referenced rows belong to different communities, or a care level is outside the community's care_levels_offered"
  - id: ERR_LINKED_RESOURCE_MISMATCH
    http: 422
    condition: "A supplied link points at a row belonging to a different subject (reservation of another resident or venue, supersedes_order_id of another resident, trigger observation of another resident, DISLIKE rule replacing an item with itself)"
  - id: ERR_MENU_ITEM_NOT_IN_CYCLE
    http: 422
    condition: "CommitteeFeedback.menu_item_code does not match any MenuItem.item_code of the addressed menu cycle"
  # --- state / concurrency
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The addressed entity is not in a state from which the requested §1.2 transition exists, including a second attempt at an already-applied transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_resident_version or expected_venue_version does not equal the parent's current version (§1.2.1)"
  # --- food-safety and clinical safety
  - id: ERR_VENUE_SERVICE_SUSPENDED
    http: 409
    condition: "The venue's status is CLOSED or its temp_compliance_posture is SUSPENDED"
  - id: ERR_VENUE_POSTURE_RESTRICTED
    http: 409
    condition: "A GUEST or TAKEOUT ticket is issued while the venue's temp_compliance_posture is WATCH"
  - id: ERR_UNSAFE_TRAY_NO_SUBSTITUTION
    http: 422
    condition: "Seating is attempted while the resolved tray card is BLOCKED (an unresolved allergen line, a pending therapeutic extension line, or Resident.tray_card_state == BLOCKED)"
  - id: ERR_TEXTURE_REQUIRES_DIETITIAN
    http: 422
    condition: "A texture liberalization (lower TEXTURE_RANK than the resident's ACTIVE order) is ordered or resubmitted while the resident has an OPEN PlanOfCareReview"
  - id: ERR_DIET_ORDER_NOT_VERIFIED
    http: 409
    condition: "The resident has no DietOrder with clinical_status == ACTIVE and review_status == APPROVED where one is required, or a DIET_ORDER_REREVIEW outcome is recorded with no ACTIVE order"
  - id: ERR_RESIDENT_NOT_ACTIVE
    http: 409
    condition: "Resident.dining_status is not ACTIVE where ACTIVE is required, or is DISCHARGED where a clinical write is attempted"
  - id: ERR_CARE_LEVEL_NOT_SERVED
    http: 422
    condition: "Resident.care_level is not a member of DiningVenue.care_levels_served"
  - id: ERR_NO_PUBLISHED_MENU_CYCLE
    http: 409
    condition: "No PUBLISHED MenuCycle of the resident's community covers the requested service_date"
  # --- temporal
  - id: ERR_OBSERVATION_FUTURE_DATE
    http: 422
    condition: "observation_date or service_date lies after the logical clock date"
  - id: ERR_RESIDENT_MEAL_SPACING
    http: 409
    condition: "The candidate seating violates MIN_MEAL_GAP_MINUTES against another RESERVED/SEATED/COMPLETED reservation of the same resident (closed intervals, both sides)"
  - id: ERR_MENU_CYCLE_DATE_OVERLAP
    http: 409
    condition: "Publishing a cycle whose closed effective range intersects another PUBLISHED cycle of the same community"
  # --- constraints
  - id: ERR_DUPLICATE_ITEM_CODE
    http: 409
    condition: "item_code already used by another MenuItem of the same MenuCycle"
  - id: ERR_DUPLICATE_BALLOT
    http: 409
    condition: "A SUBMITTED CommitteeFeedback already exists for the same (menu_cycle_id, resident_id, menu_item_code)"
  - id: ERR_THERAPEUTIC_COVERAGE_INCOMPLETE
    http: 409
    condition: "Publishing a cycle in which some MenuItem with required_therapeutic_codes has extension_coverage_status != COMPLETE"
  - id: ERR_REVIEW_ROUND_LIMIT
    http: 409
    condition: "A REQUEST_CHANGES decision is recorded when review_round already equals MAX_DIET_REVIEW_ROUNDS or MAX_EXTENSION_REVIEW_ROUNDS"
  # --- capacity and money
  - id: ERR_VENUE_CAPACITY_EXCEEDED
    http: 409
    condition: "The overlapping conflict set plus the candidate party_size exceeds DiningVenue.seat_capacity and allow_waitlist is false"
  - id: ERR_PERIOD_CLOSED
    http: 409
    condition: "A ticket is issued for a service_date already inside a FINALIZED reconciliation period, or a new reconciliation period intersects a FINALIZED period of the same community"
  - id: ERR_SPONSOR_LIMIT_EXCEEDED
    http: 402
    condition: "Resident.guest_meal_charge_balance_cents plus the new GUEST/TAKEOUT billed_amount_cents exceeds Community.guest_meal_sponsor_cap_cents"
  - id: ERR_RECONCILIATION_STALE
    http: 409
    condition: "Recomputation at finalize time no longer reproduces the stored variant totals or net_billable_total_cents"
  - id: ERR_VARIANCE_UNRESOLVED
    http: 409
    condition: "abs(variance_cents) exceeds Community.variance_tolerance_cents and no variance_note was supplied at finalize"

roles:
  - name: ProgramAdministrator
    description: "Dining program administrator: sets up communities, venues and residents, moves residents between dining participation states, and owns the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /communities"
      - "POST /venues"
      - "POST /residents"
      - "POST /residents/{id}/dining-status"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET except the billing reads it also holds exclusively with BillingSpecialist and DiningServicesManager"
  - name: ClinicalStaff
    description: "Nurses and clinical staff who originate diet orders, maintain allergy/preference substitution rules, and record intake and weight observations"
    identity: opaque
    exclusive_operations:
      - "POST /diet-orders"
      - "POST /diet-orders/{id}/resubmit"
      - "POST /diet-orders/{id}/discontinue"
      - "POST /residents/{id}/substitution-rules"
      - "POST /residents/{id}/intake-observations"
    shared_operations:
      - "clinical and dining GETs (residents, diet orders, tray cards, reservations, menu cycles, seat availability)"
  - name: RegisteredDietitian
    description: "Dietitian who reviews diet orders, authors and reviews therapeutic menu extensions, signs off menu cycles, and closes plan-of-care reviews; never authors the artifact being reviewed"
    identity: opaque
    exclusive_operations:
      - "POST /diet-orders/{id}/dietitian-review"
      - "POST /menu-items/{id}/therapeutic-extensions"
      - "POST /therapeutic-extensions/{id}/submit"
      - "POST /therapeutic-extensions/{id}/review"
      - "POST /menu-cycles/{id}/publish"
      - "POST /plan-of-care-reviews/{id}/complete"
    shared_operations:
      - "clinical, menu and dining GETs"
  - name: DiningServicesManager
    description: "Dining services manager who builds menu cycles, runs the reservation book, seats residents, and executes committee-driven menu refreshes"
    identity: opaque
    exclusive_operations:
      - "POST /menu-cycles"
      - "POST /menu-cycles/{id}/items"
      - "POST /menu-cycles/{id}/submit"
      - "POST /menu-cycles/{id}/refresh"
      - "POST /seating-reservations"
      - "POST /seating-reservations/{id}/seat"
      - "POST /seating-reservations/{id}/release"
    shared_operations:
      - "POST /meal-tickets and POST /meal-tickets/{id}/serve (with SatelliteKitchenLead)"
      - "all dining, menu, ticket and reconciliation GETs"
  - name: SatelliteKitchenLead
    description: "Satellite kitchen lead responsible for hot/cold holding and reheat temperature compliance at their venue, and for issuing and serving tickets there"
    identity: opaque
    exclusive_operations:
      - "POST /venues/{id}/temperature-logs"
    shared_operations:
      - "POST /meal-tickets and POST /meal-tickets/{id}/serve (with DiningServicesManager)"
      - "venue, tray-card, reservation and ticket GETs"
  - name: BillingSpecialist
    description: "Billing specialist who reconciles meal counts to billing, finalizes periods, and voids tickets (including chargebacks against already-billed tickets)"
    identity: opaque
    exclusive_operations:
      - "POST /meal-tickets/{id}/void"
      - "POST /reconciliations"
      - "POST /reconciliations/{id}/finalize"
    shared_operations:
