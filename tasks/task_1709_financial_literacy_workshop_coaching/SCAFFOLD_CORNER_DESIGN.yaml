# =============================================================================
# Task 1709 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Sections/claim_types follow references/claim-extraction-guide.md.
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: participant_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Participant.fields.status, entities.Participant.fields.no_show_count]
        distinguishing_aspect: "A new participant starts ACTIVE with no_show_count 0 without the client sending either."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "D One", email: "d1@x.org", annual_income_cents: 1500000 }, as: ProgramAdmin, captures: { pid: "$.data.id", pst: "$.data.status", pns: "$.data.no_show_count" } }
          trigger: []
          assert:
            - "pst == ACTIVE"
            - "pns == 0"

      - name: participant_create_missing_required_email_returns_400
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required input field email yields ERR_INVALID_REQUEST (400), not a 409-class error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /participants", payload: { full_name: "No Email", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: outcome_snapshot_immutable_common_fields_absent
        claim_type: immutability
        grounds: [entities.OutcomeSnapshot]
        distinguishing_aspect: "OutcomeSnapshot has common_fields false: its create response carries id and created_at but no version and no updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["participant exists"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "Snap P", email: "snap@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pid: "$.data.id" } }
          trigger:
            - { call: "POST /outcome-snapshots", payload: { participant_id: "${pid}", recorded_at: "2026-08-01T00:00:00Z", credit_score: 640 }, as: ProgramAdmin }
          assert:
            - "response data has id and created_at"
            - "response data has NO version field and NO updated_at field"

      - name: registration_create_computed_incentive_input_ignored
        claim_type: computed_fields
        grounds: [entities.Registration.fields.incentive_earned_cents]
        distinguishing_aspect: "Client-supplied incentive_earned_cents is ignored; a fresh registration reports the computed 0."
        test_recipe:
          setup: ["module, certified coach, workshop (2026-08-10), participant"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "IG-100", title: "Intro", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CI", email: "ci@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PI", email: "pi@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 5 }, as: ProgramAdmin, captures: { ws: "$.data.id" } }
          trigger:
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${pi}", incentive_earned_cents: 99999 }, as: ProgramAdmin, captures: { inc: "$.data.incentive_earned_cents", rst: "$.data.status" } }
          assert:
            - "inc == 0   # computed field; client input ignored"
            - "rst == REGISTERED"

      - name: workshop_create_end_before_start_returns_400
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.Workshop.fields.end_at
        distinguishing_aspect: "end_at <= start_at is a request-shape violation (400), detected before any overlap logic runs."
        test_recipe:
          setup: ["module and certified coach exist"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "EB-100", title: "EB", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CEB", email: "ceb@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T10:00:00Z", capacity: 5 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: duplicate_participant_email_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=18]
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Second participant with the same email fails ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["one participant with email dup@x.org"]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "First", email: "dup@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /participants", payload: { full_name: "Second", email: "dup@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DUPLICATE_EMAIL"

      - name: duplicate_module_code_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=19]
          - errors[ERR_MODULE_CODE_TAKEN]
        distinguishing_aspect: "Second module with the same module_code fails ERR_MODULE_CODE_TAKEN (409)."
        test_recipe:
          setup: ["one module BF-100 exists"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "BF-100", title: "First", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /curriculum-modules", payload: { module_code: "BF-100", title: "Second", session_count: 2, incentive_cents_per_hour: 600, completion_bonus_cents: 100, completion_threshold: 2 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MODULE_CODE_TAKEN"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: registration_initial_state_registered_when_seat_free
        claim_type: initial_state
        grounds: [state_machines.Registration]
        distinguishing_aspect: "With capacity available, a new registration's initial state is REGISTERED and confirmed_count rises to 1."
        test_recipe:
          setup: ["module, certified coach, capacity-3 workshop on 2026-08-10, participant"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "IS-100", title: "IS", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CIS", email: "cis@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PIS", email: "pis@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 3 }, as: ProgramAdmin, captures: { ws: "$.data.id" } }
          trigger:
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${pi}" }, as: ProgramAdmin, captures: { rst: "$.data.status" } }
            - { call: "GET /workshops/${ws}", payload: {}, as: ProgramAdmin, captures: { conf: "$.data.confirmed_count" } }
          assert:
            - "rst == REGISTERED"
            - "conf == 1"

      - name: case_intake_to_plan_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CoachingCase.transitions
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "INTAKE -> PLAN_ACTIVE skips PLAN_DRAFT and is not in the transition table: ERR_INVALID_TRANSITION."
        test_recipe:
          setup: ["certified coach, participant, case at INTAKE"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "CIV", email: "civ@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PIV", email: "piv@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${pi}", coach_id: "${co}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { cid: "$.data.id" } }
          trigger:
            - { call: "POST /coaching-cases/${cid}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_TRANSITION"

      - name: cancelled_registration_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Registration]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel AND a mark-attendance both fail ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["registration created then cancelled"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "TL-100", title: "TL", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CTL", email: "ctl@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PTL", email: "ptl@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 3 }, as: ProgramAdmin, captures: { ws: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${pi}" }, as: ProgramAdmin, captures: { rid: "$.data.id" } }
            - { call: "POST /registrations/${rid}/cancel", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /registrations/${rid}/cancel", payload: {}, as: ProgramAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /registrations/${rid}/mark-attendance", payload: { outcome: "ATTENDED" }, as: ProgramAdmin, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_INVALID_STATE"
            - "err2 == ERR_INVALID_STATE"

      - name: referral_lazy_expiry_at_exactly_30_days
        claim_type: valid_transition
        grounds: [state_machines.Referral.SENT_to_EXPIRED, calculations.referral_expiry]
        distinguishing_aspect: "A SENT referral read at logical_now == expires_at (sent 2026-08-01 + 30d = 2026-08-31) is EXPIRED (>= boundary), and a later ACCEPTED transition is rejected."
        test_recipe:
          setup: ["certified coach, participant, referral created at default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "CRE", email: "cre@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PRE", email: "pre@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /referrals", payload: { participant_id: "${pi}", coach_id: "${co}", partner_name: "CommBank", partner_type: "LENDER" }, as: ProgramAdmin, captures: { rid: "$.data.id", exp: "$.data.expires_at" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /referrals/${rid}", payload: {}, as: ProgramAdmin, captures: { rst: "$.data.status" } }
            - { call: "POST /referrals/${rid}/transition", payload: { target_state: "ACCEPTED" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "exp == 2026-08-31T00:00:00Z"
            - "rst == EXPIRED   # lazy sweep at exactly expires_at"
            - "err == ERR_INVALID_TRANSITION"

      - name: workshop_cancel_cascades_without_promotion
        claim_type: side_effect_execution
        grounds: [state_machines.Workshop.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling the workshop itself cancels REGISTERED and WAITLISTED registrations and zeroes confirmed_count; unlike a seat-freeing cancel, NO promotion runs."
        test_recipe:
          setup: ["capacity-1 workshop: P1 REGISTERED, P2 WAITLISTED"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "WC-100", title: "WC", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CWC", email: "cwc@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PWC1", email: "pwc1@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "PWC2", email: "pwc2@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm Z", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 1 }, as: ProgramAdmin, captures: { ws: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${p1}" }, as: ProgramAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${p2}" }, as: ProgramAdmin, captures: { r2: "$.data.id" } }
          trigger:
            - { call: "POST /workshops/${ws}/cancel", payload: {}, as: ProgramAdmin }
            - { call: "GET /registrations/${r1}", payload: {}, as: ProgramAdmin, captures: { s1: "$.data.status" } }
            - { call: "GET /registrations/${r2}", payload: {}, as: ProgramAdmin, captures: { s2: "$.data.status" } }
            - { call: "GET /workshops/${ws}", payload: {}, as: ProgramAdmin, captures: { conf: "$.data.confirmed_count", wst: "$.data.status" } }
          assert:
            - "wst == CANCELLED"
            - "s1 == CANCELLED"
            - "s2 == CANCELLED   # NOT promoted — the workshop is gone"
            - "conf == 0"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: match_tier_boundary_income_exactly_at_threshold
        claim_type: constants_applied
        grounds: [calculations.match_accrual, entities.MatchPool.fields.income_threshold_cents]
        distinguishing_aspect: "Income exactly == income_threshold_cents selects the >= branch (ratio 0.25), so a 40000 deposit accrues exactly 10000, not 20000."
        test_recipe:
          setup: ["pool (threshold 3000000, ratios 0.5/0.25, cap 100000, total 1000000); participant income 3000000; case PLAN_ACTIVE with ACTIVE plan; enrollment ACTIVE (goal 500000)"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "CTB", email: "ctb@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PTB", email: "ptb@x.org", annual_income_cents: 3000000 }, as: ProgramAdmin, captures: { pi: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${pi}", coach_id: "${co}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { cid: "$.data.id" } }
            - { call: "POST /coaching-cases/${cid}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { cv: "$.data.version" } }
            - { call: "POST /goal-plans", payload: { case_id: "${cid}", monthly_savings_goal_cents: 20000, credit_score_target: 650, expected_case_version: "${cv}" }, as: ProgramAdmin, captures: { pl: "$.data.id" } }
            - { call: "POST /coaching-cases/${cid}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin }
            - { call: "POST /match-pools", payload: { name: "Pool T", total_funded_cents: 1000000, income_threshold_cents: 3000000, match_ratio_below: 0.5, match_ratio_above: 0.25, per_participant_cap_cents: 100000 }, as: ProgramAdmin, captures: { pool: "$.data.id" } }
            - { call: "POST /match-enrollments", payload: { participant_id: "${pi}", pool_id: "${pool}", goal_plan_id: "${pl}", savings_goal_cents: 500000 }, as: ProgramAdmin, captures: { enr: "$.data.id" } }
          trigger:
            - { call: "POST /match-enrollments/${enr}/deposits", payload: { amount_cents: 40000 }, as: ProgramAdmin, captures: { acc: "$.data.accrued_unpaid_cents" } }
          assert:
            - "acc == 10000   # 0.25 x 40000; the < branch (0.5) would give 20000"

      - name: funder_report_empty_period_returns_null_averages
        claim_type: correct_result
        grounds: [calculations.funder_outcome_aggregation, entities.FunderReport.fields.avg_credit_delta_points]
        distinguishing_aspect: "Empty inclusion set: participants_measured 0 and BOTH averages are null (not 0) — empty-set edge of the aggregation."
        test_recipe:
          setup: ["no cases or snapshots exist for period 2026-01-01..2026-02-01 (only an unrelated module created)"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "NR-100", title: "NR", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /funder-reports", payload: { period_start: "2026-01-01", period_end: "2026-02-01", variant: "ROLLING" }, as: ProgramAdmin, captures: { n: "$.data.participants_measured", acr: "$.data.avg_credit_delta_points", asv: "$.data.avg_savings_delta_cents", cc: "$.data.completions_count" } }
          assert:
            - "n == 0"
            - "acr == null"
            - "asv == null"
            - "cc == 0"

      - name: waitlist_promotion_skips_restricted_participant
        claim_type: input_set_filtering
        grounds: [calculations.waitlist_promotion]
        distinguishing_aspect: "The promotion selector skips the lowest-position WAITLISTED entry when that participant is RESTRICTED and promotes the next eligible position instead."
        test_recipe:
          setup:
            - "Module; certified coach; workshop T 2026-08-10 10:00 capacity 1; P1 REGISTERED on T; P2 WAITLISTED pos 1; P3 WAITLISTED pos 2"
            - "P2 then racks up 3 NO_SHOWs on workshops 08-02/03/04 and becomes RESTRICTED (clock advanced to 2026-08-05 for marking)"
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "SK-100", title: "SK", session_count: 3, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CSK", email: "csk@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
            - { call: "POST /coaches/${co}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PSK1", email: "psk1@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "PSK2", email: "psk2@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "PSK3", email: "psk3@x.org", annual_income_cents: 1000000 }, as: ProgramAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm T", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 1 }, as: ProgramAdmin, captures: { wt: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm N", start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { n1: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm N", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { n2: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod}", coach_id: "${co}", location: "Rm N", start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { n3: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${wt}", participant_id: "${p1}" }, as: ProgramAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${wt}", participant_id: "${p2}" }, as: ProgramAdmin, captures: { r2: "$.data.id", r2s: "$.data.status", r2p: "$.data.waitlist_position" } }
            - { call: "POST /registrations", payload: { workshop_id: "${wt}", participant_id: "${p3}" }, as: ProgramAdmin, captures: { r3: "$.data.id", r3p: "$.data.waitlist_position" } }
            - { call: "POST /registrations", payload: { workshop_id: "${n1}", participant_id: "${p2}" }, as: ProgramAdmin, captures: { x1: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${n2}", participant_id: "${p2}" }, as: ProgramAdmin, captures: { x2: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${n3}", participant_id: "${p2}" }, as: ProgramAdmin, captures: { x3: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /registrations/${x1}/mark-attendance", payload: { outcome: "NO_SHOW" }, as: ProgramAdmin }
            - { call: "POST /registrations/${x2}/mark-attendance", payload: { outcome: "NO_SHOW" }, as: ProgramAdmin }
            - { call: "POST /registrations/${x3}/mark-attendance", payload: { outcome: "NO_SHOW" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /registrations/${r1}/cancel", payload: {}, as: ProgramAdmin }
            - { call: "GET /registrations/${r2}", payload: {}, as: ProgramAdmin, captures: { r2_after: "$.data.status" } }
            - { call: "GET /registrations/${r3}", payload: {}, as: ProgramAdmin, captures: { r3_after: "$.data.status" } }
          assert:
            - "r2s == WAITLISTED and r2p == 1 and r3p == 2"
            - "r2_after == WAITLISTED   # RESTRICTED participant skipped by the selector"
            - "r3_after == REGISTERED   # next eligible position promoted"

      - name: session_incentive_precision_covered
        claim_type: precision
        grounds: [calculations.session_incentive]
        excluded_because:
          difficulty_instance: session_incentive_per_line_rounding_order
          rationale: "Per-line round_half_up then sum is asserted there with 983/1966 literals."

      - name: coach_caseload_excludes_stalled_cases
        claim_type: input_set_filtering
        grounds: [calculations.caseload_count]
        excluded_because:
          difficulty_instance: coach_suspend_stalls_case_plan_enrollment
          rationale: "active_caseload == 0 after the stall cascade is asserted there."

