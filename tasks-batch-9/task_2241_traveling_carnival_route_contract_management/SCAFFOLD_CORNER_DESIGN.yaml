      - name: a_second_full_exclusive_deal_on_an_overlapping_venue_window_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=83]
          - errors[ERR_EXCLUSIVITY_CONFLICT]
          - entities.Contract.fields.exclusivity
          - state_machines.Contract.transitions.SENT_to_EXECUTED.preconditions
        distinguishing_aspect: |
          Exclusivity is scoped to the Venue and to the operating window, not to the Route: two independent routes
          book the same fairground on overlapping [open_date, close_date] windows, and because both contracts
          carry exclusivity FULL the second execute fails with ERR_EXCLUSIVITY_CONFLICT (409). The blocked
          contract stays SENT, its stop stays PLANNED, and the second route's guarantee ledger stays 0.
