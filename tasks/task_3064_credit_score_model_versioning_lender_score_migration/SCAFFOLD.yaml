  # --- MigrationEvent -------------------------------------------------------
  - method: POST
    path: "/migration-events"
    description: "Record a lender migration step and, for RECALIBRATED, compute both cutoff recalibrations"
    roles: [ComplianceOfficer, ModelDeveloper]
    code: 201
    input:
      - lender_code
      - from_score_variant_id
      - to_score_variant_id
      - event_type
      - evidence_ref
      - old_cutoff_score?
      - carried_decision_reason_code_id?
    output: "{ migration_event_id: string, credited_delta_bps: integer, new_cutoff_score_preserving: integer, new_cutoff_odds_preserving: integer, cutoff_disagreement_points: integer }"
    side_effects:
      - "event_type RECALIBRATED computes §1.3 cutoff_recalibration and returns both cutoffs plus cutoff_disagreement_points"
      - "for RECALIBRATED and MIGRATED the earliest unconsumed eligible event for the same lender_code and consumer is consumed by the next matching posting; credited_delta_bps is computed as to_score_variant.ref_score - from_score_variant.ref_score"
      - "the void compensating action subtracts exactly credited_delta_bps from the consuming licence, so the pre-event window_outcome_mixture_ratio_ppm is restored"
      - "a carried reason code must belong to a variant of the same model family as to_score_variant_id"

  - method: GET
    path: "/migration-events/{migrationEventId}"
    description: "Get a migration event"
    roles: [BureauAdministrator, ModelDeveloper, ValidationAnalyst, ComplianceOfficer, FairLendingOfficer, ScoreConsumer]
    code: 200
