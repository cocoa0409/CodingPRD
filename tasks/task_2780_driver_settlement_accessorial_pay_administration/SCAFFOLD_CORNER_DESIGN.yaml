      - name: revise_creates_a_draft_successor_and_blocks_a_second_revision
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /driver-pay/pay-packages/{id}/revise]
          - validations[priority=19]
          - errors[ERR_PAY_PACKAGE_REVISION_PENDING]
          - entities.PayPackage.fields.supersedes_pay_package_id
          - state_machines.PayPackage.ACTIVE_to_RETIRED
        distinguishing_aspect: |
          Revise has three distinct side effects that must all land: a new DRAFT package pointing back through
          supersedes_pay_package_id, has_pending_revision true on the predecessor, and a version bump on the
          predecessor. While that revision is outstanding a second revise is refused with
          ERR_PAY_PACKAGE_REVISION_PENDING at 409 even though the expected version is current - so the rejection
          is the pending-revision guard and not the stale-version guard. Activating the successor then retires
          the predecessor and clears the flag.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "ACTIVE package PKG_REV with PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "the caller has just read PKG_REV and holds its current version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Revision Chain", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_rev: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_rev}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_rev}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_rev}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "GET /driver-pay/pay-packages/${pkg_rev}"
              payload: {}
              as: PayrollAdmin
              captures: { pkg_rev_v: $.data.version }
          trigger:
            - call: "POST /driver-pay/pay-packages/${pkg_rev}/revise"
              payload: { expected_pay_package_version: "${pkg_rev_v}", name: "Leased Revision Chain v2", escrow_target_cents: 300000 }
              as: PayrollAdmin
              captures: { pkg_rev2: $.data.id }
            - call: "GET /driver-pay/pay-packages/${pkg_rev}"
              payload: {}
              as: PayrollAdmin
              captures: { pkg_rev_v2: $.data.version }
            - call: "POST /driver-pay/pay-packages/${pkg_rev}/revise"
              payload: { expected_pay_package_version: "${pkg_rev_v2}", name: "Leased Revision Chain v3" }
              as: PayrollAdmin
              captures: { err_rev: $.data.error_id }
            - call: "POST /driver-pay/pay-packages/${pkg_rev2}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 62, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_rev2}/activate"
              payload: {}
              as: PayrollAdmin
          assert:
            - "the revise returns HTTP 201 and PayPackage.${pkg_rev2}.status == DRAFT"
            - "PayPackage.${pkg_rev2}.supersedes_pay_package_id == ${pkg_rev} and escrow_target_cents == 300000"
            - "PayPackage.${pkg_rev}.has_pending_revision == true and PayPackage.${pkg_rev}.status is still ACTIVE"
            - "the second revise returns HTTP 409 with error_id ERR_PAY_PACKAGE_REVISION_PENDING"
            - "the second revise does not return ERR_STALE_PAY_PACKAGE_VERSION because ${pkg_rev_v2} was just read"
            - "after the successor is activated PayPackage.${pkg_rev}.status == RETIRED and has_pending_revision == false"
            - "PayPackage.${pkg_rev2}.status == ACTIVE and PayPackage.${pkg_rev2}.component_count == 1"
      - name: the_same_identity_may_not_approve_what_it_prepared_or_pay_what_it_approved
        claim_type: conditional_action
        grounds:
          - validations[priority=30]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /driver-pay/settlements/{id}/approve]
          - endpoints[POST /driver-pay/settlements/{id}/pay]
          - entities.Settlement.fields.prepared_by_user_id
        distinguishing_aspect: |
          Priority 30 is an identity check, not a role check, so it must be probed with a role that is permitted
          on the endpoint: admin-01 acting as PayrollAdmin is allowed to approve, yet it prepared this settlement
          and is refused with ERR_SEGREGATION_OF_DUTIES at 409. approver-01 then approves, and the same identity
          acting as PayrollAdmin is refused on /pay for the mirror-image reason before admin-02 pays it. Three
