              as: Estimator
              as_user_id: "est-001"
              captures: { dl_a_id: $.data.id }
            - call: "POST /repair-orders/${ro_a_id}/estimate-lines"
              payload: { damage_line_id: "${dl_a_id}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-001"
              captures: { el_a1_id: $.data.id }
            - call: "POST /repair-orders/${ro_a_id}/estimate-lines"
