            - call: "POST /warranty/goodwill-authorizations/${ga_id}/decision"
              payload: { action: "APPROVE", approved_amount_cents: 40000 }
              as: AdjudicationManager
              as_user_id: "mgr-user-1"
          trigger:
            - call: "POST /warranty/goodwill-authorizations/${ga_id}/decision"
              payload: { action: "DENY", denial_reason: "Reconsidered after the fact by the original requester." }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
          assert:
            - "the conflict call returns HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES (priority 25), NOT 409 ERR_GOODWILL_INVALID_STATE (priority 40)"
            - "GoodwillAuthorization.${ga_id} is unchanged: status APPROVED, approved_amount_cents 40000, decided_by_user_id mgr-user-1, denial_reason null, version not incremented"
            - "control - the same body from an uninvolved adjudicator: POST /warranty/goodwill-authorizations/${ga_id}/decision with {action: DENY, denial_reason: ...} as ClaimAdjudicator adj-user-2 returns HTTP 409 with error_id == ERR_GOODWILL_INVALID_STATE, proving rule 40 is reachable"
            - "fixture sanity: GoodwillAuthorization.${ga_id}.adjudicator_limit_cents == 40000, manager_limit_cents == 48000, out_of_warranty_margin_pct == 0.1000 and requested_by_user_id == adj-user-1"

  # =====================================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: coverage_mileage_limit_exact_boundary_36000_versus_36001
        grounds:
          - calculations.claim_coverage_determination
          - entities.Vehicle.fields.basic_miles
          - entities.Vehicle.fields.in_service_odometer
          - entities.WarrantyClaim.fields.coverage_type
          - calculations.claim_edit_engine
        distinguishing_aspect: |
          The mileage limit is INCLUSIVE: an odometer of exactly in_service_odometer + basic_miles
          is still covered. Two vehicles built identically and two claims differing only in the
          last digit of odometer_at_repair (36000 versus 36001) therefore land on opposite sides of
          the whole coverage decision - BASIC and SUBMITTED versus NONE, a NO_COVERAGE suspend edit
          and SUSPENDED - so an off-by-one comparison flips both the coverage_type and the claim's
          state machine entry point.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile; dealer D_B at rate 10000 / markup 0.25."
            - "Two vehicles VEH_B1 and VEH_B2, both warranty_start_date 2024-01-15, in_service_odometer 0, basic 36 months / 36000 miles."
            - "Labor op D0001-00 (BASIC, requires_causal_part false, standard 2.0 h) so no part or markup arithmetic is involved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-B", name: "Boundary Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { db_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINB0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehb1_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINB0000000000002", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehb2_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "D0001-00", description: "Diagnostic time only", standard_time_hours: 2.0, max_time_hours: 2.5, category: "BASIC", requires_causal_part: false, overlap_group: "DIAG" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_diag_id: $.data.id }
          trigger:
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${db_id}", vehicle_id: "${vehb1_id}", labor_operation_id: "${lo_diag_id}", repair_order_number: "RO-B-AT", repair_date: "2026-04-10", odometer_at_repair: 36000, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports a dash warning lamp on.", cause_text: "Diagnostic scan traced a transient sensor code.", correction_text: "Cleared the code and verified no recurrence." }
              as: DealerWarrantyAdmin
              as_user_id: "${db_id}"
              captures: { cl_at_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${db_id}", vehicle_id: "${vehb2_id}", labor_operation_id: "${lo_diag_id}", repair_order_number: "RO-B-OVER", repair_date: "2026-04-10", odometer_at_repair: 36001, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports a dash warning lamp on.", cause_text: "Diagnostic scan traced a transient sensor code.", correction_text: "Cleared the code and verified no recurrence." }
              as: DealerWarrantyAdmin
              as_user_id: "${db_id}"
              captures: { cl_over_id: $.data.id }
          assert:
            - "at the limit: WarrantyClaim.${cl_at_id}.coverage_type == BASIC and status == SUBMITTED, provisional_total_cents == 20000"
            - "GET /warranty/claims/${cl_at_id}/edits returns 0 items"
            - "one mile over: WarrantyClaim.${cl_over_id}.coverage_type == NONE and status == SUSPENDED, provisional_total_cents == 20000 (pricing still runs)"
            - "GET /warranty/claims/${cl_over_id}/edits with edit_code NO_COVERAGE returns exactly 1 item with severity == SUSPEND and resolved_at == null"

      - name: zero_finding_audit_error_rate_and_tier_floor
        grounds:
          - calculations.audit_extrapolated_chargeback
          - entities.DealerAudit.fields.error_rate
          - entities.DealerAudit.fields.extrapolation_factor
          - entities.Dealer.fields.chargeback_balance_cents
          - endpoints.POST_/warranty/audits/{id}/issue-findings
        distinguishing_aspect: |
          The degenerate edge of the extrapolation formula: with no findings the numerator AND the
          sample denominator are both 0, so the guarded branch must produce error_rate 0.0 rather
          than a division error, and 0.0 must fall THROUGH both tiers (it is below
          EXTRAPOLATION_HALF_TIER 0.05, so the factor is 0.00, not 0.50) against a non-zero 50000
          population that would otherwise be multiplied. The audit must also issue cleanly with
          zero ledger rows appended, which is the only path where a successful issue-findings
          leaves the ledger untouched.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile; dealer D_ZF at rate 10000 / markup 0.25."
            - "One vehicle, labor op AUD-100 and part AUD-P1: a single claim at repair_date 2026-02-15 approved and PAID at 50000 (20000 labor + 30000 parts)."
            - "Audit A_ZF over [2026-01-01, 2026-07-01) with sample_size 1, started, with NO findings attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-ZF", name: "Zero Finding Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dzf_id: $.data.id, dzf_version: $.data.version }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINZ0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehz_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "AUD-100", description: "Electrical harness repair", standard_time_hours: 2.0, max_time_hours: 3.0, category: "BASIC", requires_causal_part: true, causal_failure_group: "ELEC", overlap_group: "ELEC" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_elec_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "AUD-P1", description: "Electrical harness", dealer_net_cents: 24000, failure_group: "ELEC", return_required: false, retention_days: 0 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_elec_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dzf_id}", vehicle_id: "${vehz_id}", labor_operation_id: "${lo_elec_id}", causal_part_id: "${part_elec_id}", repair_order_number: "RO-ZF-1", repair_date: "2026-02-15", odometer_at_repair: 14000, claimed_labor_hours: 2.0, claimed_parts_qty: 1, complaint_text: "Customer reports intermittent electrical fault.", cause_text: "Harness chafed through insulation layer.", correction_text: "Replaced the electrical harness assembly." }
              as: DealerWarrantyAdmin
              as_user_id: "${dzf_id}"
              captures: { cl_zf_id: $.data.id }
            - call: "POST /warranty/claims/${cl_zf_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 2.0, approved_parts_qty: 1 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${cl_zf_id}/pay"
              payload: {}
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/audits"
              payload: { dealer_id: "${dzf_id}", period_start: "2026-01-01", period_end: "2026-07-01", sample_size: 1, lead_auditor_user_id: "auditor-lead-1", expected_dealer_version: "${dzf_version}" }
              as: AuditManager
              as_user_id: "aum-user-1"
              captures: { audit_zf_id: $.data.id }
            - call: "POST /warranty/audits/${audit_zf_id}/start"
              payload: {}
              as: FieldAuditor
              as_user_id: "auditor-lead-1"
