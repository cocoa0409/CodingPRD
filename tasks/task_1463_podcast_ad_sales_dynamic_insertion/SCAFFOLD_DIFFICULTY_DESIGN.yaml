            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${a2}", name: "C2", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { c2: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${a3}", name: "C3", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { c3: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${c1}", kind: "PRODUCED_AUDIO", script_text: "1" }
