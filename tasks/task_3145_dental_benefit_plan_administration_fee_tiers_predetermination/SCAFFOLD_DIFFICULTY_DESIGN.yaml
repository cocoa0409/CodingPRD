              as: NetworkManager
              captures: { fees_id: $.data.id }
            - call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-NL2", full_name: "Fred Prime", date_of_birth: "1975-05-05T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "9", submitted_amount_cents: 8000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_denied_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-08-01T00:00:00Z", received_date: "2026-08-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "9", submitted_amount_cents: 8000 }] }
              as: Provider
