            - "Channel BRAND holds an OPEN allotment of 11 units covering 2026-09-10, so shared_pool_units is 0 and any POOL draw breaches the ceiling."
            - "Channel OTA1 has a HEALTHY connection and no allotment, so it must draw from the pool."
