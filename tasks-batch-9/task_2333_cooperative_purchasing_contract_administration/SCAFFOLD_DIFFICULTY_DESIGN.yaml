  - rule_id: cross_entity_state_dependency
    instances:
      - name: usage_gated_by_amount_branch_posture_while_the_contract_stays_active
        grounds:
          - validations.priority_32
          - errors.ERR_CONTRACT_POSTURE_DELINQUENT
          - calculations.contract_compliance_posture
          - state_machines.MasterContract.compliance_posture.COMPLIANT_to_DELINQUENT
          - state_machines.UsageReport.fee_status.DUE_to_DELINQUENT
          - state_machines.UsageReport.fee_status.DELINQUENT_to_PAID
        distinguishing_aspect: |
          Whether a member may buy depends on a field of a DIFFERENT entity in a DIFFERENT dimension: the
          contract's compliance_posture, itself derived from UsageReport.fee_status rows. The single
          delinquent report carries EXACTLY DELINQUENCY_AMOUNT_THRESHOLD_CENTS (500000) outstanding, so
          the amount branch fires while the count branch (>= 2 reports) does not: posture becomes
          DELINQUENT, the contract stays ACTIVE, and the analysis is NOT voided. Usage must therefore be
          refused with ERR_CONTRACT_POSTURE_DELINQUENT - not ERR_CONTRACT_NOT_ACTIVE and not
          ERR_PIGGYBACK_NOT_AUTHORIZED - and must be permitted again the moment the fee is remitted.
        test_recipe:
          setup:
            - "Contract COOP-MC-2026-001 is ACTIVE for Acme with admin_fee_rate_bps 200 and lines COOP-ADJ-CENT (1 cent) and JAN-DISP-500 (12500 cents)."
