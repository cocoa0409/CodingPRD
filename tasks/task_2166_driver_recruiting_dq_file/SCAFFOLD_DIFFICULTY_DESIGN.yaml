# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules x >= 2 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls chain drives empty-DB -> setup.
# Logical clock startup default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: dq_completeness_prehire_vs_annual_variants_diverge
        grounds:
          - calculations.dq_completeness_score
          - entities.DqFile.fields.completeness_pct
          - entities.DqDocument.fields.status
          - endpoints[GET /dq-files/{dq_file_id}/completeness]
        distinguishing_aspect: |
          This instance is dual-variant on the DqFile document-weight domain: the identical twelve
          DqDocument rows yield 21.43% under pre_hire_provisional (denominator 28, WAIVED satisfies)
          and 10.00% under annual_review_final (denominator 30, WAIVED does not satisfy and
          CRIMINAL_CHECK leaves scope entirely).
        test_recipe:
          setup:
            - "One Carrier, one DriverApplicant, one submitted DriverApplication with recruiter_user_id rec-001."
            - "Its DqFile holds APPLICATION_FORM PRESENT (seeded by submit), CDL_COPY WAIVED and CRIMINAL_CHECK WAIVED; the other nine documents are MISSING."
            - "Logical clock still at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Redline Freight LLC", dot_number: "DOT-2166-A", open_requisitions: 5, safety_rating: "SATISFACTORY", mvr_validity_days: 365, annual_review_interval_days: 365, annual_review_grace_days: 30, mvr_point_threshold: 7, rehire_cooldown_days: 180, medical_cert_grace_days: 15 }
              as: SafetyDirector
              captures: { carrier_id: $.data.id }
            - call: "POST /driver-applicants"
              payload: { carrier_id: "${carrier_id}", full_name: "Dana Ruiz", date_of_birth: "1988-04-12", email: "dana.ruiz@example.com", cdl_number: "CDL-77120", cdl_state: "TX", cdl_class: "CLASS_A", experience_months: 24 }
              as: Recruiter
              captures: { applicant_id: $.data.id }
            - call: "POST /driver-applications"
              payload: { applicant_id: "${applicant_id}", position_type: "OTR" }
              as: Recruiter
              captures: { app_id: $.data.id }
            - call: "POST /driver-applications/${app_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec-001"
            - call: "GET /dq-files"
              payload: { application_id: "${app_id}" }
              as: Recruiter
              captures: { dqf_id: "$.data[0].id" }
            - call: "GET /dq-documents"
              payload: { dq_file_id: "${dqf_id}", doc_type: "CDL_COPY" }
              as: Recruiter
              captures: { doc_cdl: "$.data[0].id" }
            - call: "GET /dq-files/${dqf_id}"
              payload: {}
              as: Recruiter
              captures: { dqf_v1: $.data.version }
            - call: "PUT /dq-documents/${doc_cdl}"
              payload: { status: "WAIVED", effective_on: "2026-08-01", expected_dq_file_version: "${dqf_v1}" }
              as: Recruiter
            - call: "GET /dq-documents"
              payload: { dq_file_id: "${dqf_id}", doc_type: "CRIMINAL_CHECK" }
              as: Recruiter
              captures: { doc_cri: "$.data[0].id" }
            - call: "GET /dq-files/${dqf_id}"
              payload: {}
              as: Recruiter
              captures: { dqf_v2: $.data.version }
            - call: "PUT /dq-documents/${doc_cri}"
              payload: { status: "WAIVED", effective_on: "2026-08-01", expected_dq_file_version: "${dqf_v2}" }
              as: Recruiter
          trigger:
            - call: "GET /dq-files/${dqf_id}/completeness"
              payload: { variant: "pre_hire_provisional" }
              as: ComplianceAuditor
            - call: "GET /dq-files/${dqf_id}/completeness"
              payload: { variant: "annual_review_final" }
              as: ComplianceAuditor
          assert:
            - "pre_hire_provisional response: completeness_pct == 21.43"
            - "pre_hire_provisional response: satisfied_weight == 6 and denominator_weight == 28"
            - "pre_hire_provisional response: deficiency_count == 7"
            - "annual_review_final response: completeness_pct == 10.00"
            - "annual_review_final response: satisfied_weight == 3 and denominator_weight == 30"
            - "annual_review_final response: deficiency_count == 9"
            - "DqFile.${dqf_id}.completeness_pct == 21.43 (the persisted field always tracks pre_hire_provisional)"
            - "DqFile.${dqf_id}.status == OPEN"

      - name: employment_coverage_strict_vs_good_faith_variants_diverge
        grounds:
          - calculations.employment_history_coverage
          - state_machines.EmploymentVerification.REQUESTED_to_GOOD_FAITH_DOCUMENTED
          - entities.DriverApplication.fields.verified_coverage_days
          - endpoints[GET /driver-applications/{application_id}/employment-coverage]
        distinguishing_aspect: |
          This instance is dual-variant on the DriverApplication interval-coverage domain (a different
          entity domain from the DqFile weight domain above): the same two employment segments yield
          699 covered days under strict_verified and 1095 under good_faith_projected, because the
          2022-01-01..2024-09-01 segment reached GOOD_FAITH_DOCUMENTED rather than RESPONDED_VERIFIED.
        test_recipe:
          setup:
            - "One submitted DriverApplication at the default clock 2026-08-01T00:00:00Z, so the lookback window is the half-open [2023-08-02, 2026-08-01)."
            - "Segment A 2022-01-01..2024-09-01 is GOOD_FAITH_DOCUMENTED after three documented request rounds; its clipped length is 396 days."
            - "Segment B 2024-09-01..2026-08-01 is RESPONDED_VERIFIED; its length is 699 days and it is adjacent to segment A."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Redline Freight LLC", dot_number: "DOT-2166-B", open_requisitions: 5, safety_rating: "SATISFACTORY", mvr_validity_days: 365, annual_review_interval_days: 365, annual_review_grace_days: 30, mvr_point_threshold: 7, rehire_cooldown_days: 180, medical_cert_grace_days: 15 }
              as: SafetyDirector
              captures: { carrier_id: $.data.id }
            - call: "POST /driver-applicants"
              payload: { carrier_id: "${carrier_id}", full_name: "Ola Berg", date_of_birth: "1990-02-02", email: "ola.berg@example.com", cdl_number: "CDL-31007", cdl_state: "MN", cdl_class: "CLASS_A", experience_months: 60 }
              as: Recruiter
              captures: { applicant_id: $.data.id }
            - call: "POST /driver-applications"
              payload: { applicant_id: "${applicant_id}", position_type: "REGIONAL" }
              as: Recruiter
              captures: { app_id: $.data.id }
            - call: "POST /driver-applications/${app_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec-001"
            - call: "POST /employment-verifications"
              payload: { application_id: "${app_id}", employer_name: "Blue Line Cartage", is_dot_regulated: true, employed_from: "2022-01-01", employed_to: "2024-09-01" }
              as: Recruiter
              captures: { ev_a: $.data.id }
            - call: "POST /employment-verifications"
              payload: { application_id: "${app_id}", employer_name: "Northgate Haul", is_dot_regulated: true, employed_from: "2024-09-01", employed_to: "2026-08-01" }
              as: Recruiter
              captures: { ev_b: $.data.id }
            - call: "POST /employment-verifications/${ev_a}/send-request"
              payload: {}
              as: Recruiter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: Recruiter
            - call: "POST /employment-verifications/${ev_a}/mark-no-response"
              payload: {}
              as: Recruiter
            - call: "POST /employment-verifications/${ev_a}/send-request"
              payload: {}
              as: Recruiter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: Recruiter
            - call: "POST /employment-verifications/${ev_a}/mark-no-response"
              payload: {}
              as: Recruiter
            - call: "POST /employment-verifications/${ev_a}/send-request"
              payload: {}
              as: Recruiter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: Recruiter
            - call: "POST /employment-verifications/${ev_a}/mark-no-response"
              payload: {}
              as: Recruiter
            - call: "POST /employment-verifications/${ev_b}/send-request"
              payload: {}
              as: Recruiter
            - call: "POST /employment-verifications/${ev_b}/record-response"
              payload: { outcome: "VERIFIED", safety_performance_history_received: true, drug_alcohol_violation_reported: false }
              as: Recruiter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Recruiter
          trigger:
            - call: "GET /driver-applications/${app_id}/employment-coverage"
              payload: { variant: "strict_verified" }
              as: ComplianceAuditor
            - call: "GET /driver-applications/${app_id}/employment-coverage"
              payload: { variant: "good_faith_projected" }
              as: ComplianceAuditor
          assert:
            - "EmploymentVerification.${ev_a}.status == GOOD_FAITH_DOCUMENTED and request_round == 3"
            - "EmploymentVerification.${ev_b}.status == RESPONDED_VERIFIED"
            - "strict_verified response: verified_coverage_days == 699 and gap_days_unexplained == 396 and merged_segment_count == 1"
            - "good_faith_projected response: verified_coverage_days == 1095 and gap_days_unexplained == 0 and merged_segment_count == 1"
            - "DriverApplication.${app_id}.verified_coverage_days == 699 (the persisted field always tracks strict_verified)"
            - "DriverApplication.${app_id}.gap_days_unexplained == 396"

      - name: screening_score_mvr_variant_vs_raw_variant_diverge
        grounds:
          - calculations.mvr_adjudication_score
          - entities.ScreeningCheck.fields.adjudication_score
          - entities.Carrier.fields.safety_rating
          - endpoints[POST /screening-checks/{screening_check_id}/record-result]
        distinguishing_aspect: |
          This instance is dual-variant on the ScreeningCheck report-scoring domain (a third distinct
          entity domain): identical raw inputs (5 points, 1 serious violation, 0 crashes) score 7.50
          under mvr_full_adjudication (experience credit 3.0 then the 1.25 CONDITIONAL multiplier) and
          9.00 under report_raw_score for the PSP row, which skips both adjustments.
        test_recipe:
          setup:
            - "Carrier with safety_rating CONDITIONAL and mvr_point_threshold 7."
            - "Applicant with experience_months 24, so the experience credit is floor(24/12) * 1.5 == 3.0."
            - "One submitted application carrying an ORDERED MVR check and an ORDERED PSP check."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Cutbank Transport", dot_number: "DOT-2166-C", open_requisitions: 5, safety_rating: "CONDITIONAL", mvr_validity_days: 365, annual_review_interval_days: 365, annual_review_grace_days: 30, mvr_point_threshold: 7, rehire_cooldown_days: 180, medical_cert_grace_days: 15 }
              as: SafetyDirector
              captures: { carrier_id: $.data.id }
            - call: "POST /driver-applicants"
              payload: { carrier_id: "${carrier_id}", full_name: "Ivo Marek", date_of_birth: "1985-11-30", email: "ivo.marek@example.com", cdl_number: "CDL-55210", cdl_state: "OH", cdl_class: "CLASS_A", experience_months: 24 }
              as: Recruiter
              captures: { applicant_id: $.data.id }
            - call: "POST /driver-applications"
              payload: { applicant_id: "${applicant_id}", position_type: "OTR" }
              as: Recruiter
              captures: { app_id: $.data.id }
            - call: "POST /driver-applications/${app_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec-001"
            - call: "POST /screening-checks"
              payload: { application_id: "${app_id}", check_type: "MVR" }
              as: Recruiter
              captures: { mvr_id: $.data.id }
            - call: "POST /screening-checks"
              payload: { application_id: "${app_id}", check_type: "PSP" }
              as: Recruiter
              captures: { psp_id: $.data.id }
          trigger:
            - call: "POST /screening-checks/${mvr_id}/record-result"
              payload: { issued_on: "2026-07-01", violation_points: 5, serious_violation_count: 1, crash_preventable_count: 0 }
              as: Recruiter
            - call: "POST /screening-checks/${psp_id}/record-result"
              payload: { issued_on: "2026-07-01", violation_points: 5, serious_violation_count: 1, crash_preventable_count: 0 }
              as: Recruiter
          assert:
            - "ScreeningCheck.${mvr_id}.adjudication_score == 7.50"
            - "ScreeningCheck.${mvr_id}.expires_on == 2027-07-01"
            - "ScreeningCheck.${psp_id}.adjudication_score == 9.00"
            - "ScreeningCheck.${psp_id}.expires_on == null"
            - "ScreeningCheck.${mvr_id}.status == RECEIVED and ScreeningCheck.${psp_id}.status == RECEIVED"

  - rule_id: combinatorial_formula
    instances:

      - name: mvr_score_five_input_nonlinear_branching_mode_a
        grounds:
          - calculations.mvr_adjudication_score
          - entities.DriverApplicant.fields.experience_months
          - entities.Carrier.fields.safety_rating
          - validations[priority=38]
        distinguishing_aspect: |
          MODE (a) — five inputs (violation_points, serious_violation_count, crash_preventable_count,
          experience_months, carrier safety_rating) interact non-linearly through a min() cap on the
          experience credit, a max(0.0, ...) floor and a three-way branch selecting the multiplier:
          72 months of experience would earn 9.0 of credit but min() caps it at 6.0, so the net 12.0
          scaled by the 1.50 UNSATISFACTORY multiplier is 18.00 rather than the uncapped 13.50.
        test_recipe:
          setup:
            - "Carrier created SATISFACTORY (so the application can be submitted while posture is OPEN) and then PATCHed to UNSATISFACTORY, which selects the 1.50 multiplier and drives posture to FROZEN."
            - "Applicant with experience_months 72, which would earn 6 * 1.5 == 9.0 of credit but is capped at MAX_EXPERIENCE_CREDIT 6.0."
            - "One submitted application with an ORDERED MVR check."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Grayhill Bulk", dot_number: "DOT-2166-D", open_requisitions: 5, safety_rating: "SATISFACTORY", mvr_validity_days: 365, annual_review_interval_days: 365, annual_review_grace_days: 30, mvr_point_threshold: 7, rehire_cooldown_days: 180, medical_cert_grace_days: 15 }
              as: SafetyDirector
              captures: { carrier_id: $.data.id }
            - call: "POST /driver-applicants"
              payload: { carrier_id: "${carrier_id}", full_name: "Rae Ndiaye", date_of_birth: "1979-06-19", email: "rae.ndiaye@example.com", cdl_number: "CDL-90011", cdl_state: "GA", cdl_class: "CLASS_A", experience_months: 72 }
              as: Recruiter
              captures: { applicant_id: $.data.id }
            - call: "POST /driver-applications"
              payload: { applicant_id: "${applicant_id}", position_type: "LOCAL" }
              as: Recruiter
              captures: { app_id: $.data.id }
            - call: "POST /driver-applications/${app_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec-001"
            - call: "GET /carriers/${carrier_id}"
              payload: {}
              as: SafetyDirector
              captures: { carrier_v: $.data.version }
            - call: "PATCH /carriers/${carrier_id}"
              payload: { safety_rating: "UNSATISFACTORY", expected_carrier_version: "${carrier_v}" }
              as: SafetyDirector
            - call: "POST /screening-checks"
              payload: { application_id: "${app_id}", check_type: "MVR" }
              as: Recruiter
              captures: { mvr_id: $.data.id }
          trigger:
            - call: "POST /screening-checks/${mvr_id}/record-result"
              payload: { issued_on: "2026-07-01", violation_points: 8, serious_violation_count: 1, crash_preventable_count: 1 }
              as: Recruiter
          assert:
            - "ScreeningCheck.${mvr_id}.adjudication_score == 18.00 (raw 18.0, credit capped at 6.0, net 12.0, times the 1.50 UNSATISFACTORY multiplier)"
            - "ScreeningCheck.${mvr_id}.status == RECEIVED"
            - "ScreeningCheck.${mvr_id}.expires_on == 2027-07-01"

      - name: dq_completeness_rounding_order_mode_b
        grounds:
          - calculations.dq_completeness_score
          - endpoints[GET /dq-files/{dq_file_id}/completeness]
          - entities.DqDocument.fields.weight
        distinguishing_aspect: |
          MODE (b) — nested rounding where order changes the answer: summing the integer weights
          3 + 2 + 1 == 6 and rounding 6/28*100 once yields 21.43, whereas rounding each document's own
          percentage first (10.71 + 7.14 + 3.57) and summing yields 21.42. The scaffold pins the
          sum-then-round order, so 21.43 is the only correct value.
        test_recipe:
          setup:
            - "One submitted DriverApplication whose DqFile has APPLICATION_FORM PRESENT (weight 3), CDL_COPY WAIVED (weight 2) and CRIMINAL_CHECK WAIVED (weight 1); the remaining nine rows are MISSING."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Redline Freight LLC", dot_number: "DOT-2166-E", open_requisitions: 5, safety_rating: "SATISFACTORY", mvr_validity_days: 365, annual_review_interval_days: 365, annual_review_grace_days: 30, mvr_point_threshold: 7, rehire_cooldown_days: 180, medical_cert_grace_days: 15 }
              as: SafetyDirector
              captures: { carrier_id: $.data.id }
            - call: "POST /driver-applicants"
              payload: { carrier_id: "${carrier_id}", full_name: "Pia Sandoval", date_of_birth: "1992-09-09", email: "pia.sandoval@example.com", cdl_number: "CDL-44320", cdl_state: "AZ", cdl_class: "CLASS_B", experience_months: 18 }
              as: Recruiter
              captures: { applicant_id: $.data.id }
            - call: "POST /driver-applications"
              payload: { applicant_id: "${applicant_id}", position_type: "LOCAL" }
              as: Recruiter
              captures: { app_id: $.data.id }
            - call: "POST /driver-applications/${app_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec-001"
            - call: "GET /dq-files"
              payload: { application_id: "${app_id}" }
              as: Recruiter
              captures: { dqf_id: "$.data[0].id" }
            - call: "GET /dq-documents"
              payload: { dq_file_id: "${dqf_id}", doc_type: "CDL_COPY" }
              as: Recruiter
              captures: { doc_cdl: "$.data[0].id" }
            - call: "GET /dq-files/${dqf_id}"
              payload: {}
              as: Recruiter
              captures: { dqf_v1: $.data.version }
            - call: "PUT /dq-documents/${doc_cdl}"
              payload: { status: "WAIVED", effective_on: "2026-08-01", expected_dq_file_version: "${dqf_v1}" }
              as: Recruiter
            - call: "GET /dq-documents"
              payload: { dq_file_id: "${dqf_id}", doc_type: "CRIMINAL_CHECK" }
              as: Recruiter
              captures: { doc_cri: "$.data[0].id" }
            - call: "GET /dq-files/${dqf_id}"
              payload: {}
              as: Recruiter
              captures: { dqf_v2: $.data.version }
            - call: "PUT /dq-documents/${doc_cri}"
              payload: { status: "WAIVED", effective_on: "2026-08-01", expected_dq_file_version: "${dqf_v2}" }
              as: Recruiter
          trigger:
            - call: "GET /dq-files/${dqf_id}/completeness"
              payload: { variant: "pre_hire_provisional" }
              as: ComplianceAuditor
          assert:
            - "response completeness_pct == 21.43 (NOT 21.42, which is the per-document rounding order)"
            - "response satisfied_weight == 6 and denominator_weight == 28"
            - "DqFile.${dqf_id}.completeness_pct == 21.43"

      - name: tuition_tier_keyed_on_base_monthly_mode_c
        grounds:
          - calculations.tuition_schedule
          - entities.TuitionAgreement.fields.base_monthly_cents
          - entities.TuitionAgreement.fields.monthly_reimbursement_cents
          - state_machines.TuitionAgreement.PENDING_to_ACTIVE
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency with a pinned evaluation order: base_monthly_cents
          9600 falls in the LOW tier (10% bonus) giving monthly_reimbursement_cents 10560, and 10560
          itself sits in the MID tier; re-keying the tier on the result would yield 10080. The scaffold
          pins step 2 to read base_monthly_cents only, so 10560 is the only correct value.
        test_recipe:
          setup:
            - "One applicant hired and ACTIVE at a carrier, so a tuition agreement may be activated."
            - "A PENDING TuitionAgreement with tuition_total_cents 115205 over commitment_months 12."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "Cedar Ridge Lines", dot_number: "DOT-2166-F", open_requisitions: 5, safety_rating: "SATISFACTORY", mvr_validity_days: 365, annual_review_interval_days: 365, annual_review_grace_days: 30, mvr_point_threshold: 7, rehire_cooldown_days: 180, medical_cert_grace_days: 15 }
              as: SafetyDirector
              captures: { carrier_id: $.data.id }
            - call: "POST /driver-applicants"
              payload: { carrier_id: "${carrier_id}", full_name: "Tomas Alvi", date_of_birth: "1994-03-03", email: "tomas.alvi@example.com", cdl_number: "CDL-60455", cdl_state: "IA", cdl_class: "CLASS_A", experience_months: 24 }
              as: Recruiter
              captures: { applicant_id: $.data.id }
            - call: "POST /driver-applications"
              payload: { applicant_id: "${applicant_id}", position_type: "OTR" }
              as: Recruiter
              captures: { app_id: $.data.id }
            - call: "POST /driver-applications/${app_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec-001"
            - call: "POST /employment-verifications"
              payload: { application_id: "${app_id}", employer_name: "Blue Line Cartage", is_dot_regulated: true, employed_from: "2022-01-01", employed_to: "2024-09-01" }
              as: Recruiter
              captures: { ev_a: $.data.id }
            - call: "POST /employment-verifications/${ev_a}/send-request"
              payload: {}
              as: Recruiter
            - call: "POST /employment-verifications/${ev_a}/record-response"
              payload: { outcome: "VERIFIED", safety_performance_history_received: true, drug_alcohol_violation_reported: false }
              as: Recruiter
            - call: "POST /employment-verifications"
              payload: { application_id: "${app_id}", employer_name: "Northgate Haul", is_dot_regulated: true, employed_from: "2024-09-01", employed_to: "2026-08-01" }
              as: Recruiter
              captures: { ev_b: $.data.id }
            - call: "POST /employment-verifications/${ev_b}/send-request"
              payload: {}
              as: Recruiter
            - call: "POST /employment-verifications/${ev_b}/record-response"
              payload: { outcome: "VERIFIED", safety_performance_history_received: true, drug_alcohol_violation_reported: false }
              as: Recruiter
            - call: "POST /screening-checks"
              payload: { application_id: "${app_id}", check_type: "MVR" }
              as: Recruiter
              captures: { mvr_id: $.data.id }
            - call: "POST /screening-checks/${mvr_id}/record-result"
              payload: { issued_on: "2026-07-01", violation_points: 0, serious_violation_count: 0, crash_preventable_count: 0 }
              as: Recruiter
            - call: "POST /screening-checks/${mvr_id}/adjudicate"
              payload: { decision: "PASS" }
              as: SafetyDirector
            - call: "POST /screening-checks"
