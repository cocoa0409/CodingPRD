# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3191_bottler_territory_franchise_concentrate_pricing
#
# Breadth probe over every §1.1–§1.7 claim not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. The canonical ACTIVE-agreement seed chain
# (clock -> brand -> index -> line -> territory -> agreement -> activate) is
# anchored once (&seed_*) and replayed by alias in later instances; every
# instance re-executes its full chain against a fresh database.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: brand_owner_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - "entities.BrandOwner"
          - "endpoints.POST_/bottler/brand-owners"
        distinguishing_aspect: "A brand owner created with only name and home_country returns 201 with status ACTIVE, version 1, and system-generated id/created_at/updated_at."
        test_recipe:
          setup: ["Empty database; logical clock at startup default."]
          setup_api_calls:
            - &seed_clock
              call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &seed_bo
              call: "POST /bottler/brand-owners"
              payload: { name: "ColaCo", home_country: "US" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
          assert:
            - "HTTP 201 with response_type object"
            - "BrandOwner.${bo_id}.status == ACTIVE and version == 1"
            - "response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: territory_get_roundtrips_stored_fields
        claim_type: Retrieval
        grounds:
          - "entities.Territory"
          - "endpoints.GET_/bottler/territories/{id}"
        distinguishing_aspect: "Every stored territory field round-trips through GET, including the OPEN status default and brand_owner_id FK."
        test_recipe:
          setup: ["Brand owner exists."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - &seed_ter
              call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "South Atlanta 07" }
              as: PlatformAdmin
              captures: { ter_id: $.data.id }
          trigger:
            - call: "GET /bottler/territories/${ter_id}"
              as: PlatformAdmin
          assert:
            - "Territory.${ter_id}.code == \"SO-ATL-07\" and region_label == \"South Atlanta 07\""
            - "Territory.${ter_id}.status == OPEN and brand_owner_id == ${bo_id}"

      - name: product_line_list_paginates_with_envelope_fields
        claim_type: Listing
        grounds:
          - "endpoints.GET_/bottler/product-lines"
          - "response_envelope"
        distinguishing_aspect: "limit=1 over two lines returns exactly one row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["Brand owner with two product lines."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-20OZ-PET", concentrate_base_price_per_gallon: 12.5, is_mandatory: false }
              as: BrandOwnerAdmin
          trigger:
            - call: "GET /bottler/product-lines"
              payload: { limit: 1, offset: 0 }
              as: BrandOwnerAdmin
            - call: "GET /bottler/product-lines"
              payload: { limit: 1, offset: 1 }
              as: BrandOwnerAdmin
          assert:
            - "page 1: response_type array, data length 1, total_count == 2, has_more == true"
            - "page 2: data length 1, total_count == 2, has_more == false"

      - name: customer_get_missing_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_RESOURCE_NOT_FOUND]"
          - "endpoints.GET_/bottler/customers/{id}"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields 404 ERR_RESOURCE_NOT_FOUND, not a 500 or empty object."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *seed_clock
          trigger:
            - call: "GET /bottler/customers/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
          assert:
            - "HTTP 404 with data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: territory_create_missing_code_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Territory.fields.code"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required input field code on territory creation yields 400 ERR_VALIDATION and persists nothing."
        test_recipe:
          setup: ["Brand owner exists."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
          trigger:
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", region_label: "No Code Territory" }
              as: PlatformAdmin
          assert:
            - "HTTP 400 with data.error_id == ERR_VALIDATION"

      - name: agreement_create_defaults_zero_ledgers_and_draft
        claim_type: Defaults
        grounds:
          - "entities.BottlerAgreement.fields.marketing_fund_balance_cents"
          - "entities.BottlerAgreement.fields.status"
        distinguishing_aspect: "A freshly created agreement starts DRAFT with all three derived ledgers at 0 before any activity."
        test_recipe:
          setup: ["Brand, index, mandatory line, and territory exist."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - &seed_index
              call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 110.00 }
              as: BrandOwnerAdmin
            - &seed_line
              call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-12OZ-CAN", concentrate_base_price_per_gallon: 12.0, is_mandatory: true }
              as: BrandOwnerAdmin
              captures: { pl_id: $.data.id }
            - *seed_ter
            - &seed_ag
              call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Dixie Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
          trigger:
            - call: "GET /bottler/bottler-agreements/${ag_id}"
              as: PlatformAdmin
          assert:
            - "BottlerAgreement.${ag_id}.status == DRAFT and version == 1"
            - "marketing_fund_balance_cents == 0, service_spent_cents == 0, margin_ledger_cents == 0"

      - name: cpo_create_provisional_unit_price_input_ignored
        claim_type: Computed Fields
        grounds:
          - "entities.ConcentratePurchaseOrder.fields.provisional_unit_price"
          - "calculations.concentrate_unit_price"
        distinguishing_aspect: "A client-supplied provisional_unit_price in the create body is ignored; the server-computed $13.2000 from the pricing formula is returned."
        test_recipe:
          setup: ["ACTIVE agreement (version 2), index 110.00, line base $12.0000."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - &seed_act
              call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ag_v1: $.data.version }
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}", provisional_unit_price: 99.99 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
          assert:
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_unit_price == 13.2 (client's 99.99 ignored)"
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_amount_cents == 13200000"

      - name: fountain_account_retail_customer_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.FountainAccount.fields.customer_id"
          - "errors[ERR_REFERENTIAL_INTEGRITY]"
        distinguishing_aspect: "A fountain account can only be opened for a FOUNTAIN-channel customer; a RETAIL customer is rejected with ERR_REFERENTIAL_INTEGRITY."
        test_recipe:
          setup: ["ACTIVE agreement; RETAIL customer."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - &seed_cust
              call: "POST /bottler/customers"
              payload: { agreement_id: "${ag_id}", name: "QuickMart 12", channel: "RETAIL", local_price_cents: 190 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /bottler/fountain-accounts"
              payload: { customer_id: "${cust_id}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_REFERENTIAL_INTEGRITY"

      - name: territory_code_uniqueness_enforced
        claim_type: Type Constraints
        grounds:
          - "entities.Territory.fields.code"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Two territories sharing the same code are rejected at priority 7 even though all other fields are valid."
        test_recipe:
          setup: ["Brand owner; one territory SO-ATL-07 already created."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_ter
          trigger:
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "SO-ATL-07", region_label: "Duplicate Code" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_VALIDATION"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: agreement_activate_twice_rejected
        claim_type: Idempotency
        grounds:
          - "state_machines.BottlerAgreement.DRAFT_to_ACTIVE"
          - "errors[ERR_AGREEMENT_ALREADY_ACTIVE]"
        distinguishing_aspect: "Repeating activate on an already-ACTIVE agreement fails with ERR_AGREEMENT_ALREADY_ACTIVE; the version does not advance a second time."
        test_recipe:
          setup: ["ACTIVE agreement."]
          setup_api_calls: [*seed_clock, *seed_bo, *seed_index, *seed_line, *seed_ter, *seed_ag, *seed_act]
          trigger:
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_AGREEMENT_ALREADY_ACTIVE"
            - "BottlerAgreement.${ag_id}.version == 2 (unchanged by the rejected call)"

      - name: second_active_agreement_in_territory_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "errors[ERR_TERRITORY_HAS_ACTIVE_AGREEMENT]"
          - "endpoints.POST_/bottler/bottler-agreements/{id}/activate"
        distinguishing_aspect: "A territory admits at most one ACTIVE agreement; activating a second DRAFT agreement in the same territory fails."
        test_recipe:
          setup: ["Territory with one ACTIVE agreement and a second DRAFT agreement."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/territories/${ter_id}/agreements"
              payload: { bottler_name: "Rival Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "NET_REVENUE", service_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { ag2_id: $.data.id }
          trigger:
            - call: "POST /bottler/bottler-agreements/${ag2_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_TERRITORY_HAS_ACTIVE_AGREEMENT"
            - "BottlerAgreement.${ag2_id}.status == DRAFT"

      - name: activate_without_index_fails_line_obligation
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.BottlerAgreement.DRAFT_to_ACTIVE"
          - "errors[ERR_LINE_OBLIGATION_UNMET]"
        distinguishing_aspect: "When the brand has a mandatory product line but no concentrate price index at all, activation fails with ERR_LINE_OBLIGATION_UNMET — the obligation gate, not a generic state error."
        test_recipe:
          setup: ["Brand with mandatory line but NO ConcentratePriceIndex; territory with DRAFT agreement."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_line
            - *seed_ter
            - *seed_ag
          trigger:
            - call: "POST /bottler/bottler-agreements/${ag_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_LINE_OBLIGATION_UNMET"
            - "BottlerAgreement.${ag_id}.status == DRAFT"

      - name: terminate_with_open_cpo_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.BottlerAgreement.ACTIVE_to_TERMINATED"
        distinguishing_aspect: "An ACTIVE agreement with a PLACED (not yet received or cancelled) CPO cannot be terminated."
        test_recipe:
          setup: ["ACTIVE agreement with a PLACED CPO."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /bottler/bottler-agreements/${ag_id}/terminate"
              payload: {}
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "BottlerAgreement.${ag_id}.status == ACTIVE"

      - name: cpo_finalize_before_receive_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.ConcentratePurchaseOrder.PROVISIONAL_to_FINALIZED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Finalize requires fulfillment_status == RECEIVED; a PLACED order rejects finalize even though pricing_status is PROVISIONAL — the parallel dimensions interact here."
        test_recipe:
          setup: ["ACTIVE agreement with a PLACED CPO."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders/${cpo_id}/finalize"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "ConcentratePurchaseOrder.${cpo_id}.pricing_status == PROVISIONAL"

      - name: cpo_cancel_after_finalize_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ConcentratePurchaseOrder"
          - "errors[ERR_CPO_ALREADY_FINALIZED]"
        distinguishing_aspect: "A RECEIVED+FINALIZED order rejects cancel with the domain-specific ERR_CPO_ALREADY_FINALIZED."
        test_recipe:
          setup: ["ACTIVE agreement; CPO received and finalized (index rows 110 and 120 recorded)."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q3", index_value: 120.00 }
              as: BrandOwnerAdmin
            - call: "POST /bottler/concentrate-purchase-orders/${cpo_id}/receive"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/concentrate-purchase-orders/${cpo_id}/finalize"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders/${cpo_id}/cancel"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_CPO_ALREADY_FINALIZED"
            - "ConcentratePurchaseOrder.${cpo_id}.fulfillment_status == RECEIVED"

      - name: terminated_agreement_suspend_rejected_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.BottlerAgreement"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "No transition leaves TERMINATED: suspend on a terminated agreement fails with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["ACTIVE agreement with no open CPOs, terminated."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/bottler-agreements/${ag_id}/terminate"
              payload: {}
              as: BrandOwnerAdmin
          trigger:
            - call: "POST /bottler/bottler-agreements/${ag_id}/suspend"
              payload: {}
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_ALREADY_TERMINAL"
            - "BottlerAgreement.${ag_id}.status == TERMINATED and Territory.${ter_id}.status == OPEN"

      - name: launch_fork_penalized_applies_penalty_and_margin_debit
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.InnovationLaunch.COMMIT_REVIEW_to_PENALIZED"
          - "calculations.innovation_min_volume_penalty"
        distinguishing_aspect: "Branch B of the commitment review forks to PENALIZED, computes the tiered penalty (44999 sold of 50000 committed -> shortfall 5001 -> 10.002% -> 12-cent tier -> 60012), and debits the agreement margin ledger by the same amount."
        test_recipe:
          setup: ["ACTIVE agreement; launch IN_PRODUCTION with 44999 cases recorded of 50000 committed; logical clock moved past launch_end."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/innovation-launches"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", committed_cases: 50000, launch_start: "2026-09-01", launch_end: "2026-10-31" }
              as: BrandOwnerAdmin
              captures: { launch_id: $.data.id }
            - call: "POST /bottler/innovation-launches/${launch_id}/schedule-changeover"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/innovation-launches/${launch_id}/complete-changeover"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/innovation-launches/${launch_id}/record-sales"
              payload: { cases: 44999 }
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bottler/innovation-launches/${launch_id}/review-commitment"
              payload: {}
              as: BrandOwnerAdmin
          assert:
            - "InnovationLaunch.${launch_id}.status == PENALIZED"
            - "InnovationLaunch.${launch_id}.penalty_cents == 60012"
            - "BottlerAgreement.${ag_id}.margin_ledger_cents == -60012"

      - name: launch_review_before_window_end_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "errors[ERR_COMMITMENT_WINDOW_OPEN]"
          - "state_machines.InnovationLaunch.IN_PRODUCTION_to_COMMIT_REVIEW"
        distinguishing_aspect: "review-commitment while the logical clock is still inside the commitment window fails with ERR_COMMITMENT_WINDOW_OPEN — time-gated via the logical clock, not wall-clock."
        test_recipe:
          setup: ["Launch IN_PRODUCTION; clock still at 2026-10-15 (window ends 2026-10-31)."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/innovation-launches"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", committed_cases: 50000, launch_start: "2026-09-01", launch_end: "2026-10-31" }
              as: BrandOwnerAdmin
              captures: { launch_id: $.data.id }
            - call: "POST /bottler/innovation-launches/${launch_id}/schedule-changeover"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/innovation-launches/${launch_id}/complete-changeover"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bottler/innovation-launches/${launch_id}/review-commitment"
              payload: {}
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_COMMITMENT_WINDOW_OPEN"
            - "InnovationLaunch.${launch_id}.status == IN_PRODUCTION"

      - name: dsd_pay_before_deliver_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.DsdOrder"
          - "errors[ERR_DSD_ORDER_NOT_DELIVERED]"
        distinguishing_aspect: "pay on a BOOKED order fails with ERR_DSD_ORDER_NOT_DELIVERED — the payment dimension cannot advance before the fulfillment dimension reaches DELIVERED."
        test_recipe:
          setup: ["ACTIVE agreement; ACTIVE customer; BOOKED order."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - *seed_cust
            - call: "POST /bottler/dsd-orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_line_id: "${pl_id}", quantity_cases: 2, discount_pct: 0 } ] }
              as: CustomerManager
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /bottler/dsd-orders/${order_id}/pay"
              payload: {}
              as: CustomerManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_DSD_ORDER_NOT_DELIVERED"
            - "DsdOrder.${order_id}.payment_status == UNPAID and fulfillment_status == BOOKED"

      - name: nca_suspend_republish_cycle_and_expire_lockdown
        claim_type: Valid Transition
        grounds:
          - "state_machines.NationalCustomerAgreement"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "PUBLISHED->SUSPENDED->PUBLISHED loops freely; once the logical clock passes effective_end, expire moves to EXPIRED and publish is rejected with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["NCA window 2026-09-01..2026-09-30 published, suspended, republished."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - call: "POST /bottler/national-customer-agreements"
              payload: { brand_owner_id: "${bo_id}", nca_code: "NCA-2026-01", national_price_cents: 200, effective_start: "2026-09-01", effective_end: "2026-09-30" }
              as: BrandOwnerAdmin
              captures: { nca_id: $.data.id }
            - call: "POST /bottler/national-customer-agreements/${nca_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/national-customer-agreements/${nca_id}/suspend"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/national-customer-agreements/${nca_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bottler/national-customer-agreements/${nca_id}/expire"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/national-customer-agreements/${nca_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "republish after suspend succeeded (status returned to PUBLISHED before expire)"
            - "expire succeeded; NationalCustomerAgreement.${nca_id}.status == EXPIRED"
            - "publish after expire rejected with ERR_ALREADY_TERMINAL"

      - name: equipment_place_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ColdDrinkEquipment"
          - "errors[ERR_EQUIPMENT_NOT_IN_WAREHOUSE]"
        distinguishing_aspect: "place on already-PLACED equipment fails with ERR_EQUIPMENT_NOT_IN_WAREHOUSE — the machine has no PLACED->PLACED self-loop."
        test_recipe:
          setup: ["ACTIVE agreement; ACTIVE customer; equipment placed."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - *seed_cust
            - call: "POST /bottler/cold-drink-equipment"
              payload: { agreement_id: "${ag_id}", asset_tag: "CDE-0001" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { eq_id: $.data.id }
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/place"
              payload: { customer_id: "${cust_id}", placed_from: "2026-09-15", placed_until: "2026-12-31" }
              as: BottlerOps
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /bottler/cold-drink-equipment/${eq_id}/place"
              payload: { customer_id: "${cust_id}", placed_from: "2026-10-01", placed_until: "2026-11-30" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_EQUIPMENT_NOT_IN_WAREHOUSE"
            - "ColdDrinkEquipment.${eq_id}.placed_from == \"2026-09-15\" (original placement untouched)"

      - name: deliver_to_disputed_customer_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.DsdOrder.BOOKED_to_DELIVERED"
          - "errors[ERR_CUSTOMER_DISPUTED]"
        distinguishing_aspect: "Delivery is gated on the CUSTOMER's state (cross-entity guard): a DISPUTED customer blocks deliver even though the order itself is BOOKED."
        test_recipe:
          setup: ["ACTIVE agreement; customer disputed after booking an order."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - *seed_cust
            - call: "POST /bottler/dsd-orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_line_id: "${pl_id}", quantity_cases: 2, discount_pct: 0 } ] }
              as: CustomerManager
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bottler/customers/${cust_id}/dispute"
              payload: {}
              as: CustomerManager
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /bottler/dsd-orders/${order_id}/deliver"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_CUSTOMER_DISPUTED"
            - "DsdOrder.${order_id}.fulfillment_status == BOOKED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: concentrate_provisional_without_index_uses_base_index
        claim_type: Correct Result
        grounds:
          - "calculations.concentrate_unit_price"
        distinguishing_aspect: "With zero index rows for the brand (possible when no line is mandatory), the provisional selected_index falls back to the agreement base index, so unit price equals the line base price exactly."
        test_recipe:
          setup: ["Brand with NON-mandatory line and NO index rows; ACTIVE agreement."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - call: "POST /bottler/product-lines"
              payload: { brand_owner_id: "${bo_id}", line_code: "COLA-20OZ-PET", concentrate_base_price_per_gallon: 12.5, is_mandatory: false }
              as: BrandOwnerAdmin
              captures: { pl_id: $.data.id }
            - *seed_ter
            - *seed_ag
            - *seed_act
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 10000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cpo_id: $.data.id }
          assert:
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_unit_price == 12.5"
            - "ConcentratePurchaseOrder.${cpo_id}.provisional_amount_cents == 12500000"

      - name: territory_valuation_low_band_uses_four_percent_reserve
        claim_type: Constants Applied
        grounds:
          - "calculations.territory_transfer_valuation"
        distinguishing_aspect: "reported_ebitda below the 500000000 band threshold selects the 4% reserve rate: 400000000 -> reserve 16000000 -> normalized 384000000 -> valuation 2688000000."
        test_recipe:
          setup: ["Territory with a PROPOSED transfer at reported_ebitda_cents 400000000."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_ter
            - call: "POST /bottler/territory-transfers"
              payload: { territory_id: "${ter_id}", buyer_name: "Peachtree Consolidated", reported_ebitda_cents: 400000000 }
              as: PlatformAdmin
              captures: { tt_id: $.data.id, tt_v0: $.data.version }
          trigger:
            - call: "POST /bottler/territory-transfers/${tt_id}/valuate"
              payload: { expected_transfer_version: "${tt_v0}" }
              as: BrandOwnerAdmin
          assert:
            - "TerritoryTransfer.${tt_id}.valuation_cents == 2688000000"
            - "TerritoryTransfer.${tt_id}.status == VALUED and valuation_round == 1"

      - name: launch_penalty_exactly_ten_percent_shortfall_uses_lowest_tier
        claim_type: Correct Result
        grounds:
          - "calculations.innovation_min_volume_penalty"
        distinguishing_aspect: "Boundary of the tiered penalty: shortfall_pct == 0.10 exactly (45000 of 50000) uses the 5-cent tier (<= comparison) -> penalty 25000, one case fewer sold would jump to the 12-cent tier."
        test_recipe:
          setup: ["Launch IN_PRODUCTION with 45000 cases recorded of 50000 committed; clock past launch_end."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/innovation-launches"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", committed_cases: 50000, launch_start: "2026-09-01", launch_end: "2026-10-31" }
              as: BrandOwnerAdmin
              captures: { launch_id: $.data.id }
            - call: "POST /bottler/innovation-launches/${launch_id}/schedule-changeover"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/innovation-launches/${launch_id}/complete-changeover"
              payload: {}
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/innovation-launches/${launch_id}/record-sales"
              payload: { cases: 45000 }
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bottler/innovation-launches/${launch_id}/review-commitment"
              payload: {}
              as: BrandOwnerAdmin
          assert:
            - "InnovationLaunch.${launch_id}.status == PENALIZED"
            - "InnovationLaunch.${launch_id}.penalty_cents == 25000"
            - "BottlerAgreement.${ag_id}.margin_ledger_cents == -25000"

      - name: maintenance_overdue_gates_syrup_delivery_and_resets
        claim_type: Input Set Filtering
        grounds:
          - "entities.FountainAccount.fields.maintenance_overdue"
          - "errors[ERR_FOUNTAIN_MAINTENANCE_OVERDUE]"
        distinguishing_aspect: "A fresh fountain account is maintenance-overdue (no visit in trailing 90 days) and rejects deliveries; a maintenance visit clears the flag, and advancing the clock 100 days re-raises it — a time-windowed derived boolean."
        test_recipe:
          setup: ["ACTIVE agreement; FOUNTAIN customer with account; clock at 2026-09-01."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/customers"
              payload: { agreement_id: "${ag_id}", name: "Fizz Cinema", channel: "FOUNTAIN", local_price_cents: 190 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /bottler/fountain-accounts"
              payload: { customer_id: "${cust_id}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /bottler/fountain-accounts/${fa_id}/syrup-deliveries"
              payload: { gallons: 10 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /bottler/fountain-accounts/${fa_id}/maintenance"
              payload: {}
              as: FieldTechnician
            - call: "POST /bottler/fountain-accounts/${fa_id}/syrup-deliveries"
              payload: { gallons: 10 }
              as: BottlerOps
              as_user_id: "${ag_id}"
            - call: "POST /bottler/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bottler/fountain-accounts/${fa_id}/syrup-deliveries"
              payload: { gallons: 5 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "first delivery rejected with ERR_FOUNTAIN_MAINTENANCE_OVERDUE (fresh account, no visits)"
            - "after maintenance, delivery of 10 gallons accepted; syrup_on_hand_gallons == 10"
            - "after clock +100 days, delivery rejected again with ERR_FOUNTAIN_MAINTENANCE_OVERDUE"
            - "FountainAccount.${fa_id}.syrup_on_hand_gallons == 10 (rejected delivery added nothing)"

  # ===========================================================================
  - section: validations
    instances:

      - name: not_found_beats_state_check_on_missing_order
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=3]"
          - "validations[priority=4]"
        distinguishing_aspect: "deliver on a nonexistent order id returns 404 ERR_RESOURCE_NOT_FOUND (priority 3 existence) rather than any state error — even though a state check would also be meaningless."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: [*seed_clock]
          trigger:
            - call: "POST /bottler/dsd-orders/00000000-0000-0000-0000-000000000000/deliver"
              payload: {}
              as: BottlerOps
          assert:
            - "HTTP 404 with data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: clawback_referencing_other_agreements_accrual_rejected
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_REFERENTIAL_INTEGRITY]"
        distinguishing_aspect: "A CLAWBACK whose reference_entry_id points at an ACCRUAL owned by a DIFFERENT agreement fails referential validation (priority 6) before the fiscal clawback-amount check (priority 9) is even reached."
        test_recipe:
          setup: ["Two ACTIVE agreements in two territories; ag1 has a 2000000-cent accrual; ag2 has a 1000-case accrual (40000)."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/territories"
              payload: { brand_owner_id: "${bo_id}", code: "NO-ATL-09", region_label: "North Atlanta 09" }
              as: PlatformAdmin
              captures: { ter2_id: $.data.id }
            - call: "POST /bottler/territories/${ter2_id}/agreements"
              payload: { bottler_name: "Peachtree Bottling", concentrate_base_index: 100.0, marketing_accrual_basis: "CASE_VOLUME", service_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { ag2_id: $.data.id }
            - call: "POST /bottler/bottler-agreements/${ag2_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_id}", entry_type: "ACCRUAL", period: "2026-09", cases_sold: 50000 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { accrual1_id: $.data.id }
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag2_id}", entry_type: "ACCRUAL", period: "2026-09", cases_sold: 1000 }
              as: BottlerOps
              as_user_id: "${ag2_id}"
          trigger:
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag2_id}", entry_type: "CLAWBACK", period: "2026-09", requested_amount_cents: 30000, reference_entry_id: "${accrual1_id}" }
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_REFERENTIAL_INTEGRITY (cross-agreement reference)"
            - "BottlerAgreement.${ag2_id}.marketing_fund_balance_cents == 40000 (unchanged)"

      - name: nca_overlapping_window_rejected_adjacent_allowed
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_NCA_WINDOW_OVERLAP]"
          - "validations[priority=5]"
        distinguishing_aspect: "Closed-interval semantics: NCA2 sharing the date 2026-09-15 with NCA1's window is an overlap; NCA3 starting 2026-10-01 the day after NCA1's 2026-09-30 end shares no date and is allowed."
        test_recipe:
          setup: ["Brand; NCA1 2026-09-01..2026-09-30 PUBLISHED."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - call: "POST /bottler/national-customer-agreements"
              payload: { brand_owner_id: "${bo_id}", nca_code: "NCA-1", national_price_cents: 200, effective_start: "2026-09-01", effective_end: "2026-09-30" }
              as: BrandOwnerAdmin
              captures: { nca1_id: $.data.id }
            - call: "POST /bottler/national-customer-agreements/${nca1_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
            - call: "POST /bottler/national-customer-agreements"
              payload: { brand_owner_id: "${bo_id}", nca_code: "NCA-2", national_price_cents: 210, effective_start: "2026-09-15", effective_end: "2026-10-15" }
              as: BrandOwnerAdmin
              captures: { nca2_id: $.data.id }
            - call: "POST /bottler/national-customer-agreements"
              payload: { brand_owner_id: "${bo_id}", nca_code: "NCA-3", national_price_cents: 220, effective_start: "2026-10-01", effective_end: "2026-10-31" }
              as: BrandOwnerAdmin
              captures: { nca3_id: $.data.id }
          trigger:
            - call: "POST /bottler/national-customer-agreements/${nca2_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
            - call: "POST /bottler/national-customer-agreements/${nca3_id}/publish"
              payload: {}
              as: BrandOwnerAdmin
          assert:
            - "NCA2 publish rejected with ERR_NCA_WINDOW_OVERLAP (shares 2026-09-15..2026-09-30 with NCA1)"
            - "NCA3 publish succeeds (starts the day after NCA1 ends; closed intervals share no date)"

      - name: disbursement_exceeding_fund_balance_rejected
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_FUND_INSUFFICIENT_BALANCE]"
          - "calculations.marketing_fund_accrual"
        distinguishing_aspect: "Disbursement of 40001 against a 40000 balance fails; disbursement of exactly 40000 succeeds and drains the fund to 0 — boundary at exact balance."
        test_recipe:
          setup: ["ACTIVE agreement with a 1000-case accrual (balance 40000)."]
          setup_api_calls:
            - *seed_clock
            - *seed_bo
            - *seed_index
            - *seed_line
            - *seed_ter
            - *seed_ag
            - *seed_act
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_id}", entry_type: "ACCRUAL", period: "2026-09", cases_sold: 1000 }
              as: BottlerOps
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_id}", entry_type: "DISBURSEMENT", period: "2026-09", requested_amount_cents: 40001 }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
            - call: "POST /bottler/marketing-fund-ledger"
              payload: { agreement_id: "${ag_id}", entry_type: "DISBURSEMENT", period: "2026-09", requested_amount_cents: 40000 }
              as: BottlerOps
              as_user_id: "${ag_id}"
          assert:
            - "40001-cent disbursement rejected with ERR_FUND_INSUFFICIENT_BALANCE"
            - "40000-cent disbursement accepted; BottlerAgreement.${ag_id}.marketing_fund_balance_cents == 0"

      - name: duplicate_index_quarter_rejected
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_INDEX_QUARTER_DUPLICATE]"
          - "entities.ConcentratePriceIndex.fields.index_value"
        distinguishing_aspect: "The second ConcentratePriceIndex for the same (brand, quarter) pair is rejected with ERR_INDEX_QUARTER_DUPLICATE — per-quarter uniqueness is what makes the final-variant mean well-defined."
        test_recipe:
          setup: ["Brand with index 110.00 for 2026-Q2."]
          setup_api_calls: [*seed_clock, *seed_bo, *seed_index]
          trigger:
            - call: "POST /bottler/concentrate-price-indices"
              payload: { brand_owner_id: "${bo_id}", quarter: "2026-Q2", index_value: 115.00 }
              as: BrandOwnerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_INDEX_QUARTER_DUPLICATE"

      - name: cpo_below_min_quantity_on_active_agreement_rejected
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_MIN_ORDER_QUANTITY]"
          - "calculations.concentrate_unit_price"
        distinguishing_aspect: "On an ACTIVE agreement (state check passes), quantity_gallons 999 — one below the 1000 minimum — fails with ERR_MIN_ORDER_QUANTITY; 1000 exactly succeeds."
        test_recipe:
          setup: ["ACTIVE agreement (version 2)."]
          setup_api_calls: [*seed_clock, *seed_bo, *seed_index, *seed_line, *seed_ter, *seed_ag, *seed_act]
          trigger:
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 999, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
              captures: { err: $.data.error_id }
            - call: "POST /bottler/concentrate-purchase-orders"
              payload: { agreement_id: "${ag_id}", product_line_id: "${pl_id}", quantity_gallons: 1000, delivery_quarter: "2026-Q3", expected_agreement_version: "${ag_v1}" }
              as: BottlerOps
              as_user_id: "${ag_id}"
          assert:
            - "999-gallon order rejected with ERR_MIN_ORDER_QUANTITY (HTTP 422)"
            - "1000-gallon order accepted (HTTP 201) — boundary is inclusive at 1000"

