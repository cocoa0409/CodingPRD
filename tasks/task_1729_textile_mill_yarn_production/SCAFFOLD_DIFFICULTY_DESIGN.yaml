scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (2 instances on DIFFERENT entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quality_grading_provisional_vs_final
        grounds:
          - calculations.quality_grading
          - entities.QualityTest.fields.grade
        distinguishing_aspect: |
          Quality grading runs on QualityTest (a quality-domain entity) and uses
          two valid variants — provisional (oven-dry) vs final (conditioned) —
          that produce different grades for identical measured inputs.
        test_recipe:
          setup:
            - "A ShadeBand exists for customer 'ACME' color 'NAVY-2B'"
            - "A FiberLot and approved BlendRecipe exist"
            - "A YarnLot in DYEING status with a DyeLot in DYEING status"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_a: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CTN-100-A", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_a}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 5.5, hand_score: 4 }
              as: QualityInspector
              captures: { qt_id: $.data.id }
            - call: "PATCH /mill/quality-tests/${qt_id}"
              payload: { shrinkage_pct_final: 4.8 }
              as: QualityInspector
          assert:
            - "After POST (provisional only): QualityTest.${qt_id}.grade == SECOND_QUALITY (5.5 >= 5.0 threshold)"
            - "After PATCH (final=4.8): QualityTest.${qt_id}.grade == FIRST_QUALITY (4.8 < 5.0, hand_score 4 >= 3)"
            - "QualityTest.${qt_id}.grade differs between provisional and final variants for the same record"

      - name: blend_cost_forward_looking_vs_chronological
        grounds:
          - calculations.blend_cost_estimate
          - entities.BlendRecipe.fields.projected_cost_per_lb
          - entities.YarnLot.fields.actual_cost_per_lb
        distinguishing_aspect: |
          Blend cost runs on BlendRecipe (cost-accounting domain, forward_looking
          variant at approval) and again on YarnLot (chronological variant at
          spin completion), producing different cost-per-lb values for identical
          component inputs because the denominators differ.
        test_recipe:
          setup:
            - "Two FiberLots exist (A: 200 lbs @ $1.50/lb, B: 200 lbs @ $2.00/lb)"
            - "A BlendRecipe with 100 lbs of each component (total 200 lbs)"
            - "Recipe approved → projected_cost_per_lb recorded (forward_looking)"
            - "A YarnLot of spun_weight_lbs=180 (waste) exists; a MachineAssignment completes"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 200.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_a: $.data.id }
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "POLYESTER", received_weight_lbs: 200.0, unit_cost_per_lb: 2.0 }
              as: MillPlanner
              captures: { fl_b: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CTN-POLY-50-50", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_a}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_b}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
              captures: { rec_after: $.data }
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/spinning-machines"
              payload: { machine_code: "SPIN-01", supported_count_min_ne: 10.0, supported_count_max_ne: 30.0 }
              as: MillAdmin
              captures: { sm_id: $.data.id }
            - call: "POST /mill/machine-assignments"
              payload: { machine_id: "${sm_id}", yarn_lot_id: "${yl_id}", window_start: "2026-08-14T08:00:00Z", window_end: "2026-08-14T12:00:00Z" }
              as: SpinningSupervisor
              captures: { ma_id: $.data.id }
            - call: "POST /mill/machine-assignments/${ma_id}/start"
              payload: {}
              as: SpinningSupervisor
          trigger:
            - call: "POST /mill/machine-assignments/${ma_id}/complete"
              payload: {}
              as: SpinningSupervisor
          assert:
            - "BlendRecipe.${rec_id}.projected_cost_per_lb == 1.7500 (forward_looking: 350/200)"
            - "YarnLot.${yl_id}.actual_cost_per_lb == 1.9444 (chronological: 350/180, round_half_up to 4dp)"
            - "BlendRecipe.${rec_id}.projected_cost_per_lb != YarnLot.${yl_id}.actual_cost_per_lb"

  # =========================================================================
  # Rule 2 — combinatorial_formula (2 instances in DIFFERENT modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: yarn_count_deviation_three_input_threshold
        grounds:
          - calculations.yarn_count_deviation
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction:
          target_yarn_count_ne (recipe), actual_yarn_count_ne (lot), and
          spun_weight_lbs (waste proxy) interact to produce a deviation_pct
          that is thresholded at exactly 3.0%.
        test_recipe:
          setup:
            - "Recipe with target_yarn_count_ne=20.0 approved"
            - "YarnLot created with actual_yarn_count_ne=21.0 (5.0% deviation, over 3.0% tolerance)"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CTN-20NE", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
          trigger:
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 21.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
          assert:
            - "deviation_pct computed as (21.0 - 20.0)/20.0*100 == 5.0"
            - "5.0 > 3.0 (COUNT_TOLERANCE_PCT) so yarn-count-deviation flag is raised on the lot"

      - name: roll_yardage_round_per_roll_vs_sum_then_round
        grounds:
          - calculations.roll_yardage_total
        distinguishing_aspect: |
          Mode (b) — nested rounding order matters: put-up total uses
          round-per-roll-then-sum, allocation total uses sum-then-round; for
          identical rolls the two orderings produce different values.
        test_recipe:
          setup:
            - "An APPROVED DyeLot with grade FIRST_QUALITY exists"
            - "Three FinishedRolls each with put_up_yards=100.004 and actual_yards=100.004"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CTN-ROUND", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 3.0, hand_score: 5, shrinkage_pct_final: 3.0 }
              as: QualityInspector
            - call: "POST /mill/dye-lots/${dl_id}/submit-shade"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/approve"
              payload: {}
              as: QualityInspector
          trigger:
            - call: "POST /mill/finished-rolls"
              payload: { dye_lot_id: "${dl_id}", put_up_yards: 100.004, actual_yards: 100.004 }
              as: DyeHouseOperator
            - call: "POST /mill/finished-rolls"
              payload: { dye_lot_id: "${dl_id}", put_up_yards: 100.004, actual_yards: 100.004 }
              as: DyeHouseOperator
            - call: "POST /mill/finished-rolls"
              payload: { dye_lot_id: "${dl_id}", put_up_yards: 100.004, actual_yards: 100.004 }
              as: DyeHouseOperator
          assert:
            - "Put-up total (round-per-roll-then-sum) == 300.00 (each roll rounds 100.004 to 100.00)"
            - "Allocation total (sum-then-round) == 300.01 (300.012 rounds to 300.01)"
            - "The two orderings differ by 0.01 yards for identical inputs"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (2 instances on DIFFERENT entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: yarn_lot_rework_cycle_greige_dyeing_greige
        grounds:
          - state_machines.YarnLot.DYEING_to_GREIGE
        distinguishing_aspect: |
          Cyclic shape on YarnLot — DYEING → GREIGE rework loop permits a lot
          to be dyed, rejected, and resubmitted; not a forward-only pipeline.
        test_recipe:
          setup:
            - "A YarnLot in DYEING status with a DyeLot in SHADE_PENDING with grade REJECTED"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CTN-REWORK", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 9.0, hand_score: 2 }
              as: QualityInspector
            - call: "POST /mill/dye-lots/${dl_id}/submit-shade"
              payload: {}
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/reject"
              payload: {}
              as: QualityInspector
          assert:
            - "DyeLot.${dl_id}.status == REJECTED"
            - "YarnLot.${yl_id}.status == GREIGE (cycled back for rework)"
            - "YarnLot.${yl_id}.greige_yards_available restored by requested_yards (5000.0)"

      - name: blend_recipe_branching_approve_or_reject
        grounds:
          - state_machines.BlendRecipe.DRAFT_to_APPROVED
          - state_machines.BlendRecipe.DRAFT_to_REJECTED
        distinguishing_aspect: |
          Branching fork on BlendRecipe — from DRAFT the recipe forks to either
          APPROVED (with cost-projection side effect) or REJECTED (with
          component-detach side effect), each branch having divergent effects.
        test_recipe:
          setup:
            - "Two separate DRAFT BlendRecipes exist (one will be approved, one rejected)"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "BR-APPROVE", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_a: $.data.id, rec_a_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_a}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "BR-REJECT", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_b: $.data.id, rec_b_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_b}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 50.0 }
              as: MillPlanner
          trigger:
            - call: "POST /mill/blend-recipes/${rec_a}/approve"
              payload: { expected_recipe_version: "${rec_a_v}" }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_b}/reject"
              payload: {}
              as: MillPlanner
          assert:
            - "BlendRecipe.${rec_a}.status == APPROVED with projected_cost_per_lb populated"
            - "BlendRecipe.${rec_b}.status == REJECTED with all BlendComponents detached (empty list)"
            - "FiberLot.available_weight_lbs debited only by rec_a's 100 lbs; rec_b's 50 lbs not debited"

  # =========================================================================
  # Rule 4 — transitive_cascade (2 instances from DIFFERENT triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dye_lot_approve_cascade_yarn_finished_rolls_allowed
        grounds:
          - state_machines.DyeLot.SHADE_PENDING_to_APPROVED
          - state_machines.YarnLot.DYEING_to_FINISHED
        distinguishing_aspect: |
          Depth-3 cascade from DyeLot approval trigger: DyeLot SHADE_PENDING →
          APPROVED mutates YarnLot (DYEING → FINISHED), which itself enables
          FinishedRoll creation (POST /mill/finished-rolls now permitted); the
          second link is caused by the YarnLot's FINISHED state, not by the
          original approve call.
        test_recipe:
          setup:
            - "YarnLot in DYEING; DyeLot in SHADE_PENDING with passing QualityTest"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CASCADE-A", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 3.0, hand_score: 5, shrinkage_pct_final: 3.0 }
              as: QualityInspector
            - call: "POST /mill/dye-lots/${dl_id}/submit-shade"
              payload: {}
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/approve"
              payload: {}
              as: QualityInspector
            - call: "POST /mill/finished-rolls"
              payload: { dye_lot_id: "${dl_id}", put_up_yards: 2000.0, actual_yards: 2000.0 }
              as: DyeHouseOperator
              captures: { roll_id: $.data.id }
          assert:
            - "DyeLot.${dl_id}.status == APPROVED"
            - "YarnLot.${yl_id}.status == FINISHED (cascaded)"
            - "FinishedRoll creation now permitted; roll ${roll_id} created with status AVAILABLE"
            - "Before DyeLot approval, POST /mill/finished-rolls would have failed with ERR_REFERENTIAL_VIOLATION"

      - name: customer_order_cancel_cascade_rolls_released
        grounds:
          - state_machines.CustomerOrder.PARTIALLY_ALLOCATED_to_CANCELLED
          - state_machines.FinishedRoll.ALLOCATED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-2 cascade from order cancel trigger: CustomerOrder PARTIALLY_ALLOCATED
          → CANCELLED mutates each allocated FinishedRoll (ALLOCATED → AVAILABLE),
          which itself triggers CustomerOrder.allocated_yards recompute (zeroing).
        test_recipe:
          setup:
            - "A CustomerOrder in PARTIALLY_ALLOCATED status with one roll ALLOCATED"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "CASCADE-B", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 3.0, hand_score: 5, shrinkage_pct_final: 3.0 }
              as: QualityInspector
            - call: "POST /mill/dye-lots/${dl_id}/submit-shade"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl_id}/approve"
              payload: {}
              as: QualityInspector
            - call: "POST /mill/finished-rolls"
              payload: { dye_lot_id: "${dl_id}", put_up_yards: 2000.0, actual_yards: 2000.0 }
              as: DyeHouseOperator
              captures: { roll_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", requested_yards: 5000.0 }
              as: CustomerServiceRep
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /mill/customer-orders/${ord_id}/allocate"
              payload: { roll_id: "${roll_id}", expected_order_version: "${ord_v}" }
              as: CustomerServiceRep
          trigger:
            - call: "POST /mill/customer-orders/${ord_id}/cancel"
              payload: {}
              as: CustomerServiceRep
          assert:
            - "CustomerOrder.${ord_id}.status == CANCELLED"
            - "FinishedRoll.${roll_id}.status == AVAILABLE (cascade-released)"
            - "FinishedRoll.${roll_id}.allocated_order_id == null"
            - "CustomerOrder.${ord_id}.allocated_yards == 0.0"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances DIFFERENT pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_dye_approve
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Conflict between priority-5 (state) and priority-6 (business_safety) —
          a request that violates both MUST surface ERR_INVALID_STATE (priority 5
          wins over priority 6).
        test_recipe:
          setup:
            - "DyeLot is in SUBMITTED status (wrong state for approve) AND no QualityTest exists (would also fail quality gate)"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "PRIO-A", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/approve"
              payload: {}
              as: QualityInspector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE (state priority 5 wins over business_safety priority 6)"
            - "error_id != ERR_QUALITY_GATE_FAILED"

      - name: referential_vs_fiscal_finished_roll_create
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Conflict between priority-9 (business_referential) and priority-10
          (business_fiscal) — a FinishedRoll create against a non-APPROVED DyeLot
          whose parent YarnLot also lacks greige yards MUST surface the
          referential error.
        test_recipe:
          setup:
            - "DyeLot exists but is in SUBMITTED status (not APPROVED)"
            - "Setup is such that if the state check were skipped the roll would also fail — but we test only the referential-vs-fiscal ordering"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "PRIO-B", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
          trigger:
            - call: "POST /mill/finished-rolls"
              payload: { dye_lot_id: "${dl_id}", put_up_yards: 1000.0, actual_yards: 1000.0 }
              as: DyeHouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_REFERENTIAL_VIOLATION (priority 9 referential fires before any fiscal check on roll create)"
            - "No FinishedRoll is created"

  # =========================================================================
  # Rule 6 — boundary_precision_check (2 instances DIFFERENT metrics/endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: shrinkage_exactly_at_second_quality_threshold
        grounds:
          - calculations.quality_grading
          - entities.QualityTest.fields.shrinkage_pct_provisional
        distinguishing_aspect: |
          Numeric threshold at exactly 5.0 — shrinkage_pct_provisional = 5.0
          satisfies >= 5.0 and yields SECOND_QUALITY (not FIRST_QUALITY); tested
          via POST /mill/dye-lots/{id}/quality-tests.
        test_recipe:
          setup:
            - "DyeLot in DYEING status ready for quality test"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "BOUND-A", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 5000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
            - call: "POST /mill/dye-lots/${dl_id}/start"
              payload: {}
              as: DyeHouseOperator
          trigger:
            - call: "POST /mill/dye-lots/${dl_id}/quality-tests"
              payload: { shrinkage_pct_provisional: 5.0, hand_score: 5 }
              as: QualityInspector
              captures: { qt_id: $.data.id }
          assert:
            - "QualityTest.${qt_id}.grade == SECOND_QUALITY (boundary: 5.0 >= 5.0 is inclusive)"
            - "QualityTest.${qt_id}.grade != FIRST_QUALITY"

      - name: yarn_lot_zero_greige_yards_dye_submission
        grounds:
          - calculations.greige_allocation
          - entities.YarnLot.fields.greige_yards_available
        distinguishing_aspect: |
          Empty-set/zero-quantity boundary on a different metric (greige yards
          vs shrinkage percent) reachable through POST /mill/dye-lots — when
          greige_yards_available is exactly 0, any requested_yards > 0 is
          rejected with ERR_INSUFFICIENT_CAPACITY.
        test_recipe:
          setup:
            - "A YarnLot whose greige_yards_available has been fully consumed by an earlier DyeLot"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "BOUND-B", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 200.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 180.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/shade-bands"
              payload: { customer_code: "ACME", color_code: "NAVY-2B", centroid_l: 30.0, centroid_a: 5.0, centroid_b: -20.0, delta_e_tolerance: 1.5 }
              as: CustomerServiceRep
              captures: { sb_id: $.data.id }
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-01", scheduled_at: "2026-08-14T08:00:00Z", requested_yards: 3024000.0 }
              as: DyeHouseOperator
              captures: { dl_id: $.data.id }
          trigger:
            - call: "POST /mill/dye-lots"
              payload: { yarn_lot_id: "${yl_id}", shade_band_id: "${sb_id}", vat_id: "VAT-02", scheduled_at: "2026-08-14T09:00:00Z", requested_yards: 1.0 }
              as: DyeHouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "First dye-lot consumed all greige_yards_available (180 lbs * 16800 yards/lb at Ne=20 = 3,024,000)"
            - "HTTP status == 422"
            - "error_id == ERR_INSUFFICIENT_CAPACITY (zero-yards boundary)"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances DIFFERENT entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dye_lot_create_requires_recipe_approved
        grounds:
          - state_machines.YarnLot.GREIGE_to_DYEING
          - validations[priority=6]
        distinguishing_aspect: |
          YarnLot → BlendRecipe dependency: submitting a DyeLot for a YarnLot
          requires the YarnLot's BlendRecipe.status == APPROVED; a DRAFT or
          REJECTED recipe blocks the transition (entity pair YarnLot/BlendRecipe).
        test_recipe:
          setup:
            - "A YarnLot created against a DRAFT BlendRecipe (test setup constructs this directly via create-then-attempt)"
            - "Note: since YarnLot creation does not validate recipe status (only DyeLot create does), we can land a YarnLot tied to a DRAFT recipe"
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "XDEP-A", target_yarn_count_ne: 20.0 }
