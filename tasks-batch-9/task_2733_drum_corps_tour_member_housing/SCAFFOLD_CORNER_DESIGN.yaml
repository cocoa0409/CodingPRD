              as: TourManager
              captures: { agreement_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "GET /facility-agreements/${agreement_id}"
              as: MembershipCoordinator
              captures: { agreement_v: "$.data.version" }
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_id}", space_index: 3, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_v}" }
              as: MembershipCoordinator
              captures: { housing_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Rockford High School", city: "Rockford", state_code: "IL", arrive_at: "2027-05-15T08:00:00Z", depart_at: "2027-05-15T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
