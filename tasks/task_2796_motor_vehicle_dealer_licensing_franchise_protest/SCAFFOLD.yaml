scenario: |
  2796. Motor Vehicle Dealer Licensing & Franchise Protest (state motor vehicle dealer board): dealer license application with facility, bond, insurance and zoning requirements, salesperson licensing and disciplinary history checks, franchise agreement filings with notice requirements for termination, relocation and additional points, protest filing by an incumbent dealer with good-cause hearing standards and market analysis evidence, hearing scheduling, evidence submission and board decision with appeal to court, warranty reimbursement rate disputes between dealers and manufacturers, consumer complaint investigation against dealers with sanctions and restitution, license renewal, change of ownership and location approval
domain_name: motor-vehicle-dealer-board
api_prefix: /dealer-board

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: flat
  # Peer entities linked by foreign keys in request bodies; every collection is a
  # top-level path under /dealer-board. Only MarketStudy and EvidenceSubmission are
  # addressed as sub-resources of Protest (append-only evidence logs).

  state_machine_shape: cyclic
  # LicenseApplication SUBMITTED<->DEFICIENT revision loop, FranchiseFiling
  # PROTEST_PENDING->NOTICE_SERVED amendment loop, Salesperson LICENSED->RENEWAL_PENDING
  # ->LICENSED renewal loop, plus parallel state dimensions on Dealer
  # (license_status x franchise_status) and Salesperson (license_status x discipline_status),
  # plus a branching fork at POST /protests/{id}/convene (HEARD vs DISMISSED).

  relationship_patterns:
    - one_to_many          # Dealer -> LicenseApplication, Protest -> MarketStudy
    - cross_aggregate      # Protest -> FranchiseFiling -> Manufacturer, ConsumerComplaint -> Dealer + Salesperson
    - polymorphic_party    # submitted_by_party / submitting_party selects which FK owns the row (PROTESTANT -> Protest.protestant_dealer_id, MANUFACTURER -> FranchiseFiling.manufacturer_id)

  role_model: segregation_of_duties
  # LicensingAnalyst issues deficiency notices and salesperson licence decisions but
  # cannot decide dealer applications; BoardAdmin decides but cannot issue deficiency
  # notices; the operator who intook/investigated a ConsumerComplaint (X-User-ID recorded
  # as investigator_user_id) may not be the X-User-ID that resolves it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the franchisor / distributor.
      - name: line_make
        type: string
        source: input
        description: Vehicle line make this franchisor distributes in the state (e.g. "AURORA").
        constraints: "uppercase A-Z only, 2..20 chars; unique across Manufacturer rows"
      - name: home_office_state
        type: string
        source: input
        description: Two-letter state code of the franchisor home office.
        constraints: "exactly 2 uppercase letters"
      - name: posted_warranty_labor_rate_cents
        type: integer
        source: input
        description: Warranty labor rate per hour the franchisor currently posts to its dealers, in cents.
        constraints: ">= 1000 and <= 100000"
      - name: state_registration_status
        type: enum
        source: input
        description: Franchisor state registration standing.
        default: REGISTERED
        constraints: "{REGISTERED, LAPSED}"
      - name: open_dispute_count
        type: integer
        source: computed
        description: "Count of WarrantyRateDispute rows with manufacturer_id == this id AND status IN {FILED, UNDER_REVIEW}."
        default: 0
      - name: active_filing_count
        type: integer
        source: computed
        description: "Count of FranchiseFiling rows with manufacturer_id == this id AND status IN {NOTICE_SERVED, PROTEST_PENDING}."
        default: 0

  - name: HearingRoom
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: Board hearing room identifier.
        constraints: "unique across HearingRoom rows; 2..12 chars"
      - name: seating_capacity
        type: integer
        source: input
        description: Physical seats in the room.
        constraints: ">= 10 and <= 400"
      - name: max_hearings_per_day
        type: integer
        source: input
        description: Maximum number of protest hearings this room may host on one UTC calendar date.
        default: 2
        constraints: ">= 1 and <= 4"
      - name: buffer_minutes
        type: integer
        source: input
        description: Mandatory changeover buffer that must separate two hearings in this room, in minutes.
        default: 60
        constraints: ">= 0 and <= 240"
      - name: booked_hearing_count
        type: integer
        source: computed
        description: "Count of Protest rows with hearing_room_id == this id AND status IN {SCHEDULED, HEARD}. Conserved quantity of the room-slot invariant (see calculations.room_slot_conservation)."
        default: 0

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the dealership entity.
      - name: dealer_type
        type: enum
        source: input
        description: Licence class applied for; drives every facility/bond/insurance minimum.
        constraints: "{NEW_MOTOR_VEHICLE, USED_ONLY}"
      - name: county_tier
        type: enum
        source: input
        description: Population tier of the county of the established place of business; drives the fee multiplier.
        constraints: "{TIER_1, TIER_2, TIER_3}"
      - name: line_make
        type: string
        source: input
        description: Line make the dealership sells new. Empty string for USED_ONLY dealers.
        constraints: "uppercase A-Z, 0..20 chars"
      - name: site_x_km
        type: number
        source: input
        description: Established place of business, x coordinate on the board's planar market grid, in km.
        constraints: ">= -500 and <= 500, at most 2 decimal places"
      - name: site_y_km
        type: number
        source: input
        description: Established place of business, y coordinate on the board's planar market grid, in km.
        constraints: ">= -500 and <= 500, at most 2 decimal places"
      - name: license_status
        type: enum
        source: system
        description: "Licence dimension of the Dealer's parallel state machine. Independent of franchise_status."
        default: PROSPECTIVE
        constraints: "{PROSPECTIVE, LICENSED, SUSPENDED, EXPIRED, REVOKED, CANCELLED}"
      - name: franchise_status
        type: enum
        source: system
        description: "Franchise dimension of the Dealer's parallel state machine. Independent of license_status."
        default: NONE
        constraints: "{NONE, FRANCHISED, TERMINATION_PENDING, TERMINATED}"
      - name: suspension_reason
        type: enum
        source: system
        description: Why license_status is SUSPENDED; NONE whenever license_status != SUSPENDED.
        default: NONE
        constraints: "{NONE, DISCIPLINARY_POINTS, RESTITUTION_DELINQUENT}"
      - name: license_effective_on
        type: string
        source: system
        description: "First day of the current licence term (ISO date, YYYY-MM-DD); null before the first approval."
      - name: license_expires_on
        type: string
        source: system
        description: "Last day of the current licence term, inclusive (ISO date). license term interval is [license_effective_on, license_expires_on + 1 day)."
      - name: disciplinary_points
        type: integer
        source: computed
        description: "Rolling 730-day disciplinary point total; see calculations.dealer_disciplinary_points."
        default: 0
      - name: restitution_outstanding_cents
        type: integer
        source: computed
        description: "Unpaid restitution across all of this dealer's complaints; see calculations.restitution_ledger."
        default: 0
      - name: licensed_salesperson_count
        type: integer
        source: computed
        description: "Count of Salesperson rows with sponsoring_dealer_id == this id AND license_status == LICENSED."
        default: 0
      - name: approved_warranty_labor_rate_cents
        type: integer
        source: system
        description: Warranty labor rate the board has approved for this dealer, in cents; null until a WarrantyRateDispute is APPROVED.

  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the applicant dealership. Must equal X-User-ID when the caller's role is Dealer."
      - name: application_type
        type: enum
        source: input
        description: Kind of licence action requested.
        constraints: "{INITIAL, RENEWAL, CHANGE_OF_OWNERSHIP, RELOCATION}"
      - name: status
        type: enum
        source: system
        description: Application lifecycle state.
        default: DRAFT
        constraints: "{DRAFT, SUBMITTED, DEFICIENT, APPROVED, DENIED, VOID_SPONSOR_CANCELLED}"
      - name: facility_sqft
        type: integer
        source: input
        description: Enclosed showroom + office square footage of the established place of business.
        constraints: ">= 0 and <= 500000"
      - name: display_spaces
        type: integer
        source: input
        description: Off-street vehicle display spaces at the site.
        constraints: ">= 0 and <= 2000"
      - name: service_bays
        type: integer
        source: input
        description: Service bays available for warranty and repair work.
        constraints: ">= 0 and <= 200"
      - name: bond_amount_cents
        type: integer
        source: input
        description: Surety bond posted with the application, in cents.
        constraints: ">= 0"
      - name: insurance_liability_cents
        type: integer
        source: input
        description: Garage liability insurance per-occurrence limit, in cents.
        constraints: ">= 0"
      - name: zoning_certificate_status
        type: enum
        source: input
        description: Municipal zoning certificate standing for the site.
        constraints: "{APPROVED, CONDITIONAL, PENDING, DENIED}"
      - name: line_make_count
        type: integer
        source: input
        description: Number of distinct line makes to be franchised at the site; 0 for USED_ONLY applicants.
        constraints: ">= 0 and <= 12"
      - name: requested_term_start_on
        type: string
        source: input
        description: "Requested first day of the licence term (ISO date)."
      - name: relocation_site_x_km
        type: number
        source: input
        description: Proposed new site x coordinate in km; required when application_type == RELOCATION, ignored otherwise.
      - name: relocation_site_y_km
        type: number
        source: input
        description: Proposed new site y coordinate in km; required when application_type == RELOCATION, ignored otherwise.
      - name: new_owner_name
        type: string
        source: input
        description: Transferee name; required when application_type == CHANGE_OF_OWNERSHIP, ignored otherwise.
      - name: deficiency_codes
        type: array
        source: computed
        description: "Ascending-sorted list of unmet statutory requirement codes; see calculations.application_deficiency_scan."
        default: []
      - name: deficiency_count
        type: integer
        source: computed
        description: "len(deficiency_codes)."
        default: 0
      - name: fee_quoted_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculations.license_fee_assessment, frozen at submit/resubmit time."
      - name: fee_total_cents
        type: integer
        source: computed
        description: "FINAL variant of calculations.license_fee_assessment, recomputed at decision time; null before a decision."
      - name: fee_delta_cents
        type: integer
        source: computed
        description: "fee_total_cents - fee_quoted_cents; null before a decision."
      - name: resubmission_count
        type: integer
        source: system
        description: Number of times the applicant has resubmitted after a deficiency notice.
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit or resubmit; null while DRAFT.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the board decision; null before a decision.
      - name: decision_outcome
        type: enum
        source: system
        description: Board disposition of the application; null before a decision.
        constraints: "{APPROVED, DENIED}"
      - name: denial_reason_code
        type: string
        source: input
        description: Free-form denial reason recorded on the decision; required when outcome == DENIED.
      - name: deficiency_note
        type: string
        source: input
        description: Analyst narrative attached by the most recent deficiency notice; null until one is issued.

  - name: Salesperson
    parent: null
    common_fields: true
    fields:
      - name: sponsoring_dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealership sponsoring this salesperson licence."
      - name: full_name
        type: string
        source: input
        description: Salesperson legal name.
      - name: disclosed_prior_discipline
        type: boolean
        source: input
        description: Applicant's disclosure of prior disciplinary action in any jurisdiction.
      - name: license_status
        type: enum
        source: system
        description: "Licence dimension of the Salesperson's parallel state machine; evolves independently of discipline_status."
        default: PENDING
        constraints: "{PENDING, LICENSED, RENEWAL_PENDING, DENIED, SUSPENDED_BY_SPONSOR, EXPIRED}"
      - name: discipline_status
        type: enum
        source: system
        description: "Discipline dimension of the Salesperson's parallel state machine; evolves independently of license_status."
        default: CLEAR
        constraints: "{CLEAR, PROBATION, SUSPENDED_DISCIPLINARY, REINSTATED}"
      - name: disciplinary_points
        type: integer
        source: computed
        description: "Rolling 730-day point total from complaints naming this salesperson; see calculations.salesperson_disciplinary_points."
        default: 0
      - name: waiver_granted
        type: boolean
        source: input
        description: Analyst waiver of a disclosed prior disciplinary history, recorded on the licence decision.
        default: false
      - name: license_effective_on
        type: string
        source: system
        description: "First day of the current salesperson licence year (ISO date); null while PENDING."
      - name: license_expires_on
        type: string
        source: system
        description: "Last day of the current salesperson licence year, inclusive (ISO date); null while PENDING."
      - name: renewal_count
        type: integer
        source: system
        description: Number of completed renewals.
        default: 0
      - name: denial_reason_code
        type: string
        source: input
        description: Reason recorded when a licence decision denies the application.

  - name: FranchiseFiling
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the franchisor making the filing. Must equal X-User-ID when the caller's role is Manufacturer."
      - name: affected_dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer whose franchise is being terminated or relocated. Required for filing_type IN {TERMINATION, RELOCATION}, must be omitted for ADDITIONAL_POINT."
      - name: filing_type
        type: enum
        source: input
        description: Statutory action the franchisor proposes.
        constraints: "{TERMINATION, RELOCATION, ADDITIONAL_POINT}"
      - name: line_make
        type: string
        source: system
        description: Copied from Manufacturer.line_make at creation; the line make whose representation is at issue.
      - name: status
        type: enum
        source: system
        description: Filing lifecycle state.
        default: DRAFT
        constraints: "{DRAFT, NOTICE_SERVED, PROTEST_PENDING, PROTEST_RESOLVED, EFFECTIVE, BARRED}"
      - name: proposed_effective_on
        type: string
        source: input
        description: "Date (ISO) on which the franchisor proposes the action to take effect."
      - name: site_x_km
        type: number
        source: input
        description: Proposed new point / relocation destination x coordinate in km; required for filing_type IN {RELOCATION, ADDITIONAL_POINT}.
      - name: site_y_km
        type: number
        source: input
        description: Proposed new point / relocation destination y coordinate in km; required for filing_type IN {RELOCATION, ADDITIONAL_POINT}.
      - name: termination_cause_code
        type: string
        source: input
        description: Statutory cause cited for termination; required for filing_type == TERMINATION.
      - name: notice_served_on
        type: string
        source: system
        description: "Logical-clock date (ISO) on which notice was served or re-served; null while DRAFT."
      - name: notice_days_provided
        type: integer
        source: computed
        description: "proposed_effective_on - notice_served_on in whole days; null while DRAFT."
      - name: protest_window_ends_on
        type: string
        source: system
        description: "Last day (ISO, inclusive) on which an incumbent may file a protest; notice_served_on + 30 days."
      - name: amendment_count
        type: integer
        source: system
        description: Number of amendments served on this filing.
        default: 0
      - name: active_protest_count
        type: integer
        source: computed
        description: "Count of Protest rows with franchise_filing_id == this id AND status IN {FILED, SCHEDULED, HEARD, SUSTAINED}. An APPEALED protest is deliberately excluded here: a pending court appeal is caught by the dedicated appeal guard (validations priority 67, ERR_APPEAL_PENDING), not by this count."
        default: 0

  - name: Protest
    parent: null
    common_fields: true
    fields:
      - name: franchise_filing_id
        type: string
        source: input
        description: "FK -> FranchiseFiling.id; the filing being protested."
      - name: protestant_dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the incumbent dealer filing the protest. Must equal X-User-ID when the caller's role is Dealer."
      - name: hearing_room_id
        type: string
        source: input
        description: "FK -> HearingRoom.id; room holding the scheduled hearing. Null until scheduled and cleared again whenever the hearing slot is released."
      - name: status
        type: enum
        source: system
        description: Protest lifecycle state.
        default: FILED
        constraints: "{FILED, SCHEDULED, HEARD, SUSTAINED, DENIED, APPEALED, FINAL, WITHDRAWN, DISMISSED}"
      - name: grounds_code
        type: enum
        source: input
        description: Statutory ground asserted by the protestant.
        constraints: "{INADEQUATE_REPRESENTATION, NO_GOOD_CAUSE_FOR_TERMINATION, MARKET_ENCROACHMENT}"
      - name: filed_on
        type: string
        source: system
        description: "Logical-clock date (ISO) the protest was filed."
      - name: distance_to_site_km
        type: number
        source: computed
        description: "Planar distance from the protestant's site to the filing's proposed site; see calculations.relevant_market_distance. Null for TERMINATION filings."
      - name: hearing_start_at
        type: datetime
        source: input
        description: Scheduled hearing start instant (UTC); null until scheduled.
      - name: hearing_end_at
        type: datetime
        source: input
        description: Scheduled hearing end instant (UTC); null until scheduled.
      - name: hearing_session_count
        type: integer
        source: input
        description: Number of billable hearing sessions (days of testimony) reserved; null until scheduled.
        constraints: ">= 1 and <= 3"
      - name: evidence_deadline_at
        type: datetime
        source: computed
        description: "hearing_start_at - 7 days; the inclusive cut-off for evidence submitted as of right."
      - name: accepted_evidence_pages
        type: integer
        source: computed
        description: "Sum of EvidenceSubmission.page_count for this protest with acceptance_status IN {ACCEPTED, LATE_ACCEPTED}."
        default: 0
      - name: late_evidence_count
        type: integer
        source: computed
        description: "Count of EvidenceSubmission rows for this protest with acceptance_status == LATE_ACCEPTED."
        default: 0
      - name: good_cause_score
        type: number
        source: computed
        description: "Weighted statutory good-cause score; see calculations.good_cause_score. Null until at least one probative PROTESTANT MarketStudy exists."
      - name: good_cause_threshold
        type: number
        source: computed
        description: "40.00 when the filing is a TERMINATION (franchisor bears the burden), 60.00 otherwise."
      - name: decided_on
        type: string
        source: system
        description: "Logical-clock date (ISO) of the board decision; null before a decision."
      - name: findings_note
        type: string
        source: input
        description: Board narrative recorded with the decision.
      - name: assessment_total_cents
        type: integer
        source: computed
        description: "Total hearing cost assessment; see calculations.hearing_cost_assessment. Null before a decision."
      - name: protestant_share_cents
        type: integer
        source: computed
        description: Protestant's share of assessment_total_cents; null before a decision.
      - name: manufacturer_share_cents
        type: integer
        source: computed
        description: Franchisor's share of assessment_total_cents; null before a decision.
      - name: appeal_filed_on
        type: string
        source: system
        description: "Logical-clock date (ISO) an appeal to the circuit court was noticed; null unless appealed."
      - name: appellant_party
        type: enum
        source: system
        description: Party that noticed the appeal, derived from the caller's role.
        constraints: "{PROTESTANT, MANUFACTURER}"
      - name: court_docket_number
        type: string
        source: input
        description: Circuit court docket number supplied when the appeal is noticed.

  - name: MarketStudy
    parent: null
    common_fields: false
    description_note: Append-only market analysis evidence; never updated once filed.
    fields:
      - name: protest_id
        type: string
        source: input
        description: "FK -> Protest.id; the protest this study is evidence in."
      - name: submitted_by_party
        type: enum
        source: input
        description: Party tendering the study. PROTESTANT rows must be posted by the protestant dealer, MANUFACTURER rows by the filing's franchisor.
        constraints: "{PROTESTANT, MANUFACTURER}"
      - name: basis
        type: enum
        source: input
        description: Statutory basis chosen for expected penetration.
        constraints: "{STATEWIDE_AVERAGE, COMPARABLE_MARKET}"
      - name: total_market_registrations
        type: integer
        source: input
        description: New-vehicle registrations of all line makes in the relevant market area over the study year.
        constraints: ">= 0"
      - name: line_make_registrations
        type: integer
        source: input
        description: Registrations of the filing's line_make in the relevant market area over the study year.
        constraints: ">= 0 and <= total_market_registrations"
      - name: statewide_line_make_share_pct
        type: number
        source: input
        description: Statewide share of the line make, in percent; required when basis == STATEWIDE_AVERAGE, ignored otherwise.
        constraints: ">= 0.00 and <= 100.00, 2 decimal places"
      - name: comparable_market_shares_pct
        type: array
        source: input
        description: Line-make shares of the chosen comparable markets, in percent; required (length >= 1) when basis == COMPARABLE_MARKET, ignored otherwise.
      - name: permanency_investment_cents
        type: integer
        source: input
        description: Permanency-of-investment figure tendered for the protestant's dealership, in cents.
        constraints: ">= 0"
      - name: consumer_access_drive_minutes
        type: integer
        source: input
        description: Drive time this study attributes to consumers reaching an authorised outlet, in minutes.
        constraints: ">= 0 and <= 600"
      - name: market_growth_pct
        type: number
        source: input
        description: Projected annual growth of the relevant market area, in percent.
        constraints: ">= -50.00 and <= 100.00, 2 decimal places"
      - name: actual_penetration_pct
        type: number
        source: computed
        description: "round_half_up(100 * line_make_registrations / total_market_registrations, 2); 0.00 when total_market_registrations == 0."
      - name: expected_penetration_pct
        type: number
        source: computed
        description: "Basis-dependent expected penetration; see calculations.market_penetration_analysis."
      - name: shortfall_pts
        type: number
        source: computed
        description: "max(0.00, round_half_up(expected_penetration_pct - actual_penetration_pct, 2))."
      - name: is_probative
        type: boolean
        source: computed
        description: "false when total_market_registrations == 0 (no divisor); true otherwise. Non-probative studies are excluded from good-cause scoring."

  - name: EvidenceSubmission
    parent: null
    common_fields: false
    description_note: Append-only exhibit log for a protest hearing.
    fields:
      - name: protest_id
        type: string
        source: input
        description: "FK -> Protest.id; the protest whose record this exhibit joins."
      - name: submitting_party
        type: enum
        source: input
        description: Party tendering the exhibit.
        constraints: "{PROTESTANT, MANUFACTURER}"
      - name: exhibit_label
        type: string
        source: input
        description: Exhibit label as marked in the record.
        constraints: "1..20 chars; unique per (protest_id, submitting_party)"
      - name: page_count
        type: integer
        source: input
        description: Pages tendered; drives the transcript component of the cost assessment.
        constraints: ">= 1 and <= 5000"
      - name: leave_granted
        type: boolean
        source: input
        description: Presiding officer's leave to file after the evidence deadline. Ignored when the filing is timely.
        default: false
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant the exhibit was received.
      - name: acceptance_status
        type: enum
        source: computed
        description: "ACCEPTED when received_at <= protest.evidence_deadline_at; LATE_ACCEPTED when received_at > evidence_deadline_at AND received_at < protest.hearing_start_at AND leave_granted == true."
        constraints: "{ACCEPTED, LATE_ACCEPTED}"
      - name: is_late
        type: boolean
        source: computed
        description: "acceptance_status == LATE_ACCEPTED."

  - name: WarrantyRateDispute
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealer seeking a warranty labor rate above the franchisor's posted rate. Must equal X-User-ID when the caller's role is Dealer."
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the franchisor whose posted rate is challenged."
      - name: status
        type: enum
        source: system
        description: Dispute lifecycle state.
        default: FILED
        constraints: "{FILED, UNDER_REVIEW, APPROVED, DENIED, DISMISSED_MOOT}"
      - name: repair_order_lines
        type: array
        source: input
        description: "Sample of retail repair orders; each element is { labor_charge_cents: integer >= 0, labor_hours: number > 0.0 with at most 1 decimal, repair_type: {CUSTOMER_PAID, WARRANTY, INTERNAL} }. Order is preserved and is the index basis for excluded_line_indexes."
        constraints: "length >= 1 and <= 100"
      - name: filed_on
        type: string
        source: system
        description: "Logical-clock date (ISO) the dispute was filed."
      - name: qualifying_line_count
        type: integer
        source: computed
        description: "Count of repair_order_lines with repair_type == CUSTOMER_PAID AND labor_hours >= 0.5."
      - name: declared_rate_cents
        type: integer
        source: computed
        description: "PER_ORDER_MEAN variant of calculations.warranty_labor_rate_determination, computed at filing."
      - name: counter_rate_cents
        type: integer
        source: computed
        description: "AGGREGATE_WEIGHTED variant of calculations.warranty_labor_rate_determination, computed when the franchisor rebuts; null otherwise."
      - name: manufacturer_response_type
        type: enum
        source: input
        description: Franchisor's answer to the sample; null until answered.
        constraints: "{ACCEPT, REBUT}"
      - name: excluded_line_indexes
        type: array
        source: input
        description: Zero-based indexes into repair_order_lines the franchisor asks the board to disregard; only meaningful with manufacturer_response_type == REBUT.
        default: []
      - name: spread_pct
        type: number
        source: computed
        description: "round_half_up(100 * (declared_rate_cents - counter_rate_cents) / counter_rate_cents, 2); null when there is no counter rate."
      - name: approved_rate_cents
        type: integer
        source: computed
        description: Rate the board approves, in cents; null until the dispute is APPROVED.
      - name: effective_on
        type: string
        source: computed
        description: "decided_on + 30 days (ISO date); null until APPROVED."
      - name: decided_on
        type: string
        source: system
        description: "Logical-clock date (ISO) of the board's disposition; null before a decision."
      - name: denial_reason_code
        type: string
        source: input
        description: Reason recorded when the board denies the requested rate.

  - name: ConsumerComplaint
    parent: null
    common_fields: true
    fields:
      - name: dealer_id
        type: string
        source: input
        description: "FK -> Dealer.id; the dealership complained of."
      - name: salesperson_id
        type: string
        source: input
        description: "FK -> Salesperson.id; the individual named in the complaint, when one is named. Null for dealership-only complaints."
      - name: complainant_name
        type: string
        source: input
        description: Name of the consumer.
      - name: allegation_code
        type: enum
        source: input
        description: Statutory allegation; drives the civil penalty base.
        constraints: "{ODOMETER_MISREPRESENTATION, FAILURE_TO_TRANSFER_TITLE, ADVERTISING_VIOLATION, DEPOSIT_RETENTION, UNLICENSED_SALESPERSON}"
      - name: alleged_loss_cents
        type: integer
        source: input
        description: Consumer's claimed loss, in cents.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Complaint lifecycle state.
        default: RECEIVED
        constraints: "{RECEIVED, UNDER_INVESTIGATION, SANCTIONED, CLOSED_UNSUBSTANTIATED, CLOSED_SATISFIED}"
      - name: investigator_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplaintInvestigator that intook the complaint; the segregation-of-duties comparand at resolution.
      - name: findings_code
        type: string
        source: input
        description: Investigation findings code recorded when the investigation opens.
      - name: substantiated
        type: boolean
        source: input
        description: Board determination at resolution; null before resolution.
      - name: sanction_type
        type: enum
        source: input
        description: Sanction imposed; required when substantiated == true, must be omitted otherwise.
        constraints: "{WARNING, CIVIL_PENALTY, PROBATION, SUSPENSION_RECOMMENDED}"
      - name: points_assessed
        type: integer
        source: computed
        description: "Points charged by this sanction; see calculations.complaint_sanction_assessment. 0 before resolution."
        default: 0
      - name: civil_penalty_cents
        type: integer
        source: computed
        description: Civil penalty imposed, in cents; null unless SANCTIONED.
      - name: restitution_ordered_cents
        type: integer
        source: computed
        description: Restitution ordered, in cents; null unless SANCTIONED.
      - name: restitution_paid_cents
        type: integer
        source: system
        description: Cumulative restitution paid against this order, in cents.
        default: 0
      - name: restitution_due_on
        type: string
        source: system
        description: "resolved_at date + 30 days (ISO); the delinquency cut-off swept by the logical clock."
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of the board resolution; null before resolution.

state_machines:
  - entity: Dealer
    dimensions: [license_status, franchise_status]
    initial_state: PROSPECTIVE
    initial_franchise_state: NONE
    terminal_states: [REVOKED, CANCELLED]
    note: |
      Two independent dimensions on one row. license_status is driven by licence
      applications, complaint sanctions, restitution payments and the logical-clock
      sweep; franchise_status is driven only by franchise filings. A dealer may be
      SUSPENDED while FRANCHISED, or LICENSED while TERMINATION_PENDING.
    transitions:
      - from: PROSPECTIVE
        to: LICENSED
        trigger: "POST /dealer-board/license-applications/{id}/decision with outcome APPROVED"
        actor: BoardAdmin
        preconditions:
          - "application.dealer_id == this dealer"
          - "application.status == SUBMITTED"
          - "application.deficiency_count == 0"
          - "dealer.license_status IN {PROSPECTIVE, EXPIRED}"
        side_effects:
          - "sets license_effective_on per calculations.license_term_dates and license_expires_on = license_effective_on + 729 days"
          - "sets franchise_status = FRANCHISED when dealer_type == NEW_MOTOR_VEHICLE (franchise dimension advances from NONE independently of the licence dimension); leaves franchise_status = NONE for USED_ONLY"
          - "recomputes application.fee_total_cents (FINAL variant) and application.fee_delta_cents"
          - "increments Dealer.version by 1"
      - from: EXPIRED
        to: LICENSED
        trigger: "POST /dealer-board/license-applications/{id}/decision with outcome APPROVED on a RENEWAL application"
        actor: BoardAdmin
        preconditions:
          - "application.application_type == RENEWAL"
          - "application.requested_term_start_on == previous license_expires_on + 1 day"
        side_effects:
          - "sets license_effective_on = application.requested_term_start_on (retroactive continuity) and license_expires_on = license_effective_on + 729 days"
          - "increments Dealer.version by 1"
      - from: LICENSED
        to: SUSPENDED
        trigger: "POST /dealer-board/consumer-complaints/{id}/resolution (link 2 of the sanction cascade)"
        actor: system
        preconditions:
          - "recomputed disciplinary_points >= 12"
          - "recomputed disciplinary_points < 18"
        side_effects:
          - "sets suspension_reason = DISCIPLINARY_POINTS"
          - "link 3, caused by this suspension: every Salesperson with sponsoring_dealer_id == this dealer AND license_status IN {LICENSED, RENEWAL_PENDING} moves to SUSPENDED_BY_SPONSOR"
          - "link 4, caused by those salesperson suspensions: licensed_salesperson_count is recomputed to 0"
          - "increments Dealer.version by 1"
      - from: LICENSED
        to: SUSPENDED
        trigger: "POST /dealer-board/_clock/set_current_utc sweep (restitution delinquency)"
        actor: system
        preconditions:
          - "restitution_outstanding_cents > 0"
          - "exists ConsumerComplaint with dealer_id == this dealer AND status == SANCTIONED AND restitution_due_on < new clock date"
        side_effects:
          - "sets suspension_reason = RESTITUTION_DELINQUENT"
          - "caused by this suspension: every Salesperson with sponsoring_dealer_id == this dealer AND license_status IN {LICENSED, RENEWAL_PENDING} moves to SUSPENDED_BY_SPONSOR"
          - "recomputes licensed_salesperson_count"
          - "increments Dealer.version by 1"
        note: "Strict inequality: a due_on equal to the new clock date is not yet delinquent."
      - from: SUSPENDED
        to: LICENSED
        trigger: "POST /dealer-board/consumer-complaints/{id}/restitution-payment that clears the last cent, or the clock sweep after points age out"
        actor: system
        preconditions:
          - "restitution_outstanding_cents == 0"
          - "recomputed disciplinary_points < 12"
          - "license_expires_on >= current clock date"
        side_effects:
          - "sets suspension_reason = NONE"
          - "caused by this reinstatement: every Salesperson with sponsoring_dealer_id == this dealer AND license_status == SUSPENDED_BY_SPONSOR returns to LICENSED when its own license_expires_on >= current clock date, else moves to EXPIRED"
          - "recomputes licensed_salesperson_count"
          - "increments Dealer.version by 1"
      - from: LICENSED
        to: REVOKED
        trigger: "POST /dealer-board/consumer-complaints/{id}/resolution with sanction_type SUSPENSION_RECOMMENDED"
        actor: system
        preconditions:
          - "recomputed disciplinary_points >= 18"
        side_effects:
          - "sets suspension_reason = NONE"
          - "caused by revocation: every Salesperson with sponsoring_dealer_id == this dealer AND license_status IN {LICENSED, RENEWAL_PENDING} moves to SUSPENDED_BY_SPONSOR"
          - "caused by revocation: every LicenseApplication of this dealer with status IN {DRAFT, SUBMITTED, DEFICIENT} moves to VOID_SPONSOR_CANCELLED"
          - "increments Dealer.version by 1"
      - from: LICENSED
        to: EXPIRED
        trigger: "POST /dealer-board/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "license_expires_on < new clock date"
        side_effects:
          - "caused by expiry: every Salesperson with sponsoring_dealer_id == this dealer AND license_status == LICENSED moves to SUSPENDED_BY_SPONSOR"
          - "recomputes licensed_salesperson_count"
          - "increments Dealer.version by 1"
      - from: LICENSED
        to: CANCELLED
        trigger: "POST /dealer-board/franchise-filings/{id}/finalize on a TERMINATION filing (link 1 of the termination cascade)"
        actor: system
        preconditions:
          - "filing.affected_dealer_id == this dealer"
          - "dealer_type == NEW_MOTOR_VEHICLE"
        side_effects:
          - "franchise dimension moves TERMINATION_PENDING -> TERMINATED in the same request"
          - "link 2, caused by franchise_status becoming TERMINATED: every WarrantyRateDispute with dealer_id == this dealer AND status IN {FILED, UNDER_REVIEW} moves to DISMISSED_MOOT"
          - "link 3, caused by those dismissals: Manufacturer.open_dispute_count is recomputed for each affected franchisor"
          - "every Salesperson with sponsoring_dealer_id == this dealer AND license_status IN {LICENSED, RENEWAL_PENDING} moves to SUSPENDED_BY_SPONSOR"
          - "increments Dealer.version by 1"
      - from: FRANCHISED
        to: TERMINATION_PENDING
        trigger: "POST /dealer-board/franchise-filings/{id}/serve-notice on a TERMINATION filing"
        actor: system
        preconditions:
          - "filing.affected_dealer_id == this dealer"
          - "franchise_status == FRANCHISED"
        side_effects:
          - "license_status is untouched (the dealer keeps selling during the notice period)"
          - "increments Dealer.version by 1"
      - from: TERMINATION_PENDING
        to: FRANCHISED
        trigger: "POST /dealer-board/protests/{id}/decision with outcome SUSTAINED (the filing becomes BARRED)"
        actor: system
        preconditions:
          - "franchise_status == TERMINATION_PENDING"
          - "the sustained protest's filing has filing_type == TERMINATION AND affected_dealer_id == this dealer"
        side_effects:
          - "restores the franchise dimension because the barred filing may never take effect; an amendment does NOT restore it (the notice period simply restarts while the dealer stays TERMINATION_PENDING)"
          - "increments Dealer.version by 1"

  - entity: LicenseApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, VOID_SPONSOR_CANCELLED]
    note: "Cyclic: SUBMITTED -> DEFICIENT -> SUBMITTED revision loop, capped at 2 resubmissions; the decision step is a branching fork with divergent side-effect sets."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dealer-board/license-applications/{id}/submit"
        actor: Dealer
        preconditions:
          - "status == DRAFT"
          - "dealer.license_status NOT IN {REVOKED, CANCELLED}"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "recomputes deficiency_codes and deficiency_count per calculations.application_deficiency_scan"
          - "sets fee_quoted_cents from the PROVISIONAL variant of calculations.license_fee_assessment"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /dealer-board/license-applications/{id}/deficiency-notice"
        actor: LicensingAnalyst
        preconditions:
          - "status == SUBMITTED"
          - "deficiency_count >= 1"
        side_effects:
          - "stores deficiency_note"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /dealer-board/license-applications/{id}/resubmit"
        actor: Dealer
        preconditions:
          - "status == DEFICIENT"
          - "resubmission_count < 2"
        side_effects:
          - "overwrites only the supplied facility/bond/insurance/zoning fields"
          - "increments resubmission_count by 1"
          - "re-stamps submitted_at from the logical clock"
          - "recomputes deficiency_codes, deficiency_count and fee_quoted_cents (PROVISIONAL variant, re-evaluated at the new clock position)"
        note: "The third resubmit attempt is rejected with ERR_RESUBMISSION_LIMIT_REACHED; the loop is bounded."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dealer-board/license-applications/{id}/decision with outcome APPROVED"
        actor: BoardAdmin
        preconditions:
          - "status == SUBMITTED"
          - "deficiency_count == 0"
          - "dealer.license_status NOT IN {SUSPENDED, REVOKED, CANCELLED}"
          - "dealer.restitution_outstanding_cents == 0"
        side_effects:
          - "sets decided_at, decision_outcome = APPROVED"
          - "recomputes fee_total_cents (FINAL variant) and sets fee_delta_cents = fee_total_cents - fee_quoted_cents"
          - "advances the dealer's licence dimension to LICENSED and, for NEW_MOTOR_VEHICLE, the franchise dimension to FRANCHISED"
          - "for application_type == RELOCATION, overwrites dealer.site_x_km / dealer.site_y_km with the relocation coordinates"
          - "for application_type == CHANGE_OF_OWNERSHIP, overwrites dealer.legal_name with new_owner_name"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /dealer-board/license-applications/{id}/decision with outcome DENIED"
        actor: BoardAdmin
        preconditions:
          - "status == SUBMITTED"
          - "denial_reason_code is present"
        side_effects:
          - "sets decided_at, decision_outcome = DENIED, denial_reason_code"
          - "recomputes fee_total_cents (FINAL variant) and fee_delta_cents"
          - "leaves dealer.license_status and dealer.franchise_status untouched — the divergent half of the fork"
      - from: DEFICIENT
        to: DENIED
        trigger: "POST /dealer-board/license-applications/{id}/decision with outcome DENIED"
        actor: BoardAdmin
        preconditions:
          - "status == DEFICIENT"
          - "denial_reason_code is present"
        side_effects:
          - "sets decided_at, decision_outcome = DENIED, denial_reason_code"
          - "recomputes fee_total_cents (FINAL variant) and fee_delta_cents"
      - from: SUBMITTED
        to: VOID_SPONSOR_CANCELLED
        trigger: "Dealer revocation cascade from POST /dealer-board/consumer-complaints/{id}/resolution"
        actor: system
        preconditions:
          - "dealer.license_status becomes REVOKED in this request"
        side_effects:
          - "no fee is finalised; fee_total_cents stays null"

  - entity: Salesperson
    dimensions: [license_status, discipline_status]
    initial_state: PENDING
    initial_discipline_state: CLEAR
    terminal_states: [DENIED]
    note: |
      Parallel dimensions plus a renewal cycle. license_status LICENSED -> RENEWAL_PENDING
      -> LICENSED may repeat without bound; discipline_status is advanced only by complaint
      resolutions and rolled back only by the clock sweep as points age out of the 730-day
      window. The two dimensions never gate each other's transitions.
    transitions:
      - from: PENDING
        to: LICENSED
        trigger: "POST /dealer-board/salespersons/{id}/license-decision with outcome APPROVED"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == PENDING"
          - "sponsoring dealer.license_status == LICENSED OR waiver_granted == true (validations priority 22)"
          - "disclosed_prior_discipline == true OR disciplinary_points == 0 OR waiver_granted == true (validations priority 23)"
        side_effects:
          - "sets license_effective_on = clock date, license_expires_on = license_effective_on + 364 days"
          - "increments sponsoring dealer.licensed_salesperson_count"
      - from: PENDING
        to: DENIED
        trigger: "POST /dealer-board/salespersons/{id}/license-decision with outcome DENIED"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == PENDING"
          - "denial_reason_code is present"
        side_effects:
          - "no licence dates are stamped; the row is terminal"
      - from: LICENSED
        to: RENEWAL_PENDING
        trigger: "POST /dealer-board/salespersons/{id}/renewal"
        actor: Dealer
        preconditions:
          - "license_status == LICENSED"
          - "clock date >= license_expires_on - 60 days AND clock date <= license_expires_on + 30 days"
        side_effects:
          - "discipline_status is untouched — the discipline dimension is orthogonal"
          - "decrements sponsoring dealer.licensed_salesperson_count"
      - from: RENEWAL_PENDING
        to: LICENSED
        trigger: "POST /dealer-board/salespersons/{id}/license-decision with outcome APPROVED"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == RENEWAL_PENDING"
          - "sponsoring dealer.license_status == LICENSED"
          - "disciplinary_points < 9"
        side_effects:
          - "sets license_effective_on = previous license_expires_on + 1 day, license_expires_on = license_effective_on + 364 days"
          - "increments renewal_count and the sponsoring dealer's licensed_salesperson_count"
      - from: RENEWAL_PENDING
        to: DENIED
        trigger: "POST /dealer-board/salespersons/{id}/license-decision with outcome DENIED"
        actor: LicensingAnalyst
        preconditions:
          - "license_status == RENEWAL_PENDING"
          - "denial_reason_code is present"
        side_effects:
          - "terminal; the sponsoring dealer's licensed_salesperson_count is unchanged (already decremented at renewal)"
      - from: LICENSED
        to: SUSPENDED_BY_SPONSOR
        trigger: "Dealer suspension / revocation / expiry / franchise-cancellation cascade"
        actor: system
        preconditions:
          - "sponsoring dealer leaves license_status LICENSED in this request"
        side_effects:
          - "decrements sponsoring dealer.licensed_salesperson_count"
      - from: SUSPENDED_BY_SPONSOR
        to: LICENSED
        trigger: "Dealer reinstatement cascade from POST /dealer-board/consumer-complaints/{id}/restitution-payment"
        actor: system
        preconditions:
          - "sponsoring dealer returns to license_status LICENSED in this request"
          - "own license_expires_on >= current clock date"
        side_effects:
          - "increments sponsoring dealer.licensed_salesperson_count"
      - from: SUSPENDED_BY_SPONSOR
        to: EXPIRED
        trigger: "Dealer reinstatement cascade, or POST /dealer-board/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "own license_expires_on < current clock date"
        side_effects:
          - "no counter change (already decremented on suspension)"
      - from: LICENSED
        to: EXPIRED
        trigger: "POST /dealer-board/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "license_expires_on < new clock date"
        side_effects:
          - "decrements sponsoring dealer.licensed_salesperson_count"
      - from: CLEAR
        to: PROBATION
        trigger: "POST /dealer-board/consumer-complaints/{id}/resolution naming this salesperson"
        actor: system
        preconditions:
          - "recomputed disciplinary_points >= 6 AND < 9"
        side_effects:
          - "license_status is untouched — a salesperson on PROBATION keeps selling"
      - from: PROBATION
        to: SUSPENDED_DISCIPLINARY
        trigger: "POST /dealer-board/consumer-complaints/{id}/resolution naming this salesperson"
        actor: system
        preconditions:
          - "recomputed disciplinary_points >= 9"
        side_effects:
          - "license_status is untouched; the discipline dimension alone blocks a renewal approval"
      - from: CLEAR
        to: SUSPENDED_DISCIPLINARY
        trigger: "POST /dealer-board/consumer-complaints/{id}/resolution naming this salesperson"
        actor: system
        preconditions:
          - "recomputed disciplinary_points >= 9"
        side_effects:
          - "a single SUSPENSION_RECOMMENDED sanction skips PROBATION"
      - from: SUSPENDED_DISCIPLINARY
        to: REINSTATED
        trigger: "POST /dealer-board/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "recomputed disciplinary_points < 9 after points age out of the 730-day window"
        side_effects:
          - "license_status is untouched"
      - from: PROBATION
        to: CLEAR
        trigger: "POST /dealer-board/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "recomputed disciplinary_points < 6 after points age out of the 730-day window"
        side_effects:
          - "license_status is untouched"

  - entity: FranchiseFiling
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, BARRED]
    note: "Cyclic: PROTEST_PENDING -> NOTICE_SERVED (and NOTICE_SERVED -> NOTICE_SERVED) via amendment, capped at 2 amendments."
    transitions:
      - from: DRAFT
        to: NOTICE_SERVED
        trigger: "POST /dealer-board/franchise-filings/{id}/serve-notice"
        actor: Manufacturer
        preconditions:
          - "status == DRAFT"
          - "manufacturer.state_registration_status == REGISTERED"
          - "proposed_effective_on - clock date >= 60 days for TERMINATION and RELOCATION, >= 30 days for ADDITIONAL_POINT"
        side_effects:
          - "sets notice_served_on = clock date, notice_days_provided, protest_window_ends_on = notice_served_on + 30 days"
          - "for TERMINATION: affected dealer's franchise dimension moves FRANCHISED -> TERMINATION_PENDING"
          - "recomputes manufacturer.active_filing_count"
      - from: NOTICE_SERVED
        to: PROTEST_PENDING
        trigger: "POST /dealer-board/protests (first protest against this filing)"
        actor: system
        preconditions:
          - "status == NOTICE_SERVED"
          - "clock date <= protest_window_ends_on"
        side_effects:
          - "recomputes active_protest_count"
          - "increments FranchiseFiling.version by 1 (the OCC comparand of concurrency_rules.protest-create-stale-filing)"
      - from: NOTICE_SERVED
        to: NOTICE_SERVED
        trigger: "POST /dealer-board/franchise-filings/{id}/amend"
        actor: Manufacturer
        preconditions:
          - "status == NOTICE_SERVED"
          - "amendment_count < 2"
        side_effects:
          - "increments amendment_count, re-stamps notice_served_on = clock date, recomputes notice_days_provided and protest_window_ends_on = clock date + 30 days"
          - "overwrites proposed_effective_on and, when supplied, site_x_km / site_y_km"
          - "increments FranchiseFiling.version by 1"
      - from: PROTEST_PENDING
        to: NOTICE_SERVED
        trigger: "POST /dealer-board/franchise-filings/{id}/amend"
        actor: Manufacturer
        preconditions:
          - "status == PROTEST_PENDING"
          - "amendment_count < 2"
          - "no Protest against this filing has status IN {HEARD, SUSTAINED, DENIED, APPEALED, FINAL}"
        side_effects:
          - "increments amendment_count, re-stamps notice_served_on and protest_window_ends_on = clock date + 30 days"
          - "caused by the amendment: every Protest against this filing with status IN {FILED, SCHEDULED} moves to WITHDRAWN"
          - "caused by those withdrawals: each such protest's hearing_room_id, hearing_start_at, hearing_end_at and hearing_session_count are cleared and each affected HearingRoom.booked_hearing_count is recomputed (room-slot conservation)"
          - "recomputes active_protest_count to 0"
          - "increments FranchiseFiling.version by 1"
      - from: PROTEST_PENDING
        to: BARRED
        trigger: "POST /dealer-board/protests/{id}/decision with outcome SUSTAINED"
        actor: system
        preconditions:
          - "the deciding protest is the only protest not in {WITHDRAWN, DISMISSED} against this filing"
        side_effects:
          - "the filing may never be finalised; for TERMINATION the affected dealer's franchise dimension returns TERMINATION_PENDING -> FRANCHISED"
          - "recomputes manufacturer.active_filing_count"
      - from: PROTEST_PENDING
        to: PROTEST_RESOLVED
        trigger: "POST /dealer-board/protests/{id}/decision with outcome DENIED, or POST /dealer-board/protests/{id}/convene that dismisses the last live protest"
        actor: system
        preconditions:
          - "no Protest against this filing has status IN {FILED, SCHEDULED, HEARD, SUSTAINED, APPEALED}"
        side_effects:
          - "recomputes active_protest_count to 0"
      - from: NOTICE_SERVED
        to: EFFECTIVE
        trigger: "POST /dealer-board/franchise-filings/{id}/finalize"
        actor: BoardAdmin
        preconditions:
          - "status == NOTICE_SERVED"
          - "clock date > protest_window_ends_on"
          - "clock date >= proposed_effective_on"
          - "active_protest_count == 0"
        side_effects:
          - "for TERMINATION: affected dealer franchise dimension TERMINATION_PENDING -> TERMINATED and licence dimension LICENSED -> CANCELLED (link 1 of the termination cascade)"
          - "for RELOCATION: affected dealer's site_x_km / site_y_km are overwritten with the filing's site coordinates"
          - "for ADDITIONAL_POINT: no dealer row is mutated"
          - "recomputes manufacturer.active_filing_count"
      - from: PROTEST_RESOLVED
        to: EFFECTIVE
        trigger: "POST /dealer-board/franchise-filings/{id}/finalize"
        actor: BoardAdmin
        preconditions:
          - "status == PROTEST_RESOLVED"
          - "clock date >= proposed_effective_on"
          - "no Protest against this filing has status == APPEALED"
        side_effects:
          - "same dispositions as the NOTICE_SERVED -> EFFECTIVE transition"

  - entity: Protest
    initial_state: FILED
    terminal_states: [FINAL, APPEALED, WITHDRAWN, DISMISSED]
    note: "Branching fork at convene (HEARD vs DISMISSED with divergent side-effect sets) and at decision (SUSTAINED vs DENIED)."
    transitions:
      - from: FILED
        to: SCHEDULED
        trigger: "POST /dealer-board/protests/{id}/schedule"
        actor: HearingClerk
        preconditions:
          - "status == FILED"
          - "expected_hearing_room_version == room.version"
          - "hearing_start_at >= filed_on + 30 days AND hearing_start_at <= filed_on + 180 days"
          - "hearing_end_at > hearing_start_at"
          - "no buffered collision in the room (see validations priority 50)"
          - "the room hosts fewer than max_hearings_per_day hearings on that UTC date"
        side_effects:
          - "stores hearing_room_id, hearing_start_at, hearing_end_at, hearing_session_count"
          - "sets evidence_deadline_at = hearing_start_at - 7 days"
          - "increments HearingRoom.booked_hearing_count by 1 and HearingRoom.version by 1"
      - from: SCHEDULED
        to: HEARD
        trigger: "POST /dealer-board/protests/{id}/convene"
        actor: HearingClerk
        preconditions:
          - "status == SCHEDULED"
          - "clock instant >= hearing_start_at"
          - "protestant dealer.license_status == LICENSED"
          - "at least one MarketStudy for this protest has submitted_by_party == PROTESTANT AND is_probative == true"
        side_effects:
          - "freezes accepted_evidence_pages and late_evidence_count"
          - "computes good_cause_score and good_cause_threshold per calculations.good_cause_score"
          - "HearingRoom.booked_hearing_count is unchanged (HEARD still occupies the slot)"
      - from: SCHEDULED
        to: DISMISSED
        trigger: "POST /dealer-board/protests/{id}/convene when the protestant has lost standing"
        actor: HearingClerk
        preconditions:
          - "status == SCHEDULED"
          - "clock instant >= hearing_start_at"
          - "protestant dealer.license_status IN {SUSPENDED, EXPIRED, REVOKED, CANCELLED}"
        side_effects:
          - "clears hearing_room_id, hearing_start_at, hearing_end_at, hearing_session_count and decrements HearingRoom.booked_hearing_count (the divergent half of the fork)"
          - "no good_cause_score is computed and no assessment is levied"
          - "when this was the filing's last live protest, the filing moves PROTEST_PENDING -> PROTEST_RESOLVED"
      - from: HEARD
        to: SUSTAINED
        trigger: "POST /dealer-board/protests/{id}/decision with outcome SUSTAINED"
        actor: BoardAdmin
        preconditions:
          - "status == HEARD"
          - "good_cause_score >= good_cause_threshold"
        side_effects:
          - "sets decided_on = clock date"
          - "computes assessment_total_cents, protestant_share_cents (30%) and manufacturer_share_cents (70%) per calculations.hearing_cost_assessment"
          - "the filing moves PROTEST_PENDING -> BARRED"
      - from: HEARD
        to: DENIED
        trigger: "POST /dealer-board/protests/{id}/decision with outcome DENIED"
        actor: BoardAdmin
        preconditions:
          - "status == HEARD"
        side_effects:
          - "sets decided_on = clock date"
          - "computes assessment_total_cents with the shares reversed: protestant pays 70%, franchisor 30%"
          - "the filing moves PROTEST_PENDING -> PROTEST_RESOLVED when no other live protest remains"
      - from: SUSTAINED
        to: APPEALED
        trigger: "POST /dealer-board/protests/{id}/appeal"
        actor: Manufacturer
        preconditions:
          - "status IN {SUSTAINED, DENIED}"
          - "clock date <= decided_on + 30 days"
        side_effects:
          - "sets appeal_filed_on, appellant_party = MANUFACTURER, court_docket_number"
          - "blocks POST /dealer-board/franchise-filings/{id}/finalize while the appeal is pending"
      - from: DENIED
        to: APPEALED
        trigger: "POST /dealer-board/protests/{id}/appeal"
        actor: Dealer
        preconditions:
          - "status IN {SUSTAINED, DENIED}"
          - "clock date <= decided_on + 30 days"
        side_effects:
          - "sets appeal_filed_on, appellant_party = PROTESTANT, court_docket_number"
      - from: SUSTAINED
        to: FINAL
        trigger: "POST /dealer-board/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "status IN {SUSTAINED, DENIED}"
          - "new clock date > decided_on + 30 days"
        side_effects:
          - "the appeal window has lapsed; the disposition is unappealable"
      - from: DENIED
        to: FINAL
        trigger: "POST /dealer-board/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "status IN {SUSTAINED, DENIED}"
          - "new clock date > decided_on + 30 days"
        side_effects:
          - "the filing may now be finalised"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /dealer-board/franchise-filings/{id}/amend cascade"
        actor: system
        preconditions:
          - "status IN {FILED, SCHEDULED}"
        side_effects:
          - "any held hearing slot is released and HearingRoom.booked_hearing_count is recomputed"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /dealer-board/franchise-filings/{id}/amend cascade"
        actor: system
        preconditions:
          - "status IN {FILED, SCHEDULED}"
        side_effects:
          - "clears hearing_room_id / hearing_start_at / hearing_end_at / hearing_session_count, decrements HearingRoom.booked_hearing_count and increments HearingRoom.version by 1"

  - entity: WarrantyRateDispute
    initial_state: FILED
    terminal_states: [APPROVED, DENIED, DISMISSED_MOOT]
    note: "Guarded branching: the UNDER_REVIEW -> APPROVED edge is gated on the franchisor's own rebuttal arithmetic, so the same trigger reaches APPROVED or DENIED depending on the recomputed spread."
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /dealer-board/warranty-rate-disputes/{id}/response"
        actor: Manufacturer
        preconditions:
          - "status == FILED"
          - "clock date <= filed_on + 30 days"
          - "manufacturer.state_registration_status == REGISTERED"
        side_effects:
          - "stores manufacturer_response_type and, for REBUT, excluded_line_indexes"
          - "for REBUT: computes counter_rate_cents (AGGREGATE_WEIGHTED variant over the surviving lines) and spread_pct"
          - "for ACCEPT: counter_rate_cents and spread_pct stay null and the board may only approve the declared rate"
          - "recomputes manufacturer.open_dispute_count"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /dealer-board/warranty-rate-disputes/{id}/decision with outcome APPROVED"
        actor: BoardAdmin
        preconditions:
          - "status == UNDER_REVIEW"
          - "declared_rate_cents > manufacturer.posted_warranty_labor_rate_cents"
          - "qualifying_line_count >= 5"
          - "dealer.license_status == LICENSED AND dealer.franchise_status IN {FRANCHISED, TERMINATION_PENDING}"
        side_effects:
          - "sets approved_rate_cents per calculations.warranty_labor_rate_determination, decided_on = clock date and effective_on = decided_on + 30 days"
          - "overwrites dealer.approved_warranty_labor_rate_cents with approved_rate_cents"
          - "recomputes manufacturer.open_dispute_count"
      - from: FILED
        to: DENIED
        trigger: "POST /dealer-board/warranty-rate-disputes/{id}/decision with outcome DENIED"
        actor: BoardAdmin
        preconditions:
          - "status IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "sets denial_reason_code and decided_on = clock date; dealer.approved_warranty_labor_rate_cents is unchanged"
          - "recomputes manufacturer.open_dispute_count"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /dealer-board/warranty-rate-disputes/{id}/decision with outcome DENIED"
        actor: BoardAdmin
        preconditions:
          - "status IN {FILED, UNDER_REVIEW}"
        side_effects:
          - "sets denial_reason_code and decided_on = clock date"
          - "recomputes manufacturer.open_dispute_count"
      - from: FILED
        to: DISMISSED_MOOT
        trigger: "POST /dealer-board/franchise-filings/{id}/finalize cascade (a TERMINATION filing becomes EFFECTIVE)"
        actor: system
        preconditions:
          - "status IN {FILED, UNDER_REVIEW}"
          - "dealer_id == the terminated dealer AND manufacturer_id == the filing's manufacturer_id"
        side_effects:
          - "link 2 of the termination cascade: the franchise no longer exists, so the rate dispute is moot"
          - "link 3: manufacturer.open_dispute_count is recomputed"
      - from: UNDER_REVIEW
        to: DISMISSED_MOOT
        trigger: "POST /dealer-board/franchise-filings/{id}/finalize cascade (a TERMINATION filing becomes EFFECTIVE)"
        actor: system
        preconditions:
          - "status IN {FILED, UNDER_REVIEW}"
          - "dealer_id == the terminated dealer AND manufacturer_id == the filing's manufacturer_id"
        side_effects:
          - "the dispute is mooted and manufacturer.open_dispute_count is recomputed"

  - entity: ConsumerComplaint
    initial_state: RECEIVED
    terminal_states: [CLOSED_UNSUBSTANTIATED, CLOSED_SATISFIED]
    note: "Branching: the resolution fork splits into a sanction path carrying a restitution ledger and a closure path with no fiscal or disciplinary effect. SANCTIONED is a non-terminal absorbing state until the ledger is settled."
    transitions:
      - from: RECEIVED
        to: UNDER_INVESTIGATION
        trigger: "POST /dealer-board/consumer-complaints/{id}/investigation"
        actor: ComplaintInvestigator
        preconditions:
          - "status == RECEIVED"
          - "dealer.license_status != CANCELLED"
        side_effects:
          - "stores findings_code and stamps investigator_user_id with the caller's X-User-ID (the segregation-of-duties comparand)"
      - from: UNDER_INVESTIGATION
        to: SANCTIONED
        trigger: "POST /dealer-board/consumer-complaints/{id}/resolution with substantiated true"
        actor: BoardAdmin
        preconditions:
          - "status == UNDER_INVESTIGATION"
          - "findings_code != NO_VIOLATION_FOUND"
          - "sanction_type is supplied"
          - "the caller's X-User-ID != investigator_user_id"
        side_effects:
          - "computes points_assessed, civil_penalty_cents and restitution_ordered_cents per calculations.complaint_sanction_assessment; sets restitution_due_on = clock date + 30 days and leaves restitution_paid_cents at 0"
          - "recomputes dealer.disciplinary_points over the 730-day window and dealer.restitution_outstanding_cents"
          - "when the recomputed dealer points reach 12 the licence dimension moves LICENSED -> SUSPENDED with suspension_reason DISCIPLINARY_POINTS; at 18 it moves to REVOKED (cascade link 1)"
          - "when salesperson_id is set, recomputes that Salesperson.disciplinary_points and its discipline dimension"
      - from: UNDER_INVESTIGATION
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /dealer-board/consumer-complaints/{id}/resolution with substantiated false"
        actor: BoardAdmin
        preconditions:
          - "status == UNDER_INVESTIGATION"
          - "sanction_type is absent"
          - "the caller's X-User-ID != investigator_user_id"
        side_effects:
          - "sets resolved_at = clock instant; points_assessed stays 0 and civil_penalty_cents, restitution_ordered_cents and restitution_due_on stay null (the divergent half of the fork)"
          - "dealer.disciplinary_points and dealer.restitution_outstanding_cents are unchanged"
      - from: SANCTIONED
        to: SANCTIONED
        trigger: "POST /dealer-board/consumer-complaints/{id}/restitution-payment with a partial amount"
        actor: Dealer
        preconditions:
          - "status == SANCTIONED"
          - "restitution_paid_cents + amount_cents < restitution_ordered_cents"
        side_effects:
          - "increases restitution_paid_cents by amount_cents and decreases dealer.restitution_outstanding_cents by exactly the same amount, conserving restitution_ordered_cents == restitution_paid_cents + this complaint's contribution to dealer.restitution_outstanding_cents"
      - from: SANCTIONED
        to: CLOSED_SATISFIED
        trigger: "POST /dealer-board/consumer-complaints/{id}/restitution-payment that settles the balance"
        actor: Dealer
        preconditions:
          - "status == SANCTIONED"
          - "restitution_paid_cents + amount_cents == restitution_ordered_cents"
        side_effects:
          - "sets restitution_paid_cents = restitution_ordered_cents and resolved_at = clock instant"
          - "recomputes dealer.restitution_outstanding_cents, dropping this complaint's contribution to 0"
          - "when the dealer was SUSPENDED with suspension_reason RESTITUTION_DELINQUENT and no other complaint is delinquent, the licence dimension is restored to LICENSED with suspension_reason NONE (the compensating reversal)"
      - from: SANCTIONED
        to: SANCTIONED
        trigger: "POST /dealer-board/_clock/set_current_utc sweep (restitution delinquency)"
        actor: system
        preconditions:
          - "status == SANCTIONED"
          - "new clock date > restitution_due_on"
          - "restitution_paid_cents < restitution_ordered_cents"
        side_effects:
          - "the complaint stays SANCTIONED but the dealer's licence dimension moves LICENSED -> SUSPENDED with suspension_reason RESTITUTION_DELINQUENT"
          - "dealers are swept in created_at ASC order so the sweep counters are deterministic"

concurrency_rules:
  - rule_id: protest-create-stale-filing
    parent_entity: FranchiseFiling
    write_endpoint: "POST /dealer-board/protests"
    occ_field: "expected_franchise_filing_version"
    description: |
      Filing a Protest against a FranchiseFiling whose version has advanced since
      the protestant last read it is rejected with a stale-version error. The
      franchisor may legitimately amend a served notice (§1.2 FranchiseFiling
      NOTICE_SERVED -> NOTICE_SERVED and PROTEST_PENDING -> NOTICE_SERVED), which
      re-stamps proposed_effective_on and restarts the 30-day protest window; a
      protest computed against the superseded notice terms would otherwise be
      docketed against terms that no longer exist. The version comparand makes the
      staleness observable without any appeal to request timing.
    error_id: ERR_STALE_FILING_VERSION
    http_status: 412

  - rule_id: hearing-schedule-stale-room
    parent_entity: HearingRoom
    write_endpoint: "POST /dealer-board/protests/{id}/schedule"
    occ_field: "expected_hearing_room_version"
    description: |
      Docketing a hearing into a HearingRoom whose version has advanced since the
      clerk read the room's booking sheet is rejected with a stale-version error.
      Every booking, release and day-capacity change advances HearingRoom.version,
      so a clerk holding an older version was working from a booking sheet that no
      longer describes the room's occupancy.
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412

calculations:
  - name: application_deficiency_scan
    trigger: "On POST /dealer-board/license-applications/{id}/submit and /resubmit; recomputed on every submit."
    algorithm: constraint_propagation
    formula: |
      codes = []
      minimums = MINIMUMS_BY_DEALER_TYPE[dealer.dealer_type]
      if application.facility_sqft          < minimums.facility_sqft:        codes.append("FACILITY_TOO_SMALL")
      if application.display_spaces         < minimums.display_spaces:       codes.append("DISPLAY_SPACES_INSUFFICIENT")
      if application.service_bays           < minimums.service_bays:         codes.append("SERVICE_BAYS_INSUFFICIENT")
      if application.bond_amount_cents      < minimums.bond_cents:          codes.append("BOND_INSUFFICIENT")
      if application.insurance_liability_cents < minimums.insurance_cents:  codes.append("INSURANCE_INSUFFICIENT")
      zoning_ok = application.zoning_certificate_status == "APPROVED" or (
                    application.zoning_certificate_status == "CONDITIONAL"
                    and application.application_type in {"RENEWAL", "RELOCATION"})
      if not zoning_ok: codes.append("ZONING_NOT_APPROVED")
      deficiency_codes = sorted(codes)          # ascending lexicographic, never by id
      deficiency_count = len(deficiency_codes)
    input_set: "The submitted application's own facility/bond/insurance/zoning fields, read against the minimums for its dealer's dealer_type. Applications in DRAFT are not scanned."
    constants:
      MINIMUMS_BY_DEALER_TYPE:
        NEW_MOTOR_VEHICLE: { facility_sqft: 8000, display_spaces: 10, service_bays: 3, bond_cents: 5000000, insurance_cents: 100000000 }
        USED_ONLY:         { facility_sqft: 2000, display_spaces: 3,  service_bays: 0, bond_cents: 2500000, insurance_cents: 50000000 }
    precision: "Integer comparisons only; codes sorted ascending lexicographically so the array is byte-stable."

  - name: license_fee_assessment
    trigger: "PROVISIONAL variant on submit/resubmit (writes fee_quoted_cents); FINAL variant on decision (writes fee_total_cents and fee_delta_cents)."
    algorithm: tiered_pricing
    formula: |
      # STEP ORDER IS LOAD-BEARING: the county multiplier scales ONLY the base fee.
      # The surcharge, the facility credit and the late penalty are flat cent amounts
      # applied after the multiplier, each with its own independent cap.
      tiered_amount_cents = round_half_up(BASE_FEE_CENTS[application_type] * COUNTY_TIER_MULTIPLIER[dealer.county_tier])
      surcharge_cents     = min(LINE_MAKE_SURCHARGE_CENTS * application.line_make_count, LINE_MAKE_SURCHARGE_CAP_CENTS)
      excess_sqft         = max(0, application.facility_sqft - FACILITY_CREDIT_BASELINE_SQFT)
      credit_cents        = min(FACILITY_CREDIT_PER_1000_SQFT_CENTS * floor(excess_sqft / 1000), FACILITY_CREDIT_CAP_CENTS)
      # late_days is measured from the DEALER'S PRIOR EXPIRY, not from the requested term start,
      # and only for RENEWAL applications.
      if application.application_type == "RENEWAL" and dealer.license_expires_on is not null:
          late_days = max(0, days_between(dealer.license_expires_on, reference_date))
      else:
          late_days = 0
      penalty_cents = min(LATE_RENEWAL_PENALTY_PER_DAY_CENTS * late_days, LATE_RENEWAL_PENALTY_CAP_CENTS)
      fee = max(0, tiered_amount_cents + surcharge_cents - credit_cents + penalty_cents)
    input_set: "The application's own fields plus dealer.county_tier and dealer.license_expires_on. Voided applications are never re-priced."
    constants:
      BASE_FEE_CENTS: { INITIAL: 120000, RENEWAL: 90000, CHANGE_OF_OWNERSHIP: 150000, RELOCATION: 75000 }
      COUNTY_TIER_MULTIPLIER: { TIER_1: 1.25, TIER_2: 1.00, TIER_3: 0.80 }
      LINE_MAKE_SURCHARGE_CENTS: 25000
      LINE_MAKE_SURCHARGE_CAP_CENTS: 100000
      FACILITY_CREDIT_BASELINE_SQFT: 8000
      FACILITY_CREDIT_PER_1000_SQFT_CENTS: 4000
      FACILITY_CREDIT_CAP_CENTS: 30000
      LATE_RENEWAL_PENALTY_PER_DAY_CENTS: 5000
      LATE_RENEWAL_PENALTY_CAP_CENTS: 50000
    precision: "Whole cents; round_half_up on the multiplier product only; floor on the sqft credit steps."
    variants:
      - name: PROVISIONAL
        when: "POST /dealer-board/license-applications/{id}/submit and /resubmit — written to fee_quoted_cents."
        difference: "reference_date = the submit/resubmit date (clock date at the time of submission), so the late penalty reflects the delinquency as of filing."
      - name: FINAL
        when: "POST /dealer-board/license-applications/{id}/decision — written to fee_total_cents, with fee_delta_cents = fee_total_cents - fee_quoted_cents."
        difference: "reference_date = the decision date, so additional delinquent days accrued while the board deliberated are billed; every other term is identical. Identical data therefore yields a strictly larger fee whenever the decision lands on a later date than the submission and the cap is not yet reached."

  - name: license_term_dates
    trigger: "On an APPROVED dealer licence decision and on an approved salesperson licence decision or renewal."
    algorithm: chronological
    formula: |
      # Dealer
      if application_type == "RENEWAL":
          license_effective_on = application.requested_term_start_on      # must equal prior expiry + 1 day
      else:
          license_effective_on = decision_date
      license_expires_on = license_effective_on + (DEALER_TERM_DAYS - 1) days
      # Salesperson
      salesperson.license_effective_on = decision_date (initial) or prior license_expires_on + 1 day (renewal)
      salesperson.license_expires_on   = salesperson.license_effective_on + (SALESPERSON_TERM_DAYS - 1) days
    input_set: "The deciding application and, for renewals, the prior term stored on the licensee."
    constants:
      DEALER_TERM_DAYS: 730
      SALESPERSON_TERM_DAYS: 365
      RENEWAL_WINDOW_OPENS_DAYS_BEFORE_EXPIRY: 60
      RENEWAL_GRACE_DAYS_AFTER_EXPIRY: 30
    precision: "Whole days, UTC calendar dates; terms abut exactly (prior expiry + 1 day == next effective) and never overlap."

  - name: warranty_labor_rate_determination
    trigger: "PER_ORDER_MEAN on POST /dealer-board/warranty-rate-disputes (writes declared_rate_cents); AGGREGATE_WEIGHTED on a REBUT response (writes counter_rate_cents and spread_pct); the approved rate on an APPROVED decision."
    algorithm: aggregation
    formula: |
      qualifying(line) = line.repair_type == "CUSTOMER_PAID" and line.labor_hours >= MIN_QUALIFYING_LABOR_HOURS
      # qualifying_line_count is frozen at filing over ALL lines; franchisor exclusions
      # never shrink it, so the >= 5 sample-sufficiency test is a filing-time property.
      qualifying_line_count = count(line for line in repair_order_lines if qualifying(line))

      # PER_ORDER_MEAN (dealer's declared rate): round each order to whole cents FIRST,
      # then average the rounded per-order rates.
      per_order = [round_half_up(l.labor_charge_cents / l.labor_hours) for l in qualifying_lines]
      declared_rate_cents = round_half_up(sum(per_order) / len(per_order))

      # AGGREGATE_WEIGHTED (franchisor's counter rate): pool charges and hours FIRST,
      # divide ONCE, and round LAST — over the lines that survive the exclusions.
      surviving = [l for i, l in enumerate(repair_order_lines) if qualifying(l) and i not in excluded_line_indexes]
      counter_rate_cents = round_half_up(sum(l.labor_charge_cents for l in surviving) / sum(l.labor_hours for l in surviving))

      spread_pct = round_half_up(100 * (declared_rate_cents - counter_rate_cents) / counter_rate_cents, 2)

      # Board disposition
      if manufacturer_response_type == "ACCEPT" or spread_pct <= SPREAD_TOLERANCE_PCT:
          approved_rate_cents = declared_rate_cents
      else:
          approved_rate_cents = round_half_up((declared_rate_cents + counter_rate_cents) / 2)
    input_set: "Only CUSTOMER_PAID lines with labor_hours >= 0.5. WARRANTY and INTERNAL lines are excluded from both variants, as are sub-0.5-hour lines, even when the franchisor does not name them."
    constants:
      MIN_QUALIFYING_LABOR_HOURS: 0.5
      MIN_QUALIFYING_LINES: 5
      SPREAD_TOLERANCE_PCT: 5.00
      RATE_EFFECTIVE_LAG_DAYS: 30
    precision: "Whole cents for rates; spread_pct to 2 decimals, round_half_up."
    variants:
      - name: PER_ORDER_MEAN
        when: "Dealer's declared rate at filing time (declared_rate_cents)."
        difference: "Rounds every order to whole cents before averaging, so each order carries equal weight regardless of its labor hours. Short high-charge orders pull the mean up."
      - name: AGGREGATE_WEIGHTED
        when: "Franchisor's counter rate on a REBUT response (counter_rate_cents)."
        difference: "Pools all charges and all hours and divides once, rounding only at the end, so each order is weighted by its labor hours. Identical data yields a materially different rate: the divergence is the whole subject matter of the dispute."

  - name: relevant_market_distance
    trigger: "On POST /dealer-board/protests, for RELOCATION and ADDITIONAL_POINT filings."
    algorithm: threshold
    formula: |
      if filing.filing_type == "TERMINATION":
          distance_to_site_km = null          # standing does not rest on distance
      else:
          dx = filing.site_x_km - protestant_dealer.site_x_km
          dy = filing.site_y_km - protestant_dealer.site_y_km
          distance_to_site_km = round_half_up(sqrt(dx*dx + dy*dy), 2)
          # Standing requires the proposed site to fall INSIDE OR ON the radius.
          standing_ok = distance_to_site_km <= RELEVANT_MARKET_RADIUS_KM
    input_set: "The protestant dealer's site coordinates and the filing's proposed site coordinates."
    constants:
      RELEVANT_MARKET_RADIUS_KM: 24.00
    precision: "Planar Euclidean distance in km, 2 decimals, round_half_up; the radius test is inclusive (<=)."

  - name: market_penetration_analysis
    trigger: "On POST /dealer-board/protests/{id}/market-studies, for the study being posted."
    algorithm: weighted_scoring
    formula: |
      if total_market_registrations == 0:
          actual_penetration_pct = 0.00
          is_probative = false
      else:
          actual_penetration_pct = round_half_up(100 * line_make_registrations / total_market_registrations, 2)
          is_probative = true
      if basis == "STATEWIDE_AVERAGE":
          expected_penetration_pct = statewide_line_make_share_pct
      else:  # COMPARABLE_MARKET
          expected_penetration_pct = round_half_up(sum(comparable_market_shares_pct) / len(comparable_market_shares_pct), 2)
      shortfall_pts = max(0.00, round_half_up(expected_penetration_pct - actual_penetration_pct, 2))
    input_set: "The single study being posted. Non-probative studies (total_market_registrations == 0) are stored but excluded from good-cause scoring."
    constants: {}
    precision: "2 decimals, round_half_up; percentage points, not ratios."
    variants:
      - name: STATEWIDE_AVERAGE
        when: "basis == STATEWIDE_AVERAGE — the statutory default basis."
        difference: "Expected penetration is the statewide line-make share verbatim; comparable_market_shares_pct is ignored even when supplied."
      - name: COMPARABLE_MARKET
        when: "basis == COMPARABLE_MARKET — the party elects a comparable-market basis."
        difference: "Expected penetration is the unweighted mean of the tendered comparable shares, rounded to 2 decimals; statewide_line_make_share_pct is ignored even when supplied. For the same registration counts the two bases yield different shortfalls, and therefore a different net shortfall and a different good-cause score."

  - name: good_cause_score
    trigger: "On POST /dealer-board/protests/{id}/convene that reaches HEARD, and readable at any time via GET /dealer-board/protests/{id}/good-cause-analysis."
    algorithm: weighted_scoring
    formula: |
      # Controlling study per party: most recent probative study wins.
      # Ranking keys, in order: created_at DESC, then shortfall_pts DESC,
      # then total_market_registrations DESC. Row id is NEVER a ranking key.
      P = controlling probative MarketStudy with submitted_by_party == "PROTESTANT"   # required
      M = controlling probative MarketStudy with submitted_by_party == "MANUFACTURER" # optional

      net_shortfall_pts = max(0.00, round_half_up(P.shortfall_pts - (M.shortfall_pts if M else 0.00), 2))

      inadequacy_component = min(100.00, round_half_up(net_shortfall_pts * INADEQUACY_PTS_MULTIPLIER, 2))
      investment_component = min(100.00, round_half_up(P.permanency_investment_cents / INVESTMENT_CENTS_PER_POINT, 2))
      if M is null:
          access_component = ACCESS_NEUTRAL_POINTS
      else:
          access_component = clamp(round_half_up((M.consumer_access_drive_minutes - P.consumer_access_drive_minutes) * ACCESS_MINUTE_MULTIPLIER + ACCESS_NEUTRAL_POINTS, 2), 0.00, 100.00)
      growth_component = min(100.00, round_half_up(P.market_growth_pct * GROWTH_PCT_MULTIPLIER, 2))

      good_cause_score = round_half_up(
            W_INADEQUACY * inadequacy_component
          + W_INVESTMENT * investment_component
          + W_ACCESS     * access_component
          + W_GROWTH     * growth_component, 2)
      good_cause_threshold = 40.00 if filing.filing_type == "TERMINATION" else 60.00
      good_cause_established = good_cause_score >= good_cause_threshold      # inclusive at the threshold
    input_set: "Probative MarketStudy rows for this protest only. Non-probative rows never rank, so a party cannot displace its own controlling study with a zero-divisor filing."
    constants:
      INADEQUACY_PTS_MULTIPLIER: 8
      INVESTMENT_CENTS_PER_POINT: 500000
      ACCESS_MINUTE_MULTIPLIER: 4
      ACCESS_NEUTRAL_POINTS: 50.00
      GROWTH_PCT_MULTIPLIER: 5
      W_INADEQUACY: 0.40
      W_INVESTMENT: 0.25
      W_ACCESS: 0.20
      W_GROWTH: 0.15
      TERMINATION_THRESHOLD: 40.00
      OTHER_THRESHOLD: 60.00
    precision: "Each component rounded to 2 decimals and capped BEFORE weighting; the weighted sum rounded to 2 decimals once, at the end. Weights sum to exactly 1.00."

  - name: hearing_cost_assessment
    trigger: "On POST /dealer-board/protests/{id}/decision (both SUSTAINED and DENIED)."
    algorithm: tiered_pricing
    formula: |
      session_cost_cents    = ROOM_SESSION_RATE_CENTS * protest.hearing_session_count
      transcript_cost_cents = TRANSCRIPT_PER_PAGE_CENTS * protest.accepted_evidence_pages
      subtotal_cents        = session_cost_cents + transcript_cost_cents

      # THE TIER IS KEYED ON THE SUBTOTAL, NOT ON THE TOTAL, and the surcharge is
      # levied only when at least one exhibit came in under LATE_ACCEPTED.
      # (Selecting the tier from the post-surcharge total is the canonical wrong answer.)
      rate = LATE_SURCHARGE_RATE_BY_SUBTOTAL_TIER  # first matching band, ascending
      late_surcharge_cents = round_half_up(subtotal_cents * rate) if protest.late_evidence_count > 0 else 0
      assessment_total_cents = subtotal_cents + late_surcharge_cents

      # The PREVAILING party's share is rounded first; the losing party absorbs the
      # remainder, so the two shares always re-sum to assessment_total_cents exactly.
      prevailing_share_cents = round_half_up(assessment_total_cents * PREVAILING_SHARE_RATE)
      losing_share_cents     = assessment_total_cents - prevailing_share_cents
      if protest.status == "SUSTAINED":     # franchisor loses
          protestant_share_cents   = prevailing_share_cents
          manufacturer_share_cents = losing_share_cents
      else:                                 # DENIED — protestant loses
          protestant_share_cents   = losing_share_cents
          manufacturer_share_cents = prevailing_share_cents
    input_set: "Only EvidenceSubmission rows with acceptance_status IN {ACCEPTED, LATE_ACCEPTED} feed accepted_evidence_pages; rejected tenders are never billed."
    constants:
      ROOM_SESSION_RATE_CENTS: 45000
      TRANSCRIPT_PER_PAGE_CENTS: 350
      LATE_SURCHARGE_RATE_BY_SUBTOTAL_TIER:
        - { max_subtotal_cents: 100000, rate: 0.05 }
        - { max_subtotal_cents: 250000, rate: 0.08 }
        - { max_subtotal_cents: null,   rate: 0.12 }
      PREVAILING_SHARE_RATE: 0.30
    precision: "Whole cents; round_half_up on the surcharge and on the prevailing share only; the losing share is a subtraction so protestant_share_cents + manufacturer_share_cents == assessment_total_cents holds exactly."

  - name: dealer_disciplinary_points
    trigger: "Recomputed on every consumer-complaint resolution and on every POST /dealer-board/_clock/set_current_utc sweep."
    algorithm: decay_function
    formula: |
      window_start = reference_date - POINT_WINDOW_DAYS days        # inclusive lower bound
      contributing = [c for c in complaints
                        if c.dealer_id == dealer.id
                        and c.status in {"SANCTIONED", "CLOSED_SATISFIED"}
                        and date_of(c.resolved_at or c.restitution_due_on - RESTITUTION_TERM_DAYS) >= window_start]
      disciplinary_points = sum(c.points_assessed for c in contributing)
      # Step decay, not gradual: a sanction carries full weight until its 730th day and
      # zero weight from the 731st day onward.
      dealer_action = "REVOKED"  if disciplinary_points >= DEALER_REVOCATION_POINTS
                 else "SUSPENDED" if disciplinary_points >= DEALER_SUSPENSION_POINTS
                 else "NO_CHANGE"
    input_set: "SANCTIONED and CLOSED_SATISFIED complaints for this dealer whose sanction date falls inside the window. CLOSED_UNSUBSTANTIATED complaints contribute nothing at any age; paying restitution does NOT retire the points."
    constants:
      POINT_WINDOW_DAYS: 730
      DEALER_SUSPENSION_POINTS: 12
      DEALER_REVOCATION_POINTS: 18
      SANCTION_POINTS: { WARNING: 0, CIVIL_PENALTY: 3, PROBATION: 6, SUSPENSION_RECOMMENDED: 9 }
      RESTITUTION_TERM_DAYS: 30
    precision: "Integer points; the window boundary is inclusive on the lower end, so a sanction dated exactly reference_date - 730 days still counts and one dated 731 days back does not."

  - name: salesperson_disciplinary_points
    trigger: "Recomputed on every consumer-complaint resolution naming a salesperson, on POST /dealer-board/salespersons/{id}/renewal, and on every clock sweep."
    algorithm: decay_function
    formula: |
      window_start = reference_date - POINT_WINDOW_DAYS days        # inclusive lower bound
      disciplinary_points = sum(c.points_assessed for c in complaints
                                  if c.salesperson_id == salesperson.id
                                  and c.status in {"SANCTIONED", "CLOSED_SATISFIED"}
                                  and sanction_date(c) >= window_start)
      discipline_status = "SUSPENDED_DISCIPLINARY" if disciplinary_points >= SALESPERSON_SUSPENSION_POINTS
                     else "PROBATION"              if disciplinary_points >= SALESPERSON_PROBATION_POINTS
                     else ("REINSTATED" if previous discipline_status == "SUSPENDED_DISCIPLINARY" else "CLEAR")
      # Renewal gate reads the SAME total but has its own threshold.
      renewal_barred = disciplinary_points >= SALESPERSON_RENEWAL_BAR_POINTS
    input_set: "Complaints naming this salesperson, independent of the sponsoring dealer's own point total. The dimension moves without touching license_status."
    constants:
      POINT_WINDOW_DAYS: 730
      SALESPERSON_PROBATION_POINTS: 6
      SALESPERSON_SUSPENSION_POINTS: 9
      SALESPERSON_RENEWAL_BAR_POINTS: 9
    precision: "Integer points; the roll-off is a step change observed only when a write or a clock sweep recomputes the window."

  - name: complaint_sanction_assessment
    trigger: "On POST /dealer-board/consumer-complaints/{id}/resolution with substantiated true."
    algorithm: waterfall_allocation
    formula: |
      points_assessed = SANCTION_POINTS[sanction_type]
      restitution_ordered_cents = min(complaint.alleged_loss_cents, RESTITUTION_CAP_CENTS)
      if sanction_type == "WARNING":
          civil_penalty_cents = 0
      else:
          civil_penalty_cents = min(CIVIL_PENALTY_CAP_CENTS,
                                    ALLEGATION_BASE_CENTS[complaint.allegation_code]
                                    + round_half_up(restitution_ordered_cents * PENALTY_LOSS_RATE))
      restitution_due_on = resolution_date + RESTITUTION_TERM_DAYS days
    input_set: "The resolving complaint only. The restitution cap binds before the penalty is computed, so a capped loss also caps the loss-linked penalty component."
    constants:
      SANCTION_POINTS: { WARNING: 0, CIVIL_PENALTY: 3, PROBATION: 6, SUSPENSION_RECOMMENDED: 9 }
      RESTITUTION_CAP_CENTS: 1500000
      CIVIL_PENALTY_CAP_CENTS: 500000
      PENALTY_LOSS_RATE: 0.05
      RESTITUTION_TERM_DAYS: 30
      ALLEGATION_BASE_CENTS:
        ODOMETER_MISREPRESENTATION: 200000
        FAILURE_TO_TRANSFER_TITLE: 100000
        ADVERTISING_VIOLATION: 50000
        DEPOSIT_RETENTION: 75000
        UNLICENSED_SALESPERSON: 150000
    precision: "Whole cents; round_half_up on the loss-linked component; both caps applied after the addition."

  - name: restitution_ledger
    trigger: "On every POST /dealer-board/consumer-complaints/{id}/restitution-payment and on every complaint resolution."
    algorithm: aggregation
    formula: |
      # Per-complaint conservation invariant, true after EVERY write:
      #   complaint.restitution_ordered_cents == complaint.restitution_paid_cents + outstanding(complaint)
      outstanding(c) = (c.restitution_ordered_cents - c.restitution_paid_cents) if c.status == "SANCTIONED" else 0
      dealer.restitution_outstanding_cents = sum(outstanding(c) for c in complaints if c.dealer_id == dealer.id)
      # A payment moves value between the two sides of the invariant and never changes the sum.
      # Overpayment is refused outright rather than clipped, so the invariant cannot be broken.
    input_set: "SANCTIONED complaints of this dealer. CLOSED_SATISFIED complaints contribute 0 outstanding; CLOSED_UNSUBSTANTIATED complaints never enter the ledger."
    constants: {}
    precision: "Whole cents; no rounding is ever applied to a payment, so no drift can accumulate across partial payments."

  - name: hearing_room_slot_ledger
    trigger: "On POST /dealer-board/protests/{id}/schedule, on the convene fork that dismisses a protest, and on the amendment cascade that withdraws protests."
    algorithm: interval_merge
    formula: |
      holds_slot(p) = p.hearing_start_at is not null and p.status in
                      {"SCHEDULED", "HEARD", "SUSTAINED", "DENIED", "APPEALED", "FINAL"}
      room.booked_hearing_count = count(p for p in protests if p.hearing_room_id == room.id and holds_slot(p))

      # Buffered collision test: intervals are half-open [start, end) and must be
      # separated by at least room.buffer_minutes of changeover. Back-to-back
      # bookings therefore CONFLICT unless the gap reaches the full buffer.
      buffer = room.buffer_minutes minutes
      conflicts(new, existing) = new.start < existing.end + buffer and existing.start < new.end + buffer

      # Day capacity, evaluated on the UTC calendar date of hearing_start_at:
      same_day = count(p for p in protests if p.hearing_room_id == room.id and holds_slot(p)
                         and utc_date(p.hearing_start_at) == utc_date(new.start))
      capacity_ok = same_day < room.max_hearings_per_day
      # Release path: clearing the slot decrements booked_hearing_count by exactly 1 and
      # frees the interval AND the day slot, so a released room can be rebooked at the
      # same instant by another protest.
    input_set: "Slot-holding protests in the same room. DISMISSED and WITHDRAWN protests hold nothing, so they neither collide nor consume day capacity."
    constants: {}
    precision: "Minute-resolution UTC instants; the collision test uses strict < on both sides so a gap exactly equal to the buffer is permitted."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The caller's role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For entity-backed roles, X-User-ID matches the resource's owning foreign key: Dealer callers must own the LicenseApplication (dealer_id), the Salesperson (sponsoring_dealer_id), the Protest (protestant_dealer_id), the WarrantyRateDispute (dealer_id) or the ConsumerComplaint (dealer_id) they act on; Manufacturer callers must own the FranchiseFiling (manufacturer_id) or be the respondent on the WarrantyRateDispute (manufacturer_id) or the franchisor behind the protested filing."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all write (POST) endpoints whose roles include Dealer or Manufacturer; GET reads are open to every authenticated role and are never owner-scoped"
  - priority: 4
    category: auth
    check: "The X-User-ID resolving a consumer complaint differs from the investigator_user_id stamped on it (segregation of duties)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dealer-board/consumer-complaints/{id}/resolution"
  - priority: 5
    category: business_constraint
    check: "Request body parses, every required field is present, every enum value is a declared member, every numeric field is inside its declared range, every date/datetime is ISO-8601, repair_order_lines elements carry labor_charge_cents/labor_hours/repair_type, excluded_line_indexes are in range and unique, comparable_market_shares_pct is non-empty when basis == COMPARABLE_MARKET, and computed/system fields supplied by the client are ignored rather than honoured."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 6
    category: existence
    check: "Every id in the path exists, validated left to right."
    error_id: "ERR_DEALER_NOT_FOUND | ERR_MANUFACTURER_NOT_FOUND | ERR_HEARING_ROOM_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_SALESPERSON_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_PROTEST_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 7
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list."
    error_id: "ERR_DEALER_NOT_FOUND | ERR_MANUFACTURER_NOT_FOUND | ERR_HEARING_ROOM_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_SALESPERSON_NOT_FOUND"
    http_status: 404
    applies_to: "POST /dealer-board/license-applications, POST /dealer-board/salespersons, POST /dealer-board/franchise-filings, POST /dealer-board/protests, POST /dealer-board/protests/{id}/schedule, POST /dealer-board/warranty-rate-disputes, POST /dealer-board/consumer-complaints"
  - priority: 8
    category: state
    check: "expected_franchise_filing_version equals the referenced FranchiseFiling's current version (§1.2.1 protest-create-stale-filing)."
    error_id: ERR_STALE_FILING_VERSION
    http_status: 412
    applies_to: "POST /dealer-board/protests"
  - priority: 8
    category: state
    check: "expected_hearing_room_version equals the referenced HearingRoom's current version (§1.2.1 hearing-schedule-stale-room)."
    error_id: ERR_STALE_ROOM_VERSION
    http_status: 412
    applies_to: "POST /dealer-board/protests/{id}/schedule"
  - priority: 9
    category: state
    check: "The LicenseApplication is in a state that admits the requested action (submit from DRAFT, deficiency-notice from SUBMITTED, resubmit from DEFICIENT, decision from SUBMITTED)."
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: "POST /dealer-board/license-applications/{id}/submit, /deficiency-notice, /resubmit, /decision"
  - priority: 9
    category: state
    check: "The Salesperson is in a state that admits the requested action (license-decision from PENDING, renewal from LICENSED)."
    error_id: ERR_INVALID_SALESPERSON_STATE
    http_status: 409
    applies_to: "POST /dealer-board/salespersons/{id}/license-decision, POST /dealer-board/salespersons/{id}/renewal"
  - priority: 9
    category: state
    check: "The FranchiseFiling is in a state that admits the requested action (serve-notice from DRAFT, amend from NOTICE_SERVED or PROTEST_PENDING, finalize from NOTICE_SERVED, PROTEST_PENDING or PROTEST_RESOLVED — a PROTEST_PENDING filing passes the state gate and is then rejected by the priority-66 active-protest check, so the two errors stay distinguishable) and, for a protest, is in NOTICE_SERVED or PROTEST_PENDING rather than EFFECTIVE, BARRED, PROTEST_RESOLVED or DRAFT."
    error_id: ERR_INVALID_FILING_STATE
    http_status: 409
    applies_to: "POST /dealer-board/franchise-filings/{id}/serve-notice, /amend, /finalize, POST /dealer-board/protests"
  - priority: 9
    category: state
    check: "The Protest is in a state that admits the requested action (schedule from FILED, convene from SCHEDULED, decision from HEARD, appeal from SUSTAINED or DENIED, market-studies and evidence-submissions from FILED or SCHEDULED)."
    error_id: ERR_INVALID_PROTEST_STATE
    http_status: 409
    applies_to: "POST /dealer-board/protests/{id}/schedule, /convene, /decision, /appeal, /market-studies, /evidence-submissions"
  - priority: 9
    category: state
    check: "The WarrantyRateDispute is in a state that admits the requested action (response from FILED, decision from FILED or UNDER_REVIEW)."
    error_id: ERR_INVALID_DISPUTE_STATE
    http_status: 409
    applies_to: "POST /dealer-board/warranty-rate-disputes/{id}/response, /decision"
  - priority: 9
    category: state
    check: "The ConsumerComplaint is in a state that admits the requested action (investigation from RECEIVED, resolution from UNDER_INVESTIGATION, restitution-payment from SANCTIONED)."
    error_id: ERR_INVALID_COMPLAINT_STATE
    http_status: 409
    applies_to: "POST /dealer-board/consumer-complaints/{id}/investigation, /resolution, /restitution-payment"
  - priority: 20
    category: business_safety
    check: "The franchisor's state_registration_status is REGISTERED. A LAPSED franchisor may neither serve a franchise notice, nor amend one, nor answer a warranty rate dispute, nor be named as the respondent on a new dispute."
    error_id: ERR_MANUFACTURER_REGISTRATION_LAPSED
    http_status: 422
    applies_to: "POST /dealer-board/franchise-filings/{id}/serve-notice, /amend, POST /dealer-board/warranty-rate-disputes, POST /dealer-board/warranty-rate-disputes/{id}/response"
  - priority: 21
    category: business_safety
    check: "A dealer licence may only be approved when the recomputed deficiency_count is 0; the statutory minimums are not waivable by the board."
    error_id: ERR_APPLICATION_HAS_DEFICIENCIES
    http_status: 422
    applies_to: "POST /dealer-board/license-applications/{id}/decision with outcome APPROVED"
  - priority: 22
    category: business_safety
    check: "A salesperson licence may only be approved while the sponsoring dealer's license_status is LICENSED; a SUSPENDED, EXPIRED, REVOKED or CANCELLED sponsor bars the approval unless waiver_granted is true."
    error_id: ERR_SPONSOR_NOT_LICENSED
    http_status: 422
    applies_to: "POST /dealer-board/salespersons/{id}/license-decision with outcome APPROVED"
  - priority: 23
    category: business_safety
    check: "An applicant who declared disclosed_prior_discipline == false but already carries rolling disciplinary points > 0 may only be licensed when waiver_granted is true."
    error_id: ERR_UNDISCLOSED_DISCIPLINE
    http_status: 422
    applies_to: "POST /dealer-board/salespersons/{id}/license-decision with outcome APPROVED"
  - priority: 23
    category: business_safety
    check: "A salesperson carrying 9 or more rolling disciplinary points may not renew (calculations.salesperson_disciplinary_points.SALESPERSON_RENEWAL_BAR_POINTS)."
    error_id: ERR_SALESPERSON_DISCIPLINE_BAR
    http_status: 422
    applies_to: "POST /dealer-board/salespersons/{id}/renewal"
  - priority: 24
    category: business_safety
    check: "The acting dealer's license_status is LICENSED: a SUSPENDED, EXPIRED, REVOKED or CANCELLED dealer may not sponsor a salesperson, file a warranty rate dispute, file a protest or post evidence."
    error_id: ERR_DEALER_LICENSE_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /dealer-board/salespersons, POST /dealer-board/warranty-rate-disputes, POST /dealer-board/protests, POST /dealer-board/protests/{id}/evidence-submissions"
  - priority: 30
    category: business_referential
    check: "The filing's franchisor line_make matches the affected dealer's line_make, and a protestant's line_make matches the protested filing's line_make."
    error_id: ERR_LINE_MAKE_MISMATCH
    http_status: 422
    applies_to: "POST /dealer-board/franchise-filings, POST /dealer-board/protests"
  - priority: 31
    category: business_referential
    check: "TERMINATION and RELOCATION filings carry affected_dealer_id (and RELOCATION also carries site_x_km and site_y_km); ADDITIONAL_POINT filings carry site coordinates and no affected_dealer_id; termination_cause_code is present only for TERMINATION."
    error_id: ERR_FILING_FIELDS_INCONSISTENT
    http_status: 422
    applies_to: "POST /dealer-board/franchise-filings, POST /dealer-board/franchise-filings/{id}/amend"
  - priority: 32
    category: business_referential
    check: "The protestant has standing: for TERMINATION the protestant dealer must be the filing's affected_dealer_id; for RELOCATION and ADDITIONAL_POINT the protestant must be a different dealer whose franchise_status is FRANCHISED or TERMINATION_PENDING."
    error_id: ERR_NOT_INCUMBENT_DEALER
    http_status: 422
    applies_to: "POST /dealer-board/protests"
  - priority: 33
    category: business_referential
    check: "For RELOCATION and ADDITIONAL_POINT protests the computed distance_to_site_km is inside or on the relevant-market radius (24.00 km)."
    error_id: ERR_OUTSIDE_RELEVANT_MARKET
    http_status: 422
    applies_to: "POST /dealer-board/protests"
  - priority: 34
    category: business_referential
    check: "submitted_by_party PROTESTANT is posted by the protest's protestant dealer and submitted_by_party MANUFACTURER by the protested filing's franchisor; the same pairing governs evidence submissions."
    error_id: ERR_STUDY_PARTY_MISMATCH
    http_status: 422
    applies_to: "POST /dealer-board/protests/{id}/market-studies, POST /dealer-board/protests/{id}/evidence-submissions"
  - priority: 35
    category: business_referential
    check: "A complaint naming a salesperson names one sponsored by the complained-of dealer (salesperson.sponsoring_dealer_id == dealer_id)."
    error_id: ERR_SALESPERSON_DEALER_MISMATCH
    http_status: 422
    applies_to: "POST /dealer-board/consumer-complaints"
  - priority: 40
    category: business_temporal
    check: "The notice period reaches the statutory minimum: proposed_effective_on - notice date >= 60 days for TERMINATION and RELOCATION, >= 30 days for ADDITIONAL_POINT."
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /dealer-board/franchise-filings/{id}/serve-notice, POST /dealer-board/franchise-filings/{id}/amend"
  - priority: 41
    category: business_temporal
    check: "The 30-day protest window is still open: clock date <= filing.protest_window_ends_on."
    error_id: ERR_PROTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /dealer-board/protests"
  - priority: 42
    category: business_temporal
    check: "The protest window has closed before a filing is finalised: clock date > filing.protest_window_ends_on."
    error_id: ERR_PROTEST_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /dealer-board/franchise-filings/{id}/finalize"
  - priority: 43
    category: business_temporal
    check: "The proposed effective date has arrived: clock date >= filing.proposed_effective_on."
    error_id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /dealer-board/franchise-filings/{id}/finalize"
  - priority: 44
    category: business_temporal
    check: "hearing_start_at falls inside the statutory hearing window [protest.filed_on + 30 days, protest.filed_on + 180 days] and hearing_end_at is strictly after hearing_start_at."
    error_id: ERR_HEARING_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /dealer-board/protests/{id}/schedule"
  - priority: 45
    category: business_temporal
    check: "The docketed hearing instant has arrived: clock instant >= protest.hearing_start_at."
    error_id: ERR_HEARING_NOT_REACHED
    http_status: 422
    applies_to: "POST /dealer-board/protests/{id}/convene"
  - priority: 46
    category: business_temporal
    check: "Evidence is tendered on or before evidence_deadline_at, or after it only when leave_granted is true and the tender still precedes hearing_start_at."
    error_id: ERR_EVIDENCE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /dealer-board/protests/{id}/evidence-submissions"
  - priority: 47
    category: business_temporal
    check: "The appeal is noticed within 30 days of decided_on."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /dealer-board/protests/{id}/appeal"
  - priority: 48
    category: business_temporal
    check: "The franchisor answers a rate dispute within 30 days of filed_on."
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /dealer-board/warranty-rate-disputes/{id}/response"
  - priority: 49
    category: business_temporal
    check: "A RENEWAL application is submitted no earlier than 60 days before the current expiry."
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /dealer-board/license-applications/{id}/submit, POST /dealer-board/salespersons/{id}/renewal"
  - priority: 50
    category: business_temporal
    check: "A RENEWAL application is submitted no later than 30 days after the current expiry."
    error_id: ERR_RENEWAL_GRACE_EXPIRED
    http_status: 422
    applies_to: "POST /dealer-board/license-applications/{id}/submit, POST /dealer-board/salespersons/{id}/renewal"
  - priority: 51
    category: business_temporal
    check: "A RENEWAL application's requested_term_start_on equals the licensee's current license_expires_on + 1 day, so consecutive terms abut exactly and never overlap."
    error_id: ERR_TERM_NOT_CONTIGUOUS
    http_status: 422
    applies_to: "POST /dealer-board/license-applications/{id}/submit, POST /dealer-board/license-applications/{id}/decision"
  - priority: 52
    category: business_temporal
    check: "The logical clock only moves forward: to_iso8601 must be strictly after the current clock value (default 2026-08-01T00:00:00Z)."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /dealer-board/_clock/set_current_utc"
  - priority: 60
    category: business_constraint
    check: "The requested interval does not collide with another slot-holding hearing in the room once the room's changeover buffer is applied on both sides."
    error_id: ERR_HEARING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /dealer-board/protests/{id}/schedule"
  - priority: 61
    category: business_constraint
    check: "The room hosts fewer than max_hearings_per_day slot-holding hearings on the UTC date of hearing_start_at."
    error_id: ERR_ROOM_DAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /dealer-board/protests/{id}/schedule"
  - priority: 62
    category: business_constraint
    check: "The protestant dealer has no other protest against the same filing in a live state {FILED, SCHEDULED, HEARD, SUSTAINED, DENIED, APPEALED}."
    error_id: ERR_DUPLICATE_PROTEST
    http_status: 409
    applies_to: "POST /dealer-board/protests"
  - priority: 63
    category: business_constraint
    check: "exhibit_label is unique per (protest_id, submitting_party)."
    error_id: ERR_DUPLICATE_EXHIBIT_LABEL
    http_status: 409
    applies_to: "POST /dealer-board/protests/{id}/evidence-submissions"
  - priority: 64
    category: business_constraint
    check: "amendment_count < 2 before a filing may be amended again."
    error_id: ERR_AMENDMENT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /dealer-board/franchise-filings/{id}/amend"
  - priority: 65
    category: business_constraint
    check: "resubmission_count < 2 before a deficient application may be resubmitted again."
    error_id: ERR_RESUBMISSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /dealer-board/license-applications/{id}/resubmit"
  - priority: 66
    category: business_constraint
    check: "active_protest_count == 0 before a filing may be finalised."
    error_id: ERR_ACTIVE_PROTEST_BLOCKS_FINALIZE
    http_status: 409
    applies_to: "POST /dealer-board/franchise-filings/{id}/finalize"
  - priority: 67
    category: business_constraint
    check: "No Protest against the filing is in APPEALED; a pending court appeal freezes the filing."
    error_id: ERR_APPEAL_PENDING
    http_status: 409
    applies_to: "POST /dealer-board/franchise-filings/{id}/finalize"
  - priority: 68
    category: business_constraint
    check: "line_make is unique across Manufacturer rows and room_code is unique across HearingRoom rows."
    error_id: "ERR_DUPLICATE_LINE_MAKE | ERR_DUPLICATE_ROOM_CODE"
    http_status: 409
    applies_to: "POST /dealer-board/manufacturers, POST /dealer-board/hearing-rooms"
  - priority: 69
    category: business_constraint
    check: "The dealer has no other LicenseApplication in {DRAFT, SUBMITTED, DEFICIENT} of the same application_type."
    error_id: ERR_OPEN_APPLICATION_EXISTS
    http_status: 409
    applies_to: "POST /dealer-board/license-applications"
  - priority: 70
    category: business_constraint
    check: "The dealer/franchisor pair has no other WarrantyRateDispute in {FILED, UNDER_REVIEW}."
    error_id: ERR_OPEN_DISPUTE_EXISTS
    http_status: 409
    applies_to: "POST /dealer-board/warranty-rate-disputes"
  - priority: 80
    category: business_fiscal
    check: "The repair-order sample carries at least 5 qualifying lines (CUSTOMER_PAID with labor_hours >= 0.5)."
    error_id: ERR_INSUFFICIENT_RO_SAMPLE
    http_status: 422
    applies_to: "POST /dealer-board/warranty-rate-disputes"
  - priority: 81
    category: business_fiscal
    check: "The declared rate strictly exceeds the franchisor's posted_warranty_labor_rate_cents; a dealer may not litigate down to a rate it already receives."
    error_id: ERR_RATE_NOT_ABOVE_POSTED
    http_status: 422
    applies_to: "POST /dealer-board/warranty-rate-disputes"
  - priority: 82
    category: business_fiscal
    check: "A substantiated resolution carries alleged_loss_cents > 0 so the restitution ledger is never opened with a zero balance."
    error_id: ERR_LOSS_REQUIRED_FOR_SANCTION
    http_status: 422
    applies_to: "POST /dealer-board/consumer-complaints/{id}/resolution"
  - priority: 83
    category: business_fiscal
    check: "sanction_type is present exactly when substantiated is true and absent when it is false."
    error_id: ERR_SANCTION_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /dealer-board/consumer-complaints/{id}/resolution"
  - priority: 84
    category: business_fiscal
    check: "restitution_paid_cents + amount_cents <= restitution_ordered_cents; an overpayment is refused rather than clipped, preserving the ledger invariant."
    error_id: ERR_RESTITUTION_OVERPAYMENT
    http_status: 422
    applies_to: "POST /dealer-board/consumer-complaints/{id}/restitution-payment"
  - priority: 85
    category: business_fiscal
    check: "At least one probative PROTESTANT MarketStudy exists before a hearing may be convened."
    error_id: ERR_NO_PROBATIVE_STUDY
    http_status: 422
    applies_to: "POST /dealer-board/protests/{id}/convene"
  - priority: 86
    category: business_fiscal
    check: "A protest may be SUSTAINED only when good_cause_score >= good_cause_threshold."
    error_id: ERR_GOOD_CAUSE_NOT_ESTABLISHED
    http_status: 422
    applies_to: "POST /dealer-board/protests/{id}/decision"

endpoints:
  - method: POST
    path: "/dealer-board/_clock/set_current_utc"
    description: "Test-driving endpoint: advances the server's logical clock and runs the ops sweep. The clock's startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. The sweep expires dealer and salesperson licences, suspends dealers whose restitution is past due, ages disciplinary points out of the 730-day window and finalises protests whose appeal window has lapsed, processing each collection in created_at ASC order."
    roles: [BoardAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, swept_dealer_count: integer, swept_salesperson_count: integer, swept_protest_count: integer, swept_complaint_count: integer }"
    side_effects:
      - "Dealer LICENSED -> EXPIRED when license_expires_on < new clock date"
      - "Dealer LICENSED -> SUSPENDED (RESTITUTION_DELINQUENT) when a SANCTIONED complaint's restitution_due_on < new clock date and the balance is unpaid"
      - "Salesperson LICENSED -> EXPIRED, and discipline dimension rollbacks as points age out (recomputes calculations.dealer_disciplinary_points and calculations.salesperson_disciplinary_points)"
      - "Protest SUSTAINED/DENIED -> FINAL when new clock date > decided_on + 30 days"

  - method: POST
    path: "/dealer-board/manufacturers"
    description: "Register a franchisor / distributor with the board."
    roles: [BoardAdmin]
    code: 201
    input: [legal_name, line_make, home_office_state, posted_warranty_labor_rate_cents, "state_registration_status?"]
    output: Manufacturer
    side_effects: ["ERR_DUPLICATE_LINE_MAKE when line_make already exists"]

  - method: GET
    path: "/dealer-board/manufacturers/{id}"
    description: "Read one franchisor."
    roles: [BoardAdmin, LicensingAnalyst, HearingClerk, ComplaintInvestigator, Dealer, Manufacturer]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []

  - method: GET
    path: "/dealer-board/manufacturers"
    description: "List franchisors."
    roles: [BoardAdmin, LicensingAnalyst, HearingClerk, ComplaintInvestigator, Dealer, Manufacturer]
    code: 200
    input: ["state_registration_status?", "line_make?", "limit?", "offset?"]
    output: Manufacturer[]
    side_effects: []

  - method: POST
    path: "/dealer-board/hearing-rooms"
    description: "Create a board hearing room."
    roles: [BoardAdmin]
    code: 201
    input: [room_code, seating_capacity, "max_hearings_per_day?", "buffer_minutes?"]
    output: HearingRoom
    side_effects: ["ERR_DUPLICATE_ROOM_CODE when room_code already exists"]

  - method: GET
    path: "/dealer-board/hearing-rooms/{id}"
    description: "Read one hearing room, including booked_hearing_count and version (the OCC comparand for scheduling)."
    roles: [BoardAdmin, HearingClerk, Dealer, Manufacturer]
    code: 200
    input: []
    output: HearingRoom
    side_effects: []

  - method: GET
    path: "/dealer-board/hearing-rooms"
    description: "List hearing rooms."
    roles: [BoardAdmin, HearingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: HearingRoom[]
    side_effects: []

  - method: POST
    path: "/dealer-board/dealers"
    description: "Create a prospective dealer record. license_status starts PROSPECTIVE and franchise_status starts NONE."
    roles: [BoardAdmin]
    code: 201
    input: [legal_name, dealer_type, county_tier, site_x_km, site_y_km, "line_make?"]
    output: Dealer
    side_effects: []

  - method: GET
    path: "/dealer-board/dealers/{id}"
    description: "Read one dealer, including both state dimensions, disciplinary_points, restitution_outstanding_cents and version."
    roles: [BoardAdmin, LicensingAnalyst, HearingClerk, ComplaintInvestigator, Dealer, Manufacturer]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: GET
    path: "/dealer-board/dealers"
    description: "List dealers with filters."
    roles: [BoardAdmin, LicensingAnalyst, HearingClerk, ComplaintInvestigator, Dealer, Manufacturer]
    code: 200
    input: ["license_status?", "franchise_status?", "county_tier?", "line_make?", "limit?", "offset?"]
    output: Dealer[]
    side_effects: []

  - method: POST
    path: "/dealer-board/license-applications"
    description: "Open a licence application in DRAFT for a dealer."
    roles: [Dealer, BoardAdmin]
    code: 201
    input: [dealer_id, application_type, facility_sqft, display_spaces, service_bays, bond_amount_cents, insurance_liability_cents, zoning_certificate_status, line_make_count, "requested_term_start_on?", "relocation_site_x_km?", "relocation_site_y_km?", "new_owner_name?"]
    output: LicenseApplication
    side_effects: ["status = DRAFT; ERR_OPEN_APPLICATION_EXISTS when another live application of the same type exists"]

  - method: POST
    path: "/dealer-board/license-applications/{id}/submit"
    description: "Submit a DRAFT application for review."
    roles: [Dealer]
    code: 200
    input: []
    output: LicenseApplication
    side_effects:
      - "runs calculations.application_deficiency_scan (writes deficiency_codes, deficiency_count)"
      - "runs calculations.license_fee_assessment PROVISIONAL variant (writes fee_quoted_cents)"
      - "stamps submitted_at; status DRAFT -> SUBMITTED"

  - method: POST
    path: "/dealer-board/license-applications/{id}/deficiency-notice"
    description: "Analyst returns a submitted application for correction."
    roles: [LicensingAnalyst]
    code: 200
    input: [deficiency_note]
    output: LicenseApplication
    side_effects: ["status SUBMITTED -> DEFICIENT; BoardAdmin may not issue deficiency notices (segregation of duties)"]

  - method: POST
    path: "/dealer-board/license-applications/{id}/resubmit"
    description: "Dealer corrects a deficient application and resubmits; capped at 2 resubmissions."
    roles: [Dealer]
    code: 200
    input: ["facility_sqft?", "display_spaces?", "service_bays?", "bond_amount_cents?", "insurance_liability_cents?", "zoning_certificate_status?", "line_make_count?"]
    output: LicenseApplication
    side_effects:
      - "increments resubmission_count; status DEFICIENT -> SUBMITTED"
      - "re-runs calculations.application_deficiency_scan and the PROVISIONAL fee variant"

  - method: POST
    path: "/dealer-board/license-applications/{id}/decision"
    description: "Board decides a submitted application."
    roles: [BoardAdmin]
    code: 200
    input: [outcome, "denial_reason_code?"]
    output: LicenseApplication
    side_effects:
      - "runs calculations.license_fee_assessment FINAL variant (writes fee_total_cents and fee_delta_cents)"
      - "on APPROVED: runs calculations.license_term_dates and advances the dealer's licence dimension (and the franchise dimension for NEW_MOTOR_VEHICLE); increments Dealer.version by 1"
      - "on DENIED: stores denial_reason_code and leaves both dealer dimensions untouched"

  - method: GET
    path: "/dealer-board/license-applications/{id}"
    description: "Read one licence application, including the deficiency scan and both fee variants."
    roles: [BoardAdmin, LicensingAnalyst, Dealer]
    code: 200
    input: []
    output: LicenseApplication
    side_effects: []

  - method: GET
    path: "/dealer-board/license-applications"
    description: "List licence applications; the reverse-reachability channel for LicenseApplication.dealer_id."
    roles: [BoardAdmin, LicensingAnalyst, Dealer]
    code: 200
    input: ["dealer_id?", "status?", "application_type?", "limit?", "offset?"]
    output: LicenseApplication[]
    side_effects: []

  - method: POST
    path: "/dealer-board/salespersons"
    description: "Sponsor a salesperson licence applicant. license_status starts PENDING and discipline_status starts CLEAR."
    roles: [Dealer]
    code: 201
    input: [sponsoring_dealer_id, full_name, disclosed_prior_discipline]
    output: Salesperson
    side_effects: ["requires the sponsoring dealer's license_status == LICENSED (ERR_DEALER_LICENSE_NOT_ACTIVE)"]

  - method: POST
    path: "/dealer-board/salespersons/{id}/license-decision"
    description: "Analyst decides a pending salesperson licence, optionally waiving an undisclosed-discipline bar."
    roles: [LicensingAnalyst]
    code: 200
    input: [outcome, "waiver_granted?", "denial_reason_code?"]
    output: Salesperson
    side_effects:
      - "on APPROVED: runs calculations.license_term_dates for the 365-day salesperson term; license_status PENDING -> LICENSED; recomputes Dealer.licensed_salesperson_count"
      - "on DENIED: license_status PENDING -> DENIED and no term dates are written"

  - method: POST
    path: "/dealer-board/salespersons/{id}/renewal"
    description: "Renew a licensed salesperson for a further 365-day term. The licence dimension cycles LICENSED -> RENEWAL_PENDING -> LICENSED while the discipline dimension is untouched."
    roles: [Dealer]
    code: 200
    input: []
    output: Salesperson
    side_effects:
      - "reads calculations.salesperson_disciplinary_points; 9 or more rolling points bars the renewal (ERR_SALESPERSON_DISCIPLINE_BAR)"
      - "increments renewal_count and re-stamps license_effective_on / license_expires_on so consecutive terms abut exactly"

  - method: GET
    path: "/dealer-board/salespersons/{id}"
    description: "Read one salesperson, including both state dimensions and the rolling point total."
    roles: [BoardAdmin, LicensingAnalyst, ComplaintInvestigator, Dealer]
    code: 200
    input: []
    output: Salesperson
    side_effects: []

  - method: GET
    path: "/dealer-board/salespersons"
    description: "List salespersons; the reverse-reachability channel for Salesperson.sponsoring_dealer_id."
    roles: [BoardAdmin, LicensingAnalyst, ComplaintInvestigator, Dealer]
    code: 200
    input: ["sponsoring_dealer_id?", "license_status?", "discipline_status?", "limit?", "offset?"]
    output: Salesperson[]
    side_effects: []

  - method: POST
    path: "/dealer-board/franchise-filings"
    description: "Franchisor opens a franchise filing in DRAFT (TERMINATION, RELOCATION or ADDITIONAL_POINT)."
    roles: [Manufacturer]
    code: 201
    input: [manufacturer_id, filing_type, proposed_effective_on, "affected_dealer_id?", "site_x_km?", "site_y_km?", "termination_cause_code?"]
    output: FranchiseFiling
    side_effects: ["copies the franchisor's line_make onto the filing; status = DRAFT"]

  - method: POST
    path: "/dealer-board/franchise-filings/{id}/serve-notice"
    description: "Serve statutory notice, opening the 30-day protest window."
    roles: [Manufacturer]
    code: 200
    input: []
    output: FranchiseFiling
    side_effects:
      - "stamps notice_served_on = clock date, notice_days_provided and protest_window_ends_on = notice_served_on + 30 days; status DRAFT -> NOTICE_SERVED"
      - "for TERMINATION: the affected dealer's franchise dimension moves FRANCHISED -> TERMINATION_PENDING and Dealer.version increments by 1"
      - "increments FranchiseFiling.version by 1"

  - method: POST
    path: "/dealer-board/franchise-filings/{id}/amend"
    description: "Franchisor amends a served notice, restarting the protest window; capped at 2 amendments."
    roles: [Manufacturer]
    code: 200
    input: [proposed_effective_on, "site_x_km?", "site_y_km?"]
    output: FranchiseFiling
    side_effects:
      - "increments amendment_count, re-stamps notice_served_on and protest_window_ends_on; status returns to NOTICE_SERVED from either NOTICE_SERVED or PROTEST_PENDING"
      - "withdraws every Protest against this filing in {FILED, SCHEDULED}, releases each held hearing slot and recomputes HearingRoom.booked_hearing_count (incrementing HearingRoom.version by 1 per affected room)"
      - "increments FranchiseFiling.version by 1"

  - method: POST
    path: "/dealer-board/franchise-filings/{id}/finalize"
    description: "Board lets the filing take effect once the window has closed, the effective date has arrived and nothing is pending."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: FranchiseFiling
    side_effects:
      - "status -> EFFECTIVE"
      - "for TERMINATION: cascade link 1 moves the affected dealer to franchise_status TERMINATED and license_status CANCELLED; link 2 moves that dealer's FILED/UNDER_REVIEW WarrantyRateDispute rows to DISMISSED_MOOT; link 3 recomputes Manufacturer.open_dispute_count; sponsored salespersons move to SUSPENDED_BY_SPONSOR"
      - "for RELOCATION: overwrites the affected dealer's site_x_km / site_y_km"
      - "increments FranchiseFiling.version by 1 and Dealer.version by 1 where a dealer was touched"

  - method: GET
    path: "/dealer-board/franchise-filings/{id}"
    description: "Read one franchise filing, including notice dates, amendment_count, active_protest_count and version (the OCC comparand for protest filing)."
    roles: [BoardAdmin, HearingClerk, LicensingAnalyst, Dealer, Manufacturer]
    code: 200
    input: []
    output: FranchiseFiling
    side_effects: []

  - method: GET
    path: "/dealer-board/franchise-filings"
    description: "List franchise filings; the reverse-reachability channel for FranchiseFiling.manufacturer_id and FranchiseFiling.affected_dealer_id."
    roles: [BoardAdmin, HearingClerk, LicensingAnalyst, Dealer, Manufacturer]
    code: 200
    input: ["manufacturer_id?", "affected_dealer_id?", "filing_type?", "status?", "limit?", "offset?"]
    output: FranchiseFiling[]
    side_effects: []

  - method: POST
    path: "/dealer-board/protests"
    description: "Incumbent dealer protests a served filing. Guarded by OCC on the filing's version (§1.2.1 protest-create-stale-filing)."
    roles: [Dealer]
    code: 201
    input: [franchise_filing_id, protestant_dealer_id, grounds_code, expected_franchise_filing_version]
    output: Protest
    side_effects:
      - "stamps filed_on = clock date and, for RELOCATION / ADDITIONAL_POINT, distance_to_site_km per calculations.relevant_market_distance"
      - "moves the filing NOTICE_SERVED -> PROTEST_PENDING on the first protest and recomputes active_protest_count"
      - "increments FranchiseFiling.version by 1"

  - method: POST
    path: "/dealer-board/protests/{id}/schedule"
    description: "Clerk dockets the good-cause hearing into a room. Guarded by OCC on the room's version (§1.2.1 hearing-schedule-stale-room)."
    roles: [HearingClerk]
    code: 200
    input: [hearing_room_id, hearing_start_at, hearing_end_at, hearing_session_count, expected_hearing_room_version]
    output: Protest
    side_effects:
      - "runs calculations.hearing_room_slot_ledger for the buffered collision test and the day-capacity test"
      - "sets evidence_deadline_at = hearing_start_at - 7 days; status FILED -> SCHEDULED"
      - "increments HearingRoom.booked_hearing_count by 1 and increments HearingRoom.version by 1"

  - method: POST
    path: "/dealer-board/protests/{id}/market-studies"
    description: "Either party tenders a market-penetration study. Append-only: MarketStudy rows are immutable and carry no version."
    roles: [Dealer, Manufacturer]
    code: 201
    input: [submitted_by_party, basis, total_market_registrations, line_make_registrations, permanency_investment_cents, consumer_access_drive_minutes, market_growth_pct, "statewide_line_make_share_pct?", "comparable_market_shares_pct?"]
    output: MarketStudy
    side_effects: ["runs calculations.market_penetration_analysis (writes actual_penetration_pct, expected_penetration_pct, shortfall_pts, is_probative)"]

  - method: GET
    path: "/dealer-board/protests/{id}/market-studies"
    description: "List the studies tendered in this protest; the reverse-reachability channel for MarketStudy.protest_id."
    roles: [BoardAdmin, HearingClerk, Dealer, Manufacturer]
    code: 200
    input: ["submitted_by_party?", "limit?", "offset?"]
    output: MarketStudy[]
    side_effects: []

  - method: POST
    path: "/dealer-board/protests/{id}/evidence-submissions"
    description: "Either party tenders an exhibit. Append-only and immutable."
    roles: [Dealer, Manufacturer]
    code: 201
    input: [submitting_party, exhibit_label, page_count, "leave_granted?"]
    output: EvidenceSubmission
    side_effects:
      - "stamps received_at = clock instant and classifies acceptance_status as ACCEPTED or LATE_ACCEPTED"
      - "recomputes Protest.accepted_evidence_pages and Protest.late_evidence_count"

  - method: GET
    path: "/dealer-board/protests/{id}/evidence-submissions"
    description: "List the exhibits tendered in this protest; the reverse-reachability channel for EvidenceSubmission.protest_id."
    roles: [BoardAdmin, HearingClerk, Dealer, Manufacturer]
    code: 200
    input: ["submitting_party?", "limit?", "offset?"]
    output: EvidenceSubmission[]
    side_effects: []

  - method: POST
    path: "/dealer-board/protests/{id}/convene"
    description: "Clerk convenes the docketed hearing. Branching: a protestant that still holds an active licence reaches HEARD, one that has lost its licence reaches DISMISSED and gives up the room slot."
    roles: [HearingClerk]
    code: 200
    input: []
    output: Protest
    side_effects:
      - "on HEARD: freezes accepted_evidence_pages / late_evidence_count and runs calculations.good_cause_score"
      - "on DISMISSED: clears the hearing fields, decrements HearingRoom.booked_hearing_count, increments HearingRoom.version by 1 and may move the filing PROTEST_PENDING -> PROTEST_RESOLVED"

  - method: POST
    path: "/dealer-board/protests/{id}/decision"
    description: "Board decides a heard protest."
    roles: [BoardAdmin]
    code: 200
    input: [outcome, "findings_note?"]
    output: Protest
    side_effects:
      - "runs calculations.hearing_cost_assessment (writes assessment_total_cents, protestant_share_cents, manufacturer_share_cents) and stamps decided_on"
      - "on SUSTAINED: the filing moves PROTEST_PENDING -> BARRED and a TERMINATION filing's affected dealer returns TERMINATION_PENDING -> FRANCHISED"
      - "on DENIED: the filing moves PROTEST_PENDING -> PROTEST_RESOLVED once no live protest remains"

  - method: POST
    path: "/dealer-board/protests/{id}/appeal"
    description: "Either party notices a court appeal within 30 days of the decision, freezing the filing."
    roles: [Dealer, Manufacturer]
    code: 200
    input: [court_docket_number]
    output: Protest
    side_effects: ["stamps appeal_filed_on and derives appellant_party from the caller's role; status -> APPEALED"]

  - method: GET
    path: "/dealer-board/protests/{id}"
    description: "Read one protest, including hearing docket fields, the good-cause score and the assessment split."
    roles: [BoardAdmin, HearingClerk, LicensingAnalyst, Dealer, Manufacturer]
    code: 200
    input: []
    output: Protest
    side_effects: []

  - method: GET
    path: "/dealer-board/protests"
    description: "List protests; the reverse-reachability channel for Protest.franchise_filing_id, Protest.protestant_dealer_id and Protest.hearing_room_id."
    roles: [BoardAdmin, HearingClerk, LicensingAnalyst, Dealer, Manufacturer]
    code: 200
    input: ["franchise_filing_id?", "protestant_dealer_id?", "hearing_room_id?", "status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []

  - method: GET
    path: "/dealer-board/protests/{id}/good-cause-analysis"
    description: "Computed read: the good-cause weighting as it stands now, including which study controls for each party."
    roles: [BoardAdmin, HearingClerk, Dealer, Manufacturer]
    code: 200
    input: []
    output: "{ controlling_protestant_study_id: string, controlling_manufacturer_study_id: string, net_shortfall_pts: number, inadequacy_component: number, investment_component: number, access_component: number, growth_component: number, good_cause_score: number, good_cause_threshold: number, good_cause_established: boolean }"
    side_effects: []

  - method: POST
    path: "/dealer-board/warranty-rate-disputes"
    description: "Dealer files a warranty reimbursement rate dispute with its repair-order sample."
    roles: [Dealer]
    code: 201
    input: [dealer_id, manufacturer_id, repair_order_lines]
    output: WarrantyRateDispute
    side_effects:
      - "stamps filed_on = clock date; status = FILED"
      - "runs calculations.warranty_labor_rate_determination PER_ORDER_MEAN variant (writes qualifying_line_count and declared_rate_cents)"
      - "recomputes Manufacturer.open_dispute_count"

  - method: POST
    path: "/dealer-board/warranty-rate-disputes/{id}/response"
    description: "Franchisor answers within 30 days, either accepting the sample or rebutting it with line exclusions."
    roles: [Manufacturer]
    code: 200
    input: [manufacturer_response_type, "excluded_line_indexes?"]
    output: WarrantyRateDispute
    side_effects:
      - "status FILED -> UNDER_REVIEW"
      - "on REBUT: runs the AGGREGATE_WEIGHTED variant over the surviving lines (writes counter_rate_cents and spread_pct)"
      - "on ACCEPT: counter_rate_cents and spread_pct stay null"

  - method: POST
    path: "/dealer-board/warranty-rate-disputes/{id}/decision"
    description: "Board sets the reimbursement rate or denies the dispute."
    roles: [BoardAdmin]
    code: 200
    input: [outcome, "denial_reason_code?"]
    output: WarrantyRateDispute
    side_effects:
      - "on APPROVED: writes approved_rate_cents, decided_on and effective_on = decided_on + 30 days, and overwrites Dealer.approved_warranty_labor_rate_cents (incrementing Dealer.version by 1)"
      - "on DENIED: writes denial_reason_code and decided_on only"
      - "recomputes Manufacturer.open_dispute_count"

  - method: GET
    path: "/dealer-board/warranty-rate-disputes/{id}"
    description: "Read one rate dispute, including both rate variants and the spread."
    roles: [BoardAdmin, LicensingAnalyst, Dealer, Manufacturer]
    code: 200
    input: []
    output: WarrantyRateDispute
    side_effects: []

  - method: GET
    path: "/dealer-board/warranty-rate-disputes"
    description: "List rate disputes; the reverse-reachability channel for WarrantyRateDispute.dealer_id and WarrantyRateDispute.manufacturer_id."
    roles: [BoardAdmin, LicensingAnalyst, Dealer, Manufacturer]
    code: 200
    input: ["dealer_id?", "manufacturer_id?", "status?", "limit?", "offset?"]
    output: WarrantyRateDispute[]
    side_effects: []

  - method: POST
    path: "/dealer-board/consumer-complaints"
    description: "Investigator intakes a consumer complaint against a dealer, optionally naming a sponsored salesperson."
    roles: [ComplaintInvestigator]
    code: 201
    input: [dealer_id, complainant_name, allegation_code, alleged_loss_cents, "salesperson_id?"]
    output: ConsumerComplaint
    side_effects: ["status = RECEIVED"]

  - method: POST
    path: "/dealer-board/consumer-complaints/{id}/investigation"
    description: "Investigator records findings and takes ownership of the file."
    roles: [ComplaintInvestigator]
    code: 200
    input: [findings_code]
    output: ConsumerComplaint
    side_effects: ["stamps investigator_user_id with the caller's X-User-ID; status RECEIVED -> UNDER_INVESTIGATION"]

  - method: POST
    path: "/dealer-board/consumer-complaints/{id}/resolution"
    description: "Board resolves the complaint. Segregation of duties: the resolving X-User-ID must differ from investigator_user_id."
    roles: [BoardAdmin]
    code: 200
    input: [substantiated, "sanction_type?"]
    output: ConsumerComplaint
    side_effects:
      - "on substantiated true: runs calculations.complaint_sanction_assessment (writes points_assessed, civil_penalty_cents, restitution_ordered_cents, restitution_due_on), recomputes calculations.dealer_disciplinary_points, calculations.salesperson_disciplinary_points and calculations.restitution_ledger, and may cascade the dealer to SUSPENDED or REVOKED and its salespersons to SUSPENDED_BY_SPONSOR (incrementing Dealer.version by 1)"
      - "on substantiated false: status -> CLOSED_UNSUBSTANTIATED with no fiscal or disciplinary effect"

  - method: POST
    path: "/dealer-board/consumer-complaints/{id}/restitution-payment"
    description: "Dealer pays restitution, in full or in instalments."
    roles: [Dealer]
    code: 200
    input: [amount_cents]
    output: ConsumerComplaint
    side_effects:
      - "increases restitution_paid_cents and decreases Dealer.restitution_outstanding_cents by the same amount (calculations.restitution_ledger)"
      - "settling the balance moves the complaint to CLOSED_SATISFIED and, when no other complaint is delinquent, restores a RESTITUTION_DELINQUENT suspension to LICENSED (incrementing Dealer.version by 1)"

  - method: GET
    path: "/dealer-board/consumer-complaints/{id}"
    description: "Read one complaint, including the sanction and the restitution ledger."
    roles: [BoardAdmin, ComplaintInvestigator, LicensingAnalyst, Dealer]
    code: 200
    input: []
    output: ConsumerComplaint
    side_effects: []

  - method: GET
    path: "/dealer-board/consumer-complaints"
    description: "List complaints; the reverse-reachability channel for ConsumerComplaint.dealer_id and ConsumerComplaint.salesperson_id."
    roles: [BoardAdmin, ComplaintInvestigator, LicensingAnalyst, Dealer]
    code: 200
    input: ["dealer_id?", "salesperson_id?", "status?", "allegation_code?", "limit?", "offset?"]
    output: ConsumerComplaint[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the six declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed on the target endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed caller acts on a resource owned by a different Dealer or Manufacturer."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID resolving a consumer complaint equals the investigator_user_id that investigated it."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, undeclared enum member, out-of-range number, non-ISO-8601 date, malformed repair_order_lines element, duplicate or out-of-range excluded_line_indexes, or comparable_market_shares_pct missing when basis == COMPARABLE_MARKET."
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "No Dealer with the given id, in the path or in a body foreign key."
  - id: ERR_MANUFACTURER_NOT_FOUND
    http: 404
    condition: "No Manufacturer with the given id."
  - id: ERR_HEARING_ROOM_NOT_FOUND
    http: 404
    condition: "No HearingRoom with the given hearing_room_id."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No LicenseApplication with the given id."
  - id: ERR_SALESPERSON_NOT_FOUND
    http: 404
    condition: "No Salesperson with the given id."
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "No FranchiseFiling with the given id."
  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "No Protest with the given id."
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "No WarrantyRateDispute with the given id."
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "No ConsumerComplaint with the given id."
  - id: ERR_STALE_FILING_VERSION
    http: 412
    condition: "expected_franchise_filing_version does not match the filing's current version (§1.2.1 protest-create-stale-filing)."
  - id: ERR_STALE_ROOM_VERSION
    http: 412
    condition: "expected_hearing_room_version does not match the room's current version (§1.2.1 hearing-schedule-stale-room)."
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "The LicenseApplication is not in a state that admits the requested action."
  - id: ERR_INVALID_SALESPERSON_STATE
    http: 409
    condition: "The Salesperson is not in a licence state that admits the requested action."
  - id: ERR_INVALID_FILING_STATE
    http: 409
    condition: "The FranchiseFiling is not in a state that admits the requested action, including protesting a filing that is DRAFT, PROTEST_RESOLVED, EFFECTIVE or BARRED."
  - id: ERR_INVALID_PROTEST_STATE
    http: 409
    condition: "The Protest is not in a state that admits the requested action."
  - id: ERR_INVALID_DISPUTE_STATE
    http: 409
    condition: "The WarrantyRateDispute is not in a state that admits the requested action."
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "The ConsumerComplaint is not in a state that admits the requested action."
  - id: ERR_MANUFACTURER_REGISTRATION_LAPSED
    http: 422
    condition: "The franchisor's state_registration_status is LAPSED."
  - id: ERR_APPLICATION_HAS_DEFICIENCIES
    http: 422
    condition: "An application with deficiency_count > 0 is approved."
  - id: ERR_SPONSOR_NOT_LICENSED
    http: 422
    condition: "A salesperson licence is approved while the sponsoring dealer's license_status is not LICENSED and no waiver is granted."
  - id: ERR_UNDISCLOSED_DISCIPLINE
    http: 422
    condition: "A salesperson licence is approved although the applicant denied prior discipline yet carries rolling disciplinary points, and no waiver is granted."
  - id: ERR_SALESPERSON_DISCIPLINE_BAR
    http: 422
    condition: "A salesperson with 9 or more rolling disciplinary points attempts to renew."
  - id: ERR_DEALER_LICENSE_NOT_ACTIVE
    http: 422
    condition: "The acting dealer's license_status is not LICENSED."
  - id: ERR_LINE_MAKE_MISMATCH
    http: 422
    condition: "The franchisor's line_make does not match the affected dealer's, or a protestant's line_make does not match the protested filing's."
  - id: ERR_FILING_FIELDS_INCONSISTENT
    http: 422
    condition: "Filing-type-conditional fields are missing or present when forbidden (affected_dealer_id, site coordinates, termination_cause_code)."
  - id: ERR_NOT_INCUMBENT_DEALER
    http: 422
    condition: "The protestant lacks statutory standing for this filing type."
  - id: ERR_OUTSIDE_RELEVANT_MARKET
    http: 422
    condition: "distance_to_site_km exceeds the 24.00 km relevant-market radius."
  - id: ERR_STUDY_PARTY_MISMATCH
    http: 422
    condition: "The declared party does not match the caller's side of the protest."
  - id: ERR_SALESPERSON_DEALER_MISMATCH
    http: 422
    condition: "The named salesperson is not sponsored by the complained-of dealer."
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 422
    condition: "The notice period falls short of 60 days (TERMINATION, RELOCATION) or 30 days (ADDITIONAL_POINT)."
  - id: ERR_PROTEST_WINDOW_CLOSED
    http: 422
    condition: "A protest is filed after protest_window_ends_on."
  - id: ERR_PROTEST_WINDOW_OPEN
    http: 422
    condition: "A filing is finalised while the protest window is still open."
  - id: ERR_EFFECTIVE_DATE_NOT_REACHED
    http: 422
    condition: "A filing is finalised before proposed_effective_on."
  - id: ERR_HEARING_OUTSIDE_WINDOW
    http: 422
    condition: "hearing_start_at falls outside [filed_on + 30 days, filed_on + 180 days], or hearing_end_at is not strictly after hearing_start_at."
  - id: ERR_HEARING_NOT_REACHED
    http: 422
    condition: "A hearing is convened before hearing_start_at."
  - id: ERR_EVIDENCE_DEADLINE_PASSED
    http: 422
    condition: "An exhibit is tendered after evidence_deadline_at without leave, or at or after hearing_start_at."
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "An appeal is noticed more than 30 days after decided_on."
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "A franchisor answers a rate dispute more than 30 days after filed_on."
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "A renewal is submitted more than 60 days before expiry."
  - id: ERR_RENEWAL_GRACE_EXPIRED
    http: 422
    condition: "A renewal is submitted more than 30 days after expiry."
  - id: ERR_TERM_NOT_CONTIGUOUS
    http: 422
    condition: "requested_term_start_on is not exactly the current license_expires_on + 1 day."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "to_iso8601 is not strictly after the current logical clock value."
  - id: ERR_HEARING_ROOM_CONFLICT
    http: 409
    condition: "The requested interval collides with another slot-holding hearing once the room's changeover buffer is applied."
  - id: ERR_ROOM_DAY_CAPACITY_EXCEEDED
    http: 409
    condition: "The room already hosts max_hearings_per_day slot-holding hearings on that UTC date."
  - id: ERR_DUPLICATE_PROTEST
    http: 409
    condition: "The protestant already has a live protest against the same filing."
  - id: ERR_DUPLICATE_EXHIBIT_LABEL
    http: 409
    condition: "exhibit_label repeats for the same (protest_id, submitting_party)."
  - id: ERR_AMENDMENT_LIMIT_REACHED
    http: 409
    condition: "A third amendment is attempted (amendment_count already 2)."
  - id: ERR_RESUBMISSION_LIMIT_REACHED
    http: 409
    condition: "A third resubmission is attempted (resubmission_count already 2)."
  - id: ERR_ACTIVE_PROTEST_BLOCKS_FINALIZE
    http: 409
    condition: "A filing with active_protest_count > 0 is finalised."
  - id: ERR_APPEAL_PENDING
    http: 409
    condition: "A filing is finalised while a protest against it is APPEALED."
  - id: ERR_DUPLICATE_LINE_MAKE
    http: 409
    condition: "line_make already registered by another Manufacturer."
  - id: ERR_DUPLICATE_ROOM_CODE
    http: 409
    condition: "room_code already used by another HearingRoom."
  - id: ERR_OPEN_APPLICATION_EXISTS
    http: 409
    condition: "The dealer already has a live application of the same application_type."
  - id: ERR_OPEN_DISPUTE_EXISTS
    http: 409
    condition: "The dealer/franchisor pair already has a FILED or UNDER_REVIEW dispute."
  - id: ERR_INSUFFICIENT_RO_SAMPLE
    http: 422
    condition: "Fewer than 5 qualifying repair-order lines in the sample."
  - id: ERR_RATE_NOT_ABOVE_POSTED
    http: 422
    condition: "declared_rate_cents does not strictly exceed the franchisor's posted_warranty_labor_rate_cents."
  - id: ERR_LOSS_REQUIRED_FOR_SANCTION
    http: 422
    condition: "A substantiated resolution is attempted on a complaint whose alleged_loss_cents is 0."
  - id: ERR_SANCTION_TYPE_NOT_ALLOWED
    http: 422
    condition: "sanction_type is supplied with substantiated false, or omitted with substantiated true."
  - id: ERR_RESTITUTION_OVERPAYMENT
    http: 422
    condition: "A payment would push restitution_paid_cents above restitution_ordered_cents."
  - id: ERR_NO_PROBATIVE_STUDY
    http: 422
    condition: "A hearing is convened with no probative PROTESTANT MarketStudy on file."
  - id: ERR_GOOD_CAUSE_NOT_ESTABLISHED
    http: 422
    condition: "A protest is sustained although good_cause_score < good_cause_threshold."

roles:
  - name: Dealer
    description: "Licensed or prospective motor vehicle dealer. Acts as applicant, sponsor, protestant, rate-dispute claimant and restitution payer."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /dealer-board/license-applications/{id}/submit"
      - "POST /dealer-board/license-applications/{id}/resubmit"
      - "POST /dealer-board/salespersons"
      - "POST /dealer-board/salespersons/{id}/renewal"
      - "POST /dealer-board/protests"
      - "POST /dealer-board/warranty-rate-disputes"
      - "POST /dealer-board/consumer-complaints/{id}/restitution-payment"
    shared_operations:
      - "POST /dealer-board/license-applications (with BoardAdmin)"
      - "POST /dealer-board/protests/{id}/market-studies (with Manufacturer)"
      - "POST /dealer-board/protests/{id}/evidence-submissions (with Manufacturer)"
      - "POST /dealer-board/protests/{id}/appeal (with Manufacturer)"
      - "all GET reads of dealers, manufacturers, applications, salespersons, filings, protests, studies, exhibits, disputes and complaints"
  - name: Manufacturer
    description: "Franchisor / distributor of a line make. Files franchise notices, answers rate disputes and defends protests."
    identity: "entity_backed:Manufacturer"
    exclusive_operations:
      - "POST /dealer-board/franchise-filings"
      - "POST /dealer-board/franchise-filings/{id}/serve-notice"
      - "POST /dealer-board/franchise-filings/{id}/amend"
      - "POST /dealer-board/warranty-rate-disputes/{id}/response"
    shared_operations:
      - "POST /dealer-board/protests/{id}/market-studies (with Dealer)"
      - "POST /dealer-board/protests/{id}/evidence-submissions (with Dealer)"
      - "POST /dealer-board/protests/{id}/appeal (with Dealer)"
      - "all GET reads listed for Dealer"
  - name: LicensingAnalyst
    description: "Board licensing staff. Reviews dealer applications and decides salesperson licences, but never decides a dealer application (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /dealer-board/license-applications/{id}/deficiency-notice"
      - "POST /dealer-board/salespersons/{id}/license-decision"
    shared_operations:
      - "GET reads of applications, salespersons, filings, protests, disputes and complaints"
  - name: HearingClerk
    description: "Board hearing clerk. Owns the hearing docket: scheduling into rooms and convening hearings. Never decides a protest."
    identity: opaque
    exclusive_operations:
      - "POST /dealer-board/protests/{id}/schedule"
      - "POST /dealer-board/protests/{id}/convene"
    shared_operations:
      - "GET reads of hearing rooms, filings, protests, studies and exhibits"
  - name: ComplaintInvestigator
    description: "Board enforcement investigator. Intakes and investigates consumer complaints; may never resolve one (the resolving X-User-ID must differ from investigator_user_id)."
    identity: opaque
    exclusive_operations:
      - "POST /dealer-board/consumer-complaints"
      - "POST /dealer-board/consumer-complaints/{id}/investigation"
    shared_operations:
      - "GET reads of dealers, salespersons and complaints"
  - name: BoardAdmin
    description: "Board administrator / adjudicator. Creates reference data, decides dealer applications, protests, rate disputes and complaint resolutions, finalises filings and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /dealer-board/_clock/set_current_utc"
      - "POST /dealer-board/manufacturers"
      - "POST /dealer-board/hearing-rooms"
      - "POST /dealer-board/dealers"
      - "POST /dealer-board/license-applications/{id}/decision"
      - "POST /dealer-board/franchise-filings/{id}/finalize"
      - "POST /dealer-board/protests/{id}/decision"
      - "POST /dealer-board/warranty-rate-disputes/{id}/decision"
      - "POST /dealer-board/consumer-complaints/{id}/resolution"
    shared_operations:
      - "POST /dealer-board/license-applications (with Dealer)"
      - "all GET reads"
