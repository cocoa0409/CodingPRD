# =============================================================================
# Task 1357 — Legal Matter Budgeting & Alternative Fee Arrangements
# =============================================================================

scenario: |
  Legal Matter Budgeting & Alternative Fee Arrangements (law firm pricing office):
  matter phase/task code budget by litigation stage, fee arrangement modeling
  (flat/capped/success/collar), actual-vs-budget variance alerting & revised
  forecast, write-down/write-off approval authority, realization & profitability
  by matter, client accrual reporting requirements, scope change & budget
  amendment approval, year-end true-up on collar arrangements

domain_name: legal-matter-budgeting-afa
api_prefix: /firms

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint

  entity_topology: hierarchical         # Firm → Client → Matter → children; some cross-cutting FKs (Amendment→PhaseBudget)
  state_machine_shape: branching        # branching approve/reject + cyclic revision loops + compound matter status
  relationship_patterns:
    - one_to_many
    - cross_aggregate                   # BudgetAmendment references PhaseBudget across Matter boundary; CollarTrueUp references Matter + FiscalYear
    - self_referential                  # BudgetAmendment.supersedes_amendment_id (revision chain)

  role_model: segregation_of_duties     # PricingAnalyst drafts; BillingPartner approves own authority; ManagingPartner above threshold; same user cannot draft AND approve
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Firm
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Firm display name" }
      - { name: fiscal_year_start_month, type: integer, source: input, description: "1-12; month the fiscal year begins; drives accrual periods and year-end collar true-up" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Monotonic fiscal-period counter, incremented by POST /firms/{firmId}/advance_period" }
      - { name: closed_through_period_index, type: integer, source: system, default: -1, description: "Most recently closed period; -1 means none closed. Matters with any activity in closed periods cannot be retroactively amended into those periods." }

  - name: Client
    parent: Firm
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: display_name, type: string, source: input, description: "Client display name" }
      - { name: client_number, type: string, source: input, description: "Unique client number per firm" }
      - { name: accrual_reporting_required, type: boolean, source: input, default: false, description: "Whether client mandates periodic accrual reports" }
      - { name: accrual_reporting_cadence_periods, type: integer, source: input, default: 1, description: "Every N fiscal periods an accrual report must be SUBMITTED; 1 = monthly" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: Matter
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id (denormalized for path scoping)" }
      - { name: matter_number, type: string, source: input, description: "Unique matter number per client" }
      - { name: title, type: string, source: input, description: "Matter title" }
      - { name: litigation_stage, type: enum, source: input, description: "INTAKE | PLEADINGS | DISCOVERY | PRETRIAL | TRIAL | APPEAL; phase budgets keyed by stage" }
      - { name: responsible_partner_id, type: string, source: input, description: "FK -> Timekeeper.id; partner accountable for budget and write-downs" }
      - { name: status, type: enum, source: system, description: "OPEN | ACTIVE | SUSPENDED | CLOSED | REOPENED" }
      - { name: fee_arrangement_id, type: string, source: system, description: "FK -> FeeArrangement.id; populated once an arrangement is ACTIVATED" }
      # Derived aggregates (recomputed on time-entry / write-down / amendment events)
      - { name: budget_total_cents, type: integer, source: computed, description: "Sum over PhaseBudget.current_budget_cents for this matter's phases in any non-voided state" }
      - { name: actual_fees_cents, type: integer, source: computed, description: "Sum over TimeEntry.billable_amount_cents for entries in APPROVED or BILLED state" }
      - { name: write_down_total_cents, type: integer, source: computed, description: "Sum over WriteDownRequest.approved_amount_cents in state APPLIED" }
      - { name: variance_cents, type: integer, source: computed, description: "actual_fees_cents - budget_total_cents; signed" }
      - { name: variance_pct_bp, type: integer, source: computed, description: "basis points: round(10000 * variance_cents / budget_total_cents) when budget_total_cents > 0; null when budget_total_cents == 0" }
      - { name: variance_alert_level, type: enum, source: computed, description: "NONE | WATCH | WARNING | BREACH; driven by variance_pct_bp thresholds" }
      - { name: revised_forecast_cents, type: integer, source: computed, description: "Estimate-at-complete per calculation revised_forecast" }
      - { name: realization_rate_bp, type: integer, source: computed, description: "Current realization in basis points; variant selection per calculation realization_rate" }
      - { name: last_activity_period_index, type: integer, source: system, description: "Period of most recent time entry / write-down / amendment; used for closed-period guard" }

  - name: FeeArrangement
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: arrangement_type, type: enum, source: input, description: "FLAT_FEE | CAPPED_FEE | SUCCESS_FEE | COLLAR" }
      - { name: flat_fee_cents, type: integer, source: input, description: "Required iff arrangement_type == FLAT_FEE; null otherwise" }
      - { name: capped_fee_cents, type: integer, source: input, description: "Required iff arrangement_type == CAPPED_FEE; ceiling on billable fees" }
      - { name: success_fee_uplift_pct_bp, type: integer, source: input, description: "Required iff arrangement_type == SUCCESS_FEE; uplift in basis points applied on SUCCESS outcome" }
      - { name: collar_lower_bound_cents, type: integer, source: input, description: "Required iff arrangement_type == COLLAR; firm absorbs downside below this bound" }
      - { name: collar_upper_bound_cents, type: integer, source: input, description: "Required iff arrangement_type == COLLAR; firm rebates excess above this bound" }
      - { name: collar_share_pct_bp, type: integer, source: input, description: "Required iff arrangement_type == COLLAR; percentage in bp of out-of-band amount shared with client (rest retained/absorbed by firm)" }
      - { name: fiscal_year_index, type: integer, source: input, description: "Fiscal-year index the arrangement applies to; COLLAR true-up runs at year end" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | ACTIVE | SUPERSEDED | REJECTED" }
      - { name: submitted_period_index, type: integer, source: system, description: "Period when arrangement moved to PENDING_APPROVAL" }
      - { name: activated_period_index, type: integer, source: system, description: "Period when arrangement moved to ACTIVE; null until activated" }
      - { name: supersedes_arrangement_id, type: string, source: input, description: "FK -> FeeArrangement.id; optional self-reference for AFA re-papering; at most one ACTIVE per matter" }

  - name: PhaseBudget
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: litigation_stage, type: enum, source: input, description: "INTAKE | PLEADINGS | DISCOVERY | PRETRIAL | TRIAL | APPEAL" }
      - { name: task_code, type: string, source: input, description: "UTBMS-style task code, e.g. L110, L210" }
      - { name: original_budget_cents, type: integer, source: input, description: "Baseline budget as first created" }
      - { name: current_budget_cents, type: integer, source: computed, description: "original_budget_cents + sum(approved BudgetAmendment.delta_cents)" }
      - { name: actual_to_date_cents, type: integer, source: computed, description: "Sum over TimeEntry.billable_amount_cents where task_code matches and entry in APPROVED/BILLED" }
      - { name: etc_cents, type: integer, source: input, default: 0, description: "Estimate-to-complete; revised forecast input" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | AMENDED | VOIDED" }
      - { name: version_in_force, type: integer, source: system, default: 1, description: "Budget revision counter; bumped on every APPROVED amendment" }

  - name: TimeEntry
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: timekeeper_id, type: string, source: input, description: "FK -> Timekeeper.id" }
      - { name: task_code, type: string, source: input, description: "Task code; must match an ACTIVE PhaseBudget on the matter" }
      - { name: litigation_stage, type: enum, source: input, description: "Stage the work belongs to" }
      - { name: hours_worked_milli, type: integer, source: input, description: "Hours * 1000 (milli-hours); e.g. 1500 = 1.5h" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Billing rate per hour, cents" }
      - { name: billable_amount_cents, type: integer, source: computed, description: "floor(hours_worked_milli * hourly_rate_cents / 1000) per entry; line-level rounding pinned here" }
      - { name: entry_date, type: string, source: input, description: "ISO-8601 date of work" }
      - { name: period_index, type: integer, source: computed, description: "Fiscal period containing entry_date, derived from Firm.fiscal_year_start_month" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | BILLED | WRITTEN_DOWN | REJECTED" }

  - name: Timekeeper
    parent: Firm
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: full_name, type: string, source: input, description: "Display name" }
      - { name: bar_number, type: string, source: input, description: "Unique per firm" }
      - { name: role_title, type: enum, source: input, description: "ASSOCIATE | PARTNER | OF_COUNSEL | PARALEGAL" }
      - { name: standard_rate_cents, type: integer, source: input, description: "Default billing rate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: WriteDownRequest
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: time_entry_ids, type: array, source: input, description: "TimeEntry ids to write down (all must be APPROVED or BILLED)" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Total write-down across the listed entries" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Set on APPROVED; equals requested_amount_cents (no partial approval in v1)" }
      - { name: reason_code, type: enum, source: input, description: "CLIENT_RELATIONS | BILLING_ERROR | SCOPE_DISPUTE | COLLECTIBILITY | COURT_ORDER" }
      - { name: requested_by_user_id, type: string, source: system, description: "User id captured from X-User-ID at creation; used for segregation-of-duties" }
      - { name: decided_by_user_id, type: string, source: system, description: "User id captured at decision" }
      - { name: decided_period_index, type: integer, source: system, description: "Period when decision recorded" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_PARTNER | PENDING_MANAGING_PARTNER | APPROVED | APPLIED | REJECTED | CANCELLED" }

  - name: BudgetAmendment
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: phase_budget_id, type: string, source: input, description: "FK -> PhaseBudget.id (cross-aggregate reference target of the amendment)" }
      - { name: delta_cents, type: integer, source: input, description: "Signed change; negative reduces budget" }
      - { name: scope_change_reason, type: string, source: input, description: "Free-text scope rationale" }
      - { name: supersedes_amendment_id, type: string, source: input, description: "FK -> BudgetAmendment.id; self-referential revision chain. When set, the referenced amendment must be in REJECTED or SUPERSEDED state." }
      - { name: requested_by_user_id, type: string, source: system, description: "Captured from X-User-ID" }
      - { name: decided_by_user_id, type: string, source: system, description: "Captured at decision" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_REVIEW | APPROVED | REJECTED | SUPERSEDED" }

  - name: AccrualReport
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: period_index, type: integer, source: system, description: "Fiscal period this report covers; unique per matter" }
      - { name: accrued_fees_cents, type: integer, source: computed, description: "Sum of billable_amount_cents on APPROVED/BILLED entries whose period_index == this report's period" }
      - { name: unbilled_wip_cents, type: integer, source: computed, description: "Sum of billable_amount_cents on DRAFT/SUBMITTED/APPROVED entries through period end" }
      - { name: forecast_at_complete_cents, type: integer, source: computed, description: "Matter.revised_forecast_cents as of report submission" }
      - { name: variance_at_submission_cents, type: integer, source: computed, description: "Matter.variance_cents as of submission (snapshot)" }
      - { name: submitted_period_index, type: integer, source: system, description: "Period when client-side submission occurred" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | DISPUTED" }

  - name: CollarTrueUp
    parent: Matter
    common_fields: true
    fields:
      - { name: matter_id, type: string, source: system, description: "FK -> Matter.id" }
      - { name: firm_id, type: string, source: system, description: "FK -> Firm.id" }
      - { name: fee_arrangement_id, type: string, source: system, description: "FK -> FeeArrangement.id; the COLLAR arrangement trued up" }
      - { name: fiscal_year_index, type: integer, source: system, description: "Year being trued up; one per arrangement" }
      - { name: actual_year_fees_cents, type: integer, source: computed, description: "Sum of BILLED billable_amount_cents for the matter in fiscal_year_index" }
      - { name: true_up_amount_cents, type: integer, source: computed, description: "Signed: positive = firm owes client rebate; negative = client owes firm" }
      - { name: direction, type: enum, source: computed, description: "REBATE_TO_CLIENT | COLLECT_FROM_CLIENT | IN_BAND" }
      - { name: status, type: enum, source: system, description: "COMPUTED | SETTLED | WAIVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /firms/{firmId}/clients/{clientId}/suspend"
        actor: FirmAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /firms/{firmId}/clients/{clientId}/activate"
        actor: FirmAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /firms/{firmId}/clients/{clientId}/close"
        actor: FirmAdmin
        preconditions:
          - "All Matters in {CLOSED} (ERR_CLIENT_HAS_OPEN_MATTERS)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /firms/{firmId}/clients/{clientId}/close"
        actor: FirmAdmin
        preconditions:
          - "All Matters in {CLOSED} (ERR_CLIENT_HAS_OPEN_MATTERS)"
        side_effects: []

  - entity: Matter
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACTIVE
        trigger: "system (automatic when FeeArrangement on this matter transitions to ACTIVE)"
        actor: system
        preconditions:
          - "FeeArrangement transitions DRAFT → ACTIVE or PENDING_APPROVAL → ACTIVE"
        side_effects:
          - "Matter.fee_arrangement_id := arrangement.id"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /firms/{firmId}/matters/{matterId}/suspend"
        actor: BillingPartner | ManagingPartner
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /firms/{firmId}/matters/{matterId}/resume"
        actor: BillingPartner | ManagingPartner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /firms/{firmId}/matters/{matterId}/close"
        actor: BillingPartner | ManagingPartner
        preconditions:
          - "No TimeEntry in {DRAFT, SUBMITTED, APPROVED} (ERR_MATTER_HAS_OPEN_WIP)"
          - "No WriteDownRequest in {DRAFT, PENDING_PARTNER, PENDING_MANAGING_PARTNER} (ERR_MATTER_HAS_PENDING_WRITE_DOWNS)"
          - "No BudgetAmendment in {DRAFT, PENDING_REVIEW} (ERR_MATTER_HAS_PENDING_AMENDMENTS)"
          - "If arrangement_type == COLLAR and fiscal_year has ended: CollarTrueUp.status ∈ {SETTLED, WAIVED} (ERR_MATTER_COLLAR_UNSETTLED)"
          - "If Client.accrual_reporting_required: latest AccrualReport.status ∈ {SUBMITTED, ACKNOWLEDGED} (ERR_MATTER_ACCRUAL_OUTSTANDING)"
        side_effects:
          - "Matter.status := CLOSED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /firms/{firmId}/matters/{matterId}/close"
        actor: BillingPartner | ManagingPartner
        preconditions: ["same as ACTIVE → CLOSED"]
        side_effects: ["Matter.status := CLOSED"]
      - from: CLOSED
        to: REOPENED
        trigger: "POST /firms/{firmId}/matters/{matterId}/reopen"
        actor: ManagingPartner
        preconditions:
          - "Matter.closed within Firm.closed_through_period_index + 2 periods (ERR_REOPEN_WINDOW_CLOSED)"
        side_effects:
          - "Matter.status := REOPENED; behaves as ACTIVE for billing purposes"
      - from: REOPENED
        to: CLOSED
        trigger: "POST /firms/{firmId}/matters/{matterId}/close"
        actor: BillingPartner | ManagingPartner
        preconditions: ["same as ACTIVE → CLOSED"]
        side_effects: ["Matter.status := CLOSED"]

  - entity: FeeArrangement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /firms/{firmId}/fee_arrangements/{arrangementId}/submit"
        actor: PricingAnalyst
        preconditions:
          - "Type-specific required fields populated (ERR_ARRANGEMENT_FIELDS_INCOMPLETE)"
          - "No other ACTIVE or PENDING_APPROVAL arrangement on the matter (ERR_ARRANGEMENT_ALREADY_ACTIVE)"
        side_effects:
          - "submitted_period_index := firm.current_period_index"
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /firms/{firmId}/fee_arrangements/{arrangementId}/activate"
        actor: BillingPartner | ManagingPartner
        preconditions:
          - "Matter.status ∈ {OPEN, ACTIVE, REOPENED} (ERR_MATTER_NOT_OPEN)"
          - "If supersedes_arrangement_id set: referenced arrangement must be ACTIVE and will be transitioned to SUPERSEDED"
        side_effects:
          - "activated_period_index := firm.current_period_index"
          - "If supersedes_arrangement_id set: prior arrangement → SUPERSEDED"
          - "Matter.fee_arrangement_id := this.id"
          - "Matter.status: OPEN → ACTIVE (if not already ACTIVE/REOPENED)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /firms/{firmId}/fee_arrangements/{arrangementId}/reject"
        actor: BillingPartner | ManagingPartner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (when a successor arrangement referencing this via supersedes_arrangement_id transitions to ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Matter.fee_arrangement_id := successor.id"

  - entity: PhaseBudget
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /firms/{firmId}/phase_budgets/{phaseBudgetId}/activate"
        actor: PricingAnalyst | BillingPartner
        preconditions:
          - "Matter.status ∈ {OPEN, ACTIVE, REOPENED} (ERR_MATTER_NOT_OPEN)"
          - "original_budget_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: ACTIVE
        to: AMENDED
        trigger: "system (when a BudgetAmendment targeting this phase transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "current_budget_cents := current_budget_cents + amendment.delta_cents"
          - "version_in_force += 1"
          - "Matter.budget_total_cents recomputed"
          - "Matter.variance_cents, variance_pct_bp, variance_alert_level recomputed"
      - from: AMENDED
        to: AMENDED
        trigger: "system (subsequent amendments)"
        actor: system
        preconditions: []
        side_effects: ["same as ACTIVE → AMENDED"]
      - from: DRAFT
        to: VOIDED
        trigger: "POST /firms/{firmId}/phase_budgets/{phaseBudgetId}/void"
        actor: PricingAnalyst | BillingPartner
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /firms/{firmId}/phase_budgets/{phaseBudgetId}/void"
        actor: BillingPartner
        preconditions:
          - "actual_to_date_cents == 0 (ERR_PHASE_HAS_ACTUALS)"
          - "No BudgetAmendment in {DRAFT, PENDING_REVIEW} referencing this phase (ERR_PHASE_HAS_PENDING_AMENDMENT)"
        side_effects:
          - "Matter.budget_total_cents recomputed (this phase excluded)"

  - entity: TimeEntry
    initial_state: DRAFT
    terminal_states: [WRITTEN_DOWN, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /firms/{firmId}/time_entries/{entryId}/submit"
        actor: Timekeeper | BillingPartner
        preconditions:
          - "Matter.status ∈ {ACTIVE, REOPENED} (ERR_MATTER_NOT_OPEN)"
          - "Client.status == ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
          - "Task code matches an ACTIVE PhaseBudget (ERR_TASK_CODE_NOT_BUDGETED)"
          - "entry_date's period_index > firm.closed_through_period_index (ERR_PERIOD_CLOSED)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /firms/{firmId}/time_entries/{entryId}/approve"
        actor: BillingPartner
        preconditions: []
        side_effects:
          - "Matter.actual_fees_cents += billable_amount_cents"
          - "Matter.variance_cents / variance_pct_bp / variance_alert_level recomputed"
          - "Matter.last_activity_period_index := firm.current_period_index"
      - from: APPROVED
        to: BILLED
        trigger: "POST /firms/{firmId}/time_entries/{entryId}/mark_billed"
        actor: BillingPartner
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /firms/{firmId}/time_entries/{entryId}/reject"
        actor: BillingPartner
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: WRITTEN_DOWN
        trigger: "system (when a WriteDownRequest listing this entry transitions to APPLIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Matter.actual_fees_cents -= (allocated write-down share for this entry)"
          - "Matter.write_down_total_cents += allocated share"
          - "Recomputed Matter.variance_* and realization_rate_bp"
      - from: BILLED
        to: WRITTEN_DOWN
        trigger: "system (write-down applied against billed entry)"
        actor: system
        preconditions: []
        side_effects: ["same as APPROVED → WRITTEN_DOWN"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /firms/{firmId}/time_entries/{entryId}/reject"
        actor: BillingPartner
        preconditions: []
        side_effects: []

  - entity: WriteDownRequest
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_PARTNER
        trigger: "POST /firms/{firmId}/write_down_requests/{requestId}/submit"
        actor: BillingPartner
        preconditions:
          - "All time_entry_ids exist and belong to this matter (ERR_WRITE_DOWN_ENTRIES_INVALID)"
          - "All entries in {APPROVED, BILLED} (ERR_WRITE_DOWN_ENTRY_STATE)"
          - "requested_amount_cents > 0 and ≤ sum(entries.billable_amount_cents) (ERR_WRITE_DOWN_AMOUNT_INVALID)"
        side_effects: []
      - from: PENDING_PARTNER
        to: APPROVED
        trigger: "POST /firms/{firmId}/write_down_requests/{requestId}/decide"
        actor: BillingPartner
        preconditions:
          - "requested_amount_cents <= PARTNER_WRITE_DOWN_AUTHORITY_CENTS (else auto-routes PENDING_MANAGING_PARTNER)"
          - "decided_by_user_id != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status := APPROVED (next: apply)"
          - "decided_period_index := firm.current_period_index"
      - from: PENDING_PARTNER
        to: PENDING_MANAGING_PARTNER
        trigger: "system (auto-escalation when requested_amount_cents > PARTNER_WRITE_DOWN_AUTHORITY_CENTS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_MANAGING_PARTNER
        to: APPROVED
        trigger: "POST /firms/{firmId}/write_down_requests/{requestId}/decide"
        actor: ManagingPartner
        preconditions:
          - "decided_by_user_id != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status := APPROVED"
          - "decided_period_index := firm.current_period_index"
      - from: PENDING_PARTNER
        to: REJECTED
        trigger: "POST /firms/{firmId}/write_down_requests/{requestId}/decide"
        actor: BillingPartner
        preconditions:
          - "decided_by_user_id != requested_by_user_id"
        side_effects: []
      - from: PENDING_MANAGING_PARTNER
        to: REJECTED
        trigger: "POST /firms/{firmId}/write_down_requests/{requestId}/decide"
        actor: ManagingPartner
        preconditions:
          - "decided_by_user_id != requested_by_user_id"
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "POST /firms/{firmId}/write_down_requests/{requestId}/apply"
        actor: BillingPartner | ManagingPartner
        preconditions:
          - "Matter.status ∈ {ACTIVE, REOPENED} (ERR_MATTER_NOT_OPEN)"
        side_effects:
          - "Allocate approved_amount_cents across listed entries proportionally to billable_amount_cents, floor per entry, distribute remainder by entry.created_at ASC (waterfall)"
          - "Each listed TimeEntry → WRITTEN_DOWN"
          - "Matter.actual_fees_cents, write_down_total_cents, variance_*, realization_rate_bp recomputed"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /firms/{firmId}/write_down_requests/{requestId}/cancel"
        actor: BillingPartner
        preconditions:
          - "requested_by_user_id == acting user (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects: []

  - entity: BudgetAmendment
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /firms/{firmId}/budget_amendments/{amendmentId}/submit"
        actor: PricingAnalyst
        preconditions:
          - "PhaseBudget.status ∈ {ACTIVE, AMENDED} (ERR_PHASE_NOT_AMENDABLE)"
          - "Matter.status ∈ {ACTIVE, REOPENED} (ERR_MATTER_NOT_OPEN)"
          - "If supersedes_amendment_id set: referenced amendment.status ∈ {REJECTED, SUPERSEDED} (ERR_AMENDMENT_SUPERSEDE_INVALID)"
          - "delta_cents != 0 (ERR_INVALID_REQUEST)"
          - "Resulting current_budget_cents would be >= 0 (ERR_AMENDMENT_NEGATIVE_BUDGET)"
          - "Matter.last_activity_period_index > firm.closed_through_period_index (ERR_PERIOD_CLOSED)"
        side_effects: []
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /firms/{firmId}/budget_amendments/{amendmentId}/decide"
        actor: BillingPartner | ManagingPartner
        preconditions:
          - "decided_by_user_id != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If |delta_cents| > PARTNER_AMENDMENT_AUTHORITY_CENTS: actor must be ManagingPartner (ERR_AMENDMENT_AUTHORITY_EXCEEDED)"
        side_effects:
          - "PhaseBudget.current_budget_cents += delta_cents; version_in_force += 1"
          - "PhaseBudget.status := AMENDED (or stays AMENDED)"
          - "If supersedes_amendment_id set: referenced amendment.status := SUPERSEDED"
          - "Matter.budget_total_cents, variance_*, revised_forecast_cents recomputed"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /firms/{firmId}/budget_amendments/{amendmentId}/decide"
        actor: BillingPartner | ManagingPartner
        preconditions:
          - "decided_by_user_id != requested_by_user_id"
        side_effects: []

  - entity: AccrualReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /firms/{firmId}/accrual_reports/{reportId}/submit"
        actor: BillingPartner
        preconditions:
          - "Matter.status ∈ {ACTIVE, REOPENED, SUSPENDED} (ERR_MATTER_NOT_OPEN)"
        side_effects:
          - "Snapshot: forecast_at_complete_cents := matter.revised_forecast_cents; variance_at_submission_cents := matter.variance_cents"
          - "submitted_period_index := firm.current_period_index"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /firms/{firmId}/accrual_reports/{reportId}/acknowledge"
        actor: ClientContact
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /firms/{firmId}/accrual_reports/{reportId}/dispute"
        actor: ClientContact
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /firms/{firmId}/accrual_reports/{reportId}/resubmit"
        actor: BillingPartner
        preconditions: []
        side_effects:
          - "Recompute snapshot fields (forecast_at_complete_cents, variance_at_submission_cents) from current matter state"

  - entity: CollarTrueUp
    initial_state: COMPUTED
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: COMPUTED
        to: SETTLED
        trigger: "POST /firms/{firmId}/collar_true_ups/{trueUpId}/settle"
        actor: BillingPartner | ManagingPartner
        preconditions: []
        side_effects: []
      - from: COMPUTED
        to: WAIVED
        trigger: "POST /firms/{firmId}/collar_true_ups/{trueUpId}/waive"
        actor: ManagingPartner
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: arrangement-activate-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /firms/{firmId}/fee_arrangements/{arrangementId}/activate"
    occ_field: "expected_matter_version"
    description: |
      Activating a FeeArrangement against a Matter whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer activated a competing arrangement (or amended a phase
      budget) between the client's read and this activation.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: amendment-decide-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /firms/{firmId}/budget_amendments/{amendmentId}/decide"
    occ_field: "expected_matter_version"
    description: |
      Deciding (approve/reject) a BudgetAmendment whose parent Matter.version
      has advanced since the decider last read it is rejected. Prevents
      double-approving amendments when two different requests are queued.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: matter_budget_variance
    trigger: "time entry approve, write-down apply, budget amendment approve, phase budget activate/void"
    algorithm: aggregation
    formula: |
      budget_total_cents = sum(PhaseBudget.current_budget_cents
                             where PhaseBudget.status ∈ {ACTIVE, AMENDED}
                             and PhaseBudget.matter_id == matter.id)
      actual_fees_cents  = sum(TimeEntry.billable_amount_cents
                             where TimeEntry.matter_id == matter.id
                             and TimeEntry.status ∈ {APPROVED, BILLED, WRITTEN_DOWN})
      # WRITTEN_DOWN entries contribute their post-write-down remainder, not original amount.
      variance_cents     = actual_fees_cents - budget_total_cents
      if budget_total_cents == 0:
        variance_pct_bp = null
      else:
        variance_pct_bp = round(10000 * variance_cents / budget_total_cents)
      # Alert thresholds (boundary-pinned: >=, not >):
      if variance_pct_bp is null:                variance_alert_level = NONE
      elif variance_pct_bp >= BREACH_THRESHOLD_BP:  variance_alert_level = BREACH
      elif variance_pct_bp >= WARNING_THRESHOLD_BP: variance_alert_level = WARNING
      elif variance_pct_bp >= WATCH_THRESHOLD_BP:   variance_alert_level = WATCH
      else:                                          variance_alert_level = NONE
    constants:
      WATCH_THRESHOLD_BP: 500    # 5% over budget → WATCH
      WARNING_THRESHOLD_BP: 1000 # 10% → WARNING
      BREACH_THRESHOLD_BP: 2000  # 20% → BREACH
    precision: "integer cents; variance_pct_bp rounded to nearest bp (round_half_up)"
    variants:
      - name: gross_variance
        when: "Computed pre-write-down — uses pre-write-down billable amounts (used for early-warning alerting)"
        difference: "WRITTEN_DOWN entries contribute their original billable_amount_cents, not remainder"
      - name: net_variance
        when: "Computed post-write-down (used for reporting, realization)"
        difference: "WRITTEN_DOWN entries contribute remainder after write-down"

  - name: revised_forecast
    trigger: "time entry approve, budget amendment approve, phase budget ETC update (via PATCH /phase_budgets/{id})"
    algorithm: forward_looking
    formula: |
      # EAC = actual-to-date + sum of ETC per phase. Order of evaluation is
      # pinned to avoid the circular-looking dependency: ETC per phase is an
      # INPUT (entered by pricing office), NOT derived from forecast; therefore
      # forecast = actual + Σetc with no recursion.
      revised_forecast_cents = matter.actual_fees_cents
                             + sum(PhaseBudget.etc_cents
                                   where status ∈ {ACTIVE, AMENDED})
      # (Pinned evaluation order: actual first, then ETC. etc_cents MUST NOT
      # itself be recomputed from revised_forecast_cents.)
    constants: {}
    precision: "integer cents"
    variants:
      - name: optimistic
        when: "All DRAFT/SUBMITTED entries assumed rejected; ETC unchanged"
        difference: "actual uses only APPROVED+BILLED+WRITTEN_DOWN (post-writedown remainder)"
      - name: pessimistic
        when: "All DRAFT/SUBMITTED entries assumed approved; ETC unchanged"
        difference: "actual includes DRAFT+SUBMITTED at full billable_amount_cents"

  - name: realization_rate
    trigger: "on demand (GET /firms/{firmId}/matters/{matterId}); recomputed after write-down apply"
    algorithm: aggregation
    formula: |
      # Two variants, both legitimate in legal finance:
      #   billing_realization  = billed / (billed + write_downs_on_billed)
      #   collected_realization = collected / standard_value
      # Scaffold pins: realization_rate_bp uses BILLING variant for matters
      # whose latest write-down is in APPLIED state; COLLECTED variant when
      # no write-downs exist. Selection pinned to avoid ambiguity.
      if matter.write_down_total_cents == 0:
        realization_rate_bp = 10000  # 100% — nothing written down
      else:
        denominator = matter.actual_fees_cents + matter.write_down_total_cents
        realization_rate_bp = round(10000 * matter.actual_fees_cents / denominator)
    precision: "round_half_up to bp"
    variants:
      - name: billing_realization
        when: "Matter has ≥1 APPLIED write-down"
        difference: "Denominator includes write-downs; numerator is post-write-down actual"
      - name: collected_realization
        when: "Matter has zero APPLIED write-downs"
        difference: "Rate is 10000 bp regardless of outstanding accruals"

  - name: collar_true_up_amount
    trigger: "POST /firms/{firmId}/matters/{matterId}/run_year_end_collar_true_up"
    algorithm: threshold
    formula: |
      # Nested min/max with three bands: below-lower, in-band, above-upper.
      # Band-width is measured against actual_year_fees_cents.
      lb = arrangement.collar_lower_bound_cents
      ub = arrangement.collar_upper_bound_cents
      share = arrangement.collar_share_pct_bp / 10000   # fraction in [0, 1]
      if actual_year_fees_cents < lb:
        shortfall = lb - actual_year_fees_cents
        # Client compensates firm for `share` of the shortfall (negative = client owes firm)
        true_up_amount_cents = - round(share * shortfall)
        direction = COLLECT_FROM_CLIENT
      elif actual_year_fees_cents > ub:
        excess = actual_year_fees_cents - ub
        # Firm rebates `share` of the excess to the client (positive = firm owes client)
        true_up_amount_cents = + round(share * excess)
        direction = REBATE_TO_CLIENT
      else:
        true_up_amount_cents = 0
        direction = IN_BAND
      # Boundary rule (pinned): values exactly equal to lb or ub are IN_BAND.
      # The comparisons are strict: `< lb` and `> ub`.
    constants: {}
    precision: "round_half_up to nearest cent"

  - name: phase_level_fee_quote
    trigger: "on demand: GET /firms/{firmId}/matters/{matterId}/quote?arrangement_type=..."
    algorithm: tiered_pricing
    formula: |
      # Combinatorial formula (mode b — nested rounding order pinned):
      # For each phase, apply arrangement-specific cap/floor logic, round per
      # phase to whole cents (round_half_up), THEN sum rounded phases. The
      # alternative order (sum then round) yields different cents; scaffold
      # pins per-phase-rounding as canonical.
      for each PhaseBudget p in matter.phases where status ∈ {ACTIVE, AMENDED}:
        base_p = p.current_budget_cents
        if arrangement_type == FLAT_FEE:
          phase_quote_p = base_p  # not used in total; flat fee replaces
        elif arrangement_type == CAPPED_FEE:
          phase_quote_p = min(base_p, capped_fee_cents)   # per-phase cap
        elif arrangement_type == SUCCESS_FEE:
          phase_quote_p = base_p   # uplift applied at total level
        elif arrangement_type == COLLAR:
          phase_quote_p = base_p   # collar resolved at year-end
        phase_quote_rounded_p = round_half_up(phase_quote_p)
      if arrangement_type == FLAT_FEE:
        total_quote_cents = flat_fee_cents   # flat replaces sum
      elif arrangement_type == SUCCESS_FEE:
        total_quote_cents = sum(phase_quote_rounded_p) * (1 + success_fee_uplift_pct_bp/10000)
        total_quote_cents = round_half_up(total_quote_cents)
      else:
        total_quote_cents = sum(phase_quote_rounded_p)
    constants: {}
    precision: "round_half_up; per-phase first, then sum"

  - name: accrual_report_amounts
    trigger: "system on advance_period and on report submission"
    algorithm: aggregation
    formula: |
      # Input set pinned: only TimeEntries with period_index == report.period_index
      # contribute to accrued_fees_cents. Boundary is inclusive on both ends of
      # the period. Tie-break for period attribution: entry_date's period.
      accrued_fees_cents = sum(TimeEntry.billable_amount_cents
                             where period_index == report.period_index
                             and status ∈ {APPROVED, BILLED})
      unbilled_wip_cents = sum(TimeEntry.billable_amount_cents
                             where period_index <= report.period_index
                             and status ∈ {DRAFT, SUBMITTED, APPROVED})
      # Entries in WRITTEN_DOWN are excluded from both (already realized net).
    constants: {}
    precision: "integer cents"

  - name: write_down_allocation
    trigger: "WriteDownRequest → APPLIED"
    algorithm: waterfall_allocation
    formula: |
      # Allocate approved_amount_cents across the listed TimeEntries
      # proportionally to each entry's billable_amount_cents.
      # Rounding: floor each entry's share; then distribute the leftover cents
      # one at a time to entries in created_at ASC order until exhausted.
      total = sum(entry.billable_amount_cents for entry in entries)
      for entry in entries:
        raw_share = approved_amount_cents * entry.billable_amount_cents / total
        entry.allocated_cents = floor(raw_share)
      leftover = approved_amount_cents - sum(entry.allocated_cents)
      # leftover is in [0, len(entries)-1]; distribute one cent at a time
      for entry in sort(entries, key=created_at ASC):
        if leftover == 0: break
        entry.allocated_cents += 1
        leftover -= 1
    constants: {}
    precision: "floor per line; leftover by created_at ASC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource ids in path exist and belong to the Firm scope; FK references in body exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource state permits the transition (state machine precondition)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 5
    category: state
    check: "Matter must be in OPEN/ACTIVE/REOPENED for time entry submission, arrangement activation, amendment submission, write-down apply"
    error_id: ERR_MATTER_NOT_OPEN
    http_status: 409
    applies_to: "POST .../time_entries/{id}/submit; POST .../fee_arrangements/{id}/activate; POST .../budget_amendments/{id}/submit; POST .../write_down_requests/{id}/apply"

  - priority: 6
    category: state
    check: "Client must be ACTIVE (not SUSPENDED or CLOSED) for new time entries"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST .../time_entries/{id}/submit"

  - priority: 7
    category: business_temporal
    check: "Entry date's fiscal period must be after Firm.closed_through_period_index"
    error_id: ERR_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST .../time_entries/{id}/submit; POST .../budget_amendments/{id}/submit"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: decided_by_user_id != requested_by_user_id on approvals"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST .../write_down_requests/{id}/decide; POST .../budget_amendments/{id}/decide"

  - priority: 9
    category: business_constraint
    check: "Arrangement-type-specific required fields populated"
    error_id: ERR_ARRANGEMENT_FIELDS_INCOMPLETE
    http_status: 422
    applies_to: "POST .../fee_arrangements/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "At most one ACTIVE or PENDING_APPROVAL arrangement per matter"
    error_id: ERR_ARRANGEMENT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST .../fee_arrangements; POST .../fee_arrangements/{id}/submit"

  - priority: 11
    category: business_referential
    check: "Time entry task_code must match an ACTIVE PhaseBudget for the matter"
    error_id: ERR_TASK_CODE_NOT_BUDGETED
    http_status: 409
    applies_to: "POST .../time_entries/{id}/submit"

  - priority: 12
    category: business_referential
    check: "Write-down request time_entry_ids all belong to matter and are in APPROVED/BILLED"
    error_id: ERR_WRITE_DOWN_ENTRIES_INVALID
    http_status: 422
    applies_to: "POST .../write_down_requests; POST .../write_down_requests/{id}/submit"

  - priority: 13
    category: business_fiscal
    check: "Requested write-down amount > 0 and ≤ sum(entries.billable_amount_cents)"
    error_id: ERR_WRITE_DOWN_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST .../write_down_requests; POST .../write_down_requests/{id}/submit"

  - priority: 14
    category: business_fiscal
    check: "Amendment delta would not push PhaseBudget.current_budget_cents below 0"
    error_id: ERR_AMENDMENT_NEGATIVE_BUDGET
    http_status: 422
    applies_to: "POST .../budget_amendments"

  - priority: 15
    category: business_fiscal
    check: "Amendment magnitude within approver authority (BillingPartner ≤ PARTNER_AMENDMENT_AUTHORITY_CENTS; above requires ManagingPartner)"
    error_id: ERR_AMENDMENT_AUTHORITY_EXCEEDED
    http_status: 403
    applies_to: "POST .../budget_amendments/{id}/decide"

  - priority: 16
    category: business_referential
    check: "If supersedes_amendment_id set, referenced amendment must be in REJECTED or SUPERSEDED"
    error_id: ERR_AMENDMENT_SUPERSEDE_INVALID
    http_status: 409
    applies_to: "POST .../budget_amendments"

  - priority: 17
    category: business_fiscal
    check: "Matter close preconditions (no open WIP, no pending write-downs/amendments, collar settled if applicable, accrual submitted if required)"
    error_id: "ERR_MATTER_HAS_OPEN_WIP | ERR_MATTER_HAS_PENDING_WRITE_DOWNS | ERR_MATTER_HAS_PENDING_AMENDMENTS | ERR_MATTER_COLLAR_UNSETTLED | ERR_MATTER_ACCRUAL_OUTSTANDING"
    http_status: 409
    applies_to: "POST .../matters/{id}/close"

  - priority: 18
    category: business_referential
    check: "Client close: all matters CLOSED"
    error_id: ERR_CLIENT_HAS_OPEN_MATTERS
    http_status: 409
    applies_to: "POST .../clients/{id}/close"

  - priority: 19
    category: business_temporal
    check: "Matter reopen: must be within reopen window (closed_through_period_index + 2 periods)"
    error_id: ERR_REOPEN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST .../matters/{id}/reopen"

  - priority: 20
    category: business_referential
    check: "Phase void: no actuals, no pending amendments"
    error_id: "ERR_PHASE_HAS_ACTUALS | ERR_PHASE_HAS_PENDING_AMENDMENT"
    http_status: 409
    applies_to: "POST .../phase_budgets/{id}/void"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Firm ---
  - method: POST
    path: "/firms"
    description: "Create a Firm (tenant root)"
    roles: [FirmAdmin]
    code: 201
    input: [name, fiscal_year_start_month]
    output: Firm
    side_effects: ["current_period_index=0, closed_through_period_index=-1"]

  - method: GET
    path: "/firms/{firmId}"
    description: "Get Firm"
    roles: [FirmAdmin, PricingAnalyst, BillingPartner, ManagingPartner, Timekeeper, ClientContact]
    code: 200
    input: []
    output: Firm
    side_effects: []

  - method: POST
    path: "/firms/{firmId}/advance_period"
    description: "Advance fiscal period; triggers auto-transitions, snapshot updates, collar true-up scheduling"
    roles: [FirmAdmin]
    code: 200
    input: []
    output: Firm
    side_effects:
      - "current_period_index += 1"
      - "AccrualReport regeneration for matters with accrual_reporting_required client (DRAFT for new period)"
      - "If fiscal year just ended: mark COLLAR arrangements eligible for true-up"

  - method: POST
    path: "/firms/{firmId}/close_books"
    description: "Close books through current period"
    roles: [FirmAdmin, ManagingPartner]
    code: 200
    input: []
    output: Firm
    side_effects:
      - "closed_through_period_index := current_period_index - 1"
      - "ERR_INVALID_STATE_TRANSITION if closed_through_period_index == current_period_index - 1 already"

  # --- Timekeeper ---
  - method: POST
    path: "/firms/{firmId}/timekeepers"
