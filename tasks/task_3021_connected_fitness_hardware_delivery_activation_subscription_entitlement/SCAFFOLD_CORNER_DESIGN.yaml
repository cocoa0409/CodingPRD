        grounds:
          - endpoints.GET_/fitness/service-orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "A two-order fixture distinguishes the device filter from the part filter: both orders belong to one device but only one has a reserved part, so the part_id filter narrows the set while the device filter restores it."
        test_recipe:
