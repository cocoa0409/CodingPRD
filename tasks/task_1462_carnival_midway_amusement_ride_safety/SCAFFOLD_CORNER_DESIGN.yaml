          trigger:
            - { call: "POST /midway/operator-certifications/${cert_id}/revoke", payload: {}, as: StateInspector, as_user_id: "${insp1_id}" }
            - { call: "POST /midway/daily-checklists", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}", items_total: 5 }, as: RideOperator, as_user_id: "${op_id}", captures: { err_cert: "$.data.error_id" } }
            - { call: "POST /midway/operator-certifications/${cert_id}/revoke", payload: {}, as: StateInspector, as_user_id: "${insp1_id}", captures: { err_twice: "$.data.error_id" } }
          assert:
            - "after revoke: OperatorCertification.${cert_id}.status == REVOKED"
            - "checklist create by that operator -> err_cert == ERR_CERTIFICATION_MISSING with http 422"
            - "second revoke -> err_twice == ERR_CERT_INVALID_STATE with http 409"

  # =================================================================
  # Section: calculations (boarding skip path)
  # =================================================================
  - section: calculations
    instances:
      - name: load_time_insufficient_credit_skip_and_void
        claim_type: correct_result
        grounds:
          - 'calculations.queue_boarding'
          - 'entities.RideRedemption.fields.status'
        distinguishing_aspect: "Two QUEUED redemptions can share a wristband with exactly 1 credit because credits are checked but not debited at queue time; at load, the first boards (credits 1 -> 0) and the second is VOIDED in place without consuming a seat — rider_count counts only true boardings."
        test_recipe:
          setup: ["Permitted fair; ride capacity 4 OPEN on day 2026-08-03; one 1-credit sale; two QUEUED redemptions (positions 1 and 2)"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway CC6", operator_company_name: "ShowCo", location: "Lot 70", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup CC6", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Op CC6", functions: ["OPERATOR"] }, as: FairManager, as_user_id: "${sup_id}", captures: { op_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Clerk CC6", functions: ["CLERK"] }, as: FairManager, as_user_id: "${sup_id}", captures: { clerk_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew CC6", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp CC6a", license_number: "LIC-CC6-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp CC6b", license_number: "LIC-CC6-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-CC6-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspection-appointments/${appt_id}/complete", payload: { outcome: "PASS" }, as: StateInspector, as_user_id: "${appt_insp}" }
            - { call: "GET /midway/fairs/${fair_id}", as: FairManager, as_user_id: "${sup_id}", captures: { fair_v: "$.data.version" } }
            - { call: "POST /midway/permits/${permit_id}/approve", payload: { expected_fair_version: "${fair_v}" }, as: StateInspector, as_user_id: "${insp2_id}" }
            - { call: "POST /midway/operator-certifications", payload: { staff_id: "${op_id}", ride_class: "THRILL", issued_on: "2026-08-01", expires_on: "2026-12-31" }, as: StateProgramAdmin }
            - { call: "POST /midway/operating-days", payload: { fair_id: "${fair_id}", date: "2026-08-03", max_attendance: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { day_id: "$.data.id" } }
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/operating-days/${day_id}/begin-checklists", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/daily-checklists", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}", items_total: 3 }, as: RideOperator, as_user_id: "${op_id}", captures: { chk_id: "$.data.id" } }
            - { call: "POST /midway/daily-checklists/${chk_id}/submit", payload: { items_passed: 3 }, as: RideOperator, as_user_id: "${op_id}", captures: { chk_v: "$.data.version" } }
            - { call: "POST /midway/daily-checklists/${chk_id}/countersign", payload: { expected_checklist_version: "${chk_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/operating-days/${day_id}/open-gates", payload: {}, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/ticket-products", payload: { fair_id: "${fair_id}", name: "Credits", kind: "CREDIT_BUNDLE", base_price_cents: 100 }, as: FairManager, as_user_id: "${sup_id}", captures: { prod_id: "$.data.id" } }
            - { call: "POST /midway/ticket-sales", payload: { product_id: "${prod_id}", operating_day_id: "${day_id}", quantity: 1, holder_height_in: 60 }, as: TicketClerk, as_user_id: "${clerk_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { r1: "$.data.id" } }
            - { call: "POST /midway/ride-redemptions", payload: { wristband_id: "${sale_id}", ride_id: "${ride_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { r2: "$.data.id" } }
            - { call: "POST /midway/ride-cycles", payload: { ride_id: "${ride_id}", operating_day_id: "${day_id}" }, as: RideOperator, as_user_id: "${op_id}", captures: { cyc: "$.data.id" } }
          trigger:
            - { call: "POST /midway/ride-cycles/${cyc}/load", payload: {}, as: RideOperator, as_user_id: "${op_id}", captures: { rc: "$.data.rider_count" } }
          assert:
            - "RideRedemption.${r1}.status == REDEEMED with ride_cycle_id == ${cyc}"
            - "RideRedemption.${r2}.status == VOIDED (skipped — credits hit 0 at boarding time) with ride_cycle_id == null"
            - "RideCycle.${cyc}.rider_count == 1 (the voided skip consumes no seat)"
            - "TicketSale.${sale_id}.credits_redeemed == 1 and credits_remaining == 0"

  # =================================================================
  # Section: consistency_model
  # =================================================================
  - section: consistency_model
    instances:
      - name: mutation_visible_immediately_in_response_and_version_increments
        claim_type: immediate
        grounds:
          - 'complexity_profile.consistency_model'
          - 'entities.Ride'
        distinguishing_aspect: "Immediate consistency: the verify-assembly RESPONSE already shows setup_status == SETUP_VERIFIED with version incremented from 1 to 2, and a subsequent GET returns identical values (no read-repair or lag)."
        test_recipe:
          setup: ["Fair in SETUP; crew with covering SETUP shift; ride INSTALLED"]
          setup_api_calls:
            - { call: "POST /midway/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StateProgramAdmin }
            - { call: "POST /midway/fairs", payload: { name: "Midway CM1", operator_company_name: "ShowCo", location: "Lot 71", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Sup CM1", functions: ["SUPERVISOR"] }, as: StateProgramAdmin, captures: { sup_id: "$.data.id" } }
            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew CM1", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-CM1-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}", captures: { st: "$.data.setup_status", ver: "$.data.version" } }
            - { call: "GET /midway/rides/${ride_id}", as: FairManager, as_user_id: "${sup_id}", captures: { st2: "$.data.setup_status", ver2: "$.data.version" } }
          assert:
            - "verify-assembly response: setup_status == SETUP_VERIFIED and version == 2"
            - "GET immediately after: identical setup_status == SETUP_VERIFIED and version == 2"

  # =================================================================
  # Section: state_machines (stubs already covered by difficulty design)
  # =================================================================
  - section: state_machines
    instances:
      - name: queue_fifo_ordering_corner
        claim_type: side_effect_execution
        grounds:
          - 'calculations.queue_boarding'
          - 'entities.RideRedemption.fields.queue_position'
        excluded_because:
          difficulty_instance: rider_count_matches_redeemed_boardings_under_capacity
          rationale: "That instance boards positions 1 and 2 ahead of position 3 under a capacity-2 cap and asserts each redemption's resulting status — the FIFO ordering claim is exercised there verbatim."

      - name: day_resume_wind_boundary_corner
        claim_type: precondition_enforcement
        grounds:
          - 'state_machines.OperatingDay.WEATHER_HOLD_to_OPEN'
          - 'errors[ERR_WIND_ABOVE_LIMIT]'
        excluded_because:
          difficulty_instance: ride_daily_status_cycles_through_weather_holds
          rationale: "That instance asserts resume-day fails at latest wind 45 (ERR_WIND_ABOVE_LIMIT) and succeeds at exactly 39 — the day-level resume boundary is covered there."
