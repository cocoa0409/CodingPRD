            - call: "POST /nonprofits/correction-requests/${cr_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PlatformVerifier
              as_user_id: "${o_id}"
              captures: { err_accept_sod: "$.data.error_id" }
          assert:
            - "the first trigger returns 403 and err_claim_sod == ERR_SEGREGATION_OF_DUTIES"
            - "the second trigger returns 403 and err_accept_sod == ERR_SEGREGATION_OF_DUTIES"
            - "CorrectionRequest.${cr_id}.status is still SUBMITTED and decided_by_user_id is null"
            - "ExtractedField.${ef_id}.normalized_value_cents == 100000"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_organization_version_on_filings_create_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[filing-create-stale-organization]
          - errors[ERR_STALE_ORGANIZATION_VERSION]
          - endpoints.POST_/nonprofits/filings
        distinguishing_aspect: "Two strictly sequential writes: the PATCH advances Organization.version to 2, so the filing create still carrying the version-1 handle is refused 412 ERR_STALE_ORGANIZATION_VERSION and no filing row is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT organization whose version was observed as 1, then patched to version 2."
          setup_api_calls:
            - *c_clock
            - *c_org
            - call: "PATCH /nonprofits/organizations/${o_id}"
              payload: { expected_organization_version: "${o_v0}", display_name: "Willow Creek" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { o_v1: "$.data.version" }
          trigger:
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v0}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_stale: "$.data.error_id" }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v1}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f_ok: "$.data.id" }
          assert:
            - "the first trigger returns 412 and err_stale == ERR_STALE_ORGANIZATION_VERSION"
            - "the second trigger returns 201 and Filing.${f_ok}.status == RECEIVED — the fresh version handle succeeds"
            - "GET /nonprofits/organizations/${o_id}/filings returns exactly 1 row, so the stale attempt persisted nothing"

      - name: stale_extracted_field_version_on_correction_create_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[correction-create-stale-extracted-field]
          - errors[ERR_STALE_EXTRACTED_FIELD_VERSION]
          - endpoints.POST_/nonprofits/extracted-fields/{id}/correction-requests
        distinguishing_aspect: "Filing the first correction request advances ExtractedField.version, so a second request still carrying the pre-write version handle is refused 412 rather than silently disputing a value that already moved."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with a NORMALIZED filing; the field's version was observed as 1 and one correction request has since been filed against it, advancing the field to version 2."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - *c_extract
            - *c_normalize
            - call: "GET /nonprofits/filings/${f_id}/extracted-fields"
              payload: {}
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { ef_id: "$.data[0].id", ef_v_stale: "$.data[0].version" }
            - call: "POST /nonprofits/extracted-fields/${ef_id}/correction-requests"
              payload: { requested_value: "2000.00", evidence_url: "https://evidence.example.org/willow-2025.pdf", justification: "Audited statement shows 2000.00.", expected_extracted_field_version: "${ef_v_stale}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { cr_first: "$.data.id" }
          trigger:
            - call: "POST /nonprofits/extracted-fields/${ef_id}/correction-requests"
              payload: { requested_value: "2500.00", evidence_url: "https://evidence.example.org/willow-2025-b.pdf", justification: "Revised audited statement shows 2500.00.", expected_extracted_field_version: "${ef_v_stale}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { err_stale_field: "$.data.error_id" }
          assert:
            - "the trigger returns 412 and err_stale_field == ERR_STALE_EXTRACTED_FIELD_VERSION"
            - "GET /nonprofits/extracted-fields/${ef_id}/correction-requests returns exactly 1 row"
            - "ExtractedField.${ef_id}.version == ${ef_v_stale} + 1"

      - name: child_row_creation_does_not_advance_the_parent_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[filing-create-stale-organization]
          - entities.Organization.fields.version
          - endpoints.POST_/nonprofits/organizations/{id}/programs
        distinguishing_aspect: "Only writes that §1.2 or §1.5 explicitly names advance Organization.version: creating a program and three leadership rows leaves the version at 1, so a filing create still carrying the original handle succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DRAFT organization created at version 1, with one program and three leadership rows added afterwards."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { o_v_check: "$.data.version" }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v0}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f_after_children: "$.data.id" }
          assert:
            - "o_v_check == 1 — four child rows were created and the parent version never moved"
            - "the filing create returns 201 and Filing.${f_after_children}.status == RECEIVED"
            - "GET /nonprofits/organizations/${o_id} now reports version 2"

      - name: organization_version_advances_once_per_declared_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.Organization.fields.version
          - endpoints.PATCH_/nonprofits/organizations/{id}
          - endpoints.POST_/nonprofits/filings
          - endpoints.POST_/nonprofits/filings/{id}/normalize
        distinguishing_aspect: "Three declared writes advance the version by exactly one each: create 1, PATCH 2, filing create 3, normalize 4 — no more and no fewer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One organization, one program, three leadership rows and one verified ACTIVE status."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - *c_extract
            - *c_normalize
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { o_v_final: "$.data.version" }
          assert:
            - "o_v_final == 4 — version 1 at creation, 2 after verify, 3 after the filing create, 4 after normalize"
            - "the three leadership rows and the program contributed no version increments"
            - "Filing.${f_id}.status == NORMALIZED and Organization.${o_id}.total_revenue_cents == 100000"

      - name: filing_list_filters_by_status_and_tax_year_and_paginates
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/nonprofits/organizations/{id}/filings
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three filings for one organization: status and tax_year filters compose with limit/offset, and a VOIDED filing stays visible in the unfiltered list."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE organization with a 2023 FORM_990 filing, a 2024 FORM_990 filing and a 2025 FORM_990 filing, the 2023 one voided."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - *c_extract
            - *c_normalize
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { o_v2: "$.data.version" }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2024, coverage_start: "2024-01-01T00:00:00Z", coverage_end: "2024-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v2}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f_2024: "$.data.id" }
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { o_v3: "$.data.version" }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${o_id}", form_type: "FORM_990", form_version_year: 2023, tax_year: 2023, coverage_start: "2023-01-01T00:00:00Z", coverage_end: "2023-12-31T00:00:00Z", source: "IRS_BULK_XML", expected_organization_version: "${o_v3}" }
              as: OrganizationUser
              as_user_id: "${o_id}"
              captures: { f_2023: "$.data.id" }
            - call: "POST /nonprofits/filings/${f_2023}/void"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "GET /nonprofits/organizations/${o_id}/filings"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "the unfiltered page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /nonprofits/organizations/${o_id}/filings?limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /nonprofits/organizations/${o_id}/filings?status=VOIDED returns exactly 1 row — voided filings stay visible"
            - "GET /nonprofits/organizations/${o_id}/filings?tax_year=2024 returns exactly 1 row"
            - "GET /nonprofits/organizations/${o_id}/filings?status=NORMALIZED returns exactly 1 row"

      - name: one_clock_advance_expires_a_license_and_lapses_a_seal_together
        claim_type: scheduled_actions
        grounds:
          - state_machines.DataLicense.ACTIVE_to_EXPIRED
          - state_machines.TransparencySeal.ACTIVE_to_LAPSED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "A single logical-clock advance is the only trigger for two independent deferred actions: the license reaches term_end and expires, and the seal passes expires_on plus the 90-day grace and lapses."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization holding an ACTIVE RESEARCHER license for [2026-09-01, 2027-09-01) and an ACTIVE seal expiring 2027-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/organizations/${o_id}/seals"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { seal_id: "$.data.id" }
            - call: "POST /nonprofits/organizations/${o_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z", projected_annual_records: 12000 }
              as: DataConsumer
              as_user_id: "${o_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /nonprofits/licenses/${lic_id}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-12-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-root"
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "DataLicense.${lic_id}.status == EXPIRED"
            - "TransparencySeal.${seal_id}.status == LAPSED and renewal_attempt_count == 0 — the lapse is a system transition, not a failed renewal"
            - "Organization.${o_id}.active_license_count == 0 and transparency_seal_level == NONE"
            - "Organization.${o_id}.seal_expires_on is null"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: normalize_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/nonprofits/filings/{id}/normalize
          - calculations.organization_total_revenue_cents
        distinguishing_aspect: "Consistency is immediate: the normalize response already carries the recomputed Filing.total_revenue_cents, and a plain re-read with no wait shows the matching Organization aggregate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE organization with an EXTRACTED filing carrying two revenue lines of 1234.005 and 5678.005 USD_WHOLE."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - *c_filing
            - call: "POST /nonprofits/filings/${f_id}/extract"
              payload: { raw_lines: [{ line_code: "TOTREV", raw_value: "1234.005", raw_format: "USD_WHOLE", is_revenue_component: true }, { line_code: "PROGREV", raw_value: "5678.005", raw_format: "USD_WHOLE", is_revenue_component: true }] }
              as: PlatformVerifier
              as_user_id: "ver-dana"
          trigger:
            - call: "POST /nonprofits/filings/${f_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { filing_rev: "$.data.total_revenue_cents", filing_status: "$.data.status" }
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { org_rev: "$.data.total_revenue_cents" }
          assert:
            - "filing_status == NORMALIZED and filing_rev == 691202 — already correct inside the normalize response"
            - "org_rev == 691202 on the very next read, with no delay or retry"
            - "Organization.${o_id}.latest_filing_tax_year == 2025"

      - name: derived_counters_reflect_the_write_that_changed_them_within_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.organization_derived_counters
          - endpoints.POST_/nonprofits/organizations/{id}/grants
        distinguishing_aspect: "Every derived counter is reconciled inside the request that changes its inputs: recording the second grant from a new funder moves distinct_funder_count from 1 to 2 with no reconciliation pass."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE organization with one RECORDED grant from funder Kestrel Giving Fund."
          setup_api_calls:
            - *c_clock
            - *c_org
            - *c_prog
            - *c_l1
            - *c_l2
            - *c_l3
            - *c_verify
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Kestrel Giving Fund", ein: "900100250", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { k_id: "$.data.id" }
            - call: "POST /nonprofits/organizations"
              payload: { legal_name: "Harborlight Fund", ein: "900100251", org_type: "501C3", state_code: "IL" }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { h_id: "$.data.id" }
            - call: "POST /nonprofits/organizations/${o_id}/grants"
              payload: { funder_organization_id: "${k_id}", funder_name_raw: "Kestrel Giving Fund", recipient_name_raw: "Willow Creek Collective", amount_cents: 400000, fiscal_year: 2025 }
              as: DataConsumer
              as_user_id: "${k_id}"
          trigger:
            - call: "POST /nonprofits/organizations/${o_id}/grants"
              payload: { funder_organization_id: "${h_id}", funder_name_raw: "Harborlight Fund", recipient_name_raw: "Willow Creek Collective", amount_cents: 600000, fiscal_year: 2025 }
              as: DataConsumer
              as_user_id: "${h_id}"
              captures: { g2: "$.data.id" }
            - call: "GET /nonprofits/organizations/${o_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "the grant create returns 201"
            - "Organization.${o_id}.distinct_funder_count == 2 on the immediately following read"
            - "GET /nonprofits/organizations/${o_id}/grants returns exactly 2 rows"
            - "Organization.${o_id}.distinct_funder_count is unchanged by a second read — the counter is stored, not recomputed per request"

