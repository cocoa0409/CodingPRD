  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_report_periods_half_open_adjacency
        grounds:
          - calculations.compliance_index
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - entities.CommitteeReport.fields.period_end
        distinguishing_aspect: |
          Half-open interval semantics on CommitteeReport: windows [start, end) for the
          same committee may touch (end == start is adjacency, not overlap) but any
          positive-length intersection is rejected; windows of DIFFERENT committees never
          conflict.
        test_recipe:
          setup:
            - "Report A on BOARD_RISK_COMMITTEE [2026-08-01, 2026-09-01) already created"
          setup_api_calls:
            - call: "POST /compliance/committee-reports"
              payload: { committee_name: "BOARD_RISK_COMMITTEE", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "secretary-1"
              captures: { repA: $.data.id }
          trigger:
            - call: "POST /compliance/committee-reports"
              payload: { committee_name: "BOARD_RISK_COMMITTEE", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "secretary-1"
              captures: { repB: $.data.id }
            - call: "POST /compliance/committee-reports"
              payload: { committee_name: "BOARD_RISK_COMMITTEE", period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "secretary-1"
              captures: { errC: $.data.error_id }
            - call: "POST /compliance/committee-reports"
              payload: { committee_name: "AUDIT_COMMITTEE", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "secretary-1"
              captures: { repD: $.data.id }
          assert:
            - "Adjacent window [2026-09-01, 2026-10-01) accepted (repB created): end == start is adjacency under half-open semantics"
            - "Overlapping window [2026-08-15, 2026-09-15) rejected: ERR_REPORT_PERIOD_OVERLAP (409)"
            - "Identical window on AUDIT_COMMITTEE accepted (repD created): overlap is scoped per committee"

      - name: rto_rollout_windows_require_buffer
        grounds:
          - state_machines.PolicyUpdate.APPROVED_to_PUBLISHED
          - state_machines.PolicyUpdate.PUBLISHED_to_RETRACTED
          - errors[ERR_ROLLOUT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Different resource and different interval semantics from
          rto_report_periods_half_open_adjacency: rollout windows on the same CONTROL are
          closed intervals [published_at, effective_date] that must additionally be
          separated by a >= 7 day buffer; CANCELLED windows (after retract) stop
          constraining new publishes.
        test_recipe:
          setup:
            - "Control with policy update 1 PUBLISHED (effective 2026-08-20): rollout window [2026-08-01, 2026-08-20]; control.policy_version == 2"
            - "Policy update 2 APPROVED with effective_date 2026-08-25 (temporal rule satisfied: >= clock + 7d)"
          setup_api_calls:
            - call: "POST /compliance/controls"
              payload: { control_code: "CTL-RT2", title: "Ctl", owner_department: "COMP", review_frequency_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct: $.data.id, ct_v1: $.data.version }
            - call: "POST /compliance/policy-updates"
              payload: { control_id: "${ct}", title: "Update 1", change_summary: "c", effective_date: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pu1: $.data.id }
            - call: "POST /compliance/policy-updates/${pu1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/policy-updates/${pu1}/approve"
              payload: { expected_control_version: "${ct_v1}" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/policy-updates/${pu1}/publish"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/controls/${ct}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct_v3: $.data.version }
            - call: "POST /compliance/policy-updates"
              payload: { control_id: "${ct}", title: "Update 2", change_summary: "c", effective_date: "2026-08-25T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pu2: $.data.id }
            - call: "POST /compliance/policy-updates/${pu2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/policy-updates/${pu2}/approve"
              payload: { expected_control_version: "${ct_v3}" }
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { pu2_nvp: $.data.new_policy_version }
          trigger:
            - call: "POST /compliance/policy-updates/${pu2}/publish"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { err: $.data.error_id }
            - call: "POST /compliance/policy-updates/${pu1}/retract"
              payload: { reason: "Superseded by update 2" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/policy-updates/${pu2}/publish"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
              captures: { pu2_st: $.data.status }
            - call: "GET /compliance/controls/${ct}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct_pv: $.data.policy_version }
          assert:
            - "First publish of update 2 rejected: ERR_ROLLOUT_WINDOW_CONFLICT (new window [2026-08-01, 2026-08-25] vs live [2026-08-01, 2026-08-20]; 7-day buffer cannot be satisfied)"
            - "Update 2 new_policy_version was snapshotted at approve time: == 3 (control.policy_version was 2 then)"
            - "After retracting update 1 (rollout CANCELLED), the same publish succeeds: status == PUBLISHED"
            - "Control.policy_version == 3 after the successful publish (snapshot semantics: approval-time value, not recomputed)"

  - rule_id: compensating_invariant
    instances:
      - name: ci_mapping_approve_retire_conserves_coverage
        grounds:
          - calculations.residual_gap_score
          - state_machines.ObligationControlMapping.PROPOSED_to_APPROVED
          - state_machines.ObligationControlMapping.APPROVED_to_RETIRED
        distinguishing_aspect: |
          Conserved quantity: GapAnalysis.covered_points / residual_gap_points. Forward
          action (approve weight-4 mapping on a never-reviewed control, effectiveness 0.5)
          moves covered 0.0 -> 2.0 and residual 32.0 -> 30.0; the compensating action
          (retire) restores covered == 0.0 and residual == 32.0 exactly — no drift.
        test_recipe:
          setup:
            - "Pipeline to an OPEN (never confirmed) gap on a CRITICAL obligation; requirement_points == 32; control never reviewed (effectiveness 0.5)"
          setup_api_calls:
            - call: "POST /compliance/business-owners"
              payload: { name: "Rhea Patel", department: "OPS", email: "rhea@x.com" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { bo_id: $.data.id }
            - call: "POST /compliance/regulatory-changes"
              payload: { citation: "CI-A", title: "Change", summary: "s", feed_source: "FED_REGISTER", jurisdiction: "US-FED", regulator: "CFPB", published_at: "2026-07-15T00:00:00Z", effective_date: "2026-09-01T00:00:00Z", severity_hint: "CRITICAL" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ch: $.data.id }
            - call: "POST /compliance/regulatory-changes/${ch}/triage"
              payload: { verdict: "APPLICABLE", rationale: "r" }
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { ch_v: $.data.version }
            - call: "POST /compliance/obligations"
              payload: { obligation_code: "OBL-2026-CIA", title: "Obl", regulatory_change_id: "${ch}", criticality: "CRITICAL" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ob: $.data.id }
            - call: "POST /compliance/obligations/${ob}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /compliance/impact-assessments"
              payload: { regulatory_change_id: "${ch}", business_owner_id: "${bo_id}", due_date: "2026-08-10T00:00:00Z", expected_regulatory_change_version: "${ch_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ia: $.data.id }
            - call: "POST /compliance/impact-assessments/${ia}/start"
              payload: {}
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/impact-assessments/${ia}/submit"
              payload: { likelihood_score: 3, severity_score: 3, affected_business_lines: 1, findings_summary: "f" }
              as: BusinessOwner
              as_user_id: "${bo_id}"
            - call: "POST /compliance/impact-assessments/${ia}/accept"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/gap-analyses?impact_assessment_id=${ia}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ga: "$.data[0].id", cov0: "$.data[0].covered_points", res0: "$.data[0].residual_gap_points" }
            - call: "POST /compliance/controls"
              payload: { control_code: "CTL-CIA", title: "Never reviewed", owner_department: "COMP", review_frequency_days: 90 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ct: $.data.id }
            - call: "POST /compliance/obligation-control-mappings"
              payload: { obligation_id: "${ob}", control_id: "${ct}", coverage_weight: 4 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { mp: $.data.id }
            - call: "POST /compliance/obligation-control-mappings/${mp}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
            - call: "GET /compliance/gap-analyses/${ga}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { cov1: $.data.covered_points, res1: $.data.residual_gap_points }
          trigger:
            - call: "POST /compliance/obligation-control-mappings/${mp}/retire"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "GET /compliance/gap-analyses/${ga}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { cov2: $.data.covered_points, res2: $.data.residual_gap_points }
          assert:
            - "Before approve: covered_points == 0.0, residual_gap_points == 32.0 (full CRITICAL requirement)"
            - "After approve: covered_points == 2.0 (4 x 0.5), residual_gap_points == 30.0"
            - "After compensating retire: covered_points == 0.0 and residual_gap_points == 32.0 — the approve/retire pair leaves gap coverage exactly unchanged"
            - "Mapping.${mp}.status == RETIRED"

