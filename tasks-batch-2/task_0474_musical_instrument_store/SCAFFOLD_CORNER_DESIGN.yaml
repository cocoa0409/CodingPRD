              as_user_id: "luthier-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FORBIDDEN"
            - "RepairTicket.${rt}.status == READY"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_reserve_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-stale-unit]", state_machines.InventoryUnit.AVAILABLE_to_RESERVED]
        distinguishing_aspect: "Reserve with expected_inventory_unit_version equal to the unit's current version succeeds and increments version from 1 to 2."
        test_recipe:
          setup: ["Customer C, AVAILABLE unit U at version 1."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Cc1", email: "ccc1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Cc1 Guitar", category: "GUITAR", condition: "NEW", serial_number: "S-CC1-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
          trigger:
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
              captures: { newv: $.data.version, st: $.data.status }
          assert:
            - "InventoryUnit.${u}.status == RESERVED"
            - "InventoryUnit.${u}.version == 2"

      - name: occ_stale_reserve_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reserve-stale-unit]", "errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / unit_single_disposition_reserve_blocks_second_hold
          rationale: "The single-disposition second-reserve collision and the OCC stale-version semantics on the same endpoint are exercised by the named §1.8 overlap instance and the buyout OCC rule below."

      - name: occ_stale_buyout_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[buyout-stale-agreement]", "errors[ERR_STALE_VERSION]", state_machines.RentalAgreement.ACTIVE_to_BOUGHT_OUT]
        distinguishing_aspect: "Buyout carrying a pre-payment agreement version (one less than current after an intervening rent payment) -> ERR_STALE_VERSION (412); agreement stays ACTIVE."
        test_recipe:
          setup: ["RENT_TO_OWN agreement A on unit U with 2 rent payments; client holds a stale version captured before a 3rd payment."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Cc3", email: "ccc3@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Cc3 Guitar", category: "GUITAR", condition: "NEW", serial_number: "S-CC3-1", acquisition_cost_cents: 60000, list_price_cents: 120000, monthly_rent_cents: 10000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c}", inventory_unit_id: "${u}", plan: "RENT_TO_OWN", equity_rate_pct: 0.50 }
              as: SalesAssociate
              captures: { a: $.data.id }
            - call: "POST /rental-agreements/${a}/payments"
              payload: { billing_cycle_index: 1 }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /rental-agreements/${a}/payments"
              payload: { billing_cycle_index: 2 }
              as: Customer
              as_user_id: "${c}"
            - call: "GET /rental-agreements/${a}"
              as: Customer
              as_user_id: "${c}"
              captures: { stale_av: $.data.version }
            - call: "POST /rental-agreements/${a}/payments"
              payload: { billing_cycle_index: 3 }
              as: Customer
              as_user_id: "${c}"
          trigger:
            - call: "POST /rental-agreements/${a}/buyout"
              payload: { amount_cents: 110000, expected_agreement_version: "${stale_av}" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_VERSION"
            - "RentalAgreement.${a}.status == ACTIVE"

      - name: tradein_accept_cascade_store_credit_reconciled
        claim_type: derived_field_reconciliation
        grounds: [calculations.tradein_offer, entities.Customer.fields.store_credit_cents, state_machines.TradeIn.OFFERED_to_ACCEPTED]
        distinguishing_aspect: "Customer.store_credit_cents is reconciled after a trade-in accept: USED appraised 50000 -> +25000 credit reflected on the customer read."
        test_recipe:
          setup: ["Customer C (store_credit 0), TradeIn T (USED, appraised 50000) OFFERED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Cc4", email: "ccc4@x.com", credit_score: 700 }
              as: StoreManager
              captures: { c: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${c}", model_name: "Cc4 Used", condition: "USED", appraised_value_cents: 50000 }
              as: StoreManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /trade-ins/${t}/accept"
              as: StoreManager
          assert:
            - "Customer.${c}.store_credit_cents == 25000"

      - name: financing_approve_cascades_special_order_to_ordered
        claim_type: cascading_side_effects
        grounds: [state_machines.FinancingApplication.SUBMITTED_to_APPROVED, state_machines.SpecialOrder.DEPOSITED_to_ORDERED, entities.FinancingApplication.fields.special_order_id]
        distinguishing_aspect: "Approving a financing application linked to a DEPOSITED special order cascades that order DEPOSITED -> ORDERED."
        test_recipe:
          setup: ["Customer C (score 740), SpecialOrder SO DEPOSITED, FinancingApplication F linked to SO, SUBMITTED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Cc5", email: "ccc5@x.com", credit_score: 740 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c}", model_name: "Cc5 Order", quoted_price_cents: 200000, deposit_pct: 0.25 }
              as: SalesAssociate
              captures: { so: $.data.id }
            - call: "POST /special-orders/${so}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /financing-applications"
              payload: { customer_id: "${c}", principal_cents: 150000, term_months: 12, special_order_id: "${so}" }
              as: SalesAssociate
              captures: { f: $.data.id }
          trigger:
            - call: "POST /financing-applications/${f}/approve"
              as: StoreManager
          assert:
            - "FinancingApplication.${f}.status == APPROVED"
            - "SpecialOrder.${so}.status == ORDERED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_reserve_reflected_in_same_response
        claim_type: immediate
        grounds: [state_machines.InventoryUnit.AVAILABLE_to_RESERVED]
        distinguishing_aspect: "The reserve response itself shows status=RESERVED and the bumped version; no second read needed (immediate consistency)."
        test_recipe:
          setup: ["Customer C, AVAILABLE unit U."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Cm1", email: "ccm1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Cm1 Guitar", category: "GUITAR", condition: "NEW", serial_number: "S-CM1-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
          trigger:
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
              captures: { st: $.data.status }
          assert:
            - "InventoryUnit.${u}.status == RESERVED"
