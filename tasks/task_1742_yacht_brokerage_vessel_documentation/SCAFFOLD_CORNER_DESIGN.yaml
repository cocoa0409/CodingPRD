scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: vessel_creation_requires_doc_mode_coherence
        claim_type: required_fields
        grounds:
          - entities.Vessel.fields.documentation_mode
          - validations[priority=10]
          - errors[ERR_DOC_MODE_MISMATCH]
        distinguishing_aspect: "Creating a STATE vessel with uscg_official_no populated violates the coherence rule; only the matching identifier may accompany each mode."
        test_recipe:
          setup: ["Brokerage + listing agent exist"]
          setup_api_calls:
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Doc House", home_state_code: "FL", escrow_account_ref: "T-D", license_no: "FL-BRK-D", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkD: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkD}", full_name: "LAD", license_no: "FL-AG-D1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laD: $.data.id }
          trigger:
            - call: "POST /yacht/vessels"
              payload: { hin: "USDOCC123456", make: "X", model: "Y", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "STATE", uscg_official_no: "1234567", current_location_state_code: "FL" }
              as: ListingAgent
              as_user_id: "${laD}"
              captures: { err_doc: $.data.error_id }
          assert:
            - "err_doc == ERR_DOC_MODE_MISMATCH"

      - name: vessel_hin_uniqueness_enforced
        claim_type: type_constraints
        grounds:
          - entities.Vessel.fields.hin
          - validations[priority=9]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "Second vessel registration reusing an existing HIN is rejected with ERR_DUPLICATE_RESOURCE."
        test_recipe:
          setup: ["One vessel with hin USDUP1123456 already registered"]
          setup_api_calls:
            - call: "POST /yacht/vessels"
              payload: { hin: "USDUP1123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234567", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /yacht/vessels"
              payload: { hin: "USDUP1123456", make: "C", model: "D", year_built: 2021, length_overall_ft: 41.0, documentation_mode: "USCG", uscg_official_no: "7654321", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { err_hin: $.data.error_id }
          assert:
            - "err_hin == ERR_DUPLICATE_RESOURCE"

      - name: brokerage_default_tier_applied_when_listing_omits
        claim_type: defaults
        grounds:
          - entities.ListingAgreement.fields.commission_tier_code
          - entities.Brokerage.fields.default_commission_tier_code
        distinguishing_aspect: "Listing created without commission_tier_code inherits the brokerage default at calculation time; explicit override wins."
        test_recipe:
          setup: ["Brokerage with default_commission_tier_code PREMIER"]
          setup_api_calls:
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Premier House", home_state_code: "FL", escrow_account_ref: "T-PD", license_no: "FL-BRK-PD", default_commission_tier_code: "PREMIER" }
              as: PlatformAdmin
              captures: { brkPD: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkPD}", full_name: "LAPD", license_no: "FL-AG-PD1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laPD: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SPD", residency_state_code: "FL", tax_id_last4: "2001" }
              as: PlatformAdmin
              captures: { selPD: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USPDFT123456", make: "Z", model: "Q", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234568", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesPD: $.data.id }
          trigger:
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkPD}", listing_agent_id: "${laPD}", seller_id: "${selPD}", vessel_id: "${vesPD}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laPD}"
              captures: { lstPD: $.data.id }
          assert:
            - "ListingAgreement.${lstPD}.commission_tier_code is null in the stored row"
            - "Downstream commission_split resolves tier via Brokerage.default_commission_tier_code == PREMIER"

      - name: vessel_computed_liens_status_clean_on_create
        claim_type: computed_fields
        grounds:
          - entities.Vessel.fields.liens_status
        distinguishing_aspect: "A freshly created vessel reports liens_status == CLEAN without any client input for that field."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /yacht/vessels"
              payload: { hin: "USCLEN123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234569", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vcl: $.data.id, vcl_liens: $.data.liens_status }
          trigger:
            - call: "GET /yacht/vessels/${vcl}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "vcl_liens == CLEAN"
            - "Any client-supplied liens_status in the create payload is ignored (system field)"

      - name: listing_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a random non-existent UUID path id returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "NF House", home_state_code: "FL", escrow_account_ref: "T-NF", license_no: "FL-BRK-NF" }
              as: PlatformAdmin
          trigger:
            - call: "GET /yacht/listings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "err_nf == ERR_NOT_FOUND"

      - name: offer_round_no_system_initialized
        claim_type: system_fields
        grounds:
          - entities.Offer.fields.round_no
          - entities.Offer.fields.status
        distinguishing_aspect: "A root offer is created with status PENDING and round_no 1; both system-set values cannot be injected by the client."
        test_recipe:
          setup: ["Active listing"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Sys House", home_state_code: "FL", escrow_account_ref: "T-SY", license_no: "FL-BRK-SY" }
              as: PlatformAdmin
              captures: { brkSY: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkSY}", full_name: "LASY", license_no: "FL-AG-SY1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laSY: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkSY}", full_name: "SASY", license_no: "FL-AG-SY2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saSY: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SSY", residency_state_code: "FL", tax_id_last4: "2101" }
              as: PlatformAdmin
              captures: { selSY: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BSY", residency_state_code: "FL", tax_id_last4: "2102" }
              as: PlatformAdmin
              captures: { buySY: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USSYSF123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234570", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesSY: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkSY}", listing_agent_id: "${laSY}", seller_id: "${selSY}", vessel_id: "${vesSY}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laSY}"
              captures: { lstSY: $.data.id }
            - call: "POST /yacht/listings/${lstSY}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laSY}"
          trigger:
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstSY}", buyer_id: "${buySY}", selling_agent_id: "${saSY}", offer_price_cents: 100000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-10T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saSY}"
              captures: { offSY: $.data.id, offSY_status: $.data.status, offSY_round: $.data.round_no }
          assert:
            - "offSY_status == PENDING"
            - "offSY_round == 1"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: offer_reject_from_accepted_is_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.Offer
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REJECT is only declared from PENDING; attempting it on an ACCEPTED offer returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Offer in ACCEPTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Inv House", home_state_code: "FL", escrow_account_ref: "T-IV", license_no: "FL-BRK-IV" }
              as: PlatformAdmin
              captures: { brkIV: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkIV}", full_name: "LAIV", license_no: "FL-AG-IV1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laIV: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkIV}", full_name: "SAIV", license_no: "FL-AG-IV2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saIV: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SIV", residency_state_code: "FL", tax_id_last4: "2201" }
              as: PlatformAdmin
              captures: { selIV: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BIV", residency_state_code: "FL", tax_id_last4: "2202" }
              as: PlatformAdmin
              captures: { buyIV: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USINVT123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234571", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesIV: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkIV}", listing_agent_id: "${laIV}", seller_id: "${selIV}", vessel_id: "${vesIV}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laIV}"
              captures: { lstIV: $.data.id }
            - call: "POST /yacht/listings/${lstIV}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laIV}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstIV}", buyer_id: "${buyIV}", selling_agent_id: "${saIV}", offer_price_cents: 100000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-10T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saIV}"
              captures: { offIV: $.data.id, offIV_v: $.data.version }
            - call: "POST /yacht/offers/${offIV}/accept"
              payload: { expected_offer_version: "${offIV_v}" }
              as: ListingAgent
              as_user_id: "${laIV}"
          trigger:
            - call: "POST /yacht/offers/${offIV}/reject"
              payload: {}
              as: ListingAgent
              as_user_id: "${laIV}"
              captures: { err_rej: $.data.error_id }
          assert:
            - "err_rej == ERR_INVALID_STATE"
            - "Offer.${offIV}.status remains ACCEPTED"

      - name: offer_terminal_lockdown_no_transitions_from_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Offer
        distinguishing_aspect: "REJECTED is terminal; every further action endpoint on that offer returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Offer in REJECTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "TL House", home_state_code: "FL", escrow_account_ref: "T-TL", license_no: "FL-BRK-TL" }
              as: PlatformAdmin
              captures: { brkTL: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkTL}", full_name: "LATL", license_no: "FL-AG-TL1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laTL: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkTL}", full_name: "SATL", license_no: "FL-AG-TL2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saTL: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "STL", residency_state_code: "FL", tax_id_last4: "2301" }
              as: PlatformAdmin
              captures: { selTL: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BTL", residency_state_code: "FL", tax_id_last4: "2302" }
              as: PlatformAdmin
              captures: { buyTL: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USTLCK123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234572", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesTL: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkTL}", listing_agent_id: "${laTL}", seller_id: "${selTL}", vessel_id: "${vesTL}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laTL}"
              captures: { lstTL: $.data.id }
            - call: "POST /yacht/listings/${lstTL}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laTL}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstTL}", buyer_id: "${buyTL}", selling_agent_id: "${saTL}", offer_price_cents: 100000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-10T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saTL}"
              captures: { offTL: $.data.id }
            - call: "POST /yacht/offers/${offTL}/reject"
              payload: {}
              as: ListingAgent
              as_user_id: "${laTL}"
          trigger:
            - call: "POST /yacht/offers/${offTL}/withdraw"
              payload: {}
              as: SellingAgent
              as_user_id: "${saTL}"
              captures: { err_tl: $.data.error_id }
          assert:
            - "err_tl == ERR_INVALID_STATE"
            - "Offer.${offTL}.status remains REJECTED"

      - name: contingency_satisfy_after_deadline_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Contingency.OPEN_to_SATISFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Satisfy at clock > deadline is rejected; the sweep has already moved the contingency to EXPIRED, so the satisfy hits invalid state."
        test_recipe:
          setup: ["Offer ACCEPTED; SURVEY contingency OPEN with deadline 2026-08-11; clock advanced to 2026-08-12 (sweep marks EXPIRED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "CT House", home_state_code: "FL", escrow_account_ref: "T-CT", license_no: "FL-BRK-CT" }
              as: PlatformAdmin
              captures: { brkCT: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkCT}", full_name: "LACT", license_no: "FL-AG-CT1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laCT: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkCT}", full_name: "SACT", license_no: "FL-AG-CT2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saCT: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SCT", residency_state_code: "FL", tax_id_last4: "2401" }
              as: PlatformAdmin
              captures: { selCT: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BCT", residency_state_code: "FL", tax_id_last4: "2402" }
              as: PlatformAdmin
              captures: { buyCT: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USCTDL123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234573", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesCT: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkCT}", listing_agent_id: "${laCT}", seller_id: "${selCT}", vessel_id: "${vesCT}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laCT}"
              captures: { lstCT: $.data.id }
            - call: "POST /yacht/listings/${lstCT}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laCT}"
            - call: "POST /yacht/offers"
              payload: { listing_id: "${lstCT}", buyer_id: "${buyCT}", selling_agent_id: "${saCT}", offer_price_cents: 100000000, deposit_pct_basis: 1000, acceptance_deadline: "2026-08-05T00:00:00Z", settlement_state_code: "FL" }
              as: SellingAgent
              as_user_id: "${saCT}"
              captures: { offCT: $.data.id, offCT_v: $.data.version }
            - call: "POST /yacht/offers/${offCT}/accept"
              payload: { expected_offer_version: "${offCT_v}" }
              as: ListingAgent
              as_user_id: "${laCT}"
            - call: "GET /yacht/offers/${offCT}/contingencies"
              payload: {}
              as: SellingAgent
              as_user_id: "${saCT}"
              captures: { ct0: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /yacht/contingencies/${ct0}/satisfy"
              payload: {}
              as: SellingAgent
              as_user_id: "${saCT}"
              captures: { err_ct: $.data.error_id }
          assert:
            - "err_ct == ERR_INVALID_STATE (contingency already swept to EXPIRED)"

      - name: listing_under_contract_to_active_reactivation_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.ListingAgreement.UNDER_CONTRACT_to_ACTIVE
        excluded_because:
          difficulty_instance: offer_fail_cascades_listing_reactivate_and_escrow_refund
          rationale: "The kick-out reactivation side effect is asserted as link 2 of the named §1.8 cascade instance."

      - name: escrow_void_only_before_value_date
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EscrowLedgerEntry.PENDING_to_VOIDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Void at clock >= value_date is rejected (no longer voidable); only clock < value_date permits VOIDED."
        test_recipe:
          setup: ["Offer ACCEPTED; DEPOSIT entry PENDING with value_date 2026-08-03; clock at 2026-08-04"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Void House", home_state_code: "FL", escrow_account_ref: "T-VD", license_no: "FL-BRK-VD" }
              as: PlatformAdmin
              captures: { brkVD: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkVD}", full_name: "LAVD", license_no: "FL-AG-VD1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laVD: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkVD}", full_name: "SAVD", license_no: "FL-AG-VD2", split_pct_basis: 5000 }
              as: PlatformAdmin
              captures: { saVD: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SVD", residency_state_code: "FL", tax_id_last4: "2501" }
              as: PlatformAdmin
              captures: { selVD: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "BUYER", full_name: "BVD", residency_state_code: "FL", tax_id_last4: "2502" }
              as: PlatformAdmin
              captures: { buyVD: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USVOID123456", make: "A", model: "B", year_built: 2020, length_overall_ft: 40.0, documentation_mode: "USCG", uscg_official_no: "1234574", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesVD: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkVD}", listing_agent_id: "${laVD}", seller_id: "${selVD}", vessel_id: "${vesVD}", agreement_type: "CENTRAL", list_price_cents: 100000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
