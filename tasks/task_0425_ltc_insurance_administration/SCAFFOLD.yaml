# =============================================================================
# Long-Term Care Insurance Administration — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Long-Term Care Insurance Administration: policy & benefit pool (daily/monthly
  max, inflation rider), elimination period & benefit triggers (2-of-6
  ADL/cognitive), care plan & provider eligibility, claim & ongoing assessment,
  premium & rate-increase filing, nonforfeiture/lapse, partnership-program asset
  disregard, reimbursement vs indemnity.

domain_name: ltc-insurance-administration
api_prefix: /
# NOTE: api_prefix is the root "/" because the topology is FLAT — Policy, Provider,
# CarePlan, Claim, PremiumInvoice, RateIncreaseFiling, Policyholder are peer
# top-level collections, not nested under a single hub path.

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4) — EXPERT band
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation        # reimbursement vs indemnity on identical claim lines
  secondary_archetype: compliance_audit           # rate-increase filing, benefit triggers, lapse/nonforfeiture
  complexity_layers:
    - dual_variant_calculation                    # reimbursement vs indemnity benefit payout
    - rate_threshold_triggers                      # 2-of-6 ADL/cognitive; elimination-period day count
    - cascading_side_effects                       # lapse -> nonforfeiture conversion -> pool reduction -> claim block
    - derived_field_reconciliation                 # benefit pool balance, lifetime paid, partnership disregard
    - optimistic_concurrency                       # OCC on Policy.version for claim opening & rate-increase application

  entity_topology: flat
  # Peer entities linked by foreign keys; URL paths reference resources by their
  # own id (FK fields in body), no deep nesting. Policy is the hub.

  state_machine_shape: parallel
  # Policy carries two independent state axes (coverage_status x premium_status).
  # Claim is cyclic (assessment-revision loop). RateIncreaseFiling is branching.

  relationship_patterns:
    - one_to_many                                  # Policy -> Claim, Policy -> PremiumInvoice, Claim -> ClaimLine
    - cross_aggregate                              # Claim references CarePlan & Provider across the policy boundary
    - polymorphic                                  # BenefitLedgerEntry.source_kind {CLAIM_PAYMENT, NONFORFEITURE_REDUCTION, INFLATION_GROWTH}

  role_model: peer_roles
  # Policyholder owns their policy view; ClaimsExaminer adjudicates claims;
  # Underwriter manages policy/premium/rate filings; CareAssessor certifies
  # triggers & provider eligibility; Regulator approves rate-increase filings.

  consistency_model: immediate
  # All cascades complete atomically within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Policyholder
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Insured person's legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state of residence; drives partnership eligibility and rate-filing jurisdiction" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }
      - { name: medicaid_state_eligible, type: boolean, source: input, default: false, description: "Whether the residence state operates a qualified LTC Partnership program" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: input, description: "FK -> Policyholder.id; the insured this policy covers" }
      - { name: product_mode, type: enum, source: input, description: "Benefit payout mode, immutable after issue: REIMBURSEMENT | INDEMNITY. Constraints: one of {REIMBURSEMENT, INDEMNITY}" }
      - { name: daily_benefit_max_cents, type: integer, source: input, description: "Per-service-day benefit ceiling at issue, before inflation growth" }
      - { name: monthly_benefit_max_cents, type: integer, source: input, description: "Per-calendar-month benefit ceiling at issue, before inflation growth" }
      - { name: initial_pool_cents, type: integer, source: input, description: "Lifetime benefit pool at issue, before inflation growth" }
      - { name: inflation_rider, type: enum, source: input, description: "Inflation protection: NONE | COMPOUND_3PCT | COMPOUND_5PCT. Constraints: one of {NONE, COMPOUND_3PCT, COMPOUND_5PCT}" }
      - { name: elimination_period_days, type: integer, source: input, description: "Number of qualifying service days that must be self-paid before benefits begin" }
      - { name: is_partnership_policy, type: boolean, source: input, default: false, description: "Whether this is a state-qualified LTC Partnership policy granting Medicaid asset disregard" }
      - { name: inflation_years_elapsed, type: integer, source: system, default: 0, description: "Whole years of inflation growth applied; advanced by the anniversary endpoint" }
      - { name: inflated_daily_max_cents, type: integer, source: computed, description: "daily_benefit_max_cents grown by inflation_rider over inflation_years_elapsed (see calc inflation_growth)" }
      - { name: inflated_monthly_max_cents, type: integer, source: computed, description: "monthly_benefit_max_cents grown by inflation_rider over inflation_years_elapsed" }
      - { name: coverage_status, type: enum, source: system, description: "Coverage axis. APPLIED -> IN_FORCE -> (CLAIM_OPEN <-> IN_FORCE) -> EXHAUSTED / RESCINDED. Constraints: one of {APPLIED, IN_FORCE, CLAIM_OPEN, EXHAUSTED, RESCINDED}" }
      - { name: premium_status, type: enum, source: system, description: "Premium axis (independent of coverage). PENDING -> PAID_CURRENT <-> GRACE -> LAPSED / NONFORFEITURE_PAID_UP / WAIVED. Constraints: one of {PENDING, PAID_CURRENT, GRACE, LAPSED, NONFORFEITURE_PAID_UP, WAIVED}" }
      - { name: benefits_triggered, type: boolean, source: computed, default: false, description: "True once a BenefitTriggerCertification with decision CERTIFIED is the latest certification for this policy" }
      - { name: elimination_days_satisfied, type: integer, source: computed, default: 0, description: "Count of distinct qualifying service days credited toward the elimination period (see calc elimination_period_progress)" }

  - name: BenefitPool
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy whose lifetime pool this ledger tracks (1:1)" }
      - { name: inflated_pool_cents, type: integer, source: computed, description: "initial_pool_cents grown by inflation (see calc inflation_growth), minus any nonforfeiture reduction" }
      - { name: lifetime_paid_cents, type: integer, source: computed, default: 0, description: "Sum of BenefitLedgerEntry.amount_cents where source_kind = CLAIM_PAYMENT" }
      - { name: nonforfeiture_reduction_cents, type: integer, source: computed, default: 0, description: "Amount removed from the pool when the policy converts to NONFORFEITURE_PAID_UP (see calc nonforfeiture_pool)" }
      - { name: remaining_pool_cents, type: integer, source: computed, description: "inflated_pool_cents - lifetime_paid_cents (floored at 0)" }

  - name: PremiumInvoice
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy this premium bill belongs to" }
      - { name: period_index, type: integer, source: input, description: "Monotonic billing-period number, starting at 0 at issue; unique per policy" }
      - { name: amount_cents, type: integer, source: computed, description: "Premium for the period including any approved rate increase (see calc premium_amount)" }
      - { name: due_date, type: string, source: input, description: "ISO 8601 date the premium is due" }
      - { name: grace_deadline, type: string, source: input, description: "ISO 8601 date after which non-payment lapses the policy (typically due_date + 65 days)" }
      - { name: status, type: enum, source: system, description: "OPEN -> PAID / WAIVED / DEFAULTED. Constraints: one of {OPEN, PAID, WAIVED, DEFAULTED}" }

  - name: RateIncreaseFiling
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy the carrier seeks to re-rate" }
      - { name: requested_increase_pct, type: integer, source: input, description: "Whole-percent premium increase the carrier requests (e.g., 40 = +40%)" }
      - { name: approved_increase_pct, type: integer, source: computed, default: 0, description: "Whole-percent increase the regulator approved; 0 until APPROVED/PARTIALLY_APPROVED" }
      - { name: effective_period_index, type: integer, source: input, description: "First PremiumInvoice period_index at which the approved increase applies" }
      - { name: status, type: enum, source: system, description: "FILED -> APPROVED / PARTIALLY_APPROVED / REJECTED / WITHDRAWN. Constraints: one of {FILED, APPROVED, PARTIALLY_APPROVED, REJECTED, WITHDRAWN}" }

  - name: BenefitTriggerCertification
    parent: null
    common_fields: false   # append-only assessment event: id + created_at only
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy being assessed for benefit eligibility" }
      - { name: adl_deficiencies, type: array, source: input, description: "Subset of the six ADLs the insured cannot perform: BATHING, DRESSING, TOILETING, TRANSFERRING, CONTINENCE, EATING" }
      - { name: cognitive_impairment, type: boolean, source: input, default: false, description: "Whether severe cognitive impairment (e.g., dementia) is certified independent of ADLs" }
      - { name: decision, type: enum, source: computed, description: "CERTIFIED when 2-of-6 ADL deficiencies OR cognitive_impairment; otherwise NOT_CERTIFIED (see calc benefit_trigger_decision). Constraints: one of {CERTIFIED, NOT_CERTIFIED}" }
      - { name: assessed_by_id, type: string, source: system, description: "X-User-ID of the CareAssessor who recorded this certification" }
      - { name: supersedes_id, type: string, source: input, description: "FK -> BenefitTriggerCertification.id; the prior certification this re-assessment replaces (null for the first)" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Care provider's name" }
      - { name: provider_type, type: enum, source: input, description: "NURSING_HOME | ASSISTED_LIVING | HOME_HEALTH_AGENCY | ADULT_DAY_CARE | INFORMAL_CAREGIVER. Constraints: one of the five" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state where the provider is licensed" }
      - { name: license_active, type: boolean, source: input, default: true, description: "Whether the provider currently holds an active license" }
      - { name: eligibility_status, type: enum, source: system, description: "PENDING -> ELIGIBLE / INELIGIBLE / SUSPENDED. Constraints: one of {PENDING, ELIGIBLE, INELIGIBLE, SUSPENDED}" }

  - name: CarePlan
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy this plan of care is authored against" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the provider designated to deliver care under this plan" }
      - { name: care_setting, type: enum, source: input, description: "Must match an eligible provider_type: NURSING_HOME | ASSISTED_LIVING | HOME_HEALTH | ADULT_DAY | INFORMAL. Constraints: one of the five" }
      - { name: authored_by_id, type: string, source: system, description: "X-User-ID of the CareAssessor who authored the plan" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED / CLOSED. Constraints: one of {DRAFT, ACTIVE, SUPERSEDED, CLOSED}" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy this claim draws benefits from" }
      - { name: care_plan_id, type: string, source: input, description: "FK -> CarePlan.id; the active plan of care authorizing the claimed services" }
      - { name: service_month, type: string, source: input, description: "ISO 8601 year-month (YYYY-MM) the claimed services fall in; unique per policy" }
      - { name: month_paid_cents, type: integer, source: computed, default: 0, description: "Total benefit paid for this claim's lines after monthly-max capping (see calc claim_benefit_payout)" }
      - { name: requires_reassessment, type: boolean, source: computed, default: false, description: "True when the claim has been sent back for an updated BenefitTriggerCertification" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> UNDER_REVIEW -> (PENDING_REASSESSMENT <-> UNDER_REVIEW) -> APPROVED / DENIED / VOID. Constraints: one of {SUBMITTED, UNDER_REVIEW, PENDING_REASSESSMENT, APPROVED, DENIED, VOID}" }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim this service-day line belongs to" }
      - { name: service_date, type: string, source: input, description: "ISO 8601 date of the single service day this line bills; unique per claim" }
      - { name: billed_charge_cents, type: integer, source: input, description: "Actual provider charge for the service day (used only in REIMBURSEMENT mode)" }
      - { name: is_qualifying_day, type: boolean, source: input, default: true, description: "Whether the day counts as a qualifying LTC service day (eligible toward elimination period and benefits)" }
      - { name: elimination_applied, type: boolean, source: computed, default: false, description: "True if this line was consumed by the elimination period (self-pay, zero benefit)" }
      - { name: benefit_paid_cents, type: integer, source: computed, default: 0, description: "Benefit paid for this line under the policy product_mode and daily max (see calc claim_benefit_payout)" }

  - name: BenefitLedgerEntry
    parent: null
    common_fields: false   # append-only ledger event: id + created_at only
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy whose pool this entry adjusts" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim that produced this entry (null for non-claim entries)" }
      - { name: source_kind, type: enum, source: system, description: "CLAIM_PAYMENT | NONFORFEITURE_REDUCTION | INFLATION_GROWTH. Constraints: one of the three" }
      - { name: amount_cents, type: integer, source: system, description: "Signed pool delta: negative for CLAIM_PAYMENT and NONFORFEITURE_REDUCTION, positive for INFLATION_GROWTH" }

  - name: PartnershipDisregard
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the partnership policy accruing Medicaid asset protection (1:1)" }
      - { name: protected_asset_cents, type: integer, source: computed, default: 0, description: "Dollar-for-dollar Medicaid asset disregard equal to BenefitPool.lifetime_paid_cents while the partnership policy stays qualified (see calc partnership_disregard)" }
      - { name: disregard_status, type: enum, source: system, description: "ACCRUING -> FROZEN. FROZEN when the partnership policy lapses without nonforfeiture. Constraints: one of {ACCRUING, FROZEN}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Policy — PARALLEL dimensions: coverage_status x premium_status evolve
  # independently on the same row (Rule 3: parallel).
  # ---------------------------------------------------------------------------
  - entity: Policy
    dimension: coverage_status
    initial_state: APPLIED
    terminal_states: [EXHAUSTED, RESCINDED]
    transitions:
      - from: APPLIED
        to: IN_FORCE
        trigger: "POST /policies/{id}/issue"
        actor: Underwriter
        preconditions:
          - "policy.coverage_status == APPLIED (ERR_INVALID_STATE)"
          - "A BenefitPool row already exists for this policy is NOT required; issue creates it"
        side_effects:
          - "Create BenefitPool for this policy with lifetime_paid_cents=0, nonforfeiture_reduction_cents=0"
          - "Set premium_status = PENDING is NOT done here (premium axis starts PENDING at create)"
          - "increments Policy.version by 1"
      - from: IN_FORCE
        to: CLAIM_OPEN
        trigger: "POST /claims (first claim opening against this policy)"
        actor: ClaimsExaminer
        preconditions:
          - "policy.coverage_status == IN_FORCE (ERR_INVALID_STATE)"
          - "expected_policy_version matches Policy.version (ERR_STALE_VERSION)"
          - "policy.premium_status IN {PAID_CURRENT, WAIVED, NONFORFEITURE_PAID_UP} (ERR_PREMIUM_NOT_CURRENT)"
          - "policy.benefits_triggered == true (ERR_BENEFITS_NOT_TRIGGERED)"
        side_effects:
          - "increments Policy.version by 1"
        note: "Coverage flips to CLAIM_OPEN only on the first open claim; closing the last open claim flips it back."
      - from: CLAIM_OPEN
        to: IN_FORCE
        trigger: "POST /claims/{id}/approve or POST /claims/{id}/deny (when no other claim remains non-terminal)"
        actor: ClaimsExaminer
        preconditions:
          - "No remaining Claim for this policy in status IN {SUBMITTED, UNDER_REVIEW, PENDING_REASSESSMENT} after this transition (else stay CLAIM_OPEN)"
        side_effects:
          - "increments Policy.version by 1"
      - from: CLAIM_OPEN
        to: EXHAUSTED
        trigger: "POST /claims/{id}/approve (when remaining_pool_cents reaches 0)"
        actor: system
        preconditions:
          - "BenefitPool.remaining_pool_cents == 0 after applying this claim's payout (ERR not raised; this is an auto-transition)"
        side_effects:
          - "All non-terminal Claim rows for this policy are auto-transitioned to VOID"
          - "increments Policy.version by 1"
        note: "Auto-transition (actor: system) fired inside the approve request when the pool hits exactly 0."
      - from: APPLIED
        to: RESCINDED
        trigger: "POST /policies/{id}/rescind"
        actor: Underwriter
        preconditions:
          - "policy.coverage_status == APPLIED (ERR_INVALID_STATE)"
        side_effects:
          - "increments Policy.version by 1"

  - entity: Policy
    dimension: premium_status
    initial_state: PENDING
    terminal_states: [LAPSED]
    transitions:
      - from: PENDING
        to: PAID_CURRENT
        trigger: "POST /premium-invoices/{id}/pay (first invoice)"
        actor: Policyholder
        preconditions:
          - "policy.coverage_status == IN_FORCE (ERR_INVALID_STATE)"
          - "invoice.status == OPEN (ERR_INVOICE_NOT_OPEN)"
        side_effects:
          - "invoice.status = PAID"
      - from: PAID_CURRENT
        to: GRACE
        trigger: "POST /_clock/advance_to (clock passes an OPEN invoice's due_date)"
        actor: system
        preconditions:
          - "An OPEN PremiumInvoice exists whose due_date < clock and grace_deadline >= clock"
        side_effects: []
        note: "Auto-transition driven by the clock endpoint."
      - from: GRACE
        to: PAID_CURRENT
        trigger: "POST /premium-invoices/{id}/pay (within grace)"
        actor: Policyholder
        preconditions:
          - "invoice.status == OPEN (ERR_INVOICE_NOT_OPEN)"
          - "clock <= invoice.grace_deadline (ERR_GRACE_EXPIRED)"
        side_effects:
          - "invoice.status = PAID"
      - from: GRACE
        to: LAPSED
        trigger: "POST /_clock/advance_to (clock passes grace_deadline of an OPEN invoice)"
        actor: system
        preconditions:
          - "An OPEN PremiumInvoice exists whose grace_deadline < clock"
        side_effects:
          - "invoice.status = DEFAULTED"
          - "If policy.inflation_rider != NONE OR lifetime_paid_cents > 0 (nonforfeiture vested): premium_status set to NONFORFEITURE_PAID_UP instead of LAPSED, and a NONFORFEITURE_REDUCTION BenefitLedgerEntry is written (cascade — see calc nonforfeiture_pool); BenefitPool.nonforfeiture_reduction_cents is recomputed; PartnershipDisregard stays ACCRUING"
          - "Else (no nonforfeiture vested): premium_status = LAPSED; PartnershipDisregard.disregard_status = FROZEN"
        note: "Branch: vested -> NONFORFEITURE_PAID_UP (paid-up reduced pool); not vested -> LAPSED. Cross-entity cascade into BenefitPool & PartnershipDisregard."
      - from: PAID_CURRENT
        to: WAIVED
        trigger: "POST /policies/{id}/waive-premium"
        actor: ClaimsExaminer
        preconditions:
          - "policy.benefits_triggered == true (ERR_BENEFITS_NOT_TRIGGERED)"
          - "policy.coverage_status IN {IN_FORCE, CLAIM_OPEN} (ERR_INVALID_STATE)"
        side_effects:
          - "All OPEN PremiumInvoice rows for this policy set to WAIVED"
        note: "Waiver of premium: once on claim, premium obligation is waived."

  # ---------------------------------------------------------------------------
  # Claim — CYCLIC: UNDER_REVIEW <-> PENDING_REASSESSMENT revision loop
  # (Rule 3: cycle on a different entity than Policy).
  # ---------------------------------------------------------------------------
  - entity: Claim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, VOID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/start-review"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == SUBMITTED (ERR_INVALID_STATE)"
          - "care_plan.status == ACTIVE (ERR_CARE_PLAN_NOT_ACTIVE)"
          - "The CarePlan's Provider.eligibility_status == ELIGIBLE (ERR_PROVIDER_NOT_ELIGIBLE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: PENDING_REASSESSMENT
        trigger: "POST /claims/{id}/request-reassessment"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "claim.requires_reassessment = true"
        note: "Cycle leg 1: examiner sends the claim back pending a fresh trigger certification."
      - from: PENDING_REASSESSMENT
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/resume-review"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == PENDING_REASSESSMENT (ERR_INVALID_STATE)"
          - "The latest BenefitTriggerCertification for the policy created AFTER claim.requires_reassessment was set has decision CERTIFIED (ERR_BENEFITS_NOT_TRIGGERED)"
        side_effects:
          - "claim.requires_reassessment = false"
        note: "Cycle leg 2: a newer CERTIFIED certification clears the claim back into review. The loop may repeat."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "expected_policy_version matches Policy.version (ERR_STALE_VERSION)"
          - "policy.benefits_triggered == true (ERR_BENEFITS_NOT_TRIGGERED)"
          - "BenefitPool.remaining_pool_cents > 0 (ERR_POOL_EXHAUSTED)"
        side_effects:
          - "Run calc claim_benefit_payout over the claim's lines; set each ClaimLine.benefit_paid_cents, elimination_applied; set claim.month_paid_cents"
          - "Append a CLAIM_PAYMENT BenefitLedgerEntry with amount_cents = -claim.month_paid_cents"
          - "Recompute BenefitPool.lifetime_paid_cents and remaining_pool_cents (cascade)"
          - "Recompute Policy.elimination_days_satisfied (cascade)"
          - "If PartnershipDisregard exists and ACCRUING: recompute protected_asset_cents (cascade — depends on lifetime_paid_cents just updated)"
          - "If remaining_pool_cents reaches exactly 0: auto-transition coverage_status -> EXHAUSTED and VOID all other non-terminal claims"
          - "Else if no other non-terminal claim remains: coverage_status -> IN_FORCE"
          - "increments Policy.version by 1"
        note: "Depth-4 cascade: approve -> ledger entry -> pool recompute -> partnership disregard recompute -> (conditional) coverage EXHAUSTED + claim VOID."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: ClaimsExaminer
        preconditions:
          - "claim.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "expected_policy_version matches Policy.version (ERR_STALE_VERSION)"
        side_effects:
          - "If no other non-terminal claim remains: coverage_status -> IN_FORCE"
          - "increments Policy.version by 1"

  # ---------------------------------------------------------------------------
  # RateIncreaseFiling — BRANCHING fork: FILED -> {APPROVED, PARTIALLY_APPROVED,
  # REJECTED} with divergent side-effect sets per branch.
  # ---------------------------------------------------------------------------
  - entity: RateIncreaseFiling
    initial_state: FILED
    terminal_states: [APPROVED, PARTIALLY_APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /rate-filings/{id}/adjudicate (granted_pct == requested_increase_pct)"
        actor: Regulator
        preconditions:
          - "filing.status == FILED (ERR_INVALID_STATE)"
          - "granted_pct == filing.requested_increase_pct (ERR_INVALID_REQUEST)"
          - "expected_policy_version matches Policy.version (ERR_STALE_VERSION)"
        side_effects:
          - "approved_increase_pct = requested_increase_pct"
          - "All OPEN PremiumInvoice rows for the policy with period_index >= effective_period_index recompute amount_cents (cascade — see calc premium_amount)"
          - "increments Policy.version by 1"
      - from: FILED
        to: PARTIALLY_APPROVED
        trigger: "POST /rate-filings/{id}/adjudicate (0 < granted_pct < requested_increase_pct)"
        actor: Regulator
        preconditions:
          - "filing.status == FILED (ERR_INVALID_STATE)"
          - "0 < granted_pct < filing.requested_increase_pct (ERR_INVALID_REQUEST)"
          - "expected_policy_version matches Policy.version (ERR_STALE_VERSION)"
        side_effects:
          - "approved_increase_pct = granted_pct"
          - "All OPEN PremiumInvoice rows for the policy with period_index >= effective_period_index recompute amount_cents (cascade)"
          - "increments Policy.version by 1"
      - from: FILED
        to: REJECTED
        trigger: "POST /rate-filings/{id}/adjudicate (granted_pct == 0)"
        actor: Regulator
        preconditions:
          - "filing.status == FILED (ERR_INVALID_STATE)"
          - "granted_pct == 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "approved_increase_pct stays 0; no invoice recompute"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /rate-filings/{id}/withdraw"
        actor: Underwriter
        preconditions:
          - "filing.status == FILED (ERR_INVALID_STATE)"
        side_effects: []

  # ---------------------------------------------------------------------------
  # Provider — eligibility lifecycle.
  # ---------------------------------------------------------------------------
  - entity: Provider
    initial_state: PENDING
    terminal_states: [INELIGIBLE]
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "POST /providers/{id}/certify"
        actor: CareAssessor
        preconditions:
          - "provider.eligibility_status == PENDING (ERR_INVALID_STATE)"
          - "provider.license_active == true (ERR_PROVIDER_LICENSE_INACTIVE)"
        side_effects: []
      - from: PENDING
        to: INELIGIBLE
        trigger: "POST /providers/{id}/reject"
        actor: CareAssessor
        preconditions:
          - "provider.eligibility_status == PENDING (ERR_INVALID_STATE)"
        side_effects: []
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /providers/{id}/suspend"
        actor: CareAssessor
        preconditions:
          - "provider.eligibility_status == ELIGIBLE (ERR_INVALID_STATE)"
        side_effects:
          - "All CarePlan rows referencing this provider with status == ACTIVE transition to CLOSED (cascade)"
          - "Each Claim referencing one of those closed CarePlans in status IN {SUBMITTED, UNDER_REVIEW, PENDING_REASSESSMENT} transitions to VOID (cascade — depth-3: suspend -> care plan CLOSED -> claim VOID)"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /providers/{id}/certify"
        actor: CareAssessor
        preconditions:
          - "provider.eligibility_status == SUSPENDED (ERR_INVALID_STATE)"
          - "provider.license_active == true (ERR_PROVIDER_LICENSE_INACTIVE)"
        side_effects: []

  # ---------------------------------------------------------------------------
  # CarePlan — plan lifecycle; supersede loop.
  # ---------------------------------------------------------------------------
  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /care-plans/{id}/activate"
        actor: CareAssessor
        preconditions:
          - "care_plan.status == DRAFT (ERR_INVALID_STATE)"
          - "Provider.eligibility_status == ELIGIBLE (ERR_PROVIDER_NOT_ELIGIBLE)"
          - "care_plan.care_setting maps to Provider.provider_type per the setting/type compatibility table (ERR_CARE_SETTING_MISMATCH)"
        side_effects:
          - "Any other ACTIVE CarePlan for the same policy transitions to SUPERSEDED (cascade)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /care-plans/{id}/activate (a newer plan for the same policy is activated)"
        actor: CareAssessor
        preconditions:
          - "care_plan.status == ACTIVE"
        side_effects: []
        note: "Bubble effect of activating a replacement plan."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /providers/{id}/suspend (cascade) or POST /care-plans/{id}/close"
        actor: CareAssessor
        preconditions:
          - "care_plan.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on Policy.version (true CREATE-with-supersede
# and apply races only; everything else is a state precondition).
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: claim-open-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /claims"
    occ_field: "expected_policy_version"
    description: |
      Opening a Claim against a Policy whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just approved a claim that drew down the benefit pool (and may
      have flipped coverage toward EXHAUSTED), so the current writer's view of
      the policy — its remaining pool and coverage_status — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rate-filing-apply-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /rate-filings/{id}/adjudicate"
    occ_field: "expected_policy_version"
    description: |
      Adjudicating a RateIncreaseFiling against a Policy whose version has
      advanced since the client last observed it is rejected. Another filing may
      have already been approved and recomputed the same OPEN invoices, so the
      premium baseline this regulator is acting on is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant: reimbursement vs indemnity (Rule 1 + Rule 2 mode a) ------
  - name: claim_benefit_payout
    trigger: "On POST /claims/{id}/approve (UNDER_REVIEW -> APPROVED transition)"
    algorithm: chronological
    formula: |
      # Process the claim's ClaimLines in ascending service_date order
      # (tie-break: created_at ASC — service_date is unique per claim so no tie expected).
      # Elimination period is consumed FIRST, day by day, across the policy's history.
      remaining_elim = max(0, policy.elimination_period_days - policy.elimination_days_satisfied)
      month_running_cents = sum of benefit_paid_cents already paid this service_month on prior approved claims
      pool_remaining = BenefitPool.remaining_pool_cents
      for line in lines sorted by (service_date ASC):
          if not line.is_qualifying_day:
              line.benefit_paid_cents = 0; line.elimination_applied = false; continue
          if remaining_elim > 0:
              line.elimination_applied = true
              line.benefit_paid_cents = 0
              remaining_elim -= 1
              continue
          line.elimination_applied = false
          # daily entitlement BEFORE caps depends on product_mode:
          if policy.product_mode == INDEMNITY:
              raw_day = policy.inflated_daily_max_cents          # pay the full daily max regardless of charge
          else: # REIMBURSEMENT
              raw_day = min(line.billed_charge_cents, policy.inflated_daily_max_cents)
          # monthly cap: cumulative paid this service_month may not exceed inflated_monthly_max_cents
          monthly_headroom = max(0, policy.inflated_monthly_max_cents - month_running_cents)
          day_pay = min(raw_day, monthly_headroom, pool_remaining)
          line.benefit_paid_cents = day_pay
          month_running_cents += day_pay
          pool_remaining -= day_pay
      claim.month_paid_cents = sum(line.benefit_paid_cents for line in lines)
    input_set: "All ClaimLine rows of the claim being approved, plus benefit_paid_cents from prior APPROVED claims in the same Policy and service_month for the monthly-cap accumulator."
    constants: {}
    precision: "Integer cents; no rounding (all caps and charges are integer cents)."
    variants:
      - name: indemnity
        when: "policy.product_mode == INDEMNITY"
        difference: "raw_day is the full inflated_daily_max_cents irrespective of billed_charge_cents — the insured keeps the difference."
      - name: reimbursement
        when: "policy.product_mode == REIMBURSEMENT"
        difference: "raw_day = min(billed_charge_cents, inflated_daily_max_cents) — pays only the lesser of charge and cap."

  # --- Inflation growth (Rule 2 mode b: nested rounding, order pinned) --------
  - name: inflation_growth
    trigger: "Read of Policy.inflated_daily_max_cents / inflated_monthly_max_cents / BenefitPool.inflated_pool_cents, and on POST /policies/{id}/apply-anniversary"
    algorithm: aggregation
    formula: |
      # Compound annual growth on each base, COMPOUNDED PER YEAR with rounding
      # applied each year (round per-year, NOT once at the end). The order is pinned:
      # for each of the inflation_years_elapsed years, multiply then round_half_up to
      # the nearest cent BEFORE the next year's multiply. Summing-then-rounding or
      # rounding once at the end yields different cents and is WRONG.
      rate = 0.0 if NONE, 0.03 if COMPOUND_3PCT, 0.05 if COMPOUND_5PCT
      def grow(base_cents):
          v = base_cents
          for _ in range(policy.inflation_years_elapsed):
              v = round_half_up(v * (1 + rate))   # round to integer cents EACH year
          return v
      inflated_daily_max_cents   = grow(daily_benefit_max_cents)
      inflated_monthly_max_cents = grow(monthly_benefit_max_cents)
      inflated_pool_cents        = grow(initial_pool_cents) - BenefitPool.nonforfeiture_reduction_cents
    input_set: "The policy's base maxima and initial_pool_cents, the inflation_rider rate, and inflation_years_elapsed."
    constants:
      RATE_NONE: 0.0
      RATE_COMPOUND_3PCT: 0.03
      RATE_COMPOUND_5PCT: 0.05
    precision: "round_half_up to integer cents applied once PER YEAR, in ascending year order; pinned order — per-year rounding, never round-once-at-end."

  # --- Premium amount with rate increase (Rule 2 mode c: ordered dependency) --
  - name: premium_amount
    trigger: "On PremiumInvoice creation (POST /policies/{id}/premium-invoices) and on RateIncreaseFiling APPROVED/PARTIALLY_APPROVED recompute of OPEN invoices"
    algorithm: tiered_pricing
    formula: |
      # base_premium_cents is the policy's per-period base premium (issue-time field,
      # carried on the policy as a configuration value supplied at premium-invoice creation).
      # Evaluation order is pinned and well-defined:
      #   1. Determine the single applicable approved increase: the RateIncreaseFiling
      #      for this policy whose status IN {APPROVED, PARTIALLY_APPROVED} with the
      #      LARGEST effective_period_index that is <= this invoice.period_index.
      #      Tie-break (two filings with the same effective_period_index): the one with
      #      the later created_at wins. If none applies, increase = 0.
      #   2. amount_cents = round_half_up(base_premium_cents * (100 + approved_increase_pct) / 100)
      applicable = select filing where policy_id == invoice.policy_id
                   and status IN {APPROVED, PARTIALLY_APPROVED}
                   and effective_period_index <= invoice.period_index
                   order by effective_period_index DESC, created_at DESC
                   take first
      pct = applicable.approved_increase_pct if applicable else 0
      amount_cents = round_half_up(base_premium_cents * (100 + pct) / 100)
    input_set: "The invoice's base_premium_cents input and the single most-recent applicable approved/partially-approved RateIncreaseFiling at or before the invoice's period_index."
    constants: {}
    precision: "round_half_up to integer cents AFTER applying the percentage (multiply then round); single rounding step."
    variants:
      - name: no_increase
        when: "No APPROVED/PARTIALLY_APPROVED filing has effective_period_index <= invoice.period_index"
        difference: "pct = 0; amount_cents == base_premium_cents."
      - name: with_increase
        when: "An applicable approved filing exists"
        difference: "amount_cents grows by the selected approved_increase_pct."

  # --- Benefit trigger 2-of-6 decision (Rule 2 mode a: conditional branch) -----
  - name: benefit_trigger_decision
    trigger: "On POST /policies/{id}/trigger-certifications creation"
    algorithm: threshold
    formula: |
      # The six ADLs are: BATHING, DRESSING, TOILETING, TRANSFERRING, CONTINENCE, EATING.
      # Count DISTINCT valid ADLs in adl_deficiencies (duplicates and unknown tokens ignored).
      valid_adls = distinct(adl_deficiencies INTERSECT {BATHING,DRESSING,TOILETING,TRANSFERRING,CONTINENCE,EATING})
      adl_count = len(valid_adls)
      if adl_count >= 2 OR cognitive_impairment == true:
          decision = CERTIFIED
      else:
          decision = NOT_CERTIFIED
      # Boundary: adl_count == 1 with cognitive_impairment == false -> NOT_CERTIFIED;
      #           adl_count == 2 -> CERTIFIED (>= 2, not > 2).
    input_set: "adl_deficiencies array and cognitive_impairment flag on the certification."
    constants:
      ADL_TRIGGER_COUNT: 2
      VALID_ADLS: ["BATHING", "DRESSING", "TOILETING", "TRANSFERRING", "CONTINENCE", "EATING"]
    precision: "Integer count; threshold is >= 2 (two-of-six), inclusive."

  # --- Elimination period progress (Rule 6 boundary on a second metric) -------
  - name: elimination_period_progress
    trigger: "Recomputed on POST /claims/{id}/approve and read on GET /policies/{id}"
    algorithm: aggregation
    formula: |
      # Count distinct qualifying service days across ALL of the policy's APPROVED claims'
      # ClaimLines where is_qualifying_day == true, capped at elimination_period_days.
      # A day counts toward elimination satisfaction whether or not it was paid — the
      # earliest qualifying days are self-paid (benefit_paid_cents == 0, elimination_applied true).
      qualifying_days = distinct service_date over ClaimLine
                        joined to APPROVED Claim of this policy
                        where ClaimLine.is_qualifying_day == true
      elimination_days_satisfied = min(len(qualifying_days), policy.elimination_period_days)
    input_set: "All ClaimLine rows of APPROVED claims for the policy with is_qualifying_day == true."
    constants: {}
    precision: "Integer day count, floored at 0 and capped at elimination_period_days."

  # --- Nonforfeiture paid-up pool reduction (Rule 9 conserved-quantity) -------
  - name: nonforfeiture_pool
    trigger: "On the GRACE -> NONFORFEITURE_PAID_UP premium transition (clock advance past grace_deadline with nonforfeiture vested)"
    algorithm: aggregation
    formula: |
      # Shortened-benefit nonforfeiture: the paid-up pool equals the GREATER of
      # total premiums actually paid and the benefits already paid, capped at the
      # current inflated pool. The reduction removed from the pool is the difference.
      premiums_paid = sum(PremiumInvoice.amount_cents where policy_id == policy.id and status == PAID)
      benefits_paid = BenefitPool.lifetime_paid_cents
      paid_up_pool = min(inflation_growth.inflated_pool_cents_before_reduction,
                         max(premiums_paid, benefits_paid))
      nonforfeiture_reduction_cents = inflation_growth.inflated_pool_cents_before_reduction - paid_up_pool
      # Invariant (Rule 9): paid_up_pool + nonforfeiture_reduction_cents
      #                     == inflated_pool_cents_before_reduction  (pool conserved across the split)
    input_set: "Sum of PAID PremiumInvoice.amount_cents, BenefitPool.lifetime_paid_cents, and the pre-reduction inflated pool."
    constants: {}
    precision: "Integer cents; floored at 0 (reduction is never negative — if max(...) >= pool, reduction = 0)."

  # --- Partnership asset disregard (Rule 1 second domain; Rule 9 second qty) --
  - name: partnership_disregard
    trigger: "On POST /claims/{id}/approve (after lifetime_paid_cents recompute) while PartnershipDisregard.disregard_status == ACCRUING"
    algorithm: aggregation
    formula: |
      # Dollar-for-dollar model: every cent of LTC benefit paid out under a
      # state-qualified partnership policy shields an equal cent of the insured's
      # assets from Medicaid spend-down.
      if policy.is_partnership_policy and disregard_status == ACCRUING:
          protected_asset_cents = BenefitPool.lifetime_paid_cents
      # Invariant (Rule 9): protected_asset_cents == BenefitPool.lifetime_paid_cents
      #                     at all times while ACCRUING (asset shield tracks dollars paid).
    input_set: "BenefitPool.lifetime_paid_cents for the policy; only while is_partnership_policy and disregard_status == ACCRUING."
    constants: {}
    precision: "Integer cents; exactly equals lifetime_paid_cents (1:1)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right in the path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id"
  - priority: 4
    category: business_constraint
    check: "Request body matches the endpoint input schema: required fields present, enums in range, integers non-negative where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2 from: clause)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_referential
    check: "On POST /care-plans/{id}/activate and /claims/{id}/start-review: the CarePlan's care_setting is compatible with the Provider.provider_type per the compatibility table"
    error_id: ERR_CARE_SETTING_MISMATCH
    http_status: 422
    applies_to: "POST /care-plans/{id}/activate"
  - priority: 7
    category: business_referential
    check: "On POST /care-plans/{id}/activate and /claims/{id}/start-review: the referenced Provider.eligibility_status == ELIGIBLE"
    error_id: ERR_PROVIDER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /care-plans/{id}/activate, POST /claims/{id}/start-review"
  - priority: 8
    category: business_safety
    check: "On POST /claims/{id}/approve and POST /claims (open) and waive-premium: policy.benefits_triggered == true (latest BenefitTriggerCertification CERTIFIED)"
    error_id: ERR_BENEFITS_NOT_TRIGGERED
    http_status: 409
    applies_to: "POST /claims, POST /claims/{id}/approve, POST /claims/{id}/resume-review, POST /policies/{id}/waive-premium"
  - priority: 9
    category: business_temporal
    check: "On POST /claims (open): policy.premium_status IN {PAID_CURRENT, WAIVED, NONFORFEITURE_PAID_UP} (premium must be current to open a claim)"
    error_id: ERR_PREMIUM_NOT_CURRENT
    http_status: 409
    applies_to: "POST /claims"
  - priority: 10
    category: business_temporal
    check: "On POST /premium-invoices/{id}/pay within GRACE: current clock <= invoice.grace_deadline"
    error_id: ERR_GRACE_EXPIRED
    http_status: 409
    applies_to: "POST /premium-invoices/{id}/pay"
  - priority: 11
    category: business_constraint
    check: "On POST /claims and POST /claim-lines: service_month / service_date is unique per policy / per claim respectively (no duplicate billing of the same day or month)"
    error_id: ERR_DUPLICATE_SERVICE_PERIOD
    http_status: 409
    applies_to: "POST /claims, POST /claims/{id}/lines"
  - priority: 12
    category: business_temporal
    check: "On POST /claims/{id}/lines: service_date falls within the claim's service_month (YYYY-MM prefix match)"
    error_id: ERR_SERVICE_DATE_OUT_OF_MONTH
    http_status: 422
    applies_to: "POST /claims/{id}/lines"
  - priority: 13
    category: business_fiscal
    check: "On POST /claims/{id}/approve: BenefitPool.remaining_pool_cents > 0 before applying payout"
    error_id: ERR_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /claims/{id}/approve"
  - priority: 14
    category: state
    check: "On any OCC-guarded write (POST /claims, POST /claims/{id}/approve, /deny, POST /rate-filings/{id}/adjudicate): expected_policy_version matches current Policy.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /claims, POST /claims/{id}/approve, POST /claims/{id}/deny, POST /rate-filings/{id}/adjudicate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Policyholder -----------------------------------------------------------
  - { method: POST, path: "/policyholders", description: "Register an insured person", roles: [Underwriter], code: 201,
      input: [full_name, state_code, date_of_birth, "medicaid_state_eligible?"], output: Policyholder, side_effects: [] }
  - { method: GET, path: "/policyholders/{id}", description: "Read a policyholder", roles: [Underwriter, ClaimsExaminer, Policyholder], code: 200,
      input: [], output: Policyholder, side_effects: [] }

  # --- Policy -----------------------------------------------------------------
  - { method: POST, path: "/policies", description: "Create a policy application (coverage APPLIED, premium PENDING)", roles: [Underwriter], code: 201,
      input: [policyholder_id, product_mode, daily_benefit_max_cents, monthly_benefit_max_cents, initial_pool_cents, inflation_rider, elimination_period_days, "is_partnership_policy?"], output: Policy,
      side_effects: ["If is_partnership_policy: create PartnershipDisregard (ACCRUING, protected_asset_cents=0)"] }
  - { method: GET, path: "/policies", description: "List policies (filterable by policyholder_id)", roles: [Underwriter, ClaimsExaminer, Regulator], code: 200,
      input: ["policyholder_id?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: GET, path: "/policies/{id}", description: "Read a policy with computed inflated maxima, benefits_triggered, elimination_days_satisfied", roles: [Underwriter, ClaimsExaminer, Regulator, Policyholder], code: 200,
      input: [], output: Policy, side_effects: [] }
  - { method: POST, path: "/policies/{id}/issue", description: "Issue an APPLIED policy into force; creates the BenefitPool", roles: [Underwriter], code: 200,
      input: [], output: Policy, side_effects: ["coverage_status APPLIED->IN_FORCE", "create BenefitPool", "increments Policy.version by 1"] }
  - { method: POST, path: "/policies/{id}/rescind", description: "Rescind an APPLIED policy", roles: [Underwriter], code: 200,
      input: [], output: Policy, side_effects: ["coverage_status APPLIED->RESCINDED", "increments Policy.version by 1"] }
  - { method: POST, path: "/policies/{id}/apply-anniversary", description: "Advance one inflation year (inflation_years_elapsed += 1) and append an INFLATION_GROWTH ledger entry", roles: [Underwriter], code: 200,
      input: [], output: Policy, side_effects: ["inflation_years_elapsed += 1", "recompute inflated maxima & pool", "append INFLATION_GROWTH BenefitLedgerEntry", "increments Policy.version by 1"] }
  - { method: POST, path: "/policies/{id}/waive-premium", description: "Waive premium once benefits are triggered and on claim", roles: [ClaimsExaminer], code: 200,
      input: [], output: Policy, side_effects: ["premium_status PAID_CURRENT->WAIVED", "all OPEN PremiumInvoice -> WAIVED"] }

  # --- BenefitPool ------------------------------------------------------------
  - { method: GET, path: "/policies/{id}/benefit-pool", description: "Read the policy's benefit pool ledger (reverse-reachability for BenefitPool.policy_id)", roles: [Underwriter, ClaimsExaminer, Regulator, Policyholder], code: 200,
      input: [], output: "BenefitPool[]", side_effects: [] }
  - { method: GET, path: "/policies/{id}/ledger-entries", description: "List BenefitLedgerEntry rows for the policy (reverse-reachability for BenefitLedgerEntry.policy_id)", roles: [Underwriter, ClaimsExaminer, Regulator], code: 200,
      input: ["limit?", "offset?"], output: "BenefitLedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/ledger-entries/{id}", description: "Read a single benefit-ledger entry", roles: [Underwriter, ClaimsExaminer, Regulator], code: 200,
      input: [], output: BenefitLedgerEntry, side_effects: [] }
  - { method: GET, path: "/ledger-entries", description: "List benefit-ledger entries, filterable by policy_id and claim_id (reverse-reachability for BenefitLedgerEntry.claim_id and BenefitLedgerEntry.policy_id)", roles: [Underwriter, ClaimsExaminer, Regulator], code: 200,
      input: ["policy_id?", "claim_id?", "limit?", "offset?"], output: "BenefitLedgerEntry[]", side_effects: [] }

  # --- PartnershipDisregard ---------------------------------------------------
  - { method: GET, path: "/policies/{id}/partnership-disregard", description: "Read the partnership asset-disregard accrual (reverse-reachability for PartnershipDisregard.policy_id)", roles: [Underwriter, Regulator, Policyholder], code: 200,
      input: [], output: "PartnershipDisregard[]", side_effects: [] }

  # --- PremiumInvoice ---------------------------------------------------------
  - { method: POST, path: "/policies/{id}/premium-invoices", description: "Generate a premium invoice for a billing period (amount via calc premium_amount)", roles: [Underwriter], code: 201,
      input: [period_index, base_premium_cents, due_date, grace_deadline], output: PremiumInvoice, side_effects: ["amount_cents computed via premium_amount"] }
  - { method: GET, path: "/premium-invoices", description: "List premium invoices, filterable by policy_id (reverse-reachability for PremiumInvoice.policy_id)", roles: [Underwriter, ClaimsExaminer, Policyholder], code: 200,
      input: ["policy_id?", "limit?", "offset?"], output: "PremiumInvoice[]", side_effects: [] }
  - { method: GET, path: "/premium-invoices/{id}", description: "Read a premium invoice", roles: [Underwriter, ClaimsExaminer, Policyholder], code: 200,
      input: [], output: PremiumInvoice, side_effects: [] }
  - { method: POST, path: "/premium-invoices/{id}/pay", description: "Pay a premium invoice (sets premium axis PAID_CURRENT / returns from GRACE)", roles: [Policyholder], code: 200,
      input: [], output: PremiumInvoice, side_effects: ["invoice.status=PAID", "premium_status PENDING/GRACE -> PAID_CURRENT"] }

  # --- RateIncreaseFiling -----------------------------------------------------
  - { method: POST, path: "/rate-filings", description: "Carrier files a premium rate increase against a policy", roles: [Underwriter], code: 201,
      input: [policy_id, requested_increase_pct, effective_period_index], output: RateIncreaseFiling, side_effects: [] }
  - { method: GET, path: "/rate-filings", description: "List rate filings, filterable by policy_id (reverse-reachability for RateIncreaseFiling.policy_id)", roles: [Underwriter, Regulator], code: 200,
      input: ["policy_id?", "limit?", "offset?"], output: "RateIncreaseFiling[]", side_effects: [] }
  - { method: GET, path: "/rate-filings/{id}", description: "Read a rate filing", roles: [Underwriter, Regulator], code: 200,
      input: [], output: RateIncreaseFiling, side_effects: [] }
  - { method: POST, path: "/rate-filings/{id}/adjudicate", description: "Regulator approves/partially-approves/rejects a filing (branching); OCC on Policy.version", roles: [Regulator], code: 200,
      input: [granted_pct, expected_policy_version], output: RateIncreaseFiling,
      side_effects: ["FILED->APPROVED/PARTIALLY_APPROVED/REJECTED", "on approval recompute OPEN invoices >= effective_period_index", "increments Policy.version by 1"] }
  - { method: POST, path: "/rate-filings/{id}/withdraw", description: "Carrier withdraws a filed rate filing", roles: [Underwriter], code: 200,
      input: [], output: RateIncreaseFiling, side_effects: ["FILED->WITHDRAWN"] }

  # --- BenefitTriggerCertification --------------------------------------------
  - { method: POST, path: "/policies/{id}/trigger-certifications", description: "Record a 2-of-6 ADL/cognitive assessment; decision computed via benefit_trigger_decision", roles: [CareAssessor], code: 201,
      input: [adl_deficiencies, "cognitive_impairment?", "supersedes_id?"], output: BenefitTriggerCertification, side_effects: ["decision computed", "policy.benefits_triggered recomputed from latest certification"] }
  - { method: GET, path: "/policies/{id}/trigger-certifications", description: "List certifications for a policy, newest first (reverse-reachability for BenefitTriggerCertification.policy_id)", roles: [CareAssessor, ClaimsExaminer, Underwriter], code: 200,
      input: ["limit?", "offset?"], output: "BenefitTriggerCertification[]", side_effects: [] }
  - { method: GET, path: "/trigger-certifications/{id}", description: "Read a single trigger certification", roles: [CareAssessor, ClaimsExaminer, Underwriter], code: 200,
      input: [], output: BenefitTriggerCertification, side_effects: [] }
  - { method: GET, path: "/trigger-certifications", description: "List certifications filterable by policy_id and supersedes_id (reverse-reachability for BenefitTriggerCertification.supersedes_id and BenefitTriggerCertification.policy_id)", roles: [CareAssessor, ClaimsExaminer], code: 200,
      input: ["policy_id?", "supersedes_id?", "limit?", "offset?"], output: "BenefitTriggerCertification[]", side_effects: [] }

  # --- Provider ---------------------------------------------------------------
  - { method: POST, path: "/providers", description: "Register a care provider (eligibility PENDING)", roles: [CareAssessor], code: 201,
      input: [name, provider_type, state_code, "license_active?"], output: Provider, side_effects: [] }
  - { method: GET, path: "/providers/{id}", description: "Read a provider", roles: [CareAssessor, ClaimsExaminer, Underwriter], code: 200,
      input: [], output: Provider, side_effects: [] }
  - { method: POST, path: "/providers/{id}/certify", description: "Certify a provider ELIGIBLE (from PENDING or SUSPENDED)", roles: [CareAssessor], code: 200,
      input: [], output: Provider, side_effects: ["eligibility_status -> ELIGIBLE"] }
  - { method: POST, path: "/providers/{id}/reject", description: "Reject a PENDING provider", roles: [CareAssessor], code: 200,
      input: [], output: Provider, side_effects: ["eligibility_status -> INELIGIBLE"] }
  - { method: POST, path: "/providers/{id}/suspend", description: "Suspend an ELIGIBLE provider; cascades to its ACTIVE care plans and their open claims", roles: [CareAssessor], code: 200,
      input: [], output: Provider, side_effects: ["eligibility_status -> SUSPENDED", "ACTIVE CarePlans of this provider -> CLOSED", "their non-terminal Claims -> VOID"] }

  # --- CarePlan ---------------------------------------------------------------
  - { method: POST, path: "/care-plans", description: "Author a plan of care (DRAFT)", roles: [CareAssessor], code: 201,
      input: [policy_id, provider_id, care_setting], output: CarePlan, side_effects: [] }
  - { method: GET, path: "/care-plans", description: "List care plans, filterable by policy_id and provider_id (reverse-reachability for CarePlan.policy_id and CarePlan.provider_id)", roles: [CareAssessor, ClaimsExaminer, Underwriter], code: 200,
      input: ["policy_id?", "provider_id?", "limit?", "offset?"], output: "CarePlan[]", side_effects: [] }
  - { method: GET, path: "/care-plans/{id}", description: "Read a care plan", roles: [CareAssessor, ClaimsExaminer, Underwriter], code: 200,
      input: [], output: CarePlan, side_effects: [] }
  - { method: POST, path: "/care-plans/{id}/activate", description: "Activate a DRAFT plan; supersedes any other ACTIVE plan for the policy", roles: [CareAssessor], code: 200,
      input: [], output: CarePlan, side_effects: ["status DRAFT->ACTIVE", "other ACTIVE plan for policy -> SUPERSEDED"] }
  - { method: POST, path: "/care-plans/{id}/close", description: "Close an ACTIVE plan", roles: [CareAssessor], code: 200,
      input: [], output: CarePlan, side_effects: ["status ACTIVE->CLOSED"] }

  # --- Claim & ClaimLine ------------------------------------------------------
  - { method: POST, path: "/claims", description: "Open a claim for a service month against an active care plan; OCC on Policy.version", roles: [ClaimsExaminer], code: 201,
      input: [policy_id, care_plan_id, service_month, expected_policy_version], output: Claim,
      side_effects: ["coverage_status IN_FORCE->CLAIM_OPEN (first open claim)", "increments Policy.version by 1"] }
  - { method: GET, path: "/claims", description: "List claims, filterable by policy_id and care_plan_id (reverse-reachability for Claim.policy_id and Claim.care_plan_id)", roles: [ClaimsExaminer, Underwriter], code: 200,
      input: ["policy_id?", "care_plan_id?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/claims/{id}", description: "Read a claim", roles: [ClaimsExaminer, Underwriter, Policyholder], code: 200,
      input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/claims/{id}/lines", description: "Add a service-day line to a SUBMITTED claim", roles: [ClaimsExaminer], code: 201,
      input: [service_date, billed_charge_cents, "is_qualifying_day?"], output: ClaimLine, side_effects: [] }
  - { method: GET, path: "/claims/{id}/lines", description: "List the claim's service-day lines (reverse-reachability for ClaimLine.claim_id)", roles: [ClaimsExaminer, Underwriter], code: 200,
      input: ["limit?", "offset?"], output: "ClaimLine[]", side_effects: [] }
  - { method: POST, path: "/claims/{id}/start-review", description: "Move a SUBMITTED claim to UNDER_REVIEW (checks care plan & provider)", roles: [ClaimsExaminer], code: 200,
      input: [], output: Claim, side_effects: ["status SUBMITTED->UNDER_REVIEW"] }
  - { method: POST, path: "/claims/{id}/request-reassessment", description: "Send an UNDER_REVIEW claim back pending a fresh trigger certification (cycle leg 1)", roles: [ClaimsExaminer], code: 200,
      input: [], output: Claim, side_effects: ["status UNDER_REVIEW->PENDING_REASSESSMENT", "requires_reassessment=true"] }
  - { method: POST, path: "/claims/{id}/resume-review", description: "Return a PENDING_REASSESSMENT claim to UNDER_REVIEW once a newer CERTIFIED certification exists (cycle leg 2)", roles: [ClaimsExaminer], code: 200,
      input: [], output: Claim, side_effects: ["status PENDING_REASSESSMENT->UNDER_REVIEW", "requires_reassessment=false"] }
  - { method: POST, path: "/claims/{id}/approve", description: "Approve an UNDER_REVIEW claim; runs payout calc and the depth-4 pool/partnership cascade; OCC on Policy.version", roles: [ClaimsExaminer], code: 200,
      input: [expected_policy_version], output: Claim,
      side_effects: ["status UNDER_REVIEW->APPROVED", "run claim_benefit_payout", "append CLAIM_PAYMENT ledger entry", "recompute pool & elimination_days_satisfied", "recompute partnership disregard", "auto-EXHAUST + VOID siblings if pool hits 0", "increments Policy.version by 1"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny an UNDER_REVIEW claim; OCC on Policy.version", roles: [ClaimsExaminer], code: 200,
      input: [expected_policy_version], output: Claim,
      side_effects: ["status UNDER_REVIEW->DENIED", "coverage back to IN_FORCE if no other non-terminal claim", "increments Policy.version by 1"] }

  # --- Test-driving clock -----------------------------------------------------
  - { method: POST, path: "/_clock/advance_to", description: "Advance the deterministic system clock to an ISO 8601 instant; drives premium GRACE/LAPSED/NONFORFEITURE auto-transitions for all policies with OPEN invoices passing due/grace dates", roles: [Underwriter], code: 200,
      input: [to_iso8601], output: null,
      side_effects: ["For every OPEN PremiumInvoice whose due_date < clock <= grace_deadline: premium_status PAID_CURRENT->GRACE", "For every OPEN PremiumInvoice whose grace_deadline < clock: invoice DEFAULTED and premium_status GRACE->LAPSED or ->NONFORFEITURE_PAID_UP per nonforfeiture vesting (cascade into BenefitPool & PartnershipDisregard)"] }
  - { method: GET, path: "/_clock", description: "Read the current deterministic clock value", roles: [Underwriter, ClaimsExaminer, Regulator, Policyholder, CareAssessor], code: 200,
      input: [], output: "{ now_iso8601: string }", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Body fails schema: missing required field, unknown enum, negative where non-negative required, or granted_pct out of [0, requested] on adjudicate" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_policy_version does not match the current Policy.version (OCC)" }
  - { id: ERR_CARE_SETTING_MISMATCH, http: 422, condition: "CarePlan.care_setting incompatible with the referenced Provider.provider_type" }
  - { id: ERR_PROVIDER_NOT_ELIGIBLE, http: 409, condition: "Referenced Provider.eligibility_status is not ELIGIBLE when activation/review requires it" }
  - { id: ERR_PROVIDER_LICENSE_INACTIVE, http: 409, condition: "Attempt to certify a provider whose license_active is false" }
  - { id: ERR_BENEFITS_NOT_TRIGGERED, http: 409, condition: "policy.benefits_triggered is false (no current CERTIFIED 2-of-6 / cognitive certification) when an operation requires it" }
  - { id: ERR_PREMIUM_NOT_CURRENT, http: 409, condition: "Opening a claim while premium_status not in {PAID_CURRENT, WAIVED, NONFORFEITURE_PAID_UP}" }
  - { id: ERR_INVOICE_NOT_OPEN, http: 409, condition: "Paying a PremiumInvoice whose status is not OPEN" }
  - { id: ERR_GRACE_EXPIRED, http: 409, condition: "Paying a premium after the clock passed the invoice's grace_deadline" }
  - { id: ERR_DUPLICATE_SERVICE_PERIOD, http: 409, condition: "service_month already claimed for the policy, or service_date already lined on the claim" }
  - { id: ERR_SERVICE_DATE_OUT_OF_MONTH, http: 422, condition: "ClaimLine.service_date is not within the claim's service_month" }
  - { id: ERR_POOL_EXHAUSTED, http: 409, condition: "Approving a claim when BenefitPool.remaining_pool_cents is already 0" }
  - { id: ERR_CARE_PLAN_NOT_ACTIVE, http: 409, condition: "Starting review when the claim's CarePlan.status is not ACTIVE" }
  - { id: ERR_RATE_FILING_PENDING, http: 409, condition: "Filing a new rate increase while another FILED filing exists for the same policy" }
  - { id: ERR_ANNIVERSARY_NOT_IN_FORCE, http: 409, condition: "Applying an inflation anniversary to a policy not in coverage_status IN {IN_FORCE, CLAIM_OPEN}" }
  - { id: ERR_VALIDATION_CONFLICT, http: 422, condition: "Reserved: malformed pagination params (limit/offset out of bounds)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Carrier underwriting/admin: creates policyholders, policies, issues/rescinds, files & withdraws rate increases, generates premium invoices, applies anniversaries, advances the clock."
    identity: opaque
    exclusive_operations:
      - "POST /policyholders"
      - "POST /policies"
      - "POST /policies/{id}/issue"
      - "POST /policies/{id}/rescind"
      - "POST /policies/{id}/apply-anniversary"
      - "POST /policies/{id}/premium-invoices"
      - "POST /rate-filings"
      - "POST /rate-filings/{id}/withdraw"
      - "POST /_clock/advance_to"
    shared_operations:
      - "GET /policies, GET /policies/{id}, GET /policyholders/{id}, GET /benefit-pool, GET /ledger-entries, GET /premium-invoices, GET /rate-filings, GET /claims, GET /care-plans, GET /providers/{id}, GET /trigger-certifications, GET /_clock"

  - name: ClaimsExaminer
    description: "Adjudicates claims: opens, reviews, requests/resumes reassessment, approves/denies, waives premium when on claim."
    identity: opaque
    exclusive_operations:
      - "POST /claims"
      - "POST /claims/{id}/lines"
      - "POST /claims/{id}/start-review"
      - "POST /claims/{id}/request-reassessment"
      - "POST /claims/{id}/resume-review"
      - "POST /claims/{id}/approve"
      - "POST /claims/{id}/deny"
      - "POST /policies/{id}/waive-premium"
    shared_operations:
      - "GET /claims, GET /claims/{id}, GET /claims/{id}/lines, GET /policies/{id}, GET /benefit-pool, GET /trigger-certifications, GET /care-plans, GET /premium-invoices, GET /_clock"

  - name: CareAssessor
    description: "Clinical/eligibility authority: records 2-of-6 trigger certifications, registers/certifies/suspends providers, authors and activates care plans."
    identity: opaque
    exclusive_operations:
      - "POST /policies/{id}/trigger-certifications"
      - "POST /providers"
      - "POST /providers/{id}/certify"
      - "POST /providers/{id}/reject"
      - "POST /providers/{id}/suspend"
      - "POST /care-plans"
      - "POST /care-plans/{id}/activate"
      - "POST /care-plans/{id}/close"
    shared_operations:
      - "GET /providers/{id}, GET /care-plans, GET /trigger-certifications, GET /_clock"

  - name: Regulator
    description: "State insurance regulator: adjudicates rate-increase filings."
    identity: opaque
    exclusive_operations:
      - "POST /rate-filings/{id}/adjudicate"
    shared_operations:
      - "GET /policies, GET /policies/{id}, GET /rate-filings, GET /rate-filings/{id}, GET /benefit-pool, GET /ledger-entries, GET /partnership-disregard, GET /_clock"

  - name: Policyholder
    description: "The insured: reads own policy, pays premium invoices."
    identity: "entity_backed:Policyholder"
    exclusive_operations:
      - "POST /premium-invoices/{id}/pay"
    shared_operations:
      - "GET /policies/{id}, GET /policyholders/{id}, GET /benefit-pool, GET /partnership-disregard, GET /premium-invoices, GET /premium-invoices/{id}, GET /claims/{id}, GET /_clock"
