            - "ProductionOrder.${po_id}.status == \"COMPLETED\" (unchanged)"
            - "ProductionOrder.${po_id}.completed_qty == 1 (unchanged)"
            - "ProductionOrder.${po_id}.version == ${po_v_done} (unchanged)"
