              captures: { r3_id: "$.data.id" }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "CUT", requested_length_ft: 300, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${q_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { so_id: "$.data.id", so_v1: "$.data.version" }
            - call: "GET /order-lines"
              payload: { sales_order_id: "${so_id}" }
              as: PlatformAdmin
              captures: { ol_id: "$.data[0].id" }
            - call: "POST /sales-orders/${so_id}/allocate"
              payload: { allocation_policy: "MINIMIZE_REMNANT", expected_sales_order_version: "${so_v1}" }
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "GET /allocations"
              payload: { order_line_id: "${ol_id}" }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { a1_id: "$.data[0].id" }
          trigger:
            - call: "POST /sales-orders/${so_id}/release-allocations"
              as: BranchOps
              as_user_id: "${br_id}"
          assert:
            - "Reel.${r1_id}.current_length_ft == 400 and Reel.${r1_id}.allocated_length_ft == 0 and Reel.${r1_id}.available_length_ft == 400 and Reel.${r1_id}.status == IN_STOCK"
            - "Reel.${r2_id}.available_length_ft == 1000 and Reel.${r2_id}.status == IN_STOCK"
            - "Reel.${r3_id}.available_length_ft == 250 and Reel.${r3_id}.status == IN_STOCK"
            - "SUM of available_length_ft over the branch's IN_STOCK and ALLOCATED_PARTIAL P1 reels == 1650, the same value as before the allocate"
            - "Branch.${br_id}.scrap_ft_ytd == 0"
            - "Allocation.${a1_id}.status == RELEASED"
            - "OrderLine.${ol_id}.allocated_length_ft == 0 and OrderLine.${ol_id}.allocation_status == UNALLOCATED"
            - "SalesOrder.${so_id}.fulfillment_status == PENDING_ALLOCATION"

      - name: customer_deposit_liability_conserved_across_deliver_and_return
        grounds:
          - calculations.reel_deposit_credit
          - entities.Customer.fields.deposit_liability_cents
          - entities.SalesOrder.fields.deposit_charged_cents
          - entities.SalesOrder.fields.deposit_credited_cents
          - state_machines.Reel.ALLOCATED_PARTIAL_to_ON_JOBSITE
        distinguishing_aspect: |
          Conserved quantity of type MONEY (cents): Customer.deposit_liability_cents
          is 0 before delivery, rises to 25000 when two returnable master reels
          ship, and returns to exactly 0 after both compensating returns, while
          open_balance_cents comes back to the invoiced total 131625 with no drift.
        test_recipe:
          setup:
            - "One branch, one customer with a 5,000,000-cent limit, product P1, index CI1, one boom-lift truck and two untouched 2500 ft master reels."
            - "A single MASTER_REEL line of 5000 ft (reel_count 2) is quoted, issued, converted, allocated to both master reels and picked twice, so the order stages with deposit_cents_total 25000."
            - "The run is dispatched and delivered at the default clock, charging 25000 cents of deposit and invoicing 131625 cents; the clock is then moved to 2026-08-15T00:00:00Z, well inside the 60-day window."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /customers"
              payload: { name: "Gulf Electric", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /copper-index-entries"
              payload: { effective_date: "2026-07-30", price_cents_per_lb: 450 }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { branch_id: "${br_id}", truck_code: "T-BOOM", has_boom_lift: true, max_reel_slots: 4 }
              as: PlatformAdmin
              captures: { tr_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "L1", nominal_length_ft: 2500 }
              as: PlatformAdmin
              captures: { rm1_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "L1", nominal_length_ft: 2500 }
              as: PlatformAdmin
              captures: { rm2_id: "$.data.id" }
            - call: "POST /quotes"
              payload: { customer_id: "${cust_id}", branch_id: "${br_id}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { q_id: "$.data.id", q_v1: "$.data.version" }
            - call: "POST /quotes/${q_id}/lines"
              payload: { product_id: "${p1_id}", put_up: "MASTER_REEL", requested_length_ft: 5000, parallel_set_size: 1, expected_quote_version: "${q_v1}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ql_id: "$.data.id" }
            - call: "POST /quotes/${q_id}/issue"
              as: SalesRep
              as_user_id: "rep-2"
            - call: "POST /quotes/${q_id}/convert"
              as: SalesRep
              as_user_id: "rep-2"
              captures: { so_id: "$.data.id", so_v1: "$.data.version" }
            - call: "GET /order-lines"
              payload: { sales_order_id: "${so_id}" }
              as: PlatformAdmin
              captures: { ol_id: "$.data[0].id" }
            - call: "POST /sales-orders/${so_id}/allocate"
              payload: { allocation_policy: "MINIMIZE_REMNANT", expected_sales_order_version: "${so_v1}" }
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "GET /allocations"
              payload: { order_line_id: "${ol_id}" }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { a1_id: "$.data[0].id", a2_id: "$.data[1].id" }
            - call: "POST /allocations/${a1_id}/pick"
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "POST /allocations/${a2_id}/pick"
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "POST /delivery-runs"
              payload: { sales_order_id: "${so_id}", truck_id: "${tr_id}", window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T10:00:00Z", jobsite_address: "9 Ship Channel", jobsite_has_forklift: false }
              as: BranchOps
              as_user_id: "${br_id}"
              captures: { run_id: "$.data.id" }
            - call: "POST /delivery-runs/${run_id}/dispatch"
              as: Driver
              as_user_id: "${tr_id}"
            - call: "POST /delivery-runs/${run_id}/deliver"
              as: Driver
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /order-lines/${ol_id}/return"
              payload: { reel_id: "${rm1_id}", condition: "GOOD" }
              as: BranchOps
              as_user_id: "${br_id}"
            - call: "POST /order-lines/${ol_id}/return"
              payload: { reel_id: "${rm2_id}", condition: "GOOD" }
              as: BranchOps
              as_user_id: "${br_id}"
          assert:
            - "QuoteLine.${ql_id}.reel_count == 2"
            - "QuoteLine.${ql_id}.deposit_cents_total == 25000"
            - "QuoteLine.${ql_id}.quoted_extended_cents == 118125"
            - "SalesOrder.${so_id}.quoted_total_cents == 131625"
            - "SalesOrder.${so_id}.invoiced_total_cents == 131625"
            - "SalesOrder.${so_id}.deposit_charged_cents == 25000"
            - "SalesOrder.${so_id}.deposit_credited_cents == 25000"
            - "SalesOrder.${so_id}.billing_status == CREDITED"
            - "Customer.${cust_id}.deposit_liability_cents == 0"
            - "Customer.${cust_id}.open_balance_cents == 131625"
            - "Reel.${rm1_id}.status == IN_STOCK and Reel.${rm1_id}.delivered_sales_order_id == ${so_id} and Reel.${rm1_id}.delivered_at is null"
            - "Reel.${rm2_id}.status == IN_STOCK and Reel.${rm2_id}.current_length_ft == 2500"
