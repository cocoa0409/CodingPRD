              as: QualityAssurancePharmacist
              captures: { qc1_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/record"
              payload: { measured_value: 100 }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "VISUAL_INSPECTION" }
