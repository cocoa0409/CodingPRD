# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not authorized for this endpoint" }
  # --- existence ---
  - { id: ERR_DEAL_NOT_FOUND, http: 404, condition: "Deal id does not exist" }
  - { id: ERR_TENANT_NOT_FOUND, http: 404, condition: "Tenant id does not exist" }
  - { id: ERR_PROPERTY_NOT_FOUND, http: 404, condition: "Property id does not exist within deal" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "Lease id does not exist within property" }
  - { id: ERR_MODEL_NOT_FOUND, http: 404, condition: "UnderwritingModel id does not exist within deal" }
  - { id: ERR_PSA_NOT_FOUND, http: 404, condition: "PurchaseAgreement id does not exist within deal" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "Milestone id does not exist within deal" }
  - { id: ERR_TITLE_REVIEW_NOT_FOUND, http: 404, condition: "TitleReview id does not exist within deal" }
  - { id: ERR_EXCEPTION_NOT_FOUND, http: 404, condition: "TitleException id does not exist within review" }
  - { id: ERR_EA_NOT_FOUND, http: 404, condition: "EnvironmentalAssessment id does not exist within deal" }
  - { id: ERR_PCA_NOT_FOUND, http: 404, condition: "PropertyConditionAssessment id does not exist within deal" }
  - { id: ERR_ESTOPPEL_NOT_FOUND, http: 404, condition: "EstoppelCertificate id does not exist within deal" }
  - { id: ERR_SNDA_NOT_FOUND, http: 404, condition: "SNDA id does not exist within deal" }
  - { id: ERR_FINANCING_NOT_FOUND, http: 404, condition: "FinancingApplication id does not exist within deal" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "ClosingStatement id does not exist within deal" }
  - { id: ERR_PRORATION_NOT_FOUND, http: 404, condition: "Proration id does not exist within statement" }
  - { id: ERR_TRUE_UP_NOT_FOUND, http: 404, condition: "TrueUpAdjustment id does not exist within statement" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 422, condition: "Body FK (tenant_id, lease_id, etc.) references a non-existent resource" }
  # --- state ---
  - { id: ERR_DEAL_INVALID_STATE, http: 409, condition: "Deal not in required from-state for transition" }
  - { id: ERR_MODEL_INVALID_STATE, http: 409, condition: "UnderwritingModel not in required from-state" }
  - { id: ERR_PSA_NOT_EXECUTABLE, http: 409, condition: "PSA not in DRAFT at execute" }
  - { id: ERR_TITLE_REVIEW_INVALID_STATE, http: 409, condition: "TitleReview not in required from-state" }
  - { id: ERR_EXCEPTION_INVALID_STATE, http: 409, condition: "TitleException not in required from-state" }
  - { id: ERR_EA_INVALID_STATE, http: 409, condition: "EnvironmentalAssessment not in required from-state" }
  - { id: ERR_PCA_INVALID_STATE, http: 409, condition: "PCA not in required from-state" }
  - { id: ERR_ESTOPPEL_INVALID_STATE, http: 409, condition: "Estoppel not in required from-state" }
  - { id: ERR_SNDA_INVALID_STATE, http: 409, condition: "SNDA not in required from-state" }
  - { id: ERR_FINANCING_INVALID_STATE, http: 409, condition: "FinancingApplication not in required from-state" }
  - { id: ERR_STATEMENT_INVALID_STATE, http: 409, condition: "ClosingStatement not in required from-state" }
  - { id: ERR_TRUE_UP_INVALID_STATE, http: 409, condition: "TrueUpAdjustment not in required from-state" }
  - { id: ERR_MILESTONE_INVALID_STATE, http: 409, condition: "Milestone not in required from-state" }
  - { id: ERR_LEASE_INVALID_STATE, http: 409, condition: "Lease not in required from-state" }
  - { id: ERR_PROPERTY_INVALID_STATE, http: 409, condition: "Property not in required from-state" }
  - { id: ERR_TENANT_CREDIT_INVALID_STATE, http: 409, condition: "Tenant credit_assessment_status not in required from-state" }
  # --- OCC ---
  - { id: ERR_STALE_DEAL_VERSION, http: 412, condition: "expected_deal_version does not match deal.version" }
  - { id: ERR_STALE_PSA_VERSION, http: 412, condition: "expected_psa_version does not match psa.version" }
  # --- business safety ---
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties violated (approver == submitter/proposer/issuer)" }
  - { id: ERR_TENANT_CREDIT_NOT_APPROVED, http: 422, condition: "Tenant credit_assessment_status != APPROVED at lease verify" }
  - { id: ERR_RELIANCE_LETTER_REQUIRED, http: 422, condition: "EA receive requires reliance_letter_received == true" }
  - { id: ERR_REC_PRESENT, http: 422, condition: "EA plain-clear blocked because recognized_environmental_condition == true" }
  - { id: ERR_FATAL_NOT_WAIVABLE, http: 422, condition: "FATAL title exception cannot be waived" }
  - { id: ERR_NO_FATAL_EXCEPTION, http: 422, condition: "TitleReview reject requires at least one FATAL exception" }
  - { id: ERR_UNRATED_UNGUARANTEED_TENANT, http: 422, condition: "Tenant with credit_rating UNRATED and is_guaranteed == false cannot be credit-approved" }
  # --- business constraint ---
  - { id: ERR_FIELD_CONSTRAINT_VIOLATION, http: 400, condition: "Field range/format constraint violated (dd_period_days bounds, sqft > 0, dates ordered, etc.)" }
  - { id: ERR_PRICE_MISMATCH, http: 409, condition: "psa_price_cents != deal.purchase_price_cents at execution" }
  - { id: ERR_MILESTONE_DUE_DATE_EXCEEDS_DD, http: 422, condition: "Milestone due_date > deal.dd_period_end" }
  - { id: ERR_MILESTONE_NOT_WAIVABLE, http: 422, condition: "TITLE_REVIEW and ENVIRONMENTAL milestones cannot be waived" }
  - { id: ERR_ESTOPPEL_RENT_MISMATCH, http: 422, condition: "Estoppel confirmed rent deviates > 50 bps from lease rent" }
  - { id: ERR_ESTOPPEL_DEFAULT_DISCLOSED, http: 422, condition: "Estoppel discloses landlord default (default_confirmed == false)" }
  - { id: ERR_SNDA_NON_DISTURBANCE_MISSING, http: 422, condition: "SNDA certify requires non_disturbance_confirmed == true" }
  # --- business fiscal ---
  - { id: ERR_EARNEST_MONEY_INSUFFICIENT, http: 422, condition: "Earnest money < 1% of PSA price" }
  - { id: ERR_LTV_EXCEEDED, http: 422, condition: "loan_amount_cents > 65% of psa_price_cents" }
  - { id: ERR_DSCR_BELOW_MINIMUM, http: 422, condition: "dscr < 1.25 at commitment" }
  - { id: ERR_CAP_RATE_OUT_OF_BAND, http: 422, condition: "cap_rate_bps outside [300, 1200]" }
  - { id: ERR_NOI_NON_POSITIVE, http: 422, condition: "noi_cents <= 0 at model submission" }
  - { id: ERR_CURE_COST_NEEDS_COMMITTEE, http: 422, condition: "MATERIAL/FATAL exception cure_cost > 100000 cents requires committee sign-off" }
  # --- business temporal ---
  - { id: ERR_FINANCING_CONTINGENCY_LAPSED, http: 422, condition: "Commit attempted after financing_contingency_end" }
  - { id: ERR_CLOSING_DATE_BEFORE_EXECUTION, http: 422, condition: "closing_date < psa.executed_at" }
  # --- business referential / gates ---
  - { id: ERR_DEAL_NO_PROPERTY, http: 422, condition: "submit-for-psa requires at least one property" }
  - { id: ERR_NO_APPROVED_UNDERWRITING, http: 422, condition: "submit-for-psa requires an APPROVED underwriting model" }
  - { id: ERR_MILESTONES_OUTSTANDING, http: 422, condition: "certify-clear-to-close blocked by non-terminal milestones" }
  - { id: ERR_FATAL_TITLE_EXCEPTION, http: 422, condition: "certify-clear-to-close blocked by OPEN/CURE_PROPOSED FATAL exception" }
  - { id: ERR_ENVIRONMENTAL_UNRESOLVED, http: 422, condition: "certify-clear-to-close blocked by unresolved EA" }
  - { id: ERR_ESTOPPEL_INCOMPLETE, http: 422, condition: "certify-clear-to-close blocked by uncertified estoppel" }
  - { id: ERR_SNDA_INCOMPLETE, http: 422, condition: "certify-clear-to-close blocked by uncertified SNDA" }
  - { id: ERR_FINANCING_NOT_COMMITTED, http: 422, condition: "certify-clear-to-close blocked by uncommitted financing" }
  - { id: ERR_STALE_UNDERWRITING_MODEL, http: 422, condition: "pinned_underwriting_model_id is no longer the latest APPROVED model" }
  - { id: ERR_DEAL_NOT_CLOSED, http: 422, condition: "finalize-true-up requires deal CLOSED" }
  - { id: ERR_TRUE_UP_PENDING, http: 422, condition: "finalize-true-up blocked by undecided true-up adjustments" }
  - { id: ERR_UNRESOLVED_TITLE_EXCEPTIONS, http: 422, condition: "TitleReview clear requires exception_count == 0" }
  - { id: ERR_NOT_CLEAR_TO_CLOSE, http: 422, condition: "close requires posture == CLEAR_TO_CLOSE" }
  - { id: ERR_CLOSING_STATEMENT_NOT_ACKNOWLEDGED, http: 422, condition: "close requires statement ACKNOWLEDGED" }
  - { id: ERR_PCA_CRITICAL_CONDITION, http: 422, condition: "PCA accept blocked when condition_rating == CRITICAL" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AcquisitionsAnalyst
    description: "Sources and underwrites deals; drafts PSA; verifies leases; acknowledges closing statement"
    identity: "opaque"
    exclusive_operations:
      - "create deal / submit-for-psa / terminate deal"
      - "create property / create lease / verify lease"
      - "create + submit underwriting model"
      - "draft + execute + amend PSA"
      - "acknowledge closing statement"
    shared_operations:
      - "read access to all deal-scoped resources"

  - name: UnderwritingCommittee
    description: "Approves underwriting models and credit; waives milestones/exceptions; certifies clear-to-close; accepts PCA; marks EA conditional"
    identity: "opaque"
    exclusive_operations:
      - "analyze/approve/reject tenant credit"
      - "approve/reject underwriting model (SoD vs submitter)"
      - "waive milestone / waive title exception"
      - "certify-clear-to-close"
      - "accept/reject PCA; mark EA conditional"
    shared_operations:
      - "read access to all deal-scoped resources"

  - name: DueDiligenceOfficer
    description: "Runs title/survey/environmental/PCA workstreams; collects estoppels and SNDAs; drives milestones"
    identity: "opaque"
    exclusive_operations:
      - "create/begin/clear/reject title review; raise/propose-cure/confirm-cure exceptions"
      - "order/receive/clear/fail environmental assessment"
      - "order/receive PCA"
      - "request/receive/certify estoppel; request/receive/certify/reject SNDA"
      - "start/complete milestones; mark property surveyed/clear/flag"
    shared_operations:
      - "read access to all deal-scoped resources"

  - name: CapitalMarketsOfficer
    description: "Manages financing applications and loan assumptions"
    identity: "opaque"
    exclusive_operations:
      - "create/submit/commit/decline/withdraw financing application"
    shared_operations:
      - "read access to deal + financing resources"

  - name: EscrowOfficer
    description: "Issues and finalizes closing statements; approves true-ups (first step); closes deal"
    identity: "opaque"
    exclusive_operations:
      - "issue/reissue/acknowledge-via-analyst closing statement; close deal"
      - "escrow-approve or reject true-up adjustment"
      - "finalize-true-up"
    shared_operations:
      - "read access to closing resources"

  - name: AssetManager
    description: "Proposes post-closing true-up adjustments; second approver (SoD vs proposer is enforced on the approve step)"
    identity: "opaque"
    exclusive_operations:
      - "propose true-up adjustment"
      - "asset-manager-approve true-up adjustment"
    shared_operations:
      - "read access to closing resources"

  - name: PlatformAdmin
    description: "Operational role for logical clock management"
    identity: "opaque"
    exclusive_operations:
      - "set logical clock"
    shared_operations:
      - "read access to all resources"
