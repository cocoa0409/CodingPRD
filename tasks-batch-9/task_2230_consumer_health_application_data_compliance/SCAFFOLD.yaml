    output: ProcessingPurpose[]
    side_effects: []

  - method: POST
    path: "/health-data/element-purpose-mappings"
    description: "Proposes a mapping of one data element to one processing purpose"
    roles: [DataSteward]
    code: 201
    input: [data_element_id, processing_purpose_id, "vendor_id?", disclosure_specificity]
    output: ElementPurposeMapping
    side_effects: ["creates the mapping in PROPOSED", "computes regulated_flag from the referenced DataElement.chd_classification"]
  - method: GET
    path: "/health-data/element-purpose-mappings/{id}"
    description: "Reads one element-purpose mapping"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: ElementPurposeMapping
    side_effects: []
  - method: GET
    path: "/health-data/element-purpose-mappings"
    description: "Lists element-purpose mappings, filterable by element, purpose or vendor"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["data_element_id?", "processing_purpose_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: ElementPurposeMapping[]
    side_effects: []
  - method: POST
    path: "/health-data/element-purpose-mappings/{id}/activate"
    description: "Activates a proposed or suspended mapping"
    roles: [DataSteward]
    code: 200
    input: []
    output: ElementPurposeMapping
    side_effects: ["PROPOSED -> ACTIVE or SUSPENDED -> ACTIVE", "clears suspension_reason", "recomputes regulated_flag"]
  - method: POST
    path: "/health-data/element-purpose-mappings/{id}/suspend"
    description: "Suspends an active mapping"
    roles: [DataSteward]
    code: 200
    input: [suspension_reason]
