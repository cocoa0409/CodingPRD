            - call: "POST /welder-qualifications"
              payload: { welder_stamp: "W-88", welder_name: "Ola Beck", wps_id: "${wps_b}", position_qualified: "1G", thickness_range_max_in: 1.5000, qualified_on: "2026-07-01" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { qual_b: $.data.id }
          assert:
            - "${e_cert} == ERR_DUPLICATE_CERT_NUMBER with HTTP 409"
