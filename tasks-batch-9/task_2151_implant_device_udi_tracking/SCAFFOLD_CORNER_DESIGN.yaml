              as: ReceivingTech
              as_user_id: "rt-01"
              captures: { u1_id: "$.data.id" }
            - call: "POST /udi/lots/${lot_id}/release"
              payload: {}
              as: InventoryLead
              as_user_id: "il-01"
            - call: "POST /udi/patients"
              payload: { mrn: "MRN-1001", display_name: "Pat One", registry_consent: "GRANTED" }
