# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Physician & Provider Recruitment — Expert
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: client_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /clients with all required fields returns 201; net_placement_fee_cents defaults 0, status ACTIVE."
        test_recipe:
          setup: ["One ACCOUNT_MANAGER staff user exists."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
          trigger:
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { cid: "$.data.id" } }
          assert:
            - "response.status == 201"
            - "Client.${cid}.net_placement_fee_cents == 0"
            - "Client.${cid}.status == ACTIVE"

      - name: get_offer_not_found
        claim_type: Not Found
        grounds: [entities.Offer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /offers/{unknown uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no offer with the queried id)."]
          setup_api_calls: []
          trigger:
            - { call: "GET /offers/00000000-0000-4000-8000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_client_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Client, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /clients missing required guarantee_days returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One ACCOUNT_MANAGER exists."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
          trigger:
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000 }, as: AccountManager, as_user_id: "${am_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: offer_sign_on_bonus_defaults_zero
        claim_type: Defaults
        grounds: [entities.Offer.fields.sign_on_bonus_cents, entities.Offer.fields.offered_first_year_comp_cents]
        distinguishing_aspect: "Offer created without sign_on_bonus_cents defaults it to 0; offered_first_year_comp_cents == base_salary_cents 24,000,000."
        test_recipe:
          setup: ["Application INTERVIEWING with a completed site visit."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 24000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SUBMIT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "ADVANCE_TO_INTERVIEW" }, as: ClientContact, as_user_id: "${client_id}" }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_id: "$.data.id" } }
            - { call: "POST /site-visits/${sv_id}/transition", payload: { action: "COMPLETE" }, as: Recruiter, as_user_id: "${rec_id}" }
          trigger:
            - { call: "POST /offers", payload: { application_id: "${app_id}", base_salary_cents: 24000000, start_date: "2026-06-01T00:00:00Z", expires_at: "2026-05-20T00:00:00Z" }, as: AccountManager, as_user_id: "${am_id}", captures: { offer_id: "$.data.id" } }
          assert:
            - "Offer.${offer_id}.sign_on_bonus_cents == 0"
            - "Offer.${offer_id}.offered_first_year_comp_cents == 24000000"

      - name: application_initial_state_sourced
        claim_type: Creation
        grounds: [state_machines.Application, entities.Application.fields.stage]
        distinguishing_aspect: "A freshly created Application starts in stage SOURCED."
        test_recipe:
          setup: ["An OPEN opening and an owned candidate."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
          trigger:
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
          assert:
            - "Application.${app_id}.stage == SOURCED"

  - section: state_machines
    instances:
      - name: offer_accept_from_accepted_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Offer.EXTENDED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second ACCEPT on an already ACCEPTED offer returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An offer already ACCEPTED (application PLACED)."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000, positions_total: 1 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SUBMIT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "ADVANCE_TO_INTERVIEW" }, as: ClientContact, as_user_id: "${client_id}" }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_id: "$.data.id" } }
            - { call: "POST /site-visits/${sv_id}/transition", payload: { action: "COMPLETE" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /offers", payload: { application_id: "${app_id}", base_salary_cents: 24000000, sign_on_bonus_cents: 2500000, start_date: "2026-06-01T00:00:00Z", expires_at: "2026-05-20T00:00:00Z" }, as: AccountManager, as_user_id: "${am_id}", captures: { offer_id: "$.data.id" } }
            - { call: "POST /offers/${offer_id}/transition", payload: { action: "ACCEPT" }, as: Recruiter, as_user_id: "${rec_id}" }
          trigger:
            - { call: "POST /offers/${offer_id}/transition", payload: { action: "ACCEPT" }, as: Recruiter, as_user_id: "${rec_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: interviewer_adjacency_allowed
        claim_type: Valid Transition
        grounds: [calculations.site_visit_overlap_rules, entities.SiteVisit]
        distinguishing_aspect: "Half-open interviewer rule: a second visit starting exactly when the first ends (16:00) is NOT a double-booking; it is created SCHEDULED (201)."
        test_recipe:
          setup: ["Interviewer rec has a SCHEDULED visit 15:00-16:00 for candidate A; a second candidate B exists."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000, positions_total: 2 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr A", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_a: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_a}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_a: "$.data.id" } }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr B", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_b: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_b}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_b: "$.data.id" } }
            - { call: "POST /site-visits", payload: { application_id: "${app_a}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_a: "$.data.id" } }
          trigger:
            - { call: "POST /site-visits", payload: { application_id: "${app_b}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T16:00:00Z", scheduled_end: "2026-05-03T17:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_b: "$.data.id" } }
          assert:
            - "response.status == 201"
            - "SiteVisit.${sv_b}.status == SCHEDULED"

      - name: credential_item_verify_clears_file
        claim_type: Side Effect Execution
        grounds: [state_machines.CredentialItem.SUBMITTED_to_VERIFIED, state_machines.CredentialingFile.IN_PROGRESS_to_CLEARED]
        distinguishing_aspect: "Verifying the sole required credential item bubbles up: CredentialingFile.overall_status becomes CLEARED."
        test_recipe:
          setup: ["Placement PRE_START with its credentialing file; one required STATE_LICENSE item added and SUBMITTED."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "CREDENTIALING_COORDINATOR", full_name: "Cora Coord", email: "coord@x.com" }, as: PlatformAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000, positions_total: 1 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SUBMIT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /applications/${app_id}/advance", payload: { action: "ADVANCE_TO_INTERVIEW" }, as: ClientContact, as_user_id: "${client_id}" }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv_id: "$.data.id" } }
            - { call: "POST /site-visits/${sv_id}/transition", payload: { action: "COMPLETE" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "POST /offers", payload: { application_id: "${app_id}", base_salary_cents: 24000000, sign_on_bonus_cents: 2500000, start_date: "2026-06-01T00:00:00Z", expires_at: "2026-05-20T00:00:00Z" }, as: AccountManager, as_user_id: "${am_id}", captures: { offer_id: "$.data.id" } }
            - { call: "POST /offers/${offer_id}/transition", payload: { action: "ACCEPT" }, as: Recruiter, as_user_id: "${rec_id}" }
            - { call: "GET /placements?offer_id=${offer_id}", payload: {}, as: AccountManager, as_user_id: "${am_id}", captures: { placement_id: "$.data[0].id" } }
            - { call: "GET /credentialing-files?placement_id=${placement_id}", payload: {}, as: CredentialingCoordinator, as_user_id: "${coord_id}", captures: { cfile_id: "$.data[0].id" } }
            - { call: "POST /credentialing-files/${cfile_id}/items", payload: { item_type: "STATE_LICENSE", is_required: true }, as: CredentialingCoordinator, as_user_id: "${coord_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /credential-items/${item_id}/transition", payload: { action: "SUBMIT" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "POST /credential-items/${item_id}/transition", payload: { action: "VERIFY" }, as: CredentialingCoordinator, as_user_id: "${coord_id}" }
            - { call: "GET /credentialing-files/${cfile_id}", payload: {}, as: CredentialingCoordinator, as_user_id: "${coord_id}", captures: { st: "$.data.overall_status" } }
          assert:
            - "CredentialingFile.${cfile_id}.overall_status == CLEARED"

      - name: cancel_booking_covered_by_double_booking
        claim_type: invalid_transition
        grounds: ["errors[ERR_INTERVIEWER_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / interviewer_double_booking_half_open
          rationale: "Interviewer overlap rejection is asserted by the named §1.8 instance."

      - name: candidate_travel_conflict_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_CANDIDATE_TRAVEL_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / candidate_travel_buffer_closed
          rationale: "Candidate travel-buffer rejection is asserted by the named §1.8 instance."

      - name: opening_not_open_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPENING_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / submit_requires_opening_open
          rationale: "SUBMIT-while-ON_HOLD rejection is asserted by the named §1.8 instance."

      - name: credentialing_not_cleared_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDENTIALING_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / onboard_requires_credentialing_cleared
          rationale: "ONBOARD-before-CLEARED rejection is asserted by the named §1.8 instance."

  - section: calculations
    instances:
      - name: match_score_full_match_100
        claim_type: Correct Result
        grounds: [calculations.match_score, entities.Application.fields.match_score]
        distinguishing_aspect: "SCREEN computes match_score = 50(specialty) + 30(geo) + 20(license CA) = 100 when all three factors match."
        test_recipe:
          setup: ["Candidate CARDIOLOGY / home West / licensed CA, opening CARDIOLOGY / region West / region_state CA."]
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /applications/${app_id}/advance", payload: { action: "SCREEN" }, as: Recruiter, as_user_id: "${rec_id}", captures: { ms: "$.data.match_score" } }
          assert:
            - "Application.${app_id}.match_score == 100"

      - name: recruiter_selector_picks_lower_pipeline_load
        claim_type: Correct Result
        grounds: [calculations.recruiter_selector, entities.JobOpening.fields.recruiter_id]
