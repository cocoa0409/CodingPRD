      - name: firm_may_nominate_counterflow_while_interruptible_may_not
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_19_ERR_SEASON_DIRECTION_MISMATCH
          - errors.ERR_SEASON_DIRECTION_MISMATCH
          - entities.StorageField.fields.season
          - entities.StorageContract.fields.service_class
        distinguishing_aspect: |
          The season rule is asymmetric by service class, and both halves are asserted against the
          SAME field and gas day: on an INJECTION-season field the INTERRUPTIBLE contract's
          WITHDRAWAL nomination is refused with ERR_SEASON_DIRECTION_MISMATCH while the FIRM
          contract's identical WITHDRAWAL nomination is created, and the INTERRUPTIBLE contract's
          INJECTION nomination (matching the season) is created too — so the rule is neither a blanket
          direction gate nor a blanket class gate.
