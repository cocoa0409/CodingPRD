            - "Shipment P3 (40 x 20 x 20, 45.0 lb, zone 2, GROUND, non-residential) -> cube 16000, dim weight 116, billable 116 lb, rate 305, line 35380 with no accessorial and no surcharge."
            - "Both DELIVERED and swept onto invoice INV3, which is ISSUED: transportation_subtotal 42750, accessorial_subtotal 540, gross 43290, tier 0 bps, net 43290."
            - "The scan geometry 50 x 22 x 22 at 47.0 lb gives cube 24200, dim weight 175, oversize (length+girth 138 > 130), recomputed line 53375 + 12500 = 65875, so delta = 30495."
