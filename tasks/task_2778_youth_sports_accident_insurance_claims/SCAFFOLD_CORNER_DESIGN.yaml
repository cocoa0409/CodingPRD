              payload: { void_reason: "second void of the same payment" }
              as: ClaimsExaminer
          assert:
            - "after setup: InjuryReport VERIFIED, ProviderBill ADJUDICATED with allowed_amount_cents 360000, Claim APPROVED with coordination_status NO_OTHER_COVERAGE_CONFIRMED, benefit_payable_cents 310000, paid_to_date_cents 300000, BenefitPayment ISSUED"
            - "triggers 1, 2 and 3 each return HTTP 409 with data.error_id == ERR_INVALID_REPORT_STATE, and the report's severity_tier is still MODERATE (trigger 3's SEVERE payload is not applied, so the claim's reserve stays 250000)"
            - "trigger 4 returns HTTP 409 with data.error_id == ERR_INVALID_BILL_STATE (reprice requires SUBMITTED) and the bill's allowed_amount_cents is unchanged at 360000"
            - "triggers 5 and 6 each return HTTP 409 with data.error_id == ERR_INVALID_COORDINATION_STATE (both axis-2 entry points require NOT_STARTED) and coordination_status is still NO_OTHER_COVERAGE_CONFIRMED with coordination_basis FULL_EXCESS"
            - "trigger 7 returns HTTP 409 with data.error_id == ERR_PAYMENT_ON_FILE, NOT ERR_INVALID_BILL_STATE: ADJUDICATED is a declared from-state for void, so only the ISSUED payment blocks it"
            - "trigger 8 returns HTTP 409 with data.error_id == ERR_PAYMENT_ON_FILE, NOT ERR_INVALID_CLAIM_STATE: APPROVED is a declared from-state for withdraw, and paid_to_date_cents 300000 is what refuses it"
