          assert:
            - "403 with error_id == ERR_FORBIDDEN"
            - "GET /api/crews?season_id=${s} returns total_count == 0"

      - name: buyer_cannot_read_other_buyers_order
        claim_type: ownership_denial
        grounds: ["roles[WholesaleBuyer]", "validations[priority=2]"]
        distinguishing_aspect: "Entity-backed identity: WholesaleBuyer's X-User-ID must equal the order's buyer_account_id; Buyer B reading Buyer A's order is ERR_FORBIDDEN (not 404 — the resource exists)."
        test_recipe:
          setup: ["season in BOOKING; buyer A with an order; buyer B exists"]
