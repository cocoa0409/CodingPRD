  - rule_id: compensating_invariant
    instances:
      - name: full_cancellation_restores_budget_and_inventory_ledgers_exactly
        grounds:
          - endpoints[POST /upfront/rights-exercises]
          - state_machines.Buy.PLACED_to_CANCELLED
          - state_machines.BuyUnit.SCHEDULED_to_CANCELLED
          - state_machines.InventoryForecast.EXHAUSTED_to_PUBLISHED
          - calculations.negotiated_buy_cost
          - calculations.allocation_budget_split
          - validations[priority 8]
          - errors.ERR_ALREADY_TERMINAL
        distinguishing_aspect: |
          A 100.00 percent cancellation must undo every ledger the placement wrote and
          nothing else: ChannelAllocation.committed_cents returns to 0, Campaign
          committed_gross_cents returns to 0 with uncommitted_budget_cents back at
          200,000,000, the avail returns to 40,000,000 available impressions and flips
          EXHAUSTED -> PUBLISHED, and the buy's cost tier is re-selected on a net of 0 so
          commission_rate becomes 0.0700 rather than staying at the 0.0400 large-tier rate.
          Campaign.plan_status must remain APPROVED - the reversal must not trigger the
          overcommit cascade in the opposite direction - and a repeat cancellation is refused
          with ERR_ALREADY_TERMINAL so no double reversal is possible.
        test_recipe:
          setup:
            - "an APPROVED 200,000,000 cent campaign with one 100 percent LINEAR_TV UPFRONT PRIME allocation, so allocated_cents is 200,000,000"
            - "one PUBLISHED avail with exactly 40,000,000 total impressions"
            - "a PLACED buy guaranteeing 40,000,000 impressions at CPM 2200 (net 88,000,000, rate 0.0400, gross 91,520,000) whose single 40-unit line holds the entire avail, leaving it EXHAUSTED with 0 available impressions"
