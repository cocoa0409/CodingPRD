              as: Member
              as_user_id: "${mem}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_ARREARS_OUTSTANDING (409)"

      - name: election_open_before_window_rejected
        claim_type: temporal_validation
        grounds: [state_machines.Election.SCHEDULED_to_NOMINATION_OPEN, "errors[ERR_ELECTION_STATE_FORBIDDEN]"]
        distinguishing_aspect: "open-nominations before nomination_open_at is rejected even though the state SCHEDULED is correct."
        test_recipe:
          setup: ["PCT local; election with nomination_open_at 2026-09-01T00:00:00Z; clock at 2026-08-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
