            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_s}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
