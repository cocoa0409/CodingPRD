scenario: "2188. Condominium Association Management (community association manager): unit owner ledger & assessment billing, common element maintenance & vendor contracting, insurance (master policy) & unit owner responsibility delineation, rules enforcement & fine hearing process, board meeting & budget adoption cycle, resale certificate & lender questionnaire completion, reserve funding & special assessment approval, litigation & construction defect claim coordination"
domain_name: "condominium-association-management"
api_prefix: "/associations"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Units, CommonElements, VendorContracts, Claims and Cases form a many-to-many
  # reference graph joined by Vote (polymorphic subject) and LedgerEntry
  # (self-referential reversal chain); only Association acts as a scope root.

  state_machine_shape: cyclic
  # Budget revision rounds (REJECTED -> DRAFT), ViolationCase appeal rounds
  # (FINE_ASSESSED -> APPEALED -> HEARING_SCHEDULED), VendorContract
  # suspend/reinstate, InsuranceClaim appeal loop; SpecialAssessment and
  # InsuranceClaim additionally carry two independent state dimensions.

  relationship_patterns:
    - one_to_many        # Association -> Unit, Unit -> LedgerEntry
    - many_to_many       # Vote joins voters (UnitOwner/Unit) to ballot subjects
    - self_referential   # LedgerEntry.reverses_entry_id, Budget.supersedes_budget_id, ViolationCase.prior_case_id
    - polymorphic        # Vote.subject_id resolves per Vote.subject_type
    - cross_aggregate    # ResaleCertificate pins Budget + Unit + InsuranceClaim disclosures

  role_model: segregation_of_duties
  # The director who reports a violation may not chair its hearing; the manager
  # who proposes a budget may not cast a ratification ballot; the treasurer who
  # reverses a ledger entry may not be the owner of record for that unit.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: recorded name of the condominium association
        constraints: 1-200 chars, required
      - name: fiscal_year_start_month
        type: integer
        source: input
        description: month (1-12) the fiscal year begins; drives billing periods
        default: 1
        constraints: 1..12
      - name: total_interest_bp
        type: integer
        source: computed
        description: sum of interest_bp over all Units of this Association
        constraints: "must equal 10000 before any Budget may be adopted"
      - name: operating_cash_cents
        type: integer
        source: system
        description: unrestricted operating cash; credited by payments applied to ASSESSMENT/LATE_FEE/FINE buckets
        default: 0
      - name: reserve_balance_cents
        type: integer
        source: system
        description: total reserve cash held (restricted + unrestricted reserve)
        default: 0
      - name: reserve_designated_cents
        type: integer
        source: computed
        description: portion of reserve_balance_cents designated to litigation matters and APPROVED special assessments; not spendable on ordinary work orders
        default: 0
      - name: restricted_sa_cash_cents
        type: integer
        source: computed
        description: cash collected against APPROVED SpecialAssessments and not yet disbursed or refunded
        default: 0
      - name: master_policy_deductible_cents
        type: integer
        source: input
        description: per-occurrence deductible of the master property policy
        default: 2500000
      - name: association_deductible_cap_cents
        type: integer
        source: input
        description: maximum slice of the master-policy deductible the Association absorbs before the remainder is charged back to affected Units
        default: 1000000
      - name: late_fee_grace_days
        type: integer
        source: input
        description: days after a charge's due date before a late fee may be assessed
        default: 10
      - name: late_fee_percent_bp
        type: integer
        source: input
        description: basis points of delinquent assessment principal used for the percentage limb of the late fee
        default: 1000
      - name: late_fee_min_cents
        type: integer
        source: input
        description: floor of the late fee
        default: 2500
      - name: late_fee_cap_cents
        type: integer
        source: input
        description: ceiling of the late fee
        default: 10000
      - name: lien_threshold_cents
        type: integer
        source: input
        description: balance_due_cents at or above which a Unit escalates to LIEN_FILED at the next billing run
        default: 180000
      - name: budget_veto_bp
        type: integer
        source: input
        description: share of TOTAL association interest that must vote NO to defeat a noticed budget (veto-style ratification)
        default: 5000
      - name: special_assessment_approval_bp
        type: integer
        source: input
        description: share of ELIGIBLE (counted) interest weight that must vote YES to approve a special assessment
        default: 6667
      - name: board_quorum_seats
        type: integer
        source: input
        description: number of seated directors required to convene a BoardMeeting
        default: 3
      - name: hearing_docket_capacity
        type: integer
        source: input
        description: maximum number of violation hearing slots on a single BoardMeeting
        default: 6
      - name: element_window_buffer_hours
        type: integer
        source: input
        description: mandatory quiet buffer around a common element outage window
        default: 24
      - name: reserve_adequacy_threshold_bp
        type: integer
        source: input
        description: percent-funded floor (bp) at or above which reserves are ADEQUATE
        default: 7000
      - name: reserve_contribution_min_bp
        type: integer
        source: input
        description: minimum reserve contribution as bp of a Budget's operating_total_cents
        default: 1000
      - name: fine_tier_1_cents
        type: integer
        source: input
        description: fine for a first violation of a rule_code within the lookback window
        default: 5000
      - name: fine_tier_2_cents
        type: integer
        source: input
        description: fine for a second violation of the same rule_code within the lookback window
        default: 10000
      - name: fine_tier_3_daily_cents
        type: integer
        source: input
        description: per-day fine for a third-or-later violation of the same rule_code
        default: 25000
      - name: fine_cap_cents
        type: integer
        source: input
        description: ceiling on any single assessed fine
        default: 250000
      - name: repeat_lookback_days
        type: integer
        source: input
        description: window used to count prior violations of the same rule_code for tier selection
        default: 365
      - name: cure_period_days
        type: integer
        source: input
        description: days after notice_sent_at during which an owner may cure before a hearing may be docketed
        default: 14
      - name: appeal_window_days
        type: integer
        source: input
        description: days after a fine is assessed during which the owner may appeal
        default: 30
      - name: budget_notice_days
        type: integer
        source: input
        description: statutory days between a budget's notice_sent_at and its ratification meeting scheduled_start
        default: 30
      - name: certificate_validity_days
        type: integer
        source: input
        description: days an ISSUED ResaleCertificate remains valid
        default: 30
      - name: resale_cert_fee_cents
        type: integer
        source: input
        description: fee charged to the selling Unit when a certificate is issued
        default: 35000

  - name: UnitOwner
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: full_name
        type: string
        source: input
        description: owner of record name
      - name: email
        type: string
        source: input
        description: notice delivery address
      - name: board_role
        type: enum
        source: input
        description: board seat held by this owner
        default: NONE
        constraints: "NONE | DIRECTOR | PRESIDENT | TREASURER"
      - name: is_seated
        type: boolean
        source: input
        description: whether the board seat is currently seated (counts toward board quorum)
        default: false
      - name: owned_unit_count
        type: integer
        source: computed
        description: count of Units whose current_owner_id equals this owner's id
        default: 0

  - name: Unit
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: current_owner_id
        type: string
        source: input
        description: "FK -> UnitOwner.id; owner of record; reassigned by ownership transfer"
      - name: unit_label
        type: string
        source: input
        description: door number
        constraints: "unique per association_id"
      - name: interest_bp
        type: integer
        source: input
        description: undivided common-element interest in basis points; allocation basis for assessments and owner ballots
        constraints: "1..10000"
      - name: heated_sqft
        type: integer
        source: input
        description: heated area; pro-rata basis for master-policy deductible chargebacks
        constraints: ">= 1"
      - name: monthly_assessment_cents
        type: integer
        source: computed
        description: per-period assessment produced by the adopted Budget's allocation snapshot
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "signed sum of amount_cents over EVERY LedgerEntry row of this unit (POSTED and REVERSED alike); a REVERSAL entry carries the exact negative of the entry it reverses so a reversed pair nets to zero (positive = owed)"
        default: 0
      - name: credit_balance_cents
        type: integer
        source: computed
        description: sum of unapplied_cents over POSTED PAYMENT LedgerEntry rows for this unit
        default: 0
      - name: oldest_unpaid_age_days
        type: integer
        source: computed
        description: logical-clock days since the due_on of the oldest POSTED charge that is not fully applied against
        default: 0
      - name: delinquency_stage
        type: enum
        source: computed
        description: aging posture recomputed by every billing run and by every ledger mutation
        default: CURRENT
        constraints: "CURRENT | REMINDER | LATE_NOTICE | LIEN_FILED | FORECLOSURE_REFERRAL"
      - name: voting_eligible
        type: boolean
        source: computed
        description: "true iff delinquency_stage NOT IN {LIEN_FILED, FORECLOSURE_REFERRAL}"
        default: true
      - name: lien_recorded_at
        type: datetime
        source: system
        description: logical-clock time the lien was recorded; cleared when the unit de-escalates below LIEN_FILED
      - name: transfer_blocked
        type: boolean
        source: computed
        description: "true iff no ResaleCertificate for this unit is in status ISSUED with expires_at > now"
        default: true

  - name: LedgerEntry
    parent: Unit
    common_fields: false
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id"
      - name: billing_run_id
        type: string
        source: system
        description: "FK -> BillingRun.id; null for manual charges, payments and reversals"
      - name: source_case_id
        type: string
        source: system
        description: "FK -> ViolationCase.id; set on FINE entries"
      - name: special_assessment_id
        type: string
        source: system
        description: "FK -> SpecialAssessment.id; set on SPECIAL_ASSESSMENT_INSTALLMENT and CREDIT_REFUND entries"
      - name: source_claim_id
        type: string
        source: system
        description: "FK -> InsuranceClaim.id; set on INSURANCE_DEDUCTIBLE_CHARGEBACK entries"
      - name: reverses_entry_id
        type: string
        source: system
        description: "FK -> LedgerEntry.id; set on REVERSAL entries and points at the entry being undone"
      - name: entry_type
        type: enum
        source: input
        description: economic nature of the entry
        constraints: "ASSESSMENT | SPECIAL_ASSESSMENT_INSTALLMENT | LATE_FEE | INTEREST | FINE | COLLECTION_COST | INSURANCE_DEDUCTIBLE_CHARGEBACK | RESALE_FEE | PAYMENT | CREDIT_REFUND | REVERSAL"
      - name: bucket
        type: enum
        source: computed
        description: statutory application bucket used by the payment waterfall; derived from entry_type
        constraints: "INTEREST | LATE_FEE | COLLECTION_COST | FINE | ASSESSMENT | SPECIAL_ASSESSMENT | NONE"
      - name: amount_cents
        type: integer
        source: input
        description: signed amount; charges are positive, payments and credits negative
        constraints: "non-zero integer cents"
      - name: due_on
        type: datetime
        source: system
        description: date the charge becomes due; aging and late fees measure from here; null on payments/credits
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant the entry was posted; sole chronological ordering key for replay
      - name: effective_period
        type: string
        source: input
        description: billing period the entry belongs to, format YYYY-MM
      - name: applied_allocations
        type: array
        source: computed
        description: "for PAYMENT/CREDIT_REFUND entries, ordered objects { bucket, target_entry_id, applied_cents } recording the waterfall"
        default: []
      - name: unapplied_cents
        type: integer
        source: computed
        description: payment remainder held as unapplied credit after the waterfall exhausts open charges
        default: 0
      - name: applied_cents
        type: integer
        source: computed
        description: for charge entries, cents of payments/credits applied against this charge
        default: 0
      - name: status
        type: enum
        source: computed
        description: "POSTED entries are open for payment application, aging and late-fee bases; a REVERSED entry is closed to those three uses but still counts in balance_due_cents, where its paired REVERSAL entry cancels it exactly"
        default: POSTED
        constraints: "POSTED | REVERSED"
      - name: memo
        type: string
        source: input
        description: free-text narrative

  - name: Budget
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: supersedes_budget_id
        type: string
        source: system
        description: "FK -> Budget.id; set when this budget was created while another budget for the same fiscal_year was in status DRAFT or PROPOSED"
      - name: ratification_meeting_id
        type: string
        source: input
        description: "FK -> BoardMeeting.id; the meeting at which owners may veto the noticed budget"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the budget funds
        constraints: "2020..2100"
      - name: operating_total_cents
        type: integer
        source: input
        description: annual operating expenditure total
        constraints: ">= 0"
      - name: reserve_contribution_cents
        type: integer
        source: input
        description: annual reserve contribution
        constraints: ">= 0"
      - name: assessment_total_cents
        type: integer
        source: computed
        description: operating_total_cents + reserve_contribution_cents
      - name: monthly_assessable_cents
        type: integer
        source: computed
        description: "round_half_up(assessment_total_cents / 12) computed once at adoption"
      - name: status
        type: enum
        source: computed
        description: adoption-cycle state
        default: DRAFT
        constraints: "DRAFT | PROPOSED | NOTICED | ADOPTED | REJECTED | SUPERSEDED"
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant the statutory notice was mailed
      - name: revision_round
        type: integer
        source: computed
        description: number of times this budget has returned to DRAFT
        default: 0
      - name: no_weight_bp
        type: integer
        source: computed
        description: counted NO ballot weight at ratification tally
        default: 0
      - name: allocation_snapshot
        type: array
        source: computed
        description: "objects { unit_id, interest_bp, monthly_cents, remainder_cent_awarded } frozen at adoption"
        default: []
      - name: adopted_at
        type: datetime
        source: system
        description: logical-clock instant of adoption

  - name: BillingRun
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: source_budget_id
        type: string
        source: input
        description: "FK -> Budget.id; must be the ADOPTED budget whose fiscal_year contains period"
      - name: period
        type: string
        source: input
        description: billing period, format YYYY-MM
        constraints: "unique per association_id"
      - name: due_on
        type: datetime
        source: input
        description: due date stamped on every ASSESSMENT charge produced by this run
      - name: assessment_charged_cents
        type: integer
        source: computed
        description: sum of ASSESSMENT amount_cents posted by this run
        default: 0
      - name: remainder_cents_allocated
        type: integer
        source: computed
        description: rounding remainder distributed by the allocation rule in this run
        default: 0
      - name: late_fees_charged_cents
        type: integer
        source: computed
        description: sum of LATE_FEE amount_cents posted by this run
        default: 0
      - name: charged_unit_count
        type: integer
        source: computed
        description: number of Units that received at least one charge in this run
        default: 0
      - name: escalated_unit_count
        type: integer
        source: computed
        description: number of Units whose delinquency_stage advanced during this run
        default: 0
      - name: fines_finalized_count
        type: integer
        source: computed
        description: number of ViolationCases auto-advanced FINE_ASSESSED -> FINE_UPHELD by this run
        default: 0
      - name: executed_at
        type: datetime
        source: system
        description: logical-clock instant the run executed

  - name: SpecialAssessment
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: funding_claim_id
        type: string
        source: input
        description: "FK -> InsuranceClaim.id; set when the assessment funds a construction-defect litigation matter"
      - name: purpose
        type: string
        source: input
        description: stated purpose disclosed on resale certificates
      - name: total_amount_cents
        type: integer
        source: input
        description: aggregate amount to be raised
        constraints: ">= 1"
      - name: installment_count
        type: integer
        source: input
        description: number of equal installments
        constraints: "1..24"
      - name: approval_status
        type: enum
        source: computed
        description: owner-approval dimension
        default: DRAFT
        constraints: "DRAFT | BALLOTING | APPROVED | FAILED | RESCINDED"
      - name: funding_status
        type: enum
        source: computed
        description: collection dimension; evolves independently of approval_status
        default: UNFUNDED
        constraints: "UNFUNDED | PARTIALLY_COLLECTED | FULLY_COLLECTED | REFUNDING | REFUNDED"
      - name: ballot_opened_at
        type: datetime
        source: system
        description: logical-clock instant balloting opened
      - name: ballot_closed_at
        type: datetime
        source: system
        description: logical-clock instant balloting closed
      - name: eligible_weight_bp
        type: integer
        source: computed
        description: total interest_bp of Units with voting_eligible true at tally time
        default: 0
      - name: yes_weight_bp
        type: integer
        source: computed
        description: interest_bp of counted YES ballots at tally time
        default: 0
      - name: installments_posted
        type: integer
        source: computed
        description: number of installment rounds posted to unit ledgers
        default: 0
      - name: charged_cents
        type: integer
        source: computed
        description: "signed sum of amount_cents over every SPECIAL_ASSESSMENT_INSTALLMENT entry of this assessment plus their REVERSAL entries (so rescinded installments net out)"
        default: 0
      - name: collected_cents
        type: integer
        source: computed
        description: sum of applied_cents in payment allocations targeting SPECIAL_ASSESSMENT bucket entries of this assessment
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: absolute sum of POSTED CREDIT_REFUND amount_cents for this assessment
        default: 0
      - name: requires_supermajority_disclosure
        type: boolean
        source: computed
        description: true iff funding_claim_id is set, forcing litigation disclosure on every certificate issued after approval
        default: false

  - name: Vote
    parent: Association
    common_fields: false
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: subject_type
        type: enum
        source: input
        description: kind of matter being voted on
        constraints: "BUDGET | SPECIAL_ASSESSMENT | VENDOR_CONTRACT | VIOLATION_FINE"
      - name: subject_id
        type: string
        source: input
        description: "polymorphic reference resolving to Budget.id when subject_type=BUDGET, SpecialAssessment.id when SPECIAL_ASSESSMENT, VendorContract.id when VENDOR_CONTRACT, ViolationCase.id when VIOLATION_FINE"
      - name: meeting_id
        type: string
        source: input
        description: "FK -> BoardMeeting.id; required for board votes, null for owner ballots"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; required for owner ballots (supplies weight), null for board votes"
      - name: voter_owner_id
        type: string
        source: input
        description: "FK -> UnitOwner.id; the natural person casting the vote"
      - name: voter_kind
        type: enum
        source: computed
        description: BOARD_DIRECTOR when meeting_id is set, UNIT_OWNER when unit_id is set
        constraints: "BOARD_DIRECTOR | UNIT_OWNER"
      - name: choice
        type: enum
        source: input
        description: ballot choice
        constraints: "YES | NO | ABSTAIN"
      - name: weight_bp
        type: integer
        source: computed
        description: Unit.interest_bp at cast time for owner ballots; 0 for board votes
        default: 0
      - name: counted
        type: boolean
        source: computed
        description: recomputed at tally time as (voter_kind=BOARD_DIRECTOR) OR Unit.voting_eligible
        default: true
      - name: cast_at
        type: datetime
        source: system
        description: logical-clock instant the vote was cast

  - name: BoardMeeting
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: scheduled_start
        type: datetime
        source: input
        description: meeting start (inclusive)
      - name: scheduled_end
        type: datetime
        source: input
        description: meeting end (exclusive)
      - name: agenda_kinds
        type: array
        source: input
        description: "subset of {REGULAR, BUDGET_RATIFICATION, HEARING, CONTRACT_AWARD, SPECIAL_ASSESSMENT}"
        constraints: "non-empty"
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant meeting notice was mailed
      - name: status
        type: enum
        source: computed
        description: meeting lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | NOTICED | IN_SESSION | ADJOURNED | CANCELLED"
      - name: seated_director_count
        type: integer
        source: computed
        description: number of attending UnitOwners with is_seated true and board_role != NONE recorded at convene
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: seated_director_count >= Association.board_quorum_seats
        default: false
      - name: hearing_slot_count
        type: integer
        source: computed
        description: number of ViolationCases docketed to this meeting
        default: 0

  - name: CommonElement
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: name
        type: string
        source: input
        description: element label
      - name: element_class
        type: enum
        source: input
        description: reserve component class
        constraints: "ROOF | ELEVATOR | FACADE | POOL | GARAGE | LIFE_SAFETY | LANDSCAPE"
      - name: is_life_safety
        type: boolean
        source: computed
        description: "true iff element_class IN {ELEVATOR, LIFE_SAFETY}"
        default: false
      - name: status
        type: enum
        source: computed
        description: serviceability posture gating work-order execution
        default: SERVICEABLE
        constraints: "SERVICEABLE | IMPAIRED | OUT_OF_SERVICE | DECOMMISSIONED"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: current replacement cost used by both reserve methods
        constraints: ">= 0"
      - name: useful_life_years
        type: integer
        source: input
        description: total useful life
        constraints: ">= 1"
      - name: effective_age_years
        type: integer
        source: input
        description: effective age; remaining life = useful_life_years - effective_age_years
        constraints: ">= 0"
      - name: reserve_designated_cents
        type: integer
        source: computed
        description: reserve cash designated to this component
        default: 0
      - name: last_serviced_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent COMPLETED work order on this element

  - name: VendorContract
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: covered_element_id
        type: string
        source: input
        description: "FK -> CommonElement.id; the element this contract services"
      - name: vendor_name
        type: string
        source: input
        description: contracting vendor
      - name: contract_cap_cents
        type: integer
        source: input
        description: not-to-exceed authorization
        constraints: ">= 1"
      - name: committed_cents
        type: integer
        source: computed
        description: sum of encumbered_cents over this contract's work orders in status SCHEDULED, IN_PROGRESS, ON_HOLD or COMPLETED
        default: 0
      - name: invoiced_cents
        type: integer
        source: computed
        description: sum of final_cost_cents over this contract's work orders in status INVOICED
        default: 0
      - name: insurance_cert_expires_at
        type: datetime
        source: input
        description: expiry of the vendor's certificate of insurance
      - name: effective_from
        type: datetime
        source: input
        description: contract term start (inclusive)
      - name: effective_to
        type: datetime
        source: input
        description: contract term end (exclusive)
      - name: status
        type: enum
        source: computed
        description: contracting lifecycle
        default: DRAFT
        constraints: "DRAFT | PENDING_APPROVAL | APPROVED | ACTIVE | SUSPENDED | TERMINATED | EXPIRED"
      - name: approval_yes_count
        type: integer
        source: computed
        description: counted board YES votes recorded for this contract
        default: 0
      - name: pinned_element_version
        type: integer
        source: computed
        description: CommonElement.version frozen at board approval; a later element mutation makes the approval stale
      - name: suspension_reason
        type: enum
        source: computed
        description: why the contract is suspended
        default: NONE
        constraints: "NONE | INSURANCE_LAPSED | PERFORMANCE | ELEMENT_SPEC_CHANGED"

  - name: MaintenanceWorkOrder
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: contract_id
        type: string
        source: input
        description: "FK -> VendorContract.id"
      - name: element_id
        type: string
        source: input
        description: "FK -> CommonElement.id; must equal the contract's covered_element_id"
      - name: claim_id
        type: string
        source: input
        description: "FK -> InsuranceClaim.id; set when the repair is driven by an insurance claim"
      - name: scope
        type: string
        source: input
        description: work description
      - name: window_start
        type: datetime
        source: input
        description: outage window start (inclusive)
      - name: window_end
        type: datetime
        source: input
        description: outage window end (inclusive)
      - name: estimated_cost_cents
        type: integer
        source: input
        description: encumbrance amount reserved against the contract cap
        constraints: ">= 0"
      - name: final_cost_cents
        type: integer
        source: input
        description: invoiced amount supplied at invoicing
      - name: encumbered_cents
        type: integer
        source: computed
        description: cents currently encumbered against contract_cap_cents by this order; 0 once CANCELLED or INVOICED
        default: 0
      - name: is_emergency
        type: boolean
        source: input
        description: emergency orders on life-safety elements skip the board award vote requirement
        default: false
      - name: hold_reason
        type: enum
        source: computed
        description: why the order is on hold
        default: NONE
        constraints: "NONE | CONTRACT_SUSPENDED | ELEMENT_UNAVAILABLE | FUNDING"
      - name: status
        type: enum
        source: computed
        description: execution lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | ON_HOLD | COMPLETED | INVOICED | CANCELLED"

  - name: InsuranceClaim
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit where the loss originated, null for common-element-only losses"
      - name: element_id
        type: string
        source: input
        description: "FK -> CommonElement.id; the damaged common element, null for in-unit-only losses"
      - name: loss_type
        type: enum
        source: input
        description: peril
        constraints: "WATER | FIRE | WIND | CONSTRUCTION_DEFECT | LIABILITY"
      - name: loss_at
        type: datetime
        source: input
        description: date of loss
      - name: gross_damage_cents
        type: integer
        source: input
        description: total adjusted damage across unit interiors and common elements
        constraints: ">= 1"
      - name: within_unit_boundary_cents
        type: integer
        source: input
        description: portion of gross_damage_cents inside unit boundaries per the declaration (owner responsibility before deductible allocation)
        constraints: "0..gross_damage_cents"
      - name: common_element_damage_cents
        type: integer
        source: computed
        description: gross_damage_cents - within_unit_boundary_cents
        default: 0
      - name: affected_unit_ids
        type: array
        source: input
        description: unit ids sharing the deductible chargeback pro-rata by heated_sqft
        default: []
      - name: adjustment_status
        type: enum
        source: computed
        description: adjustment dimension
        default: REPORTED
        constraints: "REPORTED | UNDER_REVIEW | ADJUSTED_ASSOCIATION | ADJUSTED_OWNER | ADJUSTED_SPLIT | DENIED | SETTLED | APPEALED"
      - name: litigation_status
        type: enum
        source: computed
        description: litigation dimension; evolves independently of adjustment_status
        default: NONE
        constraints: "NONE | TENDERED | IN_LITIGATION | RESOLVED"
      - name: deductible_allocation
        type: array
        source: computed
        description: "ordered objects { unit_id, heated_sqft, allocated_cents } produced by the deductible waterfall"
        default: []
      - name: association_absorbed_cents
        type: integer
        source: computed
        description: slice of the deductible absorbed by the Association
        default: 0
      - name: owner_chargeback_cents
        type: integer
        source: computed
        description: total deductible cents charged back to affected units
        default: 0
      - name: appeal_round
        type: integer
        source: computed
        description: number of completed appeal cycles
        default: 0
      - name: disclosure_required
        type: boolean
        source: computed
        description: "true iff litigation_status IN {TENDERED, IN_LITIGATION}"
        default: false

  - name: ViolationCase
    parent: Association
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: "FK -> Association.id"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the cited unit"
      - name: prior_case_id
        type: string
        source: system
        description: "FK -> ViolationCase.id; most recent earlier case for the same unit_id and rule_code inside the lookback window"
      - name: reported_by_owner_id
        type: string
        source: input
        description: "FK -> UnitOwner.id; the director who reported the violation; barred from chairing the hearing"
      - name: decision_owner_id
        type: string
        source: system
        description: "FK -> UnitOwner.id; the director who chaired the hearing decision"
      - name: hearing_meeting_id
        type: string
        source: system
        description: "FK -> BoardMeeting.id; meeting hosting the docketed hearing"
      - name: rule_code
        type: string
        source: input
        description: cited rule identifier; tier counting keys on this value
      - name: continuing_days
        type: integer
        source: input
        description: days the violation continued; multiplies the tier-3 daily rate
        default: 1
        constraints: ">= 1"
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant the violation notice was mailed
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: notice_sent_at + Association.cure_period_days
      - name: hearing_slot_start
        type: datetime
        source: input
        description: start of the 30-minute half-open docket slot on the hearing meeting
      - name: hearing_round
        type: integer
        source: computed
        description: 1 for the original hearing, incremented on each appeal re-docket
        default: 0
      - name: fine_tier
        type: integer
        source: computed
        description: 1, 2 or 3 selected from the repeat chain within the lookback window
        default: 0
      - name: fine_amount_cents
        type: integer
        source: computed
        description: assessed fine after tier selection and cap
        default: 0
      - name: fine_entry_id
        type: string
        source: system
        description: "FK -> LedgerEntry.id; the FINE charge posted on assessment"
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: fine assessment instant + Association.appeal_window_days
      - name: status
        type: enum
        source: computed
        description: enforcement lifecycle
        default: OPEN
        constraints: "OPEN | NOTICE_SENT | HEARING_SCHEDULED | FINE_ASSESSED | APPEALED | FINE_UPHELD | FINE_VACATED | DISMISSED | CURED"

  - name: ResaleCertificate
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id"
      - name: pinned_budget_id
        type: string
        source: system
        description: "FK -> Budget.id; the ADOPTED budget whose allocation backed the payoff figures at issuance"
      - name: requesting_agent_id
        type: string
        source: input
        description: opaque TitleAgent identifier of the closing agent
      - name: closing_date
        type: datetime
        source: input
        description: scheduled closing date used for proration and forward projection
      - name: payoff_basis
        type: enum
        source: input
        description: which payoff algorithm the certificate reports
        default: LEDGER_BALANCE
        constraints: "LEDGER_BALANCE | ESTIMATED_PAYOFF"
      - name: status
        type: enum
        source: computed
        description: certificate lifecycle
        default: REQUESTED
        constraints: "REQUESTED | ISSUED | VOIDED | EXPIRED"
      - name: pinned_unit_version
        type: integer
        source: computed
        description: Unit.version frozen at issuance; any later unit mutation makes the certificate stale
      - name: pinned_budget_version
        type: integer
        source: computed
        description: Budget.version frozen at issuance
      - name: ledger_balance_cents
        type: integer
        source: computed
        description: Unit.balance_due_cents at issuance
        default: 0
      - name: projected_payoff_cents
        type: integer
        source: computed
        description: payoff through closing_date under the selected payoff_basis
        default: 0
      - name: proration_credit_cents
        type: integer
        source: computed
        description: seller credit for the unexpired part of the closing month
        default: 0
      - name: open_violation_count
        type: integer
        source: computed
        description: count of this unit's ViolationCases in a non-terminal status at issuance
        default: 0
      - name: special_assessment_disclosure_cents
        type: integer
        source: computed
        description: unbilled balance of APPROVED special assessments allocable to this unit
        default: 0
      - name: disclosed_claim_ids
        type: array
        source: computed
        description: ids of InsuranceClaims with disclosure_required true at issuance
        default: []
      - name: cert_fee_entry_id
        type: string
        source: system
        description: "FK -> LedgerEntry.id; the RESALE_FEE charge posted at issuance"
      - name: requires_reissue
        type: boolean
        source: computed
        description: set true when the certificate is voided by a cascade rather than by an operator
        default: false
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance
      - name: expires_at
        type: datetime
        source: computed
        description: issued_at + Association.certificate_validity_days

state_machines:
  - entity: Budget
    initial_state: DRAFT
    terminal_states: [ADOPTED, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /budgets/{id}/propose"
        actor: CommunityManager
        preconditions:
          - "budget.status == DRAFT"
          - "association.total_interest_bp == 10000"
          - "reserve_contribution_cents >= round_half_up(operating_total_cents * association.reserve_contribution_min_bp / 10000)"
          - "no other Budget with the same association_id and fiscal_year has status ADOPTED"
        side_effects:
          - "sets assessment_total_cents = operating_total_cents + reserve_contribution_cents"
          - "sets monthly_assessable_cents = round_half_up(assessment_total_cents / 12)"
          - "increments Budget.version by 1"
      - from: PROPOSED
        to: NOTICED
        trigger: "POST /budgets/{id}/send-notice"
        actor: CommunityManager
        preconditions:
          - "budget.status == PROPOSED"
          - "budget.ratification_meeting_id is set"
          - "the referenced BoardMeeting.status IN {SCHEDULED, NOTICED}"
          - "BOARD_MEETING.agenda_kinds contains BUDGET_RATIFICATION"
          - "meeting.scheduled_start >= clock_now + association.budget_notice_days days"
        side_effects:
          - "sets notice_sent_at = clock_now"
          - "if the referenced BoardMeeting.status == SCHEDULED it becomes NOTICED and its notice_sent_at = clock_now; increments BoardMeeting.version by 1"
          - "increments Budget.version by 1"
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /budgets/{id}/return-to-draft"
        actor: BoardDirector
        preconditions:
          - "budget.status == PROPOSED"
        side_effects:
          - "increments revision_round by 1"
          - "increments Budget.version by 1"
        note: "revision loop leg 1 of 3 — board sends the manager's proposal back"
      - from: NOTICED
        to: DRAFT
        trigger: "POST /budgets/{id}/return-to-draft"
        actor: BoardDirector
        preconditions:
          - "budget.status == NOTICED"
          - "the referenced BoardMeeting.status != IN_SESSION"
        side_effects:
          - "clears notice_sent_at to null (statutory notice is void and must be re-mailed)"
          - "increments revision_round by 1"
          - "sets counted = false on every Vote with subject_type BUDGET and subject_id == budget.id"
          - "increments Budget.version by 1"
        note: "revision loop leg 2 of 3 — pulling a noticed budget restarts the notice clock"
      - from: NOTICED
        to: ADOPTED
        trigger: "POST /budgets/{id}/ratify"
        actor: BoardDirector
        preconditions:
          - "budget.status == NOTICED"
          - "the referenced BoardMeeting.status == IN_SESSION and meeting.quorum_met == true"
          - "clock_now >= notice_sent_at + association.budget_notice_days days"
          - "association.total_interest_bp == 10000"
          - "no_weight_bp (per calculation budget_ratification_tally) < association.budget_veto_bp"
        side_effects:
          - "sets no_weight_bp from calculation budget_ratification_tally and adopted_at = clock_now"
          - "cascade hop 1: computes allocation_snapshot via calculation assessment_allocation and writes Unit.monthly_assessment_cents on every Unit of the association, incrementing each Unit.version by 1"
          - "cascade hop 2: because Unit.monthly_assessment_cents changed, every ResaleCertificate for those units with status ISSUED and pinned_budget_id != budget.id becomes VOIDED with requires_reissue = true"
          - "cascade hop 3: because those certificates were voided by cascade, a REVERSAL LedgerEntry of -cert_fee_cents is posted against each certificate's cert_fee_entry_id and that entry's status becomes REVERSED, so Unit.balance_due_cents is recomputed"
          - "cascade hop 4: because Unit.balance_due_cents fell, Unit.delinquency_stage is re-derived by the delinquency ladder; a unit leaving LIEN_FILED clears lien_recorded_at and flips voting_eligible to true"
          - "cascade hop 5: because a unit's voting_eligible flipped, every SpecialAssessment of the association with approval_status BALLOTING recomputes eligible_weight_bp and re-derives counted on its Votes"
          - "increments Budget.version by 1"
        note: "veto-style ratification: adoption is the default outcome unless owners muster the veto weight"
      - from: NOTICED
        to: REJECTED
        trigger: "POST /budgets/{id}/ratify"
        actor: BoardDirector
        preconditions:
          - "budget.status == NOTICED"
          - "the referenced BoardMeeting.status == IN_SESSION and meeting.quorum_met == true"
          - "clock_now >= notice_sent_at + association.budget_notice_days days"
          - "no_weight_bp >= association.budget_veto_bp"
        side_effects:
          - "sets no_weight_bp from calculation budget_ratification_tally"
          - "does NOT touch Unit.monthly_assessment_cents, allocation_snapshot stays empty, no certificate is voided"
          - "increments Budget.version by 1"
        note: "branch sibling of NOTICED->ADOPTED with a disjoint side-effect set; boundary is >= on budget_veto_bp"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /budgets/{id}/return-to-draft"
        actor: BoardDirector
        preconditions:
          - "budget.status == REJECTED"
        side_effects:
          - "increments revision_round by 1"
          - "clears notice_sent_at to null and resets no_weight_bp to 0"
          - "sets counted = false on every Vote with subject_type BUDGET and subject_id == budget.id"
          - "increments Budget.version by 1"
        note: "revision loop leg 3 of 3 — closes the DRAFT -> PROPOSED -> NOTICED -> REJECTED -> DRAFT cycle"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /associations/{id}/budgets creates a newer Budget for the same fiscal_year"
        actor: system
        preconditions:
          - "budget.status IN {DRAFT, PROPOSED}"
          - "the new Budget carries the same association_id and fiscal_year"
        side_effects:
          - "sets the new Budget.supersedes_budget_id = this budget.id"
          - "sets counted = false on every Vote with subject_type BUDGET and subject_id == this budget.id"
          - "increments Budget.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: POST /associations/{id}/budgets creates a newer Budget for the same fiscal_year"
        actor: system
        preconditions:
          - "budget.status == PROPOSED"
        side_effects:
          - "sets the new Budget.supersedes_budget_id = this budget.id"
          - "increments Budget.version by 1"

  - entity: ViolationCase
    initial_state: OPEN
    terminal_states: [CURED, DISMISSED, FINE_UPHELD, FINE_VACATED]
    shape: cyclic_with_branching
    transitions:
      - from: OPEN
        to: NOTICE_SENT
        trigger: "POST /violation-cases/{id}/send-notice"
        actor: CommunityManager
        preconditions:
          - "case.status == OPEN"
          - "the cited Unit exists and unit.association_id == case.association_id"
        side_effects:
          - "sets notice_sent_at = clock_now and cure_deadline_at = notice_sent_at + association.cure_period_days days"
          - "resolves prior_case_id per calculation fine_tier_selection's chain rule (same unit_id and rule_code, notice_sent_at within association.repeat_lookback_days, status IN {FINE_ASSESSED, FINE_UPHELD, CURED}, ordered notice_sent_at DESC then created_at DESC, first row wins; null when the chain is empty)"
          - "increments ViolationCase.version by 1"
      - from: NOTICE_SENT
        to: CURED
        trigger: "POST /violation-cases/{id}/mark-cured"
        actor: CommunityManager
        preconditions:
          - "case.status == NOTICE_SENT"
          - "clock_now <= cure_deadline_at (the deadline instant itself still cures)"
        side_effects:
          - "no ledger effect; the case remains in the repeat chain for future tier counting"
          - "increments ViolationCase.version by 1"
      - from: NOTICE_SENT
        to: HEARING_SCHEDULED
        trigger: "POST /violation-cases/{id}/schedule-hearing"
        actor: BoardDirector
        preconditions:
          - "case.status == NOTICE_SENT"
          - "clock_now > cure_deadline_at (strictly after; equality still belongs to the owner)"
          - "the target BoardMeeting.status IN {SCHEDULED, NOTICED} and agenda_kinds contains HEARING"
          - "meeting.hearing_slot_count < association.hearing_docket_capacity"
          - "hearing_slot_start is aligned to a 30-minute boundary inside [meeting.scheduled_start, meeting.scheduled_end)"
          - "no other ViolationCase docketed to that meeting occupies the half-open slot [hearing_slot_start, hearing_slot_start + 30 min)"
          - "at most 1 other ViolationCase with the same unit_id is already docketed to that meeting"
        side_effects:
          - "sets hearing_meeting_id, hearing_slot_start and hearing_round = 1"
          - "increments BoardMeeting.hearing_slot_count by 1 and BoardMeeting.version by 1"
          - "increments ViolationCase.version by 1"
      - from: HEARING_SCHEDULED
        to: FINE_ASSESSED
        trigger: "POST /violation-cases/{id}/hearing-decision with outcome=FINE"
        actor: BoardDirector
        preconditions:
          - "case.status == HEARING_SCHEDULED and hearing_round == 1"
          - "the hearing BoardMeeting.status == IN_SESSION and meeting.quorum_met == true"
          - "X-User-ID != case.reported_by_owner_id (segregation of duties)"
          - "the acting UnitOwner.board_role != NONE and is_seated == true"
        side_effects:
          - "sets fine_tier and fine_amount_cents from calculation fine_tier_selection"
          - "posts a FINE LedgerEntry (bucket FINE, amount_cents = +fine_amount_cents, due_on = clock_now + 30 days) on the cited unit and stores its id in fine_entry_id"
          - "recomputes Unit.balance_due_cents and re-derives Unit.delinquency_stage; increments Unit.version by 1"
          - "sets decision_owner_id = X-User-ID and appeal_deadline_at = clock_now + association.appeal_window_days days"
          - "increments ViolationCase.version by 1"
      - from: HEARING_SCHEDULED
        to: DISMISSED
        trigger: "POST /violation-cases/{id}/hearing-decision with outcome=DISMISS"
        actor: BoardDirector
        preconditions:
          - "case.status == HEARING_SCHEDULED and hearing_round == 1"
          - "the hearing BoardMeeting.status == IN_SESSION and meeting.quorum_met == true"
          - "X-User-ID != case.reported_by_owner_id (segregation of duties)"
        side_effects:
          - "no ledger entry is posted, fine_amount_cents stays 0, fine_tier stays 0"
          - "the case is REMOVED from the repeat chain: later cases skip DISMISSED rows when resolving prior_case_id"
          - "sets decision_owner_id = X-User-ID; increments ViolationCase.version by 1"
        note: "branch sibling of HEARING_SCHEDULED->FINE_ASSESSED with a disjoint side-effect set"
      - from: FINE_ASSESSED
        to: APPEALED
        trigger: "POST /violation-cases/{id}/appeal"
        actor: UnitOwner
        preconditions:
          - "case.status == FINE_ASSESSED"
          - "clock_now <= appeal_deadline_at"
          - "X-User-ID == Unit.current_owner_id for case.unit_id"
        side_effects:
          - "decrements the former hearing BoardMeeting.hearing_slot_count by 1 and increments that BoardMeeting.version by 1"
          - "clears hearing_meeting_id and hearing_slot_start to null"
          - "the FINE LedgerEntry stays POSTED — the fine remains owed during the appeal"
          - "increments ViolationCase.version by 1"
      - from: APPEALED
        to: HEARING_SCHEDULED
        trigger: "POST /violation-cases/{id}/schedule-hearing"
        actor: BoardDirector
        preconditions:
          - "case.status == APPEALED"
          - "the target BoardMeeting.id != the meeting that hosted the prior hearing round"
          - "the target BoardMeeting.status IN {SCHEDULED, NOTICED} and agenda_kinds contains HEARING"
          - "meeting.hearing_slot_count < association.hearing_docket_capacity"
          - "no other docketed case occupies the half-open slot [hearing_slot_start, hearing_slot_start + 30 min)"
        side_effects:
          - "increments hearing_round by 1 and sets hearing_meeting_id, hearing_slot_start"
          - "increments BoardMeeting.hearing_slot_count by 1 and BoardMeeting.version by 1"
          - "increments ViolationCase.version by 1"
        note: "closes the FINE_ASSESSED -> APPEALED -> HEARING_SCHEDULED cycle"
      - from: HEARING_SCHEDULED
        to: FINE_UPHELD
        trigger: "POST /violation-cases/{id}/hearing-decision with outcome=UPHOLD"
        actor: BoardDirector
        preconditions:
          - "case.status == HEARING_SCHEDULED and hearing_round >= 2"
          - "the hearing BoardMeeting.status == IN_SESSION and meeting.quorum_met == true"
          - "X-User-ID != case.reported_by_owner_id and X-User-ID != case.decision_owner_id (no director reviews their own decision)"
        side_effects:
          - "the FINE LedgerEntry stays POSTED and Unit.balance_due_cents is unchanged"
          - "increments ViolationCase.version by 1"
      - from: HEARING_SCHEDULED
        to: FINE_VACATED
        trigger: "POST /violation-cases/{id}/hearing-decision with outcome=VACATE"
        actor: BoardDirector
        preconditions:
          - "case.status == HEARING_SCHEDULED and hearing_round >= 2"
          - "the hearing BoardMeeting.status == IN_SESSION and meeting.quorum_met == true"
          - "X-User-ID != case.reported_by_owner_id and X-User-ID != case.decision_owner_id"
        side_effects:
          - "cascade hop 1: posts a REVERSAL LedgerEntry with reverses_entry_id = fine_entry_id and amount_cents = -fine_amount_cents; the original FINE entry status becomes REVERSED"
          - "cascade hop 2: because the ledger changed, Unit.balance_due_cents and oldest_unpaid_age_days are recomputed and Unit.delinquency_stage is re-derived by the delinquency ladder; a unit dropping out of LIEN_FILED clears lien_recorded_at and flips voting_eligible to true; increments Unit.version by 1"
          - "cascade hop 3: because voting_eligible flipped, every SpecialAssessment of the association with approval_status BALLOTING recomputes eligible_weight_bp and re-derives counted on its Votes; increments SpecialAssessment.version by 1"
          - "cascade hop 4: because eligible_weight_bp changed, every ResaleCertificate with status ISSUED for that unit whose special_assessment_disclosure_cents no longer matches the recomputed figure becomes VOIDED with requires_reissue = true, and its RESALE_FEE entry is reversed"
          - "increments ViolationCase.version by 1"
        note: "compensating action for FINE_ASSESSED — the unit ledger invariant must return to its pre-fine value exactly"
      - from: FINE_ASSESSED
        to: FINE_UPHELD
        trigger: "system: POST /associations/{id}/billing-runs sweeps unappealed fines"
        actor: system
        preconditions:
          - "case.status == FINE_ASSESSED"
          - "clock_now > appeal_deadline_at"
        side_effects:
          - "increments BillingRun.fines_finalized_count by 1"
          - "increments ViolationCase.version by 1"
      - from: HEARING_SCHEDULED
        to: NOTICE_SENT
        trigger: "system: POST /board-meetings/{id}/cancel de-dockets round-1 hearings"
        actor: system
        preconditions:
          - "case.status == HEARING_SCHEDULED and hearing_round == 1"
          - "case.hearing_meeting_id == the cancelled meeting"
        side_effects:
          - "clears hearing_meeting_id and hearing_slot_start; hearing_round returns to 0"
          - "cure_deadline_at is NOT extended"
          - "increments ViolationCase.version by 1"
      - from: HEARING_SCHEDULED
        to: APPEALED
        trigger: "system: POST /board-meetings/{id}/cancel de-dockets appeal hearings"
        actor: system
        preconditions:
          - "case.status == HEARING_SCHEDULED and hearing_round >= 2"
          - "case.hearing_meeting_id == the cancelled meeting"
        side_effects:
          - "clears hearing_meeting_id and hearing_slot_start; hearing_round is left at its current value"
          - "increments ViolationCase.version by 1"
        note: "conditional cascade — the same meeting cancellation sends round-1 cases back to NOTICE_SENT and appeal cases back to APPEALED"

  - entity: SpecialAssessment
    initial_state: "approval_status=DRAFT, funding_status=UNFUNDED"
    terminal_states: [FAILED, REFUNDED]
    shape: parallel_dimensions
    note: "two independent dimensions on one row: approval_status (owner vote) and funding_status (cash collection). Collection progresses without touching approval_status, and rescission moves both."
    transitions:
      - dimension: approval_status
        from: DRAFT
        to: BALLOTING
        trigger: "POST /special-assessments/{id}/open-ballot"
        actor: BoardDirector
        preconditions:
          - "approval_status == DRAFT"
          - "association.total_interest_bp == 10000"
          - "no other SpecialAssessment of this association has approval_status == BALLOTING"
          - "if funding_claim_id is set, the referenced InsuranceClaim.litigation_status IN {TENDERED, IN_LITIGATION}"
        side_effects:
          - "sets ballot_opened_at = clock_now"
          - "sets requires_supermajority_disclosure = (funding_claim_id != null)"
          - "increments SpecialAssessment.version by 1"
      - dimension: approval_status
        from: BALLOTING
        to: APPROVED
        trigger: "POST /special-assessments/{id}/close-ballot"
        actor: BoardDirector
        preconditions:
          - "approval_status == BALLOTING"
          - "eligible_weight_bp > 0 after recomputation (an all-ineligible roster is rejected, not failed)"
          - "yes_share_bp (per calculation special_assessment_tally) >= association.special_assessment_approval_bp"
        side_effects:
          - "writes eligible_weight_bp, yes_weight_bp and ballot_closed_at = clock_now"
          - "increments Association.reserve_designated_cents by total_amount_cents and Association.version by 1"
          - "funding_status is untouched and stays UNFUNDED"
          - "increments SpecialAssessment.version by 1"
      - dimension: approval_status
        from: BALLOTING
        to: FAILED
        trigger: "POST /special-assessments/{id}/close-ballot"
        actor: BoardDirector
        preconditions:
          - "approval_status == BALLOTING"
          - "eligible_weight_bp > 0"
          - "yes_share_bp < association.special_assessment_approval_bp"
        side_effects:
          - "writes eligible_weight_bp, yes_weight_bp and ballot_closed_at = clock_now"
          - "Association.reserve_designated_cents is NOT changed"
          - "increments SpecialAssessment.version by 1"
      - dimension: approval_status
        from: APPROVED
        to: RESCINDED
        trigger: "POST /special-assessments/{id}/rescind"
        actor: BoardDirector
        preconditions:
          - "approval_status == APPROVED"
          - "if funding_claim_id is set, that InsuranceClaim.litigation_status != IN_LITIGATION (a live suit cannot be defunded)"
        side_effects:
          - "decrements Association.reserve_designated_cents by total_amount_cents and increments Association.version by 1"
          - "every POSTED SPECIAL_ASSESSMENT_INSTALLMENT LedgerEntry of this assessment is reversed by a REVERSAL entry and flips to REVERSED; affected Unit.balance_due_cents and delinquency_stage are recomputed"
          - "funding_status becomes REFUNDING when collected_cents > 0, otherwise REFUNDED directly"
          - "increments SpecialAssessment.version by 1"
      - dimension: funding_status
        from: UNFUNDED
        to: PARTIALLY_COLLECTED
        trigger: "system: payment application credits the SPECIAL_ASSESSMENT bucket"
        actor: system
        preconditions:
          - "approval_status == APPROVED"
          - "0 < collected_cents < total_amount_cents after the payment waterfall"
        side_effects:
          - "increments Association.restricted_sa_cash_cents by the applied cents and Association.version by 1"
          - "increments SpecialAssessment.version by 1"
      - dimension: funding_status
        from: PARTIALLY_COLLECTED
        to: FULLY_COLLECTED
        trigger: "system: payment application credits the SPECIAL_ASSESSMENT bucket"
        actor: system
        preconditions:
          - "collected_cents >= total_amount_cents after the payment waterfall"
        side_effects:
          - "increments Association.restricted_sa_cash_cents by the applied cents and Association.version by 1"
          - "increments SpecialAssessment.version by 1"
      - dimension: funding_status
        from: REFUNDING
        to: REFUNDED
        trigger: "system: POST /special-assessments/{id}/refund brings refunded_cents up to collected_cents"
        actor: system
        preconditions:
          - "refunded_cents == collected_cents after the refund posting"
        side_effects:
          - "decrements Association.restricted_sa_cash_cents by the refunded cents and increments Association.version by 1"
          - "increments SpecialAssessment.version by 1"

  - entity: InsuranceClaim
    initial_state: "adjustment_status=REPORTED, litigation_status=NONE"
    terminal_states: [SETTLED]
    shape: branching_with_parallel_dimension
    transitions:
      - dimension: adjustment_status
        from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /insurance-claims/{id}/assign-adjuster"
        actor: InsuranceAdjuster
        preconditions:
          - "adjustment_status IN {REPORTED, APPEALED}"
          - "at least one of unit_id, element_id is set"
        side_effects:
          - "sets common_element_damage_cents = gross_damage_cents - within_unit_boundary_cents"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /insurance-claims/{id}/assign-adjuster"
        actor: InsuranceAdjuster
        preconditions:
          - "adjustment_status == APPEALED"
        side_effects:
          - "increments InsuranceClaim.version by 1"
        note: "closes the DENIED -> APPEALED -> UNDER_REVIEW cycle"
      - dimension: adjustment_status
        from: UNDER_REVIEW
        to: ADJUSTED_ASSOCIATION
        trigger: "POST /insurance-claims/{id}/adjust with responsibility=ASSOCIATION"
        actor: InsuranceAdjuster
        preconditions:
          - "adjustment_status == UNDER_REVIEW"
          - "common_element_damage_cents > 0"
        side_effects:
          - "sets association_absorbed_cents = min(association.master_policy_deductible_cents, association.association_deductible_cap_cents) and owner_chargeback_cents = 0"
          - "deductible_allocation stays empty"
          - "decrements Association.operating_cash_cents by association_absorbed_cents and increments Association.version by 1"
          - "if element_id is set and CommonElement.status == SERVICEABLE it becomes IMPAIRED; increments CommonElement.version by 1"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: UNDER_REVIEW
        to: ADJUSTED_OWNER
        trigger: "POST /insurance-claims/{id}/adjust with responsibility=OWNER"
        actor: InsuranceAdjuster
        preconditions:
          - "adjustment_status == UNDER_REVIEW"
          - "unit_id is set"
          - "within_unit_boundary_cents == gross_damage_cents (no common element damage)"
        side_effects:
          - "sets association_absorbed_cents = 0 and owner_chargeback_cents = association.master_policy_deductible_cents"
          - "posts one INSURANCE_DEDUCTIBLE_CHARGEBACK LedgerEntry (bucket ASSESSMENT, due_on = clock_now + 30 days) on unit_id for owner_chargeback_cents"
          - "recomputes that Unit.balance_due_cents and re-derives delinquency_stage; increments Unit.version by 1"
          - "deductible_allocation holds exactly one row for unit_id"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: UNDER_REVIEW
        to: ADJUSTED_SPLIT
        trigger: "POST /insurance-claims/{id}/adjust with responsibility=SPLIT"
        actor: InsuranceAdjuster
        preconditions:
          - "adjustment_status == UNDER_REVIEW"
          - "affected_unit_ids is non-empty (an empty set is rejected, it is not a silent no-op)"
          - "within_unit_boundary_cents > 0 and common_element_damage_cents > 0"
        side_effects:
          - "runs calculation deductible_waterfall, writing association_absorbed_cents, owner_chargeback_cents and deductible_allocation"
          - "posts one INSURANCE_DEDUCTIBLE_CHARGEBACK LedgerEntry per allocation row, in allocation order"
          - "recomputes each affected Unit.balance_due_cents and re-derives delinquency_stage; increments each Unit.version by 1"
          - "decrements Association.operating_cash_cents by association_absorbed_cents and increments Association.version by 1"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /insurance-claims/{id}/adjust with responsibility=DENY"
        actor: InsuranceAdjuster
        preconditions:
          - "adjustment_status == UNDER_REVIEW"
        side_effects:
          - "no ledger entry, no cash movement, deductible_allocation stays empty"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: DENIED
        to: APPEALED
        trigger: "POST /insurance-claims/{id}/appeal"
        actor: CommunityManager
        preconditions:
          - "adjustment_status == DENIED"
          - "appeal_round < 2"
        side_effects:
          - "increments appeal_round by 1"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: ADJUSTED_SPLIT
        to: SETTLED
        trigger: "POST /insurance-claims/{id}/settle"
        actor: InsuranceAdjuster
        preconditions:
          - "adjustment_status IN {ADJUSTED_ASSOCIATION, ADJUSTED_OWNER, ADJUSTED_SPLIT}"
          - "every MaintenanceWorkOrder with claim_id == claim.id has status IN {INVOICED, CANCELLED}"
          - "litigation_status != IN_LITIGATION"
        side_effects:
          - "if element_id is set and every work order on that element is terminal, CommonElement.status becomes SERVICEABLE and CommonElement.version increments by 1"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: ADJUSTED_ASSOCIATION
        to: SETTLED
        trigger: "POST /insurance-claims/{id}/settle"
        actor: InsuranceAdjuster
        preconditions:
          - "every MaintenanceWorkOrder with claim_id == claim.id has status IN {INVOICED, CANCELLED}"
          - "litigation_status != IN_LITIGATION"
        side_effects:
          - "if element_id is set and every work order on that element is terminal, CommonElement.status becomes SERVICEABLE"
          - "increments InsuranceClaim.version by 1"
      - dimension: adjustment_status
        from: ADJUSTED_OWNER
        to: SETTLED
        trigger: "POST /insurance-claims/{id}/settle"
        actor: InsuranceAdjuster
        preconditions:
          - "every MaintenanceWorkOrder with claim_id == claim.id has status IN {INVOICED, CANCELLED}"
        side_effects:
          - "increments InsuranceClaim.version by 1"
      - dimension: litigation_status
        from: NONE
        to: TENDERED
        trigger: "POST /insurance-claims/{id}/litigation-stage with stage=TENDERED"
        actor: AssociationAttorney
        preconditions:
          - "loss_type == CONSTRUCTION_DEFECT"
          - "adjustment_status IN {DENIED, ADJUSTED_ASSOCIATION, ADJUSTED_SPLIT}"
        side_effects:
          - "sets disclosure_required = true"
          - "cascade hop 1: every ResaleCertificate with status ISSUED whose unit_id is in affected_unit_ids becomes VOIDED with requires_reissue = true (the issued certificate no longer discloses the tendered matter)"
          - "cascade hop 2: because those certificates were voided by cascade, each cert_fee_entry_id is reversed and the affected Unit.balance_due_cents plus delinquency_stage are recomputed"
          - "increments InsuranceClaim.version by 1"
      - dimension: litigation_status
        from: TENDERED
        to: IN_LITIGATION
        trigger: "POST /insurance-claims/{id}/litigation-stage with stage=IN_LITIGATION"
        actor: AssociationAttorney
        preconditions:
          - "litigation_status == TENDERED"
          - "there exists a SpecialAssessment with funding_claim_id == claim.id and approval_status == APPROVED"
        side_effects:
          - "increments InsuranceClaim.version by 1"
        note: "cross-entity guard: suit may not be filed until owners have approved the funding assessment"
      - dimension: litigation_status
        from: IN_LITIGATION
        to: RESOLVED
        trigger: "POST /insurance-claims/{id}/litigation-stage with stage=RESOLVED"
        actor: AssociationAttorney
        preconditions:
          - "litigation_status == IN_LITIGATION"
        side_effects:
          - "sets disclosure_required = false"
          - "increments InsuranceClaim.version by 1"

  - entity: VendorContract
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /vendor-contracts/{id}/submit"
        actor: CommunityManager
        preconditions:
          - "status == DRAFT"
          - "effective_from < effective_to"
          - "insurance_cert_expires_at >= effective_to (the certificate must cover the whole term)"
          - "the covered CommonElement.status != DECOMMISSIONED"
        side_effects:
          - "increments VendorContract.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /vendor-contracts/{id}/approve"
        actor: BoardDirector
        preconditions:
          - "status == PENDING_APPROVAL"
          - "approval_yes_count (counted Votes with subject_type VENDOR_CONTRACT and subject_id == contract.id, cast at a BoardMeeting whose agenda_kinds contains CONTRACT_AWARD and whose status IN {IN_SESSION, ADJOURNED}) >= association.board_quorum_seats"
          - "the covered CommonElement.status IN {SERVICEABLE, IMPAIRED}"
        side_effects:
          - "sets pinned_element_version = CommonElement.version at this instant (version pinning on approval)"
          - "writes approval_yes_count"
          - "increments VendorContract.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /vendor-contracts/{id}/activate"
        actor: CommunityManager
        preconditions:
          - "status == APPROVED"
          - "effective_from <= clock_now < effective_to"
          - "insurance_cert_expires_at > clock_now"
          - "CommonElement.version == pinned_element_version (a mutated element invalidates the board's award)"
        side_effects:
          - "increments VendorContract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendor-contracts/{id}/suspend"
        actor: CommunityManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets suspension_reason from the request body"
          - "every MaintenanceWorkOrder of this contract with status IN {SCHEDULED, IN_PROGRESS} becomes ON_HOLD with hold_reason = CONTRACT_SUSPENDED; encumbered_cents is unchanged so committed_cents is unchanged; increments each MaintenanceWorkOrder.version by 1"
          - "increments VendorContract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /associations/{id}/billing-runs detects a lapsed certificate"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "insurance_cert_expires_at <= clock_now"
        side_effects:
          - "sets suspension_reason = INSURANCE_LAPSED"
          - "every work order of this contract with status IN {SCHEDULED, IN_PROGRESS} becomes ON_HOLD with hold_reason = CONTRACT_SUSPENDED"
          - "increments VendorContract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendor-contracts/{id}/reinstate"
        actor: CommunityManager
        preconditions:
          - "status == SUSPENDED"
          - "insurance_cert_expires_at > clock_now"
          - "clock_now < effective_to"
          - "CommonElement.version == pinned_element_version"
        side_effects:
          - "sets suspension_reason = NONE"
          - "every work order of this contract with status == ON_HOLD and hold_reason == CONTRACT_SUSPENDED returns to SCHEDULED with hold_reason NONE; increments each MaintenanceWorkOrder.version by 1"
          - "increments VendorContract.version by 1"
        note: "closes the ACTIVE -> SUSPENDED -> ACTIVE cycle"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /vendor-contracts/{id}/terminate"
        actor: BoardDirector
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
          - "no MaintenanceWorkOrder of this contract has status IN_PROGRESS"
        side_effects:
          - "every work order of this contract with status IN {SCHEDULED, ON_HOLD} becomes CANCELLED and its encumbered_cents is set to 0"
          - "committed_cents is recomputed and MUST equal the sum of encumbered_cents over the contract's non-cancelled orders (encumbrance conservation)"
          - "increments VendorContract.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /vendor-contracts/{id}/terminate"
        actor: BoardDirector
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "every work order with status IN {SCHEDULED, ON_HOLD} becomes CANCELLED with encumbered_cents 0 and committed_cents is recomputed"
          - "increments VendorContract.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /associations/{id}/billing-runs detects clock_now >= effective_to"
        actor: system
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
          - "clock_now >= effective_to"
        side_effects:
          - "every work order with status IN {SCHEDULED, ON_HOLD} becomes CANCELLED with encumbered_cents 0"
          - "committed_cents is recomputed to the sum of encumbered_cents over surviving orders"
          - "increments VendorContract.version by 1"

  - entity: MaintenanceWorkOrder
    initial_state: SCHEDULED
    terminal_states: [INVOICED, CANCELLED]
    shape: linear_with_hold_cycle
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: CommunityManager
        preconditions:
          - "status == SCHEDULED"
          - "the VendorContract.status == ACTIVE"
          - "contract.insurance_cert_expires_at > window_end"
          - "the CommonElement.status != DECOMMISSIONED"
          - "clock_now >= window_start"
        side_effects:
          - "CommonElement.status becomes OUT_OF_SERVICE when element.is_life_safety is true, otherwise IMPAIRED; increments CommonElement.version by 1"
          - "increments MaintenanceWorkOrder.version by 1"
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /work-orders/{id}/hold"
        actor: CommunityManager
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "sets hold_reason from the request body"
          - "CommonElement.status becomes IMPAIRED; increments CommonElement.version by 1"
          - "encumbered_cents is unchanged"
          - "increments MaintenanceWorkOrder.version by 1"
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: CommunityManager
        preconditions:
          - "status == ON_HOLD"
          - "the VendorContract.status == ACTIVE (a CONTRACT_SUSPENDED hold cannot be resumed while the contract is suspended)"
          - "the CommonElement.status != DECOMMISSIONED"
        side_effects:
          - "sets hold_reason = NONE"
          - "CommonElement.status becomes OUT_OF_SERVICE when is_life_safety, otherwise IMPAIRED"
          - "increments MaintenanceWorkOrder.version by 1"
        note: "closes the IN_PROGRESS -> ON_HOLD -> IN_PROGRESS cycle"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: CommunityManager
        preconditions:
          - "status == IN_PROGRESS"
          - "clock_now >= window_start"
        side_effects:
          - "CommonElement.status becomes SERVICEABLE and last_serviced_at = clock_now"
          - "when the request sets resets_component true, CommonElement.effective_age_years becomes 0, which changes the fully-funded basis used by calculation reserve_adequacy"
          - "increments CommonElement.version by 1 and MaintenanceWorkOrder.version by 1"
      - from: COMPLETED
        to: INVOICED
        trigger: "POST /work-orders/{id}/invoice"
        actor: CommunityManager
        preconditions:
          - "status == COMPLETED"
          - "final_cost_cents <= floor(estimated_cost_cents * 11 / 10) (10% overrun tolerance, inclusive)"
          - "contract.invoiced_cents + final_cost_cents <= contract.contract_cap_cents"
        side_effects:
          - "sets encumbered_cents = 0; contract.committed_cents decreases by estimated_cost_cents and contract.invoiced_cents increases by final_cost_cents; increments VendorContract.version by 1"
          - "decrements Association.operating_cash_cents by final_cost_cents and increments Association.version by 1"
          - "increments MaintenanceWorkOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: CommunityManager
        preconditions:
          - "status IN {SCHEDULED, ON_HOLD}"
        side_effects:
          - "sets encumbered_cents = 0 and hold_reason = NONE"
          - "contract.committed_cents decreases by exactly the released encumbrance; increments VendorContract.version by 1"
          - "when no other work order on the element has status IN {IN_PROGRESS, ON_HOLD} and no InsuranceClaim on that element has adjustment_status IN {UNDER_REVIEW, ADJUSTED_ASSOCIATION, ADJUSTED_SPLIT}, CommonElement.status becomes SERVICEABLE"
          - "increments MaintenanceWorkOrder.version by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: CommunityManager
        preconditions:
          - "status == ON_HOLD"
        side_effects:
          - "sets encumbered_cents = 0; contract.committed_cents decreases by exactly the released encumbrance"
          - "increments MaintenanceWorkOrder.version by 1"

  - entity: ResaleCertificate
    initial_state: REQUESTED
    terminal_states: [VOIDED, EXPIRED]
    shape: branching
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /resale-certificates/{id}/issue"
        actor: CommunityManager
        preconditions:
          - "status == REQUESTED"
          - "Unit.delinquency_stage != FORECLOSURE_REFERRAL"
          - "a Budget with status ADOPTED exists whose fiscal_year contains closing_date"
          - "closing_date >= clock_now"
          - "no InsuranceClaim of the association has disclosure_required true unless the association's attorney has recorded it — such claims are disclosed, never blocking"
        side_effects:
          - "posts a RESALE_FEE LedgerEntry for association.resale_cert_fee_cents on the unit and stores its id in cert_fee_entry_id"
          - "recomputes Unit.balance_due_cents and Unit.delinquency_stage, then increments Unit.version by 1"
          - "AFTER the fee posting, pins pinned_unit_version = Unit.version and pinned_budget_id / pinned_budget_version from the adopted budget (pinning happens last so the certificate is never born stale)"
          - "writes ledger_balance_cents, projected_payoff_cents and proration_credit_cents from calculation resale_payoff, open_violation_count, special_assessment_disclosure_cents and disclosed_claim_ids"
          - "sets issued_at = clock_now, expires_at = issued_at + association.certificate_validity_days days, and Unit.transfer_blocked = false"
          - "increments ResaleCertificate.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /resale-certificates/{id}/void"
        actor: CommunityManager
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "sets requires_reissue = false and leaves the RESALE_FEE entry POSTED (an operator void does not refund the fee)"
          - "recomputes Unit.transfer_blocked; increments Unit.version by 1"
          - "increments ResaleCertificate.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "system: budget adoption, fine vacatur, or litigation tender invalidates the pinned snapshot"
        actor: system
        preconditions:
          - "status == ISSUED"
          - "the pinned snapshot no longer matches: pinned_budget_version != Budget.version, or a new disclosure claim appeared, or special_assessment_disclosure_cents changed"
        side_effects:
          - "sets requires_reissue = true"
          - "posts a REVERSAL LedgerEntry with reverses_entry_id = cert_fee_entry_id and amount_cents = -association.resale_cert_fee_cents; the RESALE_FEE entry flips to REVERSED"
          - "recomputes Unit.balance_due_cents, delinquency_stage and transfer_blocked; increments Unit.version by 1"
          - "increments ResaleCertificate.version by 1"
        note: "divergent side-effect set from the operator void: only the cascade path refunds the fee"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /units/{id}/transfer-ownership consumes the certificate at closing"
        actor: CommunityManager
        preconditions:
          - "status == ISSUED and clock_now < expires_at"
          - "Unit.version == pinned_unit_version (the ledger has not moved since issuance)"
          - "the incoming UnitOwner exists and belongs to the same association"
        side_effects:
          - "sets Unit.current_owner_id to the incoming owner and Unit.transfer_blocked = true; increments Unit.version by 1"
          - "decrements the outgoing UnitOwner.owned_unit_count by 1 and increments the incoming owner's by 1; increments both UnitOwner.version values by 1"
          - "increments ResaleCertificate.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system: POST /associations/{id}/billing-runs sweeps stale certificates"
        actor: system
        preconditions:
          - "status == ISSUED and clock_now >= expires_at"
        side_effects:
          - "sets Unit.transfer_blocked = true and increments Unit.version by 1"
          - "increments ResaleCertificate.version by 1"

  - entity: Unit
    initial_state: CURRENT
    terminal_states: []
    shape: compound_posture
    note: |
      delinquency_stage is a derived posture, not an operator-driven status. On every
      ledger mutation and on every billing run the server re-derives it by walking this
      ladder top-down and taking the FIRST matching rule (so de-escalation and escalation
      share one evaluation):
        1. balance_due_cents <= 0                                                     -> CURRENT
        2. oldest_unpaid_age_days >= 180 AND balance_due_cents >= 2 * lien_threshold   -> FORECLOSURE_REFERRAL
        3. oldest_unpaid_age_days >= 90  AND balance_due_cents >= lien_threshold_cents -> LIEN_FILED
        4. oldest_unpaid_age_days >= 30                                               -> LATE_NOTICE
        5. oldest_unpaid_age_days > association.late_fee_grace_days                    -> REMINDER
        6. otherwise                                                                  -> CURRENT
    transitions:
      - from: CURRENT
        to: REMINDER
        trigger: "system: ledger mutation or billing run re-derives the posture (ladder rule 5)"
        actor: system
        preconditions:
          - "balance_due_cents > 0"
          - "oldest_unpaid_age_days > association.late_fee_grace_days (day 10 exactly is still CURRENT)"
        side_effects:
          - "increments Unit.version by 1"
      - from: REMINDER
        to: LATE_NOTICE
        trigger: "system: ledger mutation or billing run re-derives the posture (ladder rule 4)"
        actor: system
        preconditions:
          - "oldest_unpaid_age_days >= 30"
        side_effects:
          - "increments Unit.version by 1"
      - from: LATE_NOTICE
        to: LIEN_FILED
        trigger: "system: ledger mutation or billing run re-derives the posture (ladder rule 3)"
        actor: system
        preconditions:
          - "oldest_unpaid_age_days >= 90"
          - "balance_due_cents >= association.lien_threshold_cents"
        side_effects:
          - "sets lien_recorded_at = clock_now and voting_eligible = false"
          - "every SpecialAssessment of the association with approval_status BALLOTING recomputes eligible_weight_bp and re-derives counted on its Votes; increments each SpecialAssessment.version by 1"
          - "increments BillingRun.escalated_unit_count by 1 when the re-derivation happened inside a billing run"
          - "increments Unit.version by 1"
      - from: LIEN_FILED
        to: FORECLOSURE_REFERRAL
        trigger: "system: ledger mutation or billing run re-derives the posture (ladder rule 2)"
        actor: system
        preconditions:
          - "oldest_unpaid_age_days >= 180"
          - "balance_due_cents >= 2 * association.lien_threshold_cents"
        side_effects:
          - "voting_eligible stays false; no new ResaleCertificate may be issued for this unit"
          - "increments Unit.version by 1"
      - from: LIEN_FILED
        to: LATE_NOTICE
        trigger: "system: a reversal or payment lowers the balance and the ladder re-derives (rule 4 now matches first)"
        actor: system
        preconditions:
          - "balance_due_cents > 0 and balance_due_cents < association.lien_threshold_cents"
          - "oldest_unpaid_age_days >= 30"
        side_effects:
          - "clears lien_recorded_at to null and sets voting_eligible = true"
          - "every SpecialAssessment with approval_status BALLOTING recomputes eligible_weight_bp"
          - "increments Unit.version by 1"
      - from: LIEN_FILED
        to: CURRENT
        trigger: "system: payment or reversal clears the balance (ladder rule 1)"
        actor: system
        preconditions:
          - "balance_due_cents <= 0"
        side_effects:
          - "clears lien_recorded_at and sets voting_eligible = true"
          - "every SpecialAssessment with approval_status BALLOTING recomputes eligible_weight_bp"
          - "increments Unit.version by 1"
      - from: FORECLOSURE_REFERRAL
        to: LATE_NOTICE
        trigger: "system: payment drops the balance below the lien threshold (ladder rule 4)"
        actor: system
        preconditions:
          - "balance_due_cents > 0 and balance_due_cents < association.lien_threshold_cents"
        side_effects:
          - "clears lien_recorded_at and sets voting_eligible = true"
          - "increments Unit.version by 1"
      - from: LATE_NOTICE
        to: CURRENT
        trigger: "system: payment clears the balance (ladder rule 1)"
        actor: system
        preconditions:
          - "balance_due_cents <= 0"
        side_effects:
          - "increments Unit.version by 1"
      - from: REMINDER
        to: CURRENT
        trigger: "system: payment clears the balance (ladder rule 1)"
        actor: system
        preconditions:
          - "balance_due_cents <= 0"
        side_effects:
          - "increments Unit.version by 1"

  - entity: BoardMeeting
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED, CANCELLED]
    shape: linear_with_cancel_compensation
    transitions:
      - from: SCHEDULED
        to: NOTICED
        trigger: "POST /board-meetings/{id}/send-notice"
        actor: CommunityManager
        preconditions:
          - "status == SCHEDULED"
          - "scheduled_start > clock_now"
        side_effects:
          - "sets notice_sent_at = clock_now"
          - "increments BoardMeeting.version by 1"
      - from: NOTICED
        to: IN_SESSION
        trigger: "POST /board-meetings/{id}/convene"
        actor: CommunityManager
        preconditions:
          - "status == NOTICED"
          - "clock_now >= scheduled_start"
          - "the attending owner list yields seated_director_count >= association.board_quorum_seats"
        side_effects:
          - "writes seated_director_count and sets quorum_met = true"
          - "increments BoardMeeting.version by 1"
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /board-meetings/{id}/adjourn"
        actor: CommunityManager
        preconditions:
          - "status == IN_SESSION"
          - "no ViolationCase with hearing_meeting_id == meeting.id has status HEARING_SCHEDULED"
          - "no Budget with ratification_meeting_id == meeting.id has status NOTICED"
        side_effects:
          - "increments BoardMeeting.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /board-meetings/{id}/cancel"
        actor: CommunityManager
        preconditions:
          - "status IN {SCHEDULED, NOTICED}"
        side_effects:
          - "every ViolationCase docketed here with hearing_round == 1 returns to NOTICE_SENT; every one with hearing_round >= 2 returns to APPEALED; hearing_slot_count becomes 0"
          - "every Budget with ratification_meeting_id == meeting.id and status NOTICED returns to PROPOSED with notice_sent_at cleared to null; increments each Budget.version by 1"
          - "increments BoardMeeting.version by 1"
      - from: NOTICED
        to: CANCELLED
        trigger: "POST /board-meetings/{id}/cancel"
        actor: CommunityManager
        preconditions:
          - "status == NOTICED"
        side_effects:
          - "same de-docketing and budget-notice compensation as from SCHEDULED"
          - "increments BoardMeeting.version by 1"

concurrency_rules:
  - rule_id: budget-create-stale-association
    parent_entity: Association
    write_endpoint: "POST /associations/{id}/budgets"
    occ_field: "expected_association_version"
    description: |
      Creating a Budget for a fiscal_year against an Association whose version has
      advanced since the client last read it is rejected. This captures the case
      where an earlier writer already created a budget that legitimately supersedes
      any DRAFT or PROPOSED budget for that fiscal_year, so the current writer's
      view of the association (and of which budget is live) is stale.
    error_id: ERR_STALE_ASSOCIATION_VERSION
    http_status: 412
  - rule_id: resale-cert-create-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /units/{id}/resale-certificates"
    occ_field: "expected_unit_version"
    description: |
      Creating a ResaleCertificate request against a Unit whose version has advanced
      since the client last read it is rejected. A new request legitimately voids any
      other REQUESTED certificate for the same unit, so a writer holding an outdated
      unit version would supersede a request it never saw and would quote payoff
      figures from a ledger state that has already moved.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
  - rule_id: work-order-create-stale-contract
    parent_entity: VendorContract
    write_endpoint: "POST /work-orders"
    occ_field: "expected_contract_version"
    description: |
      Creating a MaintenanceWorkOrder against a VendorContract whose version has
      advanced since the client last read it is rejected. Each new order encumbers
      part of contract_cap_cents, so a writer working from a stale contract version
      is computing remaining authorization from a committed_cents figure that an
      earlier encumbrance has already changed.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

calculations:
  - name: assessment_allocation
    trigger: "budget adoption (POST /budgets/{id}/ratify resulting in ADOPTED) writes Budget.allocation_snapshot and every Unit.monthly_assessment_cents; each POST /special-assessments/{id}/installments round reuses the same allocator"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - pin the pool in integer cents BEFORE any per-unit math
      pool_cents = round_half_up(budget.assessment_total_cents / 12)        # variant MONTHLY_OPERATING

      # STEP 2 - participants in a pinned deterministic order
      participants = every Unit with unit.association_id == budget.association_id,
                     ordered interest_bp DESC, then created_at ASC
      #             (no delinquency filter: every unit owes assessments)

      # STEP 3 - ROUND PER LINE ITEM (this order is pinned; "sum then round" is WRONG)
      for U in participants:
          share[U] = round_half_up(pool_cents * U.interest_bp / 10000)

      # STEP 4 - reconcile the rounding drift against the pinned pool
      remainder = pool_cents - sum(share[U] for U in participants)

      # STEP 5 - distribute the drift one cent at a time, cycling participants in the
      #          SAME pinned order; a negative remainder removes one cent per step
      i = 0
      while remainder != 0:
          U = participants[i mod len(participants)]
          step = +1 if remainder > 0 else -1
          share[U] = share[U] + step
          remainder = remainder - step
          i = i + 1

      Unit.monthly_assessment_cents = share[U]
      Budget.allocation_snapshot[U] = { unit_id, interest_bp, monthly_cents: share[U],
                                        remainder_cent_awarded: (share[U] != round_half_up(pool_cents * U.interest_bp / 10000)) }
      BillingRun.remainder_cents_allocated = abs(pool_cents - sum(step 3 values))
      # POST-CONDITION (must hold exactly): sum(share) == pool_cents
    input_set: "every Unit of the association regardless of delinquency_stage, voting_eligible or transfer_blocked; units created after adoption are NOT retro-allocated and keep monthly_assessment_cents 0 until the next adoption"
    constants:
      MONTHS_PER_YEAR: 12
      BP_DENOMINATOR: 10000
    precision: "integer cents; round_half_up applied per line item in STEP 3, then integer drift reconciliation in STEP 5; the pool is rounded once in STEP 1 and never re-rounded"
    variants:
      - name: MONTHLY_OPERATING
        when: "budget adoption"
        difference: "pool_cents = round_half_up(assessment_total_cents / 12)"
      - name: SA_INSTALLMENT
        when: "POST /special-assessments/{id}/installments round n of installment_count"
        difference: "pool_cents = round_half_up(total_amount_cents / installment_count) for rounds 1..installment_count-1; the FINAL round instead uses pool_cents = total_amount_cents - (sum of the pools already posted), so the posted installments sum to total_amount_cents exactly with no drift"

  - name: payment_application_waterfall
    trigger: "POST /units/{id}/payments and POST /special-assessments/{id}/refund (refunds run the same allocator in reverse over SPECIAL_ASSESSMENT bucket entries only)"
    algorithm: chronological
    formula: |
      remaining = abs(payment.amount_cents)
      BUCKET_ORDER = [INTEREST, LATE_FEE, COLLECTION_COST, FINE, ASSESSMENT, SPECIAL_ASSESSMENT]

      def open_charges(bucket):
          # POSTED charges only: a REVERSED charge is closed and never receives money
          return [ e for e in LedgerEntry
                   where e.unit_id == unit.id and e.status == POSTED
                     and e.bucket == bucket and e.amount_cents > 0
                     and (e.amount_cents - e.applied_cents) > 0 ]
                 ordered by due_on ASC, then posted_at ASC, then created_at ASC

      for bucket in effective_order:                     # see variants
          for c in open_charges(bucket):
              take = min(remaining, c.amount_cents - c.applied_cents)
              c.applied_cents = c.applied_cents + take
              append { bucket: bucket, target_entry_id: c.id, applied_cents: take }
                     to payment.applied_allocations
              remaining = remaining - take
              if remaining == 0: break out of both loops

      payment.unapplied_cents = remaining               # held as unapplied credit, never negative
      Unit.credit_balance_cents = sum(unapplied_cents over POSTED PAYMENT entries)
      # then Unit.balance_due_cents and oldest_unpaid_age_days are recomputed and the
      # delinquency ladder re-derives Unit.delinquency_stage
    input_set: "POSTED positive-amount LedgerEntry rows of the unit with unapplied capacity; REVERSED entries, zero-capacity entries and other units' entries are excluded"
    constants:
      BUCKET_ORDER: "[INTEREST, LATE_FEE, COLLECTION_COST, FINE, ASSESSMENT, SPECIAL_ASSESSMENT]"
    precision: "integer cents; no rounding occurs - every step is an integer min()"
    variants:
      - name: STATUTORY_PRIORITY
        when: "application_mode is omitted or STATUTORY, OR the unit's delinquency_stage IS IN {LIEN_FILED, FORECLOSURE_REFERRAL} (in which case an OWNER_DIRECTED request is silently forced onto this variant rather than rejected)"
        difference: "effective_order = BUCKET_ORDER verbatim"
      - name: OWNER_DIRECTED
        when: "application_mode == OWNER_DIRECTED with directed_bucket set AND delinquency_stage NOT IN {LIEN_FILED, FORECLOSURE_REFERRAL}"
        difference: "effective_order = [directed_bucket] + BUCKET_ORDER with directed_bucket removed. Identical payment amount against identical ledgers yields different applied_allocations, a different SpecialAssessment.collected_cents (hence a different funding_status), and a different oldest_unpaid_age_days (hence possibly a different delinquency_stage) than STATUTORY_PRIORITY"

  - name: late_fee_assessment
    trigger: "POST /associations/{id}/billing-runs, evaluated per Unit after the run's ASSESSMENT charges are posted"
    algorithm: threshold
    formula: |
      aging_days(e) = floor((run.executed_at - e.due_on) / 1 day)

      delinquent_principal = sum(e.amount_cents - e.applied_cents
                                 for e in LedgerEntry of unit
                                 where e.status == POSTED and e.bucket == ASSESSMENT
                                   and e.amount_cents > 0
                                   and aging_days(e) > association.late_fee_grace_days)
      #  BOUNDARY: aging_days == late_fee_grace_days (exactly 10) contributes NOTHING;
      #            the charge must be strictly older than the grace period.

      if delinquent_principal <= 0:
          fee = 0
      else:
          pct = round_half_up(delinquent_principal * association.late_fee_percent_bp / 10000)
          fee = min(max(pct, association.late_fee_min_cents), association.late_fee_cap_cents)
          if unit.delinquency_stage == FORECLOSURE_REFERRAL:
              fee = association.late_fee_min_cents      # collection is with counsel; only the floor accrues
      if a POSTED LATE_FEE LedgerEntry already exists for this unit with
         effective_period == run.period:
          fee = 0                                        # never two late fees for one period

      if fee > 0: post LATE_FEE entry (bucket LATE_FEE, amount_cents = +fee,
                                      due_on = run.due_on, effective_period = run.period)
    input_set: "POSTED ASSESSMENT-bucket charges of the unit strictly older than the grace period; SPECIAL_ASSESSMENT, FINE, COLLECTION_COST and INTEREST balances never enter the late-fee base"
    constants:
      GRACE_DAYS_DEFAULT: 10
      LATE_FEE_PERCENT_BP_DEFAULT: 1000
      LATE_FEE_MIN_CENTS_DEFAULT: 2500
      LATE_FEE_CAP_CENTS_DEFAULT: 10000
    precision: "integer cents; round_half_up on the percentage limb only, then integer max() floor and min() cap in that order (cap-then-floor would give a different answer when min > cap is misconfigured)"

  - name: unit_aging_and_balance
    trigger: "recomputed after every LedgerEntry insertion, every reversal, and once per Unit during each billing run"
    algorithm: aggregation
    formula: |
      # Balance includes EVERY entry of the unit, whatever its status. A REVERSAL entry
      # carries exactly the negative of the entry it reverses, so a reversed pair nets to
      # zero and no double counting occurs.
      balance_due_cents = sum(e.amount_cents for e in LedgerEntry where e.unit_id == unit.id)

      open = [ e for e in LedgerEntry of unit
               where e.status == POSTED and e.amount_cents > 0
                 and (e.amount_cents - e.applied_cents) > 0 ]
      oldest_unpaid_age_days = 0 if open is empty
                               else max(floor((clock_now - e.due_on) / 1 day) for e in open)
      #  BOUNDARY: an empty open set yields 0, never null and never a negative number,
      #            so a fully paid unit lands on ladder rule 1 (CURRENT).
      credit_balance_cents = sum(e.unapplied_cents for e in LedgerEntry of unit
                                 where e.status == POSTED and e.entry_type == PAYMENT)
      then re-derive delinquency_stage with the ladder in the Unit state machine note
    input_set: "all LedgerEntry rows of the unit for the balance; only POSTED positive-capacity rows for aging"
    precision: "integer cents; day counts are floor()ed whole days on the logical clock, never fractional"

  - name: reserve_adequacy
    trigger: "GET /associations/{id}/reserve-adequacy; also recomputed after any work order completion that resets a component's effective_age_years"
    algorithm: weighted_scoring
    formula: |
      components = [ c for c in CommonElement where c.association_id == association.id
                     and c.status != DECOMMISSIONED ]

      # per-component fully-funded basis, rounded PER COMPONENT then summed
      STRAIGHT_LINE_METHOD:
          ffb(c) = round_half_up(c.replacement_cost_cents
                                 * min(c.effective_age_years, c.useful_life_years)
                                 / c.useful_life_years)

      COMPONENT_METHOD:
          remaining(c) = max(c.useful_life_years - c.effective_age_years, 0)
          ffb(c) = 0 if remaining(c) > HORIZON_YEARS
                   else round_half_up(c.replacement_cost_cents
                                      * (HORIZON_YEARS - remaining(c)) / HORIZON_YEARS)

      fully_funded_cents = sum(ffb(c) for c in components)
      spendable_cents = association.reserve_balance_cents - association.reserve_designated_cents

      percent_funded_bp = 10000 if fully_funded_cents == 0
                          else floor(spendable_cents * 10000 / fully_funded_cents)
      #  BOUNDARY: zero components (empty set) reports 10000 / ADEQUATE, it does not divide by zero
      posture = ADEQUATE if percent_funded_bp >= association.reserve_adequacy_threshold_bp
                else DEFICIENT
      #  BOUNDARY: percent_funded_bp exactly equal to the threshold is ADEQUATE
    input_set: "CommonElements of the association with status != DECOMMISSIONED; designated reserve cash is subtracted from the numerator so litigation designations depress the score"
    constants:
      HORIZON_YEARS: 30
      RESERVE_ADEQUACY_THRESHOLD_BP_DEFAULT: 7000
    precision: "integer cents per component with round_half_up, summed afterwards; the ratio is floor()ed to basis points"
    variants:
      - name: STRAIGHT_LINE_METHOD
        when: "method query parameter omitted or STRAIGHT_LINE"
        difference: "the funding target accrues linearly with effective age over the component's whole useful life; every non-decommissioned component contributes something"
      - name: COMPONENT_METHOD
        when: "method=COMPONENT"
        difference: "the funding target is a 30-year cash-flow horizon: components with more than 30 years of remaining life contribute 0 and near-term components contribute far more, so the same reserve balance and the same component roster can report ADEQUATE under one method and DEFICIENT under the other"

  - name: deductible_waterfall
    trigger: "POST /insurance-claims/{id}/adjust with responsibility=SPLIT"
    algorithm: waterfall_allocation
    formula: |
      # The tier that decides the association's share is keyed on a total that LOOKS like it
      # should include the owner chargebacks it produces. The evaluation order below is
      # PINNED so the value is well defined; the owner exposure computed in step 5 is a
      # reported figure and is NEVER fed back into step 1.
      # step 1 - tier basis
      basis = claim.gross_damage_cents                     # only this, never owner exposure
      # step 2 - association share of the master-policy deductible
      assoc_share_bp = 10000 if basis < TIER_1_CEILING_CENTS
                       else 6000 if basis < TIER_2_CEILING_CENTS
                       else 3000
      # step 3 - association slice, capped by the by-laws cap
      raw_assoc = round_half_up(association.master_policy_deductible_cents * assoc_share_bp / 10000)
      association_absorbed_cents = min(raw_assoc, association.association_deductible_cap_cents)
      # step 4 - residue split across affected units pro-rata by heated_sqft
      residue = association.master_policy_deductible_cents - association_absorbed_cents
      units = [ Unit(u) for u in claim.affected_unit_ids ]
              ordered heated_sqft DESC, then created_at ASC
      total_sqft = sum(u.heated_sqft for u in units)        # units is non-empty by precondition
      for u in units:
          alloc[u] = floor(residue * u.heated_sqft / total_sqft)     # FLOOR here, not round
      drift = residue - sum(alloc[u] for u in units)        # 0 <= drift < len(units)
      for k in 0 .. drift-1:                               # one cent each, pinned order
          alloc[units[k]] = alloc[units[k]] + 1
      owner_chargeback_cents = sum(alloc[u] for u in units) # == residue exactly
      deductible_allocation = [ { unit_id, heated_sqft, allocated_cents: alloc[u] } in that order ]
      # step 5 - reported owner exposure (output only, not an input to step 1)
      owner_exposure(u) = claim.within_unit_boundary_cents_share(u) + alloc[u]
    input_set: "the Units named in claim.affected_unit_ids, no delinquency filter; an empty affected_unit_ids is rejected before this calculation runs"
    constants:
      TIER_1_CEILING_CENTS: 5000000
      TIER_2_CEILING_CENTS: 25000000
      TIER_1_ASSOC_SHARE_BP: 10000
      TIER_2_ASSOC_SHARE_BP: 6000
      TIER_3_ASSOC_SHARE_BP: 3000
    precision: "round_half_up once on the association slice in step 3; floor per unit in step 4 followed by integer drift distribution - deliberately a DIFFERENT remainder rule from assessment_allocation, which rounds per line and cycles the drift"

  - name: special_assessment_tally
    trigger: "POST /special-assessments/{id}/close-ballot"
    algorithm: threshold
    formula: |
      ballots = [ v for v in Vote where v.subject_type == SPECIAL_ASSESSMENT
                  and v.subject_id == sa.id and v.voter_kind == UNIT_OWNER
                  and sa.ballot_opened_at <= v.cast_at <= clock_now ]
      # one ballot per unit: the LATEST by cast_at wins, tie-break created_at DESC;
      # superseded ballots are marked counted = false
      per_unit = latest ballot per v.unit_id
      counted_ballots = [ v for v in per_unit where Unit(v.unit_id).voting_eligible == true ]
      for v in per_unit: v.counted = (v in counted_ballots)

      eligible_weight_bp = sum(u.interest_bp for u in Units of the association
                               where u.voting_eligible == true)
      #  a unit that never cast a ballot still sits in the denominator
      yes_weight_bp = sum(v.weight_bp for v in counted_ballots where v.choice == YES)
      if eligible_weight_bp == 0: reject with ERR_NO_ELIGIBLE_VOTERS   # empty-set boundary
      yes_share_bp = floor(yes_weight_bp * 10000 / eligible_weight_bp)
      approved = yes_share_bp >= association.special_assessment_approval_bp
      #  BOUNDARY: yes_share_bp exactly 6667 APPROVES; 6666 fails
      #  ABSTAIN ballots neither add to yes_weight_bp nor leave the denominator
    input_set: "owner ballots cast inside the open balloting window on units that are voting_eligible AT TALLY TIME (not at cast time); board votes on the same subject are ignored"
    constants:
      SPECIAL_ASSESSMENT_APPROVAL_BP_DEFAULT: 6667
    precision: "basis points, floor()ed; weights are integer interest_bp and are never rounded"

  - name: budget_ratification_tally
    trigger: "POST /budgets/{id}/ratify"
    algorithm: threshold
    formula: |
      ballots = [ v for v in Vote where v.subject_type == BUDGET and v.subject_id == budget.id
                  and v.voter_kind == UNIT_OWNER
                  and budget.notice_sent_at <= v.cast_at <= clock_now ]
      per_unit = latest ballot per v.unit_id by cast_at, tie-break created_at DESC
      # DELIBERATE CONTRAST with special_assessment_tally: veto rights survive delinquency,
      # so voting_eligible is NOT applied and the denominator is the WHOLE association.
      no_weight_bp = sum(v.weight_bp for v in per_unit where v.choice == NO)
      denominator = association.total_interest_bp        # always 10000, never eligible weight
      rejected = no_weight_bp >= association.budget_veto_bp
      #  BOUNDARY: no_weight_bp exactly 5000 REJECTS the budget; 4999 adopts it
      #  a zero-ballot ratification meeting ADOPTS (no_weight_bp == 0)
    input_set: "owner ballots on this budget cast at or after notice_sent_at; ballots cast before the notice (or before the notice was re-mailed after a return-to-draft) are excluded because their counted flag was cleared"
    constants:
      BUDGET_VETO_BP_DEFAULT: 5000
    precision: "basis points, integer arithmetic only"

  - name: fine_tier_selection
    trigger: "POST /violation-cases/{id}/hearing-decision with outcome=FINE"
    algorithm: tiered_pricing
    formula: |
      # walk the self-referential repeat chain
      chain = []
      cursor = case.prior_case_id
      while cursor != null:
          p = ViolationCase(cursor)
          if p.status IN {FINE_ASSESSED, FINE_UPHELD, CURED}
             and p.notice_sent_at >= case.notice_sent_at - association.repeat_lookback_days days:
              chain.append(p)
              cursor = p.prior_case_id
          else:
              cursor = null                # the chain stops at the first non-qualifying link
      prior_count = len(chain)
      #  DISMISSED and FINE_VACATED cases are never written as anyone's prior_case_id,
      #  so a vacated fine cannot inflate a later tier.

      fine_tier = 1 if prior_count == 0 else 2 if prior_count == 1 else 3
      raw = association.fine_tier_1_cents               if fine_tier == 1
            else association.fine_tier_2_cents          if fine_tier == 2
            else association.fine_tier_3_daily_cents * case.continuing_days
      fine_amount_cents = min(raw, association.fine_cap_cents)
      #  BOUNDARY: raw exactly equal to fine_cap_cents is charged in full (min keeps it);
      #            prior_count 1 -> tier 2, prior_count 2 -> tier 3
    input_set: "prior ViolationCases of the same unit_id and rule_code reachable through the prior_case_id chain whose notice_sent_at falls inside the lookback window and whose status is FINE_ASSESSED, FINE_UPHELD or CURED"
    constants:
      REPEAT_LOOKBACK_DAYS_DEFAULT: 365
      FINE_TIER_1_CENTS_DEFAULT: 5000
      FINE_TIER_2_CENTS_DEFAULT: 10000
      FINE_TIER_3_DAILY_CENTS_DEFAULT: 25000
      FINE_CAP_CENTS_DEFAULT: 250000
    precision: "integer cents; the daily rate is multiplied before the cap is applied"

  - name: resale_payoff
    trigger: "POST /resale-certificates/{id}/issue; re-read by GET /resale-certificates/{id}/lender-questionnaire"
    algorithm: forward_looking
    formula: |
      # actual/actual day convention on a HALF-OPEN seller interval [month_start, closing_date):
      # the closing day itself belongs to the buyer.
      month_start  = 00:00:00Z on the first day of the month containing closing_date
      month_days   = actual number of days in that calendar month
      seller_days  = floor((closing_date - month_start) / 1 day)
      buyer_days   = month_days - seller_days

      LEDGER_BALANCE:
          ledger_balance_cents   = unit.balance_due_cents
          proration_credit_cents = 0
          projected_payoff_cents = unit.balance_due_cents

      ESTIMATED_PAYOFF:
          ledger_balance_cents = unit.balance_due_cents
          future_periods = count of whole billing periods whose first day falls in
                           (clock_now, closing_date) and for which the unit has no
                           POSTED ASSESSMENT entry yet
          unbilled_sa = special_assessment_disclosure_cents (below)
          gross = unit.balance_due_cents
                  + future_periods * unit.monthly_assessment_cents
                  + unbilled_sa
          proration_credit_cents = round_half_up(unit.monthly_assessment_cents
                                                 * buyer_days / month_days)
          projected_payoff_cents = gross - proration_credit_cents

      special_assessment_disclosure_cents =
          sum over SpecialAssessment sa of the association with approval_status == APPROVED of
              ( allocated share of sa.total_amount_cents for this unit, computed with
                assessment_allocation variant SA_INSTALLMENT over the full total_amount_cents )
            - ( sum of POSTED SPECIAL_ASSESSMENT_INSTALLMENT amount_cents already charged
                to this unit for that sa )
      open_violation_count = count of ViolationCase of this unit with status NOT IN
          {CURED, DISMISSED, FINE_UPHELD, FINE_VACATED}
      disclosed_claim_ids = ids of InsuranceClaim of the association with
          disclosure_required == true, ordered created_at ASC
    input_set: "the unit's full ledger for the balance; only APPROVED special assessments for disclosure; only non-terminal violation cases for the open count; only claims with disclosure_required true for litigation disclosure"
    constants:
      DAY_COUNT_CONVENTION: "actual/actual, half-open [month_start, closing_date)"
    precision: "integer cents; the proration credit is round_half_up once at the end - prorating each future period separately and summing is explicitly NOT the pinned order"
    variants:
      - name: LEDGER_BALANCE
        when: "certificate.payoff_basis == LEDGER_BALANCE"
        difference: "reports today's ledger only; future assessments and the seller proration credit are both omitted, so the figure is lower than ESTIMATED_PAYOFF whenever any unbilled period or approved assessment exists"
      - name: ESTIMATED_PAYOFF
        when: "certificate.payoff_basis == ESTIMATED_PAYOFF"
        difference: "projects unbilled periods and approved special assessment shares forward to closing and then subtracts the buyer's share of the closing month, producing a different number from the same ledger"

  - name: unit_ledger_conservation_invariant
    trigger: "asserted after every ledger-mutating request and after every cascade that reverses an entry"
    algorithm: aggregation
    formula: |
      INVARIANT L (conserved quantity: owner ledger cents per Unit)
        unit.balance_due_cents == sum(e.amount_cents
                                      for e in LedgerEntry where e.unit_id == unit.id)

      Every compensating action posts a REVERSAL entry R with
        R.reverses_entry_id == E.id  and  R.amount_cents == -E.amount_cents  and
        R.status == POSTED           and  E.status becomes REVERSED
      so for each forward/compensating pair:
        balance_due_cents after (forward, then compensation) == balance_due_cents before forward
        (exact to the cent, with no residual applied_cents on E)

      Pairs that MUST satisfy INVARIANT L:
        (a) FINE_ASSESSED           <-> FINE_VACATED on appeal
        (b) certificate issue fee    <-> cascade void of that certificate
        (c) SA installment posting    <-> SpecialAssessment rescission
        (d) POST /units/{id}/charges  <-> POST /ledger-entries/{id}/reverse
      A cascade that voids a certificate but leaves the RESALE_FEE unreversed, or a
      vacatur that reverses only part of the fine, breaks INVARIANT L and is a defect.
    input_set: "all LedgerEntry rows of the unit, both POSTED and REVERSED"
    precision: "exact integer cents; no tolerance"

  - name: encumbrance_conservation_invariant
    trigger: "asserted after every work-order create, cancel, invoice, contract suspend/reinstate/terminate/expiry"
    algorithm: aggregation
    formula: |
      INVARIANT E (conserved quantity: contract authorization cents per VendorContract)
        contract.committed_cents == sum(w.encumbered_cents
                                        for w in MaintenanceWorkOrder
                                        where w.contract_id == contract.id
                                          and w.status IN {SCHEDULED, IN_PROGRESS, ON_HOLD, COMPLETED})
        contract.contract_cap_cents >= contract.committed_cents + contract.invoiced_cents

      Forward action: POST /work-orders encumbers estimated_cost_cents
      Compensating actions: POST /work-orders/{id}/cancel, contract termination, contract
                            expiry - each sets that order's encumbered_cents to 0 and
                            releases exactly estimated_cost_cents
      Round-trip requirement: create-then-cancel (or create-then-terminate) returns
        committed_cents to its exact pre-create value. A hold does NOT release the
        encumbrance (ON_HOLD is still inside the summation set), and invoicing swaps
        estimated_cost_cents out of committed_cents into invoiced_cents with no drift.

      INVARIANT S (conserved quantity: restricted special-assessment cash)
        association.restricted_sa_cash_cents == sum(sa.collected_cents - sa.refunded_cents
                                                    for sa in SpecialAssessment of the association)
        and a rescind-then-refund round trip drives it back to its pre-collection value.
    input_set: "work orders of the contract in non-terminal-or-completed statuses; CANCELLED and INVOICED orders contribute 0"
    precision: "exact integer cents; no tolerance"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for entity_backed roles (UnitOwner, BoardDirector, BoardTreasurer) X-User-ID resolves to an existing UnitOwner row; for BoardDirector/BoardTreasurer that owner's board_role must be DIRECTOR, PRESIDENT or TREASURER and is_seated must be true"
    error_id: ERR_ACTOR_NOT_RECOGNIZED
    http_status: 403
    applies_to: "all endpoints whose roles include UnitOwner, BoardDirector or BoardTreasurer"
  - priority: 4
    category: existence
    check: "path resources are resolved left to right and must exist: ERR_ASSOCIATION_NOT_FOUND, ERR_UNIT_NOT_FOUND, ERR_BUDGET_NOT_FOUND, ERR_MEETING_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND, ERR_ELEMENT_NOT_FOUND, ERR_OWNER_NOT_FOUND"
    error_id: ERR_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "foreign keys supplied in the request body exist (current_owner_id, source_budget_id, ratification_meeting_id, contract_id, element_id, claim_id, funding_claim_id, unit_id, voter_owner_id, new_owner_id, affected_unit_ids members)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints that accept foreign keys"
  - priority: 6
    category: business_constraint
    check: "field types, enum membership and numeric ranges are valid (interest_bp 1..10000, heated_sqft >= 1, installment_count 1..24, amount_cents non-zero, payment amount_cents > 0, fiscal_year 2020..2100, limit 1..100, offset >= 0)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
  - priority: 7
    category: auth
    check: "for owner-scoped operations the acting UnitOwner must be the Unit.current_owner_id of the target unit (appealing a fine, casting an owner ballot, reading a unit statement)"
    error_id: ERR_NOT_UNIT_OWNER
    http_status: 403
    applies_to: "POST /violation-cases/{id}/appeal, POST /votes, GET /units/{id}/statement"
  - priority: 8
    category: business_referential
    check: "every referenced entity belongs to the same Association as the target (unit, element, contract, meeting, claim, budget scope must match)"
    error_id: ERR_ASSOCIATION_SCOPE_MISMATCH
    http_status: 409
    applies_to: "all write endpoints that accept foreign keys"
  - priority: 9
    category: state
    check: "OCC guard: expected_association_version, expected_unit_version or expected_contract_version equals the current parent version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /associations/{id}/budgets (ERR_STALE_ASSOCIATION_VERSION), POST /units/{id}/resale-certificates (ERR_STALE_UNIT_VERSION), POST /work-orders (ERR_STALE_CONTRACT_VERSION)"
  - priority: 10
    category: state
    check: "the cited ViolationCase has already reached a terminal enforcement outcome (CURED, DISMISSED, FINE_UPHELD or FINE_VACATED) and cannot be re-noticed, re-docketed or re-decided"
    error_id: ERR_CASE_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /violation-cases/{id}/send-notice, /schedule-hearing, /hearing-decision, /mark-cured, /appeal"
  - priority: 11
    category: state
    check: "a case already CURED may not be docketed for a hearing (the specific terminal case that most often collides with docket capacity)"
    error_id: ERR_CASE_ALREADY_CURED
    http_status: 409
    applies_to: "POST /violation-cases/{id}/schedule-hearing"
  - priority: 12
    category: state
    check: "the target resource is in a state from which this transition is defined (per its state machine)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints; the entity-specific codes ERR_INVALID_BUDGET_STATE, ERR_INVALID_CONTRACT_STATE, ERR_INVALID_WORK_ORDER_STATE, ERR_INVALID_CLAIM_STATE, ERR_INVALID_CERTIFICATE_STATE, ERR_INVALID_MEETING_STATE and ERR_INVALID_BALLOT_STATE are used where declared"
  - priority: 13
    category: state
    check: "the hosting BoardMeeting is IN_SESSION when a ratification or hearing decision is recorded"
    error_id: ERR_MEETING_NOT_IN_SESSION
    http_status: 409
    applies_to: "POST /budgets/{id}/ratify, POST /violation-cases/{id}/hearing-decision"
  - priority: 14
    category: state
    check: "the hosting BoardMeeting has quorum_met true (seated_director_count >= board_quorum_seats)"
    error_id: ERR_BOARD_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /board-meetings/{id}/convene, POST /budgets/{id}/ratify, POST /violation-cases/{id}/hearing-decision"
  - priority: 15
    category: business_safety
    check: "segregation of duties: the director recording a hearing decision is not the case's reported_by_owner_id, and on an appeal round is also not the prior decision_owner_id; the manager who proposed a budget may not cast a ratification ballot on it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /violation-cases/{id}/hearing-decision, POST /votes"
  - priority: 16
    category: business_safety
    check: "the vendor's certificate of insurance must still be in force: contract.insurance_cert_expires_at > work order window_end when starting work, and > clock_now when activating or reinstating a contract"
    error_id: ERR_VENDOR_INSURANCE_LAPSED
    http_status: 409
    applies_to: "POST /work-orders/{id}/start, POST /vendor-contracts/{id}/activate, POST /vendor-contracts/{id}/reinstate"
  - priority: 17
    category: business_safety
    check: "a ResaleCertificate may not be issued for a unit whose delinquency_stage is FORECLOSURE_REFERRAL"
    error_id: ERR_CERT_BLOCKED_BY_FORECLOSURE
    http_status: 409
    applies_to: "POST /resale-certificates/{id}/issue"
  - priority: 18
    category: business_referential
    check: "the CommonElement is serviceable enough for the operation: status must not be DECOMMISSIONED to start or resume work, and must be SERVICEABLE or IMPAIRED for a board award"
    error_id: ERR_ELEMENT_NOT_SERVICEABLE
    http_status: 409
    applies_to: "POST /work-orders/{id}/start, POST /vendor-contracts/{id}/approve, POST /vendor-contracts/{id}/submit"
  - priority: 19
    category: business_referential
    check: "work order element_id equals the contract's covered_element_id"
    error_id: ERR_ELEMENT_CONTRACT_MISMATCH
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 20
    category: business_referential
    check: "the board's award is still valid: CommonElement.version equals contract.pinned_element_version"
    error_id: ERR_ELEMENT_SPEC_CHANGED
    http_status: 409
    applies_to: "POST /vendor-contracts/{id}/activate, POST /vendor-contracts/{id}/reinstate"
  - priority: 21
    category: business_referential
    check: "a claim may not advance litigation_status to IN_LITIGATION unless a SpecialAssessment with funding_claim_id equal to this claim has approval_status APPROVED"
    error_id: ERR_LITIGATION_FUNDING_MISSING
    http_status: 409
    applies_to: "POST /insurance-claims/{id}/litigation-stage"
  - priority: 22
    category: business_referential
    check: "a claim may not settle while any MaintenanceWorkOrder with claim_id equal to this claim has status NOT IN {INVOICED, CANCELLED}"
    error_id: ERR_CLAIM_WORK_OPEN
    http_status: 409
    applies_to: "POST /insurance-claims/{id}/settle"
  - priority: 23
    category: business_referential
    check: "closing requires a ResaleCertificate for the unit with status ISSUED and expires_at > clock_now"
    error_id: ERR_NO_VALID_CERTIFICATE
    http_status: 409
    applies_to: "POST /units/{id}/transfer-ownership"
  - priority: 24
    category: business_referential
    check: "the certificate's pinned snapshot is still current: Unit.version equals certificate.pinned_unit_version"
    error_id: ERR_CERTIFICATE_STALE
    http_status: 409
    applies_to: "POST /units/{id}/transfer-ownership"
  - priority: 25
    category: business_temporal
    check: "the statutory notice period is satisfied: the ratification meeting's scheduled_start is at least budget_notice_days after notice_sent_at when mailing, and clock_now is at least budget_notice_days after notice_sent_at when ratifying"
    error_id: ERR_NOTICE_PERIOD_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /budgets/{id}/send-notice, POST /budgets/{id}/ratify"
  - priority: 26
    category: business_temporal
    check: "the cure period has expired (clock_now strictly after cure_deadline_at) before a hearing may be docketed; conversely a cure recorded at exactly cure_deadline_at is still accepted"
    error_id: ERR_CURE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /violation-cases/{id}/schedule-hearing, POST /violation-cases/{id}/mark-cured"
  - priority: 27
    category: business_temporal
    check: "the appeal window is still open (clock_now <= appeal_deadline_at)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /violation-cases/{id}/appeal"
  - priority: 28
    category: business_temporal
    check: "the work order's window lies inside [contract.effective_from, contract.effective_to) and window_start < window_end"
    error_id: ERR_WINDOW_OUTSIDE_CONTRACT_TERM
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 29
    category: business_temporal
    check: "closed-interval outage overlap with buffer on the SAME CommonElement: reject when new.window_start <= existing.window_end + element_window_buffer_hours AND new.window_end >= existing.window_start - element_window_buffer_hours, over existing work orders with status IN {SCHEDULED, IN_PROGRESS, ON_HOLD}; touching endpoints collide"
    error_id: ERR_ELEMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 30
    category: business_temporal
    check: "half-open 30-minute docket slot occupancy on the SAME BoardMeeting: reject when [new.hearing_slot_start, new.hearing_slot_start + 30 min) intersects an existing docketed slot; back-to-back slots that merely touch are allowed, and the slot must lie inside [meeting.scheduled_start, meeting.scheduled_end)"
    error_id: ERR_HEARING_SLOT_TAKEN
    http_status: 409
    applies_to: "POST /violation-cases/{id}/schedule-hearing"
  - priority: 31
    category: business_constraint
    check: "meeting.hearing_slot_count < association.hearing_docket_capacity"
    error_id: ERR_HEARING_DOCKET_FULL
    http_status: 409
    applies_to: "POST /violation-cases/{id}/schedule-hearing"
  - priority: 32
    category: business_constraint
    check: "at most 2 ViolationCases with the same unit_id may be docketed to one BoardMeeting"
    error_id: ERR_UNIT_DOCKET_LIMIT
    http_status: 409
    applies_to: "POST /violation-cases/{id}/schedule-hearing"
  - priority: 33
    category: business_constraint
    check: "the meeting's agenda_kinds must contain the kind the operation needs (BUDGET_RATIFICATION for a budget notice/ratify, HEARING for a docketed hearing, CONTRACT_AWARD for an award vote)"
    error_id: ERR_AGENDA_KIND_MISSING
    http_status: 409
    applies_to: "POST /budgets/{id}/send-notice, POST /budgets/{id}/ratify, POST /violation-cases/{id}/schedule-hearing, POST /vendor-contracts/{id}/approve"
  - priority: 34
    category: business_constraint
    check: "an appeal hearing must be docketed to a different BoardMeeting than the one that hosted the previous round"
    error_id: ERR_SAME_MEETING_REHEARING
    http_status: 409
    applies_to: "POST /violation-cases/{id}/schedule-hearing"
  - priority: 35
    category: business_constraint
    check: "the sum of interest_bp over the association's Units equals exactly 10000 before a budget may be proposed, ratified, or a ballot opened"
    error_id: ERR_INTEREST_SUM_INVALID
    http_status: 422
    applies_to: "POST /budgets/{id}/propose, POST /budgets/{id}/ratify, POST /special-assessments/{id}/open-ballot"
  - priority: 36
    category: business_constraint
    check: "unit_label is unique within an association"
    error_id: ERR_UNIT_LABEL_DUPLICATE
    http_status: 409
    applies_to: "POST /associations/{id}/units"
  - priority: 37
    category: business_constraint
    check: "period is unique per association: a billing run for an already-billed YYYY-MM is rejected"
    error_id: ERR_PERIOD_ALREADY_BILLED
    http_status: 409
    applies_to: "POST /associations/{id}/billing-runs"
  - priority: 38
    category: business_constraint
    check: "the billing run's source_budget_id must have status ADOPTED and a fiscal_year covering period"
    error_id: ERR_BUDGET_NOT_ADOPTED
    http_status: 409
    applies_to: "POST /associations/{id}/billing-runs, POST /resale-certificates/{id}/issue"
  - priority: 39
    category: business_constraint
    check: "only one SpecialAssessment of an association may have approval_status BALLOTING at a time"
    error_id: ERR_BALLOT_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /special-assessments/{id}/open-ballot"
  - priority: 40
    category: business_constraint
    check: "closing a ballot requires a non-empty eligible electorate: eligible_weight_bp > 0 after recomputation"
    error_id: ERR_NO_ELIGIBLE_VOTERS
    http_status: 409
    applies_to: "POST /special-assessments/{id}/close-ballot"
  - priority: 41
    category: business_constraint
    check: "a SPLIT adjustment requires a non-empty affected_unit_ids; an empty array is rejected rather than allocating nothing"
    error_id: ERR_NO_AFFECTED_UNITS
    http_status: 422
    applies_to: "POST /insurance-claims/{id}/adjust"
  - priority: 42
    category: business_constraint
    check: "installments_posted < installment_count before a new installment round may be posted"
    error_id: ERR_INSTALLMENTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /special-assessments/{id}/installments"
  - priority: 43
    category: business_fiscal
    check: "reserve_contribution_cents >= round_half_up(operating_total_cents * reserve_contribution_min_bp / 10000); re-checked at ratification because the association's minimum may have changed since the proposal"
    error_id: ERR_RESERVE_CONTRIBUTION_TOO_LOW
    http_status: 422
    applies_to: "POST /budgets/{id}/propose, POST /budgets/{id}/ratify"
  - priority: 44
    category: business_fiscal
    check: "estimated_cost_cents + contract.committed_cents + contract.invoiced_cents <= contract.contract_cap_cents (equality is allowed, one cent more is not)"
    error_id: ERR_CONTRACT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /work-orders"
  - priority: 45
    category: business_fiscal
    check: "final_cost_cents <= floor(estimated_cost_cents * 11 / 10) and contract.invoiced_cents + final_cost_cents <= contract.contract_cap_cents"
    error_id: ERR_INVOICE_EXCEEDS_TOLERANCE
    http_status: 409
    applies_to: "POST /work-orders/{id}/invoice"
  - priority: 46
    category: business_fiscal
    check: "association.operating_cash_cents >= final_cost_cents at invoicing"
    error_id: ERR_INSUFFICIENT_OPERATING_CASH
    http_status: 409
    applies_to: "POST /work-orders/{id}/invoice"
  - priority: 47
    category: business_fiscal
    check: "refund amount_cents <= (special_assessment.collected_cents - special_assessment.refunded_cents)"
    error_id: ERR_REFUND_EXCEEDS_COLLECTED
    http_status: 409
    applies_to: "POST /special-assessments/{id}/refund"
  - priority: 48
    category: business_fiscal
    check: "a REVERSAL may only be posted against a LedgerEntry whose status is POSTED and whose amount_cents > 0; reversing an already REVERSED entry is rejected"
    error_id: ERR_ENTRY_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /ledger-entries/{id}/reverse"
  - priority: 49
    category: state
    check: "no other Budget of the association with the same fiscal_year already has status ADOPTED"
    error_id: ERR_DUPLICATE_ADOPTED_BUDGET
    http_status: 409
    applies_to: "POST /budgets/{id}/propose, POST /budgets/{id}/ratify"
  - priority: 50
    category: state
    check: "no ViolationCase docketed to this meeting is still HEARING_SCHEDULED at adjournment"
    error_id: ERR_HEARINGS_PENDING
    http_status: 409
    applies_to: "POST /board-meetings/{id}/adjourn"
  - priority: 51
    category: state
    check: "no Budget tied to this meeting is still NOTICED at adjournment"
    error_id: ERR_BUDGET_NOTICE_PENDING
    http_status: 409
    applies_to: "POST /board-meetings/{id}/adjourn"
  - priority: 52
    category: state
    check: "no MaintenanceWorkOrder of the contract is IN_PROGRESS when terminating"
    error_id: ERR_WORK_IN_PROGRESS
    http_status: 409
    applies_to: "POST /vendor-contracts/{id}/terminate"
  - priority: 53
    category: business_temporal
    check: "clock_now >= window_start when starting or resuming work"
    error_id: ERR_WINDOW_NOT_STARTED
    http_status: 409
    applies_to: "POST /work-orders/{id}/start"
  - priority: 54
    category: business_temporal
    check: "hearing_slot_start is aligned to a 30-minute boundary and the whole half-open slot lies inside [meeting.scheduled_start, meeting.scheduled_end)"
    error_id: ERR_SLOT_OUTSIDE_MEETING
    http_status: 422
    applies_to: "POST /violation-cases/{id}/schedule-hearing"
  - priority: 55
    category: business_temporal
    check: "effective_from < effective_to and insurance_cert_expires_at >= effective_to when submitting a contract for award"
    error_id: ERR_CONTRACT_TERM_INVALID
    http_status: 422
    applies_to: "POST /vendor-contracts/{id}/submit"
  - priority: 56
    category: business_temporal
    check: "closing_date >= clock_now when issuing a certificate"
    error_id: ERR_CERT_CLOSING_DATE_PAST
    http_status: 422
    applies_to: "POST /resale-certificates/{id}/issue"
  - priority: 57
    category: business_constraint
    check: "the requested responsibility matches the damage figures: OWNER requires within_unit_boundary_cents == gross_damage_cents, ASSOCIATION requires common_element_damage_cents > 0, SPLIT requires both within_unit_boundary_cents > 0 and common_element_damage_cents > 0"
    error_id: ERR_RESPONSIBILITY_MISMATCH
    http_status: 409
    applies_to: "POST /insurance-claims/{id}/adjust"
  - priority: 58
    category: business_constraint
    check: "appeal_round < 2 when appealing a denied claim"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /insurance-claims/{id}/appeal"
  - priority: 59
    category: business_referential
    check: "a claim names at least one of unit_id or element_id, and within_unit_boundary_cents <= gross_damage_cents"
    error_id: ERR_CLAIM_SCOPE_INVALID
    http_status: 422
    applies_to: "POST /insurance-claims, POST /insurance-claims/{id}/assign-adjuster"
  - priority: 60
    category: business_fiscal
    check: "a SpecialAssessment funding a claim whose litigation_status is IN_LITIGATION may not be rescinded"
    error_id: ERR_LITIGATION_ACTIVE
    http_status: 409
    applies_to: "POST /special-assessments/{id}/rescind"

endpoints:
  - method: POST
    path: "/associations"
    description: "register a condominium association with its by-law tunables"
    roles: [CommunityManager]
    code: 201
    input: ["legal_name", "fiscal_year_start_month?", "master_policy_deductible_cents?", "association_deductible_cap_cents?", "late_fee_grace_days?", "late_fee_percent_bp?", "late_fee_min_cents?", "late_fee_cap_cents?", "lien_threshold_cents?", "budget_veto_bp?", "special_assessment_approval_bp?", "board_quorum_seats?", "hearing_docket_capacity?", "element_window_buffer_hours?", "reserve_adequacy_threshold_bp?", "reserve_contribution_min_bp?", "fine_tier_1_cents?", "fine_tier_2_cents?", "fine_tier_3_daily_cents?", "fine_cap_cents?", "repeat_lookback_days?", "cure_period_days?", "appeal_window_days?", "budget_notice_days?", "certificate_validity_days?", "resale_cert_fee_cents?"]
    output: Association
    side_effects: ["initializes total_interest_bp 0, operating_cash_cents 0, reserve_balance_cents 0, version 1"]
  - method: GET
    path: "/associations/{association_id}"
    description: "read an association including its current version (needed for OCC on budget creation)"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, AssociationAttorney]
    code: 200
    output: Association
    side_effects: []
  - method: PATCH
    path: "/associations/{association_id}"
    description: "adjust by-law tunables and reserve/operating cash on hand"
    roles: [CommunityManager, BoardTreasurer]
    code: 200
    input: ["master_policy_deductible_cents?", "association_deductible_cap_cents?", "late_fee_grace_days?", "late_fee_percent_bp?", "late_fee_min_cents?", "late_fee_cap_cents?", "lien_threshold_cents?", "budget_veto_bp?", "special_assessment_approval_bp?", "board_quorum_seats?", "hearing_docket_capacity?", "element_window_buffer_hours?", "reserve_adequacy_threshold_bp?", "reserve_contribution_min_bp?", "fine_cap_cents?", "cure_period_days?", "appeal_window_days?", "budget_notice_days?", "resale_cert_fee_cents?", "operating_cash_cents?", "reserve_balance_cents?"]
    output: Association
    side_effects: ["increments Association.version by 1, which invalidates any expected_association_version a client captured earlier"]
  - method: GET
    path: "/associations/{association_id}/reserve-adequacy"
    description: "computed reserve funding report; data carries fully_funded_cents, spendable_cents, percent_funded_bp and posture"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, TitleAgent]
    code: 200
    input: ["method?"]
    output: Association
    side_effects: ["runs calculation reserve_adequacy with the STRAIGHT_LINE_METHOD or COMPONENT_METHOD variant; no persistence"]
  - method: POST
    path: "/associations/{association_id}/owners"
    description: "create a unit owner of record, optionally holding a board seat"
    roles: [CommunityManager]
    code: 201
    input: ["full_name", "email", "board_role?", "is_seated?"]
    output: UnitOwner
    side_effects: []
  - method: GET
    path: "/owners"
    description: "list unit owners, filterable by association"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, AssociationAttorney]
    code: 200
    input: ["association_id?", "board_role?", "limit?", "offset?"]
    output: UnitOwner[]
    side_effects: []
  - method: POST
    path: "/associations/{association_id}/units"
    description: "add a unit with its undivided interest and heated area"
    roles: [CommunityManager]
    code: 201
    input: [current_owner_id, unit_label, interest_bp, heated_sqft]
    output: Unit
    side_effects: ["recomputes Association.total_interest_bp and increments Association.version by 1", "increments the owner's owned_unit_count and UnitOwner.version by 1"]
  - method: GET
    path: "/units"
    description: "list units, filterable by association or owner of record"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, TitleAgent, AssociationAttorney]
    code: 200
    input: ["association_id?", "current_owner_id?", "delinquency_stage?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []
  - method: GET
    path: "/units/{unit_id}"
    description: "read a unit including balance_due_cents, delinquency_stage and version (needed for OCC on certificate requests)"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, UnitOwner, TitleAgent]
    code: 200
    output: Unit
    side_effects: []
  - method: GET
    path: "/units/{unit_id}/statement"
    description: "owner statement; data carries the per-bucket open balances and oldest_unpaid_age_days from calculation unit_aging_and_balance"
    roles: [CommunityManager, BoardTreasurer, UnitOwner]
    code: 200
    output: Unit
    side_effects: []
  - method: POST
    path: "/units/{unit_id}/payments"
    description: "record an owner payment and run the application waterfall"
    roles: [CommunityManager, BoardTreasurer, UnitOwner]
    code: 201
    input: ["amount_cents", "effective_period", "application_mode?", "directed_bucket?", "memo?"]
    output: LedgerEntry
    side_effects: ["runs calculation payment_application_waterfall (STATUTORY_PRIORITY or OWNER_DIRECTED variant)", "recomputes Unit.balance_due_cents, credit_balance_cents, oldest_unpaid_age_days and re-derives delinquency_stage; increments Unit.version by 1", "advances SpecialAssessment.funding_status when SPECIAL_ASSESSMENT-bucket charges receive money and increments Association.restricted_sa_cash_cents"]
  - method: POST
    path: "/units/{unit_id}/charges"
    description: "post a manual charge (collection cost, interest, or a corrective assessment) to a unit ledger"
    roles: [CommunityManager, BoardTreasurer]
    code: 201
    input: ["entry_type", "amount_cents", "due_on", "effective_period", "memo?"]
    output: LedgerEntry
    side_effects: ["derives bucket from entry_type", "recomputes Unit.balance_due_cents and re-derives delinquency_stage; increments Unit.version by 1"]
  - method: POST
    path: "/ledger-entries/{ledger_entry_id}/reverse"
    description: "post a compensating REVERSAL entry against a charge, preserving INVARIANT L"
    roles: [BoardTreasurer]
    code: 201
    input: ["memo?"]
    output: LedgerEntry
    side_effects: ["creates a REVERSAL entry with reverses_entry_id set and amount_cents = -original.amount_cents; the original flips to REVERSED", "recomputes Unit.balance_due_cents and re-derives delinquency_stage; increments Unit.version by 1"]
  - method: GET
    path: "/ledger-entries"
    description: "list ledger entries by unit, billing run, source case, special assessment, source claim or reversal target"
    roles: [CommunityManager, BoardTreasurer, UnitOwner, TitleAgent]
    code: 200
    input: ["unit_id?", "billing_run_id?", "source_case_id?", "special_assessment_id?", "source_claim_id?", "reverses_entry_id?", "entry_type?", "bucket?", "status?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: "/units/{unit_id}/transfer-ownership"
    description: "close a sale: consume the issued certificate and reassign the owner of record"
    roles: [CommunityManager]
    code: 200
    input: [new_owner_id, certificate_id]
    output: Unit
    side_effects: ["the ResaleCertificate becomes EXPIRED", "sets Unit.current_owner_id and transfer_blocked true; increments Unit.version by 1", "adjusts both UnitOwner.owned_unit_count values and increments each UnitOwner.version by 1"]
  - method: POST
    path: "/associations/{association_id}/budgets"
    description: "draft a budget for a fiscal year; supersedes any DRAFT or PROPOSED budget for the same year"
    roles: [CommunityManager]
    code: 201
    input: ["fiscal_year", "operating_total_cents", "reserve_contribution_cents", "ratification_meeting_id?", "expected_association_version"]
    output: Budget
    side_effects: ["OCC on Association.version via expected_association_version", "any DRAFT or PROPOSED budget for the same fiscal_year becomes SUPERSEDED and its BUDGET votes get counted false; the new budget records supersedes_budget_id", "increments Association.version by 1"]
  - method: GET
    path: "/budgets"
    description: "list budgets by association, superseded predecessor or ratification meeting"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, TitleAgent]
    code: 200
    input: ["association_id?", "supersedes_budget_id?", "ratification_meeting_id?", "status?", "fiscal_year?", "limit?", "offset?"]
    output: Budget[]
    side_effects: []
  - method: POST
    path: "/budgets/{budget_id}/propose"
    description: "manager proposes the draft to the board"
    roles: [CommunityManager]
    code: 200
    input: ["ratification_meeting_id?"]
    output: Budget
    side_effects: ["computes assessment_total_cents and monthly_assessable_cents", "increments Budget.version by 1"]
  - method: POST
    path: "/budgets/{budget_id}/send-notice"
    description: "mail the statutory ratification notice"
    roles: [CommunityManager]
    code: 200
    output: Budget
    side_effects: ["sets notice_sent_at", "promotes the ratification BoardMeeting from SCHEDULED to NOTICED and increments BoardMeeting.version by 1", "increments Budget.version by 1"]
  - method: POST
    path: "/budgets/{budget_id}/return-to-draft"
    description: "board pulls a proposed, noticed or rejected budget back for revision"
    roles: [BoardDirector]
    code: 200
    input: ["reason?"]
    output: Budget
    side_effects: ["increments revision_round; clears notice_sent_at when leaving NOTICED or REJECTED; marks this budget's votes counted false", "increments Budget.version by 1"]
  - method: POST
    path: "/budgets/{budget_id}/ratify"
    description: "tally owner veto ballots at the ratification meeting; adopts or rejects"
    roles: [BoardDirector]
    code: 200
    output: Budget
    side_effects: ["runs calculation budget_ratification_tally and writes no_weight_bp", "on ADOPTED: runs calculation assessment_allocation, writes allocation_snapshot and every Unit.monthly_assessment_cents, then cascades certificate voiding, fee reversal, balance recomputation, delinquency re-derivation and BALLOTING eligible_weight_bp recomputation", "on REJECTED: no allocation and no cascade", "increments Budget.version by 1"]
  - method: POST
    path: "/associations/{association_id}/billing-runs"
    description: "ops-run checkpoint: post the period's assessments, late fees, aging, and sweep expiries"
    roles: [CommunityManager]
    code: 201
    input: [source_budget_id, period, due_on]
    output: BillingRun
    side_effects: ["posts one ASSESSMENT LedgerEntry per Unit from Budget.allocation_snapshot", "runs calculation late_fee_assessment per Unit and posts LATE_FEE entries", "recomputes every Unit balance and aging and re-derives delinquency_stage, counting escalated_unit_count", "advances FINE_ASSESSED cases past their appeal window to FINE_UPHELD, counting fines_finalized_count", "suspends ACTIVE contracts whose insurance certificate has lapsed and expires contracts past effective_to, cascading their work orders", "expires ISSUED ResaleCertificates whose expires_at has passed"]
  - method: GET
    path: "/billing-runs"
    description: "list billing runs by association or source budget"
    roles: [CommunityManager, BoardTreasurer, BoardDirector]
    code: 200
    input: ["association_id?", "source_budget_id?", "period?", "limit?", "offset?"]
    output: BillingRun[]
    side_effects: []
  - method: POST
    path: "/associations/{association_id}/special-assessments"
    description: "draft a special assessment, optionally funding a tendered construction-defect matter"
    roles: [BoardTreasurer]
    code: 201
    input: ["purpose", "total_amount_cents", "installment_count", "funding_claim_id?", "expected_association_version"]
    output: SpecialAssessment
    side_effects: ["OCC on Association.version via expected_association_version", "increments Association.version by 1"]
  - method: GET
    path: "/special-assessments"
    description: "list special assessments by association or funding claim"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, TitleAgent, AssociationAttorney]
    code: 200
    input: ["association_id?", "funding_claim_id?", "approval_status?", "funding_status?", "limit?", "offset?"]
    output: SpecialAssessment[]
    side_effects: []
  - method: POST
    path: "/special-assessments/{special_assessment_id}/open-ballot"
    description: "open owner balloting"
    roles: [BoardDirector]
    code: 200
    output: SpecialAssessment
    side_effects: ["sets ballot_opened_at and requires_supermajority_disclosure", "increments SpecialAssessment.version by 1"]
  - method: POST
    path: "/special-assessments/{special_assessment_id}/close-ballot"
    description: "tally weighted owner ballots against the supermajority threshold"
    roles: [BoardDirector]
    code: 200
    output: SpecialAssessment
    side_effects: ["runs calculation special_assessment_tally, writes eligible_weight_bp, yes_weight_bp, ballot_closed_at and re-derives counted on every ballot", "on APPROVED increments Association.reserve_designated_cents by total_amount_cents and Association.version by 1", "increments SpecialAssessment.version by 1"]
  - method: POST
    path: "/special-assessments/{special_assessment_id}/installments"
    description: "post the next installment round to every unit ledger"
    roles: [BoardTreasurer]
    code: 201
    input: [due_on, effective_period]
    output: SpecialAssessment
    side_effects: ["runs calculation assessment_allocation variant SA_INSTALLMENT and posts one SPECIAL_ASSESSMENT_INSTALLMENT entry per Unit", "increments installments_posted and recomputes charged_cents", "recomputes every affected Unit balance and re-derives delinquency_stage; increments each Unit.version by 1", "increments SpecialAssessment.version by 1"]
  - method: POST
    path: "/special-assessments/{special_assessment_id}/rescind"
    description: "board rescinds an approved assessment and starts the refund path"
    roles: [BoardDirector]
    code: 200
    input: ["reason?"]
    output: SpecialAssessment
    side_effects: ["reverses every posted installment entry, recomputing affected Unit balances and delinquency stages", "decrements Association.reserve_designated_cents by total_amount_cents and increments Association.version by 1", "sets funding_status REFUNDING when collected_cents > 0 else REFUNDED", "increments SpecialAssessment.version by 1"]
  - method: POST
    path: "/special-assessments/{special_assessment_id}/refund"
    description: "refund collected special-assessment cash to a unit as a credit"
    roles: [BoardTreasurer]
    code: 201
    input: ["unit_id", "amount_cents", "effective_period", "memo?"]
    output: LedgerEntry
    side_effects: ["posts a CREDIT_REFUND entry (negative amount) tagged with special_assessment_id", "increases refunded_cents; when refunded_cents reaches collected_cents funding_status becomes REFUNDED and Association.restricted_sa_cash_cents is decremented", "recomputes Unit.balance_due_cents and re-derives delinquency_stage; increments Unit.version by 1"]
  - method: POST
    path: "/votes"
    description: "cast a board vote (with meeting_id) or a weighted owner ballot (with unit_id)"
    roles: [BoardDirector, BoardTreasurer, UnitOwner]
    code: 201
    input: ["association_id", "subject_type", "subject_id", "choice", "voter_owner_id", "meeting_id?", "unit_id?"]
    output: Vote
    side_effects: ["derives voter_kind, weight_bp from Unit.interest_bp and counted from Unit.voting_eligible", "an earlier ballot by the same unit on the same subject stays stored but loses at tally time", "recomputes VendorContract.approval_yes_count when subject_type is VENDOR_CONTRACT and increments VendorContract.version by 1"]
  - method: GET
    path: "/votes"
    description: "list votes and ballots by association, meeting, unit, voter or subject"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, AssociationAttorney]
    code: 200
    input: ["association_id?", "meeting_id?", "unit_id?", "voter_owner_id?", "subject_id?", "subject_type?", "limit?", "offset?"]
    output: Vote[]
    side_effects: []
  - method: POST
    path: "/associations/{association_id}/board-meetings"
    description: "schedule a board meeting with its agenda kinds"
    roles: [CommunityManager]
    code: 201
    input: [scheduled_start, scheduled_end, agenda_kinds]
    output: BoardMeeting
    side_effects: []
  - method: GET
    path: "/board-meetings"
    description: "list board meetings by association"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, UnitOwner]
    code: 200
    input: ["association_id?", "status?", "limit?", "offset?"]
    output: BoardMeeting[]
    side_effects: []
  - method: POST
    path: "/board-meetings/{board_meeting_id}/send-notice"
    description: "mail the meeting notice"
    roles: [CommunityManager]
    code: 200
    output: BoardMeeting
    side_effects: ["sets notice_sent_at", "increments BoardMeeting.version by 1"]
  - method: POST
    path: "/board-meetings/{board_meeting_id}/convene"
    description: "convene the meeting and record seated directors for quorum"
    roles: [CommunityManager]
    code: 200
    input: [attending_owner_ids]
    output: BoardMeeting
    side_effects: ["writes seated_director_count and quorum_met", "increments BoardMeeting.version by 1"]
  - method: POST
    path: "/board-meetings/{board_meeting_id}/adjourn"
    description: "adjourn the meeting once no docketed hearing and no noticed budget remain undecided"
    roles: [CommunityManager]
    code: 200
    output: BoardMeeting
    side_effects: ["increments BoardMeeting.version by 1"]
  - method: POST
    path: "/board-meetings/{board_meeting_id}/cancel"
    description: "cancel a scheduled or noticed meeting, de-docketing hearings and voiding budget notices"
    roles: [CommunityManager]
    code: 200
    input: ["reason?"]
    output: BoardMeeting
    side_effects: ["round-1 hearings return to NOTICE_SENT and appeal hearings return to APPEALED; hearing_slot_count becomes 0", "NOTICED budgets tied to this meeting return to PROPOSED with notice_sent_at cleared", "increments BoardMeeting.version by 1"]
  - method: POST
    path: "/associations/{association_id}/common-elements"
    description: "register a common element / reserve component"
    roles: [CommunityManager]
    code: 201
    input: [name, element_class, replacement_cost_cents, useful_life_years, effective_age_years]
    output: CommonElement
    side_effects: ["derives is_life_safety from element_class"]
  - method: GET
    path: "/common-elements"
    description: "list common elements by association"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, TitleAgent]
    code: 200
    input: ["association_id?", "element_class?", "status?", "limit?", "offset?"]
    output: CommonElement[]
    side_effects: []
  - method: PATCH
    path: "/common-elements/{common_element_id}"
    description: "revise a component's specification or serviceability"
    roles: [CommunityManager]
    code: 200
    input: ["replacement_cost_cents?", "useful_life_years?", "effective_age_years?", "status?", "reserve_designated_cents?"]
    output: CommonElement
    side_effects: ["increments CommonElement.version by 1, which invalidates any VendorContract.pinned_element_version captured at board approval"]
  - method: POST
    path: "/associations/{association_id}/vendor-contracts"
    description: "draft a vendor contract covering one common element"
    roles: [CommunityManager]
    code: 201
    input: [covered_element_id, vendor_name, contract_cap_cents, insurance_cert_expires_at, effective_from, effective_to]
    output: VendorContract
    side_effects: []
  - method: GET
    path: "/vendor-contracts"
    description: "list vendor contracts by association or covered element"
    roles: [CommunityManager, BoardDirector, BoardTreasurer]
    code: 200
    input: ["association_id?", "covered_element_id?", "status?", "limit?", "offset?"]
    output: VendorContract[]
    side_effects: []
  - method: PATCH
    path: "/vendor-contracts/{vendor_contract_id}/insurance-certificate"
    description: "record a renewed certificate of insurance"
    roles: [CommunityManager]
    code: 200
    input: [insurance_cert_expires_at]
    output: VendorContract
    side_effects: ["increments VendorContract.version by 1"]
  - method: POST
    path: "/vendor-contracts/{vendor_contract_id}/submit"
    description: "submit the draft for a board award vote"
    roles: [CommunityManager]
    code: 200
    output: VendorContract
    side_effects: ["increments VendorContract.version by 1"]
  - method: POST
    path: "/vendor-contracts/{vendor_contract_id}/approve"
    description: "record the board award; pins the element version the award was based on"
    roles: [BoardDirector]
    code: 200
    output: VendorContract
    side_effects: ["writes approval_yes_count and pinned_element_version", "increments VendorContract.version by 1"]
  - method: POST
    path: "/vendor-contracts/{vendor_contract_id}/activate"
    description: "activate an awarded contract inside its term"
    roles: [CommunityManager]
    code: 200
    output: VendorContract
    side_effects: ["increments VendorContract.version by 1"]
  - method: POST
    path: "/vendor-contracts/{vendor_contract_id}/suspend"
    description: "suspend an active contract, holding its open work orders"
    roles: [CommunityManager]
    code: 200
    input: [suspension_reason]
    output: VendorContract
    side_effects: ["SCHEDULED and IN_PROGRESS work orders become ON_HOLD with hold_reason CONTRACT_SUSPENDED; encumbrances are retained", "increments VendorContract.version by 1"]
  - method: POST
    path: "/vendor-contracts/{vendor_contract_id}/reinstate"
    description: "reinstate a suspended contract once insurance and element pinning are valid again"
    roles: [CommunityManager]
    code: 200
    output: VendorContract
    side_effects: ["ON_HOLD work orders held for CONTRACT_SUSPENDED return to SCHEDULED", "increments VendorContract.version by 1"]
  - method: POST
    path: "/vendor-contracts/{vendor_contract_id}/terminate"
    description: "terminate a contract, cancelling its open work orders and releasing encumbrances"
    roles: [BoardDirector]
    code: 200
    input: ["reason?"]
    output: VendorContract
    side_effects: ["SCHEDULED and ON_HOLD work orders become CANCELLED with encumbered_cents 0", "recomputes committed_cents per INVARIANT E", "increments VendorContract.version by 1"]
  - method: POST
    path: "/work-orders"
    description: "schedule maintenance work in an outage window, encumbering the contract cap"
    roles: [CommunityManager]
    code: 201
    input: ["contract_id", "element_id", "scope", "window_start", "window_end", "estimated_cost_cents", "is_emergency?", "claim_id?", "expected_contract_version"]
    output: MaintenanceWorkOrder
    side_effects: ["OCC on VendorContract.version via expected_contract_version", "sets encumbered_cents = estimated_cost_cents and increases contract.committed_cents by the same amount; increments VendorContract.version by 1"]
  - method: GET
    path: "/work-orders"
    description: "list work orders by association, contract, element or driving claim"
    roles: [CommunityManager, BoardDirector, BoardTreasurer]
    code: 200
    input: ["association_id?", "contract_id?", "element_id?", "claim_id?", "status?", "limit?", "offset?"]
    output: MaintenanceWorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{work_order_id}/start"
    description: "start scheduled work or resume a held order"
    roles: [CommunityManager]
    code: 200
    output: MaintenanceWorkOrder
    side_effects: ["CommonElement.status becomes OUT_OF_SERVICE for life-safety elements else IMPAIRED; increments CommonElement.version by 1", "clears hold_reason", "increments MaintenanceWorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{work_order_id}/hold"
    description: "put work in progress on hold without releasing the encumbrance"
    roles: [CommunityManager]
    code: 200
    input: [hold_reason]
    output: MaintenanceWorkOrder
    side_effects: ["CommonElement.status becomes IMPAIRED; increments CommonElement.version by 1", "increments MaintenanceWorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{work_order_id}/complete"
    description: "complete the work, optionally resetting the component's effective age"
    roles: [CommunityManager]
    code: 200
    input: ["resets_component?"]
    output: MaintenanceWorkOrder
    side_effects: ["CommonElement.status becomes SERVICEABLE and last_serviced_at is stamped; effective_age_years becomes 0 when resets_component is true, changing calculation reserve_adequacy", "increments CommonElement.version by 1 and MaintenanceWorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{work_order_id}/invoice"
    description: "invoice completed work within the overrun tolerance and the contract cap"
    roles: [CommunityManager, BoardTreasurer]
    code: 200
    input: [final_cost_cents]
    output: MaintenanceWorkOrder
    side_effects: ["encumbered_cents becomes 0; contract.committed_cents falls by estimated_cost_cents and invoiced_cents rises by final_cost_cents; increments VendorContract.version by 1", "decrements Association.operating_cash_cents and increments Association.version by 1", "increments MaintenanceWorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{work_order_id}/cancel"
    description: "cancel a scheduled or held order, releasing exactly its encumbrance"
    roles: [CommunityManager]
    code: 200
    input: ["reason?"]
    output: MaintenanceWorkOrder
    side_effects: ["encumbered_cents becomes 0 and contract.committed_cents falls by exactly that amount per INVARIANT E; increments VendorContract.version by 1", "CommonElement.status returns to SERVICEABLE when no other order or open claim keeps it impaired", "increments MaintenanceWorkOrder.version by 1"]
  - method: POST
    path: "/insurance-claims"
    description: "report a loss under the master policy"
    roles: [CommunityManager]
    code: 201
    input: ["association_id", "loss_type", "loss_at", "gross_damage_cents", "within_unit_boundary_cents", "unit_id?", "element_id?", "affected_unit_ids?"]
    output: InsuranceClaim
    side_effects: ["stamps reported_at from the logical clock"]
  - method: GET
    path: "/insurance-claims"
    description: "list claims by association, originating unit or damaged element"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, InsuranceAdjuster, AssociationAttorney, TitleAgent]
    code: 200
    input: ["association_id?", "unit_id?", "element_id?", "adjustment_status?", "litigation_status?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []
  - method: POST
    path: "/insurance-claims/{insurance_claim_id}/assign-adjuster"
    description: "take a reported or appealed claim under review"
    roles: [InsuranceAdjuster]
    code: 200
    output: InsuranceClaim
    side_effects: ["computes common_element_damage_cents", "increments InsuranceClaim.version by 1"]
  - method: POST
    path: "/insurance-claims/{insurance_claim_id}/adjust"
    description: "delineate association versus unit-owner responsibility and allocate the master-policy deductible"
    roles: [InsuranceAdjuster]
    code: 200
    input: [responsibility]
    output: InsuranceClaim
    side_effects: ["ASSOCIATION: absorbs the capped deductible and debits operating cash", "OWNER: charges the whole deductible back to unit_id", "SPLIT: runs calculation deductible_waterfall and posts one chargeback entry per allocation row in allocation order", "DENY: no ledger and no cash movement", "recomputes each affected Unit balance and delinquency stage; increments Unit, Association, CommonElement and InsuranceClaim versions as applicable"]
  - method: POST
    path: "/insurance-claims/{insurance_claim_id}/appeal"
    description: "appeal a denial back into review"
    roles: [CommunityManager, UnitOwner]
    code: 200
    input: ["reason?"]
    output: InsuranceClaim
    side_effects: ["increments appeal_round and InsuranceClaim.version by 1"]
  - method: POST
    path: "/insurance-claims/{insurance_claim_id}/litigation-stage"
    description: "advance the independent litigation dimension for a construction-defect matter"
    roles: [AssociationAttorney]
    code: 200
    input: [stage]
    output: InsuranceClaim
    side_effects: ["TENDERED sets disclosure_required true and voids issued certificates of affected units, reversing their fees and recomputing balances", "IN_LITIGATION requires an APPROVED funding assessment", "RESOLVED clears disclosure_required", "increments InsuranceClaim.version by 1"]
  - method: POST
    path: "/insurance-claims/{insurance_claim_id}/settle"
    description: "settle an adjusted claim once its repair work is closed out"
    roles: [InsuranceAdjuster]
    code: 200
    output: InsuranceClaim
    side_effects: ["CommonElement.status returns to SERVICEABLE when no work keeps it impaired", "increments InsuranceClaim.version by 1"]
  - method: POST
    path: "/violation-cases"
    description: "open a rules-enforcement case against a unit"
    roles: [CommunityManager, BoardDirector]
    code: 201
    input: ["association_id", "unit_id", "rule_code", "reported_by_owner_id", "continuing_days?"]
    output: ViolationCase
    side_effects: []
  - method: GET
    path: "/violation-cases"
    description: "list cases by association, unit, repeat predecessor, reporter, decider, hearing meeting or fine entry"
    roles: [CommunityManager, BoardDirector, BoardTreasurer, UnitOwner, TitleAgent]
    code: 200
    input: ["association_id?", "unit_id?", "prior_case_id?", "reported_by_owner_id?", "decision_owner_id?", "hearing_meeting_id?", "fine_entry_id?", "status?", "rule_code?", "limit?", "offset?"]
    output: ViolationCase[]
    side_effects: []
  - method: POST
    path: "/violation-cases/{violation_case_id}/send-notice"
    description: "mail the violation notice, starting the cure period and resolving the repeat chain"
    roles: [CommunityManager]
    code: 200
    output: ViolationCase
    side_effects: ["sets notice_sent_at, cure_deadline_at and prior_case_id", "increments ViolationCase.version by 1"]
  - method: POST
    path: "/violation-cases/{violation_case_id}/mark-cured"
    description: "record a cure inside the cure period"
    roles: [CommunityManager]
    code: 200
    output: ViolationCase
    side_effects: ["increments ViolationCase.version by 1"]
  - method: POST
    path: "/violation-cases/{violation_case_id}/schedule-hearing"
    description: "docket the case into a half-open 30-minute hearing slot on a board meeting"
    roles: [BoardDirector]
    code: 200
    input: [hearing_meeting_id, hearing_slot_start]
    output: ViolationCase
    side_effects: ["sets hearing_meeting_id and hearing_slot_start; sets hearing_round to 1 or increments it on an appeal re-docket", "increments BoardMeeting.hearing_slot_count and BoardMeeting.version by 1", "increments ViolationCase.version by 1"]
  - method: POST
    path: "/violation-cases/{violation_case_id}/hearing-decision"
    description: "record the hearing outcome; FINE or DISMISS on round 1, UPHOLD or VACATE on appeal rounds"
    roles: [BoardDirector]
    code: 200
    input: [outcome]
    output: ViolationCase
    side_effects: ["FINE: runs calculation fine_tier_selection, posts the FINE entry, recomputes the unit balance and delinquency stage, sets appeal_deadline_at", "DISMISS: no ledger effect and the case leaves the repeat chain", "UPHOLD: the fine stands untouched", "VACATE: reverses the fine entry and cascades balance, delinquency, BALLOTING eligible weight and certificate voiding", "sets decision_owner_id and increments ViolationCase.version by 1"]
  - method: POST
    path: "/violation-cases/{violation_case_id}/appeal"
    description: "owner appeals an assessed fine inside the appeal window"
    roles: [UnitOwner]
    code: 200
    input: ["grounds?"]
    output: ViolationCase
    side_effects: ["releases the docket slot on the former hearing meeting and decrements its hearing_slot_count", "the FINE entry stays POSTED during the appeal", "increments ViolationCase.version by 1"]
  - method: POST
    path: "/units/{unit_id}/resale-certificates"
    description: "title agent requests a resale certificate; supersedes any other REQUESTED certificate for the unit"
    roles: [TitleAgent, CommunityManager]
    code: 201
    input: ["closing_date", "payoff_basis?", "requesting_agent_id", "expected_unit_version"]
    output: ResaleCertificate
    side_effects: ["OCC on Unit.version via expected_unit_version", "any other REQUESTED certificate for this unit becomes VOIDED with requires_reissue false", "increments Unit.version by 1"]
  - method: GET
    path: "/resale-certificates"
    description: "list certificates by unit, pinned budget or fee entry"
    roles: [CommunityManager, TitleAgent, BoardTreasurer, UnitOwner]
    code: 200
    input: ["unit_id?", "pinned_budget_id?", "cert_fee_entry_id?", "status?", "limit?", "offset?"]
    output: ResaleCertificate[]
    side_effects: []
  - method: POST
    path: "/resale-certificates/{resale_certificate_id}/issue"
    description: "issue the certificate: post the fee, compute the payoff, pin the snapshot"
    roles: [CommunityManager]
    code: 200
    output: ResaleCertificate
    side_effects: ["posts the RESALE_FEE entry and recomputes the unit balance and delinquency stage, incrementing Unit.version by 1", "then pins pinned_unit_version, pinned_budget_id and pinned_budget_version", "runs calculation resale_payoff for ledger_balance_cents, projected_payoff_cents and proration_credit_cents, and writes open_violation_count, special_assessment_disclosure_cents and disclosed_claim_ids", "sets issued_at, expires_at and Unit.transfer_blocked false", "increments ResaleCertificate.version by 1"]
  - method: POST
    path: "/resale-certificates/{resale_certificate_id}/void"
    description: "operator voids an issued certificate without refunding the fee"
    roles: [CommunityManager]
    code: 200
    input: ["reason?"]
    output: ResaleCertificate
    side_effects: ["requires_reissue stays false and the RESALE_FEE entry stays POSTED", "recomputes Unit.transfer_blocked and increments Unit.version by 1", "increments ResaleCertificate.version by 1"]
  - method: GET
    path: "/resale-certificates/{resale_certificate_id}/lender-questionnaire"
    description: "computed lender questionnaire; data carries the payoff figures, delinquency posture, open violations, approved special assessments and disclosed litigation matters"
    roles: [TitleAgent, CommunityManager, BoardTreasurer]
    code: 200
    output: ResaleCertificate
    side_effects: ["re-reads calculation resale_payoff without persisting; a certificate whose pinned_unit_version no longer matches Unit.version is reported with requires_reissue true"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, aging, notice, cure, appeal and expiry rule measures against this clock."
    roles: [CommunityManager]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["no entity is mutated; subsequent requests observe the new logical now"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_ACTOR_NOT_RECOGNIZED
    http: 403
    condition: "an entity_backed actor's X-User-ID does not resolve to a UnitOwner, or a board role's owner is not seated with a board_role"
  - id: ERR_NOT_UNIT_OWNER
    http: 403
    condition: "an owner-scoped operation is attempted by a UnitOwner who is not the target Unit's current_owner_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the director recording a hearing decision reported the violation, or reviews their own earlier decision on an appeal round; or the manager who proposed a budget casts a ballot on it"
  - id: ERR_ASSOCIATION_NOT_FOUND
    http: 404
    condition: "path association_id does not exist"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "a referenced UnitOwner does not exist"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "path or body unit_id does not exist"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "path ledger_entry_id does not exist"
  - id: ERR_BUDGET_NOT_FOUND
    http: 404
    condition: "path or body budget id does not exist"
  - id: ERR_MEETING_NOT_FOUND
    http: 404
    condition: "path or body board meeting id does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "path special_assessment_id does not exist"
  - id: ERR_ELEMENT_NOT_FOUND
    http: 404
    condition: "path or body common element id does not exist"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "path or body vendor contract id does not exist"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "path work_order_id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "path or body insurance claim id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "path violation_case_id does not exist"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "path or body resale certificate id does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body names no existing row"
  - id: ERR_VALIDATION
    http: 422
    condition: "field type, enum membership or numeric range violation, including interest_bp outside 1..10000, non-positive payment amount_cents, installment_count outside 1..24 and pagination limit outside 1..100"
  - id: ERR_ASSOCIATION_SCOPE_MISMATCH
    http: 409
    condition: "a referenced unit, element, contract, meeting, claim or budget belongs to a different Association than the target"
  - id: ERR_STALE_ASSOCIATION_VERSION
    http: 412
    condition: "expected_association_version does not equal the current Association.version on budget or special-assessment creation"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not equal the current Unit.version on resale-certificate creation"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the current VendorContract.version on work-order creation"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target entity is not in a state from which the requested transition is defined and no entity-specific code applies"
  - id: ERR_INVALID_BUDGET_STATE
    http: 409
    condition: "budget action attempted from a status that does not define it (e.g. ratifying a DRAFT or SUPERSEDED budget)"
  - id: ERR_INVALID_BALLOT_STATE
    http: 409
    condition: "ballot action attempted from the wrong approval_status (opening a ballot on an APPROVED assessment, closing a ballot that was never opened, posting installments before approval, refunding when funding_status is not REFUNDING)"
  - id: ERR_INVALID_MEETING_STATE
    http: 409
    condition: "meeting action attempted from the wrong status (convening a SCHEDULED meeting that was never noticed, cancelling an ADJOURNED meeting)"
  - id: ERR_INVALID_CONTRACT_STATE
    http: 409
    condition: "contract action attempted from the wrong status (activating a DRAFT contract, reinstating an ACTIVE one, suspending a TERMINATED one)"
  - id: ERR_INVALID_WORK_ORDER_STATE
    http: 409
    condition: "work order action attempted from the wrong status (invoicing an order that is not COMPLETED, cancelling an IN_PROGRESS order, holding a SCHEDULED order)"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "claim action attempted from the wrong adjustment_status or litigation_status (adjusting a REPORTED claim, tendering litigation on a non-defect loss, settling a DENIED claim)"
  - id: ERR_INVALID_CERTIFICATE_STATE
    http: 409
    condition: "certificate action attempted from the wrong status (issuing an already ISSUED certificate, voiding a VOIDED one)"
  - id: ERR_CASE_ALREADY_TERMINAL
    http: 409
    condition: "enforcement action on a case already in CURED, DISMISSED, FINE_UPHELD or FINE_VACATED"
  - id: ERR_CASE_ALREADY_CURED
    http: 409
    condition: "a hearing is requested for a case whose status is CURED"
  - id: ERR_DUPLICATE_ADOPTED_BUDGET
    http: 409
    condition: "another Budget of the association for the same fiscal_year already has status ADOPTED"
  - id: ERR_MEETING_NOT_IN_SESSION
    http: 409
    condition: "a ratification or hearing decision is recorded while the hosting meeting is not IN_SESSION"
  - id: ERR_BOARD_QUORUM_NOT_MET
    http: 409
    condition: "seated_director_count from the attendance list is below association.board_quorum_seats"
  - id: ERR_HEARINGS_PENDING
    http: 409
    condition: "adjournment attempted while a docketed case is still HEARING_SCHEDULED"
  - id: ERR_BUDGET_NOTICE_PENDING
    http: 409
    condition: "adjournment attempted while a Budget tied to the meeting is still NOTICED"
  - id: ERR_AGENDA_KIND_MISSING
    http: 409
    condition: "the meeting's agenda_kinds lacks the kind the operation requires (BUDGET_RATIFICATION, HEARING or CONTRACT_AWARD)"
  - id: ERR_NOTICE_PERIOD_NOT_SATISFIED
    http: 409
    condition: "the ratification meeting is closer than budget_notice_days to the notice, or ratification is attempted before the notice period elapses"
  - id: ERR_CURE_PERIOD_ACTIVE
    http: 409
    condition: "a hearing is docketed at or before cure_deadline_at, or a cure is recorded after cure_deadline_at"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "a fine appeal is filed after appeal_deadline_at"
  - id: ERR_SAME_MEETING_REHEARING
    http: 409
    condition: "an appeal hearing is docketed to the same BoardMeeting that hosted the previous round"
  - id: ERR_HEARING_SLOT_TAKEN
    http: 409
    condition: "the requested half-open 30-minute slot intersects another docketed slot on the same meeting"
  - id: ERR_SLOT_OUTSIDE_MEETING
    http: 422
    condition: "hearing_slot_start is not on a 30-minute boundary or the slot leaves [meeting.scheduled_start, meeting.scheduled_end)"
  - id: ERR_HEARING_DOCKET_FULL
    http: 409
    condition: "meeting.hearing_slot_count has reached association.hearing_docket_capacity"
  - id: ERR_UNIT_DOCKET_LIMIT
    http: 409
    condition: "a third case for the same unit is docketed to one meeting"
  - id: ERR_INTEREST_SUM_INVALID
    http: 422
    condition: "the association's Units' interest_bp do not sum to exactly 10000 when a budget or ballot step requires it"
  - id: ERR_UNIT_LABEL_DUPLICATE
    http: 409
    condition: "unit_label already exists in the association"
  - id: ERR_PERIOD_ALREADY_BILLED
    http: 409
    condition: "a BillingRun already exists for the association and period"
  - id: ERR_BUDGET_NOT_ADOPTED
    http: 409
    condition: "the referenced budget is not ADOPTED, or no ADOPTED budget covers the certificate's closing_date"
  - id: ERR_BALLOT_ALREADY_OPEN
    http: 409
    condition: "another SpecialAssessment of the association is already BALLOTING"
  - id: ERR_NO_ELIGIBLE_VOTERS
    http: 409
    condition: "eligible_weight_bp is 0 at tally time because every unit is LIEN_FILED or FORECLOSURE_REFERRAL"
  - id: ERR_INSTALLMENTS_EXHAUSTED
    http: 409
    condition: "installments_posted already equals installment_count"
  - id: ERR_NO_AFFECTED_UNITS
    http: 422
    condition: "a SPLIT adjustment carries an empty affected_unit_ids array"
  - id: ERR_RESPONSIBILITY_MISMATCH
    http: 409
    condition: "the requested responsibility contradicts the claim's damage split figures"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "a claim appeal is filed when appeal_round is already 2"
  - id: ERR_CLAIM_SCOPE_INVALID
    http: 422
    condition: "a claim names neither unit_id nor element_id, or within_unit_boundary_cents exceeds gross_damage_cents"
  - id: ERR_LITIGATION_FUNDING_MISSING
    http: 409
    condition: "litigation_status is advanced to IN_LITIGATION with no APPROVED SpecialAssessment whose funding_claim_id is this claim"
  - id: ERR_LITIGATION_ACTIVE
    http: 409
    condition: "rescission attempted on the assessment funding a claim whose litigation_status is IN_LITIGATION"
  - id: ERR_CLAIM_WORK_OPEN
    http: 409
    condition: "settlement attempted while a work order driven by the claim is not INVOICED or CANCELLED"
  - id: ERR_VENDOR_INSURANCE_LAPSED
    http: 409
    condition: "the vendor's insurance_cert_expires_at does not cover the work window, or has passed at activation or reinstatement"
  - id: ERR_ELEMENT_NOT_SERVICEABLE
    http: 409
    condition: "the CommonElement is DECOMMISSIONED when work is started or resumed, or is not SERVICEABLE/IMPAIRED at board award"
  - id: ERR_ELEMENT_CONTRACT_MISMATCH
    http: 409
    condition: "work order element_id differs from the contract's covered_element_id"
  - id: ERR_ELEMENT_SPEC_CHANGED
    http: 409
    condition: "CommonElement.version no longer equals contract.pinned_element_version at activation or reinstatement"
  - id: ERR_CONTRACT_TERM_INVALID
    http: 422
    condition: "effective_from is not before effective_to, or the insurance certificate expires before effective_to"
  - id: ERR_WINDOW_OUTSIDE_CONTRACT_TERM
    http: 409
    condition: "the work window leaves [contract.effective_from, contract.effective_to) or window_start is not before window_end"
  - id: ERR_ELEMENT_WINDOW_CONFLICT
    http: 409
    condition: "the requested outage window collides with another open work order on the same element once the element_window_buffer_hours buffer is applied to both ends"
  - id: ERR_WINDOW_NOT_STARTED
    http: 409
    condition: "work is started or resumed before window_start"
  - id: ERR_WORK_IN_PROGRESS
    http: 409
    condition: "contract termination attempted while one of its work orders is IN_PROGRESS"
  - id: ERR_CONTRACT_CAP_EXCEEDED
    http: 409
    condition: "the new encumbrance plus committed_cents plus invoiced_cents would exceed contract_cap_cents"
  - id: ERR_INVOICE_EXCEEDS_TOLERANCE
    http: 409
    condition: "final_cost_cents exceeds 110% of estimated_cost_cents or would push invoiced_cents past the cap"
  - id: ERR_INSUFFICIENT_OPERATING_CASH
    http: 409
    condition: "operating_cash_cents is below final_cost_cents at invoicing"
  - id: ERR_RESERVE_CONTRIBUTION_TOO_LOW
    http: 422
    condition: "reserve_contribution_cents is below the statutory minimum share of operating_total_cents at proposal or at ratification"
  - id: ERR_REFUND_EXCEEDS_COLLECTED
    http: 409
    condition: "the refund would push refunded_cents past collected_cents"
  - id: ERR_ENTRY_ALREADY_REVERSED
    http: 409
    condition: "a reversal is requested against an entry whose status is already REVERSED, or against a payment/credit entry"
  - id: ERR_CERT_BLOCKED_BY_FORECLOSURE
    http: 409
    condition: "certificate issuance attempted for a unit in FORECLOSURE_REFERRAL"
  - id: ERR_CERT_CLOSING_DATE_PAST
    http: 422
    condition: "closing_date is before the logical clock at issuance"
  - id: ERR_NO_VALID_CERTIFICATE
    http: 409
    condition: "closing attempted with no ISSUED certificate for the unit whose expires_at is still in the future"
  - id: ERR_CERTIFICATE_STALE
    http: 409
    condition: "closing attempted while Unit.version no longer equals certificate.pinned_unit_version"

roles:
  - name: CommunityManager
    description: "the management agent: day-to-day operations, billing runs, ledger postings, notices, work-order execution, certificate preparation, and the logical clock in test mode"
    identity: opaque
    exclusive_operations:
      - "POST /associations"
      - "POST /associations/{id}/owners"
      - "POST /associations/{id}/units"
      - "POST /associations/{id}/billing-runs"
      - "POST /associations/{id}/budgets"
      - "POST /budgets/{id}/propose"
      - "POST /budgets/{id}/send-notice"
      - "POST /associations/{id}/board-meetings"
      - "POST /board-meetings/{id}/send-notice"
      - "POST /board-meetings/{id}/convene"
      - "POST /board-meetings/{id}/adjourn"
      - "POST /board-meetings/{id}/cancel"
      - "POST /associations/{id}/common-elements"
      - "PATCH /common-elements/{id}"
      - "POST /associations/{id}/vendor-contracts"
      - "PATCH /vendor-contracts/{id}/insurance-certificate"
      - "POST /vendor-contracts/{id}/submit"
      - "POST /vendor-contracts/{id}/activate"
      - "POST /vendor-contracts/{id}/suspend"
      - "POST /vendor-contracts/{id}/reinstate"
      - "POST /work-orders"
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/hold"
      - "POST /work-orders/{id}/complete"
      - "POST /work-orders/{id}/cancel"
      - "POST /insurance-claims"
      - "POST /violation-cases/{id}/send-notice"
      - "POST /violation-cases/{id}/mark-cured"
      - "POST /resale-certificates/{id}/issue"
      - "POST /resale-certificates/{id}/void"
      - "POST /units/{id}/transfer-ownership"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PATCH /associations/{id} (with BoardTreasurer)"
      - "POST /units/{id}/payments, POST /units/{id}/charges (with BoardTreasurer; payments also with UnitOwner)"
      - "POST /work-orders/{id}/invoice (with BoardTreasurer)"
      - "POST /violation-cases (with BoardDirector)"
      - "POST /insurance-claims/{id}/appeal (with UnitOwner)"
      - "POST /units/{id}/resale-certificates (with TitleAgent)"
      - "all GET endpoints"
  - name: BoardDirector
    description: "a seated director (including the president): governance votes, budget revision and ratification, ballots, hearings, awards and terminations. May never decide a hearing they reported or previously decided."
    identity: "entity_backed:UnitOwner"
    exclusive_operations:
      - "POST /budgets/{id}/return-to-draft"
      - "POST /budgets/{id}/ratify"
      - "POST /special-assessments/{id}/open-ballot"
      - "POST /special-assessments/{id}/close-ballot"
      - "POST /special-assessments/{id}/rescind"
      - "POST /vendor-contracts/{id}/approve"
      - "POST /vendor-contracts/{id}/terminate"
      - "POST /violation-cases/{id}/schedule-hearing"
      - "POST /violation-cases/{id}/hearing-decision"
    shared_operations:
      - "POST /violation-cases (with CommunityManager)"
      - "POST /votes (with BoardTreasurer and UnitOwner)"
      - "GET /associations/{id}, GET /units, GET /budgets, GET /votes, GET /board-meetings, GET /vendor-contracts, GET /work-orders, GET /insurance-claims, GET /violation-cases, GET /special-assessments, GET /billing-runs, GET /common-elements, GET /associations/{id}/reserve-adequacy"
  - name: BoardTreasurer
    description: "the treasurer director: fiscal custody — ledger reversals, special-assessment creation, installment posting, refunds, and invoice payment. Holds no hearing or award authority."
    identity: "entity_backed:UnitOwner"
    exclusive_operations:
      - "POST /ledger-entries/{id}/reverse"
      - "POST /associations/{id}/special-assessments"
      - "POST /special-assessments/{id}/installments"
      - "POST /special-assessments/{id}/refund"
    shared_operations:
      - "PATCH /associations/{id} (with CommunityManager)"
      - "POST /units/{id}/payments, POST /units/{id}/charges (with CommunityManager)"
      - "POST /work-orders/{id}/invoice (with CommunityManager)"
      - "POST /votes (with BoardDirector and UnitOwner)"
      - "GET /units/{id}/statement, GET /ledger-entries, GET /resale-certificates, GET /billing-runs and the other read endpoints"
  - name: UnitOwner
    description: "an owner of record: pays assessments, casts weighted ballots on their own units, appeals fines on their own units, and reads their own statements"
    identity: "entity_backed:UnitOwner"
    exclusive_operations:
      - "POST /violation-cases/{id}/appeal"
    shared_operations:
      - "POST /units/{id}/payments (with CommunityManager and BoardTreasurer)"
      - "POST /votes (with BoardDirector and BoardTreasurer; owner ballots must carry unit_id and are weighted by interest_bp)"
      - "POST /insurance-claims/{id}/appeal (with CommunityManager)"
      - "GET /units/{id}, GET /units/{id}/statement, GET /ledger-entries, GET /violation-cases, GET /resale-certificates, GET /board-meetings"
  - name: InsuranceAdjuster
    description: "the master-policy adjuster: takes claims under review, delineates association versus owner responsibility, allocates the deductible, and settles"
    identity: opaque
    exclusive_operations:
      - "POST /insurance-claims/{id}/assign-adjuster"
      - "POST /insurance-claims/{id}/adjust"
      - "POST /insurance-claims/{id}/settle"
    shared_operations:
      - "GET /insurance-claims"
  - name: AssociationAttorney
    description: "association counsel: coordinates construction-defect tender, suit filing and resolution, and reads governance records for litigation support"
    identity: opaque
    exclusive_operations:
      - "POST /insurance-claims/{id}/litigation-stage"
    shared_operations:
      - "GET /associations/{id}, GET /owners, GET /units, GET /votes, GET /insurance-claims, GET /special-assessments"
  - name: TitleAgent
    description: "the closing agent: requests resale certificates and reads the lender questionnaire; holds no write authority over the ledger or governance"
    identity: opaque
    exclusive_operations:
      - "GET /resale-certificates/{id}/lender-questionnaire"
    shared_operations:
      - "POST /units/{id}/resale-certificates (with CommunityManager; the request records requesting_agent_id, which is never required to equal any entity id)"
      - "GET /units, GET /units/{id}, GET /resale-certificates, GET /budgets, GET /violation-cases, GET /special-assessments, GET /insurance-claims, GET /common-elements, GET /associations/{id}/reserve-adequacy"
