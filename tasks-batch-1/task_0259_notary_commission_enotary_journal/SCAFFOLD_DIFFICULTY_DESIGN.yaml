              payload: { notary_id: "${nota}", jurisdiction_id: "${jx_tx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-06-18T09:00:00Z", scheduled_end_at: "2026-06-18T10:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/signers"
              payload: { full_name: "S CE", kba_passed: true, credential_analysis_passed: true }
              as: Notary
              as_user_id: "${nota}"
              captures: { sgn: $.data.id }
          trigger:
            - call: "POST /sessions/${sess}/begin-identity"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
              captures: { err: $.data.error_id }
          assert:
            - "Notary.${nota}.enotary_authorized == false"
            - "trigger response error_id == ERR_ENOTARY_NOT_AUTHORIZED"
            - "Session.${sess}.status == SCHEDULED"

      - name: document_notarize_requires_signer_verified
        grounds:
          - state_machines.Document.PENDING_to_NOTARIZED
          - entities.Signer.fields.id_status
          - errors[ERR_SIGNER_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair Document→Signer (a DIFFERENT pair than Session→Notary): a Document's
          PENDING→NOTARIZED transition is gated by its LINKED SIGNER's id_status==VERIFIED.
          Build an ACTIVE session whose document's signer never reached VERIFIED is
          impossible via the happy path, so this drives the negative cross-entity path by
          attaching a second unverified signer to a verified-session document.
        test_recipe:
          setup:
            - "ACTIVE e-notary notary; session reaches ACTIVE after signer A is VERIFIED (identity resolved on the single-signer set). A second signer B (kba_passed=false, credential_analysis_passed=false) is then attached and stays UNVERIFIED, and a document is bound to signer B. Notarizing that document must fail the Document→Signer cross-entity gate."
