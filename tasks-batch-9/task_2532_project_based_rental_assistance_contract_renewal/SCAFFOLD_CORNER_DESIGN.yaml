  - section: calculations
    instances:
      - name: restructuring_eligibility_reports_the_reason_code_of_every_non_mutm_branch
        claim_type: Correct Result
        grounds:
          - calculations.restructuring_eligibility
          - state_machines.RestructuringDetermination.DRAFT_to_INELIGIBLE
          - state_machines.RestructuringDetermination.DRAFT_to_M2M_REFERRED
          - state_machines.RestructuringDetermination.M2M_REFERRED_to_APPROVED
          - entities.RestructuringDetermination.fields.eligibility_reason_code
          - entities.RestructuringDetermination.fields.post_restructure_rent_per_unit_cents
        distinguishing_aspect: "Three branches that all end outside MUTM are separated on identical market data (130200): the contract-type exclusion fires FIRST and reports CONTRACT_TYPE_EXCLUDED even though the same numbers would otherwise qualify for mark-up-to-market, an above-market contract on an FHA-insured property is referred to mark-to-market, and the same above-market contract on an uninsured property is simply MARKET_NOT_ABOVE_CONTRACT. The M2M approval then stamps 0.9 * market = 117180 rather than the market rent itself."
        test_recipe:
          setup:
            - "One owner; property A (fmr 126000, no FHA-insured mortgage) carrying a LOAN_MANAGEMENT_SET_ASIDE contract at 118000 and a NEW_CONSTRUCTION contract at 145000; property B (fmr 126000, FHA-insured) carrying a NEW_CONSTRUCTION contract at 145000."
            - "Clock 2026-12-01; each contract has its own renewal case with an elected method and an ACCEPTED single-comparable study fixing comparable_market_rent_cents at 130200."
            - "Case 3 selects OPTION_3_MARK_TO_MARKET so its M2M determination is approvable; cases 1 and 2 select OPTION_2_OCAF."
