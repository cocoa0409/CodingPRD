              as: HealthInspector
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "PROPANE", propane_psi_after: 50 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Dee", role: "DRIVER", shift_start: "2026-06-05T16:00:00.000Z", shift_end: "2026-06-05T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Coe", role: "COOK", shift_start: "2026-06-05T16:00:00.000Z", shift_end: "2026-06-05T23:00:00.000Z" }
              as: OperatorTruck
