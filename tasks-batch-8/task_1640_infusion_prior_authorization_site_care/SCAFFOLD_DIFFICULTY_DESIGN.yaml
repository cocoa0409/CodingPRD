  - rule_id: resource_temporal_overlap
    instances:
      - name: chair_half_open_interval_with_turnover_buffer
        grounds:
          - calculations.chair_occupied_count
          - validations[priority=18]
          - errors[ERR_CHAIR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: half-open occupation [start, end + turnover_buffer) on InfusionChair.
          Existing 10:00-11:00 with 15-minute buffer occupies up to (not including) 11:15; a new
          appointment starting at exactly 11:15 is ALLOWED while 11:14 conflicts. Resource: InfusionChair.
        test_recipe:
          setup:
            - "Approved request (validity 90 -> window covers 2026-08-10); OFFICE chair with turnover_buffer_minutes 15; one appointment 2026-08-10T10:00-11:00"
          setup_api_calls:
            - { call: "POST /infusion/payer-policies", payload: { payer_code: "PAYERX", drug_code: "J9071", regimen_name: "OvA", benefit_channel: "MEDICAL", validity_days: 90, max_course_days: 60, max_dose_mg: 1000, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000, prepay_limit_cents: 250000 }, as: PolicyAdmin, as_user_id: "admin-1", captures: { pol_oa: $.data.id } }
