    output: ServiceMenuItem
    side_effects: ["status=LISTED"]

  - method: GET
    path: "/salon-svc/service-menu-items"
    description: "List menu items; filter by salon_id (reverse-reachability for ServiceMenuItem.salon_id)."
    roles: [SalonManager, FrontDeskAgent, Technician, Member]
