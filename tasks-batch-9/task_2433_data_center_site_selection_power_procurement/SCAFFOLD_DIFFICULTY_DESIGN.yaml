            - call: "POST /zoning-applications/${z1_id}/community-objections"
              payload: { objection_type: "NOISE", commenter_reference: "CMT-002" }
              as: PermittingAuthority
            - call: "POST /zoning-applications/${z1_id}/community-objections"
