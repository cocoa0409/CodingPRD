  - rule_id: compensating_invariant
    instances:
      - name: deposit_void_restores_store_cash_accountability_total
        grounds:
          - state_machines.Deposit.SEALED_to_VOIDED
          - calculations.safe_balance
          - entities.SafeTransaction.fields.txn_type
          - entities.SafeTransaction.fields.effective_amount_cents
          - endpoints["POST /cash-ops/deposits/{id}/void"]
        distinguishing_aspect: |
          Conserved quantity: store cash accountability, defined as
          Safe.balance_cents + SUM(declared_total_cents of deposits in PREPARING/SEALED/SCHEDULED/IN_TRANSIT).
          It equals 500000 before the prepare (500000 + 0), during the sealed state (299500 + 200500)
          and after the void (500000 + 0), and the void achieves this by APPENDING a compensating
          DEPOSIT_RETURN row rather than deleting the DEPOSIT_REMOVAL row, so the ledger keeps all
          three rows.
        test_recipe:
          setup:
            - "Store S-1017 with safe_time_delay_minutes 5, safe_open_window_minutes 10, dual_control_required true"
            - "MANUAL safe SAFE-A commissioned with exactly 500000 and UNLOCKED at 09:05Z"
            - "Sales journal for 2026-08-03 exists, no deposits yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1017", name: "Store 1017", region_code: "NORTH", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Prepare armored deposit" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "GET /cash-ops/safes/${safe_id}"
              payload: {}
              as: CashOfficeClerk
              captures: { safe_v: $.data.version }
            - call: "POST /cash-ops/deposits"
              payload: { safe_id: "${safe_id}", sales_journal_id: "${journal_id}", business_date: "2026-08-03", counted_lines: [{ denomination_cents: 2000, quantity: 100 }, { denomination_cents: 100, quantity: 5 }], expected_safe_version: "${safe_v}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { deposit_id: $.data.id }
            - call: "POST /cash-ops/deposits/${deposit_id}/seal"
              payload: { seal_number: "SEAL-A-017" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
          trigger:
            - call: "POST /cash-ops/deposits/${deposit_id}/void"
              payload: { void_reason: "Carrier route cancelled, cash returned to safe" }
              as: StoreManager
              as_user_id: "U-MGR-1"
          assert:
            - "checkpoint after seal: Safe.${safe_id}.balance_cents == 299500 and Deposit.${deposit_id}.declared_total_cents == 200500, accountability total == 500000"
            - "Deposit.${deposit_id}.status == VOIDED"
            - "Safe.${safe_id}.balance_cents == 500000"
            - "accountability total after the void == 500000 (500000 + 0 in-flight)"
            - "GET /cash-ops/safe-transactions?safe_id=${safe_id} returns exactly 3 rows with txn_type OPENING_BALANCE, DEPOSIT_REMOVAL and DEPOSIT_RETURN"
            - "the DEPOSIT_REMOVAL row still has effective_amount_cents == -200500 and the DEPOSIT_RETURN row has effective_amount_cents == 200500"
            - "Safe.${safe_id}.open_state == LOCKED (the seal relocked it and the void did not reopen it)"
            - "Safe.${safe_id}.provisional_credit_balance_cents == 0"

      - name: variance_case_negative_attribution_preserves_decomposition_invariant
        grounds:
          - calculations.variance_case_opening
          - entities.VarianceCase.fields.attributions
          - entities.VarianceCase.fields.unexplained_cents
          - concurrency_rules[attribution-stale-case]
          - state_machines.VarianceCase.OPEN_to_RESEARCHING
          - state_machines.VarianceCase.RESEARCHING_to_EXPLAINED
          - endpoints["POST /cash-ops/variance-cases/{id}/attributions"]
        distinguishing_aspect: |
          Conserved quantity: the variance decomposition
          total_variance_cents == attributed_register_cents + attributed_safe_cents + attributed_bank_cents + unexplained_cents,
          which holds at 3000 after every one of four attributions including a -400 correction that
          walks attributed_safe_cents back from 1200 to 800. Different conserved quantity and
          different entity from the cash-accountability invariant, and the compensation here is a
          negative amount on the SAME bucket rather than an opposing ledger row.
        test_recipe:
          setup:
            - "Store S-1018 with single_event_variance_threshold_cents 2500"
            - "MANUAL safe SAFE-A with 500000, UNLOCKED at 09:05Z"
            - "Cashier E-100 ran register 1 with a 20000 starting bank, declared a 100000 closing drop, closed with POS cash 100000 and was blind-counted at 17000"
            - "Reconcile produced variance_cents -3000 and an OPEN SESSION_VARIANCE case with total_variance_cents 3000 and unexplained_cents 3000"
            - "Logical clock is 2026-08-03T13:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1018", name: "Store 1018", region_code: "NORTH", safe_time_delay_minutes: 5, safe_open_window_minutes: 10, dual_control_required: true, single_event_variance_threshold_cents: 2500, theft_escalation_threshold_cents: 50000 }
              as: TreasuryAnalyst
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/cashiers"
              payload: { store_id: "${store_id}", employee_code: "E-100", display_name: "Cashier 100" }
              as: StoreManager
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Cash room open" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:05:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/safes/${safe_id}/open"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-2"
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T13:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              captures: { session_id: $.data.id }
            - call: "POST /cash-ops/till-sessions/${session_id}/drops"
              payload: { txn_type: "CLOSING_DROP", declared_amount_cents: 100000 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_id}/close"
              payload: { pos_cash_sales_cents: 100000, pos_card_sales_cents: 40000, pos_paid_out_cents: 0 }
              as: Cashier
              as_user_id: "${cashier_id}"
            - call: "POST /cash-ops/till-sessions/${session_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 8 }, { denomination_cents: 1000, quantity: 1 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "POST /cash-ops/till-sessions/${session_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "GET /cash-ops/variance-cases"
              payload: { sales_journal_id: "${journal_id}", case_type: "SESSION_VARIANCE" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
              captures: { case_id: "$.data[0].id", case_v0: "$.data[0].version" }
          trigger:
            - call: "POST /cash-ops/variance-cases/${case_id}/attributions"
              payload: { bucket: "REGISTER", amount_cents: 1000, note: "Two twenties handed back in error", expected_variance_case_version: "${case_v0}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
              captures: { case_v1: $.data.version }
            - call: "POST /cash-ops/variance-cases/${case_id}/attributions"
              payload: { bucket: "SAFE", amount_cents: 1200, note: "Strap miscount in safe", expected_variance_case_version: "${case_v1}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
              captures: { case_v2: $.data.version }
            - call: "POST /cash-ops/variance-cases/${case_id}/attributions"
              payload: { bucket: "SAFE", amount_cents: -400, note: "Correction: safe slice was over-attributed by 400", expected_variance_case_version: "${case_v2}" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
              captures: { case_v3: $.data.version }
            - call: "POST /cash-ops/variance-cases/${case_id}/attributions"
              payload: { bucket: "BANK", amount_cents: 1200, note: "Bank short-credited the deposit", expected_variance_case_version: "${case_v3}" }
              as: StoreManager
              as_user_id: "U-MGR-1"
          assert:
            - "after attribution 1: VarianceCase.${case_id}.status == RESEARCHING, attributed_register_cents == 1000, attributed_safe_cents == 0, attributed_bank_cents == 0, unexplained_cents == 2000"
            - "after attribution 2: attributed_safe_cents == 1200, unexplained_cents == 800"
            - "after attribution 3 (the -400 correction): attributed_safe_cents == 800, unexplained_cents == 1200, status still RESEARCHING"
            - "after attribution 4: attributed_register_cents == 1000, attributed_safe_cents == 800, attributed_bank_cents == 1200, unexplained_cents == 0, status == EXPLAINED"
            - "VarianceCase.${case_id}.total_variance_cents == 3000 at every checkpoint"
            - "the invariant total_variance_cents == attributed_register_cents + attributed_safe_cents + attributed_bank_cents + unexplained_cents holds after each of the four calls"
            - "VarianceCase.${case_id}.attributions has exactly 4 entries in call order with amount_cents 1000, 1200, -400, 1200"
            - "VarianceCase.${case_id}.suspected_theft == false"
