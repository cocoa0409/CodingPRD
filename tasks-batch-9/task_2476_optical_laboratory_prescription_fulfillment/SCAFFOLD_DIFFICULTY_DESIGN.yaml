  - rule_id: non_linear_state_machine
    instances:
      - name: rx_order_fulfillment_and_billing_dimensions_advance_independently
        grounds:
          - state_machines.RxOrder.fulfillment_status
          - state_machines.RxOrder.billing_status
          - state_machines.RxOrder.fulfillment_status.IN_LAB_to_LAB_COMPLETE
          - state_machines.RxOrder.billing_status.PROVISIONAL_QUOTED_to_BENEFIT_APPLIED
          - state_machines.RxOrder.billing_status.BENEFIT_APPLIED_to_PATIENT_SETTLED
        distinguishing_aspect: |
          Non-linearity by PARALLEL state dimensions on the RxOrder row: benefit-application moves
          billing_status PROVISIONAL_QUOTED -> BENEFIT_APPLIED while fulfillment_status stays IN_LAB,
          and release moves fulfillment_status IN_LAB -> LAB_COMPLETE while billing_status stays
          BENEFIT_APPLIED, so neither dimension can be derived from the other.
