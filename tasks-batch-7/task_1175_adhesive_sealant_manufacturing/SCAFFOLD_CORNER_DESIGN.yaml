  # ===========================================================================
  - section: validations
    instances:
      - name: schema_error_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A batch create that is both schema-invalid (mix_end_at <= mix_start_at) and references a non-existent formulation fails with the schema error (priority 3) before existence (priority 4)."
        test_recipe:
          setup: ["a vessel exists; the formulation id does not"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-PRIO", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
          trigger:
            - call: "POST /api/batches"
              payload: { formulation_id: "00000000-0000-4000-8000-000000000000", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T09:00:00Z", mix_end_at: "2026-05-01T08:00:00Z", batch_volume_ml: 1000 }
              as: BatchOperator
              captures: { err: $.data.error_id }
          assert:
            - "http 400; ${err} == ERR_INVALID_REQUEST (schema outranks existence — NOT ERR_NOT_FOUND)"

      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails authentication before any other check."
        test_recipe:
          setup: ["empty database (clock initialized)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "GET /api/formulations"
              payload: {}
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "send the trigger WITHOUT the X-User-Role and X-User-ID headers: http 400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: release_nonexistent_lot_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 5): releasing an unknown lot id yields 404 ERR_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["empty database (clock initialized)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /api/production-lots/00000000-0000-4000-8000-000000000000/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
              captures: { err: $.data.error_id }
          assert:
            - "http 404; ${err} == ERR_NOT_FOUND"

