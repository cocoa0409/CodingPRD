          setup: ["Plant; DRAFT report for (2026, 8)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM30" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_REPORT_PERIOD"

      - name: report_supersede_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CommunityWaterReport.PUBLISHED_to_SUPERSEDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Supersede exists only from PUBLISHED; a DRAFT report rejects it with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plant; DRAFT report for (2026, 8)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM31" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /api/community-reports/${rep}/supersede", as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"

      - name: release_without_passed_product_test_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ProductionLot.QA_HOLD_to_RELEASED, "errors[ERR_PRODUCT_TEST_NOT_PASSED]"]
        distinguishing_aspect: "Even with a VALIDATED run, release is blocked while the lot's only FINISHED_PRODUCT test is COMPLETED_FAIL — a PASS in any state other than COMPLETED_PASS does not satisfy the gate."
        test_recipe:
          setup: ["Plant with VALIDATED run; lot completed to QA_HOLD; its AUTO finished-product test recorded FAIL"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant SM32" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-SM32", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 500, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 500 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/validate", as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/production-lots/${lot}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/production-lots/${lot}/complete", payload: { produced_units: 100 }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "GET /api/lab-tests?subject_lot_id=${lot}&test_type=FINISHED_PRODUCT", as: QAOfficer, captures: { fptest: "$.data[0].id" } }
            - { call: "POST /api/lab-tests/${fptest}/record-result", payload: { result: "FAIL", collected_at: "2026-08-04T13:00:00Z" }, as: QAOfficer, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /api/production-lots/${lot}/release", as: QAOfficer, as_user_id: "qa-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PRODUCT_TEST_NOT_PASSED"
            - "ProductionLot.${lot}.status == QA_HOLD"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: monthly_cap_exact_boundary
        claim_type: correct_result
        grounds: [calculations.permit_withdrawal_remaining, "errors[ERR_MONTHLY_CAP_EXCEEDED]"]
        distinguishing_aspect: "The monthly provisional cap has exact equality semantics distinct from the daily one: daily 10000/monthly 15000; 10000 on Aug 1 plus 5000 on Aug 2 lands exactly at 15000 and passes; one further gallon on Aug 2 (daily total 5001, still under the daily cap) fails with ERR_MONTHLY_CAP_EXCEEDED."
        test_recipe:
          setup: ["Plant with SPRING permit (daily 10000, monthly 15000); clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CA1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CA1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 15000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 10000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 10000, expected_permit_version: "${pv}" }, as: SourceMonitor }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-02", gallons: 5000, meter_reading_start_gallons: 10000, meter_reading_end_gallons: 15000, expected_permit_version: "${pv2}" }, as: SourceMonitor, captures: { ev2: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv3: $.data.version, mon: $.data.withdrawn_month_provisional_gallons } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-02", gallons: 1, meter_reading_start_gallons: 15000, meter_reading_end_gallons: 15001, expected_permit_version: "${pv3}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "WithdrawalEvent.${ev2}.status == RECORDED (monthly total exactly 15000 == cap is allowed)"
            - "${mon} == 15000"
            - "${err} == ERR_MONTHLY_CAP_EXCEEDED (15001 > 15000; the daily cap was not the constraint here)"

      - name: wash_verdict_threshold_boundaries
        claim_type: constants_applied
        grounds: [calculations.wash_verdict]
        distinguishing_aspect: "Both wash constants bind independently at exact boundaries: (71.1, 50.0) passes, (71.09, 50.0) fails on temperature alone, (71.1, 49.9) fails on sanitizer alone — verified on three bottle-free batches."
        test_recipe:
          setup: ["Plant; three RUNNING batches on alternating washers (no bottles assigned — the verdict depends only on the two parameters)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CA2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:00:00Z" }, as: SanitationLead, captures: { w1: $.data.id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_B", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:00:00Z" }, as: SanitationLead, captures: { w2: $.data.id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T10:30:00Z", scheduled_end: "2026-08-06T11:30:00Z" }, as: SanitationLead, captures: { w3: $.data.id } }
            - { call: "POST /api/wash-batches/${w1}/start", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/wash-batches/${w2}/start", as: SanitationLead, as_user_id: "sl-1" }
          trigger:
            - { call: "POST /api/wash-batches/${w1}/complete", payload: { rinse_temp_c: 71.1, sanitizer_ppm: 50.0 }, as: SanitationLead, as_user_id: "sl-1", captures: { s1: $.data.status } }
            - { call: "POST /api/wash-batches/${w2}/complete", payload: { rinse_temp_c: 71.09, sanitizer_ppm: 50.0 }, as: SanitationLead, as_user_id: "sl-1", captures: { s2: $.data.status } }
            - { call: "POST /api/wash-batches/${w3}/start", as: SanitationLead, as_user_id: "sl-1" }
            - { call: "POST /api/wash-batches/${w3}/complete", payload: { rinse_temp_c: 71.1, sanitizer_ppm: 49.9 }, as: SanitationLead, as_user_id: "sl-1", captures: { s3: $.data.status } }
          assert:
            - "${s1} == PASSED (both parameters exactly at threshold pass)"
            - "${s2} == FAILED (71.09 < 71.1)"
            - "${s3} == FAILED (49.9 < 50.0)"

      - name: preform_reorder_projection_ordering
        claim_type: correct_result
        grounds: [calculations.preform_reorder_projection, entities.BottlingLine.fields.preform_reorder_quantity]
        distinguishing_aspect: "The pinned evaluation order resolves the apparent circle: target = 8000 x 2 = 16000; reorder = max(0, 16000 + reserved 2000 - on_hand 5000 - pending inbound 3000) = 10000; free = 5000 - 2000 = 3000. Reservations feed the reorder, never the reverse."
        test_recipe:
          setup: ["Plant with SPRING permit; line (daily_capacity_units 8000); 5000 accepted, 3000 still PENDING_QC; one PLANNED lot reserving 2000"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CA3" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CA3", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 5000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del1: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del1}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 5000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 3000, expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del2: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 2000, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
          trigger:
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { onh: $.data.preform_on_hand_units, res: $.data.preform_reserved_units, free: $.data.preform_free_units, roq: $.data.preform_reorder_quantity } }
          assert:
            - "${onh} == 5000 and ${res} == 2000 and ${free} == 3000"
            - "${roq} == 10000"

      - name: community_report_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.community_report_volumes]
        distinguishing_aspect: "The report input set is FINALIZED events in the period only: a FINALIZED July event (1000) is included; a VOIDED July event (500), a FINALIZED AUGUST event (2000), and a backdated RECORDED July event (700) are all excluded — total 1000 gallons / 0.003 acre-feet."
        test_recipe:
          setup: ["Plant with one SPRING permit; events posted and processed so that exactly one FINALIZED July event remains"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CA4" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CA4", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-07-10", gallons: 1000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 1000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { evA: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-07-11", gallons: 500, meter_reading_start_gallons: 1000, meter_reading_end_gallons: 1500, expected_permit_version: "${pv2}" }, as: SourceMonitor, captures: { evB: $.data.id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv3: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 2000, meter_reading_start_gallons: 1500, meter_reading_end_gallons: 3500, expected_permit_version: "${pv3}" }, as: SourceMonitor, captures: { evC: $.data.id } }
            - { call: "POST /api/withdrawal-events/${evB}/void", as: SourceMonitor }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { fin: $.data.events_finalized } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv4: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-07-31", gallons: 700, meter_reading_start_gallons: 3500, meter_reading_end_gallons: 4200, expected_permit_version: "${pv4}" }, as: SourceMonitor, captures: { evD: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 7 }, as: ComplianceOfficer, captures: { rep: $.data.id, gal: $.data.total_withdrawn_gallons, af: $.data.total_acre_feet } }
          assert:
            - "${fin} == 2 (July event A and August event C finalized; B was VOIDED before the run)"
            - "${gal} == 1000"
            - "${af} == 0.003 (round_half_up(1000/325851, 3))"
            - "WithdrawalEvent.${evD}.status == RECORDED (backfilled after the run; excluded from the period until finalized)"

      - name: testing_due_schedule_type_defaults
        claim_type: correct_result
        grounds: [calculations.testing_due_schedule]
        distinguishing_aspect: "At the default clock 2026-08-01, omitted due_date defaults are type-relative: SOURCE_RAW -> 2026-08-08 (+7d), FINISHED_PRODUCT -> 2026-08-03 (+2d), BOTTLE_SANITATION -> 2026-08-02 (+1d)."
        test_recipe:
          setup: ["Plant with SPRING permit, line (500 accepted), SCHEDULED run, PLANNED lot, SCHEDULED wash batch (subjects for each test type)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CA5" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CA5", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 500, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 500 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: SanitationLead, captures: { batch: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}" }, as: QAOfficer, captures: { d1: $.data.due_date } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "FINISHED_PRODUCT", subject_lot_id: "${lot}" }, as: QAOfficer, captures: { d2: $.data.due_date } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "BOTTLE_SANITATION", subject_wash_batch_id: "${batch}" }, as: QAOfficer, captures: { d3: $.data.due_date } }
          assert:
            - "${d1} == 2026-08-08"
            - "${d2} == 2026-08-03"
            - "${d3} == 2026-08-02"

      - name: compliance_run_auto_source_test_scheduling
        claim_type: correct_result
        grounds: [calculations.testing_due_schedule]
        distinguishing_aspect: "The compliance run auto-creates exactly one SOURCE_RAW test (due current+7 = 2026-08-08, origin AUTO) for an ACTIVE permit lacking an upcoming one, and a second run creates none — the existence guard prevents duplicates."
        test_recipe:
          setup: ["Plant with one ACTIVE SPRING permit; no lab tests"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CA6" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CA6", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { made1: $.data.tests_auto_created, ops1: $.data.ops_run_index } }
            - { call: "GET /api/lab-tests?subject_permit_id=${perm}&test_type=SOURCE_RAW", as: QAOfficer, captures: { t0: "$.data[0].id", d0: "$.data[0].due_date", o0: "$.data[0].origin", s0: "$.data[0].status" } }
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { made2: $.data.tests_auto_created, ops2: $.data.ops_run_index } }
          assert:
            - "${made1} == 1 and ${ops1} == 1"
            - "${d0} == 2026-08-08 and ${o0} == AUTO and ${s0} == SCHEDULED"
            - "${made2} == 0 and ${ops2} == 2 (second run finds the upcoming SCHEDULED test and creates nothing)"

      - name: permit_daily_cap_boundary_covered
        claim_type: correct_result
        grounds: [calculations.permit_withdrawal_remaining]
        excluded_because:
          difficulty_instance: boundary_precision_check / daily_cap_exact_gallon_boundary
          rationale: "The daily cap's exact-equality boundary is asserted as the failure path of the named §1.8 instance."

      - name: bottle_pool_variants_covered
        claim_type: variant_divergence
        grounds: [calculations.bottle_loop_availability]
        excluded_because:
          difficulty_instance: dual_variant_calc / bottle_pool_gross_vs_sanitized
          rationale: "Both pool variants and their divergence are asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or business check runs."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA1" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED (the test harness omits the auth headers on this call)"
            - "http status == 401"

      - name: source_monitor_cannot_create_permit_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SourceMonitor is not in the roles list of POST /api/plants/{plantId}/permits: the attempt is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA2" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA2", source_classification: "SPRING", daily_cap_gallons: 5000, monthly_cap_gallons: 100000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "http status == 403"

      - name: priority_existence_beats_state_and_business
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=9]"]
        distinguishing_aspect: "A withdrawal post against a non-existent permit id is rejected 404 ERR_NOT_FOUND even though the same payload would exceed the daily cap — existence (priority 3) precedes the constraint check (priority 9) and the OCC check (priority 4)."
        test_recipe:
          setup: ["Plant with one real permit (version captured to satisfy the OCC field's dynamic-value rule)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA3" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA3", source_classification: "SPRING", daily_cap_gallons: 1000, monthly_cap_gallons: 30000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 99999, meter_reading_start_gallons: 0, meter_reading_end_gallons: 99999, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "http status == 404"

      - name: priority_auth_beats_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "A role-forbidden call against a non-existent permit id is rejected 403 ERR_FORBIDDEN — authorization (priority 2) precedes existence (priority 3): the API never reveals whether the id exists to a disallowed role."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA4" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 10, meter_reading_start_gallons: 0, meter_reading_end_gallons: 10, expected_permit_version: "${plant}" }, as: ProductionLead, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
        note: "expected_permit_version carries a captured placeholder purely to satisfy the dynamic-value lint rule; the auth check fires before the OCC value is ever read."

      - name: meter_reading_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_METER_READING_MISMATCH]", entities.WithdrawalEvent.fields.meter_reading_end_gallons]
        distinguishing_aspect: "meter end - start must equal gallons exactly: 100 gallons against readings 0 -> 150 is rejected 422 ERR_METER_READING_MISMATCH."
        test_recipe:
          setup: ["Plant with SPRING permit"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA5" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA5", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 100, meter_reading_start_gallons: 0, meter_reading_end_gallons: 150, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_METER_READING_MISMATCH"
            - "http status == 422"

      - name: withdrawal_date_before_validity_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_WITHDRAWAL_DATE_OUT_OF_WINDOW]"]
        distinguishing_aspect: "A withdrawal dated before valid_from (2025-12-15 < 2026-01-01) is rejected ERR_WITHDRAWAL_DATE_OUT_OF_WINDOW — the lower window bound, cleanly separated from the future-date rule."
        test_recipe:
          setup: ["Plant with SPRING permit valid 2026-01-01..2026-12-31"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA6" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA6", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2025-12-15", gallons: 100, meter_reading_start_gallons: 0, meter_reading_end_gallons: 100, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_WITHDRAWAL_DATE_OUT_OF_WINDOW"

      - name: future_withdrawal_date_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_FUTURE_WITHDRAWAL_DATE]"]
        distinguishing_aspect: "A withdrawal dated after the current logical date (2026-08-02 while the clock reads 2026-08-01) is rejected ERR_FUTURE_WITHDRAWAL_DATE."
        test_recipe:
          setup: ["Plant with SPRING permit; clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA7" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA7", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-02", gallons: 100, meter_reading_start_gallons: 0, meter_reading_end_gallons: 100, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FUTURE_WITHDRAWAL_DATE"

      - name: supersede_voided_target_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUPERSEDE_TARGET_INVALID]", state_machines.WithdrawalEvent.RECORDED_to_VOIDED]
        distinguishing_aspect: "A VOIDED event cannot be superseded (the correction chain is single-hop): superseding an already-voided event is rejected ERR_SUPERSEDE_TARGET_INVALID."
        test_recipe:
          setup: ["Plant with SPRING permit; event posted then voided"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA8" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA8", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 100, meter_reading_start_gallons: 0, meter_reading_end_gallons: 100, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "POST /api/withdrawal-events/${ev}/void", as: SourceMonitor }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 120, meter_reading_start_gallons: 100, meter_reading_end_gallons: 220, expected_permit_version: "${pv2}", supersedes_event_id: "${ev}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SUPERSEDE_TARGET_INVALID"

      - name: label_classification_mismatch_both_directions_rejected
        claim_type: violation_to_error
        grounds: [calculations.label_eligibility, "errors[ERR_LABEL_CLASSIFICATION_MISMATCH]"]
        distinguishing_aspect: "The label rule binds both directions: PURIFIED on a SPRING-sourced run and SPRING on a WELL-sourced run are each rejected ERR_LABEL_CLASSIFICATION_MISMATCH at lot creation."
        test_recipe:
          setup: ["Plant with SPRING and WELL permits, line (2000 accepted), one SCHEDULED run per permit"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA9" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA9", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permS: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "WL-VA9", source_classification: "WELL", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { permW: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 2000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 2000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${permS}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T08:00:00Z" }, as: ProductionLead, captures: { runS: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${permW}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { runW: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${runS}", label_classification: "PURIFIED", planned_units: 100, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { err1: $.data.error_id } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${runW}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_LABEL_CLASSIFICATION_MISMATCH"
            - "${err2} == ERR_LABEL_CLASSIFICATION_MISMATCH"
            - "Line preform_reserved_units == 0 after both rejections (no partial reservation)"

      - name: lot_preform_insufficient_boundary
        claim_type: violation_to_error
        grounds: ["errors[ERR_PREFORM_INSUFFICIENT]", entities.BottlingLine.fields.preform_free_units]
        distinguishing_aspect: "planned_units == preform_free_units succeeds (500 == 500 reserved fully); planned_units == free + 1 (501) is rejected ERR_PREFORM_INSUFFICIENT — exact boundary on the free-stock constraint."
        test_recipe:
          setup: ["Plant with SPRING permit, line with exactly 500 on hand, two SCHEDULED runs"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA10" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA10", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 500, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 500 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T08:00:00Z" }, as: ProductionLead, captures: { run1: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run2: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
          trigger:
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run1}", label_classification: "SPRING", planned_units: 501, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run2}", label_classification: "SPRING", planned_units: 500, scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
          assert:
            - "${err} == ERR_PREFORM_INSUFFICIENT"
            - "ProductionLot.${lot}.status == PLANNED and line preform_free_units == 0 (fully reserved at the boundary)"

      - name: lab_test_subject_type_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUBJECT_TYPE_MISMATCH]", entities.LabTest.fields.subject_permit_id]
        distinguishing_aspect: "Subject fields must match test_type exactly: FINISHED_PRODUCT carrying subject_permit_id is rejected ERR_SUBJECT_TYPE_MISMATCH, as is SOURCE_RAW carrying an extra subject_lot_id."
        test_recipe:
          setup: ["Plant with SPRING permit, line (500 accepted), SCHEDULED run, PLANNED lot"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant VA11" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-VA11", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 500, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 500 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "FINISHED_PRODUCT", subject_permit_id: "${perm}" }, as: QAOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}", subject_lot_id: "${lot}" }, as: QAOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_SUBJECT_TYPE_MISMATCH"
            - "${err2} == ERR_SUBJECT_TYPE_MISMATCH (exactly one matching subject, no extras)"

      - name: state_vs_constraint_priority_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_permit_state_beats_daily_cap
          rationale: "The state-vs-business_constraint dual-failure is asserted by the named §1.8 instance."

      - name: safety_vs_referential_priority_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sanitation_pending_safety_beats_cross_plant_referential
          rationale: "The business_safety-vs-business_referential dual-failure is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: qc_verdict_rejected_keeps_inventory_unchanged
        claim_type: action_endpoint
        grounds: [state_machines.PreformDelivery.PENDING_QC_to_REJECTED]
        distinguishing_aspect: "A REJECTED verdict sets accepted_units to 0 and leaves the line's on-hand ledger exactly as before, while still bumping the line version."
        test_recipe:
          setup: ["Plant; line (version 1) with one PENDING_QC delivery of 800"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EP1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 800, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { on0: $.data.preform_on_hand_units, v0: $.data.version } }
          trigger:
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "REJECTED" }, as: QAOfficer, as_user_id: "qa-1", captures: { st: $.data.status, acc: $.data.accepted_units } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { on1: $.data.preform_on_hand_units, v1: $.data.version } }
          assert:
            - "${st} == REJECTED and ${acc} == 0"
            - "${on0} == 0 and ${on1} == 0 (no inventory movement on rejection)"
            - "${v0} == 2 and ${v1} == 3 (creation and verdict each bumped the line version)"

      - name: qc_verdict_over_acceptance_rejected
        claim_type: action_endpoint
        grounds: [state_machines.PreformDelivery.PENDING_QC_to_ACCEPTED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "accepted_units > delivered_units (1001 of 1000) is rejected ERR_INVALID_REQUEST (400) and the delivery stays PENDING_QC."
        test_recipe:
          setup: ["Plant; line with one PENDING_QC delivery of 1000"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EP2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 1000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
          trigger:
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 1001 }, as: QAOfficer, as_user_id: "qa-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "PreformDelivery.${del}.status == PENDING_QC"

      - name: fk_reverse_lookup_filtered_lists
        claim_type: cross_reference_link
        grounds: [entities.LabTest.fields.subject_permit_id, entities.WithdrawalEvent.fields.supersedes_event_id]
        distinguishing_aspect: "Every FK has a working reverse lookup: GET /api/lab-tests?subject_permit_id=... finds the permit's tests and GET /api/production-lots?treatment_run_id=... finds the lot assigned to a run — the discovery channel for cascade-created children."
        test_recipe:
          setup: ["Plant with permit; one SOURCE_RAW test on the permit; one SCHEDULED run; line (500 accepted); one lot referencing the run"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EP3" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EP3", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/lab-tests", payload: { test_type: "SOURCE_RAW", subject_permit_id: "${perm}", due_date: "2026-08-05" }, as: QAOfficer, captures: { t: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 500, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 500 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv2: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv2}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
          trigger:
            - { call: "GET /api/lab-tests?subject_permit_id=${perm}", as: QAOfficer, captures: { found_t: "$.data[0].id" } }
            - { call: "GET /api/production-lots?treatment_run_id=${run}", as: ProductionLead, captures: { found_l: "$.data[0].id" } }
            - { call: "GET /api/production-lots?treatment_run_id=${run}&status=REWORK", as: ProductionLead }
          assert:
            - "${found_t} == ${t}"
            - "${found_l} == ${lot}"
            - "The status=REWORK filter variant returns total_count == 0"

      - name: compliance_run_summary_is_computed_read
        claim_type: computed_read
        grounds: [calculations.testing_due_schedule]
        distinguishing_aspect: "The compliance run returns a computed summary (ops_run_index, events_finalized, tests_flipped, tests_auto_created, permits_suspended, permits_expired, posture) consistent with the state it produced."
        test_recipe:
          setup: ["Plant with one permit holding one RECORDED event dated 2026-08-01; clock moved to 2026-08-02"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EP4" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EP4", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 500, meter_reading_start_gallons: 0, meter_reading_end_gallons: 500, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
          trigger:
            - { call: "POST /api/plants/${plant}/compliance-runs", as: PlantAdmin, captures: { fin: $.data.events_finalized, made: $.data.tests_auto_created, susp: $.data.permits_suspended, exp: $.data.permits_expired, posture: $.data.posture, ops: $.data.ops_run_index } }
          assert:
            - "${fin} == 1 and ${made} == 1 and ${susp} == 0 and ${exp} == 0"
            - "${posture} == GREEN"
            - "${ops} == 1"
            - "WithdrawalEvent.${ev}.status == FINALIZED with finalized_at set"

