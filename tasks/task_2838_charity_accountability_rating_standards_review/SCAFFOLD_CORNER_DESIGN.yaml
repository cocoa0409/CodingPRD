# =============================================================================
# Section 1.9: Scaffold Corner Design (Breadth Coverage Index)
# Charity Accountability Rating & Standards Review
#
# A walk of references/claim-extraction-guide.md against SCAFFOLD.yaml sections
# 1.1-1.7: one instance per applicable guide row. Depth (multi-rule
# interaction) is the job of SCAFFOLD_DIFFICULTY_DESIGN.yaml, so a guide row
# whose claim is already carried by a difficulty instance is recorded here with
# excluded_because and no test_recipe. The two files together enumerate the
# design surface exactly once. Deleting either leaves the declared behaviour in
# SCAFFOLD.yaml identical.
#
# Fixture conventions (all literals, no wall-clock dependence):
#   * the logical clock starts at 2026-08-01T00:00:00Z and only moves forward
#   * methodology "M1" weights 0.40 / 0.25 / 0.20 / 0.15, floor 40.0, adopted
#     with effective_from 2026-08-31T00:00:00Z, after which the clock is moved
#     to 2026-09-01T00:00:00Z
#   * canonical Harbor Relief fixture - PUBLIC_CHARITY, three VALIDATED
#     AUDITED_STATEMENT filings, gov_canon governance (7 standards MET,
#     CEO_COMP_REVIEW NOT_MET) - yields program_expense_ratio 0.7500,
#     fundraising_efficiency 0.1867, months_of_reserve 7.20,
#     FINANCIAL_HEALTH 29/40 = 72.50, ACCOUNTABILITY 21/24 = 87.50,
#     TRANSPARENCY 20/20 = 100.00, IMPACT 11/12 = 91.67, weighted_sum 84.63
#     (band B), penalty 1.50, final_composite_score 83.13, grade
#     MEETS_STANDARDS, data_completeness_pct 100.00
#   * OrganizationRep identity is entity_backed, so its X-User-ID is always the
#     Organization.id it speaks for
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: organization_creation_returns_201_with_empty_rollups
        claim_type: Creation
        grounds:
          - endpoints.POST_/organizations
          - entities.Organization.fields.published_cycle_count
          - entities.Organization.fields.trend_direction
          - entities.Organization.fields.substantiated_complaint_count
          - entities.Organization.fields.transition_grace_until
        distinguishing_aspect: |
          Registration is the only write that populates an Organization's five
          computed roll-up fields, and it must populate them EMPTY: a fresh
          charity has no publication history, so latest_published_score and
          latest_published_grade are null while trend_direction is the sentinel
          NOT_APPLICABLE rather than UNCHANGED. An implementation that seeded
          trend_direction as UNCHANGED, or that omitted the roll-up keys from
          the creation response entirely, would pass every later test.
        test_recipe:
          setup:
            - "One unrelated Organization already exists, so the assertion is about this row rather than about an empty table"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "POST /organizations"
              payload: { legal_name: "Northgate Youth Services", ein: "55-5555555", org_type: "MEMBERSHIP_ASSOCIATION", fiscal_year_end_month: 6, contact_email: "admin@northgateyouth.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org2: $.data.id }
          assert:
            - "HTTP 201 and the five supplied fields are echoed verbatim: legal_name Northgate Youth Services, ein 55-5555555, org_type MEMBERSHIP_ASSOCIATION, fiscal_year_end_month 6, contact_email admin@northgateyouth.org"
            - "latest_published_score is null and latest_published_grade is null"
            - "published_cycle_count == 0 and substantiated_complaint_count == 0"
            - "trend_direction == NOT_APPLICABLE, not UNCHANGED"
            - "transition_grace_until is null"
            - "GET /organizations/${org2} returns the identical row, proving the response was persisted and not merely echoed"
      - name: methodology_version_defaults_applied_when_optional_fields_omitted
        claim_type: Defaults
        grounds:
          - endpoints.POST_/methodology-versions
          - entities.MethodologyVersion.fields.dimension_floor_score
          - entities.MethodologyVersion.fields.comment_period_days
          - entities.MethodologyVersion.fields.transition_period_days
          - calculations.workflow_deadline_windows
        distinguishing_aspect: |
          Three optional inputs carry defaults that are read much later - the
          floor at grading time, comment_period_days when the comment window is
          armed, transition_period_days when a grant's grace_until is computed.
          The paired setup row supplies all three explicitly, so the test
          separates "default applied" from "field ignored": an implementation
          that hardcoded 40.0 / 30 / 90 would satisfy the trigger but fail the
          setup row's read-back.
        test_recipe:
          setup:
            - "A first DRAFT methodology M0 is created with all three optional fields supplied explicitly (floor 55.0, comment period 7 days, transition period 45 days)"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M0", weight_financial_health: 0.25, weight_accountability: 0.25, weight_transparency: 0.25, weight_impact: 0.25, dimension_floor_score: 55.0, comment_period_days: 7, transition_period_days: 45 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m0: $.data.id }
          trigger:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
          assert:
            - "HTTP 201 with dimension_floor_score == 40.0, comment_period_days == 30 and transition_period_days == 90 on the M1 row"
            - "status == DRAFT, comment_count == 0, unresolved_comment_count == 0"
            - "supersedes_version_id, comment_open_at, comment_closed_at, comment_deadline_at, adopted_at, retired_at, effective_from, effective_until and revision_note are all null"
            - "GET /methodology-versions/${m0} still reports dimension_floor_score 55.0, comment_period_days 7 and transition_period_days 45, so the defaults did not overwrite supplied values"
      - name: organization_rollup_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - endpoints.POST_/organizations
          - entities.Organization.fields.latest_published_score
          - entities.Organization.fields.published_cycle_count
          - entities.Organization.fields.trend_direction
          - validations[priority=5]
        distinguishing_aspect: |
          Every roll-up on Organization is computed at publish time from
          PublicationRecord. The creation body here asserts a flattering
          history (score 99.99, three published cycles, IMPROVED trend). Per
          priority 5 an unknown body field is silently ignored rather than
          rejected, so the correct behaviour is HTTP 201 with the roll-ups
          still empty - the request must be neither honoured nor refused.
        test_recipe:
          setup:
            - "One unrelated Organization already exists"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "POST /organizations"
              payload: { legal_name: "Summit Aid Trust", ein: "55-5555555", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "hello@summitaid.org", latest_published_score: 99.99, latest_published_grade: "ACCREDITED", published_cycle_count: 3, trend_direction: "IMPROVED", substantiated_complaint_count: 7 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org2: $.data.id }
          assert:
            - "HTTP 201 - the extra keys are ignored, not rejected, so no ERR_INVALID_REQUEST is returned"
            - "latest_published_score is null, latest_published_grade is null, published_cycle_count == 0, substantiated_complaint_count == 0, trend_direction == NOT_APPLICABLE"
            - "GET /organizations/${org2} confirms the same empty roll-ups after the write"
      - name: filing_record_missing_required_contributions_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/filing-records
          - entities.FilingRecord.fields.contributions_cents
          - errors.ERR_INVALID_REQUEST
          - validations[priority=5]
        distinguishing_aspect: |
          contributions_cents is required with no default even though it is the
          DENOMINATOR of fundraising_efficiency rather than a component of the
          expense identity checked at priority 29. Omitting it must fail the
          body-shape check outright; an implementation that defaulted it to 0
          would silently produce the NO_CONTRIBUTIONS_RATIO 1.0000 worst case
          instead of an error.
        test_recipe:
          setup:
            - "An Organization exists and its current version is captured for the OCC field"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /organizations/${org1}/filing-records returns zero rows - the partial filing was not stored"
            - "GET /organizations/${org1} still reports version ${org1_v1}, so a rejected write did not consume the OCC version"
      - name: organization_create_invalid_enum_org_type_rejected
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/organizations
          - entities.Organization.fields.org_type
          - errors.ERR_INVALID_REQUEST
          - validations[priority=5]
        distinguishing_aspect: |
          org_type is not decoration: it selects the numerator AND denominator
          branch of program_expense_ratio and the NOT_APPLICABLE standard set.
          An unrecognised value must be refused at the door, because there is
          no defined adjustment for it downstream. fiscal_year_end_month 13 is
          rejected by the same rule, proving the check covers declared numeric
          ranges and not only enums.
        test_recipe:
          setup:
            - "One valid Organization already exists, so the refusal is attributable to the enum value and not to an empty database"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "POST /organizations"
              payload: { legal_name: "Cooperative Care Network", ein: "55-5555555", org_type: "COOPERATIVE", fiscal_year_end_month: 12, contact_email: "info@coopcare.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /organizations"
              payload: { legal_name: "Thirteenth Month Trust", ein: "66-6666666", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 13, contact_email: "info@13month.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { err_month: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400 - COOPERATIVE is outside the five declared org_type values"
            - "${err_month} == ERR_INVALID_REQUEST with HTTP 400 - fiscal_year_end_month 13 is outside 1..12"
            - "GET /organizations returns total_count == 1, so neither refused row was stored"
      - name: filing_record_optional_cent_amounts_default_to_zero
        claim_type: Defaults
        grounds:
          - endpoints.POST_/filing-records
          - entities.FilingRecord.fields.grants_paid_cents
          - entities.FilingRecord.fields.membership_services_cents
          - entities.FilingRecord.fields.joint_cost_allocated_cents
          - entities.FilingRecord.fields.source_precedence
          - entities.FilingRecord.fields.origin
          - state_machines.FilingRecord.initial_state
        distinguishing_aspect: |
          The three optional cent amounts are the org-type adjustment terms of
          program_expense_ratio, so they must default to 0 rather than null: a
          null would poison the arithmetic for a PUBLIC_CHARITY that reports no
          joint cost. The same response also proves source_precedence is derived
          from source_kind (AUDITED_STATEMENT -> 1) and that origin is derived
          from the ACTING ROLE (RatingAnalyst -> ANALYST_ENTRY) rather than from
          the body.
        test_recipe:
          setup:
            - "An Organization exists at version ${org1_v1}"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
          trigger:
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f1: $.data.id }
          assert:
            - "HTTP 201 with grants_paid_cents == 0, membership_services_cents == 0 and joint_cost_allocated_cents == 0, all integers and none null"
            - "source_precedence == 1, derived from source_kind AUDITED_STATEMENT"
            - "origin == ANALYST_ENTRY because a RatingAnalyst posted it"
            - "status == RECEIVED, validated_at is null, rejection_code is null, superseded_at is null"
            - "GET /filing-records/${f1} returns the same zeros after the write"
      - name: organization_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/organizations
          - entities.Organization.fields.org_type
        distinguishing_aspect: |
          The list envelope's total_count is the count of rows matching the
          FILTER, not the count on the page, and has_more is derived from
          offset + returned < total_count. Paging with limit 2 over three rows
          therefore has to report total_count 3 on BOTH pages while has_more
          flips from true to false, and the org_type filter has to shrink
          total_count rather than merely hide rows from the page.
        test_recipe:
          setup:
            - "Three Organizations exist: two PUBLIC_CHARITY and one MEMBERSHIP_ASSOCIATION"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /organizations"
              payload: { legal_name: "Northgate Youth Services", ein: "55-5555555", org_type: "MEMBERSHIP_ASSOCIATION", fiscal_year_end_month: 6, contact_email: "admin@northgateyouth.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org2: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Riverbend Shelter", ein: "66-6666666", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "info@riverbend.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org3: $.data.id }
          trigger:
            - call: "GET /organizations?limit=2&offset=0"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /organizations?limit=2&offset=2"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /organizations?org_type=MEMBERSHIP_ASSOCIATION"
              payload: {}
              as: PublicUser
              as_user_id: "public-1"
              captures: { filtered_first: "$.data[0].id" }
          assert:
            - "page 1 returns exactly 2 rows with limit 2, offset 0, total_count 3, has_more true"
            - "page 2 returns exactly 1 row with limit 2, offset 2, total_count 3, has_more false"
            - "${page2_first} != ${page1_first} - the pages do not overlap"
            - "${filtered_first} == ${org2} and the filtered response reports total_count 1 and has_more false, so the filter shrinks the count and not just the page"
      - name: rating_cycle_retrieval_returns_stored_workflow_fields
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/rating-cycles/{rating_cycle_id}
          - entities.RatingCycle.fields.correction_round
          - entities.RatingCycle.fields.methodology_pin_locked
          - entities.RatingCycle.fields.assigned_analyst_user_id
          - state_machines.RatingCycle.initial_state
        distinguishing_aspect: |
          A freshly created cycle must read back with every scoring field null
          and every counter zero, and with methodology_pin_locked already true:
          the pin is taken at CREATION, not at score time, which is what makes a
          later methodology adoption unable to move an in-flight cycle. A
          response that lazily computed the pin at first score would look
          identical until a version was retired underneath it.
        test_recipe:
          setup:
            - "M1 is ADOPTED and effective, the clock reads 2026-09-01T00:00:00Z, and a FY2025 cycle exists for an organization with one VALIDATED filing"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 500000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2025: $.data.id }
            - call: "POST /filing-records/${f2025}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /rating-cycles/${c1}"
              payload: {}
              as: OrganizationRep
              as_user_id: "${org1}"
              captures: { got: $.data.id }
          assert:
            - "${got} == ${c1} with HTTP 200"
            - "organization_id == ${org1}, methodology_version_id == ${m1}, fiscal_year == 2025, period_start == 2025-01-01T00:00:00Z, period_end == 2026-01-01T00:00:00Z, assigned_analyst_user_id == analyst-1"
            - "status == DATA_COLLECTION and correction_round == 0"
            - "methodology_pin_locked == true immediately at creation"
            - "publishing_reviewer_user_id, review_opened_at, correction_deadline_at, appeal_deadline_at, published_at, withdrawal_reason, program_expense_ratio, fundraising_efficiency, months_of_reserve, data_completeness_pct, weighted_sum_provisional, provisional_composite_score, provisional_grade, weighted_sum_final, final_composite_score and grade are all null"
            - "failed_standard_count == 0 and accountability_penalty_points == 0"
      - name: governance_profile_create_with_unknown_cycle_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST_/governance-profiles
          - entities.GovernanceProfile.fields.rating_cycle_id
          - errors.ERR_RATING_CYCLE_NOT_FOUND
          - validations[priority=7]
        distinguishing_aspect: |
          GovernanceProfile carries its parent in the BODY, not in the path, so
          the missing parent is caught by the priority-7 body-FK sweep rather
          than by the priority-3 path sweep. The body is otherwise perfectly
          valid, which isolates the FK check from the shape check that runs two
          priorities earlier.
        test_recipe:
          setup:
            - "M1 is ADOPTED and a real cycle exists, so a valid target is available but is not the one named"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Relief Fund", ein: "11-1111111", org_type: "PUBLIC_CHARITY", fiscal_year_end_month: 12, contact_email: "ops@harborrelief.org" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { org1: $.data.id, org1_v1: $.data.version }
            - call: "POST /filing-records"
              payload: { organization_id: "${org1}", fiscal_year: 2025, source_kind: "AUDITED_STATEMENT", total_expense_cents: 10000000, program_expense_cents: 8000000, fundraising_expense_cents: 1200000, admin_expense_cents: 800000, contributions_cents: 9000000, total_revenue_cents: 11000000, net_assets_cents: 6000000, total_liabilities_cents: 2000000, joint_cost_allocated_cents: 500000, expected_organization_version: "${org1_v1}" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { f2025: $.data.id }
            - call: "POST /filing-records/${f2025}/validate"
              payload: { decision: "ACCEPT" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /rating-cycles"
              payload: { organization_id: "${org1}", methodology_version_id: "${m1}", fiscal_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", assigned_analyst_user_id: "analyst-1" }
              as: RatingAnalyst
              as_user_id: "analyst-1"
              captures: { c1: $.data.id }
          trigger:
