              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-05T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p2_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-06-05T00:00:00Z" }
