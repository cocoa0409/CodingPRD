          unreachable from a non-adjudicatable state.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P coverage_start 2026-09-01, clock still 2026-09-03 (illness waiting open until 2026-09-15)."
            - "Claim C (ILLNESS, one line) submitted then DENIED by adjuster."
          setup_api_calls:
