# =============================================================================
# 1.9 Scaffold Corner Design — Breadth Walk
# Task 2469 — Hydrogen Production & Fueling Station Operations
#
# Sections and claim_type values are taken ONLY from
# references/claim-extraction-guide.md (its nine tables). Every instance either
# carries a full test_recipe or an excluded_because stub naming the §1.8
# instance that already covers the corner (stubs carry no test_recipe).
# Instance names are unique across the union of §1.8 and §1.9.
#
# The logical clock defaults to 2026-08-01T00:00:00Z; chains that need another
# instant call POST /_clock/set_current_utc explicitly. Every numeric assert was
# executed against the §1.3 formula and constants (Decimal, ROUND_HALF_UP)
# before being written down. KG_PER_L_PER_BAR = 0.00008 throughout.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: funding_agreement_creation_seeds_holdback_and_version
        claim_type: creation
        grounds:
          - entities.FundingAgreement.fields.holdback_balance_cents
          - entities.FundingAgreement.fields.initial_holdback_cents
          - endpoints.POST /funding-agreements
        distinguishing_aspect: |
          A brand-new agreement's computed holdback_balance_cents equals initial_holdback_cents
          exactly (nothing is charged before any report is finalised) and version starts at 1.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id", fa_v: "$.data.version" }
          assert:
            - "HTTP 201"
            - "FundingAgreement.${fa_id}.holdback_balance_cents == 500000"
            - "FundingAgreement.${fa_id}.initial_holdback_cents == 500000"
            - "FundingAgreement.${fa_id}.min_uptime_pct == 99.000"
            - "FundingAgreement.${fa_id}.uptime_method == NOZZLE_WEIGHTED"
            - "${fa_v} == 1"
            - "id, created_at and updated_at are present in the response envelope's data object"

      - name: station_creation_is_restricted_at_birth_with_zero_high_bank
        claim_type: creation
        grounds:
          - entities.Station.fields.safety_posture
          - entities.Station.fields.high_bank_deliverable_kg
          - entities.Station.fields.supply_alert
          - calculations.station_safety_posture
          - endpoints.POST /stations
        distinguishing_aspect: |
          Creation of a Station is NOT a clean-slate OPEN state: with no vessels commissioned yet
          high_bank_deliverable_kg is 0.000, which is below MIN_HIGH_BANK_DELIVERABLE_KG (10.0),
          so the station is born RESTRICTED with supply_alert already true.
        test_recipe:
          setup:
            - "One funding agreement; no vessels yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E2", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
          trigger:
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E2", name: "Birth State Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 100.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id", st_v: "$.data.version" }
          assert:
            - "HTTP 201"
            - "Station.${st_id}.ventilation_status == NORMAL"
            - "Station.${st_id}.leak_detection_status == NORMAL"
            - "Station.${st_id}.compressor_status == ONLINE"
            - "Station.${st_id}.onsite_inventory_kg == 0.000"
            - "Station.${st_id}.reserved_kg == 0.000 and Station.${st_id}.available_kg == 0.000"
            - "Station.${st_id}.total_deliverable_kg == 0.000 and Station.${st_id}.high_bank_deliverable_kg == 0.000"
            - "Station.${st_id}.inbound_planned_kg == 0.000 and Station.${st_id}.projected_available_kg == 0.000"
            - "Station.${st_id}.supply_alert == true (0.000 < reserve_floor_kg 100.000)"
            - "Station.${st_id}.safety_posture == RESTRICTED (no freezing condition, but the high-bank floor is unmet)"
            - "Station.${st_id}.metered_kg_mtd == 0.000 and Station.${st_id}.metering_accuracy_flag == WITHIN_TOLERANCE"
            - "${st_v} == 1"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Station.fields.setback_compliant
          - entities.ProductionAsset.fields.ccs_capture_rate
          - entities.ProductionLot.fields.feedstock_consumed_mmbtu
          - entities.ProductionLot.fields.carryover_kg
        distinguishing_aspect: |
          Three different defaults on three different entities are applied when the field is
          omitted: Station.setback_compliant -> true (a safety default that keeps the station out
          of FROZEN), ProductionAsset.ccs_capture_rate -> 0, ProductionLot.feedstock_consumed_mmbtu
          and carryover_kg -> 0 (which makes the electrolysis CI purely electricity + compression).
        test_recipe:
          setup:
            - "One funding agreement and one power supply contract so the lot can be created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E3", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
          trigger:
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E3", name: "Default Station", nozzle_count: 2, offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 50.000, max_pressure_class: "H35" }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /production-assets"
              payload: { asset_code: "PA-E3-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-E3-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 0.000, hourly_matched_renewable_pct: 0.000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
              captures: { psc_id: "$.data.id" }
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-E3-1", mass_kg: 1000.000, energy_consumed_kwh: 0.0, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id" }
          assert:
            - "Station.${st_id}.setback_compliant == true (omitted; default applied, so no SETBACK_BREACH freeze)"
            - "ProductionAsset.${asset_id}.ccs_capture_rate == 0"
            - "PowerSupplyContract.${psc_id}.hourly_matching_enabled == false (omitted; default applied)"
            - "ProductionLot.${lot_id}.feedstock_consumed_mmbtu == 0 and ProductionLot.${lot_id}.carryover_kg == 0"
            - "ProductionLot.${lot_id}.ci_provisional_gco2e_per_mj == 2.50 (electricity 0 g + compression 1000.000 * 300.0 g over 1000.000 * 120.0 MJ)"
            - "ProductionLot.${lot_id}.ci_variant_applied is null until certify-ci runs"

      - name: station_create_with_missing_nozzle_count_rejected
        claim_type: required_fields
        grounds:
          - entities.Station.fields.nozzle_count
          - validations[priority=50]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          nozzle_count has source input, is required and carries no default, so omitting it is a
          schema failure at priority 50 rather than a business error — the station row is not
          created at all.
        test_recipe:
          setup:
            - "One funding agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E4", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
          trigger:
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E4", name: "Incomplete Station", offload_bay_count: 1, storage_capacity_kg: 900.000, reserve_floor_kg: 50.000, max_pressure_class: "H35" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /stations returns total_count == 0 — no partial row was persisted"

      - name: funding_agreement_with_invalid_uptime_method_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.FundingAgreement.fields.uptime_method
          - entities.FundingAgreement.fields.min_uptime_pct
          - validations[priority=50]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Enum membership and numeric range are both priority-50 schema constraints: uptime_method
          "MONTHLY_AVERAGE" is not one of {NOZZLE_WEIGHTED, STATION_LEVEL}, and min_uptime_pct
          120.000 is outside [0, 100]; both are rejected before any row is written.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E5a", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "MONTHLY_AVERAGE" }
              as: PlatformAdmin
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E5b", funder_name: "State Clean Transport Fund", min_uptime_pct: 120.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { err_range: "$.data.error_id" }
          assert:
            - "Both calls return HTTP 400"
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "${err_range} == ERR_INVALID_REQUEST"

      - name: unknown_path_ids_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors[ERR_STATION_NOT_FOUND]
          - errors[ERR_FUNDING_AGREEMENT_NOT_FOUND]
          - errors[ERR_PRESSURE_VESSEL_NOT_FOUND]
          - errors[ERR_PRODUCTION_ASSET_NOT_FOUND]
          - errors[ERR_PRODUCTION_LOT_NOT_FOUND]
          - errors[ERR_DELIVERY_NOT_FOUND]
          - errors[ERR_DISPENSE_SESSION_NOT_FOUND]
          - errors[ERR_SAFETY_EVENT_NOT_FOUND]
          - errors[ERR_INCENTIVE_CLAIM_NOT_FOUND]
          - errors[ERR_UPTIME_REPORT_NOT_FOUND]
        distinguishing_aspect: |
          Priority 40 does not collapse into one generic 404: each aggregate root reports its own
          error_id for the same syntactically valid but non-existent UUID.
        test_recipe:
          setup:
            - "Empty database; the UUID 11111111-1111-4111-8111-111111111111 exists nowhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /funding-agreements/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_fa: "$.data.error_id" }
            - call: "GET /stations/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_st: "$.data.error_id" }
            - call: "GET /pressure-vessels/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_pv: "$.data.error_id" }
            - call: "GET /production-assets/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_pa: "$.data.error_id" }
            - call: "GET /production-lots/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_lot: "$.data.error_id" }
            - call: "GET /deliveries/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_del: "$.data.error_id" }
            - call: "GET /dispense-sessions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_ds: "$.data.error_id" }
            - call: "GET /safety-events/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_se: "$.data.error_id" }
            - call: "GET /incentive-claims/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_ic: "$.data.error_id" }
            - call: "GET /uptime-reports/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e_ur: "$.data.error_id" }
          assert:
            - "Every call returns HTTP 404"
            - "${e_fa} == ERR_FUNDING_AGREEMENT_NOT_FOUND"
            - "${e_st} == ERR_STATION_NOT_FOUND"
            - "${e_pv} == ERR_PRESSURE_VESSEL_NOT_FOUND"
            - "${e_pa} == ERR_PRODUCTION_ASSET_NOT_FOUND"
            - "${e_lot} == ERR_PRODUCTION_LOT_NOT_FOUND"
            - "${e_del} == ERR_DELIVERY_NOT_FOUND"
            - "${e_ds} == ERR_DISPENSE_SESSION_NOT_FOUND"
            - "${e_se} == ERR_SAFETY_EVENT_NOT_FOUND"
            - "${e_ic} == ERR_INCENTIVE_CLAIM_NOT_FOUND"
            - "${e_ur} == ERR_UPTIME_REPORT_NOT_FOUND"

      - name: pressure_vessel_stored_mass_computed_from_initial_pressure
        claim_type: computed_fields
        grounds:
          - entities.PressureVessel.fields.stored_mass_kg
          - entities.PressureVessel.fields.current_pressure_bar
          - entities.PressureVessel.fields.inspection_status
          - entities.Station.fields.total_deliverable_kg
          - endpoints.POST /stations/{id}/pressure-vessels
        distinguishing_aspect: |
          stored_mass_kg is never supplied by the client: it is initial_pressure_bar *
          water_volume_l * KG_PER_L_PER_BAR = 950.00 * 600.0 * 0.00008 = 45.600, while the
          station's deliverable mass measures only the headroom above min_residual_bar
          ((950.00 - 200.00) * 600.0 * 0.00008 = 36.000) — the two figures deliberately differ.
        test_recipe:
          setup:
            - "One funding agreement and station STN-E7 (nozzle_count 4, offload_bay_count 2, capacity 900.000, reserve floor 20.000, H70)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E7", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E7", name: "Vessel Math Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
          trigger:
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id", mass: "$.data.stored_mass_kg" }
          assert:
            - "HTTP 201"
            - "${mass} == 45.600"
            - "PressureVessel.${v_high}.current_pressure_bar == 950.00"
            - "PressureVessel.${v_high}.inspection_status == CURRENT"
            - "PressureVessel.${v_high}.inspection_count == 0"
            - "PressureVessel.${v_high}.last_inspection_date is null"
            - "Station.${st_id}.onsite_inventory_kg == 45.600"
            - "Station.${st_id}.total_deliverable_kg == 36.000"
            - "Station.${st_id}.high_bank_deliverable_kg == 36.000"
            - "Station.${st_id}.safety_posture == OPEN (36.000 >= MIN_HIGH_BANK_DELIVERABLE_KG 10.0)"

      - name: inventory_ledger_sequence_no_is_system_assigned_and_monotonic
        claim_type: system_fields
        grounds:
          - entities.InventoryLedgerEntry.fields.sequence_no
          - entities.InventoryLedgerEntry.fields.resulting_onsite_kg
          - entities.InventoryLedgerEntry.fields.source_ref_type
          - endpoints.GET /stations/{id}/inventory-ledger
        distinguishing_aspect: |
          sequence_no, reason, delta_kg, resulting_onsite_kg, source_ref_type/id and occurred_at
          are all system-sourced: the client never posts a ledger row, yet commissioning two
          vessels produces exactly two OPENING_BALANCE entries numbered 1 then 2 whose running
          balance climbs 45.600 -> 165.600.
        test_recipe:
          setup:
            - "Station STN-E8 with a HIGH 600 L vessel at 950.00 bar and a LOW 5000 L vessel at 300.00 bar."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-E8", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-E8", name: "Ledger Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
          trigger:
            - call: "GET /stations/${st_id}/inventory-ledger"
              payload: { limit: 10, offset: 0 }
              as: ComplianceAdmin
              captures: { rows: "$.data" }
          assert:
            - "total_count == 2 and has_more == false"
            - "row 1: sequence_no == 1, reason == OPENING_BALANCE, delta_kg == 45.600, resulting_onsite_kg == 45.600, source_ref_type == PRESSURE_VESSEL, source_ref_id == ${v_high}"
            - "row 2: sequence_no == 2, reason == OPENING_BALANCE, delta_kg == 120.000, resulting_onsite_kg == 165.600, source_ref_type == PRESSURE_VESSEL, source_ref_id == ${v_low}"
            - "both rows carry occurred_at == 2026-08-01T00:00:00Z (the logical clock, not wall-clock time)"
            - "Station.${st_id}.onsite_inventory_kg == 165.600 (resulting_onsite_kg of the last row)"

      - name: purity_test_is_immutable_and_carries_no_version_axis
        claim_type: immutability
        grounds:
          - entities.PurityTest.common_fields
          - endpoints.GET /production-lots/{id}/purity-tests
          - endpoints.POST /production-lots/{id}/purity-tests
        distinguishing_aspect: |
          PurityTest is declared common_fields false: §1.5 exposes create and read only — no PUT,
          PATCH or DELETE — so a laboratory result can never be edited after the fact and there is
          no version field to guard, unlike every common_fields true entity.
        test_recipe:
          setup:
            - "One PEM_ELECTROLYSIS asset with a covering power contract and one lot produced 2026-07-20 to 2026-07-21."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-assets"
              payload: { asset_code: "PA-E9-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-E9-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 50.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-E9-1", mass_kg: 500.000, energy_consumed_kwh: 26000.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "POST /production-lots/${lot_id}/purity-tests"
              payload: { sampled_at: "2026-07-21T06:00:00Z", total_hydrocarbons_ppm: 1.000, water_ppm: 2.500, oxygen_ppm: 2.500, nitrogen_ppm: 50.000, carbon_monoxide_ppm: 0.100, carbon_dioxide_ppm: 1.000, total_sulfur_ppm: 0.002, ammonia_ppm: 0.050, helium_ppm: 150.000 }
              as: QualityAnalyst
              as_user_id: "QA-1"
              captures: { pt_created: "$.data.created_at" }
            - call: "GET /production-lots/${lot_id}/purity-tests"
              payload: { limit: 10, offset: 0 }
              as: QualityAnalyst
              as_user_id: "QA-1"
              captures: { rows: "$.data" }
          assert:
            - "The purity test is created with HTTP 201 and performed_by_user_id == QA-1 (system-recorded from X-User-ID)"
            - "The created row exposes no version field — PurityTest declares common_fields false"
            - "§1.5 declares no PUT, PATCH or DELETE route whose path ends in purity-tests or purity-tests/{id}"
            - "total_count == 1 and the single row's verdict == PASS, purity_margin_pct == 50.000, failing_analytes == []"
            - "created_at == ${pt_created} on re-read; the row is byte-identical (no updated_at drift, no mutation path exists)"

      - name: production_lot_creation_rejects_unknown_production_asset_id
        claim_type: parent_relationships
        grounds:
