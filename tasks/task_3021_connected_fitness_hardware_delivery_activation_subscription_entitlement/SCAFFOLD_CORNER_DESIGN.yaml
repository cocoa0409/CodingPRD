            - call: "POST /fitness/delivery-appointments"
              payload: { device_id: "${d_bike}", hardware_order_id: "${o_bike}", start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z", zone: "METRO", technician_crew_code: "CREW-A", stair_flights: 0, has_elevator: false }
              as: ServiceTechnician
              captures: { a_bike: $.data.id }
            - call: "POST /fitness/delivery-appointments/${a_bike}/schedule"
              payload: { start_at: "2026-09-05T13:00:00Z", end_at: "2026-09-05T15:00:00Z" }
              as: ServiceTechnician
            - call: "POST /fitness/delivery-appointments/${a_bike}/start"
              payload: {}
              as: ServiceTechnician
            - call: "POST /fitness/delivery-appointments/${a_bike}/complete"
              payload: { completion_grade: "CLEAN" }
              as: ServiceTechnician
            - call: "POST /fitness/parts-inventory"
              payload: { part_code: "TREAD-BELT-42", compatible_sku: "TREAD", safety_stock_qty: 2, part_lot_key: "LOT-2026-09" }
              as: PlatformAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /fitness/parts-inventory/${pi_id}/restock"
              payload: { quantity: 5 }
              as: PlatformAdmin
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_bike}", reported_fault_code: "BELT_SLIP", diagnosis_note: "drivetrain noise" }
              as: ServiceTechnician
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
              payload: { part_id: "${pi_id}", quantity: 2 }
