      - name: royalty_accrual_computed_read
        claim_type: correct_result
        grounds:
          - calculations.royalty_accrual
          - endpoints.GET_/bureau/agreements/{id}/royalty
        distinguishing_aspect: "Royalty = round_half_up(sum of AUTHORIZED adoptions' authorized_premium_cents during the agreement window * royalty_rate_bps / 10000): one adoption authorized at 150000 cents under a 250 bps agreement yields 3750 cents."
        test_recipe:
          setup:
            - "EFFECTIVE TX filing (single 120000-cent cell); insurer with covering 250 bps agreement; adoption at multiplier 125 AUTHORIZED (authorized_premium_cents == 150000)."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
