        claim_type: precision
        grounds: [calculations.fiduciary_fee]

        distinguishing_aspect: "Rounding order pinned per-disbursement: two 3333-cent releases each round_half_up(166.65) = 167, month total 334 — the aggregate-then-round reading (round(333.30) = 333) is wrong."
        test_recipe:
          setup: ["ACTIVE client, account funded 100000, ACTIVE bond, APPROVED 2026-06 budget basis 100000 HOUSING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: FiduciaryAdmin }
