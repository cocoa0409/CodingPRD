            - call: "POST /claims/${claim1_id}/dispatches"
              payload: { window_start: "2026-09-10T09:00:00.000Z", expected_claim_version: "${claim1_v}", contractor_id: "${c_a_id}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
