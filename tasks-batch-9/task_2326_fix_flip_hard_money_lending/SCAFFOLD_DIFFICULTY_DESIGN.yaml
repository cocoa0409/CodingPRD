        grounds:
          - state_machines.Loan.payment_status.DELINQUENT_to_DEFAULT
          - state_machines.Borrower.APPROVED_SPONSOR_to_SUSPENDED
          - state_machines.LoanApplication.DRAFT_to_WITHDRAWN
          - state_machines.RehabLineItem.PROPOSED_to_VOID
          - state_machines.DrawRequest.SUBMITTED_to_SUSPENDED
          - entities.Borrower.fields.prior_default_count
          - entities.Borrower.fields.suspension_reason
          - validations[priority=12]
        distinguishing_aspect: |
          One default declaration propagates four levels deep along a path no single
          endpoint touches — Loan(1) -> Borrower SUSPENDED with prior_default_count
          incremented(2) -> that sponsor's OTHER DRAFT application WITHDRAWN(3) -> that
          application's scope lines VOID(4) — while a fifth, sideways branch suspends the
          defaulted loan's own open draw; the already-CLOSED application and its
