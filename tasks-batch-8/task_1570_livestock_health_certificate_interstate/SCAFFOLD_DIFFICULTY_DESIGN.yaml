              as: StateVetOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /api/outbreak-zones/${zone_id}/escalate"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 4, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_PERMIT_NOT_ISSUED' (permit SUSPENDED by the outbreak cascade)"
            - "No MovementRecord is created"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: outbreak_zone_half_open_adjacency
        grounds:
          - validations[priority=10]
          - entities.OutbreakZone.fields.effective_from
          - entities.OutbreakZone.fields.effective_until
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_until) on
          OutbreakZone. A zone starting exactly when its predecessor ends
          (adjacency, gap 0) is ACCEPTED; a zone starting one day earlier
          OVERLAPS and is rejected with ERR_ZONE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Empty DB; zone A for (Colusa, AVIAN_INFLUENZA, POULTRY) covering [2026-08-10, 2026-08-20)"
          setup_api_calls:
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "LOW", effective_from: "2026-08-10T00:00:00Z", effective_until: "2026-08-20T00:00:00Z" }
              as: StateVetOfficer
              captures: { zone_a: $.data.id }
          trigger:
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "LOW", effective_from: "2026-08-20T00:00:00Z", effective_until: "2026-08-30T00:00:00Z" }
              as: StateVetOfficer
              captures: { zone_b: $.data.id, zone_b_status: $.data.status }
            - call: "POST /api/outbreak-zones"
              payload: { county: "Colusa", state_code: "CA", disease_code: "AVIAN_INFLUENZA", species_code: "POULTRY", severity: "HIGH", effective_from: "2026-08-19T00:00:00Z" }
              as: StateVetOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Zone B (starts exactly at A's effective_until) is created with status 'MONITORED' (half-open adjacency allowed)"
            - "Zone C (starts 2026-08-19, one day inside A's window) returns error_id == 'ERR_ZONE_WINDOW_OVERLAP'"

      - name: quarantine_closed_interval_with_min_gap
        grounds:
          - validations[priority=10]
          - entities.QuarantineOrder.fields.start_at
          - entities.QuarantineOrder.fields.end_at
        distinguishing_aspect: |
          Different interval semantics on a different resource: QuarantineOrder
          windows are CLOSED intervals (touching endpoints conflict) AND a new
          order must respect a 14-day buffer after the most recent LIFTED/EXPIRED
          order — start exactly 14 days after the prior end_at passes, while 13
          days fails with ERR_QUARANTINE_MIN_GAP_VIOLATION, and any overlap with
          an ACTIVE order fails with ERR_QUARANTINE_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Premises (Yolo CATTLE); order Q1 [2026-06-12, 2026-07-10] created then lifted by a different officer"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch L", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-06-12T00:00:00Z", end_at: "2026-07-10T00:00:00Z", reason: "INITIAL_HOLD" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { q1: $.data.id }
            - call: "POST /api/quarantine-orders/${q1}/lift"
              as: StateVetOfficer
              as_user_id: "officer-b"
          trigger:
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-07-24T00:00:00Z", end_at: "2026-08-07T00:00:00Z", reason: "SECOND_HOLD" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { q2: $.data.id, q2_status: $.data.status }
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-07-22T00:00:00Z", end_at: "2026-07-23T00:00:00Z", reason: "TOO_SOON" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { gap_err: $.data.error_id }
            - call: "POST /api/quarantine-orders"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", disease_code: "BRUCELLOSIS", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z", reason: "OVERLAPPING" }
              as: StateVetOfficer
              as_user_id: "officer-a"
              captures: { ovl_err: $.data.error_id }
          assert:
            - "Q2 (starts exactly 14 days after Q1's end 2026-07-10) is created with status 'ACTIVE'"
            - "Q3 (gap 12 days) returns error_id == 'ERR_QUARANTINE_MIN_GAP_VIOLATION'"
            - "Q4 (closed-interval overlap with ACTIVE Q2 over 2026-08-01..2026-08-07) returns error_id == 'ERR_QUARANTINE_WINDOW_CONFLICT'"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: permit_headroom_conserved_by_cancel
        grounds:
          - calculations.permit_headroom
          - state_machines.MovementRecord.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: permit capacity. The forward action (schedule 6
          against allocation 10) paired with its compensating action (cancel that
          SCHEDULED record) leaves committed_headroom ==
          allocated_head_count - SUM(active records) unchanged at 10 — no
          capacity drift.
        test_recipe:
          setup:
            - "Issued certificate (10 head) at clock 2026-08-10; ISSUED permit allocated 10, window [2026-08-11, 2026-09-08]; committed_headroom 10"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch M", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 30, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
            - call: "POST /api/veterinarians"
              payload: { full_name: "Dr. Ada", accreditation_number: "ACCRED-1", accreditation_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { vet_id: $.data.id }
            - call: "POST /api/entry-requirements"
              payload: { destination_state_code: "KS", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_validity_days: 30, vaccination_required: true, vaccination_min_days_before_inspection: 14, permit_required: true, effective_from: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/test-records"
              payload: { premises_id: "${prem_id}", species_code: "CATTLE", test_type: "BRUCELLOSIS", test_date: "2026-07-12T00:00:00Z", lab_reference: "LAB-1" }
              as: LabTechnician
              captures: { test_id: $.data.id }
            - call: "POST /api/test-records/${test_id}/result"
              payload: { result: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/certificates"
              payload: { origin_premises_id: "${prem_id}", destination_state_code: "KS", species_code: "CATTLE", head_count: 10, inspection_date: "2026-08-10T00:00:00Z", test_record_id: "${test_id}", vaccination_date: "2026-07-12T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /api/certificates/${cert_id}/submit"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "POST /api/certificates/${cert_id}/issue"
              as: StateVetOfficer
            - call: "POST /api/movement-permits"
              payload: { certificate_id: "${cert_id}", allocated_head_count: 10, valid_from: "2026-08-11T00:00:00Z", valid_until: "2026-09-08T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /api/movement-permits/${perm_id}/issue"
              as: StateVetOfficer
          trigger:
            - call: "POST /api/movement-records"
              payload: { permit_id: "${perm_id}", head_count: 6, destination_name: "KS Feedlot", planned_ship_date: "2026-08-21T00:00:00Z" }
              as: AccreditedVet
              as_user_id: "${vet_id}"
              captures: { rec_id: $.data.id }
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { headroom_mid: $.data.committed_headroom }
            - call: "POST /api/movement-records/${rec_id}/cancel"
              as: AccreditedVet
              as_user_id: "${vet_id}"
            - call: "GET /api/movement-permits/${perm_id}"
              as: StateAuditor
              captures: { headroom_end: $.data.committed_headroom, projected_end: $.data.projected_headroom }
          assert:
            - "committed_headroom after schedule == 4"
            - "committed_headroom after cancel == 10 (forward + compensating pair conserves capacity)"
            - "projected_headroom after cancel == 10"

      - name: premises_inventory_conserved_by_depart_cancel
        grounds:
          - calculations.premises_inventory
          - state_machines.MovementRecord.SCHEDULED_to_IN_TRANSIT
          - state_machines.MovementRecord.IN_TRANSIT_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: animal count on the origin premises (a different
          conserved quantity from permit capacity). Depart (forward) drops
          current_head_count 20 -> 15; cancel from IN_TRANSIT (compensating)
          restores it to exactly initial_head_count 20.
        test_recipe:
          setup:
            - "Premises initial_head_count 20; issued certificate (5 head); ISSUED permit allocated 5, window [2026-08-11, 2026-09-08]; movement record of 5 SCHEDULED; clock advanced to 2026-08-21"
