  - section: validations
    instances:
      - name: snapshot_occ_stale_version_returns_412
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[snapshot-post-stale-carrier]
          - validations[priority=6]
        distinguishing_aspect: "After the first snapshot bumps Carrier.version 1 -> 2, a second snapshot still carrying the pre-first-write version is rejected ERR_STALE_VERSION (412) — the loser must re-read the carrier."
        test_recipe:
          setup: ["clock 2026-08-01; carrier created (version 1)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
          trigger:
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 40, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412): carrier version is 2 but the request carried ${car_v} == 1"
            - "no second snapshot row created (GET /api/safety-score-snapshots?carrier_id shows 1 row)"

      - name: config_patch_occ_stale_returns_412
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[config-patch-stale-config]
        distinguishing_aspect: "Config PATCH bumps version each time; replaying a PATCH with the pre-patch version fails ERR_STALE_VERSION (412) even though the payload is otherwise valid."
        test_recipe:
          setup: ["config CA created (v1); patched once to random_pull_in_rate_bps 500 (v2)"]
          setup_api_calls:
            - call: "POST /api/state-program-configs"
              payload: { state_code: "CA" }
              as: StateProgramManager
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { random_pull_in_rate_bps: 500, expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
          trigger:
            - call: "PATCH /api/state-program-configs/${cfg_id}"
              payload: { bypass_rate_cap_bps: 8000, expected_state_program_config_version: "${cfg_v}" }
              as: StateProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412); config still version 2 with bypass_rate_cap_bps 10000"

      - name: override_request_occ_stale_returns_412
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[override-request-stale-carrier]
        distinguishing_aspect: "An override request carrying a Carrier.version from before the enrollment-approval bump is rejected ERR_STALE_VERSION (412); the client must re-read the carrier."
        test_recipe:
          setup: ["clock 2026-08-01; carrier created (v1, captured) -> snapshot (v2) -> approve ACTIVE (v3)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
