# =============================================================================
# Esports Tournament Management System — Scaffold (v1)
# =============================================================================

scenario: |
  Esports tournament management system: team registration with team profile, roster (main/substitute),
  team-logo and sponsor information, team-qualification verification (region/age/ranking), entry-fee
  handling, and roster-lock deadline; player contracts with player profile and identity verification,
  contract-type (exclusive/loan/free-agent) configuration, contract-term and compensation clauses,
  multi-party signing workflow, contract-amendment and termination handling, and dispute-resolution
  clauses; tournament bracket scheduling (Swiss / double-elimination / round-robin / group-stage-plus-
  playoffs) with format-rule configuration, seeding rules (ranking/random/regional-balance), pairing
  algorithm per round, bye-handling, match-time-slot allocation, and bracket-publication workflow;
  ban/pick data recording with map-and-character pool configuration, ban-pick sequence rules,
  real-time recording during the draft, draft-history archiving for analytics, and draft-anomaly
  handling (disconnect/misclick); referee adjudication with referee roster and certification,
  match-incident classification (latency/cheating-suspicion/unsportsmanlike-conduct/rule-violation),
  evidence collection (replay/log/screenshot), ruling-decision workflow, penalty-application
  (warning/forfeit/disqualification/fine), and appeal handling; prize pool distribution with prize-tier
  by placement, crowdfunded-prize-pool aggregation rules, MVP and special-award handling, tax
  withholding by jurisdiction, multi-currency payout, and payout-record archiving; transfer
  management with transfer window definition, transfer-offer and negotiation workflow, transfer-fee
  handling, league-side approval, transfer-history archiving, and transfer-restriction rules
  (cooling-off period); event-driven synchronization with payment, broadcasting, game-publisher API,
  and IM systems; audit logging for ruling and transfer records.

domain_name: esports-tournament
api_prefix: /tournaments

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - temporal_windowing
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - compliance_audit_trail
  entity_topology: graph
  state_machine_shape: branching          # contracts have approve/reject branches; rulings can be appealed (cyclic)
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic                          # MatchIncident.subject can be Player|Team|Match
  role_model: peer_roles                   # TeamManager, Player, Referee, LeagueAdmin own different resource types
  consistency_model: saga                  # multi-party signing, multi-step payouts with compensation

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tournament name" }
      - { name: format, type: enum, source: input, description: "SWISS | DOUBLE_ELIMINATION | ROUND_ROBIN | GROUP_PLAYOFFS" }
      - { name: region, type: enum, source: input, description: "NA | EU | APAC | SA | GLOBAL" }
      - { name: min_age, type: integer, source: input, default: 16, description: "Minimum player age required for team qualification" }
      - { name: min_team_ranking_points, type: integer, source: input, default: 0, description: "Minimum aggregate team ranking points required" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Entry fee per team in minor currency units (cents)" }
      - { name: entry_fee_currency, type: enum, source: input, default: "USD", description: "USD | EUR | KRW | CNY" }
      - { name: roster_lock_deadline, type: datetime, source: input, description: "ISO 8601 UTC after which rosters become immutable" }
      - { name: registration_deadline, type: datetime, source: input, description: "ISO 8601 UTC after which TeamRegistration creation is rejected" }
      - { name: base_prize_pool_cents, type: integer, source: input, description: "Sponsor-funded prize pool baseline in cents" }
      - { name: crowdfunded_prize_pool_cents, type: integer, source: computed, description: "Read-only: sum of CrowdfundContribution.amount_cents in COLLECTED status" }
      - { name: total_prize_pool_cents, type: integer, source: computed, description: "Read-only: base_prize_pool_cents + crowdfunded_prize_pool_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | REGISTRATION_OPEN | ROSTER_LOCKED | BRACKET_PUBLISHED | IN_PROGRESS | COMPLETED | PRIZES_DISTRIBUTED | CANCELLED" }
      - { name: prize_tier_table, type: array, source: input, description: "Ordered list of {placement:int, percentage_bps:int} where percentage_bps sums to 10000 (basis points)" }
      - { name: ban_pick_sequence, type: array, source: input, description: "Ordered list of {step:int, team:'A'|'B', action:'BAN'|'PICK'} defining the draft order" }
      - { name: map_pool, type: array, source: input, description: "List of map names available for ban/pick" }
      - { name: character_pool, type: array, source: input, description: "List of character names available for ban/pick" }
      - { name: seeding_rule, type: enum, source: input, default: "RANKING", description: "RANKING | RANDOM | REGIONAL_BALANCE" }
      - { name: bracket_published_at, type: datetime, source: computed, description: "Timestamp the bracket was published; null until BRACKET_PUBLISHED" }

  - name: TeamRegistration
    parent: Tournament
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: system, description: "Parent Tournament id" }
      - { name: team_name, type: string, source: input, description: "Team display name, unique within tournament" }
      - { name: manager_id, type: string, source: input, description: "User id of the registering TeamManager; must equal X-User-ID at creation" }
      - { name: region, type: enum, source: input, description: "NA | EU | APAC | SA — used for regional-balance seeding and region-eligibility check" }
      - { name: logo_url, type: string, source: input, required: false, description: "Team logo URL" }
      - { name: sponsors, type: array, source: input, description: "List of {name:string, tier:'GOLD'|'SILVER'|'BRONZE'} sponsor blocks" }
      - { name: seed_number, type: integer, source: computed, description: "Assigned at bracket publication; lower is better" }
      - { name: ranking_points_snapshot, type: integer, source: computed, description: "Snapshot of sum of PlayerContract.ranking_points across main roster at the moment of REGISTERED transition; pins qualification check" }
      - { name: entry_fee_paid_cents, type: integer, source: computed, description: "Cumulative entry fee successfully recorded in entry_fee_currency" }
      - { name: status, type: enum, source: system, description: "DRAFT | FEE_PENDING | REGISTERED | DISQUALIFIED | WITHDRAWN" }
      - { name: roster_locked, type: boolean, source: computed, description: "True iff Tournament.status >= ROSTER_LOCKED OR Tournament.roster_lock_deadline has passed" }

  - name: PlayerContract
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "Persistent player identity id (across teams)" }
      - { name: player_legal_name, type: string, source: input, description: "Legal name on file" }
      - { name: player_age, type: integer, source: input, description: "Age in whole years; must be >= Tournament.min_age when assigned to a roster" }
      - { name: identity_verified, type: boolean, source: computed, default: false, description: "True once IdentityVerification.status == VERIFIED for this player" }
      - { name: team_id, type: string, source: input, description: "TeamRegistration this contract is currently bound to (may change on transfer)" }
      - { name: contract_type, type: enum, source: input, description: "EXCLUSIVE | LOAN | FREE_AGENT" }
      - { name: roster_slot, type: enum, source: input, description: "MAIN | SUBSTITUTE" }
      - { name: term_start, type: datetime, source: input, description: "ISO 8601 UTC contract effective start" }
      - { name: term_end, type: datetime, source: input, description: "ISO 8601 UTC contract end; must satisfy term_end > term_start" }
      - { name: monthly_compensation_cents, type: integer, source: input, description: "Cash compensation per calendar month in minor units of compensation_currency" }
      - { name: compensation_currency, type: enum, source: input, default: "USD", description: "USD | EUR | KRW | CNY" }
      - { name: dispute_resolution_clause, type: enum, source: input, default: "ARBITRATION", description: "ARBITRATION | LITIGATION | MEDIATION" }
      - { name: ranking_points, type: integer, source: input, default: 0, description: "Player's current ranking points (input from external ranking)" }
      - { name: required_signatories, type: array, source: input, description: "Ordered list of {party:'PLAYER'|'TEAM_MANAGER'|'LEAGUE_ADMIN'} pinning the multi-party signing chain" }
      - { name: signatures, type: array, source: system, description: "List of {party:string, signed_by_user_id:string, signed_at:datetime} appended on each signing step" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_SIGNATURES | ACTIVE | AMENDMENT_PENDING | TERMINATED | EXPIRED" }
      - { name: signed_version_id, type: string, source: computed, description: "Frozen contract version id pinned at the PENDING_SIGNATURES→ACTIVE transition; null otherwise" }

  - name: IdentityVerification
    parent: PlayerContract
    common_fields: false   # immutable audit-style record (id + created_at only)
    fields:
      - { name: player_id, type: string, source: input, description: "Player whose identity is being verified" }
      - { name: contract_id, type: string, source: system, description: "PlayerContract that triggered this verification" }
      - { name: document_hash, type: string, source: input, description: "Hash of submitted identity document (server does not store the document itself)" }
      - { name: jurisdiction, type: enum, source: input, description: "ISO-3166 alpha-2 country code; determines tax withholding rate" }
      - { name: status, type: enum, source: input, description: "VERIFIED | REJECTED — set in a single shot by LeagueAdmin" }
      - { name: rejection_reason, type: string, source: input, required: false, description: "Free-text reason when status=REJECTED" }

  - name: Match
    parent: Tournament
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: system, description: "Parent Tournament id" }
      - { name: round_number, type: integer, source: input, description: "1-based round index within the tournament format" }
      - { name: bracket_position, type: integer, source: input, description: "Slot within the round, 1-based; pairs with seeding output" }
      - { name: team_a_id, type: string, source: computed, description: "Computed by pairing algorithm; null for bye matches" }
      - { name: team_b_id, type: string, source: computed, description: "Computed by pairing algorithm; null for bye matches" }
      - { name: is_bye, type: boolean, source: computed, description: "True if exactly one of team_a_id/team_b_id is null (advances the non-null team automatically)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Allocated match-time slot (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "scheduled_start + Tournament-format-rule slot duration; pins overlap detection" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DRAFT_IN_PROGRESS | LIVE | COMPLETED | FORFEITED | DISQUALIFIED" }
      - { name: winner_team_id, type: string, source: computed, description: "Set on COMPLETED/FORFEITED transitions" }
      - { name: forfeit_reason, type: string, source: computed, required: false, description: "Populated on FORFEITED" }

  - name: DraftEvent
    parent: Match
    common_fields: false   # append-only event log
    fields:
      - { name: match_id, type: string, source: system, description: "Parent Match id" }
      - { name: step_index, type: integer, source: input, description: "Position in Tournament.ban_pick_sequence; MUST be the next expected step (strict ordering)" }
      - { name: action, type: enum, source: input, description: "BAN | PICK" }
      - { name: side, type: enum, source: input, description: "A | B" }
      - { name: target_type, type: enum, source: input, description: "MAP | CHARACTER" }
      - { name: target_name, type: string, source: input, description: "Name of the map or character chosen" }
      - { name: anomaly_type, type: enum, source: input, required: false, description: "DISCONNECT | MISCLICK | null — when present, side_effects compensate per rules" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the Referee or system actor that wrote this row" }

  - name: MatchIncident
    parent: Match
    common_fields: true
    fields:
      - { name: match_id, type: string, source: system, description: "Parent Match id" }
      - { name: subject_type, type: enum, source: input, description: "PLAYER | TEAM | MATCH — polymorphic subject of the incident" }
      - { name: subject_id, type: string, source: input, description: "Id of the PlayerContract, TeamRegistration, or Match referenced by subject_type" }
      - { name: classification, type: enum, source: input, description: "LATENCY | CHEATING_SUSPICION | UNSPORTSMANLIKE_CONDUCT | RULE_VIOLATION" }
      - { name: evidence, type: array, source: input, description: "List of {kind:'REPLAY'|'LOG'|'SCREENSHOT', uri:string, hash:string}" }
      - { name: referee_id, type: string, source: input, description: "User id of the certified Referee filing the incident; must match X-User-ID" }
      - { name: ruling, type: enum, source: system, description: "PENDING | UPHELD | DISMISSED | OVERTURNED" }
      - { name: penalty_type, type: enum, source: computed, description: "NONE | WARNING | FORFEIT | DISQUALIFICATION | FINE — set when ruling=UPHELD" }
      - { name: fine_amount_cents, type: integer, source: input, required: false, description: "Required iff penalty_type=FINE; in Tournament.entry_fee_currency" }
      - { name: appeal_count, type: integer, source: computed, default: 0, description: "Number of times an appeal cycle has run; cap at MAX_APPEALS=1" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | RULED | APPEALED | CLOSED" }

  - name: Referee
    parent: null
    common_fields: true
    fields:
      - { name: user_id, type: string, source: input, description: "Stable user id used as X-User-ID when acting as Referee" }
      - { name: full_name, type: string, source: input, description: "Referee legal name" }
      - { name: certification_level, type: enum, source: input, description: "L1 | L2 | L3 — required level must equal or exceed Tournament.required_referee_level" }
      - { name: certification_expiry, type: datetime, source: input, description: "After this UTC timestamp, the referee cannot file new MatchIncident rows (ERR_REFEREE_CERT_EXPIRED)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: CrowdfundContribution
    parent: Tournament
    common_fields: false   # immutable ledger row
    fields:
      - { name: tournament_id, type: string, source: system, description: "Parent Tournament id" }
      - { name: contributor_user_id, type: string, source: input, description: "Opaque contributor id" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount in Tournament.entry_fee_currency" }
      - { name: status, type: enum, source: input, description: "PLEDGED | COLLECTED | REFUNDED — only COLLECTED rows count toward crowdfunded_prize_pool_cents" }

  - name: PrizePayout
    parent: Tournament
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: system, description: "Parent Tournament id" }
      - { name: team_id, type: string, source: computed, description: "Recipient TeamRegistration id; null when payout is a player MVP/special award" }
      - { name: player_id, type: string, source: computed, description: "Recipient PlayerContract.player_id when special-award payout; null otherwise" }
      - { name: award_kind, type: enum, source: computed, description: "PLACEMENT | MVP | SPECIAL_AWARD" }
      - { name: placement, type: integer, source: computed, description: "1-based final placement; null when award_kind != PLACEMENT" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Pre-tax payout in entry_fee_currency; computed via prize_share_provisional / prize_share_final" }
      - { name: tax_withheld_cents, type: integer, source: computed, description: "Pre-payout tax withholding; computed via tax_withholding calculation" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross_amount_cents - tax_withheld_cents; the actual wire amount" }
      - { name: payout_currency, type: enum, source: computed, description: "Recipient's preferred currency: defaults to entry_fee_currency; overridden by team payout preference" }
      - { name: jurisdiction, type: enum, source: computed, description: "ISO-3166 alpha-2 of the recipient that pinned the tax rate" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | PAID | CLAWED_BACK" }

  - name: TransferOffer
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "Player being transferred (matches PlayerContract.player_id)" }
      - { name: from_team_id, type: string, source: input, description: "Origin TeamRegistration id (current contract holder)" }
      - { name: to_team_id, type: string, source: input, description: "Destination TeamRegistration id" }
      - { name: window_id, type: string, source: input, description: "TransferWindow id within which the offer is filed" }
      - { name: transfer_fee_cents, type: integer, source: input, description: "Offered transfer fee" }
      - { name: transfer_fee_currency, type: enum, source: input, description: "USD | EUR | KRW | CNY" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | ACCEPTED_BY_FROM | ACCEPTED_BY_BOTH | LEAGUE_APPROVED | REJECTED | EXPIRED" }
      - { name: from_team_decision_at, type: datetime, source: system, description: "Timestamp the from-team accepted/rejected" }
      - { name: to_team_decision_at, type: datetime, source: system, description: "Timestamp the to-team accepted/rejected" }
      - { name: league_decision_at, type: datetime, source: system, description: "Timestamp the LeagueAdmin approved/rejected" }
      - { name: history, type: array, source: system, description: "Append-only list of {round:int, by:'FROM'|'TO', action:'PROPOSE'|'COUNTER'|'ACCEPT'|'REJECT', terms:{...}, at:datetime}" }

  - name: TransferWindow
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Window display name" }
      - { name: opens_at, type: datetime, source: input, description: "Window opens at this UTC time (half-open [opens_at, closes_at))" }
      - { name: closes_at, type: datetime, source: input, description: "Window closes at this UTC time" }
      - { name: cooling_off_days, type: integer, source: input, default: 30, description: "After a player's LEAGUE_APPROVED transfer, the same player_id cannot be the subject of another approved transfer until cooling_off_days have elapsed" }

  - name: AuditLogEntry
    parent: null
    common_fields: false  # immutable; id + created_at only
    fields:
      - { name: subject_type, type: enum, source: system, description: "MATCH_INCIDENT | TRANSFER_OFFER — only these two domains are audit-logged per scenario" }
      - { name: subject_id, type: string, source: system, description: "Id of the audited resource" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor" }
      - { name: actor_role, type: enum, source: system, description: "Role asserted in X-User-Role header at the moment of the action" }
      - { name: action, type: string, source: system, description: "Human-readable action label (e.g., 'FILE', 'RULE_UPHELD', 'APPEAL', 'APPROVE_TRANSFER')" }
      - { name: payload, type: object, source: system, description: "Frozen snapshot of relevant fields immediately before+after the action" }

  - name: Clock
    parent: null
    common_fields: false  # singleton, system-managed
    fields:
      - { name: now, type: datetime, source: system, description: "Current server time; advanced only via POST /_clock/advance for time-gated tests" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Tournament
    initial_state: DRAFT
    terminal_states: [PRIZES_DISTRIBUTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: POST /tournaments/{tid}/open-registration
        actor: LeagueAdmin
        preconditions:
          - "Tournament has at least one entry in prize_tier_table; sum(prize_tier_table.percentage_bps) + MVP_BPS == 10000 exactly (ERR_PRIZE_TIER_SUM_MISMATCH)"
          - "Tournament.registration_deadline > Clock.now (ERR_REGISTRATION_DEADLINE_PASSED)"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: ROSTER_LOCKED
        trigger: POST /_clock/advance (auto when Clock.now >= roster_lock_deadline) OR POST /tournaments/{tid}/lock-rosters
        actor: system | LeagueAdmin
        preconditions: []
        side_effects:
          - "For every TeamRegistration in DRAFT/FEE_PENDING under this Tournament: status→WITHDRAWN (cascade A→B)"
          - "TeamRegistration.roster_locked auto-flips to true for every REGISTERED registration"
      - from: ROSTER_LOCKED
        to: BRACKET_PUBLISHED
        trigger: POST /tournaments/{tid}/publish-bracket
        actor: LeagueAdmin
        preconditions:
          - "At least 2 TeamRegistration rows in REGISTERED status (ERR_INSUFFICIENT_TEAMS)"
          - "Tournament.seeding_rule resolvable (RANKING requires ranking_points_snapshot pinned for every registered team)"
        side_effects:
          - "seed_number is assigned to every REGISTERED TeamRegistration per Tournament.seeding_rule"
          - "Match rows are created for round 1 per format-rule; bye assignment fills any odd team out (is_bye=true, winner_team_id pre-set to the non-null side)"
          - "bracket_published_at = Clock.now"
      - from: BRACKET_PUBLISHED
        to: IN_PROGRESS
        trigger: POST /tournaments/{tid}/start
        actor: LeagueAdmin
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /tournaments/{tid}/complete (auto when all Match rows are in terminal state)
        actor: system
        preconditions:
          - "Every Match.status is in {COMPLETED, FORFEITED, DISQUALIFIED} (ERR_MATCHES_INCOMPLETE)"
        side_effects:
          - "Final placement for every TeamRegistration is computed and PrizePayout rows are emitted in PROVISIONAL status (prize_share_provisional)"
      - from: COMPLETED
        to: PRIZES_DISTRIBUTED
        trigger: POST /tournaments/{tid}/distribute-prizes
        actor: LeagueAdmin
        preconditions:
          - "Every PrizePayout for this tournament is in FINALIZED status (ERR_PRIZE_POOL_NOT_FINALIZED)"
          - "Sum of PrizePayout.gross_amount_cents == Tournament.total_prize_pool_cents (ERR_PRIZE_POOL_INVARIANT — compensating_invariant Rule 9)"
        side_effects:
          - "Every PrizePayout.status: FINALIZED→PAID (cascade)"
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: POST /tournaments/{tid}/cancel
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "Every TeamRegistration in FEE_PENDING/REGISTERED: status→WITHDRAWN and entry_fee_paid_cents is refunded (entry-fee refund invariant)"
          - "Every CrowdfundContribution in COLLECTED: status→REFUNDED (compensating_invariant Rule 9)"

  - entity: TeamRegistration
    initial_state: DRAFT
    terminal_states: [DISQUALIFIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FEE_PENDING
        trigger: POST /tournaments/{tid}/team-registrations
        actor: TeamManager
        preconditions:
          - "Tournament.status == REGISTRATION_OPEN (ERR_REGISTRATION_NOT_OPEN)"
          - "X-User-ID == manager_id (ERR_FORBIDDEN)"
          - "team_name unique within Tournament where status != WITHDRAWN (ERR_DUPLICATE_TEAM_NAME)"
        side_effects: []
      - from: FEE_PENDING
        to: REGISTERED
        trigger: POST /team-registrations/{rid}/pay-entry-fee
        actor: TeamManager
        preconditions:
          - "Sum of submitted-payment amount_cents (after FX conversion to entry_fee_currency) >= Tournament.entry_fee_cents (ERR_ENTRY_FEE_INSUFFICIENT)"
          - "TeamRegistration must have >=5 MAIN-slot PlayerContract rows bound to it, each identity_verified=true (ERR_ROSTER_INCOMPLETE)"
          - "qualification_check passes: every player's age >= Tournament.min_age (ERR_PLAYER_UNDERAGE), team region matches Tournament.region or Tournament.region=GLOBAL (ERR_REGION_MISMATCH), aggregate ranking_points >= Tournament.min_team_ranking_points (ERR_TEAM_RANKING_INSUFFICIENT)"
        side_effects:
          - "ranking_points_snapshot = sum of PlayerContract.ranking_points across MAIN slot at this moment (pins the qualification snapshot)"
          - "entry_fee_paid_cents += converted amount"
      - from: REGISTERED
        to: DISQUALIFIED
        trigger: System on MatchIncident penalty_type=DISQUALIFICATION ruling=UPHELD when subject_type=TEAM
        actor: system
        preconditions: []
        side_effects:
          - "Every non-terminal Match where team_a_id == this.id OR team_b_id == this.id: status→FORFEITED, winner_team_id := the other side, forfeit_reason := 'Team disqualified by incident <id>' (transitive_cascade Rule 4 hop 1)"
          - "Every forfeited Match emits an automatic 'bracket advance' adjusting downstream Match.team_a_id/team_b_id per format-rule (transitive_cascade Rule 4 hop 2)"
          - "Any PROVISIONAL PrizePayout already emitted with team_id == this.id: status→CLAWED_BACK and gross_amount_cents→0 (transitive_cascade Rule 4 hop 3)"
      - from: FEE_PENDING
        to: WITHDRAWN
        trigger: POST /team-registrations/{rid}/withdraw OR Tournament cancel cascade
        actor: TeamManager | system
        preconditions:
          - "Clock.now < Tournament.roster_lock_deadline (ERR_ROSTER_LOCKED)"
        side_effects: []
      - from: REGISTERED
        to: WITHDRAWN
        trigger: POST /team-registrations/{rid}/withdraw
        actor: TeamManager
        preconditions:
          - "Clock.now < Tournament.roster_lock_deadline (ERR_ROSTER_LOCKED)"
        side_effects:
          - "entry_fee_paid_cents refund event: a compensating record reduces tournament-level revenue ledger by the same amount (compensating_invariant Rule 9 — entry-fee conservation)"

  - entity: PlayerContract
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURES
        trigger: POST /player-contracts/{cid}/initiate-signing
        actor: TeamManager
        preconditions:
          - "PlayerContract.identity_verified == true (ERR_IDENTITY_NOT_VERIFIED)"
          - "term_end > term_start (ERR_INVALID_CONTRACT_TERM)"
          - "required_signatories non-empty (ERR_NO_SIGNATORIES)"
        side_effects: []
      - from: PENDING_SIGNATURES
        to: PENDING_SIGNATURES
        trigger: POST /player-contracts/{cid}/sign
        actor: Player | TeamManager | LeagueAdmin
        preconditions:
          - "signatures length < required_signatories length"
          - "Calling role matches required_signatories[len(signatures)].party (ERR_WRONG_SIGNATORY)"
        side_effects:
          - "signatures append {party, signed_by_user_id=X-User-ID, signed_at=Clock.now}"
      - from: PENDING_SIGNATURES
        to: ACTIVE
        trigger: POST /player-contracts/{cid}/sign (final signatory)
        actor: required_signatories[-1].party
        preconditions:
          - "After this sign, signatures length == required_signatories length"
          - "TeamRegistration of team_id is not in WITHDRAWN/DISQUALIFIED (ERR_TEAM_NOT_ELIGIBLE — cross_entity_state_dependency Rule 7)"
        side_effects:
          - "signed_version_id = PlayerContract.version (version_pinning_on_approval) — captures the exact version that all parties signed; later amendments must clear it"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: POST /player-contracts/{cid}/amendments
        actor: TeamManager
        preconditions:
          - "PlayerContract.signed_version_id is not null"
          - "Clock.now < term_end"
        side_effects:
          - "signed_version_id cleared (set to null) — pending amendment invalidates the previously frozen signed version (version_pinning_on_approval)"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: POST /player-contracts/{cid}/amendments/{aid}/approve
        actor: LeagueAdmin
        preconditions:
          - "All required_signatories have re-signed the amended terms"
        side_effects:
          - "signed_version_id := current PlayerContract.version (re-pinned)"
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /player-contracts/{cid}/terminate
        actor: LeagueAdmin
        preconditions:
          - "Termination request supplies a reason and dispute_resolution_clause has been invoked (recorded as part of payload)"
        side_effects:
          - "If TeamRegistration.status == REGISTERED and this was a MAIN slot player, mark TeamRegistration.status field 'roster_incomplete_flag' (no longer eligible to play in future matches; existing scheduled matches forfeit on play attempt)"
      - from: ACTIVE
        to: EXPIRED
        trigger: POST /_clock/advance (auto when Clock.now >= term_end)
        actor: system
        preconditions: []
        side_effects: []

  - entity: Match
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, FORFEITED, DISQUALIFIED]
    transitions:
      - from: SCHEDULED
        to: DRAFT_IN_PROGRESS
        trigger: POST /matches/{mid}/start-draft
        actor: Referee
        preconditions:
          - "Referee.user_id matches X-User-ID and Referee.status==ACTIVE and Clock.now < Referee.certification_expiry (ERR_REFEREE_CERT_EXPIRED)"
          - "Clock.now >= Match.scheduled_start and Clock.now < Match.scheduled_end (ERR_MATCH_NOT_IN_WINDOW)"
          - "Both team_a_id and team_b_id are populated (is_bye must be false; bye matches skip draft)"
        side_effects: []
      - from: DRAFT_IN_PROGRESS
        to: LIVE
        trigger: POST /matches/{mid}/draft-events (final step) OR POST /matches/{mid}/complete-draft
        actor: Referee
        preconditions:
          - "Count of DraftEvent rows == length of Tournament.ban_pick_sequence"
        side_effects: []
      - from: LIVE
        to: COMPLETED
        trigger: POST /matches/{mid}/report-result
        actor: Referee
        preconditions:
          - "winner_team_id in {team_a_id, team_b_id}"
        side_effects:
          - "If this is the final match of the tournament format, the parent Tournament.transition COMPLETED-trigger becomes satisfiable"
      - from: LIVE
        to: FORFEITED
        trigger: POST /matches/{mid}/forfeit OR System cascade from TeamRegistration disqualification
        actor: Referee | system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: FORFEITED
        trigger: System cascade from TeamRegistration disqualification (when match not yet started)
        actor: system
        preconditions: []
        side_effects: []

  - entity: MatchIncident
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: POST /match-incidents/{iid}/assign
        actor: LeagueAdmin
        preconditions:
          - "Referee certification check passes for the filing referee at the moment of the file (re-validated here)"
        side_effects:
          - "Append AuditLogEntry {action:'ASSIGN_REVIEW'}"
      - from: UNDER_REVIEW
        to: RULED
        trigger: POST /match-incidents/{iid}/rule
        actor: LeagueAdmin
        preconditions:
          - "Ruling body supplies ruling ∈ {UPHELD, DISMISSED} and a penalty_type if UPHELD"
          - "If penalty_type == FINE then fine_amount_cents must be > 0 (ERR_FINE_AMOUNT_REQUIRED)"
        side_effects:
          - "Append AuditLogEntry {action:'RULE_'+ruling}"
          - "If ruling==UPHELD and penalty_type==DISQUALIFICATION and subject_type==TEAM: TeamRegistration.status REGISTERED→DISQUALIFIED (kicks off transitive_cascade Rule 4)"
          - "If ruling==UPHELD and penalty_type==FINE: a FineLedger row debits the team's deposit (named-quantity invariant; sum of all fine ledger rows == sum of UPHELD fines — compensating_invariant Rule 9)"
      - from: RULED
        to: APPEALED
        trigger: POST /match-incidents/{iid}/appeal
        actor: TeamManager
        preconditions:
          - "appeal_count < 1 (MAX_APPEALS) (ERR_APPEAL_LIMIT_REACHED)"
          - "Clock.now < ruled_at + 72h (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "appeal_count += 1"
      - from: APPEALED
        to: RULED
        trigger: POST /match-incidents/{iid}/appeal-decide
        actor: LeagueAdmin
        preconditions: []
        side_effects:
          - "If decision overturns: ruling=OVERTURNED, penalty_type=NONE, and every cascade triggered by the prior UPHELD is reversed: TeamRegistration moves DISQUALIFIED→REGISTERED, all FORFEITED matches return to their prior state, all CLAWED_BACK PrizePayouts return to PROVISIONAL with their gross_amount_cents restored (compensating_invariant Rule 9 — disqualification reversal conserves the bracket)"
      - from: RULED
        to: CLOSED
        trigger: POST /match-incidents/{iid}/close
        actor: LeagueAdmin
        preconditions:
          - "appeal_count == 1 OR Clock.now >= ruled_at + 72h"
        side_effects: []

  - entity: TransferOffer
    initial_state: PROPOSED
    terminal_states: [LEAGUE_APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: POST /transfer-offers/{oid}/counter
        actor: TeamManager (from_team)
        preconditions:
          - "TransferWindow.opens_at <= Clock.now < TransferWindow.closes_at (ERR_WINDOW_CLOSED — resource_temporal_overlap Rule 8 — half-open window)"
          - "from_team's cooling-off check passes: no prior TransferOffer with same player_id reached LEAGUE_APPROVED within the last TransferWindow.cooling_off_days (ERR_COOLING_OFF_ACTIVE)"
        side_effects:
          - "history append counter terms"
      - from: PROPOSED
        to: ACCEPTED_BY_FROM
        trigger: POST /transfer-offers/{oid}/accept
        actor: TeamManager (from_team)
        preconditions: []
        side_effects:
          - "from_team_decision_at = Clock.now"
      - from: COUNTERED
        to: ACCEPTED_BY_FROM
        trigger: POST /transfer-offers/{oid}/accept (by to_team after counter)
        actor: TeamManager (to_team)
        preconditions: []
        side_effects:
          - "from_team_decision_at = Clock.now (counter-acceptance implicitly accepts the from side)"
      - from: ACCEPTED_BY_FROM
        to: ACCEPTED_BY_BOTH
        trigger: POST /transfer-offers/{oid}/co-accept
        actor: TeamManager (to_team)
        preconditions:
          - "TransferWindow.opens_at <= Clock.now < TransferWindow.closes_at"
        side_effects:
          - "to_team_decision_at = Clock.now"
      - from: ACCEPTED_BY_BOTH
        to: LEAGUE_APPROVED
        trigger: POST /transfer-offers/{oid}/league-approve
        actor: LeagueAdmin
        preconditions:
          - "Cooling-off invariant re-checked on player_id (ERR_COOLING_OFF_ACTIVE)"
          - "Player's current PlayerContract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE — cross_entity_state_dependency Rule 7)"
        side_effects:
          - "PlayerContract.team_id is reassigned from from_team_id to to_team_id (a TransferLedger row is appended preserving the named quantity: sum across all teams of active main-roster size minus opening-day total = sum of net transfers — compensating_invariant Rule 9)"
          - "to_team.entry_fee_paid_cents is debited by transfer_fee_cents in transfer_fee_currency (after FX) — and from_team is credited (transitive_cascade Rule 4 hop 1 → hop 2 via TransferLedger update → hop 3 audit log append)"
          - "Append AuditLogEntry {action:'APPROVE_TRANSFER'}"
      - from: PROPOSED
        to: REJECTED
        trigger: POST /transfer-offers/{oid}/reject
        actor: TeamManager (from_team or to_team) | LeagueAdmin
        preconditions: []
        side_effects: []
      - from: ACCEPTED_BY_BOTH
        to: REJECTED
        trigger: POST /transfer-offers/{oid}/league-approve (rejection branch)
        actor: LeagueAdmin
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: EXPIRED
        trigger: POST /_clock/advance (auto when Clock.now >= TransferWindow.closes_at)
        actor: system
        preconditions: []
        side_effects: []

  - entity: PrizePayout
    initial_state: PROVISIONAL
    terminal_states: [PAID, CLAWED_BACK]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: POST /tournaments/{tid}/finalize-prize-pool
        actor: LeagueAdmin
        preconditions:
          - "Tournament.status == COMPLETED (ERR_TOURNAMENT_NOT_COMPLETED)"
          - "gross_amount_cents recomputed via prize_share_final agrees with the row before transition (ERR_PRIZE_FINAL_MISMATCH)"
        side_effects:
          - "tax_withheld_cents is locked at this point using tax_withholding (jurisdiction snapshot pinned)"
      - from: FINALIZED
        to: PAID
        trigger: System on Tournament.status COMPLETED→PRIZES_DISTRIBUTED cascade
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONAL
        to: CLAWED_BACK
        trigger: System on TeamRegistration DISQUALIFIED cascade
        actor: system
        preconditions: []
        side_effects:
          - "gross_amount_cents := 0; remaining funds returned to Tournament.total_prize_pool_cents pool for redistribution to remaining placements"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two TeamManagers concurrently pay entry fees for the last open slot in a capped tournament"
    guarantee: "At most Tournament.max_teams TeamRegistrations reach REGISTERED; later writer is rejected"
    error_id: ERR_TOURNAMENT_FULL
    http_status: 409
    serialization: "First-writer-wins on count(TeamRegistration where status=REGISTERED)"

  - scenario: "Player sign and TeamManager amendment happen concurrently on the same contract"
    guarantee: "Exactly one operation succeeds; loser rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on PlayerContract.status"

  - scenario: "Two Referees simultaneously file MatchIncident on the same subject of the same match"
    guarantee: "Both incidents may be recorded; system MUST guarantee monotonic incident_id ordering so audit logs serialize"
    error_id: ERR_DUPLICATE_INCIDENT
    http_status: 409
    serialization: "First-writer-wins on (match_id, subject_id, classification) uniqueness"

  - scenario: "Two Match.report-result calls race after both teams claim victory"
    guarantee: "Only one report is accepted; second receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Match.status LIVE→COMPLETED"

  - scenario: "Two LeagueAdmins concurrently approve transfers for the same player_id in the same window"
    guarantee: "At most one TransferOffer reaches LEAGUE_APPROVED; second hits cooling-off invariant"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on TransferOffer.status ACCEPTED_BY_BOTH→LEAGUE_APPROVED per player_id"

  - scenario: "Concurrent DraftEvent writes attempt to claim the same step_index"
    guarantee: "Strict ordering enforced; second writer with same step_index rejected"
    error_id: ERR_DRAFT_STEP_TAKEN
    http_status: 409
    serialization: "First-writer-wins on (match_id, step_index) uniqueness"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: prize_share_provisional
    trigger: "On Tournament.status IN_PROGRESS→COMPLETED transition; one PrizePayout row per Tournament.prize_tier_table entry, plus one MVP row"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL: includes ALL TeamRegistration that reached REGISTERED, regardless of DISQUALIFIED status
      # (forward-looking — assume disqualifications may yet be appealed)
      eligible_teams = [t for t in TeamRegistration where tournament_id=T.id AND status IN {REGISTERED, DISQUALIFIED}]
      sorted_by_placement = sort eligible_teams by (final_placement ASC, ranking_points_snapshot DESC, id ASC)  # tie-break pinned
      pool = T.total_prize_pool_cents  # = base + sum(crowdfund where status=COLLECTED)
      payouts = []
      for tier in T.prize_tier_table sorted by placement ASC:
        team = sorted_by_placement[tier.placement - 1]
        gross = round_half_up(pool * tier.percentage_bps / 10000)  # round once at the row level
        payouts.append({team_id: team.id, gross_amount_cents: gross, award_kind: 'PLACEMENT', placement: tier.placement})
      # MVP: 5% of pool to the single highest-aggregate-score player; tie-break: lowest player_id lexicographic
      mvp = pick_mvp_player(T)
      payouts.append({player_id: mvp.player_id, gross_amount_cents: round_half_up(pool * MVP_BPS / 10000), award_kind: 'MVP'})
      return payouts
    input_set: "TeamRegistration rows in {REGISTERED, DISQUALIFIED} (provisional includes DISQUALIFIED — forward-looking)"
    constants:
      MVP_BPS: 500       # 5% in basis points
      ROUND_MODE: "round_half_up"
      ROUND_PLACES: 0    # integer cents
    precision: "integer cents, round_half_up"
    variants:
      - name: prize_share_final
        when: "Computed during PROVISIONAL→FINALIZED transition; excludes any TeamRegistration in DISQUALIFIED (chronological — disqualifications now final)"
        difference: |
          input_set restricted to TeamRegistration where status==REGISTERED only.
          eligible_teams = [t for t in TeamRegistration where tournament_id=T.id AND status=REGISTERED]
          Placements collapse upward — placement N is taken by the (N)-th remaining team, so DISQUALIFIED holes
          do not waste prize tiers. The two algorithms operating on identical data BEFORE any disqualification
          produce identical numbers; after disqualification they diverge: provisional pays the disqualified team
          zero (CLAWED_BACK), final reallocates that slot's prize percentage to the next team upward. This
          satisfies dual_variant_calc Rule 1 on the prize-pool domain.

  - name: tax_withholding
    trigger: "On PrizePayout PROVISIONAL→FINALIZED transition; locks tax_withheld_cents on each row"
    algorithm: tiered_pricing
    formula: |
      # Tiered withholding rate by recipient jurisdiction
      # Multi-jurisdiction with rate floors: nested min/max + conditional branch on entity state — combinatorial_formula mode (a)
      jurisdiction = recipient_jurisdiction(payout)  # for team payouts: jurisdiction of TeamRegistration.manager (looked up via IdentityVerification.jurisdiction on the manager_id)
                                                     # for MVP/SPECIAL: PlayerContract.IdentityVerification.jurisdiction
      bracket = TAX_BRACKETS[jurisdiction]   # list of {up_to_cents:int, rate_bps:int} (tiered)
      remaining = payout.gross_amount_cents
      tax = 0
      prev = 0
      for tier in bracket sorted by up_to_cents ASC:
        slice = max(0, min(remaining, tier.up_to_cents) - prev)
        tax += round_half_up(slice * tier.rate_bps / 10000)  # round at each slice — round-then-sum (combinatorial_formula mode (b) tie-in)
        prev = tier.up_to_cents
        if remaining <= tier.up_to_cents: break
      # FX conversion to payout_currency happens AFTER tax (so tax floor is preserved)
      tax_in_payout_currency = round_half_up(tax * FX_RATE[entry_fee_currency][payout_currency])
      net = round_half_up(payout.gross_amount_cents * FX_RATE[entry_fee_currency][payout_currency]) - tax_in_payout_currency
      # MIN_PAYOUT_FLOOR: if net < MIN_PAYOUT_FLOOR_CENTS then tax is reduced (but never below 0) so net = MIN_PAYOUT_FLOOR_CENTS
      if net < MIN_PAYOUT_FLOOR_CENTS:
        delta = MIN_PAYOUT_FLOOR_CENTS - net
        tax_in_payout_currency = max(0, tax_in_payout_currency - delta)
        net = payout.gross_amount_cents_in_payout_currency - tax_in_payout_currency
      return {tax_withheld_cents: tax_in_payout_currency, net_amount_cents: net}
    input_set: "PrizePayout rows where status==PROVISIONAL at the moment of FINALIZE; jurisdiction is snapshotted then"
    constants:
      MIN_PAYOUT_FLOOR_CENTS: 100
      TAX_BRACKETS: {
        US: [{up_to_cents: 100000000, rate_bps: 2400}, {up_to_cents: 999999999999, rate_bps: 3700}],
        DE: [{up_to_cents: 5000000000, rate_bps: 4500}],
        KR: [{up_to_cents: 100000000, rate_bps: 2200}, {up_to_cents: 500000000, rate_bps: 3500}, {up_to_cents: 999999999999, rate_bps: 4500}],
        CN: [{up_to_cents: 999999999999, rate_bps: 2000}]
      }
      FX_RATE: { USD: { USD: 1.0, EUR: 0.92, KRW: 1350.0, CNY: 7.20 }, EUR: { USD: 1.09, EUR: 1.0, KRW: 1465.0, CNY: 7.83 }, KRW: { USD: 0.00074, EUR: 0.00068, KRW: 1.0, CNY: 0.0053 }, CNY: { USD: 0.139, EUR: 0.128, KRW: 187.5, CNY: 1.0 } }
      ROUND_MODE: "round_half_up"
    precision: "integer cents, round_half_up at every slice and at every FX conversion"

  - name: team_ranking_aggregate
    trigger: "On TeamRegistration FEE_PENDING→REGISTERED transition; pins ranking_points_snapshot"
    algorithm: aggregation
    formula: |
      # Aggregate ranking points: sum across MAIN slot only; SUBSTITUTE excluded
      # Tie-break in seeding: aggregate DESC, then earliest TeamRegistration.created_at ASC, then id ASC
      main_roster = [pc for pc in PlayerContract where team_id=R.id AND roster_slot='MAIN' AND status IN {ACTIVE, PENDING_SIGNATURES}]
      return sum(pc.ranking_points for pc in main_roster)
    input_set: "PlayerContract rows for the team in {ACTIVE, PENDING_SIGNATURES} (PENDING_SIGNATURES included since pre-tournament rosters may not yet have all signatures complete)"
    precision: "integer points"

  - name: contagion_risk_score
    trigger: "On every MatchIncident UNDER_REVIEW→RULED with ruling=UPHELD"
    algorithm: weighted_scoring
    formula: |
      # Per-team contagion risk: accumulates penalties; thresholds drive auto-actions on the TEAM domain
      # Different entity domain (Team risk) vs prize-pool calculation (Tournament prize) — dual_variant_calc Rule 1 second instance
      base_weight = {WARNING: 1, FINE: 3, FORFEIT: 5, DISQUALIFICATION: 10}[penalty_type]
      classification_multiplier = {LATENCY: 1.0, UNSPORTSMANLIKE_CONDUCT: 1.5, RULE_VIOLATION: 2.0, CHEATING_SUSPICION: 3.0}[classification]
      delta = base_weight * classification_multiplier
      # Half-life decay on existing accumulated_risk (decay variant)
      now = Clock.now
      decayed = old_risk * 0.5 ^ ((now - last_decay_at).days / RISK_HALFLIFE_DAYS)
      new_risk = round_half_up(decayed + delta)  # round once at the end
      return new_risk
    input_set: "All UPHELD MatchIncident rows where subject_type=TEAM and subject_id=team.id, ordered by ruled_at ASC"
    constants:
      RISK_HALFLIFE_DAYS: 30
      AUTO_DISQUALIFY_THRESHOLD: 50
      ROUND_MODE: "round_half_up"
    precision: "integer risk points, round_half_up"
    variants:
      - name: contagion_risk_score_appeal_reversal
        when: "Computed during MatchIncident APPEALED→RULED with ruling=OVERTURNED"
        difference: |
          The delta originally added is subtracted exactly (no re-decay), preserving the invariant that a
          rule + appeal cycle with overturn leaves the named quantity (Team.accumulated_risk) unchanged
          modulo natural decay between the two events. This is the compensating-invariant counterpart of
          contagion_risk_score (compensating_invariant Rule 9 second instance — risk-points conservation).

  - name: bracket_pairing
    trigger: "On Tournament.status ROSTER_LOCKED→BRACKET_PUBLISHED transition (and on each round advance)"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial: ≥3 inputs, conditional branches, evaluation order pinned — combinatorial_formula Rule 2 mode (c)
      seeding_rule = T.seeding_rule
      teams = [r for r in TeamRegistration where tournament_id=T.id AND status=REGISTERED]
      if seeding_rule == 'RANKING':
        ordered = sort teams by (ranking_points_snapshot DESC, created_at ASC, id ASC)
      elif seeding_rule == 'RANDOM':
        ordered = deterministic_shuffle(teams, seed=T.id)  # deterministic via tournament id
      elif seeding_rule == 'REGIONAL_BALANCE':
        # Round-robin across regions to balance: A,B,C regions interleaved; tie-break by ranking_points DESC then id ASC
        ordered = interleave_by_region(teams)
      # Format-driven pairing:
      if T.format == 'SWISS':
        pairings = swiss_round_1(ordered)  # 1vN, 2v(N-1), ...
      elif T.format == 'DOUBLE_ELIMINATION':
        pairings = bracket_seed(ordered)   # 1vN, 2v(N-1), ...; bye to seed 1 if odd
      elif T.format == 'ROUND_ROBIN':
        pairings = round_robin_round_1(ordered)
      elif T.format == 'GROUP_PLAYOFFS':
        groups = snake_draft_into_groups(ordered, group_size=4)
        pairings = group_round_1(groups)
      # Bye assignment if odd: lowest-seed team (best ranked) receives the bye in DOUBLE_ELIMINATION;
      # in SWISS the LOWEST-ranked team receives the bye — note the divergence: this is the combinatorial branch.
      return pairings
    input_set: "TeamRegistration rows in REGISTERED at the moment of the transition"
    precision: "integer seed_number, deterministic ordering"

  - name: draft_step_validator
    trigger: "On every POST /matches/{mid}/draft-events"
    algorithm: chronological
    formula: |
      # Strict ordering: step_index must equal len(DraftEvent rows) so far + 1 (boundary precision)
      # Anomaly compensation: DISCONNECT triggers a 60-second grace; MISCLICK triggers an immediate retry slot
      next_expected_step = count(DraftEvent where match_id=M.id AND anomaly_type IS NULL) + 1
      if event.step_index != next_expected_step: reject ERR_DRAFT_STEP_OUT_OF_ORDER
      # anomaly_type==DISCONNECT: insert a placeholder; step still counts; grace window 60s applies (Match.scheduled_end pushed by 60s)
      # anomaly_type==MISCLICK: the previous DraftEvent at step_index-1 by the SAME side is voided (decrement effective count); the new event MUST be at step_index = next_expected_step - 1
    input_set: "DraftEvent rows for the match in chronological order"
    constants:
      DISCONNECT_GRACE_SECONDS: 60
    precision: "integer step index"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-ID and X-User-Role headers present", error_id: ERR_AUTH_MISSING,             http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "X-User-Role value is a known role (TeamManager, Player, Referee, LeagueAdmin)", error_id: ERR_AUTH_INVALID_ROLE, http_status: 401, applies_to: "all" }
  - { priority: 3,  category: auth,                 check: "Role is permitted to call this endpoint per §1.7 RBAC", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4,  category: existence,            check: "Every path id resolves left-to-right (tournament_id, then team_id, then match_id, ...) ", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: existence,            check: "Foreign keys in request body resolve to existing rows", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all mutations" }
  - { priority: 6,  category: state,                check: "Target resource is in a state that allows this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state-changing endpoints" }
  - { priority: 7,  category: state,                check: "Referee certification not expired (Clock.now < Referee.certification_expiry)", error_id: ERR_REFEREE_CERT_EXPIRED, http_status: 403, applies_to: "POST /matches/{mid}/* by Referee, POST /match-incidents" }
  - { priority: 8,  category: business_safety,      check: "Player age >= Tournament.min_age (qualification gate) before REGISTERED", error_id: ERR_PLAYER_UNDERAGE, http_status: 422, applies_to: "POST /team-registrations/{rid}/pay-entry-fee" }
  - { priority: 9,  category: business_safety,      check: "Team region matches Tournament.region (or Tournament.region=GLOBAL)", error_id: ERR_REGION_MISMATCH, http_status: 422, applies_to: "POST /team-registrations/{rid}/pay-entry-fee" }
  - { priority: 10, category: business_safety,      check: "Identity verification complete for every MAIN-slot player before REGISTERED", error_id: ERR_IDENTITY_NOT_VERIFIED, http_status: 422, applies_to: "POST /team-registrations/{rid}/pay-entry-fee" }
  - { priority: 11, category: business_referential, check: "Multi-party signing chain followed in order (required_signatories[len(signatures)] matches caller party)", error_id: ERR_WRONG_SIGNATORY, http_status: 422, applies_to: "POST /player-contracts/{cid}/sign" }
  - { priority: 12, category: business_temporal,    check: "Roster mutation only before Tournament.roster_lock_deadline AND Tournament.status<ROSTER_LOCKED", error_id: ERR_ROSTER_LOCKED, http_status: 409, applies_to: "POST /player-contracts (assigning to a team), POST /team-registrations/{rid}/withdraw" }
  - { priority: 13, category: business_temporal,    check: "Match start only within scheduled_start ≤ Clock.now < scheduled_end (half-open)", error_id: ERR_MATCH_NOT_IN_WINDOW, http_status: 409, applies_to: "POST /matches/{mid}/start-draft" }
  - { priority: 14, category: business_temporal,    check: "Transfer window half-open [opens_at, closes_at)", error_id: ERR_WINDOW_CLOSED, http_status: 409, applies_to: "POST /transfer-offers, POST /transfer-offers/{oid}/co-accept, POST /transfer-offers/{oid}/league-approve" }
  - { priority: 15, category: business_temporal,    check: "Cooling-off check on player_id: no LEAGUE_APPROVED TransferOffer within cooling_off_days", error_id: ERR_COOLING_OFF_ACTIVE, http_status: 409, applies_to: "POST /transfer-offers, POST /transfer-offers/{oid}/league-approve" }
  - { priority: 16, category: business_constraint,  check: "Draft step_index equals next_expected_step (strict chronological order)", error_id: ERR_DRAFT_STEP_OUT_OF_ORDER, http_status: 422, applies_to: "POST /matches/{mid}/draft-events" }
  - { priority: 17, category: business_constraint,  check: "Aggregate team ranking_points_snapshot >= Tournament.min_team_ranking_points (boundary: strictly less rejects)", error_id: ERR_TEAM_RANKING_INSUFFICIENT, http_status: 422, applies_to: "POST /team-registrations/{rid}/pay-entry-fee" }
  - { priority: 18, category: business_constraint,  check: "Match.scheduled_start/scheduled_end interval does not overlap (half-open) with another non-FORFEITED match on the same Tournament involving either team", error_id: ERR_MATCH_TIME_CONFLICT, http_status: 409, applies_to: "POST /tournaments/{tid}/publish-bracket, PATCH /matches/{mid}" }
  - { priority: 19, category: business_constraint,  check: "Referee's allocation overlap: a single Referee may not be assigned to two matches whose [scheduled_start-15m, scheduled_end+15m] buffered intervals overlap (buffer-based geometry — different interval semantics from Rule 8 first instance)", error_id: ERR_REFEREE_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /matches/{mid}/assign-referee" }
  - { priority: 20, category: business_constraint,  check: "Prize tier table percentage_bps sum + MVP_BPS == 10000 exactly", error_id: ERR_PRIZE_TIER_SUM_MISMATCH, http_status: 422, applies_to: "POST /tournaments, PATCH /tournaments/{tid}" }
  - { priority: 21, category: business_constraint,  check: "Prize-pool invariant on finalize: sum(PrizePayout.gross_amount_cents) == Tournament.total_prize_pool_cents", error_id: ERR_PRIZE_POOL_INVARIANT, http_status: 409, applies_to: "POST /tournaments/{tid}/distribute-prizes" }
  - { priority: 22, category: business_constraint,  check: "Empty-set boundary: refuse publish-bracket with zero registered teams (different metric from numeric ranking threshold)", error_id: ERR_INSUFFICIENT_TEAMS, http_status: 422, applies_to: "POST /tournaments/{tid}/publish-bracket" }
  - { priority: 23, category: business_fiscal,      check: "Entry fee paid (after FX) >= Tournament.entry_fee_cents", error_id: ERR_ENTRY_FEE_INSUFFICIENT, http_status: 402, applies_to: "POST /team-registrations/{rid}/pay-entry-fee" }
  - { priority: 24, category: business_fiscal,      check: "Fine amount must be > 0 cents when penalty_type=FINE (boundary precision: 0 rejects)", error_id: ERR_FINE_AMOUNT_REQUIRED, http_status: 422, applies_to: "POST /match-incidents/{iid}/rule" }
  - { priority: 25, category: business_fiscal,      check: "Net payout >= MIN_PAYOUT_FLOOR_CENTS (after tax_withholding floor adjustment)", error_id: ERR_PAYOUT_BELOW_FLOOR, http_status: 422, applies_to: "POST /tournaments/{tid}/finalize-prize-pool" }
  - { priority: 26, category: business_constraint,  check: "Tournament max_teams cap: count(REGISTERED) <= max_teams", error_id: ERR_TOURNAMENT_FULL, http_status: 409, applies_to: "POST /team-registrations/{rid}/pay-entry-fee" }
  - { priority: 27, category: business_constraint,  check: "Optimistic concurrency: request.version (when supplied) must equal stored version", error_id: ERR_VERSION_CONFLICT, http_status: 409, applies_to: "all PATCH endpoints" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Tournament ----
  - { method: POST,   path: "/tournaments",                                  description: "Create Tournament in DRAFT",                       roles: [LeagueAdmin],                                code: 201, input: [name, format, region, min_age, min_team_ranking_points, entry_fee_cents, entry_fee_currency, roster_lock_deadline, registration_deadline, base_prize_pool_cents, prize_tier_table, ban_pick_sequence, map_pool, character_pool, seeding_rule, max_teams, required_referee_level], output: Tournament,        side_effects: [validate prize_tier sum] }
  - { method: GET,    path: "/tournaments/{tid}",                            description: "Read Tournament with computed fields",             roles: [LeagueAdmin, TeamManager, Referee, Player],   code: 200, input: [], output: Tournament, side_effects: [recompute crowdfunded_prize_pool_cents, total_prize_pool_cents] }
  - { method: GET,    path: "/tournaments",                                  description: "List Tournaments with pagination/filter",          roles: [LeagueAdmin, TeamManager, Referee, Player],   code: 200, input: ["status?", "region?", "limit?", "offset?"], output: "Tournament[]", side_effects: [] }
  - { method: POST,   path: "/tournaments/{tid}/open-registration",          description: "Transition DRAFT→REGISTRATION_OPEN",                roles: [LeagueAdmin],                                code: 200, input: [], output: Tournament,        side_effects: [state transition] }
  - { method: POST,   path: "/tournaments/{tid}/lock-rosters",               description: "Transition REGISTRATION_OPEN→ROSTER_LOCKED",        roles: [LeagueAdmin],                                code: 200, input: [], output: Tournament,        side_effects: [cascade WITHDRAWN] }
  - { method: POST,   path: "/tournaments/{tid}/publish-bracket",            description: "Compute seeding, create round-1 Matches",          roles: [LeagueAdmin],                                code: 200, input: [], output: Tournament,        side_effects: [bracket_pairing, Match creation] }
  - { method: POST,   path: "/tournaments/{tid}/start",                      description: "Transition BRACKET_PUBLISHED→IN_PROGRESS",         roles: [LeagueAdmin],                                code: 200, input: [], output: Tournament,        side_effects: [] }
  - { method: POST,   path: "/tournaments/{tid}/complete",                   description: "Transition IN_PROGRESS→COMPLETED (manual override; auto on last match)", roles: [LeagueAdmin],         code: 200, input: [], output: Tournament,        side_effects: [emit PROVISIONAL PrizePayouts via prize_share_provisional] }
  - { method: POST,   path: "/tournaments/{tid}/finalize-prize-pool",        description: "Transition every PrizePayout PROVISIONAL→FINALIZED", roles: [LeagueAdmin],                                code: 200, input: [], output: "PrizePayout[]",   side_effects: [tax_withholding lock, prize_share_final recomputation] }
  - { method: POST,   path: "/tournaments/{tid}/distribute-prizes",          description: "Transition COMPLETED→PRIZES_DISTRIBUTED",          roles: [LeagueAdmin],                                code: 200, input: [], output: Tournament,        side_effects: [PrizePayout FINALIZED→PAID] }
  - { method: POST,   path: "/tournaments/{tid}/cancel",                     description: "Cancel Tournament; refund cascade",                roles: [LeagueAdmin],                                code: 200, input: [reason],     output: Tournament,        side_effects: [refund entry fees and crowdfund contributions] }

  # ---- TeamRegistration ----
  - { method: POST,   path: "/tournaments/{tid}/team-registrations",         description: "Create TeamRegistration",                          roles: [TeamManager],                                code: 201, input: [team_name, manager_id, region, logo_url, sponsors],          output: TeamRegistration,  side_effects: [] }
  - { method: GET,    path: "/team-registrations/{rid}",                     description: "Read TeamRegistration",                            roles: [LeagueAdmin, TeamManager],                   code: 200, input: [], output: TeamRegistration,  side_effects: [] }
  - { method: POST,   path: "/team-registrations/{rid}/pay-entry-fee",       description: "Submit entry-fee payment; transitions FEE_PENDING→REGISTERED", roles: [TeamManager],                code: 200, input: [amount_cents, currency], output: TeamRegistration,  side_effects: [team_ranking_aggregate snapshot, qualification check] }
  - { method: POST,   path: "/team-registrations/{rid}/withdraw",            description: "Withdraw before roster-lock",                      roles: [TeamManager],                                code: 200, input: [], output: TeamRegistration,  side_effects: [refund record] }

  # ---- PlayerContract ----
  - { method: POST,   path: "/player-contracts",                             description: "Create PlayerContract in DRAFT",                    roles: [TeamManager],                                code: 201, input: [player_id, player_legal_name, player_age, team_id, contract_type, roster_slot, term_start, term_end, monthly_compensation_cents, compensation_currency, dispute_resolution_clause, ranking_points, required_signatories],  output: PlayerContract, side_effects: [] }
  - { method: GET,    path: "/player-contracts/{cid}",                       description: "Read PlayerContract",                              roles: [LeagueAdmin, TeamManager, Player],            code: 200, input: [], output: PlayerContract,    side_effects: [] }
  - { method: POST,   path: "/player-contracts/{cid}/identity-verifications", description: "File IdentityVerification (LeagueAdmin only)",     roles: [LeagueAdmin],                                code: 201, input: [document_hash, jurisdiction, status, rejection_reason], output: IdentityVerification, side_effects: [PlayerContract.identity_verified flips on VERIFIED] }
  - { method: POST,   path: "/player-contracts/{cid}/initiate-signing",      description: "Transition DRAFT→PENDING_SIGNATURES",              roles: [TeamManager],                                code: 200, input: [], output: PlayerContract,    side_effects: [] }
  - { method: POST,   path: "/player-contracts/{cid}/sign",                  description: "Append a signature; final sign triggers ACTIVE",   roles: [Player, TeamManager, LeagueAdmin],            code: 200, input: [], output: PlayerContract,    side_effects: [signed_version_id pin on final signature] }
  - { method: POST,   path: "/player-contracts/{cid}/amendments",            description: "File contract amendment; transitions ACTIVE→AMENDMENT_PENDING", roles: [TeamManager],          code: 201, input: [proposed_changes], output: PlayerContract,    side_effects: [signed_version_id cleared] }
  - { method: POST,   path: "/player-contracts/{cid}/amendments/{aid}/approve", description: "Approve amendment; AMENDMENT_PENDING→ACTIVE",  roles: [LeagueAdmin],                                code: 200, input: [], output: PlayerContract,    side_effects: [signed_version_id re-pinned] }
  - { method: POST,   path: "/player-contracts/{cid}/terminate",             description: "Terminate ACTIVE contract",                        roles: [LeagueAdmin],                                code: 200, input: [reason],   output: PlayerContract,    side_effects: [] }

  # ---- Match ----
  - { method: GET,    path: "/matches/{mid}",                                description: "Read Match",                                       roles: [LeagueAdmin, TeamManager, Referee, Player],   code: 200, input: [], output: Match,              side_effects: [] }
  - { method: GET,    path: "/tournaments/{tid}/matches",                    description: "List Matches in a tournament",                     roles: [LeagueAdmin, TeamManager, Referee, Player],   code: 200, input: ["round?", "status?", "limit?", "offset?"], output: "Match[]", side_effects: [] }
  - { method: PATCH,  path: "/matches/{mid}",                                description: "Adjust scheduled_start/scheduled_end (admin only) before LIVE", roles: [LeagueAdmin],                  code: 200, input: [scheduled_start, scheduled_end, version],   output: Match, side_effects: [match-time overlap check] }
  - { method: POST,   path: "/matches/{mid}/assign-referee",                 description: "Assign Referee to a Match",                        roles: [LeagueAdmin],                                code: 200, input: [referee_user_id], output: Match,              side_effects: [referee_double_booked check] }
  - { method: POST,   path: "/matches/{mid}/start-draft",                    description: "SCHEDULED→DRAFT_IN_PROGRESS",                       roles: [Referee],                                    code: 200, input: [], output: Match,              side_effects: [] }
  - { method: POST,   path: "/matches/{mid}/draft-events",                   description: "Append draft event (ban/pick)",                    roles: [Referee],                                    code: 201, input: [step_index, action, side, target_type, target_name, anomaly_type], output: DraftEvent, side_effects: [draft_step_validator] }
  - { method: POST,   path: "/matches/{mid}/complete-draft",                 description: "DRAFT_IN_PROGRESS→LIVE",                            roles: [Referee],                                    code: 200, input: [], output: Match,              side_effects: [] }
  - { method: POST,   path: "/matches/{mid}/report-result",                  description: "LIVE→COMPLETED with winner",                        roles: [Referee],                                    code: 200, input: [winner_team_id], output: Match,              side_effects: [Tournament auto-complete check] }
  - { method: POST,   path: "/matches/{mid}/forfeit",                        description: "Manual forfeit by Referee or admin",                roles: [Referee, LeagueAdmin],                       code: 200, input: [forfeit_reason, winner_team_id], output: Match, side_effects: [bracket-advance cascade] }
  - { method: GET,    path: "/matches/{mid}/draft-events",                   description: "Read full draft history",                          roles: [LeagueAdmin, TeamManager, Referee, Player],   code: 200, input: ["limit?", "offset?"], output: "DraftEvent[]", side_effects: [] }

  # ---- MatchIncident ----
  - { method: POST,   path: "/match-incidents",                              description: "File MatchIncident",                                roles: [Referee],                                    code: 201, input: [match_id, subject_type, subject_id, classification, evidence, referee_id], output: MatchIncident, side_effects: [AuditLogEntry on FILE] }
  - { method: GET,    path: "/match-incidents/{iid}",                        description: "Read MatchIncident",                                roles: [LeagueAdmin, TeamManager, Referee],          code: 200, input: [], output: MatchIncident,     side_effects: [] }
  - { method: POST,   path: "/match-incidents/{iid}/assign",                 description: "FILED→UNDER_REVIEW",                                roles: [LeagueAdmin],                                code: 200, input: [], output: MatchIncident,     side_effects: [AuditLogEntry] }
  - { method: POST,   path: "/match-incidents/{iid}/rule",                   description: "UNDER_REVIEW→RULED with ruling + penalty",         roles: [LeagueAdmin],                                code: 200, input: [ruling, penalty_type, fine_amount_cents], output: MatchIncident, side_effects: [contagion_risk_score, AuditLogEntry, optional disqualification cascade] }
  - { method: POST,   path: "/match-incidents/{iid}/appeal",                 description: "RULED→APPEALED",                                    roles: [TeamManager],                                code: 200, input: [grounds],    output: MatchIncident,     side_effects: [appeal_count++] }
  - { method: POST,   path: "/match-incidents/{iid}/appeal-decide",          description: "APPEALED→RULED (with overturn branch)",            roles: [LeagueAdmin],                                code: 200, input: [decision, new_ruling, new_penalty_type], output: MatchIncident, side_effects: [contagion_risk_score_appeal_reversal on overturn, full cascade reversal] }
  - { method: POST,   path: "/match-incidents/{iid}/close",                  description: "RULED→CLOSED",                                      roles: [LeagueAdmin],                                code: 200, input: [], output: MatchIncident,     side_effects: [] }

  # ---- Referee ----
  - { method: POST,   path: "/referees",                                     description: "Register a Referee",                                roles: [LeagueAdmin],                                code: 201, input: [user_id, full_name, certification_level, certification_expiry], output: Referee, side_effects: [] }
  - { method: GET,    path: "/referees/{rfid}",                              description: "Read Referee",                                      roles: [LeagueAdmin, TeamManager],                   code: 200, input: [], output: Referee,            side_effects: [] }
  - { method: PATCH,  path: "/referees/{rfid}",                              description: "Update Referee (suspend, renew cert)",             roles: [LeagueAdmin],                                code: 200, input: [status, certification_level, certification_expiry, version], output: Referee, side_effects: [] }

  # ---- CrowdfundContribution ----
  - { method: POST,   path: "/tournaments/{tid}/crowdfund-contributions",    description: "Pledge or collect a contribution",                 roles: [LeagueAdmin],                                code: 201, input: [contributor_user_id, amount_cents, status], output: CrowdfundContribution, side_effects: [Tournament.crowdfunded_prize_pool_cents recompute when status=COLLECTED] }

  # ---- TransferWindow / TransferOffer ----
  - { method: POST,   path: "/transfer-windows",                             description: "Create a TransferWindow",                           roles: [LeagueAdmin],                                code: 201, input: [name, opens_at, closes_at, cooling_off_days], output: TransferWindow, side_effects: [] }
  - { method: GET,    path: "/transfer-windows/{wid}",                       description: "Read TransferWindow",                              roles: [LeagueAdmin, TeamManager],                   code: 200, input: [], output: TransferWindow,    side_effects: [] }
  - { method: POST,   path: "/transfer-offers",                              description: "Propose a transfer",                                roles: [TeamManager],                                code: 201, input: [player_id, from_team_id, to_team_id, window_id, transfer_fee_cents, transfer_fee_currency], output: TransferOffer, side_effects: [cooling-off check] }
  - { method: GET,    path: "/transfer-offers/{oid}",                        description: "Read TransferOffer",                                roles: [LeagueAdmin, TeamManager],                   code: 200, input: [], output: TransferOffer,     side_effects: [] }
  - { method: POST,   path: "/transfer-offers/{oid}/counter",                description: "Counter the offer",                                 roles: [TeamManager],                                code: 200, input: [transfer_fee_cents, transfer_fee_currency], output: TransferOffer, side_effects: [history append] }
  - { method: POST,   path: "/transfer-offers/{oid}/accept",                 description: "Accept by from_team (PROPOSED|COUNTERED → ACCEPTED_BY_FROM)", roles: [TeamManager],            code: 200, input: [], output: TransferOffer,     side_effects: [] }
  - { method: POST,   path: "/transfer-offers/{oid}/co-accept",              description: "ACCEPTED_BY_FROM→ACCEPTED_BY_BOTH (to_team)",      roles: [TeamManager],                                code: 200, input: [], output: TransferOffer,     side_effects: [] }
  - { method: POST,   path: "/transfer-offers/{oid}/reject",                 description: "Reject the offer",                                  roles: [TeamManager, LeagueAdmin],                   code: 200, input: [reason], output: TransferOffer,     side_effects: [] }
  - { method: POST,   path: "/transfer-offers/{oid}/league-approve",         description: "ACCEPTED_BY_BOTH→LEAGUE_APPROVED",                  roles: [LeagueAdmin],                                code: 200, input: [decision],   output: TransferOffer,     side_effects: [PlayerContract.team_id reassignment, AuditLogEntry, transfer fee ledger] }

  # ---- AuditLog ----
  - { method: GET,    path: "/audit-log",                                    description: "List audit entries with filters",                  roles: [LeagueAdmin],                                code: 200, input: ["subject_type?", "subject_id?", "actor_user_id?", "limit?", "offset?"], output: "AuditLogEntry[]", side_effects: [] }

  # ---- Test-driving endpoints (testability completeness) ----
  - { method: POST,   path: "/_clock/advance",                               description: "Advance Clock.now to the supplied ISO 8601 UTC timestamp; triggers any time-gated transitions (roster-lock auto, transfer-window expire, contract expire)", roles: [LeagueAdmin], code: 200, input: [to], output: Clock, side_effects: [auto state transitions] }
  - { method: POST,   path: "/_sweep/run",                                   description: "Trigger the deferred-action sweeper (recomputes roster_locked, evaluates auto-disqualify thresholds, advances expired contracts)", roles: [LeagueAdmin], code: 200, input: [], output: null, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_AUTH_MISSING,                http: 401, condition: "X-User-ID or X-User-Role header missing" }
  - { id: ERR_AUTH_INVALID_ROLE,           http: 401, condition: "X-User-Role value not recognized" }
  - { id: ERR_FORBIDDEN,                   http: 403, condition: "Role is not permitted for this endpoint or ownership check fails" }
  - { id: ERR_NOT_FOUND,                   http: 404, condition: "Path id or referenced foreign-key resource does not exist" }
  - { id: ERR_INVALID_STATE,               http: 409, condition: "Target resource is not in a state that allows this transition" }
  - { id: ERR_VERSION_CONFLICT,            http: 409, condition: "OCC version mismatch on PATCH" }
  - { id: ERR_REGISTRATION_NOT_OPEN,       http: 409, condition: "Tournament.status != REGISTRATION_OPEN when creating TeamRegistration" }
  - { id: ERR_REGISTRATION_DEADLINE_PASSED, http: 409, condition: "Clock.now >= Tournament.registration_deadline" }
  - { id: ERR_DUPLICATE_TEAM_NAME,         http: 409, condition: "team_name already used in this Tournament (status != WITHDRAWN)" }
  - { id: ERR_ROSTER_LOCKED,               http: 409, condition: "Roster mutation attempted after Tournament.roster_lock_deadline or while status >= ROSTER_LOCKED" }
  - { id: ERR_ROSTER_INCOMPLETE,           http: 422, condition: "Fewer than 5 MAIN-slot identity-verified PlayerContracts at pay-entry-fee" }
  - { id: ERR_PLAYER_UNDERAGE,             http: 422, condition: "Player.age < Tournament.min_age" }
  - { id: ERR_REGION_MISMATCH,             http: 422, condition: "TeamRegistration.region != Tournament.region (when Tournament.region != GLOBAL)" }
  - { id: ERR_TEAM_RANKING_INSUFFICIENT,   http: 422, condition: "Aggregate ranking_points_snapshot < Tournament.min_team_ranking_points" }
  - { id: ERR_IDENTITY_NOT_VERIFIED,       http: 422, condition: "PlayerContract.identity_verified == false at REGISTERED or initiate-signing" }
  - { id: ERR_INVALID_CONTRACT_TERM,       http: 422, condition: "term_end <= term_start" }
  - { id: ERR_NO_SIGNATORIES,              http: 422, condition: "required_signatories is empty at initiate-signing" }
  - { id: ERR_WRONG_SIGNATORY,             http: 422, condition: "Calling party does not match required_signatories[len(signatures)].party" }
  - { id: ERR_TEAM_NOT_ELIGIBLE,           http: 409, condition: "Final signing rejected because TeamRegistration is WITHDRAWN/DISQUALIFIED" }
  - { id: ERR_ENTRY_FEE_INSUFFICIENT,      http: 402, condition: "Submitted payment (after FX) < Tournament.entry_fee_cents" }
  - { id: ERR_TOURNAMENT_FULL,             http: 409, condition: "count(REGISTERED) >= Tournament.max_teams" }
  - { id: ERR_INSUFFICIENT_TEAMS,          http: 422, condition: "publish-bracket attempted with fewer than 2 REGISTERED teams" }
  - { id: ERR_PRIZE_TIER_SUM_MISMATCH,     http: 422, condition: "Sum of prize_tier_table.percentage_bps + MVP_BPS != 10000" }
  - { id: ERR_TOURNAMENT_NOT_COMPLETED,    http: 409, condition: "finalize-prize-pool called while Tournament.status != COMPLETED" }
  - { id: ERR_PRIZE_FINAL_MISMATCH,        http: 409, condition: "Recomputed prize_share_final differs from PROVISIONAL row at finalize" }
  - { id: ERR_PRIZE_POOL_INVARIANT,        http: 409, condition: "Sum of PrizePayout.gross_amount_cents != Tournament.total_prize_pool_cents at distribute-prizes" }
  - { id: ERR_PRIZE_POOL_NOT_FINALIZED,    http: 409, condition: "distribute-prizes called while some PrizePayout still PROVISIONAL" }
  - { id: ERR_PAYOUT_BELOW_FLOOR,          http: 422, condition: "Computed net_amount_cents < MIN_PAYOUT_FLOOR_CENTS after floor adjustment fails" }
  - { id: ERR_MATCH_NOT_IN_WINDOW,         http: 409, condition: "start-draft attempted outside [scheduled_start, scheduled_end)" }
  - { id: ERR_MATCH_TIME_CONFLICT,         http: 409, condition: "Match interval overlaps another non-FORFEITED match for either team" }
  - { id: ERR_REFEREE_CERT_EXPIRED,        http: 403, condition: "Clock.now >= Referee.certification_expiry on a referee action" }
  - { id: ERR_REFEREE_DOUBLE_BOOKED,       http: 409, condition: "Referee already assigned to an overlapping buffered interval" }
  - { id: ERR_DRAFT_STEP_OUT_OF_ORDER,     http: 422, condition: "DraftEvent.step_index != next_expected_step" }
  - { id: ERR_DRAFT_STEP_TAKEN,            http: 409, condition: "Concurrent DraftEvent at same step_index" }
  - { id: ERR_DUPLICATE_INCIDENT,          http: 409, condition: "MatchIncident already filed for (match_id, subject_id, classification)" }
  - { id: ERR_FINE_AMOUNT_REQUIRED,        http: 422, condition: "penalty_type=FINE but fine_amount_cents <= 0" }
  - { id: ERR_APPEAL_LIMIT_REACHED,        http: 409, condition: "appeal_count >= MAX_APPEALS (1)" }
  - { id: ERR_APPEAL_WINDOW_CLOSED,        http: 409, condition: "Clock.now >= ruled_at + 72h" }
  - { id: ERR_WINDOW_CLOSED,               http: 409, condition: "TransferWindow not in [opens_at, closes_at)" }
  - { id: ERR_COOLING_OFF_ACTIVE,          http: 409, condition: "Same player_id had LEAGUE_APPROVED transfer within cooling_off_days" }
  - { id: ERR_CONTRACT_NOT_ACTIVE,         http: 409, condition: "Transfer league-approve attempted while PlayerContract.status != ACTIVE" }
  - { id: ERR_MATCHES_INCOMPLETE,          http: 409, condition: "complete-tournament attempted while at least one match is not in a terminal state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeagueAdmin
    description: "League-side operator who configures tournaments, approves verifications/amendments/transfers, assigns incidents, and finalizes prize pools."
    identity: opaque
    exclusive_operations:
      - "POST /tournaments and POST /tournaments/{tid}/* (open-registration, lock-rosters, publish-bracket, start, complete, finalize-prize-pool, distribute-prizes, cancel)"
      - "POST /player-contracts/{cid}/identity-verifications"
      - "POST /player-contracts/{cid}/amendments/{aid}/approve"
      - "POST /player-contracts/{cid}/terminate"
      - "POST /match-incidents/{iid}/assign, /rule, /appeal-decide, /close"
      - "POST /referees, PATCH /referees/{rfid}"
      - "POST /tournaments/{tid}/crowdfund-contributions"
      - "POST /transfer-windows"
      - "POST /transfer-offers/{oid}/league-approve"
      - "GET /audit-log"
      - "POST /_clock/advance, POST /_sweep/run"
      - "PATCH /matches/{mid}"
      - "POST /matches/{mid}/assign-referee"
    shared_operations:
      - "Reads on tournaments, matches, contracts, transfer-offers, referees"
      - "POST /matches/{mid}/forfeit (also Referee)"
      - "POST /transfer-offers/{oid}/reject (also TeamManager)"
      - "POST /player-contracts/{cid}/sign (LeagueAdmin can be a required signatory)"

  - name: TeamManager
    description: "Team-side operator who registers the team, manages roster (PlayerContracts), files transfer offers, and appeals incidents. Identity is bound to the user_id used as manager_id at TeamRegistration creation."
    identity: opaque
    exclusive_operations:
      - "POST /tournaments/{tid}/team-registrations (self as manager_id)"
      - "POST /team-registrations/{rid}/pay-entry-fee"
      - "POST /team-registrations/{rid}/withdraw"
      - "POST /player-contracts (creating contracts for own team)"
      - "POST /player-contracts/{cid}/initiate-signing"
      - "POST /player-contracts/{cid}/amendments"
      - "POST /transfer-offers, /counter, /accept, /co-accept (own team only)"
      - "POST /match-incidents/{iid}/appeal (on own team's subject only)"
    shared_operations:
      - "Reads on own-team resources"
      - "POST /player-contracts/{cid}/sign as required signatory"
      - "POST /transfer-offers/{oid}/reject (own-team side only)"

  - name: Player
    description: "Player acting as a signatory on their own PlayerContract."
    identity: entity_backed:PlayerContract.player_id
    exclusive_operations: []
    shared_operations:
      - "POST /player-contracts/{cid}/sign (only when required_signatories[next].party=='PLAYER' AND X-User-ID matches PlayerContract.player_id)"
      - "Reads on own contracts"

  - name: Referee
    description: "Certified referee that runs the draft and live match flow and files MatchIncidents. Identity is bound to Referee.user_id."
    identity: entity_backed:Referee.user_id
    exclusive_operations:
      - "POST /matches/{mid}/start-draft"
      - "POST /matches/{mid}/draft-events"
      - "POST /matches/{mid}/complete-draft"
      - "POST /matches/{mid}/report-result"
      - "POST /match-incidents (referee_id must == X-User-ID)"
    shared_operations:
      - "POST /matches/{mid}/forfeit (also LeagueAdmin)"
      - "Reads on matches and own-filed incidents"
