  - section: validations
    instances:
      - name: the_guild_floor_and_the_level_ceiling_refuse_underpaid_or_over_titled_seats
        claim_type: violation_error
        grounds:
          - validations.priority_45_business_safety
          - validations.priority_46_business_safety
          - validations.priority_47_business_safety
          - errors.ERR_BELOW_GUILD_MINIMUM
          - errors.ERR_LEVEL_ABOVE_DETERMINED
          - errors.ERR_DIVERSITY_FUNDING_INELIGIBLE
        distinguishing_aspect: |
          Three adjacent 422s guard one create and they must not collapse into each other: 1 cent under the
          level floor is ERR_BELOW_GUILD_MINIMUM; one level above the writer's determined level without
          diversity funding is ERR_LEVEL_ABOVE_DETERMINED; the same seat WITH diversity funding on a
          non-participant is ERR_DIVERSITY_FUNDING_INELIGIBLE; and two levels above is
          ERR_LEVEL_ABOVE_DETERMINED again, because the one-position allowance is exactly one.
        test_recipe:
          setup:
            - "Writer W1 is STORY_EDITOR (3 credits) and is NOT a diversity program participant."
            - "Writer W8 is STORY_EDITOR (3 credits) and IS a diversity program participant, with an OPEN window."
            - "Room RM is in STAFFING with all 3 seats open."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - &C_W8
              call: "POST /writers"
              payload: { legal_name: "Dara Osei", guild_member_id: "GM-4001", agreement_id: "${ag}", career_episodic_credits: 3, diversity_program_participant: true }
              as: GuildAdministrator
              captures: { w8: "$.data.id" }
