  # =========================================================================
  # Section: endpoints — CRUD + actions; reverse-reachability GETs
  # =========================================================================
  - section: endpoints
    instances:

      - name: list_applications_filter_by_claimant_id
        claim_type: listing_filter
        grounds:
          - endpoints[GET /ssdi/applications]
        distinguishing_aspect: "GET /ssdi/applications?claimant_id=X returns only that claimant's applications."
        test_recipe:
          setup:
            - "Two claimants, each with one application."
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "4001", full_name: "Filter A", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "4002", full_name: "Filter B", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { fb_id: "$.data.id" }
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${fa_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
            - call: "POST /ssdi/applications"
              payload: { claimant_id: "${fb_id}", alleged_onset_date: "2024-01-01T00:00:00Z", protective_filing_date: "2026-01-15T00:00:00Z", claim_type: "SSDI_ONLY" }
              as: SSAAdmin
          trigger:
            - call: "GET /ssdi/applications"
              payload: { claimant_id: "${fa_id}" }
              as: SSAAdmin
          assert:
            - "response.data.total_count == 1"
            - "response.data.items[0].claimant_id == ${fa_id}"

      - name: get_application_evidence_sub_resource_returns_array
        claim_type: reverse_reachability
        grounds:
          - endpoints[GET /ssdi/applications/{id}/evidence]
          - entities.MedicalEvidence.fields.application_id
        distinguishing_aspect: "GET /ssdi/applications/{id}/evidence returns array of all MedicalEvidence rows for that application (sub-resource form of FK reverse-reachability)."
        test_recipe:
          setup: ["Application with two evidence rows attached."]
          setup_api_calls:
            - call: "POST /ssdi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SSAAdmin
            - call: "POST /ssdi/claimants"
              payload: { ssn_last4: "4003", full_name: "Ev List", date_of_birth: "1980-01-01T00:00:00Z", filing_state: "TX" }
              as: SSAAdmin
              captures: { el_id: "$.data.id" }
