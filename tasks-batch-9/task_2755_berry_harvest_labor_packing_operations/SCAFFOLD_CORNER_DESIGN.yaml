            - call: "POST /berry-ops/pick-sessions"
              payload: { harvest_window_id: "${win_a}", picker_id: "${pk}", work_date: "2026-08-03" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { ses_a: $.data.id }
            - call: "POST /berry-ops/pick-sessions/${ses_a}/tally"
