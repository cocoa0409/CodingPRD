      - name: forgiveness_stays_flat_through_month_sixty_then_accrues_and_pays_off
        claim_type: decay_function
        grounds: [calculations.lien_forgiveness_and_recapture, entities.MortgageApplication.fields.forgiven_amount_cents, entities.MortgageApplication.fields.lien_outstanding_cents, "state_machines.MortgageApplication.lien_status.ACTIVE_to_SATISFIED", errors.ERR_LIEN_BALANCE_OUTSTANDING]
        distinguishing_aspect: "The decay curve is sampled at three consecutive 30-day months around its start: month 59 and month 60 both forgive exactly 0 (the numerator months_elapsed - 60 is negative then zero), and month 61 forgives the first slice of 10833 cents. A PAYOFF attempted while the balance is 1939167 is refused, and only at month 240 — where the curve is clamped to the full 1950000 — does PAYOFF drive the lien to SATISFIED."
