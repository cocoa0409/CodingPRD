    claim_type: violation_to_error
    grounds:
    - state_machines.TranscriptEntry.AWARDED_to_REVERSED
    - errors[ERR_ENTRY_ALREADY_REVERSED]
    distinguishing_aspect: Reversing an already-REVERSED transcript entry -> 400 ERR_ENTRY_ALREADY_REVERSED; the first reversal posted a negating entry (clock_hours -15, district_credit -1.0) and drove
      the employee balance back to 0.0.
    test_recipe:
      setup:
      - T1 completes a 15-hour fee-0 course (entry awarded 2026-08-16, FY2026, district_credit 1.0)
      - Audit case AC1 opened for (T1, 2026); entry reversed once (REVERSED)
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
