  # ===========================================================================
  - section: errors
    instances:
      - name: errors_qualification_gates_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLIENT_NOT_QUALIFIED]", "errors[ERR_RESUME_CLASS_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: submit_gated_by_client_qualification
          rationale: "Both errors are asserted as the failure paths of the named §1.8 instance; also ERR_CLIENT_NOT_QUALIFIED in safety_beats_temporal_on_submit."
      - name: errors_insurance_and_permit_gates_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSURANCE_NOT_VERIFIED]", "errors[ERR_PERMIT_NOT_GRANTED]", "errors[ERR_PERMIT_WINDOW_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: sign_gated_by_verified_insurance
          rationale: "ERR_INSURANCE_NOT_VERIFIED is the failure path of sign_gated_by_verified_insurance; ERR_PERMIT_NOT_GRANTED of start_prep_gated_by_permits and safety_beats_fiscal_on_start_prep; ERR_PERMIT_WINDOW_INSUFFICIENT of permit_window_closed_containment."
      - name: errors_overlap_and_capacity_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_AVAILABILITY_CONFLICT]", "errors[ERR_TURNAROUND_BUFFER_VIOLATION]", "errors[ERR_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: yacht_block_overlap_vs_buffer_adjacency
          rationale: "Overlap and buffer errors are the two failure paths of yacht_block_overlap_vs_buffer_adjacency; ERR_CAPACITY_EXCEEDED is the failure path of capacity_equals_limit_passes."
      - name: errors_fiscal_pair_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_FUNDING_AMOUNT_MISMATCH]", "errors[ERR_ESCROW_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_fund
          rationale: "ERR_FUNDING_AMOUNT_MISMATCH participates in the §1.8 priority-pair instance (and is directly asserted in fund_tranche_order_and_amount); ERR_ESCROW_INSUFFICIENT is asserted in safety_beats_fiscal_on_start_prep and apa_cap_and_deposit_cap_enforced_on_approve."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_counter_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[request-counter-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Counter with expected version one behind the current request version (a fresh offer arrived after the client read) fails 412 ERR_STALE_VERSION; the current version succeeds."
        test_recipe:
          setup: ["Yacht A LISTED; QUALIFIED client; request OFFERED (version 3: create 1, submit 2, offer 3)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
          trigger:
            - { call: "POST /charter-requests/${rq_id}/counter", payload: { expected_charter_request_version: "${rq_v} - 1" }, as: Client, as_user_id: "${cl_id}", captures: { err: $.data.error_id } }
            - { call: "POST /charter-requests/${rq_id}/counter", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { rq_st: $.data.status, rq_v2: $.data.version } }
          assert:
            - "err == ERR_STALE_VERSION (http 412) for the stale expected version"
            - "rq_st == COUNTERED and rq_v2 == 4 for the current version (no drift from the rejected attempt)"

      - name: occ_accept_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[request-accept-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Accept with a stale expected version fails 412 and creates NO agreement; retrying with the current version succeeds (412 is rejection, not terminal)."
        test_recipe:
          setup: ["Yacht A LISTED; QUALIFIED client; request OFFERED (version 3)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-01", end_date: "2026-10-11", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
          trigger:
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v} - 1" }, as: Client, as_user_id: "${cl_id}", captures: { err: $.data.error_id } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
          assert:
            - "err == ERR_STALE_VERSION (http 412); GET /charter-agreements?charter_request_id=${rq_id} -> total_count 0 after the stale attempt"
            - "retry with current version: 201, agreement ${ag_id} created (PENDING_SIGNATURES / UNFUNDED)"

      - name: occ_block_create_stale_yacht
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[block-create-stale-yacht]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Manual block creation against a stale yacht version (the list transition bumped it since the operator last read) fails 412; re-reading and resubmitting with the current version succeeds."
        test_recipe:
          setup: ["Yacht A created (version 1 captured), then listed (version 2)"]
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id, ya_v1: $.data.version } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: MAINTENANCE, start_date: "2026-09-01", end_date: "2026-09-05", expected_yacht_version: "${ya_v1}" }, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
            - { call: "GET /yachts/${ya_id}", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { ya_v2: $.data.version } }
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: MAINTENANCE, start_date: "2026-09-01", end_date: "2026-09-05", expected_yacht_version: "${ya_v2}" }, as: Operator, as_user_id: "${op_id}", captures: { blk_id: $.data.id } }
          assert:
            - "err == ERR_STALE_VERSION (http 412): the version observed before list (1) is stale after list (2)"
            - "retry with ya_v2 == 2 succeeds (201), block ${blk_id} ACTIVE, yacht version becomes 3"

      - name: cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.CharterAgreement.SIGNED_to_CANCELLED, state_machines.CharterAgreement.UNDERWAY_to_COMPLETED]
        excluded_because:
          difficulty_instance: cancellation_cascade_depth_six
          rationale: "Both N-level cascades (cancellation depth 6, completion depth 4) are asserted hop-by-hop in cancellation_cascade_depth_six and completion_settlement_cascade_depth_four."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.charter_fee_quote, calculations.apa_position, calculations.commission_settlement]
        excluded_because:
          difficulty_instance: quote_pro_rata_vs_weekly_plus_daily
          rationale: "Variant divergence and selection are asserted in quote_pro_rata_vs_weekly_plus_daily and apa_provisional_vs_final_position; the commission CANCELLATION_BASIS variant is exercised by cancellation_cascade_depth_six."
      - name: rate_threshold_layer_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.cancellation_penalty, calculations.apa_pct_schedule, calculations.commission_settlement]
        excluded_because:
          difficulty_instance: cancellation_day_boundary_60_vs_59
          rationale: "Tier boundaries are probed by cancellation_day_boundary_60_vs_59 (60 vs 59 days), apa_pct_tier_boundary (fee == 2000000 vs 1999999) and commission tier placement in completion_settlement_cascade_depth_four."

