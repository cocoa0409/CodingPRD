            - "error_id == ERR_DRIVER_SUSPENDED"

      - name: booking_create_blocked_when_spot_unlisted_booking_to_spot
        grounds:
          - state_machines.Spot.LISTED_to_UNLISTED
          - entities.Spot.fields.listing_status
          - validations[priority=40]
          - errors[ERR_SPOT_UNLISTED]
        distinguishing_aspect: >-
          Booking->Spot dependency (different entity pair than Booking->Driver): creating a Booking
          is rejected when Spot.listing_status == UNLISTED, regardless of driver wallet/standing.
        test_recipe:
          setup:
            - "Spot S14 LISTED then unlisted; Driver D14 funded 5000."
