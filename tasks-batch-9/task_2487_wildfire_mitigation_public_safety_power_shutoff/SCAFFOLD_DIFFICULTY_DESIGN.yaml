      - name: net_benefit_credit_rate_keyed_on_unadjusted_score
        grounds:
          - calculations.psps_net_benefit_ratio
          - calculations.resource_center_activation_selector
          - entities.PSPSEvent.fields.crc_mitigation_credit
          - entities.PSPSEvent.fields.adjusted_customer_impact_score
        distinguishing_aspect: |
          The credit rate is selected from the UNADJUSTED customer_impact_score of 62.00 (band 60..200 ->
          0.12), producing crc_mitigation_credit 7.44 and adjusted 54.56; re-deriving the rate from the
          adjusted 54.56 would fall into the 20..60 band (0.05) and give 2.73 instead, so the five-step
          evaluation order is falsifiable to the cent.
