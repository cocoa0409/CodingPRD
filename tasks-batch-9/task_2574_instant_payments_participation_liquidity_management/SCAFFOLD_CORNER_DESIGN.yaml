        grounds:
          - state_machines.CreditTransfer.QUEUED_THROTTLED_to_DIVERTED
          - endpoints[POST /credit-transfers/{id}/diversion]
          - entities.OutageEvent.fields.diverted_transfer_count
          - calculations.operational_posture_derivation
        distinguishing_aspect: "Outage contingency is a two-entity handshake: declaring the outage drives the posture to OFFLINE which parks the INITIATED transfer, and only then is diversion legal - and the payload rail must equal the covering event's declared fallback_rail, with the event's diverted_transfer_count incrementing as the cross-entity side effect."
