            - "${e_no_lab} == 'ERR_LAB_RESULT_MISSING' with HTTP 422 — reported ahead of the 409 at priority 100 even though the dose is also unprepared"
            - "${lr1_status} == 'RESULTED' — both values were supplied, so the gate will consult this draw"
            - "${e_no_prep} == 'ERR_PREPARATION_NOT_READY' with HTTP 409 — the identical call now fails on the second gap only"
            - "${dp1_prepared} == 'PREPARED' and ${dp1_usable} == '2026-08-10T13:00:00Z' (09:00 plus the 240-minute stability window)"
            - "Last trigger HTTP status == 200 with ${ap1_infusing} == 'INFUSING' and ${ap1_actual} == 540"
            - "Appointment.${ap1}.readiness_status == 'FULLY_CLEARED' — both gaps are closed"
            - "DrugLot.${lot1}.units_committed == 1, units_available == 9 and units_administered == 0 — compounding moves no counters"

      - name: lab_result_stale_is_covered_by_the_readiness_regression_instance
        claim_type: triggerable
        grounds:
          - errors[ERR_LAB_RESULT_STALE]
          - validations[priority 72]
        distinguishing_aspect: |
          The staleness gate is only interesting at the inclusive boundary of
          lab_validity_hours and when it makes an already-cleared readiness dimension regress
          while the schedule dimension keeps advancing, which is exactly the parallel-machine
          scenario the difficulty design builds.
        excluded_because:
          difficulty_instance: readiness_reverts_to_auth_cleared_while_schedule_advances_to_checked_in
          rationale: |
            That instance drives the clock past the 72-hour validity edge, asserts the
            ERR_LAB_RESULT_STALE refusal at start-infusion and shows readiness dropping from
            FULLY_CLEARED back to AUTH_CLEARED while schedule_status still moves to
            CHECKED_IN. A second corner test would only re-trigger the same error id.

      - name: lab_gate_not_met_is_covered_by_the_priority_ladder_instance
        claim_type: triggerable
        grounds:
          - errors[ERR_LAB_GATE_NOT_MET]
          - validations[priority 73]
        distinguishing_aspect: |
          The value gate matters most when it competes with the preparation gate, since both
          block the same trigger and only the declared priority order tells them apart.
        excluded_because:
          difficulty_instance: lab_gate_priority_73_beats_preparation_not_ready_priority_100_on_start_infusion
          rationale: |
            That instance files a below-threshold ANC draw while the dose is still
            uncompounded and asserts ERR_LAB_GATE_NOT_MET wins over
            ERR_PREPARATION_NOT_READY, then clears each gap in turn. It already exercises the
            equality-passes edge of anc_value and platelet_value.

      - name: auth_not_approved_is_covered_by_the_pended_confirm_instance
        claim_type: triggerable
        grounds:
          - errors[ERR_AUTH_NOT_APPROVED]
          - validations[priority 80]
        distinguishing_aspect: |
          The interesting trigger is a PENDED authorization blocking confirm and then the
          same confirm succeeding after the resubmission is approved, not a bare missing
          approval.
        excluded_because:
          difficulty_instance: confirm_refused_while_the_authorization_sits_in_pended_then_admitted_after_approval
          rationale: |
            That instance asserts the ERR_AUTH_NOT_APPROVED refusal on the PENDED row and the
            201-then-CONFIRMED admission after the approval lands, covering both directions of
            priority 80.

      - name: auth_resubmit_limit_is_covered_by_the_capped_resubmission_cycle
        claim_type: triggerable
        grounds:
          - errors[ERR_AUTH_RESUBMIT_LIMIT]
          - entities.AuthorizationRequest.fields.submission_count
        distinguishing_aspect: |
          The cap is only observable by walking the SUBMITTED -> PENDED cycle up to the third
          submission and then attempting a fourth, so it needs the cyclic-machine fixture.
        excluded_because:
          difficulty_instance: authorization_pended_resubmission_cycle_capped_at_three_submissions
          rationale: |
            That instance loops submit / PENDED decision three times, asserts submission_count
            reaches 3, and asserts the fourth submit returns ERR_AUTH_RESUBMIT_LIMIT.

      - name: patient_double_booked_is_covered_by_the_unbuffered_boundary_instance
        claim_type: triggerable
        grounds:
          - errors[ERR_PATIENT_DOUBLE_BOOKED]
          - validations[priority 92]
        distinguishing_aspect: |
          The patient overlap test is half-open and, unlike the chair test, unbuffered, so the
          only meaningful triggers are the minute before and the minute at the previous
          window's end.
        excluded_because:
          difficulty_instance: patient_unbuffered_half_open_double_booking_refused_at_765_then_admitted_at_780
          rationale: |
            That instance refuses minute 765 with ERR_PATIENT_DOUBLE_BOOKED and admits minute
            780, proving the interval is half-open and that the turnover buffer is not applied
            to the patient dimension.

      - name: nurse_capacity_errors_are_covered_by_the_acuity_boundary_instance
        claim_type: triggerable
        grounds:
          - errors[ERR_NURSE_ACUITY_EXCEEDED]
          - errors[ERR_NO_NURSE_ON_SHIFT]
          - errors[ERR_NO_CHAIR_CAPACITY]
          - validations[priority 90]
          - validations[priority 91]
        distinguishing_aspect: |
          All three staffing refusals share one trigger surface, and telling them apart
          requires a fixture where the roster is exactly at capacity, then one point over,
          then off shift.
        excluded_because:
          difficulty_instance: nurse_acuity_exactly_at_capacity_admitted_then_one_point_over_refused
          rationale: |
            That instance admits the booking that lands assigned_acuity_points exactly on
            acuity_capacity_points, refuses the next with ERR_NURSE_ACUITY_EXCEEDED, refuses
            an off-shift minute with ERR_NO_NURSE_ON_SHIFT, and reaches ERR_NO_CHAIR_CAPACITY
            once every chair is committed.

      - name: no_eligible_lot_is_covered_by_the_exhausted_candidate_pool_instance
        claim_type: triggerable
        grounds:
          - errors[ERR_NO_ELIGIBLE_LOT]
          - calculations[lot_selection]
        distinguishing_aspect: |
          An empty candidate pool is only meaningful right after the FEFO selector has been
          shown choosing correctly, and right at the units_available boundary where a lot
          stops being able to cover a whole dose.
        excluded_because:
          difficulty_instance: lot_selection_units_available_boundary_then_exhausted_candidate_pool
          rationale: |
            That instance walks the FEFO order across three lots, drains them to the point
            where no single lot can cover the requested units, and asserts the resulting
            ERR_NO_ELIGIBLE_LOT together with the untouched unit ledger.

      - name: lot_not_available_and_invalid_preparation_state_are_covered_by_the_swept_lot_instance
        claim_type: triggerable
        grounds:
          - errors[ERR_LOT_NOT_AVAILABLE]
          - errors[ERR_INVALID_PREPARATION_STATE]
          - state_machines[DrugPreparation].transitions[REQUESTED -> PREPARED]
        distinguishing_aspect: |
          The compelling trigger is a lot that was AVAILABLE when the dose was requested and
          EXPIRED by the time it is compounded, which also leaves the preparation in a state
          from which prepare can never be retried.
        excluded_because:
          difficulty_instance: prepare_refused_after_the_daily_sweep_expired_the_already_selected_lot
          rationale: |
            That instance requests the dose against a live lot, lets the daily sweep expire
            it, asserts ERR_LOT_NOT_AVAILABLE on prepare, and then asserts
            ERR_INVALID_PREPARATION_STATE once the cascade has moved the preparation off
            REQUESTED.

      - name: plan_suspended_and_steering_hold_are_covered_by_the_booking_priority_ladder
        claim_type: triggerable
        grounds:
          - errors[ERR_PLAN_SUSPENDED]
          - errors[ERR_PATIENT_STEERING_HOLD]
          - errors[ERR_OUTSIDE_OPERATING_HOURS]
          - validations[priority 45]
          - validations[priority 75]
          - validations[priority 94]
        distinguishing_aspect: |
          These three booking refusals are only distinguishable when a single request violates
          more than one of them at once, which is precisely the deep-priority-ladder shape the
          difficulty design targets.
        excluded_because:
          difficulty_instance: plan_suspended_priority_45_beats_outside_operating_hours_priority_94_on_booking
          rationale: |
            That instance builds one request that is simultaneously on a SUSPENDED plan, for a
            patient under HOME_INFUSION_REVIEW steering and outside the operating window, and
            asserts the errors are peeled off in the declared 45 / 75 / 94 order as each cause
            is removed.

  - section: rbac
    instances:
      - name: all_six_roles_execute_their_own_exclusive_operations_in_one_relay
        claim_type: exclusive_operations
        grounds:
          - roles[Scheduler].exclusive_operations
          - roles[AuthorizationSpecialist].exclusive_operations
          - roles[Pharmacist].exclusive_operations
          - roles[InfusionNurse].exclusive_operations
          - roles[MedicalDirector].exclusive_operations
          - roles[Patient].shared_operations
        distinguishing_aspect: |
          The whole point of a peer-role split is that no single actor can carry a visit from
          booking to discharge. This relay hands the same appointment through all six roles in
          the declared order and every hand-off must be accepted, which is the positive control
          for every ERR_UNAUTHORIZED test: if any call here is refused the denial matrix proves
          nothing. Patient has no exclusive operations at all, so its shared self-service reads
          stand in for its surface.
