# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Eminent Domain & Right-of-Way Acquisition — Expert
# 9 rule_ids, >= 2 instances each (19 total).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: jc_offer_vs_condemnation_basis
        grounds:
          - calculations.just_compensation
          - entities.Appraisal.fields.just_compensation_cents
          - entities.Appraisal.fields.condemnation_basis_cents
        distinguishing_aspect: |
          Same appraisal inputs yield two bases: offer basis nets special benefits
          against severance (floored) = 27,000,000, while condemnation basis ignores
          special benefits = 28,000,000; they differ by exactly min(severance, special) = 1,000,000.
        test_recipe:
          setup:
            - "A project and a parcel with one FINALIZED appraisal (land 20,000,000; improvements 5,000,000; severance 3,000,000; special benefits 1,000,000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P1", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D1", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
          trigger:
            - call: "GET /appraisals/${appr_id}"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "Appraisal.${appr_id}.just_compensation_cents == 27000000"
            - "Appraisal.${appr_id}.condemnation_basis_cents == 28000000"
            - "condemnation_basis_cents - just_compensation_cents == 1000000"

      - name: relocation_residential_vs_business
        grounds:
          - calculations.relocation_benefit
          - entities.RelocationBenefit.fields.benefit_amount_cents
          - entities.RelocationBenefit.fields.occupant_type
        distinguishing_aspect: |
          On the occupant-relocation domain (different entity than the appraisal dual-variant),
          RESIDENTIAL caps the replacement differential at 3,150,000 (=> 3,100,000) while BUSINESS
          caps reestablishment at 5,000,000 (=> 5,200,000) for the same claimant.
        test_recipe:
          setup:
            - "A parcel with an occupant FEE_OWNER interest (is_occupant true) who files one residential and one business claim."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P2", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D2", total_area_sqft: 8000, take_area_sqft: 8000, take_type: "FULL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "Occ", ownership_pct: 100, is_occupant: true }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
          trigger:
            - call: "POST /parcels/${parcel_id}/relocation-benefits"
              payload: { claimant_name: "Occ", occupant_type: "RESIDENTIAL", comparable_replacement_cost_cents: 25000000, acquired_dwelling_price_cents: 22000000, moving_expense_cents: 100000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
              captures: { res_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/relocation-benefits"
              payload: { claimant_name: "Occ", occupant_type: "BUSINESS", reestablishment_cost_cents: 6000000, moving_expense_cents: 200000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
              captures: { bus_id: $.data.id }
          assert:
            - "RelocationBenefit.${res_id}.benefit_amount_cents == 3100000"
            - "RelocationBenefit.${bus_id}.benefit_amount_cents == 5200000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: jc_max_offset_floor_mode_a
        grounds:
          - calculations.just_compensation
          - entities.Appraisal.fields.just_compensation_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with a non-linear max(0, severance - special) floor. When special (3,000,000)
          exceeds severance (1,000,000) the severance term clamps to 0, so offer basis = 25,000,000 (not 23,000,000).
        test_recipe:
          setup:
            - "A parcel with a FINALIZED appraisal where special_benefits exceed severance_damages."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P3", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D3", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 1000000, special_benefits_cents: 3000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
          trigger:
            - call: "GET /appraisals/${appr_id}"
              payload: {}
              as: RightOfWayAgent
          assert:
            - "Appraisal.${appr_id}.just_compensation_cents == 25000000"
            - "Appraisal.${appr_id}.condemnation_basis_cents == 26000000"

      - name: waterfall_owner_rounding_order_mode_b
        grounds:
          - calculations.disbursement_waterfall
          - entities.Escrow.fields.disbursements
          - state_machines.Escrow.FUNDED_to_CLOSED
        distinguishing_aspect: |
          Mode (b): per-fee-owner shares are round_half_up individually then reconciled; naive round-then-sum
          overshoots the 10,350,001 owner pool by 1 cent, and the pinned rule applies the -1 remainder to the
          earliest-created fee owner, giving O1=5,175,000 and O2=5,175,001 (not 5,175,001 each).
        test_recipe:
          setup:
            - "Parcel with FEE_OWNERs O1(50%, earliest) and O2(50%) plus LIENHOLDERs LH1(pri1, 10,000,000) and LH2(pri2, 8,000,000); negotiation AGREED at 28,350,001 (round_count 3, no bonus); escrow FUNDED; clock advanced past the 3-day waiting period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /projects"
              payload: { name: "P4", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D4", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O1", ownership_pct: 50 }
              as: RightOfWayAgent
              captures: { o1_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O2", ownership_pct: 50 }
              as: RightOfWayAgent
              captures: { o2_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "LIENHOLDER", holder_name: "LH1", lien_priority: 1, lien_balance_cents: 10000000 }
              as: RightOfWayAgent
              captures: { lh1_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "LIENHOLDER", holder_name: "LH2", lien_priority: 2, lien_balance_cents: 8000000 }
              as: RightOfWayAgent
              captures: { lh2_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "COUNTER", amount_cents: 28350001 }
              as: PropertyOwner
              as_user_id: "${o1_id}"
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "ACCEPT" }
              as: RightOfWayAgent
            - call: "POST /parcels/${parcel_id}/escrows"
              payload: { source: "NEGOTIATED" }
              as: EscrowOfficer
              captures: { escrow_id: $.data.id }
            - call: "POST /escrows/${escrow_id}/fund"
              payload: {}
              as: EscrowOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /escrows/${escrow_id}/close"
              payload: {}
              as: EscrowOfficer
          assert:
            - "Escrow.${escrow_id}.status == CLOSED"
            - "Escrow.${escrow_id}.disbursed_total_cents == 28350001"
            - "sum(Escrow.${escrow_id}.disbursements[].amount_cents) == 28350001"
            - "the LIENHOLDER disbursement for LH1 == 10000000 and for LH2 == 8000000"
            - "the FEE_OWNER disbursement for O1 (earliest created) == 5175000 and for O2 == 5175001"

      - name: prompt_bonus_base_keyed_mode_c
        grounds:
          - calculations.prompt_settlement_bonus
          - entities.Negotiation.fields.prompt_bonus_cents
          - entities.Negotiation.fields.settlement_total_cents
        distinguishing_aspect: |
          Mode (c): settlement_total = agreed + bonus but bonus tier is pinned to the BASE agreed_amount_cents.
          agreed 25,000,000 <= 25,000,000 threshold => 3% = 750,000; a total-keyed order (25,750,000 > threshold => 5% = 1,250,000) is wrong.
        test_recipe:
          setup:
            - "Cleared parcel with a FINALIZED appraisal of offer basis 25,000,000; negotiation opened at initial offer 25,000,000; owner accepts on round 2 (round_count 2, bonus applies)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P5", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D5", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 0, special_benefits_cents: 0, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 25000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
          trigger:
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "ACCEPT" }
              as: PropertyOwner
              as_user_id: "${oi_id}"
          assert:
            - "Negotiation.${neg_id}.status == AGREED"
            - "Negotiation.${neg_id}.agreed_amount_cents == 25000000"
            - "Negotiation.${neg_id}.prompt_bonus_cents == 750000"
            - "Negotiation.${neg_id}.settlement_total_cents == 25750000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_offer_counter_cycle
        grounds:
          - state_machines.Negotiation.AGENCY_OFFERED_to_OWNER_COUNTERED
          - state_machines.Negotiation.OWNER_COUNTERED_to_AGENCY_OFFERED
          - entities.Negotiation.fields.round_count
        distinguishing_aspect: |
          Negotiation returns to AGENCY_OFFERED after AGENCY_OFFERED -> OWNER_COUNTERED -> AGENCY_OFFERED,
          a genuine A->B->A cycle; round_count reaches 3 and current_amount_cents tracks the latest agency counter.
        test_recipe:
          setup:
            - "Cleared parcel with FINALIZED appraisal; negotiation opened at 27,000,000 (round 1 agency OFFER)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P6", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D6", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
          trigger:
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "COUNTER", amount_cents: 30000000 }
              as: PropertyOwner
              as_user_id: "${oi_id}"
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { action: "COUNTER", amount_cents: 28000000 }
              as: RightOfWayAgent
          assert:
            - "after the owner COUNTER, Negotiation.${neg_id}.status == OWNER_COUNTERED"
            - "after the agency COUNTER, Negotiation.${neg_id}.status == AGENCY_OFFERED"
            - "Negotiation.${neg_id}.round_count == 3"
            - "Negotiation.${neg_id}.current_amount_cents == 28000000"

      - name: parcel_parallel_research_and_acquisition_dimensions
        grounds:
          - state_machines.Parcel.research_status.RESEARCHING_to_OWNERSHIP_CLEARED
          - state_machines.Parcel.acquisition_status.PENDING_to_IN_NEGOTIATION
          - entities.Parcel.fields.research_status
          - entities.Parcel.fields.acquisition_status
        distinguishing_aspect: |
          research_status and acquisition_status are parallel dimensions on one Parcel row: clear-ownership moves
          research_status to OWNERSHIP_CLEARED while acquisition_status stays PENDING, then opening a negotiation moves
          acquisition_status to IN_NEGOTIATION while research_status stays OWNERSHIP_CLEARED.
        test_recipe:
          setup:
            - "Parcel created (research RESEARCHING, acquisition PENDING) with a FEE_OWNER(100%) and a FINALIZED appraisal (appraisal create/finalize touch neither dimension)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P7", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D7", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
          trigger:
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
          assert:
            - "after clear-ownership: Parcel.${parcel_id}.research_status == OWNERSHIP_CLEARED AND Parcel.${parcel_id}.acquisition_status == PENDING"
            - "after opening negotiation: Parcel.${parcel_id}.acquisition_status == IN_NEGOTIATION AND Parcel.${parcel_id}.research_status == OWNERSHIP_CLEARED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: possession_to_parcel_to_utility_cascade
        grounds:
          - state_machines.Condemnation.DEPOSIT_MADE_to_POSSESSED
          - state_machines.Parcel.acquisition_status.IN_CONDEMNATION_to_POSSESSED
          - entities.UtilityRelocation.fields.possession_cleared
        distinguishing_aspect: |
          grant-possession mutates Condemnation -> POSSESSED; that mutates Parcel.acquisition_status -> POSSESSED;
          that in turn flips UtilityRelocation.possession_cleared to true — a 3-hop chain where each link is caused by the previous.
        test_recipe:
          setup:
            - "Condemnation in DEPOSIT_MADE (deposit 28,000,000 == floor) on a cleared, appraised, negotiated parcel; one UtilityRelocation IDENTIFIED with possession_cleared false (parcel still IN_CONDEMNATION)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P8", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D8", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
              as: RightOfWayAgent
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: Appraiser
              captures: { parcel_v: $.data.version }
            - call: "POST /parcels/${parcel_id}/appraisals"
              payload: { appraiser_name: "AX", land_value_cents: 20000000, improvements_value_cents: 5000000, severance_damages_cents: 3000000, special_benefits_cents: 1000000, expected_parcel_version: "${parcel_v}" }
              as: Appraiser
              captures: { appr_id: $.data.id }
            - call: "POST /appraisals/${appr_id}/finalize"
              payload: {}
              as: Appraiser
            - call: "POST /parcels/${parcel_id}/negotiations"
              payload: { initial_offer_cents: 27000000 }
              as: RightOfWayAgent
              captures: { neg_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/condemnations"
              payload: {}
              as: RightOfWayAgent
              captures: { cond_id: $.data.id }
            - call: "POST /condemnations/${cond_id}/deposit"
              payload: { deposit_amount_cents: 28000000 }
              as: RightOfWayAgent
            - call: "POST /parcels/${parcel_id}/utility-relocations"
              payload: { utility_type: "WATER" }
              as: UtilityCoordinator
              captures: { ur_id: $.data.id }
          trigger:
            - call: "POST /condemnations/${cond_id}/grant-possession"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Condemnation.${cond_id}.status == POSSESSED"
            - "Parcel.${parcel_id}.acquisition_status == POSSESSED"
            - "UtilityRelocation.${ur_id}.possession_cleared == true"

      - name: finalize_to_parcel_to_project_committed_cascade
        grounds:
          - state_machines.Appraisal.DRAFT_to_FINALIZED
          - entities.Parcel.fields.appraised_value_cents
          - entities.Project.fields.committed_cents
        distinguishing_aspect: |
          Finalizing a second appraisal sets Parcel.appraised_value_cents to 30,000,000; that parcel change recomputes
          Project.committed_cents from 27,000,000 to 30,000,000 — a finalize->Parcel->Project chain from a different trigger than the possession cascade.
        test_recipe:
          setup:
            - "Parcel IN_NEGOTIATION with a first FINALIZED appraisal (offer basis 27,000,000) so Project.committed_cents == 27,000,000; a second DRAFT appraisal (offer basis 30,000,000) exists but is not yet finalized."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P9", agency_name: "DOT", total_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /parcels"
              payload: { project_id: "${proj_id}", apn: "APN-D9", total_area_sqft: 10000, take_area_sqft: 5000, take_type: "PARTIAL" }
              as: RightOfWayAgent
              captures: { parcel_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/ownership-interests"
              payload: { interest_type: "FEE_OWNER", holder_name: "O", ownership_pct: 100 }
              as: RightOfWayAgent
              captures: { oi_id: $.data.id }
            - call: "POST /parcels/${parcel_id}/clear-ownership"
              payload: {}
