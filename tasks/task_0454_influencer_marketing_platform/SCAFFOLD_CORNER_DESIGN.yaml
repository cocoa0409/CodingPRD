              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "SC", campaign_budget_cents: 200000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "VIDEO", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 80000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 80000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/sc", caption: "ok" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /content-submissions/${sub_id}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { kv_fulfilled: $.data.version }
          trigger:
            - call: "POST /payouts"
              payload: { contract_id: "${contract_id}", expected_contract_version: "${kv_fulfilled} - 1" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == 'ERR_STALE_CONTRACT_VERSION'"

      - name: brand_committed_recompute_on_sign_derived_field
        claim_type: derived_field_reconciliation
        grounds: [calculations.brand_available_budget, entities.Brand.fields.committed_cents, state_machines.Contract.NEW_to_ACTIVE]
        distinguishing_aspect: "After signing a 70000c contract, brand.committed_cents == 70000 and available_budget_cents == 30000 (derived fields reconciled immediately on sign)."
        test_recipe:
          setup: ["Brand budget 100000c; an ACCEPTED offer 70000c for a clean creator"]
          setup_api_calls:
