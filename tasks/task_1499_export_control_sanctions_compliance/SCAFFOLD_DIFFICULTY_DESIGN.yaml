scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: determination_provisional_vs_final_on_reclassification
        grounds:
          - calculations.license_determination
          - entities.ExportOrder.fields.provisional_determination
          - entities.ExportOrder.fields.determination
          - entities.ExportOrder.fields.determination_classification_sequence
        distinguishing_aspect: |
          Entity domain ExportOrder: the provisional variant (computed at POST /orders against
          the then-ACTIVE EAR99 classification) yields NOT_REQUIRED, while the final variant at
          submit (after an ECCN 5A002 classification superseded EAR99) yields LICENSE_REQUIRED —
          identical order data, different results purely from the variant's classification snapshot.
        test_recipe:
          setup:
            - "Product (controlled_content_pct=50, unit_value_cents=25000) initially CLASSIFIED via EAR99 classification (sequence 1), then reclassified to ECCN 5A002 (sequence 2, ACTIVE)"
            - "Party Nordic Retail AB (SWE) with no screening list entries"
            - "Order created between the two classifications: destination FRA, end_use CIVILIAN, quantity 2"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-100", name: "Oscillator", controlled_content_pct: 50, unit_value_cents: 25000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v1: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v1}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c1_id: $.data.id }
            - call: "POST /compliance/classifications/${c1_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c1_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Nordic Retail AB", country_code: "SWE", city: "Stockholm", party_type: "END_USER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "FRA", end_use: "CIVILIAN", quantity: 2 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "GET /compliance/products/${p_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { p_v2: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v2}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "CCATS" }
              as: ComplianceAnalyst
              captures: { c2_id: $.data.id }
            - call: "POST /compliance/classifications/${c2_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c2_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
          assert:
            - "Order.${o_id}.provisional_determination == \"NOT_REQUIRED\""
            - "Order.${o_id}.determination == \"LICENSE_REQUIRED\""
            - "Order.${o_id}.determination_classification_sequence == 2"
            - "Order.${o_id}.status == \"CLEARED\""
            - "Classification.${c1_id}.status == \"SUPERSEDED\" (via GET /compliance/classifications/${c1_id})"

      - name: screening_exact_vs_fuzzy_same_party_entry
        grounds:
          - calculations.screening_match_score
          - entities.ScreeningResult.fields.algorithm_variant
          - entities.ScreeningResult.fields.score
        distinguishing_aspect: |
          Entity domain ScreeningResult: identical party/entry pair ("Global Trade Corporation"
          vs entry "Global Trade Corp", same country) scores 0.40 under the EXACT variant
          (ORDER context, s_name=0.00) yielding CLEAR, but 0.70 under the FUZZY variant
          (MANUAL context, token overlap 2/4=0.50) hitting the RESTRICTED threshold exactly
          and yielding POTENTIAL_MATCH.
        test_recipe:
          setup:
            - "ACTIVE DENIED_PERSONS entry: match_name 'Global Trade Corp', country DEU, severity RESTRICTED (born ACTIVE before any party exists, so its creation sweep is a no-op)"
            - "Party 'Global Trade Corporation', country DEU, city Hamburg"
            - "Classified EAR99 product so an order can be submitted (drives ORDER-context EXACT screening)"
          setup_api_calls:
            - call: "POST /compliance/screening-list-entries"
              payload: { list_source: "DENIED_PERSONS", match_name: "Global Trade Corp", country_code: "DEU", severity: "RESTRICTED" }
              as: ComplianceDirector
              captures: { e_id: $.data.id }
            - call: "POST /compliance/products"
              payload: { sku: "P-200", name: "Resistor", controlled_content_pct: 0, unit_value_cents: 500 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Global Trade Corporation", country_code: "DEU", city: "Hamburg", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "DEU", end_use: "CIVILIAN", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
          trigger:
            - call: "POST /compliance/parties/${party_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
              captures: { r_fuzzy_id: $.data.id }
            - call: "GET /compliance/screening-results?party_id=${party_id}&trigger_context=ORDER"
              payload: {}
              as: ComplianceManager
              captures: { r_exact_status: "$.data[0].status", r_exact_variant: "$.data[0].algorithm_variant" }
          assert:
            - "ScreeningResult.${r_fuzzy_id}.algorithm_variant == \"FUZZY\""
            - "ScreeningResult.${r_fuzzy_id}.score == 0.70"
            - "ScreeningResult.${r_fuzzy_id}.threshold_used == 0.70"
            - "ScreeningResult.${r_fuzzy_id}.status == \"POTENTIAL_MATCH\""
            - "ScreeningResult.${r_fuzzy_id}.matched_entry_id == \"${e_id}\""
            - "ORDER-context result: r_exact_status == \"CLEAR\" and r_exact_variant == \"EXACT\""
            - "Party.${party_id}.screening_posture == \"REVIEW_REQUIRED\""

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: screening_score_severity_threshold_branch
        grounds:
          - calculations.screening_match_score
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear conditional branch on entity state: the same
          FUZZY score 0.80 (s_name=0.67 from token overlap 2/3, s_country=1, s_city=1:
          0.60*0.67+0.25+0.15=0.802 -> 0.80) is POTENTIAL_MATCH against a RESTRICTED entry
          (threshold 0.70) but CLEAR against a PROHIBITED entry (threshold 0.85); and the
          PROHIBITED hard gate forces score 0.00 on country mismatch despite exact name.
        test_recipe:
          setup:
            - "Two entries, both matching name family 'Atlas Industrial': E1 DENIED_PERSONS RESTRICTED (DEU), E2 SDN PROHIBITED (SYR)"
            - "Party A 'Atlas Industrial' (DEU, Berlin); Party B 'Atlas Industrial' (FRA, Lyon)"
          setup_api_calls:
            - call: "POST /compliance/screening-list-entries"
              payload: { list_source: "DENIED_PERSONS", match_name: "Atlas Industrial Group", country_code: "DEU", severity: "RESTRICTED" }
              as: ComplianceDirector
              captures: { e1_id: $.data.id }
            - call: "POST /compliance/screening-list-entries"
              payload: { list_source: "SDN", match_name: "Atlas Industrial Group", country_code: "SYR", severity: "PROHIBITED" }
              as: ComplianceDirector
              captures: { e2_id: $.data.id }
            - call: "POST /compliance/parties"
              payload: { legal_name: "Atlas Industrial", country_code: "DEU", city: "Berlin", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /compliance/parties"
              payload: { legal_name: "Atlas Industrial", country_code: "FRA", city: "Lyon", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /compliance/parties/${pa_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
              captures: { ra_id: $.data.id }
            - call: "POST /compliance/parties/${pb_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
              captures: { rb_id: $.data.id }
          assert:
            - "ScreeningResult.${ra_id}: best entry is ${e1_id}; score == 0.80; threshold_used == 0.70; status == \"POTENTIAL_MATCH\""
            - "ScreeningResult.${rb_id}.status == \"CLEAR\" and score == 0.00 (PROHIBITED hard gate: s_country=0 forces 0 despite s_name=0.67; note E1 also mismatches at 0.60*0.67+0+0=0.40 < 0.70)"

      - name: fee_round_per_shipment_then_sum
        grounds:
          - calculations.shipment_compliance_fee
          - entities.Shipment.fields.fee_cents
          - entities.ExportOrder.fields.accumulated_fees_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned per-shipment: shipments of 160 and 360
          cents yield fees round(2.40)=2 and round(5.40)=5, accumulated_fees_cents == 7;
          the forbidden sum-then-round order would give round(520*0.015)=round(7.80)=8.
        test_recipe:
          setup:
            - "Classified EAR99 product with unit_value_cents=40; clean party; NOT_REQUIRED order (quantity 13) released"
            - "Shipment S1 quantity 4 (value 160) and shipment S2 quantity 9 (value 360), each screened and released"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-300", name: "Fastener", controlled_content_pct: 0, unit_value_cents: 40 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Clean Buyer Ltd", country_code: "GBR", city: "London", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "FRA", end_use: "CIVILIAN", quantity: 13 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/orders/${o_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments"
              payload: { order_id: "${o_id}", quantity: 4, planned_ship_date: "2026-08-10" }
              as: TradeOpsSpecialist
              captures: { s1_id: $.data.id }
            - call: "POST /compliance/shipments/${s1_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments/${s1_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments"
              payload: { order_id: "${o_id}", quantity: 9, planned_ship_date: "2026-08-11" }
              as: TradeOpsSpecialist
              captures: { s2_id: $.data.id }
            - call: "POST /compliance/shipments/${s2_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments/${s2_id}/release"
              payload: {}
              as: TradeOpsSpecialist
          trigger:
            - call: "GET /compliance/orders/${o_id}"
              payload: {}
              as: TradeOpsSpecialist
              captures: { o_fees: $.data.accumulated_fees_cents }
          assert:
            - "Shipment.${s1_id}.fee_cents == 2 and consumed_value_cents == 160"
            - "Shipment.${s2_id}.fee_cents == 5 and consumed_value_cents == 360"
            - "Order.${o_id}.accumulated_fees_cents == 7 (NOT 8 — per-shipment rounding pinned)"
            - "Order.${o_id}.shipped_quantity == 13"

      - name: surcharge_tier_keyed_on_goods_not_total
        grounds:
          - calculations.order_total_value
          - entities.ExportOrder.fields.surcharge_cents
          - entities.ExportOrder.fields.total_value_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: goods 99999
          sits below the 100000 tier boundary, so surcharge uses 0.02 (round(1999.98)=2000,
          total 101999); if the tier were keyed on total_value_cents (101999 >= 100000) the
          surcharge would be 3500 — the pinned order (goods first, tier from goods only) is
          what makes the value well-defined.
        test_recipe:
          setup:
            - "Classified EAR99 product with unit_value_cents=33333; clean party"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-400", name: "Pump", controlled_content_pct: 0, unit_value_cents: 33333 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Harbor Retail GmbH", country_code: "DEU", city: "Hamburg", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          trigger:
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "DEU", end_use: "CIVILIAN", quantity: 3 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.goods_value_cents == 99999"
            - "Order.${o_id}.surcharge_cents == 2000"
            - "Order.${o_id}.total_value_cents == 101999"

  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: classification_reject_revise_resubmit_cycle
        grounds:
          - state_machines.Classification.REJECTED_to_DRAFT
          - state_machines.Classification.DRAFT_to_SUBMITTED
          - state_machines.Classification.SUBMITTED_to_ACTIVE
        distinguishing_aspect: |
          Classification is cyclic (REJECTED -> DRAFT -> SUBMITTED -> ACTIVE revision loop),
          not a one-way pipeline: the same record traverses SUBMITTED twice before activation.
        test_recipe:
          setup:
            - "Product created; classification C1 drafted, submitted, REJECTED, revised, resubmitted, approved"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-500", name: "Valve", controlled_content_pct: 10, unit_value_cents: 900 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "ITAR", classification_code: "XI", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "REJECT" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/classifications/${c_id}/revise"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { c_rev_status: $.data.status }
          trigger:
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          assert:
            - "c_rev_status == \"DRAFT\" (REJECTED -> DRAFT loop traversed)"
            - "Classification.${c_id}.status == \"ACTIVE\" after second review"
            - "Product.${p_id}.status == \"CLASSIFIED\" and active_classification_id == \"${c_id}\""
            - "AuditRecord(CLASSIFICATION_ACTIVATED, entity_id=${c_id}) exists exactly once"

      - name: order_cleared_held_cleared_cycle_via_list_change
        grounds:
          - state_machines.ExportOrder.CLEARED_to_HELD
          - state_machines.ExportOrder.HELD_to_CLEARED
          - state_machines.ScreeningListEntry.INACTIVE_to_ACTIVE
        distinguishing_aspect: |
          ExportOrder is cyclic: CLEARED -> HELD (list-activation cascade) -> CLEARED
          (release-hold after FALSE_POSITIVE resolution) returns the order to a previously
          visited state, with pre_hold_status preserving the return target.
        test_recipe:
          setup:
            - "Classified EAR99 product; party 'Baltic Imports OU' (EST); order submitted -> CLEARED (no entries at submit time)"
            - "Director then creates ACTIVE DENIED_PERSONS entry 'Baltic Imports OU' (EST, RESTRICTED): born-ACTIVE sweep creates LIST_CHANGE POTENTIAL_MATCH (exact name, score 1.00 >= 0.70), party posture -> REVIEW_REQUIRED, order CLEARED -> HELD"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-600", name: "Cable", controlled_content_pct: 0, unit_value_cents: 120 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Baltic Imports OU", country_code: "EST", city: "Tallinn", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "EST", end_use: "CIVILIAN", quantity: 5 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/screening-list-entries"
              payload: { list_source: "DENIED_PERSONS", match_name: "Baltic Imports OU", country_code: "EST", severity: "RESTRICTED" }
              as: ComplianceDirector
              captures: { e_id: $.data.id }
            - call: "GET /compliance/screening-results?party_id=${party_id}&trigger_context=LIST_CHANGE"
              payload: {}
              as: ComplianceManager
              captures: { r_id: "$.data[0].id" }
          trigger:
            - call: "POST /compliance/screening-results/${r_id}/resolve"
              payload: { resolution: "FALSE_POSITIVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/orders/${o_id}/release-hold"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
          assert:
            - "after entry creation: Order.${o_id}.status == \"HELD\" and pre_hold_status == \"CLEARED\""
            - "after entry creation: Party.${party_id}.screening_posture == \"REVIEW_REQUIRED\""
            - "after release-hold: Order.${o_id}.status == \"CLEARED\" and pre_hold_status == null"

  # =================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: list_activation_rescreen_cascade_depth3
        grounds:
          - state_machines.ScreeningListEntry.INACTIVE_to_ACTIVE
          - state_machines.ExportOrder.LICENSED_to_HELD
          - state_machines.Shipment.PLANNED_to_HELD
          - calculations.party_screening_posture
        distinguishing_aspect: |
          Trigger: list-entry activation. Depth 3 chain where each link is caused by the
          previous one (not fan-out): entry activation -> LIST_CHANGE ScreeningResult created
          -> party screening_posture recomputed to REVIEW_REQUIRED -> order LICENSED -> HELD
          -> its PLANNED shipment -> HELD.
        test_recipe:
          setup:
            - "Product EAR 5A002 (pct 50, unit 1000) CLASSIFIED; License APPROVED (value 100000, qty 100, window 2026-07-01..2026-12-31)"
            - "Party 'Vostok Trading LLC' (RUS); order destination KAZ end_use DUAL_USE qty 5 -> determination LICENSE_REQUIRED -> CLEARED -> LICENSED via attach"
            - "Shipment qty 5 PLANNED on the LICENSED order (shipment creation allowed in LICENSED)"
            - "no screening entries exist at order submit time"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-700", name: "Amplifier", controlled_content_pct: 50, unit_value_cents: 1000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "CCATS" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/licenses"
              payload: { product_id: "${p_id}", issuing_authority: "BIS", approved_value_cents: 100000, approved_quantity: 100, valid_from: "2026-07-01", valid_until: "2026-12-31", conditions: [] }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /compliance/licenses/${l_id}/submit"
              payload: {}
