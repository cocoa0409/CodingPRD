            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys_b}", alarm_type: "BURGLARY", verification_method: "TWO_CALL_ECV", call_attempts: [{site_contact_id: "${ac1}", attempted_at: "2026-01-06T03:01:00Z", outcome: "NO_ANSWER"}, {site_contact_id: "${ac2}", attempted_at: "2026-01-06T03:03:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-01-06T03:00:00Z", idempotency_key: "pa-2507-counted"}, as: AlarmCompanyOperator, as_user_id: "${company_a}", captures: {dr_b: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_b}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_b}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/false-alarm-incidents", payload: {dispatch_request_id: "${dr_b}", cause_code: "OPERATOR_ERROR"}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507", captures: {inc_a: $.data.id}}
            - {call: "POST /false-alarm-program/false-alarm-incidents/${inc_a}/determination", payload: {determination: "COUNTED"}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "GET /false-alarm-program/suspension-orders?alarm_site_id=${site_a}&status=PROPOSED", payload: {}, as: ProgramAdministrator, captures: {order_a: "$.data[0].id"}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-10T00:00:00Z"}, as: ProgramAdministrator}
