      - name: production_lot_release_before_ci_certification_returns_qa_not_passed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ProductionLot.PRODUCED_to_RELEASED
          - validations[priority=132]
          - errors[ERR_QA_NOT_PASSED]
          - entities.ProductionLot.fields.released_by_user_id
        distinguishing_aspect: |
          The release join needs BOTH branches complete: with qa_status already PASSED but
          ci_status still PENDING the release is refused at priority 132, and the SAME call
          succeeds unchanged once certify-ci has run — the failure is attributable to the CI branch
          alone.
        test_recipe:
          setup:
            - "One asset with a covering contract and one lot produced 2026-07-20 to 2026-07-21."
            - "A PASS purity test by QA-1 (qa_status PASSED); certify-ci deliberately not yet run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-assets"
              payload: { asset_code: "PA-S5-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-S5-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 50.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-S5-1", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id" }
            - call: "POST /production-lots/${lot_id}/purity-tests"
              payload: { sampled_at: "2026-07-21T06:00:00Z", total_hydrocarbons_ppm: 1.000, water_ppm: 2.500, oxygen_ppm: 2.500, nitrogen_ppm: 50.000, carbon_monoxide_ppm: 0.100, carbon_dioxide_ppm: 1.000, total_sulfur_ppm: 0.002, ammonia_ppm: 0.050, helium_ppm: 150.000 }
              as: QualityAnalyst
              as_user_id: "QA-1"
          trigger:
            - call: "POST /production-lots/${lot_id}/release"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /production-lots/${lot_id}/certify-ci"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { ci_cert: "$.data.ci_certified_gco2e_per_mj" }
            - call: "POST /production-lots/${lot_id}/release"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { released_by: "$.data.released_by_user_id" }
          assert:
            - "First release: HTTP 422 with ${err} == ERR_QA_NOT_PASSED"
            - "After the failed release: ProductionLot.${lot_id}.status == PRODUCED, qa_status == PASSED, ci_status == PENDING, released_by_user_id is null"
            - "certify-ci: HTTP 200, ci_status == CERTIFIED, ci_variant_applied == ANNUAL_AVERAGE, ${ci_cert} == 85.92 (electricity 15600.0 kWh * 385 g/kWh * (1 - 0.500) + compression 300.000 kg * 300.0 g, over 300.000 kg * 120.0 MJ)"
            - "Second release: HTTP 200, status == RELEASED, ${released_by} == CA-1"

      - name: safety_event_clear_restores_subsystem_field_and_reopens_posture
        claim_type: side_effect_execution
        grounds:
          - state_machines.SafetyEvent.ACKNOWLEDGED_to_CLEARED
          - state_machines.Station.FROZEN_to_OPEN
          - entities.Station.fields.ventilation_status
          - calculations.station_safety_posture
        distinguishing_aspect: |
          Clearing runs three distinct side effects in order — event stamped CLEARED, the matching
          subsystem field (ventilation_status) returned to NORMAL, and only THEN the posture
          recomputed — so the station lands back on OPEN rather than staying FROZEN on a stale
          subsystem flag.
        test_recipe:
          setup:
            - "Station STN-S6 with one HIGH 600 L vessel at 950.00 bar (posture OPEN, high bank 36.000)."
            - "A VENTILATION_FAULT event of severity MAJOR opened by SO-1 at 2026-08-01T02:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-S6", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-S6", name: "Ventilation Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety-events"
              payload: { station_id: "${st_id}", kind: "VENTILATION_FAULT", severity: "MAJOR", affected_nozzle_count: 2, detected_by: "SENSOR" }
              as: SafetyOfficer
              as_user_id: "SO-1"
              captures: { ev_id: "$.data.id" }
            - call: "POST /safety-events/${ev_id}/acknowledge"
              payload: {}
              as: SafetyOfficer
              as_user_id: "SO-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: PlatformAdmin
            - call: "GET /stations/${st_id}"
              payload: {}
              as: SafetyOfficer
              captures: { posture_before: "$.data.safety_posture", vent_before: "$.data.ventilation_status", v_before: "$.data.version" }
          trigger:
            - call: "POST /safety-events/${ev_id}/clear"
              payload: { corrective_action: "Replaced exhaust fan motor and re-tested airflow" }
              as: SafetyOfficer
              as_user_id: "SO-2"
              captures: { cleared_at: "$.data.cleared_at", cleared_by: "$.data.cleared_by_user_id" }
          assert:
            - "${posture_before} == FROZEN and ${vent_before} == FAULT (a VENTILATION_FAULT event freezes regardless of severity)"
            - "HTTP 200; SafetyEvent.${ev_id}.status == CLEARED"
            - "${cleared_at} == 2026-08-01T06:00:00Z and ${cleared_by} == SO-2"
            - "SafetyEvent.${ev_id}.corrective_action == 'Replaced exhaust fan motor and re-tested airflow'"
            - "Station.${st_id}.ventilation_status == NORMAL (no other VENTILATION_FAULT event remains outstanding)"
            - "Station.${st_id}.safety_posture == OPEN (high_bank_deliverable_kg 36.000 leaves no restricting condition)"
            - "Station.${st_id}.version == ${v_before} + 1"
            - "the closed downtime interval is [2026-08-01T02:00:00Z, 2026-08-01T06:00:00Z), i.e. 240 minutes over 2 nozzles"

      - name: vessel_inspection_pass_resets_due_date_and_increments_count
        claim_type: side_effect_execution
        grounds:
          - state_machines.PressureVessel.DUE_to_CURRENT
          - entities.PressureVessel.fields.inspection_count
          - entities.PressureVessel.fields.last_inspection_date
          - calculations.operational_thresholds.INSPECTION_GRACE_DAYS
        distinguishing_aspect: |
          A PASS inspection is a pure metadata transition: last_inspection_date takes the LOGICAL
          clock date, next_inspection_due_date takes the supplied value and inspection_count rises
          to 1, while current_pressure_bar, stored_mass_kg and the station ledger are untouched —
          the contrast with the CONDEMN branch, which vents the vessel, is what makes it falsifiable.
        test_recipe:
          setup:
            - "Station STN-S7 with a HIGH 600 L vessel at 950.00 bar due 2026-08-05."
            - "Clock advanced to 2026-08-10, i.e. inside the 30-day grace window, so the vessel is DUE (still deliverable)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-S7", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-S7", name: "Inspection Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2026-08-05" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { recomputed: "$.data.vessels_recomputed" }
          trigger:
            - call: "POST /pressure-vessels/${v_high}/inspections"
              payload: { outcome: "PASS", next_due_date: "2027-08-05" }
              as: SafetyOfficer
              captures: { status_after: "$.data.inspection_status", count_after: "$.data.inspection_count" }
          assert:
            - "${recomputed} == 1 and the vessel was DUE before the inspection (2026-08-10 is within [2026-08-05, 2026-09-04])"
            - "Station posture was OPEN while DUE — a DUE vessel stays inside total_deliverable_kg"
            - "HTTP 200; ${status_after} == CURRENT and ${count_after} == 1"
            - "PressureVessel.${v_high}.last_inspection_date == 2026-08-10 (logical clock date, not wall clock)"
            - "PressureVessel.${v_high}.next_inspection_due_date == 2027-08-05"
            - "PressureVessel.${v_high}.current_pressure_bar == 950.00 and stored_mass_kg == 45.600 (a PASS never vents)"
            - "Station.${st_id}.onsite_inventory_kg == 45.600 and the ledger still holds exactly 1 OPENING_BALANCE row"
            - "Station.${st_id}.safety_posture == OPEN and high_bank_deliverable_kg == 36.000"

      - name: accepted_offload_syncs_the_ledger_and_consumes_the_lot
        claim_type: ledger_sync
        grounds:
          - state_machines.Delivery.ARRIVED_to_ACCEPTED
          - state_machines.ProductionLot.RELEASED_to_CONSUMED
          - entities.ProductionLot.fields.accepted_delivered_kg
          - calculations.operational_thresholds.LOT_CONSUMED_FRACTION
          - entities.InventoryLedgerEntry.fields.reason
        distinguishing_aspect: |
          One offload writes TWO ledger rows with different arithmetic weight — DELIVERY_RECEIPT at
          +260.000 and HEEL_RETURNED at 0.000 (the heel is recorded, not credited) — and the
