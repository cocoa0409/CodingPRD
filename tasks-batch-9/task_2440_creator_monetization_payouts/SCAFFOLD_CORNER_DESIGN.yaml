            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08-onesecond", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T00:00:01Z" }
              as: PlatformAdmin
          assert:
            - "first trigger: HTTP status == 422 and error.error_id == 'ERR_PERIOD_WINDOW_INVALID'"
            - "second trigger: HTTP status == 422 and error.error_id == 'ERR_PERIOD_WINDOW_INVALID'"
            - "third trigger: HTTP status == 201 and data.status == 'OPEN'"
            - "third trigger: data.label == '2026-08-onesecond'"
            - "GET /monetization/earnings-periods: total_count == 1"


