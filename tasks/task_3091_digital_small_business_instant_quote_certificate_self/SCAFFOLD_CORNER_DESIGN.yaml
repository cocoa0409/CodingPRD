  # =========================================================================
  # Errors (triggerability not already exercised by §1.8)
  # =========================================================================
  - section: errors
    instances:
      - name: error_invalid_request_unknown_field
        claim_type: violation_to_error
        grounds: ["errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A well-formed JSON body carrying an undeclared field is rejected 400 ERR_VALIDATION before any business validation."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "X", contact_email: "x@x.com", channel: "DIRECT", bogus_field: 1 }
              as: Agent
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 400 with error_id ERR_VALIDATION"

      - name: error_not_found_for_unknown_policy
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A syntactically valid UUID that matches no policy returns ERR_NOT_FOUND (404) at existence priority, before role-specific business checks."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /ins/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 404 with error_id ERR_NOT_FOUND"

      - name: error_endorsement_window_before_term_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENDORSEMENT_WINDOW]"]
        distinguishing_aspect: "An endorsement effective_at earlier than the policy term_start day is rejected even though it is in the past (the lower bound is the policy term, not merely the clock)."
        test_recipe:
          setup: ["ACTIVE CC_C policy with term_start 2026-09-01."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
