            - call: "POST /demands/${dm_a}/offers"
              payload: { carrier_offer_cents: 500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_flat: $.data.error_id }
            - call: "POST /demands/${dm_a}/offers"
              payload: { carrier_offer_cents: 2500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { e_over: $.data.error_id }
            - call: "POST /demands/${dm_a}/offers"
