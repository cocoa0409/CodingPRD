          - errors[ERR_DOC_REQUEST_LIMIT_EXCEEDED]
          - calculations.documentation_budget
        distinguishing_aspect: |
          A single request violates a business_safety rule (priority 52,
          ERR_MEDICAL_SCOPE_OVERBROAD) and a business_constraint rule
          (priority 62, ERR_DOC_REQUEST_LIMIT_EXCEEDED) at once and the safety
          error must win; the category pair is business_safety x
          business_constraint, different from the pairs used by the two
          sibling instances.
