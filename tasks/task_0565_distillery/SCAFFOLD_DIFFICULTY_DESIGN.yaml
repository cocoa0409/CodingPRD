  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: bottling_start_state_beats_label_referential
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.BottlingRun.SCHEDULED_to_BOTTLING
        distinguishing_aspect: "state (priority 6, ERR_INVALID_STATE) vs business_referential (priority 7, ERR_LABEL_NOT_APPROVED): a CANCELLED run with an un-approved label returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A CANCELLED bottling run whose label is only SUBMITTED (never APPROVED)."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-9", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
            - { call: "POST /dsp/mash-batches", payload: { distillery_id: "${dist_id}", grain_bill: "corn", volume_gallons: 200 }, as: ProductionManager, captures: { mb: $.data.id } }
            - { call: "POST /dsp/distillation-runs", payload: { distillery_id: "${dist_id}", mash_batch_id: "${mb}", spirit_type: "WHISKEY", gauge_method: "VOLUME", collected_wine_gallons: 20, collected_proof: 100 }, as: ProductionManager, captures: { run: $.data.id } }
            - { call: "POST /dsp/distillation-runs/${run}/gauge", payload: {}, as: ProductionManager }
            - { call: "POST /dsp/barrels", payload: { distillation_run_id: "${run}", char_level: "CHAR_3", rickhouse_position: "A-1", fill_proof_gallons: 10 }, as: ProductionManager, captures: { barrel: $.data.id } }
            - { call: "POST /dsp/label-applications", payload: { distillery_id: "${dist_id}", brand_name: "Old Bench", spirit_type: "WHISKEY", label_proof: 100, net_contents_ml: 750 }, as: ComplianceOfficer, captures: { label: $.data.id } }
            - { call: "POST /dsp/label-applications/${label}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /dsp/bottling-runs", payload: { barrel_id: "${barrel}", label_application_id: "${label}", line_id: "LINE_A", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", bottle_size_ml: 750, bottles_per_case: 6, planned_cases: 5 }, as: ProductionManager, captures: { br: $.data.id } }
            - { call: "POST /dsp/bottling-runs/${br}/cancel", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /dsp/bottling-runs/${br}/start", payload: {}, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE (not ERR_LABEL_NOT_APPROVED)"
            - "HTTP status == 409"

      - name: tour_confirm_temporal_beats_capacity
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - state_machines.TourBooking.REQUESTED_to_CONFIRMED
        distinguishing_aspect: "business_temporal (priority 12, ERR_TOUR_OVERLAP) vs business_constraint (priority 13, ERR_TOUR_CAPACITY): a tour both within the 30-min buffer and over capacity returns ERR_TOUR_OVERLAP."
        test_recipe:
          setup:
            - "One CONFIRMED tour 10:00-11:00 party 15; a second REQUESTED tour 10:20-11:00 party 10 (within buffer AND over the 20-seat capacity)."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-10", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
