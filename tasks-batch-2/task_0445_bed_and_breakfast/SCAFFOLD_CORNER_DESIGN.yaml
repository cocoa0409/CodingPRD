# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage for non-difficulty tests
# Bed & Breakfast / Boutique Inn (Expert band)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Every name is unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_inn_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Inn, endpoints]
        distinguishing_aspect: "POST /inns with name + lodging_tax_rate_bps returns 201; version==1 and omitted optionals take their declared defaults."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /inns"
              payload: { name: "Harbor Inn", lodging_tax_rate_bps: 1450 }
              as: Innkeeper
              captures: { inn_id: $.data.id, cit: $.data.checkin_time, exp: $.data.gift_cert_expiry_days, turn: $.data.turnover_minutes, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Inn.${inn_id}.checkin_time == '15:00'"
            - "Inn.${inn_id}.checkout_time == '11:00'"
            - "Inn.${inn_id}.gift_cert_expiry_days == 365"
            - "Inn.${inn_id}.turnover_minutes == 180"
            - "Inn.${inn_id}.version == 1"

      - name: get_room_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Room, endpoints]
        distinguishing_aspect: "GET /inns/{inn_id}/rooms/{room_id} returns the same field values supplied at creation."
        test_recipe:
          setup: ["Inn with one Room base 12345."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "A Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "R1", base_rate_cents: 12345, max_occupancy: 4 }
              as: Innkeeper
              captures: { room_id: $.data.id }
          trigger:
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Guest
              as_user_id: "anon-guest"
              captures: { br: $.data.base_rate_cents, mo: $.data.max_occupancy }
          assert:
            - "Room.${room_id}.base_rate_cents == 12345"
            - "Room.${room_id}.max_occupancy == 4"
            - "Room.${room_id}.status == ACTIVE"

      - name: list_rooms_paginated_envelope
        claim_type: Listing
        grounds: [entities.Room, endpoints]
        distinguishing_aspect: "GET /inns/{inn_id}/rooms returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Inn with two rooms."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "B Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "R1", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "R2", base_rate_cents: 11000, max_occupancy: 2 }
              as: Innkeeper
          trigger:
            - call: "GET /inns/${inn_id}/rooms?limit=1&offset=0"
              as: Innkeeper
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "has_more == true"

      - name: get_room_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Room
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent room UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Inn with no rooms."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "C Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
          trigger:
            - call: "GET /inns/${inn_id}/rooms/00000000-0000-4000-8000-000000000000"
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_room_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Room
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /inns/{inn_id}/rooms omitting base_rate_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Inn exists."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "D Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "NoRate", max_occupancy: 2 }
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: room_default_is_taxable_true
        claim_type: Defaults
        grounds: [entities.Room.fields.is_taxable]
        distinguishing_aspect: "Omitting is_taxable on room create applies the declared default true."
        test_recipe:
          setup: ["Inn exists."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "E Inn", lodging_tax_rate_bps: 1000 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "Def", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { tx: $.data.is_taxable }
          assert:
            - "Room.is_taxable == true"

      - name: booking_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.nights, entities.Booking.fields.total_cents]
        distinguishing_aspect: "Booking nights/room_charge/total are server-computed; the client cannot set them and they reflect the formula."
        test_recipe:
          setup: ["Inn tax 0; Room base 10000."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "F Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "T G", email: "tg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-13", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id, n: $.data.nights, rc: $.data.room_charge_cents }
          assert:
            - "Booking.${bk_id}.nights == 3"
            - "Booking.${bk_id}.room_charge_cents == 30000"
            - "Booking.${bk_id}.total_cents == 30000"

      - name: booking_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Booking.fields.reservation_status, entities.Booking.fields.payment_status]
        distinguishing_aspect: "New booking starts reservation_status PENDING, payment_status UNPAID, version 1 regardless of input."
        test_recipe:
          setup: ["Inn tax 0; Room base 10000."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "H Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "U G", email: "ug@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.reservation_status == PENDING"
            - "Booking.${bk_id}.payment_status == UNPAID"
            - "Booking.${bk_id}.version == 1"

      - name: booking_invalid_channel_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Booking.fields.channel
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A channel value outside {DIRECT, OTA} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Inn tax 0; Room base 10000."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "I Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "V G", email: "vg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
          trigger:
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "WALKIN", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: payment_ledger_entry_immutable_no_version
        claim_type: Immutability
        grounds: [entities.PaymentLedgerEntry]
        distinguishing_aspect: "PaymentLedgerEntry is common_fields:false (append-only): it carries only id and created_at, no version, and has no update endpoint."
        test_recipe:
          setup: ["A booking with at least one DEPOSIT/REDEMPTION ledger entry."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "J Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "W G", email: "wg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
          trigger:
            - call: "GET /inns/${inn_id}/bookings/${bk_id}/ledger"
              as: FinanceManager
              captures: { kind0: "$.data[0].source_kind" }
          assert:
            - "ledger array length == 1"
            - "PaymentLedgerEntry[0].source_kind == REDEMPTION"
            - "PaymentLedgerEntry[0].amount_cents == 10000"

      - name: booking_cross_inn_room_reference_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Booking.fields.room_id
          - validations[priority=40]
          - errors[ERR_CROSS_INN_REFERENCE]
        distinguishing_aspect: "A booking whose room_id belongs to a different inn than the path inn_id returns ERR_CROSS_INN_REFERENCE."
        test_recipe:
          setup: ["Two inns; room created under inn A; booking attempted under inn B referencing A's room."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "Inn A", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_a: $.data.id }
            - call: "POST /inns"
              payload: { name: "Inn B", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_b: $.data.id }
            - call: "POST /inns/${inn_a}/rooms"
              payload: { inn_id: "${inn_a}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_a: $.data.id }
            - call: "POST /inns/${inn_b}/guests"
              payload: { inn_id: "${inn_b}", full_name: "X G", email: "xg@x.com" }
              as: Innkeeper
              captures: { guest_b: $.data.id }
          trigger:
            - call: "POST /inns/${inn_b}/bookings"
              payload: { inn_id: "${inn_b}", room_id: "${room_a}", guest_id: "${guest_b}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CROSS_INN_REFERENCE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Booking.PENDING_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a booking already in CANCELLED fails ERR_INVALID_STATE; no second refund/ledger entry fires."
        test_recipe:
          setup: ["A PENDING booking cancelled once."]
          setup_api_calls:
            - call: "POST /inns"
              payload: { name: "K Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Y G", email: "yg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-05-10", checkout_date: "2026-05-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.reservation_status == CANCELLED"

      - name: terminal_checked_out_blocks_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Booking.CHECKED_IN_to_CHECKED_OUT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CHECKED_OUT booking rejects cancel with ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["A booking taken full lifecycle to CHECKED_OUT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "L Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Z G", email: "zg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-06-10", checkout_date: "2026-06-12", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T16:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/check-in"
              payload: {}
              as: Innkeeper
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T11:00:00Z" }
              as: Innkeeper
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/check-out"
              payload: {}
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/cancel"
              payload: {}
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.reservation_status == CHECKED_OUT"

      - name: no_show_before_checkin_passes_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Booking.CONFIRMED_to_NO_SHOW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "mark-no-show before the arrival night has passed (clock <= checkin_date) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A CONFIRMED booking, clock still before checkin_date."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "M Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Aa G", email: "aag@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-06-20", checkout_date: "2026-06-22", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
              as: Innkeeper
              captures: { room_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/confirm"
              payload: { expected_room_version: "${room_v}" }
              as: Innkeeper
          trigger:
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/mark-no-show"
              payload: {}
              as: Innkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.reservation_status == CONFIRMED"

      - name: no_show_forfeits_deposit_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.Booking.CONFIRMED_to_NO_SHOW, entities.Booking.fields.payment_status]
        distinguishing_aspect: "mark-no-show after the arrival night passes sets payment_status FORFEITED, refund_cents 0, and appends a FORFEIT ledger entry."
        test_recipe:
          setup: ["A CONFIRMED booking; clock advanced past checkin_date."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Innkeeper
            - call: "POST /inns"
              payload: { name: "N Inn", lodging_tax_rate_bps: 0 }
              as: Innkeeper
              captures: { inn_id: $.data.id }
            - call: "POST /inns/${inn_id}/rooms"
              payload: { inn_id: "${inn_id}", name: "G", base_rate_cents: 10000, max_occupancy: 2 }
              as: Innkeeper
              captures: { room_id: $.data.id }
            - call: "POST /inns/${inn_id}/guests"
              payload: { inn_id: "${inn_id}", full_name: "Bb G", email: "bbg@x.com" }
              as: Innkeeper
              captures: { guest_id: $.data.id }
            - call: "POST /inns/${inn_id}/bookings"
              payload: { inn_id: "${inn_id}", room_id: "${room_id}", guest_id: "${guest_id}", channel: "DIRECT", checkin_date: "2026-06-20", checkout_date: "2026-06-22", guest_count: 1 }
              as: Innkeeper
              captures: { bk_id: $.data.id }
            - call: "POST /inns/${inn_id}/gift-certificates"
              payload: { inn_id: "${inn_id}", face_value_cents: 20000 }
              as: FinanceManager
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /inns/${inn_id}/bookings/${bk_id}/redeem-gift"
              payload: { gift_certificate_id: "${gc_id}", amount_cents: 10000, expected_gift_certificate_version: "${gc_v}" }
              as: Innkeeper
            - call: "GET /inns/${inn_id}/rooms/${room_id}"
