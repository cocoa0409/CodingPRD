              as: PhoneVolunteer
              captures: { p_id: $.data.id }
            - call: "POST /station/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T18:05:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /station/pledges/${p_id}/write-off"
              payload: { reason: "no response" }
              as: MembershipCoordinator
              captures: { err_code: $.data.error_id }
          assert:
            - "${err_code} == ERR_WRITEOFF_WINDOW (59 days elapsed < 60 required)"
            - "Pledge.${p_id}.payment_status remains PLEDGED"

      - name: payment_exceeding_remaining_balance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PAYMENT_AMOUNT]"]
        distinguishing_aspect: "A payment larger than the remaining balance on a ONE_TIME pledge is rejected with ERR_PAYMENT_AMOUNT (fiscal guard, priority 10)."
        test_recipe:
          setup: ["Level BASIC; donor D; membership M; drive ON_AIR; pledge 6000 PLEDGED"]
