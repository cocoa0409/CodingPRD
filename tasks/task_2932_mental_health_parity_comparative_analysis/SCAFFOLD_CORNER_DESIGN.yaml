  - section: errors
    instances:
      - name: blank_or_unknown_identity_headers_rejected
        claim_type: Error Triggerability
        grounds:
          - validations.priority_1_ERR_MISSING_IDENTITY_HEADERS
          - validations.priority_2_ERR_UNKNOWN_ROLE
          - errors.ERR_MISSING_IDENTITY_HEADERS
          - errors.ERR_UNKNOWN_ROLE
        distinguishing_aspect: "Identity is checked before anything else and an empty string counts as absent, so a blank X-User-ID is a 401 rather than a 422 — and a syntactically fine but undeclared role is a different 401 code again."
        test_recipe:
          setup:
            - "No data at all is required; these guards precede routing and body parsing."
          setup_api_calls: []
          trigger:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example" }
              as: PlanSponsor
              as_user_id: ""
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example" }
              as: PlanAdministrator
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years"
              payload: {}
              as: PlanAdministrator
              as_user_id: "user-sponsor-01"
          assert:
            - "the blank X-User-ID call -> 401 with data.error_id == ERR_MISSING_IDENTITY_HEADERS (sent as \"\", not as spaces and not omitted)"
            - "omitting the X-User-Role header entirely -> the same 401 ERR_MISSING_IDENTITY_HEADERS"
            - "the undeclared role PlanAdministrator -> 401 with data.error_id == ERR_UNKNOWN_ROLE, not 403"
            - "the same undeclared role on a read-only endpoint -> 401 ERR_UNKNOWN_ROLE (the guard is not endpoint-specific)"
            - "no Administrator row is created by any of these calls"

      - name: reviewing_an_analysis_that_never_reached_submitted_rejected
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_ANALYSIS_NOT_SUBMITTED
          - validations.priority_16_ERR_ANALYSIS_NOT_DRAFT
          - state_machines.ComparativeAnalysis.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: "The review endpoint emits its own transition-specific code: a DRAFT analysis yields ERR_ANALYSIS_NOT_SUBMITTED, distinct from the ERR_ANALYSIS_NOT_DRAFT that submit emits and from the ERR_ANALYSIS_NOT_INSUFFICIENT that reopen emits."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NqtlItem, one DRAFT ComparativeAnalysis."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "INPATIENT", network_tier: "IN_NETWORK", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "CONCURRENT_REVIEW", applied_to: "BOTH", description: "Concurrent review for inpatient admissions." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "COMPARABLE", stringency_operation_finding: "COMPARABLE", expected_nqtl_item_version: "${item_v}" }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
              payload: { outcome: "CERTIFIED", review_note: "Reviewing a draft that was never submitted." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
            - call: "POST /parity/comparative-analyses/${ca_id}/reopen"
              payload: {}
              as: Administrator
              as_user_id: "${adm_id}"
          assert:
            - "the review -> 409 with data.error_id == ERR_ANALYSIS_NOT_SUBMITTED"
            - "the reopen -> 409 with data.error_id == ERR_ANALYSIS_NOT_INSUFFICIENT"
            - "ComparativeAnalysis.${ca_id}.status is still DRAFT, certified_by_user_id == null and revision_round == 0"
            - "ComparativeAnalysis.${ca_id}.authored_by_user_id == ${adm_id} (an Administrator may author on the sponsor's behalf)"
            - "NqtlItem.${item_id}.status == ANALYSIS_DRAFTED (set by the create, not by the refused calls)"
            - "the classification was created with sub_classification defaulted to NONE, which is required for INPATIENT"

      - name: deciding_twice_on_the_same_corrective_plan_rejected
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_CAP_NOT_DRAFT
          - state_machines.CorrectiveActionPlan.DRAFT_to_APPROVED
          - validations.priority_16_ERR_ANALYSIS_NOT_DRAFT
        distinguishing_aspect: "A second decision on an APPROVED plan is refused with the plan-specific ERR_CAP_NOT_DRAFT and, critically, the plan year's liability is not double-counted."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear (cap 5000000), one classification."
            - "One PRIOR_AUTHORIZATION NqtlItem applied_to MENTAL_HEALTH_SUD_ONLY in VIOLATION (300/1000 vs 100/1000, index 10.00) determined by user-officer-01."
            - "One PROCESS_CHANGE plan 880 x 3125 -> 275000 cents, APPROVED by user-officer-02."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization imposed on MH/SUD outpatient visits only." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v: $.data.version }
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "MH/SUD-only prior authorization denies at three times the medical/surgical rate.", expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/corrective-action-plans"
              payload: { nqtl_item_id: "${item_id}", remedy_type: "PROCESS_CHANGE", affected_claims_count: 880, average_claim_cents: 3125, target_completion_date: "2026-12-31" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cap_id: $.data.id }
            - call: "POST /parity/corrective-action-plans/${cap_id}/decision"
              payload: { outcome: "APPROVED", decision_note: "Approved by an officer other than the determiner." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
          trigger:
            - call: "POST /parity/corrective-action-plans/${cap_id}/decision"
              payload: { outcome: "REJECTED", decision_note: "Trying to reverse an approval through a second decision." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
          assert:
            - "409 with data.error_id == ERR_CAP_NOT_DRAFT"
            - "CorrectiveActionPlan.${cap_id}.status is still APPROVED and approved_by_user_id == user-officer-02"
            - "PlanYear.${py_id}.remediation_liability_cents == 275000 exactly (not 550000 — the refused decision adds nothing)"
            - "PlanYear.${py_id}.open_violation_count == 1, compliance_posture == VIOLATION, status == REMEDIATION"
            - "NqtlItem.${item_id}.status == VIOLATION"

      - name: breach_declared_request_blocks_production_and_further_escalation_rejected
        claim_type: Error Triggerability
        grounds:
          - errors.ERR_PRODUCTION_WINDOW_CLOSED
          - errors.ERR_ESCALATION_ALREADY_DECLARED
          - state_machines.VendorDataRequest.NOTICE_SENT_to_BREACH_DECLARED
        distinguishing_aspect: "BREACH_DECLARED is terminal on the escalation dimension and simultaneously closes the production dimension: a third escalate and a late submission fail with two different codes on the same request."
        test_recipe:
          setup:
            - "One Administrator (contractual_production_days 45), one OPEN PlanYear, one classification."
            - "One vendor request issued at 2026-08-01 (due_at 2026-09-15) escalated to BREACH_DECLARED at clock 2026-09-23 (past due_at + 7 days)."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-23T00:00:00.000Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          trigger:
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 137, mh_adjudicated_claims: 1919, ms_denials: 71, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
          assert:
            - "the two setup escalate calls moved escalation_status NONE -> NOTICE_SENT -> BREACH_DECLARED at the same clock reading"
            - "the third escalate -> 409 with data.error_id == ERR_ESCALATION_ALREADY_DECLARED"
            - "the submission -> 409 with data.error_id == ERR_PRODUCTION_WINDOW_CLOSED"
            - "VendorDataRequest.${vr_id}.fulfillment_status is still OPEN and validated_submission_count == 0"
            - "Administrator.${adm_id}.breach_count == 1, late_request_count == 1, cooperation_score == 60.00 and cooperation_status == DELINQUENT"
            - "PlanYear.${py_id}.compliance_posture == AT_RISK (ladder clause 2 via the delinquent vendor) and status == OPEN"

  # ===========================================================================
  # 7. From Table 7 (RBAC)
  # ===========================================================================
  - section: rbac
    instances:
      - name: regulator_cannot_author_plan_data
        claim_type: Exclusive Operation Denied
        grounds:
          - roles.Regulator.exclusive_operations
          - roles.PlanSponsor.exclusive_operations
          - validations.priority_3_ERR_UNAUTHORIZED
        distinguishing_aspect: "The Regulator has read access to every collection yet is barred from every authoring endpoint, and the 403 is returned before any body FK or state check runs."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear and one classification created by the sponsor."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
          trigger:
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Regulator-authored plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "INSURED", covered_participant_count: 900, remediation_liability_cap_cents: 1000000 }
              as: Regulator
              as_user_id: "user-regulator-01"
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Regulator attempting to inventory an NQTL." }
              as: Regulator
              as_user_id: "user-regulator-01"
            - call: "POST /parity/classifications/${cls_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 20, projected_plan_payments_cents: 2000000, projected_claims_count: 400 }
              as: Regulator
              as_user_id: "user-regulator-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: Regulator
              as_user_id: "user-regulator-01"
          assert:
            - "all three write attempts -> 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the read -> 200 (every GET is a shared operation for all four roles)"
            - "GET /parity/plan-years returns total_count == 1 — the regulator's plan year was never created"
            - "GET /parity/nqtl-items?plan_year_id=${py_id} returns total_count == 0"

      - name: administrator_cannot_determine_or_open_a_regulator_request
        claim_type: Exclusive Operation Denied
        grounds:
          - roles.Administrator.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.Regulator.exclusive_operations
        distinguishing_aspect: "The TPA may author and submit analyses, yet the officer-only determination endpoint, the sponsor/officer corrective-plan create and the regulator-only request endpoint are all closed to it — three different owners, one caller."
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NqtlItem."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "BOTH", description: "Prior authorization for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { py_v: $.data.version }
          trigger:
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "COMPLIANT", rationale: "The TPA attempting to certify its own administration as compliant.", expected_plan_year_version: "${py_v}" }
              as: Administrator
              as_user_id: "${adm_id}"
            - call: "POST /parity/corrective-action-plans"
              payload: { nqtl_item_id: "${item_id}", remedy_type: "PROCESS_CHANGE", affected_claims_count: 880, average_claim_cents: 3125, target_completion_date: "2026-12-31" }
              as: Administrator
              as_user_id: "${adm_id}"
            - call: "POST /parity/regulator-requests"
              payload: { plan_year_id: "${py_id}", requested_nqtl_types: ["PRIOR_AUTHORIZATION"], request_reference: "SELF-SERVED-0001" }
              as: Administrator
              as_user_id: "${adm_id}"
          assert:
