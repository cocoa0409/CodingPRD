# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Internet / Broadband Service Provisioning — Expert band
# Breadth probe across the claim-extraction-guide's nine sections. Every active
# instance's setup_api_calls drives empty-DB -> precondition with §1.5 endpoints
# only; numeric asserts are literals; OCC versions are ${var}s. excluded_because
# stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Account, 'endpoints["POST /accounts"]']
        distinguishing_aspect: "POST /accounts with all required fields returns 201; response carries server-minted id, version==1, status==PENDING, service_state==PROVISIONING."
        test_recipe:
          setup:
            - "A ServiceAddress and ServicePlan exist."
          setup_api_calls:
            - call: "POST /service-addresses"
              payload: { line1: "100 A St", postal_code: "10001", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-CREATE", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-create" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id, v: $.data.version, st: $.data.status }
          assert:
            - "HTTP 201"
            - "Account.version == 1"
            - "Account.status == PENDING"
            - "Account.service_state == PROVISIONING"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, 'validations[priority=3]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Account, 'validations[priority=4]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /accounts omitting plan_id returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A ServiceAddress exists."]
          setup_api_calls:
            - call: "POST /service-addresses"
              payload: { line1: "101 A St", postal_code: "10002", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", customer_user_id: "cust-x" }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: computed_credit_balance_reflects_issued_credit
        claim_type: Computed Fields
        grounds: [entities.Account.fields.credit_balance_cents, 'endpoints["POST /accounts/{id}/credits"]']
        distinguishing_aspect: "Account.credit_balance_cents is computed; after a 500-cent GOODWILL credit it reads 500, ignoring any client-sent value."
        test_recipe:
          setup: ["A PENDING account exists."]
          setup_api_calls:
            - call: "POST /service-addresses"
              payload: { line1: "102 A St", postal_code: "10003", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-CB", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-cb" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/credits"
              payload: { amount_cents: 500 }
              as: ProvisioningAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { bal: $.data.credit_balance_cents }
          assert:
            - "Account.credit_balance_cents == 500"

      - name: duplicate_plan_code_rejected
        claim_type: Type Constraints
        grounds: [entities.ServicePlan.fields.code, 'errors[ERR_DUPLICATE_PLAN_CODE]']
        distinguishing_aspect: "Two ServicePlans with the same code: the second returns ERR_DUPLICATE_PLAN_CODE (409)."
        test_recipe:
          setup: ["One ServicePlan with code DUP1 exists."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { code: "DUP1", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
          trigger:
            - call: "POST /service-plans"
              payload: { code: "DUP1", tier: "BASIC", download_mbps: 200, throttled_mbps: 25, monthly_fee_cents: 5000, included_gb: 500, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE_PLAN_CODE"

      - name: duplicate_equipment_serial_rejected
        claim_type: Type Constraints
        grounds: [entities.EquipmentUnit.fields.serial, 'errors[ERR_DUPLICATE_SERIAL]']
        distinguishing_aspect: "Two EquipmentUnits with the same serial: the second returns ERR_DUPLICATE_SERIAL (409)."
        test_recipe:
          setup: ["One EquipmentUnit serial SDUP exists."]
          setup_api_calls:
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "SDUP", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
          trigger:
            - call: "POST /equipment-units"
              payload: { kind: "ROUTER", serial: "SDUP", lease_fee_cents_per_cycle: 1200 }
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_DUPLICATE_SERIAL"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds: [entities.Account, 'endpoints["GET /accounts"]']
        distinguishing_aspect: "GET /accounts returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two accounts exist."]
          setup_api_calls:
            - call: "POST /service-addresses"
              payload: { line1: "103 A St", postal_code: "10004", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-LIST", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-l1" }
              as: ProvisioningAgent
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-l2" }
              as: ProvisioningAgent
          trigger:
            - call: "GET /accounts"
              payload: { service_address_id: "${addr_id}" }
              as: ProvisioningAgent
          assert:
            - "response_type == array"
            - "meta.total_count == 2 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: resume_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Account.SUSPENDED_to_ACTIVE, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Calling resume on an ACTIVE (never-suspended) account returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["An ACTIVE account (self-install activated)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "104 A St", postal_code: "10005", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-RES", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "S-RES", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-res" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
          trigger:
            - call: "POST /accounts/${acct_id}/resume"
              payload: {}
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"
            - "Account.status remains ACTIVE"

      - name: terminal_disconnected_account_cannot_suspend
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Account.ACTIVE_to_SUSPENDED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "A DISCONNECTED (terminal) account rejects suspend with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An account disconnected (terminal DISCONNECTED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "105 A St", postal_code: "10006", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-TERM", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "S-TERM", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-term" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/disconnect"
              payload: { expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
          trigger:
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: ship_kit_on_tech_install_order_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceOrder.DRAFT_to_KIT_SHIPPED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "ship-kit on a TECH_INSTALL order (install_mode != SELF_INSTALL) is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT TECH_INSTALL order on a serviceable address."]
          setup_api_calls:
            - call: "POST /service-addresses"
              payload: { line1: "106 A St", postal_code: "10007", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-SK", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-sk" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_scheduled_order_releases_appointment_and_slot
        claim_type: Side Effect Execution
        grounds: [state_machines.ServiceOrder.SCHEDULED_to_CANCELLED, state_machines.InstallAppointment.BOOKED_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED order cascades its BOOKED appointment to CANCELLED and decrements InstallSlot.booked_count from 1 to 0."
        test_recipe:
          setup: ["A SCHEDULED order with one BOOKED appointment on a capacity-1 slot (slot FULL)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "107 A St", postal_code: "10008", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: false }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-CXL", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Kai", travel_buffer_minutes: 30 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /install-slots"
              payload: { technician_id: "${tech_id}", window_start_iso: "2026-06-02T09:00:00Z", window_end_iso: "2026-06-02T17:00:00Z", capacity: 1 }
              as: Dispatcher
              captures: { slot_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-cxl" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "TECH_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /install-appointments"
              payload: { service_order_id: "${order_id}", install_slot_id: "${slot_id}", start_iso: "2026-06-02T09:00:00Z", end_iso: "2026-06-02T10:00:00Z", expected_account_version: "${acct_v}" }
              as: ProvisioningAgent
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${order_id}/cancel"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /install-appointments/${appt_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { astatus: $.data.status }
            - call: "GET /install-slots/${slot_id}"
              payload: {}
              as: ProvisioningAgent
              captures: { bc: $.data.booked_count, sstatus: $.data.status }
          assert:
            - "InstallAppointment.status == CANCELLED"
            - "InstallSlot.booked_count == 0 and status == OPEN"

      - name: outage_resolve_end_before_start_returns_invalid_request
        claim_type: Precondition Enforcement
        grounds: [state_machines.OutageEvent.OPEN_to_RESOLVED, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "Resolving an outage with ended_at_iso before started_at_iso returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An OPEN outage on an active account's cycle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "108 A St", postal_code: "10009", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-OUT", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "S-OUT", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-out" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
              as: ProvisioningAgent
            - call: "GET /billing-cycles"
              payload: {}
              as: NetworkOps
              captures: { cycle_id: "$.data[0].id" }
            - call: "POST /outage-events"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cycle_id}", started_at_iso: "2026-06-05T06:00:00Z" }
              as: NetworkOps
              captures: { out_id: $.data.id }
          trigger:
            - call: "POST /outage-events/${out_id}/resolve"
              payload: { ended_at_iso: "2026-06-05T05:00:00Z" }
              as: NetworkOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: equipment_lost_reversal_already_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.EquipmentUnit.RETURN_PENDING_to_LOST]
        excluded_because:
          difficulty_instance: compensating_invariant / lease_fee_conserved_under_lost_reversal
          rationale: "The LEASE_PRORATE reversal side effect on mark-lost is asserted by the named §1.8 instance."

      - name: parallel_throttle_dimension_already_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.BillingCycle.UNCAPPED_to_THROTTLED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / billing_cycle_parallel_billing_and_throttle_dimensions
          rationale: "throttle_state flip on usage post is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: outage_below_sla_dismiss_then_no_credit
        claim_type: Input Set Filtering
        grounds: [calculations.outage_credit, state_machines.OutageEvent.RESOLVED_to_DISMISSED]
        distinguishing_aspect: "An outage of 120 minutes (< 240 SLA) is dismissed; it contributes 0 to outage_credit input set, so no AccountCredit is created."
        test_recipe:
          setup: ["A RESOLVED 120-minute outage on an active account's cycle."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkOps
            - call: "POST /service-addresses"
              payload: { line1: "109 A St", postal_code: "10010", coverage_status: "SERVICEABLE", technology: "FIBER", max_serviceable_mbps: 1000, self_install_eligible: true }
              as: ProvisioningAgent
              captures: { addr_id: $.data.id }
            - call: "POST /service-plans"
              payload: { code: "C-DIS", tier: "PLUS", download_mbps: 500, throttled_mbps: 50, monthly_fee_cents: 8999, included_gb: 1000, overage_policy: "BILL", contract_term_months: 0, etf_full_cents: 0 }
              as: ProvisioningAgent
              captures: { plan_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { kind: "MODEM", serial: "S-DIS", lease_fee_cents_per_cycle: 1500 }
              as: ProvisioningAgent
              captures: { unit_id: $.data.id }
            - call: "POST /accounts"
              payload: { service_address_id: "${addr_id}", plan_id: "${plan_id}", customer_user_id: "cust-dis" }
              as: ProvisioningAgent
              captures: { acct_id: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", order_type: "NEW_INSTALL", install_mode: "SELF_INSTALL", requested_plan_id: "${plan_id}" }
              as: ProvisioningAgent
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/ship-kit"
              payload: {}
              as: ProvisioningAgent
            - call: "POST /service-orders/${order_id}/activate"
              payload: {}
