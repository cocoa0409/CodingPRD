        distinguishing_aspect: |
          The second failed round accrues damages from the guarantee deadline: 101 whole days
          elapsed between 2026-10-01 and 2027-01-10 at a daily rate of
          round_half_up(400000000 * 0.0005) == 200000 gives 20200000, which is truncated to the
          LD_CAP_PCT ceiling round_half_up(400000000 * 0.05) == 20000000 - the cap binds because the
