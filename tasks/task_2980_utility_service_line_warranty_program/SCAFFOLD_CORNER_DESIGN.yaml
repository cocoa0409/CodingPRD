              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { err_foreign_link: $.data.error_id }
            - call: "POST /claims/${claim_1}/dispatches"
              payload: { window_start: "2026-09-10T14:00:00.000Z", expected_claim_version: "${claim_1_v3}", contractor_id: "${c_a}", supersedes_dispatch_id: "${d1}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d2: $.data.id, d2_status: $.data.status, d2_supersedes: $.data.supersedes_dispatch_id, d2_deadline: $.data.sla_deadline_at }
            - call: "GET /dispatches/${d1}"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { d1_final_status: $.data.status, d1_final_v: $.data.version, d1_final_reason: $.data.cancellation_reason }
            - call: "GET /claims/${claim_1}"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { claim_1_v4: $.data.version, claim_1_status_4: $.data.status }
            - call: "POST /claims/${claim_1}/dispatches"
              payload: { window_start: "2026-09-10T19:00:00.000Z", expected_claim_version: "${claim_1_v4}", contractor_id: "${c_a}", supersedes_dispatch_id: "${d1}" }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { err_replay: $.data.error_id }
          assert:
            - "${d1_status} == ASSIGNED, ${claim_1_status_3} == DISPATCHED and ${claim_1_v3} == 3"
            - "${err_no_link} == ERR_INVALID_CLAIM_STATE with HTTP 409  # from DISPATCHED the endpoint is closed without supersedes_dispatch_id (priority 20)"
            - "${err_foreign_link} IN {ERR_INVALID_DISPATCH_STATE, ERR_INVALID_CLAIM_STATE} with HTTP 409  # ${d_other} is open but belongs to claim 2; supersede-dispatch-open refuses a link whose claim_id differs from the path claimId, and claim-state-precondition (same priority 20) independently refuses DISPATCHED unless the link names an open dispatch OF THE SAME CLAIM, so the two tied rules both fire and either error_id conforms"
            - "both refusals leave GET /claims/${claim_1} at version 3 and GET /dispatches?claim_id=${claim_1} at total_count 1"
            - "${d2_status} == ASSIGNED, ${d2_supersedes} == ${d1} and ${d2_deadline} == 2026-09-11T08:00:00.000Z with HTTP 201  # reported_at 2026-09-10T08:00Z plus SLA_HOURS[URGENT] 24, inherited unchanged from the claim"
            - "${d1_final_status} == SUPERSEDED with ${d1_final_v} == 2 and ${d1_final_reason} == SUPERSEDED_BY_REDISPATCH, and ${claim_1_status_4} == DISPATCHED with ${claim_1_v4} == 4"
            - "${err_replay} IN {ERR_INVALID_DISPATCH_STATE, ERR_INVALID_CLAIM_STATE} with HTTP 409  # the link now names a SUPERSEDED dispatch, so the unlocking field can no longer unlock anything; the same priority-20 tie applies, and what matters is that no second dispatch is created"
            - "GET /dispatches?claim_id=${claim_1} finally reports total_count 2 (one SUPERSEDED, one ASSIGNED) and GET /contractors/${c_a} reports open_dispatch_count 1  # the supersede released the old slot as it took the new one"

      - name: contractor_registry_supports_create_read_and_a_membership_filtered_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST /contractors
          - endpoints.GET /contractors
          - endpoints.GET /contractors/{contractorId}
          - entities.Contractor.fields.line_types_certified
          - errors.ERR_CONTRACTOR_NOT_FOUND
        distinguishing_aspect: "Contractor is the CRUD surface with a deliberate hole: §1.5 declares create, read and list but NO update or delete, even though the entity carries a version field that only system cascades ever move. The list filter is also not an equality test - line_type matches when the value is a MEMBER of the line_types_certified array - so a contractor certified for two line types must appear under both filters while a single-certification peer appears under only one."
        test_recipe:
          setup:
            - "Three contractors are onboarded: a dual-certified Oregon crew, a sewer-only Oregon crew and a water-only Washington crew."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /contractors"
              payload: { name: "Alder Plumbing", state_code: "OR", license_number: "OR-PL-4411", license_expires_on: "2027-06-30", line_types_certified: ["WATER_SERVICE_LINE", "SEWER_LATERAL"], hourly_rate_cents: 18000, sla_compliance_pct: 92, max_open_dispatches: 5, permit_pull_authorized: true }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_dual: $.data.id, dual_status: $.data.status, dual_v: $.data.version, dual_breaches: $.data.sla_breach_count, dual_open: $.data.open_dispatch_count, dual_created: $.data.created_at }
            - call: "POST /contractors"
              payload: { name: "Ridgeline Sewer", state_code: "OR", license_number: "OR-PL-4412", license_expires_on: "2027-06-30", line_types_certified: ["SEWER_LATERAL"], hourly_rate_cents: 6000, sla_compliance_pct: 70, max_open_dispatches: 3, permit_pull_authorized: false }
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { c_sewer: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Cascade Water Works", state_code: "WA", license_number: "WA-PL-9001", license_expires_on: "2027-12-31", line_types_certified: ["WATER_SERVICE_LINE"], hourly_rate_cents: 9000, sla_compliance_pct: 88, max_open_dispatches: 4, permit_pull_authorized: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { c_wa: $.data.id }
            - call: "GET /contractors/${c_dual}"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { read_name: $.data.name, read_types: $.data.line_types_certified, read_rate: $.data.hourly_rate_cents, read_ceiling: $.data.max_open_dispatches, read_permit: $.data.permit_pull_authorized, read_v: $.data.version }
            - call: "GET /contractors?line_type=WATER_SERVICE_LINE"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { water_first: "$.data[0].id", water_second: "$.data[1].id" }
            - call: "GET /contractors?line_type=SEWER_LATERAL"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { sewer_first: "$.data[0].id", sewer_second: "$.data[1].id" }
            - call: "GET /contractors?state_code=OR&line_type=WATER_SERVICE_LINE&status=ACTIVE"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { or_water_first: "$.data[0].id" }
            - call: "GET /contractors?limit=2&offset=0"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /contractors?limit=2&offset=2"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /contractors/00000000-0000-4000-8000-000000000000"
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { err_missing: $.data.error_id }
          assert:
            - "${dual_status} == ACTIVE, ${dual_v} == 1, ${dual_breaches} == 0 and ${dual_open} == 0 with HTTP 201  # every lifecycle field is system-seeded"
            - "${read_name} == Alder Plumbing, ${read_types} == [WATER_SERVICE_LINE, SEWER_LATERAL], ${read_rate} == 18000, ${read_ceiling} == 5, ${read_permit} == true and ${read_v} == 1  # the read-back is byte-faithful to the create"
            - "${water_first} == ${c_dual} and ${water_second} == ${c_wa} with total_count 2  # membership, not equality: the dual-certified crew matches WATER_SERVICE_LINE and ${c_sewer} is excluded"
            - "${sewer_first} == ${c_dual} and ${sewer_second} == ${c_sewer} with total_count 2  # the same dual-certified crew matches the other filter too"
            - "${or_water_first} == ${c_dual} with total_count 1  # the three filters intersect: ${c_wa} loses on state_code and ${c_sewer} on line_type"
            - "${page1_first} == ${c_dual}, ${page1_second} == ${c_sewer} and ${page2_first} == ${c_wa}, with the first page reporting limit 2, offset 0, total_count 3, has_more true and the second reporting limit 2, offset 2, total_count 3, has_more false  # created_at ASC ordering, and ${dual_created} is the earliest"
            - "${err_missing} == ERR_CONTRACTOR_NOT_FOUND with HTTP 404"
            - "§1.5 declares no PATCH, PUT or DELETE for /contractors/{contractorId}: the registry is append-and-read only, and Contractor.version moves solely through the nightly probation sweep and dispatch counter updates"

      - name: manual_dispatch_is_conditional_on_the_contractor_not_being_on_probation
        claim_type: conditional_action
        grounds:
          - validations.contractor-must-be-active
          - endpoints.POST /claims/{claimId}/dispatches
        excluded_because:
          difficulty_instance: manual_dispatch_requires_contractor_not_on_probation
          rationale: "§1.8 already drives a contractor to PROBATION through two SLA breaches and then shows the same manual dispatch body refused with ERR_CONTRACTOR_NOT_ACTIVE while the automatic selection simply routes around it, which is the conditional-action claim for this gate."
  # ===========================================================================
  # Section 6 - errors
  #
  # Walks §1.6 error-by-error. Triggers already asserted by §1.8 appear as
  # excluded_because stubs at the end of this section. Ordering claims from the
  # §1.4 priority ladder (which error wins when two conditions hold at once)
  # carry claim_type priority_ordering.
  # ===========================================================================
  - section: errors
    instances:

      - name: err_unauthenticated_blank_header_outranks_the_role_check
        claim_type: priority_ordering
        grounds:
          - validations.authentication-required
          - validations.role-permitted
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request that is BOTH unauthenticated and sent under a forbidden role must return ERR_UNAUTHENTICATED (401), never ERR_UNAUTHORIZED - priority 1 is evaluated before priority 2. A header present but blank counts as absent."
        test_recipe:
          setup:
            - "One UtilityPartner in ONBOARDING exists; the clock is pinned to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
          trigger:
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "No header at all.", expected_partner_version: "${partner_v1}" }
              as: MarketingOps
              as_user_id: null
              captures: { err_missing: $.data.error_id }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Header present but empty string." , expected_partner_version: "${partner_v1}" }
              as: MarketingOps
              as_user_id: ""
              captures: { err_blank: $.data.error_id }
            - call: "GET /partners/${partner_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: ""
              captures: { err_get: $.data.error_id }
          assert:
            - "${err_missing} == ERR_UNAUTHENTICATED with HTTP 401  # NOT ERR_UNAUTHORIZED, although MarketingOps is not in the roles list"
            - "${err_blank} == ERR_UNAUTHENTICATED with HTTP 401  # the empty string \"\" is treated as no identity, not as a user id"
            - "${err_get} == ERR_UNAUTHENTICATED with HTTP 401  # reads are authenticated too"
            - "the error envelope carries response_type error, error_id, message and meta.api_request_id"
            - "GET /partners/${partner_id} as PlatformAdmin with X-User-ID pa-001 still reports version 1  # none of the rejected calls mutated the partner"

      - name: err_unauthorized_role_outranks_path_existence
        claim_type: priority_ordering
        grounds:
          - validations.role-permitted
          - validations.path-resource-exists
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "A forbidden role aimed at an id that does not exist must return ERR_UNAUTHORIZED (403), not a 404: priority 2 is checked before priority 5, so the API never confirms whether the resource exists to a caller who may not act on it."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /claims/00000000-0000-4000-8000-000000000000/triage-decision"
              payload: { decision: "APPROVE", coverage_note: "Wrong role, unknown claim." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { err_role_404: $.data.error_id }
            - call: "GET /regulator-complaints/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { err_read_scope: $.data.error_id }
            - call: "GET /claims"
              payload: { limit: 5000 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { err_role_before_pagination: $.data.error_id }
          assert:
            - "${err_role_404} == ERR_UNAUTHORIZED with HTTP 403  # NOT ERR_CLAIM_NOT_FOUND"
            - "${err_read_scope} == ERR_UNAUTHORIZED with HTTP 403  # CustomerServiceRep's shared read scope explicitly excludes the regulator-complaint reads"
            - "${err_role_before_pagination} == ERR_UNAUTHORIZED with HTTP 403  # priority 2 also outranks the priority-4 pagination bound, so the out-of-range limit is never reported"

      - name: err_schema_violation_outranks_path_and_body_existence
        claim_type: priority_ordering
        grounds:
          - validations.request-body-schema
          - validations.path-resource-exists
          - validations.body-foreign-key-exists
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A body that is malformed AND names ids that do not exist must return ERR_INVALID_REQUEST (400) from priority 3 - the priority-5 and priority-6 existence checks never run, so a schema bug can never masquerade as a 404."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /claims"
              payload: { enrollment_id: "00000000-0000-4000-8000-000000000000", line_type: "WATER_SERVICE_LINE", defect_location: "CURB_STOP_TO_METER", incident_description: "urgency omitted on purpose." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { err_missing_field: $.data.error_id }
            - call: "POST /claims"
              payload: { enrollment_id: "00000000-0000-4000-8000-000000000000", line_type: "WATER_MAIN", defect_location: "CURB_STOP_TO_METER", urgency: "ROUTINE", incident_description: "line_type is not a member of the declared enum." }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { err_bad_enum: $.data.error_id }
            - call: "POST /premises"
              payload: { partner_id: "00000000-0000-4000-8000-000000000000", street_address: "18 Alder Court", state_code: "OREGON", owned_segments: ["WATER_CURB_STOP_TO_HOME"] }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { err_bad_state_code: $.data.error_id }
          assert:
            - "${err_missing_field} == ERR_INVALID_REQUEST with HTTP 400  # NOT ERR_ENROLLMENT_NOT_FOUND"
            - "${err_bad_enum} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_bad_state_code} == ERR_INVALID_REQUEST with HTTP 400  # state_code must be exactly 2 uppercase A-Z characters; NOT ERR_PARTNER_NOT_FOUND"

      - name: err_every_path_collection_returns_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations.path-resource-exists
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_PREMISES_NOT_FOUND]
          - errors[ERR_CAMPAIGN_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_CONTRACTOR_NOT_FOUND]
          - errors[ERR_DISPATCH_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
        distinguishing_aspect: "Each of the nine remaining path collections must map the SAME non-existent UUID to its OWN error_id - a single shared ERR_NOT_FOUND, or one collection borrowing another's code, fails this."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to 2026-08-01T00:00:00.000Z. The caller is PlatformAdmin, who is permitted on every GET, so priority 2 cannot pre-empt priority 5."
          setup_api_calls:
