      - name: dispatch_empty_route_rejected
        claim_type: conditional_action
        grounds: [state_machines.DeliveryRoute.PLAN_to_DISPATCHED, "errors[ERR_ROUTE_EMPTY]"]
        distinguishing_aspect: "Dispatching a route with zero stops fails with ERR_ROUTE_EMPTY (422)."
        test_recipe:
          setup: ["PLAN route, no stops"]
          setup_api_calls:
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-10T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 40 }
