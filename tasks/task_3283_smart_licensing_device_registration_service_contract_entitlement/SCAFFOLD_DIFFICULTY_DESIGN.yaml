              payload: { virtual_account_id: "${va_id}", sku: "LIC-18", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 10 }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-18", product_family: "PF-18" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/license-assignments"
              payload: { device_id: "${dev_id}", license_pool_id: "${pool_id}", quantity: 4 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/devices/${dev_id}/deregister"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { consumed_mid: $.data.consumed_quantity }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/license-assignments"
              payload: { device_id: "${dev_id}", license_pool_id: "${pool_id}", quantity: 4 }
              as: PlatformAdmin
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { consumed_final: $.data.consumed_quantity }
          assert:
            - "consumed_mid == 0 (all assignments released by deregister)"
            - "consumed_final == 4 (restored exactly; no drift)"
            - "LicensePool.${pool_id}.compliance_state == COMPLIANT throughout"








