  # =====================================================================
  # RULE 3 — non_linear_state_machine
  # Three instances with different non-linearity kinds: a cyclic rework
  # loop with a path-dependent counter, a cyclic resubmission loop whose
  # second pass recomputes a derived field from corrected inputs, and a
  # pair of genuinely independent state dimensions on one entity.
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_rework_cycle_twice_retains_reviewer_and_increments_rework_count
        grounds:
          - state_machines.Claim.EVIDENCE_DEVELOPMENT_to_PEER_REVIEW
          - state_machines.Claim.PEER_REVIEW_to_EVIDENCE_DEVELOPMENT
          - entities.Claim.fields.rework_count
          - entities.Claim.fields.peer_reviewed_by_representative_id
          - calculations.evidence_completeness_pct
        distinguishing_aspect: |
          CYCLIC non-linearity: the claim visits EVIDENCE_DEVELOPMENT three times and the visits are not
          interchangeable — on the first visit rework_count is 0 and peer_reviewed_by_representative_id is
          null, after two RETURN_FOR_REWORK loops rework_count is 2 and peer_reviewed_by_representative_id
          is still rep_b, so the state alone does not determine the row.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z throughout, so every evidence item is received on time."
            - "rep_a ACTIVE COUNTY_CVSO preparer, rep_b ACTIVE VSO_ORG reviewer."
            - "Veteran vet discharge VERIFIED, intake_status SCREENED, ACTIVE PowerOfAttorney designating rep_a."
            - "Claim claim_c with TWO conditions holding a received SERVICE_TREATMENT_RECORD, DBQ and PRIVATE_MEDICAL, so evidence_completeness_pct is 71.43 - below the 80.00 ready threshold, which is why the reviewer keeps returning it."
            - "One SUBMIT_FOR_REVIEW / RETURN_FOR_REWORK loop has already completed, leaving rework_count 1 and status EVIDENCE_DEVELOPMENT."
            - "A second SUBMIT_FOR_REVIEW has moved the claim back to PEER_REVIEW."
