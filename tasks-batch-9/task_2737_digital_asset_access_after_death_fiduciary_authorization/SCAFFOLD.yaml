  # ---- DispositionElection -------------------------------------------------
  - method: POST
    path: /digital-assets/{asset_id}/disposition-elections
    description: >-
      Elects memorialization, deletion or transfer for one asset. A DELETE election is created in
      PENDING_COUNTERSIGN and needs a second fiduciary; the other two are created in DRAFT.
      Creating an election supersedes the asset's prior non-terminal election. Guarded by OCC on
      the asset's version.
    roles: [Fiduciary]
    input: [election, expected_asset_version, "beneficiary_designation_id?", "election_note?"]
    output: DispositionElection
    success_code: 201
    side_effects:
      - "elected_by_fiduciary_id set from X-User-ID"
      - "status set to PENDING_COUNTERSIGN for DELETE, DRAFT otherwise"
      - "any prior DispositionElection on the asset in DRAFT, PENDING_COUNTERSIGN or SUBMITTED becomes SUPERSEDED, and a superseded SUBMITTED election returns the asset to disposition_status PENDING"
      - "increments DigitalAsset.version by 1"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ASSET_NOT_FOUND
      - ERR_DESIGNATION_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_STALE_ASSET_VERSION
      - ERR_ESTATE_CLOSED
      - ERR_NO_ACTIVE_AUTHORITY
      - ERR_ASSET_NOT_TRANSFERABLE
      - ERR_DISPOSITION_UNSUPPORTED
      - ERR_BENEFICIARY_REQUIRED

  - method: GET
    path: /disposition-elections/{election_id}
    description: "Reads one disposition election, including who elected and who countersigned it."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: []
    output: DispositionElection
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_ELECTION_NOT_FOUND]

  - method: GET
    path: /disposition-elections
    description: >-
      Lists disposition elections, filterable by asset, beneficiary, electing fiduciary and
      countersigning fiduciary.
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: ["asset_id?", "beneficiary_designation_id?", "elected_by_fiduciary_id?", "countersigned_by_fiduciary_id?", "election?", "status?", "limit?", "offset?"]
    output: DispositionElection[]
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /disposition-elections/{election_id}/transitions
    description: >-
      Drives the election's fork-join lifecycle. Fiduciary owns COUNTERSIGN and SUBMIT;
      PlatformCompliance owns EXECUTE, REJECT and REVERSE. EXECUTE's side effects differ per
      election and REVERSE compensates them exactly.
    roles: [Fiduciary, PlatformCompliance]
    input: [action, "attestation?", "platform_confirmation_reference?", "reason?"]
    output: DispositionElection
    success_code: 200
    side_effects:
      - "COUNTERSIGN: sets countersigned_by_fiduciary_id (must differ from elected_by_fiduciary_id) and moves PENDING_COUNTERSIGN -> DRAFT"
      - "SUBMIT: DigitalAsset.disposition_status -> ELECTED; Estate counters recomputed"
      - "EXECUTE MEMORIALIZE: asset -> EXECUTED, no value moves"
      - "EXECUTE DELETE: asset -> PURGED (irreversible), no value moves"
      - "EXECUTE TRANSFER: distributed_value_cents = asset.appraised_value_cents, BeneficiaryDesignation.received_value_cents += that amount, Estate.undistributed_value_cents -= that amount, asset -> EXECUTED"
      - "REJECT: asset returns to PENDING"
      - "REVERSE: exact compensation of the EXECUTE effects, asset returns to PENDING, distributed_value_cents reset to 0"
      - "Estate.assets_disposed_count / assets_pending_disposition_count recomputed and administration_phase re-derived after every terminal move"
      - "increments the version of every mutated row by 1"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ACTION_ROLE_MISMATCH
      - ERR_ELECTION_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_PLATFORM_SCOPE_MISMATCH
      - ERR_ESTATE_CLOSED
      - ERR_INVALID_ELECTION_STATE
      - ERR_LETTERS_NOT_ISSUED
      - ERR_PLATFORM_SUSPENDED
      - ERR_NO_ACTIVE_AUTHORITY
      - ERR_COUNTERSIGN_REQUIRED
      - ERR_SEGREGATION_OF_DUTIES
      - ERR_VALUATION_REQUIRED
      - ERR_DISTRIBUTION_POOL_EXHAUSTED
      - ERR_BENEFICIARY_ALLOCATION_EXCEEDED

