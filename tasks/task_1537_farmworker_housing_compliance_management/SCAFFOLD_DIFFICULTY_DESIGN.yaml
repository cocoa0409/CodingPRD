# =============================================================================
# Section 1.8: Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: proration_calendar_vs_weekly_slot_divergence
        grounds:
          - calculations.prorated_rent_charge
          - entities.HousingUnit.fields.unit_type
          - entities.Tenancy.fields.balance_cents
        distinguishing_aspect: |
          Dual-variant proration on the Tenancy/rent domain: identical move-in
          date (2026-08-11) produces balance 60968 on a FAMILY_UNIT (calendar_day)
          but 42924 on a SEASONAL_DORM (weekly_slot) — the weekly_slot variant
          bills 3 whole weekly slots of 14308 cents instead of the calendar
          counterfactual 42000.
        test_recipe:
          setup:
            - "Site OPEN with an ACTIVE season window [2026-08-01, 2026-11-30]"
            - "Unit F1: FAMILY_UNIT, monthly_rent_cents 90000, max_occupancy 4, CERTIFIED"
            - "Unit D1: SEASONAL_DORM, monthly_rent_cents 62000, max_occupancy 8, CERTIFIED"
            - "Household HF (income 6000000, 2 members) and HD (income 6000000, 2 members), both ELIGIBLE"
            - "Tenancy TF on F1 and TD on D1, both PENDING_MOVE_IN with move_in_date 2026-08-11"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site P", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "F1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { uf_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${uf_id}" }, as: ComplianceInspector, captures: { cf_id: $.data.id } }
            - { call: "PUT /unit-certifications/${cf_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${cf_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "D1", unit_type: "SEASONAL_DORM", max_occupancy: 8, monthly_rent_cents: 62000 }, as: OperatorAdmin, captures: { ud_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${ud_id}" }, as: ComplianceInspector, captures: { cd_id: $.data.id } }
            - { call: "PUT /unit-certifications/${cd_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${cd_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "2026 Harvest", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin, captures: { win_id: $.data.id } }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam A", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hf_id: $.data.id } }
            - { call: "PUT /households/${hf_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hf_id}", full_name: "A One", date_of_birth: "1980-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hf_id}", full_name: "A Two", date_of_birth: "1985-05-05", relationship: "SPOUSE" }, as: IntakeCoordinator }
            - { call: "POST /households", payload: { head_of_household_name: "Fam B", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hd_id: $.data.id } }
            - { call: "PUT /households/${hd_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hd_id}", full_name: "B One", date_of_birth: "1979-03-03", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hd_id}", full_name: "B Two", date_of_birth: "1988-07-07", relationship: "SPOUSE" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${uf_id}", as: IntakeCoordinator, captures: { uf_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hf_id}", unit_id: "${uf_id}", move_in_date: "2026-08-11", expected_unit_version: "${uf_v}" }, as: IntakeCoordinator, captures: { tf_id: $.data.id } }
            - { call: "GET /housing-units/${ud_id}", as: IntakeCoordinator, captures: { ud_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hd_id}", unit_id: "${ud_id}", move_in_date: "2026-08-11", expected_unit_version: "${ud_v}" }, as: IntakeCoordinator, captures: { td_id: $.data.id } }
          trigger:
            - { call: "PUT /tenancies/${tf_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "PUT /tenancies/${td_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "GET /tenancies/${tf_id}/statement", as: IntakeCoordinator, captures: { fam_bal: $.data.balance_cents, fam_tier: $.data.subsidy_tier_percent } }
            - { call: "GET /tenancies/${td_id}/statement", as: IntakeCoordinator, captures: { dorm_bal: $.data.balance_cents, dorm_tier: $.data.subsidy_tier_percent } }
          assert:
            - "fam_bal == 60968  (calendar_day: round_half_up(90000 * 21 / 31))"
            - "dorm_bal == 42924  (weekly_slot: ceil(21/7) * round_half_up(62000*12/52) = 3 * 14308)"
            - "dorm_bal != 42000 — the calendar_day counterfactual on identical dorm inputs; variant selection is pinned by unit_type"
            - "fam_tier == 0 and dorm_tier == 0  (rent burden 90000/500000 = 0.18 < 0.30; no SUBSIDY_CREDIT posted)"

      - name: habitability_cumulative_vs_worst_case_divergence
        grounds:
          - calculations.habitability_risk_score
          - state_machines.HousingUnit.CERTIFIED_to_HABITABILITY_HOLD
          - entities.HousingUnit.fields.habitability_score_worst_case
        distinguishing_aspect: |
          Dual-variant scoring on the HousingUnit/WorkOrder domain (different
          domain from rent proration): the same open set (2 MAJOR + 7 MINOR)
          yields cumulative 41, which crosses HOLD_THRESHOLD 40 and puts the unit
          on HABITABILITY_HOLD, while worst_case yields 17.75, which would not.
        test_recipe:
          setup:
            - "Site OPEN with window [2026-08-01, 2026-11-30]"
            - "Unit U CERTIFIED (FAMILY_UNIT, rent 90000, max 4)"
            - "Eight open work orders on U: 2 MAJOR + 6 MINOR (cumulative 38 < 40, no hold yet)"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site H", state_code: "WA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "2026 Season", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "PLUMBING", severity: "MAJOR", description: "w1" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "ELECTRICAL", severity: "MAJOR", description: "w2" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "w3" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "w4" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "w5" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "w6" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "w7" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "w8" }, as: MaintenanceLead }
          trigger:
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "OTHER", severity: "MINOR", description: "w9 tips the cumulative score over the hold threshold" }, as: MaintenanceLead }
            - { call: "GET /housing-units/${u_id}", as: OperatorAdmin, captures: { cum: $.data.habitability_score_cumulative, worst: $.data.habitability_score_worst_case, u_status: $.data.status } }
            - { call: "GET /housing-sites/${site_id}/compliance-summary", as: OperatorAdmin, captures: { posture: $.data.compliance_posture } }
          assert:
            - "cum == 41  (2*10 + 7*3)"
            - "worst == 17.75  (max 10 + 0.25 * (41 - 10))"
            - "u_status == HABITABILITY_HOLD — enforcement follows the cumulative variant (41 >= 40) even though worst_case (17.75) is below threshold"
            - "posture == WATCH  (exactly one unit on hold)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: deduction_cap_nested_min_with_purpose_branch
        grounds:
          - calculations.payroll_deduction_cap
          - entities.DeductionAuthorization.fields.purpose
          - entities.Tenancy.fields.rent_bucket_balance_cents
        distinguishing_aspect: |
          Mode (a): payroll_deduction_cap combines >= 3 inputs with nested
          round-then-min and a conditional branch on the authorization's
          purpose. With cap 0.25 the household cap binds (25000); after
          superseding with cap 0.35 and purpose RENT the federal 30% binds
          (30000) and the utility bucket (625) is excluded from the covered
          balance.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED (FAMILY_UNIT, rent 90000); household ELIGIBLE, 2 members, income 6000000"
            - "Authorization A1: cap 0.25, purpose RENT_AND_UTILITIES, ACTIVE"
            - "Tenancy ACTIVE, move-in 2026-08-11: rent bucket 60968"
            - "UTILITY_OVERAGE entry posted: ELECTRIC usage 250 -> utility bucket 625"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site D", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam D", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "D One", date_of_birth: "1980-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "D Two", date_of_birth: "1982-02-02", relationship: "SPOUSE" }, as: IntakeCoordinator }
            - { call: "GET /households/${hh_id}", as: IntakeCoordinator, captures: { hh_v: $.data.version } }
            - { call: "POST /deduction-authorizations", payload: { household_id: "${hh_id}", cap_percent: 0.25, purpose: "RENT_AND_UTILITIES", effective_date: "2026-08-01", expected_household_version: "${hh_v}" }, as: IntakeCoordinator, captures: { auth1_id: $.data.id } }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "POST /charge-ledger-entries", payload: { tenancy_id: "${t_id}", entry_type: "UTILITY_OVERAGE", usage_lines: [ { utility_type: "ELECTRIC", usage_units: 250 } ] }, as: OperatorAdmin, captures: { util_entry: $.data.id, util_amt: $.data.amount_cents } }
          trigger:
            - { call: "POST /tenancies/${t_id}/payments", payload: { gross_wages_cents: 100000, pay_period_start: "2026-08-01", pay_period_end: "2026-08-15" }, as: IntakeCoordinator, captures: { pay1_amt: $.data.amount_cents } }
            - { call: "GET /households/${hh_id}", as: IntakeCoordinator, captures: { hh_v2: $.data.version } }
            - { call: "POST /deduction-authorizations", payload: { household_id: "${hh_id}", cap_percent: 0.35, purpose: "RENT", effective_date: "2026-08-16", expected_household_version: "${hh_v2}" }, as: IntakeCoordinator, captures: { auth2_id: $.data.id } }
            - { call: "POST /tenancies/${t_id}/payments", payload: { gross_wages_cents: 100000, pay_period_start: "2026-08-16", pay_period_end: "2026-08-31" }, as: IntakeCoordinator, captures: { pay2_amt: $.data.amount_cents } }
            - { call: "GET /tenancies/${t_id}/statement", as: IntakeCoordinator, captures: { bal: $.data.balance_cents, rent_bal: $.data.rent_bucket_balance_cents, util_bal: $.data.utility_bucket_balance_cents } }
            - { call: "GET /deduction-authorizations/${auth1_id}", as: IntakeCoordinator, captures: { auth1_status: $.data.status } }
          assert:
            - "util_amt == 625  (overage 50 units at 12.5 cents)"
            - "pay1_amt == 25000  (min(round(0.25*100000), round(0.30*100000), 100000-40000, 61593): household cap binds)"
            - "auth1_status == SUPERSEDED after the second authorization is created"
            - "pay2_amt == 30000  (min(round(0.35*100000), round(0.30*100000), 60000, covered=rent bucket only): federal cap binds; purpose=RENT excludes the 625 utility balance from the covered base)"
            - "rent_bal == 5968  (60968 - 25000 - 30000)"
            - "util_bal == 625  (pay1 covered it under RENT_AND_UTILITIES waterfall only after rent hits zero; rent had 35968 remaining so utility untouched; pay2 purpose RENT cannot touch it)"
            - "bal == 6593"

      - name: utility_overage_per_line_rounding_order
        grounds:
          - calculations.utility_overage_charge
          - entities.ChargeLedgerEntry.fields.usage_lines
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two usage lines that
          each produce 62.5 raw cents must round per line then sum (126), NOT
          sum then round (125); the scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED; household ELIGIBLE with 1 member; tenancy ACTIVE (move-in 2026-08-11, rent bucket 60968)"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site U", state_code: "OR" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam U", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "U One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /charge-ledger-entries", payload: { tenancy_id: "${t_id}", entry_type: "UTILITY_OVERAGE", usage_lines: [ { utility_type: "ELECTRIC", usage_units: 205 }, { utility_type: "GAS", usage_units: 105 } ] }, as: OperatorAdmin, captures: { entry_amt: $.data.amount_cents } }
            - { call: "GET /tenancies/${t_id}/statement", as: OperatorAdmin, captures: { bal: $.data.balance_cents, util_bal: $.data.utility_bucket_balance_cents } }
          assert:
            - "entry_amt == 126  (ELECTRIC overage 5 -> 62.5 -> 63; GAS overage 5 -> 62.5 -> 63; 63 + 63)"
            - "entry_amt != 125 — sum-then-round (62.5 + 62.5 = 125) is explicitly NOT the pinned order"
            - "util_bal == 126"
            - "bal == 61094  (60968 rent + 126 utility)"

      - name: subsidy_tier_circular_order_pinned
        grounds:
          - calculations.subsidy_credit_tier
          - entities.Tenancy.fields.subsidy_tier_percent
        distinguishing_aspect: |
          Mode (c): the subsidy tier depends on a rent-burden ratio that could
          be read off net rent (rent minus credit), which the credit itself
          determines — the scaffold pins evaluation order: prorate first, key
          the ratio on GROSS monthly rent, then subtract the credit. Income
          2400000/yr -> monthly 200000, gross rent 90000 -> ratio 0.45 ->
          tier 0.15, credit 9145 on the prorated 60968.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED (FAMILY_UNIT, rent 90000); household ELIGIBLE, 2 members, income 2400000"
            - "Tenancy PENDING_MOVE_IN, move-in 2026-08-11"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam S", annual_family_income_cents: 2400000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "S One", date_of_birth: "1980-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "S Two", date_of_birth: "2015-06-01", relationship: "CHILD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
          trigger:
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "GET /tenancies/${t_id}/statement", as: IntakeCoordinator, captures: { bal: $.data.balance_cents, tier: $.data.subsidy_tier_percent, rent_bal: $.data.rent_bucket_balance_cents } }
            - { call: "GET /households/${hh_id}", as: IntakeCoordinator, captures: { minors: $.data.minor_count } }
          assert:
            - "tier == 0.15  (ratio keyed on GROSS rent: 90000 / round(2400000/12) = 0.45, in [0.30, 0.50))"
            - "bal == 51823  (prorated rent 60968 - credit round_half_up(0.15 * 60968) = 9145)"
            - "rent_bal == 51823  (SUBSIDY_CREDIT posts into the rent bucket)"
            - "minors == 1  (member born 2015-06-01 is < 18 at clock 2026-08-01)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_reopen_cycle
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_REOPENED
          - state_machines.WorkOrder.REOPENED_to_ASSIGNED
        distinguishing_aspect: |
          WorkOrder is cyclic: COMPLETED -> REOPENED -> ASSIGNED -> IN_PROGRESS
          -> COMPLETED -> VERIFIED -> CLOSED traverses the rework loop once; a
          linear pipeline could not revisit ASSIGNED after COMPLETED.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED; one MINOR work order in REPORTED"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site W", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "PLUMBING", severity: "MINOR", description: "leaky faucet" }, as: MaintenanceLead, captures: { wo_id: $.data.id, wo_status0: $.data.status } }
          trigger:
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "TRIAGED" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "ASSIGNED", assignee_name: "tech-1" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "IN_PROGRESS" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "COMPLETED" }, as: MaintenanceLead, as_user_id: "ml-1" }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "REOPENED" }, as: SiteManager, captures: { wo_status_reopened: $.data.status } }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "ASSIGNED", assignee_name: "tech-2" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "IN_PROGRESS" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "COMPLETED" }, as: MaintenanceLead, as_user_id: "ml-1" }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "VERIFIED" }, as: SiteManager, as_user_id: "sm-1" }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "CLOSED" }, as: SiteManager, captures: { wo_final: $.data.status } }
          assert:
            - "wo_status0 == REPORTED (initial state)"
            - "wo_status_reopened == REOPENED — the cycle COMPLETED -> REOPENED -> ASSIGNED is legal"
            - "wo_final == CLOSED after the second pass through ASSIGNED/IN_PROGRESS/COMPLETED/VERIFIED"
            - "WorkOrder.${wo_id}.verified_by == sm-1 and completed_by == ml-1 (segregation satisfied)"

      - name: inspection_reinspection_cycle
        grounds:
          - state_machines.RegulatoryInspection.FINDINGS_ISSUED_to_CONDUCTED
          - state_machines.RegulatoryInspection.FINDINGS_ISSUED_to_CURE_CERTIFIED
        distinguishing_aspect: |
          RegulatoryInspection is cyclic on a different entity than WorkOrder:
          CONDUCTED -> FINDINGS_ISSUED -> CONDUCTED (agency re-inspection loop)
          -> FINDINGS_ISSUED -> CURE_CERTIFIED -> CLOSED, with the cure
          certified by a different inspector than the findings issuer.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED; inspection SCHEDULED"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site I", state_code: "WA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /regulatory-inspections", payload: { site_id: "${site_id}", agency: "STATE_HOUSING", scheduled_date: "2026-08-15" }, as: ComplianceInspector, captures: { insp_id: $.data.id, insp_status0: $.data.status } }
          trigger:
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "CONDUCTED" }, as: ComplianceInspector, as_user_id: "ci-1" }
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "FINDINGS_ISSUED", findings: [ { unit_id: "${u_id}", severity: "MINOR", code: "SCR-01" } ] }, as: ComplianceInspector, as_user_id: "ci-1", captures: { crit1: $.data.open_critical_count } }
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "CONDUCTED" }, as: ComplianceInspector, as_user_id: "ci-2", captures: { loop_state: $.data.status } }
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "FINDINGS_ISSUED", findings: [] }, as: ComplianceInspector, as_user_id: "ci-2", captures: { crit2: $.data.open_critical_count } }
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "CURE_CERTIFIED" }, as: ComplianceInspector, as_user_id: "ci-1", captures: { cure_state: $.data.status } }
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "CLOSED" }, as: ComplianceInspector, captures: { final_state: $.data.status } }
          assert:
            - "insp_status0 == SCHEDULED (initial state)"
            - "crit1 == 0  (only a MINOR finding was issued)"
            - "loop_state == CONDUCTED — FINDINGS_ISSUED -> CONDUCTED re-inspection loop is legal"
            - "crit2 == 0"
            - "cure_state == CURE_CERTIFIED — cure certifier ci-1 differs from the second findings issuer ci-2"
            - "final_state == CLOSED"

      - name: site_season_full_cycle
        grounds:
          - state_machines.HousingSite.CLOSED_to_OPENING
          - state_machines.SeasonWindow.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          HousingSite is cyclic across seasons on a third entity kind:
          DRAFT -> OPENING -> OPEN -> CLOSING -> CLOSED -> OPENING again, with
          the first SeasonWindow driven PLANNED -> ACTIVE -> COMPLETED along
          the way; closure is gated on tenancy/work-order/pest preconditions.
        test_recipe:
          setup:
            - "Site DRAFT with one CERTIFIED unit and a PLANNED window [2026-08-01, 2026-11-30]"
            - "Pest treatment on the unit SCHEDULED for 2026-08-01 with reentry_buffer_days 0"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site C", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W1", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin, captures: { w1_id: $.data.id } }
            - { call: "POST /pest-treatments", payload: { unit_id: "${u_id}", treatment_type: "ROUTINE", scheduled_date: "2026-08-01", reentry_buffer_days: 0 }, as: SiteManager, captures: { pt_id: $.data.id } }
          trigger:
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "PUT /pest-treatments/${pt_id}", payload: { status: "APPLIED" }, as: SiteManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: OperatorAdmin }
            - { call: "PUT /pest-treatments/${pt_id}", payload: { status: "CLEARED" }, as: SiteManager }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "CLOSING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "CLOSED" }, as: OperatorAdmin, captures: { closed_state: $.data.status } }
            - { call: "GET /season-windows/${w1_id}", as: OperatorAdmin, captures: { w1_status: $.data.status } }
            - { call: "GET /housing-sites/${site_id}", as: OperatorAdmin, captures: { site_v2: $.data.version } }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W2", planned_open_date: "2026-12-15", planned_close_date: "2027-03-31", expected_site_version: "${site_v2}" }, as: OperatorAdmin, captures: { w2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-20T00:00:00Z" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin, captures: { reopen_state: $.data.status } }
          assert:
            - "closed_state == CLOSED — closure gates pass: no live tenancies, no open work orders, unit's treatment (applied 2026-08-01) inside the ACTIVE window [2026-08-01, 2026-11-30]"
            - "w1_status == COMPLETED (bubble from site closure)"
            - "W2 gap 2026-11-30 -> 2026-12-15 is 15 days > MAINTENANCE_GAP_DAYS 14, so creation succeeds"
            - "reopen_state == OPENING — the CLOSED -> OPENING cycle repeats with the new covering window"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: condemnation_cascade_depth3
        grounds:
          - state_machines.RegulatoryInspection.CONDUCTED_to_FINDINGS_ISSUED
          - state_machines.HousingUnit.OCCUPIED_to_CONDEMNED
          - state_machines.Tenancy.ACTIVE_to_NOTICE
          - entities.Household.fields.rehousing_priority
          - calculations.site_compliance_posture
        distinguishing_aspect: |
          Depth-3 chain triggered by FINDINGS_ISSUED: inspection -> cited unit
          CONDEMNED -> the unit's ACTIVE tenancy forced to NOTICE with
          notice_reason CONDEMNATION -> the household's rehousing_priority set
          -> site posture recomputes to RESTRICTED. Each link is caused by the
          previous link's mutation, not by the original request directly.
        test_recipe:
          setup:
            - "Site OPEN; unit OCCUPIED by household H (2 members) via ACTIVE tenancy T (move-in 2026-08-11)"
            - "Inspection SCHEDULED then CONDUCTED by ci-1"
            - "Posture is NORMAL before the trigger"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site X", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam X", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "X One", date_of_birth: "1980-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "X Two", date_of_birth: "1983-03-03", relationship: "SPOUSE" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "POST /regulatory-inspections", payload: { site_id: "${site_id}", agency: "HUD", scheduled_date: "2026-08-20" }, as: ComplianceInspector, captures: { insp_id: $.data.id } }
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "CONDUCTED" }, as: ComplianceInspector, as_user_id: "ci-1" }
          trigger:
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "FINDINGS_ISSUED", findings: [ { unit_id: "${u_id}", severity: "CRITICAL", code: "ELEC-EXPOSED" } ] }, as: ComplianceInspector, as_user_id: "ci-1", captures: { crit: $.data.open_critical_count } }
            - { call: "GET /housing-units/${u_id}", as: OperatorAdmin, captures: { u_status: $.data.status } }
            - { call: "GET /tenancies/${t_id}", as: IntakeCoordinator, captures: { t_status: $.data.status, t_reason: $.data.notice_reason } }
            - { call: "GET /households/${hh_id}", as: IntakeCoordinator, captures: { hh_flag: $.data.rehousing_priority } }
            - { call: "GET /housing-sites/${site_id}/compliance-summary", as: OperatorAdmin, captures: { posture: $.data.compliance_posture } }
          assert:
            - "crit == 1"
            - "u_status == CONDEMNED (link 1: finding condemns the unit)"
            - "t_status == NOTICE and t_reason == CONDEMNATION (link 2: unit condemnation force-notices the tenancy)"
            - "hh_flag == true (link 3: forced notice sets the household rehousing flag)"
            - "posture == RESTRICTED (a CONDEMNED unit forces RESTRICTED regardless of other signals)"

      - name: work_order_verify_hold_clear_cascade
        grounds:
          - state_machines.WorkOrder.COMPLETED_to_VERIFIED
          - state_machines.HousingUnit.HABITABILITY_HOLD_to_CERTIFIED
          - calculations.habitability_risk_score
          - calculations.site_compliance_posture
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (work order VERIFIED): the
          verify recomputes the unit's cumulative score (41 -> 38), the unit
          leaves HABITABILITY_HOLD for CERTIFIED, and that unit transition
          recomputes the site posture WATCH -> NORMAL.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED then placed on HABITABILITY_HOLD by 2 MAJOR + 7 MINOR open work orders (cumulative 41)"
            - "One of the MINOR work orders walked to COMPLETED by ml-1 (its closure will drop the score to 38)"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site V", state_code: "WA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "PLUMBING", severity: "MAJOR", description: "m1" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "ELECTRICAL", severity: "MAJOR", description: "m2" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "n1" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "n2" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "n3" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "n4" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "n5" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "APPLIANCE", severity: "MINOR", description: "n6" }, as: MaintenanceLead }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "OTHER", severity: "MINOR", description: "n7 target" }, as: MaintenanceLead, captures: { wo_id: $.data.id } }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "TRIAGED" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "ASSIGNED", assignee_name: "tech-1" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "IN_PROGRESS" }, as: MaintenanceLead }
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "COMPLETED" }, as: MaintenanceLead, as_user_id: "ml-1" }
          trigger:
            - { call: "PUT /work-orders/${wo_id}", payload: { status: "VERIFIED" }, as: SiteManager, as_user_id: "sm-1" }
            - { call: "GET /housing-units/${u_id}", as: OperatorAdmin, captures: { cum: $.data.habitability_score_cumulative, u_status: $.data.status } }
            - { call: "GET /housing-sites/${site_id}/compliance-summary", as: OperatorAdmin, captures: { posture: $.data.compliance_posture } }
          assert:
            - "cum == 38  (41 - 3: the VERIFIED minor leaves the open set)"
            - "u_status == CERTIFIED (link 1: score 38 < 40 with zero open CRITICAL clears the hold)"
            - "posture == NORMAL (link 2: last hold cleared; no open CRITICAL work orders; no breached complaints)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_cancelled_tenancy_payment
        grounds:
          - "validations[priority=7.5]"
          - "validations[priority=17]"
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NO_ACTIVE_DEDUCTION_AUTHORIZATION]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): a payment against a
          CANCELLED tenancy of a household with NO active authorization
          violates both the p7.5 state gate and the p17 fiscal gate; the
          higher-priority state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED; household ELIGIBLE with 1 member and NO deduction authorization"
            - "Tenancy created then CANCELLED from PENDING_MOVE_IN"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site PF", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
