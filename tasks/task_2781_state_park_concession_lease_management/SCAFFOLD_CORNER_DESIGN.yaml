      - name: bond_posting_errors_distinguish_the_required_floor_from_the_attested_capacity
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BOND_INSUFFICIENT]
          - errors[ERR_BOND_EXCEEDS_CAPACITY]
          - validations[priority=48]
          - validations[priority=49]
        distinguishing_aspect: "Both bounds are 422s on the same field of the same endpoint, one cent apart from success on the low side and far above it on the high side, and they must not be collapsed into one \"invalid penal sum\" error. A rejected posting also has to leave the bond PENDING with penal_sum_cents still null, so a later valid posting is the first write that ever populates the row — an implementation that stores the penal sum before validating it will report an ACTIVE bond it never accepted."
