      - name: entity_backed_roles_are_confined_to_their_own_employee_and_unit
        claim_type: shared_operations
        grounds:
          - roles.Employee
          - roles.ShiftManager
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_EMPLOYEE_LOCATION_MISMATCH]
          - validations.priority_6
          - validations.priority_32
        distinguishing_aspect: >-
          Two entity-backed roles with different scopes over the same rows: an acting Employee is
          confined to their own employee_id, while an acting ShiftManager is confined to the LOCATION
          of the employee row named by X-User-ID and may therefore read a colleague's shift that the
          colleague's peer cannot. Ownership is checked at priority 6, above existence and above the
          location-mismatch rule at priority 32, so a cross-owner read is a 403 rather than a 404 and
          a dispute raised on someone else's pay line is a 403 rather than a mismatch 422 — while the
