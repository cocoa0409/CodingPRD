            - call: "GET /library-assets?status=ACTIVE&limit=1&offset=1"
              as: FacilityAdmin
              as_user_id: "admin-1"
          assert:
            - "limit=0 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION (the minimum is 1)"
            - "limit=101 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION (the maximum is 100)"
            - "offset=-1 returns HTTP 400 with error_id == ERR_INVALID_PAGINATION"
            - "limit=2&offset=0 returns 2 items with total_count == 3 and has_more == true"
            - "limit=2&offset=2 returns 1 item with total_count == 3 and has_more == false"
            - "the unparameterised list returns all 3 items with limit defaulted to 10, offset 0, total_count == 3 and has_more == false"
            - "status=ACTIVE&limit=1&offset=1 returns 1 item with total_count == 2 and has_more == false — the filter is applied before the page window"

