        claim_type: rate_threshold_triggers
        grounds:
          - state_machines[entity=IncidentalTakePermit].state_field=status
          - calculations.take_ledger_application
          - entities.IncidentalTakePermit.fields.suspension_count
          - entities.Consultation.fields.reinitiation_count
        distinguishing_aspect: >-
          The threshold is CUMULATIVE across reports, not per-report, and it
          re-arms: a rejection drops the ledger back below the trigger, returns
          the permit to ACTIVE, and a later report of the same one-hundredth of a
