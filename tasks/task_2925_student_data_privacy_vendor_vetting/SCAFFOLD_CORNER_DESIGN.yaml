      - name: detection_second_triage_is_refused_as_already_triaged
        claim_type: Idempotency
        grounds:
          - state_machines.TelemetryDetection.terminal_states
          - validations[priority=16]
          - errors[ERR_DETECTION_ALREADY_TRIAGED]
          - calculations.detection_exposure_score
        distinguishing_aspect: |
          All four triage outcomes are terminal, so a second triage of the same detection
          must be 409 ERR_DETECTION_ALREADY_TRIAGED even when the second disposition
          differs from the first, and triaged_by_user_id must keep the FIRST operator's
          id. The detection also pins the UNAUTHORIZED base: 30 * 0.4 + 120 * 0.05 + 45
          == 63.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V with Application A registered but no catalog entry, so the domain matches an application with no authorization."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
