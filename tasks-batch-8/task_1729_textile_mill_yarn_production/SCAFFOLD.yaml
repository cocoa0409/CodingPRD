  # --- CustomerOrder ---
  - method: POST
    path: "/mill/customer-orders"
    description: "Open a customer order"
    roles: [CustomerServiceRep]
    code: 201
    input: [customer_code, color_code, requested_yards, "yardage_tolerance_pct?"]
    output: CustomerOrder
    side_effects: []

  - method: GET
    path: "/mill/customer-orders"
    description: "List customer orders"
    roles: [CustomerServiceRep, MillPlanner]
    code: 200
    input: ["customer_code?", "status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []

  - method: GET
    path: "/mill/customer-orders/{id}"
    description: "Read one customer order"
    roles: [CustomerServiceRep, MillPlanner]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []

  - method: POST
    path: "/mill/customer-orders/{id}/allocate"
    description: "Allocate an AVAILABLE first-quality roll to this order (OCC via expected_order_version)"
    roles: [CustomerServiceRep]
    code: 200
    input: [roll_id, expected_order_version]
    output: CustomerOrder
    side_effects:
      - "FinishedRoll transitions AVAILABLE → ALLOCATED"
      - "CustomerOrder.allocated_yards recomputed via roll_yardage_total (sum-then-round variant)"
      - "CustomerOrder.status auto-transitions OPEN → PARTIALLY_ALLOCATED → FULLY_ALLOCATED"
      - "increments CustomerOrder.version by 1"

  - method: POST
    path: "/mill/customer-orders/{id}/cancel"
    description: "Cancel an order; releases all allocated rolls"
    roles: [CustomerServiceRep]
    code: 200
    input: []
    output: CustomerOrder
    side_effects:
      - "All ALLOCATED rolls transition to AVAILABLE"
      - "CustomerOrder.allocated_yards zeroed"
      - "increments CustomerOrder.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or unrecognized"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path template id does not resolve to an existing entity"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "FK payload field references a non-existent entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity's current state does not permit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_*_version does not match the parent's current version"
  - id: ERR_QUALITY_GATE_FAILED
    http: 422
    condition: "Quality-gate violation: dye-lot approval blocked because QualityTest.grade == REJECTED, or yarn-lot dyeing blocked because recipe not APPROVED"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Uniqueness violation on recipe_code or machine_code"
  - id: ERR_WINDOW_CONFLICT
    http: 409
    condition: "Temporal overlap on machine window or vat buffer conflict"
  - id: ERR_REFERENTIAL_VIOLATION
    http: 422
    condition: "Referential integrity violation (e.g., finished roll against non-APPROVED dye lot)"
  - id: ERR_INSUFFICIENT_CAPACITY
    http: 422
    condition: "Yarn lot lacks greige yards or fiber lot lacks available weight"
  - id: ERR_COUNT_OUT_OF_RANGE
    http: 422
    condition: "Recipe's target_yarn_count_ne outside machine's supported range (selector eligibility)"
  - id: ERR_SHADE_OUT_OF_BAND
    http: 422
    condition: "LabDip measured_delta_e exceeds ShadeBand tolerance; cannot be approved"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed payload, missing required field, or field type/range violation"
  - id: ERR_SECOND_QUALITY_NOT_ALLOCATABLE
    http: 422
    condition: "Roll flagged is_second_quality cannot be allocated to a normal customer order; must go to close-out channel"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MillPlanner
    description: "Owns fiber receiving and blend recipe design"
    identity: opaque
    exclusive_operations:
      - "POST /mill/fiber-lots"
      - "POST /mill/blend-recipes"
      - "POST /mill/blend-recipes/{id}/components"
      - "POST /mill/blend-recipes/{id}/approve"
      - "POST /mill/blend-recipes/{id}/reject"
    shared_operations:
      - "GET reads on fiber lots, recipes, machines, yarn lots, dye lots, customer orders"

  - name: SpinningSupervisor
    description: "Owns yarn lot creation and machine assignment lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /mill/yarn-lots"
      - "POST /mill/machine-assignments"
      - "POST /mill/machine-assignments/{id}/start"
      - "POST /mill/machine-assignments/{id}/complete"
      - "POST /mill/machine-assignments/{id}/cancel"
    shared_operations:
      - "GET reads on fiber lots, recipes, machines, yarn lots"

  - name: DyeHouseOperator
    description: "Owns dye lot workflow and lab dip submission"
    identity: opaque
    exclusive_operations:
      - "POST /mill/dye-lots"
      - "POST /mill/dye-lots/{id}/start"
      - "POST /mill/dye-lots/{id}/submit-shade"
      - "POST /mill/lab-dips"
      - "POST /mill/finished-rolls"
    shared_operations:
      - "GET reads on shade bands, lab dips, dye lots, quality tests, finished rolls"

  - name: QualityInspector
    description: "Records quality tests and adjudicates dye lots"
    identity: opaque
    exclusive_operations:
      - "POST /mill/dye-lots/{id}/quality-tests"
      - "PATCH /mill/quality-tests/{id}"
      - "POST /mill/dye-lots/{id}/approve"
      - "POST /mill/dye-lots/{id}/reject"
      - "POST /mill/yarn-lots/{id}/reject"
    shared_operations:
      - "GET reads on all production entities"

  - name: CustomerServiceRep
    description: "Owns shade band creation, lab dip approval, customer orders, roll allocation/shipment"
    identity: opaque
    exclusive_operations:
      - "POST /mill/shade-bands"
      - "POST /mill/lab-dips/{id}/approve"
      - "POST /mill/lab-dips/{id}/reject"
      - "POST /mill/customer-orders"
      - "POST /mill/customer-orders/{id}/allocate"
      - "POST /mill/customer-orders/{id}/cancel"
      - "POST /mill/finished-rolls/{id}/ship"
      - "POST /mill/finished-rolls/{id}/release"
      - "POST /mill/finished-rolls/{id}/close-out"
    shared_operations:
      - "GET reads on shade bands, lab dips, dye lots, finished rolls, customer orders"

  - name: MillAdmin
    description: "Registers spinning machines; operational admin only"
    identity: opaque
    exclusive_operations:
      - "POST /mill/spinning-machines"
    shared_operations:
      - "GET reads on machines and assignments"
