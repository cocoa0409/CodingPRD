# =============================================================================
# Wound Care & Hyperbaric Center — PRD benchmark seed tables
# Difficulty: Expert
# Topology: FLAT (peer entities under a neutral /wound-care root, FK references
# carried in request bodies; every entity has a filtered-list GET so every FK
# is reverse-reachable).
# =============================================================================

scenario: |
  521. Wound Care & Hyperbaric Center: referral & wound assessment
  (staging/measurement), treatment plan & debridement schedule, HBO-therapy
  session & dive log, advanced-dressing/graft supply, photo-documentation &
  healing trajectory, payer coverage criteria, transfer-to-acute, outcome
  reporting

domain_name: wound-care-hyperbaric
api_prefix: /wound-care

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # Peer entities under /wound-care with FK references in bodies; no nesting in
  # URL paths. Cross-aggregate references (HboSession->Chamber,
  # DebridementProcedure->Clinician) link peers by id.
  state_machine_shape: cyclic
  # PriorAuthorization loops SUBMITTED -> ADDITIONAL_INFO_REQUESTED -> SUBMITTED;
  # TreatmentPlan loops ACTIVE -> SUSPENDED -> ACTIVE. Other machines branch.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # A user who completes a debridement cannot also initiate the same patient's
  # AcuteTransfer; PayerLiaison owns coverage; peer roles own distinct resources.
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Center
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Center name" }
      - { name: current_utc, type: datetime, source: system, default: "2026-05-01T00:00:00Z", description: "Logical clock; set via /_clock/set_current_utc. Startup default 2026-05-01T00:00:00Z" }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id" }
      - { name: name, type: string, source: input, description: "Clinician full name" }
      - { name: role_kind, type: enum, source: input, description: "WOUND | HYPERBARIC | ATTENDING", constraints: "one of WOUND, HYPERBARIC, ATTENDING" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether clinician is schedulable" }

  - name: Chamber
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id" }
      - { name: label, type: string, source: input, description: "Chamber label" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 30, description: "Mandatory decompression/turnover gap enforced after each session", constraints: ">= 0" }
      - { name: occupied_slot_count, type: integer, source: computed, default: 0, description: "Count of HboSession with chamber_id==this AND status==SCHEDULED (conserved quantity)" }

  - name: PayerPolicy
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id" }
      - { name: payer_name, type: string, source: input, description: "Payer / plan name" }
      - { name: requires_prior_auth, type: boolean, source: input, default: true, description: "Whether HBO/graft coverage needs a PriorAuthorization" }
      - { name: max_covered_hbo_sessions, type: integer, source: input, description: "Cap on reimbursable HBO sessions", constraints: ">= 0" }
      - { name: per_session_cents, type: integer, source: input, description: "Covered amount per HBO session in cents", constraints: ">= 0" }
      - { name: min_healing_pct_threshold, type: number, source: input, default: 50, description: "Minimum actual % wound-area reduction to keep coverage active at reassessment" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id" }
      - { name: mrn, type: string, source: input, description: "Medical record number" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: payer_policy_id, type: string, source: input, description: "FK -> PayerPolicy.id" }
      - { name: latest_wound_area_cm2, type: number, source: computed, default: 0, description: "area_cm2 of the most recent WoundAssessment (assessed_at DESC, tie created_at DESC; id never a decision input)" }
      - { name: status, type: enum, source: system, description: "INTAKE -> IN_CARE -> DISCHARGED / TRANSFERRED", constraints: "one of INTAKE, IN_CARE, DISCHARGED, TRANSFERRED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: source_provider, type: string, source: input, description: "Referring provider name" }
      - { name: reason, type: string, source: input, description: "Referral reason" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> NEEDS_INFO -> RECEIVED -> ACCEPTED / DECLINED", constraints: "one of RECEIVED, NEEDS_INFO, ACCEPTED, DECLINED" }

  - name: WoundAssessment
    parent: null
    common_fields: false   # append-only clinical record: id + created_at only
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock timestamp when recorded (== Center.current_utc at create)" }
      - { name: stage, type: enum, source: input, description: "STAGE_1|STAGE_2|STAGE_3|STAGE_4|UNSTAGEABLE" }
      - { name: length_cm, type: number, source: input, description: "Wound length", constraints: "> 0" }
      - { name: width_cm, type: number, source: input, description: "Wound width", constraints: "> 0" }
      - { name: tissue_type, type: enum, source: input, description: "GRANULATION|EPITHELIAL|SLOUGH|NECROTIC" }
      - { name: infected, type: boolean, source: input, default: false, description: "Clinical infection present" }
      - { name: area_cm2, type: number, source: computed, description: "= length_cm * width_cm" }
      - { name: severity_score, type: integer, source: computed, description: "wound_severity_score (see §1.3)" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: baseline_assessment_id, type: string, source: input, description: "FK -> WoundAssessment.id; earliest measurement anchoring healing trajectory" }
      - { name: coverage_status, type: enum, source: computed, default: PENDING, description: "PENDING | COVERED | NOT_COVERED — derived from PriorAuthorization + PayerPolicy", constraints: "one of PENDING, COVERED, NOT_COVERED" }
      - { name: provisional_covered_cents, type: integer, source: computed, default: 0, description: "= sum(SupplyOrder.covered_cents where status IN {SUBMITTED, APPROVED}) (conserved quantity)" }
      - { name: provisional_hbo_covered_cents, type: integer, source: computed, default: 0, description: "Provisional HBO coverage estimate (hbo_coverage_cost provisional variant)" }
      - { name: finalized_hbo_covered_cents, type: integer, source: computed, default: 0, description: "Finalized HBO coverage (hbo_coverage_cost final variant); set at outcome report" }
      - { name: debridement_supply_budget_cents, type: integer, source: input, description: "Ceiling for covered supply spend on this plan", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUSPENDED -> ACTIVE -> HEALED / SUSPENDED -> CLOSED", constraints: "one of DRAFT, ACTIVE, SUSPENDED, HEALED, CLOSED" }

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: requested_hbo_sessions, type: integer, source: input, description: "Number of HBO sessions requested", constraints: ">= 1" }
      - { name: clinical_justification, type: string, source: input, description: "Medical-necessity narrative" }
      - { name: info_request_note, type: string, source: computed, description: "Latest payer note when additional info requested" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> ADDITIONAL_INFO_REQUESTED -> SUBMITTED -> APPROVED / DENIED", constraints: "one of SUBMITTED, ADDITIONAL_INFO_REQUESTED, APPROVED, DENIED" }

  - name: DebridementProcedure
    parent: null
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: clinician_id, type: string, source: input, description: "FK -> Clinician.id; performing clinician (role_kind must be WOUND)" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled start (closed interval)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled end (closed interval)", constraints: "window_end > window_start" }
      - { name: performed_by_user_id, type: string, source: computed, description: "X-User-ID of the clinician who completed it (segregation-of-duties record)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED / CANCELLED", constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }

  - name: HboSession
    parent: null
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: chamber_id, type: string, source: input, description: "FK -> Chamber.id; assigned hyperbaric chamber" }
      - { name: window_start, type: datetime, source: input, description: "Dive start (half-open interval [start, end))" }
      - { name: window_end, type: datetime, source: input, description: "Dive end (half-open interval [start, end))", constraints: "window_end > window_start" }
      - { name: treatment_pressure_ata, type: number, source: input, description: "Prescribed pressure in ATA", constraints: "> 1.0" }
      - { name: dive_log_entries, type: array, source: input, default: [], description: "Vitals log recorded at COMPLETE: list of { minute, spo2, hr }" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED / CANCELLED", constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }

  - name: SupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: supply_kind, type: enum, source: input, description: "ADVANCED_DRESSING | SKIN_GRAFT", constraints: "one of ADVANCED_DRESSING, SKIN_GRAFT" }
      - { name: line_items, type: array, source: input, description: "list of { unit_price_cents, qty, coverage_rate } (coverage_rate in [0,1])" }
      - { name: covered_cents, type: integer, source: computed, description: "supply_reimbursement over line_items (round per line then sum, see §1.3)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED / REJECTED / CANCELLED", constraints: "one of SUBMITTED, APPROVED, REJECTED, CANCELLED" }

  - name: PhotoDocument
    parent: null
    common_fields: false   # append-only: id + created_at only
    fields:
      - { name: wound_assessment_id, type: string, source: input, description: "FK -> WoundAssessment.id" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: image_uri, type: string, source: input, description: "Stored image URI" }
      - { name: captured_at, type: datetime, source: system, description: "Logical-clock timestamp at upload (== Center.current_utc)" }

  - name: AcuteTransfer
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: destination_facility, type: string, source: input, description: "Receiving acute facility" }
      - { name: clinical_reason, type: string, source: input, description: "Reason for transfer (e.g., sepsis, uncontrolled ischemia)" }
      - { name: initiated_by_user_id, type: string, source: computed, description: "X-User-ID of AttendingPhysician who initiated" }
      - { name: status, type: enum, source: system, description: "INITIATED -> ACCEPTED / CANCELLED", constraints: "one of INITIATED, ACCEPTED, CANCELLED" }

  - name: OutcomeReport
    parent: null
    common_fields: true
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id" }
      - { name: actual_healing_pct, type: number, source: computed, description: "healing_trajectory FINAL variant (chronological baseline vs latest)" }
      - { name: projected_healing_pct, type: number, source: computed, description: "healing_trajectory PROVISIONAL variant (forward-looking 4-week projection)" }
      - { name: finalized_hbo_covered_cents, type: integer, source: computed, description: "hbo_coverage_cost FINAL variant snapshot" }
      - { name: meets_coverage_threshold, type: boolean, source: computed, description: "actual_healing_pct >= PayerPolicy.min_healing_pct_threshold" }
      - { name: status, type: enum, source: system, description: "FINAL (terminal, generated once)", constraints: "one of FINAL" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: RECEIVED
        to: NEEDS_INFO
        trigger: "POST /wound-care/referrals/{referralId}/request-info"
        actor: IntakeCoordinator
        preconditions: ["Referral in RECEIVED (ERR_REFERRAL_NOT_RECEIVED)"]
        side_effects: []
      - from: NEEDS_INFO
        to: RECEIVED
        trigger: "POST /wound-care/referrals/{referralId}/resubmit"
        actor: IntakeCoordinator
        preconditions: ["Referral in NEEDS_INFO (ERR_REFERRAL_NOT_NEEDS_INFO)"]
        side_effects: []
        note: "Cyclic revision loop RECEIVED <-> NEEDS_INFO"
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /wound-care/referrals/{referralId}/accept"
        actor: IntakeCoordinator
        preconditions:
          - "Referral in RECEIVED (ERR_REFERRAL_NOT_RECEIVED)"
          - "At least one WoundAssessment exists for the patient (ERR_NO_ASSESSMENT_ON_FILE)"
        side_effects: ["Patient.status INTAKE -> IN_CARE"]
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /wound-care/referrals/{referralId}/decline"
        actor: IntakeCoordinator
        preconditions: ["Referral in RECEIVED (ERR_REFERRAL_NOT_RECEIVED)"]
        side_effects: []

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [HEALED, CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wound-care/treatment-plans/{planId}/activate"
        actor: WoundClinician
        preconditions:
          - "Plan in DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "Patient.status == IN_CARE (ERR_PATIENT_NOT_IN_CARE)"
          - "coverage_status != NOT_COVERED (ERR_COVERAGE_DENIED)"
        side_effects: ["increments TreatmentPlan.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /wound-care/treatment-plans/{planId}/suspend (or cascaded from AcuteTransfer INITIATE)"
        actor: WoundClinician | system
        preconditions: ["Plan in ACTIVE (ERR_PLAN_NOT_ACTIVE)"]
        side_effects:
          - "Every HboSession of this plan with status==SCHEDULED -> CANCELLED (cascade)"
          - "Each such HboSession cancellation decrements its Chamber.occupied_slot_count by 1 (cascade continues onto Chamber)"
          - "Recompute provisional_hbo_covered_cents"
          - "increments TreatmentPlan.version by 1"
        note: "Cyclic ACTIVE <-> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wound-care/treatment-plans/{planId}/resume"
        actor: WoundClinician
        preconditions:
          - "Plan in SUSPENDED (ERR_PLAN_NOT_SUSPENDED)"
          - "Patient.status == IN_CARE (ERR_PATIENT_NOT_IN_CARE)"
        side_effects: ["increments TreatmentPlan.version by 1"]
      - from: ACTIVE
        to: HEALED
        trigger: "system (automatic when a new WoundAssessment drives actual_healing_pct >= 100 OR latest_wound_area_cm2 == 0)"
        actor: system
        preconditions: ["Plan in ACTIVE (ERR_PLAN_NOT_ACTIVE)"]
        side_effects: ["increments TreatmentPlan.version by 1"]
        note: "Bubble-up from WoundAssessment recording"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wound-care/treatment-plans/{planId}/outcome-report"
        actor: WoundClinician
        preconditions:
          - "Plan in ACTIVE or SUSPENDED (ERR_PLAN_NOT_CLOSEABLE)"
          - "No HboSession in SCHEDULED status (ERR_OPEN_SESSIONS_EXIST)"
        side_effects:
          - "Create OutcomeReport (status FINAL)"
          - "Compute finalized_hbo_covered_cents and copy onto plan"
          - "increments TreatmentPlan.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /wound-care/treatment-plans/{planId}/outcome-report"
        actor: WoundClinician
        preconditions:
          - "Plan in ACTIVE or SUSPENDED (ERR_PLAN_NOT_CLOSEABLE)"
          - "No HboSession in SCHEDULED status (ERR_OPEN_SESSIONS_EXIST)"
        side_effects:
          - "Create OutcomeReport (status FINAL)"
          - "Compute finalized_hbo_covered_cents and copy onto plan"
          - "increments TreatmentPlan.version by 1"

  - entity: PriorAuthorization
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: ADDITIONAL_INFO_REQUESTED
        trigger: "POST /wound-care/prior-authorizations/{authId}/request-info"
        actor: PayerLiaison
        preconditions: ["Auth in SUBMITTED (ERR_AUTH_NOT_SUBMITTED)"]
        side_effects: ["Set info_request_note"]
      - from: ADDITIONAL_INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /wound-care/prior-authorizations/{authId}/resubmit"
        actor: PayerLiaison
        preconditions: ["Auth in ADDITIONAL_INFO_REQUESTED (ERR_AUTH_NOT_AWAITING_INFO)"]
        side_effects: []
        note: "Cyclic resubmission loop"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wound-care/prior-authorizations/{authId}/approve"
        actor: PayerLiaison
        preconditions: ["Auth in SUBMITTED (ERR_AUTH_NOT_SUBMITTED)"]
        side_effects:
          - "TreatmentPlan.coverage_status -> COVERED (cross-entity)"
          - "Recompute provisional_hbo_covered_cents"
          - "increments TreatmentPlan.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /wound-care/prior-authorizations/{authId}/deny"
        actor: PayerLiaison
        preconditions: ["Auth in SUBMITTED (ERR_AUTH_NOT_SUBMITTED)"]
        side_effects:
          - "TreatmentPlan.coverage_status -> NOT_COVERED (cascade)"
          - "Every SupplyOrder of the plan in SUBMITTED -> REJECTED (cascade continues onto SupplyOrder)"
          - "Each such rejection credits back its covered_cents from provisional_covered_cents"
          - "increments TreatmentPlan.version by 1"

  - entity: DebridementProcedure
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /wound-care/debridement-procedures/{procId}/complete"
        actor: WoundClinician
        preconditions:
          - "Procedure in SCHEDULED (ERR_PROC_NOT_SCHEDULED)"
          - "TreatmentPlan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "Patient.status == IN_CARE (ERR_PATIENT_NOT_IN_CARE) [cross-entity: Procedure depends on Patient]"
        side_effects:
          - "Set performed_by_user_id = X-User-ID"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /wound-care/debridement-procedures/{procId}/cancel"
        actor: WoundClinician
        preconditions: ["Procedure in SCHEDULED (ERR_PROC_NOT_SCHEDULED)"]
        side_effects: []

  - entity: HboSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /wound-care/hbo-sessions/{sessionId}/complete"
        actor: HyperbaricTech
        preconditions:
          - "Session in SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
          - "TreatmentPlan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "dive_log_entries in request is non-empty (ERR_EMPTY_DIVE_LOG)"
        side_effects:
          - "Persist dive_log_entries"
          - "Chamber.occupied_slot_count -= 1"
          - "Recompute provisional_hbo_covered_cents"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /wound-care/hbo-sessions/{sessionId}/cancel (or cascaded from plan SUSPEND)"
        actor: HyperbaricTech | system
        preconditions: ["Session in SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"]
        side_effects:
          - "Chamber.occupied_slot_count -= 1 (compensating release)"
          - "Recompute provisional_hbo_covered_cents"

  - entity: SupplyOrder
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wound-care/supply-orders/{orderId}/approve"
        actor: PayerLiaison
        preconditions: ["Order in SUBMITTED (ERR_ORDER_NOT_SUBMITTED)"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /wound-care/supply-orders/{orderId}/reject (or cascaded from PriorAuth DENY)"
        actor: PayerLiaison | system
        preconditions: ["Order in SUBMITTED (ERR_ORDER_NOT_SUBMITTED)"]
        side_effects: ["TreatmentPlan.provisional_covered_cents -= covered_cents (compensating credit)"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /wound-care/supply-orders/{orderId}/cancel"
        actor: WoundClinician
        preconditions: ["Order in SUBMITTED (ERR_ORDER_NOT_SUBMITTED)"]
        side_effects: ["TreatmentPlan.provisional_covered_cents -= covered_cents (compensating credit)"]

  - entity: AcuteTransfer
    initial_state: INITIATED
    terminal_states: [ACCEPTED, CANCELLED]
    transitions:
      - from: INITIATED
        to: ACCEPTED
        trigger: "POST /wound-care/acute-transfers/{transferId}/accept"
        actor: AttendingPhysician
        preconditions: ["Transfer in INITIATED (ERR_TRANSFER_NOT_INITIATED)"]
        side_effects: []
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /wound-care/acute-transfers/{transferId}/cancel"
        actor: AttendingPhysician
        preconditions: ["Transfer in INITIATED (ERR_TRANSFER_NOT_INITIATED)"]
        side_effects: ["Patient.status TRANSFERRED -> IN_CARE (revert)"]
        note: "Cancelling an unaccepted transfer restores the patient to care"

# =============================================================================
# Concurrency Rules (§1.2.1 — OCC on parent version, serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: hbo-schedule-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /wound-care/hbo-sessions"
    occ_field: "expected_plan_version"
    description: |
      Scheduling a new HboSession against a TreatmentPlan whose version has
      advanced since the client last observed it is rejected on stale version.
      A plan SUSPEND (which cascades session cancellations) or a PriorAuth
      approve both bump the plan version; a scheduler holding a stale view is
      rejected rather than booking a chamber slot against an out-of-date plan.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
  - rule_id: supply-order-stale-plan
    parent_entity: TreatmentPlan
    write_endpoint: "POST /wound-care/supply-orders"
    occ_field: "expected_plan_version"
    description: |
      Submitting a SupplyOrder against a TreatmentPlan whose version has moved
      on (e.g., a prior SupplyOrder submission already debited the covered
      budget, or a PriorAuth denial flipped coverage to NOT_COVERED) is
      rejected on stale version so the budget ledger stays consistent.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: wound_area
    trigger: "WoundAssessment create"
    algorithm: multiplication
    formula: |
      area_cm2 = length_cm * width_cm
    precision: "2 decimal places, round_half_up"

  - name: wound_severity_score
    trigger: "WoundAssessment create"
    algorithm: weighted_scoring
    formula: |
      STAGE_POINTS = { STAGE_1:1, STAGE_2:2, STAGE_3:4, STAGE_4:8, UNSTAGEABLE:10 }
      area = length_cm * width_cm
      AREA_MULT = 1.0 if area <= 4
                  else 1.5 if area <= 16     # boundary: 16 -> 1.5, 16.0001 -> 2.0
                  else 2.0
      TISSUE_BONUS = { GRANULATION:0, EPITHELIAL:-1, SLOUGH:2, NECROTIC:4 }
      raw = STAGE_POINTS[stage] * AREA_MULT + (5 if infected else 0) + TISSUE_BONUS[tissue_type]
      severity_score = min(100, max(1, round_half_up(raw, 0)))
    input_set: "Single WoundAssessment's own fields"
    constants:
      INFECTION_BONUS: 5
      AREA_TIER_LOW: 4
      AREA_TIER_HIGH: 16
      SCORE_FLOOR: 1
      SCORE_CEIL: 100
    precision: "integer, round_half_up before floor/ceil clamp"
    note: "Mode (a): >=3 inputs, nested min/max, tiered area-multiplier selection"

  - name: supply_reimbursement
    trigger: "SupplyOrder create"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round each line to whole cents FIRST, then sum.
      per_line[i] = round_half_up(line_items[i].unit_price_cents
                                  * line_items[i].qty
                                  * line_items[i].coverage_rate, 0)
      covered_cents = sum(per_line)      # NOT round(sum(unrounded_line_totals))
    input_set: "All line_items on the SupplyOrder"
    precision: "whole cents; round per line item, then sum"
    note: "Mode (b): rounding order matters — per-line-then-sum is authoritative"

  - name: healing_trajectory
    trigger: "OutcomeReport creation; also re-evaluated on each WoundAssessment create for auto-HEALED check"
    algorithm: forward_looking
    formula: |
      Order WoundAssessments of the plan's patient by assessed_at ASC (tie-break
      created_at ASC; id is NEVER a decision input).
      baseline_area = area_cm2 of the plan.baseline_assessment_id assessment
      latest_area   = area_cm2 of the most recent assessment (assessed_at DESC, tie created_at DESC)
      prev_area     = area_cm2 of the second-most-recent assessment
      days_between  = (latest.assessed_at - prev.assessed_at) in days (> 0)

      # FINAL (chronological, actual):
      actual_healing_pct = round_half_up((baseline_area - latest_area) / baseline_area * 100, 2)

      # PROVISIONAL (forward-looking 4-week projection):
      weekly_rate_cm2 = (prev_area - latest_area) / days_between * 7
      projected_healing_pct = min(100.0,
        round_half_up(weekly_rate_cm2 / baseline_area * 100 * 4, 2))
    input_set: "All WoundAssessments for the patient; baseline pinned by plan.baseline_assessment_id"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: final_actual
        when: "OutcomeReport / auto-HEALED evaluation"
        difference: "Uses baseline vs latest actual measurement (chronological)"
      - name: provisional_projected
        when: "Forward-looking estimate on OutcomeReport"
        difference: "Extrapolates the last-two-assessment trend over a 28-day horizon"
    note: "Rule 1 dual-variant on WOUND/healing domain; distinct from hbo_coverage_cost"

  - name: hbo_coverage_cost
    trigger: "PriorAuth approve, HboSession complete/cancel/schedule (provisional); OutcomeReport creation (final)"
    algorithm: threshold
    formula: |
      cap = PayerPolicy.max_covered_hbo_sessions
      rate = PayerPolicy.per_session_cents
      # PROVISIONAL: count sessions currently SCHEDULED or COMPLETED
      prov_n = count(HboSession of plan where status IN {SCHEDULED, COMPLETED})
      provisional_hbo_covered_cents = min(prov_n, cap) * rate
      # FINAL: count only COMPLETED sessions
      final_n = count(HboSession of plan where status == COMPLETED)
      finalized_hbo_covered_cents = min(final_n, cap) * rate
    input_set: "HboSessions of the plan filtered by status; cap+rate from patient's PayerPolicy"
    constants: {}
    precision: "whole cents"
    variants:
      - name: provisional_estimate
        when: "Any HBO scheduling/completion event"
        difference: "Includes SCHEDULED and COMPLETED sessions"
      - name: finalized
        when: "OutcomeReport creation"
        difference: "Includes only COMPLETED sessions"
    note: "Rule 1 dual-variant on PLAN/cost domain; different entity domain from healing_trajectory"

  - name: chamber_overlap_check
    trigger: "HboSession schedule"
    algorithm: interval_merge
    formula: |
      A new session on chamber C with [new.start, new.end) is REJECTED if there
      exists any HboSession S on C with status==SCHEDULED such that the intervals,
      EACH padded on the right by C.turnover_buffer_minutes, intersect:
        new.start < (S.end + buffer)  AND  S.start < (new.end + buffer)
      Half-open [start,end); the mandatory turnover buffer means two dives that
      merely touch (new.start == S.end) still collide unless buffer==0.
    input_set: "SCHEDULED HboSessions on the same chamber_id"
    note: "Rule 8 instance A: half-open interval + right-padded turnover buffer"

  - name: debridement_overlap_check
    trigger: "DebridementProcedure schedule"
    algorithm: interval_merge
    formula: |
      A new procedure for clinician K with CLOSED interval [new.start, new.end]
      is REJECTED if there exists a DebridementProcedure P for the same
      clinician_id with status==SCHEDULED whose closed interval strictly overlaps:
        new.start < P.end  AND  P.start < new.end
      No buffer; closed intervals that merely touch endpoints
      (new.start == P.end) are ALLOWED (adjacent booking permitted).
    input_set: "SCHEDULED DebridementProcedures for the same clinician_id"
    note: "Rule 8 instance B: closed interval, no buffer, touching endpoints allowed — distinct semantics from chamber_overlap_check"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path/body-referenced resources exist"
    error_id: "ERR_NOT_FOUND / ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: state
    check: "OCC: expected_plan_version (when supplied) matches TreatmentPlan.version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /wound-care/hbo-sessions, POST /wound-care/supply-orders"
  - priority: 5
    category: state
    check: "Target resource in the correct state for the requested transition"
    error_id: "ERR_*_NOT_* (state-specific, e.g., ERR_PLAN_NOT_ACTIVE)"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_referential
    check: "Referenced clinician_id/chamber_id belongs to the same center as the plan's patient"
    error_id: ERR_CROSS_CENTER_REFERENCE
    http_status: 409
    applies_to: "POST /wound-care/debridement-procedures, POST /wound-care/hbo-sessions"
  - priority: 7
    category: business_safety
    check: "Debridement clinician role_kind must be WOUND"
    error_id: ERR_CLINICIAN_ROLE_MISMATCH
    http_status: 409
    applies_to: "POST /wound-care/debridement-procedures"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: the AttendingPhysician initiating an AcuteTransfer must not be the X-User-ID that completed any DebridementProcedure on the patient's plan"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /wound-care/acute-transfers"
  - priority: 9
    category: business_temporal
    check: "Chamber temporal-overlap (half-open + turnover buffer)"
    error_id: ERR_CHAMBER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /wound-care/hbo-sessions"
  - priority: 10
    category: business_temporal
    check: "Clinician debridement temporal-overlap (closed interval, no buffer)"
    error_id: ERR_CLINICIAN_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /wound-care/debridement-procedures"
  - priority: 11
    category: business_constraint
    check: "HboSession may be scheduled only when TreatmentPlan.coverage_status == COVERED (cross-entity: Session depends on Plan)"
    error_id: ERR_COVERAGE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /wound-care/hbo-sessions"
  - priority: 12
    category: business_fiscal
    check: "SupplyOrder covered_cents plus existing provisional_covered_cents must not exceed debridement_supply_budget_cents"
    error_id: ERR_SUPPLY_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /wound-care/supply-orders"
  - priority: 13
    category: business_constraint
    check: "Enum/field validity (stage, tissue_type, supply_kind, role_kind, coverage_rate in [0,1], positive dimensions, window_end > window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "create endpoints"

# =============================================================================
# Table 5: API Endpoint Table (FLAT — every entity a collection under /wound-care)
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock."
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: [center_id, to_iso8601]
    output: Center
    side_effects: ["Center.current_utc = to_iso8601"]

  # ---- Center ----
  - method: POST
    path: "/wound-care/centers"
    description: "Create a Center"
    roles: [IntakeCoordinator]
    code: 201
    input: [name]
    output: Center
    side_effects: ["current_utc initialized to startup default"]
  - method: GET
    path: "/wound-care/centers"
    description: "List centers"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: "Center[]"
    side_effects: []
  - method: GET
    path: "/wound-care/centers/{centerId}"
    description: "Get a Center"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: Center
    side_effects: []

  # ---- Clinician ----
  - method: POST
    path: "/wound-care/clinicians"
    description: "Register a clinician"
    roles: [IntakeCoordinator]
    code: 201
    input: [center_id, name, role_kind, "active?"]
    output: Clinician
    side_effects: []
  - method: GET
    path: "/wound-care/clinicians"
    description: "List clinicians, optionally by center (FK reverse-reachability for Clinician.center_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["center_id?"]
    output: "Clinician[]"
    side_effects: []
  - method: GET
    path: "/wound-care/clinicians/{clinicianId}"
    description: "Get a clinician"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  # ---- Chamber ----
  - method: POST
    path: "/wound-care/chambers"
    description: "Register a hyperbaric chamber"
    roles: [IntakeCoordinator]
    code: 201
    input: [center_id, label, "turnover_buffer_minutes?"]
    output: Chamber
    side_effects: ["occupied_slot_count = 0"]
  - method: GET
    path: "/wound-care/chambers"
    description: "List chambers, optionally by center (FK reverse-reachability for Chamber.center_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["center_id?"]
    output: "Chamber[]"
    side_effects: []
  - method: GET
    path: "/wound-care/chambers/{chamberId}"
    description: "Get a chamber"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: Chamber
    side_effects: []

  # ---- PayerPolicy ----
  - method: POST
    path: "/wound-care/payer-policies"
    description: "Create a payer policy"
    roles: [PayerLiaison]
    code: 201
    input: [center_id, payer_name, "requires_prior_auth?", max_covered_hbo_sessions, per_session_cents, "min_healing_pct_threshold?"]
    output: PayerPolicy
    side_effects: []
  - method: GET
    path: "/wound-care/payer-policies"
    description: "List payer policies, optionally by center (FK reverse-reachability for PayerPolicy.center_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["center_id?"]
    output: "PayerPolicy[]"
    side_effects: []
  - method: GET
    path: "/wound-care/payer-policies/{policyId}"
    description: "Get a payer policy"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: PayerPolicy
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/wound-care/patients"
    description: "Create a patient (referral intake)"
    roles: [IntakeCoordinator]
    code: 201
    input: [center_id, mrn, full_name, payer_policy_id]
    output: Patient
    side_effects: ["status = INTAKE"]
  - method: GET
    path: "/wound-care/patients"
    description: "List patients, optionally by center (FK reverse-reachability for Patient.center_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["center_id?", "payer_policy_id?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/wound-care/patients/{patientId}"
    description: "Get a patient"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Referral ----
  - method: POST
    path: "/wound-care/referrals"
    description: "Create a referral"
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_id, source_provider, reason]
    output: Referral
    side_effects: ["status = RECEIVED"]
  - method: GET
    path: "/wound-care/referrals"
    description: "List referrals, optionally by patient (FK reverse-reachability for Referral.patient_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["patient_id?"]
    output: "Referral[]"
    side_effects: []
  - method: GET
    path: "/wound-care/referrals/{referralId}"
    description: "Get a referral"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/wound-care/referrals/{referralId}/request-info"
    description: "Move referral to NEEDS_INFO"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status RECEIVED -> NEEDS_INFO"]
  - method: POST
    path: "/wound-care/referrals/{referralId}/resubmit"
    description: "Return referral to RECEIVED"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status NEEDS_INFO -> RECEIVED"]
  - method: POST
    path: "/wound-care/referrals/{referralId}/accept"
    description: "Accept referral"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> ACCEPTED", "Patient.status INTAKE -> IN_CARE"]
  - method: POST
    path: "/wound-care/referrals/{referralId}/decline"
    description: "Decline referral"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["status -> DECLINED"]

  # ---- WoundAssessment ----
  - method: POST
    path: "/wound-care/wound-assessments"
    description: "Record a wound assessment (staging + measurement). Computes area_cm2 and severity_score, refreshes Patient.latest_wound_area_cm2, and may auto-HEAL the patient's active plan."
    roles: [WoundClinician]
    code: 201
    input: [patient_id, stage, length_cm, width_cm, tissue_type, "infected?"]
    output: WoundAssessment
    side_effects:
      - "assessed_at = Center.current_utc"
      - "area_cm2 and severity_score computed"
      - "Patient.latest_wound_area_cm2 refreshed"
      - "If patient has an ACTIVE plan and actual_healing_pct >= 100 or latest_wound_area_cm2 == 0: plan -> HEALED"
  - method: GET
    path: "/wound-care/wound-assessments"
    description: "List wound assessments, optionally by patient (FK reverse-reachability for WoundAssessment.patient_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["patient_id?"]
    output: "WoundAssessment[]"
    side_effects: []
  - method: GET
    path: "/wound-care/wound-assessments/{assessmentId}"
    description: "Get a wound assessment"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: WoundAssessment
    side_effects: []

  # ---- PhotoDocument ----
  - method: POST
    path: "/wound-care/photo-documents"
    description: "Attach a photo document to an assessment"
    roles: [WoundClinician]
    code: 201
    input: [wound_assessment_id, patient_id, image_uri]
    output: PhotoDocument
    side_effects: ["captured_at = Center.current_utc"]
  - method: GET
    path: "/wound-care/photo-documents"
    description: "List photo documents, optionally by assessment or patient (FK reverse-reachability for PhotoDocument.wound_assessment_id and PhotoDocument.patient_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["wound_assessment_id?", "patient_id?"]
    output: "PhotoDocument[]"
    side_effects: []
  - method: GET
    path: "/wound-care/photo-documents/{photoId}"
    description: "Get a photo document"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: PhotoDocument
    side_effects: []

  # ---- TreatmentPlan ----
  - method: POST
    path: "/wound-care/treatment-plans"
    description: "Create a treatment plan in DRAFT"
    roles: [WoundClinician]
    code: 201
    input: [patient_id, baseline_assessment_id, debridement_supply_budget_cents]
    output: TreatmentPlan
    side_effects: ["status = DRAFT", "coverage_status = PENDING", "provisional_covered_cents = 0"]
  - method: GET
    path: "/wound-care/treatment-plans"
    description: "List treatment plans, optionally by patient or baseline assessment (FK reverse-reachability for TreatmentPlan.patient_id and TreatmentPlan.baseline_assessment_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["patient_id?", "baseline_assessment_id?"]
    output: "TreatmentPlan[]"
    side_effects: []
  - method: GET
    path: "/wound-care/treatment-plans/{planId}"
    description: "Get a treatment plan"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []
  - method: POST
    path: "/wound-care/treatment-plans/{planId}/activate"
    description: "Activate a plan"
    roles: [WoundClinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status DRAFT -> ACTIVE", "increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/wound-care/treatment-plans/{planId}/suspend"
    description: "Suspend a plan; cascades scheduled HBO session cancellations and chamber slot releases"
    roles: [WoundClinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects:
      - "status ACTIVE -> SUSPENDED"
      - "SCHEDULED HboSessions -> CANCELLED"
      - "Chamber.occupied_slot_count decremented per cancelled session"
      - "increments TreatmentPlan.version by 1"
  - method: POST
    path: "/wound-care/treatment-plans/{planId}/resume"
    description: "Resume a suspended plan"
    roles: [WoundClinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status SUSPENDED -> ACTIVE", "increments TreatmentPlan.version by 1"]
  - method: POST
    path: "/wound-care/treatment-plans/{planId}/outcome-report"
    description: "Close a plan and generate its OutcomeReport (final healing + coverage)"
    roles: [WoundClinician]
    code: 201
    input: []
    output: OutcomeReport
    side_effects:
      - "status -> CLOSED"
      - "OutcomeReport created (FINAL)"
      - "finalized_hbo_covered_cents computed and copied onto plan"
      - "increments TreatmentPlan.version by 1"

  # ---- PriorAuthorization ----
  - method: POST
    path: "/wound-care/prior-authorizations"
    description: "Submit a prior authorization request"
    roles: [PayerLiaison]
    code: 201
    input: [treatment_plan_id, requested_hbo_sessions, clinical_justification]
    output: PriorAuthorization
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/wound-care/prior-authorizations"
    description: "List prior authorizations, optionally by plan (FK reverse-reachability for PriorAuthorization.treatment_plan_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["treatment_plan_id?"]
    output: "PriorAuthorization[]"
    side_effects: []
  - method: GET
    path: "/wound-care/prior-authorizations/{authId}"
    description: "Get a prior authorization"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []
  - method: POST
    path: "/wound-care/prior-authorizations/{authId}/request-info"
    description: "Payer requests additional info"
    roles: [PayerLiaison]
    code: 200
    input: [info_request_note]
    output: PriorAuthorization
    side_effects: ["status SUBMITTED -> ADDITIONAL_INFO_REQUESTED", "set info_request_note"]
  - method: POST
    path: "/wound-care/prior-authorizations/{authId}/resubmit"
    description: "Resubmit after providing info"
    roles: [PayerLiaison]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: ["status ADDITIONAL_INFO_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/wound-care/prior-authorizations/{authId}/approve"
    description: "Approve the authorization; plan becomes COVERED"
    roles: [PayerLiaison]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects:
      - "status -> APPROVED"
      - "TreatmentPlan.coverage_status -> COVERED"
      - "recompute provisional_hbo_covered_cents"
      - "increments TreatmentPlan.version by 1"
  - method: POST
    path: "/wound-care/prior-authorizations/{authId}/deny"
    description: "Deny the authorization; cascades coverage removal and supply rejection"
    roles: [PayerLiaison]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects:
      - "status -> DENIED"
      - "TreatmentPlan.coverage_status -> NOT_COVERED"
      - "SUBMITTED SupplyOrders -> REJECTED with provisional_covered_cents credit"
      - "increments TreatmentPlan.version by 1"

  # ---- DebridementProcedure ----
  - method: POST
    path: "/wound-care/debridement-procedures"
    description: "Schedule a debridement procedure on a clinician (closed-interval overlap check)"
    roles: [WoundClinician]
    code: 201
    input: [treatment_plan_id, clinician_id, window_start, window_end]
    output: DebridementProcedure
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/wound-care/debridement-procedures"
    description: "List debridement procedures, optionally by plan or clinician (FK reverse-reachability for DebridementProcedure.treatment_plan_id and DebridementProcedure.clinician_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["treatment_plan_id?", "clinician_id?"]
    output: "DebridementProcedure[]"
    side_effects: []
  - method: GET
    path: "/wound-care/debridement-procedures/{procId}"
    description: "Get a debridement procedure"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: DebridementProcedure
    side_effects: []
  - method: POST
    path: "/wound-care/debridement-procedures/{procId}/complete"
    description: "Complete a debridement (records performing user for segregation of duties)"
    roles: [WoundClinician]
    code: 200
    input: []
    output: DebridementProcedure
    side_effects: ["status -> COMPLETED", "performed_by_user_id = X-User-ID"]
  - method: POST
    path: "/wound-care/debridement-procedures/{procId}/cancel"
    description: "Cancel a scheduled debridement"
    roles: [WoundClinician]
    code: 200
    input: []
    output: DebridementProcedure
    side_effects: ["status -> CANCELLED"]

  # ---- HboSession ----
  - method: POST
    path: "/wound-care/hbo-sessions"
    description: "Schedule an HBO session in a chamber (half-open + buffer overlap check; requires COVERED plan; OCC on plan version)"
    roles: [HyperbaricTech]
    code: 201
    input: [treatment_plan_id, chamber_id, window_start, window_end, treatment_pressure_ata, expected_plan_version]
    output: HboSession
    side_effects:
      - "status = SCHEDULED"
      - "Chamber.occupied_slot_count += 1"
      - "recompute provisional_hbo_covered_cents"
      - "increments TreatmentPlan.version by 1"
  - method: GET
    path: "/wound-care/hbo-sessions"
    description: "List HBO sessions, optionally by plan or chamber (FK reverse-reachability for HboSession.treatment_plan_id and HboSession.chamber_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["treatment_plan_id?", "chamber_id?"]
    output: "HboSession[]"
    side_effects: []
  - method: GET
    path: "/wound-care/hbo-sessions/{sessionId}"
    description: "Get an HBO session"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: HboSession
    side_effects: []
  - method: POST
    path: "/wound-care/hbo-sessions/{sessionId}/complete"
    description: "Complete an HBO session (dive log required, non-empty)"
    roles: [HyperbaricTech]
    code: 200
    input: [dive_log_entries]
    output: HboSession
    side_effects:
      - "status -> COMPLETED"
      - "persist dive_log_entries"
      - "Chamber.occupied_slot_count -= 1"
      - "recompute provisional_hbo_covered_cents"
  - method: POST
    path: "/wound-care/hbo-sessions/{sessionId}/cancel"
    description: "Cancel a scheduled HBO session (releases chamber slot)"
    roles: [HyperbaricTech]
    code: 200
    input: []
    output: HboSession
    side_effects:
      - "status -> CANCELLED"
      - "Chamber.occupied_slot_count -= 1"
      - "recompute provisional_hbo_covered_cents"

  # ---- SupplyOrder ----
  - method: POST
    path: "/wound-care/supply-orders"
    description: "Submit an advanced-dressing / graft supply order (budget check; OCC on plan version)"
    roles: [WoundClinician]
    code: 201
    input: [treatment_plan_id, supply_kind, line_items, expected_plan_version]
    output: SupplyOrder
    side_effects:
      - "status = SUBMITTED"
      - "covered_cents computed (supply_reimbursement)"
      - "TreatmentPlan.provisional_covered_cents += covered_cents"
      - "increments TreatmentPlan.version by 1"
  - method: GET
    path: "/wound-care/supply-orders"
    description: "List supply orders, optionally by plan (FK reverse-reachability for SupplyOrder.treatment_plan_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["treatment_plan_id?"]
    output: "SupplyOrder[]"
    side_effects: []
  - method: GET
    path: "/wound-care/supply-orders/{orderId}"
    description: "Get a supply order"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: SupplyOrder
    side_effects: []
  - method: POST
    path: "/wound-care/supply-orders/{orderId}/approve"
    description: "Approve a supply order"
    roles: [PayerLiaison]
    code: 200
    input: []
    output: SupplyOrder
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/wound-care/supply-orders/{orderId}/reject"
    description: "Reject a supply order (credits back covered_cents)"
    roles: [PayerLiaison]
    code: 200
    input: []
    output: SupplyOrder
    side_effects: ["status -> REJECTED", "TreatmentPlan.provisional_covered_cents -= covered_cents"]
  - method: POST
    path: "/wound-care/supply-orders/{orderId}/cancel"
    description: "Cancel a supply order (credits back covered_cents)"
    roles: [WoundClinician]
    code: 200
    input: []
    output: SupplyOrder
    side_effects: ["status -> CANCELLED", "TreatmentPlan.provisional_covered_cents -= covered_cents"]

  # ---- AcuteTransfer ----
  - method: POST
    path: "/wound-care/acute-transfers"
    description: "Initiate a transfer to acute care; cascades plan suspension and session cancellations"
    roles: [AttendingPhysician]
    code: 201
    input: [patient_id, destination_facility, clinical_reason]
    output: AcuteTransfer
    side_effects:
      - "status = INITIATED"
      - "initiated_by_user_id = X-User-ID"
      - "Patient.status IN_CARE -> TRANSFERRED"
      - "Patient's ACTIVE TreatmentPlan -> SUSPENDED (cascade)"
      - "That plan's SCHEDULED HboSessions -> CANCELLED (cascade)"
      - "Each cancelled session decrements its Chamber.occupied_slot_count (cascade)"
  - method: GET
    path: "/wound-care/acute-transfers"
    description: "List acute transfers, optionally by patient (FK reverse-reachability for AcuteTransfer.patient_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["patient_id?"]
    output: "AcuteTransfer[]"
    side_effects: []
  - method: GET
    path: "/wound-care/acute-transfers/{transferId}"
    description: "Get an acute transfer"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: AcuteTransfer
    side_effects: []
  - method: POST
    path: "/wound-care/acute-transfers/{transferId}/accept"
    description: "Accepting facility confirms the transfer"
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: AcuteTransfer
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/wound-care/acute-transfers/{transferId}/cancel"
    description: "Cancel an unaccepted transfer; restores patient to care"
    roles: [AttendingPhysician]
    code: 200
    input: []
    output: AcuteTransfer
    side_effects: ["status -> CANCELLED", "Patient.status TRANSFERRED -> IN_CARE"]

  # ---- OutcomeReport (read) ----
  - method: GET
    path: "/wound-care/outcome-reports"
    description: "List outcome reports, optionally by plan (FK reverse-reachability for OutcomeReport.treatment_plan_id)"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: ["treatment_plan_id?"]
    output: "OutcomeReport[]"
    side_effects: []
  - method: GET
    path: "/wound-care/outcome-reports/{reportId}"
    description: "Get an outcome report"
    roles: [IntakeCoordinator, WoundClinician, HyperbaricTech, PayerLiaison, AttendingPhysician]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- not found ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found" }
  - { id: ERR_CENTER_NOT_FOUND, http: 404, condition: "Center not found" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient not found" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral not found" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Wound assessment not found" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Treatment plan not found" }
  - { id: ERR_AUTH_NOT_FOUND, http: 404, condition: "Prior authorization not found" }
  - { id: ERR_PROC_NOT_FOUND, http: 404, condition: "Debridement procedure not found" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "HBO session not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Supply order not found" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "Acute transfer not found" }
  - { id: ERR_CHAMBER_NOT_FOUND, http: 404, condition: "Chamber not found" }
  - { id: ERR_CLINICIAN_NOT_FOUND, http: 404, condition: "Clinician not found" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Payer policy not found" }
  # --- input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, non-positive dimension, coverage_rate out of [0,1], or window_end <= window_start" }
  # --- OCC ---
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version does not match TreatmentPlan.version" }
  # --- referral state ---
  - { id: ERR_REFERRAL_NOT_RECEIVED, http: 409, condition: "Referral not in RECEIVED for accept/decline/request-info" }
  - { id: ERR_REFERRAL_NOT_NEEDS_INFO, http: 409, condition: "Referral not in NEEDS_INFO for resubmit" }
  - { id: ERR_NO_ASSESSMENT_ON_FILE, http: 409, condition: "Referral accept requires at least one wound assessment" }
  # --- plan state ---
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Plan not in DRAFT for activate" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Plan not in ACTIVE for the requested operation" }
  - { id: ERR_PLAN_NOT_SUSPENDED, http: 409, condition: "Plan not in SUSPENDED for resume" }
  - { id: ERR_PLAN_NOT_CLOSEABLE, http: 409, condition: "Plan not in ACTIVE or SUSPENDED for outcome-report" }
  - { id: ERR_PATIENT_NOT_IN_CARE, http: 409, condition: "Patient not IN_CARE for the requested operation" }
  - { id: ERR_COVERAGE_DENIED, http: 409, condition: "Plan coverage_status is NOT_COVERED at activate" }
  - { id: ERR_OPEN_SESSIONS_EXIST, http: 409, condition: "SCHEDULED HBO sessions remain when closing plan" }
  # --- prior authorization state ---
  - { id: ERR_AUTH_NOT_SUBMITTED, http: 409, condition: "Prior authorization not in SUBMITTED for approve/deny/request-info" }
  - { id: ERR_AUTH_NOT_AWAITING_INFO, http: 409, condition: "Prior authorization not in ADDITIONAL_INFO_REQUESTED for resubmit" }
  # --- procedure / session / order / transfer state ---
  - { id: ERR_PROC_NOT_SCHEDULED, http: 409, condition: "Debridement procedure not in SCHEDULED for complete/cancel" }
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "HBO session not in SCHEDULED for complete/cancel" }
  - { id: ERR_ORDER_NOT_SUBMITTED, http: 409, condition: "Supply order not in SUBMITTED for approve/reject/cancel" }
  - { id: ERR_TRANSFER_NOT_INITIATED, http: 409, condition: "Acute transfer not in INITIATED for accept/cancel" }
  # --- business referential / safety ---
  - { id: ERR_CROSS_CENTER_REFERENCE, http: 409, condition: "Referenced chamber/clinician belongs to a different center than the plan's patient" }
  - { id: ERR_CLINICIAN_ROLE_MISMATCH, http: 409, condition: "Debridement clinician role_kind is not WOUND" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Transfer initiator also completed a debridement on the patient's plan" }
  # --- business temporal ---
  - { id: ERR_CHAMBER_SLOT_CONFLICT, http: 409, condition: "HBO session overlaps an existing SCHEDULED session on the same chamber (half-open + buffer)" }
  - { id: ERR_CLINICIAN_SLOT_CONFLICT, http: 409, condition: "Debridement overlaps an existing SCHEDULED procedure for the same clinician (closed interval)" }
  # --- business constraint / fiscal ---
  - { id: ERR_COVERAGE_NOT_ACTIVE, http: 409, condition: "HBO scheduling requires plan coverage_status == COVERED" }
  - { id: ERR_SUPPLY_BUDGET_EXCEEDED, http: 402, condition: "Supply order would push provisional_covered_cents over the plan's budget" }
  - { id: ERR_EMPTY_DIVE_LOG, http: 409, condition: "HBO session complete requires a non-empty dive_log_entries" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Front-desk intake: centers, patients, referrals, clinicians/chambers registration"
    identity: opaque
    exclusive_operations:
      - "POST /wound-care/centers — Create center"
      - "POST /wound-care/clinicians — Register clinician"
      - "POST /wound-care/chambers — Register chamber"
      - "POST /wound-care/patients — Create patient"
      - "POST /wound-care/referrals — Create referral"
      - "POST /wound-care/referrals/{id}/request-info — Referral needs info"
      - "POST /wound-care/referrals/{id}/resubmit — Referral resubmit"
      - "POST /wound-care/referrals/{id}/accept — Accept referral"
      - "POST /wound-care/referrals/{id}/decline — Decline referral"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc — Set clock"

  - name: WoundClinician
    description: "Wound-care clinician: assessments, photos, plans, debridements, supply orders"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /wound-care/wound-assessments — Record assessment"
      - "POST /wound-care/photo-documents — Attach photo"
      - "POST /wound-care/treatment-plans — Create plan"
      - "POST /wound-care/treatment-plans/{id}/activate — Activate plan"
      - "POST /wound-care/treatment-plans/{id}/suspend — Suspend plan"
      - "POST /wound-care/treatment-plans/{id}/resume — Resume plan"
      - "POST /wound-care/treatment-plans/{id}/outcome-report — Close plan + report"
      - "POST /wound-care/debridement-procedures — Schedule debridement"
      - "POST /wound-care/debridement-procedures/{id}/complete — Complete debridement"
      - "POST /wound-care/debridement-procedures/{id}/cancel — Cancel debridement"
      - "POST /wound-care/supply-orders — Submit supply order"
      - "POST /wound-care/supply-orders/{id}/cancel — Cancel supply order"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc — Set clock"

  - name: HyperbaricTech
    description: "Hyperbaric technician: HBO session scheduling, completion, cancellation, dive logs"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /wound-care/hbo-sessions — Schedule HBO session"
      - "POST /wound-care/hbo-sessions/{id}/complete — Complete session"
      - "POST /wound-care/hbo-sessions/{id}/cancel — Cancel session"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc — Set clock"

  - name: PayerLiaison
    description: "Payer liaison: payer policies, prior authorizations, supply-order approvals/rejections"
    identity: opaque
    exclusive_operations:
      - "POST /wound-care/payer-policies — Create policy"
      - "POST /wound-care/prior-authorizations — Submit auth"
      - "POST /wound-care/prior-authorizations/{id}/request-info — Request info"
      - "POST /wound-care/prior-authorizations/{id}/resubmit — Resubmit auth"
      - "POST /wound-care/prior-authorizations/{id}/approve — Approve auth"
      - "POST /wound-care/prior-authorizations/{id}/deny — Deny auth"
      - "POST /wound-care/supply-orders/{id}/approve — Approve supply"
      - "POST /wound-care/supply-orders/{id}/reject — Reject supply"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc — Set clock"

  - name: AttendingPhysician
    description: "Attending physician: acute transfers (segregation of duties from debridement performer)"
    identity: opaque
    exclusive_operations:
      - "POST /wound-care/acute-transfers — Initiate transfer"
      - "POST /wound-care/acute-transfers/{id}/accept — Accept transfer"
      - "POST /wound-care/acute-transfers/{id}/cancel — Cancel transfer"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc — Set clock"
