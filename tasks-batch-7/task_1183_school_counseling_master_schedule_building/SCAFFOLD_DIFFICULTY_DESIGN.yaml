scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tally_preview_vs_final_section_count
        grounds:
          - calculations.section_count_tally
          - entities.AcademicTerm.fields.total_requested_seats
          - entities.CourseRequest.fields.tally_weight
        distinguishing_aspect: |
          Entity domain = Course/Section planning. For identical catalog data,
          the optimistic_tally variant counts DRAFT requests at halved weight
          (0.5 primary / 0.25 alternate) while final_tally excludes DRAFT rows
          entirely: pinned inputs give preview demand 26.0 -> 2 sections
          (ceil(26.0/25)) versus final demand 25.0 -> 1 section (ceil(25.0/25)).
        test_recipe:
          setup:
            - "Term T (periods_per_day=8, max_students_per_section=32, class_size_target=25, singleton_section_cap=2, change_request_max_per_student=3) in COLLECTING."
            - "Course C1 (MATH-301, credits=1.0, MATH, grade band 9-12, not singleton)."
            - "27 students (s1..s27) grade 9, program NONE, all on counselor c1 (max_caseload 100)."
            - "s1..s25 hold SUBMITTED primary requests for C1 (rank 1); s26, s27 hold DRAFT primary requests for C1 (rank 1)."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C One", max_caseload: 100 }
              as: Administrator
              captures: { c1: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2026-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term1: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "MATH-301", title: "Algebra II", credits: 1.0, subject_area: "MATH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { crs1: "$.data.id" }
            # students s01..s25: create + request + submit (test-generator loops
            # the same 3-call pattern 25 times with external_ref S01..S25);
            # first and second iterations written out as the canonical pattern:
            - call: "POST /scheduling/students"
              payload: { external_ref: "S01", full_name: "Stu 01", grade_level: 9, counselor_id: "${c1}" }
              as: Administrator
              captures: { s01: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s01}", course_id: "${crs1}", term_id: "${term1}", priority_rank: 1 }
              as: Student
              as_user_id: "${s01}"
              captures: { r01: "$.data.id" }
            - call: "POST /scheduling/course-requests/${r01}/submit"
              payload: {}
              as: Student
              as_user_id: "${s01}"
            - call: "POST /scheduling/students"
              payload: { external_ref: "S02", full_name: "Stu 02", grade_level: 9, counselor_id: "${c1}" }
              as: Administrator
              captures: { s02: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s02}", course_id: "${crs1}", term_id: "${term1}", priority_rank: 1 }
              as: Student
              as_user_id: "${s02}"
              captures: { r02: "$.data.id" }
            - call: "POST /scheduling/course-requests/${r02}/submit"
              payload: {}
              as: Student
              as_user_id: "${s02}"
            # ... s03..s25 repeat the identical 3-call triplet (23 more) ...
            # 2 students left in DRAFT (no submit call):
            - call: "POST /scheduling/students"
              payload: { external_ref: "S26", full_name: "Stu 26", grade_level: 9, counselor_id: "${c1}" }
              as: Administrator
              captures: { s26: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s26}", course_id: "${crs1}", term_id: "${term1}", priority_rank: 1 }
              as: Student
              as_user_id: "${s26}"
            - call: "POST /scheduling/students"
              payload: { external_ref: "S27", full_name: "Stu 27", grade_level: 9, counselor_id: "${c1}" }
              as: Administrator
              captures: { s27: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s27}", course_id: "${crs1}", term_id: "${term1}", priority_rank: 1 }
              as: Student
              as_user_id: "${s27}"
          trigger:
            - call: "GET /scheduling/terms/${term1}/tally-preview"
              as: Administrator
              captures: { preview_rows: "$.data.rows" }
            - call: "POST /scheduling/terms/${term1}/close-collection"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/terms/${term1}/generate-sections"
              payload: {}
              as: Administrator
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { final_sections: "$.data" }
          assert:
            - "tally-preview rows report demand == 26.0 (25*1.0 + 2*0.5 halved DRAFT primary weight = 25 + 1.0) and projected_sections == 2 (ceil(26.0/25))"
            - "close-collection WITHDRAWS the 2 DRAFT requests; generate-sections creates exactly 1 DRAFT section for course ${crs1} (final demand 25.0 -> ceil(25.0/25) == 1)"
            - "GET /scheduling/sections?term_id=${term1}&course_id=${crs1} returns exactly 1 row"
      - name: credit_projection_vs_final_audit
        grounds:
          - calculations.credit_pace_requirement
          - entities.CreditAudit.fields.projected_credits
          - entities.Student.fields.planned_credit_load
        distinguishing_aspect: |
          Entity domain = Student credit standing (different domain from the
          Course/Section tally instance). provisional_projection counts SUBMITTED
          primary request credits; final_audit counts only ENROLLED placements —
          the pinned student's ART/PE requests go UNPLACED (their capacity-1
          sections are taken by earlier-created fillers), so projected_credits
          is 16.0 provisionally vs 14.0 final and deficiency_credits 2.0 vs 4.0
          at grade-11 pace 18.0.
        test_recipe:
          setup:
            - "Term T2 (periods 8, max 32, target 25, singleton cap 2, change max 3) in COLLECTING."
            - "6 courses (ENG-101, MAT-101, SCI-101, SOC-101, ART-101, PE-101), each 1.0 credit, grade band 9-12, STANDARD rooms, not singleton."
            - "s_main (grade 11, earned 10.0) holds 6 SUBMITTED primaries (ranks 1..6)."
            - "Fillers f1, f2 (created BEFORE s_main's requests) hold rank-1 SUBMITTED requests for ART-101 and PE-101 respectively; ART/PE sections are scheduled with capacity 1."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Two", max_caseload: 100 }
              as: Administrator
              captures: { c2: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2027-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term2: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "ENG-101", title: "English 9", credits: 1.0, subject_area: "ENGLISH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k1: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "MAT-101", title: "Math 9", credits: 1.0, subject_area: "MATH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k2: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "SCI-101", title: "Sci 9", credits: 1.0, subject_area: "SCIENCE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k3: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "SOC-101", title: "Soc 9", credits: 1.0, subject_area: "SOCIAL_STUDIES", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k4: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "ART-101", title: "Art", credits: 1.0, subject_area: "ARTS", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k5: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "PE-101", title: "PE", credits: 1.0, subject_area: "PE_HEALTH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k6: "$.data.id" }
            - call: "POST /scheduling/teachers"
              payload: { full_name: "T Main", max_sections: 10 }
              as: Administrator
              captures: { t_main: "$.data.id" }
            - call: "POST /scheduling/rooms"
              payload: { room_number: "A-1", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm1: "$.data.id" }
            - call: "POST /scheduling/rooms"
              payload: { room_number: "A-2", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm2: "$.data.id" }
            - call: "POST /scheduling/rooms"
              payload: { room_number: "A-3", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm3: "$.data.id" }
            - call: "POST /scheduling/rooms"
              payload: { room_number: "A-4", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm4: "$.data.id" }
            # main student
            - call: "POST /scheduling/students"
              payload: { external_ref: "M1", full_name: "Main Stu", grade_level: 11, counselor_id: "${c2}", earned_credits: 10.0 }
              as: Administrator
              captures: { s_main: "$.data.id" }
            # fillers created BEFORE s_main's requests so their requests' created_at is earlier
            - call: "POST /scheduling/students"
              payload: { external_ref: "F1", full_name: "Fill One", grade_level: 11, counselor_id: "${c2}", earned_credits: 10.0 }
              as: Administrator
              captures: { f1: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "F2", full_name: "Fill Two", grade_level: 11, counselor_id: "${c2}", earned_credits: 10.0 }
              as: Administrator
              captures: { f2: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${f1}", course_id: "${k5}", term_id: "${term2}", priority_rank: 1 }
              as: Student
              as_user_id: "${f1}"
              captures: { fr1: "$.data.id" }
            - call: "POST /scheduling/course-requests/${fr1}/submit"
              payload: {}
              as: Student
              as_user_id: "${f1}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${f2}", course_id: "${k6}", term_id: "${term2}", priority_rank: 1 }
              as: Student
              as_user_id: "${f2}"
              captures: { fr2: "$.data.id" }
            - call: "POST /scheduling/course-requests/${fr2}/submit"
              payload: {}
              as: Student
              as_user_id: "${f2}"
            # s_main's 6 primaries
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_main}", course_id: "${k1}", term_id: "${term2}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_main}"
              captures: { mr1: "$.data.id" }
            - call: "POST /scheduling/course-requests/${mr1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_main}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_main}", course_id: "${k2}", term_id: "${term2}", priority_rank: 2 }
              as: Student
              as_user_id: "${s_main}"
              captures: { mr2: "$.data.id" }
            - call: "POST /scheduling/course-requests/${mr2}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_main}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_main}", course_id: "${k3}", term_id: "${term2}", priority_rank: 3 }
              as: Student
              as_user_id: "${s_main}"
              captures: { mr3: "$.data.id" }
            - call: "POST /scheduling/course-requests/${mr3}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_main}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_main}", course_id: "${k4}", term_id: "${term2}", priority_rank: 4 }
              as: Student
              as_user_id: "${s_main}"
              captures: { mr4: "$.data.id" }
            - call: "POST /scheduling/course-requests/${mr4}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_main}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_main}", course_id: "${k5}", term_id: "${term2}", priority_rank: 5 }
              as: Student
              as_user_id: "${s_main}"
              captures: { mr5: "$.data.id" }
            - call: "POST /scheduling/course-requests/${mr5}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_main}"
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_main}", course_id: "${k6}", term_id: "${term2}", priority_rank: 6 }
              as: Student
              as_user_id: "${s_main}"
              captures: { mr6: "$.data.id" }
            - call: "POST /scheduling/course-requests/${mr6}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_main}"
            # provisional projection read while still COLLECTING
            - call: "GET /scheduling/students/${s_main}/credit-projection"
              as: Administrator
              captures: { prov_projected: "$.data.projected_credits", prov_deficiency: "$.data.deficiency_credits" }
            # drive term to BUILDING
            - call: "POST /scheduling/terms/${term2}/close-collection"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/terms/${term2}/generate-sections"
              payload: {}
              as: Administrator
            # qualify teacher for all 6 courses
            - call: "POST /scheduling/teachers/${t_main}/qualifications"
              payload: { course_id: "${k1}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/teachers/${t_main}/qualifications"
              payload: { course_id: "${k2}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/teachers/${t_main}/qualifications"
              payload: { course_id: "${k3}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/teachers/${t_main}/qualifications"
              payload: { course_id: "${k4}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/teachers/${t_main}/qualifications"
              payload: { course_id: "${k5}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/teachers/${t_main}/qualifications"
              payload: { course_id: "${k6}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            # NOTE for the test-generator: fetch each course's single DRAFT
            # section via GET /scheduling/sections?term_id=${term2}&course_id=...
            # and PATCH it with teacher ${t_main}, rooms rm1..rm4 cycling,
            # periods 1..6 (one per section), capacity 32 for k1..k4 and
            # capacity 1 for k5 (ART) and k6 (PE). Re-read GET
            # /scheduling/terms/${term2} before every PATCH because each PATCH
            # bumps term.version by 1 (OCC input expected_term_version).
            - call: "GET /scheduling/terms/${term2}"
              as: Administrator
              captures: { term2_v: "$.data.version" }
            - call: "POST /scheduling/terms/${term2}/publish"
              payload: {}
              as: Administrator
          trigger:
            - call: "GET /scheduling/students/${s_main}/credit-audit"
              as: Administrator
              captures: { final_projected: "$.data.projected_credits", final_deficiency: "$.data.deficiency_credits" }
            - call: "GET /scheduling/students/${s_main}"
              as: Administrator
              captures: { main_load: "$.data.planned_credit_load", main_flag: "$.data.credit_deficient" }
          assert:
            - "provisional projection: projected_credits == 16.0 (10.0 earned + 6.0 requested), deficiency_credits == 2.0 (18.0 - 16.0)"
            - "final audit: projected_credits == 14.0 (ART/PE requests UNPLACED — the capacity-1 sections went to fillers f1/f2), deficiency_credits == 4.0 (18.0 - 14.0)"
            - "Student.${s_main}.planned_credit_load == 4.0 and credit_deficient == true"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recovery_priority_four_input_scoring
        grounds:
          - calculations.recovery_priority
          - entities.RecoveryPlacement.fields.priority_score
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — priority_score combines
          deficiency_credits, grade_level, and two conditional core-subject
          flags from the latest CreditAudit. Pinned: grade-12 student with
          deficiency 2.5 and ENGLISH-only flag -> 10*2.5 + 2*4 + 3*1 + 3*0 =
          36.0; grade-9 student with deficiency 1.0 and ENGLISH+MATH flags ->
          10*1.0 + 2*1 + 3 + 3 = 18.0.
        test_recipe:
          setup:
            - "Term T3 in LOCKED with two deficient students carrying publish-time CreditAudits: s_hi (grade 12, earned 15.5, enrolled 4.0 non-ENGLISH credits -> projected 19.5, deficiency 2.5, ENGLISH flag) and s_lo (grade 9, earned 4.0, enrolled 1.0 SCIENCE credit -> projected 5.0, deficiency 1.0 at pace 6.0, ENGLISH+MATH flags)."
            - "Course ENG-401 exists for recovery targeting."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Three", max_caseload: 100 }
              as: Administrator
              captures: { c3: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2028-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term3: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "ENG-401", title: "English 12", credits: 1.0, subject_area: "ENGLISH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { e401: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "HI", full_name: "Hi Def", grade_level: 12, counselor_id: "${c3}", earned_credits: 15.5 }
              as: Administrator
              captures: { s_hi: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "LO", full_name: "Lo Def", grade_level: 9, counselor_id: "${c3}", earned_credits: 4.0 }
              as: Administrator
              captures: { s_lo: "$.data.id" }
            # NOTE for the test-generator: build the two students' enrolled
            # state via the same request -> close -> generate -> schedule ->
            # publish -> open-window -> close-window chain used by
            # credit_projection_vs_final_audit, with course mix pinned so the
            # publish audits read exactly: s_hi projected 19.5 / deficiency 2.5
            # / ENGLISH flag; s_lo projected 5.0 / deficiency 1.0 /
            # ENGLISH+MATH flags. Term ends in LOCKED.
          trigger:
            - call: "POST /scheduling/recovery-placements"
              payload: { student_id: "${s_hi}", term_id: "${term3}", target_course_id: "${e401}" }
              as: Counselor
              as_user_id: "${c3}"
              captures: { rp_hi: "$.data.id", score_hi: "$.data.priority_score" }
            - call: "POST /scheduling/recovery-placements"
              payload: { student_id: "${s_lo}", term_id: "${term3}", target_course_id: "${e401}" }
              as: Counselor
              as_user_id: "${c3}"
              captures: { rp_lo: "$.data.id", score_lo: "$.data.priority_score" }
          assert:
            - "RecoveryPlacement.${rp_hi}.priority_score == 36.0 (10*2.5 + 2*(12-8) + 3*1 + 3*0)"
            - "RecoveryPlacement.${rp_lo}.priority_score == 18.0 (10*1.0 + 2*(9-8) + 3*1 + 3*1)"
            - "score_hi != score_lo although both placements target the same course ${e401}"
      - name: counselor_utilization_nested_rounding
        grounds:
          - calculations.counselor_utilization
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-appointment
          durations are truncated to whole minutes FIRST, then summed, then
          divided by available_minutes, then rounded to 4 decimals. Pinned:
          appointments of 90 min 36 s and 20 min 24 s inside a 1-weekday window
          (360 available minutes): truncate-then-sum yields (90+20)/360 = 0.3056;
          the forbidden sum-then-round order would yield 111/360 = 0.3083.
        test_recipe:
          setup:
            - "Counselor c4 with student s_u (grade 10) on caseload; logical clock 2026-05-04T08:00:00Z (Monday)."
            - "Two BOOKED appointments for c4 inside window [2026-05-04T00:00:00Z, 2026-05-05T00:00:00Z): 09:00-10:30:36 and 13:00-13:20:24."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Four", max_caseload: 100 }
              as: Administrator
              captures: { c4: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "U1", full_name: "Util Stu", grade_level: 10, counselor_id: "${c4}" }
              as: Administrator
              captures: { s_u: "$.data.id" }
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c4}", student_id: "${s_u}", start_at: "2026-05-04T09:00:00Z", end_at: "2026-05-04T10:30:36Z" }
              as: Counselor
              as_user_id: "${c4}"
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c4}", student_id: "${s_u}", start_at: "2026-05-04T13:00:00Z", end_at: "2026-05-04T13:20:24Z" }
              as: Counselor
              as_user_id: "${c4}"
          trigger:
            - call: "GET /scheduling/counselors/${c4}/utilization"
              as: Administrator
              captures: { util_val: "$.data.utilization", util_booked: "$.data.booked_minutes" }
          assert:
            - "booked_minutes == 110 (90 + 20 after per-appointment whole-minute truncation of 90m36s and 20m24s)"
            - "utilization == 0.3056 (110/360 round_half_up 4dp), NOT 0.3083 (the sum-then-truncate result 111/360)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_request_revision_cycle
        grounds:
          - state_machines.ScheduleChangeRequest.SUBMITTED_to_COUNSELOR_REVIEW
          - state_machines.ScheduleChangeRequest.COUNSELOR_REVIEW_to_REVISED
          - state_machines.ScheduleChangeRequest.REVISED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic shape on ScheduleChangeRequest: SUBMITTED -> COUNSELOR_REVIEW
          -> REVISED -> SUBMITTED forms a re-entrant revision loop;
          reviewed_by_counselor_id resets to null on resubmit, proving loop
          state is not sticky.
        test_recipe:
          setup:
            - "Term T4 in CHANGE_WINDOW; student s_cyc enrolled in section sec_a (period 1); sec_b (period 2) has free capacity."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Five", max_caseload: 100 }
              as: Administrator
              captures: { c5: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2029-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term4: "$.data.id" }
            # NOTE for the test-generator: drive the term COLLECTING -> ... ->
            # CHANGE_WINDOW via the standard chain (2 courses, student s_cyc,
            # requests submitted, close, generate, qualify teacher, PATCH both
            # sections with re-read term versions, publish, open window);
            # s_cyc lands ENROLLED in the period-1 section (sec_a) via
            # auto-placement; sec_b is the period-2 section of the other course
            # with free seats.
            - call: "POST /scheduling/students"
              payload: { external_ref: "CYC", full_name: "Cyc Stu", grade_level: 10, counselor_id: "${c5}" }
              as: Administrator
              captures: { s_cyc: "$.data.id" }
            - call: "GET /scheduling/students/${s_cyc}/schedule"
              as: Administrator
              captures: { entry_a: "$.data[0].id" }
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_b: "$.data[1].id" }
          trigger:
            - call: "POST /scheduling/change-requests"
              payload: { student_id: "${s_cyc}", term_id: "${term4}", kind: "SWAP", drop_entry_id: "${entry_a}", add_section_id: "${sec_b}", reason: "Need different period for job" }
              as: Student
              as_user_id: "${s_cyc}"
              captures: { cr1: "$.data.id" }
            - call: "POST /scheduling/change-requests/${cr1}/claim"
              payload: {}
              as: Counselor
              as_user_id: "${c5}"
            - call: "POST /scheduling/change-requests/${cr1}/return-for-revision"
              payload: { revision_note: "Please justify the swap more fully" }
              as: Counselor
              as_user_id: "${c5}"
              captures: { cr_rev_state: "$.data.state" }
            - call: "POST /scheduling/change-requests/${cr1}/resubmit"
              payload: {}
              as: Student
              as_user_id: "${s_cyc}"
              captures: { cr_resub_state: "$.data.state", cr_rev_by: "$.data.reviewed_by_counselor_id" }
            - call: "POST /scheduling/change-requests/${cr1}/claim"
              payload: {}
              as: Counselor
              as_user_id: "${c5}"
              captures: { cr_reclaim_state: "$.data.state" }
          assert:
            - "state after return-for-revision == REVISED"
            - "state after resubmit == SUBMITTED (loop closed back to the cycle entry)"
            - "reviewed_by_counselor_id == null after resubmit (loop state reset)"
            - "second claim after resubmit succeeds (state == COUNSELOR_REVIEW): the cycle is re-entrant"
      - name: section_and_term_compound_rebalance_cycle
        grounds:
          - state_machines.Section.DRAFT_to_SCHEDULED
          - state_machines.Section.PUBLISHED_to_CANCELLED
          - state_machines.AcademicTerm.LOCKED_to_REBALANCING
        distinguishing_aspect: |
          Compound + cyclic shape on different entities: Section transitions are
          gated by the parent AcademicTerm's posture (compound guard), and the
          term cycles LOCKED -> REBALANCING -> LOCKED once per rebalance epoch
          while an empty PUBLISHED child section flips to CANCELLED — a
          parent-driven child transition, not a linear pipeline.
        test_recipe:
          setup:
            - "Term T5 in LOCKED (published, window opened and closed); sec_empty is PUBLISHED with enrolled_count == 0; sec_live is PUBLISHED with >= 1 enrollment."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Six", max_caseload: 100 }
              as: Administrator
              captures: { c6: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2030-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term5: "$.data.id" }
            # NOTE for the test-generator: standard chain to LOCKED with two
            # sections of one course; one section receives all enrollments,
            # the other (created later, hence later created_at tie-break
            # target) stays empty; then open + close the change window.
            - call: "GET /scheduling/terms/${term5}"
              as: Administrator
              captures: { term5_v: "$.data.version" }
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_empty: "$.data[0].id" }
          trigger:
            - call: "POST /scheduling/terms/${term5}/rebalance-runs"
              payload: { expected_term_version: "${term5_v}" }
              as: Administrator
              captures: { run1: "$.data.id", run1_epoch: "$.data.epoch" }
            - call: "GET /scheduling/sections/${sec_empty}"
              as: Administrator
              captures: { sec_empty_state: "$.data.state" }
            - call: "GET /scheduling/terms/${term5}"
              as: Administrator
              captures: { term5_posture: "$.data.posture", term5_epoch: "$.data.rebalance_epoch" }
          assert:
            - "RebalanceRun.${run1}.epoch == 1 and term.rebalance_epoch == 1"
            - "Section.${sec_empty}.state == CANCELLED (parent-run-driven child transition)"
            - "term posture == LOCKED after the run (REBALANCING is transient within the run)"
      - name: terminal_lockdown_cancelled_section_rejects_patch
        grounds:
          - state_machines.Section
        distinguishing_aspect: "Terminal lockdown on Section: a CANCELLED section rejects any further PATCH with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Term T5b in LOCKED; sec_term was CANCELLED by a prior rebalance run."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C SixB", max_caseload: 100 }
              as: Administrator
              captures: { c6b: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2030-SPR", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term5b: "$.data.id" }
            # NOTE for the test-generator: standard chain to LOCKED with an
            # empty PUBLISHED section cancelled by a first rebalance run.
            - call: "GET /scheduling/terms/${term5b}"
              as: Administrator
              captures: { term5b_v: "$.data.version" }
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_term: "$.data[0].id" }
            - call: "POST /scheduling/teachers"
              payload: { full_name: "T Term", max_sections: 5 }
              as: Administrator
              captures: { t_term: "$.data.id" }
            - call: "POST /scheduling/rooms"
              payload: { room_number: "TRM-1", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm_term: "$.data.id" }
          trigger:
            - call: "PATCH /scheduling/sections/${sec_term}"
              payload: { teacher_id: "${t_term}", room_id: "${rm_term}", period: 2, capacity: 32, expected_term_version: "${term5b_v}" }
              as: Administrator
              captures: { term_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (409): CANCELLED is terminal for Section"

  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: no_show_cascade_to_booking_freeze
        grounds:
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - calculations.no_show_freeze_check
          - "validations[priority=9]"
        distinguishing_aspect: |
          Depth-3 chain triggered by mark-no-show: (1) Appointment BOOKED ->
          NO_SHOW; (2) that transition recomputes the student's trailing
          no-show count; (3) the recomputed count crossing >= 3 flips
          bookability, so the NEXT appointment create for the same student is
          rejected ERR_NO_SHOW_FREEZE — the third hop is caused by the second,
          not by the original call.
        test_recipe:
          setup:
            - "Counselor c7, student s_ns (grade 11); 2 NO_SHOW appointments inside the 90-day window (2026-03-02, 2026-03-09) and 1 BOOKED appointment ap3 (2026-05-06 09:00-09:30); logical clock 2026-05-06T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Seven", max_caseload: 100 }
              as: Administrator
              captures: { c7: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "NS", full_name: "No Show", grade_level: 11, counselor_id: "${c7}" }
              as: Administrator
              captures: { s_ns: "$.data.id" }
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c7}", student_id: "${s_ns}", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T09:30:00Z" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { ap1: "$.data.id" }
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c7}", student_id: "${s_ns}", start_at: "2026-03-09T09:00:00Z", end_at: "2026-03-09T09:30:00Z" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { ap2: "$.data.id" }
            - call: "POST /scheduling/appointments/${ap1}/mark-no-show"
              payload: {}
              as: Counselor
              as_user_id: "${c7}"
            - call: "POST /scheduling/appointments/${ap2}/mark-no-show"
              payload: {}
              as: Counselor
              as_user_id: "${c7}"
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c7}", student_id: "${s_ns}", start_at: "2026-05-06T09:00:00Z", end_at: "2026-05-06T09:30:00Z" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { ap3: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T12:00:00Z" }
              as: Administrator
          trigger:
            - call: "POST /scheduling/appointments/${ap3}/mark-no-show"
              payload: {}
              as: Counselor
              as_user_id: "${c7}"
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c7}", student_id: "${s_ns}", start_at: "2026-05-07T09:00:00Z", end_at: "2026-05-07T09:30:00Z" }
              as: Counselor
              as_user_id: "${c7}"
              captures: { freeze_err: "$.data.error_id" }
          assert:
            - "Appointment.${ap3}.state == NO_SHOW (hop 1)"
            - "trailing no-show count for ${s_ns} == 3 after the trigger (hop 2 — recomputed from the transition)"
            - "the subsequent booking returns ERR_NO_SHOW_FREEZE (422) (hop 3 — caused by the recomputed count crossing the threshold, not by mark-no-show directly)"
      - name: change_execute_cascade_to_audit_and_deficiency_flag
        grounds:
          - state_machines.ScheduleChangeRequest.APPROVED_to_EXECUTED
          - state_machines.ScheduleEntry.ENROLLED_to_DROPPED
          - entities.Student.fields.planned_credit_load
          - entities.Student.fields.credit_deficient
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (change-request execute):
          (1) EXECUTED flips the drop entry ENROLLED -> DROPPED; (2) the entry
          flip recomputes Section counters AND Student.planned_credit_load;
          (3) the recomputed load changes the student's standing vs pace, so
          the next credit-audit read shows deficiency_credits == 1.0 and
          Student.credit_deficient flips true. Distinct origin from the
          mark-no-show cascade.
        test_recipe:
          setup:
            - "Term T6 in CHANGE_WINDOW; student s_cd (grade 12, earned 18.0) enrolled in 4.0 credits (entry_x at period 1 carries 1.0 credit); projected at publish 22.0 vs required 22.0 (not deficient); APPROVED DROP request crd for entry_x."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Eight", max_caseload: 100 }
              as: Administrator
              captures: { c8: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2031-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term6: "$.data.id" }
            # NOTE for the test-generator: standard chain — 4 courses x1.0cr
            # requested + submitted by s_cd (earned 18.0, grade 12), sections
            # scheduled periods 1..4, publish (audit: projected 22.0,
            # deficiency 0), open window, DROP request for the period-1 entry
            # created, claimed, decided APPROVE with a fresh term version.
            - call: "POST /scheduling/students"
              payload: { external_ref: "CD", full_name: "Casc Drop", grade_level: 12, counselor_id: "${c8}", earned_credits: 18.0 }
              as: Administrator
              captures: { s_cd: "$.data.id" }
            - call: "GET /scheduling/students/${s_cd}/schedule"
              as: Administrator
              captures: { entry_x: "$.data[0].id" }
            - call: "GET /scheduling/terms/${term6}"
              as: Administrator
              captures: { term6_v: "$.data.version" }
            - call: "POST /scheduling/change-requests"
              payload: { student_id: "${s_cd}", term_id: "${term6}", kind: "DROP", drop_entry_id: "${entry_x}", reason: "Dropping to reduce load now" }
              as: Student
              as_user_id: "${s_cd}"
              captures: { crd: "$.data.id" }
            - call: "POST /scheduling/change-requests/${crd}/claim"
              payload: {}
              as: Counselor
              as_user_id: "${c8}"
            - call: "POST /scheduling/change-requests/${crd}/decide"
              payload: { decision: "APPROVE", expected_term_version: "${term6_v}" }
              as: Administrator
          trigger:
            - call: "POST /scheduling/change-requests/${crd}/execute"
              payload: {}
              as: Administrator
            - call: "GET /scheduling/students/${s_cd}/credit-audit"
              as: Administrator
              captures: { new_def: "$.data.deficiency_credits" }
            - call: "GET /scheduling/students/${s_cd}"
              as: Administrator
              captures: { new_flag: "$.data.credit_deficient", new_load: "$.data.planned_credit_load" }
          assert:
            - "ScheduleEntry.${entry_x}.state == DROPPED (hop 1)"
            - "Student.${s_cd}.planned_credit_load == 3.0 (hop 2 — recomputed from the drop)"
            - "latest CreditAudit deficiency_credits == 1.0 (22.0 - (18.0 + 3.0)) and Student.credit_deficient == true (hop 3)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_vs_capacity_conflict
        grounds:
          - "validations[priority=5]"
          - "validations[priority=17]"
          - "errors[ERR_INVALID_TERM_POSTURE]"
          - "errors[ERR_SECTION_FULL]"
        distinguishing_aspect: |
          Error-category pair: state vs business_fiscal. A change-request
          CREATE attempted while the term posture blocks it (window not open)
          AND whose target section is full returns ERR_INVALID_TERM_POSTURE
          (state, priority 5), never ERR_SECTION_FULL (business_fiscal,
          priority 17).
        test_recipe:
          setup:
            - "Term T7 in PUBLISHED (window NOT open); sec_full's enrolled_count == capacity; student s_pp enrolled with room to request an ADD."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Nine", max_caseload: 100 }
              as: Administrator
              captures: { c9: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2032-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term7: "$.data.id" }
            # NOTE for the test-generator: standard chain to PUBLISHED with a
            # capacity-1 section sec_full occupied by a filler; student s_pp
            # enrolled in a different-period section. Window intentionally
            # NOT opened.
            - call: "POST /scheduling/students"
              payload: { external_ref: "PP", full_name: "Pp Stu", grade_level: 10, counselor_id: "${c9}" }
              as: Administrator
              captures: { s_pp: "$.data.id" }
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_full: "$.data[0].id" }
          trigger:
            - call: "POST /scheduling/change-requests"
              payload: { student_id: "${s_pp}", term_id: "${term7}", kind: "ADD", add_section_id: "${sec_full}", reason: "Attempt while window closed" }
              as: Student
              as_user_id: "${s_pp}"
              captures: { pp_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_TERM_POSTURE (409): state beats business_fiscal even though the target section is also full"
      - name: ownership_vs_request_shape_conflict
        grounds:
          - "validations[priority=7]"
          - "validations[priority=10]"
          - "errors[ERR_FORBIDDEN_OWNERSHIP]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          Error-category pair: state (ownership) vs business_constraint
          (payload shape) — a different pair from state-vs-business_fiscal. A
          student creating ANOTHER student's change request with a malformed
          payload (reason too short) receives ERR_FORBIDDEN_OWNERSHIP
          (priority 7), never ERR_INVALID_REQUEST (priority 10).
        test_recipe:
          setup:
            - "Term T8 in CHANGE_WINDOW; students s_own and s_other both enrolled; s_other holds a valid ENROLLED entry entry_other."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Ten", max_caseload: 100 }
              as: Administrator
              captures: { c10: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2033-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term8: "$.data.id" }
            # NOTE for the test-generator: standard chain to CHANGE_WINDOW with
            # s_own and s_other each enrolled.
            - call: "POST /scheduling/students"
              payload: { external_ref: "OWN", full_name: "Own Stu", grade_level: 10, counselor_id: "${c10}" }
              as: Administrator
              captures: { s_own: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "OTH", full_name: "Other Stu", grade_level: 10, counselor_id: "${c10}" }
              as: Administrator
              captures: { s_other: "$.data.id" }
            - call: "GET /scheduling/students/${s_other}/schedule"
              as: Administrator
              captures: { entry_other: "$.data[0].id" }
          trigger:
            - call: "POST /scheduling/change-requests"
              payload: { student_id: "${s_other}", term_id: "${term8}", kind: "DROP", drop_entry_id: "${entry_other}", reason: "short" }
              as: Student
              as_user_id: "${s_own}"
              captures: { own_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP (403): acting student ${s_own} is not the owner ${s_other}"
            - "ERR_INVALID_REQUEST is NOT returned even though reason 'short' violates the 10-500 char rule"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: section_full_at_exact_capacity
        grounds:
          - "validations[priority=17]"
          - calculations.placement_selector
        distinguishing_aspect: |
          Metric: seat count, exercised through change-request execute. A
          section whose enrolled_count == capacity exactly rejects the
          placement with ERR_SECTION_FULL (strict <), while capacity-1
          accepts. Pinned at capacity 3 / enrolled 3.
        test_recipe:
          setup:
            - "Term T9 in CHANGE_WINDOW; sec_edge capacity 3 with exactly 3 ENROLLED students; s_edge enrolled in a period-1 section; APPROVED ADD request cr_edge targets sec_edge (period 2)."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Eleven", max_caseload: 100 }
              as: Administrator
              captures: { c11: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2034-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term9: "$.data.id" }
            # NOTE for the test-generator: chain to CHANGE_WINDOW; sec_edge
            # created with capacity 3 and three fillers occupy it; s_edge
            # enrolled in a period-1 section; ADD created, claimed, approved
            # while a seat was free, then the last seat was taken by another
            # executed change before this execute.
            - call: "GET /scheduling/terms/${term9}"
              as: Administrator
              captures: { term9_v: "$.data.version" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "EDG", full_name: "Edge Stu", grade_level: 10, counselor_id: "${c11}" }
              as: Administrator
              captures: { s_edge: "$.data.id" }
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_edge: "$.data[0].id" }
            - call: "POST /scheduling/change-requests"
              payload: { student_id: "${s_edge}", term_id: "${term9}", kind: "ADD", add_section_id: "${sec_edge}", reason: "Add at exact capacity edge" }
              as: Student
              as_user_id: "${s_edge}"
              captures: { cr_edge: "$.data.id" }
            - call: "POST /scheduling/change-requests/${cr_edge}/claim"
              payload: {}
              as: Counselor
              as_user_id: "${c11}"
            - call: "POST /scheduling/change-requests/${cr_edge}/decide"
              payload: { decision: "APPROVE", expected_term_version: "${term9_v}" }
              as: Administrator
          trigger:
            - call: "POST /scheduling/change-requests/${cr_edge}/execute"
              payload: {}
              as: Administrator
              captures: { cap_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SECTION_FULL (422) at enrolled_count == capacity == 3 (boundary: equality rejects)"
      - name: no_show_freeze_at_exactly_three
        grounds:
          - calculations.no_show_freeze_check
          - "validations[priority=9]"
        distinguishing_aspect: |
          Metric: integer no-show count (different metric from seat count),
          exercised through appointment create (different endpoint). Exactly 3
          trailing no-shows freezes (>= 3, NOT > 3); 2 no-shows books fine.
        test_recipe:
          setup:
            - "Counselor c12; student s_two has exactly 2 NO_SHOWs in the 90-day window; student s_three has exactly 3; clock 2026-05-06T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Twelve", max_caseload: 100 }
              as: Administrator
              captures: { c12: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "TWO", full_name: "Two NS", grade_level: 9, counselor_id: "${c12}" }
              as: Administrator
              captures: { s_two: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "THR", full_name: "Three NS", grade_level: 9, counselor_id: "${c12}" }
              as: Administrator
              captures: { s_three: "$.data.id" }
            # two no-shows for s_two
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c12}", student_id: "${s_two}", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T09:30:00Z" }
              as: Counselor
              as_user_id: "${c12}"
              captures: { a1: "$.data.id" }
            - call: "POST /scheduling/appointments/${a1}/mark-no-show"
              payload: {}
