# =============================================================================
# task_0615_workplace_giving — Workplace Giving & Matching-Gifts Platform
# SCAFFOLD.yaml  (§1.0–§1.7)
# Difficulty band: EXPERT
# =============================================================================

scenario: |
  Workplace Giving & Matching-Gifts Platform (Benevity/YourCause style): employee
  giving campaign & payroll deduction, matching-gift rules/ratio & annual cap,
  volunteer-time tracking & dollars-for-doers, charity vetting (501(c)(3)) &
  disbursement, donation round-up & grant, impact dashboard & reporting,
  recurring vs one-time, year-end tax statement.

domain_name: workplace-giving
api_prefix: ""

# Complexity profile -----------------------------------------------------------
complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - dual_variant_calculation        # estimated vs finalized matching gift
    - cascading_side_effects          # donation settle -> match finalize -> cap debit -> disbursement
    - rate_threshold_triggers         # annual match cap & DfD cap boundaries; tiered ratio
    - derived_field_reconciliation    # employee.match_consumed_ytd, charity.total_received
    - optimistic_concurrency          # DisbursementBatch line addition guarded by batch.version

  entity_topology: flat               # peer entities linked by FK fields (no deep URL nesting)
  state_machine_shape: cyclic         # charity vetting revision loop + branching donation lifecycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate                 # Grant references Charity, Donation, MatchingGift, VolunteerLog
    - polymorphic                     # Grant.source_type points at one of three source entities

  role_model: segregation_of_duties   # GivingAdmin vetting/disbursement vs ProgramManager config; Employee acts on own resources only
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Corporate giving program name" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year the program operates in (e.g. 2026); all caps and statements reset per tax_year" }
      - { name: match_ratio, type: number, source: input, default: 0.5, description: "Dollars matched per $1 donated when tiered matching is OFF; 0.0–4.0", constraints: "0 <= match_ratio <= 4.0" }
      - { name: tiered_matching_enabled, type: boolean, source: input, default: false, description: "When true, match uses tier_1_rate up to tier_1_ceiling_cents and tier_2_rate above; match_ratio is ignored" }
      - { name: tier_1_ceiling_cents, type: integer, source: input, default: 50000, description: "Per-donation amount up to which tier_1_rate applies (used only when tiered_matching_enabled)" }
      - { name: tier_1_rate, type: number, source: input, default: 1.0, description: "Match rate for the portion of a donation at or below tier_1_ceiling_cents" }
      - { name: tier_2_rate, type: number, source: input, default: 0.5, description: "Match rate for the donation portion above tier_1_ceiling_cents" }
      - { name: annual_match_cap_cents, type: integer, source: input, default: 100000, description: "Max matched dollars per employee per tax_year (the matching quota pool)" }
      - { name: dfd_rate_cents_per_hour, type: integer, source: input, default: 1500, description: "Dollars-for-doers grant rate per volunteer hour, in cents" }
      - { name: dfd_annual_cap_cents, type: integer, source: input, default: 25000, description: "Max dollars-for-doers grant dollars per employee per tax_year" }
      - { name: roundup_enabled, type: boolean, source: input, default: false, description: "When true, each donation's base amount is rounded up to the next whole dollar; the increment is added to the donation" }
      - { name: processing_fee_tier_threshold_cents, type: integer, source: input, default: 5000, description: "Donation subtotal at or above which the low processing-fee rate applies" }
      - { name: processing_fee_low_rate, type: number, source: input, default: 0.02, description: "Employer processing fee rate when subtotal >= processing_fee_tier_threshold_cents" }
      - { name: processing_fee_high_rate, type: number, source: input, default: 0.03, description: "Employer processing fee rate when subtotal < processing_fee_tier_threshold_cents" }
      - { name: disbursement_admin_fee_rate, type: number, source: input, default: 0.025, description: "Fraction withheld from each grant when a DisbursementBatch settles, remitting the net to the charity" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | CLOSED", constraints: "DRAFT, ACTIVE, CLOSED" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the giving program the employee belongs to" }
      - { name: email, type: string, source: input, description: "Employee work email; unique within program_id while status != TERMINATED" }
      - { name: full_name, type: string, source: input, description: "Employee display name" }
      - { name: annual_salary_cents, type: integer, source: input, description: "Used to enforce payroll-deduction ceiling (max 20% of monthly salary across active schedules)" }
      - { name: match_consumed_ytd_cents, type: integer, source: computed, default: 0, description: "Sum of matched_amount_cents over this employee's MatchingGift rows in {FINALIZED, SETTLED} for the program tax_year; the consumed portion of annual_match_cap_cents" }
      - { name: dfd_consumed_ytd_cents, type: integer, source: computed, default: 0, description: "Sum of grant_amount_cents over this employee's VolunteerLog rows in {APPROVED, SETTLED} for the program tax_year" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | TERMINATED", constraints: "ACTIVE, SUSPENDED, TERMINATED" }

  - name: Charity
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program under which this charity is vetted" }
      - { name: legal_name, type: string, source: input, description: "Charity legal name" }
      - { name: ein, type: string, source: input, description: "US Employer Identification Number (9 digits, format NN-NNNNNNN); unique within program among charities not in REJECTED" }
      - { name: claimed_501c3, type: boolean, source: input, default: true, description: "Self-declared 501(c)(3) status pending vetting" }
      - { name: total_received_cents, type: integer, source: computed, default: 0, description: "Sum of net_amount_cents over this charity's Grant rows in SETTLED status; reconciled on batch settlement" }
      - { name: review_rounds, type: integer, source: system, default: 0, description: "Count of times the charity has entered UNDER_REVIEW (increments each vetting cycle)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | UNDER_REVIEW | NEEDS_INFO | APPROVED | REJECTED | SUSPENDED", constraints: "SUBMITTED, UNDER_REVIEW, NEEDS_INFO, APPROVED, REJECTED, SUSPENDED" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program running the campaign" }
      - { name: charity_id, type: string, source: input, description: "FK -> Charity.id; beneficiary charity (must be APPROVED at campaign launch)" }
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: goal_cents, type: integer, source: input, description: "Fundraising goal in cents", constraints: "goal_cents > 0" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive campaign open instant (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive campaign close instant (ISO 8601 UTC); donations accepted while clock in [window_start, window_end)" }
      - { name: raised_cents, type: integer, source: computed, default: 0, description: "Sum of base_amount_cents over this campaign's Donation rows in {SETTLED}" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | LIVE | PAUSED | ENDED", constraints: "DRAFT, LIVE, PAUSED, ENDED" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the donor" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign donated to (must be LIVE at pledge time)" }
      - { name: donation_type, type: enum, source: input, description: "ONE_TIME | RECURRING", constraints: "ONE_TIME, RECURRING" }
      - { name: funding_method, type: enum, source: input, description: "PAYROLL_DEDUCTION | CREDIT", constraints: "PAYROLL_DEDUCTION, CREDIT" }
      - { name: base_amount_cents, type: integer, source: input, description: "Employee-entered donation amount before round-up", constraints: "base_amount_cents > 0" }
      - { name: roundup_increment_cents, type: integer, source: computed, default: 0, description: "Cents added to reach the next whole dollar when program.roundup_enabled; else 0" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "base_amount_cents + roundup_increment_cents" }
      - { name: processing_fee_cents, type: integer, source: computed, default: 0, description: "Employer-paid processing fee derived from subtotal tier (see calc donation_amount_breakdown)" }
      - { name: total_charged_cents, type: integer, source: computed, default: 0, description: "subtotal_cents + processing_fee_cents; amount debited from the funding method" }
      - { name: tax_deductible, type: boolean, source: input, default: true, description: "Whether this donation counts toward the employee's year-end tax statement" }
      - { name: schedule_id, type: string, source: system, default: null, description: "FK -> PayrollDeductionSchedule.id; set when donation_type=RECURRING and funding_method=PAYROLL_DEDUCTION" }
      - { name: settled_at, type: datetime, source: system, default: null, description: "Clock value when the donation reached SETTLED" }
      - { name: status, type: enum, source: system, default: "PLEDGED", description: "PLEDGED | AUTHORIZED | SETTLED | REFUNDED | CANCELLED", constraints: "PLEDGED, AUTHORIZED, SETTLED, REFUNDED, CANCELLED" }

  - name: PayrollDeductionSchedule
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; owner of the schedule" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign the recurring deduction funds" }
      - { name: per_period_amount_cents, type: integer, source: input, description: "Cents deducted each period", constraints: "per_period_amount_cents > 0" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive first-active instant of the schedule (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive deactivation instant; schedule active while clock in [window_start, window_end)" }
      - { name: occurrences_generated, type: integer, source: computed, default: 0, description: "Count of Donation rows created by run-cycle for this schedule" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED | CANCELLED", constraints: "ACTIVE, PAUSED, CANCELLED" }

  - name: MatchingGift
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: donation_id, type: string, source: input, description: "FK -> Donation.id; the donation being matched (1:1)" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; copied from the donation's donor" }
      - { name: raw_match_cents, type: integer, source: computed, default: 0, description: "Match before annual-cap clamp (see calc matching_gift_amount)" }
      - { name: estimated_match_cents, type: integer, source: computed, default: 0, description: "Provisional match computed at REQUESTED time using committed (FINALIZED/SETTLED) consumption only" }
      - { name: matched_amount_cents, type: integer, source: computed, default: 0, description: "Final match after annual-cap clamp, fixed at FINALIZED time using live consumption" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | FINALIZED | CAPPED | SETTLED | REVERSED", constraints: "REQUESTED, FINALIZED, CAPPED, SETTLED, REVERSED" }

  - name: VolunteerLog
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the volunteer" }
      - { name: charity_id, type: string, source: input, description: "FK -> Charity.id; charity volunteered for (must be APPROVED)" }
      - { name: minutes, type: integer, source: input, description: "Volunteer minutes logged", constraints: "minutes > 0" }
      - { name: activity_date, type: datetime, source: input, description: "Date the volunteering occurred (ISO 8601 UTC); must fall within program tax_year" }
      - { name: raw_grant_cents, type: integer, source: computed, default: 0, description: "Grant before DfD-cap clamp (see calc dollars_for_doers_grant)" }
      - { name: grant_amount_cents, type: integer, source: computed, default: 0, description: "Final dollars-for-doers grant after DfD-cap clamp, fixed at APPROVED time" }
      - { name: status, type: enum, source: system, default: "LOGGED", description: "LOGGED | APPROVED | REJECTED | SETTLED | REVERSED", constraints: "LOGGED, APPROVED, REJECTED, SETTLED, REVERSED" }

  - name: DisbursementBatch
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: charity_id, type: string, source: input, description: "FK -> Charity.id; sole beneficiary of every grant in the batch (must be APPROVED)" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the coverage period this batch settles (ISO 8601 UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end of the coverage period (ISO 8601 UTC); coverage interval is the closed [period_start, period_end]" }
      - { name: gross_total_cents, type: integer, source: computed, default: 0, description: "Sum of gross_amount_cents over the batch's Grant rows" }
      - { name: admin_fee_cents, type: integer, source: computed, default: 0, description: "Admin fee withheld at settlement (see calc disbursement_settlement, sum-then-fee order)" }
      - { name: net_total_cents, type: integer, source: computed, default: 0, description: "gross_total_cents - admin_fee_cents; remitted to the charity" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | LOCKED | SETTLED | VOIDED", constraints: "OPEN, LOCKED, SETTLED, VOIDED" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: batch_id, type: string, source: input, description: "FK -> DisbursementBatch.id; owning batch" }
      - { name: charity_id, type: string, source: system, description: "FK -> Charity.id; copied from the batch; all grants in a batch share one charity" }
      - { name: source_type, type: enum, source: input, description: "DONATION | MATCH | DFD; which kind of source funds this grant", constraints: "DONATION, MATCH, DFD" }
      - { name: source_id, type: string, source: input, description: "FK -> Donation.id when source_type=DONATION; FK -> MatchingGift.id when source_type=MATCH; FK -> VolunteerLog.id when source_type=DFD (polymorphic)" }
      - { name: gross_amount_cents, type: integer, source: computed, default: 0, description: "Source's payable amount: Donation.base_amount_cents, MatchingGift.matched_amount_cents, or VolunteerLog.grant_amount_cents" }
      - { name: admin_fee_cents, type: integer, source: computed, default: 0, description: "This line's share of the batch admin fee, allocated at settlement (see calc disbursement_settlement)" }
      - { name: net_amount_cents, type: integer, source: computed, default: 0, description: "gross_amount_cents - admin_fee_cents; counts toward charity.total_received_cents when SETTLED" }
      - { name: status, type: enum, source: system, default: "STAGED", description: "STAGED | SETTLED | VOIDED", constraints: "STAGED, SETTLED, VOIDED" }

  - name: TaxStatement
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; statement subject" }
      - { name: tax_year, type: integer, source: system, description: "Copied from program.tax_year at generation time" }
      - { name: deductible_donations_cents, type: integer, source: computed, default: 0, description: "Sum of base_amount_cents over the employee's SETTLED, tax_deductible Donation rows in tax_year (see calc tax_statement_totals)" }
      - { name: matched_total_cents, type: integer, source: computed, default: 0, description: "Sum of matched_amount_cents over the employee's SETTLED MatchingGift rows in tax_year (informational; employer-funded, not employee-deductible)" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Number of donation lines included" }
      - { name: status, type: enum, source: system, default: "GENERATED", description: "GENERATED | FINAL", constraints: "GENERATED, FINAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{programId}/activate"
        actor: ProgramManager
        preconditions:
          - "Program in DRAFT (else ERR_INVALID_STATE)"
        side_effects: ["increments Program.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /programs/{programId}/close"
        actor: ProgramManager
        preconditions:
          - "Program in ACTIVE (else ERR_INVALID_STATE)"
          - "No DisbursementBatch under this program in {OPEN, LOCKED} (else ERR_OPEN_BATCH_EXISTS)"
        side_effects: ["increments Program.version by 1"]

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /employees/{employeeId}/suspend"
        actor: GivingAdmin
        preconditions: ["Employee in ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /employees/{employeeId}/reinstate"
        actor: GivingAdmin
        preconditions: ["Employee in SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /employees/{employeeId}/terminate"
        actor: GivingAdmin
        preconditions: ["Employee in {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"]
        side_effects: ["Free the employee's email for re-enrollment (uniqueness ignores TERMINATED)"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /employees/{employeeId}/terminate"
        actor: GivingAdmin
        preconditions: ["Employee in {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"]
        side_effects: ["Free the employee's email for re-enrollment (uniqueness ignores TERMINATED)"]

  - entity: Charity
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /charities/{charityId}/start-review"
        actor: GivingAdmin
        preconditions: ["Charity in SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: ["increments Charity.review_rounds by 1"]
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /charities/{charityId}/request-info"
        actor: GivingAdmin
        preconditions: ["Charity in UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /charities/{charityId}/start-review"
        actor: GivingAdmin
        preconditions:
          - "Charity in NEEDS_INFO (else ERR_INVALID_STATE)"
          - "review_rounds < 3 (else ERR_MAX_REVIEW_ROUNDS)"
        side_effects: ["increments Charity.review_rounds by 1"]
        note: "Revision loop NEEDS_INFO -> UNDER_REVIEW is the cyclic edge; bounded by review_rounds < 3"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /charities/{charityId}/approve"
        actor: GivingAdmin
        preconditions:
          - "Charity in UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "claimed_501c3 == true AND ein matches /^[0-9]{2}-[0-9]{7}$/ (else ERR_CHARITY_NOT_ELIGIBLE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /charities/{charityId}/reject"
        actor: GivingAdmin
        preconditions: ["Charity in UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: NEEDS_INFO
        to: REJECTED
        trigger: "POST /charities/{charityId}/reject"
        actor: GivingAdmin
        preconditions: ["Charity in NEEDS_INFO (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /charities/{charityId}/suspend"
        actor: GivingAdmin
        preconditions: ["Charity in APPROVED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /charities/{charityId}/reinstate"
        actor: GivingAdmin
        preconditions: ["Charity in SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [ENDED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /campaigns/{campaignId}/launch"
        actor: ProgramManager
        preconditions:
          - "Campaign in DRAFT (else ERR_INVALID_STATE)"
          - "Referenced Charity.status == APPROVED (else ERR_CHARITY_NOT_APPROVED)"
          - "Program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
        side_effects: []
      - from: LIVE
        to: PAUSED
        trigger: "POST /campaigns/{campaignId}/pause"
        actor: ProgramManager
        preconditions: ["Campaign in LIVE (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PAUSED
        to: LIVE
        trigger: "POST /campaigns/{campaignId}/resume"
        actor: ProgramManager
        preconditions:
          - "Campaign in PAUSED (else ERR_INVALID_STATE)"
          - "Referenced Charity.status == APPROVED (else ERR_CHARITY_NOT_APPROVED)"
        side_effects: []
      - from: LIVE
        to: ENDED
        trigger: "POST /campaigns/{campaignId}/end"
        actor: ProgramManager
        preconditions: ["Campaign in {LIVE, PAUSED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PAUSED
        to: ENDED
        trigger: "POST /campaigns/{campaignId}/end"
        actor: ProgramManager
        preconditions: ["Campaign in {LIVE, PAUSED} (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Donation
    initial_state: PLEDGED
    terminal_states: [REFUNDED, CANCELLED]
    transitions:
      - from: PLEDGED
        to: AUTHORIZED
        trigger: "POST /donations/{donationId}/authorize"
        actor: GivingAdmin
        preconditions:
          - "Donation in PLEDGED (else ERR_INVALID_STATE)"
          - "Donor Employee.status == ACTIVE (else ERR_EMPLOYEE_NOT_ACTIVE)"
        side_effects: ["Compute roundup_increment_cents, subtotal_cents, processing_fee_cents, total_charged_cents (calc donation_amount_breakdown)"]
      - from: AUTHORIZED
        to: SETTLED
        trigger: "POST /donations/{donationId}/settle"
        actor: GivingAdmin
        preconditions:
          - "Donation in AUTHORIZED (else ERR_INVALID_STATE)"
          - "Campaign.status == LIVE (else ERR_CAMPAIGN_NOT_LIVE)"
        side_effects:
          - "Set settled_at = clock"
          - "Increment Campaign.raised_cents by base_amount_cents"
          - "If a MatchingGift for this donation exists in REQUESTED, finalize it: recompute matched_amount_cents with live consumption, transition MatchingGift REQUESTED->FINALIZED (or ->CAPPED when clamp yields 0), debit Employee.match_consumed_ytd_cents by matched_amount_cents (calc matching_gift_amount)"
      - from: PLEDGED
        to: CANCELLED
        trigger: "POST /donations/{donationId}/cancel"
        actor: Employee
        preconditions: ["Donation in PLEDGED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /donations/{donationId}/refund"
        actor: GivingAdmin
        preconditions:
          - "Donation in SETTLED (else ERR_INVALID_STATE)"
          - "No Grant references this donation in {STAGED, SETTLED} (else ERR_DONATION_DISBURSED)"
        side_effects:
          - "Decrement Campaign.raised_cents by base_amount_cents"
          - "If a MatchingGift for this donation is in {FINALIZED}, reverse it: transition MatchingGift FINALIZED->REVERSED and credit Employee.match_consumed_ytd_cents back by matched_amount_cents (compensating; calc matching_gift_amount)"

  - entity: PayrollDeductionSchedule
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /payroll-schedules/{scheduleId}/pause"
        actor: Employee
        preconditions: ["Schedule in ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /payroll-schedules/{scheduleId}/resume"
        actor: Employee
        preconditions: ["Schedule in PAUSED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /payroll-schedules/{scheduleId}/cancel"
        actor: Employee
        preconditions: ["Schedule in {ACTIVE, PAUSED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /payroll-schedules/{scheduleId}/cancel"
        actor: Employee
        preconditions: ["Schedule in {ACTIVE, PAUSED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /payroll-schedules/{scheduleId}/run-cycle"
        actor: GivingAdmin
        preconditions:
          - "Schedule in ACTIVE (else ERR_INVALID_STATE)"
          - "Clock in [window_start, window_end) (else ERR_SCHEDULE_WINDOW_CLOSED)"
          - "Campaign.status == LIVE (else ERR_CAMPAIGN_NOT_LIVE)"
        side_effects:
          - "Create one Donation (PLEDGED, donation_type=RECURRING, funding_method=PAYROLL_DEDUCTION, base_amount_cents=per_period_amount_cents, schedule_id=this) for the employee/campaign"
          - "Increment occurrences_generated by 1"
        note: "Self-loop ACTIVE->ACTIVE; recurring vs one-time distinction lives here"

  - entity: MatchingGift
    initial_state: REQUESTED
    terminal_states: [SETTLED, REVERSED]
    transitions:
      - from: REQUESTED
        to: FINALIZED
        trigger: "system (donation settle side-effect)"
        actor: system
        preconditions: ["Donation transitions AUTHORIZED->SETTLED", "Clamped matched_amount_cents > 0"]
        side_effects: ["Set matched_amount_cents (live consumption)", "Debit Employee.match_consumed_ytd_cents by matched_amount_cents"]
      - from: REQUESTED
        to: CAPPED
        trigger: "system (donation settle side-effect)"
        actor: system
        preconditions: ["Donation transitions AUTHORIZED->SETTLED", "Clamped matched_amount_cents == 0 (annual cap already fully consumed)"]
        side_effects: ["Set matched_amount_cents = 0"]
        note: "CAPPED is terminal-by-policy for a fully-consumed cap; no employee consumption debit"
      - from: FINALIZED
        to: SETTLED
        trigger: "system (Grant of source_type=MATCH settles within a DisbursementBatch)"
        actor: system
        preconditions: ["Owning DisbursementBatch transitions LOCKED->SETTLED", "MatchingGift in FINALIZED"]
        side_effects: []
      - from: FINALIZED
        to: REVERSED
        trigger: "system (donation refund side-effect)"
        actor: system
        preconditions: ["Donation transitions SETTLED->REFUNDED", "MatchingGift in FINALIZED (not yet SETTLED)"]
        side_effects: ["Credit Employee.match_consumed_ytd_cents back by matched_amount_cents (compensating)"]

  - entity: VolunteerLog
    initial_state: LOGGED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: LOGGED
        to: APPROVED
        trigger: "POST /volunteer-logs/{logId}/approve"
        actor: GivingAdmin
        preconditions:
          - "Log in LOGGED (else ERR_INVALID_STATE)"
          - "Charity.status == APPROVED (else ERR_CHARITY_NOT_APPROVED)"
          - "Donor Employee.status == ACTIVE (else ERR_EMPLOYEE_NOT_ACTIVE)"
        side_effects:
          - "Compute raw_grant_cents and grant_amount_cents with DfD-cap clamp (calc dollars_for_doers_grant)"
          - "Increment Employee.dfd_consumed_ytd_cents by grant_amount_cents"
      - from: LOGGED
        to: REJECTED
        trigger: "POST /volunteer-logs/{logId}/reject"
        actor: GivingAdmin
        preconditions: ["Log in LOGGED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "system (Grant of source_type=DFD settles within a DisbursementBatch)"
        actor: system
        preconditions: ["Owning DisbursementBatch transitions LOCKED->SETTLED", "Log in APPROVED"]
        side_effects: []
      - from: APPROVED
        to: REVERSED
        trigger: "POST /volunteer-logs/{logId}/reverse"
        actor: GivingAdmin
        preconditions:
          - "Log in APPROVED (else ERR_INVALID_STATE)"
          - "No Grant references this log in {STAGED, SETTLED} (else ERR_LOG_DISBURSED)"
        side_effects: ["Credit Employee.dfd_consumed_ytd_cents back by grant_amount_cents (compensating)"]

  - entity: DisbursementBatch
    initial_state: OPEN
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /disbursement-batches/{batchId}/lock"
        actor: GivingAdmin
        preconditions:
          - "Batch in OPEN (else ERR_INVALID_STATE)"
          - "Batch has >= 1 Grant in STAGED (else ERR_EMPTY_BATCH)"
        side_effects: ["increments DisbursementBatch.version by 1"]
      - from: LOCKED
        to: SETTLED
        trigger: "POST /disbursement-batches/{batchId}/settle"
        actor: GivingAdmin
        preconditions:
          - "Batch in LOCKED (else ERR_INVALID_STATE)"
          - "Charity.status == APPROVED (else ERR_CHARITY_NOT_APPROVED)"
        side_effects:
          - "Compute gross_total_cents, admin_fee_cents (sum-then-fee), per-line admin_fee_cents and net_amount_cents (calc disbursement_settlement)"
          - "Transition every STAGED Grant -> SETTLED"
          - "For each MATCH-source Grant: transition its MatchingGift FINALIZED->SETTLED"
          - "For each DFD-source Grant: transition its VolunteerLog APPROVED->SETTLED"
          - "Increment Charity.total_received_cents by net_total_cents"
          - "increments DisbursementBatch.version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /disbursement-batches/{batchId}/void"
        actor: GivingAdmin
        preconditions: ["Batch in OPEN (else ERR_INVALID_STATE)"]
        side_effects: ["Transition every STAGED Grant -> VOIDED", "increments DisbursementBatch.version by 1"]

  - entity: Grant
    initial_state: STAGED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: STAGED
        to: SETTLED
        trigger: "system (owning DisbursementBatch LOCKED->SETTLED)"
        actor: system
        preconditions: ["Owning DisbursementBatch transitions LOCKED->SETTLED", "Grant in STAGED"]
        side_effects:
          - "Set admin_fee_cents (allocated share) and net_amount_cents (calc disbursement_settlement)"
          - "Contributes net_amount_cents to Charity.total_received_cents"
        note: "Grants are never settled individually; only as a consequence of the batch settling"
      - from: STAGED
        to: VOIDED
        trigger: "system (owning DisbursementBatch OPEN->VOIDED)"
        actor: system
        preconditions: ["Owning DisbursementBatch transitions OPEN->VOIDED", "Grant in STAGED"]
        side_effects: ["Grant excluded from any future settlement"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: grant-add-stale-batch
    parent_entity: DisbursementBatch
    write_endpoint: "POST /disbursement-batches/{batchId}/grants"
    occ_field: "expected_batch_version"
    description: |
      Staging a Grant into a DisbursementBatch whose version has advanced since
      the client last observed it is rejected. Adding a grant legitimately bumps
      the batch version (and its gross totals); a writer whose view of the batch
      is stale is rejected with a precondition-failed so it must re-read the
      batch before staging again.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: donation_amount_breakdown
    trigger: "Donation PLEDGED->AUTHORIZED (POST /donations/{donationId}/authorize)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED — fee depends on subtotal tier, so the
      # circular-looking total/fee relationship is resolved by computing in
      # this fixed order. Never derive the fee from base_amount_cents.
      # (1) roundup_increment_cents:
      if program.roundup_enabled:
          rem = base_amount_cents % 100
          roundup_increment_cents = 0 if rem == 0 else (100 - rem)
      else:
          roundup_increment_cents = 0
      # (2) subtotal:
      subtotal_cents = base_amount_cents + roundup_increment_cents
      # (3) processing fee from the SUBTOTAL tier (>= threshold uses low rate):
      if subtotal_cents >= program.processing_fee_tier_threshold_cents:
          rate = program.processing_fee_low_rate
      else:
          rate = program.processing_fee_high_rate
      processing_fee_cents = floor(subtotal_cents * rate)
      # (4) total:
      total_charged_cents = subtotal_cents + processing_fee_cents
    constants:
      ROUNDUP_DOLLAR_CENTS: 100
    precision: "integer cents, floor on every multiplication"
    variants:
      - name: roundup_off
        when: "program.roundup_enabled == false"
        difference: "roundup_increment_cents forced to 0; subtotal == base_amount_cents"

  - name: matching_gift_amount
    trigger: "Donation AUTHORIZED->SETTLED finalizes the linked MatchingGift; also recomputed on refund reversal"
    algorithm: threshold
    formula: |
      # raw match (tiered when enabled):
      if program.tiered_matching_enabled:
          t1 = min(donation.base_amount_cents, program.tier_1_ceiling_cents)
          t2 = max(0, donation.base_amount_cents - program.tier_1_ceiling_cents)
          raw_match_cents = floor(t1 * program.tier_1_rate) + floor(t2 * program.tier_2_rate)
      else:
          raw_match_cents = floor(donation.base_amount_cents * program.match_ratio)
      # annual cap clamp (per employee per tax_year):
      remaining = program.annual_match_cap_cents - employee.match_consumed_ytd_cents
      matched_amount_cents = max(0, min(raw_match_cents, remaining))
      # boundary: remaining <= 0 => matched_amount_cents == 0 => MatchingGift -> CAPPED.
    input_set: "consumption = sum(matched_amount_cents) over employee's MatchingGift in {FINALIZED, SETTLED} for the program tax_year"
    constants: {}
    precision: "integer cents, floor on each tier multiplication BEFORE summing tiers"
    variants:
      - name: estimated
        when: "computed at REQUESTED time (matching-gift creation)"
        difference: "Uses committed consumption only (FINALIZED+SETTLED at request time); ignores any other still-REQUESTED matches in flight. Stored as estimated_match_cents."
      - name: finalized
        when: "computed at Donation settle (REQUESTED->FINALIZED)"
        difference: "Uses LIVE consumption at settle time (which includes matches that finalized between this request and this settle). Stored as matched_amount_cents; may be < estimated_match_cents."

  - name: dollars_for_doers_grant
    trigger: "VolunteerLog LOGGED->APPROVED (POST /volunteer-logs/{logId}/approve)"
    algorithm: threshold
    formula: |
      raw_grant_cents = floor(minutes / 60 * program.dfd_rate_cents_per_hour)
      remaining = program.dfd_annual_cap_cents - employee.dfd_consumed_ytd_cents
      grant_amount_cents = max(0, min(raw_grant_cents, remaining))
    input_set: "consumption = sum(grant_amount_cents) over employee's VolunteerLog in {APPROVED, SETTLED} for the program tax_year"
    constants:
      MINUTES_PER_HOUR: 60
    precision: "integer cents, floor on the (minutes/60*rate) product"

  - name: disbursement_settlement
    trigger: "DisbursementBatch LOCKED->SETTLED (POST /disbursement-batches/{batchId}/settle)"
    algorithm: waterfall_allocation
    formula: |
      # PINNED rounding order: SUM grosses first, then take ONE fee on the sum
      # (NOT per-line then sum). Per-line allocation distributes that single fee.
      stage_grants = batch.grants where status == STAGED, ordered by Grant.created_at ASC, then Grant.id is NOT used.
      gross_total_cents = sum(g.gross_amount_cents for g in stage_grants)
      admin_fee_cents = floor(gross_total_cents * program.disbursement_admin_fee_rate)
      net_total_cents = gross_total_cents - admin_fee_cents
      # Allocate the single admin_fee_cents across lines, largest-remainder by
      # Grant.created_at ASC for any leftover cent:
      for g in stage_grants:
          g.admin_fee_cents = floor(g.gross_amount_cents * program.disbursement_admin_fee_rate)
      allocated = sum(g.admin_fee_cents)
      leftover = admin_fee_cents - allocated      # >= 0, distributed +1 cent per line by created_at ASC
      distribute leftover one cent at a time to lines in created_at ASC order
      for g in stage_grants:
          g.net_amount_cents = g.gross_amount_cents - g.admin_fee_cents
    input_set: "Grant rows of the batch in STAGED status only (VOIDED lines excluded)"
    constants: {}
    precision: "integer cents; floor on the batch-level fee; per-line floor then largest-remainder by created_at ASC"
    variants:
      - name: sum_then_fee
        when: "always (this scaffold pins this order)"
        difference: "Batch fee = floor(sum * rate). Contrast with per-line floor-then-sum, which can differ by 1 cent; the per-line numbers are an allocation OF the sum-level fee, never its source."

  - name: tax_statement_totals
    trigger: "POST /employees/{employeeId}/tax-statement"
    algorithm: aggregation
    formula: |
      donations = Donation rows where employee_id == employee
                  AND status == SETTLED
                  AND tax_deductible == true
                  AND year(settled_at) == program.tax_year
      deductible_donations_cents = sum(d.base_amount_cents for d in donations)
      line_count = count(donations)
      matched = MatchingGift rows where employee_id == employee
                AND status == SETTLED
                AND year(of linked donation.settled_at) == program.tax_year
      matched_total_cents = sum(m.matched_amount_cents for m in matched)
    input_set: "SETTLED + tax_deductible donations in tax_year; SETTLED matches in tax_year. PLEDGED/AUTHORIZED/REFUNDED/CANCELLED donations excluded; roundup_increment and processing_fee excluded (only base_amount_cents is deductible)"
    constants: {}
    precision: "integer cents"

  - name: payroll_deduction_ceiling
    trigger: "POST /payroll-schedules (create) and POST /donations (create with funding_method=PAYROLL_DEDUCTION)"
    algorithm: aggregation
    formula: |
      monthly_salary_cents = floor(employee.annual_salary_cents / 12)
      ceiling_cents = floor(monthly_salary_cents * MAX_DEDUCTION_FRACTION)
      committed = sum(per_period_amount_cents) over employee's PayrollDeductionSchedule in {ACTIVE, PAUSED}
      # A new schedule's per_period_amount_cents must satisfy committed + new <= ceiling_cents.
      if committed + new_per_period_amount_cents > ceiling_cents: reject ERR_DEDUCTION_LIMIT_EXCEEDED
    input_set: "PayrollDeductionSchedule rows in {ACTIVE, PAUSED} for the employee (CANCELLED excluded)"
    constants:
      MAX_DEDUCTION_FRACTION: 0.20
    precision: "integer cents, floor"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For Employee-acting endpoints, X-User-ID must equal the resource's employee_id (own resources only)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Employee-acted endpoints (donation cancel, schedule pause/resume/cancel)"

  - priority: 4
    category: existence
    check: "All path/body resource ids exist within the program, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts/minutes > 0, EIN format NN-NNNNNNN"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: business_referential
    check: "OCC: expected_batch_version must equal the live DisbursementBatch.version on grant staging"
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /disbursement-batches/{batchId}/grants"

  - priority: 7
    category: state
    check: "Target resource in a state from which this transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 8
    category: business_referential
    check: "Charity referenced by a launch/settle/volunteer/approve action must be APPROVED"
    error_id: ERR_CHARITY_NOT_APPROVED
    http_status: 409
    applies_to: "campaign launch/resume, volunteer-log approve, disbursement-batch settle"

  - priority: 9
    category: business_safety
    check: "Charity approval eligibility: claimed_501c3 true and EIN well-formed; review_rounds bound not exceeded"
    error_id: "ERR_CHARITY_NOT_ELIGIBLE > ERR_MAX_REVIEW_ROUNDS"
    http_status: 409
    applies_to: "charity approve, charity start-review (from NEEDS_INFO)"

  - priority: 10
    category: business_temporal
    check: "Donation pledge requires the clock within the campaign [window_start, window_end); recurring run-cycle requires clock within schedule [window_start, window_end)"
    error_id: "ERR_CAMPAIGN_WINDOW_CLOSED > ERR_SCHEDULE_WINDOW_CLOSED"
    http_status: 409
    applies_to: "donation create, payroll-schedule run-cycle"

  - priority: 11
    category: business_temporal
    check: "A new PayrollDeductionSchedule's [window_start, window_end) must not overlap (half-open) an existing {ACTIVE, PAUSED} schedule for the same employee+campaign"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "payroll-schedule create"

  - priority: 12
    category: business_temporal
    check: "A new DisbursementBatch coverage [period_start, period_end] (closed) must not overlap an existing {OPEN, LOCKED, SETTLED} batch for the same charity; touching endpoints conflict (closed semantics)"
    error_id: ERR_BATCH_PERIOD_OVERLAP
    http_status: 409
    applies_to: "disbursement-batch create"

  - priority: 13
    category: business_referential
    check: "A Grant's source must belong to the batch's charity chain and be in a disbursable state: Donation SETTLED, MatchingGift FINALIZED, VolunteerLog APPROVED; not already staged/settled elsewhere"
    error_id: "ERR_SOURCE_NOT_DISBURSABLE > ERR_SOURCE_ALREADY_GRANTED > ERR_GRANT_CHARITY_MISMATCH"
    http_status: 409
    applies_to: "disbursement-batch grants (stage)"

  - priority: 14
    category: business_fiscal
    check: "Payroll-deduction ceiling: committed + new per-period amount must not exceed 20% of monthly salary"
    error_id: ERR_DEDUCTION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "payroll-schedule create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["Logical clock set to to_iso8601 for all window/deadline checks"]

  # ---- Program ----
  - method: POST
    path: "/programs"
    description: "Create a giving Program (config: ratios, caps, fees)"
    roles: [ProgramManager]
    code: 201
    input: ["name", "tax_year", "match_ratio?", "tiered_matching_enabled?", "tier_1_ceiling_cents?", "tier_1_rate?", "tier_2_rate?", "annual_match_cap_cents?", "dfd_rate_cents_per_hour?", "dfd_annual_cap_cents?", "roundup_enabled?", "processing_fee_tier_threshold_cents?", "processing_fee_low_rate?", "processing_fee_high_rate?", "disbursement_admin_fee_rate?"]
    output: Program
    side_effects: ["status=DRAFT, version=1"]
  - method: GET
    path: "/programs/{programId}"
    description: "Get a Program"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: POST
    path: "/programs/{programId}/activate"
    description: "Activate a Program"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> ACTIVE", "increments Program.version by 1"]
  - method: POST
    path: "/programs/{programId}/close"
    description: "Close a Program"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["status -> CLOSED", "increments Program.version by 1"]
  - method: GET
    path: "/programs/{programId}/impact-report"
    description: "Computed impact dashboard for the program (totals donated, matched, DfD, disbursed)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: []
    output: "{ total_donated_cents: integer, total_matched_cents: integer, total_dfd_cents: integer, total_disbursed_net_cents: integer, charity_count: integer, donor_count: integer }"
    side_effects: []

  # ---- Employee ----
  - method: POST
    path: "/employees"
    description: "Enroll an Employee into a program"
    roles: [ProgramManager, GivingAdmin]
    code: 201
    input: ["program_id", "email", "full_name", "annual_salary_cents"]
    output: Employee
    side_effects: ["status=ACTIVE, match_consumed_ytd_cents=0, dfd_consumed_ytd_cents=0"]
  - method: GET
    path: "/employees/{employeeId}"
    description: "Get an Employee (includes consumed YTD caps)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: GET
    path: "/employees"
    description: "List Employees (filtered-list reverse-reachability for Employee.program_id)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []
  - method: POST
    path: "/employees/{employeeId}/suspend"
    description: "Suspend an Employee"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: []
    output: Employee
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/employees/{employeeId}/reinstate"
    description: "Reinstate a suspended Employee"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: []
    output: Employee
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/employees/{employeeId}/terminate"
    description: "Terminate an Employee (frees email for re-enrollment)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: []
    output: Employee
    side_effects: ["status -> TERMINATED (terminal)"]
  - method: POST
    path: "/employees/{employeeId}/tax-statement"
    description: "Generate the employee's year-end tax statement"
    roles: [GivingAdmin, Employee]
    code: 201
    input: []
    output: TaxStatement
    side_effects: ["Compute deductible_donations_cents, matched_total_cents, line_count (calc tax_statement_totals); status=GENERATED"]
  - method: GET
    path: "/tax-statements/{statementId}"
    description: "Get a generated tax statement"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: TaxStatement
    side_effects: []
  - method: GET
    path: "/tax-statements"
    description: "List tax statements (filtered-list reverse-reachability for TaxStatement.program_id and employee_id)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: ["program_id?", "employee_id?", "tax_year?", "limit?", "offset?"]
    output: "TaxStatement[]"
    side_effects: []

  # ---- Charity ----
  - method: POST
    path: "/charities"
    description: "Submit a Charity for vetting"
    roles: [GivingAdmin]
    code: 201
    input: ["program_id", "legal_name", "ein", "claimed_501c3?"]
    output: Charity
    side_effects: ["status=SUBMITTED, review_rounds=0"]
  - method: GET
    path: "/charities/{charityId}"
    description: "Get a Charity"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: Charity
    side_effects: []
  - method: GET
    path: "/charities"
    description: "List Charities (filtered-list reverse-reachability for Charity.program_id)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "Charity[]"
    side_effects: []
  - method: POST
    path: "/charities/{charityId}/start-review"
    description: "Move a Charity into UNDER_REVIEW (from SUBMITTED or NEEDS_INFO)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Charity
    side_effects: ["status -> UNDER_REVIEW", "increments review_rounds by 1"]
  - method: POST
    path: "/charities/{charityId}/request-info"
    description: "Request more info (UNDER_REVIEW -> NEEDS_INFO)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Charity
    side_effects: ["status -> NEEDS_INFO"]
  - method: POST
    path: "/charities/{charityId}/approve"
    description: "Approve a vetted Charity"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Charity
    side_effects: ["status -> APPROVED"]
  - method: POST
    path: "/charities/{charityId}/reject"
    description: "Reject a Charity"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Charity
    side_effects: ["status -> REJECTED (terminal)"]
  - method: POST
    path: "/charities/{charityId}/suspend"
    description: "Suspend an APPROVED Charity"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Charity
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/charities/{charityId}/reinstate"
    description: "Reinstate a SUSPENDED Charity"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Charity
    side_effects: ["status -> APPROVED"]

  # ---- Campaign ----
  - method: POST
    path: "/campaigns"
    description: "Create a Campaign (DRAFT)"
    roles: [ProgramManager]
    code: 201
    input: ["program_id", "charity_id", "name", "goal_cents", "window_start", "window_end"]
    output: Campaign
    side_effects: ["status=DRAFT, raised_cents=0"]
  - method: GET
    path: "/campaigns/{campaignId}"
    description: "Get a Campaign"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: GET
    path: "/campaigns"
    description: "List Campaigns (filtered-list reverse-reachability for Campaign.program_id and Campaign.charity_id)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: ["program_id?", "charity_id?", "status?", "limit?", "offset?"]
    output: "Campaign[]"
    side_effects: []
  - method: POST
    path: "/campaigns/{campaignId}/launch"
    description: "Launch a Campaign (DRAFT -> LIVE)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> LIVE"]
  - method: POST
    path: "/campaigns/{campaignId}/pause"
    description: "Pause a LIVE Campaign"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> PAUSED"]
  - method: POST
    path: "/campaigns/{campaignId}/resume"
    description: "Resume a PAUSED Campaign"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> LIVE"]
  - method: POST
    path: "/campaigns/{campaignId}/end"
    description: "End a Campaign"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> ENDED (terminal)"]

  # ---- Donation ----
  - method: POST
    path: "/donations"
    description: "Pledge a one-time or recurring donation; optionally request a matching gift inline"
    roles: [Employee, GivingAdmin]
    code: 201
    input: ["program_id", "employee_id", "campaign_id", "donation_type", "funding_method", "base_amount_cents", "tax_deductible?", "request_match?"]
    output: Donation
    side_effects:
      - "status=PLEDGED"
      - "If request_match==true: create a MatchingGift (REQUESTED) linked to this donation and compute estimated_match_cents (calc matching_gift_amount, estimated variant)"
  - method: GET
    path: "/donations/{donationId}"
    description: "Get a Donation (full computed breakdown)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: Donation
    side_effects: []
  - method: GET
    path: "/donations"
    description: "List Donations (filtered-list reverse-reachability for Donation.program_id, employee_id, campaign_id, schedule_id)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: ["program_id?", "employee_id?", "campaign_id?", "schedule_id?", "status?", "limit?", "offset?"]
    output: "Donation[]"
    side_effects: []
  - method: POST
    path: "/donations/{donationId}/authorize"
    description: "Authorize a pledged donation (computes amount breakdown)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Donation
    side_effects: ["status -> AUTHORIZED", "Compute amount breakdown (calc donation_amount_breakdown)"]
  - method: POST
    path: "/donations/{donationId}/settle"
    description: "Settle an authorized donation (finalizes linked matching gift, debits cap, raises campaign)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Donation
    side_effects:
      - "status -> SETTLED, set settled_at"
      - "Campaign.raised_cents += base_amount_cents"
      - "Finalize linked MatchingGift: REQUESTED -> FINALIZED or CAPPED; debit Employee.match_consumed_ytd_cents (calc matching_gift_amount, finalized variant)"
  - method: POST
    path: "/donations/{donationId}/cancel"
    description: "Cancel a pledged donation (donor only)"
    roles: [Employee]
    code: 200
    input: []
    output: Donation
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/donations/{donationId}/refund"
    description: "Refund a settled donation; reverses match and campaign total (compensating)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: Donation
    side_effects:
      - "status -> REFUNDED"
      - "Campaign.raised_cents -= base_amount_cents"
      - "Reverse linked FINALIZED MatchingGift -> REVERSED; credit Employee.match_consumed_ytd_cents back"

  # ---- PayrollDeductionSchedule ----
  - method: POST
    path: "/payroll-schedules"
    description: "Create a recurring payroll-deduction schedule (enforces overlap and deduction ceiling)"
    roles: [Employee, GivingAdmin]
    code: 201
    input: ["program_id", "employee_id", "campaign_id", "per_period_amount_cents", "window_start", "window_end"]
    output: PayrollDeductionSchedule
    side_effects: ["status=ACTIVE, occurrences_generated=0"]
  - method: GET
    path: "/payroll-schedules/{scheduleId}"
    description: "Get a payroll-deduction schedule"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: PayrollDeductionSchedule
    side_effects: []
  - method: GET
    path: "/payroll-schedules"
    description: "List schedules (filtered-list reverse-reachability for program_id, employee_id, campaign_id)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: ["program_id?", "employee_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: "PayrollDeductionSchedule[]"
    side_effects: []
  - method: POST
    path: "/payroll-schedules/{scheduleId}/pause"
    description: "Pause a schedule (owner only)"
    roles: [Employee]
    code: 200
    input: []
    output: PayrollDeductionSchedule
    side_effects: ["status -> PAUSED"]
  - method: POST
    path: "/payroll-schedules/{scheduleId}/resume"
    description: "Resume a paused schedule (owner only)"
    roles: [Employee]
    code: 200
    input: []
    output: PayrollDeductionSchedule
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/payroll-schedules/{scheduleId}/cancel"
    description: "Cancel a schedule (owner only)"
    roles: [Employee]
    code: 200
    input: []
    output: PayrollDeductionSchedule
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/payroll-schedules/{scheduleId}/run-cycle"
    description: "Generate one recurring Donation occurrence for the current period"
    roles: [GivingAdmin]
    code: 201
    input: []
    output: Donation
    side_effects: ["Create a RECURRING PLEDGED Donation linked via schedule_id", "Increment occurrences_generated by 1"]

  # ---- MatchingGift ----
  - method: GET
    path: "/matching-gifts/{matchId}"
    description: "Get a matching gift (estimated vs final)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: MatchingGift
    side_effects: []
  - method: GET
    path: "/matching-gifts"
    description: "List matching gifts (filtered-list reverse-reachability for program_id, donation_id, employee_id)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: ["program_id?", "donation_id?", "employee_id?", "status?", "limit?", "offset?"]
    output: "MatchingGift[]"
    side_effects: []

  # ---- VolunteerLog ----
  - method: POST
    path: "/volunteer-logs"
    description: "Log volunteer time for dollars-for-doers"
    roles: [Employee, GivingAdmin]
    code: 201
    input: ["program_id", "employee_id", "charity_id", "minutes", "activity_date"]
    output: VolunteerLog
    side_effects: ["status=LOGGED"]
  - method: GET
    path: "/volunteer-logs/{logId}"
    description: "Get a volunteer log (grant breakdown)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: []
    output: VolunteerLog
    side_effects: []
  - method: GET
    path: "/volunteer-logs"
    description: "List volunteer logs (filtered-list reverse-reachability for program_id, employee_id, charity_id)"
    roles: [GivingAdmin, ProgramManager, Employee]
    code: 200
    input: ["program_id?", "employee_id?", "charity_id?", "status?", "limit?", "offset?"]
    output: "VolunteerLog[]"
    side_effects: []
  - method: POST
    path: "/volunteer-logs/{logId}/approve"
    description: "Approve a volunteer log (computes DfD grant, debits DfD cap)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: VolunteerLog
    side_effects: ["status -> APPROVED", "Compute grant_amount_cents (calc dollars_for_doers_grant)", "Employee.dfd_consumed_ytd_cents += grant_amount_cents"]
  - method: POST
    path: "/volunteer-logs/{logId}/reject"
    description: "Reject a volunteer log"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: VolunteerLog
    side_effects: ["status -> REJECTED (terminal)"]
  - method: POST
    path: "/volunteer-logs/{logId}/reverse"
    description: "Reverse an approved (not-yet-disbursed) log; credits DfD cap back"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: VolunteerLog
    side_effects: ["status -> REVERSED", "Employee.dfd_consumed_ytd_cents -= grant_amount_cents (compensating)"]

  # ---- DisbursementBatch + Grant ----
  - method: POST
    path: "/disbursement-batches"
    description: "Open a disbursement batch for a charity coverage period"
    roles: [GivingAdmin]
    code: 201
    input: ["program_id", "charity_id", "period_start", "period_end"]
    output: DisbursementBatch
    side_effects: ["status=OPEN, version=1, totals=0"]
  - method: GET
    path: "/disbursement-batches/{batchId}"
    description: "Get a disbursement batch (totals + version for OCC)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: []
    output: DisbursementBatch
    side_effects: []
  - method: GET
    path: "/disbursement-batches"
    description: "List batches (filtered-list reverse-reachability for program_id, charity_id)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: ["program_id?", "charity_id?", "status?", "limit?", "offset?"]
    output: "DisbursementBatch[]"
    side_effects: []
  - method: POST
    path: "/disbursement-batches/{batchId}/grants"
    description: "Stage a Grant (donation/match/DfD source) into the batch; OCC-guarded by expected_batch_version"
    roles: [GivingAdmin]
    code: 201
    input: ["source_type", "source_id", "expected_batch_version"]
    output: Grant
    side_effects: ["Create Grant (STAGED), copy charity_id, set gross_amount_cents from source", "increments DisbursementBatch.version by 1"]
  - method: GET
    path: "/disbursement-batches/{batchId}/grants"
    description: "List Grants in a batch (sub-resource reverse-reachability for Grant.batch_id)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Grant[]"
    side_effects: []
  - method: GET
    path: "/grants/{grantId}"
    description: "Get a Grant"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: GET
    path: "/grants"
    description: "List Grants (filtered-list reverse-reachability for Grant.program_id, charity_id, source_id)"
    roles: [GivingAdmin, ProgramManager]
    code: 200
    input: ["program_id?", "charity_id?", "batch_id?", "source_id?", "source_type?", "status?", "limit?", "offset?"]
    output: "Grant[]"
    side_effects: []
  - method: POST
    path: "/disbursement-batches/{batchId}/lock"
    description: "Lock a batch (freezes the staged set; OCC source version bumps)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: DisbursementBatch
    side_effects: ["status -> LOCKED", "increments DisbursementBatch.version by 1"]
  - method: POST
    path: "/disbursement-batches/{batchId}/settle"
    description: "Settle a locked batch (computes fees, settles grants, propagates to sources, credits charity)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: DisbursementBatch
    side_effects:
      - "status -> SETTLED"
      - "Compute gross_total_cents, admin_fee_cents (sum-then-fee), per-line allocation, net_total_cents (calc disbursement_settlement)"
      - "Each STAGED Grant -> SETTLED; MATCH source MatchingGift -> SETTLED; DFD source VolunteerLog -> SETTLED"
      - "Charity.total_received_cents += net_total_cents"
      - "increments DisbursementBatch.version by 1"
  - method: POST
    path: "/disbursement-batches/{batchId}/void"
    description: "Void an OPEN batch (voids its staged grants)"
    roles: [GivingAdmin]
    code: 200
    input: []
    output: DisbursementBatch
    side_effects: ["status -> VOIDED", "Each STAGED Grant -> VOIDED", "increments DisbursementBatch.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / existence / request ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Employee acting on a resource whose employee_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, non-positive amount/minutes, bad EIN format" }

  # --- Concurrency ---
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version != live DisbursementBatch.version on grant staging" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is allowed" }

  # --- Program ---
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires Program.status == ACTIVE" }
  - { id: ERR_OPEN_BATCH_EXISTS, http: 409, condition: "Cannot close a program while an OPEN/LOCKED DisbursementBatch exists under it" }

  # --- Charity ---
  - { id: ERR_CHARITY_NOT_ELIGIBLE, http: 409, condition: "Charity approval blocked: claimed_501c3 false or EIN not NN-NNNNNNN" }
  - { id: ERR_MAX_REVIEW_ROUNDS, http: 409, condition: "Charity vetting loop exceeded the review_rounds < 3 bound" }
  - { id: ERR_CHARITY_NOT_APPROVED, http: 409, condition: "Referenced charity is not APPROVED for this operation" }
  - { id: ERR_DUPLICATE_EIN, http: 409, condition: "EIN already used by a non-REJECTED charity in the program" }

  # --- Campaign / window ---
  - { id: ERR_CAMPAIGN_NOT_LIVE, http: 409, condition: "Donation settle / run-cycle requires the campaign to be LIVE" }
  - { id: ERR_CAMPAIGN_WINDOW_CLOSED, http: 409, condition: "Clock is outside the campaign [window_start, window_end) at pledge time" }

  # --- Employee ---
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Donor/volunteer employee is not ACTIVE" }
  - { id: ERR_DUPLICATE_EMPLOYEE_EMAIL, http: 409, condition: "Email already used by a non-TERMINATED employee in the program" }

  # --- Payroll schedule ---
  - { id: ERR_SCHEDULE_WINDOW_CLOSED, http: 409, condition: "run-cycle invoked while clock outside the schedule [window_start, window_end)" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "New schedule window overlaps (half-open) an existing ACTIVE/PAUSED schedule for the same employee+campaign" }
  - { id: ERR_DEDUCTION_LIMIT_EXCEEDED, http: 409, condition: "Committed + new per-period deduction exceeds 20% of monthly salary" }

  # --- Donation / disbursement ---
  - { id: ERR_DONATION_DISBURSED, http: 409, condition: "Cannot refund a donation whose grant is STAGED or SETTLED" }
  - { id: ERR_LOG_DISBURSED, http: 409, condition: "Cannot reverse a volunteer log whose grant is STAGED or SETTLED" }
  - { id: ERR_EMPTY_BATCH, http: 409, condition: "Cannot lock a batch with no STAGED grants" }
  - { id: ERR_BATCH_PERIOD_OVERLAP, http: 409, condition: "New batch coverage period overlaps (closed semantics, touching endpoints conflict) an existing OPEN/LOCKED/SETTLED batch for the charity" }
  - { id: ERR_SOURCE_NOT_DISBURSABLE, http: 409, condition: "Grant source not in a disbursable state (Donation SETTLED / Match FINALIZED / Log APPROVED)" }
  - { id: ERR_SOURCE_ALREADY_GRANTED, http: 409, condition: "Source already staged or settled in another grant" }
  - { id: ERR_GRANT_CHARITY_MISMATCH, http: 409, condition: "Grant source's beneficiary charity differs from the batch charity" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "Configures programs and campaigns; segregation of duties keeps config separate from vetting/disbursement"
    identity: opaque
    exclusive_operations:
      - "POST /programs — Create program"
      - "POST /programs/{id}/activate — Activate program"
      - "POST /programs/{id}/close — Close program"
      - "POST /campaigns — Create campaign"
      - "POST /campaigns/{id}/launch — Launch campaign"
      - "POST /campaigns/{id}/pause — Pause campaign"
      - "POST /campaigns/{id}/resume — Resume campaign"
      - "POST /campaigns/{id}/end — End campaign"
    shared_operations:
      - "POST /employees — Enroll employee (with GivingAdmin)"
      - "POST /employees/{id}/suspend — Suspend employee (with GivingAdmin)"
      - "POST /employees/{id}/reinstate — Reinstate employee (with GivingAdmin)"
      - "POST /employees/{id}/terminate — Terminate employee (with GivingAdmin)"
      - "GET endpoints (program, employee, charity, campaign, donation, schedule, match, log, batch, grant, impact-report)"

  - name: GivingAdmin
    description: "Operates charity vetting, donation lifecycle, volunteer approval, and disbursement; cannot configure programs/campaigns"
    identity: opaque
    exclusive_operations:
      - "POST /charities — Submit charity"
      - "POST /charities/{id}/start-review — Start review"
      - "POST /charities/{id}/request-info — Request info"
      - "POST /charities/{id}/approve — Approve charity"
      - "POST /charities/{id}/reject — Reject charity"
      - "POST /charities/{id}/suspend — Suspend charity"
      - "POST /charities/{id}/reinstate — Reinstate charity"
      - "POST /donations/{id}/authorize — Authorize donation"
      - "POST /donations/{id}/settle — Settle donation"
      - "POST /donations/{id}/refund — Refund donation"
      - "POST /payroll-schedules/{id}/run-cycle — Generate recurring occurrence"
      - "POST /volunteer-logs/{id}/approve — Approve volunteer log"
      - "POST /volunteer-logs/{id}/reject — Reject volunteer log"
      - "POST /volunteer-logs/{id}/reverse — Reverse volunteer log"
      - "POST /disbursement-batches — Open batch"
      - "POST /disbursement-batches/{id}/grants — Stage grant"
      - "POST /disbursement-batches/{id}/lock — Lock batch"
      - "POST /disbursement-batches/{id}/settle — Settle batch"
      - "POST /disbursement-batches/{id}/void — Void batch"
      - "POST /_clock/set_current_utc — Set logical clock"
    shared_operations:
      - "POST /employees — Enroll employee (with ProgramManager)"
      - "POST /employees/{id}/suspend — Suspend employee (with ProgramManager)"
      - "POST /employees/{id}/reinstate — Reinstate employee (with ProgramManager)"
      - "POST /employees/{id}/terminate — Terminate employee (with ProgramManager)"
      - "POST /donations — Pledge donation (with Employee)"
      - "POST /payroll-schedules — Create schedule (with Employee)"
      - "POST /volunteer-logs — Log volunteer time (with Employee)"
      - "POST /employees/{id}/tax-statement — Generate tax statement (with Employee)"
      - "GET endpoints"

  - name: Employee
    description: "Acts only on own donations, schedules, volunteer logs, and tax statement (X-User-ID == employee_id)"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /donations/{id}/cancel — Cancel own pledged donation"
      - "POST /payroll-schedules/{id}/pause — Pause own schedule"
      - "POST /payroll-schedules/{id}/resume — Resume own schedule"
      - "POST /payroll-schedules/{id}/cancel — Cancel own schedule"
    shared_operations:
      - "POST /donations — Pledge own donation (with GivingAdmin)"
      - "POST /payroll-schedules — Create own schedule (with GivingAdmin)"
      - "POST /volunteer-logs — Log own volunteer time (with GivingAdmin)"
      - "POST /employees/{id}/tax-statement — Generate own tax statement (with GivingAdmin)"
      - "GET endpoints (own/program-scoped reads)"

  - name: system
    description: "Internal automation actor for cascade-driven transitions (match finalize/reverse/settle, log settle); not an HTTP caller"
    identity: opaque
    exclusive_operations: []
    shared_operations: []
