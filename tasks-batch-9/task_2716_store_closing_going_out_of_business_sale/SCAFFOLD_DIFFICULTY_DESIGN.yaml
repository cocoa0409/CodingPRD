        grounds:
          - state_machines.LeaseDisposition.OFFER_SENT_to_LANDLORD_COUNTERED
          - state_machines.LeaseDisposition.LANDLORD_COUNTERED_to_OFFER_SENT
          - entities.LeaseDisposition.fields.negotiation_round
          - validations[priority=73]
          - errors[ERR_MAX_NEGOTIATION_ROUNDS]
        distinguishing_aspect: |
          A genuine cycle: LANDLORD_COUNTERED returns to OFFER_SENT, so the disposition revisits a
          state it already occupied, and termination is governed by a loop counter
          (negotiation_round) rather than by the state alone — the fourth offer is refused from the
          exact same LANDLORD_COUNTERED state that accepted the second and third.
