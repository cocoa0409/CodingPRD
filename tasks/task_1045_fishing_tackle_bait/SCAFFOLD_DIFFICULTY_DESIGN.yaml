  # =================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: guide_charter_turnaround_buffer_conflict
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_GUIDE_SCHEDULE_CONFLICT]"
        distinguishing_aspect: "On the Guide resource, two charters must be separated by TURNAROUND_BUFFER_MINUTES (60): a charter starting 30 min after the prior ends is rejected, while one starting exactly 60 min after is accepted — closed-interval-plus-buffer semantics."
        test_recipe:
          setup:
            - "Guide G with charter C1 on 2026-08-01 09:00-12:00."
          setup_api_calls:
            - call: "POST /api/guides"
              payload: { name: "Cap N", license_no: "N-1" }
              as: ShopManager
              captures: { g_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "C1", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "C2", start_at: "2026-08-01T12:30:00Z", end_at: "2026-08-01T15:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { err: "$.data.error_id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g_id}", title: "C3", start_at: "2026-08-01T13:00:00Z", end_at: "2026-08-01T15:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c3_id: "$.data.id" }
          assert:
            - "err == ERR_GUIDE_SCHEDULE_CONFLICT"
            - "Charter.${c3_id}.status == OPEN"

      - name: angler_overlapping_bookings_halfopen_adjacent_allowed
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_ANGLER_SCHEDULE_CONFLICT]"
        distinguishing_aspect: "On the Customer resource, two bookings whose charter windows overlap are rejected, but back-to-back windows (one starting exactly when another ends) are allowed — half-open [start,end) semantics with no buffer, a different interval treatment and a different resource entity than the guide buffer rule."
