              as: SegmentAnalyst
              as_user_id: "u_dual"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_dual"
          trigger:
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_dual"
          assert:
            - "Segment.${seg_id}.submitted_by_user_id == u_dual with status PENDING_GOVERNANCE_REVIEW"
            - "the trigger returns status 409"
            - "the response body error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Segment.${seg_id}.status is still PENDING_GOVERNANCE_REVIEW with decided_by_user_id null and rejection_count 0"
            - "the same call as DataGovernanceOfficer u_gov returns 200 — only the identity collision was refused"

  # ===========================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS (optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation, rate_threshold_triggers)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: consent_capture_with_stale_expected_profile_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[consent-capture-stale-profile]
          - errors[ERR_STALE_PROFILE_VERSION]
          - endpoints[POST /cdp/consent-records]
        distinguishing_aspect: "The profile version is bumped by a write on a DIFFERENT entity — a suppression capture — so a client holding the pre-suppression view is refused 412 even though it never touched consent, and the refusal is re-tried successfully with the refreshed version."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of a single fully valid record; the profile version observed at that point is captured as the client's stale view."
            - "A DO_NOT_SELL SuppressionEntry is then created for the profile, which moves privacy_status to SUPPRESSED and increments Profile.version."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "CC_OCC_P"
                display_name: "Profile OCC Feed"
                channel_type: "WEB"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Profile OCC Single"
                records:
                  - external_id: "OP1"
                    email_raw: "op1@example.com"
                    phone_raw: "+1 (555) 720-0001"
                    loyalty_number: "LY00007201"
                    first_name: "Ada"
                    last_name: "Alpha"
                    postal_code: "10001"
                    address_line: null
                    event_timestamp: "2026-07-30T10:00:00Z"
                    consent_signals: []
              as: DataEngineer
              as_user_id: "u_eng"
              captures: { batch_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches/${batch_id}/validate"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "POST /cdp/ingest-batches/${batch_id}/promote"
              payload: {}
              as: DataEngineer
              as_user_id: "u_eng"
            - call: "GET /cdp/profiles"
              payload: { origin_batch_id: "${batch_id}" }
              as: PrivacyOfficer
              as_user_id: "u_privacy"
              captures: { subject_id: "$.data[0].id", stale_v: "$.data[0].version" }
            - call: "POST /cdp/suppression-entries"
              payload:
                profile_id: "${subject_id}"
                entry_type: "DO_NOT_SELL"
                reason_code: "OCC_BUMP"
                effective_at: "2026-08-01T00:00:00Z"
              as: PrivacyOfficer
              as_user_id: "u_privacy"
          trigger:
            - call: "POST /cdp/consent-records"
              payload:
                profile_id: "${subject_id}"
                source_system_id: "${src_id}"
                channel: "EMAIL"
                purpose: "MARKETING"
                consent_state: "OPT_IN"
                captured_at: "2026-08-01T00:00:00Z"
                expected_profile_version: "${stale_v}"
              as: PrivacyOfficer
              as_user_id: "u_privacy"
          assert:
            - "the suppression create returned 201 and Profile.${subject_id}.privacy_status == SUPPRESSED"
            - "Profile.${subject_id}.version is exactly one greater than ${stale_v}"
            - "the trigger returns status 412"
            - "the response body error_id == ERR_STALE_PROFILE_VERSION"
            - "GET /cdp/consent-records returns total_count 0"
            - "re-reading the profile and re-issuing the identical capture with the refreshed version returns 201"

      - name: activation_create_with_stale_expected_segment_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[activation-create-stale-segment]
          - errors[ERR_STALE_SEGMENT_VERSION]
          - endpoints[POST /cdp/activations]
        distinguishing_aspect: "Each successful activation create bumps the segment it targets, so the version token is single-use: replaying the same expected_segment_version for a second activation is refused 412 before the cooldown and concurrency rungs are ever reached."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE EMAIL Destination with cooldown_minutes 0 and max_concurrent_activations 3, so neither separation rung could explain a refusal."
            - "One APPROVED Segment; the version returned by the approval is captured and used twice."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/destinations"
              payload:
                code: "CC_OCC_DEST"
                platform_kind: "ADVERTISING"
                channel: "EMAIL"
                hashing_algorithm: "SHA256_EMAIL_LOWER"
                daily_hash_quota: 300
                min_audience_size: 1
                min_match_rate: 0.10
                cooldown_minutes: 0
                max_concurrent_activations: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { dest_id: "$.data.id" }
            - call: "POST /cdp/segments"
              payload:
                name: "Segment OCC Segment"
                criteria:
                  - { attribute: "postal_code", operator: "EQ", value: "10001" }
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { seg_id: "$.data.id" }
            - call: "POST /cdp/segments/${seg_id}/submit-for-review"
              payload: {}
              as: SegmentAnalyst
              as_user_id: "u_analyst"
            - call: "POST /cdp/segments/${seg_id}/governance-decision"
              payload: { decision: "APPROVE", sensitive_use_approved: false }
              as: DataGovernanceOfficer
              as_user_id: "u_gov"
              captures: { seg_v: "$.data.version" }
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-05T00:00:00Z"
                window_end_at: "2026-08-05T02:00:00Z"
                expected_segment_version: "${seg_v}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
              captures: { act1_id: "$.data.id" }
          trigger:
            - call: "POST /cdp/activations"
              payload:
                segment_id: "${seg_id}"
                destination_id: "${dest_id}"
                window_start_at: "2026-08-06T00:00:00Z"
                window_end_at: "2026-08-06T02:00:00Z"
                expected_segment_version: "${seg_v}"
              as: SegmentAnalyst
              as_user_id: "u_analyst"
          assert:
            - "the first create returned 201 and Segment.${seg_id}.active_activation_count == 1 with its version one greater than ${seg_v}"
            - "the trigger returns status 412"
            - "the response body error_id == ERR_STALE_SEGMENT_VERSION"
            - "GET /cdp/activations returns total_count 1 — only ${act1_id} exists"
            - "Segment.${seg_id}.active_activation_count is still 1 and its version did not move again"
            - "re-reading the segment and re-issuing the identical create with the refreshed version returns 201"

      - name: propagate_with_stale_expected_deletion_request_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[propagate-stale-deletion-request]
          - errors[ERR_STALE_DELETION_REQUEST_VERSION]
          - validations[priority=20]
        distinguishing_aspect: "The OCC rung at priority 20 outranks the state rung at 21: a replayed propagate on an already-VERIFIED request answers 412 for the stale version rather than 409 for the terminal state, so the version token is what the client must refresh first."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of a single fully valid record; no Destination exists, so zero destinations qualify."
            - "One DeletionRequest, propagated once with its creation version, which verifies immediately and bumps the version."
