              payload: { to_iso8601: "2026-09-30T23:59:59Z" }
              as: ProgramAdmin
              captures: { pre_exp: $.data.expired_certificate_count, pre_lots: $.data.transitioned_lot_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { post_exp: $.data.expired_certificate_count, post_lots: $.data.transitioned_lot_count }
            - call: "GET /metrology/material-lots/${lot_c50}"
              as: InventoryManager
              captures: { l50_status: $.data.status, l50_reason: $.data.hold_reason }
            - call: "POST /metrology/sales-orders"
              payload: { lot_id: "${lot_c50}", quantity: 1 }
              as: Customer
              as_user_id: "${c_c50}"
              captures: { err: $.data.error_id }
          assert:
            - "pre_exp == 0 and pre_lots == 0 (one second before expiration nothing fires)"
            - "post_exp == 1 and post_lots == 1 (now == expiration_date expires)"
            - "l50_status == DISTRIBUTION_HOLD and l50_reason == CERTIFICATE_EXPIRED"
            - "err == ERR_LOT_NOT_DISTRIBUTABLE"

      - name: dual_variant_coverage_stub
        claim_type: variant_divergence
        grounds: [calculations.certified_value_assignment, calculations.order_pricing]
        excluded_because:
          difficulty_instance: dual_variant_calc / weighted_vs_unweighted_certified_value
          rationale: "Both variant pairs (value assignment and order-vs-ship pricing) are asserted with literals in §1.8."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: a lot read back in the next request shows exactly the state, version, and updated_at its mutation response reported."
        test_recipe:
          setup: ["program P; lot L created"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C51", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c51: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c51}", material_code: "SRM-C51", matrix_description: "m", total_units_produced: 10 }
              as: ProgramAdmin
              captures: { lot_c51: $.data.id }
            - call: "POST /metrology/material-lots/${lot_c51}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
              captures: { w_status: $.data.status, w_v: $.data.version, w_upd: $.data.updated_at, w_f: $.data.homogeneity_f_ratio }
          trigger:
            - call: "GET /metrology/material-lots/${lot_c51}"
              as: Metrologist
              captures: { r_status: $.data.status, r_v: $.data.version, r_upd: $.data.updated_at, r_f: $.data.homogeneity_f_ratio }
          assert:
            - "r_status == w_status == VALUE_ASSIGNMENT and r_v == w_v == 2 and r_upd == w_upd and r_f == w_f == 0.0"
