          trigger:
            - call: "POST /properties/${p_id}/batches/${bat_id}/visits/${v_id}/start"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (not ERR_VISIT_TOO_EARLY) — priority 5 beats priority 7"

      - name: referential_beats_safety_on_deficiency
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_DEFICIENCY_ASSET_MISMATCH]
        distinguishing_aspect: |
          Pair (business_referential vs business_safety): recording a
          deficiency whose asset_id differs from the visit's asset must return
