scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: patient_creation_success_returns_server_fields
        claim_type: creation
        grounds: [entities.Patient, endpoints.POST_/oncology/patients]
        distinguishing_aspect: "POST /oncology/patients with all required fields returns 201 with server-minted id, created_at, updated_at, and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-E1", full_name: "Entity One", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { pat: $.data.id, v: $.data.version } }
          assert:
            - "v == 1 and pat is a server-minted UUID"
            - "response echoes mrn MRN-E1 and status fields absent (Patient has no status machine)"

      - name: patient_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Patient.fields.mrn, "validations[priority=4]"]
        distinguishing_aspect: "Omitting the required mrn field is a schema violation -> 400 ERR_INVALID_REQUEST, checked before any uniqueness logic."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /oncology/patients", payload: { full_name: "No Mrn", date_of_birth: "1980-01-01" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: patient_duplicate_mrn_rejected
        claim_type: type_constraints
        grounds: [entities.Patient.fields.mrn, "validations[priority=11]"]
        distinguishing_aspect: "MRN uniqueness is a business_constraint (priority 11): a second patient with the same mrn is rejected with 422 ERR_DUPLICATE_MRN."
        test_recipe:
          setup: ["patient MRN-DUP exists"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-DUP", full_name: "First", date_of_birth: "1980-01-01" }, as: Scheduler }
          trigger:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-DUP", full_name: "Second", date_of_birth: "1990-02-02" }, as: Scheduler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_MRN (http 422)"

      - name: course_creation_computed_defaults
        claim_type: computed_fields
        grounds: [entities.TreatmentCourse.fields.dose_per_fraction_cGy, entities.TreatmentCourse.fields.status]
        distinguishing_aspect: "Course creation computes dose_per_fraction_cGy (6000/30 = 200), initializes all counters to 0, and starts in CONSULT."
        test_recipe:
          setup: ["patient exists"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-E4", full_name: "Entity Four", date_of_birth: "1975-05-05" }, as: Scheduler, captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 6000, planned_fractions: 30 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id, dpf: $.data.dose_per_fraction_cGy, st: $.data.status } }
          assert:
            - "dpf == 200 (round_half_up(6000/30))"
            - "st == CONSULT (initial state)"
            - "delivered_fractions == 0, delivered_dose_cGy == 0, fractions_since_chart_review == 0, weekend_makeup_allowance == 0, open_interruption_count == 0"

      - name: course_invalid_technique_enum_rejected
        claim_type: type_constraints
        grounds: [entities.TreatmentCourse.fields.technique, "validations[priority=4]"]
        distinguishing_aspect: "technique is a closed enum {THREE_DCRT, IMRT, SBRT}; PROTON is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["patient exists"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-E5", full_name: "Entity Five", date_of_birth: "1975-05-05" }, as: Scheduler, captures: { pat: $.data.id } }
          trigger:
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "PROTON", prescribed_total_dose_cGy: 6000, planned_fractions: 30 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: patient_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Patient]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored; the server mints its own id and starts version at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-E6", full_name: "Entity Six", date_of_birth: "1980-01-01", id: "00000000-0000-4000-8000-00000000beef", version: 99 }, as: Scheduler, captures: { pat: $.data.id, v: $.data.version } }
          assert:
            - "pat != 00000000-0000-4000-8000-00000000beef (client-supplied id ignored) and v == 1 (client-supplied version ignored)"

      - name: physics_check_immutable_record_no_version
        claim_type: immutability
        grounds: [entities.PhysicsCheck]
        distinguishing_aspect: "PhysicsCheck has common_fields: false — the created record exposes id and created_at only (no version, no updated_at) and no update endpoint exists for it."
        test_recipe:
          setup:
            - "IMRT course 4000/8 with APPROVED contour set and plan submitted for check (PENDING_PRIMARY_CHECK)"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-E7", full_name: "Entity Seven", date_of_birth: "1970-07-07" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C73", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 4000, planned_fractions: 8 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-E7", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: ["Cord"] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 4000, planned_fractions: 8, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 4500, evaluated_value_cGy: 4000 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
          trigger:
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a", captures: { chk: $.data.id, chk_checker: $.data.checker_id } }
          assert:
            - "chk_checker == phys_a (checker recorded from X-User-ID)"
            - "the PhysicsCheck record has no version field and no updated_at field (append-only, common_fields: false)"
            - "GET /oncology/treatment-plans/${pl}/physics-checks returns exactly 1 record"

      - name: fraction_sessions_list_scoped_to_owning_course
        claim_type: parent_relationships
        grounds: [entities.FractionSession.fields.course_id, "endpoints.GET_/oncology/treatment-courses/{id}/fraction-sessions"]
        distinguishing_aspect: "The per-course list endpoint returns only that course's sessions: course A with one booked session lists 1, unrelated course B lists 0."
        test_recipe:
          setup:
            - "course A (IMRT 2000/10) TREATMENT_READY with 1 session booked"
            - "course B (THREE_DCRT 3000/10) freshly created in CONSULT"
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-E8A", full_name: "Entity Eight A", date_of_birth: "1971-01-01" }, as: Scheduler, captures: { pat_a: $.data.id } }
            - { call: "POST /oncology/patients/${pat_a}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_a: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-E8", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-E8", machine_type: "LINAC", room: "TX1" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs_a}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs_a}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs_a}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs_a}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 2000, evaluated_value_cGy: 1500 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "POST /oncology/treatment-courses/${crs_a}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler }
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-E8B", full_name: "Entity Eight B", date_of_birth: "1972-02-02" }, as: Scheduler, captures: { pat_b: $.data.id } }
            - { call: "POST /oncology/patients/${pat_b}/treatment-courses", payload: { diagnosis_code: "C18", intent: "PALLIATIVE", technique: "THREE_DCRT", prescribed_total_dose_cGy: 3000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_b: $.data.id } }
          trigger:
            - { call: "GET /oncology/treatment-courses/${crs_a}/fraction-sessions", payload: {}, as: Scheduler }
            - { call: "GET /oncology/treatment-courses/${crs_b}/fraction-sessions", payload: {}, as: Scheduler }
          assert:
            - "course A list contains exactly 1 FractionSession"
            - "course B list is empty (total_count == 0)"
  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: simulation_initial_state_is_scheduled
        claim_type: initial_state
        grounds: [state_machines.SimulationAppointment]
        distinguishing_aspect: "A newly booked SimulationAppointment starts in SCHEDULED and the booking moves the course CONSULT -> SIMULATION_SCHEDULED."
        test_recipe:
          setup: ["course in CONSULT; CT_SIMULATOR machine OPERATIONAL"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-S1", full_name: "State One", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-S1", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
          trigger:
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id, sim_st: $.data.status } }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: Scheduler, captures: { crs_st: $.data.status } }
          assert:
            - "sim_st == SCHEDULED"
            - "crs_st == SIMULATION_SCHEDULED (first-booking auto-transition)"

      - name: simulation_double_complete_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SimulationAppointment.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "COMPLETED is terminal for the appointment: a second complete call fails with ERR_SIMULATION_NOT_SCHEDULED and does not overwrite patient_weight_kg."
        test_recipe:
          setup: ["appointment COMPLETED with patient_weight_kg 80.0; course SIMULATED"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-S2", full_name: "State Two", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-S2", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
          trigger:
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 99.9 }, as: RadiationTherapist, as_user_id: "rtt_a", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SIMULATION_NOT_SCHEDULED"
            - "SimulationAppointment.${sim_a}.patient_weight_kg remains 80.0"

      - name: deliver_cancelled_session_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FractionSession.SCHEDULED_to_DELIVERED, state_machines.FractionSession.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "A CANCELLED session cannot be delivered: deliver fails with ERR_SESSION_NOT_SCHEDULED and no dose or charge side effects fire."
        test_recipe:
          setup: ["IMRT course 2000/10 TREATMENT_READY; session booked then cancelled"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-S3", full_name: "State Three", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-S3", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "Linac-S3", machine_type: "LINAC", room: "TX1" }, as: SystemAdmin, captures: { lin_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
            - { call: "POST /oncology/contour-sets/${cs}/submit", payload: {}, as: RadiationOncologist, as_user_id: "onc_a" }
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b" }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs_v: $.data.version } }
            - { call: "POST /oncology/treatment-courses/${crs}/treatment-plans", payload: { contour_set_id: "${cs}", target_total_dose_cGy: 2000, planned_fractions: 10, expected_course_version: "${crs_v}" }, as: MedicalDosimetrist, as_user_id: "dos_a", captures: { pl: $.data.id } }
            - { call: "POST /oncology/treatment-plans/${pl}/dose-constraints", payload: { structure_name: "Cord", constraint_type: "MAX_DOSE", limit_cGy: 2000, evaluated_value_cGy: 1500 }, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/submit-for-check", payload: {}, as: MedicalDosimetrist, as_user_id: "dos_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "PRIMARY", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_a" }
            - { call: "POST /oncology/treatment-plans/${pl}/physics-checks", payload: { check_type: "SECOND", outcome: "PASS" }, as: MedicalPhysicist, as_user_id: "phys_b" }
            - { call: "POST /oncology/treatment-courses/${crs}/fraction-sessions", payload: { plan_id: "${pl}", machine_id: "${lin_m}", start_time: "2026-08-03T09:00:00Z", end_time: "2026-08-03T09:20:00Z" }, as: Scheduler, captures: { fx: $.data.id } }
            - { call: "POST /oncology/fraction-sessions/${fx}/cancel", payload: { reason: "PATIENT" }, as: Scheduler }
          trigger:
            - { call: "POST /oncology/fraction-sessions/${fx}/deliver", payload: {}, as: RadiationTherapist, as_user_id: "rtt_a", captures: { err: $.data.error_id } }
            - { call: "GET /oncology/treatment-courses/${crs}", payload: {}, as: RadiationOncologist, as_user_id: "onc_a", captures: { df: $.data.delivered_fractions } }
          assert:
            - "err == ERR_SESSION_NOT_SCHEDULED"
            - "df == 0 (no delivery counters mutated)"

      - name: contour_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ContourSet.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Approve requires SUBMITTED: approving a DRAFT contour set fails with ERR_CONTOUR_NOT_SUBMITTED even for a different oncologist than the creator."
        test_recipe:
          setup: ["course SIMULATED; contour set in DRAFT (never submitted)"]
          setup_api_calls:
            - { call: "POST /oncology/patients", payload: { mrn: "MRN-S4", full_name: "State Four", date_of_birth: "1970-01-01" }, as: Scheduler, captures: { pat: $.data.id } }
            - { call: "POST /oncology/patients/${pat}/treatment-courses", payload: { diagnosis_code: "C61", intent: "CURATIVE", technique: "IMRT", prescribed_total_dose_cGy: 2000, planned_fractions: 10 }, as: RadiationOncologist, as_user_id: "onc_a", captures: { crs: $.data.id } }
            - { call: "POST /oncology/machines", payload: { name: "CT-Sim-S4", machine_type: "CT_SIMULATOR", room: "SIM1" }, as: SystemAdmin, captures: { sim_m: $.data.id } }
            - { call: "POST /oncology/treatment-courses/${crs}/simulation-appointments", payload: { machine_id: "${sim_m}", start_time: "2026-07-30T09:00:00Z", end_time: "2026-07-30T09:30:00Z", immobilization_device: "THERMOPLASTIC_MASK" }, as: Scheduler, captures: { sim_a: $.data.id } }
            - { call: "POST /oncology/simulation-appointments/${sim_a}/complete", payload: { patient_weight_kg: 80.0 }, as: RadiationTherapist, as_user_id: "rtt_a" }
            - { call: "POST /oncology/treatment-courses/${crs}/contour-sets", payload: { set_label: "CT1", target_volumes: ["PTV"], oar_structures: [] }, as: RadiationOncologist, as_user_id: "onc_a", captures: { cs: $.data.id } }
          trigger:
            - { call: "POST /oncology/contour-sets/${cs}/approve", payload: {}, as: RadiationOncologist, as_user_id: "onc_b", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CONTOUR_NOT_SUBMITTED"
            - "ContourSet.${cs}.status remains DRAFT"

      - name: physics_second_check_before_primary_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.TreatmentPlan.PENDING_PRIMARY_CHECK_to_PENDING_SECOND_CHECK, "validations[priority=6]"]
