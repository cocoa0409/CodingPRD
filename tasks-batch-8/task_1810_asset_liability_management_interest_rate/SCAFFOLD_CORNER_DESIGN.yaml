        test_recipe:
          setup: ["Book1 ACTIVE; two PROPOSED hedges on L1 (non-overlapping notional irrelevant since only one will designate)"]
          setup_api_calls:
            - { call: "POST /books", payload: { name: "Book A", base_curve_rate_bps: 400, min_hedged_notional_cents: 0 }, as: TreasuryAnalyst, captures: { b: $.data.id } }
