            - { call: "POST /api/parts", payload: { part_number: "P-A-115", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 2 }, as: ProjectManager, captures: { line_a: $.data.id } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
