          - errors[ERR_NOMINEE_STATE_INVALID]
          - validations.priority_40
        distinguishing_aspect: |
          The void trigger is not idempotent: replaying it on a VOIDED row returns 409
          ERR_NOMINEE_STATE_INVALID, and the slate aggregates are not decremented a second time.
        test_recipe:
          setup:
