# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 2378
# Broadband Consumer Label & Service Quality Complaints
# 9 rule_ids / 21 instances. Every numeric assert below was produced by executing
# the pinned §1.3 formulas; none is an estimate.
#
# Reference fixture (used by most chains), all literals pre-computed:
#   ServicePlan FIBER300 — monthly 7999, intro 4999 for 6 months, ETF 12000
#     PRORATED_MONTHLY, advertised 300/140 Mbps, required_locales ["en-US"],
#     discount_program_eligible true, allowance 1200 GB @ 1000 cents/GB overage.
#   FeeLineItems — EQUIP_RENTAL FIXED 1500 ALWAYS; NETWORK_ACCESS FIXED 700
#     POST_PROMO_ONLY; REG_RECOVERY 3.25% ALWAYS; STATE_USF 2.11% ALWAYS
#     (GOVERNMENT_TAX); INSTALL ONE_TIME 9900.
#   => INTRO   : 4999 + 1500 + 162 + 105 = 6766 gross, benefit 3000, net 3766
#      POST    : 7999 + 1500 + 700 + 260 + 169 = 10628 gross, benefit 3000, net 7628
#      first-year PROMO_WEIGHTED 78264, POST_PROMO_ANNUALIZED 101436
#   MethodologyDocument MTH-2026-A — peak hours [19,23), min_samples 4, max 7 days.
#   TestRun A — 6 samples, 4 of them peak-hour.
#     => PEAK_HOUR_MEDIAN 240.00 / 115.00 / 42 ms, margins 0.8000 / 0.8214
#        ALL_HOUR_P20     238.00 / 112.00 / 55 ms, margins 0.7933 / 0.8000
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: first_year_disclosure_variants_diverge_on_same_label
        grounds:
          - calculations.first_year_total_disclosure
          - entities.LabelVersion.fields.first_year_total_promo_weighted_cents
          - entities.LabelVersion.fields.first_year_total_post_promo_cents
          - entities.LabelVersion.fields.net_monthly_intro_cents
        distinguishing_aspect: |
          This dual-variant calculation lives in the LabelVersion pricing domain: PROMO_WEIGHTED and
          POST_PROMO_ANNUALIZED read the identical fee itemization of one label row and disclose
          78264 versus 101436 cents — a 23172-cent divergence produced purely by how the twelve
          months are weighted between the introductory and post-promotional net charges.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan FIBER300 with intro 4999 for 6 months, post-promotional 7999, discount_program_eligible true."
            - "Five FeeLineItems: two fixed monthly lines, two percentage lines, one one-time install line."
            - "One DRAFT LabelVersion for the plan (no attestation and no publication needed — both variants are computed at draft time)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "NETWORK_ACCESS", description: "Network access surcharge", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 700, applies_during: "POST_PROMO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "INSTALL", description: "Professional installation", label_category: "ONE_TIME", basis: "FIXED", amount_cents: 9900, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v1: $.data.version }
          trigger:
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv1_id: $.data.id }
          assert:
            - "LabelVersion.${lv1_id}.one_time_fee_total_cents == 9900"
            - "LabelVersion.${lv1_id}.net_monthly_intro_cents == 3766"
            - "LabelVersion.${lv1_id}.net_monthly_post_promo_cents == 7628"
            - "LabelVersion.${lv1_id}.first_year_total_promo_weighted_cents == 78264"
            - "LabelVersion.${lv1_id}.first_year_total_post_promo_cents == 101436"
            - "LabelVersion.${lv1_id}.first_year_total_post_promo_cents - LabelVersion.${lv1_id}.first_year_total_promo_weighted_cents == 23172"

      - name: typical_speed_variants_diverge_on_identical_run_pool
        grounds:
          - calculations.typical_speed_metrics
          - entities.PerformanceAttestation.fields.metric_variant
          - entities.PerformanceAttestation.fields.pooled_sample_count
          - entities.PerformanceAttestation.fields.download_margin_pct
        distinguishing_aspect: |
          The second dual-variant calculation lives in a different entity domain — network measurement
          on PerformanceAttestation, not pricing on LabelVersion: PEAK_HOUR_MEDIAN pools only the 4
          peak-hour samples and reports 240.00 Mbps / 42 ms while ALL_HOUR_P20 pools all 6 and reports
          238.00 Mbps / 55 ms from the very same TestRun.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan FIBER300 advertised 300/140 Mbps."
            - "PUBLISHED MethodologyDocument MTH-2026-A with peak hours [19,23), min_samples_required 4."
            - "One INCLUDED TestRun with 6 samples: 4 inside the peak window (210/238/242/290 Mbps down) and 2 outside it (295/306 Mbps down)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkEngineer
            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }
            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
            - call: "POST /methodology-documents/${doc_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-1", market_code: "US-TX-AUS", panel_size: 75, max_concurrent_windows: 2 }
              as: NetworkEngineer
              captures: { probe_id: $.data.id }
            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:10:00Z", download_mbps: 210, upload_mbps: 100, latency_ms: 42}, {observed_at: "2026-08-04T21:30:00Z", download_mbps: 238, upload_mbps: 112, latency_ms: 24}, {observed_at: "2026-08-05T20:40:00Z", download_mbps: 242, upload_mbps: 118, latency_ms: 22}, {observed_at: "2026-08-08T19:45:00Z", download_mbps: 290, upload_mbps: 130, latency_ms: 18}, {observed_at: "2026-08-05T14:30:00Z", download_mbps: 295, upload_mbps: 145, latency_ms: 14}, {observed_at: "2026-08-06T02:40:00Z", download_mbps: 306, upload_mbps: 155, latency_ms: 55} ] }
              as: NetworkEngineer
              captures: { run_a_id: $.data.id }
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: NetworkEngineer
              captures: { plan_v1: $.data.version }
            - call: "POST /performance-attestations"
              payload: { plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", metric_variant: "PEAK_HOUR_MEDIAN", expected_plan_version: "${plan_v1}" }
              as: NetworkEngineer
              captures: { att_peak_id: $.data.id }
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: NetworkEngineer
              captures: { plan_v2: $.data.version }
          trigger:
            - call: "POST /performance-attestations"
              payload: { plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", metric_variant: "ALL_HOUR_P20", expected_plan_version: "${plan_v2}" }
              as: NetworkEngineer
              captures: { att_p20_id: $.data.id }
          assert:
            - "PerformanceAttestation.${att_peak_id}.pooled_sample_count == 4"
            - "PerformanceAttestation.${att_peak_id}.typical_download_mbps == 240.00"
            - "PerformanceAttestation.${att_peak_id}.typical_upload_mbps == 115.00"
            - "PerformanceAttestation.${att_peak_id}.typical_latency_ms == 42"
            - "PerformanceAttestation.${att_peak_id}.download_margin_pct == 0.8000"
            - "PerformanceAttestation.${att_p20_id}.pooled_sample_count == 6"
            - "PerformanceAttestation.${att_p20_id}.typical_download_mbps == 238.00"
            - "PerformanceAttestation.${att_p20_id}.typical_upload_mbps == 112.00"
            - "PerformanceAttestation.${att_p20_id}.typical_latency_ms == 55"
            - "PerformanceAttestation.${att_p20_id}.download_margin_pct == 0.7933"
            - "PerformanceAttestation.${att_peak_id}.included_run_ids == [${run_a_id}] and PerformanceAttestation.${att_p20_id}.included_run_ids == [${run_a_id}]"
            - "PerformanceAttestation.${att_peak_id}.status == DRAFT (creating the ALL_HOUR_P20 attestation does not supersede a DRAFT sibling)"

  - rule_id: combinatorial_formula
    instances:

      - name: percentage_fee_rounding_order_pinned_round_then_sum
        grounds:
          - calculations.label_monthly_itemization
          - entities.LabelVersion.fields.fee_itemization
          - entities.LabelVersion.fields.monthly_total_intro_cents
          - entities.FeeLineItem.fields.rate_pct
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents: the two percentage lines on the
          4999-cent introductory base are 162.4675 and 105.4789 exact cents, so rounding each line first
          and then summing yields 6766 while summing the exact fractions and rounding once yields 6767;
          the scaffold pins round-then-sum, so 6766 is the only correct answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan FIBER300 with introductory base 4999 cents."
            - "Two percentage fee lines whose exact amounts both have fractional parts below 0.5 (0.4675 and 0.4789) that together exceed 0.5."
            - "One DRAFT LabelVersion for the plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v1: $.data.version }
          trigger:
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv1_id: $.data.id }
          assert:
            - "LabelVersion.${lv1_id}.fee_itemization contains {fee_code: REG_RECOVERY, phase: INTRO, amount_cents: 162}"
            - "LabelVersion.${lv1_id}.fee_itemization contains {fee_code: STATE_USF, phase: INTRO, amount_cents: 105}"
            - "LabelVersion.${lv1_id}.monthly_total_intro_cents == 6766"
            - "LabelVersion.${lv1_id}.monthly_total_intro_cents != 6767 (6767 is the forbidden sum-then-round result)"
            - "LabelVersion.${lv1_id}.fee_itemization contains {fee_code: REG_RECOVERY, phase: POST_PROMO, amount_cents: 260}"
            - "LabelVersion.${lv1_id}.fee_itemization contains {fee_code: STATE_USF, phase: POST_PROMO, amount_cents: 169}"
            - "LabelVersion.${lv1_id}.monthly_total_post_promo_cents == 10428 is WRONG; the correct value is 10628"

      - name: discount_benefit_evaluation_order_after_percentage_fees
        grounds:
          - calculations.discount_program_benefit
          - calculations.label_monthly_itemization
          - entities.LabelVersion.fields.discount_program_benefit_intro_cents
          - entities.LabelVersion.fields.net_monthly_intro_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order the scaffold pins: the benefit
          is capped by the gross monthly total, yet the gross total contains percentage fees computed on
          the gross base, so computing the benefit first (net base 3499 → percentage lines 114 and 74 →
          net 3687) is a different number from the pinned order (gross 6766 → benefit 3000 → net 3766).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan FIBER300, discount_program_eligible true, introductory base 4999 cents."
            - "One fixed 1500-cent monthly line plus the 3.25% and 2.11% percentage lines."
            - "A second cheap plan LOWCOST9 whose gross intro total 1500 is below the 3000-cent benefit cap, used to pin the min() clamp."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans"
              payload: { plan_code: "LOWCOST9", display_name: "Lifeline 9", technology: "DSL", advertised_download_mbps: 25, advertised_upload_mbps: 3, monthly_price_cents: 1000, early_termination_fee_cents: 0, required_locales: ["en-US"], intro_price_cents: 1000, intro_term_months: 3, etf_proration_policy: "NONE", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan2_id: $.data.id }
            - call: "POST /service-plans/${plan2_id}/fee-line-items"
              payload: { fee_code: "LINE_FEE", description: "Copper line fee", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "GET /service-plans/${plan_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan_v1: $.data.version }
            - call: "GET /service-plans/${plan2_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { plan2_v1: $.data.version }
          trigger:
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv1_id: $.data.id }
            - call: "POST /label-versions"
              payload: { plan_id: "${plan2_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${plan2_v1}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lv2_id: $.data.id }
          assert:
            - "LabelVersion.${lv1_id}.monthly_total_intro_cents == 6766"
            - "LabelVersion.${lv1_id}.discount_program_benefit_intro_cents == 3000"
            - "LabelVersion.${lv1_id}.net_monthly_intro_cents == 3766"
            - "LabelVersion.${lv1_id}.net_monthly_intro_cents != 3687 (3687 is the forbidden benefit-before-percentage order)"
            - "LabelVersion.${lv1_id}.discount_program_benefit_post_promo_cents == 3000 and LabelVersion.${lv1_id}.net_monthly_post_promo_cents == 7628"
            - "LabelVersion.${lv2_id}.monthly_total_intro_cents == 1500"
            - "LabelVersion.${lv2_id}.discount_program_benefit_intro_cents == 1500"
            - "LabelVersion.${lv2_id}.net_monthly_intro_cents == 0"

  - rule_id: non_linear_state_machine
    instances:

      - name: complaint_info_request_cycle_and_reopen_bound
        grounds:
          - state_machines.Complaint
          - complexity_profile.state_machine_shape
          - validations.priority_80
          - entities.Complaint.fields.investigation_cycles
        distinguishing_aspect: |
          Non-linearity of the *cyclic* kind on a single dimension: the Complaint machine has two
          distinct loops — UNDER_INVESTIGATION -> INFO_REQUESTED -> UNDER_INVESTIGATION, which bumps
          investigation_cycles without bound, and DISMISSED -> UNDER_INVESTIGATION, which is bounded
          by MAX_REOPENS so that the third reopen is refused while the state stays DISMISSED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the scaffold default 2026-08-01T00:00:00Z is repositioned first)."
            - "ServicePlan FIBER300 (advertised 300/140, intro 4999 for 6 months, post-promotional 7999, ETF 12000 PRORATED_MONTHLY, required_locales [en-US])."
            - "Five FeeLineItems: EQUIP_RENTAL 1500 ALWAYS, NETWORK_ACCESS 700 POST_PROMO_ONLY, REG_RECOVERY 3.25% ALWAYS, STATE_USF 2.11% ALWAYS, INSTALL 9900 ONE_TIME."
            - "PUBLISHED MethodologyDocument MTH-2026-A (peak [19,23), min_samples_required 4, max_run_duration_days 7) and MeasurementProbe PRB-1 (max_concurrent_windows 2)."
            - "One INCLUDED TestRun A with 6 samples, 4 of them peak-hour; ServicePlan.evidence_sample_total == 6."
            - "One CERTIFIED PEAK_HOUR_MEDIAN PerformanceAttestation: typical 240.00 / 115.00 / 42 ms, margins 0.8000 / 0.8214."
            - "One PUBLISHED, SUBSTANTIATED LabelVersion (version_seq 1, effective_from 2026-09-01, effective_until null, WCAG_AA, VERIFIED en-US translation, net intro 3766, net post-promotional 7628); ServicePlan.label_posture == OPEN."

            - "SubscriberAccount ACC-1 on the plan, service_start_date 2026-09-01, preferred_locale en-US, discount_program_enrolled true; pricing_phase == INTRO, so every credit base is net_monthly_intro_cents == 3766."

            - "One Complaint on ACC-1 against the published label: SPEED_SHORTFALL, measured_download_mbps 120, affected_days 15, already TRIAGED and then moved to UNDER_INVESTIGATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "NETWORK_ACCESS", description: "Network access surcharge", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 700, applies_during: "POST_PROMO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
