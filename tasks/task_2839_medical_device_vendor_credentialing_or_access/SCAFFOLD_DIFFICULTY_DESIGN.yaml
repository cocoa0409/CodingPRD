  - rule_id: boundary_precision_check
    instances:

      - name: credential_expiry_equality_expires_one_second_later_only_warns
        grounds:
          - state_machines.Credential.VERIFIED_to_EXPIRED
          - state_machines.Credential.VERIFIED_to_EXPIRING_SOON
          - calculations.rep_credential_posture
          - entities.ComplianceSweep.fields.credentials_expired_count
          - entities.ComplianceSweep.fields.credentials_warned_count
          - global_constants.EXPIRY_WARNING_DAYS
        distinguishing_aspect: |
          Datetime equality boundary at one-second resolution on POST /vendor-access/compliance-sweeps:
          expires_at_utc == swept_at_utc EXPIRES (the <= comparison is inclusive) while
          expires_at_utc == swept_at_utc + 1 second only WARNS. The two credentials belong to the same
          rep and the same sweep, so an off-by-one comparison flips both counters and the resulting
          posture at once.
