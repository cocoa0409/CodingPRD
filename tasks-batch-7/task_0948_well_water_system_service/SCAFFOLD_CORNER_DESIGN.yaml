      - name: corner_occ_invoice_payments_advance_the_version_on_every_write
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payment-record-stale-invoice]", "state_machines.Invoice.ISSUED_to_PARTIALLY_PAID", "state_machines.Invoice.PARTIALLY_PAID_to_PAID_IN_FULL", "entities.Invoice.fields.version", "state_machines.WorkOrder.INVOICED_to_SETTLED"]
        distinguishing_aspect: |
          Each accepted payment advances Invoice.version by exactly 1, so the version
          observed on the first payment's response is the ONLY value the second payment
          can quote. Paying 20000 of a 49160-cent invoice yields PARTIALLY_PAID with
          version issue_version + 1; paying the remaining 29160 with that version yields
          PAID_IN_FULL at issue_version + 2, drives the work order's billing axis
          INVOICED -> SETTLED and returns the account balance to 0. An implementation
          that leaves the version unchanged on payment makes the second call's version
          indistinguishable from the first's.
        test_recipe:
          setup:
            - "One NONE-tier account, property 10.0 miles out with household 3, well, JOURNEYMAN technician and one CONTROL part costing 5000 cents with 10 on hand."
            - "One PRE_AUTHORIZED emergency work order of scope REPAIR consuming 2 units, completed 2026-06-01T12:00:00Z reporting 60 minutes, whose DRAFT invoice totals 49160 cents and is then ISSUED."
