  - rule_id: resource_temporal_overlap
    instances:
      - name: fitter_chair_closed_interval_with_fifteen_minute_changeover_buffer_rejected
        grounds:
          - validations[priority=52]
          - errors[ERR_FITTING_SLOT_CONFLICT]
          - entities.FittingRecord.fields.fitting_start_at
          - entities.FittingRecord.fields.fitting_end_at
          - entities.Fitter.fields.fitting_minutes_booked
          - endpoints[POST /dme/encounters/{id}/fitting-records]
        distinguishing_aspect: |
          Interval semantics #1: the contended resource is a Fitter's chair time
          and its interval is CLOSED and padded by a 15-minute changeover buffer
          on each side, so a gap of exactly 15 minutes still conflicts and only
          a gap strictly greater than 15 minutes is free. The rule's other
          instance contends a Patient's reasonable-useful-lifetime entitlement,
          whose interval is HALF-OPEN and measured in whole calendar months, and
          it is enforced on a different endpoint. Scoping is also proven here:
          the buffer is per Fitter, so a second fitter may take the very slot
          that was refused to the first.
        test_recipe:
          setup:
            - "one accredited clinic licensed for SPINE with an off-shelf LSO shelf holding 10 units (par_min 4)"
            - "two fitters at that clinic and three documented encounters, each reserved for 1 unit"
            - "fitter A already holds a fitting from 10:00 to 10:30 on the clock date for the first encounter"
