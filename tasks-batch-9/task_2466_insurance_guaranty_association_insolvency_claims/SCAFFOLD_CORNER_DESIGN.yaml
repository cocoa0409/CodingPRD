            - "GET /policies with source_transfer_id == ${tr_id} returns exactly 1 row, policy_number PA-3001, in IMPORTED"
            - "GET /claims with source_transfer_id == ${tr_id} returns 0 rows"
            - "Insolvency.${ins_id}.policy_count == 1"

