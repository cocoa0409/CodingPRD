              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { sh01_id: $.data.id }
            - call: "POST /vessel-jobs/${job_id}/parts"
              payload: { heat_id: "${heat_id}", part_mark: "HD-01", component_type: "HEAD", issued_quantity_lb: 500.00 }
