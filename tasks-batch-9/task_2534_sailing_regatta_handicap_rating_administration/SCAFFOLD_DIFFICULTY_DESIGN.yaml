      - name: entry_inspection_dimension_cycles_without_touching_registration
        grounds:
          - state_machines.Entry.inspection_status.PASSED_to_FAILED
          - state_machines.Entry.inspection_status.FAILED_to_PASSED
          - state_machines.Entry.registration_status.SUBMITTED_to_ACCEPTED
          - entities.Entry.fields.equipment_deficiency_code
          - validations.priority_19
        distinguishing_aspect: |
          Entry is a third entity and its non-linearity is parallel rather than looping-in-place: the
          inspection dimension cycles PASSED -> FAILED -> PASSED -> FAILED twice over while the
          registration dimension of the very same row stays ACCEPTED and the division counts never move,
          so a fresh inspection failure is NOT an implicit withdrawal. The one edge that does read across
          the dimensions is SUBMITTED -> ACCEPTED, and the second entry proves it: with inspection_status
          FAILED the accept is refused 422 ERR_EQUIPMENT_INSPECTION_NOT_PASSED, so the same FAILED label
          is harmless on one row and blocking on another depending on the other dimension's position.
        test_recipe:
          setup:
            - "Five club members: a licensed measurer, a regatta chair, a race officer and two helms with valid safety courses."
            - "Two ISSUED TOD_PHRF certificates: A 171.3 and B 218.8."
            - "A regatta with NOR and SI published (status SI_PUBLISHED) and division A (MONOHULL, band 150.0 .. 230.0, min_entries 2) CONFIRMED with two assigned entries."
            - "Entry A passed inspection and is ACCEPTED; entry B failed inspection with deficiency code LIFERAFT_OVERDUE and is still SUBMITTED, so the division holds assigned_entry_count 2 and accepted_entry_count 1."
