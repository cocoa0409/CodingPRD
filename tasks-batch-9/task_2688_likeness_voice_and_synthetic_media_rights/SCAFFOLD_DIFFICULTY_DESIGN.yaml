            - "GET /compensation-entries?consent_grant_id=${g_id} contains no entry with amount_cents 8230 — the surcharge never enters the ledger"
            - "ConsentGrant.${g_id}.total_compensation_cents == 1116750 (surcharge excluded)"

  - rule_id: non_linear_state_machine
    instances:
      - name: performance_revision_cycle_terminates_at_round_cap
        grounds:
          - state_machines.GeneratedPerformance.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.GeneratedPerformance.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.GeneratedPerformance.SUBMITTED_to_REJECTED
          - entities.GeneratedPerformance.fields.revision_round
          - validations[priority=84]
        distinguishing_aspect: >-
          The performance loops SUBMITTED -> REVISION_REQUESTED -> SUBMITTED three times,
          incrementing revision_round on each resubmission, and the fourth REQUEST_REVISION does
          not re-enter the loop: at revision_round == 3 the same trigger produces REJECTED with
          rejection_reason REVISION_LIMIT_REACHED, so identical input yields a different target
          state purely because of accumulated loop count.
        test_recipe:
          setup:
            - "CA law profile and the 2026-07-01 SAG_AFTRA/ADVERTISING union row exist"
            - "Living CA/SAG talent with an ACTIVE grant, per-use base 150000, territories US and MX"
            - "One APPROVED_FOR_USE voice replica and one SUBMITTED performance projecting 6000000 impressions"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 365, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /union-minimum-schedules"
