          - entities.WritersRoom.fields.facility_surcharge_weekly_cents
          - entities.WritersRoom.fields.weekly_burn_cents
        distinguishing_aspect: |
          Combinatorial mode (c) - an apparently self-referential four-step order of operations. The
          facility surcharge is part of the room's weekly cost, yet the tier that selects the surcharge
