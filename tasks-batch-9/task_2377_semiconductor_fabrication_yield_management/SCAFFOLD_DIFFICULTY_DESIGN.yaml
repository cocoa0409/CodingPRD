              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: false }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_etch}", step_seq: 20, step_name: "ETCH-1", standard_hours: 3.0, metrology_required: true, rework_target_step_id: "${s10}" }
              as: ProcessEngineer
