  # =========================================================================
  # Rule 7 — cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: weigh_ticket_capture_depends_on_scale_certification_state
        grounds:
          - validations[priority=18]
          - entities.Scale.fields.status
          - state_machines.WeighTicket.OPEN_to_CAPTURED
          - errors[ERR_SCALE_NOT_CERTIFIED]
        distinguishing_aspect: |
          ENTITY PAIR WeighTicket -> Scale. Whether a WeighTicket may leave OPEN depends on
          a field of a completely different row: Scale.status, itself derived from the
          logical clock against the certification window. Capturing on the expiry date
          itself succeeds (inclusive) and capturing one day later fails.
        test_recipe:
          setup:
            - "Clock 2026-05-31T08:00:00Z; sale day dated 2026-05-31 in CHECK_IN_OPEN."
            - "Scale SC-1 certified 2026-01-01 through 2026-05-31 inclusive."
            - "One consignment of 10 head with one lot; ticket 1 (7200/200) is captured on 2026-05-31 and ticket 2 (7100/200) is opened the same day."
            - "The clock is then moved to 2026-06-01T08:00:00Z, one day past the certification window."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
              payload: { legal_name: "Rocking R Ranch", party_type: "FARM", origin_state_code: "NE", origin_county: "Lincoln", tax_id: "47-1111111" }
              as: BarnAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days"
              payload: { sale_date: "2026-05-31", barn_code: "BARN-1", barn_state_code: "NE" }
              as: BarnAdmin
              captures: { sale_day_id: "$.data.id" }
            - call: "POST /sale-barn/scales"
              payload: { scale_code: "SC-1", certified_from: "2026-01-01", certification_expires_on: "2026-05-31", max_draft_lb: 60000 }
              as: BarnAdmin
              captures: { scale_id: "$.data.id" }
            - call: "POST /sale-barn/sale-days/${sale_day_id}/advance"
              payload: { to_status: "CHECK_IN_OPEN" }
              as: BarnAdmin
            - call: "POST /sale-barn/consignments"
              payload: { sale_day_id: "${sale_day_id}", consignor_party_id: "${consignor_id}", species_class: "CATTLE", head_received: 10, weigh_basis: "PENCIL_SHRINK", pencil_shrink_pct: 0.03 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /sale-barn/consignments/${cons_id}/check-in"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/lots"
              payload: { consignment_id: "${cons_id}", head_count: 10, livestock_class: "FEEDER_STEER", bid_basis: "PER_CWT", opening_bid: 150.00, reserve_price: 170.00 }
              as: YardOperator
              captures: { lot_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7200, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt1_id: "$.data.id" }
            - call: "POST /sale-barn/weigh-tickets/${wt1_id}/capture"
              payload: {}
              as: YardOperator
            - call: "POST /sale-barn/weigh-tickets"
              payload: { lot_id: "${lot_id}", scale_id: "${scale_id}", head_on_draft: 10, gross_weight_lb: 7100, tare_weight_lb: 200 }
              as: YardOperator
              captures: { wt2_id: "$.data.id" }
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
          trigger:
            - call: "POST /sale-barn/weigh-tickets/${wt2_id}/capture"
              payload: {}
              as: YardOperator
              captures: { err_scale: "$.data.error_id" }
          assert:
            - "WeighTicket.${wt1_id}.status == CAPTURED (captured on the expiry date itself, which is inclusive)"
            - "The trigger call returns HTTP 409 with error_id == ERR_SCALE_NOT_CERTIFIED"
            - "Scale.${scale_id}.status == EXPIRED"
            - "WeighTicket.${wt2_id}.status == OPEN"
            - "WeighTicket.${wt2_id}.captured_at is null"
            - "Lot.${lot_id}.settle_weight_lb == 6790"

      - name: pen_move_creation_depends_on_drover_crew_duty_state
        grounds:
          - validations[priority=25]
          - entities.DroverCrew.fields.duty_status
          - state_machines.DroverCrew.OFF_DUTY_to_ON_DUTY
          - errors[ERR_CREW_OFF_DUTY]
        distinguishing_aspect: |
          A DIFFERENT entity pair, PenMove -> DroverCrew. Whether a PenMove row may be
          created at all depends on DroverCrew.duty_status on another row: the identical
          request is refused with ERR_CREW_OFF_DUTY while the crew is OFF_DUTY and accepted
          once the crew is clocked ON_DUTY, with nothing else about the request changed.
        test_recipe:
          setup:
            - "Clock 2026-06-01T08:00:00Z; sale day BARN-1/NE in CHECK_IN_OPEN; pens P-01 and P-02, 60 head each."
            - "One consignment of 10 head with one lot standing in P-01."
            - "Crew CREW-A exists and is still OFF_DUTY."
          setup_api_calls:
            - call: "POST /sale-barn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: BarnAdmin
            - call: "POST /sale-barn/parties"
