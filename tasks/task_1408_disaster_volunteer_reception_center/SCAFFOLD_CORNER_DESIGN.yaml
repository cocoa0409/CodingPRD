# =============================================================================
# Section 1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over SCAFFOLD.yaml §1.1-§1.7 per references/claim-extraction-guide.md.
# Sections: entities, state_machines, calculations, validations, endpoints,
# errors, rbac, cross_cutting_layers, consistency_model.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_incident_applies_computed_defaults
        claim_type: creation
        grounds: [entities.Incident, state_machines.Incident]
        distinguishing_aspect: "A freshly created incident starts in ACTIVATION with posture OPEN, all cost-share fields 0, version 1, and a server-minted UUID id."
        test_recipe:
          setup: ["empty DB; clock at startup default"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
          trigger:
            - { call: "POST /vrc/incidents", payload: { name: "Flood Tau", ppe_stock: { GLOVES: 4, MASK: 4, HARD_HAT: 2, VEST: 2, GOGGLES: 2 } }, as: VRCManager, captures: { inc: $.data.id, life: $.data.lifecycle_status, post: $.data.operational_posture, ver: $.data.version, prov: $.data.provisional_cost_share_cents } }
          assert:
            - "life == ACTIVATION and post == OPEN"
            - "prov == 0 and version == 1"
            - "inc is a server-minted UUID (no type prefix)"

      - name: create_volunteer_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Volunteer.fields.phone", "validations[priority=4]"]
        distinguishing_aspect: "Omitting required field phone is rejected with ERR_INVALID_REQUEST (400); no record is created."
        test_recipe:
          setup: ["incident ACTIVE"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Upsilon", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
          trigger:
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "No Phone", email: "np@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: create_credential_with_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.SkillCredential.fields.skill_code", "validations[priority=4]"]
        distinguishing_aspect: "skill_code 'DRIVING' is not one of the six declared enum members and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["incident ACTIVE; volunteer REGISTERED"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Fire Phi", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Enum Test", phone: "555-1", email: "et@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, captures: { vol: $.data.id } }
          trigger:
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "DRIVING", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: get_nonexistent_volunteer_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
          trigger:
            - { call: "GET /vrc/volunteers/11111111-2222-3333-4444-555555555555", payload: {}, as: VRCManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RESOURCE_NOT_FOUND with HTTP 404"

      - name: system_and_computed_field_input_rejected
        claim_type: system_fields
        grounds: [entities.Volunteer.fields.status, entities.Volunteer.fields.committed_hours]
        distinguishing_aspect: "Client-supplied status/committed_hours/version on create are unknown payload fields and rejected with ERR_INVALID_REQUEST — lifecycle and ledger fields are server-owned."
        test_recipe:
          setup: ["incident ACTIVE"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Fire Chi", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
          trigger:
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Sneaky Sam", phone: "555-2", email: "ss@x.com", home_locality: "Riverton", status: "READY", committed_hours: 99.0 }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: volunteer_list_paginates_with_default_limit_and_offset
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /vrc/incidents/{id}/volunteers]"]
        distinguishing_aspect: "With 12 volunteers registered, the default page returns 10 items with total_count 12 and has_more true; offset 10 returns the remaining 2; status=REGISTERED filter returns all 12 across pages."
        test_recipe:
          setup: ["incident ACTIVE; 12 volunteers registered"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood Psi", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V01 A", phone: "555-01", email: "v01@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V02 A", phone: "555-02", email: "v02@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V03 A", phone: "555-03", email: "v03@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V04 A", phone: "555-04", email: "v04@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V05 A", phone: "555-05", email: "v05@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V06 A", phone: "555-06", email: "v06@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V07 A", phone: "555-07", email: "v07@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V08 A", phone: "555-08", email: "v08@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V09 A", phone: "555-09", email: "v09@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V10 A", phone: "555-10", email: "v10@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V11 A", phone: "555-11", email: "v11@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "V12 A", phone: "555-12", email: "v12@x.com", home_locality: "Riverton" }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /vrc/incidents/${inc}/volunteers", payload: {}, as: VRCManager }
            - { call: "GET /vrc/incidents/${inc}/volunteers", payload: { limit: 10, offset: 10 }, as: VRCManager }
          assert:
            - "first page: 10 items (default limit 10), total_count == 12, has_more == true"
            - "second page: 2 items, has_more == false"

      - name: created_at_stamps_use_logical_clock_not_wall_clock
        claim_type: system_fields
        grounds: ["entities.Volunteer.fields", "endpoints[POST /vrc/_clock/set_current_utc]"]
        distinguishing_aspect: "A volunteer created before any clock call is stamped with the fixed startup default 2026-08-01T00:00:00Z; after setting the clock to 2026-08-05T10:30:00Z the next volunteer's created_at equals that instant — never wall-clock time."
        test_recipe:
          setup: ["incident created (before any clock set) then clock moved"]
          setup_api_calls:
            - { call: "POST /vrc/incidents", payload: { name: "Quake Omega", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id, inc_created: $.data.created_at } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Early Ed", phone: "555-20", email: "ee@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, captures: { v1_created: $.data.created_at } }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:30:00Z" }, as: VRCManager }
          trigger:
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Late Liz", phone: "555-21", email: "ll@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, captures: { v2_created: $.data.created_at } }
          assert:
            - "v1_created == 2026-08-01T00:00:00Z (startup default, ISO 8601 UTC)"
            - "v2_created == 2026-08-05T10:30:00.000Z (logical clock after set, three fractional digits)"

  - section: state_machines
    instances:
      - name: accept_declined_assignment_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.DeploymentAssignment.PROPOSED_to_DECLINED, state_machines.DeploymentAssignment.PROPOSED_to_ACCEPTED]
        distinguishing_aspect: "DECLINED is terminal: accept on a DECLINED assignment is rejected with ERR_INVALID_STATE and no status change occurs."
        test_recipe:
          setup: ["incident ACTIVE; READY volunteer; request + shift OPEN_FOR_ROSTER; assignment PROPOSED then DECLINED by the volunteer"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood A2", ppe_stock: { GLOVES: 3, MASK: 3, HARD_HAT: 3, VEST: 3, GOGGLES: 3 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Tom Tran", phone: "555-30", email: "tt@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "North Depot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "North Depot", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 2 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /vrc/assignments/${asg}/decline", payload: {}, as: Volunteer, as_user_id: "${vol}", captures: { st_dec: $.data.status } }
          trigger:
            - { call: "POST /vrc/assignments/${asg}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}", captures: { err: $.data.error_id } }
          assert:
            - "st_dec == DECLINED"
            - "err == ERR_INVALID_STATE (terminal DECLINED accepts no further transitions)"

      - name: cancel_completed_assignment_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeploymentAssignment.CHECKED_IN_to_COMPLETED]
        distinguishing_aspect: "COMPLETED is terminal for writes: cancel on a COMPLETED assignment returns ERR_INVALID_STATE and committed-hours release does not double-fire."
        test_recipe:
          setup: ["incident ACTIVE; READY volunteer; assignment driven to COMPLETED via check-in/complete on 2026-08-10"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Flood B2", ppe_stock: { GLOVES: 3, MASK: 3, HARD_HAT: 3, VEST: 3, GOGGLES: 3 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Uma Ull", phone: "555-31", email: "uu@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, as_user_id: "intake-1", captures: { vol: $.data.id } }
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "GENERAL_LABOR", credential_class: "STANDARD", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { cred: $.data.id } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { bg: $.data.id } }
            - { call: "POST /vrc/background-checks/${bg}/clear", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/credentials/${cred}/verify", payload: {}, as: VettingOfficer, as_user_id: "vet-1" }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "LIABILITY_WAIVER" }, as: IntakeCoordinator }
            - { call: "POST /vrc/volunteers/${vol}/mark-ready", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "North Depot", required_skill: "GENERAL_LABOR", min_credential_class: "STANDARD", headcount_needed: 1, criticality: "STANDARD", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { req: $.data.id } }
            - { call: "POST /vrc/support-requests/${req}/publish", payload: {}, as: AgencyCoordinator }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "North Depot", hazard_level: "GREEN", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T16:00:00Z", capacity: 2 }, as: LogisticsCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /vrc/shifts/${sh}/open-roster", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /vrc/assignments", payload: { volunteer_id: "${vol}", support_request_id: "${req}", site_shift_id: "${sh}" }, as: IntakeCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /vrc/assignments/${asg}/accept", payload: {}, as: Volunteer, as_user_id: "${vol}" }
            - { call: "POST /vrc/assignments/${asg}/confirm", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/ppe-issuances", payload: { volunteer_id: "${vol}", item_type: "GLOVES", quantity: 1 }, as: LogisticsCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T12:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/clearances", payload: { volunteer_id: "${vol}", clearance_type: "SAFETY_BRIEFING" }, as: IntakeCoordinator }
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/assignments/${asg}/check-in", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
            - { call: "POST /vrc/assignments/${asg}/complete", payload: {}, as: SiteSupervisor, as_user_id: "site-1" }
          trigger:
            - { call: "POST /vrc/assignments/${asg}/cancel", payload: {}, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager, captures: { committed: $.data.committed_hours } }
          assert:
            - "err == ERR_INVALID_STATE (COMPLETED is terminal for cancel)"
            - "committed == 0.0 (completion release happened exactly once; the rejected cancel did not double-release)"

      - name: new_records_start_in_initial_states
        claim_type: initial_state
        grounds: [state_machines.Volunteer, state_machines.SkillCredential, state_machines.BackgroundCheck, state_machines.SupportRequest, state_machines.SiteShift, state_machines.RiskReport]
        distinguishing_aspect: "Creation pins initial states: Volunteer REGISTERED, SkillCredential CLAIMED, BackgroundCheck REQUESTED, SupportRequest DRAFT, SiteShift SCHEDULED, RiskReport FILED."
        test_recipe:
          setup: ["incident ACTIVE; one volunteer registered"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
            - { call: "POST /vrc/incidents", payload: { name: "Fire C2", ppe_stock: { GLOVES: 1, MASK: 1, HARD_HAT: 1, VEST: 1, GOGGLES: 1 } }, as: VRCManager, captures: { inc: $.data.id } }
            - { call: "POST /vrc/incidents/${inc}/activate", payload: {}, as: VRCManager }
            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Vic Voss", phone: "555-32", email: "vv@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, captures: { vol: $.data.id, st_vol: $.data.status } }
          trigger:
            - { call: "POST /vrc/credentials", payload: { volunteer_id: "${vol}", skill_code: "CDL", credential_class: "ADVANCED", expires_at: "2026-09-01T00:00:00Z" }, as: IntakeCoordinator, captures: { st_cred: $.data.status } }
            - { call: "POST /vrc/volunteers/${vol}/submit-for-vetting", payload: {}, as: IntakeCoordinator }
            - { call: "POST /vrc/background-checks", payload: { volunteer_id: "${vol}" }, as: VettingOfficer, captures: { st_bg: $.data.status } }
            - { call: "POST /vrc/support-requests", payload: { incident_id: "${inc}", requesting_agency: "County OES", site_name: "Yard", required_skill: "CDL", min_credential_class: "ADVANCED", headcount_needed: 1, criticality: "CRITICAL", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T20:00:00Z" }, as: AgencyCoordinator, captures: { st_req: $.data.status } }
            - { call: "POST /vrc/shifts", payload: { incident_id: "${inc}", site_name: "Yard", hazard_level: "AMBER", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T12:00:00Z", capacity: 2 }, as: LogisticsCoordinator, captures: { st_shift: $.data.status, dur: $.data.duration_hours } }
            - { call: "POST /vrc/risk-reports", payload: { subject_volunteer_id: "${vol}", severity: "LOW", category: "OTHER", description: "minor", occurred_at: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, as_user_id: "site-1", captures: { st_rep: $.data.status } }
          assert:
            - "st_vol == REGISTERED, st_cred == CLAIMED, st_bg == REQUESTED, st_req == DRAFT, st_shift == SCHEDULED, st_rep == FILED"
            - "dur == 4.0 (computed shift duration at creation)"

      - name: second_confirm_of_confirmed_assignment_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.DeploymentAssignment.ACCEPTED_to_CONFIRMED]
        distinguishing_aspect: "Confirm is not idempotent: the second confirm hits the ACCEPTED-only precondition and returns ERR_INVALID_STATE; committed_hours is debited exactly once."
        test_recipe:
          setup: ["incident ACTIVE; READY volunteer; assignment CONFIRMED on an 8h shift"]
          setup_api_calls:
            - { call: "POST /vrc/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VRCManager }
