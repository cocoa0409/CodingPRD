scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_ride_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Ride.fields.name, entities.Ride.fields.hourly_throughput, entities.Ride.fields.operational_status]
        distinguishing_aspect: "POST /parks/{id}/rides with name+hourly_throughput returns 201; operational_status defaults OPEN, min_height_cm 0, booked_slot_count 0."
        test_recipe:
          setup: ["A park exists"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
          trigger:
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "Coaster", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
          assert:
            - "Ride.${ride_id}.operational_status == OPEN"
            - "Ride.${ride_id}.min_height_cm == 0"
            - "Ride.${ride_id}.booked_slot_count == 0"

      - name: create_reservation_missing_required_queue_type_returns_validation
        claim_type: Required Fields
        grounds: [entities.Reservation.fields.queue_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /reservations omitting queue_type → ERR_VALIDATION (400); queue_type has source input and no default."
        test_recipe:
          setup: ["A park, ride, window, guest exist"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"

      - name: get_guest_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Guest, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /guests/{id} with a random non-existent UUID → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No guest with the queried id exists"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
          trigger:
            - call: "GET /guests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: system_fields_minted_on_park_create
        claim_type: System Fields
        grounds: [entities.Park.fields.admitted_count, entities.Park.fields.day_phase]
        distinguishing_aspect: "id/created_at/version are server-minted; admitted_count starts 0 and day_phase OPEN even if a client supplies values."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 50, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id, park_v: $.data.version }
          assert:
            - "Park.${park_id}.admitted_count == 0"
            - "Park.${park_id}.day_phase == OPEN"
            - "Park.${park_id}.version == 1"

      - name: zero_capacity_window_computed_to_zero
        claim_type: Computed Fields
        grounds: [entities.ReturnWindow.fields.slot_capacity, calculations.return_window_slot_capacity]
        distinguishing_aspect: "A 10-minute window on throughput 10 floors slot_capacity to 0 (variant zero_capacity_window); window is still created OPEN."
        test_recipe:
          setup: ["Ride throughput 10 exists"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R10", hourly_throughput: 10 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
          trigger:
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T10:10:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id }
          assert:
            - "ReturnWindow.${win_id}.slot_capacity == 0"
            - "ReturnWindow.${win_id}.window_status == OPEN"

      - name: type_constraint_invalid_tier_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.EntitlementPlan.fields.tier, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST entitlement-plans with tier not in {MULTI_PASS, SINGLE_PASS} → ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A park exists"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
          trigger:
            - call: "POST /parks/${park_id}/entitlement-plans"
              payload: { tier: "GOLD_PASS", price_cents: 1000, max_concurrent_holds: 2 }
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"

  # =================================================================
  - section: state_machines
    instances:
      - name: confirm_already_booked_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.HELD_to_BOOKED]
        distinguishing_aspect: "Confirming a reservation already in BOOKED → ERR_INVALID_STATE (409); no re-debit of counters."
        test_recipe:
          setup: ["A VIRTUAL_QUEUE reservation confirmed to BOOKED on an OPEN ride"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: redeem_from_terminal_redeemed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Reservation.BOOKED_to_REDEEMED]
        distinguishing_aspect: "A REDEEMED reservation is terminal; a second redeem → ERR_INVALID_STATE (409); counters not double-credited."
        test_recipe:
          setup: ["A reservation redeemed during its window (REDEEMED)"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T10:30:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
            - call: "POST /reservations/${res_id}/redeem"
              payload: {}
              as: RideOperator
          trigger:
            - call: "POST /reservations/${res_id}/redeem"
              payload: {}
              as: RideOperator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: declare_down_on_already_down_ride_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Ride.OPEN_to_DOWN]
        distinguishing_aspect: "declare-down requires Ride OPEN; a second declare-down on a DOWN ride → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A ride declared DOWN"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/declare-down"
              payload: {}
              as: RideOperator
          trigger:
            - call: "POST /rides/${ride_id}/declare-down"
              payload: {}
              as: RideOperator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: ride_down_refunds_active_lightning_lane_hold
        claim_type: Side Effect Execution
        grounds: [state_machines.LightningLanePurchase.ACTIVE_to_REFUNDED, state_machines.Ride.OPEN_to_DOWN]
        distinguishing_aspect: "Cross-entity compensation: declaring a ride DOWN flips its ACTIVE LightningLanePurchase holds to REFUNDED."
        test_recipe:
          setup: ["Ride R with an ACTIVE Lightning Lane hold for a guest (OPEN-phase flat price)"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /parks/${park_id}/entitlement-plans"
              payload: { tier: "MULTI_PASS", price_cents: 1500, max_concurrent_holds: 3, surge_multiplier: 2.0 }
              as: ParkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lightning-lane-purchases"
              payload: { park_id: "${park_id}", guest_id: "${g1_id}", ride_id: "${ride_id}", plan_id: "${plan_id}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { ll_id: $.data.id }
          trigger:
            - call: "POST /rides/${ride_id}/declare-down"
              payload: {}
              as: RideOperator
          assert:
            - "Ride.${ride_id}.operational_status == DOWN"
            - "LightningLanePurchase.${ll_id}.hold_status == REFUNDED"

      - name: redistribute_with_no_replacement_window_reports_unplaced
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.REDISTRIBUTED_to_BOOKED, "errors[ERR_NO_REPLACEMENT_WINDOW]"]
        distinguishing_aspect: "When a ride has a single window and goes DOWN, restore+redistribute finds no replacement; the reservation stays REDISTRIBUTED and is reported unplaced (ERR_NO_REPLACEMENT_WINDOW)."
        test_recipe:
          setup: ["Ride with exactly one window (10:00-11:00), one BOOKED reservation; ride goes DOWN (reservation REDISTRIBUTED); clock advanced to 11:30 so the window elapses; restore then expires the only window, leaving no OPEN future replacement"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: GuestApp
              as_user_id: "${g1_id}"
            - call: "POST /rides/${ride_id}/declare-down"
              payload: {}
              as: RideOperator
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T11:30:00.000Z" }
              as: ParkAdmin
            - call: "POST /rides/${ride_id}/restore"
              payload: {}
              as: RideOperator
          trigger:
            - call: "POST /rides/${ride_id}/redistribute"
              payload: {}
              as: RideOperator
              captures: { unplaced: $.data.unplaced_reservation_ids }
          assert:
            - "Reservation.${res_id}.reservation_status == REDISTRIBUTED"
            - "response.data.rehomed_count == 0"
            - "${res_id} in response.data.unplaced_reservation_ids"

      - name: reservation_starts_in_held_initial_state
        claim_type: Initial State
        grounds: [state_machines.Reservation.initial_state]
        distinguishing_aspect: "A newly created reservation starts in HELD (not BOOKED)."
        test_recipe:
          setup: ["A park/ride/window/guest exist"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id, win_v0: $.data.version }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "G1", height_cm: 170 }
              as: ParkAdmin
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { ride_id: "${ride_id}", guest_id: "${g1_id}", return_window_id: "${win_id}", queue_type: "VIRTUAL_QUEUE", expected_return_window_id_version: "${win_v0}" }
              as: GuestApp
              as_user_id: "${g1_id}"
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.reservation_status == HELD"

      - name: party_book_creates_held_reservations_for_linked_members
        claim_type: Side Effect Execution
        grounds: [state_machines.Party.FORMING_to_LOCKED, entities.Reservation.fields.party_id]
        distinguishing_aspect: "party-book locks the party and fans out one HELD VIRTUAL_QUEUE reservation per eligible LINKED member, stamping party_id on each."
        test_recipe:
          setup: ["Party with leader GL + member GM (both 170cm); ride R5 60-min window capacity 2"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { park_id: "${park_id}", to_iso8601: "2026-06-15T09:00:00.000Z" }
              as: ParkAdmin
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R5", hourly_throughput: 5 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GL", height_cm: 170 }
              as: ParkAdmin
              captures: { gl_id: $.data.id }
            - call: "POST /parks/${park_id}/guests"
              payload: { full_name: "GM", height_cm: 170 }
              as: ParkAdmin
              captures: { gm_id: $.data.id }
            - call: "POST /parks/${park_id}/parties"
              payload: { leader_guest_id: "${gl_id}" }
              as: GuestApp
              as_user_id: "${gl_id}"
              captures: { party_id: $.data.id, party_v0: $.data.version }
            - call: "POST /parties/${party_id}/members"
              payload: { guest_id: "${gm_id}" }
              as: GuestApp
              as_user_id: "${gl_id}"
              captures: { party_v1: $.data.version }
          trigger:
            - call: "POST /parties/${party_id}/party-book"
              payload: { ride_id: "${ride_id}", return_window_id: "${win_id}", expected_party_version: "${party_v1}" }
              as: GuestApp
              as_user_id: "${gl_id}"
              captures: { created: $.data.created_reservation_ids }
          assert:
            - "Party.${party_id}.party_status == LOCKED"
            - "ReturnWindow.${win_id}.reserved_count == 2"
            - "response.data.created_reservation_ids has length 2"

  # =================================================================
  - section: calculations
    instances:
      - name: computed_slot_capacity_full_hour
        claim_type: Correct Result
        grounds: [calculations.return_window_slot_capacity, entities.ReturnWindow.fields.slot_capacity]
        distinguishing_aspect: "A 60-minute window on throughput 100 yields slot_capacity floor(100*1.0*0.40)=40."
        test_recipe:
          setup: ["Ride throughput 100"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
          trigger:
            - call: "POST /rides/${ride_id}/return-windows"
              payload: { window_start_utc: "2026-06-15T10:00:00.000Z", window_end_utc: "2026-06-15T11:00:00.000Z" }
              as: ParkAdmin
              captures: { win_id: $.data.id }
          assert:
            - "ReturnWindow.${win_id}.slot_capacity == 40"

      - name: computed_posted_wait_open_baseline
        claim_type: Correct Result
        grounds: [calculations.posted_wait_estimate, entities.Ride.fields.posted_wait_minutes]
        distinguishing_aspect: "With booked_slot_count 0 and throughput 100 the OPEN ride posts ceil((0+20)/100*60)=12 minutes."
        test_recipe:
          setup: ["A freshly created OPEN ride, no reservations"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
          trigger:
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
              captures: { ride_id: $.data.id }
          assert:
            - "Ride.${ride_id}.posted_wait_minutes == 12"

      - name: computed_lightning_lane_open_flat_price
        claim_type: Constants Applied
        grounds: [calculations.lightning_lane_price, entities.LightningLanePurchase.fields.charged_cents]
        distinguishing_aspect: "On an unloaded ride (ride_load 0 < RIDE_PEAK_LOAD) a MULTI_PASS plan price 1500 is charged flat (no surge): charged_cents 1500."
        test_recipe:
          setup: ["Unloaded ride (no reservations); MULTI_PASS plan price 1500 surge 2.0"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P", gate_capacity: 100, operating_date: "2026-06-15" }
              as: ParkAdmin
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rides"
              payload: { name: "R", hourly_throughput: 100 }
              as: ParkAdmin
