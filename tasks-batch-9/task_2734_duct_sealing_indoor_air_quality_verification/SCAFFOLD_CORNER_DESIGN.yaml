            - "${before_status} is unchanged by the refusal: the test is still RECORDED with reviewed_by_user_id == null and no DuctSystem baseline written"
            - "The identical request under X-User-ID 'qa-1' returns HTTP 200 with ${after_status} == ACCEPTED and ${reviewer} == 'qa-1'"
            - "${base} == 300.00 and ${work} == 300.00: the PRE-acceptance side effect fired exactly once, on the accepted call"
            - "${e_sod_again} == ERR_SEGREGATION_OF_DUTIES with HTTP 403: repeated against the now-ACCEPTED test, the priority-30 refusal still outranks the ERR_LEAKAGE_TEST_INVALID_STATE that the wrong from-state would raise at priority 60"
            - "${base} and ${work} are unchanged by that second refusal, and the test is still ACCEPTED with reviewed_by_user_id == 'qa-1'"

