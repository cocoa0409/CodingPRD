            - "the PATCH is accepted because the new headroom is 1 rather than below zero, so ERR_STAFFING_RATIO_EXCEEDED does not apply"
            - "the following GET returns identical values with version == ctr_v2 + 1, confirming the write's response and the stored row never disagree"
