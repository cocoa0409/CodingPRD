  - name: cascading_side_effects_chain_end_to_end
    claim_type: cascading_side_effects
    grounds:
    - calculations.facility_compliance_posture
    - calculations.required_physician_coverage
    excluded_because:
      difficulty_instance: transitive_cascade / third_disclosure_refusal_cascades_defect_posture_forecast_method_and_coverage_deficit
      rationale: The five-link chain and its ordering sensitivity are asserted link by link there.
  - name: dual_variant_calculation_layer_produces_both_results
    claim_type: dual_variant_calculation
    grounds:
    - calculations.required_physician_coverage
    - calculations.claim_settlement
    excluded_because:
      difficulty_instance: dual_variant_calc / physician_coverage_peak_adjusted_diverges_from_trailing_mean_on_identical_history
      rationale: Both variants are computed on identical inputs and the delta is asserted there.
  - name: rate_threshold_trigger_fires_at_the_defect_boundary
    claim_type: rate_threshold_triggers
    grounds:
    - calculations.facility_compliance_posture
    - entities.Facility.fields.open_compliance_defect_count
    excluded_because:
      difficulty_instance: transitive_cascade / third_disclosure_refusal_cascades_defect_posture_forecast_method_and_coverage_deficit
      rationale: DEFECT_RESTRICT_THRESHOLD is crossed exactly at the third defect there, with the count at 2 asserted as still OPEN in setup.
- section: consistency model
  instances:
  - name: every_cascade_is_visible_in_the_same_response_that_caused_it
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    - calculations.facility_compliance_posture
    - calculations.observation_bed_ledger
    distinguishing_aspect: 'consistency_model immediate: the signage-attestation response already carries compliance_posture OPEN and restricted_service_codes [], and the observation response''s facility read in the same request shows observation_beds_occupied 1 - no second read or delay is needed anywhere.'
    test_recipe:
      setup:
      - Facility with V1 PUBLISHED by admin-1, signage PENDING, so compliance_posture is RESTRICTED
      - One acknowledged encounter screened STABLE in MSE_COMPLETE
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities
        payload:
          name: Cedar Freestanding ED
          state_code: TX
          license_category: INDEPENDENT_FREESTANDING_ED
          license_status: ACTIVE
          observation_bed_count: 2
          imaging_scope:
          - XRAY
          - CT
          lab_scope:
          - CBC
          - TROPONIN
          pharmacy_scope_tier: EMERGENCY_ONLY
          max_concurrent_physicians: 2
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          fac_id: $.data.id
          fac_v1: $.data.version
      - call: POST /facilities/${fac_id}/disclosure-templates
        payload:
          version_label: V1
          facility_fee_cents: 145000
          observation_hourly_cents: 42000
          network_status_statement: OUT_OF_NETWORK_ALL_PLANS
          required_signage_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          tpl_v1_id: $.data.id
      - call: POST /disclosure-templates/${tpl_v1_id}/publish
        payload:
          expected_facility_version: ${fac_v1}
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities/${fac_id}/encounters
        payload:
          patient_reference: PT-4201
          acuity_level: 3
          presenting_service_line: CARDIAC
        as: RegistrationClerk
        as_user_id: clerk-1
        captures:
          e_imm: $.data.id
      - call: POST /encounters/${e_imm}/disclosure-decision
        payload:
          decision: ACKNOWLEDGED
        as: RegistrationClerk
        as_user_id: clerk-1
      - call: POST /encounters/${e_imm}/begin-mse
        payload: {}
        as: EmergencyPhysician
        as_user_id: doc-1
      - call: POST /encounters/${e_imm}/complete-mse
        payload:
          stabilization_status: STABLE
        as: EmergencyPhysician
        as_user_id: doc-1
      trigger:
      - call: POST /facilities/${fac_id}/signage-attestations
        payload:
          attested_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: ComplianceOfficer
        as_user_id: co-1
        captures:
          fac_v_imm: $.data.version
      - call: POST /encounters/${e_imm}/observation
        payload:
          observation_plan_note: serial troponins
        as: EmergencyPhysician
        as_user_id: doc-1
      - call: GET /facilities/${fac_id}
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-1
      assert:
      - the attestation response body itself shows compliance_posture == OPEN, restricted_service_codes == [] and signage_attestation_status == ATTESTED
      - the observation response body itself shows Encounter.${e_imm}.clinical_state == OBSERVATION and observation_bed_held == true
      - the immediately following facility read shows observation_beds_occupied == 1 with no intervening delay
      - GET /facilities/${fac_id}/compliance-ledger-entries returns the SIGNAGE_ATTESTED and POSTURE_CHANGE entries already visible in the same test run
