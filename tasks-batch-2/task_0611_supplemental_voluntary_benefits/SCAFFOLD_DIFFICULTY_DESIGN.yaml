        grounds:
          - state_machines.Enrollment.ACTIVE_to_TERMINATED
          - state_machines.Section125Election.LOCKED_to_REVOKED
          - entities.Section125Election.fields.qualifying_event
          - entities.Employee.fields.total_weekly_deduction_cents
        distinguishing_aspect: |
          Depth-3 cascade from a SINGLE trigger (terminate employee): employee
          TERMINATED -> (because of that) its ACTIVE enrollment -> TERMINATED ->
          (because the enrollment terminated) its LOCKED Section125Election ->
          REVOKED with qualifying_event=TERMINATION. Each hop is caused by the prior
          hop, not directly by the terminate call. Origin trigger differs from the
          disburse cascade below.
        test_recipe:
          setup:
            - "One ACTIVE pretax enrollment (so a LOCKED Section125Election exists); employer section_125_plan_active=true."
          setup_api_calls:
            - call: "POST /benefits/employers"
