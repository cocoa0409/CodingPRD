  # -------------------------------------------------------------------
  # Rule 5 - priority_pair_validation_conflict
  # -------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_reports_quote_state_before_cord_hazard_while_present_reports_the_hazard
        grounds:
          - validations.priority_17_ERR_QUOTE_NOT_PRESENTED
          - validations.priority_34_ERR_CORD_HAZARD_NOT_PERMITTED
          - validations.priority_16_ERR_QUOTE_NOT_DRAFT
          - entities.Opening.fields.room_type
          - endpoints.POST_blinds_quotes_id_accept
          - endpoints.POST_blinds_quotes_id_present
        distinguishing_aspect: |
          A STATE (17) versus SAFETY (34) pair, exercised twice on the same fixture so the
          winner flips: /accept on a DRAFT quote violates both and must report
          ERR_QUOTE_NOT_PRESENTED (409), while /present on that same quote satisfies the
          state rule and therefore surfaces ERR_CORD_HAZARD_NOT_PERMITTED (422) - proof
          that the lower-priority rule is genuinely armed and merely outranked.
        test_recipe:
          setup:
            - "One ACTIVE territory, one ACTIVE designer, one ROUTED lead with child_occupied_dwelling false (so the hazard comes from the room, not the dwelling), one SCHEDULED consultation."
            - "One opening in a NURSERY, measured INSIDE at 24.000 x 48.000 and deliberately configured LT-SHEER / CORDED - a configuration §1.4 priority 34 permits to be STORED but never presented, accepted or ordered."
            - "A quote is built from it and left in DRAFT: never presented, so both the state rule and the safety rule are violated by an /accept call."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.055, lead_capacity_per_week: 5, credit_limit_cents: 2000000, liability_window: "ROLLING_180D" }
