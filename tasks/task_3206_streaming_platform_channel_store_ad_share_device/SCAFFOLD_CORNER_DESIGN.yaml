  # ===========================================================================
  - section: rbac
    instances:
      - name: viewer_cannot_create_channel_forbidden_role
        claim_type: rbac_denial
        grounds:
          - roles.Viewer
          - endpoints.POST_/channels
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "POST /channels is a Publisher-only endpoint; a Viewer caller fails with 403 ERR_FORBIDDEN_ROLE before request shape is examined."
        test_recipe:
          setup:
            - "Publisher P and viewer V exist."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "RB Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /viewer-accounts"
              payload: { email: "rb@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
          trigger:
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Nope", category: "VIDEO", content_rating: "G" }
              as: Viewer
              as_user_id: "${vw}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE with http 403"

      - name: publisher_cannot_operate_another_publishers_channel
        claim_type: rbac_denial
        grounds:
          - roles.Publisher
          - validations[priority=3]
        distinguishing_aspect: "Entity-backed ownership: Publisher P2 calling POST /channels/{P1's channel}/versions fails with 403 ERR_FORBIDDEN_ROLE even though the role is correct — X-User-ID must match channel.publisher_id."
        test_recipe:
          setup:
            - "Publishers P1, P2; P1 owns channel C (DRAFT, version 1)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Own P1", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /publishers"
              payload: { legal_name: "Own P2", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${p1}", name: "Owned Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { ch: $.data.id, ch_v: $.data.version }
          trigger:
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "9.9.9", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE with http 403"
            - "Channel.${ch}.status == DRAFT and GET /channels/${ch}/versions returns 0 rows"

      - name: adops_cannot_finalize_statement
        claim_type: rbac_denial
        grounds:
          - roles.AdOps
          - endpoints.POST_/statements/{id}/finalize
        distinguishing_aspect: "Statement finalize is PlatformAdmin-exclusive; AdOps (who records the underlying ad revenue) is denied with 403 — a segregation-of-duties check between measurement and settlement."
        test_recipe:
          setup:
            - "Publisher P with an OPEN statement for 2026-09."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "SoD Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /statements/generate"
              payload: { period: "2026-09" }
              as: PlatformAdmin
            - call: "GET /statements"
              payload: { publisher_id: "${pub}", period: "2026-09" }
              as: PlatformAdmin
              captures: { st: "$.data[0].id" }
          trigger:
            - call: "POST /statements/${st}/finalize"
              payload: {}
              as: AdOps
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE with http 403"
            - "RevenueStatement.${st}.status == OPEN (unchanged)"

      - name: tvmanufacturer_cannot_decide_channel_version
        claim_type: rbac_denial
        grounds:
          - roles.TvManufacturer
          - endpoints.POST_/channel-versions/{id}/decide
        distinguishing_aspect: "Channel certification decisions are PlatformAdmin-exclusive; a TvManufacturer caller is denied with 403 even for a well-formed PASS payload."
        test_recipe:
          setup:
            - "Publisher P with channel C version V IN_REVIEW; manufacturer M exists."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Dec Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Dec Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /manufacturers"
              payload: { legal_name: "Dec TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
          trigger:
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE with http 403"
            - "ChannelVersion.${ver}.review_status == IN_REVIEW (unchanged)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_channel_version_create_with_stale_expected_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[channel-version-create-stale-channel]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two strictly sequential version submissions carrying the same observed channel version: the first succeeds (channel.version 1 -> 2), the second fails with 412 ERR_STALE_VERSION — deterministic OCC with zero parallelism."
        test_recipe:
          setup:
            - "Publisher P with channel C (DRAFT, version 1 observed)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Occ Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Occ Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
          trigger:
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v1: $.data.id }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.1", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: $.data.error_id }
          assert:
            - "ChannelVersion.${v1}.review_status == SUBMITTED (first write succeeded)"
            - "err == ERR_STALE_VERSION with http 412 (the second write observed version ${ch_v} but the channel has advanced to ${ch_v} + 1)"
            - "Channel.${ch}.version == ${ch_v} + 1 — the failed write did not bump the version again"

      - name: occ_grant_resplit_with_stale_expected_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[grant-resplit-stale-grant]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Two sequential resplits carrying the grant's creation version: the first succeeds (standing SUSPENDED applies the 500 bps penalty), the second repeats the stale version and fails with 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Publisher P (ad bps 7000) SUSPENDED; channel C PUBLISHED; grant G (2026-09, 1000 slots) created while P was GOOD, version captured at creation."
          setup_api_calls:
