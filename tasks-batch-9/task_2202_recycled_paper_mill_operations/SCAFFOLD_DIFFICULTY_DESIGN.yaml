          Entity pair RollSet <-> ProductionRun: the roll is WRAPPED, spec-matched and pointed at
          an IN_PRODUCTION order, so every predicate local to the RollSet and the CustomerOrder
          holds, but allocation is refused with ERR_RUN_NOT_CERTIFIED because the producing run's
