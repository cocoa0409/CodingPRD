              as_user_id: "co-1"
              expect: { status: 409, error_id: ERR_REPORT_STATE_INVALID }
          assert:
            - "The repeat investigate is 409 ERR_NOTICE_ALREADY_CLOSED and IllegalTrafficNotice.${notice_id}.state is still UNDER_INVESTIGATION"
            - "The premature resolve is 409 ERR_DISPUTE_STATE_INVALID (the state guard at priority 19 is reached because fraud-2 did not place the block) and BlockingDispute.${dispute_id}.state is still FILED"
            - "The premature adjudicate is 409 ERR_ENFORCEMENT_STATE_INVALID and EnforcementAction.${action_id}.status is still PROPOSED with total_forfeiture_cents == 2000000"
            - "The premature file is 409 ERR_REPORT_STATE_INVALID and EffectivenessReport.${report_id}.state is still GENERATED with signed_off_at == null"
            - "Provider.${prov_id}.outstanding_forfeiture_cents == 2000000 and open_notice_count == 1"

      - name: second_dispute_on_one_event_is_rejected_until_the_first_is_withdrawn
        claim_type: error_triggerable
        grounds:
          - "validations[priority=33]"
          - "errors[ERR_DUPLICATE_DISPUTE]"
          - state_machines.BlockingDispute.FILED_to_WITHDRAWN
        distinguishing_aspect: "The uniqueness guard is scoped to the live states {FILED, UNDER_REVIEW, UPHELD, REVERSED}: the second dispute is 409 while the first is FILED and becomes acceptable the instant the caller withdraws it, so the event carries two dispute rows of which only one is ever live."
        test_recipe:
          setup:
