              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { sp_max_id: $.data.id }
          assert:
            - "response status == 201"
            - "MarketingSpendEntry.${sp_max_id}.amount_cents == 4000000"
            - "Partnership.${ps_id}.marketing_budget_remaining_cents == 0"
            - "Partnership.${ps_id}.unrecouped_marketing_spend_cents == 4000000"

      - name: refund_over_the_net_collected_amount_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 49 ERR_REFUND_EXCEEDS_COLLECTED]
          - entities.Enrollment.fields.collected_cents
        distinguishing_aspect: "A manual REFUND is bounded by collected_cents minus refunded_cents on that Enrollment alone: after a single 562500 payment, a 562501 refund is refused by one cent."
        test_recipe:
          setup:
