          - endpoints["POST /hedge-positions/{id}/unwinds"]
        distinguishing_aspect: "ERR_INVALID_HEDGE_STATE is reachable: unwinding an already UNWOUND position returns 409 and does not overwrite the first settlement price or realized P&L."
        test_recipe:
          setup:
            - "One position of 10000 units at 2.50 already unwound at 3.00 (realized 5000.00)."
          setup_api_calls:
