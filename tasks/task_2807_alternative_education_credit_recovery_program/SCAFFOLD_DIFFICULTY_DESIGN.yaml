        conflict_pair: "priority 10 (state) vs priority 13 (referential)"
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - errors[ERR_PLACEMENT_STATE_INVALID]
          - errors[ERR_COURSE_NOT_PREVIOUSLY_FAILED]
          - endpoints[POST /course-enrollments]
        distinguishing_aspect: |
          One POST /course-enrollments violates both the state rule (the placement is
          EXITED_UNSUCCESSFUL) and the referential recovery-eligibility rule (the backing
          PriorCourseRecord outcome is PASSED, not FAILED); only ERR_PLACEMENT_STATE_INVALID may
          surface. The control call proves the referential rule is genuinely violated by issuing the
          same payload shape against an ACTIVE placement, which returns
          ERR_COURSE_NOT_PREVIOUSLY_FAILED. A naive implementation that checks recovery eligibility
          before placement state reports the wrong error on the first call.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 10, certified_teacher_fte 4.00, max_students_per_teacher 12"
            - "one PACKET course ALG1 (credit_value 1.00, total_modules 8, required_seat_hours 60.00, min_passing_percent 60.00)"
            - "student A: a PASSED PriorCourseRecord for ALG1 (original_percent 82.00, credits_attempted 1.00) and a placement that has already been exited (status EXITED_UNSUCCESSFUL)"
            - "student B: an identical PASSED PriorCourseRecord for ALG1 and an ACTIVE placement"
            - "the fresh placement versions are re-read after the exit so no stale-version error can pre-empt the comparison"
