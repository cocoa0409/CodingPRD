              as_user_id: "eng-1"
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF5HT0AA10012", chassis_model_id: "${cm_a}", ownership: "POOL_STOCK", availability_date: "2026-08-05" }
              as: PlantAdmin
              captures: { ch: "$.data.id" }
            - call: "POST /upfit/chassis/${ch}/inspect"
              payload: { measured_front_axle_weight_lb: 4820, measured_rear_axle_weight_lb: 2680 }
              as: InstallTechnician
