      - name: invalid_state_beats_coverage_expiry_sweep_on_second_price
        grounds:
          - validations[priority=11]
          - validations[priority=35]
          - state_machines.Coverage.VERIFIED_to_EXPIRED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_COVERAGE_UNVERIFIED]
        distinguishing_aspect: |
          Error-category pair `state` (priority 11) versus `business_fiscal` (priority 35): an encounter
          that is already PRICED and whose coverage lapsed on 2026-05-31 fails both checks, and the
          state rung wins with ERR_INVALID_STATE. The observable consequence is that the lazy
          coverage-expiry sweep never runs — the coverage stays VERIFIED and its version does not move.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-11T09:00:00Z, advanced to 2026-06-15T09:00:00Z at the end of setup."
            - "Standard school stack with a VERIFIED MEDICAID_MCO coverage whose verified_through_date is 2026-05-31."
            - "One encounter screened, examined, with one PERFORMED D1206, already priced (billing_status PRICED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
