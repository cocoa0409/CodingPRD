  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: state_vs_fiscal_conflict_covered
        claim_type: priority_conflict
        grounds: ["validations[priority=7]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: state_error_beats_fiscal_error_on_assignment_create
          rationale: "Dual-failure ordering asserted by the §1.8 instance."
      - name: temporal_vs_constraint_conflict_covered
        claim_type: priority_conflict
        grounds: ["validations[priority=9]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: temporal_error_beats_constraint_error_on_event_create
          rationale: "Dual-failure ordering asserted by the §1.8 instance."
      - name: weather_watch_on_indoor_event_conditional_rejected
        claim_type: conditional_validation
        grounds: [state_machines.Event.SCHEDULED_to_WEATHER_WATCH, "errors[ERR_EVENT_NOT_OUTDOOR]"]
        distinguishing_aspect: "The weather-watch rule applies only when is_outdoor == true; an indoor GYM event in SCHEDULED is rejected with ERR_EVENT_NOT_OUTDOOR."
        test_recipe:
          setup: ["program; indoor event SCHEDULED"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "WW", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "REHEARSAL", facility: "GYM", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", is_outdoor: false }, as: BandDirector, captures: { evt: $.data.id } }
          trigger:
            - { call: "POST /band/events/${evt}/weather-watch", payload: {}, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_NOT_OUTDOOR; Event.${evt}.status == SCHEDULED"
      - name: plume_requires_issued_shako
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_MATCHING_GARMENT_REQUIRED]"]
        distinguishing_aspect: "Issuing a PLUME to a student not currently holding an ISSUED SHAKO → ERR_MATCHING_GARMENT_REQUIRED; issuing SHAKO first unlocks it."
        test_recipe:
          setup: ["program; enrolled student; PLUME and SHAKO in storage"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "MG", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "MG", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "PLUME", size_label: "STD" }, as: EquipmentManager, captures: { plume: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "SHAKO", size_label: "7" }, as: EquipmentManager, captures: { shako: $.data.id } }
          trigger:
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${stu}", uniform_id: "${plume}" }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${stu}", uniform_id: "${shako}" }, as: EquipmentManager }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${stu}", uniform_id: "${plume}" }, as: EquipmentManager, captures: { ok_id: $.data.id } }
          assert:
            - "err == ERR_MATCHING_GARMENT_REQUIRED before SHAKO issuance"
            - "UniformAssignment.${ok_id} created after SHAKO issued (conditional rule satisfied)"
      - name: duplicate_judge_score_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_SCORE]"]
        distinguishing_aspect: "Second score row from the same judge_id on the same entry → ERR_DUPLICATE_SCORE; a different judge is accepted."
