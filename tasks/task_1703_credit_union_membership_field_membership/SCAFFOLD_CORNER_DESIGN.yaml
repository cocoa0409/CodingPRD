# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Coverage Index for Non-Difficulty Tests (§1.9)
# Credit Union Membership & Field of Membership
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: charter_creation_defaults_and_singleton_constraint
        claim_type: creation
        grounds: [entities.Charter, "errors[ERR_CHARTER_ALREADY_EXISTS]"]
        distinguishing_aspect: "First charter POST returns 201 with status ACTIVE, version 1, and segments created in array order; a second POST is rejected because the charter is a singleton."
        test_recipe:
          setup: ["empty database, clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, { segment_type: "COMMUNITY", descriptor: "Riverside County residents", required_documents: ["GOVERNMENT_ID", "ADDRESS_PROOF"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id", c_status: "$.data.status", c_version: "$.data.version" } }
          trigger:
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg0_desc: "$.data[0].descriptor", seg0_status: "$.data[0].status", seg1_desc: "$.data[1].descriptor" } }
            - { call: "POST /credit-union/charters", payload: { bond_type: "COMMUNITY", par_value_cents: 250, segments: [] }, as: BoardDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "c_status == ACTIVE and c_version == 1"
            - "seg0_desc == 'ACME Corp employees', seg0_status == ACTIVE, seg1_desc == 'Riverside County residents' (array order preserved, created_at ASC)"
            - "err == ERR_CHARTER_ALREADY_EXISTS (409)"

      - name: application_missing_basis_rejected
        claim_type: required_fields
        grounds: [entities.MembershipApplication.fields.basis, "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "Omitting the required input field basis yields ERR_VALIDATION_FAILED (400) and no application is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "No Basis", date_of_birth: "1990-01-01", documents_provided: [] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION_FAILED (400)"

      - name: segment_match_application_requires_segment_id
        claim_type: required_fields
        grounds: [entities.MembershipApplication.fields.segment_id, "validations[priority=4]"]
        distinguishing_aspect: "Conditional requiredness: basis SEGMENT_MATCH without segment_id is a syntactic 400, evaluated before any existence or business check."
        test_recipe:
          setup: ["charter with one segment"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector }
          trigger:
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "No Seg", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VALIDATION_FAILED (400)"

      - name: member_computed_fields_tenure_and_qualifying_balance
        claim_type: computed_fields
        grounds: [entities.Member.fields.tenure_months, entities.Member.fields.qualifying_balance_cents]
        distinguishing_aspect: "tenure_months uses the day-of-month boundary rule (2025-06-15 -> 2026-08-01 is 13, not 14); qualifying_balance_cents sums only OPEN accounts."
        test_recipe:
          setup:
            - "Member approved at clock 2025-06-15; PRIMARY 100,000 plus SUPPLEMENTAL 50,000 (SUPPLEMENTAL later closed on 2026-07-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Computed Kim", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100000 }, as: MembershipOfficer }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "SUPPLEMENTAL", initial_deposit_cents: 50000 }, as: MembershipOfficer, captures: { acctS: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/share-accounts/${acctS}/close", as: MembershipOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /credit-union/members/${m1}", as: MembershipOfficer, captures: { tenure: "$.data.tenure_months", qbal: "$.data.qualifying_balance_cents", tier: "$.data.tier", eff: "$.data.membership_effective_date" } }
          assert:
            - "eff == 2025-06-15 and tenure == 13 (day 01 < day 15 subtracts the partial month)"
            - "qbal == 100000 (closed SUPPLEMENTAL excluded)"
            - "tier == STANDARD (materialized default; never recomputed without tier-review)"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "A well-formed UUID that does not exist yields ERR_NOT_FOUND (404), not a state or validation error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /credit-union/members/00000000-0000-0000-0000-000000000000", as: MembershipOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND (404)"

      - name: share_transaction_immutable_event_shape
        claim_type: immutability
        grounds: [entities.ShareTransaction]
        distinguishing_aspect: "ShareTransaction has common_fields: false — read rows expose id and created_at but no updated_at and no version, and no update endpoint exists."
        test_recipe:
          setup: ["member with PRIMARY account 100,000 (opening SYSTEM deposit) plus one MANUAL deposit"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Event Eve", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "PRIMARY", initial_deposit_cents: 100000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 2500, posted_date: "2026-08-01" }, as: OperationsOfficer }
          trigger:
            - { call: "GET /credit-union/share-accounts/${acct1}/transactions", as: MembershipOfficer, captures: { k0: "$.data[0].kind", o0: "$.data[0].origin", r0: "$.data[0].running_balance_cents", k1: "$.data[1].kind", r1: "$.data[1].running_balance_cents" } }
          assert:
            - "k0 == DEPOSIT, o0 == SYSTEM, r0 == 100000 (opening deposit synthesized by account creation)"
            - "k1 == DEPOSIT, r1 == 102500"
            - "neither row carries updated_at or version keys (common_fields: false event entity)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: application_approve_from_docs_requested_rejected
        claim_type: invalid_transition
        grounds: [state_machines.MembershipApplication, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "Approve is only valid from UNDER_REVIEW; from DOCS_REQUESTED it fails with ERR_APPLICATION_INVALID_STATE even when documents are complete."
        test_recipe:
          setup: ["application with complete docs moved to DOCS_REQUESTED"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "State Sam", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/request-documents", payload: { requested_document_codes: ["ADDRESS_PROOF"] }, as: MembershipOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_APPLICATION_INVALID_STATE (409); no Member is created"

      - name: application_terminal_lockdown_after_deny
        claim_type: terminal_lockdown
        grounds: [state_machines.MembershipApplication.UNDER_REVIEW_to_DENIED]
        distinguishing_aspect: "DENIED is terminal: a subsequent approve attempt on the same application fails with ERR_APPLICATION_INVALID_STATE."
        test_recipe:
          setup: ["application denied by a different officer than the filer"]
          setup_api_calls:
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Denied Dan", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/deny", payload: { denial_reason: "insufficient documentation" }, as: MembershipOfficer, as_user_id: "officer-2" }
          trigger:
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_APPLICATION_INVALID_STATE (409)"

      - name: meeting_double_tally_rejected
        claim_type: idempotency
        grounds: [state_machines.AnnualMeeting.SCHEDULED_to_HELD, "errors[ERR_MEETING_INVALID_STATE]"]
        distinguishing_aspect: "A second close-and-tally on a HELD meeting is rejected and the recorded snapshot is not rewritten."
        test_recipe:
          setup: ["meeting with quorum_threshold 1; one member casts; tally -> HELD with ballots_counted 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Solo Voter", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-07-20", record_date: "2026-07-05", voting_open_date: "2026-07-10", quorum_threshold: 1 }, as: BoardDirector, captures: { mtg1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${m1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings/${mtg1}/close-and-tally", as: BoardDirector, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /credit-union/annual-meetings/${mtg1}/close-and-tally", as: BoardDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "st == HELD after the first tally"
            - "err == ERR_MEETING_INVALID_STATE (409) on the second tally"

      - name: ballot_on_adjourned_meeting_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AnnualMeeting, "errors[ERR_MEETING_INVALID_STATE]"]
        distinguishing_aspect: "Ballots are accepted only while SCHEDULED; casting on an ADJOURNED_NO_QUORUM meeting (whose ballots remain valid for the chain) is a state error."
        test_recipe:
          setup: ["meeting adjourned with zero ballots (quorum 1 unmet)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Late Voter", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/annual-meetings", payload: { meeting_date: "2026-07-20", record_date: "2026-07-05", voting_open_date: "2026-07-10", quorum_threshold: 1 }, as: BoardDirector, captures: { mtg1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/annual-meetings/${mtg1}/close-and-tally", as: BoardDirector, captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /credit-union/ballots", payload: { meeting_id: "${mtg1}", choice: "FOR_SLATE_A" }, as: Member, as_user_id: "${m1}", captures: { err: "$.data.error_id" } }
          assert:
            - "st == ADJOURNED_NO_QUORUM (0 < 1)"
            - "err == ERR_MEETING_INVALID_STATE (409)"

      - name: declaration_void_after_paid_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.DividendDeclaration.DECLARED_to_VOIDED, "errors[ERR_DECLARATION_INVALID_STATE]"]
        distinguishing_aspect: "PAID is terminal for void: money already moved cannot be clawed back via void; the attempt is a state error."
        test_recipe:
          setup: ["declaration paid on its payable_date"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations", payload: { period_start: "2026-07-01", period_end: "2026-07-31", rate_bps: 600, method: "AVERAGE_DAILY_BALANCE", payable_date: "2026-08-10" }, as: BoardDirector, captures: { decl1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/dividend-declarations/${decl1}/pay", as: OperationsOfficer, captures: { st: "$.data.status", paid: "$.data.paid_total_cents" } }
          trigger:
            - { call: "POST /credit-union/dividend-declarations/${decl1}/void", as: BoardDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "st == PAID and paid == 0 (no eligible accounts)"
            - "err == ERR_DECLARATION_INVALID_STATE (409)"

      - name: transaction_on_closed_account_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ShareAccount.OPEN_to_CLOSED, "errors[ERR_ACCOUNT_NOT_OPEN]"]
        distinguishing_aspect: "Posting to a CLOSED account fails with ERR_ACCOUNT_NOT_OPEN regardless of amount or date validity."
        test_recipe:
          setup: ["member with a SUPPLEMENTAL account opened 2026-08-01 and closed the same day"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Closed Carl", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/share-accounts", payload: { member_id: "${m1}", account_type: "SUPPLEMENTAL", initial_deposit_cents: 5000 }, as: MembershipOfficer, captures: { acct1: "$.data.id" } }
            - { call: "POST /credit-union/share-accounts/${acct1}/close", as: MembershipOfficer }
          trigger:
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "DEPOSIT", amount_cents: 100, posted_date: "2026-08-01" }, as: OperationsOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ACCOUNT_NOT_OPEN (409)"

      - name: review_cure_after_terminal_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.EligibilityReview, "errors[ERR_REVIEW_INVALID_STATE]"]
        distinguishing_aspect: "A CONFIRMED_INELIGIBLE review is terminal; curing it is rejected (late grace cure requires a fresh review)."
        test_recipe:
          setup: ["review confirmed ineligible by co-2 (member in GRACE_PERIOD)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Terminal Tess", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "POST /credit-union/members/${m1}/eligibility-reviews", payload: { reason: "MANUAL_FLAG" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { rev1: "$.data.id" } }
            - { call: "POST /credit-union/eligibility-reviews/${rev1}/confirm-ineligible", as: ComplianceOfficer, as_user_id: "co-2" }
          trigger:
            - { call: "POST /credit-union/eligibility-reviews/${rev1}/cure", as: ComplianceOfficer, as_user_id: "co-3", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_REVIEW_INVALID_STATE (409); member remains GRACE_PERIOD"

      - name: review_cure_returns_member_to_active
        claim_type: valid_transition
        grounds: [state_machines.EligibilityReview.OPEN_to_CURED, state_machines.Member.INELIGIBLE_UNDER_REVIEW_to_ACTIVE]
