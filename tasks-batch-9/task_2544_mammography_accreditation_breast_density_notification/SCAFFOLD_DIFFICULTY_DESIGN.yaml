            - &c_lv1_inspection
              call: "POST /facilities/${fac_id}/inspections"
              payload: { inspection_date: "2026-07-28T00:00:00Z", inspector_findings_level: "LEVEL_1", finding_codes: ["900.12(e)(5)"] }
              as: FdaInspector
              as_user_id: "inspector-1"
