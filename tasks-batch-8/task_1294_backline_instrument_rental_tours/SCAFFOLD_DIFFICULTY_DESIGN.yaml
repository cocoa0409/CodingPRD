              as: TourManager
              captures: { qt: $.data.id }
            - call: "POST /backline/tours/${qt}/stops"
              payload: { city_code: "SEA", venue_date: "2026-08-11T00:00:00Z", load_in_ts: "2026-08-11T10:00:00Z" }
              as: TourManager
              captures: { qs: $.data.id }
            - call: "POST /backline/tour-stops/${qs}/rider-lines"
              payload: { gear_model_id: "${qm}", quantity: 1 }
              as: TourManager
              captures: { qrl: $.data.id }
            - call: "POST /backline/rider-lines/${qrl}/source"
              payload: { origin_city_code: "SEA", dest_city_code: "SEA", start_date: "2026-08-10T00:00:00Z", end_date: "2026-08-12T00:00:00Z", use_cross_rental: true, partner_vendor_id: "${qv}", vendor_rate_cents_per_day: 80000 }
              as: LogisticsCoordinator
              captures: { qr: $.data.id }
            - call: "GET /backline/cross-rental-requests"
              payload: { reservation_line_id: "${qr}" }
              as: LogisticsCoordinator
              captures: { qcrr: "$.data[0].id" }
            - call: "POST /backline/cross-rental-requests/${qcrr}/accept"
              payload: {}
              as: PartnerVendorRep
              as_user_id: "${qv}"
            - call: "POST /backline/cross-rental-requests/${qcrr}/mark-fulfilled"
              payload: {}
              as: PartnerVendorRep
              as_user_id: "${qv}"
          trigger:
            - call: "POST /backline/cross-rental-requests/${qcrr}/settle"
              payload: {}
              as: OpsManager
              captures: { xsettle_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (linked reservation ${qr} is SOURCED, not SETTLED; cross-entity gate blocks)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: gear_unit_halfopen_adjacency_vs_overlap
        grounds:
          - calculations.gear_availability_window
          - validations[priority=8]
        distinguishing_aspect: |
          Half-open interval semantics on GearUnit: a reservation ending
          2026-08-15 and a new window starting 2026-08-15 are adjacent and do
          NOT overlap (end == start permitted), while a window starting
          2026-08-14 DOES overlap and must pick another unit or fail
          ERR_GEAR_UNAVAILABLE.
        test_recipe:
          setup:
            - "One unit U of model M; existing reservation R1 [2026-08-10, 2026-08-15) in SOURCED status"
            - "Two new rider lines needing the same model: one for [2026-08-15, 2026-08-20) (adjacent, must succeed), one for [2026-08-14, 2026-08-20) (overlap, must fail with only one unit)"
          setup_api_calls:
            - call: "POST /backline/artists"
