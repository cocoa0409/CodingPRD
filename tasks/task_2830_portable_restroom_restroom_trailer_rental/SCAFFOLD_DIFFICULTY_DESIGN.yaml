            - call: "POST /placement-permits/${permit_id}/submit"
              payload: { submission_note: "round 4" }
              as: PermitCoordinator
              captures: { limit_error: $.data.error_id }
          assert:
            - "${round_initial} == 0 and ${round_1} == 1"
            - "${round_2} == 2 and ${status_2} == SUBMITTED — REJECTED -> SUBMITTED re-entered a state the row had already left"
            - "${round_3} == 3"
            - "${limit_error} == ERR_PERMIT_REVISION_LIMIT with HTTP 409"
            - "PlacementPermit.${permit_id}.revision_round == 3 (the refused submit did not increment it)"
            - "PlacementPermit.${permit_id}.status == REJECTED"
            - "PlacementPermit.${permit_id}.rejection_reason == still non-compliant"
            - "ServiceSite.${site_id}.permit_status == REJECTED and ServiceSite.${site_id}.site_posture == BLOCKED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: missed_visit_credit_cascades_charge_contract_account_then_blocks_rebill
        grounds:
          - state_machines.ServiceVisit.PLANNED_to_MISSED
          - calculations.missed_service_credit
          - calculations.account_open_credit_balance
          - entities.ChargeEvent.fields.amount_cents
          - entities.RentalContract.fields.credit_accrued_cents
          - entities.RentalContract.fields.net_billable_cents
          - entities.RentalAccount.fields.open_credit_balance_cents
          - entities.RentalAccount.fields.billing_hold
          - validations[priority=70]
          - errors[ERR_ACCOUNT_BILLING_HOLD]
        distinguishing_aspect: |
          Depth-4 CAUSAL CHAIN, each hop caused by the previous hop's write and not by the trigger:
          visit -> MISSED causes a ChargeEvent row (LINK 1); the new charge row causes
          RentalContract.credit_accrued_cents / net_billable_cents plus INVOICED -> REBILL_REQUIRED
          (LINK 2); the contract's credit figure causes RentalAccount.open_credit_balance_cents
          (LINK 3); that balance causes RentalAccount.billing_hold (LINK 4). Hop 4 is then made
          observable by a re-invoice attempt that priority 70 refuses.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z (a Monday). Account ACTIVE, site permitted OPEN."
            - "CONSTRUCTION contract headcount 60, frequency 2, ada true -> 9 STANDARD + 1 ADA + 3 HANDWASH = 13 units, quoted 181500."
            - "Contract activated and invoiced at SHOULDER + VERTICAL + fuel = 9.75 percent -> invoice_subtotal 199197, billing_state INVOICED."
            - "MON route with truck_capacity_units 20; one ACTIVE schedule of 13 units -> density_planned_pct 65; one PLANNED SERVICE visit on 2026-08-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Ridgeline Builders", account_type: "CONSTRUCTION", credit_terms_days: 30 }
