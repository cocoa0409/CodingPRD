  - section: errors
    instances:
      - name: error_recall_blocked_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_RECALL_BLOCKED]"]
        excluded_because:
          difficulty_instance: safety_beats_constraint_on_confirm
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_extension_window_conflict_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_EXTENSION_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: extension_approve_requires_unit_free
          rationale: "Asserted as the failure path of the named §1.8 instance."

