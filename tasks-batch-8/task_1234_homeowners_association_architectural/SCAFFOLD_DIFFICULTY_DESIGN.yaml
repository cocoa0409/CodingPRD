            - "app2 (A=1,D=2, ratio 1/3): status == DENIED with decision_reason == 'color mismatch'"

  # =================================================================
  # Rule 7 — cross_entity_state_dependency (different pairs:
  #           Application×Property posture, Inspection×Violation)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_gated_by_property_posture
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Property.FINES_OUTSTANDING_to_LIENED
          - validations[priority=7]
        distinguishing_aspect: |
          Pair Application×Property: DRAFT -> SUBMITTED is defined only when the linked
          Property's computed posture is not LIENED; a complete application on a LIENED
          property is rejected with ERR_PROPERTY_LIENED purely because of the other entity's
          derived state.
        test_recipe:
          setup:
            - "Association base 10000, lien_threshold 10000, lien_min_age_days 0; violation at 2026-05-01; sweep at 2026-05-02 files lien -> posture LIENED"
            - "DRAFT application WITH complete attachments on the liened property"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Posture HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 10000, lien_min_age_days: 0, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "X-1", address: "1 Posture Pl", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: UNAPPROVED_WORK, description: "unapproved patio" }, as: Manager }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://x/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://x/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
          trigger:
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}", captures: { err: $.data.error_id } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { posture: $.data.compliance_posture } }
          assert:
            - "Property.compliance_posture == LIENED at submit time"
            - "submit: error_id == ERR_PROPERTY_LIENED; application remains DRAFT (complete attachments do not rescue it)"

      - name: reschedule_gated_by_violation_remediated
        grounds:
          - state_machines.Inspection.FAILED_REMEDIATION_to_SCHEDULED
          - state_machines.Violation.OPEN_to_REMEDIATED
          - validations[priority=6]
        distinguishing_aspect: |
          Pair Inspection×Violation: the reschedule transition exists only when the Violation
          whose source_inspection_id == this inspection has reached REMEDIATED; while it is
          OPEN the same call fails with ERR_INVALID_STATE. Different entity pair than
          Application×Property.
        test_recipe:
          setup:
            - "Approved application with ACTIVE permit; inspection attempt 1 recorded FAIL at 2026-06-10 (violation OPEN)"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Gate2 HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "V-1", address: "1 Verify Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: ADDITION, guideline_section: "SEC-9.0", description: "sunroom", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "plans", uri: "s3://v/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "glass", uri: "s3://v/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: ["dust control"] }, as: Manager }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T09:00:00Z" }, as: Manager }
            - { call: "GET /arc/applications/${app}/permits", as: Manager, captures: { permit: "$.data[0].id" } }
            - { call: "POST /arc/permits/${permit}/request-inspection", as: Homeowner, as_user_id: "${owner_a}", captures: { insp: $.data.id } }
            - { call: "POST /arc/inspections/${insp}/record", payload: { result: FAIL, result_notes: "glazing mismatch" }, as: Inspector }
            - { call: "GET /arc/inspections/${insp}/violations", as: Manager, captures: { vio: "$.data[0].id" } }
          trigger:
            - { call: "POST /arc/inspections/${insp}/reschedule", as: Manager, captures: { err: $.data.error_id } }
            - { call: "POST /arc/violations/${vio}/remediate", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/inspections/${insp}/reschedule", as: Manager, captures: { insp_status: $.data.status, insp_attempt: $.data.attempt_no } }
          assert:
            - "first reschedule while violation OPEN: error_id == ERR_INVALID_STATE"
            - "after remediate: reschedule succeeds, status == SCHEDULED, attempt_no == 2"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics:
  #           half-open permit windows on Property vs closed blackout
  #           intervals on Association)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_window_half_open_overlap_and_adjacency
        grounds:
          - calculations.window_conflict_detection
          - validations[priority=8]
          - entities.ConstructionPermit.fields.window_end
        distinguishing_aspect: |
          Resource: Property permits; semantics: half-open [start, end). An interior overlap
          (06-15 vs existing [06-01, 07-01)) is rejected with ERR_WINDOW_OVERLAP, while pure
          adjacency (start == 07-01, the existing window's end) is accepted — touching
          endpoints do NOT conflict under half-open semantics.
        test_recipe:
          setup:
            - "Standard association; property with permit1 ACTIVE [2026-06-01, 2026-07-01) from approved app1"
            - "app2 (window [2026-06-15, 2026-07-15)) and app3 (window [2026-07-01, 2026-08-01)) both UNDER_REVIEW with three APPROVE ballots each"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Overlap HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
