  - rule_id: resource_temporal_overlap
    instances:

      - name: rest_buffer_day_rejects_adjacent_deployment_intervals_per_technician
        grounds:
          - validations[priority=21]
          - errors[ERR_TECHNICIAN_DEPLOYMENT_OVERLAP]
          - entities.CrewDeployment.fields.effective_end_date
        distinguishing_aspect: |
          The technician exclusivity window is a CLOSED interval widened by REST_BUFFER_DAYS 1 on both
          ends, so three cases separate: a start_date of 2026-08-20 (true overlap) and 2026-08-21
          (adjacent, gap 0) are both rejected while 2026-08-22 (gap 1 clear day) is accepted. The
          window is also per-technician, so a second technician may take the very 2026-08-21 interval
          that TA was refused - an implementation testing plain interval intersection, or scoping the
          check to the facility, fails at least one of the four calls.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T08:00:00Z; storm event TARGETED; KS facility created (SETUP is enough - deployment creation is not gated on facility status)."
            - "Technician TA (MASTER, KS licence to 2027-01-31) already deployed 2026-08-05..2026-08-20 (CONFIRMED)."
            - "Technician TB (JOURNEYMAN, KS licence to 2027-03-31) has no deployment yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CatastropheDirector
            - call: "POST /hail-ops/storm-events"
              payload: { name: "Wichita Supercell", region_state_code: "KS", max_hail_size_mm: 55, swath_area_km2: 520, swath_confidence: "GROUND_TRUTHED", vehicle_population_estimate: 40000, competitor_shop_count: 3, first_hail_at: "2026-08-04T21:00:00Z" }
              as: CatastropheDirector
              captures: { ev: $.data.id }
            - call: "POST /hail-ops/storm-events/${ev}/decision"
              payload: { decision: "TARGET" }
              as: CatastropheDirector
            - call: "POST /hail-ops/facilities"
              payload: { storm_event_id: "${ev}", name: "Wichita North Lot", state_code: "KS", address: "1200 N Broadway", staging_slot_count: 6, pay_model: "FLAT" }
              as: CatastropheDirector
              captures: { fac: $.data.id }
            - call: "POST /hail-ops/technicians"
              payload: { full_name: "Tara Alvarez", home_state_code: "TX", license_state_code: "KS", license_expires_at: "2027-01-31", skill_tier: "MASTER", flat_split_pct: 0.45 }
              as: CrewCoordinator
              captures: { tech_a: $.data.id }
            - call: "POST /hail-ops/technicians"
              payload: { full_name: "Bo Nakamura", home_state_code: "OK", license_state_code: "KS", license_expires_at: "2027-03-31", skill_tier: "JOURNEYMAN", flat_split_pct: 0.40 }
              as: CrewCoordinator
              captures: { tech_b: $.data.id }
            - call: "POST /hail-ops/crew-deployments"
              payload: { technician_id: "${tech_a}", facility_id: "${fac}", start_date: "2026-08-05", end_date: "2026-08-20" }
              as: CrewCoordinator
              captures: { dep_a: $.data.id }
          trigger:
            - call: "POST /hail-ops/crew-deployments"
              payload: { technician_id: "${tech_a}", facility_id: "${fac}", start_date: "2026-08-20", end_date: "2026-09-05" }
              as: CrewCoordinator
            - call: "POST /hail-ops/crew-deployments"
              payload: { technician_id: "${tech_a}", facility_id: "${fac}", start_date: "2026-08-21", end_date: "2026-09-05" }
              as: CrewCoordinator
            - call: "POST /hail-ops/crew-deployments"
