          assert:
            - "captured err == ERR_MIXED_VARIETY"

      - name: pelletize_mixed_crop_year
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MIXED_CROP_YEAR]
          - validations[priority=12]
        distinguishing_aspect: "Same variety but crop years 2026 vs 2027 -> ERR_MIXED_CROP_YEAR (carryover blending happens via rollover, not at pelletize time)."
        test_recipe:
          setup: ["lot A CASCADE 2026 DRIED; lot B CASCADE 2027 (same field, next year's plan) DRIED"]
          setup_api_calls:
            - { call: "POST /api/fields", payload: { name: "F1", acreage: 100 }, as: FarmManager, captures: { f1: $.data.id } }
