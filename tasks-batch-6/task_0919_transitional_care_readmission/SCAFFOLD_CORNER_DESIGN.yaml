              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
            - call: "POST /tcm/referrals/${ref1_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.created_episode_id }
            - call: "POST /tcm/episodes/${ep1_id}/contact-attempts"
              payload: { modality: "PHONE" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { ca1_id: $.data.id }
            - call: "POST /tcm/contact-attempts/${ca1_id}/disposition"
              payload: { outcome: "CONNECTED" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
            - call: "POST /tcm/episodes/${ep1_id}/med-reconciliations"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { mr1_id: $.data.id }
            - call: "POST /tcm/med-reconciliations/${mr1_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/episodes/${ep1_id}/visits"
              payload: { navigator_id: "${nav1_id}", scheduled_start: "2026-05-05T15:00:00Z", scheduled_end: "2026-05-05T16:00:00Z" }
              as: CareNavigator
              as_user_id: "${nav1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /tcm/visits/${v1_id}/confirm"
              payload: {}
              as: CareNavigator
              as_user_id: "${nav1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/visits/${v1_id}/complete"
              payload: { documented_elements: ["MED_REC_REVIEWED", "DISCHARGE_SUMMARY_REVIEWED", "PATIENT_EDUCATION"] }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /tcm/visits/${v1_id}/attest"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "GET /tcm/visits/${v1_id}"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { v1_v0: $.data.version }
            - call: "POST /tcm/visits/${v1_id}/amend"
              payload: { documented_elements: ["MED_REC_REVIEWED", "DISCHARGE_SUMMARY_REVIEWED", "PATIENT_EDUCATION", "HIGH_COMPLEXITY_MDM", "COMMUNITY_SERVICE_REFERRAL"], expected_visit_version: "${v1_v0}" }
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /tcm/visits/${v1_id}/amend"
              payload: { documented_elements: ["MED_REC_REVIEWED"], expected_visit_version: "${v1_v0}" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with error_id ERR_STALE_VERSION"
            - "TcmVisit.${v1_id}.amendment_count == 1 and achieved_complexity == HIGH_COMPLEXITY"
            - "TcmVisit.${v1_id}.documentation_status == AMENDED and documented_elements still contains all five members"

  - section: consistency_model
    instances:
      - name: accept_returns_every_derived_field_in_the_same_request
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints.POST_/tcm/referrals/{referral_id}/accept"
        distinguishing_aspect: "The consistency model is immediate - a single GET after accept already shows risk_score, risk_tier, contact_deadline_at, visit_due_date, both period bounds and the incremented Patient and Navigator counters, with no second call needed."
        test_recipe:
          setup: ["A RECEIVED HIGH-tier referral for a patient with no open episode, clock 2026-05-01T16:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T16:00:00Z" }
              as: ProgramAdmin
            - call: "POST /tcm/facilities"
              payload: { name: "Mercy General", facility_type: "ACUTE_HOSPITAL", network_status: "IN_NETWORK" }
              as: ProgramAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tcm/payers"
              payload: { name: "Northstar Health", tcm_covered: true, tcm_rate_multiplier: 1.0, coinsurance_rate: 0.2, contact_deadline_basis: "BUSINESS_DAYS" }
              as: ProgramAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /tcm/navigators"
              payload: { full_name: "Nora Vance", active_episode_cap: 5, cap_policy: "COUNT" }
              as: ProgramAdmin
              captures: { nav1_id: $.data.id }
            - call: "POST /tcm/patients"
              payload: { external_mrn: "MRN-N101", full_name: "Bram Oyo", date_of_birth: "1959-02-24" }
              as: ProgramAdmin
              captures: { pat1_id: $.data.id }
            - call: "POST /tcm/referrals"
              payload: { patient_id: "${pat1_id}", facility_id: "${fac_id}", payer_id: "${payer_id}", discharge_date: "2026-05-01", discharge_datetime: "2026-05-01T14:00:00Z", discharge_disposition: "HOME", stay_type: "INPATIENT", length_of_stay_days: 4, admission_acuity: "URGENT", comorbidity_count: 5, prior_ed_visits_6mo: 2, prior_admissions_6mo: 1, social_risk_flags_count: 3 }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
          trigger:
            - call: "POST /tcm/referrals/${ref1_id}/accept"
              payload: { navigator_id: "${nav1_id}" }
              as: IntakeCoordinator
              captures: { ep1_id: $.data.created_episode_id }
            - call: "GET /tcm/episodes/${ep1_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { ep1_score: $.data.risk_score }
          assert:
            - "CareEpisode.${ep1_id}.risk_score == 44, risk_tier == HIGH, contact_sla_business_days == 2"
            - "CareEpisode.${ep1_id}.contact_deadline_at == 2026-05-05T23:59:59.999Z and visit_due_date == 2026-05-08"
            - "CareEpisode.${ep1_id}.service_period_end_date == 2026-05-30 and readmission_window_end_date == 2026-05-31"
            - "Patient.${pat1_id}.open_episode_count == 1 and lifetime_episode_count == 1"
            - "Navigator.${nav1_id}.active_episode_count == 1, workload_score == 1, availability_status == AVAILABLE"
            - "GET /tcm/risk-assessments with episode_id ${ep1_id} returns total_count 1 with is_current true and supersedes_id null"

  - section: errors
    instances:
      - name: error_episode_records_frozen_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EPISODE_RECORDS_FROZEN]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_gate_preempts_invalid_state
          rationale: "Asserted as the returned error of the named difficulty instance."
      - name: error_invalid_state_trigger
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_preempts_service_period_open
          rationale: "Asserted as the returned error of the named difficulty instance."
      - name: error_intake_window_expired_trigger
        claim_type: violation_to_error
        grounds:
