              captures: { pc: $.data.id }
            - call: "POST /authorization-forms/${pc}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs"
              payload: { name: "Cancel Camp", program_type: "CAMP", min_age: 5, max_age: 12 }
              as: ProgramDirector
              captures: { pcn: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${pcn}", title: "Cn", age_group_min: 8, age_group_max: 12, age_as_of_date: "2026-06-01", weekly_capacity: 5, base_weekly_tuition_cents: 20000 }
              as: ProgramDirector
