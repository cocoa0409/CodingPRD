      - name: advance_limit_sums_the_request_with_the_outstanding_balance
        claim_type: aggregate_validation
        grounds:
          - validations[priority=54]
          - errors[ERR_ADVANCE_LIMIT_EXCEEDED]
          - entities.Driver.fields.advance_outstanding_cents
          - entities.Advance.fields.amount_cents
        distinguishing_aspect: |
          Priority 54 is an aggregate check, not a per-request one: with 100000 already outstanding, a 60000
          FUEL_CARD request totals 160000 and is refused with HTTP 422 even though 60000 alone is far below
          ADVANCE_OUTSTANDING_LIMIT_CENTS 150000; a 50000 request lands exactly on the limit and is accepted,
          because the check is "does not exceed". A handler that compared only amount_cents to the limit accepts
          both.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z moved to 2026-08-02T09:00Z"
            - "driver DRV_LIM ACTIVE on a LEASED_OPERATOR package"
            - "CASH_ADVANCE of 100000 with installment_cents 20000 already ISSUED, so advance_outstanding_cents is 100000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
