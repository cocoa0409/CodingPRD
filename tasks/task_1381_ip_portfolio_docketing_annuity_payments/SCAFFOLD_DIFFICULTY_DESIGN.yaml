        distinguishing_aspect: |
          Entity pair (DocketEntry -> Application): the same entry operation
          record-response is accepted while the parent Application is PENDING
          and rejected with ERR_APPLICATION_NOT_OPEN once the parent advances
          to GRANTED, while the sibling operation start (status set
          {PENDING, GRANTED}) is still accepted — proving the dependency reads
          the parent's state per-transition, not a blanket gate.
