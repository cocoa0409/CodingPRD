      - name: backlog_outsourcing_trigger_fires_at_exactly_index_45
        grounds:
          - calculations.backlog_aging_index
          - endpoints[GET /lab/backlog-report]
          - entities.Case.fields.priority_class
        distinguishing_aspect: |
          A different boundary family than the capacity ceiling: OUTSOURCE_TRIGGER_INDEX is an
          inclusive FLOOR compared with >=, so one P1_STATUTORY request aged exactly 30.00 days
          yields backlog_index 45.00 with outsourcing_recommended true, while the same request
          read 864 seconds earlier yields 44.99 with outsourcing_recommended false, and the
          half-open age buckets flip from bucket_0_29_count to bucket_30_59_count at the same
          instant.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Method M1 VALIDATED, discipline CHEMISTRY."
            - "Case C1 (HOMICIDE, suspect_in_custody true, statutory_deadline_utc 2026-08-20T00:00:00Z) -> priority_class P1_STATUTORY, PRIORITY_WEIGHT 1.50."
            - "Case C1 ACCEPTED with one vault item; Request R1 QUEUED with requested_at_utc 2026-08-01T00:00:00Z; it is the only non-terminal request in the system."
            - "Hand-executed formula at as_of 2026-08-30T23:45:36Z: age 29.99 -> weighted round_half_up(29.99 * 1.50, 2) = round_half_up(44.985, 2) = 44.99 -> index 44.99 < 45.00."
            - "Hand-executed formula at as_of 2026-08-31T00:00:00Z: age 30.00 -> weighted 45.00 -> index 45.00 >= OUTSOURCE_TRIGGER_INDEX 45.00."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/methods"
              payload: { name: "GC-MS Controlled Substance Identification", discipline: "CHEMISTRY", standard_hours_per_item: 2.00, min_competency_level: 3, max_items_per_request: 10, is_consumptive: false, accreditation_scope_code: "CHEM-GCMS-01" }
              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.50, expires_at_utc: "2027-08-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "H-2026-1313", submitting_agency: "METRO PD", offense_category: "HOMICIDE", suspect_in_custody: true, statutory_deadline_utc: "2026-08-20T00:00:00Z" }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed residue swab", item_type: "CHEMICAL", seal_intact: true }
              as: EvidenceTechnician
              captures: { e1: $.data.id }
            - call: "POST /lab/cases/${c1}/accept"
              payload: {}
              as: EvidenceTechnician
            - call: "POST /lab/examination-requests"
              payload: { case_id: "${c1}", evidence_item_id: "${e1}", method_id: "${m1}", item_count: 1 }
              as: CaseManager
              captures: { r1: $.data.id }
          trigger:
            - call: "GET /lab/backlog-report"
              payload: { as_of_utc: "2026-08-30T23:45:36Z" }
              as: LabDirector
            - call: "GET /lab/backlog-report"
              payload: { as_of_utc: "2026-08-31T00:00:00Z" }
              as: LabDirector
          assert:
            - "first read: backlog_index == 44.99"
            - "first read: outsourcing_recommended == false"
            - "first read: bucket_0_29_count == 1 and bucket_30_59_count == 0"
            - "second read: backlog_index == 45.00"
            - "second read: outsourcing_recommended == true"
            - "second read: bucket_0_29_count == 0 and bucket_30_59_count == 1"
            - "both reads: open_request_count == 1 and p1_open_count == 1"
            - "both reads: bucket_60_89_count == 0 and bucket_90_plus_count == 0"
            - "Case.${c1}.priority_class == P1_STATUTORY"
            - "ExaminationRequest.${r1}.status == QUEUED"

      - name: proficiency_grade_boundaries_at_exact_pass_and_inconclusive_floors
        grounds:
          - calculations.proficiency_test_grading
          - entities.ProficiencyTest.fields.result
          - entities.ProficiencyTest.fields.score_pct
          - state_machines.ProficiencyTest.SUBMITTED_to_SCORED
          - entities.Nonconformance.fields.severity
        distinguishing_aspect: |
          A third boundary family: a two-cut-point classifier where BOTH cuts are inclusive
          floors. score_pct exactly 90.00 grades PASS, and 89.99 - one hundredth below the same
          cut - grades INCONCLUSIVE, which mints a MINOR PT_INCONCLUSIVE nonconformance that
          deliberately leaves qualification_state at QUALIFIED and consecutive_pt_failures at 0.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z for the whole chain."
            - "Analyst A1 and Analyst A2, both CHEMISTRY, competency 4, capacity 40.00, training 8.00, both QUALIFIED with consecutive_pt_failures 0."
            - "Method M1 VALIDATED, discipline CHEMISTRY."
            - "ProficiencyTest PT1 (A1, M1, cycle 2026-Q3, due 2026-09-01T00:00:00Z) SUBMITTED on time, so late_submission is false and the score decides the grade."
            - "ProficiencyTest PT2 (A2, M1, cycle 2026-Q3, due 2026-09-01T00:00:00Z) SUBMITTED on time."
            - "PT_PASS_PCT is 90.00 and PT_INCONCLUSIVE_PCT is 70.00; a MINOR finding's CAPA_SLA_DAYS is 60, so an INCONCLUSIVE result opened 2026-08-01 is due 2026-09-30T00:00:00Z."
