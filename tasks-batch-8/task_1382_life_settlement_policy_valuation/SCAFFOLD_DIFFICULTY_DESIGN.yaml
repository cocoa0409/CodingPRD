          - calculations.calc_rescission_refund
          - entities.EscrowAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: escrow cash. Invariant funded_amount_cents ==
          sum(SETTLED disbursements) + balance_cents + refund_cents holds across
          the forward action (fund: 6090000 == 0 + 6090000 + 0) and its
          compensating action (rescind: 6090000 == 0 + 0 + 6090000).
