        claim_type: Standard CRUD
        grounds: ["endpoints[GET /applications]", response_envelope.pagination_fields]
        distinguishing_aspect: "GET /applications filtered by applicant_id returns an array response_type carrying pagination fields total_count and has_more."
        test_recipe:
          setup: ["clock 2026-01-01; Attorney; US Applicant; one DRAFT application created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Examiner
            - call: "POST /attorneys"
              payload: { full_name: "A. Counsel", bar_number: "BAR-800", bar_state: "NY" }
              as: Attorney
              captures: { att_id: $.data.id }
            - call: "POST /applicants"
