        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / dq_confirm_rescore_cascade_depth4
          rationale: "Depth-4 rescore cascade asserted end-to-end in the named §1.8 instance (and relay_scratch_cascade)."

