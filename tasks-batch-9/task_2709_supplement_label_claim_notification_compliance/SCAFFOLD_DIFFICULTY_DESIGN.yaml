            - "Product.${prod_id}.lifecycle_status == MARKETED and marketing_start_date == 2026-09-10"
            - "the two due dates differ by exactly 25 days even though both windows are 30 days long"
  - rule_id: combinatorial_formula
    instances:
      - name: panel_dv_coverage_round_each_line_then_sum
        grounds:
          - calculations.percent_dv_declared
          - calculations.panel_total_dv_coverage_pct
          - entities.ProductIngredient.fields.percent_dv_declared
          - entities.LabelPanel.fields.panel_total_dv_coverage_pct
          - state_machines.LabelPanel.DRAFT_to_VALIDATED
        distinguishing_aspect: |
          Mode (b) — rounding-order sensitivity. Three ACTIVE lines each land on a raw
          12.5% of Daily Value, so the pinned order (round_half_up EACH line to a whole
          percent, THEN sum the integers) yields 13 + 13 + 13 = 39, whereas summing the
          raw ratios first and rounding the 37.5 total yields 38. The observable
          panel_total_dv_coverage_pct discriminates the two orders on one call.
        test_recipe:
          setup:
            - "Three GRANDFATHERED ingredients with RDIs 100 mg, 400 mg and 800 mg."
            - "One DRAFT product (net_quantity_g 120, servings_per_container 60) with three ACTIVE lines dosed 12.5 mg, 50 mg and 100 mg — each exactly 12.5% of its ingredient's RDI."
            - "One DRAFT STANDARD panel declaring only the always-required pediatric warning; the product has no APPROVED claim, so no disclaimer line is required."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Zinc Gluconate", ingredient_class: "MINERAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 12.5, rdi_mg: 100 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_zn_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_zn_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Riboflavin", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 50, rdi_mg: 400 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_rb_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_rb_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Pantothenic Acid", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 100, rdi_mg: 800 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_pa_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_pa_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Tri-Blend Complex", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_zn_id}", amount_per_serving_mg: 12.5, panel_position: 1 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { line_zn_id: $.data.id, line_zn_pct: $.data.percent_dv_declared }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_rb_id}", amount_per_serving_mg: 50, panel_position: 2 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { line_rb_id: $.data.id }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_pa_id}", amount_per_serving_mg: 100, panel_position: 3 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { line_pa_id: $.data.id }
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_v1: $.data.version }
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v1}", panel_format: "STANDARD", serving_size_text: "1 capsule", serving_weight_g: 2, servings_per_container_declared: 60, effective_from: "2026-09-01", effective_until: "2027-08-31", declared_warning_codes: ["PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/label-panels/${panel_id}/validate"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { coverage: $.data.panel_total_dv_coverage_pct }
          assert:
            - "ProductIngredient.${line_zn_id}.percent_dv_declared == 13 and dv_established == true"
            - "ProductIngredient.${line_rb_id}.percent_dv_declared == 13"
            - "ProductIngredient.${line_pa_id}.percent_dv_declared == 13"
            - "LabelPanel.${panel_id}.panel_total_dv_coverage_pct == 39 (round-then-sum), NOT 38 (sum-then-round)"
            - "LabelPanel.${panel_id}.panel_lines_required == 8 (4 header + 3 lines + 0 dagger + 1 warning + 0 disclaimer) and panel_lines_allowed == 24"
            - "LabelPanel.${panel_id}.panel_status == VALIDATED and required_warning_codes == [PEDIATRIC_KEEP_OUT_OF_REACH]"
      - name: risk_index_escalation_tier_selected_from_pre_surcharge_base
        grounds:
          - calculations.product_compliance_risk_index
          - calculations.product_label_posture
          - entities.Product.fields.compliance_risk_index
          - state_machines.AdverseEventReport.RECEIVED_to_TRIAGED_SERIOUS
          - state_machines.AdverseEventReport.RECEIVED_to_TRIAGED_NONSERIOUS
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order. Two serious plus one non-serious adverse event
          give base = 10 + 20*2 + 6*1 = 56, and the escalation tier MUST be selected from
          that pre-surcharge base (30 <= 56 < 60 -> +5 -> index 61). Selecting the tier from
          the post-surcharge total instead (61 >= 60 -> +12) yields 68 and, at the next
          event, a different posture; the single observable compliance_risk_index separates
          the two orders.
        test_recipe:
          setup:
            - "One DRAFT product with no lines, no claims and no panels, so nothing but adverse events moves its risk index."
            - "Three RECEIVED adverse event reports on it, received_date 2026-08-03: two carrying serious outcome codes (HOSPITALIZATION, DEATH) and one carrying only RASH."
            - "Logical clock still at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Immune Boost", net_quantity_g: 60, servings_per_container: 30 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "CONSUMER", received_date: "2026-08-03", narrative: "Hospitalized after three days of use", outcome_codes: ["HOSPITALIZATION"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer1_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "HEALTHCARE_PROFESSIONAL", received_date: "2026-08-03", narrative: "Fatal outcome reported by treating physician", outcome_codes: ["DEATH"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer2_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "CONSUMER", received_date: "2026-08-03", narrative: "Transient rash, resolved without treatment", outcome_codes: ["RASH"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer3_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/adverse-event-reports/${aer1_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "POST /supplement-compliance/adverse-event-reports/${aer2_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "POST /supplement-compliance/adverse-event-reports/${aer3_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
          assert:
            - "after the first triage: Product.${prod_id}.compliance_risk_index == 35 (base 30 -> tier +5)"
            - "after the second triage: Product.${prod_id}.compliance_risk_index == 55 (base 50 -> tier +5)"
