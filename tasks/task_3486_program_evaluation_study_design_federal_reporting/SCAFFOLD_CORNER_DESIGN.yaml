    instances:
      - name: occ_stale_study_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[design-plan-create-stale-study]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A design-plan create carrying the pre-supersede Study.version is rejected 412; carrying the current version succeeds."
        test_recipe:
          setup: ["Study at version 2 after one design plan was created (plan1)"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id, study_v1: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v1}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan1: $.data.id }
            - call: "GET /evaluation/studies/${study_id}"
              as: PrincipalInvestigator
              captures: { study_v2: $.data.version }
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "QED_DID", mde: 0.5, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v2}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { plan2: $.data.id }
          trigger:
            - call: "POST /evaluation/studies/${study_id}/design-plans"
              payload: { design_type: "RCT", mde: 0.3, cluster_size: 10, icc: 0.05, attrition_rate: 0.15, expected_study_version: "${study_v2}" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION and http status 412 (study version advanced to 3 by the plan2 create)"
            - "DesignPlan.${plan1}.status == SUPERSEDED; DesignPlan.${plan2}.status == DRAFT; the study has exactly 2 design plans"

