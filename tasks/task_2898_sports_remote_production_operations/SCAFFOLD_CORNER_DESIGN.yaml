            - "Both survey triggers return HTTP 409 with error_id == ERR_SURVEY_STATE_INVALID; VenueSurvey.${s1_id}.status is still SUPERSEDED"
            - "CrewCall.${call1_id}.status == DECLINED with provisional_total_cents released - Production.${prod_id}.labor_committed_cents == 0 and labor_available_cents == 2000000"
            - "Both crew-call triggers return HTTP 409 with error_id == ERR_CREW_CALL_STATE_INVALID; CrewCall.${call1_id}.status is still DECLINED"
            - "Production.${prod_id}.status == PLANNED (the supersede reverted the SURVEYED stage before these triggers ran)"

      - name: new_survey_supersedes_approved_survey_and_reverts_production_to_planned
        claim_type: cross_entity_side_effect
        grounds:
          - state_machines.VenueSurvey[APPROVED -> SUPERSEDED]
          - state_machines.Production[SURVEYED -> PLANNED]
          - endpoints[POST /broadcast-ops/venue-surveys]
        distinguishing_aspect: |
          Creating a replacement survey is a write to a *different* row that must nevertheless mutate
          two others: the previously APPROVED survey becomes SUPERSEDED and the production falls from
          SURVEYED back to PLANNED, dropping its 40-point survey component. The replacement itself
          starts at revision 1 - the counter belongs to the row, not to the production - and priority
          28 does not fire because the superseded survey is no longer open.
        test_recipe:
          setup:
            - "One TIER_3 production whose first survey (one 150 ft position) has been APPROVED, leaving the production SURVEYED."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { s1_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${s1_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${s1_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${s1_id}/review"
              payload: { decision: "APPROVE", notes: "plot accepted" }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { s1_status: $.data.status, reviewer: $.data.reviewed_by_user_id }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "K. Ozawa", fiber_drops_required: 4 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { s2_id: $.data.id, s2_rev: $.data.revision, s2_status: $.data.status }
          assert:
            - "Before the trigger: VenueSurvey.${s1_id}.status == APPROVED, reviewed_by_user_id == lo-001, Production.${prod_id}.status == SURVEYED, readiness_score_preflight == 40.00"
            - "After the trigger: VenueSurvey.${s1_id}.status == SUPERSEDED"
            - "VenueSurvey.${s2_id}.status == DRAFT, revision == 1, camera_position_count == 0, submitted_by_user_id == null, reviewed_by_user_id == null"
            - "Production.${prod_id}.status == PLANNED and readiness_score_preflight == 0.00 and readiness_score_certified == 0.00"
            - "GET /broadcast-ops/productions/${prod_id}/venue-surveys returns total_count == 2, and with status=SUPERSEDED exactly 1 row whose id == ${s1_id}"

      - name: rehearsal_aborted_outcome_leaves_production_stage_untouched
        claim_type: side_effect_execution
        grounds:
          - state_machines.Rehearsal[SCHEDULED -> ABORTED]
          - endpoints[POST /broadcast-ops/rehearsals/{id}/outcome]
          - calculations.production_readiness_score
        distinguishing_aspect: |
          The two outcomes of the same endpoint must diverge in their side effects: ABORTED writes the
          rehearsal terminal state and nothing else - the production stays PROVISIONED with certified
          readiness 85.00 - while COMPLETED would have promoted it to REHEARSED. An ABORTED outcome
          also skips the priority-38 signoff gate entirely, so it succeeds with no signoff fields.
        test_recipe:
          setup:
            - |
              Canonical PROVISIONED chain (referenced by later instances as "the canonical PROVISIONED
              chain"): one TIER_3 production with an APPROVED single-position survey, an assigned
              TIER_3 truck, a CONFIRMED PRIMARY fiber booking and one VALIDATED GRAPHICS prep, and no
              crew calls at all - so provisioning_conditions hold and readiness_score_certified is
              40 + 25 + 20 + 0 == 85.00.
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_3", camera_channel_capacity: 4, power_draw_amps: 60, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-01", path_type: "FIBER", carrier_code: "LUMEN", capacity_mbps: 300, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-09-01T00:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "APPROVE" }
              as: LeagueOperations
              as_user_id: "lo-001"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv_a: $.data.version }
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pv_a}" }
              as: ProductionManager
              as_user_id: "pm-001"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pv_b: $.data.version }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T12:00:00Z", window_end_utc: "2026-08-16T02:00:00Z", requested_mbps: 200, expected_production_version: "${pv_b}" }
              as: TechnicalDirector
