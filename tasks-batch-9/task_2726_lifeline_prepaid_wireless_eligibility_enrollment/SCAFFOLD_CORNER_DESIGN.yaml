            - "${e_addr} == ERR_ADDRESS_NOT_FOUND"
            - "${e_chk} == ERR_ELIGIBILITY_CHECK_NOT_FOUND"
            - "${e_dev} == ERR_DEVICE_NOT_FOUND"
            - "${e_xfer} == ERR_SERVICE_TRANSFER_NOT_FOUND"
            - "${e_claim} == ERR_CLAIM_NOT_FOUND"
            - "${e_sample} == ERR_AUDIT_SAMPLE_NOT_FOUND"
            - "${e_case} == ERR_CASE_NOT_FOUND"
            - "each error body carries the meta envelope and a data object of exactly error_id and message"

      - name: wrong_state_actions_are_rejected_on_checks_addresses_and_handsets
