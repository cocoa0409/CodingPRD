            - call: "POST /programs/${prog_id}/close"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the second award is 201 — it passes the priority 52 hard-ceiling check (136552000 <= 140000000) — yet ApparatusProgram.${prog_id}.status == \"SUSPENDED\" with suspension_reason == \"SOFT_CEILING_BREACH\" in the same request, because 136552000 > 126000000"
            - "${e_soft} == ERR_SOFT_CEILING_STILL_BREACHED with HTTP 409 and the program stays SUSPENDED"
            - "${e_close_state} == ERR_INVALID_PROGRAM_STATE with HTTP 409 — close is only defined from ACTIVE, and the priority 9 state check outranks the priority 50 terminal-units check"
