            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-10", axle_count: 5, gross_weight_lbs: 87000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening2_id: "$.data.id" } }
