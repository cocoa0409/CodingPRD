scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_project_returns_all_fields_and_provisional_budget
        claim_type: Creation
        grounds:
          - entities.CapitalProject.fields.art_budget_cents
          - entities.CapitalProject.fields.status
        distinguishing_aspect: "POST /projects returns 201 with a server-minted id, status=DRAFT, committed_cents=0, and provisional art_budget_cents=1000000 (100000000*0.01)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Depot Park", construction_budget_cents: 100000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          assert:
            - "CapitalProject.${proj_id}.status == DRAFT"
            - "CapitalProject.${proj_id}.committed_cents == 0"
            - "CapitalProject.${proj_id}.art_budget_cents == 1000000"

      - name: default_percent_rate_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.CapitalProject.fields.percent_rate
          - calculations.art_budget_computation
        distinguishing_aspect: "Omitting percent_rate applies DEFAULT_PERCENT_RATE=0.01, so art_budget_cents=1000000 for construction_budget_cents=100000000."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Default Park", construction_budget_cents: 100000000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
          assert:
            - "CapitalProject.${proj_id}.percent_rate == 0.01"
            - "CapitalProject.${proj_id}.art_budget_cents == 1000000"

      - name: get_project_nonexistent_returns_not_found
        claim_type: "Not Found"
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
        distinguishing_aspect: "GET /projects/{unknown-uuid} returns ERR_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_PROJECT_NOT_FOUND"
            - "trigger[0] response http_status == 404"

      - name: site_create_missing_required_address_returns_validation
        claim_type: "Required Fields"
        grounds:
          - entities.Site.fields.address
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /sites without the required address field returns ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Nameless" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_VALIDATION"

      - name: weighted_value_computed_on_score_create
        claim_type: "Computed Fields"
        grounds:
          - entities.Score.fields.weighted_value
          - calculations.submission_composite_score
        distinguishing_aspect: "A score of (80,70,60,50) yields weighted_value = 0.40*80+0.25*70+0.20*60+0.15*50 = 69.0 at Score create."
        test_recipe:
          setup:
            - "A certified project, commission, OPEN call, artist with one SUBMITTED submission, and one non-recused panelist."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Scorepark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Piece", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Jo Neh", email: "jo@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 800000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 70, community_impact: 60, durability: 50 }
              as: Panelist
              as_user_id: "${pan1}"
              captures: { score_id: $.data.id }
          assert:
            - "Score.${score_id}.weighted_value == 69.0"

      - name: invalid_call_type_enum_rejected
        claim_type: "Type Constraints"
        grounds:
          - entities.ArtistCall.fields.call_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /commissions/{id}/calls with call_type='BID' (not RFQ/RFP) returns ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "A certified project with one commission."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Enumpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Piece", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "BID", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_VALIDATION"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: initial_commission_status_is_open
        claim_type: initial_state
        grounds:
          - state_machines.Commission.initial_state
          - entities.Commission.fields.status
        distinguishing_aspect: "A freshly created commission has status=OPEN."
        test_recipe:
          setup:
            - "A certified project."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Initpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Fresh", allocation_cents: 500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
          assert:
            - "Commission.${comm_id}.status == OPEN"

      - name: close_call_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ArtistCall.OPEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing an already-CLOSED call returns ERR_INVALID_STATE (409); no further mutation."
        test_recipe:
          setup:
            - "A certified project, commission, and a CLOSED call."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Closepark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFQ", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_INVALID_STATE"
            - "ArtistCall.${call_id}.status == CLOSED"

      - name: double_certify_project_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.CapitalProject.DRAFT_to_BUDGET_CERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Certifying an already BUDGET_CERTIFIED project returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A BUDGET_CERTIFIED project."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Twice", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 190000000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: milestone_rounding_covered_by_difficulty
        claim_type: "Correct Result"
        grounds:
          - calculations.milestone_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / milestone_rounding_order_remainder
          rationale: "The pinned round-per-line-then-remainder result is asserted in the named §1.8 instance."

      - name: art_budget_dual_variant_covered_by_difficulty
        claim_type: "Variant Divergence"
        grounds:
          - calculations.art_budget_computation
        excluded_because:
          difficulty_instance: dual_variant_calc / art_budget_provisional_vs_final_on_project
          rationale: "Provisional vs final divergence asserted in the named §1.8 instance."

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: recused_panelist_cannot_score
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - entities.Panelist.fields.recused
          - errors[ERR_PANELIST_CONFLICT]
        distinguishing_aspect: "A panelist created with has_conflict=true (recused) scoring a submission returns ERR_PANELIST_CONFLICT (422)."
        test_recipe:
          setup:
            - "A certified project, commission, OPEN call, artist with one SUBMITTED submission, and one recused panelist (has_conflict=true)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Coipark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Kev Ona", email: "kev@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "Conflicted", has_conflict: true }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 800000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan1}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_PANELIST_CONFLICT"

      - name: duplicate_score_by_panelist_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=62]
          - errors[ERR_DUPLICATE_SCORE]
        distinguishing_aspect: "A panelist submitting a second score for the same submission returns ERR_DUPLICATE_SCORE (409)."
        test_recipe:
          setup:
            - "A certified project, commission, OPEN call, artist with one SUBMITTED submission, and a non-recused panelist who has already scored it once."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Duppark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Lia Sun", email: "lia@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 800000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 70, feasibility: 70, community_impact: 70, durability: 70 }
              as: Panelist
              as_user_id: "${pan1}"
          trigger:
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 90, feasibility: 90, community_impact: 90, durability: 90 }
              as: Panelist
              as_user_id: "${pan1}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_DUPLICATE_SCORE"

      - name: intake_commission_type_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=82]
          - errors[ERR_DONATION_TYPE_REQUIRED]
        distinguishing_aspect: "POST /artworks with acquisition_type=COMMISSION returns ERR_DONATION_TYPE_REQUIRED (422); COMMISSION artworks come only from contract activation."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /artworks"
              payload: { title: "Sneaky", acquisition_type: "COMMISSION" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_DONATION_TYPE_REQUIRED"

      - name: deaccession_blocked_by_approved_loan
        claim_type: violation_to_error
        grounds:
          - validations[priority=52]
          - errors[ERR_DEACCESSION_BLOCKED_BY_LOAN]
        distinguishing_aspect: "Deaccessioning an artwork with an APPROVED loan returns ERR_DEACCESSION_BLOCKED_BY_LOAN (409)."
        test_recipe:
          setup:
            - "A DONATION artwork with an APPROVED loan."
          setup_api_calls:
            - call: "POST /artworks"
              payload: { title: "OnLoan", acquisition_type: "DONATION", appraised_value_cents: 400000 }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/loans"
              payload: { borrower_name: "Gallery Z", loan_start: "2026-04-01T00:00:00Z", loan_end: "2026-04-20T00:00:00Z" }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/approve"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /artworks/${art_id}/deaccession"
              payload: { deaccession_method: "SALE" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_DEACCESSION_BLOCKED_BY_LOAN"
            - "Artwork.${art_id}.location_status == FABRICATED"

      - name: contract_amount_exceeds_allocation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=92]
          - errors[ERR_CONTRACT_EXCEEDS_ALLOCATION]
        distinguishing_aspect: "Creating a contract with contract_amount_cents (600000) above the commission allocation (500000) returns ERR_CONTRACT_EXCEEDS_ALLOCATION (422)."
        test_recipe:
          setup:
            - "An AWARDED commission (allocation 500000) with its awarded submission."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Overpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFQ", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Mo Iris", email: "mo@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 450000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/award"
              payload: { submission_id: "${sub_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /commissions/${comm_id}/contracts"
              payload: { submission_id: "${sub_id}", contract_amount_cents: 600000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_CONTRACT_EXCEEDS_ALLOCATION"

      - name: submission_after_deadline_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=70]
          - errors[ERR_DEADLINE_PASSED]
        distinguishing_aspect: "A first submission attempted after the clock passes the deadline returns ERR_DEADLINE_PASSED (422)."
        test_recipe:
          setup:
            - "A certified project, commission, OPEN call (deadline 2026-06-01), an artist, and the clock advanced to 2026-06-02."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Latepark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Nia Fox", email: "nia@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 700000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_DEADLINE_PASSED"

      - name: milestone_pct_sum_not_one_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - errors[ERR_MILESTONE_PCT_SUM]
        distinguishing_aspect: "Scheduling milestones whose pct values sum to 0.9 (not 1.0) returns ERR_MILESTONE_PCT_SUM (422)."
        test_recipe:
          setup:
            - "A contracted commission with a DRAFT contract (contract_amount 1000000) ready for milestone scheduling."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Pctpark", construction_budget_cents: 400000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 400000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "C", allocation_cents: 1000000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFQ", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
