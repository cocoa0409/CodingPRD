            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-parts"
              payload: { sku: "CP5", name: "Pad5", wholesale_cost_cents: 4000 }
