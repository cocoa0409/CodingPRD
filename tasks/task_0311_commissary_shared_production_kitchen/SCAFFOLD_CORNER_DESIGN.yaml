        claim_type: peer_roles
        grounds: [roles.MemberOperator, roles.FacilityManager, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "MemberOperator (peer role) calling POST /stations (FacilityManager-exclusive) → ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Member m_rb ACTIVE"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Rb", email: "rb@x.com" }
              as: Anonymous
              captures: { mrb: $.data.id }
          trigger:
            - call: "POST /stations"
              payload: { name: "Sneaky", station_class: "PREP_TABLE" }
              as: MemberOperator
              as_user_id: "${mrb}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: member_cannot_act_on_other_members_booking
        claim_type: peer_roles
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_NOT_OWNER]"]
        distinguishing_aspect: "MemberOperator m_a cancelling a Booking owned by m_b (X-User-ID mismatches the booking's member_id) → ERR_FORBIDDEN_NOT_OWNER (403)."
        test_recipe:
          setup: ["Member m_a and m_b ACTIVE wallet 100000; m_b owns a CONFIRMED booking"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Ma", email: "ma@x.com" }
              as: Anonymous
              captures: { ma: $.data.id }
            - call: "POST /members/register"
              payload: { business_name: "Mb", email: "mb@x.com" }
              as: Anonymous
              captures: { mb: $.data.id }
            - call: "POST /members/${mb}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${mb}"
              captures: { mbv: $.data.version }
            - call: "POST /stations"
              payload: { name: "PrepAB", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { stab: $.data.id }
            - call: "POST /members/${mb}/bookings"
              payload: { station_id: "${stab}", start_utc: "2026-07-20T12:00:00.000Z", end_utc: "2026-07-20T13:00:00.000Z", expected_member_version: "${mbv}" }
              as: MemberOperator
              as_user_id: "${mb}"
              captures: { bab: $.data.id }
          trigger:
            - call: "POST /members/${mb}/bookings/${bab}/cancel"
              payload: {}
              as: MemberOperator
              as_user_id: "${ma}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_NOT_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A protected GET /members with no auth role declared is rejected ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401 or response.status == 403"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: booking_create_stale_member_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential booking creates: the first advances Member.version; the second still carrying the now-stale prior version (${mscv2} - 1, one behind the value GET reports after the first booking) → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Member m_sc ACTIVE wallet 100000; one booking already CONFIRMED which advanced Member.version"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Sc", email: "sc@x.com" }
              as: Anonymous
              captures: { msc: $.data.id }
            - call: "POST /members/${msc}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${msc}"
              captures: { mscv: $.data.version }
            - call: "POST /stations"
              payload: { name: "PrepSc", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { stsc: $.data.id }
            - call: "POST /members/${msc}/bookings"
              payload: { station_id: "${stsc}", start_utc: "2026-07-21T12:00:00.000Z", end_utc: "2026-07-21T13:00:00.000Z", expected_member_version: "${mscv}" }
              as: MemberOperator
              as_user_id: "${msc}"
              captures: { bsc1: $.data.id }
            - call: "GET /members/${msc}"
              payload: {}
              as: MemberOperator
              as_user_id: "${msc}"
              captures: { mscv2: $.data.version }
          trigger:
            - call: "POST /members/${msc}/bookings"
              payload: { station_id: "${stsc}", start_utc: "2026-07-21T15:00:00.000Z", end_utc: "2026-07-21T16:00:00.000Z", expected_member_version: "${mscv2} - 1" }
              as: MemberOperator
              as_user_id: "${msc}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: storage_assign_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[storage-assign-stale-member]", entities.Member.fields.version]
        distinguishing_aspect: "StorageAssignment create with the current expected_member_version succeeds (201) and Member.version increments by 1 (observable via the response)."
        test_recipe:
          setup: ["Member m_ok ACTIVE; one DRY unit 10 slots"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Ok", email: "ok@x.com" }
              as: Anonymous
              captures: { mok: $.data.id, mokv: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "DryOk", temp_class: "DRY", total_slots: 10, temp_min_c: 10.0, temp_max_c: 25.0 }
              as: FacilityManager
              captures: { dok: $.data.id }
          trigger:
            - call: "POST /members/${mok}/storage-assignments"
              payload: { temp_class: "DRY", requested_slots: 3, expected_member_version: "${mokv}" }
              as: MemberOperator
              as_user_id: "${mok}"
              captures: { saok: $.data.id }
            - call: "GET /members/${mok}"
              payload: {}
              as: MemberOperator
              as_user_id: "${mok}"
              captures: { vnow: $.data.version }
          assert:
            - "StorageAssignment.${saok}.status == ACTIVE"
            - "Member.${mok}.version == 2"

      - name: ingredient_cost_reconciled_after_order_receipt
        claim_type: derived_field_reconciliation
        grounds: [state_machines.IngredientOrder.PLACED_to_RECEIVED, entities.Ingredient.fields.unit_cost_cents, entities.Ingredient.fields.on_hand_qty]
        distinguishing_aspect: "Ingredient unit_cost_cents and on_hand_qty are derived/reconciled on order receipt: after receiving order qty 25 at cost 175, both reflect the new values (cost 175, on_hand 25)."
        test_recipe:
          setup: ["Member m_dr ACTIVE; ingredient cost 100 on_hand 0; order placed qty 25 at cost 175"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Dr", email: "dr@x.com" }
              as: Anonymous
              captures: { mdr: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "DrIng", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { idr: $.data.id }
            - call: "POST /members/${mdr}/ingredient-orders"
              payload: { ingredient_id: "${idr}", order_qty: 25, unit_cost_cents: 175 }
              as: MemberOperator
              as_user_id: "${mdr}"
              captures: { odr: $.data.id }
          trigger:
            - call: "POST /members/${mdr}/ingredient-orders/${odr}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${mdr}"
          assert:
            - "Ingredient.${idr}.on_hand_qty == 25"
            - "Ingredient.${idr}.unit_cost_cents == 175"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: booking_charge_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.Booking.none_to_CONFIRMED, entities.Member.fields.wallet_balance_cents]
        distinguishing_aspect: "Immediate consistency: after a booking create, GET /members/{id} in the next call already shows wallet_balance_cents debited by 2400 (98000 - 2400 path: top-up 100000 then book → 97600)."
        test_recipe:
          setup: ["Member m_cm ACTIVE wallet topped 100000; OPEN PREP_TABLE"]
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "Cm", email: "cm@x.com" }
              as: Anonymous
              captures: { mcm: $.data.id }
            - call: "POST /members/${mcm}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${mcm}"
              captures: { mcmv: $.data.version }
            - call: "POST /stations"
              payload: { name: "PrepCm", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { stcm: $.data.id }
            - call: "POST /members/${mcm}/bookings"
              payload: { station_id: "${stcm}", start_utc: "2026-07-22T12:00:00.000Z", end_utc: "2026-07-22T14:00:00.000Z", expected_member_version: "${mcmv}" }
              as: MemberOperator
              as_user_id: "${mcm}"
              captures: { bcm: $.data.id }
          trigger:
            - call: "GET /members/${mcm}"
              payload: {}
              as: MemberOperator
              as_user_id: "${mcm}"
              captures: { bal: $.data.wallet_balance_cents }
          assert:
            - "Member.${mcm}.wallet_balance_cents == 97600"
