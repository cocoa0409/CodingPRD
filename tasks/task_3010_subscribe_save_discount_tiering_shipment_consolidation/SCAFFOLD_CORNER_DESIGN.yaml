      - name: retention_offer_lazy_expiry_cancels_subscription
        claim_type: scheduled_actions
        grounds:
          - state_machines.RetentionOffer.OFFERED_to_EXPIRED
          - entities.RetentionOffer.fields.expires_on
        distinguishing_aspect: "Cancel on 2026-09-01 sets expires_on 2026-09-08; after the clock moves to 2026-09-09 the next read lazily expires the offer, cancels the subscription, and emits OFFER_EXPIRED — a deferred action with no explicit cancel call."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Customer, stocked priced product, one subscription cancelled into PENDING_CANCEL."]
          setup_api_calls:
            - *k_clock
            - &ko2_cust
