      - name: replacement_credit_moves_the_ledger_from_triggered_back_to_monitoring
        claim_type: reconciliation
        grounds:
          - "calculations.deal_attrition_ledger"
          - "state_machines.ServiceAccount[LOST -> REPLACED]"
          - "endpoints[POST /service-accounts/{id}/replace]"
          - "entities.Deal.fields.net_attrition_mrr_cents"
          - "entities.EscrowAccount.fields.holdback_release_blocked"
        distinguishing_aspect: "The ledger is recomputed from scratch on every write, so a replacement can UNDO a clawback trigger: a 2000 cancellation on a 32000 guarantee breaches the 1600 allowance and blocks the holdback, then a 2000 replacement whose credit is capped at 50% of the loss (1000) brings net attrition to 1000 <= 1600 and restores both clawback_status MONITORING and the escrow's scheduled release date. The capped credit is what makes the reversal arithmetic non-obvious."
