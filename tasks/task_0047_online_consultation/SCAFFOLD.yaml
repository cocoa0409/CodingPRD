scenario: |
  Online consultation and triage system: AI symptom pre-screening and triage with symptom-checker
  questionnaire, structured symptom collection, severity assessment, department recommendation, and
  emergency-case routing to offline emergency channel; department matching with department-and-disease
  mapping, regional medical-resource availability, doctor-specialty filtering, and patient-preference
  (hospital/doctor) consideration; doctor scheduling and consultation acceptance with doctor schedule
  configuration, online consultation slots, real-time/appointment hybrid modes, queue management, and
  consultation acceptance/transfer rules; text-image and video consultation with text-image session,
  image upload (medical reports/affected area photos), video session quality control, session duration
  management, and session record archiving; prescription routing with online-prescription eligibility
  (return-visit only/specific disease scope), prescription drafting, pharmacist re-review, prescription
  dispatch to designated pharmacy or e-commerce, and dispensing status tracking; follow-up reminder
  with follow-up plan configuration, multi-channel reminder, follow-up form filling, abnormal-feedback
  escalation, and follow-up record archiving; medical insurance settlement with insurance-eligibility
  verification, online-consultation reimbursement scope, real-time settlement with insurance bureau,
  self-pay-portion collection, and reimbursement record archiving; event-driven synchronization with
  payment, electronic prescription circulation platform, pharmacy, and medical insurance bureau;
  audit logging for consultation records and prescription handling.

domain_name: "online-consultation"
api_prefix: "/consultation"

complexity_profile:
  primary_archetype: "Workflow orchestration"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Selector policy"
    - "Cascading side effects"
    - "Conditional feature flags"
    - "Scheduled / deferred actions"
  entity_topology: "hybrid"   # patient/doctor/department are flat peer entities; consultation -> prescription -> insurance form a hierarchy
  state_machine_shape: "branching"
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: "segregation_of_duties"
  consistency_model: "saga"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD)."
      - name: region_code
        type: string
        source: input
        description: "Administrative region code used for medical-resource regional gating."
        constraints: "Must be one of a server-known region enum."
      - name: insurance_policy_no
        type: string
        source: input
        description: "Public-insurance policy number; null means uninsured."
        default: null
      - name: insurance_status
        type: enum
        source: computed
        description: "Latest cached eligibility result."
        constraints: "Enum: UNKNOWN, ELIGIBLE, INELIGIBLE, SUSPENDED"
        default: "UNKNOWN"
      - name: preferred_hospital_id
        type: string
        source: input
        description: "Optional patient preference; used as the highest-ranked tie-break in doctor matching when supplied."
        default: null
      - name: preferred_doctor_id
        type: string
        source: input
        description: "Optional patient preference; pins matching to a specific doctor when supplied and that doctor is eligible."
        default: null
      - name: chronic_condition_codes
        type: array
        source: input
        description: "ICD-style codes used for return-visit eligibility on prescriptions."
        default: []

  - name: Doctor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Doctor name."
      - name: hospital_id
        type: string
        source: input
        description: "Hospital the doctor belongs to."
      - name: department_code
        type: string
        source: input
        description: "Primary department code (must exist in DepartmentMapping)."
      - name: specialty_codes
        type: array
        source: input
        description: "Sub-specialty codes for disease-level filtering."
        default: []
      - name: licensed_region_codes
        type: array
        source: input
        description: "Regions in which this doctor may serve patients (regional medical-resource gating)."
        default: []
      - name: status
        type: enum
        source: input
        description: "Doctor availability flag."
        constraints: "Enum: AVAILABLE, BUSY, OFF_DUTY, SUSPENDED"
        default: "AVAILABLE"
      - name: max_concurrent_sessions
        type: integer
        source: input
        description: "Hard cap on simultaneously OPEN consultation sessions; default 1."
        default: 1
      - name: rating_score
        type: number
        source: input
        description: "0.00–5.00, used as ranking key in doctor matching."
        default: 0.00

  - name: DepartmentMapping
    parent: null
    common_fields: false
    fields:
      - name: department_code
        type: string
        source: input
        description: "Department identifier (e.g., CARDIO, DERM)."
      - name: disease_codes
        type: array
        source: input
        description: "Disease codes routed to this department."
      - name: triage_priority
        type: integer
        source: input
        description: "Tie-break priority when multiple departments cover the same disease; lower number wins."

  - name: TriageSession
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "Foreign key to Patient.id."
      - name: questionnaire_responses
        type: array
        source: input
        description: "Array of {question_code, answer_value, severity_weight} objects collected by the symptom checker."
      - name: chief_complaint_score
        type: integer
        source: computed
        description: "Sum of severity_weight across questionnaire_responses, multiplied by CHIEF_COMPLAINT_FACTOR."
        default: 0
      - name: vital_anomaly_score
        type: integer
        source: computed
        description: "Computed from declared vital_signs anomaly count multiplied by VITAL_ANOMALY_FACTOR."
        default: 0
      - name: risk_factor_score
        type: integer
        source: computed
        description: "Risk-modifier score derived from declared chronic_condition_codes intersection with RISK_TABLE multiplied by RISK_FACTOR."
        default: 0
      - name: severity_score
        type: integer
        source: computed
        description: "Final severity score = chief_complaint_score + vital_anomaly_score + risk_factor_score (see calculations.triage_severity_score)."
        default: 0
      - name: severity_band
        type: enum
        source: computed
        description: "LOW (<30), MID (30..<60), HIGH (60..<90), EMERGENCY (>=90)."
        constraints: "Enum: LOW, MID, HIGH, EMERGENCY"
        default: "LOW"
      - name: recommended_department_code
        type: string
        source: computed
        description: "Selected via department-matching selector policy; null when severity_band == EMERGENCY (routed offline)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Triage lifecycle status."
        constraints: "Enum: COLLECTING, ASSESSED, EMERGENCY_ROUTED, MATCHED, CLOSED"
        default: "COLLECTING"
      - name: emergency_routing_ticket
        type: string
        source: computed
        description: "Opaque ticket id emitted to offline channel when EMERGENCY band is detected."
        default: null

  - name: Consultation
    parent: TriageSession
    common_fields: true
    fields:
      - name: triage_session_id
        type: string
        source: input
        description: "Foreign key to TriageSession.id."
      - name: patient_id
        type: string
        source: input
        description: "Denormalized for query convenience; must equal TriageSession.patient_id."
      - name: doctor_id
        type: string
        source: computed
        description: "Doctor selected by department matching or by patient_preferred_doctor_id."
      - name: mode
        type: enum
        source: input
        description: "Hybrid mode: REAL_TIME (queue-based) vs APPOINTMENT (slot-based)."
        constraints: "Enum: REAL_TIME, APPOINTMENT"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Required when mode=APPOINTMENT; null for REAL_TIME."
        default: null
      - name: queue_position
        type: integer
        source: computed
        description: "1-based position for REAL_TIME mode."
        default: null
      - name: media_type
        type: enum
        source: input
        description: "TEXT_IMAGE or VIDEO."
        constraints: "Enum: TEXT_IMAGE, VIDEO"
      - name: session_status
        type: enum
        source: computed
        description: "Independent state dimension — see state_machine."
        constraints: "Enum: PENDING, QUEUED, ACCEPTED, IN_PROGRESS, COMPLETED, TRANSFERRED, CANCELLED"
        default: "PENDING"
      - name: quality_status
        type: enum
        source: computed
        description: "Independent state dimension for video quality; parallel to session_status."
        constraints: "Enum: NOT_APPLICABLE, OK, DEGRADED, FAILED"
        default: "NOT_APPLICABLE"
      - name: started_at
        type: datetime
        source: computed
        description: "Set when session_status -> IN_PROGRESS."
        default: null
      - name: ended_at
        type: datetime
        source: computed
        description: "Set when session_status -> COMPLETED or TRANSFERRED."
        default: null
      - name: duration_minutes
        type: number
        source: computed
        description: "(ended_at - started_at) in minutes, rounded up to next whole minute (ceil) for billing."
        default: 0
      - name: image_attachment_ids
        type: array
        source: input
        description: "Ids of uploaded image attachments (medical reports / affected area photos)."
        default: []
      - name: transcript_archive_id
        type: string
        source: computed
        description: "Set when session_status -> COMPLETED; references the archived session record."
        default: null
      - name: base_fee
        type: number
        source: computed
        description: "Doctor-level base consultation fee at acceptance time (snapshot)."
        default: 0
      - name: total_fee
        type: number
        source: computed
        description: "Final patient-billable amount (see calculations.consultation_fee). Set when session_status -> COMPLETED."
        default: 0
      - name: transfer_to_doctor_id
        type: string
        source: computed
        description: "Set when session_status -> TRANSFERRED. Points to the new doctor's freshly created Consultation."
        default: null

  - name: Prescription
    parent: Consultation
    common_fields: true
    fields:
      - name: consultation_id
        type: string
        source: input
        description: "Foreign key to Consultation.id."
      - name: patient_id
        type: string
        source: input
        description: "Denormalized; must equal Consultation.patient_id."
      - name: drafting_doctor_id
        type: string
        source: input
        description: "Doctor who drafted the prescription."
      - name: reviewing_pharmacist_id
        type: string
        source: computed
        description: "Pharmacist who approved/rejected; segregation-of-duties: must differ from drafting_doctor_id."
        default: null
      - name: disease_codes
        type: array
        source: input
        description: "Disease codes the drugs target; used for online-prescription scope eligibility."
      - name: items
        type: array
        source: input
        description: "Array of {drug_code, quantity, unit_price_cents, dosage_text}."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Sum over items of (unit_price_cents * quantity)."
        default: 0
      - name: eligibility_flag
        type: enum
        source: computed
        description: "ELIGIBLE iff (return-visit AND disease in PRESCRIPTION_ALLOWED_DISEASES) OR consultation.mode==APPOINTMENT-with-prior-history."
        constraints: "Enum: ELIGIBLE, INELIGIBLE"
        default: "INELIGIBLE"
      - name: status
        type: enum
        source: computed
        description: "Prescription lifecycle status."
        constraints: "Enum: DRAFT, UNDER_REVIEW, APPROVED, REJECTED, DISPATCHED, DISPENSED, FAILED"
        default: "DRAFT"
      - name: rejection_reason
        type: string
        source: computed
        description: "Set when pharmacist rejects; cleared on revision."
        default: null
      - name: dispatch_target_kind
        type: enum
        source: input
        description: "PHARMACY (designated pharmacy) or ECOMMERCE (e-commerce pharmacy)."
        constraints: "Enum: PHARMACY, ECOMMERCE"
        default: "PHARMACY"
      - name: dispatch_target_id
        type: string
        source: input
        description: "Id of the chosen pharmacy / e-commerce vendor."
        default: null
      - name: dispensing_status
        type: enum
        source: computed
        description: "Independent sub-status tracked while status=DISPATCHED."
        constraints: "Enum: NONE, RECEIVED, PREPARING, READY, DELIVERED, FAILED"
        default: "NONE"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times status cycled UNDER_REVIEW -> REJECTED -> DRAFT (revision loop)."
        default: 0

  - name: InsuranceClaim
    parent: Consultation
    common_fields: true
    fields:
      - name: consultation_id
        type: string
        source: input
        description: "Foreign key to Consultation.id."
      - name: prescription_id
        type: string
        source: input
        description: "Foreign key to Prescription.id; null when claim only covers consultation fee."
        default: null
      - name: patient_id
        type: string
        source: input
        description: "Denormalized; must equal Consultation.patient_id."
      - name: claim_amount_cents
        type: integer
        source: computed
        description: "Combined eligible-amount in cents: consultation.total_fee*100 + (prescription.gross_amount_cents if linked)."
        default: 0
      - name: deductible_cents
        type: integer
        source: computed
        description: "Per-claim deductible (constant DEDUCTIBLE_CENTS)."
        default: 0
      - name: reimbursed_cents
        type: integer
        source: computed
        description: "Tiered reimbursement output (see calculations.insurance_reimbursement)."
        default: 0
      - name: self_pay_cents
        type: integer
        source: computed
        description: "claim_amount_cents - reimbursed_cents (must equal collected self-pay)."
        default: 0
      - name: self_pay_collected_cents
        type: integer
        source: computed
        description: "Confirmed collected self-pay amount; set on PaymentEvent settlement."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle status."
        constraints: "Enum: ELIGIBILITY_PENDING, VERIFIED, INELIGIBLE, SETTLING, SETTLED, REJECTED_BY_BUREAU"
        default: "ELIGIBILITY_PENDING"
      - name: bureau_ref
        type: string
        source: computed
        description: "Reference id returned by insurance-bureau real-time settlement."
        default: null

  - name: FollowUpTask
    parent: Consultation
    common_fields: true
    fields:
      - name: consultation_id
        type: string
        source: input
        description: "Foreign key to Consultation.id."
      - name: patient_id
        type: string
        source: input
        description: "Denormalized; must equal Consultation.patient_id."
      - name: plan_template_code
        type: string
        source: input
        description: "Identifier of the follow-up plan template chosen by the doctor."
      - name: scheduled_reminder_at
        type: datetime
        source: input
        description: "Server-clock instant at which the multi-channel reminder fires."
      - name: reminder_channels
        type: array
        source: input
        description: "Subset of {SMS, EMAIL, APP_PUSH}; at least one element required."
      - name: form_payload
        type: object
        source: input
        description: "Patient-submitted follow-up form fields; null until submission."
        default: null
      - name: abnormal_flag
        type: boolean
        source: computed
        description: "True iff form_payload contains any field with severity >= ABNORMAL_THRESHOLD."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Follow-up lifecycle status."
        constraints: "Enum: PLANNED, REMINDED, SUBMITTED, ESCALATED, CLOSED"
        default: "PLANNED"
      - name: escalation_consultation_id
        type: string
        source: computed
        description: "Set when status -> ESCALATED; references the auto-created follow-up Consultation."
        default: null

  - name: Pharmacist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Pharmacist legal name."
      - name: license_number
        type: string
        source: input
        description: "Pharmacist license number (server-unique)."
      - name: status
        type: enum
        source: input
        description: "Whether the pharmacist may review prescriptions."
        constraints: "Enum: ACTIVE, SUSPENDED"
        default: "ACTIVE"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: actor_role
        type: string
        source: system
        description: "Role of the actor performing the action."
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID of the actor."
      - name: action_code
        type: string
        source: system
        description: "Canonical action code (e.g., CONSULTATION_ACCEPT, PRESCRIPTION_APPROVE)."
      - name: target_entity
        type: string
        source: system
        description: "Entity name affected."
      - name: target_id
        type: string
        source: system
        description: "Id of the affected entity."
      - name: occurred_at
        type: datetime
        source: system
        description: "Server-clock instant when the action occurred."
      - name: payload_digest
        type: string
        source: system
        description: "Stable hash of request body (used as tamper-evidence; append-only)."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TriageSession
    initial_state: COLLECTING
    terminal_states: [EMERGENCY_ROUTED, MATCHED, CLOSED]
    transitions:
      - from: COLLECTING
        to: ASSESSED
        trigger: "POST /consultation/triage-sessions/{id}/assess"
        actor: Patient
        preconditions:
          - "TriageSession.status == COLLECTING"
          - "questionnaire_responses has >= 1 entries"
        side_effects:
          - "Compute chief_complaint_score, vital_anomaly_score, risk_factor_score, severity_score via calculations.triage_severity_score"
          - "Set severity_band per band thresholds"
          - "If severity_band != EMERGENCY, run department selector (selector policy) to set recommended_department_code"
      - from: ASSESSED
        to: EMERGENCY_ROUTED
        trigger: "Automatic on /assess completion when severity_band == EMERGENCY"
        actor: system
        preconditions:
          - "TriageSession.severity_band == EMERGENCY"
        side_effects:
          - "Set emergency_routing_ticket = freshly minted UUID"
          - "Emit OFFLINE_EMERGENCY_DISPATCH event (event-driven sync)"
          - "Reject any subsequent attempt to create Consultation from this TriageSession with ERR_TRIAGE_EMERGENCY_ROUTED"
      - from: ASSESSED
        to: MATCHED
        trigger: "POST /consultation/consultations (with this triage_session_id)"
        actor: Patient
        preconditions:
          - "TriageSession.status == ASSESSED"
          - "TriageSession.severity_band != EMERGENCY"
          - "Selector finds at least one eligible Doctor (otherwise ERR_NO_DOCTOR_AVAILABLE)"
        side_effects:
          - "Create Consultation in PENDING state"
          - "TriageSession transitions to MATCHED"
      - from: ASSESSED
        to: CLOSED
        trigger: "POST /consultation/triage-sessions/{id}/close"
        actor: Patient
        preconditions:
          - "TriageSession.status == ASSESSED"
        side_effects: []

  - entity: Consultation
    initial_state: PENDING
    terminal_states: [COMPLETED, TRANSFERRED, CANCELLED]
    transitions:
      - from: PENDING
        to: QUEUED
        trigger: "Automatic on creation when mode == REAL_TIME"
        actor: system
        preconditions:
          - "Consultation.mode == REAL_TIME"
          - "Doctor.status == AVAILABLE OR doctor has fewer than max_concurrent_sessions IN_PROGRESS consultations"
        side_effects:
          - "Assign queue_position = (count of Consultation rows where doctor_id == this.doctor_id AND session_status IN {QUEUED, ACCEPTED, IN_PROGRESS}) + 1"
      - from: PENDING
        to: ACCEPTED
        trigger: "Automatic on creation when mode == APPOINTMENT"
        actor: system
        preconditions:
          - "Consultation.mode == APPOINTMENT"
          - "scheduled_start_at falls inside an open DoctorSchedule slot (no overlap with another ACCEPTED appointment for the same doctor; closed-open interval semantics)"
        side_effects: []
      - from: QUEUED
        to: ACCEPTED
        trigger: "POST /consultation/consultations/{id}/accept"
        actor: Doctor
        preconditions:
          - "Consultation.session_status == QUEUED"
          - "X-User-ID equals Consultation.doctor_id"
          - "Doctor.status != SUSPENDED"
          - "Doctor's current count of IN_PROGRESS sessions < Doctor.max_concurrent_sessions"
        side_effects:
          - "Snapshot base_fee from doctor profile"
      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST /consultation/consultations/{id}/start"
        actor: Doctor
        preconditions:
          - "Consultation.session_status == ACCEPTED"
          - "For APPOINTMENT mode, current server time >= scheduled_start_at - GRACE_BEFORE_MINUTES"
        side_effects:
          - "Set started_at = current server time"
          - "If media_type == VIDEO, set quality_status = OK"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /consultation/consultations/{id}/complete"
        actor: Doctor
        preconditions:
          - "Consultation.session_status == IN_PROGRESS"
          - "If media_type == VIDEO, quality_status != FAILED"
        side_effects:
          - "Set ended_at = current server time, duration_minutes = ceil((ended_at-started_at)_min)"
          - "Compute total_fee via calculations.consultation_fee"
          - "Set transcript_archive_id = freshly minted UUID (session record archiving)"
          - "Recompute queue_position for all later-queued sibling Consultations for the same doctor (queue management cascade)"
          - "Emit CONSULTATION_COMPLETED event to event-driven sync layer"
          - "Append AuditLog row with action_code=CONSULTATION_COMPLETED"
      - from: IN_PROGRESS
        to: TRANSFERRED
        trigger: "POST /consultation/consultations/{id}/transfer"
        actor: Doctor
        preconditions:
          - "Consultation.session_status == IN_PROGRESS"
          - "Receiving Doctor exists, status != SUSPENDED, max_concurrent_sessions not exceeded"
          - "Receiving doctor_id != current doctor_id"
        side_effects:
          - "Set ended_at, duration_minutes, transcript_archive_id, total_fee (per consultation_fee — outgoing doctor still billed for elapsed minutes)"
          - "Create a NEW Consultation under receiving doctor in ACCEPTED state with mode=REAL_TIME, queue_position=null"
          - "Set this.transfer_to_doctor_id to the new Consultation.doctor_id"
          - "Recompute queue_positions for the outgoing doctor's queue"
      - from: QUEUED
        to: CANCELLED
        trigger: "DELETE /consultation/consultations/{id}"
        actor: Patient
        preconditions:
          - "Consultation.session_status == QUEUED"
        side_effects:
          - "Recompute queue_position for siblings of the same doctor"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "DELETE /consultation/consultations/{id}"
        actor: Patient
        preconditions:
          - "Consultation.session_status == ACCEPTED"
          - "current time < scheduled_start_at - GRACE_BEFORE_MINUTES (else ERR_TOO_LATE_TO_CANCEL)"
        side_effects: []
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /consultation/consultations/{id}/quality-report"
        actor: system
        preconditions:
          - "Consultation.media_type == VIDEO"
          - "Consultation.session_status == IN_PROGRESS"
        side_effects:
          - "Mutate quality_status only (parallel state dimension): OK -> DEGRADED -> FAILED based on report tier; on FAILED the doctor must transfer or the patient may /complete is blocked"

  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [DISPENSED, FAILED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /consultation/prescriptions/{id}/submit"
        actor: Doctor
        preconditions:
          - "Prescription.status == DRAFT"
          - "Prescription.eligibility_flag == ELIGIBLE"
          - "Consultation.session_status == COMPLETED"
          - "X-User-ID == drafting_doctor_id"
        side_effects:
          - "Append AuditLog row with action_code=PRESCRIPTION_SUBMITTED"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /consultation/prescriptions/{id}/approve"
        actor: Pharmacist
        preconditions:
          - "Prescription.status == UNDER_REVIEW"
          - "X-User-ID != drafting_doctor_id (segregation of duties)"
        side_effects:
          - "Set reviewing_pharmacist_id = X-User-ID"
          - "Compute gross_amount_cents = sum over items of (unit_price_cents * quantity)"
          - "Append AuditLog row with action_code=PRESCRIPTION_APPROVED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /consultation/prescriptions/{id}/reject"
        actor: Pharmacist
        preconditions:
          - "Prescription.status == UNDER_REVIEW"
          - "X-User-ID != drafting_doctor_id"
          - "rejection_reason supplied"
        side_effects:
          - "Set reviewing_pharmacist_id and rejection_reason"
          - "Append AuditLog row"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /consultation/prescriptions/{id}/revise"
        actor: Doctor
        preconditions:
          - "Prescription.status == REJECTED"
          - "X-User-ID == drafting_doctor_id"
        side_effects:
          - "Clear rejection_reason"
          - "Increment revision_count by 1"
          - "If revision_count > MAX_REVISIONS, force terminal FAILED instead (auto-transition)"
      - from: REJECTED
        to: FAILED
        trigger: "Automatic when /revise would push revision_count > MAX_REVISIONS"
        actor: system
        preconditions:
          - "Prescription.status == REJECTED"
          - "revision_count == MAX_REVISIONS"
        side_effects:
          - "Append AuditLog row with action_code=PRESCRIPTION_FAILED"
      - from: APPROVED
        to: DISPATCHED
        trigger: "POST /consultation/prescriptions/{id}/dispatch"
        actor: Pharmacist
        preconditions:
          - "Prescription.status == APPROVED"
          - "dispatch_target_id resolves to an active Pharmacy/Ecommerce in dispatch_target_kind directory"
        side_effects:
          - "Set dispensing_status = NONE"
          - "Emit PRESCRIPTION_DISPATCHED event (electronic prescription circulation platform sync)"
          - "Trigger InsuranceClaim eligibility check if patient.insurance_policy_no present"
          - "Append AuditLog row"
      - from: DISPATCHED
        to: DISPENSED
        trigger: "POST /consultation/_events/emit (kind=PHARMACY_DISPENSED) — external event ingest"
        actor: system
        preconditions:
          - "Prescription.status == DISPATCHED"
          - "Event payload references this prescription.id"
        side_effects:
          - "Update dispensing_status through {RECEIVED, PREPARING, READY, DELIVERED} per event sequence"
          - "On DELIVERED event, advance status to DISPENSED"
          - "Append AuditLog row"
      - from: DISPATCHED
        to: FAILED
        trigger: "POST /consultation/_events/emit (kind=PHARMACY_FAILED)"
        actor: system
        preconditions:
          - "Prescription.status == DISPATCHED"
        side_effects:
          - "Set dispensing_status = FAILED"
          - "Cascade: if a linked InsuranceClaim exists in SETTLING state, no-op; if in SETTLED state, no compensation here (handled by separate refund flow out of scope)."

  - entity: InsuranceClaim
    initial_state: ELIGIBILITY_PENDING
    terminal_states: [SETTLED, INELIGIBLE, REJECTED_BY_BUREAU]
    transitions:
      - from: ELIGIBILITY_PENDING
        to: VERIFIED
        trigger: "POST /consultation/insurance-claims/{id}/verify-eligibility"
        actor: system
        preconditions:
          - "Patient.insurance_status IN {ELIGIBLE} (refreshed via this call)"
          - "Consultation.session_status == COMPLETED"
        side_effects:
          - "Set deductible_cents = DEDUCTIBLE_CENTS"
          - "Set claim_amount_cents per claim_amount calculation"
      - from: ELIGIBILITY_PENDING
        to: INELIGIBLE
        trigger: "POST /consultation/insurance-claims/{id}/verify-eligibility (when bureau returns ineligible)"
        actor: system
        preconditions:
          - "Patient.insurance_status IN {INELIGIBLE, SUSPENDED, UNKNOWN}"
        side_effects:
          - "Set self_pay_cents = claim_amount_cents (whole amount is self-pay)"
      - from: VERIFIED
        to: SETTLING
        trigger: "POST /consultation/insurance-claims/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "InsuranceClaim.status == VERIFIED"
        side_effects:
          - "Compute reimbursed_cents via calculations.insurance_reimbursement"
          - "Compute self_pay_cents = claim_amount_cents - reimbursed_cents"
          - "Emit BUREAU_SETTLE_REQUEST event (event-driven sync)"
      - from: SETTLING
        to: SETTLED
        trigger: "POST /consultation/_events/emit (kind=BUREAU_SETTLED)"
        actor: system
        preconditions:
          - "InsuranceClaim.status == SETTLING"
          - "Event payload provides bureau_ref"
        side_effects:
          - "Set bureau_ref"
          - "Compensating-invariant: claim_amount_cents == reimbursed_cents + self_pay_cents AT SETTLED (audited)"
      - from: SETTLING
        to: REJECTED_BY_BUREAU
        trigger: "POST /consultation/_events/emit (kind=BUREAU_REJECTED)"
        actor: system
        preconditions:
          - "InsuranceClaim.status == SETTLING"
        side_effects:
          - "Set self_pay_cents = claim_amount_cents (full self-pay) — reimbursed_cents reset to 0"
      - from: SETTLED
        to: SETTLED
        trigger: "POST /consultation/insurance-claims/{id}/collect-self-pay"
        actor: PlatformAdmin
        preconditions:
          - "InsuranceClaim.status == SETTLED"
          - "self_pay_collected_cents == 0 (idempotent guard)"
        side_effects:
          - "Set self_pay_collected_cents = self_pay_cents"

  - entity: FollowUpTask
    initial_state: PLANNED
    terminal_states: [CLOSED, ESCALATED]
    transitions:
      - from: PLANNED
        to: REMINDED
        trigger: "POST /consultation/follow-up-tasks/{id}/fire-reminder (after clock advanced past scheduled_reminder_at)"
        actor: system
        preconditions:
          - "current server time >= scheduled_reminder_at"
          - "FollowUpTask.status == PLANNED"
        side_effects:
          - "Emit one MULTI_CHANNEL_REMINDER event per channel listed in reminder_channels"
      - from: REMINDED
        to: SUBMITTED
        trigger: "POST /consultation/follow-up-tasks/{id}/submit-form"
        actor: Patient
        preconditions:
          - "FollowUpTask.status == REMINDED"
          - "form_payload present"
        side_effects:
          - "Compute abnormal_flag (any field severity >= ABNORMAL_THRESHOLD)"
      - from: SUBMITTED
        to: ESCALATED
        trigger: "Automatic on /submit-form when abnormal_flag becomes true"
        actor: system
        preconditions:
          - "FollowUpTask.abnormal_flag == true"
        side_effects:
          - "Create a new Consultation (REAL_TIME, mode autoselected) for the same patient with the same doctor; set escalation_consultation_id"
          - "Append AuditLog row"
      - from: SUBMITTED
        to: CLOSED
        trigger: "Automatic on /submit-form when abnormal_flag is false"
        actor: system
        preconditions:
          - "FollowUpTask.abnormal_flag == false"
        side_effects: []

  # ===========================================================================
  # §1.2.1 Concurrency Rules
  # ===========================================================================
concurrency_rules:
  - scenario: "Two queue-jockeying patients hit /accept for the same QUEUED Consultation when doctor.max_concurrent_sessions slot just freed."
    guarantee: "At most one accept succeeds per freed slot; loser is rejected."
    error_id: ERR_DOCTOR_AT_CAPACITY
    http_status: 409
    serialization: "First-writer-wins on Consultation.session_status transition, evaluated against a serializable count of doctor's IN_PROGRESS + ACCEPTED sessions."

  - scenario: "Doctor /complete and patient DELETE (cancel) on the same Consultation race."
    guarantee: "Exactly one operation succeeds; loser sees ERR_INVALID_STATE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Consultation.session_status."

  - scenario: "Pharmacist /approve and Doctor /revise issued simultaneously on a Prescription in REJECTED state — race between approve-stale-state and revise."
    guarantee: "Pharmacist sees ERR_INVALID_STATE (cannot approve a REJECTED prescription); revise wins."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Prescription.status."

  - scenario: "Two BUREAU_SETTLED events for the same InsuranceClaim arrive in quick succession (at-least-once delivery)."
    guarantee: "Idempotent — the second is rejected without mutating self_pay_cents/reimbursed_cents."
    error_id: ERR_DUPLICATE_BUREAU_EVENT
    http_status: 409
    serialization: "Idempotency key = (claim_id, event.kind, event.bureau_ref); first-writer-wins."

  - scenario: "Two appointment Consultations created with the same doctor_id and overlapping scheduled_start_at .. scheduled_start_at+SLOT_MINUTES windows."
    guarantee: "Second creation is rejected for slot overlap."
    error_id: ERR_DOCTOR_SLOT_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (doctor_id, scheduled_start_at slot)."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: triage_severity_score
    trigger: "POST /consultation/triage-sessions/{id}/assess (TriageSession COLLECTING -> ASSESSED)"
    algorithm: weighted_scoring
    formula: |
      chief_complaint_score = sum(r.severity_weight for r in questionnaire_responses) * CHIEF_COMPLAINT_FACTOR
      vital_anomaly_score   = count(r where r.question_code starts with 'VITAL_' and r.answer_value == 'ABNORMAL') * VITAL_ANOMALY_FACTOR
      risk_factor_score     = sum(RISK_TABLE[c] for c in patient.chronic_condition_codes if c in RISK_TABLE) * RISK_FACTOR
      severity_score        = chief_complaint_score + vital_anomaly_score + risk_factor_score
      severity_band         = LOW       if severity_score <  30
                              MID       if 30 <= severity_score <  60
                              HIGH      if 60 <= severity_score <  90
                              EMERGENCY if severity_score >= 90
    input_set: "questionnaire_responses where r in this triage session; patient.chronic_condition_codes at the time /assess is called (snapshot)."
    constants:
      CHIEF_COMPLAINT_FACTOR: 10
      VITAL_ANOMALY_FACTOR: 2
      RISK_FACTOR: 3
      RISK_TABLE:
        DIABETES: 1
        HYPERTENSION: 1
        IMMUNOCOMPROMISED: 2
    precision: "Integer arithmetic; no rounding required."
    variants:
      - name: forward_looking_initial
        when: "First /assess call on a TriageSession in COLLECTING state."
        difference: "Includes ALL questionnaire_responses currently attached; chief_complaint_score uses the raw weights."
      - name: chronological_replay
        when: "Re-assessment after a /reopen (not exposed in v1, but reserved)."
        difference: "Treats responses in arrival order; later responses with the same question_code overwrite earlier ones BEFORE summation. v1: never invoked; locked to forward_looking_initial."

  - name: consultation_fee
    trigger: "Consultation IN_PROGRESS -> COMPLETED or IN_PROGRESS -> TRANSFERRED"
    algorithm: tiered_pricing
    formula: |
      duration_minutes = ceil((ended_at - started_at).total_seconds() / 60)   # ceil to next whole minute
      tier1_minutes = min(duration_minutes, TIER1_CAP_MIN)
      tier2_minutes = max(0, duration_minutes - TIER1_CAP_MIN)
      raw_total_cents = base_fee_cents + tier1_minutes * TIER1_RATE_CENTS + tier2_minutes * TIER2_RATE_CENTS
      # rounding order is fixed: round at the very end, after the sum
      total_fee = round(raw_total_cents / 100.0, 2)   # round_half_up to two decimal places
    input_set: "Consultation.base_fee (cents-converted, snapshot taken at /accept), duration_minutes computed at terminal transition."
    constants:
      TIER1_CAP_MIN: 10
      TIER1_RATE_CENTS: 100
      TIER2_RATE_CENTS: 200
    precision: "2 decimal places, round_half_up — rounding happens once, on the final sum, NOT per tier."
    variants:
      - name: completed_billing
        when: "Consultation COMPLETED normally."
        difference: "duration_minutes uses ended_at = /complete server time."
      - name: transferred_billing
        when: "Consultation TRANSFERRED before completion."
        difference: "duration_minutes uses ended_at = /transfer server time (typically smaller); outgoing doctor still bills elapsed minutes."

  - name: insurance_reimbursement
    trigger: "InsuranceClaim VERIFIED -> SETTLING (POST /settle)"
    algorithm: tiered_pricing
    formula: |
      eligible_cents = max(0, claim_amount_cents - deductible_cents)
      tier1_amount = min(eligible_cents, TIER1_CAP_CENTS)
      tier2_amount = max(0, eligible_cents - TIER1_CAP_CENTS)
      reimbursed_cents = round_half_up(tier1_amount * TIER1_RATE) + round_half_up(tier2_amount * TIER2_RATE)
      # rounding order is fixed: round per tier, THEN sum (contrast with consultation_fee).
      reimbursed_cents = min(reimbursed_cents, ANNUAL_CAP_CENTS - patient.year_to_date_reimbursed_cents)
    input_set: "claim_amount_cents and deductible_cents on this InsuranceClaim. Patient.year_to_date_reimbursed_cents = sum over Patient's prior SETTLED claims this calendar year."
    constants:
      DEDUCTIBLE_CENTS: 5000
      TIER1_CAP_CENTS: 10000
      TIER1_RATE: 0.70
      TIER2_RATE: 0.50
      ANNUAL_CAP_CENTS: 1000000
    precision: "Integer cents; round_half_up per tier BEFORE summation (combinatorial mode (b))."
    variants:
      - name: in_scope_disease
        when: "Linked Prescription.disease_codes intersects INSURANCE_IN_SCOPE_DISEASES OR claim covers only consultation fee."
        difference: "Uses TIER1_RATE = 0.70."
      - name: out_of_scope_disease
        when: "Linked Prescription.disease_codes is fully outside INSURANCE_IN_SCOPE_DISEASES."
        difference: "Uses TIER1_RATE = 0.30 and TIER2_RATE = 0.20 (penalty rates)."

  - name: doctor_match_selector
    trigger: "POST /consultation/consultations (selecting doctor when patient_preferred_doctor_id is null) or TriageSession /assess (when filling recommended_department_code)."
    algorithm: forward_looking
    formula: |
      candidates = Doctor where Doctor.department_code == triage.recommended_department_code
                                AND triage.patient.region_code in Doctor.licensed_region_codes
                                AND Doctor.status IN {AVAILABLE}
                                AND len(Doctor.specialty_codes intersect DepartmentMapping[code].disease_codes_for_triage) >= 1
      # eligibility filter is the explicit predicate above; no "active doctors" prose.
      if patient.preferred_hospital_id is not null:
          candidates = [d for d in candidates if d.hospital_id == patient.preferred_hospital_id]
      if candidates is empty: ERR_NO_DOCTOR_AVAILABLE
      # ranking expression: (rating_score DESC, current_load ASC) where current_load = count of Consultation rows for d in {QUEUED, ACCEPTED, IN_PROGRESS}
      ranked = sort(candidates, key=(-d.rating_score, d.current_load))
      # tie-break: when both rating_score and current_load tie, ascending Doctor.id (lexicographic UUID order)
      return ranked[0]
    input_set: "Doctor rows; live load counts taken at the instant of /consultations POST or /assess."
    constants: {}
    precision: "Integer counts."
    variants:
      - name: with_preferred_doctor
        when: "patient.preferred_doctor_id != null"
        difference: "Skip selector entirely; verify that doctor satisfies eligibility filter; if not, fall back to selector (do NOT silently reassign — return ERR_PREFERRED_DOCTOR_INELIGIBLE)."
      - name: without_preferred_doctor
        when: "patient.preferred_doctor_id == null"
        difference: "Run the full eligibility+ranking pipeline above."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path resource ids exist (validated left to right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-bearing endpoints"

  - priority: 4
    category: existence
    check: "Every body foreign-key (triage_session_id, consultation_id, doctor_id, patient_id, prescription_id, dispatch_target_id) resolves"
    error_id: ERR_REF_NOT_FOUND
    http_status: 422
    applies_to: "all create endpoints"

  - priority: 5
    category: state
    check: "Target resource in the from-state required by §1.2 for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition-triggering endpoints"

  - priority: 6
    category: business_safety
    check: "TriageSession.severity_band == EMERGENCY blocks POST /consultations against that triage_session_id (emergency must be routed offline)."
    error_id: ERR_TRIAGE_EMERGENCY_ROUTED
    http_status: 422
    applies_to: "POST /consultation/consultations"

  - priority: 7
    category: business_safety
    check: "Pharmacist approving/rejecting a Prescription must NOT equal drafting_doctor_id (segregation of duties)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /consultation/prescriptions/{id}/approve, /reject"

  - priority: 8
    category: business_referential
    check: "Prescription dispatch_target_id resolves to active row in PharmacyDirectory[dispatch_target_kind]."
    error_id: ERR_DISPATCH_TARGET_INVALID
    http_status: 422
    applies_to: "POST /consultation/prescriptions/{id}/dispatch"

  - priority: 9
    category: business_constraint
    check: "Prescription.eligibility_flag must be ELIGIBLE at /submit (return-visit only / disease in PRESCRIPTION_ALLOWED_DISEASES)."
    error_id: ERR_PRESCRIPTION_INELIGIBLE
    http_status: 422
    applies_to: "POST /consultation/prescriptions/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "Doctor.max_concurrent_sessions not exceeded by the count of doctor's QUEUED+ACCEPTED+IN_PROGRESS consultations."
    error_id: ERR_DOCTOR_AT_CAPACITY
    http_status: 409
    applies_to: "POST /consultation/consultations/{id}/accept, POST /consultation/consultations (creation in REAL_TIME mode)"

  - priority: 11
    category: business_temporal
    check: "Appointment Consultation: scheduled_start_at slot (length SLOT_MINUTES) must not overlap, using closed-open [start, start+SLOT_MINUTES) interval semantics, any other Consultation row for the same doctor whose session_status IN {ACCEPTED, IN_PROGRESS}."
    error_id: ERR_DOCTOR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /consultation/consultations (mode=APPOINTMENT)"

  - priority: 12
    category: business_temporal
    check: "DoctorSchedule open-window: scheduled_start_at must fall fully inside a published DoctorSchedule open interval [open_at, close_at] (closed-closed, inclusive both ends) for that doctor."
    error_id: ERR_OUT_OF_SCHEDULE
    http_status: 422
    applies_to: "POST /consultation/consultations (mode=APPOINTMENT)"

  - priority: 13
    category: business_referential
    check: "Patient.preferred_doctor_id, if set, must satisfy doctor_match_selector eligibility filter; otherwise reject (do not silently re-match)."
    error_id: ERR_PREFERRED_DOCTOR_INELIGIBLE
    http_status: 422
    applies_to: "POST /consultation/consultations"

  - priority: 14
    category: business_constraint
    check: "FollowUpTask.reminder_channels has length >= 1 and is a subset of {SMS, EMAIL, APP_PUSH}."
    error_id: ERR_REMINDER_CHANNELS_INVALID
    http_status: 422
    applies_to: "POST /consultation/follow-up-tasks"

  - priority: 15
    category: business_fiscal
    check: "Prescription items: every item.quantity >= 1 and item.unit_price_cents >= 1."
    error_id: ERR_PRESCRIPTION_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /consultation/prescriptions, POST /consultation/prescriptions/{id}/revise"

  - priority: 16
    category: business_fiscal
    check: "InsuranceClaim post-settlement invariant: claim_amount_cents == reimbursed_cents + self_pay_cents (compensating-action invariant)."
    error_id: ERR_INSURANCE_INVARIANT_VIOLATION
    http_status: 422
    applies_to: "internal audit at SETTLING -> SETTLED transition"

  - priority: 17
    category: business_constraint
    check: "TriageSession.questionnaire_responses non-empty at /assess."
    error_id: ERR_QUESTIONNAIRE_EMPTY
    http_status: 422
    applies_to: "POST /consultation/triage-sessions/{id}/assess"

  - priority: 18
    category: business_constraint
    check: "OCC: If request body provides version, it MUST equal the server's current version; otherwise ERR_VERSION_CONFLICT."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH/PUT/transition endpoints accepting `version` field"

  - priority: 19
    category: business_constraint
    check: "Pagination params, when supplied, satisfy 1 <= limit <= 100, offset >= 0."
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all GET-list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Patient management ---
  - method: POST
    path: "/consultation/patients"
    description: "Create a Patient."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "date_of_birth", "region_code", "insurance_policy_no?", "preferred_hospital_id?", "preferred_doctor_id?", "chronic_condition_codes?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/consultation/patients/{id}"
    description: "Get a patient."
    roles: [Patient, PlatformAdmin]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/consultation/patients/{id}"
    description: "Update preferred_hospital_id, preferred_doctor_id, chronic_condition_codes."
    roles: [Patient]
    code: 200
    input: ["preferred_hospital_id?", "preferred_doctor_id?", "chronic_condition_codes?", "version?"]
    output: Patient
    side_effects: []

  # --- Doctor management ---
  - method: POST
    path: "/consultation/doctors"
    description: "Create a Doctor."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "hospital_id", "department_code", "specialty_codes", "licensed_region_codes", "max_concurrent_sessions?", "rating_score?"]
    output: Doctor
    side_effects: []

  - method: GET
    path: "/consultation/doctors/{id}"
    description: "Get a doctor."
    roles: [Doctor, Patient, PlatformAdmin]
    code: 200
    input: []
    output: Doctor
    side_effects: []

  - method: PATCH
    path: "/consultation/doctors/{id}"
    description: "Update doctor status / max_concurrent_sessions."
    roles: [Doctor, PlatformAdmin]
    code: 200
    input: ["status?", "max_concurrent_sessions?", "version?"]
    output: Doctor
    side_effects: []

  - method: GET
    path: "/consultation/doctors"
    description: "List doctors with filters."
    roles: [Patient, PlatformAdmin]
    code: 200
    input: ["department_code?", "hospital_id?", "region_code?", "status?", "limit?", "offset?"]
    output: "Doctor[]"
    side_effects: []

  # --- Pharmacist management ---
  - method: POST
    path: "/consultation/pharmacists"
    description: "Register a Pharmacist."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "license_number", "status?"]
    output: Pharmacist
    side_effects: []

  - method: GET
    path: "/consultation/pharmacists/{id}"
    description: "Get a pharmacist."
    roles: [Pharmacist, PlatformAdmin]
    code: 200
    input: []
    output: Pharmacist
    side_effects: []

  # --- Department mappings (configuration) ---
  - method: POST
    path: "/consultation/department-mappings"
    description: "Register a (department_code, disease_codes) mapping."
    roles: [PlatformAdmin]
    code: 201
    input: ["department_code", "disease_codes", "triage_priority"]
    output: DepartmentMapping
    side_effects: []

  - method: GET
    path: "/consultation/department-mappings"
    description: "List department mappings."
    roles: [Patient, Doctor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "DepartmentMapping[]"
    side_effects: []

  # --- Triage ---
  - method: POST
    path: "/consultation/triage-sessions"
    description: "Open a triage session for a patient (status=COLLECTING)."
    roles: [Patient]
    code: 201
    input: ["patient_id", "questionnaire_responses"]
    output: TriageSession
    side_effects: []

  - method: POST
    path: "/consultation/triage-sessions/{id}/assess"
    description: "Compute severity_score/severity_band and route. Triggers calculations.triage_severity_score and selector for recommended_department_code."
    roles: [Patient]
    code: 200
    input: ["version?"]
    output: TriageSession
    side_effects: ["TriageSession COLLECTING -> ASSESSED (or EMERGENCY_ROUTED)", "selector populates recommended_department_code"]

  - method: POST
    path: "/consultation/triage-sessions/{id}/close"
    description: "Close a non-emergency assessed triage session without creating a consultation."
    roles: [Patient]
    code: 200
    input: ["version?"]
    output: TriageSession
    side_effects: []

  - method: GET
    path: "/consultation/triage-sessions/{id}"
    description: "Get a triage session (used to inspect severity_band, recommended_department_code)."
    roles: [Patient, Doctor, PlatformAdmin]
    code: 200
    input: []
    output: TriageSession
    side_effects: []

  # --- Consultation lifecycle ---
  - method: POST
    path: "/consultation/consultations"
    description: "Create a consultation from an assessed triage session. Runs doctor_match_selector; selects doctor."
    roles: [Patient]
    code: 201
    input: ["triage_session_id", "mode", "scheduled_start_at?", "media_type", "doctor_id?"]
    output: Consultation
    side_effects:
      - "PENDING -> QUEUED (REAL_TIME) or PENDING -> ACCEPTED (APPOINTMENT)"
      - "TriageSession ASSESSED -> MATCHED"

  - method: POST
    path: "/consultation/consultations/{id}/accept"
    description: "Doctor accepts a queued real-time consultation."
    roles: [Doctor]
    code: 200
    input: ["version?"]
    output: Consultation
    side_effects: ["QUEUED -> ACCEPTED"]

  - method: POST
    path: "/consultation/consultations/{id}/start"
    description: "Doctor starts the session."
    roles: [Doctor]
    code: 200
    input: ["version?"]
    output: Consultation
    side_effects: ["ACCEPTED -> IN_PROGRESS", "set started_at, quality_status if VIDEO"]

  - method: POST
    path: "/consultation/consultations/{id}/quality-report"
    description: "Submit a VIDEO quality tier report; mutates quality_status (parallel dimension)."
    roles: [Doctor]
    code: 200
    input: ["report_tier"]
    output: Consultation
    side_effects: ["quality_status step: OK -> DEGRADED -> FAILED"]

  - method: POST
    path: "/consultation/consultations/{id}/complete"
    description: "Doctor completes session. Computes total_fee and archives transcript."
    roles: [Doctor]
    code: 200
    input: ["version?"]
    output: Consultation
    side_effects:
      - "IN_PROGRESS -> COMPLETED"
      - "Compute total_fee per calculations.consultation_fee"
      - "Recompute queue_position for siblings"
      - "Emit CONSULTATION_COMPLETED event"

  - method: POST
    path: "/consultation/consultations/{id}/transfer"
    description: "Transfer the session to another doctor; creates a sibling Consultation."
    roles: [Doctor]
    code: 200
    input: ["target_doctor_id", "version?"]
    output: Consultation
    side_effects: ["IN_PROGRESS -> TRANSFERRED on this row; new Consultation ACCEPTED for target"]

  - method: DELETE
    path: "/consultation/consultations/{id}"
    description: "Patient cancels a QUEUED or ACCEPTED consultation."
    roles: [Patient]
    code: 200
    input: []
    output: Consultation
    side_effects: ["QUEUED/ACCEPTED -> CANCELLED; recompute queue_position for siblings"]

  - method: GET
    path: "/consultation/consultations/{id}"
    description: "Get a consultation."
    roles: [Patient, Doctor, PlatformAdmin]
    code: 200
    input: []
    output: Consultation
    side_effects: []

  - method: GET
    path: "/consultation/consultations"
    description: "List consultations with filters."
    roles: [Patient, Doctor, PlatformAdmin]
    code: 200
    input: ["doctor_id?", "patient_id?", "session_status?", "limit?", "offset?"]
    output: "Consultation[]"
    side_effects: []

  - method: POST
    path: "/consultation/consultations/{id}/image-attachments"
    description: "Upload a medical-report or affected-area image (media-blob handled out of band; this stores the id)."
    roles: [Patient]
    code: 201
    input: ["attachment_id"]
    output: Consultation
    side_effects: []

  # --- Prescription ---
  - method: POST
    path: "/consultation/prescriptions"
    description: "Doctor drafts a prescription (status=DRAFT)."
    roles: [Doctor]
    code: 201
    input: ["consultation_id", "disease_codes", "items", "dispatch_target_kind", "dispatch_target_id"]
    output: Prescription
    side_effects: ["compute eligibility_flag against PRESCRIPTION_ALLOWED_DISEASES / return-visit rule"]

  - method: POST
    path: "/consultation/prescriptions/{id}/submit"
    description: "Doctor submits draft to pharmacist review."
    roles: [Doctor]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects: ["DRAFT -> UNDER_REVIEW"]

  - method: POST
    path: "/consultation/prescriptions/{id}/approve"
    description: "Pharmacist approves prescription."
    roles: [Pharmacist]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects: ["UNDER_REVIEW -> APPROVED; compute gross_amount_cents"]

  - method: POST
    path: "/consultation/prescriptions/{id}/reject"
    description: "Pharmacist rejects prescription with reason."
    roles: [Pharmacist]
    code: 200
    input: ["rejection_reason", "version?"]
    output: Prescription
    side_effects: ["UNDER_REVIEW -> REJECTED"]

  - method: POST
    path: "/consultation/prescriptions/{id}/revise"
    description: "Doctor revises rejected prescription (REJECTED -> DRAFT) or, when revision_count is at limit, triggers FAILED."
    roles: [Doctor]
    code: 200
    input: ["items?", "disease_codes?", "version?"]
    output: Prescription
    side_effects: ["REJECTED -> DRAFT (revision_count++); else REJECTED -> FAILED if max revisions reached"]

  - method: POST
    path: "/consultation/prescriptions/{id}/dispatch"
    description: "Dispatch approved prescription to designated pharmacy/e-commerce. Triggers InsuranceClaim eligibility check."
    roles: [Pharmacist]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects:
      - "APPROVED -> DISPATCHED"
      - "Create InsuranceClaim (status=ELIGIBILITY_PENDING) if patient has insurance_policy_no"
      - "Emit PRESCRIPTION_DISPATCHED event"

  - method: GET
    path: "/consultation/prescriptions/{id}"
    description: "Get a prescription."
    roles: [Doctor, Pharmacist, Patient, PlatformAdmin]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/consultation/prescriptions"
    description: "List prescriptions."
    roles: [Doctor, Pharmacist, Patient, PlatformAdmin]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: "Prescription[]"
    side_effects: []

  # --- InsuranceClaim ---
  - method: POST
    path: "/consultation/insurance-claims/{id}/verify-eligibility"
    description: "Verify eligibility with insurance bureau (event-emit-driven)."
    roles: [PlatformAdmin]
    code: 200
    input: ["insurance_status"]
    output: InsuranceClaim
    side_effects: ["ELIGIBILITY_PENDING -> VERIFIED or INELIGIBLE"]

  - method: POST
    path: "/consultation/insurance-claims/{id}/settle"
    description: "Initiate real-time settlement with bureau; compute reimbursed_cents and self_pay_cents."
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: InsuranceClaim
    side_effects: ["VERIFIED -> SETTLING; emit BUREAU_SETTLE_REQUEST event"]

  - method: POST
    path: "/consultation/insurance-claims/{id}/collect-self-pay"
    description: "Record self-pay collection (idempotent on self_pay_collected_cents)."
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: InsuranceClaim
    side_effects: ["self_pay_collected_cents := self_pay_cents"]

  - method: GET
    path: "/consultation/insurance-claims/{id}"
    description: "Get an insurance claim."
    roles: [PlatformAdmin, Patient]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  # --- Follow-up tasks ---
  - method: POST
    path: "/consultation/follow-up-tasks"
    description: "Doctor creates a follow-up plan for a completed consultation."
    roles: [Doctor]
    code: 201
    input: ["consultation_id", "plan_template_code", "scheduled_reminder_at", "reminder_channels"]
    output: FollowUpTask
    side_effects: []

  - method: POST
    path: "/consultation/follow-up-tasks/{id}/fire-reminder"
    description: "Trigger reminder dispatch (system-callable after clock advanced past scheduled_reminder_at)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FollowUpTask
    side_effects: ["PLANNED -> REMINDED; emit MULTI_CHANNEL_REMINDER events"]

  - method: POST
    path: "/consultation/follow-up-tasks/{id}/submit-form"
    description: "Patient submits the follow-up form. Auto-escalates if abnormal_flag becomes true."
    roles: [Patient]
    code: 200
    input: ["form_payload", "version?"]
    output: FollowUpTask
    side_effects: ["REMINDED -> SUBMITTED -> {CLOSED | ESCALATED}; on ESCALATED creates a new Consultation"]

  - method: GET
    path: "/consultation/follow-up-tasks/{id}"
    description: "Get a follow-up task."
    roles: [Doctor, Patient, PlatformAdmin]
    code: 200
    input: []
    output: FollowUpTask
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/consultation/audit-logs"
    description: "List audit log entries (filterable by target_entity, action_code, actor_role)."
    roles: [PlatformAdmin]
    code: 200
    input: ["target_entity?", "action_code?", "actor_role?", "limit?", "offset?"]
    output: "AuditLog[]"
    side_effects: []

  # --- Test-driving / system endpoints ---
  - method: POST
    path: "/consultation/_clock/advance"
    description: "Advance the server clock by N seconds (test harness)."
    roles: [PlatformAdmin]
    code: 200
    input: ["seconds"]
    output: null
    side_effects: ["Server clock advances; nothing else is implicitly triggered."]

  - method: POST
    path: "/consultation/_events/emit"
    description: "Ingest an external event (payment/pharmacy/insurance-bureau). Used to drive event-driven transitions."
    roles: [PlatformAdmin]
    code: 200
    input: ["kind", "payload"]
    output: null
    side_effects:
      - "kind=PHARMACY_DISPENSED  -> step Prescription.dispensing_status / advance to DISPENSED"
      - "kind=PHARMACY_FAILED     -> Prescription.status DISPATCHED -> FAILED"
      - "kind=BUREAU_SETTLED      -> InsuranceClaim SETTLING -> SETTLED (sets bureau_ref); idempotent on (claim_id, bureau_ref)"
      - "kind=BUREAU_REJECTED     -> InsuranceClaim SETTLING -> REJECTED_BY_BUREAU"
      - "kind=PAYMENT_CONFIRMED   -> InsuranceClaim.self_pay_collected_cents := self_pay_cents"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this endpoint per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource id does not exist."
  - id: ERR_REF_NOT_FOUND
    http: 422
    condition: "Body foreign-key references a non-existent resource."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in the from-state required for the requested transition."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Supplied `version` does not equal server's current version (OCC stale write)."
  - id: ERR_TRIAGE_EMERGENCY_ROUTED
    http: 422
    condition: "Cannot start a Consultation against a TriageSession in EMERGENCY_ROUTED."
  - id: ERR_NO_DOCTOR_AVAILABLE
    http: 422
    condition: "doctor_match_selector candidate set is empty after applying eligibility filter."
  - id: ERR_PREFERRED_DOCTOR_INELIGIBLE
    http: 422
    condition: "patient.preferred_doctor_id is set but the doctor fails the eligibility filter."
  - id: ERR_DOCTOR_AT_CAPACITY
    http: 409
    condition: "Doctor would exceed max_concurrent_sessions on accept/create."
  - id: ERR_DOCTOR_SLOT_OVERLAP
    http: 409
    condition: "Appointment scheduled_start_at slot collides with an existing accepted/in-progress appointment for the same doctor (closed-open [start, start+SLOT_MINUTES) interval semantics)."
  - id: ERR_OUT_OF_SCHEDULE
    http: 422
    condition: "Appointment scheduled_start_at falls outside the doctor's published open schedule window (closed-closed [open_at, close_at] interval semantics)."
  - id: ERR_TOO_LATE_TO_CANCEL
    http: 422
    condition: "Patient cancels an ACCEPTED appointment after current_time >= scheduled_start_at - GRACE_BEFORE_MINUTES."
  - id: ERR_PRESCRIPTION_INELIGIBLE
    http: 422
    condition: "Prescription eligibility_flag != ELIGIBLE at /submit (return-visit / disease-scope rule)."
  - id: ERR_PRESCRIPTION_AMOUNT_INVALID
    http: 422
    condition: "Prescription items contain quantity < 1 or unit_price_cents < 1."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Pharmacist X-User-ID equals drafting_doctor_id."
  - id: ERR_DISPATCH_TARGET_INVALID
    http: 422
    condition: "dispatch_target_id does not resolve to active pharmacy/e-commerce entry of the chosen kind."
  - id: ERR_REMINDER_CHANNELS_INVALID
    http: 422
    condition: "FollowUpTask.reminder_channels missing/empty or has values outside {SMS, EMAIL, APP_PUSH}."
  - id: ERR_QUESTIONNAIRE_EMPTY
    http: 422
    condition: "TriageSession.questionnaire_responses empty at /assess."
  - id: ERR_DUPLICATE_BUREAU_EVENT
    http: 409
    condition: "BUREAU_SETTLED event re-delivered for the same (claim_id, bureau_ref)."
  - id: ERR_INSURANCE_INVARIANT_VIOLATION
    http: 422
    condition: "Post-settlement: claim_amount_cents != reimbursed_cents + self_pay_cents (compensating-action invariant breach)."
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit outside [1,100] or offset < 0."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "End-user seeking consultation; owns TriageSession/Consultation/FollowUpTask rows where patient_id == X-User-ID."
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /consultation/triage-sessions, /assess, /close"
      - "POST /consultation/consultations (create)"
      - "DELETE /consultation/consultations/{id} (cancel)"
      - "POST /consultation/consultations/{id}/image-attachments"
      - "POST /consultation/follow-up-tasks/{id}/submit-form"
      - "PATCH /consultation/patients/{id} (own row only)"
    shared_operations:
      - "GET on own Patient, TriageSession, Consultation, Prescription, InsuranceClaim, FollowUpTask"
      - "GET /consultation/doctors, /department-mappings"

  - name: Doctor
    description: "Medical practitioner; owns Consultation rows where doctor_id == X-User-ID and drafts Prescription rows."
    identity: "entity_backed:Doctor"
    exclusive_operations:
      - "POST /consultation/consultations/{id}/accept, /start, /complete, /transfer, /quality-report"
      - "POST /consultation/prescriptions (draft)"
      - "POST /consultation/prescriptions/{id}/submit, /revise"
      - "POST /consultation/follow-up-tasks (create)"
    shared_operations:
      - "PATCH /consultation/doctors/{id} (own row)"
      - "GET on Consultation/Prescription rows the doctor is associated with"

  - name: Pharmacist
    description: "Licensed pharmacist; reviews and dispatches prescriptions. Segregation-of-duties: must not equal Prescription.drafting_doctor_id."
    identity: "entity_backed:Pharmacist"
    exclusive_operations:
      - "POST /consultation/prescriptions/{id}/approve, /reject, /dispatch"
    shared_operations:
      - "GET on Prescription rows"

  - name: PlatformAdmin
    description: "Operations role; configures system, drives test-harness endpoints, runs insurance settlement, ingests external events."
    identity: "opaque"
    exclusive_operations:
      - "POST /consultation/patients, /doctors, /pharmacists, /department-mappings"
      - "POST /consultation/insurance-claims/{id}/verify-eligibility, /settle, /collect-self-pay"
      - "POST /consultation/follow-up-tasks/{id}/fire-reminder"
      - "POST /consultation/_clock/advance"
      - "POST /consultation/_events/emit"
      - "GET /consultation/audit-logs"
    shared_operations:
      - "GET on every resource for administrative oversight"
