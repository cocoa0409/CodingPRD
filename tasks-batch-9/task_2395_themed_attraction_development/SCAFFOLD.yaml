scenario: "2395. Themed Attraction Development (themed entertainment design firm): concept development with storyline, ride system selection and capacity targets against expected attendance, blue sky through schematic design with show set, media and technical system integration, ride vehicle and control system engineering with safety standard compliance and third-party review, show quality and scene sequencing with lighting, audio, animation and special effects programming, capacity, throughput and queue design including virtual queue and accessibility routing, budget and schedule control across owner, designer and contractor with value engineering decisions, installation, programming and technical rehearsal with soft opening validation, operations handoff with maintenance procedures and spare parts strategy"
domain_name: "themed-attraction-development"
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: flat
  # Peer entities linked by foreign keys declared in request bodies; no nested
  # ownership URLs. Sub-resource GETs exist only as reverse-reachability reads.

  state_machine_shape: cyclic
  # DesignPackage revision loops (SUBMITTED -> REVISION_REQUESTED -> SUBMITTED),
  # ShowScene freeze/release loops (PROGRAMMED -> HELD -> PROGRAMMED), and
  # AttractionProject.readiness_posture loops (OPEN <-> RESTRICTED <-> FROZEN)
  # sit alongside the forward-only design_phase ladder, so AttractionProject
  # additionally carries two independent (parallel) state dimensions.

  relationship_patterns:
    - one_to_many          # AttractionProject -> RideSystem / QueueSegment / ShowScene / DesignPackage / ValueEngineeringItem / RehearsalRun / MaintenanceItem / BudgetLedgerEntry
    - self_referential     # ShowScene.follows_scene_id -> ShowScene.id (scene running order chain)
    - cross_aggregate      # DesignPackage.ride_system_id, SafetyReview.design_package_id, ShowScene.validating_rehearsal_run_id

  role_model: segregation_of_duties
  # The user who submits a DesignPackage (X-User-ID) may not approve it, even
  # when that user holds OwnerRep, and each ValueEngineeringItem admits exactly
  # one ballot per party_role.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Above the §0.4 Expert band on purpose: 13 entities / 66 endpoints / 13 state
  # machines / 8 calculations (two of them dual-variant) / 47 ordered validations.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: AttractionProject
    parent: null
    common_fields: true
    fields:
      - name: project_code
        type: string
        source: input
        description: External program code for the attraction
        constraints: 1-32 chars, unique across AttractionProject
      - name: name
        type: string
        source: input
        description: Attraction show title used in creative documents
        constraints: 1-120 chars
      - name: design_day_attendance
        type: integer
        source: input
        description: Expected guest count on the design day used for capacity sizing
        constraints: ">= 1"
      - name: peak_hour_share
        type: number
        source: input
        description: Share of design_day_attendance expected to demand the attraction in the peak hour, as an exact decimal fraction
        constraints: "> 0 and <= 1, at most 4 decimal places"
      - name: virtual_queue_share_pct
        type: number
        source: input
        default: 0
        description: Percent of accepted queue capacity released through the virtual queue
        constraints: ">= 0 and <= 100; at most 2 decimal places. The tighter MAX_VIRTUAL_QUEUE_SHARE_PCT cap of 40 is a business rule enforced at validation priority 35, NOT a schema range, so a share of 41 reaches ERR_VIRTUAL_QUEUE_SHARE_EXCEEDED rather than ERR_INVALID_REQUEST."
      - name: budget_ceiling_cents
        type: integer
        source: input
        description: Owner-authorised cost ceiling for the program in cents
        constraints: ">= 1"
      - name: required_hourly_capacity_guests
        type: integer
        source: computed
        description: "Output of calculations.project_required_hourly_capacity: ceil(design_day_attendance * peak_hour_share)"
      - name: design_phase
        type: enum
        source: computed
        default: BLUE_SKY
        description: Forward-only delivery ladder position; advanced by POST /attraction-projects/{id}/advance-phase
        constraints: "BLUE_SKY | CONCEPT | SCHEMATIC | DESIGN_DEVELOPMENT | PRODUCTION | INSTALLATION | TECHNICAL_REHEARSAL | SOFT_OPEN | OPERATIONS_HANDOVER"
      - name: readiness_posture
        type: enum
        source: computed
        default: OPEN
        description: "Derived gate recomputed by calculations.project_readiness_posture on every finding, ledger and ceiling change"
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: selected_ride_system_id
        type: string
        source: computed
        default: null
        description: "Computed mirror (NOT a client-writable reference): the id of the RideSystem for this project whose status is in {SELECTED, ENGINEERED, COMMISSIONED}; null when no ride system has been selected. Discover the underlying rows with GET /attraction-projects/{id}/ride-systems."
      - name: committed_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.project_budget_position variant committed_basis: signed sum of every BudgetLedgerEntry.amount_cents for this project"
      - name: forecast_cost_cents
        type: integer
        source: computed
        default: 0
        description: "Output of calculations.project_budget_position variant forecast_basis: committed_cost_cents adjusted by in-flight value-engineering savings and open safety remediation estimates"
      - name: open_critical_finding_count
        type: integer
        source: computed
        default: 0
        description: Count of SafetyFinding rows with severity CRITICAL and status in {OPEN, RESOLVED} across every SafetyReview of this project
      - name: open_major_finding_count
        type: integer
        source: computed
        default: 0
        description: Count of SafetyFinding rows with severity MAJOR and status in {OPEN, RESOLVED} across every SafetyReview of this project
      - name: queue_capacity_total_guests
        type: integer
        source: computed
        default: 0
        description: Sum of QueueSegment.capacity_guests over this project's QueueSegment rows with status ACCEPTED
      - name: show_quality_score
        type: number
        source: computed
        default: 0.00
        description: "Output of calculations.project_show_quality_score, 2 decimal places"
      - name: soft_open_validated
        type: boolean
        source: computed
        default: false
        description: Set true when a RehearsalRun with run_kind SOFT_OPEN completes with result PASS for this project
      - name: handover_accepted_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which design_phase became OPERATIONS_HANDOVER
      - name: ledger_sequence_high_water
        type: integer
        source: system
        default: 0
        description: Highest BudgetLedgerEntry.sequence_no minted for this project; the next entry takes this value plus 1. Server-maintained, never accepted from a request body.

  - name: RideSystem
    parent: AttractionProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program this candidate ride system is offered for
      - name: vendor_name
        type: string
        source: input
        description: Ride manufacturer offering the system
        constraints: 1-120 chars
      - name: system_type
        type: enum
        source: input
        description: Ride system family
        constraints: "DARK_RIDE_TRACKLESS | OMNIMOVER | LAUNCH_COASTER | BOAT_FLUME | MOTION_BASE_THEATER"
      - name: vehicle_count
        type: integer
        source: input
        description: Number of ride vehicles procured
        constraints: ">= 1"
      - name: riders_per_vehicle
        type: integer
        source: input
        description: Seated riders per vehicle
        constraints: ">= 1"
      - name: block_zone_count
        type: integer
        source: input
        description: Number of control-system block zones on the circuit; at most block_zone_count - 1 vehicles may be in service
        constraints: ">= 2"
      - name: cycle_time_seconds
        type: integer
        source: input
        description: Full circuit time for one vehicle including load and unload
        constraints: ">= 1"
      - name: availability_pct
        type: number
        source: input
        description: Contractual mechanical availability percent used by the operational capacity variant
        constraints: "> 0 and <= 100, at most 2 decimal places"
      - name: load_efficiency_pct
        type: number
        source: input
        description: Expected seat-fill percent used by the operational capacity variant
        constraints: "> 0 and <= 100, at most 2 decimal places"
      - name: show_stops_per_hour
        type: number
        source: input
        description: Expected guest-caused show stops per operating hour used by the operational capacity variant
        constraints: ">= 0, at most 2 decimal places"
      - name: dispatch_interval_seconds
        type: integer
        source: computed
        description: "Output of calculations.ride_system_hourly_capacity intermediate: max(MIN_DISPATCH_INTERVAL_SECONDS, ceil(cycle_time_seconds / min(vehicle_count, block_zone_count - 1)))"
      - name: theoretical_hourly_capacity_guests
        type: integer
        source: computed
        description: "Output of calculations.ride_system_hourly_capacity variant theoretical_design"
      - name: operational_hourly_capacity_guests
        type: integer
        source: computed
        description: "Output of calculations.ride_system_hourly_capacity variant operational_derated"
      - name: safety_standard
        type: enum
        source: input
        default: null
        description: Design standard declared when the system is marked engineered
        constraints: "ASTM_F2291 | EN_13814"
      - name: control_system_spec_ref
        type: string
        source: input
        default: null
        description: Control-system specification document reference recorded at mark-engineered
        constraints: 1-64 chars when present
      - name: status
        type: enum
        source: computed
        default: CANDIDATE
        description: Ride system lifecycle state
        constraints: "CANDIDATE | SELECTED | ENGINEERED | COMMISSIONED"

  - name: QueueSegment
    parent: AttractionProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program whose queue this segment belongs to
      - name: segment_label
        type: string
        source: input
        description: Queue segment name used on the routing drawing
        constraints: 1-80 chars
      - name: length_meters
        type: number
        source: input
        description: Centre-line length of the switchback run
        constraints: "> 0, at most 2 decimal places"
      - name: width_meters
        type: number
        source: input
        description: Clear width of the run
        constraints: "> 0, at most 2 decimal places; >= 1.10 for STANDARD, >= 1.80 for ACCESSIBLE and VIRTUAL_RETURN"
      - name: routing_type
        type: enum
        source: input
        description: Routing class, which selects the per-guest area constant
        constraints: "STANDARD | ACCESSIBLE | VIRTUAL_RETURN"
      - name: position_index
        type: integer
        source: input
        description: Order of the segment along the queue path, unique per project
        constraints: ">= 1"
      - name: capacity_guests
        type: integer
        source: computed
        description: "Output of calculations.queue_segment_capacity"
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: Queue segment lifecycle state
        constraints: "PROPOSED | ACCEPTED | RETIRED"

  - name: ShowScene
    parent: AttractionProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program this scene belongs to
      - name: scene_label
        type: string
        source: input
        description: Scene name in the storyline beat sheet
        constraints: 1-80 chars
      - name: sequence_index
        type: integer
        source: input
        description: Running-order position of the scene, unique across all ShowScene rows of the same project
        constraints: ">= 1"
      - name: duration_seconds
        type: integer
        source: input
        description: Show duration of the scene, used as the weight in the project show-quality roll-up
        constraints: ">= 1"
      - name: follows_scene_id
        type: string
        source: input
        default: null
        description: FK -> ShowScene.id; the scene immediately preceding this one in the running order. Null for the opening scene. The chain must stay acyclic.
      - name: lighting_score
        type: number
        source: input
        default: null
        description: Lighting discipline show-quality score recorded at programming
        constraints: ">= 0 and <= 100, at most 2 decimal places"
      - name: audio_score
        type: number
        source: input
        default: null
        description: Audio discipline show-quality score recorded at programming
        constraints: ">= 0 and <= 100, at most 2 decimal places"
      - name: animation_score
        type: number
        source: input
        default: null
        description: Animation discipline show-quality score recorded at programming
        constraints: ">= 0 and <= 100, at most 2 decimal places"
      - name: effects_score
        type: number
        source: input
        default: null
        description: Special-effects discipline show-quality score recorded at programming
        constraints: ">= 0 and <= 100, at most 2 decimal places"
      - name: scene_quality_score
        type: number
        source: computed
        default: null
        description: "Output of calculations.show_scene_quality_score, 2 decimal places; null until the scene is programmed"
      - name: validating_rehearsal_run_id
        type: string
        source: input
        default: null
        description: FK -> RehearsalRun.id; the completed rehearsal run cited when the scene was validated
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Scene lifecycle state
        constraints: "DRAFT | SEQUENCED | PROGRAMMED | VALIDATED | HELD"
      - name: held_from_status
        type: enum
        source: computed
        default: null
        description: Status the scene occupied immediately before a freeze cascade moved it to HELD; the release cascade restores exactly this value
        constraints: "SEQUENCED | PROGRAMMED | VALIDATED"
      - name: hold_reason
        type: enum
        source: computed
        default: null
        description: Why the scene is HELD
        constraints: "SAFETY_FREEZE | BUDGET_FREEZE"

  - name: EffectCue
    parent: ShowScene
    common_fields: true
    fields:
      - name: scene_id
        type: string
        source: input
        description: FK -> ShowScene.id; the scene whose show timeline this cue occupies
      - name: cue_label
        type: string
        source: input
        description: Cue name in the programming console
        constraints: 1-80 chars
      - name: discipline_channel
        type: enum
        source: input
        description: Technical discipline channel the cue occupies; ANIMATION and SPECIAL_EFFECT channels carry a mandatory interlock buffer
        constraints: "LIGHTING | AUDIO | MEDIA | ANIMATION | SPECIAL_EFFECT"
      - name: offset_ms
        type: integer
        source: input
        description: Cue start offset from scene time zero in milliseconds
        constraints: ">= 0"
      - name: duration_ms
        type: integer
        source: input
        description: Cue duration in milliseconds
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        default: PLANNED
        description: Cue programming state
        constraints: "PLANNED | VERIFIED"

  - name: DesignPackage
    parent: AttractionProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program this design package prices
      - name: ride_system_id
        type: string
        source: input
        description: FK -> RideSystem.id; the ride system this package is coordinated against. Must belong to project_id.
      - name: package_label
        type: string
        source: input
        description: Package name on the drawing set cover sheet
        constraints: 1-80 chars
      - name: discipline_scope
        type: enum
        source: input
        description: Scope band the package covers
        constraints: "SHOW_SET | RIDE_AND_CONTROLS | MEDIA_AND_AV | INTEGRATED"
      - name: base_construction_cost_cents
        type: integer
        source: input
        description: Estimated base construction cost before design fee and contingency
        constraints: ">= 1"
      - name: design_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.design_package_cost_of_work step 2"
      - name: contingency_cents
        type: integer
        source: computed
        description: "Output of calculations.design_package_cost_of_work step 3"
      - name: total_cost_of_work_cents
        type: integer
        source: computed
        description: "Output of calculations.design_package_cost_of_work step 4"
      - name: pinned_ride_system_version
        type: integer
        source: computed
        default: null
        description: RideSystem.version captured at submit time; approval is rejected when the ride system has advanced past this value
      - name: submitted_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the actor whose submit call moved the package to SUBMITTED; segregation of duties compares it against the approver
      - name: approved_by_user_id
        type: string
        source: computed
        default: null
        description: X-User-ID of the actor who approved the package
      - name: revision_round
        type: integer
        source: computed
        default: 0
        description: Number of completed revision loops; incremented each time the package re-enters SUBMITTED after a revision request
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Design package lifecycle state
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | SUPERSEDED"

  - name: SafetyReview
    parent: DesignPackage
    common_fields: true
    fields:
      - name: design_package_id
        type: string
        source: input
        description: FK -> DesignPackage.id; the submitted or approved package under third-party review
      - name: standard_code
        type: enum
        source: input
        description: Standard the reviewer is assessing against
        constraints: "ASTM_F2291 | EN_13814"
      - name: reviewer_user_id
        type: string
        source: computed
        description: X-User-ID of the ThirdPartyReviewer who opened the review
      - name: open_finding_count
        type: integer
        source: computed
        default: 0
        description: Count of this review's SafetyFinding rows with status in {OPEN, RESOLVED}
      - name: cleared_at
        type: datetime
        source: computed
        default: null
        description: Logical-clock instant at which the review reached CLEARED
      - name: status
        type: enum
        source: computed
        default: IN_REVIEW
        description: Review lifecycle state
        constraints: "IN_REVIEW | FINDINGS_ISSUED | CLEARED"

  - name: SafetyFinding
    parent: SafetyReview
    common_fields: true
    fields:
      - name: safety_review_id
        type: string
        source: input
        description: FK -> SafetyReview.id; the review that raised this finding
      - name: severity
        type: enum
        source: input
        description: Finding severity; CRITICAL findings freeze the program and may never be waived
        constraints: "CRITICAL | MAJOR | MINOR"
      - name: description
        type: string
        source: input
        description: Non-conformance description
        constraints: 1-500 chars
      - name: remediation_cost_estimate_cents
        type: integer
        source: input
        description: Reviewer estimate of remediation cost, consumed by the forecast_basis budget variant
        constraints: ">= 0"
      - name: remediation_note
        type: string
        source: input
        default: null
        description: Contractor evidence recorded when the finding is resolved
        constraints: 1-500 chars when present
      - name: waiver_justification
        type: string
        source: input
        default: null
        description: Owner justification recorded when a non-critical finding is waived
        constraints: 1-500 chars when present
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: Finding lifecycle state
        constraints: "OPEN | RESOLVED | CLOSED | WAIVED"

  - name: ValueEngineeringItem
    parent: AttractionProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program the saving is proposed against
      - name: title
        type: string
        source: input
        description: Value-engineering proposal title
        constraints: 1-120 chars
      - name: gross_saving_cents
        type: integer
        source: input
        description: Gross construction saving claimed before rework loss
        constraints: ">= 1"
      - name: rework_loss_pct
        type: number
        source: input
        description: Percent of the gross saving expected to be lost to rework and re-coordination
        constraints: ">= 0 and < 100, at most 2 decimal places"
      - name: implementation_cost_cents
        type: integer
        source: input
        description: Cost of implementing the proposal, subtracted after the per-item rounding step
        constraints: ">= 0"
      - name: capacity_impact_guests_per_hour
        type: integer
        source: input
        description: Signed change to the selected ride system's operational hourly capacity if adopted; negative values reduce capacity
      - name: scope_impact_delta_cents
        type: integer
        source: input
        description: Signed scope change the proposal implies; must equal implementation_cost_cents minus gross_saving_cents
      - name: net_saving_cents
        type: integer
        source: computed
        default: null
        description: "Output of calculations.ve_item_net_saving (per-item rounded, then implementation cost subtracted); null until the item leaves PROPOSED"
      - name: ballot_count
        type: integer
        source: computed
        default: 0
        description: Number of VEBallot rows cast against this item; the item resolves on the third ballot
      - name: veto_present
        type: boolean
        source: computed
        default: false
        description: True when at least one VEBallot for this item carries decision VETO
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: Value-engineering item lifecycle state
        constraints: "PROPOSED | UNDER_REVIEW | ADOPTED | REJECTED"

  - name: VEBallot
    parent: ValueEngineeringItem
    common_fields: false
    fields:
      - name: value_engineering_item_id
        type: string
        source: input
        description: FK -> ValueEngineeringItem.id; the item being balloted
      - name: party_role
        type: enum
        source: input
        description: Negotiating party casting the ballot; must equal the caller's X-User-Role
        constraints: "OwnerRep | ContractorPM | CreativeDirector"
      - name: decision
        type: enum
        source: input
        description: Ballot decision; VETO from any party rejects the item outright
        constraints: "APPROVE | ABSTAIN | VETO"
      - name: comment
        type: string
        source: input
        default: null
        description: Optional ballot rationale
        constraints: 1-300 chars when present
      - name: cast_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor who cast the ballot

  - name: RehearsalRun
    parent: AttractionProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program being rehearsed
      - name: run_kind
        type: enum
        source: input
        description: Rehearsal class; SOFT_OPEN runs validate the program for operations handoff
        constraints: "TECHNICAL_REHEARSAL | CAST_REHEARSAL | SOFT_OPEN"
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the occupied rehearsal window on the attraction
      - name: window_end_utc
        type: datetime
        source: input
        description: Inclusive end of the occupied rehearsal window on the attraction
        constraints: strictly after window_start_utc
      - name: guests_cycled
        type: integer
        source: input
        default: null
        description: Guests cycled through the attraction during the run, recorded at completion
        constraints: ">= 0"
      - name: duration_minutes
        type: integer
        source: input
        default: null
        description: Measured operating minutes during the run, recorded at completion
        constraints: ">= 1"
      - name: measured_hourly_throughput_guests
        type: integer
        source: computed
        default: null
        description: "Output of calculations.rehearsal_throughput_validation step 1"
      - name: pass_threshold_guests
        type: integer
        source: computed
        default: null
        description: "Output of calculations.rehearsal_throughput_validation step 2"
      - name: result
        type: enum
        source: computed
        default: null
        description: Validation outcome recorded at completion
        constraints: "PASS | FAIL"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: Rehearsal run lifecycle state
        constraints: "SCHEDULED | COMPLETED"

  - name: MaintenanceItem
    parent: AttractionProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program whose maintenance manual carries this item
      - name: part_number
        type: string
        source: input
        description: Vendor part number, unique per project
        constraints: 1-48 chars
      - name: description
        type: string
        source: input
        description: Maintenance procedure or spare part description
        constraints: 1-300 chars
      - name: criticality
        type: enum
        source: input
        description: Operational criticality band, which selects the stocking multiplier and floor
        constraints: "SHOW_CRITICAL | RUN_CRITICAL | NON_CRITICAL"
      - name: annual_consumption_rate
        type: number
        source: input
        description: Expected units consumed per operating year
        constraints: ">= 0, at most 2 decimal places"
      - name: lead_time_days
        type: integer
        source: input
        description: Vendor replenishment lead time in days
        constraints: ">= 0"
      - name: recommended_stock_qty
        type: integer
        source: computed
        description: "Output of calculations.spare_stock_recommendation"
      - name: stocked_qty
        type: integer
        source: input
        default: null
        description: Units actually stocked, recorded at approval
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: Maintenance item lifecycle state
        constraints: "DRAFT | APPROVED | HANDED_OVER"

  - name: BudgetLedgerEntry
    parent: AttractionProject
    common_fields: false
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> AttractionProject.id; the program whose cost ledger this entry belongs to
      - name: entry_kind
        type: enum
        source: input
        description: Ledger entry class. Only CHANGE_ORDER may be written directly by a client; COMMITMENT, VE_SAVING and REVERSAL are minted by side effects.
        constraints: "COMMITMENT | CHANGE_ORDER | VE_SAVING | REVERSAL"
      - name: amount_cents
        type: integer
        source: input
        description: Signed amount in cents; positive increases committed cost, negative decreases it
      - name: memo
        type: string
        source: input
        description: Ledger memo describing the entry
        constraints: 1-200 chars
      - name: sequence_no
        type: integer
        source: system
        description: Monotonic per-project ordinal starting at 1, minted from AttractionProject.ledger_sequence_high_water; the chronological replay in the committed_basis variant orders by created_at ASC then sequence_no ASC
      - name: reversed
        type: boolean
        source: computed
        default: false
        description: True once a REVERSAL entry has been minted against this entry; a second reversal attempt is rejected
      - name: reversal_of_sequence_no
        type: integer
        source: computed
        default: null
        description: For REVERSAL entries, the sequence_no of the reversed entry within the same project; null otherwise

state_machines:
  # --- AttractionProject carries TWO independent (parallel) state dimensions:
  #     design_phase (forward-only ladder) and readiness_posture (cyclic gate).
  - entity: AttractionProject
    dimension: design_phase
    initial_state: BLUE_SKY
    terminal_states: [OPERATIONS_HANDOVER]
    transitions:
      - from: BLUE_SKY
        to: CONCEPT
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=CONCEPT"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "at least one ShowScene row exists for this project (any status)"
        side_effects:
          - "design_phase := CONCEPT"
          - "increments AttractionProject.version by 1"
      - from: CONCEPT
        to: SCHEMATIC
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=SCHEMATIC"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "selected_ride_system_id is not null"
          - "at least two ShowScene rows of this project have status IN {SEQUENCED, PROGRAMMED, VALIDATED}"
        side_effects:
          - "design_phase := SCHEMATIC"
          - "increments AttractionProject.version by 1"
      - from: SCHEMATIC
        to: DESIGN_DEVELOPMENT
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=DESIGN_DEVELOPMENT"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "at least one DesignPackage of this project has status IN {SUBMITTED, APPROVED}"
        side_effects:
          - "design_phase := DESIGN_DEVELOPMENT"
          - "increments AttractionProject.version by 1"
      - from: DESIGN_DEVELOPMENT
        to: PRODUCTION
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=PRODUCTION"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "at least one DesignPackage of this project has status APPROVED"
          - "the RideSystem identified by selected_ride_system_id has operational_hourly_capacity_guests >= required_hourly_capacity_guests"
        side_effects:
          - "design_phase := PRODUCTION"
          - "increments AttractionProject.version by 1"
      - from: PRODUCTION
        to: INSTALLATION
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=INSTALLATION"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "open_critical_finding_count == 0"
          - "at least one SafetyReview with status CLEARED exists whose design_package_id points to a DesignPackage of this project with status APPROVED"
        side_effects:
          - "design_phase := INSTALLATION"
          - "increments AttractionProject.version by 1"
      - from: INSTALLATION
        to: TECHNICAL_REHEARSAL
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=TECHNICAL_REHEARSAL"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "the RideSystem identified by selected_ride_system_id has status COMMISSIONED"
          - "at least one QueueSegment of this project has status ACCEPTED and routing_type ACCESSIBLE"
          - "accessible share (sum of capacity_guests over ACCEPTED QueueSegment rows with routing_type ACCESSIBLE, divided by queue_capacity_total_guests, times 100, rounded half up to 2 decimals) >= MIN_ACCESSIBLE_SHARE_PCT"
        side_effects:
          - "design_phase := TECHNICAL_REHEARSAL"
          - "increments AttractionProject.version by 1"
      - from: TECHNICAL_REHEARSAL
        to: SOFT_OPEN
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=SOFT_OPEN"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "no ShowScene of this project has status IN {DRAFT, SEQUENCED, PROGRAMMED, HELD} (every scene is VALIDATED)"
          - "show_quality_score >= MIN_SHOW_QUALITY_SCORE"
        side_effects:
          - "design_phase := SOFT_OPEN"
          - "increments AttractionProject.version by 1"
      - from: SOFT_OPEN
        to: OPERATIONS_HANDOVER
        trigger: "POST /attraction-projects/{id}/advance-phase with to_phase=OPERATIONS_HANDOVER"
        actor: OwnerRep
        preconditions:
          - "readiness_posture != FROZEN"
          - "soft_open_validated == true"
          - "open_critical_finding_count == 0"
          - "at least one MaintenanceItem exists for this project and every MaintenanceItem of this project has status HANDED_OVER"
        side_effects:
          - "design_phase := OPERATIONS_HANDOVER"
          - "handover_accepted_at := current logical clock instant"
          - "increments AttractionProject.version by 1"
    note: "Forward-only ladder. Any to_phase that is not the immediate successor of the current design_phase is rejected with ERR_PHASE_SEQUENCE_INVALID, including backwards moves and skips."

  - entity: AttractionProject
    dimension: readiness_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: calculations.project_readiness_posture re-evaluated after any SafetyFinding write, BudgetLedgerEntry write, DesignPackage approval, ValueEngineeringItem resolution or PATCH /attraction-projects/{id}"
        actor: system
        preconditions:
          - "committed_cost_cents <= budget_ceiling_cents AND open_critical_finding_count == 0"
          - "open_major_finding_count > 0 OR committed_cost_cents > floor(budget_ceiling_cents * RESTRICTED_UTILISATION_PCT / 100)"
        side_effects:
          - "readiness_posture := RESTRICTED"
          - "increments AttractionProject.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: calculations.project_readiness_posture re-evaluated after the same writes"
        actor: system
        preconditions:
          - "open_major_finding_count == 0"
          - "open_critical_finding_count == 0"
          - "committed_cost_cents <= floor(budget_ceiling_cents * RESTRICTED_UTILISATION_PCT / 100)"
        side_effects:
          - "readiness_posture := OPEN"
          - "increments AttractionProject.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "system: calculations.project_readiness_posture re-evaluated after the same writes"
        actor: system
        preconditions:
          - "open_critical_finding_count > 0 OR committed_cost_cents > budget_ceiling_cents"
        side_effects:
          - "readiness_posture := FROZEN"
          - "cascade: every ShowScene of this project with status IN {SEQUENCED, PROGRAMMED, VALIDATED} moves to HELD, held_from_status := its status before the freeze, hold_reason := SAFETY_FREEZE when open_critical_finding_count > 0 else BUDGET_FREEZE"
          - "increments AttractionProject.version by 1 and each cascaded ShowScene.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: calculations.project_readiness_posture re-evaluated after the same writes"
        actor: system
        preconditions:
          - "open_critical_finding_count > 0 OR committed_cost_cents > budget_ceiling_cents"
        side_effects:
          - "readiness_posture := FROZEN"
          - "cascade: every ShowScene of this project with status IN {SEQUENCED, PROGRAMMED, VALIDATED} moves to HELD with held_from_status and hold_reason set as above"
          - "increments AttractionProject.version by 1 and each cascaded ShowScene.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system: calculations.project_readiness_posture re-evaluated after the same writes"
        actor: system
        preconditions:
          - "open_critical_finding_count == 0 AND committed_cost_cents <= budget_ceiling_cents"
          - "open_major_finding_count > 0 OR committed_cost_cents > floor(budget_ceiling_cents * RESTRICTED_UTILISATION_PCT / 100)"
        side_effects:
          - "readiness_posture := RESTRICTED"
          - "cascade: every ShowScene of this project with status HELD returns to its held_from_status; held_from_status := null; hold_reason := null"
          - "increments AttractionProject.version by 1 and each cascaded ShowScene.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "system: calculations.project_readiness_posture re-evaluated after the same writes"
        actor: system
        preconditions:
          - "open_critical_finding_count == 0 AND open_major_finding_count == 0"
          - "committed_cost_cents <= floor(budget_ceiling_cents * RESTRICTED_UTILISATION_PCT / 100)"
        side_effects:
          - "readiness_posture := OPEN"
          - "cascade: every ShowScene of this project with status HELD returns to its held_from_status; held_from_status := null; hold_reason := null"
          - "increments AttractionProject.version by 1 and each cascaded ShowScene.version by 1"
    note: "Parallel dimension: readiness_posture evolves independently of design_phase and is never advanced by a client call. It is recomputed inside the same request that changed its inputs (consistency_model: immediate)."

  - entity: RideSystem
    initial_state: CANDIDATE
    terminal_states: [COMMISSIONED]
    transitions:
      - from: CANDIDATE
        to: SELECTED
        trigger: "POST /ride-systems/{id}/select"
        actor: OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "expected_project_version equals the current AttractionProject.version"
          - "no other RideSystem of the same project has status IN {ENGINEERED, COMMISSIONED}"
          - "operational_hourly_capacity_guests >= AttractionProject.required_hourly_capacity_guests"
        side_effects:
          - "status := SELECTED"
          - "cascade: any other RideSystem of the same project with status SELECTED moves back to CANDIDATE and its version increments by 1"
          - "AttractionProject.selected_ride_system_id := this RideSystem.id"
          - "increments AttractionProject.version by 1"
      - from: SELECTED
        to: CANDIDATE
        trigger: "system: another RideSystem of the same project is selected via POST /ride-systems/{id}/select"
        actor: system
        preconditions:
          - "this RideSystem currently holds status SELECTED"
        side_effects:
          - "status := CANDIDATE"
          - "increments RideSystem.version by 1"
      - from: SELECTED
        to: ENGINEERED
        trigger: "POST /ride-systems/{id}/mark-engineered"
        actor: RideEngineer
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "AttractionProject.design_phase IN {SCHEMATIC, DESIGN_DEVELOPMENT, PRODUCTION}"
        side_effects:
          - "safety_standard := request safety_standard"
          - "control_system_spec_ref := request control_system_spec_ref"
          - "status := ENGINEERED"
          - "increments RideSystem.version by 1"
      - from: ENGINEERED
        to: COMMISSIONED
        trigger: "POST /ride-systems/{id}/commission"
        actor: RideEngineer
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "AttractionProject.design_phase == INSTALLATION"
          - "AttractionProject.open_critical_finding_count == 0"
          - "at least one SafetyReview with status CLEARED exists whose design_package_id points to a DesignPackage with status APPROVED and ride_system_id == this RideSystem.id"
        side_effects:
          - "status := COMMISSIONED"
          - "increments RideSystem.version by 1"

  - entity: QueueSegment
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /queue-segments/{id}/accept"
        actor: OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "expected_project_version equals the current AttractionProject.version"
          - "AttractionProject.virtual_queue_share_pct <= MAX_VIRTUAL_QUEUE_SHARE_PCT"
        side_effects:
          - "status := ACCEPTED"
          - "AttractionProject.queue_capacity_total_guests := AttractionProject.queue_capacity_total_guests + capacity_guests"
          - "increments AttractionProject.version by 1"
      - from: ACCEPTED
        to: RETIRED
        trigger: "POST /queue-segments/{id}/retire"
        actor: OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "expected_project_version equals the current AttractionProject.version"
        side_effects:
          - "status := RETIRED"
          - "AttractionProject.queue_capacity_total_guests := AttractionProject.queue_capacity_total_guests - capacity_guests (compensating action for the accept above)"
          - "increments AttractionProject.version by 1"

  - entity: ShowScene
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SEQUENCED
        trigger: "POST /show-scenes/{id}/sequence"
        actor: CreativeDirector
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "the requested sequence_index is not held by another ShowScene of the same project"
          - "following follows_scene_id links from the requested predecessor never reaches this scene (acyclic chain)"
        side_effects:
          - "sequence_index := request sequence_index"
          - "follows_scene_id := request follows_scene_id"
          - "status := SEQUENCED"
          - "increments ShowScene.version by 1"
      - from: SEQUENCED
        to: PROGRAMMED
        trigger: "POST /show-scenes/{id}/program"
        actor: ShowProgrammer
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "at least one EffectCue exists for this scene and every EffectCue of this scene has status VERIFIED"
        side_effects:
          - "lighting_score, audio_score, animation_score, effects_score := request values"
          - "scene_quality_score := calculations.show_scene_quality_score"
          - "status := PROGRAMMED"
          - "AttractionProject.show_quality_score := calculations.project_show_quality_score"
          - "increments ShowScene.version by 1 and AttractionProject.version by 1"
      - from: PROGRAMMED
        to: VALIDATED
        trigger: "POST /show-scenes/{id}/validate"
        actor: ShowProgrammer
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "the RehearsalRun named by rehearsal_run_id has project_id == this scene's project_id, status COMPLETED and result PASS"
        side_effects:
          - "validating_rehearsal_run_id := request rehearsal_run_id"
          - "status := VALIDATED"
          - "increments ShowScene.version by 1"
      - from: SEQUENCED
        to: HELD
        trigger: "system: AttractionProject.readiness_posture entered FROZEN"
        actor: system
        preconditions:
          - "the owning AttractionProject transitioned into FROZEN in this request"
        side_effects:
          - "held_from_status := SEQUENCED; hold_reason := SAFETY_FREEZE or BUDGET_FREEZE per the freeze cause"
          - "status := HELD"
          - "increments ShowScene.version by 1"
      - from: PROGRAMMED
        to: HELD
        trigger: "system: AttractionProject.readiness_posture entered FROZEN"
        actor: system
        preconditions:
          - "the owning AttractionProject transitioned into FROZEN in this request"
        side_effects:
          - "held_from_status := PROGRAMMED; hold_reason := SAFETY_FREEZE or BUDGET_FREEZE per the freeze cause"
          - "status := HELD"
          - "increments ShowScene.version by 1"
      - from: VALIDATED
        to: HELD
        trigger: "system: AttractionProject.readiness_posture entered FROZEN"
        actor: system
        preconditions:
          - "the owning AttractionProject transitioned into FROZEN in this request"
        side_effects:
          - "held_from_status := VALIDATED; hold_reason := SAFETY_FREEZE or BUDGET_FREEZE per the freeze cause"
          - "status := HELD"
          - "increments ShowScene.version by 1"
      - from: HELD
        to: SEQUENCED
        trigger: "system: AttractionProject.readiness_posture left FROZEN"
        actor: system
        preconditions:
          - "held_from_status == SEQUENCED"
        side_effects:
          - "status := SEQUENCED; held_from_status := null; hold_reason := null"
          - "increments ShowScene.version by 1"
      - from: HELD
        to: PROGRAMMED
        trigger: "system: AttractionProject.readiness_posture left FROZEN"
        actor: system
        preconditions:
          - "held_from_status == PROGRAMMED"
        side_effects:
          - "status := PROGRAMMED; held_from_status := null; hold_reason := null"
          - "increments ShowScene.version by 1"
      - from: HELD
        to: VALIDATED
        trigger: "system: AttractionProject.readiness_posture left FROZEN"
        actor: system
        preconditions:
          - "held_from_status == VALIDATED"
        side_effects:
          - "status := VALIDATED; held_from_status := null; hold_reason := null"
          - "increments ShowScene.version by 1"
    note: "Cyclic: PROGRAMMED -> HELD -> PROGRAMMED is a full loop, and the release target is pinned by held_from_status rather than by a fixed state, so a VALIDATED scene never regresses to PROGRAMMED after a freeze."

  - entity: EffectCue
    initial_state: PLANNED
    terminal_states: [VERIFIED]
    transitions:
      - from: PLANNED
        to: VERIFIED
        trigger: "POST /effect-cues/{id}/verify"
        actor: ShowProgrammer
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "the owning ShowScene has status IN {DRAFT, SEQUENCED}"
        side_effects:
          - "status := VERIFIED"
          - "increments EffectCue.version by 1"

  - entity: DesignPackage
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /design-packages/{id}/submit"
        actor: CreativeDirector | OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
        side_effects:
          - "pinned_ride_system_version := current version of the RideSystem named by ride_system_id"
          - "submitted_by_user_id := caller X-User-ID"
          - "status := SUBMITTED"
          - "increments DesignPackage.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /design-packages/{id}/submit"
        actor: CreativeDirector | OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
        side_effects:
          - "revision_round := revision_round + 1"
          - "pinned_ride_system_version := current version of the RideSystem named by ride_system_id"
          - "submitted_by_user_id := caller X-User-ID"
          - "status := SUBMITTED"
          - "increments DesignPackage.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /design-packages/{id}/request-revision"
        actor: OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
        side_effects:
          - "status := REVISION_REQUESTED"
          - "increments DesignPackage.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /design-packages/{id}/approve"
        actor: OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "caller X-User-ID != submitted_by_user_id (segregation of duties)"
          - "pinned_ride_system_version equals the current version of the RideSystem named by ride_system_id"
          - "expected_package_version equals the current DesignPackage.version"
          - "AttractionProject.committed_cost_cents + total_cost_of_work_cents <= AttractionProject.budget_ceiling_cents"
        side_effects:
          - "approved_by_user_id := caller X-User-ID"
          - "status := APPROVED"
          - "cascade: any other DesignPackage of the same project with status APPROVED moves to SUPERSEDED and its version increments by 1"
          - "cascade: a BudgetLedgerEntry is minted with entry_kind COMMITMENT, amount_cents := total_cost_of_work_cents, sequence_no := AttractionProject.ledger_sequence_high_water + 1, memo := 'COMMITMENT for design package ' + package_label"
          - "cascade: AttractionProject.committed_cost_cents and forecast_cost_cents recomputed by calculations.project_budget_position"
          - "cascade: AttractionProject.readiness_posture recomputed by calculations.project_readiness_posture, which may itself cascade ShowScene freezes"
          - "increments DesignPackage.version by 1 and AttractionProject.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: another DesignPackage of the same project is approved via POST /design-packages/{id}/approve"
        actor: system
        preconditions:
          - "this DesignPackage currently holds status APPROVED"
        side_effects:
          - "status := SUPERSEDED"
          - "increments DesignPackage.version by 1"
    note: "Cyclic revision loop: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED, with revision_round counting completed loops and pinned_ride_system_version re-pinned on every submit."

  - entity: SafetyReview
    initial_state: IN_REVIEW
    terminal_states: [CLEARED]
    transitions:
      - from: IN_REVIEW
        to: FINDINGS_ISSUED
        trigger: "system: first SafetyFinding created for this review via POST /safety-findings"
        actor: system
        preconditions:
          - "the created finding is the first SafetyFinding row of this review"
        side_effects:
          - "status := FINDINGS_ISSUED"
          - "open_finding_count := open_finding_count + 1"
          - "increments SafetyReview.version by 1"
      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /safety-reviews/{id}/clear"
        actor: ThirdPartyReviewer
        preconditions:
          - "open_finding_count == 0 (empty finding set)"
        side_effects:
          - "cleared_at := current logical clock instant"
          - "status := CLEARED"
          - "increments SafetyReview.version by 1"
      - from: FINDINGS_ISSUED
        to: CLEARED
        trigger: "POST /safety-reviews/{id}/clear"
        actor: ThirdPartyReviewer
        preconditions:
          - "open_finding_count == 0, i.e. every SafetyFinding of this review has status IN {CLOSED, WAIVED}"
        side_effects:
          - "cleared_at := current logical clock instant"
          - "status := CLEARED"
          - "increments SafetyReview.version by 1"
    note: "Branching join: the review reaches CLEARED either from the zero-finding path or after every finding is closed or waived."

  - entity: SafetyFinding
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /safety-findings/{id}/resolve"
        actor: ContractorPM
        preconditions:
          - "the owning SafetyReview has status FINDINGS_ISSUED"
        side_effects:
          - "remediation_note := request remediation_note"
          - "status := RESOLVED"
          - "increments SafetyFinding.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /safety-findings/{id}/close"
        actor: ThirdPartyReviewer
        preconditions:
          - "the owning SafetyReview has status FINDINGS_ISSUED"
        side_effects:
          - "status := CLOSED"
          - "cascade: SafetyReview.open_finding_count := open_finding_count - 1"
          - "cascade: AttractionProject.open_critical_finding_count / open_major_finding_count recomputed for severity CRITICAL / MAJOR"
          - "cascade: AttractionProject.readiness_posture recomputed, which may leave FROZEN and release HELD ShowScene rows"
          - "increments SafetyFinding.version, SafetyReview.version and AttractionProject.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /safety-findings/{id}/waive"
        actor: OwnerRep
        preconditions:
          - "severity != CRITICAL"
          - "the owning SafetyReview has status FINDINGS_ISSUED"
        side_effects:
          - "waiver_justification := request justification"
          - "status := WAIVED"
          - "cascade: SafetyReview.open_finding_count := open_finding_count - 1"
          - "cascade: AttractionProject.open_major_finding_count recomputed when severity is MAJOR"
          - "cascade: AttractionProject.readiness_posture recomputed"
          - "increments SafetyFinding.version, SafetyReview.version and AttractionProject.version by 1"
    note: "Branching: OPEN forks to the remediation path (RESOLVED -> CLOSED) or the owner-waiver path (WAIVED), with divergent side-effect sets; CRITICAL findings may only take the remediation path."

  - entity: ValueEngineeringItem
    initial_state: PROPOSED
    terminal_states: [ADOPTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: UNDER_REVIEW
        trigger: "POST /value-engineering-items/{id}/open-review"
        actor: OwnerRep
        preconditions:
          - "scope_impact_delta_cents == implementation_cost_cents - gross_saving_cents"
          - "AttractionProject.design_phase IN {SCHEMATIC, DESIGN_DEVELOPMENT, PRODUCTION, INSTALLATION}"
        side_effects:
          - "net_saving_cents := calculations.ve_item_net_saving for this item"
          - "status := UNDER_REVIEW"
          - "cascade: AttractionProject.forecast_cost_cents recomputed by calculations.project_budget_position variant forecast_basis"
          - "increments ValueEngineeringItem.version by 1 and AttractionProject.version by 1"
      - from: UNDER_REVIEW
        to: ADOPTED
        trigger: "system: the third VEBallot for this item is cast via POST /ve-ballots"
        actor: system
        preconditions:
          - "ballot_count == 3 after this ballot"
          - "veto_present == false"
          - "at least 2 of the 3 ballots carry decision APPROVE"
          - "the RideSystem named by AttractionProject.selected_ride_system_id keeps operational_hourly_capacity_guests + capacity_impact_guests_per_hour >= AttractionProject.required_hourly_capacity_guests"
        side_effects:
          - "status := ADOPTED"
          - "cascade: a BudgetLedgerEntry is minted with entry_kind VE_SAVING, amount_cents := 0 - net_saving_cents, sequence_no := AttractionProject.ledger_sequence_high_water + 1, memo := 'VE_SAVING for ' + title"
          - "cascade: AttractionProject.committed_cost_cents and forecast_cost_cents recomputed by calculations.project_budget_position"
          - "cascade: AttractionProject.readiness_posture recomputed, which may leave FROZEN and release HELD ShowScene rows"
          - "increments ValueEngineeringItem.version by 1 and AttractionProject.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system: a VEBallot with decision VETO is cast, or the third VEBallot leaves fewer than 2 APPROVE decisions"
        actor: system
        preconditions:
          - "the ballot just cast carries decision VETO, OR ballot_count == 3 after this ballot with fewer than 2 APPROVE decisions"
        side_effects:
          - "veto_present := true when the resolving ballot was a VETO"
          - "status := REJECTED"
          - "cascade: AttractionProject.forecast_cost_cents recomputed (the item leaves the in-flight savings set)"
          - "increments ValueEngineeringItem.version by 1 and AttractionProject.version by 1"
    note: "Branching fork with quorum: a VETO short-circuits to REJECTED without waiting for a third ballot, while ADOPTED requires the full three-party quorum plus a 2-of-3 APPROVE majority; the two branches carry different side-effect sets (only ADOPTED writes the ledger)."

  - entity: RehearsalRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rehearsal-runs/{id}/complete"
        actor: ContractorPM
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "the current logical clock instant is at or after window_end_utc"
          - "AttractionProject.selected_ride_system_id is not null"
        side_effects:
          - "guests_cycled and duration_minutes := request values"
          - "measured_hourly_throughput_guests, pass_threshold_guests and result := calculations.rehearsal_throughput_validation"
          - "status := COMPLETED"
          - "cascade: when run_kind == SOFT_OPEN and result == PASS, AttractionProject.soft_open_validated := true and AttractionProject.version increments by 1"
          - "increments RehearsalRun.version by 1"

  - entity: MaintenanceItem
    initial_state: DRAFT
    terminal_states: [HANDED_OVER]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /maintenance-items/{id}/approve"
        actor: RideEngineer
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "request stocked_qty >= recommended_stock_qty"
        side_effects:
          - "stocked_qty := request stocked_qty"
          - "status := APPROVED"
          - "increments MaintenanceItem.version by 1"
      - from: APPROVED
        to: HANDED_OVER
        trigger: "POST /maintenance-items/{id}/hand-over"
        actor: OwnerRep
        preconditions:
          - "AttractionProject.readiness_posture != FROZEN"
          - "AttractionProject.design_phase == SOFT_OPEN"
          - "AttractionProject.soft_open_validated == true"
        side_effects:
          - "status := HANDED_OVER"
          - "increments MaintenanceItem.version by 1"

concurrency_rules:
  - rule_id: package-create-stale-project
    parent_entity: AttractionProject
    write_endpoint: "POST /design-packages"
    occ_field: "expected_project_version"
    description: |
      Creating a DesignPackage against an AttractionProject whose version has
      advanced since the client last read it is rejected. A new package
      legitimately competes with any other package already in flight for the
      same project (approval supersedes the previously approved package), so
      the second sequential create would otherwise succeed on identical state;
      the OCC check pins the create to the exact project version the pricing
      assumptions were derived from.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: review-create-stale-package
    parent_entity: DesignPackage
    write_endpoint: "POST /safety-reviews"
    occ_field: "expected_package_version"
    description: |
      Opening a SafetyReview against a DesignPackage whose version has advanced
      since the reviewer last read it is rejected. A package may legitimately
      carry several reviews against different standard_code values, so a second
      sequential create observes identical package state and would otherwise
      succeed; the OCC check guarantees the reviewer assessed the exact package
      revision recorded in the review.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

  - rule_id: ride-select-stale-project
    parent_entity: AttractionProject
    write_endpoint: "POST /ride-systems/{id}/select"
    occ_field: "expected_project_version"
    description: |
      Selecting a RideSystem while carrying a stale AttractionProject.version is
      rejected. Selection legitimately supersedes the previously SELECTED
      candidate (that row cascades back to CANDIDATE), so the second sequential
      select sees state it may legally overwrite and would otherwise succeed;
      the OCC check forces the owner to re-read the project — including its
      required_hourly_capacity_guests — before overriding the earlier choice.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

calculations:
  - name: project_required_hourly_capacity
    trigger: "On POST /attraction-projects and on any PATCH /attraction-projects/{id} that changes design_day_attendance or peak_hour_share"
    algorithm: threshold
    formula: |
      required_hourly_capacity_guests =
          ceil(design_day_attendance * peak_hour_share)
      # peak_hour_share is evaluated as an exact decimal (never binary float),
      # so 10850 * 0.10 is exactly 1085 and ceil leaves it at 1085.
    input_set: "The single AttractionProject row being written; no other entity participates."
    constants: {}
    precision: "integer guests, ROUND_CEILING applied once to the exact decimal product"

  - name: ride_system_hourly_capacity
    trigger: "On POST /ride-systems and on any PATCH /ride-systems/{id} that changes vehicle_count, riders_per_vehicle, block_zone_count, cycle_time_seconds, availability_pct, load_efficiency_pct or show_stops_per_hour"
    algorithm: threshold
    formula: |
      # step 1 - vehicles the control system can actually keep in service
      vehicles_in_service   = min(vehicle_count, block_zone_count - 1)
      # step 2 - dispatch interval, floored by the control-system minimum
      dispatch_interval_seconds =
          max(MIN_DISPATCH_INTERVAL_SECONDS,
              ceil(cycle_time_seconds / vehicles_in_service))
      # step 3 - theoretical ride hourly capacity (variant theoretical_design)
      theoretical_hourly_capacity_guests =
          floor(3600 / dispatch_interval_seconds) * riders_per_vehicle
      # step 4 - operational derate (variant operational_derated)
      raw_derate    = (availability_pct / 100) * (load_efficiency_pct / 100)
      stop_penalty  = min(MAX_SHOW_STOP_PENALTY,
                          show_stops_per_hour * SHOW_STOP_PENALTY_EACH)
      derate        = max(MIN_DERATE_FACTOR, raw_derate - stop_penalty)
      operational_hourly_capacity_guests =
          floor(theoretical_hourly_capacity_guests * derate)
      # Evaluation order is pinned: the penalty cap (min) is applied BEFORE the
      # derate floor (max), so a system with many show stops lands on
      # MIN_DERATE_FACTOR rather than on raw_derate - MAX_SHOW_STOP_PENALTY.
    input_set: "The single RideSystem row being written. Capacity is recomputed on every write regardless of status, so a CANDIDATE and a COMMISSIONED row are computed identically."
    constants:
      MIN_DISPATCH_INTERVAL_SECONDS: 20
      SHOW_STOP_PENALTY_EACH: 0.03
      MAX_SHOW_STOP_PENALTY: 0.20
      MIN_DERATE_FACTOR: 0.35
    precision: "integer guests per hour; ROUND_FLOOR at step 3 and step 4; intermediate factors carried as exact decimals with no intermediate rounding"
    variants:
      - name: theoretical_design
        when: "Quoted in the vendor design submittal and surfaced as RideSystem.theoretical_hourly_capacity_guests and in GET /attraction-projects/{id}/capacity-summary"
        difference: "Stops after step 3: no availability, load-efficiency or show-stop derate is applied."
      - name: operational_derated
        when: "The only variant the gates use: the select precondition, the DESIGN_DEVELOPMENT -> PRODUCTION advance and calculations.rehearsal_throughput_validation all read operational_hourly_capacity_guests"
        difference: "Multiplies the step-3 result by the capped-and-floored derate, so the same RideSystem row reports two different capacities in the same response."

  - name: queue_segment_capacity
    trigger: "On POST /queue-segments"
    algorithm: aggregation
    formula: |
      per_guest_area_sqm = STANDARD_GUEST_AREA_SQM      when routing_type == STANDARD
                           ACCESSIBLE_GUEST_AREA_SQM    when routing_type == ACCESSIBLE
                           VIRTUAL_RETURN_GUEST_AREA_SQM when routing_type == VIRTUAL_RETURN
      capacity_guests = floor((length_meters * width_meters) / per_guest_area_sqm)
    input_set: "The single QueueSegment row being created."
    constants:
      STANDARD_GUEST_AREA_SQM: 0.65
      ACCESSIBLE_GUEST_AREA_SQM: 1.50
      VIRTUAL_RETURN_GUEST_AREA_SQM: 0.90
    precision: "integer guests, ROUND_FLOOR; area carried as an exact decimal"

  - name: project_queue_position
    trigger: "On POST /queue-segments/{id}/accept, POST /queue-segments/{id}/retire, and on every GET /attraction-projects/{id}/capacity-summary read"
    algorithm: aggregation
    formula: |
      queue_capacity_total_guests =
          sum(capacity_guests) over QueueSegment rows of the project
          whose status == ACCEPTED            # PROPOSED and RETIRED excluded
      accessible_capacity_guests =
          sum(capacity_guests) over the same set filtered to routing_type == ACCESSIBLE
      accessible_share_pct =
          0.00 when queue_capacity_total_guests == 0
          else round_half_up(accessible_capacity_guests
                             / queue_capacity_total_guests * 100, 2)
      virtual_queue_allocation_guests =
          floor(queue_capacity_total_guests * virtual_queue_share_pct / 100)
      posted_wait_minutes =
          0.0 when selected_ride_system_id is null
                    or the selected RideSystem.operational_hourly_capacity_guests == 0
          else round_half_up(queue_capacity_total_guests
                             / selected_ride_system.operational_hourly_capacity_guests
                             * 60, 1)
    input_set: "QueueSegment rows of the project with status ACCEPTED, plus the RideSystem named by AttractionProject.selected_ride_system_id."
    constants:
      MIN_ACCESSIBLE_SHARE_PCT: 15
      MAX_VIRTUAL_QUEUE_SHARE_PCT: 40
    precision: "queue_capacity_total_guests and virtual_queue_allocation_guests integer (ROUND_FLOOR); accessible_share_pct 2 decimals round_half_up; posted_wait_minutes 1 decimal round_half_up"

  - name: design_package_cost_of_work
    trigger: "On POST /design-packages and on POST /design-packages/{id}/revise"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (the formula looks circular because the total
      # depends on the fee and the fee depends on a tier; the tier is keyed on
      # base_construction_cost_cents ONLY, never on the running total):
      # step 1 - tier lookup on base_construction_cost_cents
      if    base_construction_cost_cents <= TIER1_BASE_CEILING_CENTS:
                design_fee_pct = 0.12 ; contingency_pct = 0.15
      elif  base_construction_cost_cents <= TIER2_BASE_CEILING_CENTS:
                design_fee_pct = 0.10 ; contingency_pct = 0.12
      else:     design_fee_pct = 0.085; contingency_pct = 0.10
      # step 2 - design fee on the base only
      design_fee_cents  = round_half_up(base_construction_cost_cents * design_fee_pct)
      # step 3 - contingency on base + fee (fee is inside the contingency base)
      contingency_cents = round_half_up((base_construction_cost_cents
                                         + design_fee_cents) * contingency_pct)
      # step 4 - total
      total_cost_of_work_cents = base_construction_cost_cents
                                 + design_fee_cents + contingency_cents
      # Because the tier is keyed on the base, a base of 2_500_000_001 lands in
      # the cheapest tier and yields a SMALLER total (2_983_750_001) than a base
      # of 2_500_000_000 (3_080_000_000).
    input_set: "The single DesignPackage row being written; no sibling package, ledger entry or project field participates."
    constants:
      TIER1_BASE_CEILING_CENTS: 500000000
      TIER2_BASE_CEILING_CENTS: 2500000000
    precision: "integer cents, round_half_up applied once per step (step 2 then step 3); never re-round the total"

  - name: project_budget_position
    trigger: "On POST /design-packages/{id}/approve, POST /budget-ledger-entries, POST /budget-ledger-entries/{id}/reverse, POST /value-engineering-items/{id}/open-review, POST /ve-ballots that resolves an item, POST /safety-findings, POST /safety-findings/{id}/resolve, POST /safety-findings/{id}/close, POST /safety-findings/{id}/waive, PATCH /attraction-projects/{id}, and on every GET /attraction-projects/{id}/budget-position read"
    algorithm: chronological
    formula: |
      # variant committed_basis -- chronological replay of the ledger
      running = 0
      for entry in BudgetLedgerEntry rows of the project
                   ordered by created_at ASC, then sequence_no ASC:
          running = running + entry.amount_cents        # REVERSAL rows are negative
      committed_cost_cents = running
      # variant forecast_basis -- forward-looking view over the same instant
      in_flight_ve_savings_cents =
          sum(net_saving_cents) over ValueEngineeringItem rows of the project
          whose status == UNDER_REVIEW                  # PROPOSED / ADOPTED / REJECTED excluded
      open_remediation_cents =
          sum(remediation_cost_estimate_cents) over SafetyFinding rows whose
          safety_review_id points to a SafetyReview of a DesignPackage of this
          project and whose status IN {OPEN, RESOLVED}   # CLOSED / WAIVED excluded
      forecast_cost_cents = committed_cost_cents
                            - in_flight_ve_savings_cents
                            + open_remediation_cents
      headroom_cents = budget_ceiling_cents - committed_cost_cents
    input_set: "committed_basis reads every BudgetLedgerEntry of the project with no status filter (an entry with reversed == true still contributes its original amount, and its REVERSAL twin contributes the negation). forecast_basis additionally reads UNDER_REVIEW ValueEngineeringItem rows and OPEN/RESOLVED SafetyFinding rows."
    constants:
      RESTRICTED_UTILISATION_PCT: 90
    precision: "integer cents; no rounding occurs because every input is already integral"
    variants:
      - name: committed_basis
        when: "Persisted as AttractionProject.committed_cost_cents and used by every gate: the approval ceiling check, the ledger ceiling check and calculations.project_readiness_posture"
        difference: "Chronological replay of realised ledger entries only; in-flight value-engineering savings and open safety remediation estimates are invisible to it."
      - name: forecast_basis
        when: "Persisted as AttractionProject.forecast_cost_cents and reported by GET /attraction-projects/{id}/budget-position; never used as a gate"
        difference: "Subtracts UNDER_REVIEW value-engineering net savings and adds OPEN/RESOLVED finding remediation estimates, so the same ledger yields a different number from committed_basis."

  - name: project_readiness_posture
    trigger: "Recomputed inside the same request as any write that changes committed_cost_cents, budget_ceiling_cents, open_critical_finding_count or open_major_finding_count"
    algorithm: threshold
    formula: |
      restricted_utilisation_cents =
          floor(budget_ceiling_cents * RESTRICTED_UTILISATION_PCT / 100)
      if open_critical_finding_count > 0
         or committed_cost_cents > budget_ceiling_cents:
             readiness_posture = FROZEN
      elif open_major_finding_count > 0
         or committed_cost_cents > restricted_utilisation_cents:
             readiness_posture = RESTRICTED
      else:
             readiness_posture = OPEN
      # Boundary: committed_cost_cents EQUAL to restricted_utilisation_cents is
      # OPEN (strict >), and committed_cost_cents EQUAL to budget_ceiling_cents
      # is not FROZEN (strict >).
    input_set: "The single AttractionProject row, using its already-recomputed committed_cost_cents and finding counters."
    constants:
      RESTRICTED_UTILISATION_PCT: 90
    precision: "integer cents threshold, ROUND_FLOOR on the utilisation threshold"

  - name: ve_item_net_saving
    trigger: "On POST /value-engineering-items/{id}/open-review (per item), and re-aggregated for the program on every GET /attraction-projects/{id}/budget-position"
    algorithm: aggregation
    formula: |
      # PER-ITEM value, pinned rounding ORDER: round each item's retained
      # saving to whole cents FIRST, then subtract its implementation cost.
      retained_saving_exact = gross_saving_cents * (1 - rework_loss_pct / 100)
      net_saving_cents = round_half_up(retained_saving_exact)
                         - implementation_cost_cents
      # PROGRAM value, reported as ve_program_net_savings_cents:
      ve_program_net_savings_cents =
          sum(net_saving_cents) over ValueEngineeringItem rows of the project
          whose status == ADOPTED
      # The scaffold pins round-per-item-then-sum. The rejected alternative
      # (sum the exact retained savings, round once, then subtract the summed
      # implementation costs) differs: two items whose exact retained savings
      # are 87_500_005.25 and 17_500_005.25 give 100_000_010 under the pinned
      # order and 100_000_011 under sum-then-round.
    input_set: "Per item: the single ValueEngineeringItem row. Per program: this project's ValueEngineeringItem rows with status ADOPTED (PROPOSED, UNDER_REVIEW and REJECTED excluded)."
    constants: {}
    precision: "integer cents, round_half_up applied once per item before the implementation-cost subtraction; the program sum is never re-rounded"

  - name: show_scene_quality_score
    trigger: "On POST /show-scenes/{id}/program"
    algorithm: weighted_scoring
    formula: |
      scene_quality_score = round_half_up(
            lighting_score  * LIGHTING_WEIGHT
          + audio_score     * AUDIO_WEIGHT
          + animation_score * ANIMATION_WEIGHT
          + effects_score   * EFFECTS_WEIGHT, 2)
      # weights sum to exactly 1.00
    input_set: "The four discipline scores supplied on the single ShowScene row being programmed."
    constants:
      LIGHTING_WEIGHT: 0.25
      AUDIO_WEIGHT: 0.20
      ANIMATION_WEIGHT: 0.30
      EFFECTS_WEIGHT: 0.25
    precision: "2 decimal places, round_half_up applied once to the weighted sum"

  - name: project_show_quality_score
    trigger: "On POST /show-scenes/{id}/program (recomputed for the owning project), and on every GET /attraction-projects/{id}/capacity-summary read"
    algorithm: weighted_scoring
    formula: |
      included = ShowScene rows of the project whose status IN {PROGRAMMED, VALIDATED}
                 # DRAFT, SEQUENCED and HELD scenes are excluded, so a freeze
                 # cascade changes the project score without touching any score field
      if included is empty:
          show_quality_score = 0.00
      else:
          show_quality_score = round_half_up(
              sum(scene.scene_quality_score * scene.duration_seconds for scene in included)
              / sum(scene.duration_seconds for scene in included), 2)
      # Duration-weighted mean of ALREADY-ROUNDED scene scores; the per-scene
      # round (2 dp) happens first and is never undone.
    input_set: "ShowScene rows of the project with status IN {PROGRAMMED, VALIDATED}; the empty set yields exactly 0.00."
    constants:
      MIN_SHOW_QUALITY_SCORE: 75.00
    precision: "2 decimal places, round_half_up applied once to the weighted mean"

  - name: rehearsal_throughput_validation
    trigger: "On POST /rehearsal-runs/{id}/complete"
    algorithm: threshold
    formula: |
      # step 1 - measured hourly throughput
      measured_hourly_throughput_guests =
          floor(guests_cycled * 60 / duration_minutes)
      # step 2 - pass threshold from the SELECTED ride system's derated capacity
      pass_threshold_guests =
          ceil(selected_ride_system.operational_hourly_capacity_guests
               * REHEARSAL_PASS_PCT / 100)
      # step 3 - inclusive comparison
      result = PASS  when measured_hourly_throughput_guests >= pass_threshold_guests
               FAIL  otherwise
    input_set: "The single RehearsalRun row being completed plus the RideSystem named by AttractionProject.selected_ride_system_id (its operational_derated capacity variant)."
    constants:
      REHEARSAL_PASS_PCT: 85
    precision: "integer guests per hour; ROUND_FLOOR at step 1, ROUND_CEILING at step 2; the comparison at step 3 is inclusive (>=)"

  - name: spare_stock_recommendation
    trigger: "On POST /maintenance-items"
    algorithm: threshold
    formula: |
      criticality_multiplier = 2.0 when criticality == SHOW_CRITICAL
                               1.5 when criticality == RUN_CRITICAL
                               1.0 when criticality == NON_CRITICAL
      criticality_floor_qty  = 2   when criticality == SHOW_CRITICAL
                               1   when criticality == RUN_CRITICAL
                               0   when criticality == NON_CRITICAL
      lead_time_demand = annual_consumption_rate * lead_time_days / DAYS_PER_YEAR
                         * criticality_multiplier
      recommended_stock_qty = max(criticality_floor_qty, ceil(lead_time_demand))
      # ceil is applied to the exact decimal, so a lead_time_demand of exactly
      # 4.00 stays 4 (no phantom +1), and a zero consumption rate with
      # NON_CRITICAL criticality yields exactly 0.
    input_set: "The single MaintenanceItem row being created."
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer units; ROUND_CEILING applied once to the exact decimal lead-time demand, then the criticality floor via max()"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The caller's X-User-Role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: every required field present, no unknown field, every enum value a declared member, every numeric within its declared constraint, every datetime a valid ISO-8601 UTC instant, window_end_utc strictly after window_start_utc"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to an AttractionProject"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "GET /attraction-projects/{id}, PATCH /attraction-projects/{id}, POST /attraction-projects/{id}/advance-phase, GET /attraction-projects/{id}/capacity-summary, GET /attraction-projects/{id}/budget-position, GET /attraction-projects/{id}/ride-systems, GET /attraction-projects/{id}/queue-segments, GET /attraction-projects/{id}/value-engineering-items, GET /attraction-projects/{id}/rehearsal-runs, GET /attraction-projects/{id}/budget-ledger-entries, GET /attraction-projects/{id}/maintenance-items"
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to a RideSystem"
    error_id: ERR_RIDE_SYSTEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /ride-systems/{id}, PATCH /ride-systems/{id}, POST /ride-systems/{id}/select, POST /ride-systems/{id}/mark-engineered, POST /ride-systems/{id}/commission"
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to a QueueSegment"
    error_id: ERR_QUEUE_SEGMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /queue-segments/{id}, POST /queue-segments/{id}/accept, POST /queue-segments/{id}/retire"
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to a ShowScene"
    error_id: ERR_SCENE_NOT_FOUND
    http_status: 404
    applies_to: "GET /show-scenes/{id}, GET /show-scenes/{id}/effect-cues, POST /show-scenes/{id}/sequence, POST /show-scenes/{id}/program, POST /show-scenes/{id}/validate"
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to an EffectCue"
    error_id: ERR_CUE_NOT_FOUND
    http_status: 404
    applies_to: "GET /effect-cues/{id}, POST /effect-cues/{id}/verify"
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to a DesignPackage"
    error_id: ERR_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /design-packages/{id}, GET /design-packages/{id}/safety-reviews, POST /design-packages/{id}/submit, POST /design-packages/{id}/request-revision, POST /design-packages/{id}/revise, POST /design-packages/{id}/approve"
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to a SafetyReview"
    error_id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "GET /safety-reviews/{id}, GET /safety-reviews/{id}/findings, POST /safety-reviews/{id}/clear"
  - priority: 4
    category: existence
    check: "The {id} in the path resolves to a SafetyFinding"
    error_id: ERR_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "GET /safety-findings/{id}, POST /safety-findings/{id}/resolve, POST /safety-findings/{id}/close, POST /safety-findings/{id}/waive"
