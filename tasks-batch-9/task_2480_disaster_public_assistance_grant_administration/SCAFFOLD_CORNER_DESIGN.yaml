              as: "StateAuditor (X-User-Role sent, X-User-ID omitted)"
              captures: { err_no_id: $.data.error_id }
            - call: "GET /public-assistance/disasters/${disaster_id}"
              payload: {}
              as: "(X-User-ID 'auditor-1' sent, X-User-Role omitted)"
              captures: { err_no_role: $.data.error_id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: "(neither header sent)"
              captures: { err_write: $.data.error_id }
