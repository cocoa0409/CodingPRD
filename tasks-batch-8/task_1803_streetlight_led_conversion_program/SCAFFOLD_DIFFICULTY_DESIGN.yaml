      the BillingLine ESTIMATED -> BILLED batch transition (close-period) is gated by the

      ACCOUNT posture: FROZEN rejects with ERR_ACCOUNT_NOT_OPEN, and unfreeze lets the

      identical close succeed and advance current_period from 2026-08 to 2026-09.

