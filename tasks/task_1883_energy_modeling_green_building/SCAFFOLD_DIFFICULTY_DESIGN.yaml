          Depth-3 cascade triggered by the award endpoint: (1) attempt ->
          AWARDED with points_awarded computed; (2) that award recomputes
          project.points_awarded_total / conservative_level; (3) that recompute
          flips project.prerequisites_satisfied to true once the last
          prerequisite attempt is awarded — each link caused by the previous
          one, not by the original request.
