# =============================================================================
# SCAFFOLD — Independent Distributor Route Model & Stale Product Credit
# Difficulty: beyond-Expert (dense coupling at the top of the Expert band)
# =============================================================================

scenario: |
  Independent Distributor Route Model & Stale Product Credit (Bimbo Bakeries USA): territory routes sold to independent distributors who purchase the right to distribute brands in a defined area, distributor purchase of product at a discount and resale to retail accounts with margin as compensation, daily order forecasting by distributor with limited return rights and stale product credit rules, retail account service standards including shelf stocking, rotation and display execution enforced through distribution agreements, route financing arrangements where the company or a lender finances the territory purchase, classification disputes over independent contractor status with contract structure implications, bakery production planning against distributor orders with short shelf life and daily delivery, territory repurchase and resale when a distributor exits

domain_name: independent-distributor-route-model
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation      # distributor trade ledger vs document-view settlement
  secondary_archetype: pricing_engine           # discount purchase pricing, stale credit rates, route valuation
  complexity_layers:
    - dual_variant_calculation                  # stale credit provisional vs final; transfer valuation VOLUNTARY vs FOR_CAUSE
    - cascading_side_effects                    # audit -> strikes -> auto-suspend -> cancel orders -> release capacity
    - rate_threshold_triggers                   # stale weekly cap, audit violation threshold, strike auto-suspend, delinquency
    - optimistic_concurrency                    # OCC on RouteAgreement.version (plan create) and ProductionDay.version (order confirm)
  entity_topology: flat                         # peer entities with FK references; no nested ownership URLs beyond creation
  state_machine_shape: cyclic                   # agreement suspend/reinstate, financing delinquency/cure, territory resale loop, claim info loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties             # claim decide (RouteOpsManager) vs credit issue (CreditAnalyst); distributor self-reports vs company reconciles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Bakery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bakery display name" }
      - { name: daily_capacity_units, type: integer, source: input, description: "Default daily production capacity in product units; >= 1" }
      - { name: product_catalog, type: array, source: input, description: "Fixed catalog of { sku, display_name, shelf_life_days, list_price_cents }; sku unique within the catalog; shelf_life_days >= 1; list_price_cents >= 1" }

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - { name: area_code, type: string, source: input, description: "Human territory code (e.g. DAL-N); unique across all territories regardless of status" }
      - { name: list_price_cents, type: integer, source: input, description: "Asking price for the route; >= 1" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | LISTED | UNDER_AGREEMENT | EXITING" }

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Distributor legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding trade balance; >= 1" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ACTIVE | EXITED" }
      - { name: classification_status, type: enum, source: system, description: "INDEPENDENT_CONTRACTOR | DISPUTED | RECLASSIFIED_EMPLOYEE" }
      - { name: account_standing, type: enum, source: computed, description: "GOOD | WATCH | PROBATION; PROBATION when trade_balance_cents > 80% of credit_limit_cents, else WATCH when any financing plan is DELINQUENT, else GOOD" }
      - { name: trade_balance_cents, type: integer, source: computed, description: "Running trade ledger: += order charge on record-delivery, -= shortage credit on reconcile, -= issued stale credit on issue-credit" }

  - name: RouteAgreement
    parent: null
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> Territory.id; territory must be LISTED at creation" }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: bakery_id, type: string, source: input, description: "FK -> Bakery.id; supplies product catalog and production capacity for this agreement" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Territory purchase price; >= 1" }
      - { name: financed_amount_cents, type: integer, source: input, description: "Portion of purchase_price_cents financed (0 = cash purchase); 0 <= financed <= purchase_price" }
      - { name: discount_pct, type: number, source: input, description: "Distributor purchase discount off catalog list price; 0 < discount_pct < 1" }
      - { name: start_date, type: string, source: input, description: "ISO date; agreement coverage interval is half-open [start_date, end_date)" }
      - { name: end_date, type: string, source: input, description: "ISO date; must be strictly after start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED_SERVICE | SUSPENDED_CLASSIFICATION | EXITING | EXITED" }
      - { name: suspension_reason, type: enum, source: system, description: "SERVICE_DEFAULT | CLASSIFICATION_DISPUTE | null" }
      - { name: strike_count, type: integer, source: computed, description: "Violation service audits across this distributor's retail accounts within the trailing 90 days, recomputed on every audit" }
      - { name: activated_on, type: datetime, source: system, description: "Logical-clock timestamp of activation; null until ACTIVE" }
      - { name: exited_on, type: datetime, source: system, description: "Logical-clock timestamp of exit initiation; null until EXITING" }

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> RouteAgreement.id; from the creation path" }
      - { name: financier_type, type: enum, source: input, description: "COMPANY | EXTERNAL_LENDER" }
      - { name: lender_name, type: string, source: input, description: "Required when financier_type == EXTERNAL_LENDER; forbidden when COMPANY" }
      - { name: principal_cents, type: integer, source: input, description: "Financed principal; must equal the agreement's financed_amount_cents; >= 1" }
      - { name: annual_interest_rate, type: number, source: input, description: "Nominal annual rate as decimal (e.g. 0.10); 0 < rate < 1" }
      - { name: term_weeks, type: integer, source: input, description: "Amortization term in weeks; >= 1" }
      - { name: weekly_payment_cents, type: integer, source: computed, description: "Level annuity payment; see calculations.financing_weekly_payment" }
      - { name: disburse_date, type: string, source: system, description: "ISO date of disbursement (logical clock); null until ACTIVE" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "Remaining principal after interest-first payment application" }
      - { name: total_paid_cents, type: integer, source: system, description: "Sum of all accepted payment amounts" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DELINQUENT | PAID_OFF | SUPERSEDED | SETTLED_ON_EXIT" }

  - name: RetailAccount
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; from the creation path" }
      - { name: store_name, type: string, source: input, description: "Retail store name" }
      - { name: delivery_weekdays, type: array, source: input, description: "Non-empty array of MON|TUE|WED|THU|FRI|SAT|SUN" }
      - { name: compliance_score, type: integer, source: computed, description: "Composite of the LATEST audit: round_half_up(0.4*shelf + 0.3*rotation + 0.3*display); null before any audit" }
      - { name: last_audit_on, type: string, source: computed, description: "ISO date of latest audit; null before any audit" }
      - { name: audit_log, type: array, source: computed, description: "Append-only audit entries { audit_date, shelf_stock_score, rotation_score, display_score, composite_score, is_violation }" }

  - name: ProductionDay
    parent: null
    common_fields: true
    fields:
      - { name: bakery_id, type: string, source: system, description: "FK -> Bakery.id; from the creation path" }
      - { name: date, type: string, source: input, description: "ISO production date; unique per bakery (point-date uniqueness, not an interval)" }
      - { name: capacity_units, type: integer, source: computed, description: "capacity_override_units if supplied at creation, else bakery.daily_capacity_units" }
      - { name: allocated_units, type: integer, source: system, description: "Units reserved by CONFIRMED orders for this date; incremented on confirm, decremented on cancel/suspension-cascade" }
      - { name: forecast_units, type: integer, source: computed, description: "Sum of units_total over orders whose agreement uses this bakery, whose delivery_date == this date, and whose status is DRAFT, SUBMITTED, or CONFIRMED" }
      - { name: status, type: enum, source: system, description: "PLANNING | CLOSED" }

  - name: DailyOrder
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; from the creation path" }
      - { name: delivery_date, type: string, source: input, description: "ISO requested delivery date" }
      - { name: lines, type: array, source: input, description: "Non-empty array of { sku, qty }; sku unique within the order; qty >= 1" }
      - { name: units_total, type: integer, source: computed, description: "Sum of line qty" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CONFIRMED | DELIVERED | RECONCILED | CANCELLED" }
      - { name: submitted_on, type: datetime, source: system, description: "Null until SUBMITTED" }
      - { name: delivered_lines, type: array, source: input, description: "At record-delivery: array of { sku, qty } with exactly the same sku set as lines" }
      - { name: total_charge_cents, type: integer, source: computed, description: "Distributor charge for delivered product; see calculations.order_charge (null until DELIVERED)" }
      - { name: verified_lines, type: array, source: input, description: "At reconcile: array of { sku, qty } with the same sku set as delivered_lines" }
      - { name: shortage_credit_cents, type: integer, source: computed, description: "Credit for verified shortages; see calculations.shortage_credit (0 until RECONCILED)" }
      - { name: cancelled_reason, type: enum, source: system, description: "DISTRIBUTOR_CANCELLED | AGREEMENT_SUSPENDED | null" }

  - name: StaleReturnClaim
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: system, description: "FK -> Distributor.id; from the creation path" }
      - { name: items, type: array, source: input, description: "Non-empty array of { sku, delivery_date, pulled_qty, pull_date }; pulled_qty >= 1" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | NEEDS_INFO | APPROVED | DENIED | CREDIT_ISSUED" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Uncapped estimate at submission; see calculations.stale_credit_amount (provisional variant)" }
      - { name: approved_credit_cents, type: integer, source: system, description: "Uncapped computed credit frozen at approval; null until APPROVED" }
      - { name: issued_credit_cents, type: integer, source: system, description: "Cap-applied credit actually issued; null until CREDIT_ISSUED" }
      - { name: cap_truncated_cents, type: integer, source: system, description: "approved_credit_cents - issued_credit_cents; null until CREDIT_ISSUED" }
      - { name: denial_reason, type: enum, source: system, description: "DENIED_BY_REVIEW | AUTO_EXPIRED | null" }

  - name: TerritoryTransfer
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> RouteAgreement.id; created as a side effect of agreement exit" }
      - { name: mode, type: enum, source: system, description: "VOLUNTARY | FOR_CAUSE" }
      - { name: gross_valuation_cents, type: integer, source: computed, description: "Repurchase valuation computed at exit; see calculations.transfer_valuation (variant keyed on mode)" }
      - { name: valuation_detail, type: object, source: computed, description: "{ depreciation_cents, goodwill_cents, penalty_cents }" }
      - { name: financing_payoff_cents, type: integer, source: computed, description: "Payoff of the agreement's financing plan at settle; see calculations.financing_payoff (0 when no live plan)" }
      - { name: distributor_payout_cents, type: integer, source: computed, description: "gross_valuation_cents - financing_payoff_cents; may be negative (distributor deficiency)" }
      - { name: status, type: enum, source: system, description: "PENDING | SETTLED" }
      - { name: settled_on, type: datetime, source: system, description: "Null until SETTLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Territory
    initial_state: AVAILABLE
    terminal_states: []
    note: "Cyclic across distributor exits: a settled transfer returns the territory to AVAILABLE so it can be listed and sold again."
    transitions:
      - from: AVAILABLE
        to: LISTED
        trigger: "POST /territories/{id}/list-for-sale"
        actor: CompanyAdmin
        preconditions: []
        side_effects: []
      - from: LISTED
        to: UNDER_AGREEMENT
        trigger: "POST /agreements (side effect of agreement creation)"
        actor: RouteOpsManager
        preconditions:
          - "Territory status == LISTED (ERR_TERRITORY_NOT_LISTED)"
        side_effects:
          - "Territory.status -> UNDER_AGREEMENT; Territory.version += 1"
      - from: UNDER_AGREEMENT
        to: EXITING
        trigger: "POST /agreements/{id}/exit OR POST /agreements/{id}/reinstate with resolution RECLASSIFIED (cascade)"
        actor: RouteOpsManager | CompanyAdmin
        preconditions: []
        side_effects:
          - "Territory.status -> EXITING; Territory.version += 1"
      - from: EXITING
        to: AVAILABLE
        trigger: "POST /transfers/{id}/settle (cascade)"
        actor: CreditAnalyst
        preconditions: []
        side_effects:
          - "Territory.status -> AVAILABLE; Territory.version += 1"

  - entity: RouteAgreement
    initial_state: DRAFT
    terminal_states: [EXITED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /agreements/{id}/activate"
        actor: RouteOpsManager
        preconditions:
          - "If financed_amount_cents > 0, a FinancingPlan with status == ACTIVE exists for this agreement (ERR_FINANCING_NOT_DISBURSED)"
        side_effects:
          - "activated_on = logical clock"
          - "Distributor.status: PROSPECT -> ACTIVE (no-op if already ACTIVE); Distributor.version += 1"
      - from: ACTIVE
        to: SUSPENDED_SERVICE
        trigger: "POST /agreements/{id}/suspend {reason: SERVICE_DEFAULT} OR system auto-suspend when a posted audit raises strike_count to >= 3"
        actor: RouteOpsManager | system
        preconditions: []
        side_effects:
          - "suspension_reason = SERVICE_DEFAULT"
          - "Every DailyOrder of this distributor whose agreement is this one, whose status is SUBMITTED or CONFIRMED, and whose delivery_date >= current logical date -> CANCELLED with cancelled_reason AGREEMENT_SUSPENDED; each such cancellation on a CONFIRMED order decrements its ProductionDay.allocated_units by the order's units_total and bumps that ProductionDay.version by 1"
      - from: ACTIVE
        to: SUSPENDED_CLASSIFICATION
        trigger: "POST /agreements/{id}/suspend {reason: CLASSIFICATION_DISPUTE}"
        actor: RouteOpsManager
        preconditions: []
        side_effects:
          - "suspension_reason = CLASSIFICATION_DISPUTE"
          - "Distributor.classification_status -> DISPUTED; Distributor.version += 1"
          - "Same future-order cancellation cascade as SUSPENDED_SERVICE"
      - from: SUSPENDED_SERVICE
        to: ACTIVE
        trigger: "POST /agreements/{id}/reinstate (resolution omitted)"
        actor: RouteOpsManager | CompanyAdmin
        preconditions: []
        side_effects: ["suspension_reason = null"]
      - from: SUSPENDED_CLASSIFICATION
        to: ACTIVE
        trigger: "POST /agreements/{id}/reinstate {resolution: CONFIRMED_IC}"
        actor: CompanyAdmin
        preconditions:
          - "Only CompanyAdmin may reinstate from SUSPENDED_CLASSIFICATION (ERR_REINSTATE_FORBIDDEN for RouteOpsManager)"
        side_effects:
          - "suspension_reason = null"
          - "Distributor.classification_status -> INDEPENDENT_CONTRACTOR; Distributor.version += 1"
      - from: SUSPENDED_CLASSIFICATION
        to: EXITING
        trigger: "POST /agreements/{id}/reinstate {resolution: RECLASSIFIED}"
        actor: CompanyAdmin
        preconditions:
          - "Only CompanyAdmin may reinstate from SUSPENDED_CLASSIFICATION (ERR_REINSTATE_FORBIDDEN)"
        side_effects:
          - "Distributor.classification_status -> RECLASSIFIED_EMPLOYEE; Distributor.version += 1"
          - "exited_on = logical clock; create TerritoryTransfer { mode: FOR_CAUSE, status: PENDING } with gross_valuation per calculations.transfer_valuation FOR_CAUSE variant"
          - "Territory.status -> EXITING"
      - from: ACTIVE
        to: EXITING
        trigger: "POST /agreements/{id}/exit {mode: VOLUNTARY | FOR_CAUSE}"
        actor: RouteOpsManager
        preconditions: []
        side_effects:
          - "exited_on = logical clock"
          - "Create TerritoryTransfer { mode, status: PENDING } with gross_valuation per calculations.transfer_valuation variant keyed on mode"
          - "Territory.status -> EXITING"
      - from: SUSPENDED_SERVICE
        to: EXITING
        trigger: "POST /agreements/{id}/exit"
        actor: RouteOpsManager
        preconditions: []
        side_effects:
          - "Same as ACTIVE -> EXITING"
      - from: EXITING
        to: EXITED
        trigger: "POST /transfers/{id}/settle (cascade)"
        actor: CreditAnalyst
        preconditions: []
        side_effects:
          - "If the distributor has no other RouteAgreement in {DRAFT, ACTIVE, SUSPENDED_SERVICE, SUSPENDED_CLASSIFICATION, EXITING}, Distributor.status -> EXITED"

  - entity: FinancingPlan
    initial_state: DRAFT
    terminal_states: [PAID_OFF, SUPERSEDED, SETTLED_ON_EXIT]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /financing-plans/{id}/disburse"
        actor: CreditAnalyst
        preconditions:
          - "The parent RouteAgreement status == DRAFT (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "disburse_date = current logical date; outstanding_principal_cents = principal_cents; weekly_payment_cents computed per calculations.financing_weekly_payment"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /agreements/{id}/financing-plans (a newer plan creation supersedes this one)"
        actor: CreditAnalyst
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /production-days/{id}/close (system delinquency evaluation)"
        actor: system
        preconditions:
          - "weeks_elapsed = floor((current logical date - disburse_date)/7); scheduled_due = min(weeks_elapsed, term_weeks) * weekly_payment_cents; total_paid_cents < scheduled_due - weekly_payment_cents"
        side_effects:
          - "Distributor.account_standing recomputed (delinquent plan => at least WATCH); Distributor.version += 1"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /production-days/{id}/close (system cure evaluation)"
        actor: system
        preconditions:
          - "total_paid_cents >= min(weeks_elapsed, term_weeks) * weekly_payment_cents - weekly_payment_cents"
        side_effects:
          - "Distributor.account_standing recomputed; Distributor.version += 1"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "POST /financing-plans/{id}/payments"
        actor: Distributor | CreditAnalyst
        preconditions: []
        side_effects: ["outstanding_principal_cents reaches 0"]
      - from: DELINQUENT
        to: PAID_OFF
        trigger: "POST /financing-plans/{id}/payments"
        actor: Distributor | CreditAnalyst
        preconditions: []
        side_effects: ["outstanding_principal_cents reaches 0; Distributor.account_standing recomputed"]
      - from: ACTIVE
        to: SETTLED_ON_EXIT
        trigger: "POST /transfers/{id}/settle (cascade)"
        actor: CreditAnalyst
        preconditions: []
        side_effects: ["outstanding_principal_cents set to 0 after payoff is booked on the transfer"]
      - from: DELINQUENT
        to: SETTLED_ON_EXIT
        trigger: "POST /transfers/{id}/settle (cascade)"
        actor: CreditAnalyst
        preconditions: []
        side_effects: ["outstanding_principal_cents set to 0 after payoff is booked on the transfer"]

  - entity: DailyOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED, RECONCILED]
    note: "DRAFT orders are the distributor's demand forecast (counted in ProductionDay.forecast_units); SUBMITTED converts the forecast into a firm order."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orders/{id}/submit"
        actor: Distributor
        preconditions:
          - "Distributor's ACTIVE RouteAgreement exists (ERR_AGREEMENT_NOT_ACTIVE)"
          - "delivery_date - current logical date >= 2 days (ERR_ORDER_LEAD_TIME)"
          - "Every line sku exists in the agreement bakery's product_catalog (ERR_SKU_UNKNOWN)"
        side_effects: ["submitted_on = logical clock"]
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: RouteOpsManager
        preconditions:
          - "Agreement status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "A ProductionDay exists for (agreement.bakery_id, delivery_date) (ERR_NOT_FOUND)"
          - "That ProductionDay status == PLANNING (ERR_PRODUCTION_DAY_LOCKED)"
          - "day.allocated_units + order.units_total <= day.capacity_units (ERR_CAPACITY_EXCEEDED)"
          - "expected_production_day_version == ProductionDay.version (ERR_STALE_VERSION)"
        side_effects:
          - "ProductionDay.allocated_units += order.units_total; ProductionDay.version += 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Distributor
        preconditions: []
        side_effects: ["cancelled_reason = DISTRIBUTOR_CANCELLED"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel OR agreement suspension cascade"
        actor: Distributor | system
        preconditions: []
        side_effects:
          - "cancelled_reason = DISTRIBUTOR_CANCELLED (manual) or AGREEMENT_SUSPENDED (cascade)"
          - "ProductionDay.allocated_units -= order.units_total; ProductionDay.version += 1"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "POST /orders/{id}/record-delivery"
        actor: Distributor
        preconditions:
          - "The ProductionDay for (agreement.bakery_id, delivery_date) has status == CLOSED (ERR_PRODUCTION_DAY_LOCKED... day not closed means production not finalized)"
          - "delivered_lines covers exactly the line skus of the order (ERR_INVALID_REQUEST)"
          - "Distributor.trade_balance_cents + order charge <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "total_charge_cents computed per calculations.order_charge"
          - "Distributor.trade_balance_cents += total_charge_cents; Distributor.version += 1; account_standing recomputed"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /orders/{id}/reconcile"
        actor: RouteOpsManager
        preconditions:
          - "verified_lines covers exactly the delivered skus and each verified qty <= delivered qty (ERR_INVALID_REQUEST)"
        side_effects:
          - "shortage_credit_cents computed per calculations.shortage_credit"
          - "Distributor.trade_balance_cents -= shortage_credit_cents; Distributor.version += 1"

  - entity: StaleReturnClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, CREDIT_ISSUED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /stale-claims/{id}/decide {decision: APPROVE}"
        actor: RouteOpsManager
        preconditions:
          - "Claim status == SUBMITTED (ERR_CLAIM_NOT_REVIEWABLE)"
        side_effects:
          - "approved_credit_cents = uncapped stale credit recomputed per calculations.stale_credit_amount (base variant) on the claim's current items"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /stale-claims/{id}/decide {decision: DENY} OR system auto-expiry at production-day close"
        actor: RouteOpsManager | system
        preconditions: []
        side_effects: ["denial_reason = DENIED_BY_REVIEW (manual) or AUTO_EXPIRED (close when claim created more than 3 days before the close date)"]
      - from: SUBMITTED
        to: NEEDS_INFO
        trigger: "POST /stale-claims/{id}/decide {decision: REQUEST_INFO}"
        actor: RouteOpsManager
        preconditions:
          - "Claim status == SUBMITTED (ERR_CLAIM_NOT_REVIEWABLE)"
        side_effects: []
      - from: NEEDS_INFO
        to: SUBMITTED
        trigger: "POST /stale-claims/{id}/resubmit"
        actor: Distributor
        preconditions:
          - "All submission validations re-run (windows, eligibility, sku)"
        side_effects: ["provisional_credit_cents recomputed"]
      - from: NEEDS_INFO
        to: DENIED
        trigger: "system auto-expiry at production-day close"
        actor: system
        preconditions: ["claim created more than 3 days before the close date"]
        side_effects: ["denial_reason = AUTO_EXPIRED"]
      - from: APPROVED
        to: CREDIT_ISSUED
        trigger: "POST /stale-claims/{id}/issue-credit"
        actor: CreditAnalyst
        preconditions:
          - "Claim status == APPROVED (ERR_INVALID_STATE_TRANSITION)"
          - "Weekly stale cap remaining for the claim's agreement and submission ISO week > 0 (ERR_STALE_CAP_EXHAUSTED)"
        side_effects:
          - "issued_credit_cents = min(approved_credit_cents, remaining weekly cap); cap_truncated_cents = approved_credit_cents - issued_credit_cents"
          - "Distributor.trade_balance_cents -= issued_credit_cents; Distributor.version += 1; account_standing recomputed"

  - entity: ProductionDay
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: CLOSED
        trigger: "POST /production-days/{id}/close"
        actor: CompanyAdmin
        preconditions:
          - "Current logical date >= day.date (ERR_PRODUCTION_DAY_LOCKED... cannot close a future production date: ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "System delinquency/cure evaluation on every FinancingPlan in ACTIVE or DELINQUENT (see FinancingPlan machine)"
          - "Auto-expiry: every StaleReturnClaim in SUBMITTED or NEEDS_INFO created more than 3 days before the close date -> DENIED with denial_reason AUTO_EXPIRED"

  - entity: TerritoryTransfer
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /transfers/{id}/settle"
        actor: CreditAnalyst
        preconditions:
          - "Transfer status == PENDING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "financing_payoff_cents computed per calculations.financing_payoff; if the agreement has a FinancingPlan in ACTIVE or DELINQUENT it -> SETTLED_ON_EXIT with outstanding_principal_cents booked into the payoff and then zeroed"
          - "distributor_payout_cents = gross_valuation_cents - financing_payoff_cents"
          - "Agreement -> EXITED; Territory -> AVAILABLE; Distributor -> EXITED when no live agreements remain"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: financing-create-stale-agreement
    parent_entity: RouteAgreement
    write_endpoint: "POST /agreements/{id}/financing-plans"
    occ_field: "expected_agreement_version"
    description: |
      Creating a FinancingPlan against a RouteAgreement whose version has
      advanced since the client last observed it is rejected. A successful plan
      creation legitimately supersedes any prior DRAFT plan and advances the
      agreement version, so a second create carrying the pre-supersede version
      is stale and must fail with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-confirm-stale-production-day
    parent_entity: ProductionDay
    write_endpoint: "POST /orders/{id}/confirm"
    occ_field: "expected_production_day_version"
    description: |
      Confirming an order against a ProductionDay whose version has advanced
      since the client last observed it is rejected. Every successful confirm
      or cancellation advances the day's version (allocated_units moves), so a
      confirm carrying an older version is acting on a stale capacity view and
      must fail with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_charge
    trigger: "POST /orders/{id}/record-delivery"
    algorithm: aggregation
    formula: |
      For each delivered line:
        line_charge_cents = round_half_up(delivered_qty * catalog.list_price_cents[sku] * (1 - agreement.discount_pct))
      total_charge_cents = sum(line_charge_cents over lines)
      ROUNDING ORDER IS PINNED: round each line to whole cents FIRST, then sum.
      (Sum-then-round is a different, forbidden order: with catalog prices
      319 and 157 and discount 0.20, quantities 3 and 3, per-line-then-sum
      yields 766 + 377 = 1143 while sum-then-round yields 1142.)
    input_set: "delivered_lines of this order; catalog from the agreement's bakery; discount_pct from the distributor's ACTIVE agreement"
    constants:
      ROUNDING: "round_half_up per line, then sum"
    precision: "integer cents, round_half_up"

  - name: shortage_credit
    trigger: "POST /orders/{id}/reconcile"
    algorithm: aggregation
    formula: |
      For each line where verified_qty < delivered_qty:
        line_shortage_credit = round_half_up(line_charge_cents * (delivered_qty - verified_qty) / delivered_qty)
      shortage_credit_cents = sum(line_shortage_credit over lines)
      line_charge_cents is the value computed by order_charge for that line.
    input_set: "delivered_lines vs verified_lines of this order"
    precision: "integer cents, round_half_up"

  - name: stale_credit_amount
    trigger: "POST /distributors/{id}/stale-claims (provisional), POST /stale-claims/{id}/resubmit (provisional recompute), POST /stale-claims/{id}/decide APPROVE (base recompute), POST /stale-claims/{id}/issue-credit (final cap application)"
    algorithm: aggregation
    formula: |
      unit_charge_cents(sku) = round_half_up(catalog.list_price_cents[sku] * (1 - agreement.discount_pct))
      For each claim item:
        eligible_qty = min(pulled_qty, delivered_qty_for(distributor, sku, delivery_date) - credited_qty_so_far(distributor, sku, delivery_date))
        item_base = round_half_up(eligible_qty * unit_charge_cents(sku) * STALE_CREDIT_RATE)
      base_credit = sum(item_base over items)
      where delivered_qty_for sums delivered quantities over this distributor's
      DELIVERED or RECONCILED orders with that delivery_date, and
      credited_qty_so_far sums pulled_qty over this distributor's claims in
      APPROVED or CREDIT_ISSUED status referencing the same (sku, delivery_date).
    input_set: "claim items; this distributor's DELIVERED/RECONCILED orders; this distributor's APPROVED/CREDIT_ISSUED claims"
    constants:
      STALE_CREDIT_RATE: 0.75
    precision: "integer cents, round_half_up per item, then sum"
    variants:
      - name: provisional
        when: "computed at submission and resubmission -> provisional_credit_cents"
        difference: "Uncapped estimate; weekly cap is NOT applied."
      - name: final
        when: "applied at issue-credit -> issued_credit_cents"
        difference: "issued = min(approved_credit_cents, remaining weekly cap from stale_weekly_cap); a claim with base above the cap issues less than its provisional amount."

  - name: stale_weekly_cap
    trigger: "POST /stale-claims/{id}/issue-credit"
    algorithm: threshold
    formula: |
      week = ISO-8601 week containing the claim's submission date (clock date at submit)
      gross_week_charges = sum(total_charge_cents) over this agreement's distributor's
        orders that reached DELIVERED with the record-delivery clock date inside `week`
      cap_cents = round_half_up(STALE_CAP_PCT * gross_week_charges)
      used_cents = sum(issued_credit_cents) over this distributor's CREDIT_ISSUED
        claims whose submission date falls inside `week`
      remaining = cap_cents - used_cents
      BOUNDARY: issued == remaining exactly is allowed (cap is >=, not >);
      remaining == 0 rejects with ERR_STALE_CAP_EXHAUSTED.
    input_set: "distributor's orders delivered inside the claim week; distributor's CREDIT_ISSUED claims submitted inside the claim week"
    constants:
      STALE_CAP_PCT: 0.10
    precision: "integer cents, round_half_up"

  - name: financing_weekly_payment
    trigger: "POST /financing-plans/{id}/disburse"
    algorithm: constraint_propagation
    formula: |
      r = annual_interest_rate / 52
      weekly_payment_cents = round_half_up(principal_cents * r / (1 - (1 + r)^(-term_weeks)))
    input_set: "this plan's principal_cents, annual_interest_rate, term_weeks"
    precision: "integer cents, round_half_up"

  - name: financing_payment_application
    trigger: "POST /financing-plans/{id}/payments"
    algorithm: chronological
    formula: |
      interest_portion = round_half_up(outstanding_principal_cents * (annual_interest_rate / 52))
      If amount_cents < interest_portion: reject ERR_PAYMENT_BELOW_INTEREST.
      principal_portion = min(amount_cents - interest_portion, outstanding_principal_cents)
      outstanding_principal_cents -= principal_portion
      total_paid_cents += amount_cents
      If outstanding_principal_cents == 0: status -> PAID_OFF.
    input_set: "this plan"
    precision: "integer cents, round_half_up"

  - name: delinquency_evaluation
    trigger: "POST /production-days/{id}/close"
    algorithm: threshold
    formula: |
      For every FinancingPlan in ACTIVE or DELINQUENT:
        weeks_elapsed = floor((close_logical_date - disburse_date) / 7)
        scheduled_due_cents = min(weeks_elapsed, term_weeks) * weekly_payment_cents
        delinquent := total_paid_cents < scheduled_due_cents - weekly_payment_cents
      delinquent == true  => ACTIVE -> DELINQUENT (or stays DELINQUENT)
      delinquent == false => DELINQUENT -> ACTIVE (or stays ACTIVE)
      One weekly payment of grace is built into the strict inequality.
    input_set: "all FinancingPlans with status ACTIVE or DELINQUENT"
    precision: "integer cents"

  - name: audit_compliance
    trigger: "POST /retail-accounts/{id}/audits"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(0.40 * shelf_stock_score + 0.30 * rotation_score + 0.30 * display_score)
      is_violation := (shelf_stock_score < VIOLATION_THRESHOLD) OR (rotation_score < VIOLATION_THRESHOLD) OR (display_score < VIOLATION_THRESHOLD)
      NOTE: violation is COMPONENT-level. A score set of (69, 70, 70) composites
      to 70 yet IS a violation; (70, 70, 70) is exactly AT the threshold and is
      NOT a violation (threshold is >= 70 to pass).
      Account compliance_score = composite of the LATEST audit by audit_date
      (tie-break: later-created audit row wins).
    input_set: "the posted audit scores"
    constants:
      VIOLATION_THRESHOLD: 70
      W_SHELF: 0.40
      W_ROTATION: 0.30
      W_DISPLAY: 0.30
    precision: "integer score, round_half_up"

  - name: agreement_strike_count
    trigger: "POST /retail-accounts/{id}/audits (recomputed after the audit is appended)"
    algorithm: aggregation
    formula: |
      window = trailing 90 calendar days ending on the audit's audit_date (inclusive)
      strike_count = count of audit_log entries with is_violation == true across ALL
        retail accounts of this distributor's ACTIVE agreement whose audit_date is in window
      If the newly posted audit is a violation AND the recomputed strike_count >= STRIKE_SUSPEND_THRESHOLD:
        the agreement auto-transitions ACTIVE -> SUSPENDED_SERVICE (see RouteAgreement machine,
        including its order-cancellation cascade).
      BOUNDARY: strike_count == 3 triggers; == 2 does not.
    input_set: "audit_log entries of every RetailAccount owned by this distributor, filtered to the trailing 90-day window"
    constants:
      STRIKE_SUSPEND_THRESHOLD: 3
      STRIKE_WINDOW_DAYS: 90
    precision: "integer count"

  - name: transfer_valuation
    trigger: "POST /agreements/{id}/exit AND POST /agreements/{id}/reinstate {resolution: RECLASSIFIED}"
    algorithm: forward_looking
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependencies resolve in this order):
      (1) full_years = floor(days_between(agreement.activated_on date, exit clock date) / 365)
      (2) depreciation_cents = round_half_up(purchase_price_cents * DEPRECIATION_RATE * full_years)
      (3) compliant_accounts = count of this distributor's RetailAccounts with NO
          violation audit whose audit_date lies in the trailing 90 days ending on the
          exit date (accounts with no audits in the window count as compliant)
      (4) variant branch:
            VOLUNTARY: goodwill_cents = GOODWILL_PER_COMPLIANT_ACCOUNT * compliant_accounts; penalty_cents = 0
            FOR_CAUSE: goodwill_cents = 0; penalty_cents = round_half_up(purchase_price_cents * FOR_CAUSE_PENALTY_PCT)
      (5) gross_valuation_cents = purchase_price_cents - depreciation_cents + goodwill_cents - penalty_cents
      The same territory, dates, and accounts therefore yield DIFFERENT valuations
      under VOLUNTARY vs FOR_CAUSE whenever compliant_accounts > 0 or the penalty
      is non-zero.
    input_set: "agreement, territory, distributor's retail accounts and their audit logs"
    constants:
      DEPRECIATION_RATE: 0.02
      FOR_CAUSE_PENALTY_PCT: 0.15
      GOODWILL_PER_COMPLIANT_ACCOUNT: 50000
    precision: "integer cents, round_half_up"
    variants:
      - name: voluntary
        when: "exit mode == VOLUNTARY"
        difference: "goodwill credited per compliant account; no penalty"
      - name: for_cause
        when: "exit mode == FOR_CAUSE (including RECLASSIFIED resolutions)"
        difference: "goodwill zeroed; 15% purchase-price penalty applied"

  - name: financing_payoff
    trigger: "POST /transfers/{id}/settle"
    algorithm: chronological
    formula: |
      If the agreement has a FinancingPlan in ACTIVE or DELINQUENT:
        days = days_between(last accrual date, settle clock date)
          where last accrual date = disburse_date if no payment was ever made,
          else the date of the most recent accepted payment
        accrued_interest = round_half_up(outstanding_principal_cents * annual_interest_rate * days / 365)
        financing_payoff_cents = outstanding_principal_cents + accrued_interest
      Else (no plan, or plan PAID_OFF / SUPERSEDED): financing_payoff_cents = 0.
    input_set: "the agreement's financing plan"
    precision: "integer cents, round_half_up"

  - name: settlement_reconciliation
    trigger: "GET /distributors/{id}/settlement"
    algorithm: aggregation
    formula: |
      week = query param week (ISO "YYYY-Www"), defaulting to the ISO week of the current logical date
      gross_charges_cents = sum(total_charge_cents) over DELIVERED/RECONCILED orders whose record-delivery date is in week
      stale_credits_issued_cents = sum(issued_credit_cents) over CREDIT_ISSUED claims submitted in week
      stale_cap_cents / stale_cap_used_cents per stale_weekly_cap for week
      net_trade_cents = gross_charges_cents - stale_credits_issued_cents
      ledger_view_cents = distributor.trade_balance_cents (running balance, all-time)
      document_view_cents = sum(total_charge_cents) over all DELIVERED/RECONCILED orders
                            - sum(shortage_credit_cents) over all RECONCILED orders
                            - sum(issued_credit_cents) over all CREDIT_ISSUED claims
      reconciles := (ledger_view_cents == document_view_cents)
    input_set: "distributor's orders, claims, and running balance"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Distributor ownership scope: when X-User-Role == Distributor, X-User-ID must equal the distributor id of the addressed resource (path distributor id, or the owning distributor of the order/claim/financing-plan). Separately, on POST /agreements/{id}/reinstate from SUSPENDED_CLASSIFICATION only CompanyAdmin may proceed (ERR_REINSTATE_FORBIDDEN for RouteOpsManager on that path)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "distributor-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Body foreign keys exist, validated in the endpoint's declared input order (POST /agreements: territory_id, then distributor_id, then bakery_id; POST /distributors/{id}/stale-claims: none; POST /agreements/{id}/financing-plans: none)"
    error_id: "ERR_TERRITORY_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_BAKERY_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints taking body FKs"
  - priority: 6
    category: existence
    check: "Request shape: required fields present; enum membership; ranges (audit scores 0..100 inclusive -> ERR_AUDIT_SCORE_RANGE; qty >= 1; 0 < discount_pct < 1; end_date > start_date; catalog sku uniqueness; lender_name required iff financier_type == EXTERNAL_LENDER and forbidden otherwise; financed_amount_cents <= purchase_price_cents; financing principal_cents == agreement.financed_amount_cents)"
    error_id: "ERR_INVALID_REQUEST | ERR_AUDIT_SCORE_RANGE"
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 7
    category: state
    check: "State preconditions: transition from-state membership (ERR_INVALID_STATE_TRANSITION); cross-entity ACTIVE gates (ERR_AGREEMENT_NOT_ACTIVE); territory LISTED (ERR_TERRITORY_NOT_LISTED); production day PLANNING (ERR_PRODUCTION_DAY_LOCKED); claim reviewable (ERR_CLAIM_NOT_REVIEWABLE); financed activation gate (ERR_FINANCING_NOT_DISBURSED); live-plan uniqueness (ERR_FINANCING_PLAN_EXISTS)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_AGREEMENT_NOT_ACTIVE | ERR_TERRITORY_NOT_LISTED | ERR_PRODUCTION_DAY_LOCKED | ERR_CLAIM_NOT_REVIEWABLE | ERR_FINANCING_NOT_DISBURSED | ERR_FINANCING_PLAN_EXISTS"
    http_status: 409
    applies_to: "stateful endpoints"
  - priority: 8
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (checked immediately after state preconditions, before business rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /agreements/{id}/financing-plans, POST /orders/{id}/confirm"
  - priority: 9
    category: business_referential
    check: "Line/item referential integrity: every sku exists in the agreement bakery's product_catalog (ERR_SKU_UNKNOWN); claim pulled_qty <= delivered qty minus already-credited qty for (distributor, sku, delivery_date) (ERR_CLAIM_QTY_EXCEEDS_ELIGIBLE)"
    error_id: "ERR_SKU_UNKNOWN | ERR_CLAIM_QTY_EXCEEDS_ELIGIBLE"
    http_status: 422
    applies_to: "POST /distributors/{id}/orders, POST /orders/{id}/submit, POST /distributors/{id}/stale-claims, POST /stale-claims/{id}/resubmit"
  - priority: 10
    category: business_temporal
    check: "Temporal windows: order lead time delivery_date - today >= 2 days (ERR_ORDER_LEAD_TIME); claim per-item windows: pull_date >= delivery_date + shelf_life_days (ERR_CLAIM_NOT_STALE_YET); pull_date <= delivery_date + shelf_life_days + 7 AND claim submit date <= pull_date + 2 days (ERR_CLAIM_WINDOW_EXPIRED)"
    error_id: "ERR_ORDER_LEAD_TIME | ERR_CLAIM_NOT_STALE_YET | ERR_CLAIM_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "POST /orders/{id}/submit, POST /distributors/{id}/stale-claims, POST /stale-claims/{id}/resubmit"
  - priority: 11
    category: business_constraint
    check: "Uniqueness / overlap / capacity: ProductionDay (bakery_id, date) point uniqueness (ERR_PRODUCTION_DAY_EXISTS); RouteAgreement half-open [start_date, end_date) interval non-overlap per DISTRIBUTOR across that distributor's agreements with status in {DRAFT, ACTIVE, SUSPENDED_SERVICE, SUSPENDED_CLASSIFICATION, EXITING} (i.e. any status except terminal EXITED) — intersection iff existing.start_date < new.end_date AND new.start_date < existing.end_date, so adjacency (existing.end_date == new.start_date) is allowed (ERR_DISTRIBUTOR_AGREEMENT_OVERLAP); order confirm capacity allocated_units + units_total <= capacity_units (ERR_CAPACITY_EXCEEDED)"
    error_id: "ERR_PRODUCTION_DAY_EXISTS | ERR_DISTRIBUTOR_AGREEMENT_OVERLAP | ERR_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /bakeries/{id}/production-days, POST /agreements, POST /orders/{id}/confirm"
  - priority: 12
    category: business_fiscal
    check: "Fiscal limits: record-delivery trade_balance + order charge <= credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED); issue-credit remaining weekly cap > 0 (ERR_STALE_CAP_EXHAUSTED); financing payment >= interest portion (ERR_PAYMENT_BELOW_INTEREST)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_STALE_CAP_EXHAUSTED | ERR_PAYMENT_BELOW_INTEREST"
    http_status: 409
    applies_to: "POST /orders/{id}/record-delivery, POST /stale-claims/{id}/issue-credit, POST /financing-plans/{id}/payments"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). The server starts with the logical clock fixed at 2026-09-01T00:00:00Z and NEVER falls back to wall-clock time; all date arithmetic in calculations and validations reads this clock."
    roles: [CompanyAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/bakeries"
    description: "Create a bakery with its fixed product catalog"
    roles: [CompanyAdmin]
    code: 201
    input: [name, daily_capacity_units, product_catalog]
    output: Bakery
    side_effects: []

  - method: GET
    path: "/bakeries/{id}"
    description: "Get a bakery"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: []
    output: Bakery
    side_effects: []

  - method: POST
    path: "/bakeries/{id}/production-days"
    description: "Create a production day for a bakery date (point-date uniqueness per bakery)"
    roles: [CompanyAdmin]
    code: 201
    input: [date, "capacity_override_units?"]
    output: ProductionDay
    side_effects: ["status = PLANNING; ERR_PRODUCTION_DAY_EXISTS when (bakery, date) already present"]

  - method: GET
    path: "/bakeries/{id}/production-days"
    description: "List production days of a bakery"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["status?", "date?", "limit?", "offset?"]
    output: "ProductionDay[]"
    side_effects: []

  - method: POST
    path: "/production-days/{id}/close"
    description: "Close a production day (ops-run checkpoint): requires logical date >= day.date; runs financing delinquency/cure evaluation and stale-claim auto-expiry (>3 days old)"
    roles: [CompanyAdmin]
    code: 200
    input: []
    output: ProductionDay
    side_effects: ["status -> CLOSED", "FinancingPlan delinquency evaluation", "StaleReturnClaim auto-expiry"]

  - method: POST
    path: "/territories"
    description: "Create a territory (status AVAILABLE)"
    roles: [CompanyAdmin]
    code: 201
    input: [area_code, list_price_cents]
    output: Territory
    side_effects: []

  - method: GET
    path: "/territories/{id}"
    description: "Get a territory"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: []
    output: Territory
    side_effects: []

  - method: POST
    path: "/territories/{id}/list-for-sale"
    description: "List an AVAILABLE territory for sale"
    roles: [CompanyAdmin]
    code: 200
    input: []
    output: Territory
    side_effects: ["status -> LISTED"]

  - method: POST
    path: "/distributors"
    description: "Create a distributor (status PROSPECT, classification INDEPENDENT_CONTRACTOR, standing GOOD, trade balance 0)"
    roles: [CompanyAdmin]
    code: 201
    input: [legal_name, credit_limit_cents]
    output: Distributor
    side_effects: []

  - method: GET
    path: "/distributors/{id}"
    description: "Get a distributor (Distributor role restricted to own id)"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  - method: GET
    path: "/distributors/{id}/settlement"
    description: "Computed weekly settlement statement with ledger-vs-document reconciliation (calculations.settlement_reconciliation)"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["week?"]
    output: { week: string, gross_charges_cents: integer, stale_credits_issued_cents: integer, net_trade_cents: integer, stale_cap_cents: integer, stale_cap_used_cents: integer, trade_balance_cents: integer, ledger_view_cents: integer, document_view_cents: integer, reconciles: boolean }
    side_effects: []

  - method: POST
    path: "/agreements"
    description: "Create a route agreement (status DRAFT); territory must be LISTED; the half-open [start_date, end_date) interval must not overlap another non-terminal agreement of the same distributor (adjacency allowed)"
    roles: [RouteOpsManager]
    code: 201
    input: [territory_id, distributor_id, bakery_id, purchase_price_cents, financed_amount_cents, discount_pct, start_date, end_date]
    output: RouteAgreement
    side_effects: ["Territory LISTED -> UNDER_AGREEMENT"]

  - method: GET
    path: "/agreements"
    description: "List agreements with filters"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["territory_id?", "distributor_id?", "bakery_id?", "status?", "limit?", "offset?"]
    output: "RouteAgreement[]"
    side_effects: []

  - method: GET
    path: "/agreements/{id}"
    description: "Get an agreement"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: []
    output: RouteAgreement
    side_effects: []

  - method: POST
    path: "/agreements/{id}/activate"
    description: "Activate a DRAFT agreement; requires a disbursed (ACTIVE) financing plan when financed_amount_cents > 0"
    roles: [RouteOpsManager]
    code: 200
    input: []
    output: RouteAgreement
    side_effects: ["status -> ACTIVE", "Distributor PROSPECT -> ACTIVE"]

  - method: POST
    path: "/agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement; reason SERVICE_DEFAULT or CLASSIFICATION_DISPUTE; cancels future SUBMITTED/CONFIRMED orders (releasing capacity); CLASSIFICATION_DISPUTE sets distributor classification DISPUTED"
    roles: [RouteOpsManager]
    code: 200
    input: [reason]
    output: RouteAgreement
    side_effects: ["status -> SUSPENDED_SERVICE | SUSPENDED_CLASSIFICATION", "future-order cancellation cascade", "classification update when reason == CLASSIFICATION_DISPUTE"]

  - method: POST
    path: "/agreements/{id}/reinstate"
    description: "Reinstate a suspended agreement. From SUSPENDED_SERVICE: either role, resolution omitted. From SUSPENDED_CLASSIFICATION: CompanyAdmin only, resolution CONFIRMED_IC (-> ACTIVE) or RECLASSIFIED (-> EXITING with FOR_CAUSE transfer)"
    roles: [RouteOpsManager, CompanyAdmin]
    code: 200
    input: ["resolution?"]
    output: RouteAgreement
    side_effects: ["status -> ACTIVE or EXITING", "classification resolution side effects", "RECLASSIFIED creates a FOR_CAUSE TerritoryTransfer"]

  - method: POST
    path: "/agreements/{id}/exit"
    description: "Initiate distributor exit from ACTIVE or SUSPENDED_SERVICE; creates a PENDING TerritoryTransfer whose gross_valuation uses the variant keyed on mode"
    roles: [RouteOpsManager]
    code: 200
    input: [mode]
    output: RouteAgreement
    side_effects: ["status -> EXITING", "TerritoryTransfer created (PENDING)", "Territory -> EXITING"]

  - method: POST
    path: "/agreements/{id}/financing-plans"
    description: "Create a financing plan for a DRAFT agreement (OCC on agreement version); supersedes an existing DRAFT plan; rejects when a live ACTIVE/DELINQUENT/PAID_OFF plan exists"
    roles: [CreditAnalyst]
    code: 201
    input: [financier_type, "lender_name?", principal_cents, annual_interest_rate, term_weeks, expected_agreement_version]
    output: FinancingPlan
    side_effects: ["prior DRAFT plan -> SUPERSEDED", "increments RouteAgreement.version by 1", "ERR_FINANCING_PLAN_EXISTS when a non-DRAFT, non-SUPERSEDED plan exists"]

  - method: GET
    path: "/agreements/{id}/financing-plans"
    description: "List financing plans of an agreement"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FinancingPlan[]"
    side_effects: []

  - method: POST
    path: "/financing-plans/{id}/disburse"
    description: "Disburse a DRAFT plan (requires parent agreement still DRAFT); sets disburse_date, outstanding principal, computes weekly payment"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/financing-plans/{id}/payments"
    description: "Record a payment on an ACTIVE or DELINQUENT plan; interest-first application; Distributor role restricted to own agreement's plan"
    roles: [Distributor, CreditAnalyst]
    code: 200
    input: [amount_cents]
    output: FinancingPlan
    side_effects: ["interest-first application per calculations.financing_payment_application", "-> PAID_OFF when outstanding reaches 0"]

  - method: POST
    path: "/distributors/{id}/retail-accounts"
    description: "Create a retail account for a distributor; requires the distributor's ACTIVE agreement"
    roles: [Distributor, RouteOpsManager]
    code: 201
    input: [store_name, delivery_weekdays]
    output: RetailAccount
    side_effects: []

  - method: GET
    path: "/distributors/{id}/retail-accounts"
    description: "List a distributor's retail accounts"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["limit?", "offset?"]
    output: "RetailAccount[]"
    side_effects: []

  - method: POST
    path: "/retail-accounts/{id}/audits"
    description: "Post a service-standard audit (shelf stocking / rotation / display scores 0..100); recomputes account compliance and the agreement's trailing-90-day strike count; 3rd strike auto-suspends the agreement"
    roles: [RouteOpsManager]
    code: 201
    input: [audit_date, shelf_stock_score, rotation_score, display_score]
    output: RetailAccount
    side_effects: ["audit appended to audit_log", "compliance_score recomputed", "agreement strike_count recomputed", "auto-suspend cascade at strike_count >= 3"]

  - method: POST
    path: "/distributors/{id}/orders"
    description: "Create a DRAFT order (demand forecast); skus must exist in the agreement bakery catalog"
    roles: [Distributor]
    code: 201
    input: [delivery_date, lines]
    output: DailyOrder
    side_effects: []

  - method: GET
    path: "/distributors/{id}/orders"
    description: "List a distributor's orders"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["status?", "delivery_date?", "limit?", "offset?"]
    output: "DailyOrder[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/submit"
    description: "Submit a DRAFT order as a firm order; requires ACTIVE agreement, >= 2 days lead time, known skus"
    roles: [Distributor]
    code: 200
    input: []
    output: DailyOrder
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm a SUBMITTED order against its production day (OCC on the day version); reserves capacity"
    roles: [RouteOpsManager]
    code: 200
    input: [expected_production_day_version]
    output: DailyOrder
    side_effects: ["status -> CONFIRMED", "ProductionDay.allocated_units += units_total", "increments ProductionDay.version by 1"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a SUBMITTED or CONFIRMED order; a CONFIRMED cancellation releases reserved capacity"
    roles: [Distributor]
    code: 200
    input: []
    output: DailyOrder
    side_effects: ["status -> CANCELLED", "capacity release when CONFIRMED"]

  - method: POST
    path: "/orders/{id}/record-delivery"
    description: "Distributor records delivered quantities for a CONFIRMED order after its production day is CLOSED; computes total_charge_cents and debits the trade ledger; credit-limit checked"
    roles: [Distributor]
    code: 200
    input: [delivered_lines]
    output: DailyOrder
    side_effects: ["status -> DELIVERED", "Distributor.trade_balance_cents += total_charge_cents"]

  - method: POST
    path: "/orders/{id}/reconcile"
    description: "Company reconciles a DELIVERED order against verified quantities; shortage credits the trade ledger"
    roles: [RouteOpsManager]
    code: 200
    input: [verified_lines]
    output: DailyOrder
    side_effects: ["status -> RECONCILED", "Distributor.trade_balance_cents -= shortage_credit_cents"]

  - method: POST
    path: "/distributors/{id}/stale-claims"
    description: "File a stale product claim; blocked only when the agreement is SUSPENDED_CLASSIFICATION or EXITING/EXITED; computes provisional (uncapped) credit"
    roles: [Distributor]
    code: 201
    input: [items]
    output: StaleReturnClaim
    side_effects: ["provisional_credit_cents computed"]

  - method: GET
    path: "/distributors/{id}/stale-claims"
    description: "List a distributor's stale claims"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StaleReturnClaim[]"
    side_effects: []

  - method: POST
    path: "/stale-claims/{id}/decide"
    description: "RouteOps decision on a SUBMITTED claim: APPROVE (freezes uncapped approved_credit_cents), DENY, or REQUEST_INFO"
    roles: [RouteOpsManager]
    code: 200
    input: [decision, "decision_note?"]
    output: StaleReturnClaim
    side_effects: ["status -> APPROVED | DENIED | NEEDS_INFO"]

  - method: POST
    path: "/stale-claims/{id}/resubmit"
    description: "Distributor resubmits a NEEDS_INFO claim with corrected items; all submission validations re-run and provisional credit is recomputed"
    roles: [Distributor]
    code: 200
    input: [items]
    output: StaleReturnClaim
    side_effects: ["status -> SUBMITTED", "provisional_credit_cents recomputed"]

  - method: POST
    path: "/stale-claims/{id}/issue-credit"
    description: "Issue credit on an APPROVED claim (CreditAnalyst only - segregated from decide); applies the weekly stale cap, debits the distributor trade ledger"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: StaleReturnClaim
    side_effects: ["status -> CREDIT_ISSUED", "Distributor.trade_balance_cents -= issued_credit_cents", "cap_truncated_cents recorded"]

  - method: GET
    path: "/agreements/{id}/transfers"
    description: "List territory transfers of an agreement (0 or 1 rows)"
    roles: [CompanyAdmin, RouteOpsManager, CreditAnalyst, Distributor]
    code: 200
    input: ["limit?", "offset?"]
    output: "TerritoryTransfer[]"
    side_effects: []

  - method: POST
    path: "/transfers/{id}/settle"
    description: "Settle a PENDING transfer: computes financing payoff, pays out the distributor, settles the financing plan, exits the agreement, returns the territory to AVAILABLE"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: TerritoryTransfer
    side_effects: ["status -> SETTLED", "FinancingPlan -> SETTLED_ON_EXIT when live", "Agreement -> EXITED", "Territory -> AVAILABLE", "Distributor -> EXITED when no live agreements remain"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role is valid but not in the endpoint's roles list (includes CreditAnalyst attempting decide and RouteOpsManager attempting issue-credit under segregation of duties)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Distributor role acting on another distributor's resource" }
  - { id: ERR_REINSTATE_FORBIDDEN, http: 403, condition: "RouteOpsManager attempting reinstate from SUSPENDED_CLASSIFICATION (CompanyAdmin only)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_TERRITORY_NOT_FOUND, http: 404, condition: "Body territory_id does not exist" }
  - { id: ERR_DISTRIBUTOR_NOT_FOUND, http: 404, condition: "Body distributor_id does not exist" }
  - { id: ERR_BAKERY_NOT_FOUND, http: 404, condition: "Body bakery_id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, bad range, duplicate sku in an order/catalog, lender_name mismatch with financier_type, financed_amount exceeds purchase price, financing principal != financed_amount" }
  - { id: ERR_AUDIT_SCORE_RANGE, http: 400, condition: "Audit score outside 0..100 inclusive" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Generic machine violation: trigger not allowed from the entity's current state (terminal lockdown included)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires the distributor's agreement in a state other than its current one (submit/confirm/record-delivery/retail-account create require ACTIVE; claims blocked in SUSPENDED_CLASSIFICATION, EXITING, EXITED)" }
  - { id: ERR_TERRITORY_NOT_LISTED, http: 409, condition: "Agreement creation against a territory not in LISTED status" }
  - { id: ERR_DISTRIBUTOR_AGREEMENT_OVERLAP, http: 409, condition: "New agreement's half-open [start_date, end_date) interval intersects another non-terminal agreement of the same distributor (adjacency allowed: end == start does not intersect)" }
  - { id: ERR_PRODUCTION_DAY_EXISTS, http: 409, condition: "Production day already exists for (bakery, date)" }
  - { id: ERR_PRODUCTION_DAY_LOCKED, http: 409, condition: "Confirm against a CLOSED production day, or record-delivery before the day is CLOSED" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Confirm would push allocated_units above capacity_units (allocated + units <= capacity is required; equality is allowed)" }
  - { id: ERR_ORDER_LEAD_TIME, http: 422, condition: "Submit with delivery_date less than 2 days after the current logical date" }
  - { id: ERR_SKU_UNKNOWN, http: 422, condition: "Line or claim item sku not present in the agreement bakery's product_catalog (or, for claims, never delivered to this distributor)" }
  - { id: ERR_CLAIM_NOT_STALE_YET, http: 422, condition: "pull_date earlier than delivery_date + shelf_life_days for the item" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "pull_date later than delivery_date + shelf_life_days + 7, or claim submitted more than 2 days after pull_date" }
  - { id: ERR_CLAIM_QTY_EXCEEDS_ELIGIBLE, http: 422, condition: "pulled_qty exceeds delivered qty minus already-credited qty for (distributor, sku, delivery_date)" }
  - { id: ERR_CLAIM_NOT_REVIEWABLE, http: 409, condition: "decide called on a claim not in SUBMITTED" }
  - { id: ERR_STALE_CAP_EXHAUSTED, http: 409, condition: "Weekly stale cap remaining for the claim's agreement/week is 0" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "record-delivery would push trade_balance_cents above credit_limit_cents" }
  - { id: ERR_PAYMENT_BELOW_INTEREST, http: 409, condition: "Payment amount smaller than the accrued interest portion" }
  - { id: ERR_FINANCING_NOT_DISBURSED, http: 409, condition: "Activate attempted with financed_amount_cents > 0 but no ACTIVE financing plan" }
  - { id: ERR_FINANCING_PLAN_EXISTS, http: 409, condition: "Plan creation while a non-DRAFT, non-SUPERSEDED plan exists for the agreement" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CompanyAdmin
    description: "Company superuser for static structure and the ops-run checkpoint: bakeries, territories, distributors, production days, clock, classification-dispute resolution"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /bakeries"
      - "POST /bakeries/{id}/production-days"
      - "POST /production-days/{id}/close"
      - "POST /territories"
      - "POST /territories/{id}/list-for-sale"
      - "POST /distributors"
      - "reinstate from SUSPENDED_CLASSIFICATION (exclusive vs RouteOpsManager)"
    shared_operations:
      - "All GET endpoints"
      - "POST /agreements/{id}/reinstate (shared with RouteOpsManager for SUSPENDED_SERVICE)"
  - name: RouteOpsManager
    description: "Company route operations: agreements lifecycle, order confirmation and reconciliation, service audits, stale-claim decisions. May NOT issue credits or record financing payments (segregation of duties vs CreditAnalyst)."
    identity: opaque
    exclusive_operations:
      - "POST /agreements"
      - "POST /agreements/{id}/activate"
      - "POST /agreements/{id}/suspend"
      - "POST /agreements/{id}/exit"
      - "POST /orders/{id}/confirm"
      - "POST /orders/{id}/reconcile"
      - "POST /retail-accounts/{id}/audits"
      - "POST /stale-claims/{id}/decide"
    shared_operations:
      - "All GET endpoints"
      - "POST /agreements/{id}/reinstate (SUSPENDED_SERVICE only)"
      - "POST /distributors/{id}/retail-accounts (shared with the owning Distributor)"
  - name: CreditAnalyst
    description: "Company credit/finance desk: financing plans, disbursement, settlement of territory transfers, issuing approved stale credits. May NOT decide claims (segregation of duties vs RouteOpsManager)."
    identity: opaque
    exclusive_operations:
      - "POST /agreements/{id}/financing-plans"
      - "POST /financing-plans/{id}/disburse"
      - "POST /stale-claims/{id}/issue-credit"
      - "POST /transfers/{id}/settle"
    shared_operations:
      - "All GET endpoints"
      - "POST /financing-plans/{id}/payments (shared with the owning Distributor)"
  - name: Distributor
    description: "Independent distributor acting on own resources only: forecasts/orders, deliveries self-report, stale claims, retail accounts, financing payments"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /distributors/{id}/orders"
      - "POST /orders/{id}/submit"
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/record-delivery"
      - "POST /distributors/{id}/stale-claims"
      - "POST /stale-claims/{id}/resubmit"
    shared_operations:
      - "GET endpoints scoped to own distributor id"
      - "POST /distributors/{id}/retail-accounts (own id only)"
      - "POST /financing-plans/{id}/payments (own agreement's plan only)"
