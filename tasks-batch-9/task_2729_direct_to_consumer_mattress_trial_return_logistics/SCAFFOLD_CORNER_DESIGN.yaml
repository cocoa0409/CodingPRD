            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /return-cases"
              payload: { order_id: "${order_a}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${cust_b}"
            - call: "GET /trial-orders/${order_a}"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
          assert:
            - "trigger call 1: response code == 403 with data.error_id == ERR_NOT_OWNER"
            - "trigger call 2: response code == 403 with data.error_id == ERR_NOT_OWNER (reads are owned too)"
            - "GET /return-cases?order_id=${order_a} (as TrialSupportAgent) returns total_count == 0"
            - "TrialOrder.${order_a}.trial_status == TRIAL_ACTIVE"

