            - "MonitoringSite.${site_a_id}.status == PROPOSED"
            - "Monitor.${mon_id}.monitor_status == PENDING_APPROVAL, consecutive_qc_failure_count == 0, out_of_service_day_count == 0, last_span_check_at == null"
            - "DataBatch.${b_id}.validation_status == RAW and submission_status == UNSUBMITTED"
