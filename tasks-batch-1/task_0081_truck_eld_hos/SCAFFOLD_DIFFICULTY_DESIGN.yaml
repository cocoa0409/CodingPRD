  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_invalid_beats_business_safety_pc_not_authorized
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          state (ERR_INVALID_STATE / priority 6) vs business_safety (ERR_PC_NOT_AUTHORIZED / priority 9):
          a mark-error on an already INACTIVE_ERROR event that ALSO would fail a safety check returns the
          higher-priority state error. Pairing: state vs business_safety.
        test_recipe:
          setup:
            - "Driver D pc_authorized false. A DRIVING event is marked INACTIVE_ERROR. A second mark-error on the same event is attempted."
          setup_api_calls:
