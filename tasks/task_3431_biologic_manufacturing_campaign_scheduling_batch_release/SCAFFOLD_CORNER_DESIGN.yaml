            - *k_batch
            - *k_test_up
          trigger:
            - call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "CELL_VIABILITY", phase: "UPSTREAM", measured_value: 86.0, unit: "PCT", spec_min: 80.0, spec_max: 100.0, expected_batch_version: "${bat_v}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
            - *k_getb
            - call: "POST /batches/${batch_id}/tests"
