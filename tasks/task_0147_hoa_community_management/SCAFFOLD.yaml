scenario: "HOA Community Management: regular/special assessments, late fees, ACC architectural approval (appearance/landscaping), board elections, violation fines, mortgage Lien, Reserve fund study."
domain_name: "hoa-community-management"
api_prefix: "/hoa"

complexity_profile:
  primary_archetype: "Multi-party negotiation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Dual-variant calculation"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Scheduled / deferred actions"

  entity_topology: "flat"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"

  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: address
        type: string
        source: input
        description: "Street address of the unit"
      - name: owner_member_id
        type: string
        source: input
        description: "FK to Member.id who currently owns this unit"
      - name: share_factor
        type: number
        source: input
        description: "Pro-rata share of assessable area, decimal with 4 places"
        constraints: ">= 0.0001 and <= 1.0; sum across all units MUST equal 1.0000 (validated on create/update)"
      - name: mortgage_holder
        type: string
        source: input
        description: "Name of mortgage lender; null if no mortgage on record"
        default: null
      - name: lien_status
        type: enum
        source: computed
        description: "Lien state derived from outstanding ledger; mirrors Lien.status when an active lien exists, else NONE"
        constraints: "enum: NONE, NOTICE_SENT, RECORDED, RELEASED"
        default: "NONE"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the homeowner"
      - name: email
        type: string
        source: input
        description: "Contact email, unique per HOA"
      - name: eligible_to_vote
        type: boolean
        source: computed
        description: "True iff owns at least one Unit and total_overdue_amount_cents == 0 at the moment of computation"
      - name: board_role
        type: enum
        source: computed
        description: "Current elected board seat held by this member, if any"
        constraints: "enum: NONE, PRESIDENT, TREASURER, SECRETARY, DIRECTOR"
        default: "NONE"
      - name: total_overdue_amount_cents
        type: integer
        source: computed
        description: "Sum of overdue principal + late fees + unpaid violation fines across all owned units, in cents"
        default: 0

  - name: AssessmentCycle
    parent: null
    common_fields: false
    fields:
      - name: cycle_type
        type: enum
        source: input
        description: "Regular quarterly billing or board-approved special levy"
        constraints: "enum: REGULAR, SPECIAL"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the billable period"
      - name: due_date
        type: datetime
        source: input
        description: "Date by which payment is due; late fees begin accruing the day after"
      - name: total_levy_cents
        type: integer
        source: input
        description: "Total dollars to raise across all units, in cents"
        constraints: ">= 100"
      - name: approval_resolution_id
        type: string
        source: input
        description: "FK to BoardResolution.id that authorized this cycle; required for SPECIAL, optional for REGULAR"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state of the cycle"
        constraints: "enum: DRAFT, ISSUED, CLOSED, VOIDED"
        default: "DRAFT"

  - name: AssessmentCharge
    parent: AssessmentCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK to AssessmentCycle.id"
      - name: unit_id
        type: string
        source: input
        description: "FK to Unit.id; this charge is the unit's share of the cycle"
      - name: principal_cents
        type: integer
        source: computed
        description: "round_half_up(cycle.total_levy_cents * unit.share_factor); recomputed only at issuance"
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Accrued late fee, see calculations.late_fee_assessment; recomputed on clock advance"
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents allocated to this charge"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Per-charge settlement state"
        constraints: "enum: OPEN, PAID, OVERDUE, WRITTEN_OFF"
        default: "OPEN"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK to Member.id who tendered the payment"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount tendered, in cents"
        constraints: "> 0"
      - name: allocations
        type: array
        source: computed
        description: "Array of {charge_id, applied_cents}; sums to amount_cents; produced by waterfall allocator"

  - name: ACCRequest
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK to Unit.id where the modification is proposed"
      - name: submitted_by_member_id
        type: string
        source: input
        description: "FK to Member.id; MUST equal Unit.owner_member_id at submission time"
      - name: category
        type: enum
        source: input
        description: "Scope of the proposed modification"
        constraints: "enum: APPEARANCE, LANDSCAPING"
      - name: description
        type: string
        source: input
        description: "Free-text description of the proposed change"
      - name: submitted_at
        type: datetime
        source: system
        description: "Server timestamp at submission, anchored to clock"
      - name: deemed_decision_deadline
        type: datetime
        source: computed
        description: "submitted_at + 30 days; on/after this instant with no decision, request auto-resolves per category rule"
      - name: status
        type: enum
        source: computed
        description: "Approval lifecycle"
        constraints: "enum: SUBMITTED, UNDER_REVIEW, APPROVED, DENIED, AUTO_APPROVED, AUTO_DENIED, WITHDRAWN"
        default: "SUBMITTED"
      - name: yes_votes
        type: integer
        source: computed
        description: "Count of ACCVote rows with vote=YES on this request"
        default: 0
      - name: no_votes
        type: integer
        source: computed
        description: "Count of ACCVote rows with vote=NO on this request"
        default: 0

  - name: ACCVote
    parent: ACCRequest
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK to ACCRequest.id"
      - name: voter_member_id
        type: string
        source: input
        description: "FK to Member.id; MUST hold board_role IN {PRESIDENT, SECRETARY, DIRECTOR} at the moment of vote (the three-seat ACC subset of the board)"
      - name: vote
        type: enum
        source: input
        description: "Cast ballot"
        constraints: "enum: YES, NO"
      - name: cast_at
        type: datetime
        source: system
        description: "Server timestamp at vote submission"

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK to Unit.id where the violation was observed"
      - name: opened_by_member_id
        type: string
        source: input
        description: "FK to Member.id (must be SECRETARY or PRESIDENT) who logged the violation"
      - name: opened_at
        type: datetime
        source: system
        description: "Server timestamp at opening"
      - name: cure_deadline
        type: datetime
        source: computed
        description: "opened_at + 14 days; if not CURED by then, fine_cents is finalized and posted"
      - name: occurrence_index
        type: integer
        source: computed
        description: "1-based count of violations on this unit_id ordered by opened_at (this row is index N where N-1 prior violations exist with status IN {FINED, CURED, WAIVED})"
      - name: fine_cents
        type: integer
        source: computed
        description: "0 for index 1; per fine_schedule for index >= 2; see calculations.violation_fine_amount"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the violation"
        constraints: "enum: OPEN, CURED, FINED, WAIVED"
        default: "OPEN"

  - name: BoardResolution
    parent: null
    common_fields: true
    fields:
      - name: subject
        type: enum
        source: input
        description: "What the resolution authorizes"
        constraints: "enum: SPECIAL_ASSESSMENT, RESERVE_STUDY_ADOPTION, FINE_WAIVER, LIEN_RECORDATION, LIEN_RELEASE"
      - name: target_id
        type: string
        source: input
        description: "FK to the entity the resolution targets (AssessmentCycle.id for SPECIAL_ASSESSMENT, ReserveStudy.id for RESERVE_STUDY_ADOPTION, Violation.id for FINE_WAIVER, Lien.id for LIEN_*)"
      - name: yes_votes
        type: integer
        source: computed
        description: "Count of board members with board_role IN {PRESIDENT, TREASURER, SECRETARY, DIRECTOR} who voted YES"
        default: 0
      - name: no_votes
        type: integer
        source: computed
        description: "Count of board members with board_role IN {PRESIDENT, TREASURER, SECRETARY, DIRECTOR} who voted NO"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Resolution lifecycle"
        constraints: "enum: PROPOSED, PASSED, FAILED, EXECUTED"
        default: "PROPOSED"

  - name: ElectionCycle
    parent: null
    common_fields: true
    fields:
      - name: seat
        type: enum
        source: input
        description: "Which board seat is up for election"
        constraints: "enum: PRESIDENT, TREASURER, SECRETARY, DIRECTOR"
      - name: nomination_open_at
        type: datetime
        source: input
        description: "Inclusive instant nominations open"
      - name: voting_open_at
        type: datetime
        source: input
        description: "Inclusive instant voting opens; MUST be > nomination_open_at"
      - name: voting_close_at
        type: datetime
        source: input
        description: "Exclusive instant voting closes; MUST be > voting_open_at"
      - name: quorum_pct
        type: number
        source: input
        description: "Minimum fraction of eligible voters required (e.g., 0.40)"
        constraints: ">= 0.10 and <= 1.00"
        default: 0.40
      - name: eligible_voter_count_at_open
        type: integer
        source: computed
        description: "Snapshot of count(Member where eligible_to_vote==true) taken at voting_open_at; pinned for the duration"
      - name: status
        type: enum
        source: computed
        description: "Election lifecycle"
        constraints: "enum: NOMINATION, VOTING, TALLIED, CERTIFIED, FAILED_QUORUM, VOIDED"
        default: "NOMINATION"
      - name: winner_candidate_id
        type: string
        source: computed
        description: "FK to Candidate.id of the winner after CERTIFIED; null otherwise"
        default: null

  - name: Candidate
    parent: ElectionCycle
    common_fields: false
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK to ElectionCycle.id"
      - name: member_id
        type: string
        source: input
        description: "FK to Member.id; MUST have eligible_to_vote==true at nomination time"
      - name: nominated_at
        type: datetime
        source: system
        description: "Server timestamp at nomination — used as tie-break"
      - name: vote_count
        type: integer
        source: computed
        description: "Count of Ballot rows pointing at this candidate"
        default: 0

  - name: Ballot
    parent: ElectionCycle
    common_fields: false
    fields:
      - name: election_id
        type: string
        source: input
        description: "FK to ElectionCycle.id"
      - name: voter_member_id
        type: string
        source: input
        description: "FK to Member.id; MUST have eligible_to_vote==true at cast time AND at voting_open_at snapshot"
      - name: candidate_id
        type: string
        source: input
        description: "FK to Candidate.id whose election_id MUST equal this ballot's election_id"

  - name: Lien
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK to Unit.id encumbered by this lien"
      - name: principal_cents_at_record
        type: integer
        source: computed
        description: "Snapshot of overdue principal + late fees + unpaid violation fines on the unit at the moment of recordation"
      - name: mortgage_holder_at_record
        type: string
        source: computed
        description: "Snapshot of Unit.mortgage_holder at recordation; copied verbatim, used in notice"
      - name: recorded_at
        type: datetime
        source: system
        description: "Server timestamp when status transitioned to RECORDED"
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Server timestamp when status transitioned to RELEASED"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lien lifecycle"
        constraints: "enum: NOTICE_SENT, RECORDED, RELEASED"
        default: "NOTICE_SENT"

  - name: ReserveStudy
    parent: null
    common_fields: true
    fields:
      - name: study_year
        type: integer
        source: input
        description: "Calendar year the study covers"
      - name: components
        type: array
        source: input
        description: "Array of {component_name, replacement_cost_cents, useful_life_years, remaining_life_years}; at least one element"
      - name: current_reserve_balance_cents
        type: integer
        source: input
        description: "HOA's reserve account balance at the study snapshot, in cents"
      - name: full_funding_target_cents
        type: integer
        source: computed
        description: "Sum across components of round_half_up(replacement_cost_cents * (useful_life_years - remaining_life_years) / useful_life_years)"
      - name: funded_ratio
        type: number
        source: computed
        description: "current_reserve_balance_cents / full_funding_target_cents; 4 decimal places, round_half_up; null when full_funding_target_cents == 0"
      - name: posture
        type: enum
        source: computed
        description: "Derived adequacy tier"
        constraints: "enum: OK, RESTRICTED, SPECIAL_ASSESSMENT_REQUIRED"
      - name: adopted_resolution_id
        type: string
        source: input
        description: "FK to BoardResolution.id (subject==RESERVE_STUDY_ADOPTION) once adopted; null until then"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Study lifecycle"
        constraints: "enum: DRAFT, ADOPTED, SUPERSEDED"
        default: "DRAFT"

state_machines:
  - entity: AssessmentCycle
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /hoa/assessment-cycles/{id}/issue"
        actor: TreasurerRole
        preconditions:
          - "cycle_type==SPECIAL implies approval_resolution_id is set AND BoardResolution.status==PASSED"
          - "sum of Unit.share_factor across all units == 1.0000"
          - "total_levy_cents >= 100"
        side_effects:
          - "Generate one AssessmentCharge per Unit with principal_cents = round_half_up(total_levy_cents * unit.share_factor); guarantee sum(principal_cents) == total_levy_cents by allocating any rounding remainder cent-by-cent to units sorted by share_factor DESC, then by Unit.id ASC"
          - "Each AssessmentCharge.status set to OPEN; charge.created_at = now()"

      - from: ISSUED
        to: CLOSED
        trigger: "POST /hoa/assessment-cycles/{id}/close"
        actor: TreasurerRole
        preconditions:
          - "Every child AssessmentCharge.status IN {PAID, WRITTEN_OFF}"
        side_effects:
          - "cycle.updated_at refreshed"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /hoa/assessment-cycles/{id}/void"
        actor: TreasurerRole
        preconditions:
          - "No AssessmentCharge rows exist for this cycle (charges are only created at ISSUED)"
        side_effects:
          - "cycle.updated_at refreshed"

  - entity: AssessmentCharge
    initial_state: OPEN
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "system: clock_now > cycle.due_date AND principal_cents + late_fee_cents > paid_cents"
        actor: system
        preconditions:
          - "Evaluated lazily during POST /hoa/_clock/advance and during any read/mutation touching the charge"
        side_effects:
          - "Apply calculations.late_fee_assessment; increment late_fee_cents accordingly"
          - "Recompute owner Member.total_overdue_amount_cents"
          - "If owner Member.total_overdue_amount_cents >= 180000 AND charge has been OVERDUE >= 60 days, eligible for Lien.NOTICE_SENT (creation still requires a SECRETARY action)"

      - from: OVERDUE
        to: PAID
        trigger: "POST /hoa/payments (waterfall allocation drains principal+late_fee for this charge)"
        actor: Member
        preconditions:
          - "paid_cents + applied_cents >= principal_cents + late_fee_cents"
        side_effects:
          - "Update paid_cents; recompute owner Member.total_overdue_amount_cents"
          - "If owner now has total_overdue_amount_cents == 0 AND owner has an active Lien in RECORDED, Lien becomes eligible for RELEASE (requires BoardResolution subject==LIEN_RELEASE)"

      - from: OPEN
        to: PAID
        trigger: "POST /hoa/payments (waterfall allocates enough to fully cover principal before due_date)"
        actor: Member
        preconditions:
          - "paid_cents + applied_cents >= principal_cents AND late_fee_cents == 0"
        side_effects:
          - "Update paid_cents; recompute owner Member.total_overdue_amount_cents"

      - from: OVERDUE
        to: WRITTEN_OFF
        trigger: "POST /hoa/assessment-charges/{id}/write-off"
        actor: TreasurerRole
        preconditions:
          - "Owner Unit has an active Lien in status RELEASED with released_at >= charge.created_at (foreclosure-completed analog)"
        side_effects:
          - "charge.updated_at refreshed; recompute owner Member.total_overdue_amount_cents"

  - entity: ACCRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, AUTO_APPROVED, AUTO_DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /hoa/acc-requests/{id}/begin-review"
        actor: SecretaryRole
        preconditions:
          - "Unit owner (submitted_by_member_id) has Member.total_overdue_amount_cents == 0"
        side_effects:
          - "deemed_decision_deadline = submitted_at + 30 days (idempotent)"

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system: a POST /hoa/acc-requests/{id}/votes brings yes_votes >= 2 (out of 3-seat ACC)"
        actor: system
        preconditions:
          - "yes_votes >= 2 AND now < deemed_decision_deadline"
        side_effects:
          - "Stamp updated_at"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "system: a POST /hoa/acc-requests/{id}/votes brings no_votes >= 2"
        actor: system
        preconditions:
          - "no_votes >= 2 AND now < deemed_decision_deadline"
        side_effects:
          - "Stamp updated_at"

      - from: UNDER_REVIEW
        to: AUTO_APPROVED
        trigger: "system: clock_now >= deemed_decision_deadline AND category==LANDSCAPING AND status==UNDER_REVIEW"
        actor: system
        preconditions:
          - "category == LANDSCAPING"
        side_effects:
          - "Stamp updated_at; record auto-resolution"
        note: "Landscaping requests use silent-approval after 30 days; APPEARANCE requests use silent-denial — split per category."

      - from: UNDER_REVIEW
        to: AUTO_DENIED
        trigger: "system: clock_now >= deemed_decision_deadline AND category==APPEARANCE AND status==UNDER_REVIEW"
        actor: system
        preconditions:
          - "category == APPEARANCE"
        side_effects:
          - "Stamp updated_at; record auto-resolution"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "DELETE /hoa/acc-requests/{id}"
        actor: Member
        preconditions:
          - "Caller member_id == submitted_by_member_id"
        side_effects:
          - "Stamp updated_at"

      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "DELETE /hoa/acc-requests/{id}"
        actor: Member
        preconditions:
          - "Caller member_id == submitted_by_member_id AND yes_votes < 2 AND no_votes < 2"
        side_effects:
          - "Stamp updated_at"

  - entity: Violation
    initial_state: OPEN
    terminal_states: [CURED, FINED, WAIVED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /hoa/violations/{id}/cure"
        actor: SecretaryRole
        preconditions:
          - "now <= cure_deadline"
        side_effects:
          - "fine_cents stays 0; updated_at refreshed"

      - from: OPEN
        to: FINED
        trigger: "system: clock_now > cure_deadline AND status==OPEN"
        actor: system
        preconditions:
          - "now > cure_deadline"
        side_effects:
          - "Set fine_cents via calculations.violation_fine_amount"
          - "Recompute owner Member.total_overdue_amount_cents (cascade-link 1: Violation.FINED → Member.total_overdue_amount_cents → if newly crosses 180000 AND any AssessmentCharge has been OVERDUE >= 60 days, becomes Lien-eligible)"

      - from: OPEN
        to: WAIVED
        trigger: "POST /hoa/violations/{id}/waive"
        actor: SecretaryRole
        preconditions:
          - "There exists a BoardResolution with subject==FINE_WAIVER, target_id==violation.id, status==PASSED"
        side_effects:
          - "fine_cents stays 0; updated_at refreshed; mark referenced BoardResolution.status=EXECUTED"

      - from: FINED
        to: WAIVED
        trigger: "POST /hoa/violations/{id}/waive"
        actor: SecretaryRole
        preconditions:
          - "Fine has not been paid (fine is recorded as part of Member.total_overdue_amount_cents)"
          - "There exists a BoardResolution with subject==FINE_WAIVER, target_id==violation.id, status==PASSED"
        side_effects:
          - "Reset fine_cents to 0; recompute owner Member.total_overdue_amount_cents; mark referenced BoardResolution.status=EXECUTED"

  - entity: Lien
    initial_state: NOTICE_SENT
    terminal_states: [RELEASED]
    transitions:
      - from: NOTICE_SENT
        to: RECORDED
        trigger: "POST /hoa/liens/{id}/record"
        actor: PresidentRole
        preconditions:
          - "There exists a BoardResolution with subject==LIEN_RECORDATION, target_id==lien.id, status==PASSED"
          - "Unit.owner Member.total_overdue_amount_cents >= 180000"
          - "At least one AssessmentCharge on the unit has been OVERDUE for >= 60 days as of now"
          - "now - lien.created_at >= 30 days (notice cooling-off period)"
        side_effects:
          - "Set recorded_at = now"
          - "Snapshot principal_cents_at_record = current Member.total_overdue_amount_cents for the unit's owner"
          - "Snapshot mortgage_holder_at_record = Unit.mortgage_holder"
          - "Cascade: Unit.lien_status mirrors RECORDED"

      - from: RECORDED
        to: RELEASED
        trigger: "POST /hoa/liens/{id}/release"
        actor: PresidentRole
        preconditions:
          - "There exists a BoardResolution with subject==LIEN_RELEASE, target_id==lien.id, status==PASSED"
          - "Unit owner Member.total_overdue_amount_cents == 0"
        side_effects:
          - "Set released_at = now"
          - "Cascade: Unit.lien_status mirrors RELEASED"
          - "Mark BoardResolution.status = EXECUTED"

  - entity: ElectionCycle
    initial_state: NOMINATION
    terminal_states: [CERTIFIED, FAILED_QUORUM, VOIDED]
    transitions:
      - from: NOMINATION
        to: VOTING
        trigger: "system: clock_now >= voting_open_at AND status==NOMINATION"
        actor: system
        preconditions:
          - "At least one Candidate registered"
        side_effects:
          - "Snapshot eligible_voter_count_at_open = count(Member where eligible_to_vote==true)"

      - from: NOMINATION
        to: VOIDED
        trigger: "system: clock_now >= voting_open_at AND status==NOMINATION AND no Candidate exists"
        actor: system
        preconditions:
          - "Zero Candidate rows"
        side_effects:
          - "Stamp updated_at"

      - from: VOTING
        to: TALLIED
        trigger: "system: clock_now >= voting_close_at AND status==VOTING"
        actor: system
        preconditions: []
        side_effects:
          - "Compute total_ballots = count(Ballot where election_id==this.id)"
          - "If total_ballots < ceil(eligible_voter_count_at_open * quorum_pct): transition to FAILED_QUORUM instead"
          - "Else: rank Candidates by vote_count DESC, then nominated_at ASC; winner_candidate_id = top row"

      - from: VOTING
        to: FAILED_QUORUM
        trigger: "system: as above, when ballots below quorum"
        actor: system
        preconditions:
          - "total_ballots < ceil(eligible_voter_count_at_open * quorum_pct)"
        side_effects:
          - "Stamp updated_at; no winner set"

      - from: TALLIED
        to: CERTIFIED
        trigger: "POST /hoa/elections/{id}/certify"
        actor: SecretaryRole
        preconditions:
          - "winner_candidate_id is set"
        side_effects:
          - "Set Member(winner.member_id).board_role = this.seat (cascade-link 2 origin)"
          - "If a prior Member held this seat with board_role==seat, demote that Member.board_role to NONE (cascade hop)"
          - "If the prior holder was a member of the 3-seat ACC subset and is no longer on the board, any in-flight ACCVote rows by that member made BEFORE this transition remain counted; new votes are blocked by precondition (cascade hop)"

  - entity: BoardResolution
    initial_state: PROPOSED
    terminal_states: [FAILED, EXECUTED]
    transitions:
      - from: PROPOSED
        to: PASSED
        trigger: "system: POST /hoa/board-resolutions/{id}/votes brings yes_votes >= 3 (majority of 4-seat board)"
        actor: system
        preconditions:
          - "yes_votes >= 3"
        side_effects:
          - "Stamp updated_at"

      - from: PROPOSED
        to: FAILED
        trigger: "system: POST /hoa/board-resolutions/{id}/votes brings no_votes >= 2 OR clock_now > created_at + 14 days"
        actor: system
        preconditions:
          - "no_votes >= 2 OR now > created_at + 14 days"
        side_effects:
          - "Stamp updated_at"

      - from: PASSED
        to: EXECUTED
        trigger: "system: the target action consumes the resolution (e.g., Lien.RECORD, Violation.WAIVE, AssessmentCycle.issue for SPECIAL, ReserveStudy.adopt)"
        actor: system
        preconditions: []
        side_effects:
          - "Stamp updated_at; resolution may not be reused"

  - entity: ReserveStudy
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /hoa/reserve-studies/{id}/adopt"
        actor: TreasurerRole
        preconditions:
          - "adopted_resolution_id is set AND BoardResolution(adopted_resolution_id).status==PASSED AND subject==RESERVE_STUDY_ADOPTION"
        side_effects:
          - "If posture==SPECIAL_ASSESSMENT_REQUIRED, set a flag preventing new ACCRequest.begin-review (cascade-link 2: ReserveStudy.ADOPT → posture==SPECIAL_ASSESSMENT_REQUIRED → ACCRequest.begin-review blocked for any UNDER_REVIEW or future SUBMITTED → owner cannot proceed with discretionary modifications)"

      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system: a newer ReserveStudy for study_year >= this.study_year transitions to ADOPTED"
        actor: system
        preconditions: []
        side_effects:
          - "Stamp updated_at"

concurrency_rules:
  - scenario: "Two SecretaryRole users simultaneously begin review on the same SUBMITTED ACCRequest"
    guarantee: "Exactly one transition to UNDER_REVIEW succeeds; the second is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ACCRequest.status; CAS from SUBMITTED to UNDER_REVIEW"

  - scenario: "Member tenders two payments concurrently that together exceed total overdue, racing the lien-eligibility recompute"
    guarantee: "Each payment is allocated atomically; only the payment whose allocation first drives total_overdue_amount_cents to zero unlocks LIEN_RELEASE eligibility"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Optimistic concurrency on Member.total_overdue_amount_cents via Member.version"

  - scenario: "Two PresidentRole users simultaneously POST /hoa/liens/{id}/record"
    guarantee: "Exactly one record succeeds; second sees the lien already RECORDED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Lien.status; CAS from NOTICE_SENT to RECORDED"

  - scenario: "Two ballots cast for the same election by the same voter within the same instant"
    guarantee: "At most one Ballot row per (election_id, voter_member_id); duplicate rejected"
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    serialization: "First-writer-wins on uniqueness (election_id, voter_member_id)"

  - scenario: "Concurrent cure and auto-fine on the same Violation as clock crosses cure_deadline"
    guarantee: "If cure POST commits while clock_now <= cure_deadline, Violation moves to CURED and no fine is posted; otherwise the auto-FINED transition wins"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Violation.status (CAS from OPEN)"

calculations:
  - name: assessment_charge_allocation
    trigger: "AssessmentCycle.DRAFT → ISSUED transition; runs exactly once per cycle"
    algorithm: weighted_scoring
    formula: |
      For each Unit U:
        raw_share_cents = total_levy_cents * U.share_factor
        principal_cents[U] = round_half_up(raw_share_cents)
      remainder = total_levy_cents - sum(principal_cents)
      # Distribute remainder one cent at a time, to units sorted by (share_factor DESC, Unit.id ASC),
      # incrementing principal_cents[U] += 1 cent until remainder == 0 (or decrementing if remainder < 0).
    input_set: "All Unit rows (every unit pays into every cycle, no opt-out)"
    constants: {}
    precision: "Integer cents; round_half_up before remainder distribution"

  - name: late_fee_assessment
    trigger: "AssessmentCharge OPEN→OVERDUE transition; recomputed every system clock advance while charge remains overdue"
    algorithm: chronological
    formula: |
      # PINNED ORDER (per scaffold): one late fee per missed cycle period.
      # For an OVERDUE charge belonging to a REGULAR cycle:
      #   periods_missed = floor((clock_now - due_date) / 90 days) + 1   # +1 for the initial overdue period
      #   per_period_fee = max(FLAT_FEE_CENTS, round_half_up(principal_cents * PCT_RATE))
      #   late_fee_cents = per_period_fee * periods_missed
      # For SPECIAL cycles the period is 30 days, not 90:
      #   periods_missed = floor((clock_now - due_date) / 30 days) + 1
    input_set: "Single AssessmentCharge with status==OVERDUE; reads parent AssessmentCycle.cycle_type and due_date"
    constants:
      FLAT_FEE_CENTS: 2500
      PCT_RATE: 0.015
      REGULAR_PERIOD_DAYS: 90
      SPECIAL_PERIOD_DAYS: 30
    precision: "Integer cents; round_half_up at per_period_fee step, then integer multiply"
    variants:
      - name: per_cycle_accrual
        when: "This is the pinned variant used by the system"
        difference: "Late fee accrues in discrete steps at the end of each missed cycle period (90 days for REGULAR, 30 for SPECIAL). A charge 91 days overdue accrues 2 periods; a charge 89 days overdue accrues 1 period."
      - name: continuous_daily_accrual
        when: "Tempting alternative — REJECTED by the scaffold but commonly assumed"
        difference: "A naive reading might pro-rate the fee daily: per_day = per_period_fee / period_days, late_fee_cents = round_half_up(per_day * days_overdue). For a $1000 charge 100 days overdue under REGULAR cycles, per_cycle yields 2 * max(2500, 1500) = 5000 cents, but continuous_daily would yield round_half_up(2500 / 90 * 100) = 2778 cents — DIFFERENT NUMBER."

  - name: violation_fine_amount
    trigger: "Violation OPEN→FINED transition (system, when clock_now > cure_deadline)"
    algorithm: tiered_pricing
    formula: |
      occurrence_index = (1-based count of Violation rows for this unit_id with
                          status IN {FINED, CURED, WAIVED} and opened_at < this.opened_at) + 1
      if occurrence_index == 1: fine_cents = 0      # warning only
      elif occurrence_index == 2: fine_cents = 5000
      elif occurrence_index == 3: fine_cents = 10000
      else (occurrence_index >= 4): fine_cents = 20000
    input_set: "All Violation rows on the same unit_id with status IN {FINED, CURED, WAIVED} and opened_at strictly earlier than this row"
    constants: {}
    precision: "Integer cents; no rounding required"

  - name: member_total_overdue_recompute
    trigger: "AssessmentCharge OPEN/OVERDUE/PAID/WRITTEN_OFF transitions; Violation OPEN→FINED and FINED→WAIVED transitions; Payment.create"
    algorithm: aggregation
    formula: |
      total_overdue_amount_cents =
        sum(c.principal_cents + c.late_fee_cents - c.paid_cents
            for c in AssessmentCharge where c.unit_id IN owner.units AND c.status==OVERDUE)
        + sum(v.fine_cents
              for v in Violation where v.unit_id IN owner.units AND v.status==FINED
                                  AND no Payment.allocation has applied to v.id yet)
    input_set: "All AssessmentCharges with status==OVERDUE on units owned by this member; all FINED Violations on units owned by this member that are not yet paid"
    constants: {}
    precision: "Integer cents"

  - name: reserve_funded_ratio
    trigger: "ReserveStudy create or update of components/current_reserve_balance_cents fields"
    algorithm: aggregation
    formula: |
      full_funding_target_cents =
        sum_over_components( round_half_up(replacement_cost_cents * (useful_life_years - remaining_life_years) / useful_life_years) )
      if full_funding_target_cents == 0:
        funded_ratio = null
        posture = OK
      else:
        funded_ratio = round_half_up(current_reserve_balance_cents / full_funding_target_cents, 4 decimal places)
        if funded_ratio >= 0.70:           posture = OK
        elif funded_ratio >= 0.30:         posture = RESTRICTED
        else:                              posture = SPECIAL_ASSESSMENT_REQUIRED
    input_set: "Single ReserveStudy row"
    constants:
      OK_THRESHOLD: 0.70
      RESTRICTED_THRESHOLD: 0.30
    precision: "Integer cents at component level; ratio to 4 decimal places, round_half_up"
    variants:
      - name: prorate_per_component_then_sum
        when: "Pinned variant"
        difference: "Each component's accrued depreciation is rounded to whole cents BEFORE summation. Component A: $1000*5/10 = $500.0 → 50000 cents. Component B: $333.33*3/10 = $99.999 → round_half_up to $100.00 → 10000 cents."
      - name: sum_then_round
        when: "Tempting alternative — REJECTED"
        difference: "A naive reading might sum raw component contributions in floats and round only at the end. For components yielding raw 50000.0 + 9999.9 = 59999.9 cents → round_half_up = 60000 cents, vs the pinned variant which yields 50000 + 10000 = 60000 cents (sometimes equal, sometimes off by 1 cent — DIFFERS at exactly half-cent boundaries on multiple components)."

  - name: election_tally
    trigger: "ElectionCycle VOTING→TALLIED system transition"
    algorithm: weighted_scoring
    formula: |
      total_ballots = count(Ballot where election_id == this.id)
      required_ballots = ceil(eligible_voter_count_at_open * quorum_pct)
      if total_ballots < required_ballots:
        result = FAILED_QUORUM; winner = null
      else:
        candidates_ranked = Candidate
          WHERE election_id == this.id
          SORT BY vote_count DESC, nominated_at ASC      # tie-break: earliest nomination wins
        winner_candidate_id = candidates_ranked[0].id
    input_set: "All Ballot and Candidate rows scoped to this election_id; eligibility snapshot taken at voting_open_at"
    constants: {}
    precision: "Integer counts; ceil() on quorum"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role IN {Member, SecretaryRole, TreasurerRole, PresidentRole, DirectorRole}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path parameters resolve to existing entities (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target entity is in a state that permits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "On POST /hoa/units: sum of Unit.share_factor across all units MUST equal 1.0000 after this insert/update"
    error_id: ERR_SHARE_FACTOR_SUM_INVALID
    http_status: 422
    applies_to: "POST /hoa/units, PATCH /hoa/units/{id}"

  - priority: 6
    category: business_safety
    check: "On Lien recordation: cooling-off period (now - lien.created_at >= 30 days) MUST elapse — even if all other preconditions are met"
    error_id: ERR_LIEN_COOLING_OFF
    http_status: 409
    applies_to: "POST /hoa/liens/{id}/record"

  - priority: 7
    category: business_constraint
    check: "On ACCVote: voter_member_id MUST currently hold board_role IN {PRESIDENT, SECRETARY, DIRECTOR}; non-board votes are rejected"
    error_id: ERR_NOT_ON_ACC
    http_status: 403
    applies_to: "POST /hoa/acc-requests/{id}/votes"

  - priority: 8
    category: business_constraint
    check: "On Ballot create: voter_member_id MUST have eligible_to_vote==true both at voting_open_at snapshot AND right now"
    error_id: ERR_VOTER_INELIGIBLE
    http_status: 403
    applies_to: "POST /hoa/elections/{id}/ballots"

  - priority: 9
    category: business_temporal
    check: "On Ballot create: ElectionCycle.status MUST == VOTING (i.e., voting_open_at <= now < voting_close_at)"
    error_id: ERR_VOTING_CLOSED
    http_status: 409
    applies_to: "POST /hoa/elections/{id}/ballots"

  - priority: 10
    category: business_constraint
    check: "On Ballot create: uniqueness on (election_id, voter_member_id)"
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    applies_to: "POST /hoa/elections/{id}/ballots"

  - priority: 11
    category: business_fiscal
    check: "On AssessmentCycle.issue: total_levy_cents >= 100"
    error_id: ERR_LEVY_TOO_SMALL
    http_status: 422
    applies_to: "POST /hoa/assessment-cycles/{id}/issue"

  - priority: 12
    category: business_fiscal
    check: "On Payment.create: amount_cents > 0"
    error_id: ERR_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /hoa/payments"

  - priority: 13
    category: business_constraint
    check: "On ACCRequest.begin-review: Unit owner's Member.total_overdue_amount_cents MUST be 0 (delinquent owners cannot start architectural reviews)"
    error_id: ERR_OWNER_DELINQUENT
    http_status: 409
    applies_to: "POST /hoa/acc-requests/{id}/begin-review"

  - priority: 14
    category: business_constraint
    check: "On ACCRequest.begin-review: most recently ADOPTED ReserveStudy.posture MUST NOT be SPECIAL_ASSESSMENT_REQUIRED (otherwise discretionary modifications are paused)"
    error_id: ERR_RESERVE_POSTURE_BLOCKS_ACC
    http_status: 409
    applies_to: "POST /hoa/acc-requests/{id}/begin-review"

  - priority: 15
    category: business_safety
    check: "Segregation of duties: SECRETARY who voted YES on a FINE_WAIVER BoardResolution MAY NOT be the same Member who originally opened the Violation (Violation.opened_by_member_id != any YES voter on the waiver resolution)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hoa/board-resolutions (subject==FINE_WAIVER)"

  - priority: 16
    category: business_temporal
    check: "On Candidate.create: now MUST be in [election.nomination_open_at, election.voting_open_at)"
    error_id: ERR_NOMINATION_CLOSED
    http_status: 409
    applies_to: "POST /hoa/elections/{id}/candidates"

  - priority: 17
    category: business_referential
    check: "On BoardResolution.create: subject==SPECIAL_ASSESSMENT requires target AssessmentCycle in DRAFT; subject==LIEN_* requires target Lien exists; subject==FINE_WAIVER requires target Violation in {OPEN, FINED}; subject==RESERVE_STUDY_ADOPTION requires target ReserveStudy in DRAFT"
    error_id: ERR_RESOLUTION_TARGET_INVALID
    http_status: 422
    applies_to: "POST /hoa/board-resolutions"

  - priority: 18
    category: business_constraint
    check: "Idempotency conflict: PATCH/POST with mismatched version field"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all mutation endpoints accepting version"

endpoints:
  - method: POST
    path: "/hoa/units"
    description: "Register a Unit"
    roles: [PresidentRole]
    code: 201
    input: ["address", "owner_member_id", "share_factor", "mortgage_holder?"]
    output: Unit
    side_effects: ["Validate share_factor sum == 1.0000 after insert"]

  - method: GET
    path: "/hoa/units/{id}"
    description: "Fetch a unit"
    roles: [Member, SecretaryRole, TreasurerRole, PresidentRole, DirectorRole]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: PATCH
    path: "/hoa/units/{id}"
    description: "Update share_factor or mortgage_holder; share_factor sum invariant re-checked"
    roles: [PresidentRole]
    code: 200
    input: ["share_factor?", "mortgage_holder?", "version"]
    output: Unit
    side_effects: ["Re-validate sum of share_factor"]

  - method: POST
    path: "/hoa/members"
    description: "Register a Member"
    roles: [PresidentRole]
    code: 201
    input: [full_name, email]
    output: Member
    side_effects: []

  - method: GET
    path: "/hoa/members/{id}"
    description: "Fetch a member including total_overdue_amount_cents and board_role"
    roles: [Member, SecretaryRole, TreasurerRole, PresidentRole, DirectorRole]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/hoa/assessment-cycles"
    description: "Create an AssessmentCycle in DRAFT"
    roles: [TreasurerRole]
    code: 201
    input: ["cycle_type", "period_start", "due_date", "total_levy_cents", "approval_resolution_id?"]
    output: AssessmentCycle
    side_effects: []

  - method: POST
    path: "/hoa/assessment-cycles/{id}/issue"
    description: "Issue the cycle: generate one AssessmentCharge per Unit, allocate principal_cents, distribute rounding remainder"
    roles: [TreasurerRole]
    code: 200
    input: [version]
    output: AssessmentCycle
    side_effects: ["calculations.assessment_charge_allocation"]

  - method: POST
    path: "/hoa/assessment-cycles/{id}/close"
    description: "Close the cycle (all charges PAID or WRITTEN_OFF)"
    roles: [TreasurerRole]
    code: 200
    input: [version]
    output: AssessmentCycle
    side_effects: []

  - method: POST
    path: "/hoa/assessment-cycles/{id}/void"
    description: "Void a DRAFT cycle"
    roles: [TreasurerRole]
    code: 200
    input: [version]
    output: AssessmentCycle
    side_effects: []

  - method: GET
    path: "/hoa/assessment-charges/{id}"
    description: "Fetch a charge with up-to-date late_fee_cents (recomputed lazily)"
    roles: [Member, SecretaryRole, TreasurerRole, PresidentRole, DirectorRole]
    code: 200
    input: []
    output: AssessmentCharge
    side_effects: ["calculations.late_fee_assessment (lazy)"]

  - method: POST
    path: "/hoa/assessment-charges/{id}/write-off"
    description: "Write off a charge (post-foreclosure analog)"
    roles: [TreasurerRole]
    code: 200
    input: [version]
    output: AssessmentCharge
    side_effects: ["calculations.member_total_overdue_recompute"]

  - method: POST
    path: "/hoa/payments"
    description: "Tender a payment; server applies waterfall allocation oldest-OVERDUE first by (cycle.due_date ASC, cycle.id ASC), within a charge late_fee before principal"
    roles: [Member]
    code: 201
    input: [member_id, amount_cents]
    output: Payment
    side_effects:
      - "Allocate amount_cents across OPEN/OVERDUE AssessmentCharges and FINED Violations of units owned by member_id"
      - "calculations.member_total_overdue_recompute"
      - "Transition any fully-paid AssessmentCharge.status to PAID"

  - method: POST
    path: "/hoa/acc-requests"
    description: "Submit an ACC request"
    roles: [Member]
    code: 201
    input: [unit_id, category, description]
    output: ACCRequest
    side_effects: ["Set submitted_at=now, deemed_decision_deadline=now+30d, status=SUBMITTED"]

  - method: POST
    path: "/hoa/acc-requests/{id}/begin-review"
    description: "Promote SUBMITTED to UNDER_REVIEW"
    roles: [SecretaryRole]
    code: 200
    input: [version]
    output: ACCRequest
    side_effects: []

  - method: POST
    path: "/hoa/acc-requests/{id}/votes"
    description: "Cast a YES/NO vote on an ACC request"
    roles: [PresidentRole, SecretaryRole, DirectorRole]
    code: 201
    input: [vote]
    output: ACCVote
    side_effects: ["Increment yes_votes or no_votes; trigger UNDER_REVIEW→APPROVED/DENIED if threshold crossed"]

  - method: DELETE
    path: "/hoa/acc-requests/{id}"
    description: "Owner withdraws their ACC request"
    roles: [Member]
    code: 200
    input: []
    output: ACCRequest
    side_effects: []

  - method: POST
    path: "/hoa/violations"
    description: "Open a violation against a unit"
    roles: [SecretaryRole, PresidentRole]
    code: 201
    input: [unit_id, description]
    output: Violation
    side_effects: ["Set opened_at=now, cure_deadline=now+14d, compute occurrence_index, status=OPEN"]

  - method: POST
    path: "/hoa/violations/{id}/cure"
    description: "Mark a violation cured before cure_deadline"
    roles: [SecretaryRole]
    code: 200
    input: [version]
    output: Violation
    side_effects: []

  - method: POST
    path: "/hoa/violations/{id}/waive"
    description: "Waive a violation when a PASSED BoardResolution exists"
    roles: [SecretaryRole]
    code: 200
    input: [resolution_id, version]
    output: Violation
    side_effects: ["calculations.member_total_overdue_recompute if fined was previously posted"]

  - method: POST
    path: "/hoa/board-resolutions"
    description: "Propose a board resolution"
    roles: [PresidentRole, TreasurerRole, SecretaryRole, DirectorRole]
    code: 201
    input: [subject, target_id]
    output: BoardResolution
    side_effects: []

  - method: POST
    path: "/hoa/board-resolutions/{id}/votes"
    description: "Cast YES/NO on a board resolution"
    roles: [PresidentRole, TreasurerRole, SecretaryRole, DirectorRole]
    code: 201
    input: [vote]
    output: BoardResolution
    side_effects: ["Auto-transition to PASSED or FAILED on threshold crossing"]

  - method: POST
    path: "/hoa/elections"
    description: "Open an election cycle for one seat"
    roles: [PresidentRole]
    code: 201
    input: ["seat", "nomination_open_at", "voting_open_at", "voting_close_at", "quorum_pct?"]
    output: ElectionCycle
    side_effects: []

  - method: POST
    path: "/hoa/elections/{id}/candidates"
    description: "Register a candidate"
    roles: [Member]
    code: 201
    input: [member_id]
    output: Candidate
    side_effects: []

  - method: POST
    path: "/hoa/elections/{id}/ballots"
    description: "Cast a ballot"
    roles: [Member]
    code: 201
    input: [voter_member_id, candidate_id]
    output: Ballot
    side_effects: ["Increment Candidate.vote_count"]

  - method: POST
    path: "/hoa/elections/{id}/certify"
    description: "Certify the tally and seat the winner"
    roles: [SecretaryRole]
    code: 200
    input: [version]
    output: ElectionCycle
    side_effects: ["Update winner Member.board_role to election.seat; demote prior holder"]

  - method: POST
    path: "/hoa/liens"
    description: "Create a Lien in NOTICE_SENT state (notice-of-intent)"
    roles: [SecretaryRole]
    code: 201
    input: [unit_id]
    output: Lien
    side_effects: ["Require owner Member.total_overdue_amount_cents >= 180000 AND some charge OVERDUE >= 60d"]

  - method: POST
    path: "/hoa/liens/{id}/record"
    description: "Record the lien after cooling-off and a PASSED BoardResolution"
    roles: [PresidentRole]
    code: 200
    input: [resolution_id, version]
    output: Lien
    side_effects: ["Snapshot principal_cents_at_record and mortgage_holder_at_record; cascade Unit.lien_status"]

  - method: POST
    path: "/hoa/liens/{id}/release"
    description: "Release a recorded lien after balance is fully paid"
    roles: [PresidentRole]
    code: 200
    input: [resolution_id, version]
    output: Lien
    side_effects: ["Cascade Unit.lien_status = RELEASED; mark resolution EXECUTED"]

  - method: GET
    path: "/hoa/liens"
    description: "List liens with optional ?unit_id and ?status filter; paginated"
    roles: [Member, SecretaryRole, TreasurerRole, PresidentRole, DirectorRole]
    code: 200
    input: ["unit_id?", "status?", "limit?", "offset?"]
    output: "Lien[]"
    side_effects: []

  - method: POST
    path: "/hoa/reserve-studies"
    description: "Create a ReserveStudy in DRAFT; computes funded_ratio and posture immediately"
    roles: [TreasurerRole]
    code: 201
    input: [study_year, components, current_reserve_balance_cents]
    output: ReserveStudy
    side_effects: ["calculations.reserve_funded_ratio"]

  - method: POST
    path: "/hoa/reserve-studies/{id}/adopt"
    description: "Adopt the study once a PASSED RESERVE_STUDY_ADOPTION resolution exists"
    roles: [TreasurerRole]
    code: 200
    input: [resolution_id, version]
    output: ReserveStudy
    side_effects: ["If posture==SPECIAL_ASSESSMENT_REQUIRED, blocks future ACCRequest.begin-review; supersedes prior ADOPTED studies"]

  - method: GET
    path: "/hoa/reserve-studies/{id}"
    description: "Fetch a reserve study including funded_ratio and posture"
    roles: [Member, SecretaryRole, TreasurerRole, PresidentRole, DirectorRole]
    code: 200
    input: []
    output: ReserveStudy
    side_effects: []

  - method: POST
    path: "/hoa/_clock/advance"
    description: "Test-driving endpoint: advance system clock to the given ISO8601 timestamp (must be strictly >= current clock). Triggers lazy evaluation of all time-gated transitions (charge OVERDUE accrual, violation auto-FINE, ACC silent decisions, election status, lien cooling-off)."
    roles: [PresidentRole]
    code: 200
    input: [target_timestamp]
    output: "{ now: ISO8601 }"
    side_effects:
      - "For every AssessmentCharge where clock_now > cycle.due_date and balance > 0: ensure status==OVERDUE and recompute late_fee_cents"
      - "For every Violation where status==OPEN and clock_now > cure_deadline: transition to FINED, set fine_cents"
      - "For every ACCRequest where status==UNDER_REVIEW and clock_now >= deemed_decision_deadline: AUTO_APPROVED if LANDSCAPING, AUTO_DENIED if APPEARANCE"
      - "For every ElectionCycle: NOMINATION→VOTING at voting_open_at; VOTING→TALLIED (or FAILED_QUORUM) at voting_close_at"
      - "Recompute affected Member.total_overdue_amount_cents"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/malformed X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role does not permit this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path parameter resolves to no entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state that permits this transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency mismatch (version field differs from server)"
  - id: ERR_SHARE_FACTOR_SUM_INVALID
    http: 422
    condition: "Sum of all Unit.share_factor would not equal 1.0000"
  - id: ERR_LIEN_COOLING_OFF
    http: 409
    condition: "Less than 30 days have elapsed since Lien.created_at"
  - id: ERR_NOT_ON_ACC
    http: 403
    condition: "Voter member is not on the 3-seat ACC subset of the board"
  - id: ERR_VOTER_INELIGIBLE
    http: 403
    condition: "Member lacks eligible_to_vote==true (not an owner, or has outstanding balance)"
  - id: ERR_VOTING_CLOSED
    http: 409
    condition: "Ballot submitted outside [voting_open_at, voting_close_at)"
  - id: ERR_DUPLICATE_BALLOT
    http: 409
    condition: "(election_id, voter_member_id) ballot already exists"
  - id: ERR_LEVY_TOO_SMALL
    http: 422
    condition: "total_levy_cents < 100"
  - id: ERR_AMOUNT_INVALID
    http: 422
    condition: "Payment.amount_cents <= 0"
  - id: ERR_OWNER_DELINQUENT
    http: 409
    condition: "Owner Member.total_overdue_amount_cents > 0 when attempting ACC begin-review"
  - id: ERR_RESERVE_POSTURE_BLOCKS_ACC
    http: 409
    condition: "Latest ADOPTED ReserveStudy.posture == SPECIAL_ASSESSMENT_REQUIRED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Member opening a violation also votes YES on its FINE_WAIVER resolution"
  - id: ERR_NOMINATION_CLOSED
    http: 409
    condition: "Candidate registration attempted outside [nomination_open_at, voting_open_at)"
  - id: ERR_RESOLUTION_TARGET_INVALID
    http: 422
    condition: "Resolution subject does not match the target entity's state/type"
  - id: ERR_DELIVERY_NOT_APPLICABLE
    http: 422
    condition: "Reserved for future use — delivery-domain error not raised in this domain"
  - id: ERR_TIME_TRAVEL
    http: 422
    condition: "POST /hoa/_clock/advance target_timestamp is not strictly >= current clock"

roles:
  - name: Member
    description: "Homeowner; owns Units, pays assessments, submits ACC requests, votes in elections"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /hoa/payments (member_id MUST equal X-User-ID)"
      - "POST /hoa/acc-requests (submitter MUST own the unit)"
      - "DELETE /hoa/acc-requests/{id} (submitter only)"
      - "POST /hoa/elections/{id}/candidates (member_id MUST equal X-User-ID)"
      - "POST /hoa/elections/{id}/ballots (voter_member_id MUST equal X-User-ID)"
    shared_operations:
      - "GET endpoints (reads)"

  - name: SecretaryRole
    description: "Board secretary; manages ACC review intake, opens/cures violations, creates lien notices, certifies elections"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /hoa/acc-requests/{id}/begin-review"
      - "POST /hoa/violations (shared with PresidentRole)"
      - "POST /hoa/violations/{id}/cure"
      - "POST /hoa/violations/{id}/waive"
      - "POST /hoa/liens"
      - "POST /hoa/elections/{id}/certify"
    shared_operations:
      - "POST /hoa/acc-requests/{id}/votes (shared with PresidentRole, DirectorRole)"
      - "POST /hoa/board-resolutions and /votes"

  - name: TreasurerRole
    description: "Board treasurer; manages AssessmentCycles, reserve studies, write-offs"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /hoa/assessment-cycles, /issue, /close, /void"
      - "POST /hoa/assessment-charges/{id}/write-off"
      - "POST /hoa/reserve-studies, /adopt"
    shared_operations:
      - "POST /hoa/board-resolutions and /votes"

  - name: PresidentRole
    description: "Board president; records and releases liens, opens elections, registers units/members"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /hoa/units"
      - "PATCH /hoa/units/{id}"
      - "POST /hoa/members"
      - "POST /hoa/elections"
      - "POST /hoa/liens/{id}/record"
      - "POST /hoa/liens/{id}/release"
      - "POST /hoa/_clock/advance"
    shared_operations:
      - "POST /hoa/violations (shared with SecretaryRole)"
      - "POST /hoa/acc-requests/{id}/votes (shared with SecretaryRole, DirectorRole)"
      - "POST /hoa/board-resolutions and /votes"

  - name: DirectorRole
    description: "At-large board director; votes only — no exclusive operations"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /hoa/acc-requests/{id}/votes"
      - "POST /hoa/board-resolutions and /votes"
      - "GET endpoints"
