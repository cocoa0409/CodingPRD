              as: Underwriter
              captures: { item_x: $.data.id }
          assert:
            - "after trigger[0]: RateRule.${rr_b}.status == PUBLISHED and published_at == 2026-08-01T00:00:00Z"
            - "trigger[1] response: RateRule.${rr_a}.status == RETIRED"
            - "EquipmentItem.${item_x}.applied_rate_rule_id == ${rr_b}"
            - "EquipmentItem.${item_x}.applied_base_rate_bp == 200"
            - "EquipmentItem.${item_x}.insured_value_cents == 8160000 and rated_premium_cents == 192576"
            - "GET /inland-marine/equipment-items?applied_rate_rule_id=${rr_a} returns total_count == 0"

      - name: corner_rate_rule_publish_twice_rejected
        claim_type: Idempotency
        grounds:
          - validations[priority=40]
          - errors[ERR_RATE_RULE_NOT_DRAFT]
          - endpoints[POST /inland-marine/rate-rules/{id}/publish]
        distinguishing_aspect: "Publish is not idempotent: re-publishing an already PUBLISHED cell returns ERR_RATE_RULE_NOT_DRAFT 409 and does not re-stamp published_at or retire the cell as a self-duplicate."
        test_recipe:
          setup:
            - "One PUBLISHED T3_INLAND CRANE rate cell, age band 0-5, base_rate_bp 310, theft_hazard_grade B."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
