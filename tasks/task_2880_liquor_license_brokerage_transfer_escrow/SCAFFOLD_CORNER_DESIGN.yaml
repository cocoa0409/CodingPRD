  - section: validations
    instances:

      - name: distance_correction_after_execution_blocks_application_before_suitability
        claim_type: priority_ordering
        grounds:
          - validations[priority 40]
          - validations[priority 42]
          - validations[priority 44]
          - endpoints[POST /premises/{premises_id}/zoning-verification]
        distinguishing_aspect: "A post-execution re-survey drops the school distance to 500 feet, which makes the premises both distance-violating (priority 40) and UNSUITABLE (priority 42) at once; POST /transfer-applications must answer with the priority-40 error ERR_DISTANCE_RESTRICTION_VIOLATION, never ERR_PREMISES_UNSUITABLE."
        test_recipe:
          setup:
            - "County SON with distance_min_feet_school 600 and distance_min_feet_church 600 (defaults)."
            - "Executed agreement on a premises originally surveyed at 900/900 feet, escrow HELD, buyer QUALIFIED, disclosure FULLY_ACKED."
            - "The regulator then re-verifies the premises with distance_to_nearest_school_feet 500, which recomputes suitability to (UNSUITABLE, SCHOOL_DISTANCE)."
          setup_api_calls:
            - call: "POST /counties"
              payload: { county_code: "SON", name: "Sonoma", state_code: "CA", quota_licenses_total: 100 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /seller-profiles"
              payload: { legal_name: "Vine Holdings LLC", contact_email: "seller@example.com", tax_clearance_status: "CLEARED" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /buyer-profiles"
              payload: { legal_name: "Harbor Hospitality LLC", entity_type: "LLC", residency_state: "CA", citizenship_verified: true }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /brokerages"
              payload: { firm_name: "Bay Brokers", state_broker_license_no: "BRK-0001", commission_rate_bps: 575 }
              as: PlatformAdmin
              captures: { brk_id: $.data.id }
            - call: "POST /licenses"
              payload: { county_id: "${c_id}", owner_seller_id: "${s_id}", license_number: "SON-47-1", license_class: "CLASS_47_ONSALE_GENERAL", annual_gross_receipts_cents: 120000000, last_active_date: "2026-07-01" }
              as: PlatformAdmin
              captures: { lic_id: $.data.id }
            - call: "POST /premises"
              payload: { buyer_id: "${b_id}", county_id: "${c_id}", address_line: "12 Vine St", zoning_code: "C1", distance_to_nearest_school_feet: 900, distance_to_nearest_church_feet: 900 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "GRANTED" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /premises/${prem_id}/landlord-consent"
              payload: { landlord_consent_status: "GRANTED" }
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /buyer-profiles/${b_id}/qualification-review"
              payload: { review_mode: "FINAL_REVIEW", premises_id: "${prem_id}" }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
            - call: "POST /listings"
              payload: { license_id: "${lic_id}", brokerage_id: "${brk_id}", ask_price_cents: 18500000 }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
              captures: { lst_v1: $.data.version }
            - call: "POST /purchase-agreements"
              payload: { listing_id: "${lst_id}", buyer_id: "${b_id}", premises_id: "${prem_id}", purchase_price_cents: 18500010, deposit_pct_bps: 1000, closing_window_start: "2026-09-01T00:00:00Z", expected_listing_version: "${lst_v1}" }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /dual-agency-disclosures"
              payload: { agreement_id: "${agr_id}", represents_seller: true, represents_buyer: false }
              as: Broker
              as_user_id: "${brk_id}"
              captures: { dis_id: $.data.id }
            - call: "POST /dual-agency-disclosures/${dis_id}/acknowledge"
              payload: { party: "SELLER" }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /purchase-agreements/${agr_id}/escrow-deposit"
              payload: { amount_cents: 2405001 }
              as: EscrowOfficer
              as_user_id: "escrow-1"
            - call: "POST /purchase-agreements/${agr_id}/execute"
              payload: {}
              as: Broker
              as_user_id: "${brk_id}"
            - call: "POST /premises/${prem_id}/zoning-verification"
              payload: { conditional_use_permit_status: "GRANTED", distance_to_nearest_school_feet: 500 }
              as: RegulatorAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /transfer-applications"
              payload: { agreement_id: "${agr_id}", fee_paid_cents: 173250 }
              as: Broker
              as_user_id: "${brk_id}"
              expect_error: true
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 422 and ${eid} == ERR_DISTANCE_RESTRICTION_VIOLATION (priority 40 wins over the co-violated priority 42)"
            - "Premises.${prem_id}.suitability_status == UNSUITABLE with suitability_reason_code == SCHOOL_DISTANCE"
            - "GET /transfer-applications?agreement_id=${agr_id} returns total_count == 0"
            - "PurchaseAgreement.${agr_id}.escrow_status == HELD (the refusal writes nothing)"

