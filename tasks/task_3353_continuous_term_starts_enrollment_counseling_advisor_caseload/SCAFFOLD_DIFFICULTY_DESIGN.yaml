# =============================================================================
# §1.8 Scaffold Difficulty Design — Continuous Term Enrollment
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: award_packaging_estimated_vs_certified_intensity
        grounds:
          - calculations.award_packaging
          - entities.FinancialAidPackage.fields.estimated_award_cents
          - entities.FinancialAidPackage.fields.certified_award_cents
        distinguishing_aspect: |
          Financial-aid domain dual variant: identical efc_cents and enrollment
          produce estimated_award_cents == 700000 (ESTIMATED assumes FULL_TIME
          COA 800000) but certified_award_cents == 400000 (CERTIFIED uses actual
          HALF_TIME COA 500000); the variants diverge purely because of the
          variant rule, not because inputs changed.
        test_recipe:
          setup:
            - "Program P (120 credits, non-licensure), state CO AUTHORIZED for P"
            - "Term T 2026-10-05..2026-12-13 in ENROLLMENT_OPEN (clock 2026-09-05)"
            - "Advisor ADV (cap 5), Counselor CNS (cap 5, NON_INCENTIVE)"
            - "Applicant A in CO; Application AP ADMITTED with TCE COMPLETED"
            - "Enrollment E HALF_TIME, tuition 500000, REGISTERED"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/staff"
              payload: { full_name: "Cal Counselor", email: "cns@x.com", staff_type: "COUNSELOR", caseload_cap: 5, compensation_plan: "NON_INCENTIVE" }
              as: SystemAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { app_nt_id: "$.data.id", cns_id: "$.data.assigned_counselor_id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${app_nt_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${app_nt_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { appl_v: "$.data.version" }
            - call: "POST /api/applications/${appl_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 30, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { tce_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "HALF_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { enr_id: "$.data.id", enr_v: "$.data.version" }
          trigger:
            - call: "POST /api/enrollments/${enr_id}/financial-aid-packages"
              payload: { efc_cents: 100000 }
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { pkg_id: "$.data.id", est_amt: "$.data.estimated_award_cents" }
            - call: "POST /api/financial-aid-packages/${pkg_id}/certify"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: FinancialAidOfficer
              as_user_id: "officer-2"
              captures: { cert_amt: "$.data.certified_award_cents" }
          assert:
            - "FinancialAidPackage.${pkg_id}.estimated_award_cents == 700000"
            - "FinancialAidPackage.${pkg_id}.certified_award_cents == 400000"
            - "FinancialAidPackage.${pkg_id}.estimated_award_cents != FinancialAidPackage.${pkg_id}.certified_award_cents"

      - name: withdrawal_r2t4_vs_institutional_refund
        grounds:
          - calculations.r2t4_return
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - entities.FinancialAidPackage.fields.returned_cents
          - entities.Enrollment.fields.institutional_refund_cents
        distinguishing_aspect: |
          Withdrawal-finance domain (different entity domain than award_packaging):
          the same withdrawal_date 2026-10-25 yields TITLE_IV returned_cents ==
          258825 (pro-rata on disbursed 369750, earned 21/70 = 0.30) but
          INSTITUTIONAL refund_cents == 250000 (50% census-window step on
          tuition 500000); two valid algorithms over one event produce
          different money.
        test_recipe:
          setup:
            - "Full pipeline as in award_packaging_estimated_vs_certified_intensity but enrollment FULL_TIME, efc 0 -> certified 739500, schedule 369750@2026-10-19 + 369750@2026-11-09"
            - "Term advanced to IN_SESSION at clock 2026-10-19 (census) -> only entry 1 released (entry 2 release_date 2026-11-09 > now), disbursed_cents == 369750, package DISBURSING"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/staff"
              payload: { full_name: "Cal Counselor", email: "cns@x.com", staff_type: "COUNSELOR", caseload_cap: 5, compensation_plan: "NON_INCENTIVE" }
              as: SystemAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { app_nt_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${app_nt_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${app_nt_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { appl_v: "$.data.version" }
            - call: "POST /api/applications/${appl_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 30, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { tce_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { enr_id: "$.data.id", enr_v: "$.data.version" }
            - call: "POST /api/enrollments/${enr_id}/financial-aid-packages"
              payload: { efc_cents: 0 }
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { pkg_id: "$.data.id" }
            - call: "POST /api/financial-aid-packages/${pkg_id}/certify"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: FinancialAidOfficer
              as_user_id: "officer-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-19T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "IN_SESSION" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /api/enrollments/${enr_id}/withdraw"
              payload: { withdrawal_date: "2026-10-25" }
              as: RegistrarAdmin
              captures: { inst_refund: "$.data.institutional_refund_cents" }
          assert:
            - "Enrollment.${enr_id}.institutional_refund_cents == 250000"
            - "FinancialAidPackage.${pkg_id}.returned_cents == 258825 (earned 21/70 = 0.3; 369750 * 0.7)"
            - "FinancialAidPackage.${pkg_id}.retained_cents == 110925"
            - "FinancialAidPackage.${pkg_id}.disbursed_cents == 369750"
            - "FinancialAidPackage.${pkg_id}.status == RETURNED"
            - "INSTITUTIONAL refund 250000 != TITLE_IV return 258825 (same withdrawal event, two valid algorithms)"

  # ------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: award_packaging_tiered_cap_interaction
        grounds:
          - calculations.award_packaging
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — the min(PELL_MAX,
          COA - efc) cap binds in one tier and not another: FULL_TIME efc 0
          certifies at the PELL ceiling 739500 (COA 800000 - 0 would exceed it)
          while LESS_THAN_HALF_TIME efc 0 certifies at 200000 (COA binds, PELL
          irrelevant); the same constant set flips which term of min() wins.
        test_recipe:
          setup:
            - "Two enrollments in the same open term: E1 FULL_TIME, E2 LESS_THAN_HALF_TIME; both with TCE COMPLETED; no packages yet"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/staff"
              payload: { full_name: "Cal Counselor", email: "cns@x.com", staff_type: "COUNSELOR", caseload_cap: 5, compensation_plan: "NON_INCENTIVE" }
              as: SystemAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "P One", email: "p1@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap1_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap1_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /api/applications/${a1_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { a1_v: "$.data.version" }
            - call: "POST /api/applications/${a1_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 0, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { t1_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${t1_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${t1_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${a1_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${a1_v}" }
              as: RegistrarAdmin
              captures: { e1_id: "$.data.id", e1_v: "$.data.version" }
            - call: "POST /api/applicants"
              payload: { full_name: "P Two", email: "p2@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap2_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap2_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap2_id}"
              captures: { a2_id: "$.data.id" }
            - call: "POST /api/applications/${a2_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { a2_v: "$.data.version" }
            - call: "POST /api/applications/${a2_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 0, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { t2_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${t2_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${t2_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
            - call: "POST /api/enrollments"
              payload: { application_id: "${a2_id}", advisor_id: "${adv_id}", enrollment_intensity: "LESS_THAN_HALF_TIME", tuition_cents: 100000, expected_application_version: "${a2_v}" }
              as: RegistrarAdmin
              captures: { e2_id: "$.data.id", e2_v: "$.data.version" }
            - call: "POST /api/enrollments/${e1_id}/financial-aid-packages"
              payload: { efc_cents: 0 }
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { pk1_id: "$.data.id" }
            - call: "POST /api/enrollments/${e2_id}/financial-aid-packages"
              payload: { efc_cents: 0 }
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { pk2_id: "$.data.id" }
          trigger:
            - call: "POST /api/financial-aid-packages/${pk1_id}/certify"
              payload: { expected_enrollment_version: "${e1_v}" }
              as: FinancialAidOfficer
              as_user_id: "officer-2"
              captures: { c1: "$.data.certified_award_cents" }
            - call: "POST /api/financial-aid-packages/${pk2_id}/certify"
              payload: { expected_enrollment_version: "${e2_v}" }
              as: FinancialAidOfficer
              as_user_id: "officer-2"
              captures: { c2: "$.data.certified_award_cents" }
          assert:
            - "FinancialAidPackage.${pk1_id}.certified_award_cents == 739500"
            - "FinancialAidPackage.${pk2_id}.certified_award_cents == 200000"
            - "FinancialAidPackage.${pk1_id}.disbursement_schedule == [{sequence 1, release_date 2026-10-19, amount 369750}, {sequence 2, release_date 2026-11-09, amount 369750}]"

      - name: adjunct_forecast_per_section_ceil_then_sum
        grounds:
          - calculations.adjunct_forecast
          - entities.CourseSection.fields.adjuncts_required
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than tiered min/max): sections
          (capacity 60, forecast 95) and (capacity 30, forecast 31) require
          per-section ceil -> 2 + 1 = 3 adjuncts; the unpinned sum-then-ceil
          order would give ceil(36/30) = 2; the scaffold pins per-section-first.
        test_recipe:
          setup:
            - "Term T exists (SCHEDULED); sections S1 cap 60 forecast 95, S2 cap 30 forecast 31"
          setup_api_calls:
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /api/terms/${term_id}/sections"
              payload: { course_code: "CS-101", capacity: 60, forecast_enrollment: 95 }
              as: RegistrarAdmin
              captures: { s1_id: "$.data.id", s1_req: "$.data.adjuncts_required" }
            - call: "POST /api/terms/${term_id}/sections"
              payload: { course_code: "CS-102", capacity: 30, forecast_enrollment: 31 }
              as: RegistrarAdmin
              captures: { s2_id: "$.data.id", s2_req: "$.data.adjuncts_required" }
          trigger:
            - call: "POST /api/sections/${s1_id}/advance"
              payload: { to_state: "STAFFING" }
              as: RegistrarAdmin
            - call: "POST /api/sections/${s1_id}/advance"
              payload: { to_state: "STAFFED", adjunct_hires: 1 }
              as: RegistrarAdmin
              captures: { err1: "$.data.error_id" }
            - call: "POST /api/sections/${s1_id}/advance"
              payload: { to_state: "STAFFED", adjunct_hires: 2 }
              as: RegistrarAdmin
              captures: { s1_after: "$.data.status" }
          assert:
            - "CourseSection.${s1_id}.adjuncts_required == 2"
            - "CourseSection.${s2_id}.adjuncts_required == 1"
            - "term adjunct total (per-section ceil then sum) == 3, not 2"
            - "advance STAFFED with adjunct_hires 1 -> ERR_INVALID_STATE"
            - "advance STAFFED with adjunct_hires 2 -> CourseSection.${s1_id}.status == STAFFED and adjunct_hires == 2"

  # ------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: tce_completed_reopens_to_in_review_cycle
        grounds:
          - state_machines.TransferCreditEvaluation.COMPLETED_to_IN_REVIEW
          - state_machines.TransferCreditEvaluation.IN_REVIEW_to_COMPLETED
        distinguishing_aspect: |
          Cycle on TransferCreditEvaluation: COMPLETED -> IN_REVIEW -> COMPLETED
          is legal while no live enrollment exists; the same COMPLETED ->
          IN_REVIEW edge is rejected with ERR_INVALID_STATE once an enrollment
          is REGISTERED — cycle permissibility depends on cross-entity state.
        test_recipe:
          setup:
            - "Program, CO AUTHORIZED, term ENROLLMENT_OPEN, advisor, counselor"
            - "Applicant + Application SUBMITTED (NOT yet admitted/enrolled) with TCE COMPLETED"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { code: "BS-CS", title: "CS", total_credits_required: 120, licensure_flag: false }
              as: RegistrarAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/state-authorizations"
              payload: { state_code: "CO", authorization_status: "AUTHORIZED", effective_from: "2026-01-01" }
              as: ComplianceOfficer
            - call: "POST /api/terms"
              payload: { name: "2026 Fall A", start_date: "2026-10-05", add_drop_end_date: "2026-10-12", census_date: "2026-10-19", end_date: "2026-12-13" }
              as: RegistrarAdmin
              captures: { term_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 100, in_progress_credits: 6 }
              as: RegistrarAdmin
              captures: { tce_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
              captures: { st1: "$.data.status" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "COMPLETED" }
              as: RegistrarAdmin
              captures: { st2: "$.data.status", rem: "$.data.remaining_credits" }
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { appl_v: "$.data.version" }
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { enr_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
