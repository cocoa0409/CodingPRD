          rationale: "Audit note rather than a new recipe: every code in the §1.6 catalog is now reached by at least one §1.8 or §1.9 instance. The remaining families are covered as follows — ERR_STALE_EMPLOYER_VERSION and ERR_STALE_CAPACITY_BLOCK_VERSION by the two optimistic_concurrency corners in the complexity_layers section; ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_FORBIDDEN_SCOPE and ERR_SEGREGATION_OF_DUTIES by the rbac section; ERR_OFFER_EXPIRED by the offer_expires_at boundary corner in the same section as this note's sibling batteries; and the cascade, capacity, entitlement and invoice families by the nine §1.8 rules. Two codes that were unreachable by construction (a credential state error distinct from its terminal error, and the invoice-time employer-mismatch and in-service guards) were removed from the catalog rather than left untestable."

  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_missing_x_user_id_returns_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=200]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 200 runs ahead of every other rule, so a request with no X-User-ID header returns ERR_UNAUTHENTICATED (401) even when the body is also malformed and the path id does not exist — no schema or 404 error leaks first."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /backup-care/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: network_admin
              as_user_id: "u_na_1"
          trigger:
            - call: "POST /backup-care/employers"
              payload: { industry_code: "MIXED" }
              as: none
              as_user_id: ""
              captures: { err_noauth: $.data.error_id }
            - call: "GET /backup-care/employers/emp_00000000-0000-0000-0000-000000000000"
              payload: {}
              as: none
              as_user_id: ""
              captures: { err_noauth2: $.data.error_id }
          assert:
            - "Both calls are sent with NO X-User-ID header at all (`as: none` / empty as_user_id denotes an unauthenticated request)"
            - "${err_noauth} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_INVALID_REQUEST, even though the required field name is missing (200 precedes 100)"
            - "${err_noauth2} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_EMPLOYER_NOT_FOUND (200 precedes 300)"
            - "No Employer row is created"

