  # =========================================================================
  - section: rbac
    instances:
      - name: client_cannot_create_artist
        claim_type: Cannot perform other role op
        grounds: [roles, endpoints]
        distinguishing_aspect: "A Client calling POST /studio/artists (StudioManager-exclusive) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["One client."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { full_name: "RB Client", email: "rb@x.com", date_of_birth: "1990-01-01" }
