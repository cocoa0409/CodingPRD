            - call: "POST /sailings/${s_id}/depart"
              payload: {}
              as: PortAgent
          trigger:
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: GuestUser
              as_user_id: "guest-11"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_SAILING_NOT_BOOKABLE (booking stayed DEPOSIT_HELD through depart; SAILED sailing not in {OPEN, CLOSED})"

      - name: folio_charge_requires_booking_embarked
        grounds:
          - validations[priority=6]
          - state_machines.Folio.OPEN_to_SETTLED
          - state_machines.Booking.CONFIRMED_to_EMBARKED
        distinguishing_aspect: |
          Posting a FolioCharge depends on a different entity pair: the owning Booking must be EMBARKED.
          Against a CONFIRMED (not yet embarked) booking there is no folio, so charge posting is rejected.
          Entity pair: FolioCharge/Folio -> Booking (distinct from Booking -> Sailing above).
        test_recipe:
