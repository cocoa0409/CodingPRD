scenario: |
  1831. Public Broadcasting Membership & Pledge Drive (PBS/NPR member station): membership levels & premium (thank-you gift) inventory, pledge drive scheduling & on-air break programming, pledge capture across phone/web & sustainer conversion, fulfillment of premiums & shipping, unfulfilled pledge follow-up & write-off, matching challenge & underwriting credit, CSG/CPB reporting of non-federal financial support, donor retention & lapsed-member campaign

domain_name: public-broadcasting-membership-pledge
api_prefix: /station

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit          # CSG/CPB NFFS reporting is the regulatory spine
  secondary_archetype: quota_allocation        # premium thank-you-gift inventory lots
  complexity_layers:
    - optimistic_concurrency                   # OCC on PledgeDrive.version for break scheduling; on Pledge.version for payment posting
    - cascading_side_effects                   # pledge payment -> membership renewal -> lapse reversal -> donor stats
    - dual_variant_calculation                 # NFFS provisional vs final; premium inventory FIFO vs weighted-average
    - rate_threshold_triggers                  # matching challenge MET at exact goal; membership-level tier crossing
    - derived_field_reconciliation             # PledgeDrive.totals; lot reserved/committed counters
  entity_topology: hybrid                      # tree (PledgeDrive -> OnAirBreak) + flat cross-refs (Pledge -> Donor/Membership/Drive)
  state_machine_shape: parallel                # Pledge has payment_status x fulfillment_status; Membership is cyclic; Drive is branching-with-revert
  relationship_patterns:
    - one_to_many
    - cross_aggregate                          # Pledge references Donor, Membership, PledgeDrive, MatchingChallenge
  role_model: segregation_of_duties            # NFFSReport drafted by MembershipCoordinator, finalized by StationAdmin; PhoneVolunteer captures pledges but cannot write off
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: MembershipLevel
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Unique level code (e.g. BASIC, SUSTAINER, LEADERSHIP)"
        constraints: "unique per station; immutable after creation"
      - name: min_annual_cents
        type: integer
        source: input
        description: "Minimum annualized pledge amount (cents) that qualifies for this level; used by membership_level_for_amount"
      - name: min_monthly_sustainer_cents
        type: integer
        source: input
        description: "Minimum per-month sustainer installment (cents) qualifying for this level when pledge is SUSTAINER"
      - name: premium_eligible
        type: boolean
        source: input
        description: "Whether pledges at this level may select a premium (thank-you gift)"
        default: true
      - name: active
        type: boolean
        source: input
        description: "Whether new pledges may select this level"
        default: true

  - name: Premium
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Unique SKU code"
        constraints: "unique; immutable"
      - name: title
        type: string
        source: input
        description: "Human-readable premium title"
      - name: fair_market_value_cents
        type: integer
        source: input
        description: "Per-unit fair market value in cents; deducted from pledge for NFFS net per IRS quid-pro-quo rules"
      - name: membership_level_code
        type: string
        source: input
        description: "FK -> MembershipLevel.code; premium offered only to pledges qualifying at this level or higher (by min_annual_cents ranking, tie-break code ASC)"
      - name: active
        type: boolean
        source: input
        description: "Whether new reservations may be created for this premium"
        default: true

  - name: PremiumInventoryLot
    parent: Premium
    common_fields: true
    fields:
      - name: premium_id
        type: string
        source: input
        description: "FK -> Premium.id; the premium this lot stocks"
      - name: received_at
        type: datetime
        source: input
        description: "When the lot was received; FIFO allocation consumes earliest received_at first, tie-break created_at ASC"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Per-unit acquisition cost in cents; used by inventory valuation calculation"
      - name: total_qty
        type: integer
        source: input
        description: "Total units received in this lot"
        constraints: ">= 1"
      - name: available_qty
        type: integer
        source: computed
        description: "total_qty - reserved_qty - committed_qty - written_off_qty; never negative; maintained by reservation transitions"
        default: 0
      - name: reserved_qty
        type: integer
        source: computed
        description: "Units currently held by PremiumReservation rows in HELD status"
        default: 0
      - name: committed_qty
        type: integer
        source: computed
        description: "Units committed (shipped or awaiting shipment) by reservations in COMMITTED status"
        default: 0
      - name: written_off_qty
        type: integer
        source: computed
        description: "Units scrapped / written off from this lot"
        default: 0

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Donor email; unique"
        constraints: "unique, case-insensitive"
      - name: full_name
        type: string
        source: input
        description: "Donor display name"
      - name: postal_code
        type: string
        source: input
        description: "Mailing postal code used for premium shipping"
      - name: lifetime_given_cents
        type: integer
        source: computed
        description: "Sum of net_collected_cents over all Pledges with payment_status PAID or PARTIAL owned by this donor; maintained by payment/write-off transitions"
        default: 0
      - name: lapse_count
        type: integer
        source: computed
        description: "Number of times any Membership of this donor entered LAPSED; reset to 0 when a lapsed membership reactivates via payment"
        default: 0

  - name: Membership
    parent: Donor
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; owning donor"
      - name: level_code
        type: string
        source: input
        description: "FK -> MembershipLevel.code; current membership level"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | GRACE | LAPSED | REINSTATED_PENDING"
        constraints: "enum {ACTIVE, GRACE, LAPSED, REINSTATED_PENDING}"
        default: ACTIVE
      - name: current_period_start
        type: datetime
        source: system
        description: "Start of current paid-through period (inclusive)"
      - name: current_period_end
        type: datetime
        source: system
        description: "End of current paid-through period (exclusive, half-open); payment extends this by exactly 12 months from max(current_period_end, payment time)"
      - name: sustainer
        type: boolean
        source: input
        description: "Whether this membership is sustained by an auto-renewing monthly pledge"
        default: false

  - name: PledgeDrive
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Drive name (e.g. 'Fall 2026 Membership Drive')"
      - name: starts_at
        type: datetime
        source: input
        description: "Drive window start (inclusive)"
      - name: ends_at
        type: datetime
        source: input
        description: "Drive window end (exclusive); must be strictly after starts_at"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SCHEDULED | ON_AIR | CLOSED | RECONCILED"
        constraints: "enum {DRAFT, SCHEDULED, ON_AIR, CLOSED, RECONCILED}"
        default: DRAFT
      - name: goal_cents
        type: integer
        source: input
        description: "Fundraising goal in cents; used by progress reporting, not a hard cap"
      - name: pledged_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over Pledges linked to this drive whose payment_status is NOT DECLINED and NOT WRITTEN_OFF"
        default: 0
      - name: collected_cents
        type: integer
        source: computed
        description: "Sum of net_collected_cents over Pledges linked to this drive with payment_status PAID or PARTIAL"
        default: 0

  - name: OnAirBreak
    parent: PledgeDrive
    common_fields: true
    fields:
      - name: drive_id
        type: string
        source: input
        description: "FK -> PledgeDrive.id; owning drive"
      - name: starts_at
        type: datetime
        source: input
        description: "Break start (inclusive)"
      - name: ends_at
        type: datetime
        source: input
        description: "Break end (exclusive); must be strictly after starts_at and within drive window"
      - name: program_title
        type: string
        source: input
        description: "On-air program during which the break runs"
      - name: pitch_level_code
        type: string
        source: input
        description: "FK -> MembershipLevel.code; the level pitched on-air during this break"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED | AIRED"
        constraints: "enum {SCHEDULED, AIRED}"
        default: SCHEDULED

  - name: Pledge
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; pledging donor"
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; membership this pledge funds (must belong to donor_id)"
      - name: drive_id
        type: string
        source: input
        description: "FK -> PledgeDrive.id; drive during which the pledge was captured"
      - name: on_air_break_id
        type: string
        source: input
        description: "FK -> OnAirBreak.id; optional break attribution; when present, break must belong to drive_id"
        constraints: "optional (nullable)"
      - name: matching_challenge_id
        type: string
        source: input
        description: "FK -> MatchingChallenge.id; optional challenge this pledge counts toward"
        constraints: "optional (nullable)"
      - name: channel
        type: enum
        source: input
        description: "PHONE | WEB"
        constraints: "enum {PHONE, WEB}"
      - name: kind
        type: enum
        source: input
        description: "ONE_TIME | SUSTAINER; SUSTAINER pledges bill monthly and convert the membership to sustainer"
        constraints: "enum {ONE_TIME, SUSTAINER}"
      - name: amount_cents
        type: integer
        source: input
        description: "ONE_TIME: full pledge amount. SUSTAINER: per-month installment amount. Must be >= 1."
      - name: payment_status
        type: enum
        source: system
        description: "PLEDGED | PAID | PARTIAL | DECLINED | WRITTEN_OFF"
        constraints: "enum {PLEDGED, PAID, PARTIAL, DECLINED, WRITTEN_OFF}"
        default: PLEDGED
      - name: fulfillment_status
        type: enum
        source: system
        description: "NO_PREMIUM | AWAITING_RESERVATION | RESERVED | SHIPPED | WAIVED"
        constraints: "enum {NO_PREMIUM, AWAITING_RESERVATION, RESERVED, SHIPPED, WAIVED}"
        default: NO_PREMIUM
      - name: premium_id
        type: string
        source: input
        description: "FK -> Premium.id; optional premium selected at capture; requires the pledge's membership level to be premium-eligible and >= premium's membership_level_code"
        constraints: "optional (nullable)"
      - name: premium_waived
        type: boolean
        source: input
        description: "Donor declined the premium; sets fulfillment_status WAIVED at capture when premium_id present, or NO_PREMIUM when absent"
        default: false
      - name: net_collected_cents
        type: integer
        source: computed
        description: "Collected amount net of premium FMV: see calculation pledge_net_collected"
        default: 0
      - name: collected_cents
        type: integer
        source: computed
        description: "Gross collected against this pledge (sum of posted payments); <= amount_cents for ONE_TIME"
        default: 0
      - name: decline_reason
        type: string
        source: system
        description: "Set when payment_status transitions to DECLINED or WRITTEN_OFF"
        constraints: "optional (nullable)"

  - name: PremiumReservation
    parent: Pledge
    common_fields: true
    fields:
      - name: pledge_id
        type: string
        source: input
        description: "FK -> Pledge.id; the pledge this reservation fulfills"
      - name: premium_id
        type: string
        source: input
        description: "FK -> Premium.id; must equal pledge.premium_id"
      - name: lot_id
        type: string
        source: input
        description: "FK -> PremiumInventoryLot.id; lot the unit is drawn from; server selects FIFO lot when not provided"
        constraints: "optional (nullable) — server FIFO-selects when omitted"
      - name: quantity
        type: integer
        source: input
        description: "Units reserved; always 1 for single-premium pledges but modeled for multi-quantity premiums"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "HELD | COMMITTED | RELEASED"
        constraints: "enum {HELD, COMMITTED, RELEASED}"
        default: HELD

  - name: MatchingChallenge
    parent: PledgeDrive
    common_fields: true
    fields:
      - name: drive_id
        type: string
        source: input
        description: "FK -> PledgeDrive.id; challenge runs within this drive"
      - name: sponsor_name
        type: string
        source: input
        description: "Challenge sponsor display name"
      - name: goal_cents
        type: integer
        source: input
        description: "Amount of new pledges required to unlock the match"
        constraints: ">= 1"
      - name: match_cents
        type: integer
        source: input
        description: "Amount the sponsor contributes when the challenge is MET"
        constraints: ">= 1"
      - name: progress_cents
        type: integer
        source: computed
        description: "Sum of amount_cents of Pledges with matching_challenge_id = this challenge and payment_status NOT IN (DECLINED, WRITTEN_OFF)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN | MET | EXPIRED"
        constraints: "enum {OPEN, MET, EXPIRED}"
        default: OPEN

  - name: UnderwritingCredit
    parent: PledgeDrive
    common_fields: true
    fields:
      - name: drive_id
        type: string
        source: input
        description: "FK -> PledgeDrive.id; drive the credit is attributed to"
      - name: underwriter_name
        type: string
        source: input
        description: "Underwriting sponsor"
      - name: amount_cents
        type: integer
        source: input
        description: "Underwriting contract amount in cents; excluded from NFFS (it is not membership revenue)"
        constraints: ">= 1"
      - name: aired
        type: boolean
        source: input
        description: "Whether the underwriting spots have aired; only aired credits count toward drive revenue reporting"
        default: false

  - name: NFFSReport
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year the report covers (e.g. 2026)"
      - name: variant
        type: enum
        source: system
        description: "PROVISIONAL on draft; FINAL after finalize"
        constraints: "enum {PROVISIONAL, FINAL}"
        default: PROVISIONAL
      - name: status
        type: enum
        source: system
        description: "DRAFT | FINALIZED | AMENDED"
        constraints: "enum {DRAFT, FINALIZED, AMENDED}"
        default: DRAFT
      - name: membership_revenue_cents
        type: integer
        source: computed
        description: "NFFS membership line per nffs_membership_revenue calculation; differs between PROVISIONAL and FINAL variants"
        default: 0
      - name: underwriting_excluded_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over UnderwritingCredits with aired == true whose drive's starts_at falls in fiscal year FY = [FY-01-01T00:00:00Z, (FY+1)-01-01T00:00:00Z) (half-open); reported separately and excluded from membership revenue"
        default: 0
      - name: matching_revenue_cents
        type: integer
        source: computed
        description: "Sum of match_cents over MatchingChallenges with status == MET whose drive's starts_at falls in fiscal year FY = [FY-01-01T00:00:00Z, (FY+1)-01-01T00:00:00Z) (half-open)"
        default: 0
      - name: drafted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MembershipCoordinator who created the draft"
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID of the StationAdmin who finalized; MUST differ from drafted_by_user_id (segregation of duties)"
        constraints: "optional (nullable)"

# =============================================================================
# 1.2 State Machine Table (5 machines)
# =============================================================================
state_machines:
  - entity: Pledge
    initial_state: "payment_status=PLEDGED, fulfillment_status=NO_PREMIUM or AWAITING_RESERVATION or WAIVED (parallel dimensions)"
    terminal_states: ["payment_status=WRITTEN_OFF", "payment_status=DECLINED"]
    note: "Parallel dimensions: payment_status (PLEDGED -> PAID | PARTIAL | DECLINED | WRITTEN_OFF) evolves independently of fulfillment_status (NO_PREMIUM | AWAITING_RESERVATION | RESERVED | SHIPPED | WAIVED)."
    transitions:
      - from: "payment_status=PLEDGED"
        to: "payment_status=PAID"
        trigger: "POST /station/pledges/{id}/payments with amount_cents >= remaining balance (ONE_TIME) or first installment (SUSTAINER)"
        actor: PhoneVolunteer
        preconditions:
          - "payment_status == PLEDGED or PARTIAL"
          - "for SUSTAINER, membership.status must be ACTIVE or GRACE (cross-entity dependency)"
        side_effects:
          - "pledge.collected_cents += payment amount"
          - "pledge.net_collected_cents recomputed per pledge_net_collected (gross minus premium FMV when premium shipped or reserved)"
          - "drive.pledged_cents unchanged (already counted at capture); drive.collected_cents += net_collected delta"
          - "membership.current_period_end extends by 12 months from max(current_period_end, now) [ONE_TIME] or by 1 month [SUSTAINER installment]"
          - "if membership.status was LAPSED: membership.status -> ACTIVE (via REINSTATED_PENDING), donor.lapse_count resets to 0 — 3-deep cascade pledge -> membership -> donor"
          - "challenge.progress_cents is NOT changed by payment (pledge amount was counted at capture per matching_challenge_progress); when challenge.status flipped to MET, NFFSReport.matching_revenue_cents includes match_cents at next report compute"
      - from: "payment_status=PLEDGED"
        to: "payment_status=PARTIAL"
        trigger: "POST /station/pledges/{id}/payments with amount_cents < remaining balance"
        actor: PhoneVolunteer
        preconditions:
          - "payment_status == PLEDGED or PARTIAL"
        side_effects:
          - "pledge.collected_cents += payment amount"
          - "pledge.net_collected_cents recomputed per pledge_net_collected"
          - "drive.collected_cents += net_collected delta"
      - from: "payment_status=PLEDGED or PARTIAL"
        to: "payment_status=DECLINED"
        trigger: "POST /station/pledges/{id}/decline"
        actor: PhoneVolunteer
        preconditions:
          - "payment_status in {PLEDGED, PARTIAL}"
        side_effects:
          - "drive.pledged_cents -= pledge.amount_cents"
          - "drive.collected_cents -= pledge.net_collected_cents (compensating reversal)"
          - "if matching_challenge_id present: challenge.progress_cents -= pledge.amount_cents (progress is a derived sum over non-terminal pledges; challenge status latched — MET/EXPIRED never revert)"
          - "if fulfillment_status == RESERVED: reservation -> RELEASED, lot counters decrement (cascade depth 2)"
          - "donor.lifetime_given_cents -= pledge.net_collected_cents"
      - from: "payment_status=PLEDGED or PARTIAL"
        to: "payment_status=WRITTEN_OFF"
        trigger: "POST /station/pledges/{id}/write-off (after follow-up workflow)"
        actor: MembershipCoordinator
        preconditions:
          - "payment_status in {PLEDGED, PARTIAL}"
          - "pledge must be at least 60 days old (business_temporal: unfulfilled pledge follow-up window elapsed)"
        side_effects:
          - "drive.pledged_cents -= pledge.amount_cents"
          - "drive.collected_cents -= pledge.net_collected_cents"
          - "if matching_challenge_id present: challenge.progress_cents -= pledge.amount_cents (challenge status latched — MET/EXPIRED never revert)"
          - "if fulfillment_status == RESERVED: reservation -> RELEASED (lot counters decrement — cascade depth 2)"
          - "donor.lifetime_given_cents -= pledge.net_collected_cents"
          - "pledge.decline_reason set from request"
      - from: "fulfillment_status=AWAITING_RESERVATION"
        to: "fulfillment_status=RESERVED"
        trigger: "POST /station/pledges/{id}/premium-reservations (explicit) or automatic at capture when premium selected and stock available"
        actor: MembershipCoordinator
        preconditions:
          - "fulfillment_status == AWAITING_RESERVATION"
          - "premium.active == true"
          - "selected lot available_qty >= quantity (boundary: exact-zero available rejects)"
        side_effects:
          - "PremiumReservation created in HELD; lot.reserved_qty += quantity, lot.available_qty -= quantity"
          - "pledge.net_collected_cents recomputed (premium FMV now deductible); drive.collected_cents resynced by the net delta; donor.lifetime_given_cents resynced by the net delta"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=SHIPPED"
        trigger: "POST /station/pledges/{id}/ship-premium"
        actor: MembershipCoordinator
        preconditions:
          - "fulfillment_status == RESERVED"
          - "payment_status == PAID (premiums ship only after full payment — cross-dimension guard)"
        side_effects:
          - "reservation.status HELD -> COMMITTED; lot.reserved_qty -= quantity, lot.committed_qty += quantity (available_qty unchanged)"
      - from: "fulfillment_status=AWAITING_RESERVATION or RESERVED"
        to: "fulfillment_status=WAIVED"
        trigger: "POST /station/pledges/{id}/waive-premium"
        actor: MembershipCoordinator
        preconditions:
          - "fulfillment_status in {AWAITING_RESERVATION, RESERVED}"
        side_effects:
          - "if RESERVED: reservation -> RELEASED; lot.reserved_qty -= quantity, lot.available_qty += quantity"
          - "pledge.net_collected_cents recomputed (premium FMV no longer deducted); drive.collected_cents resynced by the net delta; donor.lifetime_given_cents resynced by the net delta"

  - entity: Membership
    initial_state: ACTIVE
    terminal_states: []
    note: "Cyclic: ACTIVE -> GRACE -> LAPSED -> REINSTATED_PENDING -> ACTIVE. Cycle is the lapsed-member win-back loop."
    transitions:
      - from: ACTIVE
        to: GRACE
        trigger: "system clock advance past current_period_end (POST /station/_clock/set_current_utc crossing boundary)"
        actor: system
        preconditions:
          - "now >= current_period_end"
        side_effects:
          - "membership.status = GRACE; 30-day grace window opens"
      - from: GRACE
        to: LAPSED
        trigger: "system clock advance past current_period_end + 30 days"
        actor: system
        preconditions:
          - "now >= current_period_end + 30 days"
        side_effects:
          - "membership.status = LAPSED"
          - "donor.lapse_count += 1"
      - from: LAPSED
        to: REINSTATED_PENDING
        trigger: "POST /station/memberships/{id}/reinstate (lapsed-member campaign outreach action)"
        actor: MembershipCoordinator
        preconditions:
          - "status == LAPSED"
        side_effects:
          - "membership.status = REINSTATED_PENDING (awaiting payment to complete win-back)"
      - from: REINSTATED_PENDING
        to: ACTIVE
        trigger: "POST /station/pledges/{id}/payments completing payment on the reinstatement pledge"
        actor: PhoneVolunteer
        preconditions:
          - "status == REINSTATED_PENDING"
          - "linked pledge payment_status becomes PAID"
        side_effects:
          - "membership.status = ACTIVE; current_period_start = now; current_period_end = now + 12 months"
          - "donor.lapse_count reset to 0"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /station/pledges/{id}/payments on a membership already ACTIVE (renewal extends period)"
        actor: PhoneVolunteer
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "current_period_end extends by 12 months [ONE_TIME] or 1 month [SUSTAINER] from max(current_period_end, now)"

  - entity: PledgeDrive
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    note: "Branching with revert: DRAFT -> SCHEDULED -> DRAFT allowed (unschedule); SCHEDULED -> ON_AIR -> CLOSED -> RECONCILED."
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /station/pledge-drives/{id}/schedule"
        actor: StationAdmin
        preconditions:
          - "status == DRAFT"
          - "at least one OnAirBreak in SCHEDULED status exists for the drive"
          - "no other PledgeDrive in status SCHEDULED or ON_AIR overlaps [starts_at, ends_at) (drive-level temporal overlap, half-open: a drive ending exactly when another starts is allowed)"
        side_effects:
          - "status = SCHEDULED"
      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /station/pledge-drives/{id}/unschedule"
        actor: StationAdmin
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "status = DRAFT (breaks remain SCHEDULED and editable)"
      - from: SCHEDULED
        to: ON_AIR
        trigger: "POST /station/pledge-drives/{id}/go-live"
        actor: StationAdmin
        preconditions:
          - "status == SCHEDULED"
          - "now >= starts_at (clock reached drive window)"
        side_effects:
          - "status = ON_AIR; pledge capture endpoints now accept pledges for this drive"
      - from: ON_AIR
        to: CLOSED
        trigger: "POST /station/pledge-drives/{id}/close"
        actor: StationAdmin
        preconditions:
          - "status == ON_AIR"
        side_effects:
          - "status = CLOSED; pledge capture rejected (ERR_DRIVE_NOT_OPEN)"
          - "all OnAirBreaks still SCHEDULED transition to AIRED (drive over, breaks treated as aired)"
          - "all MatchingChallenges still OPEN transition to EXPIRED (progress freezes)"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /station/pledge-drives/{id}/reconcile"
        actor: MembershipCoordinator
        preconditions:
          - "status == CLOSED"
          - "every Pledge linked to the drive has payment_status in {PAID, DECLINED, WRITTEN_OFF} (no PLEDGED or PARTIAL remain)"
        side_effects:
          - "status = RECONCILED; drive totals frozen for NFFS reporting"

  - entity: PremiumReservation
    initial_state: HELD
    terminal_states: [COMMITTED, RELEASED]
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "POST /station/pledges/{id}/ship-premium (on parent pledge)"
        actor: MembershipCoordinator
        preconditions:
          - "reservation.status == HELD"
          - "parent pledge payment_status == PAID"
        side_effects:
          - "lot.reserved_qty -= quantity; lot.committed_qty += quantity"
      - from: HELD
        to: RELEASED
        trigger: "POST /station/pledges/{id}/waive-premium, pledge decline/write-off cascade, or POST /station/premium-reservations/{id}/release"
        actor: MembershipCoordinator
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "lot.reserved_qty -= quantity; lot.available_qty += quantity (compensating invariant on lot counters)"

  - entity: NFFSReport
    initial_state: DRAFT
    terminal_states: []
    note: "DRAFT -> FINALIZED -> AMENDED -> FINALIZED (amendment cycle allowed after re-open)."
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /station/nffs-reports/{id}/finalize"
        actor: StationAdmin
        preconditions:
          - "status == DRAFT"
          - "finalizer X-User-ID != report.drafted_by_user_id (segregation of duties)"
        side_effects:
          - "variant becomes FINAL; membership_revenue_cents recomputed under FINAL variant (pledges only count when payment_status PAID/PARTIAL — PLEDGED and WRITTEN_OFF excluded)"
          - "finalized_by_user_id set"
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /station/nffs-reports/{id}/amend"
        actor: StationAdmin
        preconditions:
          - "status == FINALIZED"
        side_effects:
          - "status = AMENDED; variant returns to PROVISIONAL until re-finalized"
      - from: AMENDED
        to: FINALIZED
        trigger: "POST /station/nffs-reports/{id}/finalize"
        actor: StationAdmin
        preconditions:
          - "status == AMENDED"
          - "finalizer X-User-ID != report.drafted_by_user_id"
        side_effects:
          - "variant becomes FINAL; totals recomputed"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: break-create-stale-drive
    parent_entity: PledgeDrive
    write_endpoint: "POST /station/pledge-drives/{id}/breaks"
    occ_field: "expected_drive_version"
    description: |
      Creating an OnAirBreak against a PledgeDrive whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another scheduler has just modified the drive (added breaks,
      rescheduled) and the current writer's view of the drive — and therefore
      its overlap-check baseline — is stale.
    error_id: ERR_STALE_DRIVE_VERSION
    http_status: 412

  - rule_id: payment-post-stale-pledge
    parent_entity: Pledge
    write_endpoint: "POST /station/pledges/{id}/payments"
    occ_field: "expected_pledge_version"
    description: |
      Posting a payment against a Pledge whose version has advanced since the
      client last observed it is rejected. A prior payment posting (or a
      cascaded net_collected recompute from premium reservation) may have
      changed the remaining balance, so the stale writer's over-payment check
      would be computed against the wrong baseline.
    error_id: ERR_STALE_PLEDGE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pledge_net_collected
    trigger: "On every payment posting, premium reservation, premium waiver, decline, or write-off affecting a pledge"
    algorithm: aggregation
    formula: |
      fmv_deduction = 0
      if pledge.premium_id is not null
         and pledge.fulfillment_status in {RESERVED, SHIPPED}
         and not pledge.premium_waived:
          fmv_deduction = premium.fair_market_value_cents * reserved_quantity
      net_collected_cents = max(0, pledge.collected_cents - fmv_deduction)
      # Per-pledge rounding: values are integer cents already; rounding order
      # pinned as per-pledge-then-sum for any aggregate over pledges
      # (see nffs_membership_revenue mode-b rule).
    input_set: "Single pledge; premium FMV from linked Premium; quantity from active PremiumReservation (status HELD or COMMITTED)"
    constants:
      FLOOR: 0
    precision: "integer cents, round_half_up"
    variants:
      - name: with_premium_deduction
        when: "premium selected, not waived, and fulfillment in RESERVED or SHIPPED"
        difference: "FMV deducted; donor-facing tax receipt shows reduced deductible amount"
      - name: no_deduction
        when: "no premium, waived, or still AWAITING_RESERVATION"
        difference: "net == gross collected"

  - name: nffs_membership_revenue
    trigger: "On NFFSReport creation (PROVISIONAL) and on finalize/amend recompute (FINAL)"
    algorithm: aggregation
    formula: |
      # Mode (b) — nested rounding, pinned order:
      #   Step 1: compute each pledge's net_collected_cents (integer, no rounding needed)
      #   Step 2: sum per-pledge values, THEN convert — never average-then-round.
      # PROVISIONAL variant: include pledges with payment_status in
      #   {PLEDGED, PAID, PARTIAL} at FACE value for PLEDGED (uncollected
      #   pledges counted at amount_cents) and collected value otherwise.
      # FINAL variant: include ONLY pledges with payment_status in
      #   {PAID, PARTIAL} at net_collected_cents; PLEDGED and WRITTEN_OFF
      #   pledges contribute 0.
      if variant == PROVISIONAL:
          total = sum over pledges p in fiscal_year(drive.starts_at):
              (p.amount_cents - pfmv_deduction(p)) if p.payment_status == PLEDGED
              else p.net_collected_cents if p.payment_status in {PAID, PARTIAL}
              else 0
      else:  # FINAL
          total = sum over pledges p in fiscal_year(drive.starts_at):
              p.net_collected_cents if p.payment_status in {PAID, PARTIAL} else 0
    input_set: "All Pledges whose drive's starts_at falls within the report's fiscal year, where fiscal year FY is pinned as the half-open calendar window [FY-01-01T00:00:00Z, (FY+1)-01-01T00:00:00Z); per-variant status filter as above"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "report status DRAFT or AMENDED"
        difference: "uncollected PLEDGED pledges counted at face minus FMV"
      - name: final
        when: "report status FINALIZED"
        difference: "only actually-collected revenue counts; PLEDGED contributes 0 — same drive totals yield a strictly smaller-or-equal number"

  - name: membership_level_for_amount
    trigger: "At pledge capture, to validate that pledge amount qualifies for the requested level and premium tier"
    algorithm: tiered_pricing
    formula: |
      # Mode (a) — 3+ inputs, non-linear interaction:
      # Inputs: pledge.amount_cents, pledge.kind, level.min_annual_cents,
      #         level.min_monthly_sustainer_cents, premium.membership_level_code
      annualized = amount_cents * 12 if kind == SUSTAINER else amount_cents
      level_ok = (kind == SUSTAINER and amount_cents >= level.min_monthly_sustainer_cents)
                 or (kind == ONE_TIME and annualized >= level.min_annual_cents)
      premium_ok = premium is null
                   or (level.premium_eligible
                       and level_rank(level) >= level_rank(premium.membership_level_code))
      where level_rank(l) = l.min_annual_cents, tie-break l.code ASC
    input_set: "Pledge being captured; its MembershipLevel; selected Premium (if any)"
    precision: "integer cents, no rounding"
    variants: []

  - name: premium_inventory_valuation
    trigger: "On lot write-off and at fiscal-year close for CSG asset reporting"
    algorithm: chronological
    formula: |
      # FIFO variant: value of written-off or remaining units priced at
      # unit_cost_cents of the EARLIEST-received lots first (received_at ASC,
      # tie-break created_at ASC).
      # Weighted-average variant: total remaining value / total remaining qty
      # across all lots of the premium, applied per unit.
      fifo_value(qty_to_price):
          remaining = qty_to_price
          value = 0
          for lot in lots_of(premium) order by received_at ASC, created_at ASC:
              take = min(remaining, lot.available_qty + lot.reserved_qty)
              value += take * lot.unit_cost_cents
              remaining -= take
              if remaining == 0: break
          return value
      weighted_avg_value(qty_to_price):
          total_cost = sum over lots: (available+reserved) * unit_cost_cents
          total_qty  = sum over lots: (available+reserved)
          return round(qty_to_price * total_cost / total_qty)  # round_half_up
    input_set: "All PremiumInventoryLots of a premium with available+reserved > 0, ordered by received_at ASC then created_at ASC"
    precision: "integer cents, round_half_up"
    variants:
      - name: fifo
        when: "default for CSG asset reporting"
        difference: "chronological lot consumption; earliest cost basis applies"
      - name: weighted_average
        when: "alternative management view"
        difference: "same write-off quantity yields a different cent value whenever lots have different unit costs"

  - name: matching_challenge_progress
    trigger: "On pledge capture with matching_challenge_id, and on pledge decline/write-off cascade"
    algorithm: threshold
    formula: |
      progress_cents = sum of amount_cents over pledges p
          where p.matching_challenge_id == challenge.id
          and p.payment_status NOT IN (DECLINED, WRITTEN_OFF)
      # Boundary pinned: progress_cents >= goal_cents triggers MET (>=, not >).
      # A pledge landing exactly on the goal flips the challenge.
      if challenge.status == OPEN and progress_cents >= goal_cents:
          challenge.status = MET
    input_set: "Pledges linked to the challenge with payment_status NOT IN (DECLINED, WRITTEN_OFF)"
    constants:
      COMPARATOR: ">="
    precision: "integer cents"

  - name: drive_totals_rollup
    trigger: "On every pledge capture, payment, decline, write-off linked to a drive"
    algorithm: aggregation
    formula: |
      drive.pledged_cents = sum of p.amount_cents
          over pledges p where p.drive_id == drive.id
          and p.payment_status NOT IN (DECLINED, WRITTEN_OFF)
      drive.collected_cents = sum of p.net_collected_cents
          over pledges p where p.drive_id == drive.id
          and p.payment_status IN (PAID, PARTIAL)
    input_set: "Pledges of the drive filtered by payment_status as above"
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request body well-formed: all required fields present, types correct, enum values in range, ends_at strictly after starts_at where applicable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role authorized for the endpoint per §1.7 (e.g. PhoneVolunteer cannot write off a pledge; NFFS finalize requires StationAdmin)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist (drive, break, pledge, reservation, report, donor, membership), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource in a state that permits the operation. Pledge capture against a drive not ON_AIR yields the domain-specific ERR_DRIVE_NOT_OPEN (409); all other invalid-from-state violations (payment on terminal pledge, release of non-HELD reservation, finalize of FINALIZED report, ship-before-paid, etc.) yield ERR_INVALID_STATE (409)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: NFFS finalize/amend X-User-ID must differ from report.drafted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /station/nffs-reports/{id}/finalize"]
  - priority: 6
    category: business_temporal
    check: "OnAirBreak within drive window and no overlap: breaks are half-open [starts_at, ends_at) with a mandatory 5-minute buffer to any other break in the same drive — break A starting at exactly break B's ends_at + 5min is allowed; anything closer rejected"
    error_id: ERR_BREAK_OVERLAP
    http_status: 422
    applies_to: ["POST /station/pledge-drives/{id}/breaks"]
  - priority: 7
    category: business_temporal
    check: "Pledge write-off only after 60-day follow-up window: now >= pledge.created_at + 60 days"
    error_id: ERR_WRITEOFF_WINDOW
    http_status: 422
    applies_to: ["POST /station/pledges/{id}/write-off"]
  - priority: 8
    category: business_referential
    check: "Pledge membership_id belongs to donor_id; on_air_break_id belongs to drive_id; matching_challenge_id belongs to drive_id (belonging only — challenge status checked at priority 8b)"
    error_id: ERR_CROSS_REFERENCE
    http_status: 422
    applies_to: ["POST /station/pledges"]
  - priority: 8.5
    category: state
    check: "Referenced matching challenge is in OPEN status (MET/EXPIRED reject)"
    error_id: ERR_CHALLENGE_NOT_OPEN
    http_status: 409
    applies_to: ["POST /station/pledges"]
  - priority: 9
    category: business_constraint
    check: "Pledge amount qualifies for membership level per membership_level_for_amount; premium tier eligible; premium.active. (Inventory availability is NOT checked at capture — a capture with no stock yields fulfillment_status AWAITING_RESERVATION; availability is enforced only on the explicit reservation endpoint, which fails with ERR_INSUFFICIENT_INVENTORY.)"
    error_id: ERR_LEVEL_OR_PREMIUM_INELIGIBLE
    http_status: 422
    applies_to: ["POST /station/pledges", "POST /station/pledges/{id}/premium-reservations"]
  - priority: 10
    category: business_fiscal
    check: "Payment amount >= 1 and <= remaining balance (ONE_TIME); payment does not exceed amount_cents; write-off/decline amounts reconcile"
    error_id: ERR_PAYMENT_AMOUNT
    http_status: 422
    applies_to: ["POST /station/pledges/{id}/payments"]
  - priority: 11
    category: business_temporal
    check: "Drive scheduling overlap: no other PledgeDrive in status SCHEDULED or ON_AIR may overlap [starts_at, ends_at); half-open — a drive starting exactly when another ends is allowed"
    error_id: ERR_DRIVE_OVERLAP
    http_status: 422
    applies_to: ["POST /station/pledge-drives/{id}/schedule"]
  - priority: 12
    category: business_constraint
    check: "Reconcile requires all drive pledges in terminal payment states (PAID/DECLINED/WRITTEN_OFF)"
    error_id: ERR_UNRESOLVED_PLEDGES
    http_status: 422
    applies_to: ["POST /station/pledge-drives/{id}/reconcile"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- config: levels & premiums ---
  - method: POST
    path: "/station/membership-levels"
    description: "Create a membership level"
    roles: [StationAdmin]
    code: 201
    input: [code, min_annual_cents, min_monthly_sustainer_cents, "premium_eligible?", "active?"]
    output: MembershipLevel
    side_effects: []
  - method: GET
    path: "/station/membership-levels"
    description: "List membership levels"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: MembershipLevel[]
    side_effects: []
  - method: POST
    path: "/station/premiums"
    description: "Create a premium (thank-you gift) definition"
    roles: [StationAdmin]
    code: 201
    input: [sku, title, fair_market_value_cents, membership_level_code, "active?"]
    output: Premium
    side_effects: []
  - method: GET
    path: "/station/premiums/{id}"
    description: "Get a premium"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: []
    output: Premium
    side_effects: []
  - method: POST
    path: "/station/premiums/{id}/lots"
    description: "Receive an inventory lot for a premium"
    roles: [MembershipCoordinator]
    code: 201
    input: [received_at, unit_cost_cents, total_qty]
    output: PremiumInventoryLot
    side_effects: ["lot.available_qty initialized to total_qty"]
  - method: GET
    path: "/station/premiums/{id}/lots"
    description: "List lots of a premium (reverse-reachability for PremiumInventoryLot.premium_id)"
    roles: [StationAdmin, MembershipCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: PremiumInventoryLot[]
    side_effects: []

  # --- donors & memberships ---
  - method: POST
    path: "/station/donors"
    description: "Register a donor"
    roles: [MembershipCoordinator, PhoneVolunteer]
    code: 201
    input: [email, full_name, postal_code]
    output: Donor
    side_effects: []
  - method: GET
    path: "/station/donors/{id}"
    description: "Get a donor"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: []
    output: Donor
    side_effects: []
  - method: GET
    path: "/station/donors/{id}/memberships"
    description: "List memberships of a donor (reverse-reachability for Membership.donor_id)"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: ["limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: POST
    path: "/station/memberships"
    description: "Open a membership for a donor at a level"
    roles: [MembershipCoordinator, PhoneVolunteer]
    code: 201
    input: [donor_id, level_code, "sustainer?"]
    output: Membership
    side_effects: ["membership initialized ACTIVE with current_period_start = now, current_period_end = now (zero-length until first payment)"]
  - method: GET
    path: "/station/memberships/{id}"
    description: "Get a membership"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/station/memberships/{id}/reinstate"
    description: "Move a LAPSED membership to REINSTATED_PENDING (lapsed-member campaign action)"
    roles: [MembershipCoordinator]
    code: 200
    input: []
    output: Membership
    side_effects: ["Membership LAPSED -> REINSTATED_PENDING"]
  - method: GET
    path: "/station/memberships"
    description: "List memberships with filters (lapsed-member campaign selection)"
    roles: [StationAdmin, MembershipCoordinator]
    code: 200
    input: ["status?", "donor_id?", "sustainer?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  # --- drives & breaks ---
  - method: POST
    path: "/station/pledge-drives"
    description: "Create a pledge drive (DRAFT)"
    roles: [StationAdmin]
    code: 201
    input: [name, starts_at, ends_at, goal_cents]
    output: PledgeDrive
    side_effects: []
  - method: GET
    path: "/station/pledge-drives/{id}"
    description: "Get a pledge drive with computed totals"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: []
    output: PledgeDrive
    side_effects: []
  - method: POST
    path: "/station/pledge-drives/{id}/breaks"
    description: "Schedule an on-air break inside a drive (OCC on drive version). Drive must be in DRAFT or SCHEDULED status — once ON_AIR/CLOSED/RECONCILED the break lineup is frozen (ERR_INVALID_STATE)."
    roles: [StationAdmin]
    code: 201
    input: [starts_at, ends_at, program_title, pitch_level_code, expected_drive_version]
    output: OnAirBreak
    side_effects: ["increments PledgeDrive.version by 1", "break overlap validation (5-minute buffer, half-open)"]
  - method: GET
    path: "/station/pledge-drives/{id}/breaks"
    description: "List breaks of a drive (reverse-reachability for OnAirBreak.drive_id)"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: ["limit?", "offset?"]
    output: OnAirBreak[]
    side_effects: []
  - method: POST
    path: "/station/pledge-drives/{id}/schedule"
    description: "Move drive DRAFT -> SCHEDULED (validates drive-level temporal overlap)"
    roles: [StationAdmin]
    code: 200
    input: []
    output: PledgeDrive
    side_effects: ["PledgeDrive DRAFT -> SCHEDULED"]
  - method: POST
    path: "/station/pledge-drives/{id}/unschedule"
    description: "Move drive SCHEDULED -> DRAFT"
    roles: [StationAdmin]
    code: 200
    input: []
    output: PledgeDrive
    side_effects: ["PledgeDrive SCHEDULED -> DRAFT"]
  - method: POST
    path: "/station/pledge-drives/{id}/go-live"
    description: "Move drive SCHEDULED -> ON_AIR when clock reaches starts_at"
    roles: [StationAdmin]
    code: 200
    input: []
    output: PledgeDrive
    side_effects: ["PledgeDrive SCHEDULED -> ON_AIR"]
  - method: POST
    path: "/station/pledge-drives/{id}/close"
    description: "Move drive ON_AIR -> CLOSED; cascades breaks to AIRED and challenges to EXPIRED"
    roles: [StationAdmin]
    code: 200
    input: []
    output: PledgeDrive
    side_effects: ["PledgeDrive ON_AIR -> CLOSED", "OnAirBreak SCHEDULED -> AIRED (all in drive)", "MatchingChallenge OPEN -> EXPIRED (all in drive)"]
  - method: POST
    path: "/station/pledge-drives/{id}/reconcile"
    description: "Move drive CLOSED -> RECONCILED once all pledges resolved"
    roles: [MembershipCoordinator]
    code: 200
    input: []
    output: PledgeDrive
    side_effects: ["PledgeDrive CLOSED -> RECONCILED"]

  # --- pledges ---
  - method: POST
    path: "/station/pledges"
    description: "Capture a pledge (phone or web); validates level/premium eligibility; auto-creates reservation when premium selected and stock available"
    roles: [PhoneVolunteer]
    code: 201
    input: [donor_id, membership_id, drive_id, "on_air_break_id?", "matching_challenge_id?", channel, kind, amount_cents, "premium_id?", "premium_waived?"]
    output: Pledge
    side_effects:
      - "drive.pledged_cents += amount_cents (drive_totals_rollup)"
      - "if matching_challenge_id: challenge.progress_cents += amount_cents; threshold check may set MET (matching_challenge_progress, >= comparator)"
      - "if premium_id and not premium_waived and stock available: PremiumReservation HELD created, fulfillment_status RESERVED, lot counters update; else fulfillment_status AWAITING_RESERVATION"
      - "if premium_waived: fulfillment_status WAIVED"
      - "if kind == SUSTAINER: membership.sustainer set true"
  - method: GET
    path: "/station/pledges/{id}"
    description: "Get a pledge"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: []
    output: Pledge
    side_effects: []
  - method: GET
    path: "/station/pledges"
    description: "List pledges with filters (reverse-reachability for Pledge.donor_id / drive_id / membership_id / matching_challenge_id / on_air_break_id / premium_id)"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: ["donor_id?", "drive_id?", "membership_id?", "matching_challenge_id?", "on_air_break_id?", "premium_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Pledge[]
    side_effects: []
  - method: POST
    path: "/station/pledges/{id}/payments"
    description: "Post a payment against a pledge (OCC on pledge version)"
    roles: [PhoneVolunteer]
    code: 201
    input: [amount_cents, expected_pledge_version]
    output: Pledge
    side_effects:
      - "increments Pledge.version by 1"
      - "payment_status PLEDGED/PARTIAL -> PAID or PARTIAL"
      - "pledge_net_collected recompute; drive.collected_cents delta; donor.lifetime_given_cents delta"
      - "membership period extension; LAPSED -> REINSTATED_PENDING -> ACTIVE cascade with donor.lapse_count reset"
  - method: POST
    path: "/station/pledges/{id}/decline"
    description: "Decline a pledge (payment failed / donor reneged before follow-up)"
    roles: [PhoneVolunteer]
    code: 200
    input: [reason]
    output: Pledge
    side_effects: ["payment_status -> DECLINED", "compensating reversals on drive/challenge/donor totals", "reservation RELEASED cascade"]
  - method: POST
    path: "/station/pledges/{id}/write-off"
    description: "Write off an unfulfilled pledge after the 60-day follow-up window"
    roles: [MembershipCoordinator]
    code: 200
    input: [reason]
    output: Pledge
    side_effects: ["payment_status -> WRITTEN_OFF", "compensating reversals", "reservation RELEASED cascade"]
  - method: POST
    path: "/station/pledges/{id}/premium-reservations"
    description: "Reserve premium inventory for a pledge in AWAITING_RESERVATION. When lot_id is omitted the server selects the lot deterministically: eligibility filter = lots of pledge.premium_id with available_qty >= quantity; ranking = received_at ASC; tie-break = created_at ASC; empty candidate set -> ERR_INSUFFICIENT_INVENTORY."
    roles: [MembershipCoordinator]
    code: 201
    input: [quantity, "lot_id?"]
    output: PremiumReservation
    side_effects: ["fulfillment_status AWAITING_RESERVATION -> RESERVED", "lot.reserved_qty += quantity, lot.available_qty -= quantity", "pledge_net_collected recompute"]
  - method: GET
    path: "/station/pledges/{id}/premium-reservations"
    description: "List reservations of a pledge (reverse-reachability for PremiumReservation.pledge_id)"
    roles: [StationAdmin, MembershipCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: PremiumReservation[]
    side_effects: []
  - method: GET
    path: "/station/premium-reservations/{id}"
    description: "Get a premium reservation"
    roles: [StationAdmin, MembershipCoordinator]
    code: 200
    input: []
    output: PremiumReservation
    side_effects: []
  - method: GET
    path: "/station/premium-reservations"
    description: "List premium reservations with filters (reverse-reachability for PremiumReservation.premium_id and PremiumReservation.lot_id)"
    roles: [StationAdmin, MembershipCoordinator]
    code: 200
    input: ["pledge_id?", "premium_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: PremiumReservation[]
    side_effects: []
  - method: POST
    path: "/station/pledges/{id}/ship-premium"
    description: "Mark premium shipped; requires pledge PAID"
    roles: [MembershipCoordinator]
    code: 200
    input: []
    output: Pledge
    side_effects: ["fulfillment_status RESERVED -> SHIPPED", "reservation HELD -> COMMITTED", "lot.reserved_qty -> committed_qty transfer"]
  - method: POST
    path: "/station/pledges/{id}/waive-premium"
    description: "Waive premium after capture (donor calls back to decline gift)"
    roles: [MembershipCoordinator]
    code: 200
    input: []
    output: Pledge
    side_effects: ["fulfillment_status -> WAIVED", "reservation RELEASED if HELD", "pledge_net_collected recompute (FMV no longer deducted)"]
  - method: POST
    path: "/station/premium-reservations/{id}/release"
    description: "Manually release a HELD reservation (e.g. donor changed mind before shipment)"
    roles: [MembershipCoordinator]
    code: 200
    input: []
    output: PremiumReservation
    side_effects: ["reservation HELD -> RELEASED", "lot counters compensate", "parent pledge fulfillment_status -> AWAITING_RESERVATION"]

  # --- matching & underwriting ---
  - method: POST
    path: "/station/pledge-drives/{id}/matching-challenges"
    description: "Create a matching challenge within a drive"
    roles: [StationAdmin]
    code: 201
    input: [sponsor_name, goal_cents, match_cents]
    output: MatchingChallenge
    side_effects: []
  - method: GET
    path: "/station/pledge-drives/{id}/matching-challenges"
    description: "List challenges of a drive (reverse-reachability for MatchingChallenge.drive_id)"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: ["limit?", "offset?"]
    output: MatchingChallenge[]
    side_effects: []
  - method: GET
    path: "/station/matching-challenges/{id}"
    description: "Get a matching challenge with progress"
    roles: [StationAdmin, MembershipCoordinator, PhoneVolunteer]
    code: 200
    input: []
    output: MatchingChallenge
    side_effects: []
  - method: POST
    path: "/station/pledge-drives/{id}/underwriting-credits"
    description: "Record an underwriting credit for a drive (excluded from NFFS membership revenue)"
    roles: [StationAdmin]
    code: 201
    input: [underwriter_name, amount_cents, "aired?"]
    output: UnderwritingCredit
    side_effects: []
  - method: GET
    path: "/station/pledge-drives/{id}/underwriting-credits"
    description: "List underwriting credits of a drive (reverse-reachability for UnderwritingCredit.drive_id)"
    roles: [StationAdmin, MembershipCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: UnderwritingCredit[]
    side_effects: []

  # --- NFFS reporting ---
  - method: POST
    path: "/station/nffs-reports"
    description: "Draft an NFFS report for a fiscal year (PROVISIONAL variant computed)"
    roles: [MembershipCoordinator]
    code: 201
    input: [fiscal_year]
    output: NFFSReport
    side_effects: ["nffs_membership_revenue computed under PROVISIONAL variant", "drafted_by_user_id = X-User-ID"]
  - method: GET
    path: "/station/nffs-reports/{id}"
    description: "Get an NFFS report"
    roles: [StationAdmin, MembershipCoordinator]
    code: 200
    input: []
    output: NFFSReport
    side_effects: []
  - method: POST
    path: "/station/nffs-reports/{id}/finalize"
    description: "Finalize an NFFS report (recomputes under FINAL variant; segregation of duties enforced)"
    roles: [StationAdmin]
    code: 200
    input: []
    output: NFFSReport
    side_effects: ["variant -> FINAL", "membership_revenue_cents recomputed", "status DRAFT/AMENDED -> FINALIZED"]
  - method: POST
    path: "/station/nffs-reports/{id}/amend"
    description: "Re-open a FINALIZED report for amendment (returns to PROVISIONAL)"
    roles: [StationAdmin]
    code: 200
    input: []
    output: NFFSReport
    side_effects: ["status FINALIZED -> AMENDED", "variant -> PROVISIONAL"]

  # --- test-driving ---
  - method: POST
    path: "/station/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. Crossing a membership current_period_end (+ 30-day grace) triggers the corresponding Membership status transitions."
    roles: [StationAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Membership ACTIVE -> GRACE -> LAPSED transitions evaluated for all memberships whose boundaries are crossed"]

# =============================================================================
# 1.6 Error Code Catalog (20 errors)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the endpoint (e.g. PhoneVolunteer attempting write-off or NFFS draft)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state permitting the operation (generic invalid-transition)"
  - id: ERR_DRIVE_NOT_OPEN
    http: 409
    condition: "Pledge capture attempted against a drive not in ON_AIR status"
  - id: ERR_STALE_DRIVE_VERSION
    http: 412
    condition: "expected_drive_version does not match PledgeDrive.version on break creation"
  - id: ERR_STALE_PLEDGE_VERSION
    http: 412
    condition: "expected_pledge_version does not match Pledge.version on payment posting"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "NFFS finalize attempted by the same X-User-ID that drafted the report"
  - id: ERR_BREAK_OVERLAP
    http: 422
    condition: "On-air break overlaps another break in the same drive within the 5-minute buffer, or lies outside the drive window"
  - id: ERR_DRIVE_OVERLAP
    http: 422
    condition: "Drive being scheduled overlaps another SCHEDULED or ON_AIR drive (half-open interval test)"
  - id: ERR_WRITEOFF_WINDOW
    http: 422
    condition: "Write-off attempted before the 60-day unfulfilled-pledge follow-up window has elapsed"
  - id: ERR_CROSS_REFERENCE
    http: 422
    condition: "Pledge references inconsistent parents (membership not owned by donor, break not in drive, challenge not in drive or not OPEN)"
  - id: ERR_LEVEL_OR_PREMIUM_INELIGIBLE
    http: 422
    condition: "Pledge amount below level minimum, premium tier above pledge level, or premium inactive"
  - id: ERR_PAYMENT_AMOUNT
    http: 422
    condition: "Payment amount < 1, or exceeds remaining balance on a ONE_TIME pledge"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 422
    condition: "Premium reservation requested but no lot has available_qty >= quantity (exact-zero available rejects)"
  - id: ERR_PREMIUM_NOT_SELECTED
    http: 422
    condition: "Reservation/ship/waive attempted on a pledge with no premium selected (fulfillment_status NO_PREMIUM or already WAIVED)"
  - id: ERR_UNRESOLVED_PLEDGES
    http: 422
    condition: "Drive reconcile attempted while pledges remain in PLEDGED or PARTIAL"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "MembershipLevel.code or Premium.sku already exists"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, malformed value, or ends_at <= starts_at"
  - id: ERR_CHALLENGE_NOT_OPEN
    http: 409
    condition: "Pledge references a matching challenge in MET or EXPIRED status"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StationAdmin
    description: "Station general manager / development director; owns schedule, drive lifecycle, NFFS finalization"
    identity: opaque
    exclusive_operations:
      - "create membership levels, premiums"
      - "create/schedule/unschedule/go-live/close pledge drives"
      - "schedule on-air breaks"
      - "create matching challenges and underwriting credits"
      - "finalize and amend NFFS reports"
      - "set the logical clock"
    shared_operations:
      - "read any entity"
  - name: MembershipCoordinator
    description: "Membership manager; owns donor CRM, inventory lots, premium fulfillment, write-offs, NFFS drafting, drive reconcile"
    identity: opaque
    exclusive_operations:
      - "receive premium inventory lots"
      - "write off unfulfilled pledges"
      - "reserve/ship/waive premiums and release reservations"
      - "reinstate lapsed memberships"
      - "reconcile closed drives"
      - "draft NFFS reports"
    shared_operations:
      - "register donors, open memberships"
      - "read any entity"
  - name: PhoneVolunteer
    description: "Pledge-drive phone-bank volunteer; captures pledges and posts payments only"
    identity: opaque
    exclusive_operations:
      - "capture pledges (PHONE channel)"
      - "post pledge payments"
      - "decline pledges"
    shared_operations:
      - "register donors, open memberships"
      - "read pledges, drives, levels, premiums, donors, memberships"
