            - "the second trigger (different director, still MARROW) returns HTTP 422 with error_id ERR_DONOR_METHOD_NOT_CONSENTED"
            - "after the two rejections WorkupCase.${wc_id}.collection_method is still null, logistics_status is still UNSCHEDULED and method_decided_by_user_id is still null"
