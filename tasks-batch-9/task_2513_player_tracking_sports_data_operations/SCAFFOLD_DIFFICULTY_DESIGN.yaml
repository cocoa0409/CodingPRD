              captures: { err_ref: $.data.error_id }
          assert:
            - "${err_safety} == ERR_BIOMETRIC_CONSENT_MISSING with HTTP 422 (business_safety, priority 51 wins)"
            - "${err_ref} == ERR_PLAYER_NOT_IN_GAME with HTTP 409 (business_referential, priority 76, once the safety violation is removed)"
            - "Game.${g_id}.total_tag_count == 0 and Game.${g_id}.draft_tag_count == 0"
            - "Game.${g_id}.version == ${gv1} (a rejected create never increments the OCC parent version)"
            - "Player.${p_out}.biometric_release_state == NONE"

  # =========================================================================
  # RULE 6 — boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: calibration_pass_threshold_exact_value_and_gate_minimums
        grounds:
          - calculations.calibration_accuracy_evaluation
          - entities.CalibrationRun.fields.composite_rms_mm
          - entities.CalibrationRun.fields.result
          - state_machines.TrackingInstallation.CALIBRATING_to_VALIDATED
        distinguishing_aspect: |
          Numeric-threshold boundary at 2-decimal precision: composite_rms_mm exactly 90.00
          returns PASS (inclusive) while 90.01 - one hundredth over - returns PROVISIONAL and
          leaves the rig in CALIBRATING; the sample gate is exercised at its own boundary with
          sample_count 4999 (INVALID, evaluated before the thresholds even though the accuracy
          is perfect) and 5000 with reference_point_count exactly 12 (PASS).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with four DEPLOYED installations RIG-A..RIG-D"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_a: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-B", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_b: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-C", modality: "LIDAR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_c: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-D", modality: "OPTICAL_CAMERA" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_d: $.data.id }
          trigger:
            - call: "POST /installations/${i_a}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { r_a: $.data.id, res_a: $.data.result, comp_a: $.data.composite_rms_mm }
            - call: "POST /installations/${i_b}/calibration-runs"
              payload: { axis_rms_x_mm: 90.01, axis_rms_y_mm: 90.01, axis_rms_z_mm: 90.01, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { r_b: $.data.id, res_b: $.data.result, comp_b: $.data.composite_rms_mm }
            - call: "POST /installations/${i_c}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 4999, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { r_c: $.data.id, res_c: $.data.result, comp_c: $.data.composite_rms_mm }
            - call: "POST /installations/${i_d}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 5000, reference_point_count: 12 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { r_d: $.data.id, res_d: $.data.result }
          assert:
            - "${comp_a} == 90.00 and ${res_a} == PASS and TrackingInstallation.${i_a}.status == VALIDATED"
            - "${comp_b} == 90.01 and ${res_b} == PROVISIONAL and TrackingInstallation.${i_b}.status == CALIBRATING"
            - "${comp_c} == 90.00 and ${res_c} == INVALID and TrackingInstallation.${i_c}.status == CALIBRATING (the sample gate is evaluated before the accuracy thresholds)"
            - "${res_d} == PASS and TrackingInstallation.${i_d}.status == VALIDATED (5000 samples and 12 reference points are both inclusive minimums)"
            - "Venue.${v_id}.data_posture == UNCERTIFIED and Venue.${v_id}.certified_installation_count == 0"
            - "Venue.${v_id}.uncertified_installation_count == 2 and Venue.${v_id}.recalibrating_installation_count == 2"

      - name: certify_rejects_empty_accepted_tag_set
        grounds:
          - validations[priority=68]
          - errors[ERR_NO_ACCEPTED_TAGS]
          - calculations.event_tag_quality_index
          - entities.Game.fields.accepted_tag_count
        distinguishing_aspect: |
          Empty-set / zero-cardinality boundary rather than a numeric threshold: a COLLECTED game
          with accepted_tag_count exactly 0 cannot be certified (ERR_NO_ACCEPTED_TAGS) and its
          quality_index takes the empty-set short circuit 0.0000 instead of the weighted 0.3000 a
          naive weighting would produce from mean_confidence 0 and correction_penalty 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with one CERTIFIED rig, data_posture CERTIFIED"
            - "Game opened and closed with no event tags ever created (collection_status COLLECTED, certification_status PENDING)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
            - call: "POST /installations/${i_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /games/${g_id}/close-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
          trigger:
            - call: "POST /games/${g_id}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { err_empty: $.data.error_id }
          assert:
            - "${err_empty} == ERR_NO_ACCEPTED_TAGS with HTTP 422"
            - "Game.${g_id}.accepted_tag_count == 0 and Game.${g_id}.total_tag_count == 0"
            - "Game.${g_id}.quality_index == 0.0000"
            - "Game.${g_id}.certification_status == PENDING"
            - "Game.${g_id}.collection_status == COLLECTED (no ARCHIVED side effect fired)"
            - "Game.${g_id}.certified_at_utc == null"

  # =========================================================================
  # RULE 7 — cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_collection_requires_certified_venue_posture
        grounds:
          - validations[priority=50]
          - errors[ERR_VENUE_NOT_CERTIFIED]
          - calculations.venue_data_posture
          - state_machines.Game.collection_status_SCHEDULED_to_LIVE
        distinguishing_aspect: |
          The Game transition depends on a THIRD entity's derived census: Venue.data_posture,
          itself aggregated over TrackingInstallation rows. With required_certified_installations
          2 and only one rig certified the posture is RESTRICTED and open-collection fails with
          ERR_VENUE_NOT_CERTIFIED; certifying the second rig flips the posture to CERTIFIED and
          the identical call succeeds - nothing about the Game changed in between.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "Harbor Arena venue with required_certified_installations 2"
            - "two installations, both VALIDATED after PASS runs (RIG-A by eng-01, RIG-B by eng-02); only RIG-A certified, so data_posture is RESTRICTED"
            - "Game SCHEDULED at that venue"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 2, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
