              as_user_id: "${rn_id}"
          trigger:
            - call: "POST /health-office/health-visits/${visit_a_id}/dispose"
              payload: { disposition: "EMS_TRANSPORT" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
