          One trigger, two outcomes, chosen by comparing the recomputed figure with the stored one —
          and the reconciliation is asymmetric: a rise keeps the statement in DRAFT with
          truedown_cents reset to 0, a fall moves it to UNDER_TRUEUP and records the difference,
          and once it has fallen there is NO declared recompute transition out of UNDER_TRUEUP, so
          a third recompute must be refused rather than silently re-running. Finalisation then
