        claim_type: role_exclusive_denial
        grounds: [roles.Analyst, "endpoints.POST /api/valuations/{id}/confirm"]
        distinguishing_aspect: "The Analyst drafts valuations but cannot confirm them — drafting and confirming are split across roles."
        test_recipe:
          setup: ["BASE; V1 draft exists"]
