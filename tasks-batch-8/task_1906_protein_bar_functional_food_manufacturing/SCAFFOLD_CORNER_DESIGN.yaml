        distinguishing_aspect: "HIGH_PROTEIN claim with label protein 4.80 g/serving (10 kg whey at nominal 0.80 over 1666 bars) fails verify-nutrition with ERR_LABEL_CLAIM_UNSUBSTANTIATED; revision stays SUBMITTED."
        test_recipe:
          setup: ["WHEY ingredient nominal 0.80; customer; formula FL; revision RL (WHEY 10 kg contributor, claims [HIGH_PROTEIN]) SUBMITTED"]
          setup_api_calls:
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "FL", bar_weight_g: 60 }, as: FormulationScientist, captures: { fl: "$.data.id" } }
            - { call: "POST /mfg/formulas/${fl}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 10, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 10, claim_tags: ["HIGH_PROTEIN"] }, as: FormulationScientist, captures: { rl: "$.data.id" } }
            - { call: "POST /mfg/revisions/${rl}/submit", payload: {}, as: FormulationScientist }
          trigger:
            - { call: "POST /mfg/revisions/${rl}/verify-nutrition", payload: {}, as: QualityManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /mfg/revisions/${rl}", payload: {}, as: QualityManager, captures: { st: "$.data.status" } }
          assert: ["error_id == ERR_LABEL_CLAIM_UNSUBSTANTIATED (422): 10000*0.80/1666 = 4.80 < 10.0; revision remains SUBMITTED"]

      - name: c_composite_claim_unsubstantiated_at_pre_run
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_COMPOSITE_CLAIM_UNSUBSTANTIATED]", calculations.protein_claim_substantiation]
        distinguishing_aspect: "LABEL passes (nominal 0.80 => 19.21 g) but COMPOSITE fails: reserved lot CoA 0.20 => 4.80 g < 10.0, so verify-pre-run returns ERR_COMPOSITE_CLAIM_UNSUBSTANTIATED and the run stays SCHEDULED."
        test_recipe:
          setup: ["WHEY lot WL low-coa 0.20 RELEASED (200 kg); revision RH (WHEY 40, claims [HIGH_PROTEIN]) fully approved incl. claim review (LABEL 19.21 >= 10); AG3 ACTIVE; line L1; run created + scheduled (fresh line, NONE changeover)"]
          setup_api_calls:
            - { call: "POST /mfg/suppliers", payload: { name: "S1", qualification_status: "APPROVED" }, as: PlantAdmin, captures: { sup: "$.data.id" } }
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-LOW", received_qty_kg: 200, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.2 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 300, tier_breaks: [{ upto_cases: 999999999, rate_cents_per_case: 500 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { ag: "$.data.id" } }
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "FH", bar_weight_g: 60 }, as: FormulationScientist, captures: { fh: "$.data.id" } }
            - { call: "POST /mfg/formulas/${fh}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 19, claim_tags: ["HIGH_PROTEIN"] }, as: FormulationScientist, captures: { rh: "$.data.id" } }
            - { call: "POST /mfg/revisions/${rh}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rh}/verify-nutrition", payload: {}, as: QualityManager, captures: { lbl: "$.data.label_protein_g_per_serving" } }
            - { call: "POST /mfg/claim-reviews", payload: { revision_id: "${rh}", claim_tag: "HIGH_PROTEIN", claim_type: "NUTRIENT_CONTENT" }, as: FormulationScientist, captures: { cr: "$.data.id" } }
            - { call: "POST /mfg/claim-reviews/${cr}/start-review", payload: {}, as: QualityManager }
            - { call: "POST /mfg/claim-reviews/${cr}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${rh}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rh}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/lines", payload: { name: "L1", capacity_kg_per_hour: 500, slab_weight_kg: 20 }, as: PlantAdmin, captures: { ln1: "$.data.id", ln_v: "$.data.version" } }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T06:00:00Z" }, as: PlantAdmin }
