          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id, stale_buyer_v: $.data.version }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
              as_user_id: "admin-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84100, complaint_text: "Transmission slips under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /arbitration/buyers/${buyer_id}/fee-payments"
              payload: { amount_cents: 1000, expected_buyer_version: "${stale_buyer_v}" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the captured ${stale_buyer_v} is 1"
            - "HTTP 412 and response.data.error_id == \"ERR_STALE_BUYER_VERSION\""
            - "GET /arbitration/buyers/${buyer_id} returns version == 2, frivolous_fee_balance_cents == 0 and open_claim_count == 1"

      # --- corners already covered by §1.8 -----------------------------------
      - name: cascading_side_effects_chain_excluded
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / upheld_accept_cascades_five_hops_to_sibling_sale_settlement_holds
          rationale: "That instance verifies a five-level chain end to end and asserts every intermediate hop, which is the cascading-side-effects claim; the four-hop frivolous instance covers a second, differently rooted chain."

      - name: dual_variant_calculation_layer_excluded
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calculation / allowance_negotiated_accept_exceeds_arbitrator_formula
          rationale: "That instance and its ARBITRATOR_AWARD sibling assert both variants on identical data and the delta between them."

      - name: rate_threshold_triggers_layer_excluded
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_condition_cluster / min_scorecard_sales_boundary_gates_a_higher_rate_than_the_block_threshold
          rationale: "That instance sits exactly on the cumulative sales gate with a rate past TIER_BLOCK_BPS and shows the tier move only once the gate opens."

  - section: consistency_model
    instances:
      - name: withdraw_restores_every_counter_within_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.open_claim_counter_invariant
        distinguishing_aspect: "The withdraw response already reports WITHDRAWN and the immediately following reads show all four counters back at their pre-claim values with arbitration_status NONE — nothing lags behind a background pass, and no sweep is needed."
        test_recipe:
          setup: ["A SUBMITTED MECHANICAL case whose counters currently read 1 on the sale, the buyer and the seller."]
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "MECHANICAL", window_hours: 48, mileage_limit: 250, min_claim_amount_cents: 60000, requires_third_party_verification: false, max_allowance_bps: 2000, psi_extension_hours: 96, psi_clean_waives_rights: true }
              as: AuctionAdmin
              as_user_id: "admin-01"
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84100, complaint_text: "Transmission slips under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "GET /arbitration/sales/${sale_id}"
              payload: {}
              as: AuctionAdmin
              as_user_id: "admin-01"
              captures: { open_before: $.data.open_case_count }
          trigger:
            - call: "POST /arbitration/cases/${case_id}/withdraw"
              payload: { withdraw_reason: "Buyer resold the unit as-is" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
          assert:
            - "the captured ${open_before} equals 1"
            - "HTTP 200 and response.data.status == \"WITHDRAWN\" and response.data.version == 2"
            - "GET /arbitration/sales/${sale_id} returns open_case_count == 0 and arbitration_status == \"NONE\""
            - "GET /arbitration/buyers/${buyer_id} returns open_claim_count == 0 and lifetime_claim_count == 1"
            - "GET /arbitration/sellers/${seller_id} returns open_claim_count == 0 and policy_tier == \"GOOD_STANDING\""
