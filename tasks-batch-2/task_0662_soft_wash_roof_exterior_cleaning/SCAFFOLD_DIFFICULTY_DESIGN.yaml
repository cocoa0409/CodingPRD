        distinguishing_aspect: |
          Numeric threshold boundary on subtotal_cents at the send endpoint: subtotal exactly 1,500,000
          (MID_JOB_CENTS) lands in the half-travel branch (>= inclusive) → travel_surcharge_cents == 3750,
          NOT the full 7500 branch. Endpoint: POST /quotes/{id}/send.
        test_recipe:
          setup:
            - "1-story Property; DRAFT quote with a single SIDING/HOUSE_WASH 100000-sqft line giving subtotal exactly 1,500,000 cents."
          setup_api_calls:
            - call: "POST /customers"
