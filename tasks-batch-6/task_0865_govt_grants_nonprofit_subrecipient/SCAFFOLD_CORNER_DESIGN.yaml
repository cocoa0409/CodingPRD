              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { sub_v0: $.data.version }
            - call: "POST /subawards/${sub_id}/risk-assessments"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
            - call: "POST /subawards/${sub_id}/drawdowns"
