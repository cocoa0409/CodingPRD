            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_a}" }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc1}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /jobs/${job_id}/cancel", payload: {}, as: CarrierRep, as_user_id: "${carrier_b}", captures: { err1: $.data.error_id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc2}", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_NOT_RESOURCE_OWNER (403): correct role, wrong carrier"
            - "err2 == ERR_NOT_RESOURCE_OWNER (403): correct role, wrong escort; assignment remains OFFERED"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_job_amend_stale_version
        claim_type: layer_optimistic_concurrency
        grounds: ["concurrency_rules[job-amend-stale-version]", "errors[ERR_STALE_JOB_VERSION]"]
        distinguishing_aspect: "Amendment carries expected_job_version: the first amend at version 2 succeeds (QUOTED -> DRAFT, quote cleared, legs reset); replaying the same observed version is stale and rejected 412."
        test_recipe:
          setup: ["Carrier; TX job (width 170 / height 150) created (version 1) and quoted (version 2)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "OCC Job Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "OCC", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher, captures: { job_v: $.data.version } }
          trigger:
            - { call: "POST /jobs/${job_id}/amendments", payload: { expected_job_version: "${job_v}", width_inches: 171 }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/amendments", payload: { expected_job_version: "${job_v}", width_inches: 172 }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "First amend (expected == ${job_v} == 2): 200, job_status == DRAFT, quoted_cents == null, quote_expires_at == null, width_inches == 171, version == 3"
            - "Legs reset to PENDING because a dimensional field changed (GET /jobs/${job_id}/legs -> data[0].leg_status == PENDING)"
            - "Second amend replaying version 2: http 412 with data.error_id == ERR_STALE_JOB_VERSION; width_inches remains 171"

      - name: occ_leg_survey_accept_stale_version
        claim_type: layer_optimistic_concurrency
        grounds: ["concurrency_rules[survey-accept-stale-leg]", "errors[ERR_STALE_LEG_VERSION]"]
        distinguishing_aspect: "Survey decision carries expected_leg_version: one below the observed version is rejected 412; the exact observed version decides and bumps the leg version."
        test_recipe:
          setup: ["Booked TX job (width 170 / height 170); survey SUBMITTED with surveyed_min 180; leg version captured"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "OCC Leg Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "OCCL", width_inches: 170, height_inches: 170, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/route-surveys", payload: {}, as: RouteSurveyor, captures: { survey_id: $.data.id } }
            - { call: "POST /route-surveys/${survey_id}/submit", payload: { surveyed_min_clearance_inches: 180 }, as: RouteSurveyor }
            - { call: "GET /legs/${leg_id}", payload: {}, as: Dispatcher, captures: { leg_v: $.data.version } }
          trigger:
            - { call: "POST /route-surveys/${survey_id}/accept", payload: { expected_leg_version: "${leg_v} - 1", outcome: "ACCEPTED" }, as: SafetyManager, captures: { err: $.data.error_id } }
            - { call: "POST /route-surveys/${survey_id}/accept", payload: { expected_leg_version: "${leg_v}", outcome: "ACCEPTED" }, as: SafetyManager }
          assert:
            - "Stale (${leg_v} - 1): http 412 with data.error_id == ERR_STALE_LEG_VERSION; survey remains SUBMITTED"
            - "Current (${leg_v}): 200, survey ACCEPTED, RouteLeg.${leg_id}.version == ${leg_v} + 1, clearance_verdict == PASS"

      - name: pagination_defaults_and_bounds
        claim_type: layer_pagination_with_filtering
        grounds: [response_envelope.pagination_defaults]
        distinguishing_aspect: "Default limit 10 applies when omitted; total_count/has_more are exact across the offset boundary; limit 0 and 101 are out-of-range 400s."
        test_recipe:
          setup: ["12 carriers created in sequence"]
          setup_api_calls:
