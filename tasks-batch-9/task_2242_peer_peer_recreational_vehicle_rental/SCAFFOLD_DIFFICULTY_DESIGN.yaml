      - name: nightly_subtotal_rounds_per_night_not_once_at_the_end
        grounds: >-
          §1.3 booking_nightly_subtotal ("round_half_up PER NIGHT, then sum") read
          together with §1.3 season_multiplier_for_date and the PEAK/SHOULDER
          seasons whose boundary falls inside the booking.
        distinguishing_aspect: >-
          This is a one-cent boundary produced purely by rounding order, and the
          booking deliberately straddles the 08-31/09-01 season boundary so that
          the four nightly multipliers are not identical: 21533 * 1.35 = 29069.55
          rounds to 29070 on each of 08-29, 08-30 and 08-31, and 21533 * 1.10 =
          23686.3 rounds to 23686 on 09-01, summing to 110896. Rounding once at
          the end gives 21533 * 5.15 = 110894.95 -> 110895. The one-cent
          difference then propagates: pre_discount_cents 135847 versus 135846, and
          with the LOYALTY_TIER_1 400 bp discount and the 1200 bp service fee the
          final quote differs too. No other instance in this group probes rounding
          ORDER.
        test_recipe:
          setup: >-
            Canonical marketplace and LISTED listing with base_nightly_rate_cents
            21533 and a booking spanning three PEAK nights and one SHOULDER night,
            taken as far as OWNER_APPROVED.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - *c_booking
            - *c_bk_approve
          trigger:
            - *c_bk_confirm
          assert:
            - "response 200"
            - "data.nights == 4"
            - "data.base_subtotal_cents == 110896 (29070 + 29070 + 29070 + 23686), NOT 110895"
            - "data.premium_cents == 24951"
            - "data.loyalty_tier == 'LOYALTY_TIER_1'"
            - "data.loyalty_discount_cents == 5434"
            - "data.service_fee_cents == 15650"
            - "data.quoted_total_cents == 146063"

      - name: damage_zone_with_zero_post_trip_photos_is_the_empty_baseline_boundary
        grounds: >-
          §1.4 priority 23 ERR_PHOTO_BASELINE_MISSING and §1.3
          damage_photo_comparison, whose input_set is restricted to the claim's
          damage_zone, together with MIN_TRIP_PHOTO_ZONES = 4 versus
          MIN_INSPECTION_PHOTO_ZONES = 5.
        distinguishing_aspect: >-
          The boundary here is the size of a filtered set, not a number on a
          scale: the trip legally returned with only four POST_TRIP zones, so
          UNDERCARRIAGE has one PRE_TRIP photo and ZERO POST_TRIP photos while
          every other zone has both. A claim on UNDERCARRIAGE must be rejected
          with 422 ERR_PHOTO_BASELINE_MISSING even though the booking passed
          every /return check, and the control claim on EXTERIOR_REAR must succeed
          with verdict NEW_DAMAGE. An implementation that counts photos across all
          zones, or that treats an empty post set as NO_VISIBLE_CHANGE, accepts
          the first claim.
        test_recipe:
          setup: >-
            Canonical marketplace taken through /return with all five PRE_TRIP
            zones photographed but only four POST_TRIP zones (UNDERCARRIAGE
            omitted, which /return accepts because MIN_TRIP_PHOTO_ZONES is 4).
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
