      - name: ride_allocation_link_binds_a_ride_to_a_stop_and_needs_both_rows
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /ride-allocations]
          - validations[priority=11]
          - errors[ERR_REFERENCED_ENTITY_NOT_FOUND]
          - entities.RideAllocation.fields.ride_id
        distinguishing_aspect: |
          RideAllocation is the junction that ties inventory to a lot. A body FK that names no row answers
          ERR_REFERENCED_ENTITY_NOT_FOUND (404) at priority 11 — before any capacity or occupation arithmetic
          runs, so the lot ledger stays 0 — while the well-formed link answers 201 and charges the lot exactly
          once (ceil(4010 * 1.35) = 5414 sqft and 375.0 A).
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Ride WHEEL, Route R1 with PLANNED stop A at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
