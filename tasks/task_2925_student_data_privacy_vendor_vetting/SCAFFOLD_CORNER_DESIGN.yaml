        claim_type: aggregation
        grounds:
          - calculations.analyst_allocated_minutes.input_set
        excluded_because:
          difficulty_instance: reassign_conserves_district_wide_allocated_minutes
          rationale: "That §1.8 compensating_invariant instance already exercises the aggregation as a full recompute over non-terminal reviews and pins the conserved district-wide sum (0 / 540 with a total of 540)."

      - name: reauthorization_due_at_lead_days
        claim_type: Correct Result
        grounds:
