  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: early_cancellation_releases_the_exact_encumbrance_leaving_no_ledger_drift
        grounds:
          - calculations.courthouse_encumbrance_ledger
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
          - state_machines.PayClaim.ENCUMBERED_to_VOIDED
          - state_machines.Hearing.COVERED_to_SCHEDULED
          - entities.Courthouse.encumbered_pay_cents
          - entities.Courthouse.available_pay_cents
          - entities.Interpreter.pending_pay_cents
        distinguishing_aspect: |
          Conserved-quantity check: confirm then early-cancel then re-confirm the same
          hearing and the courthouse ledger must return to the identical trio of
          numbers each time (0 / 0 / 5000000 while nothing is confirmed, and
          31650 / 0 / 4968350 while one claim is encumbered). The compensation must
          release exactly provisional_total_cents — not the final amount, not a
          rounded figure — the voided claim must keep provisional_total_cents frozen
          with final_total_cents still null, and Interpreter.pending_pay_cents must
          fall back to 0 rather than retaining the reversed amount.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; language spa; courthouse CH_MAIN (pay_budget_cents 5000000); rate schedule RS1 (late_cancellation_hours 48)."
            - "Interpreter Ana Reyes ACTIVE with an ACTIVE CERTIFIED spa credential."
            - "Hearing H1 at CH_MAIN 2026-08-20T09:00-12:00Z, spa, TRIAL, in custody (class B); assignment A1 IN_PERSON with estimated_one_way_miles 40.0, CONFIRMED — provisional 31650 = 26250 service (3.00 h x 8750) + 5400 travel (2 x 40 x 67.5)."
            - "Lead time from the clock to the hearing is 19 days, far above late_cancellation_hours 48, so the cancellation is early."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /languages"
