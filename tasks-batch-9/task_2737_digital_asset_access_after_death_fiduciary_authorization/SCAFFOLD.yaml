    path: /refund-claims
    description: "Lists refund claims, filterable by cancellation order."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar, PlatformCompliance]
    input: ["cancellation_order_id?", "status?", "method?", "limit?", "offset?"]
    output: RefundClaim[]
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /refund-claims/{claim_id}/transitions
    description: >-
      Drives refund pursuit. Fiduciary owns ESCALATE; PlatformCompliance owns START_REVIEW,
      CREDIT, DENY and CHARGE_BACK. CHARGE_BACK compensates a credit exactly.
    roles: [Fiduciary, PlatformCompliance]
    input: [action, "credited_cents?", "escalation_reason?", "reason?"]
    output: RefundClaim
    success_code: 200
    side_effects:
      - "CREDIT: stores credited_cents and adds it to Estate.refund_recovered_cents"
      - "DENY: releases the claimed interval — SubscriptionTerm.claimed_days_total recomputed without this claim, so the same days become claimable again"
      - "CHARGE_BACK: subtracts credited_cents from Estate.refund_recovered_cents and releases the claimed interval; the ledger invariant refund_recovered_cents == SUM(credited_cents WHERE status == CREDITED) is restored exactly"
      - "increments the version of every mutated row by 1"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ACTION_ROLE_MISMATCH
      - ERR_CLAIM_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_PLATFORM_SCOPE_MISMATCH
      - ERR_ESTATE_CLOSED
      - ERR_INVALID_CLAIM_STATE
      - ERR_CREDIT_EXCEEDS_CLAIM

  # ---- ValuationRun --------------------------------------------------------
  - method: POST
    path: /estates/{estate_id}/valuation-runs
    description: >-
      Appraises every included asset on the chosen basis, rolls the values up into the gross and
      taxable digital estate with the tiered administration-expense cap, and rewrites every
      beneficiary's planned allocation. Guarded by OCC on the estate's version.
    roles: [Fiduciary]
    input: [basis, expected_estate_version]
    output: ValuationRun
    success_code: 201
    side_effects:
      - "every prior ValuationRun of the estate with status COMPUTED becomes SUPERSEDED"
      - "calculation asset_appraised_value writes appraised_value_cents and appraised_basis on every included asset"
      - "calculation estate_valuation_rollup writes included_asset_count, gross_value_cents, deduction_cap_cents, admin_deduction_cents and taxable_value_cents on the run and mirrors them onto the Estate"
      - "calculation beneficiary_allocation_plan rewrites BeneficiaryDesignation.planned_allocation_cents and the run's allocation_remainder_cents"
      - "Estate.undistributed_value_cents recomputed as gross minus the sum of received_value_cents"
      - "increments Estate.version by 1"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ESTATE_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_STALE_ESTATE_VERSION
      - ERR_ESTATE_CLOSED
      - ERR_VALUATION_ALREADY_FINALIZED
      - ERR_ALTERNATE_DATE_NOT_REACHED
      - ERR_SHARE_TOTAL_INVALID

  - method: GET
    path: /valuation-runs/{run_id}
    description: "Reads one valuation run with its full roll-up breakdown."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar]
    input: []
    output: ValuationRun
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_VALUATION_RUN_NOT_FOUND]

  - method: GET
    path: /valuation-runs
    description: "Lists valuation runs, filterable by estate and basis."
    roles: [EstateAdmin, Fiduciary, CourtRegistrar]
    input: ["estate_id?", "basis?", "status?", "limit?", "offset?"]
    output: ValuationRun[]
    success_code: 200
    side_effects: []
    errors: [ERR_MISSING_AUTH_HEADERS, ERR_UNKNOWN_ROLE, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /valuation-runs/{run_id}/transitions
    description: "Locks the estate tax position. FINALIZE is once per estate and is a precondition of closure."
    roles: [Fiduciary]
    input: [action, "finalization_note?"]
    output: ValuationRun
    success_code: 200
    side_effects:
      - "FINALIZE: status COMPUTED -> FINALIZED, stamps finalized_at"
      - "increments ValuationRun.version by 1"
    errors:
      - ERR_MISSING_AUTH_HEADERS
      - ERR_UNKNOWN_ROLE
      - ERR_ROLE_NOT_PERMITTED
      - ERR_INVALID_REQUEST
      - ERR_ACTION_ROLE_MISMATCH
      - ERR_VALUATION_RUN_NOT_FOUND
      - ERR_FIDUCIARY_ESTATE_MISMATCH
      - ERR_ESTATE_CLOSED
      - ERR_INVALID_RUN_STATE
      - ERR_VALUATION_ALREADY_FINALIZED

