      - name: non_fraud_zero_holdback
        claim_type: input_set_filtering
        grounds: [calculations.consumer_liability_holdback]
        distinguishing_aspect: "Non-fraud error claims (INCORRECT_AMOUNT) carry zero holdback regardless of delay: provisional credit equals the full claim."
