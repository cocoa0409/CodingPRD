              as: Vendor
              as_user_id: "${v_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po_id}/shipments"
              payload: { asn_number: "ASN-2", shipped_units: 400, carton_count: 16 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
