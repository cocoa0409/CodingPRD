scenario: |
  Craft Cidery & Orchard Fermentation (Northeast craft cidery): apple varietal
  blend & juice pressing schedule, fermentation tank allocation & yeast program,
  TTB/state alcohol licensing & excise reporting, packaging (can/bottle/keg) &
  label approval, tasting-room sales vs distribution split, orchard sourcing
  contract & harvest variability, aging/back-blending & product consistency,
  club/subscription fulfillment across states.

domain_name: craft-cidery
api_prefix: /cidery

# =============================================================================
# Complexity Profile (Step 0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - temporal_windowing
  entity_topology: hybrid            # license/contract tree + cross-cutting batch references
  state_machine_shape: compound      # multiple non-linear machines (cycle + branching) under aggregate posture
  relationship_patterns:
    - one_to_many
    - many_to_many                    # PressBatch <-> HarvestLot via BlendLine
    - cross_aggregate                 # PackagingRun references LabelApproval across aggregate
    - self_referential                # FermentationBatch back-blends into another FermentationBatch
  role_model: segregation_of_duties   # cellar vs compliance officer vs sales vs admin
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: OrchardContract
    parent: null
    common_fields: true
    fields:
      - { name: grower_name, type: string, source: input, description: "Orchard / grower legal name" }
      - { name: region_code, type: string, source: input, description: "Two-letter state code of orchard (NY, VT, MA, etc.)" }
      - { name: season_year, type: integer, source: input, description: "Harvest season this contract covers (e.g. 2026)" }
      - { name: committed_weight_lbs, type: integer, source: input, description: "Total pounds of apples the grower committed for the season" }
      - { name: received_weight_lbs, type: integer, source: computed, default: 0, description: "Cumulative received pounds across HarvestLots linked to this contract (only lots in RECEIVED or PRESSED state count)" }
      - { name: price_per_lb_cents, type: integer, source: input, description: "Negotiated price per pound in cents" }
      - { name: shortfall_penalty_cents_per_lb, type: integer, source: input, default: 0, description: "Penalty per pound under committed_weight_lbs at season close" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SETTLED | VOIDED" }

  - name: AppleVariety
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Unique varietal code (e.g. 'NORTHERN_SPY')" }
      - { name: tannin_g_per_l, type: number, source: input, description: "Typical tannin g/L at harvest" }
      - { name: brix_at_harvest, type: number, source: input, description: "Typical Brix sugar at harvest" }
      - { name: acidity_g_per_l, type: number, source: input, description: "Typical malic acid g/L at harvest" }
      - { name: is_bittersweet, type: boolean, source: input, default: false, description: "True if cider-specific bittersweet varietal" }

  - name: HarvestLot
    parent: OrchardContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> OrchardContract.id" }
      - { name: variety_id, type: string, source: input, description: "FK -> AppleVariety.id" }
      - { name: received_at, type: datetime, source: input, description: "Timestamp apples physically received at the presshouse" }
      - { name: weight_lbs, type: integer, source: input, description: "Delivered weight of this lot" }
      - { name: measured_brix, type: number, source: input, description: "Measured Brix at receipt (may differ from varietal typical)" }
      - { name: measured_tannin_g_per_l, type: number, source: input, description: "Measured tannin at receipt" }
      - { name: pressed_weight_lbs, type: integer, source: computed, default: 0, description: "Portion of this lot already pressed into PressBatches via BlendLine" }
      - { name: unpressed_weight_lbs, type: integer, source: computed, description: "= weight_lbs - pressed_weight_lbs" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> PARTIALLY_PRESSED -> PRESSED | SPOILED" }

  - name: PressBatch
    parent: null
    common_fields: true
    fields:
      - { name: scheduled_press_date, type: datetime, source: input, description: "Scheduled press datetime (UTC)" }
      - { name: press_window_minutes, type: integer, source: input, description: "Reserved press-line minutes for this batch (>=30, <=480)" }
      - { name: target_juice_liters, type: integer, source: computed, description: "Projected juice yield (sum of blend line contributions)" }
      - { name: actual_juice_liters, type: integer, source: input, description: "Measured juice yield after pressing (set on COMPLETE)" }
      - { name: press_yield_ratio, type: number, source: computed, description: "= actual_juice_liters / (sum of blend line weight_lbs * 0.5); set on COMPLETE" }
      - { name: blend_brix, type: number, source: computed, description: "Weighted average Brix across blend lines (by weight)" }
      - { name: blend_tannin, type: number, source: computed, description: "Weighted average tannin across blend lines" }
      - { name: status, type: enum, source: system, description: "PLANNED -> PRESSING -> COMPLETE | CANCELLED" }

  - name: BlendLine
    parent: PressBatch
    common_fields: false
    fields:
      - { name: press_batch_id, type: string, source: system, description: "FK -> PressBatch.id" }
      - { name: harvest_lot_id, type: string, source: input, description: "FK -> HarvestLot.id" }
      - { name: weight_lbs, type: integer, source: input, description: "Pounds of this lot allocated to the press batch" }
      - { name: position, type: integer, source: input, description: "Blend ordering (lower = milled first); used for tie-break" }

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Tank identifier (e.g. T-101)" }
      - { name: capacity_liters, type: integer, source: input, description: "Maximum working volume in liters" }
      - { name: material, type: enum, source: input, description: "STAINLESS | OAK | CONCRETE | PLASTIC" }
      - { name: temperature_controlled, type: boolean, source: input, default: false, description: "Whether the tank has glycol/temperature jacket" }
      - { name: status, type: enum, source: system, description: "EMPTY -> RESERVED -> FERMENTING -> AGING -> EMPTY; may also be CLEANING or MAINTENANCE" }
      - { name: current_batch_id, type: string, source: system, description: "FermentationBatch.id currently occupying this tank, or null" }

  - name: YeastProgram
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Yeast strain code (e.g. 'EC-1118', 'WILDFERM')" }
      - { name: kind, type: enum, source: input, description: "CULTURED | WILD | MIXED" }
      - { name: attenuation_pct, type: number, source: input, description: "Expected attenuation percent (e.g. 90 for 90%)" }
      - { name: temp_min_f, type: integer, source: input, description: "Minimum fermentation temperature in F" }
      - { name: temp_max_f, type: integer, source: input, description: "Maximum fermentation temperature in F" }
      - { name: nutrient_required, type: boolean, source: input, default: false, description: "Whether YAN nutrient addition is required" }

  - name: FermentationBatch
    parent: null
    common_fields: true
    fields:
      - { name: press_batch_id, type: string, source: input, description: "FK -> PressBatch.id supplying the juice" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id where fermentation occurs" }
      - { name: yeast_program_id, type: string, source: input, description: "FK -> YeastProgram.id applied" }
      - { name: started_at, type: datetime, source: system, description: "Timestamp when yeast pitched" }
      - { name: original_gravity_brix, type: number, source: computed, description: "Inherited from press_batch.blend_brix at pitch time" }
      - { name: current_gravity_brix, type: number, source: input, description: "Latest gravity reading (updated via POST .../readings)" }
      - { name: volume_liters, type: integer, source: computed, description: "Initial volume = press_batch.actual_juice_liters; mutated by transfers/blends" }
      - { name: abv_pct, type: number, source: computed, description: "(original_gravity_brix - current_gravity_brix) * 0.55, round_half_up to 0.1" }
      - { name: back_blend_source_batch_id, type: string, source: system, description: "FK -> FermentationBatch.id (self-referential) if this batch is a back-blend target" }
      - { name: back_blend_pct, type: number, source: system, description: "Percent of this batch's volume contributed by back_blend_source_batch_id (0 if not a blend)" }
      - { name: status, type: enum, source: system, description: "PITCHED -> FERMENTING -> AGING -> READY -> PACKAGED | DUMPED" }

  - name: CiderProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code (unique)" }
      - { name: name, type: string, source: input, description: "Product name (e.g. 'Orchard Reserve 2026')" }
      - { name: style, type: enum, source: input, description: "DRY | SEMI_DRY | SWEET | HOPPED | FRUIT_INFUSED" }
      - { name: target_abv_pct, type: number, source: input, description: "Labelled ABV; packaged batches must match within 0.3" }
      - { name: abv_tolerance_pct, type: number, source: input, default: 0.3, description: "Allowed deviation between packaged ABV and target_abv_pct" }
      - { name: vintage_year, type: integer, source: input, description: "Vintage year printed on label" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> RETIRED" }

  - name: LabelApproval
    parent: CiderProduct
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> CiderProduct.id" }
      - { name: market, type: enum, source: input, description: "FEDERAL_TTB | NY_SLA | VT_DLL | MA_ABCC — one approval per market" }
      - { name: application_number, type: string, source: input, description: "Regulator's application / COLA number" }
      - { name: submitted_at, type: datetime, source: system, description: "When application was filed" }
      - { name: approved_at, type: datetime, source: system, description: "When approval was granted (null until APPROVED)" }
      - { name: expires_at, type: datetime, source: input, description: "Approval expiry (TTB COLAs typically do not expire; some state labels do)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED | REJECTED | EXPIRED" }

  - name: LicensePermit
    parent: null
    common_fields: true
    fields:
      - { name: kind, type: enum, source: input, description: "TTB_BREWERS_NOTICE | NY_FARM_CIDERY | VT_MANUFACTURER | MA_FARMER_WINERY | INTERSTATE_SHIPPER" }
      - { name: license_number, type: string, source: input, description: "Issued license number" }
      - { name: issued_at, type: datetime, source: input, description: "When the license was issued" }
      - { name: expires_at, type: datetime, source: input, description: "License expiry timestamp" }
      - { name: scope_states, type: array, source: input, description: "Array of two-letter state codes this license authorizes (e.g. ['NY','VT'])" }
      - { name: annual_volume_cap_liters, type: integer, source: input, description: "Annual production/sales cap under this license (0 = uncapped)" }
      - { name: volume_used_liters, type: integer, source: computed, default: 0, description: "Cumulative packaged volume attributed to this license during the calendar year" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED -> REINSTATED; or ACTIVE -> EXPIRED" }

  - name: PackagingRun
    parent: CiderProduct
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> CiderProduct.id" }
      - { name: fermentation_batch_id, type: string, source: input, description: "FK -> FermentationBatch.id (must be status=READY)" }
      - { name: package_format, type: enum, source: input, description: "CAN_12OZ | CAN_16OZ | BOTTLE_500ML | BOTTLE_750ML | KEG_5GAL | KEG_15_5GAL" }
      - { name: units_produced, type: integer, source: computed, description: "Containers produced; computed from volume_liters and package format" }
      - { name: volume_liters, type: integer, source: input, description: "Volume drawn from the fermentation batch for this run" }
      - { name: label_approval_id, type: string, source: input, description: "FK -> LabelApproval.id (must be APPROVED for target market)" }
      - { name: license_id, type: string, source: input, description: "FK -> LicensePermit.id authorizing this packaging" }
      - { name: packaged_at, type: datetime, source: system, description: "When the run completed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | CANCELLED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: channel, type: enum, source: input, description: "TASTING_ROOM | CLUB_SUBSCRIPTION | WHOLESALE_DISTRIBUTION" }
      - { name: destination_state, type: string, source: input, description: "Two-letter state code of buyer / ship-to" }
      - { name: product_id, type: string, source: input, description: "FK -> CiderProduct.id" }
      - { name: packaging_run_id, type: string, source: input, description: "FK -> PackagingRun.id supplying inventory" }
      - { name: units, type: integer, source: input, description: "Number of containers sold (must be > 0)" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-container price in cents" }
      - { name: subtotal_cents, type: integer, source: computed, description: "units * unit_price_cents" }
      - { name: excise_tax_cents, type: integer, source: computed, description: "Excise owed on this order (see excise_tax calculation)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + excise_tax_cents" }
      - { name: shipped_at, type: datetime, source: system, description: "When the order shipped (null until SHIPPED)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CONFIRMED -> SHIPPED -> DELIVERED | CANCELLED | RETURNED" }

  - name: ExciseReport
    parent: null
    common_fields: true
    fields:
      - { name: period_year, type: integer, source: input, description: "Calendar year of report" }
      - { name: period_month, type: integer, source: input, description: "Calendar month 1-12" }
      - { name: regulator, type: enum, source: input, description: "TTB | NY_SLA | VT_DLL | MA_ABCC" }
      - { name: taxable_liters, type: integer, source: computed, description: "Total liters shipped in the period for which excise is owed" }
      - { name: taxable_cents, type: integer, source: computed, description: "Total excise cents owed (computed from SalesOrders in period)" }
      - { name: filed_at, type: datetime, source: system, description: "When the report was filed (null until FILED)" }
      - { name: status, type: enum, source: system, description: "OPEN -> FILED | AMENDED" }

  - name: ComplianceEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Name of entity that mutated" }
      - { name: entity_id, type: string, source: system, description: "ID of the entity mutated" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role header of the actor" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID header of the actor" }
      - { name: action, type: string, source: system, description: "Transition or endpoint action taken" }
      - { name: before_snapshot, type: object, source: system, description: "Pre-mutation field snapshot (subset relevant to the change)" }
      - { name: after_snapshot, type: object, source: system, description: "Post-mutation field snapshot" }
      - { name: event_at, type: datetime, source: system, description: "Server timestamp of the event" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OrchardContract
    initial_state: DRAFT
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cidery/contracts/{contractId}/activate"
        actor: OrchardManager
        preconditions:
          - "contract.committed_weight_lbs > 0"
          - "contract.season_year >= current_year (no back-dated activation)"
        side_effects:
          - "Emit ComplianceEvent(CONTRACT_ACTIVATED)"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /cidery/contracts/{contractId}/settle"
        actor: OrchardManager
        preconditions:
          - "All linked HarvestLots are in {PRESSED, SPOILED}"
          - "contract.status == ACTIVE"
        side_effects:
          - "Compute shortfall_penalty: max(0, committed_weight_lbs - received_weight_lbs) * shortfall_penalty_cents_per_lb"
          - "Emit ComplianceEvent(CONTRACT_SETTLED) including penalty"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /cidery/contracts/{contractId}/void"
        actor: OrchardManager
        preconditions:
          - "No HarvestLots linked"
        side_effects: []

  - entity: HarvestLot
    initial_state: RECEIVED
    terminal_states: [PRESSED, SPOILED]
    transitions:
      - from: RECEIVED
        to: PARTIALLY_PRESSED
        trigger: "system (auto when first BlendLine consumes from this lot)"
        actor: system
        preconditions: []
        side_effects:
          - "pressed_weight_lbs += blend_line.weight_lbs"
          - "OrchardContract.received_weight_lbs recomputed (still includes this lot)"
      - from: PARTIALLY_PRESSED
        to: PRESSED
        trigger: "system (auto when unpressed_weight_lbs reaches 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: PRESSED
        trigger: "system (auto when a single BlendLine consumes the entire lot)"
        actor: system
        preconditions: []
        side_effects:
          - "pressed_weight_lbs = weight_lbs"
      - from: RECEIVED
        to: SPOILED
        trigger: "POST /cidery/harvest-lots/{lotId}/spoil"
        actor: CellarLead
        preconditions:
          - "Lot is RECEIVED (no BlendLine has consumed)"
          - "Lot not referenced by any PressBatch in PLANNED/PRESSING"
        side_effects:
          - "OrchardContract.received_weight_lbs -= lot.weight_lbs (spoiled fruit does NOT count toward commitment)"
          - "Emit ComplianceEvent(LOT_SPOILED)"

  - entity: PressBatch
    initial_state: PLANNED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PLANNED
        to: PRESSING
        trigger: "POST /cidery/press-batches/{batchId}/start"
        actor: CellarLead
        preconditions:
          - "At least one BlendLine exists"
          - "All BlendLine HarvestLots are in {RECEIVED, PARTIALLY_PRESSED}"
          - "Sum of BlendLine.weight_lbs > 0"
          - "No other PressBatch in PRESSING whose press window overlaps this one (see press_window_overlap)"
        side_effects:
          - "For each BlendLine: harvest_lot.pressed_weight_lbs += weight_lbs; lot may auto-advance to PARTIALLY_PRESSED or PRESSED"
          - "Recompute each affected contract's received_weight_lbs"
      - from: PRESSING
        to: COMPLETE
        trigger: "POST /cidery/press-batches/{batchId}/complete"
        actor: CellarLead
        preconditions:
          - "actual_juice_liters provided and > 0"
        side_effects:
          - "press_yield_ratio = actual_juice_liters / (sum(BlendLine.weight_lbs) * 0.5)"
          - "blend_brix & blend_tannin locked in (weighted average by weight)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /cidery/press-batches/{batchId}/cancel"
        actor: CellarLead
        preconditions: []
        side_effects:
          - "Any BlendLines removed; lots unchanged (still RECEIVED)"
      - from: PRESSING
        to: PLANNED
        trigger: "POST /cidery/press-batches/{batchId}/pause"
        actor: CellarLead
        preconditions:
          - "Reason logged (equipment failure, weather, etc.)"
        side_effects:
          - "Pressed weight on each BlendLine's lot is reversed (pressed_weight_lbs -= weight_lbs)"
        note: "Cyclic loop PRESSING -> PLANNED -> PRESSING permits re-attempt"

  - entity: Tank
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: RESERVED
        trigger: "POST /cidery/tanks/{tankId}/reserve"
        actor: CellarLead
        preconditions:
          - "Tank.status == EMPTY"
        side_effects: []
      - from: RESERVED
        to: FERMENTING
        trigger: "POST /cidery/fermentation-batches (uses tank_id)"
        actor: CellarLead
        preconditions:
          - "Referenced PressBatch.status == COMPLETE"
          - "volume requested <= tank.capacity_liters"
        side_effects:
          - "Tank.current_batch_id = new FermentationBatch.id"
      - from: FERMENTING
        to: AGING
        trigger: "POST /cidery/fermentation-batches/{batchId}/age (when gravity reaches terminal)"
        actor: CellarLead
        preconditions:
          - "current_gravity_brix <= original_gravity_brix * (1 - yeast_program.attenuation_pct/100) + 0.5"
        side_effects: []
      - from: AGING
        to: EMPTY
        trigger: "POST /cidery/fermentation-batches/{batchId}/package (all volume drawn)"
        actor: CellarLead
        preconditions:
          - "FermentationBatch.volume_liters == 0 after packaging"
        side_effects:
          - "Tank.current_batch_id = null"
      - from: RESERVED
        to: EMPTY
        trigger: "POST /cidery/tanks/{tankId}/release"
        actor: CellarLead
        preconditions: []
        side_effects: []
      - from: FERMENTING
        to: EMPTY
        trigger: "POST /cidery/fermentation-batches/{batchId}/dump"
        actor: CellarLead
        preconditions:
          - "Reason logged"
        side_effects:
          - "FermentationBatch -> DUMPED; tank emptied; volume_liters -> 0"

  - entity: FermentationBatch
    initial_state: PITCHED
    terminal_states: [PACKAGED, DUMPED]
    transitions:
      - from: PITCHED
        to: FERMENTING
        trigger: "system (auto when first gravity reading < original_gravity_brix)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FERMENTING
        to: AGING
        trigger: "POST /cidery/fermentation-batches/{batchId}/age"
        actor: CellarLead
        preconditions:
          - "current_gravity_brix <= original_gravity_brix * (1 - yeast_program.attenuation_pct/100) + 0.5"
        side_effects:
          - "Tank.status: FERMENTING -> AGING"
      - from: AGING
        to: READY
        trigger: "POST /cidery/fermentation-batches/{batchId}/ready"
        actor: CellarLead
        preconditions:
          - "Aging duration >= 14 days"
        side_effects: []
      - from: READY
        to: PACKAGED
        trigger: "POST /cidery/packaging-runs (with fermentation_batch_id = this) when batch.volume_liters == 0"
        actor: PackagingOperator
        preconditions:
          - "Cumulative packaged volume across PackagingRuns == original volume"
        side_effects:
          - "Tank.status -> EMPTY; Tank.current_batch_id = null"
      - from: PITCHED
        to: DUMPED
        trigger: "POST /cidery/fermentation-batches/{batchId}/dump"
        actor: CellarLead
        preconditions: []
        side_effects:
          - "Tank -> EMPTY; volume_liters -> 0"
      - from: FERMENTING
        to: DUMPED
        trigger: "POST /cidery/fermentation-batches/{batchId}/dump"
        actor: CellarLead
        preconditions: []
        side_effects:
          - "Tank -> EMPTY; volume_liters -> 0"
      - from: AGING
        to: DUMPED
        trigger: "POST /cidery/fermentation-batches/{batchId}/dump"
        actor: CellarLead
        preconditions: []
        side_effects:
          - "Tank -> EMPTY; volume_liters -> 0"

  - entity: CiderProduct
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cidery/products/{productId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "At least one LabelApproval in APPROVED for FEDERAL_TTB"
          - "target_abv_pct in (0.5, 8.5] (cider tax class)"
        side_effects:
          - "Emit ComplianceEvent(PRODUCT_ACTIVATED)"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /cidery/products/{productId}/retire"
        actor: ComplianceOfficer
        preconditions:
          - "No PackagingRun in SCHEDULED for this product"
          - "No SalesOrder in {DRAFT, CONFIRMED} for this product"
        side_effects: []
      - from: RETIRED
        to: ACTIVE
        trigger: "POST /cidery/products/{productId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "LabelApproval still APPROVED and not expired"
        side_effects: []
        note: "Cyclic RETIRED -> ACTIVE permits re-issue"

  - entity: LabelApproval
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cidery/label-approvals/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "application_number non-empty"
        side_effects:
          - "approved_at = now"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /cidery/label-approvals/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (auto when now > expires_at AND market != FEDERAL_TTB)"
        actor: system
        preconditions: []
        side_effects:
          - "Any SCHEDULED PackagingRuns referencing this approval are CANCELLED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /cidery/label-approvals/{id}/resubmit"
        actor: ComplianceOfficer
        preconditions:
          - "application_number updated"
        side_effects: []
        note: "Cyclic SUBMITTED -> REJECTED -> SUBMITTED for resubmission"

  - entity: LicensePermit
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cidery/licenses/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Blocks any new PackagingRun or interstate SalesOrder referencing this license"
      - from: SUSPENDED
        to: REINSTATED
        trigger: "POST /cidery/licenses/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: REINSTATED
        to: ACTIVE
        trigger: "system (auto at next ops run)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (auto when now > expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks all operations referencing this license"
      - from: REINSTATED
        to: SUSPENDED
        trigger: "POST /cidery/licenses/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: PackagingRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cidery/packaging-runs/{id}/complete"
        actor: PackagingOperator
        preconditions:
          - "FermentationBatch.status == READY"
          - "FermentationBatch.volume_liters >= this.volume_liters"
          - "LabelApproval.status == APPROVED for the run's market"
          - "LicensePermit.status == ACTIVE AND annual_volume_cap not exceeded"
          - "| batch.abv_pct - product.target_abv_pct | <= product.abv_tolerance_pct"
        side_effects:
          - "FermentationBatch.volume_liters -= this.volume_liters"
          - "LicensePermit.volume_used_liters += this.volume_liters"
          - "units_produced computed from volume / format"
          - "If batch.volume_liters reaches 0: batch -> PACKAGED; tank -> EMPTY"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cidery/packaging-runs/{id}/cancel"
        actor: PackagingOperator
        preconditions: []
        side_effects: []

  - entity: SalesOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED, RETURNED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /cidery/orders/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "PackagingRun.status == COMPLETED"
          - "PackagingRun.units_produced - sum(prior SHIPPED/DELIVERED orders on this run) >= this.units"
          - "If channel == CLUB_SUBSCRIPTION or WHOLESALE_DISTRIBUTION: a LicensePermit in ACTIVE whose scope_states includes destination_state exists"
          - "LabelApproval for (product, destination_state's regulator market) is APPROVED"
        side_effects:
          - "Compute excise_tax_cents via excise_tax calculation"
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /cidery/orders/{id}/ship"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "shipped_at = now"
          - "Contributes to current-period ExciseReport.taxable_liters / taxable_cents (chronological accumulation)"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /cidery/orders/{id}/deliver"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: RETURNED
        trigger: "POST /cidery/orders/{id}/return"
        actor: SalesRep
        preconditions:
          - "Returned within 30 days of shipped_at"
        side_effects:
          - "If ExciseReport for shipped period is OPEN: subtract this order's excise from taxable_cents"
          - "If ExciseReport is FILED: emit ComplianceEvent(LATE_RETURN) for amendment"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /cidery/orders/{id}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /cidery/orders/{id}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects: []

  - entity: ExciseReport
    initial_state: OPEN
    terminal_states: [FILED, AMENDED]
    transitions:
      - from: OPEN
        to: FILED
        trigger: "POST /cidery/excise-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "now >= period close (end of period_month)"
        side_effects:
          - "filed_at = now"
          - "Emit ComplianceEvent(REPORT_FILED)"
      - from: FILED
        to: AMENDED
        trigger: "POST /cidery/excise-reports/{id}/amend"
        actor: ComplianceOfficer
        preconditions:
          - "Amendment reason logged"
          - "Recomputed taxable_cents attached"
        side_effects:
          - "Emit ComplianceEvent(REPORT_AMENDED) with delta"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: contract-activate-stale-version
    parent_entity: OrchardContract
    write_endpoint: "POST /cidery/contracts/{contractId}/activate"
    occ_field: "expected_contract_version"
    description: |
      Activating an OrchardContract whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      OrchardManager has just edited the committed_weight_lbs (which bumps
      version) and the current writer's view of the contract is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: packaging-complete-stale-batch
    parent_entity: FermentationBatch
    write_endpoint: "POST /cidery/packaging-runs/{id}/complete"
    occ_field: "expected_batch_version"
    description: |
      Completing a PackagingRun against a FermentationBatch whose version has
      advanced since the client last observed it is rejected. Captures the
      case where another operator has just drawn volume from the same batch
      (which bumps version) and the current writer's volume check is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: blend_brix_weighted
    trigger: "PressBatch transitions PRESSING -> COMPLETE"
    algorithm: weighted_scoring
    formula: |
      blend_brix = sum(line.weight_lbs * line.harvest_lot.measured_brix for line in BlendLines)
                   / sum(line.weight_lbs for line in BlendLines)
      blend_tannin likewise with measured_tannin_g_per_l
    input_set: "All BlendLines on this PressBatch; only lots whose status ∈ {PARTIALLY_PRESSED, PRESSED} after start"
    precision: "2 decimal places, round_half_up"

  - name: press_yield_ratio
    trigger: "PressBatch COMPLETE"
    algorithm: threshold
    formula: |
      ratio = actual_juice_liters / (total_blend_weight_lbs * 0.5)
      if ratio < 0.55 or ratio > 0.85:
        flag batch for review (still completes; emit ComplianceEvent(YIELD_ANOMALY))
    constants:
      LITERS_PER_LB_THEORETICAL: 0.5
      YIELD_LOW: 0.55
      YIELD_HIGH: 0.85
    precision: "3 decimal places, round_half_up"

  - name: abv_from_gravity
    trigger: "FermentationBatch.current_gravity_brix update AND at packaging time"
    algorithm: forward_looking
    formula: |
      abv_pct = (original_gravity_brix - current_gravity_brix) * 0.55
      round_half_up to 0.1
    variants:
      - name: provisional
        when: "In-flight during FERMENTING; uses latest reading"
        difference: "Uses current_gravity_brix (latest input)"
      - name: final
        when: "At PackagingRun COMPLETED"
        difference: "Recomputed from final gravity reading at packaging time; may differ from provisional"

  - name: contract_shortfall_penalty
    trigger: "OrchardContract settle"
    algorithm: tiered_pricing
    formula: |
      received = sum(lot.weight_lbs for lot in HarvestLots
                     where lot.contract_id == this.id and lot.status in {PRESSED, PARTIALLY_PRESSED})
      # SPOILED lots do NOT count
      shortfall_lbs = max(0, committed_weight_lbs - received)
      # Tiered: first 10% of commitment is free, next 20% at 1x penalty, remainder at 2x
      free_allowance_lbs = floor(committed_weight_lbs * 0.10)
      tier1_lbs = floor(committed_weight_lbs * 0.20)
      if shortfall_lbs <= free_allowance_lbs:
        penalty_cents = 0
      else:
        remaining = shortfall_lbs - free_allowance_lbs
        t1 = min(remaining, tier1_lbs)
        t2 = remaining - t1
        penalty_cents = t1 * shortfall_penalty_cents_per_lb + t2 * (2 * shortfall_penalty_cents_per_lb)
    input_set: "HarvestLots of this contract in {PRESSED, PARTIALLY_PRESSED} (SPOILED excluded)"
    constants:
      FREE_ALLOWANCE_PCT: 0.10
      TIER1_PCT: 0.20
      TIER2_MULTIPLIER: 2
    precision: "integer cents, floor at each tier boundary"
    variants:
      - name: provisional
        when: "Quoted at any time pre-settle for preview"
        difference: "Uses current received_weight_lbs (computed field)"
      - name: final
        when: "On POST /settle; persists to settlement record"
        difference: "Uses locked received_weight_lbs at moment of settle; subsequent lot transitions cannot change it"

  - name: excise_tax
    trigger: "SalesOrder confirm AND ExciseReport file"
    algorithm: tiered_pricing
    formula: |
      # Federal TTB cider rate tiers (per liter, in cents)
      # Hard cider <= 8.5% ABV: 22.6 cents/L
      # > 8.5% ABV: reclassified as apple wine (out of scope here — we only produce <= 8.5%)
      # Per-order: liters = units * unit_liters(package_format)
      # Round per line THEN sum (per-line rounding pinned; do NOT sum then round)
      unit_liters = case package_format:
        CAN_12OZ    -> 0.355
        CAN_16OZ    -> 0.473
        BOTTLE_500ML -> 0.500
        BOTTLE_750ML -> 0.750
        KEG_5GAL    -> 18.927
        KEG_15_5GAL -> 58.674
      line_liters = units * unit_liters
      line_excise_cents = round_half_up(line_liters * 22.6)
      order_excise_cents = line_excise_cents  # single line per order
      # Period aggregation: sum across SHIPPED/DELIVERED orders, each already rounded
      period_excise_cents = sum(order.excise_tax_cents for order in SalesOrders
                                where order.status in {SHIPPED, DELIVERED}
                                and year(order.shipped_at) == period_year
                                and month(order.shipped_at) == period_month)
    input_set: "SalesOrders in {SHIPPED, DELIVERED} whose shipped_at falls inside [period_start, period_end) (half-open)"
    constants:
      FEDERAL_CIDER_RATE_CENTS_PER_LITER: 22.6
    precision: "Round per-line first (round_half_up to integer cents), THEN sum"
    variants:
      - name: tasting_room
        when: "channel == TASTING_ROOM"
        difference: "Same federal rate, but tasting-room sales may have additional state on-premise tax (modeled as flat 4% on subtotal for NY)"
      - name: interstate
        when: "channel == WHOLESALE_DISTRIBUTION or CLUB_SUBSCRIPTION shipped across state lines"
        difference: "Federal rate applies; destination-state excise assumed reciprocal via INTERSTATE_SHIPPER permit"

  - name: license_volume_cap_check
    trigger: "PackagingRun COMPLETED (before LicensePermit.volume_used_liters updated)"
    algorithm: threshold
    formula: |
      if license.annual_volume_cap_liters == 0: pass
      projected = license.volume_used_liters + packaging_run.volume_liters
      if projected > license.annual_volume_cap_liters:
        reject with ERR_LICENSE_CAP_EXCEEDED
      # Boundary: equality allowed (>= vs > pinned: rejection only when strictly greater)
    precision: "integer liters"

  - name: abv_consistency_check
    trigger: "PackagingRun COMPLETED"
    algorithm: threshold
    formula: |
      if abs(batch.abv_pct - product.target_abv_pct) > product.abv_tolerance_pct:
        reject with ERR_ABV_OUT_OF_TOLERANCE
      # Boundary: equality passes (> vs >= pinned)

  - name: press_window_overlap
    trigger: "PressBatch PLANNED -> PRESSING"
    algorithm: interval_merge
    formula: |
      # Half-open interval [start, end)
      this_start = batch.scheduled_press_date
      this_end   = this_start + batch.press_window_minutes minutes
      conflict = any other PressBatch b in PRESSING where
                 b.scheduled_press_date < this_end AND
                 (b.scheduled_press_date + b.press_window_minutes minutes) > this_start
      # Adjacent windows (this_start == other_end OR this_end == other_start) do NOT conflict
      if conflict: reject with ERR_PRESS_WINDOW_CONFLICT

  - name: tank_allocation_selector
    trigger: "FermentationBatch create"
    algorithm: waterfall_allocation
    formula: |
      # Eligibility: status == EMPTY OR RESERVED, temperature_controlled required
      #   if yeast_program.temp_min_f < 55 OR temp_max_f > 75
      # Rank by: (1) smallest capacity_liters >= requested volume (best-fit),
      #          (2) temperature_controlled desc,
      #          (3) created_at ASC (earliest-added tank wins on tie)
      # Fallback: if no tank qualifies, ERR_NO_TANK_AVAILABLE
      candidates = [t for t in Tank
                    where t.status in {EMPTY, RESERVED}
                      and t.capacity_liters >= volume
                      and (not temp_critical or t.temperature_controlled)]
      sort by: (capacity_liters ASC, temperature_controlled DESC, created_at ASC)
      pick first; if empty -> ERR_NO_TANK_AVAILABLE

  - name: packaging_units_from_volume
    trigger: "PackagingRun create"
    algorithm: aggregation
    formula: |
      units_produced = floor(volume_liters / unit_liters(package_format))
      leftover_liters = volume_liters - units_produced * unit_liters
      if leftover_liters > 0.1:
        emit ComplianceEvent(PACKAGING_LEFTOVER) — still completes
    precision: "integer units; floor"

  - name: excise_report_aggregation
    trigger: "ExciseReport file (and on every order ship while report is OPEN)"
    algorithm: chronological
    formula: |
      # Recompute by chronologically replaying SHIPPED events in [period_start, period_end)
      # Tie-break on identical shipped_at: order created_at ASC (never id)
      # Late RETURNED orders in same period subtract their excise_tax_cents
      orders = [o for o in SalesOrder
                where o.shipped_at in [period_start, period_end)
                  and o.status in {SHIPPED, DELIVERED, RETURNED}]
      sort by (shipped_at ASC, created_at ASC)
      taxable_cents = sum(o.excise_tax_cents if o.status != RETURNED else -o.excise_tax_cents
                          for o in orders)
      taxable_liters = sum(o.units * unit_liters(o.package_format) if o.status != RETURNED
                           else -o.units * unit_liters(o.package_format)
                           for o in orders)

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in declared role set; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-template IDs resolve to existing resources (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "All body-supplied FK references (variety_id, lot_id, tank_id, product_id, etc.) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target resource in correct state for the requested action"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: same X-User-ID cannot both create a PackagingRun AND complete it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cidery/packaging-runs/{id}/complete"

  - priority: 7
    category: business_safety
    check: "License status gate: referenced LicensePermit.status == ACTIVE"
    error_id: ERR_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cidery/packaging-runs, POST /cidery/orders (interstate)"

  - priority: 8
    category: business_safety
    check: "Label approval gate: LabelApproval.status == APPROVED for (product, market)"
    error_id: ERR_LABEL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cidery/packaging-runs, POST /cidery/orders/confirm"

  - priority: 9
    category: business_safety
    check: "Label approval not expired for non-FEDERAL markets"
    error_id: ERR_LABEL_EXPIRED
    http_status: 409
    applies_to: "POST /cidery/packaging-runs, POST /cidery/orders/confirm"

  - priority: 10
    category: business_temporal
    check: "Press window does not overlap another PRESSING batch (half-open interval)"
    error_id: ERR_PRESS_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /cidery/press-batches/{id}/start"

  - priority: 11
    category: business_temporal
    check: "License/label expiry in future relative to action timestamp"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST /cidery/packaging-runs, POST /cidery/orders (interstate)"

  - priority: 12
    category: business_temporal
    check: "SalesOrder return within 30 days of shipped_at"
    error_id: ERR_RETURN_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /cidery/orders/{id}/return"

  - priority: 13
    category: business_constraint
    check: "Tank allocation: capacity sufficient; temperature_controlled when yeast requires"
    error_id: ERR_NO_TANK_AVAILABLE
    http_status: 409
    applies_to: "POST /cidery/fermentation-batches"

  - priority: 14
    category: business_constraint
    check: "ABV consistency within tolerance for packaging"
    error_id: ERR_ABV_OUT_OF_TOLERANCE
    http_status: 409
    applies_to: "POST /cidery/packaging-runs/{id}/complete"

  - priority: 15
    category: business_constraint
    check: "BlendLine weights do not exceed HarvestLot.unpressed_weight_lbs"
    error_id: ERR_INSUFFICIENT_FRUIT
    http_status: 409
    applies_to: "POST /cidery/press-batches, POST /cidery/press-batches/{id}/blend-lines"

  - priority: 16
    category: business_referential
    check: "FermentationBatch referenced by PackagingRun has status == READY"
    error_id: ERR_BATCH_NOT_READY
    http_status: 409
    applies_to: "POST /cidery/packaging-runs"

  - priority: 17
    category: business_referential
    check: "FermentationBatch has sufficient volume_liters for the run"
    error_id: ERR_INSUFFICIENT_VOLUME
    http_status: 409
    applies_to: "POST /cidery/packaging-runs"

  - priority: 18
    category: business_fiscal
    check: "License annual volume cap not exceeded by this packaging"
    error_id: ERR_LICENSE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /cidery/packaging-runs"

  - priority: 19
    category: business_fiscal
    check: "Order units available in PackagingRun (units_produced - already-shipped)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /cidery/orders/{id}/confirm"

  - priority: 20
    category: business_fiscal
    check: "Settlement precondition: contract has all lots terminal"
    error_id: ERR_CONTRACT_HAS_OPEN_LOTS
    http_status: 409
    applies_to: "POST /cidery/contracts/{id}/settle"

  - priority: 21
    category: business_fiscal
    check: "ExciseReport period closed before file"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /cidery/excise-reports/{id}/file"

  - priority: 22
    category: business_fiscal
    check: "Unique (period_year, period_month, regulator) — no duplicate OPEN reports"
    error_id: ERR_DUPLICATE_REPORT
    http_status: 409
    applies_to: "POST /cidery/excise-reports"

  - priority: 23
    category: business_constraint
    check: "Unique sku across CiderProduct"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /cidery/products"

  - priority: 24
    category: business_constraint
    check: "Unique (product_id, market) across LabelApproval"
    error_id: ERR_DUPLICATE_LABEL_MARKET
    http_status: 409
    applies_to: "POST /cidery/products/{id}/label-approvals"

  - priority: 25
    category: state
    check: "OCC: expected_<parent>_version matches current entity.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cidery/contracts/{id}/activate, POST /cidery/packaging-runs/{id}/complete"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/cidery/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Server default time before any call is 2026-05-01T00:00:00Z; never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["Logical clock advanced"]

  # --- AppleVariety (reference) ---
  - method: POST
    path: "/cidery/varieties"
    description: "Create an apple variety reference record"
    roles: [OrchardManager]
    code: 201
    input: [code, tannin_g_per_l, brix_at_harvest, acidity_g_per_l, "is_bittersweet?"]
    output: AppleVariety
    side_effects: []

  - method: GET
    path: "/cidery/varieties/{varietyId}"
    description: "Get a variety"
    roles: [OrchardManager, CellarLead, ComplianceOfficer, SalesRep, PackagingOperator, PlatformAdmin]
    code: 200
    input: []
    output: AppleVariety
    side_effects: []

  - method: GET
    path: "/cidery/varieties"
    description: "List varieties"
    roles: [OrchardManager, CellarLead, ComplianceOfficer, SalesRep, PackagingOperator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AppleVariety[]"
    side_effects: []

  # --- YeastProgram (reference) ---
  - method: POST
    path: "/cidery/yeast-programs"
    description: "Create a yeast program reference"
    roles: [CellarLead]
    code: 201
    input: [code, kind, attenuation_pct, temp_min_f, temp_max_f, "nutrient_required?"]
    output: YeastProgram
    side_effects: []

  - method: GET
    path: "/cidery/yeast-programs/{id}"
    description: "Get yeast program"
    roles: [CellarLead, ComplianceOfficer, PackagingOperator, PlatformAdmin]
    code: 200
    input: []
    output: YeastProgram
    side_effects: []

  - method: GET
    path: "/cidery/yeast-programs"
    description: "List yeast programs"
