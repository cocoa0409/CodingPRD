# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the called endpoint's §1.5 roles"
  - id: ERR_PSYCH_NOT_OWNER
    http: 403
    condition: "A SchoolPsychologist acts on an Evaluation whose psychologist_id differs from X-User-ID (testing-start, scores, report-draft, exclusion claim)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The reviewing X-User-ID equals Evaluation.report_drafted_by_psychologist_id on report-review"

  # --- request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unknown enum value, negative quantity, end instant not after start instant, end_date before start_date, empty/duplicated requested_domains, or prior_evaluation_id present/absent inconsistently with referral_type"

  # --- existence
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "school_id in a path or body does not resolve to a School"
  - id: ERR_PSYCHOLOGIST_NOT_FOUND
    http: 404
    condition: "psychologist_id in a path or body (including an element of assigned_school_ids' owner or a seat holder) does not resolve to a Psychologist"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral_id in a path does not resolve to a Referral"
  - id: ERR_EVALUATION_NOT_FOUND
    http: 404
    condition: "evaluation_id in a path or body does not resolve to an Evaluation"
  - id: ERR_INSTRUMENT_NOT_FOUND
    http: 404
    condition: "instrument_id in a path or body does not resolve to an AssessmentInstrument"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "seat_id does not resolve to a ScoringLicenseSeat of the instrument in the path"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order_id does not resolve to a ProtocolOrder"
  - id: ERR_EXCLUSION_NOT_FOUND
    http: 404
    condition: "exclusion_id does not resolve to a TimelineExclusion"
  - id: ERR_MEETING_NOT_FOUND
    http: 404
    condition: "meeting_id does not resolve to an EligibilityMeeting"
  - id: ERR_BREACH_NOT_FOUND
    http: 404
    condition: "breach_id does not resolve to a TimelineBreach"

  # --- concurrency
  - id: ERR_STALE_EVALUATION_VERSION
    http: 412
    condition: "expected_evaluation_version does not equal the Evaluation's current version on assign or eligibility-meeting creation (§1.2.1)"

  # --- state
  - id: ERR_EVALUATION_STATE_INVALID
    http: 409
    condition: "Evaluation.assessment_status does not permit the requested step (e.g. testing-start from PENDING_ASSIGNMENT, scores from ASSIGNED, report-review from SCORED, any step on a CANCELLED evaluation)"
  - id: ERR_REFERRAL_STATE_INVALID
    http: 409
    condition: "A consent event is not permitted from the Referral's current status (e.g. CONSENT_RECEIVED twice, any event after CONSENT_WITHDRAWN or COMPLETED)"
  - id: ERR_EXCLUSION_ALREADY_DECIDED
    http: 409
    condition: "A decision is submitted for a TimelineExclusion whose status is already APPROVED or REJECTED"
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "decision on a ProtocolOrder that is not SUBMITTED, or receive on an order that is not APPROVED"
  - id: ERR_MEETING_STATE_INVALID
    http: 409
    condition: "notice from a status other than PROPOSED/RESCHEDULE_REQUESTED, reschedule-request or hold from a status other than NOTICED, or any action on a SUPERSEDED/CANCELLED/HELD meeting"
  - id: ERR_BREACH_STATE_INVALID
    http: 409
    condition: "propose-remedy on a TimelineBreach that is not DETECTED, or approve-remedy on one that is not REMEDY_PROPOSED (including VACATED)"
  - id: ERR_SEAT_STATE_INVALID
    http: 409
    condition: "release on a ScoringLicenseSeat that is already RELEASED"
  - id: ERR_PSYCHOLOGIST_STATE_INVALID
    http: 409
    condition: "leave on a Psychologist already ON_LEAVE, or assignment targeting a Psychologist whose status is ON_LEAVE"
  - id: ERR_CONSENT_NOT_ON_FILE
    http: 409
    condition: "Evaluation work or an exclusion claim is attempted while the parent Referral.status is not in {CONSENTED, CONSENT_WAIVED}"
  - id: ERR_REPORT_NOT_FINAL
    http: 409
    condition: "hold is attempted while the meeting's Evaluation.assessment_status is not REPORT_FINAL"
  - id: ERR_INTERPRETER_SESSION_MISSING
    http: 409
    condition: "testing-start on an Evaluation with interpreter_required == true and no InterpreterSession in status SCHEDULED or COMPLETED"
  - id: ERR_MEETING_NOT_DUE
    http: 409
    condition: "hold is attempted while the current logical clock is before scheduled_start_at"

  # --- licensing, credentialing and coverage
  - id: ERR_SCORING_LICENSE_INVALID
    http: 422
    condition: "testing-start where the instrument's license_status is EXPIRED or the acting psychologist holds no ASSIGNED ScoringLicenseSeat for that instrument"
  - id: ERR_LICENSE_SEATS_EXHAUSTED
    http: 409
    condition: "Seat assignment when license_seats_free == 0, or when the psychologist already holds an ASSIGNED seat for the instrument"
  - id: ERR_PSYCH_BUILDING_MISMATCH
    http: 422
    condition: "Explicit assignment to a Psychologist whose assigned_school_ids does not contain the referral's school_id"
  - id: ERR_LANGUAGE_CERT_MISSING
    http: 422
    condition: "Explicit assignment for a bilingual-required referral to a Psychologist not certified in the referral's primary_language"
  - id: ERR_INTERN_SCOPE_VIOLATION
    http: 422
    condition: "Explicit assignment of an INITIAL evaluation to a Psychologist with credential_type == INTERN"
  - id: ERR_PSYCH_CASELOAD_OVER_CAP
    http: 409
    condition: "Explicit assignment where target.open_case_points + evaluation.caseload_points would exceed target.weekly_capacity_points"
  - id: ERR_NO_ELIGIBLE_PSYCHOLOGIST
    http: 409
    condition: "Selector-mode assignment (psychologist_id omitted) where the eligibility filter of calculations.psychologist_assignment_rank_score leaves an empty candidate pool"

  # --- scheduling and notice
  - id: ERR_PSYCH_CALENDAR_CONFLICT
    http: 409
    condition: "A new InterpreterSession overlaps an existing SCHEDULED/COMPLETED session of the same psychologist under half-open semantics, including the TRAVEL_BUFFER_MINUTES buffer for a different building"
  - id: ERR_SCHOOL_MEETING_CAPACITY_FULL
    http: 409
    condition: "The requested meeting interval (closed) overlaps concurrent_meeting_capacity non-terminal meetings already booked at that School"
  - id: ERR_NOTICE_LEAD_INSUFFICIENT
    http: 422
    condition: "notice issued fewer than PARENT_NOTICE_LEAD_DAYS calendar days before scheduled_start_at"
  - id: ERR_RESCHEDULE_LIMIT_REACHED
    http: 409
    condition: "reschedule-request on a meeting whose reschedule_count already equals MAX_RESCHEDULES"

  # --- consent and clock integrity
  - id: ERR_CONSENT_TIMESTAMP_FUTURE
    http: 422
    condition: "A consent event's effective_at is after the current logical clock instant"
  - id: ERR_WAIVER_NOT_APPLICABLE
    http: 422
    condition: "event_type == CONSENT_WAIVED on an INITIAL referral, or without a non-empty waiver_reason"
  - id: ERR_EXCLUSION_ZERO_DAYS
    http: 422
    condition: "APPROVE decision where calculations.exclusion_day_credit yields days_credited == 0 (window entirely outside the statutory window, or the per-type cap already consumed)"
  - id: ERR_DUPLICATE_BUILDING_CODE
    http: 409
    condition: "School creation with a building_code already used by another School"

  # --- fiscal and inventory
  - id: ERR_PROTOCOL_STOCK_INSUFFICIENT
    http: 409
    condition: "testing-start where protocol_stock_count < protocol_units_per_administration * len(evaluation_domains)"
  - id: ERR_RECEIPT_QUANTITY_EXCEEDS_ORDER
    http: 422
    condition: "receive with received_quantity < 1 or greater than quantity_requested"
  - id: ERR_REMEDY_MINUTES_EXCEED_CAP
    http: 422
    condition: "propose-remedy where basis minutes + additional_minutes exceeds REMEDY_MINUTES_CAP"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "District intake desk: files referrals, records consent-to-evaluate events, books interpreter support, proposes eligibility meetings and issues parent notices."
    identity: "opaque"
    exclusive_operations:
      - "POST /psych-services/referrals"
      - "POST /psych-services/referrals/{referral_id}/consent-events"
      - "POST /psych-services/eligibility-meetings/{meeting_id}/notice"
      - "POST /psych-services/eligibility-meetings/{meeting_id}/reschedule-request"
    shared_operations:
      - "POST /psych-services/interpreter-sessions (with PsychServicesSupervisor)"
      - "POST /psych-services/eligibility-meetings (with PsychServicesSupervisor)"
      - "POST /_clock/set_current_utc"
      - "all GET reads except the licensing and protocol-order sub-resource lists"

  - name: SchoolPsychologist
    description: "Assigned evaluator: administers testing, records scores, drafts reports, peer-reviews another psychologist's draft and claims timeline exclusions on their own cases."
    identity: "entity_backed:Psychologist"
    exclusive_operations:
      - "POST /psych-services/evaluations/{evaluation_id}/testing-start"
      - "POST /psych-services/evaluations/{evaluation_id}/scores"
      - "POST /psych-services/evaluations/{evaluation_id}/report-draft"
      - "POST /psych-services/timeline-exclusions"
    shared_operations:
      - "POST /psych-services/evaluations/{evaluation_id}/report-review (with PsychServicesSupervisor; never on their own draft)"
      - "POST /_clock/set_current_utc"
      - "GET reads of evaluations, referrals, meetings, exclusions, sessions and breaches"

  - name: PsychServicesSupervisor
    description: "Psychological services supervisor: routes caseloads, decides exclusion claims, books protocol orders and records that eligibility meetings were held."
    identity: "opaque"
    exclusive_operations:
      - "POST /psych-services/evaluations/{evaluation_id}/assign"
      - "POST /psych-services/timeline-exclusions/{exclusion_id}/decision"
      - "POST /psych-services/eligibility-meetings/{meeting_id}/hold"
    shared_operations:
      - "POST /psych-services/protocol-orders and /receive (with DistrictAdmin)"
      - "POST /psych-services/assessment-instruments/{instrument_id}/license-seats and .../release (with DistrictAdmin)"
      - "POST /psych-services/interpreter-sessions, POST /psych-services/eligibility-meetings (with IntakeCoordinator)"
      - "POST /psych-services/evaluations/{evaluation_id}/report-review (with SchoolPsychologist)"
      - "POST /_clock/set_current_utc"
      - "all GET reads"

  - name: ComplianceOfficer
    description: "Timeline-compliance officer: runs the district compliance sweep and proposes compensatory remedies and corrective action, but may never approve them."
    identity: "opaque"
    exclusive_operations:
      - "POST /psych-services/timeline-breaches/{breach_id}/propose-remedy"
    shared_operations:
      - "POST /psych-services/compliance-runs (with DistrictAdmin)"
      - "POST /_clock/set_current_utc"
      - "all GET reads"

  - name: DistrictAdmin
    description: "District administration: owns reference data (buildings, psychologists, instruments, licence seats), approves protocol orders, and is the only role that may approve a compensatory remedy or place a psychologist on leave."
    identity: "opaque"
    exclusive_operations:
      - "POST /psych-services/schools"
      - "POST /psych-services/psychologists"
      - "POST /psych-services/psychologists/{psychologist_id}/leave"
      - "POST /psych-services/assessment-instruments"
      - "POST /psych-services/protocol-orders/{order_id}/decision"
      - "POST /psych-services/timeline-breaches/{breach_id}/approve-remedy"
    shared_operations:
      - "POST /psych-services/protocol-orders and /receive (with PsychServicesSupervisor)"
      - "POST /psych-services/assessment-instruments/{instrument_id}/license-seats and .../release (with PsychServicesSupervisor)"
      - "POST /psych-services/compliance-runs (with ComplianceOfficer)"
      - "POST /_clock/set_current_utc"
      - "all GET reads"
