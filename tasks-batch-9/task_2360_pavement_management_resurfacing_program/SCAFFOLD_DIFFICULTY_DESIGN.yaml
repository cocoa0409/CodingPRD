  # resource_temporal_overlap
  - rule_id: resource_temporal_overlap
    instances:
      - name: segment_work_windows_half_open_touching_allowed_overlap_rejected
        grounds: ["validations[priority=70]", "errors[ERR_SEGMENT_WINDOW_CONFLICT]", "entities.ProjectSegment.fields.work_window_start", "entities.ProjectSegment.fields.work_window_end", "concurrency_rules[project-segment-add-stale-project]"]
        distinguishing_aspect: "Two lines compete for the same NetworkSegment: a second line starting 2026-09-14 while the first still runs to 2026-09-15 is rejected with ERR_SEGMENT_WINDOW_CONFLICT, while the same line starting exactly 2026-09-15 — the instant the first window ends — is accepted, pinning the work window as HALF-OPEN so touching endpoints do not collide."
        test_recipe:
          setup:
