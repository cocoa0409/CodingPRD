      - name: booking_foreign_keys_are_validated_in_the_declared_order
        claim_type: foreign_key_validation
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=6]
          - validations[priority=17].ERR_CATEGORY_NOT_ON_SAILING
          - validations[priority=17].ERR_GROUP_BLOCK_MISMATCH
        distinguishing_aspect: |
          On a flat topology every reference is a body foreign key, and §1.4 pins the order in
          which they are resolved: sailing_id, then cabin_category_id, then guest_id. A payload
          with two unstored ids therefore reports the FIRST in that order. Beyond mere existence,
          priority 17 adds cross-reference integrity: a stored category with no allotment on this
          sailing is ERR_CATEGORY_NOT_ON_SAILING, which is 422 rather than 404 because the row
          does exist.
        test_recipe:
          setup:
            - "Sailing AUR-2701 OPEN_FOR_SALE with an IA allotment and the 365..120 IA fare window."
            - "A second category OV exists but has NO allotment on AUR-2701."
