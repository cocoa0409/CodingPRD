        distinguishing_aspect: "One recall walked end to end trips six different guards in order: ship-return before notification is a step-order 409, a notification cannot be acknowledged before it is SENT or by a patient who does not own it, credit above the frozen expectation is a 422, closure is blocked while any notification is unresolved even after the money reconciles, and the officer who opened the recall may not be the one who closes it."
