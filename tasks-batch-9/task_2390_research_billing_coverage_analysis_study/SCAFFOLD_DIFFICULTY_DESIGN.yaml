      - name: industry_indirect_tier_boundary_at_500000_subtotal
        grounds: "§1.3 calculations.study_effective_indirect_rate with INDUSTRY_TIER_THRESHOLD_CENTS 500000 and INDUSTRY_SMALL_STUDY_SURCHARGE_PCT 3.0; §1.5 POST /research-billing/studies/{id}/budget-build."
        distinguishing_aspect: "Metric: per-patient subtotal in cents (a third distinct metric, on a third distinct endpoint). At exactly 500000 the study is NOT small, so the requested 20.0 stands and the budget is 600000; one cent below, the surcharge lifts the rate to 23.0 and the budget rises to 614999. The boundary therefore makes the budget non-monotonic in the subtotal - a smaller grid produces a larger total - which no naive implementation reproduces by accident."
        test_recipe:
          setup:
            - "Two INDUSTRY_SPONSORED studies with identical requested indirect_rate_pct 20.0. Study S's approved analysis carries one sponsor PER_PATIENT item at 499999 cents times one occurrence, so its subtotal lands one cent below the tier; it is built first as the control. Study T's analysis carries one item at 250000 cents times two occurrences, landing exactly on 500000, and its build is the trigger."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-S", title: "Tier control", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000017" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_s_id: "$.data.id", study_s_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_s_id}", expected_study_version: "${study_s_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_s_id: "$.data.id", analysis_s_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_s_id}", expected_coverage_analysis_version: "${analysis_s_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 600000, negotiated_unit_cents: 499999, units_per_occurrence: 1, expected_occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_s_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_s_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_s_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_s_v2: "$.data.version" }
            - call: "POST /research-billing/studies/${study_s_id}/budget-build"
              payload: { source_analysis_id: "${analysis_s_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 20.0, expected_study_version: "${study_s_v2}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { control_subtotal: "$.data.per_patient_subtotal_cents", control_rate: "$.data.effective_indirect_rate_pct", control_budget: "$.data.per_patient_budget_cents" }
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-T", title: "Tier boundary", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000018" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_t_id: "$.data.id", study_t_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_t_id}", expected_study_version: "${study_t_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_t_id: "$.data.id", analysis_t_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_t_id}", expected_coverage_analysis_version: "${analysis_t_v1}", item_code: "J9999", description: "Investigational infusion", classification: "RESEARCH_PAID", medicare_coverage_basis: "NOT_COVERED", budget_category: "PER_PATIENT", charge_master_unit_cents: 300000, negotiated_unit_cents: 250000, units_per_occurrence: 1, expected_occurrences: 2 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_t_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_t_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "GET /research-billing/studies/${study_t_id}"
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_t_v2: "$.data.version" }
          trigger:
            - call: "POST /research-billing/studies/${study_t_id}/budget-build"
              payload: { source_analysis_id: "${analysis_t_id}", basis: "COVERAGE_DRIVEN", indirect_rate_pct: 20.0, expected_study_version: "${study_t_v2}" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
          assert:
            - "setup control (one cent below the tier): control_subtotal == 499999, control_rate == 23.0 (min(20.0 + 3.0, 32.0)), control_budget == 614999 (499999 + round_half_up(114999.77))"
            - "trigger response 200 with per_patient_subtotal_cents == 500000, exactly INDUSTRY_TIER_THRESHOLD_CENTS"
            - "trigger response effective_indirect_rate_pct == 20.0 - the surcharge is NOT applied at the threshold, because the comparison is `>= threshold`"
            - "trigger response per_patient_budget_cents == 600000 (500000 + round_half_up(100000.0))"
            - "the boundary is non-monotonic: study T's larger 500000 subtotal yields a SMALLER budget (600000) than study S's 499999 subtotal (614999)"

  # =========================================================================
  # RULE 7 - cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payer_routing_requires_study_qct_state_not_charge_state
        grounds: "§1.2 Charge RT-1 precondition `study.billing_hold_posture == OPEN`; §1.3 calculations.study_billing_hold_posture clause 3 (qct_determination IN {UNDETERMINED, NON_QUALIFYING} -> PAYER_BLOCKED); §1.4 priority 23 and §1.6 ERR_PAYER_BILLING_BLOCKED_NO_QCT."
        distinguishing_aspect: "Entity pair (Charge, Study). The charge is in a perfectly legal state (UNROUTED, matched to a ROUTINE_CARE item on the effective analysis, decision agreeing with the coverage expectation) and is refused purely because of a field on a different entity. The dependency is one-directional and asymmetric: the same posture that blocks CLEAR_TO_PAYER still permits HOLD_FOR_SPONSOR, so this is not a blanket freeze but a payer-side gate derived from the study's Medicare determination."
        test_recipe:
          setup:
            - "One INDUSTRY_SPONSORED study left at qct_determination UNDETERMINED (no determination recorded), with an approved analysis whose 80053 item is ROUTINE_CARE / STANDARD_OF_CARE, and one 9000-cent interface charge for 80053 in routing_state UNROUTED."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-U", title: "QCT gate probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000019" }
              as: ResearchBillingManager
              as_user_id: "mgr_1"
              captures: { study_id: "$.data.id", study_v1: "$.data.version", posture_at_creation: "$.data.billing_hold_posture" }
            - call: "POST /research-billing/coverage-analyses"
              payload: { study_id: "${study_id}", expected_study_version: "${study_v1}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { analysis_id: "$.data.id", analysis_v1: "$.data.version" }
            - call: "POST /research-billing/coverage-items"
              payload: { coverage_analysis_id: "${analysis_id}", expected_coverage_analysis_version: "${analysis_v1}", item_code: "80053", description: "Comprehensive metabolic panel", classification: "ROUTINE_CARE", medicare_coverage_basis: "STANDARD_OF_CARE", budget_category: "PER_PATIENT", charge_master_unit_cents: 9000, negotiated_unit_cents: 9000, units_per_occurrence: 1, expected_occurrences: 3 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/submit"
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/coverage-analyses/${analysis_id}/approve"
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "80053", service_date: "2026-08-01", amount_cents: 9000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_id: "$.data.id", expected_target: "$.data.expected_routing_target" }
          trigger:
            - call: "POST /research-billing/charges/${charge_id}/review"
              payload: { decision: "CLEAR_TO_PAYER" }
              as: ComplianceReviewer
              as_user_id: "reviewer_1"
              captures: { observed_error: "$.data.error_id" }
          assert:
            - "setup: posture_at_creation == \"PAYER_BLOCKED\" and expected_target == \"PAYER\" - the charge agrees with coverage, so the refusal cannot come from ERR_ROUTING_CONTRADICTS_COVERAGE"
            - "trigger response 409 with error_id == \"ERR_PAYER_BILLING_BLOCKED_NO_QCT\""
            - "GET /research-billing/charges/${charge_id} still shows routing_state \"UNROUTED\", billing_state \"UNBILLED\", reviewed_by_user_id null"
            - "the same charge reviewed HOLD_FOR_SPONSOR with override_justification \"Sponsor has agreed to absorb pending the determination\" DOES succeed under the identical posture, proving the gate is payer-specific"
            - "after POST /research-billing/studies/${study_id}/qct-determination with basis DEEMED_IND_IDE the study's billing_hold_posture becomes \"OPEN\" and a second 80053 charge reviews CLEAR_TO_PAYER successfully - the charge entity never changed, only the study's determination did"

      - name: visit_completion_blocked_by_superseded_calendar_generation
        grounds: "§1.2 SubjectVisit SCHEDULED -> OCCURRED precondition on the owning calendar still being the PUBLISHED generation; §1.2 StudyCalendar publish side effect retiring earlier generations; §1.4 priority 14 and §1.6 ERR_STALE_CALENDAR_GENERATION; §1.1 StudySubject.consented_calendar_generation."
        distinguishing_aspect: "Entity pair (SubjectVisit, StudyCalendar) - a different pair. Nothing about the subject visit changes: it is SCHEDULED, in window, its subject is CONSENTED and its pinned generation matches. It becomes uncompletable because a THIRD party published calendar generation 2, which retired generation 1 underneath it. The pinning is what makes this detectable at all - without the snapshot the system could not tell that the visit was scheduled against a generation that no longer drives the EHR."
        test_recipe:
          setup:
            - "One study open to accrual with calendar generation 1 PUBLISHED, one subject consented on 2026-09-01 (pinning generation 1) and one visit scheduled for 2026-09-02. A second calendar generation is then built from the same approved analysis and published, which retires generation 1."
          setup_api_calls:
            - call: "POST /research-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ResearchBillingManager
            - call: "POST /research-billing/studies"
              payload: { protocol_number: "AMC-2390-V", title: "Generation pinning probe", sponsor_name: "Northgate Therapeutics", funding_source: "INDUSTRY_SPONSORED", ind_ide_status: "IND_HELD", therapeutic_intent: true, registry_number: "NCT10000020" }
