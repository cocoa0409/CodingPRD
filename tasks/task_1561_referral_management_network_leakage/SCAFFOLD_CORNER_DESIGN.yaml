            - { call: "POST /network-participations", payload: { specialist_id: "${s2}", insurance_plan_id: "${plan1}", tier: "PREFERRED", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NetworkAdmin }
            - { call: "POST /referring-providers", payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }, as: NetworkAdmin, captures: { pa: $.data.id } }
            - { call: "POST /patients", payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }, as: NetworkAdmin, captures: { pt1: $.data.id } }
            - { call: "POST /referrals", payload: { patient_id: "${pt1}", specialty: "CARDIOLOGY", diagnosis_code: "I10", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${pa}", captures: { r: $.data.id } }
            - { call: "POST /referrals/${r}/accept", as: ReferralCoordinator }
