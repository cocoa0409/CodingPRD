              as_user_id: "judge-1"
            - call: "POST /gc/care-plans"
              payload: { case_id: "${case_id}", residence_type: "HOME", visitation_min_per_month: 4, window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-06-01T00:00:00Z" }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { cp1: $.data.id }
            - call: "POST /gc/care-plans/${cp1}/activate"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
            - call: "POST /gc/care-plans"
              payload: { case_id: "${case_id}", residence_type: "ASSISTED_LIVING", visitation_min_per_month: 2, window_start_iso: "2026-05-01T00:00:00Z", window_end_iso: "2026-09-01T00:00:00Z" }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { cp_overlap: $.data.id }
            - call: "POST /gc/care-plans"
              payload: { case_id: "${case_id}", residence_type: "ASSISTED_LIVING", visitation_min_per_month: 2, window_start_iso: "2026-06-01T00:00:00Z", window_end_iso: "2026-09-01T00:00:00Z" }
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { cp_adjacent: $.data.id }
          trigger:
            - call: "POST /gc/care-plans/${cp_overlap}/activate"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { err: $.data.error_id }
