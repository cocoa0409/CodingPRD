  - rule_id: boundary_precision_check
    instances:

      - name: cancellation_notice_72_hour_boundary
        grounds:
          - calculations.cancellation_fee
          - state_machines.RentalContract.PENDING_MOBILIZATION_to_CANCELLED
          - calculations.invoice_total_rollup
          - entities.RentalContract.fields.cancellation_fee_cents
        distinguishing_aspect: |
          Two byte-identical EVENT contracts whose installs are both scheduled for
          2026-08-24T09:00:00Z are cancelled one hour apart across the 72-hour free
          window: at exactly 72 hours of notice (clock 2026-08-21T09:00:00Z) the fee
          is 0 and NO CANCELLATION invoice is created, and at 71 hours (clock
          2026-08-21T10:00:00Z) the fee is 78750 with an invoice of 78750 / tax 7009
          / total 85759. The boundary itself is free, so a `>` versus `>=` slip or a
          day-granularity notice computation flips exactly one of the two answers.
