- rule_id: transitive_cascade
  instances:
  - name: revision_second_hop_raises_unmatched_deposit_exception
    grounds:
    - state_machines.BankStatement.transitions.DISCREPANCY_to_SUPERSEDED
    - calculations.reconciliation_variance
    - calculations.deposit_attribution
    - entities.ExceptionItem.fields.kind
