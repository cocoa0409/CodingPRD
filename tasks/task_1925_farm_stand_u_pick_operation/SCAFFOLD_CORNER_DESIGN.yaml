  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_derived_fields_same_request
        claim_type: immediate_consistency
        grounds: [calculations.payment_status_derive, calculations.weigh_out_total, entities.HarvestLine.fields.net_oz]
        distinguishing_aspect: "Every mutation's derived fields are visible in the SAME response and in the immediately following read: the payment POST settles inline; the harvest-line POST returns computed net_oz and line_charge_cents; the follow-up GET of the field shows the bumped tally."
        test_recipe:
          setup: ["full weekday base; session FIELD_ACTIVE (admission 1450 paid at gate)"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager }
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry", price_per_lb_cents: 480 }, as: FarmManager, captures: { crop_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 4, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id, vs_charge: $.data.admission_charge_cents } }
            - { call: "POST /farm/payments", payload: { session_id: "${vs_id}", kind: "CHARGE", method: "CASH", amount_cents: 1450, idempotency_key: "k1" }, as: GateStaff, captures: { pay_status: $.data.status } }
            - { call: "POST /farm/visit-sessions/${vs_id}/enter-field", payload: {}, as: FieldStaff }
          trigger:
            - { call: "POST /farm/harvest-lines", payload: { session_id: "${vs_id}", crop_id: "${crop_id}", gross_weight_oz: 36, container_count: 4 }, as: FieldStaff, captures: { ln_net: $.data.net_oz, ln_tare: $.data.tare_oz, ln_charge: $.data.line_charge_cents, ln_status: $.data.status } }
            - { call: "GET /farm/fields/${f_id}", payload: {}, as: FarmManager, captures: { f_committed: $.data.committed_picked_oz } }
            - { call: "GET /farm/visit-sessions/${vs_id}", payload: {}, as: FarmManager, captures: { vs_paid: $.data.total_paid_cents, vs_payst: $.data.payment_status } }
          assert:
            - "POST /farm/payments responded with status == SETTLED inline (CASH settles in-request)"
