# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0546_foundation_repair — 9 rules x 2 instances = 18 instances
# All formula-derived asserts are pre-computed literals (contract item 7).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_estimate_vs_job_final_pricing
        grounds:
          - calculations.pier_pricing
          - calculations.financing_total
          - entities.Quote.fields.total_cents
          - entities.Job.fields.final_total_cents
          - state_machines.Job.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "The estimate variant prices Quote.total_cents from scope.pier_count=8 (=1847790) while the final variant prices Job.final_total_cents from piers_installed=9 (=2066951); the two Order/Job-domain numbers diverge for the same scope."
        test_recipe:
          setup:
            - "Lead in NORTH; completed inspection soil EXPANSIVE; ENGINEERED scope pier_count=8, depth 18ft (tier2 165000), access MODERATE, anchor 2; quote PLAN_12 SENT then ACCEPTED; job permit-approved, scheduled, started."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "A Owner", property_address: "1 Oak St", contact_email: "a@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "EXPANSIVE", crack_severity: 2, max_crack_width_mm: 3.0, settlement_inches: 1.0 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 2, avg_pier_depth_ft: 18, access_difficulty: "MODERATE", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "PLAN_12" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent, captures: { q_total: "$.data.total_cents" } }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/jobs?quote_id=${quote_id}", payload: {}, as: OpsCoordinator, captures: { job_id: "$.data[0].id" } }
            - { call: "POST /foundation/permits", payload: { job_id: "${job_id}", permit_type: "STANDARD" }, as: OpsCoordinator, captures: { permit_id: "$.data.id" } }
            - { call: "POST /foundation/permits/${permit_id}/decide", payload: { decision: "APPROVE" }, as: OpsCoordinator }
            - { call: "POST /foundation/crews", payload: { crew_name: "Crew N", region_code: "NORTH" }, as: Admin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /foundation/jobs/${job_id}/schedule", payload: { crew_id: "${crew_id}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/start", payload: {}, as: OpsCoordinator }
          trigger:
            - { call: "POST /foundation/jobs/${job_id}/complete", payload: { piers_installed: 9, adjustment_inches: 1.0 }, as: OpsCoordinator, captures: { j_final: "$.data.final_total_cents" } }
          assert:
            - "Quote.${quote_id}.total_cents == 1847790"
            - "Job.${job_id}.final_total_cents == 2066951"
            - "Quote.${quote_id}.total_cents != Job.${job_id}.final_total_cents"

      - name: claim_settlement_full_vs_prorated
        grounds:
          - calculations.claim_settlement
          - entities.Claim.fields.settlement_cents
          - entities.Claim.fields.coverage_variant
          - state_machines.MaintenanceVisit.SCHEDULED_to_MISSED
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "On the Claim domain (distinct from the Quote/Job pricing above), one MISSED annual visit switches coverage from FULL (450000) to PRORATED (405000 = round(450000*0.90)) for identical reported_settlement_inches=1.5."
        test_recipe:
          setup:
            - "Completed install produces an ACTIVE warranty and an auto MaintenanceVisit at 2027-05-01; clock advanced to 2027-06-01 and that visit marked MISSED (missed=1); a claim filed with reported_settlement_inches=1.5 and moved to UNDER_REVIEW."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "B Owner", property_address: "2 Elm St", contact_email: "b@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/jobs?quote_id=${quote_id}", payload: {}, as: OpsCoordinator, captures: { job_id: "$.data[0].id" } }
            - { call: "POST /foundation/permits", payload: { job_id: "${job_id}", permit_type: "STANDARD" }, as: OpsCoordinator, captures: { permit_id: "$.data.id" } }
            - { call: "POST /foundation/permits/${permit_id}/decide", payload: { decision: "APPROVE" }, as: OpsCoordinator }
            - { call: "POST /foundation/crews", payload: { crew_name: "Crew N", region_code: "NORTH" }, as: Admin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /foundation/jobs/${job_id}/schedule", payload: { crew_id: "${crew_id}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/start", payload: {}, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/complete", payload: { piers_installed: 8, adjustment_inches: 1.0 }, as: OpsCoordinator }
            - { call: "GET /foundation/warranties?job_id=${job_id}", payload: {}, as: OpsCoordinator, captures: { warranty_id: "$.data[0].id" } }
            - { call: "GET /foundation/maintenance-visits?warranty_id=${warranty_id}", payload: {}, as: OpsCoordinator, captures: { visit_id: "$.data[0].id" } }
            - { call: "POST /foundation/_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: Admin }
            - { call: "POST /foundation/maintenance-visits/${visit_id}/mark-missed", payload: {}, as: OpsCoordinator }
            - { call: "POST /foundation/claims", payload: { warranty_id: "${warranty_id}", description: "New settlement observed", reported_settlement_inches: 1.5 }, as: Customer, as_user_id: "${lead_id}", captures: { claim_id: "$.data.id" } }
            - { call: "POST /foundation/claims/${claim_id}/review", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /foundation/claims/${claim_id}/approve", payload: {}, as: ClaimsAdjuster, captures: { s_cents: "$.data.settlement_cents" } }
          assert:
            - "Claim.${claim_id}.coverage_variant == PRORATED"
            - "Claim.${claim_id}.settlement_cents == 405000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pier_pricing_nonlinear_multi_input
        grounds:
          - calculations.pier_pricing
          - entities.EngineeringScope.fields.avg_pier_depth_ft
          - entities.EngineeringScope.fields.access_difficulty
          - state_machines.Quote.DRAFT_to_SENT
        distinguishing_aspect: "Mode (a): per_pier = round(depth_tier(26)=210000 * SOIL_MULT[UNSTABLE]=1.30 * ACCESS_MULT[HARD]=1.25) = 341250 — a >=3-input non-linear product of tier x soil x access; subtotal 12*341250 = 4095000."
        test_recipe:
          setup:
            - "ENGINEERED scope with pier_count=12, depth 26ft (tier3), soil UNSTABLE, access HARD, anchor 0; CASH quote in DRAFT."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "C Owner", property_address: "3 Pine St", contact_email: "c@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "UNSTABLE", crack_severity: 4, max_crack_width_mm: 8.0, settlement_inches: 2.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 12, anchor_count: 0, avg_pier_depth_ft: 26, access_difficulty: "HARD", supplemental_engineering: true, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
          trigger:
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent, captures: { sub: "$.data.subtotal_cents", tot: "$.data.total_cents" } }
          assert:
            - "Quote.${quote_id}.subtotal_cents == 4095000"
            - "Quote.${quote_id}.total_cents == 3890250"

      - name: financing_total_pinned_evaluation_order
        grounds:
          - calculations.financing_total
          - entities.Quote.fields.financing_fee_cents
          - entities.Quote.fields.total_cents
          - state_machines.Quote.DRAFT_to_SENT
        distinguishing_aspect: "Mode (c): circular-looking dependency pinned — volume_discount is keyed on gross_subtotal 4095000 (>=2000000 -> 204750), fee is computed on financed_principal 3890250 (NOT on total), giving fee=round(3890250*0.12)=466830 and total=4357080."
        test_recipe:
          setup:
            - "Same UNSTABLE/HARD depth-26 scope pier_count=12 anchor 0, but financing_plan PLAN_60; quote in DRAFT."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "D Owner", property_address: "4 Fir St", contact_email: "d@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "UNSTABLE", crack_severity: 4, max_crack_width_mm: 8.0, settlement_inches: 2.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 12, anchor_count: 0, avg_pier_depth_ft: 26, access_difficulty: "HARD", supplemental_engineering: true, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "PLAN_60" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
          trigger:
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent, captures: { fee: "$.data.financing_fee_cents", tot: "$.data.total_cents" } }
          assert:
            - "Quote.${quote_id}.financing_fee_cents == 466830"
            - "Quote.${quote_id}.total_cents == 4357080"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_sent_revised_sent
        grounds:
          - state_machines.Quote.SENT_to_REVISED
          - state_machines.Quote.REVISED_to_SENT
          - entities.Quote.fields.status
        distinguishing_aspect: "Quote traverses the SENT->REVISED->SENT cycle (a revision loop) and returns to SENT — a cyclic shape, not a linear pipeline."
        test_recipe:
          setup:
            - "A SENT quote on an ENGINEERED scope."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "E Owner", property_address: "5 Ash St", contact_email: "e@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
          trigger:
            - { call: "POST /foundation/quotes/${quote_id}/revise", payload: { financing_plan: "PLAN_12" }, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
          assert:
            - "Quote.${quote_id}.status == SENT"

      - name: job_parallel_permit_vs_fulfillment
        grounds:
          - entities.Job.fields.fulfillment_status
          - entities.Job.fields.permit_status
          - state_machines.Permit.PENDING_to_APPROVED
        distinguishing_aspect: "On the Job entity the permit_status dimension advances NOT_STARTED->PENDING->APPROVED while the fulfillment_status dimension stays UNSCHEDULED — two independent state axes on one row."
        test_recipe:
          setup:
            - "An accepted quote produced a Job (UNSCHEDULED, permit NOT_STARTED)."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "F Owner", property_address: "6 Bay St", contact_email: "f@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/jobs?quote_id=${quote_id}", payload: {}, as: OpsCoordinator, captures: { job_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /foundation/permits", payload: { job_id: "${job_id}", permit_type: "STANDARD" }, as: OpsCoordinator, captures: { permit_id: "$.data.id" } }
            - { call: "POST /foundation/permits/${permit_id}/decide", payload: { decision: "APPROVE" }, as: OpsCoordinator }
          assert:
            - "Job.${job_id}.permit_status == APPROVED"
            - "Job.${job_id}.fulfillment_status == UNSCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: install_complete_warranty_visit_leadcounter_depth3
        grounds:
          - state_machines.Job.IN_PROGRESS_to_COMPLETED
          - entities.Warranty.fields.status
          - entities.MaintenanceVisit.fields.status
          - entities.Lead.fields.active_visit_count
        distinguishing_aspect: "Depth-3 chain from job complete: Job->Warranty(ACTIVE) [hop1] whose activation creates MaintenanceVisit(SCHEDULED) [hop2] whose creation increments Lead.active_visit_count to 1 [hop3]; each link is caused by the prior link."
        test_recipe:
          setup:
            - "Install job IN_PROGRESS on a NORTH lead with approved permit and matching crew."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "G Owner", property_address: "7 Cove St", contact_email: "g@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
            - { call: "GET /foundation/jobs?quote_id=${quote_id}", payload: {}, as: OpsCoordinator, captures: { job_id: "$.data[0].id" } }
            - { call: "POST /foundation/permits", payload: { job_id: "${job_id}", permit_type: "STANDARD" }, as: OpsCoordinator, captures: { permit_id: "$.data.id" } }
            - { call: "POST /foundation/permits/${permit_id}/decide", payload: { decision: "APPROVE" }, as: OpsCoordinator }
            - { call: "POST /foundation/crews", payload: { crew_name: "Crew N", region_code: "NORTH" }, as: Admin, captures: { crew_id: "$.data.id" } }
            - { call: "POST /foundation/jobs/${job_id}/schedule", payload: { crew_id: "${crew_id}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }, as: OpsCoordinator }
            - { call: "POST /foundation/jobs/${job_id}/start", payload: {}, as: OpsCoordinator }
          trigger:
            - { call: "POST /foundation/jobs/${job_id}/complete", payload: { piers_installed: 8, adjustment_inches: 1.0 }, as: OpsCoordinator }
            - { call: "GET /foundation/warranties?job_id=${job_id}", payload: {}, as: OpsCoordinator, captures: { warranty_id: "$.data[0].id" } }
          assert:
            - "Warranty.${warranty_id}.status == ACTIVE"
            - "count(MaintenanceVisit where warranty_id==${warranty_id} and status==SCHEDULED) == 1"
            - "Lead.${lead_id}.active_visit_count == 1"

      - name: claim_approve_remediation_warrantycount_depth2
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Claim.fields.remediation_job_id
          - entities.Warranty.fields.remediation_count
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (claim approve): Claim->remediation Job(create) [hop1] whose creation increments Warranty.remediation_count to 1 [hop2]."
        test_recipe:
          setup:
            - "ACTIVE warranty from a completed install; a claim FILED then moved to UNDER_REVIEW."
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "H Owner", property_address: "8 Reef St", contact_email: "h@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
            - { call: "POST /foundation/inspections", payload: { lead_id: "${lead_id}", scheduled_at: "2026-05-02T09:00:00Z" }, as: SalesAgent, captures: { insp_id: "$.data.id" } }
            - { call: "POST /foundation/inspections/${insp_id}/complete", payload: { soil_class: "STABLE", crack_severity: 1, max_crack_width_mm: 2.0, settlement_inches: 0.5 }, as: FieldEngineer }
            - { call: "POST /foundation/scopes", payload: { lead_id: "${lead_id}", inspection_id: "${insp_id}", pier_count: 8, anchor_count: 0, avg_pier_depth_ft: 18, access_difficulty: "EASY", supplemental_engineering: false, expected_lead_version: "${lead_v}" }, as: FieldEngineer, captures: { scope_id: "$.data.id" } }
            - { call: "POST /foundation/scopes/${scope_id}/finalize", payload: {}, as: FieldEngineer }
            - { call: "POST /foundation/quotes", payload: { lead_id: "${lead_id}", scope_id: "${scope_id}", financing_plan: "CASH" }, as: SalesAgent, captures: { quote_id: "$.data.id" } }
            - { call: "POST /foundation/quotes/${quote_id}/send", payload: {}, as: SalesAgent }
            - { call: "POST /foundation/quotes/${quote_id}/accept", payload: {}, as: Customer, as_user_id: "${lead_id}" }
