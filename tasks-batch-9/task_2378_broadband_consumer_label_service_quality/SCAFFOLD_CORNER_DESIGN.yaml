            - "e2 == ERR_INQUIRY_FILINGS_INCOMPLETE (409): close is only legal from RESPONSE_COMPLETE"
            - "the RESOLUTION_REPORT filing succeeds after the complaint reaches DISMISSED, moving the docket RECEIVED -> EVIDENCE_ASSEMBLY with resolution_report_filed_at == 2026-09-01T00:00:00.000Z"
            - "e3 == ERR_INQUIRY_FILINGS_INCOMPLETE (409): one branch alone never satisfies the join, so the docket is stuck in EVIDENCE_ASSEMBLY"
            - "RegulatorInquiry.${inq_id}.filed_late is still false — filed_late is only computed at the join"

      - name: fee_itemization_incomplete_blocks_publish
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FEE_ITEMIZATION_INCOMPLETE
          - calculations.label_monthly_itemization
          - endpoints.PATCH_service_plans_id
        distinguishing_aspect: "An INTRO_ONLY monthly fee on a plan with no introductory price is disclosable nowhere, so publication is refused until a PATCH creates the intro phase that gives the line a home — the fix is a plan amendment, not a label edit."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan NOINTRO (advertised 300/140, monthly 7999, intro_price_cents null, ETF 0, discount_program_eligible false, required_locales [en-US])."
            - "One FeeLineItem: PROMO_EQUIP 1000, MONTHLY_RECURRING, FIXED, applies_during INTRO_ONLY."
            - "PUBLISHED MTH-2026-A, MeasurementProbe PRB-N, one INCLUDED run with the six reference samples, one CERTIFIED PEAK_HOUR_MEDIAN attestation (240.00 / 115.00 / 42)."
            - "One DRAFT LabelVersion with a VERIFIED en-US translation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "NOINTRO", display_name: "Fiber 300 no promotion", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 0, required_locales: ["en-US"], discount_program_eligible: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_n_id: $.data.id }
            - call: "POST /service-plans/${plan_n_id}/fee-line-items"
              payload: { fee_code: "PROMO_EQUIP", description: "Promotional equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1000, applies_during: "INTRO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
            - call: "POST /methodology-documents/${doc_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-N", market_code: "US-TX-DAL", panel_size: 50, max_concurrent_windows: 1 }
              as: NetworkEngineer
              captures: { probe_n_id: $.data.id }
            - call: "POST /test-runs"
              payload: { probe_id: "${probe_n_id}", plan_id: "${plan_n_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:10:00Z", download_mbps: 210, upload_mbps: 100, latency_ms: 42}, {observed_at: "2026-08-04T21:30:00Z", download_mbps: 238, upload_mbps: 112, latency_ms: 24}, {observed_at: "2026-08-05T20:40:00Z", download_mbps: 242, upload_mbps: 118, latency_ms: 22}, {observed_at: "2026-08-08T19:45:00Z", download_mbps: 290, upload_mbps: 130, latency_ms: 18}, {observed_at: "2026-08-05T14:30:00Z", download_mbps: 295, upload_mbps: 145, latency_ms: 14}, {observed_at: "2026-08-06T02:40:00Z", download_mbps: 306, upload_mbps: 155, latency_ms: 55} ] }
              as: NetworkEngineer
              captures: { run_n_id: $.data.id }
            - call: "GET /service-plans/${plan_n_id}"
              payload: {}
              as: NetworkEngineer
              captures: { pn1: $.data.version }
            - call: "POST /performance-attestations"
              payload: { plan_id: "${plan_n_id}", methodology_doc_id: "${doc_id}", metric_variant: "PEAK_HOUR_MEDIAN", expected_plan_version: "${pn1}" }
              as: NetworkEngineer
              captures: { att_n_id: $.data.id }
            - call: "POST /performance-attestations/${att_n_id}/certify"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /service-plans/${plan_n_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { pn2: $.data.version }
            - call: "POST /label-versions"
              payload: { plan_id: "${plan_n_id}", effective_from: "2026-09-01T00:00:00Z", accessibility_conformance: "WCAG_AA", expected_plan_version: "${pn2}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lvn_id: $.data.id }
            - call: "POST /label-versions/${lvn_id}/translations"
              payload: { locale: "en-US", translated_summary: "Fiber 300 no-promotion label" }
              as: LocalizationSpecialist
              as_user_id: "loc-1"
              captures: { trn_id: $.data.id }
            - call: "POST /label-versions/${lvn_id}/translations/${trn_id}/verify"
              payload: {}
              as: LocalizationSpecialist
              as_user_id: "loc-2"
          trigger:
            - call: "POST /label-versions/${lvn_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { e1: $.data.error_id }
            - call: "PATCH /service-plans/${plan_n_id}"
              payload: { change_justification: "Introduce a six-month promotional rate", intro_price_cents: 4999, intro_term_months: 6 }
              as: ComplianceOfficer
            - call: "POST /label-versions/${lvn_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "before the PATCH: LabelVersion.${lvn_id}.monthly_total_intro_cents == null and monthly_total_post_promo_cents == 7999 — the INTRO_ONLY line appears in no phase of fee_itemization"
            - "e1 == ERR_FEE_ITEMIZATION_INCOMPLETE (409) even though the attestation is CERTIFIED and the locale coverage is complete"
            - "LabelVersion.${lvn_id}.publication_state is still DRAFT and ServicePlan.${plan_n_id}.active_label_version_id == null"
            - "the PATCH recomputes the DRAFT label: monthly_total_intro_cents == 5999 (4999 + 1000), net_monthly_intro_cents == 5999 (discount_program_applied false), monthly_total_post_promo_cents == 7999"
            - "first_year_total_promo_weighted_cents == 83988 (0 + 5999*6 + 7999*6) and first_year_total_post_promo_cents == 95988 (7999*12)"
            - "the second publish returns 200 with publication_state == PUBLISHED, substantiation_status == SUBSTANTIATED and fee_itemization containing the PROMO_EQUIP line at phase INTRO"
            - "ServicePlan.${plan_n_id}.price_disclosure_drift == true from the PATCH, so label_posture == RESTRICTED even though the label is freshly published"

