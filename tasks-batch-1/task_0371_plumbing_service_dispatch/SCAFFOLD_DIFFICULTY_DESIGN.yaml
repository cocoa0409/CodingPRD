  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: start_work_blocked_until_estimate_approved_job_estimate
        grounds:
          - state_machines.ServiceJob.AUTHORIZED_to_IN_PROGRESS
          - entities.Estimate.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair ServiceJob -> Estimate: a job cannot transition to IN_PROGRESS while still ON_SITE
          because no estimate is APPROVED; start-work on the ON_SITE job (estimate only PRESENTED) returns
          ERR_INVALID_STATE. The valid transition only opens once the estimate is APPROVED (job AUTHORIZED).
        test_recipe:
          setup:
            - "Job ON_SITE with a PRESENTED (not yet approved) estimate."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-15T12:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "CE-1", category: "LEAK", base_price_cents: 20000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust CE1", service_address: "13 Vine St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech CE1", skill_level: 2 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T12:00:00.000Z", window_end: "2026-06-15T14:00:00.000Z", eta: "2026-06-15T12:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "start-work response status code == 409"
            - "start-work response data.error_id == ERR_INVALID_STATE"
            - "ServiceJob.${job_id}.status == ON_SITE"

      - name: complete_blocked_until_permit_passed_job_permit
        grounds:
          - state_machines.ServiceJob.IN_PROGRESS_to_COMPLETED
          - entities.Permit.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DIFFERENT entity pair ServiceJob -> Permit: a job whose approved estimate triggered a Permit
          cannot COMPLETE while the Permit is not PASSED; complete on the IN_PROGRESS job (permit still
          INSPECTION_SCHEDULED) returns ERR_INVALID_STATE — distinct from the Job->Estimate dependency above.
        test_recipe:
          setup:
            - "A permit-requiring job was approved (permit auto-created APPLIED), issued, an inspection scheduled (permit INSPECTION_SCHEDULED, not yet PASSED), and the job started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-15T12:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "CE2-PMT", category: "WATER_HEATER", base_price_cents: 40000, skill_required: 2, requires_permit: true }
              as: OfficeManager
              captures: { fr_id: $.data.id }
