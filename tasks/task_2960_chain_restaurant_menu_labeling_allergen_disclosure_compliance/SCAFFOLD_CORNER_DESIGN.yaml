      - name: establishment_planned_to_operating_flips_brand_coverage_at_twenty_units
        claim_type: valid_transition
        grounds:
          - state_machines.Establishment.transitions.PLANNED_to_OPERATING
          - calculations.covered_establishment_determination
          - entities.Brand.counted_unit_count
          - endpoints[POST /establishments/{id}/status-changes]
        distinguishing_aspect: "The PLANNED -> OPERATING move runs all three declared side effects in one request: counted_unit_count 19 -> 20, coverage_status NOT_COVERED -> COVERED with coverage_reason COVERED_BY_UNIT_COUNT, and compliance_posture EXEMPT -> COMPLIANT."
        test_recipe:
          setup:
            - "One brand with one STANDARD menu item, 19 OPERATING units and one PLANNED unit, so the brand sits exactly one unit below the 20-unit threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
