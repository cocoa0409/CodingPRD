            - "Booking.${ba_id}.retained_cents == 341"
            - "Booking.${bb_id}.cancellation_variant == CLIENT_INITIATED"
            - "Booking.${bb_id}.cancellation_fee_cents == 171"
            - "Booking.${bb_id}.refund_cents == 170"
            - "Booking.${bb_id}.retained_cents == 171"
            - "GroupClient.${gc_id}.credit_balance_cents == 19488"
