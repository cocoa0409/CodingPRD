              captures: { roy_b: $.data.royalty_cents }
          assert:
            - "batch A royalty_cents == 33000 (exactly 0.98 qualifies: 30000 * 1.10)"
            - "batch B royalty_cents == 30000 (0.9799 < 0.98: no bonus)"

      - name: compile_at_exact_period_end_date
        grounds:
          - validations[priority=19]
          - state_machines.ReportDelivery.SCHEDULED_to_COMPILED
          - endpoints.POST_/report-deliveries/{id}/compile
        distinguishing_aspect: |
          Boundary metric: current logical date against the >= period_end_date
          delivery-cadence threshold on the compile endpoint (different metric and
          endpoint from the QA-score boundary). One day early fails; exactly on the
          period end date compiles.
        test_recipe:
          setup:
            - "Methodology + CURRENT cell for 2026-08; client (entitlement 100); product; period period_end_date 2026-08-31; one SCHEDULED delivery."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Client Win", entitlement_cells_total: 100 }
