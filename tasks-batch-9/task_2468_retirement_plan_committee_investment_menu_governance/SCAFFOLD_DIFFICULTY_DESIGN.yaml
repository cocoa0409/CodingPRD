  # ===========================================================================
  # RULE 2 - combinatorial_formula  (3 instances in three DIFFERENT modes:
  #          (a) non-linear multi-input interaction, (b) pinned rounding order,
  #          (c) circular-looking dependency with a pinned pass order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: glidepath_fit_nonlinear_reference_allowance_matrix
        grounds:
          - calculations.glidepath_fit_score
          - entities.Fund.fields.glidepath_type
          - entities.Fund.fields.construction
          - entities.Fund.fields.equity_at_65_pct
          - entities.Fund.fields.landing_point_age
          - entities.Fund.fields.glidepath_fit_score
          - entities.Fund.fields.is_target_date_suite
        distinguishing_aspect: |
          Mode (a): glidepath_fit_score interacts five inputs non-linearly - two enum branches
          (glidepath_type selects the (target_equity_at_65, target_landing_age) reference pair,
          construction selects the bps cost allowance) feeding two abs() gaps and a nested
          max(0, net - allowance) cost penalty under a final max(0.00, ...) floor - so the same
          equity_at_65_pct 50.00 / landing_point_age 80 / net_expense_ratio_bps 45 triple scores
          100.00, 92.50 and 47.50 across three branch combinations, and an extreme suite clamps to 0.00
          rather than going negative.
        test_recipe:
          setup:
            - "One Plan (charter_status DRAFT is sufficient - POST /governance/funds is not gated by charter, IPS or menu_posture)."
            - "No slots, no reviews, no committee: glidepath_fit_score is computed at Fund creation from the fund's own fields alone."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
              payload: { plan_name: "Delta 401(k) Plan", plan_sponsor_name: "Delta Freight Co", erisa_covered: true, participant_account_count: 500, menu_slot_capacity: 8, quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDCTH", fund_name: "Custom Through Suite 2050", asset_class_code: "TARGET_DATE", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 50, net_expense_ratio_bps: 45, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 20, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9200, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "THROUGH_RETIREMENT", construction: "CUSTOM", equity_at_65_pct: 50.00, landing_point_age: 80 }
              as: InvestmentConsultant
              captures: { f_custom_through_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDOTH", fund_name: "Shelf Through Suite 2050", asset_class_code: "TARGET_DATE", share_class_code: "R6", gross_expense_ratio_bps: 50, net_expense_ratio_bps: 45, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 20, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9200, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "THROUGH_RETIREMENT", construction: "OFF_THE_SHELF", equity_at_65_pct: 50.00, landing_point_age: 80 }
              as: InvestmentConsultant
              captures: { f_shelf_through_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDCTO", fund_name: "Custom To Suite 2050", asset_class_code: "TARGET_DATE", share_class_code: "INSTITUTIONAL", gross_expense_ratio_bps: 50, net_expense_ratio_bps: 45, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 20, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9200, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "TO_RETIREMENT", construction: "CUSTOM", equity_at_65_pct: 50.00, landing_point_age: 80 }
              as: InvestmentConsultant
              captures: { f_custom_to_id: $.data.id }
            - call: "POST /governance/funds"
              payload: { plan_id: "${plan_id}", ticker: "TDCLP", fund_name: "Shelf To Suite Clamped", asset_class_code: "TARGET_DATE", share_class_code: "INVESTOR", gross_expense_ratio_bps: 300, net_expense_ratio_bps: 300, revenue_share_bps: 0, peer_median_expense_bps: 40, track_record_quarters: 20, manager_tenure_quarters: 24, manager_change_flag: false, style_drift_r2: 0.9200, plan_assets_cents: 0, is_target_date_suite: true, glidepath_type: "TO_RETIREMENT", construction: "OFF_THE_SHELF", equity_at_65_pct: 0.00, landing_point_age: 60 }
              as: InvestmentConsultant
              captures: { f_clamped_id: $.data.id }
          assert:
            - "Fund.${f_custom_through_id}.glidepath_fit_score == 100.00"
            - "Fund.${f_shelf_through_id}.glidepath_fit_score == 92.50"
            - "Fund.${f_custom_to_id}.glidepath_fit_score == 47.50"
            - "Fund.${f_clamped_id}.glidepath_fit_score == 0.00"
            - "Fund.${f_custom_through_id}.glidepath_fit_score - Fund.${f_shelf_through_id}.glidepath_fit_score == 7.50 (the CUSTOM 45 bps vs OFF_THE_SHELF 30 bps allowance, times 0.5)"
            - "Fund.${f_custom_through_id}.glidepath_fit_score - Fund.${f_custom_to_id}.glidepath_fit_score == 52.50 (equity_gap 15.0 * 1.5 == 22.50 plus landing_gap 15 * 2.0 == 30.00)"
            - "Fund.${f_clamped_id}.glidepath_fit_score >= 0.00 (raw value -97.50 is floored, never negative)"
            - "Fund.${f_custom_through_id}.is_target_date_suite == true"
            - "Fund.${f_custom_through_id}.menu_status == CANDIDATE"
            - "Fund.${f_custom_through_id}.qdia_flag == false"

      - name: levelization_accrual_floored_per_fund_before_pooling
        grounds:
          - calculations.levelized_fee_allocation
          - entities.FeeLevelizationRun.fields.credit_pool_cents
          - entities.FeeLevelizationRun.fields.allocated_total_cents
          - entities.FeeLevelizationRun.fields.allocation_lines
          - entities.Fund.fields.revenue_share_bps
          - entities.Fund.fields.plan_assets_cents
          - validations[priority=83]
        distinguishing_aspect: |
          Mode (b): the pinned rounding order is floor-per-fund-at-PASS-1-then-pool, so two funds whose
          raw accruals are 1500.0015 and 1499.9985 cents contribute floor()s of 1500 and 1499 for an
          eligible pool of 2999 - one cent less than the 3000 that summing the raw accruals and flooring
          once would have produced - and the PRO_RATA waterfall then hands that single leftover cent to
          the larger-assets fund, giving allocation_lines 1500 / 1499 rather than 1500 / 1500.
        test_recipe:
          setup:
            - "One Plan with charter_status ADOPTED, participant_account_count 8, menu_slot_capacity 6, fiscal_quarter_index 0."
            - "Two ACTIVE CommitteeMember rows on FILLED voting seats, training CURRENT; one ADOPTED IPS."
            - "AssetClassSlot US_LARGE_CAP status ACTIVE seating Fund ACMLX with plan_assets_cents 1000001 and revenue_share_bps 15."
            - "AssetClassSlot CORE_BOND status ACTIVE seating Fund ACMBX with plan_assets_cents 999999 and revenue_share_bps 15."
            - "Plan.total_plan_assets_cents == 2000000; Plan.menu_posture == OPEN."
            - "PASS-1 accruals are floor(1000001*15/10000) == 1500 and floor(999999*15/10000) == 1499, summing to 2999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
              payload: { plan_name: "Everett 401(k) Plan", plan_sponsor_name: "Everett Tooling Corp", erisa_covered: true, participant_account_count: 8, menu_slot_capacity: 6, quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "CHAIR", seat_class: "CHAIR", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              captures: { seat_chair_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "FIN-1", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
              captures: { seat_fin_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, charter_doc_ref: "CHARTER-EV-V1" }
              as: PlanSponsorAdmin
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_chair_id}", member_name: "Dana Reyes", term_start_date: "2026-01-01", term_end_date: "2027-12-31", independence_flag: true }
