            - "After step 2: Representative ${arep_id}.authorization_status is STILL 'AUTHORIZED_ACCREDITED' (EXPIRING remains a qualifying status)."
            - "step 4 returns HTTP 200; Accreditation ${acc_id}.status == 'RENEWAL_PENDING' and OrganizationRecognition ${rec_id}.version == ${rec_ver} + 1 (the renew consumes the OCC token it was given)."
            - "step 5 returns HTTP 200; Accreditation ${acc_id}.status == 'APPROVED', renewal_round == 1, effective_date == '2029-08-21', expiry_date == '2032-08-20'."
            - "After step 5: Accreditation ${acc_id}.authorized_forums == ['USCIS'] exactly - BIA and EOIR_IMMIGRATION_COURT are dropped by PARTIAL_FORUM_CEILING even though the recognition authorizes EOIR_IMMIGRATION_COURT."
