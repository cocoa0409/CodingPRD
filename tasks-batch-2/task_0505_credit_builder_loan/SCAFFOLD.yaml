scenario: |
  505. Credit-Builder Loan & Secured Card (Self/Chime style): locked-savings installment
  loan, on-time payment → tri-bureau reporting, graduation to unsecured & deposit release,
  secured-card deposit/limit, autopay & delinquency handling, score-tracking dashboard,
  APR/fee disclosure, early-payoff.

domain_name: credit-builder-loan
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - rate_threshold_triggers

  entity_topology: hybrid
  # Account anchors a tree (Loan, SecuredCard children); BureauReport / ScoreSnapshot /
  # PayoffQuote hang off the loan with cross-cutting FKs; AutopayEnrollment is a flat peer
  # referencing the loan.

  state_machine_shape: parallel
  # CreditBuilderLoan carries two independent state axes (lifecycle_status × delinquency_status)
  # that evolve on different triggers; SecuredCard has a branching deposit/active machine with
  # revert; Account posture is compound (derived from KYC + disclosure).

  relationship_patterns:
    - one_to_many        # Account -> Loan, Account -> SecuredCard, Loan -> Payment, Loan -> BureauReport
    - cross_aggregate    # PayoffQuote references Loan; ScoreSnapshot references Account+Loan
    - polymorphic        # BureauReport.tradeline_kind references either Loan or SecuredCard

  role_model: segregation_of_duties
  # Borrower acts on own resources; LoanServicer performs servicing/reporting/graduation;
  # ComplianceOfficer signs disclosures and authorizes deposit release; PlatformAdmin operates
  # the clock and batch sweeps. SoD: the LoanServicer who funds a loan cannot be the
  # ComplianceOfficer who releases its deposit (tracked by X-User-ID).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Borrower contact email; unique across active accounts."
        constraints: "unique among Accounts where status != CLOSED"
      - name: full_name
        type: string
        source: input
        description: "Legal name of the borrower."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of residence; drives APR cap."
        constraints: "enum-like 2-letter code; must be in the SUPPORTED_STATES set"
      - name: kyc_status
        type: enum
        source: system
        description: "Identity verification posture."
        default: PENDING
        constraints: "PENDING | VERIFIED | REJECTED"
      - name: disclosure_status
        type: enum
        source: computed
        description: "Whether the active TILA disclosure for this account is acknowledged."
        default: UNACKNOWLEDGED
        constraints: "UNACKNOWLEDGED | ACKNOWLEDGED"
      - name: posture
        type: enum
        source: computed
        description: "Gate over all product origination. ELIGIBLE iff kyc_status==VERIFIED AND disclosure_status==ACKNOWLEDGED AND status==OPEN; otherwise BLOCKED; FROZEN when status==FROZEN."
        default: BLOCKED
        constraints: "BLOCKED | ELIGIBLE | FROZEN"
      - name: status
        type: enum
        source: system
        description: "Account lifecycle."
        default: OPEN
        constraints: "OPEN | FROZEN | CLOSED"
      - name: wallet_cents
        type: integer
        source: computed
        description: "Released-funds wallet, in cents. Receives matured locked savings and released card deposits. Never negative."
        default: 0

  - name: Disclosure
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; the account this disclosure was issued to."
      - name: product_kind
        type: enum
        source: input
        description: "Which product the APR/fee disclosure covers."
        constraints: "LOAN | SECURED_CARD"
      - name: apr_bps
        type: integer
        source: input
        description: "Disclosed APR in basis points (e.g. 1599 = 15.99%)."
        constraints: ">= 0; must be <= state APR cap (see ERR_APR_CAP_EXCEEDED)"
      - name: admin_fee_cents
        type: integer
        source: input
        description: "One-time non-refundable administrative fee in cents."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Disclosure lifecycle."
        default: ISSUED
        constraints: "ISSUED | ACKNOWLEDGED | SUPERSEDED"
      - name: signed_by_compliance_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who issued (signed) this disclosure."
      - name: acknowledged_at
        type: datetime
        source: system
        description: "When the borrower acknowledged; null until ACKNOWLEDGED."

  - name: CreditBuilderLoan
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owner of the loan."
      - name: disclosure_id
        type: string
        source: input
        description: "FK -> Disclosure.id; the acknowledged LOAN disclosure pinned at origination."
      - name: principal_cents
        type: integer
        source: input
        description: "Total amount locked into savings and amortized over the term."
        constraints: ">= 30000 and <= 300000 (USD 300 .. 3000)"
      - name: term_months
        type: integer
        source: input
        description: "Number of monthly installments."
        constraints: "one of {12, 24}"
      - name: apr_bps
        type: integer
        source: computed
        description: "APR copied from the pinned disclosure at funding; immutable thereafter."
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Level amortized payment, computed at funding from principal/apr/term (see compute_amortized_payment)."
      - name: funded_at
        type: datetime
        source: system
        description: "Logical-clock instant the loan moved to ACTIVE; anchors the due schedule."
      - name: principal_paid_cents
        type: integer
        source: computed
        description: "Cumulative principal applied from posted payments. Drives locked-savings release at payoff."
        default: 0
      - name: interest_paid_cents
        type: integer
        source: computed
        description: "Cumulative interest applied from posted payments."
        default: 0
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "principal_cents - principal_paid_cents; never negative."
        default: 0
      - name: lifecycle_status
        type: enum
        source: system
        description: "Primary state axis."
        default: PENDING
        constraints: "PENDING | ACTIVE | PAID_OFF | GRADUATED | DEFAULTED | CANCELLED"
      - name: delinquency_status
        type: enum
        source: system
        description: "Independent state axis tracking payment aging."
        default: CURRENT
        constraints: "CURRENT | DPD_30 | DPD_60 | DPD_90 | CHARGED_OFF"
      - name: on_time_streak
        type: integer
        source: computed
        description: "Count of installments marked PAID while still on-time (cash fully covering amount_due_cents posted at or before due_date + GRACE_DAYS). Increments by one per installment so covered; reset to 0 when an installment ages to LATE. A lump payment that covers k installments before their due dates advances the streak by k. Drives graduation eligibility (>= GRADUATION_MIN_STREAK)."
        default: 0
      - name: missed_count
        type: integer
        source: computed
        description: "Count of installments that aged past their due date without full payment."
        default: 0
      - name: funded_by_servicer_user_id
        type: string
        source: system
        description: "X-User-ID of the LoanServicer who funded the loan; used for SoD on deposit release."

  - name: InstallmentSchedule
    parent: CreditBuilderLoan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: system
        description: "FK -> CreditBuilderLoan.id; the loan this installment belongs to."
      - name: period_index
        type: integer
        source: system
        description: "1-based installment number within the term."
        constraints: ">= 1 and <= loan.term_months"
      - name: due_date
        type: datetime
        source: system
        description: "Logical-clock instant this installment is due (funded_at + period_index months)."
      - name: amount_due_cents
        type: integer
        source: system
        description: "Scheduled payment for this period (last period absorbs rounding remainder)."
      - name: principal_component_cents
        type: integer
        source: computed
        description: "Principal portion of this installment under the amortization split."
      - name: interest_component_cents
        type: integer
        source: computed
        description: "Interest portion of this installment under the amortization split."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cumulative cash applied to this installment from posted payments."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Per-installment state."
        default: SCHEDULED
        constraints: "SCHEDULED | PAID | LATE"

  - name: Payment
    parent: CreditBuilderLoan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> CreditBuilderLoan.id; the loan being paid."
      - name: amount_cents
        type: integer
        source: input
        description: "Cash tendered, in cents."
        constraints: ">= 1"
      - name: source
        type: enum
        source: input
        description: "Origination channel of this payment."
        default: MANUAL
        constraints: "MANUAL | AUTOPAY"
      - name: applied_principal_cents
        type: integer
        source: computed
        description: "Portion allocated to principal under the waterfall (see allocate_payment)."
      - name: applied_interest_cents
        type: integer
        source: computed
        description: "Portion allocated to accrued interest under the waterfall."
      - name: applied_fee_cents
        type: integer
        source: computed
        description: "Portion allocated to outstanding late fees under the waterfall."
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant the payment posted; determines on-time vs late."
      - name: status
        type: enum
        source: system
        description: "Payment outcome. Payments are immutable once applied (no reversal action in this product)."
        default: POSTED
        constraints: "POSTED"

  - name: SecuredCard
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owner of the card."
      - name: disclosure_id
        type: string
        source: input
        description: "FK -> Disclosure.id; the acknowledged SECURED_CARD disclosure pinned at issuance."
      - name: deposit_cents
        type: integer
        source: computed
        description: "Sum of posted CardDeposit.amount_cents; equals credit_limit_cents while ACTIVE."
        default: 0
      - name: credit_limit_cents
        type: integer
        source: computed
        description: "Credit line; equals deposit_cents (1:1 secured)."
        default: 0
      - name: balance_cents
        type: integer
        source: computed
        description: "Current spent balance against the line; never exceeds credit_limit_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Card lifecycle."
        default: PENDING
        constraints: "PENDING | FUNDED | ACTIVE | SUSPENDED | CLOSED"
      - name: graduation_eligible
        type: boolean
        source: computed
        description: "True once the linked loan reached GRADUATED and balance_cents==0."
        default: false

  - name: CardDeposit
    parent: SecuredCard
    common_fields: true
    fields:
      - name: secured_card_id
        type: string
        source: input
        description: "FK -> SecuredCard.id; card this deposit secures."
      - name: amount_cents
        type: integer
        source: input
        description: "Deposit increment, in cents."
        constraints: ">= 20000 and total deposit must not exceed 250000"
      - name: status
        type: enum
        source: system
        description: "Deposit lifecycle."
        default: POSTED
        constraints: "POSTED | RELEASED"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the deposit was released to wallet; null until RELEASED."

  - name: AutopayEnrollment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> CreditBuilderLoan.id; the loan autopay funds."
      - name: day_of_month
        type: integer
        source: input
        description: "Calendar day autopay attempts to draft (clamped to month length)."
        constraints: ">= 1 and <= 28"
      - name: funding_wallet
        type: boolean
        source: input
        description: "When true, autopay draws from Account.wallet_cents before external funds."
        default: false
      - name: status
        type: enum
        source: system
        description: "Autopay enrollment state."
        default: ACTIVE
        constraints: "ACTIVE | PAUSED | CANCELLED"

  - name: BureauReport
    parent: CreditBuilderLoan
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: system
        description: "FK -> CreditBuilderLoan.id; tradeline being reported."
      - name: tradeline_kind
        type: enum
        source: system
        description: "Whether this row reports the loan or the secured card."
        constraints: "LOAN | SECURED_CARD"
      - name: cycle_label
        type: string
        source: system
        description: "Reporting cycle as YYYY-MM derived from clock at sweep time."
      - name: payment_rating
        type: enum
        source: system
        description: "Reported payment status for the cycle."
        constraints: "ON_TIME | LATE_30 | LATE_60 | LATE_90 | CHARGE_OFF"
      - name: reported_balance_cents
        type: integer
        source: system
        description: "Balance reported to the three bureaus for this cycle."
      - name: bureaus
        type: array
        source: system
        description: "Always the three bureaus: [EQUIFAX, EXPERIAN, TRANSUNION]."

  - name: ScoreSnapshot
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; whose score-tracking dashboard this point belongs to."
      - name: cycle_label
        type: string
        source: system
        description: "YYYY-MM cycle label this snapshot summarizes."
      - name: simulated_score
        type: integer
        source: computed
        description: "Model score for the cycle (see compute_score_delta); clamped to [300, 850]."
      - name: score_delta
        type: integer
        source: computed
        description: "simulated_score minus the prior snapshot's simulated_score (0 for the first)."

  - name: PayoffQuote
    parent: CreditBuilderLoan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> CreditBuilderLoan.id; loan being quoted for early payoff."
      - name: quote_as_of
        type: datetime
        source: system
        description: "Logical-clock instant the quote was computed; quotes expire after QUOTE_TTL_HOURS."
      - name: payoff_amount_cents
        type: integer
        source: computed
        description: "Total to settle the loan today under the actual-payments variant (see compute_payoff)."
      - name: scheduled_remaining_cents
        type: integer
        source: computed
        description: "Sum of remaining scheduled installments under the schedule variant; for disclosure comparison."
      - name: interest_savings_cents
        type: integer
        source: computed
        description: "scheduled_remaining_cents - payoff_amount_cents; the borrower's early-payoff benefit."
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle."
        default: ACTIVE
        constraints: "ACTIVE | CONSUMED | EXPIRED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Account: compound posture machine -----
  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /accounts/{id}/kyc-decision (kyc_status -> VERIFIED) by LoanServicer"
        actor: LoanServicer
        preconditions: ["account.status == OPEN", "account.kyc_status == PENDING"]
        side_effects:
          - "set kyc_status=VERIFIED"
          - "recompute posture: ELIGIBLE iff kyc_status==VERIFIED AND disclosure_status==ACKNOWLEDGED"
      - from: OPEN
        to: OPEN
        trigger: "POST /disclosures/{id}/acknowledge by Borrower (disclosure -> ACKNOWLEDGED)"
        actor: Borrower
        preconditions: ["account.status == OPEN"]
        side_effects:
          - "set account.disclosure_status=ACKNOWLEDGED"
          - "recompute posture"
      - from: OPEN
        to: FROZEN
        trigger: "POST /accounts/{id}/freeze by ComplianceOfficer"
        actor: ComplianceOfficer
        preconditions: ["account.status == OPEN"]
        side_effects:
          - "set posture=FROZEN"
          - "CASCADE: every ACTIVE SecuredCard of this account -> SUSPENDED (card spend blocked)"
          - "note: ACTIVE loans keep accruing; only origination of NEW products is gated by posture"
      - from: FROZEN
        to: OPEN
        trigger: "POST /accounts/{id}/unfreeze by ComplianceOfficer"
        actor: ComplianceOfficer
        preconditions: ["account.status == FROZEN"]
        side_effects:
          - "recompute posture"
          - "CASCADE: SecuredCards SUSPENDED purely by the freeze -> ACTIVE again"
      - from: OPEN
        to: CLOSED
        trigger: "POST /accounts/{id}/close by ComplianceOfficer"
        actor: ComplianceOfficer
        preconditions:
          - "account.status == OPEN"
          - "no CreditBuilderLoan of this account in lifecycle_status IN {ACTIVE}"
          - "no SecuredCard of this account in status IN {FUNDED, ACTIVE, SUSPENDED}"
        side_effects: ["set posture=BLOCKED"]

  # ----- CreditBuilderLoan: PARALLEL axes (lifecycle_status × delinquency_status) -----
  - entity: CreditBuilderLoan
    initial_state: PENDING        # lifecycle_status axis
    terminal_states: [GRADUATED, DEFAULTED, CANCELLED]
    # PAID_OFF is non-terminal: it may still transition to GRADUATED.
    transitions:
      # --- lifecycle_status axis ---
      - from: PENDING
        to: ACTIVE
        trigger: "POST /loans/{id}/fund by LoanServicer"
        actor: LoanServicer
        preconditions:
          - "loan.lifecycle_status == PENDING"
          - "GUARDED: account.posture == ELIGIBLE"
          - "GUARDED: pinned disclosure.status == ACKNOWLEDGED AND disclosure.product_kind == LOAN"
        side_effects:
          - "stamp funded_at = clock now; copy apr_bps from pinned disclosure"
          - "run compute_amortized_payment -> set monthly_payment_cents"
          - "GENERATE term_months InstallmentSchedule rows (run build_amortization_split for principal/interest components)"
          - "set funded_by_servicer_user_id = X-User-ID"
          - "outstanding_principal_cents = principal_cents"
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system: a posted Payment, autopay draft, or early-payoff drives outstanding_principal_cents to 0 (full payoff)"
        actor: system
        preconditions: ["loan.lifecycle_status == ACTIVE", "outstanding_principal_cents reaches 0 after allocation"]
        side_effects:
          - "set all SCHEDULED/LATE InstallmentSchedule rows -> PAID"
          - "LEDGER: release locked savings = principal_paid_cents to Account.wallet_cents (CASCADE hop 1)"
          - "set delinquency_status -> CURRENT"
      - from: PAID_OFF
        to: GRADUATED
        trigger: "POST /loans/{id}/graduate by LoanServicer"
        actor: LoanServicer
        preconditions:
          - "loan.lifecycle_status == PAID_OFF"
          - "loan.delinquency_status == CURRENT"
          - "on_time_streak >= GRADUATION_MIN_STREAK (6)"
        side_effects:
          - "CASCADE hop 1: if linked SecuredCard exists for this account, set SecuredCard.graduation_eligible=true (provided card.balance_cents==0)"
          - "emit a final BureauReport with payment_rating tied to delinquency_status (ON_TIME)"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system: delinquency aging reaches CHARGED_OFF during clock sweep"
        actor: system
        preconditions: ["loan.lifecycle_status == ACTIVE", "loan.delinquency_status transitions to CHARGED_OFF"]
        side_effects:
          - "LEDGER: release principal_paid_cents (only the principal already paid) to Account.wallet_cents; remaining locked savings forfeited"
          - "freeze schedule (no further accrual)"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /loans/{id}/cancel by Borrower"
        actor: Borrower
        preconditions: ["loan.lifecycle_status == PENDING"]
        side_effects: ["no schedule was generated; nothing to release"]
      # --- delinquency_status axis (independent; advances/recovers on different triggers) ---
      - from: CURRENT
        to: DPD_30
        trigger: "system: clock sweep finds an installment past due_date + GRACE_DAYS by 1..30 days unpaid"
        actor: system
        preconditions: ["loan.lifecycle_status == ACTIVE", "oldest unpaid installment days-past-due in [1,30]"]
        side_effects:
          - "increment missed_count if newly missed"
          - "reset on_time_streak to 0"
          - "assess late fee LATE_FEE_CENTS on the oldest LATE installment (CASCADE: SecuredCard auto-pause review)"
      - from: DPD_30
        to: DPD_60
        trigger: "system: clock sweep finds oldest unpaid installment 31..60 days past due"
        actor: system
        preconditions: ["oldest unpaid installment days-past-due in [31,60]"]
        side_effects: ["assess additional LATE_FEE_CENTS"]
      - from: DPD_60
        to: DPD_90
        trigger: "system: clock sweep finds oldest unpaid installment 61..90 days past due"
        actor: system
        preconditions: ["oldest unpaid installment days-past-due in [61,90]"]
        side_effects: ["assess additional LATE_FEE_CENTS"]
      - from: DPD_90
        to: CHARGED_OFF
        trigger: "system: clock sweep finds oldest unpaid installment > 90 days past due"
        actor: system
        preconditions: ["oldest unpaid installment days-past-due > 90"]
        side_effects:
          - "drives lifecycle_status -> DEFAULTED (parallel-axis coupling)"
      - from: DPD_30
        to: CURRENT
        trigger: "system: a posted Payment clears all past-due installments (delinquency cure)"
        actor: system
        preconditions: ["after allocation no installment is past due_date + GRACE_DAYS"]
        side_effects: ["CYCLE: delinquency recovers; on_time_streak resumes from 0"]
      - from: DPD_60
        to: CURRENT
        trigger: "system: a posted Payment clears all past-due installments (delinquency cure)"
        actor: system
        preconditions: ["after allocation no installment is past due_date + GRACE_DAYS"]
        side_effects: ["CYCLE: delinquency recovers"]

  # ----- SecuredCard: branching deposit/active machine with revert -----
  - entity: SecuredCard
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: FUNDED
        trigger: "POST /secured-cards/{id}/deposits by Borrower (first POSTED deposit)"
        actor: Borrower
        preconditions:
          - "card.status == PENDING"
          - "GUARDED: account.posture == ELIGIBLE"
          - "deposit total after this deposit >= MIN_CARD_DEPOSIT_CENTS (20000)"
        side_effects:
          - "recompute deposit_cents = sum POSTED CardDeposit.amount_cents"
          - "set credit_limit_cents = deposit_cents"
      - from: FUNDED
        to: ACTIVE
        trigger: "POST /secured-cards/{id}/activate by Borrower"
        actor: Borrower
        preconditions: ["card.status == FUNDED", "GUARDED: account.posture == ELIGIBLE"]
        side_effects: ["card becomes spendable up to credit_limit_cents"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /secured-cards/{id}/suspend by LoanServicer OR cascade from Account freeze / loan delinquency"
        actor: LoanServicer
        preconditions: ["card.status == ACTIVE"]
        side_effects: ["spend blocked; existing balance frozen"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /secured-cards/{id}/resume by LoanServicer"
        actor: LoanServicer
        preconditions: ["card.status == SUSPENDED", "GUARDED: account.posture == ELIGIBLE"]
        side_effects: ["REVERT: card spendable again"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /secured-cards/{id}/release-deposit by ComplianceOfficer"
        actor: ComplianceOfficer
        preconditions:
          - "card.status == ACTIVE"
          - "card.graduation_eligible == true"
          - "card.balance_cents == 0"
          - "SoD: X-User-ID != linked loan.funded_by_servicer_user_id"
        side_effects:
          - "CASCADE hop 2: set every POSTED CardDeposit -> RELEASED, stamp released_at"
          - "CASCADE hop 3: credit deposit_cents to Account.wallet_cents; set credit_limit_cents=0, deposit_cents=0"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /secured-cards/{id}/release-deposit by ComplianceOfficer (suspended card with zero balance)"
        actor: ComplianceOfficer
        preconditions:
          - "card.status == SUSPENDED"
          - "card.graduation_eligible == true"
          - "card.balance_cents == 0"
          - "SoD: X-User-ID != linked loan.funded_by_servicer_user_id"
        side_effects:
          - "CASCADE: set POSTED CardDeposits -> RELEASED; credit deposit to wallet; zero the line"

  # ----- Disclosure: simple lifecycle with supersede -----
  - entity: Disclosure
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /disclosures/{id}/acknowledge by Borrower"
        actor: Borrower
        preconditions: ["disclosure.status == ISSUED", "acting Borrower owns disclosure.account_id"]
        side_effects:
          - "stamp acknowledged_at"
          - "set Account.disclosure_status=ACKNOWLEDGED; recompute Account.posture"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a newer ISSUED Disclosure for the same (account, product_kind) is created"
        actor: system
        preconditions: ["a newer Disclosure for same account_id and product_kind is created"]
        side_effects: ["older disclosure no longer acknowledgeable"]

  # ----- PayoffQuote: quote/consume/expire -----
  - entity: PayoffQuote
    initial_state: ACTIVE
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /loans/{id}/early-payoff by Borrower citing this quote"
        actor: Borrower
        preconditions:
          - "quote.status == ACTIVE"
          - "clock now <= quote.quote_as_of + QUOTE_TTL_HOURS"
          - "loan.lifecycle_status == ACTIVE"
        side_effects:
          - "apply a synthetic Payment of payoff_amount_cents -> drives loan to PAID_OFF"
          - "release locked savings to wallet via the PAID_OFF cascade"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: clock now > quote.quote_as_of + QUOTE_TTL_HOURS at early-payoff time"
        actor: system
        preconditions: ["clock now > quote.quote_as_of + QUOTE_TTL_HOURS"]
        side_effects: ["quote no longer usable; borrower must re-quote"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: payment-post-stale-loan
    parent_entity: CreditBuilderLoan
    write_endpoint: "POST /payments"
    occ_field: "expected_loan_version"
    description: |
      Posting a Payment against a CreditBuilderLoan whose version has advanced
      since the client last observed it is rejected. Each posted payment runs
      allocate_payment and mutates the loan's principal_paid_cents / interest_paid_cents /
      outstanding_principal_cents (bumping loan.version). A client that read the loan,
      then sees its allocation snapshot invalidated by another posted payment, carries a
      stale expected_loan_version and is rejected rather than double-applying against an
      already-changed balance.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: deposit-post-stale-card
    parent_entity: SecuredCard
    write_endpoint: "POST /secured-cards/{id}/deposits"
    occ_field: "expected_card_version"
    description: |
      Posting a CardDeposit against a SecuredCard whose version has advanced since the
      client last observed it is rejected. The prior deposit recomputed deposit_cents and
      credit_limit_cents (bumping card.version); a writer holding the pre-deposit version
      is working from a stale credit-limit view and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_amortized_payment
    trigger: "loan.fund (PENDING -> ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      # Level monthly payment of a fully-amortizing fixed-rate loan.
      # apr_bps -> monthly rate r = apr_bps / 10000 / 12   (decimal)
      # P = principal_cents (integer cents), n = term_months
      # If r == 0: pay_exact = P / n
      # Else:      pay_exact = P * r * (1+r)^n / ((1+r)^n - 1)
      # monthly_payment_cents = round_half_up(pay_exact)   # cents, single rounding
      #
      # Last installment absorbs the cents remainder so sum(amount_due) == total scheduled:
      #   total_scheduled = monthly_payment_cents * n  (with last period adjusted in build_amortization_split)
    input_set: "The single funded loan; principal_cents, apr_bps (from pinned disclosure), term_months."
    constants:
      SUPPORTED_TERMS: [12, 24]
      MIN_PRINCIPAL_CENTS: 30000
      MAX_PRINCIPAL_CENTS: 300000
      GRADUATION_MIN_STREAK: 6
      MIN_CARD_DEPOSIT_CENTS: 20000
      MAX_CARD_DEPOSIT_CENTS: 250000
      STATE_APR_CAP_BPS: { CA: 3600, NY: 2500, TX: 9999, FL: 3000 }
      SUPPORTED_STATES: [CA, NY, TX, FL]
    precision: "intermediate float math; final monthly_payment_cents = round_half_up to whole cents (single rounding at the end)"

  - name: build_amortization_split
    trigger: "loan.fund (PENDING -> ACTIVE), immediately after compute_amortized_payment"
    algorithm: chronological
    formula: |
      # Walk periods 1..n in order, maintaining a running balance (PINNED ORDER: period 1 first).
      # bal_0 = principal_cents
      # For period k in 1..n:
      #   interest_k = round_half_up(bal_{k-1} * r)          # r = monthly rate, per-line rounding
      #   if k < n:
      #     principal_k = monthly_payment_cents - interest_k
      #     amount_due_k = monthly_payment_cents
      #   else: # last period absorbs remainder
      #     principal_k = bal_{k-1}
      #     amount_due_k = principal_k + interest_k
      #   bal_k = bal_{k-1} - principal_k
      # Per-line rounding of interest is pinned; the schedule is NOT "sum then round".
    input_set: "All InstallmentSchedule rows of the loan, processed strictly in ascending period_index (created_at ASC as fallback only if two rows share period_index, which never happens)."
    constants: {}
    precision: "interest_k rounded per period (round_half_up); pinned per-line, processed period 1..n in order"

  - name: allocate_payment
    trigger: "POST /payments and autopay drafting (Payment POSTED) and PayoffQuote consume"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall buckets, in PINNED order: (1) outstanding late fees, (2) accrued interest
      # on the oldest unpaid installment, (3) principal. Apply oldest-installment-first.
      # remaining = amount_cents
      # applied_fee = min(remaining, outstanding_late_fee_cents); remaining -= applied_fee
      # applied_interest = min(remaining, sum of unpaid interest_component on past-due+current installments
      #                        processed oldest-first by period_index)
      # remaining -= applied_interest
      # applied_principal = min(remaining, outstanding_principal_cents); remaining -= applied_principal
      # Overpayment (remaining > 0 after principal hits 0) is NOT applied to future interest;
      # it is credited to Account.wallet_cents.
      # principal_paid_cents += applied_principal; interest_paid_cents += applied_interest
      # outstanding_principal_cents = principal_cents - principal_paid_cents (floor 0)
      # Installments are marked PAID oldest-first as their amount_due is fully covered.
    input_set: "The target loan's InstallmentSchedule rows (status IN {SCHEDULED, LATE}) ordered by period_index ASC; outstanding fee ledger."
    constants:
      WALLET_OVERPAY_CREDIT: true
    precision: "integer cents throughout; no fractional cents"

  - name: compute_payoff
    trigger: "POST /loans/{id}/payoff-quote"
    algorithm: chronological
    formula: |
      # DUAL-VARIANT on the LOAN domain.
      # VARIANT actual_payoff (the binding amount):
      #   payoff_amount_cents = outstanding_principal_cents
      #     + accrued_interest_to_date
      #     + outstanding_late_fee_cents
      #   where accrued_interest_to_date = round_half_up(outstanding_principal_cents * r
      #         * days_since_last_due / 30)   # simple per-diem on outstanding principal
      # VARIANT scheduled_remaining (disclosure comparison only):
      #   scheduled_remaining_cents = sum of amount_due_cents over installments with status
      #         IN {SCHEDULED, LATE} (i.e., not yet PAID)
      # interest_savings_cents = scheduled_remaining_cents - payoff_amount_cents
    input_set: "The loan and its unpaid InstallmentSchedule rows (status IN {SCHEDULED, LATE}); clock now for per-diem."
    constants:
      DAYS_PER_MONTH: 30
      QUOTE_TTL_HOURS: 24
    precision: "round_half_up at each component; integer cents result"
    variants:
      - name: actual_payoff
        when: "early-payoff is executed; this is the amount the borrower actually pays"
        difference: "uses outstanding_principal + per-diem accrued interest + fees; ignores unearned future interest"
      - name: scheduled_remaining
        when: "shown for TILA comparison on the quote"
        difference: "sums the full remaining scheduled installments including all future interest"

  - name: compute_score_delta
    trigger: "clock monthly bureau sweep (POST /_clock/run-bureau-sweep) emits a ScoreSnapshot per account"
    algorithm: weighted_scoring
    formula: |
      # DUAL-VARIANT on the ACCOUNT/score domain (distinct from loan payoff above).
      # base = 580
      # payment_history = +PAYMENT_HISTORY_PTS * on_time_installments_reported
      #                   - LATE_PENALTY_PTS * late_marks_reported
      # utilization (secured card): if credit_limit_cents > 0:
      #   util = balance_cents / credit_limit_cents
      #   util_pts = round_half_up( (1 - min(util, 1.0)) * UTILIZATION_MAX_PTS )
      # else util_pts = 0
      # months_since_first_funding = number of WHOLE months between first loan funded_at and the
      #   sweep clock instant, floored (e.g. funded 2026-01-15, clock 2026-03-15 -> 2).
      # age_pts = min(months_since_first_funding, AGE_CAP_MONTHS) * AGE_PTS_PER_MONTH
      # raw = base + payment_history + util_pts + age_pts
      # simulated_score = clamp(raw, 300, 850)
      # score_delta = simulated_score - prior_snapshot.simulated_score (0 if no prior)
    input_set: "All BureauReport rows for the account up to the sweep cycle; the account's secured card balance/limit; first loan funded_at."
    constants:
      BASE: 580
      PAYMENT_HISTORY_PTS: 6
      LATE_PENALTY_PTS: 40
      UTILIZATION_MAX_PTS: 120
      AGE_CAP_MONTHS: 24
      AGE_PTS_PER_MONTH: 2
    precision: "round_half_up on util_pts; integer score; clamp to [300,850]"
    variants:
      - name: optimistic_projection
        when: "GET /accounts/{id}/score?projection=optimistic — assumes the in-flight (current) cycle is reported ON_TIME"
        difference: "adds one more on-time mark and zero late marks for the in-flight cycle before scoring"
      - name: realized
        when: "the snapshot persisted by the bureau sweep"
        difference: "counts only marks actually reported in BureauReport rows; no assumption about the in-flight cycle"

  - name: compute_late_fee_assessment
    trigger: "clock sweep delinquency aging (CURRENT->DPD_30, DPD_30->DPD_60, DPD_60->DPD_90)"
    algorithm: threshold
    formula: |
      # A flat late fee is assessed once per delinquency bucket crossing, capped over the loan.
      # On each bucket crossing for the oldest unpaid installment:
      #   if total_late_fees_assessed + LATE_FEE_CENTS <= LATE_FEE_CAP_CENTS:
      #     outstanding_late_fee_cents += LATE_FEE_CENTS
      #   else:
      #     outstanding_late_fee_cents += (LATE_FEE_CAP_CENTS - total_late_fees_assessed)  # partial, may be 0
      # Boundary: crossing AT exactly day 30 (days_past_due == 30, i.e. due+GRACE+30) does NOT yet
      # trigger DPD_30; DPD_30 fires when days_past_due is in [1,30] AFTER the grace window — see
      # state machine. The cap comparison uses <= (assessment allowed when it lands exactly on cap).
    input_set: "The loan's outstanding_late_fee ledger and cumulative total_late_fees_assessed."
    constants:
      LATE_FEE_CENTS: 1500
      LATE_FEE_CAP_CENTS: 4500
      GRACE_DAYS: 5
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles acting on owned resources, X-User-ID equals the resource's owning Account.id (or its account_id chain)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Borrower-owned operations (acknowledge, deposits, activate, payments, payoff, cancel)"
  - priority: 4
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or FK ids"
  - priority: 5
    category: state
    check: "Account is not FROZEN/CLOSED when origination/acknowledgement is attempted; posture gate"
    error_id: ERR_ACCOUNT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /loans (create+fund), POST /secured-cards, POST /secured-cards/{id}/deposits, POST /secured-cards/{id}/activate"
  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (generic state-machine guard)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "PayoffQuote cited by early-payoff is ACTIVE and not past quote_as_of + QUOTE_TTL_HOURS"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /loans/{id}/early-payoff"
  - priority: 8
    category: business_safety
    check: "Disclosure pinned at origination is ACKNOWLEDGED and product_kind matches the product being originated"
    error_id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /loans, POST /secured-cards"
  - priority: 9
    category: business_safety
    check: "Disclosure apr_bps must not exceed the borrower's state APR cap (regulatory ceiling)"
    error_id: ERR_APR_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /accounts/{id}/disclosures"
  - priority: 10
    category: business_safety
    check: "Deposit-release actor (ComplianceOfficer X-User-ID) must differ from the loan's funded_by_servicer_user_id (segregation of duties)"
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /secured-cards/{id}/release-deposit"
  - priority: 11
    category: business_constraint
    check: "Graduation requires lifecycle_status == PAID_OFF, delinquency_status == CURRENT, and on_time_streak >= GRADUATION_MIN_STREAK (6)"
    error_id: ERR_GRADUATION_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /loans/{id}/graduate"
  - priority: 12
    category: business_constraint
    check: "Deposit release requires graduation_eligible == true and balance_cents == 0"
    error_id: ERR_DEPOSIT_NOT_RELEASABLE
    http_status: 409
    applies_to: "POST /secured-cards/{id}/release-deposit"
  - priority: 13
    category: business_constraint
    check: "Card spend (balance increment) must not push balance_cents above credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /secured-cards/{id}/charges"
  - priority: 14
    category: business_constraint
    check: "Total POSTED deposits on a card must not exceed MAX_CARD_DEPOSIT_CENTS"
    error_id: ERR_DEPOSIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /secured-cards/{id}/deposits"
  - priority: 15
    category: business_temporal
    check: "Autopay day_of_month in [1,28]; payment amount_cents >= 1; loan principal/term within product bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /autopay-enrollments, POST /payments, POST /loans"
  - priority: 16
    category: business_fiscal
    check: "When autopay funding_wallet=true, Account.wallet_cents must cover the draft amount (no overdraft of wallet)"
    error_id: ERR_INSUFFICIENT_WALLET
    http_status: 409
    applies_to: "POST /_clock/run-autopay"
  - priority: 17
    category: business_constraint
    check: "Required body fields present and well-typed; unknown enum values rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PATCH endpoints with a body"
  - priority: 18
    category: business_constraint
    check: "OCC: expected_<parent>_version on payment/deposit posting matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payments, POST /secured-cards/{id}/deposits"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Account -----
  - method: POST
    path: "/accounts"
    description: "Register a new borrower account (kyc_status=PENDING, posture=BLOCKED)."
    roles: [LoanServicer]
    code: 201
    input: [email, full_name, state_code]
    output: Account
    side_effects: ["create Account; posture computed BLOCKED"]
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch one account."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List accounts (paginated; filter by status, kyc_status)."
    roles: [LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "kyc_status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: POST
    path: "/accounts/{id}/kyc-decision"
    description: "LoanServicer records the identity decision."
    roles: [LoanServicer]
    code: 200
    input: [decision]
    output: Account
    side_effects: ["set kyc_status; recompute posture"]
  - method: POST
    path: "/accounts/{id}/freeze"
    description: "ComplianceOfficer freezes the account; cascades ACTIVE cards -> SUSPENDED."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: Account
    side_effects: ["status=FROZEN; posture=FROZEN; suspend ACTIVE cards"]
  - method: POST
    path: "/accounts/{id}/unfreeze"
    description: "ComplianceOfficer unfreezes; restores cards suspended by the freeze."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["recompute posture; restore cards"]
  - method: POST
    path: "/accounts/{id}/close"
    description: "ComplianceOfficer closes an account with no active products."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Account
    side_effects: ["status=CLOSED; posture=BLOCKED"]
  - method: GET
    path: "/accounts/{id}/score"
    description: "Score-tracking dashboard: current realized score or optimistic projection."
    roles: [Borrower, LoanServicer]
    code: 200
    input: ["projection?"]
    output: ScoreSnapshot
    side_effects: ["run compute_score_delta (realized or optimistic_projection variant); no persistence on read"]
  - method: GET
    path: "/accounts/{id}/score-snapshots"
    description: "List persisted score snapshots for the account (dashboard history)."
    roles: [Borrower, LoanServicer]
    code: 200
    input: ["limit?", "offset?"]
    output: ScoreSnapshot[]
    side_effects: []

  # ----- Disclosure -----
  - method: POST
    path: "/accounts/{id}/disclosures"
    description: "ComplianceOfficer issues an APR/fee TILA disclosure for a product; supersedes the prior ISSUED disclosure for the same product_kind."
    roles: [ComplianceOfficer]
    code: 201
    input: [product_kind, apr_bps, admin_fee_cents]
    output: Disclosure
    side_effects: ["issue Disclosure (ISSUED); set signed_by_compliance_user_id; supersede prior ISSUED for same product_kind"]
  - method: GET
    path: "/accounts/{id}/disclosures"
    description: "List disclosures issued to an account (filter by product_kind, status)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["product_kind?", "status?", "limit?", "offset?"]
    output: Disclosure[]
    side_effects: []
  - method: GET
    path: "/disclosures/{id}"
    description: "Fetch one disclosure."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Disclosure
    side_effects: []
  - method: POST
    path: "/disclosures/{id}/acknowledge"
    description: "Borrower acknowledges a disclosure; sets account.disclosure_status=ACKNOWLEDGED."
    roles: [Borrower]
    code: 200
    input: []
    output: Disclosure
    side_effects: ["status=ACKNOWLEDGED; stamp acknowledged_at; recompute account posture"]

  # ----- CreditBuilderLoan -----
  - method: POST
    path: "/loans"
    description: "Create a PENDING credit-builder loan pinned to an acknowledged LOAN disclosure."
    roles: [Borrower, LoanServicer]
    code: 201
    input: [account_id, disclosure_id, principal_cents, term_months]
    output: CreditBuilderLoan
    side_effects: ["create loan PENDING; validate disclosure acknowledged & LOAN; posture gate"]
  - method: GET
    path: "/loans/{id}"
    description: "Fetch one loan with derived balances and both state axes."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: CreditBuilderLoan
    side_effects: []
  - method: GET
    path: "/loans"
    description: "List loans (filter by account_id, disclosure_id, lifecycle_status, delinquency_status)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "disclosure_id?", "lifecycle_status?", "delinquency_status?", "limit?", "offset?"]
    output: CreditBuilderLoan[]
    side_effects: []
  - method: POST
    path: "/loans/{id}/fund"
    description: "LoanServicer funds the loan: lock savings, build amortization schedule, go ACTIVE."
    roles: [LoanServicer]
    code: 200
    input: []
    output: CreditBuilderLoan
    side_effects: ["compute_amortized_payment; build_amortization_split; generate schedule; stamp funded_at, funded_by_servicer_user_id; lifecycle_status=ACTIVE"]
  - method: POST
    path: "/loans/{id}/cancel"
    description: "Borrower cancels a PENDING loan before funding."
    roles: [Borrower]
    code: 200
    input: []
    output: CreditBuilderLoan
    side_effects: ["lifecycle_status=CANCELLED"]
  - method: POST
    path: "/loans/{id}/graduate"
    description: "LoanServicer graduates a PAID_OFF, current loan (on_time_streak>=6) to unsecured; flags linked card and emits final BureauReport."
    roles: [LoanServicer]
    code: 200
    input: []
    output: CreditBuilderLoan
    side_effects: ["set linked SecuredCard.graduation_eligible=true (if balance==0); emit final BureauReport; lifecycle_status=GRADUATED"]
  - method: GET
    path: "/loans/{id}/schedule"
    description: "List the loan's amortization installment schedule (sub-resource)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InstallmentSchedule[]
    side_effects: []
  - method: GET
    path: "/loans/{id}/payments"
    description: "List payments posted to a loan (sub-resource)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["source?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/loans/{id}/bureau-reports"
    description: "List bureau-reporting rows emitted for a loan tradeline (sub-resource)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["cycle_label?", "limit?", "offset?"]
    output: BureauReport[]
    side_effects: []
  - method: POST
    path: "/loans/{id}/payoff-quote"
    description: "Compute an early-payoff quote (dual-variant: actual_payoff vs scheduled_remaining)."
    roles: [Borrower, LoanServicer]
    code: 201
    input: []
    output: PayoffQuote
    side_effects: ["run compute_payoff both variants; create ACTIVE PayoffQuote; stamp quote_as_of"]
  - method: GET
    path: "/loans/{id}/payoff-quotes"
    description: "List payoff quotes for a loan (sub-resource)."
    roles: [Borrower, LoanServicer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayoffQuote[]
    side_effects: []
  - method: POST
    path: "/loans/{id}/early-payoff"
    description: "Borrower executes early payoff citing an ACTIVE quote; consumes quote, drives loan PAID_OFF."
    roles: [Borrower]
    code: 200
    input: [quote_id]
    output: CreditBuilderLoan
    side_effects: ["consume quote; synthetic Payment for payoff_amount_cents; allocate_payment; PAID_OFF cascade releases savings"]

  # ----- Payment -----
  - method: POST
    path: "/payments"
    description: "Post a manual payment against a loan (OCC-guarded on the loan version)."
    roles: [Borrower, LoanServicer]
    code: 201
    input: [loan_id, amount_cents, "source?", expected_loan_version]
    output: Payment
    side_effects: ["allocate_payment; update principal/interest paid; mark installments PAID oldest-first; cure delinquency; maybe PAID_OFF; increments CreditBuilderLoan.version by 1"]
  - method: GET
    path: "/payments/{id}"
    description: "Fetch one payment with its allocation breakdown."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ----- SecuredCard -----
  - method: POST
    path: "/secured-cards"
    description: "Create a PENDING secured card pinned to an acknowledged SECURED_CARD disclosure."
    roles: [Borrower, LoanServicer]
    code: 201
    input: [account_id, disclosure_id]
    output: SecuredCard
    side_effects: ["create card PENDING; validate disclosure acknowledged & SECURED_CARD; posture gate"]
  - method: GET
    path: "/secured-cards/{id}"
    description: "Fetch one secured card."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: SecuredCard
    side_effects: []
  - method: GET
    path: "/secured-cards"
    description: "List secured cards (filter by account_id, disclosure_id, status)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["account_id?", "disclosure_id?", "status?", "limit?", "offset?"]
    output: SecuredCard[]
    side_effects: []
  - method: POST
    path: "/secured-cards/{id}/deposits"
    description: "Borrower posts a security deposit (OCC-guarded); first deposit moves card to FUNDED."
    roles: [Borrower]
    code: 201
    input: [amount_cents, expected_card_version]
    output: CardDeposit
    side_effects: ["create POSTED CardDeposit; recompute deposit_cents & credit_limit_cents; maybe PENDING->FUNDED; increments SecuredCard.version by 1"]
  - method: GET
    path: "/secured-cards/{id}/deposits"
    description: "List deposits securing a card (sub-resource)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CardDeposit[]
    side_effects: []
  - method: POST
    path: "/secured-cards/{id}/activate"
    description: "Borrower activates a FUNDED card so it can be spent."
    roles: [Borrower]
    code: 200
    input: []
    output: SecuredCard
    side_effects: ["status FUNDED->ACTIVE"]
  - method: POST
    path: "/secured-cards/{id}/charges"
    description: "Record a spend against the card line (test/admin surface for utilization)."
    roles: [Borrower, LoanServicer]
    code: 200
    input: [amount_cents]
    output: SecuredCard
    side_effects: ["balance_cents += amount_cents (must not exceed credit_limit_cents)"]
  - method: POST
    path: "/secured-cards/{id}/suspend"
    description: "LoanServicer suspends an ACTIVE card."
    roles: [LoanServicer]
    code: 200
    input: ["reason?"]
    output: SecuredCard
    side_effects: ["status ACTIVE->SUSPENDED"]
  - method: POST
    path: "/secured-cards/{id}/resume"
    description: "LoanServicer resumes a SUSPENDED card."
    roles: [LoanServicer]
    code: 200
    input: []
    output: SecuredCard
    side_effects: ["status SUSPENDED->ACTIVE"]
  - method: POST
    path: "/secured-cards/{id}/release-deposit"
    description: "ComplianceOfficer releases the deposit (SoD-checked) on a graduation-eligible, zero-balance card; closes the card and credits wallet."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SecuredCard
    side_effects: ["RELEASE deposits; credit wallet; zero line; status->CLOSED"]
  - method: GET
    path: "/secured-cards/{id}/bureau-reports"
    description: "List bureau-reporting rows emitted for the card tradeline (filtered-list by card via loan link is N/A; this surfaces SECURED_CARD-kind rows for the card's account loan)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["cycle_label?", "limit?", "offset?"]
    output: BureauReport[]
    side_effects: []

  # ----- AutopayEnrollment -----
  - method: POST
    path: "/autopay-enrollments"
    description: "Enroll a loan in autopay."
    roles: [Borrower, LoanServicer]
    code: 201
    input: [loan_id, day_of_month, "funding_wallet?"]
    output: AutopayEnrollment
    side_effects: ["create ACTIVE AutopayEnrollment"]
  - method: GET
    path: "/autopay-enrollments"
    description: "List autopay enrollments (filter by loan_id, status)."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["loan_id?", "status?", "limit?", "offset?"]
    output: AutopayEnrollment[]
    side_effects: []
  - method: GET
    path: "/autopay-enrollments/{id}"
    description: "Fetch one autopay enrollment."
    roles: [Borrower, LoanServicer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AutopayEnrollment
    side_effects: []
  - method: PATCH
    path: "/autopay-enrollments/{id}"
    description: "Pause/resume/cancel an autopay enrollment."
    roles: [Borrower, LoanServicer]
    code: 200
    input: [status]
    output: AutopayEnrollment
    side_effects: ["update enrollment status"]

  # ----- Test-driving (clock + batch sweeps) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock"]
  - method: POST
    path: "/_clock/run-autopay"
    description: "Run the autopay drafting batch for all ACTIVE enrollments whose day_of_month matches the clock date; posts AUTOPAY payments. Idempotent within a billing cycle: an installment already drafted in the half-open monthly window [cycle_start, cycle_start+1month) is skipped, never double-drafted."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["for each due ACTIVE enrollment whose installment is not already drafted this cycle window: create AUTOPAY Payment; allocate_payment; cure or advance delinquency", "skip (no Payment) when the current installment was already drafted in this half-open monthly window"]
  - method: POST
    path: "/_clock/run-delinquency-sweep"
    description: "Age delinquency on all ACTIVE loans against the current clock; assess late fees; charge-off past 90 DPD."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["advance delinquency_status; compute_late_fee_assessment; CHARGED_OFF -> lifecycle DEFAULTED"]
  - method: POST
    path: "/_clock/run-bureau-sweep"
    description: "Emit monthly tri-bureau BureauReport rows for every ACTIVE/GRADUATED loan and ACTIVE card, and persist a ScoreSnapshot per account for the clock's YYYY-MM cycle. At most one BureauReport per (loan_id, tradeline_kind, cycle_label) inclusive calendar-month bucket: re-running in the same YYYY-MM bucket creates no additional rows."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["create one BureauReport per (loan, tradeline_kind) for the current YYYY-MM bucket if none exists (LOAN + SECURED_CARD); run compute_score_delta; persist one ScoreSnapshot per account per cycle", "skip emission when a BureauReport already exists for this (loan_id, tradeline_kind, cycle_label) bucket"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID, or unknown role."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the operation, or entity_backed user acting on a resource they do not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced account/loan/card/disclosure/payment/quote/enrollment does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required body field, bad type, out-of-range numeric, or unknown enum value."
  - id: ERR_ACCOUNT_NOT_ELIGIBLE
    http: 409
    condition: "Origination attempted while account.posture != ELIGIBLE (BLOCKED or FROZEN)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not valid from the resource's current state on the relevant axis."
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "Early-payoff cited a quote that is not ACTIVE or is past quote_as_of + QUOTE_TTL_HOURS."
  - id: ERR_DISCLOSURE_NOT_ACKNOWLEDGED
    http: 409
    condition: "Pinned disclosure is not ACKNOWLEDGED or its product_kind does not match the product."
  - id: ERR_APR_CAP_EXCEEDED
    http: 422
    condition: "Disclosure apr_bps exceeds the borrower's state APR cap."
  - id: ERR_SOD_CONFLICT
    http: 409
    condition: "Deposit-release actor equals the loan's funding servicer (segregation-of-duties breach)."
  - id: ERR_GRADUATION_NOT_ELIGIBLE
    http: 409
    condition: "Graduation requested with on_time_streak < 6, delinquency_status != CURRENT, or outstanding principal remaining."
  - id: ERR_DEPOSIT_NOT_RELEASABLE
    http: 409
    condition: "Deposit release requested while graduation_eligible is false or balance_cents != 0."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "Card charge would push balance_cents above credit_limit_cents."
  - id: ERR_DEPOSIT_CAP_EXCEEDED
    http: 422
    condition: "Total POSTED deposits would exceed MAX_CARD_DEPOSIT_CENTS (250000)."
  - id: ERR_INSUFFICIENT_WALLET
    http: 409
    condition: "Wallet-funded autopay draft exceeds Account.wallet_cents."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_loan_version / expected_card_version does not match the parent's current version."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Borrower
    description: "The account holder; acts on their own loans, cards, payments, disclosures, payoffs."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /disclosures/{id}/acknowledge"
      - "POST /loans/{id}/cancel"
      - "POST /loans/{id}/early-payoff"
      - "POST /secured-cards/{id}/deposits"
      - "POST /secured-cards/{id}/activate"
    shared_operations:
      - "POST /loans (with LoanServicer)"
      - "POST /payments (with LoanServicer)"
      - "POST /secured-cards (with LoanServicer)"
      - "POST /secured-cards/{id}/charges (with LoanServicer)"
      - "POST /autopay-enrollments (with LoanServicer)"
      - "PATCH /autopay-enrollments/{id} (with LoanServicer)"
      - "POST /loans/{id}/payoff-quote (with LoanServicer)"
      - "GET reads of own resources"
  - name: LoanServicer
    description: "Operations role: onboarding, funding, servicing, graduation, suspend/resume, reporting reads. Cannot release a deposit it funded (SoD)."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/kyc-decision"
      - "POST /loans/{id}/fund"
      - "POST /loans/{id}/graduate"
      - "POST /secured-cards/{id}/suspend"
      - "POST /secured-cards/{id}/resume"
    shared_operations:
      - "POST /loans (with Borrower)"
      - "POST /payments (with Borrower)"
      - "POST /secured-cards (with Borrower)"
      - "POST /secured-cards/{id}/charges (with Borrower)"
      - "POST /autopay-enrollments (with Borrower)"
      - "PATCH /autopay-enrollments/{id} (with Borrower)"
      - "POST /loans/{id}/payoff-quote (with Borrower)"
      - "GET reads"
  - name: ComplianceOfficer
    description: "Signs/issues APR-fee disclosures, freezes/unfreezes/closes accounts, releases deposits (SoD-checked)."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/disclosures"
      - "POST /accounts/{id}/freeze"
      - "POST /accounts/{id}/unfreeze"
      - "POST /accounts/{id}/close"
      - "POST /secured-cards/{id}/release-deposit"
    shared_operations:
      - "GET reads"
  - name: PlatformAdmin
    description: "Operates the logical clock and the autopay / delinquency / bureau batch sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_clock/run-autopay"
      - "POST /_clock/run-delinquency-sweep"
      - "POST /_clock/run-bureau-sweep"
    shared_operations:
      - "GET reads"
