              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v0: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Kim Sato", email: "kim@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-14T08:00:00Z", due_at: "2026-05-14T10:00:00Z", expected_gear_unit_version: "${gu_v0}" }
              as: RentalAgent
              captures: { res1_id: $.data.id, gu_v1: $.data.id }
            - call: "POST /rental/reservations/${res1_id}/confirm"
              payload: {}
              as: RentalAgent
            - call: "GET /rental/gear-units/${gu_id}"
              payload: {}
              as: RentalAgent
              captures: { gu_v_now: $.data.version }
          trigger:
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-14T10:00:00Z", due_at: "2026-05-14T12:00:00Z", expected_gear_unit_version: "${gu_v_now}" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "second reservation returns HTTP 409 with error_id == ERR_WINDOW_CONFLICT"

      - name: lesson_slot_capacity_closed_interval_touch_collides
        grounds:
          - calculations.lesson_slot_capacity
          - validations[priority=7]
          - entities.AddOn.fields.capacity_per_slot
          - entities.ReservationAddOn.fields.slot_start_at
        distinguishing_aspect: |
          LESSON add-on interval semantics differ from the unit-window rule: closed intervals
          [slot_start_at, slot_end_at] with aggregate capacity_per_slot=1, where touching
          endpoints DO collide (closed semantics) — distinct from the half-open + buffer geometry
          and on a different resource (AddOn slot, not GearUnit window).
        test_recipe:
          setup:
            - "LESSON add-on capacity_per_slot=1. One reservation already holds slot [10:00,11:00]. A second reservation requests slot [11:00,12:00] which touches at 11:00."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-15T07:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "SKI", name: "Lesson Ski", size_label: "160cm" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SKI-6" }
              as: ShopAdmin
              captures: { gu1_id: $.data.id, gu1_v: $.data.version }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "SKI-7" }
              as: ShopAdmin
              captures: { gu2_id: $.data.id, gu2_v: $.data.version }
            - call: "POST /rental/addons"
              payload: { kind: "LESSON", category: "SKI", name: "Private Ski Lesson", price_cents: 5000, capacity_per_slot: 1 }
              as: ShopAdmin
              captures: { ao_id: $.data.id }
            - call: "POST /rental/customers"
              payload: { full_name: "Lou Rae", email: "lou@x.com", skill_level: "INTERMEDIATE" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu1_id}", pickup_at: "2026-05-15T10:00:00Z", due_at: "2026-05-15T12:00:00Z", expected_gear_unit_version: "${gu1_v}" }
              as: RentalAgent
              captures: { res1_id: $.data.id }
            - call: "POST /rental/reservations/${res1_id}/addons"
              payload: { addon_id: "${ao_id}", slot_start_at: "2026-05-15T10:00:00Z", slot_end_at: "2026-05-15T11:00:00Z" }
              as: RentalAgent
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu2_id}", pickup_at: "2026-05-15T11:00:00Z", due_at: "2026-05-15T13:00:00Z", expected_gear_unit_version: "${gu2_v}" }
              as: RentalAgent
              captures: { res2_id: $.data.id }
          trigger:
            - call: "POST /rental/reservations/${res2_id}/addons"
              payload: { addon_id: "${ao_id}", slot_start_at: "2026-05-15T11:00:00Z", slot_end_at: "2026-05-15T12:00:00Z" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "second LESSON attach returns HTTP 409 with error_id == ERR_SLOT_FULL"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_deposit_money_conservation_nets_zero
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.LedgerEntry.fields.amount_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Conserved quantity = money on the reservation ledger: confirm posts DEPOSIT_HOLD(+5000),
          the compensating cancel posts DEPOSIT_REFUND(-5000); the pinned invariant
          sum(LedgerEntry.amount_cents for the reservation) == 0 must hold after the pair.
        test_recipe:
          setup:
            - "CONFIRMED reservation, deposit 5000 held."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-16T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "Sit-on", size_label: "M" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "KAY-7" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Moe Diaz", email: "moe@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-16T08:00:00Z", due_at: "2026-05-16T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
            - call: "POST /rental/reservations/${res_id}/confirm"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /rental/reservations/${res_id}/cancel"
              payload: {}
              as: RentalAgent
            - call: "GET /rental/ledger-entries?reservation_id=${res_id}"
              payload: {}
              as: RentalAgent
          assert:
            - "sum of LedgerEntry.amount_cents for reservation ${res_id} == 0"
            - "ledger contains DEPOSIT_HOLD(+5000) and DEPOSIT_REFUND(-5000)"

      - name: cancel_inventory_count_conservation_unit_returns_to_available
        grounds:
          - state_machines.GearUnit.AVAILABLE_to_RESERVED
          - state_machines.GearUnit.RESERVED_to_AVAILABLE
          - entities.GearUnit.fields.availability
        distinguishing_aspect: |
          Conserved quantity = rentable-inventory count (a DIFFERENT conserved quantity than
          money): reserving decrements the count of AVAILABLE units by 1, the compensating cancel
          increments it back; pinned invariant count(GearUnit where availability==AVAILABLE for
          this gear_type) is identical before reserve and after cancel.
        test_recipe:
          setup:
            - "One AVAILABLE unit (count of AVAILABLE for the type = 1). Reserve then cancel."
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-05-17T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "Fishing", size_label: "L" }
              as: ShopAdmin
              captures: { gt_id: $.data.id }
            - call: "POST /rental/rate-cards"
              payload: { gear_type_id: "${gt_id}", hourly_cents: 1000, daily_cents: 3000, seasonal_flat_cents: 20000, deposit_cents: 5000, damage_waiver_cents_per_day: 400, late_fee_cents_per_hour: 800, loss_fee_cents: 20000, grace_minutes: 15 }
              as: ShopAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rental/gear-units"
              payload: { gear_type_id: "${gt_id}", rate_card_id: "${rc_id}", asset_tag: "KAY-8" }
              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Nia Bell", email: "nia@x.com", skill_level: "EXPERT" }
              as: RentalAgent
              captures: { cust_id: $.data.id }
            - call: "GET /rental/gear-units?gear_type_id=${gt_id}&availability=AVAILABLE"
              payload: {}
              as: RentalAgent
              captures: { before_count: $.data.0.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-17T08:00:00Z", due_at: "2026-05-17T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: RentalAgent
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /rental/reservations/${res_id}/cancel"
              payload: {}
              as: RentalAgent
            - call: "GET /rental/gear-units?gear_type_id=${gt_id}&availability=AVAILABLE"
              payload: {}
              as: RentalAgent
              captures: { after_count: $.data.0.id }
          assert:
            - "count(GearUnit availability==AVAILABLE for gear_type ${gt_id}) before reserve == 1"
            - "count(GearUnit availability==AVAILABLE for gear_type ${gt_id}) after cancel == 1"
            - "GearUnit.${gu_id}.availability == AVAILABLE"
