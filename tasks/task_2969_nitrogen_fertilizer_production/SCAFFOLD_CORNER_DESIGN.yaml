          - endpoints[GET /nitrogen-ops/plants/{id}]
        distinguishing_aspect: |
          The shared GET surface is genuinely shared by all six roles, including the entity-backed
          TerminalOperator whose X-User-ID is a StorageAsset id rather than an opaque user string — the
          identity model does not narrow its read rights, and all six responses carry the same plant row.
        test_recipe:
