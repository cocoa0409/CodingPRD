            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 2, recipe: "MIXED_RENDER", planned_inputs: [ { batch_id: "${b_pou}", weight_lbs: 1000 } ], cook_start: "2026-08-06T06:00:00Z", cook_end: "2026-08-06T10:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { err2: $.data.error_id } }
