              as: Anonymous
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { s_id: $.data.id }
            - call: "POST /screenings/${s_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-01T06:00:00Z", end_at: "2026-09-01T10:00:00Z", role_required: "DESK", capacity: 1 }
              as: CenterManager
              captures: { sh_id: $.data.id }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v_id}" }
              as: CenterManager
              captures: { as_id: $.data.id }
            - call: "POST /shift-assignments/${as_id}/confirm"
              as: Volunteer
              as_user_id: "${v_id}"
            - call: "POST /guests"
              payload: { full_name: "G Room", category: "ACTIVE_DUTY", verification_expires_on: "2027-01-01" }
              as: Anonymous
              captures: { g_id: $.data.id }
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "FAMILY_ROOM", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T11:00:00Z" }
              as: CenterManager
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "FAMILY_ROOM", start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T11:30:00Z" }
              as: CenterManager
              captures: { err_adj: $.data.error_id }
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "FAMILY_ROOM", start_at: "2026-09-01T11:30:00Z", end_at: "2026-09-01T12:00:00Z" }
              as: CenterManager
              captures: { err_gap30: $.data.error_id }
            - call: "POST /centers/${c_id}/service-bookings"
              payload: { guest_id: "${g_id}", service_type: "FAMILY_ROOM", start_at: "2026-09-01T11:45:00Z", end_at: "2026-09-01T12:15:00Z" }
              as: CenterManager
              captures: { b4_id: $.data.id, b4_status: $.data.status }
          assert:
            - "11:00 booking (gap 0 < 45) rejected ERR_BOOKING_OVERLAP — adjacency NOT allowed for buffered rooms"
            - "11:30 booking (gap 30 < 45) rejected ERR_BOOKING_OVERLAP"
            - "11:45 booking (gap exactly 45 = ROOM_BUFFER_MINUTES) succeeds: status BOOKED (>= boundary)"
            - "guest daily minutes total 60 + 30 = 90 <= 360, so quota never interferes"

  - rule_id: compensating_invariant
    instances:
      - name: shift_confirm_cancel_capacity_invariant
        grounds:
          - state_machines.ShiftAssignment.ASSIGNED_to_CONFIRMED
          - state_machines.ShiftAssignment.CONFIRMED_to_CANCELLED
          - entities.Shift.fields.confirmed_count
        distinguishing_aspect: |
          Conserved quantity = Shift.confirmed_count (equivalently
          confirmed_count + open_slots == capacity). confirm then cancel on the
          same assignment returns confirmed_count to its pre-confirm value (0)
          and reopens the shift (FILLED -> OPEN) — zero drift after the
          compensating pair.
        test_recipe:
          setup:
            - "Clock 2026-09-01; center with ACTIVE agreement; volunteer cleared; shift tomorrow capacity 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Rho Center", airport_code: "PDX", occupancy_cap: 30, required_daily_confirmed_assignments: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 600, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /volunteers"
              payload: { full_name: "V Rho", email: "vr@x.org", home_center_id: "${c_id}" }
              as: Anonymous
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /volunteers/${v_id}/screenings"
              payload: { expected_volunteer_version: "${v_v}" }
              as: CenterManager
              captures: { s_id: $.data.id }
            - call: "POST /screenings/${s_id}/claim"
              as: CenterManager
              as_user_id: "mgr-1"
            - call: "POST /screenings/${s_id}/decide"
              payload: { verdict: "CLEARED" }
              as: CenterManager
              as_user_id: "mgr-2"
            - call: "POST /centers/${c_id}/shifts"
              payload: { start_at: "2026-09-02T08:00:00Z", end_at: "2026-09-02T12:00:00Z", role_required: "DESK", capacity: 1 }
              as: CenterManager
              captures: { sh_id: $.data.id, sh_count0: $.data.confirmed_count, sh_status0: $.data.status }
            - call: "POST /shifts/${sh_id}/assignments"
              payload: { volunteer_id: "${v_id}" }
              as: CenterManager
              captures: { as_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments/${as_id}/confirm"
              as: Volunteer
              as_user_id: "${v_id}"
            - call: "GET /shifts/${sh_id}"
              as: CenterManager
              captures: { sh_count1: $.data.confirmed_count, sh_status1: $.data.status }
            - call: "POST /shift-assignments/${as_id}/cancel"
              as: Volunteer
              as_user_id: "${v_id}"
            - call: "GET /shifts/${sh_id}"
              as: CenterManager
              captures: { sh_count2: $.data.confirmed_count, sh_status2: $.data.status }
          assert:
            - "before confirm: confirmed_count == 0, status OPEN"
            - "after confirm: confirmed_count == 1, status FILLED (capacity 1)"
            - "after compensating cancel: confirmed_count == 0, status OPEN — confirmed_count + open_slots == capacity (1) holds throughout; net drift == 0"
            - "ShiftAssignment.${as_id}.status == CANCELLED"
      - name: checkin_occupancy_roundtrip_invariant
        grounds:
          - state_machines.VisitCheckIn.CHECKED_IN_to_CHECKED_OUT
          - calculations.occupancy_count
          - entities.Center.fields.current_occupancy
        distinguishing_aspect: |
          Conserved quantity = Center.current_occupancy (a different quantity
          than the sibling's shift capacity): check-in raises it to 1 and the
          day-end run_ops sweep (compensating action) returns it to 0.
        test_recipe:
          setup:
            - "Clock 2026-09-01T20:00:00Z; center (occupancy_cap 10) with ACTIVE agreement; eligible guest"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /centers"
              payload: { name: "Sigma Center", airport_code: "SAN", occupancy_cap: 10, required_daily_confirmed_assignments: 2 }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version, occ0: $.data.current_occupancy }
            - call: "POST /centers/${c_id}/site-agreements"
              payload: { facility_space_sqft: 600, utilities_included: true, access_terms: "badge", security_level: 1, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /site-agreements/${a_id}/activate"
              payload: { expected_center_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /guests"
              payload: { full_name: "G Occ", category: "ACTIVE_DUTY", verification_expires_on: "2027-01-01" }
              as: Anonymous
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /centers/${c_id}/check-ins"
              payload: { guest_id: "${g_id}" }
              as: CenterManager
              captures: { ci_id: $.data.id }
            - call: "GET /centers/${c_id}"
              as: CenterManager
              captures: { occ1: $.data.current_occupancy }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /centers/${c_id}/run_ops"
              as: CenterManager
              captures: { occ2: $.data.current_occupancy }
            - call: "GET /check-ins/${ci_id}"
              as: CenterManager
              captures: { ci_status: $.data.status }
          assert:
            - "Center.current_occupancy == 0 before check-in"
            - "Center.current_occupancy == 1 after check-in"
            - "after day-end run_ops sweep: occupancy back to 0 (net drift == 0) and VisitCheckIn.${ci_id}.status == CHECKED_OUT"
