              as: Scheduler
            - call: "POST /_inject/appointment_history"
              payload: { center_id: "${ctr}", patient_id: "${pt7}", treatment_plan_id: "${pl7}", template_id: "${tp1}", service_date: "2026-06-15", schedule_status: "COMPLETED", chair_minutes: 240, start_minute: 540, actual_start_minute: 540, actual_end_minute: 780 }
              as: Scheduler
