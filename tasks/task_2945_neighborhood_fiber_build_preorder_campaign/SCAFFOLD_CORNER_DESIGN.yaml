            - "both trigger responses are HTTP 409 with data.error_id == ERR_FALLBACK_OFFER_STATE_INVALID"
            - "FallbackOffer.${of1}.status == DECLINED and FallbackOffer.${of2}.status == EXPIRED with responded_at == null"
            - "ServiceAddress.${a1}.active_fallback_technology == null and ServiceAddress.${a2}.active_fallback_technology == null"

      - name: construction_start_without_an_attached_pole_is_refused
