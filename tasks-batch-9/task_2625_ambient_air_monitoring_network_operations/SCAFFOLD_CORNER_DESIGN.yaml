          assert:
            - "Monitor.${mon_id}.qc_posture == QC_DELINQUENT because 369 elapsed days exceed 14 + 7"
            - "MonitoringNetwork.${net_id}.delinquent_monitor_count == 1 and waiver_required_site_count == 0"
