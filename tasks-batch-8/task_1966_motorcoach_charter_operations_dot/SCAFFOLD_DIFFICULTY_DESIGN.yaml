      - name: business_referential_vs_business_fiscal_on_deposit
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - errors[ERR_INSUFFICIENT_DEPOSIT]
          - errors[ERR_CREDIT_SUSPENDED]
        distinguishing_aspect: |
          Error-category pair: business_referential vs business_fiscal. When a customer
          with COLLECTIONS credit status tries to pay an insufficient deposit, the
          INSUFFICIENT_DEPOSIT (priority 15, business_referential) fires before
          CREDIT_SUSPENDED (priority 16, business_fiscal) would be checked.
          Wait — the deposit endpoint does not check credit_status; the conflict here is
          between insufficient deposit (priority 15) and invalid request (priority 17).
          Using: state vs business_referential — order in wrong state AND insufficient deposit.
        test_recipe:
