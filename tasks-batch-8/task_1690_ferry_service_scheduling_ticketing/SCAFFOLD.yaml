# =============================================================================
# PRD Benchmark Scaffold — Ferry Service Scheduling & Ticketing
# (Washington State Ferries style)
# =============================================================================

scenario: |
  Ferry Service Scheduling & Ticketing (Washington State Ferries style): sailing
  schedule & seasonal frequency, vehicle deck capacity vs passenger capacity
  allocation, reservation, standby lane & priority boarding rules, fare classes
  (resident/commuter/vehicle length), weather/tide cancellation & rebooking,
  crew scheduling & Coast Guard manning, terminal queue management, fuel
  surcharge & fare-setting approval

domain_name: ferry-service-scheduling-ticketing
api_prefix: /ferry

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  # Core challenge: finite vessel capacity (vehicle deck linear feet AND
  # passenger seats) is split between a reserved pool and a standby pool;
  # bookings reserve, commit, release, and the standby lane competes for the
  # remainder under priority boarding rules.
  secondary_archetype: posture_driven_gating
  # Sailing.status (SCHEDULED/OPEN_FOR_BOOKING/BOOKING_CLOSED/BOARDING/
  # DEPARTED/CANCELLED...) gates every child operation (bookings, standby
  # queue, crew assignment, check-in).
  complexity_layers:
    - cascading_side_effects      # cancel sailing -> cancel bookings -> expire queue -> credit refunds
    - dual_variant_calculation    # standard vs peak-season fare quote; reserved-first vs dynamic deck split
    - rate_threshold_triggers     # fuel surcharge breakpoint; vehicle length band boundary
    - optimistic_concurrency      # OCC on Route.version when creating a FareSchedule that supersedes the current draft
  entity_topology: hybrid
  # Route -> Sailing -> Booking/StandbyQueueEntry/CrewAssignment tree, with
  # cross-cutting references: Booking -> FareSchedule, Booking -> Customer,
  # CrewAssignment -> CrewMember, Sailing -> Vessel.
  state_machine_shape: branching
  # FareSchedule carries a revision loop (SUBMITTED -> DRAFT) inside an
  # approval chain; Booking carries a modify loop (CONFIRMED -> MODIFIED ->
  # CONFIRMED); Sailing is a forward pipeline with a CANCELLED branch from
  # several states.
  relationship_patterns:
    - one_to_many        # Route -> Sailing; Sailing -> Booking
    - cross_aggregate    # Booking.fare_schedule_id, CrewAssignment.crew_member_id
  role_model: peer_roles
  # SchedulerAdmin owns schedule/fare/vessel config; TerminalAgent owns
  # boarding/standby/queue; CrewPlanner owns manning; Customer owns own bookings.
  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Short unique route code, e.g. 'SEA-BI'" }
      - { name: origin_terminal, type: string, source: input, description: "Origin terminal name" }
      - { name: destination_terminal, type: string, source: input, description: "Destination terminal name" }
      - { name: crossing_minutes, type: integer, source: input, description: "Scheduled crossing time in minutes, > 0" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Minimum minutes between a vessel's arrival and its next departure on any route, >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE (only value in v1)", default: ACTIVE }

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: vessel_name, type: string, source: input, description: "Vessel display name, unique" }
      - { name: vehicle_deck_linear_feet, type: integer, source: input, description: "Total vehicle deck capacity in linear feet, > 0" }
      - { name: passenger_capacity, type: integer, source: input, description: "Coast Guard certified maximum passengers, > 0" }
      - { name: crew_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — drives manning requirements" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUT_OF_SERVICE", default: IN_SERVICE }

  - name: FareSchedule
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; owning route" }
      - { name: season, type: enum, source: input, description: "PEAK | OFF_PEAK — seasonal frequency/pricing band" }
      - { name: effective_from, type: datetime, source: input, description: "First instant (inclusive) this schedule may govern sailings" }
      - { name: effective_to, type: datetime, source: input, description: "Last instant (exclusive) this schedule governs; must be > effective_from" }
      - { name: passenger_standard_cents, type: integer, source: input, description: "Base adult passenger fare in cents, >= 0" }
      - { name: passenger_resident_cents, type: integer, source: input, description: "Resident-discount adult passenger fare in cents, >= 0" }
      - { name: passenger_commuter_cents, type: integer, source: input, description: "Commuter multi-ride per-crossing fare in cents, >= 0" }
      - { name: vehicle_standard_base_cents, type: integer, source: input, description: "Vehicle fare (under 22 ft), includes driver, >= 0" }
      - { name: vehicle_oversize_base_cents, type: integer, source: input, description: "Vehicle fare (22 ft and over), includes driver, >= 0" }
      - { name: vehicle_overlength_per_foot_cents, type: integer, source: input, description: "Per-foot surcharge for each foot >= 22, >= 0" }
      - { name: fuel_surcharge_cents, type: integer, source: input, description: "Flat per-fare-component fuel surcharge in cents, >= 0; set from fuel price index at submission" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | EFFECTIVE | RETIRED | REJECTED" }

  - name: Sailing
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; route this sailing runs on" }
      - { name: vessel_id, type: string, source: system, description: "FK -> Vessel.id; vessel assigned" }
      - { name: departure_time, type: datetime, source: input, description: "Scheduled departure instant (UTC)" }
      - { name: arrival_time, type: datetime, source: computed, description: "departure_time + route.crossing_minutes" }
      - { name: season, type: enum, source: input, description: "PEAK | OFF_PEAK — selects which FareSchedule governs" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN_FOR_BOOKING | BOOKING_CLOSED | BOARDING | DEPARTED | COMPLETED | CANCELLED" }
      - { name: cancel_reason, type: enum, source: system, description: "WEATHER | TIDES | MECHANICAL | CREW_SHORTAGE | OTHER; null unless CANCELLED" }
      - { name: reserved_vehicle_feet, type: integer, source: computed, description: "Sum of vehicle_length_feet over Bookings in RESERVED/CONFIRMED/MODIFIED/CHECKED_IN/BOARDED with a vehicle (reservations hold deck space from quote time)" }
      - { name: standby_cleared_feet, type: integer, source: computed, description: "Sum of vehicle_length_feet over StandbyQueueEntries in CLEARED with a vehicle" }
      - { name: booked_passengers, type: integer, source: computed, description: "Sum of passenger_count over Bookings in RESERVED/CONFIRMED/MODIFIED/CHECKED_IN/BOARDED plus CLEARED standby passengers" }
      - { name: reserved_deck_allotment_feet, type: integer, source: computed, description: "Deck feet reserved for reservations per vehicle_deck_allocation; remainder is standby pool" }
      - { name: manning_ok, type: boolean, source: computed, description: "true iff crew_manning_compliance passes for this sailing" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer display name" }
      - { name: email, type: string, source: input, description: "Unique contact email" }
      - { name: fare_class, type: enum, source: input, description: "STANDARD | RESIDENT | COMMUTER — eligibility class set at registration" }
      - { name: refund_credit_cents, type: integer, source: computed, description: "Outstanding refund credit from operator cancellations; never negative", default: 0 }

  - name: Booking
    parent: Sailing
    common_fields: true
    fields:
      - { name: sailing_id, type: string, source: system, description: "FK -> Sailing.id; sailing booked" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; booking owner" }
      - { name: fare_schedule_id, type: string, source: system, description: "FK -> FareSchedule.id; schedule pinned at quote time" }
      - { name: passenger_count, type: integer, source: input, description: "Passengers covered excluding vehicle driver, >= 0" }
      - { name: has_vehicle, type: boolean, source: input, description: "Whether the booking brings a vehicle" }
      - { name: vehicle_length_feet, type: integer, source: input, description: "Vehicle length in whole feet, >= 1; required iff has_vehicle" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | MODIFIED | CHECKED_IN | BOARDED | COMPLETED | CANCELLED | NO_SHOW | REBOOKED" }
      - { name: quoted_fare_cents, type: integer, source: computed, description: "Fare quoted at reservation per booking_fare_quote" }
      - { name: final_fare_cents, type: integer, source: computed, description: "Fare settled at confirmation (re-quoted if schedule changed); equals quoted_fare_cents unless schedule retired" }
      - { name: rebooked_to_booking_id, type: string, source: system, description: "FK -> Booking.id; successor booking when status = REBOOKED, else null" }

  - name: StandbyQueueEntry
    parent: Sailing
    common_fields: true
    fields:
      - { name: sailing_id, type: string, source: system, description: "FK -> Sailing.id; sailing queued for" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; queued customer" }
      - { name: has_vehicle, type: boolean, source: input, description: "Whether a vehicle is queued" }
      - { name: vehicle_length_feet, type: integer, source: input, description: "Vehicle length in feet, >= 1; required iff has_vehicle" }
      - { name: passenger_count, type: integer, source: input, description: "Passengers in party, >= 1" }
      - { name: priority_class, type: enum, source: input, description: "MEDICAL | COMMUTER | STANDARD — boarding priority band" }
      - { name: queued_at, type: datetime, source: system, description: "Server-stamped join time; queue order key" }
      - { name: status, type: enum, source: system, description: "WAITING | CALLED | CLEARED | EXPIRED | NO_BOARD" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Crew member name" }
      - { name: credential_class, type: enum, source: input, description: "DECK | ENGINE | CAPTAIN — Coast Guard credential class" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | OFF_DUTY", default: AVAILABLE }

  - name: CrewAssignment
    parent: Sailing
    common_fields: true
    fields:
      - { name: sailing_id, type: string, source: system, description: "FK -> Sailing.id; sailing staffed" }
      - { name: crew_member_id, type: string, source: system, description: "FK -> CrewMember.id; assigned crew member" }
      - { name: shift_start, type: datetime, source: input, description: "Shift start (UTC); half-open interval start" }
      - { name: shift_end, type: datetime, source: input, description: "Shift end (UTC); must be > shift_start" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: FareSchedule
    initial_state: DRAFT
    terminal_states: [RETIRED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ferry/fare-schedules/{id}/submit"
        actor: SchedulerAdmin
        preconditions:
          - "Route.status == ACTIVE"
          - "effective_from < effective_to"
          - "No other FareSchedule for same route_id + season with status in {SUBMITTED, APPROVED, EFFECTIVE} and overlapping [effective_from, effective_to) window"
        side_effects:
          - "increments FareSchedule.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ferry/fare-schedules/{id}/approve"
        actor: SchedulerAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increments FareSchedule.version by 1"

      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /ferry/fare-schedules/{id}/return-for-revision"
        actor: SchedulerAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increments FareSchedule.version by 1"
          - "note: revision loop — schedule may be edited in DRAFT and resubmitted"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ferry/fare-schedules/{id}/reject"
        actor: SchedulerAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increments FareSchedule.version by 1"

      - from: APPROVED
        to: EFFECTIVE
        trigger: "system (logical clock reaches effective_from; evaluated both on POST /ferry/_clock/set_current_utc and lazily whenever a FareSchedule is read or consulted)"
        actor: system
        preconditions:
          - "current_utc >= effective_from AND current_utc < effective_to"
        side_effects:
          - "Any other FareSchedule for same route_id + season in EFFECTIVE -> RETIRED"
          - "Every Booking with fare_schedule_id == retired schedule id AND status in {RESERVED, CONFIRMED, MODIFIED} -> flagged for requote: final_fare_cents recomputed against the newly EFFECTIVE schedule at next confirmation"

      - from: EFFECTIVE
        to: RETIRED
        trigger: "system (superseded by a newly EFFECTIVE schedule for same route+season, or logical clock reaches effective_to; same lazy evaluation points as APPROVED -> EFFECTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "increments FareSchedule.version by 1"

  - entity: Sailing
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OPEN_FOR_BOOKING
        trigger: "POST /ferry/sailings/{id}/open-booking"
        actor: SchedulerAdmin
        preconditions:
          - "Route.status == ACTIVE"
          - "Vessel.status == IN_SERVICE"
          - "An EFFECTIVE FareSchedule exists for route_id + season covering departure_time"
          - "manning_ok == true (crew_manning_compliance passes)"
        side_effects:
          - "reserved_deck_allotment_feet computed per vehicle_deck_allocation"
          - "increments Sailing.version by 1"

      - from: OPEN_FOR_BOOKING
        to: BOOKING_CLOSED
        trigger: "POST /ferry/sailings/{id}/close-booking"
        actor: SchedulerAdmin
        preconditions:
          - "status == OPEN_FOR_BOOKING"
        side_effects:
          - "No new Bookings or StandbyQueueEntries accepted after this point"
          - "increments Sailing.version by 1"

      - from: BOOKING_CLOSED
        to: BOARDING
        trigger: "POST /ferry/sailings/{id}/begin-boarding"
        actor: TerminalAgent
        preconditions:
          - "status == BOOKING_CLOSED"
          - "manning_ok == true"
        side_effects:
          - "standby clearance runs per standby_clearance_count: StandbyQueueEntry WAITING -> CALLED -> CLEARED while standby pool capacity remains"
          - "increments Sailing.version by 1"

      - from: BOARDING
        to: DEPARTED
        trigger: "POST /ferry/sailings/{id}/depart"
        actor: TerminalAgent
        preconditions:
          - "status == BOARDING"
        side_effects:
          - "Bookings in CONFIRMED or MODIFIED (never checked in) -> NO_SHOW; their vehicle feet and passenger counts are released (reserved_vehicle_feet / booked_passengers recomputed)"
          - "StandbyQueueEntries still WAITING or CALLED but not CLEARED -> NO_BOARD"
          - "increments Sailing.version by 1"

      - from: DEPARTED
        to: COMPLETED
        trigger: "POST /ferry/sailings/{id}/complete"
        actor: TerminalAgent
        preconditions:
          - "status == DEPARTED"
        side_effects:
          - "Bookings in BOARDED -> COMPLETED"
          - "CrewAssignments in ASSIGNED -> RELEASED; each CrewMember with no remaining ASSIGNED assignments -> AVAILABLE"
          - "increments Sailing.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ferry/sailings/{id}/cancel"
        actor: SchedulerAdmin
        preconditions:
          - "status in {SCHEDULED, OPEN_FOR_BOOKING, BOOKING_CLOSED, BOARDING}"
        side_effects:
          - "cancel_reason set from input"
          - "Every Booking in {RESERVED, CONFIRMED, MODIFIED, CHECKED_IN} -> CANCELLED; Customer.refund_credit_cents += final_fare_cents for each cancelled booking (cascade hop 1)"
          - "Every StandbyQueueEntry in {WAITING, CALLED} -> EXPIRED (cascade hop 2, triggered by hop 1's booking cancellations releasing the sailing)"
          - "CrewAssignments in ASSIGNED -> RELEASED; CrewMember with no remaining ASSIGNED assignments -> AVAILABLE (cascade hop 3, triggered by hop 2's sailing-level release sweep)"
          - "increments Sailing.version by 1"

      - from: OPEN_FOR_BOOKING
        to: CANCELLED
        trigger: "POST /ferry/sailings/{id}/cancel"
        actor: SchedulerAdmin
        preconditions:
          - "status in {SCHEDULED, OPEN_FOR_BOOKING, BOOKING_CLOSED, BOARDING}"
        side_effects:
          - "same cascade as SCHEDULED -> CANCELLED"

      - from: BOOKING_CLOSED
        to: CANCELLED
        trigger: "POST /ferry/sailings/{id}/cancel"
        actor: SchedulerAdmin
        preconditions:
          - "status in {SCHEDULED, OPEN_FOR_BOOKING, BOOKING_CLOSED, BOARDING}"
        side_effects:
          - "same cascade as SCHEDULED -> CANCELLED"

      - from: BOARDING
        to: CANCELLED
        trigger: "POST /ferry/sailings/{id}/cancel"
        actor: SchedulerAdmin
        preconditions:
          - "status in {SCHEDULED, OPEN_FOR_BOOKING, BOOKING_CLOSED, BOARDING}"
        side_effects:
          - "same cascade as SCHEDULED -> CANCELLED; additionally StandbyQueueEntries in CLEARED remain CLEARED (already boarded ashore side) but their passengers are not charged"

  - entity: Booking
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, REBOOKED]
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /ferry/bookings/{id}/confirm"
        actor: Customer
        preconditions:
          - "Booking.customer_id == acting Customer id"
          - "Sailing.status in {OPEN_FOR_BOOKING, BOOKING_CLOSED}"
          - "fare_schedule pinned (fare_schedule_id) is EFFECTIVE, else requote against currently EFFECTIVE schedule before confirm"
        side_effects:
          - "final_fare_cents settled (== quoted_fare_cents when pinned schedule still EFFECTIVE)"
          - "Sailing.reserved_vehicle_feet and booked_passengers recomputed"
          - "increments Booking.version by 1"

      - from: CONFIRMED
        to: MODIFIED
        trigger: "POST /ferry/bookings/{id}/modify"
        actor: Customer
        preconditions:
          - "Booking.customer_id == acting Customer id"
          - "Sailing.status == OPEN_FOR_BOOKING"
          - "If has_vehicle grows or vehicle_length_feet increases: requested feet fit in remaining reservation pool"
        side_effects:
          - "Booking fields replaced by modification payload; quoted_fare_cents recomputed"
          - "increments Booking.version by 1"

      - from: MODIFIED
        to: CONFIRMED
        trigger: "POST /ferry/bookings/{id}/confirm"
        actor: Customer
        preconditions:
          - "same as RESERVED -> CONFIRMED"
        side_effects:
          - "same as RESERVED -> CONFIRMED (modify loop closes)"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /ferry/bookings/{id}/check-in"
        actor: TerminalAgent
        preconditions:
          - "Sailing.status in {BOOKING_CLOSED, BOARDING}"
        side_effects:
          - "increments Booking.version by 1"

      - from: CHECKED_IN
        to: BOARDED
        trigger: "POST /ferry/bookings/{id}/board"
        actor: TerminalAgent
        preconditions:
          - "Sailing.status == BOARDING"
        side_effects:
          - "increments Booking.version by 1"

      - from: BOARDED
        to: COMPLETED
        trigger: "system (sailing completes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (sailing departs with booking not checked in)"
        actor: system
        preconditions: []
        side_effects:
          - "fare forfeited — no refund credit"

      - from: MODIFIED
        to: NO_SHOW
        trigger: "system (sailing departs with booking not checked in)"
        actor: system
        preconditions: []
        side_effects:
          - "fare forfeited — no refund credit"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /ferry/bookings/{id}/cancel"
        actor: Customer
        preconditions:
          - "Booking.customer_id == acting Customer id"
        side_effects:
          - "no fare was settled; no refund"
          - "Sailing aggregates recomputed"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /ferry/bookings/{id}/cancel"
        actor: Customer
        preconditions:
          - "Booking.customer_id == acting Customer id"
          - "Sailing.status == OPEN_FOR_BOOKING"
        side_effects:
          - "Customer.refund_credit_cents += final_fare_cents"
          - "Sailing.reserved_vehicle_feet and booked_passengers recomputed"

      - from: RESERVED
        to: CANCELLED
        trigger: "system (sailing cancelled by operator)"
        actor: system
        preconditions: []
        side_effects:
          - "no refund (nothing settled)"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (sailing cancelled by operator)"
        actor: system
        preconditions: []
        side_effects:
          - "Customer.refund_credit_cents += final_fare_cents"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system (sailing cancelled by operator)"
        actor: system
        preconditions: []
        side_effects:
          - "Customer.refund_credit_cents += final_fare_cents"

      - from: CANCELLED
        to: REBOOKED
        trigger: "POST /ferry/bookings/{id}/rebook"
        actor: Customer
        preconditions:
          - "Booking.customer_id == acting Customer id"
          - "cancel originated from operator (Sailing.status == CANCELLED)"
          - "target sailing status == OPEN_FOR_BOOKING with sufficient reservation pool capacity"
        side_effects:
          - "New Booking created on target sailing in CONFIRMED with same passenger_count/vehicle specs; final_fare_cents carried over from cancelled booking (no additional charge, no refund of difference)"
          - "rebooked_to_booking_id set to new Booking id"
          - "Customer.refund_credit_cents for the cancelled booking's fare is consumed (decremented by final_fare_cents)"

  - entity: StandbyQueueEntry
    initial_state: WAITING
    terminal_states: [CLEARED, EXPIRED, NO_BOARD]
    transitions:
      - from: WAITING
        to: CALLED
        trigger: "system (standby_clearance_count during begin-boarding)"
        actor: system
        preconditions:
          - "Sailing.status transitions to BOARDING"
          - "entry is next in priority order and fits remaining standby pool"
        side_effects: []

      - from: CALLED
        to: CLEARED
        trigger: "system (same clearance sweep, after feet/passengers debited)"
        actor: system
        preconditions: []
        side_effects:
          - "Sailing.standby_cleared_feet and booked_passengers recomputed"

      - from: WAITING
        to: EXPIRED
        trigger: "system (sailing cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: WAITING
        to: EXPIRED
        trigger: "POST /ferry/standby-queue/{id}/leave"
        actor: Customer
        preconditions:
          - "StandbyQueueEntry.customer_id == acting Customer id"
          - "status == WAITING"
        side_effects: []

      - from: CALLED
        to: EXPIRED
        trigger: "system (sailing cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: WAITING
        to: NO_BOARD
        trigger: "system (sailing departs)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CALLED
        to: NO_BOARD
        trigger: "system (sailing departs before clearance debit completes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CrewMember
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "POST /ferry/sailings/{sailing_id}/crew-assignments"
        actor: CrewPlanner
        preconditions:
          - "CrewMember.status == AVAILABLE"
        side_effects: []

      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (all CrewAssignments RELEASED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: OFF_DUTY
        trigger: "POST /ferry/crew-members/{id}/set-off-duty"
        actor: CrewPlanner
        preconditions: []
        side_effects: []

      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /ferry/crew-members/{id}/set-available"
        actor: CrewPlanner
        preconditions: []
        side_effects: []

  - entity: CrewAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /ferry/crew-assignments/{id}/release"
        actor: CrewPlanner
        preconditions:
          - "Sailing.status not in {DEPARTED}"
        side_effects:
          - "Sailing.manning_ok recomputed"
          - "CrewMember -> AVAILABLE when no remaining ASSIGNED assignments"

      - from: ASSIGNED
        to: RELEASED
        trigger: "system (sailing completes or is cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "CrewMember -> AVAILABLE when no remaining ASSIGNED assignments"

# =============================================================================
# §1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: fare-schedule-create-stale-route
    parent_entity: Route
    write_endpoint: "POST /ferry/routes/{route_id}/fare-schedules"
    occ_field: "expected_route_version"
    description: |
      Creating a FareSchedule against a Route whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just created a FareSchedule (which legitimately
      supersedes the route's prior DRAFT for the same season under §fare
      governance) and the current writer's view of the route is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_fare_quote
    trigger: "booking create (quote), booking modify (re-quote), booking confirm when pinned schedule was RETIRED (re-quote)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned (mode (b): per-component rounding then sum).
      # Step 1 — passenger component, per passenger class:
      #   passenger_rate = passenger_standard_cents      if Customer.fare_class == STANDARD
      #                    passenger_resident_cents      if Customer.fare_class == RESIDENT
      #                    passenger_commuter_cents      if Customer.fare_class == COMMUTER
      #   passenger_component = passenger_count * passenger_rate
      # Step 2 — vehicle component (0 when has_vehicle == false):
      #   if vehicle_length_feet < 22:
      #       vehicle_component = vehicle_standard_base_cents
      #   else:
      #       vehicle_component = vehicle_oversize_base_cents
      #                         + (vehicle_length_feet - 21) * vehicle_overlength_per_foot_cents
      #   (boundary: length 21 -> standard band; length 22 -> oversize band with
      #    (22 - 21) = 1 surcharge foot)
      # Step 3 — fuel surcharge applies per FARE COMPONENT PRESENT:
      #   surcharge_component = fuel_surcharge_cents * (1 if passenger_count > 0 else 0
      #                                                 + 1 if has_vehicle else 0)
      # Step 4 — total:
      #   quoted_fare_cents = passenger_component + vehicle_component + surcharge_component
      # All inputs are integer cents; rounding mode only matters in the
      # peak_load_variant below and is pinned there.
    input_set: "The FareSchedule pinned by Booking.fare_schedule_id (or the currently EFFECTIVE schedule on re-quote); Customer.fare_class; Booking passenger_count / has_vehicle / vehicle_length_feet"
    constants:
      OVERSIZE_LENGTH_THRESHOLD_FEET: 22
    precision: "integer cents; no fractional rounding in base variant"
    variants:
      - name: peak_load_variant
        when: "Sailing.season == PEAK"
        difference: |
          A peak-load multiplier of 1.25 applies to the vehicle component ONLY
          (passenger component and surcharge unchanged):
            vehicle_component = round_half_up(vehicle_component * 1.25)
          Rounding is pinned: multiply the fully-computed vehicle component by
          1.25 and round_half_up to integer cents BEFORE adding passenger and
          surcharge components. Rounding each per-foot surcharge first and then
          summing produces different cents and is FORBIDDEN.
      - name: off_peak_variant
        when: "Sailing.season == OFF_PEAK"
        difference: "Base formula as written; no multiplier."

  - name: vehicle_deck_allocation
    trigger: "Sailing SCHEDULED -> OPEN_FOR_BOOKING (allotment pinned at open)"
    algorithm: waterfall_allocation
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction (nested min/max,
      # conditional branch on season).
      # Inputs: vessel.vehicle_deck_linear_feet (D), season (S),
      #         configured ratio R (0.70 PEAK / 0.60 OFF_PEAK),
      #         minimum standby floor F (40 feet).
      ratio = 0.70 if S == PEAK else 0.60
      raw_reserved = floor(D * ratio)
      # Standby pool must keep at least F feet; reservation pool must keep at
      # least 20 feet.
      reserved_deck_allotment_feet = max(20, min(raw_reserved, D - F))
      standby_pool_feet = D - reserved_deck_allotment_feet
      # Invariant (Rule 9): reserved_deck_allotment_feet + standby_pool_feet == D
    input_set: "Vessel assigned to the Sailing; Sailing.season"
    constants:
      PEAK_RESERVED_RATIO: 0.70
      OFF_PEAK_RESERVED_RATIO: 0.60
      STANDBY_FLOOR_FEET: 40
      RESERVED_FLOOR_FEET: 20
    precision: "integer feet; floor for raw_reserved"
    variants:
      - name: reserved_first_variant
        when: "default — allocation pinned at open-booking time"
        difference: "Allotment computed once at open and frozen for the sailing's life."
      - name: dynamic_ratio_variant
        when: "never applied automatically; used only by the what-if projection endpoint GET /ferry/sailings/{id}/deck-projection to show operators how a different ratio would split the SAME deck"
        difference: "Recomputes with caller-supplied ratio in place of the season ratio; produces a different split for identical vessel+season inputs."

  - name: standby_clearance_count
    trigger: "Sailing BOOKING_CLOSED -> BOARDING (single sweep)"
    algorithm: chronological
    formula: |
      # Candidate set: StandbyQueueEntry with status == WAITING for this sailing.
      # Ranking: priority_class band first (MEDICAL < COMMUTER < STANDARD in
      #   sort order, i.e. MEDICAL highest), then queued_at ASC (earliest first).
      #   Tie-break beyond queued_at is impossible (server-stamped unique).
      # Sweep in ranked order; for each entry:
      #   needed_feet = vehicle_length_feet if has_vehicle else 0
      #   remaining_standby = standby_pool_feet - standby_cleared_feet_running
      #   remaining_pax    = vessel.passenger_capacity - booked_passengers_running
      #   CLEAR iff needed_feet <= remaining_standby AND passenger_count <= remaining_pax
      #   on clear: WAITING -> CALLED -> CLEARED; debit running counters.
      #   on first entry that does NOT fit: entry stays WAITING; continue to next
      #   (skip-over is allowed — a small later vehicle may still clear).
      # Boundary: needed_feet == remaining_standby CLEARS (<=, not <).
      # Boundary: remaining_standby == 0 -> only walk-on entries (needed_feet==0)
      #   can still clear, subject to passenger capacity.
    input_set: "StandbyQueueEntry status==WAITING for the sailing; Sailing reserved/standby counters; Vessel passenger_capacity"
    constants: {}
    precision: "integer feet and passengers; no rounding"
    variants: []

  - name: crew_manning_compliance
    trigger: "crew assignment create/release; Sailing open-booking and begin-boarding precondition checks"
    algorithm: threshold
    formula: |
      # Coast Guard manning table by vessel crew_class (minimum counts among
      # CrewAssignments with status == ASSIGNED for the sailing):
      #   SMALL:  >=1 CAPTAIN, >=1 DECK
      #   MEDIUM: >=1 CAPTAIN, >=2 DECK, >=1 ENGINE
      #   LARGE:  >=1 CAPTAIN, >=3 DECK, >=2 ENGINE
      # Additional passenger-load escalator (boundary precision):
      #   if booked_passengers > 500: required DECK +1 (strictly greater;
      #   exactly 500 does NOT trigger the extra deckhand).
      # manning_ok = all minimums met.
    input_set: "CrewAssignment status==ASSIGNED joined to CrewMember.credential_class; Vessel.crew_class; Sailing.booked_passengers"
    constants:
      PASSENGER_ESCALATOR_THRESHOLD: 500
    precision: "integer headcounts"
    variants: []

  - name: fuel_surcharge_determination
    trigger: "FareSchedule DRAFT -> SUBMITTED (surcharge pinned at submission)"
    algorithm: threshold
    formula: |
      # Input: fuel_price_index_cents provided at submission.
      #   index < 300            -> fuel_surcharge_cents = 0
      #   300 <= index < 500     -> fuel_surcharge_cents = 100
      #   index >= 500           -> fuel_surcharge_cents = 250
      # Boundary: index exactly 300 -> 100 (>= semantics); index exactly 500 -> 250.
    input_set: "fuel_price_index_cents submitted with the FareSchedule"
    constants:
      TIER1_LOW_CENTS: 300
      TIER2_LOW_CENTS: 500
      TIER1_SURCHARGE_CENTS: 100
      TIER2_SURCHARGE_CENTS: 250
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (route, then sailing/booking/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource in a legal state for the operation per its state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: state
    check: "Sailing.status permits new ticketing activity (OPEN_FOR_BOOKING for create; BOOKING_CLOSED/BOARDING for check-in; BOARDING for board)"
    error_id: ERR_SAILING_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /ferry/sailings/{id}/bookings, POST /ferry/sailings/{id}/standby-queue, check-in, board"

  - priority: 6
    category: business_temporal
    check: "FareSchedule effective_from < effective_to; submission window does not overlap another live schedule for same route+season"
    error_id: ERR_SCHEDULE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "fare-schedule create/submit"

  - priority: 7
    category: business_referential
    check: "Customer may only act on own bookings/queue entries (X-User-ID == customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "booking confirm/modify/cancel/rebook, standby join/leave"

  - priority: 8
    category: business_safety
    check: "Crew manning minimums satisfied for vessel crew_class and passenger load"
    error_id: ERR_MANNING_SHORTFALL
    http_status: 409
    applies_to: "sailing open-booking, begin-boarding, crew-assignment release"

  - priority: 9
    category: business_safety
    check: "Vessel temporal overlap: no two non-CANCELLED sailings for the same vessel where [departure_time, arrival_time + turnaround_minutes) intersects"
    error_id: ERR_VESSEL_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "sailing create"

  - priority: 10
    category: business_temporal
    check: "Crew temporal overlap: no two ASSIGNED CrewAssignments for the same crew member where half-open [shift_start, shift_end) intervals overlap or leave < 480 minutes rest between them"
    error_id: ERR_CREW_REST_CONFLICT
    http_status: 409
    applies_to: "crew-assignment create"

  - priority: 11
    category: business_constraint
    check: "vehicle_length_feet >= 1 and <= 80 when has_vehicle; passenger_count >= 1 for standby entries"
    error_id: ERR_INVALID_PARTY_SPEC
    http_status: 400
    applies_to: "booking create/modify, standby join"

  - priority: 12
    category: business_constraint
    check: "vehicle_length_feet must not exceed 60 for standby queue entries (standby lane cannot stage oversize loads over 60 ft)"
    error_id: ERR_VEHICLE_LENGTH_EXCEEDS
    http_status: 422
    applies_to: "POST /ferry/sailings/{id}/standby-queue"

  - priority: 13
    category: business_fiscal
    check: "An EFFECTIVE FareSchedule covers the sailing's route+season at booking time"
    error_id: ERR_FARE_SCHEDULE_NOT_EFFECTIVE
    http_status: 409
    applies_to: "booking create/confirm"

  - priority: 14
    category: business_fiscal
    check: "Reservation pool capacity: reserved_vehicle_feet + requested vehicle feet <= reserved_deck_allotment_feet; booked_passengers + passenger_count <= passenger_capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "booking create/modify/confirm, rebook"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_route_version matches Route.version on fare-schedule create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ferry/routes/{route_id}/fare-schedules"

  - priority: 16
    category: business_constraint
    check: "Route.route_code unique; Vessel.vessel_name unique; Customer.email unique; one WAITING standby entry per customer per sailing"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "route/vessel/customer create, standby join"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/ferry/_clock/set_current_utc"
    description: "Set the logical clock. Before any set call, the logical clock reads exactly 2026-08-01T00:00:00Z (fixed server default; never falls back to wall-clock)."
    roles: [SchedulerAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "Advance-based auto transitions evaluated: APPROVED FareSchedules whose window now covers current_utc -> EFFECTIVE (superseding prior EFFECTIVE -> RETIRED); EFFECTIVE schedules past effective_to -> RETIRED"

  # --- Route ---
  - method: POST
    path: "/ferry/routes"
    description: "Create a route"
    roles: [SchedulerAdmin]
    code: 201
    input: [route_code, origin_terminal, destination_terminal, crossing_minutes, turnaround_minutes]
    output: Route
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/ferry/routes/{id}"
    description: "Get a route"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: GET
    path: "/ferry/routes"
    description: "List routes"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Route[]
    side_effects: []

  - method: GET
    path: "/ferry/routes/{id}/fare-schedules"
    description: "List fare schedules for a route"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: ["season?", "status?", "limit?", "offset?"]
    output: FareSchedule[]
    side_effects: []

  - method: GET
    path: "/ferry/routes/{id}/sailings"
    description: "List sailings for a route"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: ["status?", "season?", "limit?", "offset?"]
    output: Sailing[]
    side_effects: []

  # --- Vessel ---
  - method: POST
    path: "/ferry/vessels"
    description: "Register a vessel"
    roles: [SchedulerAdmin]
    code: 201
    input: [vessel_name, vehicle_deck_linear_feet, passenger_capacity, crew_class]
    output: Vessel
    side_effects: ["status = IN_SERVICE"]

  - method: GET
    path: "/ferry/vessels/{id}"
    description: "Get a vessel"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: GET
    path: "/ferry/vessels"
    description: "List vessels"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vessel[]
    side_effects: []

  - method: POST
    path: "/ferry/vessels/{id}/set-out-of-service"
    description: "Take a vessel out of service"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: Vessel
    side_effects:
      - "SCHEDULED sailings using this vessel -> CANCELLED with cancel_reason=MECHANICAL (booking/queue/crew cascades fire)"

  # --- FareSchedule ---
  - method: POST
    path: "/ferry/routes/{route_id}/fare-schedules"
    description: "Create a fare schedule draft (OCC-guarded on Route.version)"
    roles: [SchedulerAdmin]
    code: 201
    input: [season, effective_from, effective_to, passenger_standard_cents, passenger_resident_cents, passenger_commuter_cents, vehicle_standard_base_cents, vehicle_oversize_base_cents, vehicle_overlength_per_foot_cents, fuel_surcharge_cents, expected_route_version]
    output: FareSchedule
    side_effects: ["status = DRAFT", "increments Route.version by 1"]

  - method: GET
    path: "/ferry/fare-schedules/{id}"
    description: "Get a fare schedule"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: []
    output: FareSchedule
    side_effects: []

  - method: POST
    path: "/ferry/fare-schedules/{id}/submit"
    description: "Submit a draft for approval; fuel surcharge re-pinned from fuel_price_index"
    roles: [SchedulerAdmin]
    code: 200
    input: [fuel_price_index_cents]
    output: FareSchedule
    side_effects: ["fuel_surcharge_determination runs; fuel_surcharge_cents overwritten", "status -> SUBMITTED"]

  - method: POST
    path: "/ferry/fare-schedules/{id}/approve"
    description: "Approve a submitted schedule"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: FareSchedule
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/ferry/fare-schedules/{id}/return-for-revision"
    description: "Return a submitted schedule to DRAFT (revision loop)"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: FareSchedule
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/ferry/fare-schedules/{id}/reject"
    description: "Reject a submitted schedule (terminal)"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: FareSchedule
    side_effects: ["status -> REJECTED"]

  # --- Sailing ---
  - method: POST
    path: "/ferry/routes/{route_id}/sailings"
    description: "Schedule a sailing"
    roles: [SchedulerAdmin]
    code: 201
    input: [vessel_id, departure_time, season]
    output: Sailing
    side_effects: ["status = SCHEDULED", "arrival_time computed", "vessel overlap validation (buffered interval)"]

  - method: GET
    path: "/ferry/sailings/{id}"
    description: "Get a sailing with computed counters"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: []
    output: Sailing
    side_effects: []

  - method: GET
    path: "/ferry/sailings"
    description: "List sailings across routes (filtered-list form for vessel FK reverse-reachability)"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: ["vessel_id?", "status?", "season?", "limit?", "offset?"]
    output: Sailing[]
    side_effects: []

  - method: GET
    path: "/ferry/sailings/{id}/bookings"
    description: "List bookings on a sailing"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: ["status?", "customer_id?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/ferry/sailings/{id}/standby-queue"
    description: "List standby queue entries for a sailing"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StandbyQueueEntry[]
    side_effects: []

  - method: GET
    path: "/ferry/sailings/{id}/crew-assignments"
    description: "List crew assignments for a sailing"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: GET
    path: "/ferry/sailings/{id}/deck-projection"
    description: "What-if deck split under a caller-supplied ratio (dynamic_ratio_variant)"
    roles: [SchedulerAdmin, TerminalAgent]
    code: 200
    input: [ratio]
    output: { reserved_deck_allotment_feet: integer, standby_pool_feet: integer }
    side_effects: []

  - method: POST
    path: "/ferry/sailings/{id}/open-booking"
    description: "Open a sailing for reservations"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: Sailing
    side_effects: ["vehicle_deck_allocation pins reserved_deck_allotment_feet", "status -> OPEN_FOR_BOOKING"]

  - method: POST
    path: "/ferry/sailings/{id}/close-booking"
    description: "Close reservations"
    roles: [SchedulerAdmin]
    code: 200
    input: []
    output: Sailing
    side_effects: ["status -> BOOKING_CLOSED"]

  - method: POST
    path: "/ferry/sailings/{id}/begin-boarding"
    description: "Begin boarding; runs standby clearance sweep"
    roles: [TerminalAgent]
    code: 200
    input: []
    output: Sailing
    side_effects: ["standby_clearance_count sweep runs", "status -> BOARDING"]

  - method: POST
    path: "/ferry/sailings/{id}/depart"
    description: "Depart; no-show sweep and standby NO_BOARD sweep"
    roles: [TerminalAgent]
    code: 200
    input: []
    output: Sailing
    side_effects: ["CONFIRMED/MODIFIED bookings not checked in -> NO_SHOW", "WAITING/CALLED queue entries -> NO_BOARD", "status -> DEPARTED"]

  - method: POST
    path: "/ferry/sailings/{id}/complete"
    description: "Complete the sailing after arrival"
    roles: [TerminalAgent]
    code: 200
    input: []
    output: Sailing
    side_effects: ["BOARDED bookings -> COMPLETED", "crew assignments released", "status -> COMPLETED"]

  - method: POST
    path: "/ferry/sailings/{id}/cancel"
    description: "Cancel a sailing (weather/tide/mechanical/crew shortage)"
    roles: [SchedulerAdmin]
    code: 200
    input: [cancel_reason]
    output: Sailing
    side_effects: ["booking cancellation cascade with refund credits", "standby expiry cascade", "crew release cascade", "status -> CANCELLED"]

  # --- Customer ---
  - method: POST
    path: "/ferry/customers"
    description: "Register a customer"
    roles: [SchedulerAdmin]
    code: 201
    input: [full_name, email, fare_class]
    output: Customer
    side_effects: ["refund_credit_cents = 0"]

  - method: GET
    path: "/ferry/customers/{id}"
    description: "Get a customer"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/ferry/customers/{id}/bookings"
    description: "List a customer's bookings"
    roles: [SchedulerAdmin, TerminalAgent, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/ferry/customers/{id}/standby-queue"
    description: "List a customer's standby queue entries (sub-resource form for customer FK reverse-reachability)"
    roles: [SchedulerAdmin, TerminalAgent, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StandbyQueueEntry[]
    side_effects: []

  # --- Booking ---
  - method: POST
    path: "/ferry/sailings/{sailing_id}/bookings"
    description: "Create a booking (reservation) on an open sailing"
    roles: [Customer]
    code: 201
    input: [customer_id, passenger_count, has_vehicle, "vehicle_length_feet?"]
    output: Booking
    side_effects: ["booking_fare_quote runs; quoted_fare_cents pinned; fare_schedule_id pinned to currently EFFECTIVE schedule", "status = RESERVED"]

  - method: GET
    path: "/ferry/bookings/{id}"
    description: "Get a booking"
    roles: [SchedulerAdmin, TerminalAgent, Customer]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/ferry/bookings"
    description: "List bookings across sailings (filtered-list form for fare-schedule and rebooked-to FK reverse-reachability)"
    roles: [SchedulerAdmin, TerminalAgent, Customer]
    code: 200
    input: ["fare_schedule_id?", "rebooked_to_booking_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/ferry/bookings/{id}/confirm"
    description: "Confirm a reserved (or modified) booking"
    roles: [Customer]
    code: 200
    input: []
    output: Booking
    side_effects: ["final_fare_cents settled (requote if pinned schedule retired)", "Sailing counters recomputed", "status -> CONFIRMED"]

  - method: POST
    path: "/ferry/bookings/{id}/modify"
    description: "Modify a confirmed booking (party size / vehicle spec)"
    roles: [Customer]
    code: 200
    input: ["passenger_count?", "has_vehicle?", "vehicle_length_feet?"]
    output: Booking
    side_effects: ["re-quote", "status -> MODIFIED"]

  - method: POST
    path: "/ferry/bookings/{id}/cancel"
    description: "Customer cancels own booking"
    roles: [Customer]
    code: 200
    input: []
    output: Booking
    side_effects: ["refund credit if CONFIRMED", "Sailing counters recomputed", "status -> CANCELLED"]

  - method: POST
    path: "/ferry/bookings/{id}/rebook"
    description: "Rebook an operator-cancelled booking onto another open sailing"
    roles: [Customer]
    code: 200
    input: [target_sailing_id]
    output: Booking
    side_effects: ["new CONFIRMED booking created on target sailing with carried-over fare", "refund credit consumed", "status -> REBOOKED"]

  - method: POST
    path: "/ferry/bookings/{id}/check-in"
    description: "Check in a confirmed booking at the terminal"
    roles: [TerminalAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CHECKED_IN"]

  - method: POST
    path: "/ferry/bookings/{id}/board"
    description: "Board a checked-in booking"
    roles: [TerminalAgent]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> BOARDED"]

  # --- Standby queue ---
  - method: POST
    path: "/ferry/sailings/{sailing_id}/standby-queue"
    description: "Join the standby lane for a sailing"
    roles: [Customer]
    code: 201
    input: [customer_id, has_vehicle, "vehicle_length_feet?", passenger_count, priority_class]
    output: StandbyQueueEntry
    side_effects: ["queued_at server-stamped", "status = WAITING"]

  - method: GET
    path: "/ferry/standby-queue/{id}"
    description: "Get a standby queue entry"
    roles: [SchedulerAdmin, TerminalAgent, Customer]
    code: 200
    input: []
    output: StandbyQueueEntry
    side_effects: []

  - method: POST
    path: "/ferry/standby-queue/{id}/leave"
    description: "Leave the standby lane"
    roles: [Customer]
    code: 200
    input: []
    output: StandbyQueueEntry
    side_effects: ["status -> EXPIRED (only from WAITING)"]

  # --- Crew ---
  - method: POST
    path: "/ferry/crew-members"
    description: "Register a crew member"
    roles: [CrewPlanner]
    code: 201
    input: [full_name, credential_class]
    output: CrewMember
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/ferry/crew-members/{id}"
    description: "Get a crew member"
    roles: [SchedulerAdmin, TerminalAgent, CrewPlanner]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  - method: GET
    path: "/ferry/crew-members/{id}/crew-assignments"
    description: "List assignments for a crew member"
    roles: [SchedulerAdmin, CrewPlanner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: "/ferry/crew-members/{id}/set-off-duty"
    description: "Mark crew member off duty"
    roles: [CrewPlanner]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["status -> OFF_DUTY"]

  - method: POST
    path: "/ferry/crew-members/{id}/set-available"
    description: "Return crew member to available"
    roles: [CrewPlanner]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["status -> AVAILABLE"]

  - method: POST
    path: "/ferry/sailings/{sailing_id}/crew-assignments"
    description: "Assign a crew member to a sailing"
    roles: [CrewPlanner]
    code: 201
    input: [crew_member_id, shift_start, shift_end]
    output: CrewAssignment
    side_effects: ["CrewMember -> ASSIGNED", "Sailing.manning_ok recomputed", "rest/overlap validation"]

  - method: POST
    path: "/ferry/crew-assignments/{id}/release"
    description: "Release a crew assignment"
    roles: [CrewPlanner]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status -> RELEASED", "manning_ok recomputed", "CrewMember -> AVAILABLE if no remaining assignments"]

  - method: GET
    path: "/ferry/crew-assignments/{id}"
    description: "Get a crew assignment"
    roles: [SchedulerAdmin, CrewPlanner]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a legal state for the requested transition" }
  - { id: ERR_SAILING_NOT_BOOKABLE, http: 409, condition: "Sailing not in a status that permits the requested ticketing action" }
  - { id: ERR_SCHEDULE_WINDOW_CONFLICT, http: 409, condition: "Fare schedule window malformed (from >= to) or overlaps another live schedule for same route+season" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer attempted to act on another customer's booking or queue entry" }
  - { id: ERR_MANNING_SHORTFALL, http: 409, condition: "Coast Guard manning minimums not met for vessel class and passenger load" }
  - { id: ERR_VESSEL_SCHEDULE_CONFLICT, http: 409, condition: "Sailing would overlap another non-cancelled sailing of the same vessel within the turnaround buffer" }
  - { id: ERR_CREW_REST_CONFLICT, http: 409, condition: "Crew assignment overlaps an existing assignment or violates the 480-minute rest rule" }
  - { id: ERR_INVALID_PARTY_SPEC, http: 400, condition: "passenger_count/vehicle_length_feet outside permitted ranges or missing when required" }
  - { id: ERR_VEHICLE_LENGTH_EXCEEDS, http: 422, condition: "Standby vehicle longer than 60 feet" }
  - { id: ERR_FARE_SCHEDULE_NOT_EFFECTIVE, http: 409, condition: "No EFFECTIVE fare schedule covers the sailing's route+season" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Reservation pool deck feet or passenger capacity would be exceeded" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_route_version does not match current Route.version" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation (route code, vessel name, customer email, or one WAITING standby entry per customer per sailing)" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: SchedulerAdmin
    description: "Central scheduling & fare authority: routes, vessels, fare schedules, sailing lifecycle open/close/cancel, customer registration, clock"
    identity: opaque
    exclusive_operations:
      - "POST /ferry/routes; POST /ferry/vessels; POST /ferry/vessels/{id}/set-out-of-service"
      - "POST /ferry/routes/{route_id}/fare-schedules and all fare-schedule actions (submit/approve/return-for-revision/reject)"
      - "POST /ferry/routes/{route_id}/sailings; POST /ferry/sailings/{id}/open-booking; POST /ferry/sailings/{id}/close-booking; POST /ferry/sailings/{id}/cancel"
      - "POST /ferry/customers; POST /ferry/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints (routes, vessels, sailings, fare schedules, bookings, standby queue, customers)"

  - name: TerminalAgent
    description: "Terminal operations: boarding lifecycle, check-in, standby lane management"
    identity: opaque
    exclusive_operations:
      - "POST /ferry/sailings/{id}/begin-boarding; POST /ferry/sailings/{id}/depart; POST /ferry/sailings/{id}/complete"
      - "POST /ferry/bookings/{id}/check-in; POST /ferry/bookings/{id}/board"
    shared_operations:
      - "GET endpoints; GET /ferry/sailings/{id}/deck-projection"

  - name: Customer
    description: "Traveler: books own travel, manages own bookings and standby entries"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /ferry/sailings/{sailing_id}/bookings (customer_id must equal X-User-ID)"
      - "POST /ferry/bookings/{id}/confirm|modify|cancel|rebook (own bookings only)"
      - "POST /ferry/sailings/{sailing_id}/standby-queue; POST /ferry/standby-queue/{id}/leave (own entries only)"
    shared_operations:
      - "GET endpoints (routes, vessels, sailings, fare schedules, own bookings, standby queue, own customer record)"

  - name: CrewPlanner
    description: "Crew scheduling office: crew roster and sailing manning"
    identity: opaque
    exclusive_operations:
      - "POST /ferry/crew-members; POST /ferry/crew-members/{id}/set-off-duty; POST /ferry/crew-members/{id}/set-available"
      - "POST /ferry/sailings/{sailing_id}/crew-assignments; POST /ferry/crew-assignments/{id}/release"
    shared_operations:
      - "GET endpoints (routes, vessels, sailings, crew members, crew assignments)"
