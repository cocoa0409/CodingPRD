# =============================================================================
# PRD-bench scaffold: National Cemetery & Veteran Burial (VA/NCA style)
# Difficulty band: Expert
# =============================================================================

scenario: |
  National Cemetery & Veteran Burial (VA/NCA style): eligibility determination,
  interment scheduling & gravesite assignment, headstone/marker order &
  inscription, military honors & flag, pre-need eligibility (PMC),
  columbarium/niche inventory, next-of-kin & dependent eligibility,
  overseas/foreign case .

domain_name: national-cemetery
api_prefix: /registry

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation          # finite gravesite/niche inventory competed for
  secondary_archetype: compliance_audit        # eligibility gating with regulatory rules + audit
  complexity_layers:
    - optimistic_concurrency                   # OCC on Gravesite.version and PreNeedDetermination.version
    - cascading_side_effects                   # interment schedule -> gravesite occupy -> case close -> honors + marker
    - dual_variant_calculation                 # entitlement scoring vs plot-allocation waterfall
    - rate_threshold_triggers                  # inscription character/line limits, honors staffing thresholds
    - derived_field_reconciliation             # Section.available_units / .interred_units recomputed from children

  entity_topology: hybrid
  # Cemetery -> Section -> Gravesite / Niche form a tree; BurialCase, EligibilityDetermination,
  # IntermentSchedule, MarkerOrder, MilitaryHonors, PreNeedDetermination are flat entities
  # cross-referencing that tree by FK.

  state_machine_shape: branching
  # BurialCase forks into eligibility APPROVED/DENIED, interment SCHEDULED/CANCELLED,
  # with revert loops (SCHEDULED -> back to ELIGIBLE on cancel) — non-linear.

  relationship_patterns:
    - one_to_many          # Cemetery has many Sections; Section has many Gravesites/Niches
    - cross_aggregate      # IntermentSchedule references Gravesite AND BurialCase across trees
    - self_referential     # BurialCase.reserving_case_id references a prior PMC case (dependent-of chain)

  role_model: peer_roles
  # EligibilityOfficer owns eligibility determinations; SchedulingClerk owns interment scheduling
  # and inventory assignment; MarkerClerk owns headstone/marker orders; HonorsCoordinator owns
  # military honors; NCA_Admin has cross-cutting cemetery/section/inventory management.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cemetery
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "National cemetery name" }
      - { name: country_code, type: string, source: input, default: "US", description: "ISO country of cemetery; non-US => overseas cemetery" }
      - { name: is_overseas, type: boolean, source: computed, description: "= (country_code != 'US'); overseas cemeteries only accept overseas cases" }
      - { name: honors_squad_capacity, type: integer, source: input, description: "Max confirmed military-honors details this cemetery can field on any single day" }

  - name: Section
    parent: Cemetery
    common_fields: true
    fields:
      - { name: cemetery_id, type: string, source: input, description: "FK -> Cemetery.id" }
      - { name: code, type: string, source: input, description: "Section code, unique within cemetery" }
      - { name: kind, type: enum, source: input, description: "IN_GROUND | COLUMBARIUM; determines whether it holds Gravesites or Niches", constraints: "one of {IN_GROUND, COLUMBARIUM}" }
      - { name: capacity_units, type: integer, source: computed, description: "count of child Gravesites (IN_GROUND) or Niches (COLUMBARIUM)" }
      - { name: available_units, type: integer, source: computed, description: "count of child units in status AVAILABLE" }
      - { name: interred_units, type: integer, source: computed, description: "count of child units in status OCCUPIED" }

  - name: Gravesite
    parent: Section
    common_fields: true
    fields:
      - { name: section_id, type: string, source: input, description: "FK -> Section.id; section.kind must be IN_GROUND" }
      - { name: grid_ref, type: string, source: input, description: "Row/column grid reference, unique within section" }
      - { name: gravesite_class, type: enum, source: input, description: "STANDARD | OVERSIZE | CREMATION; drives allocation eligibility", constraints: "one of {STANDARD, OVERSIZE, CREMATION}" }
      - { name: depth_capacity, type: integer, source: input, description: "Number of interments this plot can hold (1 single, 2 double-depth, etc.)" }
      - { name: interment_count, type: integer, source: computed, default: 0, description: "Number of committed interments in this plot" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> RESERVED -> OCCUPIED; or AVAILABLE -> DECOMMISSIONED", constraints: "one of {AVAILABLE, RESERVED, OCCUPIED, DECOMMISSIONED}" }
      - { name: reserved_by_case_id, type: string, source: system, description: "FK -> BurialCase.id; the case holding a pre-need reservation on this plot (null when AVAILABLE)" }

  - name: Niche
    parent: Section
    common_fields: true
    fields:
      - { name: section_id, type: string, source: input, description: "FK -> Section.id; section.kind must be COLUMBARIUM" }
      - { name: niche_ref, type: string, source: input, description: "Column/tier niche reference, unique within section" }
      - { name: urn_capacity, type: integer, source: input, description: "Number of urns this niche can hold (1 single, 2 companion)" }
      - { name: inurnment_count, type: integer, source: computed, default: 0, description: "Number of committed inurnments in this niche" }
      - { name: status, type: enum, source: system, description: "AVAILABLE -> RESERVED -> OCCUPIED; or AVAILABLE -> DECOMMISSIONED", constraints: "one of {AVAILABLE, RESERVED, OCCUPIED, DECOMMISSIONED}" }
      - { name: reserved_by_case_id, type: string, source: system, description: "FK -> BurialCase.id; the case holding a pre-need reservation on this niche (null when AVAILABLE)" }

  - name: BurialCase
    parent: null
    common_fields: true
    fields:
      - { name: cemetery_id, type: string, source: input, description: "FK -> Cemetery.id; the cemetery this case targets" }
      - { name: case_type, type: enum, source: input, description: "AT_NEED | PRE_NEED; AT_NEED has a decedent, PRE_NEED reserves for a living applicant", constraints: "one of {AT_NEED, PRE_NEED}" }
      - { name: applicant_role, type: enum, source: input, description: "VETERAN | SPOUSE | DEPENDENT; who the interment right is claimed for", constraints: "one of {VETERAN, SPOUSE, DEPENDENT}" }
      - { name: reserving_case_id, type: string, source: input, description: "FK -> BurialCase.id; for SPOUSE/DEPENDENT cases, the sponsoring veteran's case whose eligibility they derive from (null for VETERAN)" }
      - { name: is_overseas_case, type: boolean, source: input, default: false, description: "True when the decedent/applicant qualifies only for an overseas cemetery" }
      - { name: character_of_discharge, type: enum, source: input, description: "HONORABLE | GENERAL | OTHER_THAN_HONORABLE | DISHONORABLE; only used when applicant_role=VETERAN", constraints: "one of {HONORABLE, GENERAL, OTHER_THAN_HONORABLE, DISHONORABLE}" }
      - { name: service_days, type: integer, source: input, default: 0, description: "Total active-duty days served (used for minimum-service entitlement test)" }
      - { name: died_on_active_duty, type: boolean, source: input, default: false, description: "Death-in-service flag; waives minimum-service and discharge tests" }
      - { name: requested_class, type: enum, source: input, description: "STANDARD | OVERSIZE | CREMATION; requested gravesite/niche class", constraints: "one of {STANDARD, OVERSIZE, CREMATION}" }
      - { name: entitlement_score, type: integer, source: computed, description: "Weighted entitlement priority score computed at eligibility approval (see calc entitlement_score)" }
      - { name: assigned_unit_type, type: enum, source: computed, description: "GRAVESITE | NICHE; set when a plot is assigned", constraints: "one of {GRAVESITE, NICHE}" }
      - { name: assigned_gravesite_id, type: string, source: computed, description: "FK -> Gravesite.id; set when an in-ground plot is assigned (null otherwise)" }
      - { name: assigned_niche_id, type: string, source: computed, description: "FK -> Niche.id; set when a columbarium niche is assigned (null otherwise)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> ELIGIBLE / INELIGIBLE; ELIGIBLE -> ASSIGNED -> SCHEDULED -> INTERRED; with reverts (see 1.2)", constraints: "one of {SUBMITTED, ELIGIBLE, INELIGIBLE, ASSIGNED, SCHEDULED, INTERRED, CANCELLED}" }

  - name: EligibilityDetermination
    parent: null
    common_fields: false
    fields:
      - { name: burial_case_id, type: string, source: input, description: "FK -> BurialCase.id; the case being adjudicated" }
      - { name: decision, type: enum, source: computed, description: "APPROVED | DENIED", constraints: "one of {APPROVED, DENIED}" }
      - { name: basis, type: enum, source: computed, description: "VETERAN_SERVICE | DERIVED_SPONSOR | DIED_IN_SERVICE | OVERSEAS_ONLY", constraints: "one of {VETERAN_SERVICE, DERIVED_SPONSOR, DIED_IN_SERVICE, OVERSEAS_ONLY}" }
      - { name: denial_reason, type: enum, source: computed, description: "DISCHARGE_BAR | INSUFFICIENT_SERVICE | SPONSOR_NOT_ELIGIBLE | CEMETERY_MISMATCH; null when APPROVED", constraints: "one of {DISCHARGE_BAR, INSUFFICIENT_SERVICE, SPONSOR_NOT_ELIGIBLE, CEMETERY_MISMATCH}" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the EligibilityOfficer who ran the determination" }

  - name: PreNeedDetermination
    parent: null
    common_fields: true
    fields:
      - { name: burial_case_id, type: string, source: input, description: "FK -> BurialCase.id; must be a PRE_NEED case" }
      - { name: pmc_number, type: string, source: system, description: "Pre-need Memorial Certificate number issued on approval (null while PENDING)" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED -> RESERVED / EXPIRED; APPROVED -> DENIED", constraints: "one of {PENDING, APPROVED, DENIED, RESERVED, EXPIRED}" }
      - { name: expires_on, type: datetime, source: computed, description: "APPROVED PMC reservation window end = approval instant + PMC_RESERVATION_DAYS" }

  - name: IntermentSchedule
    parent: null
    common_fields: true
    fields:
      - { name: burial_case_id, type: string, source: input, description: "FK -> BurialCase.id; case must be ASSIGNED" }
      - { name: gravesite_id, type: string, source: system, description: "FK -> Gravesite.id; copied from the case's assignment (null for niche cases)" }
      - { name: niche_id, type: string, source: system, description: "FK -> Niche.id; copied from the case's assignment (null for gravesite cases)" }
      - { name: window_start, type: datetime, source: input, description: "Requested interment window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Requested interment window end (UTC); must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED; SCHEDULED -> CANCELLED", constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}" }

  - name: MarkerOrder
    parent: null
    common_fields: true
    fields:
      - { name: burial_case_id, type: string, source: input, description: "FK -> BurialCase.id; case must be at least ASSIGNED" }
      - { name: marker_type, type: enum, source: input, description: "UPRIGHT_MARBLE | FLAT_GRANITE | FLAT_BRONZE | NICHE_COVER; NICHE_COVER required for niche cases", constraints: "one of {UPRIGHT_MARBLE, FLAT_GRANITE, FLAT_BRONZE, NICHE_COVER}" }
      - { name: inscription_lines, type: array, source: input, description: "Ordered list of inscription line strings" }
      - { name: emblem_of_belief, type: string, source: input, description: "Approved emblem-of-belief code (optional)" }
      - { name: billable_characters, type: integer, source: computed, description: "Total chargeable characters after free-allowance (see calc marker_charge)" }
      - { name: marker_charge_cents, type: integer, source: computed, description: "Chargeable amount in cents for excess characters (see calc marker_charge)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ENGRAVED; DRAFT/SUBMITTED -> CANCELLED", constraints: "one of {DRAFT, SUBMITTED, ENGRAVED, CANCELLED}" }

  - name: MilitaryHonors
    parent: null
    common_fields: true
    fields:
      - { name: interment_schedule_id, type: string, source: input, description: "FK -> IntermentSchedule.id; schedule must be SCHEDULED" }
      - { name: detail_size, type: enum, source: input, description: "TWO_PERSON | FULL_SQUAD; FULL_SQUAD requires HONORS_FULL_SQUAD_MIN_SCORE entitlement", constraints: "one of {TWO_PERSON, FULL_SQUAD}" }
      - { name: flag_issued, type: boolean, source: computed, default: false, description: "Burial flag issued (true once honors are CONFIRMED for an eligible case)" }
      - { name: honors_date, type: datetime, source: computed, description: "Date component (UTC midnight) of the linked interment window_start; used for daily squad-capacity counting" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CONFIRMED -> RENDERED; REQUESTED/CONFIRMED -> CANCELLED", constraints: "one of {REQUESTED, CONFIRMED, RENDERED, CANCELLED}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: BurialCase
    initial_state: SUBMITTED
    terminal_states: [INELIGIBLE, INTERRED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ELIGIBLE
        trigger: "POST /registry/burial-cases/{caseId}/eligibility"
        actor: EligibilityOfficer
        preconditions:
          - "An EligibilityDetermination with decision=APPROVED is produced by the entitlement rules (see calc eligibility_decision)"
        side_effects:
          - "Create EligibilityDetermination(decision=APPROVED, basis=...)"
          - "Compute BurialCase.entitlement_score (calc entitlement_score)"
        note: "Branch point: same endpoint produces ELIGIBLE or INELIGIBLE depending on the determination."

      - from: SUBMITTED
        to: INELIGIBLE
        trigger: "POST /registry/burial-cases/{caseId}/eligibility"
        actor: EligibilityOfficer
        preconditions:
          - "The entitlement rules produce decision=DENIED (see calc eligibility_decision)"
        side_effects:
          - "Create EligibilityDetermination(decision=DENIED, denial_reason=...)"
        note: "Terminal: a denied case cannot proceed."

      - from: ELIGIBLE
        to: ASSIGNED
        trigger: "POST /registry/burial-cases/{caseId}/assign-plot"
        actor: SchedulingClerk
        preconditions:
          - "A candidate unit is selected by the allocation waterfall (calc plot_allocation) or an explicit unit_id is supplied and is AVAILABLE/self-reserved"
          - "For a PRE_NEED case, a PreNeedDetermination in status APPROVED exists"
        side_effects:
          - "Set BurialCase.assigned_unit_type / assigned_gravesite_id / assigned_niche_id"
          - "Transition the chosen Gravesite/Niche AVAILABLE -> RESERVED, set reserved_by_case_id = case.id"
          - "increments Gravesite.version by 1 (or Niche.version by 1) on the reserved unit"
          - "Recompute parent Section.available_units / interred_units (calc section_inventory)"

      - from: ASSIGNED
        to: ELIGIBLE
        trigger: "POST /registry/burial-cases/{caseId}/release-plot"
        actor: SchedulingClerk
        preconditions:
          - "No IntermentSchedule in status SCHEDULED or COMPLETED references this case"
        side_effects:
          - "Transition the reserved Gravesite/Niche RESERVED -> AVAILABLE, clear reserved_by_case_id"
          - "Clear BurialCase.assigned_unit_type / assigned_gravesite_id / assigned_niche_id"
          - "Recompute parent Section.available_units / interred_units (calc section_inventory)"
        note: "Revert loop ASSIGNED -> ELIGIBLE."

      - from: ASSIGNED
        to: SCHEDULED
        trigger: "POST /registry/interment-schedules"
        actor: SchedulingClerk
        preconditions:
          - "No SCHEDULED/COMPLETED IntermentSchedule overlaps the assigned Gravesite/Niche window (calc overlap_gravesite / overlap_niche)"
        side_effects:
          - "Create IntermentSchedule(status=SCHEDULED) copying gravesite_id/niche_id from the case"

      - from: SCHEDULED
        to: ASSIGNED
        trigger: "POST /registry/interment-schedules/{scheduleId}/cancel"
        actor: SchedulingClerk
        preconditions:
          - "IntermentSchedule is in status SCHEDULED"
        side_effects:
          - "Transition IntermentSchedule SCHEDULED -> CANCELLED"
          - "Cascade: any MilitaryHonors linked to this schedule in REQUESTED/CONFIRMED -> CANCELLED"
          - "Cascade: a CONFIRMED MilitaryHonors that had flag_issued=true resets flag_issued=false on cancel"
        note: "Revert loop SCHEDULED -> ASSIGNED; compensates the schedule side effects."

      - from: SCHEDULED
        to: INTERRED
        trigger: "POST /registry/interment-schedules/{scheduleId}/complete"
        actor: SchedulingClerk
        preconditions:
          - "IntermentSchedule is in status SCHEDULED"
        side_effects:
          - "Transition IntermentSchedule SCHEDULED -> COMPLETED"
          - "Increment assigned Gravesite.interment_count (or Niche.inurnment_count) by 1"
          - "When interment_count reaches depth_capacity (or inurnment_count reaches urn_capacity): transition unit RESERVED -> OCCUPIED"
          - "Recompute parent Section.available_units / interred_units (calc section_inventory)"
          - "For a PRE_NEED case: transition its APPROVED PreNeedDetermination APPROVED -> RESERVED (pre-need reservation fulfilled)"

      - from: ELIGIBLE
        to: CANCELLED
        trigger: "POST /registry/burial-cases/{caseId}/cancel"
        actor: SchedulingClerk
        preconditions:
          - "Case is in status ELIGIBLE (no plot reserved)"
        side_effects: ["Case closed with no inventory impact"]

  # ---------------------------------------------------------------------------
  - entity: PreNeedDetermination
    initial_state: PENDING
    terminal_states: [DENIED, RESERVED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /registry/pre-need-determinations/{pmcId}/approve"
        actor: EligibilityOfficer
        preconditions:
          - "The linked BurialCase is PRE_NEED and in status ELIGIBLE"
        side_effects:
          - "Issue PreNeedDetermination.pmc_number"
          - "Set expires_on = current_utc + PMC_RESERVATION_DAYS days"
          - "increments PreNeedDetermination.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /registry/pre-need-determinations/{pmcId}/deny"
        actor: EligibilityOfficer
        preconditions:
          - "PreNeedDetermination is in status PENDING"
        side_effects: ["increments PreNeedDetermination.version by 1"]

      - from: APPROVED
        to: RESERVED
        trigger: "system (automatic when the linked BurialCase reaches INTERRED via interment complete)"
        actor: system
        preconditions:
          - "The linked PRE_NEED case's interment has COMPLETED (case status INTERRED)"
        side_effects: ["increments PreNeedDetermination.version by 1"]
        note: "RESERVED here means the pre-need reservation was fully honored by an actual interment; it is a terminal, fulfilled state."

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /registry/pre-need-determinations/{pmcId}/expire-sweep"
        actor: NCA_Admin
        preconditions:
          - "current_utc >= expires_on and the linked case has not been INTERRED"
        side_effects:
          - "If the linked case currently holds a RESERVED (assigned-but-not-interred) Gravesite/Niche, transition that unit RESERVED -> AVAILABLE and clear reserved_by_case_id (this in turn forces Section.available_units recomputation)"
          - "If the linked case is in status ASSIGNED, revert it ASSIGNED -> ELIGIBLE and clear its assignment"
          - "increments PreNeedDetermination.version by 1"

  # ---------------------------------------------------------------------------
  - entity: IntermentSchedule
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /registry/interment-schedules/{scheduleId}/complete"
        actor: SchedulingClerk
        preconditions: ["Schedule is SCHEDULED"]
        side_effects:
          - "Drives BurialCase SCHEDULED -> INTERRED (see BurialCase machine)"
          - "Cascade: any CONFIRMED MilitaryHonors linked to this schedule -> RENDERED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /registry/interment-schedules/{scheduleId}/cancel"
        actor: SchedulingClerk
        preconditions: ["Schedule is SCHEDULED"]
        side_effects:
          - "Drives BurialCase SCHEDULED -> ASSIGNED (revert)"
          - "Cascade: linked MilitaryHonors in REQUESTED/CONFIRMED -> CANCELLED (and flag_issued reset to false)"

  # ---------------------------------------------------------------------------
  - entity: MarkerOrder
    initial_state: DRAFT
    terminal_states: [ENGRAVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /registry/marker-orders/{markerId}/submit"
        actor: MarkerClerk
        preconditions:
          - "inscription_lines count <= INSCRIPTION_MAX_LINES and each line length <= INSCRIPTION_MAX_CHARS_PER_LINE"
          - "marker_type == NICHE_COVER iff the case's assigned_unit_type == NICHE"
        side_effects:
          - "Recompute billable_characters and marker_charge_cents (calc marker_charge)"

      - from: SUBMITTED
        to: ENGRAVED
        trigger: "POST /registry/marker-orders/{markerId}/engrave"
        actor: MarkerClerk
        preconditions:
          - "The linked BurialCase is in status INTERRED"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /registry/marker-orders/{markerId}/cancel"
        actor: MarkerClerk
        preconditions: ["MarkerOrder is DRAFT or SUBMITTED"]
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /registry/marker-orders/{markerId}/cancel"
        actor: MarkerClerk
        preconditions: ["MarkerOrder is DRAFT or SUBMITTED"]
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: MilitaryHonors
    initial_state: REQUESTED
    terminal_states: [RENDERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /registry/military-honors/{honorsId}/confirm"
        actor: HonorsCoordinator
        preconditions:
          - "The linked IntermentSchedule is SCHEDULED"
          - "The cemetery's confirmed-honors count on honors_date is < Cemetery.honors_squad_capacity (calc honors_capacity)"
          - "For detail_size=FULL_SQUAD, the case's entitlement_score >= HONORS_FULL_SQUAD_MIN_SCORE"
        side_effects:
          - "Set flag_issued = true"

      - from: CONFIRMED
        to: RENDERED
        trigger: "system (automatic when the linked IntermentSchedule transitions SCHEDULED -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /registry/military-honors/{honorsId}/cancel (or cascade from schedule cancel)"
        actor: HonorsCoordinator
        preconditions: ["MilitaryHonors is REQUESTED or CONFIRMED"]
        side_effects: ["If flag_issued was true, reset flag_issued = false"]

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /registry/military-honors/{honorsId}/cancel (or cascade from schedule cancel)"
        actor: HonorsCoordinator
        preconditions: ["MilitaryHonors is REQUESTED or CONFIRMED"]
        side_effects: ["Reset flag_issued = false"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assign-plot-stale-gravesite
    parent_entity: Gravesite
    write_endpoint: "POST /registry/burial-cases/{caseId}/assign-plot"
    occ_field: "expected_gravesite_version"
    description: |
      Assigning an explicit in-ground Gravesite to a case requires the caller to
      pin the Gravesite version they last observed. If the Gravesite's version has
      advanced since — because another case already reserved it (AVAILABLE ->
      RESERVED bumps the version) — the assignment is rejected as stale. This
      captures the case where a plot the caller believed AVAILABLE has been
      legitimately reserved by a different case whose write superseded the
      caller's view.
    error_id: ERR_STALE_GRAVESITE_VERSION
    http_status: 412

  - rule_id: preneed-approve-stale-pmc
    parent_entity: PreNeedDetermination
    write_endpoint: "POST /registry/pre-need-determinations/{pmcId}/approve"
    occ_field: "expected_pmc_version"
    description: |
      Approving a PreNeedDetermination requires the caller to pin the version they
      last observed. If the PMC's version has advanced (e.g. a deny already ran and
      superseded the pending record), the approve is rejected as stale rather than
      overwriting the newer decision.
    error_id: ERR_STALE_PMC_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_decision
    trigger: "POST .../burial-cases/{caseId}/eligibility (evaluated on SUBMITTED -> ELIGIBLE/INELIGIBLE)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is fixed; first matching branch wins.
      1. CEMETERY_MISMATCH: if BurialCase.is_overseas_case != Cemetery.is_overseas
                            -> DENIED, denial_reason=CEMETERY_MISMATCH.
      2. if applicant_role == VETERAN:
           if died_on_active_duty == true:
             -> APPROVED, basis=DIED_IN_SERVICE.        # waives discharge + service
           elif character_of_discharge in {OTHER_THAN_HONORABLE, DISHONORABLE}:
             -> DENIED, denial_reason=DISCHARGE_BAR.
           elif service_days < MIN_SERVICE_DAYS:
             -> DENIED, denial_reason=INSUFFICIENT_SERVICE.
           else:
             -> APPROVED, basis=VETERAN_SERVICE.
      3. if applicant_role in {SPOUSE, DEPENDENT}:
           sponsor = BurialCase[reserving_case_id]
           if sponsor is null OR sponsor.status not in {ELIGIBLE, ASSIGNED, SCHEDULED, INTERRED}:
             -> DENIED, denial_reason=SPONSOR_NOT_ELIGIBLE.
           else:
             -> APPROVED, basis=DERIVED_SPONSOR.
      4. Overseas-only special: if is_overseas_case AND Cemetery.is_overseas AND
         branch above APPROVED, override basis=OVERSEAS_ONLY.
    input_set: "The BurialCase under adjudication, its Cemetery, and (for SPOUSE/DEPENDENT) the sponsor BurialCase referenced by reserving_case_id."
    constants:
      MIN_SERVICE_DAYS: 730
    precision: "integer comparisons; no rounding"
    variants:
      - name: veteran_direct
        when: "applicant_role == VETERAN"
        difference: "Uses discharge + service_days + died_on_active_duty tests directly."
      - name: derived_dependent
        when: "applicant_role in {SPOUSE, DEPENDENT}"
        difference: "Ignores the applicant's own discharge/service entirely; approval derives solely from the sponsor case's status."

  - name: entitlement_score
    trigger: "SUBMITTED -> ELIGIBLE side effect (only computed when decision=APPROVED)"
    algorithm: weighted_scoring
    formula: |
      # Well-defined evaluation order: compute each term, then sum, then clamp.
      base = BASE_BY_ROLE[applicant_role]        # VETERAN=100, SPOUSE=60, DEPENDENT=40
      service_bonus = min( floor(service_days / 365) * SERVICE_YEAR_POINTS, SERVICE_BONUS_CAP )
      service_flag  = DIED_IN_SERVICE_BONUS if died_on_active_duty else 0
      discharge_adj = DISCHARGE_HONORABLE_BONUS if character_of_discharge == HONORABLE else 0
      raw = base + service_bonus + service_flag + discharge_adj
      entitlement_score = min(raw, SCORE_CEILING)   # clamp last
      # For SPOUSE/DEPENDENT, service_bonus/service_flag/discharge_adj use the
      # SPONSOR case's fields (derived entitlement), not the dependent's own.
    input_set: "The APPROVED BurialCase; for SPOUSE/DEPENDENT the service/discharge terms read the sponsor case referenced by reserving_case_id."
    constants:
      BASE_BY_ROLE: { VETERAN: 100, SPOUSE: 60, DEPENDENT: 40 }
      SERVICE_YEAR_POINTS: 3
      SERVICE_BONUS_CAP: 30
      DIED_IN_SERVICE_BONUS: 25
      DISCHARGE_HONORABLE_BONUS: 10
      SCORE_CEILING: 150
    precision: "integer; floor on service years; clamp applied last"
    variants:
      - name: own_service
        when: "applicant_role == VETERAN"
        difference: "service/discharge terms read the case's own fields."
      - name: sponsor_derived
        when: "applicant_role in {SPOUSE, DEPENDENT}"
        difference: "service/discharge terms read the sponsor case's fields; base uses the dependent's own role weight."

  - name: plot_allocation
    trigger: "POST .../burial-cases/{caseId}/assign-plot when no explicit unit_id is supplied (server selects)"
    algorithm: waterfall_allocation
    formula: |
      # Candidate set: units in the target cemetery whose section.kind matches the
      # request (CREMATION request may target either a CREMATION gravesite OR a niche;
      # STANDARD/OVERSIZE target IN_GROUND gravesites).
      candidates = units where:
          unit.status == AVAILABLE
          AND ( unit is Gravesite with gravesite_class == case.requested_class
                OR (case.requested_class == CREMATION AND unit is Niche) )
          AND unit.section.cemetery_id == case.cemetery_id
      # Waterfall priority (fill fully-utilizable plots first, then by locality):
      rank by (
          1) unit_kind_priority:  # exact-class gravesite before niche fallback for CREMATION
             0 if (Gravesite AND gravesite_class == requested_class) else 1
          2) section.code ASC     # deterministic locality order
          3) grid_ref / niche_ref ASC (lexicographic)
          4) created_at ASC       # final deterministic tie-break (NEVER id)
      )
      selected = first candidate by rank
      if candidates is empty -> ERR_NO_AVAILABLE_UNIT.
    input_set: "AVAILABLE Gravesites/Niches in sections of the case's cemetery matching the requested class."
    constants: {}
    precision: "n/a; ordinal selection only"

  - name: marker_charge
    trigger: "DRAFT -> SUBMITTED side effect on MarkerOrder"
    algorithm: tiered_pricing
    formula: |
      # Nested rounding order is PINNED: count per line, sum, THEN apply the free
      # allowance once against the total — NOT per line.
      per_line_chars = [ len(line) for line in inscription_lines ]   # exact char count per line
      total_chars = sum(per_line_chars)                              # sum first
      emblem_extra = EMBLEM_CHAR_EQUIV if emblem_of_belief present else 0
      chargeable = max( total_chars + emblem_extra - FREE_CHARACTER_ALLOWANCE, 0 )  # allowance last
      billable_characters = chargeable
      marker_charge_cents = ceil(chargeable / CHARS_PER_BLOCK) * BLOCK_PRICE_CENTS   # ceil to whole blocks
    input_set: "The MarkerOrder's inscription_lines array and emblem_of_belief on submit."
    constants:
      FREE_CHARACTER_ALLOWANCE: 60
      EMBLEM_CHAR_EQUIV: 15
      CHARS_PER_BLOCK: 10
      BLOCK_PRICE_CENTS: 250
    precision: "integer characters; ceil to whole block before pricing"

  - name: overlap_gravesite
    trigger: "ASSIGNED -> SCHEDULED on a gravesite case (interment-schedule create)"
    algorithm: interval_merge
    formula: |
      # Gravesite interval semantics: CLOSED-CLOSED with a mandatory teardown BUFFER.
      # A new [window_start, window_end] conflicts with an existing SCHEDULED/COMPLETED
      # schedule S on the SAME gravesite when:
      #   new.window_start <= S.window_end + GRAVESITE_BUFFER_HOURS
      #   AND new.window_end + GRAVESITE_BUFFER_HOURS >= S.window_start
      # i.e. two interments on one plot must be separated by at least the buffer.
      conflict -> ERR_GRAVESITE_WINDOW_CONFLICT.
    input_set: "SCHEDULED and COMPLETED IntermentSchedules whose gravesite_id == the case's assigned_gravesite_id."
    constants:
      GRAVESITE_BUFFER_HOURS: 48
    precision: "datetime comparison to the second; buffer added in hours"

  - name: overlap_niche
    trigger: "ASSIGNED -> SCHEDULED on a niche case (interment-schedule create)"
    algorithm: interval_merge
    formula: |
      # Niche interval semantics: HALF-OPEN [window_start, window_end) with ZERO buffer
      # (adjacency allowed — back-to-back inurnments are permitted). A new window
      # conflicts with existing SCHEDULED/COMPLETED schedule S on the SAME niche when:
      #   new.window_start < S.window_end AND S.window_start < new.window_end
      # Touching endpoints (new.window_start == S.window_end) do NOT conflict.
      conflict -> ERR_NICHE_WINDOW_CONFLICT.
    input_set: "SCHEDULED and COMPLETED IntermentSchedules whose niche_id == the case's assigned_niche_id."
    constants: {}
    precision: "datetime comparison to the second; strict inequalities, no buffer"

  - name: honors_capacity
    trigger: "REQUESTED -> CONFIRMED on MilitaryHonors (confirm)"
    algorithm: threshold
    formula: |
      honors_date = date(linked IntermentSchedule.window_start)   # UTC midnight
      confirmed_today = count of MilitaryHonors M where
          M.status == CONFIRMED
          AND M.honors_date == honors_date
          AND the cemetery of M's schedule == this cemetery
      # Boundary is '>=' : capacity is full when confirmed_today >= capacity.
      if confirmed_today >= Cemetery.honors_squad_capacity -> ERR_HONORS_CAPACITY_FULL.
    input_set: "CONFIRMED MilitaryHonors on the same honors_date within the same cemetery."
    constants: {}
    precision: "integer count; '>=' boundary (the Nth confirm when capacity==N-1 already used is rejected)"

  - name: section_inventory
    trigger: "Any Gravesite/Niche status change (assign, release, complete, expire-sweep)"
    algorithm: aggregation
    formula: |
      Section.capacity_units   = count of child units (Gravesites if IN_GROUND else Niches)
      Section.available_units  = count of child units with status == AVAILABLE
      Section.interred_units   = count of child units with status == OCCUPIED
      # RESERVED units count toward neither available nor interred.
    input_set: "All Gravesite/Niche children of the Section."
    constants: {}
    precision: "integer counts"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc when unauthenticated seeding is disallowed"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (cemetery, then case/section/schedule/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced FKs resolve (burial_case_id, section_id, interment_schedule_id, reserving_case_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create/action endpoints carrying FK body fields"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: business_referential
    check: "Section.kind matches the unit created under it (IN_GROUND for Gravesite, COLUMBARIUM for Niche); marker_type NICHE_COVER iff assigned_unit_type==NICHE; explicit assign unit is in the case's cemetery"
    error_id: ERR_UNIT_KIND_MISMATCH
    http_status: 422
    applies_to: "POST .../gravesites, POST .../niches, POST .../marker-orders/{id}/submit, assign-plot with unit_id"

  - priority: 7
    category: business_safety
    check: "Interment window is well-formed: window_end > window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST .../interment-schedules"

  - priority: 8
    category: business_temporal
    check: "Requested interment window does not conflict with existing schedules on the same unit under that unit's interval semantics (calc overlap_gravesite / overlap_niche)"
    error_id: ERR_GRAVESITE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST .../interment-schedules (gravesite cases)"

  - priority: 8
    category: business_temporal
    check: "Requested niche window does not conflict with existing schedules on the same niche (half-open, zero buffer)"
    error_id: ERR_NICHE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST .../interment-schedules (niche cases)"

  - priority: 9
    category: business_constraint
    check: "Inscription within limits: <= INSCRIPTION_MAX_LINES lines and each line <= INSCRIPTION_MAX_CHARS_PER_LINE chars"
    error_id: ERR_INSCRIPTION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST .../marker-orders/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "FULL_SQUAD honors require case.entitlement_score >= HONORS_FULL_SQUAD_MIN_SCORE"
    error_id: ERR_HONORS_ENTITLEMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST .../military-honors/{id}/confirm"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_gravesite_version / expected_pmc_version matches current parent version (see §1.2.1)"
    error_id: ERR_STALE_GRAVESITE_VERSION
    http_status: 412
    applies_to: "assign-plot (with unit_id), pre-need approve"

  - priority: 12
    category: business_fiscal
    check: "Cemetery honors capacity: confirmed honors on honors_date < Cemetery.honors_squad_capacity (calc honors_capacity)"
    error_id: ERR_HONORS_CAPACITY_FULL
    http_status: 409
    applies_to: "POST .../military-honors/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "assign-plot: server-selected or explicit unit exists in AVAILABLE (or self-reserved) state and matches requested class; empty candidate set for auto-select"
    error_id: ERR_NO_AVAILABLE_UNIT
    http_status: 409
    applies_to: "POST .../burial-cases/{id}/assign-plot"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [NCA_Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/set for all expiry/window computations"]

  # ---- Cemetery ----
  - method: POST
    path: "/registry/cemeteries"
    description: "Create a national cemetery"
    roles: [NCA_Admin]
    code: 201
    input: [name, "country_code?", honors_squad_capacity]
    output: Cemetery
    side_effects: ["is_overseas computed from country_code"]

  - method: GET
    path: "/registry/cemeteries/{cemeteryId}"
    description: "Fetch a cemetery"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: []
    output: Cemetery

  - method: GET
    path: "/registry/cemeteries"
    description: "List cemeteries"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Cemetery[]

  # ---- Section ----
  - method: POST
    path: "/registry/sections"
    description: "Create a section (IN_GROUND or COLUMBARIUM) under a cemetery"
    roles: [NCA_Admin]
    code: 201
    input: [cemetery_id, code, kind]
    output: Section
    side_effects: ["capacity/available/interred initialized to 0"]

  - method: GET
    path: "/registry/sections"
    description: "List sections, filterable by cemetery (reverse-reachability for Section.cemetery_id)"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: ["cemetery_id?", "limit?", "offset?"]
    output: Section[]

  - method: GET
    path: "/registry/sections/{sectionId}"
    description: "Fetch a section with recomputed inventory counts"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: []
    output: Section

  # ---- Gravesite ----
  - method: POST
    path: "/registry/gravesites"
    description: "Create an in-ground gravesite (section.kind must be IN_GROUND)"
    roles: [NCA_Admin]
    code: 201
    input: [section_id, grid_ref, gravesite_class, depth_capacity]
    output: Gravesite
    side_effects: ["status=AVAILABLE; recompute Section inventory (calc section_inventory)"]

  - method: GET
    path: "/registry/gravesites"
    description: "List gravesites, filterable by section or reserving case (reverse-reachability for Gravesite.section_id and Gravesite.reserved_by_case_id)"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: ["section_id?", "reserved_by_case_id?", "status?", "limit?", "offset?"]
    output: Gravesite[]

  - method: GET
    path: "/registry/gravesites/{gravesiteId}"
    description: "Fetch a gravesite"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: []
    output: Gravesite

  - method: POST
    path: "/registry/gravesites/{gravesiteId}/decommission"
    description: "Decommission an AVAILABLE gravesite (removes it from allocation)"
    roles: [NCA_Admin]
    code: 200
    input: []
    output: Gravesite
    side_effects: ["AVAILABLE -> DECOMMISSIONED; recompute Section inventory"]

  # ---- Niche ----
  - method: POST
    path: "/registry/niches"
    description: "Create a columbarium niche (section.kind must be COLUMBARIUM)"
    roles: [NCA_Admin]
    code: 201
    input: [section_id, niche_ref, urn_capacity]
    output: Niche
    side_effects: ["status=AVAILABLE; recompute Section inventory (calc section_inventory)"]

  - method: GET
    path: "/registry/niches"
    description: "List niches, filterable by section or reserving case (reverse-reachability for Niche.section_id and Niche.reserved_by_case_id)"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: ["section_id?", "reserved_by_case_id?", "status?", "limit?", "offset?"]
    output: Niche[]

  - method: GET
    path: "/registry/niches/{nicheId}"
    description: "Fetch a niche"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: []
    output: Niche

  # ---- BurialCase ----
  - method: POST
    path: "/registry/burial-cases"
    description: "Open a burial case (AT_NEED or PRE_NEED)"
    roles: [EligibilityOfficer, SchedulingClerk]
    code: 201
    input: [cemetery_id, case_type, applicant_role, requested_class, "reserving_case_id?", "is_overseas_case?", "character_of_discharge?", "service_days?", "died_on_active_duty?"]
    output: BurialCase
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/registry/burial-cases"
    description: "List burial cases, filterable by cemetery, self-ref sponsor, or assigned unit (reverse-reachability for BurialCase.cemetery_id, reserving_case_id, assigned_gravesite_id, assigned_niche_id)"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: ["cemetery_id?", "status?", "reserving_case_id?", "assigned_gravesite_id?", "assigned_niche_id?", "limit?", "offset?"]
    output: BurialCase[]

  - method: GET
    path: "/registry/burial-cases/{caseId}"
    description: "Fetch a burial case with computed entitlement_score and assignment"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, MarkerClerk, HonorsCoordinator]
    code: 200
    input: []
    output: BurialCase

  - method: POST
    path: "/registry/burial-cases/{caseId}/eligibility"
    description: "Run eligibility determination; drives SUBMITTED -> ELIGIBLE or INELIGIBLE"
    roles: [EligibilityOfficer]
    code: 201
    input: []
    output: EligibilityDetermination
    side_effects: ["Create EligibilityDetermination; on APPROVED compute entitlement_score and set ELIGIBLE; on DENIED set INELIGIBLE"]

  - method: GET
    path: "/registry/burial-cases/{id}/eligibility"
    description: "Fetch the eligibility determination for a case (reverse-reachability for EligibilityDetermination.burial_case_id)"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk]
    code: 200
    input: []
    output: EligibilityDetermination[]

  - method: POST
    path: "/registry/burial-cases/{caseId}/assign-plot"
    description: "Assign a gravesite/niche to an ELIGIBLE case. If unit_id omitted the server auto-selects via calc plot_allocation. If unit_id given, OCC applies via expected_gravesite_version."
    roles: [SchedulingClerk]
    code: 200
    input: ["unit_id?", "unit_type?", "expected_gravesite_version?"]
    output: BurialCase
    side_effects: ["ELIGIBLE -> ASSIGNED", "unit AVAILABLE -> RESERVED, set reserved_by_case_id", "increments Gravesite.version by 1 (or Niche.version by 1)", "recompute Section inventory"]

  - method: POST
    path: "/registry/burial-cases/{caseId}/release-plot"
    description: "Release a reserved plot; drives ASSIGNED -> ELIGIBLE"
    roles: [SchedulingClerk]
    code: 200
    input: []
    output: BurialCase
    side_effects: ["unit RESERVED -> AVAILABLE, clear reserved_by_case_id", "clear case assignment", "recompute Section inventory"]

  - method: POST
    path: "/registry/burial-cases/{caseId}/cancel"
    description: "Cancel an ELIGIBLE case with no reservation"
    roles: [SchedulingClerk]
    code: 200
    input: []
    output: BurialCase
    side_effects: ["ELIGIBLE -> CANCELLED"]

  # ---- PreNeedDetermination (PMC) ----
  - method: POST
    path: "/registry/pre-need-determinations"
    description: "Open a pending PMC determination for a PRE_NEED case"
    roles: [EligibilityOfficer]
    code: 201
    input: [burial_case_id]
    output: PreNeedDetermination
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/registry/pre-need-determinations"
    description: "List PMC determinations (reverse-reachability for PreNeedDetermination.burial_case_id)"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk]
    code: 200
    input: ["burial_case_id?", "status?", "limit?", "offset?"]
    output: PreNeedDetermination[]

  - method: GET
    path: "/registry/pre-need-determinations/{pmcId}"
    description: "Fetch a PMC determination"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk]
    code: 200
    input: []
    output: PreNeedDetermination

  - method: POST
    path: "/registry/pre-need-determinations/{pmcId}/approve"
    description: "Approve a PENDING PMC; issues pmc_number and sets expires_on. OCC via expected_pmc_version."
    roles: [EligibilityOfficer]
    code: 200
    input: [expected_pmc_version]
    output: PreNeedDetermination
    side_effects: ["PENDING -> APPROVED", "issue pmc_number", "set expires_on", "increments PreNeedDetermination.version by 1"]

  - method: POST
    path: "/registry/pre-need-determinations/{pmcId}/deny"
    description: "Deny a PENDING PMC"
    roles: [EligibilityOfficer]
    code: 200
    input: []
    output: PreNeedDetermination
    side_effects: ["PENDING -> DENIED", "increments PreNeedDetermination.version by 1"]

  - method: POST
    path: "/registry/pre-need-determinations/{pmcId}/expire-sweep"
    description: "Expire an APPROVED PMC whose reservation window has elapsed with no assignment; releases any reserved unit"
    roles: [NCA_Admin]
    code: 200
    input: []
    output: PreNeedDetermination
    side_effects: ["APPROVED -> EXPIRED when current_utc >= expires_on", "release reserved unit if held", "increments PreNeedDetermination.version by 1"]

  # ---- IntermentSchedule ----
  - method: POST
    path: "/registry/interment-schedules"
    description: "Schedule an interment for an ASSIGNED case; drives ASSIGNED -> SCHEDULED"
    roles: [SchedulingClerk]
    code: 201
    input: [burial_case_id, window_start, window_end]
    output: IntermentSchedule
    side_effects: ["overlap check (calc overlap_gravesite/overlap_niche)", "copy gravesite_id/niche_id from case", "case ASSIGNED -> SCHEDULED"]

  - method: GET
    path: "/registry/interment-schedules"
    description: "List interment schedules (reverse-reachability for IntermentSchedule.burial_case_id / gravesite_id / niche_id)"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, HonorsCoordinator]
    code: 200
    input: ["burial_case_id?", "gravesite_id?", "niche_id?", "status?", "limit?", "offset?"]
    output: IntermentSchedule[]

  - method: GET
    path: "/registry/interment-schedules/{scheduleId}"
    description: "Fetch an interment schedule"
    roles: [NCA_Admin, EligibilityOfficer, SchedulingClerk, HonorsCoordinator]
    code: 200
    input: []
    output: IntermentSchedule

  - method: POST
    path: "/registry/interment-schedules/{scheduleId}/complete"
    description: "Complete an interment; drives case SCHEDULED -> INTERRED and cascades honors -> RENDERED"
    roles: [SchedulingClerk]
    code: 200
    input: []
    output: IntermentSchedule
    side_effects: ["SCHEDULED -> COMPLETED", "increment unit interment_count/inurnment_count; RESERVED -> OCCUPIED at capacity", "case -> INTERRED", "CONFIRMED honors -> RENDERED", "PRE_NEED: PreNeedDetermination APPROVED -> RESERVED", "recompute Section inventory"]

  - method: POST
    path: "/registry/interment-schedules/{scheduleId}/cancel"
    description: "Cancel a SCHEDULED interment; reverts case to ASSIGNED and cascades honors -> CANCELLED"
    roles: [SchedulingClerk]
    code: 200
    input: []
    output: IntermentSchedule
    side_effects: ["SCHEDULED -> CANCELLED", "case SCHEDULED -> ASSIGNED", "linked honors REQUESTED/CONFIRMED -> CANCELLED; flag_issued reset to false"]

  # ---- MarkerOrder ----
  - method: POST
    path: "/registry/marker-orders"
    description: "Draft a headstone/marker order for a case (case must be at least ASSIGNED)"
    roles: [MarkerClerk]
    code: 201
    input: [burial_case_id, marker_type, inscription_lines, "emblem_of_belief?"]
    output: MarkerOrder
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/registry/marker-orders"
    description: "List marker orders (reverse-reachability for MarkerOrder.burial_case_id)"
    roles: [NCA_Admin, MarkerClerk, SchedulingClerk]
    code: 200
    input: ["burial_case_id?", "status?", "limit?", "offset?"]
    output: MarkerOrder[]

  - method: GET
    path: "/registry/marker-orders/{markerId}"
    description: "Fetch a marker order with computed billable_characters/marker_charge_cents"
    roles: [NCA_Admin, MarkerClerk, SchedulingClerk]
    code: 200
    input: []
    output: MarkerOrder

  - method: POST
    path: "/registry/marker-orders/{markerId}/submit"
    description: "Submit a DRAFT marker order; validates inscription limits and computes charges (calc marker_charge)"
    roles: [MarkerClerk]
    code: 200
    input: []
    output: MarkerOrder
    side_effects: ["DRAFT -> SUBMITTED", "compute billable_characters + marker_charge_cents"]

  - method: POST
    path: "/registry/marker-orders/{markerId}/engrave"
    description: "Engrave a SUBMITTED marker (case must be INTERRED)"
    roles: [MarkerClerk]
    code: 200
    input: []
    output: MarkerOrder
    side_effects: ["SUBMITTED -> ENGRAVED"]

  - method: POST
    path: "/registry/marker-orders/{markerId}/cancel"
    description: "Cancel a DRAFT/SUBMITTED marker order"
    roles: [MarkerClerk]
    code: 200
    input: []
    output: MarkerOrder
    side_effects: ["DRAFT/SUBMITTED -> CANCELLED"]

  # ---- MilitaryHonors ----
  - method: POST
    path: "/registry/military-honors"
    description: "Request military honors for a SCHEDULED interment"
    roles: [HonorsCoordinator]
    code: 201
    input: [interment_schedule_id, detail_size]
    output: MilitaryHonors
    side_effects: ["status=REQUESTED; honors_date derived from schedule window_start"]

  - method: GET
    path: "/registry/military-honors"
    description: "List military honors (reverse-reachability for MilitaryHonors.interment_schedule_id)"
    roles: [NCA_Admin, HonorsCoordinator, SchedulingClerk]
    code: 200
    input: ["interment_schedule_id?", "status?", "limit?", "offset?"]
    output: MilitaryHonors[]

  - method: GET
    path: "/registry/military-honors/{honorsId}"
    description: "Fetch a military-honors record"
    roles: [NCA_Admin, HonorsCoordinator, SchedulingClerk]
    code: 200
    input: []
    output: MilitaryHonors

  - method: POST
    path: "/registry/military-honors/{honorsId}/confirm"
    description: "Confirm requested honors; enforces daily squad capacity and FULL_SQUAD entitlement, issues flag"
    roles: [HonorsCoordinator]
    code: 200
    input: []
    output: MilitaryHonors
    side_effects: ["REQUESTED -> CONFIRMED (capacity + entitlement checks)", "flag_issued = true"]

  - method: POST
    path: "/registry/military-honors/{honorsId}/cancel"
    description: "Cancel requested/confirmed honors; resets flag"
    roles: [HonorsCoordinator]
    code: 200
    input: []
    output: MilitaryHonors
    side_effects: ["REQUESTED/CONFIRMED -> CANCELLED; flag_issued reset to false"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK (burial_case_id, section_id, interment_schedule_id, reserving_case_id, unit_id) does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field or malformed body / invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting this transition" }
  - { id: ERR_UNIT_KIND_MISMATCH, http: 422, condition: "Gravesite under COLUMBARIUM section / Niche under IN_GROUND section / NICHE_COVER marker on gravesite case (or vice versa) / explicit assign unit outside case cemetery" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Interment window_end <= window_start" }
  - { id: ERR_GRAVESITE_WINDOW_CONFLICT, http: 409, condition: "Requested gravesite window collides with an existing schedule within the 48h buffer (closed-closed + buffer)" }
  - { id: ERR_NICHE_WINDOW_CONFLICT, http: 409, condition: "Requested niche window overlaps an existing schedule (half-open, zero buffer)" }
  - { id: ERR_INSCRIPTION_LIMIT_EXCEEDED, http: 422, condition: "Inscription exceeds max lines or max chars per line" }
  - { id: ERR_HONORS_ENTITLEMENT_INSUFFICIENT, http: 422, condition: "FULL_SQUAD requested but entitlement_score < HONORS_FULL_SQUAD_MIN_SCORE" }
  - { id: ERR_HONORS_CAPACITY_FULL, http: 409, condition: "Confirmed honors on honors_date already >= cemetery honors_squad_capacity" }
  - { id: ERR_NO_AVAILABLE_UNIT, http: 409, condition: "assign-plot found no AVAILABLE unit matching the requested class, or explicit unit is not assignable" }
  - { id: ERR_STALE_GRAVESITE_VERSION, http: 412, condition: "expected_gravesite_version != current Gravesite.version on explicit assign-plot" }
  - { id: ERR_STALE_PMC_VERSION, http: 412, condition: "expected_pmc_version != current PreNeedDetermination.version on approve" }
  - { id: ERR_PMC_REQUIRED, http: 409, condition: "assign-plot on a PRE_NEED case whose PreNeedDetermination is not APPROVED" }
  - { id: ERR_PMC_EXPIRED, http: 409, condition: "assign-plot on a PRE_NEED case whose APPROVED PMC window has already elapsed (current_utc >= expires_on)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NCA_Admin
    description: "National Cemetery Administration operator: manages cemeteries, sections, inventory, PMC expiry sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /registry/cemeteries"
      - "POST /registry/sections"
      - "POST .../gravesites"
      - "POST .../niches"
      - "POST .../gravesites/{id}/decommission"
      - "POST .../pre-need-determinations/{id}/expire-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"

  - name: EligibilityOfficer
    description: "Adjudicates veteran/dependent eligibility and PMC pre-need determinations"
    identity: opaque
    exclusive_operations:
      - "POST .../burial-cases/{id}/eligibility"
      - "POST .../pre-need-determinations"
      - "POST .../pre-need-determinations/{id}/approve"
      - "POST .../pre-need-determinations/{id}/deny"
    shared_operations:
      - "POST .../burial-cases (shared with SchedulingClerk)"
      - "GET reads"

  - name: SchedulingClerk
    description: "Owns plot assignment, interment scheduling, and lifecycle of the burial case after eligibility"
    identity: opaque
    exclusive_operations:
      - "POST .../burial-cases/{id}/assign-plot"
      - "POST .../burial-cases/{id}/release-plot"
      - "POST .../burial-cases/{id}/cancel"
      - "POST .../interment-schedules"
      - "POST .../interment-schedules/{id}/complete"
      - "POST .../interment-schedules/{id}/cancel"
    shared_operations:
      - "POST .../burial-cases (shared with EligibilityOfficer)"
      - "GET reads"

  - name: MarkerClerk
    description: "Owns headstone/marker order lifecycle and inscription"
    identity: opaque
    exclusive_operations:
      - "POST .../marker-orders"
      - "POST .../marker-orders/{id}/submit"
      - "POST .../marker-orders/{id}/engrave"
      - "POST .../marker-orders/{id}/cancel"
    shared_operations:
      - "GET reads"

  - name: HonorsCoordinator
    description: "Owns military honors detail and burial flag issuance"
    identity: opaque
    exclusive_operations:
      - "POST .../military-honors"
      - "POST .../military-honors/{id}/confirm"
      - "POST .../military-honors/{id}/cancel"
    shared_operations:
      - "GET reads"

# =============================================================================
# Named constants referenced across tables (for downstream generators)
# =============================================================================
constants:
  MIN_SERVICE_DAYS: 730
  PMC_RESERVATION_DAYS: 365
  INSCRIPTION_MAX_LINES: 6
  INSCRIPTION_MAX_CHARS_PER_LINE: 40
  FREE_CHARACTER_ALLOWANCE: 60
  EMBLEM_CHAR_EQUIV: 15
  CHARS_PER_BLOCK: 10
  BLOCK_PRICE_CENTS: 250
  GRAVESITE_BUFFER_HOURS: 48
  HONORS_FULL_SQUAD_MIN_SCORE: 110
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
