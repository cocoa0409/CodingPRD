            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H G4" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card1}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
          trigger:
            - { call: "POST /ebt/cards/${card1}/replace", payload: {}, as: Cardholder, as_user_id: "${case_id}", captures: { fee: $.data.fee_charged_cents, waived: $.data.fee_waived } }
            - { call: "GET /ebt/case-accounts/${case_id}", payload: {}, as: StateAdmin, captures: { rw: $.data.replacements_in_window } }
          assert:
            - "fee_charged_cents == 0 and fee_waived == false (free allowance consumed; no purse debited)"
            - "case replacements_in_window == 1"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: void_reversal_visible_on_immediate_reread
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "state_machines.PurchaseTransaction.AUTHORIZED_to_VOIDED"]
        distinguishing_aspect: "Immediate consistency: the void's compensating VOID_CREDIT is visible on the very next read with no reconciliation lag — the purse reread shows spendable 30000 and the ledger already lists the VOID_CREDIT row."
        test_recipe:
          setup: ["Contract TX ACTIVE with FOOD; retailer R1; case 0000000000 active card 30000 food; one 800-cent purchase on 2026-09-02"]
          setup_api_calls:
            - { call: "POST /ebt/contracts", payload: { state_code: "TX" }, as: StateAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /ebt/programs", payload: { contract_id: "${c_id}", program_type: "FOOD" }, as: StateAdmin, captures: { p_food: $.data.id } }
            - { call: "POST /ebt/contracts/${c_id}/status", payload: { to: "ACTIVE" }, as: StateAdmin }
            - { call: "POST /ebt/retailers", payload: { contract_id: "${c_id}", retailer_name: "R1", acquirer_reference: "ACQ1" }, as: StateAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /ebt/retailers/${r_id}/item-files", payload: { items: [ { upc: "111111111111", food_eligible: true, effective_from: "2026-08-01", effective_to: null } ] }, as: RetailerSystem, as_user_id: "${r_id}" }
            - { call: "POST /ebt/case-accounts", payload: { contract_id: "${c_id}", case_identifier: "0000000000", head_of_household_name: "H F4" }, as: StateAdmin, captures: { case_id: $.data.id } }
            - { call: "GET /ebt/purses", payload: { case_account_id: "${case_id}", program_id: "${p_food}" }, as: StateAdmin, captures: { pu_food: "$.data[0].id" } }
            - { call: "POST /ebt/contracts/${c_id}/allotment-runs", payload: { program_id: "${p_food}", benefit_month: "2026-09", amount_cents: 30000 }, as: StateAdmin }
            - { call: "POST /ebt/cards", payload: { case_account_id: "${case_id}" }, as: CardholderServices, captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T12:00:00Z" }, as: StateAdmin }
            - { call: "POST /ebt/cards/${card_id}/activate", payload: { pin: "1234" }, as: Cardholder, as_user_id: "${case_id}" }
            - { call: "POST /ebt/retailers/${r_id}/authorizations", payload: { card_id: "${card_id}", pin: "1234", authorization_type: "PURCHASE", items: [ { upc: "111111111111", quantity: 1, unit_price_cents: 800 } ] }, as: RetailerSystem, as_user_id: "${r_id}", captures: { txn: $.data.id } }
          trigger:
            - { call: "POST /ebt/authorizations/${txn}/void", payload: {}, as: RetailerSystem, as_user_id: "${r_id}", captures: { vstat: $.data.txn_status } }
            - { call: "GET /ebt/purses/${pu_food}", payload: {}, as: StateAdmin, captures: { spd: $.data.spendable_balance_cents } }
            - { call: "GET /ebt/purses/${pu_food}/ledger", payload: { entry_type: "VOID_CREDIT" }, as: StateAdmin, captures: { vc: "$.data[0].amount_cents" } }
          assert:
            - "void response txn_status == 'VOIDED'"
            - "immediate purse reread: spendable_balance_cents == 30000"
            - "immediate ledger reread: a VOID_CREDIT row of 800 exists (no eventual-consistency lag)"
