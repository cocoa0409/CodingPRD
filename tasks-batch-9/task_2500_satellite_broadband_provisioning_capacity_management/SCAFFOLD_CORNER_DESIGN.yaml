          assert:
            - "first trigger response HTTP status == 403 and data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "second trigger response HTTP status == 403 and data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "third trigger response HTTP status == 201 (the owner's identical call is accepted)"
            - "ObstructionScan.${scan1_id}.terminal_id == ${term1_id} and verdict == PASS"
            - "GET /satellite-broadband/terminals/${term1_id}/obstruction-scans returns data.total_count == 1 (the refused attempt stored nothing)"
            - "Terminal.${term1_id}.last_scan_verdict == PASS and Terminal.${term2_id}.last_scan_verdict == null"

