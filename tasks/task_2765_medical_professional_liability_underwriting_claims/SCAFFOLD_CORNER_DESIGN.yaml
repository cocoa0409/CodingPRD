              as: ChiefActuary
              as_user_id: "chief-1"
          assert:
            - "decision as ActuarialAnalyst response.status == 403 and error_id == ERR_UNAUTHORIZED"
            - "APPROVE by the preparer response.status == 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "REJECT by the preparer response.status == 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "WITHDRAW by the preparer response.status == 200"
            - "RateFiling.${rf_a}.status == WITHDRAWN"
            - "RateFiling.${rf_a}.prepared_by_user_id == chief-1"
            - "RateFiling.${rf_a}.decided_by_user_id == chief-1"
            - "RateFiling.${rf_a}.adequacy_flag == NOT_EVALUABLE"
            - "RateFiling.${rf_a}.approved_rate_change_pct == null"
            - "SpecialtyClass.${sc_obgyn}.base_rate_per_million == 38000.00"
            - "SpecialtyClass.${sc_obgyn}.rate_revision_index == 0"

