  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_settlement_create_against_a_stale_store_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[settlement-create-stale-store]
          - validations[priority=2]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/franchise/settlements
        distinguishing_aspect: "A settlement create carrying an expected_store_version one behind the store's current version is rejected 412 ERR_STALE_VERSION, and the store's version that the client last observed is only obtainable from a server response — a literal cannot be substituted because the agreement activation already bumped it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement — so the store's version has already advanced past its post-create value of 1."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Willamette Stores LLC", owner_name: "Tova Lindgren", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frY_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frY_id}", store_number: "OR-1600", state_code: "OR", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stY_id: $.data.id }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frY_id}", store_id: "${stY_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agY_id: $.data.id }
            - call: "POST /franchise/agreements/${agY_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "GET /franchise/stores/${stY_id}"
              payload: {}
              as: FranchisorAdmin
              captures: { stY_v: $.data.version }
          trigger:
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stY_id}", franchisee_id: "${frY_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stY_v} - 1" }
              as: FranchisorAdmin
              captures: { err_occ: $.data.error_id }
          assert:
            - "the response status is 412 and err_occ == ERR_STALE_VERSION"
            - "GET /franchise/settlements?store_id=${stY_id} returns 0 rows"
            - "retrying with expected_store_version ${stY_v} succeeds with status 201"
            - "the stale request was rejected because the agreement activation had already advanced the store's version"

      - name: occ_revenue_line_against_a_stale_settlement_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[revenue-line-stale-settlement]
          - validations[priority=2]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/franchise/settlements/{id}/revenue-lines
        distinguishing_aspect: "A second OCC guard on a different parent and a different write endpoint: appending a revenue line to a settlement whose version advanced after the first line was appended is rejected 412 ERR_STALE_VERSION, so the guard is per-settlement rather than per-store."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement and one OPEN settlement with one revenue line already appended."
          setup_api_calls:
