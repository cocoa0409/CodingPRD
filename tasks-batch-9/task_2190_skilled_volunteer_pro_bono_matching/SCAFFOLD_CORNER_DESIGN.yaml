            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /project-requests/${req_id} shows status == \"DRAFT\" and version == ${req_v0}"
      - name: rbac_partner_contact_cannot_author_scope_revision
        claim_type: cross_role_denial
        grounds: ["endpoints[POST /project-requests/{id}/scope-definitions]", "roles.ScopingSpecialist.exclusive_operations[POST /project-requests/{id}/scope-definitions]", "errors[ERR_ROLE_NOT_PERMITTED]", "validations[priority=2]"]
        distinguishing_aspect: "The partner supplies the expected_project_request_version correctly and would otherwise pass the priority-29 concurrency gate, but authorship is the specialist's: the 403 fires at priority 2 so ProjectRequest.version does not increment and no DRAFT revision exists."
        test_recipe:
