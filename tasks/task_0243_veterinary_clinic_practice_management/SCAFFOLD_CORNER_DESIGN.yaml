        claim_type: Violation to Error
        grounds: ["validations[priority=13]", "errors[ERR_DEPOSIT_NOT_MET]"]
        distinguishing_aspect: "Approving a PRESENTED estimate whose deposit_posted_cents (0) < deposit_required_cents (40000) returns ERR_DEPOSIT_NOT_MET (402) — the fiscal check fires when the state precondition is satisfied (estimate IS PRESENTED)."
