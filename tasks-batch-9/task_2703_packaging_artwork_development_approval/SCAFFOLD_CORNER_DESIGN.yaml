          - errors[ERR_UNIT_CONSERVATION_VIOLATION]
          - entities.InventoryRunout.fields.state
          - entities.InventoryRunout.fields.reversal_count
        distinguishing_aspect: |
          The SCRAP probe violates two rules at once: the runout is RUNOUT_COMPLETE (33,
          409) and 50 + 0 does not equal remaining_qty 0 (51, 422). Only the lower
          priority number may surface, so the response must be 409
          ERR_RUNOUT_STATE_INVALID - an implementation that validates the payload
          arithmetic before the lifecycle returns 422 here. The reversal probe pins the
          other half of rule 33: reversal admits SCRAPPED only, so a RUNOUT_COMPLETE
