            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${cheap_id}", expected_rota_version: "${cheap_v1}", partner_id: "${southc_id}", manual_rank: 1, quoted_fee_cents: 1200, quoted_turnaround_days: 9, is_enabled: true }
