  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: match_report_dispute_reject_cycle
        grounds:
          - state_machines.Match.REPORTED_to_DISPUTED
          - state_machines.Match.DISPUTED_to_REPORTED
          - state_machines.Dispute.OPEN_to_REJECTED
        distinguishing_aspect: "Match cycles REPORTED -> DISPUTED -> REPORTED: raising a dispute freezes a REPORTED match to DISPUTED, and a REJECTED resolution returns it to REPORTED (a non-linear revert loop on the Match entity), after which confirm succeeds."
        test_recipe:
          setup:
            - "2-player SINGLE_ELIM in IN_PROGRESS, final match SCHEDULED then REPORTED (P1 home wins 2-0); P2 raises a dispute (match -> DISPUTED)."
          setup_api_calls:
