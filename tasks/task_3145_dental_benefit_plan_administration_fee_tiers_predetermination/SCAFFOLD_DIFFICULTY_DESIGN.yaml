              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-03T00:00:00Z", received_date: "2026-02-04T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "while Plan ACTIVE: identical claim payload returns 201 and adjudicates (claim status ADJUDICATED, line plan_pay 5000)"
            - "after Plan ACTIVE -> SUSPENDED: the same payload is rejected with 409 ERR_PLAN_NOT_ACTIVE"

      - name: claim_submission_depends_on_provider_state
        grounds:
          - validations[priority=7]
          - state_machines.Provider.ACTIVE_to_TERMINATED
          - endpoints.POST_/dental/claims
        distinguishing_aspect: |
          Entity pair Claim -> Provider (distinct from Claim -> Plan): claim
          admissibility depends on the RENDERING provider's lifecycle state.
          After the provider is TERMINATED, new claims for that provider are
          rejected with ERR_PROVIDER_TERMINATED while the plan remains ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z."
            - "Plan ACTIVE (no waiting, deductible 0, prev 100); PPO provider with no open work; schedule with D0120 5000 ACTIVE; subscriber effective 2026-01-01."
          setup_api_calls:
