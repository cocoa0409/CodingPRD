  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: incident_parallel_dimensions_with_appeal_cycle
        grounds:
          - state_machines.BehaviorIncident.ADJUDICATED / ACTIVE_to_ADJUDICATED / APPEALED
          - state_machines.BehaviorIncident.ADJUDICATED / APPEALED_to_ADJUDICATED / ACTIVE
          - state_machines.BehaviorIncident.ADJUDICATED / ACTIVE_to_ADJUDICATED / SERVED
        distinguishing_aspect: |
          BehaviorIncident carries two PARALLEL state dimensions
          (adjudication_status x suspension_status) and a CYCLE
          ACTIVE -> APPEALED -> ACTIVE (appeal denied), then a system sweep
          drives ACTIVE -> SERVED; the member's own status rides along
          SUSPENDED throughout the cycle.
        test_recipe:
          setup:
            - "ACTIVE member; two directors (d1 adjudicates, d2 resolves — segregation of duties)"
            - "LEVEL_3 incident (8 points) dated 2026-08-03, sustained with a 2-day suspension starting 2026-08-03"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
              payload: { name: "Club E", youth_capacity: 60, standard_ratio: 15, elevated_ratio: 8, base_weekly_fee_cents: 5000, registration_fee_cents: 2500, max_arrears_cents: 10000, meal_rates_cents: { BREAKFAST: { FREE: 225, REDUCED: 195, PAID: 45 }, SNACK: { FREE: 110, REDUCED: 55, PAID: 15 }, SUPPER: { FREE: 315, REDUCED: 275, PAID: 55 } } }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir One", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - { call: "POST /staff/${d1}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${d1}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /staff"
              payload: { site_id: "${site_id}", full_name: "Dir Two", position: "DIRECTOR" }
              as: PlatformAdmin
              captures: { d2: $.data.id }
            - { call: "POST /staff/${d2}/credentials", payload: { kind: "BACKGROUND_CHECK", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /staff/${d2}/credentials", payload: { kind: "TRAINING", expires_at: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /members"
              payload: { site_id: "${site_id}", legal_name: "Kid X", date_of_birth: "2011-01-01", grade: 8, household_size: 1, household_income_cents: 1000000 }
              as: SiteDirector
              as_user_id: "${d1}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - call: "POST /behavior-incidents"
              payload: { member_id: "${m1}", incident_date: "2026-08-03", category: "LEVEL_3" }
              as: SiteDirector
              as_user_id: "${d1}"
              captures: { inc1: $.data.id }
          trigger:
            - { call: "POST /behavior-incidents/${inc1}/adjudicate", payload: { outcome: "SUSTAINED", suspension_days: 2, suspension_start_date: "2026-08-03" }, as: SiteDirector, as_user_id: "${d1}" }
            - { call: "POST /behavior-incidents/${inc1}/appeal", payload: {}, as: SiteDirector, as_user_id: "${d1}" }
            - { call: "POST /behavior-incidents/${inc1}/resolve-appeal", payload: { decision: "DENIED" }, as: SiteDirector, as_user_id: "${d2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /club-days", payload: { site_id: "${site_id}", date: "2026-08-06" }, as: SiteDirector, as_user_id: "${d1}" }
          assert:
            - "after adjudicate: BehaviorIncident.${inc1} adjudication_status == ADJUDICATED and suspension_status == ACTIVE (start <= today); Member.${m1}.status == SUSPENDED"
            - "after appeal: suspension_status == APPEALED and Member.${m1}.status still == SUSPENDED"
            - "after resolve-appeal DENIED: suspension_status == ACTIVE again (cycle closed APPEALED -> ACTIVE) and Member still SUSPENDED"
            - "after 2026-08-06 day open sweep (start 08-03 + 2 days = 08-05 <= 08-06): suspension_status == SERVED and Member.${m1}.status == ACTIVE"
            - "Member.${m1}.behavior_points == 8 throughout (LEVEL_3)"

      - name: member_suspension_cycle_reentry
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          The MEMBER machine (a different entity than BehaviorIncident) is
          cyclic: ACTIVE -> SUSPENDED -> ACTIVE -> SUSPENDED -> ACTIVE across
          two independent incidents, proving re-entry into SUSPENDED is legal
          and served suspensions release the member only when no other ACTIVE
          suspension exists.
        test_recipe:
          setup: ["ACTIVE member; two separate incidents each imposing a 1-day suspension on successive weeks"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /sites"
