          - endpoints[GET /journals/{id}/metrics]
        distinguishing_aspect: |
          A different boundary metric on a distinct endpoint — GET /journals/{id}/metrics at the
          empty-collection edge: with zero manuscripts and zero invitations the two rate fields must
          be the literal 0.00 (not null and not a division-by-zero error) while
          median_days_to_first_decision must be null (not 0.00), so the two empty-set conventions in
          journal_metrics_rollup are distinguished on the same response.
        test_recipe:
          setup:
            - "One Journal created with default config and nothing else in the database: no Manuscript, no ReviewInvitation, no Reviewer, no APCInvoice."
