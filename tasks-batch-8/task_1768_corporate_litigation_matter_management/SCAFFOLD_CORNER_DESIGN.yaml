  - name: error_schedule_conflict_overlap
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SCHEDULE_CONFLICT]
    - validations[priority=13]
    excluded_because:
      difficulty_instance: work_order_vendor_window_half_open_overlap
      rationale: The overlapping-window rejection (wo3) is asserted as the failure path of the named §1.8 instance.
  - name: error_vendor_clearance_insufficient
    claim_type: violation_to_error
    grounds:
    - errors[ERR_VENDOR_CLEARANCE_INSUFFICIENT]
    - validations[priority=10]
    excluded_because:
      difficulty_instance: work_order_authorize_requires_hold_issued
      rationale: Vendor clearance gating is exercised in §1.8 cross-entity and posture instances; the dedicated clearance-matrix failure (STANDARD vendor on CLASS_ACTION matter) is covered by extension
        of the same authorize path.
  - name: error_matter_posture_frozen_gate
    claim_type: violation_to_error
    grounds:
    - errors[ERR_MATTER_POSTURE_FROZEN]
    - validations[priority=9]
    excluded_because:
      difficulty_instance: work_order_authorize_posture_vs_temporal_priority
      rationale: Asserted as the winning error of the named §1.8 priority-conflict instance.
  - name: error_rate_cap_on_approve
    claim_type: violation_to_error
    grounds:
    - errors[ERR_RATE_CAP_EXCEEDED]
    - validations[priority=17]
    excluded_because:
      difficulty_instance: engagement_approve_state_vs_fiscal_priority
      rationale: The over-cap rate condition is armed (and outranked) in the named §1.8 instance; ERR_RATE_CAP_EXCEEDED's standalone trigger at create time is covered by error_rate_cap_exceeded_on_engagement_create
        in §1.9 errors section.
  - name: error_duplicate_accrual_bucket
    claim_type: violation_to_error
    grounds:
    - errors[ERR_DUPLICATE]
    - validations[priority=12]
    excluded_because:
      difficulty_instance: accrual_period_bucket_uniqueness
      rationale: Asserted as the failure path (acc2_err == ERR_DUPLICATE) of the named §1.8 instance.
  - name: error_reference_state_invalid_on_engagement_approve
    claim_type: violation_to_error
    grounds:
    - errors[ERR_REFERENCE_STATE_INVALID]
    - validations[priority=16]
    excluded_because:
      difficulty_instance: engagement_approve_requires_firm_panel_approved
      rationale: Asserted as the first trigger's error in the named §1.8 instance.
  - name: error_settlement_authority_wrong_role
    claim_type: violation_to_error
    grounds:
    - errors[ERR_SETTLEMENT_AUTHORITY]
    - validations[priority=19]
    excluded_because:
      difficulty_instance: settlement_authority_single_vs_dual_boundary_exact_cent
      rationale: Authority-routing behavior (single vs dual at the cent boundary) is the subject of the named §1.8 instance; wrong-role denial flows through the same check.
  - name: error_budget_exceeded_on_payment
    claim_type: violation_to_error
    grounds:
    - errors[ERR_BUDGET_EXCEEDED]
    - validations[priority=20]
    excluded_because:
      difficulty_instance: budget_utilization_floor_boundary_899999_stays_open
      rationale: The fiscal arithmetic (accrued vs fy budget) is exercised at the floor boundary in the named §1.8 instance; the over-budget finance-approve rejection uses the same computed remainder.
