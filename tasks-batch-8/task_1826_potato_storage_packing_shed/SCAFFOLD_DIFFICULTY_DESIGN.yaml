            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-2", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b2_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 1000.00 }, as: IntakeClerk, captures: { l1_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l1_id}/bin-assignment", payload: { bin_id: "${b1_id}" }, as: IntakeClerk, captures: { l1_v: "$.data.version" } }
