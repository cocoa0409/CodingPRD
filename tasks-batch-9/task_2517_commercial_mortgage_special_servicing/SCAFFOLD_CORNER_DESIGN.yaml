              as_user_id: "amgr-002"
              captures: { invalid_transition_error: "$.data.error_id" }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "Appraisal.${appraisal_id}.status is still ORDERED with value_usd, as_of_date, coverage_start_date and coverage_end_date all null"
            - "No AppraisalReduction row exists for the loan: GET /special-servicing/appraisal-reductions with loan_id ${loan_id} returns total_count 0"
            - "Loan.${loan_id}.last_appraised_value_usd is still null"

      - name: newly_created_rows_start_in_their_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.BorrowerRequest.initial_state
          - state_machines.Appraisal.initial_state
          - state_machines.Advance.initial_state
        distinguishing_aspect: "Three different aggregates created back to back must each land on their own declared initial state — SUBMITTED, ORDERED, OUTSTANDING — with none of them defaulting to a shared DRAFT-like value."
        test_recipe:
          setup:
            - "One loan in SPECIAL_SERVICING; the MODIFICATION deposit floor is 25,000.00 so the request posts exactly that."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V5", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V05", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
          trigger:
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 25000, requested_terms_note: "rate relief for eighteen months", proposed_rate_pct: 4.5, proposed_maturity_date: "2031-06-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${loan_id}"
              captures: { request_id: "$.data.id", request_status: "$.data.status", info_count: "$.data.info_request_count" }
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id", appraisal_status: "$.data.status", due_date: "$.data.due_date" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "TAX_INSURANCE_ADVANCE", amount_usd: 50000, advanced_on: "2026-08-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_id: "$.data.id", advance_status: "$.data.status" }
          assert:
            - "BorrowerRequest.status == SUBMITTED with info_request_count 0, servicing_standard_margin_usd null and decided_on null"
            - "Appraisal.status == ORDERED with valuation_valid_months defaulted to 12 and received_on null"
            - "Advance.status == OUTSTANDING with reimbursed_principal_usd 0.00, reimbursed_interest_usd 0.00 and accrued_interest_usd 0.00 (advanced_on equals the clock, so the 30/360 day count is 0)"
            - "Every one of the three rows has version == 1"

      - name: withdrawn_borrower_request_is_terminal_and_locked_down
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BorrowerRequest.terminal_states
          - validations[priority=8]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "WITHDRAWN is terminal, so none of the three status paths that would otherwise be open from SUBMITTED (UNDER_ANALYSIS, DENIED, a second WITHDRAWN) may fire, and the analysis endpoint is equally closed."
        test_recipe:
          setup:
            - "One loan in SPECIAL_SERVICING with a MODIFICATION request withdrawn by the borrower."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V6", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V06", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 25000, requested_terms_note: "rate relief" }
              as: Borrower
              as_user_id: "${loan_id}"
              captures: { request_id: "$.data.id" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "WITHDRAWN" }
              as: Borrower
              as_user_id: "${loan_id}"
              captures: { withdrawn_status: "$.data.status", deposit_after: "$.data.processing_fee_deposit_usd" }
          trigger:
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { reopen_error: "$.data.error_id" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/status"
              payload: { to_status: "WITHDRAWN" }
              as: Borrower
              as_user_id: "${loan_id}"
              captures: { rewithdraw_error: "$.data.error_id" }
            - call: "POST /special-servicing/borrower-requests/${request_id}/analysis"
              payload: { npv_recovery_with_request_usd: 9100000, npv_recovery_without_request_usd: 9000000, analysis_discount_rate_pct: 9.5 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { analysis_error: "$.data.error_id" }
          assert:
            - "The withdrawal returned HTTP 200 with status WITHDRAWN and processing_fee_deposit_usd still 25000.00 — the deposit is explicitly not refunded"
            - "All three probes return HTTP 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "BorrowerRequest.${request_id}.status is still WITHDRAWN and its version did not move across the three refusals"
            - "servicing_standard_margin_usd and servicing_standard_conclusion remain null — the refused analysis wrote nothing"

      - name: repeated_transfer_to_special_servicing_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Loan.MASTER_SERVICING_to_SPECIAL_SERVICING
          - validations[priority=8]
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Replaying the same trigger is not a no-op: SPECIAL_SERVICING -> SPECIAL_SERVICING is undeclared, so the state gate at priority 8 answers first even though the business gate at priority 24 would also fire (the only qualifying event was consumed by the first call). The observable error code proves which gate ran."
        test_recipe:
          setup:
            - "One loan already transferred to SPECIAL_SERVICING using its single BANKRUPTCY event."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V7", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
