            - call: "POST /sdu/disbursements/${disb_id}/return"
              payload: {}
              as: FinanceOfficer
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: FinanceOfficer
              captures: { ndf: "$.data.net_disbursed_to_family_cents"}
          assert:
            - "Disbursement.${disb_id}.status == RETURNED"
            - "SupportOrder.${o_id}.net_disbursed_to_family_cents == 0"
            - "SupportOrder.${o_id}.arrears_principal_cents == 10000"

      - name: enforcement_propose_withdraw_conserves_orders_under_enforcement_count
        grounds:
          - state_machines.SupportOrder.enforcement_status.NONE_to_INTERCEPT_PENDING
          - state_machines.SupportOrder.enforcement_status.INTERCEPT_PENDING_to_NONE
          - entities.SupportOrder.fields.enforcement_status
        distinguishing_aspect: |
          Conserved quantity = orders_under_enforcement_count (count of orders with enforcement_status IN {INTERCEPT_PENDING, INTERCEPT_ACTIVE}), a count rather than a money balance. Propose (+1) followed by withdraw (-1) returns enforcement_status to NONE so the count is unchanged at 0.
        test_recipe:
          setup:
            - "ACTIVE order with arrears principal=50000; enforcement proposed (INTERCEPT_PENDING)."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP I2", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP I2", ssn_last4: "2121" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { o_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: CaseWorker
              captures: { o_ver: "$.data.version"}
            - call: "POST /sdu/enforcement-actions"
              payload: { support_order_id: "${o_id}", action_type: "LICENSE_SUSPENSION", expected_support_order_version: "${o_ver}" }
              as: CaseWorker
              captures: { enf_id: "$.data.id"}
          trigger:
            - call: "POST /sdu/enforcement-actions/${enf_id}/withdraw"
              payload: {}
              as: CaseWorker
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: CaseWorker
              captures: { enf: "$.data.enforcement_status"}
          assert:
            - "EnforcementAction.${enf_id}.status == WITHDRAWN"
            - "SupportOrder.${o_id}.enforcement_status == NONE"
