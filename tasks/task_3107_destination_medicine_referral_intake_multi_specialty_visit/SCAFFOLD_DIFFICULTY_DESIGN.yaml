              payload: { patient: { full_name: "Fred Fatigue", date_of_birth: "1980-01-01", residence_country: "US", residence_state: "IA", preferred_language: "en" }, referring_physician_name: "Dr. Hayes", referring_physician_contact: "hayes@example.org", reason: "multi-system workup" }
