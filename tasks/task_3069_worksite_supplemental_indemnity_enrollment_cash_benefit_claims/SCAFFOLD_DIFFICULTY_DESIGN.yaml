            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${s13}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "Q", benefit_amount_cents: 1000, max_occurrences_per_year: 2, lifetime_max_cents: 100000 }], monthly_premium_cents: 2200, wellness_benefit_cents: 500, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch13: $.data.id } }
            - { call: "POST /benefit-schedules/${sch13}/publish", payload: { expected_series_version: "${s13_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${s13}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g13}", counselor_id: "${c13}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam13: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam13}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /employees", payload: { employer_group_id: "${g13}", employee_ref: "E13", full_name: "Emp Thirteen", hire_date: "2026-01-01T00:00:00Z" }, as: GroupAdmin, captures: { e13: $.data.id } }
            - { call: "POST /policies", payload: { campaign_id: "${cam13}", employee_id: "${e13}", policy_series_id: "${s13}", premium_mode: "PRE_TAX" }, as: BenefitCounselor, captures: { p13: $.data.id } }
            - { call: "POST /policies/${p13}/issue", payload: {}, as: BenefitCounselor }
          trigger:
            - { call: "POST /policies/${p13}/port", payload: { new_premium_mode: "PRE_TAX" }, as: PolicyholderServices, captures: { err13: $.data.error_id } }
            - { call: "POST /employees/${e13}/terminate", payload: {}, as: GroupAdmin }
            - { call: "POST /policies/${p13}/port", payload: { new_premium_mode: "PRE_TAX" }, as: PolicyholderServices }
          assert:
            - "First port while Employee.${e13} is ACTIVE fails: ${err13} == ERR_PORT_NOT_ELIGIBLE; Policy.${p13}.status remains ISSUED"
            - "After employee termination, port succeeds: Policy.${p13}.status == PORTED"
            - "Policy.${p13}.premium_mode == POST_TAX even though new_premium_mode was PRE_TAX (ported policies are direct-billed)"

      - name: campaign_open_gated_on_employer_group_active
        grounds:
          - state_machines.EnrollmentCampaign.DRAFT_to_OPEN
          - state_machines.EmployerGroup.ACTIVE_to_SUSPENDED
          - errors[ERR_GROUP_INACTIVE]
        distinguishing_aspect: |
          DIFFERENT entity pair EnrollmentCampaign -> EmployerGroup: opening a
          DRAFT campaign is legal only while its employer group is ACTIVE; with
          the group SUSPENDED the same call fails with ERR_GROUP_INACTIVE, and it
          succeeds again after the group is reactivated.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G14 ACTIVE (0/0.0, DAILY); counselor C14 ACTIVE; campaign CAM14 DRAFT with window 2026-09-01..2026-10-01."
