            - call: "POST /psych-services/interpreter-sessions"
              payload: { evaluation_id: "${eval1}", language_code: "es", interpreter_name: "O. Vega", session_start_at: "2026-09-10T10:00:00Z", session_end_at: "2026-09-10T11:00:00Z" }
