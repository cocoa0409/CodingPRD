          - entities.PhysicianMember.fields.latest_scorecard_period
        distinguishing_aspect: |
          Creating a second scorecard for the same physician and
          measurement_period supersedes the earlier DRAFT at creation time —
          before any FINAL exists — so exactly one DRAFT remains and the
