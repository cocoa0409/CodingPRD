  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_reclassification_cycle_loop
        grounds:
          - state_machines.IncidentCase.RECORDABLE_to_RECLASSIFIED
          - state_machines.IncidentCase.RECLASSIFIED_to_RECORDABLE
        distinguishing_aspect: |
          IncidentCase uses a CYCLIC machine: RECORDABLE -> RECLASSIFIED ->
          RECORDABLE -> RECLASSIFIED -> RECORDABLE loops are legal and
          revision_index increments once per cycle's first leg. After two full
          loops revision_index == 2 — not a linear pipeline.
        test_recipe:
          setup:
            - "Company C, Establishment E, Employee W"
            - "Case K classified MEDICAL_TREATMENT (RECORDABLE) at clock 2026-08-03"
            - "Day entry RESTRICTED 3d attached (reclassify precondition: non-VOIDED entry exists)"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Epsilon Ltd", fein: "55-5656565" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Shop 3", naics_code: "336111", state_code: "MI", size_class: "STANDARD" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Worker Five", job_title: "Assembler", hire_date: "2024-05-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-02T10:00:00Z", description: "Cut", body_part: "palm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_v0}" }
              as: SafetyOfficer
              captures: { case_v1: $.data.version }
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-08-03", end_date: "2026-08-05" }
              as: SafetyOfficer
            - call: "GET /safety/cases/${case_id}"
              payload: {}
              as: SafetyOfficer
              captures: { case_v1b: $.data.version }
          trigger:
            - call: "POST /safety/cases/${case_id}/reclassify"
              payload: { expected_case_version: "${case_v1b}" }
              as: SafetyOfficer
              captures: { case_v2: $.data.version, rev_1: $.data.revision_index }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "DAYS_AWAY", expected_case_version: "${case_v2}" }
              as: SafetyOfficer
              captures: { case_v3: $.data.version }
            - call: "POST /safety/cases/${case_id}/reclassify"
              payload: { expected_case_version: "${case_v3}" }
              as: SafetyOfficer
              captures: { case_v4: $.data.version, rev_2: $.data.revision_index }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_v4}" }
              as: SafetyOfficer
              captures: { final_class: $.data.classification, final_dart: $.data.is_dart }
          assert:
            - "loop 1 leg: status RECLASSIFIED with revision_index == 1"
            - "loop 1 close: classify to DAYS_AWAY succeeds from RECLASSIFIED (status RECORDABLE)"
            - "loop 2 leg: revision_index == 2"
            - "loop 2 close: classification == MEDICAL_TREATMENT, is_dart == false"
            - "same entity visited RECORDABLE three times via a legal cycle"

      - name: citation_contest_branching_fork_join
        grounds:
          - state_machines.Citation.ISSUED_to_CONTESTED
          - state_machines.Citation.CONTESTED_to_FINAL_ORDER
          - state_machines.Citation.CONTESTED_to_VACATED
          - state_machines.Citation.ISSUED_to_FINAL_ORDER
        distinguishing_aspect: |
          Citation uses a BRANCHING fork-join (different entity from
          IncidentCase): ISSUED forks into {accept-final-order, contest};
          contest diverges into {AFFIRMED/MODIFIED -> FINAL_ORDER, VACATED ->
          terminal}. Branches join at ABATEMENT_PENDING with divergent side
          effects: MODIFIED overrides final_penalty_usd; VACATED skips
          abatement entirely and auto-CANCELS linked corrective actions.
        test_recipe:
          setup:
            - "Company C, Establishment E; Inspection I OPEN"
            - "Citation X (proposed 14500) and Citation Y (proposed 2500) created at clock Mon 2026-08-03"
            - "Corrective action CA_Y linked to citation Y"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Zeta Corp", fein: "55-7878787" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Plant 9", naics_code: "325211", state_code: "LA", size_class: "LARGE" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/inspections"
              payload: { establishment_id: "${est_id}", opened_on: "2026-08-03", inspection_type: "COMPLAINT", scope: "PARTIAL" }
              as: SafetyOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /safety/citations"
              payload: { inspection_id: "${insp_id}", standard_cited: "29 CFR 1910.147", violation_type: "SERIOUS", proposed_penalty_usd: 14500, abatement_due_date: "2026-09-15" }
              as: SafetyOfficer
              captures: { cit_x: $.data.id }
            - call: "POST /safety/citations"
              payload: { inspection_id: "${insp_id}", standard_cited: "29 CFR 1910.134", violation_type: "OTHER_THAN_SERIOUS", proposed_penalty_usd: 2500, abatement_due_date: "2026-09-01" }
              as: SafetyOfficer
              captures: { cit_y: $.data.id }
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", citation_id: "${cit_y}", description: "Respirator program fix", assigned_to: "op-fix-2", due_date: "2026-08-30", priority: "MEDIUM" }
              as: SafetyOfficer
              captures: { ca_y: $.data.id }
          trigger:
            - call: "POST /safety/citations/${cit_x}/contest"
              payload: {}
              as: SafetyOfficer
            - call: "POST /safety/citations/${cit_x}/resolve-contest"
              payload: { outcome: "MODIFIED", final_penalty_usd: 9000 }
              as: SafetyOfficer
              captures: { cit_x_status: $.data.status, cit_x_final: $.data.final_penalty_usd, cit_x_deadline: $.data.contest_deadline }
            - call: "POST /safety/citations/${cit_y}/contest"
              payload: {}
              as: SafetyOfficer
            - call: "POST /safety/citations/${cit_y}/resolve-contest"
              payload: { outcome: "VACATED" }
              as: SafetyOfficer
              captures: { cit_y_status: $.data.status }
            - call: "GET /safety/corrective-actions/${ca_y}"
              payload: {}
              as: SafetyOfficer
              captures: { ca_y_status: $.data.status }
          assert:
            - "citation X after MODIFIED: status == ABATEMENT_PENDING (FINAL_ORDER auto-advances), final_penalty_usd == 9000 (overrides proposed 14500)"
            - "citation Y after VACATED: status == VACATED (terminal; abatement branch never entered)"
            - "CorrectiveAction CA_Y status == CANCELLED (auto-cancel fires only on the VACATED branch)"
            - "citation X contest_deadline == 2026-08-24T23:59:59Z (15 working days from Mon 2026-08-03)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: case_classify_cascades_summary_bounce_and_rate_shift
        grounds:
          - state_machines.IncidentCase.PENDING_REVIEW_to_RECORDABLE
          - state_machines.AnnualSummary.PREPARED_to_DRAFT
          - calculations.trir_rate
        distinguishing_aspect: |
