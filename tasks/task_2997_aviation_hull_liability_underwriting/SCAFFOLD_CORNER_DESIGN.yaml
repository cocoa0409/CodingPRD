      - name: corner_fleet_credit_threshold_does_not_reverse_when_the_fleet_shrinks
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.annual_hull_premium
          - calculations.endorsement_premium_delta
          - entities.Policy.fields.live_schedule_count
