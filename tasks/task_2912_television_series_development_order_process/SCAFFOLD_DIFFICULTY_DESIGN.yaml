        distinguishing_aspect: |
          Category pair (state, business_fiscal) - priority 11 against priority 45,
          a 34-rung gap decided on the POST /pilot-orders write. The project is still
          ACTIVE_DEVELOPMENT (never script-complete) AND the requested budget
          33000000 exceeds the slate's entire available_dev_cents of 30000000, so a
          fiscal-first implementation answers ERR_SLATE_DEV_BUDGET_EXCEEDED / 422
          instead of the required ERR_INVALID_PROJECT_STATE / 409.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one slate with total_dev_budget_cents 30000000 and pattern_budget_per_episode_cents 32000000, so available_dev_cents is 30000000"
            - "one DevelopmentProject on it still in ACTIVE_DEVELOPMENT with no script deal at all"
