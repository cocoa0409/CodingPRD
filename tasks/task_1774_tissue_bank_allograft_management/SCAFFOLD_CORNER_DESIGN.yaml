      - name: error_capacity_below_occupied_on_reconfigure
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAPACITY_BELOW_OCCUPIED]", calculations.storage_capacity_gating]
        distinguishing_aspect: "Reconfiguring nominal_capacity below what current occupancy (minus re-derived reserve) allows fails ERR_CAPACITY_BELOW_OCCUPIED; the freezer keeps its old capacity."
