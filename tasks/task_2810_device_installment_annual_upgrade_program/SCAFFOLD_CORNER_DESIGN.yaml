            - "PayoffQuote.${q_cancel}.quote_type == EARLY_CANCELLATION with remaining_principal_cents == 89900, unearned_premium_cents == 23976, premium_rebate_cents == 21578, admin_fee_cents == 2500 and total_payoff_cents == 70822"
            - "PayoffQuote.${q_roll}.status == SUPERSEDED after the EARLY_CANCELLATION quote is issued"
            - "the 70821-cent cancellation returns HTTP 422 with error_id ERR_PAYOFF_AMOUNT_MISMATCH and leaves InstallmentLoan.${loan}.status == ACTIVE"
            - "the 70822-cent cancellation returns HTTP 200 with status == PAID_OFF, obligation_balance_cents == 0 and closed_at == 2026-08-01T00:00:00Z"
