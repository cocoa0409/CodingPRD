        distinguishing_aspect: "Kind/outcome compatibility is enforced in both directions: VERIFY on an INNOCENT_OWNER claim and GRANT on a LIEN_MORTGAGE each fail 422 ERR_OUTCOME_KIND_MISMATCH, and both interests remain FILED (a failed adjudication is not a state change)."
