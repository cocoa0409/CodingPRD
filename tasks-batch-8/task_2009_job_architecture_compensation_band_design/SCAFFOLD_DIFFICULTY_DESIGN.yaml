scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: market_composite_provisional_vs_official
        grounds:
          - calculations.market_composite_pricing
          - calculations.market_cut_aging
          - entities.PayBand.fields.market_composite_cents
          - entities.PayBand.fields.composite_cut_count
        distinguishing_aspect: |
          PayBand-domain dual variant: identical cut population prices to
          12166667 under PROVISIONAL (SUBMITTED+ACCEPTED surveys, unweighted,
          unaged) but 12142750 under OFFICIAL (ACCEPTED only, sample-size
          weighted, aged) — same entity data, two sanctioned algorithms,
          different persisted results.
        test_recipe:
          setup:
            - "ENG family, levels P1(rank 1)/P2(rank 2), zone US-NAT (root ratio 1.0)"
            - "profile SWE2 (ENG/P2, weekly 200000, duties true) determined EXEMPT and APPROVED"
            - "program FY2027 pricing_as_of 2026-08-01 advanced to PRICING"
            - "survey S1 ACCEPTED eff 2026-01-01 with cut A p50 12000000 sample 40 eff 2026-01-01"
            - "survey S2 ACCEPTED eff 2025-07-01 with cut B p50 11500000 sample 10 eff 2025-07-01"
            - "survey S3 left SUBMITTED eff 2026-06-01 with cut C p50 13000000 sample 99 eff 2026-06-01"
            - "band (ENG,P2,US-NAT,P50,spread 0.50) created, never priced"
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "Software Engineer II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S1", publisher: "Pub", survey_year: 2026, effective_date: "2026-01-01" }, as: CompAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /comp/market-surveys", payload: { name: "S2", publisher: "Pub", survey_year: 2025, effective_date: "2025-07-01" }, as: CompAnalyst, captures: { s2: $.data.id } }
            - { call: "POST /comp/market-surveys", payload: { name: "S3", publisher: "Pub", survey_year: 2026, effective_date: "2026-06-01" }, as: CompAnalyst, captures: { s3: $.data.id } }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s1}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", p50_cents: 12000000, sample_size: 40, effective_date: "2026-01-01" }, as: CompAnalyst }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s2}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", p50_cents: 11500000, sample_size: 10, effective_date: "2025-07-01" }, as: CompAnalyst }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s3}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", p50_cents: 13000000, sample_size: 99, effective_date: "2026-06-01" }, as: CompAnalyst }
            - { call: "POST /comp/market-surveys/${s1}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-surveys/${s2}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.5000 }, as: CompAnalyst, captures: { band: $.data.id, band_v: $.data.version } }
          trigger:
            - { call: "POST /comp/pay-bands/${band}/price", payload: { pricing_variant: "PROVISIONAL", expected_pay_band_version: "${band_v}" }, as: CompAnalyst, captures: { prov_composite: $.data.market_composite_cents, prov_count: $.data.composite_cut_count, band_v2: $.data.version } }
            - { call: "POST /comp/pay-bands/${band}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band_v2}" }, as: CompAnalyst, captures: { off_composite: $.data.market_composite_cents, off_count: $.data.composite_cut_count } }
          assert:
            - "provisional composite == 12166667 (unweighted mean of all 3 raw p50, no aging; S3 admitted though SUBMITTED)"
            - "official composite == 12142750 (aged A 12210000 x40 + aged B 11873750 x10 over 50; S3 excluded)"
            - "provisional composite_cut_count == 3 and official composite_cut_count == 2"
            - "PayBand.${band}.midpoint_cents == 12142750 after OFFICIAL (P50 factor 1.0, geo 1.0, policy 1.0)"
            - "PayBand.${band}.min_cents == 9107063 and max_cents == 15178438 (spread 0.50, round_half_up of .5 halves)"
            - "PayBand.${band}.pricing_variant == OFFICIAL and market_composite_provisional != market_composite_official"

      - name: reslot_provisional_vs_final_adjustment
        grounds:
          - calculations.reslot_salary_adjustment
          - entities.MappingDecision.fields.provisional_adjustment_cents
          - entities.MappingDecision.fields.final_adjustment_cents
        distinguishing_aspect: |
          MappingDecision-domain dual variant (different entity domain from
          PayBand pricing): PROVISIONAL at submit reads the PRICED band
          (min 11050000 -> estimate 1050000); the band is re-priced to
          midpoint 14018750 (min 11915938) and PUBLISHED before approval, so
          FINAL at approve computes 1915938 for identical employee data.
        test_recipe:
          setup:
            - "ENG family, levels P1/P2, zone US-NAT; profiles SWE1 (P1) and SWE2 (P2) APPROVED (weekly 200000, duties true)"
            - "program FY2027 as_of 2026-08-01; band P1 priced OFFICIAL mid 10000000 (cut p50 10000000 eff 2026-08-01 sample 10, ACCEPTED) -> approved -> PUBLISHED while PRICING"
            - "band P2 priced OFFICIAL mid 13000000 (cut p50 13000000 eff 2026-08-01 sample 10, ACCEPTED) left PRICED"
            - "program advanced to MAPPING_OPEN; department DA pool 5000000; employee E1 salary 10000000 on SWE1 in US-NAT hire 2020-01-15"
            - "mapping E1 -> SWE2 submitted (provisional uses PRICED P2 band min 11050000)"
            - "second cut p50 15000000 eff 2026-06-15 sample 10 (ACCEPTED survey S2B) added; P2 re-priced OFFICIAL: aged cut2 = 15037500 (1 month), composite (13000000x10 + 15037500x10)/20 = 14018750, min 11915938; band approved and published"
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof1}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "SWE II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S1", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s1: $.data.id } }
            - { call: "POST /comp/market-surveys/${s1}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s1}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", p50_cents: 10000000, sample_size: 10, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s1}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", p50_cents: 13000000, sample_size: 10, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv1}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band1: $.data.id, band1_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band1}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band1_v}" }, as: CompAnalyst, captures: { band1_v2: $.data.version } }
            - { call: "POST /comp/pay-bands/${band1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands/${band1}/publish", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${nat}", target_percentile: "P50", spread_pct: 0.3000 }, as: CompAnalyst, captures: { band2: $.data.id, band2_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band2}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band2_v}" }, as: CompAnalyst, captures: { band2_v2: $.data.version } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "MAPPING_OPEN" }, as: CompAdmin }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof1}", geo_zone_id: "${nat}", base_salary_cents: 10000000, hire_date: "2020-01-15" }, as: HRBP, captures: { emp: $.data.id, emp_v: $.data.version } }
            - { call: "POST /comp/mapping-decisions", payload: { employee_id: "${emp}", to_job_profile_id: "${prof2}" }, as: DepartmentManager, as_user_id: "${dept}", captures: { md: $.data.id } }
            - { call: "POST /comp/mapping-decisions/${md}/submit", payload: {}, as: DepartmentManager, as_user_id: "${dept}", captures: { prov_adj: $.data.provisional_adjustment_cents } }
            - { call: "POST /comp/market-surveys", payload: { name: "S2B", publisher: "Pub", survey_year: 2026, effective_date: "2026-06-15" }, as: CompAnalyst, captures: { s2b: $.data.id } }
            - { call: "POST /comp/market-surveys/${s2b}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s2b}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", p50_cents: 15000000, sample_size: 10, effective_date: "2026-06-15" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands/${band2}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band2_v2}" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands/${band2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/pay-bands/${band2}/publish", payload: {}, as: CompManager }
            - { call: "POST /comp/mapping-decisions/${md}/hrbp-review", payload: {}, as: HRBP, as_user_id: "hrbp-1" }
            - { call: "POST /comp/mapping-decisions/${md}/comp-triage", payload: {}, as: CompAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /comp/mapping-decisions/${md}/approve", payload: { expected_employee_version: "${emp_v}" }, as: CompManager, as_user_id: "cm-1", captures: { final_adj: $.data.final_adjustment_cents } }
          assert:
            - "MappingDecision.${md}.provisional_adjustment_cents == 1050000 (PRICED band min 11050000 - salary 10000000 at submit)"
            - "MappingDecision.${md}.final_adjustment_cents == 1915938 (re-priced PUBLISHED band min 11915938 - 10000000 at approve)"
            - "final_adjustment_cents != provisional_adjustment_cents (band moved between variants)"
            - "MappingDecision.${md}.kind == UPSLOT"
            - "Employee.${emp}.base_salary_cents == 11915938 and job_profile_id == ${prof2}"
            - "Department.${dept}.committed_pool_cents == 1915938"

  - rule_id: combinatorial_formula
    instances:
      - name: midpoint_nested_rounding_order
        grounds:
          - calculations.band_midpoint_construction
          - calculations.band_min_max_construction
          - calculations.geo_effective_ratio
        distinguishing_aspect: |
          Mode (b) nested rounding: with composite 10000025, P62_5 factor
          1.06 and geo ratio 1.18, the pinned per-step rounding yields
          midpoint 12508032; a single final rounding of the same product
          yields 12508031 — the intermediate round_half_up steps decide the
          last cent.
        test_recipe:
          setup:
            - "ENG family, levels P1/P2; zones US-NAT (1.0) and US-BAY (parent NAT, 1.18 -> effective 1.180000)"
            - "profile SWE2 APPROVED; program as_of 2026-08-01 in PRICING"
            - "survey S ACCEPTED with single cut p50 10000025 sample 30 eff 2026-08-01 (0 months aged)"
            - "band (ENG,P2,US-BAY,P62_5,spread 0.40) created"
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-BAY", name: "SF Bay", differential_ratio: 1.180000, parent_zone_id: "${nat}" }, as: CompAdmin, captures: { bay: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "SWE II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager }
            - { call: "POST /comp/market-cuts", payload: { market_survey_id: "${s}", job_profile_id: "${prof2}", geo_zone_id: "${bay}", p50_cents: 10000025, sample_size: 30, effective_date: "2026-08-01" }, as: CompAnalyst }
            - { call: "POST /comp/pay-bands", payload: { comp_program_id: "${prog}", job_family_id: "${fam}", job_level_id: "${lv2}", geo_zone_id: "${bay}", target_percentile: "P62_5", spread_pct: 0.4000 }, as: CompAnalyst, captures: { band: $.data.id, band_v: $.data.version } }
            - { call: "POST /comp/pay-bands/${band}/price", payload: { pricing_variant: "OFFICIAL", expected_pay_band_version: "${band_v}" }, as: CompAnalyst }
          trigger:
            - { call: "GET /comp/pay-bands/${band}", payload: {}, as: CompAnalyst, as_user_id: "analyst-1" }
          assert:
            - "PayBand.${band}.market_composite_cents == 10000025"
            - "step1 pct_value == round_half_up(10000025 * 1.06) == 10600027 (the .5 rounds UP)"
            - "PayBand.${band}.midpoint_cents == 12508032 (round(10600027*1.18)=12508032; unrounded chain gives 12508031)"
            - "PayBand.${band}.min_cents == 10006426 and max_cents == 15009638 (spread 0.40: x0.8 and x1.2 with .6/.4 fractional cents)"
            - "PayBand.${band}.geo_ratio_snapshot == 1.180000"

      - name: overlap_clamp_and_guard
        grounds:
          - calculations.band_overlap_percentage
          - calculations.midpoint_progression_percentage
          - entities.ProgressionPolicy.fields.max_overlap_pct
        distinguishing_aspect: |
          Mode (a) nested min/max with clamp: P3 band min 15300000 exceeds P2
          band max 14950000, so raw overlap is negative and the pinned clamp
          yields exactly 0.0000 (not a negative ratio), while progression
          0.3846 passes the 0.15 policy floor — approve succeeds.
        test_recipe:
          setup:
            - "ENG family, levels P1/P2/P3 (ranks 1/2/3); zone US-NAT; profiles SWE1/SWE2/SWE3 APPROVED (weekly 200000, duties true)"
            - "policies: P1->P2 min_prog 0.1200 max_overlap 0.2500; P2->P3 min_prog 0.1500 max_overlap 0.2000"
            - "program as_of 2026-08-01 in PRICING; single-cut composites 10000000/13000000/18000000 (eff 2026-08-01, no aging)"
            - "bands P1 [8500000-11500000], P2 [11050000-14950000] priced OFFICIAL and COMP_APPROVED; band P3 priced OFFICIAL mid 18000000 spread 0.30"
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin, captures: { lv2: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P3", title: "Engineer III", rank_order: 3 }, as: CompAdmin, captures: { lv3: $.data.id } }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof1}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof1}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv2}", title: "SWE II", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof2: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof2}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof2}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv3}", title: "SWE III", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof3: $.data.id } }
            - { call: "POST /comp/job-profiles/${prof3}/determine-flsa", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof3}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /comp/job-profiles/${prof3}/approve", payload: {}, as: CompManager }
            - { call: "POST /comp/progression-policies", payload: { job_family_id: "${fam}", from_level_id: "${lv1}", to_level_id: "${lv2}", min_midpoint_progression_pct: 0.1200, max_overlap_pct: 0.2500 }, as: CompManager }
            - { call: "POST /comp/progression-policies", payload: { job_family_id: "${fam}", from_level_id: "${lv2}", to_level_id: "${lv3}", min_midpoint_progression_pct: 0.1500, max_overlap_pct: 0.2000 }, as: CompManager }
            - { call: "POST /comp/programs", payload: { fiscal_year: 2027, merit_budget_cents: 50000000, refresh_budget_cents: 2000000, pricing_as_of_date: "2026-08-01" }, as: CompAdmin, captures: { prog: $.data.id } }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "FRAMEWORK_LOCKED" }, as: CompAdmin }
            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PRICING" }, as: CompAdmin }
            - { call: "POST /comp/market-surveys", payload: { name: "S", publisher: "Pub", survey_year: 2026, effective_date: "2026-08-01" }, as: CompAnalyst, captures: { s: $.data.id } }
            - { call: "POST /comp/market-surveys/${s}/accept", payload: {}, as: CompManager }
