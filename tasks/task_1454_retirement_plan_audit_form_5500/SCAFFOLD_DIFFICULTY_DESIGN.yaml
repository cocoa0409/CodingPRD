          assert:
            - "Contribution.${ca_on}.timeliness_status == \"ON_TIME\""
            - "Contribution.${ca_on}.business_days_elapsed == 7"
            - "Contribution.${cb_late}.timeliness_status == \"LATE\""
            - "Contribution.${cb_late}.business_days_elapsed == 8"
            - "GET /plan-audit/late-contribution-assessments?engagement_id=${eng} returns exactly 1 assessment, for contribution ${cb_late}, with business_days_late == 1 and severity_hint == \"MEDIUM\""

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (two DIFFERENT entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: filing_submit_requires_report_issued
        grounds:
          - state_machines.Form5500Filing.READY_TO_FILE_to_FILED
          - state_machines.Engagement
        distinguishing_aspect: |
          Entity pair Form5500Filing -> Engagement: a READY_TO_FILE filing
          cannot submit while its engagement is still in TESTING (report never
          issued); the filing's own state machine is satisfied, so only the
          cross-entity precondition blocks the transition.
        test_recipe:
          setup:
            - "Small-plan engagement PY2025 in TESTING (activated, testing begun; fieldwork/report never performed)"
            - "Filing fully assembled to READY_TO_FILE; clock 2026-07-15 (before deadline)"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "015", plan_name: "Xi 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/engagements/${eng}/activate"
              payload: {}
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/begin_testing"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/filings"
              payload: { engagement_id: "${eng}" }
              as: TPASpecialist
              as_user_id: "u-tpa-1"
              captures: { fil: $.data.id }
            - call: "POST /plan-audit/schedule-entries"
              payload: { filing_id: "${fil}", schedule_type: "I", line_item: "I-1 total assets", amount_cents: 0 }
              as: TPASpecialist
              captures: { se: $.data.id }
            - call: "POST /plan-audit/schedule-entries/${se}/verify"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/filings/${fil}/mark_schedules_complete"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/filings/${fil}/mark_ready"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: System
          trigger:
            - call: "POST /plan-audit/filings/${fil}/submit"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "Form5500Filing.${fil}.status == \"READY_TO_FILE\""
            - "Engagement.${eng}.status == \"TESTING\""

      - name: action_approve_requires_acknowledged_finding
        grounds:
          - state_machines.CorrectiveAction.PROPOSED_to_APPROVED
          - state_machines.AuditFinding
          - errors[ERR_CORRECTION_NOT_ALLOWED]
        distinguishing_aspect: |
          Entity pair CorrectiveAction -> AuditFinding: a corrective action may
          be proposed against an OPEN finding, but approval is blocked until
          the FINDING has been acknowledged — the action's transition depends
          on a different entity's state, a different pair than
          Form5500Filing -> Engagement.
        test_recipe:
          setup:
            - "Engagement PY2025; manual MEDIUM finding left OPEN (never acknowledged); corrective action proposed against it by u-sponsor-1"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "016", plan_name: "Omicron 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "FEE_DISCLOSURE_GAP", severity: "MEDIUM", description: "Missing indirect comp detail" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "FEE_REDISCLOSURE", principal_cents: 100, planned_execution_date: "2026-04-01" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /plan-audit/corrective-actions/${ca}/approve"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_CORRECTION_NOT_ALLOWED\""
            - "CorrectiveAction.${ca}.status == \"PROPOSED\""
            - "AuditFinding.${f1}.status == \"OPEN\""

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (two DIFFERENT interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: engagement_plan_year_half_open_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_PLAN_YEAR_OVERLAP]
        distinguishing_aspect: |
          Resource = (sponsor_ein, plan_number) plan-year axis; semantics =
          half-open [plan_year_start, plan_year_end): an interior overlap is
          rejected while exact adjacency (start == prior end) is accepted.
        test_recipe:
          setup:
            - "Engagement A exists for (12-3456789, 017) with plan year [2025-01-01, 2026-01-01)"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "017", plan_name: "Pi 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng_a: $.data.id }
          trigger:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "017", plan_name: "Pi 401(k) Plan mid-year dup", plan_year_start: "2025-07-01", plan_year_end: "2026-07-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { err_overlap: $.data.error_id }
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "017", plan_name: "Pi 401(k) Plan PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng_c: $.data.id }
          assert:
            - "err_overlap == \"ERR_PLAN_YEAR_OVERLAP\""
            - "Engagement.${eng_c} created successfully (HTTP 201) — adjacency at 2026-01-01 is allowed under half-open semantics"
            - "Engagement.${eng_c}.status == \"DRAFT\""

      - name: trust_statement_closed_interval_overlap
        grounds:
          - validations[priority=6]
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource = TrustStatement coverage within one engagement; semantics =
          CLOSED intervals [period_start, period_end]: sharing the boundary day
          (2025-06-30) collides, and adjacency requires next.start ==
          prev.end + 1 day — geometrically different from the half-open
          plan-year rule (where adjacency is start == end).
        test_recipe:
          setup:
            - "Engagement PY2025 with trust statement S1 covering closed interval [2025-01-01, 2025-06-30]"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "018", plan_name: "Rho 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/trust-statements"
              payload: { engagement_id: "${eng}", period_start: "2025-01-01", period_end: "2025-06-30", custodian: "National Trust Co", certification: "CERTIFIED", reported_deposit_total_cents: 1000000 }
              as: SponsorAdmin
              captures: { ts1: $.data.id }
          trigger:
            - call: "POST /plan-audit/trust-statements"
              payload: { engagement_id: "${eng}", period_start: "2025-06-30", period_end: "2025-12-31", custodian: "National Trust Co", certification: "CERTIFIED", reported_deposit_total_cents: 1000000 }
              as: SponsorAdmin
              captures: { err_overlap: $.data.error_id }
            - call: "POST /plan-audit/trust-statements"
              payload: { engagement_id: "${eng}", period_start: "2025-07-01", period_end: "2025-12-31", custodian: "National Trust Co", certification: "CERTIFIED", reported_deposit_total_cents: 1000000 }
              as: SponsorAdmin
              captures: { ts3: $.data.id }
          assert:
            - "err_overlap == \"ERR_STATEMENT_PERIOD_OVERLAP\" (closed intervals share 2025-06-30)"
            - "TrustStatement.${ts3} created successfully (HTTP 201) — start == prior end + 1 day is proper adjacency"
            - "TrustStatement.${ts3}.status == \"IMPORTED\""

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (two DIFFERENT conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: match_unmatch_reconciliation_identity
        grounds:
          - calculations.trust_reconciliation_difference
          - state_machines.Contribution
          - entities.TrustStatement.fields.unreconciled_deposit_cents
        distinguishing_aspect: |
          Conserved quantity = reconciliation difference: the identity
          unreconciled_deposit_cents == reported_deposit_total_cents -
          matched_contribution_cents - adjustment_cents holds after every hop,
          and the match -> unmatch pair returns the statement to its exact
          pre-match values (500000 unreconciled) — an accounting-difference
          invariant, distinct from the money-balance invariant of the sibling.
        test_recipe:
          setup:
            - "Engagement PY2025; participant; trust statement [2025-01-01, 2025-12-31] reporting 500000c; one contribution of 500000c deposited 2025-06-30"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "019", plan_name: "Sigma 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 500000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/trust-statements"
              payload: { engagement_id: "${eng}", period_start: "2025-01-01", period_end: "2025-12-31", custodian: "National Trust Co", certification: "CERTIFIED", reported_deposit_total_cents: 500000 }
              as: SponsorAdmin
              captures: { ts: $.data.id }
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2025-06-16", deposit_date: "2025-06-30", amount_cents: 500000 }
              as: SponsorAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /plan-audit/contributions/${c1}/match"
              payload: { trust_statement_id: "${ts}" }
              as: SponsorAdmin
            - call: "POST /plan-audit/trust-statements/${ts}/reconcile"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/contributions/${c1}/unmatch"
              payload: {}
              as: SponsorAdmin
            - call: "POST /plan-audit/contributions/${c1}/match"
              payload: { trust_statement_id: "${ts}" }
              as: SponsorAdmin
            - call: "POST /plan-audit/trust-statements/${ts}/reconcile"
              payload: {}
              as: TPASpecialist
          assert:
            - "after unmatch (mid-chain observation): TrustStatement.${ts}.unreconciled_deposit_cents == 500000 — identical to pre-match value"
            - "after unmatch: TrustStatement.${ts}.status == \"DISCREPANCY\" (auto-revert from RECONCILED)"
            - "final: TrustStatement.${ts}.matched_contribution_cents == 500000"
            - "final: TrustStatement.${ts}.unreconciled_deposit_cents == 0"
            - "final: TrustStatement.${ts}.status == \"RECONCILED\""
            - "invariant held at every hop: unreconciled_deposit_cents == reported_deposit_total_cents - matched_contribution_cents - adjustment_cents"

      - name: execute_void_corrective_distribution_balance_identity
        grounds:
          - state_machines.CorrectiveAction.APPROVED_to_EXECUTED
          - state_machines.CorrectiveAction.EXECUTED_to_VOIDED
          - entities.Participant.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity = participant money balance: executing a 5000c
          corrective distribution debits the account to 95000c and voiding the
          execution credits exactly 5000c back, restoring 100000c with zero
          drift — a money invariant, distinct from the reconciliation-difference
          invariant of the sibling instance.
        test_recipe:
          setup:
            - "Engagement PY2025; participant with opening_balance 100000c; manual MEDIUM finding acknowledged; corrective distribution 5000c approved"
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "020", plan_name: "Tau 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: true, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 500000, opening_balance_cents: 100000 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "NONDISCRIMINATION_FAILURE", severity: "MEDIUM", description: "ADP excess refund" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "CORRECTIVE_DISTRIBUTION", principal_cents: 5000, planned_execution_date: "2026-03-01", participant_id: "${p1}" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca: $.data.id }
            - call: "POST /plan-audit/corrective-actions/${ca}/approve"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: System
          trigger:
            - call: "POST /plan-audit/corrective-actions/${ca}/execute"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions/${ca}/void"
              payload: { reason: "posted in error" }
              as: EngagementManager
              as_user_id: "u-mgr-1"
          assert:
            - "after execute (mid-chain observation): Participant.${p1}.account_balance_cents == 95000"
            - "after void: Participant.${p1}.account_balance_cents == 100000 — exact restoration, zero drift"
            - "CorrectiveAction.${ca}.status == \"VOIDED\""
            - "CorrectiveAction.${ca}.excise_tax_cents == 0 (executed 2026-03-01, on/before excise window 2026-03-15)"
            - "AuditFinding.${f1}.status == \"CORRECTION_IN_PROGRESS\" (auto-revert from CORRECTED)"
