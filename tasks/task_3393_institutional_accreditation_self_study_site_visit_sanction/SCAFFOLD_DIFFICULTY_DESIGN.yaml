            - call: "GET /accreditation/institutions/${inst_id}"
              payload: {}
              as: CommissionStaff
              captures: { inst_sanction_after_cure: $.data.sanction_status }
          assert:
            - "snap == 75 (BASE_CURE_SCORE 60 + PROBATION offset 15, frozen at review-open even though the level was reached by escalation)"
            - "cure evidence score == 75 (3 reports CLEARED strictly after 2026-09-01T00:00:00Z x 25 points), meeting the threshold exactly (>=)"
            - "CURE response cure_status == CURED"
            - "Institution.${inst_id}.sanction_status == NONE after the cure"
            - "the pre-open FLAGGED_PANEL report did not count toward the score (evaluated before cure_review_opened_at)"

