          - endpoints.POST /developers/{id}/ecosystem-participations
          - entities.Developer.fields.hackathon_award_count
        distinguishing_aspect: >-
          hackathon_award_count is an uncapped ledger while its trust contribution is capped at
          MAX_HACK_AWARDS: recording five awards yields count 5 but only 12 points, and a
          further two awards move the count to 7 while leaving trust_score at 76. The stored
          count must keep growing (it is program data) even though the weighted term saturates.
        test_recipe:
          setup:
            - "a docs-acknowledged developer with an unexpired ASSOCIATE certification: 50 base + 8 cert + 6 docs = 64 before any award"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /developers/${d1_id}/ecosystem-participations"
              payload: { certification_level: "ASSOCIATE", certification_expires_at: "2027-08-01T00:00:00Z" }
              as: DevRelManager
              as_user_id: "drm-1"
          trigger:
            - call: "POST /developers/${d1_id}/ecosystem-participations"
              payload: { certification_level: "ASSOCIATE", certification_expires_at: "2027-08-01T00:00:00Z", hackathon_awards_delta: 5 }
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /developers/${d1_id}/ecosystem-participations"
              payload: { certification_level: "ASSOCIATE", certification_expires_at: "2027-08-01T00:00:00Z", hackathon_awards_delta: 2 }
              as: DevRelManager
              as_user_id: "drm-1"
          assert:
            - "before any award: trust_score == 64 and hackathon_award_count == 0"
            - "after the 5-award call: hackathon_award_count == 5 and trust_score == 76 (min(5,3) x 4 = 12, not 20)"
            - "after the 2-award call: hackathon_award_count == 7 and trust_score == 76 (unchanged)"
            - "audited_trust_score tracks the same capped term whenever a checkpoint rescores (no pending case, no throttling)"

      - name: comms_gap_equal_to_the_limit_does_not_breach
        claim_type: interval_merge
        grounds:
          - calculations.support_response_commitments
          - calculations.support_response_commitments.constants.COMMS_MAX_GAP_MINUTES
          - endpoints.POST /support-cases/{id}/resolve
        distinguishing_aspect: >-
          Two S2 incidents on different products are identical except for one minute: case X's
          largest interval between consecutive checkpoints is exactly 60 and case Y's is 61.
          Because the comparison is strict, X does not breach and keeps credit_uplift_applied
          1.0 while Y breaches and moves to 1.5. The trailing segment to resolved_at (21 and 20
          minutes) is included in the walk but is not the maximum, which is what a
          last-gap-only implementation would get wrong.
        test_recipe:
          setup:
            - "products P1 and P2 exist, each with an S2 PLATFORM_INCIDENT started at 2026-08-01T00:00:00Z"
            - "the clock is advanced to 2026-08-01T01:41:00Z before any communication is recorded"
