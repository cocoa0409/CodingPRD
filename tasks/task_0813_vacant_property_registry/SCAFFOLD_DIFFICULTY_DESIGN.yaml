  # =====================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: referral_requires_foreclosure_stage
        grounds:
          - validations[priority=14]
          - errors[ERR_FORECLOSURE_STAGE_INVALID]
          - entities.Property.fields.foreclosure_status
          - state_machines.ReceivershipReferral.REFERRED_to_ACCEPTED
        distinguishing_aspect: |
          Pair (ReceivershipReferral, Property): referral is blocked when Property.foreclosure_status
          == NONE (ERR_FORECLOSURE_STAGE_INVALID) and allowed once it is NOTICE_OF_DEFAULT.
        test_recipe:
          setup:
            - "OWNER/VACANT property, foreclosure_status NONE."
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner M", party_type: "OWNER", email: "m@x.com", contact_phone: "555-0112", mailing_address: "13 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "P-CR1", street_address: "17 Oak Ave", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /registry/properties/${prop_id}/receivership-referrals"
              payload: { ground: "CHRONIC_NUISANCE", receiver_name: "Receiver Co" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /registry/properties/${prop_id}/receivership-referrals"
              payload: { ground: "CHRONIC_NUISANCE", receiver_name: "Receiver Co" }
              as: ProgramAdmin
              captures: { ref_id: "$.data.id" }
          assert:
            - "first referral attempt (foreclosure NONE) -> response.status 409, error_id == ERR_FORECLOSURE_STAGE_INVALID"
            - "second referral attempt (foreclosure NOTICE_OF_DEFAULT) -> ReceivershipReferral.${ref_id}.status == REFERRED"

      - name: abatement_requires_escalated_violation
        grounds:
          - validations[priority=15]
          - errors[ERR_NO_ABATABLE_VIOLATION]
          - entities.Violation.fields.status
          - state_machines.AbatementOrder.ORDERED_to_COMPLETED
        distinguishing_aspect: |
          Pair (AbatementOrder, Violation): ordering abatement is blocked while the property's only
          violation is OPEN (ERR_NO_ABATABLE_VIOLATION) and allowed once that violation is ESCALATED.
        test_recipe:
          setup:
            - "Standard ABT-01 cure 5 base 20000. OWNER/VACANT property; inspection fails ABT-01 -> one OPEN violation."
          setup_api_calls:
