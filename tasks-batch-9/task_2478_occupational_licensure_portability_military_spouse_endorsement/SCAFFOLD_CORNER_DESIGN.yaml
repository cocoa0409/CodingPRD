      - name: duplicate_active_application_for_same_profession_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=25]
          - errors[ERR_DUPLICATE_ACTIVE_APPLICATION]
        distinguishing_aspect: "A second application for the same (applicant_id, profession_id) while the first is SUBMITTED returns ERR_DUPLICATE_ACTIVE_APPLICATION (409); the check keys on the pair, not on the applicant alone."
        test_recipe:
          setup:
            - "Profession RN; non-military TX applicant with a verified ACTIVE credential."
            - "One ENDORSEMENT application already submitted, so its status is in the blocking set."
          setup_api_calls:
            - call: "POST /licensure/professions"
              payload: { profession_code: "RN", title: "Registered Nurse", required_scope_elements: ["ASSESS", "TREAT", "PRESCRIBE", "SUPERVISE"], critical_scope_elements: ["PRESCRIBE"], required_practice_hours: 2000, requirement_hours_total: 240.0, exam_waiver_min_score: 70.00, jurisprudence_exam_required: true, universal_recognition_min_residency_months: 12, standard_processing_days: 90, base_fee_cents: 25000, endorsement_fee_cents: 10000, exam_fee_cents: 8000, jurisprudence_fee_cents: 5000, permit_fee_cents: 6000, expedite_surcharge_pct: 0.15 }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { prof: $.data.id }
            - call: "POST /licensure/applicants"
              payload: { full_name: "Dov Harel", state_code: "TX", residency_months: 24, military_status: "NONE" }
              as: AgencyAdmin
              as_user_id: "adm_1"
              captures: { ap: $.data.id }
            - call: "POST /licensure/applicants/${ap}/out-of-state-credentials"
              payload: { issuing_state: "OK", license_number: "OK-14001", scope_elements: ["ASSESS", "TREAT", "SUPERVISE"], practice_hours: 1200, status: "ACTIVE", verified_good_standing: true, issued_at: "2020-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${ap}"
              captures: { cred: $.data.id }
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof}", primary_credential_id: "${cred}", pathway: "ENDORSEMENT", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { app_1: $.data.id }
            - call: "POST /licensure/applications/${app_1}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ap}"
          trigger:
            - call: "POST /licensure/applications"
              payload: { applicant_id: "${ap}", profession_id: "${prof}", primary_credential_id: "${cred}", pathway: "UNIVERSAL_RECOGNITION", expedited: false }
              as: Applicant
              as_user_id: "${ap}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_DUPLICATE_ACTIVE_APPLICATION"
            - "GET /licensure/applications with applicant_id ${ap} returns total_count == 1"
            - "LicenseApplication.${app_1}.status == SUBMITTED"

