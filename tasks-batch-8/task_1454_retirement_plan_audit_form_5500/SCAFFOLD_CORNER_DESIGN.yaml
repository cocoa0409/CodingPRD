              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_AMENDMENT_NOT_ALLOWED\""
            - "Form5500Filing.${fil}.status == \"DRAFT\""

      - name: schedule_entry_verify_and_lock_on_submit
        claim_type: side_effect_execution
