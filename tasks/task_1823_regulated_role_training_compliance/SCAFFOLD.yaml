scenario: "1823. Regulated-Role Training Compliance & Attestation (corporate compliance training office): role-to-requirement mapping & assignment automation, deadline tracking & escalation to manager, completion evidence & assessment score requirements, annual attestation collection & exception handling, new-hire and role-change triggers, regulator-specific curricula & recordkeeping duration, training effectiveness measurement, audit reporting by population"

domain_name: regulated-role-training-compliance
api_prefix: /compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - scheduled_actions          # future-effective role changes applied only by sweep; campaign auto-close
    - cascading_side_effects     # role change -> assignment cancel -> completion void -> posture recompute; escalation -> block -> attestation BLOCKED
    - rate_threshold_triggers    # DUE_SOON/OVERDUE/ESCALATED thresholds with HARD acceleration; score boundary
    - optimistic_concurrency     # OCC on Curriculum.version, Regulator.version, TrainingAssignment.version
  entity_topology: hybrid        # flat peers (Regulator/Role/Curriculum/Employee) + cross-cutting junctions (RoleRequirement) + child event/log entities
  state_machine_shape: parallel  # TrainingAssignment carries two independent dimensions (progress_status x deadline_status); Attestation is cyclic; EmployeeRoleChange is branching
  relationship_patterns:
    - one_to_many
    - many_to_many               # Role <-> Curriculum via RoleRequirement junction
    - self_referential           # Employee.manager_id -> Employee.id
    - cross_aggregate            # TrainingAssignment denormalizes curriculum_id; AuditReport population_spec
  role_model: segregation_of_duties  # manager may not extend/except own records; reviewer/admin roles disjoint from actor roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Regulator
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique regulator code (e.g. FINRA, OSHA)", constraints: "unique across all regulators" }
      - { name: name, type: string, source: input, description: "Regulator display name" }
      - { name: deadline_mode, type: enum, source: input, description: "CALENDAR | BUSINESS_DAYS; immutable after creation — never accepted by PATCH", constraints: "one of CALENDAR, BUSINESS_DAYS" }
      - { name: recordkeeping_years, type: integer, source: input, description: "Default record retention years for curricula under this regulator (1..25)" }
      - { name: escalation_interval_days, type: integer, source: input, default: 10, description: "Days past due at which a SOFT assignment escalates to level 3 (1..90)" }
      - { name: reminder_days_before_due, type: integer, source: input, default: 7, description: "Days before due_at at which an assignment is DUE_SOON (0..30)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED; RETIRED regulators reject new curricula" }

  - name: Role
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique role code", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Role display name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED; only ACTIVE roles are valid role-change targets" }

  - name: Curriculum
    parent: null
    common_fields: true
    fields:
      - { name: regulator_id, type: string, source: input, description: "FK -> Regulator.id; owning regulator" }
      - { name: code, type: string, source: input, description: "Unique curriculum code", constraints: "unique" }
      - { name: title, type: string, source: input, description: "Curriculum title" }
      - { name: passing_score_pct, type: number, source: input, description: "Minimum passing score 0..100 with up to 2 decimals; evaluated at submission time using the curriculum's CURRENT value" }
      - { name: validity_months, type: integer, source: input, description: "Months a verified completion remains valid (1..120); read at accept time" }
      - { name: max_attempts, type: integer, source: input, default: 3, description: "Max rejected attempts before assignment fails (1..10)" }
      - { name: evidence_requirement, type: enum, source: input, description: "NONE | CERTIFICATE | PROCTORED_CERTIFICATE; minimum acceptable evidence tier (ordered NONE < CERTIFICATE < PROCTORED_CERTIFICATE)" }
      - { name: recordkeeping_years_override, type: integer, source: input, description: "Optional per-curriculum retention override (1..25); JSON null clears it", constraints: "nullable" }
      - { name: effective_recordkeeping_years, type: integer, source: computed, description: "= recordkeeping_years_override if set, else regulator.recordkeeping_years (precedence: curriculum override beats regulator default)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED" }

  - name: CurriculumVersion
    parent: Curriculum
    common_fields: true
    fields:
      - { name: curriculum_id, type: string, source: system, description: "FK -> Curriculum.id; owning curriculum (path)" }
      - { name: version_no, type: integer, source: input, description: "Version number, unique per curriculum (>=1)" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; null = open-ended", constraints: "nullable; half-open window [effective_from, effective_to)" }
      - { name: content_uri, type: string, source: input, description: "Content locator" }

  - name: RoleRequirement
    parent: Role
    common_fields: true
    fields:
      - { name: role_id, type: string, source: system, description: "FK -> Role.id; owning role (path)" }
      - { name: curriculum_id, type: string, source: input, description: "FK -> Curriculum.id; required curriculum" }
      - { name: recurrence, type: enum, source: input, description: "INITIAL_ONLY | VALIDITY_CYCLE (auto re-assign on expiry)" }
      - { name: due_in_days, type: integer, source: input, description: "Days from assignment to due date (1..365)" }
      - { name: criticality, type: enum, source: input, description: "HARD | SOFT; HARD escalates at half interval and gates attestation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_no, type: string, source: input, description: "Unique HR employee number", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Full name" }
      - { name: hired_at, type: datetime, source: input, description: "Hire timestamp (recorded, not clock-gated)" }
      - { name: manager_id, type: string, source: input, description: "FK -> Employee.id; direct manager; null allowed", constraints: "nullable; self-referential" }
      - { name: current_role_id, type: string, source: input, description: "FK -> Role.id; current role" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ON_LEAVE | TERMINATED" }
      - { name: compliance_blocked, type: boolean, source: computed, default: false, description: "True while any current-role HARD assignment is FAILED-without-later-verified or ESCALATED; see posture_block_evaluation" }
      - { name: verified_completed_count, type: integer, source: computed, default: 0, description: "Count of this employee's assignments currently in VERIFIED_COMPLETED" }

  - name: EmployeeRoleChange
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; subject employee (path)" }
      - { name: from_role_code, type: string, source: system, description: "Snapshot of the employee's role code at creation (historical string, not a live FK)" }
      - { name: to_role_id, type: string, source: input, description: "FK -> Role.id; target role" }
      - { name: effective_at, type: datetime, source: input, description: "When the change takes effect; <= now applies synchronously, > now schedules" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | APPLIED | CANCELLED | REVERSED" }
      - { name: applied_at, type: datetime, source: system, description: "When the change was applied", constraints: "nullable" }
      - { name: reversed_at, type: datetime, source: system, description: "When the change was reversed", constraints: "nullable" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; assignee" }
      - { name: role_requirement_id, type: string, source: input, description: "FK -> RoleRequirement.id; source requirement (input on manual create, system on sweeps)" }
      - { name: curriculum_id, type: string, source: system, description: "FK -> Curriculum.id; denormalized from requirement at creation" }
      - { name: trigger_source, type: enum, source: system, description: "NEW_HIRE | ROLE_CHANGE | REQUIREMENT_SWEEP | RECURRENCE | MANUAL | REVERSAL" }
      - { name: source_role_change_id, type: string, source: system, description: "FK -> EmployeeRoleChange.id; set when trigger_source is ROLE_CHANGE or REVERSAL", constraints: "nullable" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical clock value at creation" }
      - { name: base_due_at, type: datetime, source: computed, description: "Due date per due_date_computation; immutable after creation" }
      - { name: active_extension_days, type: integer, source: system, default: 0, description: "Days granted by the single active extension; 0 when none" }
      - { name: due_at, type: datetime, source: computed, description: "= base_due_at + active_extension_days days; invariant: due_at == base_due_at + active_extension_days*86400s" }
      - { name: attempts_used, type: integer, source: system, default: 0, description: "Count of REJECTED reviews; incremented only on reject" }
      - { name: progress_status, type: enum, source: system, description: "ASSIGNED | IN_PROGRESS | SUBMITTED | VERIFIED_COMPLETED | FAILED | CANCELLED | EXPIRED" }
      - { name: deadline_status, type: enum, source: system, description: "ON_TRACK | DUE_SOON | OVERDUE | ESCALATED | FROZEN; computed at creation, by sweeps, and by extension grant/revoke" }
      - { name: completed_at, type: datetime, source: system, description: "Review-accept timestamp", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: computed, description: "completed_at + curriculum.validity_months (VALIDITY_CYCLE only; null for INITIAL_ONLY)", constraints: "nullable" }

  - name: CompletionRecord
    parent: TrainingAssignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> TrainingAssignment.id; owning assignment (path)" }
      - { name: attempt_no, type: integer, source: system, description: "1-based ordinal among this assignment's completion records" }
      - { name: score_pct, type: number, source: input, description: "Assessment score 0..100, up to 2 decimals" }
      - { name: evidence_type, type: enum, source: input, description: "NONE | CERTIFICATE | PROCTORED_CERTIFICATE" }
      - { name: evidence_uri, type: string, source: input, description: "Evidence locator; required iff evidence_type != NONE", constraints: "conditionally required" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: is_late, type: boolean, source: computed, description: "= submitted_at > assignment.due_at (strictly greater; equal is on time) at submission moment" }
      - { name: passed, type: boolean, source: computed, description: "= score_pct >= curriculum.passing_score_pct at submission moment; immutable once recorded" }
      - { name: review_status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | ACCEPTED | REJECTED | VOIDED" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of reviewing ComplianceAdmin (opaque operator id)", constraints: "nullable" }
      - { name: review_note, type: string, source: system, description: "Reviewer note (required on reject/void)", constraints: "nullable" }

  - name: AttestationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Attestation year (2000..2100)" }
      - { name: regulator_id, type: string, source: input, description: "FK -> Regulator.id; population scope: curricula under this regulator" }
      - { name: window_open_at, type: datetime, source: input, description: "Earliest the campaign may be opened" }
      - { name: window_close_at, type: datetime, source: input, description: "Auto-close threshold; sweep closes when now > window_close_at; must be > window_open_at" }
      - { name: statement_version, type: string, source: input, description: "Attestation statement version string" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | CLOSED | FINALIZED" }
      - { name: metrics, type: object, source: computed, description: "{ population_size, attested_count, exempted_count, expired_count, response_rate_pct }; null until finalize", constraints: "nullable" }

  - name: Attestation
    parent: AttestationCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> AttestationCampaign.id; owning campaign" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; attesting employee" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ATTESTED | EXCEPTION_PENDING | EXEMPTED | EXPIRED | BLOCKED" }
      - { name: attested_at, type: datetime, source: system, description: "When attested", constraints: "nullable" }
      - { name: statement_version_snapshot, type: string, source: system, description: "Campaign statement_version captured at attest time", constraints: "nullable" }

  - name: AttestationException
    parent: Attestation
    common_fields: true
    fields:
      - { name: attestation_id, type: string, source: system, description: "FK -> Attestation.id; owning attestation (path)" }
      - { name: reason_code, type: enum, source: input, description: "MEDICAL_LEAVE | MILITARY_DUTY | ROLE_TRANSITION | OTHER" }
      - { name: detail, type: string, source: input, description: "Free-text justification (>= 10 chars)" }
      - { name: requested_by_manager_id, type: string, source: system, description: "FK -> Employee.id; requesting manager, from X-User-ID" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | DENIED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding ComplianceAdmin (opaque)", constraints: "nullable" }
      - { name: decision_note, type: string, source: system, description: "Required on deny; 'AUTO_DENIED_AT_CLOSE' when system-denied", constraints: "nullable" }

  - name: EscalationNotice
    parent: TrainingAssignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> TrainingAssignment.id; subject assignment" }
      - { name: level, type: integer, source: system, description: "1 = DUE_SOON reminder to employee; 2 = OVERDUE escalation to manager; 3 = ESCALATED to compliance office" }
      - { name: kind, type: enum, source: system, description: "DUE_SOON_REMINDER | OVERDUE_MANAGER | ESCALATION_COMPLIANCE" }
      - { name: recipient_employee_id, type: string, source: system, description: "FK -> Employee.id; level 1 -> assignee, level 2 -> assignee's manager (null if none), level 3 -> null", constraints: "nullable" }
      - { name: triggered_at, type: datetime, source: system, description: "Logical clock when the sweep created the notice" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACKNOWLEDGED" }

  - name: LeaveOfAbsence
    parent: Employee
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; subject employee (path)" }
      - { name: start_date, type: datetime, source: input, description: "First day of leave at 00:00:00Z (closed interval start)" }
      - { name: end_date, type: datetime, source: input, description: "Last day of leave at 23:59:59Z (closed interval end); must be >= start_date" }
      - { name: reason, type: string, source: input, description: "Leave reason" }

  - name: AuditReport
    parent: null
    common_fields: true
    fields:
      - { name: population_spec, type: object, source: input, description: "{ regulator_id (required), role_id?, manager_id? }; scope filters" }
      - { name: metric_variant, type: enum, source: input, description: "STRICT | AUDIT_LENIENT; selects compliance_rate variant" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of generating Auditor (opaque)" }
      - { name: generated_at, type: datetime, source: system, description: "Logical clock at generation" }
      - { name: metrics, type: object, source: computed, description: "{ population_size, compliant_count, compliance_rate_pct, overdue_count, weighted_first_attempt_pass_rate_pct }" }
      - { name: recordkeeping_expires_at, type: datetime, source: computed, description: "= generated_at + scope regulator.recordkeeping_years calendar years" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TrainingAssignment
    initial_state: "progress_status=ASSIGNED; deadline_status = FROZEN if employee ON_LEAVE else computed from clock vs due (may be born DUE_SOON)"
    terminal_states: ["progress: VERIFIED_COMPLETED(->EXPIRED is terminal), FAILED, CANCELLED, EXPIRED; deadline dimension stops updating once progress is terminal"]
    note: "TWO PARALLEL DIMENSIONS on one entity: progress_status (workflow) and deadline_status (clock) evolve independently; progress terminal freezes deadline dimension at its last value."
    transitions:
      - from: "ASSIGNED"
        to: "IN_PROGRESS"
        trigger: "POST /compliance/assignments/{id}/start"
        actor: Employee
        preconditions:
          - "Caller is the assignment's employee (ERR_OWNERSHIP_MISMATCH)"
          - "progress_status == ASSIGNED (ERR_INVALID_STATE)"
          - "employee.status != TERMINATED (ERR_EMPLOYEE_TERMINATED)"
        side_effects: ["increments TrainingAssignment.version by 1"]
      - from: "ASSIGNED | IN_PROGRESS"
        to: "SUBMITTED"
        trigger: "POST /compliance/assignments/{id}/completions"
        actor: Employee
        preconditions:
          - "Caller is the assignment's employee (ERR_OWNERSHIP_MISMATCH)"
          - "progress_status in {ASSIGNED, IN_PROGRESS} (ERR_ASSIGNMENT_NOT_SUBMITTABLE)"
          - "deadline_status != FROZEN (ERR_ASSIGNMENT_FROZEN)"
          - "score_pct >= curriculum.passing_score_pct now (ERR_SCORE_BELOW_PASSING)"
          - "evidence_type >= curriculum.evidence_requirement tier (ERR_EVIDENCE_TYPE_INSUFFICIENT)"
          - "evidence_uri present iff evidence_type != NONE (ERR_EVIDENCE_URI_MISSING)"
        side_effects:
          - "creates CompletionRecord (attempt_no = prior count + 1, review_status=PENDING_REVIEW, is_late/passed computed)"
          - "progress_status -> SUBMITTED; increments TrainingAssignment.version by 1"
      - from: "SUBMITTED"
        to: "VERIFIED_COMPLETED"
        trigger: "POST /compliance/completions/{id}/accept"
        actor: ComplianceAdmin
        preconditions:
          - "completion.review_status == PENDING_REVIEW (ERR_COMPLETION_NOT_REVIEWABLE)"
        side_effects:
          - "completion.review_status -> ACCEPTED; reviewed_by set"
          - "assignment.progress_status -> VERIFIED_COMPLETED; completed_at = now"
          - "VALIDITY_CYCLE: expires_at = completed_at + curriculum.validity_months (calendar months, day clamped to month end); INITIAL_ONLY: expires_at = null"
          - "employee.verified_completed_count recomputed (+1); employee.compliance_blocked recomputed (a later VERIFIED completion clears a FAILED-hard block for the same requirement)"
          - "BLOCKED attestations of employee under OPEN campaigns return to PENDING if compliance_blocked cleared"
      - from: "SUBMITTED"
        to: "IN_PROGRESS"
        trigger: "POST /compliance/completions/{id}/reject"
        actor: ComplianceAdmin
        preconditions:
          - "completion.review_status == PENDING_REVIEW (ERR_COMPLETION_NOT_REVIEWABLE)"
        side_effects:
          - "completion.review_status -> REJECTED; review_note recorded"
          - "assignment.attempts_used += 1"
          - "if attempts_used >= curriculum.max_attempts: progress_status -> FAILED (not IN_PROGRESS); employee.compliance_blocked recomputed (HARD requirement failure blocks; BLOCKED cascade to PENDING attestations)"
          - "else progress_status -> IN_PROGRESS (revision loop)"
      - from: "VERIFIED_COMPLETED"
        to: "IN_PROGRESS"
        trigger: "POST /compliance/completions/{id}/void"
        actor: ComplianceAdmin
        preconditions:
          - "completion.review_status == ACCEPTED (ERR_COMPLETION_NOT_VOIDABLE)"
        side_effects:
          - "completion.review_status -> VOIDED (compensating action for accept)"
          - "assignment.progress_status -> IN_PROGRESS; completed_at = null; expires_at = null"
          - "employee.verified_completed_count recomputed (-1); compliance_blocked recomputed"
      - from: "VERIFIED_COMPLETED"
        to: "EXPIRED"
        trigger: "system — POST /compliance/_sweeps/run step 4, when expires_at != null and now >= expires_at (inclusive)"
        actor: system
        preconditions: ["progress_status == VERIFIED_COMPLETED and expires_at != null and now >= expires_at"]
        side_effects:
          - "employee.verified_completed_count recomputed (-1)"
          - "if requirement.status == ACTIVE and recurrence == VALIDITY_CYCLE and employee.status in {ACTIVE, ON_LEAVE}: create new assignment (trigger_source=RECURRENCE, assigned_at=now, deadline FROZEN if ON_LEAVE)"
      - from: "ASSIGNED | IN_PROGRESS | SUBMITTED"
        to: "CANCELLED"
        trigger: "POST /compliance/assignments/{id}/cancel OR cascades (role-change apply/reverse, terminate)"
        actor: ComplianceAdmin | system
        preconditions:
          - "progress_status in {ASSIGNED, IN_PROGRESS, SUBMITTED} (ERR_INVALID_STATE)"
        side_effects:
          - "its PENDING_REVIEW completion records -> VOIDED (system void, hop 2 of cascade)"
          - "employee.verified_completed_count unchanged; compliance_blocked recomputed"
      - from: "ON_TRACK"
        to: "DUE_SOON"
        trigger: "system — sweep step 3, when 0 <= (due_at - now) <= reminder_days_before_due*86400"
        actor: system
        preconditions: ["progress non-terminal", "employee.status != ON_LEAVE"]
        side_effects: ["create level-1 EscalationNotice (kind DUE_SOON_REMINDER, recipient=assignee) if none exists for (assignment, level 1)"]
      - from: "ON_TRACK | DUE_SOON"
        to: "OVERDUE"
        trigger: "system — sweep step 3, when now > due_at (strictly) and now <= due_at + escalation_threshold_days*86400"
        actor: system
        preconditions: ["progress non-terminal", "employee.status != ON_LEAVE"]
        side_effects: ["create level-2 notice (OVERDUE_MANAGER, recipient=assignee.manager_id, may be null) if none exists for (assignment, level 2)"]
      - from: "ON_TRACK | DUE_SOON | OVERDUE"
        to: "ESCALATED"
        trigger: "system — sweep step 3, when now > due_at + escalation_threshold_days*86400 (strictly)"
        actor: system
        preconditions: ["progress non-terminal", "employee.status != ON_LEAVE"]
        side_effects:
          - "create level-2 notice if none exists (skipped-stage backfill)"
          - "create level-3 notice (ESCALATION_COMPLIANCE, recipient null) if none exists for (assignment, level 3)"
          - "if requirement.criticality == HARD: employee.compliance_blocked recomputed -> true; employee's PENDING attestations under OPEN campaigns -> BLOCKED (hop 3)"
      - from: "DUE_SOON | OVERDUE | ESCALATED"
        to: "ON_TRACK | DUE_SOON"
        trigger: "POST /compliance/assignments/{id}/extensions (grant) — recomputes deadline_status against new due_at; creates NO notices"
        actor: Manager
        preconditions: ["progress in {ASSIGNED, IN_PROGRESS} (ERR_ASSIGNMENT_NOT_EXTENDABLE)", "no active extension (ERR_EXTENSION_LIMIT_ACTIVE)", "1 <= extend_by_days <= 30 (ERR_EXTENSION_DAYS_INVALID)", "OCC version match (ERR_STALE_VERSION)"]
        side_effects:
          - "active_extension_days = extend_by_days; due_at += extend_by_days days; increments TrainingAssignment.version by 1"
          - "deadline_status recomputed: FROZEN if employee ON_LEAVE else per clock vs new due_at"
          - "if deadline_status leaves ESCALATED: employee.compliance_blocked recomputed (may unblock; BLOCKED attestations under OPEN campaigns -> PENDING)"
      - from: "any deadline_status"
        to: "recomputed deadline_status (incl. back to base due)"
        trigger: "POST /compliance/assignments/{id}/extensions/revoke"
        actor: Manager
        preconditions: ["active_extension_days > 0 (ERR_NO_ACTIVE_EXTENSION)", "OCC version match (ERR_STALE_VERSION)"]
        side_effects:
          - "due_at -= active_extension_days days (restores base_due_at exactly); active_extension_days = 0; increments version by 1"
          - "deadline_status recomputed as on grant; compliance_blocked recomputed; creates NO notices"
      - from: "ON_TRACK | DUE_SOON | OVERDUE | ESCALATED"
        to: "FROZEN"
        trigger: "system — leave creation covering now, or sweep step 2 when a leave window covers now"
        actor: system
        preconditions: ["progress non-terminal"]
        side_effects: ["employee.status -> ON_LEAVE"]
      - from: "FROZEN"
        to: "recomputed ON_TRACK | DUE_SOON | OVERDUE | ESCALATED"
        trigger: "system — sweep step 2 when no leave covers now anymore"
        actor: system
        preconditions: ["progress non-terminal"]
        side_effects: ["employee.status -> ACTIVE; deadline notices fire per observed recomputed stage on the same sweep"]

  - entity: Attestation
    initial_state: "PENDING (or BLOCKED if employee.compliance_blocked at campaign open)"
    terminal_states: [ATTESTED, EXEMPTED, EXPIRED]
    note: "CYCLIC: PENDING -> EXCEPTION_PENDING -> PENDING on denial; PENDING <-> BLOCKED follows employee.compliance_blocked."
    transitions:
      - from: "PENDING"
        to: "ATTESTED"
        trigger: "POST /compliance/attestations/{id}/attest"
        actor: Employee
        preconditions:
          - "Caller is the attestation's employee (ERR_OWNERSHIP_MISMATCH)"
          - "status == PENDING (ERR_ATTESTATION_NOT_ACTIONABLE)"
          - "campaign.status == OPEN (ERR_CAMPAIGN_NOT_OPEN)"
          - "employee.status != TERMINATED (ERR_EMPLOYEE_TERMINATED)"
        side_effects: ["attested_at = now; statement_version_snapshot = campaign.statement_version"]
      - from: "PENDING"
        to: "EXCEPTION_PENDING"
        trigger: "POST /compliance/attestations/{id}/exceptions"
        actor: Manager
        preconditions:
          - "Caller is the employee's current manager (ERR_OWNERSHIP_MISMATCH) and caller != employee (ERR_SELF_ACTION_FORBIDDEN)"
          - "status == PENDING (ERR_ATTESTATION_NOT_ACTIONABLE)"
          - "campaign.status == OPEN (ERR_CAMPAIGN_NOT_OPEN)"
        side_effects: ["creates AttestationException (REQUESTED, requested_by_manager_id = X-User-ID)"]
      - from: "EXCEPTION_PENDING"
        to: "EXEMPTED"
        trigger: "POST /compliance/exceptions/{id}/approve"
        actor: ComplianceAdmin
        preconditions: ["exception.status == REQUESTED (ERR_EXCEPTION_NOT_PENDING)"]
        side_effects: ["exception -> APPROVED, decided_by set"]
      - from: "EXCEPTION_PENDING"
        to: "PENDING"
        trigger: "POST /compliance/exceptions/{id}/deny"
        actor: ComplianceAdmin
        preconditions: ["exception.status == REQUESTED (ERR_EXCEPTION_NOT_PENDING)"]
        side_effects: ["exception -> DENIED with decision_note (cycle back to PENDING)"]
      - from: "PENDING | BLOCKED | EXCEPTION_PENDING"
        to: "EXPIRED"
        trigger: "campaign close (manual POST close or sweep step 5 when now > window_close_at) OR employee termination"
        actor: ComplianceAdmin | system
        preconditions: []
        side_effects: ["REQUESTED exceptions on the attestation -> DENIED with decision_note 'AUTO_DENIED_AT_CLOSE'"]
      - from: "PENDING"
        to: "BLOCKED"
        trigger: "system — employee.compliance_blocked flips true (HARD failure or HARD escalation) while campaign OPEN"
        actor: system
        preconditions: []
        side_effects: []
      - from: "BLOCKED"
        to: "PENDING"
        trigger: "system — employee.compliance_blocked flips false while campaign OPEN"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AttestationCampaign
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /compliance/campaigns/{id}/open"
        actor: ComplianceAdmin
        preconditions:
          - "status == DRAFT (ERR_CAMPAIGN_NOT_DRAFT)"
          - "window_open_at <= now <= window_close_at (ERR_CAMPAIGN_WINDOW_INVALID)"
        side_effects:
          - "create one Attestation per eligible employee (status in {ACTIVE, ON_LEAVE} AND >=1 assignment with progress != CANCELLED tied to a curriculum under campaign.regulator_id; iteration order: employee created_at ASC, employee_no ASC); status BLOCKED if employee.compliance_blocked else PENDING"
      - from: OPEN
        to: CLOSED
        trigger: "POST /compliance/campaigns/{id}/close OR sweep step 5 (now > window_close_at)"
        actor: ComplianceAdmin | system
        preconditions: ["status == OPEN (ERR_CAMPAIGN_NOT_OPEN)"]
        side_effects: ["PENDING/BLOCKED/EXCEPTION_PENDING attestations -> EXPIRED; their REQUESTED exceptions -> DENIED ('AUTO_DENIED_AT_CLOSE')"]
      - from: CLOSED
        to: FINALIZED
        trigger: "POST /compliance/campaigns/{id}/finalize"
        actor: Auditor
        preconditions: ["status == CLOSED (ERR_CAMPAIGN_NOT_FINALIZABLE)"]
        side_effects: ["metrics computed and persisted per campaign_response_rate calculation"]

  - entity: Curriculum
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "PATCH /compliance/curricula/{id} with status=ACTIVE"
        actor: ComplianceAdmin
        preconditions:
          - "at least one CurriculumVersion with effective_from <= now and (effective_to null or > now) (ERR_NO_EFFECTIVE_VERSION)"
          - "regulator.status == ACTIVE (ERR_REGULATOR_RETIRED)"
        side_effects: ["increments Curriculum.version by 1"]
      - from: "DRAFT | ACTIVE"
        to: RETIRED
        trigger: "PATCH /compliance/curricula/{id} with status=RETIRED"
        actor: ComplianceAdmin
        preconditions: []
        side_effects: ["increments Curriculum.version by 1; existing assignments unaffected"]

  - entity: Regulator
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "PATCH /compliance/regulators/{id} with status=RETIRED"
        actor: ComplianceAdmin
        preconditions: []
        side_effects: ["increments Regulator.version by 1; existing curricula/assignments unaffected; new curricula rejected (ERR_REGULATOR_RETIRED)"]

  - entity: Role
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /compliance/roles/{id}/retire"
        actor: ComplianceAdmin
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["incumbent employees keep current_role_id (historical); retired role excluded from requirement sweeps and rejected as role-change target (ERR_ROLE_NOT_ACTIVE)"]

  - entity: RoleRequirement
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /compliance/requirements/{id}/retire"
        actor: ComplianceAdmin
        preconditions: ["status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["existing assignments continue unaffected; excluded from future sweeps, recurrences, role-change (re)assignment"]

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /compliance/employees/{id}/leaves with window covering now, or sweep step 2"
        actor: HRAdmin | system
        preconditions: []
        side_effects: ["non-terminal assignments' deadline_status -> FROZEN"]
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "system — sweep step 2 when no leave covers now"
        actor: system
        preconditions: []
        side_effects: ["FROZEN assignments recomputed (unfreeze)"]
      - from: "ACTIVE | ON_LEAVE"
        to: TERMINATED
        trigger: "POST /compliance/employees/{id}/terminate"
        actor: HRAdmin
        preconditions: ["status != TERMINATED (ERR_INVALID_STATE)"]
        side_effects:
          - "non-terminal assignments -> CANCELLED; their PENDING_REVIEW completions -> VOIDED"
          - "SCHEDULED role changes -> CANCELLED"
          - "PENDING/BLOCKED/EXCEPTION_PENDING attestations -> EXPIRED; their REQUESTED exceptions -> DENIED ('AUTO_DENIED_AT_CLOSE')"
          - "compliance_blocked = false; verified_completed_count unchanged"

  - entity: EmployeeRoleChange
    initial_state: "SCHEDULED (effective_at > now) or APPLIED synchronously (effective_at <= now)"
    terminal_states: [CANCELLED, REVERSED]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "system — sweep step 1 when now >= effective_at (application happens ONLY via sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "employee.current_role_id = to_role_id; applied_at = now"
          - "cancel employee's non-terminal assignments whose requirement's curriculum is NOT required by an ACTIVE requirement of the new role (shared curricula survive); their PENDING_REVIEW completions -> VOIDED"
          - "create assignments (trigger_source=ROLE_CHANGE, source_role_change_id=this) for each ACTIVE requirement of the new role whose curriculum_id has NO covering assignment (progress in {ASSIGNED, IN_PROGRESS, SUBMITTED, VERIFIED_COMPLETED}); coverage is keyed by curriculum, not by requirement"
          - "employee.verified_completed_count and compliance_blocked recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /compliance/role-changes/{id}/cancel"
        actor: HRAdmin
        preconditions: ["status == SCHEDULED (ERR_ROLE_CHANGE_NOT_CANCELLABLE)"]
        side_effects: []
      - from: APPLIED
        to: REVERSED
        trigger: "POST /compliance/role-changes/{id}/reverse"
        actor: HRAdmin
        preconditions:
          - "status == APPLIED (ERR_ROLE_CHANGE_NOT_REVERSIBLE)"
          - "now <= applied_at + 14 days (ERR_RETROACTIVE_LIMIT_EXCEEDED)"
          - "no completion record with review_status ACCEPTED on assignments with source_role_change_id == this change (ERR_ROLE_CHANGE_NOT_REVERSIBLE)"
          - "role with code from_role_code exists and is ACTIVE (ERR_ROLE_NOT_ACTIVE)"
        side_effects:
          - "cancel surviving non-terminal assignments with source_role_change_id == this change; their PENDING_REVIEW completions -> VOIDED"
          - "employee.current_role_id restored to role matching from_role_code; reversed_at = now"
          - "create assignments (trigger_source=REVERSAL, source_role_change_id=this) for the restored role's ACTIVE requirements whose curriculum_id lacks covering assignment (progress in {ASSIGNED, IN_PROGRESS, SUBMITTED, VERIFIED_COMPLETED})"
          - "recompute verified_completed_count and compliance_blocked"

  - entity: CompletionRecord
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, REJECTED, VOIDED]
    note: "VOIDED reachable from ACCEPTED (void) and from PENDING_REVIEW (system cascade void on assignment cancel/terminate)."
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /compliance/completions/{id}/accept"
        actor: ComplianceAdmin
        preconditions: ["review_status == PENDING_REVIEW (ERR_COMPLETION_NOT_REVIEWABLE)"]
        side_effects: ["drives assignment SUBMITTED -> VERIFIED_COMPLETED (see TrainingAssignment)"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /compliance/completions/{id}/reject"
        actor: ComplianceAdmin
        preconditions: ["review_status == PENDING_REVIEW (ERR_COMPLETION_NOT_REVIEWABLE)"]
        side_effects: ["attempts_used += 1; assignment -> IN_PROGRESS or FAILED"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /compliance/completions/{id}/void"
        actor: ComplianceAdmin
        preconditions: ["review_status == ACCEPTED (ERR_COMPLETION_NOT_VOIDABLE)"]
        side_effects: ["assignment VERIFIED_COMPLETED -> IN_PROGRESS; completed_at/expires_at nulled; counts recomputed"]
      - from: PENDING_REVIEW
        to: VOIDED
        trigger: "system — assignment cancelled (role change, terminate, manual cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AttestationException
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /compliance/exceptions/{id}/approve"
        actor: ComplianceAdmin
        preconditions: ["status == REQUESTED (ERR_EXCEPTION_NOT_PENDING)"]
        side_effects: ["attestation EXCEPTION_PENDING -> EXEMPTED"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /compliance/exceptions/{id}/deny OR system auto-deny at campaign close/terminate"
        actor: ComplianceAdmin | system
        preconditions: ["status == REQUESTED (ERR_EXCEPTION_NOT_PENDING)"]
        side_effects: ["attestation EXCEPTION_PENDING -> PENDING (manual deny only)"]

  - entity: EscalationNotice
    initial_state: OPEN
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /compliance/escalations/{id}/acknowledge"
        actor: Manager | ComplianceAdmin
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
          - "recipient_employee_id != null: caller must be that employee (Manager role, ERR_OWNERSHIP_MISMATCH); recipient null (level 3): only ComplianceAdmin (ERR_FORBIDDEN_ROLE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: curriculum-patch-stale-version
    parent_entity: Curriculum
    write_endpoint: "PATCH /compliance/curricula/{id}"
    occ_field: "expected_curriculum_version"
    description: |
      A PATCH to a Curriculum whose version has advanced beyond the caller's
      last-observed version is rejected. This captures the case where another
      administrator has just modified (e.g., activated or re-scored) the same
      curriculum and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: regulator-patch-stale-version
    parent_entity: Regulator
    write_endpoint: "PATCH /compliance/regulators/{id}"
    occ_field: "expected_regulator_version"
    description: |
      A PATCH to a Regulator whose version has advanced beyond the caller's
      last-observed version is rejected; the caller must re-read and re-apply.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: extension-grant-stale-assignment
    parent_entity: TrainingAssignment
    write_endpoint: "POST /compliance/assignments/{id}/extensions"
    occ_field: "expected_assignment_version"
    description: |
      Granting an extension against a TrainingAssignment whose version has
      advanced since the manager last observed it is rejected. This captures
      the case where a prior extension was granted or revoked (which
      legitimately changes due_at) after the manager's read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: extension-revoke-stale-assignment
    parent_entity: TrainingAssignment
    write_endpoint: "POST /compliance/assignments/{id}/extensions/revoke"
    occ_field: "expected_assignment_version"
    description: |
      Revoking an extension against a TrainingAssignment whose version has
      advanced since the caller last observed it is rejected with a
      stale-version precondition failure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: due_date_computation
    trigger: "assignment creation (any trigger_source)"
    algorithm: chronological
    formula: |
      D0 = assigned_at (logical clock at creation); N = role_requirement.due_in_days.
      mode = regulator.deadline_mode of the curriculum's regulator (snapshot at creation).
      CALENDAR: base_due_at = D0 + N*86400s.
      BUSINESS_DAYS: starting from the day AFTER date(D0), count N days whose
      weekday is Monday..Friday (Saturday/Sunday skipped; no holiday calendar);
      base_due_at = the N-th such date at D0's time-of-day (UTC).
      due_at = base_due_at + active_extension_days*86400s (invariant at all times).
    input_set: "the new assignment only"
    precision: "second precision, UTC"
    variants:
      - name: CALENDAR
        when: "regulator.deadline_mode == CALENDAR"
        difference: "plain day arithmetic; weekends not skipped"
      - name: BUSINESS_DAYS
        when: "regulator.deadline_mode == BUSINESS_DAYS"
        difference: "weekend-skipping count; identical inputs yield later due dates"

  - name: escalation_and_deadline_status
    trigger: "sweep step 3 (creates notices); extension grant/revoke (recomputes status only, no notices)"
    algorithm: threshold
    formula: |
      Skip assignments with terminal progress. If employee.status == ON_LEAVE: FROZEN.
      rem = regulator.reminder_days_before_due; interval = regulator.escalation_interval_days.
      threshold_days = interval if requirement.criticality == SOFT else ceil(interval / 2).
      if now <= due_at:  DUE_SOON if (due_at - now) <= rem*86400s else ON_TRACK
      elif now <= due_at + threshold_days*86400s: OVERDUE
      else: ESCALATED
      Boundary pins: OVERDUE requires now > due_at (strict; equal is NOT overdue);
      ESCALATED requires now > due_at + threshold (strict; equal stays OVERDUE).
      Notices (sweep only, existence-deduped per (assignment, level), any status):
      stage DUE_SOON -> ensure level-1 notice; stage OVERDUE -> ensure level-2;
      stage ESCALATED -> ensure level-2 AND level-3 (skipped-stage backfill).
    input_set: "all assignments with non-terminal progress_status"
    constants:
      HARD_ACCELERATION_DIVISOR: 2
    precision: "second precision, UTC"

  - name: compliance_rate
    trigger: "POST /compliance/audit-reports (snapshot at generation)"
    algorithm: aggregation
    formula: |
      population P = employees with status in {ACTIVE, ON_LEAVE}, matching
      population_spec (regulator_id required; role_id / manager_id optional),
      AND having >= 1 assignment with progress_status != CANCELLED whose
      curriculum.regulator_id == population_spec.regulator_id.
      open_set(e) = e's assignments with progress_status in OPEN_SET (variant).
      compliant(e) iff open_set(e) is empty.
      compliance_rate_pct = round_half_up(100 * |compliant| / |P|, 2); |P|==0 -> 0.00.
      overdue_count = assignments of P with deadline_status in {OVERDUE, ESCALATED}
      and non-terminal progress.
    input_set: "population P as defined"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STRICT
        when: "metric_variant == STRICT"
        difference: "OPEN_SET = {ASSIGNED, IN_PROGRESS, SUBMITTED, FAILED}"
      - name: AUDIT_LENIENT
        when: "metric_variant == AUDIT_LENIENT"
        difference: "OPEN_SET = {ASSIGNED, IN_PROGRESS, FAILED} (SUBMITTED pending review counts as compliant)"

  - name: audit_weighted_first_attempt_pass_rate
    trigger: "POST /compliance/audit-reports (snapshot at generation)"
    algorithm: weighted_scoring
    formula: |
      For each curriculum c under population_spec.regulator_id having >= 1
      reviewed attempt-1 record (CompletionRecord with attempt_no == 1 and
      review_status in {ACCEPTED, REJECTED}):
        rate_c = round_half_up(100 * accepted_c / total_c, 2)   -- ROUND FIRST
        weight_c = total_c
      weighted_first_attempt_pass_rate_pct =
        round_half_up( sum(weight_c * rate_c) / sum(weight_c), 2 )  -- THEN AVERAGE
      No qualifying records at all -> 0.00.
      PINNED ROUNDING ORDER: per-curriculum rates are rounded to 2dp BEFORE the
      weighted mean; pooling raw counts first (sum-then-round) is non-conformant
      and can differ by a cent.
    input_set: "attempt-1 reviewed records of curricula under the scope regulator"
    precision: "2 decimal places, round_half_up, per-curriculum then weighted mean"

  - name: curriculum_effectiveness
    trigger: "GET /compliance/curricula/{id}/effectiveness (computed on read)"
    algorithm: aggregation
    formula: |
      Records = CompletionRecords of assignments with curriculum_id == id,
      attempt_no == 1, review_status in {ACCEPTED, REJECTED} (PENDING_REVIEW and
      VOIDED excluded).
      first_attempt_count = |Records|; first_attempt_pass_count = |ACCEPTED|.
      first_attempt_pass_rate_pct = round_half_up(100 * pass / count, 2); count==0 -> 0.00.
      average_score_pct = round_half_up(mean(score_pct over Records), 2); empty -> 0.00.
    input_set: "reviewed attempt-1 records of this curriculum"
    precision: "2 decimal places, round_half_up"

  - name: assignment_validity_expiry
    trigger: "completion accept (compute expires_at); sweep step 4 (apply expiry)"
    algorithm: projection
    formula: |
      On accept: completed_at = now.
      recurrence == VALIDITY_CYCLE: expires_at = completed_at + curriculum.validity_months
      calendar months (same day-of-month; clamp to month end if overflow).
      recurrence == INITIAL_ONLY: expires_at = null (never expires).
      Sweep: VERIFIED_COMPLETED and expires_at != null and now >= expires_at
      (INCLUSIVE — at the exact expiry instant the assignment is EXPIRED;
      validity covers the half-open interval [completed_at, expires_at)).
    input_set: "VERIFIED_COMPLETED assignments"
    precision: "second precision, UTC"

  - name: retention_expiry
    trigger: "curriculum read (effective_recordkeeping_years); audit report generation (recordkeeping_expires_at)"
    algorithm: aggregation
    formula: |
      curriculum.effective_recordkeeping_years =
        recordkeeping_years_override if not null else regulator.recordkeeping_years.
      audit_report.recordkeeping_expires_at =
        generated_at + scope regulator.recordkeeping_years calendar years.
      Precedence: curriculum override beats regulator default; regulator default
      applies when override is null.
    precision: "calendar-year arithmetic, UTC"

  - name: campaign_response_rate
    trigger: "POST /compliance/campaigns/{id}/finalize"
    algorithm: aggregation
    formula: |
      Over the campaign's Attestation rows:
      population_size = count(all); attested_count = ATTESTED;
      exempted_count = EXEMPTED; expired_count = EXPIRED.
      response_rate_pct = round_half_up(100*(attested+exempted)/population_size, 2);
      population_size == 0 -> 0.00.
    input_set: "all Attestation rows of the campaign (any status)"
    precision: "2 decimal places, round_half_up"

  - name: posture_block_evaluation
    trigger: "completion accept/reject/void, sweep escalation entry, extension grant/revoke, role-change apply/reverse, terminate"
    algorithm: constraint_propagation
    formula: |
      employee.compliance_blocked = EXISTS assignment a of employee such that
        requirement(a).criticality == HARD
        AND requirement(a).role_id == employee.current_role_id
        AND ( a.deadline_status == ESCALATED
              OR ( a.progress_status == FAILED AND NOT EXISTS assignment b of
                   employee with b.role_requirement_id == a.role_requirement_id,
                   b.progress_status == VERIFIED_COMPLETED, b.assigned_at > a.assigned_at ) )
      On false->true: employee's PENDING attestations under OPEN campaigns -> BLOCKED.
      On true->false: employee's BLOCKED attestations under OPEN campaigns -> PENDING.
      Terminate forces compliance_blocked = false.
    input_set: "employee's assignments joined to their requirements"
    precision: "boolean"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's allowed roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: Employee acts only on own assignments/attestations; Manager only on direct reports' assignments/attestations; self-service extension/exception forbidden", error_id: "ERR_OWNERSHIP_MISMATCH / ERR_SELF_ACTION_FORBIDDEN", http_status: 403, applies_to: "start, completions submit, extensions grant/revoke, attest, exceptions request, escalations acknowledge" }
  - { priority: 4, category: existence, check: "Request body schema: required fields present, types valid, enum membership, ranges (score 0..100, days ranges), end_date >= start_date", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 5, category: existence, check: "Path ids exist, validated left-to-right; body-referenced ids (curriculum_id, to_role_id, regulator_id in population_spec, role_requirement_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /compliance/regulators/{id}, PATCH /compliance/curricula/{id}, POST /compliance/assignments/{id}/extensions, POST /compliance/assignments/{id}/extensions/revoke" }
  - { priority: 7, category: state, check: "State-machine preconditions for the invoked transition (per §1.2: submittable, reviewable, voidable, campaign/attestation/exception/role-change status gates, employee not terminated)", error_id: "ERR_INVALID_STATE | ERR_ASSIGNMENT_NOT_SUBMITTABLE | ERR_ASSIGNMENT_FROZEN | ERR_ASSIGNMENT_NOT_EXTENDABLE | ERR_COMPLETION_NOT_REVIEWABLE | ERR_COMPLETION_NOT_VOIDABLE | ERR_CAMPAIGN_NOT_DRAFT | ERR_CAMPAIGN_NOT_OPEN | ERR_CAMPAIGN_NOT_FINALIZABLE | ERR_ATTESTATION_NOT_ACTIONABLE | ERR_EXCEPTION_NOT_PENDING | ERR_ROLE_CHANGE_NOT_CANCELLABLE | ERR_ROLE_CHANGE_NOT_REVERSIBLE | ERR_EMPLOYEE_TERMINATED", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_temporal, check: "Time-window rules: role-change effective_at >= now - 30d; role-change reverse within applied_at + 14d; campaign window_open_at < window_close_at at creation; campaign open only within [window_open_at, window_close_at]", error_id: "ERR_RETROACTIVE_LIMIT_EXCEEDED | ERR_CAMPAIGN_WINDOW_INVALID", http_status: 422, applies_to: "role-changes create/reverse, campaigns create/open" }
  - { priority: 9, category: business_constraint, check: "Uniqueness/overlap/limits: to_role != current role; single SCHEDULED change per employee; single ACTIVE (role, curriculum) requirement; version_no unique per curriculum; half-open version windows non-overlapping; closed leave windows with 1-day buffer non-overlapping; single active extension; extend_by_days 1..30; no non-terminal duplicate manual assignment", error_id: "ERR_ROLE_UNCHANGED | ERR_PENDING_ROLE_CHANGE_EXISTS | ERR_DUPLICATE_ACTIVE_REQUIREMENT | ERR_VERSION_NUMBER_CONFLICT | ERR_VERSION_WINDOW_OVERLAP | ERR_LEAVE_OVERLAP | ERR_EXTENSION_LIMIT_ACTIVE | ERR_EXTENSION_DAYS_INVALID | ERR_DUPLICATE_ACTIVE_ASSIGNMENT", http_status: 409, applies_to: "role-changes create, requirements create, versions create, leaves create, extensions, manual assignment create" }
  - { priority: 10, category: business_referential, check: "Cross-entity consistency: manual assignment's requirement.role_id == employee.current_role_id; curriculum belongs to stated regulator chains", error_id: ERR_REQUIREMENT_ROLE_MISMATCH, http_status: 409, applies_to: "POST /compliance/employees/{id}/assignments" }
  - { priority: 11, category: business_safety, check: "Regulatory gates: score >= passing (submission time), evidence tier >= requirement, evidence_uri present when tiered, curriculum ACTIVE with effective version, regulator ACTIVE for new curricula, requirement ACTIVE, target role ACTIVE", error_id: "ERR_SCORE_BELOW_PASSING | ERR_EVIDENCE_TYPE_INSUFFICIENT | ERR_EVIDENCE_URI_MISSING | ERR_NO_EFFECTIVE_VERSION | ERR_REGULATOR_RETIRED | ERR_CURRICULUM_NOT_ACTIVE | ERR_REQUIREMENT_NOT_ACTIVE | ERR_ROLE_NOT_ACTIVE", http_status: 422, applies_to: "completions submit, curricula create/PATCH, requirements create, role-changes create/reverse, manual assignment create" }
    # Priority-conflict pins (dual-failure determinism):
    #  * state (P7) beats business_safety (P11): submitting on a SUBMITTED assignment
    #    with a failing score returns ERR_ASSIGNMENT_NOT_SUBMITTABLE.
    #  * business_temporal (P8) beats business_constraint (P9): a role change both
    #    retroactive beyond 30d AND targeting the current role returns
    #    ERR_RETROACTIVE_LIMIT_EXCEEDED.

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Regulators ---
  - { method: POST, path: "/compliance/regulators", description: "Create regulator", roles: [ComplianceAdmin], code: 201, input: [code, name, deadline_mode, recordkeeping_years, "escalation_interval_days?", "reminder_days_before_due?"], output: Regulator, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/compliance/regulators/{id}", description: "Get regulator", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: Regulator, side_effects: [] }
  - { method: PATCH, path: "/compliance/regulators/{id}", description: "Update regulator (recordkeeping_years, escalation_interval_days, reminder_days_before_due, name, status); deadline_mode immutable; OCC-guarded", roles: [ComplianceAdmin], code: 200, input: [expected_regulator_version, "name?", "recordkeeping_years?", "escalation_interval_days?", "reminder_days_before_due?", "status?"], output: Regulator, side_effects: ["increments Regulator.version by 1", "config changes are not retroactive to existing assignments"] }

  # --- Roles & requirements ---
  - { method: POST, path: "/compliance/roles", description: "Create role", roles: [ComplianceAdmin], code: 201, input: [code, name], output: Role, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/compliance/roles/{id}", description: "Get role", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: Role, side_effects: [] }
  - { method: POST, path: "/compliance/roles/{id}/retire", description: "Retire role", roles: [ComplianceAdmin], code: 200, input: [], output: Role, side_effects: ["status -> RETIRED"] }
  - { method: GET, path: "/compliance/roles/{id}/employees", description: "List employees currently in role", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "Employee[]", side_effects: [] }
  - { method: POST, path: "/compliance/roles/{id}/requirements", description: "Add role requirement; sweeps assignments to all ACTIVE/ON_LEAVE employees in role", roles: [ComplianceAdmin], code: 201, input: [curriculum_id, recurrence, due_in_days, criticality], output: RoleRequirement, side_effects: ["REQUIREMENT_SWEEP: create assignment per employee with current_role_id == role and status in {ACTIVE, ON_LEAVE} (deadline FROZEN if ON_LEAVE), skipping employees who already hold a covering assignment with the same curriculum_id and progress in {ASSIGNED, IN_PROGRESS, SUBMITTED, VERIFIED_COMPLETED}"] }
  - { method: GET, path: "/compliance/roles/{id}/requirements", description: "List requirements of role", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "RoleRequirement[]", side_effects: [] }
  - { method: POST, path: "/compliance/requirements/{id}/retire", description: "Retire requirement (existing assignments unaffected)", roles: [ComplianceAdmin], code: 200, input: [], output: RoleRequirement, side_effects: ["status -> RETIRED"] }
  - { method: GET, path: "/compliance/curricula/{id}/requirements", description: "List requirements referencing curriculum", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "RoleRequirement[]", side_effects: [] }

  # --- Curricula & versions ---
  - { method: POST, path: "/compliance/curricula", description: "Create curriculum (DRAFT)", roles: [ComplianceAdmin], code: 201, input: [regulator_id, code, title, passing_score_pct, validity_months, evidence_requirement, "max_attempts?", "recordkeeping_years_override?"], output: Curriculum, side_effects: ["status=DRAFT", "regulator must be ACTIVE (ERR_REGULATOR_RETIRED)"] }
  - { method: GET, path: "/compliance/curricula", description: "List curricula", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: ["regulator_id?"], output: "Curriculum[]", side_effects: [] }
  - { method: GET, path: "/compliance/curricula/{id}", description: "Get curriculum (incl. effective_recordkeeping_years)", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: Curriculum, side_effects: [] }
  - { method: PATCH, path: "/compliance/curricula/{id}", description: "Update curriculum (passing_score_pct applies to future submissions only; status transitions DRAFT->ACTIVE->RETIRED); OCC-guarded", roles: [ComplianceAdmin], code: 200, input: [expected_curriculum_version, "passing_score_pct?", "validity_months?", "max_attempts?", "recordkeeping_years_override?", "status?"], output: Curriculum, side_effects: ["increments Curriculum.version by 1"] }
  - { method: POST, path: "/compliance/curricula/{id}/versions", description: "Add curriculum version; half-open windows must not overlap; version_no unique per curriculum", roles: [ComplianceAdmin], code: 201, input: [version_no, effective_from, "effective_to?", content_uri], output: CurriculumVersion, side_effects: ["requires curriculum.status != RETIRED (ERR_INVALID_STATE)"] }
  - { method: GET, path: "/compliance/curricula/{id}/versions", description: "List versions of curriculum", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "CurriculumVersion[]", side_effects: [] }
  - { method: GET, path: "/compliance/curricula/{id}/effectiveness", description: "Effectiveness read: first-attempt reviewed pass rate and average score", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: { curriculum_id: string, first_attempt_count: integer, first_attempt_pass_count: integer, first_attempt_pass_rate_pct: number, average_score_pct: number }, side_effects: [] }

  # --- Employees, leaves, role changes ---
  - { method: POST, path: "/compliance/employees", description: "Create employee; NEW_HIRE sweep creates assignments for the role's ACTIVE requirements", roles: [HRAdmin], code: 201, input: [employee_no, full_name, hired_at, current_role_id, "manager_id?"], output: Employee, side_effects: ["status=ACTIVE", "NEW_HIRE assignment sweep (assigned_at = logical clock)"] }
  - { method: GET, path: "/compliance/employees", description: "List employees", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: ["manager_id?", "status?"], output: "Employee[]", side_effects: [] }
  - { method: GET, path: "/compliance/employees/{id}", description: "Get employee (incl. compliance_blocked, verified_completed_count)", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: Employee, side_effects: [] }
  - { method: POST, path: "/compliance/employees/{id}/terminate", description: "Terminate employee; cascades per Employee state machine", roles: [HRAdmin], code: 200, input: [], output: Employee, side_effects: ["cancel non-terminal assignments + void pending completions", "cancel SCHEDULED role changes", "expire open attestations + auto-deny exceptions", "compliance_blocked=false"] }
  - { method: POST, path: "/compliance/employees/{id}/leaves", description: "Create leave; closed interval with 1-day buffer conflict rule", roles: [HRAdmin], code: 201, input: [start_date, end_date, reason], output: LeaveOfAbsence, side_effects: ["if window covers now: employee -> ON_LEAVE and non-terminal assignments FROZEN"] }
  - { method: GET, path: "/compliance/employees/{id}/leaves", description: "List leaves of employee", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "LeaveOfAbsence[]", side_effects: [] }
  - { method: POST, path: "/compliance/employees/{id}/role-changes", description: "Create role change; effective_at <= now applies synchronously, else SCHEDULED (applied only by sweep step 1)", roles: [HRAdmin], code: 201, input: [to_role_id, effective_at], output: EmployeeRoleChange, side_effects: ["on apply: cascades per EmployeeRoleChange state machine"] }
  - { method: GET, path: "/compliance/role-changes", description: "List role changes", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: ["employee_id?", "to_role_id?", "status?"], output: "EmployeeRoleChange[]", side_effects: [] }
  - { method: GET, path: "/compliance/role-changes/{id}", description: "Get role change", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: EmployeeRoleChange, side_effects: [] }
  - { method: POST, path: "/compliance/role-changes/{id}/cancel", description: "Cancel a SCHEDULED role change", roles: [HRAdmin], code: 200, input: [], output: EmployeeRoleChange, side_effects: [] }
  - { method: POST, path: "/compliance/role-changes/{id}/reverse", description: "Reverse an APPLIED role change within 14 days; compensating cascades", roles: [HRAdmin], code: 200, input: [], output: EmployeeRoleChange, side_effects: ["cancel change-created assignments + void their pending completions", "restore role, create REVERSAL assignments"] }

  # --- Assignments & extensions ---
  - { method: POST, path: "/compliance/employees/{id}/assignments", description: "Manual assignment (MANUAL trigger, e.g. remedial retake after FAILED)", roles: [ComplianceAdmin], code: 201, input: [role_requirement_id], output: TrainingAssignment, side_effects: ["dedupe: rejects if non-terminal assignment for same requirement exists (ERR_DUPLICATE_ACTIVE_ASSIGNMENT)"] }
  - { method: GET, path: "/compliance/assignments", description: "List assignments with filters; pagination per envelope", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: ["employee_id?", "role_requirement_id?", "curriculum_id?", "source_role_change_id?", "progress_status?", "deadline_status?", "limit?", "offset?"], output: "TrainingAssignment[]", side_effects: [] }
  - { method: GET, path: "/compliance/assignments/{id}", description: "Get assignment", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: TrainingAssignment, side_effects: [] }
  - { method: POST, path: "/compliance/assignments/{id}/start", description: "Employee starts assignment (ASSIGNED -> IN_PROGRESS)", roles: [Employee], code: 200, input: [], output: TrainingAssignment, side_effects: ["increments TrainingAssignment.version by 1"] }
  - { method: POST, path: "/compliance/assignments/{id}/extensions", description: "Manager grants due-date extension (single active extension; recomputes deadline_status, no notices); OCC-guarded", roles: [Manager], code: 200, input: [extend_by_days, reason, expected_assignment_version], output: TrainingAssignment, side_effects: ["due_at += extend_by_days days", "active_extension_days = extend_by_days", "increments TrainingAssignment.version by 1", "deadline_status recompute + compliance_blocked recompute"] }
  - { method: POST, path: "/compliance/assignments/{id}/extensions/revoke", description: "Manager revokes the active extension, restoring base_due_at exactly; OCC-guarded", roles: [Manager], code: 200, input: [expected_assignment_version], output: TrainingAssignment, side_effects: ["due_at -= active_extension_days days", "active_extension_days = 0", "increments TrainingAssignment.version by 1", "deadline_status recompute + compliance_blocked recompute"] }
  - { method: POST, path: "/compliance/assignments/{id}/cancel", description: "Admin-cancel a non-terminal assignment; pending completions voided", roles: [ComplianceAdmin], code: 200, input: [], output: TrainingAssignment, side_effects: ["PENDING_REVIEW completions -> VOIDED"] }

  # --- Completion records ---
  - { method: POST, path: "/compliance/assignments/{id}/completions", description: "Employee submits completion evidence + score", roles: [Employee], code: 201, input: [score_pct, evidence_type, "evidence_uri?"], output: CompletionRecord, side_effects: ["assignment -> SUBMITTED", "is_late/passed computed at submission moment"] }
  - { method: GET, path: "/compliance/assignments/{id}/completions", description: "List completion records of assignment (attempt_no ASC)", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "CompletionRecord[]", side_effects: [] }
  - { method: POST, path: "/compliance/completions/{id}/accept", description: "Review-accept completion", roles: [ComplianceAdmin], code: 200, input: ["review_note?"], output: CompletionRecord, side_effects: ["assignment -> VERIFIED_COMPLETED; completed_at/expires_at set; counts recomputed"] }
  - { method: POST, path: "/compliance/completions/{id}/reject", description: "Review-reject completion (review_note required); attempts_used += 1; may fail assignment at max_attempts", roles: [ComplianceAdmin], code: 200, input: [review_note], output: CompletionRecord, side_effects: ["assignment -> IN_PROGRESS or FAILED; compliance_blocked recompute + attestation BLOCKED cascade"] }
  - { method: POST, path: "/compliance/completions/{id}/void", description: "Void an ACCEPTED completion (compensating action)", roles: [ComplianceAdmin], code: 200, input: [reason], output: CompletionRecord, side_effects: ["assignment VERIFIED_COMPLETED -> IN_PROGRESS; completed_at/expires_at nulled; counts recomputed"] }

  # --- Escalations ---
  - { method: GET, path: "/compliance/assignments/{id}/escalations", description: "List notices of assignment (triggered_at ASC, level ASC)", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "EscalationNotice[]", side_effects: [] }
  - { method: GET, path: "/compliance/employees/{id}/escalations", description: "List notices addressed to employee", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "EscalationNotice[]", side_effects: [] }
  - { method: POST, path: "/compliance/escalations/{id}/acknowledge", description: "Acknowledge notice: recipient manager (levels 1-2) or ComplianceAdmin (level 3, recipient null)", roles: [Manager, ComplianceAdmin], code: 200, input: [], output: EscalationNotice, side_effects: ["status -> ACKNOWLEDGED"] }

  # --- Campaigns, attestations, exceptions ---
  - { method: POST, path: "/compliance/campaigns", description: "Create attestation campaign (DRAFT)", roles: [ComplianceAdmin], code: 201, input: [year, regulator_id, window_open_at, window_close_at, statement_version], output: AttestationCampaign, side_effects: ["window_open_at < window_close_at required (ERR_CAMPAIGN_WINDOW_INVALID)"] }
  - { method: GET, path: "/compliance/campaigns", description: "List campaigns", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: ["regulator_id?", "status?"], output: "AttestationCampaign[]", side_effects: [] }
  - { method: GET, path: "/compliance/campaigns/{id}", description: "Get campaign (incl. metrics after finalize)", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: AttestationCampaign, side_effects: [] }
  - { method: POST, path: "/compliance/campaigns/{id}/open", description: "Open campaign; creates one Attestation per eligible employee", roles: [ComplianceAdmin], code: 200, input: [], output: AttestationCampaign, side_effects: ["attestation population sweep (see AttestationCampaign state machine)"] }
  - { method: POST, path: "/compliance/campaigns/{id}/close", description: "Close campaign; expires open attestations, auto-denies requested exceptions", roles: [ComplianceAdmin], code: 200, input: [], output: AttestationCampaign, side_effects: ["PENDING/BLOCKED/EXCEPTION_PENDING -> EXPIRED; REQUESTED exceptions -> DENIED('AUTO_DENIED_AT_CLOSE')"] }
  - { method: POST, path: "/compliance/campaigns/{id}/finalize", description: "Finalize CLOSED campaign; computes and persists metrics", roles: [Auditor], code: 200, input: [], output: AttestationCampaign, side_effects: ["metrics computed per campaign_response_rate"] }
  - { method: GET, path: "/compliance/campaigns/{id}/attestations", description: "List attestations of campaign (created_at ASC)", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "Attestation[]", side_effects: [] }
  - { method: GET, path: "/compliance/employees/{id}/attestations", description: "List attestations of employee", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "Attestation[]", side_effects: [] }
  - { method: GET, path: "/compliance/attestations/{id}", description: "Get attestation", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: Attestation, side_effects: [] }
  - { method: POST, path: "/compliance/attestations/{id}/attest", description: "Employee attests", roles: [Employee], code: 200, input: [], output: Attestation, side_effects: ["attested_at=now; statement_version_snapshot set"] }
  - { method: POST, path: "/compliance/attestations/{id}/exceptions", description: "Manager requests attestation exception for a direct report", roles: [Manager], code: 201, input: [reason_code, detail], output: AttestationException, side_effects: ["attestation PENDING -> EXCEPTION_PENDING"] }
  - { method: GET, path: "/compliance/attestations/{id}/exceptions", description: "List exceptions of attestation", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "AttestationException[]", side_effects: [] }
  - { method: GET, path: "/compliance/employees/{id}/requested-exceptions", description: "List exceptions requested by this manager", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: "AttestationException[]", side_effects: [] }
  - { method: POST, path: "/compliance/exceptions/{id}/approve", description: "Approve exception; attestation -> EXEMPTED", roles: [ComplianceAdmin], code: 200, input: [], output: AttestationException, side_effects: ["attestation EXCEPTION_PENDING -> EXEMPTED"] }
  - { method: POST, path: "/compliance/exceptions/{id}/deny", description: "Deny exception (decision_note required); attestation -> PENDING", roles: [ComplianceAdmin], code: 200, input: [decision_note], output: AttestationException, side_effects: ["attestation EXCEPTION_PENDING -> PENDING"] }

  # --- Audit reports ---
  - { method: POST, path: "/compliance/audit-reports", description: "Generate audit report snapshot for a population", roles: [Auditor], code: 201, input: [population_spec, metric_variant], output: AuditReport, side_effects: ["metrics computed per compliance_rate (variant) + audit_weighted_first_attempt_pass_rate; recordkeeping_expires_at set"] }
  - { method: GET, path: "/compliance/audit-reports/{id}", description: "Get audit report", roles: [ComplianceAdmin, HRAdmin, Manager, Employee, Auditor], code: 200, input: [], output: AuditReport, side_effects: [] }

  # --- Test-driving endpoints ---
  - { method: POST, path: "/compliance/_clock/set_current_utc", description: "Set the logical clock. DEFAULT: before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [ComplianceAdmin], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["logical clock := to_iso8601"] }
  - { method: POST, path: "/compliance/_sweeps/run", description: "Run the deterministic sweep in pinned order: (1) apply due role changes, (2) leave start/end flips + freeze/unfreeze, (3) deadline transitions + notices + HARD-escalation block cascade, (4) assignment expiry + recurrence creation, (5) campaign auto-close cascade", roles: [ComplianceAdmin], code: 200, input: [], output: { role_changes_applied: integer, leaves_started: integer, leaves_ended: integer, assignments_transitioned: integer, notices_created: integer, assignments_expired: integer, recurrences_created: integer, campaigns_closed: integer, attestations_expired: integer, attestations_blocked: integer, exceptions_auto_denied: integer }, side_effects: ["per-step cascades per state machines"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, out-of-range value, end_date < start_date" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint (incl. level-3 notice acknowledge by non-admin)" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller is not the owner / not the direct manager of the target" }
  - { id: ERR_SELF_ACTION_FORBIDDEN, http: 403, condition: "Manager attempts extension or exception on their own assignment/attestation (segregation of duties)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation without a more specific code (start twice, cancel terminal, retire twice, acknowledge twice, version create on RETIRED curriculum)" }
  - { id: ERR_ASSIGNMENT_NOT_SUBMITTABLE, http: 409, condition: "Completion submitted while progress_status not in {ASSIGNED, IN_PROGRESS}" }
  - { id: ERR_ASSIGNMENT_FROZEN, http: 409, condition: "Completion submitted while deadline_status == FROZEN (employee on leave)" }
  - { id: ERR_ASSIGNMENT_NOT_EXTENDABLE, http: 409, condition: "Extension granted while progress_status not in {ASSIGNED, IN_PROGRESS}" }
  - { id: ERR_COMPLETION_NOT_REVIEWABLE, http: 409, condition: "Accept/reject on a completion not in PENDING_REVIEW" }
  - { id: ERR_COMPLETION_NOT_VOIDABLE, http: 409, condition: "Void on a completion not in ACCEPTED" }
  - { id: ERR_CAMPAIGN_NOT_DRAFT, http: 409, condition: "Open on a campaign not in DRAFT" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "Close/attest/exception-request while campaign not OPEN" }
  - { id: ERR_CAMPAIGN_NOT_FINALIZABLE, http: 409, condition: "Finalize on a campaign not CLOSED" }
  - { id: ERR_CAMPAIGN_WINDOW_INVALID, http: 422, condition: "window_close_at <= window_open_at at creation, or open attempted outside [window_open_at, window_close_at]" }
  - { id: ERR_ATTESTATION_NOT_ACTIONABLE, http: 409, condition: "Attest/exception-request on an attestation not in PENDING (incl. BLOCKED, EXPIRED, ATTESTED)" }
  - { id: ERR_EXCEPTION_NOT_PENDING, http: 409, condition: "Approve/deny on an exception not in REQUESTED" }
  - { id: ERR_ROLE_CHANGE_NOT_CANCELLABLE, http: 409, condition: "Cancel on a role change not in SCHEDULED" }
  - { id: ERR_ROLE_CHANGE_NOT_REVERSIBLE, http: 409, condition: "Reverse on a role change not APPLIED, or an ACCEPTED completion exists on a change-created assignment" }
  - { id: ERR_RETROACTIVE_LIMIT_EXCEEDED, http: 409, condition: "role-change effective_at more than 30 days in the past, or reverse more than 14 days after applied_at" }
  - { id: ERR_ROLE_UNCHANGED, http: 409, condition: "to_role_id equals employee's current role" }
  - { id: ERR_ROLE_NOT_ACTIVE, http: 409, condition: "Role-change target role (or reversal source role) is RETIRED" }
  - { id: ERR_PENDING_ROLE_CHANGE_EXISTS, http: 409, condition: "Employee already has a SCHEDULED role change" }
  - { id: ERR_CURRICULUM_NOT_ACTIVE, http: 409, condition: "Requirement or manual assignment references a non-ACTIVE curriculum" }
  - { id: ERR_REGULATOR_RETIRED, http: 409, condition: "Curriculum create or curriculum activation under a RETIRED regulator" }
  - { id: ERR_REQUIREMENT_NOT_ACTIVE, http: 409, condition: "Manual assignment references a RETIRED requirement" }
  - { id: ERR_REQUIREMENT_ROLE_MISMATCH, http: 409, condition: "Manual assignment requirement's role differs from employee's current role" }
  - { id: ERR_DUPLICATE_ACTIVE_REQUIREMENT, http: 409, condition: "An ACTIVE requirement already exists for (role_id, curriculum_id)" }
  - { id: ERR_DUPLICATE_ACTIVE_ASSIGNMENT, http: 409, condition: "A non-terminal assignment already exists for (employee, requirement)" }
  - { id: ERR_VERSION_WINDOW_OVERLAP, http: 409, condition: "CurriculumVersion half-open window overlaps an existing version of the same curriculum" }
  - { id: ERR_VERSION_NUMBER_CONFLICT, http: 409, condition: "version_no already used for this curriculum" }
  - { id: ERR_LEAVE_OVERLAP, http: 409, condition: "Leave window conflicts: closed intervals + mandatory 1-day buffer (new.start <= existing.end + 1 day AND existing.start <= new.end + 1 day)" }
  - { id: ERR_EXTENSION_LIMIT_ACTIVE, http: 409, condition: "An active extension already exists on the assignment" }
  - { id: ERR_NO_ACTIVE_EXTENSION, http: 409, condition: "Revoke attempted with active_extension_days == 0" }
  - { id: ERR_EXTENSION_DAYS_INVALID, http: 422, condition: "extend_by_days outside 1..30" }
  - { id: ERR_SCORE_BELOW_PASSING, http: 422, condition: "score_pct < curriculum.passing_score_pct at submission (boundary: equal passes)" }
  - { id: ERR_EVIDENCE_TYPE_INSUFFICIENT, http: 422, condition: "evidence_type tier below curriculum.evidence_requirement (NONE < CERTIFICATE < PROCTORED_CERTIFICATE)" }
  - { id: ERR_EVIDENCE_URI_MISSING, http: 422, condition: "evidence_type != NONE but evidence_uri absent" }
  - { id: ERR_NO_EFFECTIVE_VERSION, http: 409, condition: "Curriculum activation without a currently-effective CurriculumVersion" }
  - { id: ERR_EMPLOYEE_TERMINATED, http: 409, condition: "Start/submit/attest/manual-assign/role-change/leave for a TERMINATED employee" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Corporate compliance training office administrator: owns regulator/role/curriculum configuration, reviews completions, runs campaigns, decides exceptions, operates clock and sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/regulators, PATCH /compliance/regulators/{id}"
      - "POST /compliance/roles, POST /compliance/roles/{id}/retire"
      - "POST /compliance/roles/{id}/requirements, POST /compliance/requirements/{id}/retire"
      - "POST /compliance/curricula, PATCH /compliance/curricula/{id}, POST /compliance/curricula/{id}/versions"
      - "POST /compliance/employees/{id}/assignments, POST /compliance/assignments/{id}/cancel"
      - "POST /compliance/completions/{id}/accept|reject|void"
      - "POST /compliance/campaigns, POST /compliance/campaigns/{id}/open|close"
      - "POST /compliance/exceptions/{id}/approve|deny"
      - "POST /compliance/_clock/set_current_utc, POST /compliance/_sweeps/run"
    shared_operations:
      - "all GET endpoints"
      - "POST /compliance/escalations/{id}/acknowledge (level-3 notices with null recipient)"
  - name: HRAdmin
    description: "HR operations: owns employee lifecycle, leaves, and role changes"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/employees, POST /compliance/employees/{id}/terminate"
      - "POST /compliance/employees/{id}/leaves"
      - "POST /compliance/employees/{id}/role-changes, POST /compliance/role-changes/{id}/cancel|reverse"
    shared_operations: ["all GET endpoints"]
  - name: Manager
    description: "People manager (is an Employee): grants/revokes extensions and requests attestation exceptions for DIRECT REPORTS only; may never act on own records (segregation of duties)"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /compliance/assignments/{id}/extensions, POST /compliance/assignments/{id}/extensions/revoke"
      - "POST /compliance/attestations/{id}/exceptions"
    shared_operations:
      - "all GET endpoints"
      - "POST /compliance/escalations/{id}/acknowledge (notices addressed to them)"
  - name: Employee
    description: "Trainee (is an Employee): starts own assignments, submits own completion records, attests own attestations"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /compliance/assignments/{id}/start"
      - "POST /compliance/assignments/{id}/completions"
      - "POST /compliance/attestations/{id}/attest"
    shared_operations: ["all GET endpoints"]
  - name: Auditor
    description: "Independent audit function: finalizes campaigns, generates audit reports (segregated from administration and review)"
    identity: opaque
    exclusive_operations:
      - "POST /compliance/campaigns/{id}/finalize"
      - "POST /compliance/audit-reports"
    shared_operations: ["all GET endpoints"]
  - name: Anonymous
    description: "Unauthenticated or unrecognized role; used to verify denial"
    identity: opaque
    exclusive_operations: []
    shared_operations: []
