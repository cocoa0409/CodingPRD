              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          trigger:
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 2.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r_id: "$.data.id" }
          assert:
