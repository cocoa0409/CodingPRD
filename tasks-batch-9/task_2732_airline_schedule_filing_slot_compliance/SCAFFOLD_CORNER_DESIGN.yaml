              captures: { sv_id: "$.data.id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${dus_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
