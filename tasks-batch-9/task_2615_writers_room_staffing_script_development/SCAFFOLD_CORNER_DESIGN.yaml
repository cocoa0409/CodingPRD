            - "CreditSubmission.${sb1}.episode_id == ${ep1}, writer_id == ${w1}, claim_basis == WRITTEN_BY and claimed_contribution_pct == 60"
            - "CreditSubmission.${sb2}.claimed_contribution_pct == 30 - the two claims are NOT required to sum to 100 before the close"
            - "Episode.${ep1}.credit_status == SUBMISSIONS_OPEN and provisional_credit_shares == {} (no normalisation before the close)"
            - "GET /credit-submissions?episode_id=${ep1} returns exactly 2 rows"

      - name: arbitration_creation_copies_eligible_participants_and_auto_advances_once
        claim_type: creation
        grounds:
