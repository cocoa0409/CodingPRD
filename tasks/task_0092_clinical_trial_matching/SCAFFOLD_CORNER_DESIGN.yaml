          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "CoordinatorStaff calling POST /trials/{id}/irb-reviews (a Sponsor-exclusive op) is rejected ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A trial in SETUP."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
