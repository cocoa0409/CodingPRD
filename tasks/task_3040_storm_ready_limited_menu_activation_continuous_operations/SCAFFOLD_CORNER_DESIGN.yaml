          - endpoints.GET_/storm-events
        distinguishing_aspect: "GET list endpoints without limit/offset use the envelope defaults (limit 10, offset 0) and echo total_count and has_more; with 12 storms created, the first page returns 10 and has_more true, the second page returns 2."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Twelve storms created."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
