            - { call: "POST /api/cases/${ca}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases", payload: { policy_id: "${pb}" }, as: Broker, as_user_id: "${b_id}", captures: { cb: "$.data.id" } }
            - { call: "POST /api/cases/${cb}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
          trigger:
