      - name: state_transition_outranks_occ_stale_outing_version
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - concurrency_rules[finance-transition-stale-outing]
          - state_machines.Outing.RECONCILED_to_DISBURSED
        conflicting_priorities: [8, 11]
        expected_error: ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          Third category pair: state (8) versus optimistic concurrency (11). REMIT is
          requested while finance_status is still COLLECTING and the supplied
          expected_outing_version is two writes behind. Because the §1.4 ladder evaluates
          the state precondition before the version guard, the caller sees 409
          ERR_INVALID_STATE_TRANSITION and never 412 ERR_STALE_OUTING_VERSION - so a client
          cannot mistake a wrongly-sequenced call for a lost update and blindly re-read and
          retry.
        test_recipe:
          setup:
            - "Outing created and then advanced through three play transitions (OPEN_REGISTRATION, POSTPONE, RESUME), so its version has moved on three times while finance_status stays COLLECTING."
            - "The stale version is captured from the response of the create call, before any of the three transitions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CharityTreasurer
            - call: "POST /outing-ops/outings"
