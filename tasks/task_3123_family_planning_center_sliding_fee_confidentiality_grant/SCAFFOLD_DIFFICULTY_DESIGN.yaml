# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3123_family_planning_center_sliding_fee_confidentiality_grant
# 9 rules x 2 instances = 18 instances. Every instance grounds into SCAFFOLD.yaml
# §1.1-§1.7 and drives empty-DB -> precondition via §1.5 endpoints only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sliding_fee_documented_vs_self_declared
        grounds:
          - calculations.fee_tier_assignment
          - calculations.sliding_fee_charge
          - entities.HouseholdAssessment.fields.income_basis
          - entities.FeeScheduleTier.fields.requires_documentation
        distinguishing_aspect: |
          Identical household size and income produce different assigned tiers (and
          therefore different patient_charge_cents) purely because income_basis flips
          between DOCUMENTED (tier A, 100% discount, requires_documentation) and
          SELF_DECLARED (tier A excluded, tier B 80% selected) — dual-variant logic
          on the Patient/HouseholdAssessment domain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Affiliate in TX with four tiers: A=[0,100) disc 100 copay 500 doc-only; B=[0,150) disc 80 copay 500; C=[150,200) disc 50 copay 0; D=[200,1000) disc 0 copay 0."
            - "Catalog entry CONTRACEPTIVE_COUNSELING full_fee_cents 20000, in_scope, telehealth_eligible."
            - "Provider with TX license [2026-01-01, 2027-01-01). Two adult patients P1 and P2, identical household_size 4 and annual_income_cents 1500000 (fpl_pct 48 for both)."
            - "P1 assessed DOCUMENTED; P2 assessed SELF_DECLARED."
          setup_api_calls:
            - &clock_0901
              call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: GrantAdministrator
            - &aff_tx
              call: "POST /family-planning/affiliates"
              payload: { affiliate_code: "PP-TX-01", state_code: "TX", low_income_priority_quota: 50 }
              as: GrantAdministrator
              captures: { aff_id: $.data.id, aff_v: $.data.version }
            - &tier_a
              call: "POST /family-planning/affiliates/${aff_id}/fee-tiers"
              payload: { tier_code: "A", fpl_pct_min_inclusive: 0, fpl_pct_max_exclusive: 100, discount_pct: 100, nominal_copay_cents: 500, requires_documentation: true }
              as: GrantAdministrator
            - &tier_b
              call: "POST /family-planning/affiliates/${aff_id}/fee-tiers"
              payload: { tier_code: "B", fpl_pct_min_inclusive: 0, fpl_pct_max_exclusive: 150, discount_pct: 80, nominal_copay_cents: 500, requires_documentation: false }
              as: GrantAdministrator
            - &tier_c
              call: "POST /family-planning/affiliates/${aff_id}/fee-tiers"
              payload: { tier_code: "C", fpl_pct_min_inclusive: 150, fpl_pct_max_exclusive: 200, discount_pct: 50, nominal_copay_cents: 0, requires_documentation: false }
              as: GrantAdministrator
            - &tier_d
              call: "POST /family-planning/affiliates/${aff_id}/fee-tiers"
              payload: { tier_code: "D", fpl_pct_min_inclusive: 200, fpl_pct_max_exclusive: 1000, discount_pct: 0, nominal_copay_cents: 0, requires_documentation: false }
              as: GrantAdministrator
            - &cat_counsel
              call: "POST /family-planning/affiliates/${aff_id}/service-catalog"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", in_scope: true, telehealth_eligible: true, full_fee_cents: 20000 }
              as: GrantAdministrator
            - &prov_tx
              call: "POST /family-planning/affiliates/${aff_id}/providers"
              payload: { display_name: "Dr. Reyes", provider_type: "PHYSICIAN" }
              as: GrantAdministrator
              captures: { prov_id: $.data.id }
            - &lic_tx
              call: "POST /family-planning/providers/${prov_id}/licenses"
              payload: { state_code: "TX", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "P1", date_of_birth: "1990-05-01", insurance_policy_id: "POL-1" }
              as: FrontDeskStaff
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "P2", date_of_birth: "1990-05-01", insurance_policy_id: "POL-2" }
              as: FrontDeskStaff
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /family-planning/patients/${p1_id}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 1500000, income_basis: "DOCUMENTED", expected_patient_version: "${p1_v}" }
              as: FrontDeskStaff
              captures: { asm1_id: $.data.id }
            - call: "POST /family-planning/patients/${p2_id}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 1500000, income_basis: "SELF_DECLARED", expected_patient_version: "${p2_v}" }
              as: FrontDeskStaff
              captures: { asm2_id: $.data.id }
          trigger:
            - call: "POST /family-planning/patients/${p1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { enc1_id: $.data.id }
            - call: "POST /family-planning/patients/${p2_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T11:00:00Z", scheduled_end: "2026-09-10T11:30:00Z" }
              as: FrontDeskStaff
              captures: { enc2_id: $.data.id }
          assert:
            - "HouseholdAssessment.${asm1_id}.fpl_pct == 48 and assigned_tier_code == \"A\""
            - "HouseholdAssessment.${asm2_id}.fpl_pct == 48 and assigned_tier_code == \"B\""
            - "Encounter.${enc1_id}.patient_charge_cents == 500 (100% discount floored at nominal copay)"
            - "Encounter.${enc2_id}.patient_charge_cents == 4000 (80% discount: 20000 - 16000)"
            - "Encounter.${enc1_id}.patient_charge_cents != Encounter.${enc2_id}.patient_charge_cents despite identical income and household size"

      - name: device_valuation_fifo_vs_weighted_average
        grounds:
          - calculations.device_valuation
          - entities.GrantReport.fields.valuation_variant
          - entities.GrantReport.fields.device_value_cents
        distinguishing_aspect: |
          The same three fulfilled IUD_HORMONAL units (two from a 20000-cent lot, one
          from a 30000-cent lot) value to 70000 cents under the FIFO variant and 69999
          cents under WEIGHTED_AVERAGE (floor(70000/3)=23333 x 3) — dual-variant logic
          on the GrantReport/inventory domain, structurally distinct from the
          sliding-fee variant (different entity domain).
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-10T10:00:00Z after setup at 2026-09-01."
            - "Affiliate TX with tiers A-D, catalog LARC_INSERTION full_fee 50000 in_scope, provider licensed TX."
            - "Three adult patients, each with a DOCUMENTED household-1 income 4000000 assessment (fpl_pct 265 -> tier D, no discount)."
            - "Two lots of device_code IUD_HORMONAL: lot1 unit_cost 20000 on_hand 5 created first, lot2 unit_cost 30000 on_hand 5 created second; both expire 2027-01-01."
            - "Three completed encounters 2026-09-10: enc1 and enc2 fulfill one unit from lot1 each; enc3 fulfills one unit from lot2."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - call: "POST /family-planning/affiliates/${aff_id}/service-catalog"
              payload: { service_code: "LARC_INSERTION", in_scope: true, telehealth_eligible: false, full_fee_cents: 50000 }
              as: GrantAdministrator
            - *prov_tx
            - *lic_tx
            - &lot1
              call: "POST /family-planning/affiliates/${aff_id}/stock-lots"
              payload: { device_code: "IUD_HORMONAL", lot_number: "LOT-1", unit_cost_cents: 20000, on_hand: 5, expires_on: "2027-01-01" }
              as: SupplyCoordinator
              captures: { lot1_id: $.data.id }
            - &lot2
              call: "POST /family-planning/affiliates/${aff_id}/stock-lots"
              payload: { device_code: "IUD_HORMONAL", lot_number: "LOT-2", unit_cost_cents: 30000, on_hand: 5, expires_on: "2027-01-01" }
              as: SupplyCoordinator
              captures: { lot2_id: $.data.id }
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "D1", date_of_birth: "1988-01-01" }
              as: FrontDeskStaff
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /family-planning/patients/${d1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${d1_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "D2", date_of_birth: "1988-01-01" }
              as: FrontDeskStaff
              captures: { d2_id: $.data.id, d2_v: $.data.version }
            - call: "POST /family-planning/patients/${d2_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${d2_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "D3", date_of_birth: "1988-01-01" }
              as: FrontDeskStaff
              captures: { d3_id: $.data.id, d3_v: $.data.version }
            - call: "POST /family-planning/patients/${d3_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${d3_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${d1_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T09:00:00Z", scheduled_end: "2026-09-10T09:30:00Z" }
              as: FrontDeskStaff
              captures: { e1_id: $.data.id }
            - call: "POST /family-planning/patients/${d2_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { e2_id: $.data.id }
            - call: "POST /family-planning/patients/${d3_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T11:00:00Z", scheduled_end: "2026-09-10T11:30:00Z" }
              as: FrontDeskStaff
              captures: { e3_id: $.data.id }
            - call: "POST /family-planning/encounters/${e1_id}/device-reservations"
              payload: { lot_id: "${lot1_id}" }
              as: SupplyCoordinator
            - call: "POST /family-planning/encounters/${e2_id}/device-reservations"
              payload: { lot_id: "${lot1_id}" }
              as: SupplyCoordinator
            - call: "POST /family-planning/encounters/${e3_id}/device-reservations"
              payload: { lot_id: "${lot2_id}" }
              as: SupplyCoordinator
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T12:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${e1_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${e1_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${e2_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${e2_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${e3_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${e3_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: GrantAdministrator
          trigger:
            - call: "POST /family-planning/affiliates/${aff_id}/grant-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", valuation_variant: "FIFO", expected_affiliate_version: "${aff_v}" }
              as: GrantAdministrator
              captures: { rep_fifo: $.data.id }
            - call: "POST /family-planning/grant-reports/${rep_fifo}/finalize"
              payload: {}
              as: GrantAdministrator
            - call: "GET /family-planning/affiliates/${aff_id}"
              payload: {}
              as: GrantAdministrator
              captures: { aff_v2: $.data.version }
            - call: "POST /family-planning/affiliates/${aff_id}/grant-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", valuation_variant: "WEIGHTED_AVERAGE", expected_affiliate_version: "${aff_v2}" }
              as: GrantAdministrator
              captures: { rep_wa: $.data.id }
          assert:
            - "GrantReport.${rep_fifo}.device_value_cents == 70000 (20000 + 20000 + 30000, lot created_at order)"
            - "GrantReport.${rep_wa}.device_value_cents == 69999 (floor(70000/3) = 23333 per unit x 3)"
            - "GrantReport.${rep_fifo}.encounter_count == 3 and GrantReport.${rep_wa}.encounter_count == 3"
            - "GrantReport.${rep_fifo}.device_value_cents != GrantReport.${rep_wa}.device_value_cents over the identical fulfilled-unit set"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sliding_fee_nominal_copay_floor_with_full_discount
        grounds:
          - calculations.sliding_fee_charge
          - entities.FeeScheduleTier.fields.nominal_copay_cents
          - entities.FeeScheduleTier.fields.discount_pct
        distinguishing_aspect: |
          Mode (a): three-input non-linear formula — full_fee_cents x discount_pct
          floored, then max() against nominal_copay_cents: at 100% discount on a
          20000-cent service with a 500-cent nominal copay the charge is exactly 500,
          not 0 — the nested max() branch is what fires.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING fee 20000, licensed provider."
            - "Adult patient with DOCUMENTED household-4 income 1500000 (fpl 48 -> tier A, discount 100%, nominal copay 500)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "F1", date_of_birth: "1992-03-03" }
              as: FrontDeskStaff
              captures: { f1_id: $.data.id, f1_v: $.data.version }
            - call: "POST /family-planning/patients/${f1_id}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 1500000, income_basis: "DOCUMENTED", expected_patient_version: "${f1_v}" }
              as: FrontDeskStaff
          trigger:
            - call: "POST /family-planning/patients/${f1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encf_id: $.data.id }
          assert:
            - "Encounter.${encf_id}.patient_charge_cents == 500"
            - "Encounter.${encf_id}.patient_charge_cents != 0 — the nominal copay floor binds at 100% discount"

      - name: sliding_fee_discount_floored_before_subtraction
        grounds:
          - calculations.sliding_fee_charge
          - entities.Encounter.fields.patient_charge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — the discount is floored FIRST
          (floor(33333 x 50 / 100) = 16666) and THEN subtracted, yielding 16667;
          the alternative order (floor of the net, 33333 x 0.5) yields 16666. The
          scaffold pins round-discount-then-subtract, and 16667 is the only correct
          answer.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, tiers A-D, catalog STI_SCREEN fee 33333 in_scope, licensed provider."
            - "Adult patient with DOCUMENTED household-1 income 2635500 (fpl_pct 174 -> tier C, discount 50%, nominal copay 0)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - call: "POST /family-planning/affiliates/${aff_id}/service-catalog"
              payload: { service_code: "STI_SCREEN", in_scope: true, telehealth_eligible: true, full_fee_cents: 33333 }
              as: GrantAdministrator
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "R1", date_of_birth: "1995-07-07" }
              as: FrontDeskStaff
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /family-planning/patients/${r1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 2635500, income_basis: "DOCUMENTED", expected_patient_version: "${r1_v}" }
              as: FrontDeskStaff
              captures: { r1_asm: $.data.id }
          trigger:
            - call: "POST /family-planning/patients/${r1_id}/encounters"
              payload: { service_code: "STI_SCREEN", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encr_id: $.data.id }
          assert:
            - "HouseholdAssessment.${r1_asm}.fpl_pct == 174 and assigned_tier_code == \"C\""
            - "Encounter.${encr_id}.patient_charge_cents == 16667"
            - "Encounter.${encr_id}.patient_charge_cents != 16666 — floor applies to the discount, not the net"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: encounter_parallel_clinical_and_billing_dimensions
        grounds:
          - state_machines.Encounter
          - entities.Encounter.fields.clinical_status
          - entities.Encounter.fields.billing_status
        distinguishing_aspect: |
          Two independent state axes on ONE entity: clinical walks
          SCHEDULED -> IN_PROGRESS -> COMPLETED while billing stays UNBILLED, then
          billing walks UNBILLED -> CLAIMED -> SETTLED while clinical stays
          COMPLETED — neither axis blocks the other except at declared join points.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01, advanced to 2026-09-10T10:00:00Z before start."
            - "Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING fee 20000, licensed provider."
            - "Adult insured patient (POL-9), not confidential, DOCUMENTED household-1 income 2635500 (tier C: charge 10000, claim billed 10000)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "PB1", date_of_birth: "1991-01-01", insurance_policy_id: "POL-9" }
              as: FrontDeskStaff
              captures: { pb1_id: $.data.id, pb1_v: $.data.version }
            - call: "POST /family-planning/patients/${pb1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 2635500, income_basis: "DOCUMENTED", expected_patient_version: "${pb1_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${pb1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encp_id: $.data.id }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
          trigger:
            - call: "POST /family-planning/encounters/${encp_id}/start"
              payload: {}
              as: Clinician
              captures: { enc_s1: $.data.clinical_status }
            - call: "POST /family-planning/encounters/${encp_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${encp_id}/claims"
              payload: {}
              as: BillingSpecialist
              captures: { claimp_id: $.data.id }
            - call: "POST /family-planning/claims/${claimp_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /family-planning/claims/${claimp_id}/adjudicate"
              payload: { amount_cents: 10000 }
              as: BillingSpecialist
            - call: "POST /family-planning/claims/${claimp_id}/settle"
              payload: {}
              as: BillingSpecialist
              captures: { enc_final_billing: $.data.billing_status }
          assert:
            - "after start: Encounter.${encp_id}.clinical_status == IN_PROGRESS and billing_status == UNBILLED"
            - "after complete: clinical_status == COMPLETED and billing_status == UNBILLED (billing untouched by clinical axis)"
            - "after claim submit: clinical_status == COMPLETED and billing_status == CLAIMED (clinical untouched by billing axis)"
            - "Claim.${claimp_id}.status == PAID and net_receivable_cents == 0"
            - "final Encounter.${encp_id}.billing_status == SETTLED and clinical_status == COMPLETED"

      - name: claim_return_resubmit_cycle_with_round_cap
        grounds:
          - state_machines.Claim.SUBMITTED_to_RETURNED
          - state_machines.Claim.RETURNED_to_SUBMITTED
          - entities.Claim.fields.submission_round
          - errors.ERR_CLAIM_RESUBMISSION_EXHAUSTED
        distinguishing_aspect: |
          A true cycle on the Claim entity: SUBMITTED -> RETURNED -> SUBMITTED loops
          with submission_round incrementing 1 -> 2 -> 3, and the loop is CUT at
          round 3 — a cyclic machine with a termination condition, not a pipeline.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 -> 2026-09-10T10:00:00Z. Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING fee 20000, licensed provider."
            - "Adult insured non-confidential patient, tier C (charge 10000, billed 10000); encounter completed; claim created and submitted (round 1)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "CY1", date_of_birth: "1991-01-01", insurance_policy_id: "POL-CY" }
              as: FrontDeskStaff
              captures: { cy1_id: $.data.id, cy1_v: $.data.version }
            - call: "POST /family-planning/patients/${cy1_id}/household-assessments"
