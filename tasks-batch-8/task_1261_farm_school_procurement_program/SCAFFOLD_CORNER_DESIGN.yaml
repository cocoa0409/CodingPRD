scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: ent_program_year_create_defaults
        claim_type: defaults
        grounds: [entities.ProgramYear.fields.preference_model, entities.ProgramYear.fields.grant_drawn_cents]
        distinguishing_aspect: "Omitting preference_model applies the LINEAR default; server initializes grant_drawn_cents=0, status=DRAFT, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id, model: $.data.preference_model, drawn: $.data.grant_drawn_cents } }
          assert:
            - "ProgramYear.${yr}.preference_model == LINEAR (default applied)"
            - "ProgramYear.${yr}.grant_drawn_cents == 0 AND grant_remaining_cents == 1000000"
            - "ProgramYear.${yr}.status == DRAFT AND version == 1"

      - name: ent_farm_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.Farm.fields.acres, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /f2s/farms without required acres is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /f2s/farms", payload: { legal_name: "No Acres", contact_email: "n@x.com", distance_miles_to_hub: 30 }, as: DistrictProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: ent_offering_computed_fields_server_side
        claim_type: computed_fields
        grounds: [entities.FarmProductOffering.fields.is_local_eligible, entities.FarmProductOffering.fields.preference_points]
        distinguishing_aspect: "A farm at distance 150 beyond radius 100 yields is_local_eligible == false and preference_points == 0; the client cannot supply these fields (not in the input schema)."
        test_recipe:
          setup: ["OPEN year radius 100; ACTIVE product; APPROVED compliant farm at distance 150"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Far Away", contact_email: "f@x.com", distance_miles_to_hub: 150, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
          trigger:
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id, elig: $.data.is_local_eligible, pts: $.data.preference_points } }
          assert:
            - "FarmProductOffering.${off}.is_local_eligible == false (150 > 100)"
            - "FarmProductOffering.${off}.preference_points == 0"

      - name: ent_farms_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /f2s/farms]"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more per the fixed envelope: 3 farms, limit 2 -> 2 items, has_more true; offset 2 -> 1 item, has_more false."
        test_recipe:
          setup: ["three farms created"]
          setup_api_calls:
            - { call: "POST /f2s/farms", payload: { legal_name: "F1", contact_email: "1@x.com", distance_miles_to_hub: 10, acres: 50 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/farms", payload: { legal_name: "F2", contact_email: "2@x.com", distance_miles_to_hub: 20, acres: 60 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/farms", payload: { legal_name: "F3", contact_email: "3@x.com", distance_miles_to_hub: 30, acres: 70 }, as: DistrictProgramAdmin }
          trigger:
            - { call: "GET /f2s/farms", payload: { limit: 2, offset: 0 }, as: DistrictProgramAdmin }
            - { call: "GET /f2s/farms", payload: { limit: 2, offset: 2 }, as: DistrictProgramAdmin }
          assert:
            - "Page 1: exactly 2 items, total_count == 3, has_more == true"
            - "Page 2: exactly 1 item, total_count == 3, has_more == false"

      - name: ent_receiving_window_immutable_shape
        claim_type: immutability
        grounds: [entities.ReceivingWindow]
        distinguishing_aspect: "common_fields: false - the window response carries id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["one kitchen"]
          setup_api_calls:
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
          trigger:
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 3 }, as: KitchenManager, as_user_id: "${kit}", captures: { win: $.data.id } }
          assert:
            - "Response has id and created_at; no version field and no updated_at field present"
            - "ReceivingWindow.${win} readable via GET /f2s/receiving-windows/{id} with same shape"

      - name: ent_document_conditional_coverage_required
        claim_type: type_constraints
        grounds: [entities.ComplianceDocument.fields.coverage_cents, "errors[ERR_COVERAGE_REQUIRED]"]
        distinguishing_aspect: "coverage_cents is conditionally required: LIABILITY_INSURANCE without it fails ERR_COVERAGE_REQUIRED; SAFETY_CERT without it succeeds."
        test_recipe:
          setup: ["one farm"]
          setup_api_calls:
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
          trigger:
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}", captures: { err: $.data.error_id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}", captures: { doc: $.data.id } }
          assert:
            - "Insurance without coverage_cents: error_id == ERR_COVERAGE_REQUIRED"
            - "Safety cert without coverage_cents: created, ComplianceDocument.${doc} status == ACTIVE"

      - name: ent_document_invalid_date_range_rejected
        claim_type: type_constraints
        grounds: [entities.ComplianceDocument.fields.expires_on, "errors[ERR_INVALID_DATE_RANGE]"]
        distinguishing_aspect: "expires_on <= effective_on is a 400 ERR_INVALID_DATE_RANGE (strictly-greater required)."
        test_recipe:
          setup: ["one farm"]
          setup_api_calls:
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
          trigger:
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-06-01", expires_on: "2026-06-01" }, as: FarmManager, as_user_id: "${farm}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_DATE_RANGE (equal dates rejected; expiry must be strictly later)"

      - name: ent_offering_window_outside_season_rejected
        claim_type: type_constraints
        grounds: [entities.Product.fields.season_start_week, "errors[ERR_HARVEST_WINDOW_OUTSIDE_SEASON]"]
        distinguishing_aspect: "Offering harvest window must sit inside the product season, wraparound-aware: season 48..8 accepts window 50..5, while season 1..20 rejects 21..25."
        test_recipe:
          setup: ["OPEN year; products P1 (season 1..20) and P2 (wraparound season 48..8); APPROVED compliant farm"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod1: $.data.id } }
            - { call: "POST /f2s/products", payload: { name: "Kale", category: "PRODUCE", unit: "LB", season_start_week: 48, season_end_week: 8 }, as: DistrictProgramAdmin, captures: { prod2: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
          trigger:
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod1}", price_cents_per_unit: 250, max_weekly_quantity: 100, harvest_start_week: 21, harvest_end_week: 25 }, as: FarmManager, as_user_id: "${farm}", captures: { err: $.data.error_id } }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod2}", price_cents_per_unit: 250, max_weekly_quantity: 100, harvest_start_week: 50, harvest_end_week: 5 }, as: FarmManager, as_user_id: "${farm}", captures: { off2: $.data.id } }
          assert:
            - "Window 21..25 outside season 1..20: error_id == ERR_HARVEST_WINDOW_OUTSIDE_SEASON"
            - "Window 50..5 inside wraparound season 48..8: created (FarmProductOffering.${off2} exists)"

      - name: ent_not_found_family_across_resources
        claim_type: not_found
        grounds: ["errors[ERR_PROGRAM_YEAR_NOT_FOUND]", "errors[ERR_FARM_NOT_FOUND]", "errors[ERR_DOCUMENT_NOT_FOUND]", "errors[ERR_PRODUCT_NOT_FOUND]", "errors[ERR_OFFERING_NOT_FOUND]", "errors[ERR_FORECAST_LINE_NOT_FOUND]", "errors[ERR_KITCHEN_NOT_FOUND]", "errors[ERR_WINDOW_NOT_FOUND]", "errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_AMENDMENT_NOT_FOUND]", "errors[ERR_DELIVERY_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]", "errors[ERR_CLAIM_LINE_NOT_FOUND]", "errors[ERR_SUBSTITUTION_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET with a well-formed but absent UUID returns that resource's 404 error id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /f2s/program-years/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /f2s/farms/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /f2s/compliance-documents/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /f2s/products/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e4: $.data.error_id } }
            - { call: "GET /f2s/offerings/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e5: $.data.error_id } }
            - { call: "GET /f2s/forecast-lines/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e6: $.data.error_id } }
            - { call: "GET /f2s/kitchens/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e7: $.data.error_id } }
            - { call: "GET /f2s/receiving-windows/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e8: $.data.error_id } }
            - { call: "GET /f2s/planting-agreements/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e9: $.data.error_id } }
            - { call: "GET /f2s/agreement-amendments/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e10: $.data.error_id } }
            - { call: "GET /f2s/deliveries/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e11: $.data.error_id } }
            - { call: "GET /f2s/invoices/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e12: $.data.error_id } }
            - { call: "GET /f2s/reimbursement-claims/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e13: $.data.error_id } }
            - { call: "GET /f2s/claim-lines/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e14: $.data.error_id } }
            - { call: "GET /f2s/substitution-requests/00000000-0000-0000-0000-000000000000", payload: {}, as: DistrictProgramAdmin, captures: { e15: $.data.error_id } }
          assert:
            - "e1==ERR_PROGRAM_YEAR_NOT_FOUND, e2==ERR_FARM_NOT_FOUND, e3==ERR_DOCUMENT_NOT_FOUND, e4==ERR_PRODUCT_NOT_FOUND, e5==ERR_OFFERING_NOT_FOUND"
            - "e6==ERR_FORECAST_LINE_NOT_FOUND, e7==ERR_KITCHEN_NOT_FOUND, e8==ERR_WINDOW_NOT_FOUND, e9==ERR_AGREEMENT_NOT_FOUND, e10==ERR_AMENDMENT_NOT_FOUND"
            - "e11==ERR_DELIVERY_NOT_FOUND, e12==ERR_INVOICE_NOT_FOUND, e13==ERR_CLAIM_NOT_FOUND, e14==ERR_CLAIM_LINE_NOT_FOUND, e15==ERR_SUBSTITUTION_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_farm_initial_state_applied
        claim_type: initial_state
        grounds:
          - state_machines.Farm
        distinguishing_aspect: "A newly registered farm starts in APPLIED, not APPROVED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id, st: $.data.status } }
          assert:
            - "Farm.${farm}.status == APPLIED"

      - name: sm_invoice_revision_cycle_loop
        claim_type: valid_transition
        grounds:
          - state_machines.Invoice.SUBMITTED_to_REJECTED
          - state_machines.Invoice.REJECTED_to_DRAFT
        distinguishing_aspect: "Invoice supports the DRAFT->SUBMITTED->REJECTED->DRAFT revision loop and can be submitted a second time after rejection."
        test_recipe:
          setup: ["Standard chain through an ACCEPTED delivery (qty 40, price 250) and DRAFT invoice"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id } }
            - { call: "POST /f2s/offerings/${off}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 3 }, as: KitchenManager, as_user_id: "${kit}", captures: { win: $.data.id } }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off}", committed_quantity: 200, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /f2s/planting-agreements/${agr}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 40 }, as: FarmManager, as_user_id: "${farm}", captures: { del: $.data.id } }
            - { call: "POST /f2s/deliveries/${del}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del}/accept", payload: { accepted_quantity: 40 }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/invoices", payload: { delivery_id: "${del}", invoice_number: "INV-1" }, as: FarmManager, as_user_id: "${farm}", captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /f2s/invoices/${inv}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/invoices/${inv}/reject", payload: { reason: "missing signature" }, as: DistrictProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /f2s/invoices/${inv}/revise", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/invoices/${inv}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}", captures: { st: $.data.status } }
          assert:
            - "After reject+revise the invoice is DRAFT again, then SUBMITTED (second loop iteration succeeds)"
            - "Invoice.${inv}.status == SUBMITTED at the end"

      - name: sm_claim_compound_auto_derive_all_allowed
        claim_type: valid_transition
        grounds:
          - state_machines.ReimbursementClaim.UNDER_REVIEW_to_AWARDED
        distinguishing_aspect: "Compound derivation: when the last PENDING line is adjudicated and ALL lines are ALLOWED, the claim auto-flips to AWARDED and match_final_cents materializes (5200 for claimed 10200+200... here single line 10200 -> 5100)."
        test_recipe:
          setup: ["Claim UNDER_REVIEW with one line (claimed 10200 from invoice 40x250+200 incentive)"]
          setup_api_calls:
            - { call: "POST /f2s/program-years", payload: { school_year_label: "Y1", start_date: "2026-07-01", end_date: "2027-06-24", local_radius_miles: 100, preference_model: "TIERED", grant_award_cents: 1000000, local_spend_target_pct: 30 }, as: DistrictProgramAdmin, captures: { yr: $.data.id } }
            - { call: "POST /f2s/program-years/${yr}/open", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/products", payload: { name: "Tomato", category: "PRODUCE", unit: "LB", season_start_week: 1, season_end_week: 20 }, as: DistrictProgramAdmin, captures: { prod: $.data.id } }
            - { call: "POST /f2s/farms", payload: { legal_name: "Green Acres", contact_email: "g@x.com", distance_miles_to_hub: 30, acres: 100 }, as: DistrictProgramAdmin, captures: { farm: $.data.id } }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id } }
            - { call: "POST /f2s/offerings/${off}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
