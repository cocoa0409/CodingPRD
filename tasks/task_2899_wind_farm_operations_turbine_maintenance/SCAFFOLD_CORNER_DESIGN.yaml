            - call: "GET /wind-ops/service-agreements/${sa_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_read: $.data.error_id }
          assert:
            - "the farm create returns HTTP 403 with ${err_farm_create} == ERR_UNAUTHORIZED and no second farm exists"
            - "the scada-sync returns HTTP 403 with ${err_scada} == ERR_UNAUTHORIZED and Turbine.${t_id}.operating_hours is still 0"
            - "the settle returns HTTP 403 with ${err_settle} == ERR_UNAUTHORIZED and ServiceAgreement.${sa_id}.state is still ACTIVE, so SiteAdmin is not a superuser"
            - "the commercially restricted read returns HTTP 403 with ${err_read} == ERR_UNAUTHORIZED, so GET access is role-scoped"
      - name: start_and_complete_cannot_be_driven_by_the_wrong_crew_or_by_the_submitter
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=22]
          - validations[priority=24]
          - roles.CrewLead.identity
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_CREW_NOT_ASSIGNED]
        distinguishing_aspect: |
          CrewLead is entity-backed, so X-User-ID is a Crew id and ownership is a data comparison: a
          second crew's lead is refused with 24 while the engineer who submitted the order is refused
          with 22, and the two refusals fire on the same endpoint for different actors. Priority 22
          also outranks 24, and the order stays IN_PROGRESS through both refusals.
