              captures: { st_after: $.data.status }
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { states: $.data.authorized_state_codes }
          assert:
            - "${st_rev} == REVOKED"
            - "HTTP status is 409"
            - "${err} == ERR_ALREADY_TERMINAL"
            - "${st_after} == REVOKED"
            - "${states} == [] (empty array)"

      - name: second_relinquish_on_same_sponsorship_returns_already_terminal
        claim_type: idempotency
        grounds:
          - state_machines.SponsorshipTransfer.ACTIVE_to_RELINQUISHED
          - validations[priority=12]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: |
          RELINQUISHED is terminal for SponsorshipTransfer: the first relinquish stamps
          relinquished_at 2026-08-01T00:00:00Z and empties authorized_state_codes; the second
          returns 409 ERR_ALREADY_TERMINAL and does NOT re-stamp relinquished_at.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE CA licence and one ACTIVE SponsorshipTransfer
               (INST-0001, effective 2026-07-01) that has already been relinquished once at
               the clock instant 2026-08-01T00:00:00Z."
          setup_api_calls:
