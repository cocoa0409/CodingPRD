            - call: "POST /api/utility-connections/${cn16c}/schedule"
              payload: {}
              as: MunicipalClerk
              captures: { err16: $.data.error_id }
            - call: "POST /api/utility-connections/${cn16d}/schedule"
              payload: {}
              as: MunicipalClerk
              captures: { cn16d_st: $.data.status }
          assert:
            - "captured cn16a_st == SCHEDULED (used 0 < 2)"
            - "captured cn16b_st == SCHEDULED (used 1 < 2 — the slot becomes exactly full)"
            - "captured err16 == ERR_PROVIDER_CAPACITY_EXCEEDED (used 2 >= max 2 — boundary at exactly max)"
            - "captured cn16d_st == SCHEDULED (different calendar day, independent bucket)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: loan_balance_fund_reverse_conservation
        grounds:
          - calculations.loan_balance_reconciliation
          - state_machines.LoanDraw.APPROVED_to_FUNDED
          - state_machines.LoanDraw.FUNDED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity is money: outstanding_balance_cents == sum(net of FUNDED
          draws) - sum(payment_applied of CLOSED closings). Fund moves the balance to
          1890500 and its compensating reverse returns it to exactly 0 with
          total_drawn_cents also back at 0 — no drift.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; loan LN ACTIVE with commitment 20000000; draw DR REQUESTED with one line item 2000000 (net 1890500)"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P17", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p17: $.data.id }
            - call: "POST /api/parcels/${p17}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${p17}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${p17}", commitment_amount_cents: 20000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { ln17: $.data.id, bal0: $.data.outstanding_balance_cents }
            - call: "POST /api/development-loans/${ln17}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/loan-draws"
              payload: { loan_id: "${ln17}", line_items: [{ description: "grading", amount_cents: 2000000 }] }
              as: DeveloperOperator
              as_user_id: "dev-user-1"
              captures: { dr17: $.data.id }
            - call: "POST /api/loan-draws/${dr17}/approve"
              payload: {}
              as: LenderOfficer
              as_user_id: "lo-user-1"
          trigger:
            - call: "POST /api/loan-draws/${dr17}/fund"
              payload: {}
              as: LenderOfficer
              as_user_id: "lo-user-1"
            - call: "GET /api/development-loans/${ln17}"
              as: DeveloperOperator
              captures: { bal_funded: $.data.outstanding_balance_cents, drawn_funded: $.data.total_drawn_cents }
            - call: "POST /api/loan-draws/${dr17}/reverse"
              payload: {}
              as: LenderOfficer
              as_user_id: "lo-user-1"
            - call: "GET /api/development-loans/${ln17}"
              as: DeveloperOperator
              captures: { bal_reversed: $.data.outstanding_balance_cents, drawn_reversed: $.data.total_drawn_cents }
          assert:
            - "captured bal0 == 0"
            - "captured bal_funded == 1890500 and drawn_funded == 1890500 (net = 2000000 - 100000 retainage - 9500 fee)"
            - "captured bal_reversed == 0 and drawn_reversed == 0 (fund + reverse conserve the balance exactly)"
            - "draw status after reverse == REVERSED, excluded from the invariant sum"

      - name: lot_inventory_reserve_default_conservation
        grounds:
          - calculations.phase_lot_inventory
          - state_machines.Lot
          - state_machines.TakedownAgreement.ACTIVE_to_DEFAULTED
        distinguishing_aspect: |
          Conserved quantity is a count, not money: phase.recorded_lot_count ==
          PLATTED + RESERVED + UNDER_CONTRACT + CLOSED at all times. Reserving one lot
          moves the count between buckets, and the compensating declare-default release
          restores PLATTED to exactly the original 3 — the sum never changes.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; phase PH ACTIVE with 3 recorded lots; agreement AG ACTIVE (behind schedule at default clock)"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P18", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p18: $.data.id }
            - call: "POST /api/parcels/${p18}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${p18}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${p18}", phase_name: "PH", sequence_number: 1, planned_lot_count: 3, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ph18: $.data.id }
            - call: "POST /api/phases/${ph18}/submit-plat"
              payload: { plat_lot_count: 3, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph18}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${ph18}/record-plat"
              payload: {}
              as: MunicipalClerk
              captures: { rec18: $.data.recorded_lot_count }
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${ph18}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { bd18: $.data.id }
            - call: "POST /api/infrastructure-bonds/${bd18}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${bd18}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph18}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "B18 Co", license_number: "LIC-180", contact_email: "b18@x.com" }
              as: DeveloperOperator
              captures: { bldr18: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${p18}", builder_id: "${bldr18}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 3 }
              as: DeveloperOperator
              captures: { ag18: $.data.id }
            - call: "POST /api/takedown-agreements/${ag18}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${ph18}"
              as: DeveloperOperator
              captures: { lot18: $.data.0.id }
          trigger:
            - call: "POST /api/lots/${lot18}/reserve"
              payload: { agreement_id: "${ag18}" }
              as: BuilderRep
              as_user_id: "${bldr18}"
            - call: "GET /api/parcels/${p18}"
              as: DeveloperOperator
              captures: { avail_after_reserve: $.data.lots_available_count }
            - call: "POST /api/takedown-agreements/${ag18}/declare-default"
              payload: { reason: "behind schedule" }
              as: DeveloperOperator
            - call: "GET /api/parcels/${p18}"
              as: DeveloperOperator
              captures: { avail_after_default: $.data.lots_available_count }
            - call: "GET /api/phases/${ph18}"
              as: DeveloperOperator
              captures: { rec_after: $.data.recorded_lot_count }
          assert:
            - "captured rec18 == 3"
            - "captured avail_after_reserve == 2 (3 PLATTED -> 2 PLATTED + 1 RESERVED; sum still 3)"
            - "captured avail_after_default == 3 (reserve + default-release conserve the PLATTED count exactly)"
            - "captured rec_after == 3 (inventory invariant: recorded == PLATTED + RESERVED + UNDER_CONTRACT + CLOSED == 3 + 0 + 0 + 0)"
