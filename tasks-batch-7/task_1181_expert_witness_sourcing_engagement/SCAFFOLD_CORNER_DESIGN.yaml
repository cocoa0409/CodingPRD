            - { call: "POST /litigation/engagement-requests/${rcn}/credential-reviews", payload: { expert_id: "${ecn}" }, as: CredentialAnalyst, captures: { crcn: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${crcn}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${rcn}", expert_id: "${ecn}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { gcn: $.data.id } }
            - { call: "POST /litigation/engagements/${gcn}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${gcn}/sign", payload: {}, as: Expert, as_user_id: "${ecn}" }
            - { call: "POST /litigation/engagements/${gcn}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { gcn_v: $.data.version } }
          trigger:
            - call: "POST /litigation/engagements/${gcn}/amend"
              payload: { expected_engagement_version: "${gcn_v}", hourly_rate_cents: 55000, reason: "uplift" }
