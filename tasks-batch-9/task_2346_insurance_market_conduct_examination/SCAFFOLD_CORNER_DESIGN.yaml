      - name: the_clock_sweep_flags_an_overdue_data_call_which_can_still_be_answered
        claim_type: valid_transition
        grounds:
          - state_machines.DataCall
          - calculations.data_call_completeness
          - endpoints[POST /market-conduct/_clock/set_current_utc]
          - endpoints[GET /market-conduct/data-calls/{id}]
        distinguishing_aspect: |
          ISSUED -> OVERDUE has no business endpoint at all: it is produced by the clock endpoint's
          sweep, which reports how many calls it flagged. OVERDUE is not terminal, so the carrier can
          still produce: one day late costs 0.5 points of completeness, leaving 99.50, which still clears
          the 95.00 acceptance gate.
        test_recipe:
          setup:
            - "AURORA carrier; ON_SITE examination, CLAIMS area (population 4000, sample 10), scope locked, one ISSUED data call for 4000 records due 2026-09-15."
            - "Logical clock at 2026-08-01T00:00:00Z."
