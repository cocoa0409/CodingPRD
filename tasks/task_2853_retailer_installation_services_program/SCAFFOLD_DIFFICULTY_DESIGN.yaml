# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2853 — Retailer Installation Services Program
#
# Nine §0.5 Difficulty Rules, each with >= 2 instances honouring its own
# differentiation clause. Every `grounds:` entry resolves into SCAFFOLD.yaml
# §1.1-§1.7; every `setup_api_calls` / `trigger` entry is a structured call
# against a §1.5 endpoint; every ${var} is bound by an earlier `captures:`;
# every formula-derived assert below was computed by executing the §1.3
# formula in Python against its pinned `constants:`.
#
# The server's logical clock starts at exactly 2026-08-01T00:00:00.000Z
# (§1.5 POST /_clock/set_current_utc), so chains that need no time travel
# make no clock call at all.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two calculations on DIFFERENT entity domains: project money (Project) and
  # network risk scoring (Installer).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: project_labor_charge_provisional_versus_final_diverge_on_same_project
        grounds:
          - calculations.project_labor_charge
          - calculations.project_total_due
          - entities.Project.fields.quoted_labor_cents
          - entities.Project.fields.final_labor_cents
          - entities.Project.fields.effective_units
          - entities.Measurement.fields.measured_units
          - state_machines.Project.fulfillment_status.IN_PROGRESS_to_INSTALL_COMPLETE
          - state_machines.Project.financial_status.DEPOSIT_HELD_to_BALANCE_DUE
        distinguishing_aspect: |
          This instance's variant pair lives in the PROJECT MONEY domain: the
          PROVISIONAL variant is frozen from estimated_units at sale time into
          Project.quoted_labor_cents (196673) while the FINAL variant is
          recomputed from measured_units plus site surcharges at completion into
          Project.final_labor_cents (253942), so the two variants differ by
          exactly 57269 cents on one and the same Project row.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-LVP: base_labor_rate_cents_per_unit 425, minimum_billable_units 150.00, measurement_required true, permit_policy BY_JURISDICTION, deposit_pct 0.30, ACTIVE."
            - "Jurisdiction METRO-01: permit_required_trades [FLOORING, HVAC, ROOFING], permit_unit_threshold 250.00, permit_responsible_party RETAILER, labor_complexity_multiplier 1.15, min_liability_coverage_cents 100000000, background_check_recency_days 365, license_required true, inspection_required true, inspection_lead_days 3, max_concurrent_inspections 2, ACTIVE."
            - "One Installer ACTIVE with a VERIFIED FLOORING credential in METRO-01, background_check_result PASS completed 2026-07-15, liability_coverage_cents 200000000, insurance_expires_on 2027-06-30."
            - "One Project on that category and jurisdiction with estimated_units 420.00: quoted_labor_cents 196673, deposit_required_cents 59002, fulfillment_status MEASURE_PENDING, permit_status PENDING_APPLICATION, permit_responsibility RETAILER."
            - "Deposit of 59002 taken, so financial_status DEPOSIT_HELD and deposit_held_cents 59002."
            - "Measurement COMPLETED at 2026-08-05T09:00:00.000Z with measured_units 468.00, subfloor_condition MAJOR, obstruction_count 3, stair_flight_count 2, so variance_pct 11.43 and a MEASUREMENT_VARIANCE ChangeOrder was auto-created and ACCEPTED."
            - "Permit APPLIED then ISSUED with permit_fee_cents 18500."
            - "MaterialDelivery PLANNED with promised_window_end 2026-08-24T08:00:00.000Z and material_cost_cents 250000."
            - "InstallerAssignment CONFIRMED then IN_PROGRESS for the window [2026-08-25T08:00:00.000Z, 2026-08-25T16:00:00.000Z)."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, quoted_at_sale: $.data.quoted_labor_cents }
            - call: "POST /projects/${proj_id}/deposit"
              payload: { amount_cents: 59002 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /projects/${proj_id}/measurements"
              payload: { scheduled_at: "2026-08-05T09:00:00.000Z", technician_name: "Tom Vale" }
              as: ProjectCoordinator
              captures: { meas_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /measurements/${meas_id}/complete"
              payload: { measured_units: 468.00, subfloor_condition: "MAJOR", obstruction_count: 3, stair_flight_count: 2, access_notes: "Rear stair access, two flights" }
              as: ProjectCoordinator
            - call: "GET /change-orders"
              payload: { project_id: "${proj_id}", origin: "MEASUREMENT_VARIANCE" }
              as: ProjectCoordinator
              captures: { vco_id: "$.data[0].id", vco_upcharge: "$.data[0].upcharge_cents" }
            - call: "POST /change-orders/${vco_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /projects/${proj_id}/permit/apply"
              payload: { permit_application_reference: "PA-2026-0001" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/permit/issue"
              payload: { permit_fee_cents: 18500, permit_issued_on: "2026-08-10T00:00:00.000Z" }
              as: ProjectCoordinator
            - call: "POST /projects/${proj_id}/material-deliveries"
              payload: { promised_window_start: "2026-08-22T08:00:00.000Z", promised_window_end: "2026-08-24T08:00:00.000Z", sku_count: 6, material_cost_cents: 250000 }
              as: ProjectCoordinator
              captures: { deliv_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectCoordinator
              captures: { pv_before_assign: $.data.version }
            - call: "POST /installer-assignments"
              payload: { project_id: "${proj_id}", installer_id: "${inst_id}", window_start: "2026-08-25T08:00:00.000Z", window_end: "2026-08-25T16:00:00.000Z", expected_project_version: "${pv_before_assign}" }
              as: ProjectCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /installer-assignments/${asg_id}/confirm"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T08:00:00.000Z" }
              as: ProgramAdmin
            - call: "POST /installer-assignments/${asg_id}/start"
              payload: {}
              as: Installer
              as_user_id: "${inst_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T15:30:00.000Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /installer-assignments/${asg_id}/complete"
              payload: { completed_at: "2026-08-25T15:30:00.000Z" }
              as: Installer
              as_user_id: "${inst_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectCoordinator
          assert:
            - "Project.${proj_id}.quoted_labor_cents == 196673"
            - "Project.${proj_id}.final_labor_cents == 253942"
            - "Project.${proj_id}.final_labor_cents - Project.${proj_id}.quoted_labor_cents == 57269"
            - "Project.${proj_id}.effective_units == 468.00"
            - "Project.${proj_id}.change_order_upcharge_cents == 0"
            - "Project.${proj_id}.permit_fee_cents_billed == 18500"
            - "Project.${proj_id}.total_due_cents == 272442"
            - "Project.${proj_id}.deposit_applied_cents == 59002"
            - "Project.${proj_id}.deposit_held_cents == 0"
            - "Project.${proj_id}.balance_due_cents == 213440"
            - "Project.${proj_id}.financial_status == BALANCE_DUE"
            - "Project.${proj_id}.fulfillment_status == INSTALL_COMPLETE"
            - "InstallerAssignment.${asg_id}.on_time == true"

      - name: installer_scorecard_rolling_window_versus_lifetime_decay_diverge
        grounds:
          - calculations.installer_scorecard
          - entities.Installer.fields.composite_score
          - entities.Installer.fields.lifetime_composite_score
          - entities.Installer.fields.rolling_event_count
          - entities.Installer.fields.rolling_no_show_count
          - entities.ScorecardEvent.fields.occurred_at
          - endpoints[GET /installers/{id}/scorecard]
        distinguishing_aspect: |
          This instance's variant pair lives in the INSTALLER RISK-SCORING domain
          (not the money domain of the other instance): over one identical set of
          six ScorecardEvent rows the ROLLING_90D variant sees only the three
          events inside the 90-day window and yields composite_score 79.60, while
          the LIFETIME_DECAYED variant sees all six attenuated by their age bands
          and yields lifetime_composite_score 72.16 — and only the 79.60 value
          gates PROBATION, so the installer stays ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z, so the rolling window opens at 2026-05-03T00:00:00.000Z inclusive."
            - "Jurisdiction METRO-01 registered."
            - "One Installer promoted all the way to ACTIVE (credential VERIFIED plus background_check_result PASS), so its five score fields sit at the 85.00 baseline and removal_eligible is false."
            - "Five MANUAL ScorecardEvent rows already filed: ON_TIME_COMPLETION 2026-07-01 (age 31 d, in window), LATE_COMPLETION 2026-06-15 (age 47 d, in window), PUNCH_MAJOR 2026-05-03 (age exactly 90 d, in window), CSAT_SURVEY csat 2 on 2026-05-02 (age 91 d, outside, decay 0.60), WARRANTY_UPHELD 2026-01-15 (age 198 d, outside, decay 0.60)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /installers"
              payload: { legal_name: "Northside Flooring LLC", contact_email: "ops@northside.example", primary_trade_code: "FLOORING", liability_coverage_cents: 200000000, insurance_expires_on: "2027-06-30T00:00:00.000Z" }
              as: NetworkManager
              captures: { inst_id: $.data.id }
            - call: "POST /installers/${inst_id}/credentials"
              payload: { jurisdiction_id: "${jur_id}", trade_code: "FLOORING", license_number: "FL-99213", license_expires_on: "2027-05-31T00:00:00.000Z", permit_pulling_authorized: true }
              as: NetworkManager
              captures: { cred_id: $.data.id }
            - call: "POST /installer-credentials/${cred_id}/verify"
              payload: { verification_decision: "VERIFY" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/background-check"
              payload: { result: "PASS", completed_at: "2026-07-15T00:00:00.000Z" }
              as: NetworkManager
            - call: "POST /installers/${inst_id}/activate"
              payload: {}
              as: NetworkManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "ON_TIME_COMPLETION", occurred_at: "2026-07-01T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "LATE_COMPLETION", occurred_at: "2026-06-15T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "PUNCH_MAJOR", occurred_at: "2026-05-03T00:00:00.000Z" }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "CSAT_SURVEY", occurred_at: "2026-05-02T00:00:00.000Z", csat_score: 2 }
              as: ServiceManager
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "WARRANTY_UPHELD", occurred_at: "2026-01-15T00:00:00.000Z" }
              as: ServiceManager
          trigger:
            - call: "POST /installers/${inst_id}/scorecard-events"
              payload: { event_type: "NO_SHOW", occurred_at: "2025-03-10T00:00:00.000Z" }
              as: ServiceManager
              captures: { e6_quality_delta: $.data.quality_delta }
            - call: "GET /installers/${inst_id}/scorecard"
              payload: {}
              as: NetworkManager
          assert:
            - "Installer.${inst_id}.quality_score == 79.00"
            - "Installer.${inst_id}.timeliness_score == 81.00"
            - "Installer.${inst_id}.satisfaction_score == 79.00"
            - "Installer.${inst_id}.composite_score == 79.60"
            - "Installer.${inst_id}.lifetime_composite_score == 72.16"
            - "Installer.${inst_id}.composite_score != Installer.${inst_id}.lifetime_composite_score"
            - "Installer.${inst_id}.rolling_event_count == 3"
            - "Installer.${inst_id}.rolling_no_show_count == 0"
            - "Installer.${inst_id}.removal_eligible == false"
            - "Installer.${inst_id}.status == ACTIVE"
            - "GET /installers/{id}/scorecard response: rolling_composite_score == 79.60 AND lifetime_composite_score == 72.16 AND rolling_event_count == 3 AND lifetime_event_count == 6 AND probation_active == false"
            - "ScorecardEvent created by the trigger has quality_delta == -4.00, timeliness_delta == -20.00, satisfaction_delta == -10.00 and source == SYSTEM is FALSE (source == MANUAL)"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Three instances in three DIFFERENT modes: (a) >= 3 inputs interacting
  # non-linearly, (b) nested rounding where the order changes the answer,
  # (c) a circular-looking waiver ladder with a pinned evaluation order.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: labor_charge_tier_ladder_times_surcharges_times_multiplier_non_linear
        grounds:
          - calculations.project_labor_charge
          - calculations.change_order_upcharge
          - entities.ServiceCategory.fields.base_labor_rate_cents_per_unit
          - entities.Jurisdiction.fields.labor_complexity_multiplier
          - entities.Measurement.fields.subfloor_condition
          - entities.Measurement.fields.obstruction_count
          - entities.Measurement.fields.stair_flight_count
          - state_machines.Measurement.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          MODE (a): five independent inputs — measured_units 520.00 (which
          straddles all three marginal tiers), subfloor_condition MINOR (a
          percentage OF the tiered base, not of the units), obstruction_count 1,
          stair_flight_count 0 and labor_complexity_multiplier 1.15 (applied once
          to base+surcharge) — combine non-linearly: the correct answer 252714
          differs from the flat-rate reading 266444, from multiplying before the
          surcharges 251179, and from taking the subfloor percentage off the
          multiplied base 252436.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-LVP with base_labor_rate_cents_per_unit 425, minimum_billable_units 150.00, measurement_required true, permit_policy BY_JURISDICTION, deposit_pct 0.30."
            - "Jurisdiction METRO-01 with labor_complexity_multiplier 1.15, permit_unit_threshold 250.00, permit_required_trades containing FLOORING, permit_responsible_party RETAILER."
            - "One Project with estimated_units 420.00, so quoted_labor_cents is frozen at 196673 (PROVISIONAL) and fulfillment_status is MEASURE_PENDING."
            - "One Measurement SCHEDULED for that project."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/measurements"
              payload: { scheduled_at: "2026-08-05T09:00:00.000Z", technician_name: "Tom Vale" }
              as: ProjectCoordinator
              captures: { meas_id: $.data.id }
          trigger:
            - call: "POST /measurements/${meas_id}/complete"
              payload: { measured_units: 520.00, subfloor_condition: "MINOR", obstruction_count: 1, stair_flight_count: 0 }
              as: ProjectCoordinator
              captures: { variance: $.data.variance_pct }
            - call: "GET /change-orders"
              payload: { project_id: "${proj_id}", origin: "MEASUREMENT_VARIANCE" }
              as: ProjectCoordinator
          assert:
            - "Measurement.${meas_id}.variance_pct == 23.81"
            - "Measurement.${meas_id}.change_order_triggered == true"
            - "Project.${proj_id}.effective_units == 520.00"
            - "Project.${proj_id}.quoted_labor_cents == 196673"
            - "GET /change-orders response: data[0].origin == MEASUREMENT_VARIANCE AND data[0].upcharge_cents == 56041"
            - "The disclosed FINAL charge is therefore 196673 + 56041 == 252714"
            - "upcharge_cents != 69771 (the flat-rate 266444 reading), != 54506 (multiplier-before-surcharge 251179) and != 55763 (subfloor-on-multiplied-base 252436)"
            - "Project.${proj_id}.fulfillment_status == CHANGE_PENDING"
            - "Project.${proj_id}.permit_status == PENDING_APPLICATION"

      - name: change_order_line_rounding_order_shifts_upcharge_by_one_cent
        grounds:
          - calculations.change_order_upcharge
          - entities.ChangeOrder.fields.lines
          - entities.ChangeOrder.fields.upcharge_cents
          - entities.ChangeOrder.fields.net_primary_units_delta
          - concurrency_rules[change-order-create-stale-project]
          - validations[priority=28]
        distinguishing_aspect: |
          MODE (b): nested rounding where the ORDER decides the answer — rounding
          each of the three lines to whole cents first and then adding gives
          3108 + 3108 + 4330 == 10546, while summing the raw decimals
          3108.45 + 3108.45 + 4329.888 == 10546.788 and rounding once gives 10547;
          the one-cent gap is the only observable of the pinned order.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00.000Z."
            - "ServiceCategory FLOOR-DIRECT: base_labor_rate_cents_per_unit 425, minimum_billable_units 150.00, measurement_required false, permit_policy NEVER, deposit_pct 0.30."
            - "Jurisdiction METRO-01 with labor_complexity_multiplier 1.15."
            - "One Project with estimated_units 420.00 that therefore starts at fulfillment_status MEASURED, permit_status NOT_REQUIRED, financial_status QUOTED, quoted_labor_cents 196673, version 1."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-01", name: "Metro County", permit_required_trades: ["FLOORING", "HVAC", "ROOFING"], permit_responsible_party: "RETAILER", inspection_required: true, min_liability_coverage_cents: 100000000, permit_unit_threshold: 250.00, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.15, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, pv1: $.data.version }
          trigger:
            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "CUSTOMER_REQUEST", lines: [{ unit_kind: "PRIMARY_UNITS", units_delta: 6.00 }, { unit_kind: "PRIMARY_UNITS", units_delta: 6.00 }, { unit_kind: "TRIM_LINEAR_FT", units_delta: 12.00 }], expected_project_version: "${pv1}" }
              as: ProjectCoordinator
              captures: { co_id: $.data.id, co_upcharge: $.data.upcharge_cents }
