# =============================================================================
# Scaffold: Digital Small-Business Instant Quote & Certificate Self-Service
# (Next Insurance class product)
# =============================================================================

scenario: |
  Digital Small-Business Instant Quote & Certificate Self-Service (Next Insurance): class of business determination from a plain-language description with appetite filtering, instant quote and bind with limited underwriting questions and automated risk signals, certificate of insurance self-generation with additional insured endorsements issued on demand, coverage adjustment mid-term as the business changes with premium proration, industry-specific packages combining general liability, professional liability and tools coverage, claims intake with photo evidence and rapid triage, agent and partner channel embedding through interfaces on platforms where businesses already operate, non-renewal and appetite change communication

domain_name: digital-small-business-instant-quote
api_prefix: /ins

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AppetiteRule
    parent: null
    common_fields: true
    fields:
      - { name: keyword, type: string, source: input, description: "Lowercase keyword matched against the applicant's plain-language description" }
      - { name: class_code, type: string, source: input, description: "FK -> ClassCode.id; class of business admitted when the keyword matches" }
      - { name: disposition, type: enum, source: input, description: "ADMIT | REFER | DECLINE — appetite decision for this keyword; constraints: exactly one of the three values" }
      - { name: effective_from, type: datetime, source: input, description: "Rule active from this ISO8601 instant (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Rule active until this ISO8601 instant (exclusive); must be strictly after effective_from" }
      - { name: is_enabled, type: boolean, source: input, default: true, description: "Disabled rules never match" }
      - { name: priority_rank, type: integer, source: input, description: "Lower wins on keyword-match ties; ties on (keyword, priority_rank) break by created_at ASC" }

  - name: ClassCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Industry class code, unique (e.g. '91341')" }
      - { name: description, type: string, source: input, description: "Human-readable industry description" }
      - { name: eligible_lines, type: array, source: input, description: "Ordered array of line ids from {GL, PL, TOOLS} this class may purchase" }
      - { name: base_rates_cents, type: object, source: input, description: "Map of line -> base rate per exposure unit in cents; keys must equal eligible_lines members" }
      - { name: risk_factor, type: number, source: input, description: "Class multiplier applied to premium; constraints: >= 0.25 and <= 4.00" }
      - { name: appetite_active, type: boolean, source: input, default: true, description: "When false the class is off-appetite: new quotes decline, in-force policies in this class become non-renewable" }

  - name: BusinessAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal business name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email, unique" }
      - { name: channel, type: enum, source: input, description: "DIRECT | AGENT | PARTNER — acquisition channel" }
      - { name: partner_tenant, type: string, source: input, description: "Partner platform tenant slug; required iff channel == PARTNER, otherwise null" }
      - { name: account_credit_cents, type: integer, source: computed, description: "Monetary credit pool from downgrades/cancellations; floors at 0" }
      - { name: open_claim_count, type: integer, source: computed, description: "Count of claims with status in {SUBMITTED, IN_REVIEW, APPROVED}" }
      - { name: claims_free_flag, type: boolean, source: computed, description: "True iff open_claim_count == 0 AND no claim ever reached PAID for this account" }

  - name: RiskSignalReport
    parent: null
    common_fields: true
    fields:
      - { name: business_account_id, type: string, source: input, description: "FK -> BusinessAccount.id; report subject" }
      - { name: signal_type, type: enum, source: input, description: "SOS_MATCH | PROPERTY_PIN | LOSS_HISTORY | FRAUD_SCREEN" }
      - { name: severity, type: integer, source: input, description: "1..100; feeds automated risk scoring" }
      - { name: status, type: enum, source: system, description: "PENDING | APPLIED | STALE" }
      - { name: detail, type: string, source: input, description: "Analyst-readable payload" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: business_account_id, type: string, source: input, description: "FK -> BusinessAccount.id; quoting account" }
      - { name: channel_partner_id, type: string, source: input, description: "Required iff account.channel == PARTNER (embedded quote), else null" }
      - { name: class_code_id, type: string, source: computed, description: "FK -> ClassCode.id; resolved by class-of-business determination, never client-supplied" }
      - { name: raw_description, type: string, source: input, description: "Plain-language business description used for classification" }
      - { name: selected_lines, type: array, source: input, description: "Subset of class eligible_lines the applicant wants; at least one required" }
      - { name: exposure_units, type: integer, source: input, description: "Gross exposure units (e.g. revenue blocks); constraints: >= 0" }
      - { name: requested_effective_at, type: datetime, source: input, description: "Requested coverage start; must be >= current clock instant" }
      - { name: uw_answers, type: object, source: input, description: "Map of underwriting question id -> answer; limited question set required by class" }
      - { name: risk_score, type: integer, source: computed, description: "0..100 automated risk score from signals + answers + class factor" }
      - { name: annual_premium_cents, type: integer, source: computed, description: "Provisional premium at quote time (variant: provisional)" }
      - { name: premium_basis_hash, type: string, source: computed, description: "Fingerprint of inputs (class, lines, exposure, answers, signal set) used for staleness detection" }
      - { name: status, type: enum, source: system, description: "CLASSIFYING | QUOTED | REFERRED | DECLINED | EXPIRED | BOUND | SUPERSEDED" }
      - { name: expires_at, type: datetime, source: computed, description: "Current clock + 168 hours; quote expires after this instant" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; bound quote" }
      - { name: business_account_id, type: string, source: system, description: "FK -> BusinessAccount.id; policyholder" }
      - { name: class_code_id, type: string, source: system, description: "FK -> ClassCode.id; bound class" }
      - { name: term_start, type: datetime, source: system, description: "Coverage start (= bound quote requested_effective_at)" }
      - { name: term_end, type: datetime, source: system, description: "term_start + 365 days" }
      - { name: term_day_count, type: integer, source: system, description: "365; proration denominator" }
      - { name: exposure_units, type: integer, source: system, description: "Bound exposure; baseline for mid-term adjustments" }
      - { name: base_annual_premium_cents, type: integer, source: system, description: "FINAL variant premium frozen at bind" }
      - { name: earned_premium_cents, type: integer, source: computed, description: "Premium earned pro-rata through the current clock day" }
      - { name: open_claim_count, type: integer, source: computed, description: "Claims on this policy with status in {SUBMITTED, IN_REVIEW, APPROVED}" }
      - { name: renewal_window_start, type: datetime, source: computed, description: "term_end - 120 days" }
      - { name: non_renewal_notice_sent_at, type: datetime, source: system, description: "Set when non-renewal notice issued; null otherwise" }
      - { name: status, type: enum, source: system, description: "BOUND | ACTIVE | CANCELLED | EXPIRED | NON_RENEWAL_PENDING | NON_RENEWED | RENEWED" }

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; endorsed policy" }
      - { name: endorsement_type, type: enum, source: input, description: "COVERAGE_ADJUST | ADDITIONAL_INSURED | LIMIT_CHANGE | CLASS_RECODE" }
      - { name: effective_at, type: datetime, source: input, description: "Endorsement effective instant; constraints: >= policy term_start day 00:00:00Z, <= current clock day end" }
      - { name: new_exposure_units, type: integer, source: input, description: "For COVERAGE_ADJUST: absolute replacement exposure; constraints: >= 0" }
      - { name: added_lines, type: array, source: input, description: "Lines added by this endorsement (must be eligible for policy class, not already in-force)" }
      - { name: removed_lines, type: array, source: input, description: "Lines removed by this endorsement (must be in-force, at least one line must remain across GL/PL/TOOLS union)" }
      - { name: ai_holder_name, type: string, source: input, description: "For ADDITIONAL_INSURED: certificate holder legal name" }
      - { name: premium_delta_cents, type: integer, source: computed, description: "Signed mid-term premium delta; negative yields account credit" }
      - { name: status, type: enum, source: system, description: "DRAFT | EFFECTIVE | VOID" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; certified policy" }
      - { name: endorsement_id, type: string, source: input, description: "FK -> Endorsement.id; the ADDITIONAL_INSURED endorsement this certificate evidences" }
      - { name: holder_name, type: string, source: system, description: "Copied from endorsement.ai_holder_name at issuance" }
      - { name: issued_at, type: datetime, source: system, description: "Issuance instant (server clock)" }
      - { name: certificate_no, type: string, source: system, description: "Sequential display number per policy: CERT-<policy ordinal>-<n>" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOIDED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; claimed policy" }
      - { name: reported_by, type: string, source: system, description: "FK -> BusinessAccount.id of the reporting account" }
      - { name: loss_occurred_at, type: datetime, source: input, description: "Loss instant; constraints: within [term_start, min(term_end, clock)] and within 30 days of intake" }
      - { name: description, type: string, source: input, description: "Loss narrative" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Claimed amount; constraints: >= 100" }
      - { name: triage_tier, type: enum, source: computed, description: "FAST_TRACK | STANDARD | COMPLEX — from amount and evidence count" }
      - { name: evidence_count, type: integer, source: computed, description: "Count of photo evidence items attached" }
      - { name: adjuster_owner, type: string, source: system, description: "Opaque adjuster user id once triaged to COMPLEX or IN_REVIEW" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | IN_REVIEW | APPROVED | PAID | DENIED | CLOSED" }

  - name: ClaimEvidence
    parent: null
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; evidence target" }
      - { name: photo_ref, type: string, source: input, description: "Opaque storage reference to the photo" }
      - { name: exif_taken_at, type: datetime, source: input, description: "EXIF capture instant; constraints: <= claim intake instant (clock)" }
      - { name: file_size_bytes, type: integer, source: input, description: "Constraints: >= 1024 and <= 10485760 (10MB)" }

  - name: UnderwriterReferral
    parent: null
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; referred quote" }
      - { name: assigned_underwriter, type: string, source: system, description: "Opaque underwriter user id" }
      - { name: decision, type: enum, source: system, description: "PENDING | APPROVED | DECLINED" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }

  - name: NonRenewalNotice
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; non-renewed policy" }
      - { name: reason_code, type: enum, source: input, description: "APPETITE_CHANGE | RISK_ESCALATION | CARRIER_WITHDRAWAL" }
      - { name: sent_at, type: datetime, source: system, description: "Notice issuance instant (clock)" }
      - { name: days_before_term_end, type: integer, source: computed, description: "Whole days between sent_at day and term_end day; constraints: >= 45 for APPETITE_CHANGE, >= 60 for CARRIER_WITHDRAWAL, >= 30 for RISK_ESCALATION" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor (opaque ids permitted)" }
      - { name: entity_type, type: string, source: system, description: "Entity name of the mutated resource" }
      - { name: entity_id, type: string, source: system, description: "FK -> mutated resource id (polymorphic across all common_fields entities)" }
      - { name: action, type: string, source: system, description: "Transition or mutation name" }
      - { name: before_snapshot, type: object, source: system, description: "Pre-mutation field values relevant to the action" }
      - { name: after_snapshot, type: object, source: system, description: "Post-mutation field values relevant to the action" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Quote
    field: status
    initial_state: CLASSIFYING
    terminal_states: [DECLINED, EXPIRED, BOUND, SUPERSEDED]
    transitions:
      - from: CLASSIFYING
        to: QUOTED
        trigger: "system (class-of-business determination completed within POST /ins/quotes; exactly one appetite-admitted class matched)"
        actor: system
        preconditions:
          - "Exactly one ClassCode admitted by appetite filtering with appetite_active == true"
          - "risk_score < 60"
          - "All required underwriting questions for the class answered in uw_answers"
        side_effects:
          - "Compute premium (provisional variant) into Quote.annual_premium_cents"
          - "Set Quote.expires_at = clock + 168 hours"
          - "Mark all PENDING RiskSignalReports for the account APPLIED"
      - from: CLASSIFYING
        to: REFERRED
        trigger: "system (risk_score >= 60 and < 85, or any appetite match disposition == REFER)"
        actor: system
        preconditions: []
        side_effects:
          - "Create UnderwriterReferral with status OPEN, decision PENDING"
      - from: CLASSIFYING
        to: DECLINED
        trigger: "system (no admitted class, matched class appetite_active == false, or risk_score >= 85)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REFERRED
        to: QUOTED
        trigger: "POST /ins/referrals/{id}/approve"
        actor: Underwriter
        preconditions:
          - "Referral status == OPEN"
          - "Quote expires_at > current clock"
        side_effects:
          - "Referral decision = APPROVED, status = RESOLVED"
          - "Compute premium (provisional variant)"
          - "Set Quote.expires_at = clock + 168 hours"
      - from: REFERRED
        to: DECLINED
        trigger: "POST /ins/referrals/{id}/decline"
        actor: Underwriter
        preconditions: ["Referral status == OPEN"]
        side_effects: ["Referral decision = DECLINED, status = RESOLVED"]
      - from: QUOTED
        to: BOUND
        trigger: "POST /ins/quotes/{id}/bind"
        actor: Policyholder
        preconditions:
          - "Quote.status == QUOTED"
          - "current clock < Quote.expires_at"
          - "premium_basis_hash unchanged since quote issuance (no new APPLIED signals, no class/answer mutation)"
          - "X-User-ID == quote.business_account_id (Policyholder binding own quote)"
          - "expected_quote_version matches current Quote.version (OCC)"
        side_effects:
          - "Recompute premium with FINAL variant; freeze as Policy.base_annual_premium_cents"
          - "Create Policy with status BOUND (auto-ACTIVE when clock reaches term_start)"
          - "Quote.version increments by 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "system (clock >= Quote.expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: SUPERSEDED
        trigger: "POST /ins/quotes (a newer quote for the same business_account_id reaches QUOTED or REFERRED)"
        actor: system
        preconditions: ["Prior quote still in QUOTED (not yet bound)"]
        side_effects: []

  - entity: Policy
    field: status
    initial_state: BOUND
    terminal_states: [CANCELLED, EXPIRED, NON_RENEWED, RENEWED]
    transitions:
      - from: BOUND
        to: ACTIVE
        trigger: "system (clock reaches term_start)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [BOUND, ACTIVE]
        to: CANCELLED
        trigger: "POST /ins/policies/{id}/cancel"
        actor: Policyholder
        preconditions:
          - "Policy.status in {BOUND, ACTIVE}"
          - "Policy.open_claim_count == 0"
          - "X-User-ID == policy.business_account_id"
        side_effects:
          - "Compute short-rate cancellation credit into BusinessAccount.account_credit_cents"
          - "Void all Certificate rows with status ISSUED for this policy -> VOIDED"
          - "Cascade: void all Endorsement rows with status DRAFT for this policy -> VOID"
      - from: ACTIVE
        to: NON_RENEWAL_PENDING
        trigger: "POST /ins/policies/{id}/non-renewal-notices"
        actor: ComplianceOfficer
        preconditions:
          - "Policy.status == ACTIVE"
          - "current clock >= Policy.renewal_window_start"
          - "days_before_term_end >= statutory minimum for reason_code"
          - "Policy.non_renewal_notice_sent_at is null"
        side_effects:
          - "Create NonRenewalNotice; set Policy.non_renewal_notice_sent_at"
      - from: ACTIVE
        to: NON_RENEWAL_PENDING
        trigger: "system (ClassCode.appetite_active flipped true->false for policy's class while clock >= renewal_window_start)"
        actor: system
        preconditions: ["Policy.non_renewal_notice_sent_at is null"]
        side_effects:
          - "Auto-issue NonRenewalNotice with reason_code APPETITE_CHANGE if statutory window still satisfiable; else policy remains ACTIVE until EXPIRED"
      - from: NON_RENEWAL_PENDING
        to: NON_RENEWED
        trigger: "system (clock reaches term_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [BOUND, ACTIVE]
        to: EXPIRED
        trigger: "system (clock reaches term_end without non-renewal and without renewal)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /ins/policies/{id}/renew"
        actor: Policyholder
        preconditions:
          - "Policy.status == ACTIVE"
          - "current clock >= Policy.renewal_window_start and < term_end"
          - "Policy.non_renewal_notice_sent_at is null"
          - "ClassCode.appetite_active == true for policy class"
          - "Policy.open_claim_count == 0"
          - "X-User-ID == policy.business_account_id"
          - "expected_policy_version matches (OCC)"
        side_effects:
          - "Create successor Policy (BOUND) with term_start = prior term_end; prior policy EXPIRED at its term_end"
          - "Recompute renewal premium with FINAL variant on current exposure"
          - "Policy.version increments by 1"

  - entity: Endorsement
    field: status
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, VOID]
    transitions:
      - from: DRAFT
        to: EFFECTIVE
        trigger: "system (immediately within POST /ins/policies/{id}/endorsements after validation; endorsements take effect on submission)"
        actor: system
        preconditions: []
        side_effects:
          - "Compute premium_delta_cents (mid-term proration)"
          - "If premium_delta_cents < 0: credit abs(delta) to BusinessAccount.account_credit_cents (floor 0 applied on consumption)"
          - "If endorsement_type == COVERAGE_ADJUST: set Policy.exposure_units = new_exposure_units"
          - "For ADDITIONAL_INSURED: eligible for Certificate issuance"
          - "Policy.updated_at refreshed"
      - from: DRAFT
        to: VOID
        trigger: "system (parent policy cancelled or voided by compensating endorsement)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Certificate
    field: status
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "system (parent policy CANCELLED, or the evidenced ADDITIONAL_INSURED endorsement voided)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Claim
    field: status
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED, CLOSED]
    transitions:
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /ins/claims/{id}/triage"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED"
          - "Claim.triage_tier computed (FAST_TRACK auto-approves instead, see auto transition)"
        side_effects: ["Set adjuster_owner = X-User-ID"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "system (automatic when triage_tier == FAST_TRACK at intake: claim_amount_cents <= 100000 AND evidence_count >= 1 AND policy ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["Policy.open_claim_count recomputed; BusinessAccount.open_claim_count recomputed"]
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /ins/claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == IN_REVIEW"
          - "adjuster_owner == X-User-ID (same adjuster who triaged)"
        side_effects: []
      - from: IN_REVIEW
        to: DENIED
        trigger: "POST /ins/claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == IN_REVIEW"
          - "adjuster_owner == X-User-ID"
        side_effects: ["Policy.open_claim_count recomputed; BusinessAccount.open_claim_count recomputed"]
      - from: APPROVED
        to: PAID
        trigger: "POST /ins/claims/{id}/payout"
        actor: FinanceOfficer
        preconditions:
          - "Claim.status == APPROVED"
          - "FinanceOfficer id != ClaimsAdjuster adjuster_owner (segregation of duties)"
        side_effects:
          - "BusinessAccount.claims_free_flag recomputed (becomes false permanently)"
          - "Policy.open_claim_count recomputed; BusinessAccount.open_claim_count recomputed"
      - from: [DENIED]
        to: CLOSED
        trigger: "POST /ins/claims/{id}/close"
        actor: ClaimsAdjuster
        preconditions: ["Claim.status == DENIED"]
        side_effects: []

  - entity: RiskSignalReport
    field: status
    initial_state: PENDING
    terminal_states: [APPLIED, STALE]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "system (quote reaches QUOTED for the account, or requote after signal injection)"
        actor: system
        preconditions: []
        side_effects: ["Signal severity folded into risk_score of the quoting computation"]
      - from: PENDING
        to: STALE
        trigger: "system (report older than 90 days at evaluation time, or the quote it fed reached BOUND)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-bind-stale-version
    parent_entity: Quote
    write_endpoint: "POST /ins/quotes/{id}/bind"
    occ_field: "expected_quote_version"
    description: |
      Binding a Quote whose version has advanced since the client last observed it
      is rejected. This captures the case where a newer quote for the same account
      superseded this one (or a referral approval refreshed it) and the client's
      view of the quote is therefore stale.
    error_id: ERR_STALE_QUOTE_VERSION
    http_status: 412

  - rule_id: policy-endorse-stale-version
    parent_entity: Policy
    write_endpoint: "POST /ins/policies/{id}/endorsements"
    occ_field: "expected_policy_version"
    description: |
      Creating an Endorsement against a Policy whose version has advanced since the
      client last observed it is rejected, because a competing endorsement or a
      cancel may have changed the proration baseline the client computed against.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

  - rule_id: policy-renew-stale-version
    parent_entity: Policy
    write_endpoint: "POST /ins/policies/{id}/renew"
    occ_field: "expected_policy_version"
    description: |
      Renewing a Policy whose version has advanced since the client last observed
      it is rejected, because an intervening endorsement or non-renewal notice may
      have changed the renewal basis.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: class_of_business_determination
    trigger: "Quote creation (synchronously inside POST /ins/quotes)"
    algorithm: weighted_scoring
    formula: |
      1. Tokenize raw_description to lowercase words; strip punctuation.
      2. Collect matches: AppetiteRule rows where is_enabled == true,
         effective_from <= clock < effective_to, and keyword appears as a whole
         word in the token set.
      3. Group matches by class_code; per-class score = count of matching
         enabled keywords for that class.
      4. Keep only classes with ClassCode.appetite_active == true and whose
         matched-rule disposition == ADMIT. A class with any matched DECLINE
         disposition is excluded entirely; REFER disposition routes the quote
         to REFERRED regardless of score.
      5. Winner = class with highest score; tie -> lower priority_rank sum
         across matched rules; still tied -> class whose earliest matching
         rule was created first (created_at ASC).
      6. Exactly zero admitted classes -> DECLINED. More than one admitted
         class with equal top score after all tie-breaks -> DECLINED
         (ambiguous classification is a decline, not a guess).
    input_set: "AppetiteRule (enabled, in effective window) x tokenized description; ClassCode appetite_active"
    constants:
      MAX_TOKEN_LEN: 64
    precision: "integer scores"

  - name: risk_score
    trigger: "Quote classification evaluation (and re-evaluation when new signals arrive pre-bind)"
    algorithm: weighted_scoring
    formula: |
      base = round(class.risk_factor * 20)
      signal_points = sum over PENDING RiskSignalReports for the account of
        severity weights: severity >= 80 -> +25; 50..79 -> +15; 20..49 -> +8; 1..19 -> +3
      answer_points: each uw_answers entry equal to the string "yes" for a
        hazard question -> +10; each "no" -> 0; unanswered required question
        blocks QUOTED (validation), not scored.
      risk_score = clamp(base + signal_points + answer_points, 0, 100)
      routing: risk_score < 60 -> QUOTED; 60..84 -> REFERRED; >= 85 -> DECLINED
    input_set: "RiskSignalReport status == PENDING for account; uw_answers; ClassCode.risk_factor"
    constants:
      REFER_FLOOR: 60
      DECLINE_FLOOR: 85
      SIGNAL_TIERS: "[[80,25],[50,15],[20,8],[1,3]]"
    precision: "integer, round_half_up on base"

  - name: premium_calculation
    trigger: "Quote reaches QUOTED (provisional) and Quote bind (final)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned: exposure tiering FIRST, then risk_factor,
      then package discount, then claims-free discount, then rounding.
      per_line_cents(line) = base_rates_cents[line] * exposure_units * tier_multiplier(exposure_units)
      tier_multiplier(u): u < 50 -> 1.00; 50 <= u < 200 -> 1.15; u >= 200 -> 1.30
      package_discount_pct: exactly 1 line -> 0%; exactly 2 lines -> 10%; all 3 lines -> 20%
      claims_free_discount_pct: 5% iff BusinessAccount.claims_free_flag == true
      premium = round_half_up(
        (sum over selected_lines of per_line_cents * class.risk_factor)
        * (1 - package_discount_pct) * (1 - claims_free_discount_pct) )
      Rounding: a single final round_half_up to integer cents AFTER all
      multipliers — per-line intermediate values are NOT individually rounded.
    input_set: "ClassCode.base_rates_cents for selected_lines, exposure_units, risk_factor, account claims_free_flag"
    constants:
      TIER_2_FLOOR: 50
      TIER_3_FLOOR: 200
      TIER_2_MULT: 1.15
      TIER_3_MULT: 1.30
      PKG_2_DISCOUNT: 0.10
      PKG_3_DISCOUNT: 0.20
      CLAIMS_FREE_DISCOUNT: 0.05
    precision: "integer cents, round_half_up applied once at the end"
    variants:
      - name: provisional
        when: "Quote in QUOTED state"
        difference: "claims-free discount applies from the claims_free_flag value at quote time; result stored on Quote.annual_premium_cents and may drift from final"
      - name: final
        when: "Bind and renewal"
        difference: "claims-free discount re-evaluated from current claims_free_flag AND an exposure_earned_audit uplift of exactly 3% applies if exposure_units was raised by any EFFECTIVE COVERAGE_ADJUST endorsement on the bound policy lineage; frozen to Policy.base_annual_premium_cents"

  - name: midterm_proration
    trigger: "Endorsement (COVERAGE_ADJUST / LIMIT_CHANGE / CLASS_RECODE) becomes EFFECTIVE; also policy cancellation"
    algorithm: projection
    formula: |
      day_of(d) = whole days since 2026-01-01T00:00:00Z (UTC civil days)
      effective_day = day_of(endorsement.effective_at)   # day precision, instant floors to its UTC day
      remaining_days = day_of(policy.term_end) - effective_day   # strictly: days from effective day through day before term_end
      delta_premium_cents = round_half_up(
        (new_annual_premium_cents - policy.base_annual_premium_cents)
        * remaining_days / policy.term_day_count )
      where new_annual_premium_cents = premium_calculation(final variant) with
      endorsement-applied exposure/lines.
      premium_delta_cents = delta_premium_cents (positive: owed; negative: credit)
      Cancellation credit (short-rate variant): credit = round_half_up(
        policy.base_annual_premium_cents * 0.90 * remaining_days_c / term_day_count )
      where remaining_days_c uses the cancellation request clock day and the
      0.90 short-rate factor replaces the pro-rata factor 1.0.
    input_set: "Policy base premium, endorsement effective_at, new exposure/lines, clock"
    constants:
      TERM_DAYS: 365
      SHORT_RATE_FACTOR: 0.90
    precision: "integer cents, round_half_up once"
    variants:
      - name: pro_rata
        when: "Coverage adjustment endorsements"
        difference: "factor 1.0 on remaining-days share of the premium difference"
      - name: short_rate
        when: "Policyholder-initiated cancellation"
        difference: "factor 0.90 penalty applied to the unearned share — same remaining_days arithmetic, different factor, different (smaller) credit"

  - name: earned_premium_reconciliation
    trigger: "Any premium-affecting mutation on a Policy (bind, endorsement EFFECTIVE, cancel, clock-driven read of Policy)"
    algorithm: aggregation
    formula: |
      For policy P with ordered EFFECTIVE endorsements E_1..E_n (ordered by
      effective_at ASC, tie -> created_at ASC):
      Build segments: segment k runs from effective_day(E_k) to
      effective_day(E_{k+1}) - 1, with annual premium A_k (the premium basis in
      force during that segment; A_0 = base_annual_premium_cents).
      earned_premium_cents = round_half_up(
        sum over segments intersecting [term_start, min(clock_day, end_day)] of
        A_k * segment_days_intersected / term_day_count )
      end_day = term_end normally; cancellation day when CANCELLED.
      Invariant (compensating): earned_premium + unearned_remainder ==
      base_annual_premium + sum(positive premium_delta_cents) - sum(abs(negative premium_delta_cents))
      where unearned_remainder = round_half_up(A_last * remaining_days / term_day_count).
    input_set: "Policy, EFFECTIVE endorsements ordered by (effective_at, created_at)"
    constants:
      TERM_DAYS: 365
    precision: "integer cents, round_half_up per final sum"

  - name: certificate_sequence
    trigger: "Certificate issuance"
    algorithm: aggregation
    formula: |
      n = count of Certificate rows ever created for this policy (any status) + 1
      certificate_no = "CERT-" + policy_ordinal + "-" + n
      policy_ordinal = zero-padded creation order of the policy within its account
      (deterministic from created_at ASC, never from id).
    input_set: "Certificates for policy; policy creation order within account"
    precision: "monotonic integer, never reused even after VOIDED"

  - name: claim_triage
    trigger: "Claim intake (synchronously inside POST /ins/claims) and on each evidence attach"
    algorithm: threshold
    formula: |
      evidence_count = count of ClaimEvidence rows for the claim
      FAST_TRACK iff claim_amount_cents <= 100000 AND evidence_count >= 1
      COMPLEX iff claim_amount_cents > 500000 OR evidence_count == 0
      STANDARD otherwise
      Boundary precision: amount exactly 100000 with 1 evidence -> FAST_TRACK;
      amount exactly 500001 -> COMPLEX regardless of evidence.
      Auto-transition: FAST_TRACK at intake -> Claim directly APPROVED by system.
      Triage tier recomputed on evidence attach while status == SUBMITTED; a
      STANDARD claim becoming FAST_TRACK by evidence attach is NOT auto-approved
      (auto-approval only at intake).
    input_set: "Claim.claim_amount_cents, evidence_count, policy status"
    constants:
      FAST_TRACK_CAP: 100000
      COMPLEX_FLOOR_EXCLUSIVE: 500000
    precision: "integer cents comparison, >=/<= exact"

  - name: account_credit_ledger
    trigger: "Negative premium_delta_cents on endorsement EFFECTIVE; short-rate cancellation credit; credit consumption at renewal bind"
    algorithm: waterfall_allocation
    formula: |
      BusinessAccount.account_credit_cents accrues abs(negative deltas) and
      short-rate credits. At renewal bind, credit is consumed FIRST against the
      successor policy premium: consumed = min(account_credit_cents, renewal_premium_cents);
      remainder payable = renewal_premium_cents - consumed; credit floors at 0
      and never goes negative. Order: accrual events apply in (created_at ASC)
      order; consumption happens only at renewal bind, never mid-term.
    input_set: "Endorsement deltas, cancellation credits, renewal bind events"
    constants:
      CREDIT_FLOOR: 0
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids resolve left-to-right (account -> policy/quote -> child); cross-account references -> 404 not 403"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: state
    check: "Target resource in a state that permits the operation (quote QUOTED for bind; policy ACTIVE for endorsement/renew/non-renewal; claim IN_REVIEW for approve/deny; referral OPEN for decision); state errors use the domain-specific state error_id for the endpoint"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Regulatory/compliance gates: non-renewal statutory day minimums; segregation of duties on claim payout; claim loss date within coverage window and intake window"
    error_id: ERR_COMPLIANCE_VIOLATION
    http_status: 422
    applies_to: "POST /ins/policies/{id}/non-renewal-notices, POST /ins/claims/{id}/payout, POST /ins/claims"
  - priority: 6
    category: business_temporal
    check: "Temporal windows: quote not expired; endorsement effective_at within policy term and not in the future; appetite rule effective_from < effective_to; renewal inside renewal window"
    error_id: ERR_TEMPORAL_WINDOW_VIOLATION
    http_status: 422
    applies_to: "bind, endorsements, appetite rule create/update, renew"
  - priority: 7
    category: business_constraint
    check: "Shape constraints: selected_lines non-empty subset of eligible_lines; added/removed lines disjoint and leave >= 1 line; exposure_units >= 0; new_exposure_units >= 0; claim_amount_cents >= 100; file_size_bytes within [1024, 10485760]; uw_answers complete for class"
    error_id: ERR_BUSINESS_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "quote create, endorsement create, claim create, evidence attach"
  - priority: 8
    category: business_referential
    check: "Referential integrity: endorsement.policy exists and belongs to caller; certificate.endorsement is an EFFECTIVE ADDITIONAL_INSURED on the same policy; partner channel quote carries channel_partner_id matching account partner_tenant; claim.policy belongs to reporting account"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "endorsement create, certificate issue, quote create, claim create"
  - priority: 9
    category: business_fiscal
    check: "Fiscal gates: quote premium_basis_hash unchanged since issuance (bind staleness); policy.open_claim_count == 0 for cancel/renew; appetite_active true for renew"
    error_id: ERR_FISCAL_GATE_VIOLATION
    http_status: 409
    applies_to: "bind, cancel, renew"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/ins/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any set_current_utc call the clock reads that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Advance-driven system transitions evaluated: QUOTED quote expiry, BOUND->ACTIVE at term_start, ACTIVE->EXPIRED/NON_RENEWED at term_end, STALE signal aging"

  # --- Appetite & class administration ---
  - method: POST
    path: "/ins/appetite-rules"
    description: "Create appetite keyword rule"
    roles: [PlatformAdmin]
    code: 201
    input: [keyword, class_code, disposition, effective_from, effective_to, priority_rank, "is_enabled?"]
    output: AppetiteRule
    side_effects: []
  - method: GET
    path: "/ins/appetite-rules"
    description: "List appetite rules"
    roles: [PlatformAdmin, Underwriter, ComplianceOfficer]
    code: 200
    input: ["class_code?", "disposition?", "include_disabled?"]
    output: AppetiteRule[]
    side_effects: []
  - method: PATCH
    path: "/ins/appetite-rules/{id}"
    description: "Disable/enable or rewindow an appetite rule; flipping disposition of an enabled in-window rule triggers appetite-change cascade"
    roles: [PlatformAdmin]
    code: 200
    input: ["is_enabled?", "effective_from?", "effective_to?", "disposition?"]
    output: AppetiteRule
    side_effects:
      - "If rule becomes disabled or disposition -> DECLINE and its class has no other enabled ADMIT rule in-window: class considered off-appetite at evaluation time"
  - method: POST
    path: "/ins/class-codes"
    description: "Create class code"
    roles: [PlatformAdmin]
    code: 201
    input: [code, description, eligible_lines, base_rates_cents, risk_factor, "appetite_active?"]
    output: ClassCode
    side_effects: []
  - method: GET
    path: "/ins/class-codes"
    description: "List class codes"
    roles: [PlatformAdmin, Underwriter, ComplianceOfficer, Policyholder, Agent, PartnerPlatform]
    code: 200
    input: ["appetite_active?"]
    output: ClassCode[]
    side_effects: []
  - method: GET
    path: "/ins/class-codes/{id}"
    description: "Get one class code"
    roles: [PlatformAdmin, Underwriter, ComplianceOfficer, Policyholder, Agent, PartnerPlatform]
    code: 200
    input: []
    output: ClassCode
    side_effects: []
  - method: GET
    path: "/ins/class-codes/{id}/appetite-rules"
    description: "List appetite rules for a class code"
    roles: [PlatformAdmin, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: AppetiteRule[]
    side_effects: []
  - method: GET
    path: "/ins/class-codes/{id}/policies"
    description: "List policies written in a class code"
    roles: [PlatformAdmin, Underwriter, ComplianceOfficer]
    code: 200
    input: []
    output: Policy[]
    side_effects: []
  - method: PATCH
    path: "/ins/class-codes/{id}"
    description: "Update class code; appetite_active true->false flips class off-appetite"
    roles: [PlatformAdmin]
    code: 200
    input: ["appetite_active?", "base_rates_cents?", "risk_factor?"]
    output: ClassCode
    side_effects:
      - "appetite_active true->false: every in-force ACTIVE Policy of this class with clock >= renewal_window_start and no notice yet gets an auto NonRenewalNotice (reason APPETITE_CHANGE) when statutory window satisfiable"

  # --- Business accounts ---
  - method: POST
    path: "/ins/business-accounts"
    description: "Onboard a business account"
    roles: [Agent, PartnerPlatform, PlatformAdmin]
    code: 201
    input: [legal_name, contact_email, channel, "partner_tenant?"]
    output: BusinessAccount
    side_effects: []
  - method: GET
    path: "/ins/business-accounts"
    description: "List business accounts"
    roles: [PlatformAdmin, Agent, PartnerPlatform]
    code: 200
    input: ["channel?", "partner_tenant?"]
    output: BusinessAccount[]
    side_effects: []
  - method: GET
    path: "/ins/business-accounts/{id}"
    description: "Get business account; Policyholder sees own only"
    roles: [PlatformAdmin, Agent, PartnerPlatform, Policyholder]
    code: 200
    input: []
    output: BusinessAccount
    side_effects: []
  - method: GET
    path: "/ins/business-accounts/{id}/risk-signals"
    description: "List risk signal reports for an account"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: []
    output: RiskSignalReport[]
    side_effects: []
  - method: GET
    path: "/ins/business-accounts/{id}/quotes"
    description: "List quotes for an account"
    roles: [PlatformAdmin, Agent, PartnerPlatform, Policyholder, Underwriter]
    code: 200
    input: ["status?"]
    output: Quote[]
    side_effects: []
  - method: GET
    path: "/ins/business-accounts/{id}/policies"
    description: "List policies for an account"
    roles: [PlatformAdmin, Agent, PartnerPlatform, Policyholder, ComplianceOfficer]
    code: 200
    input: ["status?"]
    output: Policy[]
    side_effects: []

  # --- Risk signals ---
  - method: POST
    path: "/ins/risk-signals"
    description: "Inject an automated risk signal report for an account"
    roles: [PlatformAdmin, Underwriter]
    code: 201
    input: [business_account_id, signal_type, severity, detail]
    output: RiskSignalReport
    side_effects: []

  # --- Quotes ---
  - method: GET
    path: "/ins/quotes"
    description: "List quotes across accounts (ops view), filterable by class_code_id"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: ["class_code_id?", "status?"]
    output: Quote[]
    side_effects: []
  - method: POST
    path: "/ins/quotes"
    description: "Create quote: classify class-of-business from plain-language description, score risk, and synchronously price (or refer/decline)"
    roles: [Policyholder, Agent, PartnerPlatform]
    code: 201
    input: [business_account_id, raw_description, selected_lines, exposure_units, requested_effective_at, uw_answers, "channel_partner_id?"]
    output: Quote
    side_effects:
      - "Runs class_of_business_determination, risk_score, premium_calculation (provisional)"
      - "Status set per routing; QUOTED -> expires_at = clock + 168h"
      - "New QUOTED/REFERRED quote SUPERSEDES prior QUOTED quote of the same account"
  - method: GET
    path: "/ins/quotes/{id}"
    description: "Get quote"
    roles: [PlatformAdmin, Agent, PartnerPlatform, Policyholder, Underwriter]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: POST
    path: "/ins/quotes/{id}/bind"
    description: "Bind a QUOTED quote into a Policy (OCC on Quote.version)"
    roles: [Policyholder]
    code: 201
    input: [expected_quote_version]
    output: Policy
    side_effects:
      - "Quote -> BOUND; version +1"
      - "Recompute premium FINAL variant; create Policy BOUND"
  - method: GET
    path: "/ins/quotes/{id}/referral"
    description: "Get the underwriter referral for a referred quote (array of 0-1)"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: []
    output: UnderwriterReferral[]
    side_effects: []
  - method: GET
    path: "/ins/quotes/{id}/policy"
    description: "Get the policy bound from this quote (array of 0-1)"
    roles: [PlatformAdmin, Policyholder, Agent, PartnerPlatform, Underwriter]
    code: 200
    input: []
    output: Policy[]
    side_effects: []

  # --- Referrals ---
  - method: GET
    path: "/ins/referrals/{id}"
    description: "Get a referral"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: []
    output: UnderwriterReferral
    side_effects: []
  - method: POST
    path: "/ins/referrals/{id}/approve"
    description: "Underwriter approves referral; quote becomes QUOTED"
    roles: [Underwriter]
    code: 200
    input: []
    output: UnderwriterReferral
    side_effects: ["Quote REFERRED -> QUOTED; referral RESOLVED/APPROVED"]
  - method: POST
    path: "/ins/referrals/{id}/decline"
    description: "Underwriter declines referral; quote DECLINED"
    roles: [Underwriter]
    code: 200
    input: []
    output: UnderwriterReferral
    side_effects: ["Quote REFERRED -> DECLINED; referral RESOLVED/DECLINED"]

  # --- Policies ---
  - method: GET
    path: "/ins/policies/{id}"
    description: "Get policy including earned_premium_cents reconciled to clock"
    roles: [PlatformAdmin, Policyholder, Agent, PartnerPlatform, ComplianceOfficer, ClaimsAdjuster, FinanceOfficer]
    code: 200
    input: []
    output: Policy
    side_effects: ["earned_premium_cents recomputed (derived field reconciliation)"]
  - method: POST
    path: "/ins/policies/{id}/cancel"
    description: "Policyholder cancels; short-rate credit to account; certificates voided"
    roles: [Policyholder]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "Policy -> CANCELLED"
      - "short-rate credit via midterm_proration(short_rate variant) -> BusinessAccount.account_credit_cents"
      - "All ISSUED Certificates -> VOIDED; DRAFT Endorsements -> VOID"
  - method: POST
    path: "/ins/policies/{id}/renew"
    description: "Renew policy into successor term (OCC on Policy.version); consumes account credit"
    roles: [Policyholder]
    code: 201
    input: [expected_policy_version]
    output: Policy
    side_effects:
      - "Successor Policy BOUND created; prior -> RENEWED; prior.version +1"
      - "account_credit_cents consumed per account_credit_ledger"
  - method: POST
    path: "/ins/policies/{id}/non-renewal-notices"
    description: "Issue statutory non-renewal notice"
    roles: [ComplianceOfficer]
    code: 201
    input: [reason_code]
    output: NonRenewalNotice
    side_effects: ["Policy ACTIVE -> NON_RENEWAL_PENDING; non_renewal_notice_sent_at set"]
  - method: GET
    path: "/ins/policies/{id}/non-renewal-notices"
    description: "List non-renewal notices for a policy"
    roles: [PlatformAdmin, ComplianceOfficer, Policyholder]
    code: 200
    input: []
    output: NonRenewalNotice[]
    side_effects: []
  - method: GET
    path: "/ins/policies/{id}/endorsements"
    description: "List endorsements for a policy"
    roles: [PlatformAdmin, Policyholder, Agent, PartnerPlatform, Underwriter]
    code: 200
    input: ["status?", "endorsement_type?"]
    output: Endorsement[]
    side_effects: []
  - method: POST
    path: "/ins/policies/{id}/endorsements"
    description: "Create endorsement (COVERAGE_ADJUST / ADDITIONAL_INSURED / LIMIT_CHANGE / CLASS_RECODE); effective immediately on validation (OCC on Policy.version)"
    roles: [Policyholder, Agent]
    code: 201
    input: [endorsement_type, effective_at, expected_policy_version, "new_exposure_units?", "added_lines?", "removed_lines?", "ai_holder_name?"]
    output: Endorsement
    side_effects:
      - "Endorsement DRAFT -> EFFECTIVE immediately"
      - "midterm_proration computes premium_delta_cents; negative delta credits account"
      - "Policy.version +1; earned_premium_cents recomputed"
  - method: GET
    path: "/ins/policies/{id}/certificates"
    description: "List certificates for a policy"
    roles: [PlatformAdmin, Policyholder, Agent, PartnerPlatform]
    code: 200
    input: ["status?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/ins/certificates"
    description: "Self-serve certificate of insurance issuance against an EFFECTIVE ADDITIONAL_INSURED endorsement"
    roles: [Policyholder, Agent, PartnerPlatform]
    code: 201
    input: [policy_id, endorsement_id]
    output: Certificate
    side_effects: ["certificate_no assigned per certificate_sequence"]
  - method: GET
    path: "/ins/endorsements/{id}"
    description: "Get one endorsement"
    roles: [PlatformAdmin, Policyholder, Agent, PartnerPlatform, Underwriter]
    code: 200
    input: []
    output: Endorsement
    side_effects: []
  - method: GET
    path: "/ins/endorsements/{id}/certificates"
    description: "List certificates issued against an endorsement"
    roles: [PlatformAdmin, Policyholder, Agent, PartnerPlatform]
    code: 200
    input: []
    output: Certificate[]
    side_effects: []
  - method: GET
    path: "/ins/certificates/{id}"
    description: "Get certificate"
    roles: [PlatformAdmin, Policyholder, Agent, PartnerPlatform]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  # --- Claims ---
  - method: POST
    path: "/ins/claims"
    description: "Claim intake with rapid triage; FAST_TRACK auto-approves"
    roles: [Policyholder]
    code: 201
    input: [policy_id, loss_occurred_at, description, claim_amount_cents]
    output: Claim
    side_effects:
      - "claim_triage computes triage_tier; FAST_TRACK at intake -> APPROVED by system"
      - "Policy.open_claim_count and BusinessAccount.open_claim_count recomputed"
  - method: GET
    path: "/ins/claims/{id}"
    description: "Get claim"
    roles: [PlatformAdmin, Policyholder, ClaimsAdjuster, FinanceOfficer]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/ins/policies/{id}/claims"
    description: "List claims for a policy"
    roles: [PlatformAdmin, Policyholder, ClaimsAdjuster, FinanceOfficer]
    code: 200
    input: ["status?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/ins/business-accounts/{id}/claims"
    description: "List claims reported by an account"
    roles: [PlatformAdmin, Policyholder, ClaimsAdjuster, FinanceOfficer]
    code: 200
    input: []
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/ins/claims/{id}/evidence"
    description: "Attach photo evidence"
    roles: [Policyholder]
    code: 201
    input: [photo_ref, exif_taken_at, file_size_bytes]
    output: ClaimEvidence
    side_effects: ["Claim.evidence_count recomputed; triage_tier recomputed while SUBMITTED (no auto-approval)"]
  - method: GET
    path: "/ins/claims/{id}/evidence"
    description: "List evidence for a claim"
    roles: [PlatformAdmin, Policyholder, ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimEvidence[]
    side_effects: []
  - method: POST
    path: "/ins/claims/{id}/triage"
    description: "Adjuster pulls claim into review"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["SUBMITTED -> IN_REVIEW; adjuster_owner = caller"]
  - method: POST
    path: "/ins/claims/{id}/approve"
    description: "Adjuster approves (must own the review)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["IN_REVIEW -> APPROVED"]
  - method: POST
    path: "/ins/claims/{id}/deny"
    description: "Adjuster denies (must own the review)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["IN_REVIEW -> DENIED; open_claim_count recomputed"]
  - method: POST
    path: "/ins/claims/{id}/payout"
    description: "Finance pays approved claim; segregation of duties vs adjuster_owner"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Claim
    side_effects: ["APPROVED -> PAID; claims_free_flag recomputed (false permanently)"]
  - method: POST
    path: "/ins/claims/{id}/close"
    description: "Close a denied claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["DENIED -> CLOSED"]

  # --- Audit ---
  - method: GET
    path: "/ins/audit-events"
    description: "Query append-only audit trail"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["entity_type?", "entity_id?", "action?"]
    output: AuditEvent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.5 roles" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve, or cross-account reference (404 preferred over 403)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state forbids the operation (bind non-QUOTED quote, endorse non-ACTIVE policy, approve non-IN_REVIEW claim, decide non-OPEN referral, cancel policy with open claims uses ERR_FISCAL_GATE_VIOLATION instead)" }
  - { id: ERR_STALE_QUOTE_VERSION, http: 412, condition: "expected_quote_version mismatch on bind (OCC)" }
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version mismatch on endorsement create or renew (OCC)" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Bind attempted at/after Quote.expires_at" }
  - { id: ERR_QUOTE_BASIS_STALE, http: 409, condition: "premium_basis_hash changed since quote issuance (new APPLIED risk signals or answer drift) — bind blocked, requote required" }
  - { id: ERR_CLASS_AMBIGUOUS, http: 422, condition: "Appetite classification produced more than one admitted class with equal top score after tie-breaks" }
  - { id: ERR_CLASS_DECLINED, http: 422, condition: "No admitted class for the description, or matched class off-appetite" }
  - { id: ERR_APPETITE_WINDOW_INVALID, http: 422, condition: "AppetiteRule effective_from >= effective_to" }
  - { id: ERR_LINE_NOT_ELIGIBLE, http: 422, condition: "selected_lines/added_lines not subset of class eligible_lines, or empty selection" }
  - { id: ERR_LAST_LINE_REMOVAL, http: 422, condition: "removed_lines would leave zero in-force lines" }
  - { id: ERR_LINE_OVERLAP, http: 422, condition: "added_lines and removed_lines intersect, or added line already in force" }
  - { id: ERR_ENDORSEMENT_WINDOW, http: 422, condition: "effective_at outside [policy term_start day, current clock day end]" }
  - { id: ERR_EXPOSURE_NEGATIVE, http: 422, condition: "exposure_units or new_exposure_units < 0" }
  - { id: ERR_UW_ANSWERS_INCOMPLETE, http: 422, condition: "Required underwriting answers missing for the classified class" }
  - { id: ERR_CLAIM_WINDOW, http: 422, condition: "loss_occurred_at outside policy coverage window or older than 30 days before intake" }
  - { id: ERR_CLAIM_AMOUNT_FLOOR, http: 422, condition: "claim_amount_cents < 100" }
  - { id: ERR_EVIDENCE_SIZE, http: 422, condition: "file_size_bytes outside [1024, 10485760]" }
  - { id: ERR_EVIDENCE_FUTURE, http: 422, condition: "exif_taken_at after claim intake clock instant" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "FinanceOfficer attempting payout on a claim whose adjuster_owner is the same user id" }
  - { id: ERR_NOT_REVIEW_OWNER, http: 409, condition: "approve/deny attempted by an adjuster other than adjuster_owner" }
  - { id: ERR_OPEN_CLAIMS_BLOCK, http: 409, condition: "Cancel or renew blocked because open_claim_count > 0" }
  - { id: ERR_RENEWAL_WINDOW, http: 422, condition: "Renew outside [renewal_window_start, term_end)" }
  - { id: ERR_RENEWAL_NOTICE_ISSUED, http: 409, condition: "Renew blocked because a non-renewal notice was already sent" }
  - { id: ERR_APPETITE_INACTIVE, http: 409, condition: "Renew blocked because class appetite_active == false" }
  - { id: ERR_NONRENEWAL_STATUTE, http: 422, condition: "days_before_term_end below statutory minimum for reason_code (45 APPETITE_CHANGE / 60 CARRIER_WITHDRAWAL / 30 RISK_ESCALATION)" }
  - { id: ERR_NONRENEWAL_DUPLICATE, http: 409, condition: "Second non-renewal notice for the same policy" }
  - { id: ERR_CERT_ENDORSEMENT_INVALID, http: 422, condition: "Certificate requested for endorsement that is not an EFFECTIVE ADDITIONAL_INSURED on the same policy" }
  - { id: ERR_CHANNEL_MISMATCH, http: 422, condition: "PARTNER-channel account quote missing channel_partner_id or partner_tenant mismatch; non-partner account supplying channel_partner_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body, wrong types, unknown fields" }
  - { id: ERR_FISCAL_GATE_VIOLATION, http: 409, condition: "Fiscal gate failed: quote basis stale at bind, open claims at cancel/renew, appetite inactive at renew" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Policyholder
    description: "The small-business account owner acting self-serve; X-User-ID equals their BusinessAccount.id"
    identity: "entity_backed:BusinessAccount"
    exclusive_operations:
      - "POST /ins/quotes/{id}/bind"
      - "POST /ins/policies/{id}/cancel"
      - "POST /ins/policies/{id}/renew"
      - "POST /ins/claims"
      - "POST /ins/claims/{id}/evidence"
      - "POST /ins/claims/{id}/triage — NO (adjuster only)"
    shared_operations:
      - "POST /ins/quotes"
      - "POST /ins/policies/{id}/endorsements"
      - "POST /ins/certificates"
      - "GET reads of own account/quotes/policies/claims/certificates"
  - name: Agent
    description: "Licensed agent embedding the flow on behalf of accounts they onboarded"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /ins/business-accounts"
      - "POST /ins/quotes"
      - "POST /ins/policies/{id}/endorsements"
      - "POST /ins/certificates"
      - "GET reads"
  - name: PartnerPlatform
    description: "Embedded partner channel surface (platform where the business already operates); X-User-ID is the partner tenant slug"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /ins/business-accounts (channel=PARTNER)"
      - "POST /ins/quotes (with channel_partner_id)"
      - "POST /ins/certificates"
      - "GET reads"
  - name: Underwriter
    description: "Handles referred quotes; cannot bind, cannot administer appetite"
    identity: "opaque"
    exclusive_operations:
      - "POST /ins/referrals/{id}/approve"
      - "POST /ins/referrals/{id}/decline"
      - "POST /ins/risk-signals"
    shared_operations:
      - "GET quotes, referrals, class codes, risk signals"
  - name: ClaimsAdjuster
    description: "Triages and decides claims; never pays (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /ins/claims/{id}/triage"
      - "POST /ins/claims/{id}/approve"
      - "POST /ins/claims/{id}/deny"
      - "POST /ins/claims/{id}/close"
    shared_operations:
      - "GET claims, evidence, policies"
  - name: FinanceOfficer
    description: "Pays approved claims; never adjusts (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /ins/claims/{id}/payout"
    shared_operations:
      - "GET claims, policies"
  - name: ComplianceOfficer
    description: "Issues non-renewal notices and reads the audit trail"
    identity: "opaque"
    exclusive_operations:
      - "POST /ins/policies/{id}/non-renewal-notices"
    shared_operations:
      - "GET /ins/audit-events"
      - "GET policies, notices, class codes, appetite rules"
  - name: PlatformAdmin
    description: "Administers appetite rules, class codes, clock, risk signals; no policyholder self-serve actions"
    identity: "opaque"
    exclusive_operations:
      - "POST /ins/_clock/set_current_utc"
      - "POST /ins/appetite-rules"
      - "PATCH /ins/appetite-rules/{id}"
      - "POST /ins/class-codes"
      - "PATCH /ins/class-codes/{id}"
      - "POST /ins/risk-signals"
    shared_operations:
      - "GET everything"
