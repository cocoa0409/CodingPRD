          - calculations.cycle_billing_amount
          - entities.Client.fields.wallet_credit_cents
        distinguishing_aspect: "Different conserved quantity = service-value cents. A same-day pause refunds the full paid 9900 to wallet (forward action); the next charge debits exactly min(wallet, list) = 9900 back out (compensating action), leaving wallet net 0 — the cents are conserved, not created or lost."
        test_recipe:
          setup:
            - "Client in CA, intake cleared, subscription base_weekly_fee 9900 charged at period_start 2026-06-01 (wallet 0)."
            - "Same-day pause at 2026-06-01 refunds 9900 to wallet; resume; then re-charge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "p16@x.com", full_name: "P Sixteen", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}", base_weekly_fee_cents: 9900 }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { resume_on: "2026-07-01T00:00:00Z", expected_subscription_version: "${sub_v}" }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
              captures: { bc2_id: $.data.id }
          assert:
            - "BillingCycle.${bc2_id}.list_amount_cents == 9900"
            - "BillingCycle.${bc2_id}.wallet_applied_cents == 9900"
            - "BillingCycle.${bc2_id}.charged_amount_cents == 0"
            - "Client.${c_id}.wallet_credit_cents == 0"
