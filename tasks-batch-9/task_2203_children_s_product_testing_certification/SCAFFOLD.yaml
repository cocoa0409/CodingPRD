  - name: LaboratoryUser
    description: "Acts on behalf of exactly one accredited third-party laboratory. Takes assigned orders into testing and reports measured values. May only touch TestOrder rows whose laboratory_id equals the laboratory backing the caller's identity; any other order raises ERR_LAB_NOT_ASSIGNED."
    identity: "entity_backed:Laboratory"
    exclusive_operations:
      - "POST /compliance/test-orders/{order_id}/start-testing"
      - "POST /compliance/test-orders/{order_id}/report-result"
    shared_operations:
      - "GET /compliance/applicable-rules/{rule_id}"
