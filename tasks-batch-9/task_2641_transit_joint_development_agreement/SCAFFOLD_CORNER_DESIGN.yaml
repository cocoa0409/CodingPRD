      - name: corner_agreement_parallel_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.JointDevelopmentAgreement.negotiation_status
          - state_machines.JointDevelopmentAgreement.federal_approval_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: agreement_parallel_dimensions_with_revision_cycle
          rationale: "That §1.8 instance drives negotiation_status through AGENCY_REVIEW -> REVISION_REQUESTED -> DRAFTING -> AGENCY_REVIEW -> BOARD_APPROVED while federal_approval_status advances NOT_SUBMITTED -> SUBMITTED -> FTA_APPROVED on its own endpoints, asserting the combined state."

      - name: corner_site_status_loops_back_to_assessed
        claim_type: cyclic
        grounds:
          - state_machines.AgencySite.ASSESSED_to_INVENTORIED
          - endpoints[POST /jda/sites/{id}/reopen-inventory]
        excluded_because:
          difficulty_instance: site_status_cycles_assessed_inventoried_assessed
          rationale: "That §1.8 instance walks the ASSESSED -> INVENTORIED -> ASSESSED loop, asserts the readiness score is cleared to null on reopen and that the first certified assessment is superseded."

      - name: corner_award_cascades_down_to_sibling_solicitation_proposals
        claim_type: cascade_down
        grounds:
          - state_machines.Solicitation.ISSUED_to_CANCELLED
          - state_machines.Proposal.SUBMITTED_to_REJECTED
        excluded_because:
          difficulty_instance: award_cascade_site_to_sibling_solicitation_to_its_proposals
          rationale: "That §1.8 instance asserts the full depth-3 cascade award -> site UNDER_AGREEMENT -> sibling solicitation CANCELLED -> its proposals REJECTED."

      - name: corner_federal_rejection_cross_entity_cascade
        claim_type: cross_entity
        grounds:
          - state_machines.FederalDispositionRequest.PENDING_to_REJECTED
          - state_machines.StagingWindow.APPROVED_to_SUSPENDED
        excluded_because:
          difficulty_instance: federal_rejection_cascade_suspends_staging_and_releases_encumbrance
          rationale: "That §1.8 instance asserts every hop of the REJECTED determination cascade across agreement, valuation, staging window, shared facility and site ledger."

      - name: corner_disposition_withdrawal_compensates_site_ledger
        claim_type: compensation
        grounds:
          - state_machines.FederalDispositionRequest.PENDING_to_WITHDRAWN
          - entities.AgencySite.fields.federal_interest_encumbered_cents
        excluded_because:
          difficulty_instance: federal_interest_ledger_conserved_across_filing_and_withdrawal
          rationale: "That §1.8 instance asserts the withdrawal reverses the filing's encumbrance exactly, with no drift in the basis at any of three checkpoints."

      - name: corner_staging_close_conditional_cascade_guarded_by_capacity_released
        claim_type: conditional_cascade
        grounds:
          - state_machines.StagingWindow.APPROVED_to_CLOSED
          - entities.StagingWindow.fields.capacity_released
        excluded_because:
          difficulty_instance: shared_facility_bay_count_conserved_across_staging_close_and_reclose
          rationale: "That §1.8 instance asserts the bay credit fires only while capacity_released is false, so the guarded cascade never runs twice."

      - name: corner_staging_approval_guarded_on_facility_replacement_state
        claim_type: guarded_transitions
        grounds:
          - validations[priority=41]
          - state_machines.StagingWindow.REQUESTED_to_APPROVED
        excluded_because:
          difficulty_instance: staging_approval_gated_on_facility_replacement_in_place
          rationale: "That §1.8 instance asserts the REQUESTED -> APPROVED transition is refused while the TransitFacilityReplacement is PLANNED and allowed once it is INTERIM_IN_PLACE."

      - name: corner_disposition_filing_ledger_sync_to_site
        claim_type: ledger_sync
        grounds:
          - calculations.federal_interest_amount
          - entities.AgencySite.fields.federal_interest_unencumbered_cents
        excluded_because:
          difficulty_instance: federal_interest_ledger_conserved_across_filing_and_withdrawal
          rationale: "That §1.8 instance reconciles the site's encumbered/unencumbered ledger before and after the filing writes 727500 cents."

