            - "GET /psps-events/${evm_id}/resource-centers returns total_count 2 and first_center_id == ${crc_l1_id}; CRC-L3 is absent because it is in D-EAST and was never attached"
            - "the same listing filtered on status ACTIVATED returns 2 rows and filtered on STANDBY returns total_count 0"
