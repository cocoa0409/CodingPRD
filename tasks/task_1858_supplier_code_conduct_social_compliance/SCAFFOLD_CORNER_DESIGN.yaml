# =============================================================================
# Task 1858 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every testable claim in SCAFFOLD.yaml §1.1–§1.7 that §1.8
# (SCAFFOLD_DIFFICULTY_DESIGN.yaml) does not already cover. Instance names are
# unique across BOTH design files. excluded_because stubs cite §1.8 coverage.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: supplier_create_defaults
        claim_type: creation
        grounds: [entities.Supplier]
        distinguishing_aspect: "POST /suppliers with valid input returns 201 with system defaults: status ONBOARDING, both scores 100, tier PREFERRED, escalation 0, version 1, id/created_at minted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { legal_name: "Sierra Trading", country_code: "VN", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, st: $.data.status, prov: $.data.provisional_score, ver: $.data.verified_score, tier: $.data.consequence_tier, pen: $.data.escalation_penalty_points, v: $.data.version } }
          trigger: []
          assert:
            - "${st} == ONBOARDING and ${prov} == 100 and ${ver} == 100 and ${tier} == PREFERRED and ${pen} == 0 and ${v} == 1"

      - name: facility_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Facility.fields.risk_tier, calculations.facility_risk_score]
        distinguishing_aspect: "Client-sent risk_tier/risk_score_baseline values are ignored; the server computes baseline 87.0 and tier HIGH for BD / APPAREL / 1200 workers."
        test_recipe:
          setup: ["Supplier (APPAREL) ACTIVE with acknowledgment"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Tango Apparel", country_code: "BD", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "Z Ana", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Gazipur Unit", country_code: "BD", worker_count: 1200, processes: ["sewing"], risk_tier: "LOW", risk_score_baseline: 0 }, as: SourcingProgramAdmin, captures: { tier: $.data.risk_tier, base: $.data.risk_score_baseline, hist: $.data.risk_score_history, ivl: $.data.next_audit_interval_months, st: $.data.status } }
          assert:
            - "${base} == 87.0 and ${tier} == HIGH (computed values win over client-supplied LOW / 0)"
            - "${hist} == null and ${ivl} == 6 (TIER_BASE_MONTHS[HIGH]) and ${st} == ACTIVE"

      - name: acknowledgment_supersede_chain
        claim_type: parent_relationships
        grounds: [entities.CodeAcknowledgment.fields.supersedes_acknowledgment_id]
        distinguishing_aspect: "Self-referential supersede: the second acknowledgment of a supplier points at the first via supersedes_acknowledgment_id and advances the supplier's current code version."
        test_recipe:
          setup: ["Two PUBLISHED code versions cv1, cv2; supplier ACTIVE after acknowledging cv1"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv1: $.data.id } }
            - { call: "POST /code-versions/${cv1}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /code-versions", payload: { version_label: "CoC v2.0", effective_from: "2026-06-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR", "CHILD_LABOR"] }, as: SourcingProgramAdmin, captures: { cv2: $.data.id } }
            - { call: "POST /code-versions/${cv2}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Umbrella Goods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv1}", signer_name: "B Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}", captures: { ack1: $.data.id, ack1_sup: $.data.supersedes_acknowledgment_id } }
            - { call: "GET /suppliers/${sup_id}", payload: {}, as: ComplianceOfficer, captures: { sup_v2: $.data.version } }
          trigger:
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv2}", signer_name: "B Abe", signer_title: "CEO", expected_supplier_version: "${sup_v2}" }, as: SupplierContact, as_user_id: "${sup_id}", captures: { ack2: $.data.id, ack2_sup: $.data.supersedes_acknowledgment_id } }
            - { call: "GET /suppliers/${sup_id}", payload: {}, as: ComplianceOfficer, captures: { cur_cv: $.data.current_code_version_id, sup_v3: $.data.version } }
          assert:
            - "${ack1_sup} == null (first acknowledgment supersedes nothing)"
            - "${ack2_sup} == ${ack1} (self-referential supersede link)"
            - "${cur_cv} == ${cv2} and ${sup_v3} == 3 (each acknowledgment bumped Supplier.version)"

      - name: audit_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns the error envelope with ERR_NOT_FOUND and http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /audits/11111111-2222-4333-8444-555555555555", payload: {}, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: facility_create_missing_required_field
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required worker_count from POST /facilities returns ERR_INVALID_REQUEST (400); no facility is created."
        test_recipe:
          setup: ["Supplier registered (ONBOARDING is sufficient for facility creation)"]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { legal_name: "Victor Supplies", country_code: "US", sector: "HARDLINES" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id } }
          trigger:
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "No Workers Site", country_code: "US", processes: ["packing"] }, as: SourcingProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: audit_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Audit.fields.audit_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "audit_type 'QUARTERLY' is outside the declared enum and must be rejected with ERR_INVALID_REQUEST before any state or business rule runs."
        test_recipe:
          setup: ["Supplier ACTIVE with acknowledgment; facility US / 10; auditor covers US"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Whiskey Apparel", country_code: "US", sector: "APPAREL" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "C Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site Q", country_code: "US", worker_count: 10, processes: ["sewing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "QUARTERLY", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: supplier_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id, response_type array, and pagination fields limit/offset/total_count/has_more honoring defaults (limit 10) and explicit values."
        test_recipe:
          setup: ["Two suppliers exist"]
          setup_api_calls:
            - { call: "POST /suppliers", payload: { legal_name: "Xray One", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { s1: $.data.id } }
            - { call: "POST /suppliers", payload: { legal_name: "Xray Two", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { s2: $.data.id } }
          trigger:
            - { call: "GET /suppliers", payload: { limit: 1, offset: 0 }, as: ComplianceOfficer, captures: { first: "$.data[0].id" } }
            - { call: "GET /suppliers", payload: { limit: 1, offset: 1 }, as: ComplianceOfficer }
          assert:
            - "page 1: envelope response_type == array, total_count == 2, limit == 1, offset == 0, has_more == true, exactly one item (${first} present)"
            - "page 2: total_count == 2, has_more == false, exactly one item, and meta.api_request_id is present on every response"

      - name: worker_interview_record_common_fields_light
        claim_type: immutability
        grounds: [entities.WorkerInterviewRecord]
        distinguishing_aspect: "common_fields: false — the record carries id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["Audit IN_PROGRESS at a US / 10-worker facility"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Yankee Parts", country_code: "US", sector: "HARDLINES" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "D Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site W", country_code: "US", worker_count: 10, processes: ["molding"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
          trigger:
            - { call: "POST /audits/${au_id}/worker-interviews", payload: { interview_count: 4, forced_labor_indicators: true, recruitment_fee_indicators: false, notes: "Two workers mentioned deductions" }, as: Auditor, as_user_id: "${aud_id}", captures: { rec_id: $.data.id, rec_count: $.data.interview_count, rec_flag: $.data.forced_labor_indicators } }
          assert:
            - "${rec_id} present and ${rec_count} == 4 and ${rec_flag} == true; response carries id and created_at only (no version field)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: audit_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.Audit]
        distinguishing_aspect: "A freshly created audit has status SCHEDULED and zeroed tallies."
        test_recipe:
          setup: ["Supplier ACTIVE; facility US / 10; auditor covers US"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Zulu Goods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "E Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site V", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { st: $.data.status, zt: $.data.zt_count, mj: $.data.major_count, mn: $.data.minor_count } }
          assert:
            - "${st} == SCHEDULED and ${zt} == 0 and ${mj} == 0 and ${mn} == 0"

      - name: audit_start_from_report_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Audit.transitions, "errors[ERR_AUDIT_INVALID_STATE]"]
        distinguishing_aspect: "start is only valid from SCHEDULED; from REPORT_SUBMITTED it returns ERR_AUDIT_INVALID_STATE and no state change occurs."
        test_recipe:
          setup: ["Audit REPORT_SUBMITTED (started, interview recorded, report submitted)"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Alfa Goods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "F Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site U", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/worker-interviews", payload: { interview_count: 4, forced_labor_indicators: false, recruitment_fee_indicators: false }, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/submit-report", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
          trigger:
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_AUDIT_INVALID_STATE and the audit remains REPORT_SUBMITTED"

      - name: audit_submit_after_complete_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Audit, "errors[ERR_AUDIT_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: submit-report afterwards returns ERR_AUDIT_INVALID_STATE."
        test_recipe:
          setup: ["Audit COMPLETED (full happy path, no findings, no grievances)"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Bravo Goods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "G Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site T", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/worker-interviews", payload: { interview_count: 4, forced_labor_indicators: false, recruitment_fee_indicators: false }, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/submit-report", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/decide", payload: { decision: "COMPLETE" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /audits/${au_id}/submit-report", payload: {}, as: Auditor, as_user_id: "${aud_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_AUDIT_INVALID_STATE and the audit remains COMPLETED"

      - name: cap_review_after_verified_passed_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CorrectiveActionPlan, "errors[ERR_CAP_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED_PASSED is the CAP's terminal state: a further review call returns ERR_CAP_INVALID_STATE."
        test_recipe:
          setup: ["CAP fully verified (create -> approve -> request-verification -> verify PASS by second auditor); finding VERIFIED_CLOSED"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v1.0", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
            - { call: "POST /code-versions/${cv_id}/transition", payload: { to_status: "PUBLISHED" }, as: SourcingProgramAdmin }
            - { call: "POST /suppliers", payload: { legal_name: "Charlie Goods", country_code: "US", sector: "FOOD" }, as: SourcingProgramAdmin, captures: { sup_id: $.data.id, sup_v: $.data.version } }
            - { call: "POST /code-acknowledgments", payload: { supplier_id: "${sup_id}", code_version_id: "${cv_id}", signer_name: "H Abe", signer_title: "CEO", expected_supplier_version: "${sup_v}" }, as: SupplierContact, as_user_id: "${sup_id}" }
            - { call: "POST /facilities", payload: { supplier_id: "${sup_id}", name: "Site S", country_code: "US", worker_count: 10, processes: ["packing"] }, as: SourcingProgramAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Lead Auditor", firm_name: "AuditCo", certifications: ["SA8000"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud_id: $.data.id } }
            - { call: "POST /auditors", payload: { full_name: "Verifier", firm_name: "VerifyCo", certifications: ["SMETA"], country_codes_covered: ["US"] }, as: AuditCoordinator, captures: { aud2_id: $.data.id } }
            - { call: "POST /audits", payload: { facility_id: "${fac_id}", auditor_id: "${aud_id}", audit_type: "INITIAL", announcement: "ANNOUNCED", scheduled_start: "2026-09-01T00:00:00Z", scheduled_end: "2026-09-02T00:00:00Z" }, as: AuditCoordinator, captures: { au_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SourcingProgramAdmin }
            - { call: "POST /audits/${au_id}/start", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /audits/${au_id}/findings", payload: { classification: "MAJOR", category: "WAGES", description: "Overtime premium missing" }, as: Auditor, as_user_id: "${aud_id}", captures: { f_id: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { finding_id: "${f_id}", actions: [{ description: "Pay back wages", owner: "HR", due_date: "2026-10-01T00:00:00Z" }] }, as: SupplierContact, as_user_id: "${sup_id}", captures: { cap_id: $.data.id } }
            - { call: "POST /corrective-action-plans/${cap_id}/review", payload: { decision: "APPROVE" }, as: ComplianceOfficer }
