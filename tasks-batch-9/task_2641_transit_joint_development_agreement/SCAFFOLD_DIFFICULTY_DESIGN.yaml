  - rule_id: boundary_precision_check
    instances:
      - name: release_for_solicitation_readiness_boundary_70_00_versus_69_99
        grounds:
          - calculations.readiness_composite_score
          - validations[priority=11]
          - errors[ERR_SITE_NOT_READY]
          - entities.AgencySite.fields.readiness_tier
        distinguishing_aspect: |
          A two-decimal numeric threshold on the readiness metric reached through
          POST /jda/sites/{id}/release-for-solicitation: federal_interest_pct 2.5 scores exactly 70.00 and
          passes the `>=` test, while 2.6 scores 69.99 and is refused — one hundredth of a point decides it.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "Site READY: federal_interest_pct 2.5, scores 80/75/70/60 with encumbrance_count 1, certified to composite 70.00 and released successfully"
            - "Site EDGE: identical scores but federal_interest_pct 2.6, certified to composite 69.99, still in ASSESSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-B-001", name: "Kingfisher Park-and-Ride A", address_line: "1 Kingfisher Way", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_ready: $.data.id }
            - call: "POST /jda/sites/${site_ready}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_ready: $.data.id }
            - call: "POST /jda/assessments/${asmt_ready}/certify"
              payload: { }
              as: RealEstateOfficer
              captures: { score_ready: $.data.composite_score, tier_ready: $.data.tier }
            - call: "POST /jda/sites/${site_ready}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
              captures: { status_ready: $.data.status }
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-B-002", name: "Kingfisher Park-and-Ride B", address_line: "2 Kingfisher Way", parcel_area_sqft: 61000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.6, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_edge: $.data.id }
            - call: "POST /jda/sites/${site_edge}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_edge: $.data.id }
            - call: "POST /jda/assessments/${asmt_edge}/certify"
              payload: { }
              as: RealEstateOfficer
              captures: { score_edge: $.data.composite_score, tier_edge: $.data.tier }
          trigger:
            - call: "POST /jda/sites/${site_edge}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${score_ready} == 70.00"
            - "${tier_ready} == READY"
            - "${status_ready} == SOLICITATION_READY"
            - "${score_edge} == 69.99"
            - "${tier_edge} == CONDITIONAL"
            - "HTTP status == 409"
            - "${err} == ERR_SITE_NOT_READY"
            - "AgencySite.${site_edge}.status == ASSESSED"
            - "AgencySite.${site_edge}.readiness_composite_score == 69.99"

