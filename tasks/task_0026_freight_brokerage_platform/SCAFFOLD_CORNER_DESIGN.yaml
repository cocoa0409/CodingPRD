              captures: { q_id: $.data.id, q_v: $.data.version }
          trigger:
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c_id}", expected_quote_request_version: "${q_v} - 1" }
              as: BrokerOps
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == 'ERR_STALE_VERSION'"
            - "response.http_status == 412"
            - "QuoteRequest.${q_id}.status == 'OPEN'"

