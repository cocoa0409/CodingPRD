scenario: "desgin task harder than expert level.!!!! 2136. Health Plan Care Management Program (health plan care management): member stratification & program eligibility, care plan creation with goals & interventions, care manager caseload & touch cadence, transitions-of-care outreach after discharge, community/social-need referral & closed loop, program engagement & disenrollment criteria, outcome & ROI measurement, documentation for accreditation"
domain_name: "health-plan-care-management"
api_prefix: "/care-management"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy
  entity_topology: graph
  # Peer entities linked by FK in request bodies (CarePlan, Touch, Referral, SocialNeed,
  # RoiMeasurement, TransitionEvent are all created flat with FKs in the body), plus a
  # self-referential FK (TransitionEvent.index_admission_event_id -> TransitionEvent.id)
  # and cross-aggregate references (Referral -> CommunityResource, Enrollment -> CareManager).
  state_machine_shape: parallel
  # Enrollment carries two independent state dimensions (enrollment_status x engagement_status);
  # CarePlan is cyclic (PENDING_REVIEW -> DRAFT revision loop, ACTIVE <-> SUSPENDED);
  # Referral is branching fork-join (SENT -> {ACCEPTED, DECLINED} -> CLOSED_*).
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The ClinicalReviewer who approves a CarePlan is backed by the same CareManager entity as
  # its author, and MUST NOT be the author (ERR_SEGREGATION_OF_DUTIES).
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: external_member_id
        type: string
        source: input
        description: "Health-plan member number; unique across all Members."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Member legal name."
      - name: birth_date
        type: string
        source: input
        description: "ISO 8601 calendar date (YYYY-MM-DD)."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of residence; matched against CareManager.licensed_state_codes and CommunityResource.service_state_codes."
        constraints: "exactly 2 uppercase letters"
      - name: chronic_condition_count
        type: integer
        source: input
        description: "Count of active chronic conditions; feeds chronic_points in risk_stratification_score."
        default: 0
        constraints: ">= 0"
      - name: social_data_consent_status
        type: enum
        source: input
        description: "Consent to share social-need data with community partners. Toggled by POST /care-management/members/{id}/consent."
        default: "GRANTED"
        constraints: "one of GRANTED, REVOKED"
      - name: latest_concurrent_score
        type: integer
        source: computed
        description: "score of the newest RiskStratification for this Member with variant == CONCURRENT (order by as_of_date DESC, then created_at DESC). null when none exists."
      - name: latest_concurrent_tier
        type: enum
        source: computed
        description: "tier of that same CONCURRENT RiskStratification. null when none exists."
        constraints: "one of LOW, MODERATE, RISING, HIGH, null"
      - name: latest_prospective_score
        type: integer
        source: computed
        description: "score of the newest RiskStratification for this Member with variant == PROSPECTIVE (order by as_of_date DESC, then created_at DESC). null when none exists."
      - name: latest_prospective_tier
        type: enum
        source: computed
        description: "tier of that same PROSPECTIVE RiskStratification. null when none exists."
        constraints: "one of LOW, MODERATE, RISING, HIGH, null"

  - name: RiskStratification
    parent: Member
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the stratified member."
      - name: variant
        type: enum
        source: input
        description: "Which stratification algorithm was run."
        constraints: "one of CONCURRENT, PROSPECTIVE"
      - name: as_of_date
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) of the logical clock at computation time."
      - name: utilization_points
        type: number
        source: computed
        description: "Sum of recency-weighted event points over the variant's included TransitionEvent set. 1 decimal place."
      - name: chronic_points
        type: number
        source: computed
        description: "Member.chronic_condition_count * CHRONIC_POINT_VALUE."
      - name: social_need_points
        type: number
        source: computed
        description: "min(SDOH_POINT_CAP, count of SocialNeed rows with status IN {IDENTIFIED, REFERRED, UNMET_ESCALATED} on this member's Enrollments with enrollment_status IN {PENDING, ACTIVE}) * SDOH_POINT_VALUE, capped."
      - name: raw_score
        type: number
        source: computed
        description: "utilization_points + chronic_points + social_need_points, 1 decimal place, before rounding and capping."
      - name: score
        type: integer
        source: computed
        description: "min(100, round_half_up(raw_score, 0))."
        constraints: "0..100"
      - name: tier
        type: enum
        source: computed
        description: "Band of score: HIGH when score >= 85, RISING when 60 <= score < 85, MODERATE when 35 <= score < 60, LOW when score < 35."
        constraints: "one of LOW, MODERATE, RISING, HIGH"
      - name: included_event_count
        type: integer
        source: computed
        description: "Number of TransitionEvent rows that entered utilization_points under this variant."

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Program display name."
      - name: min_risk_tier
        type: enum
        source: input
        description: "Lowest tier eligible to enroll. Tier rank order LOW(0) < MODERATE(1) < RISING(2) < HIGH(3)."
        constraints: "one of LOW, MODERATE, RISING, HIGH"
      - name: stratification_variant
        type: enum
        source: input
        description: "Which RiskStratification variant this program reads for eligibility and for Enrollment.risk_tier_at_enrollment."
        constraints: "one of CONCURRENT, PROSPECTIVE"
      - name: required_credential_levels
        type: array
        source: input
        description: "Credential levels a CareManager must hold to carry this program's Enrollments."
        constraints: "non-empty subset of [RN, LCSW, CHW]"
      - name: care_plan_review_interval_days
        type: integer
        source: input
        description: "Days after CarePlan.approved_at until CarePlan.next_review_due_at."
        default: 90
      - name: toc_outreach_hours
        type: integer
        source: input
        description: "Hours after a DISCHARGE TransitionEvent by which a TOC touch must be completed."
        default: 48
      - name: referral_loop_days
        type: integer
        source: input
        description: "Days after Referral.sent_at beyond which an unclosed loop counts as a REFERRAL_LOOP_OPEN accreditation deficiency."
        default: 30
      - name: staff_minute_budget
        type: integer
        source: input
        description: "Ceiling on committed_staff_minutes + delivered_staff_minutes for this program."
      - name: hourly_cost_cents
        type: integer
        source: input
        description: "Loaded staff cost per hour in cents; drives Intervention.cost_cents."
      - name: cohort_benchmark_pmpm_cents
        type: integer
        source: input
        description: "Matched-cohort benchmark per-member-per-month cost in cents; used only by the MATCHED_COHORT ROI variant."
      - name: committed_staff_minutes
        type: integer
        source: computed
        description: "Sum of Intervention.staff_minutes for Interventions in status PLANNED whose goal -> care_plan -> enrollment.program_id == this Program.id."
        default: 0
      - name: delivered_staff_minutes
        type: integer
        source: computed
        description: "Same sum restricted to Interventions in status COMPLETED."
        default: 0

  - name: CareManager
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Care manager name."
      - name: credential_level
        type: enum
        source: input
        description: "Licensure class; matched against Program.required_credential_levels."
        constraints: "one of RN, LCSW, CHW"
      - name: licensed_state_codes
        type: array
        source: input
        description: "Two-letter state codes this care manager is licensed in; must contain Member.state_code to carry that member."
        constraints: "non-empty array of 2-letter codes"
      - name: capacity_points
        type: number
        source: input
        description: "Maximum caseload points this care manager may carry. 1 decimal place."
        constraints: "> 0"
      - name: assigned_caseload_points
        type: number
        source: computed
        description: "Sum of Enrollment.acuity_weight_points over Enrollments with care_manager_id == this id and enrollment_status IN {PENDING, ACTIVE}. 1 decimal place."
        default: 0.0
      - name: capacity_status
        type: enum
        source: computed
        description: "OVER_CAPACITY when assigned_caseload_points > capacity_points, otherwise OPEN. Equality is OPEN."
        default: "OPEN"
        constraints: "one of OPEN, OVER_CAPACITY"
      - name: active_enrollment_count
        type: integer
        source: computed
        description: "Count of Enrollments with care_manager_id == this id and enrollment_status == ACTIVE."
        default: 0

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the enrolled member."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the care management program."
      - name: care_manager_id
        type: string
        source: input
        description: "FK -> CareManager.id; owning care manager. Supplied explicitly or chosen by the care_manager_auto_assignment selector. Never null after a successful create."
      - name: enrollment_status
        type: enum
        source: system
        description: "Lifecycle dimension 1 of the Enrollment parallel state machine."
        default: "PENDING"
        constraints: "one of PENDING, ACTIVE, GRADUATED, DISENROLLED"
      - name: engagement_status
        type: enum
        source: system
        description: "Lifecycle dimension 2 of the Enrollment parallel state machine; evolves independently of enrollment_status."
        default: "UNREACHED"
        constraints: "one of UNREACHED, ENGAGED, AT_RISK, DISENGAGED"
      - name: risk_tier_at_enrollment
        type: enum
        source: computed
        description: "Snapshot of the member's latest RiskStratification.tier for the variant named by Program.stratification_variant, frozen at create time."
        constraints: "one of LOW, MODERATE, RISING, HIGH"
      - name: risk_score_at_enrollment
        type: integer
        source: computed
        description: "Snapshot of that same RiskStratification.score, frozen at create time."
      - name: cadence_tier
        type: enum
        source: computed
        description: "Current outreach cadence band; recomputed by touch_cadence_tier_assignment after every event that can change it."
        default: "STANDARD"
        constraints: "one of STANDARD, INTENSIVE, TOC_INTENSIVE"
      - name: cadence_tier_snapshot
        type: enum
        source: computed
        description: "cadence_tier as it stood at the start of the current engagement measurement window; set at activation and refreshed only by a TOC escalation. Sole denominator input for engagement_score."
        default: "STANDARD"
        constraints: "one of STANDARD, INTENSIVE, TOC_INTENSIVE"
      - name: pre_toc_cadence_tier
        type: enum
        source: computed
        description: "cadence_tier as it stood immediately before the TOC escalation; restored when the TOC obligation is satisfied. null when no TOC obligation is open."
        constraints: "one of STANDARD, INTENSIVE, null"
      - name: acuity_weight_points
        type: number
        source: computed
        description: "Caseload weight this Enrollment consumes; TIER_POINTS[risk_tier_at_enrollment] * CADENCE_MULTIPLIER[cadence_tier], 1 decimal place."
        default: 0.0
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PENDING -> ACTIVE transition; null while PENDING."
      - name: disenrolled_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into GRADUATED or DISENROLLED; null otherwise."
      - name: disenrollment_reason
        type: enum
        source: system
        description: "Reason supplied on POST /care-management/enrollments/{id}/disenroll; null while non-terminal."
        constraints: "one of GOALS_MET, LOST_CONTACT, MEMBER_REQUEST, INELIGIBLE, DECEASED, null"
      - name: next_touch_due_at
        type: datetime
        source: computed
        description: "Output of next_touch_due_at_projection; null while PENDING and after a terminal transition."
      - name: toc_due_at
        type: datetime
        source: computed
        description: "Deadline for the transitions-of-care touch after a DISCHARGE event; null when no TOC obligation is open."
      - name: last_reached_touch_at
        type: datetime
        source: computed
        description: "completed_at of the most recent Touch with status COMPLETED and outcome REACHED on this Enrollment; null when none."
      - name: consecutive_failed_outreach_count
        type: integer
        source: computed
        description: "Number of COMPLETED Touches with outcome NOT_REACHED since the last COMPLETED Touch with outcome REACHED; reset to 0 by a REACHED completion."
        default: 0
      - name: reached_touch_count
        type: integer
        source: computed
        description: "Count of COMPLETED Touches with outcome REACHED whose completed_at lies inside the current 90-day engagement window."
        default: 0
      - name: engagement_score
        type: integer
        source: computed
        description: "Output of engagement_score_evaluation, 0..100."
        default: 0
      - name: assignment_reason
        type: enum
        source: system
        description: "How care_manager_id was set."
        default: "EXPLICIT"
        constraints: "one of EXPLICIT, AUTO_SELECTED, TRANSFERRED"

  - name: CarePlan
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment this plan governs."
      - name: authored_by_care_manager_id
        type: string
        source: system
        description: "FK -> CareManager.id; the X-User-ID of the CareManager who created the plan. Basis of the segregation-of-duties check on review."
      - name: reviewed_by_care_manager_id
        type: string
        source: system
        description: "FK -> CareManager.id; the X-User-ID of the ClinicalReviewer who last decided on the plan. null before the first review."
      - name: title
        type: string
        source: input
        description: "Plan title carried in the accreditation file."
      - name: status
        type: enum
        source: system
        description: "Cyclic care-plan lifecycle."
        default: "DRAFT"
        constraints: "one of DRAFT, PENDING_REVIEW, ACTIVE, SUSPENDED, CLOSED"
      - name: plan_version_no
        type: integer
        source: computed
        description: "Starts at 1; incremented by one on every PENDING_REVIEW -> DRAFT revision-requested transition."
        default: 1
      - name: revision_count
        type: integer
        source: computed
        description: "Number of REVISION_REQUESTED decisions recorded on this plan."
        default: 0
      - name: review_decision
        type: enum
        source: system
        description: "Most recent reviewer decision; null before the first review."
        constraints: "one of APPROVED, REVISION_REQUESTED, null"
      - name: revision_note
        type: string
        source: system
        description: "Reviewer note attached to the most recent REVISION_REQUESTED decision; null otherwise."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent DRAFT -> PENDING_REVIEW transition."
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent PENDING_REVIEW -> ACTIVE transition; null until first approval."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into CLOSED; null otherwise."
      - name: next_review_due_at
        type: datetime
        source: computed
        description: "approved_at + Program.care_plan_review_interval_days days; null until first approval."
      - name: at_risk_goal_count
        type: integer
        source: computed
        description: "Count of CarePlanGoal rows under this plan with status == AT_RISK."
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: "DEFICIENT when status == SUSPENDED; AT_RISK when at_risk_goal_count >= 1; otherwise COMPLIANT."
        default: "COMPLIANT"
        constraints: "one of COMPLIANT, AT_RISK, DEFICIENT"

  - name: CarePlanGoal
    parent: CarePlan
    common_fields: true
    fields:
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; owning plan."
      - name: domain
        type: enum
        source: input
        description: "Goal domain. The four social domains are also SocialNeed.domain values, which is how a social-need escalation finds the goals it puts at risk."
        constraints: "one of CLINICAL, MEDICATION, BEHAVIORAL, FOOD, HOUSING, TRANSPORTATION, UTILITIES"
      - name: description
        type: string
        source: input
        description: "Goal statement."
      - name: target_date
        type: string
        source: input
        description: "ISO 8601 calendar date the goal aims to be met by."
      - name: status
        type: enum
        source: system
        description: "Goal lifecycle."
        default: "OPEN"
        constraints: "one of OPEN, AT_RISK, MET, CLOSED_UNMET"
      - name: barrier_flag
        type: boolean
        source: computed
        description: "true once an escalated SocialNeed in the same domain has put this goal at risk."
        default: false
      - name: planned_intervention_count
        type: integer
        source: computed
        description: "Count of Interventions under this goal with status == PLANNED."
        default: 0
      - name: completed_intervention_count
        type: integer
        source: computed
        description: "Count of Interventions under this goal with status == COMPLETED."
        default: 0

  - name: Intervention
    parent: CarePlanGoal
    common_fields: true
    fields:
      - name: goal_id
        type: string
        source: input
        description: "FK -> CarePlanGoal.id; owning goal."
      - name: modality
        type: enum
        source: input
        description: "How the intervention is delivered."
        constraints: "one of PHONE, HOME_VISIT, EDUCATION, REFERRAL_COORDINATION, MEDICATION_REVIEW"
      - name: staff_minutes
        type: integer
        source: input
        description: "Planned staff minutes; consumes Program.staff_minute_budget."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Intervention lifecycle."
        default: "PLANNED"
        constraints: "one of PLANNED, COMPLETED, VOIDED"
      - name: cost_cents
        type: integer
        source: computed
        description: "round_half_up(staff_minutes * Program.hourly_cost_cents / 60, 0), frozen at create time. Summed as-is by ROI; never recomputed from aggregate minutes."
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PLANNED -> COMPLETED transition; null otherwise."
      - name: void_reason
        type: string
        source: system
        description: "Reason recorded on the PLANNED -> VOIDED transition; null otherwise."

  - name: Touch
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment being contacted."
      - name: care_manager_id
        type: string
        source: input
        description: "FK -> CareManager.id; the care manager whose calendar the touch occupies."
      - name: touch_type
        type: enum
        source: input
        description: "TOC touches are the only ones that can satisfy an open toc_due_at obligation."
        constraints: "one of ROUTINE, TOC, ASSESSMENT"
      - name: modality
        type: enum
        source: input
        description: "Contact channel."
        constraints: "one of PHONE, VIDEO, HOME_VISIT"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Inclusive start of the calendar occupation."
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "Exclusive end of the calendar occupation; must be strictly after scheduled_start_at."
      - name: status
        type: enum
        source: system
        description: "Touch lifecycle."
        default: "SCHEDULED"
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED"
      - name: outcome
        type: enum
        source: system
        description: "Result recorded at completion; null while SCHEDULED or CANCELLED."
        constraints: "one of REACHED, NOT_REACHED, null"
      - name: documentation_note
        type: string
        source: input
        description: "Accreditation-required contact note; must be non-empty when outcome == REACHED. null otherwise."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SCHEDULED -> COMPLETED transition; null otherwise."
      - name: cancel_reason
        type: string
        source: system
        description: "Reason recorded on the SCHEDULED -> CANCELLED transition; null otherwise."
      - name: satisfied_toc_obligation
        type: boolean
        source: computed
        description: "true when this completion cleared the enrollment's toc_due_at obligation."
        default: false

  - name: TransitionEvent
    parent: Member
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member the utilization event belongs to."
      - name: index_admission_event_id
        type: string
        source: input
        description: "FK -> TransitionEvent.id; for a DISCHARGE, the admission event it closes. null for non-DISCHARGE events."
      - name: event_type
        type: enum
        source: input
        description: "Utilization event class. DISCHARGE carries no episode cost and is the only type that opens a TOC obligation."
        constraints: "one of INPATIENT_ADMISSION, ED_VISIT, OBSERVATION_STAY, SCHEDULED_ADMISSION, DISCHARGE"
      - name: occurred_at
        type: datetime
        source: input
        description: "Logical-clock instant of the event. SCHEDULED_ADMISSION events sit in the future."
      - name: facility_name
        type: string
        source: input
        description: "Facility label carried into the accreditation file."
      - name: episode_cost_cents
        type: integer
        source: input
        description: "Allowed cost of the episode in cents; only CLOSED events enter ROI member-month costs."
        default: 0
      - name: adjudication_status
        type: enum
        source: input
        description: "CLOSED means the claim is adjudicated. Only CLOSED events enter the CONCURRENT stratification variant and every ROI member-month cost."
        default: "OPEN"
        constraints: "one of OPEN, CLOSED"
      - name: discharge_disposition
        type: enum
        source: input
        description: "Required when event_type == DISCHARGE, null otherwise."
        constraints: "one of HOME, SNF, HOME_HEALTH, AMA, EXPIRED, null"
      - name: toc_triggered_enrollment_count
        type: integer
        source: computed
        description: "Number of Enrollments this event escalated to TOC_INTENSIVE; 0 for non-DISCHARGE events."
        default: 0

  - name: SocialNeed
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment the need was identified on."
      - name: domain
        type: enum
        source: input
        description: "Social domain; matched against CommunityResource.served_domains and CarePlanGoal.domain."
        constraints: "one of FOOD, HOUSING, TRANSPORTATION, UTILITIES"
      - name: severity
        type: enum
        source: input
        description: "Assessed severity."
        constraints: "one of LOW, MODERATE, SEVERE"
      - name: status
        type: enum
        source: system
        description: "Closed-loop lifecycle of the need."
        default: "IDENTIFIED"
        constraints: "one of IDENTIFIED, REFERRED, RESOLVED, UNMET_ESCALATED"
      - name: escalation_count
        type: integer
        source: computed
        description: "Number of times this need has landed in UNMET_ESCALATED."
        default: 0
      - name: identified_at
        type: datetime
        source: system
        description: "Logical-clock instant of creation."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into RESOLVED; null otherwise."

  - name: CommunityResource
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Community-based organization name."
      - name: served_domains
        type: array
        source: input
        description: "SocialNeed domains this organization accepts."
        constraints: "non-empty subset of [FOOD, HOUSING, TRANSPORTATION, UTILITIES]"
      - name: service_state_codes
        type: array
        source: input
        description: "Two-letter state codes this organization serves."
        constraints: "non-empty array of 2-letter codes"
      - name: contract_status
        type: enum
        source: input
        description: "Only CONTRACTED organizations may receive new Referrals."
        default: "CONTRACTED"
        constraints: "one of CONTRACTED, NOT_CONTRACTED, SUSPENDED"
      - name: concurrent_slot_capacity
        type: integer
        source: input
        description: "Maximum number of Referrals in status IN {SENT, ACCEPTED} whose half-open service intervals may cover any single instant."
        constraints: ">= 1"
      - name: open_referral_count
        type: integer
        source: computed
        description: "Count of Referrals against this resource with status IN {SENT, ACCEPTED}."
        default: 0
      - name: closed_loop_count
        type: integer
        source: computed
        description: "Count of Referrals against this resource with status IN {CLOSED_MET, CLOSED_UNMET}."
        default: 0

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: social_need_id
        type: string
        source: input
        description: "FK -> SocialNeed.id; the need being referred out."
      - name: community_resource_id
        type: string
        source: input
        description: "FK -> CommunityResource.id; the receiving organization."
      - name: sent_by_care_manager_id
        type: string
        source: system
        description: "FK -> CareManager.id; the X-User-ID of the CareManager who sent the referral."
      - name: status
        type: enum
        source: system
        description: "Branching closed-loop lifecycle."
        default: "SENT"
        constraints: "one of SENT, ACCEPTED, DECLINED, CLOSED_MET, CLOSED_UNMET"
      - name: service_start_at
        type: datetime
        source: input
        description: "Inclusive start of the half-open service interval occupying a slot on the resource."
      - name: service_end_at
        type: datetime
        source: input
        description: "Exclusive end of that interval; must be strictly after service_start_at."
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant of creation."
      - name: decision_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SENT -> ACCEPTED or SENT -> DECLINED transition; null otherwise."
      - name: decline_reason
        type: string
        source: system
        description: "Reason recorded on a DECLINED decision; null otherwise."
      - name: outcome_note
        type: string
        source: input
        description: "Closed-loop note recorded at loop closure; null before closure."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into CLOSED_MET or CLOSED_UNMET; null otherwise."
      - name: loop_closure_hours
        type: integer
        source: computed
        description: "Whole hours from sent_at to closed_at, truncated toward zero; null before closure."

  - name: RoiMeasurement
    parent: Enrollment
    common_fields: false
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the measured enrollment."
      - name: method
        type: enum
        source: input
        description: "Which ROI algorithm produced this row."
        constraints: "one of PRE_POST, MATCHED_COHORT"
      - name: baseline_pmpm_cents
        type: integer
        source: computed
        description: "PRE_POST only: round_half_up(sum of qualifying baseline episode costs / 12, 0). 0 for MATCHED_COHORT."
      - name: monthly_projected_cost_cents
        type: integer
        source: computed
        description: "The per-member-month projected cost after rounding; the value that is multiplied out across intervention months."
      - name: intervention_month_count
        type: integer
        source: computed
        description: "Number of whole calendar months fully inside [activated_at, measurement_end_at)."
      - name: projected_cost_cents
        type: integer
        source: computed
        description: "monthly_projected_cost_cents * intervention_month_count."
      - name: actual_cost_cents
        type: integer
        source: computed
        description: "Sum of episode_cost_cents over CLOSED TransitionEvents inside the intervention months."
      - name: gross_savings_cents
        type: integer
        source: computed
        description: "Sum over intervention months of (monthly_projected_cost_cents - that month's actual cost); may be negative."
      - name: program_cost_cents
        type: integer
        source: computed
        description: "Sum of Intervention.cost_cents over COMPLETED Interventions on this enrollment's CarePlans, summed as stored."
      - name: net_savings_cents
        type: integer
        source: computed
        description: "gross_savings_cents - program_cost_cents."
      - name: roi_ratio
        type: number
        source: computed
        description: "round_half_up(net_savings_cents / program_cost_cents, 2); null when program_cost_cents == 0."
      - name: measurement_end_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the measurement was taken."
      - name: superseded
        type: boolean
        source: computed
        description: "true once a newer RoiMeasurement exists for the same enrollment_id and method."
        default: false

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  # ---- Enrollment, dimension 1 of 2 (parallel state machine) ----
  - entity: Enrollment
    dimension: enrollment_status
    initial_state: PENDING
    terminal_states: [GRADUATED, DISENROLLED]
    note: |
      Enrollment carries two independent state dimensions. enrollment_status (this machine)
      and engagement_status (the next machine) advance on disjoint triggers and neither
      dimension's transition set is a function of the other's current value, except that
      engagement transitions are only recorded while enrollment_status == ACTIVE.
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /care-management/enrollments/{id}/activate"
        actor: CareManager
        preconditions:
          - "enrollment_status == PENDING"
        side_effects:
          - "activated_at := logical clock now"
          - "cadence_tier := touch_cadence_tier_assignment output (INTENSIVE when risk_tier_at_enrollment == HIGH, else STANDARD)"
          - "cadence_tier_snapshot := cadence_tier"
          - "acuity_weight_points := caseload_weight_points recomputed with the new cadence_tier"
          - "CareManager.assigned_caseload_points recomputed from that new weight (ledger sync)"
          - "CareManager.capacity_status recomputed from the new assigned_caseload_points; this transition performs NO capacity precheck, so an activation may itself flip the owner to OVER_CAPACITY"
          - "CareManager.active_enrollment_count += 1"
          - "next_touch_due_at := next_touch_due_at_projection with base = activated_at"
          - "engagement_score := 0; reached_touch_count := 0"
          - "version += 1"
      - from: PENDING
        to: DISENROLLED
        trigger: "POST /care-management/enrollments/{id}/disenroll"
        actor: CareManager
        preconditions:
          - "enrollment_status == PENDING"
          - "reason != GOALS_MET (a never-activated enrollment has no ACTIVE CarePlan)"
        side_effects:
          - "enrollment_status := DISENROLLED; disenrolled_at := now; disenrollment_reason := reason"
          - "acuity_weight_points is left as stored, but the enrollment leaves the {PENDING, ACTIVE} caseload set, so CareManager.assigned_caseload_points is recomputed downward"
          - "CareManager.capacity_status recomputed"
          - "next_touch_due_at := null; toc_due_at := null"
          - "version += 1"
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /care-management/enrollments/{id}/disenroll with reason IN {LOST_CONTACT, MEMBER_REQUEST, INELIGIBLE, DECEASED}"
        actor: CareManager
        preconditions:
          - "enrollment_status == ACTIVE"
        side_effects:
          - "enrollment_status := DISENROLLED; disenrolled_at := now; disenrollment_reason := reason"
          - "cascade hop 1: every Touch on this enrollment with status == SCHEDULED transitions SCHEDULED -> CANCELLED with cancel_reason 'ENROLLMENT_ENDED', which frees the care manager's calendar interval"
          - "cascade hop 2: the CarePlan on this enrollment with status IN {ACTIVE, SUSPENDED} transitions to CLOSED with closed_at := now"
          - "cascade hop 3: caused by hop 2, every CarePlanGoal under that plan with status IN {OPEN, AT_RISK} transitions to CLOSED_UNMET"
          - "cascade hop 4: caused by hop 3, every Intervention under those goals with status == PLANNED transitions to VOIDED with void_reason 'PLAN_CLOSED', releasing Program.committed_staff_minutes by each intervention's staff_minutes"
          - "CareManager.assigned_caseload_points recomputed downward; CareManager.capacity_status recomputed; CareManager.active_enrollment_count -= 1"
          - "next_touch_due_at := null; toc_due_at := null"
          - "version += 1"
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /care-management/enrollments/{id}/disenroll with reason == GOALS_MET"
        actor: CareManager
        preconditions:
          - "enrollment_status == ACTIVE"
          - "a CarePlan with status == ACTIVE exists for this enrollment"
          - "that plan has >= 1 CarePlanGoal and every one of them has status == MET"
        side_effects:
          - "enrollment_status := GRADUATED; disenrolled_at := now; disenrollment_reason := GOALS_MET"
          - "every SCHEDULED Touch on this enrollment transitions to CANCELLED with cancel_reason 'ENROLLMENT_ENDED'"
          - "the ACTIVE CarePlan transitions to CLOSED; no goal is reopened and no Intervention is voided because no goal is OPEN or AT_RISK"
          - "CareManager.assigned_caseload_points recomputed downward; capacity_status recomputed; active_enrollment_count -= 1"
          - "next_touch_due_at := null; toc_due_at := null"
          - "version += 1"
      - from: ACTIVE
        to: ACTIVE
        name: ACTIVE_to_ACTIVE_transfer
        trigger: "POST /care-management/enrollments/{id}/transfer"
        actor: ProgramAdmin
        preconditions:
          - "enrollment_status IN {PENDING, ACTIVE}"
          - "expected_enrollment_version == Enrollment.version"
          - "to_care_manager_id != care_manager_id"
          - "target CareManager.credential_level IN Program.required_credential_levels"
          - "Member.state_code IN target CareManager.licensed_state_codes"
          - "target CareManager.assigned_caseload_points + this Enrollment.acuity_weight_points <= target CareManager.capacity_points"
        side_effects:
          - "care_manager_id := to_care_manager_id; assignment_reason := TRANSFERRED"
          - "previous CareManager.assigned_caseload_points -= acuity_weight_points; target CareManager.assigned_caseload_points += acuity_weight_points; both capacity_status values recomputed"
          - "both CareManager.active_enrollment_count values adjusted when enrollment_status == ACTIVE"
          - "every Touch on this enrollment with status == SCHEDULED and care_manager_id == the previous manager transitions to CANCELLED with cancel_reason 'CARE_MANAGER_TRANSFER'"
          - "version += 1"
        note: "Self-loop on enrollment_status; the observable change is care_manager_id and the two caseload ledgers."

  # ---- Enrollment, dimension 2 of 2 (parallel state machine) ----
  - entity: Enrollment.engagement_status
    dimension: engagement_status
    initial_state: UNREACHED
    terminal_states: []
    note: |
      Cyclic: DISENGAGED -> ENGAGED is reachable, so an enrollment can re-engage without
      leaving the enrollment_status dimension's ACTIVE state. Every transition here is a
      system transition fired inside step 4 of the touch-completion side-effect order.
    transitions:
      - from: UNREACHED
        to: ENGAGED
        trigger: "system, during POST /care-management/touches/{id}/complete with outcome REACHED"
        actor: system
        preconditions:
          - "consecutive_failed_outreach_count < 3 after step 2 of the completion order"
          - "reached_touch_count >= 1 after step 2"
          - "engagement_score >= ENGAGED_SCORE_MIN (60) after step 3"
        side_effects:
          - "engagement_status := ENGAGED"
          - "cadence_tier recomputed by touch_cadence_tier_assignment (step 5)"
      - from: UNREACHED
        to: AT_RISK
        trigger: "system, during POST /care-management/touches/{id}/complete with outcome REACHED"
        actor: system
        preconditions:
          - "reached_touch_count >= 1 after step 2"
          - "engagement_score < ENGAGED_SCORE_MIN (60) after step 3"
          - "consecutive_failed_outreach_count < 3"
        side_effects:
          - "engagement_status := AT_RISK"
      - from: ENGAGED
        to: AT_RISK
        trigger: "system, during POST /care-management/touches/{id}/complete"
        actor: system
        preconditions:
          - "engagement_score < 60 after step 3 and consecutive_failed_outreach_count < 3"
        side_effects:
          - "engagement_status := AT_RISK"
      - from: AT_RISK
        to: ENGAGED
        trigger: "system, during POST /care-management/touches/{id}/complete with outcome REACHED"
        actor: system
        preconditions:
          - "engagement_score >= 60 after step 3 and consecutive_failed_outreach_count == 0"
        side_effects:
          - "engagement_status := ENGAGED"
          - "cadence_tier recomputed (step 5)"
      - from: AT_RISK
        to: DISENGAGED
        trigger: "system, during POST /care-management/touches/{id}/complete with outcome NOT_REACHED"
        actor: system
        preconditions:
          - "consecutive_failed_outreach_count >= DISENGAGE_FAILED_TOUCH_THRESHOLD (3) after step 2"
        side_effects:
          - "engagement_status := DISENGAGED"
          - "cadence_tier := INTENSIVE (step 5), which recomputes acuity_weight_points and both caseload ledgers"
          - "the CarePlan on this enrollment with status == ACTIVE transitions to SUSPENDED, whose compliance_posture becomes DEFICIENT"
      - from: UNREACHED
        to: DISENGAGED
        trigger: "system, during POST /care-management/touches/{id}/complete with outcome NOT_REACHED"
        actor: system
        preconditions:
          - "consecutive_failed_outreach_count >= 3 after step 2"
        side_effects:
          - "engagement_status := DISENGAGED"
          - "cadence_tier := INTENSIVE; acuity_weight_points and both caseload ledgers recomputed"
          - "the ACTIVE CarePlan transitions to SUSPENDED"
      - from: DISENGAGED
        to: ENGAGED
        trigger: "system, during POST /care-management/touches/{id}/complete with outcome REACHED"
        actor: system
        preconditions:
          - "consecutive_failed_outreach_count == 0 after step 2 (a REACHED completion resets it)"
          - "engagement_score >= 60 after step 3"
        side_effects:
          - "engagement_status := ENGAGED"
          - "the CarePlan on this enrollment with status == SUSPENDED transitions back to ACTIVE; compliance_posture recomputed"
          - "cadence_tier recomputed (step 5), releasing the INTENSIVE escalation"
      - from: DISENGAGED
        to: AT_RISK
        trigger: "system, during POST /care-management/touches/{id}/complete with outcome REACHED"
        actor: system
        preconditions:
          - "consecutive_failed_outreach_count == 0 after step 2"
          - "engagement_score < 60 after step 3"
        side_effects:
          - "engagement_status := AT_RISK"
          - "the SUSPENDED CarePlan transitions back to ACTIVE"

  # ---- Enrollment TOC escalation (system self-loop on enrollment_status) ----
  - entity: Enrollment.toc
    dimension: enrollment_status
    initial_state: ACTIVE
    terminal_states: []
    note: "Isolated so the transitions-of-care cascade has its own addressable transition."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        name: ACTIVE_to_ACTIVE_toc_escalation
        trigger: "system, during POST /care-management/transition-events with event_type == DISCHARGE"
        actor: system
        preconditions:
          - "enrollment_status == ACTIVE"
          - "Enrollment.member_id == the created TransitionEvent.member_id"
        side_effects:
          - "cascade hop 1: toc_due_at := DISCHARGE.occurred_at + Program.toc_outreach_hours hours; pre_toc_cadence_tier := cadence_tier; cadence_tier := TOC_INTENSIVE; cadence_tier_snapshot := TOC_INTENSIVE"
          - "cascade hop 2: caused by hop 1's cadence_tier change, acuity_weight_points := caseload_weight_points recomputed with CADENCE_MULTIPLIER[TOC_INTENSIVE] = 2.0"
          - "cascade hop 3: caused by hop 2, CareManager.assigned_caseload_points recomputed to the new sum over its {PENDING, ACTIVE} enrollments"
          - "cascade hop 4: caused by hop 3, CareManager.capacity_status := OVER_CAPACITY when assigned_caseload_points > capacity_points, which removes the manager from the care_manager_auto_assignment candidate pool"
          - "next_touch_due_at := next_touch_due_at_projection, whose TOC clamp caps the interval at TOC_CONTACT_INTERVAL_DAYS"
          - "TransitionEvent.toc_triggered_enrollment_count += 1"
          - "Enrollment.version += 1"
      - from: ACTIVE
        to: ACTIVE
        name: ACTIVE_to_ACTIVE_toc_satisfied
        trigger: "system, during POST /care-management/touches/{id}/complete with touch_type == TOC and outcome == REACHED"
        actor: system
        preconditions:
          - "toc_due_at is not null"
          - "Touch.completed_at <= toc_due_at"
        side_effects:
          - "Touch.satisfied_toc_obligation := true"
          - "toc_due_at := null; cadence_tier := pre_toc_cadence_tier; cadence_tier_snapshot := pre_toc_cadence_tier; pre_toc_cadence_tier := null"
          - "acuity_weight_points recomputed downward; CareManager.assigned_caseload_points and capacity_status recomputed"

  # ---- CarePlan (cyclic) ----
  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Cyclic: PENDING_REVIEW -> DRAFT (revision loop) and ACTIVE <-> SUSPENDED (engagement loop)."
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /care-management/care-plans/{id}/submit"
        actor: CareManager
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == authored_by_care_manager_id"
          - "the plan has >= 1 CarePlanGoal"
          - "Enrollment.enrollment_status == ACTIVE"
        side_effects:
          - "status := PENDING_REVIEW; submitted_at := now; version += 1"
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /care-management/care-plans/{id}/review with decision == APPROVE"
        actor: ClinicalReviewer
        preconditions:
          - "status == PENDING_REVIEW"
          - "X-User-ID != authored_by_care_manager_id (segregation of duties)"
          - "Enrollment.enrollment_status == ACTIVE"
        side_effects:
          - "status := ACTIVE; approved_at := now; review_decision := APPROVED; reviewed_by_care_manager_id := X-User-ID"
          - "next_review_due_at := approved_at + Program.care_plan_review_interval_days days"
          - "compliance_posture recomputed"
          - "version += 1"
      - from: PENDING_REVIEW
        to: DRAFT
        trigger: "POST /care-management/care-plans/{id}/review with decision == REQUEST_REVISION"
        actor: ClinicalReviewer
        preconditions:
          - "status == PENDING_REVIEW"
          - "X-User-ID != authored_by_care_manager_id"
          - "revision_note is present and non-empty"
        side_effects:
          - "status := DRAFT; review_decision := REVISION_REQUESTED; revision_note := supplied note; reviewed_by_care_manager_id := X-User-ID"
          - "plan_version_no += 1; revision_count += 1"
          - "submitted_at := null"
          - "version += 1"
        note: "Closes the revision cycle DRAFT -> PENDING_REVIEW -> DRAFT."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, when engagement_status becomes DISENGAGED on the owning Enrollment"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := SUSPENDED; compliance_posture := DEFICIENT; version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, when engagement_status leaves DISENGAGED on the owning Enrollment"
        actor: system
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "status := ACTIVE; compliance_posture recomputed (AT_RISK when at_risk_goal_count >= 1, else COMPLIANT); version += 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system, on Enrollment transition into GRADUATED or DISENROLLED"
        actor: system
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "status := CLOSED; closed_at := now"
          - "every CarePlanGoal with status IN {OPEN, AT_RISK} transitions to CLOSED_UNMET"
          - "version += 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "system, on Enrollment transition into GRADUATED or DISENROLLED"
        actor: system
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "status := CLOSED; closed_at := now"
          - "every CarePlanGoal with status IN {OPEN, AT_RISK} transitions to CLOSED_UNMET"
          - "version += 1"

  # ---- CarePlanGoal ----
  - entity: CarePlanGoal
    initial_state: OPEN
    terminal_states: [MET, CLOSED_UNMET]
    transitions:
      - from: OPEN
        to: AT_RISK
        trigger: "system, when a SocialNeed in the same domain on the same Enrollment enters UNMET_ESCALATED"
        actor: system
        preconditions:
          - "status == OPEN"
          - "CarePlanGoal.domain == SocialNeed.domain"
          - "the goal's care_plan.status == ACTIVE"
        side_effects:
          - "status := AT_RISK; barrier_flag := true"
          - "CarePlan.at_risk_goal_count += 1; CarePlan.compliance_posture := AT_RISK when it was COMPLIANT"
          - "version += 1"
      - from: AT_RISK
        to: OPEN
        trigger: "system, when the escalated SocialNeed in the same domain transitions to RESOLVED"
        actor: system
        preconditions:
          - "status == AT_RISK"
          - "no other SocialNeed in the same domain on this Enrollment remains in UNMET_ESCALATED"
        side_effects:
          - "status := OPEN; barrier_flag := false"
          - "CarePlan.at_risk_goal_count -= 1; CarePlan.compliance_posture recomputed"
          - "version += 1"
      - from: OPEN
        to: MET
        trigger: "system, on the last PLANNED Intervention under this goal transitioning to COMPLETED"
        actor: system
        preconditions:
          - "status == OPEN"
          - "planned_intervention_count == 0 and completed_intervention_count >= 1 after the completion"
        side_effects:
          - "status := MET; version += 1"
        note: "Bubble-up: goal completion is derived from child intervention state, never set directly."
      - from: AT_RISK
        to: MET
        trigger: "system, on the last PLANNED Intervention under this goal transitioning to COMPLETED"
        actor: system
        preconditions:
          - "status == AT_RISK"
          - "planned_intervention_count == 0 and completed_intervention_count >= 1 after the completion"
        side_effects:
          - "status := MET; barrier_flag := false"
          - "CarePlan.at_risk_goal_count -= 1; CarePlan.compliance_posture recomputed"
          - "version += 1"
      - from: OPEN
        to: CLOSED_UNMET
        trigger: "system, on the owning CarePlan transitioning to CLOSED"
        actor: system
        preconditions:
          - "status IN {OPEN, AT_RISK}"
        side_effects:
          - "status := CLOSED_UNMET"
          - "every Intervention under this goal with status == PLANNED transitions to VOIDED with void_reason 'PLAN_CLOSED'"
          - "version += 1"
      - from: AT_RISK
        to: CLOSED_UNMET
        trigger: "system, on the owning CarePlan transitioning to CLOSED"
        actor: system
        preconditions:
          - "status == AT_RISK"
        side_effects:
          - "status := CLOSED_UNMET; CarePlan.at_risk_goal_count -= 1"
          - "every PLANNED Intervention under this goal transitions to VOIDED"
          - "version += 1"

  # ---- Intervention ----
  - entity: Intervention
    initial_state: PLANNED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /care-management/interventions/{id}/complete"
        actor: CareManager
        preconditions:
          - "status == PLANNED"
          - "the goal's care_plan.status == ACTIVE"
        side_effects:
          - "status := COMPLETED; delivered_at := now"
          - "Program.committed_staff_minutes -= staff_minutes; Program.delivered_staff_minutes += staff_minutes"
          - "CarePlanGoal.planned_intervention_count -= 1; completed_intervention_count += 1"
          - "when planned_intervention_count reaches 0, the goal auto-transitions to MET"
          - "version += 1"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /care-management/interventions/{id}/void"
        actor: CareManager
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "status := VOIDED; void_reason := supplied reason"
          - "Program.committed_staff_minutes -= staff_minutes; Program.delivered_staff_minutes unchanged"
          - "CarePlanGoal.planned_intervention_count -= 1"
          - "no goal auto-transition fires from a void, even when planned_intervention_count reaches 0"
          - "version += 1"
        note: "Compensating action for intervention creation; conserves Program.committed_staff_minutes."

  # ---- Touch ----
  - entity: Touch
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /care-management/touches/{id}/complete"
        actor: CareManager
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == care_manager_id when the caller's role is CareManager"
          - "scheduled_start_at <= logical clock now"
          - "documentation_note is present and non-empty when outcome == REACHED"
        side_effects:
          - "step 1: status := COMPLETED; completed_at := now; outcome := supplied outcome; documentation_note stored"
          - "step 2: when outcome == REACHED - Enrollment.last_reached_touch_at := completed_at; consecutive_failed_outreach_count := 0; reached_touch_count += 1; and when touch_type == TOC and toc_due_at is not null and completed_at <= toc_due_at the TOC obligation is cleared per Enrollment.toc.ACTIVE_to_ACTIVE_toc_satisfied. When outcome == NOT_REACHED - consecutive_failed_outreach_count += 1 and reached_touch_count is unchanged"
          - "step 3: Enrollment.engagement_score := engagement_score_evaluation, whose denominator reads cadence_tier_snapshot and never the value cadence_tier holds after step 5"
          - "step 4: Enrollment.engagement_status transitions per the Enrollment.engagement_status machine using the step-2 counters and the step-3 score"
          - "step 5: Enrollment.cadence_tier := touch_cadence_tier_assignment, reading the engagement_status produced by step 4; a change here recomputes acuity_weight_points, CareManager.assigned_caseload_points and CareManager.capacity_status"
          - "step 6: Enrollment.next_touch_due_at := next_touch_due_at_projection, reading the counters from step 2, the engagement_status from step 4 and the cadence_tier from step 5"
          - "Touch.version += 1; Enrollment.version += 1"
        note: "The six steps are the pinned evaluation order; step 3 must not observe step 5's output."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /care-management/touches/{id}/cancel"
        actor: CareManager
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "status := CANCELLED; cancel_reason := supplied reason"
          - "the calendar interval is released, so a later touch whose buffered interval overlaps it is accepted"
          - "no engagement counter changes and no cadence recomputation fires"
          - "version += 1"
      - from: SCHEDULED
        to: CANCELLED
        name: SCHEDULED_to_CANCELLED_cascade
        trigger: "system, on Enrollment disenrollment, graduation, or transfer away from this touch's care manager"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "status := CANCELLED; cancel_reason := 'ENROLLMENT_ENDED' or 'CARE_MANAGER_TRANSFER'"
          - "the calendar interval is released"
          - "version += 1"

  # ---- SocialNeed ----
  - entity: SocialNeed
    initial_state: IDENTIFIED
    terminal_states: [RESOLVED]
    note: "Cyclic through UNMET_ESCALATED -> REFERRED, which is how a second referral attempt is made."
    transitions:
      - from: IDENTIFIED
        to: REFERRED
        trigger: "POST /care-management/referrals"
        actor: CareManager
        preconditions:
          - "status IN {IDENTIFIED, UNMET_ESCALATED}"
        side_effects:
          - "status := REFERRED; version += 1"
      - from: UNMET_ESCALATED
        to: REFERRED
        trigger: "POST /care-management/referrals"
        actor: CareManager
        preconditions:
          - "status == UNMET_ESCALATED"
        side_effects:
          - "status := REFERRED; version += 1"
      - from: REFERRED
        to: RESOLVED
        trigger: "system, on the referral closing as CLOSED_MET"
        actor: system
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "status := RESOLVED; resolved_at := now"
          - "every CarePlanGoal in the same domain on the same Enrollment with status == AT_RISK returns to OPEN when no other UNMET_ESCALATED need remains in that domain"
          - "version += 1"
      - from: REFERRED
        to: UNMET_ESCALATED
        trigger: "system, on the referral closing as CLOSED_UNMET"
        actor: system
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "cascade hop 1: status := UNMET_ESCALATED; escalation_count += 1"
          - "cascade hop 2: caused by hop 1, every CarePlanGoal with domain == this need's domain, status == OPEN, on the ACTIVE CarePlan of this Enrollment transitions OPEN -> AT_RISK and sets barrier_flag := true"
          - "cascade hop 3: caused by hop 2, CarePlan.at_risk_goal_count += 1 and CarePlan.compliance_posture := AT_RISK"
          - "version += 1"

  # ---- Referral (branching fork-join) ----
  - entity: Referral
    initial_state: SENT
    terminal_states: [CLOSED_MET, CLOSED_UNMET]
    note: "Fork at SENT -> {ACCEPTED, DECLINED}; join at CLOSED_UNMET, which both branches can reach, with divergent side-effect sets per branch."
    transitions:
      - from: SENT
        to: ACCEPTED
        trigger: "POST /care-management/referrals/{id}/decision with decision == ACCEPT"
        actor: CommunityPartner
        preconditions:
          - "status == SENT"
          - "X-User-ID == community_resource_id"
        side_effects:
          - "status := ACCEPTED; decision_at := now"
          - "the slot occupation on CommunityResource is retained, since {SENT, ACCEPTED} both occupy"
          - "version += 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /care-management/referrals/{id}/decision with decision == DECLINE"
        actor: CommunityPartner
        preconditions:
          - "status == SENT"
          - "X-User-ID == community_resource_id"
          - "decline_reason is present and non-empty"
        side_effects:
          - "status := DECLINED; decision_at := now; decline_reason stored"
          - "the slot occupation is released immediately, so a referral whose interval overlaps is accepted afterwards"
          - "CommunityResource.open_referral_count -= 1"
          - "version += 1"
        note: "Divergent from the ACCEPT branch: DECLINE frees capacity at decision time, ACCEPT does not."
      - from: ACCEPTED
        to: CLOSED_MET
        trigger: "POST /care-management/referrals/{id}/close-loop with resolution == SERVICE_DELIVERED"
        actor: CommunityPartner
        preconditions:
          - "status == ACCEPTED"
          - "outcome_note is present and non-empty"
        side_effects:
          - "status := CLOSED_MET; closed_at := now; loop_closure_hours computed"
          - "CommunityResource.open_referral_count -= 1; closed_loop_count += 1"
          - "SocialNeed transitions REFERRED -> RESOLVED"
          - "version += 1"
      - from: ACCEPTED
        to: CLOSED_UNMET
        trigger: "POST /care-management/referrals/{id}/close-loop with resolution == SERVICE_NOT_DELIVERED"
        actor: CommunityPartner
        preconditions:
          - "status == ACCEPTED"
          - "outcome_note is present and non-empty"
        side_effects:
          - "status := CLOSED_UNMET; closed_at := now; loop_closure_hours computed"
          - "CommunityResource.open_referral_count -= 1; closed_loop_count += 1"
          - "SocialNeed transitions REFERRED -> UNMET_ESCALATED, which starts the goal-barrier cascade"
          - "version += 1"
      - from: DECLINED
        to: CLOSED_UNMET
        trigger: "POST /care-management/referrals/{id}/close-loop with resolution == SERVICE_NOT_DELIVERED"
        actor: CareManager
        preconditions:
          - "status == DECLINED"
          - "outcome_note is present and non-empty"
        side_effects:
          - "status := CLOSED_UNMET; closed_at := now; loop_closure_hours computed"
          - "CommunityResource.closed_loop_count += 1; open_referral_count is NOT decremented again because the DECLINE already released it"
          - "SocialNeed transitions REFERRED -> UNMET_ESCALATED, starting the goal-barrier cascade"
          - "version += 1"
        note: "Join point: the DECLINED branch reaches the same terminal state as the ACCEPTED branch but with a different capacity-ledger side effect."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: transfer-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /care-management/enrollments/{id}/transfer"
    occ_field: "expected_enrollment_version"
    description: |
      Reassigning an Enrollment to a different care manager while carrying a version the
      client observed before the enrollment last changed is rejected. A transfer legitimately
      supersedes the previous assignment, so nothing in the state machine would stop a second
      reassignment from a stale view; the version check is what pins the client's intended
      baseline. The caseload ledgers of both managers move on every accepted transfer, so a
      writer working from an out-of-date view would move points off a manager that no longer
      holds the enrollment.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

  - rule_id: roi-measurement-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /care-management/enrollments/{id}/roi-measurements"
    occ_field: "expected_enrollment_version"
    description: |
      Recording an ROI measurement supersedes the prior measurement of the same method for the
      enrollment, so a re-measurement from a stale view would otherwise succeed and silently
      overwrite a newer reading. The version check rejects a measurement whose client view
      predates the enrollment's latest mutation, which is exactly the case where the measured
      window has already moved.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: risk_stratification_score
    trigger: "POST /care-management/members/{id}/stratifications"
    algorithm: weighted_scoring
    formula: |
      # Step 1 - assemble the included event set for the requested variant.
      now        = logical clock now
      lookback   = [now - LOOKBACK_DAYS days, now)          # half-open, retrospective
      forward    = (now, now + FORWARD_DAYS days]           # half-open, prospective
      events     = TransitionEvent rows with member_id == this member

      if variant == CONCURRENT:
          included = [e for e in events
                      if e.event_type IN {INPATIENT_ADMISSION, ED_VISIT, OBSERVATION_STAY}
                      and e.adjudication_status == CLOSED
                      and e.occurred_at IN lookback]
      else:   # PROSPECTIVE
          retro    = [e for e in events
                      if e.event_type IN {INPATIENT_ADMISSION, ED_VISIT, OBSERVATION_STAY}
                      and e.adjudication_status IN {CLOSED, OPEN}
                      and e.occurred_at IN lookback]
          planned  = [e for e in events
                      if e.event_type == SCHEDULED_ADMISSION
                      and e.occurred_at IN forward]
          included = retro + planned

      # Step 2 - recency-weighted utilization points.
      # An event dated exactly RECENCY_FULL_DAYS before now still earns the full factor.
      def recency_factor(e):
          if e.event_type == SCHEDULED_ADMISSION: return 1.0
          age_days = (now - e.occurred_at) in whole days, fractional part retained
          return 1.0 if age_days <= RECENCY_FULL_DAYS else RECENCY_DECAY_FACTOR

      utilization_points = sum(EVENT_POINTS[e.event_type] * recency_factor(e) for e in included)

      # Step 3 - static and social components.
      chronic_points     = Member.chronic_condition_count * CHRONIC_POINT_VALUE
      open_need_count    = count of SocialNeed rows with status IN {IDENTIFIED, REFERRED, UNMET_ESCALATED}
                           whose enrollment_id belongs to an Enrollment of this member with
                           enrollment_status IN {PENDING, ACTIVE}
      social_need_points = min(SDOH_POINT_CAP, open_need_count * SDOH_POINT_VALUE)

      # Step 4 - combine, round once at the end, cap.
      raw_score = utilization_points + chronic_points + social_need_points   # 1 decimal
      score     = min(100, round_half_up(raw_score, 0))
      tier      = HIGH     if score >= 85
                  RISING   if score >= 60
                  MODERATE if score >= 35
                  LOW      otherwise
    input_set: |
      TransitionEvent rows of the member only; the variant decides which adjudication_status
      values and which event types enter. DISCHARGE events never carry points under either
      variant. SocialNeed rows are counted only on Enrollments in {PENDING, ACTIVE}.
    constants:
      LOOKBACK_DAYS: 180
      FORWARD_DAYS: 90
      RECENCY_FULL_DAYS: 90
      RECENCY_DECAY_FACTOR: 0.5
      EVENT_POINTS_INPATIENT_ADMISSION: 20
      EVENT_POINTS_ED_VISIT: 8
      EVENT_POINTS_OBSERVATION_STAY: 5
      EVENT_POINTS_SCHEDULED_ADMISSION: 20
      CHRONIC_POINT_VALUE: 6
      SDOH_POINT_VALUE: 4
      SDOH_POINT_CAP: 12
    precision: "utilization_points and raw_score carry 1 decimal place; score is an integer produced by a single round_half_up at the end, never by rounding each event's contribution"
    variants:
      - name: CONCURRENT
        when: "requested explicitly, and read by Programs whose stratification_variant == CONCURRENT"
        difference: "Only adjudication_status == CLOSED retrospective events count; SCHEDULED_ADMISSION rows are excluded entirely, so a member with pending claims and a booked admission scores strictly lower than under PROSPECTIVE."
      - name: PROSPECTIVE
        when: "requested explicitly, and read by Programs whose stratification_variant == PROSPECTIVE"
        difference: "Adds OPEN retrospective claims at full event points and SCHEDULED_ADMISSION rows in the forward 90-day window at 20 points each with recency_factor 1.0."

  - name: caseload_weight_points
    trigger: "Enrollment creation; Enrollment.PENDING_to_ACTIVE; Enrollment.toc.ACTIVE_to_ACTIVE_toc_escalation; Enrollment.toc.ACTIVE_to_ACTIVE_toc_satisfied; step 5 of Touch.SCHEDULED_to_COMPLETED"
    algorithm: aggregation
    formula: |
      acuity_weight_points = round_half_up(TIER_POINTS[risk_tier_at_enrollment]
                                           * CADENCE_MULTIPLIER[cadence_tier], 1)

      CareManager.assigned_caseload_points =
          round_half_up(sum(e.acuity_weight_points
                            for e in Enrollment
                            if e.care_manager_id == this manager.id
                            and e.enrollment_status IN {PENDING, ACTIVE}), 1)

      CareManager.capacity_status = OVER_CAPACITY if assigned_caseload_points > capacity_points
                                    else OPEN
    input_set: "Enrollments with enrollment_status IN {PENDING, ACTIVE} and a non-null care_manager_id. GRADUATED and DISENROLLED enrollments are excluded, which is what makes the ledger conserve on disenrollment."
    constants:
      TIER_POINTS_LOW: 1
      TIER_POINTS_MODERATE: 2
      TIER_POINTS_RISING: 4
      TIER_POINTS_HIGH: 7
      CADENCE_MULTIPLIER_STANDARD: 1.0
      CADENCE_MULTIPLIER_INTENSIVE: 1.5
      CADENCE_MULTIPLIER_TOC_INTENSIVE: 2.0
    precision: "1 decimal place, round_half_up; the manager ledger is recomputed as a full sum, never adjusted by deltas"

  - name: care_manager_auto_assignment
    trigger: "POST /care-management/enrollments when care_manager_id is omitted from the request body"
    algorithm: waterfall_allocation
    formula: |
      candidate_weight = round_half_up(TIER_POINTS[risk_tier_at_enrollment] * 1.0, 1)
                         # cadence_tier is STANDARD at creation time

      # (a) eligibility filter - an explicit predicate over entity fields
      candidates = [cm for cm in CareManager
                    if cm.credential_level IN Program.required_credential_levels
                    and Member.state_code IN cm.licensed_state_codes
                    and cm.capacity_status == OPEN
                    and cm.assigned_caseload_points + candidate_weight <= cm.capacity_points]

      # (b) ranking expression
      order candidates by (cm.capacity_points - cm.assigned_caseload_points) DESC

      # (c) tie-break when the headroom expression ties
      then by cm.created_at ASC

      # (d) empty-pool fallback
      if candidates is empty: reject with ERR_NO_ELIGIBLE_CARE_MANAGER and create nothing

      selected = candidates[0]
      Enrollment.care_manager_id := selected.id
      Enrollment.assignment_reason := AUTO_SELECTED
    input_set: "All CareManager rows. No random property, and specifically no id value, participates in the filter, the ranking, or the tie-break."
    constants: {}
    precision: "headroom compared at 1 decimal place"

  - name: touch_cadence_tier_assignment
    trigger: "Enrollment.PENDING_to_ACTIVE; step 5 of Touch.SCHEDULED_to_COMPLETED; Enrollment.toc.ACTIVE_to_ACTIVE_toc_escalation; Enrollment.toc.ACTIVE_to_ACTIVE_toc_satisfied"
    algorithm: threshold
    formula: |
      # Evaluated top-down; the first matching clause wins.
      if toc_due_at is not null:                        cadence_tier = TOC_INTENSIVE
      elif engagement_status == DISENGAGED:             cadence_tier = INTENSIVE
      elif risk_tier_at_enrollment == HIGH:             cadence_tier = INTENSIVE
      else:                                             cadence_tier = STANDARD
    input_set: "The enrollment's own toc_due_at, engagement_status as produced by step 4 of the touch-completion order, and risk_tier_at_enrollment."
    constants: {}
    precision: "exact enum selection; no rounding"

  - name: engagement_score_evaluation
    trigger: "step 3 of Touch.SCHEDULED_to_COMPLETED"
    algorithm: aggregation
    formula: |
      # This calculation and touch_cadence_tier_assignment reference each other in the
      # domain narrative: cadence drives how many touches are expected, and engagement
      # drives the cadence tier. The order is pinned so the value is well-defined:
      #   engagement_score reads cadence_tier_snapshot ONLY.
      #   touch_cadence_tier_assignment reads engagement_status, which is derived from
      #   engagement_score. The current value of cadence_tier is never an input here.
      window            = (now - ENGAGEMENT_WINDOW_DAYS days, now]     # half-open, ends inclusive at now
      interval_days     = CADENCE_INTERVAL_DAYS[cadence_tier_snapshot]
      expected_touches  = max(1, floor(ENGAGEMENT_WINDOW_DAYS / interval_days))
      reached_touch_count = count of Touch rows on this enrollment with status == COMPLETED,
                            outcome == REACHED and completed_at IN window
      engagement_score  = min(100, round_half_up(100 * reached_touch_count / expected_touches, 0))

      # engagement_status is then chosen top-down (step 4):
      if consecutive_failed_outreach_count >= DISENGAGE_FAILED_TOUCH_THRESHOLD: DISENGAGED
      elif reached_touch_count == 0:                                            UNREACHED
      elif engagement_score >= ENGAGED_SCORE_MIN:                               ENGAGED
      else:                                                                     AT_RISK
    input_set: "COMPLETED Touches with outcome REACHED inside the 90-day window; CANCELLED touches and NOT_REACHED completions never enter the numerator."
    constants:
      ENGAGEMENT_WINDOW_DAYS: 90
      CADENCE_INTERVAL_DAYS_STANDARD: 30
      CADENCE_INTERVAL_DAYS_INTENSIVE: 14
      CADENCE_INTERVAL_DAYS_TOC_INTENSIVE: 7
      ENGAGED_SCORE_MIN: 60
      DISENGAGE_FAILED_TOUCH_THRESHOLD: 3
    precision: "single round_half_up to an integer percentage at the end"

  - name: next_touch_due_at_projection
    trigger: "Enrollment.PENDING_to_ACTIVE; step 6 of Touch.SCHEDULED_to_COMPLETED; Enrollment.toc.ACTIVE_to_ACTIVE_toc_escalation"
    algorithm: threshold
    formula: |
      base          = last_reached_touch_at if last_reached_touch_at is not null else activated_at
      interval_days = CADENCE_INTERVAL_DAYS[cadence_tier]      # current tier, not the snapshot

      # The three adjustments are applied in exactly this order.
      adj = interval_days
      # (1) escalation on repeated failed outreach
      if consecutive_failed_outreach_count >= ESCALATION_FAILED_TOUCH_MIN:
          adj = max(MIN_INTERVAL_DAYS, floor(interval_days / 2))
      # (2) relaxation for an engaged member with a clean outreach record
      if engagement_status == ENGAGED and consecutive_failed_outreach_count == 0:
          adj = min(interval_days + ENGAGED_RELAXATION_DAYS, MAX_INTERVAL_DAYS)
      # (3) transitions-of-care clamp, applied last so it dominates both adjustments above
      if toc_due_at is not null and now < toc_due_at:
          adj = min(adj, TOC_CONTACT_INTERVAL_DAYS)

      next_touch_due_at = base + adj days
    input_set: "The enrollment's own cadence_tier, consecutive_failed_outreach_count, engagement_status and toc_due_at, plus last_reached_touch_at or activated_at as the base instant."
    constants:
      ESCALATION_FAILED_TOUCH_MIN: 2
      MIN_INTERVAL_DAYS: 3
      ENGAGED_RELAXATION_DAYS: 7
      MAX_INTERVAL_DAYS: 45
      TOC_CONTACT_INTERVAL_DAYS: 2
      CADENCE_INTERVAL_DAYS_STANDARD: 30
      CADENCE_INTERVAL_DAYS_INTENSIVE: 14
      CADENCE_INTERVAL_DAYS_TOC_INTENSIVE: 7
    precision: "whole days added to the base instant; the time-of-day component of base is preserved exactly"

  - name: intervention_cost_cents
    trigger: "POST /care-management/goals/{id}/interventions"
    algorithm: tiered_pricing
    formula: |
      cost_cents = round_half_up(staff_minutes * Program.hourly_cost_cents / 60, 0)
      # Frozen on the Intervention row at creation; a later change to Program.hourly_cost_cents
      # never restates it.
    input_set: "The single Intervention being created and the Program reached through goal -> care_plan -> enrollment -> program."
    constants: {}
    precision: "integer cents, round_half_up, computed once per Intervention"

  - name: roi_savings_measurement
    trigger: "POST /care-management/enrollments/{id}/roi-measurements"
    algorithm: chronological
    formula: |
      end_at   = logical clock now
      start_at = Enrollment.activated_at

      # Intervention months: whole calendar months fully inside [start_at, end_at).
      months = [m for m in calendar months
                if month_start(m) >= start_at and month_end(m) <= end_at]
      intervention_month_count = len(months)
      if intervention_month_count == 0: reject with ERR_MEASUREMENT_PERIOD_EMPTY

      # Baseline: the 12 whole calendar months immediately preceding start_at's month.
      baseline_window = [month_start(start_at) - 12 months, month_start(start_at))

      def month_cost(m):
          return sum(e.episode_cost_cents for e in TransitionEvent
                     if e.member_id == Enrollment.member_id
                     and e.adjudication_status == CLOSED
                     and month_start(m) <= e.occurred_at < month_end(m))

      if method == PRE_POST:
          baseline_total_cents        = sum of episode_cost_cents over CLOSED TransitionEvents
                                        of this member with occurred_at IN baseline_window
          baseline_pmpm_cents         = round_half_up(baseline_total_cents / 12, 0)
          monthly_projected_cost_cents = round_half_up(baseline_pmpm_cents * TREND_FACTOR, 0)
      else:   # MATCHED_COHORT
          baseline_pmpm_cents          = 0
          monthly_projected_cost_cents = round_half_up(Program.cohort_benchmark_pmpm_cents
                                         * COHORT_RISK_FACTOR[risk_tier_at_enrollment], 0)

      # ROUNDING ORDER IS PINNED: the projected cost is rounded ONCE per member-month and the
      # monthly deltas are then summed. Summing unrounded monthly projections and rounding the
      # total afterwards is NOT the declared order and produces a different cents figure.
      gross_savings_cents = sum(monthly_projected_cost_cents - month_cost(m) for m in months)
      projected_cost_cents = monthly_projected_cost_cents * intervention_month_count
      actual_cost_cents    = sum(month_cost(m) for m in months)

      # Program cost is likewise summed from the per-Intervention rounded cost_cents values
      # already stored on each row; it is never recomputed from total staff minutes.
      program_cost_cents = sum(i.cost_cents for i in Intervention
                               if i.status == COMPLETED
                               and i.goal -> care_plan -> enrollment_id == this enrollment.id)

      net_savings_cents = gross_savings_cents - program_cost_cents
      roi_ratio = null if program_cost_cents == 0
                  else round_half_up(net_savings_cents / program_cost_cents, 2)
    input_set: |
      Only TransitionEvents with adjudication_status == CLOSED enter either window; OPEN claims
      are ignored on both sides. Only Interventions in status COMPLETED enter program_cost_cents;
      PLANNED and VOIDED interventions are excluded. Whole calendar months only - a partial month
      at either edge is dropped.
    constants:
      TREND_FACTOR: 1.03
      BASELINE_MONTHS: 12
      COHORT_RISK_FACTOR_LOW: 0.6
      COHORT_RISK_FACTOR_MODERATE: 1.0
      COHORT_RISK_FACTOR_RISING: 1.4
      COHORT_RISK_FACTOR_HIGH: 2.1
    precision: "integer cents throughout; round_half_up applied per member-month and per Intervention, never to an aggregate; roi_ratio at 2 decimal places, round_half_up"
    variants:
      - name: PRE_POST
        when: "method == PRE_POST"
        difference: "Projects from the member's own 12-month baseline PMPM inflated by TREND_FACTOR, so a member with an expensive personal history shows larger projected savings."
      - name: MATCHED_COHORT
        when: "method == MATCHED_COHORT"
        difference: "Projects from Program.cohort_benchmark_pmpm_cents scaled by the enrollment's risk tier factor, ignoring the member's own baseline entirely; for identical inputs the two methods report different gross_savings_cents, net_savings_cents and roi_ratio."

  - name: care_manager_slot_conflict_detection
    trigger: "POST /care-management/touches"
    algorithm: interval_merge
    formula: |
      # Buffered-exclusive geometry: the CANDIDATE interval is expanded by the buffer on both
      # sides and tested against each existing interval in its RAW form. Capacity is exactly one.
      cand_lo = candidate.scheduled_start_at - DOCUMENTATION_BUFFER_MINUTES minutes
      cand_hi = candidate.scheduled_end_at   + DOCUMENTATION_BUFFER_MINUTES minutes

      occupied = [t for t in Touch
                  if t.care_manager_id == candidate.care_manager_id
                  and t.status == SCHEDULED]

      conflict = any(cand_lo < t.scheduled_end_at and t.scheduled_start_at < cand_hi
                     for t in occupied)
      if conflict: reject with ERR_CARE_MANAGER_SLOT_CONFLICT
    input_set: "Touches with status == SCHEDULED on the same care_manager_id. COMPLETED and CANCELLED touches release the interval and are never occupants."
    constants:
      DOCUMENTATION_BUFFER_MINUTES: 15
    precision: |
      Half-open comparison on both sides, so back-to-back booking is REJECTED: a candidate
      starting exactly when an existing touch ends is expanded 15 minutes backwards and
      therefore overlaps. The smallest accepted gap is exactly DOCUMENTATION_BUFFER_MINUTES;
      a candidate starting exactly 15 minutes after an existing end is accepted.

  - name: community_resource_slot_capacity_check
    trigger: "POST /care-management/referrals"
    algorithm: interval_merge
    formula: |
      # Aggregate-capacity geometry on plain half-open intervals; no buffer at all.
      occupied = [r for r in Referral
                  if r.community_resource_id == candidate.community_resource_id
                  and r.status IN {SENT, ACCEPTED}]

      # Boundary instants of interest are the candidate's start plus every occupant start that
      # falls strictly inside the candidate interval.
      probes = [candidate.service_start_at] +
               [r.service_start_at for r in occupied
                if candidate.service_start_at < r.service_start_at < candidate.service_end_at]

      for p in probes:
          concurrent = 1 + count(r for r in occupied
                                 if r.service_start_at <= p < r.service_end_at)
          if concurrent > CommunityResource.concurrent_slot_capacity:
              reject with ERR_RESOURCE_CAPACITY_EXCEEDED
    input_set: "Referrals in status SENT or ACCEPTED against the same CommunityResource. DECLINED, CLOSED_MET and CLOSED_UNMET referrals release their slot."
    constants: {}
    precision: |
      Intervals are half-open [service_start_at, service_end_at). An occupant whose end equals
      the candidate's start does NOT count, so adjacency is always accepted regardless of
      capacity. This is deliberately different geometry from care_manager_slot_conflict_detection,
      which rejects the same adjacency because of its buffer.

  - name: accreditation_compliance_file
    trigger: "GET /care-management/programs/{id}/accreditation-file"
    algorithm: aggregation
    formula: |
      now = logical clock now
      subject_enrollments = [e for e in Enrollment
                             if e.program_id == this program.id
                             and e.enrollment_status == ACTIVE]
      order subject_enrollments by created_at ASC

      for each e in subject_enrollments, collect deficiency codes:
        CARE_PLAN_MISSING      when no CarePlan on e has status == ACTIVE
        CARE_PLAN_STALE        when a CarePlan on e has status == ACTIVE and next_review_due_at < now
        TOUCH_OVERDUE          when e.next_touch_due_at is not null and e.next_touch_due_at < now
        TOC_OUTREACH_MISSED    when e.toc_due_at is not null and e.toc_due_at < now
        REFERRAL_LOOP_OPEN     when a Referral reached through e's SocialNeeds has
                               status IN {SENT, ACCEPTED} and
                               sent_at + Program.referral_loop_days days < now
        MISSING_CONTACT_NOTE   when a Touch on e has status == COMPLETED, outcome == REACHED
                               and documentation_note is null or empty

      active_enrollment_count           = len(subject_enrollments)
      deficiency_counts                 = per-code count over subject_enrollments
      enrollments_with_deficiency_count = count of subject_enrollments with >= 1 code
      if active_enrollment_count == 0:
          compliance_rate_pct = 100.0
      else:
          compliance_rate_pct = round_half_up(
                100 * (active_enrollment_count - enrollments_with_deficiency_count)
                / active_enrollment_count, 1)
    input_set: "Only Enrollments with enrollment_status == ACTIVE in this program. PENDING, GRADUATED and DISENROLLED enrollments are outside the audit sample."
    constants: {}
    precision: "compliance_rate_pct at 1 decimal place, round_half_up; an empty audit sample is pinned to 100.0 rather than divided by zero"

# =====================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 5
    category: business_constraint
    check: "every field marked required in the endpoint's input is present, every enum value is a declared member, every integer/number is of the right type and satisfies its constraint, and scheduled_end_at / service_end_at are parseable ISO 8601 instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 7
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0 when supplied"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 10
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids; the error_id is the one named for the segment that failed - ERR_MEMBER_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_CARE_MANAGER_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_CARE_PLAN_NOT_FOUND, ERR_GOAL_NOT_FOUND, ERR_INTERVENTION_NOT_FOUND, ERR_TOUCH_NOT_FOUND, ERR_SOCIAL_NEED_NOT_FOUND, ERR_COMMUNITY_RESOURCE_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_TRANSITION_EVENT_NOT_FOUND"

  - priority: 12
    category: existence
    check: "every id supplied in the request body resolves, validated in the order the fields appear in the endpoint's input list"
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "POST /care-management/enrollments (member_id then program_id then care_manager_id), POST /care-management/care-plans (enrollment_id), POST /care-management/touches (enrollment_id then care_manager_id), POST /care-management/social-needs (enrollment_id), POST /care-management/referrals (social_need_id then community_resource_id), POST /care-management/transition-events (member_id then index_admission_event_id), POST /care-management/enrollments/{id}/transfer (to_care_manager_id)"

  - priority: 15
    category: auth
    check: "for an entity_backed role, X-User-ID equals the resource's owning foreign key - Touch.care_manager_id for touch completion and cancellation, Touch body care_manager_id for touch creation by a CareManager, CarePlan.authored_by_care_manager_id for submit, Referral.community_resource_id for a CommunityPartner decision or loop closure"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /care-management/touches, POST /care-management/touches/{id}/complete, POST /care-management/touches/{id}/cancel, POST /care-management/care-plans/{id}/submit, POST /care-management/referrals/{id}/decision, POST /care-management/referrals/{id}/close-loop"

  - priority: 18
    category: auth
    check: "the reviewing ClinicalReviewer's X-User-ID differs from CarePlan.authored_by_care_manager_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /care-management/care-plans/{id}/review"

  - priority: 30
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "all action endpoints; the error_id is the state error named for the resource and the required state - ERR_ENROLLMENT_NOT_PENDING, ERR_ENROLLMENT_NOT_ACTIVE, ERR_ENROLLMENT_ALREADY_TERMINAL, ERR_CARE_PLAN_NOT_DRAFT, ERR_CARE_PLAN_NOT_IN_REVIEW, ERR_CARE_PLAN_NOT_ACTIVE, ERR_GOAL_NOT_OPEN, ERR_INTERVENTION_NOT_PLANNED, ERR_TOUCH_NOT_SCHEDULED, ERR_REFERRAL_NOT_SENT, ERR_REFERRAL_LOOP_NOT_CLOSABLE, ERR_SOCIAL_NEED_NOT_REFERABLE"

  - priority: 35
    category: state
    check: "expected_enrollment_version equals the current Enrollment.version"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /care-management/enrollments/{id}/transfer, POST /care-management/enrollments/{id}/roi-measurements"

  - priority: 40
    category: state
    check: "cross-entity state gate - a Touch may only be scheduled on an enrollment that has a CarePlan in status ACTIVE; a CarePlan may only be submitted or approved while its Enrollment.enrollment_status == ACTIVE; an Intervention may only be created or completed while its plan is ACTIVE"
    error_id: ERR_CARE_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /care-management/touches, POST /care-management/care-plans/{id}/submit, POST /care-management/care-plans/{id}/review, POST /care-management/goals/{id}/interventions, POST /care-management/interventions/{id}/complete"

  - priority: 45
    category: business_safety
    check: "the member's social_data_consent_status is GRANTED before any social-need data leaves the plan through a referral"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 422
    applies_to: "POST /care-management/referrals"

  - priority: 47
    category: business_safety
    check: "documentation_note is present and non-empty when a touch is completed with outcome REACHED"
    error_id: ERR_DOCUMENTATION_REQUIRED
    http_status: 422
    applies_to: "POST /care-management/touches/{id}/complete"

  - priority: 50
    category: business_safety
    check: "the care manager's credential_level is a member of Program.required_credential_levels"
    error_id: ERR_CREDENTIAL_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /care-management/enrollments (explicit care_manager_id), POST /care-management/enrollments/{id}/transfer, POST /care-management/touches"

  - priority: 52
    category: business_safety
    check: "Member.state_code is a member of the care manager's licensed_state_codes"
    error_id: ERR_STATE_LICENSURE_MISMATCH
    http_status: 422
    applies_to: "POST /care-management/enrollments (explicit care_manager_id), POST /care-management/enrollments/{id}/transfer"

  - priority: 55
    category: business_temporal
    check: "scheduled_end_at > scheduled_start_at for a Touch and service_end_at > service_start_at for a Referral"
    error_id: ERR_TOUCH_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /care-management/touches (ERR_TOUCH_WINDOW_INVALID), POST /care-management/referrals (ERR_SERVICE_WINDOW_INVALID)"

  - priority: 57
    category: business_temporal
    check: "scheduled_start_at >= logical clock now for a Touch; service_start_at >= logical clock now for a Referral"
    error_id: ERR_TOUCH_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /care-management/touches (ERR_TOUCH_WINDOW_IN_PAST), POST /care-management/referrals (ERR_SERVICE_WINDOW_IN_PAST)"

  - priority: 58
    category: business_temporal
    check: "a Touch may only be completed once its scheduled_start_at has been reached on the logical clock"
    error_id: ERR_TOUCH_NOT_YET_DUE
    http_status: 409
    applies_to: "POST /care-management/touches/{id}/complete"

  - priority: 59
    category: business_temporal
    check: "the ROI intervention window contains at least one whole calendar month"
    error_id: ERR_MEASUREMENT_PERIOD_EMPTY
    http_status: 422
    applies_to: "POST /care-management/enrollments/{id}/roi-measurements"

  - priority: 60
    category: business_referential
    check: "the receiving CommunityResource has contract_status == CONTRACTED"
    error_id: ERR_RESOURCE_NOT_CONTRACTED
    http_status: 422
    applies_to: "POST /care-management/referrals"

  - priority: 61
    category: business_referential
    check: "the SocialNeed's domain is a member of CommunityResource.served_domains and Member.state_code is a member of CommunityResource.service_state_codes"
    error_id: ERR_RESOURCE_DOMAIN_MISMATCH
    http_status: 422
    applies_to: "POST /care-management/referrals"

  - priority: 62
    category: business_referential
    check: "no other Enrollment exists for the same (member_id, program_id) pair with enrollment_status IN {PENDING, ACTIVE}"
    error_id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http_status: 409
    applies_to: "POST /care-management/enrollments"

  - priority: 63
    category: business_referential
    check: "the transfer target differs from the enrollment's current care_manager_id"
    error_id: ERR_TRANSFER_TO_SAME_MANAGER
    http_status: 409
    applies_to: "POST /care-management/enrollments/{id}/transfer"

  - priority: 64
    category: business_referential
    check: "disenrolling with reason GOALS_MET requires an ACTIVE CarePlan carrying at least one CarePlanGoal, every one of them in status MET"
    error_id: ERR_GOALS_NOT_MET
    http_status: 409
    applies_to: "POST /care-management/enrollments/{id}/disenroll"

  - priority: 66
    category: business_constraint
    check: "the member has a RiskStratification whose variant equals Program.stratification_variant"
    error_id: ERR_STRATIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /care-management/enrollments"

  - priority: 67
    category: business_constraint
    check: "the tier rank of that stratification is >= the tier rank of Program.min_risk_tier, using LOW(0) < MODERATE(1) < RISING(2) < HIGH(3)"
    error_id: ERR_RISK_TIER_BELOW_PROGRAM_MINIMUM
    http_status: 422
    applies_to: "POST /care-management/enrollments"

  - priority: 70
    category: business_constraint
    check: "no SCHEDULED Touch on the same care manager overlaps the candidate interval expanded by DOCUMENTATION_BUFFER_MINUTES on both sides"
    error_id: ERR_CARE_MANAGER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /care-management/touches"

  - priority: 71
    category: business_constraint
    check: "no SocialNeed may carry two Referrals in status IN {SENT, ACCEPTED} at once"
    error_id: ERR_DUPLICATE_OPEN_REFERRAL
    http_status: 409
    applies_to: "POST /care-management/referrals"

  - priority: 72
    category: business_constraint
    check: "the community resource's concurrent_slot_capacity is not exceeded at any probe instant of the candidate half-open service interval"
    error_id: ERR_RESOURCE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /care-management/referrals"

  - priority: 80
    category: business_fiscal
    check: "the target care manager's assigned_caseload_points + the enrollment's candidate weight is <= capacity_points; equality is accepted"
    error_id: ERR_CASELOAD_WOULD_EXCEED_CAPACITY
    http_status: 409
    applies_to: "POST /care-management/enrollments (explicit care_manager_id), POST /care-management/enrollments/{id}/transfer"

  - priority: 81
    category: business_fiscal
    check: "the care manager named on a new Touch has capacity_status == OPEN"
    error_id: ERR_CARE_MANAGER_OVER_CAPACITY
    http_status: 409
    applies_to: "POST /care-management/touches"

  - priority: 82
    category: business_fiscal
    check: "Program.committed_staff_minutes + Program.delivered_staff_minutes + the new intervention's staff_minutes is <= Program.staff_minute_budget"
    error_id: ERR_PROGRAM_STAFF_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /care-management/goals/{id}/interventions"

  - priority: 85
    category: business_fiscal
    check: "the care_manager_auto_assignment candidate pool is non-empty"
    error_id: ERR_NO_ELIGIBLE_CARE_MANAGER
    http_status: 409
    applies_to: "POST /care-management/enrollments when care_manager_id is omitted"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---------- Member ----------
  - method: POST
    path: "/care-management/members"
    description: "Register a health-plan member."
    roles: [ProgramAdmin]
    code: 201
    input: ["external_member_id", "full_name", "birth_date", "state_code", "chronic_condition_count?", "social_data_consent_status?"]
    output: Member
    side_effects: ["all four latest_* risk fields start null"]

  - method: GET
    path: "/care-management/members/{id}"
    description: "Read one member including the latest tier for each stratification variant."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/care-management/members"
    description: "List members with pagination."
    roles: [ProgramAdmin, UtilizationAnalyst]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/care-management/members/{id}/consent"
    description: "Grant or revoke the member's consent to share social-need data with community partners."
    roles: [ProgramAdmin, CareManager]
    code: 200
    input: ["social_data_consent_status"]
    output: Member
    side_effects: ["Member.social_data_consent_status replaced", "Member.version += 1"]

  - method: POST
    path: "/care-management/members/{id}/stratifications"
    description: "Run risk_stratification_score for the requested variant and append an immutable stratification row."
    roles: [ProgramAdmin, UtilizationAnalyst]
    code: 201
    input: ["variant"]
    output: RiskStratification
    side_effects: ["appends a RiskStratification row", "refreshes Member.latest_<variant>_score and Member.latest_<variant>_tier"]

  - method: GET
    path: "/care-management/members/{id}/stratifications"
    description: "List every stratification computed for this member, newest as_of_date first."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["variant?", "limit?", "offset?"]
    output: RiskStratification[]
    side_effects: []

  # ---------- TransitionEvent ----------
  - method: POST
    path: "/care-management/transition-events"
    description: "Record a utilization or transitions-of-care event. A DISCHARGE event fires the TOC escalation cascade on every ACTIVE enrollment of the member."
    roles: [ProgramAdmin, UtilizationAnalyst]
    code: 201
    input: ["member_id", "event_type", "occurred_at", "facility_name", "episode_cost_cents?", "adjudication_status?", "discharge_disposition?", "index_admission_event_id?"]
    output: TransitionEvent
    side_effects:
      - "event_type == DISCHARGE runs Enrollment.toc.ACTIVE_to_ACTIVE_toc_escalation on every ACTIVE enrollment of the member"
      - "toc_triggered_enrollment_count set from that cascade"

  - method: GET
    path: "/care-management/transition-events/{id}"
    description: "Read one utilization event."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: TransitionEvent
    side_effects: []

  - method: GET
    path: "/care-management/transition-events"
    description: "List utilization events, optionally by member, by type, or by the index admission a discharge closes."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["member_id?", "event_type?", "index_admission_event_id?", "limit?", "offset?"]
    output: TransitionEvent[]
    side_effects: []

  # ---------- Program ----------
  - method: POST
    path: "/care-management/programs"
    description: "Create a care management program with its eligibility, cadence, budget and ROI benchmark configuration."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "min_risk_tier", "stratification_variant", "required_credential_levels", "staff_minute_budget", "hourly_cost_cents", "cohort_benchmark_pmpm_cents", "care_plan_review_interval_days?", "toc_outreach_hours?", "referral_loop_days?"]
    output: Program
    side_effects: ["committed_staff_minutes and delivered_staff_minutes start at 0"]

  - method: GET
    path: "/care-management/programs/{id}"
    description: "Read one program including its two staff-minute ledgers."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/care-management/programs/{id}/accreditation-file"
    description: "Computed read: run accreditation_compliance_file over the program's ACTIVE enrollments."
    roles: [ProgramAdmin, UtilizationAnalyst]
    code: 200
    input: []
    output: { program_id: string, evaluated_at: string, active_enrollment_count: integer, enrollments_with_deficiency_count: integer, compliance_rate_pct: number, deficiency_counts: object, deficient_enrollment_ids: array }
    side_effects: []

  # ---------- CareManager ----------
  - method: POST
    path: "/care-management/care-managers"
    description: "Create a care manager with credential, licensure and caseload capacity."
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "credential_level", "licensed_state_codes", "capacity_points"]
    output: CareManager
    side_effects: ["assigned_caseload_points starts at 0.0 and capacity_status at OPEN"]

  - method: GET
    path: "/care-management/care-managers/{id}"
    description: "Read one care manager including the live caseload ledger."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: CareManager
    side_effects: []

  - method: GET
    path: "/care-management/care-managers"
    description: "List care managers, optionally filtered by capacity posture or credential."
    roles: [ProgramAdmin, UtilizationAnalyst]
    code: 200
    input: ["capacity_status?", "credential_level?", "limit?", "offset?"]
    output: CareManager[]
    side_effects: []

  # ---------- Enrollment ----------
  - method: POST
    path: "/care-management/enrollments"
    description: "Enroll a member in a program. Omitting care_manager_id runs the care_manager_auto_assignment selector."
    roles: [ProgramAdmin, CareManager]
    code: 201
    input: ["member_id", "program_id", "care_manager_id?"]
    output: Enrollment
    side_effects:
      - "risk_tier_at_enrollment and risk_score_at_enrollment frozen from the member's latest stratification of Program.stratification_variant"
      - "acuity_weight_points computed at cadence_tier STANDARD"
      - "CareManager.assigned_caseload_points and capacity_status recomputed"
      - "assignment_reason set to EXPLICIT or AUTO_SELECTED"

  - method: GET
    path: "/care-management/enrollments/{id}"
    description: "Read one enrollment with both state dimensions and every cadence field."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/care-management/enrollments"
    description: "List enrollments filtered by member, program, care manager or lifecycle state."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["member_id?", "program_id?", "care_manager_id?", "enrollment_status?", "engagement_status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/care-management/enrollments/{id}/activate"
    description: "Move the enrollment from PENDING to ACTIVE and start the cadence clock."
    roles: [ProgramAdmin, CareManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["see Enrollment.PENDING_to_ACTIVE side effects", "increments Enrollment.version by 1"]

  - method: POST
    path: "/care-management/enrollments/{id}/transfer"
    description: "Reassign the enrollment to a different care manager, moving caseload points between the two ledgers."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_care_manager_id", "expected_enrollment_version"]
    output: Enrollment
    side_effects:
      - "see Enrollment.ACTIVE_to_ACTIVE_transfer side effects"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/care-management/enrollments/{id}/disenroll"
    description: "End the enrollment. reason GOALS_MET graduates it; every other reason disenrolls it."
    roles: [ProgramAdmin, CareManager]
    code: 200
    input: ["reason"]
    output: Enrollment
    side_effects: ["see the ACTIVE_to_DISENROLLED and ACTIVE_to_GRADUATED cascades", "increments Enrollment.version by 1"]

  - method: POST
    path: "/care-management/enrollments/{id}/roi-measurements"
    description: "Compute and append an ROI measurement using the requested method."
    roles: [UtilizationAnalyst]
    code: 201
    input: ["method", "expected_enrollment_version"]
    output: RoiMeasurement
    side_effects:
      - "marks any prior RoiMeasurement for the same enrollment_id and method as superseded"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/care-management/enrollments/{id}/roi-measurements"
    description: "List ROI measurements recorded for this enrollment, newest first."
    roles: [ProgramAdmin, UtilizationAnalyst]
    code: 200
    input: ["method?", "limit?", "offset?"]
    output: RoiMeasurement[]
    side_effects: []

  # ---------- CarePlan / Goal / Intervention ----------
  - method: POST
    path: "/care-management/care-plans"
    description: "Create a DRAFT care plan for an enrollment. The acting CareManager becomes the plan's author."
    roles: [CareManager]
    code: 201
    input: ["enrollment_id", "title"]
    output: CarePlan
    side_effects: ["authored_by_care_manager_id := X-User-ID", "status DRAFT, plan_version_no 1, compliance_posture COMPLIANT"]

  - method: GET
    path: "/care-management/care-plans/{id}"
    description: "Read one care plan with its revision counters and compliance posture."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: CarePlan
    side_effects: []

  - method: GET
    path: "/care-management/care-plans"
    description: "List care plans by enrollment, by author, by reviewer or by status."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["enrollment_id?", "authored_by_care_manager_id?", "reviewed_by_care_manager_id?", "status?", "limit?", "offset?"]
    output: CarePlan[]
    side_effects: []

  - method: POST
    path: "/care-management/care-plans/{id}/submit"
    description: "Submit the plan for clinical review."
    roles: [CareManager]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["see CarePlan.DRAFT_to_PENDING_REVIEW side effects"]

  - method: POST
    path: "/care-management/care-plans/{id}/review"
    description: "Clinical review decision. APPROVE activates the plan; REQUEST_REVISION sends it back to DRAFT and bumps plan_version_no."
    roles: [ClinicalReviewer]
    code: 200
    input: ["decision", "revision_note?"]
    output: CarePlan
    side_effects: ["see CarePlan.PENDING_REVIEW_to_ACTIVE and CarePlan.PENDING_REVIEW_to_DRAFT side effects"]

  - method: POST
    path: "/care-management/care-plans/{id}/goals"
    description: "Add a goal to a DRAFT care plan."
    roles: [CareManager]
    code: 201
    input: ["domain", "description", "target_date"]
    output: CarePlanGoal
    side_effects: ["status OPEN, barrier_flag false, both intervention counters 0"]

  - method: GET
    path: "/care-management/care-plans/{id}/goals"
    description: "List the goals of one care plan."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["status?", "domain?", "limit?", "offset?"]
    output: CarePlanGoal[]
    side_effects: []

  - method: GET
    path: "/care-management/goals/{id}"
    description: "Read one goal including its barrier flag and intervention counters."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: CarePlanGoal
    side_effects: []

  - method: POST
    path: "/care-management/goals/{id}/interventions"
    description: "Plan an intervention under a goal, committing staff minutes against the program budget."
    roles: [CareManager]
    code: 201
    input: ["modality", "staff_minutes"]
    output: Intervention
    side_effects:
      - "cost_cents computed by intervention_cost_cents and frozen"
      - "Program.committed_staff_minutes += staff_minutes"
      - "CarePlanGoal.planned_intervention_count += 1"

  - method: GET
    path: "/care-management/goals/{id}/interventions"
    description: "List the interventions planned under one goal."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Intervention[]
    side_effects: []

  - method: POST
    path: "/care-management/interventions/{id}/complete"
    description: "Record delivery of an intervention; the goal auto-completes when this was its last PLANNED intervention."
    roles: [CareManager]
    code: 200
    input: []
    output: Intervention
    side_effects: ["see Intervention.PLANNED_to_COMPLETED side effects"]

  - method: POST
    path: "/care-management/interventions/{id}/void"
    description: "Void a planned intervention, releasing its committed staff minutes."
    roles: [CareManager]
    code: 200
    input: ["void_reason"]
    output: Intervention
    side_effects: ["see Intervention.PLANNED_to_VOIDED side effects"]

  # ---------- Touch ----------
  - method: POST
    path: "/care-management/touches"
    description: "Schedule an outreach touch on a care manager's calendar."
    roles: [CareManager, ProgramAdmin]
    code: 201
    input: ["enrollment_id", "care_manager_id", "touch_type", "modality", "scheduled_start_at", "scheduled_end_at"]
    output: Touch
    side_effects: ["runs care_manager_slot_conflict_detection before persisting", "status SCHEDULED"]

  - method: GET
    path: "/care-management/touches/{id}"
    description: "Read one touch."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: Touch
    side_effects: []

  - method: GET
    path: "/care-management/touches"
    description: "List touches by enrollment, by care manager or by status."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["enrollment_id?", "care_manager_id?", "status?", "touch_type?", "limit?", "offset?"]
    output: Touch[]
    side_effects: []

  - method: POST
    path: "/care-management/touches/{id}/complete"
    description: "Complete a touch and run the six-step engagement and cadence recomputation."
    roles: [CareManager]
    code: 200
    input: ["outcome", "documentation_note?"]
    output: Touch
    side_effects: ["see Touch.SCHEDULED_to_COMPLETED steps 1 through 6", "increments Enrollment.version by 1"]

  - method: POST
    path: "/care-management/touches/{id}/cancel"
    description: "Cancel a scheduled touch and release the calendar interval."
    roles: [CareManager, ProgramAdmin]
    code: 200
    input: ["cancel_reason"]
    output: Touch
    side_effects: ["see Touch.SCHEDULED_to_CANCELLED side effects"]

  # ---------- SocialNeed / CommunityResource / Referral ----------
  - method: POST
    path: "/care-management/social-needs"
    description: "Record a social need identified on an enrollment."
    roles: [CareManager]
    code: 201
    input: ["enrollment_id", "domain", "severity"]
    output: SocialNeed
    side_effects: ["status IDENTIFIED; identified_at stamped from the logical clock"]

  - method: GET
    path: "/care-management/social-needs/{id}"
    description: "Read one social need including its escalation counter."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: []
    output: SocialNeed
    side_effects: []

  - method: GET
    path: "/care-management/social-needs"
    description: "List social needs by enrollment, domain or status."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst]
    code: 200
    input: ["enrollment_id?", "domain?", "status?", "limit?", "offset?"]
    output: SocialNeed[]
    side_effects: []

  - method: POST
    path: "/care-management/community-resources"
    description: "Register a community-based organization and its concurrent service capacity."
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "served_domains", "service_state_codes", "concurrent_slot_capacity", "contract_status?"]
    output: CommunityResource
    side_effects: ["open_referral_count and closed_loop_count start at 0"]

  - method: GET
    path: "/care-management/community-resources/{id}"
    description: "Read one community resource including its live referral counters."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst, CommunityPartner]
    code: 200
    input: []
    output: CommunityResource
    side_effects: []

  - method: POST
    path: "/care-management/referrals"
    description: "Send a social-need referral to a community resource for a half-open service interval."
    roles: [CareManager]
    code: 201
    input: ["social_need_id", "community_resource_id", "service_start_at", "service_end_at"]
    output: Referral
    side_effects:
      - "runs community_resource_slot_capacity_check before persisting"
      - "sent_by_care_manager_id := X-User-ID; status SENT; sent_at stamped"
      - "SocialNeed transitions to REFERRED; CommunityResource.open_referral_count += 1"

  - method: GET
    path: "/care-management/referrals/{id}"
    description: "Read one referral including its closed-loop timing."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst, CommunityPartner]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/care-management/referrals"
    description: "List referrals by need, by receiving resource, by sending care manager or by loop status."
    roles: [ProgramAdmin, CareManager, ClinicalReviewer, UtilizationAnalyst, CommunityPartner]
    code: 200
    input: ["social_need_id?", "community_resource_id?", "sent_by_care_manager_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/care-management/referrals/{id}/decision"
    description: "Receiving organization accepts or declines the referral."
    roles: [CommunityPartner]
    code: 200
    input: ["decision", "decline_reason?"]
    output: Referral
    side_effects: ["see Referral.SENT_to_ACCEPTED and Referral.SENT_to_DECLINED side effects"]

  - method: POST
    path: "/care-management/referrals/{id}/close-loop"
    description: "Close the referral loop. SERVICE_DELIVERED resolves the need; SERVICE_NOT_DELIVERED escalates it and puts matching goals at risk."
    roles: [CommunityPartner, CareManager]
    code: 200
    input: ["resolution", "outcome_note"]
    output: Referral
    side_effects: ["see the three Referral close-loop transitions"]

  # ---------- test-driving endpoint ----------
  - method: POST
    path: "/care-management/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, window and cadence rule reads this clock."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["no entity is mutated; nothing is recomputed retroactively"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or naming a role not declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed caller acts on a resource whose owning foreign key is not the caller's X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "a ClinicalReviewer reviews a care plan whose authored_by_care_manager_id equals their own X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is undeclared, or a value violates its declared type or range constraint"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset below 0"

  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id in the path or body resolves to no Member"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id resolves to no Program"
  - id: ERR_CARE_MANAGER_NOT_FOUND
    http: 404
    condition: "care_manager_id or to_care_manager_id resolves to no CareManager"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "enrollment_id resolves to no Enrollment"
  - id: ERR_CARE_PLAN_NOT_FOUND
    http: 404
    condition: "care_plan_id resolves to no CarePlan"
  - id: ERR_GOAL_NOT_FOUND
    http: 404
    condition: "goal_id resolves to no CarePlanGoal"
  - id: ERR_INTERVENTION_NOT_FOUND
    http: 404
    condition: "intervention_id resolves to no Intervention"
  - id: ERR_TOUCH_NOT_FOUND
    http: 404
    condition: "touch_id resolves to no Touch"
  - id: ERR_SOCIAL_NEED_NOT_FOUND
    http: 404
    condition: "social_need_id resolves to no SocialNeed"
  - id: ERR_COMMUNITY_RESOURCE_NOT_FOUND
    http: 404
    condition: "community_resource_id resolves to no CommunityResource"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral_id resolves to no Referral"
  - id: ERR_TRANSITION_EVENT_NOT_FOUND
    http: 404
    condition: "transition_event_id or index_admission_event_id resolves to no TransitionEvent"

  - id: ERR_STALE_ENROLLMENT_VERSION
    http: 412
    condition: "expected_enrollment_version does not equal the enrollment's current version on transfer or ROI measurement"

  - id: ERR_ENROLLMENT_NOT_PENDING
    http: 409
    condition: "activation attempted on an enrollment whose enrollment_status is not PENDING"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "an operation that requires enrollment_status == ACTIVE is attempted on an enrollment in another state"
  - id: ERR_ENROLLMENT_ALREADY_TERMINAL
    http: 409
    condition: "disenrollment or transfer attempted on an enrollment already GRADUATED or DISENROLLED"
  - id: ERR_CARE_PLAN_NOT_DRAFT
    http: 409
    condition: "submit or goal creation attempted on a care plan whose status is not DRAFT"
  - id: ERR_CARE_PLAN_NOT_IN_REVIEW
    http: 409
    condition: "a review decision is recorded on a care plan whose status is not PENDING_REVIEW"
  - id: ERR_CARE_PLAN_NOT_ACTIVE
    http: 409
    condition: "an operation that requires an ACTIVE care plan finds none - touch scheduling, intervention creation, or intervention completion"
  - id: ERR_GOAL_NOT_OPEN
    http: 409
    condition: "an intervention is added to a goal whose status is not OPEN or AT_RISK"
  - id: ERR_INTERVENTION_NOT_PLANNED
    http: 409
    condition: "complete or void attempted on an intervention already COMPLETED or VOIDED"
  - id: ERR_TOUCH_NOT_SCHEDULED
    http: 409
    condition: "complete or cancel attempted on a touch already COMPLETED or CANCELLED"
  - id: ERR_REFERRAL_NOT_SENT
    http: 409
    condition: "a decision is recorded on a referral whose status is not SENT"
  - id: ERR_REFERRAL_LOOP_NOT_CLOSABLE
    http: 409
    condition: "close-loop attempted on a referral whose status is not ACCEPTED or DECLINED"
  - id: ERR_SOCIAL_NEED_NOT_REFERABLE
    http: 409
    condition: "a referral is sent for a social need whose status is not IDENTIFIED or UNMET_ESCALATED"

  - id: ERR_CONSENT_NOT_GRANTED
    http: 422
    condition: "a referral is sent for a member whose social_data_consent_status is REVOKED"
  - id: ERR_DOCUMENTATION_REQUIRED
    http: 422
    condition: "a touch is completed with outcome REACHED and no non-empty documentation_note"
  - id: ERR_CREDENTIAL_NOT_AUTHORIZED
    http: 422
    condition: "the care manager's credential_level is not in Program.required_credential_levels"
  - id: ERR_STATE_LICENSURE_MISMATCH
    http: 422
    condition: "the member's state_code is not in the care manager's licensed_state_codes"

  - id: ERR_TOUCH_WINDOW_INVALID
    http: 422
    condition: "scheduled_end_at is not strictly after scheduled_start_at"
  - id: ERR_TOUCH_WINDOW_IN_PAST
    http: 422
    condition: "scheduled_start_at is earlier than the logical clock"
  - id: ERR_TOUCH_NOT_YET_DUE
    http: 409
    condition: "a touch is completed before its scheduled_start_at has been reached on the logical clock"
  - id: ERR_SERVICE_WINDOW_INVALID
    http: 422
    condition: "service_end_at is not strictly after service_start_at"
  - id: ERR_SERVICE_WINDOW_IN_PAST
    http: 422
    condition: "service_start_at is earlier than the logical clock"
  - id: ERR_MEASUREMENT_PERIOD_EMPTY
    http: 422
    condition: "the ROI intervention window contains no whole calendar month"

  - id: ERR_RESOURCE_NOT_CONTRACTED
    http: 422
    condition: "the receiving community resource is NOT_CONTRACTED or SUSPENDED"
  - id: ERR_RESOURCE_DOMAIN_MISMATCH
    http: 422
    condition: "the need's domain is outside served_domains, or the member's state is outside service_state_codes"
  - id: ERR_DUPLICATE_ACTIVE_ENROLLMENT
    http: 409
    condition: "the member already has a PENDING or ACTIVE enrollment in the same program"
  - id: ERR_TRANSFER_TO_SAME_MANAGER
    http: 409
    condition: "to_care_manager_id equals the enrollment's current care_manager_id"
  - id: ERR_GOALS_NOT_MET
    http: 409
    condition: "disenrollment with reason GOALS_MET while the active plan has no goals or any goal outside status MET"
  - id: ERR_STRATIFICATION_REQUIRED
    http: 422
    condition: "the member has no RiskStratification of the program's stratification_variant"
  - id: ERR_RISK_TIER_BELOW_PROGRAM_MINIMUM
    http: 422
    condition: "the tier rank of that stratification is below Program.min_risk_tier's rank"

  - id: ERR_CARE_MANAGER_SLOT_CONFLICT
    http: 409
    condition: "the candidate touch interval, expanded by 15 minutes on both sides, overlaps a SCHEDULED touch on the same care manager"
  - id: ERR_DUPLICATE_OPEN_REFERRAL
    http: 409
    condition: "the social need already carries a referral in status SENT or ACCEPTED"
  - id: ERR_RESOURCE_CAPACITY_EXCEEDED
    http: 409
    condition: "the community resource's concurrent_slot_capacity would be exceeded at some instant of the candidate half-open service interval"

  - id: ERR_CASELOAD_WOULD_EXCEED_CAPACITY
    http: 409
    condition: "assigning or transferring the enrollment would push the target care manager's assigned_caseload_points strictly above capacity_points"
  - id: ERR_CARE_MANAGER_OVER_CAPACITY
    http: 409
    condition: "a touch is scheduled on a care manager whose capacity_status is OVER_CAPACITY"
  - id: ERR_PROGRAM_STAFF_BUDGET_EXCEEDED
    http: 409
    condition: "committed_staff_minutes + delivered_staff_minutes + the new intervention's staff_minutes exceeds Program.staff_minute_budget"
  - id: ERR_NO_ELIGIBLE_CARE_MANAGER
    http: 409
    condition: "auto-assignment finds no care manager satisfying credential, licensure, capacity_status and headroom"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: ProgramAdmin
    description: "Plan operations. Configures programs, care managers, members, community resources and utilization feeds; owns reassignment and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /care-management/members"
      - "POST /care-management/programs"
      - "POST /care-management/care-managers"
      - "POST /care-management/community-resources"
      - "POST /care-management/enrollments/{id}/transfer"
      - "POST /care-management/_clock/set_current_utc"
    shared_operations:
      - "POST /care-management/members/{id}/consent (with CareManager)"
      - "POST /care-management/members/{id}/stratifications (with UtilizationAnalyst)"
      - "POST /care-management/transition-events (with UtilizationAnalyst)"
      - "POST /care-management/enrollments (with CareManager)"
      - "POST /care-management/enrollments/{id}/activate (with CareManager)"
      - "POST /care-management/enrollments/{id}/disenroll (with CareManager)"
      - "POST /care-management/touches (with CareManager; no ownership restriction applies to this role)"
      - "POST /care-management/touches/{id}/cancel (with CareManager)"
      - "GET /care-management/programs/{id}/accreditation-file (with UtilizationAnalyst)"
      - "all GET endpoints"

  - name: CareManager
    description: "Front-line care manager. Owns enrollments, care plans, goals, interventions, touches, social needs and outbound referrals."
    identity: "entity_backed:CareManager"
    exclusive_operations:
      - "POST /care-management/care-plans"
      - "POST /care-management/care-plans/{id}/submit"
      - "POST /care-management/care-plans/{id}/goals"
      - "POST /care-management/goals/{id}/interventions"
      - "POST /care-management/interventions/{id}/complete"
      - "POST /care-management/interventions/{id}/void"
      - "POST /care-management/touches/{id}/complete"
      - "POST /care-management/social-needs"
      - "POST /care-management/referrals"
    shared_operations:
      - "POST /care-management/enrollments (with ProgramAdmin)"
      - "POST /care-management/enrollments/{id}/activate (with ProgramAdmin)"
      - "POST /care-management/enrollments/{id}/disenroll (with ProgramAdmin)"
      - "POST /care-management/members/{id}/consent (with ProgramAdmin)"
      - "POST /care-management/touches (with ProgramAdmin; a CareManager may only book its own calendar)"
      - "POST /care-management/touches/{id}/cancel (with ProgramAdmin)"
      - "POST /care-management/referrals/{id}/close-loop (with CommunityPartner)"
      - "read endpoints other than the member list, the care-manager list and the accreditation file"

  - name: ClinicalReviewer
    description: "Licensed reviewer who approves or returns care plans. Backed by the same CareManager roster, which is what makes the segregation-of-duties check meaningful."
    identity: "entity_backed:CareManager"
    exclusive_operations:
      - "POST /care-management/care-plans/{id}/review"
    shared_operations:
      - "read endpoints other than the member list, the care-manager list and the accreditation file"

  - name: UtilizationAnalyst
    description: "Analytics and accreditation function. Runs stratification, records utilization events, produces ROI measurements and pulls the accreditation file."
    identity: "opaque"
    exclusive_operations:
      - "POST /care-management/enrollments/{id}/roi-measurements"
    shared_operations:
      - "POST /care-management/members/{id}/stratifications (with ProgramAdmin)"
      - "POST /care-management/transition-events (with ProgramAdmin)"
      - "GET /care-management/programs/{id}/accreditation-file (with ProgramAdmin)"
      - "GET /care-management/members, GET /care-management/care-managers (with ProgramAdmin)"
      - "all other GET endpoints"

  - name: CommunityPartner
    description: "Community-based organization acting on referrals sent to it. X-User-ID is the CommunityResource id."
    identity: "entity_backed:CommunityResource"
    exclusive_operations:
      - "POST /care-management/referrals/{id}/decision"
    shared_operations:
      - "POST /care-management/referrals/{id}/close-loop (with CareManager)"
      - "GET /care-management/referrals, GET /care-management/referrals/{id}, GET /care-management/community-resources/{id}"
