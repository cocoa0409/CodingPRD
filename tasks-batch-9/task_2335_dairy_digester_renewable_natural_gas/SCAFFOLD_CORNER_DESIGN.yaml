              captures: { err_interconnect: "$.data.error_id" }
            - call: "GET /injection-nominations/9f000000-0000-4000-8000-000000000007"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_nomination: "$.data.error_id" }
            - call: "GET /credit-pathways/9f000000-0000-4000-8000-000000000008"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_pathway: "$.data.error_id" }
            - call: "GET /credit-batches/9f000000-0000-4000-8000-000000000009"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { err_batch: "$.data.error_id" }
            - call: "GET /verification-audits/9f000000-0000-4000-8000-00000000000a"
