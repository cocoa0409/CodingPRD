            - { call: "POST /bookings/${bw}/check-out", payload: {}, as: PropertyManager }
            - { call: "POST /owner-statements", payload: { owner_id: "${ow}", period_year: 2026, period_month: 6 }, as: PropertyManager, captures: { stw: "$.data.id" } }
