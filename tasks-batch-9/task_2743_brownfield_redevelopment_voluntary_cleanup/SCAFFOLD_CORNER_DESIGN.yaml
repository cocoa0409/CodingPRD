        distinguishing_aspect: "Four compliant results filed in sample_date order drive compliant_streak to 4 and attainment_status ATTAINED; a fifth event created and reported LAST but sampled 2027-03-20 (between the second and third samples) with an exceedance forces a full chronological replay that yields compliant_streak 2 and regresses attainment_status to NOT_ATTAINED — an incremental counter would still read 5 and ATTAINED."
