            - call: "POST /regulatory-exams/examinations/${ex8}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /regulatory-exams/examinations/${ex8}"
              as: RegulatoryAffairsManager
              captures: { ex8_posture_pre: $.data.posture, ex8_overdue_pre: $.data.overdue_item_count }
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O8", email: "o8@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off8: $.data.id }
            - call: "POST /regulatory-exams/reviewers"
              payload: { full_name: "R8", email: "r8@x", certification_level: "L1" }
              as: PlatformAdmin
              captures: { rev8: $.data.id }
            - call: "POST /regulatory-exams/first-day-items/${it8}/submissions"
              payload: { document_manifest: [{doc_id: "d1", title: "Org", page_count: 10, sha256: "h"}] }
              as: RemediationOwner
              as_user_id: "${off8}"
