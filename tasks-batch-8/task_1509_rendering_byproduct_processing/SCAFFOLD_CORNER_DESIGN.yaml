            - "First cancel: ${err1} == ERR_ROUTE_HAS_COLLECTED_STOPS (409); route stays IN_PROGRESS"
            - "After voiding the stop, second cancel succeeds (200): route CANCELLED, stop already VOIDED is untouched"

      - name: batch_screen_quarantine_adjudicate_accept_path
        claim_type: valid_transition
        grounds: [state_machines.InboundBatch.RECEIVED_to_QUARANTINED, state_machines.InboundBatch.QUARANTINED_to_ACCEPTED]
        distinguishing_aspect: "FAIL_TEMPERATURE screening routes the batch to QUARANTINED; adjudicate ACCEPT by a different user moves it to ACCEPTED and makes it cook-eligible."
        test_recipe:
          setup: ["plant; supplier + SORT_AND_RETURN agreement; walk-in batch RECEIVED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 8000, temperature_f: 104.0, received_at: "2026-08-02T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "FAIL_TEMPERATURE" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/inbound-batches/${bat_id}/adjudicate", payload: { decision: "ACCEPT" }, as: ComplianceOfficer, as_user_id: "co-1" }
          assert:
