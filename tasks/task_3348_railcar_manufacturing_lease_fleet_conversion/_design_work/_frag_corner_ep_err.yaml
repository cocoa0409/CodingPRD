      - name: error_already_terminal_start_on_voided_program_returns_409
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_ALREADY_TERMINAL]
          - state_machines.RetrofitProgram.terminal_states.VOIDED
          - "POST /api/v1/retrofit-programs/{id}/start"
        distinguishing_aspect: "A second POST /retrofit-programs/{id}/start on a program already VOIDED — a declared terminal state of §1.2's RetrofitProgram machine — is rejected by priority 6 with ERR_ALREADY_TERMINAL and HTTP 409, while the identical call on a still-PLANNED program returns 200."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type CT-J (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-J) exists and covers both programs, satisfying the start precondition that the program has at least one RetrofitProgramCarType row."
            - "Program MAND-J1 was started and then voided, so it stands VOIDED with version 3; program MAND-J2 is untouched and still PLANNED."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "CT-J", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "LINE-J" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-J1", description: "Program to be voided", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 3 }
              as: RegulatoryRetrofitist
              captures: { p1_id: $.data.id }
            - call: "POST /api/v1/retrofit-program-car-types"
              payload: { retrofit_program_id: "${p1_id}", car_type_id: "${ct_id}" }
              as: RegulatoryRetrofitist
            - call: "POST /api/v1/retrofit-programs/${p1_id}/start"
              payload: {}
              as: RegulatoryRetrofitist
              captures: { p1_started: $.data.status }
            - call: "POST /api/v1/retrofit-programs/${p1_id}/void"
              payload: { reason: "Mandate withdrawn" }
              as: RegulatoryRetrofitist
              captures: { p1_voided: $.data.status, p1_version: $.data.version }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-J2", description: "Control program", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 3 }
              as: RegulatoryRetrofitist
              captures: { p2_id: $.data.id }
            - call: "POST /api/v1/retrofit-program-car-types"
              payload: { retrofit_program_id: "${p2_id}", car_type_id: "${ct_id}" }
              as: RegulatoryRetrofitist
          trigger:
            - call: "POST /api/v1/retrofit-programs/${p1_id}/start"
              payload: {}
              as: RegulatoryRetrofitist
              captures: { err_terminal: $.data.error_id }
            - call: "GET /api/v1/retrofit-programs/${p1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p1_after: $.data.status, p1_after_version: $.data.version }
            - call: "POST /api/v1/retrofit-programs/${p2_id}/start"
              payload: {}
              as: RegulatoryRetrofitist
              captures: { p2_status: $.data.status }
          assert:
            - "The first program reached the terminal state: status == ${p1_voided} == \"VOIDED\" at version ${p1_version} == 3 (PLANNED -> IN_PROGRESS -> VOIDED)"
            - "The restart attempt returns HTTP 409 with data.error_id == ${err_terminal} == \"ERR_ALREADY_TERMINAL\""
            - "The terminal state is unchanged by the rejection: status == ${p1_after} == \"VOIDED\" with version still ${p1_after_version} == 3"
            - "VOIDED is a declared terminal_state of §1.2's RetrofitProgram machine and §1.4 priority 6 lists POST /retrofit-programs/{id}/start in its applies_to set, so the terminal rule rather than the generic state rule owns this rejection"
            - "The control program is still legal to start: POST /retrofit-programs/${p2_id}/start returns HTTP 200 with data.status == ${p2_status} == \"IN_PROGRESS\", so the 409 is terminal-state-specific"

      - name: error_stale_version_amendment_redraft_returns_412
        claim_type: Violation → Error
        grounds:
