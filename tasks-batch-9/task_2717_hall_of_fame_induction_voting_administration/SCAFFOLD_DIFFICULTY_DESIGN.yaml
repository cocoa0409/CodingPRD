  - rule_id: boundary_precision_check
    instances:
      - name: waiting_period_inclusive_at_exact_eligible_year
        grounds:
          - calculations.career_eligibility_assessment
          - validations[priority=47]
          - entities.Candidacy.fields.eligible_from_year
          - endpoints[POST /candidacies]
        distinguishing_aspect: |
          Metric under test: the integer year comparison InductionCycle.cycle_year >=
          Candidacy.eligible_from_year on POST /candidacies. A candidate who retired in 2021 under
          a 5-year wait has eligible_from_year 2026 exactly; the 2026 cycle must accept the
          nomination because the comparison is inclusive, while the 2025 cycle - one year below the
          same boundary - must reject it with ERR_WAITING_PERIOD_NOT_MET (422).
        test_recipe:
          setup:
            - "EligibilityRule (PLAYER, MODERN) with waiting_period_years 5, min_career_seasons 10, min_career_metric 2000."
            - "A candidate retired in 2021 with career_seasons 15 and career_metric_value 3000, so only the waiting period is in play; eligible_from_year computes to 2021 + 5 == 2026."
            - "TWO cycles with nominations open: BASEBALL 2026 (at the boundary) and BASEBALL 2025 (one year below it)."
            - "One credentialed elector to name as nominator; the logical clock stays at 2026-08-01T00:00:00Z."
