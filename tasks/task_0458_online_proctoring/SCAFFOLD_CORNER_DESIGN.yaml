# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Online Proctoring & Remote Exam — breadth probe over §1.1–§1.7
# Clock default 2026-01-01T00:00:00Z; exam windows in 2026-07-01.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_exam_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Exam, endpoints]
        distinguishing_aspect: "POST /exams with all required fields returns 201 and an Exam with status=OPEN, version=1, server-minted id."
        test_recipe:
          setup: ["An institution exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst CE" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Math 101", base_duration_minutes: 120, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE" }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id, ver: $.data.version, st: $.data.status }
          assert:
            - "response code == 201"
            - "Exam.${exam_id}.status == OPEN"
            - "Exam.${exam_id}.version == 1"
            - "Exam.${exam_id}.lockdown_required == true (default applied)"

      - name: create_exam_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Exam
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /exams omitting base_duration_minutes returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["An institution exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst MV" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "No Dur", window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: create_exam_invalid_monitoring_mode_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Exam
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /exams with monitoring_mode=HYBRID (not in {LIVE, RECORD_REVIEW}) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["An institution exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst EN" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Bad Mode", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "HYBRID" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: accommodation_extra_time_default_zero_applied
        claim_type: Defaults
        grounds: [entities.Accommodation.fields.extra_time_pct]
        distinguishing_aspect: "POST /accommodations omitting extra_time_pct yields extra_time_pct=0 and status=APPROVED."
        test_recipe:
          setup: ["An institution, candidate, and exam exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst AD" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand AD", email: "ad@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Def Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE" }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
          trigger:
            - call: "POST /accommodations"
              payload: { candidate_id: "${cand_id}", exam_id: "${exam_id}" }
              as: SchedulingCoordinator
              captures: { acc_id: $.data.id, pct: $.data.extra_time_pct, st: $.data.status }
          assert:
            - "Accommodation.${acc_id}.extra_time_pct == 0"
            - "Accommodation.${acc_id}.status == APPROVED"

      - name: identity_verification_result_computed_pass
        claim_type: Computed Fields
        grounds: [entities.IdentityVerification.fields.result]
        distinguishing_aspect: "POST verify-identity with photo_id_match=true AND room_scan_clear=true computes result=PASS (input cannot set result directly)."
        test_recipe:
          setup: ["A scheduled appointment on a lockdown exam exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst IV" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc IV", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand IV", email: "iv@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "IV Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE", lockdown_required: true }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/verify-identity"
              payload: { photo_id_match: true, room_scan_clear: true }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { res: $.data.result }
          assert:
            - "IdentityVerification result == PASS"

      - name: get_proctor_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Proctor
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /proctors/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No proctor with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /proctors/11111111-1111-4111-8111-111111111111"
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: identity_verification_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.IdentityVerification]
        distinguishing_aspect: "IdentityVerification has common_fields:false — its read carries id+created_at but no version and no update endpoint exists."
        test_recipe:
          setup: ["A PASS IdentityVerification exists for an appointment."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst IM" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc IM", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand IM", email: "im@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "IM Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE", lockdown_required: true }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/verify-identity"
              payload: { photo_id_match: true, room_scan_clear: true }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { idv_res: $.data.result }
          trigger:
            - call: "GET /appointments/${appt_id}/identity-verifications"
              as: SchedulingCoordinator
              captures: { first_res: "$.data[0].result" }
          assert:
            - "the IdentityVerification record exposes id, created_at, appointment_id, result but no version field"

      - name: list_exams_pagination_envelope
        claim_type: Listing
        grounds: [entities.Exam, endpoints]
        distinguishing_aspect: "GET /exams?limit=1 returns an array response with total_count and has_more in the envelope."
        test_recipe:
          setup: ["Two exams exist under one institution."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst LS" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Ex 1", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE" }
              as: SchedulingCoordinator
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "Ex 2", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE" }
              as: SchedulingCoordinator
          trigger:
            - call: "GET /exams?institution_id=${inst_id}&limit=1&offset=0"
              as: SchedulingCoordinator
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_appointment_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Appointment.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an already-CANCELLED appointment a second time returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A SCHEDULED appointment cancelled once."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst CC" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc CC", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand CC", email: "cc@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "CC Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: complete_blocked_while_escalation_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.ProctoringSession.ACTIVE_to_COMPLETED]
        distinguishing_aspect: "POST /sessions/{id}/complete with an open/under-review escalation on the session returns ERR_INVALID_STATE (session is REVIEW_HELD, not ACTIVE)."
        test_recipe:
          setup: ["A session held under an OPEN escalation."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst CB" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc CB", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand CB", email: "cb@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "CB Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${proc_id}"
              captures: { flag_id: $.data.id }
            - call: "POST /escalations"
              payload: { session_id: "${sess_id}", incident_flag_id: "${flag_id}" }
              as: Proctor
              as_user_id: "${proc_id}"
          trigger:
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: resume_non_paused_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ProctoringSession.PAUSED_to_ACTIVE]
        distinguishing_aspect: "POST /sessions/{id}/resume on an ACTIVE (not PAUSED) session returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One ACTIVE (never paused) session."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst RP" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc RP", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand RP", email: "rp@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "RP Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /sessions/${sess_id}/resume"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: deliver_already_delivered_report_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.IntegrityReport.DRAFT_to_DELIVERED]
        distinguishing_aspect: "POST /integrity-reports/{id}/deliver on a DELIVERED (terminal) report returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DELIVERED report over one COMPLETED session."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst DD" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc DD", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand DD", email: "dd@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "DD Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /integrity-reports"
              payload: { institution_id: "${inst_id}", candidate_id: "${cand_id}", exam_id: "${exam_id}", session_ids: ["${sess_id}"] }
              as: SchedulingCoordinator
              captures: { report_id: $.data.id }
            - call: "POST /integrity-reports/${report_id}/deliver"
              payload: {}
              as: SchedulingCoordinator
          trigger:
            - call: "POST /integrity-reports/${report_id}/deliver"
              payload: {}
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cleared_report_disposition_when_above_threshold
        claim_type: Side Effect Execution
        grounds: [state_machines.IntegrityReport.DRAFT_to_DELIVERED, calculations.report_aggregate_score, entities.IntegrityReport.fields.disposition]
        distinguishing_aspect: "Delivering a report over a single clean COMPLETED session (score 100) yields aggregate_score 100.00 and disposition CLEARED (>= threshold 70)."
        test_recipe:
          setup: ["One COMPLETED session with no flags (score 100), default institution threshold 70."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst CL" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc CL", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand CL", email: "cl@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "CL Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T09:00:00Z", window_end_utc: "2026-07-01T17:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${proc_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: Proctor
              as_user_id: "${proc_id}"
            - call: "POST /integrity-reports"
              payload: { institution_id: "${inst_id}", candidate_id: "${cand_id}", exam_id: "${exam_id}", session_ids: ["${sess_id}"] }
              as: SchedulingCoordinator
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /integrity-reports/${report_id}/deliver"
              payload: {}
              as: SchedulingCoordinator
              captures: { agg: $.data.aggregate_score, disp: $.data.disposition }
          assert:
            - "IntegrityReport.${report_id}.aggregate_score == 100.00"
            - "IntegrityReport.${report_id}.disposition == CLEARED"

      - name: checkin_before_scheduled_start_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
          - errors[ERR_CHECKIN_TOO_EARLY]
        distinguishing_aspect: "Check-in while the logical clock is still before scheduled_start_utc returns ERR_CHECKIN_TOO_EARLY (clock at default 2026-01-01)."
        test_recipe:
          setup: ["A SCHEDULED appointment at 2026-07-01T09:00; clock left at startup default 2026-01-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst TE" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Prc TE", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand TE", email: "te@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
