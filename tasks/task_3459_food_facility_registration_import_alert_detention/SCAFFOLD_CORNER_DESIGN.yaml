  # ===========================================================================
  - section: calculations
    instances:
      - name: renewal_from_registered_extends_old_expiry_at_window_open_boundary
        claim_type: correct_result
        grounds:
          - calculations.facility_registration_expiry
          - endpoints.POST_/registry/facilities/{id}/renew
        distinguishing_aspect: "The renewal window opens exactly at expires_at - 90 days (inclusive): at 2028-06-02T00:00:00Z a REGISTERED facility renews and, because now < expires_at, the new expiry extends the OLD expiry by 730 days to 2030-08-31T00:00:00Z rather than rebasing to now."
        test_recipe:
          setup:
            - "Facility registered at default clock 2026-09-01T00:00:00Z (expires_at 2028-08-31T00:00:00Z, version 1); clock advanced to exactly the window-open instant 2028-06-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Sapporo Seafoods", facility_kind: "FOREIGN", country_code: "JP", ufi: "UFI-JP-2201" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registry/facilities/${fac_id}"
              payload: {}
              as: PlatformAdmin
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /registry/facilities/${fac_id}/renew"
              payload: { expected_facility_version: "${fac_v}" }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { new_exp: $.data.expires_at, st: $.data.registration_status }
          assert:
            - "renewal accepted at the exact window-open instant (boundary inclusive): st == REGISTERED"
            - "new_exp == 2030-08-31T00:00:00Z (old expires_at 2028-08-31T00:00:00Z + 730 days — REGISTERED renewal extends the old expiry)"
            - "Facility.${fac_id}.version == 2"
            - "pre-renewal read: fac_v == 1 and registration_status was still REGISTERED at 2028-06-02T00:00:00Z"

