              captures: { e7: $.data.error_id }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av1}", period_index: 2, reported_store_count: 400, distributed_store_count: 400, reported_case_volume: 1100 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { s2: $.data.id }
            - call: "POST /distribution-snapshots/${s1}/reverse"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e8: $.data.error_id }
          assert:
            - "Call 1 returns 409 ERR_STORE_COUNT_EXCEEDS_CHAIN — 5000 > BIGMART's 1200; this priority-11 bound is reported even though the 2-item award also breaks the priority-12 slot bound"
            - "Call 2 returns 409 ERR_REVIEW_SLOTS_EXCEEDED — 2 items against slots_remaining 1"
            - "Call 3 succeeds: slots_awarded == 1, slots_remaining == 0, one Authorization for ${i1} in AUTHORIZED / UNBILLED with authorized_store_count == 400, and Presentation.${pres}.status == ACCEPTED with authorized_item_count == 1"
            - "Call 4 returns 409 ERR_CLAIM_EXCEEDS_DEDUCTION — 50001 > amount_cents 50000; Deduction.${ded}.dispute_state stays NOT_DISPUTED"
            - "Call 6 returns 409 ERR_PERIOD_OUT_OF_SEQUENCE — periods_reported is 0 so only period_index 1 is admissible, and no live POSTING exists at index 2 (so the uniqueness rule is NOT violated here)"
            - "Call 7 returns 409 ERR_REPORTED_EXCEEDS_AUTHORIZED (500 > 400) and call 8 returns 409 ERR_DISTRIBUTION_EXCEEDS_REPORTED (350 > 300)"
            - "Call 9 returns 201; the three rejected posts left Authorization.${auth}.version untouched, which is why ${av0} was still valid for all of them"
            - "Call 11 returns 409 ERR_PERIOD_ALREADY_POSTED — a live POSTING exists at period 1; both v-uniqueness and v-snapshot-sequence are violated at priority 11 and §1.4's table order makes the uniqueness error the reported one"
            - "Call 12 returns 201 for period 2, then call 13 returns 409 ERR_SNAPSHOT_NOT_LATEST — ${s1} is no longer the highest live period, so ${s2} must be reversed first"

      - name: dispute_window_length_is_conditional_on_the_retailers_own_policy
        claim_type: conditional_validation
        grounds:
          - validations.v-dispute-window
          - entities.Retailer.fields.deduction_dispute_window_days
          - errors.ERR_DISPUTE_WINDOW_CLOSED
        distinguishing_aspect: |
          The same deduction_date and the same clock produce opposite outcomes
          under two retailers because the window length is a per-retailer config
          field: BIGMART keeps the 90-day default while SHORTCO sets 5. The last
          admissible day is INCLUSIVE (deduction_date + N), so 2026-08-06 is
          still open for SHORTCO and 2026-08-07 is not, while BIGMART is still
          open on both days.
        test_recipe:
          setup:
            - "Retailer BIGMART with the default deduction_dispute_window_days (90) and retailer SHORTCO with deduction_dispute_window_days 5; principal NWF."
            - "Three deductions all dated 2026-08-01: DA under BIGMART, DB1 and DB2 under SHORTCO."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ra: $.data.id }
            - call: "POST /retailers"
              payload: { name: "Shortco", chain_code: "SHORTCO", total_store_count: 90, deduction_dispute_window_days: 5 }
              as: BrokerAdmin
              captures: { rb: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ra}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 40000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ra}"
              captures: { da: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${rb}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 40000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${rb}"
              captures: { db1: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${rb}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 40000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${rb}"
              captures: { db2: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T23:59:59Z" }
              as: BrokerAdmin
            - call: "POST /deductions/${db1}/dispute"
              payload: { claim_amount_cents: 40000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { ds1: $.data.dispute_state }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /deductions/${db2}/dispute"
              payload: { claim_amount_cents: 40000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { e1: $.data.error_id }
            - call: "POST /deductions/${da}/dispute"
              payload: { claim_amount_cents: 40000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { ds2: $.data.dispute_state }
          assert:
            - "Call 2 succeeds with ${ds1} == FILED — 2026-08-06 is exactly deduction_date + 5 days and the last day is inclusive"
            - "Call 4 returns 422 ERR_DISPUTE_WINDOW_CLOSED — one day later the same shape is refused, and Deduction.${db2}.dispute_state stays NOT_DISPUTED with filed_by_user_id null"
            - "Call 5 succeeds with ${ds2} == FILED — BIGMART's 90-day default window is still open on the very same clock, so the rule is genuinely config-conditional"
            - "Both filings leave settlement_state == OPEN and open_cents == 40000 — filing a claim never moves money"

      - name: cross_entity_state_and_window_checks_on_submit_and_decide
        claim_type: cross_entity_validation
        grounds:
          - validations.v-catalog-validated
          - validations.v-award-membership
          - validations.v-review-decision-window
          - errors.ERR_ITEM_CATALOG_NOT_VALIDATED
          - errors.ERR_ITEM_NOT_IN_SUBMITTED_PRESENTATION
          - errors.ERR_REVIEW_WINDOW_CLOSED
          - errors.ERR_REVIEW_NOT_OPEN
        distinguishing_aspect: |
          Three checks that read OTHER rows: the catalog_state of every listed
          item at submit time, membership of every awarded item in a SUBMITTED
          presentation of THIS review at decide time, and the half-open decision
          window. The membership check makes a valid, VALIDATED item of the same
          principal illegal purely because its presentation never listed it, and
          the window is exclusive at review_window_end, so 2026-09-15 is already
          too late.
