            - { call: "POST /talent/cycles/${cy}/sessions", payload: { candidate_id: "${cB}", interviewer_id: "${iv1}", guide_id: "${g}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { sB: $.data.id } }
