  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Two instances over two DIFFERENT error-category pairs:
  #   state (22) vs business_fiscal (56, 57)
  #   business_temporal (27) vs business_safety (35)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lapsed_authorization_at_priority_22_masks_both_fiscal_ceilings
        grounds:
          - validations[priority 22 ERR_AUTHORIZATION_LAPSED]
          - validations[priority 56 ERR_ANNUAL_CAP_EXCEEDED]
          - validations[priority 57 ERR_INSUFFICIENT_RESERVE_BALANCE]
          - state_machines.WithdrawalRequest.APPROVED_to_LAPSED
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          A single execute call violates three rules at once — the authorization lapsed on
          2026-08-11, the authorized 49083727 exceeds the 6000000 fiscal-year cap, and it also
          exceeds the 41958137 balance — and the state-category rule at priority 22 must win, so the
          response is ERR_AUTHORIZATION_LAPSED (409) and never ERR_ANNUAL_CAP_EXCEEDED or
          ERR_INSUFFICIENT_RESERVE_BALANCE (both 422).
