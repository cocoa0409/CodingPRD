      - name: corner_suspension_outranks_the_access_window_on_booking
        claim_type: Priority conflict
        grounds:
          - validations[20].ERR_ACCOUNT_NOT_ACTIVE
          - validations[32].ERR_OUTSIDE_ACCESS_WINDOW
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / suspended_account_outranks_out_of_window_slot_on_visit_booking"
          rationale: |
            §1.8 rule 5 already books a visit that violates both the account-state
            rule at priority 20 and the access-window rule at priority 32 and
            pins the reported error to the lower-priority number, then repairs
            each violation in turn. A second copy here would only re-run it.

      - name: corner_part_type_check_outranks_the_stock_check
        claim_type: Priority conflict
        grounds:
          - validations[29].ERR_PART_TYPE_MISMATCH
          - validations[59].ERR_PART_OUT_OF_STOCK
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / part_type_mismatch_outranks_part_out_of_stock_on_inspection"
          rationale: |
            The out-of-stock rule is deliberately filed below the type-mismatch
            rule in §1.4, and §1.8 rule 5 already exercises an inspection whose
            part is both the wrong component type and exhausted, then fixes the
            type to reveal the stock error underneath.

      - name: corner_caustic_certification_outranks_the_alternation_rule
        claim_type: Priority conflict
        grounds:
          - validations[36].ERR_TECHNICIAN_NOT_CAUSTIC_CERTIFIED
          - validations[38].ERR_CHEMICAL_PARITY_VIOLATION
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / caustic_certification_outranks_chemical_alternation_on_cycle_log"
          rationale: |
            §1.8 rule 5 already logs a caustic cycle that is simultaneously
            un-certified and out of alternation order, asserts the certification
            error, and then swaps in a certified technician to surface the parity
            violation.

  # ===========================================================================
  # SECTION 5 — endpoints
  # 59 endpoints. Standard-CRUD coverage is already discharged by the entities
  # section's Creation / Retrieval / Listing / Not Found rows, and there is no
  # bulk endpoint in §1.5, so this section carries the four patterns that are
  # genuinely endpoint-shaped: action, conditional action, cross-reference link
  # and computed read.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_reschedule_abandons_the_original_and_mints_a_linked_replacement
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_service_visits_reschedule
          - state_machines.ServiceVisit.work_status.SCHEDULED_to_ABANDONED
          - entities.ServiceVisit.fields.rescheduled_from_visit_id
        distinguishing_aspect: |
          One POST produces two rows: the original is ABANDONED with
          abandon_reason RESCHEDULED while a brand-new SCHEDULED visit carries
          rescheduled_from_visit_id back to it, inherits account_id and
          visit_kind, and defaults technician_id to the original's because the
          optional field was omitted — and the self-referential link is
          queryable via the rescheduled_from_visit_id filter.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE, access window 480-1080, with an ACTIVE contract."
            - "Technician 'Dana Ruiz' ACTIVE; one SCHEDULED ROUTINE_CLEANING visit on 2026-08-05 540-660."
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Anchor Alehouse", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acct: $.data.id, acct_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acct}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctr: $.data.id }
            - call: "POST /draft-service/contracts/${ctr}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/technicians"
              payload: { full_name: "Dana Ruiz", certification_level: "MASTER", caustic_certified: true, status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { tech: $.data.id }
            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 540, scheduled_end_minute: 660 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { orig: $.data.id }
          trigger:
            - call: "POST /draft-service/service-visits/${orig}/reschedule"
              payload: { scheduled_date: "2026-08-07", scheduled_start_minute: 600, scheduled_end_minute: 720 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { repl: $.data.id, from: $.data.rescheduled_from_visit_id, rtech: $.data.technician_id, rkind: $.data.visit_kind, rstatus: $.data.work_status }
            - call: "GET /draft-service/service-visits?rescheduled_from_visit_id=${orig}&limit=10&offset=0"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { total: $.total_count, listed: "$.data[0].id" }
          assert:
            - "the reschedule returns HTTP 201 with a new id ${repl} != ${orig}"
            - "${from} == ${orig} and ${rstatus} == SCHEDULED and ${rkind} == ROUTINE_CLEANING"
            - "${rtech} == ${tech} — technician_id was omitted and defaulted from the original"
            - "ServiceVisit.${repl}.scheduled_date == 2026-08-07 and .scheduled_start_minute == 600 and .scheduled_end_minute == 720"
            - "ServiceVisit.${orig}.work_status == ABANDONED and .abandon_reason == RESCHEDULED"
            - "${total} == 1 and ${listed} == ${repl}"

      - name: corner_return_to_service_is_blocked_until_the_failing_cycle_is_voided
        claim_type: Conditional action
        grounds:
          - endpoints.POST_beer_lines_return_to_service
          - validations[51].ERR_LINE_STILL_NON_COMPLIANT
          - validations[23].ERR_LINE_OUT_OF_SERVICE
          - state_machines.BeerLine.OUT_OF_SERVICE_to_IN_SERVICE
        distinguishing_aspect: |
          The line cannot be re-cleaned while it is out of service (priority 23
          blocks new cycles), so the only route back is for the auditor to void
          the FAIL_TEMPERATURE cycle: before the void, return-to-service is
