            - "GET /toolworks/furnace-campaigns?lot_id=${lot2_id} returns total_count 0"
            - "ToolSku.${sku_s2_id}.proof_torque_required_nm == 36.4"

  - rule_id: boundary_precision_check
    instances:

      - name: brand_risk_score_exactly_forty_flips_posture_restricted
        grounds:
          - calculations.brand_risk_rollup
          - entities.ToolSku.fields.brand_risk_score
          - entities.ToolSku.fields.warranty_posture
          - state_machines.CounterfeitReport.OPEN_to_CONFIRMED
        distinguishing_aspect: |
          The POSTURE_RESTRICT_AT boundary is inclusive on the integer metric
          brand_risk_score, observed through
          POST /toolworks/counterfeit-reports/{id}/confirm. On a PROFESSIONAL SKU
          (CHANNEL_EXPOSURE 0.8) the cumulative score walks 12 -> 36 -> 40; at 36
          the posture is still OPEN and at exactly 40 it flips to RESTRICTED.
        test_recipe:
          setup:
            - "One PROFESSIONAL SOCKET SKU whose CHANNEL_EXPOSURE is 0.8, warranty_posture OPEN, brand_risk_score 0."
            - "Three OPEN CounterfeitReports on it with frozen risk_points 12 (MODERATE, 20 units), 24 (STRONG, 30 units) and 4 (WEAK, 10 units)."
            - "The first two reports have already been confirmed, leaving brand_risk_score 36 and warranty_posture OPEN."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "SK-19-PRO", tool_family: "SOCKET", channel: "PROFESSIONAL", nominal_size_mm: 19, alloy_grade: "CR_V", list_price_cents: 2600, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "GreyMarketA", seller_handle: "seller_a", evidence_grade: "MODERATE", unit_estimate: 20 }
              as: BrandProtectionAnalyst
              captures: { rep_a_id: $.data.id, rep_a_points: $.data.risk_points }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "GreyMarketB", seller_handle: "seller_b", evidence_grade: "STRONG", unit_estimate: 30 }
              as: BrandProtectionAnalyst
              captures: { rep_b_id: $.data.id, rep_b_points: $.data.risk_points }
            - call: "POST /toolworks/counterfeit-reports"
              payload: { sku_id: "${sku_id}", channel_name: "GreyMarketC", seller_handle: "seller_c", evidence_grade: "WEAK", unit_estimate: 10 }
              as: BrandProtectionAnalyst
              captures: { rep_c_id: $.data.id, rep_c_points: $.data.risk_points }
            - call: "POST /toolworks/counterfeit-reports/${rep_a_id}/confirm"
              payload: { confirmation_note: "Etch mismatch on sample" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
            - call: "POST /toolworks/counterfeit-reports/${rep_b_id}/confirm"
              payload: { confirmation_note: "Wall thickness under spec" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
            - call: "GET /toolworks/tool-skus/${sku_id}"
              payload: {}
              as: BrandProtectionAnalyst
              captures: { score_at_36: $.data.brand_risk_score, posture_at_36: $.data.warranty_posture }
          trigger:
            - call: "POST /toolworks/counterfeit-reports/${rep_c_id}/confirm"
              payload: { confirmation_note: "Low-grade tip, still counterfeit packaging" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
          assert:
            - "CounterfeitReport.${rep_a_id}.risk_points == 12"
            - "CounterfeitReport.${rep_b_id}.risk_points == 24"
            - "CounterfeitReport.${rep_c_id}.risk_points == 4"
            - "Before the trigger: ToolSku.${sku_id}.brand_risk_score == 36 and ToolSku.${sku_id}.warranty_posture == OPEN"
            - "After the trigger: ToolSku.${sku_id}.brand_risk_score == 40 and ToolSku.${sku_id}.warranty_posture == RESTRICTED"
            - "ToolSku.${sku_id}.warranty_posture != SUSPENDED (40 is below POSTURE_SUSPEND_AT 85)"
            - "ToolSku.${sku_id}.confirmed_counterfeit_count == 3"

      - name: test_run_specimen_count_equals_available_pool_boundary
        grounds:
          - calculations.specimen_ledger
          - validations[priority=701]
          - errors[ERR_SPECIMENS_EXHAUSTED]
          - entities.ProductionLot.fields.specimens_available
        distinguishing_aspect: |
          A different metric on a different endpoint: the exact-equality boundary
          of the integer specimen pool on POST /toolworks/test-runs. A request for
          specimen_count 7 against specimens_available 7 is accepted and drives
          the pool to exactly 0, while the very next request for a single specimen
          is refused with ERR_SPECIMENS_EXHAUSTED (409).
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO."
            - "One ProductionLot with specimen_pool_total 12, heat-treated and advanced to PLATED so hardness, dimensional and salt-spray runs are all schedulable."
            - "One HARDNESS run already scheduled with 5 specimens, leaving specimens_available 7."
            - "One salt-spray chamber with coupon_capacity 24 so chamber capacity is never the binding constraint."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/salt-spray-chambers"
              payload: { chamber_code: "SSC-1", coupon_capacity: 24 }
              as: QualityEngineer
              captures: { chamber_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 12 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "MACHINED" }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "PLATED" }
              as: ProductionPlanner
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "HARDNESS", specimen_count: 5, window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T09:00:00Z" }
              as: QualityEngineer
              captures: { hard_id: $.data.id }
          trigger:
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "DIMENSIONAL", specimen_count: 7, window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T11:00:00Z" }
              as: QualityEngineer
              captures: { dim_id: $.data.id, dim_count: $.data.specimen_count }
            - call: "POST /toolworks/test-runs"
              payload: { lot_id: "${lot_id}", test_type: "SALT_SPRAY", specimen_count: 1, chamber_id: "${chamber_id}", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-08T00:00:00Z" }
              as: QualityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "The 7-specimen DIMENSIONAL request succeeds with HTTP 201 and TestRun.${dim_id}.specimen_count == 7"
            - "ProductionLot.${lot_id}.specimens_available == 0"
            - "ProductionLot.${lot_id}.specimens_committed == 12"
            - "ProductionLot.${lot_id}.specimens_consumed == 0"
            - "The following 1-specimen SALT_SPRAY request returns HTTP 409 with error_id == 'ERR_SPECIMENS_EXHAUSTED'"
            - "GET /toolworks/production-lots/${lot_id}/test-runs returns total_count 2 (the refused run was never persisted)"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: lot_advance_requires_completed_furnace_campaign
        grounds:
          - validations[priority=470]
          - errors[ERR_HEAT_TREAT_NOT_COMPLETED]
          - state_machines.FurnaceCampaign.SCHEDULED_to_COMPLETED
          - state_machines.ProductionLot.process_status.FORGED_to_HEAT_TREATED
        distinguishing_aspect: |
          The entity pair is ProductionLot depending on FurnaceCampaign, gated on
          the campaign's status field: FORGED -> HEAT_TREATED is refused with
          ERR_HEAT_TREAT_NOT_COMPLETED while the only campaign is SCHEDULED, and
          the identical request succeeds the moment that campaign becomes
          COMPLETED. Nothing about the lot itself changes between the two calls.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO."
            - "One furnace qualified for CR_MO, status AVAILABLE."
            - "One ProductionLot in process_status FORGED / cert_status DRAFT with exactly one FurnaceCampaign, still SCHEDULED."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-BR-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id, camp_status: $.data.status }
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
          assert:
            - "The first advance returns HTTP 409 with error_id == 'ERR_HEAT_TREAT_NOT_COMPLETED'"
            - "After the refusal ProductionLot.${lot_id}.process_status == FORGED and cert_status == DRAFT"
            - "FurnaceCampaign.${camp_id}.status == COMPLETED and soak_minutes == 120 after the completion call"
            - "The second advance returns HTTP 200 with ProductionLot.${lot_id}.process_status == HEAT_TREATED"
            - "ProductionLot.${lot_id}.cert_status is still DRAFT after the successful advance — the cert dimension only opens (DRAFT -> IN_TEST) on the first successful test-run, so the two dimensions move independently"

      - name: claim_approve_requires_sku_posture_open
        grounds:
          - validations[priority=471]
          - errors[ERR_SKU_WARRANTY_RESTRICTED]
          - entities.ToolSku.fields.warranty_posture
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.WarrantyClaim.FRAUD_HOLD_to_SUBMITTED
        distinguishing_aspect: |
          A different entity pair gated on a different field: WarrantyClaim
          approval depends on ToolSku.warranty_posture, a derived aggregate rather
          than a lifecycle status. After a confirmed counterfeit pushes the SKU to
          RESTRICTED and the resulting fraud hold is cleared, the claim is back in
          SUBMITTED yet still cannot be approved — the blocker lives entirely on
          the other entity, and it is ERR_SKU_WARRANTY_RESTRICTED, not a claim
          state error.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO, list_price_cents 3300, with a CERTIFIED and RELEASED lot of 500 units so units_on_hand is 500."
            - "One WarrantyProgram funded with 5000000 cents and fraud_score_threshold 60."
            - "One CONSUMER Claimant with one claim on that SKU carrying one line (HANDLE 1099 x1, reserve 681)."
            - "One CONFIRMED CounterfeitReport worth 50 risk points that has driven warranty_posture to RESTRICTED and cascaded the claim into FRAUD_HOLD."
            - "That system hold has been cleared by user wa-2, so the claim is SUBMITTED again while the SKU stays RESTRICTED."
