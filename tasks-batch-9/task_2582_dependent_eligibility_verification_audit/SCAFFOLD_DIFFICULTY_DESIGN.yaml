  - rule_id: transitive_cascade
    instances:
      - name: escalation_sweep_cascades_program_case_dependent_notice_counters
        grounds:
          - state_machines.AuditProgram.RESPONSE_WINDOW_to_ESCALATION
          - state_machines.AuditCase.NOTIFIED_to_NON_RESPONSIVE
          - state_machines.AuditCase.NON_RESPONSIVE_to_ESCALATED
          - state_machines.Dependent.PENDING_VERIFICATION_to_TERMINATION_PENDING
          - calculations.case_escalation_priority_score
          - endpoints[POST /audit-programs/{id}/run-sweep]
        distinguishing_aspect: |
          Forward cascade of depth 5 originating from the run-sweep S2 transition: the program phase change
          causes each case to go NON_RESPONSIVE, that case change causes its PENDING_VERIFICATION dependents to
          go TERMINATION_PENDING, each dependent change causes a TerminationNotice plus a CommunicationEvent,
          and the existence of that notice is what causes NON_RESPONSIVE -> ESCALATED and the program counter
          recompute. Each link is caused by the previous link, not directly by the sweep call.
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1 (49713) and Employee E2 holds DOMESTIC_PARTNER dependent D3 (49713); both are in scope and PENDING_VERIFICATION with zero responses and zero reminders."
            - "Program P was announced 2026-09-01 with amnesty_end 2026-09-22 and response_deadline 2026-10-16; both cases are NOTIFIED and the program is still AMNESTY_OPEN because no sweep has run."
            - "The clock is 2026-10-17, so a single sweep pass will run S1 (amnesty close) and then S2 (escalation)."
            - "Priority scores at S2: case C1 (SPOUSE only) = 40*1 + 0 + 0 + 15 = 55; case C2 (DOMESTIC_PARTNER, a sensitive relationship) = 40*1 + 25 + 0 + 15 = 80, so C2 is processed first and its notice takes batch_sequence_no 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
