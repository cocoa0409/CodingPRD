          trigger:
            - call: "GET /cash-ops/stores/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { err_store: $.data.error_id }
            - call: "GET /cash-ops/cashiers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { err_cashier: $.data.error_id }
            - call: "GET /cash-ops/safes/00000000-0000-4000-8000-000000000003"
              payload: {}
