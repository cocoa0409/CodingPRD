  - name: quarantine_sentinel_certificate_blocks_the_lot_permanently
    claim_type: conditional_cascade
    grounds:
    - state_machines.BarStockLot.RECEIVED_to_QUARANTINED
    - validations[priority=64]
    - errors[ERR_BAR_LOT_NOT_CERTIFIED]
    distinguishing_aspect: |
      The certify endpoint branches on the sentinel value: certificate_number QUARANTINE drives the lot to QUARANTINED instead of CERTIFIED, and a work order staged on it can never be started.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
