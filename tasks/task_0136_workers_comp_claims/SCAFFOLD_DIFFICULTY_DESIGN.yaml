  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_benefit_payment
        grounds:
          - validations[priority=5]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair {state (priority 5)} vs {business_fiscal (priority 13)}:
          a benefit payment against a DENIED claim (invalid state) whose amount would
          also exceed the reserve must return ERR_INVALID_STATE (the lower-priority
          state check wins over the fiscal check).
        test_recipe:
          setup:
            - "Claim A is DENIED; a Reserve for it would be impossible, so the request also has no valid reserve to draw from."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Iota Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-009", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /claims/${claim_a}/deny"
              payload: { denial_reason: "not work-related" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /benefit-payments"
              payload: { claim_id: "${claim_a}", benefit_type: "TTD" }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "$.data.error_id == ERR_INVALID_STATE (state precondition, priority 5, beats the fiscal reserve check at priority 13)"

      - name: existence_vs_referential_on_sroi_transmit
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Error-category pair {existence (priority 4)} vs {business_referential
          (priority 6)}: transmitting a SROI whose claim_id does not exist returns
          ERR_NOT_FOUND, not ERR_FROI_NOT_ACKNOWLEDGED — existence is checked before
          the FROI-sequencing rule. (Different pairing from the state/fiscal instance.)
        test_recipe:
          setup:
            - "No claim or report with the queried id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /injury-reports/00000000-0000-4000-8000-000000000000/transmit"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "$.data.error_id == ERR_NOT_FOUND (existence at priority 4 fires before the FROI-sequencing referential check at priority 6)"

