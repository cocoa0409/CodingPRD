# =============================================================================
# PRD Benchmark Seed Tables — River Cleanup & Adopt-a-Roadway Program
# =============================================================================

scenario: |
  River Cleanup & Adopt-a-Roadway Program (state adopt-a-highway program): segment
  adoption agreement & minimum cleanup frequency, event scheduling & supply
  (bag/vest/grabber) distribution, safety briefing & traffic/water hazard protocol,
  debris weight & material type reporting, hazardous item discovery protocol & agency
  notification, sign recognition for adopting group, volunteer waiver & minor
  supervision, program metrics & re-adoption renewal

domain_name: river-cleanup-adopt-a-roadway
api_prefix: /program

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers        # minimum cleanup frequency gates suspension/renewal
    - derived_field_reconciliation   # standing/counters and depot on_hand recomputed from children
    - optimistic_concurrency         # OCC on AdoptionAgreement.version for amendments
    - cascading_side_effects         # suspension cascade; completion-driven reinstatement cascade
  entity_topology: flat              # peer entities joined by FK references; flat URL collections
  state_machine_shape: cyclic        # agreement ACTIVE<->SUSPENDED and renewal loop; event postpone loop
  relationship_patterns:
    - one_to_many
    - self_referential               # VolunteerWaiver.supervisor_waiver_id
    - cross_aggregate
  role_model: approval_chain         # GroupLeader applies/reports -> ProgramCoordinator approves/resolves
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AdopterGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public name of the adopting organization" }
      - { name: org_type, type: enum, source: input, description: "Organization category", constraints: "one of {CIVIC, BUSINESS, SCHOOL, FAITH, OTHER}" }
      - { name: contact_name, type: string, source: input, description: "Primary contact person full name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }

  - name: RoadSegment
    parent: null
    common_fields: true
    fields:
      - { name: route_name, type: string, source: input, description: "Roadway or river reach name, e.g. 'River Rd'" }
      - { name: mile_marker_start, type: number, source: input, description: "Start mile marker; must be < mile_marker_end" }
      - { name: mile_marker_end, type: number, source: input, description: "End mile marker; must be > mile_marker_start" }
      - { name: mile_length, type: number, source: computed, description: "mile_marker_end - mile_marker_start, 2 decimal places round_half_up" }
      - { name: segment_type, type: enum, source: input, description: "ROADWAY for roadside segments, RIVERBANK for river cleanup reaches", constraints: "one of {ROADWAY, RIVERBANK}" }
      - { name: water_adjacent, type: boolean, source: input, default: false, description: "True when the segment borders water; drives the debris bag surcharge in supply_allocation" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE while no non-terminal agreement spans it; ADOPTED while an agreement is PENDING_REVIEW/ACTIVE/SUSPENDED/RENEWAL_REVIEW", constraints: "one of {AVAILABLE, ADOPTED}" }

  - name: AdoptionAgreement
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: system, description: "FK -> AdopterGroup.id; adopting organization" }
      - { name: segment_id, type: string, source: system, description: "FK -> RoadSegment.id; adopted segment" }
      - { name: contact_email, type: string, source: input, description: "Agreement-level contact email; amendable via PATCH" }
      - { name: special_instructions, type: string, source: input, default: null, description: "Free-text agency notes; amendable via PATCH" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "Lifecycle: PENDING_REVIEW -> ACTIVE <-> SUSPENDED, ACTIVE -> RENEWAL_REVIEW -> ACTIVE|EXPIRED, -> TERMINATED/REJECTED", constraints: "one of {PENDING_REVIEW, ACTIVE, SUSPENDED, RENEWAL_REVIEW, EXPIRED, TERMINATED, REJECTED}" }
      - { name: term_start_date, type: string, source: system, default: null, description: "ISO date set at approval (and reset at each renewal approval)" }
      - { name: term_end_date, type: string, source: computed, default: null, description: "term_start_date + 24 months (calendar arithmetic)" }
      - { name: cleanups_completed_in_window, type: integer, source: computed, default: 0, description: "Count of COMPLETED CleanupEvents whose scheduled_date falls in the rolling 365-day window [today-365d, today]; recomputed on every completion and every clock sweep" }
      - { name: standing, type: enum, source: computed, default: NOT_EVALUATED, description: "COMPLIANT when cleanups_completed_in_window >= 3; else NOT_EVALUATED while agreement age < 180 days; else NON_COMPLIANT (rolling variant; see calculations.compliance_standing)", constraints: "one of {NOT_EVALUATED, COMPLIANT, NON_COMPLIANT}" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of approved renewals" }
      - { name: suspension_reason, type: string, source: system, default: null, description: "Recorded when the agreement is suspended" }

  - name: CleanupEvent
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> AdoptionAgreement.id; event runs under this agreement" }
      - { name: scheduled_date, type: string, source: input, description: "ISO calendar date of the cleanup; single-day event" }
      - { name: expected_volunteers, type: integer, source: input, description: "Planned headcount >= 1; drives supply_allocation" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> BRIEFING_DONE -> COMPLETED; SCHEDULED|BRIEFING_DONE -> POSTPONED -> SCHEDULED; -> CANCELLED; SCHEDULED|POSTPONED -> NO_SHOW", constraints: "one of {SCHEDULED, BRIEFING_DONE, POSTPONED, COMPLETED, CANCELLED, NO_SHOW}" }
      - { name: briefing_attendee_count, type: integer, source: system, default: 0, description: "Attendees recorded at safety briefing; reset to 0 when the event is postponed" }
      - { name: postpone_count, type: integer, source: system, default: 0, description: "Number of times the event has been postponed" }
      - { name: completed_weight_lbs, type: number, source: computed, default: null, description: "Denormalized copy of the DebrisReport.official_weight_lbs, set when the event completes; reconciled with the report on every read" }

  - name: VolunteerWaiver
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> AdoptionAgreement.id; waiver is scoped to one agreement" }
      - { name: volunteer_full_name, type: string, source: input, description: "Volunteer legal name" }
      - { name: dob, type: string, source: input, description: "ISO date of birth; drives is_minor at signing" }
      - { name: is_minor, type: boolean, source: computed, description: "True when calendar age at signed_date is strictly < 18 years; exactly 18 on signed_date is NOT a minor" }
      - { name: guardian_full_name, type: string, source: input, default: null, description: "Required when is_minor is true" }
      - { name: guardian_consent, type: boolean, source: input, default: false, description: "Must be true when is_minor is true" }
      - { name: supervisor_waiver_id, type: string, source: input, default: null, description: "FK -> VolunteerWaiver.id; required when is_minor is true — an ACTIVE adult waiver under the same agreement" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> EXPIRED (clock sweep past expiry_date) or REVOKED", constraints: "one of {ACTIVE, EXPIRED, REVOKED}" }
      - { name: signed_date, type: string, source: system, description: "ISO date = logical clock date at creation" }
      - { name: expiry_date, type: string, source: computed, description: "signed_date + 1 year; waiver is ACTIVE while today <= expiry_date" }

  - name: SupplyDepot
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Depot name" }
      - { name: bags_on_hand, type: integer, source: input, description: "Initial stock at creation; thereafter system-mutated by issues (consumable, never returned)", constraints: ">= 0" }
      - { name: vests_on_hand, type: integer, source: input, description: "Initial stock at creation; thereafter system-mutated by issues/returns/losses", constraints: ">= 0" }
      - { name: grabbers_on_hand, type: integer, source: input, description: "Initial stock at creation; thereafter system-mutated by issues/returns/losses", constraints: ">= 0" }
      - { name: vests_pool_total, type: integer, source: system, description: "Pinned at creation = initial vests_on_hand; conserved-quantity baseline" }
      - { name: grabbers_pool_total, type: integer, source: system, description: "Pinned at creation = initial grabbers_on_hand; conserved-quantity baseline" }
      - { name: lost_vests_total, type: integer, source: system, default: 0, description: "Cumulative vests written off as lost at reconciliation" }
      - { name: lost_grabbers_total, type: integer, source: system, default: 0, description: "Cumulative grabbers written off as lost at reconciliation" }

  - name: SupplyDistribution
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> CleanupEvent.id; exactly one distribution per event" }
      - { name: depot_id, type: string, source: system, description: "FK -> SupplyDepot.id; issuing depot" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> PARTIALLY_RETURNED -> RECONCILED; ISSUED -> RECONCILED on full return, loss write-off, or cancellation cascade", constraints: "one of {ISSUED, PARTIALLY_RETURNED, RECONCILED}" }
      - { name: vests_issued, type: integer, source: computed, description: "From calculations.supply_allocation at issue time" }
      - { name: grabbers_issued, type: integer, source: computed, description: "ceil(expected_volunteers / 2)" }
      - { name: bags_issued, type: integer, source: computed, description: "ceil(V * 2 * mile_length), x1.25 then ceil again when segment.water_adjacent" }
      - { name: vests_returned, type: integer, source: system, default: 0, description: "Cumulative vests returned" }
      - { name: grabbers_returned, type: integer, source: system, default: 0, description: "Cumulative grabbers returned" }
      - { name: lost_vests, type: integer, source: system, default: 0, description: "Vests written off at reconciliation" }
      - { name: lost_grabbers, type: integer, source: system, default: 0, description: "Grabbers written off at reconciliation" }

  - name: DebrisReport
    parent: null
    common_fields: false
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> CleanupEvent.id; unique — at most one report per event" }
      - { name: weight_method, type: enum, source: input, description: "MEASURED (scale weight supplied) or ESTIMATED (server computes from bag counts)", constraints: "one of {MEASURED, ESTIMATED}" }
      - { name: measured_total_weight_lbs, type: number, source: input, default: null, description: "Required when weight_method == MEASURED; forbidden when ESTIMATED" }
      - { name: material_lines, type: array, source: input, description: "Non-empty array of {material_type, bag_count?, line_weight_lbs?}; bag_count used under ESTIMATED, line_weight_lbs under MEASURED", constraints: "material_type one of {GENERAL_TRASH, RECYCLABLES, METALS, YARD_WASTE, OTHER}; each material_type at most once per report" }
      - { name: material_breakdown, type: array, source: computed, description: "Server-normalized [{material_type, line_weight_lbs}] with each line at 1 decimal place round_half_up" }
      - { name: official_weight_lbs, type: number, source: computed, description: "MEASURED: measured_total_weight_lbs. ESTIMATED: sum of per-line rounded weights (round per line THEN sum — order pinned). 1 decimal place." }

  - name: HazardReport
    parent: null
    common_fields: true
    fields:
      - { name: segment_id, type: string, source: system, description: "FK -> RoadSegment.id; where the hazardous item was found" }
      - { name: event_id, type: string, source: system, default: null, description: "FK -> CleanupEvent.id; set when discovered during a scheduled event" }
      - { name: hazard_type, type: enum, source: input, description: "Category of hazardous item", constraints: "one of {CHEMICAL_CONTAINER, SYRINGES, PROPANE_TANK, ASBESTOS, OTHER}" }
      - { name: description, type: string, source: input, description: "What was found; volunteers must NOT touch the item" }
      - { name: location_note, type: string, source: input, description: "Marked location so agency crew can find it" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED -> ACKNOWLEDGED -> RESOLVED", constraints: "one of {REPORTED, ACKNOWLEDGED, RESOLVED}" }
      - { name: agency_reference, type: string, source: system, default: null, description: "Agency notification reference minted at acknowledgement" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of acknowledgement" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of resolution" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Supplied on the resolve call; describes removal/disposal" }

  - name: SignRecognition
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> AdoptionAgreement.id; sign belongs to one agreement" }
      - { name: sign_text, type: string, source: input, description: "Text displayed on the recognition sign", constraints: "1..60 characters" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> INSTALLED -> REMOVED", constraints: "one of {REQUESTED, INSTALLED, REMOVED}" }
      - { name: installed_date, type: string, source: system, default: null, description: "ISO date set at installation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AdoptionAgreement
    initial_state: PENDING_REVIEW
    terminal_states: [EXPIRED, TERMINATED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /program/agreements/{id}/review-decision with decision=APPROVE"
        actor: ProgramCoordinator
        preconditions:
          - "agreement.status == PENDING_REVIEW (ERR_AGREEMENT_NOT_PENDING)"
          - "segment.status == AVAILABLE (ERR_SEGMENT_NOT_AVAILABLE)"
        side_effects:
          - "RoadSegment.status -> ADOPTED"
          - "term_start_date := clock date; term_end_date := term_start_date + 24 months; standing := NOT_EVALUATED"
          - "increments AdoptionAgreement.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /program/agreements/{id}/review-decision with decision=REJECT"
        actor: ProgramCoordinator
        preconditions:
          - "agreement.status == PENDING_REVIEW (ERR_AGREEMENT_NOT_PENDING)"
        side_effects:
          - "increments AdoptionAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /program/agreements/{id}/suspend (coordinator) OR system sweep on clock advance when age >= 180 days and rolling cleanups_completed_in_window < 3"
        actor: ProgramCoordinator | system
        preconditions:
          - "agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "system path additionally: standing recomputed NON_COMPLIANT"
        side_effects:
          - "suspension_reason := reason input or 'COMPLIANCE_DEFICIENCY' (system path)"
          - "Cascade link 1: every child CleanupEvent in {SCHEDULED, POSTPONED} -> CANCELLED (BRIEFING_DONE events are NOT touched)"
          - "Cascade link 2: for each so-cancelled event, its SupplyDistribution in {ISSUED, PARTIALLY_RETURNED} -> RECONCILED with all outstanding returnables treated as returned (no loss recorded)"
          - "Cascade link 3: SupplyDepot.vests_on_hand/grabbers_on_hand restocked by the returned counts and depot updated_at refreshed"
          - "increments AdoptionAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when a DebrisReport submission recomputes standing to COMPLIANT)"
        actor: system
        preconditions:
          - "agreement.status == SUSPENDED"
          - "recomputed cleanups_completed_in_window >= 3 (rolling window)"
        side_effects:
          - "standing := COMPLIANT; suspension_reason := null"
          - "increments AdoptionAgreement.version by 1"
      - from: ACTIVE
        to: RENEWAL_REVIEW
        trigger: "POST /program/agreements/{id}/renewal-request"
        actor: GroupLeader
        preconditions:
          - "agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "clock date within [term_end_date - 90 days, term_end_date] (ERR_RENEWAL_WINDOW_CLOSED)"
        side_effects:
          - "increments AdoptionAgreement.version by 1"
      - from: RENEWAL_REVIEW
        to: ACTIVE
        trigger: "POST /program/agreements/{id}/renewal-decision with decision=APPROVE"
        actor: ProgramCoordinator
        preconditions:
          - "agreement.status == RENEWAL_REVIEW (ERR_AGREEMENT_NOT_IN_RENEWAL)"
          - "ANNIVERSARY eligibility: every 12-month term window holds >= 3 COMPLETED cleanups and zero hazards in {REPORTED, ACKNOWLEDGED} exist on the segment (ERR_RENEWAL_NOT_ELIGIBLE)"
        side_effects:
          - "term_start_date := old term_end_date; term_end_date := new term_start_date + 24 months"
          - "renewal_count += 1; standing := NOT_EVALUATED; cleanups_completed_in_window recomputed"
          - "increments AdoptionAgreement.version by 1"
      - from: RENEWAL_REVIEW
        to: EXPIRED
        trigger: "POST /program/agreements/{id}/renewal-decision with decision=DENY"
        actor: ProgramCoordinator
        preconditions:
          - "agreement.status == RENEWAL_REVIEW (ERR_AGREEMENT_NOT_IN_RENEWAL)"
        side_effects:
          - "RoadSegment.status -> AVAILABLE"
          - "SignRecognition in INSTALLED -> REMOVED"
          - "increments AdoptionAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep on clock advance when clock date > term_end_date"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE and clock date > term_end_date"
        side_effects:
          - "RoadSegment.status -> AVAILABLE"
          - "SignRecognition in INSTALLED -> REMOVED"
          - "increments AdoptionAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /program/agreements/{id}/terminate"
        actor: ProgramCoordinator | GroupLeader
        preconditions:
          - "agreement.status in {ACTIVE, SUSPENDED, RENEWAL_REVIEW} (ERR_AGREEMENT_TERMINAL)"
        side_effects:
          - "All child CleanupEvents in {SCHEDULED, BRIEFING_DONE, POSTPONED} -> CANCELLED"
          - "Each cancelled event's SupplyDistribution in {ISSUED, PARTIALLY_RETURNED} -> RECONCILED, outstanding returnables restocked to depot (no loss)"
          - "SignRecognition in INSTALLED -> REMOVED"
          - "RoadSegment.status -> AVAILABLE"
          - "increments AdoptionAgreement.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /program/agreements/{id}/terminate"
        actor: ProgramCoordinator | GroupLeader
        preconditions:
          - "same as ACTIVE -> TERMINATED"
        side_effects:
          - "same cascade as ACTIVE -> TERMINATED"
      - from: RENEWAL_REVIEW
        to: TERMINATED
        trigger: "POST /program/agreements/{id}/terminate"
        actor: ProgramCoordinator | GroupLeader
        preconditions:
          - "same as ACTIVE -> TERMINATED"
        side_effects:
          - "same cascade as ACTIVE -> TERMINATED"

  - entity: CleanupEvent
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: BRIEFING_DONE
        trigger: "POST /program/events/{id}/briefing"
        actor: GroupLeader
        preconditions:
          - "event.status == SCHEDULED (ERR_EVENT_NOT_SCHEDULED)"
          - "clock date <= scheduled_date (briefing happens on or before event day, else ERR_REPORT_WINDOW_CLOSED)"
          - "every attendee waiver ACTIVE, unexpired, same agreement (ERR_WAIVER_INVALID_ATTENDEE)"
          - "every minor attendee's supervisor_waiver_id is also in the attendee list (ERR_SUPERVISOR_ABSENT)"
        side_effects:
          - "briefing_attendee_count := size of attendee_waiver_ids"
          - "increments CleanupEvent.version by 1"
      - from: SCHEDULED
        to: POSTPONED
        trigger: "POST /program/events/{id}/postpone"
        actor: GroupLeader
        preconditions:
          - "event.status in {SCHEDULED, BRIEFING_DONE} (ERR_EVENT_TERMINAL)"
        side_effects:
          - "postpone_count += 1; briefing_attendee_count := 0 (re-briefing required after reschedule)"
          - "increments CleanupEvent.version by 1"
      - from: BRIEFING_DONE
        to: POSTPONED
        trigger: "POST /program/events/{id}/postpone"
        actor: GroupLeader
        preconditions:
          - "event.status in {SCHEDULED, BRIEFING_DONE} (ERR_EVENT_TERMINAL)"
        side_effects:
          - "same as SCHEDULED -> POSTPONED"
      - from: POSTPONED
        to: SCHEDULED
        trigger: "PATCH /program/events/{id} with a new scheduled_date"
        actor: GroupLeader
        preconditions:
          - "event.status == POSTPONED for reschedule (or SCHEDULED for plain edits); otherwise ERR_EVENT_TERMINAL"
          - "new scheduled_date >= clock date + 14 days (ERR_EVENT_TOO_SOON)"
          - "new date does not collide with another live event on the same segment (ERR_EVENT_WINDOW_OVERLAP)"
        side_effects:
          - "scheduled_date updated; status := SCHEDULED"
          - "increments CleanupEvent.version by 1"
      - from: BRIEFING_DONE
        to: COMPLETED
        trigger: "POST /program/events/{id}/debris-report"
        actor: GroupLeader
        preconditions:
          - "event.status == BRIEFING_DONE (ERR_EVENT_NOT_BRIEFED) — since completion moves the event out of BRIEFING_DONE, this state guard also enforces at most one report per event"
          - "clock date within [scheduled_date, scheduled_date + 30 days] (ERR_REPORT_WINDOW_CLOSED)"
        side_effects:
          - "Cascade link 1: DebrisReport created; event.completed_weight_lbs := report.official_weight_lbs; event -> COMPLETED"
          - "Cascade link 2: AdoptionAgreement.cleanups_completed_in_window and standing recomputed (rolling variant)"
          - "Cascade link 3: if agreement was SUSPENDED and recomputed standing == COMPLIANT, agreement -> ACTIVE (auto-reinstatement)"
          - "increments CleanupEvent.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /program/events/{id}/cancel OR cascade from agreement suspend/terminate"
        actor: GroupLeader | ProgramCoordinator | system
        preconditions:
          - "event.status in {SCHEDULED, BRIEFING_DONE, POSTPONED} (ERR_EVENT_TERMINAL)"
        side_effects:
          - "SupplyDistribution in {ISSUED, PARTIALLY_RETURNED} -> RECONCILED; outstanding returnables restocked to depot (no loss recorded)"
          - "increments CleanupEvent.version by 1"
      - from: BRIEFING_DONE
        to: CANCELLED
        trigger: "POST /program/events/{id}/cancel OR cascade from agreement terminate"
        actor: GroupLeader | ProgramCoordinator | system
        preconditions:
          - "same as SCHEDULED -> CANCELLED"
        side_effects:
          - "same as SCHEDULED -> CANCELLED"
      - from: POSTPONED
        to: CANCELLED
        trigger: "POST /program/events/{id}/cancel OR cascade from agreement suspend/terminate"
        actor: GroupLeader | ProgramCoordinator | system
        preconditions:
          - "same as SCHEDULED -> CANCELLED"
        side_effects:
          - "same as SCHEDULED -> CANCELLED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system sweep on clock advance when clock date > scheduled_date"
        actor: system
        preconditions:
          - "event.status in {SCHEDULED, POSTPONED} and clock date > scheduled_date"
        side_effects:
          - "SupplyDistribution in {ISSUED, PARTIALLY_RETURNED} -> RECONCILED; outstanding returnables restocked (no loss)"
          - "increments CleanupEvent.version by 1"
      - from: POSTPONED
        to: NO_SHOW
        trigger: "system sweep on clock advance when clock date > scheduled_date"
        actor: system
        preconditions:
          - "same as SCHEDULED -> NO_SHOW"
        side_effects:
          - "same as SCHEDULED -> NO_SHOW"

  - entity: VolunteerWaiver
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /program/waivers/{id}/revoke"
        actor: GroupLeader
        preconditions:
          - "waiver.status == ACTIVE (ERR_WAIVER_NOT_ACTIVE)"
        side_effects:
          - "increments VolunteerWaiver.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep on clock advance when clock date > expiry_date"
        actor: system
        preconditions:
          - "waiver.status == ACTIVE and clock date > expiry_date"
        side_effects:
          - "increments VolunteerWaiver.version by 1"

  - entity: SupplyDistribution
    initial_state: ISSUED
    terminal_states: [RECONCILED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_RETURNED
        trigger: "POST /program/supplies/{id}/return with returned counts below issued and mark_remaining_lost false"
        actor: GroupLeader | ProgramCoordinator
        preconditions:
          - "distribution.status in {ISSUED, PARTIALLY_RETURNED} (ERR_SUPPLY_ALREADY_RECONCILED if RECONCILED)"
          - "cumulative returned per item <= issued (ERR_RETURN_EXCEEDS_ISSUED)"
        side_effects:
          - "SupplyDepot.vests_on_hand += returned_vests; grabbers_on_hand += returned_grabbers"
          - "increments SupplyDistribution.version by 1"
      - from: ISSUED
        to: RECONCILED
        trigger: "POST /program/supplies/{id}/return completing full return OR with mark_remaining_lost=true; OR system cascade from event cancel/no-show/agreement suspend/terminate"
        actor: GroupLeader | ProgramCoordinator | system
        preconditions:
          - "distribution.status in {ISSUED, PARTIALLY_RETURNED}"
        side_effects:
          - "Depot restocked by returned counts; when mark_remaining_lost: lost_vests/lost_grabbers := outstanding, depot.lost_*_total += lost, outstanding NOT restocked"
          - "System cascade path: outstanding treated as returned (restocked, zero loss)"
          - "increments SupplyDistribution.version by 1"
      - from: PARTIALLY_RETURNED
        to: RECONCILED
        trigger: "POST /program/supplies/{id}/return completing the balance or marking the rest lost; OR system cascade"
        actor: GroupLeader | ProgramCoordinator | system
        preconditions:
          - "same as ISSUED -> RECONCILED"
        side_effects:
          - "same as ISSUED -> RECONCILED"

  - entity: HazardReport
    initial_state: REPORTED
    terminal_states: [RESOLVED]
    transitions:
      - from: REPORTED
        to: ACKNOWLEDGED
        trigger: "POST /program/hazards/{id}/acknowledge"
        actor: ProgramCoordinator
        preconditions:
          - "hazard.status == REPORTED (ERR_HAZARD_NOT_REPORTED)"
        side_effects:
          - "agency_reference := minted notification reference (agency notified); acknowledged_at := clock timestamp"
          - "increments HazardReport.version by 1"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /program/hazards/{id}/resolve"
        actor: ProgramCoordinator
        preconditions:
          - "hazard.status == ACKNOWLEDGED (ERR_HAZARD_NOT_ACKNOWLEDGED)"
        side_effects:
          - "resolved_at := clock timestamp; resolution_note stored"
          - "increments HazardReport.version by 1"

  - entity: SignRecognition
    initial_state: REQUESTED
    terminal_states: [REMOVED]
    transitions:
      - from: REQUESTED
        to: INSTALLED
        trigger: "POST /program/signs/{id}/install"
        actor: ProgramCoordinator
        preconditions:
          - "sign.status == REQUESTED (ERR_SIGN_NOT_REQUESTED)"
          - "agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
          - "at least one CleanupEvent under the agreement is COMPLETED (ERR_NO_COMPLETED_CLEANUP)"
        side_effects:
          - "installed_date := clock date"
          - "increments SignRecognition.version by 1"
      - from: INSTALLED
        to: REMOVED
        trigger: "system cascade from agreement TERMINATED / EXPIRED / renewal DENY"
        actor: system
        preconditions:
          - "sign.status == INSTALLED"
        side_effects:
          - "increments SignRecognition.version by 1"

  - entity: RoadSegment
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ADOPTED
        trigger: "system (agreement review-decision APPROVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADOPTED
        to: AVAILABLE
        trigger: "system (agreement TERMINATED / EXPIRED / renewal DENY)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: AdoptionAgreement
    write_endpoint: "PATCH /program/agreements/{id}"
    occ_field: expected_agreement_version
    description: |
      Amending an AdoptionAgreement whose version has advanced since the client
      last observed it is rejected. The client's view is stale (another writer —
      e.g. a status transition or a prior amendment — has mutated the agreement),
      so the amendment is refused until the client re-reads.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compliance_standing
    trigger: "clock sweep (POST /_clock/set_current_utc), every DebrisReport submission, and renewal-decision evaluation"
    algorithm: threshold
    formula: |
      REQUIRED = 3 cleanups per 365-day period.
      Window membership is by CleanupEvent.scheduled_date (service date), and only
      events in status COMPLETED count.
      ROLLING variant (drives suspension sweeps and the `standing` field):
        n = count(COMPLETED events with scheduled_date in [today - 365 days, today])
        standing := COMPLIANT when n >= 3;
                    else NOT_EVALUATED while agreement age (today - term_start_date) < 180 days;
                    else NON_COMPLIANT
        cleanups_completed_in_window := n
        Auto-suspension sweep fires only when age >= 180 days AND n < 3.
      ANNIVERSARY variant (drives renewal-decision APPROVE eligibility):
        window_k = [term_start_date + (k-1)*12 months, term_start_date + k*12 months) for k = 1, 2
        eligible iff every window_k holds >= 3 COMPLETED cleanups
    input_set: "CleanupEvents of the agreement with status == COMPLETED; membership by scheduled_date, inclusive lower bound, exclusive upper bound for ANNIVERSARY windows, both inclusive for the ROLLING [today-365d, today] window"
    constants:
      REQUIRED_CLEANUPS_PER_YEAR: 3
      ROLLING_WINDOW_DAYS: 365
      GRACE_DAYS: 180
      TERM_MONTHS: 24
    precision: "integer counts; >= comparison at the threshold (exactly 3 is COMPLIANT)"
    variants:
      - name: ROLLING
        when: "suspension sweeps and the agreement.standing / cleanups_completed_in_window fields"
        difference: "trailing 365-day window anchored at today"
      - name: ANNIVERSARY
        when: "renewal-decision APPROVE"
        difference: "fixed 12-month windows anchored at term_start_date; EVERY window must pass, so the same completion history can be COMPLIANT under ROLLING yet renewal-ineligible under ANNIVERSARY"

  - name: official_event_weight
    trigger: "POST /program/events/{id}/debris-report"
    algorithm: aggregation
    formula: |
      ESTIMATED variant:
        for each material line: line_weight = round_half_up(bag_count * AVG_BAG_WEIGHT_LBS[material_type], 1)
        official_weight_lbs = sum of the ROUNDED line weights   (round per line, THEN sum — order pinned)
      MEASURED variant:
        official_weight_lbs = measured_total_weight_lbs
        validation: sum of supplied line_weight_lbs values must equal measured_total_weight_lbs exactly at 1 decimal place, else ERR_WEIGHT_MISMATCH
      The two variants legitimately produce different official_weight_lbs for the same physical cleanup.
    input_set: "the submitted material_lines array; per-bag averages by material_type"
    constants:
      AVG_BAG_WEIGHT_LBS_GENERAL_TRASH: 12.75
      AVG_BAG_WEIGHT_LBS_RECYCLABLES: 7.25
      AVG_BAG_WEIGHT_LBS_METALS: 22.4
      AVG_BAG_WEIGHT_LBS_YARD_WASTE: 10.6
      AVG_BAG_WEIGHT_LBS_OTHER: 9.85
    precision: "1 decimal place, round_half_up; per-line rounding precedes summation"
    variants:
      - name: MEASURED
        when: "crew weighed the debris on a scale"
        difference: "official weight taken from the scale reading; lines must reconcile to it exactly"
      - name: ESTIMATED
        when: "no scale available; bag counts reported instead"
        difference: "official weight derived from per-material per-bag averages with per-line rounding"

  - name: supply_allocation
    trigger: "POST /program/events/{id}/supplies"
    algorithm: constraint_propagation
    formula: |
      Inputs: V = event.expected_volunteers, M = segment.mile_length, W = segment.water_adjacent, depot stock.
      vests_issued    = V
      grabbers_issued = ceil(V / 2)
      base_bags       = ceil(V * BAGS_PER_VOLUNTEER_MILE * M)
      bags_issued     = W ? ceil(base_bags * WATER_SURCHARGE) : base_bags
      Stock gate (evaluated last): each issued quantity must be <= the depot's on_hand, else ERR_SUPPLY_STOCK_EXCEEDED (no partial issuance).
      Worked: V=7, M=2.0, W=true  -> vests 7, grabbers ceil(3.5)=4, bags ceil(28*1.25)=35
              V=7, M=2.0, W=false -> vests 7, grabbers 4, bags 28
    input_set: "the event, its agreement's segment, and the named depot"
    constants:
      BAGS_PER_VOLUNTEER_MILE: 2
      WATER_SURCHARGE: 1.25
      GRABBER_DIVISOR: 2
    precision: "integer units; ceil applied per line item, surcharge ceil applied after multiplication"

  - name: program_metrics
    trigger: "GET /program/metrics"
    algorithm: aggregation
    formula: |
      active_agreements   = count(AdoptionAgreement with status == ACTIVE)
      adopted_miles       = round_half_up(sum(RoadSegment.mile_length where status == ADOPTED), 2)
      available_miles     = round_half_up(sum(RoadSegment.mile_length where status == AVAILABLE), 2)
      total_debris_lbs    = round_half_up(sum(DebrisReport.official_weight_lbs over all reports), 1)
      completed_cleanups  = count(CleanupEvent with status == COMPLETED)
      open_hazards        = count(HazardReport with status in {REPORTED, ACKNOWLEDGED})
    input_set: "all entities; status filters pinned above; debris reports are immutable so the sum is stable"
    precision: "miles 2dp, weight 1dp, counts integer"

  - name: waiver_minor_age
    trigger: "POST /program/waivers"
    algorithm: threshold
    formula: |
      age_years = largest integer a such that dob + a years <= signed_date (calendar arithmetic)
      is_minor = age_years < 18
      Boundary: dob exactly 18 years before signed_date -> age 18 -> NOT a minor;
      one day later dob -> age 17 -> minor, guardian fields and supervisor required.
    input_set: "dob input and the logical clock date at creation"
    constants:
      MAJORITY_AGE: 18
    precision: "whole calendar years; strict < comparison"

  - name: returnables_conservation
    trigger: "invariant checked after every supply issue / return / reconcile / cascade"
    algorithm: aggregation
    formula: |
      For each depot and each returnable item i in {vests, grabbers}:
        depot.<i>_on_hand + sum(distribution outstanding_i over status in {ISSUED, PARTIALLY_RETURNED}) + depot.lost_<i>_total == depot.<i>_pool_total
      where outstanding_i = <i>_issued - <i>_returned - lost_<i>.
      Compensating pair: an issue followed by a full return of the same units leaves depot.<i>_on_hand identical to its pre-issue value.
    input_set: "one SupplyDepot and all its SupplyDistributions"
    precision: "integer units, exact equality"

  - name: mile_pool_conservation
    trigger: "invariant checked after every segment creation and every agreement approve/terminate/expire/deny"
    algorithm: aggregation
    formula: |
      sum(RoadSegment.mile_length where status == AVAILABLE) + sum(RoadSegment.mile_length where status == ADOPTED)
        == sum(RoadSegment.mile_length over all segments)   (a constant once segments are fixed)
      Compensating pair: approving an agreement then terminating it leaves available_miles identical to its pre-approval value.
    input_set: "all RoadSegments"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "GroupLeader ownership: X-User-ID must equal the AdopterGroup id at the root of the target resource's chain (agreement.group_id; events/supplies/waivers/signs/debris via their agreement; hazards via event's agreement when event_id supplied)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "all GroupLeader write/read endpoints on owned chains" }
  - { priority: 5, category: existence, check: "request shape: required fields present, types/enums valid, ranges valid (expected_volunteers >= 1; mile_marker_end > mile_marker_start; sign_text 1..60 chars; dob a past date; decision in the endpoint's enum)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: existence, check: "path {id} and body group_id references resolve to an AdopterGroup", error_id: ERR_GROUP_NOT_FOUND, http_status: 404, applies_to: "group-scoped endpoints" }
  - { priority: 3, category: existence, check: "path/body segment references resolve to a RoadSegment", error_id: ERR_SEGMENT_NOT_FOUND, http_status: 404, applies_to: "segment-scoped endpoints" }
  - { priority: 3, category: existence, check: "path/body agreement references resolve to an AdoptionAgreement", error_id: ERR_AGREEMENT_NOT_FOUND, http_status: 404, applies_to: "agreement-scoped endpoints" }
  - { priority: 3, category: existence, check: "path/body event references resolve to a CleanupEvent", error_id: ERR_EVENT_NOT_FOUND, http_status: 404, applies_to: "event-scoped endpoints" }
  - { priority: 3, category: existence, check: "path waiver id and body supervisor_waiver_id / attendee_waiver_ids resolve to VolunteerWaivers", error_id: ERR_WAIVER_NOT_FOUND, http_status: 404, applies_to: "waiver-scoped endpoints and briefing" }
  - { priority: 3, category: existence, check: "path supply distribution id resolves to a SupplyDistribution", error_id: ERR_SUPPLY_NOT_FOUND, http_status: 404, applies_to: "supply-scoped endpoints" }
  - { priority: 3, category: existence, check: "body depot_id resolves to a SupplyDepot", error_id: ERR_DEPOT_NOT_FOUND, http_status: 404, applies_to: "POST /program/events/{id}/supplies" }
  - { priority: 3, category: existence, check: "path hazard id resolves to a HazardReport", error_id: ERR_HAZARD_NOT_FOUND, http_status: 404, applies_to: "hazard-scoped endpoints" }
  - { priority: 3, category: existence, check: "path sign id resolves to a SignRecognition", error_id: ERR_SIGN_NOT_FOUND, http_status: 404, applies_to: "sign-scoped endpoints" }
  - { priority: 6, category: state, check: "review-decision requires agreement.status == PENDING_REVIEW", error_id: ERR_AGREEMENT_NOT_PENDING, http_status: 409, applies_to: "POST /program/agreements/{id}/review-decision" }
  - { priority: 6, category: state, check: "agreement.status == ACTIVE (PATCH also permits SUSPENDED)", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /program/agreements/{id}/suspend, POST /program/agreements/{id}/renewal-request, PATCH /program/agreements/{id}, POST /program/events, POST /program/events/{id}/supplies, POST /program/agreements/{id}/signs, POST /program/signs/{id}/install" }
  - { priority: 6, category: state, check: "renewal-decision requires agreement.status == RENEWAL_REVIEW", error_id: ERR_AGREEMENT_NOT_IN_RENEWAL, http_status: 409, applies_to: "POST /program/agreements/{id}/renewal-decision" }
  - { priority: 6, category: state, check: "terminate requires agreement.status in {ACTIVE, SUSPENDED, RENEWAL_REVIEW}", error_id: ERR_AGREEMENT_TERMINAL, http_status: 409, applies_to: "POST /program/agreements/{id}/terminate" }
  - { priority: 6, category: state, check: "briefing requires event.status == SCHEDULED", error_id: ERR_EVENT_NOT_SCHEDULED, http_status: 409, applies_to: "POST /program/events/{id}/briefing" }
  - { priority: 6, category: state, check: "postpone requires event.status in {SCHEDULED, BRIEFING_DONE}; PATCH requires {SCHEDULED, POSTPONED}; cancel requires {SCHEDULED, BRIEFING_DONE, POSTPONED}; supplies issue requires non-terminal event", error_id: ERR_EVENT_TERMINAL, http_status: 409, applies_to: "POST /program/events/{id}/postpone, PATCH /program/events/{id}, POST /program/events/{id}/cancel, POST /program/events/{id}/supplies" }
  - { priority: 6, category: state, check: "debris report requires event.status == BRIEFING_DONE", error_id: ERR_EVENT_NOT_BRIEFED, http_status: 409, applies_to: "POST /program/events/{id}/debris-report" }
  - { priority: 6, category: state, check: "acknowledge requires hazard.status == REPORTED", error_id: ERR_HAZARD_NOT_REPORTED, http_status: 409, applies_to: "POST /program/hazards/{id}/acknowledge" }
  - { priority: 6, category: state, check: "resolve requires hazard.status == ACKNOWLEDGED", error_id: ERR_HAZARD_NOT_ACKNOWLEDGED, http_status: 409, applies_to: "POST /program/hazards/{id}/resolve" }
  - { priority: 6, category: state, check: "install requires sign.status == REQUESTED", error_id: ERR_SIGN_NOT_REQUESTED, http_status: 409, applies_to: "POST /program/signs/{id}/install" }
  - { priority: 6, category: state, check: "revoke requires waiver.status == ACTIVE", error_id: ERR_WAIVER_NOT_ACTIVE, http_status: 409, applies_to: "POST /program/waivers/{id}/revoke" }
  - { priority: 6, category: state, check: "supply return requires distribution.status in {ISSUED, PARTIALLY_RETURNED}", error_id: ERR_SUPPLY_ALREADY_RECONCILED, http_status: 409, applies_to: "POST /program/supplies/{id}/return" }
  - { priority: 7, category: business_safety, check: "event creation blocked while any HazardReport on the segment is in {REPORTED, ACKNOWLEDGED}", error_id: ERR_HAZARD_UNRESOLVED, http_status: 422, applies_to: "POST /program/events" }
  - { priority: 7, category: business_safety, check: "minor waiver (is_minor) requires guardian_full_name present and guardian_consent == true", error_id: ERR_MINOR_GUARDIAN_REQUIRED, http_status: 422, applies_to: "POST /program/waivers" }
  - { priority: 7, category: business_safety, check: "minor waiver's supervisor_waiver_id must reference an ACTIVE, adult (is_minor == false) waiver under the same agreement, not the waiver itself", error_id: ERR_SUPERVISOR_INVALID, http_status: 422, applies_to: "POST /program/waivers" }
  - { priority: 7, category: business_safety, check: "briefing attendee_waiver_ids non-empty; every waiver ACTIVE, unexpired (today <= expiry_date), and scoped to the event's agreement", error_id: ERR_WAIVER_INVALID_ATTENDEE, http_status: 422, applies_to: "POST /program/events/{id}/briefing" }
  - { priority: 7, category: business_safety, check: "for every minor attendee, their supervisor_waiver_id is also in attendee_waiver_ids", error_id: ERR_SUPERVISOR_ABSENT, http_status: 422, applies_to: "POST /program/events/{id}/briefing" }
  - { priority: 8, category: business_temporal, check: "scheduled_date >= clock date + 14 days on event creation and reschedule", error_id: ERR_EVENT_TOO_SOON, http_status: 422, applies_to: "POST /program/events, PATCH /program/events/{id}" }
  - { priority: 8, category: business_temporal, check: "debris report accepted only when clock date in [scheduled_date, scheduled_date + 30 days]; briefing only when clock date <= scheduled_date", error_id: ERR_REPORT_WINDOW_CLOSED, http_status: 422, applies_to: "POST /program/events/{id}/debris-report, POST /program/events/{id}/briefing" }
  - { priority: 8, category: business_temporal, check: "renewal-request only when clock date in [term_end_date - 90 days, term_end_date]", error_id: ERR_RENEWAL_WINDOW_CLOSED, http_status: 422, applies_to: "POST /program/agreements/{id}/renewal-request" }
  - { priority: 9, category: business_constraint, check: "agreement creation requires segment.status == AVAILABLE (segment must not sit under another agreement in PENDING_REVIEW/ACTIVE/SUSPENDED/RENEWAL_REVIEW)", error_id: ERR_SEGMENT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /program/agreements" }
  - { priority: 9, category: business_constraint, check: "no other CleanupEvent on the same segment in {SCHEDULED, BRIEFING_DONE, POSTPONED} may share the same scheduled_date (day-slot, half-open: adjacent days allowed)", error_id: ERR_EVENT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /program/events, PATCH /program/events/{id}" }
  - { priority: 9, category: business_constraint, check: "MEASURED reports: sum of line_weight_lbs == measured_total_weight_lbs exactly at 1dp", error_id: ERR_WEIGHT_MISMATCH, http_status: 422, applies_to: "POST /program/events/{id}/debris-report" }
  - { priority: 9, category: business_constraint, check: "cumulative returned_vests/returned_grabbers must not exceed issued quantities", error_id: ERR_RETURN_EXCEEDS_ISSUED, http_status: 422, applies_to: "POST /program/supplies/{id}/return" }
  - { priority: 9, category: business_constraint, check: "at most one SupplyDistribution per event", error_id: ERR_SUPPLY_ALREADY_ISSUED, http_status: 409, applies_to: "POST /program/events/{id}/supplies" }
  - { priority: 9, category: business_constraint, check: "renewal-decision APPROVE requires ANNIVERSARY eligibility (every term window >= 3 COMPLETED cleanups) and zero open hazards on the segment", error_id: ERR_RENEWAL_NOT_ELIGIBLE, http_status: 422, applies_to: "POST /program/agreements/{id}/renewal-decision" }
  - { priority: 9, category: business_constraint, check: "at most one SignRecognition in {REQUESTED, INSTALLED} per agreement", error_id: ERR_SIGN_ALREADY_EXISTS, http_status: 409, applies_to: "POST /program/agreements/{id}/signs" }
  - { priority: 9, category: business_constraint, check: "sign install requires at least one COMPLETED CleanupEvent under the agreement", error_id: ERR_NO_COMPLETED_CLEANUP, http_status: 422, applies_to: "POST /program/signs/{id}/install" }
  - { priority: 10, category: business_fiscal, check: "supply allocation quantities must each be <= depot on_hand (bags/vests/grabbers); every ISSUED/PARTIALLY_RETURNED distribution draws down the pool until returned or reconciled", error_id: ERR_SUPPLY_STOCK_EXCEEDED, http_status: 422, applies_to: "POST /program/events/{id}/supplies" }
  - { priority: 6, category: state, check: "OCC: PATCH agreement requires expected_agreement_version == current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /program/agreements/{id}" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/program/groups", description: "Register an adopter group; the returned id becomes the GroupLeader's X-User-ID thereafter", roles: [GroupLeader], code: 201, input: [name, org_type, contact_name, contact_email], output: AdopterGroup, side_effects: [] }
  - { method: GET, path: "/program/groups/{id}", description: "Fetch one adopter group", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: AdopterGroup, side_effects: [] }
  - { method: POST, path: "/program/segments", description: "Create an adoptable road/river segment", roles: [ProgramCoordinator], code: 201, input: [route_name, mile_marker_start, mile_marker_end, segment_type, "water_adjacent?"], output: RoadSegment, side_effects: ["mile_length computed"] }
  - { method: GET, path: "/program/segments/{id}", description: "Fetch one segment", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: RoadSegment, side_effects: [] }
  - { method: GET, path: "/program/segments", description: "List segments with filters", roles: [ProgramCoordinator, GroupLeader], code: 200, input: ["status?", "water_adjacent?", "limit?", "offset?"], output: "RoadSegment[]", side_effects: [] }

  - { method: POST, path: "/program/agreements", description: "Apply to adopt a segment (creates PENDING_REVIEW agreement)", roles: [GroupLeader], code: 201, input: [group_id, segment_id, contact_email, "special_instructions?"], output: AdoptionAgreement, side_effects: [] }
  - { method: GET, path: "/program/agreements/{id}", description: "Fetch one agreement", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: AdoptionAgreement, side_effects: [] }
  - { method: GET, path: "/program/agreements", description: "List agreements with filters", roles: [ProgramCoordinator, GroupLeader], code: 200, input: ["group_id?", "segment_id?", "status?", "limit?", "offset?"], output: "AdoptionAgreement[]", side_effects: [] }
  - { method: POST, path: "/program/agreements/{id}/review-decision", description: "Approve (segment -> ADOPTED, term starts) or reject a PENDING_REVIEW agreement", roles: [ProgramCoordinator], code: 200, input: [decision, "note?"], output: AdoptionAgreement, side_effects: ["PENDING_REVIEW -> ACTIVE|REJECTED; on APPROVE: segment ADOPTED, term dates set; increments AdoptionAgreement.version by 1"] }
  - { method: PATCH, path: "/program/agreements/{id}", description: "Amend contact_email / special_instructions with OCC guard", roles: [GroupLeader, ProgramCoordinator], code: 200, input: [expected_agreement_version, "contact_email?", "special_instructions?"], output: AdoptionAgreement, side_effects: ["increments AdoptionAgreement.version by 1"] }
  - { method: POST, path: "/program/agreements/{id}/suspend", description: "Coordinator-initiated suspension; cascades to SCHEDULED/POSTPONED events and their supply distributions (BRIEFING_DONE events survive)", roles: [ProgramCoordinator], code: 200, input: ["reason?"], output: AdoptionAgreement, side_effects: ["ACTIVE -> SUSPENDED; SCHEDULED/POSTPONED events -> CANCELLED; their distributions -> RECONCILED with restock; increments AdoptionAgreement.version by 1"] }
  - { method: POST, path: "/program/agreements/{id}/terminate", description: "Terminate agreement (coordinator or owning group)", roles: [ProgramCoordinator, GroupLeader], code: 200, input: ["reason?"], output: AdoptionAgreement, side_effects: ["-> TERMINATED; all non-terminal events CANCELLED; distributions reconciled+restocked; sign REMOVED; segment AVAILABLE; increments AdoptionAgreement.version by 1"] }
  - { method: POST, path: "/program/agreements/{id}/renewal-request", description: "Owning group requests re-adoption renewal inside the renewal window", roles: [GroupLeader], code: 200, input: [], output: AdoptionAgreement, side_effects: ["ACTIVE -> RENEWAL_REVIEW; increments AdoptionAgreement.version by 1"] }
  - { method: POST, path: "/program/agreements/{id}/renewal-decision", description: "Coordinator approves (new 24-month term, renewal_count+1) or denies (agreement EXPIRED)", roles: [ProgramCoordinator], code: 200, input: [decision, "note?"], output: AdoptionAgreement, side_effects: ["RENEWAL_REVIEW -> ACTIVE|EXPIRED; on APPROVE term rolls forward; on DENY segment AVAILABLE and sign REMOVED; increments AdoptionAgreement.version by 1"] }

  - { method: POST, path: "/program/events", description: "Schedule a cleanup event under an ACTIVE agreement", roles: [GroupLeader], code: 201, input: [agreement_id, scheduled_date, expected_volunteers], output: CleanupEvent, side_effects: [] }
  - { method: GET, path: "/program/events/{id}", description: "Fetch one event", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: CleanupEvent, side_effects: [] }
  - { method: GET, path: "/program/events", description: "List events with filters", roles: [ProgramCoordinator, GroupLeader], code: 200, input: ["agreement_id?", "status?", "limit?", "offset?"], output: "CleanupEvent[]", side_effects: [] }
  - { method: PATCH, path: "/program/events/{id}", description: "Edit expected_volunteers (SCHEDULED) or reschedule (POSTPONED -> SCHEDULED with new date)", roles: [GroupLeader], code: 200, input: ["scheduled_date?", "expected_volunteers?"], output: CleanupEvent, side_effects: ["POSTPONED -> SCHEDULED when scheduled_date supplied; increments CleanupEvent.version by 1"] }
  - { method: POST, path: "/program/events/{id}/briefing", description: "Record the safety briefing with the attendee waiver list (traffic + water hazard protocol acknowledged)", roles: [GroupLeader], code: 200, input: [attendee_waiver_ids], output: CleanupEvent, side_effects: ["SCHEDULED -> BRIEFING_DONE; briefing_attendee_count set; increments CleanupEvent.version by 1"] }
  - { method: POST, path: "/program/events/{id}/postpone", description: "Postpone the event (briefing must be redone after reschedule)", roles: [GroupLeader], code: 200, input: ["reason?"], output: CleanupEvent, side_effects: ["-> POSTPONED; postpone_count+1; briefing_attendee_count := 0; increments CleanupEvent.version by 1"] }
  - { method: POST, path: "/program/events/{id}/cancel", description: "Cancel a non-terminal event; supplies auto-reconciled and restocked", roles: [GroupLeader, ProgramCoordinator], code: 200, input: ["reason?"], output: CleanupEvent, side_effects: ["-> CANCELLED; distribution RECONCILED + depot restock; increments CleanupEvent.version by 1"] }
  - { method: POST, path: "/program/events/{id}/debris-report", description: "Submit the debris weight & material report; completes the event and recomputes agreement standing (may auto-reinstate)", roles: [GroupLeader], code: 201, input: [weight_method, "measured_total_weight_lbs?", material_lines], output: DebrisReport, side_effects: ["event -> COMPLETED with completed_weight_lbs; agreement counters/standing recomputed; conditional auto-reinstate SUSPENDED -> ACTIVE"] }
  - { method: GET, path: "/program/events/{id}/debris-reports", description: "List the event's debris report (array of 0 or 1)", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: "DebrisReport[]", side_effects: [] }

  - { method: POST, path: "/program/events/{id}/supplies", description: "Issue the supply allocation (bags/vests/grabbers) for an event from a depot", roles: [GroupLeader], code: 201, input: [depot_id], output: SupplyDistribution, side_effects: ["supply_allocation computed; depot on_hand debited; distribution ISSUED"] }
  - { method: GET, path: "/program/supplies", description: "List supply distributions with filters", roles: [ProgramCoordinator, GroupLeader], code: 200, input: ["event_id?", "depot_id?", "status?", "limit?", "offset?"], output: "SupplyDistribution[]", side_effects: [] }
  - { method: GET, path: "/program/supplies/{id}", description: "Fetch one supply distribution", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: SupplyDistribution, side_effects: [] }
  - { method: POST, path: "/program/supplies/{id}/return", description: "Return returnables; mark_remaining_lost=true writes off the outstanding balance and reconciles", roles: [GroupLeader, ProgramCoordinator], code: 200, input: [returned_vests, returned_grabbers, "mark_remaining_lost?"], output: SupplyDistribution, side_effects: ["depot restocked by returned counts; optional loss write-off; -> PARTIALLY_RETURNED or RECONCILED"] }

  - { method: POST, path: "/program/depots", description: "Create a supply depot with initial stock (pool totals pinned)", roles: [ProgramCoordinator], code: 201, input: [name, bags_on_hand, vests_on_hand, grabbers_on_hand], output: SupplyDepot, side_effects: ["pool totals pinned from initial stock"] }
  - { method: GET, path: "/program/depots/{id}", description: "Fetch one depot with current on-hand and loss totals", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: SupplyDepot, side_effects: [] }

  - { method: POST, path: "/program/waivers", description: "Register a volunteer waiver; minors need guardian consent + an adult supervisor waiver", roles: [GroupLeader], code: 201, input: [agreement_id, volunteer_full_name, dob, "guardian_full_name?", "guardian_consent?", "supervisor_waiver_id?"], output: VolunteerWaiver, side_effects: ["is_minor, signed_date, expiry_date computed"] }
  - { method: GET, path: "/program/waivers/{id}", description: "Fetch one waiver", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: VolunteerWaiver, side_effects: [] }
  - { method: GET, path: "/program/waivers", description: "List waivers with filters", roles: [ProgramCoordinator, GroupLeader], code: 200, input: ["agreement_id?", "supervisor_waiver_id?", "status?", "limit?", "offset?"], output: "VolunteerWaiver[]", side_effects: [] }
  - { method: POST, path: "/program/waivers/{id}/revoke", description: "Revoke an ACTIVE waiver", roles: [GroupLeader], code: 200, input: [], output: VolunteerWaiver, side_effects: ["ACTIVE -> REVOKED"] }

  - { method: POST, path: "/program/hazards", description: "Report a hazardous item discovery (do-not-touch protocol; agency notified on acknowledge)", roles: [GroupLeader, ProgramCoordinator], code: 201, input: [segment_id, "event_id?", hazard_type, description, location_note], output: HazardReport, side_effects: [] }
  - { method: GET, path: "/program/hazards/{id}", description: "Fetch one hazard report", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: HazardReport, side_effects: [] }
  - { method: GET, path: "/program/hazards", description: "List hazard reports with filters", roles: [ProgramCoordinator, GroupLeader], code: 200, input: ["segment_id?", "event_id?", "status?", "limit?", "offset?"], output: "HazardReport[]", side_effects: [] }
  - { method: POST, path: "/program/hazards/{id}/acknowledge", description: "Agency acknowledges and logs the notification reference", roles: [ProgramCoordinator], code: 200, input: [], output: HazardReport, side_effects: ["REPORTED -> ACKNOWLEDGED; agency_reference minted"] }
  - { method: POST, path: "/program/hazards/{id}/resolve", description: "Agency marks the hazard removed/remediated", roles: [ProgramCoordinator], code: 200, input: [resolution_note], output: HazardReport, side_effects: ["ACKNOWLEDGED -> RESOLVED"] }

  - { method: POST, path: "/program/agreements/{id}/signs", description: "Request a recognition sign for the adopting group", roles: [GroupLeader], code: 201, input: [sign_text], output: SignRecognition, side_effects: [] }
  - { method: GET, path: "/program/agreements/{id}/signs", description: "List signs for an agreement", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: "SignRecognition[]", side_effects: [] }
  - { method: POST, path: "/program/signs/{id}/install", description: "Install the sign once the agreement is ACTIVE and has >= 1 COMPLETED cleanup", roles: [ProgramCoordinator], code: 200, input: [], output: SignRecognition, side_effects: ["REQUESTED -> INSTALLED; installed_date set"] }

  - { method: GET, path: "/program/metrics", description: "Program-wide metrics (computed read): active agreements, adopted/available miles, debris totals, completed cleanups, open hazards", roles: [ProgramCoordinator, GroupLeader], code: 200, input: [], output: "{ active_agreements: integer, adopted_miles: number, available_miles: number, total_debris_lbs: number, completed_cleanups: integer, open_hazards: integer }", side_effects: [] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock (must move strictly forward) runs the compliance sweep in order: (1) waiver expiry, (2) event NO_SHOW, (3) agreement auto-suspension on rolling NON_COMPLIANT, (4) agreement auto-expiry past term_end", roles: [ProgramCoordinator], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["waiver EXPIRED sweep; event NO_SHOW sweep; agreement SUSPENDED sweep with cascades; agreement EXPIRED sweep with cascades"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/blank X-User-Role or X-User-ID, or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "GroupLeader acting on a resource whose agreement chain belongs to another group" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type/enum, or range violation (e.g. expected_volunteers < 1, mile_marker_end <= start, sign_text > 60 chars)" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "AdopterGroup reference does not resolve" }
  - { id: ERR_SEGMENT_NOT_FOUND, http: 404, condition: "RoadSegment reference does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "AdoptionAgreement reference does not resolve" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "CleanupEvent reference does not resolve" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "VolunteerWaiver reference (path, supervisor, or attendee list) does not resolve" }
  - { id: ERR_SUPPLY_NOT_FOUND, http: 404, condition: "SupplyDistribution reference does not resolve" }
  - { id: ERR_DEPOT_NOT_FOUND, http: 404, condition: "SupplyDepot reference does not resolve" }
  - { id: ERR_HAZARD_NOT_FOUND, http: 404, condition: "HazardReport reference does not resolve" }
  - { id: ERR_SIGN_NOT_FOUND, http: 404, condition: "SignRecognition reference does not resolve" }
  - { id: ERR_AGREEMENT_NOT_PENDING, http: 409, condition: "review-decision on an agreement not in PENDING_REVIEW" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires agreement.status == ACTIVE (PATCH also allows SUSPENDED)" }
  - { id: ERR_AGREEMENT_NOT_IN_RENEWAL, http: 409, condition: "renewal-decision on an agreement not in RENEWAL_REVIEW" }
  - { id: ERR_AGREEMENT_TERMINAL, http: 409, condition: "terminate on an already-terminal agreement (EXPIRED/TERMINATED/REJECTED)" }
  - { id: ERR_EVENT_NOT_SCHEDULED, http: 409, condition: "briefing on an event not in SCHEDULED" }
  - { id: ERR_EVENT_TERMINAL, http: 409, condition: "postpone/PATCH/cancel/supply-issue on a terminal event (COMPLETED/CANCELLED/NO_SHOW)" }
  - { id: ERR_EVENT_NOT_BRIEFED, http: 409, condition: "debris report on an event not in BRIEFING_DONE" }
  - { id: ERR_HAZARD_NOT_REPORTED, http: 409, condition: "acknowledge on a hazard not in REPORTED" }
  - { id: ERR_HAZARD_NOT_ACKNOWLEDGED, http: 409, condition: "resolve on a hazard not in ACKNOWLEDGED" }
  - { id: ERR_SIGN_NOT_REQUESTED, http: 409, condition: "install on a sign not in REQUESTED" }
  - { id: ERR_WAIVER_NOT_ACTIVE, http: 409, condition: "revoke on a waiver not in ACTIVE" }
  - { id: ERR_SUPPLY_ALREADY_RECONCILED, http: 409, condition: "return attempted on a RECONCILED distribution" }
  - { id: ERR_HAZARD_UNRESOLVED, http: 422, condition: "event creation while the segment has a hazard in REPORTED or ACKNOWLEDGED" }
  - { id: ERR_MINOR_GUARDIAN_REQUIRED, http: 422, condition: "minor waiver missing guardian_full_name or guardian_consent != true" }
  - { id: ERR_SUPERVISOR_INVALID, http: 422, condition: "supervisor waiver not ACTIVE/adult/same-agreement, or self-reference" }
  - { id: ERR_WAIVER_INVALID_ATTENDEE, http: 422, condition: "briefing attendee waiver missing, not ACTIVE, expired, or scoped to a different agreement" }
  - { id: ERR_SUPERVISOR_ABSENT, http: 422, condition: "minor attendee's supervisor waiver not among the briefing attendees" }
  - { id: ERR_EVENT_TOO_SOON, http: 422, condition: "scheduled_date earlier than clock date + 14 days (create or reschedule)" }
  - { id: ERR_REPORT_WINDOW_CLOSED, http: 422, condition: "debris report outside [scheduled_date, scheduled_date + 30d]; briefing after scheduled_date" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "renewal-request outside [term_end - 90d, term_end]" }
  - { id: ERR_SEGMENT_NOT_AVAILABLE, http: 409, condition: "segment already under a live agreement (or approval attempted twice)" }
  - { id: ERR_EVENT_WINDOW_OVERLAP, http: 409, condition: "another live event already occupies that segment day-slot" }
  - { id: ERR_WEIGHT_MISMATCH, http: 422, condition: "MEASURED material lines do not sum exactly to measured_total_weight_lbs" }
  - { id: ERR_RETURN_EXCEEDS_ISSUED, http: 422, condition: "cumulative returns would exceed issued quantities" }
  - { id: ERR_SUPPLY_ALREADY_ISSUED, http: 409, condition: "event already has a supply distribution" }
  - { id: ERR_RENEWAL_NOT_ELIGIBLE, http: 422, condition: "ANNIVERSARY windows deficient (< 3 cleanups in some 12-month term window) or open hazards on segment" }
  - { id: ERR_SIGN_ALREADY_EXISTS, http: 409, condition: "agreement already has a sign in REQUESTED or INSTALLED" }
  - { id: ERR_NO_COMPLETED_CLEANUP, http: 422, condition: "sign install attempted before any COMPLETED cleanup under the agreement" }
  - { id: ERR_SUPPLY_STOCK_EXCEEDED, http: 422, condition: "computed allocation exceeds depot on_hand for some item (aggregate capacity over overlapping reservation windows)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_version does not match the agreement's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "State agency program staff: manages segments and depots, reviews agreements, decides renewals, acknowledges/resolves hazards, installs signs, may suspend/terminate agreements"
    identity: opaque
    exclusive_operations:
      - "POST /program/segments, POST /program/depots"
      - "POST /program/agreements/{id}/review-decision, /renewal-decision, /suspend"
      - "POST /program/hazards/{id}/acknowledge, /resolve"
      - "POST /program/signs/{id}/install"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
      - "PATCH /program/agreements/{id}"
      - "POST /program/agreements/{id}/terminate, POST /program/events/{id}/cancel, POST /program/supplies/{id}/return"
      - "POST /program/hazards"
      - "GET /program/metrics"
  - name: GroupLeader
    description: "Leader of an adopting group: registers the group, applies for adoption, schedules and runs cleanup events, files waivers, debris and hazard reports, requests signs and renewals"
    identity: "entity_backed:AdopterGroup"
    exclusive_operations:
      - "POST /program/groups, POST /program/agreements"
      - "POST /program/agreements/{id}/renewal-request"
      - "POST /program/events, PATCH /program/events/{id}, /briefing, /postpone"
      - "POST /program/events/{id}/debris-report, POST /program/events/{id}/supplies"
      - "POST /program/waivers, POST /program/waivers/{id}/revoke"
      - "POST /program/agreements/{id}/signs"
    shared_operations:
      - "all GET endpoints"
      - "PATCH /program/agreements/{id}"
      - "POST /program/agreements/{id}/terminate, POST /program/events/{id}/cancel, POST /program/supplies/{id}/return"
      - "POST /program/hazards"
      - "GET /program/metrics"
