            - "GET /gpo/purchase-lines?distributor_file_id=${f1}&reject_reason=DATE_OUT_OF_PERIOD&limit=10&offset=0 returns exactly the 2026-07-15 line — the date rule is evaluated before the zero-quantity rule"
            - "GET /gpo/purchase-lines?distributor_file_id=${f1}&reject_reason=ZERO_QUANTITY&limit=10&offset=0 returns exactly the 2026-08-06 line"
            - "GET /gpo/purchase-lines?distributor_file_id=${f1}&reject_reason=NONE&limit=10&offset=0 returns exactly the qty-5 line"
            - "all three lines still carry classification UNCLASSIFIED and contract_units 0"

      - name: file_load_with_zero_accepted_lines_lands_rejected
        claim_type: valid_transition
        grounds:
          - state_machines.DistributorFile.VALIDATING_to_REJECTED
          - entities.Commitment.fields.ytd_total_category_spend_cents
          - errors.ERR_INVALID_FILE_STATE
        distinguishing_aspect: "load is a three-way branch on the validated counts; with accepted_line_count 0 it lands in the terminal REJECTED, leaves loaded_at null, moves no commitment ledger field, and a following reverse is ERR_INVALID_FILE_STATE because there is nothing to compensate."
        test_recipe:
          setup: ["ACTIVE contract C-ZER, member M-ZER, a countersigned ACTIVE commitment, and a validated file whose single line has quantity 0."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-ZER", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
