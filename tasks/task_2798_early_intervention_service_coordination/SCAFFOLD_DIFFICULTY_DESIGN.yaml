  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: provider_suspension_cascade_to_service_at_risk
        grounds:
          - state_machines.Provider[ACTIVE -> SUSPENDED]
          - state_machines.ProviderAuthorization[ACTIVE -> SUSPENDED]
          - state_machines.ServiceVisit[SCHEDULED -> CANCELLED_PROVIDER]
          - state_machines.IFSPService[IN_DELIVERY -> AT_RISK]
          - calculations.makeup_obligation
          - entities.Referral.fields.service_gap_flag
          - endpoints[POST /ei/providers/{providerId}/suspend]
        distinguishing_aspect: |
          This instance walks a five-hop cascade OUTWARD from an entity that is not part of the case
          at all: Provider -> ProviderAuthorization -> ServiceVisit -> IFSPService.makeup_owed_units
          and status -> Referral.service_gap_flag. Hop 4 is conditional on the strict
          greater-than makeup threshold, and hop 5 lands on a boolean on a different aggregate root.
          Crucially the unit pool is NOT touched: suspension holds the units, it does not release
          them. The other transitive_cascade instance is the opposite shape - it RELEASES units back
          to a conserved pool and is driven from inside the plan hierarchy.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES case with an ACTIVE plan carrying one HOME SPEECH_THERAPY line of 96 planned units."
            - "An ACTIVE authorization for 24 units over 2026-03-21..2026-04-30 held by a SPEECH_THERAPY-qualified provider, so the line sits at AUTHORIZED with units_committed 24 and units_pool_remaining 72."
