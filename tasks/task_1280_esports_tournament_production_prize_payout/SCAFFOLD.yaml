# =============================================================================
# Esports Tournament Production & Prize Payout — benchmark seed tables
# =============================================================================

scenario: |
  Esports Tournament Production & Prize Payout (esports tournament organizer): registration & roster lock with eligibility rules, bracket seeding & match scheduling across regions, server/lobby setup & match officiating, dispute/pause protocol & rule enforcement, anti-cheat verification & disqualification, broadcast production & talent scheduling, prize pool distribution with tax documentation & minor payouts, sponsor integration & content rights

domain_name: esports-tournament-payout
api_prefix: /api

# Harder-than-expert calibration: entity count and endpoint surface deliberately
# exceed the §0.4 Expert band because lint rule (f) forces a reverse-reachability
# GET per child entity; difficulty is concentrated in calculations, cascades,
# SoD gates, and interval semantics rather than in CRUD surface.

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tournament
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tournament name" }
      - { name: game_title, type: string, source: input, description: "Game title (e.g. Valor-like tactical shooter)" }
      - { name: region, type: enum, source: input, description: "Host region", constraints: "NA | EU | APAC | LATAM" }
      - { name: prize_pool_target_cents, type: integer, source: input, description: "Advertised prize pool; funding gate uses >= this" }
      - { name: funded_pool_cents, type: integer, source: system, description: "Sum of POST /fund amounts", default: 0 }
      - { name: roster_size, type: integer, source: input, description: "Exact number of ACTIVE STARTER roster slots required to submit" }
      - { name: max_roster_size, type: integer, source: input, description: "Max ACTIVE slots (starters + substitutes); must be >= roster_size" }
      - { name: registration_opens_at, type: datetime, source: input, description: "Registration window open (inclusive)" }
      - { name: registration_closes_at, type: datetime, source: input, description: "Registration window close (inclusive); submit allowed when opens_at <= now <= closes_at" }
      - { name: minor_curfew_local, type: string, source: input, description: "Curfew HH:MM compared against the UTC time-of-day of match end; a match containing any minor must end strictly before it" }
      - { name: status, type: enum, source: system, description: "DRAFT | REGISTRATION_OPEN | REGISTRATION_LOCKED | SEEDED | IN_PROGRESS | COMPLETED | PAYOUTS_FINALIZED | CANCELLED", default: DRAFT }
      - { name: bracket_version, type: integer, source: system, description: "Incremented on every successful generate-bracket", default: 0 }
      - { name: placements_assigned, type: boolean, source: system, description: "True once IN_PROGRESS -> COMPLETED assigned placements", default: false }

  - name: Player
    parent: null
    common_fields: true
    fields:
      - { name: handle, type: string, source: input, description: "Unique gamer handle (case-sensitive unique across all players)" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; drives minor determination at roster lock" }
      - { name: region, type: enum, source: input, description: "Player home region", constraints: "NA | EU | APAC | LATAM" }
      - { name: eligibility_status, type: enum, source: system, description: "ELIGIBLE | SUSPENDED | BANNED", default: ELIGIBLE }
      - { name: ac_strike_events, type: array, source: system, description: "Append-only list of {integrity_case_id, issued_at} strike events", default: "[]" }
      - { name: active_strike_count, type: integer, source: computed, description: "Strikes with issued_at strictly after now - 365 days; see strike_threshold calculation", default: 0 }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: team_name, type: string, source: input, description: "Team display name; unique within the tournament" }
      - { name: manager_contact_email, type: string, source: input, description: "Team manager contact email" }
      - { name: region_rank_points, type: integer, source: input, description: "Seeding input: regional circuit rank points" }
      - { name: prior_event_points, type: integer, source: input, description: "Seeding input: prior edition placement points" }
      - { name: qualifier_wins, type: integer, source: input, description: "Seeding input: open-qualifier series wins" }
      - { name: captain_player_id, type: string, source: input, description: "FK -> Player.id; designated prize payee, must be an ACTIVE STARTER at submit time" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | APPEALED | LOCKED | FORFEITED", default: DRAFT }
      - { name: appeal_used, type: boolean, source: system, description: "True once the single appeal has been consumed", default: false }
      - { name: seed_score, type: number, source: computed, description: "Weighted seeding score; null until generate-bracket", default: null }
      - { name: seed_position, type: integer, source: system, description: "1-based seed; null until generate-bracket", default: null }
      - { name: placement, type: integer, source: system, description: "Final placement (1 = champion); null until tournament COMPLETED", default: null }

  - name: RosterSlot
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: player_id, type: string, source: input, description: "FK -> Player.id" }
      - { name: slot_role, type: enum, source: input, description: "STARTER | SUBSTITUTE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED | INELIGIBLE", default: ACTIVE }
      - { name: age_at_lock_years, type: integer, source: computed, description: "Whole years between date_of_birth and the tournament lock instant; null until lock", default: null }
      - { name: is_minor, type: boolean, source: computed, description: "age_at_lock_years < 18; null until lock", default: null }

  - name: ServerInstance
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: label, type: string, source: input, description: "Server label (e.g. NA-EAST-1)" }
      - { name: region, type: enum, source: input, description: "Server region", constraints: "NA | EU | APAC | LATAM" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MAINTENANCE", default: ACTIVE }
      - { name: booked_minutes, type: integer, source: computed, description: "Sum of (duration_minutes + BUFFER_MINUTES) over matches on this server with status IN {SCHEDULED, LOBBY_OPEN, LIVE, PAUSED, COMPLETED, UNDER_DISPUTE, CONFIRMED, OVERTURNED}; see server_booked_minutes calculation", default: 0 }

  - name: Match
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: system, description: "FK -> Tournament.id; set by generate-bracket" }
      - { name: bracket_round, type: integer, source: system, description: "1-indexed round; 1 = first round" }
      - { name: bracket_slot, type: integer, source: system, description: "1-indexed slot within the round" }
      - { name: next_match_id, type: string, source: system, description: "FK -> Match.id; match the winner advances to; null for the final" , default: null }
      - { name: home_registration_id, type: string, source: system, description: "FK -> Registration.id; null while TBD", default: null }
      - { name: away_registration_id, type: string, source: system, description: "FK -> Registration.id; null while TBD", default: null }
      - { name: winner_registration_id, type: string, source: system, description: "FK -> Registration.id; null until result", default: null }
      - { name: server_id, type: string, source: input, description: "FK -> ServerInstance.id; set at schedule; null while PENDING", default: null }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Match start; null until scheduled", default: null }
      - { name: duration_minutes, type: integer, source: input, description: "Scheduled duration (buffer excluded); set at schedule" }
      - { name: status, type: enum, source: system, description: "PENDING | SCHEDULED | LOBBY_OPEN | LIVE | PAUSED | COMPLETED | UNDER_DISPUTE | CONFIRMED | OVERTURNED | FORFEIT | CANCELLED", default: PENDING }
      - { name: home_score, type: integer, source: input, description: "Reported home score; null until report-result", default: null }
      - { name: away_score, type: integer, source: input, description: "Reported away score; null until report-result", default: null }
      - { name: assigned_referee_id, type: string, source: input, description: "Opaque Referee user id assigned at schedule; SoD anchor" }
      - { name: reported_by_user_id, type: string, source: system, description: "Referee X-User-ID who reported the result", default: null }
      - { name: confirmed_by_user_id, type: string, source: system, description: "Referee X-User-ID who confirmed the result", default: null }
      - { name: tactical_pauses_home, type: integer, source: system, description: "TACTICAL pauses consumed by home side", default: 0 }
      - { name: tactical_pauses_away, type: integer, source: system, description: "TACTICAL pauses consumed by away side", default: 0 }
      - { name: completed_at, type: datetime, source: system, description: "Logical timestamp when result was first reported", default: null }
      - { name: dispute_window_closes_at, type: datetime, source: system, description: "completed_at + 24h; disputes rejected after this", default: null }
      - { name: forfeiting_registration_id, type: string, source: system, description: "Losing side when status = FORFEIT", default: null }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: match_id, type: string, source: input, description: "FK -> Match.id" }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; filing team, must be a match participant" }
      - { name: reason, type: enum, source: input, description: "RULE_VIOLATION | SCORE_DISCREPANCY | TECHNICAL_FAILURE | CONDUCT" }
      - { name: details, type: string, source: input, description: "Free-form evidence description" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | CLOSED_UPHELD | CLOSED_OVERTURNED | APPEALED", default: FILED }
      - { name: appeal_used, type: boolean, source: system, description: "True once the single dispute appeal has been consumed", default: false }
      - { name: ruling, type: enum, source: system, description: "UPHELD | OVERTURNED; null until ruled", default: null }
      - { name: remedy, type: enum, source: system, description: "WINNER_FLIP | REMATCH; recorded when ruling = OVERTURNED", default: null }

  - name: IntegrityCase
    parent: null
    common_fields: true
    fields:
      - { name: player_id, type: string, source: input, description: "FK -> Player.id; accused player" }
      - { name: match_id, type: string, source: input, description: "FK -> Match.id; implicated match, optional", default: null }
      - { name: evidence_summary, type: string, source: input, description: "Evidence digest (anti-cheat export reference)" }
      - { name: status, type: enum, source: system, description: "OPEN | INVESTIGATING | RESOLVED_CLEARED | RESOLVED_VIOLATION", default: OPEN }
      - { name: opened_by_user_id, type: string, source: system, description: "Investigator X-User-ID who opened the case" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Investigator X-User-ID who resolved the case", default: null }
      - { name: strike_issued, type: boolean, source: system, description: "True once a strike event was appended to the player", default: false }
      - { name: resolved_at, type: datetime, source: system, description: "Logical timestamp of resolution; strike issued_at", default: null }

  - name: Talent
    parent: null
    common_fields: true
    fields:
      - { name: stage_name, type: string, source: input, description: "On-air name; unique" }
      - { name: home_region, type: enum, source: input, description: "Home region", constraints: "NA | EU | APAC | LATAM" }
      - { name: day_rate_cents, type: integer, source: input, description: "Rate per 8-hour day unit" }
      - { name: cross_region, type: boolean, source: input, description: "Eligible to work events outside home_region", default: false }

  - name: TalentBooking
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: talent_id, type: string, source: input, description: "FK -> Talent.id" }
      - { name: stage_label, type: string, source: input, description: "Stage/stream label (e.g. MAIN, B-STREAM)" }
      - { name: shift_start_at, type: datetime, source: input, description: "Shift start (closed interval start)" }
      - { name: shift_end_at, type: datetime, source: input, description: "Shift end (closed interval end); must be strictly after start" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | CONFIRMED | SETTLED | CANCELLED", default: TENTATIVE }
      - { name: fee_quote_cents, type: integer, source: computed, description: "Provisional fee variant (base day units only); see talent_fee calculation" }
      - { name: fee_final_cents, type: integer, source: computed, description: "Final fee variant at SETTLED (base + overtime + royalty); null until settle", default: null }

  - name: PayoutRecord
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: system, description: "FK -> Tournament.id" }
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id; the placing team" }
      - { name: payee_player_id, type: string, source: system, description: "FK -> Player.id; the registration captain" }
      - { name: placement, type: integer, source: system, description: "Placement this record pays for" }
      - { name: compute_run_mode, type: enum, source: system, description: "PROVISIONAL | FINAL; which calculation variant produced this record" }
      - { name: bracket_version, type: integer, source: system, description: "Tournament.bracket_version at compute time; stale runs are voided on recompute" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Waterfall share after floor + rounding reconciliation" }
      - { name: withholding_cents, type: integer, source: computed, description: "Tax withholding; finalized at approve time from current verified doc" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross - withholding" }
      - { name: payee_is_minor, type: boolean, source: computed, description: "Copied from payee roster slot is_minor at compute time" }
      - { name: guardian_name, type: string, source: input, description: "Guardian legal name; required at submit-docs when payee_is_minor", default: null }
      - { name: guardian_email, type: string, source: input, description: "Guardian contact email; required when payee_is_minor", default: null }
      - { name: doc_status, type: enum, source: system, description: "PENDING | SUBMITTED | VERIFIED | REJECTED", default: PENDING }
      - { name: doc_type, type: enum, source: input, description: "W9 | W8BEN | GUARDIAN_W9; null until submit-docs", default: null }
      - { name: doc_verified_by_user_id, type: string, source: system, description: "PayoutOfficer X-User-ID who verified docs; SoD anchor", default: null }
      - { name: disbursement_status, type: enum, source: system, description: "COMPUTED | APPROVED | PAID | VOID", default: COMPUTED }
      - { name: approved_by_user_id, type: string, source: system, description: "PayoutOfficer X-User-ID who approved", default: null }
      - { name: paid_at, type: datetime, source: system, description: "Logical timestamp of disbursement", default: null }

  - name: SponsorDeal
    parent: null
    common_fields: true
    fields:
      - { name: tournament_id, type: string, source: input, description: "FK -> Tournament.id" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor brand name" }
      - { name: contact_user_id, type: string, source: input, description: "SponsorManager X-User-ID that owns activation for this deal" }
      - { name: rights_tier, type: enum, source: input, description: "TITLE | PRESENTING | SUPPORTING" }
      - { name: bonus_cents, type: integer, source: input, description: "Added to prize pool when deal is ACTIVATED at compute time" }
      - { name: content_rights, type: array, source: input, description: "Subset of [VOD, CLIPS, REPLAYS, LOGOS]" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONTRACTED | ACTIVATED | VOID", default: PROPOSED }
      - { name: activated_at, type: datetime, source: system, description: "Logical timestamp of activation", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tournament
    initial_state: DRAFT
    terminal_states: [PAYOUTS_FINALIZED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /api/tournaments/{id}/advance (target_status=REGISTRATION_OPEN)"
        actor: TournamentDirector
        preconditions: []
        side_effects: ["increments Tournament.version by 1"]
      - from: REGISTRATION_OPEN
        to: REGISTRATION_LOCKED
        trigger: "POST /api/tournaments/{id}/advance (target_status=REGISTRATION_LOCKED)"
        actor: TournamentDirector
        preconditions:
          - "logical clock >= Tournament.registration_closes_at"
        side_effects:
          - "every Registration of this tournament in APPROVED -> LOCKED"
          - "every Registration still in SUBMITTED or APPEALED -> REJECTED (unreviewed at lock)"
          - "for each now-LOCKED registration, each ACTIVE RosterSlot gets age_at_lock_years and is_minor computed (roster_lock_age calculation)"
          - "increments Tournament.version by 1"
      - from: REGISTRATION_LOCKED
        to: SEEDED
        trigger: "POST /api/tournaments/{id}/generate-bracket"
        actor: TournamentDirector
        preconditions:
          - "count of LOCKED registrations >= 2"
          - "funded_pool_cents >= prize_pool_target_cents (exact equality allowed)"
          - "OCC: expected_tournament_version == Tournament.version"
        side_effects:
          - "seed_score computed for each LOCKED registration (seed_score calculation); seed_position assigned by selector (score DESC, qualifier_wins DESC, registration created_at ASC)"
          - "Match tree created per bracket_assignment calculation; bye matches auto-FORFEIT with walkover propagation"
          - "bracket_version += 1; increments Tournament.version by 1"
      - from: SEEDED
        to: SEEDED
        trigger: "POST /api/tournaments/{id}/generate-bracket (regeneration supersedes prior bracket)"
        actor: TournamentDirector
        preconditions:
          - "count of LOCKED registrations >= 2"
          - "funded_pool_cents >= prize_pool_target_cents"
          - "no Match of this tournament has status IN {LOBBY_OPEN, LIVE, PAUSED, COMPLETED, UNDER_DISPUTE, CONFIRMED, OVERTURNED}"
          - "OCC: expected_tournament_version == Tournament.version"
        side_effects:
          - "all existing Matches of this tournament -> CANCELLED; booked_minutes of their servers recomputed"
          - "seed_score recomputed; seed_position reassigned; new Match tree created; bye walkovers propagate"
          - "bracket_version += 1; increments Tournament.version by 1"
        note: "Cyclic regeneration self-loop: bracket teardown and rebuild while status stays SEEDED."
      - from: SEEDED
        to: IN_PROGRESS
        trigger: "POST /api/tournaments/{id}/advance (target_status=IN_PROGRESS)"
        actor: TournamentDirector
        preconditions:
          - "every Match with bracket_round == 1 and both participants assigned has status SCHEDULED"
        side_effects: ["increments Tournament.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/tournaments/{id}/advance (target_status=COMPLETED)"
        actor: TournamentDirector
        preconditions:
          - "every Match of this tournament has status IN {CONFIRMED, FORFEIT}"
        side_effects:
          - "placement assigned to every LOCKED registration via placement_assignment calculation; placements_assigned = true"
          - "increments Tournament.version by 1"
      - from: COMPLETED
        to: PAYOUTS_FINALIZED
        trigger: "POST /api/tournaments/{id}/advance (target_status=PAYOUTS_FINALIZED)"
        actor: TournamentDirector
        preconditions:
          - "every PayoutRecord of this tournament has disbursement_status IN {PAID, VOID}"
        side_effects: ["increments Tournament.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/tournaments/{id}/advance (target_status=CANCELLED)"
        actor: TournamentDirector
        preconditions: []
        side_effects: ["increments Tournament.version by 1"]
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /api/tournaments/{id}/advance (target_status=CANCELLED)"
        actor: TournamentDirector
        preconditions: []
        side_effects:
          - "all non-terminal Registrations (DRAFT, SUBMITTED, APPEALED, APPROVED) -> REJECTED"
          - "increments Tournament.version by 1"
      - from: SEEDED
        to: CANCELLED
        trigger: "POST /api/tournaments/{id}/advance (target_status=CANCELLED)"
        actor: TournamentDirector
        preconditions: []
        side_effects:
          - "all Matches in {PENDING, SCHEDULED} -> CANCELLED; server booked_minutes recomputed"
          - "all TalentBookings of this tournament in {TENTATIVE, CONFIRMED} -> CANCELLED"
          - "increments Tournament.version by 1"

  - entity: Registration
    initial_state: DRAFT
    terminal_states: [REJECTED, FORFEITED]
    note: "REJECTED is terminal only after appeal_used = true; see appeal cycle."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/registrations/{id}/submit"
        actor: TeamManager
        preconditions:
          - "Tournament.status == REGISTRATION_OPEN"
          - "registration_opens_at <= now <= registration_closes_at"
          - "exactly Tournament.roster_size ACTIVE RosterSlots with slot_role = STARTER"
          - "total ACTIVE RosterSlots <= Tournament.max_roster_size"
          - "every ACTIVE slot's player has eligibility_status == ELIGIBLE"
          - "captain_player_id is the player_id of an ACTIVE STARTER slot"
          - "no ACTIVE slot's player appears on another ACTIVE slot of any other registration for the same tournament"
        side_effects: ["increments Registration.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/registrations/{id}/review (action=APPROVE)"
        actor: TournamentDirector
        preconditions: ["Tournament.status == REGISTRATION_OPEN"]
        side_effects: ["increments Registration.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/registrations/{id}/review (action=REJECT)"
        actor: TournamentDirector
        preconditions: ["Tournament.status == REGISTRATION_OPEN"]
        side_effects: ["increments Registration.version by 1"]
      - from: APPEALED
        to: APPROVED
        trigger: "POST /api/registrations/{id}/review (action=APPROVE)"
        actor: TournamentDirector
        preconditions: ["Tournament.status == REGISTRATION_OPEN"]
        side_effects: ["increments Registration.version by 1"]
      - from: APPEALED
        to: REJECTED
        trigger: "POST /api/registrations/{id}/review (action=REJECT)"
        actor: TournamentDirector
        preconditions: ["Tournament.status == REGISTRATION_OPEN"]
        side_effects: ["increments Registration.version by 1"]
      - from: REJECTED
        to: APPEALED
        trigger: "POST /api/registrations/{id}/appeal"
        actor: TeamManager
        preconditions:
          - "appeal_used == false"
          - "Tournament.status == REGISTRATION_OPEN"
        side_effects: ["appeal_used = true", "increments Registration.version by 1"]
        note: "Cycle REJECTED -> APPEALED -> {APPROVED, REJECTED}; second appeal rejected with ERR_APPEAL_EXHAUSTED."
      - from: APPROVED
        to: LOCKED
        trigger: "system: Tournament REGISTRATION_OPEN -> REGISTRATION_LOCKED advance"
        actor: system
        preconditions: []
        side_effects: ["each ACTIVE RosterSlot gets age_at_lock_years/is_minor computed"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: Tournament lock advance (unreviewed at lock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: REJECTED
        trigger: "system: Tournament lock advance (unreviewed at lock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: FORFEITED
        trigger: "system: anti-cheat DQ cascade (strike_threshold breach) when tournament status IN {REGISTRATION_LOCKED, SEEDED, IN_PROGRESS, COMPLETED}"
        actor: system
        preconditions:
          - "count of this registration's ACTIVE STARTER RosterSlots < Tournament.roster_size after slot invalidation"
        side_effects:
          - "all non-terminal Matches of this tournament where this registration is a participant -> FORFEIT with walkover propagation (see Match FORFEIT side effects)"

  - entity: Match
    initial_state: PENDING
    terminal_states: [CONFIRMED, FORFEIT, CANCELLED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /api/matches/{id}/schedule"
        actor: TournamentDirector
        preconditions:
          - "Tournament.status IN {SEEDED, IN_PROGRESS}"
          - "home_registration_id and away_registration_id both non-null"
          - "server exists, ServerInstance.status == ACTIVE, ServerInstance.tournament_id == match.tournament_id"
          - "scheduled_start_at >= now"
          - "no server window conflict (server_window_overlap rule: half-open intervals + BUFFER_MINUTES teardown)"
          - "minor curfew: if any ACTIVE roster slot of either participant is_minor, the UTC time-of-day of (scheduled_start_at + duration_minutes) must be strictly before minor_curfew_local"
        side_effects:
          - "ServerInstance.booked_minutes recomputed (server_booked_minutes calculation)"
          - "increments Match.version by 1"
      - from: SCHEDULED
        to: LOBBY_OPEN
        trigger: "POST /api/matches/{id}/officiate (action=OPEN_LOBBY)"
        actor: Referee
        preconditions:
          - "both participants' Registration.status == LOCKED"
          - "ServerInstance.status == ACTIVE"
        side_effects: ["increments Match.version by 1"]
      - from: LOBBY_OPEN
        to: LIVE
        trigger: "POST /api/matches/{id}/officiate (action=START)"
        actor: Referee
        preconditions: []
        side_effects: ["increments Match.version by 1"]
      - from: LIVE
        to: PAUSED
        trigger: "POST /api/matches/{id}/officiate (action=PAUSE, pause_reason, pausing_side)"
        actor: Referee
        preconditions:
          - "if pause_reason == TACTICAL: tactical_pauses_<pausing_side> < TACTICAL_PAUSE_LIMIT (2); TECHNICAL pauses never count"
        side_effects:
          - "if TACTICAL: tactical_pauses_<pausing_side> += 1"
          - "increments Match.version by 1"
      - from: PAUSED
        to: LIVE
        trigger: "POST /api/matches/{id}/officiate (action=RESUME)"
        actor: Referee
        preconditions: []
        side_effects: ["increments Match.version by 1"]
      - from: LIVE
        to: COMPLETED
        trigger: "POST /api/matches/{id}/report-result"
        actor: Referee
        preconditions:
          - "home_score != away_score (ties not allowed)"
        side_effects:
          - "winner_registration_id = higher-score side; reported_by_user_id = X-User-ID; completed_at = now; dispute_window_closes_at = now + 24h"
          - "walkover propagation: if next_match_id non-null and next match status == PENDING: fill its null participant slot (home first, then away) with winner_registration_id"
          - "increments Match.version by 1"
      - from: COMPLETED
        to: CONFIRMED
        trigger: "POST /api/matches/{id}/confirm-result"
        actor: Referee
        preconditions:
          - "SoD: X-User-ID != reported_by_user_id"
        side_effects: ["confirmed_by_user_id = X-User-ID", "increments Match.version by 1"]
      - from: COMPLETED
        to: UNDER_DISPUTE
        trigger: "system: POST /api/disputes accepted for this match"
        actor: system
        preconditions: ["now <= dispute_window_closes_at"]
        side_effects: ["increments Match.version by 1"]
      - from: UNDER_DISPUTE
        to: CONFIRMED
        trigger: "system: Dispute ruled UPHELD"
        actor: system
        preconditions: []
        side_effects: ["confirmed_by_user_id = adjudicating TournamentDirector id", "increments Match.version by 1"]
      - from: UNDER_DISPUTE
        to: OVERTURNED
        trigger: "system: Dispute ruled OVERTURNED"
        actor: system
        preconditions:
          - "if remedy == WINNER_FLIP: the downstream next match (if any) must have status IN {PENDING, SCHEDULED}"
        side_effects:
          - "if remedy == WINNER_FLIP: winner_registration_id flips to the other participant; if next_match filled, replace the advanced registration in its slot with the new winner; Match then auto-transitions OVERTURNED -> CONFIRMED (same request)"
          - "if remedy == REMATCH: home_score/away_score/winner_registration_id/completed_at/dispute_window_closes_at cleared; the advanced slot in next match (if filled and next match still PENDING) is cleared"
          - "increments Match.version by 1"
      - from: OVERTURNED
        to: SCHEDULED
        trigger: "system: remedy == REMATCH re-queue (same adjudicate request)"
        actor: system
        preconditions: []
        side_effects: ["status becomes SCHEDULED with original server_id and scheduled_start_at retained"]
        note: "WINNER_FLIP path ends CONFIRMED; REMATCH path ends SCHEDULED. The machine routes OVERTURNED -> {CONFIRMED, SCHEDULED} inside one adjudication."
      - from: PENDING
        to: FORFEIT
        trigger: "system: bracket generation walkover (bye) OR DQ cascade"
        actor: system
        preconditions: []
        side_effects: ["walkover propagation to next_match_id as in report-result"]
      - from: SCHEDULED
        to: FORFEIT
        trigger: "POST /api/matches/{id}/officiate (action=FORFEIT, forfeiting_side) OR system DQ cascade"
        actor: Referee
        preconditions: ["forfeiting_side IN {HOME, AWAY}"]
        side_effects:
          - "winner_registration_id = other participant; forfeiting_registration_id set; completed_at = now (no dispute window opens: dispute_window_closes_at = completed_at, i.e. immediately closed)"
          - "walkover propagation to next_match_id"
          - "ServerInstance.booked_minutes recomputed (forfeit releases the booking: FORFEIT excluded from booked set)"
          - "increments Match.version by 1"
      - from: LOBBY_OPEN
        to: FORFEIT
        trigger: "POST /api/matches/{id}/officiate (action=FORFEIT, forfeiting_side) OR system DQ cascade"
        actor: Referee
        preconditions: ["forfeiting_side IN {HOME, AWAY}"]
        side_effects: ["same as SCHEDULED -> FORFEIT"]
      - from: LIVE
        to: FORFEIT
        trigger: "system DQ cascade only (mid-match disqualification)"
        actor: system
        preconditions: []
        side_effects: ["same as SCHEDULED -> FORFEIT"]
      - from: PAUSED
        to: FORFEIT
        trigger: "system DQ cascade only (mid-match disqualification)"
        actor: system
        preconditions: []
        side_effects: ["same as SCHEDULED -> FORFEIT"]
      - from: PENDING
        to: CANCELLED
        trigger: "system: Tournament cancel or bracket regeneration"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: Tournament cancel or bracket regeneration"
        actor: system
        preconditions: []
        side_effects: ["ServerInstance.booked_minutes recomputed"]

  - entity: Dispute
    initial_state: FILED
    terminal_states: [CLOSED_UPHELD, CLOSED_OVERTURNED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /api/disputes/{id}/adjudicate (action=START_REVIEW)"
        actor: TournamentDirector
        preconditions: []
        side_effects: ["increments Dispute.version by 1"]
      - from: UNDER_REVIEW
        to: CLOSED_UPHELD
        trigger: "POST /api/disputes/{id}/adjudicate (action=RULE_UPHELD)"
        actor: TournamentDirector
        preconditions: []
        side_effects:
          - "ruling = UPHELD"
          - "Match UNDER_DISPUTE -> CONFIRMED"
          - "increments Dispute.version by 1"
      - from: UNDER_REVIEW
        to: CLOSED_OVERTURNED
        trigger: "POST /api/disputes/{id}/adjudicate (action=RULE_OVERTURNED, remedy)"
        actor: TournamentDirector
        preconditions:
          - "remedy IN {WINNER_FLIP, REMATCH}"
          - "if remedy == WINNER_FLIP: downstream next match status IN {PENDING, SCHEDULED}"
          - "if remedy == REMATCH and the advanced slot was already filled: downstream next match status == PENDING (cannot re-queue into a started match); violation -> ERR_BRACKET_LOCKED_DOWNSTREAM"
        side_effects:
          - "ruling = OVERTURNED; remedy recorded"
          - "Match UNDER_DISPUTE -> OVERTURNED -> {CONFIRMED | SCHEDULED} per remedy (see Match machine)"
          - "increments Dispute.version by 1"
      - from: CLOSED_UPHELD
        to: APPEALED
        trigger: "POST /api/disputes/{id}/appeal"
        actor: TeamManager
        preconditions: ["appeal_used == false", "filer owns the dispute (registration_id == X-User-ID)"]
        side_effects:
          - "appeal_used = true"
          - "Match CONFIRMED -> UNDER_DISPUTE is NOT re-opened on appeal; appeal reopens review only"
          - "increments Dispute.version by 1"
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /api/disputes/{id}/adjudicate (action=START_REVIEW)"
        actor: TournamentDirector
        preconditions: []
        side_effects: ["increments Dispute.version by 1"]
        note: "Appeal cycle CLOSED_UPHELD -> APPEALED -> UNDER_REVIEW -> CLOSED_*; a second appeal rejected ERR_APPEAL_EXHAUSTED. CLOSED_OVERTURNED is not appealable."

  - entity: IntegrityCase
    initial_state: OPEN
    terminal_states: [RESOLVED_CLEARED, RESOLVED_VIOLATION]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /api/integrity-cases/{id}/resolve is only valid from INVESTIGATING; OPEN -> INVESTIGATING via POST /api/integrity-cases/{id}/resolve (action=BEGIN_INVESTIGATION)"
        actor: AntiCheatInvestigator
        preconditions: []
        side_effects: ["increments IntegrityCase.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED_CLEARED
        trigger: "POST /api/integrity-cases/{id}/resolve (action=RESOLVE, outcome=CLEARED)"
        actor: AntiCheatInvestigator
        preconditions:
          - "SoD: if match_id non-null, X-User-ID != that Match.assigned_referee_id"
        side_effects: ["resolved_by_user_id = X-User-ID; resolved_at = now", "increments IntegrityCase.version by 1"]
      - from: INVESTIGATING
        to: RESOLVED_VIOLATION
        trigger: "POST /api/integrity-cases/{id}/resolve (action=RESOLVE, outcome=VIOLATION)"
        actor: AntiCheatInvestigator
        preconditions:
          - "SoD: if match_id non-null, X-User-ID != that Match.assigned_referee_id"
        side_effects:
          - "resolved_by_user_id = X-User-ID; resolved_at = now; strike_issued = true"
          - "Player.ac_strike_events appended {integrity_case_id, issued_at: now}; active_strike_count recomputed (strike_threshold calculation)"
          - "if active_strike_count >= STRIKE_LIMIT (3): Player.eligibility_status -> BANNED"
          - "BANNED cascade: every ACTIVE RosterSlot for this player whose registration's tournament status IN {REGISTRATION_LOCKED, SEEDED, IN_PROGRESS, COMPLETED} -> INELIGIBLE"
          - "per affected registration: if ACTIVE STARTER count < Tournament.roster_size -> Registration LOCKED -> FORFEITED"
          - "per forfeited registration: its non-terminal Matches -> FORFEIT with walkover propagation; ServerInstance.booked_minutes recomputed"
          - "increments IntegrityCase.version by 1"

  - entity: TalentBooking
    initial_state: TENTATIVE
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /api/talent-bookings/{id}/transition (action=CONFIRM)"
        actor: BroadcastProducer
        preconditions:
          - "Tournament.status IN {SEEDED, IN_PROGRESS}"
          - "talent window still conflict-free among other CONFIRMED bookings (closed-interval overlap)"
        side_effects: ["increments TalentBooking.version by 1"]
      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /api/talent-bookings/{id}/transition (action=SETTLE)"
        actor: BroadcastProducer
        preconditions: ["Tournament.status IN {IN_PROGRESS, COMPLETED}"]
        side_effects:
          - "fee_final_cents computed (talent_fee FINAL variant)"
          - "increments TalentBooking.version by 1"
      - from: TENTATIVE
        to: CANCELLED
        trigger: "POST /api/talent-bookings/{id}/transition (action=CANCEL) OR system tournament cancel"
        actor: BroadcastProducer
        preconditions: []
        side_effects: ["increments TalentBooking.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/talent-bookings/{id}/transition (action=CANCEL) OR system tournament cancel"
        actor: BroadcastProducer
        preconditions: []
        side_effects: ["increments TalentBooking.version by 1"]

  - entity: PayoutRecord
    initial_state: COMPUTED
    terminal_states: [PAID, VOID]
    note: "Parallel state dimensions: doc_status (PENDING -> SUBMITTED -> VERIFIED | REJECTED, REJECTED -> SUBMITTED resubmit cycle) evolves independently of disbursement_status (COMPUTED -> APPROVED -> PAID, COMPUTED -> VOID)."
    transitions:
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /api/payout-records/{id}/approve"
        actor: PayoutOfficer
        preconditions:
          - "compute_run_mode == FINAL"
          - "if gross_amount_cents >= 60000: doc_status == VERIFIED"
          - "if payee_is_minor: doc_status == VERIFIED and doc_type == GUARDIAN_W9"
          - "SoD: X-User-ID != doc_verified_by_user_id when doc_verified_by_user_id non-null"
        side_effects:
          - "withholding_cents computed from current verified doc_type (withholding calculation); net_amount_cents = gross - withholding"
          - "approved_by_user_id = X-User-ID"
          - "increments PayoutRecord.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/payout-records/{id}/pay"
        actor: PayoutOfficer
        preconditions: []
        side_effects: ["paid_at = now", "increments PayoutRecord.version by 1"]
      - from: COMPUTED
        to: VOID
        trigger: "system: payout recompute supersede OR tournament cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /api/payout-records/{id}/submit-docs (doc_status dimension)"
        actor: Player
        preconditions:
          - "payee_player_id == X-User-ID"
          - "if payee_is_minor: doc_type == GUARDIAN_W9 and guardian_name and guardian_email present"
          - "disbursement_status == COMPUTED (docs cannot change after approval)"
        side_effects: ["doc_type recorded", "increments PayoutRecord.version by 1"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/payout-records/{id}/verify-docs (action=VERIFY) (doc_status dimension)"
        actor: PayoutOfficer
        preconditions: []
        side_effects: ["doc_verified_by_user_id = X-User-ID", "increments PayoutRecord.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/payout-records/{id}/verify-docs (action=REJECT) (doc_status dimension)"
        actor: PayoutOfficer
        preconditions: []
        side_effects: ["increments PayoutRecord.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/payout-records/{id}/submit-docs (resubmission cycle) (doc_status dimension)"
        actor: Player
        preconditions: ["payee_player_id == X-User-ID", "disbursement_status == COMPUTED"]
        side_effects: ["doc_type overwritten", "increments PayoutRecord.version by 1"]

  - entity: SponsorDeal
    initial_state: PROPOSED
    terminal_states: [VOID]
    transitions:
      - from: PROPOSED
        to: CONTRACTED
        trigger: "POST /api/sponsor-deals/{id}/transition (action=CONTRACT)"
        actor: OrganizerAdmin
        preconditions: []
        side_effects: ["increments SponsorDeal.version by 1"]
      - from: CONTRACTED
        to: ACTIVATED
        trigger: "POST /api/sponsor-deals/{id}/transition (action=ACTIVATE)"
        actor: SponsorManager
        preconditions: ["contact_user_id == X-User-ID (ownership)"]
        side_effects: ["activated_at = now", "increments SponsorDeal.version by 1"]
      - from: PROPOSED
        to: VOID
        trigger: "POST /api/sponsor-deals/{id}/transition (action=VOID)"
        actor: OrganizerAdmin
        preconditions: []
        side_effects: ["increments SponsorDeal.version by 1"]
      - from: CONTRACTED
        to: VOID
        trigger: "POST /api/sponsor-deals/{id}/transition (action=VOID)"
        actor: OrganizerAdmin
        preconditions: []
        side_effects: ["increments SponsorDeal.version by 1"]
      - from: ACTIVATED
        to: VOID
        trigger: "POST /api/sponsor-deals/{id}/transition (action=VOID)"
        actor: OrganizerAdmin
        preconditions: []
        side_effects: ["increments SponsorDeal.version by 1"]

  - entity: Player
    initial_state: ELIGIBLE
    terminal_states: [BANNED]
    note: "Machine field is eligibility_status. BANNED is terminal within a tournament season; no unban path exists in this API."
    transitions:
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /api/players/{id}/eligibility (action=SUSPEND)"
        actor: OrganizerAdmin
        preconditions: []
        side_effects: ["increments Player.version by 1"]
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /api/players/{id}/eligibility (action=REINSTATE)"
        actor: OrganizerAdmin
        preconditions: []
        side_effects: ["increments Player.version by 1"]
      - from: ELIGIBLE
        to: BANNED
        trigger: "system: strike_threshold breach on IntegrityCase VIOLATION resolution"
        actor: system
        preconditions: ["active_strike_count >= STRIKE_LIMIT (3) after strike append"]
        side_effects: ["DQ cascade per IntegrityCase machine"]
      - from: SUSPENDED
        to: BANNED
        trigger: "system: strike_threshold breach on IntegrityCase VIOLATION resolution"
        actor: system
        preconditions: ["active_strike_count >= STRIKE_LIMIT (3) after strike append"]
        side_effects: ["DQ cascade per IntegrityCase machine"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: bracket-gen-stale-tournament
    parent_entity: Tournament
    write_endpoint: "POST /api/tournaments/{id}/generate-bracket"
    occ_field: expected_tournament_version
    description: |
      Generating (or regenerating) a bracket against a Tournament whose version
      has advanced since the client last observed it is rejected. A regenerate
      legitimately supersedes the prior bracket, so a client holding a stale
      view of the tournament (e.g. another operator just funded the pool or
      locked the roster, bumping version) must re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payout-compute-stale-tournament
    parent_entity: Tournament
    write_endpoint: "POST /api/tournaments/{id}/payout-records/compute"
    occ_field: expected_tournament_version
    description: |
      Computing a payout run against a Tournament whose version has advanced
      since the client last observed it is rejected. A compute legitimately
      supersedes the prior run (its COMPUTED records are voided), so a client
      holding a stale tournament view must re-read before computing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: seed_score
    trigger: "Tournament REGISTRATION_LOCKED -> SEEDED via generate-bracket, for each LOCKED registration"
    algorithm: weighted_scoring
    formula: |
      seed_score = 0.50 * region_rank_points
                 + 0.30 * prior_event_points
                 + 0.20 * (qualifier_wins * 10)
      Rounded to 3 decimal places, round_half_up.
      seed_position assignment (selector policy):
        eligibility filter: Registration.status == LOCKED for this tournament
        ranking: seed_score DESC
        tie-break 1: qualifier_wins DESC
        tie-break 2: Registration.created_at ASC; tie-break 3: team_name ASC (never id)
    input_set: "Registrations of the tournament with status == LOCKED only"
    constants:
      W_REGION: 0.50
      W_PRIOR: 0.30
      W_QUALIFIER: 0.20
      QUALIFIER_MULT: 10
    precision: "3 decimal places, round_half_up"

  - name: bracket_assignment
    trigger: "generate-bracket, after seed_position assignment"
    algorithm: topological
    formula: |
      locked = LOCKED registrations sorted by seed_position ASC
      n = count(locked); require n >= 2
      bracket_size = smallest power of two >= n
      R = log2(bracket_size) rounds; round r has bracket_size / 2^r matches
      Round-1 pairing: seed i vs seed (bracket_size + 1 - i) for i in 1..bracket_size/2
        (match slot k pairs home = seed k, away = seed bracket_size + 1 - k)
      Byes: seeds > n do not exist; a round-1 match whose away seed > n is a
        walkover: created directly in status FORFEIT with winner = home seed,
        and the winner propagates immediately to the next match's empty slot
        (home slot first, then away).
      next_match_id of round r slot k = round r+1 slot ceil(k/2); finals have null.
      A match created with both participants null stays PENDING (TBD).
    input_set: "LOCKED registrations with assigned seed_position"
    constants: {}
    precision: "integer arithmetic"

  - name: placement_assignment
    trigger: "Tournament IN_PROGRESS -> COMPLETED advance"
    algorithm: topological
    formula: |
      R = total rounds = log2(bracket_size) for the current bracket_version.
      Champion (winner of the final match) -> placement 1.
      A registration eliminated in a match at bracket_round r -> placement 2^(R - r) + 1
      (final loser r=R -> 2; semifinal losers r=R-1 -> 3; quarterfinal losers -> 5).
      FORFEIT matches count as eliminations for the forfeiting side.
      Registrations with status FORFEITED keep placement null and receive no
      PayoutRecord in either compute mode.
    input_set: "All Matches of the current bracket_version with status IN {CONFIRMED, FORFEIT}"
    constants: {}
    precision: "integer arithmetic"

  - name: prize_pool_distribution
    trigger: "POST /api/tournaments/{id}/payout-records/compute (mode PROVISIONAL or FINAL)"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned (1)-(6):
      (1) pool_total_cents = Tournament.funded_pool_cents + sponsor_bonus_cents,
          where sponsor_bonus_cents = sum of bonus_cents over SponsorDeals of
          this tournament with status == ACTIVATED at compute time.
      (2) eligible set = registrations of this tournament with placement
          IN {1, 2, 3} (placements > 3 pay 0) AND status != FORFEITED.
          PROVISIONAL variant: IntegrityCase status is ignored (optimistic).
          FINAL variant: requires zero IntegrityCases in {OPEN, INVESTIGATING}
          for any player on an eligible registration; excluded/forfeited
          registrations' percentages redistribute pro-rata (see step 4).
      (3) base_pct per placement: {1: 50, 2: 25, 3: 12.5} (each tied 3rd-place
          team receives its own 12.5).
      (4) FINAL-variant redistribution: if any placed registration is excluded
          (FORFEITED), its base_pct is redistributed to remaining placed
          registrations in proportion to their own base_pct values.
      (5) Waterfall with floor: process placements ascending (1, then 2, then
          3s by registration created_at ASC, final fallback seed_position ASC). Each record takes
          min( max(MIN_PLACEMENT_CENTS, pool_total_cents * pct / 100),
               remaining_pool_cents ).
          remaining_pool_cents starts at pool_total_cents.
      (5b) Residual sweep: after the last record, any positive
          remaining_pool_cents (unallocated percentage, e.g. a 2-team bracket
          where shares sum to 75%) is added to the placement-1 record's exact
          gross before rounding. If no placement-1 record exists, the residual
          goes to the lowest placement number present (created_at ASC on ties).
      (6) Rounding reconciliation (prize_rounding_reconciliation): each gross
          rounded to integer cents round_half_up; delta = pool_total_cents -
          sum(rounded gross over records created this run); the delta (which
          may be negative) is added to the record with the lowest placement
          number (1 before 2 before 3); tie on placement -> the record whose
          registration sorts first by created_at ASC, final fallback seed_position ASC. Never id.
      Records are created with compute_run_mode = requested mode,
      bracket_version = current Tournament.bracket_version,
      gross_amount_cents per above, withholding_cents = 0,
      net_amount_cents = gross_amount_cents (finalized at approve),
      doc_status = PENDING, disbursement_status = COMPUTED.
      Supersede rule: on success, all prior PayoutRecords of this tournament
      with disbursement_status == COMPUTED -> VOID before new records persist.
    input_set: "Registrations with non-null placement for the current bracket_version; FORFEITED excluded; SponsorDeals status == ACTIVATED"
    constants:
      MIN_PLACEMENT_CENTS: 100000
      PCT_FIRST: 50
      PCT_SECOND: 25
      PCT_THIRD: 12.5
    precision: "integer cents; per-record round_half_up before reconciliation"
    variants:
      - name: PROVISIONAL
        when: "mode=PROVISIONAL; allowed while IntegrityCases are still open"
        difference: "ignores pending IntegrityCases (treats accused players as cleared); records carry compute_run_mode=PROVISIONAL and cannot be approved (ERR_PAYOUT_NOT_FINAL)"
      - name: FINAL
        when: "mode=FINAL; requires all IntegrityCases for players on eligible registrations terminal"
        difference: "excludes registrations FORFEITED by anti-cheat DQ and redistributes their base_pct pro-rata; identical inputs after a DQ therefore produce different gross amounts than PROVISIONAL"

  - name: prize_rounding_reconciliation
    trigger: "inside prize_pool_distribution step (6)"
    algorithm: waterfall_allocation
    formula: |
      Pinned order: round each record's exact gross to integer cents
      round_half_up FIRST, then sum; never sum exact values then round once.
      delta = pool_total_cents - sum(rounded gross); delta lands on the
      lowest-placement record (placement ASC, then registration created_at ASC,
      final fallback seed_position ASC).
    input_set: "PayoutRecords created by the current compute run"
    constants: {}
    precision: "integer cents, round_half_up per record before summation"

  - name: withholding
    trigger: "PayoutRecord COMPUTED -> APPROVED (approve)"
    algorithm: threshold
    formula: |
      doc gate (checked before rate selection):
        gross_amount_cents >= DOC_THRESHOLD_CENTS (60000, inclusive) requires
        doc_status == VERIFIED; exactly 60000 requires it.
        payee_is_minor requires doc_status == VERIFIED and
        doc_type == GUARDIAN_W9 regardless of amount.
      rate by current verified doc:
        doc_type == W9 and VERIFIED       -> 0%
        doc_type == W8BEN and VERIFIED    -> 30%
        doc_type == GUARDIAN_W9 and VERIFIED -> 0%
        no verified doc (only allowed when gross < 60000 and not minor) -> 24%
      withholding_cents = round_half_up(gross_amount_cents * rate / 100)
      net_amount_cents = gross_amount_cents - withholding_cents
    input_set: "The single PayoutRecord being approved; its current doc fields"
    constants:
      DOC_THRESHOLD_CENTS: 60000
      BACKUP_WITHHOLDING_PCT: 24
      FOREIGN_WITHHOLDING_PCT: 30
    precision: "integer cents, round_half_up on withholding only; net is exact subtraction"

  - name: talent_fee
    trigger: "TalentBooking create/confirm (PROVISIONAL quote) and TENTATIVE/CONFIRMED -> SETTLED (FINAL)"
    algorithm: tiered_pricing
    formula: |
      duration_hours = (shift_end_at - shift_start_at) in minutes / 60 (exact).
      PROVISIONAL (fee_quote_cents, at creation):
        day_units = ceil(duration_hours / 8)
        fee_quote_cents = day_rate_cents * day_units
      FINAL (fee_final_cents, at settle) - circular-looking royalty resolved by
      pinned evaluation order (1)-(6):
        (1) day_units = ceil(duration_hours / 8)
        (2) base_cents = day_rate_cents * day_units
        (3) cross-region uplift: if Talent.home_region != Tournament.region:
              base_cents = round_half_up(base_cents * 1.15)
            (uplift applies to base only, never to overtime)
        (4) overtime_cents = round_half_up( max(0, duration_hours - 8)
                              * (day_rate_cents / 8) * 1.5 )
        (5) royalty band selected from post-uplift base_cents ONLY (never from
            the total, which is what makes the order load-bearing):
              base_cents < 200000              -> 0%
              200000 <= base_cents < 500000    -> 5%
              base_cents >= 500000             -> 10%
            royalty_cents = round_half_up(base_cents * band_pct / 100)
        (6) fee_final_cents = base_cents + overtime_cents + royalty_cents
    input_set: "The TalentBooking, its Talent, its Tournament"
    constants:
      HOURS_PER_DAY_UNIT: 8
      OVERTIME_MULT: 1.5
      CROSS_REGION_UPLIFT_PCT: 15
      ROYALTY_BAND1_MAX_CENTS: 200000
      ROYALTY_BAND2_MAX_CENTS: 500000
      ROYALTY_BAND2_PCT: 5
      ROYALTY_BAND3_PCT: 10
    precision: "integer cents, round_half_up at steps (3),(4),(5) only"
    variants:
      - name: PROVISIONAL
        when: "booking creation / pre-settle reads"
        difference: "fee_quote_cents = base day units only: no uplift, no overtime, no royalty; identical inputs settle to a strictly larger fee_final_cents whenever any of those components is nonzero"

  - name: strike_threshold
    trigger: "IntegrityCase RESOLVE outcome=VIOLATION (append + re-evaluate)"
    algorithm: decay_function
    formula: |
      active_strike_count(player) = count of events in Player.ac_strike_events
      with issued_at STRICTLY AFTER (now - STRIKE_WINDOW_DAYS days).
      A strike exactly STRIKE_WINDOW_DAYS old (issued_at == now - 365d) is expired.
      If active_strike_count >= STRIKE_LIMIT (3, inclusive): eligibility_status
      -> BANNED and the DQ cascade fires (see IntegrityCase machine).
      At exactly 3 active strikes the ban triggers; at 2 it does not.
    input_set: "Player.ac_strike_events (all events; window filter applied)"
    constants:
      STRIKE_LIMIT: 3
      STRIKE_WINDOW_DAYS: 365
    precision: "integer count; strict-greater window boundary"

  - name: roster_lock_age
    trigger: "Tournament REGISTRATION_OPEN -> REGISTRATION_LOCKED advance, per ACTIVE RosterSlot"
    algorithm: aggregation
    formula: |
      age_at_lock_years = whole years between Player.date_of_birth and the
      lock instant (floor of elapsed days / 365 using calendar-year rollover:
      a player is exactly N years old on their Nth birthday).
      is_minor = age_at_lock_years < 18. An 18th birthday exactly on lock day
      yields is_minor = false.
    input_set: "ACTIVE RosterSlots of LOCKED registrations"
    constants:
      MINOR_AGE_YEARS: 18
    precision: "integer years"

  - name: server_booked_minutes
    trigger: "any Match schedule / forfeit / cancel involving a ServerInstance"
    algorithm: aggregation
    formula: |
      booked_minutes(server) = sum over Matches with server_id == server.id and
      status IN {SCHEDULED, LOBBY_OPEN, LIVE, PAUSED, COMPLETED, UNDER_DISPUTE,
      CONFIRMED, OVERTURNED} of (duration_minutes + BUFFER_MINUTES).
      Matches in {PENDING, FORFEIT, CANCELLED} contribute 0.
    input_set: "Matches of the tournament filtered by server_id and the status set above (inclusive)"
    constants:
      BUFFER_MINUTES: 15
    precision: "integer minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  # Rows with equal priority resolve in list order (top row first).
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership: TeamManager X-User-ID == target Registration.id; Player X-User-ID == PayoutRecord.payee_player_id on submit-docs; SponsorManager X-User-ID == SponsorDeal.contact_user_id on ACTIVATE", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "POST /api/registrations/{id}/submit, POST /api/registrations/{id}/appeal, POST /api/roster-slots, POST /api/roster-slots/{id}/remove, POST /api/disputes, POST /api/disputes/{id}/appeal, POST /api/payout-records/{id}/submit-docs, POST /api/sponsor-deals/{id}/transition" }
  - { priority: 4, category: existence, check: "Path resource and all body FK references exist, validated left-to-right in path then body", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Request body shape: required fields present, types valid, enum members valid, datetime parseable, shift_end_at strictly after shift_start_at, home_score/away_score non-negative, home_score != away_score at report-result (ties not allowed), submit-docs for a minor payee must use doc_type GUARDIAN_W9 with guardian_name and guardian_email present", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "Target resource in a valid from-state for the requested transition (per-entity machines)", error_id: ERR_INVALID_TOURNAMENT_STATUS, http_status: 409, applies_to: "POST /api/tournaments/{id}/advance, POST /api/tournaments/{id}/generate-bracket, POST /api/tournaments/{id}/payout-records/compute, POST /api/tournaments/{id}/fund" }
  - { priority: 6, category: state, check: "Registration machine from-state", error_id: ERR_INVALID_REGISTRATION_STATUS, http_status: 409, applies_to: "POST /api/registrations/{id}/submit, POST /api/registrations/{id}/review, POST /api/registrations/{id}/appeal, POST /api/roster-slots, POST /api/roster-slots/{id}/remove" }
  - { priority: 6, category: state, check: "Match machine from-state", error_id: ERR_INVALID_MATCH_STATUS, http_status: 409, applies_to: "POST /api/matches/{id}/schedule, POST /api/matches/{id}/officiate, POST /api/matches/{id}/report-result, POST /api/matches/{id}/confirm-result" }
  - { priority: 6, category: state, check: "Dispute machine from-state", error_id: ERR_INVALID_DISPUTE_STATUS, http_status: 409, applies_to: "POST /api/disputes/{id}/adjudicate, POST /api/disputes/{id}/appeal" }
  - { priority: 6, category: state, check: "IntegrityCase machine from-state", error_id: ERR_INVALID_CASE_STATUS, http_status: 409, applies_to: "POST /api/integrity-cases/{id}/resolve" }
  - { priority: 6, category: state, check: "TalentBooking machine from-state", error_id: ERR_INVALID_BOOKING_STATUS, http_status: 409, applies_to: "POST /api/talent-bookings/{id}/transition" }
  - { priority: 6, category: state, check: "PayoutRecord disbursement/doc from-state (docs immutable once disbursement_status != COMPUTED)", error_id: ERR_INVALID_PAYOUT_STATUS, http_status: 409, applies_to: "POST /api/payout-records/{id}/submit-docs, POST /api/payout-records/{id}/verify-docs, POST /api/payout-records/{id}/approve, POST /api/payout-records/{id}/pay" }
  - { priority: 6, category: state, check: "SponsorDeal machine from-state", error_id: ERR_INVALID_DEAL_STATUS, http_status: 409, applies_to: "POST /api/sponsor-deals/{id}/transition" }
  - { priority: 7, category: business_safety, check: "Minor curfew: if any ACTIVE roster slot of either match participant is_minor, the UTC time-of-day of (scheduled_start_at + duration_minutes) must be strictly before Tournament.minor_curfew_local", error_id: ERR_MINOR_CURFEW_VIOLATION, http_status: 422, applies_to: "POST /api/matches/{id}/schedule" }
  - { priority: 7, category: business_safety, check: "Minor payee: approve requires doc_status VERIFIED and doc_type GUARDIAN_W9 when payee_is_minor", error_id: ERR_GUARDIAN_DOCS_REQUIRED, http_status: 422, applies_to: "POST /api/payout-records/{id}/approve" }
  - { priority: 7, category: business_safety, check: "Tax threshold: approve with gross_amount_cents >= 60000 (inclusive) requires doc_status == VERIFIED", error_id: ERR_TAX_DOCS_REQUIRED, http_status: 422, applies_to: "POST /api/payout-records/{id}/approve" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: confirm-result X-User-ID != match.reported_by_user_id; approve X-User-ID != doc_verified_by_user_id; resolve X-User-ID != implicated match.assigned_referee_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /api/matches/{id}/confirm-result, POST /api/payout-records/{id}/approve, POST /api/integrity-cases/{id}/resolve" }
  - { priority: 8, category: business_constraint, check: "Uniqueness: Player.handle globally unique; Talent.stage_name globally unique; team_name unique within tournament; no two non-REMOVED RosterSlots with same (registration_id, player_id)", error_id: ERR_HANDLE_TAKEN, http_status: 409, applies_to: "POST /api/players, POST /api/talents, POST /api/registrations, POST /api/roster-slots" }
  - { priority: 8, category: business_constraint, check: "Player appears on at most one registration's ACTIVE roster per tournament", error_id: ERR_PLAYER_DOUBLE_ROSTERED, http_status: 409, applies_to: "POST /api/roster-slots, POST /api/registrations/{id}/submit" }
  - { priority: 8, category: business_constraint, check: "Roster shape at submit: exactly roster_size ACTIVE STARTERs, total ACTIVE <= max_roster_size", error_id: ERR_ROSTER_SIZE_VIOLATION, http_status: 422, applies_to: "POST /api/registrations/{id}/submit, POST /api/roster-slots" }
  - { priority: 8, category: business_constraint, check: "Every ACTIVE slot's player eligibility_status == ELIGIBLE at submit; captain is an ACTIVE STARTER", error_id: ERR_PLAYER_INELIGIBLE, http_status: 422, applies_to: "POST /api/registrations/{id}/submit" }
  - { priority: 8, category: business_constraint, check: "Server window overlap: half-open [start, end + BUFFER_MINUTES) intervals on the same ServerInstance must be disjoint; adjacency where next.start == prior.end + BUFFER_MINUTES is allowed", error_id: ERR_SERVER_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/matches/{id}/schedule" }
  - { priority: 8, category: business_constraint, check: "Talent window overlap: closed [start, end] intervals for the same Talent among CONFIRMED bookings must be disjoint; back-to-back (prior.end == next.start) IS a conflict", error_id: ERR_TALENT_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/talent-bookings, POST /api/talent-bookings/{id}/transition" }
  - { priority: 8, category: business_constraint, check: "Talent region: Talent.home_region != Tournament.region requires Talent.cross_region == true", error_id: ERR_TALENT_REGION_MISMATCH, http_status: 422, applies_to: "POST /api/talent-bookings" }
  - { priority: 8, category: business_constraint, check: "Tactical pause limit: tactical_pauses_<side> < 2 before a TACTICAL pause", error_id: ERR_PAUSE_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /api/matches/{id}/officiate" }
  - { priority: 8, category: business_constraint, check: "Dispute filer must be a participant of the match", error_id: ERR_NOT_MATCH_PARTICIPANT, http_status: 422, applies_to: "POST /api/disputes" }
  - { priority: 8, category: business_constraint, check: "Appeal budget: registration/dispute appeal_used == false", error_id: ERR_APPEAL_EXHAUSTED, http_status: 422, applies_to: "POST /api/registrations/{id}/appeal, POST /api/disputes/{id}/appeal" }
  - { priority: 8, category: business_constraint, check: "WINNER_FLIP remedy blocked when downstream next match has started (status not in {PENDING, SCHEDULED})", error_id: ERR_BRACKET_LOCKED_DOWNSTREAM, http_status: 409, applies_to: "POST /api/disputes/{id}/adjudicate" }
  - { priority: 8, category: business_constraint, check: "Server must be ACTIVE to schedule or open lobby on it", error_id: ERR_SERVER_IN_MAINTENANCE, http_status: 422, applies_to: "POST /api/matches/{id}/schedule, POST /api/matches/{id}/officiate" }
  - { priority: 9, category: business_temporal, check: "Registration window: submit only when registration_opens_at <= now <= registration_closes_at", error_id: ERR_REGISTRATION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /api/registrations/{id}/submit" }
  - { priority: 9, category: business_temporal, check: "Dispute window: file only when now <= match.dispute_window_closes_at", error_id: ERR_DISPUTE_WINDOW_CLOSED, http_status: 422, applies_to: "POST /api/disputes" }
  - { priority: 9, category: business_temporal, check: "Schedule not in the past: scheduled_start_at >= now", error_id: ERR_SCHEDULE_IN_PAST, http_status: 422, applies_to: "POST /api/matches/{id}/schedule" }
  - { priority: 10, category: business_fiscal, check: "Bracket gate: LOCKED registrations >= 2", error_id: ERR_INSUFFICIENT_FIELD, http_status: 422, applies_to: "POST /api/tournaments/{id}/generate-bracket" }
  - { priority: 10, category: business_fiscal, check: "Funding gate: funded_pool_cents >= prize_pool_target_cents (exact equality allowed)", error_id: ERR_PRIZE_POOL_UNDERFUNDED, http_status: 422, applies_to: "POST /api/tournaments/{id}/generate-bracket" }
  - { priority: 10, category: business_fiscal, check: "FINAL compute requires no IntegrityCase in {OPEN, INVESTIGATING} for players on eligible registrations", error_id: ERR_INTEGRITY_CASES_PENDING, http_status: 422, applies_to: "POST /api/tournaments/{id}/payout-records/compute" }
  - { priority: 10, category: business_fiscal, check: "Approve requires compute_run_mode == FINAL", error_id: ERR_PAYOUT_NOT_FINAL, http_status: 422, applies_to: "POST /api/payout-records/{id}/approve" }
  - { priority: 11, category: business_constraint, check: "OCC: expected_tournament_version == Tournament.version on generate-bracket and payout compute", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/tournaments/{id}/generate-bracket, POST /api/tournaments/{id}/payout-records/compute" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /api/_clock/set_current_utc
    description: "Sets the logical server clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [OrganizerAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  - method: POST
    path: /api/tournaments
    description: "Create a tournament in DRAFT"
    roles: [OrganizerAdmin]
    code: 201
    input: [name, game_title, region, prize_pool_target_cents, roster_size, max_roster_size, registration_opens_at, registration_closes_at, minor_curfew_local]
    output: Tournament
    side_effects: []

  - method: GET
    path: /api/tournaments/{id}
    description: "Read a tournament"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager, Player, Referee, AntiCheatInvestigator, BroadcastProducer, PayoutOfficer, SponsorManager]
    code: 200
    input: []
    output: Tournament
    side_effects: []

  - method: POST
    path: /api/tournaments/{id}/advance
    description: "Advance tournament lifecycle to target_status"
    roles: [TournamentDirector]
    code: 200
    input: [target_status]
    output: Tournament
    side_effects: ["Tournament machine transition incl. roster lock cascade, placement assignment, cancel cascades", "increments Tournament.version by 1"]

  - method: POST
    path: /api/tournaments/{id}/fund
    description: "Add funding to the prize pool"
    roles: [OrganizerAdmin]
    code: 200
    input: [amount_cents]
    output: Tournament
    side_effects: ["funded_pool_cents += amount_cents", "increments Tournament.version by 1"]

  - method: POST
    path: /api/tournaments/{id}/generate-bracket
    description: "Seed LOCKED registrations and build the match tree; regenerating supersedes the prior bracket (OCC-guarded)"
    roles: [TournamentDirector]
    code: 201
    input: [expected_tournament_version]
    output: Tournament
    side_effects: ["seed_score + bracket_assignment calculations", "Match tree creation + bye walkovers", "bracket_version += 1", "increments Tournament.version by 1"]

  - method: POST
    path: /api/tournaments/{id}/payout-records/compute
    description: "Run prize_pool_distribution (mode PROVISIONAL or FINAL); supersedes prior COMPUTED records (OCC-guarded)"
    roles: [PayoutOfficer]
    code: 201
    input: [mode, expected_tournament_version]
    output: PayoutRecord[]
    side_effects: ["prior COMPUTED PayoutRecords -> VOID", "new PayoutRecords created in COMPUTED", "increments Tournament.version by 1"]

  - method: POST
    path: /api/players
    description: "Register a player"
    roles: [OrganizerAdmin]
    code: 201
    input: [handle, date_of_birth, region]
    output: Player
    side_effects: []

  - method: GET
    path: /api/players/{id}
    description: "Read a player (eligibility, strikes)"
    roles: [OrganizerAdmin, TournamentDirector, Player, AntiCheatInvestigator, PayoutOfficer]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: POST
    path: /api/players/{id}/eligibility
    description: "Admin eligibility control: SUSPEND | REINSTATE (BANNED is system-only and terminal)"
    roles: [OrganizerAdmin]
    code: 200
    input: [action]
    output: Player
    side_effects: ["Player eligibility machine transition", "increments Player.version by 1"]

  - method: POST
    path: /api/registrations
    description: "Create a team registration shell in DRAFT; returned id is the TeamManager identity for subsequent calls"
    roles: [OrganizerAdmin]
    code: 201
    input: [tournament_id, team_name, manager_contact_email, region_rank_points, prior_event_points, qualifier_wins, captain_player_id]
    output: Registration
    side_effects: []

  - method: GET
    path: /api/registrations/{id}
    description: "Read a registration"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager, PayoutOfficer]
    code: 200
    input: []
    output: Registration
    side_effects: []

  - method: GET
    path: /api/registrations
    description: "List registrations with filters; deterministic order: created_at ASC"
    roles: [OrganizerAdmin, TournamentDirector, PayoutOfficer]
    code: 200
    input: ["tournament_id?", "status?", "captain_player_id?"]
    output: Registration[]
    side_effects: []

  - method: POST
    path: /api/registrations/{id}/submit
    description: "Submit registration for eligibility review (roster shape, window, eligibility checks)"
    roles: [TeamManager]
    code: 200
    input: []
    output: Registration
    side_effects: ["Registration DRAFT -> SUBMITTED", "increments Registration.version by 1"]

  - method: POST
    path: /api/registrations/{id}/review
    description: "Eligibility decision on a SUBMITTED or APPEALED registration"
    roles: [TournamentDirector]
    code: 200
    input: [action, "reason?"]
    output: Registration
    side_effects: ["Registration -> APPROVED or REJECTED", "increments Registration.version by 1"]

  - method: POST
    path: /api/registrations/{id}/appeal
    description: "Appeal a REJECTED registration (once)"
    roles: [TeamManager]
    code: 200
    input: []
    output: Registration
    side_effects: ["Registration REJECTED -> APPEALED", "appeal_used = true", "increments Registration.version by 1"]

  - method: POST
    path: /api/roster-slots
    description: "Add a player to a DRAFT registration roster"
    roles: [TeamManager]
    code: 201
    input: [registration_id, player_id, slot_role]
    output: RosterSlot
    side_effects: []

  - method: POST
    path: /api/roster-slots/{id}/remove
    description: "Remove a roster slot from a DRAFT registration (status -> REMOVED)"
    roles: [TeamManager]
    code: 200
    input: []
    output: RosterSlot
    side_effects: ["RosterSlot -> REMOVED"]

  - method: GET
    path: /api/roster-slots/{id}
    description: "Read a roster slot"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager]
    code: 200
    input: []
    output: RosterSlot
    side_effects: []

  - method: GET
    path: /api/roster-slots
    description: "List roster slots with filters; deterministic order: created_at ASC"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager]
    code: 200
    input: ["registration_id?", "player_id?", "status?"]
    output: RosterSlot[]
    side_effects: []

  - method: POST
    path: /api/servers
    description: "Register a game server instance for a tournament"
    roles: [OrganizerAdmin]
    code: 201
    input: [tournament_id, label, region]
    output: ServerInstance
    side_effects: []

  - method: GET
    path: /api/servers/{id}
    description: "Read a server instance"
    roles: [OrganizerAdmin, TournamentDirector, Referee]
    code: 200
    input: []
    output: ServerInstance
    side_effects: []

  - method: POST
    path: /api/servers/{id}/maintenance
    description: "Maintenance control: ENTER | EXIT. ENTER blocked while the server has matches in {LOBBY_OPEN, LIVE, PAUSED}."
    roles: [OrganizerAdmin]
    code: 200
    input: [action]
    output: ServerInstance
    side_effects: ["ServerInstance status ACTIVE <-> MAINTENANCE", "increments ServerInstance.version by 1"]

  - method: GET
    path: /api/servers
    description: "List server instances with filters; deterministic order: created_at ASC"
    roles: [OrganizerAdmin, TournamentDirector, Referee]
    code: 200
    input: ["tournament_id?", "status?"]
    output: ServerInstance[]
    side_effects: []

  - method: GET
    path: /api/matches/{id}
    description: "Read a match"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager, Referee, AntiCheatInvestigator]
    code: 200
    input: []
    output: Match
    side_effects: []

  - method: GET
    path: /api/matches
    description: "List matches with filters (one filtered list serves all Match FKs); deterministic order: bracket_round ASC, bracket_slot ASC"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager, Referee, AntiCheatInvestigator]
    code: 200
    input: ["tournament_id?", "server_id?", "next_match_id?", "home_registration_id?", "away_registration_id?", "winner_registration_id?", "status?"]
    output: Match[]
    side_effects: []

  - method: POST
    path: /api/matches/{id}/schedule
    description: "Assign server, start time, duration, referee to a PENDING match"
    roles: [TournamentDirector]
    code: 200
    input: [server_id, scheduled_start_at, duration_minutes, assigned_referee_id]
    output: Match
    side_effects: ["Match PENDING -> SCHEDULED", "server_booked_minutes recompute", "increments Match.version by 1"]

  - method: POST
    path: /api/matches/{id}/officiate
    description: "Referee match control: OPEN_LOBBY | START | PAUSE | RESUME | FORFEIT"
    roles: [Referee]
    code: 200
    input: [action, "pause_reason?", "pausing_side?", "forfeiting_side?"]
    output: Match
    side_effects: ["Match machine transition per action", "pause counters", "forfeit walkover + booked_minutes recompute", "increments Match.version by 1"]

  - method: POST
    path: /api/matches/{id}/report-result
    description: "Report final score; match -> COMPLETED and winner advances"
    roles: [Referee]
    code: 200
    input: [home_score, away_score]
    output: Match
    side_effects: ["Match LIVE -> COMPLETED", "winner propagation to next match", "dispute window opens", "increments Match.version by 1"]

  - method: POST
    path: /api/matches/{id}/confirm-result
    description: "Second referee ratifies the result (SoD vs reporter)"
    roles: [Referee]
    code: 200
    input: []
    output: Match
    side_effects: ["Match COMPLETED -> CONFIRMED", "increments Match.version by 1"]

  - method: POST
    path: /api/disputes
    description: "File a dispute on a COMPLETED match within its dispute window"
    roles: [TeamManager]
    code: 201
    input: [match_id, registration_id, reason, details]
    output: Dispute
    side_effects: ["Match COMPLETED -> UNDER_DISPUTE"]

  - method: GET
    path: /api/disputes/{id}
    description: "Read a dispute"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: /api/disputes
    description: "List disputes with filters; deterministic order: created_at ASC"
    roles: [OrganizerAdmin, TournamentDirector, TeamManager]
    code: 200
    input: ["match_id?", "registration_id?", "status?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: /api/disputes/{id}/adjudicate
    description: "Dispute workflow: START_REVIEW | RULE_UPHELD | RULE_OVERTURNED (with remedy WINNER_FLIP | REMATCH)"
    roles: [TournamentDirector]
    code: 200
    input: [action, "remedy?"]
    output: Dispute
    side_effects: ["Dispute machine transition", "Match UNDER_DISPUTE resolution per ruling/remedy", "increments Dispute.version by 1"]

  - method: POST
    path: /api/disputes/{id}/appeal
    description: "Appeal a CLOSED_UPHELD dispute (once)"
    roles: [TeamManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute CLOSED_UPHELD -> APPEALED", "appeal_used = true", "increments Dispute.version by 1"]

  - method: POST
    path: /api/integrity-cases
    description: "Open an anti-cheat case against a player"
    roles: [AntiCheatInvestigator]
    code: 201
    input: [player_id, "match_id?", evidence_summary]
    output: IntegrityCase
    side_effects: []

  - method: GET
    path: /api/integrity-cases/{id}
    description: "Read an integrity case"
    roles: [OrganizerAdmin, AntiCheatInvestigator, TournamentDirector]
    code: 200
    input: []
    output: IntegrityCase
    side_effects: []

  - method: GET
    path: /api/integrity-cases
    description: "List integrity cases with filters; deterministic order: created_at ASC"
    roles: [OrganizerAdmin, AntiCheatInvestigator, TournamentDirector]
    code: 200
    input: ["player_id?", "match_id?", "status?"]
    output: IntegrityCase[]
    side_effects: []

  - method: POST
    path: /api/integrity-cases/{id}/resolve
    description: "Case workflow: BEGIN_INVESTIGATION | RESOLVE (outcome CLEARED | VIOLATION)"
    roles: [AntiCheatInvestigator]
    code: 200
    input: [action, "outcome?"]
    output: IntegrityCase
    side_effects: ["IntegrityCase machine transition", "on VIOLATION: strike append, threshold re-eval, possible BAN + DQ cascade", "increments IntegrityCase.version by 1"]

  - method: POST
    path: /api/talents
    description: "Register broadcast talent"
    roles: [BroadcastProducer]
    code: 201
    input: [stage_name, home_region, day_rate_cents, "cross_region?"]
    output: Talent
    side_effects: []

  - method: POST
    path: /api/talent-bookings
    description: "Book talent onto a shift window (closed-interval conflict check, region rule)"
    roles: [BroadcastProducer]
    code: 201
    input: [tournament_id, talent_id, stage_label, shift_start_at, shift_end_at]
    output: TalentBooking
    side_effects: ["fee_quote_cents computed (talent_fee PROVISIONAL)"]

  - method: GET
    path: /api/talent-bookings/{id}
    description: "Read a talent booking"
    roles: [OrganizerAdmin, BroadcastProducer]
    code: 200
    input: []
    output: TalentBooking
    side_effects: []

  - method: GET
    path: /api/talent-bookings
    description: "List talent bookings with filters; deterministic order: created_at ASC"
    roles: [OrganizerAdmin, BroadcastProducer]
    code: 200
    input: ["tournament_id?", "talent_id?", "status?"]
    output: TalentBooking[]
    side_effects: []

  - method: POST
    path: /api/talent-bookings/{id}/transition
    description: "Booking workflow: CONFIRM | SETTLE | CANCEL"
    roles: [BroadcastProducer]
    code: 200
    input: [action]
    output: TalentBooking
    side_effects: ["TalentBooking machine transition", "on SETTLE: fee_final_cents computed (talent_fee FINAL)", "increments TalentBooking.version by 1"]

  - method: GET
    path: /api/payout-records/{id}
    description: "Read a payout record"
    roles: [OrganizerAdmin, PayoutOfficer, Player]
    code: 200
    input: []
    output: PayoutRecord
    side_effects: []

  - method: GET
    path: /api/payout-records
    description: "List payout records with filters; deterministic order: placement ASC, then registration created_at ASC"
    roles: [OrganizerAdmin, PayoutOfficer, Player]
    code: 200
    input: ["tournament_id?", "payee_player_id?", "registration_id?", "disbursement_status?"]
    output: PayoutRecord[]
    side_effects: []

  - method: POST
    path: /api/payout-records/{id}/submit-docs
    description: "Payee submits tax documentation (or guardian docs for minors); resubmission allowed after REJECTED"
    roles: [Player]
    code: 200
    input: [doc_type, "guardian_name?", "guardian_email?"]
    output: PayoutRecord
    side_effects: ["doc_status -> SUBMITTED", "doc_type recorded", "increments PayoutRecord.version by 1"]

  - method: POST
    path: /api/payout-records/{id}/verify-docs
    description: "PayoutOfficer verifies or rejects submitted docs"
    roles: [PayoutOfficer]
    code: 200
    input: [action]
    output: PayoutRecord
    side_effects: ["doc_status -> VERIFIED or REJECTED", "doc_verified_by_user_id on VERIFY", "increments PayoutRecord.version by 1"]

  - method: POST
    path: /api/payout-records/{id}/approve
    description: "Approve disbursement (withholding finalized; doc gates; SoD vs verifier)"
    roles: [PayoutOfficer]
    code: 200
    input: []
    output: PayoutRecord
    side_effects: ["withholding calculation", "disbursement_status -> APPROVED", "increments PayoutRecord.version by 1"]

  - method: POST
    path: /api/payout-records/{id}/pay
    description: "Disburse an approved payout"
    roles: [PayoutOfficer]
    code: 200
    input: []
    output: PayoutRecord
    side_effects: ["disbursement_status -> PAID", "paid_at = now", "increments PayoutRecord.version by 1"]

  - method: POST
    path: /api/sponsor-deals
    description: "Create a sponsor deal (content rights + activation bonus)"
    roles: [OrganizerAdmin]
    code: 201
    input: [tournament_id, sponsor_name, contact_user_id, rights_tier, bonus_cents, content_rights]
    output: SponsorDeal
    side_effects: []

  - method: GET
    path: /api/sponsor-deals/{id}
    description: "Read a sponsor deal"
    roles: [OrganizerAdmin, SponsorManager, TournamentDirector]
    code: 200
    input: []
    output: SponsorDeal
    side_effects: []

  - method: GET
    path: /api/sponsor-deals
    description: "List sponsor deals with filters; deterministic order: created_at ASC"
    roles: [OrganizerAdmin, SponsorManager, TournamentDirector]
    code: 200
    input: ["tournament_id?", "status?"]
    output: SponsorDeal[]
    side_effects: []

  - method: POST
    path: /api/sponsor-deals/{id}/transition
    description: "Deal workflow: CONTRACT (OrganizerAdmin) | ACTIVATE (owning SponsorManager) | VOID (OrganizerAdmin)"
    roles: [OrganizerAdmin, SponsorManager]
    code: 200
    input: [action]
    output: SponsorDeal
    side_effects: ["SponsorDeal machine transition", "activated_at on ACTIVATE", "increments SponsorDeal.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid required field, bad enum member, unparseable datetime, shift_end_at <= shift_start_at, negative or tied scores at report-result" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed identity does not own the target resource (TeamManager/Player/SponsorManager ownership checks)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource or referenced body FK does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_tournament_version != current Tournament.version on OCC-guarded writes" }
  - { id: ERR_INVALID_TOURNAMENT_STATUS, http: 409, condition: "Tournament not in a valid from-state for advance/fund/generate-bracket/compute" }
  - { id: ERR_INVALID_REGISTRATION_STATUS, http: 409, condition: "Registration not in a valid from-state for submit/review/appeal or roster mutation" }
  - { id: ERR_INVALID_MATCH_STATUS, http: 409, condition: "Match not in a valid from-state for schedule/officiate/report-result/confirm-result" }
  - { id: ERR_INVALID_DISPUTE_STATUS, http: 409, condition: "Dispute not in a valid from-state for adjudicate/appeal" }
  - { id: ERR_INVALID_CASE_STATUS, http: 409, condition: "IntegrityCase not in a valid from-state for the resolve action" }
  - { id: ERR_INVALID_BOOKING_STATUS, http: 409, condition: "TalentBooking not in a valid from-state for the transition action" }
  - { id: ERR_INVALID_PAYOUT_STATUS, http: 409, condition: "PayoutRecord disbursement/doc dimension not in a valid from-state" }
  - { id: ERR_INVALID_DEAL_STATUS, http: 409, condition: "SponsorDeal not in a valid from-state for the transition action" }
  - { id: ERR_MINOR_CURFEW_VIOLATION, http: 422, condition: "Match with any minor would end at or after the tournament minor curfew (end must be strictly before curfew)" }
  - { id: ERR_GUARDIAN_DOCS_REQUIRED, http: 422, condition: "Approve blocked: payee is a minor and docs are not VERIFIED GUARDIAN_W9" }
  - { id: ERR_TAX_DOCS_REQUIRED, http: 422, condition: "Approve blocked: gross >= 60000 cents without VERIFIED docs" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same user performed an upstream step: reporter confirms own result, verifier approves own docs, referee resolves own match's case" }
  - { id: ERR_HANDLE_TAKEN, http: 409, condition: "Unique value already in use: player handle, talent stage name, team name within tournament, duplicate active roster entry" }
  - { id: ERR_PLAYER_DOUBLE_ROSTERED, http: 409, condition: "Player already on an ACTIVE roster slot of another registration for this tournament" }
  - { id: ERR_ROSTER_SIZE_VIOLATION, http: 422, condition: "Submit/add would violate exact starter count or max roster size" }
  - { id: ERR_PLAYER_INELIGIBLE, http: 422, condition: "An ACTIVE slot's player is not ELIGIBLE at submit, or captain is not an ACTIVE STARTER" }
  - { id: ERR_SERVER_WINDOW_CONFLICT, http: 409, condition: "Half-open [start, end+15min) window collides with an existing booking on the same server" }
  - { id: ERR_TALENT_WINDOW_CONFLICT, http: 409, condition: "Closed [start, end] shift collides with another CONFIRMED booking of the same talent (end == start conflicts)" }
  - { id: ERR_TALENT_REGION_MISMATCH, http: 422, condition: "Talent home region differs from tournament region and cross_region is false" }
  - { id: ERR_PAUSE_LIMIT_EXCEEDED, http: 422, condition: "Side has already consumed 2 TACTICAL pauses in this match" }
  - { id: ERR_NOT_MATCH_PARTICIPANT, http: 422, condition: "Dispute filer registration is not home or away on the match" }
  - { id: ERR_APPEAL_EXHAUSTED, http: 422, condition: "appeal_used already true for this registration or dispute" }
  - { id: ERR_BRACKET_LOCKED_DOWNSTREAM, http: 409, condition: "WINNER_FLIP blocked because the advanced-to match has already started" }
  - { id: ERR_SERVER_IN_MAINTENANCE, http: 422, condition: "Server status is MAINTENANCE at schedule or lobby open" }
  - { id: ERR_INSUFFICIENT_FIELD, http: 422, condition: "Fewer than 2 LOCKED registrations at generate-bracket" }
  - { id: ERR_PRIZE_POOL_UNDERFUNDED, http: 422, condition: "funded_pool_cents < prize_pool_target_cents at generate-bracket" }
  - { id: ERR_INTEGRITY_CASES_PENDING, http: 422, condition: "FINAL compute requested while cases are OPEN/INVESTIGATING on eligible registrations' players" }
  - { id: ERR_PAYOUT_NOT_FINAL, http: 422, condition: "Approve attempted on a PROVISIONAL PayoutRecord" }
  - { id: ERR_REGISTRATION_WINDOW_CLOSED, http: 422, condition: "Submit outside [registration_opens_at, registration_closes_at]" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 422, condition: "Dispute filed after match.dispute_window_closes_at" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "scheduled_start_at earlier than the logical clock" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OrganizerAdmin
    description: "Platform operator; owns configuration, funding, player/talent-independent master data"
    identity: opaque
    exclusive_operations: ["create tournament", "fund prize pool", "create players", "create registrations", "create servers", "contract/void sponsor deals", "set logical clock"]
    shared_operations: ["read any entity"]
  - name: TournamentDirector
    description: "Runs the competitive lifecycle: advance, review, seed, schedule, adjudicate disputes"
    identity: opaque
    exclusive_operations: ["advance tournament", "review registrations", "generate bracket", "schedule matches", "adjudicate disputes"]
    shared_operations: ["read tournaments", "read registrations", "read matches", "read disputes", "read integrity cases", "read sponsor deals", "read servers"]
  - name: TeamManager
    description: "Manager of a single registration; X-User-ID equals the Registration.id they manage"
    identity: entity_backed:Registration
    exclusive_operations: ["submit own registration", "appeal own registration", "manage own roster slots", "file disputes for own matches", "appeal own disputes"]
    shared_operations: ["read own registration", "read tournaments", "read matches"]
  - name: Player
    description: "A competitor; X-User-ID equals their Player.id"
    identity: entity_backed:Player
    exclusive_operations: ["submit own payout tax docs"]
    shared_operations: ["read own player profile", "read own payout records", "read tournaments"]
  - name: Referee
    description: "Match official; opaque operator id stored on matches for SoD checks"
    identity: opaque
    exclusive_operations: ["officiate matches", "report results", "confirm results"]
    shared_operations: ["read matches", "read servers"]
  - name: AntiCheatInvestigator
    description: "Integrity officer; SoD-barred from resolving cases on matches they refereed"
    identity: opaque
    exclusive_operations: ["open integrity cases", "resolve integrity cases"]
    shared_operations: ["read players", "read matches", "read integrity cases"]
  - name: BroadcastProducer
    description: "Broadcast production owner; manages talent and bookings"
    identity: opaque
    exclusive_operations: ["create talent", "create bookings", "transition bookings"]
    shared_operations: ["read bookings", "read tournaments"]
  - name: PayoutOfficer
    description: "Finance operator; computes, verifies, approves, and pays prize records; SoD-barred from approving docs they verified"
    identity: opaque
    exclusive_operations: ["compute payout runs", "verify tax docs", "approve payouts", "pay payouts"]
    shared_operations: ["read payout records", "read registrations", "read players", "read tournaments"]
  - name: SponsorManager
    description: "Sponsor contact; activates deals where contact_user_id == X-User-ID"
    identity: opaque
    exclusive_operations: ["activate own sponsor deals"]
    shared_operations: ["read sponsor deals", "read tournaments"]
