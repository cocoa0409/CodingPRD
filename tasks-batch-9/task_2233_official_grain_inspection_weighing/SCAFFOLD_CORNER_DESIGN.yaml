        excluded_because:
          difficulty_instance: dual_variant_calc / weighing_per_draft_vs_aggregate_dockage_rounding_variance
          rationale: "That instance pins every computed weighing field (dockage_lbs, net_lbs, provisional_net_lbs, rounding_variance_lbs, net_bushels) as literals from a fixed six-draft body."

      - name: certificate_snapshot_fields_are_computed_at_issuance
