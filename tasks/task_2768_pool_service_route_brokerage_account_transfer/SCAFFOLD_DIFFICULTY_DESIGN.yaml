        grounds:
          - "state_machines.Deal.OFFER_SUBMITTED_to_COUNTERED"
          - "state_machines.Deal.COUNTERED_to_OFFER_SUBMITTED"
          - "entities.Deal.fields.offer_round"
          - "entities.Deal.fields.current_offer_price_cents"
          - "validations[priority=54]"
          - "endpoints[POST /deals/{id}/counter-offers]"
          - "endpoints[POST /deals/{id}/offers]"
        distinguishing_aspect: "Cyclic shape on Deal.status: OFFER_SUBMITTED -> COUNTERED -> OFFER_SUBMITTED is a true 2-cycle whose only monotone witness is offer_round (1 -> 2 -> 3), and re-entry is gated by the strict-improvement rule so a Seller counter equal to the standing 350000 is refused - the cycle cannot spin on identical prices."
