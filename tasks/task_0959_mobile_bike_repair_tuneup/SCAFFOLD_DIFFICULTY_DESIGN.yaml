          - validations[priority=25]
          - errors[ERR_INVOICE_NOT_ISSUED]
          - errors[ERR_PAYMENT_MISMATCH]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a PAY on a DISPUTED
          invoice with a wrong amount_cents fails BOTH priority-9 (state) and
          priority-25 (fiscal); the state error ERR_INVOICE_NOT_ISSUED wins.
