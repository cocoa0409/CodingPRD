            - { call: "GET /rental-house/units/${u1}", payload: {}, as: HouseAdmin, captures: { u1_mid: $.data.status } }
            - { call: "POST /rental-house/pull-lists/${pl}/cancel", payload: {}, as: WardrobeStaff, captures: { pl_can: $.data.status } }
            - { call: "GET /rental-house/items/${item_id}", payload: {}, as: HouseAdmin, captures: { svc_after: $.data.serviceable_unit_count } }
            - { call: "GET /rental-house/units/${u1}", payload: {}, as: HouseAdmin, captures: { u1_after: $.data.status } }
            - { call: "GET /rental-house/reservations/${r1}", payload: {}, as: HouseAdmin, captures: { r1_after: $.data.status } }
          assert:
            - "serviceable_unit_count == 2 before submit, after submit, and after cancel (invariant held)"
            - "Unit.${u1}.status == AVAILABLE at all three reads (assignment never mutates unit state)"
            - "PullList ends CANCELLED; Reservation.${r1} stayed CONFIRMED throughout (FULFILLED only at dispatch — nothing to roll back)"

      - name: ledger_conserved_across_issue_credit
        grounds:
          - calculations.renter_credit_recompute
          - state_machines.Invoice.ISSUED_to_CREDITED
          - entities.Renter.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = the renter ledger (different quantity than the unit pool):
          outstanding_balance_cents == sum(balance_cents over ISSUED/PARTIALLY_PAID invoices);
          issuing an 8000 invoice moves it 0 -> 8000 and a full credit note returns it to
          exactly 0 with the invoice CREDITED — forward action plus compensating action leave
          the named quantity unchanged.
        test_recipe:
          setup:
            - "RC published; item with 1 unit; renter ACTIVE; long-run production CONFIRMED"
            - "Reservation qty 1 Sep 1-10 CONFIRMED (quote 8000); pull list DISPATCHED at 2026-08-31; invoice generated (total 8000)"
          setup_api_calls:
            - { call: "POST /rental-house/rate-cards", payload: { name: "RC-2026", long_run_threshold_weeks: 8, long_run_discount_pct: 0.20, deep_run_threshold_weeks: 16, deep_run_discount_pct: 0.30, late_fee_daily_pct: 0.10 }, as: HouseAdmin }
            - { call: "POST /rental-house/items", payload: { name: "Tailcoat", period: VICTORIAN, category: COSTUME, size_class: M, alteration_policy: TAILORING_ALLOWED, replacement_value_cents: 100000, base_daily_rate_cents: 1000, base_weekly_rate_cents: 5000 }, as: HouseAdmin, captures: { item_id: $.data.id } }
            - { call: "POST /rental-house/items/${item_id}/units", payload: { barcode: "BC-2101", condition_grade: B, acquisition_date: "2025-01-15", acquisition_cost_cents: 40000 }, as: HouseAdmin }
            - { call: "POST /rental-house/renters", payload: { name: "Renter R", renter_type: THEATRE, credit_limit_cents: 10000000 }, as: HouseAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PR-21", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_r: $.data.id } }
            - { call: "POST /rental-house/insurance-certificates/${cert_r}/decide", payload: { decision: VERIFIED }, as: HouseAdmin }
            - { call: "POST /rental-house/productions", payload: { renter_id: "${r_id}", title: "P", rehearsal_start_date: "2026-08-10", performance_start_date: "2026-09-01", closing_date: "2026-10-26" }, as: RenterContact, as_user_id: "${r_id}", captures: { p_id: $.data.id } }
            - { call: "POST /rental-house/productions/${p_id}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}", captures: { p_v: $.data.version } }
            - { call: "POST /rental-house/reservations", payload: { production_id: "${p_id}", item_id: "${item_id}", quantity: 1, window_start_date: "2026-09-01", window_end_date: "2026-09-10", expected_production_version: "${p_v}" }, as: RenterContact, as_user_id: "${r_id}", captures: { r1: $.data.id } }
            - { call: "POST /rental-house/reservations/${r1}/confirm", payload: {}, as: RenterContact, as_user_id: "${r_id}" }
            - { call: "GET /rental-house/productions/${p_id}", payload: {}, as: HouseAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /rental-house/pull-lists", payload: { production_id: "${p_id}", expected_production_version: "${p_v2}" }, as: RenterContact, as_user_id: "${r_id}", captures: { pl: $.data.id } }
            - { call: "POST /rental-house/pull-lists/${pl}/submit", payload: {}, as: WardrobeStaff }
            - { call: "GET /rental-house/pull-list-lines?pull_list_id=${pl}", payload: {}, as: WardrobeStaff, captures: { l1: "$.data[0].id" } }
            - { call: "POST /rental-house/pull-list-lines/${l1}/pick", payload: {}, as: WardrobeStaff }
            - { call: "POST /rental-house/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: HouseAdmin }
            - { call: "POST /rental-house/pull-lists/${pl}/dispatch", payload: {}, as: WardrobeStaff }
            - { call: "POST /rental-house/invoices/generate", payload: { production_id: "${p_id}" }, as: Accountant, captures: { inv: $.data.id, inv_total: $.data.total_cents } }
            - { call: "GET /rental-house/renters/${r_id}", payload: {}, as: Accountant, captures: { out_before: $.data.outstanding_balance_cents } }
          trigger:
            - { call: "POST /rental-house/invoices/${inv}/issue", payload: {}, as: Accountant, captures: { inv_issued: $.data.status } }
            - { call: "GET /rental-house/renters/${r_id}", payload: {}, as: Accountant, captures: { out_mid: $.data.outstanding_balance_cents } }
            - { call: "POST /rental-house/invoices/${inv}/credit-note", payload: { amount_cents: 8000, reason: "goodwill" }, as: Accountant, captures: { inv_final: $.data.status, inv_bal: $.data.balance_cents } }
            - { call: "GET /rental-house/renters/${r_id}", payload: {}, as: Accountant, captures: { out_after: $.data.outstanding_balance_cents } }
          assert:
            - "Before issue: outstanding_balance_cents == 0"
            - "After issue: Invoice ISSUED, outstanding == 8000"
            - "After full credit note: Invoice.${inv}.status == CREDITED, balance_cents == 0, outstanding == 0 — forward + compensating action conserve the ledger"
