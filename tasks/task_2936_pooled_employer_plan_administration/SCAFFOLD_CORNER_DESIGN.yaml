  - section: errors
    instances:

      - name: corner_unresolvable_path_ids_return_family_specific_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - errors.ERR_FIDUCIARY_ALLOCATION_NOT_FOUND
          - errors.ERR_ADOPTING_EMPLOYER_NOT_FOUND
          - errors.ERR_DESIGN_ELECTION_NOT_FOUND
          - errors.ERR_PAYROLL_BATCH_NOT_FOUND
          - errors.ERR_PLAN_FILING_NOT_FOUND
        distinguishing_aspect: "Each entity family owns its own 404 id, so a single generic ERR_NOT_FOUND is not acceptable: the same well-formed but unknown UUID must produce five different error_ids depending only on which collection the path names, and it does so on an empty database with no rows of any kind."
        test_recipe:
          setup:
            - "Nothing but the logical clock; no rows of any entity exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatorOps
          trigger:
            - call: "GET /pep/fiduciary-role-allocations/11111111-1111-4111-8111-111111111111"
              as: RegulatorOps
              expect_error: ERR_FIDUCIARY_ALLOCATION_NOT_FOUND
            - call: "GET /pep/adopting-employers/11111111-1111-4111-8111-111111111111"
              as: RegulatorOps
              expect_error: ERR_ADOPTING_EMPLOYER_NOT_FOUND
            - call: "GET /pep/plan-design-elections/11111111-1111-4111-8111-111111111111"
              as: RegulatorOps
              expect_error: ERR_DESIGN_ELECTION_NOT_FOUND
            - call: "GET /pep/payroll-batches/11111111-1111-4111-8111-111111111111"
              as: RegulatorOps
              expect_error: ERR_PAYROLL_BATCH_NOT_FOUND
            - call: "GET /pep/plan-filings/11111111-1111-4111-8111-111111111111"
              as: RegulatorOps
              expect_error: ERR_PLAN_FILING_NOT_FOUND
          diagnostic_notes: "RegulatorOps is used throughout because it is an opaque identity with GET rights over every family, so no priority-4 ownership check can pre-empt the priority-5 path resolution."
          assert:
            - "all five responses are HTTP 404 with response_type 'error'"
            - "the five error_ids are exactly ERR_FIDUCIARY_ALLOCATION_NOT_FOUND, ERR_ADOPTING_EMPLOYER_NOT_FOUND, ERR_DESIGN_ELECTION_NOT_FOUND, ERR_PAYROLL_BATCH_NOT_FOUND and ERR_PLAN_FILING_NOT_FOUND, all distinct"
            - "each body carries a non-empty data.message and a meta.api_request_id, so the error envelope is the same shape as the success envelope"

      - name: corner_plan_number_uniqueness_is_scoped_to_the_sponsor_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=53]
          - errors.ERR_DUPLICATE_PLAN_NUMBER
        distinguishing_aspect: "plan_number is unique per sponsoring provider, not globally: the same '001' is refused for the provider that already uses it and accepted for a different provider in the same breath, so a global unique index would fail the second half of the test."
        test_recipe:
          setup:
            - "Two providers; the first already sponsors plan_number 001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
