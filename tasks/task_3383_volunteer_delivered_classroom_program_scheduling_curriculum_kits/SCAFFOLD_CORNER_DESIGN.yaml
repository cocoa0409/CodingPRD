  - section: rbac
    instances:
      - name: corner_program_coordinator_kit_transition_forbidden
        claim_type: RBAC exclusive_operations denial
        grounds:
          - roles.ProgramCoordinator
          - roles.LogisticsCoordinator
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Kit stock transitions are exclusive to LogisticsCoordinator: a ProgramCoordinator (who may reserve kits via deliveries) cannot ASSEMBLE — 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Office; program JA-BIZ; inventory row exists."
          setup_api_calls:
            - *clk
            - *office
            - *prog4
            - *inv4
          trigger:
            - call: "POST /ja-programs/kit-inventories/${inv4_id}/transition"
              payload: { action: "ASSEMBLE", quantity: 10 }
              as: ProgramCoordinator
              captures: { err: $.data }
          assert:
            - "the response status is 403 and data.error_id == ERR_FORBIDDEN"
            - "KitInventory.${inv4_id}.assembled_count remains 0"

      - name: corner_logistics_create_delivery_forbidden
        claim_type: RBAC exclusive_operations denial
        grounds:
          - roles.LogisticsCoordinator
          - roles.ProgramCoordinator
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Delivery creation is exclusive to ProgramCoordinator: a LogisticsCoordinator with a fully valid body is rejected 403 ERR_FORBIDDEN before any business rule runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain through an ACTIVE agreement with eligible vol1."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
          trigger:
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room AO", teacher_email: "tao@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: LogisticsCoordinator
              captures: { err: $.data }
          assert:
            - "the response status is 403 and data.error_id == ERR_FORBIDDEN"
            - "the agreement version is unchanged (no delivery created): GET /ja-programs/partnership-agreements/${agr_id} shows version == ${agr_v}"

      - name: corner_evaluation_read_forbidden_for_program_coordinator
        claim_type: RBAC exclusive_operations denial
        grounds:
          - endpoints.GET_/ja-programs/partnership-agreements/{agreement_id}/evaluation
          - roles.Funder
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "The funder-facing evaluation read is restricted to AreaDirector, PartnershipManager, and Funder: ProgramCoordinator — despite owning deliveries — is denied 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain through an ACTIVE agreement."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
          trigger:
            - call: "GET /ja-programs/partnership-agreements/${agr_id}/evaluation"
              payload: { variant: "PROVISIONAL" }
              as: ProgramCoordinator
              captures: { err: $.data }
            - call: "GET /ja-programs/partnership-agreements/${agr_id}/evaluation"
              payload: { variant: "PROVISIONAL" }
              as: Funder
              captures: { ok: $.data }
          assert:
            - "ProgramCoordinator: 403 ERR_FORBIDDEN"
            - "Funder: 200 with variant == PROVISIONAL and agreement_id == ${agr_id} (read allowed)"

  - section: cross_cutting_layers
    instances:
      - name: corner_delivery_create_stale_agreement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[delivery-create-stale-agreement]
          - errors.ERR_STALE_AGREEMENT_VERSION
        distinguishing_aspect: "OCC on the agreement: after a first delivery create advances agreement.version, a second create carrying the previously observed version is rejected 412 ERR_STALE_AGREEMENT_VERSION — the loser's terms snapshot would be stale."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain through an ACTIVE agreement (version captured as ${agr_v} at ACTIVATE) with eligible vol1."
            - "Delivery d1 already created with expected_agreement_version == ${agr_v} (success; agreement version advanced)."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room AP", teacher_email: "tap@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room AQ", teacher_email: "taq@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { err: $.data }
          assert:
            - "the response status is 412 and data.error_id == ERR_STALE_AGREEMENT_VERSION (the captured ${agr_v} is now stale)"
            - "GET /ja-programs/deliveries?agreement_id=${agr_id} returns exactly 1 row (d1 only)"

      - name: corner_substitute_stale_delivery_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[session-substitute-stale-delivery]
          - errors.ERR_STALE_DELIVERY_VERSION
        distinguishing_aspect: "OCC on the delivery: after CONFIRM_TEACHER advances delivery.version, a SUBSTITUTE carrying the previously observed delivery version is rejected 412 ERR_STALE_DELIVERY_VERSION, and the session keeps its original volunteer."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Full base chain plus partner2 with eligible vol2; program JA-BIZ; agreement ACTIVE."
            - "Delivery (lead vol1, enrolled 10) PLANNED with session s1 (vol1, 2026-09-08) SCHEDULED; delivery version captured as ${del_v}."
          setup_api_calls:
            - *clk
            - *office
            - *dist
            - *dist_act
            - *school
            - *partner1
            - *partner1_act
            - *vol1
            - *vol1_clear
            - *vol1_begin
            - *vol1_complete
            - *partner2
            - *partner2_act
            - *vol2
            - *vol2_clear
            - *vol2_begin
            - *vol2_complete
            - *prog4
            - *agr4
            - *agr4_propose
            - *agr4_activate
            - call: "POST /ja-programs/deliveries"
              payload: { agreement_id: "${agr_id}", lead_volunteer_id: "${vol1_id}", classroom_label: "Room AR", teacher_email: "tar@rv.example", enrolled_count: 10, expected_agreement_version: "${agr_v}" }
              as: ProgramCoordinator
              captures: { del_id: $.data.id }
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "PLAN" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-08", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /ja-programs/sessions/${s1}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "GET /ja-programs/deliveries/${del_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { del_v: $.data.version }
            - call: "POST /ja-programs/deliveries/${del_id}/transition"
              payload: { action: "CONFIRM_TEACHER" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /ja-programs/sessions/${s1}/substitute"
              payload: { new_volunteer_id: "${vol2_id}", expected_delivery_version: "${del_v}" }
