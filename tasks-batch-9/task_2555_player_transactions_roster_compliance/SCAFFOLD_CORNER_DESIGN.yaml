  # ===========================================================================
  # Endpoints (§1.5)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: team_create_read_list_and_limit_patch_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /teams]
          - endpoints[GET /teams/{id}]
          - endpoints[GET /teams]
          - endpoints[PATCH /teams/{id}/limits]
        distinguishing_aspect: "The four Team surfaces agree on one record: the created club reads back identically, appears once in a filtered COMPLIANT listing, and a partial PATCH changes only injured_reserve_limit while leaving the other three limits and every counter untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Two clubs are registered so the listing has more than one row: Harbor Kings (HKG, waiver rank 1) and Vale Foxes (VLF, waiver rank 2), both with explicit limits 26/4/3/6."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1, active_roster_limit: 26, reserve_roster_limit: 4, injured_reserve_limit: 3, practice_squad_limit: 6 }
              as: LeagueOfficer
              captures: { cd_team_id: $.data.id, cd_created: $.data.created_at, cd_v1: $.data.version }
            - call: "POST /teams"
              payload: { name: "Vale Foxes", market_code: "VLF", salary_cap_limit_cents: 500000000, waiver_priority_rank: 2 }
              as: LeagueOfficer
              captures: { cd_team2_id: $.data.id }
          trigger:
            - call: "GET /teams/${cd_team_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${cd_team_id}"
              captures: { cd_name: $.data.name, cd_code: $.data.market_code, cd_limit: $.data.salary_cap_limit_cents, cd_v_read: $.data.version }
            - call: "GET /teams"
              payload: { compliance_status: "COMPLIANT", limit: 1, offset: 0 }
              as: LeagueOfficer
              captures: { cd_first_id: "$.data[0].id" }
            - call: "PATCH /teams/${cd_team_id}/limits"
              payload: { injured_reserve_limit: 5 }
              as: LeagueOfficer
              captures: { cd_ir_limit: $.data.injured_reserve_limit, cd_active_limit: $.data.active_roster_limit, cd_v2: $.data.version }
          assert:
            - "the captured ${cd_name} == Harbor Kings, ${cd_code} == HKG, ${cd_limit} == 500000000 and ${cd_v_read} == ${cd_v1} == 1"
            - "the captured ${cd_created} == 2026-08-10T14:00:00Z"
            - "the list response carries total_count == 2, has_more == true and exactly one element, and ${cd_first_id} is one of ${cd_team_id} / ${cd_team2_id}"
            - "the captured ${cd_ir_limit} == 5 while ${cd_active_limit} == 26 — reserve_roster_limit stays 4 and practice_squad_limit stays 6"
            - "the captured ${cd_v2} == 2 and Team.${cd_team_id}.active_roster_count == 0 with cap_space_cents == 500000000"

      - name: earning_a_performance_bonus_raises_only_the_final_variant
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /bonus-allocations/{id}/earn]
          - state_machines.BonusAllocation.SCHEDULED_to_EARNED
          - calculations.team_cap_commitment
        distinguishing_aspect: "The earn action is admissible only while the parent Contract is ACTIVE, and its effect is asymmetric: a PERFORMANCE_NLTBE row moves FINAL from 83333333 to 90333333 while PROVISIONAL — which never counted it — stays at 83333333."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Harbor Kings (cap 500000000) with Ray Alder on an APPROVED 3-year / base 80000000 / bonus 10000000 deal carrying performance_nltbe_cents 7000000."
            - "The contract therefore has four BonusAllocation rows in order: SIGNING_PRORATION 2026 3333333, 2027 3333333, 2028 3333334, then PERFORMANCE_NLTBE 7000000 at index 3, all SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { ae_team_id: $.data.id, ae_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { ae_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${ae_team_id}", player_id: "${ae_p_id}", transaction_type: "SIGNING", expected_team_version: "${ae_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026, performance_nltbe_cents: 7000000 }
              as: TeamCapAnalyst
              as_user_id: "${ae_team_id}"
              captures: { ae_txn_id: $.data.id, ae_c_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${ae_p_id}", team_id: "${ae_team_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${ae_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${ae_team_id}"
              captures: { ae_ex_id: $.data.id }
            - call: "POST /physical-exams/${ae_ex_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${ae_team_id}"
            - call: "POST /transactions/${ae_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${ae_team_id}"
            - call: "POST /transactions/${ae_txn_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "GET /contracts/${ae_c_id}/bonus-allocations"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${ae_team_id}"
              captures: { ae_nltbe_id: "$.data[3].id", ae_nltbe_type: "$.data[3].bonus_type", ae_nltbe_prov: "$.data[3].counts_against_provisional" }
            - call: "GET /teams/${ae_team_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${ae_team_id}"
              captures: { ae_prov_before: $.data.provisional_cap_committed_cents, ae_final_before: $.data.final_cap_committed_cents }
          trigger:
            - call: "POST /bonus-allocations/${ae_nltbe_id}/earn"
              payload: {}
              as: LeagueOfficer
              captures: { ae_status: $.data.allocation_status, ae_earned_at: $.data.earned_at, ae_amount: $.data.amount_cents }
            - call: "GET /teams/${ae_team_id}/cap-ledger"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${ae_team_id}"
              captures: { ae_prov_after: $.data.provisional_cap_committed_cents, ae_final_after: $.data.final_cap_committed_cents, ae_space_after: $.data.cap_space_cents }
          assert:
            - "the captured ${ae_nltbe_type} == PERFORMANCE_NLTBE with ${ae_nltbe_prov} == false"
            - "the captured ${ae_prov_before} == 83333333 and ${ae_final_before} == 83333333"
            - "HTTP 200 with the captured ${ae_status} == EARNED, ${ae_amount} == 7000000, ${ae_earned_at} == 2026-08-10T14:00:00Z"
            - "the captured ${ae_prov_after} == 83333333 — unchanged, because PERFORMANCE_NLTBE never enters the PROVISIONAL variant"
            - "the captured ${ae_final_after} == 90333333 and ${ae_space_after} == 416666667 (cap space tracks PROVISIONAL, not FINAL)"
            - "the three SIGNING_PRORATION rows are still SCHEDULED and BonusAllocation.${ae_nltbe_id}.season_year == 2026"

