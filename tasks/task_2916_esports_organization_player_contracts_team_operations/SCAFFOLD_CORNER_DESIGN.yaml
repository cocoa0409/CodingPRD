          difficulty_instance: non_linear_state_machine / contract_offer_negotiation_cycle_round_cap_and_terminal_lockdown
          rationale: "That §1.8 instance walks counter -> revise -> counter to the round cap, asserts ERR_NEGOTIATION_ROUNDS_EXHAUSTED, then declines and shows the DECLINED terminal state refusing a further counter with ERR_OFFER_NOT_OPEN."

      - name: player_contract_parallel_dimensions_move_independently
        claim_type: Valid Transition
        grounds:
          - state_machines.PlayerContract.ACTIVE_to_SUSPENDED
          - state_machines.PlayerContract.COMPLIANT_to_WARNED
          - state_machines.PlayerContract.WARNED_to_BREACH
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / player_contract_parallel_dimensions_suspension_versus_obligation_escalation
          rationale: "That §1.8 instance drives contract_status and obligation_status independently, proves obligation_status never de-escalates, and ends on ERR_CONTRACT_NOT_ACTIVE from the suspended dimension."

      - name: contract_termination_cascade_voids_deliverables_and_reverts_the_deal
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlayerContract.ACTIVE_to_TERMINATED
          - state_machines.DeliverableAssignment.APPROVED_to_VOIDED
          - state_machines.SponsorshipDeal.FULFILLED_to_ACTIVE
        excluded_because:
          difficulty_instance: transitive_cascade / release_execution_terminates_contract_voids_deliverable_and_reverts_fulfilled_deal
          rationale: "That §1.8 instance asserts all four cascade links of the RELEASE execution, including the VOIDED deliverable and the FULFILLED -> ACTIVE deal reversion."

      - name: suspension_cascade_cancels_future_scheduled_blocks
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PlayerContract.ACTIVE_to_SUSPENDED
          - state_machines.PracticeBlock.SCHEDULED_to_CANCELLED
          - entities.PracticeBlock.fields.cancel_reason
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / practice_block_creation_depends_on_player_contract_contract_status
          rationale: "That §1.8 instance asserts the suspended player's future SCHEDULED block flipping to CANCELLED with cancel_reason CONTRACT_SUSPENDED, plus the follow-up booking refusal."

  # ===========================================================================
  - section: calculations
    instances:

      - name: cancelled_blocks_leave_the_weekly_total_and_free_the_room_slot
        claim_type: Input Set Filtering
        grounds:
          - calculations.weekly_hour_cap
          - calculations.facility_slot_conflict
          - endpoints[POST /practice-blocks/{id}/cancel]
          - endpoints[GET /contracts/{id}/obligation-summary]
          - endpoints[GET /practice-blocks]
        distinguishing_aspect: |
          Both calculations filter on block_status IN {SCHEDULED, HELD}. Cancelling the 180-minute
          evening block drops scheduled_minutes_this_week from 420 to 240 and lets an identical
          20:00-23:00 block be booked into the room that the cancelled block used to occupy — a
          creation that would have been refused with ERR_FACILITY_SLOT_CONFLICT one call earlier.
        test_recipe:
          setup:
            - "One league with adult_max_weekly_minutes 2700, one organization, one team house with default turnaround_buffer_minutes 60"
            - "One adult player signed on a 12500000-cent contract effective 2026-08-05"
            - "Two SCHEDULED blocks in the week of Monday 2026-08-10: A 10:00-14:00 (240 min) and B 20:00-23:00 (180 min)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, adult_max_weekly_minutes: 2700 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
