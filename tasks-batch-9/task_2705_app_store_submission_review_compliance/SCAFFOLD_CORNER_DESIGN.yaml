            - "CommerceItem.${item_id}.status == APPROVED"
            - "AppRecord.${app_id}.distribution_state == ROLLED_BACK"

      - name: approving_a_build_while_a_commerce_item_is_still_submitted_is_refused
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_75_commerce_gate
          - errors.ERR_INVALID_COMMERCE_ITEM_STATE
        distinguishing_aspect: "The reviewer's APPROVE decision on the build is blocked by an unrelated child row: with one CommerceItem still SUBMITTED the call returns 409 ERR_INVALID_COMMERCE_ITEM_STATE and the build stays IN_REVIEW."
        test_recipe:
          setup:
            - "Build 100 is IN_REVIEW; the app also has one SUBMITTED CommerceItem awaiting commerce review."
          setup_api_calls: *CH_REVIEW
          trigger:
            - *c_item
            - call: "POST /commerce-items/${item_id}/submit"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "POST /submissions/${sub_id}/decision"
              payload: { outcome: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "rev-01"
          assert:
            - "the third call returns 409 with error.error_id == ERR_INVALID_COMMERCE_ITEM_STATE"
            - "Submission.${sub_id}.state == IN_REVIEW"
            - "CommerceItem.${item_id}.status == SUBMITTED"
      - name: an_in_scope_major_finding_moves_the_provisional_score_but_not_the_null_final_score
        claim_type: Cross-entity
        grounds:
          - endpoints.POST_/behavior-findings.side_effects
          - calculations.disclosure_accuracy_score.variants.SELF_REVIEW_PROVISIONAL
          - state_machines.BehaviorFinding.initial_state
        distinguishing_aspect: "Because the build is only PRE_REVIEW_PASSED the finding writes exactly one of the two variants: provisional falls from 1.0000 to 0.8000 (100 - 20 MAJOR, divided once) while disclosure_accuracy_score_final stays null."
        test_recipe:
          setup:
            - "Build 100 is PRE_REVIEW_PASSED with declared_privacy_items [] and pre_review_checked_at 2026-08-01T00:00:00Z; provisional score 1.0000, final score null."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.example.net", severity: "MAJOR", scanner_confidence: 0.9000, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
          assert:
            - "the response status is 201 and data.status == OPEN"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 0.8000"
            - "Submission.${sub_id}.disclosure_accuracy_score_final is null"
            - "Submission.${sub_id}.state == PRE_REVIEW_PASSED"

      - name: disputing_the_finding_makes_the_two_disclosure_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - state_machines.BehaviorFinding.transitions.OPEN_to_DISPUTED.side_effects
          - calculations.disclosure_accuracy_score.variants
        distinguishing_aspect: "For one unchanged finding the DISPUTE triage splits the variants: provisional returns to 1.0000 because the SELF_REVIEW_PROVISIONAL scope only counts OPEN rows, while final stays 0.8000 because the REVIEW_FINAL scope counts OPEN and DISPUTED alike."
        test_recipe:
          setup:
            - "Build 100 is IN_REVIEW with one OPEN MAJOR DEVICE_ID finding (confidence 0.9000, detected 2026-08-01T00:00:00Z); both variants read 0.8000."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.example.net", severity: "MAJOR", scanner_confidence: 0.9000, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
            - call: "POST /behavior-findings/${finding_id}/triage"
              payload: { action: "DISPUTE", justification: "The identifier is hashed per-install and is never joined to an account." }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "after the first call Submission.${sub_id}.disclosure_accuracy_score_provisional == 0.8000 and disclosure_accuracy_score_final == 0.8000"
            - "the second call returns 200 with data.status == DISPUTED and data.triaged_at == 2026-08-01T00:00:00Z"
            - "data.triaged_by_user_id == ${acct_id}"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 1.0000"
            - "Submission.${sub_id}.disclosure_accuracy_score_final == 0.8000"

      - name: a_finding_below_the_confidence_floor_is_invisible_to_the_provisional_variant
        claim_type: Variant Selection
        grounds:
          - calculations.disclosure_accuracy_score.constants.PROVISIONAL_CONFIDENCE_FLOOR
          - endpoints.POST_/behavior-findings.side_effects
        distinguishing_aspect: "At scanner_confidence 0.7999 - one ten-thousandth below the 0.8000 floor - the finding is excluded from SELF_REVIEW_PROVISIONAL (score stays 1.0000) yet fully counted by REVIEW_FINAL (0.8000)."
        test_recipe:
          setup:
            - "Build 100 is IN_REVIEW with declared_privacy_items [] and both variants at 1.0000."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "USAGE_DATA", observed_purpose: "ANALYTICS", observed_linked_to_user: false, observed_tracking: false, endpoint_domain: "metrics.example.net", severity: "MAJOR", scanner_confidence: 0.7999, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
          assert:
            - "the response status is 201 and data.status == OPEN"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 1.0000"
            - "Submission.${sub_id}.disclosure_accuracy_score_final == 0.8000"

      - name: reconciling_without_a_matching_declared_tuple_returns_disclosure_still_missing
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.BehaviorFinding.transitions.OPEN_to_RECONCILED.preconditions
          - errors.ERR_DISCLOSURE_STILL_MISSING
        distinguishing_aspect: "RECONCILE is refused with 409 ERR_DISCLOSURE_STILL_MISSING while declared_privacy_items is empty, so the finding cannot be cleared by assertion alone and the final score stays 0.8000."
        test_recipe:
          setup:
            - "Build 100 is IN_REVIEW with declared_privacy_items [] and one OPEN MAJOR DEVICE_ID finding."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.example.net", severity: "MAJOR", scanner_confidence: 0.9000, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
            - call: "POST /behavior-findings/${finding_id}/triage"
              payload: { action: "RECONCILE", justification: "Claiming the label already covers this." }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the second call returns 409 with error.error_id == ERR_DISCLOSURE_STILL_MISSING"
            - "BehaviorFinding.${finding_id}.status == OPEN"
            - "Submission.${sub_id}.disclosure_accuracy_score_final == 0.8000"

      - name: dismissing_a_disputed_finding_restores_both_variants_to_one
        claim_type: Valid Transition
        grounds:
          - state_machines.BehaviorFinding.transitions.DISPUTED_to_DISMISSED
          - calculations.disclosure_accuracy_score
        distinguishing_aspect: "DISMISSED is the only terminal that leaves BOTH penalty scopes, so the previously divergent pair collapses back to provisional 1.0000 and final 1.0000."
        test_recipe:
          setup:
            - "Build 100 is IN_REVIEW with one DISPUTED MAJOR finding; provisional reads 1.0000 and final reads 0.8000."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.example.net", severity: "MAJOR", scanner_confidence: 0.9000, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
            - call: "POST /behavior-findings/${finding_id}/triage"
              payload: { action: "DISPUTE", justification: "The identifier is hashed per-install and is never joined to an account." }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "POST /behavior-findings/${finding_id}/triage"
              payload: { action: "DISMISS", justification: "Scanner attributed a third-party SDK request to the wrong bundle." }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the third call returns 200 with data.status == DISMISSED"
            - "Submission.${sub_id}.disclosure_accuracy_score_provisional == 1.0000"
            - "Submission.${sub_id}.disclosure_accuracy_score_final == 1.0000"

      - name: an_open_critical_finding_freezes_the_app_posture
        claim_type: Ledger sync
        grounds:
          - calculations.compliance_posture.F3
          - endpoints.POST_/behavior-findings.side_effects
        distinguishing_aspect: "A single CRITICAL finding on a build of the app is enough to reach the FROZEN tier: posture_reason_codes becomes exactly [CRITICAL_FINDING_OPEN] even though the index is a perfect 100.00, and the final score is 0.6000."
        test_recipe:
          setup:
            - "Build 100 is IN_REVIEW; the app's index is 100.00 and its posture is OPEN."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "PRECISE_LOCATION", observed_purpose: "THIRD_PARTY_SHARING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "broker.example.net", severity: "CRITICAL", scanner_confidence: 0.9500, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
          assert:
            - "the response status is 201 and data.severity == CRITICAL"
            - "AppRecord.${app_id}.compliance_posture == FROZEN"
            - "AppRecord.${app_id}.posture_reason_codes == [\"CRITICAL_FINDING_OPEN\"]"
            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "Submission.${sub_id}.disclosure_accuracy_score_final == 0.6000"

      - name: disputing_an_already_disputed_finding_returns_invalid_finding_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BehaviorFinding.transitions
          - errors.ERR_INVALID_FINDING_STATE
        distinguishing_aspect: "DISPUTED declares only RECONCILE and DISMISS edges, so a second DISPUTE returns 409 ERR_INVALID_FINDING_STATE and triage_justification keeps its first value."
        test_recipe:
          setup:
            - "Build 100 is IN_REVIEW with one DISPUTED MAJOR finding."
          setup_api_calls: *CH_REVIEW
          trigger:
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "DEVICE_ID", observed_purpose: "ADVERTISING", observed_linked_to_user: true, observed_tracking: true, endpoint_domain: "ads.example.net", severity: "MAJOR", scanner_confidence: 0.9000, detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_id: $.data.id }
            - call: "POST /behavior-findings/${finding_id}/triage"
              payload: { action: "DISPUTE", justification: "The identifier is hashed per-install and is never joined to an account." }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "POST /behavior-findings/${finding_id}/triage"
              payload: { action: "DISPUTE", justification: "Second dispute attempt." }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the third call returns 409 with error.error_id == ERR_INVALID_FINDING_STATE"
            - "BehaviorFinding.${finding_id}.status == DISPUTED"
            - "BehaviorFinding.${finding_id}.triage_justification == The identifier is hashed per-install and is never joined to an account."
      - name: completing_metadata_then_listing_leaves_the_distribution_dimension_untouched
        claim_type: parallel
        grounds:
          - state_machines.AppRecord.listing_state.transitions.DRAFT_to_METADATA_COMPLETE
          - state_machines.AppRecord.listing_state.transitions.METADATA_COMPLETE_to_LISTED
          - endpoints.PATCH_/app-records/{id}/listing.side_effects
        distinguishing_aspect: "Two PATCH calls walk listing_state DRAFT -> METADATA_COMPLETE -> LISTED while distribution_state stays PHASED_ROLLOUT with released_share_pct 1.00 and held_back_share_pct 99.00 and live_submission_id unchanged - the two dimensions never touch."
        test_recipe:
          setup:
            - "Northwind Wallet has an APPROVED build 100 with a complete primary en-US locale and a PHASE_ACTIVE plan at phase 0; listing_state is DRAFT."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "COMPLETE_METADATA" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "LIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.listing_state == METADATA_COMPLETE"
            - "the second call returns 200 with data.listing_state == LISTED"
            - "data.distribution_state == PHASED_ROLLOUT"
            - "data.released_share_pct == 1.00 and data.held_back_share_pct == 99.00"
            - "data.live_submission_id == ${sub_id}"
            - "RolloutPlan.${plan_id}.state == PHASE_ACTIVE and RolloutPlan.${plan_id}.phase_index == 0"

      - name: listing_before_any_distribution_returns_app_not_distributed
        claim_type: guarded transitions
        grounds:
          - state_machines.AppRecord.listing_state.transitions.METADATA_COMPLETE_to_LISTED.preconditions
          - errors.ERR_APP_NOT_DISTRIBUTED
        distinguishing_aspect: "The store page is gated on the OTHER dimension: with an APPROVED build but distribution_state still NOT_DISTRIBUTED the LIST action returns 409 ERR_APP_NOT_DISTRIBUTED and listing_state remains METADATA_COMPLETE."
        test_recipe:
          setup:
            - "Build 100 is APPROVED with a complete primary locale but no rollout plan has started; distribution_state is NOT_DISTRIBUTED."
          setup_api_calls: *CH_APPROVED
          trigger:
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "COMPLETE_METADATA" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "LIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.listing_state == METADATA_COMPLETE"
            - "the second call returns 409 with error.error_id == ERR_APP_NOT_DISTRIBUTED"
            - "AppRecord.${app_id}.listing_state == METADATA_COMPLETE"
            - "AppRecord.${app_id}.distribution_state == NOT_DISTRIBUTED"

      - name: completing_metadata_with_no_locale_at_all_returns_metadata_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AppRecord.listing_state.transitions.DRAFT_to_METADATA_COMPLETE.preconditions
          - errors.ERR_METADATA_INCOMPLETE
        distinguishing_aspect: "With a DRAFT build that owns no MetadataLocale row the COMPLETE_METADATA action is 409 ERR_METADATA_INCOMPLETE and listing_state stays DRAFT."
        test_recipe:
          setup:
            - "Build 100 exists in DRAFT and no MetadataLocale has been created for it."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "COMPLETE_METADATA" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 409 and error.error_id == ERR_METADATA_INCOMPLETE"
            - "AppRecord.${app_id}.listing_state == DRAFT"

      - name: delisting_the_store_page_keeps_the_rollout_running
        claim_type: parallel
        grounds:
          - state_machines.AppRecord.listing_state.transitions.LISTED_to_DELISTED.side_effects
          - state_machines.RolloutPlan.states.PHASE_ACTIVE
        distinguishing_aspect: "DELIST is deliberately one-dimensional: the page goes DELISTED while the plan stays PHASE_ACTIVE at phase 0 and the conserved share pair remains 1.00 / 99.00, so an advance is still legal afterwards."
        test_recipe:
          setup:
            - "Northwind Wallet is LISTED with a PHASE_ACTIVE plan at phase 0."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "COMPLETE_METADATA" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "LIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "DELIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the third call returns 200 with data.listing_state == DELISTED"
            - "data.distribution_state == PHASED_ROLLOUT"
            - "data.released_share_pct == 1.00 and data.held_back_share_pct == 99.00"
            - "RolloutPlan.${plan_id}.state == PHASE_ACTIVE"

      - name: returning_a_delisted_app_to_draft_while_a_plan_is_live_returns_invalid_rollout_state
        claim_type: guarded transitions
        grounds:
          - state_machines.AppRecord.listing_state.transitions.DELISTED_to_DRAFT.preconditions
          - errors.ERR_INVALID_ROLLOUT_STATE
        distinguishing_aspect: "RETURN_TO_DRAFT is the one listing action that reads the distribution dimension: a PHASE_ACTIVE plan makes it 409 ERR_INVALID_ROLLOUT_STATE, so the app is stuck in DELISTED until the plan terminates."
        test_recipe:
          setup:
            - "Northwind Wallet is DELISTED while its plan is still PHASE_ACTIVE at phase 0."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "COMPLETE_METADATA" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "LIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "DELIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "RETURN_TO_DRAFT" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the fourth call returns 409 with error.error_id == ERR_INVALID_ROLLOUT_STATE"
            - "AppRecord.${app_id}.listing_state == DELISTED"
            - "RolloutPlan.${plan_id}.state == PHASE_ACTIVE"

      - name: delisting_straight_from_draft_returns_invalid_listing_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AppRecord.listing_state.transitions
          - errors.ERR_INVALID_LISTING_STATE
        distinguishing_aspect: "DRAFT declares only COMPLETE_METADATA, so DELIST from DRAFT is 409 ERR_INVALID_LISTING_STATE - the listing dimension is not a free-for-all even for the owner."
        test_recipe:
          setup:
            - "Northwind Wallet is in listing_state DRAFT with a PHASE_ACTIVE rollout."
          setup_api_calls: *CH_ACTIVE
          trigger:
            - call: "PATCH /app-records/${app_id}/listing"
              payload: { listing_action: "DELIST" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 409 and error.error_id == ERR_INVALID_LISTING_STATE"
            - "AppRecord.${app_id}.listing_state == DRAFT"

      - name: resuming_a_paused_rollout_while_the_posture_is_restricted_returns_compliance_restricted
        claim_type: guarded transitions
        grounds:
          - state_machines.RolloutPlan.transitions.PAUSED_to_PHASE_ACTIVE.preconditions
          - state_machines.AppRecord.distribution_state.transitions.PAUSED_to_PHASED_ROLLOUT.preconditions
          - errors.ERR_APP_COMPLIANCE_RESTRICTED
        distinguishing_aspect: "RESUME demands posture OPEN, not merely not-FROZEN: after a rejection cascade left the app RESTRICTED the hold action=RESUME returns 409 ERR_APP_COMPLIANCE_RESTRICTED and both the plan and the distribution dimension stay PAUSED."
        test_recipe:
          setup:
            - "Build 100 is APPROVED with a SCHEDULED plan and build 101 is IN_REVIEW; the plan is started, then build 101 is rejected, whose cascade pauses the plan and drives posture to RESTRICTED with the index at 0.00."
          setup_api_calls: *CH_PLAN
          trigger:
            - call: "POST /rollout-plans/${plan_id}/start"
              payload: {}
              as: ReleaseManager
              as_user_id: "${acct_id}"
            - call: "POST /submissions/${sub2_id}/decision"
              payload: { outcome: "REJECT", rejection_reasons: [{ guideline_rule_id: "${rule_id}", reason_code: "PRIVACY_LABEL_MISMATCH", severity: "CRITICAL", detail: "The privacy label omits the observed advertising purpose." }] }
              as: PlatformReviewer
              as_user_id: "rev-01"
            - call: "POST /rollout-plans/${plan_id}/hold"
              payload: { action: "RESUME" }
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the third call returns 409 with error.error_id == ERR_APP_COMPLIANCE_RESTRICTED"
            - "RolloutPlan.${plan_id}.state == PAUSED and RolloutPlan.${plan_id}.pause_reason_code == POSTURE_DEGRADED"
            - "AppRecord.${app_id}.distribution_state == PAUSED"
            - "AppRecord.${app_id}.compliance_posture == RESTRICTED"
      - name: the_clock_sweep_walks_a_credential_from_active_through_expiring_soon_to_expired
        claim_type: Idempotency
        grounds:
          - state_machines.SigningCredential.transitions.ACTIVE_to_EXPIRING_SOON
          - state_machines.SigningCredential.transitions.EXPIRING_SOON_to_EXPIRED
          - global_constants.CREDENTIAL_EXPIRY_WARNING_HOURS
        distinguishing_aspect: "The warning boundary is inclusive at exactly not_after - 168h (2027-06-24T00:00:00Z) and the expiry boundary is half-open at not_after itself; a repeat clock call at the same instant reports credentials_warned_count 0 because the row has already moved."
        test_recipe:
          setup:
            - "Northwind account with one ACTIVE IOS DISTRIBUTION_CERT valid 2026-07-01T00:00:00Z..2027-07-01T00:00:00Z; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-24T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-24T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the first call returns 200 with data.credentials_warned_count == 1 and data.credentials_expired_count == 0"
            - "after the first call SigningCredential.${cert_id}.status == EXPIRING_SOON"
            - "the second call returns 200 with data.credentials_warned_count == 0"
            - "the third call returns 200 with data.credentials_expired_count == 1"
            - "SigningCredential.${cert_id}.status == EXPIRED"

      - name: setting_the_clock_backwards_returns_clock_not_monotonic
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/_clock/set_current_utc.side_effects
          - errors.ERR_CLOCK_NOT_MONOTONIC
        distinguishing_aspect: "The logical clock only ever moves forward: 2026-07-31T23:59:59Z is rejected with 409 ERR_CLOCK_NOT_MONOTONIC while the stored clock stays at the mandatory default 2026-08-01T00:00:00Z and no sweep runs."
        test_recipe:
          setup:
            - "Nothing but the mandatory default clock of 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T23:59:59Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          assert:
            - "the response status is 409 and error.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "a following POST /_clock/set_current_utc with 2026-08-01T00:00:00Z returns 200 with data.current_utc == 2026-08-01T00:00:00Z"

      - name: membership_lapses_only_strictly_past_paid_through_and_renewal_reverses_it
            
        claim_type: Compensation
        grounds:
          - entities.PublisherAccount.fields.program_status
          - endpoints.POST_/publisher-accounts/{id}/membership-renewal.side_effects
          - calculations.compliance_posture.R1
        distinguishing_aspect: "At exactly membership_paid_through_at the account is still ACTIVE (strict less-than) and one second later it is EXPIRED with posture RESTRICTED / [MEMBERSHIP_EXPIRED]; the renewal restores ACTIVE and clears the reason code in the same call."
        test_recipe:
          setup:
            - "Northwind account paid through 2026-09-01T00:00:00Z with an ACTIVE cert and one PASSED mapping, so posture is OPEN and the index is 100.00."
          setup_api_calls:
            - *c_clock
            - &c_acct_short
              call: "POST /publisher-accounts"
              payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2026-09-01T00:00:00Z", commerce_program_tier: "STANDARD" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_app
            - *c_rule
            - *c_rule_pub
            - *c_map
            - *c_map_start
            - *c_map_pass
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:01Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "GET /publisher-accounts/${acct_id}"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
              captures: { acct_v_now: $.data.version }
            - call: "POST /publisher-accounts/${acct_id}/membership-renewal"
              payload: { expected_publisher_account_version: "${acct_v_now}", paid_through_at: "2027-09-01T00:00:00Z" }
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.accounts_expired_count == 0 and PublisherAccount.${acct_id}.program_status == ACTIVE"
            - "the second call returns 200 with data.accounts_expired_count == 1"
            - "after the second call PublisherAccount.${acct_id}.program_status == EXPIRED and AppRecord.${app_id}.posture_reason_codes == [\"MEMBERSHIP_EXPIRED\"]"
            - "the fourth call returns 200 with data.program_status == ACTIVE and data.membership_paid_through_at == 2027-09-01T00:00:00Z"
            - "AppRecord.${app_id}.compliance_posture == OPEN and AppRecord.${app_id}.posture_reason_codes == []"

      - name: closing_the_only_open_window_makes_the_next_queue_call_capacity_starved
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/review-capacity-windows/{id}/close.side_effects
          - calculations.review_capacity_allocation
          - errors.ERR_NO_REVIEW_CAPACITY
        distinguishing_aspect: "A CLOSED window leaves the queue-entry eligibility filter even though it still has 5 free slots, so the candidate set is empty and the queue call is 409 ERR_NO_REVIEW_CAPACITY with the build left in PRE_REVIEW_PASSED and no slot moved."
        test_recipe:
          setup:
            - "Build 100 is PRE_REVIEW_PASSED and the only IOS/POOL_A window (capacity 5, all free) is then closed."
          setup_api_calls: *CH_PRP
          trigger:
            - call: "POST /review-capacity-windows/${win_id}/close"
              payload: {}
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - call: "POST /submissions/${sub_id}/queue"
              payload: {}
              as: ReleaseManager
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.status == CLOSED and data.slots_available == 5"
            - "the second call returns 409 with error.error_id == ERR_NO_REVIEW_CAPACITY"
            - "Submission.${sub_id}.state == PRE_REVIEW_PASSED and Submission.${sub_id}.review_window_id is null"
            - "ReviewWindow.${win_id}.slots_reserved == 0 and ReviewWindow.${win_id}.slots_available == 5"

  # =========================================================================
  # §1.3 Calculations — thirteen rules, their boundaries, their pinned
  # rounding order and the two dual-variant families.
  # =========================================================================
  - section: calculations
    instances:
      - name: an_app_with_no_feature_mappings_scores_zero_not_one_hundred
        claim_type: Correct Result
        grounds:
          - calculations.feature_compliance_index.formula
          - calculations.compliance_posture.R3
        distinguishing_aspect: "The empty input set is pinned to 0.00 rather than a vacuous 100.00, so a brand-new app with an ACTIVE cert and no objections is still RESTRICTED with posture_reason_codes exactly [COMPLIANCE_INDEX_BELOW_FLOOR]."
        test_recipe:
          setup:
            - "Northwind Wallet exists with an ACTIVE IOS DISTRIBUTION_CERT, three EFFECTIVE rules (SAFETY 1.1.4, PRIVACY 5.1.1, DESIGN 4.0.1) and no FeatureMapping rows at all."
          setup_api_calls: &CH_IDX_BASE
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_app
            - *c_rule_safety
            - *c_rule_safety_pub
            - *c_rule
            - *c_rule_pub
            - &c_rule_design
              call: "POST /guideline-rules"
              payload: { rule_code: "4.0.1", title: "Icon And Screenshot Quality", category: "DESIGN", version_label: "2026.08", effective_from: "2026-07-01T00:00:00Z", requires_feature_mapping: true }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { drule_id: $.data.id }
            - &c_rule_design_pub
              call: "POST /guideline-rules/${drule_id}/publish"
              payload: {}
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
          trigger:
            - call: "GET /app-records/${app_id}"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.feature_compliance_index == 0.00"
            - "data.compliance_posture == RESTRICTED"
            - "data.posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\"]"
            - "GET /feature-mappings?app_record_id=${app_id} returns meta.total_count == 0"

      - name: an_index_of_exactly_ninety_does_not_restrict_the_posture
        claim_type: Constants Applied
        grounds:
          - calculations.feature_compliance_index.formula
          - calculations.compliance_posture.constants.POSTURE_INDEX_FLOOR
        distinguishing_aspect: "Weights 5 (SAFETY PASSED) + 4 (PRIVACY PASSED) + 1 (DESIGN NOT_STARTED) give 100 * 9 / 10 = exactly 90.00, and because the floor test is strict less-than the posture is OPEN with an empty reason list."
        test_recipe:
          setup:
            - "Three mappings on Northwind Wallet: UGC_REPORTING against SAFETY 1.1.4 PASSED, ACCOUNT_DELETION against PRIVACY 5.1.1 PASSED, APP_ICON against DESIGN 4.0.1 left NOT_STARTED."
          setup_api_calls: &CH_IDX_90
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_app
            - *c_rule_safety
            - *c_rule_safety_pub
            - *c_rule
            - *c_rule_pub
            - *c_rule_design
            - *c_rule_design_pub
            - *c_map_safety
            - *c_map_safety_start
            - &c_map_safety_pass
              call: "POST /feature-mappings/${smap_id}/self-review"
              payload: { outcome: "PASS", evidence_ref: "https://docs.northwind.example/evidence/ugc-reporting" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_map
            - *c_map_start
            - *c_map_pass
            - &c_map_design
              call: "POST /feature-mappings"
              payload: { app_record_id: "${app_id}", guideline_rule_id: "${drule_id}", feature_code: "APP_ICON" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
              captures: { dmap_id: $.data.id }
          trigger:
            - call: "GET /app-records/${app_id}"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.feature_compliance_index == 90.00"
            - "data.compliance_posture == OPEN"
            - "data.posture_reason_codes == []"

      - name: failing_the_design_mapping_leaves_the_index_at_ninety_because_both_factors_are_zero
        claim_type: Input Set Filtering
        grounds:
          - calculations.feature_compliance_index.formula
          - state_machines.FeatureMapping.transitions.IN_PROGRESS_to_FAILED
        distinguishing_aspect: "NOT_STARTED and FAILED share factor 0.0, so starting and failing the DESIGN mapping moves the index not at all - it stays 90.00 - while starting it alone raises it to 92.50 through factor 0.25."
        test_recipe:
          setup:
            - "The 90.00 fixture above: SAFETY PASSED, PRIVACY PASSED, DESIGN NOT_STARTED."
          setup_api_calls: *CH_IDX_90
          trigger:
            - call: "POST /feature-mappings/${dmap_id}/self-review"
              payload: { outcome: "START" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "POST /feature-mappings/${dmap_id}/self-review"
              payload: { outcome: "FAIL" }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "after the first call AppRecord.${app_id}.feature_compliance_index == 92.50"
            - "after the second call AppRecord.${app_id}.feature_compliance_index == 90.00"
            - "FeatureMapping.${dmap_id}.self_review_status == FAILED"
            - "AppRecord.${app_id}.compliance_posture == OPEN"

      - name: the_index_divides_the_unrounded_sums_once_at_the_end
        claim_type: Precision
        grounds:
          - calculations.feature_compliance_index.precision
          - calculations.feature_compliance_index.constants.SEVERITY_WEIGHTS
        distinguishing_aspect: "SAFETY IN_PROGRESS (5 * 0.25 = 1.25) plus PRIVACY PASSED (4 * 1.0) over total 9 is 58.333... which must round once to 58.33; rounding the two per-mapping contributions first would produce 58.34."
        test_recipe:
          setup:
            - "Two mappings only: UGC_REPORTING against SAFETY 1.1.4 in IN_PROGRESS and ACCOUNT_DELETION against PRIVACY 5.1.1 PASSED."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
            - *c_cert_act
            - *c_app
            - *c_rule_safety
            - *c_rule_safety_pub
            - *c_rule
            - *c_rule_pub
            - *c_map_safety
            - *c_map_safety_start
            - *c_map
            - *c_map_start
            - *c_map_pass
          trigger:
            - call: "GET /app-records/${app_id}/compliance-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.feature_compliance_index == 58.33"
            - "data.compliance_posture == RESTRICTED"
            - "data.posture_reason_codes == [\"COMPLIANCE_INDEX_BELOW_FLOOR\"]"

      - name: an_all_zero_questionnaire_derives_band_zero_labelled_violence
        claim_type: Correct Result
        grounds:
          - calculations.derived_age_rating.formula
          - endpoints.PUT_/submissions/{id}/age-rating
        distinguishing_aspect: "With every content dimension at level 0 and every floor flag false, base == 0, floor_age == 0 and the label falls to the FIRST dimension in the declared order whose band equals the base, so derived_age_rating is 0 and age_rating_driving_dimension is VIOLENCE - not FLOOR_RULE and not null."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT with no age rating recorded yet."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 4 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.derived_age_rating == 0"
            - "data.age_rating_driving_dimension == VIOLENCE"
            - "data.attested_age_rating == 4"
            - "data.state == DRAFT"

      - name: simulated_gambling_at_level_two_bumps_the_raw_rating_to_seventeen
        claim_type: Constants Applied
        grounds:
          - calculations.derived_age_rating.formula
          - calculations.derived_age_rating.constants.RATING_BANDS
        distinguishing_aspect: "GAMBLING_SIMULATED level 1 maps through DIM_BAND to 9, but level 2 triggers the extra clause raw = max(raw, 17) instead of DIM_BAND[2] == 12, so the same dimension yields 9 then 17 while the label stays GAMBLING_SIMULATED both times."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT with no age rating recorded yet."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 1, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 17 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 2, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 17 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.derived_age_rating == 9 and data.age_rating_driving_dimension == GAMBLING_SIMULATED"
            - "the second call returns 200 with data.derived_age_rating == 17 and data.age_rating_driving_dimension == GAMBLING_SIMULATED"

      - name: the_first_dimension_in_the_declared_order_wins_the_label_tie
        claim_type: Correct Result
        grounds:
          - calculations.derived_age_rating.formula
        distinguishing_aspect: "VIOLENCE 3 and HORROR 3 both map to band 17, and the tie-break is the fixed DIMENSIONS order rather than alphabetical or insertion order, so age_rating_driving_dimension is VIOLENCE and never HORROR."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT with no age rating recorded yet."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 3, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 3, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 17 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.derived_age_rating == 17"
            - "data.age_rating_driving_dimension == VIOLENCE"

      - name: unmoderated_user_generated_content_raises_the_floor_and_relabels_to_floor_rule
        claim_type: Correct Result
        grounds:
          - calculations.derived_age_rating.formula
        distinguishing_aspect: "user_generated_content true with ugc_moderation_enabled false forces floor_age 17 over a base of 0, so the label becomes FLOOR_RULE; turning moderation on collapses the same questionnaire back to derived 0 labelled VIOLENCE, proving the floor is conditional on the moderation flag."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT with no age rating recorded yet."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: true, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 17 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: true, ugc_moderation_enabled: true, real_money_gambling: false, contests: false }, attested_age_rating: 17 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.derived_age_rating == 17 and data.age_rating_driving_dimension == FLOOR_RULE"
            - "the second call returns 200 with data.derived_age_rating == 0 and data.age_rating_driving_dimension == VIOLENCE"

      - name: real_money_gambling_short_circuits_the_floor_chain_at_eighteen
        claim_type: Correct Result
        grounds:
          - calculations.derived_age_rating.formula
        distinguishing_aspect: "The floor chain is an if/elif, so real_money_gambling true together with contests true and unrestricted_web_access true yields floor_age 18 - the first matching branch - not 17 and not 12, and the label is FLOOR_RULE because 18 > base 0."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT with no age rating recorded yet."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: true, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: true, contests: true }, attested_age_rating: 18 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.derived_age_rating == 18"
            - "data.age_rating_driving_dimension == FLOOR_RULE"

      - name: a_contest_floor_equal_to_the_content_band_keeps_the_content_label
        claim_type: Correct Result
        grounds:
          - calculations.derived_age_rating.formula
        distinguishing_aspect: "contests true gives floor_age 12 and SEXUAL_CONTENT level 2 gives base 12; because the label switches to FLOOR_RULE only when floor_age is strictly greater than base, the equality case keeps age_rating_driving_dimension == SEXUAL_CONTENT."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT with no age rating recorded yet."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 2, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: true }, attested_age_rating: 12 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 200 and data.derived_age_rating == 12"
            - "data.age_rating_driving_dimension == SEXUAL_CONTENT"

      - name: over_attesting_two_bands_above_the_derived_rating_still_queues
        claim_type: Variant Selection
        grounds:
          - calculations.derived_age_rating.variants.ATTESTATION_CHECK
          - validations.priority_55.ERR_AGE_RATING_UNDERSTATED
        distinguishing_aspect: "The ATTESTATION_CHECK variant is one-sided: attesting 17 against a derived 12 is accepted, so the pre-review report carries zero blocking reasons and the build reaches WAITING_FOR_REVIEW with derived_age_rating still 12 (the attestation is never lowered to match)."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT; the questionnaire will declare SEXUAL_CONTENT level 2 (derived 12) with an attestation of 17."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 2, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 17 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_loc
            - *c_priv
            - *c_prc
            - *c_queue
          assert:
            - "the pre-review-check call returns 200 with data.pre_review_passed == true and data.pre_review_blocking_reasons == []"
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW"
            - "Submission.${sub_id}.derived_age_rating == 12 and Submission.${sub_id}.attested_age_rating == 17"

      - name: attesting_exactly_the_derived_band_passes_the_inclusive_boundary
        claim_type: Constants Applied
        grounds:
          - validations.priority_55.ERR_AGE_RATING_UNDERSTATED
          - calculations.derived_age_rating.variants.ATTESTATION_CHECK
        distinguishing_aspect: "The check is attested >= derived, so an attestation of exactly 12 against a derived 12 is accepted rather than refused, and the build queues with zero blocking reasons."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT; the questionnaire will declare SEXUAL_CONTENT level 2 (derived 12) with an attestation of exactly 12."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 0, sexual_content: 2, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 12 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_loc
            - *c_priv
            - *c_prc
            - *c_queue
          assert:
            - "the pre-review-check call returns 200 with data.pre_review_passed == true"
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW"
            - "Submission.${sub_id}.derived_age_rating == 12"

      - name: an_understated_attestation_is_reported_then_refused_at_priority_fifty_five
        claim_type: Priority Ordering
        grounds:
          - validations.priority_55.ERR_AGE_RATING_UNDERSTATED
          - validations.priority_65.ERR_PRE_REVIEW_NOT_PASSED
          - state_machines.Submission.transitions.DRAFT_to_DRAFT_report_mode
        distinguishing_aspect: "Attesting 12 against a derived 17 leaves pre_review_passed false, so two rules are violated at queue entry; priority 55 outranks priority 65 and the response is ERR_AGE_RATING_UNDERSTATED, not ERR_PRE_REVIEW_NOT_PASSED."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT; the questionnaire will declare VIOLENCE level 3 (derived 17) with an attestation of 12."
          setup_api_calls: *CH_DRAFT
          trigger:
            - call: "PUT /submissions/${sub_id}/age-rating"
              payload: { age_rating_answers: { violence: 3, sexual_content: 0, profanity: 0, gambling_simulated: 0, drugs_alcohol: 0, horror: 0, unrestricted_web_access: false, user_generated_content: false, ugc_moderation_enabled: false, real_money_gambling: false, contests: false }, attested_age_rating: 12 }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_loc
            - *c_priv
            - *c_prc
            - *c_queue
          assert:
            - "the pre-review-check call returns 200 with data.pre_review_passed == false and data.pre_review_blocking_reasons == [\"AGE_RATING_UNDERSTATED\"]"
            - "the queue call returns 409 with error.error_id == ERR_AGE_RATING_UNDERSTATED"
            - "Submission.${sub_id}.state == DRAFT and Submission.${sub_id}.queued_at is null"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 0 and slots_available == 5"

      - name: re_recording_the_same_questionnaire_voids_the_attestation_and_blocks_the_queue
        claim_type: Reconciliation
        grounds:
          - state_machines.Submission.transitions.PRE_REVIEW_PASSED_to_DRAFT
          - errors.ERR_PRE_REVIEW_NOT_PASSED
        distinguishing_aspect: "Re-PUTting byte-identical age rating answers is still a content mutation: pre_review_passed drops to false and pre_review_checked_at is nulled even though derived_age_rating is unchanged, so the follow-up queue call is 409 ERR_PRE_REVIEW_NOT_PASSED."
        test_recipe:
          setup:
            - "Submission build 100 in PRE_REVIEW_PASSED with all-zero answers attested at 4 and pre_review_checked_at 2026-08-01T00:00:00Z."
          setup_api_calls: *CH_PRP
          trigger:
            - *c_age
            - *c_queue
          assert:
            - "the first call returns 200 with data.state == DRAFT, data.pre_review_passed == false, data.pre_review_checked_at is null and data.attested_by_user_id is null"
            - "the first call still reports data.derived_age_rating == 0"
            - "the queue call returns 409 with error.error_id == ERR_PRE_REVIEW_NOT_PASSED"
            - "Submission.${sub_id}.review_window_id is null"

      - name: three_over_declared_data_types_pass_self_review_but_fail_the_reviewer_gate
        claim_type: Variant Divergence
        grounds:
          - calculations.disclosure_accuracy_score.variants.SELF_REVIEW_PROVISIONAL
          - calculations.disclosure_accuracy_score.variants.REVIEW_FINAL
          - calculations.disclosure_accuracy_score.constants.OVER_DISCLOSURE_PENALTY
        distinguishing_aspect: "With zero findings the provisional score is 1.0000 because the over-disclosure term is not applied, while the final score is 100 - 2*3 = 94 -> 0.9400, so the same stored data queues successfully and is then refused at APPROVE with ERR_PRIVACY_DISCLOSURE_INACCURATE."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT. The publisher will declare HEALTH, EMAIL and CONTACTS collection while the scanner has recorded no BehaviorFinding at all."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - *c_age
            - call: "PUT /submissions/${sub_id}/privacy-declaration"
              payload: { declared_privacy_items: [{ data_type: "HEALTH", purpose: "APP_FUNCTIONALITY", linked_to_user: true, used_for_tracking: false }, { data_type: "EMAIL", purpose: "APP_FUNCTIONALITY", linked_to_user: true, used_for_tracking: false }, { data_type: "CONTACTS", purpose: "APP_FUNCTIONALITY", linked_to_user: false, used_for_tracking: false }], tracking_consent_prompt_present: false }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - *c_prc
            - *c_queue
            - *c_claim
            - *c_approve
          assert:
            - "the pre-review-check call returns 200 with data.disclosure_accuracy_score_provisional == 1.0000 and data.pre_review_passed == true"
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW"
            - "the claim call returns 200 with data.disclosure_accuracy_score_final == 0.9400"
            - "the decision call returns 409 with error.error_id == ERR_PRIVACY_DISCLOSURE_INACCURATE"
            - "Submission.${sub_id}.state == IN_REVIEW and Submission.${sub_id}.decided_at is null"

      - name: one_undisclosed_minor_finding_lands_exactly_on_the_inclusive_pass_threshold
        claim_type: Constants Applied
        grounds:
          - calculations.disclosure_accuracy_score.constants.SEVERITY_PENALTIES
          - calculations.disclosure_accuracy_score.constants.DISCLOSURE_PASS_THRESHOLD
          - validations.priority_55.ERR_PRIVACY_DISCLOSURE_INACCURATE
        distinguishing_aspect: "A single unmatched MINOR finding costs 5 points, giving 100 - 5 = 95 -> exactly 0.9500 in BOTH variants, and because the pass test is >= the build queues and is approved rather than blocked."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT with an empty privacy declaration and one MINOR USAGE_DATA finding detected 2026-07-31T00:00:00Z at confidence 0.9500."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - *c_age
            - *c_priv
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "USAGE_DATA", observed_purpose: "ANALYTICS", observed_linked_to_user: false, observed_tracking: false, endpoint_domain: "metrics.northwind.example", severity: "MINOR", scanner_confidence: 0.9500, detected_at: "2026-07-31T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { finding_minor_id: $.data.id }
            - *c_prc
            - *c_queue
            - *c_claim
            - *c_approve
          assert:
            - "the pre-review-check call returns 200 with data.disclosure_accuracy_score_provisional == 0.9500 and data.pre_review_blocking_reasons == []"
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW"
            - "the claim call returns 200 with data.disclosure_accuracy_score_final == 0.9500"
            - "the decision call returns 200 with data.state == APPROVED"
            - "BehaviorFinding.${finding_minor_id}.status == OPEN"

      - name: the_over_disclosure_term_turns_a_passing_provisional_score_into_a_failing_final_score
        claim_type: Variant Divergence
        grounds:
          - calculations.disclosure_accuracy_score.formula
          - calculations.disclosure_accuracy_score.variants.REVIEW_FINAL
        distinguishing_aspect: "The same MINOR undisclosed finding plus three declared-but-unobserved data types gives provisional 100 - 5 = 0.9500 (pass) and final 100 - 5 - 6 = 0.8900 (fail), a 0.0600 delta produced purely by the term that only the final variant applies."
        test_recipe:
          setup:
            - "Submission build 100 in DRAFT, one MINOR USAGE_DATA finding detected before the pre-review check, and a privacy label declaring HEALTH, EMAIL and CONTACTS."
          setup_api_calls: *CH_DRAFT
          trigger:
            - *c_loc
            - *c_age
            - call: "PUT /submissions/${sub_id}/privacy-declaration"
              payload: { declared_privacy_items: [{ data_type: "HEALTH", purpose: "APP_FUNCTIONALITY", linked_to_user: true, used_for_tracking: false }, { data_type: "EMAIL", purpose: "APP_FUNCTIONALITY", linked_to_user: true, used_for_tracking: false }, { data_type: "CONTACTS", purpose: "APP_FUNCTIONALITY", linked_to_user: false, used_for_tracking: false }], tracking_consent_prompt_present: false }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
            - call: "POST /behavior-findings"
              payload: { submission_id: "${sub_id}", data_type: "USAGE_DATA", observed_purpose: "ANALYTICS", observed_linked_to_user: false, observed_tracking: false, endpoint_domain: "metrics.northwind.example", severity: "MINOR", scanner_confidence: 0.9000, detected_at: "2026-07-31T00:00:00Z" }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
            - *c_prc
            - *c_queue
            - *c_claim
            - *c_approve
          assert:
            - "the pre-review-check call returns 200 with data.disclosure_accuracy_score_provisional == 0.9500"
            - "the queue call returns 200 with data.state == WAITING_FOR_REVIEW"
            - "the claim call returns 200 with data.disclosure_accuracy_score_final == 0.8900"
            - "the decision call returns 409 with error.error_id == ERR_PRIVACY_DISCLOSURE_INACCURATE"

      - name: a_standard_tier_line_rounds_the_half_cent_up_to_three_hundred_and_two
        claim_type: Precision
        grounds:
          - calculations.commission_settlement_cents.formula
          - calculations.commission_settlement_cents.constants.STANDARD_RATE
          - endpoints.GET_/app-records/{id}/commerce-settlement
        distinguishing_aspect: "A STANDARD-tier account on a 1005-cent consumable owes 1005 * 0.30 = 301.5 cents, which round_half_up turns into 302 (not 301 and not 301.5), and the settlement read reports commission_cents_total 302 with net_cents_total 703."
        test_recipe:
          setup:
            - "Northwind Wallet is FULLY in PHASED_ROLLOUT with an APPROVED CONSUMABLE item 'Coin Pack 100' (price tier 1005) and gross 1005 cents reported for period 2026-Q1."
          setup_api_calls: &CH_ITEM_APPROVED
