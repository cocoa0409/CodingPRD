        as: OpsManager
        captures:
          kb2_id: $.data.id
      - *id004
      - *id007
      - call: POST /training-courses/${kcourse_id}/complete
        payload:
          agent_id: ${kb2_id}
          valid_until: '2027-01-01T00:00:00Z'
        as: KnowledgeManager
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          own_call: $.data.id
      - call: POST /calls/${own_call}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${own_call}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${ka_id}
      - call: POST /calls/${own_call}/transition
        payload:
          to_status: COMPLETED
        as: Agent
        as_user_id: ${ka_id}
      - call: POST /quality-reviews
        payload:
          call_id: ${own_call}
          accuracy_score: 90
          compliance_score: 90
        as: QualityAnalyst
        captures:
          own_rev: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:05:00Z'
        as: Supervisor
        captures:
          own_call2: $.data.id
      - call: POST /calls/${own_call2}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      trigger:
      - call: POST /calls/${own_call2}/transition
        payload:
          to_status: ANSWERED
        as: Agent
        as_user_id: ${ka_id}
        captures:
          own_err1: $.data.error_id
      - call: POST /quality-reviews/${own_rev}/transition
        payload:
          to_status: DISPUTED
        as: Agent
        as_user_id: ${kb2_id}
        captures:
          own_err2: $.data.error_id
      assert:
      - 'answer of a call assigned to ${kb2_id} by ${ka_id}: 403 and own_err1 == ERR_FORBIDDEN'
      - 'dispute of ${ka_id}''s review by ${kb2_id}: 403 and own_err2 == ERR_FORBIDDEN'
      - Call.${own_call2}.status remains ASSIGNED; QualityReview.${own_rev}.status remains SUBMITTED
- section: cross_cutting_layers
  instances:
  - name: occ_happy_path_version_advances
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[service-level-activate-stale-contract]
    - complexity_profile.complexity_layers
    distinguishing_aspect: 'Happy path of the OCC pair: reading the contract, then activating a second service level with the just-observed version
      succeeds (200) and Contract.version increments by exactly 1 per successful guarded write — replaying the same expected version a second
      time fails 412.'
    test_recipe:
      setup:
      - ACTIVE contract; a second DRAFT service level (ABANDON); contract version observed fresh.
      setup_api_calls:
      - *id001
      - *id002
      - call: POST /service-levels
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          metric: ABANDON
          target: 0.05
          cap_pct_of_gross: 0.5
          remedy_fee_cents: 800
          effective_from: '2026-09-01T00:00:00Z'
        as: OpsManager
        captures:
          occ2_sl: $.data.id
      - *id005
      - *id006
      - call: GET /contracts/${kc_id}
        payload: {}
        as: OpsManager
        captures:
          occ2_cv: $.data.version
      trigger:
      - call: POST /service-levels/${occ2_sl}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${occ2_cv}
        as: OpsManager
      - call: POST /service-levels/${occ2_sl}/transition
        payload:
          to_status: EFFECTIVE
          expected_contract_version: ${occ2_cv}
        as: OpsManager
        captures:
          occ2_err: $.data.error_id
      assert:
      - first activation succeeds and Contract.version == ${occ2_cv} + 1
      - ServiceLevel.${occ2_sl}.status == EFFECTIVE
      - 'replay with the same expected version: 412 and occ2_err == ERR_STALE_VERSION'
  - name: pagination_envelope_on_calls
    claim_type: pagination_with_filtering
    grounds:
    - response_envelope.pagination_defaults
    - endpoints.GET_/calls
    distinguishing_aspect: 'Filter + paginate interplay on /calls: 3 calls under a contract (1 WAITING, 1 ASSIGNED, 1 ABANDONED); status filter
      narrows total_count; limit=1 pages walk the filtered set with has_more flipping on the last page; limit above 100 is clamped per the envelope
      defaults.'
    test_recipe:
      setup:
      - ACTIVE contract with three calls in distinct states.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - *id004
      - *id007
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:00:00Z'
        as: Supervisor
        captures:
          pg1: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:01:00Z'
        as: Supervisor
        captures:
          pg2: $.data.id
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-05T09:02:00Z'
        as: Supervisor
        captures:
          pg3: $.data.id
      - call: POST /calls/${pg2}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      - call: POST /calls/${pg3}/transition
        payload:
          to_status: ABANDONED
        as: Supervisor
      trigger:
      - call: GET /calls
        payload:
          contract_id: ${kc_id}
          limit: 1
          offset: 0
        as: Supervisor
      - call: GET /calls
        payload:
          contract_id: ${kc_id}
          status: ABANDONED
        as: Supervisor
      assert:
      - 'page 1: 1 row, total_count == 3, has_more == true'
      - GET /calls?contract_id=${kc_id}&limit=1&offset=2 returns the last row with has_more == false
      - 'status=ABANDONED filter: exactly 1 row (${pg3}), total_count == 1'
      - response carries the four pagination fields limit, offset, total_count, has_more
  - name: cascade_side_effect_chain_full_path
    claim_type: cascading_side_effects
    grounds:
    - complexity_profile.complexity_layers
    - state_machines.KnowledgeArticle.DRAFT_to_PUBLISHED
    distinguishing_aspect: 'Full end-to-end cascade verified beyond §1.8''s depth probe: publish -> certification invalidated -> route fails ->
      retrain via linked course -> certification revalidated -> route succeeds — the chain''s compensation leg restores routability.'
    test_recipe:
      setup:
      - Same fixture as retrain_completion_revalidates_invalidated_certification, extended with a waiting call before publish and the route attempts
        after each leg.
      setup_api_calls:
      - *id001
      - *id002
      - *id005
      - *id006
      - *id003
      - *id004
      - *id007
      - *id008
      - call: POST /calls
        payload:
          contract_id: ${kc_id}
          program_code: MEDICAID
          language_code: en
          enqueued_at: '2026-09-10T08:00:00Z'
        as: Supervisor
        captures:
          cc_call: $.data.id
      - call: POST /knowledge-articles
        payload:
          program_code: MEDICAID
          title: Rule change
          body: body
          effective_at: '2026-09-10T00:00:00Z'
        as: KnowledgeManager
        captures:
          cc_art: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T00:00:00Z'
        as: PlatformAdmin
      - call: POST /knowledge-articles/${cc_art}/transition
        payload:
          to_status: PUBLISHED
        as: KnowledgeManager
      - call: POST /training-courses
        payload:
          program_code: MEDICAID
          knowledge_article_id: ${cc_art}
          required: true
        as: KnowledgeManager
        captures:
          cc_course: $.data.id
      trigger:
      - call: POST /calls/${cc_call}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
        captures:
          cc_err: $.data.error_id
      - call: POST /training-courses/${cc_course}/complete
        payload:
          agent_id: ${ka_id}
          valid_until: '2027-06-01T00:00:00Z'
        as: KnowledgeManager
      - call: POST /calls/${cc_call}/transition
        payload:
          to_status: ASSIGNED
        as: Supervisor
      assert:
      - 'route after publish: 409 and cc_err == ERR_NO_ELIGIBLE_QUEUE'
      - 'route after linked retraining: 200, Call.${cc_call}.assigned_via == PRIMARY, agent_id == ${ka_id}'
      - Call.${cc_call}.route_depth == 1
  - name: threshold_trigger_auto_coach_dedup_window
