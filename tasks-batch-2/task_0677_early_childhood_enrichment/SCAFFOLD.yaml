    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: ["enrollment_id?", "session_id?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: POST
    path: "/enrichment/sessions/{id}/hold"
    description: "Hold the session (HELD branch): records attendance, mints no credits."
    roles: [FrontDeskStaff, StudioAdmin]
    code: 200
    input: [attendance]
    output: ClassSession
    side_effects: ["status -> HELD; AttendanceRecord per ENROLLED enrollment (PRESENT/ABSENT); version +1"]
  - method: POST
    path: "/enrichment/sessions/{id}/cancel"
    description: "Cancel the session (CANCELLED branch): EXCUSED attendance + makeup credit cascade; voids enrollments."
    roles: [FrontDeskStaff, StudioAdmin]
    code: 200
    input: []
    output: ClassSession
    side_effects:
      - "EXCUSED AttendanceRecord per ENROLLED RECURRING enrollment"
      - "one MakeupCredit minted per EXCUSED record; each membership's makeup_credit_balance +1 and version +1"
      - "all ENROLLED/WAITLISTED enrollments -> CANCELLED; enrolled_count -> 0; status -> CANCELLED; version +1"

  # ---- Enrollment ----
  - method: POST
    path: "/enrichment/enrollments"
    description: "Enroll a child in a session (RECURRING or TRIAL). RECURRING at capacity is WAITLISTED; TRIAL at capacity is rejected. OCC on session version."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 201
    input: [child_id, session_id, membership_id, "kind?", "accompanying_adult?", expected_session_version]
    output: Enrollment
    side_effects:
      - "Enrollment created ENROLLED (or WAITLISTED if full and RECURRING) with kind"
      - "if ENROLLED: ClassSession.enrolled_count +1"
      - "if WAITLISTED: assign waitlist_seq = max existing for session + 1"
      - "increments ClassSession.version by 1 on every successful create (ENROLLED or WAITLISTED), so the next stale-version create is rejected"
  - method: GET
    path: "/enrichment/enrollments/{id}"
    description: "Fetch an enrollment."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
