scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: board_create_returns_all_fields
        claim_type: Creation
        grounds: ["entities.Board", "endpoints"]
        distinguishing_aspect: "POST /civic/boards with all required fields returns 201 with status defaulting ACTIVE and version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id", st: "$.data.status", ver: "$.data.version" }
          assert:
            - "Board.${b1}.status == ACTIVE"
            - "Board.${b1}.version == 1"
            - "Board.${b1}.max_holdover_days == 90"

      - name: get_board_nonexistent_not_found
        claim_type: Not Found
        grounds: ["entities.Board", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /civic/boards/{id} for an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /civic/boards/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BoardClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: board_create_missing_quorum_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Board.fields.quorum_count", "errors[ERR_INVALID_REQUEST]", "validations[priority=25]"]
        distinguishing_aspect: "POST /civic/boards omitting required quorum_count returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: seat_create_invalid_category_enum
        claim_type: Type Constraints
        grounds: ["entities.Seat.fields.seat_category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /civic/seats with seat_category outside {AT_LARGE,DISTRICT,EX_OFFICIO} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A board exists."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
          trigger:
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "MAYORAL", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: seat_district_specific_without_required_district
        claim_type: Type Constraints
        grounds: ["entities.Seat.fields.required_district", "errors[ERR_DISTRICT_REQUIRED]", "validations[priority=35]"]
        distinguishing_aspect: "POST /civic/seats residency_requirement=DISTRICT_SPECIFIC without required_district returns ERR_DISTRICT_REQUIRED (422)."
        test_recipe:
          setup: ["A board exists."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
          trigger:
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "DISTRICT", residency_requirement: "DISTRICT_SPECIFIC" }
              as: BoardClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.error_id == ERR_DISTRICT_REQUIRED"
            - "response.http_status == 422"

      - name: seat_defaults_vacant
        claim_type: Computed Fields
        grounds: ["entities.Seat.fields.occupancy_status"]
        distinguishing_aspect: "A freshly created seat has occupancy_status VACANT."
        test_recipe:
          setup: ["A board exists."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
          trigger:
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id", occ: "$.data.occupancy_status" }
          assert:
            - "Seat.${s1}.occupancy_status == VACANT"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: hold_scheduled_meeting_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Meeting.NOTICED_to_HELD", "errors[ERR_INVALID_STATE]", "validations[priority=40]"]
        distinguishing_aspect: "Calling hold on a SCHEDULED (not NOTICED) meeting returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A board with a SCHEDULED meeting (notice not posted)."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/meetings"
              payload: { board_id: "${b1}", scheduled_date: "2026-04-01T00:00:00Z" }
              as: BoardClerk
              captures: { m1: "$.data.id" }
          trigger:
            - call: "POST /civic/meetings/${m1}/hold"
              payload: {}
              as: BoardClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: meeting_hold_before_scheduled_not_yet_due
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=76]", "errors[ERR_MEETING_NOT_YET_DUE]"]
        distinguishing_aspect: "Holding a NOTICED meeting before its scheduled_date returns ERR_MEETING_NOT_YET_DUE (409)."
        test_recipe:
          setup: ["Board; a NOTICED meeting scheduled in the future (2026-07-01) with clock at 2026-05-01."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/meetings"
              payload: { board_id: "${b1}", scheduled_date: "2026-07-01T00:00:00Z" }
              as: BoardClerk
              captures: { m1: "$.data.id" }
            - call: "POST /civic/meetings/${m1}/post-notice"
              payload: {}
              as: BoardClerk
          trigger:
            - call: "POST /civic/meetings/${m1}/hold"
              payload: {}
              as: BoardClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.error_id == ERR_MEETING_NOT_YET_DUE"
            - "response.http_status == 409"

      - name: resubmit_eligible_application_invalid_state
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Application.RETURNED_FOR_INFO_to_UNDER_REVIEW", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resubmitting an application already in terminal ELIGIBLE returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An application decided ELIGIBLE."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
          trigger:
            - call: "POST /civic/applications/${app1}/resubmit"
              payload: {}
              as: Applicant
              as_user_id: "${ap1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: vacancy_close_open_to_closed
        claim_type: Valid Transition
        grounds: ["state_machines", "entities.Vacancy.fields.status"]
        distinguishing_aspect: "POST /civic/vacancies/{id}/close moves an OPEN vacancy to CLOSED."
        test_recipe:
          setup: ["Board, seat, and an OPEN vacancy."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
          trigger:
            - call: "POST /civic/vacancies/${v1}/close"
              payload: {}
              as: BoardClerk
              captures: { st: "$.data.status" }
          assert:
            - "Vacancy.${v1}.status == CLOSED"

      - name: appointment_supersede_on_renomination
        claim_type: Valid Transition
        grounds: ["state_machines.Appointment.NOMINATED_to_SUPERSEDED", "entities.Appointment.fields.status"]
        distinguishing_aspect: "A second nomination for the same seat (with the current seat version) supersedes the prior NOMINATED appointment, which becomes SUPERSEDED while the new one is NOMINATED."
        test_recipe:
          setup: ["Two eligible applications for the same seat; the first nominated (NOMINATED)."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id", s1v: "$.data.version" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ben Cole", email: "ben@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap2: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap2}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap2}"
              captures: { app2: "$.data.id" }
            - call: "POST /civic/applications/${app2}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app2}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${app1}", seat_id: "${s1}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s1v}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { appt1: "$.data.id" }
            - call: "GET /civic/seats/${s1}"
              payload: {}
              as: AppointingAuthority
              captures: { s1v2: "$.data.version" }
          trigger:
            - call: "POST /civic/appointments"
              payload: { application_id: "${app2}", seat_id: "${s1}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s1v2}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { appt2: "$.data.id", st2: "$.data.status" }
          assert:
            - "Appointment.${appt2}.status == NOMINATED"
            - "Appointment.${appt1}.status == SUPERSEDED"

      - name: disclosure_cure_cycle_filed_deficient_filed_accepted
        claim_type: Valid Transition
        grounds: ["state_machines.DisclosureFiling.FILED_to_DEFICIENT", "state_machines.DisclosureFiling.DEFICIENT_to_FILED", "state_machines.DisclosureFiling.FILED_to_ACCEPTED"]
        distinguishing_aspect: "A disclosure cycles FILED->DEFICIENT->FILED->ACCEPTED, proving the cure loop terminates in ACCEPTED."
        test_recipe:
          setup: ["A seated member with a PENDING disclosure filing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: BoardClerk
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id", s1v: "$.data.version" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${app1}", seat_id: "${s1}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s1v}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { appt1: "$.data.id" }
            - call: "POST /civic/appointments/${appt1}/confirm"
              payload: { yes_votes: 3, no_votes: 0 }
              as: ConfirmingMember
              as_user_id: "cm-1"
            - call: "GET /civic/terms"
              payload: { seat_id: "${s1}" }
              as: BoardClerk
              captures: { t1: "$.data[0].id" }
            - call: "GET /civic/disclosures"
              payload: { term_id: "${t1}" }
              as: BoardClerk
              captures: { d1: "$.data[0].id" }
            - call: "POST /civic/disclosures/${d1}/file"
              payload: { content: "assets v1" }
              as: Applicant
              as_user_id: "${ap1}"
            - call: "POST /civic/disclosures/${d1}/review"
              payload: { accept: false }
              as: EthicsOfficer
              as_user_id: "ethics-1"
            - call: "POST /civic/disclosures/${d1}/file"
              payload: { content: "assets v2 corrected" }
              as: Applicant
              as_user_id: "${ap1}"
          trigger:
            - call: "POST /civic/disclosures/${d1}/review"
              payload: { accept: true }
              as: EthicsOfficer
              as_user_id: "ethics-1"
              captures: { st: "$.data.status" }
          assert:
            - "DisclosureFiling.${d1}.status == ACCEPTED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: disclosure_due_date_is_term_start_plus_30_days
        claim_type: Correct Result
        grounds: ["calculations.disclosure_due_date", "entities.DisclosureFiling.fields.due_date"]
        distinguishing_aspect: "Disclosure due_date equals term_start_date + 30 days = 2026-07-01 for a term starting 2026-06-01."
        test_recipe:
          setup: ["A seated member (term_start 2026-06-01) with its minted PENDING disclosures."]
          setup_api_calls:
            - call: "POST /civic/boards"
              payload: { name: "Parks Commission", jurisdiction: "Springfield", board_type: "COMMISSION", authorized_seat_count: 5, quorum_count: 3, term_length_months: 48, max_consecutive_terms: 2, max_cumulative_years: 12, attendance_threshold_pct: 75.0, sunshine_notice_days: 7 }
              as: BoardClerk
              captures: { b1: "$.data.id" }
            - call: "POST /civic/seats"
              payload: { board_id: "${b1}", seat_number: 1, seat_category: "AT_LARGE", residency_requirement: "NONE" }
              as: BoardClerk
              captures: { s1: "$.data.id", s1v: "$.data.version" }
            - call: "POST /civic/applicants"
              payload: { full_name: "Ada Reeves", email: "ada@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap1: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${app1}", seat_id: "${s1}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s1v}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { appt1: "$.data.id" }
            - call: "POST /civic/appointments/${appt1}/confirm"
              payload: { yes_votes: 3, no_votes: 0 }
              as: ConfirmingMember
              as_user_id: "cm-1"
            - call: "GET /civic/terms"
              payload: { seat_id: "${s1}" }
              as: BoardClerk
              captures: { t1: "$.data[0].id" }
          trigger:
            - call: "GET /civic/disclosures"
              payload: { term_id: "${t1}" }
              as: BoardClerk
              captures: { due: "$.data[0].due_date" }
          assert:
            - "every DisclosureFiling for term ${t1} has due_date == 2026-07-01T00:00:00Z"

      - name: term_end_is_start_plus_48_months
        claim_type: Correct Result
        grounds: ["calculations.term_window_computation", "entities.Appointment.fields.term_end_date"]
        distinguishing_aspect: "Nominating with term_start_date 2026-06-01 yields term_end_date 2030-06-01 (48 months later)."
        test_recipe:
          setup: ["An eligible application nominated with term_start 2026-06-01."]
          setup_api_calls:
            - call: "POST /civic/boards"
