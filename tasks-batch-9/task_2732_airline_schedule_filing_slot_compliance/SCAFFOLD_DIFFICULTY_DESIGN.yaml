            - "FilingSubmission.${sub_id}.total_charge_cents == 22815 with base_charge_subtotal_cents == 16900, expedite_rate_pct == 35.00 and expedite_fee_cents == 5915"
            - "after trigger call 1, ScheduleVersion.${sv_id}.filing_charge_accrued_cents == 22815 exactly, filing_status == FILED, and all four legs are FILED"
            - "after trigger call 2, ScheduleVersion.${sv_id}.filing_charge_accrued_cents == 0 exactly — zero drift, not 1 and not -22815"
