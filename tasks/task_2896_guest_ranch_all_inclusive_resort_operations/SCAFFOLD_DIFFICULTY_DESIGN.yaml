  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_state_gate_at_18_beats_deposit_money_gate_at_66
        conflict_pair: "priority 18 (state, ERR_BOOKING_STATE_INVALID) vs priority 66 (business_fiscal, ERR_DEPOSIT_INSUFFICIENT)"
        grounds:
          - validations[priority=18]
          - validations[priority=66]
          - state_machines.Booking.HELD_to_CANCELLED
          - errors[ERR_BOOKING_STATE_INVALID]
          - errors[ERR_DEPOSIT_INSUFFICIENT]
        distinguishing_aspect: |
          One request violates a state rule and a money rule at once: the booking is CANCELLED (so
          confirm is illegal) and its deposit_paid_cents is 0 against a deposit_required_cents of
          377607 (so the money gate would also fire). The catalog pins the state category above the
          fiscal category, so the response must be ERR_BOOKING_STATE_INVALID. An implementation
          that validates money first — the natural order if the deposit check lives in the
          pricing service — returns ERR_DEPOSIT_INSUFFICIENT and fails.
        test_recipe:
          setup:
            - "OPEN season, cabin, party of three, one 7-night hold created with no payment at all"
            - "the hold is cancelled first, so booking_status is CANCELLED and payment_status is FORFEITED with deposit_paid_cents 0"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id }
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_a2}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_c1}", member_type: "CHILD", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/cancel"
              payload: { reason: "guest never paid the deposit" }
              as: ReservationsAgent
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: ReservationsAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == ERR_BOOKING_STATE_INVALID"
            - "${err} != ERR_DEPOSIT_INSUFFICIENT"
            - "Booking.${booking_id}.booking_status == CANCELLED"
            - "Booking.${booking_id}.payment_status == FORFEITED"
            - "Booking.${booking_id}.deposit_paid_cents == 0"
            - "Booking.${booking_id}.deposit_required_cents == 377607"

      - name: rider_ability_safety_gate_at_30_beats_slot_capacity_gate_at_57
        conflict_pair: "priority 30 (business_safety, ERR_RIDER_ABILITY_INSUFFICIENT) vs priority 57 (business_constraint, ERR_SLOT_FULL)"
