            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
