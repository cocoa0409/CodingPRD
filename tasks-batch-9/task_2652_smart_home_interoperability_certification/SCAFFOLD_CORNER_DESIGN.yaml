            - "${err_tool_access} == \"ERR_UNAUTHORIZED\" even though the acting Member is the member named in the path - tool access is a ProgramAdmin decision, and ownership never widens a role list"
            - "${err_listing_withdraw} == \"ERR_UNAUTHORIZED\" - ProgramAdmin owns POST /listings and POST /listings/{listing_id}/publish but withdrawal belongs exclusively to ComplianceOfficer"
            - "${err_session_start} == \"ERR_UNAUTHORIZED\" - ProgramAdmin shares session booking and cancellation with TestLaboratory but start, results and complete are laboratory-exclusive"
            - "${err_clock} == \"ERR_UNAUTHORIZED\" (403), not 401 - POST /_clock/set_current_utc is the single endpoint exempt from priority 1, and it is still restricted to ProgramAdmin by priority 2"
            - "${err_public_submissions}, ${err_lab_ledger} and ${err_lab_cases} == \"ERR_UNAUTHORIZED\" - PublicViewer sees only specifications, feature sets, laboratories, plugfests and listings, and TestLaboratory sees neither credit ledgers nor noncompliance cases"
            - "GET /listings and GET /test-laboratories as PublicViewer both return 200 with total_count == 0 and total_count == 1 respectively - the consumer surface is reachable, so the refusals above are about the role and not about a broken header contract"
            - "No row was created by any refused call: GET /specifications returns total_count == 0, GET /members returns total_count == 1 and the logical clock is still 2026-09-01T00:00:00Z"

      - name: entity_backed_identities_are_scoped_to_their_own_row
        claim_type: peer_roles
        grounds:
          - rbac.roles
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: >
          Member and TestLaboratory identities are entity_backed, so the same role held by a different row
          is a stranger: laboratory L2 is refused L1's session even though L2 is equally AUTHORIZED, member
          M2 is refused M1's submission even though M2 is equally in good standing, and M1 cannot create a
          submission or buy credit under M2's member_id. ProgramAdmin, whose identity is opaque, shares
          cancellation with the laboratories and is not ownership-scoped at all.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY 20)."
            - "Two AUTHORIZED laboratories L1 and L2; two members M1 and M2, both in good standing with 1000000 cents each."
            - "Submission S1 owned by M1, IN_REVIEW, with an ISSUED plan and one SCHEDULED session booked at L1 (240 minutes)."
