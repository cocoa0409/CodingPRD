        - 'After hire: HireRecord.${hire_id}.status == ACTIVE and prior_hire_id == null and tenure_days == 0'
        - 'After hire: Carrier.${carrier_id}.filled_requisitions == 1 and posture == OPEN'
        - 'After hire: DriverApplication.${app_id}.qualification_status == HIRED'
        - 'After rescind: HireRecord.${hire_id}.status == RESCINDED'
        - 'After rescind: Carrier.${carrier_id}.filled_requisitions == 0 and open_requisitions == 5 and posture == OPEN'
        - 'After rescind: DriverApplication.${app_id}.qualification_status == QUALIFIED'
        - 'After rescind: OrientationSession.${sess_id}.enrolled_count == 1 (unchanged by both operations)'
        - 'After rescind: DriverApplicant.${applicant_id}.rehire_eligibility == ELIGIBLE (a RESCINDED hire never enters the eligibility calculation)'
    - name: dq_weight_conserved_across_annual_review_and_revocation
      grounds:
      - state_machines.DqFile.OVERDUE_to_NOT_DUE
      - state_machines.DqFile.NOT_DUE_to_DUE
      - calculations.dq_completeness_score
      - entities.DqFile.fields.total_weight
      - endpoints[POST /dq-files/{dq_file_id}/revoke-certification]
      distinguishing_aspect: 'Conserved quantity: DOCUMENT WEIGHT POINTS, a third distinct type of quantity. DqFile.total_weight stays 33 and the annual_review_final denominator stays 30 across
        the certify/revoke pair, and the satisfied_weight returns to exactly its pre-certification value 6, so certification adds 5 points and revocation removes exactly the same 5 with zero drift.'
      test_recipe:
        setup:
        - One submitted application whose DqFile has APPLICATION_FORM PRESENT (weight 3) and MVR_INITIAL PRESENT (weight 3) after an MVR issued 2027-08-15 was adjudicated PASS.
        - Clock at 2027-09-01T00:00:00Z, so the DqFile review_state is OVERDUE (due 2027-08-01, grace end 2027-08-31).
        setup_api_calls:
        - call: POST /carriers
          payload:
            legal_name: Redline Freight LLC
            dot_number: DOT-2166-Z
            open_requisitions: 5
            safety_rating: SATISFACTORY
            mvr_validity_days: 365
            annual_review_interval_days: 365
            annual_review_grace_days: 30
            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        - call: POST /driver-applicants
          payload:
            carrier_id: ${carrier_id}
            full_name: Dana Ruiz
            date_of_birth: '1988-04-12'
            email: sol.reyn@example.com
            cdl_number: CDL-11025
            cdl_state: TX
            cdl_class: CLASS_A
            experience_months: 24
          as: Recruiter
          captures:
            applicant_id: $.data.id
        - call: POST /driver-applications
          payload:
            applicant_id: ${applicant_id}
            position_type: OTR
          as: Recruiter
          captures:
            app_id: $.data.id
        - call: POST /driver-applications/${app_id}/submit
          payload: {}
          as: Recruiter
          as_user_id: rec-001
        - call: POST /_clock/set_current_utc
          payload:
            to_iso8601: '2027-09-01T00:00:00Z'
          as: Recruiter
        - call: POST /screening-checks
          payload:
            application_id: ${app_id}
            check_type: MVR
          as: Recruiter
          captures:
            mvr_id: $.data.id
        - call: POST /screening-checks/${mvr_id}/record-result
          payload:
            issued_on: '2027-08-15'
            violation_points: 0
            serious_violation_count: 0
            crash_preventable_count: 0
          as: Recruiter
        - call: POST /screening-checks/${mvr_id}/adjudicate
          payload:
            decision: PASS
          as: SafetyDirector
        - call: GET /dq-files
          payload:
            application_id: ${app_id}
          as: Recruiter
          captures:
            dqf_id: $.data[0].id
        trigger:
        - call: GET /dq-files/${dqf_id}/completeness
          payload:
            variant: annual_review_final
          as: ComplianceAuditor
        - call: POST /dq-files/${dqf_id}/annual-review
          payload:
            certification_note: FY2027 review
          as: ComplianceAuditor
          as_user_id: aud-900
        - call: GET /dq-files/${dqf_id}/completeness
          payload:
            variant: annual_review_final
          as: ComplianceAuditor
        - call: POST /dq-files/${dqf_id}/revoke-certification
          payload:
            reason: AUDITOR_ERROR
          as: ComplianceAuditor
          as_user_id: aud-900
        - call: GET /dq-files/${dqf_id}/completeness
          payload:
            variant: annual_review_final
          as: ComplianceAuditor
        assert:
        - 'Before certification: satisfied_weight == 6, denominator_weight == 30, completeness_pct == 20.00'
        - 'After annual-review: satisfied_weight == 11, denominator_weight == 30, completeness_pct == 36.67'
        - 'After annual-review: DqFile.${dqf_id}.review_state == NOT_DUE, next_review_due_on == 2028-08-31, certified_by_user_id == aud-900'
        - 'After revoke-certification: satisfied_weight == 6, denominator_weight == 30, completeness_pct == 20.00'
        - 'After revoke-certification: DqFile.${dqf_id}.review_state == OVERDUE, next_review_due_on == 2027-08-01, last_annual_review_at == null, certified_by_user_id == null'
        - DqFile.${dqf_id}.total_weight == 33 at every one of the three observation points
