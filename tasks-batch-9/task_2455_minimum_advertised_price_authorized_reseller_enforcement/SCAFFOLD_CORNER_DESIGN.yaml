            - "Reseller.${res}.version == 4"

      - name: reseller_supply_axis_hold_to_open_releases_quality_hold
        claim_type: valid_transition
        grounds: ["state_machines.Reseller.transitions.HOLD_to_OPEN"]
        distinguishing_aspect: "Only a QUALITY_OBLIGATION or AGREEMENT_EXPIRED hold is releasable on the supply axis; releasing it restores OPEN / NONE with authorization_status still AUTHORIZED."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED with supply_status HOLD and hold_reason QUALITY_OBLIGATION at version 4."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *SUPPLYHOLD
          trigger:
            - call: "POST /resellers/${res}/supply-status"
              payload: { supply_status: "OPEN", note: "Audit remediated" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
          assert:
            - "HTTP 200"
            - "Reseller.${res}.supply_status == OPEN"
            - "Reseller.${res}.hold_reason == NONE"
            - "Reseller.${res}.authorization_status == AUTHORIZED"
            - "Reseller.${res}.version == 5"

      # --- PriceObservation (2 transitions) ---------------------------------
      - name: observation_captured_to_evaluated_compliant_writes_zero_deviation
        claim_type: valid_transition
        grounds: ["state_machines.PriceObservation.transitions.CAPTURED_to_EVALUATED_COMPLIANT"]
        distinguishing_aspect: "A listing at exactly the floor (15000 vs 15000) is compliant, not a breach: deviation_cents and deviation_pct are written as 0 and no Violation row is created."
        test_recipe:
          setup: ["Policy PUBLISHED, product floor 15000, matched reseller Acme AUTHORIZED, listing at exactly 15000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - &OBS15000
              call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "Acme Store", listing_url: "https://mkt.example/l/ok", listed_price_cents: 15000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", matched_reseller_id: "${res}" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obsok: $.data.id }
          trigger:
            - call: "POST /price-observations/${obsok}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.evaluation_status, dc: $.data.deviation_cents, vid: $.data.violation_id }
          assert:
            - "HTTP 200"
            - "${st} == 'EVALUATED_COMPLIANT'"
            - "${dc} == 0"
            - "${vid} == null"
            - "PriceObservation.${obsok}.deviation_pct == 0"
            - "PriceObservation.${obsok}.effective_map_floor_cents == 15000"
            - "GET /violations?reseller_id=${res} returns total_count == 0"

      - name: observation_captured_to_evaluated_breach_without_match_creates_no_violation
        claim_type: valid_transition
        grounds: ["state_machines.PriceObservation.transitions.CAPTURED_to_EVALUATED_BREACH"]
        distinguishing_aspect: "The same EVALUATED_BREACH target state runs a divergent side-effect set when matched_reseller_id is null: the deviation fields are written but no Violation row appears, routing the breach to test purchasing."
        test_recipe:
          setup: ["Policy PUBLISHED, product floor 15000, unmatched grey-market listing at 9000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
            - &OBSGREY
              call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/l/9", listed_price_cents: 9000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obsg: $.data.id }
          trigger:
            - &OBSGREYEVAL
              call: "POST /price-observations/${obsg}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { st: $.data.evaluation_status, dc: $.data.deviation_cents, vid: $.data.violation_id }
          assert:
            - "HTTP 200"
            - "${st} == 'EVALUATED_BREACH'"
            - "${dc} == 6000"
            - "${vid} == null"
            - "PriceObservation.${obsg}.deviation_pct == 0.4000"
            - "GET /violations returns total_count == 0"

      # --- Violation (8 transitions) ---------------------------------------
      - name: violation_detected_to_noticed_sets_assessed_fields_and_cure_deadline
        claim_type: valid_transition
        grounds: ["state_machines.Violation.transitions.DETECTED_to_NOTICED"]
        distinguishing_aspect: "Notice issuance freezes the FINAL_AT_NOTICE snapshot onto the violation and sets cure_deadline_at to clock 2026-08-20 plus the cited policy's cure_window_days 10, i.e. 2026-08-30."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED; violation V1 DETECTED with provisional 3 points; clock 2026-08-20T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
