            - { call: "POST /v1/formulas/${form_id}/submit-label-review", payload: { expected_formula_version: "${form_v}" }, as: ProductDeveloper, as_user_id: "dev-1", captures: { rev_id: $.data.id } }
            - { call: "POST /v1/label-reviews/${rev_id}/approve", payload: {}, as: LabelComplianceReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-HO1", capacity_liters: 5000 }, as: PlantManager, captures: { tank1: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank1}", planned_start_at: "2026-08-09T08:00:00Z", planned_end_at: "2026-08-09T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch1: $.data.id } }
            - { call: "POST /v1/batches/${batch1}/start-blend", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch1}/record-blend", payload: { measured_brix: 12.1 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch1}/qa-verdict", payload: { verdict: "PASS" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/process-runs", payload: { batch_id: "${batch1}", setpoint_temp_c: 88.0, setpoint_hold_seconds: 30 }, as: BlendOperator, captures: { prun1: $.data.id } }
            - { call: "POST /v1/process-runs/${prun1}/start", payload: {}, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/process-runs/${prun1}/complete", payload: { min_temp_c: 88.0, time_below_setpoint_seconds: 0 }, as: BlendOperator, as_user_id: "op-1" }
            - { call: "POST /v1/batches/${batch1}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/blending-tanks", payload: { tank_code: "T-HO2", capacity_liters: 5000 }, as: PlantManager, captures: { tank2: $.data.id } }
            - { call: "POST /v1/batches", payload: { formula_id: "${form_id}", tank_id: "${tank2}", planned_start_at: "2026-08-10T08:00:00Z", planned_end_at: "2026-08-10T12:00:00Z", quantity_liters: 2000 }, as: BlendOperator, captures: { batch2: $.data.id } }
