      - Voiding as tc-01 returns ERR_TAX_VOID_SELF_REVIEW with HTTP 422 because tc-01 is the filed_by_user_id,
        and the report is still status "FILED" with voided_by_user_id null.
      - Voiding as ProgramDirector returns ERR_ROLE_NOT_PERMITTED with HTTP 403 — priority 3 before priority
        15 — even though pd-01 is not the filer and would have passed the duties check.
      - 'Voiding as tc-02 with no void_reason returns ERR_INVALID_REQUEST with HTTP 400: void_reason is
        a required input on this endpoint.'
      - 'Voiding as tc-02 with a reason returns 200: status "VOIDED", voided_by_user_id "tc-02", void_reason
        stored, filed_by_user_id still "tc-01" and filed_at unchanged.'
      - The reversal is immediate and exact — GET /qualifiers/${qa_id} shows tax_status "VOIDED" and GET
        /programs/${p_id} shows reported_award_total_cents back to 0, the same value it held before the
        file.
      - 'Voiding again as tc-03 returns ERR_TAX_REPORT_STATE_INVALID with HTTP 409: VOIDED is terminal,
        so the duties check at priority 15 is never reached.'
      - The advance to CLOSED returns ERR_TAX_REPORTING_INCOMPLETE with HTTP 422, because Ana's taxable_award_cents
        is 783500 and her tax_status is "VOIDED" rather than "REPORTED".
      - 'A replacement report for the same qualifier and tax year is created (201, status "DRAFT" — the
        voided row no longer counts for uniqueness), but filing it returns ERR_QUALIFIER_STATE_INVALID
        with HTTP 409: the file transition requires tax_status == PENDING_REPORT and VOIDED is terminal
        on that axis.'
