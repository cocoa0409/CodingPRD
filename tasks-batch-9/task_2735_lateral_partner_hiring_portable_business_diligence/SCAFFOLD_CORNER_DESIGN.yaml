      - name: vote_roll_full_rejects_a_fourth_ballot
        claim_type: aggregate_validation
        grounds:
          - validations[priority=26]
          - errors[ERR_VOTE_ROLL_FULL]
          - entities.CompensationOffer.fields.eligible_voter_count
          - entities.CompensationOffer.fields.active_vote_count
        distinguishing_aspect: |
          An AGGREGATE bound, not a per-row one: the rule compares a COUNT of sibling
          CommitteeVote rows against a snapshot integer frozen on the offer at submit, so no
          single vote row is invalid on its own. The fourth ballot comes from a different
          user in a different role (CommitteeChair, who is a legal voter and is not the
          sponsor), which isolates the roll-capacity failure from duplicate-vote and
          segregation-of-duties failures.
