              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { recipient_over_id: "$.data[0].id" }
            - call: "POST /orders/${order_over_boundary_id}/submit-for-approval"
              payload: { requested_by_user_id: "emp-req-12", station_id: "${station_id}", scheduled_date: "2026-03-04T00:00:00Z" }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "CorporateOrder.${order_at_boundary_id}.total_cost_cents == 40000 AND requires_approval == false AND approval_status == 'APPROVED' (auto-approved: 40000 is NOT strictly greater than the 40000 threshold)"
            - "CorporateOrder.${order_over_boundary_id}.total_cost_cents == 44000 AND requires_approval == true AND approval_status == 'PENDING_APPROVAL' (44000 IS strictly greater than the 40000 threshold, so it awaits a human FinanceApprover)"

      - name: import_batch_zero_accepted_rows_boundary
        grounds:
          - validations[priority=23]
          - calculations.component_available_qty
        distinguishing_aspect: |
          A different metric (an empty-acceptance-count boundary on a CSV batch, not a money
          threshold) reachable through a different endpoint (POST /orders/{id}/recipients/import):
          when on_hand_qty=0, every row in the batch is individually REJECTED for insufficient
          forward_looking inventory, so accepted_rows crosses from >=1 to exactly 0 and the whole
          batch call itself fails.
        test_recipe:
          setup:
            - "CorporateAccount; ComponentSKU on_hand_qty=0 (out of stock); GiftBasketTemplate requiring 1 unit of that SKU per basket."
          setup_api_calls:
            - call: "POST /corporate-accounts"
              payload: { name: "Nu Corp", billing_email: "ap@nu.example", monthly_budget_cents: 1000000, approval_threshold_cents: 1000000 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /component-skus"
              payload: { name: "Sold Out Gadget", unit_cost_cents: 500, is_perishable: false, on_hand_qty: 0 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /gift-basket-templates"
              payload: { name: "Gadget Basket", category: "CORPORATE_WELCOME", base_price_cents: 3000, is_perishable: false, components: [ { sku_id: "${sku_id}", quantity: 1 } ], active: true }
              as: PlatformAdmin
              captures: { template_id: $.data.id }
            - call: "POST /corporate-accounts/${acct_id}/orders"
              payload: { template_id: "${template_id}", occasion: "CUSTOM", expected_corporate_account_version: "${acct_v}" }
              as: AccountManager
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/recipients/import"
              payload: { rows: [ { full_name: "Row One", email: "rowone@example.com", shipping_address_line1: "16 Alder St", city: "Vancouver", state_code: "WA", postal_code: "98660", country_code: "US", quantity: 1 }, { full_name: "Row Two", email: "rowtwo@example.com", shipping_address_line1: "17 Cedar St", city: "Vancouver", state_code: "WA", postal_code: "98661", country_code: "US", quantity: 1 } ] }
              as: AccountManager
              as_user_id: "${acct_id}"
          assert:
            - "the call returns error_id == 'ERR_IMPORT_BATCH_ALL_ROWS_REJECTED' with http_status 422 (both rows individually failed ERR_INSUFFICIENT_INVENTORY_FORWARD since on_hand_qty=0, so accepted_rows==0); no Recipient rows are persisted for this order"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_approval_gated_by_branding_profile_approval_state
        grounds:
          - validations[priority=18]
          - state_machines.BrandingProfile
        distinguishing_aspect: |
          Entity pair (CorporateOrder, BrandingProfile): CorporateOrder's PENDING_APPROVAL -> APPROVED
          transition is valid or not purely as a function of a DIFFERENT entity's state
          (BrandingProfile.approved); flipping that other entity's state from false to true changes
          the order's transition validity with no other change to the order itself.
