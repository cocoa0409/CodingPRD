# =============================================================================
# Task 1162 — Emergency Board-Up & Property Securing — §1.8 Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_divergence
        grounds:
          - calculations.invoice_amount
          - entities.Invoice.fields.variant
          - state_machines.Invoice.transitions
        distinguishing_aspect: |
          The invoice_amount rule ships two variants on the SAME job and SAME scope items:
          PROVISIONAL prices planned quantities of non-VOIDED items and excludes services,
          while FINAL prices actual installed quantities and adds the removal fee — the two
          variants MUST produce different totals here (91225 vs 126125).
        test_recipe:
          setup:
            - "Market SEA (board 4500/sheet, tarp 85/sqft, fence 1200/ft, P2 multiplier 1.25, permit+notification required, removal 25000)"
            - "Subcontractor sa covered in SEA; subcontractor sb as segregated assessor; customer cu; property pr (wind LOW)"
            - "Job P2 secured with BOARD 4x(48x36in), TARP 10x15ft, FENCE 40ft planned; installed actuals BOARD 6 openings, TARP 10x16ft, FENCE 42ft"
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Seattle", code: "SEA", sla_minutes_p1: 120, sla_minutes_p2: 480, sla_minutes_p3: 1440, permit_required: true, notification_required: true, notification_deadline_hours: 24, late_notification_fee_cents: 15000, board_rate_per_sheet_cents: 4500, tarp_rate_per_sqft_cents: 85, fence_rate_per_linear_ft_cents: 1200, patrol_visit_fee_cents: 7499, temp_power_daily_rate_cents: 18000, temp_lighting_daily_rate_cents: 9000, generator_pool_units: 2, removal_flat_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Alpha Board" }
              as: PlatformAdmin
              captures: { sa: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Beta Inspect" }
              as: PlatformAdmin
              captures: { sb: $.data.id }
            - call: "POST /coverages"
              payload: { subcontractor_id: "${sa}", market_id: "${m1}", max_concurrent_jobs: 2, rank: 1 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "Otto Owner", email: "otto@x.com", kind: "OWNER" }
              as: PlatformAdmin
              captures: { cu: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cu}", market_id: "${m1}", address_line: "1 Pine St", wind_zone: "LOW" }
              as: PlatformAdmin
              captures: { pr: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P2" }
              as: Dispatcher
              captures: { j: $.data.id }
            - call: "POST /jobs/${j}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { as1: $.data.id }
            - call: "POST /assignments/${as1}/respond"
              payload: { outcome: "ACCEPT" }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/check-in"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/safety-assessments"
              payload: { hazards: ["GAS", "WATER"] }
              as: Subcontractor
              as_user_id: "${sb}"
            - call: "GET /jobs/${j}"
              as: Dispatcher
              captures: { jv1: $.data.version }
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "BOARD", opening_count: 4, width_in: 48, height_in: 36, door_count: 0, expected_job_version: "${jv1}" }
              as: Dispatcher
              captures: { si1: $.data.id }
            - call: "GET /jobs/${j}"
              as: Dispatcher
              captures: { jv2: $.data.version }
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "TARP", length_ft: 10, width_ft: 15, expected_job_version: "${jv2}" }
              as: Dispatcher
              captures: { si2: $.data.id }
            - call: "GET /jobs/${j}"
              as: Dispatcher
              captures: { jv3: $.data.version }
            - call: "POST /jobs/${j}/scope-items"
              payload: { kind: "FENCE", linear_ft: 40, expected_job_version: "${jv3}" }
              as: Dispatcher
              captures: { si3: $.data.id }
            - call: "POST /scope-items/${si1}/install"
              payload: { opening_count: 6, width_in: 48, height_in: 36, door_count: 0 }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /scope-items/${si2}/install"
              payload: { length_ft: 10, width_ft: 16 }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /scope-items/${si3}/install"
              payload: { linear_ft: 42 }
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/complete-securing"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
            - call: "POST /jobs/${j}/permit-cases"
              payload: { kind: "PERMIT" }
              as: Dispatcher
              captures: { pc: $.data.id }
            - call: "POST /permit-cases/${pc}/file"
              payload: { confirmation_number: "SEA-P-001" }
              as: Dispatcher
            - call: "POST /permit-cases/${pc}/record-decision"
              payload: { decision: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /jobs/${j}/document-packages"
              payload: {}
              as: Dispatcher
              captures: { pkg: $.data.id, pv1: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv1}" }
              as: Dispatcher
              captures: { pv2: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv2}" }
              as: Dispatcher
              captures: { pv3: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv3}" }
              as: Dispatcher
              captures: { pv4: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv4}" }
              as: Dispatcher
              captures: { pv5: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv5}" }
              as: Dispatcher
              captures: { pv6: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "PHOTO", expected_package_version: "${pv6}" }
              as: Dispatcher
              captures: { pv7: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "AUTHORIZATION", expected_package_version: "${pv7}" }
              as: Dispatcher
              captures: { pv8: $.data.version }
            - call: "POST /document-packages/${pkg}/artifacts"
              payload: { kind: "MEASUREMENT_SHEET", expected_package_version: "${pv8}" }
              as: Dispatcher
            - call: "POST /jobs/${j}/permit-cases"
              payload: { kind: "NOTIFICATION" }
              as: Dispatcher
              captures: { nc: $.data.id }
            - call: "POST /permit-cases/${nc}/file"
              payload: { confirmation_number: "SEA-N-001" }
              as: Dispatcher
            - call: "POST /jobs/${j}/invoices"
              payload: { variant: "PROVISIONAL" }
              as: Dispatcher
              captures: { invp: $.data.id, prov_total: $.data.total_cents }
            - call: "POST /invoices/${invp}/submit"
              payload: {}
              as: Dispatcher
            - call: "POST /invoices/${invp}/record-payment"
              payload: {}
              as: Dispatcher
            - call: "POST /jobs/${j}/verify-repair"
              payload: { outcome: "VERIFIED" }
              as: Customer
              as_user_id: "${cu}"
            - call: "POST /jobs/${j}/record-removal"
              payload: {}
              as: Subcontractor
              as_user_id: "${sa}"
          trigger:
            - call: "POST /jobs/${j}/invoices"
              payload: { variant: "FINAL" }
              as: Dispatcher
              captures: { invf: $.data.id, final_total: $.data.total_cents, final_work: $.data.work_subtotal_cents }
          assert:
            - "Invoice[${invp}].total_cents == 91225 (BOARD 2 sheets 11250 + TARP 188 sqft 19975 + FENCE 40 ft 60000, P2 multiplier 1.25, no discount)"
            - "Invoice[${invf}].work_subtotal_cents == 101125 (actual BOARD 3 sheets 16875 + actual TARP 200 sqft 21250 + actual FENCE 42 ft 63000)"
            - "Invoice[${invf}].removal_fee_cents == 25000"
            - "Invoice[${invf}].total_cents == 126125"
            - "Invoice[${invf}].total_cents != Invoice[${invp}].total_cents — same job, two variants, different results"

      - name: reliability_lenient_vs_strict_divergence
        grounds:
          - calculations.subcontractor_reliability
          - entities.Subcontractor.fields.reliability_score_lenient
          - entities.Subcontractor.fields.reliability_score_strict
        distinguishing_aspect: |
          subcontractor_reliability ships two variants over the SAME counters on the
          Subcontractor (ops domain, distinct from invoice money): lenient = 2/(2+1) = 0.6667
          ranks dispatch candidates, strict = 2/(2+1+1) = 0.5 additionally penalizes the
          expired offer — identical inputs, different outputs.
        test_recipe:
          setup:
            - "Subcontractor sc covered in SEA (max 3); assessor sd; property pr (LOW)"
