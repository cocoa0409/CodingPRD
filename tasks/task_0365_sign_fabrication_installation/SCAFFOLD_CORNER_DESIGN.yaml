# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Sign Fabrication & Installation — breadth probe over §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_sign_project_returns_201_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.SignProject.fields.phase
          - entities.SignProject.fields.permit_required
          - entities.SignProject.fields.contract_total_cents
        distinguishing_aspect: "POST /sign-projects with all required fields returns 201; phase==DESIGN, contract_total_cents==0, version==1; COUNTY_C non-illuminated => permit_required==false."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sign-projects"
              payload: { customer_name: "New Co", site_address: "1 Open St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
          assert:
            - "SignProject.${proj_id}.phase == DESIGN"
            - "SignProject.${proj_id}.contract_total_cents == 0"
            - "SignProject.${proj_id}.permit_required == false"
            - "SignProject.${proj_id}.version == 1"

      - name: permit_required_true_when_illuminated_in_county_c
        claim_type: Computed Fields
        grounds:
          - entities.SignProject.fields.permit_required
          - entities.SignProject.fields.illuminated
        distinguishing_aspect: "An illuminated COUNTY_C project has permit_required==true even though COUNTY_C structural would otherwise waive permits — illumination forces it."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sign-projects"
              payload: { customer_name: "Lit Co", site_address: "2 Glow St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6, illuminated: true }
              as: ShopManager
              captures: { proj_id: $.data.id }
          assert:
            - "SignProject.${proj_id}.permit_required == true"

      - name: get_sign_project_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.SignProject
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /sign-projects/{random-uuid} for a non-existent project returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sign-projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopManager
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: create_sign_project_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.SignProject.fields.face_width_in
          - "validations[priority=4]"
        distinguishing_aspect: "POST /sign-projects without face_width_in returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sign-projects"
              payload: { customer_name: "Bad Co", site_address: "3 Gap St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: create_sign_project_invalid_enum_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.SignProject.fields.sign_type
          - "validations[priority=4]"
        distinguishing_aspect: "POST /sign-projects with sign_type=='BILLBOARD' (not in MONUMENT|PYLON|WALL|BLADE) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sign-projects"
              payload: { customer_name: "Enum Co", site_address: "4 Bad St", jurisdiction_code: "COUNTY_C", sign_type: "BILLBOARD", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: create_sign_project_nonpositive_dimension_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.SignProject.fields.face_height_in
          - "validations[priority=4]"
        distinguishing_aspect: "POST /sign-projects with face_height_in==0 violates the '> 0' constraint and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sign-projects"
              payload: { customer_name: "Zero Co", site_address: "5 Null St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 0, placement_height_ft: 6 }
              as: ShopManager
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: equipment_immutable_no_version_field
        claim_type: System Fields
        grounds:
          - entities.Equipment.fields.asset_tag
          - entities.Equipment.fields.equipment_class
        distinguishing_aspect: "POST /equipment server-mints id and created_at; client-sent id is ignored — GET returns the server id, not any client-supplied value."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /equipment"
              payload: { asset_tag: "LAD-X", equipment_class: "LADDER", max_reach_ft: 16 }
              as: ShopManager
              captures: { eq_id: $.data.id, eq_in_service: $.data.in_service }
          assert:
            - "Equipment.${eq_id}.equipment_class == LADDER"
            - "Equipment.${eq_id}.in_service == true"

      - name: art_proof_default_revision_no_is_one
        claim_type: Defaults
        grounds:
          - entities.ArtProof.fields.revision_no
        distinguishing_aspect: "The first ArtProof of a fresh project gets revision_no==1 and status DRAFT."
        test_recipe:
          setup: ["A fresh project in DESIGN"]
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Rev Co", site_address: "6 First St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/r.svg", color_count: 2 }
              as: Designer
              captures: { proof_id: $.data.id }
          assert:
            - "ArtProof.${proof_id}.revision_no == 1"
            - "ArtProof.${proof_id}.status == DRAFT"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_art_proof_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ArtProof.DRAFT_to_SUBMITTED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Submitting an already-SUBMITTED proof has no defined transition from SUBMITTED via submit -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A project with one SUBMITTED proof"]
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "St Co", site_address: "7 State St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/s.svg", color_count: 2 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: second_proof_approval_when_one_already_approved_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.ArtProof.SUBMITTED_to_APPROVED
          - "errors[ERR_PROOF_ALREADY_APPROVED]"
        distinguishing_aspect: "Approving a second SUBMITTED proof while another proof of the project is already APPROVED returns ERR_PROOF_ALREADY_APPROVED (409)."
        test_recipe:
          setup: ["A project with proof A APPROVED and proof B SUBMITTED"]
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Two Co", site_address: "8 Dup St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/A.svg", color_count: 2 }
              as: Designer
              captures: { proofA: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proofA}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proofA}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/B.svg", color_count: 2 }
              as: Designer
              captures: { proofB: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proofB}/submit"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proofB}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
          assert:
            - "error_id == ERR_PROOF_ALREADY_APPROVED"
            - "http_status == 409"

      - name: proof_approval_bubbles_project_to_estimating
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ArtProof.SUBMITTED_to_APPROVED
          - state_machines.SignProject.DESIGN_to_ESTIMATING
        distinguishing_aspect: "Approving the SUBMITTED proof flips project.phase DESIGN -> ESTIMATING (bubble-up cross-entity side effect)."
        test_recipe:
          setup: ["A project in DESIGN with one SUBMITTED proof"]
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Bub Co", site_address: "9 Up St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/u.svg", color_count: 2 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
          assert:
            - "ArtProof.${proof_id}.status == APPROVED"
            - "SignProject.${proj_id}.phase == ESTIMATING"

      - name: estimate_accept_supersedes_other_sent_estimate
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Estimate.SENT_to_ACCEPTED
          - entities.Estimate.fields.status
        distinguishing_aspect: "Accepting estimate E1 supersedes a second SENT estimate E2 of the same project (E2.status -> SUPERSEDED) and sets approved_estimate_id to E1."
        test_recipe:
          setup: ["A project ESTIMATING with two SENT estimates E1 and E2 against the same approved proof"]
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Sup Co", site_address: "10 Win St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/w.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { e1: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${e1}/send"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "STEEL", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { e2: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${e2}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /sign-projects/${proj_id}/estimates/${e1}/accept"
              payload: { expected_sign_project_version: "${pv}" }
              as: Customer
          assert:
            - "Estimate.${e1}.status == ACCEPTED"
            - "Estimate.${e2}.status == SUPERSEDED"
            - "SignProject.${proj_id}.approved_estimate_id == ${e1}"
            - "SignProject.${proj_id}.phase == PERMITTING"

      - name: accept_second_estimate_after_one_accepted_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.Estimate.SENT_to_ACCEPTED
          - "errors[ERR_ESTIMATE_ALREADY_ACCEPTED]"
        distinguishing_aspect: "After one estimate is ACCEPTED (and others SUPERSEDED), there is no remaining SENT estimate to accept; the prior estimate was superseded so accepting it returns ERR_INVALID_STATE, while a fresh SENT estimate created later fails on ERR_ESTIMATE_ALREADY_ACCEPTED."
        excluded_because:
          difficulty_instance: dual_variant_calc / estimate_provisional_vs_change_order_rescope_on_estimate_domain
          rationale: "The single-accept guard and supersede semantics are exercised in the §1.8 accept-then-change-order chain; this corner only restates the already-accepted guard."

      - name: estimate_auto_expires_on_accept_after_valid_until
        claim_type: Valid Transition
        grounds:
          - state_machines.Estimate.SENT_to_EXPIRED
          - "errors[ERR_ESTIMATE_EXPIRED]"
        distinguishing_aspect: "A SENT estimate whose valid_until_iso has passed (clock advanced beyond it) auto-EXPIRES; accept returns ERR_ESTIMATE_EXPIRED (409)."
        test_recipe:
          setup: ["A SENT estimate with valid_until_iso 2026-06-01T00:00:00Z; clock advanced to 2026-06-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /sign-projects"
              payload: { customer_name: "Exp Co", site_address: "11 Late St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/l.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2026-06-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv}" }
              as: Customer
          assert:
            - "error_id == ERR_ESTIMATE_EXPIRED"
            - "http_status == 409"

      - name: terminal_warranty_claim_resolve_from_denied_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WarrantyClaim.OPEN_to_DENIED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A DENIED claim is terminal; calling resolve on it has no defined transition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An INSTALLED project with an OPEN claim decided DENY"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: ShopManager
            - call: "POST /sign-projects"
              payload: { customer_name: "Den Co", site_address: "12 No St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 12 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/dn.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv}" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/site-surveys"
              payload: { measured_clearance_ft: 30, overhead_obstruction: false, ground_bearing_ok: true }
              as: Surveyor
              captures: { survey_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/site-surveys/${survey_id}/decide"
              payload: { result: "PASS" }
              as: Surveyor
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders"
              payload: {}
              as: ShopManager
              captures: { wo_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/start"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/qc-hold"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/qc-decide"
              payload: { qc_pass: true }
              as: ShopManager
            - call: "POST /crews"
              payload: { name: "Crew D", certified_aerial: false, active: true }
              as: ShopManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "LAD-D", equipment_class: "LADDER", max_reach_ft: 16, in_service: true }
              as: ShopManager
              captures: { equip_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/install-jobs"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", equipment_id: "${equip_id}", window_start_iso: "2026-06-01T08:00:00Z", window_end_iso: "2026-06-01T09:00:00Z" }
              as: ShopManager
              captures: { job_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/install-jobs/${job_id}/dispatch"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/install-jobs/${job_id}/complete"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/warranty-claims"
              payload: { install_job_id: "${job_id}", defect_kind: "COSMETIC", reported_iso: "2026-06-10T10:00:00Z" }
              as: Customer
              captures: { claim_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/warranty-claims/${claim_id}/decide"
              payload: { decision: "DENY" }
              as: ShopManager
          trigger:
            - call: "POST /sign-projects/${proj_id}/warranty-claims/${claim_id}/resolve"
              payload: {}
              as: ShopManager
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: cancel_project_from_fabrication_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SignProject.PERMITTING_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancel is defined only from DESIGN/ESTIMATING/PERMITTING; cancelling a project in FABRICATION returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A project advanced to FABRICATION"]
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Lock Co", site_address: "13 No St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/fb.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv}" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/site-surveys"
              payload: { measured_clearance_ft: 30, overhead_obstruction: false, ground_bearing_ok: true }
              as: Surveyor
              captures: { survey_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/site-surveys/${survey_id}/decide"
              payload: { result: "PASS" }
              as: Surveyor
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders"
              payload: {}
