# =============================================================================
# Task 1390 — Corporate Filing Service & UCC Search/Filing (CSC/CT Corp style)
# Scaffold seed tables — §1.0–§1.7
# =============================================================================

scenario: |
  Corporate Filing Service & UCC Search/Filing (CSC/CT Corporation style service): filing request intake & jurisdiction determination, UCC-1 preparation with collateral description & debtor name accuracy rules, search-to-reflect verification & prior lien discovery, continuation deadline (5-year) tracking & termination filings, amendment for name/collateral change, county vs state filing office rules, rejection handling & refiling, portfolio audit & perfection reporting

domain_name: corporate-filing-ucc
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects        # termination & lapse cascades (depth 3)
    - optimistic_concurrency        # OCC on FilingRequest.version and target UCCFiling.version
    - scheduled_deferred_actions    # logical clock drives lapse sweeps & continuation windows
    - derived_field_reconciliation  # open_ucc3_request_count, fee ledgers, reflection status
  entity_topology: hierarchical     # client-rooted tree + UCCFiling self-references
  state_machine_shape: parallel     # UCCFiling effectiveness_status x reflection_status; FilingRequest has a correction cycle
  relationship_patterns:
    - one_to_many
    - self_referential              # UCCFiling.root_filing_id / supersedes_attempt_id
    - cross_aggregate               # FilingRequest.target_filing_id, LienSearch.subject_filing_id
  role_model: segregation_of_duties # preparer (intake) != approver (review)
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client organization name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE. SUSPENDED blocks submit-intake only, never in-flight work" }
      - { name: fees_charged_total_cents, type: integer, source: computed, default: 0, description: "Sum of charged_fee_cents debited across all attempt submissions for this client" }
      - { name: fees_refunded_total_cents, type: integer, source: computed, default: 0, description: "Sum of charged_fee_cents credited back across all attempt rejections for this client" }

  - name: JurisdictionProfile
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique across profiles", constraints: "unique" }
      - { name: base_fee_cents, type: integer, source: input, description: "Base filing fee for any filing kind" }
      - { name: per_additional_debtor_fee_cents, type: integer, source: input, description: "Surcharge per additional debtor beyond the first" }
      - { name: county_surcharge_cents, type: integer, source: input, description: "Extra fee when filing_office resolves to COUNTY" }
      - { name: county_filing_collateral_classes, type: array, source: input, description: "Subset of collateral classes (GENERAL | FIXTURE | TIMBER_TO_BE_CUT | AS_EXTRACTED) that must be filed at county level in this state" }
      - { name: county_names, type: array, source: input, description: "Valid county names for county filings; empty array means county filing unavailable" }
      - { name: individual_name_rule, type: enum, source: input, description: "DL_SAFE_HARBOR (individual debtor name must match drivers_license_name) | LEGAL_NAME_ONLY (must match legal_name)" }
      - { name: expedited_daily_capacity, type: integer, source: input, description: "Max EXPEDITED attempt submissions accepted per UTC calendar day for this jurisdiction" }

  - name: Debtor
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; owning client (path-scoped)" }
      - { name: debtor_type, type: enum, source: input, description: "ORGANIZATION | INDIVIDUAL" }
      - { name: legal_name, type: string, source: input, description: "Legal name of record (public organic record for organizations)" }
      - { name: jurisdiction_of_formation, type: string, source: input, description: "State of organization; required when debtor_type == ORGANIZATION", default: null }
      - { name: drivers_license_name, type: string, source: input, description: "Name on driver's license; consulted for INDIVIDUAL debtors in DL_SAFE_HARBOR jurisdictions", default: null }

  - name: SecuredParty
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; owning client (path-scoped)" }
      - { name: name, type: string, source: input, description: "Secured party name" }
      - { name: reference_code, type: string, source: input, description: "Client-side reference code", default: null }

  - name: FilingRequest
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> ClientAccount.id; requesting client" }
      - { name: kind, type: enum, source: input, description: "NEW_UCC1 | AMENDMENT | CONTINUATION | TERMINATION" }
      - { name: debtor_id, type: string, source: input, description: "FK -> Debtor.id; must belong to client_id" }
      - { name: secured_party_id, type: string, source: input, description: "FK -> SecuredParty.id; must belong to client_id" }
      - { name: jurisdiction_code, type: string, source: input, description: "References JurisdictionProfile.state_code (resolves the filing jurisdiction)" }
      - { name: collateral_class, type: enum, source: input, description: "GENERAL | FIXTURE | TIMBER_TO_BE_CUT | AS_EXTRACTED; drives county-vs-state office determination" }
      - { name: county_name, type: string, source: input, description: "Required when determined filing_office is COUNTY; must be a member of the profile's county_names", default: null }
      - { name: service_level, type: enum, source: input, default: "STANDARD", description: "STANDARD | EXPEDITED; EXPEDITED multiplies fee x1.5 and consumes daily capacity" }
      - { name: additional_debtor_count, type: integer, source: input, default: 0, description: "Number of additional debtors beyond the primary; >= 0" }
      - { name: fee_authorization_cents, type: integer, source: input, description: "Client's maximum authorized fee for any single attempt submission" }
      - { name: target_filing_id, type: string, source: input, description: "FK -> UCCFiling.id; required iff kind != NEW_UCC1; must reference an INITIAL filing", default: null }
      - { name: supporting_search_id, type: string, source: input, description: "FK -> LienSearch.id; optional pre-filing diligence search (PRE_FILING, COMPLETED)", default: null }
      - { name: filing_office, type: enum, source: computed, description: "STATE | COUNTY; computed at submit-intake from collateral_class vs profile.county_filing_collateral_classes", default: null }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Fee quote snapshot computed at approve-preparation from profile values at that instant", default: null }
      - { name: intake_submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit-intake; segregation-of-duties anchor for approve-preparation", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT_INTAKE | IN_REVIEW | READY | IN_PROCESS | CORRECTION_REQUIRED | FULFILLED | CANCELLED" }
      - { name: cancel_reason, type: enum, source: system, default: null, description: "CLIENT_REQUEST | TARGET_LAPSED | TARGET_TERMINATED; set on cancellation" }

  - name: UCCFiling
    parent: FilingRequest
    common_fields: true
    fields:
      - { name: filing_request_id, type: string, source: system, description: "FK -> FilingRequest.id; the request this attempt belongs to (path-scoped)" }
      - { name: filing_kind, type: enum, source: system, description: "INITIAL | AMENDMENT | CONTINUATION | TERMINATION; copied from request.kind at creation (NEW_UCC1 maps to INITIAL)" }
      - { name: root_filing_id, type: string, source: system, description: "FK -> UCCFiling.id; null for INITIAL; for UCC-3 kinds equals request.target_filing_id (the INITIAL filing of record)", default: null }
      - { name: supersedes_attempt_id, type: string, source: system, description: "FK -> UCCFiling.id; on a refile, the id of the latest REJECTED attempt under the same request; null for the first attempt", default: null }
      - { name: debtor_id, type: string, source: system, description: "FK -> Debtor.id; copied from the request for slot/overlap queries" }
      - { name: secured_party_id, type: string, source: system, description: "FK -> SecuredParty.id; copied from the request; mutated on the root by accepted SECURED_PARTY amendments" }
      - { name: jurisdiction_code, type: string, source: system, description: "Copied from request.jurisdiction_code" }
      - { name: filing_office, type: enum, source: system, description: "STATE | COUNTY; copied from request.filing_office" }
      - { name: county_name, type: string, source: system, description: "Copied from request.county_name; null for STATE filings", default: null }
      - { name: debtor_name_on_filing, type: string, source: input, description: "Debtor name exactly as typed on the form; validated against the name of record" }
      - { name: collateral_text, type: string, source: input, description: "Collateral description; required for INITIAL and for AMENDMENT with scope COLLATERAL; optional otherwise", default: null }
      - { name: amendment_scope, type: enum, source: input, description: "DEBTOR_NAME | COLLATERAL | SECURED_PARTY; required iff filing_kind == AMENDMENT", default: null }
      - { name: collateral_change_op, type: enum, source: input, description: "ADD | DELETE | RESTATE; required iff amendment_scope == COLLATERAL", default: null }
      - { name: secured_amount_cents, type: integer, source: input, default: 0, description: "Deal exposure carried by this filing; aggregated by perfection reports over INITIAL filings only" }
      - { name: charged_fee_cents, type: integer, source: computed, description: "Fee locked at submit time from then-current profile values", default: null }
      - { name: filing_number, type: string, source: system, description: "Filing-office-assigned number, supplied at record-acceptance", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission", default: null }
      - { name: filed_at, type: datetime, source: system, description: "Effective filing datetime supplied by the filing office at record-acceptance", default: null }
      - { name: rejected_at, type: datetime, source: system, description: "Logical-clock timestamp of rejection", default: null }
      - { name: rejection_reason_code, type: enum, source: system, description: "NAME_MISMATCH | FEE_INCORRECT | WRONG_OFFICE | MISSING_SIGNATURE | DUPLICATE_FILING | OTHER; set at rejection", default: null }
      - { name: expiration_at, type: datetime, source: computed, description: "INITIAL: filed_at + 60 months. CONTINUATION acceptance: prior expiration_at + 60 months (NOT filed_at + 60 months). AMENDMENT/TERMINATION: unchanged", default: null }
      - { name: effectiveness_status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | REJECTED | WITHDRAWN | LAPSED | TERMINATED" }
      - { name: reflection_status, type: enum, source: system, description: "UNVERIFIED | REFLECTED | DISCREPANCY; parallel dimension, evolves via verification searches only", default: "UNVERIFIED" }
      - { name: open_ucc3_request_count, type: integer, source: computed, default: 0, description: "Meaningful on INITIAL filings: count of FilingRequests with target_filing_id == this filing in states DRAFT_INTAKE | IN_REVIEW | READY | IN_PROCESS | CORRECTION_REQUIRED" }

  - name: LienSearch
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> ClientAccount.id" }
      - { name: purpose, type: enum, source: input, description: "PRE_FILING (diligence / prior-lien discovery) | POST_FILING_VERIFICATION (search-to-reflect)" }
      - { name: debtor_id, type: string, source: input, description: "FK -> Debtor.id; must belong to client_id" }
      - { name: jurisdiction_code, type: string, source: input, description: "References JurisdictionProfile.state_code" }
      - { name: county_name, type: string, source: input, default: null, description: "Optional county restriction" }
      - { name: subject_filing_id, type: string, source: input, default: null, description: "FK -> UCCFiling.id; required iff purpose == POST_FILING_VERIFICATION; subject must be effectiveness_status == ACTIVE" }
      - { name: status, type: enum, source: system, description: "ORDERED | COMPLETED | VERIFIED | DISCREPANCY" }
      - { name: through_date, type: datetime, source: system, description: "Certified-through date of the index, supplied at record-results", default: null }
      - { name: prior_lien_count, type: integer, source: computed, description: "PRE_FILING only: count of hits with hit_kind == EXACT_MATCH", default: null }
      - { name: priority_position_of_subject, type: integer, source: computed, description: "VERIFICATION only, set on VERIFIED: 1 + count of EXACT_MATCH non-subject hits that precede the subject (filed_at, then filing_number); null when DISCREPANCY", default: null }

  - name: SearchResultHit
    parent: LienSearch
    common_fields: false
    fields:
      - { name: lien_search_id, type: string, source: system, description: "FK -> LienSearch.id (path-scoped)" }
      - { name: found_debtor_name, type: string, source: input, description: "Debtor name as it appears on the found record" }
      - { name: found_filing_number, type: string, source: input, description: "Filing number of the found record" }
      - { name: found_filed_at, type: datetime, source: input, description: "Filing datetime of the found record" }
      - { name: secured_party_name, type: string, source: input, description: "Secured party name on the found record" }
      - { name: hit_kind, type: enum, source: computed, description: "EXACT_MATCH iff normalize(found_debtor_name) == normalize(name of record); else SIMILAR" }
      - { name: is_subject_filing, type: boolean, source: computed, description: "true iff the search has a subject_filing_id and found_filing_number == subject.filing_number" }

  - name: PerfectionReport
    parent: ClientAccount
    common_fields: false
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id (path-scoped)" }
      - { name: mode, type: enum, source: input, description: "AS_OF_NOW | FORWARD_PROJECTION (dual-variant calculation)" }
      - { name: horizon_days, type: integer, source: input, default: 90, description: "Lookahead window; >= 0" }
      - { name: as_of, type: datetime, source: computed, description: "AS_OF_NOW: now. FORWARD_PROJECTION: now + horizon_days" }
      - { name: active_count, type: integer, source: computed, description: "Per mode formula (see calculations.perfection_report)" }
      - { name: perfected_count, type: integer, source: computed, description: "ACTIVE and REFLECTED (projection: and expiration_at > as_of)" }
      - { name: unreflected_count, type: integer, source: computed, description: "ACTIVE and reflection in {UNVERIFIED, DISCREPANCY} (projection: and expiration_at > as_of)" }
      - { name: expiring_within_horizon_count, type: integer, source: computed, description: "ACTIVE and expiration_at <= now + horizon_days (inclusive boundary)" }
      - { name: lapsed_count, type: integer, source: computed, description: "effectiveness_status == LAPSED" }
      - { name: terminated_count, type: integer, source: computed, description: "effectiveness_status == TERMINATED" }
      - { name: projected_lapsed_count, type: integer, source: computed, description: "FORWARD_PROJECTION only: ACTIVE and expiration_at <= as_of; always 0 in AS_OF_NOW" }
      - { name: perfected_exposure_cents, type: integer, source: computed, description: "Sum of secured_amount_cents over INITIAL filings counted in perfected_count" }
      - { name: unperfected_exposure_cents, type: integer, source: computed, description: "Sum of secured_amount_cents over INITIAL filings counted in unreflected_count" }
      - { name: projected_lapsed_exposure_cents, type: integer, source: computed, description: "Sum of secured_amount_cents over INITIAL filings counted in projected_lapsed_count" }

  - name: FilingEvent
    parent: UCCFiling
    common_fields: false
    fields:
      - { name: ucc_filing_id, type: string, source: system, description: "FK -> UCCFiling.id (path-scoped)" }
      - { name: event_type, type: enum, source: system, description: "CREATED | SUBMITTED | ACCEPTED | REJECTED | WITHDRAWN | CONTINUED | AMENDED | TERMINATED | LAPSED | REVIVED | REFLECTED | DISCREPANCY_FLAGGED" }
      - { name: event_detail, type: object, source: system, description: "Structured payload (e.g. rejection_reason_code, filed_at, prior_expiration_at)" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp of the event" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ClientAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /client-accounts/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["Client must be ACTIVE (ERR_CLIENT_INVALID_STATE folded into ERR_INVALID_REQUEST-free generic state error: use ERR_CLIENT_SUSPENDED only for intake blocking)"]
        side_effects: ["status = SUSPENDED; in-flight requests and filings are NOT touched"]
        note: "Suspension blocks only submit-intake of FilingRequests (cross-entity gate)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /client-accounts/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: ["Client must be SUSPENDED"]
        side_effects: ["status = ACTIVE"]

  - entity: FilingRequest
    initial_state: DRAFT_INTAKE
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT_INTAKE
        to: IN_REVIEW
        trigger: "POST /filing-requests/{id}/submit-intake"
        actor: FilingSpecialist | FilingReviewer
        preconditions:
          - "Client status == ACTIVE (ERR_CLIENT_SUSPENDED)"
          - "For kind != NEW_UCC1: target filing effectiveness_status == ACTIVE (ERR_TARGET_FILING_NOT_ACTIVE)"
        side_effects:
          - "filing_office computed: COUNTY iff collateral_class in profile.county_filing_collateral_classes else STATE"
          - "County consistency: filing_office == COUNTY requires county_name present (ERR_COUNTY_REQUIRED) and in profile.county_names (ERR_COUNTY_NOT_IN_JURISDICTION)"
          - "intake_submitted_by_user_id = X-User-ID header"
          - "status = IN_REVIEW"
      - from: IN_REVIEW
        to: READY
        trigger: "POST /filing-requests/{id}/approve-preparation"
        actor: FilingReviewer
        preconditions:
          - "Approver X-User-ID != intake_submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If supporting_search_id set: search status == COMPLETED and through_date + 90 days >= now (ERR_SEARCH_STALE)"
        side_effects:
          - "quoted_fee_cents computed and snapshotted from CURRENT profile values"
      - from: CORRECTION_REQUIRED
        to: READY
        trigger: "POST /filing-requests/{id}/approve-preparation"
        actor: FilingReviewer
        preconditions: ["Same as IN_REVIEW -> READY"]
        side_effects: ["quoted_fee_cents recomputed (re-snapshot)"]
        note: "Correction loop: rejection -> correction -> re-approval -> resubmission."
      - from: READY
        to: IN_PROCESS
        trigger: "system (a DRAFT attempt under this request is submitted via POST /filings/{id}/submit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROCESS
        to: FULFILLED
        trigger: "system (attempt record-acceptance succeeds)"
        actor: system
        preconditions: []
        side_effects:
          - "If kind != NEW_UCC1: target root open_ucc3_request_count -= 1 and root.version += 1"
      - from: IN_PROCESS
        to: CORRECTION_REQUIRED
        trigger: "system (attempt record-rejection)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT_INTAKE
        to: CANCELLED
        trigger: "POST /filing-requests/{id}/cancel"
        actor: FilingSpecialist
        preconditions: ["status in {DRAFT_INTAKE, IN_REVIEW, READY, CORRECTION_REQUIRED} (ERR_REQUEST_IN_PROCESS when IN_PROCESS)"]
        side_effects:
          - "cancel_reason = CLIENT_REQUEST"
          - "If kind != NEW_UCC1: target root open_ucc3_request_count -= 1 and root.version += 1"
          - "Any DRAFT attempt under this request -> WITHDRAWN (event WITHDRAWN)"
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /filing-requests/{id}/cancel (same rule as DRAFT_INTAKE -> CANCELLED)"
        actor: FilingSpecialist
        preconditions: ["status in {DRAFT_INTAKE, IN_REVIEW, READY, CORRECTION_REQUIRED}"]
        side_effects: ["Same side effects as DRAFT_INTAKE -> CANCELLED"]
      - from: READY
        to: CANCELLED
        trigger: "POST /filing-requests/{id}/cancel (same rule)"
        actor: FilingSpecialist
        preconditions: ["status in {DRAFT_INTAKE, IN_REVIEW, READY, CORRECTION_REQUIRED}"]
        side_effects: ["Same side effects as DRAFT_INTAKE -> CANCELLED"]
      - from: CORRECTION_REQUIRED
        to: CANCELLED
        trigger: "POST /filing-requests/{id}/cancel (same rule)"
        actor: FilingSpecialist
        preconditions: ["status in {DRAFT_INTAKE, IN_REVIEW, READY, CORRECTION_REQUIRED}"]
        side_effects: ["Same side effects as DRAFT_INTAKE -> CANCELLED"]
      - from: DRAFT_INTAKE
        to: CANCELLED
        trigger: "system (cascade: target root filing LAPSED and this request kind == CONTINUATION, OR target root TERMINATED and this request kind in {AMENDMENT, CONTINUATION})"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_reason = TARGET_LAPSED or TARGET_TERMINATED respectively"
          - "Target root open_ucc3_request_count -= 1 and root.version += 1"
          - "Any DRAFT attempt under this request -> WITHDRAWN (event WITHDRAWN)"
        note: "Applies to requests in DRAFT_INTAKE | IN_REVIEW | READY | CORRECTION_REQUIRED; requests in IN_PROCESS are never cascade-cancelled."

  - entity: UCCFiling
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, LAPSED, TERMINATED]
    note: "TWO PARALLEL DIMENSIONS on one row: effectiveness_status (below) and reflection_status (UNVERIFIED | REFLECTED | DISCREPANCY). reflection transitions never change effectiveness and vice versa."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /filings/{id}/submit"
        actor: FilingSpecialist
        preconditions:
          - "Attempt effectiveness_status == DRAFT (ERR_FILING_INVALID_STATE)"
          - "Parent request status == READY (ERR_REQUEST_NOT_READY)"
          - "Debtor name accuracy per calculations.debtor_name_match (ERR_DEBTOR_NAME_SERIOUSLY_MISLEADING; ERR_DEBTOR_DL_NAME_MISSING when DL rule applies and no DL name on Debtor)"
          - "Collateral sufficiency for INITIAL / COLLATERAL-scope AMENDMENT (ERR_COLLATERAL_INSUFFICIENTLY_DESCRIBED)"
          - "EXPEDITED capacity for jurisdiction+UTC-day not exhausted (ERR_EXPEDITED_CAPACITY_REACHED)"
          - "charged_fee_cents <= request.fee_authorization_cents (ERR_FEE_AUTHORIZATION_EXCEEDED)"
        side_effects:
          - "charged_fee_cents computed from CURRENT profile values and locked"
          - "ClientAccount.fees_charged_total_cents += charged_fee_cents"
          - "submitted_at = now"
          - "Parent request -> IN_PROCESS"
          - "FilingEvent SUBMITTED appended"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /filings/{id}/record-acceptance"
        actor: FilingOfficer
        preconditions:
          - "Attempt effectiveness_status == SUBMITTED (ERR_FILING_INVALID_STATE)"
          - "submitted_at <= filed_at <= now (ERR_INVALID_FILED_AT)"
          - "INITIAL: no other ACTIVE INITIAL filing for same (debtor_id, jurisdiction_code, filing_office) (ERR_OVERLAPPING_ACTIVE_FILING) — half-open effectiveness interval [filed_at, expiration_at); LAPSED/TERMINATED filings free the slot"
          - "AMENDMENT / TERMINATION: root filing effectiveness_status == ACTIVE (ERR_TARGET_FILING_NOT_ACTIVE)"
          - "CONTINUATION: window_open <= filed_at < root.expiration_at where window_open = root.expiration_at - 6 months (ERR_CONTINUATION_OUTSIDE_WINDOW); root state ACTIVE-or-LAPSED both acceptable (in-window late recording revives)"
        side_effects:
          - "filing_number and filed_at stored; effectiveness_status = ACTIVE; FilingEvent ACCEPTED appended"
          - "INITIAL: expiration_at = filed_at + 60 months"
          - "CONTINUATION: root.expiration_at = root.expiration_at + 60 months (anchored to prior expiration, NOT to filed_at); if root was LAPSED, root -> ACTIVE with FilingEvent REVIVED; root FilingEvent CONTINUED; root.version += 1"
          - "AMENDMENT scope DEBTOR_NAME: root.debtor_name_on_filing = this attempt's debtor_name_on_filing; root FilingEvent AMENDED; root.version += 1"
          - "AMENDMENT scope COLLATERAL: op ADD appends (';' separator), DELETE removes substring (ERR_COLLATERAL_NOT_PRESENT at acceptance if absent), RESTATE replaces root.collateral_text; root FilingEvent AMENDED; root.version += 1"
          - "AMENDMENT scope SECURED_PARTY: root.secured_party_id = request.secured_party_id; root FilingEvent AMENDED; root.version += 1"
          - "TERMINATION: root -> TERMINATED (FilingEvent TERMINATED; root.version += 1); cascade: other open UCC-3 requests (AMENDMENT/CONTINUATION kinds in DRAFT_INTAKE | IN_REVIEW | READY | CORRECTION_REQUIRED) targeting root -> CANCELLED with cancel_reason TARGET_TERMINATED; their DRAFT attempts -> WITHDRAWN"
          - "Parent request -> FULFILLED (with UCC-3 count decrement on root when kind != INITIAL)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /filings/{id}/record-rejection"
        actor: FilingOfficer
        preconditions: ["Attempt effectiveness_status == SUBMITTED (ERR_FILING_INVALID_STATE)"]
        side_effects:
          - "rejection_reason_code, rejection_note, rejected_at stored"
          - "ClientAccount.fees_refunded_total_cents += charged_fee_cents"
          - "Parent request -> CORRECTION_REQUIRED"
          - "FilingEvent REJECTED appended"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /filings/{id}/withdraw OR system cascade (request cancelled / target lapsed / target terminated)"
        actor: FilingSpecialist | system
        preconditions: ["Attempt effectiveness_status == DRAFT (ERR_FILING_INVALID_STATE)"]
        side_effects: ["FilingEvent WITHDRAWN appended"]
      - from: ACTIVE
        to: LAPSED
        trigger: "system (lapse sweep run on POST /_clock/set_current_utc and at the start of perfection-report generation: every ACTIVE filing with expiration_at <= now)"
        actor: system
        preconditions: ["expiration_at <= now (boundary: equality lapses)"]
        side_effects:
          - "FilingEvent LAPSED appended"
          - "Cascade: open CONTINUATION-kind requests targeting this filing (DRAFT_INTAKE | IN_REVIEW | READY | CORRECTION_REQUIRED) -> CANCELLED with cancel_reason TARGET_LAPSED; their DRAFT attempts -> WITHDRAWN"
      - from: LAPSED
        to: ACTIVE
        trigger: "system (record-acceptance of a CONTINUATION whose filed_at falls inside the window computed from the pre-lapse expiration_at)"
        actor: system
        preconditions: ["window_open <= filed_at < expiration_at (pre-lapse expiration)"]
        side_effects: ["FilingEvent REVIVED appended; expiration_at = prior expiration_at + 60 months"]
        note: "Revival loop: LAPSED -> ACTIVE only via in-window late-recorded continuation."
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (record-acceptance of a TERMINATION-kind attempt whose root_filing_id == this filing)"
        actor: system
        preconditions: []
        side_effects: ["FilingEvent TERMINATED appended; open UCC-3 request cascade per record-acceptance"]

  - entity: LienSearch
    initial_state: ORDERED
    terminal_states: [COMPLETED, VERIFIED, DISCREPANCY]
    transitions:
      - from: ORDERED
        to: COMPLETED
        trigger: "POST /lien-searches/{id}/record-results (purpose == PRE_FILING)"
        actor: SearchAnalyst
        preconditions: ["Search status == ORDERED (ERR_SEARCH_NOT_ORDERED)", "through_date <= now (ERR_INVALID_REQUEST)"]
        side_effects:
          - "SearchResultHit children created; hit_kind computed per calculations.debtor_name_match normalization against the Debtor name of record"
          - "prior_lien_count = count of hits with hit_kind == EXACT_MATCH"
      - from: ORDERED
        to: VERIFIED
        trigger: "POST /lien-searches/{id}/record-results (purpose == POST_FILING_VERIFICATION and a hit with is_subject_filing == true exists)"
        actor: SearchAnalyst
        preconditions: ["Search status == ORDERED (ERR_SEARCH_NOT_ORDERED)", "through_date >= subject.filed_at (ERR_SEARCH_THROUGH_DATE_TOO_EARLY)", "through_date <= now (ERR_INVALID_REQUEST)"]
        side_effects:
          - "SearchResultHit children created and classified"
          - "priority_position_of_subject computed per calculations.priority_position"
          - "subject filing reflection_status -> REFLECTED (from UNVERIFIED or DISCREPANCY); FilingEvent REFLECTED appended to subject"
      - from: ORDERED
        to: DISCREPANCY
        trigger: "POST /lien-searches/{id}/record-results (purpose == POST_FILING_VERIFICATION and NO hit with is_subject_filing == true)"
        actor: SearchAnalyst
        preconditions: ["Search status == ORDERED", "through_date >= subject.filed_at (ERR_SEARCH_THROUGH_DATE_TOO_EARLY)"]
        side_effects:
          - "SearchResultHit children created and classified"
          - "priority_position_of_subject = null"
          - "If subject.reflection_status == UNVERIFIED: -> DISCREPANCY; FilingEvent DISCREPANCY_FLAGGED appended. REFLECTED is never downgraded."

# =============================================================================
# §1.2.1 Concurrency Rules (true OCC races only)
# =============================================================================
concurrency_rules:
  - rule_id: patch-request-stale-version
    parent_entity: FilingRequest
    write_endpoint: "PATCH /filing-requests/{id}"
    occ_field: "expected_request_version"
    description: |
      Updating a FilingRequest whose version has advanced since the client last
      observed it is rejected. A second PATCH carrying the version it read before
      the first PATCH committed is stale: the first PATCH legitimately succeeded
      and bumped version, so the second write is refused instead of silently
      overwriting.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ucc3-create-stale-target
    parent_entity: UCCFiling
    write_endpoint: "POST /filing-requests"
    occ_field: "expected_target_filing_version"
    description: |
      Creating an AMENDMENT / CONTINUATION / TERMINATION request against a root
      filing whose version has advanced since the client last observed it (for
      example because another UCC-3 request was just opened against it, which
      bumps open_ucc3_request_count and version) is rejected as stale. Applies
      only when kind != NEW_UCC1.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: filing_office_determination
    trigger: "POST /filing-requests/{id}/submit-intake (and re-evaluated on PATCH while status == IN_REVIEW)"
    algorithm: constraint_propagation
    formula: |
      profile = JurisdictionProfile with state_code == request.jurisdiction_code
      filing_office = COUNTY if request.collateral_class IN profile.county_filing_collateral_classes
                      else STATE
      If filing_office == COUNTY:
        county_name must be present (ERR_COUNTY_REQUIRED)
        county_name must be IN profile.county_names (ERR_COUNTY_NOT_IN_JURISDICTION)
    input_set: "The FilingRequest and its resolved JurisdictionProfile"
    constants: {}
    precision: "n/a (categorical)"

  - name: debtor_name_match
    trigger: "POST /filings/{id}/submit (all kinds); GET /filings/{id}/name-check; LienSearch hit classification"
    algorithm: weighted_scoring
    formula: |
      normalize(s) = uppercase(s) -> remove every char not in [A-Z0-9 space]
                     -> collapse runs of spaces to one -> trim
      name_of_record =
        if Debtor.debtor_type == ORGANIZATION: Debtor.legal_name
        if Debtor.debtor_type == INDIVIDUAL:
          if profile.individual_name_rule == DL_SAFE_HARBOR:
            Debtor.drivers_license_name (missing/null -> ERR_DEBTOR_DL_NAME_MISSING)
          else: Debtor.legal_name
      match := normalize(attempt.debtor_name_on_filing) == normalize(name_of_record)
      Mismatch at submit -> ERR_DEBTOR_NAME_SERIOUSLY_MISLEADING
      Search hits: hit_kind = EXACT_MATCH iff normalize(found_debtor_name) == normalize(name_of_record),
      else SIMILAR. Only EXACT_MATCH hits count toward prior_lien_count and priority position.
    input_set: "Attempt debtor_name_on_filing; Debtor of record; JurisdictionProfile of the request"
    constants: {}
    precision: "n/a (boolean)"

  - name: filing_fee
    trigger: "Variant QUOTED: approve-preparation (snapshot onto request.quoted_fee_cents). Variant CHARGED: attempt submit (lock onto attempt.charged_fee_cents)."
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = profile.base_fee_cents
                     + profile.per_additional_debtor_fee_cents * request.additional_debtor_count
                     + (profile.county_surcharge_cents if request.filing_office == COUNTY else 0)
                     + KIND_FEE_DELTA_CENTS[request.kind]
      fee_cents = round_half_up(subtotal_cents * 1.5) if request.service_level == EXPEDITED
                  else subtotal_cents
      ROUNDING ORDER (pinned): the multiplier is applied ONCE to the integer subtotal and the
      product is rounded half-up to integer cents in a single final step. Per-component rounding
      before summation is forbidden.
      Both variants use identical formula; they differ ONLY in which profile values are read:
      QUOTED reads values at approve-preparation time, CHARGED reads values at submit time.
    input_set: "FilingRequest fields + JurisdictionProfile values live at the variant's evaluation instant"
    constants:
      EXPEDITED_MULTIPLIER: 1.5
      KIND_FEE_DELTA_CENTS: { NEW_UCC1: 0, AMENDMENT: 1000, CONTINUATION: 1500, TERMINATION: 500 }
    precision: "integer cents, round_half_up (single final rounding step)"
    variants:
      - name: quoted_fee
        when: "approve-preparation (IN_REVIEW -> READY and CORRECTION_REQUIRED -> READY)"
        difference: "Reads profile values at approval instant; stored on request.quoted_fee_cents"
      - name: charged_fee
        when: "attempt submit (DRAFT -> SUBMITTED)"
        difference: "Reads profile values at submission instant; stored on attempt.charged_fee_cents; diverges from quoted_fee whenever the profile was updated between the two instants"

  - name: expiration_computation
    trigger: "record-acceptance (INITIAL sets; CONTINUATION extends); lapse sweep reads it"
    algorithm: threshold
    formula: |
      INITIAL acceptance: expiration_at = filed_at + 60 calendar months (same day-of-month)
      CONTINUATION acceptance (EVALUATION ORDER PINNED):
        step 1: read root.expiration_at as currently stored (pre-extension)
        step 2: new_expiration = stored_expiration + 60 calendar months
        step 3: persist new_expiration
        The continuation's own filed_at MUST NOT be used as the anchor: continuation extends
        from the date the filing would have lapsed, not from when it was filed.
      AMENDMENT / TERMINATION acceptance: expiration_at unchanged.
      Continuation window: window_open = root.expiration_at - 6 months;
        valid iff window_open <= filed_at < root.expiration_at
        (lower bound INCLUSIVE, upper bound EXCLUSIVE).
      Lapse: ACTIVE filing lapses when expiration_at <= now (equality lapses).
    input_set: "The attempt being accepted and its root filing"
    constants:
      EFFECTIVENESS_MONTHS: 60
      CONTINUATION_WINDOW_MONTHS: 6
    precision: "ISO 8601 UTC datetimes, second precision"

  - name: lapse_sweep
    trigger: "POST /_clock/set_current_utc (after the clock moves) and at the start of perfection-report generation; GET /filings/{id} lazily re-checks that one filing"
    algorithm: threshold
    formula: |
      for each UCCFiling with effectiveness_status == ACTIVE and expiration_at <= now:
        -> LAPSED (boundary: expiration_at == now lapses)
        cascade per state machine (open CONTINUATION requests -> CANCELLED TARGET_LAPSED,
        their DRAFT attempts -> WITHDRAWN)
    input_set: "All ACTIVE filings (sweep) or the single fetched filing (lazy refresh)"
    constants: {}
    precision: "second precision, UTC"

  - name: priority_position
    trigger: "record-results on a POST_FILING_VERIFICATION search that reaches VERIFIED"
    algorithm: chronological
    formula: |
      competing = hits where hit_kind == EXACT_MATCH and is_subject_filing == false
      position = 1 + count(h in competing where
                     h.found_filed_at < subject.filed_at
                     OR (h.found_filed_at == subject.filed_at
                         AND h.found_filing_number < subject.filing_number))
      Sort semantics pinned: chronological by found_filed_at ASC, ties broken by
      found_filing_number ASC (lexicographic). Empty competing set -> position 1.
      Subject absent -> search is DISCREPANCY and priority_position_of_subject stays null.
    input_set: "Hits recorded on this verification search + the subject filing"
    constants: {}
    precision: "integer position, 1-based"

  - name: perfection_report
    trigger: "POST /client-accounts/{id}/perfection-reports (runs lapse sweep first)"
    algorithm: aggregation
    formula: |
      Universe U = all UCCFiling attempts whose parent request.client_id == clientId.
      Exposure sums aggregate ONLY attempts with filing_kind == INITIAL (UCC-3s never
      double-count exposure).
      Shared predicates:
        is_active(f)    := f.effectiveness_status == ACTIVE
        is_reflected(f) := f.reflection_status == REFLECTED
      Variant AS_OF_NOW:
        as_of = now
        active_count   = count(f in U : is_active(f))
        perfected_count   = count(is_active and is_reflected)
        unreflected_count = count(is_active and reflection in {UNVERIFIED, DISCREPANCY})
        expiring_within_horizon_count = count(is_active and expiration_at <= now + horizon_days)
          (boundary INCLUSIVE: expiration_at == now + horizon_days is counted)
        lapsed_count     = count(effectiveness == LAPSED)
        terminated_count = count(effectiveness == TERMINATED)
        projected_lapsed_count = 0
        perfected_exposure_cents   = sum(secured_amount_cents over INITIAL in perfected set)
        unperfected_exposure_cents = sum(secured_amount_cents over INITIAL in unreflected set)
        projected_lapsed_exposure_cents = 0
      Variant FORWARD_PROJECTION (as_of = now + horizon_days):
        projected_lapsed_count = count(is_active and expiration_at <= as_of)
        active_count   = count(is_active and expiration_at > as_of)
        perfected_count   = count(is_active and is_reflected and expiration_at > as_of)
        unreflected_count = count(is_active and not reflected and expiration_at > as_of)
        expiring_within_horizon_count = projected_lapsed_count
        lapsed_count / terminated_count: same as AS_OF_NOW
        exposures: same sets restricted by expiration_at > as_of (projected set for projected)
      Projection deliberately IGNORES in-flight continuation requests: it is a pure
      no-action projection.
    input_set: "All attempts of the client after lapse sweep; horizon_days; mode"
    constants:
      DEFAULT_HORIZON_DAYS: 90
    precision: "integer counts and cents"
    variants:
      - name: as_of_now
        when: "mode == AS_OF_NOW"
        difference: "Counts buckets by current effectiveness at the current instant"
      - name: forward_projection
        when: "mode == FORWARD_PROJECTION"
        difference: "Reclassifies filings whose expiration_at <= now + horizon_days into projected_lapsed (with exposure), shrinking active/perfected accordingly"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role name recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: business_constraint
    check: "Structural body validation: required fields present, types correct, enum members valid; conditional requirements: kind != NEW_UCC1 requires target_filing_id (ERR_TARGET_FILING_REQUIRED) and expected_target_filing_version; AMENDMENT attempts require amendment_scope; scope COLLATERAL requires collateral_change_op and collateral_text; INITIAL attempts require collateral_text"
    error_id: "ERR_INVALID_REQUEST (or ERR_TARGET_FILING_REQUIRED for missing target)"
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 3
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "ClientManager X-User-ID must equal the client id in the path for /client-accounts/{id} and everything under it"
    error_id: ERR_CLIENT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "client-scoped endpoints"
  - priority: 5
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_SEARCH_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_DEBTOR_NOT_FOUND | ERR_SECURED_PARTY_NOT_FOUND | ERR_JURISDICTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 6
    category: existence
    check: "Body references exist and belong to the declared client: jurisdiction_code resolves a JurisdictionProfile (ERR_JURISDICTION_NOT_FOUND); debtor_id / secured_party_id exist under client_id (ERR_DEBTOR_NOT_FOUND / ERR_SECURED_PARTY_NOT_FOUND); target_filing_id / subject_filing_id exist (ERR_FILING_NOT_FOUND); supporting_search_id exists (ERR_SEARCH_NOT_FOUND)"
    error_id: "per-reference 404 ids"
    http_status: 404
    applies_to: "endpoints with body references"
  - priority: 7
    category: state
    check: "State preconditions: client ACTIVE for submit-intake (ERR_CLIENT_SUSPENDED); request in correct from-state per transition (ERR_REQUEST_INVALID_STATE); request READY for attempt creation (ERR_REQUEST_NOT_READY); attempt in correct from-state (ERR_FILING_INVALID_STATE); search ORDERED for record-results (ERR_SEARCH_NOT_ORDERED); target root ACTIVE where required (ERR_TARGET_FILING_NOT_ACTIVE); OCC: expected_*_version equals current version (ERR_STALE_VERSION)"
    error_id: "state error ids incl. ERR_STALE_VERSION"
    http_status: "409 (412 for OCC)"
    applies_to: "state-transition and OCC-guarded endpoints"
  - priority: 8
    category: business_safety
    check: "Compliance/safety: segregation of duties (ERR_SEGREGATION_OF_DUTIES); debtor name accuracy (ERR_DEBTOR_NAME_SERIOUSLY_MISLEADING, ERR_DEBTOR_DL_NAME_MISSING); collateral sufficiency (ERR_COLLATERAL_INSUFFICIENTLY_DESCRIBED); county office consistency (ERR_COUNTY_REQUIRED, ERR_COUNTY_NOT_IN_JURISDICTION); perfection-slot overlap (ERR_OVERLAPPING_ACTIVE_FILING); collateral DELETE presence (ERR_COLLATERAL_NOT_PRESENT)"
    error_id: "safety error ids"
    http_status: "403 / 409 / 422"
    applies_to: "submit-intake, approve-preparation, attempt submit, record-acceptance"
  - priority: 9
    category: business_temporal
    check: "Temporal rules in order: filed_at within [submitted_at, now] (ERR_INVALID_FILED_AT); continuation window (ERR_CONTINUATION_OUTSIDE_WINDOW); refile window now <= rejected_at + 30 days (ERR_REFILE_WINDOW_EXPIRED); supporting-search freshness through_date + 90 days >= now (ERR_SEARCH_STALE); verification through_date >= subject.filed_at (ERR_SEARCH_THROUGH_DATE_TOO_EARLY)"
    error_id: "temporal error ids"
    http_status: 422
    applies_to: "record-acceptance, attempt creation, approve-preparation, record-results"
  - priority: 10
    category: business_constraint
    check: "Constraint satisfaction: at most one non-terminal attempt per request (ERR_ATTEMPT_IN_FLIGHT); at most one open AMENDMENT/CONTINUATION request per root filing (ERR_UCC3_IN_FLIGHT; TERMINATION exempt); EXPEDITED daily capacity per jurisdiction (ERR_EXPEDITED_CAPACITY_REACHED); state_code uniqueness (ERR_DUPLICATE_STATE_CODE)"
    error_id: "constraint error ids"
    http_status: 409
    applies_to: "attempt creation, filing-request creation, attempt submit, profile creation"
  - priority: 11
    category: business_fiscal
    check: "charged_fee_cents (computed from current profile) must be <= request.fee_authorization_cents"
    error_id: ERR_FEE_AUTHORIZATION_EXCEEDED
    http_status: 402
    applies_to: "POST /filings/{id}/submit"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock. Side effect: runs the lapse sweep (calculations.lapse_sweep) at the new instant."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["lapse sweep at new instant (ACTIVE filings with expiration_at <= now -> LAPSED + cascade)"]

  - method: POST
    path: "/client-accounts"
    description: "Create a client account"
    roles: [PlatformAdmin]
    code: 201
    input: [name]
    output: ClientAccount
    side_effects: ["status = ACTIVE", "fee totals initialized to 0"]

  - method: GET
    path: "/client-accounts"
    description: "List client accounts (paginated)"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClientAccount[]"
    side_effects: []

  - method: GET
    path: "/client-accounts/{id}"
    description: "Get a client account"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []

  - method: POST
    path: "/client-accounts/{id}/suspend"
    description: "Suspend a client (blocks submit-intake only)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/client-accounts/{id}/reinstate"
    description: "Reinstate a suspended client"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/jurisdiction-profiles"
    description: "Register a jurisdiction (state) filing profile"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, base_fee_cents, per_additional_debtor_fee_cents, county_surcharge_cents, county_filing_collateral_classes, county_names, individual_name_rule, expedited_daily_capacity]
    output: JurisdictionProfile
    side_effects: ["state_code uniqueness enforced (ERR_DUPLICATE_STATE_CODE)"]

  - method: GET
    path: "/jurisdiction-profiles"
    description: "List jurisdiction profiles"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "JurisdictionProfile[]"
    side_effects: []

  - method: GET
    path: "/jurisdiction-profiles/{id}"
    description: "Get a jurisdiction profile"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: JurisdictionProfile
    side_effects: []

  - method: PUT
    path: "/jurisdiction-profiles/{id}"
    description: "Update fee/rule fields of a jurisdiction profile (drives quoted-vs-charged divergence)"
    roles: [PlatformAdmin]
    code: 200
    input: ["base_fee_cents?", "per_additional_debtor_fee_cents?", "county_surcharge_cents?", "county_filing_collateral_classes?", "county_names?", "individual_name_rule?", "expedited_daily_capacity?"]
    output: JurisdictionProfile
    side_effects: ["increments JurisdictionProfile.version by 1"]

  - method: POST
    path: "/client-accounts/{id}/debtors"
    description: "Register a debtor under a client"
    roles: [ClientManager]
    code: 201
    input: [debtor_type, legal_name, "jurisdiction_of_formation?", "drivers_license_name?"]
    output: Debtor
    side_effects: []

  - method: GET
    path: "/client-accounts/{id}/debtors"
    description: "List a client's debtors"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "Debtor[]"
    side_effects: []

  - method: GET
    path: "/debtors/{id}"
    description: "Get a debtor"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: Debtor
    side_effects: []

  - method: PATCH
    path: "/debtors/{id}"
    description: "Update debtor name-of-record fields (e.g. legal name change before a DEBTOR_NAME amendment)"
    roles: [ClientManager]
    code: 200
    input: ["legal_name?", "drivers_license_name?", "jurisdiction_of_formation?"]
    output: Debtor
    side_effects: ["increments Debtor.version by 1"]

  - method: POST
    path: "/client-accounts/{id}/secured-parties"
    description: "Register a secured party under a client"
    roles: [ClientManager]
    code: 201
    input: [name, "reference_code?"]
    output: SecuredParty
    side_effects: []

  - method: GET
    path: "/client-accounts/{id}/secured-parties"
    description: "List a client's secured parties"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "SecuredParty[]"
    side_effects: []

  - method: GET
    path: "/secured-parties/{id}"
    description: "Get a secured party"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: SecuredParty
    side_effects: []

  - method: POST
    path: "/filing-requests"
    description: "Intake a filing request. For kind != NEW_UCC1, target_filing_id and expected_target_filing_version are required (OCC on the target root filing)."
    roles: [FilingSpecialist]
    code: 201
    input: [client_id, kind, debtor_id, secured_party_id, jurisdiction_code, collateral_class, "county_name?", "service_level?", "additional_debtor_count?", fee_authorization_cents, "target_filing_id?", "supporting_search_id?", "expected_target_filing_version?"]
    output: FilingRequest
    side_effects:
      - "status = DRAFT_INTAKE"
      - "For kind != NEW_UCC1: target root open_ucc3_request_count += 1 and increments target UCCFiling.version by 1"
      - "OCC: expected_target_filing_version must equal target.version (ERR_STALE_VERSION)"

  - method: GET
    path: "/filing-requests"
    description: "List filing requests with filters"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["client_id?", "debtor_id?", "secured_party_id?", "target_filing_id?", "supporting_search_id?", "status?", "kind?", "limit?", "offset?"]
    output: "FilingRequest[]"
    side_effects: []

  - method: GET
    path: "/filing-requests/{id}"
    description: "Get a filing request"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: FilingRequest
    side_effects: []

  - method: PATCH
    path: "/filing-requests/{id}"
    description: "Correct preparation fields on a non-terminal, pre-IN_PROCESS request (OCC-guarded)"
    roles: [FilingSpecialist]
    code: 200
    input: ["collateral_class?", "county_name?", "service_level?", "additional_debtor_count?", "fee_authorization_cents?", "supporting_search_id?", expected_request_version]
    output: FilingRequest
    side_effects:
      - "increments FilingRequest.version by 1"
      - "allowed only from DRAFT_INTAKE | IN_REVIEW | CORRECTION_REQUIRED (ERR_REQUEST_INVALID_STATE)"
      - "if collateral_class or county_name changed while IN_REVIEW: filing_office recomputed per calculations.filing_office_determination"

  - method: POST
    path: "/filing-requests/{id}/submit-intake"
    description: "Submit intake: determines jurisdiction filing office (county vs state)"
    roles: [FilingSpecialist, FilingReviewer]
    code: 200
    input: []
    output: FilingRequest
    side_effects: ["status -> IN_REVIEW", "filing_office computed", "intake_submitted_by_user_id recorded"]

  - method: POST
    path: "/filing-requests/{id}/approve-preparation"
    description: "Reviewer approves preparation; segregation of duties vs intake submitter; snapshots quoted fee"
    roles: [FilingReviewer]
    code: 200
    input: []
    output: FilingRequest
    side_effects: ["status -> READY", "quoted_fee_cents snapshot from current profile values"]

  - method: POST
    path: "/filing-requests/{id}/cancel"
    description: "Cancel a pre-IN_PROCESS request"
    roles: [FilingSpecialist]
    code: 200
    input: []
    output: FilingRequest
    side_effects: ["status -> CANCELLED (cancel_reason CLIENT_REQUEST)", "UCC-3 count compensation on target", "DRAFT attempt -> WITHDRAWN"]

  - method: POST
    path: "/filing-requests/{id}/attempts"
    description: "Create a UCC filing attempt (DRAFT) under a READY request; refile links supersedes_attempt_id to the latest REJECTED attempt"
    roles: [FilingSpecialist]
    code: 201
    input: [debtor_name_on_filing, "collateral_text?", "amendment_scope?", "collateral_change_op?", "secured_amount_cents?"]
    output: UCCFiling
    side_effects:
      - "effectiveness_status = DRAFT, reflection_status = UNVERIFIED"
      - "FilingEvent CREATED appended"
      - "request fields copied (filing_kind, debtor_id, secured_party_id, jurisdiction_code, filing_office, county_name)"
      - "refile: supersedes_attempt_id = latest REJECTED attempt of this request; refile window now <= rejected_at + 30 days (ERR_REFILE_WINDOW_EXPIRED, inclusive boundary)"

  - method: GET
    path: "/filing-requests/{id}/attempts"
    description: "List attempts under a request"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "UCCFiling[]"
    side_effects: []

  - method: GET
    path: "/filings"
    description: "List filings with filters (serves all UCCFiling FK reverse lookups)"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["debtor_id?", "secured_party_id?", "root_filing_id?", "supersedes_attempt_id?", "effectiveness_status?", "reflection_status?", "jurisdiction_code?", "limit?", "offset?"]
    output: "UCCFiling[]"
    side_effects: []

  - method: GET
    path: "/filings/{id}"
    description: "Get a filing; lazily applies the lapse rule to this filing before responding"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: UCCFiling
    side_effects: ["lazy lapse refresh for this filing"]

  - method: GET
    path: "/filings/{id}/name-check"
    description: "Computed read: debtor-name accuracy check per calculations.debtor_name_match (no mutation)"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: "{ match: boolean, normalized_submitted: string, normalized_of_record: string, name_rule_applied: string }"
    side_effects: []

  - method: POST
    path: "/filings/{id}/submit"
    description: "Submit a DRAFT attempt to the filing office (full validation chain; locks charged fee)"
    roles: [FilingSpecialist]
    code: 200
    input: []
    output: UCCFiling
    side_effects: ["effectiveness_status -> SUBMITTED", "charged_fee_cents locked", "client fee ledger debited", "request -> IN_PROCESS", "FilingEvent SUBMITTED"]

  - method: POST
    path: "/filings/{id}/record-acceptance"
    description: "Filing office records acceptance with office-assigned filing_number and filed_at"
    roles: [FilingOfficer]
    code: 200
    input: [filing_number, filed_at]
    output: UCCFiling
    side_effects: ["effectiveness_status -> ACTIVE", "kind-specific root effects (expiration set/extend, amendment apply, termination cascade)", "request -> FULFILLED", "FilingEvents appended"]

  - method: POST
    path: "/filings/{id}/record-rejection"
    description: "Filing office rejects a SUBMITTED attempt"
    roles: [FilingOfficer]
    code: 200
    input: [rejection_reason_code, "rejection_note?"]
    output: UCCFiling
    side_effects: ["effectiveness_status -> REJECTED", "fee refunded to client ledger", "request -> CORRECTION_REQUIRED", "FilingEvent REJECTED"]

  - method: POST
    path: "/filings/{id}/withdraw"
    description: "Withdraw a DRAFT attempt"
    roles: [FilingSpecialist]
    code: 200
    input: []
    output: UCCFiling
    side_effects: ["effectiveness_status -> WITHDRAWN", "FilingEvent WITHDRAWN"]

  - method: GET
    path: "/filings/{id}/events"
    description: "List the filing's audit events in chronological order"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "FilingEvent[]"
    side_effects: []

  - method: POST
    path: "/lien-searches"
    description: "Order a lien search (pre-filing diligence or post-filing verification)"
    roles: [FilingSpecialist]
    code: 201
    input: [client_id, purpose, debtor_id, jurisdiction_code, "county_name?", "subject_filing_id?"]
    output: LienSearch
    side_effects: ["status = ORDERED"]

  - method: GET
    path: "/lien-searches"
    description: "List lien searches with filters"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["client_id?", "debtor_id?", "subject_filing_id?", "purpose?", "status?", "limit?", "offset?"]
    output: "LienSearch[]"
    side_effects: []

  - method: GET
    path: "/lien-searches/{id}"
    description: "Get a lien search"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: LienSearch
    side_effects: []

  - method: POST
    path: "/lien-searches/{id}/record-results"
    description: "Record certified search results: creates hits, classifies them, and resolves VERIFIED / DISCREPANCY / COMPLETED"
    roles: [SearchAnalyst]
    code: 200
    input: [through_date, hits]
    output: LienSearch
    side_effects: ["SearchResultHit children created", "hit_kind + is_subject_filing computed", "prior_lien_count or priority_position_of_subject computed", "subject reflection_status transition + FilingEvent"]

  - method: GET
    path: "/lien-searches/{id}/hits"
    description: "List recorded search hits"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "SearchResultHit[]"
    side_effects: []

  - method: POST
    path: "/client-accounts/{id}/perfection-reports"
    description: "Generate a portfolio perfection report snapshot (runs lapse sweep first)"
    roles: [ClientManager, FilingSpecialist]
    code: 201
    input: [mode, "horizon_days?"]
    output: PerfectionReport
    side_effects: ["lapse sweep", "all counts/exposures computed per calculations.perfection_report"]

  - method: GET
    path: "/client-accounts/{id}/perfection-reports"
    description: "List a client's perfection reports"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "PerfectionReport[]"
    side_effects: []

  - method: GET
    path: "/perfection-reports/{id}"
    description: "Get a perfection report snapshot"
    roles: [PlatformAdmin, ClientManager, FilingSpecialist, FilingReviewer, FilingOfficer, SearchAnalyst]
    code: 200
    input: []
    output: PerfectionReport
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/type/enum violation or conditionally-required field absent (collateral_text for INITIAL, amendment_scope for AMENDMENT, etc.)" }
  - { id: ERR_TARGET_FILING_REQUIRED, http: 400, condition: "kind != NEW_UCC1 without target_filing_id" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_CLIENT_OWNERSHIP_MISMATCH, http: 403, condition: "ClientManager acting on another client's resources" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "approve-preparation attempted by the same user who submitted intake" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "ClientAccount id not found" }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "No JurisdictionProfile for the given state_code / id" }
  - { id: ERR_DEBTOR_NOT_FOUND, http: 404, condition: "Debtor not found (or not under the declared client)" }
  - { id: ERR_SECURED_PARTY_NOT_FOUND, http: 404, condition: "SecuredParty not found (or not under the declared client)" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "FilingRequest id not found" }
  - { id: ERR_FILING_NOT_FOUND, http: 404, condition: "UCCFiling id not found (including target_filing_id / subject_filing_id references)" }
  - { id: ERR_SEARCH_NOT_FOUND, http: 404, condition: "LienSearch id not found (including supporting_search_id references)" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "PerfectionReport id not found" }
  - { id: ERR_DUPLICATE_STATE_CODE, http: 409, condition: "JurisdictionProfile with this state_code already exists" }
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "submit-intake while client status == SUSPENDED" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "FilingRequest not in a valid from-state for the requested transition" }
  - { id: ERR_REQUEST_IN_PROCESS, http: 409, condition: "cancel attempted while request is IN_PROCESS" }
  - { id: ERR_REQUEST_NOT_READY, http: 409, condition: "attempt creation requires request status == READY" }
  - { id: ERR_ATTEMPT_IN_FLIGHT, http: 409, condition: "request already has a non-terminal (DRAFT or SUBMITTED) attempt" }
  - { id: ERR_UCC3_IN_FLIGHT, http: 409, condition: "root filing already has an open AMENDMENT/CONTINUATION request (TERMINATION exempt)" }
  - { id: ERR_FILING_INVALID_STATE, http: 409, condition: "Attempt not in a valid from-state for the requested transition" }
  - { id: ERR_TARGET_FILING_NOT_ACTIVE, http: 409, condition: "UCC-3 intake/acceptance or verification-search creation requires target/subject filing effectiveness_status == ACTIVE" }
  - { id: ERR_SEARCH_NOT_ORDERED, http: 409, condition: "record-results requires search status == ORDERED" }
  - { id: ERR_OVERLAPPING_ACTIVE_FILING, http: 409, condition: "Acceptance would create a second ACTIVE INITIAL filing for the same (debtor_id, jurisdiction_code, filing_office) effectiveness interval" }
  - { id: ERR_EXPEDITED_CAPACITY_REACHED, http: 409, condition: "EXPEDITED submissions for this jurisdiction on this UTC day already equal expedited_daily_capacity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_COUNTY_REQUIRED, http: 400, condition: "filing_office resolved to COUNTY but county_name absent" }
  - { id: ERR_COUNTY_NOT_IN_JURISDICTION, http: 422, condition: "county_name not a member of the profile's county_names" }
  - { id: ERR_DEBTOR_NAME_SERIOUSLY_MISLEADING, http: 422, condition: "Normalized debtor_name_on_filing does not equal the normalized name of record" }
  - { id: ERR_DEBTOR_DL_NAME_MISSING, http: 422, condition: "Individual debtor in a DL_SAFE_HARBOR jurisdiction without drivers_license_name" }
  - { id: ERR_COLLATERAL_INSUFFICIENTLY_DESCRIBED, http: 422, condition: "collateral_text shorter than 20 characters or a supergeneric term ('ALL ASSETS', 'ALL PERSONAL PROPERTY', 'ALL ASSETS OF DEBTOR' after normalization)" }
  - { id: ERR_COLLATERAL_NOT_PRESENT, http: 422, condition: "COLLATERAL DELETE amendment whose collateral_text is not a substring of the root filing's collateral_text" }
  - { id: ERR_CONTINUATION_OUTSIDE_WINDOW, http: 422, condition: "Continuation filed_at outside [expiration_at - 6 months, expiration_at) — lower bound inclusive, upper exclusive" }
  - { id: ERR_REFILE_WINDOW_EXPIRED, http: 422, condition: "Refile attempt created more than 30 days after the latest rejection (window inclusive at exactly rejected_at + 30 days)" }
  - { id: ERR_SEARCH_STALE, http: 422, condition: "Supporting pre-filing search through_date + 90 days < now at approve-preparation (boundary: exactly 90 days old is fresh)" }
  - { id: ERR_SEARCH_THROUGH_DATE_TOO_EARLY, http: 422, condition: "Verification results with through_date < subject filing's filed_at" }
  - { id: ERR_INVALID_FILED_AT, http: 422, condition: "filed_at earlier than submitted_at or later than now" }
  - { id: ERR_FEE_AUTHORIZATION_EXCEEDED, http: 402, condition: "charged_fee_cents > request.fee_authorization_cents at submit" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Service operator staff: seeds jurisdiction profiles, manages client accounts, controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /client-accounts, POST /client-accounts/{id}/suspend, POST /client-accounts/{id}/reinstate"
      - "POST /jurisdiction-profiles, PUT /jurisdiction-profiles/{id}"
    shared_operations: ["all GET endpoints"]
  - name: ClientManager
    description: "Client-side administrator; manages own account's debtors, secured parties, and perfection reports"
    identity: "entity_backed:ClientAccount"
    exclusive_operations:
      - "POST /client-accounts/{id}/debtors, PATCH /debtors/{id}"
      - "POST /client-accounts/{id}/secured-parties"
      - "POST /client-accounts/{id}/perfection-reports (shared with FilingSpecialist)"
    shared_operations: ["all GET endpoints (ownership-enforced under own /client-accounts/{id})", "POST /client-accounts/{id}/perfection-reports"]
  - name: FilingSpecialist
    description: "Service-company preparer: intake, preparation, attempts, submissions, search orders"
    identity: opaque
    exclusive_operations:
      - "POST /filing-requests, PATCH /filing-requests/{id}, POST /filing-requests/{id}/cancel"
      - "POST /filing-requests/{id}/attempts, POST /filings/{id}/submit, POST /filings/{id}/withdraw"
      - "POST /lien-searches"
    shared_operations: ["POST /filing-requests/{id}/submit-intake (with FilingReviewer)", "POST /client-accounts/{id}/perfection-reports (with ClientManager)", "all GET endpoints"]
  - name: FilingReviewer
    description: "Service-company reviewer: approves prepared filings; must not be the same user who submitted intake"
    identity: opaque
    exclusive_operations:
      - "POST /filing-requests/{id}/approve-preparation"
    shared_operations: ["POST /filing-requests/{id}/submit-intake (with FilingSpecialist)", "all GET endpoints"]
  - name: FilingOfficer
    description: "State/county filing-office clerk: records acceptances and rejections"
    identity: opaque
    exclusive_operations:
      - "POST /filings/{id}/record-acceptance"
      - "POST /filings/{id}/record-rejection"
    shared_operations: ["all GET endpoints"]
  - name: SearchAnalyst
    description: "Search vendor analyst: records certified search results"
    identity: opaque
    exclusive_operations:
      - "POST /lien-searches/{id}/record-results"
    shared_operations: ["all GET endpoints"]
