              captures: { plan_np_id: $.data.id }
            - call: "POST /governance/service-provider-engagements"
              payload: { plan_id: "${plan_np_id}", provider_name: "Northgate Retirement Services", provider_role: "RECORDKEEPER", term_start_date: "2026-01-01", term_end_date: "2027-12-31", per_head_fee_cents: 2000, asset_based_bps: 12, benchmark_percentile: 50, last_rfp_quarter_index: 0 }
