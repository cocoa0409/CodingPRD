              as: ScaleOperator
              as_user_id: "scale-01"
            - call: "POST /ethanol-ops/corn-deliveries/${d1_id}/settle"
              payload: {}
              as: GrainAccountant
              as_user_id: "acct-01"
            - call: "POST /ethanol-ops/fermentation-batches"
              payload: { batch_code: "FB-3001", corn_bushels_charged: 900.00, charge_test_weight_lb_per_bu: 54.0, destination_tank_id: "${t101_id}" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { b1_id: $.data.id }
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 12, lactic_acid_ppm: 1237, acetic_acid_ppm: 552, temperature_c: 36.9 }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/intervene"
              payload: { intervention_note: "Antimicrobial dose, cycle 1" }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 24, lactic_acid_ppm: 1237, acetic_acid_ppm: 552, temperature_c: 36.9 }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/intervene"
              payload: { intervention_note: "Antimicrobial dose, cycle 2" }
              as: ProcessOperator
              as_user_id: "op-01"
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/health-readings"
              payload: { hours_elapsed: 36, lactic_acid_ppm: 1237, acetic_acid_ppm: 552, temperature_c: 36.9 }
              as: ProcessOperator
              as_user_id: "op-01"
          trigger:
            - call: "POST /ethanol-ops/fermentation-batches/${b1_id}/intervene"
              payload: { intervention_note: "Antimicrobial dose, cycle 3" }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_INTERVENTION_LIMIT_REACHED with HTTP 422"
            - "FermentationBatch.${b1_id}.intervention_count == 2"
            - "FermentationBatch.${b1_id}.status == HEALTH_WATCH"
            - "FermentationBatch.${b1_id}.fermentation_health_index == 41.89"
            - "Plant.${plant_id}.corn_inventory_bushels == 40.00"

      - name: shipment_billing_dimension_blocks_cancel_after_invoice_while_loading_dimension_unchanged
        grounds:
          - state_machines.UnitTrainShipment.billing_status.BOL_ISSUED_to_INVOICED
          - state_machines.UnitTrainShipment.loading_status.LOADED_to_CANCELLED
          - validations[priority=31]
          - errors[ERR_SHIPMENT_ALREADY_INVOICED]
          - calculations.tank_balance
          - calculations.track_capacity_commitment
        distinguishing_aspect: |
          UnitTrainShipment carries two independent state dimensions, and the
          billing dimension reaching INVOICED permanently removes an edge from
          the loading dimension: LOADED -> CANCELLED is a declared transition
          that is nevertheless rejected with ERR_SHIPMENT_ALREADY_INVOICED, and
          neither loading_status nor the tank and track ledgers move.
        test_recipe:
          setup:
            - "Plant exists; tank T-301 is a DENATURED_E100 tank opened with 400000.00 gallons."
            - "Track TRK-A has spot_capacity 110 and is active."
            - "Shipment UT-7001 is 100 railcars of 2659.00 gallons at 181.50 c/gal, LOADED, with a bill of lading issued and then invoiced for 48260850 cents."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T05:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-301", product_type: "DENATURED_E100", capacity_gallons: 1000000.00, opening_gallons: 400000.00, settling_buffer_minutes: 120 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t301_id: $.data.id }
            - call: "POST /ethanol-ops/loading-tracks"
              payload: { track_code: "TRK-A", spot_capacity: 110, loading_rate_cars_per_hour: 20, is_active: true }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { trk_id: $.data.id, trk_v: $.data.version }
            - call: "POST /ethanol-ops/unit-train-shipments"
              payload: { shipment_code: "UT-7001", track_id: "${trk_id}", expected_track_version: "${trk_v}", source_tank_id: "${t301_id}", destination_terminal: "Chicago Rail Terminal", railcar_count: 100, gallons_per_railcar: 2659.00, window_start: "2026-09-05T06:00:00Z", window_end: "2026-09-05T12:00:00Z", price_cents_per_gallon: 181.50 }
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { sh1_id: $.data.id }
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/load"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/bill-of-lading"
              payload: { bol_number: "BOL-7001" }
              as: LogisticsCoordinator
              as_user_id: "log-01"
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/invoice"
              payload: {}
              as: LogisticsCoordinator
              as_user_id: "log-01"
              captures: { inv_cents: $.data.invoice_amount_cents }
          trigger:
            - call: "POST /ethanol-ops/unit-train-shipments/${sh1_id}/cancel"
