# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Employment Background Screening Vendor Management
# 9 rules x >=2 instances = 19 instances (boundary_precision carries 3).
# All fixture arithmetic pre-computed; business window = Mon-Fri 09:00-17:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_fee_provisional_vs_final_with_sla_credit
        grounds:
          - calculations.order_fee_cents
          - entities.ScreeningOrder.fields.provisional_fee_cents
          - entities.ScreeningOrder.fields.final_fee_cents
          - state_machines.ScreeningOrder.transitions.DISPATCHED_to_REPORT_RECEIVED
        distinguishing_aspect: |
          Entity domain = ScreeningOrder FISCAL. Identical order data yields two
          legitimate fee values: provisional_at_dispatch exposes 25000 cents, while
          final_at_delivery on the same (late) delivery applies the 10% SLA credit
          and yields 22500 cents. Distinct from the vendor accuracy dual variant
          (risk domain) per Rule 1's different-domain clause.
        test_recipe:
          setup:
            - "Vendor V (surcharge 0), ACTIVE package P (fee_cents 25000, tat 8 business hours), jurisdiction US-CA (ANYTIME, wait 5), CLEAR-matrix active, position, candidate"
            - "Order consented and dispatched at 2026-08-05T10:00:00Z (Wed); clock advanced to 2026-08-06T11:00:00Z (Thu) so turnaround = 9.0 > 8 (breach)"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-DV1", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-DV1", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY, SSN_TRACE], tat_business_hours: 8, fee_cents: 25000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /adjudication-matrices", payload: { risk_tier: TIER_1_STANDARD, rules: [ { offense_category: VIOLENT_FELONY, min_severity: HIGH, max_recency_years: 7, action: ADVERSE_ELIGIBLE } ] }, as: ComplianceOfficer, captures: { m_id: $.data.id } }
            - { call: "POST /adjudication-matrices/${m_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "Analyst", department: "Ops", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Dv One", email: "dv1@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-04T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager, captures: { prov_fee: $.data.provisional_fee_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T11:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /screening-reports", payload: { order_id: "${o_id}", findings: [] }, as: VendorAgent, as_user_id: "${v_id}", captures: { r_breach: $.data.sla_breached } }
          assert:
            - "captured provisional fee at dispatch == 25000 (package.fee_cents + surcharge 0, no credit knowable at dispatch)"
            - "report.sla_breached == true (9.0 business hours > tat 8)"
            - "GET /screening-orders/${o_id}: provisional_fee_cents == 25000 (immutable snapshot) AND final_fee_cents == 22500 (25000 - floor(25000*10/100))"
            - "same row, same inputs: final variant diverges from provisional variant by exactly the SLA credit"

      - name: vendor_accuracy_finalized_vs_including_draft
        grounds:
          - calculations.vendor_accuracy_bps
          - entities.ScreeningVendor.fields.accuracy_bps_finalized
          - entities.ScreeningVendor.fields.accuracy_bps_including_draft
        distinguishing_aspect: |
          Entity domain = ScreeningVendor RISK. Over identical audit rows the two
          variants diverge whenever a DRAFT audit exists: finalized_only pools only
          the FINALIZED audit (1/100 -> 9900 bps), including_draft pools the DRAFT
          too ((1+3)/(100+50) -> 9733 bps). Distinct entity domain from the order
          fee dual variant.
        test_recipe:
          setup:
            - "Vendor V; audit A (period [2026-01-01,2026-02-01), sample 100, mismatches 1) created and FINALIZED"
            - "audit B (period [2026-02-01,2026-03-01), sample 50, mismatches 3) created and left DRAFT; adjacency end==start is permitted"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-DV2", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", sample_size: 100, mismatches_found: 1 }, as: Auditor, captures: { a_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits/${a_id}/finalize", payload: {}, as: Auditor }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", sample_size: 50, mismatches_found: 3 }, as: Auditor }
          trigger:
            - { call: "GET /vendors/${v_id}", payload: {}, as: Auditor }
          assert:
            - "vendor.accuracy_bps_finalized == 9900  (round_half_up(10000*(1-1/100)))"
            - "vendor.accuracy_bps_including_draft == 9733  (round_half_up(10000*(1-4/150)))"
            - "audit B mismatch_rate_bps == 600 yet excluded from the finalized variant"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: adjudication_first_match_rule_ordering
        grounds:
          - calculations.adjudication_outcome
          - entities.ReportFinding.fields.matched_action
        distinguishing_aspect: |
          Mode (a) — >=3 inputs (offense_category, severity rank, recency years)
          with non-linear interaction: the finding satisfies BOTH matrix rules
          (severity HIGH >= LOW, recency 3 <= 99 and <= 5), and the declared array
          order decides: first-match-wins yields IA_REQUIRED, not ADVERSE_ELIGIBLE.
        test_recipe:
          setup:
            - "Full chain to dispatch; ACTIVE matrix for TIER_1_STANDARD whose rules array lists the broad IA_REQUIRED rule FIRST and the narrower ADVERSE_ELIGIBLE rule SECOND"
            - "clock 2026-08-05T10:00:00Z dispatch; clock 2026-08-06T10:00:00Z delivery (turnaround 8.0 <= tat 40)"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-CF1", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-CF1", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 10000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /adjudication-matrices", payload: { risk_tier: TIER_1_STANDARD, rules: [ { offense_category: NONVIOLENT_FELONY, min_severity: LOW, max_recency_years: 99, action: IA_REQUIRED }, { offense_category: NONVIOLENT_FELONY, min_severity: HIGH, max_recency_years: 5, action: ADVERSE_ELIGIBLE } ] }, as: ComplianceOfficer, captures: { m_id: $.data.id } }
            - { call: "POST /adjudication-matrices/${m_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "Analyst", department: "Ops", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Cf One", email: "cf1@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-04T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T10:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /screening-reports", payload: { order_id: "${o_id}", findings: [ { check_type: CRIMINAL_COUNTY, offense_category: NONVIOLENT_FELONY, severity: HIGH, offense_date: "2023-08-01T00:00:00Z", disposition: CONVICTION } ] }, as: VendorAgent, as_user_id: "${v_id}", captures: { r_id: $.data.id } }
          assert:
            - "GET /screening-reports/${r_id}/findings: $.data[0].considerable == true (offense 2023-08-01 >= cutoff 2019-08-06)"
            - "$.data[0].matched_action == IA_REQUIRED (first array element wins although the second rule also matches)"
            - "GET /screening-orders/${o_id}.recommended_outcome == IA_REQUIRED"

      - name: accuracy_pooled_then_rounded_not_per_audit_average
        grounds:
          - calculations.vendor_accuracy_bps
          - calculations.audit_fail_evaluation
        distinguishing_aspect: |
          Mode (b) — nested rounding order: pooling all mismatches and samples
          THEN a single round_half_up yields 9000 bps, whereas rounding each audit
          first and averaging yields 9167 bps; the scaffold pins pooled-then-rounded.
          Different mode from the first-match instance (mode a).
        test_recipe:
          setup:
            - "Vendor V; audit A FINALIZED (sample 6, mismatches 1); audit B FINALIZED (sample 4, mismatches 0)"
            - "Audit A alone fails (1667 bps > 200) so V enters PROBATION at A's finalize; sweep creates nothing (no reports)"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-CF2", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", sample_size: 6, mismatches_found: 1 }, as: Auditor, captures: { a_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits/${a_id}/finalize", payload: {}, as: Auditor }
            - { call: "POST /vendor-accuracy-audits", payload: { vendor_id: "${v_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", sample_size: 4, mismatches_found: 0 }, as: Auditor, captures: { b_id: $.data.id } }
            - { call: "POST /vendor-accuracy-audits/${b_id}/finalize", payload: {}, as: Auditor }
          trigger:
            - { call: "GET /vendors/${v_id}", payload: {}, as: Auditor }
          assert:
            - "vendor.accuracy_bps_finalized == 9000  (pooled: round_half_up(10000*(1-1/10)))"
            - "vendor.accuracy_bps_finalized != 9167  (the per-audit-rounded average is the FORBIDDEN order)"
            - "vendor.status == PROBATION (audit A alone breached the 200 bps fail threshold)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_dimensions_dispute_cycle
        grounds:
          - state_machines.ScreeningOrder
          - entities.ScreeningOrder.fields.fulfillment_status
          - entities.ScreeningOrder.fields.adjudication_status
        distinguishing_aspect: |
          ScreeningOrder carries PARALLEL state dimensions plus a CYCLE: filing a
          dispute moves adjudication_status PENDING_REVIEW -> DISPUTE_HOLD while
          fulfillment_status stays REPORT_RECEIVED; resolve UPHELD loops
          adjudication back to PENDING_REVIEW. Dimension A never leaves
          REPORT_RECEIVED across the whole cycle.
        test_recipe:
          setup:
            - "Standard chain through report delivery at 2026-08-06T10:00:00Z with one NONVIOLENT_FELONY finding; order: fulfillment REPORT_RECEIVED x adjudication PENDING_REVIEW"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-NL1", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-NL1", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 10000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /adjudication-matrices", payload: { risk_tier: TIER_1_STANDARD, rules: [ { offense_category: NONVIOLENT_FELONY, min_severity: LOW, max_recency_years: 99, action: IA_REQUIRED } ] }, as: ComplianceOfficer, captures: { m_id: $.data.id } }
            - { call: "POST /adjudication-matrices/${m_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "Analyst", department: "Ops", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Nl One", email: "nl1@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-04T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-reports", payload: { order_id: "${o_id}", findings: [ { check_type: CRIMINAL_COUNTY, offense_category: NONVIOLENT_FELONY, severity: MEDIUM, offense_date: "2024-02-01T00:00:00Z", disposition: CONVICTION } ] }, as: VendorAgent, as_user_id: "${v_id}", captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /disputes", payload: { order_id: "${o_id}", reason: "record belongs to someone else" }, as: Candidate, as_user_id: "${c_id}", captures: { d_id: $.data.id } }
            - { call: "POST /disputes/${d_id}/resolve", payload: { outcome: UPHELD }, as: VendorAgent, as_user_id: "${v_id}" }
          assert:
            - "after POST /disputes: order.adjudication_status == DISPUTE_HOLD AND order.fulfillment_status == REPORT_RECEIVED (dimensions independent)"
            - "after resolve UPHELD: order.adjudication_status == PENDING_REVIEW again (cycle closed), fulfillment still REPORT_RECEIVED"
            - "report.status path DELIVERED -> DISPUTED -> UPHELD; dispute.status == RESOLVED_UPHELD"

      - name: adverse_case_waiting_hold_cycle_with_deadline_extension
        grounds:
          - state_machines.AdverseActionCase
          - calculations.adverse_wait_requirement
          - calculations.business_day_add
        distinguishing_aspect: |
          Different entity (AdverseActionCase), different non-linear shape: a
          WAITING_PERIOD -> DISPUTE_HOLD -> WAITING_PERIOD cycle that mutates
          earliest_final_notice_at by exactly the business days spent on hold
          (wait 5 + hold 3 = 8 business days from 2026-08-05 -> 2026-08-17T00:00:00Z).
        test_recipe:
          setup:
            - "Chain through PRE_ADVERSE_PENDING: report (VIOLENT_FELONY HIGH, ADVERSE_ELIGIBLE) delivered 2026-08-04T10:00:00Z; INITIATE_ADVERSE at 2026-08-05T10:00:00Z creates the case (wait 5 -> earliest 2026-08-12T00:00:00Z)"
            - "Dispute filed at 2026-08-06T09:00:00Z (case -> DISPUTE_HOLD), resolved UPHELD at 2026-08-11T15:00:00Z"
          setup_api_calls:
            - { call: "POST /vendors", payload: { name: "V-NL2", base_tat_business_hours: 40, max_concurrent_orders: 5, surcharge_cents: 0 }, as: HRAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /screening-packages", payload: { name: "P-NL2", risk_tier: TIER_1_STANDARD, check_types: [CRIMINAL_COUNTY], tat_business_hours: 40, fee_cents: 10000 }, as: HRAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /screening-packages/${p_id}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /jurisdiction-rules", payload: { jurisdiction_code: "US-CA", screening_gate_stage: ANYTIME, lookback_years_limit: 7, arrest_records_considerable: true, lookback_exemption_salary_cents: 0, pre_adverse_wait_business_days: 5, individualized_assessment_required: false, credit_check_allowed: true }, as: ComplianceOfficer, captures: { j_id: $.data.id } }
            - { call: "POST /jurisdiction-rules/${j_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /adjudication-matrices", payload: { risk_tier: TIER_1_STANDARD, rules: [ { offense_category: VIOLENT_FELONY, min_severity: HIGH, max_recency_years: 10, action: ADVERSE_ELIGIBLE } ] }, as: ComplianceOfficer, captures: { m_id: $.data.id } }
            - { call: "POST /adjudication-matrices/${m_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /positions", payload: { title: "Analyst", department: "Ops", risk_tier: TIER_1_STANDARD, package_id: "${p_id}", jurisdiction_code: "US-CA", annual_salary_cents: 9000000 }, as: HRAdmin, captures: { pos_id: $.data.id } }
            - { call: "POST /candidates", payload: { full_name: "Nl Two", email: "nl2@x.com", home_jurisdiction_code: "US-CA" }, as: HRAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders", payload: { candidate_id: "${c_id}", position_id: "${pos_id}" }, as: HiringManager, captures: { o_id: $.data.id } }
            - { call: "POST /screening-orders/${o_id}/consents", payload: { disclosure_form_id: "DISC-1", contains_extraneous_terms: false, authorization_signed_at: "2026-08-03T09:00:00Z" }, as: Candidate, as_user_id: "${c_id}" }
            - { call: "POST /screening-orders/${o_id}/dispatch", payload: { vendor_id: "${v_id}" }, as: HiringManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-reports", payload: { order_id: "${o_id}", findings: [ { check_type: CRIMINAL_COUNTY, offense_category: VIOLENT_FELONY, severity: HIGH, offense_date: "2024-06-01T00:00:00Z", disposition: CONVICTION } ] }, as: VendorAgent, as_user_id: "${v_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: HRAdmin }
            - { call: "POST /screening-orders/${o_id}/adjudication-decision", payload: { decision: INITIATE_ADVERSE }, as: Adjudicator, as_user_id: "adj-nl2" }
            - { call: "GET /adverse-action-cases", payload: { order_id: "${o_id}" }, as: ComplianceOfficer, captures: { case_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:00Z" }, as: HRAdmin }
            - { call: "POST /disputes", payload: { order_id: "${o_id}", reason: "contesting the felony record" }, as: Candidate, as_user_id: "${c_id}", captures: { d_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T15:00:00Z" }, as: HRAdmin }
          trigger:
            - { call: "POST /disputes/${d_id}/resolve", payload: { outcome: UPHELD }, as: VendorAgent, as_user_id: "${v_id}" }
          assert:
            - "GET /adverse-action-cases/${case_id}: status == WAITING_PERIOD (cycle DISPUTE_HOLD -> WAITING_PERIOD closed)"
            - "case.total_hold_business_days == 3 (business days in (2026-08-06, 2026-08-11] = Aug 7, 10, 11)"
            - "case.earliest_final_notice_at == 2026-08-17T00:00:00Z (business_day_add(2026-08-05, 5+3))"
            - "case.hold_started_at == null after the hold closes"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: dispute_amended_report_case_abort_chain
        grounds:
          - state_machines.Dispute.transitions.UNDER_REINVESTIGATION_to_RESOLVED_AMENDED
          - state_machines.ScreeningReport.transitions.DISPUTED_to_AMENDED
          - state_machines.ScreeningOrder.transitions.DISPUTE_HOLD_to_PENDING_REVIEW
          - state_machines.AdverseActionCase.transitions.DISPUTE_HOLD_to_ABORTED
        distinguishing_aspect: |
          Depth-3 chain from the RESOLVE-AMENDED trigger: (1) dispute resolution
          mutates the report to AMENDED; (2) the report's amendment itself forces
          order re-evaluation (recommended_outcome recomputed against the PINNED
          matrix, adjudication DISPUTE_HOLD -> PENDING_REVIEW); (3) the order's
