        grounds: [calculations.timeliness_deadline_resolution, entities.DeferralAgency.fields.covers_age]
        distinguishing_aspect: "the size screen is per-basis: AGE needs snapshot >= ADEA_MIN_EMPLOYEES 20 AND agency coverage; 17 kills an AGE-only charge, 20 saves it, a covers_age-false agency kills it at 25, and a mixed [RACE, AGE] charge at 17 survives on RACE alone with covered_bases == [RACE]."
        test_recipe:
          setup: ["GA agency (300 days, covers_age FALSE); one GA employer, one FL employer; four complainants"]
          setup_api_calls:
            - call: "POST /eeoc/deferral-agencies"
              payload: { state_code: "GA", agency_name: "GA FEPA", filing_deadline_days: 300, work_sharing_policy: "DUAL_FILE_DEFAULT", covers_age: false }
