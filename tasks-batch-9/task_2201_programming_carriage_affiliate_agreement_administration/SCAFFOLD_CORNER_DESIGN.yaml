        grounds:
          - validations[priority=52]
          - validations[priority=71]
          - errors[ERR_BLACKOUT_WINDOW_CONFLICT]
          - errors[ERR_WINDOW_OUTSIDE_TERM]
          - state_machines.RightsWindow.PLANNED_to_CLEARED
        distinguishing_aspect: >-
          Both refusals happen at CLEAR rather than at creation, and they are ordered:
          a LINEAR window overlapping a SCHEDULED US blackout is 409
          ERR_BLACKOUT_WINDOW_CONFLICT at priority 52, whereas a window running past the
          2026-12-31 term end with no blackout nearby falls through to 422
          ERR_WINDOW_OUTSIDE_TERM at priority 71.
        test_recipe:
          setup:
            - "Meridian Broadband with an executed agreement running 2025-01-01 → 2026-12-31."
            - "A cleared ContentTitle premiering 2026-08-15 so the LINEAR holdback of 0 days is satisfied."
            - "One SCHEDULED BlackoutRule for territory US covering 2026-09-05T18:00Z → 2026-09-05T22:00Z."
            - "Window W1 (LINEAR, US) 2026-09-05T20:00Z → 2026-09-06T00:00Z overlaps the blackout; window W2 (LINEAR, US) 2026-12-30T00:00Z → 2027-01-05T00:00Z runs past the term end; window W3 (LINEAR, US) 2026-10-01T00:00Z → 2026-10-08T00:00Z is clean."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
