              as: MerchOpsAdmin
            - call: "POST /otb/actuals-posts"
              payload: { plan_month_id: "${mb_id}", week_index: 1, actual_sales_cents: 6750750, actual_receipts_cents: 0, actual_units_received: 0 }
              as: MerchOpsAdmin
            - call: "GET /otb/reforecast-cycles"
              payload: { category_plan_id: "${plan_a}" }
              as: PlanningDirector
              captures: { cycle_a: "$.data[0].id" }
          assert:
            - "both plans start identical: CategoryPlan.${plan_a}.sales_variance_bps == 0 and variance_status == ON_PLAN and otb_posture == OPEN, likewise for ${plan_b}, and PlanMonth.${ma_id}.otb_planned_cents == PlanMonth.${mb_id}.otb_planned_cents == 18200000 with active_basis == PLANNED_BASIS"
            - "AT THE BOUNDARY: after the week-1 actuals post on ${ma_id}, plan_to_date_cents == 7500000 (30000000 * 1 / 4) and actual 6750000, so CategoryPlan.${plan_a}.sales_variance_bps == -1000 exactly, which is <= VARIANCE_BREACH_UNDER_BPS -1000 and therefore CategoryPlan.${plan_a}.variance_status == BREACH, NOT WATCH"
            - "AT THE BOUNDARY: PlanMonth.${ma_id}.active_basis == PROJECTED_BASIS, weeks_posted == 1, projected_sales 27000000, projected_sales_cost 12150000, projected_bom_cents 16962500 (20000000 + 0 - 3037500), provisional_sell_through_bps 7163, reserve_rate_bps 350, markdown_reserve_cents 593688, otb_planned_cents 19781188"
            - "AT THE BOUNDARY: CategoryPlan.${plan_a}.open_ratio_bps == 10000 because the month is entirely open, yet otb_posture == FROZEN - the BREACH override is applied last and unconditionally, overriding a ratio that on its own means OPEN"
            - "AT THE BOUNDARY: CategoryPlan.${plan_a}.status == REFORECAST_OPEN with reforecast_round == 1, and ReforecastCycle.${cycle_a}.trigger_reason == VARIANCE_BREACH with round_index == 1, status OPEN and snapshot_sales_variance_bps == -1000"
            - "ONE UNIT INSIDE: after the week-1 actuals post on ${mb_id}, the same prorated plan 7500000 against actual 6750750 gives CategoryPlan.${plan_b}.sales_variance_bps == -999 (10000 * -749250 / 7500000 == -999.0 exactly), so variance_status == WATCH and NOT BREACH"
            - "ONE UNIT INSIDE: CategoryPlan.${plan_b}.otb_posture == OPEN with open_ratio_bps == 10000 - no breach override - and CategoryPlan.${plan_b}.status is STILL APPROVED with reforecast_round == 0, and GET /otb/reforecast-cycles filtered to ${plan_b} returns zero rows"
            - "ONE UNIT INSIDE: PlanMonth.${mb_id}.otb_planned_cents == 19782864 with projected_sales 27003000, projected_sales_cost 12151350, projected_bom_cents 16962162, provisional_sell_through_bps 7164, reserve_rate_bps 350, markdown_reserve_cents 593676"
            - "the whole difference between BREACH and WATCH is 750 cents of actual sales - 6750750 versus 6750000 on a 7500000 prorated plan - and it changes four observable fields on the plan (sales_variance_bps, variance_status, otb_posture, status) plus the existence of a ReforecastCycle"
            - "the two ActualsPost rows (week_index 1 on ${ma_id} and week_index 1 on ${mb_id}) are immutable append-only records: GET /otb/plan-months/${ma_id}/actuals-posts returns exactly one row with week_index 1 and actual_sales_cents 6750000, GET /otb/plan-months/${mb_id}/actuals-posts returns exactly one row with week_index 1 and actual_sales_cents 6750750, and neither row exposes an id or a version field (ActualsPost declares common_fields false)"

      - name: size_curve_zero_unit_cell_boundary
        grounds:
          - validations[priority=28].ERR_SIZE_CURVE_ZERO_CELL
          - calculations.cluster_size_allocation
          - endpoints[PUT /otb/option-plans/{id}/size-curve]
          - entities.SizeCurveCell.fields.allocated_units
        distinguishing_aspect: |
          A third metric on a third endpoint: WHOLE UNITS on PUT /otb/option-plans/{id}/size-curve,
          at the round_half_up threshold of half a unit. The curve's smallest size is walked across
          the point where its raw demand crosses 5000 unit-ten-thousandths: pct_bps 18 yields
          raw_units_x10000 4968, which rounds to 0 units and is rejected as an unstockable cell,
          while pct_bps 19 yields 5244, which rounds to 1 unit and is accepted. No integer pct_bps
          lands exactly on 5000 for this depth and cluster, so the boundary is pinned by the two
          adjacent achievable values rather than by an exact tie.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Department WAPP, Category DRSS, StoreCluster Cold-A with store_count 40 and sales_index_bps 11500"
            - "CategoryPlan SPRING 2027 in DRAFT with one PlanMonth, and OptionPlan OP1 (BETTER, breadth 14, depth_units_per_option 6) still OPEN with no size curve, so target_units is 276 (round_half_up(6 * 40 * 11500 / 10000)) and each cell's raw demand is round_half_up(276 * pct_bps) unit-ten-thousandths"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
          trigger:
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 18 }, { size_label: "S", size_sort_order: 2, pct_bps: 2182 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1800 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { zero_cell_error: $.data.error_id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 19 }, { size_label: "S", size_sort_order: 2, pct_bps: 2181 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1800 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "GET /otb/option-plans/${op1_id}/size-curve-cells"
              payload: {}
              as: MerchandisePlanner
          assert:
            - "BELOW THE HALF-UNIT BOUNDARY: the first curve gives XS raw_units_x10000 == 4968 (round_half_up(276 * 18)), which is strictly below 5000 and therefore rounds to allocated_units 0, so the PUT returns HTTP 422 with ${zero_cell_error} == ERR_SIZE_CURVE_ZERO_CELL"
            - "the first curve is otherwise legal, so no earlier rule pre-empts it: the cells array is non-empty (priority 26) and 18 + 2182 + 3400 + 2600 + 1800 == 10000 with unique labels and sort orders (priority 27)"
            - "the first PUT was atomic in its refusal: GET /otb/option-plans/${op1_id}/size-curve-cells returns zero rows and OptionPlan.${op1_id}.target_units_per_option is still null - a rejected curve replaces nothing"
            - "AT THE BOUNDARY: the second curve moves one basis point from S to XS, giving XS raw_units_x10000 == 5244 (round_half_up(276 * 19)), which is at or above 5000 and rounds up to allocated_units 1, so the PUT returns HTTP 200"
            - "AT THE BOUNDARY: the persisted cells carry raw_units_x10000 5244 / 601956 / 938400 / 717600 / 496800 and allocated_units 1 / 59 / 94 / 72 / 50 for XS / S / M / L / XL, ordered by size_sort_order ASC"
            - "AT THE BOUNDARY: sum(allocated_units) == 276 == target_units, even though the naive per-cell rounding gives 1 + 60 + 94 + 72 + 50 == 277; the -1 remainder was taken from S because its fractional part 1956 is the smallest of 5244 / 1956 / 8400 / 7600 / 6800, and the accepted XS cell was NOT the donor even though it is the thinnest cell"
            - "the boundary is exactly one basis point wide for this curve: pct_bps 18 is unstockable and pct_bps 19 is stockable, and no integer pct_bps produces raw_units_x10000 == 5000 exactly at depth 6 and cluster index 11500, since 5000 / 276 is not an integer"
            - "the accepted PUT wrote no OptionPlan slot fields: OptionPlan.${op1_id}.status is still OPEN with option_slots_total == null and target_units_per_option == null, because only cascade-B link 5 writes those"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: item_adopt_requires_slotted_option_plan
        grounds:
          - validations[priority=11].ERR_OPTION_PLAN_NOT_SLOTTED
          - state_machines.AssortmentItem.PROPOSED_to_ADOPTED
          - state_machines.OptionPlan.OPEN_to_SLOTTED
          - calculations.item_sell_through_forecast
          - errors.ERR_OPTION_PLAN_NOT_SLOTTED
        distinguishing_aspect: |
          Entity pair AssortmentItem -> OptionPlan. The item's own state is a perfectly legal
          PROPOSED and the adopt trigger is declared for PROPOSED, so nothing about the item can
          explain the refusal: the transition is gated on a DIFFERENT row's state, OptionPlan.status
          == SLOTTED, which the item cannot influence. Slotting the OptionPlan is achieved by
          approving its CategoryPlan - a third row - after which the byte-identical adopt call
          succeeds and consumes one of the newly created slots.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Department WAPP, Category DRSS, StoreCluster Cold-A"
            - "CategoryPlan SPRING 2027 still in DRAFT with PlanMonth M1 DRAFT and OptionPlan OP1 OPEN carrying a balanced five-cell curve"
            - "one CORE AssortmentItem C1 on OP1 with prior_season_sell_through_bps 6000, status PROPOSED"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Cold-A", climate_zone: "COLD", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Aurora Mills", code: "AURM", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 200, cancel_cutoff_days: 21 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/vendors/${vendor_id}/status"
              payload: { status: "AUTHORIZED" }
              as: MerchOpsAdmin
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op1_id: $.data.id }
            - call: "PUT /otb/option-plans/${op1_id}/size-curve"
              payload: { cells: [ { size_label: "XS", size_sort_order: 1, pct_bps: 800 }, { size_label: "S", size_sort_order: 2, pct_bps: 2200 }, { size_label: "M", size_sort_order: 3, pct_bps: 3400 }, { size_label: "L", size_sort_order: 4, pct_bps: 2600 }, { size_label: "XL", size_sort_order: 5, pct_bps: 1000 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-CORE-C1", color_code: "WHITE", lifecycle_stage: "CORE", unit_cost_cents: 2500, retail_price_cents: 6500, prior_season_sell_through_bps: 6000 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_c1: $.data.id }
          trigger:
            - call: "POST /otb/assortment-items/${item_c1}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { not_slotted_error: $.data.error_id }
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "v1" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "ok" }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /otb/assortment-items/${item_c1}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
          assert:
            - "before the first probe: AssortmentItem.${item_c1}.status == PROPOSED (a state from which adopt IS declared) and OptionPlan.${op1_id}.status == OPEN with option_slots_total == null"
            - "the first probe returns HTTP 409 with ${not_slotted_error} == ERR_OPTION_PLAN_NOT_SLOTTED - the refusal is caused by the OptionPlan's state, not the item's, so ERR_INVALID_STATE would be the wrong answer"
            - "the first probe changed nothing: AssortmentItem.${item_c1}.status is still PROPOSED with planned_units == null, sell_through_bps == null, sell_through_basis == null, effective_overlay_multiplier_bps == null"
            - "the approve slots the dependency row: OptionPlan.${op1_id}.status == SLOTTED with option_slots_total == 14, option_slots_assigned == 0, option_slots_open == 14 and target_units_per_option == 276"
            - "the second probe, byte-identical to the first, returns HTTP 200 and AssortmentItem.${item_c1}.status == ADOPTED"
            - "on adoption the item inherits from the two rows it depends on: planned_units == 276 from OptionPlan.target_units_per_option, effective_overlay_multiplier_bps == 10000 because no LocalizationOverlay is ACTIVE, sell_through_basis == CARRYOVER_BASIS and sell_through_bps == 6300 (prior 6000 * demographic_index_bps 10500 / 10000) - lifecycle_stage CORE takes the carryover branch, so the BETTER tier benchmark and the cluster sales index are ignored"
            - "the slot ledger moved on the OTHER entity: OptionPlan.${op1_id}.option_slots_assigned == 1 and option_slots_open == 13 with option_slots_total still 14, and OptionPlan.${op1_id}.version incremented"

      - name: commitment_commit_requires_authorized_vendor
        grounds:
          - validations[priority=13].ERR_VENDOR_NOT_AUTHORIZED
          - state_machines.Vendor.AUTHORIZED_to_SUSPENDED
          - state_machines.Vendor.SUSPENDED_to_AUTHORIZED
          - state_machines.ReceiptCommitment.PROPOSED_to_COMMITTED
          - entities.VendorAuthorization.fields.status
        distinguishing_aspect: |
          A different entity pair: ReceiptCommitment -> Vendor, and the dependency is TOGGLED under a
          row that already exists rather than being reached for the first time. The commitment sits
          in PROPOSED, from which commit is declared, and nothing about it changes; suspending the
          vendor mid-flight makes the same commit illegal, and reinstating the vendor makes it legal
          again. Suspension also revokes the VendorAuthorization, so two rules are violated at once
