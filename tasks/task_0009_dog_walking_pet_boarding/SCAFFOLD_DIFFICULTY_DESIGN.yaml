              as: Owner
              as_user_id: "${o11_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_SITTER_TIME_CONFLICT  # 30min trailing buffer on b11a pushes Sitter calendar to [09:00, 10:30); proposed [10:00, 11:00) overlaps"

      - name: pet_calendar_closed_inclusive_no_buffer
        grounds:
          - validations[priority=11]
          - errors[ERR_PET_TIME_CONFLICT]
        distinguishing_aspect: |
          Pet resource overlap with closed inclusive [start, end] interval
          semantics and NO buffer — different geometry than the Sitter rule.
          A Booking on Pet p12 covering [09:00, 10:00] is in conflict with
