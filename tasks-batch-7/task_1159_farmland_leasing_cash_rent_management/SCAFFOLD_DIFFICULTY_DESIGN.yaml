      - name: payment_reversal_recomputes_landlord_ledger
        grounds:
          - state_machines.PaymentInstallment.PAID_to_OPEN
          - calculations.landlord_ledger_totals
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (reverse_payment, not a clock
          sweep): reversal mutates the installment (link 1: paid_cents reset,
          PAID -> OPEN), and that installment mutation itself triggers the
          landlord ledger recompute (link 2: total_received_cents drops back
          to 0 and pending_receivable_cents returns to 1250000).
        test_recipe:
          setup:
