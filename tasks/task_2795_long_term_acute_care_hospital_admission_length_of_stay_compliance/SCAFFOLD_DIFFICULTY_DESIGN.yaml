            - "PaymentDetermination.${det_at_26_id}.total_payment_cents == 6000000"
            - "PaymentDetermination.${det_at_26_id}.discharge_payment_pct == 100.00"
            - "The one-day difference changes total_payment_cents by 3,600,000c"

      - name: vent_hours_at_95_versus_96_flips_the_payment_variant
        grounds:
          - calculations.weaning_vent_hours_total
          - calculations.stay_payment_determination
          - entities.PaymentDetermination.fields.payment_variant
        distinguishing_aspect: |
          A different boundary in a different unit - accumulated ventilator HOURS (>= 96, inclusive)
          rather than LOS days - and it selects a payment SYSTEM rather than a branch inside one. Both
          stays are identical COMPLEX_WOUND admissions with ICU 1 day, so the vent threshold is the
          only discriminator: 95.0 hours prices SITE_NEUTRAL and 96.0 hours prices STANDARD.
