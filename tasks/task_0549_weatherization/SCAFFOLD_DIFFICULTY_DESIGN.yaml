  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_double_booked_half_open_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_CREW_DOUBLE_BOOKED]
          - state_machines.CrewAssignment.new_to_SCHEDULED
        distinguishing_aspect: |
          A crew's assignments use half-open [start,end) overlap semantics: a second window
          [2026-06-05, 2026-06-12) for the SAME crew overlapping an existing SCHEDULED
          [2026-06-01, 2026-06-10) is rejected with ERR_CREW_DOUBLE_BOOKED — the Crew resource,
          overlap arithmetic.
        test_recipe:
          setup:
            - "One crew already assigned to job A over 2026-06-01..2026-06-10; a second job B at a DIFFERENT dwelling"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "15 Linden St", year_built: 1960, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_a: $.data.id }
            - call: "POST /weatherization/dwellings"
              payload: { address: "16 Sycamore St", year_built: 1966, conditioned_area_sqft: 1550, foundation_type: "BASEMENT", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_b: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_a}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_a: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_b}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_b: $.data.id }
            - call: "POST /weatherization/crews"
              payload: { name: "Crew J", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 60 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_a}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_b}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-05T00:00:00Z", scheduled_end_date: "2026-06-12T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CREW_DOUBLE_BOOKED"
            - "Crew.${crew_id}.committed_days == 9"

      - name: dwelling_window_conflict_buffer_gap
        grounds:
          - validations[priority=10]
          - errors[ERR_DWELLING_WINDOW_CONFLICT]
          - state_machines.CrewAssignment.new_to_SCHEDULED
        distinguishing_aspect: |
          Two SCHEDULED assignments for different jobs at the SAME dwelling must be >= BUFFER_DAYS(2)
          apart: non-overlapping windows [2026-06-01,2026-06-05) and [2026-06-06,2026-06-10) with a
          1-day gap are rejected with ERR_DWELLING_WINDOW_CONFLICT — the Dwelling resource, buffer/gap
          semantics distinct from the crew's overlap arithmetic. Different crews avoid crew-double-booking.
        test_recipe:
          setup:
            - "One dwelling with two jobs; crew1 assigned to job A over 2026-06-01..2026-06-05"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "17 Chestnut St", year_built: 1969, conditioned_area_sqft: 1500, foundation_type: "CRAWLSPACE", heating_fuel_type: "PROPANE" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_a: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_b: $.data.id }
            - call: "POST /weatherization/crews"
              payload: { name: "Crew K", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 30 }
              as: ProgramAdmin
              captures: { crew1: $.data.id }
            - call: "POST /weatherization/crews"
              payload: { name: "Crew L", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 30 }
              as: ProgramAdmin
              captures: { crew2: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_a}", crew_id: "${crew1}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_b}", crew_id: "${crew2}", scheduled_start_date: "2026-06-06T00:00:00Z", scheduled_end_date: "2026-06-10T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DWELLING_WINDOW_CONFLICT"
            - "Crew.${crew2}.committed_days == 0"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: crew_days_conserved_on_assignment_cancel
        grounds:
          - calculations.crew_capacity_ledger
          - entities.Crew.fields.committed_days
          - state_machines.CrewAssignment.new_to_SCHEDULED
          - state_machines.CrewAssignment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Crew.committed_days is conserved across a forward/compensate pair: a 4-day assignment
          raises committed_days 0->4, cancelling it lowers 4->0, returning the crew-day quantity to
          its pre-assignment value.
        test_recipe:
          setup:
            - "A crew with capacity 20 and one SCHEDULED 4-day assignment (committed_days 4)"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "18 Willow St", year_built: 1974, conditioned_area_sqft: 1500, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/crews"
              payload: { name: "Crew M", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 20 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /weatherization/crew-assignments/${ca_id}/cancel"
              payload: {}
              as: ProgramAdmin
          assert:
            - "CrewAssignment.${ca_id}.status == CANCELLED"
            - "Crew.${crew_id}.committed_days == 0"
            - "Crew.${crew_id}.available_days == 20"

      - name: rebate_money_conserved_on_void
        grounds:
          - calculations.rebate_budget_ledger
          - entities.Job.fields.approved_rebate_total_cents
          - state_machines.RebateClaim.SUBMITTED_to_APPROVED
          - state_machines.RebateClaim.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Job.approved_rebate_total_cents is conserved across approve/void: approving a rebate raises
          it 0->50000, voiding it lowers 50000->0, returning the rebate-money quantity to its
          pre-approval value — a different conserved quantity than crew-days.
        test_recipe:
          setup:
            - "Attic scope INSTALLED at achieved R25; rebate submitted (finalized 50000) then APPROVED (Job.approved_rebate_total 50000)"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "19 Juniper St", year_built: 1957, conditioned_area_sqft: 1500, foundation_type: "BASEMENT", heating_fuel_type: "OIL" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 300000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 38, estimated_cost_cents: 100000, estimated_savings_kwh: 500 }
              as: Auditor
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew N", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 20 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/mark-installed"
              payload: { achieved_r_value: 25, actual_cost_cents: 100000 }
              as: Installer
            - call: "POST /weatherization/rebate-claims"
              payload: { job_id: "${job_id}", scope_item_id: "${scope_id}" }
              as: ProgramAdmin
              captures: { rebate_id: $.data.id }
            - call: "POST /weatherization/rebate-claims/${rebate_id}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /weatherization/rebate-claims/${rebate_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /weatherization/rebate-claims/${rebate_id}/void"
              payload: {}
              as: ProgramAdmin
          assert:
            - "RebateClaim.${rebate_id}.status == VOIDED"
            - "Job.${job_id}.approved_rebate_total_cents == 0"
