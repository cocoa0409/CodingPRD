            - "response.data.error_id == 'ERR_STALE_VERSION'"

      - name: occ_appeal_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appeal-create-stale-case]
          - state_machines.Case.JUDGMENT_ENTERED_to_ON_APPEAL
        distinguishing_aspect: |
          POST /appeals with expected_case_version equal to the freshly-read Case.version
          succeeds, drives Case to ON_APPEAL, and bumps Case.version by 1.
        test_recipe:
          setup: ["A JUDGMENT_ENTERED case; client reads the current Case.version immediately before filing the appeal; clock 2026-04-10."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct BM", jurisdiction_code: "CA", filing_fee_cents: 43500 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
