              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LINE_NOT_OPEN (line posture RESTRICTED gates the order transition)"
            - "Order.${o1} remains QUEUED with started_at == null"
      - name: sanitation_start_gated_by_refilling_hopper
        grounds:
          - state_machines.SanitationCycle.SCHEDULED_to_IN_PROGRESS
          - state_machines.Hopper
          - errors[ERR_LINE_BUSY]
        distinguishing_aspect: |
          Different entity pair (SanitationCycle -> Hopper): a cycle whose line has
          a REFILLING hopper cannot start even inside its window — the cycle's
          transition depends on the hopper's state, not on the cycle's own fields.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING shelf life 240; hopper H1 capacity 500, loaded 300, DEPLETED via 0 g reading with a READY batch B1 1000 g so the auto refill task is READY; refill started => H1 REFILLING"
            - "sanitation cycle C1 scheduled 00:10-00:40 on L1; clock at 00:15 (inside window)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
