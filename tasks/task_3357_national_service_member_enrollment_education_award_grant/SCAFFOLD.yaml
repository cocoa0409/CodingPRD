  - { id: ERR_ALLOWANCE_EARNED_CAP_EXCEEDED, http: 422, condition: "Payment would exceed the hours-earned allowance cap" }
  - { id: ERR_INSUFFICIENT_AWARD_BALANCE, http: 422, condition: "Use amount above the education award's remaining balance" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; can only self-register as a member"
    identity: opaque
    exclusive_operations: ["POST /members/register"]
    shared_operations: []
  - name: CNCSProgramOfficer
    description: "Federal program officer: runs competitions, adjudicates checks, makes award decisions, suspends/reinstates/closes awards, resolves escalated grievances, reviews performance reports, sets the logical clock"
    identity: opaque
    exclusive_operations: ["POST /organizations", "POST /organizations/{id}/debar", "POST /competitions", "POST /competitions/{id}/close", "POST /applications/{id}/request-clarification", "POST /applications/{id}/award", "POST /applications/{id}/reject", "POST /awards/{id}/suspend", "POST /awards/{id}/reinstate", "POST /awards/{id}/close", "POST /criminal-history-checks/{id}/component-results", "POST /grievances/{id}/resolve", "POST /performance-measures/{id}/review", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: GranteeStaff
    description: "Staff of a service organization; X-User-ID equals the organization's id; manages its own applications, enrollments, hour entries, allowance payments, match reports, performance measures, and corrective-action evidence"
    identity: "entity_backed:GranteeOrganization"
    exclusive_operations: ["POST /competitions/{id}/applications", "POST /applications/{id}/submit", "POST /applications/{id}/respond-clarification", "POST /awards/{id}/enrollments", "POST /enrollments/{id}/suspend", "POST /enrollments/{id}/reinstate", "POST /enrollments/{id}/exit", "POST /enrollments/{id}/hour-entries", "POST /hour-entries/{id}/certify", "POST /hour-entries/{id}/reject", "POST /enrollments/{id}/allowance-payments", "POST /awards/{id}/match-reports", "POST /awards/{id}/performance-measures", "POST /performance-measures/{id}/reports", "POST /findings/{id}/submit-evidence", "POST /members/{id}/criminal-history-checks"]
    shared_operations: ["GET endpoints for org-scoped resources"]
  - name: Member
    description: "Enrolled national service member; X-User-ID equals the member id; files grievances and requests education award uses on their own records"
    identity: "entity_backed:Member"
    exclusive_operations: ["POST /enrollments/{id}/grievances", "POST /grievances/{id}/escalate", "POST /education-awards/{id}/uses"]
    shared_operations: ["GET endpoints for own member record, enrollments, checks, hour entries, payments, education awards, uses, grievances"]
  - name: ComplianceOfficer
    description: "Federal compliance officer; schedules and conducts visits, records findings, assigns corrective action, decides on evidence (never on a visit they created), runs the overdue sweep"
    identity: opaque
    exclusive_operations: ["POST /awards/{id}/compliance-visits", "POST /compliance-visits/{id}/conduct", "POST /compliance-visits/{id}/findings", "POST /findings/{id}/assign-corrective-action", "POST /findings/{id}/decide", "POST /compliance/sweep-overdue"]
    shared_operations: ["all GET endpoints"]
  - name: TrustAdministrator
    description: "National service trust administrator; approves/denies and rescinds education award uses"
    identity: opaque
    exclusive_operations: ["POST /education-award-uses/{id}/decide", "POST /education-award-uses/{id}/rescind"]
    shared_operations: ["GET /education-awards", "GET /education-awards/{id}", "GET /education-awards/{id}/uses"]



