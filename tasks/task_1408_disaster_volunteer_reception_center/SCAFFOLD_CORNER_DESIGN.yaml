            - { call: "POST /vrc/volunteers", payload: { incident_id: "${inc}", full_name: "Yara Yip", phone: "555-70", email: "yy3@x.com", home_locality: "Riverton" }, as: IntakeCoordinator, captures: { vol: $.data.id } }
          trigger:
            - { call: "GET /vrc/volunteers/${vol}", payload: {}, as: VRCManager }
            - { call: "GET /vrc/incidents/${inc}/volunteers", payload: {}, as: VRCManager }
          assert:
            - "single GET: response_type == 'object', meta.api_request_id present, data is a map with id == ${vol}"
            - "list GET: response_type == 'array', data is a list of length 1, total_count == 1, has_more == false, limit == 10, offset == 0"

