      - name: harvest_reject_edit_resubmit_cycle
        claim_type: cyclic_transition
        grounds: [state_machines.HarvestLog.SUBMITTED_to_REJECTED, state_machines.HarvestLog.REJECTED_to_DRAFT, "errors[ERR_INVALID_HARVEST_STATE]"]
        distinguishing_aspect: "HarvestLog has its own resubmission cycle (distinct from CropPlan's): REJECTED stores a reason, returns to DRAFT clearing it, allows PATCH edits only while DRAFT, and reaches VERIFIED on the second pass."
        test_recipe:
          setup: ["season HARVESTING; bed HARVEST_OPEN; certified logger V1; officer O; log L1 SUBMITTED"]
