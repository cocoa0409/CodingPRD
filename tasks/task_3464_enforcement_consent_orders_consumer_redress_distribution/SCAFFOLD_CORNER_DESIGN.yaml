            - "e_inv == ERR_INVESTIGATION_NOT_FOUND (404)"
            - "e_judgment == ERR_JUDGMENT_NOT_FOUND (404)"
            - "e_fund == ERR_REDRESS_FUND_NOT_FOUND (404)"
            - "e_claim == ERR_CLAIM_NOT_FOUND (404)"
            - "e_claimant == ERR_CLAIMANT_NOT_FOUND (404) — the body FK resolves before any fund check"

      - name: nested_paths_and_transition_targets_with_unknown_ids_return_entity_specific_not_found
