          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Priority 1: a call without X-User-Role/X-User-ID fails before any role or existence check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /r2t4/terms"
              payload: { name: "NoAuth", start_date: "2026-08-24", end_date: "2026-12-11" }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: student_cannot_create_term
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
          - "roles"
        distinguishing_aspect: "Peer-role isolation: Student is not in POST /r2t4/terms roles — 403 even for a well-formed body."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /r2t4/terms"
              payload: { name: "StuTerm", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: Student
              as_user_id: "00000000-0000-4000-8000-0000000000aa"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (http 403)"

      - name: student_cannot_respond_to_other_students_offer
        claim_type: cross_entity_validation
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "Ownership is resolved through the chain offer -> case -> enrollment -> student_id: student B responding to student A's offer gets ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["PWD fixture for student A (offer 80000 SENT); student B exists"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
