          rationale: "The conditional re-derivation that fires only when the student DECLINES (informal variant -> formal variant, disjoint ladder bands) is asserted by the named §1.8 instance."

  # =========================================================================
  # SECTION: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: severity_assessment_read_exposes_every_intermediate_for_a_clean_first_offence
        claim_type: Computed read
        grounds:
          - endpoints[GET /integrity/cases/{id}/severity-assessment]
          - calculations.evidence_strength_score
          - calculations.case_severity_index
          - calculations.sanction_ladder_placement
          - calculations.cross_course_pattern_points
        distinguishing_aspect: |
          For a first offender with no other course involvement (worked example CASE-C) every
          intermediate is pinned: evidence_strength_score 60.00, base_points 20,
          evidence_contribution 24.00, cross_course_pattern_points 0,
          prior_upheld_count_at_assessment 0, provisional_severity_index 44.00,
          prior_escalation_points 0, severity_index 44.00, tier_rank 3,
          panel_severity_recommendation null, recommended_ladder_rank 3, recommended_kind
          GRADE_PENALTY_COURSE, band [2, 4], required_panel_size 3, attorney_advisor_permitted false,
          informal_pathway_permitted true. The same read with pathway_basis == INFORMAL returns the
          SAME index (44.00) but zeroed repeat-offense fields and the narrower band [1, 3].
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one ENGL-201 PLAGIARISM case built on SEED-A evidence (similarity_pct 45.00, page_count 4) for a student with no prior cases"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 5 }
              as: IntegrityOfficer
              captures: { dept_engl_id: $.data.id }
