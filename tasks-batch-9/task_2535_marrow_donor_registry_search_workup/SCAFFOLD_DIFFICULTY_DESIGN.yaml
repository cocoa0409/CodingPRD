              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { ctr_minutes_1: "$.data.committed_slot_minutes" }
            - call: "POST /registry/collection-bookings/${bk_id}/confirm"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_blocked_1: "$.data.blocked_day_count" }
            - call: "POST /registry/collection-bookings/${bk_id}/cancel"
              payload: { reason: "CENTER_UNAVAILABLE" }
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
            - call: "GET /registry/collection-centers/${ctr_id}"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${ctr_id}"
              captures: { ctr_minutes_2: "$.data.committed_slot_minutes" }
            - call: "GET /registry/donors/${d1_id}"
              payload: {}
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_blocked_2: "$.data.blocked_day_count" }
          assert:
            - "committed_slot_minutes trajectory is 0 -> 300 -> 300 -> 0: created at 0, raised by the HELD booking's duration_minutes 300, unchanged by confirmation, released in full by the cancel"
            - "blocked_day_count trajectory is 0 -> 0 -> 6 -> 0: unchanged while the booking is only HELD, raised by the COLLECTION_WINDOW row 2026-10-07..2026-10-12 (day_count 6) at confirmation, restored when that row is RELEASED by the cancel"
            - "GET /registry/donors/${d1_id}/unavailability-windows returns exactly one row after the cancel, in status RELEASED with released_at set, day_count still 6 and date_from/date_to unchanged - the row is never deleted and never re-counted"
            - "CollectionBooking.${bk_id}.status == CANCELLED, cancel_reason == \"CENTER_UNAVAILABLE\", cancelled_after_confirmation == true"
            - "WorkupCase.${wc_id}.logistics_status == METHOD_SET again and clearance_status stays CLEARED - the cancel compensates only the logistics dimension"
            - "the cancellation fee lives in a different ledger: the PROVISIONAL claim's total_usd_cents is still 2072000 and Patient.committed_cost_cents is still 2072000, so the capacity ledgers show no fee-induced drift"
            - "re-booking the same case at 2026-10-11T08:00:00Z is accepted after the cancel, proving the released minutes are genuinely available and not merely bookkept"

      - name: claim_void_restores_patient_committed_cost_and_frees_the_budget
        grounds:
          - calculations.derived_counter_reconciliation
          - entities.Patient.fields.committed_cost_cents
          - state_machines.ReimbursementClaim.PROVISIONAL_to_VOID
          - validations.priority_55_ERR_PATIENT_BUDGET_EXCEEDED
          - calculations.reimbursement_claim_amount.variants.PROVISIONAL
        distinguishing_aspect: |
          A different conserved quantity - the patient's committed MONEY (committed_cost_cents) against
          a hard case_budget_cents ceiling - restored by a different trigger: a clearance FAIL deep
          inside the workup, not an operator cancel. The budget is deliberately sized so the promoted
          backup's second workup only fits if the voided claim released its commitment exactly; any
          leak turns the second workup into ERR_PATIENT_BUDGET_EXCEEDED (402).
        test_recipe:
          setup:
            - "domestic registry, donors D1 and D3, one patient with case_budget_cents 2500000 - room for exactly one provisional claim of 2072000"
            - "search DOMESTIC_ONLY materialises D1 as PRIMARY and D3 as the single BACKUP"
            - "D1's case is opened, then its PHYSICAL clearance item fails"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"], ambiguous_loci: [], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 2500000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id", p_committed_0: "$.data.committed_cost_cents" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id", mc3_id: "$.data[1].id" }
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id" }
            - call: "POST /registry/typing-requests/${ct1_id}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/screening"
              payload: { outcome: "PASS", deferral_type: "NONE" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/workup-cases"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { wc_id: "$.data.id" }
            - call: "GET /registry/reimbursement-claims"
              payload: { workup_case_id: "${wc_id}" }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { claim1_id: "$.data[0].id", claim1_total: "$.data[0].total_usd_cents" }
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_committed_1: "$.data.committed_cost_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "GET /registry/workup-cases/${wc_id}/clearance-items"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { ci_phys: "$.data[0].id" }
          trigger:
            - call: "POST /registry/clearance-items/${ci_phys}/result"
              payload: { result: "FAIL", note: "Cardiac clearance withheld" }
              as: MedicalDirector
              as_user_id: "md-1"
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_committed_2: "$.data.committed_cost_cents" }
            - call: "POST /registry/match-candidates/${mc3_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct3_id: "$.data.id" }
            - call: "POST /registry/typing-requests/${ct3_id}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc3_id}/screening"
              payload: { outcome: "PASS", deferral_type: "NONE" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc3_id}/workup-cases"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { wc2_id: "$.data.id" }
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_committed_3: "$.data.committed_cost_cents" }
          assert:
            - "committed_cost_cents trajectory is 0 -> 2072000 -> 0 -> 2072000: zero at patient creation, raised by the first PROVISIONAL claim (PBSC lines 34500 + 78000 + 52500 + 1450000 + 265000 + 192000, no discount because 2072000 < DISCOUNT_TIER_1), restored to zero by the FAIL, then raised again by the backup's claim"
            - "ReimbursementClaim.${claim1_id}.status == VOID with void_reason recorded, total_usd_cents still 2072000 and no line removed - the void is a status compensation, not a deletion"
            - "WorkupCase.${wc_id}.case_status == ABORTED and clearance_status == FAILED; DonorProfile.${d1_id}.availability_status == TEMPORARILY_DEFERRED with deferral_until \"2026-12-10\" and an ACTIVE DEFERRAL window 2026-09-11..2026-12-10 of day_count 91"
            - "MatchCandidate.${mc1_id}.status == EXCLUDED, MatchCandidate.${mc3_id}.candidate_role == PRIMARY with promoted_from_rank 2, and SearchRequest.${sr_id}.status == BACKUP_REQUIRED with backup_candidate_count 0"
            - "the backup's workup open returns 201 and its new PROVISIONAL claim's total_usd_cents is 2072000, which fits case_budget_cents 2500000 ONLY because the voided commitment was released (2072000 + 2072000 == 4144000 would exceed it)"
            - "GET /registry/reimbursement-claims?patient_id=${p_id} returns two rows - one VOID and one PROVISIONAL - and only the PROVISIONAL one is counted in committed_cost_cents"
            - "the sum over the patient's non-VOID claims equals committed_cost_cents at every one of the four observation points, with no residue from the aborted case"
