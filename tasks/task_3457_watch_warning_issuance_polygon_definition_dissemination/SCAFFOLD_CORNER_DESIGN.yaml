              as: PlatformAdmin
              captures: { ov2_za: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZOVB", name: "OccV Zone B", office_id: "${ov2_off_b}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.2, lon_max: 0.3, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { ov2_zb: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${ov2_off_a}", full_name: "Olive Ov", employee_code: "EMP-OV", level: "SENIOR" }
              as: PlatformAdmin
              captures: { ov2_fc: $.data.id }
            - call: "POST /_clock/set_current_utc"
