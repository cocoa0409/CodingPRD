      - name: leftmost_unresolved_reference_decides_the_404_code
        claim_type: cascading_validation
        grounds:
          - validations[priority=4]
          - errors[ERR_SUBJECT_NOT_FOUND]
          - errors[ERR_ASSET_NOT_FOUND]
        distinguishing_aspect: "Existence checks run in the declared input order, so a request with two unresolvable references reports the first one (data_subject_id) and only reports the second once the first is repaired — proving the checks are ordered rather than collected."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL and one registered EMPLOYEE DataSubject; no BiometricAsset exists at all."
          setup_api_calls:
            - call: "POST /programs"
