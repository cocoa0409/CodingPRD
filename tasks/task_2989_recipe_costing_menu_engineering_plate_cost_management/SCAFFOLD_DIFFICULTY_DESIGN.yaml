          One submit call violates ERR_COST_STALE (priority 26, HTTP 409) and
          ERR_MARKET_CAP_EXCEEDED (priority 47, HTTP 422) simultaneously and must report the
          state-category rule; once the plate cost is refreshed the SAME request returns the fiscal
          error, proving the second violation was live all along. Note the winning error carries the
          LOWER HTTP status here (409 before 422), so status codes cannot stand in for priorities.
          The other priority_pair instance inverts that shape: its winner is a 422 referential rule
          beating a 409 temporal rule, and its two violations sit on two different rows rather than
          one request.
