              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9017", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 2, power_commit_kw: 20.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab1_id: $.data.id }
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C02", rated_power_kw: 20.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab2_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab1_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab2_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
          trigger:
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab1_id}", purpose: "AUDIT", window_start: "2026-08-01T10:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SecurityOfficer
              captures: { v1_id: $.data.id }
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab2_id}", purpose: "AUDIT", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T14:00:00Z" }
              as: SecurityOfficer
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab2_id}", purpose: "AUDIT", window_start: "2026-08-01T12:00:01Z", window_end: "2026-08-01T14:00:00Z" }
              as: SecurityOfficer
              captures: { v3_id: $.data.id }
            - call: "POST /colocation/access-visits/${v1_id}/state"
              payload: { to_state: "CANCELLED" }
              as: SecurityOfficer
            - call: "POST /colocation/access-visits/${v3_id}/state"
              payload: { to_state: "CANCELLED" }
              as: SecurityOfficer
            - call: "POST /colocation/access-visits"
              payload: { contract_id: "${ctr_id}", contact_id: "${con_id}", cabinet_id: "${cab2_id}", purpose: "AUDIT", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T14:00:00Z" }
