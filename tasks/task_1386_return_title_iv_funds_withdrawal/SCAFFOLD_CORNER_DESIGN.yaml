          assert:
            - "ReturnObligation.${ob5}.status == RETURNED and returned_amount_cents == 80000 (late return accepted from OVERDUE)"
            - "WithdrawalCase.${c5}.status == CLOSED (all obligations terminal, notification was sent at calculate)"

      - name: award_initial_state_by_program
        claim_type: initial_state
        grounds:
          - "state_machines.AidAward"
          - "entities.AidAward.fields.status"
        distinguishing_aspect: "Initial state depends on program: PELL_GRANT starts ACCEPTED (no student action), loans start OFFERED (acceptance required before disbursement)."
        test_recipe:
          setup: ["Term T1; enrollment"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "S6", full_name: "Stu 6", email: "s6@x.edu" }
              as: RegistrarClerk
              captures: { s6: $.data.id }
            - call: "POST /r2t4/students/${s6}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e6: $.data.id }
          trigger:
            - call: "POST /r2t4/enrollments/${e6}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p6_status: $.data.status, p6_grant: $.data.is_grant }
            - call: "POST /r2t4/enrollments/${e6}/awards"
              payload: { program: "UNSUBSIDIZED_LOAN", amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { u6_status: $.data.status, u6_grant: $.data.is_grant }
          assert:
            - "PELL award: status == ACCEPTED and is_grant == true at creation"
            - "UNSUBSIDIZED_LOAN award: status == OFFERED and is_grant == false at creation"

      - name: complete_cancels_scheduled_disbursements
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Enrollment.ENROLLED_to_COMPLETED"
          - "state_machines.AidDisbursement.SCHEDULED_to_CANCELLED"
        distinguishing_aspect: "Conditional cascade: completing the term cancels only SCHEDULED disbursements; DISBURSED rows are untouched."
        test_recipe:
          setup: ["Term T1; enrollment; PELL 200000 with 100000 DISBURSED and 100000 SCHEDULED; clock set past term end (2026-12-12)"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "S7", full_name: "Stu 7", email: "s7@x.edu" }
              as: RegistrarClerk
              captures: { s7: $.data.id }
            - call: "POST /r2t4/students/${s7}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e7: $.data.id }
            - call: "POST /r2t4/enrollments/${e7}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p7: $.data.id }
            - call: "POST /r2t4/awards/${p7}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { d7a: $.data.id }
            - call: "POST /r2t4/disbursements/${d7a}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${p7}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { d7b: $.data.id }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-12T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /r2t4/enrollments/${e7}/complete"
              payload: {}
              as: RegistrarClerk
              captures: { e7_status: $.data.status }
            - call: "GET /r2t4/disbursements/${d7a}"
              payload: {}
              as: RegistrarClerk
              captures: { d7a_status: $.data.status }
            - call: "GET /r2t4/disbursements/${d7b}"
              payload: {}
              as: RegistrarClerk
              captures: { d7b_status: $.data.status }
          assert:
            - "Enrollment.${e7}.status == COMPLETED"
            - "AidDisbursement.${d7b}.status == CANCELLED (was SCHEDULED)"
            - "AidDisbursement.${d7a}.status == DISBURSED (untouched by the cascade)"

      - name: withdraw_creates_open_case_with_snapshot
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Enrollment.ENROLLED_to_WITHDRAWN"
          - "calculations.withdrawal_date_determination"
        distinguishing_aspect: "The withdraw call itself (before any calculate) creates the OPEN case with withdrawal_date/determination_date/completed_days/percentage_completed already computed."
        test_recipe:
          setup: ["Term T1 (attendance_taking_required=false); enrollment; clock 2026-12-01"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "S8", full_name: "Stu 8", email: "s8@x.edu" }
              as: RegistrarClerk
              captures: { s8: $.data.id }
            - call: "POST /r2t4/students/${s8}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { e8: $.data.id }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /r2t4/enrollments/${e8}/withdraw"
              payload: { withdrawal_type: "UNOFFICIAL" }
              as: RegistrarClerk
              captures: { c8: $.data.id, c8_status: $.data.status, c8_wd: $.data.withdrawal_date, c8_det: $.data.determination_date, c8_days: $.data.completed_days, c8_pct: $.data.percentage_completed }
            - call: "GET /r2t4/enrollments/${e8}"
              payload: {}
              as: RegistrarClerk
              captures: { e8_status: $.data.status, e8_case: $.data.current_withdrawal_case_id }
          assert:
            - "WithdrawalCase.${c8}.status == OPEN, withdrawal_date == '2026-10-15' (midpoint day 53 of 105), determination_date == '2026-12-01' (logical clock)"
            - "completed_days == 53 and percentage_completed == 0.505"
            - "Enrollment.${e8}.status == WITHDRAWN and current_withdrawal_case_id == ${c8}"

      - name: rescind_blocked_when_return_completed_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Enrollment.WITHDRAWN_to_ENROLLED"
          - "errors[ERR_RETURN_ALREADY_COMPLETED]"
        distinguishing_aspect: "Cross-entity guard: rescission inspects the case's obligations; any RETURNED row freezes the compensation path with ERR_RETURN_ALREADY_COMPLETED."
        test_recipe:
          setup:
            - "T2 2026-09-01..2026-12-09 (100 days); charges 80000; PELL 200000 + SUB 300000 disbursed; clock 2026-11-15; UNOFFICIAL withdraw -> midpoint 0.500"
            - "Calculate -> school 40000 (min(80000*0.5, 250000)), student 50000; BursarClerk records the SCHOOL return (obligations list index 0)"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall Mini", start_date: "2026-09-01", end_date: "2026-12-09" }
              as: RegistrarClerk
              captures: { t2: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "S9", full_name: "Stu 9", email: "s9@x.edu" }
              as: RegistrarClerk
              captures: { s9: $.data.id }
            - call: "POST /r2t4/students/${s9}/enrollments"
              payload: { term_id: "${t2}", institutional_charges_cents: 80000 }
              as: RegistrarClerk
              captures: { e9: $.data.id }
            - call: "POST /r2t4/enrollments/${e9}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { p9: $.data.id }
            - call: "POST /r2t4/awards/${p9}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { d9a: $.data.id }
            - call: "POST /r2t4/disbursements/${d9a}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${e9}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { l9: $.data.id }
            - call: "POST /r2t4/awards/${l9}/accept"
              payload: {}
              as: Student
              as_user_id: "${s9}"
            - call: "POST /r2t4/awards/${l9}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { d9b: $.data.id }
            - call: "POST /r2t4/disbursements/${d9b}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/enrollments/${e9}/withdraw"
              payload: { withdrawal_type: "UNOFFICIAL" }
              as: RegistrarClerk
              captures: { c9: $.data.id }
            - call: "POST /r2t4/withdrawal-cases/${c9}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${c9}/obligations"
              payload: {}
              as: FinancialAidOfficer
              captures: { ob9_school: "$.data[0].id" }
            - call: "POST /r2t4/return-obligations/${ob9_school}/record-return"
              payload: { amount_cents: 40000 }
              as: BursarClerk
          trigger:
            - call: "POST /r2t4/enrollments/${e9}/rescind-withdrawal"
              payload: {}
              as: RegistrarClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RETURN_ALREADY_COMPLETED (http 409)"
            - "Enrollment.${e9}.status remains WITHDRAWN; WithdrawalCase.${c9}.status remains CALCULATED (student obligation still PENDING)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: unaccepted_loan_excluded_from_disbursable
        claim_type: input_set_filtering
        grounds:
          - "calculations.r2t4_earned_unearned"
        distinguishing_aspect: "Input set filter: awards in OFFERED status are excluded from aid_disbursable_cents even when they carry SCHEDULED disbursements — only ACCEPTED awards count."
        test_recipe:
          setup: ["Term T1; enrollment charges 600000; PELL 200000 ACCEPTED+disbursed; SUB 300000 left OFFERED with 300000 SCHEDULED; withdraw OFFICIAL 2026-09-02 (pct 0.095)"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SA", full_name: "Stu A", email: "sa@x.edu" }
              as: RegistrarClerk
              captures: { sa: $.data.id }
            - call: "POST /r2t4/students/${sa}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { ea: $.data.id }
            - call: "POST /r2t4/enrollments/${ea}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pa: $.data.id }
            - call: "POST /r2t4/awards/${pa}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { da: $.data.id }
            - call: "POST /r2t4/disbursements/${da}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ea}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { la: $.data.id }
            - call: "POST /r2t4/awards/${la}/disbursements"
              payload: { amount_cents: 300000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ea}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-09-02" }
              as: RegistrarClerk
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${ca}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
          assert:
            - "WithdrawalCase.${ca}.aid_disbursable_cents == 200000 (the OFFERED loan and its 300000 SCHEDULED row are excluded)"
            - "WithdrawalCase.${ca}.aid_earned_cents == 19000 (round_half_up(200000 * 0.095))"

      - name: offer_deadline_constants_applied
        claim_type: constants_applied
        grounds:
          - "calculations.offer_deadlines"
          - "entities.PostWithdrawalOffer.fields.late_offer"
        distinguishing_aspect: "Constants 14 and 30 from offer_deadlines: an offer created 36 days after determination carries response_deadline = offered + 14d and late_offer == true."
        test_recipe:
          setup: ["PWD fixture (charges 500000; PELL 100000 disbursed + 100000 scheduled; SUB 100000 disbursed + 200000 scheduled, accepted); withdraw OFFICIAL 2026-10-25; clock advanced to 2026-11-30 before calculate (determination 2026-10-25, +30d = 2026-11-24)"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SB", full_name: "Stu B", email: "sb@x.edu" }
              as: RegistrarClerk
              captures: { sb: $.data.id }
            - call: "POST /r2t4/students/${sb}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 500000 }
              as: RegistrarClerk
              captures: { eb: $.data.id }
            - call: "POST /r2t4/enrollments/${eb}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pb: $.data.id }
            - call: "POST /r2t4/awards/${pb}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { db1: $.data.id }
            - call: "POST /r2t4/disbursements/${db1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${pb}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${eb}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { lb: $.data.id }
            - call: "POST /r2t4/awards/${lb}/accept"
              payload: {}
              as: Student
              as_user_id: "${sb}"
            - call: "POST /r2t4/awards/${lb}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { db2: $.data.id }
            - call: "POST /r2t4/disbursements/${db2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${lb}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${eb}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { cb: $.data.id }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T10:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cb}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/withdrawal-cases/${cb}/offers"
              payload: {}
              as: FinancialAidOfficer
              captures: { ofb_late: "$.data[0].late_offer", ofb_dl: "$.data[0].response_deadline" }
          assert:
            - "PostWithdrawalOffer.late_offer == true (offered 2026-11-30 > determination 2026-10-25 + 30d = 2026-11-24)"
            - "PostWithdrawalOffer.response_deadline == '2026-12-14' (offered date 2026-11-30 + 14d)"

      - name: attendance_basis_unofficial_uses_last_attendance
        claim_type: variant_selection
        grounds:
          - "calculations.withdrawal_date_determination"
          - "entities.AcademicTerm.fields.attendance_taking_required"
        distinguishing_aspect: "Variant selection: on an attendance-taking term the UNOFFICIAL withdrawal_date is the documented last_attendance_date (2026-09-20, day 28), NOT the midpoint (day 53)."
        test_recipe:
          setup: ["Term T1 shape but attendance_taking_required=true; enrollment; withdraw UNOFFICIAL with last_attendance_date 2026-09-20"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall Att", start_date: "2026-08-24", end_date: "2026-12-11", attendance_taking_required: true }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SC", full_name: "Stu C", email: "sc@x.edu" }
              as: RegistrarClerk
              captures: { sc: $.data.id }
            - call: "POST /r2t4/students/${sc}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { ec: $.data.id }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /r2t4/enrollments/${ec}/withdraw"
              payload: { withdrawal_type: "UNOFFICIAL", last_attendance_date: "2026-09-20" }
              as: RegistrarClerk
              captures: { cc_wd: $.data.withdrawal_date, cc_days: $.data.completed_days, cc_pct: $.data.percentage_completed }
          assert:
            - "WithdrawalCase.withdrawal_date == '2026-09-20' (attendance basis, not midpoint 2026-10-15)"
            - "completed_days == 28 and percentage_completed == 0.267 (28/105 rounded to 3 decimals)"

      - name: student_payment_reduces_balance
        claim_type: correct_result
        grounds:
          - "calculations.student_balance"
          - "entities.StudentAccountEntry.fields.entry_type"
        distinguishing_aspect: "Aggregation with sign convention: a PAYMENT entry of -50000 moves balance_cents from 600000 to 550000 immediately."
        test_recipe:
          setup: ["Term T1; enrollment charges 600000 (balance 600000)"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/students"
              payload: { external_ref: "SD", full_name: "Stu D", email: "sd@x.edu" }
