  # =========================================================================
  # 2. From Table 2 (State Machines) - eight machines, cyclic shape, two
  #    independent dimensions on LetterOfIntent, two bubble-up aggregates and
  #    two conditional initial states.
  # =========================================================================
  - section: state_machines
    instances:
      - name: restructuring_initial_state_is_exploratory_with_round_one
        claim_type: initial_state
        grounds:
          - state_machines.Restructuring.initial_state
          - entities.Restructuring.fields.status
          - entities.Restructuring.fields.round_no
        distinguishing_aspect: |
          A freshly opened exploratory conversation must land in EXPLORATORY with
          round_no 1 and an EMPTY seat pool - combined_board_seats and
          reserved_seat_pool are both 0 because no letter of intent has been
          executed yet, and restricted_asset_posture is NOT_ASSESSED rather than
          CLEARED because zero party funds is a different fact from all funds
          resolved. An implementation that seeds the pool at deal creation, or that
          reports CLEARED for an unexamined balance sheet, fails here.
        test_recipe:
          setup:
            - "Two Organizations registered in CA, so ag_review_required is derived true"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
          trigger:
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
          assert:
            - "the call returns HTTP status 201"
            - "Restructuring.${deal}.status == EXPLORATORY"
            - "Restructuring.${deal}.round_no == 1"
            - "Restructuring.${deal}.version == 1"
            - "Restructuring.${deal}.structure_type is null"
            - "Restructuring.${deal}.combined_board_seats == 0"
            - "Restructuring.${deal}.reserved_seat_pool == 0"
            - "Restructuring.${deal}.unrestricted_transfer_value_cents == 0"
            - "Restructuring.${deal}.unresolved_restricted_fund_count == 0"
            - "Restructuring.${deal}.restricted_asset_posture == NOT_ASSESSED"
            - "Restructuring.${deal}.ag_review_required == true"
            - "Restructuring.${deal}.abandonment_reason is null"

      - name: letter_execution_seeds_the_reserved_seat_pool_and_opens_diligence
        claim_type: side_effect_execution
        grounds:
          - state_machines.LetterOfIntent.ISSUED_to_EXECUTED
          - state_machines.Restructuring.LOI_NEGOTIATION_to_DILIGENCE
          - endpoints.POST_/letters-of-intent/{id}/execute
        distinguishing_aspect: |
          Countersignature fires FOUR side effects in one request: the letter's own
          status and executed_at, the deal's advance to DILIGENCE, the copy of the
          letter's combined_board_seats into the deal, and the seeding of
          reserved_seat_pool from that copy. The letter's exclusivity_status must
          stay ACTIVE - execution does not consume the exclusivity window. An
          implementation that advances the deal but leaves reserved_seat_pool at 0
          silently breaks every later certification.
        test_recipe:
          setup:
            - "A Restructuring in LOI_NEGOTIATION with one ISSUED LetterOfIntent proposing MERGER, combined_board_seats 15, board_seat_split_initiator 8 and a 60-day exclusivity window opening 2026-08-01"
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
          trigger:
            - call: "POST /letters-of-intent/${loi}/execute"
              payload: { executed_note: "countersigned by the target board chair" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
          assert:
            - "the call returns HTTP status 200"
            - "LetterOfIntent.${loi}.status == EXECUTED"
            - "LetterOfIntent.${loi}.executed_at == 2026-08-01T00:00:00.000Z"
            - "LetterOfIntent.${loi}.exclusivity_status == ACTIVE"
            - "LetterOfIntent.${loi}.exclusivity_end_date == 2026-09-29"
            - "LetterOfIntent.${loi}.expires_at == 2026-09-29T00:00:00.000Z"
            - "LetterOfIntent.${loi}.version == 2"
            - "Restructuring.${deal}.status == DILIGENCE"
            - "Restructuring.${deal}.combined_board_seats == 15"
            - "Restructuring.${deal}.reserved_seat_pool == 15"

      - name: second_execute_of_the_same_letter_is_refused_as_invalid_letter_state
        claim_type: idempotency
        grounds:
          - state_machines.LetterOfIntent.terminal_states
          - validations.priority_17_ERR_INVALID_LETTER_STATE
        distinguishing_aspect: |
          EXECUTED is terminal on the negotiation dimension, so a repeated
          countersignature is not idempotent-success but a 409: replaying it must
          not re-seed reserved_seat_pool (which would double-count seats), must not
          re-advance the deal, and must not bump either version. The failure mode
          this catches is an implementation that treats execute as an upsert.
        test_recipe:
          setup:
            - "A Restructuring in DILIGENCE whose LetterOfIntent is already EXECUTED, with reserved_seat_pool 15"
          setup_api_calls:
            - call: "POST /organizations"
              payload: { legal_name: "Riverside Youth Alliance", ein: "11-1111111", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 59916670 }
              as: PlatformAdmin
              captures: { org_a: $.data.id }
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Youth Collective", ein: "22-2222222", state_code: "CA", mission_code: "YM-YOUTH_MENTORING", annual_expense_cents: 100000002, unrestricted_net_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { org_b: $.data.id }
            - call: "POST /restructurings"
              payload: { initiator_org_id: "${org_a}", target_org_id: "${org_b}", confidentiality_tier: "RESTRICTED" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { deal: $.data.id }
            - call: "POST /alignment-assessments"
              payload: { restructuring_id: "${deal}", variant: "SCREENING" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
            - call: "GET /restructurings/${deal}"
              payload: {}
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { rv_a: $.data.version }
            - call: "POST /letters-of-intent"
              payload: { restructuring_id: "${deal}", expected_restructuring_version: "${rv_a}", proposed_structure_type: "MERGER", combined_board_seats: 15, board_seat_split_initiator: 8, exclusivity_days: 60, exclusivity_start_date: "2026-08-01" }
              as: StrategyOfficer
              as_user_id: "${org_a}"
              captures: { loi: $.data.id }
            - call: "POST /letters-of-intent/${loi}/execute"
              payload: { executed_note: "countersigned" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
          trigger:
            - call: "POST /letters-of-intent/${loi}/execute"
              payload: { executed_note: "duplicate submission from the same fax queue" }
              as: StrategyOfficer
              as_user_id: "${org_b}"
          assert:
            - "the call returns HTTP status 409 with error_id ERR_INVALID_LETTER_STATE"
            - "LetterOfIntent.${loi}.status == EXECUTED"
            - "LetterOfIntent.${loi}.version == 2"
            - "LetterOfIntent.${loi}.executed_at == 2026-08-01T00:00:00.000Z"
            - "Restructuring.${deal}.status == DILIGENCE"
            - "Restructuring.${deal}.reserved_seat_pool == 15"

      - name: retained_fund_locks_out_both_transfer_and_unwind
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RestrictedFund.terminal_states
          - state_machines.RestrictedFund.PETITION_FILED_to_RETAINED
          - validations.priority_18_ERR_INVALID_FUND_STATE
        distinguishing_aspect: |
          RETAINED is the single terminal state of the fund machine: a court that
          refuses to modify the restriction ends the matter forever. Both writes
          that a resolved fund could plausibly still accept - transfer and unwind -
          must be refused from RETAINED, and the refusal must be the state error at
          priority 18 rather than the authority error at priority 30, because the
          fund's problem is that it is finished, not that it lacks consent. The
          retained value must also stay on the holder's books: restricted_corpus_cents
          keeps the whole 62000000 and the deal posture reads CLEARED, since RETAINED
          counts as resolved.
        test_recipe:
          setup:
            - "A Restructuring in STRUCTURE_SELECTED on structure MERGER"
