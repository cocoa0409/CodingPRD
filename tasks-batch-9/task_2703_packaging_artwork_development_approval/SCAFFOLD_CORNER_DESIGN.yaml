            - "that order reports status ORDERED, auto_cancelled false, cancel_reason null and expedite false"
            - "POST /plate-orders with plate_set_count 10, expedite true returns 201 with plate_subtotal_cents == 160000, setup_fee_cents == 90000, expedite_fee_cents == 62500 and cost_cents == 312500"
            - "GET /artwork-assets/${asset_id} reports committed_plate_cost_cents == 475500 (163000 + 312500), still under plate_budget_cents 500000"
            - "both orders reference printer_proof_id ${proof_id} and artwork_version_id ${v1_id}"

      - name: setup_fee_steps_between_eight_and_nine_plates_while_the_band_rate_does_not
        claim_type: constants_applied
        grounds:
          - calculations.plate_order_cost.constants.PLATE_SETUP_FEE_SMALL_CENTS
          - calculations.plate_order_cost.constants.PLATE_SETUP_FEE_LARGE_CENTS
          - entities.PlateOrder.fields.setup_fee_cents
        distinguishing_aspect: |
          The setup fee is a step function with the boundary written as <= 8, so 8
          plates take 60000 and 9 plates take 90000. Nine plates is also the first
          count that enters band 3, so the two constants move in the same call and the
          assert has to separate them: subtotal 134000 -> 147000 is a +13000 band-3
          plate while the fee jumps +30000. An off-by-one boundary (< 8) charges the
          large fee at eight plates and inflates that order by exactly 30000.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z throughout."
            - "Brief SKU-1001 APPROVED (FDA_FOOD / [US] / [en]); ArtworkAsset (CARTON / COATED_PAPER / US) with brand_critical_color false and plate_budget_cents 500000."
            - "ArtworkVersion v1 is APPROVED (all seven elements PASS, compliance_score 100.0, route approved through all three stages with no CONDITIONAL decision)."
            - "Printer Cascade Print Co: color_standard G7_MASTER, certified_substrates [COATED_PAPER, FILM]."
            - "PrinterProof proof_no 1 on COATED_PAPER is PROOF_APPROVED - effective_tolerance 2.0, measured_delta_e_max 1.20 -> COLOR_PASS, substrate SUBSTRATE_APPROVED, press_check_status NOT_REQUIRED (asset is not brand-critical and the substrate is not FILM)."
            - "ArtworkAsset.committed_plate_cost_cents is 0 - no PlateOrder exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
