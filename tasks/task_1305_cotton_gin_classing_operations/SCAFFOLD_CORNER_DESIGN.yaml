      - name: error_envelope_shape_on_404
        claim_type: violation_to_error
        grounds: [response_envelope]
        distinguishing_aspect: "the error envelope is uniform: response_type 'error', data.error_id + data.message, and meta.api_request_id / api_request_timestamp always present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /gin-ops/modules/00000000-0000-0000-0000-000000000000"
              as: CoopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http 404; body.response_type == 'error'; body.data.error_id == ERR_MODULE_NOT_FOUND; body.data.message is a non-empty string"
            - "body.meta.api_request_id and body.meta.api_request_timestamp are present"

