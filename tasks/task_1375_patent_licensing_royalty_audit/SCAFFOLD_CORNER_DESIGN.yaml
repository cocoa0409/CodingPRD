  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type, and data; error responses carry response_type='error' with data.error_id and data.message."
        test_recipe:
          setup: ["one licensee exists"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Env Co", tax_id: "TAX-EV-1", contact_email: "ev@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
          trigger:
            - call: "GET /licensing/licensees/${l1_id}"
              as: LicensingAnalyst
            - call: "GET /licensing/licensees/00000000-0000-0000-0000-000000000000"
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp ISO8601, response_type == 'object', data.id == ${l1_id}"
            - "error: response_type == 'error', data.error_id == ERR_LICENSEE_NOT_FOUND, data.message non-empty"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: action_endpoints_not_found_sweep
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUDIT_NOT_FOUND]", "errors[ERR_FINDING_NOT_FOUND]", "errors[ERR_SUBLICENSE_NOT_FOUND]", "errors[ERR_RUN_NOT_FOUND]"]
        distinguishing_aspect: "Every remaining entity-specific 404 is triggerable through its action endpoint with a well-formed absent UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensing/audits/00000000-0000-0000-0000-000000000000/advance"
              payload: { to_state: FIELDWORK }
              as: LicensingAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /licensing/audit-findings/00000000-0000-0000-0000-000000000000/resolution"
              payload: { resolution: WAIVED }
              as: LicensingAnalyst
              captures: { e2: $.data.error_id }
            - call: "POST /licensing/sublicense-grants/00000000-0000-0000-0000-000000000000/decision"
              payload: { decision: APPROVED }
              as: LicensingAnalyst
              captures: { e3: $.data.error_id }
            - call: "POST /licensing/distribution-runs/00000000-0000-0000-0000-000000000000/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_AUDIT_NOT_FOUND, e2 == ERR_FINDING_NOT_FOUND, e3 == ERR_SUBLICENSE_NOT_FOUND, e4 == ERR_RUN_NOT_FOUND (all 404)"
      - name: reapprove_posted_run_invalid_state
        claim_type: violation_to_error
        grounds: ["state_machines.DistributionRun", "errors[ERR_RUN_INVALID_STATE]"]
        distinguishing_aspect: "Approve is only legal from DRAFT; approving an already-POSTED run yields ERR_RUN_INVALID_STATE (409) and does not re-debit the pool."
        test_recipe:
          setup: ["AG ACTIVE with pool 5000; run created by fin-1 and POSTED by fin-2"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Ra Co", tax_id: "TAX-RA-1", contact_email: "ra@x.test" }
              as: LicensingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /licensing/license-agreements"
              payload:
                licensee_id: "${l1_id}"
                patent_reference: "US-34353-N2"
                title: "Ra"
                royalty_base_definition: NET_SALES
                base_rate_bp: 500
                minimum_period_royalty_cents: 0
                underreport_tolerance_bp: 1000
                inventor_shares: [ { inventor_name: "Ada", share_bp: 10000 } ]
                effective_date: "2026-01-01T00:00:00Z"
                expiration_date: "2028-01-01T00:00:00Z"
              as: LicensingAnalyst
              captures: { ag_id: $.data.id }
            - call: "POST /licensing/license-agreements/${ag_id}/lifecycle"
              payload: { action: ACTIVATE }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports"
              payload:
                agreement_id: "${ag_id}"
                licensee_id: "${l1_id}"
                period_start: "2026-03-01T00:00:00Z"
                period_end: "2026-03-31T00:00:00Z"
                lines: [ { product_label: "A", units_sold: 1, gross_sales_cents: 100000, deductions_cents: 0, is_sublicense_revenue: false } ]
              as: Licensee
              as_user_id: "${l1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /licensing/royalty-reports/${r_id}/validate"
              payload: { benchmark_net_sales_cents: 0 }
              as: LicensingAnalyst
            - call: "POST /licensing/royalty-reports/${r_id}/accept"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /licensing/distribution-runs"
              payload: { agreement_id: "${ag_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", pool_cents: 5000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { run_id: $.data.id }
            - call: "POST /licensing/distribution-runs/${run_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
          trigger:
            - call: "POST /licensing/distribution-runs/${run_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-3"
              captures: { err: $.data.error_id }
            - call: "GET /licensing/license-agreements/${ag_id}"
