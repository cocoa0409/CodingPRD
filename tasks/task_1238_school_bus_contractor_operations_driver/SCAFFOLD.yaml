# =============================================================================
# Task 1238: School Bus Contractor Operations & Driver Supply
# (First Student style contractor) — SCAFFOLD §1.0–§1.7
# =============================================================================

scenario: |
  1238. School Bus Contractor Operations & Driver Supply (First Student style contractor): route/bid contract & per-bus daily rate, driver recruitment, CDL/S-endorsement & training pipeline, daily driver shortage & route doubling decision, field trip charter add-on billing, bus maintenance & state inspection compliance, GPS/ridership data & district reporting, fuel escalation clause, incident/discipline reporting to district

domain_name: school-bus-contractor-operations
api_prefix: /busops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - ops_run_checkpoint          # ServiceDay open-dispatch → lock → reconcile epoch advance
    - cascading_side_effects      # inspection FAIL / credential EXPIRED / contract TERMINATED chains
    - rate_threshold_triggers     # fuel escalation trigger, hours soft/hard caps, SLA windows
    - optimistic_concurrency      # OCC on Contract / ServiceDay / CharterTrip version
  entity_topology: flat           # peer entities with FK references; no nested URL paths
  state_machine_shape: cyclic     # driver retest loop, invoice dispute loop, inspection reinspection loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential            # Assignment.doubled_after_assignment_id (route doubling)
  role_model: peer_roles          # ops / HR / fleet / finance / district / driver own distinct surfaces
  consistency_model: immediate    # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (16 entities, flat topology)
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District display name" }
      - { name: region_fuel_index_code, type: string, source: input, description: "Fuel price index region code used by escalation clause" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed outstanding billed balance in cents" }
      - { name: billing_dispute_window_days, type: integer, source: input, default: 30, description: "Days after invoice issue during which disputes are accepted" }
      - { name: status, type: enum, source: system, description: "ACTIVE (no suspension lifecycle in v1)", default: ACTIVE }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of total_cents over ISSUED (unpaid, non-written-off) invoices across all contracts of this district" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; owning district" }
      - { name: bid_reference, type: string, source: input, description: "District bid solicitation reference" }
      - { name: daily_rate_per_bus_cents, type: integer, source: input, description: "Per-bus per-service-day billed rate in cents" }
      - { name: school_days_per_year, type: integer, source: input, description: "Contracted school days per year" }
      - { name: fuel_base_price_cents, type: integer, source: input, description: "Fuel escalation base price in cents per gallon" }
      - { name: fuel_escalation_trigger_pct, type: integer, source: input, default: 5, description: "Escalation activates when monthly avg price >= base * (100+pct)/100 (inclusive)" }
      - { name: fuel_escalation_share_pct, type: integer, source: input, default: 80, description: "Percent of tier-1 excess fuel cost billed to district; tier-2 excess bills at min(100, share*1.5)" }
      - { name: penalty_mode, type: enum, source: input, description: "FLAT_PER_ROUTE | PER_STUDENT_MINUTE — selects shortage credit variant" }
      - { name: shortage_penalty_flat_cents, type: integer, source: input, description: "Credit per uncovered route-day when penalty_mode=FLAT_PER_ROUTE" }
      - { name: shortage_penalty_per_student_minute_cents, type: integer, source: input, description: "Credit per student-minute when penalty_mode=PER_STUDENT_MINUTE" }
      - { name: assumed_minutes_per_missed_route, type: integer, source: input, description: "Assumed minutes lost per student on an uncovered route (PER_STUDENT_MINUTE mode)" }
      - { name: monthly_cap_cents, type: integer, source: input, description: "Invoice total cap; fuel adjustment is truncated so total never exceeds this" }
      - { name: charter_hourly_rate_cents, type: integer, source: input, description: "Charter hourly rate in cents" }
      - { name: charter_per_mile_cents, type: integer, source: input, description: "Charter per-mile rate in cents" }
      - { name: start_date, type: string, source: input, description: "Contract term start YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Contract term end YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "DRAFT_BID | SUBMITTED | AWARDED | ACTIVE | EXPIRED | TERMINATED | WITHDRAWN | LOST" }
      - { name: amendment_seq, type: integer, source: system, default: 0, description: "Number of applied amendments" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; owning contract" }
      - { name: route_code, type: string, source: input, description: "Unique route code within contract" }
      - { name: school_site, type: string, source: input, description: "School served" }
      - { name: am_start_minute, type: integer, source: input, description: "Planned AM run start, minutes since midnight 0-1439" }
      - { name: am_end_minute, type: integer, source: input, description: "Planned AM run end, minutes since midnight, > am_start_minute" }
      - { name: student_count, type: integer, source: input, description: "Riders assigned to route" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | ARCHIVED", default: ACTIVE }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: primary_district_id, type: string, source: input, description: "FK -> District.id; district the driver is credentialed for" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: license_number, type: string, source: input, description: "State driver license number" }
      - { name: license_class, type: enum, source: input, description: "A | B — school bus dispatch requires B" }
      - { name: hourly_wage_cents, type: integer, source: input, description: "Base hourly wage in cents" }
      - { name: hired_on, type: string, source: system, description: "Date driver reached ACTIVE (YYYY-MM-DD), null until then" }
      - { name: status, type: enum, source: system, description: "APPLICANT | SCREENING | TRAINING | TESTING | CERTIFIED | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: suspension_reason, type: enum, source: system, description: "null | DISCIPLINE | CREDENTIAL_LAPSED" }
      - { name: behind_wheel_minutes, type: integer, source: computed, default: 0, description: "Sum of TrainingEvent.minutes with category=BEHIND_WHEEL for this driver" }
      - { name: classroom_minutes, type: integer, source: computed, default: 0, description: "Sum of TrainingEvent.minutes with category=CLASSROOM for this driver" }
      - { name: test_fail_count, type: integer, source: system, default: 0, description: "Number of TEST_FAIL events" }
      - { name: weekly_assigned_minutes, type: integer, source: computed, default: 0, description: "Sum of planned minutes of CONFIRMED/EN_ROUTE/COMPLETED assignments in the current ISO week (Mon-Sun)" }

  - name: TrainingEvent
    parent: null
    common_fields: false
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; trained driver" }
      - { name: category, type: enum, source: input, description: "CLASSROOM | BEHIND_WHEEL | SAFETY" }
      - { name: minutes, type: integer, source: input, description: "Training duration in minutes, > 0" }
      - { name: occurred_on, type: string, source: input, description: "Training date YYYY-MM-DD" }

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; credential holder" }
      - { name: kind, type: enum, source: input, description: "CDL_B | S_ENDORSEMENT | FIRST_AID" }
      - { name: issued_on, type: string, source: input, description: "Issue date YYYY-MM-DD" }
      - { name: expires_on, type: string, source: input, description: "Expiry date YYYY-MM-DD; valid through this date (expires the day after)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", default: ACTIVE }

  - name: Bus
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; home district of the bus" }
      - { name: fleet_number, type: string, source: input, description: "Unique fleet number within district" }
      - { name: capacity, type: integer, source: input, description: "Passenger seat capacity" }
      - { name: fuel_type, type: enum, source: input, description: "DIESEL | GASOLINE | ELECTRIC" }
      - { name: mpg_x10, type: integer, source: input, description: "Fuel economy times 10 (e.g. 80 = 8.0 mpg); ELECTRIC buses still carry a diesel-equivalent value for escalation accounting" }
      - { name: odometer_miles, type: integer, source: system, default: 0, description: "Odometer; advanced by completed assignment/charter actual_miles" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | IN_SHOP | GROUNDED | DECOMMISSIONED", default: IN_SERVICE }
      - { name: next_inspection_due, type: string, source: input, description: "Next state inspection due date YYYY-MM-DD; dispatch requires service_date <= this date" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: bus_id, type: string, source: input, description: "FK -> Bus.id; inspected bus" }
      - { name: scheduled_date, type: string, source: input, description: "Scheduled inspection date YYYY-MM-DD" }
      - { name: inspector_ref, type: string, source: input, description: "State inspector reference" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | OVERDUE | CANCELLED", default: SCHEDULED }
      - { name: result, type: enum, source: system, description: "null | PASS | FAIL" }
      - { name: completed_on, type: string, source: system, description: "Date result recorded, null until recorded" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: bus_id, type: string, source: input, description: "FK -> Bus.id; bus under maintenance" }
      - { name: category, type: enum, source: input, description: "PM | REPAIR | INSPECTION_FOLLOWUP" }
      - { name: description, type: string, source: input, description: "Work description" }
      - { name: status, type: enum, source: system, description: "OPEN | DIAGNOSING | WAITING_PARTS | IN_REPAIR | COMPLETED | CANCELLED", default: OPEN }
      - { name: labor_minutes, type: integer, source: input, description: "Required on COMPLETE; total labor minutes" }
      - { name: parts_cost_cents, type: integer, source: input, description: "Required on COMPLETE; parts cost in cents" }

  - name: ServiceDay
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract being served" }
      - { name: service_date, type: string, source: input, description: "Service date YYYY-MM-DD; unique per contract" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DISPATCH_OPEN | LOCKED | RECONCILED | INVOICED | CANCELLED", default: SCHEDULED }
      - { name: required_routes, type: integer, source: computed, description: "Count of routes with status=ACTIVE on the contract at service-day creation" }
      - { name: covered_routes, type: integer, source: computed, description: "Assignments on this day with driver_id set and status IN {CONFIRMED, EN_ROUTE, COMPLETED}" }
      - { name: uncovered_routes, type: integer, source: computed, description: "required_routes - covered_routes" }
      - { name: shortage_flag, type: boolean, source: computed, default: false, description: "true when uncovered_routes > 0" }
      - { name: shortage_credit_cents, type: integer, source: computed, default: 0, description: "Credit owed to district, computed at reconcile per contract.penalty_mode" }
      - { name: cancellation_reason, type: enum, source: system, description: "null | WEATHER | DISTRICT_CLOSURE" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: service_day_id, type: string, source: system, description: "FK -> ServiceDay.id; owning service day (assignments are auto-created with the service day)" }
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; route being run" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; null until CONFIRMED (or set by doubling decision)" }
      - { name: bus_id, type: string, source: system, description: "FK -> Bus.id; null until CONFIRMED (or set by doubling decision)" }
      - { name: status, type: enum, source: system, description: "PLANNED | CONFIRMED | EN_ROUTE | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: cancellation_reason, type: enum, source: system, description: "null | BUS_GROUNDED | DRIVER_SUSPENDED | CONTRACT_TERMINATED | WEATHER | OPS_CANCEL" }
      - { name: is_doubled, type: boolean, source: system, default: false, description: "true when this assignment is covered by a doubling decision" }
      - { name: doubled_after_assignment_id, type: string, source: system, description: "FK -> Assignment.id; null unless is_doubled — the assignment whose driver/bus runs this route immediately after their own" }
      - { name: planned_start_minute, type: integer, source: computed, description: "Planned start minute; route.am_start_minute normally, absorbing end when doubled" }
      - { name: planned_end_minute, type: integer, source: computed, description: "Planned end minute; route.am_end_minute normally, shifted by route duration when doubled" }
      - { name: actual_start_minute, type: integer, source: input, description: "Recorded at COMPLETE" }
      - { name: actual_end_minute, type: integer, source: input, description: "Recorded at COMPLETE" }
      - { name: actual_miles, type: integer, source: input, description: "Recorded at COMPLETE; feeds fuel gallons" }
      - { name: billable, type: boolean, source: computed, default: false, description: "Set at reconcile: true iff status=COMPLETED" }

  - name: CharterTrip
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract the charter bills under" }
      - { name: purpose, type: string, source: input, description: "Trip purpose (field trip, athletics, ...)" }
      - { name: trip_date, type: string, source: input, description: "Trip date YYYY-MM-DD; must be >= logical clock date at creation" }
      - { name: pickup_minute, type: integer, source: input, description: "Pickup time, minutes since midnight" }
      - { name: return_minute, type: integer, source: input, description: "Return time, minutes since midnight, > pickup_minute" }
      - { name: estimated_hours_x10, type: integer, source: input, description: "Estimated duration hours * 10 (e.g. 55 = 5.5h)" }
      - { name: estimated_miles, type: integer, source: input, description: "Estimated miles" }
      - { name: passenger_count, type: integer, source: input, description: "Expected passengers" }
      - { name: assigned_bus_id, type: string, source: system, description: "FK -> Bus.id; set at schedule" }
      - { name: assigned_driver_id, type: string, source: system, description: "FK -> Driver.id; optional at schedule, settable via schedule" }
      - { name: status, type: enum, source: system, description: "REQUESTED | QUOTED | APPROVED | SCHEDULED | IN_PROGRESS | COMPLETED | INVOICED | DECLINED | CANCELLED | EXPIRED" }
      - { name: quote_price_cents, type: integer, source: computed, description: "Provisional price from estimates, set at QUOTED" }
      - { name: quote_valid_until, type: string, source: system, description: "ISO8601; quote expires after this instant (72h from quoting)" }
      - { name: deposit_cents, type: integer, source: system, description: "Deposit recorded at approve" }
      - { name: final_price_cents, type: integer, source: computed, description: "Final price from actuals at COMPLETE" }
      - { name: actual_hours_x10, type: integer, source: input, description: "Recorded at complete" }
      - { name: actual_miles, type: integer, source: input, description: "Recorded at complete" }
      - { name: cancel_fee_cents, type: integer, source: computed, description: "Tiered cancellation fee, set at CANCELLED" }
      - { name: refund_cents, type: integer, source: computed, description: "Deposit refund, set at CANCELLED" }

  - name: FuelPriceEntry
    parent: null
    common_fields: false
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; district whose index this entry prices" }
      - { name: effective_month, type: string, source: input, description: "Month YYYY-MM; unique per district" }
      - { name: avg_price_cents_per_gallon, type: integer, source: input, description: "Monthly average index price in cents per gallon" }
      - { name: source, type: string, source: input, description: "Index source reference (e.g. EIA PADD)" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; billed contract" }
      - { name: period_month, type: string, source: system, description: "Billing period YYYY-MM" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | PAID | WRITTEN_OFF" }
      - { name: bus_lines_cents, type: integer, source: computed, description: "Sum of per-bus-day lines" }
      - { name: charter_lines_cents, type: integer, source: computed, description: "Sum of COMPLETED charter final_price_cents in period" }
      - { name: shortage_credit_cents, type: integer, source: computed, description: "Sum of ServiceDay.shortage_credit_cents for RECONCILED days in period" }
      - { name: fuel_adjustment_cents, type: integer, source: computed, description: "Fuel escalation adjustment (may be truncated by monthly cap)" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "PROVISIONAL variant: bills LOCKED days at planned required_routes in addition to RECONCILED actuals" }
      - { name: final_total_cents, type: integer, source: computed, description: "FINAL variant: RECONCILED actuals only; null until issued" }
      - { name: total_cents, type: integer, source: computed, description: "Authoritative total: provisional while DRAFT, final once ISSUED" }
      - { name: issued_on, type: string, source: system, description: "Date issued YYYY-MM-DD from logical clock" }
      - { name: dispute_count, type: integer, source: system, default: 0, description: "Number of disputes raised" }
      - { name: dispute_reason, type: string, source: system, description: "Latest dispute reason" }
      - { name: paid_on, type: string, source: system, description: "Date paid YYYY-MM-DD from logical clock" }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; district notified" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; optional route context (required when student_discipline_flag=true)" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; optional involved driver" }
      - { name: service_day_id, type: string, source: input, description: "FK -> ServiceDay.id; optional service day context (required when student_discipline_flag=true)" }
      - { name: category, type: enum, source: input, description: "ACCIDENT | BEHAVIOR | MECHANICAL | MEDICAL" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Narrative" }
      - { name: occurred_at, type: string, source: input, description: "ISO8601 when incident occurred; must be <= logical clock" }
      - { name: student_discipline_flag, type: boolean, source: input, default: false, description: "true when incident involves student discipline" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | RETURNED_FOR_INFO | CLOSED" }
      - { name: submitted_at, type: string, source: system, description: "ISO8601 submission timestamp from logical clock" }
      - { name: district_due_by, type: string, source: system, description: "ISO8601 SLA deadline: submitted_at + 24h (CRITICAL) / 72h (HIGH) / 168h (otherwise)" }
      - { name: acknowledged_at, type: string, source: system, description: "ISO8601 acknowledgement timestamp" }
      - { name: sla_breached, type: boolean, source: computed, default: false, description: "true when acknowledged_at > district_due_by (strictly later; exactly at deadline is NOT a breach)" }

  - name: RidershipReport
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; one report per assignment (unique)" }
      - { name: service_day_id, type: string, source: input, description: "FK -> ServiceDay.id; denormalized day for reporting" }
      - { name: boardings, type: integer, source: input, description: "Students boarded" }
      - { name: alightings, type: integer, source: input, description: "Students dropped off" }
      - { name: first_pickup_actual_minute, type: integer, source: input, description: "GPS-derived first pickup minute" }
      - { name: last_dropoff_actual_minute, type: integer, source: input, description: "GPS-derived last dropoff minute" }
      - { name: minutes_late, type: integer, source: computed, description: "max(0, first_pickup_actual_minute - assignment.planned_start_minute - ON_TIME_GRACE_MINUTES)" }
      - { name: on_time, type: boolean, source: computed, description: "minutes_late == 0" }
      - { name: student_minutes_late, type: integer, source: computed, description: "minutes_late * boardings" }

# =============================================================================
# §1.2 State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: DRAFT_BID
    terminal_states: [EXPIRED, TERMINATED, WITHDRAWN, LOST]
    transitions:
      - from: DRAFT_BID
        to: SUBMITTED
        trigger: "POST /busops/contracts/{id}/submit"
        actor: ContractorOps
        preconditions: ["contract in DRAFT_BID"]
        side_effects: ["version incremented"]
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /busops/contracts/{id}/award"
        actor: DistrictAdmin
        preconditions: ["acting district owns contract (district_id == X-User-ID)"]
        side_effects: ["version incremented"]
      - from: SUBMITTED
        to: LOST
        trigger: "POST /busops/contracts/{id}/mark-lost"
        actor: DistrictAdmin
        preconditions: ["acting district owns contract"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /busops/contracts/{id}/withdraw"
        actor: ContractorOps
        preconditions: []
        side_effects: []
      - from: AWARDED
        to: ACTIVE
        trigger: "POST /busops/contracts/{id}/activate"
        actor: ContractorOps
        preconditions: ["logical clock date >= contract.start_date"]
        side_effects: ["version incremented"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /busops/contracts/{id}/terminate"
        actor: DistrictAdmin
        preconditions: ["acting district owns contract"]
        side_effects:
          - "cascade: all Routes of contract with status ACTIVE|SUSPENDED -> ARCHIVED"
          - "cascade: ServiceDays of contract with status SCHEDULED|DISPATCH_OPEN|LOCKED -> CANCELLED (cancellation_reason=CONTRACT_TERMINATED)"
          - "cascade: Assignments on those days with status PLANNED|CONFIRMED -> CANCELLED (cancellation_reason=CONTRACT_TERMINATED)"
          - "cascade: CharterTrips of contract with status REQUESTED|QUOTED|APPROVED|SCHEDULED -> CANCELLED (cancel_fee_cents=0, refund_cents=deposit_cents)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /busops/_clock/set_current_utc advances clock past contract.end_date)"
        actor: system
        preconditions: ["clock date > contract.end_date"]
        side_effects: []

  - entity: Route
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /busops/routes/{id}/deactivate (archive omitted/false)"
        actor: ContractorOps
        preconditions: []
        side_effects: ["SUSPENDED routes are excluded from required_routes when new service days are created"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /busops/routes/{id}/reactivate"
        actor: ContractorOps
        preconditions: ["contract status=ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: ARCHIVED
        trigger: "POST /busops/routes/{id}/deactivate (archive=true)"
        actor: ContractorOps
        preconditions: ["no Assignment with route_id=this route and status IN {PLANNED, CONFIRMED, EN_ROUTE} on service days with service_date >= clock date"]
        side_effects: []
      - from: ACTIVE
        to: ARCHIVED
        trigger: "system (contract terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Driver
    initial_state: APPLICANT
    terminal_states: [TERMINATED]
    transitions:
      - from: APPLICANT
        to: SCREENING
        trigger: "POST /busops/drivers/{id}/events (SCREEN)"
        actor: HRRecruiter
        preconditions: []
        side_effects: []
      - from: SCREENING
        to: TRAINING
        trigger: "POST /busops/drivers/{id}/events (ENROLL)"
        actor: HRRecruiter
        preconditions: []
        side_effects: []
      - from: TRAINING
        to: TESTING
        trigger: "POST /busops/drivers/{id}/events (SCHEDULE_TEST)"
        actor: HRRecruiter
        preconditions:
          - "behind_wheel_minutes >= 2400 (inclusive; exactly 2400 qualifies)"
          - "classroom_minutes >= 1200 (inclusive)"
        side_effects: []
      - from: TESTING
        to: TRAINING
        trigger: "POST /busops/drivers/{id}/events (TEST_FAIL)"
        actor: HRRecruiter
        preconditions: []
        side_effects: ["test_fail_count incremented (retest loop — cyclic)"]
      - from: TESTING
        to: CERTIFIED
        trigger: "POST /busops/drivers/{id}/events (TEST_PASS)"
        actor: HRRecruiter
        preconditions: ["driver holds a Credential kind=CDL_B with status=ACTIVE"]
        side_effects: []
      - from: CERTIFIED
        to: ACTIVE
        trigger: "POST /busops/drivers/{id}/events (ACTIVATE)"
        actor: HRRecruiter
        preconditions: ["driver holds a Credential kind=S_ENDORSEMENT with status=ACTIVE"]
        side_effects: ["hired_on set to logical clock date"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /busops/drivers/{id}/discipline (SUSPEND)"
        actor: ContractorOps
        preconditions: []
        side_effects:
          - "suspension_reason=DISCIPLINE"
          - "cascade: driver's assignments with status CONFIRMED on service days with service_date >= clock date -> CANCELLED (cancellation_reason=DRIVER_SUSPENDED); each affected ServiceDay recomputes covered_routes/uncovered_routes/shortage_flag"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (credential expiry cascade from POST /busops/_clock/set_current_utc)"
        actor: system
        preconditions: ["driver holds Credential kind IN {CDL_B, S_ENDORSEMENT} whose expires_on < clock date"]
        side_effects:
          - "suspension_reason=CREDENTIAL_LAPSED"
          - "cascade: driver's assignments with status CONFIRMED on service days with service_date >= clock date -> CANCELLED (cancellation_reason=DRIVER_SUSPENDED); each affected ServiceDay recomputes shortage fields"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /busops/drivers/{id}/discipline (REINSTATE)"
        actor: ContractorOps
        preconditions:
          - "driver holds Credential kind=CDL_B with status=ACTIVE"
          - "driver holds Credential kind=S_ENDORSEMENT with status=ACTIVE"
        side_effects: ["suspension_reason=null"]
      - from: "APPLICANT|SCREENING|TRAINING|TESTING|CERTIFIED|ACTIVE|SUSPENDED"
        to: TERMINATED
        trigger: "POST /busops/drivers/{id}/events (TERMINATE)"
        actor: HRRecruiter
        preconditions: []
        side_effects:
          - "cascade: driver's assignments with status PLANNED|CONFIRMED on service days with service_date >= clock date -> CANCELLED (cancellation_reason=DRIVER_SUSPENDED); ServiceDay shortage fields recomputed"

  - entity: Credential
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /busops/_clock/set_current_utc; expires_on < new clock date)"
        actor: system
        preconditions: ["expires_on < clock date (valid THROUGH expires_on; expiry starts the next day)"]
        side_effects:
          - "if credential kind IN {CDL_B, S_ENDORSEMENT} and owning Driver status=ACTIVE -> Driver SUSPENDED with suspension_reason=CREDENTIAL_LAPSED (see Driver machine cascade)"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /busops/credentials/{id}/revoke"
        actor: HRRecruiter
        preconditions: []
        side_effects:
          - "if credential kind IN {CDL_B, S_ENDORSEMENT} and owning Driver status=ACTIVE -> Driver SUSPENDED with suspension_reason=CREDENTIAL_LAPSED plus assignment cascade"

  - entity: Bus
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: IN_SHOP
        trigger: "POST /busops/work-orders (creation of any work order on this bus)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: IN_SERVICE
        to: GROUNDED
        trigger: "system (Inspection record-result FAIL, or Inspection OVERDUE cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: assignments with bus_id=this bus and status PLANNED|CONFIRMED on service days with service_date >= clock date -> CANCELLED (cancellation_reason=BUS_GROUNDED); ServiceDay shortage fields recomputed per affected day"
      - from: GROUNDED
        to: IN_SHOP
        trigger: "POST /busops/work-orders (creation of work order with category=INSPECTION_FOLLOWUP or REPAIR on this bus)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: IN_SHOP
        to: IN_SERVICE
        trigger: "POST /busops/work-orders/{id}/events (COMPLETE) — last open work order"
        actor: FleetManager
        preconditions:
          - "no other WorkOrder on this bus with status IN {OPEN, DIAGNOSING, WAITING_PARTS, IN_REPAIR}"
          - "no Inspection on this bus with status FAILED or OVERDUE"
          - "bus.next_inspection_due >= clock date"
        side_effects: []
      - from: GROUNDED
        to: IN_SERVICE
        trigger: "POST /busops/inspections/{id}/record-result (PASS) on this bus"
        actor: FleetManager
        preconditions:
          - "no WorkOrder on this bus with status IN {OPEN, DIAGNOSING, WAITING_PARTS, IN_REPAIR}"
        side_effects: ["bus.next_inspection_due updated from record-result input next_inspection_due"]
      - from: "IN_SERVICE|IN_SHOP|GROUNDED"
        to: DECOMMISSIONED
        trigger: "POST /busops/buses/{id}/events (DECOMMISSION)"
        actor: FleetManager
        preconditions: ["no Assignment with bus_id=this bus and status IN {PLANNED, CONFIRMED, EN_ROUTE} on service days with service_date >= clock date"]
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /busops/inspections/{id}/record-result (result=PASS)"
        actor: FleetManager
        preconditions: ["inspection in SCHEDULED or OVERDUE"]
        side_effects: ["completed_on=clock date", "bus.next_inspection_due = input next_inspection_due", "bus GROUNDED|IN_SHOP -> IN_SERVICE when no open work orders"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /busops/inspections/{id}/record-result (result=FAIL)"
        actor: FleetManager
        preconditions: ["inspection in SCHEDULED or OVERDUE"]
        side_effects: ["completed_on=clock date", "bus -> GROUNDED", "cascade: future PLANNED|CONFIRMED assignments on bus -> CANCELLED (BUS_GROUNDED); ServiceDay shortage recomputed"]
      - from: OVERDUE
        to: PASSED
        trigger: "POST /busops/inspections/{id}/record-result (result=PASS)"
        actor: FleetManager
        preconditions: []
        side_effects: ["as PASS from SCHEDULED"]
      - from: OVERDUE
        to: FAILED
        trigger: "POST /busops/inspections/{id}/record-result (result=FAIL)"
        actor: FleetManager
        preconditions: []
        side_effects: ["as FAIL from SCHEDULED"]
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (POST /busops/_clock/set_current_utc; scheduled_date < new clock date and no result recorded)"
        actor: system
        preconditions: ["scheduled_date < clock date"]
        side_effects: ["bus -> GROUNDED", "cascade: future PLANNED|CONFIRMED assignments on bus -> CANCELLED (BUS_GROUNDED); ServiceDay shortage recomputed"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /busops/inspections/{id}/reschedule (re-inspection loop — cyclic)"
        actor: FleetManager
        preconditions: ["input scheduled_date >= clock date"]
        side_effects: ["result=null", "completed_on=null"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /busops/inspections/{id}/cancel"
        actor: FleetManager
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: DIAGNOSING
        trigger: "POST /busops/work-orders/{id}/events (DIAGNOSE)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: DIAGNOSING
        to: WAITING_PARTS
        trigger: "POST /busops/work-orders/{id}/events (ORDER_PARTS)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: DIAGNOSING
        to: IN_REPAIR
        trigger: "POST /busops/work-orders/{id}/events (START_REPAIR)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: WAITING_PARTS
        to: IN_REPAIR
        trigger: "POST /busops/work-orders/{id}/events (PARTS_RECEIVED)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: IN_REPAIR
        to: WAITING_PARTS
        trigger: "POST /busops/work-orders/{id}/events (ORDER_PARTS) — parts re-order loop (cyclic)"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: IN_REPAIR
        to: COMPLETED
        trigger: "POST /busops/work-orders/{id}/events (COMPLETE)"
        actor: FleetManager
        preconditions: ["labor_minutes and parts_cost_cents provided"]
        side_effects: ["bus IN_SHOP -> IN_SERVICE when this was the last open work order and no FAILED/OVERDUE inspection exists and next_inspection_due >= clock date"]
      - from: "OPEN|DIAGNOSING|WAITING_PARTS|IN_REPAIR"
        to: CANCELLED
        trigger: "POST /busops/work-orders/{id}/events (CANCEL)"
        actor: FleetManager
        preconditions: []
        side_effects: ["bus IN_SHOP -> IN_SERVICE when no other open work orders and no FAILED/OVERDUE inspection and next_inspection_due >= clock date"]

  - entity: ServiceDay
    initial_state: SCHEDULED
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCH_OPEN
        trigger: "POST /busops/service-days/{id}/open-dispatch"
        actor: ContractorOps
        preconditions: ["contract status=ACTIVE"]
        side_effects: []
      - from: DISPATCH_OPEN
        to: LOCKED
        trigger: "POST /busops/service-days/{id}/lock"
        actor: ContractorOps
        preconditions: ["OCC: expected_service_day_version == current version"]
        side_effects: ["version incremented"]
      - from: LOCKED
        to: RECONCILED
        trigger: "POST /busops/service-days/{id}/reconcile"
        actor: ContractorOps
        preconditions: ["no assignment on this day in status EN_ROUTE"]
        side_effects:
          - "each assignment: billable = (status == COMPLETED)"
          - "assignments still CONFIRMED or PLANNED at reconcile are treated as uncovered (billable=false)"
          - "covered_routes recomputed as count of assignments with billable=true (final accounting replaces the live dispatch metric); uncovered_routes = required_routes - covered_routes; shortage_flag = uncovered_routes > 0"
          - "compute shortage_credit_cents per contract.penalty_mode (FLAT_PER_ROUTE vs PER_STUDENT_MINUTE)"
      - from: RECONCILED
        to: INVOICED
        trigger: "system (POST /busops/invoices/{id}/issue covering this day's period)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "SCHEDULED|DISPATCH_OPEN|LOCKED"
        to: CANCELLED
        trigger: "POST /busops/service-days/{id}/cancel (weather / district closure)"
        actor: ContractorOps
        preconditions: []
        side_effects:
          - "cascade: assignments PLANNED|CONFIRMED -> CANCELLED (cancellation_reason=WEATHER)"
          - "cancelled days are excluded from invoice billing (both variants) and from shortage credit"

  - entity: Assignment
    initial_state: PLANNED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /busops/assignments/{id}/confirm"
        actor: ContractorOps
        preconditions:
          - "service day status=DISPATCH_OPEN"
          - "driver status=ACTIVE (ERR_DRIVER_NOT_ACTIVE)"
          - "driver holds ACTIVE CDL_B and S_ENDORSEMENT credentials (ERR_CREDENTIAL_EXPIRED / ERR_ENDORSEMENT_MISSING)"
          - "driver license_class=B (ERR_LICENSE_CLASS_INSUFFICIENT)"
          - "bus status=IN_SERVICE (ERR_BUS_NOT_IN_SERVICE) and bus.next_inspection_due >= service_date (ERR_INSPECTION_OVERDUE)"
          - "bus.capacity >= route.student_count (ERR_CAPACITY_INSUFFICIENT)"
          - "no half-open interval overlap for driver on same service date (adjacency allowed: [start,end) touching is OK)"
          - "no half-open interval overlap for bus on same service date"
          - "projected weekly driver minutes <= 2400 soft cap"
          - "bus.district_id == contract.district_id (ERR_BUS_DISTRICT_MISMATCH)"
        side_effects: ["driver_id/bus_id set", "planned minutes added to driver.weekly_assigned_minutes", "ServiceDay covered/uncovered recomputed"]
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /busops/service-days/{id}/doubling-decisions (assignment is the uncovered target)"
        actor: ContractorOps
        preconditions:
          - "service day status=LOCKED"
          - "absorbing assignment status=CONFIRMED, same service day"
          - "absorbing bus.capacity >= uncovered route.student_count"
          - "absorbing.planned_end_minute <= uncovered route.am_start_minute + 45 (MAX_DOUBLING_DELAY_MINUTES)"
          - "driver projected weekly minutes + uncovered run minutes <= 2700 hard cap (soft cap 2400 may be exceeded only via doubling)"
        side_effects:
          - "uncovered assignment: driver_id/bus_id copied from absorbing, is_doubled=true, doubled_after_assignment_id=absorbing id"
          - "planned_start_minute = absorbing.planned_end_minute; planned_end_minute = planned_start + route duration"
          - "ServiceDay covered/uncovered recomputed"
      - from: CONFIRMED
        to: EN_ROUTE
        trigger: "POST /busops/assignments/{id}/start"
        actor: Driver
        preconditions: ["acting driver is assignment.driver_id (ownership)", "service day status IN {DISPATCH_OPEN, LOCKED}"]
        side_effects: []
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /busops/assignments/{id}/complete"
        actor: Driver
        preconditions: ["acting driver is assignment.driver_id", "actual_end_minute > actual_start_minute"]
        side_effects: ["bus.odometer_miles += actual_miles", "service day covered/uncovered unchanged (COMPLETED remains covered)"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /busops/assignments/{id}/no-show"
        actor: ContractorOps
        preconditions: ["service day status IN {DISPATCH_OPEN, LOCKED}"]
        side_effects: ["ServiceDay covered/uncovered recomputed (route becomes uncovered)"]
      - from: "PLANNED|CONFIRMED"
        to: CANCELLED
        trigger: "POST /busops/assignments/{id}/cancel (OPS_CANCEL) or system cascades (BUS_GROUNDED / DRIVER_SUSPENDED / CONTRACT_TERMINATED / WEATHER)"
        actor: "ContractorOps or system"
        preconditions: []
        side_effects: ["ServiceDay covered/uncovered recomputed"]

  - entity: CharterTrip
    initial_state: REQUESTED
    terminal_states: [INVOICED, DECLINED, CANCELLED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: QUOTED
        trigger: "POST /busops/charter-trips/{id}/quote"
        actor: ContractorOps
        preconditions: ["contract status=ACTIVE"]
        side_effects: ["quote_price_cents computed (provisional variant: estimated_hours_x10/10 * hourly + estimated_miles * per_mile)", "quote_valid_until = clock + 72h", "version incremented"]
      - from: QUOTED
        to: APPROVED
        trigger: "POST /busops/charter-trips/{id}/approve"
        actor: DistrictAdmin
        preconditions:
          - "acting district owns contract's district"
          - "OCC: expected_charter_trip_version == current version (version-pinning on approval)"
          - "quote still live: the clock-set system transition flips QUOTED -> EXPIRED once clock > quote_valid_until, so an approve after the deadline lands on terminal EXPIRED (ERR_ALREADY_TERMINAL); exactly at quote_valid_until the charter is still QUOTED and approve succeeds"
        side_effects: ["deposit_cents recorded", "version incremented"]
      - from: QUOTED
        to: DECLINED
        trigger: "POST /busops/charter-trips/{id}/decline"
        actor: DistrictAdmin
        preconditions: ["acting district owns contract's district"]
        side_effects: []
      - from: QUOTED
        to: EXPIRED
        trigger: "system (POST /busops/_clock/set_current_utc past quote_valid_until)"
        actor: system
        preconditions: ["clock > quote_valid_until (strictly; exactly at deadline stays QUOTED)"]
        side_effects: []
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /busops/charter-trips/{id}/schedule"
        actor: ContractorOps
        preconditions:
          - "contract status=ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "bus status=IN_SERVICE (ERR_BUS_NOT_IN_SERVICE) and next_inspection_due >= trip_date (ERR_INSPECTION_OVERDUE)"
          - "bus.capacity >= passenger_count (ERR_CAPACITY_INSUFFICIENT)"
          - "bus buffered-window free: no other charter SCHEDULED|IN_PROGRESS on same bus+trip_date whose [pickup-30, return+30] closed interval intersects; no CONFIRMED route assignment on same bus+date whose [planned_start, planned_end) intersects the buffered window (ERR_CHARTER_BUS_UNAVAILABLE / ERR_BUS_OVERLAP_CONFLICT)"
          - "if assigned_driver_id given: driver ACTIVE + credentials valid + no overlap with CONFIRMED assignments on trip_date (ERR_DRIVER_OVERLAP_CONFLICT)"
          - "fiscal: district.outstanding_balance_cents + quote_price_cents <= contract district credit_limit_cents (ERR_DISTRICT_CREDIT_HOLD)"
        side_effects: ["assigned_bus_id / assigned_driver_id set"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /busops/charter-trips/{id}/start"
        actor: ContractorOps
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /busops/charter-trips/{id}/complete"
        actor: ContractorOps
        preconditions: ["actual_hours_x10 and actual_miles provided"]
        side_effects: ["final_price_cents computed (FINAL variant: actual_hours_x10/10 * hourly + actual_miles * per_mile + overage 1.25x hourly on hours beyond estimated)", "bus.odometer_miles += actual_miles"]
      - from: COMPLETED
        to: INVOICED
        trigger: "system (POST /busops/invoices/{id}/issue covering trip_date's month)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "REQUESTED|QUOTED|APPROVED|SCHEDULED"
        to: CANCELLED
        trigger: "POST /busops/charter-trips/{id}/cancel"
        actor: "DistrictAdmin or ContractorOps"
        preconditions: []
        side_effects:
          - "cancel_fee_cents by hours before trip pickup: >=72h -> 0; >=24h and <72h -> 25% of quote_price_cents; <24h -> 50% of quote_price_cents (round_half_up)"
          - "refund_cents = deposit_cents - cancel_fee_cents (invariant: fee + refund == deposit)"
          - "REQUESTED/QUOTED cancellations carry fee 0 and refund 0 (no deposit yet)"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /busops/invoices/{id}/issue"
        actor: FinanceClerk
        preconditions: []
        side_effects:
          - "FINAL variant recomputed: only RECONCILED service days billed (LOCKED days dropped); shortage credit from RECONCILED days only"
          - "issued_on = clock date; total_cents = final_total_cents"
          - "cascade: ServiceDays in period with status RECONCILED -> INVOICED; CharterTrips COMPLETED in period -> INVOICED"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /busops/invoices/{id}/dispute"
        actor: DistrictAdmin
        preconditions: ["acting district owns contract's district", "clock date <= issued_on + district.billing_dispute_window_days (inclusive; later is ERR_DISPUTE_WINDOW_CLOSED)"]
        side_effects: ["dispute_count incremented", "dispute_reason recorded"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /busops/invoices/{id}/reissue (dispute-resolution loop — cyclic)"
        actor: FinanceClerk
        preconditions: []
        side_effects: ["total_cents += adjustment_delta_cents (may be negative)", "final_total_cents adjusted identically", "issued_on refreshed to clock date"]
      - from: ISSUED
        to: PAID
        trigger: "POST /busops/invoices/{id}/pay"
        actor: FinanceClerk
        preconditions: []
        side_effects: ["paid_on = clock date", "district.outstanding_balance_cents recomputed"]
      - from: "ISSUED|DISPUTED"
        to: WRITTEN_OFF
        trigger: "POST /busops/invoices/{id}/write-off"
        actor: FinanceClerk
        preconditions: []
        side_effects: ["district.outstanding_balance_cents recomputed"]

  - entity: Incident
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /busops/incidents/{id}/submit"
        actor: "Driver or ContractorOps"
        preconditions: ["if student_discipline_flag=true then route_id and service_day_id must be present (ERR_DISCIPLINE_CONTEXT_REQUIRED)"]
        side_effects: ["submitted_at = clock", "district_due_by = submitted_at + severity SLA (CRITICAL 24h / HIGH 72h / else 168h)"]
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /busops/incidents/{id}/submit (resubmission loop — cyclic)"
        actor: "Driver or ContractorOps"
        preconditions: []
        side_effects: ["submitted_at and district_due_by recomputed from clock"]
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /busops/incidents/{id}/acknowledge"
        actor: DistrictAdmin
        preconditions: ["acting district == incident.district_id"]
        side_effects: ["acknowledged_at = clock", "sla_breached = (acknowledged_at > district_due_by) — strictly greater; exactly at deadline is not a breach"]
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /busops/incidents/{id}/return"
        actor: DistrictAdmin
        preconditions: ["acting district == incident.district_id"]
        side_effects: []
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "POST /busops/incidents/{id}/close"
        actor: "DistrictAdmin or ContractorOps"
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: contract-amend-stale-version
    parent_entity: Contract
    write_endpoint: "POST /busops/contracts/{id}/amendments"
    occ_field: expected_contract_version
    description: |
      Amending a Contract whose version has advanced since the client last
      observed it is rejected. The loser's view of the pricing terms (e.g. a
      just-applied fuel base change) is stale, so the amendment must be
      rebased on the current version before it may apply.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: service-day-lock-stale-version
    parent_entity: ServiceDay
    write_endpoint: "POST /busops/service-days/{id}/lock"
    occ_field: expected_service_day_version
    description: |
      Locking a ServiceDay whose version has advanced since the client last
      observed it is rejected. Dispatch decisions (confirms, cancellations)
      mutate the day; a lock issued against a stale view must not freeze a
      state the caller never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: charter-approve-stale-version
    parent_entity: CharterTrip
    write_endpoint: "POST /busops/charter-trips/{id}/approve"
    occ_field: expected_charter_trip_version
    description: |
      Approving a CharterTrip whose version has advanced since the client
      last observed it is rejected (version-pinning on approval): a re-quote
      bumps the version, so an approval carrying the pre-quote version pins a
      price the district never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_billing_core
    trigger: "invoice generate (PROVISIONAL) and invoice issue (FINAL)"
    algorithm: aggregation
    formula: |
      Input set selection differs per variant (see variants).
      Per service day d in the input set:
        PROVISIONAL day line: for days in {RECONCILED, INVOICED},
          count(assignments a on d with a.billable == true) * daily_rate_per_bus_cents;
          for days in {LOCKED}, required_routes(d) * daily_rate_per_bus_cents
          (billed optimistically at planned coverage).
        FINAL day line: count(assignments a on d with a.billable == true) *
          daily_rate_per_bus_cents; only days in {RECONCILED} enter the set.
      CANCELLED days never enter either set.
      bus_lines_cents = sum of day lines; charter_lines_cents = sum of
      final_price_cents of CharterTrips COMPLETED with trip_date in period
      (FINAL) — provisional also counts COMPLETED charters identically.
    input_set: "ServiceDays of contract with service_date within period_month; CharterTrips of contract COMPLETED with trip_date within period_month"
    constants:
      PROVISIONAL_INCLUDED_DAY_STATUSES: "RECONCILED, INVOICED, LOCKED"
      FINAL_INCLUDED_DAY_STATUSES: "RECONCILED"
    precision: "integer cents; no rounding"
    variants:
      - name: PROVISIONAL
        when: "invoice generated (status DRAFT)"
        difference: "bills LOCKED days at planned required_routes; provisional_total_cents set"
      - name: FINAL
        when: "invoice issued"
        difference: "bills RECONCILED days only at billable=true assignment counts; final_total_cents set; LOCKED days contribute 0"

  - name: shortage_penalty
    trigger: "service day reconcile"
    algorithm: aggregation
    formula: |
      uncovered = uncovered_routes(day) after billable recomputation.
      FLAT_PER_ROUTE: credit = uncovered * shortage_penalty_flat_cents
      PER_STUDENT_MINUTE: credit = sum over uncovered assignments a of
        route(a).student_count * assumed_minutes_per_missed_route *
        shortage_penalty_per_student_minute_cents
    input_set: "Assignments of the service day with billable=false after reconcile (status PLANNED, CONFIRMED, NO_SHOW at reconcile time)"
    constants:
      MAX_DOUBLING_DELAY_MINUTES: 45
    precision: "integer cents; no rounding"
    variants:
      - name: FLAT_PER_ROUTE
        when: "contract.penalty_mode == FLAT_PER_ROUTE"
        difference: "fixed credit per uncovered route regardless of ridership"
      - name: PER_STUDENT_MINUTE
        when: "contract.penalty_mode == PER_STUDENT_MINUTE"
        difference: "credit scales with student_count * assumed minutes; same shortage data yields a different total"

  - name: fuel_escalation_adjustment
    trigger: "invoice generate and issue (recomputed identically from RECONCILED days' COMPLETED assignments and COMPLETED charters)"
    algorithm: tiered_pricing
    formula: |
      B = contract.fuel_base_price_cents; P = FuelPriceEntry.avg_price_cents_per_gallon
        for (contract.district_id, period_month) — entry must exist (ERR_FUEL_ENTRY_MISSING).
      Trigger (integer compare): if P * 100 < B * (100 + fuel_escalation_trigger_pct)
        then adjustment = 0 for all days. (P = B*(100+pct)/100 exactly DOES trigger.)
      Else:
        excess = P - B                       # cents per gallon, > 0
        tier1_excess = min(excess, floor(B * 10 / 100))       # first 10% of base
        tier2_excess = excess - tier1_excess
        tier1_rate = round_half_up(tier1_excess * fuel_escalation_share_pct / 100)
        tier2_rate = round_half_up(tier2_excess * min(100, fuel_escalation_share_pct * 3 / 2) / 100)
        adj_per_gallon_cents = tier1_rate + tier2_rate
      Gallons per service day d (milli-gallons, integer):
        day_gallons_x1000(d) = sum over COMPLETED assignments a on d (and COMPLETED
          charters with trip_date == d.service_date) of floor(actual_miles * 10000 / bus.mpg_x10)
      Day adjustment (rounding order pinned — see invoice_fuel_daily_rounding):
        day_adj_cents(d) = round_half_up(day_gallons_x1000(d) * adj_per_gallon_cents / 1000)
      fuel_adjustment_cents_raw = sum over days d in the variant's input set of day_adj_cents(d)
    input_set: "RECONCILED service days in period (their COMPLETED assignments) plus COMPLETED charters with trip_date in period"
    constants:
      TIER1_WIDTH_PCT_OF_BASE: 10
      TIER2_SHARE_MULTIPLIER: "1.5 (capped at 100%)"
    precision: "adj_per_gallon_cents integer (each tier rounded half-up); day adjustments integer cents round_half_up"
    variants: []

  - name: invoice_fuel_daily_rounding
    trigger: "inside fuel_escalation_adjustment"
    algorithm: aggregation
    formula: |
      Rounding order is PINNED: compute each service day's fuel adjustment and
      round_half_up to integer cents PER DAY, then sum the rounded day amounts.
      The alternative order (sum all gallons, multiply, round once) is FORBIDDEN
      and produces different cents (e.g. 2 days x 33.333 gal x 47c: pinned
      1567+1567=3134 vs forbidden round(3133.33)=3133).
    input_set: "same as fuel_escalation_adjustment"
    constants: {}
    precision: "per-day round_half_up to integer cents, then integer sum"
    variants: []

  - name: invoice_total_with_cap
    trigger: "invoice generate and issue, after bus/charter lines, shortage credit, and fuel adjustment"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is PINNED (the cap makes the fuel adjustment depend on a
      total that itself includes the fuel adjustment — resolve in this order):
        1. bus_lines_cents
        2. charter_lines_cents
        3. shortage_credit_cents (subtracted)
        4. preliminary = bus_lines_cents + charter_lines_cents - shortage_credit_cents
        5. fuel_raw = fuel_adjustment per fuel_escalation_adjustment
        6. if preliminary + fuel_raw > monthly_cap_cents:
             fuel_adjustment_cents = max(0, monthly_cap_cents - preliminary)
           else:
             fuel_adjustment_cents = fuel_raw
        7. total = preliminary + fuel_adjustment_cents
      total is reported as provisional_total_cents (DRAFT) or final_total_cents (ISSUED).
    input_set: "same invoice line sets"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: charter_quote_price
    trigger: "charter quote (PROVISIONAL) and complete (FINAL)"
    algorithm: tiered_pricing
    formula: |
      hourly = contract.charter_hourly_rate_cents; per_mile = contract.charter_per_mile_cents
      PROVISIONAL (quote): quote_price_cents =
        floor(estimated_hours_x10 * hourly / 10) + estimated_miles * per_mile
      FINAL (complete): final_price_cents =
        floor(actual_hours_x10 * hourly / 10) + actual_miles * per_mile
        + overage where overage_hours_x10 = max(0, actual_hours_x10 - estimated_hours_x10)
        and overage = floor(overage_hours_x10 * hourly * 125 / 1000)
      The two variants diverge whenever actuals differ from estimates.
    input_set: "the CharterTrip's own estimate/actual fields and its contract rates"
    constants:
      OVERAGE_MULTIPLIER_X100: 125
    precision: "integer cents; floor on hour-to-cents conversion (hours stored x10)"
    variants:
      - name: PROVISIONAL
        when: "quote"
        difference: "uses estimated hours/miles, no overage"
      - name: FINAL
        when: "complete"
        difference: "uses actual hours/miles plus 1.25x overage on excess hours"

  - name: charter_cancel_fee
    trigger: "charter cancel"
    algorithm: threshold
    formula: |
      hours_before = (trip pickup datetime = trip_date + pickup_minute) - clock_now, in hours (floor)
      hours_before >= 72 -> fee = 0
      24 <= hours_before < 72 -> fee = round_half_up(quote_price_cents * 25 / 100)
      hours_before < 24 -> fee = round_half_up(quote_price_cents * 50 / 100)
      Boundaries: exactly 72h -> 0; exactly 24h -> 25% tier.
      refund_cents = deposit_cents - cancel_fee_cents (never negative; deposit 0 for
      REQUESTED/QUOTED cancellations so fee and refund are both 0 there).
    input_set: "the CharterTrip being cancelled"
    constants:
      FREE_CANCEL_HOURS: 72
      REDUCED_CANCEL_HOURS: 24
    precision: "integer cents round_half_up"
    variants: []

  - name: driver_weekly_minutes
    trigger: "assignment confirm and doubling decision (projected), assignment cancel/no-show (recompute)"
    algorithm: aggregation
    formula: |
      For driver d and the ISO week (Mon-Sun) containing the target service_date:
        projected = sum over d's assignments with status IN {CONFIRMED, EN_ROUTE,
          COMPLETED} whose service day service_date falls in that ISO week of
          (planned_end_minute - planned_start_minute)
        plus the candidate assignment's planned minutes.
      SOFT_CAP_MINUTES = 2400: confirm requires projected <= 2400.
      HARD_CAP_MINUTES = 2700: doubling decisions allow projected > 2400 only up to
        2700 (overtime territory); anything above 2700 -> ERR_DRIVER_HOURS_CAP_EXCEEDED.
      Boundaries: projected == 2400 exactly passes confirm; == 2700 exactly passes doubling.
    input_set: "driver's assignments in the ISO week with status IN {CONFIRMED, EN_ROUTE, COMPLETED}"
    constants:
      SOFT_CAP_MINUTES: 2400
      HARD_CAP_MINUTES: 2700
    precision: "integer minutes"
    variants: []

  - name: training_eligibility
    trigger: "driver SCHEDULE_TEST event"
    algorithm: threshold
    formula: |
      behind_wheel_minutes = sum of TrainingEvent.minutes where driver_id = driver
        and category = BEHIND_WHEEL
      classroom_minutes   = sum over category = CLASSROOM (SAFETY minutes count toward neither)
      Eligible iff behind_wheel_minutes >= 2400 AND classroom_minutes >= 1200
      (both inclusive; 2399 behind-wheel fails).
    input_set: "all TrainingEvents of the driver (any date)"
    constants:
      REQUIRED_BEHIND_WHEEL_MINUTES: 2400
      REQUIRED_CLASSROOM_MINUTES: 1200
    precision: "integer minutes"
    variants: []

  - name: incident_sla
    trigger: "incident submit (deadline set) and acknowledge (breach evaluated)"
    algorithm: threshold
    formula: |
      window_hours = 24 if severity=CRITICAL; 72 if HIGH; 168 otherwise.
      district_due_by = submitted_at + window_hours.
      sla_breached = (acknowledged_at > district_due_by)  # strictly greater;
      acknowledgement exactly at district_due_by is NOT a breach.
    input_set: "the Incident"
    constants:
      CRITICAL_SLA_HOURS: 24
      HIGH_SLA_HOURS: 72
      DEFAULT_SLA_HOURS: 168
    precision: "second precision on ISO8601 timestamps"
    variants: []

  - name: on_time_performance
    trigger: "district report read (GET /busops/service-days/{id}/district-report)"
    algorithm: aggregation
    formula: |
      Consider assignments a of the service day with status=COMPLETED that have a
      RidershipReport. minutes_late(a) = max(0, report.first_pickup_actual_minute
        - a.planned_start_minute - ON_TIME_GRACE_MINUTES)
      on_time(a) = (minutes_late(a) == 0)
      on_time_pct_x100 = floor(10000 * count(on_time) / count(reports)) when
        reports exist, else null.
      Tiers: >= 9500 EXCELLENT; >= 9000 SATISFACTORY; else DEFICIENT (inclusive bounds).
      total_boardings = sum of boardings; total_student_minutes_late =
        sum of minutes_late(a) * boardings(a).
    input_set: "COMPLETED assignments of the service day having a RidershipReport"
    constants:
      ON_TIME_GRACE_MINUTES: 5
      TIER_EXCELLENT_X100: 9500
      TIER_SATISFACTORY_X100: 9000
    precision: "percentage stored x100 as integer (floor)"
    variants: []

  - name: district_outstanding_balance
    trigger: "invoice issue / pay / write-off / reissue, and charter schedule credit check"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents(district) = sum of total_cents over Invoices with
        status == ISSUED whose contract.district_id == district.
      Credit check at charter schedule: outstanding_balance_cents + quote_price_cents
        > credit_limit_cents  ->  ERR_DISTRICT_CREDIT_HOLD
      (equality is allowed: outstanding + quote == credit_limit passes).
    input_set: "Invoices status=ISSUED across all contracts of the district"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Schema/format: request body parses, required fields present, enum values valid, integer ranges valid (ERR_INVALID_REQUEST); endpoint-level conditional presence — confirm requires driver_id and bus_id together (ERR_DRIVER_REQUIRED, 422) — is also evaluated here, before any existence or state lookup"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Acting role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path and body resource references exist (validated left-to-right): path ids first, then body FK ids (contract_id, district_id, driver_id, bus_id, route_id, assignment_id, uncovered/absorbing assignment ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "Entity-backed ownership: DistrictAdmin may act only on resources whose contract/entity district_id == X-User-ID; Driver may act only on assignments where driver_id == X-User-ID or on own driver record"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "district-scoped and driver-scoped endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /busops/contracts/{id}/amendments; POST /busops/service-days/{id}/lock; POST /busops/charter-trips/{id}/approve"
  - priority: 7
    category: state
    check: "Entity is in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "Entity is terminal (TERMINATED/PAID/WRITTEN_OFF/CLOSED/COMPLETED/NO_SHOW/CANCELLED/EXPIRED/DECOMMISSIONED/INVOICED/DECLINED) and no transition leaves a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 9
    category: business_safety
    check: "Driver dispatchable: status=ACTIVE (ERR_DRIVER_NOT_ACTIVE), holds ACTIVE CDL_B (ERR_CREDENTIAL_EXPIRED), holds ACTIVE S_ENDORSEMENT (ERR_ENDORSEMENT_MISSING), license_class=B (ERR_LICENSE_CLASS_INSUFFICIENT)"
    error_id: ERR_DRIVER_NOT_ACTIVE
    http_status: 409
    applies_to: "assignment confirm, doubling decision, charter schedule (driver), driver REINSTATE"
  - priority: 10
    category: business_safety
    check: "Bus dispatchable: status=IN_SERVICE (ERR_BUS_NOT_IN_SERVICE), next_inspection_due >= service/trip date (ERR_INSPECTION_OVERDUE), capacity >= student_count/passenger_count (ERR_CAPACITY_INSUFFICIENT, 422)"
    error_id: ERR_BUS_NOT_IN_SERVICE
    http_status: 409
    applies_to: "assignment confirm, doubling decision, charter schedule"
  - priority: 11
    category: business_temporal
    check: "Temporal rules: half-open driver/bus interval overlap on same service date (ERR_DRIVER_OVERLAP_CONFLICT / ERR_BUS_OVERLAP_CONFLICT); charter buffered closed window +/-30min (ERR_CHARTER_BUS_UNAVAILABLE); trip_date >= clock date (ERR_CHARTER_DATE_PAST, 422); dispute within window (ERR_DISPUTE_WINDOW_CLOSED); service_date within contract term (ERR_OUTSIDE_CONTRACT_TERM, 422); incident occurred_at <= clock (ERR_FUTURE_INCIDENT, 422); inspection reschedule date >= clock date and time ranges end > start (ERR_INVALID_TIME_RANGE, 422)"
    error_id: ERR_DRIVER_OVERLAP_CONFLICT
    http_status: 409
    applies_to: "confirm, doubling, charter create/schedule, invoice dispute, service-day create, incident create, inspection reschedule, route create"
  - priority: 12
    category: business_constraint
    check: "Constraint rules: weekly minutes caps (ERR_DRIVER_HOURS_CAP_EXCEEDED, 422); training hours (ERR_TRAINING_HOURS_INSUFFICIENT, 422); doubling feasibility (ERR_DOUBLING_INFEASIBLE, 422); duplicate route code per contract (ERR_DUPLICATE_ROUTE_CODE); duplicate fuel entry per district+month (ERR_FUEL_ENTRY_DUPLICATE_MONTH); duplicate service day per contract+date (ERR_SERVICE_DAY_DATE_CONFLICT); duplicate ridership report per assignment (ERR_DUPLICATE_RIDERSHIP_REPORT); discipline context required (ERR_DISCIPLINE_CONTEXT_REQUIRED, 422); reconcile blocked while EN_ROUTE assignments exist (ERR_ASSIGNMENTS_IN_FLIGHT, 422)"
    error_id: ERR_DRIVER_HOURS_CAP_EXCEEDED
    http_status: 422
    applies_to: "various business endpoints"
  - priority: 13
    category: business_referential
    check: "Referential consistency: bus.district_id == service-day contract.district_id (ERR_BUS_DISTRICT_MISMATCH); fuel price entry present for (district, period) (ERR_FUEL_ENTRY_MISSING, 422); incident route/service-day belong to incident district (ERR_CROSS_DISTRICT_REFERENCE, 422)"
    error_id: ERR_BUS_DISTRICT_MISMATCH
    http_status: 409
    applies_to: "confirm, doubling, charter schedule, invoice generate, incident create"
  - priority: 14
    category: business_fiscal
    check: "Fiscal rules: district credit hold (ERR_DISTRICT_CREDIT_HOLD, 402); invoice period must contain at least one RECONCILED day else nothing billable exists (ERR_INVOICE_PERIOD_INCOMPLETE, 422); contract ACTIVE for routes/service-days/charters/quotes (ERR_CONTRACT_NOT_ACTIVE)"
    error_id: ERR_DISTRICT_CREDIT_HOLD
    http_status: 402
    applies_to: "charter schedule, invoice generate, route create, service-day create, charter create/quote"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / clock ---
  - method: POST
    path: "/busops/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server startup default is exactly 2026-05-01T00:00:00Z and NEVER falls back to wall-clock. Advancing the clock fires system transitions: Credential ACTIVE->EXPIRED (expires_on < new date) with driver suspension cascade; Inspection SCHEDULED->OVERDUE (scheduled_date < new date) with grounding cascade; CharterTrip QUOTED->EXPIRED (past quote_valid_until); Contract ACTIVE->EXPIRED (past end_date)."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["time-based system transitions and their cascades"]

  # --- District ---
  - method: POST
    path: "/busops/districts"
    description: "Create a district"
    roles: [SystemAdmin]
    code: 201
    input: [name, region_fuel_index_code, credit_limit_cents, "billing_dispute_window_days?"]
    output: District
    side_effects: ["status=ACTIVE, outstanding_balance_cents=0"]
  - method: GET
    path: "/busops/districts"
    description: "List districts (paginated)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, HRRecruiter, FleetManager, FinanceClerk, Driver]
    code: 200
    input: ["limit?", "offset?"]
    output: District[]
    side_effects: []
  - method: GET
    path: "/busops/districts/{id}"
    description: "Get a district (includes computed outstanding_balance_cents)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, HRRecruiter, FleetManager, FinanceClerk, Driver]
    code: 200
    input: []
    output: District
    side_effects: []

  # --- Contract ---
  - method: POST
    path: "/busops/contracts"
    description: "Create a bid contract in DRAFT_BID"
    roles: [ContractorOps]
    code: 201
    input: [district_id, bid_reference, daily_rate_per_bus_cents, school_days_per_year, fuel_base_price_cents, penalty_mode, shortage_penalty_flat_cents, shortage_penalty_per_student_minute_cents, assumed_minutes_per_missed_route, monthly_cap_cents, charter_hourly_rate_cents, charter_per_mile_cents, start_date, end_date, "fuel_escalation_trigger_pct?", "fuel_escalation_share_pct?"]
    output: Contract
    side_effects: ["status=DRAFT_BID, amendment_seq=0"]
  - method: GET
    path: "/busops/contracts"
    description: "List contracts (paginated, filterable by district)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: GET
    path: "/busops/contracts/{id}"
    description: "Get a contract"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/busops/contracts/{id}/submit"
    description: "DRAFT_BID -> SUBMITTED"
    roles: [ContractorOps]
    code: 200
    input: []
    output: Contract
    side_effects: ["version incremented"]
  - method: POST
    path: "/busops/contracts/{id}/award"
    description: "SUBMITTED -> AWARDED"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["version incremented"]
  - method: POST
    path: "/busops/contracts/{id}/mark-lost"
    description: "SUBMITTED -> LOST"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/busops/contracts/{id}/withdraw"
    description: "SUBMITTED -> WITHDRAWN"
    roles: [ContractorOps]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/busops/contracts/{id}/activate"
    description: "AWARDED -> ACTIVE; requires clock date >= start_date"
    roles: [ContractorOps]
    code: 200
    input: []
    output: Contract
    side_effects: ["version incremented"]
  - method: POST
    path: "/busops/contracts/{id}/terminate"
    description: "ACTIVE -> TERMINATED with full cascade (routes archived, future days/assignments cancelled, open charters cancelled fee-free)"
    roles: [DistrictAdmin]
    code: 200
    input: ["reason?"]
    output: Contract
    side_effects: ["Route -> ARCHIVED", "ServiceDay SCHEDULED|DISPATCH_OPEN|LOCKED -> CANCELLED", "Assignment PLANNED|CONFIRMED -> CANCELLED", "CharterTrip REQUESTED|QUOTED|APPROVED|SCHEDULED -> CANCELLED (fee 0, full deposit refund)"]
  - method: POST
    path: "/busops/contracts/{id}/amendments"
    description: "Apply a pricing amendment (OCC-guarded). Allowed in AWARDED or ACTIVE."
    roles: [DistrictAdmin]
    code: 200
    input: [expected_contract_version, "daily_rate_per_bus_cents?", "fuel_base_price_cents?", "fuel_escalation_trigger_pct?", "fuel_escalation_share_pct?", "monthly_cap_cents?", "shortage_penalty_flat_cents?", "shortage_penalty_per_student_minute_cents?"]
    output: Contract
    side_effects: ["increments Contract.version by 1", "amendment_seq incremented"]

  # --- Route ---
  - method: POST
    path: "/busops/routes"
    description: "Create a route (contract must be ACTIVE)"
    roles: [ContractorOps]
    code: 201
    input: [contract_id, route_code, school_site, am_start_minute, am_end_minute, student_count]
    output: Route
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/busops/routes"
    description: "List routes (paginated, filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: GET
    path: "/busops/routes/{id}"
    description: "Get a route"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: POST
    path: "/busops/routes/{id}/deactivate"
    description: "ACTIVE -> SUSPENDED (reversible) or SUSPENDED -> ARCHIVED when archive=true"
    roles: [ContractorOps]
    code: 200
    input: ["archive?"]
    output: Route
    side_effects: []
  - method: POST
    path: "/busops/routes/{id}/reactivate"
    description: "SUSPENDED -> ACTIVE"
    roles: [ContractorOps]
    code: 200
    input: []
    output: Route
    side_effects: []

  # --- Driver ---
  - method: POST
    path: "/busops/drivers"
    description: "Create a driver applicant (APPLICANT)"
    roles: [HRRecruiter]
    code: 201
    input: [primary_district_id, full_name, license_number, license_class, hourly_wage_cents]
    output: Driver
    side_effects: ["status=APPLICANT, computed counters 0"]
  - method: GET
    path: "/busops/drivers"
    description: "List drivers (paginated, filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, HRRecruiter, FleetManager, FinanceClerk]
    code: 200
    input: ["primary_district_id?", "status?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []
  - method: GET
    path: "/busops/drivers/{id}"
    description: "Get a driver (Driver role may read only own record)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, HRRecruiter, FinanceClerk, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: POST
    path: "/busops/drivers/{id}/events"
    description: "Pipeline events: SCREEN, ENROLL, SCHEDULE_TEST, TEST_PASS, TEST_FAIL, ACTIVATE, TERMINATE"
    roles: [HRRecruiter]
    code: 200
    input: [event_type, "reason?"]
    output: Driver
    side_effects: ["pipeline transitions per Driver state machine; TERMINATE cascades assignment cancellations"]
  - method: POST
    path: "/busops/drivers/{id}/discipline"
    description: "SUSPEND / REINSTATE an ACTIVE or SUSPENDED driver"
    roles: [ContractorOps]
    code: 200
    input: [action, "reason?"]
    output: Driver
    side_effects: ["SUSPEND cascades future CONFIRMED assignment cancellations and ServiceDay shortage recompute"]

  # --- TrainingEvent ---
  - method: POST
    path: "/busops/training-events"
    description: "Log a training event (append-only; recomputes driver behind_wheel_minutes / classroom_minutes)"
    roles: [HRRecruiter]
    code: 201
    input: [driver_id, category, minutes, occurred_on]
    output: TrainingEvent
    side_effects: ["driver aggregate minutes recomputed"]
  - method: GET
    path: "/busops/training-events"
    description: "List training events (filterable by driver)"
    roles: [SystemAdmin, ContractorOps, HRRecruiter]
    code: 200
    input: ["driver_id?", "category?", "limit?", "offset?"]
    output: TrainingEvent[]
    side_effects: []
  - method: GET
    path: "/busops/training-events/{id}"
    description: "Get a training event"
    roles: [SystemAdmin, ContractorOps, HRRecruiter]
    code: 200
    input: []
    output: TrainingEvent
    side_effects: []

  # --- Credential ---
  - method: POST
    path: "/busops/credentials"
    description: "Record a state-issued credential (ACTIVE). Driver must be in TRAINING|TESTING|CERTIFIED|ACTIVE|SUSPENDED."
    roles: [HRRecruiter]
    code: 201
    input: [driver_id, kind, issued_on, expires_on]
    output: Credential
    side_effects: []
  - method: GET
    path: "/busops/credentials"
    description: "List credentials (filterable by driver/kind/status)"
    roles: [SystemAdmin, ContractorOps, HRRecruiter]
    code: 200
    input: ["driver_id?", "kind?", "status?", "limit?", "offset?"]
    output: Credential[]
    side_effects: []
  - method: GET
    path: "/busops/credentials/{id}"
    description: "Get a credential"
    roles: [SystemAdmin, ContractorOps, HRRecruiter]
    code: 200
    input: []
    output: Credential
    side_effects: []
  - method: POST
    path: "/busops/credentials/{id}/revoke"
    description: "ACTIVE -> REVOKED; suspends ACTIVE driver holding CDL_B/S_ENDORSEMENT"
    roles: [HRRecruiter]
    code: 200
    input: ["reason?"]
    output: Credential
    side_effects: ["driver suspension cascade when kind is CDL_B or S_ENDORSEMENT"]

  # --- Bus ---
  - method: POST
    path: "/busops/buses"
    description: "Create a bus (IN_SERVICE)"
    roles: [FleetManager]
    code: 201
    input: [district_id, fleet_number, capacity, fuel_type, mpg_x10, next_inspection_due]
    output: Bus
    side_effects: ["status=IN_SERVICE, odometer_miles=0"]
  - method: GET
    path: "/busops/buses"
    description: "List buses (paginated, filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FleetManager]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: Bus[]
    side_effects: []
  - method: GET
    path: "/busops/buses/{id}"
    description: "Get a bus"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FleetManager]
    code: 200
    input: []
    output: Bus
    side_effects: []
  - method: POST
    path: "/busops/buses/{id}/events"
    description: "Bus events: DECOMMISSION"
    roles: [FleetManager]
    code: 200
    input: [action, "reason?"]
    output: Bus
    side_effects: ["DECOMMISSION blocked while future PLANNED|CONFIRMED|EN_ROUTE assignments exist"]

  # --- Inspection ---
  - method: POST
    path: "/busops/inspections"
    description: "Schedule a state inspection. Rejected when the bus has CONFIRMED assignments on scheduled_date (whole-day occupation semantics, ERR_INSPECTION_DAY_CONFLICT)."
    roles: [FleetManager]
    code: 201
    input: [bus_id, scheduled_date, inspector_ref]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/busops/inspections"
    description: "List inspections (filterable)"
    roles: [SystemAdmin, ContractorOps, FleetManager]
    code: 200
    input: ["bus_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/busops/inspections/{id}"
    description: "Get an inspection"
    roles: [SystemAdmin, ContractorOps, FleetManager]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/busops/inspections/{id}/record-result"
    description: "Record PASS/FAIL for SCHEDULED or OVERDUE inspection"
    roles: [FleetManager]
    code: 200
    input: [result, "next_inspection_due?"]
    output: Inspection
    side_effects: ["PASS: bus.next_inspection_due updated, bus GROUNDED|IN_SHOP -> IN_SERVICE if no open work orders; FAIL: bus -> GROUNDED + assignment cancellation cascade"]
  - method: POST
    path: "/busops/inspections/{id}/reschedule"
    description: "FAILED -> SCHEDULED with a new scheduled_date (re-inspection loop)"
    roles: [FleetManager]
    code: 200
    input: [scheduled_date]
    output: Inspection
    side_effects: ["result/completed_on cleared"]
  - method: POST
    path: "/busops/inspections/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [FleetManager]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/busops/work-orders"
    description: "Open a work order; bus IN_SERVICE|GROUNDED -> IN_SHOP"
    roles: [FleetManager]
    code: 201
    input: [bus_id, category, description]
    output: WorkOrder
    side_effects: ["bus -> IN_SHOP"]
  - method: GET
    path: "/busops/work-orders"
    description: "List work orders (filterable)"
    roles: [SystemAdmin, ContractorOps, FleetManager]
    code: 200
    input: ["bus_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: GET
    path: "/busops/work-orders/{id}"
    description: "Get a work order"
    roles: [SystemAdmin, ContractorOps, FleetManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/busops/work-orders/{id}/events"
    description: "Work order events: DIAGNOSE, ORDER_PARTS, START_REPAIR, PARTS_RECEIVED, COMPLETE, CANCEL"
    roles: [FleetManager]
    code: 200
    input: [event_type, "labor_minutes?", "parts_cost_cents?"]
    output: WorkOrder
    side_effects: ["COMPLETE/CANCEL may return bus to IN_SERVICE when it is the last open order and no FAILED/OVERDUE inspection and next_inspection_due >= clock date"]

  # --- ServiceDay ---
  - method: POST
    path: "/busops/service-days"
    description: "Create a service day (contract ACTIVE; service_date within contract term; unique per contract+date). Auto-creates one PLANNED Assignment per ACTIVE route with planned minutes from the route."
    roles: [ContractorOps]
    code: 201
    input: [contract_id, service_date]
    output: ServiceDay
    side_effects: ["status=SCHEDULED", "required_routes computed from ACTIVE routes", "PLANNED assignments auto-created"]
  - method: GET
    path: "/busops/service-days"
    description: "List service days (paginated, filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: ["contract_id?", "status?", "service_date?", "limit?", "offset?"]
    output: ServiceDay[]
    side_effects: []
  - method: GET
    path: "/busops/service-days/{id}"
    description: "Get a service day"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: []
    output: ServiceDay
    side_effects: []
  - method: POST
    path: "/busops/service-days/{id}/open-dispatch"
    description: "SCHEDULED -> DISPATCH_OPEN"
    roles: [ContractorOps]
    code: 200
    input: []
    output: ServiceDay
    side_effects: ["version incremented"]
  - method: POST
    path: "/busops/service-days/{id}/lock"
    description: "DISPATCH_OPEN -> LOCKED (OCC-guarded)"
    roles: [ContractorOps]
    code: 200
    input: [expected_service_day_version]
    output: ServiceDay
    side_effects: ["increments ServiceDay.version by 1"]
  - method: POST
    path: "/busops/service-days/{id}/reconcile"
    description: "LOCKED -> RECONCILED; computes billable flags, uncovered counts, shortage credit"
    roles: [ContractorOps]
    code: 200
    input: []
    output: ServiceDay
    side_effects: ["shortage_credit_cents computed per contract.penalty_mode", "covered_routes/uncovered_routes/shortage_flag finalized"]
  - method: POST
    path: "/busops/service-days/{id}/cancel"
    description: "SCHEDULED|DISPATCH_OPEN|LOCKED -> CANCELLED (weather/district closure); cancels open assignments; excluded from billing"
    roles: [ContractorOps]
    code: 200
    input: [cancellation_reason]
    output: ServiceDay
    side_effects: ["assignments PLANNED|CONFIRMED -> CANCELLED (WEATHER)"]
  - method: POST
    path: "/busops/service-days/{id}/doubling-decisions"
    description: "Route doubling decision: cover an uncovered assignment by appending it to an absorbing CONFIRMED assignment's driver/bus (only while LOCKED)"
    roles: [ContractorOps]
    code: 200
    input: [uncovered_assignment_id, absorbing_assignment_id]
    output: Assignment
    side_effects: ["uncovered assignment CONFIRMED with is_doubled=true, doubled_after_assignment_id set, planned minutes shifted", "driver weekly minutes reprojected (hard cap 2700)", "ServiceDay covered/uncovered recomputed"]
  - method: GET
    path: "/busops/service-days/{id}/district-report"
    description: "Computed district-facing daily report (ridership, on-time %, shortage, incident SLA breaches)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps]
    code: 200
    input: []
    output: { service_day_id: string, required_routes: integer, covered_routes: integer, uncovered_routes: integer, total_boardings: integer, total_student_minutes_late: integer, on_time_pct_x100: integer, on_time_tier: string, sla_breached_incidents: integer, shortage_credit_cents: integer }
    side_effects: []

  # --- Assignment ---
  - method: GET
    path: "/busops/assignments"
    description: "List assignments (paginated, filterable; reverse-reachability for all assignment FKs)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: ["service_day_id?", "route_id?", "driver_id?", "bus_id?", "doubled_after_assignment_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: GET
    path: "/busops/assignments/{id}"
    description: "Get an assignment"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/busops/assignments/{id}/confirm"
    description: "PLANNED -> CONFIRMED with driver_id and bus_id; runs full safety/temporal/constraint validation stack"
    roles: [ContractorOps]
    code: 200
    input: ["driver_id?", "bus_id?"]
    output: Assignment
    side_effects: ["driver weekly_assigned_minutes updated", "ServiceDay covered/uncovered recomputed"]
  - method: POST
    path: "/busops/assignments/{id}/start"
    description: "CONFIRMED -> EN_ROUTE (driver self-service)"
    roles: [Driver]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/busops/assignments/{id}/complete"
    description: "EN_ROUTE -> COMPLETED with actuals (driver self-service)"
    roles: [Driver]
    code: 200
    input: [actual_start_minute, actual_end_minute, actual_miles]
    output: Assignment
    side_effects: ["bus.odometer_miles += actual_miles"]
  - method: POST
    path: "/busops/assignments/{id}/no-show"
    description: "CONFIRMED -> NO_SHOW (route becomes uncovered)"
    roles: [ContractorOps]
    code: 200
    input: ["reason?"]
    output: Assignment
    side_effects: ["ServiceDay covered/uncovered recomputed"]
  - method: POST
    path: "/busops/assignments/{id}/cancel"
    description: "PLANNED|CONFIRMED -> CANCELLED (OPS_CANCEL)"
    roles: [ContractorOps]
    code: 200
    input: ["reason?"]
    output: Assignment
    side_effects: ["ServiceDay covered/uncovered recomputed"]

  # --- CharterTrip ---
  - method: POST
    path: "/busops/charter-trips"
    description: "District requests a field-trip charter (REQUESTED). Contract must be ACTIVE; trip_date >= clock date."
    roles: [DistrictAdmin]
    code: 201
    input: [contract_id, purpose, trip_date, pickup_minute, return_minute, estimated_hours_x10, estimated_miles, passenger_count]
    output: CharterTrip
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/busops/charter-trips"
    description: "List charter trips (paginated, filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: ["contract_id?", "assigned_bus_id?", "assigned_driver_id?", "status?", "limit?", "offset?"]
    output: CharterTrip[]
    side_effects: []
  - method: GET
    path: "/busops/charter-trips/{id}"
    description: "Get a charter trip"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk, Driver]
    code: 200
    input: []
    output: CharterTrip
    side_effects: []
  - method: POST
    path: "/busops/charter-trips/{id}/quote"
    description: "REQUESTED -> QUOTED; computes provisional quote_price_cents and quote_valid_until = clock + 72h"
    roles: [ContractorOps]
    code: 200
    input: []
    output: CharterTrip
    side_effects: ["quote_price_cents computed", "quote_valid_until set", "version incremented"]
  - method: POST
    path: "/busops/charter-trips/{id}/approve"
    description: "QUOTED -> APPROVED (OCC version-pinning on approval); records deposit"
    roles: [DistrictAdmin]
    code: 200
    input: [expected_charter_trip_version, deposit_cents]
    output: CharterTrip
    side_effects: ["increments CharterTrip.version by 1", "deposit_cents recorded"]
  - method: POST
    path: "/busops/charter-trips/{id}/decline"
    description: "QUOTED -> DECLINED"
    roles: [DistrictAdmin]
    code: 200
    input: ["reason?"]
    output: CharterTrip
    side_effects: []
  - method: POST
    path: "/busops/charter-trips/{id}/schedule"
    description: "APPROVED -> SCHEDULED; assigns bus (+ optional driver) with buffered-overlap, compliance, capacity and credit-hold checks"
    roles: [ContractorOps]
    code: 200
    input: [assigned_bus_id, "assigned_driver_id?"]
    output: CharterTrip
    side_effects: ["assigned_bus_id/assigned_driver_id set"]
  - method: POST
    path: "/busops/charter-trips/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS"
    roles: [ContractorOps]
    code: 200
    input: []
    output: CharterTrip
    side_effects: []
  - method: POST
    path: "/busops/charter-trips/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; computes FINAL price with overage"
    roles: [ContractorOps]
    code: 200
    input: [actual_hours_x10, actual_miles]
    output: CharterTrip
    side_effects: ["final_price_cents computed", "bus.odometer_miles += actual_miles"]
  - method: POST
    path: "/busops/charter-trips/{id}/cancel"
    description: "REQUESTED|QUOTED|APPROVED|SCHEDULED -> CANCELLED with tiered fee and deposit refund"
    roles: [DistrictAdmin, ContractorOps]
    code: 200
    input: ["reason?"]
    output: CharterTrip
    side_effects: ["cancel_fee_cents and refund_cents computed; fee+refund == deposit invariant"]

  # --- FuelPriceEntry ---
  - method: POST
    path: "/busops/fuel-price-entries"
    description: "Record the monthly fuel index price for a district (unique per district+month; append-only)"
    roles: [FinanceClerk]
    code: 201
    input: [district_id, effective_month, avg_price_cents_per_gallon, source]
    output: FuelPriceEntry
    side_effects: []
  - method: GET
    path: "/busops/fuel-price-entries"
    description: "List fuel price entries (filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk]
    code: 200
    input: ["district_id?", "effective_month?", "limit?", "offset?"]
    output: FuelPriceEntry[]
    side_effects: []
  - method: GET
    path: "/busops/fuel-price-entries/{id}"
    description: "Get a fuel price entry"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk]
    code: 200
    input: []
    output: FuelPriceEntry
    side_effects: []

  # --- Invoice ---
  - method: POST
    path: "/busops/invoices/generate"
    description: "Generate a DRAFT invoice for contract+period (PROVISIONAL variant); fuel entry must exist"
    roles: [FinanceClerk]
    code: 201
    input: [contract_id, period_month]
    output: Invoice
    side_effects: ["provisional lines computed: bus lines incl. LOCKED days, charter lines, shortage credit, fuel adjustment, cap applied", "total_cents = provisional_total_cents"]
  - method: GET
    path: "/busops/invoices"
    description: "List invoices (paginated, filterable)"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk]
    code: 200
    input: ["contract_id?", "status?", "period_month?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/busops/invoices/{id}"
    description: "Get an invoice"
    roles: [SystemAdmin, DistrictAdmin, ContractorOps, FinanceClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/busops/invoices/{id}/issue"
    description: "DRAFT -> ISSUED; FINAL variant recomputed (RECONCILED days only); cascades RECONCILED days and COMPLETED charters to INVOICED"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["final_total_cents computed; total_cents = final_total_cents", "issued_on = clock date", "ServiceDay RECONCILED -> INVOICED", "CharterTrip COMPLETED -> INVOICED", "district.outstanding_balance_cents recomputed"]
  - method: POST
    path: "/busops/invoices/{id}/dispute"
    description: "ISSUED -> DISPUTED within district dispute window"
    roles: [DistrictAdmin]
    code: 200
    input: [reason]
    output: Invoice
    side_effects: ["dispute_count incremented"]
  - method: POST
    path: "/busops/invoices/{id}/reissue"
    description: "DISPUTED -> ISSUED with an adjustment delta applied to totals"
    roles: [FinanceClerk]
    code: 200
    input: [adjustment_delta_cents, reason]
    output: Invoice
    side_effects: ["total_cents and final_total_cents += adjustment_delta_cents", "issued_on refreshed", "district.outstanding_balance_cents recomputed"]
  - method: POST
    path: "/busops/invoices/{id}/pay"
    description: "ISSUED -> PAID"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["paid_on = clock date", "district.outstanding_balance_cents recomputed"]
  - method: POST
    path: "/busops/invoices/{id}/write-off"
    description: "ISSUED|DISPUTED -> WRITTEN_OFF"
    roles: [FinanceClerk]
    code: 200
    input: ["reason?"]
    output: Invoice
    side_effects: ["district.outstanding_balance_cents recomputed"]

  # --- Incident ---
  - method: POST
