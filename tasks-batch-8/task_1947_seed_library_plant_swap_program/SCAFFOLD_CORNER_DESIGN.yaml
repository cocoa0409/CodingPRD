  - section: endpoints
    instances:
      - name: ep_pagination_defaults_and_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET /api/seed-varieties with 3 varieties and no params returns the fixed envelope: response_type 'array', data length 3, pagination limit=10, offset=0, total_count=3, has_more=false."
        test_recipe:
          setup: ["3 varieties created"]
          setup_api_calls:
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "A", species: "S1", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "B", species: "S2", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "C", species: "S3", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/seed-varieties"
              as: ProgramAdmin
          assert:
            - "envelope.response_type == 'array'"
            - "len(data) == 3 and pagination limit == 10, offset == 0, total_count == 3, has_more == false"

      - name: ep_pagination_limit_bounds
        claim_type: violation_to_error
        grounds: ["response_envelope", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "limit=0 (below min 1) and limit=101 (above max 100) both yield ERR_INVALID_REQUEST; limit=2 paginates with has_more=true."
        test_recipe:
          setup: ["3 varieties"]
          setup_api_calls:
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "A", species: "S1", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "B", species: "S2", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "C", species: "S3", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/seed-varieties?limit=0"
              as: ProgramAdmin
              captures: { err0: "$.data.error_id" }
            - call: "GET /api/seed-varieties?limit=101"
              as: ProgramAdmin
              captures: { err101: "$.data.error_id" }
            - call: "GET /api/seed-varieties?limit=2"
              as: ProgramAdmin
          assert:
            - "err0 == ERR_INVALID_REQUEST"
            - "err101 == ERR_INVALID_REQUEST"
            - "limit=2 page: len(data) == 2, total_count == 3, has_more == true"

