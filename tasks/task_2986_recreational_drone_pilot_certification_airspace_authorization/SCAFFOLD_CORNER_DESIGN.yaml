  - section: calculations
    instances:
      - name: sail_level_composes_ground_risk_air_risk_and_the_bvlos_uplift
        claim_type: correct_result
        grounds:
          - calculations.safety_case_sail_level
          - endpoints.POST_/drone-ops/waivers/{id}/safety-cases
          - entities.SafetyCase.fields.sail_level
        distinguishing_aspect: |
          Three safety cases on three waivers of different types pin all three terms of the
          formula at once: two different (ground_risk_class, air_risk_class) pairs that land on
          the same sail_level 4 - one of them only because the BVLOS parent contributes the +1
          uplift - and a third whose raw sum of 7 is clamped down by SAIL_CEILING to 6. An
          implementation that omits the uplift, mis-indexes the ARC letters or forgets the clamp
          diverges on at least one of the three.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "One COMMERCIAL pilot (UNCERTIFIED is sufficient - waiver creation gates only on suspension) owning one airframe."
            - "Three DRAFT waivers of distinct types: NIGHT, BVLOS and OVER_PEOPLE."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Ines Vogt", email: "ines.vogt@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Sail 1", serial_number: "SN-SAIL-01", takeoff_weight_g: 900, max_altitude_ft: 1200 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { v1: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "NIGHT", requested_ceiling_ft: 500, operation_description: "Night survey of a rail corridor.", expected_pilot_version: "${v1}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wn: $.data.id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { v2: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "BVLOS", requested_ceiling_ft: 500, operation_description: "Linear inspection beyond visual line of sight.", expected_pilot_version: "${v2}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wb: $.data.id }
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { v3: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "OVER_PEOPLE", requested_ceiling_ft: 500, operation_description: "Crowd photography above a stadium concourse.", expected_pilot_version: "${v3}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /drone-ops/waivers/${wn}/safety-cases"
              payload: { mitigation_summary: "Lit airframe, two observers, lit landing zone.", ground_risk_class: 2, air_risk_class: "ARC_C", contingency_procedures: "Return to home on link loss; abort on observer call." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { sail_night: $.data.sail_level, status_night: $.data.review_status }
            - call: "POST /drone-ops/waivers/${wb}/safety-cases"
              payload: { mitigation_summary: "Detect-and-avoid radar plus corridor NOTAM.", ground_risk_class: 2, air_risk_class: "ARC_B", contingency_procedures: "Autoland at pre-surveyed sites; C2 link watchdog." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { sail_bvlos: $.data.sail_level }
            - call: "POST /drone-ops/waivers/${wo}/safety-cases"
              payload: { mitigation_summary: "Parachute recovery and crowd marshalling.", ground_risk_class: 4, air_risk_class: "ARC_D", contingency_procedures: "Immediate ditch to the marshalled exclusion strip." }
              as: Pilot
              as_user_id: "${pid}"
              captures: { sail_people: $.data.sail_level }
          assert:
            - "${sail_night} == 4 == min(6, 2 + arc_index[ARC_C] 2 + 0) - no uplift, because the parent waiver_type is NIGHT"
            - "${sail_bvlos} == 4 == min(6, 2 + arc_index[ARC_B] 1 + 1) - the same total reached only because the BVLOS parent adds the uplift"
            - "${sail_people} == 6 == min(6, 4 + arc_index[ARC_D] 3 + 0) - the raw sum 7 is clamped by SAIL_CEILING, and the row is still within its declared 1..6 range"
            - "${status_night} == \"PENDING\" and cleared_by_user_id is null on all three - creating a safety case computes the level but does not review it"
            - "sail_people > MAX_APPROVABLE_SAIL, so that waiver can never be cleared, while the two SAIL 4 cases can"

