      - name: pagination_bounds_are_enforced_before_any_row_is_read
        claim_type: violation_to_error
        grounds:
          - validations[priority 36]
          - errors.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          All three bound violations map to one code with HTTP 400 - limit 0 below the minimum, limit
          101 above the maximum, offset -1 below zero - while limit 100 and offset 0 are accepted,
          pinning the interval as 1..100 inclusive rather than exclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-07T08:00:00Z."
            - "One hospital partner with two RECEIVED death referrals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7101", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-07T07:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_1: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7102", age_years: 41, ventilated: true, gcs_score: 4, cause_of_death_category: "HEAD_TRAUMA", trigger_event_at: "2026-09-07T07:40:00Z" }
              as: ReferralCoordinator
              captures: { ref_2: $.data.id }
          trigger:
            - call: "GET /opo/death-referrals"
              payload: { limit: 0 }
              as: ReferralCoordinator
              captures: { error_low: $.data.error_id }
            - call: "GET /opo/death-referrals"
              payload: { limit: 101 }
              as: ReferralCoordinator
              captures: { error_high: $.data.error_id }
            - call: "GET /opo/death-referrals"
              payload: { offset: -1 }
              as: ReferralCoordinator
              captures: { error_offset: $.data.error_id }
            - call: "GET /opo/death-referrals"
              payload: { limit: 100, offset: 0 }
              as: ReferralCoordinator
              captures: { first_mrn: "$.data[0].patient_mrn" }
            - call: "GET /opo/death-referrals"
              payload: { limit: 1, offset: 1 }
              as: ReferralCoordinator
              captures: { page_two_mrn: "$.data[0].patient_mrn" }
          assert:
            - "${error_low}, ${error_high} and ${error_offset} are all ERR_INVALID_PAGINATION with HTTP 400"
            - "limit 100 with offset 0 returns HTTP 200 with ${first_mrn} == MRN-7101, total_count 2 and has_more false"
            - "limit 1 with offset 1 returns ${page_two_mrn} == MRN-7102 with total_count 2 and has_more false (created_at ASC ordering)"

