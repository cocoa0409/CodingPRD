scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_provisional_versus_final_amount_divergence
        grounds:
          - calculations.claim_reimbursement
          - entities.RepairClaim.fields.provisional_amount_cents
          - entities.RepairClaim.fields.final_amount_cents
          - state_machines.RepairClaim.SUBMITTED_to_APPROVED
          - calculations.obligation_conservation_invariant
        distinguishing_aspect: |
          One repair, two amounts from the same calculation: the PROVISIONAL variant pinned at
          submission uses the dealer's claimed 1.25 hours, the dealer's uncapped 138.74 rate and
          all 3 reported kits (26099 cents), while the FINAL variant pinned at audit approval caps
          hours at flat_hours 1.10 and kits at 1 (18980 cents); only the FINAL number moves
          RecallCampaign.reimbursement_obligation_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "Campaign 26V-101, MODERATE, defect determination recorded 2026-08-03T09:00:00Z, DEFECT_NOTICE filed the same day (timely), campaign_status FILED."
            - "One NE build record inside the population window; population run materialised exactly one AffectedVehicle in UNREPAIRED."
            - "LaborOperation R101-01 with flat_hours 1.10 effective 2026-08-01..2027-12-31; RemedyPart P-88123 unit_cost 21.90, 100 units procured."
            - "Remedy released 2026-08-03, so remedy_status is REMEDY_RELEASED."
            - "Dealer D-NE-01 in NE with labor_rate_per_hour 138.74 and monthly_repair_capacity 40 holds a 1-unit ALLOCATED parts allocation."
            - "A RepairClaim is SUBMITTED for repair_date 2026-08-03 with claimed_labor_hours 1.25 and parts_used_qty 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-101", defect_type: "SAFETY_DEFECT", defect_description: "Driver airbag inflator may rupture on deployment", risk_severity: "MODERATE" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD", owner_name: "Ann Vega" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /recall-campaigns/${camp_id}/filings"
              payload: { filing_type: "DEFECT_NOTICE", narrative: "Part 573 defect information report for 26V-101" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /recall-campaigns/${camp_id}/labor-operations"
              payload: { labor_op_code: "R101-01", description: "Replace driver airbag inflator", flat_hours: 1.10, rate_type: "WARRANTY", effective_from: "2026-08-01", effective_to: "2027-12-31" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { lop_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/remedy-parts"
              payload: { part_number: "P-88123", unit_cost: 21.90, total_procured_qty: 100 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "GET /recall-campaigns/${camp_id}"
              payload: {}
              as: SafetyEngineer
              as_user_id: "u-eng-2"
              captures: { camp_v: $.data.version }
            - call: "POST /recall-campaigns/${camp_id}/remedy-releases"
              payload: { remedy_description: "Replace inflator with revised propellant module", labor_operation_id: "${lop_id}", expected_campaign_version: "${camp_v}" }
              as: SafetyEngineer
              as_user_id: "u-eng-2"
            - call: "POST /dealers"
              payload: { dealer_code: "D-NE-01", name: "Northeast Motors", region_code: "NE", labor_rate_per_hour: 138.74, monthly_repair_capacity: 40 }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { dlr_id: $.data.id }
            - call: "POST /parts-allocations"
              payload: { remedy_part_id: "${part_id}", dealer_id: "${dlr_id}", requested_qty: 5, expected_part_version: "${part_v}" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { alloc_id: $.data.id }
            - call: "GET /affected-vehicles"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh1_id}" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { av1_id: "$.data[0].id" }
            - call: "POST /repair-claims"
              payload: { affected_vehicle_id: "${av1_id}", dealer_id: "${dlr_id}", labor_operation_id: "${lop_id}", repair_date: "2026-08-03", claimed_labor_hours: 1.25, parts_used_qty: 3 }
              as: DealerServiceManager
              as_user_id: "${dlr_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /repair-claims/${claim_id}/audit"
              payload: { decision: "APPROVE", audit_note: "Flat-rate hours and single-kit policy applied" }
              as: ClaimsAuditor
              as_user_id: "u-aud-1"
          assert:
            - "RepairClaim.${claim_id}.provisional_amount_cents == 26099"
            - "RepairClaim.${claim_id}.final_amount_cents == 18980"
            - "RepairClaim.${claim_id}.provisional_amount_cents - RepairClaim.${claim_id}.final_amount_cents == 7119"
            - "RepairClaim.${claim_id}.status == APPROVED"
            - "RecallCampaign.${camp_id}.reimbursement_obligation_cents == 18980"
            - "AffectedVehicle.${av1_id}.remedy_status == REMEDIED"
            - "AffectedVehicle.${av1_id}.approved_claim_count == 1"
            - "PartsAllocation.${alloc_id}.consumed_qty == 1"
            - "RemedyPart.${part_id}.consumed_qty == 1"

      - name: completion_rate_regulatory_versus_operational_divergence
        grounds:
          - calculations.completion_rate
          - entities.RecallCampaign.fields.completion_rate_pct
          - entities.RecallCampaign.fields.recall_population_count
          - endpoints[GET /recall-campaigns/{id}/completion-metrics]
        distinguishing_aspect: |
          The same four-row population reports 33.33% REGULATORY (numerator REMEDIED only,
          UNREACHABLE kept in the denominator) and 100.00% OPERATIONAL (numerator adds SCHEDULED,
          denominator drops UNREACHABLE); only the REGULATORY number is persisted in
          RecallCampaign.completion_rate_pct.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; campaign 26V-101 FILED with remedy REMEDY_RELEASED."
            - "Four NE build records match the population rule, so four AffectedVehicle rows exist."
            - "Dealer D-NE-01 holds a 4-unit ALLOCATED allocation taken while all four rows were UNREPAIRED."
            - "Row 1 is REMEDIED via an approved claim, row 2 is UNREACHABLE via a BAD_ADDRESS outreach attempt, row 3 is SCHEDULED, row 4 is REMOVED_FROM_POPULATION because its vehicle was scrapped."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
