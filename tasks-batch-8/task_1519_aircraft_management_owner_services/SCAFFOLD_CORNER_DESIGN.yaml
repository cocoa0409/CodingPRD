  - section: validations
    instances:
      - name: trip_approve_nonexistent_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) precedes state (priority 5): approving a well-formed but unknown trip id returns ERR_NOT_FOUND, never ERR_TRIP_INVALID_STATE."
        test_recipe:
          setup: ["one owner exists"]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Aeris Holdings LLC", contact_email: "owner@aeris.example" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /trips/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/approve"
              as: Owner
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
