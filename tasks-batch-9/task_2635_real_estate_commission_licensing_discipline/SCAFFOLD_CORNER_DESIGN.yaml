            - "the second REACTIVATE returns 422 ERR_REINSTATEMENT_FEE_MISMATCH: the exact fee is 15000 == 15000 base + 2500 x 0 excess hours + 263 x 0 late periods, and one cent over is refused"
            - "the third REACTIVATE returns 200 with license_status == ACTIVE, inactive_since == null, license_expires_at == 2028-08-19T00:00:00Z (clock now + 730 days), ce_period_start_on == 2026-08-20 and ce_hours_valid reset to 0"
            - "Brokerage.${bkg_id}.affiliated_licensee_count is back to 2"
      - name: duplicate_transaction_reference_within_one_entry_type_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors.ERR_DUPLICATE_TRANSACTION_REFERENCE
          - entities.TrustLedgerEntry.fields.transaction_reference
        distinguishing_aspect: |
          Uniqueness is on the triple (trust_account_id, entry_type, transaction_reference), not on the
          reference alone: a DEPOSIT and an OBLIGATION_OPENED may legitimately share DEP-01, and the
          same reference may be reused on a different account, but a second DEPOSIT with DEP-01 on the
          same account is refused - and the refusal must not consume the account's version.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with escrow account TA carrying a cleared DEPOSIT of 100000 under reference DEP-01"
          setup_api_calls:
            - call: "POST /commission/licensees"
              payload: { person_type: "BROKER", full_name: "Dana Broker", prelicense_hours: 180 }
              as: LicensingAnalyst
              captures: { br_id: $.data.id }
            - call: "POST /commission/licensees/${br_id}/exam-results"
              payload: { score: 88, taken_on: "2026-07-01" }
              as: LicensingAnalyst
            - call: "POST /commission/brokerages"
              payload: { name: "Harbor Realty Group", designated_broker_id: "${br_id}", trust_account_required: true, record_retention_years: 5 }
              as: LicensingAnalyst
              captures: { bkg_id: $.data.id }
            - call: "POST /commission/brokerages/${bkg_id}/trust-accounts"
              payload: { bank_name: "Seaside Bank", account_type: "ESCROW" }
              as: LicensingAnalyst
              captures: { ta_id: $.data.id, ta_v0: $.data.version }
            - call: "POST /commission/brokerages/${bkg_id}/activation"
              payload: { attestation_note: "escrow account opened" }
              as: LicensingAnalyst
              captures: { bkg_v1: $.data.version }
            - call: "POST /commission/licensees/${br_id}/affiliations"
              payload: { brokerage_id: "${bkg_id}", supervising_broker_id: "${br_id}", expected_brokerage_version: "${bkg_v1}" }
              as: LicensingAnalyst
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 100000, effective_date: "2026-08-01", cleared_date: "2026-08-01", transaction_reference: "DEP-01", expected_trust_account_version: "${ta_v0}" }
              as: Broker
              as_user_id: "${br_id}"
            - call: "GET /commission/trust-accounts/${ta_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ta_v1: $.data.version }
          trigger:
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 250000, effective_date: "2026-08-02", cleared_date: "2026-08-02", transaction_reference: "DEP-01", expected_trust_account_version: "${ta_v1}" }
              as: Broker
              as_user_id: "${br_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /commission/trust-accounts/${ta_id}/ledger-entries"
              payload: { entry_type: "OBLIGATION_OPENED", amount_cents: 250000, effective_date: "2026-08-02", transaction_reference: "DEP-01", expected_trust_account_version: "${ta_v1}" }
              as: Broker
              as_user_id: "${br_id}"
              captures: { obl_id: $.data.id }
          assert:
            - "the duplicate DEPOSIT returns 409 ERR_DUPLICATE_TRANSACTION_REFERENCE"
            - "the refused call changes nothing: TrustAccount.${ta_id}.version is still ${ta_v1}, book_available_cents is still 100000 and GET /commission/trust-accounts/${ta_id}/ledger-entries returns 1 row"
            - "the OBLIGATION_OPENED with the same DEP-01 reference returns 201 as ${obl_id} - the uniqueness key includes entry_type"
            - "after it, book_obligation_cents == 250000, book_available_cents == 100000 and shortage_cents == 150000, and TrustAccount.${ta_id}.version == ${ta_v1} + 1"
      - name: a_normalized_name_already_held_is_rejected_until_the_holder_is_rejected
