  - rule_id: transitive_cascade
    instances:
      - name: critical_structural_scoping_reopens_permit_invalidates_inspection_and_downgrades_posture
        grounds:
          - state_machines.DeckFinding.OPEN_to_UPGRADE_SCOPED
          - state_machines.PermitApplication.APPROVED_to_SUBMITTED
          - state_machines.Inspection.PASSED_to_CORRECTION_REQUIRED
          - calculations.permit_fee
          - calculations.deck_upgrade_cost
          - calculations.project_posture
          - entities.PermitApplication.fields.reopened_by_finding_id
        distinguishing_aspect: |
          Depth-4 chain fired by a DeckFinding scoping: DeckFinding (level 1) -> PermitApplication
          reverts APPROVED to SUBMITTED with a recomputed fee and a new review deadline (level 2) ->
          every PASSED ROOF_DECK/MOUNTING Inspection under that permit is invalidated to
          CORRECTION_REQUIRED with attempt_number incremented (level 3) -> ReroofProject.posture is
          re-derived from the now-SUBMITTED permit and the invalidated inspection, moving FROZEN to
          RESTRICTED (level 4). Every level writes fields no earlier level wrote, and the trigger is
          a roofer scoping action - unlike the other instance in this rule, whose trigger is a
          system-owner consent withdrawal.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Jurisdiction WESTVALE with repermit_required_for_reinstall true, reinspection_required true, inspection_slots_per_day 2, backlog_days 2, permit_review_days 10, expedite_fee_cents 0."
            - "A LEASE project with system_dc_kw 8.4 and upgrade_budget_cents 5000000."
            - "A FULL_REPERMIT application, not expedited, submitted at 2026-08-01T00:00:00Z so fee_cents == 72000 + round_half_up(8.4 * 850) == 79140 and review_deadline_utc == 2026-08-11T00:00:00.000Z."
            - "A ROOF_DECK inspection booked for 2026-08-03 (clock + backlog_days) and PASSED, after which the AHJ APPROVES the permit."
            - "A CRITICAL STRUCTURAL_DEFLECTION finding of 150 sqft over 12 attachments is then recorded, so requires_repermit == true and posture is FROZEN."
            - "The clock is advanced to 2026-08-09T09:00:00Z before the trigger so the re-submission timestamps are distinguishable from the first submission."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/jurisdictions"
              payload: { name: "Westvale AHJ", code: "WESTVALE", repermit_required_for_reinstall: true, reinspection_required: true, inspection_slots_per_day: 2, backlog_days: 2, permit_review_days: 10, expedite_fee_cents: 0 }
              as: ProjectCoordinator
              captures: { juris_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Nguyen Household", party_type: "SOLAR_OWNER", contact_email: "owner@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 9, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/permit-applications"
              payload: { project_id: "${proj_id}", jurisdiction_id: "${juris_id}", scope: "FULL_REPERMIT", expedited: false }
              as: ProjectCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /reroof/permit-applications/${permit_id}/submission"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /reroof/permit-applications/${permit_id}/inspections"
              payload: { inspection_type: "ROOF_DECK", slot_date: "2026-08-03", window_start_utc: "2026-08-03T15:00:00Z", window_end_utc: "2026-08-03T17:00:00Z" }
              as: ProjectCoordinator
              captures: { insp_id: $.data.id }
            - call: "POST /reroof/inspections/${insp_id}/result"
              payload: { result: "PASS", result_note: "Deck nailing pattern acceptable" }
              as: AHJInspector
              as_user_id: "${juris_id}"
            - call: "POST /reroof/permit-applications/${permit_id}/decision"
              payload: { decision: "APPROVE" }
              as: AHJInspector
              as_user_id: "${juris_id}"
            - call: "POST /reroof/projects/${proj_id}/deck-findings"
              payload: { finding_type: "STRUCTURAL_DEFLECTION", severity: "CRITICAL", affected_area_sqft: 150, attachment_count_affected: 12 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f1: $.data.id }
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T09:00:00Z" }
              as: ProjectCoordinator
          trigger:
            - call: "POST /reroof/deck-findings/${f1}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
          assert:
            - "DeckFinding.${f1}.status == UPGRADE_SCOPED"
            - "DeckFinding.${f1}.requires_repermit == true"
            - "DeckFinding.${f1}.upgrade_cost_cents == 368800"
            - "PermitApplication.${permit_id}.status == SUBMITTED"
            - "PermitApplication.${permit_id}.revision_count == 1"
            - "PermitApplication.${permit_id}.reopened_by_finding_id == ${f1}"
            - "PermitApplication.${permit_id}.fee_cents == 88140"
            - "PermitApplication.${permit_id}.submitted_at == 2026-08-09T09:00:00.000Z"
            - "PermitApplication.${permit_id}.review_deadline_utc == 2026-08-19T09:00:00.000Z"
            - "Inspection.${insp_id}.status == CORRECTION_REQUIRED"
            - "Inspection.${insp_id}.attempt_number == 2"
            - "ReroofProject.${proj_id}.posture == RESTRICTED"
            - "ReroofProject.${proj_id}.open_critical_finding_count == 0"
            - "ReroofProject.${proj_id}.scoped_upgrade_cost_cents == 368800"

      - name: system_owner_veto_unwinds_consents_reserved_credit_and_scheduled_windows
        grounds:
          - state_machines.ReroofProject.DEENERGIZED_to_APPROVALS_OPEN
          - state_machines.PartyApproval.APPROVED_to_PENDING
          - state_machines.WorkWindow.SCHEDULED_to_REVOKED
          - entities.ReroofProject.fields.credit_released_cents
          - entities.PartyApproval.fields.veto_flag
        distinguishing_aspect: |
          Depth-3 chain fired by a third-party system owner withdrawing consent mid-outage:
          PartyApproval (level 1) -> ReroofProject withdraws authorization, advances the negotiation
          round and moves reserved credit to released (level 2) -> sibling PartyApproval rows reset to
          PENDING and every SCHEDULED WorkWindow is REVOKED (level 3). It is shallower than the
          re-permitting chain, fired by a consent action rather than a scoping action, and it touches
          the money and the schedule while deliberately leaving ArrayCircuit rows ISOLATED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A LEASE project with baseline_daily_kwh 41.75 and downtime_days_estimated 9, consented by roofer, solar owner and system owner, so phase reached AUTHORIZED."
            - "Its single circuit S1 is de-energized at 2026-08-03T09:00:00Z, so phase is DEENERGIZED and the provisional credit 41.75 * 14 * 1.00 * 9 == 5260.5 rounds to 5261 cents, authorized and reserved."
            - "One SCHEDULED roofing WorkWindow exists for 2026-08-05T13:00:00Z .. 2026-08-05T21:00:00Z."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
