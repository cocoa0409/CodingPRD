              captures: { i3: "$.data.id", i3_v1: "$.data.version", i3_ethics: "$.data.ethics_training_status", i3_roster0: "$.data.roster_status" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i3}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i3_v1}" }
              as: CredentialingOfficer
              captures: { cred3: "$.data.id" }
            - call: "GET /interpreters/${i3}"
              payload: {}
              as: CredentialingOfficer
              captures: { i3_roster1: "$.data.roster_status" }
            - call: "POST /credentials/${cred3}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred3}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /credentials/${cred3}/exam-attempts"
              payload: { exam_type: "ORAL", score: 74, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred3}/advance"
              payload: {}
              as: CredentialingOfficer
              captures: { cred3_status: "$.data.status", cred3_v: "$.data.version" }
          trigger:
            - call: "POST /credentials/${cred3}/advance"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /interpreters/${i3}/ethics-training"
              payload: { completed_on: "2026-08-01", provider: "AOC Court Interpreter Ethics" }
              as: CredentialingOfficer
            - call: "POST /credentials/${cred3}/advance"
              payload: {}
              as: CredentialingOfficer
          assert:
            - "${i3_ethics} == NOT_STARTED and ${i3_roster0} == APPLICANT"
            - "${i3_roster1} == CANDIDATE (the first credential moved the interpreter off APPLICANT)"
            - "${cred3_status} == PENDING_ETHICS"
            - "first trigger returns HTTP 409 with data.error_id == ERR_ETHICS_TRAINING_INCOMPLETE"
            - "after the first trigger GET /credentials/${cred3} still returns status == PENDING_ETHICS and version == ${cred3_v} (the refused call mutated nothing)"
            - "after the first trigger GET /interpreters/${i3} returns roster_status == CANDIDATE and credential_tier == NONE"
            - "second trigger returns ethics_training_status == COMPLETED, ethics_completed_on == 2026-08-01"
            - "third trigger returns HTTP 200 with status == ACTIVE, tier == CERTIFIED"
            - "third trigger returns issued_on == 2026-08-01, expires_on == 2028-07-31 (+730 days), grace_through == 2028-10-29 (+90 more)"
            - "GET /interpreters/${i3} now returns roster_status == ACTIVE, credential_tier == CERTIFIED, credentialed_language_ids == [${lang_spa}]"
            - "GET /languages/${lang_spa} returns active_credentialed_count == 1"

