              payload: { establishment_id: "${est_id}", reporter_contact: "clinic@example.com", infection_type: "MRSA", procedure_date: "2026-04-10T00:00:00Z", symptom_onset_at: "2026-04-18T00:00:00Z" }
              as: PublicUser
              as_user_id: "citizen-5"
              captures: { ir_id: $.data.id }
          trigger:
            - call: "POST /body-art/infection-reports/${ir_id}/notification"
              payload: { action: "MARK_NOT_REQUIRED" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err_waive: $.data.error_id }
            - call: "POST /body-art/infection-reports/${ir_id}/investigation"
              payload: { action: "SCREEN" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/infection-reports/${ir_id}/investigation"
              payload: { action: "RULE_OUT" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/infection-reports/${ir_id}/investigation"
              payload: { action: "REOPEN" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/infection-reports/${ir_id}/investigation"
              payload: { action: "RULE_OUT" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/infection-reports/${ir_id}/investigation"
              payload: { action: "REOPEN" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { rc: $.data.reopen_count }
            - call: "POST /body-art/infection-reports/${ir_id}/investigation"
              payload: { action: "RULE_OUT" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/infection-reports/${ir_id}/investigation"
              payload: { action: "REOPEN" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err_reopen: $.data.error_id }
          assert:
            - "${err_waive} == ERR_NOTIFICATION_NOT_WAIVABLE with HTTP 409"
            - "${rc} == 2"
            - "${err_reopen} == ERR_INFECTION_REOPEN_LIMIT with HTTP 409"
            - "InfectionReport.${ir_id}.investigation_status == RULED_OUT"
            - "InfectionReport.${ir_id}.notification_status == PENDING"
            - "InfectionReport.${ir_id}.reopen_count == 2"

