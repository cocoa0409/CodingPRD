            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /funders"
              payload: { legal_name: "Only Funder Available", capital_limit_cents: 60000000, min_apr_bps: 500, fee_spread_bps: 0, max_single_invoice_cents: 5000000 }
              as: PlatformOps
              captures: { funder_id: "$.data.id" }
            - call: "POST /funders/${funder_id}/commitments"
              payload: { committed_amount_cents: 60000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }
              as: Funder
