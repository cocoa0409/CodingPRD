# =============================================================================
# PRD Benchmark Scaffold — task_1694 Industrial Vacuum & Hydroblasting Services
# =============================================================================

scenario: |
  Industrial Vacuum & Hydroblasting Services (Clean Harbors industrial services): job hazard analysis & pressure/water plan, equipment & operator crew assignment, waste characterization & disposal manifest, confined-space & permit coordination, decontamination & wash-water containment, standby/downtime billing rules, unit rate vs T&M pricing, incident & near-miss reporting

domain_name: industrial-vacuum-hydroblasting
api_prefix: /v1

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - version_pinning_on_approval
  entity_topology: flat          # all resources top-level under /v1, FK links in bodies
  state_machine_shape: parallel  # Job carries execution_status x safety_status; other entities cyclic/branching
  relationship_patterns:
    - one_to_many          # Site -> Job, Job -> JHA/Permit/Manifest/etc.
    - many_to_many         # Assignment junctions Job x {EquipmentUnit, Operator}
    - cross_aggregate      # Manifest -> WasteProfile -> DisposalFacility; DowntimeEvent -> Invoice
  role_model: segregation_of_duties   # profile/JHA approver must differ from submitter
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (15 entities, all common_fields: true)
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer facility name" }
      - { name: credit_status, type: enum, source: input, default: GOOD_STANDING, description: "GOOD_STANDING | CREDIT_HOLD — fiscal gate on job start-work" }
      - { name: active_rate_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; set by schedule activation, null until first activation" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; owning commercial account" }
      - { name: label, type: string, source: input, description: "Schedule label" }
      - { name: vacuum_per_gallon_cents, type: integer, source: input, description: "UNIT_RATE: cents per gallon vacuumed" }
      - { name: hydroblast_per_foot_cents, type: integer, source: input, description: "UNIT_RATE: cents per foot hydroblasted" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, description: "T&M: blended labor hourly rate" }
      - { name: equipment_rate_cents_per_hour, type: integer, source: input, description: "T&M: blended equipment hourly rate" }
      - { name: standby_rate_cents_per_hour, type: integer, source: input, description: "Standby billing hourly rate for billable downtime" }
      - { name: overtime_multiplier, type: number, source: input, default: 1.5, description: "T&M labor OT multiplier beyond 8h per assignment window" }
      - { name: minimum_invoice_cents, type: integer, source: input, description: "UNIT_RATE minimum charge floor (0 disables)" , constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED; ACTIVE rows immutable (amendment = new schedule)" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: job_type, type: enum, source: input, description: "VACUUM | HYDROBLAST | COMBINED" }
      - { name: pricing_mode, type: enum, source: input, description: "UNIT_RATE | TIME_AND_MATERIALS — selects invoice variant" }
      - { name: description, type: string, source: input, description: "Scope narrative" }
      - { name: estimated_gallons, type: integer, source: input, description: "Bid estimate of waste gallons", default: 0 }
      - { name: pinned_rate_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; pinned at creation from Site.active_rate_schedule_id (version-pinning on creation)" }
      - { name: execution_status, type: enum, source: system, description: "QUOTED | SCHEDULED | MOBILIZED | IN_PROGRESS | FIELD_COMPLETE | INVOICED | CLOSED | CANCELLED" }
      - { name: safety_status, type: enum, source: system, description: "CLEAR | STOP_WORK — parallel dimension gating field transitions" }
      - { name: gallons_removed, type: integer, source: input, description: "Measured gallons vacuumed; set by complete-field-work payload" }
      - { name: feet_cleaned, type: integer, source: input, description: "Measured feet hydroblasted; set by complete-field-work payload" }
      - { name: standby_accrued_cents, type: integer, source: computed, default: 0, description: "Sum of billed_amount_cents over DowntimeEvents of this job with status in {CLOSED, BILLED}" }

  - name: JobHazardAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: revision_number, type: integer, source: system, description: "1-based monotone per job (max existing + 1)" }
      - { name: hazards, type: array, source: input, description: "Array of enum: CONFINED_SPACE | HIGH_PRESSURE_WATER | CHEMICAL_EXPOSURE | SLIP_TRIP | ERGONOMIC | OTHER" }
      - { name: confined_space, type: boolean, source: input, description: "True => job requires ACTIVE CONFINED_SPACE permit to start work" }
      - { name: max_operating_pressure_psi, type: integer, source: input, description: "Pressure/water plan: max pump PSI; required at submit for HYDROBLAST/COMBINED jobs" }
      - { name: planned_water_flow_gpm, type: number, source: input, description: "Pressure/water plan: planned flow; required at submit for HYDROBLAST/COMBINED jobs" }
      - { name: water_source, type: enum, source: input, description: "SITE_POTABLE | SITE_NONPOTABLE | TRUCKED_IN; required at submit for HYDROBLAST/COMBINED jobs" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID recorded at submit (segregation of duties)" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID recorded at approve" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: permit_type, type: enum, source: input, description: "CONFINED_SPACE | HOT_WORK | LINE_BREAK" }
      - { name: space_id, type: string, source: input, description: "Physical space identifier; one ACTIVE permit per (job_id, space_id)" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (inclusive); must be > valid_from" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | SUSPENDED | CLOSED | REVOKED | EXPIRED" }

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Fleet code (informational)" }
      - { name: unit_type, type: enum, source: input, description: "VAC_TRUCK | HYDROBLASTER | COMBO" }
      - { name: max_pressure_psi, type: integer, source: input, description: "Max rated pump pressure; gates hydroblast start-work" }
      - { name: tank_capacity_gal, type: integer, source: input, description: "Vacuum tank capacity (informational)" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Operator name" }
      - { name: employee_ref, type: string, source: input, description: "Employee reference (informational)" }
      - { name: hazwoper_expires_on, type: string, source: input, description: "HAZWOPER certification expiry date YYYY-MM-DD; must cover full assignment window" }
      - { name: hydroblast_certified, type: boolean, source: input, description: "Hydroblast qualification flag; required on operator assignments for HYDROBLAST/COMBINED jobs at start-work" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: resource_kind, type: enum, source: input, description: "EQUIPMENT | OPERATOR — selects which FK is required" }
      - { name: equipment_unit_id, type: string, source: input, description: "FK -> EquipmentUnit.id; required iff resource_kind=EQUIPMENT, forbidden otherwise" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; required iff resource_kind=OPERATOR, forbidden otherwise" }
      - { name: window_start, type: datetime, source: input, description: "Assignment window start" }
      - { name: window_end, type: datetime, source: input, description: "Assignment window end; must be > window_start" }
      - { name: window_hours, type: number, source: computed, description: "(window_end - window_start) in hours, 2 decimal places" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | RELEASED | CANCELLED" }

  - name: WasteProfile
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; waste generator site" }
      - { name: facility_id, type: string, source: input, description: "FK -> DisposalFacility.id; contracted disposal facility" }
      - { name: waste_code, type: string, source: input, description: "Waste characterization code" }
      - { name: hazard_class, type: enum, source: input, description: "NON_HAZ | HAZ | SPECIAL" }
      - { name: density_lbs_per_gal, type: number, source: input, description: "Characterized density; used for gallon<->ton conversion" }
      - { name: disposal_rate_per_ton_cents, type: integer, source: input, description: "Contracted disposal price per ton" }
      - { name: variance_basis, type: enum, source: input, description: "VOLUME | WEIGHT — selects manifest variance variant" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID at submit (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | SUSPENDED" }

  - name: DisposalFacility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: epa_id, type: string, source: input, description: "EPA identification number" }
      - { name: total_capacity_tons, type: number, source: input, description: "Total reservation capacity in tons" }
      - { name: reserved_tons, type: number, source: computed, default: 0, description: "Sum of estimated_tons over manifests ISSUED to this facility (2dp)" }
      - { name: posture, type: enum, source: computed, description: "AVAILABLE | FULL — FULL when reserved_tons >= total_capacity_tons" }

  - name: DisposalManifest
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id; generating job" }
      - { name: waste_profile_id, type: string, source: input, description: "FK -> WasteProfile.id; characterization + pricing + facility" }
      - { name: estimated_gallons, type: integer, source: input, description: "Shipped gallons (truck gauge)" }
      - { name: estimated_tons, type: number, source: computed, description: "round(estimated_gallons * density / 2000, 2); computed at issue" }
      - { name: received_tons, type: number, source: input, description: "Facility scale weight; set by receive payload" }
      - { name: variance_pct, type: number, source: computed, description: "Computed at receive per profile.variance_basis (2dp)" }
      - { name: billed_tons, type: number, source: system, description: "Locked billed quantity at reconcile (received_tons or adjusted_tons)" }
      - { name: disposal_charge_cents, type: integer, source: system, description: "round(billed_tons * profile.disposal_rate_per_ton_cents); snapshot at reconcile" }
      - { name: resolution_note, type: string, source: input, description: "Exception resolution narrative (resolve-exception)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | IN_TRANSIT | RECEIVED | EXCEPTION | RECONCILED | VOIDED" }

  - name: ContainmentRecord
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: sequence, type: integer, source: system, description: "1-based monotone per job; 'latest' = max sequence" }
      - { name: water_used_gallons, type: integer, source: input, description: "Wash water used (> 0)" }
      - { name: water_captured_gallons, type: integer, source: input, description: "Wash water captured for containment (>= 0)" }
      - { name: capture_ratio, type: number, source: computed, description: "round(water_captured_gallons / water_used_gallons, 4)" }
      - { name: status, type: enum, source: system, description: "LOGGED | VERIFIED | DEFICIENT" }

  - name: DowntimeEvent
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: cause, type: enum, source: input, description: "CUSTOMER_DELAY | WEATHER | REGULATORY_HOLD | SAFETY_STOP | CONTRACTOR_FAULT" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: ended_at, type: datetime, source: system, description: "Logical clock time at close" }
      - { name: closure_day, type: string, source: system, description: "UTC date (YYYY-MM-DD) of started_at; daily-cap grouping key" }
      - { name: duration_minutes, type: integer, source: computed, description: "(ended_at - started_at) in whole minutes" }
      - { name: grace_minutes_applied, type: integer, source: computed, description: "Grace minutes by cause (see downtime_billing constants)" }
      - { name: billable_minutes, type: integer, source: computed, description: "Per downtime_billing: grace-adjusted, daily-capped" }
      - { name: billed_blocks, type: integer, source: computed, description: "ceil(billable_minutes / 15)" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "round_half_up(billed_blocks * standby_rate_cents_per_hour / 4) using job's pinned schedule" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; set when billed into an invoice, cleared on invoice void" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | BILLED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; set at generation" }
      - { name: invoice_number, type: string, source: system, description: "INV-<job creation sequence>-<regeneration count>" }
      - { name: pricing_mode_snapshot, type: enum, source: system, description: "Job.pricing_mode at generation" }
      - { name: lines, type: array, source: system, description: "Array of line objects { line_id, kind, description, quantity, unit, rate_cents, amount_cents, discountable, voided, origin }" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of amount_cents over non-voided lines" }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount per invoice_volume_discount (tier on pre-discount discountable subtotal)" }
      - { name: environmental_fee_cents, type: integer, source: computed, description: "round_half_up((subtotal_cents - discount_cents) * 0.02)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + environmental_fee_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> Job.id" }
      - { name: severity, type: enum, source: input, description: "NEAR_MISS | MINOR | SERIOUS | MAJOR" }
      - { name: title, type: string, source: input, description: "Short title" }
      - { name: description, type: string, source: input, description: "Narrative" }
      - { name: osha_recordable, type: boolean, source: input, description: "Determination recorded at close" }
      - { name: corrective_action, type: string, source: input, description: "Recorded at close" }
      - { name: status, type: enum, source: system, description: "REPORTED | UNDER_REVIEW | CLOSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Job
    initial_state: "execution_status=QUOTED (dimension 1 of 2)"
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /v1/jobs/{jobId}/schedule"
        actor: ProjectManager
        preconditions:
          - "At least one Assignment for this job with status in {SCHEDULED, CONFIRMED} (ERR_NO_ASSIGNMENTS)"
        side_effects: ["increments Job.version by 1"]
      - from: SCHEDULED
        to: MOBILIZED
        trigger: "POST /v1/jobs/{jobId}/mobilize"
        actor: ProjectManager
        preconditions:
          - "At least one Assignment for this job with status=CONFIRMED (ERR_NO_CONFIRMED_CREW)"
        side_effects: ["increments Job.version by 1"]
      - from: MOBILIZED
        to: IN_PROGRESS
        trigger: "POST /v1/jobs/{jobId}/start-work"
        actor: ProjectManager
        preconditions:
          - "safety_status == CLEAR (ERR_JOB_STOPPED)"
          - "Exists JobHazardAnalysis for this job with status=APPROVED (ERR_JHA_NOT_APPROVED)"
          - "If that approved JHA has confined_space=true: exists Permit for this job with permit_type=CONFINED_SPACE and status=ACTIVE (ERR_PERMIT_NOT_ACTIVE)"
          - "If job_type in {HYDROBLAST, COMBINED}: every Assignment with status in {SCHEDULED, CONFIRMED, RELEASED} and resource_kind=EQUIPMENT whose unit_type in {HYDROBLASTER, COMBO} has max_pressure_psi >= approved JHA max_operating_pressure_psi, and at least one such hydroblast-capable assignment exists (ERR_PRESSURE_RATING_INSUFFICIENT)"
          - "If job_type in {HYDROBLAST, COMBINED}: every Assignment with status in {SCHEDULED, CONFIRMED, RELEASED} and resource_kind=OPERATOR references an Operator with hydroblast_certified=true (ERR_OPERATOR_NOT_CERTIFIED)"
          - "Site.credit_status == GOOD_STANDING (ERR_SITE_CREDIT_HOLD)"
        side_effects: ["increments Job.version by 1"]
      - from: IN_PROGRESS
        to: FIELD_COMPLETE
        trigger: "POST /v1/jobs/{jobId}/complete-field-work"
        actor: ProjectManager
        preconditions:
          - "safety_status == CLEAR (ERR_JOB_STOPPED)"
          - "No DowntimeEvent for this job with status=OPEN (ERR_DOWNTIME_OPEN)"
          - "Latest ContainmentRecord for this job (max sequence) has status=VERIFIED (ERR_CONTAINMENT_DEFICIENT; absent records or DEFICIENT latest both fail)"
        side_effects:
          - "gallons_removed and feet_cleaned stored from payload"
          - "increments Job.version by 1"
      - from: FIELD_COMPLETE
        to: INVOICED
        trigger: "POST /v1/jobs/{jobId}/generate-invoice"
        actor: ProjectManager
        preconditions:
          - "Invoice uniqueness is structural: the only creator is generate-invoice from FIELD_COMPLETE, and job state INVOICED already blocks re-entry (invoice void reverts the job first)"
          - "Every DisposalManifest for this job has status in {RECONCILED, VOIDED} (ERR_MANIFEST_UNRECONCILED)"
          - "Every DowntimeEvent for this job has status in {CLOSED, BILLED} (ERR_DOWNTIME_OPEN)"
        side_effects:
          - "Creates Invoice status=DRAFT with computed lines per job_invoice_amount + invoice_volume_discount"
          - "Every DowntimeEvent CLOSED with billable_minutes > 0 becomes BILLED and invoice_id set to the new invoice"
          - "increments Job.version by 1"
      - from: INVOICED
        to: FIELD_COMPLETE
        trigger: "system (automatic when the job's Invoice transitions to VOID)"
        actor: system
        preconditions: []
        side_effects:
          - "DowntimeEvents with invoice_id == voided invoice revert BILLED -> CLOSED and invoice_id cleared"
          - "increments Job.version by 1"
        note: "Revert edge: invoice void re-opens billing (cyclic)"
      - from: INVOICED
        to: CLOSED
        trigger: "POST /v1/jobs/{jobId}/close"
        actor: ProjectManager
        preconditions:
          - "The job's non-VOID Invoice has status=PAID (ERR_INVOICE_NOT_PAID)"
        side_effects: ["increments Job.version by 1"]
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /v1/jobs/{jobId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No DisposalManifest for this job with status in {IN_TRANSIT, RECEIVED, RECONCILED} (ERR_JOB_HAS_COMMITTED_WASTE)"
        side_effects:
          - "Assignments in {SCHEDULED, CONFIRMED} -> CANCELLED"
          - "Permits in {ISSUED, ACTIVE, SUSPENDED} -> REVOKED"
          - "Manifests in {DRAFT, ISSUED} -> VOIDED; each ISSUED void releases its facility reservation (reserved_tons -= estimated_tons, posture recomputed)"
          - "DowntimeEvents OPEN -> CLOSED with ended_at = cancel clock time and normal billing computation"
          - "increments Job.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/jobs/{jobId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No DisposalManifest for this job with status in {IN_TRANSIT, RECEIVED, RECONCILED} (ERR_JOB_HAS_COMMITTED_WASTE)"
        side_effects:
          - "Assignments in {SCHEDULED, CONFIRMED} -> CANCELLED"
          - "Permits in {ISSUED, ACTIVE, SUSPENDED} -> REVOKED"
          - "Manifests in {DRAFT, ISSUED} -> VOIDED; each ISSUED void releases its facility reservation (reserved_tons -= estimated_tons, posture recomputed)"
          - "DowntimeEvents OPEN -> CLOSED with ended_at = cancel clock time and normal billing computation"
          - "increments Job.version by 1"
      - from: MOBILIZED
        to: CANCELLED
        trigger: "POST /v1/jobs/{jobId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No DisposalManifest for this job with status in {IN_TRANSIT, RECEIVED, RECONCILED} (ERR_JOB_HAS_COMMITTED_WASTE)"
        side_effects:
          - "Assignments in {SCHEDULED, CONFIRMED} -> CANCELLED"
          - "Permits in {ISSUED, ACTIVE, SUSPENDED} -> REVOKED"
          - "Manifests in {DRAFT, ISSUED} -> VOIDED; each ISSUED void releases its facility reservation (reserved_tons -= estimated_tons, posture recomputed)"
          - "DowntimeEvents OPEN -> CLOSED with ended_at = cancel clock time and normal billing computation"
          - "increments Job.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /v1/jobs/{jobId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No DisposalManifest for this job with status in {IN_TRANSIT, RECEIVED, RECONCILED} (ERR_JOB_HAS_COMMITTED_WASTE)"
        side_effects:
          - "Assignments in {SCHEDULED, CONFIRMED} -> CANCELLED"
          - "Permits in {ISSUED, ACTIVE, SUSPENDED} -> REVOKED"
          - "Manifests in {DRAFT, ISSUED} -> VOIDED; each ISSUED void releases its facility reservation (reserved_tons -= estimated_tons, posture recomputed)"
          - "DowntimeEvents OPEN -> CLOSED with ended_at = cancel clock time and normal billing computation"
          - "increments Job.version by 1"
      - from: FIELD_COMPLETE
        to: CANCELLED
        trigger: "POST /v1/jobs/{jobId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No DisposalManifest for this job with status in {IN_TRANSIT, RECEIVED, RECONCILED} (ERR_JOB_HAS_COMMITTED_WASTE)"
        side_effects:
          - "Assignments in {SCHEDULED, CONFIRMED} -> CANCELLED"
          - "Permits in {ISSUED, ACTIVE, SUSPENDED} -> REVOKED"
          - "Manifests in {DRAFT, ISSUED} -> VOIDED; each ISSUED void releases its facility reservation (reserved_tons -= estimated_tons, posture recomputed)"
          - "DowntimeEvents OPEN -> CLOSED with ended_at = cancel clock time and normal billing computation"
          - "increments Job.version by 1"

  - entity: Job
    initial_state: "safety_status=CLEAR (dimension 2 of 2, independent of execution_status)"
    terminal_states: []
    transitions:
      - from: CLEAR
        to: STOP_WORK
        trigger: "POST /v1/jobs/{jobId}/stop-work OR system (automatic on IncidentReport creation with severity in {SERIOUS, MAJOR})"
        actor: SafetyManager
        preconditions:
          - "execution_status in {SCHEDULED, MOBILIZED, IN_PROGRESS, FIELD_COMPLETE} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Every Permit for this job with status=ACTIVE -> SUSPENDED (cascade link: stop-work suspends permits)"
          - "increments Job.version by 1"
      - from: STOP_WORK
        to: CLEAR
        trigger: "POST /v1/jobs/{jobId}/resume-work"
        actor: SafetyManager
        preconditions:
          - "Every IncidentReport for this job has status=CLOSED (ERR_INVALID_STATE)"
          - "Exists JobHazardAnalysis for this job with status=APPROVED (ERR_JHA_NOT_APPROVED)"
        side_effects: ["increments Job.version by 1"]
        note: "Permits stay SUSPENDED after resume; each must be re-ACTIVATED explicitly"

  - entity: JobHazardAnalysis
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/jhas/{jhaId}/submit"
        actor: FieldSupervisor
        preconditions:
          - "If job.job_type in {HYDROBLAST, COMBINED}: max_operating_pressure_psi, planned_water_flow_gpm and water_source are all present (ERR_JHA_PRESSURE_PLAN_REQUIRED)"
        side_effects: ["submitted_by = X-User-ID"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/jhas/{jhaId}/approve"
        actor: SafetyManager
        preconditions:
          - "expected_job_version matches Job.version (ERR_STALE_VERSION, OCC)"
          - "X-User-ID != submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by = X-User-ID"
          - "Any other JobHazardAnalysis of the same job with status=APPROVED -> SUPERSEDED (single approved revision)"
          - "increments Job.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/jhas/{jhaId}/reject"
        actor: SafetyManager
        preconditions:
          - "X-User-ID != submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /v1/jhas/{jhaId}/revise"
        actor: FieldSupervisor
        preconditions: []
        side_effects: ["Pressure/water plan fields may be edited while DRAFT via a new revision only; revise re-opens this revision"]
        note: "Revision cycle DRAFT->SUBMITTED->REJECTED->DRAFT (cyclic)"

  - entity: Permit
    initial_state: ISSUED
    terminal_states: [CLOSED, REVOKED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /v1/permits/{permitId}/activate"
        actor: FieldSupervisor
        preconditions:
          - "Job.safety_status == CLEAR (ERR_JOB_STOPPED)"
          - "If permit_type == CONFINED_SPACE: latest APPROVED JHA of the job has confined_space=true (ERR_PERMIT_JHA_MISMATCH)"
          - "No other Permit of the same job with same space_id in status=ACTIVE (ERR_PERMIT_SPACE_OCCUPIED)"
          - "Logical clock now within [valid_from, valid_until] inclusive (ERR_PERMIT_WINDOW_INVALID)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/permits/{permitId}/activate"
        actor: FieldSupervisor
        preconditions:
          - "Job.safety_status == CLEAR (ERR_JOB_STOPPED)"
          - "If permit_type == CONFINED_SPACE: latest APPROVED JHA of the job has confined_space=true (ERR_PERMIT_JHA_MISMATCH)"
          - "No other Permit of the same job with same space_id in status=ACTIVE (ERR_PERMIT_SPACE_OCCUPIED)"
          - "Logical clock now within [valid_from, valid_until] inclusive (ERR_PERMIT_WINDOW_INVALID)"
        side_effects: []
        note: "SUSPENDED -> ACTIVE resume edge (cyclic with ACTIVE -> SUSPENDED)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/permits/{permitId}/suspend OR system (automatic when Job enters STOP_WORK)"
        actor: SafetyManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /v1/permits/{permitId}/close"
        actor: FieldSupervisor
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /v1/permits/{permitId}/revoke OR system (job cancel cascade)"
        actor: SafetyManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /v1/permits/{permitId}/revoke OR system (job cancel cascade)"
        actor: SafetyManager
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /v1/permits/{permitId}/revoke OR system (job cancel cascade)"
        actor: SafetyManager
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (daily-close sweep: valid_until < logical clock now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (daily-close sweep: valid_until < logical clock now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (daily-close sweep: valid_until < logical clock now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WasteProfile
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/waste-profiles/{profileId}/submit"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["submitted_by = X-User-ID"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /v1/waste-profiles/{profileId}/approve"
        actor: EnvironmentalApprover
        preconditions:
          - "X-User-ID != submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /v1/waste-profiles/{profileId}/suspend"
        actor: EnvironmentalApprover
        preconditions: []
        side_effects:
          - "Cascade link 1: every DisposalManifest referencing this profile with status in {DRAFT, ISSUED} -> VOIDED"
          - "Cascade link 2: each ISSUED manifest so voided releases its reservation: DisposalFacility.reserved_tons -= manifest.estimated_tons"
          - "Cascade link 3: each reservation release recomputes DisposalFacility.posture (FULL -> AVAILABLE when reserved_tons drops below total_capacity_tons)"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /v1/waste-profiles/{profileId}/reinstate"
        actor: EnvironmentalApprover
        preconditions: []
        side_effects: []
        note: "APPROVED <-> SUSPENDED cycle; voided manifests are NOT restored"

  - entity: DisposalManifest
    initial_state: DRAFT
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/manifests/{manifestId}/issue"
        actor: ProjectManager
        preconditions:
          - "WasteProfile.status == APPROVED (ERR_WASTE_PROFILE_NOT_APPROVED)"
          - "DisposalFacility.reserved_tons + estimated_tons <= facility.total_capacity_tons (ERR_FACILITY_CAPACITY_EXCEEDED; equality allowed)"
        side_effects:
          - "estimated_tons computed and stored per manifest_estimated_tons"
          - "facility.reserved_tons += estimated_tons; facility.posture recomputed"
      - from: ISSUED
        to: IN_TRANSIT
        trigger: "POST /v1/manifests/{manifestId}/depart"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /v1/manifests/{manifestId}/receive (when |variance_pct| <= 10.00)"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "variance_pct computed per manifest_variance_pct using profile.variance_basis"
          - "facility.reserved_tons -= estimated_tons; facility.posture recomputed"
      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "system (same receive call, when |variance_pct| > 10.00)"
        actor: system
        preconditions: []
        side_effects:
          - "variance_pct computed and stored"
          - "facility.reserved_tons -= estimated_tons; facility.posture recomputed"
        note: "Branching at receive driven by variance threshold"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /v1/manifests/{manifestId}/reconcile"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "billed_tons = received_tons; disposal_charge_cents computed per manifest_disposal_charge"
      - from: EXCEPTION
        to: RECONCILED
        trigger: "POST /v1/manifests/{manifestId}/resolve-exception"
        actor: ProjectManager
        preconditions:
          - "resolution_note present (ERR_INVALID_REQUEST)"
        side_effects:
          - "billed_tons = adjusted_tons if provided else received_tons; disposal_charge_cents computed per manifest_disposal_charge"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /v1/manifests/{manifestId}/void OR system (job cancel / profile suspend cascades)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /v1/manifests/{manifestId}/void OR system (job cancel / profile suspend cascades)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "facility.reserved_tons -= estimated_tons; facility.posture recomputed"

  - entity: Assignment
    initial_state: SCHEDULED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /v1/assignments/{assignmentId}/confirm"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /v1/assignments/{assignmentId}/release"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/assignments/{assignmentId}/cancel OR system (job cancel cascade) OR system (daily-close: SCHEDULED and window_start + 24h < clock now)"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/assignments/{assignmentId}/cancel OR system (job cancel cascade)"
        actor: ProjectManager
        preconditions: []
        side_effects: []

  - entity: DowntimeEvent
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/downtime-events/{eventId}/close OR system (job cancel cascade)"
        actor: FieldSupervisor
        preconditions: []
        side_effects:
          - "ended_at = logical clock now; duration_minutes, grace_minutes_applied, billable_minutes, billed_blocks, billed_amount_cents computed per downtime_billing using the job's pinned RateSchedule"
          - "Job.standby_accrued_cents recomputed (+= billed_amount_cents)"
      - from: CLOSED
        to: BILLED
        trigger: "system (generate-invoice: events with billable_minutes > 0 are swept into the new invoice)"
        actor: system
        preconditions: []
        side_effects: ["invoice_id set to the generated invoice"]
      - from: BILLED
        to: CLOSED
        trigger: "system (invoice void cascade)"
        actor: system
        preconditions: []
        side_effects: ["invoice_id cleared"]
        note: "BILLED -> CLOSED revert keeps billing cyclic with invoice void"

  - entity: ContainmentRecord
    initial_state: LOGGED
    terminal_states: [VERIFIED, DEFICIENT]
    transitions:
      - from: LOGGED
        to: VERIFIED
        trigger: "POST /v1/containment-records/{recordId}/verify (when capture_ratio >= 0.9500)"
        actor: ProjectManager
        preconditions: []
        side_effects: []
      - from: LOGGED
        to: DEFICIENT
        trigger: "POST /v1/containment-records/{recordId}/verify (when capture_ratio < 0.9500)"
        actor: ProjectManager
        preconditions: []
        side_effects: []
        note: "Same verify call branches on the computed ratio"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /v1/invoices/{invoiceId}/issue"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /v1/invoices/{invoiceId}/mark-paid"
        actor: AccountManager
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "POST /v1/invoices/{invoiceId}/void"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "Cascade link 1: owning Job INVOICED -> FIELD_COMPLETE"
          - "Cascade link 2: that job revert reverts DowntimeEvents BILLED via this invoice -> CLOSED (invoice_id cleared)"
      - from: ISSUED
        to: VOID
        trigger: "POST /v1/invoices/{invoiceId}/void"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "Cascade link 1: owning Job INVOICED -> FIELD_COMPLETE"
          - "Cascade link 2: that job revert reverts DowntimeEvents BILLED via this invoice -> CLOSED (invoice_id cleared)"

  - entity: IncidentReport
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /v1/incidents/{incidentId}/start-review"
        actor: SafetyManager
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /v1/incidents/{incidentId}/close"
        actor: SafetyManager
        preconditions:
          - "osha_recordable and corrective_action present (ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: RateSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/rate-schedules/{scheduleId}/activate"
        actor: AccountManager
        preconditions:
          - "expected_site_version matches Site.version (ERR_STALE_VERSION, OCC)"
        side_effects:
          - "Site.active_rate_schedule_id = this schedule"
          - "Prior schedule of the same site with status=ACTIVE -> SUPERSEDED"
          - "increments Site.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another schedule of the same site is activated)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-activation-stale-site
    parent_entity: Site
    write_endpoint: "POST /v1/rate-schedules/{scheduleId}/activate"
    occ_field: expected_site_version
    description: |
      Activating a RateSchedule against a Site whose version has advanced since
      the client last observed it is rejected. Activation legitimately supersedes
      the site's current ACTIVE schedule, so a client holding a stale site version
      must re-read before activating a different schedule.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: jha-approval-stale-job
    parent_entity: Job
    write_endpoint: "POST /v1/jhas/{jhaId}/approve"
    occ_field: expected_job_version
    description: |
      Approving a JobHazardAnalysis revision against a Job whose version has
      advanced since the client last observed it is rejected. Approval supersedes
      the job's currently APPROVED revision, so a stale job version means the
      client may be approving against an outdated job state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: job_invoice_amount
    trigger: "POST /v1/jobs/{jobId}/generate-invoice (builds the DRAFT invoice's work/standby/disposal lines)"
    algorithm: aggregation
    formula: |
      Inputs from the job's pinned RateSchedule (pinned_rate_schedule_id) and job pricing_mode.
      UNIT_RATE variant:
        if job_type in {VACUUM, COMBINED}:    line VACUUM = gallons_removed * vacuum_per_gallon_cents
        if job_type in {HYDROBLAST, COMBINED}: line HYDRO  = feet_cleaned  * hydroblast_per_foot_cents
        (quantities are integers, rates integer cents -> line amounts exact)
        if sum(work lines) < minimum_invoice_cents:
          append line ADJUSTMENT (origin=AUTO_MINIMUM, discountable=false,
          amount = minimum_invoice_cents - sum(work lines))
      TIME_AND_MATERIALS variant:
        for each Assignment of the job with status in {CONFIRMED, RELEASED}
        (SCHEDULED and CANCELLED excluded), processing order created_at ASC:
          resource_kind=OPERATOR:
            reg_hours = min(8.0, window_hours); ot_hours = max(0.0, window_hours - 8.0)
            line LABOR_REG = round_half_up(reg_hours * labor_rate_cents_per_hour)
            if ot_hours > 0:
              line LABOR_OT = round_half_up(ot_hours * labor_rate_cents_per_hour * overtime_multiplier)
          resource_kind=EQUIPMENT:
            line EQUIPMENT = round_half_up(window_hours * equipment_rate_cents_per_hour)
      Both variants then append:
        for each DowntimeEvent of the job with status in {CLOSED, BILLED} and
        billable_minutes > 0, order created_at ASC:
          line STANDBY = event.billed_amount_cents (already integer cents)
        for each DisposalManifest of the job with status=RECONCILED, order created_at ASC:
          line DISPOSAL = manifest.disposal_charge_cents (discountable=false)
      Every line carries: line_id "L<n>" (1-based in append order), kind, quantity,
      unit, rate_cents, amount_cents, discountable, voided=false, origin=SYSTEM.
    input_set: "Assignments status in {CONFIRMED, RELEASED}; DowntimeEvents status in {CLOSED, BILLED} with billable_minutes > 0; DisposalManifests status=RECONCILED; measured quantities gallons_removed/feet_cleaned from the job"
    constants:
      REGULAR_HOURS_PER_ASSIGNMENT: 8.0
    precision: "integer cents; round_half_up where indicated"
    variants:
      - name: unit_rate
        when: "Job.pricing_mode == UNIT_RATE"
        difference: "Bills measured outputs (gallons, feet) at unit rates with minimum-charge floor; labor/equipment windows do NOT appear as lines"
      - name: time_and_materials
        when: "Job.pricing_mode == TIME_AND_MATERIALS"
        difference: "Bills confirmed crew windows at hourly rates with OT split; measured gallons/feet do NOT appear as lines"
        note: "Same job data produces a different invoice total under the two variants"

  - name: invoice_line_rounding
    trigger: "inside job_invoice_amount for every computed line"
    algorithm: aggregation
    formula: |
      Rounding order is PINNED: each line's amount_cents is rounded to integer
      cents with round_half_up FIRST (per line), then subtotal_cents is the exact
      integer sum of the rounded line amounts. The alternative order (sum exact
      fractional amounts, round once at the end) is FORBIDDEN and yields
      different cents when two or more lines carry a fractional .5 cent
      (e.g. two LABOR_OT lines of 1.0h at rate 12995 with multiplier 1.5:
       per-line-then-sum  = 19493 + 19493 = 38986;
       sum-then-round      = round_half_up(38985.0) = 38985).
    input_set: "All computed lines of one invoice generation"
    precision: "0 decimal places on cents, round_half_up, per line before summation"

  - name: invoice_volume_discount
    trigger: "POST /v1/jobs/{jobId}/generate-invoice and after any corrective line add/void on a DRAFT invoice"
    algorithm: threshold
    formula: |
      Evaluation order is PINNED (the dependency is circular-looking; this order
      makes it well-defined):
        1. subtotal_cents        = sum(amount_cents over non-voided lines)
        2. discountable_subtotal = sum(amount_cents over non-voided lines with discountable=true)
                                   (VACUUM, HYDRO, LABOR_REG, LABOR_OT, EQUIPMENT, STANDBY are
                                    discountable; DISPOSAL and ADJUSTMENT are not)
        3. tier selection uses the PRE-DISCOUNT discountable_subtotal:
             >= 2000000 cents -> 7% ; >= 500000 cents -> 3% ; else 0%
           (highest qualifying tier; boundary is >= so exactly 500000 earns 3%)
        4. discount_cents = round_half_up(discountable_subtotal * tier_pct)
        5. environmental_fee_cents = round_half_up((subtotal_cents - discount_cents) * 0.02)
        6. total_cents = subtotal_cents - discount_cents + environmental_fee_cents
      Keying the tier on the post-discount amount is FORBIDDEN (e.g. a
      discountable subtotal of exactly 500000 yields 494700 total under the
      pinned order; the post-discount reading yields 510000).
    input_set: "Non-voided lines of the invoice"
    constants:
      TIER1_THRESHOLD_CENTS: 500000
      TIER1_PCT: 0.03
      TIER2_THRESHOLD_CENTS: 2000000
      TIER2_PCT: 0.07
      ENV_FEE_PCT: 0.02
    precision: "integer cents, round_half_up"

  - name: downtime_billing
    trigger: "POST /v1/downtime-events/{eventId}/close (and job cancel cascade closing OPEN events)"
    algorithm: threshold
    formula: |
      duration_minutes = (ended_at - started_at) in whole minutes
      grace = GRACE_MINUTES[cause]                       # CONTRACTOR_FAULT handled below
      if cause == CONTRACTOR_FAULT: billable_minutes = 0 # contractor-caused never bills
      else:
        billable_raw = max(0, duration_minutes - grace)  # duration == grace bills exactly 0
        accrued = sum(billable_minutes) over the job's OTHER DowntimeEvents already
                  CLOSED/BILLED with the same closure_day (UTC date of started_at)
        billable_minutes = min(billable_raw, max(0, DAILY_CAP_MINUTES - accrued))
      billed_blocks       = ceil(billable_minutes / BILLING_BLOCK_MINUTES)
      billed_amount_cents = round_half_up(billed_blocks * standby_rate_cents_per_hour / 4)
      (standby rate from the job's pinned RateSchedule; single rounding per event)
      grace_minutes_applied = grace (0 for CONTRACTOR_FAULT)
    input_set: "The closing event plus the job's CLOSED/BILLED DowntimeEvents sharing its closure_day"
    constants:
      GRACE_MINUTES: { CUSTOMER_DELAY: 30, WEATHER: 60, REGULATORY_HOLD: 0, SAFETY_STOP: 0, CONTRACTOR_FAULT: 0 }
      DAILY_CAP_MINUTES: 480
      BILLING_BLOCK_MINUTES: 15
    precision: "minutes integer; cents integer round_half_up"

  - name: job_standby_accrual
    trigger: "any DowntimeEvent transition OPEN->CLOSED or BILLED->CLOSED, and generate-invoice"
    algorithm: aggregation
    formula: |
      Job.standby_accrued_cents = sum(billed_amount_cents) over the job's
      DowntimeEvents with status in {CLOSED, BILLED}. Recomputed on every
      qualifying transition (immediate consistency).
    input_set: "DowntimeEvents of the job with status in {CLOSED, BILLED}"
    precision: "integer cents"

  - name: manifest_estimated_tons
    trigger: "POST /v1/manifests/{manifestId}/issue"
    algorithm: aggregation
    formula: |
      estimated_tons = round_half_up(estimated_gallons * profile.density_lbs_per_gal / 2000, 2)
      (density from the manifest's APPROVED WasteProfile at issue time)
    input_set: "The issuing manifest and its WasteProfile"
    precision: "2 decimal places, round_half_up"

  - name: manifest_variance_pct
    trigger: "POST /v1/manifests/{manifestId}/receive"
    algorithm: threshold
    formula: |
      Basis selected by WasteProfile.variance_basis:
      WEIGHT variant:
        shipped_tons_est = round_half_up(estimated_gallons * density_lbs_per_gal / 2000, 2)
        variance_pct     = round_half_up((received_tons - shipped_tons_est) / shipped_tons_est * 100, 2)
      VOLUME variant:
        received_gallons = round_half_up(received_tons * 2000 / density_lbs_per_gal, 1)
        variance_pct     = round_half_up((received_gallons - estimated_gallons) / estimated_gallons * 100, 2)
      Exception test: |variance_pct| > 10.00 -> manifest lands in EXCEPTION;
      |variance_pct| <= 10.00 (equality included) -> RECEIVED.
    input_set: "The receiving manifest (estimated_gallons, received_tons) and its profile (density, basis)"
    constants:
      EXCEPTION_THRESHOLD_PCT: 10.00
    precision: "percent 2 decimal places, round_half_up"
    variants:
      - name: weight_basis
        when: "WasteProfile.variance_basis == WEIGHT"
        difference: "Converts shipped gallons to tons (2dp) before comparing; denominator = shipped_tons_est"
      - name: volume_basis
        when: "WasteProfile.variance_basis == VOLUME"
        difference: "Converts received tons to gallons (1dp) before comparing; denominator = estimated_gallons; different rounding order gives a different percentage for identical weights/measures"

  - name: manifest_disposal_charge
    trigger: "POST /v1/manifests/{manifestId}/reconcile or /resolve-exception"
    algorithm: aggregation
    formula: |
      disposal_charge_cents = round_half_up(billed_tons * profile.disposal_rate_per_ton_cents)
      billed_tons = received_tons on reconcile; adjusted_tons (if provided) else received_tons on resolve-exception.
    input_set: "The reconciled manifest and its WasteProfile"
    precision: "integer cents, round_half_up"

  - name: capture_ratio
    trigger: "POST /v1/containment-records (computed at creation)"
    algorithm: aggregation
    formula: |
      capture_ratio = round_half_up(water_captured_gallons / water_used_gallons, 4)
      verify maps ratio to status: ratio >= 0.9500 -> VERIFIED (equality passes);
      ratio < 0.9500 -> DEFICIENT.
    input_set: "The created ContainmentRecord"
    constants:
      MIN_CAPTURE_RATIO: 0.9500
    precision: "4 decimal places, round_half_up"

  - name: facility_reservation_sync
    trigger: "manifest issue (+= estimated_tons), manifest receive (release), manifest void of ISSUED (release), profile suspend cascade (release per voided ISSUED manifest)"
    algorithm: aggregation
    formula: |
      DisposalFacility.reserved_tons = sum(estimated_tons) over manifests with
      status=ISSUED whose WasteProfile.facility_id == this facility.
      posture: reserved_tons >= total_capacity_tons -> FULL, else AVAILABLE.
      Recomputed after every qualifying mutation (immediate consistency).
    input_set: "Manifests status=ISSUED tied via profile to the facility"
    precision: "2 decimal places"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header names a declared role and X-User-ID header is present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request shape: required fields present, types valid, enum membership valid, numeric ranges valid (quantities > 0 where required), Assignment carries exactly the FK matching resource_kind (equipment_unit_id iff EQUIPMENT, operator_id iff OPERATOR; the other forbidden)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids and body FK ids reference existing resources (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals the parent's current version on OCC-guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /v1/rate-schedules/{scheduleId}/activate, POST /v1/jhas/{jhaId}/approve" }
  - { priority: 6, category: state, check: "Entity is in a from-state that permits the requested transition; terminal states accept no further transitions", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Job safety posture gate: safety_status must be CLEAR for start-work, complete-field-work, permit activation", error_id: ERR_JOB_STOPPED, http_status: 409, applies_to: "POST /v1/jobs/{id}/start-work, POST /v1/jobs/{id}/complete-field-work, POST /v1/permits/{id}/activate" }
  - { priority: 8, category: business_safety, check: "An APPROVED JHA exists for the job (start-work, resume-work)", error_id: ERR_JHA_NOT_APPROVED, http_status: 422, applies_to: "POST /v1/jobs/{id}/start-work, POST /v1/jobs/{id}/resume-work" }
  - { priority: 9, category: business_safety, check: "JHA submit on HYDROBLAST/COMBINED job requires max_operating_pressure_psi, planned_water_flow_gpm, water_source", error_id: ERR_JHA_PRESSURE_PLAN_REQUIRED, http_status: 422, applies_to: "POST /v1/jhas/{id}/submit" }
  - { priority: 10, category: business_safety, check: "ACTIVE CONFINED_SPACE permit exists when approved JHA has confined_space=true (start-work); permit activation of CONFINED_SPACE requires approved JHA confined_space=true", error_id: ERR_PERMIT_NOT_ACTIVE, http_status: 422, applies_to: "POST /v1/jobs/{id}/start-work" }
  - { priority: 11, category: business_safety, check: "CONFINED_SPACE permit activation requires the job's latest APPROVED JHA to declare confined_space=true", error_id: ERR_PERMIT_JHA_MISMATCH, http_status: 422, applies_to: "POST /v1/permits/{id}/activate" }
  - { priority: 12, category: business_safety, check: "Hydroblast-capable assigned equipment max_pressure_psi >= approved JHA max_operating_pressure_psi and at least one hydroblast-capable equipment assignment exists (HYDROBLAST/COMBINED jobs)", error_id: ERR_PRESSURE_RATING_INSUFFICIENT, http_status: 422, applies_to: "POST /v1/jobs/{id}/start-work" }
  - { priority: 13, category: business_safety, check: "Operator holds required certifications: hazwoper_expires_on covers the full assignment window (assignment create); hydroblast_certified=true on operator assignments for HYDROBLAST/COMBINED start-work", error_id: ERR_OPERATOR_NOT_CERTIFIED, http_status: 422, applies_to: "POST /v1/assignments, POST /v1/jobs/{id}/start-work" }
  - { priority: 14, category: business_safety, check: "Segregation of duties: approver X-User-ID differs from submitted_by on WasteProfile approve and JHA approve/reject", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /v1/waste-profiles/{id}/approve, POST /v1/jhas/{id}/approve, POST /v1/jhas/{id}/reject" }
  - { priority: 15, category: business_safety, check: "Latest ContainmentRecord (max sequence) is VERIFIED before complete-field-work", error_id: ERR_CONTAINMENT_DEFICIENT, http_status: 422, applies_to: "POST /v1/jobs/{id}/complete-field-work" }
  - { priority: 16, category: business_constraint, check: "At most one ACTIVE permit per (job_id, space_id)", error_id: ERR_PERMIT_SPACE_OCCUPIED, http_status: 409, applies_to: "POST /v1/permits/{id}/activate" }
  - { priority: 18, category: business_temporal, check: "window_end > window_start on assignments; valid_from < valid_until on permits", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /v1/assignments, POST /v1/permits" }
  - { priority: 19, category: business_temporal, check: "Equipment half-open overlap: no other Assignment of the same EquipmentUnit with status in {SCHEDULED, CONFIRMED} where NOT(new.end <= exist.start OR new.start >= exist.end); adjacency (end == start) is allowed", error_id: ERR_RESOURCE_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /v1/assignments" }
  - { priority: 20, category: business_temporal, check: "Operator buffered overlap: no other Assignment of the same Operator with status in {SCHEDULED, CONFIRMED} where NOT(new.end + 10h <= exist.start OR new.start >= exist.end + 10h); a gap of exactly 10h is allowed", error_id: ERR_OPERATOR_REST_PERIOD, http_status: 409, applies_to: "POST /v1/assignments" }
  - { priority: 21, category: business_temporal, check: "Permit activation requires logical clock now within [valid_from, valid_until] inclusive", error_id: ERR_PERMIT_WINDOW_INVALID, http_status: 422, applies_to: "POST /v1/permits/{id}/activate" }
  - { priority: 22, category: business_referential, check: "Site has an active_rate_schedule_id when a job is created", error_id: ERR_NO_ACTIVE_RATE_SCHEDULE, http_status: 422, applies_to: "POST /v1/jobs" }
  - { priority: 23, category: business_referential, check: "WasteProfile status == APPROVED when a manifest is issued", error_id: ERR_WASTE_PROFILE_NOT_APPROVED, http_status: 422, applies_to: "POST /v1/manifests/{id}/issue" }
  - { priority: 24, category: business_referential, check: "All job manifests in {RECONCILED, VOIDED} before generate-invoice", error_id: ERR_MANIFEST_UNRECONCILED, http_status: 422, applies_to: "POST /v1/jobs/{id}/generate-invoice" }
  - { priority: 25, category: business_referential, check: "No OPEN DowntimeEvent on the job (complete-field-work, generate-invoice)", error_id: ERR_DOWNTIME_OPEN, http_status: 422, applies_to: "POST /v1/jobs/{id}/complete-field-work, POST /v1/jobs/{id}/generate-invoice" }
  - { priority: 26, category: business_referential, check: "At least one non-cancelled Assignment before schedule", error_id: ERR_NO_ASSIGNMENTS, http_status: 422, applies_to: "POST /v1/jobs/{id}/schedule" }
  - { priority: 27, category: business_referential, check: "At least one CONFIRMED Assignment before mobilize", error_id: ERR_NO_CONFIRMED_CREW, http_status: 422, applies_to: "POST /v1/jobs/{id}/mobilize" }
  - { priority: 28, category: business_referential, check: "Job cancel blocked while any manifest in {IN_TRANSIT, RECEIVED, RECONCILED}", error_id: ERR_JOB_HAS_COMMITTED_WASTE, http_status: 409, applies_to: "POST /v1/jobs/{id}/cancel" }
  - { priority: 29, category: business_referential, check: "Job close requires its non-VOID invoice status == PAID", error_id: ERR_INVOICE_NOT_PAID, http_status: 422, applies_to: "POST /v1/jobs/{id}/close" }
  - { priority: 30, category: business_fiscal, check: "Site credit_status == GOOD_STANDING at start-work", error_id: ERR_SITE_CREDIT_HOLD, http_status: 422, applies_to: "POST /v1/jobs/{id}/start-work" }
  - { priority: 31, category: business_fiscal, check: "Facility reservation: reserved_tons + estimated_tons <= total_capacity_tons at manifest issue (equality allowed)", error_id: ERR_FACILITY_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /v1/manifests/{id}/issue" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Site ---
  - { method: POST, path: "/v1/sites", description: "Create a customer site", roles: [AccountManager], code: 201, input: [name, "credit_status?"], output: Site, side_effects: ["credit_status defaults GOOD_STANDING; active_rate_schedule_id null"] }
  - method: GET
    path: "/v1/sites"
    description: "List sites (paginated)"
    roles: &all_roles [PlatformAdmin, AccountManager, ProjectManager, FieldSupervisor, SafetyManager, ComplianceOfficer, EnvironmentalApprover]
    code: 200
    input: ["credit_status?", "active_rate_schedule_id?", "limit?", "offset?"]
    output: "Site[]"
    side_effects: []
  - { method: GET, path: "/v1/sites/{siteId}", description: "Get a site", roles: *all_roles, code: 200, input: [], output: Site, side_effects: [] }
  - { method: PATCH, path: "/v1/sites/{siteId}", description: "Update site credit status", roles: [AccountManager], code: 200, input: ["credit_status?"], output: Site, side_effects: ["increments Site.version by 1"] }

  # --- RateSchedule ---
  - { method: POST, path: "/v1/rate-schedules", description: "Create a rate schedule (DRAFT) for a site", roles: [AccountManager], code: 201, input: [site_id, label, vacuum_per_gallon_cents, hydroblast_per_foot_cents, labor_rate_cents_per_hour, equipment_rate_cents_per_hour, standby_rate_cents_per_hour, "overtime_multiplier?", minimum_invoice_cents], output: RateSchedule, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/v1/rate-schedules", description: "List rate schedules", roles: *all_roles, code: 200, input: ["site_id?", "status?", "limit?", "offset?"], output: "RateSchedule[]", side_effects: [] }
  - { method: GET, path: "/v1/rate-schedules/{scheduleId}", description: "Get a rate schedule", roles: *all_roles, code: 200, input: [], output: RateSchedule, side_effects: [] }
  - { method: POST, path: "/v1/rate-schedules/{scheduleId}/activate", description: "Activate a DRAFT schedule; supersedes the site's current ACTIVE schedule (OCC on Site.version)", roles: [AccountManager], code: 200, input: [expected_site_version], output: RateSchedule, side_effects: ["Site.active_rate_schedule_id = this schedule", "prior ACTIVE schedule of the site -> SUPERSEDED", "increments Site.version by 1"] }

  # --- Job ---
  - { method: POST, path: "/v1/jobs", description: "Create a job; pins the site's ACTIVE rate schedule", roles: [ProjectManager], code: 201, input: [site_id, job_type, pricing_mode, description, "estimated_gallons?"], output: Job, side_effects: ["pinned_rate_schedule_id = site.active_rate_schedule_id (ERR_NO_ACTIVE_RATE_SCHEDULE if none)", "execution_status=QUOTED, safety_status=CLEAR"] }
  - { method: GET, path: "/v1/jobs", description: "List jobs", roles: *all_roles, code: 200, input: ["site_id?", "execution_status?", "pinned_rate_schedule_id?", "limit?", "offset?"], output: "Job[]", side_effects: [] }
  - { method: GET, path: "/v1/jobs/{jobId}", description: "Get a job", roles: *all_roles, code: 200, input: [], output: Job, side_effects: [] }
  - { method: POST, path: "/v1/jobs/{jobId}/schedule", description: "QUOTED -> SCHEDULED (requires a non-cancelled assignment)", roles: [ProjectManager], code: 200, input: [], output: Job, side_effects: ["increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/mobilize", description: "SCHEDULED -> MOBILIZED (requires a CONFIRMED assignment)", roles: [ProjectManager], code: 200, input: [], output: Job, side_effects: ["increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/start-work", description: "MOBILIZED -> IN_PROGRESS (JHA approved, confined-space permit, pressure rating, crew certs, credit gate)", roles: [ProjectManager], code: 200, input: [], output: Job, side_effects: ["increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/complete-field-work", description: "IN_PROGRESS -> FIELD_COMPLETE; records measured quantities", roles: [ProjectManager], code: 200, input: [gallons_removed, feet_cleaned], output: Job, side_effects: ["stores gallons_removed/feet_cleaned", "increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/cancel", description: "Cancel a non-terminal, non-INVOICED job; cascades to assignments, permits, manifests, downtime", roles: [ProjectManager], code: 200, input: [], output: Job, side_effects: ["assignments {SCHEDULED,CONFIRMED} -> CANCELLED", "permits {ISSUED,ACTIVE,SUSPENDED} -> REVOKED", "manifests {DRAFT,ISSUED} -> VOIDED with facility reservation release", "OPEN downtime -> CLOSED with billing computation", "increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/stop-work", description: "safety_status CLEAR -> STOP_WORK; suspends ACTIVE permits", roles: [SafetyManager], code: 200, input: [], output: Job, side_effects: ["ACTIVE permits -> SUSPENDED", "increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/resume-work", description: "safety_status STOP_WORK -> CLEAR (all incidents CLOSED, JHA still APPROVED)", roles: [SafetyManager], code: 200, input: [], output: Job, side_effects: ["increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/close", description: "INVOICED -> CLOSED (invoice must be PAID)", roles: [ProjectManager], code: 200, input: [], output: Job, side_effects: ["increments Job.version by 1"] }
  - { method: POST, path: "/v1/jobs/{jobId}/generate-invoice", description: "FIELD_COMPLETE -> INVOICED; builds the DRAFT invoice per pricing_mode", roles: [ProjectManager], code: 201, input: [], output: Invoice, side_effects: ["runs job_invoice_amount + invoice_line_rounding + invoice_volume_discount", "CLOSED downtime with billable_minutes > 0 -> BILLED with invoice_id set", "increments Job.version by 1"] }

  # --- JobHazardAnalysis ---
  - { method: POST, path: "/v1/jhas", description: "Create a JHA revision for a job (revision_number = max+1); job must not be CANCELLED/CLOSED", roles: [FieldSupervisor], code: 201, input: [job_id, confined_space, hazards, "max_operating_pressure_psi?", "planned_water_flow_gpm?", "water_source?"], output: JobHazardAnalysis, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/v1/jhas", description: "List JHAs", roles: *all_roles, code: 200, input: ["job_id?", "status?", "limit?", "offset?"], output: "JobHazardAnalysis[]", side_effects: [] }
  - { method: GET, path: "/v1/jhas/{jhaId}", description: "Get a JHA", roles: *all_roles, code: 200, input: [], output: JobHazardAnalysis, side_effects: [] }
  - { method: POST, path: "/v1/jhas/{jhaId}/submit", description: "DRAFT -> SUBMITTED (pressure/water plan required for HYDROBLAST/COMBINED)", roles: [FieldSupervisor], code: 200, input: [], output: JobHazardAnalysis, side_effects: ["submitted_by = X-User-ID"] }
  - { method: POST, path: "/v1/jhas/{jhaId}/approve", description: "SUBMITTED -> APPROVED; supersedes prior APPROVED revision (OCC on Job.version; approver != submitter)", roles: [SafetyManager], code: 200, input: [expected_job_version], output: JobHazardAnalysis, side_effects: ["approved_by = X-User-ID", "other APPROVED revisions of the job -> SUPERSEDED", "increments Job.version by 1"] }
  - { method: POST, path: "/v1/jhas/{jhaId}/reject", description: "SUBMITTED -> REJECTED (rejector != submitter)", roles: [SafetyManager], code: 200, input: [], output: JobHazardAnalysis, side_effects: [] }
  - { method: POST, path: "/v1/jhas/{jhaId}/revise", description: "REJECTED -> DRAFT (revision cycle)", roles: [FieldSupervisor], code: 200, input: [], output: JobHazardAnalysis, side_effects: [] }

  # --- Permit ---
  - { method: POST, path: "/v1/permits", description: "Create a permit (ISSUED); job must be in {SCHEDULED, MOBILIZED, IN_PROGRESS}", roles: [FieldSupervisor], code: 201, input: [job_id, permit_type, space_id, valid_from, valid_until], output: Permit, side_effects: ["status=ISSUED"] }
  - { method: GET, path: "/v1/permits", description: "List permits", roles: *all_roles, code: 200, input: ["job_id?", "status?", "limit?", "offset?"], output: "Permit[]", side_effects: [] }
  - { method: GET, path: "/v1/permits/{permitId}", description: "Get a permit", roles: *all_roles, code: 200, input: [], output: Permit, side_effects: [] }
  - { method: POST, path: "/v1/permits/{permitId}/activate", description: "ISSUED or SUSPENDED -> ACTIVE (safety clear, JHA match, one ACTIVE per space, within validity window)", roles: [FieldSupervisor], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: POST, path: "/v1/permits/{permitId}/suspend", description: "ACTIVE -> SUSPENDED", roles: [SafetyManager], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: POST, path: "/v1/permits/{permitId}/close", description: "ACTIVE -> CLOSED", roles: [FieldSupervisor], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: POST, path: "/v1/permits/{permitId}/revoke", description: "{ISSUED, ACTIVE, SUSPENDED} -> REVOKED", roles: [SafetyManager], code: 200, input: [], output: Permit, side_effects: [] }

  # --- EquipmentUnit / Operator (fleet & crew registry) ---
  - { method: POST, path: "/v1/equipment-units", description: "Register an equipment unit", roles: [PlatformAdmin], code: 201, input: [unit_code, unit_type, max_pressure_psi, tank_capacity_gal], output: EquipmentUnit, side_effects: [] }
  - { method: GET, path: "/v1/equipment-units", description: "List equipment units", roles: *all_roles, code: 200, input: ["unit_type?", "limit?", "offset?"], output: "EquipmentUnit[]", side_effects: [] }
  - { method: GET, path: "/v1/equipment-units/{unitId}", description: "Get an equipment unit", roles: *all_roles, code: 200, input: [], output: EquipmentUnit, side_effects: [] }
  - { method: POST, path: "/v1/operators", description: "Register an operator", roles: [PlatformAdmin], code: 201, input: [full_name, employee_ref, hazwoper_expires_on, hydroblast_certified], output: Operator, side_effects: [] }
  - { method: GET, path: "/v1/operators", description: "List operators", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "Operator[]", side_effects: [] }
  - { method: GET, path: "/v1/operators/{operatorId}", description: "Get an operator", roles: *all_roles, code: 200, input: [], output: Operator, side_effects: [] }

  # --- Assignment ---
  - { method: POST, path: "/v1/assignments", description: "Assign equipment or operator to a job window; overlap/rest/cert checks; job must be in {QUOTED, SCHEDULED, MOBILIZED}", roles: [ProjectManager], code: 201, input: [job_id, resource_kind, "equipment_unit_id?", "operator_id?", window_start, window_end], output: Assignment, side_effects: ["status=SCHEDULED; window_hours computed"] }
  - { method: GET, path: "/v1/assignments", description: "List assignments (FK reverse lookup for job/equipment/operator)", roles: *all_roles, code: 200, input: ["job_id?", "equipment_unit_id?", "operator_id?", "status?", "limit?", "offset?"], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/v1/assignments/{assignmentId}", description: "Get an assignment", roles: *all_roles, code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/v1/assignments/{assignmentId}/confirm", description: "SCHEDULED -> CONFIRMED", roles: [ProjectManager], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/v1/assignments/{assignmentId}/release", description: "CONFIRMED -> RELEASED", roles: [ProjectManager], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: POST, path: "/v1/assignments/{assignmentId}/cancel", description: "{SCHEDULED, CONFIRMED} -> CANCELLED", roles: [ProjectManager], code: 200, input: [], output: Assignment, side_effects: [] }

  # --- WasteProfile ---
  - { method: POST, path: "/v1/waste-profiles", description: "Create a waste characterization profile (DRAFT)", roles: [ComplianceOfficer], code: 201, input: [site_id, facility_id, waste_code, hazard_class, density_lbs_per_gal, disposal_rate_per_ton_cents, variance_basis], output: WasteProfile, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/v1/waste-profiles", description: "List waste profiles (FK reverse for site_id and facility_id)", roles: *all_roles, code: 200, input: ["site_id?", "facility_id?", "status?", "limit?", "offset?"], output: "WasteProfile[]", side_effects: [] }
  - { method: GET, path: "/v1/waste-profiles/{profileId}", description: "Get a waste profile", roles: *all_roles, code: 200, input: [], output: WasteProfile, side_effects: [] }
  - { method: POST, path: "/v1/waste-profiles/{profileId}/submit", description: "DRAFT -> SUBMITTED (records submitted_by)", roles: [ComplianceOfficer], code: 200, input: [], output: WasteProfile, side_effects: ["submitted_by = X-User-ID"] }
  - { method: POST, path: "/v1/waste-profiles/{profileId}/approve", description: "SUBMITTED -> APPROVED (approver != submitter)", roles: [EnvironmentalApprover], code: 200, input: [], output: WasteProfile, side_effects: [] }
  - { method: POST, path: "/v1/waste-profiles/{profileId}/suspend", description: "APPROVED -> SUSPENDED; voids DRAFT/ISSUED manifests, releases facility reservations, recomputes facility posture", roles: [EnvironmentalApprover], code: 200, input: [], output: WasteProfile, side_effects: ["manifests {DRAFT,ISSUED} -> VOIDED", "ISSUED voids release facility reservation (reserved_tons -= estimated_tons)", "facility posture recomputed per release"] }
  - { method: POST, path: "/v1/waste-profiles/{profileId}/reinstate", description: "SUSPENDED -> APPROVED (does not restore voided manifests)", roles: [EnvironmentalApprover], code: 200, input: [], output: WasteProfile, side_effects: [] }

  # --- DisposalFacility ---
  - { method: POST, path: "/v1/disposal-facilities", description: "Register a disposal facility", roles: [PlatformAdmin], code: 201, input: [name, epa_id, total_capacity_tons], output: DisposalFacility, side_effects: ["reserved_tons=0, posture=AVAILABLE"] }
  - { method: GET, path: "/v1/disposal-facilities", description: "List disposal facilities", roles: *all_roles, code: 200, input: ["limit?", "offset?"], output: "DisposalFacility[]", side_effects: [] }
  - { method: GET, path: "/v1/disposal-facilities/{facilityId}", description: "Get a disposal facility", roles: *all_roles, code: 200, input: [], output: DisposalFacility, side_effects: [] }

  # --- DisposalManifest ---
  - { method: POST, path: "/v1/manifests", description: "Create a disposal manifest (DRAFT); job must be IN_PROGRESS or FIELD_COMPLETE", roles: [ProjectManager], code: 201, input: [job_id, waste_profile_id, estimated_gallons], output: DisposalManifest, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/v1/manifests", description: "List manifests (FK reverse for job_id and waste_profile_id)", roles: *all_roles, code: 200, input: ["job_id?", "waste_profile_id?", "status?", "limit?", "offset?"], output: "DisposalManifest[]", side_effects: [] }
  - { method: GET, path: "/v1/manifests/{manifestId}", description: "Get a manifest", roles: *all_roles, code: 200, input: [], output: DisposalManifest, side_effects: [] }
  - { method: POST, path: "/v1/manifests/{manifestId}/issue", description: "DRAFT -> ISSUED; computes estimated_tons; reserves facility capacity", roles: [ProjectManager], code: 200, input: [], output: DisposalManifest, side_effects: ["estimated_tons computed per manifest_estimated_tons", "facility.reserved_tons += estimated_tons; posture recomputed"] }
  - { method: POST, path: "/v1/manifests/{manifestId}/depart", description: "ISSUED -> IN_TRANSIT", roles: [ProjectManager], code: 200, input: [], output: DisposalManifest, side_effects: [] }
  - { method: POST, path: "/v1/manifests/{manifestId}/receive", description: "IN_TRANSIT -> RECEIVED (|variance| <= 10.00) or -> EXCEPTION (|variance| > 10.00); releases reservation", roles: [ProjectManager], code: 200, input: [received_tons], output: DisposalManifest, side_effects: ["variance_pct computed per manifest_variance_pct", "facility.reserved_tons -= estimated_tons; posture recomputed"] }
  - { method: POST, path: "/v1/manifests/{manifestId}/reconcile", description: "RECEIVED -> RECONCILED; locks billed_tons and disposal_charge_cents", roles: [ProjectManager], code: 200, input: [], output: DisposalManifest, side_effects: ["billed_tons = received_tons; disposal_charge_cents per manifest_disposal_charge"] }
  - { method: POST, path: "/v1/manifests/{manifestId}/resolve-exception", description: "EXCEPTION -> RECONCILED with resolution note and optional adjusted quantity", roles: [ProjectManager], code: 200, input: [resolution_note, "adjusted_tons?"], output: DisposalManifest, side_effects: ["billed_tons = adjusted_tons if provided else received_tons; disposal_charge_cents computed"] }
  - { method: POST, path: "/v1/manifests/{manifestId}/void", description: "{DRAFT, ISSUED} -> VOIDED; ISSUED void releases reservation", roles: [ComplianceOfficer], code: 200, input: [], output: DisposalManifest, side_effects: ["if ISSUED: facility.reserved_tons -= estimated_tons; posture recomputed"] }

  # --- ContainmentRecord ---
  - { method: POST, path: "/v1/containment-records", description: "Log decon/wash-water containment for an IN_PROGRESS job; computes capture_ratio and per-job sequence", roles: [FieldSupervisor], code: 201, input: [job_id, water_used_gallons, water_captured_gallons], output: ContainmentRecord, side_effects: ["sequence = max existing for job + 1", "capture_ratio computed", "status=LOGGED"] }
  - { method: GET, path: "/v1/containment-records", description: "List containment records (FK reverse for job_id)", roles: *all_roles, code: 200, input: ["job_id?", "limit?", "offset?"], output: "ContainmentRecord[]", side_effects: [] }
  - { method: GET, path: "/v1/containment-records/{recordId}", description: "Get a containment record", roles: *all_roles, code: 200, input: [], output: ContainmentRecord, side_effects: [] }
  - { method: POST, path: "/v1/containment-records/{recordId}/verify", description: "LOGGED -> VERIFIED if capture_ratio >= 0.9500 else -> DEFICIENT", roles: [ProjectManager], code: 200, input: [], output: ContainmentRecord, side_effects: [] }

  # --- DowntimeEvent ---
  - { method: POST, path: "/v1/downtime-events", description: "Open a downtime/standby event on an IN_PROGRESS job; started_at = logical clock", roles: [FieldSupervisor], code: 201, input: [job_id, cause], output: DowntimeEvent, side_effects: ["started_at = clock now; closure_day = UTC date of started_at; status=OPEN"] }
  - { method: GET, path: "/v1/downtime-events", description: "List downtime events (FK reverse for job_id and invoice_id)", roles: *all_roles, code: 200, input: ["job_id?", "invoice_id?", "status?", "limit?", "offset?"], output: "DowntimeEvent[]", side_effects: [] }
  - { method: GET, path: "/v1/downtime-events/{eventId}", description: "Get a downtime event", roles: *all_roles, code: 200, input: [], output: DowntimeEvent, side_effects: [] }
  - { method: POST, path: "/v1/downtime-events/{eventId}/close", description: "OPEN -> CLOSED; computes duration/grace/billable/blocks/amount per downtime_billing", roles: [FieldSupervisor], code: 200, input: [], output: DowntimeEvent, side_effects: ["ended_at = clock now", "billing fields computed per downtime_billing with job's pinned schedule", "Job.standby_accrued_cents recomputed"] }

  # --- Invoice ---
  - { method: GET, path: "/v1/invoices", description: "List invoices (FK reverse for job_id)", roles: *all_roles, code: 200, input: ["job_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/v1/invoices/{invoiceId}", description: "Get an invoice", roles: *all_roles, code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/v1/invoices/{invoiceId}/issue", description: "DRAFT -> ISSUED", roles: [AccountManager], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/v1/invoices/{invoiceId}/mark-paid", description: "ISSUED -> PAID", roles: [AccountManager], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/v1/invoices/{invoiceId}/void", description: "{DRAFT, ISSUED} -> VOID; reverts job INVOICED -> FIELD_COMPLETE and un-bills its downtime", roles: [AccountManager], code: 200, input: [], output: Invoice, side_effects: ["Job INVOICED -> FIELD_COMPLETE", "DowntimeEvents BILLED via this invoice -> CLOSED, invoice_id cleared"] }
  - { method: POST, path: "/v1/invoices/{invoiceId}/lines", description: "Append a corrective ADJUSTMENT line (discountable=false, origin=MANUAL) to a DRAFT invoice; totals recompute", roles: [AccountManager], code: 201, input: [description, amount_cents], output: Invoice, side_effects: ["line_id = next L<n>", "subtotal/environmental_fee/total recomputed; discount base unchanged"] }
  - { method: POST, path: "/v1/invoices/{invoiceId}/lines/{lineId}/void", description: "Void one line of a DRAFT invoice; totals recompute", roles: [AccountManager], code: 200, input: [], output: Invoice, side_effects: ["line.voided = true", "subtotal/environmental_fee/total recomputed"] }

  # --- IncidentReport ---
  - { method: POST, path: "/v1/incidents", description: "Report an incident/near-miss on a job in {MOBILIZED, IN_PROGRESS, FIELD_COMPLETE}; SERIOUS/MAJOR drives the job to STOP_WORK and suspends ACTIVE permits", roles: [FieldSupervisor], code: 201, input: [job_id, severity, title, description], output: IncidentReport, side_effects: ["status=REPORTED", "if severity in {SERIOUS, MAJOR} and job safety CLEAR: job -> STOP_WORK and its ACTIVE permits -> SUSPENDED"] }
  - { method: GET, path: "/v1/incidents", description: "List incidents (FK reverse for job_id)", roles: *all_roles, code: 200, input: ["job_id?", "status?", "limit?", "offset?"], output: "IncidentReport[]", side_effects: [] }
  - { method: GET, path: "/v1/incidents/{incidentId}", description: "Get an incident", roles: *all_roles, code: 200, input: [], output: IncidentReport, side_effects: [] }
  - { method: POST, path: "/v1/incidents/{incidentId}/start-review", description: "REPORTED -> UNDER_REVIEW", roles: [SafetyManager], code: 200, input: [], output: IncidentReport, side_effects: [] }
  - { method: POST, path: "/v1/incidents/{incidentId}/close", description: "UNDER_REVIEW -> CLOSED with OSHA recordability determination", roles: [SafetyManager], code: 200, input: [osha_recordable, corrective_action], output: IncidentReport, side_effects: [] }

  # --- Ops / test-driving ---
  - method: POST
    path: "/v1/sites/{siteId}/daily-close"
    description: "Operations checkpoint for a site: (1) permits of the site's jobs in {ISSUED, ACTIVE, SUSPENDED} with valid_until < logical clock -> EXPIRED; (2) assignments of the site's jobs in SCHEDULED with window_start + 24h < logical clock -> CANCELLED"
    roles: [ProjectManager]
    code: 200
    input: []
    output: "{ expired_permit_ids: list, cancelled_assignment_ids: list }"
    side_effects: ["permit expiry sweep", "stale assignment sweep"]
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock (test-driving). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; no entity mutations (sweeps happen only via daily-close)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing/unknown or X-User-ID missing" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum/type/range, or assignment resource-kind/FK mismatch" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a from-state permitting the transition; terminal-state lockdown" }
  - { id: ERR_JOB_STOPPED, http: 409, condition: "Job safety_status == STOP_WORK gates start-work, complete-field-work, permit activation" }
  - { id: ERR_JHA_NOT_APPROVED, http: 422, condition: "No APPROVED JHA revision exists for the job" }
  - { id: ERR_JHA_PRESSURE_PLAN_REQUIRED, http: 422, condition: "HYDROBLAST/COMBINED JHA submit without pressure/water plan fields" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 422, condition: "Required ACTIVE CONFINED_SPACE permit missing at start-work" }
  - { id: ERR_PERMIT_JHA_MISMATCH, http: 422, condition: "CONFINED_SPACE permit activation without approved confined-space JHA" }
  - { id: ERR_PRESSURE_RATING_INSUFFICIENT, http: 422, condition: "Assigned hydroblast equipment max_pressure_psi below approved JHA plan, or none assigned" }
  - { id: ERR_OPERATOR_NOT_CERTIFIED, http: 422, condition: "Operator HAZWOPER expiry does not cover assignment window, or hydroblast_certified=false where required" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Approver X-User-ID equals the submitting user (profile approve, JHA approve/reject)" }
  - { id: ERR_CONTAINMENT_DEFICIENT, http: 422, condition: "Latest containment record absent or not VERIFIED at complete-field-work" }
  - { id: ERR_PERMIT_SPACE_OCCUPIED, http: 409, condition: "Another permit of the same job and space_id is already ACTIVE" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end <= window_start or valid_from >= valid_until" }
  - { id: ERR_RESOURCE_SCHEDULE_CONFLICT, http: 409, condition: "Equipment unit has an overlapping SCHEDULED/CONFIRMED assignment (half-open intervals; adjacency allowed)" }
  - { id: ERR_OPERATOR_REST_PERIOD, http: 409, condition: "Operator has another SCHEDULED/CONFIRMED assignment within the 10h rest buffer" }
  - { id: ERR_PERMIT_WINDOW_INVALID, http: 422, condition: "Permit activation outside [valid_from, valid_until]" }
  - { id: ERR_NO_ACTIVE_RATE_SCHEDULE, http: 422, condition: "Site has no ACTIVE rate schedule at job creation" }
  - { id: ERR_WASTE_PROFILE_NOT_APPROVED, http: 422, condition: "Manifest issue requires WasteProfile status == APPROVED" }
  - { id: ERR_MANIFEST_UNRECONCILED, http: 422, condition: "generate-invoice requires all manifests in {RECONCILED, VOIDED}" }
  - { id: ERR_DOWNTIME_OPEN, http: 422, condition: "An OPEN downtime event exists on the job" }
  - { id: ERR_NO_ASSIGNMENTS, http: 422, condition: "Job schedule requires a non-cancelled assignment" }
  - { id: ERR_NO_CONFIRMED_CREW, http: 422, condition: "Job mobilize requires a CONFIRMED assignment" }
  - { id: ERR_JOB_HAS_COMMITTED_WASTE, http: 409, condition: "Cancel blocked: manifest in {IN_TRANSIT, RECEIVED, RECONCILED} exists" }
  - { id: ERR_INVOICE_NOT_PAID, http: 422, condition: "Job close requires the non-VOID invoice to be PAID" }
  - { id: ERR_SITE_CREDIT_HOLD, http: 422, condition: "Site credit_status == CREDIT_HOLD at start-work" }
  - { id: ERR_FACILITY_CAPACITY_EXCEEDED, http: 422, condition: "Manifest issue would push facility reserved_tons above total_capacity_tons" }

# =============================================================================
# 1.7 RBAC Matrix (all roles opaque: X-User-ID is an operator identifier)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns the logical clock and the fleet/crew/facility registries"
    identity: opaque
    exclusive_operations:
      - "POST /v1/_clock/set_current_utc"
      - "POST /v1/equipment-units"
      - "POST /v1/operators"
      - "POST /v1/disposal-facilities"
    shared_operations: ["GET endpoints (all resources)"]
  - name: AccountManager
    description: "Commercial owner of sites, rate schedules and invoicing"
    identity: opaque
    exclusive_operations:
      - "POST /v1/sites, PATCH /v1/sites/{id}"
      - "POST /v1/rate-schedules, POST /v1/rate-schedules/{id}/activate"
      - "POST /v1/invoices/{id}/issue, /mark-paid, /void, /lines, /lines/{lineId}/void"
    shared_operations: ["GET endpoints (all resources)"]
  - name: ProjectManager
    description: "Runs job lifecycle, crew assignment, manifests, verification, billing generation, daily close"
    identity: opaque
    exclusive_operations:
      - "POST /v1/jobs and all /v1/jobs/{id}/* lifecycle actions except stop-work/resume-work"
      - "POST /v1/assignments and assignment confirm/release/cancel"
      - "POST /v1/manifests and manifest issue/depart/receive/reconcile/resolve-exception"
      - "POST /v1/containment-records/{id}/verify"
      - "POST /v1/sites/{id}/daily-close"
    shared_operations: ["GET endpoints (all resources)"]
  - name: FieldSupervisor
    description: "Field lead; drafts JHAs, permits, containment logs, downtime events, incident reports"
    identity: opaque
    exclusive_operations:
      - "POST /v1/jhas, /v1/jhas/{id}/submit, /v1/jhas/{id}/revise"
      - "POST /v1/permits, /v1/permits/{id}/activate, /v1/permits/{id}/close"
      - "POST /v1/containment-records"
      - "POST /v1/downtime-events, /v1/downtime-events/{id}/close"
      - "POST /v1/incidents"
    shared_operations: ["GET endpoints (all resources)"]
  - name: SafetyManager
    description: "HSE authority; approves JHAs, suspends/revokes permits, stop/resume work, incident review"
    identity: opaque
    exclusive_operations:
      - "POST /v1/jhas/{id}/approve, /v1/jhas/{id}/reject"
      - "POST /v1/permits/{id}/suspend, /v1/permits/{id}/revoke"
      - "POST /v1/jobs/{id}/stop-work, /v1/jobs/{id}/resume-work"
      - "POST /v1/incidents/{id}/start-review, /v1/incidents/{id}/close"
    shared_operations: ["GET endpoints (all resources)"]
  - name: ComplianceOfficer
    description: "Environmental compliance; drafts/submits waste profiles and voids manifests"
    identity: opaque
    exclusive_operations:
      - "POST /v1/waste-profiles, /v1/waste-profiles/{id}/submit"
      - "POST /v1/manifests/{id}/void"
    shared_operations: ["GET endpoints (all resources)"]
  - name: EnvironmentalApprover
    description: "Independent approver for waste profiles (segregated from ComplianceOfficer)"
    identity: opaque
    exclusive_operations:
      - "POST /v1/waste-profiles/{id}/approve, /suspend, /reinstate"
    shared_operations: ["GET endpoints (all resources)"]
