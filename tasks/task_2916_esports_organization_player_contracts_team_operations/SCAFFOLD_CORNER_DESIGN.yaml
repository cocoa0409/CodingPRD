            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { pA_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Dana Reyes", birth_date: "2002-03-09", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { pB_id: $.data.id }
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pA_id}", base_salary_cents: 12500000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 10, tax_residency_code: "US-CA", signing_bonus_cents: 0, buyout_multiplier_bp: 5000 }
              as: GeneralManager
