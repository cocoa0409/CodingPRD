            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-21T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C18", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-05", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "AM" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "POST /billing-cycle-periods/${period_id}/close-read-window", payload: {}, as: BillingLiaison }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /billing-cycle-periods/${period_id}/finalize-billing", payload: {}, as: BillingLiaison, captures: { err: $.data.error_id } }
            - { call: "POST /route-stops/${stop_id}/generate-estimate", payload: {}, as: BillingLiaison, captures: { est_id: $.data.id } }
            - { call: "POST /billing-cycle-periods/${period_id}/finalize-billing", payload: {}, as: BillingLiaison }
          assert:
            - "first finalize: error_id == ERR_CYCLE_HAS_UNRESOLVED_STOPS (unresolved_stop_count == 1)"
            - "estimate resolves the stop: MeterRead.${est_id}.read_status == ESTIMATED"
            - "second finalize succeeds: BillingCyclePeriod.${period_id}.period_status == BILLED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_shift_windows_reject_overlap_allow_adjacency
        grounds:
          - validations[priority=17]
          - errors[ERR_TECHNICIAN_WINDOW_CONFLICT]
          - entities.Route.fields.route_shift
        distinguishing_aspect: |
          Interval semantics 1 of 2 (half-open shift windows on the FieldTechnician resource):
          AM=[06:00,12:00) vs AM collides, but AM then PM is exact adjacency (12:00 boundary is
          exclusive on AM) and is allowed; the rejection is an overlap check, not a merge.
        test_recipe:
          setup:
            - "Technician T; three routes in the same period all scheduled 2026-08-10: A (AM), B (AM), C (PM); no accounts needed (routes may be empty)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech Ten" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C19", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-10", read_window_close_date: "2026-08-14", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-10", route_shift: "AM" }, as: Dispatcher, captures: { route_a: $.data.id } }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-10", route_shift: "AM" }, as: Dispatcher, captures: { route_b: $.data.id } }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-10", route_shift: "PM" }, as: Dispatcher, captures: { route_c: $.data.id } }
          trigger:
            - { call: "POST /routes/${route_a}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_b}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher, captures: { err_b: $.data.error_id } }
            - { call: "POST /routes/${route_c}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
          assert:
            - "Route.${route_a}.route_status == ASSIGNED"
            - "assign B (AM over AM): error_id == ERR_TECHNICIAN_WINDOW_CONFLICT"
            - "Route.${route_b}.route_status == DRAFT   # rejected, unchanged"
            - "Route.${route_c}.route_status == ASSIGNED   # AM->PM adjacency allowed (half-open semantics)"

      - name: hazard_rereport_merges_interval_and_extends_expiry
        grounds:
          - calculations.hazard_ttl_expiry
          - state_machines.HazardFlag.ACTIVE_to_ACTIVE
          - entities.HazardFlag.fields.expires_at
        distinguishing_aspect: |
          Interval semantics 2 of 2 (interval-MERGE union on the HazardFlag resource, vs overlap
          rejection in the sibling): re-reporting the same (account, hazard_type) while ACTIVE does
          not create a second flag — it merges, setting expires_at = max(existing, now + 30d) and
          incrementing renewed_count, leaving exactly one row.
        test_recipe:
          setup:
            - "Account exists; clock at 2026-08-01T09:00:00Z for the first DOG report"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech Eleven" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-9101", service_address: "61 Poplar St", billing_cycle_code: "C20" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /hazard-flags", payload: { service_account_id: "${acct_id}", hazard_type: "DOG", severity: "HIGH" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { flag_1: $.data.id, exp_1: $.data.expires_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T09:00:00Z" }, as: MeterOpsAdmin }
          trigger:
            - { call: "POST /hazard-flags", payload: { service_account_id: "${acct_id}", hazard_type: "DOG", severity: "LOW" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { flag_2: $.data.id, exp_2: $.data.expires_at, renewed: $.data.renewed_count } }
            - { call: "GET /hazard-flags", payload: { service_account_id: "${acct_id}" }, as: Dispatcher, captures: { } }
          assert:
            - "first report expires_at == 2026-08-31T09:00:00.000Z (${exp_1})   # 2026-08-01T09:00 + 30d"
            - "merge returns the SAME flag: ${flag_2} == ${flag_1}"
            - "merged expires_at == 2026-09-05T09:00:00.000Z (${exp_2})   # max(08-31T09:00, 08-06T09:00+30d)"
            - "renewed_count == 1"
            - "severity stays HIGH (merge does not overwrite the original severity)"
            - "exactly one flag row exists for the account: GET /hazard-flags?service_account_id -> total_count == 1"

  - rule_id: compensating_invariant
    instances:
      - name: dispatch_cancel_conserves_technician_commitment_slot
        grounds:
          - state_machines.WorkOrder.OPEN_to_DISPATCHED
          - state_machines.WorkOrder.OPEN_to_CANCELLED
          - validations[priority=17]
        distinguishing_aspect: |
          Conserved quantity 1 of 2 (technician commitment cardinality): dispatch then cancel of a
          work order leaves count(WO with technician == T in {DISPATCHED, IN_PROGRESS}) +
          count(Route with technician == T in {ASSIGNED, IN_PROGRESS}) unchanged at its baseline —
          observable because a FULL-shift route assignment conflicts while the order is dispatched
          and succeeds after the cancel.
        test_recipe:
          setup:
            - "Technician T; account with installed handheld meter; EXCHANGE work order scheduled 2026-08-10 AM; period whose window covers 2026-08-10; route R scheduled 2026-08-10 FULL"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech Twelve" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-9201", service_address: "71 Poplar St", billing_cycle_code: "C21" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-D-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id } }
            - { call: "POST /meters/${meter_id}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /work-orders", payload: { work_order_type: "EXCHANGE", service_account_id: "${acct_id}", meter_id: "${meter_id}", scheduled_date: "2026-08-10", work_shift: "AM" }, as: Dispatcher, captures: { wo_id: $.data.id } }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C21", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-10", read_window_close_date: "2026-08-14", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-10", route_shift: "FULL" }, as: Dispatcher, captures: { route_id: $.data.id } }
          trigger:
            - { call: "POST /work-orders/${wo_id}/dispatch", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher, captures: { err_blocked: $.data.error_id } }
            - { call: "POST /work-orders/${wo_id}/cancel", payload: {}, as: Dispatcher }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
          assert:
            - "while dispatched: error_id == ERR_TECHNICIAN_WINDOW_CONFLICT (FULL overlaps AM)"
            - "after compensating cancel: Route.${route_id}.route_status == ASSIGNED and technician_id == ${tech_id}"
            - "invariant restored: GET /work-orders?technician_id=${tech_id}&work_order_status=DISPATCHED -> total_count == 0"
            - "WorkOrder.${wo_id}.work_order_status == CANCELLED"

      - name: capture_reject_recapture_conserves_stop_partition
        grounds:
          - state_machines.RouteStop.transitions
          - state_machines.MeterRead.PROVISIONAL_to_REJECTED
          - entities.Route.fields.stops_total
        distinguishing_aspect: |
          Conserved quantity 2 of 2 (route stop-partition cardinality, a different type from the
          sibling's commitment cardinality): capture + reject + re-capture moves one stop through
          READ_CAPTURED -> NO_READ_PENDING -> READ_CAPTURED, and at every step
          sum over stop_status counts == stops_total == 3 with the other two stops untouched.
        test_recipe:
          setup:
            - "Three handheld accounts with meters; route IN_PROGRESS with three PENDING stops"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech Thirteen" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-9301", service_address: "81 Poplar St", billing_cycle_code: "C22" }, as: MeterOpsAdmin, captures: { acct_1: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-9302", service_address: "82 Poplar St", billing_cycle_code: "C22" }, as: MeterOpsAdmin, captures: { acct_2: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-9303", service_address: "83 Poplar St", billing_cycle_code: "C22" }, as: MeterOpsAdmin, captures: { acct_3: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-F-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_1: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-F-2", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_2: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-F-3", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_3: $.data.id } }
            - { call: "POST /meters/${meter_1}/install", payload: { service_account_id: "${acct_1}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_2}/install", payload: { service_account_id: "${acct_2}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_3}/install", payload: { service_account_id: "${acct_3}" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C22", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "FULL" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_1: "$.data[0].id", sv_1: "$.data[0].version" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /route-stops/${stop_1}/reads", payload: { meter_id: "${meter_1}", read_value: 100, read_at: "2026-08-03T09:00:00Z", expected_route_stop_version: "${sv_1}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { read_1: $.data.id } }
            - { call: "POST /reads/${read_1}/reject", payload: { rejection_reason: "IMPLAUSIBLE_SPIKE" }, as: BillingLiaison }
            - { call: "GET /route-stops/${stop_1}", payload: {}, as: Dispatcher, captures: { sv_1b: $.data.version } }
            - { call: "POST /route-stops/${stop_1}/reads", payload: { meter_id: "${meter_1}", read_value: 150, read_at: "2026-08-03T10:00:00Z", expected_route_stop_version: "${sv_1b}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { read_2: $.data.id } }
            - { call: "GET /routes/${route_id}", payload: {}, as: Dispatcher, captures: { stops_total: $.data.stops_total, captured: $.data.captured_stop_count } }
          assert:
            - "after reject: RouteStop.${stop_1} was NO_READ_PENDING with no_read_reason READ_REJECTED (version ${sv_1b} == 3)"
            - "MeterRead.${read_1}.read_status == REJECTED and is_billable == false"
            - "after re-capture: MeterRead.${read_2}.read_status == PROVISIONAL and supersedes_read_id == null (rejected reads are not superseded)"
            - "partition conserved: Route.${route_id}.stops_total == 3 (${stops_total}) and captured_stop_count == 1 (${captured})"
            - "status histogram: {READ_CAPTURED: 1, PENDING: 2} sums to stops_total == 3"
