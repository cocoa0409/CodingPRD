          setup:
            - "One LegalAdvocate (Iris Vale) exists with wellness_posture OPEN and no other FILED cases."
            - "Client C-6001 (Priya Nair) exists with no risk assessment, so current_risk_band is null."
            - "ProtectiveOrderCase Q has been filed and denied twice, so status is PETITION_DRAFTED and refile_count is 2."
