            - call: "POST /runbooks/${rb1_id}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /runbook-steps/${e1_id}/validations"
              payload: {}
              as: ITOperator
