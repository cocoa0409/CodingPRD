          - calculations.verification_adequacy_score.variants.REALIZED
          - entities.SupplierFoodPair.fields.adequacy_score_planned
          - entities.SupplierFoodPair.fields.adequacy_score_realized
          - endpoints["POST /fsvp/verification-records/{id}/attestation"]
        distinguishing_aspect: "Dual variant on a different entity domain (SupplierFoodPair plan coverage, not supplier risk): with three APPROVED activities but attested evidence on only the onsite audit, adequacy_score_planned is 61.61 while adequacy_score_realized is 24.64 — a 36.97 gap produced by input-set filtering alone."
        test_recipe:
