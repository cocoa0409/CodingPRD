              as: Distributor
              as_user_id: "${dist_id}"
              captures: { stale2_err: "$.data.error_id" }
            - call: "POST /event-cinema/encore-windows"
              payload: { booking_id: "${b_id}", window_start_utc: "2026-12-10T00:00:00Z", window_end_utc: "2026-12-20T00:00:00Z", standard_ticket_price_cents: 1500, encore_ticket_price_cents: 1000, planned_screen_count: 25, expected_booking_version: "${b_v5}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ew_ok: $.data.status }
          assert:
            - "the booking had advanced past ${b_v4} when the settlement-free confirm ran, so that view is stale"
            - "the stale encore create is refused with 412 — ${stale2_err} == ERR_STALE_VERSION"
            - "the same payload carrying the current version ${b_v5} succeeds — ${ew_ok} == DRAFT"
            - "no window was created by the refused attempt — GET /event-cinema/encore-windows?booking_id=${b_id} returns exactly 1 row"

      - name: booking_version_increments_on_every_accepted_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Booking.fields.version
          - endpoints.POST_/bookings/{id}/counter
          - endpoints.POST_/bookings/{id}/re-propose
        distinguishing_aspect: "The OCC token is advanced by every accepted mutation, including pure negotiation ones: a counter and a re-propose each bump the booking's version by exactly one, so a client must re-read between calls."
        test_recipe:
          setup:
            - "Standard CA fixture; booking submitted into PENDING_APPROVAL with one proposed line."
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
            - *k_booking_draft
            - *k_line_60
            - call: "POST /event-cinema/bookings/${b_id}/submit"
              payload: { expected_booking_version: "${b_v2}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { b_v3: $.data.version }
          trigger:
            - call: "POST /event-cinema/bookings/${b_id}/counter"
              payload: { proposed_guarantee_cents: 1500000, proposed_revenue_share_pct: 0.35, expected_booking_version: "${b_v3}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { v_after_counter: $.data.version }
            - call: "POST /event-cinema/bookings/${b_id}/re-propose"
              payload: { expected_booking_version: "${v_after_counter}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { v_after_repropose: $.data.version }
          assert:
            - "the booking stood at version ${b_v2} before submission and ${b_v3} after it, so submit advanced it by one"
            - "the counter advances the token by exactly one — ${v_after_counter} == ${b_v3} + 1, expressed as an integer field comparison on Booking.${b_id}.version"
            - "the re-propose advances it by one again — ${v_after_repropose} == ${v_after_counter} + 1"
            - "a client reusing ${b_v3} after the counter would be refused 412 ERR_STALE_VERSION"

