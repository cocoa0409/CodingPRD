      - name: agreement_settlement_state_freezes_and_unfreezes_telemetry_and_landowner_drafting
        grounds:
          - validations[priority=43]
          - errors.ERR_AGREEMENT_IN_SETTLEMENT
          - state_machines.ServiceAgreement.ACTIVE_to_IN_SETTLEMENT
          - state_machines.ServiceAgreement.IN_SETTLEMENT_to_SETTLED
          - endpoints.POST_/wind-ops/turbines/{id}/scada-sync
          - endpoints.POST_/wind-ops/farms/{id}/landowner-settlements
        distinguishing_aspect: |
          A single ServiceAgreement row gates two endpoints on two other entities in both
          directions: ACTIVE lets telemetry and landowner drafting through, IN_SETTLEMENT freezes
          both with the same 409, and finalize thaws both again. The gate is farm-scoped rather
          than turbine-scoped, so a turbine that has no fault, no work order and no relationship to
          the agreement other than sharing a farm is frozen too.
        test_recipe:
          setup:
            - "one farm with two ONLINE turbines T1 and T2 and landowner_budget_cap_cents 100000000"
            - "one ACTIVE TIME_BASED ServiceAgreement over 2026-06-01T00:00:00Z to 2026-07-01T00:00:00Z"
            - "the logical clock reads 2026-07-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Prairie Gate", region_code: "ND-S", grid_operator_code: "MISO", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 100000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-02", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t2_id: $.data.id }
            - call: "POST /wind-ops/service-agreements"
              payload: { wind_farm_id: "${farm_id}", guaranteed_availability_pct: 97.0, availability_basis: "TIME_BASED", lda_rate_cents_per_pct_point: 500000, lda_cap_cents: 20000000, period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { sa_id: $.data.id }
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_v1: $.data.version }
          trigger:
            - call: "POST /wind-ops/turbines/${t1_id}/scada-sync"
              payload: { operating_hours_delta: 720, actual_energy_kwh: 1000000, potential_energy_kwh: 1440000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/service-agreements/${sa_id}/settle"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
            - call: "POST /wind-ops/turbines/${t2_id}/scada-sync"
              payload: { operating_hours_delta: 720, actual_energy_kwh: 1400000, potential_energy_kwh: 1440000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_frozen_telemetry: $.data.error_id }
            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-9", royalty_basis: "METERED_ONLY", period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 0, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 0, expected_wind_farm_version: "${farm_v1}" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { err_frozen_settlement: $.data.error_id }
            - call: "POST /wind-ops/service-agreements/${sa_id}/finalize"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
            - call: "POST /wind-ops/turbines/${t2_id}/scada-sync"
              payload: { operating_hours_delta: 720, actual_energy_kwh: 1400000, potential_energy_kwh: 1440000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-9", royalty_basis: "METERED_ONLY", period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 0, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 0, expected_wind_farm_version: "${farm_v1}" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { s_ok_id: $.data.id }
          assert:
            - "the first scada-sync returns HTTP 200 while the agreement is ACTIVE, leaving Turbine.${t1_id}.period_actual_energy_kwh == 1000000"
            - "the settle call returns HTTP 200 with ServiceAgreement.${sa_id}.state == IN_SETTLEMENT, time_based_availability_pct == 100.0000 and energy_based_availability_pct == 69.4444"
            - "the frozen scada-sync returns HTTP 409 with ${err_frozen_telemetry} == ERR_AGREEMENT_IN_SETTLEMENT, on a turbine the agreement never mentions"
            - "Turbine.${t2_id}.period_actual_energy_kwh is still 0 after the refusal, proving the freeze is enforced before any counter is written"
            - "the frozen settlement create returns HTTP 409 with ${err_frozen_settlement} == ERR_AGREEMENT_IN_SETTLEMENT and WindFarm.${farm_id}.version is unchanged"
            - "after finalize, ServiceAgreement.${sa_id}.state == SETTLED with at_risk_flag false and the settled availability figures frozen"
            - "the thawed scada-sync returns HTTP 200 and Turbine.${t2_id}.period_actual_energy_kwh == 1400000"
            - "the thawed settlement create returns HTTP 201 with LandownerSettlement.${s_ok_id}.state == DRAFT and payment_cents 576000, computed from the now-visible 2400000 metered kWh"

  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_occupancy_is_half_open_so_exact_adjacency_schedules_but_a_one_minute_overlap_is_refused
        grounds:
          - validations[priority=62]
          - validations[priority=64]
          - endpoints.POST_/wind-ops/work-orders/{id}/schedule
          - state_machines.WorkOrder.SUBMITTED_to_SCHEDULED
          - entities.WorkOrder.fields.planned_start_utc
          - entities.WorkOrder.fields.planned_end_utc
          - entities.WeatherWindow.fields.active_work_order_count
        distinguishing_aspect: |
          One crew is loaded with four back-to-back orders inside a single CONFIRMED weather
          window. Because crew occupancy is half-open, an order whose planned_start_utc equals
          another order's planned_end_utc is accepted on BOTH edges (10:00 after a 06:00-10:00
          order, and 04:00-06:00 before it), while an interval that overlaps by a single minute
          (13:59) and an interval fully contained inside an existing one (09:00-09:30) are both
          refused with the same ERR_CREW_WINDOW_CONFLICT. The refusals must leave no residue:
          the rejected order stays SUBMITTED with crew_id null and the window's
          active_work_order_count still counts only the successful schedules.
        test_recipe:
          setup:
            - "one farm with four ONLINE turbines and a single crew holding GWO_BASIC and CRANE_BANKSMAN, max_work_wind_speed_ms 14.0 and daily_hours_capacity 40"
            - "one CONFIRMED weather window covering the whole UTC day 2026-08-10, forecast_wind_speed_ms 8.0 so the crew wind limit is never the binding rule"
            - "four SUBMITTED MAJOR_COMPONENT orders, one per turbine, each estimated_hours 6 so four schedules total 24 hours against a 40 hour capacity and validation 72 never fires"
