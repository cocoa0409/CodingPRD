              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools LLC", permit_number: "P-2710-P8", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Hardware Retail 2026", industry_naics_code: "444140", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_id: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "DESK", scope_period_start: "2026-01-01", scope_period_end: "2026-06-30" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { av1: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_id}", expected_audit_version: "${av1}", methodology: "RATIO_ESTIMATION", confidence_level_bp: 9500, minimum_sample_size: 1, strata: [ { period_start: "2026-01-01", period_end: "2026-07-01", population_base_amount_cents: 10000000, population_unit_count: 100 } ] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /sampling-agreements/${agr_id}/agree"
              payload: { agreed_by_name: "R. Vance" }
              as: Taxpayer
              as_user_id: "${te_id}"
            - call: "POST /use-tax-purchases"
              payload: { audit_id: "${audit_id}", vendor_name: "Cascade Machine Co", invoice_date: "2026-02-10", purchase_price_cents: 4000000, asset_class: "CONSUMABLE", in_state_usage_pct_bp: 5000 }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { pur_id: "$.data.id" }
            - call: "POST /exemption-certificates"
              payload: { audit_id: "${audit_id}", purchaser_name: "Basin Resale Inc", purchaser_permit_number: "R-88120", claimed_exemption_type: "RESALE", covered_sale_amount_cents: 2000000, received_before_sale: true, form_complete: false, claimed_exemption_matches_purchaser_business: true }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { cert_id: "$.data.id" }
          trigger:
            - call: "POST /use-tax-purchases/${pur_id}/reclassify"
              payload: { asset_class: "CAPITAL_ASSET", in_state_usage_pct_bp: 7500, first_use_outside_state: true, months_used_outside_state: 8, tax_paid_other_state_cents: 200000 }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { denied: "$.data.error_id" }
            - call: "POST /use-tax-purchases/${pur_id}/reclassify"
              payload: { asset_class: "CAPITAL_ASSET", in_state_usage_pct_bp: 7500, first_use_outside_state: true, months_used_outside_state: 8, fair_market_value_at_entry_cents: 6000000, tax_paid_other_state_cents: 200000 }
              as: FieldAuditor
