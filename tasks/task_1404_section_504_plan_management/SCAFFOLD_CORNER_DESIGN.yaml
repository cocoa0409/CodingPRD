scaffold_corner_design:
- section: entities
  instances:
  - name: school_creation_success_returns_201_and_defaults
    claim_type: creation
    grounds:
    - entities.School
    - endpoints[POST /schools]
    distinguishing_aspect: POST /schools with all required fields returns 201 and
      applies default school_posture=OPERATIONAL
    test_recipe:
      setup:
      - Empty DB; bootstrap director X-User-ID accepted
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: District504Director
        as_user_id: bootstrap-director
      trigger:
      - call: POST /schools
        payload:
          school_name: New School
          district_code: D-NEW
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      assert:
      - Response code == 201
      - School.${school_id}.school_posture == OPERATIONAL (default applied)
      - School.${school_id}.id is a UUID (server-minted)
      - School.${school_id}.version == 1
  - name: school_retrieval_returns_stored_fields
    claim_type: retrieval
    grounds:
    - entities.School
    - endpoints[GET /schools/{schoolId}]
    distinguishing_aspect: GET /schools/{id} returns the entity with all input fields
      preserved
    test_recipe:
      setup:
      - School created
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: Stored Fields High
          district_code: D-SF
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      trigger:
      - call: GET /schools/${school_id}
        payload: {}
        as: District504Director
        as_user_id: bootstrap-director
      assert:
      - School.school_name == 'Stored Fields High'
      - School.district_code == 'D-SF'
      - School.current_academic_year == '2026-2027'
  - name: school_listing_supports_pagination
    claim_type: listing
    grounds:
    - entities.School
    - endpoints[GET /schools]
    - response_envelope
    distinguishing_aspect: GET /schools with limit=1 returns at most 1 entry, has_more=true
      if more exist, and total_count reflects full set
    test_recipe:
      setup:
      - Two schools exist
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: P1
          district_code: D-P1
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
      - call: POST /schools
        payload:
          school_name: P2
          district_code: D-P2
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
      trigger:
      - call: GET /schools?limit=1&offset=0
        payload: {}
        as: District504Director
        as_user_id: bootstrap-director
      assert:
      - Response envelope data array length <= 1
      - Response envelope pagination field total_count >= 2 (top-level pagination_fields
        per §1.0)
      - Response envelope pagination field has_more == true
  - name: student_get_non_existent_returns_404
    claim_type: not_found
    grounds:
    - entities.Student
    - endpoints[GET /students/{studentId}]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET /students/{non-existent-uuid} returns 404 with ERR_NOT_FOUND
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /students/00000000-0000-0000-0000-000000000000
        payload: {}
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND
      - HTTP status == 404
  - name: student_create_missing_required_returns_400
    claim_type: required_fields
    grounds:
    - entities.Student
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /students missing required full_name → 400 ERR_INVALID_REQUEST
    test_recipe:
      setup:
      - School exists
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      trigger:
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: someone
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
      - HTTP status == 400
  - name: staff_member_default_is_active_true
    claim_type: defaults
    grounds:
    - entities.StaffMember.fields.is_active
    distinguishing_aspect: POST /staff-members without is_active applies default true
    test_recipe:
      setup:
      - School exists
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      trigger:
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: X
          full_name: X
          staff_role: TEACHER
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          staff_id: $.data.id
      assert:
      - StaffMember.${staff_id}.is_active == true (default applied)
  - name: staff_member_computed_current_training_status
    claim_type: computed_fields
    grounds:
    - entities.StaffMember.fields.current_training_status
    distinguishing_aspect: 'StaffMember.current_training_status is derived: UNTRAINED
      initially; TRAINED_CURRENT after POST /training-records; input value ignored
      on create'
    test_recipe:
      setup:
      - School exists; staff created without training
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: X
          full_name: X
          staff_role: TEACHER
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          staff_id: $.data.id
      trigger:
      - call: GET /staff-members/${staff_id}
        payload: {}
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          pre: $.data.current_training_status
      - call: POST /training-records
        payload:
          staff_id: ${staff_id}
          training_topic: SECTION_504_BASICS
          trained_at: '2026-01-01T00:00:00Z'
        as: District504Director
        as_user_id: bootstrap-director
      - call: GET /staff-members/${staff_id}
        payload: {}
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          post: $.data.current_training_status
      assert:
      - pre == UNTRAINED
      - post == TRAINED_CURRENT
  - name: student_invalid_grade_level_out_of_range
    claim_type: type_constraints
    grounds:
    - entities.Student.fields.grade_level
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: grade_level outside 0..12 rejected
    test_recipe:
      setup:
      - School exists
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      trigger:
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 99
        as: Section504Coordinator
        as_user_id: someone
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
  - name: student_invalid_enum_suspected_disability
    claim_type: type_constraints
    grounds:
    - entities.Section504Referral.fields.suspected_disability_category
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Invalid enum value on referral submission rejected
    test_recipe:
      setup:
      - School + student exist
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_id: $.data.id
      trigger:
      - call: POST /referrals
        payload:
          student_id: ${stu_id}
          referral_reason: r
          suspected_disability_category: INVALID_ENUM
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
  - name: audit_event_immutable_no_update_endpoint
    claim_type: immutability
    grounds:
    - entities.ComplianceAuditEvent
    distinguishing_aspect: ComplianceAuditEvent has common_fields=false and no update/delete
      endpoints — append-only
    test_recipe:
      setup:
      - School exists with one event
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      trigger:
      - call: GET /audit-events?school_id=${school_id}
        payload: {}
        as: District504Director
        as_user_id: bootstrap-director
      assert:
      - Response is a list; no PUT/PATCH/DELETE endpoint exists for /audit-events
  - name: referral_fk_student_must_exist
    claim_type: parent_relationships
    grounds:
    - entities.Section504Referral.fields.student_id
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: POST /referrals with non-existent student_id → 404
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /referrals
        payload:
          student_id: 00000000-0000-0000-0000-000000000000
          referral_reason: r
          suspected_disability_category: LEARNING
        as: Teacher
        as_user_id: someone
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND
- section: state_machines
  instances:
  - name: referral_starts_in_pending
    claim_type: initial_state
    grounds:
    - state_machines.Section504Referral
    distinguishing_aspect: Newly created referral has referral_status == PENDING
    test_recipe:
      setup:
      - School + student + staff
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_id: $.data.id
      trigger:
      - call: POST /referrals
        payload:
          student_id: ${stu_id}
          referral_reason: r
          suspected_disability_category: LEARNING
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          ref_status: $.data.referral_status
      assert:
      - ref_status == PENDING
  - name: referral_start_review_twice_rejected
    claim_type: idempotency
    grounds:
    - state_machines.Section504Referral.PENDING_to_UNDER_REVIEW
    - errors[ERR_REFERRAL_NOT_PENDING]
    distinguishing_aspect: Calling start-review twice — second call sees referral
      already in UNDER_REVIEW and is rejected
    test_recipe:
      setup:
      - Referral in PENDING
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_id: $.data.id
      - call: POST /referrals
        payload:
          student_id: ${stu_id}
          referral_reason: r
          suspected_disability_category: LEARNING
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          ref_id: $.data.id
      trigger:
      - call: POST /referrals/${ref_id}/start-review
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /referrals/${ref_id}/start-review
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_REFERRAL_NOT_PENDING
  - name: referral_terminal_state_lockdown_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Section504Referral
    distinguishing_aspect: A REJECTED referral cannot be withdrawn (terminal state)
    test_recipe:
      setup:
      - Referral moved to REJECTED
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_id: $.data.id
      - call: POST /referrals
        payload:
          student_id: ${stu_id}
          referral_reason: r
          suspected_disability_category: LEARNING
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          ref_id: $.data.id
      - call: POST /referrals/${ref_id}/start-review
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /referrals/${ref_id}/reject
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      trigger:
      - call: POST /referrals/${ref_id}/withdraw
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_REFERRAL_NOT_WITHDRAWABLE
  - name: plan_submit_for_consent_without_accommodations_rejected
    claim_type: precondition_enforcement
    grounds:
    - validations[priority=16]
    - errors[ERR_PLAN_HAS_NO_ACCOMMODATIONS]
    distinguishing_aspect: Plan with 0 accommodations cannot be submitted for consent
    test_recipe:
      setup:
      - Plan in DRAFT with no accommodations
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2025-12-15T00:00:00Z'
        as: District504Director
        as_user_id: bootstrap-director
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: T
          full_name: T
          staff_role: TEACHER
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          t1_id: $.data.id
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_id: $.data.id
      - call: POST /referrals
        payload:
          student_id: ${stu_id}
          referral_reason: r
          suspected_disability_category: LEARNING
        as: Teacher
        as_user_id: ${t1_id}
        captures:
          ref_id: $.data.id
      - call: POST /referrals/${ref_id}/start-review
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /referrals/${ref_id}/initiate-evaluation
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          eval_id: $.data.id
      - call: POST /evaluations/${eval_id}/request-consent
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /evaluations/${eval_id}/record-consent
        payload:
          granted: true
          responded_by_parent_ref: p
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /evaluations/${eval_id}/start
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: POST /evaluations/${eval_id}/determine
        payload:
          determination_outcome: ELIGIBLE
          disability_impairment_found: true
          major_life_activity_affected: true
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: GET /students/${stu_id}
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_v: $.data.version
      - call: POST /plans
        payload:
          student_id: ${stu_id}
          evaluation_id: ${eval_id}
          expected_student_version: ${stu_v}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          plan_id: $.data.id
          plan_v: $.data.version
      trigger:
      - call: POST /plans/${plan_id}/submit-for-consent
        payload:
          expected_plan_version: ${plan_v}
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_PLAN_HAS_NO_ACCOMMODATIONS
  - name: grievance_terminal_lockdown_resolved
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Grievance
    distinguishing_aspect: A RESOLVED grievance cannot be escalated to OCR (terminal
      state)
    test_recipe:
      setup:
      - Grievance resolved
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: DIR
          full_name: DIR
          staff_role: DISTRICT_DIRECTOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          dir_id: $.data.id
      - call: POST /students
        payload:
          school_id: ${school_id}
          student_external_ref: X
          full_name: X
          date_of_birth: '2012-01-01T00:00:00Z'
          grade_level: 8
        as: Section504Coordinator
        as_user_id: ${co_id}
        captures:
          stu_id: $.data.id
      - call: POST /grievances
        payload:
          student_id: ${stu_id}
          grievance_category: OTHER
          description: G
          filed_by_parent_ref: p
        as: Parent
        captures:
          griev_id: $.data.id
      - call: POST /grievances/${griev_id}/begin-informal
        payload: {}
        as: Section504Coordinator
        as_user_id: ${co_id}
      - call: GET /grievances/${griev_id}
        payload: {}
        as: District504Director
        as_user_id: ${dir_id}
        captures:
          gv: $.data.version
      - call: POST /grievances/${griev_id}/resolve
        payload:
          expected_grievance_version: ${gv}
        as: District504Director
        as_user_id: ${dir_id}
      trigger:
      - call: POST /grievances/${griev_id}/escalate-to-ocr
        payload: {}
        as: District504Director
        as_user_id: ${dir_id}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_GRIEVANCE_NOT_FORMAL (RESOLVED is terminal; cannot escalate)
- section: calculations
  instances:
  - name: posture_derivation_grievance_weight_boundary
    claim_type: correct_result
    grounds:
    - calculations.school_posture_derivation
    - entities.School.fields.school_posture
    distinguishing_aspect: Single open grievance (20) keeps posture OPERATIONAL; adding
      second (40) flips to PROBATION; posture check uses composite threshold boundaries
    test_recipe:
      setup:
      - School with no grievances; student STU
      setup_api_calls:
      - call: POST /schools
        payload:
          school_name: S
          district_code: D
          current_academic_year: 2026-2027
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          school_id: $.data.id
      - call: POST /staff-members
        payload:
          school_id: ${school_id}
          staff_external_ref: C
          full_name: C
          staff_role: COORDINATOR
        as: District504Director
        as_user_id: bootstrap-director
        captures:
          co_id: $.data.id
      - call: POST /students
        payload:
