scenario: |
  Teacher Certification & Licensure (state agency): application intake & credential pathway determination, transcript/coursework evaluation & test score verification, background check & moral character review, reciprocity with other states & deficiency plan, license issuance/renewal & continuing-education credit audit, endorsement addition & emergency permit, misconduct investigation & license discipline, educator-preparation program approval

domain_name: teacher-certification-licensure
api_prefix: /licensure

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, scheduled_actions]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant legal full name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across applicants" }
      - { name: date_of_birth, type: datetime, source: input, description: "Date of birth (ISO8601)" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 digits of SSN; exactly 4 digits" }
      - { name: moral_character_attestation, type: boolean, source: input, description: "Applicant attestation of moral character; required true to advance past SUBMITTED" }
      - { name: status, type: enum, source: system, description: "REGISTERED | APPLICATION_IN_PROGRESS | LICENSED | BARRED" }

  - name: EducatorPrepProgram
    parent: null
    common_fields: true
    fields:
      - { name: institution_name, type: string, source: input, description: "Offering institution name" }
      - { name: program_code, type: string, source: input, description: "Unique program code" }
      - { name: approved_subject_areas, type: array, source: input, description: "Enum list of subject_area values the program covers" }
      - { name: approval_status, type: enum, source: system, description: "CANDIDATE | UNDER_REVIEW | APPROVED | PROBATION | APPROVAL_WITHDRAWN" }

  - name: CredentialApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; owning applicant" }
      - { name: pathway, type: enum, source: input, description: "TRADITIONAL | ALTERNATIVE | RECIPROCITY | REINSTATEMENT" }
      - { name: subject_area, type: enum, source: input, description: "ELEMENTARY | MATHEMATICS | SCIENCE | SPECIAL_EDUCATION" }
      - { name: grade_band, type: enum, source: input, description: "PK_6 | G5_8 | G7_12" }
      - { name: program_id, type: string, source: input, description: "FK -> EducatorPrepProgram.id; required when pathway=TRADITIONAL, forbidden otherwise" }
      - { name: expedite_requested, type: boolean, source: input, description: "Request expedited handling; adds 20% surcharge", default: false }
      - { name: fee_cents, type: integer, source: computed, description: "Computed by application_fee; recomputed on transcript add and expedite flag" }
      - { name: fee_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | INTAKE_REVIEW | EVALUATION | DEFICIENCY_PENDING | BACKGROUND_REVIEW | PENDING_DECISION | APPROVED | DENIED | WITHDRAWN" }
      - { name: deficiency_hours_required, type: integer, source: computed, description: "Computed by deficiency_credit_computation; 0 when no deficiency" }

  - name: Transcript
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CredentialApplication.id; application this transcript supports" }
      - { name: institution_name, type: string, source: input, description: "Granting institution" }
      - { name: degree_level, type: enum, source: input, description: "BACHELORS | MASTERS | DOCTORATE" }
      - { name: total_semester_hours, type: number, source: input, description: "Total semester credit hours on transcript" }
      - { name: courses, type: array, source: input, description: "List of {course_code, credit_hours, letter_grade}; letter_grade in A|A_MINUS|B|C|D|F" }
      - { name: scaled_gpa, type: number, source: computed, description: "Computed by coursework_gpa_scaling at verification" }
      - { name: subject_relevant_hours, type: number, source: input, description: "Subject-area hours attested by evaluator at verification" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | REJECTED" }

  - name: TestScore
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CredentialApplication.id" }
      - { name: exam_code, type: enum, source: input, description: "PRAXIS_CORE | PRAXIS_SUBJECT | PEDAGOGY" }
      - { name: raw_score, type: integer, source: input, description: "Raw exam score, integer 0..100" }
      - { name: scaled_score, type: integer, source: computed, description: "Computed by test_score_scaling at verification" }
      - { name: passing, type: boolean, source: computed, description: "scaled_score >= passing threshold for exam_code" }
      - { name: tested_on, type: datetime, source: input, description: "Exam administration date" }
      - { name: verification_status, type: enum, source: system, description: "REPORTED | VERIFIED | REJECTED" }

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CredentialApplication.id" }
      - { name: adverse_findings, type: array, source: input, description: "List of {offense_category, offense_date, disposition}; offense_category in FELONY_VIOLENT|FELONY_OTHER|MISDEMEANOR_DRUG|MISDEMEANOR_OTHER|INFRACTION; disposition in CONVICTION|DISMISSED|PENDING" }
      - { name: fingerprint_submitted_at, type: datetime, source: input, description: "Timestamp fingerprints were taken; set on PRINTS_SUBMITTED" }
      - { name: risk_score, type: number, source: computed, description: "Computed by background_risk_score when prints submitted" }
      - { name: status, type: enum, source: system, description: "INITIATED | PRINTS_SUBMITTED | CLEARED | FLAGGED | ADJUDICATION | DENIED" }

  - name: ReciprocityEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CredentialApplication.id; only for pathway=RECIPROCITY" }
      - { name: source_state, type: string, source: input, description: "Two-letter state code of the out-of-state license" }
      - { name: source_license_type, type: enum, source: input, description: "STANDARD | PROFESSIONAL | PROVISIONAL" }
      - { name: years_teaching, type: integer, source: input, description: "Verified years of out-of-state teaching" }
      - { name: mapping_mode, type: enum, source: system, description: "DETERMINISTIC | COMMITTEE; set at finalize" }
      - { name: outcome, type: enum, source: system, description: "FULL | PARTIAL | DENIED; null until finalized" }
      - { name: deficiency_subject_hours, type: integer, source: computed, description: "Subject-hour deficiency produced by reciprocity_equivalency_mapping" }
      - { name: finalized, type: boolean, source: system, description: "True once finalize has run", default: false }

  - name: DeficiencyPlan
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CredentialApplication.id" }
      - { name: required_hours, type: integer, source: computed, description: "Snapshot of application.deficiency_hours_required at plan creation" }
      - { name: completed_hours, type: integer, source: computed, description: "Sum of posted evidence hours" }
      - { name: deadline, type: datetime, source: system, description: "created clock time + 730 days; +365 more on EXTENDED" }
      - { name: extension_used, type: boolean, source: system, description: "True after DEFAULTED->EXTENDED", default: false }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | IN_PROGRESS | COMPLETED | DEFAULTED | EXTENDED | SUPERSEDED" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CredentialApplication.id; originating application" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id" }
      - { name: license_number, type: string, source: system, description: "Server-minted sequential license number; identity only" }
      - { name: subject_area, type: enum, source: system, description: "Copied from application" }
      - { name: grade_band, type: enum, source: system, description: "Copied from application" }
      - { name: issued_on, type: datetime, source: system, description: "Clock time at issuance" }
      - { name: expires_on, type: datetime, source: system, description: "issued_on + 60 months; +60 months on each renew" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | SUSPENDED | REVOKED | SURRENDERED" }

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id" }
      - { name: subject_area, type: enum, source: input, description: "Endorsement subject; must differ from license.subject_area and from any ACTIVE/PENDING_EVALUATION endorsement on the license" }
      - { name: grade_band, type: enum, source: input, description: "PK_6 | G5_8 | G7_12" }
      - { name: status, type: enum, source: system, description: "PENDING_EVALUATION | ACTIVE | DENIED | REMOVED | REVOKED" }

  - name: EmergencyPermit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> CredentialApplication.id" }
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; copied from application" }
      - { name: district_code, type: string, source: input, description: "Employing district code" }
      - { name: valid_from, type: datetime, source: input, description: "Permit validity start (half-open interval start)" }
      - { name: valid_until, type: datetime, source: input, description: "Permit validity end (exclusive); valid_until - valid_from <= 365 days" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | EXPIRED | CONVERTED | REVOKED" }

  - name: CECredit
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id" }
      - { name: provider_name, type: string, source: input, description: "CE provider" }
      - { name: category, type: enum, source: input, description: "PEDAGOGY | CONTENT | ETHICS | TECHNOLOGY" }
      - { name: hours, type: number, source: input, description: "Credit hours; > 0" }
      - { name: earned_on, type: datetime, source: input, description: "Completion date" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | VOIDED" }

  - name: CEAudit
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id" }
      - { name: audit_variant, type: enum, source: input, description: "STANDARD | RESTORATION" }
      - { name: cycle_start, type: datetime, source: system, description: "Start of audited CE cycle (= license.issued_on of current term)" }
      - { name: cycle_end, type: datetime, source: system, description: "End of audited CE cycle (= license.expires_on)" }
      - { name: required_hours, type: integer, source: computed, description: "60 STANDARD | 90 RESTORATION" }
      - { name: verified_hours, type: number, source: computed, description: "Computed by ce_credit_audit_total at latest determination" }
      - { name: status, type: enum, source: system, description: "INITIATED | UNDER_REVIEW | PASSED | FAILED | REMEDIATION" }

  - name: MisconductCase
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id" }
      - { name: allegation_category, type: enum, source: input, description: "BOUNDARY_VIOLATION | FINANCIAL_MISCONDUCT | INCOMPETENCE | CRIMINAL_CONDUCT" }
      - { name: investigator_user_id, type: string, source: system, description: "X-User-ID recorded on OPENED->INVESTIGATING" }
      - { name: finding, type: enum, source: input, description: "SUBSTANTIATED | UNSUBSTANTIATED; required on HEARING->ADJUDICATED" }
      - { name: status, type: enum, source: system, description: "OPENED | INVESTIGATING | HEARING | ADJUDICATED | SANCTION_ISSUED | DISMISSED" }

  - name: DisciplinaryAction
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> MisconductCase.id" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; copied from case" }
      - { name: sanction_type, type: enum, source: input, description: "REPRIMAND | SUSPENSION | REVOCATION | FINE" }
      - { name: suspension_start, type: datetime, source: input, description: "Closed interval start; required iff sanction_type=SUSPENSION" }
      - { name: suspension_end, type: datetime, source: input, description: "Closed interval end (inclusive); required iff sanction_type=SUSPENSION" }
      - { name: fine_cents, type: integer, source: input, description: "Required iff sanction_type=FINE" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ISSUED | SERVED | VACATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CredentialApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: INTAKE_REVIEW
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: IntakeOfficer
        preconditions:
          - "fee_status == PAID (else ERR_FEE_UNPAID)"
          - "applicant.moral_character_attestation == true (else ERR_MORAL_ATTESTATION_REQUIRED)"
          - "applicant.status != BARRED (else ERR_APPLICANT_BARRED)"
        side_effects: ["increments CredentialApplication.version by 1"]
      - from: INTAKE_REVIEW
        to: EVALUATION
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: IntakeOfficer
        preconditions:
          - "pathway == TRADITIONAL requires program_id present (else ERR_PATHWAY_PROGRAM_REQUIRED) and program.approval_status == APPROVED and subject_area in program.approved_subject_areas (else ERR_PROGRAM_NOT_APPROVED)"
          - "pathway == RECIPROCITY requires a finalized ReciprocityEvaluation with outcome != DENIED (else ERR_RECIPROCITY_NOT_FINALIZED)"
        side_effects:
          - "recompute deficiency_hours_required via deficiency_credit_computation"
          - "increments CredentialApplication.version by 1"
      - from: EVALUATION
        to: DEFICIENCY_PENDING
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: CredentialEvaluator
        preconditions: ["deficiency_hours_required > 0 (else ERR_DEFICIENCY_NOT_PRESENT)"]
        side_effects: ["increments CredentialApplication.version by 1"]
      - from: DEFICIENCY_PENDING
        to: EVALUATION
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: CredentialEvaluator
        preconditions: ["a DeficiencyPlan for this application has status == COMPLETED (else ERR_DEFICIENCY_OUTSTANDING)"]
        side_effects:
          - "deficiency_hours_required := 0 (plan satisfied)"
          - "increments CredentialApplication.version by 1"
        note: "cycle EVALUATION -> DEFICIENCY_PENDING -> EVALUATION may repeat"
      - from: EVALUATION
        to: BACKGROUND_REVIEW
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: CredentialEvaluator
        preconditions:
          - "deficiency_hours_required == 0 (else ERR_DEFICIENCY_OUTSTANDING)"
          - "at least one Transcript and every Transcript has verification_status == VERIFIED (else ERR_TRANSCRIPTS_UNVERIFIED)"
          - "every exam in required_exams(pathway, reciprocity outcome) has a VERIFIED TestScore with passing == true (else ERR_EXAM_REQUIREMENT_UNMET)"
          - "a BackgroundCheck exists for the application with status != DENIED (else ERR_BACKGROUND_NOT_CLEARED)"
        side_effects: ["increments CredentialApplication.version by 1"]
      - from: BACKGROUND_REVIEW
        to: PENDING_DECISION
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: BackgroundInvestigator
        preconditions: ["the application's BackgroundCheck has status == CLEARED (else ERR_BACKGROUND_NOT_CLEARED)"]
        side_effects: ["increments CredentialApplication.version by 1"]
      - from: PENDING_DECISION
        to: APPROVED
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects:
          - "create License (status ACTIVE, issued_on = clock now, expires_on = now + 60 months, subject_area/grade_band copied, applicant_id copied)"
          - "applicant.status := LICENSED"
          - "every EmergencyPermit of this application in ISSUED or ACTIVE -> CONVERTED"
          - "increments CredentialApplication.version by 1"
      - from: PENDING_DECISION
        to: DENIED
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects:
          - "every EmergencyPermit of this application in ISSUED or ACTIVE -> REVOKED"
          - "increments CredentialApplication.version by 1"
      - from: BACKGROUND_REVIEW
        to: DENIED
        trigger: "system cascade: application's BackgroundCheck transitions ADJUDICATION -> DENIED"
        actor: system
        preconditions: []
        side_effects:
          - "every EmergencyPermit of this application in ISSUED or ACTIVE -> REVOKED"
          - "increments CredentialApplication.version by 1"
      - from: EVALUATION
        to: DEFICIENCY_PENDING
        trigger: "system cascade: application's EducatorPrepProgram transitions PROBATION -> APPROVAL_WITHDRAWN while pathway == TRADITIONAL and program_id matches"
        actor: system
        preconditions: []
        side_effects:
          - "deficiency_hours_required := min(30, deficiency_hours_required + 12)"
          - "increments CredentialApplication.version by 1"
        note: "forced re-entry into deficiency; cascade from program withdrawal"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: Applicant
        preconditions: ["acting applicant owns the application"]
        side_effects: ["fee_status := REFUNDED if it was PAID", "increments CredentialApplication.version by 1"]
      - from: INTAKE_REVIEW
        to: WITHDRAWN
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: Applicant
        preconditions: ["acting applicant owns the application"]
        side_effects: ["fee_status := REFUNDED if it was PAID", "increments CredentialApplication.version by 1"]
      - from: EVALUATION
        to: WITHDRAWN
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: Applicant
        preconditions: ["acting applicant owns the application"]
        side_effects:
          - "fee_status := REFUNDED if it was PAID"
          - "every EmergencyPermit of this application in ISSUED or ACTIVE -> REVOKED"
          - "every DeficiencyPlan of this application in PROPOSED, ACCEPTED, IN_PROGRESS, or EXTENDED -> SUPERSEDED"
          - "increments CredentialApplication.version by 1"
      - from: DEFICIENCY_PENDING
        to: WITHDRAWN
        trigger: "POST /licensure/applications/{applicationId}/state"
        actor: Applicant
        preconditions: ["acting applicant owns the application"]
        side_effects:
          - "fee_status := REFUNDED if it was PAID"
          - "every EmergencyPermit of this application in ISSUED or ACTIVE -> REVOKED"
          - "every DeficiencyPlan of this application in PROPOSED, ACCEPTED, IN_PROGRESS, or EXTENDED -> SUPERSEDED"
          - "increments CredentialApplication.version by 1"

  - entity: BackgroundCheck
    initial_state: INITIATED
    terminal_states: [CLEARED, DENIED]
    transitions:
      - from: INITIATED
        to: PRINTS_SUBMITTED
        trigger: "POST /licensure/background-checks/{checkId}/state"
        actor: BackgroundInvestigator
        preconditions: ["fingerprint_submitted_at present in request (else ERR_VALIDATION)"]
        side_effects:
          - "compute risk_score via background_risk_score (ages measured at fingerprint_submitted_at)"
          - "if risk_score < 40 and no forced-flag disqualifier: status continues to CLEARED; else status continues to FLAGGED"
        note: "PRINTS_SUBMITTED is transient; the request lands in CLEARED or FLAGGED"
      - from: FLAGGED
        to: ADJUDICATION
        trigger: "POST /licensure/background-checks/{checkId}/state"
        actor: LegalOfficer
        preconditions: []
        side_effects: []
      - from: ADJUDICATION
        to: CLEARED
        trigger: "POST /licensure/background-checks/{checkId}/state"
        actor: LegalOfficer
        preconditions: []
        side_effects: []
      - from: ADJUDICATION
        to: DENIED
        trigger: "POST /licensure/background-checks/{checkId}/state"
        actor: LegalOfficer
        preconditions: []
        side_effects:
          - "the linked CredentialApplication, if in BACKGROUND_REVIEW, transitions to DENIED (cascade link 1)"
          - "that DENIED transition then revokes the application's ISSUED/ACTIVE EmergencyPermits (cascade link 2)"

  - entity: DeficiencyPlan
    initial_state: PROPOSED
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /licensure/deficiency-plans/{planId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system cascade: a new DeficiencyPlan is created for the same application"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "system: first POST /licensure/deficiency-plans/{planId}/evidence"
        actor: system
        preconditions: []
        side_effects: ["completed_hours += posted hours"]
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /licensure/deficiency-plans/{planId}/evidence"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: ["completed_hours += posted hours; if completed_hours >= required_hours, status continues to COMPLETED"]
      - from: EXTENDED
        to: IN_PROGRESS
        trigger: "POST /licensure/deficiency-plans/{planId}/evidence"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: ["completed_hours += posted hours"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system: evidence post makes completed_hours >= required_hours"
        actor: system
        preconditions: []
        side_effects: ["linked application becomes eligible for DEFICIENCY_PENDING -> EVALUATION"]
      - from: IN_PROGRESS
        to: DEFAULTED
        trigger: "system sweep on POST /_clock/set_current_utc: clock now > deadline and completed_hours < required_hours"
        actor: system
        preconditions: []
        side_effects:
          - "if extension_used == true: linked CredentialApplication in DEFICIENCY_PENDING transitions to DENIED"
      - from: DEFAULTED
        to: EXTENDED
        trigger: "POST /licensure/deficiency-plans/{planId}/state"
        actor: CredentialEvaluator
        preconditions: ["extension_used == false (else ERR_PLAN_DEADLINE_PASSED)"]
        side_effects: ["extension_used := true", "deadline += 365 days"]

  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED, SURRENDERED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /licensure/licenses/{licenseId}/renew"
        actor: Applicant
        preconditions:
          - "clock now in [expires_on - 180 days, expires_on) (else ERR_RENEWAL_WINDOW_CLOSED)"
          - "a CEAudit for this license with audit_variant == STANDARD and status == PASSED exists for the current cycle (else ERR_AUDIT_NOT_PASSED)"
          - "no MisconductCase for this license in OPENED, INVESTIGATING, or HEARING (else ERR_OPEN_MISCONDUCT_CASE)"
        side_effects: ["expires_on += 60 months", "increments License.version by 1"]
        note: "self-loop renewal extends the term"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep on POST /_clock/set_current_utc: clock now >= expires_on"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /licensure/licenses/{licenseId}/reinstate"
        actor: Applicant
        preconditions:
          - "clock now <= expires_on + 730 days (else ERR_REINSTATE_GRACE_EXPIRED)"
          - "a CEAudit for this license with audit_variant == RESTORATION and status == PASSED exists (else ERR_AUDIT_NOT_PASSED)"
          - "pays_amount_cents == reinstatement_fee(days_overdue) (else ERR_FEE_AMOUNT_MISMATCH)"
        side_effects: ["expires_on := clock now + 60 months", "increments License.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: a DisciplinaryAction with sanction_type=SUSPENSION on this license transitions PROPOSED -> ISSUED"
        actor: system
        preconditions: []
        side_effects: ["increments License.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: all ISSUED SUSPENSION actions on this license have reached SERVED (clock >= suspension_end)"
        actor: system
        preconditions: []
        side_effects: ["increments License.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade: a DisciplinaryAction with sanction_type=REVOCATION transitions PROPOSED -> ISSUED"
        actor: system
        preconditions: []
        side_effects:
          - "applicant.status := BARRED (cascade link 2)"
          - "every Endorsement of this license in PENDING_EVALUATION or ACTIVE -> REVOKED (cascade link 2)"
          - "applicant becoming BARRED revokes every EmergencyPermit of that applicant in ISSUED or ACTIVE (cascade link 3)"
          - "increments License.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system cascade: REVOCATION action ISSUED while license suspended"
        actor: system
        preconditions: []
        side_effects: ["same cascade as ACTIVE -> REVOKED"]
      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /licensure/licenses/{licenseId}/surrender"
        actor: Applicant
        preconditions:
          - "acting applicant owns the license"
          - "no MisconductCase for this license in OPENED, INVESTIGATING, or HEARING (else ERR_OPEN_MISCONDUCT_CASE)"
        side_effects:
          - "every Endorsement of this license in PENDING_EVALUATION or ACTIVE -> REMOVED"
          - "increments License.version by 1"

  - entity: Endorsement
    initial_state: PENDING_EVALUATION
    terminal_states: [DENIED, REMOVED, REVOKED]
    transitions:
      - from: PENDING_EVALUATION
        to: ACTIVE
        trigger: "POST /licensure/endorsements/{endorsementId}/state"
        actor: CredentialEvaluator
        preconditions: ["license.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PENDING_EVALUATION
        to: DENIED
        trigger: "POST /licensure/endorsements/{endorsementId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /licensure/endorsements/{endorsementId}/state"
        actor: Applicant
        preconditions: ["acting applicant owns the license"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade: license revoked"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_EVALUATION
        to: REVOKED
        trigger: "system cascade: license revoked"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EmergencyPermit
    initial_state: ISSUED
    terminal_states: [EXPIRED, CONVERTED, REVOKED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system sweep on POST /_clock/set_current_utc: clock now >= valid_from and now < valid_until"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system sweep: clock now >= valid_until before activation"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep: clock now >= valid_until"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CONVERTED
        trigger: "system cascade: linked application APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: CONVERTED
        trigger: "system cascade: linked application APPROVED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /licensure/emergency-permits/{permitId}/state or system cascade (application DENIED/WITHDRAWN, or applicant BARRED)"
        actor: LegalOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /licensure/emergency-permits/{permitId}/state or system cascade (application DENIED/WITHDRAWN, or applicant BARRED)"
        actor: LegalOfficer
        preconditions: []
        side_effects: []

  - entity: CECredit
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /licensure/ce-credits/{creditId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: ["open CEAudits for the license are NOT recomputed until next determination"]
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /licensure/ce-credits/{creditId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
      - from: VOIDED
        to: VERIFIED
        trigger: "POST /licensure/ce-credits/{creditId}/state (reinstate after appeal)"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
        note: "cycle VERIFIED -> VOIDED -> VERIFIED preserves the pair-invariant on audited totals"

  - entity: CEAudit
    initial_state: INITIATED
    terminal_states: [PASSED]
    transitions:
      - from: INITIATED
        to: UNDER_REVIEW
        trigger: "POST /licensure/ce-audits/{auditId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: PASSED
        trigger: "POST /licensure/ce-audits/{auditId}/state"
        actor: CredentialEvaluator
        preconditions: ["verified_hours >= required_hours per latest determination (else ERR_AUDIT_HOURS_INSUFFICIENT)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: FAILED
        trigger: "POST /licensure/ce-audits/{auditId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
      - from: FAILED
        to: REMEDIATION
        trigger: "POST /licensure/ce-audits/{auditId}/state"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
      - from: REMEDIATION
        to: UNDER_REVIEW
        trigger: "POST /licensure/ce-audits/{auditId}/state (re-audit after makeup credits)"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []
        note: "FAILED -> REMEDIATION -> UNDER_REVIEW loop may repeat until PASSED"

  - entity: MisconductCase
    initial_state: OPENED
    terminal_states: [SANCTION_ISSUED, DISMISSED]
    transitions:
      - from: OPENED
        to: INVESTIGATING
        trigger: "POST /licensure/misconduct-cases/{caseId}/state"
        actor: BackgroundInvestigator
        preconditions: []
        side_effects: ["investigator_user_id := acting X-User-ID"]
      - from: OPENED
        to: DISMISSED
        trigger: "POST /licensure/misconduct-cases/{caseId}/state"
        actor: LegalOfficer
        preconditions: []
        side_effects: []
      - from: INVESTIGATING
        to: HEARING
        trigger: "POST /licensure/misconduct-cases/{caseId}/state"
        actor: LegalOfficer
        preconditions: []
        side_effects: []
      - from: HEARING
        to: ADJUDICATED
        trigger: "POST /licensure/misconduct-cases/{caseId}/state"
        actor: LegalOfficer
        preconditions:
          - "finding present in request (else ERR_CASE_FINDING_REQUIRED)"
          - "acting X-User-ID != investigator_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: ADJUDICATED
        to: SANCTION_ISSUED
        trigger: "system cascade: a PROPOSED DisciplinaryAction on this case transitions to ISSUED"
        actor: system
        preconditions: ["finding == SUBSTANTIATED"]
        side_effects: []
      - from: ADJUDICATED
        to: DISMISSED
        trigger: "POST /licensure/misconduct-cases/{caseId}/state"
        actor: LegalOfficer
        preconditions: ["finding == UNSUBSTANTIATED (else ERR_INVALID_STATE)"]
        side_effects: ["every PROPOSED DisciplinaryAction on this case -> VACATED"]

  - entity: DisciplinaryAction
    initial_state: PROPOSED
    terminal_states: [SERVED, VACATED]
    transitions:
      - from: PROPOSED
        to: ISSUED
        trigger: "POST /licensure/disciplinary-actions/{actionId}/state"
        actor: LegalOfficer
        preconditions: ["linked MisconductCase.status == ADJUDICATED and finding == SUBSTANTIATED (else ERR_INVALID_STATE)"]
        side_effects:
          - "sanction_type=SUSPENSION: license ACTIVE -> SUSPENDED"
          - "sanction_type=REVOCATION: license ACTIVE or SUSPENDED -> REVOKED (then applicant BARRED, endorsements REVOKED, applicant's permits REVOKED)"
          - "linked MisconductCase ADJUDICATED -> SANCTION_ISSUED"
      - from: PROPOSED
        to: VACATED
        trigger: "POST /licensure/disciplinary-actions/{actionId}/state or case dismissal cascade"
        actor: LegalOfficer
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: SERVED
        trigger: "system sweep on POST /_clock/set_current_utc: sanction_type=SUSPENSION and clock now >= suspension_end"
        actor: system
        preconditions: []
        side_effects: ["if no other ISSUED SUSPENSION remains on the license: license SUSPENDED -> ACTIVE"]

  - entity: TestScore
    initial_state: REPORTED
    terminal_states: [REJECTED]
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /licensure/test-scores/{testScoreId}/verify"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: ["compute scaled_score and passing via test_score_scaling", "recompute application deficiency_hours_required"]
      - from: REPORTED
        to: REJECTED
        trigger: "POST /licensure/test-scores/{testScoreId}/verify"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []

  - entity: Transcript
    initial_state: UNVERIFIED
    terminal_states: [REJECTED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /licensure/transcripts/{transcriptId}/verify"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: ["compute scaled_gpa via coursework_gpa_scaling", "store subject_relevant_hours", "recompute application deficiency_hours_required"]
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /licensure/transcripts/{transcriptId}/verify"
        actor: CredentialEvaluator
        preconditions: []
        side_effects: []

  - entity: EducatorPrepProgram
    initial_state: CANDIDATE
    terminal_states: [APPROVAL_WITHDRAWN]
    transitions:
      - from: CANDIDATE
        to: UNDER_REVIEW
        trigger: "POST /licensure/educator-prep-programs/{programId}/state"
        actor: ProgramApprovalOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /licensure/educator-prep-programs/{programId}/state"
        actor: ProgramApprovalOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVAL_WITHDRAWN
        trigger: "POST /licensure/educator-prep-programs/{programId}/state"
        actor: ProgramApprovalOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PROBATION
        trigger: "POST /licensure/educator-prep-programs/{programId}/state"
        actor: ProgramApprovalOfficer
        preconditions: []
        side_effects: []
      - from: PROBATION
        to: APPROVED
        trigger: "POST /licensure/educator-prep-programs/{programId}/state"
        actor: ProgramApprovalOfficer
        preconditions: []
        side_effects: []
        note: "APPROVED <-> PROBATION cycle may repeat"
      - from: PROBATION
        to: APPROVAL_WITHDRAWN
        trigger: "POST /licensure/educator-prep-programs/{programId}/state"
        actor: ProgramApprovalOfficer
        preconditions: []
        side_effects:
          - "every CredentialApplication with program_id = this program, pathway == TRADITIONAL, and status == EVALUATION is forced to DEFICIENCY_PENDING with deficiency_hours_required := min(30, deficiency_hours_required + 12) (cascade link 1)"
          - "no new INTAKE_REVIEW -> EVALUATION for applications naming this program"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: deficiency-plan-create-stale-application
    parent_entity: CredentialApplication
    write_endpoint: "POST /licensure/applications/{applicationId}/deficiency-plans"
    occ_field: expected_application_version
    description: |
      Creating a DeficiencyPlan against a CredentialApplication whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another evaluator has just created a plan for the same
      application (which legitimately supersedes the prior PROPOSED plan) and
      the current writer's view of the application is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ce-audit-determination-stale-audit
    parent_entity: CEAudit
    write_endpoint: "POST /licensure/ce-audits/{auditId}/determinations"
    occ_field: expected_ce_audit_version
    description: |
      Posting a determination against a CEAudit whose version has advanced
      since the client last observed it is rejected. A newer determination
      legitimately supersedes earlier totals, so a stale write must fail.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: application_fee
    trigger: "application creation; every transcript creation; expedite flag changes"
    algorithm: aggregation
    formula: |
      base = BASE_FEE[pathway]                      # TRADITIONAL 10000, ALTERNATIVE 15000, RECIPROCITY 20000, REINSTATEMENT 15000
      eval_fee = 2500 * count(Transcript of application)
      subtotal = base + eval_fee
      surcharge = round_half_up(subtotal * 0.20) if expedite_requested else 0
      fee_cents = subtotal + surcharge
    input_set: "the application plus all its Transcript rows regardless of verification_status"
    constants:
      TRANSCRIPT_EVAL_FEE_CENTS: 2500
      EXPEDITE_RATE: 0.20
    precision: "integer cents, round_half_up"
    variants: []

  - name: reinstatement_fee
    trigger: "POST /licensure/licenses/{licenseId}/reinstate"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned (circular-looking tier dependency):
      # 1) days_overdue = whole days between expires_on and clock now (>= 1 by state)
      # 2) late_fee from tier on days_overdue
      # 3) subtotal = RENEWAL_BASE_CENTS + late_fee
      # 4) surcharge tier is selected BY subtotal (subtotal < 25000 -> 0%;
      #    25000 <= subtotal <= 39999 -> 10%; subtotal >= 40000 -> 20%)
      # 5) surcharge = round_half_up(subtotal * rate)
      # 6) total = subtotal + surcharge
    input_set: "the expired license and the logical clock"
    constants:
      RENEWAL_BASE_CENTS: 15000
      LATE_FEE_TIER1_MAX_DAYS: 365
      LATE_FEE_TIER1_CENTS: 5000
      LATE_FEE_TIER2_MAX_DAYS: 730
      LATE_FEE_TIER2_CENTS: 15000
      SURCHARGE_TIER1_MAX_CENTS: 24999
      SURCHARGE_TIER2_MAX_CENTS: 39999
    precision: "integer cents, round_half_up"
    variants: []

  - name: coursework_gpa_scaling
    trigger: "POST /licensure/transcripts/{transcriptId}/verify with verification_status=VERIFIED"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: round PER COURSE first, then sum.
      GRADE_POINTS = {A: 4.0, A_MINUS: 3.7, B: 3.0, C: 2.0, D: 1.0, F: 0.0}
      for each course: quality_points = round_half_up(credit_hours * GRADE_POINTS[letter_grade], 2)
      scaled_gpa = round_half_up(sum(quality_points) / sum(credit_hours), 2)
      # Alternative order (sum unrounded, round once) yields different cents; it is NOT used.
    input_set: "the courses array of the transcript being verified"
    constants: {}
    precision: "2 decimal places per course, round_half_up; final gpa 2 decimals round_half_up"
    variants: []

  - name: deficiency_credit_computation
    trigger: "INTAKE_REVIEW -> EVALUATION; every transcript verify; every test-score verify"
    algorithm: constraint_propagation
    formula: |
      # >= 3 inputs with non-linear interaction; clamp applied LAST.
      # Sticky-zero override: if a DeficiencyPlan with status == COMPLETED exists for
      # the application, deficiency_hours_required := 0 regardless of the recompute below.
      recognized = min(sum(subject_relevant_hours over VERIFIED transcripts), RECOGNITION_CAP)
      if pathway == RECIPROCITY:
        subject_gap = reciprocity_evaluation.deficiency_subject_hours   # finalized evaluation
      else:
        subject_gap = max(0, SUBJECT_BASE[subject_area] - recognized)
      test_gap_penalty = 6 if any required exam lacks a VERIFIED passing TestScore else 0
      pathway_addon = 6 if pathway == ALTERNATIVE else 0
      deficiency_hours_required = min(30, subject_gap + test_gap_penalty + pathway_addon)
      # required_exams: TRADITIONAL/ALTERNATIVE -> [PRAXIS_SUBJECT, PEDAGOGY];
      # RECIPROCITY -> [] if outcome FULL else [PRAXIS_SUBJECT]; REINSTATEMENT -> [].
    input_set: "VERIFIED transcripts, VERIFIED TestScores of the application, finalized ReciprocityEvaluation for RECIPROCITY"
    constants:
      RECOGNITION_CAP: 18
      TEST_GAP_PENALTY: 6
      ALTERNATIVE_ADDON: 6
      DEFICIENCY_MAX: 30
      SUBJECT_BASE: {ELEMENTARY: 24, MATHEMATICS: 30, SCIENCE: 30, SPECIAL_EDUCATION: 27}
    precision: "integer hours"
    variants: []

  - name: ce_credit_audit_total
    trigger: "POST /licensure/ce-audits/{auditId}/determinations (also at CEAudit creation)"
    algorithm: chronological
    formula: |
      # Candidate credits: CECredit of license with status == VERIFIED and
      # cycle_start <= earned_on < cycle_end  (STANDARD);
      # RESTORATION additionally admits cycle_start - 12 months <= earned_on < cycle_start.
      # Process in earned_on ASC, tie-break created_at ASC. Whole-credit fit-or-skip:
      # a credit counts only if it fits ENTIRELY within its category's remaining cap;
      # otherwise it counts 0 (not partial). Processing order therefore changes totals.
      verified_hours = sum of counted hours across categories
      required_hours = 60 (STANDARD) | 90 (RESTORATION)
    input_set: "VERIFIED CECredit rows of the license in the variant's earned_on window"
    constants:
      CAP_STANDARD: {PEDAGOGY: 30, CONTENT: 60, ETHICS: 5, TECHNOLOGY: 10}
      CAP_RESTORATION: {PEDAGOGY: 45, CONTENT: 90, ETHICS: 8, TECHNOLOGY: 15}
      REQUIRED_STANDARD: 60
      REQUIRED_RESTORATION: 90
      RESTORATION_LOOKBACK_MONTHS: 12
    precision: "hours as number; integer hours when inputs are integers"
    variants:
      - name: STANDARD
        when: "routine renewal audit"
        difference: "window [cycle_start, cycle_end); CAP_STANDARD; required 60"
      - name: RESTORATION
        when: "post-expiry reinstatement audit"
        difference: "window extended 12 months before cycle_start; CAP_RESTORATION (1.5x rounded up); required 90 — identical credits produce a different total"

  - name: reciprocity_equivalency_mapping
    trigger: "POST /licensure/reciprocity-evaluations/{evaluationId}/finalize"
    algorithm: weighted_scoring
    formula: |
      # DETERMINISTIC variant: pure table lookup on (source_state, source_license_type).
      RECIPROCITY_TABLE = {("TX","STANDARD"): (FULL, 0),
                           ("FL","PROFESSIONAL"): (PARTIAL, 6),
                           ("NV","PROVISIONAL"): (DENIED, 0)}
      pairs not in table -> (PARTIAL, 12)
      # COMMITTEE variant: table result then experience adjustment:
      #   if years_teaching >= 3: outcome upgrades one level (DENIED->PARTIAL with 12 hours;
      #   PARTIAL->FULL with deficiency max(0, d-6); FULL unchanged)
      #   else table result unchanged.
    input_set: "the ReciprocityEvaluation being finalized"
    constants:
      COMMITTEE_MIN_YEARS: 3
      COMMITTEE_HOURS_REDUCTION: 6
      COMMITTEE_DENIED_TO_PARTIAL_HOURS: 12
      DEFAULT_PARTIAL_HOURS: 12
    precision: "integer hours"
    variants:
      - name: DETERMINISTIC
        when: "finalize with mapping_mode=DETERMINISTIC"
        difference: "table lookup only; years_teaching ignored"
      - name: COMMITTEE
        when: "finalize with mapping_mode=COMMITTEE"
        difference: "years_teaching >= 3 upgrades outcome and reduces deficiency hours — identical inputs produce a different outcome than DETERMINISTIC"

  - name: test_score_scaling
    trigger: "POST /licensure/test-scores/{testScoreId}/verify with verification_status=VERIFIED"
    algorithm: threshold
    formula: |
      scaled_score = SCALING[exam_code].OFFSET + raw_score * SCALING[exam_code].FACTOR
      passing = scaled_score >= SCALING[exam_code].PASSING   # >= semantics: exactly at threshold passes
    input_set: "the TestScore being verified"
    constants:
      SCALING: {PRAXIS_CORE: {OFFSET: 100, FACTOR: 1, PASSING: 150},
                PRAXIS_SUBJECT: {OFFSET: 100, FACTOR: 1, PASSING: 157},
                PEDAGOGY: {OFFSET: 100, FACTOR: 2, PASSING: 160}}
    precision: "integer scaled score"
    variants: []

  - name: background_risk_score
    trigger: "BackgroundCheck INITIATED -> PRINTS_SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      WEIGHT = {FELONY_VIOLENT: 100, FELONY_OTHER: 60, MISDEMEANOR_DRUG: 40, MISDEMEANOR_OTHER: 25, INFRACTION: 10}
      age_years = (fingerprint_submitted_at - offense_date) in days / 365.0
      decay = 1.0 if age_years <= 3; 0.5 if 3 < age_years <= 7; 0.25 if age_years > 7
      per finding: disposition CONVICTION -> weight * decay; PENDING -> 0.5 * weight * decay; DISMISSED -> 0
      risk_score = round_half_up(sum, 2)
      forced_flag = any finding with offense_category == FELONY_VIOLENT, disposition == CONVICTION, age_years <= 10
      auto_clear eligible iff risk_score < 40 and not forced_flag; else FLAGGED
    input_set: "adverse_findings of the BackgroundCheck, aged at fingerprint_submitted_at"
    constants:
      CLEAR_THRESHOLD_EXCLUSIVE: 40
      FORCED_FLAG_LOOKBACK_YEARS: 10
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list; entity_backed ownership: Applicant may only act on resources whose applicant chain resolves to X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4, category: existence, check: "request body shape: required fields present, enum members valid, numeric ranges valid (ssn_last4 exactly 4 digits; raw_score 0..100; hours > 0; suspension_end >= suspension_start)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 5, category: state, check: "target entity is in a state from which the requested transition exists; terminal states reject all transitions", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state/transition endpoints" }
  - { priority: 6, category: business_safety, check: "applicant.status == BARRED blocks new applications and intake advance; moral_character_attestation required true to leave SUBMITTED; no MisconductCase in OPENED/INVESTIGATING/HEARING for renew or surrender; no BackgroundCheck of the applicant in FLAGGED or ADJUDICATION when creating an EmergencyPermit", error_id: "ERR_APPLICANT_BARRED | ERR_MORAL_ATTESTATION_REQUIRED | ERR_OPEN_MISCONDUCT_CASE | ERR_BACKGROUND_HOLD", http_status: 409, applies_to: "application create/state, permit create, license renew/surrender" }
  - { priority: 7, category: business_constraint, check: "uniqueness and overlap: one non-terminal application per (applicant, subject_area); endorsement subject uniqueness per license; permit half-open interval overlap per (applicant, district); suspension closed-interval overlap per license; one open CE audit per license; one non-terminal background check per application; segregation of duties on adjudication", error_id: "ERR_DUPLICATE_OPEN_APPLICATION | ERR_ENDORSEMENT_DUPLICATE | ERR_PERMIT_INTERVAL_OVERLAP | ERR_SUSPENSION_INTERVAL_OVERLAP | ERR_AUDIT_ALREADY_OPEN | ERR_BACKGROUND_CHECK_OPEN | ERR_SEGREGATION_OF_DUTIES", http_status: 409, applies_to: "create endpoints, adjudication" }
  - { priority: 8, category: business_referential, check: "pathway/program referential integrity: TRADITIONAL requires program_id, program APPROVED and covering subject_area; RECIPROCITY requires finalized non-DENIED evaluation; endorsement requires license ACTIVE", error_id: "ERR_PATHWAY_PROGRAM_REQUIRED | ERR_PROGRAM_NOT_APPROVED | ERR_RECIPROCITY_NOT_FINALIZED", http_status: 409, applies_to: "application intake advance, endorsement activation" }
  - { priority: 9, category: business_temporal, check: "clock-window rules: renewal window [expires_on-180d, expires_on); reinstatement grace <= expires_on+730d; permit duration <= 365 days; deficiency plan deadline and extension; OCC expected versions current", error_id: "ERR_RENEWAL_WINDOW_CLOSED | ERR_REINSTATE_GRACE_EXPIRED | ERR_PERMIT_DURATION_EXCEEDED | ERR_PLAN_DEADLINE_PASSED | ERR_STALE_VERSION", http_status: "409 | 412", applies_to: "renew, reinstate, permit create, plan extend, OCC write endpoints" }
  - { priority: 10, category: business_fiscal, check: "fee rules: fee_status must be PAID to leave SUBMITTED; double payment rejected; reinstatement amount must equal computed reinstatement_fee", error_id: "ERR_FEE_UNPAID | ERR_FEE_ALREADY_PAID | ERR_FEE_AMOUNT_MISMATCH", http_status: "402 | 409", applies_to: "application state, fee-payment, reinstate" }
  - { priority: 11, category: business_constraint, check: "evaluation-gate rules for EVALUATION -> BACKGROUND_REVIEW and audit pass. Within this priority, ties break in listed order: transcripts verified first, then required exams passed, then deficiency cleared, then background cleared; audit-hours check applies to CEAudit UNDER_REVIEW -> PASSED", error_id: "ERR_TRANSCRIPTS_UNVERIFIED | ERR_EXAM_REQUIREMENT_UNMET | ERR_DEFICIENCY_OUTSTANDING | ERR_BACKGROUND_NOT_CLEARED | ERR_AUDIT_HOURS_INSUFFICIENT", http_status: 409, applies_to: "application evaluation advance, audit pass" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/licensure/applicants", description: "Register an applicant", roles: [Anonymous], code: 201, input: [full_name, email, date_of_birth, ssn_last4, moral_character_attestation], output: Applicant, side_effects: ["status=REGISTERED"] }
  - { method: GET, path: "/licensure/applicants/{applicantId}", description: "Get one applicant", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: Applicant, side_effects: [] }
  - { method: GET, path: "/licensure/applicants", description: "List applicants", roles: [IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "Applicant[]", side_effects: [] }

  - { method: POST, path: "/licensure/educator-prep-programs", description: "Create educator-preparation program", roles: [ProgramApprovalOfficer], code: 201, input: [institution_name, program_code, approved_subject_areas], output: EducatorPrepProgram, side_effects: ["approval_status=CANDIDATE"] }
  - { method: GET, path: "/licensure/educator-prep-programs/{programId}", description: "Get one program", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: EducatorPrepProgram, side_effects: [] }
  - { method: POST, path: "/licensure/educator-prep-programs/{programId}/state", description: "Advance program approval state", roles: [ProgramApprovalOfficer], code: 200, input: [to_status], output: EducatorPrepProgram, side_effects: ["state machine incl. APPROVAL_WITHDRAWN cascade to applications"] }

  - { method: POST, path: "/licensure/applications", description: "Create credential application", roles: [Applicant], code: 201, input: [applicant_id, pathway, subject_area, grade_band, "program_id?", "expedite_requested?"], output: CredentialApplication, side_effects: ["status=SUBMITTED, fee_status=UNPAID", "compute fee_cents via application_fee", "applicant.status REGISTERED -> APPLICATION_IN_PROGRESS"] }
  - { method: GET, path: "/licensure/applications/{applicationId}", description: "Get one application", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: CredentialApplication, side_effects: [] }
  - { method: GET, path: "/licensure/applications", description: "List applications", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["applicant_id?", "program_id?", "status?", "limit?", "offset?"], output: "CredentialApplication[]", side_effects: [] }
  - { method: POST, path: "/licensure/applications/{applicationId}/fee-payment", description: "Pay application fee", roles: [Applicant], code: 200, input: [payment_token], output: CredentialApplication, side_effects: ["fee_status UNPAID -> PAID; already PAID -> ERR_FEE_ALREADY_PAID", "increments CredentialApplication.version by 1"] }
  - { method: POST, path: "/licensure/applications/{applicationId}/state", description: "Advance/withdraw/deny application per state machine", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator], code: 200, input: [to_status], output: CredentialApplication, side_effects: ["state machine transitions and cascades", "increments CredentialApplication.version by 1"] }

  - { method: POST, path: "/licensure/applications/{id}/transcripts", description: "Upload a transcript", roles: [Applicant], code: 201, input: [institution_name, degree_level, total_semester_hours, courses], output: Transcript, side_effects: ["verification_status=UNVERIFIED", "recompute application fee_cents"] }
  - { method: GET, path: "/licensure/applications/{id}/transcripts", description: "List transcripts of an application", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "Transcript[]", side_effects: [] }
  - { method: GET, path: "/licensure/transcripts/{transcriptId}", description: "Get one transcript", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: Transcript, side_effects: [] }
  - { method: POST, path: "/licensure/transcripts/{transcriptId}/verify", description: "Verify or reject a transcript; computes scaled_gpa", roles: [CredentialEvaluator], code: 200, input: [verification_status, "subject_relevant_hours?"], output: Transcript, side_effects: ["on VERIFIED: compute scaled_gpa; store subject_relevant_hours; recompute application deficiency_hours_required"] }

  - { method: POST, path: "/licensure/applications/{id}/test-scores", description: "Report a test score", roles: [Applicant], code: 201, input: [exam_code, raw_score, tested_on], output: TestScore, side_effects: ["verification_status=REPORTED"] }
  - { method: GET, path: "/licensure/applications/{id}/test-scores", description: "List test scores of an application", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "TestScore[]", side_effects: [] }
  - { method: GET, path: "/licensure/test-scores/{testScoreId}", description: "Get one test score", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: TestScore, side_effects: [] }
  - { method: POST, path: "/licensure/test-scores/{testScoreId}/verify", description: "Verify or reject a test score; computes scaled_score and passing", roles: [CredentialEvaluator], code: 200, input: [verification_status], output: TestScore, side_effects: ["on VERIFIED: compute scaled_score, passing; recompute application deficiency_hours_required"] }

  - { method: POST, path: "/licensure/applications/{id}/background-checks", description: "Open a background check", roles: [BackgroundInvestigator], code: 201, input: [adverse_findings], output: BackgroundCheck, side_effects: ["status=INITIATED; a second check while one is non-terminal -> ERR_BACKGROUND_CHECK_OPEN"] }
  - { method: GET, path: "/licensure/applications/{id}/background-checks", description: "List background checks of an application", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "BackgroundCheck[]", side_effects: [] }
  - { method: GET, path: "/licensure/background-checks/{checkId}", description: "Get one background check", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: BackgroundCheck, side_effects: [] }
  - { method: POST, path: "/licensure/background-checks/{checkId}/state", description: "Advance background check; PRINTS_SUBMITTED auto-resolves to CLEARED or FLAGGED via risk score", roles: [BackgroundInvestigator, LegalOfficer], code: 200, input: [to_status, "fingerprint_submitted_at?"], output: BackgroundCheck, side_effects: ["compute background_risk_score; auto-branch CLEARED/FLAGGED; DENIED cascades application DENIED and permit revocation"] }

  - { method: POST, path: "/licensure/applications/{id}/reciprocity-evaluations", description: "Open a reciprocity evaluation (RECIPROCITY pathway only)", roles: [CredentialEvaluator], code: 201, input: [source_state, source_license_type, years_teaching], output: ReciprocityEvaluation, side_effects: ["finalized=false"] }
  - { method: GET, path: "/licensure/applications/{id}/reciprocity-evaluations", description: "List reciprocity evaluations of an application", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "ReciprocityEvaluation[]", side_effects: [] }
  - { method: GET, path: "/licensure/reciprocity-evaluations/{evaluationId}", description: "Get one reciprocity evaluation", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: ReciprocityEvaluation, side_effects: [] }
  - { method: POST, path: "/licensure/reciprocity-evaluations/{evaluationId}/finalize", description: "Finalize with mapping_mode; computes outcome and deficiency_subject_hours", roles: [CredentialEvaluator], code: 200, input: [mapping_mode], output: ReciprocityEvaluation, side_effects: ["finalized=true; outcome + deficiency_subject_hours per reciprocity_equivalency_mapping"] }

  - { method: POST, path: "/licensure/applications/{id}/deficiency-plans", description: "Create a deficiency plan (supersedes an existing PROPOSED plan; OCC on application version)", roles: [CredentialEvaluator], code: 201, input: [expected_application_version], output: DeficiencyPlan, side_effects: ["required_hours := application.deficiency_hours_required; deadline := clock now + 730 days", "existing PROPOSED plan -> SUPERSEDED", "increments CredentialApplication.version by 1"] }
  - { method: GET, path: "/licensure/applications/{id}/deficiency-plans", description: "List deficiency plans of an application", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "DeficiencyPlan[]", side_effects: [] }
  - { method: GET, path: "/licensure/deficiency-plans/{planId}", description: "Get one deficiency plan", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: DeficiencyPlan, side_effects: [] }
  - { method: POST, path: "/licensure/deficiency-plans/{planId}/state", description: "Accept or extend a plan", roles: [CredentialEvaluator], code: 200, input: [to_status], output: DeficiencyPlan, side_effects: ["EXTENDED: extension_used=true, deadline += 365 days"] }
  - { method: POST, path: "/licensure/deficiency-plans/{planId}/evidence", description: "Post completed deficiency hours", roles: [CredentialEvaluator], code: 200, input: [hours], output: DeficiencyPlan, side_effects: ["ACCEPTED/EXTENDED -> IN_PROGRESS; completed_hours += hours; auto COMPLETED when completed_hours >= required_hours"] }

  - { method: GET, path: "/licensure/licenses/{licenseId}", description: "Get one license", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: License, side_effects: [] }
  - { method: GET, path: "/licensure/licenses", description: "List licenses", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["applicant_id?", "application_id?", "status?", "limit?", "offset?"], output: "License[]", side_effects: [] }
  - { method: POST, path: "/licensure/licenses/{licenseId}/renew", description: "Renew an ACTIVE license inside the renewal window", roles: [Applicant], code: 200, input: [payment_token], output: License, side_effects: ["expires_on += 60 months", "increments License.version by 1"] }
  - { method: POST, path: "/licensure/licenses/{licenseId}/reinstate", description: "Reinstate an EXPIRED license within grace with restoration audit and computed fee", roles: [Applicant], code: 200, input: [pays_amount_cents], output: License, side_effects: ["status -> ACTIVE; expires_on := clock now + 60 months", "increments License.version by 1"] }
  - { method: POST, path: "/licensure/licenses/{licenseId}/surrender", description: "Voluntarily surrender an ACTIVE license", roles: [Applicant], code: 200, input: [], output: License, side_effects: ["endorsements PENDING_EVALUATION/ACTIVE -> REMOVED", "increments License.version by 1"] }

  - { method: POST, path: "/licensure/licenses/{id}/endorsements", description: "Request an endorsement on a license", roles: [Applicant], code: 201, input: [subject_area, grade_band], output: Endorsement, side_effects: ["status=PENDING_EVALUATION"] }
  - { method: GET, path: "/licensure/licenses/{id}/endorsements", description: "List endorsements of a license", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "Endorsement[]", side_effects: [] }
  - { method: GET, path: "/licensure/endorsements/{endorsementId}", description: "Get one endorsement", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: Endorsement, side_effects: [] }
  - { method: POST, path: "/licensure/endorsements/{endorsementId}/state", description: "Activate/deny (evaluator) or remove (applicant) an endorsement", roles: [CredentialEvaluator, Applicant], code: 200, input: [to_status], output: Endorsement, side_effects: [] }

  - { method: POST, path: "/licensure/applications/{applicationId}/emergency-permits", description: "Issue an emergency permit while a deficiency plan is active. State precondition: application.status == DEFICIENCY_PENDING with a DeficiencyPlan in ACCEPTED or IN_PROGRESS (else ERR_INVALID_STATE). Safety: no BackgroundCheck of the applicant in FLAGGED or ADJUDICATION (ERR_BACKGROUND_HOLD). Constraint: no half-open overlap per (applicant, district). Temporal: duration <= 365 days.", roles: [CredentialEvaluator], code: 201, input: [district_code, valid_from, valid_until], output: EmergencyPermit, side_effects: ["status=ISSUED; applicant_id copied from application"] }
  - { method: GET, path: "/licensure/emergency-permits/{permitId}", description: "Get one permit", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: EmergencyPermit, side_effects: [] }
  - { method: GET, path: "/licensure/emergency-permits", description: "List permits", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["application_id?", "applicant_id?", "status?", "limit?", "offset?"], output: "EmergencyPermit[]", side_effects: [] }
  - { method: POST, path: "/licensure/emergency-permits/{permitId}/state", description: "Revoke a permit", roles: [LegalOfficer, CredentialEvaluator], code: 200, input: [to_status], output: EmergencyPermit, side_effects: [] }

  - { method: POST, path: "/licensure/licenses/{id}/ce-credits", description: "Submit a CE credit", roles: [Applicant], code: 201, input: [provider_name, category, hours, earned_on], output: CECredit, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/licensure/licenses/{id}/ce-credits", description: "List CE credits of a license", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "CECredit[]", side_effects: [] }
  - { method: GET, path: "/licensure/ce-credits/{creditId}", description: "Get one CE credit", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: CECredit, side_effects: [] }
  - { method: POST, path: "/licensure/ce-credits/{creditId}/state", description: "Verify, void, or reinstate a CE credit", roles: [CredentialEvaluator], code: 200, input: [to_status], output: CECredit, side_effects: [] }

  - { method: POST, path: "/licensure/licenses/{id}/ce-audits", description: "Open a CE audit for the license's current cycle", roles: [CredentialEvaluator], code: 201, input: [audit_variant], output: CEAudit, side_effects: ["status=INITIATED; cycle_start/cycle_end from license term; initial totals computed", "a second audit while one is open -> ERR_AUDIT_ALREADY_OPEN"] }
  - { method: GET, path: "/licensure/licenses/{id}/ce-audits", description: "List CE audits of a license", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "CEAudit[]", side_effects: [] }
  - { method: GET, path: "/licensure/ce-audits/{auditId}", description: "Get one CE audit", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: CEAudit, side_effects: [] }
  - { method: POST, path: "/licensure/ce-audits/{auditId}/state", description: "Advance audit review state", roles: [CredentialEvaluator], code: 200, input: [to_status], output: CEAudit, side_effects: [] }
  - { method: POST, path: "/licensure/ce-audits/{auditId}/determinations", description: "Recompute audit totals (OCC on audit version); latest determination supersedes earlier totals", roles: [CredentialEvaluator], code: 201, input: [expected_ce_audit_version], output: CEAudit, side_effects: ["recompute verified_hours/required_hours per ce_credit_audit_total", "increments CEAudit.version by 1"] }

  - { method: POST, path: "/licensure/licenses/{id}/misconduct-cases", description: "Open a misconduct case", roles: [LegalOfficer], code: 201, input: [allegation_category], output: MisconductCase, side_effects: ["status=OPENED"] }
  - { method: GET, path: "/licensure/licenses/{id}/misconduct-cases", description: "List misconduct cases of a license", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["limit?", "offset?"], output: "MisconductCase[]", side_effects: [] }
  - { method: GET, path: "/licensure/misconduct-cases/{caseId}", description: "Get one misconduct case", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: MisconductCase, side_effects: [] }
  - { method: POST, path: "/licensure/misconduct-cases/{caseId}/state", description: "Advance case; adjudication enforces segregation of duties", roles: [LegalOfficer, BackgroundInvestigator], code: 200, input: [to_status, "finding?"], output: MisconductCase, side_effects: ["OPENED->INVESTIGATING records investigator_user_id", "ADJUDICATED->DISMISSED vacates PROPOSED actions"] }

  - { method: POST, path: "/licensure/misconduct-cases/{caseId}/disciplinary-actions", description: "Propose a disciplinary action", roles: [LegalOfficer], code: 201, input: [sanction_type, "suspension_start?", "suspension_end?", "fine_cents?"], output: DisciplinaryAction, side_effects: ["status=PROPOSED; SUSPENSION requires start/end and closed-interval overlap check"] }
  - { method: GET, path: "/licensure/disciplinary-actions/{actionId}", description: "Get one disciplinary action", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: [], output: DisciplinaryAction, side_effects: [] }
  - { method: GET, path: "/licensure/disciplinary-actions", description: "List disciplinary actions", roles: [Applicant, IntakeOfficer, CredentialEvaluator, BackgroundInvestigator, LegalOfficer, ProgramApprovalOfficer, AgencyAdmin], code: 200, input: ["case_id?", "license_id?", "status?", "limit?", "offset?"], output: "DisciplinaryAction[]", side_effects: [] }
  - { method: POST, path: "/licensure/disciplinary-actions/{actionId}/state", description: "Issue or vacate a disciplinary action; issuance cascades to license, applicant, endorsements, permits", roles: [LegalOfficer], code: 200, input: [to_status], output: DisciplinaryAction, side_effects: ["sanction cascades per state machine"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never the wall clock. Setting the clock sweeps time-based transitions (license expiry, permit activation/expiry, plan default, suspension served).", roles: [AgencyAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["time-based sweeps per state machines"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or Applicant acting on a resource owned by another applicant" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (checked left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum member, range violation (ssn_last4, raw_score 0..100, hours > 0, suspension_end >= suspension_start)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the entity's current state; terminal states reject all transitions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC write endpoint" }
  - { id: ERR_APPLICANT_BARRED, http: 409, condition: "Applicant.status == BARRED blocks application creation and intake advance" }
  - { id: ERR_MORAL_ATTESTATION_REQUIRED, http: 409, condition: "moral_character_attestation is not true at SUBMITTED -> INTAKE_REVIEW" }
  - { id: ERR_OPEN_MISCONDUCT_CASE, http: 409, condition: "License has a MisconductCase in OPENED/INVESTIGATING/HEARING; blocks renew and surrender" }
  - { id: ERR_BACKGROUND_HOLD, http: 409, condition: "An EmergencyPermit cannot be created while any BackgroundCheck of the applicant is FLAGGED or in ADJUDICATION" }
  - { id: ERR_DUPLICATE_OPEN_APPLICATION, http: 409, condition: "A non-terminal application already exists for (applicant, subject_area)" }
  - { id: ERR_ENDORSEMENT_DUPLICATE, http: 409, condition: "License already has this subject_area as base or as a PENDING_EVALUATION/ACTIVE endorsement" }
  - { id: ERR_PERMIT_INTERVAL_OVERLAP, http: 409, condition: "Half-open [valid_from, valid_until) collides with an ISSUED/ACTIVE permit for the same (applicant, district); adjacency (valid_from == prior valid_until) is allowed" }
  - { id: ERR_SUSPENSION_INTERVAL_OVERLAP, http: 409, condition: "Closed [suspension_start, suspension_end] collides with a PROPOSED/ISSUED SUSPENSION on the same license; touching endpoints DO overlap (closed semantics)" }
  - { id: ERR_AUDIT_ALREADY_OPEN, http: 409, condition: "A CEAudit in INITIATED/UNDER_REVIEW/REMEDIATION already exists for the license" }
  - { id: ERR_BACKGROUND_CHECK_OPEN, http: 409, condition: "A non-terminal BackgroundCheck already exists for the application" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Adjudicating user id equals the case's investigator_user_id" }
  - { id: ERR_PATHWAY_PROGRAM_REQUIRED, http: 409, condition: "pathway=TRADITIONAL without program_id, or program_id supplied for a non-TRADITIONAL pathway" }
  - { id: ERR_PROGRAM_NOT_APPROVED, http: 409, condition: "Program is not APPROVED or does not cover the application's subject_area at INTAKE_REVIEW -> EVALUATION" }
  - { id: ERR_RECIPROCITY_NOT_FINALIZED, http: 409, condition: "RECIPROCITY application lacks a finalized ReciprocityEvaluation with outcome != DENIED at INTAKE_REVIEW -> EVALUATION" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Clock now is outside [expires_on - 180 days, expires_on)" }
  - { id: ERR_REINSTATE_GRACE_EXPIRED, http: 409, condition: "Clock now is after expires_on + 730 days" }
  - { id: ERR_PERMIT_DURATION_EXCEEDED, http: 409, condition: "valid_until - valid_from exceeds 365 days" }
  - { id: ERR_PLAN_DEADLINE_PASSED, http: 409, condition: "DEFAULTED plan cannot be extended because extension_used is already true" }
  - { id: ERR_FEE_UNPAID, http: 402, condition: "fee_status != PAID at SUBMITTED -> INTAKE_REVIEW" }
  - { id: ERR_FEE_ALREADY_PAID, http: 409, condition: "fee-payment attempted while fee_status == PAID" }
  - { id: ERR_FEE_AMOUNT_MISMATCH, http: 409, condition: "reinstate pays_amount_cents != computed reinstatement_fee" }
  - { id: ERR_DEFICIENCY_OUTSTANDING, http: 409, condition: "deficiency_hours_required > 0 blocks EVALUATION -> BACKGROUND_REVIEW, or no COMPLETED plan blocks DEFICIENCY_PENDING -> EVALUATION" }
  - { id: ERR_TRANSCRIPTS_UNVERIFIED, http: 409, condition: "No transcript exists, or some transcript is not VERIFIED, at EVALUATION -> BACKGROUND_REVIEW" }
  - { id: ERR_EXAM_REQUIREMENT_UNMET, http: 409, condition: "A required exam lacks a VERIFIED passing TestScore at EVALUATION -> BACKGROUND_REVIEW" }
  - { id: ERR_BACKGROUND_NOT_CLEARED, http: 409, condition: "No BackgroundCheck exists, it is DENIED, or it is not CLEARED at the evaluation/background gates" }
  - { id: ERR_AUDIT_NOT_PASSED, http: 409, condition: "Renew lacks a PASSED STANDARD audit; reinstate lacks a PASSED RESTORATION audit" }
  - { id: ERR_AUDIT_HOURS_INSUFFICIENT, http: 409, condition: "UNDER_REVIEW -> PASSED with verified_hours < required_hours" }
  - { id: ERR_CASE_FINDING_REQUIRED, http: 409, condition: "HEARING -> ADJUDICATED without finding" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may only self-register"
    identity: opaque
    exclusive_operations: ["POST /licensure/applicants"]
    shared_operations: []
  - name: Applicant
    description: "Educator seeking or holding credentials; acts only on own resources"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /licensure/applications"
      - "POST /licensure/applications/{id}/fee-payment"
      - "POST /licensure/applications/{id}/transcripts"
      - "POST /licensure/applications/{id}/test-scores"
      - "POST /licensure/licenses/{id}/renew"
      - "POST /licensure/licenses/{id}/reinstate"
      - "POST /licensure/licenses/{id}/surrender"
      - "POST /licensure/licenses/{id}/endorsements"
      - "POST /licensure/licenses/{id}/ce-credits"
    shared_operations:
      - "GET endpoints (own resources only)"
      - "POST /licensure/applications/{id}/state (WITHDRAWN only)"
      - "POST /licensure/endorsements/{id}/state (REMOVED only)"
  - name: IntakeOfficer
    description: "Agency intake staff; advances applications through intake into evaluation"
    identity: opaque
    exclusive_operations:
      - "POST /licensure/applications/{id}/state (INTAKE_REVIEW, EVALUATION)"
    shared_operations: ["GET endpoints"]
  - name: CredentialEvaluator
    description: "Evaluates coursework, exams, reciprocity, deficiency plans, CE audits, endorsements; issues permits; approves/denies applications"
    identity: opaque
    exclusive_operations:
      - "POST /licensure/transcripts/{id}/verify"
      - "POST /licensure/test-scores/{id}/verify"
      - "POST /licensure/applications/{id}/reciprocity-evaluations"
      - "POST /licensure/reciprocity-evaluations/{id}/finalize"
      - "POST /licensure/applications/{id}/deficiency-plans"
      - "POST /licensure/deficiency-plans/{id}/state"
      - "POST /licensure/deficiency-plans/{id}/evidence"
      - "POST /licensure/applications/{id}/emergency-permits"
      - "POST /licensure/ce-credits/{id}/state"
      - "POST /licensure/licenses/{id}/ce-audits"
      - "POST /licensure/ce-audits/{id}/state"
      - "POST /licensure/ce-audits/{id}/determinations"
      - "POST /licensure/applications/{id}/state (DEFICIENCY_PENDING, BACKGROUND_REVIEW, APPROVED, DENIED, EVALUATION from DEFICIENCY_PENDING)"
    shared_operations:
      - "GET endpoints"
      - "POST /licensure/endorsements/{id}/state (ACTIVE, DENIED)"
      - "POST /licensure/emergency-permits/{id}/state"
  - name: BackgroundInvestigator
    description: "Runs background checks and investigates misconduct cases"
    identity: opaque
    exclusive_operations:
      - "POST /licensure/applications/{id}/background-checks"
      - "POST /licensure/applications/{id}/state (PENDING_DECISION)"
      - "POST /licensure/misconduct-cases/{id}/state (INVESTIGATING)"
    shared_operations:
      - "GET endpoints"
      - "POST /licensure/background-checks/{id}/state (PRINTS_SUBMITTED)"
  - name: LegalOfficer
    description: "Adjudicates flagged background checks and misconduct; issues discipline; revokes permits"
    identity: opaque
    exclusive_operations:
      - "POST /licensure/licenses/{id}/misconduct-cases"
      - "POST /licensure/misconduct-cases/{id}/disciplinary-actions"
      - "POST /licensure/disciplinary-actions/{id}/state"
      - "POST /licensure/misconduct-cases/{id}/state (HEARING, ADJUDICATED, DISMISSED)"
      - "POST /licensure/background-checks/{id}/state (ADJUDICATION, CLEARED, DENIED)"
    shared_operations:
      - "GET endpoints"
      - "POST /licensure/emergency-permits/{id}/state"
  - name: ProgramApprovalOfficer
    description: "Manages educator-preparation program approval lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /licensure/educator-prep-programs"
      - "POST /licensure/educator-prep-programs/{id}/state"
    shared_operations: ["GET endpoints"]
  - name: AgencyAdmin
    description: "Operational administrator; drives the logical clock; read-all"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
