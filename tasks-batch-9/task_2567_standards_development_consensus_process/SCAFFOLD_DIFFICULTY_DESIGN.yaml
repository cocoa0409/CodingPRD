  # =====================================================================
  # Rule 9 — compensating invariants over two DIFFERENT conserved quantities
  #   9a: voter seats on a Ballot   (cast -> withdraw)
  #   9b: comment disposition ledger on a PublicReview  (dispose -> reopen)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: withdrawing_a_negative_vote_returns_the_seat_with_no_tally_drift
        grounds:
          - calculations.vote_slot_conservation
          - state_machines[Vote].CAST_to_WITHDRAWN
          - endpoints[PATCH /sdo/votes/{voteId}]
          - entities.Ballot.not_returned_count
          - entities.Ballot.eligible_voter_count
        distinguishing_aspect: |
          Conserved quantity: VOTER SEATS on a Ballot —
          affirmative_count + negative_count + abstain_count + not_returned_count ==
          eligible_voter_count, with returned_count = the three position buckets summed. The forward
          action moves one seat out of not_returned_count into the NEGATIVE bucket; the compensating
          action (PATCH with status WITHDRAWN) must move that exact seat back, leaving all five
          counters bit-identical to their pre-cast values. The frozen eligible_voter_count is the
          conservation total and must never move. The linked BALLOT_NEGATIVE comment survives the
          withdrawal, which is precisely why the seat ledger and the comment ledger are two
          independent quantities.
