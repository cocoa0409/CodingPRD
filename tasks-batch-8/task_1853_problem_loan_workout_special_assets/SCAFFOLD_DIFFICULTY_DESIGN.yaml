            - "After compensating recovery: current == 38,000,000, charged_off == 0 — sum STILL 50,000,000 and unapplied_cash == 0"
            - "INVARIANT: current_principal_cents + charged_off_principal_cents is unchanged by the forward+compensating pair (50,000,000 → 50,000,000 → 50,000,000)"

      - name: appraisal_supersede_lgd_reconciliation_invariant
        grounds:
          - calculations.loss_given_default
          - calculations.liquidation_value
        distinguishing_aspect: |
          Conserved quantity 2 — LGD reconciliation: replacing the ACTIVE
          valuation of a collateral item (old appraisal superseded by a new
          accepted one) must leave loss_given_default + collateral_cover ==
          loan.current_principal when cover <= principal (no drift from
          stale values lingering after supersede).
        test_recipe:
          setup:
            - "Loan principal 100,000,000; one collateral item; first appraisal 80,000,000 accepted (LGD 36,000,000 at 20% haircut); second appraisal 50,000,000 accepted (supersedes the value basis)"
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Riverbend Winery", tax_id: "12-0000007", naics_code: "312130", internal_risk_rating: 7, guarantor_name: "", guarantor_net_worth_cents: 0 }
              as: WorkoutOfficer
