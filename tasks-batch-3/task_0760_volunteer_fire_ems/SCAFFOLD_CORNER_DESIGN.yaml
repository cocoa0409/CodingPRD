  # ----------------------------------------------- Cross-cutting (OCC layer)
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_duty_assignment_stale_shift_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[duty-assignment-create-stale-shift]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first assignment advances DutyShift.version 1->2, a second create still carrying expected_duty_shift_version=1 (stale) is rejected 412; retrying with version 2 succeeds."
        test_recipe:
          setup: ["Two eligible members; a PUBLISHED shift version 1, max_crew 3."]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Oc", email: "offoc@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Oc1", email: "moc1@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m1: "$.data.id" } }
            - { call: "POST /members/${m1}/certifications", payload: { cert_type: "EMT_BASIC", category: "EMS" }, as: Officer, as_user_id: "${off_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /members/${m1}/training-records", payload: { category: "EMS", hours: 20, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c1}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m1}/activate", payload: {}, as: Chief }
            - { call: "POST /members", payload: { full_name: "M Oc2", email: "moc2@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m2: "$.data.id" } }
            - { call: "POST /members/${m2}/certifications", payload: { cert_type: "EMT_BASIC", category: "EMS" }, as: Officer, as_user_id: "${off_id}", captures: { c2: "$.data.id" } }
            - { call: "POST /members/${m2}/training-records", payload: { category: "EMS", hours: 20, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c2}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m2}/activate", payload: {}, as: Chief }
            - { call: "POST /stations", payload: { name: "SOc" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "MEDIC-Oc", apparatus_type: "AMBULANCE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-06-09T06:00:00Z", end_at: "2026-06-09T18:00:00Z", max_crew: 3, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh_id: "$.data.id", sh_v: "$.data.version" } }
            - { call: "POST /duty-shifts/${sh_id}/publish", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /duty-shifts/${sh_id}/assignments", payload: { member_id: "${m1}", expected_duty_shift_version: "${sh_v}" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "GET /duty-shifts/${sh_id}", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { sh_v_new: "$.data.version" } }
          trigger:
            - { call: "POST /duty-shifts/${sh_id}/assignments", payload: { member_id: "${m2}", expected_duty_shift_version: "${sh_v}" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /duty-shifts/${sh_id}/assignments", payload: { member_id: "${m2}", expected_duty_shift_version: "${sh_v_new}" }, as: Officer, as_user_id: "${off_id}", captures: { a_ok: "$.data.id" } }
          assert:
            - "Stale create (expected version 1): HTTP 412, data.error_id == ERR_STALE_VERSION"
            - "Retry with current version: HTTP 201, DutyAssignment.${a_ok}.status == ASSIGNED"

      - name: corner_occ_report_amend_stale_incident_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[report-amend-stale-incident]", "errors[ERR_STALE_VERSION]", state_machines.Incident.report_LOCKED_to_report_AMENDED]
        distinguishing_aspect: "A first amend advances Incident.version; a second amend still carrying the pre-amend version is rejected 412; retrying with the current version succeeds."
        test_recipe:
          setup: ["A cleared incident with a LOCKED NFIRS report; capture version after lock."]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Am", email: "offam@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SAm" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-Am", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "STRUCTURE_FIRE", alarm_at: "2026-03-02T00:00:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/enroute", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/clear", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/report", payload: { nfirs_property_use: "419", nfirs_actions_taken: "11" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/report/lock", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { locked_v: "$.data.version" } }
          trigger:
            - { call: "POST /incidents/${inc_id}/report/amend", payload: { expected_incident_version: "${locked_v}", nfirs_property_use: "420" }, as: Officer, as_user_id: "${off_id}", captures: { amended_v: "$.data.version" } }
            - { call: "POST /incidents/${inc_id}/report/amend", payload: { expected_incident_version: "${locked_v}", nfirs_property_use: "421" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/report/amend", payload: { expected_incident_version: "${amended_v}", nfirs_property_use: "422" }, as: Officer, as_user_id: "${off_id}", captures: { rstat: "$.data.report_status" } }
          assert:
            - "First amend (version = locked_v): HTTP 200, report_status == AMENDED"
            - "Second amend (stale locked_v): HTTP 412, data.error_id == ERR_STALE_VERSION"
            - "Third amend (current amended_v): HTTP 200, Incident.${inc_id}.report_status == AMENDED"

      - name: corner_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.DutyShift.fields.version, state_machines.DutyShift.DRAFT_to_PUBLISHED]
        distinguishing_aspect: "A DutyShift mutation (publish) increments version from 1 to 2."
        test_recipe:
          setup: ["A DRAFT shift version 1 on an in-service apparatus."]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off V", email: "offv@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SV" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-V", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-06-10T06:00:00Z", end_at: "2026-06-10T18:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh_id: "$.data.id" } }
          trigger:
            - { call: "POST /duty-shifts/${sh_id}/publish", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { v2: "$.data.version" } }
          assert:
            - "DutyShift.${sh_id}.version == 2 AND DutyShift.${sh_id}.status == PUBLISHED"

