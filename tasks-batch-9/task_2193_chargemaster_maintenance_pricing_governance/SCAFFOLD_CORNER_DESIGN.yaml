        claim_type: correct_result
        grounds:
          - calculations.gross_charge_from_price_rule
          - calculations.gross_charge_from_price_rule.variants.floor_then_cap
        distinguishing_aspect: "Tier selection takes the LAST tier whose min_cost_basis_cents <= cost, inclusively: 49999 uses 32000 bp (159997) but 50000 uses 24000 bp (120000), and 249999 uses 24000 bp (599998) while 250000 uses 18000 bp (450000) — a one-cent cost increase lowers the gross charge at both boundaries."
