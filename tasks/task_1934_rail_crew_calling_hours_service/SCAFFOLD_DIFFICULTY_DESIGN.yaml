  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: call_accept_depends_on_job_fill_state
        grounds:
          - state_machines.Call.OFFERED_to_ACCEPTED
          - entities.Job.fields.filled_count
          - validations[priority=11]
        distinguishing_aspect: |
          Pair Call -> Job: whether an OFFERED call may be accepted depends on
          the sibling Job's fill state (filled_count < crew_required); once
          the job reached FILLED via another seat, accept on a still-OFFERED
          call is rejected ERR_JOB_ALREADY_FILLED.
        test_recipe:
          setup:
            - "Job J crew_required=1; Call C1 offered to E1 (position 1) and accepted -> J FILLED"
            - "Call C2 offered to E2 (position 2) while J had a seat — issued BEFORE the fill via crew_required=2 then... (pinned: J crew_required=1 and C2 was issued while J was CALLING with 0 filled; C1 accept fills J)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CrewManager
