        distinguishing_aspect: "OCC on Authority.version: after a successful issue (which bumps Authority.version via its side effect), a second issue attempt on a NEW notice carrying the pre-issue expected_authority_version is rejected ERR_STALE_AUTHORITY_VERSION (412) — sequential requests, deterministic."
        test_recipe:
          setup: ["Authority ACTIVE; notice W1 already issued (authority version advanced to v0+1 by the issue side effect); notice W2 in DRAFT; client holds the stale pre-issue version v0"]
