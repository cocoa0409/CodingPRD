          setup_api_calls:
            - { call: "POST /aquifers", payload: { name: "Basin-CC1", sensitivity: "HIGH", min_setback_septic_ft: 50, min_setback_property_line_ft: 10, min_well_depth_ft: 20 }, as: HealthOfficer, captures: { aq: "$.data.id" } }
