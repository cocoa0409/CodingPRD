scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: club_create_returns_201_and_system_fields
        claim_type: creation
        grounds:
          - entities.Club
          - "endpoints.POST /api/clubs"
        distinguishing_aspect: "Creating a Club with valid input returns 201 and the server-minted id, created_at, updated_at, version fields plus defaults treasury_balance_cents=0 and status=ACTIVE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/clubs"
              payload: { name: "Test Club", county_code: "TC" }
              as: ProgramAdmin
              captures: { cid: $.data.id, ver: $.data.version, bal: $.data.treasury_balance_cents }
          assert:
            - "Club.${cid}.version == 1"
            - "Club.${cid}.treasury_balance_cents == 0"
            - "Club.${cid}.status == ACTIVE"

      - name: club_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "endpoints.GET /api/clubs/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a non-existent club id returns 404 with error_id ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/clubs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: member_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Member.fields.full_name
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Creating a Member without the required full_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A club and a cleared volunteer exist"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Req Club", county_code: "RC" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Req", email: "vreq@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /api/members"
              payload: { birth_date: "2009-01-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST  # missing required full_name"

      - name: ledger_entry_computed_default_posted
        claim_type: defaults
        grounds: [entities.LedgerEntry.fields.entry_status]
        distinguishing_aspect: "A newly created LedgerEntry defaults entry_status to POSTED and ignores any client-supplied entry_status."
        test_recipe:
          setup:
            - "ACTIVE member, ACTIVE project, DRAFT record book"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Def Club", county_code: "DF" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Def", email: "vdef@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Def", birth_date: "2009-01-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "EXPENSE", amount_cents: 100, hours: 0, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { le_status: $.data.entry_status }
          assert:
            - "LedgerEntry.entry_status == POSTED"

      - name: project_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Project.fields.project_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Creating a Project with a project_type outside the declared enum returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "ACTIVE member"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Enum Club", county_code: "EN" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Enum", email: "venum@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Enum", birth_date: "2009-01-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "LLAMA", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST  # LLAMA is not a valid project_type"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: record_book_terminal_approved_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RecordBook]
        distinguishing_aspect: "Once a RecordBook reaches APPROVED (terminal), any further transition attempt (submit) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "An APPROVED record book"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Lock Club", county_code: "LK" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Lock", email: "vlock@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Lock", birth_date: "2009-01-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "EXPENSE", amount_cents: 100, hours: 0, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 70, accuracy: 70, financial: 70, reflection: 70 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { rb_v_final: $.data.version }
          trigger:
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v_final}", completeness: 90, accuracy: 90, financial: 90, reflection: 90 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # APPROVED is terminal"

      - name: project_invalid_transition_complete_from_planned
        claim_type: invalid_transition
        grounds: [state_machines.Project]
        distinguishing_aspect: "Completing a Project that is still PLANNED (never started) is rejected with ERR_INVALID_STATE; only ACTIVE projects can complete."
        test_recipe:
          setup:
            - "A PLANNED project"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Inv Club", county_code: "IV" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Inv", email: "vinv@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Inv", birth_date: "2009-01-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /api/projects/${proj_id}/complete"
              payload: { grade: "A" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # PLANNED cannot go directly to COMPLETED"

      - name: record_book_submit_without_entries_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RecordBook.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting a DRAFT record book that has zero POSTED ledger entries is rejected with ERR_INVALID_STATE (the at-least-one-entry precondition)."
        test_recipe:
          setup:
            - "A DRAFT record book with no ledger entries"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Pre Club", county_code: "PR" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Pre", email: "vpre@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Pre", birth_date: "2009-01-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
          trigger:
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 70, accuracy: 70, financial: 70, reflection: 70 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # no POSTED ledger entries"

      - name: award_endorse_by_same_volunteer_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AwardApplication.NOMINATED_to_ENDORSED
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Endorsing an award application with the same volunteer who nominated it violates segregation of duties and returns ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup:
            - "A NOMINATED award application whose nominated_by is the acting volunteer"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "SoD Club", county_code: "SD" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol SoD", email: "vsod@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem SoD", birth_date: "2008-01-01", club_id: "${club_id}", is_club_officer: true }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "INCOME", amount_cents: 10000, hours: 0, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 80, accuracy: 90, financial: 70, reflection: 85 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications"
              payload: { member_id: "${mem_id}", award_track: "DEGREE", record_book_id: "${rb_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { aa_id: $.data.id }
            - call: "GET /api/clubs/${club_id}"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { club_v: $.data.version }
            - call: "POST /api/award-applications/${aa_id}/nominate"
              payload: { expected_club_version: "${club_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
          trigger:
            - call: "POST /api/award-applications/${aa_id}/endorse"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES  # same volunteer cannot endorse own nomination"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: award_tier_gold_at_exact_boundary
        claim_type: correct_result
        grounds: [calculations.award_rubric_score]
        distinguishing_aspect: "At rubric_score exactly 85.00 (record_final=80, participation=100, leadership_pts=15) the tier is GOLD because the threshold comparison is >= (inclusive)."
        test_recipe:
          setup:
            - "ENDORSED award application whose linked record book final_score == 80.00"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Bnd Club", county_code: "BN" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Bnd", email: "vbnd@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Bnd2", email: "vbnd2@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol2_id: $.data.id }
            - call: "POST /api/volunteers/${vol2_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem Bnd", birth_date: "2008-01-01", club_id: "${club_id}", is_club_officer: true }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /api/members/${mem_id}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${mem_id}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "INCOME", amount_cents: 10000, hours: 0, recorded_on: "2026-06-01" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-17T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/record-books/${rb_id}/submit"
              payload: { expected_record_book_version: "${rb_v}", completeness: 80, accuracy: 90, financial: 70, reflection: 85 }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books/${rb_id}/begin-review"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/record-books/${rb_id}/approve"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications"
              payload: { member_id: "${mem_id}", award_track: "DEGREE", record_book_id: "${rb_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { aa_id: $.data.id }
            - call: "GET /api/clubs/${club_id}"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { club_v: $.data.version }
            - call: "POST /api/award-applications/${aa_id}/nominate"
              payload: { expected_club_version: "${club_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/award-applications/${aa_id}/endorse"
              payload: {}
              as: Volunteer
              as_user_id: "${vol2_id}"
          trigger:
            - call: "POST /api/award-applications/${aa_id}/evaluate"
              payload: { participation_pct: 100, leadership_pts: 15 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { score: $.data.rubric_score, tier: $.data.award_tier }
          assert:
            - "AwardApplication.${aa_id}.rubric_score == 85.00"
            - "AwardApplication.${aa_id}.award_tier == GOLD  # exactly 85.00 qualifies (>=)"

      - name: attendance_exactly_75_percent_eligible
        claim_type: correct_result
        grounds: [calculations.member_eligibility_posture]
        distinguishing_aspect: "attendance_pct of exactly 75.00 (3 PRESENT of 4 non-EXCUSED) satisfies the >= 75 threshold; combined with an approved record book the posture becomes ELIGIBLE."
        test_recipe:
          setup:
            - "ACTIVE non-livestock member with 3 PRESENT and 1 ABSENT across 4 HELD meetings and an APPROVED record book"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Att Club", county_code: "AT" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Att", email: "vatt@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/rooms"
              payload: { name: "Att Room", capacity: 40 }
              as: ProgramAdmin
              captures: { room_id: $.data.id }
            - call: "POST /api/members"
              payload: { full_name: "Mem Att", birth_date: "2009-01-01", club_id: "${club_id}" }
