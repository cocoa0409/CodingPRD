# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Traffic Calming Request & Neighborhood Speed Study
# Breadth probe over §1.1–§1.7 claims NOT covered by §1.8 (stubs mark those).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities (creation, defaults, computed/system fields, enums,
  # required fields, FK integrity, not-found, listing/pagination, immutability)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_segment_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.StreetSegment.fields.emergency_route"
          - "entities.StreetSegment.fields.crash_count_3yr"
          - "entities.StreetSegment.fields.pedestrian_generator_count"
        distinguishing_aspect: "Omitting optional fields on POST /api/segments applies documented defaults: emergency_route false, crash_count_3yr 0, pedestrian_generator_count 0; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
          trigger:
            - call: "POST /api/segments"
              payload: { name: "Default Ave", speed_limit_mph: 25, household_count: 12, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { er: $.data.emergency_route, cc: $.data.crash_count_3yr, pg: $.data.pedestrian_generator_count, v: $.data.version }
          assert:
            - "response emergency_route == false AND crash_count_3yr == 0 AND pedestrian_generator_count == 0 (defaults applied)"
            - "version == 1 AND created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: create_segment_invalid_enum_returns_invalid_request
        claim_type: type_constraint
        grounds:
          - "entities.StreetSegment.fields.functional_class"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "functional_class outside {LOCAL, COLLECTOR, ARTERIAL} is rejected with ERR_INVALID_REQUEST (400) and no row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
          trigger:
            - call: "POST /api/segments"
              payload: { name: "Bad Ave", speed_limit_mph: 25, household_count: 12, functional_class: "HIGHWAY" }
              as: CityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_request_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.TrafficCalmingRequest.fields.requested_budget_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /api/requests without requested_budget_cents (source: input, no default) fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["segment S and resident r1 exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Req Ave", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "rq-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
          trigger:
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "No budget given" }
              as: Resident
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_request_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.TrafficCalmingRequest"
        distinguishing_aspect: "Client-supplied id/version/status in the creation body are ignored: the server mints a fresh UUID id, sets version 1, status SUBMITTED."
        test_recipe:
          setup: ["segment S and resident r1 exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Sys Ave", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "sys-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
          trigger:
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Ignore my fields", requested_budget_cents: 12345, id: "00000000-0000-0000-0000-0000000000ff", version: 99, status: "FUNDED" }
              as: Resident
              as_user_id: "${r1}"
              captures: { rid: $.data.id, v: $.data.version, st: $.data.status }
          assert:
            - "response id != '00000000-0000-0000-0000-0000000000ff' (server-minted), version == 1, status == SUBMITTED"

      - name: create_resident_duplicate_email_rejected
        claim_type: uniqueness_constraint
        grounds:
          - "entities.Resident.fields.email"
          - "errors[ERR_DUPLICATE_RESIDENT_EMAIL]"
        distinguishing_aspect: "Second resident with the same email fails with ERR_DUPLICATE_RESIDENT_EMAIL even on a different segment."
        test_recipe:
          setup: ["two segments; resident with email dup@x.com on segment 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Dup S1", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg1: $.data.id }
            - call: "POST /api/segments"
              payload: { name: "Dup S2", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg2: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "First", email: "dup@x.com", street_segment_id: "${seg1}", household_ref: "H1" }, as: CityAdmin }
          trigger:
            - call: "POST /api/residents"
              payload: { full_name: "Second", email: "dup@x.com", street_segment_id: "${seg2}", household_ref: "H9" }
              as: CityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_RESIDENT_EMAIL"

      - name: create_resident_duplicate_household_on_segment_rejected
        claim_type: uniqueness_constraint
        grounds:
          - "entities.Resident.fields.household_ref"
          - "errors[ERR_DUPLICATE_HOUSEHOLD]"
        distinguishing_aspect: "Two residents with the same household_ref on the SAME segment -> ERR_DUPLICATE_HOUSEHOLD; the same household_ref on a DIFFERENT segment is allowed."
        test_recipe:
          setup: ["segments S1, S2; resident H1 on S1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "HH S1", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg1: $.data.id }
            - call: "POST /api/segments"
              payload: { name: "HH S2", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg2: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "First", email: "hh-1@x.com", street_segment_id: "${seg1}", household_ref: "H1" }, as: CityAdmin }
          trigger:
            - call: "POST /api/residents"
              payload: { full_name: "SameHouse", email: "hh-2@x.com", street_segment_id: "${seg1}", household_ref: "H1" }
              as: CityAdmin
              captures: { err: $.data.error_id }
            - call: "POST /api/residents"
              payload: { full_name: "OtherSeg", email: "hh-3@x.com", street_segment_id: "${seg2}", household_ref: "H1" }
              as: CityAdmin
              captures: { ok_id: $.data.id }
          assert:
            - "Same segment + same household_ref: error_id == ERR_DUPLICATE_HOUSEHOLD"
            - "Different segment + same household_ref: succeeds (201) — uniqueness is segment-scoped"

      - name: create_request_arterial_segment_rejected
        claim_type: conditional_validation
        grounds:
          - "entities.StreetSegment.fields.functional_class"
          - "errors[ERR_SEGMENT_NOT_ELIGIBLE]"
        distinguishing_aspect: "Requests are only accepted on LOCAL or COLLECTOR segments; ARTERIAL -> ERR_SEGMENT_NOT_ELIGIBLE (422)."
        test_recipe:
          setup: ["ARTERIAL segment and a resident on it"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Arterial Rd", speed_limit_mph: 45, household_count: 20, functional_class: "ARTERIAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "art-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
          trigger:
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Calm the arterial", requested_budget_cents: 50000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGMENT_NOT_ELIGIBLE"

      - name: create_request_second_active_on_segment_rejected
        claim_type: aggregate_validation
        grounds:
          - "errors[ERR_ACTIVE_REQUEST_EXISTS]"
          - "validations[priority=8]"
        distinguishing_aspect: "Each request is individually valid, but a second NON-TERMINAL request on the same segment violates the aggregate one-active-request rule -> ERR_ACTIVE_REQUEST_EXISTS."
        test_recipe:
          setup: ["segment, resident, and one SUBMITTED request already on the segment"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Busy Ave", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "busy-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/requests", payload: { street_segment_id: "${seg}", title: "First", requested_budget_cents: 10000 }, as: Resident, as_user_id: "${r1}" }
          trigger:
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Second", requested_budget_cents: 20000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACTIVE_REQUEST_EXISTS"

      - name: request_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_REQUEST_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET /api/requests/{id} with a well-formed but unknown UUID returns ERR_REQUEST_NOT_FOUND (404) with the standard error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
          trigger:
            - call: "GET /api/requests/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: CityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REQUEST_NOT_FOUND"

      - name: list_requests_pagination_and_status_filter
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.GET_/api/requests"
        distinguishing_aspect: "GET /api/requests?status=SUBMITTED with limit=1&offset=0 returns exactly 1 row with total_count == 2 and has_more == true; offset=1 returns the second row with has_more == false."
        test_recipe:
          setup: ["two segments with one SUBMITTED request each"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Pg S1", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg1: $.data.id }
            - call: "POST /api/segments"
              payload: { name: "Pg S2", speed_limit_mph: 25, household_count: 5, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg2: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "P1", email: "pg-1@x.com", street_segment_id: "${seg1}", household_ref: "H1" }, as: CityAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "P2", email: "pg-2@x.com", street_segment_id: "${seg2}", household_ref: "H1" }, as: CityAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/requests", payload: { street_segment_id: "${seg1}", title: "Pg1", requested_budget_cents: 1000 }, as: Resident, as_user_id: "${p1}" }
            - { call: "POST /api/requests", payload: { street_segment_id: "${seg2}", title: "Pg2", requested_budget_cents: 2000 }, as: Resident, as_user_id: "${p2}" }
          trigger:
            - { call: "GET /api/requests?status=SUBMITTED&limit=1&offset=0", payload: {}, as: CityAdmin }
            - { call: "GET /api/requests?status=SUBMITTED&limit=1&offset=1", payload: {}, as: CityAdmin }
          assert:
            - "Page 1: data has exactly 1 row; pagination total_count == 2; has_more == true"
            - "Page 2: data has exactly 1 row (the other request); has_more == false"

      - name: signature_entity_is_immutable_common_fields_false
        claim_type: immutability
        grounds:
          - "entities.PetitionSignature"
        distinguishing_aspect: "PetitionSignature declares common_fields: false — rows expose id and created_at but NO updated_at and NO version; there is no update endpoint for the resource."
        test_recipe:
          setup: ["segment (4 households), 1 resident, request PETITION_OPEN"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Imm Ave", speed_limit_mph: 25, household_count: 4, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "imm-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Immutable sigs", requested_budget_cents: 5000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
          trigger:
            - call: "POST /api/requests/${req}/petition-signatures"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
              captures: { sig: $.data.id, ca: $.data.created_at }
          assert:
            - "Response contains id and created_at but no version and no updated_at keys"
            - "signed_at == 2026-08-01T00:00:00Z (logical clock), resident_id == ${r1}, household_ref == 'H1' (copied from profile)"

      - name: retract_unknown_signature_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_SIGNATURE_NOT_FOUND]"
        distinguishing_aspect: "DELETE /api/petition-signatures/{unknown-id} -> ERR_SIGNATURE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
          trigger:
            - call: "DELETE /api/petition-signatures/99999999-8888-7777-6666-555555555555"
              payload: {}
              as: TrafficEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SIGNATURE_NOT_FOUND"

  # ===========================================================================
  # Section: state_machines (valid transitions, invalid-from rejection,
  # terminal lockdown, side effects, guarded transitions, cycles)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds:
          - "state_machines.TrafficCalmingRequest"
          - "state_machines.SpeedStudy"
          - "state_machines.FundingCycle"
          - "state_machines.RemovalRequest"
        distinguishing_aspect: "New entities start in their declared initial states: request SUBMITTED, speed study COLLECTING, funding cycle OPEN."
        test_recipe:
          setup: ["segment (4 households), 3 residents, request with petition met (3 signatures)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Init Ave", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "ini-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "ini-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "ini-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Init states", requested_budget_cents: 5000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id, req_status: $.data.status }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
          trigger:
            - call: "POST /api/requests/${req}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { st_status: $.data.status }
            - call: "POST /api/funding-cycles"
              payload: { cycle_year: 2027, budget_total_cents: 9000 }
              as: CityAdmin
              captures: { cyc_status: $.data.status, committed: $.data.budget_committed_cents, available: $.data.budget_available_cents }
          assert:
            - "Request created with status == SUBMITTED"
            - "SpeedStudy created with status == COLLECTING"
            - "FundingCycle created with status == OPEN, budget_committed_cents == 0, budget_available_cents == 9000"

      - name: certify_from_collecting_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SpeedStudy.ANALYZED_to_CERTIFIED"
          - "errors[ERR_STUDY_INVALID_STATE]"
        distinguishing_aspect: "certify requires ANALYZED; calling it on a COLLECTING study fails with ERR_STUDY_INVALID_STATE and no certified_* fields are written."
        test_recipe:
          setup: ["request STUDY_IN_PROGRESS with a COLLECTING study holding 3 valid observations"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Cert Ave", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
            - { call: "POST /api/residents", payload: { full_name: "R1", email: "cer-r1@x.com", street_segment_id: "${seg}", household_ref: "H1" }, as: CityAdmin, captures: { r1: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R2", email: "cer-r2@x.com", street_segment_id: "${seg}", household_ref: "H2" }, as: CityAdmin, captures: { r2: $.data.id } }
            - { call: "POST /api/residents", payload: { full_name: "R3", email: "cer-r3@x.com", street_segment_id: "${seg}", household_ref: "H3" }, as: CityAdmin, captures: { r3: $.data.id } }
            - call: "POST /api/requests"
              payload: { street_segment_id: "${seg}", title: "Certify early", requested_budget_cents: 5000 }
              as: Resident
              as_user_id: "${r1}"
              captures: { req: $.data.id }
            - { call: "POST /api/requests/${req}/open-petition", payload: {}, as: TrafficEngineer }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r1}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r2}" }
            - { call: "POST /api/requests/${req}/petition-signatures", payload: {}, as: Resident, as_user_id: "${r3}" }
            - call: "POST /api/requests/${req}/speed-studies"
              payload: { study_type: "INITIAL", window_start_date: "2026-08-03", window_end_date: "2026-08-05" }
              as: TrafficEngineer
              captures: { study: $.data.id }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-03", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${study}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
          trigger:
            - call: "POST /api/speed-studies/${study}/certify"
              payload: {}
              as: TrafficEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STUDY_INVALID_STATE"
            - "Study remains COLLECTING with certified_score null (verified on a follow-up GET)"

      - name: approve_plan_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.TreatmentPlan.SUBMITTED_FOR_REVIEW_to_APPROVED"
          - "errors[ERR_PLAN_INVALID_STATE]"
        distinguishing_aspect: "approve on a DRAFT (never submitted) plan fails with ERR_PLAN_INVALID_STATE — the review gate cannot be skipped."
        test_recipe:
          setup: ["request FUNDED (score 60, cycle 50000, budget 10000); plan created, still DRAFT"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
            - call: "POST /api/segments"
              payload: { name: "Draft Ave", speed_limit_mph: 30, household_count: 4, functional_class: "LOCAL" }
              as: CityAdmin
              captures: { seg: $.data.id }
