            - { call: "GET /invoices/${i_id}", payload: {}, as: FinanceClerk, captures: { i_ref_final: $.data.refunded_cents, i_bal: $.data.balance_due_cents } }
          assert:
            - "Permit quoted_total_cents == 50000 and deposit_required_cents == 12500 (25% above the 5000 floor)"
            - "Refund of exactly 10000: status == CLEARED (<= threshold auto-approves)"
            - "Refund of 10001: status == PENDING_APPROVAL (1 cent over the threshold)"
            - "Invoice.refunded_cents == 10000 while second refund is pending (pending refunds do not count)"
