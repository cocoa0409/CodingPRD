scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_matter_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["entities.Matter.fields.caption", "entities.Matter.fields.bates_prefix"]
        distinguishing_aspect: "POST /matters with caption+bates_prefix returns 201; lifecycle_status=OPEN, hold_status=NO_HOLD, next_bates_seq=1, version=1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /matters"
              payload: { caption: "Acme v Beta", bates_prefix: "ABC" }
              as: LegalOps
              captures: { m_id: $.data.id, ls: $.data.lifecycle_status, hs: $.data.hold_status, nb: $.data.next_bates_seq, v: $.data.version }
          assert:
            - "response status == 201"
            - "Matter.${m_id}.lifecycle_status == OPEN"
            - "Matter.${m_id}.hold_status == NO_HOLD"
            - "Matter.${m_id}.next_bates_seq == 1"
            - "Matter.${m_id}.version == 1"

      - name: create_matter_missing_bates_prefix_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Matter.fields.bates_prefix", "validations[priority=14]"]
        distinguishing_aspect: "POST /matters omitting bates_prefix returns 422 ERR_INVALID_REQUEST; no matter persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /matters"
              payload: { caption: "No Prefix" }
              as: LegalOps
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response .data.error_id == ERR_INVALID_REQUEST"

      - name: create_matter_bad_bates_prefix_lowercase_rejected
        claim_type: Type Constraints
        grounds: ["entities.Matter.fields.bates_prefix", "validations[priority=12]"]
        distinguishing_aspect: "bates_prefix 'abc' (lowercase) violates uppercase-letters-only constraint; returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /matters"
              payload: { caption: "Bad Prefix", bates_prefix: "abc" }
              as: LegalOps
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response .data.error_id == ERR_INVALID_REQUEST"

      - name: get_matter_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /matters/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /matters/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LegalOps
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "response .data.error_id == ERR_NOT_FOUND"

      - name: list_matters_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Matter", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /matters returns array envelope with total_count and has_more present."
        test_recipe:
          setup: ["one matter created"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M1", bates_prefix: "AA" }
              as: LegalOps
          trigger:
            - call: "GET /matters?limit=10&offset=0"
              payload: {}
              as: LegalOps
          assert:
            - "response_type == array"
            - "meta has total_count and has_more"

      - name: custodian_system_fields_ignored_on_create
        claim_type: System Fields
        grounds: ["entities.Custodian.fields.ack_state", "entities.Custodian.fields.retention_released"]
        distinguishing_aspect: "POST /custodians ignores any client-sent ack_state; server sets ack_state=NONE, retention_released=false."
        test_recipe:
          setup: ["one matter"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c_id: $.data.id, ack: $.data.ack_state, rr: $.data.retention_released }
          assert:
            - "Custodian.${c_id}.ack_state == NONE"
            - "Custodian.${c_id}.retention_released == false"

      - name: custodian_wrong_matter_parent_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Custodian.fields.matter_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /custodians with a non-existent matter_id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /custodians"
              payload: { matter_id: "00000000-0000-4000-8000-000000000000", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "response .data.error_id == ERR_NOT_FOUND"

      - name: duplicate_custodian_email_within_matter_rejected
        claim_type: Type Constraints
        grounds: ["entities.Custodian.fields.email", "validations[priority=11]", "errors[ERR_DUPLICATE_CUSTODIAN_EMAIL]"]
        distinguishing_aspect: "Second custodian with email 'A@X.com' on the same matter (case-insensitive dup of 'a@x.com') returns 409 ERR_DUPLICATE_CUSTODIAN_EMAIL."
        test_recipe:
          setup: ["one matter with custodian a@x.com"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
          trigger:
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al2", email: "A@X.com" }
              as: LegalOps
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response .data.error_id == ERR_DUPLICATE_CUSTODIAN_EMAIL"

      - name: matter_ack_rate_computed_after_partial_acknowledge
        claim_type: Computed Fields
        grounds: ["entities.Matter.fields.ack_rate", "entities.Matter.fields.acknowledged_count"]
        distinguishing_aspect: "With 2 custodians and 1 acknowledged, Matter.acknowledged_count==1 and ack_rate==0.5."
        test_recipe:
          setup: ["hold ISSUED, 2 custodians, 1 acknowledged"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Bo", email: "b@x.com" }
              as: LegalOps
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
          trigger:
            - call: "GET /matters/${m_id}"
              payload: {}
              as: LegalOps
              captures: { acc: $.data.acknowledged_count, ar: $.data.ack_rate }
          assert:
            - "Matter.${m_id}.acknowledged_count == 1"
            - "Matter.${m_id}.ack_rate == 0.5"

      - name: production_item_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.ProductionItem"]
        distinguishing_aspect: "ProductionItem has common_fields:false — its read shape exposes id+created_at but no version field; there is no PUT/PATCH on production items."
        test_recipe:
          setup: ["a staged production item"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /production-sets?matter_id=${m_id}"
              payload: {}
              as: Producer
          assert:
            - "no PUT/PATCH endpoint exists for /production-items/{id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: acknowledge_already_acknowledged_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.HoldAcknowledgement.PENDING_to_ACKNOWLEDGED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second acknowledge on an already-ACKNOWLEDGED record returns 409 ERR_INVALID_STATE; no side effects refire."
        test_recipe:
          setup: ["hold ISSUED, single custodian already acknowledged"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response .data.error_id == ERR_INVALID_STATE"

      - name: issue_hold_with_zero_custodians_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.LegalHold.DRAFT_to_ISSUED", "errors[ERR_HOLD_HAS_NO_CUSTODIANS]"]
        distinguishing_aspect: "Issuing a DRAFT hold on a matter with zero custodians fails 409 ERR_HOLD_HAS_NO_CUSTODIANS; hold stays DRAFT."
        test_recipe:
          setup: ["matter with a DRAFT hold and no custodians"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response .data.error_id == ERR_HOLD_HAS_NO_CUSTODIANS"

      - name: terminal_closed_matter_rejects_further_transition
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Matter.CLOSING_to_CLOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "begin-close on a CLOSED matter returns 409 ERR_INVALID_STATE (lifecycle terminal)."
        test_recipe:
          setup: ["a matter driven to CLOSED"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mbx", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-30T00:00:00Z", expected_doc_count: 1 }
              as: LegalOps
              captures: { s1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/start"
              payload: {}
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h1", page_count: 1 }
              as: LegalOps
            - call: "POST /collection-scopes/${s1_id}/finish"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs"
              payload: { matter_id: "${m_id}", scope_id: "${s1_id}" }
              as: LegalOps
              captures: { j_id: $.data.id }
            - call: "POST /processing-jobs/${j_id}/run"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs/${j_id}/complete"
              payload: {}
              as: LegalOps
            - call: "POST /matters/${m_id}/begin-close"
              payload: {}
              as: LegalOps
            - call: "POST /matters/${m_id}/release-hold"
              payload: {}
              as: LegalOps
            - call: "POST /matters/${m_id}/close"
              payload: {}
              as: LegalOps
          trigger:
            - call: "POST /matters/${m_id}/begin-close"
              payload: {}
              as: LegalOps
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response .data.error_id == ERR_INVALID_STATE"

      - name: submit_qc_before_all_reviewed_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ReviewBatch.IN_REVIEW_to_QC_REVIEW", "errors[ERR_BATCH_NOT_FULLY_REVIEWED]"]
        distinguishing_aspect: "submit-qc while reviewed_count(0) < document_count(1) returns 409 ERR_BATCH_NOT_FULLY_REVIEWED."
        test_recipe:
          setup: ["IN_REVIEW batch with 1 undecided document"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mbx", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-30T00:00:00Z", expected_doc_count: 1 }
              as: LegalOps
              captures: { s1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/start"
              payload: {}
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h1", page_count: 1 }
              as: LegalOps
              captures: { d1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/finish"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs"
              payload: { matter_id: "${m_id}", scope_id: "${s1_id}" }
              as: LegalOps
              captures: { j_id: $.data.id }
            - call: "POST /processing-jobs/${j_id}/run"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs/${j_id}/complete"
              payload: {}
              as: LegalOps
            - call: "POST /review-batches"
              payload: { matter_id: "${m_id}", name: "B1" }
              as: ReviewLead
              captures: { b_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d1_id}" }
              as: ReviewLead
            - call: "POST /review-batches/${b_id}/open-review"
              payload: {}
              as: ReviewLead
          trigger:
            - call: "POST /review-batches/${b_id}/submit-qc"
              payload: {}
              as: ReviewLead
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response .data.error_id == ERR_BATCH_NOT_FULLY_REVIEWED"

      - name: open_review_empty_batch_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ReviewBatch.DRAFT_to_IN_REVIEW", "errors[ERR_EMPTY_BATCH]"]
        distinguishing_aspect: "open-review on a DRAFT batch with zero documents returns 409 ERR_EMPTY_BATCH (empty-collection boundary on review batch)."
        test_recipe:
          setup: ["a DRAFT batch with no reviews added"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /review-batches"
              payload: { matter_id: "${m_id}", name: "B1" }
              as: ReviewLead
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /review-batches/${b_id}/open-review"
              payload: {}
              as: ReviewLead
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response .data.error_id == ERR_EMPTY_BATCH"

      - name: dispute_clawback_keeps_item_produced
        claim_type: Valid Transition
        grounds: ["state_machines.Clawback.REQUESTED_to_DISPUTED", "entities.ProductionItem.fields.status"]
        distinguishing_aspect: "Disputing a REQUESTED clawback moves it to DISPUTED and leaves the ProductionItem status PRODUCED (no clawback side-effect)."
        test_recipe:
          setup: ["a PRODUCED item with a REQUESTED clawback filed"]
          setup_api_calls:
            - call: "POST /matters"
              payload: { caption: "M", bates_prefix: "AA" }
              as: LegalOps
              captures: { m_id: $.data.id }
            - call: "POST /custodians"
              payload: { matter_id: "${m_id}", full_name: "Al", email: "a@x.com" }
              as: LegalOps
              captures: { c1_id: $.data.id }
            - call: "POST /legal-holds"
              payload: { matter_id: "${m_id}", title: "H", instructions: "P", ack_deadline: "2026-06-10T00:00:00Z" }
              as: LegalOps
              captures: { h_id: $.data.id }
            - call: "POST /legal-holds/${h_id}/issue"
              payload: {}
              as: LegalOps
            - call: "GET /hold-acknowledgements?custodian_id=${c1_id}"
              payload: {}
              as: LegalOps
              captures: { ack1_id: "$.data[0].id" }
            - call: "POST /hold-acknowledgements/${ack1_id}/acknowledge"
              payload: {}
              as: Custodian
              as_user_id: "${c1_id}"
            - call: "POST /collection-scopes"
              payload: { matter_id: "${m_id}", custodian_id: "${c1_id}", source_label: "Mbx", range_start: "2026-06-01T00:00:00Z", range_end: "2026-06-30T00:00:00Z", expected_doc_count: 1 }
              as: LegalOps
              captures: { s1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/start"
              payload: {}
              as: LegalOps
            - call: "POST /documents"
              payload: { scope_id: "${s1_id}", content_hash: "h1", page_count: 1 }
              as: LegalOps
              captures: { d1_id: $.data.id }
            - call: "POST /collection-scopes/${s1_id}/finish"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs"
              payload: { matter_id: "${m_id}", scope_id: "${s1_id}" }
              as: LegalOps
              captures: { j_id: $.data.id }
            - call: "POST /processing-jobs/${j_id}/run"
              payload: {}
              as: LegalOps
            - call: "POST /processing-jobs/${j_id}/complete"
              payload: {}
              as: LegalOps
            - call: "POST /review-batches"
              payload: { matter_id: "${m_id}", name: "B1" }
              as: ReviewLead
              captures: { b_id: $.data.id }
            - call: "POST /review-batches/${b_id}/reviews"
              payload: { document_id: "${d1_id}" }
              as: ReviewLead
              captures: { dr1_id: $.data.id }
            - call: "POST /review-batches/${b_id}/open-review"
              payload: {}
              as: ReviewLead
            - call: "POST /document-reviews/${dr1_id}/decide"
              payload: { decision: "RESPONSIVE_NOT_PRIV" }
              as: Reviewer
            - call: "POST /review-batches/${b_id}/submit-qc"
              payload: {}
              as: ReviewLead
            - call: "POST /review-batches/${b_id}/complete"
              payload: {}
              as: ReviewLead
            - call: "POST /production-sets"
              payload: { matter_id: "${m_id}", source_batch_id: "${b_id}" }
              as: Producer
              captures: { ps_id: $.data.id }
            - call: "POST /production-sets/${ps_id}/items"
              payload: { document_id: "${d1_id}" }
              as: Producer
            - call: "POST /production-sets/${ps_id}/validate"
              payload: {}
              as: Producer
            - call: "POST /production-sets/${ps_id}/produce"
              payload: {}
              as: Producer
              captures: { ps_v: $.data.version }
            - call: "GET /production-sets/${ps_id}/items"
              payload: {}
              as: Producer
              captures: { pi1_id: "$.data[0].id" }
            - call: "POST /clawbacks"
              payload: { matter_id: "${m_id}", production_item_id: "${pi1_id}", reason: "review", expected_production_set_version: "${ps_v}" }
              as: Producer
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /clawbacks/${cb_id}/dispute"
              payload: {}
              as: LegalOps
              captures: { st: $.data.status }
          assert:
            - "Clawback.${cb_id}.status == DISPUTED"
            - "ProductionItem.${pi1_id}.status == PRODUCED"

  # ===========================================================================
  - section: calculations
