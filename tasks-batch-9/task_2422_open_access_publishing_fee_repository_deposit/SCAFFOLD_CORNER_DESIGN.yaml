      - name: corner_compliance_sweep_runs_all_four_phases_in_one_call
        claim_type: bulk_action
        grounds:
          - endpoints[POST /compliance-sweeps]
          - calculations.mandate_compliance_and_embargo
        distinguishing_aspect: |
          One sweep at 2027-03-01 exercises every phase exactly once and returns all four
          counters as 1: the agreement whose effective_until is 2026-09-01 becomes EXPIRED
          (phase 1, publisher counter decremented), the grant whose award_until is 2026-09-30
          becomes CLOSED (phase 2), the PENDING_DEPOSIT article past its 2026-11-03 deadline
          becomes NON_COMPLIANT and breaches its grant (phase 3), and the EMBARGOED article
          whose embargo_until is 2027-02-05 is promoted to COMPLIANT, taking its own grant to
          SATISFIED (phase 4). The phases are independent: the promoted article's grant stays
          ACTIVE because its award window has not ended.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z, then moved to 2027-03-01T00:00:00Z"
            - "publisher HALDEN with one FULLY_OA journal (required_embargo_months 12)"
            - "ACTIVE agreement [2026-07-01, 2026-09-01) with one FULL_APC coverage line"
            - "GREEN_OA funder (max_embargo_months 6, deposit_deadline_days 90, license ANY)"
            - "grant G1 awarded 2026-01-01..2026-09-30 with article A_x (accepted 2026-08-05, never deposited)"
            - "grant G2 awarded 2026-01-01..2027-12-31 with article A_y whose accepted manuscript was ingested on 2026-08-10 (EMBARGOED until 2027-02-05)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
