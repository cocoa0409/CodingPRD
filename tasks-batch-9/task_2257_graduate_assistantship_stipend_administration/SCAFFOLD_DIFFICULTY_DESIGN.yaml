          effort_pct 50 sits exactly on both inclusive lower bounds at once - the policy's
          insurance_min_effort_pct of 50 and the 50-to-74 remission band - so it must yield
          insurance_eligible true with tuition_remission_pct 75 and weekly_hours 20.0, while
