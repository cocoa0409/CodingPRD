      - name: case_progress_assist_cap_and_primary_floor
        grounds:
          - calculations.case_log_progress
          - state_machines.Resident.ACTIVE_to_GRADUATED
          - state_machines.ProcedureCaseLog.LOGGED_to_VERIFIED
          - errors[ERR_CASE_REQUIREMENTS_UNMET]
        distinguishing_aspect: |
          Mode (a) >= 3 inputs with non-linear interaction: effective_cases =
          verified_primary + min(verified_assist x 0.5, 0.25 x required_count)
          gated additionally by a primary floor. 1 SURGEON + 10 ASSIST yields
          1 + min(5.00, 1.00) = 2.00 (assist cap binds) with primary 1 < 2 ->
          graduation blocked; adding 3 SURGEON yields 4 + min(5.00, 1.00) = 5.00
          >= 4 with primary 4 >= 2 -> graduation succeeds. Distinct mode from
          the rounding-order and evaluation-order instances.
