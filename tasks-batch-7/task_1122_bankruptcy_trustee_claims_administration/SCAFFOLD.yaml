    input: [expected_case_version]
    output: DistributionPlan
    side_effects:
      - "plan -> CONFIRMED"
      - "PlanClassAllocation rows computed"
      - "Dividend rows computed (COMPUTED status)"
      - "case.version += 1"

  - method: POST
    path: "/trustee/plans/{id}/vacate"
    description: "Court vacates a CONFIRMED plan with no POSTED dividends"
    roles: [Court]
    code: 200
    input: []
    output: DistributionPlan
    side_effects: ["dividends -> VOIDED", "case.version += 1"]

  # --- PlanClassAllocation / Dividend ---
  - method: GET
    path: "/trustee/plans/{id}/allocations"
    description: "List class allocations of a plan"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: "PlanClassAllocation[]"
    side_effects: []

  - method: GET
    path: "/trustee/plans/{id}/dividends"
    description: "List dividends of a plan"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: ["status?", "claim_id?"]
    output: "Dividend[]"
    side_effects: []

  - method: GET
    path: "/trustee/dividends/{id}"
    description: "Get a dividend"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: Dividend
    side_effects: []

  - method: POST
    path: "/trustee/dividends/{id}/post"
    description: "Post (pay) a COMPUTED dividend; debits estate cash; plan may become EXECUTING/FULLY_DISTRIBUTED"
    roles: [Trustee]
    code: 200
    input: []
    output: Dividend
    side_effects:
      - "dividend -> POSTED"
      - "case.estate_cash_on_hand_cents -= amount_cents"
      - "allocation.paid_total_cents += amount_cents"
      - "first post flips plan CONFIRMED -> EXECUTING; last post may flip EXECUTING -> FULLY_DISTRIBUTED"
      - "case.version += 1"

  - method: POST
    path: "/trustee/dividends/{id}/void"
    description: "Void an unclaimed COMPUTED dividend; its amount remains in the estate as unclaimed funds"
    roles: [Trustee]
    code: 200
    input: []
    output: Dividend
    side_effects: ["dividend -> VOIDED", "case.version += 1"]

