          - entities.OutageEvent.fields.duration_minutes
        distinguishing_aspect: |
          Closing the same outage twice does not silently re-derive the window: the second closure
          returns 409 ERR_OUTAGE_ALREADY_CLOSED and duration_minutes stays at the 1269 minutes fixed
          by the first closure, even though the retry asked for a longer interval.
        test_recipe:
          setup:
            - "One Tower RB-TWR-001 (status PLANNED is sufficient) with one OutageEvent cause POWER started 2026-08-05T00:00:00Z, already CLOSED at 2026-08-05T21:09:00Z."
