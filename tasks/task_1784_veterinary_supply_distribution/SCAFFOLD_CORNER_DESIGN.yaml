  - name: error_clinic_not_active_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CLINIC_NOT_ACTIVE]
    excluded_because:
      difficulty_instance: order_submit_requires_active_clinic
      rationale: "Asserted as the failure path of the named \xA71.8 cross-entity dependency instance."
  - name: authorization_expiry_via_clock_sweep
    claim_type: violation_to_error
    grounds:
    - state_machines.ManufacturerAuthorization.APPROVED_to_EXPIRED
    - errors[ERR_RX_AUTHORIZATION_REQUIRED]
    distinguishing_aspect: Clock sweep expires an APPROVED authorization whose valid_until passed; a subsequent Rx order approval fails ERR_RX_AUTHORIZATION_REQUIRED even though the authorization row still
      exists.
    test_recipe:
      setup:
      - ACTIVE clinic; APPROVED authorization valid 2026-01-01..2026-08-31; Rx product stocked; order SUBMITTED; clock advanced to 2026-09-01
      setup_api_calls:
      - call: POST /vet/clinics
