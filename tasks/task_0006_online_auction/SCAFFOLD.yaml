# =============================================================================
# Online Auction Bidding System — Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  ## 6. Online Auction Bidding System

  **Extended System Functional Description:**

  Online auction bidding system: lot listing with category classification, condition description, reserve price configuration, and start/end time scheduling; bid increment ladder with tiered step sizes by price range and minimum-increment validation; auto-bid proxy with user-set maximum bid, automatic incremental bidding, and conflict handling between multiple proxies; soft-close extension with last-minute bid triggering time extension and configurable extension duration; deposit freeze and refund with pre-bid deposit hold, automatic release for losing bidders, deduction on winner default, and partial refund rules; commission calculation with buyer premium and seller commission tiered rates, refund-induced commission reversal, and invoice generation; dispute arbitration with evidence submission, multi-stage review, and refund or relisting outcomes; event-driven synchronization with payment, identity verification, and logistics systems; risk control for shill bidding detection, account-takeover prevention, and abnormal-bid-pattern monitoring.

domain_name: online-auction
api_prefix: /lots

# =============================================================================
# Step 0 – Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - selector_policy
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty: expert
  entity_count: 8
  endpoint_count: 31
  error_code_count: 30
  state_machine_count: 5
  calculation_count: 9
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (8 entities)
# =============================================================================
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when role=Seller" }
      - { name: display_name, type: string, source: input, description: "Public seller name (1–80 chars)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "Enum {ACTIVE, SUSPENDED}" }
      - { name: total_lots_listed, type: integer, source: computed, description: "Count of Lots owned by this Seller in any non-DRAFT state" }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "Cumulative seller proceeds = sum over PAID-and-not-REVERSED Invoices of (hammer_price_cents - seller_commission_cents)" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "gross_proceeds_cents reduced by any commission_reversal_amount_cents from REVERSED Invoices originally counted in gross_proceeds_cents" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; equals X-User-ID when role=Bidder" }
      - { name: display_name, type: string, source: input, description: "Public bidder handle (1–80 chars)" }
      - { name: affiliated_seller_id, type: string, source: input, description: "Optional: Seller.id this bidder is affiliated with (forbids bidding on that seller's lots)", default: null }
      - { name: identity_verified, type: boolean, source: system, description: "True after POST /_events/identity-verified arrives", default: false }
      - { name: wallet_balance_cents, type: integer, source: system, description: "Spendable wallet balance in cents (≥0); credited via /credit endpoint" }
      - { name: held_deposit_cents, type: integer, source: computed, description: "Sum of Deposit.amount_cents WHERE Deposit.bidder_id=this.id AND Deposit.status=HELD" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED | SUSPENDED", default: ACTIVE, constraints: "Enum {ACTIVE, RESTRICTED, SUSPENDED}" }
      - { name: risk_score, type: number, source: computed, description: "0.0–100.0 hybrid chronic+acute score" }
      - { name: chronic_score, type: number, source: computed, description: "Persistent component of risk_score before acute penalties" }
      - { name: acute_score, type: number, source: computed, description: "Acute penalty accumulator; cleared by PlatformAdmin reinstate" }
      - { name: shill_pattern_detected, type: boolean, source: computed, description: "True when bid-velocity sweep flags this bidder", default: false }
      - { name: account_takeover_alert, type: boolean, source: system, description: "Set by /_events/account-takeover-alert; clears on reinstate", default: false }
      - { name: withdrawal_count, type: integer, source: computed, description: "Count of Bid records where status=WITHDRAWN_BY_RISK with bidder_id=this.id" }
      - { name: dispute_loss_count, type: integer, source: computed, description: "Count of Dispute records where filed_by=BIDDER, bidder_id=this.id, and status=RESOLVED_DENIED" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: seller_id, type: string, source: input, description: "Owning Seller.id (must equal X-User-ID at create)" }
      - { name: title, type: string, source: input, description: "Lot title (1–200 chars)" }
      - { name: category, type: enum, source: input, description: "Domain category", constraints: "Enum {ART, COLLECTIBLE, ELECTRONICS, JEWELRY, REAL_ESTATE, VEHICLE}" }
      - { name: condition, type: enum, source: input, description: "Item condition", constraints: "Enum {NEW, LIKE_NEW, USED_GOOD, USED_FAIR, FOR_PARTS}" }
      - { name: physical_item_serial, type: string, source: input, description: "Globally-unique physical item serial; used for temporal-overlap exclusivity across Lots" }
      - { name: reserve_price_cents, type: integer, source: input, description: "Minimum hammer price for SOLD outcome; ≥1" }
      - { name: starting_bid_cents, type: integer, source: input, description: "Bid floor; ≥1 and ≤reserve_price_cents" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "ISO 8601 UTC; auction goes LIVE at this instant" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "ISO 8601 UTC; original auction close (later than scheduled_start_at by ≥3600s)" }
      - { name: effective_end_at, type: datetime, source: computed, description: "scheduled_end_at + cumulative soft-close extensions (in seconds)" }
      - { name: extension_count, type: integer, source: computed, description: "Number of soft-close extensions applied to this lot", default: 0 }
      - { name: status, type: enum, source: system, description: "Lot lifecycle status", default: DRAFT, constraints: "Enum {DRAFT, SCHEDULED, LIVE, SOLD, UNSOLD, REOFFERED, DEFAULTED, DISPUTED, REFUNDED, RELISTED, CANCELLED}" }
      - { name: current_price_cents, type: integer, source: computed, description: "Highest active bid amount; equals starting_bid_cents - 1 before any bid" }
      - { name: current_winner_bid_id, type: string, source: computed, description: "Bid.id of highest ACTIVE/WINNING bid; null if no qualifying bid" }
      - { name: current_winner_bidder_id, type: string, source: computed, description: "Bidder.id of current winning bidder; null if none" }
      - { name: bid_count, type: integer, source: computed, description: "Count of Bid records with lot_id=this.id and status IN {ACTIVE, WINNING, OUTBID}" }
      - { name: has_met_reserve, type: boolean, source: computed, description: "current_price_cents >= reserve_price_cents" }
      - { name: hammer_price_cents, type: integer, source: system, description: "Set on SOLD transition: current_price_cents at close (or runner-up_bid_amount on REOFFERED→SOLD)" }
      - { name: winning_bidder_id, type: string, source: system, description: "Bidder.id who actually pays; set on SOLD transition (winner or runner-up)" }
      - { name: runner_up_bid_id, type: string, source: computed, description: "Highest ACTIVE/OUTBID bid_id from a distinct bidder, ranked by bid amount DESC then created_at ASC" }
      - { name: payment_deadline_at, type: datetime, source: system, description: "Set on SOLD: hammer_at + PAYMENT_DEADLINE_SECONDS" }
      - { name: hammer_at, type: datetime, source: system, description: "Timestamp when SOLD transition occurred" }
      - { name: delivered_at, type: datetime, source: system, description: "Timestamp recorded by /_events/logistics-delivered; null until delivery confirmed" }
      - { name: relisted_from_lot_id, type: string, source: system, description: "If this lot was created via dispute RELIST cascade, the source lot.id; null otherwise", default: null }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1" }

  - name: Bid
    parent: Lot
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: lot_id, type: string, source: system, description: "Parent Lot.id" }
      - { name: bidder_id, type: string, source: system, description: "Bidder.id placing the bid; equals X-User-ID at place-bid time" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount in cents; must be ≥ min_required_bid_cents at placement time" }
      - { name: source, type: enum, source: system, description: "MANUAL | PROXY", constraints: "Enum {MANUAL, PROXY}" }
      - { name: proxy_id, type: string, source: system, description: "AutoBidProxy.id if source=PROXY; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "Bid lifecycle status", default: ACTIVE, constraints: "Enum {ACTIVE, WINNING, OUTBID, WITHDRAWN_BY_RISK}" }
      - { name: deposit_id, type: string, source: system, description: "Deposit.id created/reused for this bid's hold" }
      - { name: placed_at, type: datetime, source: system, description: "Server-side placement timestamp; ordering tiebreak" }
      - { name: triggered_extension, type: boolean, source: system, description: "True when this bid triggered a soft-close extension", default: false }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp; equals placed_at" }

  - name: AutoBidProxy
    parent: Lot
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: lot_id, type: string, source: system, description: "Parent Lot.id" }
      - { name: bidder_id, type: string, source: system, description: "Bidder.id; equals X-User-ID at create time" }
      - { name: max_amount_cents, type: integer, source: input, description: "Bidder's secret ceiling; ≥ Lot.starting_bid_cents and ≥ current min_required_bid at create" }
      - { name: status, type: enum, source: system, description: "Proxy lifecycle status", default: ACTIVE, constraints: "Enum {ACTIVE, EXHAUSTED, CANCELLED}" }
      - { name: last_executed_amount_cents, type: integer, source: computed, description: "Highest amount this proxy actually placed; null if never executed" }
      - { name: bids_emitted_count, type: integer, source: computed, description: "Count of Bid rows with proxy_id=this.id" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on each emission and on cancel/exhaust" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Deposit
    parent: Bidder
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: bidder_id, type: string, source: system, description: "Holding Bidder.id" }
      - { name: lot_id, type: string, source: system, description: "Lot.id this deposit is held for" }
      - { name: amount_cents, type: integer, source: system, description: "Deposit amount = deposit_required_cents at first qualifying bid placement; immutable after creation" }
      - { name: status, type: enum, source: system, description: "Deposit lifecycle status", default: HELD, constraints: "Enum {HELD, RELEASED, FORFEITED, PARTIAL_REFUND}" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Cents returned to wallet on terminal transition; equals amount_cents (RELEASED), 0 (FORFEITED), or partial_refund_amount_cents (PARTIAL_REFUND)" }
      - { name: forfeit_amount_cents, type: integer, source: computed, description: "Cents kept by platform; equals 0 (RELEASED), amount_cents (FORFEITED), or amount_cents - refund_amount_cents (PARTIAL_REFUND)" }
      - { name: terminal_reason, type: enum, source: system, description: "Reason for terminal state; null while HELD", default: null, constraints: "Enum {LOSING_BIDDER, WINNER_PAID, WINNER_DEFAULT_REOFFER_FILLED, WINNER_DEFAULT_NO_REOFFER, BIDDER_RISK_WITHDRAWN, DISPUTE_REFUND}" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on terminal transition" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Invoice
    parent: Lot
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: lot_id, type: string, source: system, description: "Parent Lot.id; one Invoice per Lot lifetime" }
      - { name: buyer_id, type: string, source: system, description: "Bidder.id who owes payment (winning_bidder_id at SOLD)" }
      - { name: seller_id, type: string, source: system, description: "Seller.id who receives proceeds" }
      - { name: hammer_price_cents, type: integer, source: system, description: "Snapshot of Lot.hammer_price_cents at issuance" }
      - { name: buyer_premium_cents, type: integer, source: computed, description: "Buyer premium per §1.3 buyer_premium calc" }
      - { name: seller_commission_cents, type: integer, source: computed, description: "Seller commission per §1.3 seller_commission calc" }
      - { name: buyer_total_cents, type: integer, source: computed, description: "hammer_price_cents + buyer_premium_cents (what buyer pays)" }
      - { name: seller_payout_cents, type: integer, source: computed, description: "hammer_price_cents - seller_commission_cents (what seller receives)" }
      - { name: platform_take_cents, type: integer, source: computed, description: "buyer_premium_cents + seller_commission_cents" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle status", default: PENDING, constraints: "Enum {PENDING, ISSUED, PAID, REVERSED}" }
      - { name: paid_at, type: datetime, source: system, description: "Recorded by /_events/payment-confirmed; null until PAID" }
      - { name: refund_amount_cents, type: integer, source: system, description: "On REVERSED: amount refunded to buyer (set by Dispute resolve_refund); 0 otherwise", default: 0 }
      - { name: commission_reversal_amount_cents, type: integer, source: computed, description: "On REVERSED: commission credited back to seller per §1.3 commission_reversal calc; 0 otherwise" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascaded side effects" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Dispute
    parent: Lot
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: lot_id, type: string, source: system, description: "Parent Lot.id" }
      - { name: invoice_id, type: string, source: system, description: "Invoice.id this dispute is filed against" }
      - { name: filed_by, type: enum, source: input, description: "Who filed", constraints: "Enum {BIDDER, SELLER}" }
      - { name: filer_user_id, type: string, source: system, description: "X-User-ID of filer at filing time" }
      - { name: reason, type: string, source: input, description: "Free-form reason (1–500 chars)" }
      - { name: evidence, type: array, source: input, description: "Array of {url:string, kind:string} evidence items submitted at filing or via /submit-evidence" }
      - { name: claimed_refund_amount_cents, type: integer, source: input, description: "Amount the filer claims should be refunded; 0 ≤ claimed ≤ Invoice.buyer_total_cents" }
      - { name: status, type: enum, source: system, description: "Dispute lifecycle status", default: FILED, constraints: "Enum {FILED, UNDER_REVIEW, RESOLVED_REFUND, RESOLVED_RELIST, RESOLVED_DENIED}" }
      - { name: resolution_outcome, type: enum, source: system, description: "Final outcome; null until resolved", default: null, constraints: "Enum {REFUND, RELIST, DENIED}" }
      - { name: resolution_refund_amount_cents, type: integer, source: input, description: "Refund amount specified at resolution; 0 ≤ amount ≤ Invoice.buyer_total_cents; required when outcome=REFUND, 0 otherwise", default: 0 }
      - { name: arbitrator_user_id, type: string, source: system, description: "X-User-ID of resolving ArbitratorOps; null until UNDER_REVIEW" }
      - { name: filed_at, type: datetime, source: system, description: "Filing timestamp" }
      - { name: review_started_at, type: datetime, source: system, description: "When status became UNDER_REVIEW" }
      - { name: resolved_at, type: datetime, source: system, description: "When status reached terminal" }
      - { name: created_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 State Machine Table (5 entities have lifecycle state)
# =============================================================================
state_machines:
  - entity: Bidder
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (risk_score crosses RISK_RESTRICT_THRESHOLD upward) OR POST /bidders/{id}/restrict (PlatformAdmin)"
        actor: "system or PlatformAdmin"
        preconditions: ["risk_score >= RISK_RESTRICT_THRESHOLD"]
        side_effects:
          - "Bidder may not place new bids or create new AutoBidProxies (existing ACTIVE proxies remain but are blocked from emitting new bids)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (risk_score >= RISK_SUSPEND_THRESHOLD) OR POST /bidders/{id}/suspend (PlatformAdmin)"
        actor: "system or PlatformAdmin"
        preconditions: ["risk_score >= RISK_SUSPEND_THRESHOLD OR PlatformAdmin override"]
        side_effects:
          - "All Bid records with bidder_id=this.id and status IN {ACTIVE, WINNING} → status=WITHDRAWN_BY_RISK (Cascade hop 1 of bidder_suspend_cascade)"
          - "For every Lot whose current_winner_bidder_id was this bidder, recompute current_winner_bid_id, current_winner_bidder_id, current_price_cents from remaining ACTIVE bids (Cascade hop 2 of bidder_suspend_cascade)"
          - "All AutoBidProxy records with bidder_id=this.id and status=ACTIVE → status=CANCELLED with reason=BIDDER_SUSPENDED"
          - "All HELD Deposits where bidder_id=this.id and Lot is still LIVE/SCHEDULED → status=RELEASED with terminal_reason=BIDDER_RISK_WITHDRAWN; refund_amount_cents=amount_cents credited back to wallet (Cascade hop 3 of bidder_suspend_cascade)"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /bidders/{id}/reinstate (PlatformAdmin)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Clears acute_score; recomputes risk_score (only chronic_score remains)"
          - "Clears account_takeover_alert and shill_pattern_detected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bidders/{id}/reinstate (PlatformAdmin)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Clears acute_score; recomputes risk_score"
          - "Clears account_takeover_alert and shill_pattern_detected"

  - entity: Lot
    field: status
    initial_state: DRAFT
    terminal_states: [REFUNDED, RELISTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /lots/{id}/publish"
        actor: Seller
        preconditions:
          - "scheduled_start_at > now()"
          - "scheduled_end_at - scheduled_start_at >= 3600 (1 hour minimum auction duration)"
          - "starting_bid_cents <= reserve_price_cents"
          - "No other Lot exists with same physical_item_serial whose [scheduled_start_at, effective_end_at) interval overlaps this lot's [scheduled_start_at, scheduled_end_at) AND status IN {SCHEDULED, LIVE, SOLD, REOFFERED, DEFAULTED, DISPUTED}"
        side_effects: ["effective_end_at initialized to scheduled_end_at"]

      - from: SCHEDULED
        to: LIVE
        trigger: "system (now() >= scheduled_start_at)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Reachable in tests via POST /_clock/advance crossing scheduled_start_at"

      - from: LIVE
        to: SOLD
        trigger: "system (now() >= effective_end_at AND has_met_reserve=true)"
        actor: system
        preconditions: ["current_price_cents >= reserve_price_cents"]
        side_effects:
          - "hammer_price_cents := current_price_cents"
          - "winning_bidder_id := current_winner_bidder_id"
          - "hammer_at := now()"
          - "payment_deadline_at := hammer_at + PAYMENT_DEADLINE_SECONDS"
          - "Bid with id=current_winner_bid_id → status=WINNING"
          - "All other ACTIVE Bids on this Lot → status=OUTBID"
          - "Invoice created with status=PENDING; buyer_premium_cents and seller_commission_cents computed (§1.3); status auto-advances to ISSUED in same transaction"
          - "All HELD Deposits where lot_id=this.id and bidder_id != winning_bidder_id → status=RELEASED with terminal_reason=LOSING_BIDDER; refund_amount_cents=amount_cents (Cascade hop of close_cascade)"

      - from: LIVE
        to: UNSOLD
        trigger: "system (now() >= effective_end_at AND has_met_reserve=false)"
        actor: system
        preconditions: ["current_price_cents < reserve_price_cents"]
        side_effects:
          - "All HELD Deposits with lot_id=this.id → status=RELEASED with terminal_reason=LOSING_BIDDER"

      - from: SOLD
        to: DEFAULTED
        trigger: "POST /lots/{id}/winner/default (PlatformAdmin) OR system (now() > payment_deadline_at AND Invoice.status != PAID)"
        actor: "PlatformAdmin or system"
        preconditions: ["Invoice.status IN {PENDING, ISSUED}"]
        side_effects:
          - "Bidder.dispute_loss_count not affected"
          - "Defaulter Bidder's acute_score += 20; risk_score recomputed"

      - from: DEFAULTED
        to: REOFFERED
        trigger: "system (immediate after DEFAULTED if a runner_up_bid_id exists at default time)"
        actor: system
        preconditions: ["runner_up_bid_id IS NOT NULL"]
        side_effects:
          - "runner_up_acceptance_deadline_at := now() + RUNNER_UP_ACCEPT_WINDOW_SECONDS (recorded on Lot)"
          - "Runner-up Bidder is notified (informational; no entity mutation required)"

      - from: DEFAULTED
        to: UNSOLD
        trigger: "system (no runner_up_bid_id at default time)"
        actor: system
        preconditions: ["runner_up_bid_id IS NULL"]
        side_effects:
          - "Defaulter's Deposit (lot_id=this.id, bidder_id=defaulter) → status=FORFEITED; terminal_reason=WINNER_DEFAULT_NO_REOFFER; refund_amount_cents=0; forfeit_amount_cents=amount_cents"
          - "Invoice.status=REVERSED with refund_amount_cents=0"

      - from: REOFFERED
        to: SOLD
        trigger: "POST /lots/{id}/runner-up/accept"
        actor: Bidder
        preconditions:
          - "X-User-ID == Bid record runner_up_bid_id's bidder_id"
          - "now() <= runner_up_acceptance_deadline_at"
        side_effects:
          - "winning_bidder_id := runner-up bidder"
          - "hammer_price_cents := runner-up bid amount_cents"
          - "Bid with id=runner_up_bid_id → status=WINNING; previous WINNING bid (defaulter's) remains WINNING flagged but Lot's current_winner_bid_id updates"
          - "New Invoice created replacing old Invoice (old Invoice.status=REVERSED with refund_amount_cents=0); new Invoice.status=ISSUED"
          - "Defaulter's Deposit → status=PARTIAL_REFUND with terminal_reason=WINNER_DEFAULT_REOFFER_FILLED; refund_amount_cents per §1.3 default_partial_refund calc"
          - "Runner-up's Deposit remains HELD (continues to back the new Invoice)"
          - "payment_deadline_at := now() + PAYMENT_DEADLINE_SECONDS"

      - from: REOFFERED
        to: UNSOLD
        trigger: "POST /lots/{id}/runner-up/decline OR system (now() > runner_up_acceptance_deadline_at)"
        actor: "Bidder or system"
        preconditions: []
        side_effects:
          - "Defaulter's Deposit → status=FORFEITED with terminal_reason=WINNER_DEFAULT_NO_REOFFER; refund_amount_cents=0"
          - "Runner-up's Deposit → status=RELEASED with terminal_reason=LOSING_BIDDER"
          - "Invoice.status=REVERSED with refund_amount_cents=0"

      - from: SOLD
        to: DISPUTED
        trigger: "POST /lots/{id}/disputes"
        actor: Bidder
        preconditions:
          - "Invoice.status=PAID"
          - "delivered_at IS NOT NULL"
          - "now() <= delivered_at + DISPUTE_WINDOW_SECONDS"
          - "X-User-ID == winning_bidder_id"
        side_effects:
          - "Dispute record created with status=FILED, evidence array stored"

      - from: DISPUTED
        to: SOLD
        trigger: "system (Dispute resolution outcome=DENIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot returns to SOLD; Invoice.status remains PAID (no refund)"
          - "Filer (BIDDER) dispute_loss_count incremented; risk_score recomputed"

      - from: DISPUTED
        to: REFUNDED
        trigger: "system (Dispute resolution outcome=REFUND)"
        actor: system
        preconditions: []
        side_effects:
          - "Invoice.status=REVERSED; Invoice.refund_amount_cents := Dispute.resolution_refund_amount_cents (Cascade hop 1 of refund_cascade)"
          - "Invoice.commission_reversal_amount_cents computed (§1.3 commission_reversal) (Cascade hop 2 of refund_cascade)"
          - "Seller.gross_proceeds_cents and Seller.net_proceeds_cents recomputed; net_proceeds reduced by commission_reversal_amount_cents (Cascade hop 3 of refund_cascade)"
          - "Buyer's Deposit on this lot → status=RELEASED with terminal_reason=DISPUTE_REFUND"

      - from: DISPUTED
        to: RELISTED
        trigger: "system (Dispute resolution outcome=RELIST)"
        actor: system
        preconditions: []
        side_effects:
          - "Original Invoice.status=REVERSED; refund_amount_cents := buyer_total_cents (full refund)"
          - "commission_reversal_amount_cents := original seller_commission_cents (full reversal)"
          - "A new Lot is created with status=DRAFT, copying title/category/condition/physical_item_serial/reserve_price_cents/starting_bid_cents from the original; relisted_from_lot_id := original.id; new lot's scheduled_* timestamps remain null until seller publishes"
          - "Buyer's Deposit → status=RELEASED with terminal_reason=DISPUTE_REFUND"

      - from: [DRAFT, SCHEDULED]
        to: CANCELLED
        trigger: "POST /lots/{id}/cancel"
        actor: Seller
        preconditions: ["status IN {DRAFT, SCHEDULED}", "X-User-ID == seller_id"]
        side_effects: []

  - entity: AutoBidProxy
    field: status
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (proxy resolution emits a bid that would exceed max_amount_cents)"
        actor: system
        preconditions: ["next required emission > max_amount_cents"]
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /lots/{lotId}/auto-bid-proxies/{proxyId}/cancel OR system (parent Lot reaches a terminal/closed state, or owning Bidder is SUSPENDED)"
        actor: "Bidder or system"
        preconditions: []
        side_effects: []

  - entity: Invoice
    field: status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "system (atomically with parent Lot SOLD transition)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /_events/payment-confirmed { invoice_id, paid_at }"
        actor: system
        preconditions: ["paid_at <= payment_deadline_at"]
        side_effects:
          - "paid_at recorded"
          - "Buyer's Deposit on this lot → status=RELEASED with terminal_reason=WINNER_PAID; refund_amount_cents=amount_cents"
          - "Seller.gross_proceeds_cents and Seller.net_proceeds_cents incremented by seller_payout_cents"
      - from: [PENDING, ISSUED, PAID]
        to: REVERSED
        trigger: "system (parent Lot transitions DEFAULTED→UNSOLD, REOFFERED→UNSOLD, REOFFERED→SOLD, DISPUTED→REFUNDED, or DISPUTED→RELISTED)"
        actor: system
        preconditions: []
        side_effects:
          - "If was previously PAID: Seller.gross_proceeds_cents and net_proceeds_cents decremented per §1.3 commission_reversal calc"

  - entity: Dispute
    field: status
    initial_state: FILED
    terminal_states: [RESOLVED_REFUND, RESOLVED_RELIST, RESOLVED_DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /lots/{lotId}/disputes/{id}/start-review"
        actor: ArbitratorOps
        preconditions: []
        side_effects: ["arbitrator_user_id := X-User-ID; review_started_at := now()"]
      - from: UNDER_REVIEW
        to: RESOLVED_REFUND
        trigger: "POST /lots/{lotId}/disputes/{id}/resolve { outcome: REFUND, resolution_refund_amount_cents }"
        actor: ArbitratorOps
        preconditions: ["resolution_refund_amount_cents > 0", "resolution_refund_amount_cents <= Invoice.buyer_total_cents"]
        side_effects: ["Lot transition DISPUTED → REFUNDED (see Lot machine for cascade)"]
      - from: UNDER_REVIEW
        to: RESOLVED_RELIST
        trigger: "POST /lots/{lotId}/disputes/{id}/resolve { outcome: RELIST }"
        actor: ArbitratorOps
        preconditions: []
        side_effects: ["Lot transition DISPUTED → RELISTED (see Lot machine for cascade)"]
      - from: UNDER_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /lots/{lotId}/disputes/{id}/resolve { outcome: DENIED }"
        actor: ArbitratorOps
        preconditions: []
        side_effects: ["Lot transition DISPUTED → SOLD (no refund)"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two bids on the same lot arrive simultaneously, both clearing min_required_bid"
    guarantee: "Both bids are persisted; the higher amount wins. If amounts tie, the earlier server-side placed_at wins. The losing bid's status=OUTBID; the winning bid's status=ACTIVE (or WINNING if applicable)."
    error_id: ERR_BID_NOT_HIGHER
    http_status: 409
    serialization: "Strict serialization on Lot.id; tiebreak: lower placed_at wins"
    note: "ERR_BID_NOT_HIGHER is returned to whichever request the server processes second IF that request's amount is no longer strictly greater than the now-current_price. If the second request's amount IS still higher than the new current_price, both succeed."

  - scenario: "Two AutoBidProxy creations from the same bidder for the same lot arrive simultaneously"
    guarantee: "At most one ACTIVE AutoBidProxy per (bidder_id, lot_id) at any time; the second is rejected"
    error_id: ERR_PROXY_ALREADY_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on (bidder_id, lot_id) uniqueness"

  - scenario: "Lot publish and another lot publish for the same physical_item_serial with overlapping windows arrive simultaneously"
    guarantee: "First-publisher-wins for the temporal slot; the loser's publish is rejected"
    error_id: ERR_PHYSICAL_ITEM_TIME_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on (physical_item_serial, time-window) constraint"

  - scenario: "Two payment-confirmed events for the same invoice arrive simultaneously"
    guarantee: "Exactly one wins; the loser is rejected"
    error_id: ERR_INVOICE_NOT_ISSUED
    http_status: 409
    serialization: "First-writer-wins on Invoice.status transition ISSUED→PAID"

  - scenario: "Dispute resolve and Lot SOLD→DEFAULTED auto-transition (via deadline) for the same lot arrive simultaneously"
    guarantee: "Whichever lands first wins; the other is rejected with ERR_LOT_INVALID_STATE"
    error_id: ERR_LOT_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Lot.status"

# =============================================================================
# §1.3 Calculation Rules Table (9 calculations)
# =============================================================================
calculations:
  - name: bid_increment_ladder
    trigger: "every POST /lots/{id}/bids and every AutoBidProxy emission to compute min_required_bid_cents"
    algorithm: tiered_pricing
    input_set: "Lot.current_price_cents and ladder constants below; ladder is range-keyed on current_price_cents (the BASE for the next bid), NOT on the new bid amount."
    constants:
      LADDER:
        - { upper_exclusive_cents: 10000, increment_cents: 500 }     # base in [0, 100): step 5
        - { upper_exclusive_cents: 100000, increment_cents: 1000 }   # base in [100, 1000): step 10
        - { upper_exclusive_cents: 1000000, increment_cents: 5000 }  # base in [1000, 10000): step 50
        - { upper_exclusive_cents: 10000000, increment_cents: 10000 } # base in [10000, 100000): step 100
        - { upper_exclusive_cents: null, increment_cents: 50000 }    # base in [100000, ∞): step 500
    formula: |
      def required_increment(base_cents):
          for tier in LADDER:
              if tier.upper_exclusive_cents is None or base_cents < tier.upper_exclusive_cents:
                  return tier.increment_cents
      def min_required_bid_cents(lot):
          if lot.bid_count == 0:
              return lot.starting_bid_cents
          return lot.current_price_cents + required_increment(lot.current_price_cents)
    precision: "All values integer cents; no rounding needed"
    note: "Tier lookup uses STRICT less-than against upper_exclusive_cents. Base price 99 -> tier 0 (increment 500); base price 100 -> tier 1 (increment 1000). Boundary: base price exactly equals an upper_exclusive_cents value falls into the NEXT tier."

  - name: deposit_required
    trigger: "first qualifying bid placement by a Bidder on a Lot"
    algorithm: threshold
    input_set: "Lot.reserve_price_cents and constants"
    constants:
      DEPOSIT_RATE: 0.10
      DEPOSIT_MIN_CENTS: 500
      DEPOSIT_MAX_CENTS: 1000000
    formula: |
      raw = floor(Lot.reserve_price_cents * 0.10)
      deposit_required_cents = max(DEPOSIT_MIN_CENTS, min(DEPOSIT_MAX_CENTS, raw))
    precision: "Integer cents; floor truncation on the percentage step"

  - name: soft_close_extension
    trigger: "every accepted POST /lots/{id}/bids on a LIVE lot"
    algorithm: threshold
    input_set: "now() and Lot.effective_end_at"
    constants:
      SOFT_CLOSE_TRIGGER_SECONDS: 60
      SOFT_CLOSE_EXTENSION_SECONDS: 120
    formula: |
      seconds_remaining = (Lot.effective_end_at - now()).total_seconds()
      if seconds_remaining <= SOFT_CLOSE_TRIGGER_SECONDS and seconds_remaining > 0:
          Lot.effective_end_at += SOFT_CLOSE_EXTENSION_SECONDS seconds
          Lot.extension_count += 1
          Bid.triggered_extension := True
    precision: "Datetime arithmetic to seconds (integer); inclusive 'less than or equal to 60'"
    note: "Boundary: at EXACTLY 60 seconds remaining (inclusive), extension fires. At 61 seconds remaining, it does not."

  - name: buyer_premium
    trigger: "Lot SOLD transition (Invoice creation)"
    algorithm: tiered_pricing
    input_set: "Lot.hammer_price_cents, Lot.category, Bidder.identity_verified, and constants"
    constants:
      BP_TIER_1_UPPER_INCLUSIVE_CENTS: 100000     # ≤ $1000
      BP_TIER_2_UPPER_INCLUSIVE_CENTS: 1000000    # ≤ $10000
      BP_TIER_1_RATE: 0.15
      BP_TIER_2_RATE: 0.12
      BP_TIER_3_RATE: 0.10
      JEWELRY_SURCHARGE_RATE: 0.02   # +2% if category=JEWELRY
      VERIFIED_DISCOUNT_RATE: 0.01   # -1% if Bidder.identity_verified=true
      MIN_PREMIUM_CENTS: 100
    formula: |
      # Pin: AVERAGE-rate model (single tier rate applies to entire hammer), not marginal.
      if hammer_price_cents <= BP_TIER_1_UPPER_INCLUSIVE_CENTS:
          base_rate = BP_TIER_1_RATE
      elif hammer_price_cents <= BP_TIER_2_UPPER_INCLUSIVE_CENTS:
          base_rate = BP_TIER_2_RATE
      else:
          base_rate = BP_TIER_3_RATE
      effective_rate = base_rate
      if Lot.category == 'JEWELRY':
          effective_rate += JEWELRY_SURCHARGE_RATE
      if winning_bidder.identity_verified:
          effective_rate -= VERIFIED_DISCOUNT_RATE
      buyer_premium_cents = max(MIN_PREMIUM_CENTS, floor(hammer_price_cents * effective_rate))
    precision: "Floor truncation to integer cents AFTER multiplication; no per-step rounding."
    note: "Tier boundaries are upper_INCLUSIVE: hammer = 100000 cents falls in Tier 1 (15% base). hammer = 100001 cents falls in Tier 2."

  - name: seller_commission
    trigger: "Lot SOLD transition (Invoice creation)"
    algorithm: tiered_pricing
    input_set: "Lot.hammer_price_cents and constants"
    constants:
      SC_TIER_1_UPPER_INCLUSIVE_CENTS: 500000     # ≤ $5000
      SC_TIER_2_UPPER_INCLUSIVE_CENTS: 5000000    # ≤ $50000
      SC_TIER_1_RATE: 0.10
      SC_TIER_2_RATE: 0.08
      SC_TIER_3_RATE: 0.05
    formula: |
      if hammer_price_cents <= SC_TIER_1_UPPER_INCLUSIVE_CENTS:
          rate = SC_TIER_1_RATE
      elif hammer_price_cents <= SC_TIER_2_UPPER_INCLUSIVE_CENTS:
          rate = SC_TIER_2_RATE
      else:
          rate = SC_TIER_3_RATE
      seller_commission_cents = floor(hammer_price_cents * rate)
    precision: "Floor truncation to integer cents."

  - name: commission_reversal
    trigger: "Invoice.status transitions to REVERSED via Dispute resolution outcome=REFUND"
    algorithm: chronological
    input_set: "Invoice.hammer_price_cents, Invoice.seller_commission_cents, Dispute.resolution_refund_amount_cents"
    formula: |
      # PIN: nested rounding order is (a) compute ratio rounded to 4 decimal places using ROUND_HALF_UP, (b) multiply, (c) ROUND_HALF_UP to integer cents.
      # This order is fixed; doing rounds in any other order produces a different cents value.
      raw_ratio = Decimal(refund_amount_cents) / Decimal(invoice_buyer_total_cents)   # buyer_total = hammer + buyer_premium
      ratio = raw_ratio.quantize(Decimal('0.0001'), rounding=ROUND_HALF_UP)
      commission_reversal_amount_cents = int((Decimal(invoice_seller_commission_cents) * ratio).quantize(Decimal('1'), rounding=ROUND_HALF_UP))
    precision: "Decimal arithmetic; ratio rounded to 4 dp HALF_UP, final value rounded to integer cents HALF_UP."
    note: "On RELIST outcome, refund_amount_cents = full buyer_total and commission_reversal = original seller_commission_cents (no rounding needed since ratio = 1.0000 exactly)."

  - name: default_partial_refund
    trigger: "Defaulter's Deposit transitions on Lot REOFFERED→SOLD (PARTIAL_REFUND) or REOFFERED→UNSOLD/DEFAULTED→UNSOLD (FORFEITED)"
    algorithm: threshold
    input_set: "Lot terminal sub-status (whether runner-up acceptance succeeded)"
    constants:
      PARTIAL_REFUND_RATE_WHEN_REOFFER_FILLED: 0.50
    variants:
      - name: full_forfeit
        when: "Lot transitions DEFAULTED→UNSOLD (no runner-up) OR REOFFERED→UNSOLD (runner-up declined or window expired)"
        difference: "refund_amount_cents = 0; forfeit_amount_cents = deposit.amount_cents"
      - name: partial_refund
        when: "Lot transitions REOFFERED→SOLD (runner-up accepted)"
        difference: |
          refund_amount_cents = floor(deposit.amount_cents * 0.50)
          forfeit_amount_cents = deposit.amount_cents - refund_amount_cents
    formula: |
      if variant == 'partial_refund':
          refund_amount_cents = floor(deposit.amount_cents * 0.50)
      else:
          refund_amount_cents = 0
      forfeit_amount_cents = deposit.amount_cents - refund_amount_cents
    precision: "Floor truncation to integer cents."

  - name: bidder_risk_score
    trigger: "any of: Bid.status WITHDRAWN_BY_RISK transition, Dispute resolution involving this bidder, /_sweep/risk-monitor run, /_events/account-takeover-alert, /bidders/{id}/reinstate"
    algorithm: weighted_scoring
    input_set: "Bidder.withdrawal_count, Bidder.dispute_loss_count, Bidder.shill_pattern_detected, Bidder.account_takeover_alert"
    constants:
      WITHDRAWAL_WEIGHT: 8.0     # per withdrawal
      DISPUTE_LOSS_WEIGHT: 12.0  # per dispute_loss
      ACUTE_PENALTY_SHILL: 30.0
      ACUTE_PENALTY_TAKEOVER: 20.0
      ACUTE_PENALTY_DEFAULT: 20.0
      MAX_SCORE: 100.0
      RISK_RESTRICT_THRESHOLD: 70.0
      RISK_SUSPEND_THRESHOLD: 90.0
    variants:
      - name: chronic_only
        when: "After PlatformAdmin reinstate (acute cleared), or steady-state with no acute event"
        difference: "risk_score = chronic_score; acute_score = 0"
      - name: chronic_plus_acute
        when: "After a triggering acute event (shill detection sweep flag, account-takeover event, default)"
        difference: |
          chronic_score is recomputed normally.
          acute_score is the cumulative sum of acute penalties since the last reinstate.
          risk_score = min(MAX_SCORE, chronic_score + acute_score).
    formula: |
      chronic_score = min(MAX_SCORE, withdrawal_count * WITHDRAWAL_WEIGHT + dispute_loss_count * DISPUTE_LOSS_WEIGHT)
      acute_score = (ACUTE_PENALTY_SHILL if shill_pattern_detected else 0) \
                  + (ACUTE_PENALTY_TAKEOVER if account_takeover_alert else 0) \
                  + ACUTE_PENALTY_DEFAULT * count_of_recorded_defaults_since_last_reinstate
      risk_score = min(MAX_SCORE, chronic_score + acute_score)
      # Threshold side-effects:
      if risk_score >= RISK_SUSPEND_THRESHOLD: Bidder.status → SUSPENDED (cascades per §1.2)
      elif risk_score >= RISK_RESTRICT_THRESHOLD: Bidder.status → RESTRICTED (no cascade)
    precision: "IEEE-754 double; round_half_up to 1 decimal place when stored in Bidder.risk_score."

  - name: lot_current_state
    trigger: "every Bid placement, AutoBidProxy emission, Bid status change to WITHDRAWN_BY_RISK"
    algorithm: aggregation
    input_set: "all Bids on Lot with status IN {ACTIVE, WINNING}"
    formula: |
      eligible = Bids where lot_id=Lot.id and status IN {ACTIVE, WINNING}
      if not eligible:
          current_price_cents = Lot.starting_bid_cents - 1  (placeholder; treat as 'no bids')
          current_winner_bid_id = null
          current_winner_bidder_id = null
          runner_up_bid_id = null
      else:
          # Sort by amount_cents DESC, then placed_at ASC (earlier wins ties)
          ranked = sort(eligible, key=lambda b: (-b.amount_cents, b.placed_at))
          top = ranked[0]
          current_price_cents = top.amount_cents
          current_winner_bid_id = top.id
          current_winner_bidder_id = top.bidder_id
          # Runner-up = highest bid from a DISTINCT bidder, ranked by amount DESC then placed_at ASC
          rest = [b for b in ranked if b.bidder_id != top.bidder_id]
          runner_up_bid_id = rest[0].id if rest else null
      bid_count = count of Bids where lot_id=Lot.id and status IN {ACTIVE, WINNING, OUTBID}
      has_met_reserve = (current_price_cents >= reserve_price_cents)
    precision: "Integer cents; deterministic ordering by (amount_cents DESC, placed_at ASC)."

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty; X-User-Role must be one of {Bidder, Seller, ArbitratorOps, PlatformAdmin, Anonymous}"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be authorized to invoke this endpoint per §1.7"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "All path-parameter resource IDs must resolve to existing entities (validated left-to-right)"
    error_id: "ERR_LOT_NOT_FOUND | ERR_BIDDER_NOT_FOUND | ERR_SELLER_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_PROXY_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 4
    category: state
    check: "Target resource must be in a valid state for the requested transition or operation"
    error_id: "ERR_LOT_INVALID_STATE | ERR_BID_INVALID_STATE | ERR_PROXY_INVALID_STATE | ERR_INVOICE_NOT_ISSUED | ERR_DISPUTE_INVALID_STATE | ERR_LOT_NOT_LIVE"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 5
    category: business_safety
    check: "Bidder must be ACTIVE to place bids, create proxies, accept runner-up offers, or file disputes (RESTRICTED and SUSPENDED block these)"
    error_id: ERR_BIDDER_RESTRICTED
    http_status: 403
    applies_to: "POST /lots/{id}/bids; POST /lots/{id}/auto-bid-proxies; POST /lots/{id}/runner-up/accept; POST /lots/{id}/disputes"

  - priority: 6
    category: business_safety
    check: "Bidder must not be affiliated with the lot's seller (Bidder.affiliated_seller_id != Lot.seller_id)"
    error_id: ERR_SHILL_AFFILIATION
    http_status: 403
    applies_to: "POST /lots/{id}/bids; POST /lots/{id}/auto-bid-proxies"

  - priority: 7
    category: business_referential
    check: "Cross-entity ownership/identity: X-User-ID must match the operating entity (e.g., Lot.seller_id for Seller actions, Bid.bidder_id-resolved for Bidder actions, Lot.winning_bidder_id for runner-up accept)"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all mutation endpoints with role-bound ownership"

  - priority: 8
    category: business_constraint
    check: "Bid amount must be ≥ min_required_bid_cents (per §1.3 bid_increment_ladder); strictly greater than current_price_cents when bid_count > 0"
    error_id: ERR_BID_BELOW_MIN_INCREMENT
    http_status: 422
    applies_to: "POST /lots/{id}/bids"

  - priority: 9
    category: business_constraint
    check: "Bid amount must be > current_price_cents when bid_count > 0 (catches duplicate-amount races even if increment-ladder check passes)"
    error_id: ERR_BID_NOT_HIGHER
    http_status: 409
    applies_to: "POST /lots/{id}/bids"

  - priority: 10
    category: business_constraint
    check: "AutoBidProxy max_amount_cents must be ≥ current min_required_bid_cents at create time; only one ACTIVE proxy per (bidder_id, lot_id)"
    error_id: "ERR_PROXY_MAX_TOO_LOW | ERR_PROXY_ALREADY_ACTIVE"
    http_status: "422 | 409"
    applies_to: "POST /lots/{id}/auto-bid-proxies"

  - priority: 11
    category: business_temporal
    check: "Lot.scheduled_end_at - scheduled_start_at >= 3600s; scheduled_start_at > now() at publish; runner-up acceptance must be before runner_up_acceptance_deadline_at; dispute filing must be within DISPUTE_WINDOW_SECONDS of delivered_at"
    error_id: "ERR_LOT_DURATION_TOO_SHORT | ERR_LOT_START_IN_PAST | ERR_RUNNER_UP_WINDOW_EXPIRED | ERR_DISPUTE_WINDOW_EXPIRED"
    http_status: "422 | 409"
    applies_to: "POST /lots/{id}/publish; POST /lots/{id}/runner-up/accept; POST /lots/{id}/disputes"

  - priority: 12
    category: business_temporal
    check: "No two Lots may have overlapping [scheduled_start_at, effective_end_at) intervals for the same physical_item_serial in any active status"
    error_id: ERR_PHYSICAL_ITEM_TIME_OVERLAP
    http_status: 409
    applies_to: "POST /lots/{id}/publish"

  - priority: 13
    category: business_fiscal
    check: "Bidder.wallet_balance_cents must cover deposit_required_cents at first qualifying bid placement; aggregate held_deposit_cents (existing) + deposit_required_cents (new) must NOT exceed wallet_balance_cents (only when this lot has no existing HELD deposit for this bidder)"
    error_id: ERR_INSUFFICIENT_DEPOSIT_FUNDS
    http_status: 402
    applies_to: "POST /lots/{id}/bids"

  - priority: 14
    category: business_constraint
    check: "Dispute.resolution_refund_amount_cents must satisfy 0 ≤ amount ≤ Invoice.buyer_total_cents; required >0 when outcome=REFUND, must be 0 (or omitted) when outcome=DENIED or RELIST"
    error_id: ERR_INVALID_REFUND_AMOUNT
    http_status: 422
    applies_to: "POST /lots/{lotId}/disputes/{id}/resolve"

# =============================================================================
# §1.5 API Endpoint Table (28 endpoints)
# =============================================================================
endpoints:
  # --- Sellers ---
  - method: POST
    path: "/sellers"
    description: "Create a Seller (PlatformAdmin operator action; X-User-ID is the new Seller's id and is generated by the server)"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name]
    output: Seller
    side_effects: ["status=ACTIVE; counters initialized to 0"]

  - method: GET
    path: "/sellers/{sellerId}"
    description: "Read seller (includes computed counters)"
    roles: [PlatformAdmin, Seller, Bidder, ArbitratorOps, Anonymous]
    code: 200
    input: []
    output: Seller
    side_effects: []

  # --- Bidders ---
  - method: POST
    path: "/bidders"
    description: "Register a Bidder"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, "affiliated_seller_id?"]
    output: Bidder
    side_effects: ["status=ACTIVE; identity_verified=false; wallet_balance_cents=0; risk_score=0"]

  - method: GET
    path: "/bidders/{bidderId}"
    description: "Read bidder"
    roles: [PlatformAdmin, Bidder, ArbitratorOps]
    code: 200
    input: []
    output: Bidder
    side_effects: []

  - method: POST
    path: "/bidders/{bidderId}/wallet/credit"
    description: "Credit bidder's wallet (operator top-up)"
    roles: [PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: Bidder
    side_effects: ["wallet_balance_cents += amount_cents; amount_cents must be ≥ 1"]

  - method: POST
    path: "/bidders/{bidderId}/restrict"
    description: "Manually move bidder to RESTRICTED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Bidder
    side_effects: ["status=RESTRICTED"]

  - method: POST
    path: "/bidders/{bidderId}/suspend"
    description: "Manually move bidder to SUSPENDED (triggers full cascade per §1.2)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Bidder
    side_effects: ["status=SUSPENDED with cascade hops 1–3 of bidder_suspend_cascade"]

  - method: POST
    path: "/bidders/{bidderId}/reinstate"
    description: "Restore bidder to ACTIVE; clears acute_score, account_takeover_alert, shill_pattern_detected"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Bidder
    side_effects: ["status=ACTIVE; risk_score recomputed from chronic_score only"]

  # --- Lots ---
  - method: POST
    path: "/lots"
    description: "Create a Lot in DRAFT"
    roles: [Seller]
    code: 201
    input: [seller_id, title, category, condition, physical_item_serial, reserve_price_cents, starting_bid_cents, scheduled_start_at, scheduled_end_at]
    output: Lot
    side_effects: ["status=DRAFT; effective_end_at=null; current_price_cents=starting_bid_cents-1"]

  - method: GET
    path: "/lots/{lotId}"
    description: "Read Lot"
    roles: [PlatformAdmin, Seller, Bidder, ArbitratorOps, Anonymous]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots"
    description: "List lots with filtering by status and category; supports pagination"
    roles: [PlatformAdmin, Seller, Bidder, ArbitratorOps, Anonymous]
    code: 200
    input: ["status?", "category?", "seller_id?", "limit?", "offset?"]
    output: "Lot[]"
    side_effects: []

  - method: POST
    path: "/lots/{lotId}/publish"
    description: "Move Lot DRAFT→SCHEDULED (validates schedule and physical_item_serial overlap)"
    roles: [Seller]
    code: 200
    input: []
    output: Lot
    side_effects: ["status=SCHEDULED; effective_end_at=scheduled_end_at"]

  - method: POST
    path: "/lots/{lotId}/cancel"
    description: "Cancel Lot in DRAFT or SCHEDULED"
    roles: [Seller]
    code: 200
    input: []
    output: Lot
    side_effects: ["status=CANCELLED"]

  # --- Bids ---
  - method: POST
    path: "/lots/{lotId}/bids"
    description: "Place a manual bid on a LIVE Lot"
    roles: [Bidder]
    code: 201
    input: [amount_cents]
    output: Bid
    side_effects:
      - "Validates per §1.4 priorities 5–9, 13"
      - "Creates or reuses Deposit (HELD); on first qualifying bid by this bidder for this lot, deposit_required_cents per §1.3 is held from wallet"
      - "lot_current_state recomputed (current_price, current_winner, runner_up)"
      - "soft_close_extension calc may extend Lot.effective_end_at (sets Bid.triggered_extension)"
      - "Any AutoBidProxies on this lot (other bidders) emit responsive bids per proxy resolution algorithm"

  - method: GET
    path: "/lots/{lotId}/bids"
    description: "List bids for a lot (sorted by placed_at DESC); does NOT redact bidder_id (auction is open per scaffold)"
    roles: [PlatformAdmin, Seller, Bidder, ArbitratorOps, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: "Bid[]"
    side_effects: []

  # --- AutoBid Proxies ---
  - method: POST
    path: "/lots/{lotId}/auto-bid-proxies"
    description: "Create an AutoBidProxy with a maximum amount; immediately resolves against current state and may emit one initial bid"
    roles: [Bidder]
    code: 201
    input: [max_amount_cents]
    output: AutoBidProxy
    side_effects:
      - "Validates Bidder is ACTIVE, no existing ACTIVE proxy, max_amount_cents ≥ current min_required_bid"
      - "Creates Deposit if first qualifying placement"
      - "Immediate resolution: emits a Bid for min_required_bid_cents if no current bid OR if this bidder is not currently winning"

  - method: GET
    path: "/lots/{lotId}/auto-bid-proxies/{proxyId}"
    description: "Read AutoBidProxy (max_amount_cents masked when X-User-ID is not the proxy owner)"
    roles: [PlatformAdmin, Bidder, ArbitratorOps]
    code: 200
    input: []
    output: AutoBidProxy
    side_effects: []

  - method: POST
    path: "/lots/{lotId}/auto-bid-proxies/{proxyId}/cancel"
    description: "Cancel a still-ACTIVE AutoBidProxy"
    roles: [Bidder]
    code: 200
    input: []
    output: AutoBidProxy
    side_effects: ["status=CANCELLED"]

  # --- Lot lifecycle / settlement ---
  - method: POST
    path: "/lots/{lotId}/winner/default"
    description: "Mark winning bidder as defaulted (triggers DEFAULTED transition and cascades)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Lot
    side_effects: ["Lot status SOLD→DEFAULTED; cascades into REOFFERED or UNSOLD per §1.2"]

  - method: POST
    path: "/lots/{lotId}/runner-up/accept"
    description: "Runner-up accepts the offered hammer-price after winner default"
    roles: [Bidder]
    code: 200
    input: []
    output: Lot
    side_effects: ["Lot status REOFFERED→SOLD with full settlement cascade per §1.2"]

  - method: POST
    path: "/lots/{lotId}/runner-up/decline"
    description: "Runner-up declines the offered hammer-price; lot becomes UNSOLD"
    roles: [Bidder]
    code: 200
    input: []
    output: Lot
    side_effects: ["Lot status REOFFERED→UNSOLD"]

  # --- Invoices ---
  - method: GET
    path: "/lots/{lotId}/invoice"
    description: "Read the Lot's Invoice (one per lot lifetime)"
    roles: [PlatformAdmin, Seller, Bidder, ArbitratorOps]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  # --- Disputes ---
  - method: POST
    path: "/lots/{lotId}/disputes"
    description: "File a dispute on a SOLD lot whose Invoice is PAID and within dispute window"
    roles: [Bidder]
    code: 201
    input: [filed_by, reason, evidence, claimed_refund_amount_cents]
    output: Dispute
    side_effects: ["Dispute status=FILED; Lot status SOLD→DISPUTED"]

  - method: POST
    path: "/lots/{lotId}/disputes/{disputeId}/start-review"
    description: "ArbitratorOps starts review"
    roles: [ArbitratorOps]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute status=UNDER_REVIEW; arbitrator_user_id and review_started_at recorded"]

  - method: POST
    path: "/lots/{lotId}/disputes/{disputeId}/resolve"
    description: "Resolve a dispute UNDER_REVIEW with one of REFUND, RELIST, DENIED outcomes"
    roles: [ArbitratorOps]
    code: 200
    input: [outcome, "resolution_refund_amount_cents?"]
    output: Dispute
    side_effects:
      - "REFUND: cascade per §1.2 Lot DISPUTED→REFUNDED (Invoice REVERSED, commission_reversal, seller balances debited)"
      - "RELIST: cascade per §1.2 Lot DISPUTED→RELISTED (new DRAFT Lot created copying spec; original Invoice REVERSED with full refund)"
      - "DENIED: Lot DISPUTED→SOLD; bidder dispute_loss_count incremented; risk_score recomputed"

  # --- Test-driving / event-ingestion endpoints (testability completeness) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance the deterministic system clock by N seconds (tests use this in lieu of wall-clock waits)"
    roles: [PlatformAdmin]
    code: 200
    input: [seconds]
    output: "{ now: datetime }"
    side_effects:
      - "All time-gated transitions evaluated against new now(): SCHEDULED→LIVE; LIVE→SOLD/UNSOLD; SOLD→DEFAULTED on payment_deadline_at expiry; REOFFERED→UNSOLD on runner_up_acceptance_deadline_at expiry"

  - method: POST
    path: "/_events/payment-confirmed"
    description: "Ingest a payment-confirmed event from the external payment system"
    roles: [PlatformAdmin]
    code: 200
    input: [invoice_id, paid_at]
    output: Invoice
    side_effects: ["Invoice ISSUED→PAID with cascade per §1.2"]

  - method: POST
    path: "/_events/identity-verified"
    description: "Ingest an identity-verification event"
    roles: [PlatformAdmin]
    code: 200
    input: [bidder_id, verified_at]
    output: Bidder
    side_effects: ["identity_verified=true (does not retroactively recompute past invoices)"]

  - method: POST
    path: "/_events/logistics-delivered"
    description: "Ingest a logistics-delivered event; starts the dispute window"
    roles: [PlatformAdmin]
    code: 200
    input: [lot_id, delivered_at]
    output: Lot
    side_effects: ["Lot.delivered_at recorded; dispute window opens"]

  - method: POST
    path: "/_events/account-takeover-alert"
    description: "Ingest an account-takeover risk alert from the identity system; flips Bidder.account_takeover_alert and recomputes risk_score (may cross threshold and cascade)"
    roles: [PlatformAdmin]
    code: 200
    input: [bidder_id]
    output: Bidder
    side_effects: ["account_takeover_alert=true; acute_score includes ACUTE_PENALTY_TAKEOVER; bidder may auto-RESTRICT or auto-SUSPEND"]

  - method: POST
    path: "/_sweep/risk-monitor"
    description: "Run the abnormal-bid-pattern detection sweep (testability for detection-driven flag flip)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ flagged_bidder_ids: array }"
    side_effects:
      - "Examines all Bid records placed within the last SHILL_DETECTION_VELOCITY_WINDOW_SECONDS = 30s window of system clock"
      - "Flags any bidder who placed > SHILL_DETECTION_VELOCITY_THRESHOLD = 3 bids on a single lot within that window: shill_pattern_detected=true; acute_score includes ACUTE_PENALTY_SHILL; risk_score recomputed"

# =============================================================================
# §1.6 Error Code Catalog (27 errors)
# =============================================================================
errors:
  # --- Request-level / auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID and/or X-User-Role missing, empty, or unrecognized role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, or out-of-range scalar" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Authenticated role is not permitted to invoke this endpoint per §1.7" }
  - { id: ERR_IDENTITY_MISMATCH, http: 403, condition: "X-User-ID does not match the resource's owning entity for this role-bound action" }

  # --- Existence ---
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "Seller id does not resolve" }
  - { id: ERR_BIDDER_NOT_FOUND, http: 404, condition: "Bidder id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "Lot id does not resolve" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "Bid id does not resolve" }
  - { id: ERR_PROXY_NOT_FOUND, http: 404, condition: "AutoBidProxy id does not resolve" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice for the given lot does not exist (lot never reached SOLD)" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not resolve" }

  # --- State ---
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "Lot status does not permit the requested operation (e.g., publish on non-DRAFT, cancel on non-DRAFT/SCHEDULED, runner-up actions outside REOFFERED, default outside SOLD)" }
  - { id: ERR_LOT_NOT_LIVE, http: 409, condition: "Bid placement attempted while Lot is not LIVE (DRAFT/SCHEDULED/SOLD/UNSOLD/CANCELLED/etc.)" }
  - { id: ERR_BID_INVALID_STATE, http: 409, condition: "Bid is not in a state that permits the action" }
  - { id: ERR_PROXY_INVALID_STATE, http: 409, condition: "AutoBidProxy is not ACTIVE (already EXHAUSTED or CANCELLED)" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "Operation requires Invoice.status=ISSUED (e.g., payment-confirmed event on PENDING/PAID/REVERSED)" }
  - { id: ERR_DISPUTE_INVALID_STATE, http: 409, condition: "Dispute status does not permit the requested transition (e.g., resolve on FILED before review, start-review on UNDER_REVIEW)" }

  # --- Business safety ---
  - { id: ERR_BIDDER_RESTRICTED, http: 403, condition: "Bidder.status is RESTRICTED or SUSPENDED; cannot place bids, create proxies, accept runner-up, or file disputes" }
  - { id: ERR_SHILL_AFFILIATION, http: 403, condition: "Bidder.affiliated_seller_id == Lot.seller_id; bidding on affiliated seller's lots is forbidden" }

  # --- Business constraints ---
  - { id: ERR_BID_BELOW_MIN_INCREMENT, http: 422, condition: "Bid amount is below the ladder-derived min_required_bid_cents" }
  - { id: ERR_BID_NOT_HIGHER, http: 409, condition: "Bid amount is not strictly greater than current_price_cents (race loser case)" }
  - { id: ERR_PROXY_MAX_TOO_LOW, http: 422, condition: "AutoBidProxy.max_amount_cents is below current min_required_bid_cents" }
  - { id: ERR_PROXY_ALREADY_ACTIVE, http: 409, condition: "An ACTIVE AutoBidProxy already exists for this (bidder_id, lot_id)" }
  - { id: ERR_INVALID_REFUND_AMOUNT, http: 422, condition: "Dispute.resolution_refund_amount_cents out of range, or required-but-missing for REFUND, or non-zero for DENIED/RELIST" }

  # --- Business temporal ---
  - { id: ERR_LOT_DURATION_TOO_SHORT, http: 422, condition: "Lot scheduled_end_at - scheduled_start_at < 3600 seconds" }
  - { id: ERR_LOT_START_IN_PAST, http: 422, condition: "Lot scheduled_start_at <= now() at publish time" }
  - { id: ERR_PHYSICAL_ITEM_TIME_OVERLAP, http: 409, condition: "Another active Lot with the same physical_item_serial overlaps the requested [scheduled_start_at, effective_end_at) interval" }
  - { id: ERR_RUNNER_UP_WINDOW_EXPIRED, http: 409, condition: "Runner-up acceptance attempted after runner_up_acceptance_deadline_at" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 409, condition: "Dispute filing attempted more than DISPUTE_WINDOW_SECONDS after delivered_at" }

  # --- Business fiscal ---
  - { id: ERR_INSUFFICIENT_DEPOSIT_FUNDS, http: 402, condition: "Bidder.wallet_balance_cents - held_deposit_cents < deposit_required_cents at first qualifying bid placement on this lot" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Seller
    description: "Lot creator; manages own lots in DRAFT/SCHEDULED states"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /lots — create lot (Seller's id must equal X-User-ID and seller_id in body)"
      - "POST /lots/{id}/publish — publish own lot"
      - "POST /lots/{id}/cancel — cancel own lot in DRAFT/SCHEDULED"
    shared_operations:
      - "GET /lots/{id}, GET /lots, GET /lots/{id}/bids, GET /lots/{id}/invoice — read access"
      - "GET /sellers/{id} — read seller (only own profile yields full computed counters; others receive a redacted view, but per §1.5 no separate redaction is required for v1)"

  - name: Bidder
    description: "Auction participant; places bids, runs proxies, files disputes as buyer"
    identity: "entity_backed:Bidder"
    exclusive_operations:
      - "POST /lots/{id}/bids — place bid"
      - "POST /lots/{id}/auto-bid-proxies — create AutoBidProxy"
      - "POST /lots/{id}/auto-bid-proxies/{proxyId}/cancel — cancel own proxy"
      - "POST /lots/{id}/runner-up/accept — accept runner-up offer (must equal runner_up Bidder.id)"
      - "POST /lots/{id}/runner-up/decline — decline runner-up offer"
      - "POST /lots/{id}/disputes — file dispute (must equal winning_bidder_id of the lot)"
    shared_operations:
      - "GET /lots/{id}, GET /lots, GET /lots/{id}/bids, GET /lots/{id}/auto-bid-proxies/{proxyId}, GET /lots/{id}/invoice"
      - "GET /bidders/{id} — read bidder (any bidder; computed risk score and wallet visible only on own profile per §1.7 implementation-defined; v1 returns full record for any caller)"

  - name: ArbitratorOps
    description: "Operations role for dispute review and resolution"
    identity: opaque
    exclusive_operations:
      - "POST /lots/{id}/disputes/{disputeId}/start-review"
      - "POST /lots/{id}/disputes/{disputeId}/resolve"
    shared_operations:
      - "GET /lots/{id}, GET /lots, GET /lots/{id}/bids, GET /lots/{id}/invoice — read access"
      - "GET /bidders/{id}, GET /sellers/{id} — read"

  - name: PlatformAdmin
    description: "Operator superuser; manages entity creation, manual lifecycle overrides, and clock/event ingestion"
    identity: opaque
    exclusive_operations:
      - "POST /sellers, POST /bidders"
      - "POST /bidders/{id}/wallet/credit"
      - "POST /bidders/{id}/restrict, POST /bidders/{id}/suspend, POST /bidders/{id}/reinstate"
      - "POST /lots/{id}/winner/default"
      - "POST /_clock/advance"
      - "POST /_events/payment-confirmed, POST /_events/identity-verified, POST /_events/logistics-delivered, POST /_events/account-takeover-alert"
      - "POST /_sweep/risk-monitor"
    shared_operations:
      - "All GET endpoints"

  - name: Anonymous
    description: "Unauthenticated read access for public endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /lots, GET /lots/{id}, GET /lots/{id}/bids, GET /sellers/{id}"
