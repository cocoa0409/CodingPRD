  - rule_id: priority_pair_validation_conflict
    instances:
      - name: schedule_state_precondition_outranks_foc_window_violation
        grounds:
          - validations[priority=12]
          - validations[priority=41]
          - errors[ERR_PORT_REQUEST_NOT_SCHEDULABLE]
          - errors[ERR_CUTOVER_BEFORE_FOC]
          - calculations.earliest_cutover_floor
        distinguishing_aspect: |
          The single request violates a `state` rule (priority 12, the port request is already
          SCHEDULED so it is not VALIDATED) and a `business_temporal` rule (priority 41, the chosen
          slot starts 2026-08-04T10:00:00Z which is before the request's earliest_cutover_at of
          2026-08-06T00:00:00Z); the response must be 409 ERR_PORT_REQUEST_NOT_SCHEDULABLE and never
          422 ERR_CUTOVER_BEFORE_FOC - the state/business_temporal category pair.
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z (a Monday); STRICT carrier with foc_business_days 3 and porting_buffer_minutes 60"
            - "port request VALIDATED with earliest_cutover_at 2026-08-06T00:00:00Z, then SCHEDULED onto slot S1 [2026-08-10T14:00Z, 2026-08-10T18:00Z)"
            - "a second OPEN slot S2 [2026-08-04T10:00Z, 2026-08-04T12:00Z) on the same carrier, before the FOC floor and not overlapping S1 even after the 60-minute buffer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0009", billing_name: "IRONWOOD SA", service_state_code: "CA", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/carriers"
              payload: { name: "Pacific Legacy", ocn: "PL03", csr_match_policy: "STRICT", porting_buffer_minutes: 60, foc_business_days: 3 }
              as: PlatformAdmin
              captures: { car_id: $.data.id }
            - call: "POST /voip/port-requests"
              payload: { account_id: "${acct_id}", losing_carrier_id: "${car_id}", requested_numbers: ["+14155550003"], claimed_account_number: "CSR-ACC-009", claimed_pin: "3141", claimed_billing_name: "IRONWOOD SA", claimed_address_line1: "12 FORGE WAY", claimed_zip: "94577" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { pr_id: $.data.id, pr_v1: $.data.version }
            - call: "POST /voip/port-requests/${pr_id}/csr-snapshots"
              payload: { account_number_on_file: "CSR-ACC-009", pin_on_file: "3141", billing_name_on_file: "IRONWOOD SA", address_line1_on_file: "12 FORGE WAY", zip_on_file: "94577", expected_port_request_version: "${pr_v1}" }
              as: CarrierLiaison
              as_user_id: "liaison-1"
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "${car_id}", window_start: "2026-08-10T14:00:00Z", window_end: "2026-08-10T18:00:00Z" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { slot1_id: $.data.id }
            - call: "POST /voip/cutover-slots"
              payload: { carrier_id: "${car_id}", window_start: "2026-08-04T10:00:00Z", window_end: "2026-08-04T12:00:00Z" }
              as: PortingSpecialist
              as_user_id: "porting-1"
              captures: { slot2_id: $.data.id }
            - call: "POST /voip/port-requests/${pr_id}/schedule"
              payload: { cutover_slot_id: "${slot1_id}" }
              as: PortingSpecialist
              as_user_id: "porting-1"
          trigger:
            - call: "POST /voip/port-requests/${pr_id}/schedule"
              payload: { cutover_slot_id: "${slot2_id}" }
              as: PortingSpecialist
              as_user_id: "porting-1"
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_PORT_REQUEST_NOT_SCHEDULABLE"
            - "the trigger does NOT return ERR_CUTOVER_BEFORE_FOC and does NOT return 422"
            - "PortRequest.${pr_id}.status == SCHEDULED and earliest_cutover_at == 2026-08-06T00:00:00Z"
            - "CutoverSlot.${slot2_id}.status == OPEN and booked_port_request_id == null"
            - "CutoverSlot.${slot1_id}.status == BOOKED and booked_port_request_id == '${pr_id}'"

      - name: e911_suspension_outranks_intl_spend_cap_on_call_attempt
        grounds:
          - validations[priority=24]
          - validations[priority=53]
          - errors[ERR_DEVICE_911_SUSPENDED]
          - errors[ERR_INTL_SPEND_CAP_EXCEEDED]
          - state_machines.Device.ADDRESS_UNVERIFIED_to_SUSPENDED_911
        distinguishing_aspect: |
          The single call attempt violates a `business_safety` rule (priority 24, the device's
          registration was REJECTED so registration_status is SUSPENDED_911) and a `business_fiscal`
          rule (priority 53, a 3600-second call to country code 44 projects 720 cents against an
          intl_daily_cap_cents of 1); the response must be 409 ERR_DEVICE_911_SUSPENDED and never 402
          ERR_INTL_SPEND_CAP_EXCEEDED - the business_safety/business_fiscal category pair, distinct
          from the state/business_temporal pair of the scheduling instance.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ACTIVE account with intl_calling_enabled true and intl_daily_cap_cents 1"
            - "one non-nomadic device holding a number whose captured registration was REJECTED, so registration_status == SUSPENDED_911"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0010", billing_name: "JUNIPER KK", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: true, intl_daily_cap_cents: 1 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415562", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0801" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000061", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "999 NOWHERE RD", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "REJECTED", rejection_note: "address is not a dispatchable location" }
              as: E911Validator
          trigger:
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900123", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_DEVICE_911_SUSPENDED"
            - "the trigger does NOT return ERR_INTL_SPEND_CAP_EXCEEDED, ERR_ACCOUNT_E911_BLOCKED or HTTP 402"
            - "Device.${dev_id}.registration_status == SUSPENDED_911"
            - "E911Registration.${reg_id}.verification_status == REJECTED"
            - "Account.${acct_id}.e911_compliance_posture == BLOCKED"
            - "GET /voip/devices/${dev_id}/call-attempts returns exactly 1 row with decision == BLOCKED_E911 and decision_error_id == 'ERR_DEVICE_911_SUSPENDED'"

  - rule_id: boundary_precision_check
    instances:
      - name: intl_spend_cap_blocks_one_cent_above_ceiling_and_excludes_blocked_spend
        grounds:
          - calculations.international_spend_control
          - validations[priority=53]
          - errors[ERR_INTL_SPEND_CAP_EXCEEDED]
          - entities.CallAttempt.fields.projected_day_total_cents
        distinguishing_aspect: |
          The cap comparison is strictly greater-than on whole cents: with intl_daily_cap_cents 2267
          the third 3600-second call to country code 44 projects exactly 2268 and is refused because
          2268 > 2267 by one cent, and because a refused attempt never joins the ALLOWED same-day
          subtotal, a fourth identical call still reports day_subtotal_cents 2160 rather than 4320.
        test_recipe:
          setup:
            - "clock at 2026-08-05T12:00:00Z; device created 2026-08-01T00:00:00Z so no new-device multiplier"
            - "ACTIVE account with intl_calling_enabled true and intl_daily_cap_cents 2267"
            - "one non-nomadic device holding a number with a VERIFIED registration"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/accounts"
              payload: { account_number: "ACCT0011", billing_name: "KESTREL BV", service_state_code: "CA", status: "ACTIVE", intl_calling_enabled: true, intl_daily_cap_cents: 2267 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /voip/jurisdictions"
              payload: { state_code: "CA", county_fips: "06001", fee_type: "PER_LINE", monthly_fee_cents: 175, remit_day_of_month: 5 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /voip/number-blocks"
              payload: { jurisdiction_id: "${jur_id}", npa_nxx: "415563", total_capacity: 20, max_concurrent_reservations: 5 }
              as: NumberingAdmin
              captures: { blk_id: $.data.id }
            - call: "POST /voip/number-blocks/${blk_id}/phone-numbers"
              payload: { line_number: "0901" }
              as: NumberingAdmin
              captures: { pn1_id: $.data.id }
            - call: "POST /voip/devices"
              payload: { account_id: "${acct_id}", mac_address: "AABBCC000071", device_type: "BASE_STATION", nomadic: false, assigned_number_id: "${pn1_id}" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /voip/e911-registrations"
              payload: { device_id: "${dev_id}", jurisdiction_id: "${jur_id}", address_line1: "55 KESTREL CT", unit: "", city: "OAKLAND", state_code: "CA", postal_code: "94601" }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /voip/e911-registrations/${reg_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: E911Validator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900001", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca1_id: $.data.id }
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900002", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
              captures: { ca2_id: $.data.id }
          trigger:
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900003", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
            - call: "POST /voip/devices/${dev_id}/call-attempts"
              payload: { destination_e164: "+447700900004", destination_country_code: "44", requested_duration_seconds: 3600 }
              as: AccountAdmin
              as_user_id: "${acct_id}"
          assert:
            - "CallAttempt.${ca1_id}.projected_day_total_cents == 720 and decision == ALLOWED"
            - "CallAttempt.${ca2_id}.projected_day_total_cents == 1440 and decision == ALLOWED"
            - "the third call-attempt POST returns HTTP 402 with error_id ERR_INTL_SPEND_CAP_EXCEEDED"
            - "the fourth call-attempt POST also returns HTTP 402 with error_id ERR_INTL_SPEND_CAP_EXCEEDED"
            - "GET /voip/devices/${dev_id}/call-attempts?decision=BLOCKED_SPEND_CAP returns exactly 2 rows, each with day_subtotal_cents == 2160, surcharge_pct_applied == 5 and projected_day_total_cents == 2268"
            - "GET /voip/devices/${dev_id}/call-attempts?decision=ALLOWED returns exactly 2 rows"
            - "Device.${dev_id}.calling_status == UNRESTRICTED and fraud_block_count == 0"

      - name: block_reservation_capacity_admits_the_limit_and_refuses_the_next
        grounds:
          - calculations.reservation_interval_capacity
          - validations[priority=45]
          - errors[ERR_BLOCK_RESERVATION_CAPACITY_EXCEEDED]
