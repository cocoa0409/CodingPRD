              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/estimates"
              payload: {}
              as: Estimator
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/estimates/${est_id}/price"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EMPTY_ESTIMATE"
            - "Estimate.${est_id}.status == DRAFT (unchanged)"

