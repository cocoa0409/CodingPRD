            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 500, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "c1", sale_price_cents: 100, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 90, adjustment_pct: 0.005 }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { e1_adj: $.data.adjusted_sale_value_cents }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "c2", sale_price_cents: 100, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 90, adjustment_pct: 0.015 }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { e2_adj: $.data.adjusted_sale_value_cents }
          trigger:
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
              captures: { req: $.data.requested_value_cents }
          assert:
            - "Evidence e1.adjusted_sale_value_cents == 101"
            - "Evidence e2.adjusted_sale_value_cents == 102"
            - "Appeal.${ap_id}.requested_value_cents == 102"

  - rule_id: non_linear_state_machine
    instances:
      - name: ni_appeal_branch_settled_side_effects
        grounds:
          - state_machines.Appeal.HEARING_SCHEDULED_to_SETTLED
          - state_machines.Appeal.HEARING_SCHEDULED_to_DECIDED
          - entities.Appeal.fields.outcome_source
          - entities.Appeal.fields.settlement_value_cents
        distinguishing_aspect: |
          Appeal is a BRANCHING machine: from HEARING_SCHEDULED the SETTLED branch (offer accept)
          sets settlement_value_cents and outcome_source=SETTLEMENT and leaves decision_value_cents
          unset — a side-effect set disjoint from the DECIDED branch (which sets decision_value_cents
          & outcome_source=HEARING_DECISION). Branching lives on the Appeal entity.
        test_recipe:
          setup:
            - "Filed appeal (SALES_COMPARISON requested 30000000). Analyst an creates an offer of 26000000; a DIFFERENT analyst an2 accepts it (SoD ok)."
          setup_api_calls:
            - call: "POST /api/analysts"
              payload: { full_name: "A", email: "a5@f.test", license_number: "L7" }
              as: FirmAdmin
              captures: { an_id: $.data.id }
            - call: "POST /api/analysts"
