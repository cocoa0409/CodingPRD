scaffold_corner_design:

  # =========================================================================
  # =========================================================================
  - section: entities
    instances:

      - name: create_course_returns_201_with_active_status_and_zero_offering_count
        claim_type: creation
        grounds: ["entities.Course", "endpoints.POST /courses"]
        distinguishing_aspect: "POST /courses with all seven required fields returns 201, status ACTIVE, active_offering_count 0, version 1 and a server-minted UUID id with no type prefix."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_id: $.data.id, c_status: $.data.status, c_ver: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${c_status} == ACTIVE"
            - "${c_ver} == 1"
            - "Course.${c_id}.active_offering_count == 0"
            - "Course.${c_id}.prerequisite_course_id == null"
            - "${c_id} is a bare UUID with no type prefix"

      - name: get_course_with_unknown_id_returns_course_not_found
        claim_type: not_found
        grounds: ["errors[ERR_COURSE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /courses/{id} for a well-formed UUID that was never minted returns ERR_COURSE_NOT_FOUND with HTTP 404 and an error envelope, not an empty object."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /courses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COURSE_NOT_FOUND"
            - "HTTP status is 404"
            - "response_type == error"

      - name: list_courses_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints.GET /courses", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /courses?limit=2&offset=0 over three catalog rows returns exactly 2 items with total_count 3 and has_more true; offset=2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "Three ACTIVE courses exist: EXT-050, EXT-101 and EXT-150."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-050", title: "Micro Credential Primer", ceu_units: 0.5, contact_hours: 5, list_price_cents: 25000, delivery_mode: "ONLINE_ASYNC", cpl_credit_units: 1.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-150", title: "Applied Delivery Lab", ceu_units: 1.5, contact_hours: 15, list_price_cents: 45000, delivery_mode: "IN_PERSON", cpl_credit_units: 2.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /courses"
              payload: { limit: 2, offset: 0 }
              as: Registrar
              as_user_id: "reg-1"
            - call: "GET /courses"
              payload: { limit: 2, offset: 2 }
              as: Registrar
              as_user_id: "reg-1"
          assert:
            - "first call returns exactly 2 items with total_count == 3 and has_more == true"
            - "second call returns exactly 1 item with total_count == 3 and has_more == false"
            - "response_type == array on both calls"

      - name: create_course_missing_ceu_units_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=3]"]
        distinguishing_aspect: "Omitting the required ceu_units field from POST /courses returns ERR_INVALID_REQUEST with HTTP 400 and persists no Course row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /courses returns total_count == 0"

      - name: create_learner_defaults_marketing_opt_in_to_true_and_subscribed
        claim_type: defaults
        grounds: ["entities.Learner.fields.marketing_opt_in", "entities.Learner.fields.marketing_status", "calculations.marketing_segment_recompute"]
        distinguishing_aspect: "Omitting marketing_opt_in on POST /learners applies the declared default true, sets marketing_status SUBSCRIBED, loyalty_tier NEW, and creates exactly one ACTIVE PROSPECT MarketingMembership."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito" }
              as: Anonymous
              captures: { l1_id: $.data.id, opt_in: $.data.marketing_opt_in, mstatus: $.data.marketing_status, tier: $.data.loyalty_tier }
            - call: "GET /learners/${l1_id}/marketing-memberships"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
          assert:
            - "${opt_in} == true"
            - "${mstatus} == SUBSCRIBED"
            - "${tier} == NEW"
            - "Learner.${l1_id}.lifetime_ceu_total == 0.0"
            - "Learner.${l1_id}.lifetime_completed_count == 0"
            - "GET /learners/${l1_id}/marketing-memberships returns exactly 1 row with segment PROSPECT and state ACTIVE"

      - name: create_offering_rejects_unknown_status_field_in_body
        claim_type: system_fields
        grounds: ["entities.Offering.fields.status", "validations[priority=3]"]
        distinguishing_aspect: "Offering.status is source: system; supplying it in the POST /offerings body is an undeclared input field and returns ERR_INVALID_REQUEST with HTTP 400 rather than silently seeding an OPEN offering."
        test_recipe:
          setup:
            - "One ACTIVE course EXT-101 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
          trigger:
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000, status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /offerings?course_id=${c_base_id} returns total_count == 0"

      - name: registration_creation_snapshots_total_sessions_from_offering
        claim_type: computed_fields
        grounds: ["entities.Registration.fields.total_sessions", "entities.Registration.fields.list_tuition_cents", "calculations.registration_price_resolution"]
        distinguishing_aspect: "POST /offerings/{id}/registrations copies Offering.session_count into Registration.total_sessions and Offering.tuition_cents into list_tuition_cents at creation time, so later Offering edits cannot retroactively change an existing registration's attendance denominator."
        test_recipe:
          setup:
            - "One OPEN TERM offering on EXT-101 with session_count 10 and tuition_cents 60000, staffed by a SIGNED SENIOR contract."
            - "One NEW learner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_id: $.data.id }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_id: $.data.id }
            - call: "POST /instructor-contracts/${k_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
            - call: "POST /offerings/${o_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_v0: $.data.version }
            - call: "POST /learners"
              payload: { email: "ada@x.com", full_name: "Ada Ito", marketing_opt_in: true }
              as: Anonymous
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /offerings/${o_id}/registrations"
              payload: { learner_id: "${l1_id}", expected_offering_version: "${o_v0}" }
              as: Learner
              as_user_id: "${l1_id}"
              captures: { r1_id: $.data.id, ts: $.data.total_sessions, lt: $.data.list_tuition_cents }
          assert:
            - "${ts} == 10"
            - "${lt} == 60000"
            - "Registration.${r1_id}.amount_paid_cents == 0"
            - "Registration.${r1_id}.amount_refunded_cents == 0"
            - "Registration.${r1_id}.sessions_attended == 0"
            - "Registration.${r1_id}.enrolled_at == null"

      - name: create_course_with_duplicate_course_code_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Course.fields.course_code", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "course_code is unique across all Courses; a second POST /courses reusing EXT-101 returns ERR_INVALID_REQUEST with HTTP 400 and leaves total_count at 1."
        test_recipe:
          setup:
            - "One ACTIVE course EXT-101 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Duplicate Attempt", ceu_units: 0.9, contact_hours: 9, list_price_cents: 30000, delivery_mode: "IN_PERSON", cpl_credit_units: 1.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /courses returns total_count == 1"

      - name: create_term_offering_without_term_code_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Offering.fields.term_code", "validations[priority=3]"]
        distinguishing_aspect: "term_code is required exactly when scheduling_mode == TERM; omitting it on a TERM offering returns ERR_INVALID_REQUEST with HTTP 400, while a ROLLING offering created without it succeeds with term_code null."
        test_recipe:
          setup:
            - "One ACTIVE course EXT-101 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
          trigger:
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "ROLLING", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_roll_id: $.data.id, roll_term: $.data.term_code }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status of the first call is 400"
            - "HTTP status of the second call is 201"
            - "${roll_term} == null"
            - "Offering.${o_roll_id}.scheduling_mode == ROLLING"
            - "Offering.${o_roll_id}.status == DRAFT"

      - name: create_offering_with_unknown_course_id_returns_course_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_COURSE_NOT_FOUND]"]
        distinguishing_aspect: "A body foreign key that does not resolve is rejected at priority 5 with ERR_COURSE_NOT_FOUND and HTTP 404, ahead of every business rule."
        test_recipe:
          setup:
            - "Empty catalog."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /offerings"
              payload: { course_id: "00000000-0000-4000-8000-000000000000", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_COURSE_NOT_FOUND"
            - "HTTP status is 404"

      - name: list_courses_filtered_by_prerequisite_course_id_returns_dependents
        claim_type: graph_topology_foreign_key_validated
        grounds: ["entities.Course.fields.prerequisite_course_id", "endpoints.GET /courses"]
        distinguishing_aspect: "The self-referential prerequisite FK is reverse-reachable: GET /courses?prerequisite_course_id={base} returns exactly the one advanced course that names it, and not the base course itself."
        test_recipe:
          setup:
            - "Course EXT-101 has no prerequisite; course EXT-201 declares prerequisite_course_id == EXT-101."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "EXT-201", title: "Advanced Delivery Practice", ceu_units: 1.5, contact_hours: 15, list_price_cents: 90000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0, prerequisite_course_id: "${c_base_id}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_adv_id: $.data.id }
          trigger:
            - call: "GET /courses"
              payload: { prerequisite_course_id: "${c_base_id}" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "the filtered list returns total_count == 1"
            - "${first_id} == ${c_adv_id}"
            - "Course.${c_adv_id}.prerequisite_course_id == ${c_base_id}"

  # =========================================================================
  - section: state_machines
    instances:

      - name: offering_is_created_in_draft_and_open_twice_returns_invalid_state
        claim_type: initial_state
        grounds: ["entities.Offering.fields.status", "state_machines.Offering.DRAFT_to_OPEN", "validations[priority=9]"]
        distinguishing_aspect: "A newly created Offering is DRAFT; the first POST /offerings/{id}/open moves it to OPEN and a second identical call is rejected with ERR_INVALID_STATE and HTTP 409, leaving status OPEN and no extra version bump beyond the first."
        test_recipe:
          setup:
            - "One ACTIVE course EXT-101, one DRAFT TERM offering on it, one SENIOR instructor holding a SIGNED contract on that offering."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
              payload: { course_id: "${c_base_id}", scheduling_mode: "TERM", term_code: "2026FA", start_date: "2026-09-15T00:00:00Z", end_date: "2026-11-15T00:00:00Z", census_at: "2026-09-01T00:00:00Z", session_count: 10, min_enrollment: 1, max_enrollment: 10, tuition_cents: 60000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { o_id: $.data.id, draft_status: $.data.status }
            - call: "POST /instructors"
              payload: { email: "dana@ext.edu", full_name: "Dana Reyes", credential_level: "SENIOR" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ins_a_id: $.data.id }
            - call: "POST /instructor-contracts"
              payload: { offering_id: "${o_id}", instructor_id: "${ins_a_id}", base_stipend_cents: 250000, per_enrollment_cents: 12345, enrollment_cap_for_pay: 8 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { k_id: $.data.id }
            - call: "POST /instructor-contracts/${k_id}/sign"
              payload: { decision: "ACCEPT" }
              as: Instructor
              as_user_id: "${ins_a_id}"
          trigger:
            - call: "POST /offerings/${o_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { open_status: $.data.status, open_ver: $.data.version }
            - call: "POST /offerings/${o_id}/open"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${draft_status} == DRAFT"
            - "${open_status} == OPEN"
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status of the second open call is 409"
            - "Offering.${o_id}.status == OPEN"
            - "Offering.${o_id}.version == ${open_ver}"

      - name: census_before_census_at_returns_census_too_early
        claim_type: precondition_enforcement
        grounds: ["validations[priority=14]", "errors[ERR_CENSUS_TOO_EARLY]", "state_machines.Offering.OPEN_to_CENSUS_LOCKED"]
        distinguishing_aspect: "With the logical clock at 2026-08-31T23:59:59Z, one second before census_at 2026-09-01T00:00:00Z, POST /offerings/{id}/census returns ERR_CENSUS_TOO_EARLY with HTTP 409 and the offering stays OPEN even though paid_enrollment_count already meets min_enrollment."
        test_recipe:
          setup:
            - "One OPEN TERM offering on EXT-101 with min_enrollment 1 and census_at 2026-09-01T00:00:00Z."
            - "Learner Ada is ENROLLED x PAID, so paid_enrollment_count is 1."
            - "Logical clock at 2026-08-31T23:59:59Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /courses"
              payload: { course_code: "EXT-101", title: "Foundations of Project Delivery", ceu_units: 1.2, contact_hours: 12, list_price_cents: 60000, delivery_mode: "ONLINE_SYNC", cpl_credit_units: 3.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c_base_id: $.data.id }
            - call: "POST /offerings"
