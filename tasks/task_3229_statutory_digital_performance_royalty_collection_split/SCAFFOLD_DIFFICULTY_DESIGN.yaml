  - rule_id: compensating_invariant
    instances:
      - name: amend_rebatch_preserves_liability_conservation
        grounds:
          - state_machines.UsageReport.ACCEPTED_to_AMENDED
          - state_machines.DistributionBatch.PLANNED_to_REVERSED
          - calculations.calc_royalty_liability
        distinguishing_aspect: |
          Conserved quantity: the licensee's payable amount. Forward action
          (plan batch against a COMPUTED liability) plus compensating action
          (amend reverses the PLANNED batch and recomputes the liability) MUST
          leave sum(amount_due of the report's live liability) +
          sum(unmatched accrual contributed by EXECUTED batches of the report)
          equal to the post-amendment recomputed amount due — no cents leak
          because the batch never executed and the liability recompute is
          exact. Pin: after amend with identical lines, amount_due_cents is
          unchanged at 100000 and accrued_unmatched_cents is still 0.
