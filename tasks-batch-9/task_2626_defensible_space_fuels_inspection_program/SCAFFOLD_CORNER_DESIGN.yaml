            - "Parcel.${p1}.open_violation_count == 0 and compliance_status == \"PENDING_INSPECTION\" — COMPLIANT is withheld because last_passed_inspection_at_utc is null"
            - "Parcel.${p1}.risk_score == 70.49, risk_class == \"HIGH\" and risk_score_basis == \"POST_INSPECTION_VERIFIED\": the void does not undo the verified rescore"
            - "GET /fire-district/inspection-cycles/${cyc}/metrics reports eligible_parcel_count == 0 and compliance_rate_pct == null, since PENDING_INSPECTION is outside the eligible set"
            - "Inspection.${ins1}.status == \"COMPLETED\" and result == \"FAIL\": the void leaves the inspection record alone"

      - name: inspector_assigned_open_count_tracks_live_inspections
        claim_type: Ledger sync
        grounds:
          - entities.Inspector.fields.assigned_open_count
          - state_machines.Inspection.SCHEDULED_to_CANCELLED.side_effects
        distinguishing_aspect: |
          assigned_open_count is a conserved counter, not a monotonic total: it counts inspections in
          {SCHEDULED, NOTICED, ACCESS_DENIED} only, so three assignments give 3, serving a notice keeps
          it at 3, and each cancel decrements it — 3 -> 2 -> 1 — while the completed-work counter of
          the inspector's history is never used as the ledger.
        test_recipe:
          setup:
            - "Active cycle, one ACTIVE inspector, three parcels, three inspections on 2026-08-20, 2026-08-21 and 2026-08-22 (non-overlapping windows); the 2026-08-20 inspection is noticed."
