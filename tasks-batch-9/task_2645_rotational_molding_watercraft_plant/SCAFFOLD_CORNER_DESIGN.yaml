            - "WarrantyClaim.${clm1}.admin_fee_cents == 11520 at the 8.00 pct band (50000 >= 144000 is false, 200000 >= 144000 is true), round_half_up(144000 * 8.00 / 100) == 11520, and net_payout_cents == 144000 - 0 - 11520 == 132480"
            - "WarrantyClaim.${clm2}.months_in_service == 12 even though the clock reads 2027-08-31T23:59:59Z — 12 months and 30 days floors to 12 complete calendar months, so the identical 80.00 pct band applies and net_payout_cents == 132480 again; an implementation that rounded the age up, or that divided elapsed days by 30.4, would drop this claim into the 36-month band and pay 82800"
