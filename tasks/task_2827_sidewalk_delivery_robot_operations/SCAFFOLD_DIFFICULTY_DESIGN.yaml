        distinguishing_aspect: >-
          The incident machine is a guarded branch-join, not a chain: from SUBMITTED_MUNICIPAL a CLOSE is
          refused with ERR_INVALID_STATE_TRANSITION (409) while insurer_notification_required is true, so
          the same CLOSE action that is legal on the municipal-only branch only becomes legal on this
          report after the insurer leg ran, and both branches converge on the single CLOSED state that
          decrements zone.open_incident_count exactly once.
