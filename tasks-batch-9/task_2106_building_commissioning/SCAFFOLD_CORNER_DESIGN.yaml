      - name: issue_aging_multiplier_steps_then_caps_with_the_logical_clock
        claim_type: constants_applied
        grounds:
          - calculations.issue_severity_index
          - endpoints[POST /_clock/set_current_utc]
          - calculations.readiness_posture_derivation
        distinguishing_aspect: "One S3 issue opened at the 2026-08-01T00:00:00Z default contributes 8.00 at age 0, 12.00 after 28 days (two complete 14-day steps, multiplier 1.50) and exactly 16.00 after a year because the multiplier is capped at 2.00 - which lands the index on the RESTRICTED boundary."
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 (STANDARD, contract_value_cents 1000000)."
            - "One S3 issue opened while the logical clock still reads its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Aging Cx", building_name: "Aging Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-AG", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S3", description: "Balancing report outstanding", equipment_id: "${e1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i1: $.data.id, opened_at: $.data.opened_at }
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { idx_day0: $.data.issue_severity_index, posture_day0: $.data.readiness_posture }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { idx_day28: $.data.issue_severity_index, posture_day28: $.data.readiness_posture }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          assert:
            - "${opened_at} == 2026-08-01T00:00:00.000Z"
            - "${idx_day0} == 8.00 and ${posture_day0} == OPEN"
            - "${idx_day28} == 12.00 and ${posture_day28} == OPEN"
            - "CxProject.${p}.issue_severity_index == 16.00 after the clock reaches 2027-08-01 (multiplier capped at 2.00, not 7.50)"
            - "CxProject.${p}.readiness_posture == RESTRICTED (16.00 >= 16.00)"
            - "CxProject.${p}.retainage_withheld_cents == 5000 (the hold is frozen at creation and never re-aged)"

