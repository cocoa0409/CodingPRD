              as: WarehouseManager
              captures: { as_id: "$.data.id" }
            - call: "POST /staging/damage-assessments/${as_id}/assess"
              payload: {}
              as: WarehouseManager
            - call: "POST /staging/damage-assessments/${as_id}/dispute"
