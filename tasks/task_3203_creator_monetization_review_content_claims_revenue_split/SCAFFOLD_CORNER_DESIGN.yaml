              payload: { channel_name: "Super Chat Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_sup: $.data.id }
            - call: "POST /api/channels/${ch_sup}/content-items"
