      - name: intake_client_budget_create_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CLIENT_NOT_ACTIVE]"]

        distinguishing_aspect: "Client-lifecycle gate: creating a budget plan for an INTAKE_REVIEW client fails with ERR_CLIENT_NOT_ACTIVE (409) — planning requires ACTIVE or SUSPENDED."
        test_recipe:
          setup: ["Client in INTAKE_REVIEW (entitlement never verified)"]
          setup_api_calls:
