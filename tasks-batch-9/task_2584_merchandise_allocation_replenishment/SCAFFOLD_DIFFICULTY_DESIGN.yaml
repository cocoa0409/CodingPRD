          - entities.TransferRecommendation.fields.freight_cost_usd
          - entities.TransferRecommendation.fields.landed_cost_usd
        distinguishing_aspect: |
          Two ordered steps decide the fee. Step 1 floors freight at FREIGHT_MIN_USD: 38.00 + 6 x 0.85 =
          43.10 loses to 45.00. Step 2 picks the handling tier from that freight value (45.00 < 50.00 ->
          1200bp -> 5.40). Because the landed total 50.40 sits on the other side of the 50.00 tier
