      - name: sizing_recommendation_input_set_excludes_pending_stops
        claim_type: input_set_filtering
        grounds: [calculations.bin_sizing_recommendation]
        distinguishing_aspect: "Only SUBMITTED stops feed the sizing window: a route with a PENDING (unsubmitted) stop does not perturb the recommendation — same history yields identical recommendation whether or not the PENDING stop exists."
        test_recipe:
          setup:
            - "Site S, part P unit 1000; agreement min 25 max 200"
            - "One route closed with a single SUBMITTED stop at count 100 (baseline — window of submitted stops has 1 entry, usages empty -> recommendation falls back to zeros-or-empty policy... concretely: with fewer than 2 submitted stops the usage series is empty and recommendation is recommended_min == 0, recommended_max == 0)"
            - "Second route IN_PROGRESS with one PENDING stop never submitted"
          setup_api_calls:
