              payload: { expected_issuer_version: "${i_v}", holiday_dates: ["2026-08-10"] }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "i_v2 == 2 (first PUT advanced the version)"
            - "err == ERR_STALE_VERSION (stale expected_issuer_version rejected with 412)"

