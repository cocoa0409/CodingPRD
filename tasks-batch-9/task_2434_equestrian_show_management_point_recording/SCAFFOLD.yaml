scenario: |
  Generate task harder than expert level!

  2434. Equestrian Show Management & Point Recording (horse show organizer): show licensing with the national federation, competition levels and required officials, class list development with divisions, jump heights and prize money allocation, entry processing with horse and rider membership verification, coggins testing and stall requests, ring scheduling with class order, warm-up allocation and time estimation across multiple rings, judge and steward assignment with conflict rules and licensing verification, results recording with point submission to national and regional standings, drug testing coordination and welfare rule enforcement, stabling, footing maintenance and grounds operations with emergency veterinary and farrier coverage

domain_name: equestrian-show-management
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # Junction entities (Entry, ClassEntry, OfficialAssignment, RingSlot) wire
  # Show / Rider / Horse / Official / ShowClass / Ring into a many-to-many web;
  # ShowClass.qualifier_for_class_id makes the class list a self-referential DAG.

  state_machine_shape: branching
  # Show.license_status is cyclic (SUBMITTED -> RETURNED_FOR_CORRECTION -> SUBMITTED,
  # capped at MAX_LICENSE_REVISIONS); Entry carries two independent dimensions
  # (verification_status x settlement_status); PointSubmission is a fork-join
  # (PREPARED -> {NATIONAL_ACCEPTED, REGIONAL_ACCEPTED} -> RECORDED) with
  # divergent side effects per branch; ShowClass loops backward on footing
  # cancellation, compliance substantiation and standings rejection.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The Official who records a class's results may not be the Official holding the
  # STEWARD assignment on the same slot, and the Judge who records results is not
  # permitted to post them (prize allocation) — that is the ShowSecretary's step.
  # Layered over peer roles: RingMaster owns scheduling, GroundsManager owns
  # footing/coverage, FederationOfficer owns licensing/registry/standings.

  consistency_model: saga
  # Point submission is a two-body saga (national + regional acknowledgements);
  # a rejection compensates the already-credited standings leg and reverts the
  # class to RESULTS_POSTED so it can be resubmitted.

  difficulty_level: beyond_expert
  # Deliberately above the §0.4 Expert band (14 entities / 54 endpoints): the
  # scenario's licensing, scheduling, entry-processing, officiating, standings,
  # compliance and grounds sub-domains each contribute load-bearing coupling.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Show
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Show name as printed in the prize list."
      - name: federation_show_id
        type: string
        source: input
        description: "National federation show identifier applied for on the licence."
      - name: venue
        type: string
        source: input
        description: "Showgrounds name."
      - name: competition_level
        type: enum
        source: input
        description: "Federation competition level; drives required officials and minimum official licence level."
        constraints: "one of LOCAL, REGIONAL, NATIONAL, PREMIER"
      - name: start_utc
        type: datetime
        source: input
        description: "First moment of competition. Coggins validity is evaluated against this instant."
      - name: end_utc
        type: datetime
        source: input
        description: "Last moment of competition; ring slots must fall inside [start_utc, end_utc]."
      - name: entry_close_utc
        type: datetime
        source: input
        description: "Entry window closes at this instant (exclusive: submission AT this instant is rejected)."
      - name: license_status
        type: enum
        source: computed
        description: "Federation licensing state machine for this show."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, RETURNED_FOR_CORRECTION, APPROVED, DENIED"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of completed RETURNED_FOR_CORRECTION -> SUBMITTED cycles; capped by MAX_LICENSE_REVISIONS."
        default: 0
      - name: prize_money_pool_cents
        type: integer
        source: input
        description: "Total prize money the organizer has posted for the show, in cents."
        constraints: ">= 0"
      - name: allocated_prize_cents
        type: integer
        source: computed
        description: "Sum of ShowClass.awarded_prize_cents over classes with status IN {RESULTS_POSTED, POINTS_SUBMITTED}. See calculations.show_prize_ledger."
        default: 0
      - name: unallocated_prize_cents
        type: integer
        source: computed
        description: "prize_money_pool_cents - allocated_prize_cents. Conserved-quantity partner of allocated_prize_cents."
      - name: stall_capacity
        type: integer
        source: input
        description: "Total stalls available for the show."
        constraints: ">= 0"
      - name: stall_fee_cents
        type: integer
        source: input
        description: "Per-stall fee charged on the entry invoice, in cents."
        constraints: ">= 0"
      - name: reserved_stall_count
        type: integer
        source: computed
        description: "Sum of Entry.assigned_stall_count over Entry with verification_status == ACCEPTED. See calculations.show_stall_ledger."
        default: 0
      - name: available_stall_count
        type: integer
        source: computed
        description: "stall_capacity - reserved_stall_count. Conserved-quantity partner of reserved_stall_count."
      - name: division_share_bp_total
        type: integer
        source: computed
        description: "Sum of CompetitionDivision.division_share_bp over divisions with status == ACTIVE; must stay <= 10000."
        default: 0
      - name: welfare_strike_count
        type: integer
        source: computed
        description: "Count of ComplianceCase rows with case_type == WELFARE_CITATION and status == SUBSTANTIATED whose Entry.show_id == this Show.id."
        default: 0

  - name: Ring
    parent: Show
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the show whose grounds this ring belongs to."
      - name: name
        type: string
        source: input
        description: "Ring name, e.g. 'Grand Prix Field'."
      - name: surface_type
        type: enum
        source: input
        description: "Footing construction of the ring."
        constraints: "one of SAND_FIBER, GRASS, CLAY"
      - name: footing_condition_score
        type: integer
        source: computed
        description: "Current footing condition, 0-100. Set at creation from the input seed value and rewritten by POST /rings/{id}/footing-maintenance."
        default: 100
        constraints: "0 <= footing_condition_score <= 100"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: "Minutes of drag/reset required between consecutive ring slots; participates in the ring-slot overlap geometry."
        default: 10
        constraints: ">= 0"
      - name: warmup_capacity_horses
        type: integer
        source: input
        description: "Maximum horses permitted in this ring's warm-up arena at one time."
        default: 12
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Ring operational state; MAINTENANCE_HOLD blocks slot starts."
        default: AVAILABLE
        constraints: "one of AVAILABLE, MAINTENANCE_HOLD"
      - name: scheduled_minutes_total
        type: integer
        source: computed
        description: "Sum of (end_utc - start_utc) in whole minutes over RingSlot rows on this ring with status IN {SCHEDULED, RUNNING, COMPLETED}."
        default: 0
      - name: slot_count
        type: integer
        source: computed
        description: "Count of RingSlot rows on this ring with status IN {SCHEDULED, RUNNING, COMPLETED}."
        default: 0

  - name: CompetitionDivision
    parent: Show
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the show this division belongs to."
      - name: name
        type: string
        source: input
        description: "Division name, e.g. 'Junior Jumper'."
      - name: discipline
        type: enum
        source: input
        description: "Discipline of every class in this division; drives base round seconds in the duration estimate."
        constraints: "one of HUNTER, JUMPER, EQUITATION, DRESSAGE"
      - name: age_group
        type: enum
        source: input
        description: "Eligibility band for the division."
        constraints: "one of JUNIOR, AMATEUR, OPEN, PONY"
      - name: min_jump_height_cm
        type: integer
        source: input
        description: "Inclusive lower bound on ShowClass.jump_height_cm for classes in this division."
        constraints: ">= 0"
      - name: max_jump_height_cm
        type: integer
        source: input
        description: "Inclusive upper bound on ShowClass.jump_height_cm for classes in this division."
        constraints: ">= min_jump_height_cm"
      - name: division_share_bp
        type: integer
        source: input
        description: "Basis points of Show.prize_money_pool_cents allotted to this division."
        constraints: "0 <= division_share_bp <= 10000"
      - name: jumpoff_enabled
        type: boolean
        source: input
        description: "Whether classes in this division run a jump-off; only affects JUMPER classes in the duration estimate."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Division state; CLOSED when the show licence is denied."
        default: ACTIVE
        constraints: "one of ACTIVE, CLOSED"
      - name: division_allotment_cents
        type: integer
        source: computed
        description: "round_half_up(Show.prize_money_pool_cents * division_share_bp / 10000). See calculations.class_prize_allocation."
        default: 0

  - name: ShowClass
    parent: CompetitionDivision
    common_fields: true
    fields:
      - name: division_id
        type: string
        source: input
        description: "FK -> CompetitionDivision.id; the division this class sits in."
      - name: class_number
        type: integer
        source: input
        description: "Prize-list class number; unique across all classes of the same Show."
        constraints: ">= 1"
      - name: name
        type: string
        source: input
        description: "Class name as printed."
      - name: jump_height_cm
        type: integer
        source: input
        description: "Fence height for this class; must lie inside the division's [min_jump_height_cm, max_jump_height_cm]."
        constraints: ">= 0"
      - name: entry_fee_cents
        type: integer
        source: input
        description: "Per-horse entry fee for this class, in cents."
        constraints: ">= 0"
      - name: class_share_bp
        type: integer
        source: input
        description: "Basis points of the division's allotment forming this class's purse."
        constraints: "0 <= class_share_bp <= 10000"
      - name: max_entries
        type: integer
        source: input
        description: "Maximum ClassEntry rows with status IN {ENTERED, CONFIRMED, COMPLETED, DISQUALIFIED} permitted."
        constraints: ">= 1"
      - name: qualifier_for_class_id
        type: string
        source: input
        description: "FK -> ShowClass.id; nullable. Names the championship class this class qualifies riders for, forming a self-referential DAG within one Show."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Class lifecycle; loops backward on footing cancellation, compliance substantiation and standings rejection."
        default: PLANNED
        constraints: "one of PLANNED, OPEN, SCHEDULED, IN_PROGRESS, JUDGED, RESULTS_POSTED, POINTS_SUBMITTED, VOIDED"
      - name: entry_count
        type: integer
        source: computed
        description: "Count of ClassEntry rows on this class with status IN {ENTERED, CONFIRMED, COMPLETED, DISQUALIFIED}."
        default: 0
      - name: confirmed_entry_count
        type: integer
        source: computed
        description: "Count of ClassEntry rows on this class with status IN {CONFIRMED, COMPLETED}. Drives point eligibility and the national multiplier tier."
        default: 0
      - name: estimated_minutes
        type: integer
        source: computed
        description: "Whole minutes the class is projected to occupy its ring; written by POST /ring-slots using the projected_all_entered variant of calculations.class_duration_estimate. Null until scheduled."
        default: null
      - name: actual_minutes
        type: integer
        source: computed
        description: "Whole minutes the class actually occupied the ring, recorded by POST /classes/{id}/results. Null until judged."
        default: null
      - name: class_purse_cents
        type: integer
        source: computed
        description: "round_half_up(CompetitionDivision.division_allotment_cents * class_share_bp / 10000). See calculations.class_prize_allocation."
        default: 0
      - name: awarded_prize_cents
        type: integer
        source: computed
        description: "Sum of ClassEntry.prize_cents actually awarded when results were posted; 0 before posting and after a void or compliance revert."
        default: 0
      - name: placed_count
        type: integer
        source: computed
        description: "Count of ClassEntry rows on this class with a non-null placing and status == COMPLETED."
        default: 0
      - name: point_eligible
        type: boolean
        source: computed
        description: "True when confirmed_entry_count >= MIN_ENTRIES_FOR_POINTS (3). Gates POST /classes/{id}/point-submissions."
        default: false

  - name: RingSlot
    parent: Ring
    common_fields: true
    fields:
      - name: ring_id
        type: string
        source: input
        description: "FK -> Ring.id; the ring whose time this slot occupies."
      - name: class_id
        type: string
        source: input
        description: "FK -> ShowClass.id; nullable. Null exactly when slot_type == MAINTENANCE."
        default: null
      - name: slot_type
        type: enum
        source: computed
        description: "CLASS for slots created by POST /ring-slots; MAINTENANCE for slots synthesized by POST /rings/{id}/footing-maintenance."
        constraints: "one of CLASS, MAINTENANCE"
      - name: start_utc
        type: datetime
        source: input
        description: "First moment the ring is occupied by this slot."
      - name: duration_minutes
        type: integer
        source: computed
        description: "For CLASS slots, copied from ShowClass.estimated_minutes; for MAINTENANCE slots, the requested hold length."
        constraints: ">= 1"
      - name: end_utc
        type: datetime
        source: computed
        description: "start_utc + duration_minutes. Half-open upper bound: the ring is free at end_utc."
      - name: warmup_start_utc
        type: datetime
        source: computed
        description: "start_utc - WARMUP_LEAD_MINUTES (30). Beginning of the supervised warm-up window; only OfficialAssignment overlap geometry uses it."
      - name: order_index
        type: integer
        source: computed
        description: "1-based position of this slot in its ring's running order; see calculations.ring_schedule_layout."
        default: 1
      - name: status
        type: enum
        source: computed
        description: "Slot lifecycle."
        default: SCHEDULED
        constraints: "one of SCHEDULED, RUNNING, COMPLETED, CANCELLED"

  - name: Official
    parent: null
    common_fields: true
    fields:
      - name: federation_official_id
        type: string
        source: input
        description: "Federation licence number for this judge/steward/technical delegate."
      - name: full_name
        type: string
        source: input
        description: "Official's name."
      - name: license_roles
        type: array
        source: input
        description: "Roles this official is licensed to fill; each member one of JUDGE, STEWARD, TECHNICAL_DELEGATE."
        constraints: "non-empty; members drawn from {JUDGE, STEWARD, TECHNICAL_DELEGATE}"
      - name: license_level
        type: integer
        source: input
        description: "Federation licence grade 1-4; must be >= MIN_OFFICIAL_LICENSE_LEVEL for the show's competition_level."
        constraints: "1 <= license_level <= 4"
      - name: licensed_disciplines
        type: array
        source: input
        description: "Disciplines this official may officiate; members drawn from {HUNTER, JUMPER, EQUITATION, DRESSAGE}."
        constraints: "non-empty"
      - name: license_expires_on
        type: datetime
        source: input
        description: "Licence expiry instant; an assignment is refused when the slot's start_utc is at or after this instant."
      - name: affiliated_trainer_name
        type: string
        source: input
        description: "Trainer barn this official is commercially affiliated with; nullable. Drives the conflict-of-interest rule against Rider.trainer_name."
        default: null
      - name: assigned_minutes
        type: integer
        source: computed
        description: "Sum of (RingSlot.end_utc - RingSlot.warmup_start_utc) in whole minutes over this official's OfficialAssignment rows with status == ACTIVE. See calculations.official_load_ledger."
        default: 0

  - name: OfficialAssignment
    parent: null
    common_fields: true
    fields:
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the official being assigned."
      - name: slot_id
        type: string
        source: input
        description: "FK -> RingSlot.id; the slot the official is assigned to."
      - name: official_role
        type: enum
        source: input
        description: "Chair the official fills on this slot; must be a member of Official.license_roles."
        constraints: "one of JUDGE, STEWARD, TECHNICAL_DELEGATE"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE until the slot is cancelled by a footing cascade, which releases the assignment."
        default: ACTIVE
        constraints: "one of ACTIVE, RELEASED"

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - name: federation_member_number
        type: string
        source: input
        description: "National federation membership number."
      - name: full_name
        type: string
        source: input
        description: "Rider's name."
      - name: membership_expires_on
        type: datetime
        source: input
        description: "Instant at which federation membership lapses."
      - name: trainer_name
        type: string
        source: input
        description: "Barn/trainer of record; compared against Official.affiliated_trainer_name for conflict of interest."
      - name: membership_status
        type: enum
        source: computed
        description: "ACTIVE when the logical clock is strictly before membership_expires_on, else LAPSED. Re-derived on every read."
        constraints: "one of ACTIVE, LAPSED"
      - name: national_points_total
        type: number
        source: computed
        description: "Running national standings total credited by accepted PointSubmission national legs. See calculations.rider_standing_points."
        default: 0
      - name: regional_points_total
        type: number
        source: computed
        description: "Running regional standings total credited by accepted PointSubmission regional legs, after the per-show cap."
        default: 0

  - name: Horse
    parent: null
    common_fields: true
    fields:
      - name: federation_registration_number
        type: string
        source: input
        description: "Federation horse registration number."
      - name: name
        type: string
        source: input
        description: "Horse's registered name."
      - name: owner_name
        type: string
        source: input
        description: "Owner of record."
      - name: coggins_drawn_on
        type: datetime
        source: input
        description: "Instant the Coggins (EIA) blood sample was drawn."
      - name: coggins_expires_on
        type: datetime
        source: computed
        description: "coggins_drawn_on + COGGINS_VALIDITY_DAYS (365). Must be >= Show.start_utc for the horse to be entered."
      - name: eligibility_status
        type: enum
        source: computed
        description: "ELIGIBLE until a substantiated POSITIVE drug-test ComplianceCase suspends the horse."
        default: ELIGIBLE
        constraints: "one of ELIGIBLE, SUSPENDED"

  - name: Entry
    parent: Show
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the show entered."
      - name: rider_id
        type: string
        source: input
        description: "FK -> Rider.id; the competing rider. Exhibitor ownership is checked against this field."
      - name: horse_id
        type: string
        source: input
        description: "FK -> Horse.id; the competing horse."
      - name: verification_status
        type: enum
        source: computed
        description: "Entry-processing dimension, independent of settlement_status."
        default: RECEIVED
        constraints: "one of RECEIVED, VERIFIED, ACCEPTED, WITHDRAWN"
      - name: settlement_status
        type: enum
        source: computed
        description: "Money dimension, independent of verification_status."
        default: UNBILLED
        constraints: "one of UNBILLED, INVOICED, PAID, REFUNDED"
      - name: requested_stall_count
        type: integer
        source: input
        description: "Stalls requested on the entry blank; billed on the invoice regardless of acceptance."
        default: 0
        constraints: ">= 0"
      - name: assigned_stall_count
        type: integer
        source: computed
        description: "Stalls actually held against Show.stall_capacity; set to requested_stall_count on accept, reset to 0 on withdrawal."
        default: 0
      - name: class_fee_cents_total
        type: integer
        source: computed
        description: "Sum of ShowClass.entry_fee_cents over this entry's ClassEntry rows with status IN {ENTERED, CONFIRMED, COMPLETED, DISQUALIFIED}. See calculations.entry_settlement."
        default: 0
      - name: stall_fee_cents
        type: integer
        source: computed
        description: "requested_stall_count * Show.stall_fee_cents."
        default: 0
      - name: preliminary_subtotal_cents
        type: integer
        source: computed
        description: "class_fee_cents_total + stall_fee_cents. The office-fee tier is keyed on THIS field, never on total_due_cents."
        default: 0
      - name: office_fee_cents
        type: integer
        source: computed
        description: "Office fee selected by the tier table against preliminary_subtotal_cents."
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: "preliminary_subtotal_cents + office_fee_cents; frozen at POST /entries/{id}/invoice."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Amount returned when a PAID entry is withdrawn; 0 otherwise."
        default: 0

  - name: ClassEntry
    parent: null
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; the horse/rider entry being added to a class."
      - name: class_id
        type: string
        source: input
        description: "FK -> ShowClass.id; the class being entered."
      - name: status
        type: enum
        source: computed
        description: "Per-class start state; CONFIRMED requires BOTH Entry dimensions to have landed."
        default: ENTERED
        constraints: "one of ENTERED, CONFIRMED, COMPLETED, DISQUALIFIED, SCRATCHED"
      - name: placing
        type: integer
        source: computed
        description: "Ribbon position 1..5 recorded by POST /classes/{id}/results; null when unplaced."
        default: null
      - name: round_seconds
        type: number
        source: computed
        description: "Recorded round time in seconds; null when unplaced or not recorded."
        default: null
      - name: prize_cents
        type: integer
        source: computed
        description: "Cents awarded to this placing by calculations.class_prize_allocation; 0 when unplaced, voided or disqualified."
        default: 0
      - name: points_national
        type: number
        source: computed
        description: "National standings points earned for this placing under the national_scale variant of calculations.rider_standing_points; 0 until the national leg is accepted."
        default: 0
      - name: points_regional
        type: number
        source: computed
        description: "Regional standings points earned for this placing under the regional_scale variant; 0 until the regional leg is accepted."
        default: 0

  - name: PointSubmission
    parent: ShowClass
    common_fields: true
    fields:
      - name: class_id
        type: string
        source: input
        description: "FK -> ShowClass.id; the class whose results are being submitted to standings."
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ShowSecretary who created the submission; opaque operator id, never compared to any entity id."
      - name: national_body_reference
        type: string
        source: computed
        description: "Reference string returned by the national standings body on acknowledgement; null until the national leg is acknowledged."
        default: null
      - name: regional_body_reference
        type: string
        source: computed
        description: "Reference string returned by the regional affiliate on acknowledgement; null until the regional leg is acknowledged."
        default: null
      - name: national_points_total
        type: number
        source: computed
        description: "Sum of ClassEntry.points_national credited by this submission's national leg."
        default: 0
      - name: regional_points_total
        type: number
        source: computed
        description: "Sum of ClassEntry.points_regional credited by this submission's regional leg, after the per-show regional cap."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Fork-join saga state over the two standings bodies."
        default: PREPARED
        constraints: "one of PREPARED, NATIONAL_ACCEPTED, REGIONAL_ACCEPTED, RECORDED, REJECTED, RETRACTED"

  - name: ComplianceCase
    parent: Entry
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> Entry.id; the horse/rider entry under investigation. Show, horse and rider are all reached through this entry."
      - name: opened_by_official_id
        type: string
        source: input
        description: "FK -> Official.id; the steward who opened the case."
      - name: case_type
        type: enum
        source: input
        description: "DRUG_TEST for a collected sample, WELFARE_CITATION for a welfare-rule observation."
        constraints: "one of DRUG_TEST, WELFARE_CITATION"
      - name: sample_code
        type: string
        source: input
        description: "Laboratory sample barcode; required when case_type == DRUG_TEST, must be omitted otherwise."
        default: null
      - name: welfare_rule_code
        type: string
        source: input
        description: "Federation welfare rule cited; required when case_type == WELFARE_CITATION, must be omitted otherwise."
        default: null
      - name: finding
        type: enum
        source: computed
        description: "Adjudicated finding; null until POST /compliance-cases/{id}/finding."
        default: null
        constraints: "one of NEGATIVE, POSITIVE, WARNING"
      - name: status
        type: enum
        source: computed
        description: "OPEN until adjudicated; SUBSTANTIATED for POSITIVE or WARNING, DISMISSED for NEGATIVE."
        default: OPEN
        constraints: "one of OPEN, SUBSTANTIATED, DISMISSED"

  - name: CoverageShift
    parent: Show
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the show this on-call coverage window serves."
      - name: coverage_type
        type: enum
        source: input
        description: "VETERINARIAN coverage is mandatory for a slot to run; FARRIER coverage is recorded but not gating."
        constraints: "one of VETERINARIAN, FARRIER"
      - name: provider_name
        type: string
        source: input
        description: "Name of the covering veterinarian or farrier."
      - name: start_utc
        type: datetime
        source: input
        description: "First moment of coverage (inclusive)."
      - name: end_utc
        type: datetime
        source: input
        description: "Last moment of coverage (inclusive). A slot is covered when start_utc <= slot.start_utc and slot.end_utc <= end_utc."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED until the provider checks in; only ACTIVE shifts satisfy the slot-start coverage gate."
        default: SCHEDULED
        constraints: "one of SCHEDULED, ACTIVE"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Show
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    note: "license_status. Cyclic: SUBMITTED -> RETURNED_FOR_CORRECTION -> SUBMITTED, capped at MAX_LICENSE_REVISIONS."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /shows/{id}/license-submission"
        actor: ShowSecretary
        preconditions:
          - "license_status == DRAFT"
          - "count of CompetitionDivision with show_id == this Show.id and status == ACTIVE >= 1, else ERR_CLASS_LIST_INCOMPLETE"
          - "count of ShowClass whose division.show_id == this Show.id >= 1, else ERR_CLASS_LIST_INCOMPLETE"
          - "division_share_bp_total <= 10000, else ERR_DIVISION_SHARE_OVERSUBSCRIBED"
        side_effects:
          - "recompute Show.division_share_bp_total per calculations.show_prize_ledger"
          - "increments Show.version by 1"

      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /shows/{id}/license-submission (resubmission after federation correction request)"
        actor: ShowSecretary
        preconditions:
          - "license_status == RETURNED_FOR_CORRECTION"
          - "count of ShowClass whose division.show_id == this Show.id >= 1, else ERR_CLASS_LIST_INCOMPLETE"
          - "division_share_bp_total <= 10000, else ERR_DIVISION_SHARE_OVERSUBSCRIBED"
        side_effects:
          - "Show.revision_count += 1"
          - "recompute Show.division_share_bp_total"
          - "increments Show.version by 1"
        note: "The revision loop closes here; revision_count is the loop counter tested against MAX_LICENSE_REVISIONS on the next RETURN decision."

      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /shows/{id}/license-decision with decision == RETURN"
        actor: FederationOfficer
        preconditions:
          - "license_status == SUBMITTED, else ERR_SHOW_LICENSE_NOT_SUBMITTED"
          - "Show.revision_count < MAX_LICENSE_REVISIONS (2)"
        side_effects:
          - "store correction_note on the licence record"
          - "increments Show.version by 1"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /shows/{id}/license-decision with decision == RETURN while Show.revision_count >= MAX_LICENSE_REVISIONS (2) — automatic escalation"
        actor: FederationOfficer
        preconditions:
          - "license_status == SUBMITTED"
          - "Show.revision_count >= MAX_LICENSE_REVISIONS (2)"
        side_effects:
          - "every CompetitionDivision with show_id == this Show.id and status == ACTIVE -> CLOSED"
          - "every ShowClass whose division.show_id == this Show.id and status == PLANNED -> VOIDED"
          - "increments Show.version by 1"
        note: "The federation refuses a third correction cycle outright rather than returning again."

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /shows/{id}/license-decision with decision == DENY"
        actor: FederationOfficer
        preconditions:
          - "license_status == SUBMITTED, else ERR_SHOW_LICENSE_NOT_SUBMITTED"
        side_effects:
          - "every CompetitionDivision with show_id == this Show.id and status == ACTIVE -> CLOSED"
          - "every ShowClass whose division.show_id == this Show.id and status == PLANNED -> VOIDED"
          - "increments Show.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /shows/{id}/license-decision with decision == APPROVE"
        actor: FederationOfficer
        preconditions:
          - "license_status == SUBMITTED, else ERR_SHOW_LICENSE_NOT_SUBMITTED"
          - "count of ShowClass whose division.show_id == this Show.id >= 1, else ERR_CLASS_LIST_INCOMPLETE"
        side_effects:
          - "recompute CompetitionDivision.division_allotment_cents and ShowClass.class_purse_cents for every division/class of this show per calculations.class_prize_allocation"
          - "increments Show.version by 1"
        note: "Purses are frozen against the approved prize list; divisions and classes can no longer be added (POST /shows/{id}/divisions and POST /divisions/{id}/classes require license_status IN {DRAFT, RETURNED_FOR_CORRECTION})."

  - entity: Ring
    initial_state: AVAILABLE
    terminal_states: []
    note: "Grounds posture on one ring. MAINTENANCE_HOLD is the trigger of the deep footing cascade."
    transitions:
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /rings/{id}/footing-maintenance with new_footing_condition_score >= MIN_FOOTING_SCORE (60)"
        actor: GroundsManager
        preconditions:
          - "Ring.status == AVAILABLE"
          - "the requested hold window [start_utc, start_utc + duration_minutes) does not collide with any RingSlot on this ring with status IN {SCHEDULED, RUNNING} under calculations.ring_schedule_layout overlap geometry, else ERR_RING_SLOT_OVERLAP"
        side_effects:
          - "create RingSlot with slot_type == MAINTENANCE, class_id == null, status == SCHEDULED, duration_minutes == requested duration"
          - "Ring.footing_condition_score = new_footing_condition_score"
          - "recompute Ring.scheduled_minutes_total, Ring.slot_count and order_index of every slot on this ring"
          - "increments Ring.version by 1"

      - from: AVAILABLE
        to: MAINTENANCE_HOLD
        trigger: "POST /rings/{id}/footing-maintenance with new_footing_condition_score < MIN_FOOTING_SCORE (60)"
        actor: GroundsManager
        preconditions:
          - "Ring.status == AVAILABLE"
        side_effects:
          - "create RingSlot with slot_type == MAINTENANCE, status == SCHEDULED for the hold window (overlap geometry is NOT applied: an unsafe surface pre-empts whatever was booked)"
          - "Ring.footing_condition_score = new_footing_condition_score"
          - "CASCADE LINK 1: Ring.status -> MAINTENANCE_HOLD"
          - "CASCADE LINK 2 (caused by link 1): every RingSlot on this ring with slot_type == CLASS and status == SCHEDULED -> CANCELLED"
          - "CASCADE LINK 3 (caused by link 2): for each slot cancelled in link 2, its ShowClass reverts SCHEDULED -> OPEN and ShowClass.estimated_minutes -> null"
          - "CASCADE LINK 4 (caused by link 2): for each slot cancelled in link 2, every OfficialAssignment on that slot with status == ACTIVE -> RELEASED, and that Official.assigned_minutes is decremented by the released slot's (end_utc - warmup_start_utc) minutes"
          - "recompute Ring.scheduled_minutes_total, Ring.slot_count and order_index"
          - "increments Ring.version by 1"
        note: "Depth-4 transitive cascade; see scaffold_difficulty_design transitive_cascade / footing_hold_unwinds_schedule_officials."

      - from: MAINTENANCE_HOLD
        to: AVAILABLE
        trigger: "POST /rings/{id}/footing-maintenance with new_footing_condition_score >= MIN_FOOTING_SCORE (60)"
        actor: GroundsManager
        preconditions:
          - "Ring.status == MAINTENANCE_HOLD"
        side_effects:
          - "create RingSlot with slot_type == MAINTENANCE, status == SCHEDULED for the hold window"
          - "Ring.footing_condition_score = new_footing_condition_score"
          - "Ring.status -> AVAILABLE"
          - "recompute Ring.scheduled_minutes_total, Ring.slot_count and order_index"
          - "increments Ring.version by 1"
        note: "Slots cancelled during the hold are NOT resurrected; they must be re-created."

  - entity: ShowClass
    initial_state: PLANNED
    terminal_states: [VOIDED]
    note: "Non-linear: three backward edges (SCHEDULED->OPEN on footing cancellation, RESULTS_POSTED->JUDGED on compliance substantiation, POINTS_SUBMITTED->RESULTS_POSTED on standings rejection)."
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /classes/{id}/open"
        actor: ShowSecretary
        preconditions:
          - "ShowClass.status == PLANNED, else ERR_CLASS_NOT_PLANNED"
          - "the class's CompetitionDivision.show.license_status == APPROVED, else ERR_SHOW_LICENSE_NOT_APPROVED"
          - "CompetitionDivision.status == ACTIVE"
        side_effects:
          - "recompute ShowClass.class_purse_cents per calculations.class_prize_allocation"
          - "increments ShowClass.version by 1"
        note: "Cross-entity dependency (ShowClass, Show)."

      - from: OPEN
        to: SCHEDULED
        trigger: "system — side effect of POST /ring-slots creating a CLASS slot for this class"
        actor: system
        preconditions:
          - "ShowClass.status == OPEN, else ERR_CLASS_NOT_OPEN"
          - "no RingSlot with class_id == this class and status IN {SCHEDULED, RUNNING, COMPLETED} exists"
        side_effects:
          - "ShowClass.estimated_minutes = projected_all_entered variant of calculations.class_duration_estimate"
          - "increments ShowClass.version by 1"

      - from: SCHEDULED
        to: OPEN
        trigger: "system — cascade link 3 of Ring AVAILABLE -> MAINTENANCE_HOLD"
        actor: system
        preconditions:
          - "the class's only non-CANCELLED RingSlot was cancelled by the footing cascade"
        side_effects:
          - "ShowClass.estimated_minutes -> null"
          - "increments ShowClass.version by 1"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system — side effect of POST /ring-slots/{id}/start"
        actor: system
        preconditions:
          - "ShowClass.status == SCHEDULED"
        side_effects:
          - "increments ShowClass.version by 1"

      - from: IN_PROGRESS
        to: JUDGED
        trigger: "POST /classes/{id}/results"
        actor: Judge
        preconditions:
          - "ShowClass.status == IN_PROGRESS, else ERR_CLASS_NOT_IN_PROGRESS"
          - "ShowClass.entry_count >= 1, else ERR_NO_ENTRIES_TO_JUDGE"
          - "acting Official holds an OfficialAssignment with status == ACTIVE, official_role == JUDGE on this class's RUNNING slot, else ERR_JUDGE_NOT_ASSIGNED"
          - "acting Official does NOT also hold an OfficialAssignment with status == ACTIVE and official_role == STEWARD on the same slot, else ERR_SEGREGATION_OF_DUTIES"
          - "placings are distinct integers forming 1..k contiguous from 1, k <= min(5, count of ClassEntry with status == CONFIRMED), and every referenced class_entry_id belongs to this class with status == CONFIRMED, else ERR_INVALID_PLACINGS"
        side_effects:
          - "each referenced ClassEntry -> COMPLETED with its placing and round_seconds recorded"
          - "each ClassEntry with status == CONFIRMED not referenced in placings -> COMPLETED with placing == null"
          - "ShowClass.actual_minutes = actual_minutes from the request"
          - "ShowClass.placed_count recomputed"
          - "the class's RingSlot with status == RUNNING -> COMPLETED"
          - "recompute Ring.scheduled_minutes_total"
          - "increments ShowClass.version by 1"

      - from: JUDGED
        to: RESULTS_POSTED
        trigger: "POST /classes/{id}/post-results"
        actor: ShowSecretary
        preconditions:
          - "ShowClass.status == JUDGED, else ERR_CLASS_NOT_JUDGED"
          - "every ClassEntry on this class with a non-null placing belongs to an Entry with settlement_status == PAID, else ERR_UNPAID_PLACED_ENTRY"
          - "Show.allocated_prize_cents + the purse about to be awarded <= Show.prize_money_pool_cents, else ERR_PRIZE_POOL_EXCEEDED"
        side_effects:
          - "ClassEntry.prize_cents written for each placing per calculations.class_prize_allocation (round-per-place-then-sum, residual to place 1)"
          - "ShowClass.awarded_prize_cents = sum of the written ClassEntry.prize_cents"
          - "Show.allocated_prize_cents and Show.unallocated_prize_cents recomputed per calculations.show_prize_ledger"
          - "ShowClass.point_eligible recomputed (confirmed_entry_count >= MIN_ENTRIES_FOR_POINTS)"
          - "increments ShowClass.version by 1; increments Show.version by 1"

      - from: RESULTS_POSTED
        to: VOIDED
        trigger: "POST /classes/{id}/void-results"
        actor: ShowSecretary
        preconditions:
          - "ShowClass.status == RESULTS_POSTED, else ERR_CLASS_RESULTS_NOT_POSTED"
          - "no PointSubmission for this class with status IN {NATIONAL_ACCEPTED, REGIONAL_ACCEPTED, RECORDED}, else ERR_SUBMISSION_ALREADY_FINALIZED"
        side_effects:
          - "every ClassEntry on this class: prize_cents -> 0"
          - "ShowClass.awarded_prize_cents -> 0"
          - "Show.allocated_prize_cents and Show.unallocated_prize_cents recomputed — the released purse returns to unallocated_prize_cents with zero drift"
          - "increments ShowClass.version by 1; increments Show.version by 1"
        note: "Compensating action for post-results; conserves Show.prize_money_pool_cents."

      - from: RESULTS_POSTED
        to: POINTS_SUBMITTED
        trigger: "system — side effect of POST /classes/{id}/point-submissions"
        actor: system
        preconditions:
          - "ShowClass.status == RESULTS_POSTED"
          - "ShowClass.point_eligible == true"
        side_effects:
          - "increments ShowClass.version by 1"

      - from: POINTS_SUBMITTED
        to: RESULTS_POSTED
        trigger: "system — side effect of POST /point-submissions/{id}/acknowledgement with outcome == REJECTED"
        actor: system
        preconditions:
          - "the class's PointSubmission transitions to REJECTED"
        side_effects:
          - "increments ShowClass.version by 1"
        note: "Backward edge: a rejected submission returns the class to RESULTS_POSTED so a corrected submission can be created."

      - from: RESULTS_POSTED
        to: JUDGED
        trigger: "system — cascade link 3 of ComplianceCase OPEN -> SUBSTANTIATED (finding == POSITIVE)"
        actor: system
        preconditions:
          - "at least one ClassEntry on this class was disqualified by cascade link 2"
        side_effects:
          - "every ClassEntry on this class: prize_cents -> 0"
          - "ShowClass.awarded_prize_cents -> 0"
          - "ShowClass.placed_count recomputed"
          - "increments ShowClass.version by 1"

      - from: PLANNED
        to: VOIDED
        trigger: "system — side effect of Show SUBMITTED -> DENIED"
        actor: system
        preconditions:
          - "ShowClass.status == PLANNED"
        side_effects:
          - "increments ShowClass.version by 1"

  - entity: RingSlot
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /ring-slots/{id}/start"
        actor: RingMaster
        preconditions:
          - "RingSlot.status == SCHEDULED, else ERR_SLOT_NOT_SCHEDULED"
          - "RingSlot.slot_type == CLASS, else ERR_SLOT_NOT_SCHEDULED"
          - "Ring.status == AVAILABLE, else ERR_RING_NOT_AVAILABLE"
          - "the class's division's Show.license_status == APPROVED, else ERR_SHOW_LICENSE_NOT_APPROVED"
          - "Ring.footing_condition_score >= MIN_FOOTING_SCORE (60), else ERR_FOOTING_UNSAFE"
          - "there exists a CoverageShift with show_id == this show, coverage_type == VETERINARIAN, status == ACTIVE, start_utc <= slot.start_utc and slot.end_utc <= end_utc, else ERR_VET_COVERAGE_MISSING"
          - "for every (official_role, required) pair in REQUIRED_OFFICIALS[Show.competition_level] with required > 0, the count of distinct Official ids holding an OfficialAssignment on this slot with that official_role and status == ACTIVE is >= required, else ERR_OFFICIALS_REQUIREMENT_UNMET"
          - "Show.welfare_strike_count < WELFARE_STRIKE_LIMIT (2), else ERR_WELFARE_STRIKE_LIMIT"
        side_effects:
          - "ShowClass SCHEDULED -> IN_PROGRESS"
          - "increments RingSlot.version by 1"
        note: "Cross-entity dependency (RingSlot, CoverageShift)."

      - from: RUNNING
        to: COMPLETED
        trigger: "system — side effect of POST /classes/{id}/results"
        actor: system
        preconditions:
          - "RingSlot.status == RUNNING"
        side_effects:
          - "recompute Ring.scheduled_minutes_total"
          - "increments RingSlot.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system — cascade link 2 of Ring AVAILABLE -> MAINTENANCE_HOLD"
        actor: system
        preconditions:
          - "RingSlot.status == SCHEDULED and slot_type == CLASS"
        side_effects:
          - "CASCADE LINK 3: the slot's ShowClass reverts SCHEDULED -> OPEN"
          - "CASCADE LINK 4: every OfficialAssignment on this slot with status == ACTIVE -> RELEASED"
          - "increments RingSlot.version by 1"

  - entity: OfficialAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system — cascade link 4 of Ring AVAILABLE -> MAINTENANCE_HOLD (via RingSlot SCHEDULED -> CANCELLED)"
        actor: system
        preconditions:
          - "OfficialAssignment.status == ACTIVE"
          - "the assignment's RingSlot transitioned to CANCELLED in cascade link 2"
        side_effects:
          - "Official.assigned_minutes decremented by (RingSlot.end_utc - RingSlot.warmup_start_utc) in whole minutes per calculations.official_load_ledger"
          - "increments OfficialAssignment.version by 1"

  - entity: Entry
    initial_state: "verification_status=RECEIVED x settlement_status=UNBILLED"
    terminal_states: [WITHDRAWN, REFUNDED]
    note: "Parallel state dimensions on one row: verification_status and settlement_status advance independently; ClassEntry CONFIRMED is the join of the two."
    transitions:
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /entries/{id}/verify (verification_status dimension)"
        actor: ShowSecretary
        preconditions:
          - "verification_status == RECEIVED, else ERR_ENTRY_NOT_RECEIVED"
          - "Rider.membership_status == ACTIVE, else ERR_RIDER_MEMBERSHIP_LAPSED"
          - "Horse.coggins_expires_on >= Show.start_utc, else ERR_COGGINS_EXPIRED"
          - "Horse.eligibility_status == ELIGIBLE, else ERR_HORSE_SUSPENDED"
        side_effects:
          - "increments Entry.version by 1"

      - from: VERIFIED
        to: ACCEPTED
        trigger: "POST /entries/{id}/accept (verification_status dimension)"
        actor: ShowSecretary
        preconditions:
          - "verification_status == VERIFIED, else ERR_ENTRY_NOT_VERIFIED"
          - "Entry.requested_stall_count <= Show.available_stall_count, else ERR_STALL_CAPACITY_EXCEEDED"
        side_effects:
          - "Entry.assigned_stall_count = Entry.requested_stall_count"
          - "Show.reserved_stall_count and Show.available_stall_count recomputed per calculations.show_stall_ledger"
          - "every ClassEntry of this Entry with status == ENTERED whose Entry.settlement_status == PAID -> CONFIRMED (parallel-dimension join), and each affected ShowClass.confirmed_entry_count / point_eligible recomputed"
          - "increments Entry.version by 1; increments Show.version by 1"

      - from: "RECEIVED | VERIFIED | ACCEPTED"
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdrawal (verification_status dimension)"
        actor: Exhibitor
        preconditions:
          - "verification_status != WITHDRAWN, else ERR_ENTRY_ALREADY_TERMINAL"
          - "no ClassEntry of this Entry has status == DISQUALIFIED, and no ClassEntry of this Entry has status == COMPLETED on a ShowClass whose status IN {RESULTS_POSTED, POINTS_SUBMITTED, VOIDED}, else ERR_ENTRY_ALREADY_TERMINAL — a COMPLETED row on a merely JUDGED class does NOT block withdrawal, which is what leaves a placed-but-refunded row for validations priority 62 to catch at posting time"
        side_effects:
          - "Entry.assigned_stall_count -> 0"
          - "Show.reserved_stall_count and Show.available_stall_count recomputed — reserved_stall_count returns to its pre-accept value with zero drift"
          - "every ClassEntry of this Entry with status IN {ENTERED, CONFIRMED} -> SCRATCHED, and each affected ShowClass.entry_count / confirmed_entry_count / point_eligible recomputed"
          - "if settlement_status == PAID: settlement_status -> REFUNDED and Entry.refunded_cents = Entry.total_due_cents"
          - "increments Entry.version by 1; increments Show.version by 1"
        note: "Compensating action for accept; conserves Show.stall_capacity."

      - from: UNBILLED
        to: INVOICED
        trigger: "POST /entries/{id}/invoice (settlement_status dimension)"
        actor: ShowSecretary
        preconditions:
          - "settlement_status == UNBILLED, else ERR_ENTRY_ALREADY_INVOICED"
          - "verification_status != WITHDRAWN, else ERR_ENTRY_ALREADY_TERMINAL"
        side_effects:
          - "class_fee_cents_total, stall_fee_cents, preliminary_subtotal_cents, office_fee_cents and total_due_cents written per calculations.entry_settlement"
          - "increments Entry.version by 1"
        note: "Independent of verification_status: an Entry may be invoiced while still RECEIVED."

      - from: INVOICED
        to: PAID
        trigger: "POST /entries/{id}/payment (settlement_status dimension)"
        actor: Exhibitor
        preconditions:
          - "settlement_status == INVOICED, else ERR_ENTRY_NOT_INVOICED"
          - "amount_cents == Entry.total_due_cents, else ERR_PAYMENT_AMOUNT_MISMATCH"
        side_effects:
          - "every ClassEntry of this Entry with status == ENTERED whose Entry.verification_status == ACCEPTED -> CONFIRMED (parallel-dimension join), and each affected ShowClass.confirmed_entry_count / point_eligible recomputed"
          - "increments Entry.version by 1"

      - from: PAID
        to: REFUNDED
        trigger: "system — side effect of POST /entries/{id}/withdrawal when settlement_status == PAID"
        actor: system
        preconditions:
          - "settlement_status == PAID"
        side_effects:
          - "Entry.refunded_cents = Entry.total_due_cents"
          - "increments Entry.version by 1"

  - entity: ClassEntry
    initial_state: ENTERED
    terminal_states: [COMPLETED, DISQUALIFIED, SCRATCHED]
    transitions:
      - from: ENTERED
        to: CONFIRMED
        trigger: "system — side effect of POST /entries/{id}/accept or POST /entries/{id}/payment, whichever completes the pair"
        actor: system
        preconditions:
          - "Entry.verification_status == ACCEPTED AND Entry.settlement_status == PAID"
        side_effects:
          - "ShowClass.confirmed_entry_count and ShowClass.point_eligible recomputed"
          - "increments ClassEntry.version by 1"
        note: "Join of the two Entry dimensions; neither dimension alone confirms."

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system — side effect of POST /classes/{id}/results"
        actor: system
        preconditions:
          - "ClassEntry.status == CONFIRMED"
        side_effects:
          - "placing and round_seconds written (placing null when unplaced)"
          - "increments ClassEntry.version by 1"

      - from: "ENTERED | CONFIRMED"
        to: SCRATCHED
        trigger: "system — side effect of POST /entries/{id}/withdrawal"
        actor: system
        preconditions:
          - "ClassEntry.status IN {ENTERED, CONFIRMED}"
        side_effects:
          - "ShowClass.entry_count, confirmed_entry_count and point_eligible recomputed"
          - "increments ClassEntry.version by 1"

      - from: "ENTERED | CONFIRMED | COMPLETED"
        to: DISQUALIFIED
        trigger: "system — cascade link 2 of ComplianceCase OPEN -> SUBSTANTIATED (finding == POSITIVE)"
        actor: system
        preconditions:
          - "the ClassEntry's Entry.horse_id == the suspended Horse.id"
          - "ClassEntry.status IN {ENTERED, CONFIRMED, COMPLETED}"
          - "the ClassEntry's ShowClass.status != VOIDED"
        side_effects:
          - "ClassEntry.prize_cents -> 0; placing -> null"
          - "CASCADE LINK 3: the ClassEntry's ShowClass reverts RESULTS_POSTED -> JUDGED with awarded_prize_cents -> 0 (only when the class was RESULTS_POSTED)"
          - "ShowClass.entry_count, confirmed_entry_count, placed_count and point_eligible recomputed"
          - "increments ClassEntry.version by 1"

  - entity: PointSubmission
    initial_state: PREPARED
    terminal_states: [RECORDED, REJECTED, RETRACTED]
    note: "Fork-join over two standings bodies with divergent side-effect sets per branch."
    transitions:
      - from: PREPARED
        to: NATIONAL_ACCEPTED
        trigger: "POST /point-submissions/{id}/acknowledgement with standings_body == NATIONAL, outcome == ACCEPTED"
        actor: FederationOfficer
        preconditions:
          - "status == PREPARED, else ERR_SUBMISSION_ALREADY_FINALIZED"
        side_effects:
          - "ClassEntry.points_national written for every ClassEntry of the class with status == COMPLETED per the national_scale variant of calculations.rider_standing_points"
          - "PointSubmission.national_points_total = sum of those values; national_body_reference = body_reference"
          - "each placed ClassEntry's Rider.national_points_total += that ClassEntry.points_national"
          - "increments PointSubmission.version by 1"

      - from: PREPARED
        to: REGIONAL_ACCEPTED
        trigger: "POST /point-submissions/{id}/acknowledgement with standings_body == REGIONAL, outcome == ACCEPTED"
        actor: FederationOfficer
        preconditions:
          - "status == PREPARED, else ERR_SUBMISSION_ALREADY_FINALIZED"
        side_effects:
          - "ClassEntry.points_regional written per the regional_scale variant of calculations.rider_standing_points (top REGIONAL_PLACING_CAP placings only, then the per-show REGIONAL_SHOW_CAP applied per rider)"
          - "PointSubmission.regional_points_total = sum of those values; regional_body_reference = body_reference"
          - "each placed ClassEntry's Rider.regional_points_total += that ClassEntry.points_regional"
          - "increments PointSubmission.version by 1"

      - from: NATIONAL_ACCEPTED
        to: RECORDED
        trigger: "POST /point-submissions/{id}/acknowledgement with standings_body == REGIONAL, outcome == ACCEPTED"
        actor: FederationOfficer
        preconditions:
          - "status == NATIONAL_ACCEPTED"
        side_effects:
          - "regional leg side effects as in PREPARED -> REGIONAL_ACCEPTED"
          - "increments PointSubmission.version by 1"

      - from: REGIONAL_ACCEPTED
        to: RECORDED
        trigger: "POST /point-submissions/{id}/acknowledgement with standings_body == NATIONAL, outcome == ACCEPTED"
        actor: FederationOfficer
        preconditions:
          - "status == REGIONAL_ACCEPTED"
        side_effects:
          - "national leg side effects as in PREPARED -> NATIONAL_ACCEPTED"
          - "increments PointSubmission.version by 1"

      - from: "PREPARED | NATIONAL_ACCEPTED | REGIONAL_ACCEPTED"
        to: REJECTED
        trigger: "POST /point-submissions/{id}/acknowledgement with outcome == REJECTED"
        actor: FederationOfficer
        preconditions:
          - "status IN {PREPARED, NATIONAL_ACCEPTED, REGIONAL_ACCEPTED}, else ERR_SUBMISSION_ALREADY_FINALIZED"
        side_effects:
          - "COMPENSATION: for each already-credited leg, subtract the credited ClassEntry.points_national / points_regional from the corresponding Rider totals and reset those ClassEntry fields to 0"
          - "PointSubmission.national_points_total -> 0; regional_points_total -> 0"
          - "the class reverts POINTS_SUBMITTED -> RESULTS_POSTED"
          - "increments PointSubmission.version by 1; increments ShowClass.version by 1"

      - from: "PREPARED | NATIONAL_ACCEPTED | REGIONAL_ACCEPTED | RECORDED"
        to: RETRACTED
        trigger: "system — side effect of ComplianceCase OPEN -> SUBSTANTIATED (finding == POSITIVE) touching a class with an open submission"
        actor: system
        preconditions:
          - "status IN {PREPARED, NATIONAL_ACCEPTED, REGIONAL_ACCEPTED, RECORDED}"
        side_effects:
          - "COMPENSATION: credited Rider.national_points_total / regional_points_total decremented by the credited amounts; ClassEntry.points_national / points_regional -> 0"
          - "increments PointSubmission.version by 1"

  - entity: ComplianceCase
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: DISMISSED
        trigger: "POST /compliance-cases/{id}/finding with finding == NEGATIVE"
        actor: FederationOfficer
        preconditions:
          - "status == OPEN, else ERR_CASE_ALREADY_ADJUDICATED"
        side_effects:
          - "finding = NEGATIVE"
          - "increments ComplianceCase.version by 1"

      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /compliance-cases/{id}/finding with finding == WARNING (case_type == WELFARE_CITATION only)"
        actor: FederationOfficer
        preconditions:
          - "status == OPEN, else ERR_CASE_ALREADY_ADJUDICATED"
          - "case_type == WELFARE_CITATION, else ERR_FINDING_NOT_APPLICABLE"
        side_effects:
          - "finding = WARNING"
          - "Show.welfare_strike_count recomputed (a WARNING counts as a strike; no horse suspension)"
          - "increments ComplianceCase.version by 1; increments Show.version by 1"

      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /compliance-cases/{id}/finding with finding == POSITIVE"
        actor: FederationOfficer
        preconditions:
          - "status == OPEN, else ERR_CASE_ALREADY_ADJUDICATED"
        side_effects:
          - "finding = POSITIVE"
          - "CASCADE LINK 1: the Entry's Horse.eligibility_status -> SUSPENDED"
          - "CASCADE LINK 2 (caused by link 1): every ClassEntry whose Entry.horse_id == that Horse.id, with status IN {ENTERED, CONFIRMED, COMPLETED} and whose ShowClass.status != VOIDED -> DISQUALIFIED (prize_cents -> 0, placing -> null)"
          - "CASCADE LINK 3 (caused by link 2): every ShowClass touched by link 2 with status == RESULTS_POSTED reverts to JUDGED with awarded_prize_cents -> 0"
          - "CASCADE LINK 4 (caused by link 3): Show.allocated_prize_cents and Show.unallocated_prize_cents recomputed per calculations.show_prize_ledger"
          - "every PointSubmission of a class touched by link 2 with status IN {PREPARED, NATIONAL_ACCEPTED, REGIONAL_ACCEPTED, RECORDED} -> RETRACTED with standings compensation"
          - "Show.welfare_strike_count recomputed when case_type == WELFARE_CITATION"
          - "increments ComplianceCase.version by 1; increments Show.version by 1"
        note: "Depth-4 transitive cascade with a different trigger from the footing cascade."

  - entity: CoverageShift
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /coverage-shifts/{id}/activate"
        actor: GroundsManager
        preconditions:
          - "status == SCHEDULED, else ERR_COVERAGE_SHIFT_NOT_SCHEDULED"
          - "the logical clock is >= start_utc - COVERAGE_CHECKIN_LEAD_MINUTES (60), else ERR_COVERAGE_CHECKIN_TOO_EARLY"
        side_effects:
          - "increments CoverageShift.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: slot-create-stale-ring
    parent_entity: Ring
    write_endpoint: "POST /ring-slots"
    occ_field: "expected_ring_version"
    description: |
      Creating a RingSlot against a Ring whose version has advanced since the
      client last read it is rejected. The running order of a ring is a single
      ordered artifact: any earlier accepted slot (or a footing-maintenance hold)
      renumbers order_index across the ring and legitimately supersedes the
      layout the current writer was looking at, so a writer holding a stale
      Ring.version is rejected rather than silently reordered.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: points-submit-stale-class
    parent_entity: ShowClass
    write_endpoint: "POST /classes/{id}/point-submissions"
    occ_field: "expected_class_version"
    description: |
      Creating a PointSubmission against a ShowClass whose version has advanced
      since the client last read it is rejected. A corrected submission is
      permitted to supersede a prior rejected one, so a second create against the
      same class is legitimate product behaviour; the stale-version check is what
      distinguishes "I know about the prior submission and am replacing it" from
      "my view of the class predates the prior submission".
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: class_duration_estimate
    trigger: "On POST /ring-slots (writes ShowClass.estimated_minutes, variant projected_all_entered); on GET /shows/{id}/schedule-projection (computes both variants and their drift)."
    algorithm: threshold
    formula: |
      # --- mode (a) combinatorial: 4 inputs, nested min/max, branch on discipline ---
      base_round_seconds = { HUNTER: 90, JUMPER: 75, EQUITATION: 100, DRESSAGE: 300 }[division.discipline]
      height_factor      = 1 + max(0, class.jump_height_cm - HEIGHT_FACTOR_BASE_CM) / HEIGHT_FACTOR_DIVISOR
      rounds             = n            # n = the variant's entry count (see variants)
      if division.jumpoff_enabled == true and division.discipline == "JUMPER":
          jumpoff_rounds = min(ceil(n * JUMPOFF_RATE), JUMPOFF_CAP)
      else:
          jumpoff_rounds = 0
      course_walk_minutes = max(COURSE_WALK_MIN_MINUTES, ceil(n / 10) * 5)
      ride_minutes        = ceil((rounds + jumpoff_rounds) * base_round_seconds * height_factor / 60)
      estimated_minutes   = ride_minutes + course_walk_minutes + ring.turnover_buffer_minutes
      # Evaluation order is pinned: height_factor is applied to the ROUND TOTAL in
      # seconds and the single ceil() to minutes happens once, after multiplication.
      # Rounding per round and then summing is NOT the declared order.
    input_set: |
      `n` is a count of ClassEntry rows on the class, filtered by the variant's status set.
      Rows with status IN {SCRATCHED, DISQUALIFIED} are excluded by both variants.
      `ring` is the Ring of the RingSlot being created (for GET /shows/{id}/schedule-projection,
      the Ring of the class's slot with status IN {SCHEDULED, RUNNING}).
    constants:
      HEIGHT_FACTOR_BASE_CM: 100
      HEIGHT_FACTOR_DIVISOR: 200
      JUMPOFF_RATE: 0.30
      JUMPOFF_CAP: 8
      COURSE_WALK_MIN_MINUTES: 10
    precision: "whole minutes; ceil() on ride_minutes only, applied once after multiplication"
    variants:
      - name: projected_all_entered
        when: "At POST /ring-slots, and as GET /shows/{id}/schedule-projection.projected_total_minutes"
        difference: "n = count of ClassEntry with status IN {ENTERED, CONFIRMED} — includes entries whose Entry has not yet been accepted and/or paid."
      - name: confirmed_only
        when: "As GET /shows/{id}/schedule-projection.confirmed_only_total_minutes"
        difference: "n = count of ClassEntry with status == CONFIRMED only. Because CONFIRMED requires BOTH Entry dimensions, this is a strict subset of projected_all_entered; the two variants return different minute counts for identical stored data, and their difference is reported as projected_drift_minutes = projected_total_minutes - confirmed_only_total_minutes."

  - name: rider_standing_points
    trigger: "On POST /point-submissions/{id}/acknowledgement with outcome == ACCEPTED (writes ClassEntry.points_national or points_regional and the corresponding Rider total); on GET /riders/{id}/standings (recomputes both variants read-only)."
    algorithm: weighted_scoring
    formula: |
      # --- national_scale ---
      NATIONAL_POINTS = {1: 10, 2: 6, 3: 4, 4: 3, 5: 2}      # every filled ribbon scores
      if   class.confirmed_entry_count >= 25: multiplier = 2.0
      elif class.confirmed_entry_count >= 10: multiplier = 1.5
      elif class.confirmed_entry_count >=  3: multiplier = 1.0
      else:                                   multiplier = 0.0
      points_national = round_half_up(NATIONAL_POINTS.get(placing, 0) * multiplier, 1)

      # --- regional_scale ---
      REGIONAL_POINTS = {1: 8, 2: 5, 3: 3}          # placings 4 and 5 score 0
      raw_regional = REGIONAL_POINTS.get(placing, 0) if placing <= REGIONAL_PLACING_CAP else 0
      # per-show cap applied per rider, over ClassEntry rows of the SAME Show,
      # processed in ascending (ShowClass.class_number, ClassEntry.created_at) order:
      already = sum of points_regional already credited to this rider for this show
      points_regional = min(raw_regional, max(0, REGIONAL_SHOW_CAP - already))
    input_set: |
      Only ClassEntry rows on the class with status == COMPLETED and a non-null placing score.
      Rows with status IN {DISQUALIFIED, SCRATCHED} or placing == null score 0 in both variants.
      `already` sums points_regional over ClassEntry rows whose Entry.rider_id == this rider and
      Entry.show_id == this show, restricted to rows whose PointSubmission.status IN
      {REGIONAL_ACCEPTED, RECORDED}, ordered by (ShowClass.class_number ASC, ClassEntry.created_at ASC).
    constants:
      REGIONAL_PLACING_CAP: 3
      REGIONAL_SHOW_CAP: 20
      MIN_ENTRIES_FOR_POINTS: 3
    precision: "1 decimal place, round_half_up, for national points; regional points are whole numbers"
    variants:
      - name: national_scale
        when: "standings_body == NATIONAL"
        difference: "Awards through 5th place and scales the whole table by an entry-count tier multiplier; no per-show cap."
      - name: regional_scale
        when: "standings_body == REGIONAL"
        difference: "Awards only through REGIONAL_PLACING_CAP (3rd) with a flat table, no entry-count multiplier, and applies a REGIONAL_SHOW_CAP of 20 points per rider per show. For identical placings the two variants return different totals — e.g. a 1st place in a 3-entry class scores 10.0 nationally and 8 regionally, and a 4th place scores 3.0 nationally and 0 regionally."

  - name: class_prize_allocation
    trigger: "On Show SUBMITTED -> APPROVED and on ShowClass PLANNED -> OPEN (purse fields only); on POST /classes/{id}/post-results (writes ClassEntry.prize_cents and ShowClass.awarded_prize_cents)."
    algorithm: waterfall_allocation
    formula: |
      # --- mode (b) combinatorial: nested rounding whose ORDER is pinned ---
      division.division_allotment_cents = round_half_up(show.prize_money_pool_cents * division.division_share_bp / 10000)
      class.class_purse_cents           = round_half_up(division.division_allotment_cents * class.class_share_bp / 10000)

      PLACE_SHARE_BP = {1: 4000, 2: 2500, 3: 1600, 4: 1100, 5: 800}     # five ribbons, sums to 10000

      # PINNED ORDER: round EACH place independently to whole cents, in ascending
      # placing order 1..k, and only THEN sum. "Sum the exact shares first, then
      # round once" is explicitly NOT the declared order.
      k = min(5, class.placed_count)
      for p in 1..k (ascending):
          place_cents[p] = round_half_up(class.class_purse_cents * PLACE_SHARE_BP[p] / 10000)
      awarded = sum(place_cents[1..k])

      # Residual reconciliation applies ONLY when all five ribbons were filled:
      if k == 5:
          place_cents[1] = place_cents[1] + (class.class_purse_cents - awarded)   # residual may be negative
          awarded = class.class_purse_cents
      # When k < 5 the unfilled places' shares are NOT redistributed: awarded < class_purse_cents.

      ClassEntry.prize_cents = place_cents[its placing]   (0 when placing is null)
      ShowClass.awarded_prize_cents = awarded
    input_set: "ClassEntry rows on the class with status == COMPLETED and a non-null placing (1..5), ordered by placing ASC. DISQUALIFIED and SCRATCHED rows are excluded and receive prize_cents = 0."
    constants:
      PLACE_SHARE_BP: "{1: 4000, 2: 2500, 3: 1600, 4: 1100, 5: 800}"
    precision: "whole cents, round_half_up, rounded per place then summed; residual (possibly negative) folded into place 1 only when k == 5"

  - name: entry_settlement
    trigger: "On POST /entries/{id}/invoice (writes class_fee_cents_total, stall_fee_cents, preliminary_subtotal_cents, office_fee_cents, total_due_cents)."
    algorithm: tiered_pricing
    formula: |
      # --- mode (c) combinatorial: circular-LOOKING dependency, evaluation order pinned ---
      class_fee_cents_total      = SUM(showclass.entry_fee_cents) over this entry's ClassEntry rows
                                   with status IN {ENTERED, CONFIRMED, COMPLETED, DISQUALIFIED}
      stall_fee_cents            = entry.requested_stall_count * show.stall_fee_cents
      preliminary_subtotal_cents = class_fee_cents_total + stall_fee_cents

      # The office fee is "waived on large invoices", which reads as a rule about
      # total_due_cents — but total_due_cents contains the fee. The tier is therefore
      # PINNED to preliminary_subtotal_cents (the pre-fee figure) and evaluated exactly once:
      if   preliminary_subtotal_cents >= OFFICE_FEE_WAIVER_CENTS: office_fee_cents = 0
      elif preliminary_subtotal_cents >= OFFICE_FEE_REDUCED_CENTS: office_fee_cents = OFFICE_FEE_REDUCED_AMOUNT_CENTS
      else:                                                        office_fee_cents = OFFICE_FEE_FULL_AMOUNT_CENTS

      total_due_cents = preliminary_subtotal_cents + office_fee_cents
      # No re-evaluation: a subtotal of 97500 yields office_fee 2500 and total 100000,
      # even though 100000 would itself have qualified for the waiver.
    input_set: "ClassEntry rows of this Entry with status IN {ENTERED, CONFIRMED, COMPLETED, DISQUALIFIED}; SCRATCHED rows are excluded. requested_stall_count is used (never assigned_stall_count), so the invoice is independent of the verification dimension."
    constants:
      OFFICE_FEE_WAIVER_CENTS: 100000
      OFFICE_FEE_REDUCED_CENTS: 50000
      OFFICE_FEE_REDUCED_AMOUNT_CENTS: 2500
      OFFICE_FEE_FULL_AMOUNT_CENTS: 5000
    precision: "whole cents; no rounding required (all inputs are integer cents)"

  - name: ring_schedule_layout
    trigger: "On POST /ring-slots and on POST /rings/{id}/footing-maintenance (writes RingSlot.end_utc, warmup_start_utc, order_index and Ring.scheduled_minutes_total / slot_count); overlap rejection is validations priority 42."
    algorithm: interval_merge
    formula: |
      slot.duration_minutes = class.estimated_minutes            (slot_type == CLASS)
                            = requested duration_minutes         (slot_type == MAINTENANCE)
      slot.end_utc          = slot.start_utc + duration_minutes
      slot.warmup_start_utc = slot.start_utc - WARMUP_LEAD_MINUTES

      # Running order: recomputed across the whole ring on every insert.
      occupying = RingSlot rows with ring_id == this ring and status IN {SCHEDULED, RUNNING, COMPLETED}
      sort occupying by (start_utc ASC, created_at ASC)          # created_at is the tie-break; id is never used
      order_index = 1-based position in that sorted list

      ring.scheduled_minutes_total = SUM over `occupying` of (end_utc - start_utc) in whole minutes
      ring.slot_count              = COUNT(occupying)

      # --- RING OVERLAP GEOMETRY (half-open intervals + symmetric turnover buffer) ---
      # candidate `new` collides with existing slot S (status IN {SCHEDULED, RUNNING}) iff
      #     new.start_utc < S.end_utc   + ring.turnover_buffer_minutes
      # AND S.start_utc   < new.end_utc + ring.turnover_buffer_minutes
      # Touching exactly at S.end_utc + buffer does NOT collide (strict `<`).
      # Warm-up windows are NOT part of this geometry.
    input_set: "RingSlot rows on the same Ring with status IN {SCHEDULED, RUNNING} are the collision set; CANCELLED and COMPLETED slots do not block. order_index and the minute totals additionally include COMPLETED slots."
    constants:
      WARMUP_LEAD_MINUTES: 30
    precision: "whole minutes; datetimes at second granularity, ISO 8601 UTC"

  - name: official_load_ledger
    trigger: "On POST /official-assignments (increment) and on OfficialAssignment ACTIVE -> RELEASED (decrement); overlap rejection is validations priority 43, load cap is priority 55."
    algorithm: aggregation
    formula: |
      occupancy(assignment) = [slot.warmup_start_utc, slot.end_utc]      # CLOSED interval
      official.assigned_minutes = SUM over the official's OfficialAssignment rows with
          status == ACTIVE of (slot.end_utc - slot.warmup_start_utc) in whole minutes

      # --- OFFICIAL OVERLAP GEOMETRY (closed intervals + conditional travel gap) ---
      # A second chair on the SAME RingSlot is not a time conflict (the official is
      # already standing in that ring), so assignments with A_slot.id == new_slot.id
      # are excluded from the geometry; the duties clash they create is caught by
      # validations priority 32 (ERR_SEGREGATION_OF_DUTIES) at card time instead.
      required_gap_minutes = 0 if existing_slot.ring_id == new_slot.ring_id
                             else OFFICIAL_TRAVEL_GAP_MINUTES
      # candidate `new` collides with existing ACTIVE assignment A of the same official
      # on a DIFFERENT slot (A_slot.id != new_slot.id) iff
      #     new.warmup_start_utc <= A_slot.end_utc        + required_gap_minutes
      # AND A_slot.warmup_start_utc <= new.end_utc        + required_gap_minutes
      # Closed intervals: touching endpoints DO collide (non-strict `<=`), and the
      # supervised warm-up window is part of the occupancy — both differences from
      # the ring geometry above.
    input_set: "OfficialAssignment rows of the same Official with status == ACTIVE whose RingSlot.status IN {SCHEDULED, RUNNING}; RELEASED assignments and CANCELLED/COMPLETED slots are excluded."
    constants:
      OFFICIAL_TRAVEL_GAP_MINUTES: 20
      MAX_OFFICIAL_DAILY_MINUTES: 480
      MIN_OFFICIAL_LICENSE_LEVEL: "{ LOCAL: 1, REGIONAL: 2, NATIONAL: 3, PREMIER: 4 }"
      REQUIRED_OFFICIALS: "{ LOCAL: {JUDGE: 1, STEWARD: 1, TECHNICAL_DELEGATE: 0}, REGIONAL: {JUDGE: 2, STEWARD: 1, TECHNICAL_DELEGATE: 0}, NATIONAL: {JUDGE: 2, STEWARD: 1, TECHNICAL_DELEGATE: 1}, PREMIER: {JUDGE: 3, STEWARD: 2, TECHNICAL_DELEGATE: 1} }"
    precision: "whole minutes"

  - name: show_stall_ledger
    trigger: "On POST /entries/{id}/accept (reserve) and POST /entries/{id}/withdrawal (release)."
    algorithm: aggregation
    formula: |
      show.reserved_stall_count  = SUM(entry.assigned_stall_count) over Entry rows with
                                   show_id == this show and verification_status == ACCEPTED
      show.available_stall_count = show.stall_capacity - show.reserved_stall_count
      # CONSERVED QUANTITY (invariant, checked before and after every accept/withdrawal pair):
      #     show.stall_capacity == show.reserved_stall_count + show.available_stall_count
      # accept sets entry.assigned_stall_count = entry.requested_stall_count;
      # withdrawal sets it back to 0. A forward+compensating pair therefore returns
      # reserved_stall_count to its exact pre-accept value (zero drift).
    input_set: "Entry rows with verification_status == ACCEPTED only. RECEIVED, VERIFIED and WITHDRAWN entries contribute 0 regardless of requested_stall_count."
    constants: {}
    precision: "integer stall units"

  - name: show_prize_ledger
    trigger: "On POST /classes/{id}/post-results (allocate), POST /classes/{id}/void-results (release), and cascade link 4 of a POSITIVE compliance finding; division_share_bp_total is recomputed on POST /shows/{id}/divisions and on licence submission."
    algorithm: aggregation
    formula: |
      show.allocated_prize_cents   = SUM(class.awarded_prize_cents) over ShowClass rows whose
                                     division.show_id == this show and status IN {RESULTS_POSTED, POINTS_SUBMITTED}
      show.unallocated_prize_cents = show.prize_money_pool_cents - show.allocated_prize_cents
      show.division_share_bp_total = SUM(division.division_share_bp) over CompetitionDivision rows
                                     with show_id == this show and status == ACTIVE
      # CONSERVED QUANTITY (invariant, checked before and after every post/void pair):
      #     show.prize_money_pool_cents == show.allocated_prize_cents + show.unallocated_prize_cents
      # post-results adds exactly class.awarded_prize_cents to allocated_prize_cents;
      # void-results subtracts exactly the same amount, so the pair leaves
      # prize_money_pool_cents AND unallocated_prize_cents at their pre-post values.
    input_set: "ShowClass rows with status IN {RESULTS_POSTED, POINTS_SUBMITTED} only. JUDGED, VOIDED and pre-judged classes contribute 0."
    constants: {}
    precision: "whole cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-segment resource exists, validated left-to-right"
    error_id: "ERR_SHOW_NOT_FOUND | ERR_RING_NOT_FOUND | ERR_DIVISION_NOT_FOUND | ERR_CLASS_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_CLASS_ENTRY_NOT_FOUND | ERR_OFFICIAL_NOT_FOUND | ERR_RIDER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_POINT_SUBMISSION_NOT_FOUND | ERR_COMPLIANCE_CASE_NOT_FOUND | ERR_COVERAGE_SHIFT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: auth
    check: "For entity_backed roles, X-User-ID resolves to an existing instance of the backing entity (Exhibitor -> Rider, Judge/Steward -> Official)"
    error_id: ERR_ACTOR_NOT_RECOGNIZED
    http_status: 403
    applies_to: "all endpoints whose roles include Exhibitor, Judge or Steward"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_SHOW_NOT_FOUND | ERR_RING_NOT_FOUND | ERR_CLASS_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_OFFICIAL_NOT_FOUND | ERR_RIDER_NOT_FOUND | ERR_HORSE_NOT_FOUND | ERR_CLASS_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /ring-slots, POST /official-assignments, POST /shows/{id}/entries, POST /class-entries, POST /divisions/{id}/classes, POST /entries/{id}/compliance-cases, POST /classes/{id}/results"

  - priority: 6
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: all required fields present, enum values are declared members, integers within their declared ranges, ISO 8601 datetimes parseable, and conditional fields honoured (ComplianceCase.sample_code required iff case_type == DRUG_TEST; welfare_rule_code required iff case_type == WELFARE_CITATION)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 7
    category: auth
    check: "An Exhibitor acting on an Entry must own it: Entry.rider_id == X-User-ID"
    error_id: ERR_ENTRY_NOT_OWNED
    http_status: 403
    applies_to: "POST /entries/{id}/payment, POST /entries/{id}/withdrawal, POST /class-entries, POST /shows/{id}/entries"

  - priority: 8
    category: state
    check: "The supplied expected_<parent>_version equals the parent entity's current version (OCC per §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ring-slots, POST /classes/{id}/point-submissions"

  - priority: 10
    category: state
    check: "The target resource is in the state its transition requires (see §1.2 preconditions)"
    error_id: "ERR_SHOW_LICENSE_NOT_SUBMITTED | ERR_SHOW_LICENSE_NOT_DRAFT | ERR_CLASS_NOT_PLANNED | ERR_CLASS_NOT_OPEN | ERR_CLASS_NOT_IN_PROGRESS | ERR_CLASS_NOT_JUDGED | ERR_CLASS_RESULTS_NOT_POSTED | ERR_SLOT_NOT_SCHEDULED | ERR_RING_NOT_AVAILABLE | ERR_ENTRY_NOT_RECEIVED | ERR_ENTRY_NOT_VERIFIED | ERR_ENTRY_ALREADY_INVOICED | ERR_ENTRY_NOT_INVOICED | ERR_ENTRY_ALREADY_TERMINAL | ERR_SUBMISSION_ALREADY_FINALIZED | ERR_CASE_ALREADY_ADJUDICATED | ERR_COVERAGE_SHIFT_NOT_SCHEDULED | ERR_CLASS_ALREADY_SCHEDULED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 12
    category: state
    check: "Cross-entity licence gate: the owning Show.license_status must be APPROVED for class opening, entry submission and slot start; and must be IN {DRAFT, RETURNED_FOR_CORRECTION} for division/class creation"
    error_id: "ERR_SHOW_LICENSE_NOT_APPROVED | ERR_SHOW_LICENSE_LOCKED"
    http_status: 409
    applies_to: "POST /classes/{id}/open, POST /shows/{id}/entries, POST /ring-slots/{id}/start, POST /shows/{id}/divisions, POST /divisions/{id}/classes"

  - priority: 20
    category: business_safety
    check: "Rider.membership_status == ACTIVE (logical clock strictly before membership_expires_on)"
    error_id: ERR_RIDER_MEMBERSHIP_LAPSED
    http_status: 422
    applies_to: "POST /entries/{id}/verify"

  - priority: 21
    category: business_safety
    check: "Horse.coggins_expires_on >= Show.start_utc"
    error_id: ERR_COGGINS_EXPIRED
    http_status: 422
    applies_to: "POST /entries/{id}/verify, POST /class-entries"

  - priority: 22
    category: business_safety
    check: "Horse.eligibility_status == ELIGIBLE"
    error_id: ERR_HORSE_SUSPENDED
    http_status: 422
    applies_to: "POST /entries/{id}/verify, POST /class-entries"

  - priority: 23
    category: business_safety
    check: "The official's licence covers the assignment: official_role is a member of Official.license_roles, the class's division discipline is a member of Official.licensed_disciplines, Official.license_level >= MIN_OFFICIAL_LICENSE_LEVEL[Show.competition_level], and RingSlot.start_utc < Official.license_expires_on"
    error_id: ERR_OFFICIAL_LICENSE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /official-assignments"

  - priority: 24
    category: business_safety
    check: "Ring.footing_condition_score >= MIN_FOOTING_SCORE (60)"
    error_id: ERR_FOOTING_UNSAFE
    http_status: 422
    applies_to: "POST /ring-slots/{id}/start"

  - priority: 25
    category: business_safety
    check: "An ACTIVE VETERINARIAN CoverageShift of the same Show satisfies start_utc <= slot.start_utc AND slot.end_utc <= end_utc"
    error_id: ERR_VET_COVERAGE_MISSING
    http_status: 422
    applies_to: "POST /ring-slots/{id}/start"

  - priority: 26
    category: business_safety
    check: "For every (official_role, required) pair in REQUIRED_OFFICIALS[Show.competition_level] with required > 0, the slot carries at least `required` distinct Officials with an ACTIVE assignment in that role"
    error_id: ERR_OFFICIALS_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /ring-slots/{id}/start"

  - priority: 27
    category: business_safety
    check: "Show.welfare_strike_count < WELFARE_STRIKE_LIMIT (2)"
    error_id: ERR_WELFARE_STRIKE_LIMIT
    http_status: 409
    applies_to: "POST /ring-slots/{id}/start"

  - priority: 30
    category: business_referential
    check: "Conflict of interest: Official.affiliated_trainer_name must not equal Rider.trainer_name of any Rider holding a ClassEntry with status IN {ENTERED, CONFIRMED} in the slot's ShowClass"
    error_id: ERR_OFFICIAL_CONFLICT_OF_INTEREST
    http_status: 409
    applies_to: "POST /official-assignments"

  - priority: 31
    category: business_referential
    check: "The acting Judge (X-User-ID) holds an OfficialAssignment with status == ACTIVE and official_role == JUDGE on the class's RUNNING RingSlot"
    error_id: ERR_JUDGE_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /classes/{id}/results"

  - priority: 32
    category: business_referential
    check: "Segregation of duties: the acting Judge (X-User-ID) must NOT also hold an ACTIVE OfficialAssignment with official_role == STEWARD on the same RingSlot"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /classes/{id}/results"

  - priority: 33
    category: business_referential
    check: "qualifier_for_class_id, when supplied, references a ShowClass in the same Show and introduces no cycle in the qualifier chain (following qualifier_for_class_id transitively must not revisit the new class)"
    error_id: ERR_QUALIFIER_CYCLE
    http_status: 409
    applies_to: "POST /divisions/{id}/classes"

  - priority: 40
    category: business_temporal
    check: "The logical clock is strictly before Show.entry_close_utc"
    error_id: ERR_ENTRY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /shows/{id}/entries, POST /class-entries"

  - priority: 41
    category: business_temporal
    check: "Show.start_utc <= slot.start_utc AND slot.end_utc <= Show.end_utc"
    error_id: ERR_SLOT_OUTSIDE_SHOW_WINDOW
    http_status: 409
    applies_to: "POST /ring-slots, POST /rings/{id}/footing-maintenance"

  - priority: 42
    category: business_temporal
    check: "Ring overlap geometry (half-open intervals + symmetric turnover buffer) finds no collision with an existing RingSlot on the same Ring with status IN {SCHEDULED, RUNNING}"
    error_id: ERR_RING_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /ring-slots, POST /rings/{id}/footing-maintenance (only when new_footing_condition_score >= MIN_FOOTING_SCORE)"

  - priority: 43
    category: business_temporal
    check: "Official overlap geometry (closed [warmup_start_utc, end_utc] intervals + 0-minute same-ring / OFFICIAL_TRAVEL_GAP_MINUTES cross-ring gap) finds no collision with another ACTIVE assignment of the same Official on a different RingSlot; a second chair on the same RingSlot is exempt and is policed by priority 32 instead"
    error_id: ERR_OFFICIAL_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /official-assignments"

  - priority: 50
    category: business_constraint
    check: "CompetitionDivision.min_jump_height_cm <= ShowClass.jump_height_cm <= CompetitionDivision.max_jump_height_cm (inclusive on both ends)"
    error_id: ERR_JUMP_HEIGHT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /divisions/{id}/classes"

  - priority: 51
    category: business_constraint
    check: "class_number is unique across all ShowClass rows whose division.show_id equals this Show"
    error_id: ERR_CLASS_NUMBER_DUPLICATE
    http_status: 409
    applies_to: "POST /divisions/{id}/classes"

  - priority: 52
    category: business_constraint
    check: "Show.division_share_bp_total (after adding the new division) <= 10000"
    error_id: ERR_DIVISION_SHARE_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /shows/{id}/divisions, POST /shows/{id}/license-submission"

  - priority: 53
    category: business_constraint
    check: "ShowClass.entry_count < ShowClass.max_entries"
    error_id: ERR_CLASS_FULL
    http_status: 409
    applies_to: "POST /class-entries"

  - priority: 54
    category: business_constraint
    check: "No existing ClassEntry with the same (entry_id, class_id) and status IN {ENTERED, CONFIRMED, COMPLETED, DISQUALIFIED}"
    error_id: ERR_DUPLICATE_CLASS_ENTRY
    http_status: 409
    applies_to: "POST /class-entries"

  - priority: 55
    category: business_constraint
    check: "Official.assigned_minutes + the new slot's (end_utc - warmup_start_utc) minutes <= MAX_OFFICIAL_DAILY_MINUTES (480)"
    error_id: ERR_OFFICIAL_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /official-assignments"

  - priority: 56
    category: business_constraint
    check: "ShowClass.entry_count >= 1"
    error_id: ERR_NO_ENTRIES_TO_JUDGE
    http_status: 409
    applies_to: "POST /classes/{id}/results"

  - priority: 57
    category: business_constraint
    check: "placings are distinct integers forming a contiguous run 1..k, k <= min(5, count of CONFIRMED ClassEntry rows), and every class_entry_id belongs to this class with status == CONFIRMED"
    error_id: ERR_INVALID_PLACINGS
    http_status: 422
    applies_to: "POST /classes/{id}/results"

  - priority: 58
    category: business_constraint
    check: "ShowClass.point_eligible == true, i.e. ShowClass.confirmed_entry_count >= MIN_ENTRIES_FOR_POINTS (3)"
    error_id: ERR_CLASS_NOT_POINT_ELIGIBLE
    http_status: 409
    applies_to: "POST /classes/{id}/point-submissions"

  - priority: 59
    category: business_constraint
    check: "The show has at least one ACTIVE CompetitionDivision and at least one ShowClass"
    error_id: ERR_CLASS_LIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /shows/{id}/license-submission, POST /shows/{id}/license-decision (decision == APPROVE)"

  - priority: 60
    category: business_fiscal
    check: "Entry.requested_stall_count <= Show.available_stall_count (reject only when strictly greater)"
    error_id: ERR_STALL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /entries/{id}/accept"

  - priority: 61
    category: business_fiscal
    check: "Show.allocated_prize_cents + ShowClass.awarded_prize_cents (about to be written) <= Show.prize_money_pool_cents"
    error_id: ERR_PRIZE_POOL_EXCEEDED
    http_status: 409
    applies_to: "POST /classes/{id}/post-results"

  - priority: 62
    category: business_fiscal
    check: "Every ClassEntry with a non-null placing belongs to an Entry with settlement_status == PAID"
    error_id: ERR_UNPAID_PLACED_ENTRY
    http_status: 402
    applies_to: "POST /classes/{id}/post-results"

  - priority: 63
    category: business_fiscal
    check: "amount_cents equals Entry.total_due_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /entries/{id}/payment"

  - priority: 64
    category: business_temporal
    check: "The logical clock is >= CoverageShift.start_utc - COVERAGE_CHECKIN_LEAD_MINUTES (60)"
    error_id: ERR_COVERAGE_CHECKIN_TOO_EARLY
    http_status: 409
    applies_to: "POST /coverage-shifts/{id}/activate"

  - priority: 65
    category: business_constraint
    check: "finding == WARNING is only permitted when case_type == WELFARE_CITATION"
    error_id: ERR_FINDING_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /compliance-cases/{id}/finding"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: "/shows/{id}"
    description: "Fetch one show with its licensing state, stall ledger and prize ledger."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: GET
    path: "/shows/{id}/rings"
    description: "List the rings on this show's grounds (FK reverse reachability for Ring.show_id)."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Ring[]
    side_effects: []

  - method: GET
    path: "/shows/{id}/divisions"
    description: "List this show's competition divisions (FK reverse reachability for CompetitionDivision.show_id)."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["status?", "discipline?", "limit?", "offset?"]
    output: CompetitionDivision[]
    side_effects: []

  - method: GET
    path: "/shows/{id}/coverage-shifts"
    description: "List veterinary and farrier coverage windows for this show (FK reverse reachability for CoverageShift.show_id)."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["coverage_type?", "status?", "limit?", "offset?"]
    output: CoverageShift[]
    side_effects: []

  - method: GET
    path: "/shows/{id}/schedule-projection"
    description: "Computed read: both variants of calculations.class_duration_estimate for every class of the show that currently holds a SCHEDULED or RUNNING ring slot, plus their aggregate drift."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: "{show_id: string, projected_total_minutes: integer, confirmed_only_total_minutes: integer, projected_drift_minutes: integer, class_projections: array}"
    side_effects: []

  - method: GET
    path: "/rings/{id}"
    description: "Fetch one ring with footing condition, status and schedule totals."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: Ring
    side_effects: []

  - method: GET
    path: "/classes/{id}"
    description: "Fetch one class with its counts, purse, estimate and point eligibility."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: ShowClass
    side_effects: []

  - method: GET
    path: "/classes"
    description: "Filtered class list; covers FK reverse reachability for ShowClass.division_id and the self-referential ShowClass.qualifier_for_class_id."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["division_id?", "qualifier_for_class_id?", "status?", "limit?", "offset?"]
    output: ShowClass[]
    side_effects: []

  - method: GET
    path: "/classes/{id}/point-submissions"
    description: "List standings submissions raised for this class (FK reverse reachability for PointSubmission.class_id); the only discovery channel for a submission id."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PointSubmission[]
    side_effects: []

  - method: GET
    path: "/ring-slots/{id}"
    description: "Fetch one ring slot with its computed window, warm-up lead and running-order index."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: RingSlot
    side_effects: []

  - method: GET
    path: "/ring-slots"
    description: "Filtered ring-slot list; covers FK reverse reachability for RingSlot.ring_id and RingSlot.class_id, and is the only discovery channel for MAINTENANCE slots synthesized by footing maintenance."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["ring_id?", "class_id?", "slot_type?", "status?", "limit?", "offset?"]
    output: RingSlot[]
    side_effects: []

  - method: GET
    path: "/officials/{id}"
    description: "Fetch one official with licence facts and current assigned-minute load."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: Official
    side_effects: []

  - method: GET
    path: "/official-assignments/{id}"
    description: "Fetch one official assignment."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: OfficialAssignment
    side_effects: []

  - method: GET
    path: "/official-assignments"
    description: "Filtered assignment list; covers FK reverse reachability for OfficialAssignment.official_id and OfficialAssignment.slot_id."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["official_id?", "slot_id?", "official_role?", "status?", "limit?", "offset?"]
    output: OfficialAssignment[]
    side_effects: []

  - method: GET
    path: "/riders/{id}"
    description: "Fetch one rider with membership status re-derived against the logical clock."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: Rider
    side_effects: []

  - method: GET
    path: "/riders/{id}/standings"
    description: "Computed read: the rider's national and regional standings totals recomputed from accepted point submissions, plus the count of scoring classes and whether the regional per-show cap bound."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["show_id?"]
    output: "{rider_id: string, national_points_total: number, regional_points_total: number, national_class_count: integer, regional_capped: boolean}"
    side_effects: []

  - method: GET
    path: "/horses/{id}"
    description: "Fetch one horse with computed Coggins expiry and eligibility status."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: Horse
    side_effects: []

  - method: GET
    path: "/entries/{id}"
    description: "Fetch one entry with both parallel status dimensions and the full settlement breakdown."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: Entry
    side_effects: []

  - method: GET
    path: "/entries"
    description: "Filtered entry list; covers FK reverse reachability for Entry.show_id, Entry.rider_id and Entry.horse_id."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["show_id?", "rider_id?", "horse_id?", "verification_status?", "settlement_status?", "limit?", "offset?"]
    output: Entry[]
    side_effects: []

  - method: GET
    path: "/class-entries/{id}"
    description: "Fetch one class entry with placing, prize and standings points."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: ClassEntry
    side_effects: []

  - method: GET
    path: "/class-entries"
    description: "Filtered class-entry list; covers FK reverse reachability for ClassEntry.entry_id and ClassEntry.class_id."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["entry_id?", "class_id?", "status?", "limit?", "offset?"]
    output: ClassEntry[]
    side_effects: []

  - method: GET
    path: "/compliance-cases/{id}"
    description: "Fetch one drug-test or welfare-citation case."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: []
    output: ComplianceCase
    side_effects: []

  - method: GET
    path: "/compliance-cases"
    description: "Filtered compliance-case list; covers FK reverse reachability for ComplianceCase.entry_id and ComplianceCase.opened_by_official_id."
    roles: [ShowSecretary, FederationOfficer, RingMaster, Judge, Steward, Exhibitor, GroundsManager]
    code: 200
    input: ["entry_id?", "opened_by_official_id?", "case_type?", "status?", "limit?", "offset?"]
    output: ComplianceCase[]
    side_effects: []

  # --------------------------------------------------------------- writes ----
  - method: POST
    path: "/shows"
    description: "Create a show in DRAFT licensing state."
    roles: [ShowSecretary]
    code: 201
    input: [name, federation_show_id, venue, competition_level, start_utc, end_utc, entry_close_utc, prize_money_pool_cents, stall_capacity, stall_fee_cents]
    output: Show
    side_effects: ["license_status = DRAFT", "unallocated_prize_cents = prize_money_pool_cents", "available_stall_count = stall_capacity"]

  - method: POST
    path: "/shows/{id}/license-submission"
    description: "Submit (or resubmit) the show's prize list to the national federation for licensing."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: Show
    side_effects: ["Show DRAFT -> SUBMITTED, or RETURNED_FOR_CORRECTION -> SUBMITTED with revision_count += 1", "recomputes Show.division_share_bp_total", "increments Show.version by 1"]

  - method: POST
    path: "/shows/{id}/license-decision"
    description: "Federation decision on a submitted show licence. decision == RETURN escalates automatically to DENIED once revision_count has reached MAX_LICENSE_REVISIONS."
    roles: [FederationOfficer]
    code: 200
    input: [decision, "correction_note?"]
    output: Show
    side_effects: ["Show SUBMITTED -> APPROVED | RETURNED_FOR_CORRECTION | DENIED per §1.2", "on APPROVE: freezes CompetitionDivision.division_allotment_cents and ShowClass.class_purse_cents", "on DENY: closes ACTIVE divisions and voids PLANNED classes", "increments Show.version by 1"]

  - method: POST
    path: "/shows/{id}/rings"
    description: "Add a competition ring to the show's grounds."
    roles: [ShowSecretary]
    code: 201
    input: [name, surface_type, "footing_condition_score?", "turnover_buffer_minutes?", "warmup_capacity_horses?"]
    output: Ring
    side_effects: ["Ring created AVAILABLE with footing_condition_score seeded (default 100)", "increments Show.version by 1"]

  - method: POST
    path: "/rings/{id}/footing-maintenance"
    description: "Record a footing drag/water/renovation pass. A resulting score below MIN_FOOTING_SCORE puts the ring on MAINTENANCE_HOLD and fires the depth-4 schedule-unwind cascade; a score at or above it leaves (or returns) the ring AVAILABLE."
    roles: [GroundsManager]
    code: 200
    input: [start_utc, duration_minutes, new_footing_condition_score]
    output: Ring
    side_effects: ["creates a MAINTENANCE RingSlot for the hold window", "Ring.footing_condition_score rewritten", "when the new score < MIN_FOOTING_SCORE: Ring -> MAINTENANCE_HOLD and cascade links 2-4 (slots CANCELLED, classes SCHEDULED -> OPEN with estimated_minutes null, assignments RELEASED with Official.assigned_minutes decremented)", "recomputes Ring.scheduled_minutes_total, Ring.slot_count and every order_index on the ring", "increments Ring.version by 1"]

  - method: POST
    path: "/shows/{id}/divisions"
    description: "Add a competition division to a show whose licence is still editable."
    roles: [ShowSecretary]
    code: 201
    input: [name, discipline, age_group, min_jump_height_cm, max_jump_height_cm, division_share_bp, "jumpoff_enabled?"]
    output: CompetitionDivision
    side_effects: ["recomputes Show.division_share_bp_total", "increments Show.version by 1"]

  - method: POST
    path: "/divisions/{id}/classes"
    description: "Add a class to a division, optionally naming the championship class it qualifies riders for."
    roles: [ShowSecretary]
    code: 201
    input: [class_number, name, jump_height_cm, entry_fee_cents, class_share_bp, max_entries, "qualifier_for_class_id?"]
    output: ShowClass
    side_effects: ["ShowClass created PLANNED", "increments CompetitionDivision.version by 1"]

  - method: POST
    path: "/classes/{id}/open"
    description: "Open a class for entries once the show licence is approved."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: ShowClass
    side_effects: ["ShowClass PLANNED -> OPEN", "recomputes ShowClass.class_purse_cents", "increments ShowClass.version by 1"]

  - method: POST
    path: "/officials"
    description: "Register a licensed judge, steward or technical delegate in the federation roster."
    roles: [FederationOfficer]
    code: 201
    input: [federation_official_id, full_name, license_roles, license_level, licensed_disciplines, license_expires_on, "affiliated_trainer_name?"]
    output: Official
    side_effects: ["Official created with assigned_minutes = 0"]

  - method: POST
    path: "/official-assignments"
    description: "Assign an official to a ring slot in a specific chair. Enforces licence sufficiency, conflict of interest, the closed-interval time-conflict geometry with travel gap, and the daily load cap."
    roles: [ShowSecretary]
    code: 201
    input: [official_id, slot_id, official_role]
    output: OfficialAssignment
    side_effects: ["OfficialAssignment created ACTIVE", "Official.assigned_minutes += (RingSlot.end_utc - RingSlot.warmup_start_utc) whole minutes", "increments Official.version by 1"]

  - method: POST
    path: "/riders"
    description: "Register a federation member as a competing rider."
    roles: [FederationOfficer]
    code: 201
    input: [federation_member_number, full_name, membership_expires_on, trainer_name]
    output: Rider
    side_effects: ["membership_status derived against the logical clock"]

  - method: POST
    path: "/horses"
    description: "Register a horse with its Coggins draw date."
    roles: [FederationOfficer]
    code: 201
    input: [federation_registration_number, name, owner_name, coggins_drawn_on]
    output: Horse
    side_effects: ["coggins_expires_on = coggins_drawn_on + COGGINS_VALIDITY_DAYS", "eligibility_status = ELIGIBLE"]

  - method: POST
    path: "/shows/{id}/entries"
    description: "Submit a horse/rider entry to a licensed show while the entry window is open. The acting Exhibitor must be the entering rider."
    roles: [Exhibitor]
    code: 201
    input: [rider_id, horse_id, "requested_stall_count?"]
    output: Entry
    side_effects: ["Entry created verification_status = RECEIVED, settlement_status = UNBILLED"]

  - method: POST
    path: "/entries/{id}/verify"
    description: "Verify rider membership, horse Coggins validity and horse eligibility (verification dimension)."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: Entry
    side_effects: ["Entry.verification_status RECEIVED -> VERIFIED", "increments Entry.version by 1"]

  - method: POST
    path: "/entries/{id}/accept"
    description: "Accept a verified entry and reserve its requested stalls against show capacity (verification dimension)."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: Entry
    side_effects: ["Entry.verification_status VERIFIED -> ACCEPTED", "assigned_stall_count = requested_stall_count", "recomputes Show.reserved_stall_count and Show.available_stall_count", "ClassEntry ENTERED -> CONFIRMED for rows whose Entry is also PAID, with ShowClass.confirmed_entry_count and point_eligible recomputed", "increments Entry.version by 1; increments Show.version by 1"]

  - method: POST
    path: "/entries/{id}/invoice"
    description: "Freeze the entry invoice: class fees, stall fees, office fee tier and total due (settlement dimension, independent of verification)."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: Entry
    side_effects: ["Entry.settlement_status UNBILLED -> INVOICED", "writes class_fee_cents_total, stall_fee_cents, preliminary_subtotal_cents, office_fee_cents and total_due_cents per calculations.entry_settlement", "increments Entry.version by 1"]

  - method: POST
    path: "/entries/{id}/payment"
    description: "Pay an invoiced entry in full (settlement dimension). The acting Exhibitor must own the entry."
    roles: [Exhibitor]
    code: 200
    input: [amount_cents]
    output: Entry
    side_effects: ["Entry.settlement_status INVOICED -> PAID", "ClassEntry ENTERED -> CONFIRMED for rows whose Entry is also ACCEPTED, with ShowClass.confirmed_entry_count and point_eligible recomputed", "increments Entry.version by 1"]

  - method: POST
    path: "/entries/{id}/withdrawal"
    description: "Withdraw an entry. Compensating action for accept and, when the entry was paid, for payment. The acting Exhibitor must own the entry."
    roles: [Exhibitor]
    code: 200
    input: []
    output: Entry
    side_effects: ["Entry.verification_status -> WITHDRAWN", "assigned_stall_count -> 0 and Show.reserved_stall_count / available_stall_count recomputed with zero drift", "ClassEntry ENTERED|CONFIRMED -> SCRATCHED with ShowClass counters recomputed", "when settlement_status == PAID: -> REFUNDED with refunded_cents = total_due_cents", "increments Entry.version by 1; increments Show.version by 1"]

  - method: POST
    path: "/class-entries"
    description: "Enter a show entry in a specific open class. Independent of the entry's verification and settlement dimensions: the ClassEntry is created ENTERED and only becomes CONFIRMED once the Entry is both ACCEPTED and PAID. The acting Exhibitor must own the entry."
    roles: [Exhibitor]
    code: 201
    input: [entry_id, class_id]
    output: ClassEntry
    side_effects: ["ClassEntry created ENTERED (or CONFIRMED immediately when the Entry is already ACCEPTED and PAID)", "recomputes ShowClass.entry_count, confirmed_entry_count and point_eligible", "increments ShowClass.version by 1"]

  - method: POST
    path: "/ring-slots"
    description: "Book a class into a ring, computing its duration estimate, warm-up lead and running-order index. Requires the ring version the caller last observed (OCC per §1.2.1 slot-create-stale-ring)."
    roles: [RingMaster]
    code: 201
    input: [ring_id, class_id, start_utc, expected_ring_version]
    output: RingSlot
    side_effects: ["ShowClass.estimated_minutes written from the projected_all_entered variant of calculations.class_duration_estimate", "RingSlot created SCHEDULED with duration_minutes, end_utc, warmup_start_utc and order_index per calculations.ring_schedule_layout", "ShowClass OPEN -> SCHEDULED", "recomputes Ring.scheduled_minutes_total, Ring.slot_count and every order_index on the ring", "increments Ring.version by 1; increments ShowClass.version by 1"]

  - method: POST
    path: "/ring-slots/{id}/start"
    description: "Call a class into the ring. Gates on ring availability, footing safety, active veterinary coverage spanning the slot, the required-officials matrix for the show's competition level, and the welfare strike limit."
    roles: [RingMaster]
    code: 200
    input: []
    output: RingSlot
    side_effects: ["RingSlot SCHEDULED -> RUNNING", "ShowClass SCHEDULED -> IN_PROGRESS", "increments RingSlot.version by 1; increments ShowClass.version by 1"]

  - method: POST
    path: "/classes/{id}/results"
    description: "Record the judge's card: placings, round times and the class's actual ring time. The acting Judge must hold the JUDGE chair on the running slot and must not also hold the STEWARD chair on it."
    roles: [Judge]
    code: 200
    input: [placings, actual_minutes]
    output: ShowClass
    side_effects: ["every CONFIRMED ClassEntry -> COMPLETED with placing and round_seconds (placing null when unplaced)", "ShowClass IN_PROGRESS -> JUDGED with actual_minutes and placed_count written", "the RUNNING RingSlot -> COMPLETED and Ring.scheduled_minutes_total recomputed", "increments ShowClass.version by 1; increments RingSlot.version by 1"]

  - method: POST
    path: "/classes/{id}/post-results"
    description: "Post official results and pay out the class purse across the filled ribbons."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: ShowClass
    side_effects: ["ClassEntry.prize_cents written per calculations.class_prize_allocation", "ShowClass JUDGED -> RESULTS_POSTED with awarded_prize_cents and point_eligible written", "recomputes Show.allocated_prize_cents and Show.unallocated_prize_cents", "increments ShowClass.version by 1; increments Show.version by 1"]

  - method: POST
    path: "/classes/{id}/void-results"
    description: "Void posted results. Compensating action for post-results: releases the awarded purse back to the show's unallocated pool with zero drift."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: ShowClass
    side_effects: ["every ClassEntry.prize_cents -> 0", "ShowClass RESULTS_POSTED -> VOIDED with awarded_prize_cents -> 0", "recomputes Show.allocated_prize_cents and Show.unallocated_prize_cents", "increments ShowClass.version by 1; increments Show.version by 1"]

  - method: POST
    path: "/classes/{id}/point-submissions"
    description: "Raise a standings submission for a posted, point-eligible class. Requires the class version the caller last observed (OCC per §1.2.1 points-submit-stale-class)."
    roles: [ShowSecretary]
    code: 201
    input: [expected_class_version]
    output: PointSubmission
    side_effects: ["PointSubmission created PREPARED with submitted_by_user_id = X-User-ID", "ShowClass RESULTS_POSTED -> POINTS_SUBMITTED", "increments ShowClass.version by 1"]

  - method: POST
    path: "/point-submissions/{id}/acknowledgement"
    description: "Record one standings body's acknowledgement of a submission. The national and regional legs are independent forks that join at RECORDED; a REJECTED outcome compensates whichever legs were already credited and returns the class to RESULTS_POSTED."
    roles: [FederationOfficer]
    code: 200
    input: [standings_body, outcome, "body_reference?"]
    output: PointSubmission
    side_effects: ["on ACCEPTED: ClassEntry.points_national or points_regional written per the matching variant of calculations.rider_standing_points, the body reference stored, and Rider.national_points_total / regional_points_total credited", "PointSubmission advances PREPARED -> NATIONAL_ACCEPTED | REGIONAL_ACCEPTED -> RECORDED, or -> REJECTED", "on REJECTED: credited points reversed on ClassEntry and Rider, and ShowClass POINTS_SUBMITTED -> RESULTS_POSTED", "increments PointSubmission.version by 1"]

  - method: POST
    path: "/entries/{id}/compliance-cases"
    description: "Open a drug-test or welfare-citation case against an entry. sample_code is required for DRUG_TEST and welfare_rule_code for WELFARE_CITATION."
    roles: [Steward]
    code: 201
    input: [opened_by_official_id, case_type, "sample_code?", "welfare_rule_code?"]
    output: ComplianceCase
    side_effects: ["ComplianceCase created OPEN with finding null"]

  - method: POST
    path: "/compliance-cases/{id}/finding"
    description: "Adjudicate a compliance case. POSITIVE suspends the horse and fires the depth-4 disqualification cascade; WARNING (welfare citations only) records a show welfare strike; NEGATIVE dismisses the case."
    roles: [FederationOfficer]
    code: 200
    input: [finding]
    output: ComplianceCase
    side_effects: ["ComplianceCase OPEN -> SUBSTANTIATED | DISMISSED", "on POSITIVE: Horse -> SUSPENDED, matching ClassEntry rows -> DISQUALIFIED with prize_cents 0 and placing null, touched RESULTS_POSTED classes revert to JUDGED with awarded_prize_cents 0, Show prize ledger recomputed, and open PointSubmission rows -> RETRACTED with standings compensation", "on WARNING: Show.welfare_strike_count recomputed", "increments ComplianceCase.version by 1; increments Show.version by 1"]

  - method: POST
    path: "/shows/{id}/coverage-shifts"
    description: "Schedule an on-call veterinary or farrier coverage window for the showgrounds."
    roles: [GroundsManager]
    code: 201
    input: [coverage_type, provider_name, start_utc, end_utc]
    output: CoverageShift
    side_effects: ["CoverageShift created SCHEDULED"]

  - method: POST
    path: "/coverage-shifts/{id}/activate"
    description: "Provider check-in; permitted no earlier than COVERAGE_CHECKIN_LEAD_MINUTES before the shift's start."
    roles: [GroundsManager]
    code: 200
    input: []
    output: CoverageShift
    side_effects: ["CoverageShift SCHEDULED -> ACTIVE", "increments CoverageShift.version by 1"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical current UTC instant. The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every membership-lapse, Coggins-expiry, entry-window and coverage-check-in rule is evaluated against this logical clock."
    roles: [FederationOfficer]
    code: 200
    input: [to_iso8601]
    output: "{current_utc: string}"
    side_effects: ["re-derives Rider.membership_status on subsequent reads", "no entity versions change"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization / request shape ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The supplied X-User-Role is not listed in the endpoint's roles."
  - id: ERR_ACTOR_NOT_RECOGNIZED
    http: 403
    condition: "X-User-ID does not resolve to an instance of the backing entity for an entity_backed role (Exhibitor -> Rider, Judge/Steward -> Official)."
  - id: ERR_ENTRY_NOT_OWNED
    http: 403
    condition: "An Exhibitor acts on an Entry whose rider_id is not the acting X-User-ID."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, undeclared enum member, out-of-range integer, unparseable datetime, or a conditional field supplied/omitted against its case_type rule."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_ring_version or expected_class_version does not equal the parent entity's current version."

  # --- existence ---
  - id: ERR_SHOW_NOT_FOUND
    http: 404
    condition: "No Show with the supplied id (path segment or show_id body field)."
  - id: ERR_RING_NOT_FOUND
    http: 404
    condition: "No Ring with the supplied id."
  - id: ERR_DIVISION_NOT_FOUND
    http: 404
    condition: "No CompetitionDivision with the supplied id."
  - id: ERR_CLASS_NOT_FOUND
    http: 404
    condition: "No ShowClass with the supplied id (path segment, class_id or qualifier_for_class_id)."
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "No RingSlot with the supplied id."
  - id: ERR_OFFICIAL_NOT_FOUND
    http: 404
    condition: "No Official with the supplied id (path segment, official_id or opened_by_official_id)."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No OfficialAssignment with the supplied id."
  - id: ERR_RIDER_NOT_FOUND
    http: 404
    condition: "No Rider with the supplied id."
  - id: ERR_HORSE_NOT_FOUND
    http: 404
    condition: "No Horse with the supplied horse_id."
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "No Entry with the supplied id."
  - id: ERR_CLASS_ENTRY_NOT_FOUND
    http: 404
    condition: "No ClassEntry with the supplied id, including a class_entry_id inside a placings array."
  - id: ERR_POINT_SUBMISSION_NOT_FOUND
    http: 404
    condition: "No PointSubmission with the supplied id."
  - id: ERR_COMPLIANCE_CASE_NOT_FOUND
    http: 404
    condition: "No ComplianceCase with the supplied id."
  - id: ERR_COVERAGE_SHIFT_NOT_FOUND
    http: 404
    condition: "No CoverageShift with the supplied id."

  # --- state preconditions ---
  - id: ERR_SHOW_LICENSE_NOT_DRAFT
    http: 409
    condition: "License submission attempted while license_status is not DRAFT or RETURNED_FOR_CORRECTION."
  - id: ERR_SHOW_LICENSE_NOT_SUBMITTED
    http: 409
    condition: "License decision attempted while license_status is not SUBMITTED."
  - id: ERR_SHOW_LICENSE_NOT_APPROVED
    http: 409
    condition: "Class opening, entry submission or slot start attempted while the owning Show.license_status is not APPROVED."
  - id: ERR_SHOW_LICENSE_LOCKED
    http: 409
    condition: "Division or class creation attempted while the Show.license_status is no longer editable (not DRAFT and not RETURNED_FOR_CORRECTION)."
  - id: ERR_CLASS_NOT_PLANNED
    http: 409
    condition: "Class opening attempted while ShowClass.status is not PLANNED."
  - id: ERR_CLASS_NOT_OPEN
    http: 409
    condition: "Class entry or slot booking attempted while ShowClass.status is not OPEN."
  - id: ERR_CLASS_ALREADY_SCHEDULED
    http: 409
    condition: "Slot booking attempted for a class that already holds a RingSlot with status IN {SCHEDULED, RUNNING, COMPLETED}."
  - id: ERR_CLASS_NOT_IN_PROGRESS
    http: 409
    condition: "Results recording attempted while ShowClass.status is not IN_PROGRESS."
  - id: ERR_CLASS_NOT_JUDGED
    http: 409
    condition: "Result posting attempted while ShowClass.status is not JUDGED."
  - id: ERR_CLASS_RESULTS_NOT_POSTED
    http: 409
    condition: "Void or point submission attempted while ShowClass.status is not RESULTS_POSTED."
  - id: ERR_SLOT_NOT_SCHEDULED
    http: 409
    condition: "Slot start attempted while RingSlot.status is not SCHEDULED, or on a MAINTENANCE slot."
  - id: ERR_RING_NOT_AVAILABLE
    http: 409
    condition: "Slot start attempted while Ring.status is MAINTENANCE_HOLD, or footing maintenance attempted against a ring already in the wrong posture."
  - id: ERR_ENTRY_NOT_RECEIVED
    http: 409
    condition: "Verification attempted while Entry.verification_status is not RECEIVED."
  - id: ERR_ENTRY_NOT_VERIFIED
    http: 409
    condition: "Acceptance attempted while Entry.verification_status is not VERIFIED."
  - id: ERR_ENTRY_ALREADY_INVOICED
    http: 409
    condition: "Invoicing attempted while Entry.settlement_status is not UNBILLED."
  - id: ERR_ENTRY_NOT_INVOICED
    http: 409
    condition: "Payment attempted while Entry.settlement_status is not INVOICED."
  - id: ERR_ENTRY_ALREADY_TERMINAL
    http: 409
    condition: "Withdrawal or invoicing attempted on an Entry already WITHDRAWN, or withdrawal attempted when a ClassEntry of the Entry is DISQUALIFIED or is COMPLETED on a class that has already reached RESULTS_POSTED, POINTS_SUBMITTED or VOIDED."
  - id: ERR_SUBMISSION_ALREADY_FINALIZED
    http: 409
    condition: "Acknowledgement attempted on a PointSubmission already RECORDED, REJECTED or RETRACTED; or void attempted on a class whose submission has been accepted by a standings body."
  - id: ERR_CASE_ALREADY_ADJUDICATED
    http: 409
    condition: "Finding recorded on a ComplianceCase whose status is not OPEN."
  - id: ERR_COVERAGE_SHIFT_NOT_SCHEDULED
    http: 409
    condition: "Activation attempted on a CoverageShift already ACTIVE."

  # --- business: safety / welfare / compliance ---
  - id: ERR_RIDER_MEMBERSHIP_LAPSED
    http: 422
    condition: "The entry's Rider.membership_status is LAPSED at the logical clock."
  - id: ERR_COGGINS_EXPIRED
    http: 422
    condition: "Horse.coggins_expires_on falls before Show.start_utc."
  - id: ERR_HORSE_SUSPENDED
    http: 422
    condition: "Horse.eligibility_status is SUSPENDED."
  - id: ERR_OFFICIAL_LICENSE_INSUFFICIENT
    http: 422
    condition: "The official's licence does not cover the chair, the discipline, the show's competition level, or extends past its expiry before the slot begins."
  - id: ERR_FOOTING_UNSAFE
    http: 422
    condition: "Ring.footing_condition_score is below MIN_FOOTING_SCORE at slot start."
  - id: ERR_VET_COVERAGE_MISSING
    http: 422
    condition: "No ACTIVE VETERINARIAN CoverageShift of the show spans the slot's [start_utc, end_utc]."
  - id: ERR_OFFICIALS_REQUIREMENT_UNMET
    http: 422
    condition: "The slot lacks the distinct-official counts REQUIRED_OFFICIALS demands for the show's competition_level."
  - id: ERR_WELFARE_STRIKE_LIMIT
    http: 409
    condition: "Show.welfare_strike_count has reached WELFARE_STRIKE_LIMIT; competition may not continue until the federation clears the show."

  # --- business: referential / integrity ---
  - id: ERR_OFFICIAL_CONFLICT_OF_INTEREST
    http: 409
    condition: "The official's affiliated_trainer_name matches the trainer_name of a rider entered in the slot's class."
  - id: ERR_JUDGE_NOT_ASSIGNED
    http: 403
    condition: "The acting Judge holds no ACTIVE JUDGE assignment on the class's running slot."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting Judge also holds an ACTIVE STEWARD assignment on the same slot."
  - id: ERR_QUALIFIER_CYCLE
    http: 409
    condition: "qualifier_for_class_id points outside the show or would close a cycle in the qualifier chain."

  # --- business: temporal ---
  - id: ERR_ENTRY_WINDOW_CLOSED
    http: 409
    condition: "The logical clock is at or after Show.entry_close_utc."
  - id: ERR_SLOT_OUTSIDE_SHOW_WINDOW
    http: 409
    condition: "The slot window is not fully contained in [Show.start_utc, Show.end_utc]."
  - id: ERR_RING_SLOT_OVERLAP
    http: 409
    condition: "The candidate slot collides with an existing SCHEDULED or RUNNING slot on the same ring under the half-open plus turnover-buffer geometry."
  - id: ERR_OFFICIAL_TIME_CONFLICT
    http: 409
    condition: "The candidate assignment collides with another ACTIVE assignment of the same official on a different RingSlot under the closed-interval plus travel-gap geometry (a second chair on the same slot is exempt)."

  # --- business: constraint ---
  - id: ERR_JUMP_HEIGHT_OUT_OF_RANGE
    http: 422
    condition: "ShowClass.jump_height_cm falls outside the division's inclusive height band."
  - id: ERR_CLASS_NUMBER_DUPLICATE
    http: 409
    condition: "class_number is already used by another class of the same show."
  - id: ERR_DIVISION_SHARE_OVERSUBSCRIBED
    http: 422
    condition: "The show's ACTIVE divisions' division_share_bp would sum above 10000."
  - id: ERR_CLASS_FULL
    http: 409
    condition: "ShowClass.entry_count has reached max_entries."
  - id: ERR_DUPLICATE_CLASS_ENTRY
    http: 409
    condition: "The same Entry is already in this class with a non-scratched ClassEntry."
  - id: ERR_OFFICIAL_LOAD_EXCEEDED
    http: 409
    condition: "The assignment would push Official.assigned_minutes above MAX_OFFICIAL_DAILY_MINUTES."
  - id: ERR_NO_ENTRIES_TO_JUDGE
    http: 409
    condition: "Results recording attempted on a class with entry_count 0."
  - id: ERR_INVALID_PLACINGS
    http: 422
    condition: "placings are not a distinct contiguous run from 1, exceed the placeable count, or name a class entry that is not CONFIRMED on this class."
  - id: ERR_CLASS_NOT_POINT_ELIGIBLE
    http: 409
    condition: "ShowClass.confirmed_entry_count is below MIN_ENTRIES_FOR_POINTS, so the class cannot be submitted to standings."
  - id: ERR_CLASS_LIST_INCOMPLETE
    http: 422
    condition: "The show has no ACTIVE division or no class at licence submission or approval."
  - id: ERR_FINDING_NOT_APPLICABLE
    http: 422
    condition: "finding == WARNING supplied for a case whose case_type is not WELFARE_CITATION."
  - id: ERR_COVERAGE_CHECKIN_TOO_EARLY
    http: 409
    condition: "Coverage activation attempted more than COVERAGE_CHECKIN_LEAD_MINUTES before the shift's start_utc."

  # --- business: fiscal ---
  - id: ERR_STALL_CAPACITY_EXCEEDED
    http: 409
    condition: "Entry.requested_stall_count exceeds Show.available_stall_count at acceptance."
  - id: ERR_PRIZE_POOL_EXCEEDED
    http: 409
    condition: "Posting results would push Show.allocated_prize_cents above prize_money_pool_cents."
  - id: ERR_UNPAID_PLACED_ENTRY
    http: 402
    condition: "A placed ClassEntry belongs to an Entry whose settlement_status is not PAID."
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents does not equal Entry.total_due_cents exactly."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: ShowSecretary
    description: "Show office. Builds the prize list, drives licensing submissions, processes entries and invoices, assigns officials, and posts/voids results and standings submissions."
    identity: opaque
    exclusive_operations:
      - "POST /shows"
      - "POST /shows/{id}/license-submission"
      - "POST /shows/{id}/rings"
      - "POST /shows/{id}/divisions"
      - "POST /divisions/{id}/classes"
      - "POST /classes/{id}/open"
      - "POST /official-assignments"
      - "POST /entries/{id}/verify"
      - "POST /entries/{id}/accept"
      - "POST /entries/{id}/invoice"
      - "POST /classes/{id}/post-results"
      - "POST /classes/{id}/void-results"
      - "POST /classes/{id}/point-submissions"
    shared_operations: ["all GET endpoints"]

  - name: FederationOfficer
    description: "National federation staff. Licenses shows, maintains the official/rider/horse registries, acknowledges standings submissions on behalf of the standings bodies, and adjudicates compliance cases. Cannot build a prize list or process entries."
    identity: opaque
    exclusive_operations:
      - "POST /shows/{id}/license-decision"
      - "POST /officials"
      - "POST /riders"
      - "POST /horses"
      - "POST /point-submissions/{id}/acknowledgement"
      - "POST /compliance-cases/{id}/finding"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: RingMaster
    description: "In-gate/ring operations. Books classes into rings and calls them in. Cannot create the classes it schedules nor judge them."
    identity: opaque
    exclusive_operations:
      - "POST /ring-slots"
      - "POST /ring-slots/{id}/start"
    shared_operations: ["all GET endpoints"]

  - name: Judge
    description: "Licensed judge acting as an Official. Records the card for a class it holds the JUDGE chair on. Segregation of duties forbids judging a slot where the same person also stewards."
    identity: "entity_backed:Official"
    exclusive_operations:
      - "POST /classes/{id}/results"
    shared_operations: ["all GET endpoints"]

  - name: Steward
    description: "Licensed steward acting as an Official. Opens drug-test and welfare-citation cases but never adjudicates them — the finding belongs to the FederationOfficer."
    identity: "entity_backed:Official"
    exclusive_operations:
      - "POST /entries/{id}/compliance-cases"
    shared_operations: ["all GET endpoints"]

  - name: Exhibitor
    description: "Competitor acting as a Rider. Submits entries for itself, enters classes, pays invoices and withdraws. Every write is ownership-checked against Entry.rider_id."
    identity: "entity_backed:Rider"
    exclusive_operations:
      - "POST /shows/{id}/entries"
      - "POST /class-entries"
      - "POST /entries/{id}/payment"
      - "POST /entries/{id}/withdrawal"
    shared_operations: ["all GET endpoints"]

  - name: GroundsManager
    description: "Grounds and stabling crew. Maintains footing and schedules/checks in veterinary and farrier coverage. Cannot schedule competition or touch results."
    identity: opaque
    exclusive_operations:
      - "POST /rings/{id}/footing-maintenance"
      - "POST /shows/{id}/coverage-shifts"
      - "POST /coverage-shifts/{id}/activate"
    shared_operations: ["all GET endpoints"]
