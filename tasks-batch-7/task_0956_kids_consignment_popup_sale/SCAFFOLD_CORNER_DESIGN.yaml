      - name: presale_pass_discount_pinned_after_more_hours
        claim_type: derived_field_reconciliation
        grounds: [entities.PresalePass.fields.discount_pct, calculations.presale_pass_issuance, calculations.volunteer_discount_tier]
        distinguishing_aspect: "Version-pinning on issuance: a pass issued at 4 completed hours (10%) still reads 10% after the volunteer completes a second 4h shift, even though Volunteer.projected_discount_pct and the earned tier now compute 15."
