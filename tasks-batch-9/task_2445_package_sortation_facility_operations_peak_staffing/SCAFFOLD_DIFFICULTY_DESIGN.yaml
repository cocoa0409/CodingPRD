              as: OpsManager
          assert:
            - "before the trigger SortCenter.${center_id}.ops_posture == FROZEN and open_serious_injury_count == 1"
            - "before the trigger OutboundLoad.${load_id}.load_status == DISPATCHED and seal_status == SEALED"
            - "the trigger returns ERR_INVALID_LOAD_STATE with HTTP 409"
            - "the trigger does NOT return ERR_CENTER_FROZEN even though validation priority 22 is also violated"
            - "no state changes: OutboundLoad.${load_id}.load_status stays DISPATCHED with the original dispatched_at == 2026-08-03T06:00:00Z, InjuryReport.${injury_id}.status stays OPEN"

      - name: line_headcount_safety_beats_labor_budget_at_approve
        grounds:
