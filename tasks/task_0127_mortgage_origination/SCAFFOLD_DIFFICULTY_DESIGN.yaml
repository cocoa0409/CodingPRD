scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dti_prequal_vs_underwriting_variants
        grounds:
          - calculations.dti_calculation
          - calculations.dti_calculation.variants.pre_qualification_dti
          - calculations.dti_calculation.variants.underwriting_dti
          - state_machines.LoanApplication.INTAKE_to_PRE_QUALIFIED
          - state_machines.LoanApplication.PRE_QUALIFIED_to_UNDERWRITING
          - entities.LoanApplication.fields.dti_ratio
        distinguishing_aspect: |
          Pre-qualification DTI falls back to Borrower.annual_income_cents (stated)
          while underwriting DTI uses only the VERIFIED IncomeVerification aggregate;
          with stated income = $120,000 and a single VERIFIED IncomeVerification of
          $96,000, the same LoanApplication produces dti_ratio = 0.1300 at pre-qual
          and 0.1625 at underwriting — different numeric outputs on the same row.
          Entity domain: LoanApplication (income / DTI).
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Create Borrower with annual_income_cents=12000000, credit_score=720, state_code=CA"
            - "Create LoanApplication with requested_loan_amount_cents=20000000, sale_price_cents=40000000, loan_term_months=360, loan_purpose=PURCHASE, assigned_loan_officer_id=lo_01"
            - "POST /loan-applications/{id}/pre-qualify"
            - "Read LoanApplication; record dti_ratio_a"
            - "Create IncomeVerification with source_type=W2, documented_annual_cents=9600000"
            - "POST /loan-applications/{appId}/income-verifications/{id}/verify"
            - "Create AssetVerification balance_cents=5000000; verify"
            - "POST /loan-applications/{id}/appraisal (report_date=2026-03-01); complete with appraised_value_cents=40000000"
            - "POST /loan-applications/{id}/title-search; complete with defects_found=[]"
            - "POST /loan-applications/{id}/disclosures kind=LOAN_ESTIMATE apr_bps=650 total_loan_costs_cents=500000 total_other_costs_cents=800000"
          trigger:
            - "POST /loan-applications/{id}/submit-underwriting with compliance_reviewer_id=co_01"
          assert:
            - "After pre-qualify, LoanApplication.dti_ratio == 0.1300"
            - "After submit-underwriting, LoanApplication.dti_ratio == 0.1625"
            - "0.1625 != 0.1300 (the same Borrower data produces two different ratios via different variants)"

      - name: ltv_sale_price_vs_appraised_value_basis
        grounds:
          - calculations.ltv_calculation
          - state_machines.Appraisal.ORDERED_to_COMPLETED
          - state_machines.LoanApplication.PRE_QUALIFIED_to_UNDERWRITING
          - entities.LoanApplication.fields.ltv_ratio
          - entities.LoanApplication.fields.pmi_required
        distinguishing_aspect: |
          LTV uses value_basis = MIN(sale_price, appraised_value). With sale_price
          = $400,000 and appraised_value = $380,000, principal $360,000 yields
          ltv = 0.9474 (uses appraised). With sale_price = $400,000 and
          appraised_value = $410,000, same principal yields ltv = 0.9000 (uses
          sale_price). Two valid arithmetic interpretations on the same
          principal produce different ratios. Entity domain: LoanApplication
          (collateral / LTV) — structurally distinct from the income-domain
          dti variants above.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Create Borrower; Create LoanApplication A1 with sale_price_cents=40000000, requested_loan_amount_cents=36000000"
            - "Create LoanApplication A2 with sale_price_cents=40000000, requested_loan_amount_cents=36000000"
            - "Run pre-qualify, all verifications, title CLEAR for both"
            - "POST /loan-applications/A1/appraisal complete with appraised_value_cents=38000000"
            - "POST /loan-applications/A2/appraisal complete with appraised_value_cents=41000000"
            - "Issue LOAN_ESTIMATE for both"
          trigger:
            - "POST /loan-applications/A1/submit-underwriting"
            - "POST /loan-applications/A2/submit-underwriting"
          assert:
            - "A1.ltv_ratio == 0.9474 (basis=appraised=38000000, principal/basis = 36000000/38000000)"
            - "A2.ltv_ratio == 0.9000 (basis=sale_price=40000000, principal/basis = 36000000/40000000)"
            - "A1.pmi_required == true; A2.pmi_required == true (both > 0.80)"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: closing_cost_rounding_order_pinned
        grounds:
          - calculations.closing_cost_total
          - calculations.closing_cost_total.constants.STATE_TAX_RATE
          - entities.Disclosure.fields.cash_to_close_cents
        distinguishing_aspect: |
          Mode (b): Multi-step rounding order is PINNED. The formula rounds each
          per-line state-tax amount to whole cents BEFORE summing, then proceeds
          through the origination tier. With a single tax line of 800,000 cents
          and STATE_TAX_RATE.CA = 0.0050, ROUND_HALF_UP(800000 * 0.0050) = 4000
          cents. Sum-then-round on the same input would yield 4000 cents here too,
          but the formula explicitly forbids that ordering — so a multi-line case
          can disagree. The pinning is on rounding ORDER, distinct from the
          tier-input combinatorial below.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Create Borrower with state_code=CA"
            - "Create LoanApplication with requested_loan_amount_cents=20000000 (tier-low, 1.00%)"
            - "Run verifications, appraisal complete, title CLEAR"
          trigger:
            - "POST /loan-applications/{id}/disclosures kind=LOAN_ESTIMATE apr_bps=650 total_loan_costs_cents=500000 total_other_costs_cents=800000"
          assert:
            - "Disclosure.cash_to_close_cents == 500000 + 4000 + 800000 + 200000 - 20000000 == -18496000"
            - "origination_fee component: ROUND_HALF_UP(20000000 * 0.01) = 200000 cents (tier-low boundary, principal == 20000000 <= 41700000)"
            - "tax line component: ROUND_HALF_UP(800000 * 0.0050) = 4000 cents (per-line round BEFORE sum)"

      - name: apr_tolerance_branching_3_inputs
        grounds:
          - calculations.apr_tolerance_check
          - state_machines.Disclosure.ISSUED_to_SUPERSEDED
          - state_machines.Disclosure.ACKNOWLEDGED_to_SUPERSEDED
          - validations[priority=12]
          - errors.ERR_APR_TOLERANCE_EXCEEDED
        distinguishing_aspect: |
          Mode (a): ≥3 inputs with non-linear conditional interaction. The check
          compares new CD.apr_bps to the latest LE.apr_bps (any non-VOIDED status)
          and branches on whether |delta| > 12 bps — three inputs (latest LE
          version selector, LE.apr_bps, candidate CD.apr_bps) with a hard
          boundary that drives a state-machine fork between ACCEPT and
          ERR_APR_TOLERANCE_EXCEEDED. Distinct from mode (b) above (which is
          about rounding order, not branching).
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Set up LoanApplication through CONDITIONAL_APPROVAL with latest LE apr_bps=650"
            - "Acknowledge the LE"
          trigger:
            - "POST /loan-applications/{id}/disclosures kind=CLOSING_DISCLOSURE apr_bps=663 (delta = 13 bps > 12)"
          assert:
            - "Response status 409, error_id=ERR_APR_TOLERANCE_EXCEEDED"
            - "No new Disclosure of kind=CLOSING_DISCLOSURE persisted"
            - "Latest LOAN_ESTIMATE.status unchanged (still ACKNOWLEDGED)"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_application_branching_from_underwriting
        grounds:
          - state_machines.LoanApplication
          - state_machines.LoanApplication.UNDERWRITING_to_CONDITIONAL_APPROVAL
          - state_machines.LoanApplication.UNDERWRITING_to_PRE_QUALIFIED
          - state_machines.LoanApplication.UNDERWRITING_to_DENIED
        distinguishing_aspect: |
          Branching fork from a single source state UNDERWRITING into three
          divergent targets {CONDITIONAL_APPROVAL, PRE_QUALIFIED (counter-offer
          revert), DENIED} with different side-effect sets per branch (counter
          supersedes Disclosures and resets DTI; deny cascades RateLock to
          CANCELLED). Distinct entity domain: LoanApplication lifecycle.
        test_recipe:
          setup:
            - "Set up three independent LoanApplications A1, A2, A3 each through state UNDERWRITING with all dependencies"
          trigger:
            - "POST /loan-applications/A1/underwrite-decision decision=APPROVE"
            - "POST /loan-applications/A2/underwrite-decision decision=COUNTER_OFFER counter_offered_amount_cents=18000000"
            - "POST /loan-applications/A3/underwrite-decision decision=DENY"
          assert:
            - "A1.status == CONDITIONAL_APPROVAL"
            - "A2.status == PRE_QUALIFIED AND A2.counter_offered_amount_cents == 18000000"
            - "A2's latest LOAN_ESTIMATE.status == SUPERSEDED"
            - "A3.status == DENIED AND A3's RateLock (if existed) has status CANCELLED"

      - name: rate_lock_cyclic_self_loop_on_extended
        grounds:
          - state_machines.RateLock
          - state_machines.RateLock.LOCKED_to_EXTENDED
          - state_machines.RateLock.EXTENDED_to_EXTENDED
          - entities.RateLock.fields.status
          - entities.RateLock.fields.lock_expires_at
        distinguishing_aspect: |
          Cyclic self-loop: EXTENDED -> EXTENDED on subsequent successful
          extensions. The same RateLock can be re-extended multiple times,
          remaining in EXTENDED across the cycle while lock_expires_at advances
          and extension_fee_paid_cents accumulates. Distinct entity domain:
          RateLock — different from the LoanApplication branching above.
        test_recipe:
          setup:
            - "Place a RateLock on a LoanApplication with locked_rate_bps=650; locked_at=2026-03-02T10:00:00.000Z; principal=20000000"
            - "Initial lock_expires_at = locked_at + 45 days = 2026-04-16T10:00:00.000Z"
          trigger:
            - "POST /loan-applications/{id}/rate-lock/extend extra_days=7  -> status=EXTENDED, lock_expires_at += 7 days, fee 10000 cents"
            - "POST /loan-applications/{id}/rate-lock/extend extra_days=15 -> status=EXTENDED (self-loop), lock_expires_at += 15 days, fee 20000 cents"
            - "POST /loan-applications/{id}/rate-lock/extend extra_days=30 -> status=EXTENDED (self-loop), lock_expires_at += 30 days, fee 50000 cents"
          assert:
            - "RateLock.status == EXTENDED after first extend"
            - "RateLock.status == EXTENDED after second extend (self-loop preserves state)"
            - "RateLock.extension_fee_paid_cents == 10000 + 20000 + 50000 == 80000"
            - "RateLock.lock_expires_at == 2026-04-16T10:00:00.000Z + 52 days == 2026-06-07T10:00:00.000Z"
            - "Total cumulative extra_days = 52 <= 60 (within cap)"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: re_disclosure_cascade_depth_3
        grounds:
          - state_machines.Disclosure.ACKNOWLEDGED_to_SUPERSEDED
          - state_machines.LoanApplication.CONDITIONAL_APPROVAL_to_CLEAR_TO_CLOSE
          - calculations.trid_waiting_period
          - entities.LoanApplication.fields.trid_clock_started_at
          - validations[priority=8]
          - errors.ERR_TRID_WAITING_PERIOD
        distinguishing_aspect: |
          Depth-3 transitive cascade. Trigger: POST /loan-applications/{id}/disclosures
          issuing a NEW LOAN_ESTIMATE with apr_bps delta > 12.5 bps from prior
          CD. Hop 1: previous LE marked SUPERSEDED. Hop 2: that supersession
          cascades to invalidate the ACKNOWLEDGED CLOSING_DISCLOSURE (marked
          SUPERSEDED — each hop CAUSED by the previous). Hop 3: with the CD now
          SUPERSEDED, LoanApplication.closing_eligible_at is no longer
          satisfied — a subsequent clear-to-close call from the now-stale state
          fails with ERR_TRID_WAITING_PERIOD. Trigger source: re-disclosure on
          APR change.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z; set up LoanApplication in CONDITIONAL_APPROVAL"
            - "Issue initial LE apr_bps=650 (version 1); acknowledge"
            - "Issue CD apr_bps=655 (within tolerance, delta=5); acknowledge"
            - "Advance clock to 2026-03-05T00:00:00.000Z (3 business days elapsed; CD eligible_to_consummate_at met)"
          trigger:
            - "POST /loan-applications/{id}/disclosures kind=LOAN_ESTIMATE apr_bps=700 (delta=50 bps from CD's 650 LE; > 12.5)"
            - "POST /loan-applications/{id}/clear-to-close"
          assert:
            - "Hop 1: previous LOAN_ESTIMATE (version 1) Disclosure.status == SUPERSEDED"
            - "Hop 2: previously ACKNOWLEDGED CLOSING_DISCLOSURE.status == SUPERSEDED (caused by the LE supersession)"
            - "Hop 3: clear-to-close fails with 409 ERR_TRID_WAITING_PERIOD because no current CD has elapsed eligible_to_consummate_at"

      - name: appraisal_completion_cascades_ltv_and_pmi_depth_2
        grounds:
          - state_machines.Appraisal.ORDERED_to_COMPLETED
          - calculations.ltv_calculation
          - entities.LoanApplication.fields.ltv_ratio
          - entities.LoanApplication.fields.pmi_required
        distinguishing_aspect: |
          Depth-2 cascade with a DIFFERENT trigger source than the re-disclosure
          chain above. Trigger: POST /loan-applications/{id}/appraisal/complete.
          Hop 1: Appraisal.status -> COMPLETED with appraised_value_cents below
          sale_price triggers ltv_calculation; LoanApplication.ltv_ratio is
          mutated. Hop 2: the new ltv_ratio (computed from hop 1) being > 0.80
          causes LoanApplication.pmi_required to flip to true — caused by hop
          1's mutation, not by the original endpoint call.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Create LoanApplication with sale_price_cents=40000000, requested_loan_amount_cents=33000000 (initial LTV @ sale_price = 0.8250)"
            - "POST /loan-applications/{id}/appraisal report_date=2026-03-01"
          trigger:
            - "POST /loan-applications/{id}/appraisal/complete appraised_value_cents=38000000"
          assert:
            - "Hop 1: LoanApplication.ltv_ratio == 0.8684 (33000000/38000000, ROUND_HALF_UP 4dp)"
            - "Hop 2: LoanApplication.pmi_required == true (caused by hop 1's ltv > 0.80)"
            - "Appraisal.status == COMPLETED AND Appraisal.valid_until == 2026-06-29T23:59:59.999Z (report_date 2026-03-01 + 120 days)"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_pair
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_TRID_WAITING_PERIOD
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_temporal (priority 8). On
          POST /loan-applications/{id}/clear-to-close, when LoanApplication is
          in INTAKE (wrong source state) AND the latest CD waiting period has
          not elapsed, BOTH conditions fail — but state ordering wins so
          ERR_INVALID_STATE must be returned, not ERR_TRID_WAITING_PERIOD.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Create LoanApplication in INTAKE state (do NOT pre-qualify or proceed)"
          trigger:
            - "POST /loan-applications/{id}/clear-to-close"
          assert:
            - "Response status 409, error_id == ERR_INVALID_STATE (state check at priority 5 wins over temporal check at priority 8)"
            - "Response error_id != ERR_TRID_WAITING_PERIOD"

      - name: business_safety_vs_business_fiscal_pair
        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - errors.ERR_UDAAP_SOD_VIOLATION
          - errors.ERR_DTI_EXCEEDED
        distinguishing_aspect: |
          Different pair: business_safety (priority 6, UDAAP SoD) vs
          business_fiscal (priority 16, DTI). When the LoanOfficer attempting
          underwrite-decision is the same user as the assigned
          compliance_reviewer_id AND the application's dti_ratio exceeds 0.43,
          BOTH would fail — safety wins, returning ERR_UDAAP_SOD_VIOLATION.
          Distinct from the state-vs-temporal pair.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Create LoanApplication where the eventual dti_ratio will exceed 0.43 (e.g., requested_loan_amount_cents=80000000, annual_income_cents=12000000 -> approx dti ~0.43+ depending on verifications)"
            - "Submit-underwriting with compliance_reviewer_id=co_01"
            - "Force dti to compute > 0.43 via a low-VERIFIED IncomeVerification"
          trigger:
            - "POST /loan-applications/{id}/underwrite-decision decision=APPROVE  with X-User-ID=co_01 (same as compliance_reviewer_id — SoD violation)"
          assert:
            - "Response status 403, error_id == ERR_UDAAP_SOD_VIOLATION (priority 6 wins over priority 16 fiscal check)"
            - "Response error_id != ERR_DTI_EXCEEDED"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: apr_tolerance_12_vs_13_bps_strict_greater_than
        grounds:
          - calculations.apr_tolerance_check
          - validations[priority=12]
          - errors.ERR_APR_TOLERANCE_EXCEEDED
        distinguishing_aspect: |
          Metric: APR delta in basis points on POST /loan-applications/{id}/disclosures
          (CLOSING_DISCLOSURE). Boundary: 12 bps ACCEPT, 13 bps REJECT (strict
          '>'). Two adjacent integer values across the threshold produce
          opposite outcomes. Reachable endpoint: POST .../disclosures.
        test_recipe:
          setup:
            - "Set up LoanApplication X1 and X2 each in CONDITIONAL_APPROVAL with latest LE apr_bps=650, acknowledged"
          trigger:
            - "POST /loan-applications/X1/disclosures kind=CLOSING_DISCLOSURE apr_bps=662 (delta=12) total_loan_costs_cents=500000 total_other_costs_cents=800000"
            - "POST /loan-applications/X2/disclosures kind=CLOSING_DISCLOSURE apr_bps=663 (delta=13) total_loan_costs_cents=500000 total_other_costs_cents=800000"
          assert:
            - "X1 response status 201 (CD created; delta=12 <= 12, accepted)"
            - "X2 response status 409, error_id=ERR_APR_TOLERANCE_EXCEEDED (delta=13 > 12, rejected)"

      - name: extension_cap_60_vs_61_days_strict_greater_than
        grounds:
          - validations[priority=13]
          - errors.ERR_EXTENSION_CAP_EXCEEDED
          - state_machines.RateLock.LOCKED_to_EXTENDED
          - state_machines.RateLock.EXTENDED_to_EXTENDED
        distinguishing_aspect: |
          Different metric: cumulative extension days on a RateLock. Different
          endpoint: POST /loan-applications/{id}/rate-lock/extend. Boundary:
          cumulative 60 days ACCEPT, 61+ REJECT (strict '<=' so '> 60' wins).
          With prior cumulative 53 days, +7 -> 60 accepted; with prior
          cumulative 53 days, +15 -> 68 rejected. Distinct boundary axis from
          the APR bps threshold.
        test_recipe:
          setup:
            - "Place RateLock on each of two applications Y1 and Y2 with principal=20000000"
            - "Extend Y1 by 30 + 23 days through a sequence so cumulative=53 (use 30+15+8 — wait 8 not allowed; instead use 30 + 15 + 7 = 52, then 7 = 59, then 1)... use 30 + 15 + 7 = 52 cumulative, then trigger below to test 7 takes to 59 vs 15 takes to 67"
            - "Y1: bring cumulative to 53 days via 30+15+7+? — actual setup: 30+15+7 = 52 cumulative, then extend by 7 brings to 59 (still <=60)"
            - "Y2: bring cumulative to 53 days via 30+15+7 = 52, then extend by 15 brings to 67 (> 60)"
          trigger:
            - "Y1 final extend: POST extra_days=7  (cumulative 52 -> 59 <= 60, ACCEPT)"
            - "Y2 final extend: POST extra_days=15 (cumulative 52 -> 67  > 60, REJECT)"
          assert:
            - "Y1 final response status 200; RateLock.status == EXTENDED"
            - "Y2 final response status 409, error_id=ERR_EXTENSION_CAP_EXCEEDED"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_application_clear_to_close_depends_on_title_search
        grounds:
          - state_machines.LoanApplication.CONDITIONAL_APPROVAL_to_CLEAR_TO_CLOSE
          - state_machines.TitleSearch
          - entities.TitleSearch.fields.status
        distinguishing_aspect: |
          Entity pair: LoanApplication ↔ TitleSearch. clear-to-close requires
          TitleSearch.status IN {CLEAR, RESOLVED}; if TitleSearch is still
          ORDERED or ISSUES_FOUND, the transition is blocked. Two different
          entity classes coupled by a precondition.
        test_recipe:
          setup:
            - "Set up LoanApplication in CONDITIONAL_APPROVAL with all dependencies EXCEPT TitleSearch in CLEAR state"
            - "TitleSearch is in ISSUES_FOUND state (defects_found non-empty, no resolve call yet)"
            - "All TRID, UDAAP, RateLock preconditions satisfied"
          trigger:
            - "POST /loan-applications/{id}/clear-to-close"
          assert:
            - "Response status 409 (precondition unmet via cross-entity state); blocked by TitleSearch.status=ISSUES_FOUND"
            - "After POST /loan-applications/{id}/title-search/resolve (TitleSearch.status=RESOLVED), POST /loan-applications/{id}/clear-to-close succeeds (200)"

      - name: rate_lock_extension_depends_on_loan_application_state
        grounds:
          - state_machines.RateLock.LOCKED_to_EXTENDED
          - state_machines.RateLock.EXTENDED_to_EXTENDED
          - state_machines.LoanApplication
          - entities.LoanApplication.fields.status
        distinguishing_aspect: |
          Different entity pair: RateLock ↔ LoanApplication. RateLock extension
          is blocked when LoanApplication.status IN {DENIED, WITHDRAWN, CLOSED}.
          The dependency is reversed from instance 1 (RateLock depends on
          parent application state instead of application depending on child).
        test_recipe:
          setup:
            - "Place a RateLock on a LoanApplication"
            - "Drive the LoanApplication to WITHDRAWN (this cascades RateLock to CANCELLED)"
          trigger:
            - "POST /loan-applications/{id}/rate-lock/extend extra_days=15"
          assert:
            - "Response status 409 (RateLock.status no longer in {LOCKED, EXTENDED}); error_id ERR_INVALID_STATE"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_lock_active_window_singleton_per_application
        grounds:
          - validations[priority=14]
          - errors.ERR_RATE_LOCK_OVERLAP
          - entities.RateLock.fields.lock_expires_at
          - entities.RateLock.fields.status
        distinguishing_aspect: |
          Interval semantics: SINGLETON occupation — at most ONE RateLock with
          status IN {LOCKED, EXTENDED} per LoanApplication. New POST while one
          is active is rejected regardless of overlap geometry. Resource entity:
          RateLock keyed by application_id.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Create LoanApplication; place initial RateLock with locked_rate_bps=650 (status=LOCKED, lock_expires_at=2026-04-16T10:00:00.000Z)"
          trigger:
            - "POST /loan-applications/{id}/rate-lock locked_rate_bps=640 (second active lock attempt)"
          assert:
            - "Response status 409, error_id=ERR_RATE_LOCK_OVERLAP"
            - "Only one RateLock with status IN {LOCKED, EXTENDED} exists for this application"

      - name: appraisal_validity_window_at_most_one_unexpired_completed
        grounds:
          - validations[priority=15]
          - errors.ERR_APPRAISAL_OVERLAP
          - calculations.appraisal_validity_window
          - entities.Appraisal.fields.valid_until
          - entities.Appraisal.fields.status
        distinguishing_aspect: |
          Different interval semantics: CALENDAR-WINDOW occupation — at most ONE
          COMPLETED Appraisal whose valid_until > SystemClock.now per
          LoanApplication. Geometry is a 120-day calendar window (Appraisal
          report_date + 120 days), as opposed to RateLock's runtime-extendable
          singleton above. Resource entity: Appraisal.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "POST /loan-applications/{id}/appraisal report_date=2026-03-01; complete with appraised_value_cents=40000000 (valid_until=2026-06-29T23:59:59.999Z, unexpired)"
          trigger:
            - "POST /loan-applications/{id}/appraisal report_date=2026-03-15"
          assert:
            - "Response status 409, error_id=ERR_APPRAISAL_OVERLAP"
            - "Only one COMPLETED Appraisal with valid_until > clock.now exists for this application"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rate_lock_fee_accounting_invariant
        grounds:
          - state_machines.RateLock.LOCKED_to_CANCELLED
          - state_machines.RateLock.EXTENDED_to_CANCELLED
          - calculations.rate_lock_extension_fee
          - entities.RateLock.fields.lock_fee_cents
          - entities.RateLock.fields.extension_fee_paid_cents
          - entities.RateLock.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity: RateLock fee balance. Invariant (formula over
          entity fields):
            lock_fee_cents + extension_fee_paid_cents - refund_cents
              = NET_LOCK_REVENUE
          When a RateLock is cancelled within the 48h free-look window, refund
          MUST equal lock_fee + extension_fee_paid so NET_LOCK_REVENUE = 0
          (fully reversed). When cancelled outside the window, refund = 0 and
          NET_LOCK_REVENUE = lock_fee + extension_fee_paid (no reversal).
          Either way the named global quantity is exactly determined by the
          formula. Conserved quantity type: monetary fee balance.
        test_recipe:
          setup:
            - "Advance clock to 2026-03-02T10:00:00.000Z"
            - "Place RateLock R1 on app A1 (principal=20000000): lock_fee_cents = ROUND_HALF_UP(20000000 * 25/10000) = 50000"
            - "Place RateLock R2 on app A2 (principal=20000000): lock_fee_cents = 50000"
            - "On R2: extend by 7 days (fee 10000 cents)"
            - "Advance clock to 2026-03-03T09:00:00.000Z (R1: 23h after lock, within 48h window; R2: also within window)"
          trigger:
            - "POST /loan-applications/A1/rate-lock/cancel  (within 48h free-look)"
            - "Advance clock to 2026-03-05T11:00:00.000Z (R2: 73h after lock, OUTSIDE 48h window)"
            - "POST /loan-applications/A2/rate-lock/cancel"
          assert:
            - "R1.refund_cents == 50000 (lock_fee_cents) ; NET_R1 = 50000 + 0 - 50000 == 0 (compensated)"
            - "R2.refund_cents == 0 (outside window); NET_R2 = 50000 + 10000 - 0 == 60000 (no compensation)"
            - "Invariant equation holds exactly: refund_cents IN {0, lock_fee_cents + extension_fee_paid_cents}"

      - name: disclosure_version_chain_apr_drift_invariant
        grounds:
          - state_machines.Disclosure.ISSUED_to_SUPERSEDED
          - state_machines.Disclosure.ACKNOWLEDGED_to_SUPERSEDED
          - calculations.apr_tolerance_check
          - entities.Disclosure.fields.apr_bps
          - entities.Disclosure.fields.version
          - entities.Disclosure.fields.kind
        distinguishing_aspect: |
          Different conserved quantity TYPE: integer APR-chain drift (in bps),
          not monetary. Invariant:
            For a given (application_id, kind=LOAN_ESTIMATE) chain,
            sum_over_versions(apr_bps[v] - apr_bps[v-1])
              = apr_bps[latest] - apr_bps[1]
          (telescoping). Issuing a new LE compensates for re-disclosure by
          rewriting forward; the named global quantity 'apr drift' equals
          latest_apr - first_apr regardless of intermediate steps.
        test_recipe:
          setup:
            - "Set up LoanApplication; issue three LOAN_ESTIMATEs in succession:"
            - "v1: apr_bps=650"
            - "v2: apr_bps=668 (delta from v1 = +18 bps; supersedes v1)"
            - "v3: apr_bps=655 (delta from v2 = -13 bps; supersedes v2)"
          trigger:
            - "GET /loan-applications/{id}/disclosures?kind=LOAN_ESTIMATE"
          assert:
            - "Three Disclosures returned with versions [1, 2, 3] for kind=LOAN_ESTIMATE"
            - "Disclosures with versions 1 and 2 have status=SUPERSEDED; version 3 has status IN {ISSUED, ACKNOWLEDGED}"
            - "Drift invariant: (668 - 650) + (655 - 668) == (655 - 650) == 5 bps  (telescoping holds; conserved quantity = apr_bps[latest] - apr_bps[1])"
