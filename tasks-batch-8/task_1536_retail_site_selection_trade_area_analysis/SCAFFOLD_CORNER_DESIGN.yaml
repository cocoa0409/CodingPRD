# =============================================================================
# §1.9 Scaffold Corner Design — Retail Site Selection & Trade Area Analysis
# Breadth coverage: every testable claim of SCAFFOLD.yaml §1.1-§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml. excluded_because stubs cite the
# covering §1.8 instance. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: market_create_applies_defaults_and_null_computed
        claim_type: creation
        grounds:
          - entities.Market
          - "endpoints: POST /api/markets"
        distinguishing_aspect: "Create returns 201 with market_status SCREENING, open_store_count 0, committed_capex_cents 0, and null raw_score/screening_tier/target_store_count/penetration_index/final_score before any evaluate."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/markets"
              payload: { name: "Metro D", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
          assert:
            - "Response 201; Market.${mkt_id}.market_status == SCREENING, open_store_count == 0, committed_capex_cents == 0, version == 1"
            - "raw_score, screening_tier, target_store_count, penetration_index, final_score are all null before evaluate"
            - "id is a UUID without type prefix; created_at has three fractional digits"

      - name: market_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Market.fields.population
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required population -> ERR_INVALID_REQUEST (400); the server does not invent a default."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/markets"
              payload: { name: "Metro D", state_code: "TX", median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response 400 with error_id ERR_INVALID_REQUEST (population is required)"

      - name: site_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Site.fields.format_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "format_type 'MEGA' is not in {EXPRESS, STANDARD, FLAGSHIP} -> ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["QUALIFIED market exists"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro E", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "9 Bad Enum Ln", format_type: "MEGA", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Response 400 with error_id ERR_INVALID_REQUEST"

      - name: get_nonexistent_site_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - "endpoints: GET /api/sites/{id}"
        distinguishing_aspect: "GET with a well-formed but unknown UUID -> ERR_NOT_FOUND (404); same for a body-referenced FK on create."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: RealEstateAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /api/trade-area-models"
              payload: { site_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { err2: $.data.error_id }
          assert:
            - "GET returns 404 ERR_NOT_FOUND"
            - "Model create with unknown site_id returns 404 ERR_NOT_FOUND (body-referenced FK existence)"

      - name: vote_record_is_immutable
        claim_type: immutability
        grounds:
          - entities.Vote
        distinguishing_aspect: "Vote (common_fields: false) carries id + created_at only — no version/updated_at — and no update or delete endpoint exists for it."
        test_recipe:
          setup:
            - "OPEN review with E=2 (sponsor; chair + voter1 eligible)"
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro V", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N1", format_type: "STANDARD", annual_sales_cents: 1200000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N2", format_type: "STANDARD", annual_sales_cents: 1000000000 }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
            - call: "POST /api/site-visits"
              payload: { site_id: "${site_id}", visited_on: "2026-08-05", visibility_score: 80, access_score: 90, parking_score: 70, cotenancy_score: 85 }
              as: RealEstateAnalyst
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "ANALOG" }
              as: RealEstateAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /api/sales-forecasts/${fc_id}/lock"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/committee-members"
              payload: { display_name: "Sponsor" }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Chair", is_chair: true }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Voter1" }
              as: PlatformAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /api/sites/${site_id}/submit-committee"
              payload: { sales_forecast_id: "${fc_id}", sponsor_member_id: "${sp_id}", expires_at: "2026-08-15T00:00:00Z" }
              as: RealEstateManager
              captures: { rev_id: $.data.id, rv0: $.data.version }
          trigger:
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "APPROVE", expected_review_version: "${rv0}" }
              as: CommitteeMember
              as_user_id: "${v1_id}"
              captures: { vote_id: $.data.id }
          assert:
            - "Vote.${vote_id} response contains id, review_id, member_id, ballot, created_at and NO version or updated_at keys"
            - "member_id == ${v1_id} (taken from X-User-ID, not from the payload)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: site_open_from_draft_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Site
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /open is only declared from BUILD_OUT; from DRAFT it fails with ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["QUALIFIED market; site in DRAFT"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro S1", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/open"
              payload: {}
              as: RealEstateManager
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 ERR_INVALID_STATE; Site.${site_id}.site_status remains DRAFT"

      - name: withdraw_twice_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Site
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "First withdraw from DRAFT succeeds (-> WITHDRAWN); second withdraw hits terminal lockdown with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["QUALIFIED market; site in DRAFT"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro S2", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/withdraw"
              payload: {}
              as: RealEstateManager
              captures: { st1: $.data.site_status }
            - call: "POST /api/sites/${site_id}/withdraw"
              payload: {}
              as: RealEstateManager
              captures: { err: $.data.error_id }
          assert:
            - "First withdraw returns 200 with site_status WITHDRAWN"
            - "Second withdraw returns 409 ERR_ALREADY_TERMINAL"

      - name: run_screening_twice_second_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Site.DRAFT_to_SCREENED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "run-screening is not repeatable: the first call moves DRAFT -> SCREENED; the identical second call fails ERR_INVALID_STATE (no silent no-op)."
        test_recipe:
          setup: ["QUALIFIED market; site DRAFT"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro S3", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
              captures: { st1: $.data.site_status }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "First call: site_status SCREENED"
            - "Second identical call: 409 ERR_INVALID_STATE"

      - name: accept_terminal_loi_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LOI
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "ACCEPTED is terminal: a second accept on the same LOI fails ERR_ALREADY_TERMINAL; agreed_rent_psf_cents stays pinned at the first accept's value."
        test_recipe:
          setup: ["APPROVED site; LOI ACCEPTED with agreed_rent_psf_cents == 2000"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro S4", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N1", format_type: "STANDARD", annual_sales_cents: 1200000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N2", format_type: "STANDARD", annual_sales_cents: 1000000000 }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
            - call: "POST /api/site-visits"
              payload: { site_id: "${site_id}", visited_on: "2026-08-05", visibility_score: 80, access_score: 90, parking_score: 70, cotenancy_score: 85 }
              as: RealEstateAnalyst
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "ANALOG" }
              as: RealEstateAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /api/sales-forecasts/${fc_id}/lock"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/committee-members"
              payload: { display_name: "Sponsor" }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /api/committee-members"
              payload: { display_name: "Chair", is_chair: true }
              as: PlatformAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/sites/${site_id}/submit-committee"
              payload: { sales_forecast_id: "${fc_id}", sponsor_member_id: "${sp_id}", expires_at: "2026-08-15T00:00:00Z" }
              as: RealEstateManager
              captures: { rev_id: $.data.id, rv0: $.data.version }
            - call: "POST /api/committee-reviews/${rev_id}/votes"
              payload: { ballot: "APPROVE", expected_review_version: "${rv0}" }
              as: CommitteeChair
              as_user_id: "${ch_id}"
            - call: "POST /api/committee-reviews/${rev_id}/ratify"
              payload: {}
              as: CommitteeChair
              as_user_id: "${ch_id}"
            - call: "POST /api/lois"
              payload: { site_id: "${site_id}", rent_psf_cents: 2000, escalation_pct_bp: 200, term_years: 3, exclusivity_start_date: "2026-09-01", exclusivity_end_date: "2026-10-01" }
              as: RealEstateManager
              captures: { loi_id: $.data.id }
            - call: "POST /api/lois/${loi_id}/send"
              payload: {}
              as: RealEstateManager
            - call: "POST /api/lois/${loi_id}/accept"
              payload: {}
              as: RealEstateManager
          trigger:
            - call: "POST /api/lois/${loi_id}/accept"
              payload: {}
              as: RealEstateManager
              captures: { err: $.data.error_id }
          assert:
            - "Second accept returns 409 ERR_ALREADY_TERMINAL"
            - "LOI.${loi_id}.agreed_rent_psf_cents remains 2000 and loi_status ACCEPTED"

      - name: initial_states_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.Site
          - state_machines.TradeAreaModel
          - state_machines.SiteVisit
          - state_machines.SalesForecast
        distinguishing_aspect: "Site starts DRAFT, TradeAreaModel DRAFT with null cannibalized_sales_cents, SiteVisit SUBMITTED at creation, SalesForecast DRAFT with null net/lock-time fields."
        test_recipe:
          setup: ["QUALIFIED market; site SCREENED"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro S5", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id, st0: $.data.site_status }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
          trigger:
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id, mst: $.data.model_status, cann: $.data.cannibalized_sales_cents }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
            - call: "POST /api/trade-area-models/${mdl_id}/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
            - call: "POST /api/site-visits"
              payload: { site_id: "${site_id}", visited_on: "2026-08-05", visibility_score: 80, access_score: 90, parking_score: 70, cotenancy_score: 85 }
              as: RealEstateAnalyst
              captures: { vst: $.data.visit_status }
            - call: "POST /api/sales-forecasts"
              payload: { site_id: "${site_id}", trade_area_model_id: "${mdl_id}", model_variant: "ANALOG" }
              as: RealEstateAnalyst
              captures: { fst: $.data.forecast_status, net: $.data.net_annual_sales_cents }
          assert:
            - "Site created with site_status == DRAFT and consecutive_miss_count == 0"
            - "TradeAreaModel created with model_status == DRAFT and cannibalized_sales_cents == null"
            - "SiteVisit created directly in SUBMITTED"
            - "SalesForecast created DRAFT with net_annual_sales_cents == null (gross computed, lock-time fields null)"

      - name: ratify_open_review_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CommitteeReview.DECIDED_to_RATIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Ratify requires DECIDED; on an OPEN review (no votes) it fails ERR_INVALID_STATE and decided_outcome stays null."
        test_recipe:
          setup: ["Site IN_COMMITTEE, review OPEN, zero ballots"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro S6", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N1", format_type: "STANDARD", annual_sales_cents: 1200000000 }
              as: PlatformAdmin
            - call: "POST /api/stores"
              payload: { market_id: "${mkt_id}", store_code: "N2", format_type: "STANDARD", annual_sales_cents: 1000000000 }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "POST /api/trade-area-models"
              payload: { site_id: "${site_id}", drive_time_minutes: 15, trade_area_population: 50000, per_capita_spend_cents: 300000, cannibalization_variant: "FLAT_BAND" }
              as: RealEstateAnalyst
              captures: { mdl_id: $.data.id }
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
