              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton", latitude: 45.67, longitude: -118.79, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-02T00:00:00Z", screening_capacity: 2 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl1: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl1}/screenings"
              payload: { patient_full_name: "Scout One", patient_date_of_birth: "2019-05-01T00:00:00Z", suspected_condition_category: "ORTHOPEDIC", screening_date: "2026-10-01T00:00:00Z" }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { sc1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/outreach-clinics"
              payload: { location_name: "Pendleton again", latitude: 45.67, longitude: -118.79, start_date: "2027-01-01T00:00:00Z", end_date: "2027-01-02T00:00:00Z", screening_capacity: 2 }
              as: OutreachPlanner
              as_user_id: "op-1"
              captures: { cl2: $.data.id }
            - call: "POST /charity-care/outreach-clinics/${cl2}/confirm"
              payload: {}
              as: OutreachPlanner
              as_user_id: "op-1"
          trigger:
            - call: "POST /charity-care/hospitals/${h1}/suspend"
              payload: {}
              as: NetworkAdmin
          assert:
            - "SpecialtyHospital.${h1}.status == SUSPENDED"
            - "SpecialtyProgram.${p1}.status == SUSPENDED"
            - "OutreachClinic.${cl1}.status == CANCELLED_CLINIC      # PROPOSED at suspend time"
            - "OutreachClinic.${cl2}.status == CONFIRMED             # conditional cascade: only PROPOSED clinics die"
            - "OutreachScreening.${sc1}.status == EXPIRED            # hop 2: caused by CL1's cancellation"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: decide_conflict_state_vs_fiscal_capacity
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - errors.ERR_INVALID_STATE
          - errors.ERR_HOSPITAL_CAPACITY_REACHED
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_fiscal (priority 15):
          a decide(ACCEPT) on an ALREADY-ACCEPTED application whose hospital is also
          at full capacity must answer ERR_INVALID_STATE, never
          ERR_HOSPITAL_CAPACITY_REACHED — the state check pre-empts the fiscal check
          even though both conditions hold.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 1 (so a single acceptance fills it), ORTHOPEDIC program P1 (0..215, non-staged), source RS1. Application A1 accepted (fills capacity: admissions_ytd == 1 == annual_capacity). Application A2 submitted and opened, with full accept quorum voted."
