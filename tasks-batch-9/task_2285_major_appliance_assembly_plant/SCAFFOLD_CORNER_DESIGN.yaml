            - call: "POST /production-units/00000000-0000-4000-8000-000000000102/ship"
              payload: {}
              as: QualityInspector
              captures: { err_r5_id: $.data.error_id }
            - call: "POST /engineering-changes"
              payload: { model_variant_id: "00000000-0000-4000-8000-000000000103", affected_part_id: "00000000-0000-4000-8000-000000000104", target_line_id: "00000000-0000-4000-8000-000000000105", bom_position_code: "POS-DOOR", cut_in_sequence_index: 5 }
