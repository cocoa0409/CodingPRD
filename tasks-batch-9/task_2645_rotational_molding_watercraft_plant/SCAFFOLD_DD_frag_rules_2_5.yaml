              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-OPR-1", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-P2", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-P2-BIG", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "OCHRE", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2035-12-31" }
              as: PlantAdmin
