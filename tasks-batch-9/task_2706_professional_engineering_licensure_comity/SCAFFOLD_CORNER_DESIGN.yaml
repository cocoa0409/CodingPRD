# Scaffold Corner Design (SKILL.md §1.9) — breadth probe over SCAFFOLD.yaml §1.1–§1.7.
# Taxonomy is taken verbatim from references/claim-extraction-guide.md: the nine guide sections are
# the `section:` values and the per-section rows are the `claim_type:` values.
# Depth corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear here as
# `excluded_because:` stubs citing the covering §1.8 instance by name.
scaffold_corner_design:
  - section: entities
    instances:
      - name: engineer_created_with_all_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.Engineer
          - endpoints[POST /engineers]
          - roles.BoardSecretary
        distinguishing_aspect: "POST /engineers with full_name, email, home_jurisdiction and ncees_record_id returns 201 and echoes all four inputs plus the computed active_license_number (null) and open_case_count (0)."
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /engineers"
              payload: { full_name: "Ivo Karlsen", email: "ivo.karlsen@pe.test", home_jurisdiction: "OR", ncees_record_id: "NCEES-770001" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_ivo: $.data.id }
          assert:
            - "trigger[0] http_status == 201"
            - "trigger[0] response.data.full_name == \"Ivo Karlsen\""
            - "trigger[0] response.data.email == \"ivo.karlsen@pe.test\""
            - "trigger[0] response.data.home_jurisdiction == \"OR\""
            - "trigger[0] response.data.ncees_record_id == \"NCEES-770001\""
            - "trigger[0] response.data.active_license_number == null"
            - "trigger[0] response.data.open_case_count == 0"
            - "trigger[0] response.data.version == 1"
            - "trigger[0] response.meta.api_request_id is a non-empty string and response.response_type == \"object\""

      - name: engineer_retrieval_by_id_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /engineers/{engineer_id}]
          - entities.Engineer
        distinguishing_aspect: "GET /engineers/{engineer_id} returns the same id, full_name, email and home_jurisdiction that POST /engineers persisted, with response_type \"object\"."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default; one Engineer 'Ivo Karlsen' exists."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Ivo Karlsen", email: "ivo.karlsen2@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_ivo2: $.data.id }
          trigger:
            - call: "GET /engineers/${eng_ivo2}"
              payload: {}
              as: BoardSecretary
              as_user_id: "SEC-1"
          assert:
            - "trigger[0] http_status == 200"
            - "trigger[0] response.data.id == ${eng_ivo2}"
            - "trigger[0] response.data.full_name == \"Ivo Karlsen\""
            - "trigger[0] response.data.email == \"ivo.karlsen2@pe.test\""
            - "trigger[0] response.response_type == \"object\""

      - name: engineers_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /engineers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three Engineers stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and limit=2&offset=2 returns 1 row with total_count 3 and has_more false."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default; exactly three Engineers exist, all with home_jurisdiction OR."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Page One", email: "page.one@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_p1: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Page Two", email: "page.two@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_p2: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Page Three", email: "page.three@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_p3: $.data.id }
          trigger:
            - call: "GET /engineers?home_jurisdiction=OR&limit=2&offset=0"
              payload: {}
              as: BoardSecretary
              as_user_id: "SEC-1"
            - call: "GET /engineers?home_jurisdiction=OR&limit=2&offset=2"
              payload: {}
              as: BoardSecretary
              as_user_id: "SEC-1"
          assert:
            - "trigger[0] http_status == 200 and response.response_type == \"array\""
            - "trigger[0] response.data length == 2"
            - "trigger[0] response.total_count == 3"
            - "trigger[0] response.has_more == true"
            - "trigger[1] response.data length == 1"
            - "trigger[1] response.total_count == 3"
            - "trigger[1] response.has_more == false"

      - name: license_get_unknown_id_returns_license_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_LICENSE_NOT_FOUND
          - validations[priority=4]
          - endpoints[GET /licenses/{license_id}]
        distinguishing_aspect: "A syntactically valid but unpersisted license id returns 404 with error_id ERR_LICENSE_NOT_FOUND, not 400 and not an empty 200 body."
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "GET /licenses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
          assert:
            - "trigger[0] http_status == 404"
            - "trigger[0] response.data.error_id == \"ERR_LICENSE_NOT_FOUND\""
            - "trigger[0] response.response_type == \"error\""

      - name: application_create_missing_pathway_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - entities.Application.fields.pathway
        distinguishing_aspect: "Omitting the required input field pathway from POST /applications returns 400 ERR_INVALID_REQUEST and persists no Application row."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default; Engineer 'Mona Silt' exists with no applications."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Mona Silt", email: "mona.silt@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_mona: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { engineer_id: "${eng_mona}", exam_code: "PE_CIVIL", degree_level: "BS" }
              as: Applicant
              as_user_id: "${eng_mona}"
          assert:
            - "trigger[0] http_status == 400"
            - "trigger[0] response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /applications?engineer_id=${eng_mona} returns total_count == 0"

      - name: license_pdh_requirement_defaults_to_thirty
        claim_type: defaults
        grounds:
          - entities.License.fields.pdh_requirement
          - endpoints[POST /licenses]
          - calculations.cpc_pdh_valuation
        distinguishing_aspect: "Omitting the optional pdh_requirement on POST /licenses stores 30 (DEFAULT_PDH_REQUIREMENT), while supplying 45 stores 45 — the default is applied at creation, not resolved lazily at CPC evaluation time."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default; two Engineers exist and neither holds a licence."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Default Holder", email: "default.holder@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_def: $.data.id }
            - call: "POST /engineers"
              payload: { full_name: "Explicit Holder", email: "explicit.holder@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_exp: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_def}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_def: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_exp}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z", pdh_requirement: 45 }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_exp: $.data.id }
          assert:
            - "trigger[0] response.data.pdh_requirement == 30"
            - "trigger[1] response.data.pdh_requirement == 45"
            - "License.${lic_def}.pdh_requirement == 30"
            - "License.${lic_exp}.pdh_requirement == 45"

      - name: experience_record_computed_credit_fields_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ExperienceRecord.fields.raw_months
          - entities.ExperienceRecord.fields.credit_multiplier
          - entities.ExperienceRecord.fields.credited_months
          - calculations.experience_credit_evaluation
        distinguishing_aspect: "raw_months and credit_multiplier are derived from the period bounds and responsibility_level (2019-01..2019-12 SUBORDINATE post-degree gives 12 and 0.50) while credited_months stays 0 until the record is VERIFIED; client-supplied values for all three fields are discarded."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default; Engineer 'Cy Ranfield' holds a DRAFT STANDARD_EXAM application with no experience records."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Cy Ranfield", email: "cy.ranfield@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_cy: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_cy}", pathway: "STANDARD_EXAM", exam_code: "PE_CIVIL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_cy}"
              captures: { app_cy: $.data.id }
          trigger:
            - call: "POST /applications/${app_cy}/experience-records"
              payload: { employer_name: "Ranfield Design", position_title: "Junior Engineer", period_start_month: "2019-01", period_end_month: "2019-12", responsibility_level: "SUBORDINATE", post_degree: true, raw_months: 999, credit_multiplier: 9.99, credited_months: 999 }
              as: Applicant
              as_user_id: "${eng_cy}"
              captures: { er_cy: $.data.id }
          assert:
            - "trigger[0] http_status == 201"
            - "trigger[0] response.data.raw_months == 12"
            - "trigger[0] response.data.credit_multiplier == 0.50"
            - "trigger[0] response.data.credited_months == 0"
            - "ExperienceRecord.${er_cy}.verification_status == UNVERIFIED"
            - "Application.${app_cy}.provisional_experience_months == 0"
            - "Application.${app_cy}.fee_assessment_cents == 27500"

      - name: engineer_id_and_timestamps_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Engineer
          - response_envelope
        distinguishing_aspect: "id, created_at, updated_at and version are server-generated: a POST /engineers body carrying id \"deadbeef\" and version 99 yields a server-minted id different from \"deadbeef\" and version 1."
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /engineers"
              payload: { full_name: "Spoof Attempt", email: "spoof.attempt@pe.test", home_jurisdiction: "WA", id: "deadbeef", version: 99, created_at: "1999-01-01T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_spoof: $.data.id }
          assert:
            - "trigger[0] http_status == 201"
            - "trigger[0] response.data.id != \"deadbeef\""
            - "trigger[0] response.data.version == 1"
            - "trigger[0] response.data.created_at == \"2026-08-01T00:00:00.000Z\""
            - "trigger[0] response.data.updated_at == \"2026-08-01T00:00:00.000Z\""

      - name: application_invalid_pathway_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Application.fields.pathway
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "pathway \"RECIPROCITY\" is not a declared member of {STANDARD_EXAM, COMITY} and is refused with 400 ERR_INVALID_REQUEST rather than silently coerced to a default."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default; Engineer 'Enum Prober' exists."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Enum Prober", email: "enum.prober@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_enum: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { engineer_id: "${eng_enum}", pathway: "RECIPROCITY", exam_code: "PE_CIVIL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_enum}"
          assert:
            - "trigger[0] http_status == 400"
            - "trigger[0] response.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /applications?engineer_id=${eng_enum} returns total_count == 0"

      - name: pdh_record_immutable_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.PDHRecord
          - endpoints[GET /pdh-records/{pdh_record_id}]
        distinguishing_aspect: "PDHRecord is declared common_fields: false, so its read shape carries id and created_at but neither updated_at nor version, and no endpoint in §1.5 mutates a PDHRecord's own input fields after creation."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Nell Auber' holds an ACTIVE licence issued 2026-01-15 (version 1) and one SUBMITTED CPCReport for 2026-01-15..2028-01-15."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Nell Auber", email: "nell.auber@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_nell: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_nell}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_nell: $.data.id, lic_nell_ver: $.data.version }
            - call: "POST /cpc-reports"
              payload: { license_id: "${lic_nell}", period_start: "2026-01-15T00:00:00Z", period_end: "2028-01-15T00:00:00Z", self_certified_pdh: 12, carryover_pdh_claimed: 0, expected_license_version: "${lic_nell_ver}" }
              as: Licensee
              as_user_id: "${eng_nell}"
              captures: { rep_nell: $.data.id }
            - call: "POST /cpc-reports/${rep_nell}/pdh-records"
              payload: { activity_type: "COURSE", pdh_hours: 12.0, completed_on: "2027-02-02T00:00:00Z", ethics_flag: false }
              as: Licensee
              as_user_id: "${eng_nell}"
              captures: { pdh_nell: $.data.id }
          trigger:
            - call: "GET /pdh-records/${pdh_nell}"
              payload: {}
              as: Licensee
              as_user_id: "${eng_nell}"
          assert:
            - "trigger[0] http_status == 200"
            - "trigger[0] response.data.id == ${pdh_nell}"
            - "trigger[0] response.data.created_at == \"2026-08-01T00:00:00.000Z\""
            - "trigger[0] response.data has no \"version\" key"
            - "trigger[0] response.data has no \"updated_at\" key"
            - "trigger[0] response.data.documentation_status == \"NONE\""

      - name: experience_record_requires_existing_parent_application
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_APPLICATION_NOT_FOUND
          - endpoints[POST /applications/{application_id}/experience-records]
        distinguishing_aspect: "Nested creation under an unpersisted application_id returns 404 ERR_APPLICATION_NOT_FOUND from the path-existence check at priority 4, before any body validation of the month range."
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Orphan Filer", email: "orphan.filer@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_orph: $.data.id }
          trigger:
            - call: "POST /applications/00000000-0000-4000-8000-000000000000/experience-records"
              payload: { employer_name: "Nowhere Civil", position_title: "Engineer", period_start_month: "2030-12", period_end_month: "2019-01", responsibility_level: "RESPONSIBLE_CHARGE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_orph}"
          assert:
            - "trigger[0] http_status == 404"
            - "trigger[0] response.data.error_id == \"ERR_APPLICATION_NOT_FOUND\""
            - "trigger[0] response.data.error_id != \"ERR_INVALID_REQUEST\""

      - name: plan_submission_body_fk_unknown_firm_not_found
        claim_type: flat
        grounds:
          - validations[priority=5]
          - errors.ERR_FIRM_REGISTRATION_NOT_FOUND
          - entities.PlanSubmission.fields.firm_registration_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "In the flat topology every body foreign key is dereferenced: POST /plan-submissions with an unpersisted firm_registration_id returns 404 ERR_FIRM_REGISTRATION_NOT_FOUND rather than storing a dangling reference."
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z default; no FirmRegistration rows exist."
          setup_api_calls: []
          trigger:
            - call: "POST /plan-submissions"
              payload: { firm_registration_id: "00000000-0000-4000-8000-000000000000", project_name: "Ghost Tower", sheet_count: 2 }
              as: FirmAdmin
              as_user_id: "00000000-0000-4000-8000-000000000000"
          assert:
            - "trigger[0] http_status == 404"
            - "trigger[0] response.data.error_id == \"ERR_FIRM_REGISTRATION_NOT_FOUND\""
            - "GET /plan-submissions returns total_count == 0"

  - section: state_machines
    instances:
      - name: application_start_review_moves_submitted_to_under_review
        claim_type: valid_transition
        grounds:
          - state_machines.Application.transitions.SUBMITTED_to_UNDER_REVIEW
          - endpoints[POST /applications/{application_id}/start-review]
        distinguishing_aspect: "start-review on a SUBMITTED application moves status to UNDER_REVIEW and stamps reviewer_user_id with the acting X-User-ID."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Dana Ott' holds a SUBMITTED STANDARD_EXAM application: education EABET_ACCREDITED, one experience record, fee 27500 paid in full."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ott", email: "dana.ott@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_dana: $.data.id }
            - call: "POST /applications"
              payload: { engineer_id: "${eng_dana}", pathway: "STANDARD_EXAM", exam_code: "PE_CIVIL", degree_level: "BS", expedite_requested: false }
              as: Applicant
              as_user_id: "${eng_dana}"
              captures: { app_dana: $.data.id }
            - call: "POST /applications/${app_dana}/education-evaluation"
              payload: { degree_level: "BS", accreditation_finding: "EABET_ACCREDITED" }
              as: BoardReviewer
              as_user_id: "REV-1"
            - call: "POST /applications/${app_dana}/experience-records"
              payload: { employer_name: "Ott Structural", position_title: "Project Engineer", period_start_month: "2019-01", period_end_month: "2022-12", responsibility_level: "RESPONSIBLE_CHARGE", post_degree: true }
              as: Applicant
              as_user_id: "${eng_dana}"
            - call: "POST /applications/${app_dana}/payments"
              payload: { amount_cents: 27500 }
              as: Applicant
              as_user_id: "${eng_dana}"
            - call: "POST /applications/${app_dana}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${eng_dana}"
          trigger:
            - call: "POST /applications/${app_dana}/start-review"
              payload: {}
              as: BoardReviewer
              as_user_id: "REV-7"
          assert:
            - "trigger[0] http_status == 200"
            - "trigger[0] response.data.status == \"UNDER_REVIEW\""
            - "trigger[0] response.data.reviewer_user_id == \"REV-7\""
            - "Application.${app_dana}.submitted_at == \"2026-08-01T00:00:00.000Z\""

      - name: license_renew_before_window_opens_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.License.transitions.ACTIVE_to_ACTIVE
          - validations[priority=34]
          - errors.ERR_RENEWAL_WINDOW_CLOSED
          - calculations.license_period_roll
        distinguishing_aspect: "The renewal window precondition (clock >= renewal_window_opens_at) is violated at clock 2026-08-01 for a licence issued 2026-01-15 whose window opens 2027-10-17, so renew returns 409 ERR_RENEWAL_WINDOW_CLOSED and the period is not rolled."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Ada Pyle' holds an ACTIVE STANDARD licence issued 2026-01-15 with current_period_end 2028-01-15 and renewal_window_opens_at 2027-10-17."
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Ada Pyle", email: "ada.pyle@pe.test", home_jurisdiction: "OR" }
              as: BoardSecretary
              as_user_id: "SEC-1"
              captures: { eng_ada: $.data.id }
            - call: "POST /licenses"
              payload: { engineer_id: "${eng_ada}", license_type: "STANDARD", issued_on: "2026-01-15T00:00:00Z" }
              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
              captures: { lic_ada: $.data.id }
          trigger:
            - call: "POST /licenses/${lic_ada}/renew"
              payload: {}
              as: Licensee
              as_user_id: "${eng_ada}"
          assert:
            - "trigger[0] http_status == 409"
            - "trigger[0] response.data.error_id == \"ERR_RENEWAL_WINDOW_CLOSED\""
            - "License.${lic_ada}.current_period_start == \"2026-01-15T00:00:00.000Z\""
            - "License.${lic_ada}.current_period_end == \"2028-01-15T00:00:00.000Z\""
            - "License.${lic_ada}.renewal_window_opens_at == \"2027-10-17T00:00:00.000Z\""

      - name: application_submit_side_effects_stamp_and_promote_records
        claim_type: side_effect_execution
        grounds:
          - state_machines.Application.transitions.DRAFT_to_SUBMITTED
          - state_machines.ExperienceRecord.transitions.UNVERIFIED_to_PENDING_VERIFICATION
          - calculations.experience_credit_evaluation
          - calculations.application_fee_assessment
        distinguishing_aspect: "One submit call fires all four declared side effects: submitted_at stamped 2026-08-01T00:00:00.000Z, the referenced ExperienceRecord promoted UNVERIFIED -> PENDING_VERIFICATION, provisional_experience_months recomputed to 48, and fee_assessment_cents frozen at 27500."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Engineer 'Ruth Vane' (applicant) and Engineer 'Otto Krell' (referee) exist."
