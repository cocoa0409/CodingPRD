      - name: clock_default_is_fixed_earliest
        claim_type: conditional_action
        grounds: [endpoints: "POST /spirit-store/_clock/set_current_utc"]
        distinguishing_aspect: "Without any set call the logical clock is exactly 2026-08-01T00:00:00Z: a drop whose opens_at equals that instant opens immediately (>= semantics) with no clock manipulation."
        test_recipe:
          setup: ["Program ACTIVE; drop SCHEDULED with opens_at == 2026-08-01T00:00:00Z (the documented default)"]
          setup_api_calls:
            - { call: "POST /spirit-store/programs", payload: { name: "Spirit 2026", school_year: "2026-2027", valuation_method: FIFO }, as: ActivitiesDirector, captures: { prog: $.data.id } }
            - { call: "POST /spirit-store/programs/${prog}/lifecycle", payload: { to_state: ACTIVE }, as: ActivitiesDirector, captures: { pv: $.data.version } }
