              as: PlatformAdmin
              captures: { firm_silver_admin_id: $.data.id }
            - &k_firm_gold2_admin
              call: "POST /api/firms/${firm_gold2_id}/users"
              payload: { firm_id: "${firm_gold2_id}", full_name: "G Admin", email: "g@g.example", is_firm_admin: true }
              as: PlatformAdmin
              captures: { firm_gold2_admin_id: $.data.id }
            - &k_firm_plat_admin
              call: "POST /api/firms/${firm_plat_id}/users"
              payload: { firm_id: "${firm_plat_id}", full_name: "P Admin", email: "p@p.example", is_firm_admin: true }
              as: PlatformAdmin
              captures: { firm_plat_admin_id: $.data.id }
            - &k_company_d
              call: "POST /api/companies"
              payload: { legal_name: "Delta Corp", admin_email: "d@d.example", home_country: "US", data_region: "US", plan_id: "${plan_adv_id}" }
              as: PlatformAdmin
              captures: { company_d_id: $.data.id }
            - &k_company_e
