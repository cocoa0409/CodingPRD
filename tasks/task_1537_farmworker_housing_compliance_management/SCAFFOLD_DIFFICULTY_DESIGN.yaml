      - name: safety_beats_referential_on_pest_blocked_activation
        grounds:
          - "validations[priority=11]"
          - "validations[priority=16]"
          - errors[ERR_UNIT_UNDER_PEST_EXCLUSION]
          - errors[ERR_MEMBER_ALREADY_HOUSED]
        distinguishing_aspect: |
          Category pair (business_safety, business_referential): activation of
          a second tenancy for a household whose members are already housed
          AND whose target unit sits inside a pest exclusion window violates
          both p11 and p16; the safety error ERR_UNIT_UNDER_PEST_EXCLUSION
          must win.
        test_recipe:
          setup:
            - "Site OPEN; units A and B both CERTIFIED (max_occupancy 4)"
            - "Household H ELIGIBLE with 1 member; tenancy T1 on A ACTIVE (members already housed)"
            - "Pest treatment on B APPLIED at clock 2026-08-10 with buffer 3 (exclusion end 2026-08-13)"
            - "Tenancy T2 on B for the same household H, PENDING_MOVE_IN, move_in_date 2026-08-12"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site PB", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "A", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { ua_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${ua_id}" }, as: ComplianceInspector, captures: { ca_id: $.data.id } }
            - { call: "PUT /unit-certifications/${ca_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${ca_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "B", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { ub_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${ub_id}" }, as: ComplianceInspector, captures: { cb_id: $.data.id } }
            - { call: "PUT /unit-certifications/${cb_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${cb_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam PB", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "PB One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${ua_id}", as: IntakeCoordinator, captures: { ua_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${ua_id}", move_in_date: "2026-08-05", expected_unit_version: "${ua_v}" }, as: IntakeCoordinator, captures: { t1_id: $.data.id } }
            - { call: "PUT /tenancies/${t1_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "POST /pest-treatments", payload: { unit_id: "${ub_id}", treatment_type: "FUMIGATION", scheduled_date: "2026-08-10", reentry_buffer_days: 3 }, as: SiteManager, captures: { pt_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: OperatorAdmin }
            - { call: "PUT /pest-treatments/${pt_id}", payload: { status: "APPLIED" }, as: SiteManager }
            - { call: "GET /housing-units/${ub_id}", as: IntakeCoordinator, captures: { ub_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${ub_id}", move_in_date: "2026-08-12", expected_unit_version: "${ub_v}" }, as: IntakeCoordinator, captures: { t2_id: $.data.id } }
          trigger:
            - { call: "PUT /tenancies/${t2_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNIT_UNDER_PEST_EXCLUSION — safety (priority 11) outranks the member-already-housed referential gate (priority 16) when both fail"
            - "Tenancy.${t2_id}.status remains PENDING_MOVE_IN"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: occupancy_boundary_exact_capacity
        grounds:
          - calculations.occupancy_headcount_check
          - "validations[priority=13]"
          - errors[ERR_OCCUPANCY_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Metric: headcount on PUT /tenancies/{id}. A household of exactly
          max_occupancy (4) activates cleanly (inclusive boundary), while a
          second household of 1 pushing the projection to max_occupancy + 1
          (5) is rejected with 422.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED with max_occupancy 4"
            - "Household H1 ELIGIBLE with 4 members; household H2 ELIGIBLE with 1 member"
            - "T1 (H1) PENDING_MOVE_IN; T2 (H2) PENDING_MOVE_IN created after T1's activation bumped the unit version"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site OB", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam Four", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { h1_id: $.data.id } }
            - { call: "PUT /households/${h1_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h1_id}", full_name: "F1", date_of_birth: "1980-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h1_id}", full_name: "F2", date_of_birth: "1982-01-01", relationship: "SPOUSE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h1_id}", full_name: "F3", date_of_birth: "2010-01-01", relationship: "CHILD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h1_id}", full_name: "F4", date_of_birth: "2012-01-01", relationship: "CHILD" }, as: IntakeCoordinator }
            - { call: "POST /households", payload: { head_of_household_name: "Fam One", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { h2_id: $.data.id } }
            - { call: "PUT /households/${h2_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h2_id}", full_name: "O1", date_of_birth: "1995-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v1: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${h1_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v1}" }, as: IntakeCoordinator, captures: { t1_id: $.data.id } }
            - { call: "PUT /tenancies/${t1_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator, captures: { t1_status: $.data.status } }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v2: $.data.version, occ_after_first: $.data.current_occupancy } }
            - { call: "POST /tenancies", payload: { household_id: "${h2_id}", unit_id: "${u_id}", move_in_date: "2026-08-12", expected_unit_version: "${u_v2}" }, as: IntakeCoordinator, captures: { t2_id: $.data.id } }
          trigger:
            - { call: "PUT /tenancies/${t2_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "t1_status == ACTIVE — projected 4 == max_occupancy 4 is allowed (inclusive boundary)"
            - "occ_after_first == 4"
            - "err == ERR_OCCUPANCY_LIMIT_EXCEEDED with HTTP 422 — projected 5 > 4 crosses the same threshold by one person"

      - name: complaint_sla_exactly_72h_compliant
        grounds:
          - calculations.complaint_sla
          - entities.Complaint.fields.sla_breached
        distinguishing_aspect: |
          Metric: elapsed time on PUT /complaints/{id} (different metric and
          endpoint from the occupancy headcount boundary). Acknowledgement at
          exactly filed_at + 72h is compliant (strict >); one minute later
          breaches.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED; household H ELIGIBLE with 1 member; tenancy T ACTIVE"
            - "Complaints C1 and C2 both filed at clock 2026-08-01T10:00:00Z"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site SLA", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam SLA", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "SL One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: OperatorAdmin }
            - { call: "POST /complaints", payload: { tenancy_id: "${t_id}", category: "HABITABILITY", description: "C1" }, as: IntakeCoordinator, captures: { c1_id: $.data.id } }
            - { call: "POST /complaints", payload: { tenancy_id: "${t_id}", category: "UTILITY", description: "C2" }, as: IntakeCoordinator, captures: { c2_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:00:00Z" }, as: OperatorAdmin }
            - { call: "PUT /complaints/${c1_id}", payload: { status: "ACKNOWLEDGED" }, as: SiteManager, captures: { c1_breach: $.data.sla_breached } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T10:01:00Z" }, as: OperatorAdmin }
            - { call: "PUT /complaints/${c2_id}", payload: { status: "ACKNOWLEDGED" }, as: SiteManager, captures: { c2_breach: $.data.sla_breached } }
          assert:
            - "c1_breach == false — acknowledged exactly at filed_at + 72h; the SLA uses strict >"
            - "c2_breach == true — acknowledged 1 minute past the deadline"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: activation_requires_valid_certification
        grounds:
          - state_machines.Tenancy.PENDING_MOVE_IN_to_ACTIVE
          - state_machines.UnitCertification.PASSED_to_EXPIRED
          - "validations[priority=12]"
          - errors[ERR_NO_VALID_CERTIFICATION]
        distinguishing_aspect: |
          Entity pair Tenancy -> UnitCertification: advancing the clock past
          the cert's expiry_date (inspection 2026-08-01 + 180d = 2027-01-28)
          makes activation fail; the failed check lazily flips the cert
          PASSED -> EXPIRED as a side effect.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED via cert with inspection_date 2026-08-01 (expiry 2027-01-28)"
            - "Household ELIGIBLE with 1 member; tenancy PENDING_MOVE_IN (move-in 2026-08-11)"
            - "Clock then advanced to 2027-01-29 (past expiry)"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site CE", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector, captures: { cert_exp: $.data.expiry_date } }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam CE", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "CE One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-29T00:00:00Z" }, as: OperatorAdmin }
          trigger:
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /unit-certifications/${c_id}", as: ComplianceInspector, captures: { cert_status: $.data.status } }
          assert:
            - "cert_exp == 2027-01-28  (inspection_date 2026-08-01 + CERT_VALID_DAYS 180)"
            - "err == ERR_NO_VALID_CERTIFICATION — the Tenancy transition is gated on the UnitCertification's state"
            - "cert_status == EXPIRED — the failed activation lazily flips the stale PASSED cert"
            - "Tenancy.${t_id}.status remains PENDING_MOVE_IN"

      - name: inspection_conduct_requires_site_open
        grounds:
          - state_machines.RegulatoryInspection.SCHEDULED_to_CONDUCTED
          - "validations[priority=8]"
          - errors[ERR_SITE_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair RegulatoryInspection -> HousingSite (different pair from
          Tenancy -> UnitCertification): CONDUCTED is rejected while the site
          is DRAFT, then succeeds after the site reaches OPEN.
        test_recipe:
          setup:
            - "Site in DRAFT with an inspection SCHEDULED against it; later the site is brought to OPEN (window + certified unit)"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site IO", state_code: "WA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /regulatory-inspections", payload: { site_id: "${site_id}", agency: "COUNTY_HEALTH", scheduled_date: "2026-08-15" }, as: ComplianceInspector, captures: { insp_id: $.data.id } }
          trigger:
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "CONDUCTED" }, as: ComplianceInspector, captures: { err: $.data.error_id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "GET /housing-sites/${site_id}", as: OperatorAdmin, captures: { site_v2: $.data.version } }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v2}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "PUT /regulatory-inspections/${insp_id}", payload: { status: "CONDUCTED" }, as: ComplianceInspector, captures: { ok_state: $.data.status } }
          assert:
            - "err == ERR_SITE_NOT_OPEN — the inspection transition reads the parent site's state"
            - "ok_state == CONDUCTED once the site is OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: season_window_closed_interval_gap_rule
        grounds:
          - calculations.season_window_gap_check
          - "validations[priority=14]"
          - errors[ERR_SEASON_WINDOW_OVERLAP]
          - errors[ERR_SEASON_GAP_TOO_SHORT]
        distinguishing_aspect: |
          Resource HousingSite, semantics: closed intervals + mandatory
          maintenance gap. An abutting window (open == prior close) is an
          OVERLAP under closed-interval arithmetic; a 14-day gap is too short
          (must be > 14); a 15-day gap succeeds.
        test_recipe:
          setup:
            - "Site OPEN with ACTIVE window W1 [2026-08-01, 2026-11-30] (ACTIVE windows are not supersedable, so W1 participates in overlap checks)"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site SW", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W1", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin, captures: { w1_id: $.data.id } }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "GET /housing-sites/${site_id}", as: OperatorAdmin, captures: { site_v2: $.data.version } }
          trigger:
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W2", planned_open_date: "2026-11-30", planned_close_date: "2027-03-01", expected_site_version: "${site_v2}" }, as: OperatorAdmin, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W3", planned_open_date: "2026-12-14", planned_close_date: "2027-03-01", expected_site_version: "${site_v2}" }, as: OperatorAdmin, captures: { err_gap: $.data.error_id } }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "W4", planned_open_date: "2026-12-15", planned_close_date: "2027-03-01", expected_site_version: "${site_v2}" }, as: OperatorAdmin, captures: { w4_status: $.data.status } }
            - { call: "GET /season-windows/${w1_id}", as: OperatorAdmin, captures: { w1_status: $.data.status } }
          assert:
            - "err_overlap == ERR_SEASON_WINDOW_OVERLAP — 2026-11-30 is inside W1's closed interval; adjacency does not save it"
            - "err_gap == ERR_SEASON_GAP_TOO_SHORT — gap (2026-12-14 - 2026-11-30) = 14 days <= MAINTENANCE_GAP_DAYS"
            - "w4_status == PLANNED — gap of exactly 15 days is the smallest legal separation"
            - "w1_status == ACTIVE — failed creates mutate nothing and the ACTIVE window is never superseded"

      - name: pest_exclusion_closed_buffer_vs_movein
        grounds:
          - calculations.pest_exclusion_window
          - "validations[priority=11]"
          - errors[ERR_UNIT_UNDER_PEST_EXCLUSION]
          - errors[ERR_REENTRY_BUFFER_ACTIVE]
        distinguishing_aspect: |
          Resource HousingUnit, semantics: closed exclusion interval PLUS a
          re-entry buffer (different interval arithmetic from the season
          window's gap rule, and a different resource). move_in on the
          exclusion end date (2026-08-13) is rejected; move_in one day later
          (2026-08-14) is allowed; clearing the treatment on the buffer end
          date itself is rejected.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED (max 4); pest treatment applied at clock 2026-08-10 with reentry_buffer_days 3 -> exclusion [2026-08-10, 2026-08-13]"
            - "Households H1 and H2, each ELIGIBLE with 1 member"
            - "T1 (H1) move_in 2026-08-13 and T2 (H2) move_in 2026-08-14, both PENDING_MOVE_IN"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site PX", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam P1", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { h1_id: $.data.id } }
            - { call: "PUT /households/${h1_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h1_id}", full_name: "P1", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /households", payload: { head_of_household_name: "Fam P2", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { h2_id: $.data.id } }
            - { call: "PUT /households/${h2_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${h2_id}", full_name: "P2", date_of_birth: "1991-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /pest-treatments", payload: { unit_id: "${u_id}", treatment_type: "FUMIGATION", scheduled_date: "2026-08-10", reentry_buffer_days: 3 }, as: SiteManager, captures: { pt_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: OperatorAdmin }
            - { call: "PUT /pest-treatments/${pt_id}", payload: { status: "APPLIED" }, as: SiteManager, captures: { excl_end: $.data.exclusion_end_date } }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v1: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${h1_id}", unit_id: "${u_id}", move_in_date: "2026-08-13", expected_unit_version: "${u_v1}" }, as: IntakeCoordinator, captures: { t1_id: $.data.id } }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v2: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${h2_id}", unit_id: "${u_id}", move_in_date: "2026-08-14", expected_unit_version: "${u_v2}" }, as: IntakeCoordinator, captures: { t2_id: $.data.id } }
          trigger:
            - { call: "PUT /tenancies/${t1_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator, captures: { err1: $.data.error_id } }
            - { call: "PUT /tenancies/${t2_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator, captures: { t2_status: $.data.status } }
            - { call: "PUT /pest-treatments/${pt_id}", payload: { status: "CLEARED" }, as: SiteManager, captures: { err_clear: $.data.error_id } }
          assert:
            - "excl_end == 2026-08-13  (applied 2026-08-10 + 3 buffer days, closed interval)"
            - "err1 == ERR_UNIT_UNDER_PEST_EXCLUSION — move_in on the exclusion end date is still excluded (closed semantics)"
            - "t2_status == ACTIVE — move_in 2026-08-14 > exclusion end is the first legal day"
            - "err_clear == ERR_REENTRY_BUFFER_ACTIVE — clock 2026-08-10 is not > exclusion_end 2026-08-13"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ledger_post_void_balance_invariant
        grounds:
          - calculations.delinquency_chronological_walk
          - state_machines.ChargeLedgerEntry.POSTED_to_VOIDED
          - entities.Tenancy.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: money (Tenancy.balance_cents). Posting a RENT
          charge of 90000 then voiding it must return the balance to exactly
          its pre-post value (60968) — no drift from the post/void roundtrip.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED; household ELIGIBLE with 1 member (income 6000000); tenancy ACTIVE, balance 60968 after move-in proration"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site LI", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam LI", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "LI One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "GET /tenancies/${t_id}/statement", as: OperatorAdmin, captures: { bal_before: $.data.balance_cents } }
          trigger:
            - { call: "POST /charge-ledger-entries", payload: { tenancy_id: "${t_id}", entry_type: "RENT", amount_cents: 90000, description: "September rent posted in error" }, as: OperatorAdmin, captures: { e_id: $.data.id } }
            - { call: "GET /tenancies/${t_id}/statement", as: OperatorAdmin, captures: { bal_mid: $.data.balance_cents } }
            - { call: "POST /charge-ledger-entries/${e_id}/void", payload: { void_reason: "duplicate posting" }, as: OperatorAdmin, captures: { e_status: $.data.status } }
            - { call: "GET /tenancies/${t_id}/statement", as: OperatorAdmin, captures: { bal_after: $.data.balance_cents } }
          assert:
            - "bal_before == 60968"
            - "bal_mid == 150968  (60968 + 90000)"
            - "e_status == VOIDED"
            - "bal_after == 60968 == bal_before — post + void conserves the ledger balance exactly"

      - name: occupancy_activate_terminate_roundtrip_invariant
        grounds:
          - calculations.occupancy_headcount_check
          - state_machines.Tenancy.PENDING_MOVE_IN_to_ACTIVE
          - state_machines.Tenancy.ACTIVE_to_TERMINATED
          - entities.HousingUnit.fields.current_occupancy
        distinguishing_aspect: |
          Conserved quantity: people (HousingUnit.current_occupancy), a
          different quantity from ledger cents. An activate -> terminate
          roundtrip for a 3-member household must return occupancy to exactly
          0 and the unit to CERTIFIED.
        test_recipe:
          setup:
            - "Site OPEN; unit CERTIFIED (max 4), occupancy 0"
            - "Household ELIGIBLE with 3 members; tenancy PENDING_MOVE_IN (move-in 2026-08-11)"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site OI", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam OI", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "OI 1", date_of_birth: "1980-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "OI 2", date_of_birth: "1981-01-01", relationship: "SPOUSE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "OI 3", date_of_birth: "2011-01-01", relationship: "CHILD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version, occ_before: $.data.current_occupancy } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
          trigger:
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { occ_mid: $.data.current_occupancy, status_mid: $.data.status } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "TERMINATED", move_out_date: "2026-08-20" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { occ_after: $.data.current_occupancy, status_after: $.data.status } }
          assert:
            - "occ_before == 0"
            - "occ_mid == 3 and status_mid == OCCUPIED"
            - "occ_after == 0 == occ_before — the activate/terminate roundtrip conserves headcount"
            - "status_after == CERTIFIED — the last tenancy's termination returns the unit to CERTIFIED"
