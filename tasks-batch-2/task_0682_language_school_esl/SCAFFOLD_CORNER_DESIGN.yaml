scaffold_corner_design:

  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_student_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Student.fields.email, entities.Student.fields.track]
        distinguishing_aspect: "POST /students with full_name + email returns 201 and a Student whose id, created_at, version are system-minted; visa_status defaults NONE, certification_status NONE, track defaults GENERAL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "New Stu", email: "new@x.com" }
              as: Registrar
              captures: { sid: $.data.id, ver: $.data.version }
          assert:
            - "Student.full_name == 'New Stu'"
            - "Student.visa_status == NONE"
            - "Student.certification_status == NONE"
            - "Student.track == GENERAL"
            - "Student.version == 1"

      - name: get_student_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Student.fields.full_name]
        distinguishing_aspect: "GET /students/{id} returns the Student created earlier with matching full_name and email."
        test_recipe:
          setup: ["One student exists."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Read Me", email: "read@x.com" }
              as: Registrar
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /students/${sid}"
              payload: {}
              as: Registrar
              captures: { nm: $.data.full_name }
          assert:
            - "Student.${sid}.full_name == 'Read Me'"

      - name: list_cohorts_returns_paginated_envelope
        claim_type: Listing
        grounds: [entities.Cohort.fields.level]
        distinguishing_aspect: "GET /cohorts returns response_type array with pagination fields total_count and has_more in meta/data per §1.0."
        test_recipe:
          setup: ["Two cohorts exist."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "L1", level: "A1", track: "GENERAL", capacity: 5, weekly_hours: 9, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
            - call: "POST /cohorts"
              payload: { name: "L2", level: "A2", track: "GENERAL", capacity: 5, weekly_hours: 9, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "AFTERNOON" }
              as: Registrar
          trigger:
            - call: "GET /cohorts"
              payload: { limit: 1, offset: 0 }
              as: Registrar
          assert:
            - "response.total_count == 2"
            - "response.has_more == true"
            - "len(response.data) == 1"

      - name: get_student_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /students/{id} with a non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /students/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_NOT_FOUND"

      - name: create_student_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Student.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /students omitting required email returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "No Email" }
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_REQUEST"

      - name: create_cohort_invalid_enum_level_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Cohort.fields.level
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cohorts with level outside {A1..C2} returns ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cohorts"
              payload: { name: "Bad", level: "Z9", track: "GENERAL", capacity: 5, weekly_hours: 9, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_REQUEST"

      - name: student_track_default_applied_when_omitted
        claim_type: Defaults
        grounds: [entities.Student.fields.track]
        distinguishing_aspect: "POST /students omitting track yields track == GENERAL (default)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "Def", email: "def@x.com" }
              as: Registrar
              captures: { tk: $.data.track }
          assert:
            - "Student.track == GENERAL"

      - name: student_placement_level_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Student.fields.placement_level, calculations.placement_band]
        distinguishing_aspect: "placement_level is computed only by a scored PlacementTest; on student create it is null even though it is not an accepted input field (any attempt to set it is ignored)."
        test_recipe:
          setup: ["A student with no scored test."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "NoLvl", email: "nolvl@x.com" }
              as: Registrar
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /students/${sid}"
              payload: {}
              as: Registrar
              captures: { lvl: $.data.placement_level }
          assert:
            - "Student.${sid}.placement_level == null"

      - name: student_sponsor_unknown_contract_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Student.fields.corporate_contract_id
          - errors[ERR_CONTRACT_REQUIRED_FOR_SPONSOR]
        distinguishing_aspect: "POST /students with a corporate_contract_id that does not reference an existing contract returns ERR_CONTRACT_REQUIRED_FOR_SPONSOR 404."
        test_recipe:
          setup: ["Empty DB; no contracts."]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "Orphan", email: "orphan@x.com", corporate_contract_id: "00000000-0000-0000-0000-000000000000" }
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_CONTRACT_REQUIRED_FOR_SPONSOR"

      - name: attendance_record_is_immutable_no_version
        claim_type: Immutability
        grounds: [entities.AttendanceRecord.fields.session_index]
        distinguishing_aspect: "AttendanceRecord has common_fields:false — its create response carries id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup: ["An ENROLLED enrollment exists."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "AttC", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Att S", email: "atts@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { eid2: $.data.id }
            - call: "POST /enrollments/${eid2}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
          trigger:
            - call: "POST /attendance"
              payload: { enrollment_id: "${eid2}", session_index: 1, status: "PRESENT" }
              as: Instructor
              captures: { arid: $.data.id }
          assert:
            - "AttendanceRecord.id != null"
            - "AttendanceRecord has no version field"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: score_already_scored_test_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlacementTest.REGISTERED_to_SCORED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Scoring a PlacementTest already in SCORED returns ERR_INVALID_STATE; no level change."
        test_recipe:
          setup: ["A scored placement test."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Sc S", email: "scs@x.com" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
          trigger:
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 80 }
              as: Instructor
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_STATE"

      - name: new_enrollment_starts_in_placement_pending
        claim_type: Initial State
        grounds: [state_machines.Enrollment.initial_state]
        distinguishing_aspect: "A freshly created Enrollment starts in PLACEMENT_PENDING."
        test_recipe:
          setup: ["A student and cohort exist."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "IC", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /students"
              payload: { full_name: "IS", email: "is@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { st: $.data.status }
          assert:
            - "Enrollment.status == PLACEMENT_PENDING"

      - name: withdraw_from_completed_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Enrollment.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Withdrawing a COMPLETED (terminal) enrollment returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED enrollment (term ended, attendance + progress report present)."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "TC", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 9, term_start: "2026-04-01T00:00:00Z", term_end: "2026-04-10T00:00:00Z", total_sessions: 10, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "TS", email: "ts@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
            - call: "POST /attendance"
              payload: { enrollment_id: "${enr}", session_index: 1, status: "PRESENT" }
              as: Instructor
            - call: "POST /progress-reports"
              payload: { enrollment_id: "${enr}", speaking: 80, listening: 80, reading: 80, writing: 80 }
              as: Instructor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: Registrar
            - call: "POST /enrollments/${enr}/complete"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: {}
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_STATE"

      - name: issue_i20_for_non_international_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Student.NONE_to_INITIAL
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /students/{id}/issue-i20 for a non-international student (is_international false) violates the precondition and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A domestic (non-international) student."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Dom", email: "dom@x.com", is_international: false }
              as: Registrar
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /students/${sid}/issue-i20"
              payload: {}
              as: DSO
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_STATE"

      - name: terminate_status_cascades_void_certification
        claim_type: Cross-entity
        grounds: [state_machines.Student.PROBATION_to_TERMINATED, entities.Student.fields.certification_status]
        distinguishing_aspect: "Terminating an international student in PROBATION who held PROVISIONAL certification sets certification_status to VOIDED (cross-entity side effect on the same Student)."
        test_recipe:
          setup: ["International student with one COMPLETED enrollment (PROVISIONAL cert), I-20 issued, currently PROBATION."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Term S", email: "terms@x.com", track: "GENERAL", is_international: true }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /students/${sid}/issue-i20"
              payload: {}
              as: DSO
            - call: "POST /cohorts"
              payload: { name: "Term C", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-04-01T00:00:00Z", term_end: "2026-04-10T00:00:00Z", total_sessions: 10, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
            - call: "POST /students/${sid}/activate-status"
              payload: {}
              as: DSO
            - call: "POST /attendance"
              payload: { enrollment_id: "${enr}", session_index: 1, status: "PRESENT" }
              as: Instructor
            - call: "POST /progress-reports"
              payload: { enrollment_id: "${enr}", speaking: 80, listening: 80, reading: 80, writing: 80 }
              as: Instructor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: Registrar
            - call: "POST /enrollments/${enr}/complete"
              payload: {}
              as: Registrar
            - call: "POST /students/${sid}/place-probation"
              payload: { reason: "post-completion review" }
              as: DSO
          trigger:
            - call: "POST /students/${sid}/terminate-status"
              payload: { reason: "visa violation" }
              as: DSO
              captures: { cs: $.data.certification_status, vs: $.data.visa_status }
          assert:
            - "Student.${sid}.visa_status == TERMINATED"
            - "Student.${sid}.certification_status == VOIDED"

      - name: cancel_addon_after_enrollment_terminal_returns_invalid_state
        claim_type: Conditional cascade
        grounds:
          - state_machines.AddOnSubscription.ACTIVE_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an add-on whose parent Enrollment is WITHDRAWN (terminal) violates the precondition and returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A self-pay student, ACTIVE add-on on an enrollment that is later withdrawn."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "AOC", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "AO S", email: "aos@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /add-ons"
              payload: { student_id: "${sid}", enrollment_id: "${enr}", add_on_type: "CONVERSATION_CLUB", units: 4 }
              as: Student
              as_user_id: "${sid}"
              captures: { aoid: $.data.id }
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
            - call: "POST /enrollments/${enr}/withdraw"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /add-ons/${aoid}/cancel"
              payload: {}
              as: Student
              as_user_id: "${sid}"
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_INVALID_STATE"

  # =================================================================
  # Calculations
  # =================================================================
  - section: calculations
    instances:
      - name: placement_band_boundary_raw60_yields_b2
        claim_type: Correct Result
        grounds: [calculations.placement_band, entities.PlacementTest.fields.assigned_level]
        distinguishing_aspect: "raw_score exactly 60 yields assigned_level B2 (>= boundary), while 59 would yield B1."
        test_recipe:
          setup: ["A registered placement test."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Band S", email: "bands@x.com" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
          trigger:
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 60 }
              as: Instructor
              captures: { lvl: $.data.assigned_level }
          assert:
            - "PlacementTest.${ptid}.assigned_level == B2"
            - "PlacementTest.${ptid}.status == SCORED"

      - name: addon_immersion_no_surcharge_at_two_weeks
        claim_type: Correct Result
        grounds: [calculations.addon_fee, entities.AddOnSubscription.fields.fee_cents]
        distinguishing_aspect: "IMMERSION_ABROAD units 2 yields fee_cents 80000 with zero surcharge (units > 2 boundary not crossed)."
        test_recipe:
          setup: ["A self-pay student with a PLACEMENT_PENDING enrollment."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "Imm2", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Imm S", email: "imms@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
          trigger:
            - call: "POST /add-ons"
              payload: { student_id: "${sid}", enrollment_id: "${enr}", add_on_type: "IMMERSION_ABROAD", units: 2 }
              as: Registrar
              captures: { fee: $.data.fee_cents }
          assert:
            - "AddOnSubscription.fee_cents == 80000"

      - name: refund_full_in_week_zero
        claim_type: Constants Applied
        grounds: [calculations.withdrawal_refund, entities.Enrollment.fields.refund_cents]
        distinguishing_aspect: "Withdrawal in week 0 (clock < term_start + 7 days) applies PCT_W0 = 1.00, refund_cents == tuition_invoice_cents == 100000."
        test_recipe:
          setup: ["Self-pay student ENROLLED into base 100000 cohort term_start 2026-05-04; clock at 2026-05-07 (week 0)."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "RW0", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "RW0 S", email: "rw0@x.com", track: "GENERAL" }
              as: Registrar
              captures: { sid: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${sid}" }
              as: Registrar
              captures: { ptid: $.data.id }
            - call: "POST /placement-tests/${ptid}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${sid}", cohort_id: "${cid}" }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/confirm"
              payload: { expected_cohort_version: "${cv}", require_seat: true }
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-07T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: {}
              as: Registrar
              captures: { rf: $.data.refund_cents }
          assert:
            - "Enrollment.${enr}.refund_cents == 100000"

      - name: tuition_silver_discount_rounding_half_up
