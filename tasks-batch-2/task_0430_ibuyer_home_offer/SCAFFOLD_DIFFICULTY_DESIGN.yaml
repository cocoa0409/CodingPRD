# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules × 2 instances = 18 instances. Every grounds[] resolves into
# SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls / trigger chain is executable
# from empty-DB using only §1.5 endpoints. All formula-derived asserts are
# literals pre-computed against §1.3 formulas + constants_reference.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: net_proceeds_provisional_vs_final_diverge_on_transaction
        grounds:
          - calculations.preliminary_net_proceeds
          - calculations.final_net_proceeds
          - entities.Offer.fields.preliminary_net_proceeds
          - entities.Transaction.fields.final_net_proceeds
          - state_machines.Transaction.PENDING_ASSESSMENT_to_SCHEDULED
        distinguishing_aspect: "Same property AVM yields Offer.preliminary_net_proceeds=479400.00 (repair=0, leaseback=0, concession=1% estimate) but Transaction.final_net_proceeds=470215.43 once the FINALIZED assessment's real repair credit and negotiated concession apply — a divergence on the Offer-vs-Transaction domain pair, not a repeat of the same shape."
        test_recipe:
          setup:
            - "Seller registered; Property registered with comp_median_value=500000, market_trend_pct=0.02 -> avm_value=510000."
            - "Offer issued (preliminary_net_proceeds=479400.00), accepted -> Transaction(PENDING_ASSESSMENT) + Assessment(DRAFT)."
            - "Three repair line items (1234.567, 899.991, 4500.005) added; assessment FINALIZED; close scheduled with no leaseback, final_concession=7650.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s1@x.com", full_name: "S One", payout_method: "ACH" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "1 Main", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "ROOF", estimate_amount: 1234.567 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "HVAC", estimate_amount: 899.991 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "FOUNDATION", estimate_amount: 4500.005 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "FAIR", foundation_condition: "GOOD" }
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 7650.00 }
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "Offer.${offer_id}.preliminary_net_proceeds == 479400.00"
            - "Transaction.${txn_id}.final_net_proceeds == 470215.43"
            - "Transaction.${txn_id}.final_net_proceeds != Offer.${offer_id}.preliminary_net_proceeds"
            - "Transaction.${txn_id}.repair_credit == 6634.57"

      - name: resale_spread_projected_vs_net_diverge_on_resale
        grounds:
          - calculations.resale_spread
          - entities.Resale.fields.projected_spread
          - entities.Resale.fields.net_spread
          - state_machines.Resale.LISTED_to_SOLD
        distinguishing_aspect: "On the Resale entity (a different domain than net-proceeds), projected_spread=26565.43 keyed off list_price=560000 diverges from net_spread=21715.43 keyed off the lower sold_price=555000 — same commission formula, two price inputs, two results."
        test_recipe:
          setup:
            - "A property is acquired and CLOSED with acquisition AVM=510000 (no re-trade) and repair_credit=6634.57."
            - "Resale listed at list_price=560000 (projected_spread computed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s2@x.com", full_name: "S Two" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "2 Main", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "ROOF", estimate_amount: 1234.567 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "HVAC", estimate_amount: 899.991 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "FOUNDATION", estimate_amount: 4500.005 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "FAIR", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 7650.00 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/close"
              payload: {}
              as: OperationsAdmin
            - call: "POST /resales"
              payload: { transaction_id: "${txn_id}", list_price: 560000, resale_commission_pct: 0.03 }
              as: PricingAnalyst
              captures: { resale_id: $.data.id }
          trigger:
            - call: "POST /resales/${resale_id}/sell"
              payload: { sold_price: 555000 }
              as: OperationsAdmin
          assert:
            - "Resale.${resale_id}.projected_spread == 26565.43"
            - "Resale.${resale_id}.net_spread == 21715.43"
            - "Resale.${resale_id}.net_spread != Resale.${resale_id}.projected_spread"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: repair_credit_round_per_line_then_sum_mode_b
        grounds:
          - calculations.repair_credit_aggregation
          - entities.RepairLineItem.fields.rounded_amount
          - entities.Transaction.fields.repair_credit
        distinguishing_aspect: "Mode (b) nested rounding where order matters: round-per-line-then-sum yields repair_credit=6634.57, while sum-then-round yields 6634.56; the scaffold pins round-per-line first, so the one-cent divergence is the test."
        test_recipe:
          setup:
            - "Accepted offer -> Transaction(PENDING_ASSESSMENT) + Assessment(DRAFT); three repair line items 1234.567, 899.991, 4500.005."
            - "Assessment FINALIZED, close scheduled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s3@x.com", full_name: "S Three" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "3 Main", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "ROOF", estimate_amount: 1234.567 }
              as: OperationsAdmin
              captures: { line1: $.data.rounded_amount }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "HVAC", estimate_amount: 899.991 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "FOUNDATION", estimate_amount: 4500.005 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "RepairLineItem first line rounded_amount == 1234.57"
            - "Transaction.${txn_id}.repair_credit == 6634.57"

      - name: final_net_proceeds_nonlinear_effective_avm_branch_mode_a
        grounds:
          - calculations.final_net_proceeds
          - calculations.leaseback_charge
          - entities.Transaction.fields.final_net_proceeds
          - state_machines.Transaction.INSPECTION_to_INSPECTION
        distinguishing_aspect: "Mode (a) formula with >=3 inputs and a conditional branch on entity state: final_net_proceeds selects effective_avm = revised_avm_value when a re-trade applied else avm_value_snapshot, then combines service_fee_eff, repair_credit, final_concession, leaseback_total — yielding 456823.43 after a 12000 re-trade with 10 leaseback days; distinct mode from the round-order instance (b)."
        test_recipe:
          setup:
            - "Accepted offer -> Transaction; repair_credit=6634.57; close scheduled with leaseback_days=10 and final_concession=7650.00."
            - "Inspection started; re-trade of 12000 applied -> revised_avm_value=498000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s4@x.com", full_name: "S Four" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "4 Main", zip_code: "90001", bedrooms: 4, living_area_sqft: 2200, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "ROOF", estimate_amount: 1234.567 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "HVAC", estimate_amount: 899.991 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "FOUNDATION", estimate_amount: 4500.005 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "FAIR", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 10, final_concession: 7650.00 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/retrade"
              payload: { retrade_amount: 12000, retrade_reason: "roof beyond estimate" }
              as: PricingAnalyst
          assert:
            - "Transaction.${txn_id}.retrade_amount == 12000"
            - "Transaction.${txn_id}.leaseback_daily_rate == 199.20"
            - "Transaction.${txn_id}.leaseback_total == 1992.00"
            - "Transaction.${txn_id}.final_net_proceeds == 456823.43"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transaction_branches_inspection_self_loop_retrade
        grounds:
          - state_machines.Transaction.INSPECTION_to_INSPECTION
          - state_machines.Transaction.INSPECTION_to_CLOSED
          - state_machines.Transaction.INSPECTION_to_CANCELLED
        distinguishing_aspect: "Transaction is non-linear: from INSPECTION it forks to a self-loop (retrade), CLOSED, or CANCELLED with divergent side-effect sets (retrade mutates revised_avm; cancel reverts it) — a branch/cycle on the Transaction entity."
        test_recipe:
          setup:
            - "Transaction reaches INSPECTION with no re-trade applied (retrade_amount=0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s5@x.com", full_name: "S Five" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "5 Main", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/retrade"
              payload: { retrade_amount: 5000 }
              as: PricingAnalyst
              captures: { txn_status: $.data.status }
          assert:
            - "Transaction.${txn_id}.status == INSPECTION"
            - "Transaction.${txn_id}.retrade_amount == 5000"
            - "Property revised_avm_value == 505000.00"

      - name: property_branches_under_offer_to_in_transaction_or_withdrawn
        grounds:
          - state_machines.Property.UNDER_OFFER_to_IN_TRANSACTION
          - state_machines.Property.UNDER_OFFER_to_WITHDRAWN
          - state_machines.Property.UNDER_OFFER_to_UNDER_OFFER
        distinguishing_aspect: "Property (a different entity than Transaction) branches from UNDER_OFFER: accept -> IN_TRANSACTION, withdraw -> WITHDRAWN, or re-issue self-loop UNDER_OFFER->UNDER_OFFER — divergent terminal vs continuing paths off one state."
        test_recipe:
          setup:
            - "Property is UNDER_OFFER with an ISSUED active offer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s6@x.com", full_name: "S Six" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "6 Main", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /properties/${prop_id}/withdraw"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "Property.${prop_id}.status == WITHDRAWN"
            - "Property.${prop_id}.active_offer_id == null"
            - "Offer.${offer_id}.status == DECLINED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: retrade_cascade_depth3_avm_fee_proceeds
        grounds:
          - state_machines.Transaction.INSPECTION_to_INSPECTION
          - calculations.avm_valuation
          - calculations.final_net_proceeds
          - entities.Property.fields.revised_avm_value
          - entities.Transaction.fields.final_net_proceeds
        distinguishing_aspect: "Depth-3 cascade: retrade mutates Property.revised_avm_value (A->B); the new revised AVM forces recompute of Transaction.service_fee_eff (B->C); the recomputed fee forces recompute of Transaction.final_net_proceeds (C->D) — each link caused by the prior, not the original trigger."
        test_recipe:
          setup:
            - "Transaction at INSPECTION with leaseback_days=10, final_concession=7650.00, repair_credit=6634.57, no prior re-trade."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s7@x.com", full_name: "S Seven" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "7 Main", zip_code: "90001", bedrooms: 4, living_area_sqft: 2200, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "ROOF", estimate_amount: 1234.567 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "HVAC", estimate_amount: 899.991 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/repair-line-items"
              payload: { category: "FOUNDATION", estimate_amount: 4500.005 }
              as: OperationsAdmin
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "FAIR", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 10, final_concession: 7650.00 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/retrade"
              payload: { retrade_amount: 12000 }
              as: PricingAnalyst
          assert:
            - "Property.${prop_id}.revised_avm_value == 498000.00"
            - "Transaction.${txn_id}.final_net_proceeds == 456823.43"
            - "Transaction.${txn_id}.leaseback_daily_rate == 199.20"

      - name: accept_cascade_depth2_offer_property_spawn_transaction
        grounds:
          - state_machines.Offer.ISSUED_to_ACCEPTED
          - state_machines.Property.UNDER_OFFER_to_IN_TRANSACTION
          - entities.Transaction.fields.status
        distinguishing_aspect: "Depth-2 cascade from a different trigger (accept, not retrade): accepting the Offer transitions it to ACCEPTED (A->B); that acceptance transitions Property to IN_TRANSACTION and the same step spawns the Transaction(PENDING_ASSESSMENT) (B->C) — distinct propagation origin from the retrade cascade."
        test_recipe:
          setup:
            - "Property UNDER_OFFER with an ISSUED active offer; clock before expiry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s8@x.com", full_name: "S Eight" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "8 Main", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id, txn_status: $.data.status }
          assert:
            - "Offer.${offer_id}.status == ACCEPTED"
            - "Property.${prop_id}.status == IN_TRANSACTION"
            - "Transaction.${txn_id}.status == PENDING_ASSESSMENT"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expired_offer_beats_not_owner_state_vs_temporal
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_OFFER_EXPIRED]
        distinguishing_aspect: "Ownership check (priority 4, category state, ERR_NOT_RESOURCE_OWNER) outranks the offer-expiry check (priority 6, category business_temporal, ERR_OFFER_EXPIRED): a non-owner accepting an expired offer gets ERR_NOT_RESOURCE_OWNER — a state-vs-temporal category pair."
