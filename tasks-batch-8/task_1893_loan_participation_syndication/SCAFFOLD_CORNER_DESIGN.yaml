      - name: agent_cannot_cast_vote_forbidden
        claim_type: rbac_exclusive_denial
        grounds: ['roles[ParticipantLender]', 'errors[ERR_FORBIDDEN_FOR_ROLE]']
        distinguishing_aspect: "Vote casting is ParticipantLender-exclusive; AgentBank caller -> 403 (the agent administers but never votes)."
        test_recipe:
          setup: ["funded facility; solicitation SOLICITING"]
          setup_api_calls:
            - { call: "POST /api/borrowers", payload: { legal_name: "AV B", sector: "OTHER", risk_rating: "CROSSOVER" }, as: AgentBank, captures: { b_id: $.data.id } }
