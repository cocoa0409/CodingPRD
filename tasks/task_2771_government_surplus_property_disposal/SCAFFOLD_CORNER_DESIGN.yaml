              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { v1: "$.data.id" }
          trigger:
            - call: "POST /auction-lots"
              payload: { asset_id: "${a_at}", venue_id: "${v1}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-03T00:00:00Z" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { err: "$.data.error_id" }
            - call: "POST /auction-lots"
              payload: { asset_id: "${a_below}", venue_id: "${v1}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-03T00:00:00Z" }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { lot_below: "$.data.id" }
            - call: "POST /screening-cycles"
              payload: { asset_id: "${a_below}", opens_at: "2026-08-01T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
