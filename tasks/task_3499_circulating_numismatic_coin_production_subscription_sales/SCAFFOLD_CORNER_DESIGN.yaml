      - name: billing_cycle_on_cancelled_subscription_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Subscription", "errors[ERR_SUBSCRIPTION_NOT_ACTIVE]"]
        distinguishing_aspect: "billing-cycle with a FRESH OCC version on a CANCELLED subscription fails ERR_SUBSCRIPTION_NOT_ACTIVE (the state gate, not OCC, fires)."
        test_recipe:
          setup: ["subscription cancelled immediately after creation"]
          setup_api_calls:
